name: 'T1563: Remote Service Session Hijacking'
id: d6497050-098c-415a-a9e9-4234d7c20522
description: 'Investigate potential Remote Service Session Hijacking, in which an adversary takes control
  of a preexisting remote-service session (RDP, SSH, Telnet, VNC, screen/tmux) to move laterally rather
  than authenticating anew. This playbook helps an analyst hunt for the authentication-decoupling invariant
  central to this technique: commands, processes, and network activity that occur inside an interactive
  session without a corresponding successful logon for that source or credential. It covers Windows tradecraft
  such as tscon.exe session redirection (Korznikov), RDP shadowing/ServiceDll tampering, and known hijacking
  tooling (Mimikatz ts::sessions/sekurlsa::logonpasswords, SessionGopher), as well as RDP session reconnect/unlock
  events (4779/4801) whose source IP, ASN, or country diverges from the session''s original connection.
  On Linux/macOS it covers SSH/Telnet/PTY hijacking, screen/tmux attach, SSH agent/ControlMaster socket
  reuse, and SSH sessions whose traffic profile shifts from interactive shell to bulk transfer or tunneling.
  Each question pairs a deterministic detection floor with statistical baselining and machine-learning
  approaches so the analyst can confirm or refute hijacking with explainable, prioritized evidence.'
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any host execute a known remote-session-hijacking tool, identified by process name, original
    file name, file hash, or command-line arguments characteristic of session hijacking?
  context: Deterministic floor for Windows session hijacking under Lateral Movement. The analyst hunts
    process-creation events (4688 / Sysmon 1) whose ProcessName, OriginalFileName, or FileHash matches
    a watchlist of hijacking tooling - Mimikatz with 'ts::sessions' or 'sekurlsa::logonpasswords', SessionGopher,
    or PsExec spawning tscon.exe as SYSTEM. A positive match strongly attributes the activity to session-hijacking
    tradecraft ([0-day or Feature? RDP Session Hijacking via tscon (Korznikov)](http://www.korznikov.com/2017/03/0-day-or-feature-privilege-escalation.html);
    [Suspicious RDP Redirect Using TSCON Sigma rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_tscon_rdp_redirect.yml)).
    Because these tools let an attacker commandeer an existing logon session to pivot to other systems,
    a hit on a Domain Controller, member server, PAW, or terminal server demands immediate triage. Tune
    the watchlist; do not delete thresholds.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, Multi-user systems like
    terminal servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EventID IN (4688, 1)\nAND (\n  lower(ProcessName) IN ('mimikatz.exe','sessiongopher.exe')\n\
      \  OR OriginalFileName IN watchlist_hijack_tools\n  OR FileHash IN watchlist_hijack_hashes\n  OR\
      \ CommandLine MATCHES '(ts::sessions|sekurlsa::logonpasswords)'\n  OR (lower(ParentImage) LIKE '%psexe%'\
      \ AND lower(ProcessName)='tscon.exe')\n)\n-> alert(severity=high, host, user, CommandLine)"
- question: Are there process names on any host that are extremely rare across the enterprise or executing
    far more frequently than that host's own history, suggesting hijacking tooling that evades a static
    watchlist?
  context: 'Statistical complement to the watchlist. For each host and enterprise-wide, baseline process
    names from 4688 and compute prevalence (fraction of endpoints that ever ran it) and per-host daily
    execution frequency. Alert on volume/frequency outliers: enterprise prevalence below 0.1% of endpoints,
    OR per-host daily count above the 99th percentile of its own history. This surfaces renamed or novel
    hijacking utilities that a signature would miss. Rare-edge baselining follows [Authentication graphs,
    Kent et al](https://doi.org/10.1016/j.cose.2014.09.001). Derive the 0.1% cutoff from your own fleet
    size; a rare binary appearing on a multi-user terminal server or jump box is especially suspicious
    for lateral movement.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, Multi-user systems like
    terminal servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = stats over 90d by ProcessName:\n  prevalence = distinct_count(host where ran) /\
      \ total_hosts\n  per_host_daily = count by host, day\nalert where prevalence < 0.001\n  OR per_host_daily\
      \ > p99(per_host_daily for that ProcessName/host)"
- question: Does a supervised model classify a process-creation event as session-hijacking activity based
    on command-line entropy, parent process, integrity/user context, and rarity of the parent-child relationship?
  context: 'Machine-learning layer for ambiguous executions. Train a Random Forest / Gradient Boosting
    classifier on labeled 4688 data using features: command-line length and Shannon entropy, parent process
    name, integrity/user context (SYSTEM vs interactive), and rarity of the parent-child pair; add sequence
    context from [Hopper, Ho et al](https://www.usenix.org/system/files/sec21-ho.pdf). A SYSTEM-context
    tscon.exe with parent services.exe is a classic passwordless hijack. The alert MUST list the top-3
    contributing features (e.g., ''parent=services.exe'', ''context=SYSTEM'', ''rare child tscon.exe'')
    for explainable triage rather than a bare score, so analysts can validate the lateral-movement hypothesis.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, Multi-user systems like
    terminal servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [cmdline_len, cmdline_entropy, parent_image,\n           integrity_level, user_context,\
      \ parent_child_rarity]\nscore = rf_model.predict_proba(features)\nif score > threshold:\n  alert(top3_feature_importances(features))"
- question: 'Was tscon.exe executed with a numeric session ID and a /dest: switch (e.g., /dest:console
    or /dest:rdp-tcp#), indicating a redirect into another user''s active session, and was RDP shadowing
    or sensitive RDP registry settings altered?'
  context: Direct detection of the [Korznikov](http://www.korznikov.com/2017/03/0-day-or-feature-privilege-escalation.html)
    tscon hijack and RDP shadowing tampering on multi-user servers, jump boxes, and DCs. Alert on any
    4688 for tscon.exe whose command line contains a numeric session ID plus '/dest:' per the production
    [Suspicious RDP Redirect Using TSCON Sigma rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_tscon_rdp_redirect.yml).
    Raise severity when tscon's parent is a service/SYSTEM context (passwordless hijack) or when preceded
    within 5 minutes by 'query user'/'quser.exe'/'qwinsta.exe' from the same user/host (enumerate-then-hijack
    pattern). Also alert on RDP shadowing/ServiceDll enablement and SecurityLayer downgrade via the [RDP
    Sensitive Settings Changed Sigma rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_terminal_server_tampering.yml).
    A positive result is high-confidence lateral movement via session takeover.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Multi-user servers (e.g., Terminal Servers, Citrix hosts), Domain Controllers, Jump Boxes'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID=4688 AND lower(ProcessName)=''tscon.exe''

      AND CommandLine MATCHES ''[0-9]+ */dest:(rdp-tcp#|console)''

      -> alert(severity = (ParentUser=''SYSTEM'' ? critical : high))

      ENRICH: preceded_by(quser|qwinsta|''query user'') within 5m by same user/host

      ALSO registry_set on (Shadow|ServiceDll|fAllowUnsolicited|SecurityLayer) -> alert'
- question: Is tscon.exe being run by accounts outside the administrator group, or at a frequency that
    deviates from an admin's own baseline, or repeatedly via qwinsta->tscon transitions within a single
    session?
  context: Statistical baselining of legitimate tscon use per user role. Build per-role baselines of tscon.exe
    usage. Alert if tscon is executed by any account not in a predefined administrator group, if an admin's
    per-host count exceeds the 99th percentile of their own history, or if a qwinsta->tscon transition
    recurs more than once per session. Non-admin tscon use is a strong lateral-movement indicator because
    legitimate session redirection is overwhelmingly an administrative action. Per-user rarity baselining
    follows [Kent et al](https://doi.org/10.1016/j.cose.2014.09.001).
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Multi-user servers (e.g., Terminal Servers, Citrix hosts), Domain Controllers, Jump Boxes'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline tscon usage by user, role over 90d\nalert where user NOT IN admin_group\n  OR per_host_count(admin)\
      \ > p99(own_history)\n  OR count(qwinsta->tscon transitions per session) > 1"
- question: Does a per-user command-sequence model assign low probability to a transition such as qwinsta
    -> tscon /dest:, indicating an anomalous enumerate-then-hijack chain?
  context: Sequence modeling for explainable detection of the hijack workflow. Build a per-user Markov
    chain or LSTM of command transitions from 4688 ([DeepLog, Du et al](https://doi.org/10.1145/3133956.3134015)
    next-event probability). Flag low-probability sequences like 'qwinsta'->'tscon /dest:' for that user.
    The alert should surface the offending low-probability transition and its baseline probability so
    an analyst can judge whether the user genuinely performs administrative session work or whether an
    attacker is hijacking a session to move laterally.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Multi-user servers (e.g., Terminal Servers, Citrix hosts), Domain Controllers, Jump Boxes'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq_model = per_user_markov_or_lstm(cmd_transitions from 4688)\nfor transition in user_session:\n\
      \  p = seq_model.prob(transition | history)\n  if p < threshold:\n    alert(transition, baseline_prob=p)"
- question: Did an RDP session reconnect (4779) or unlock (4801) originate from a source IP different
    from the source IP recorded at the session's initial logon (4624 Type 10) or last disconnect (4778)?
  context: 'Core authentication-decoupling invariant for RDP hijacking. In the SIEM, maintain a state
    table keyed by user+session ID: on 4624 (Logon Type 10) store user, session ID, and source IP; on
    4778 disconnect and 4779 reconnect / 4801 unlock, look up the session. Alert when the reconnect source
    IP does not match the stored original source IP for that session. A mismatch means a different endpoint
    resumed a session that was authenticated by someone else - precisely lateral movement by session hijacking
    (structural login modeling, [Siadati and Memon](https://doi.org/10.1145/3133956.3134003)). Keep this
    exact-match rule as the deterministic floor.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4778
  - Windows Event ID 4779
  - Windows Event ID 4800
  - Windows Event ID 4801
  - 'NAI: VPN concentrators, External-facing RDP gateways, Authentication logs on Domain Controllers and
    Member Servers, Network sensors at egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on EventID=4624 LogonType=10: store session_state[user,sessionID]=srcIP\non EventID IN (4779,4801):\
      \ lookup session_state[user,sessionID]\n  if event.srcIP != stored.srcIP:\n    alert(user, sessionID,\
      \ orig_ip=stored.srcIP, new_ip=event.srcIP)"
- question: Does an RDP reconnect originate from an ASN, country, or subnet absent from the user's history,
    and is it preceded by a spike of failed logons (4625) for the same user or host?
  context: Statistical geo/ASN drift detection. Per user, profile historical source ASNs/countries/subnets
    for RDP from 4624 with GeoIP/ASN enrichment. For each 4779 reconnect, flag a source ASN/country absent
    from history or in the bottom 1st percentile of the user's connection frequencies (rarity per [Kent
    et al](https://doi.org/10.1016/j.cose.2014.09.001)). As a failure-mode signal, correlate with a spike
    of failed logons (4625) or rejected connections for the same user/host immediately preceding the reconnect
    ([Bian et al](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf)). An impossible-travel
    or never-before-seen network paired with prior auth failures strongly indicates hijacking rather than
    a legitimate roaming user.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4778
  - Windows Event ID 4779
  - Windows Event ID 4800
  - Windows Event ID 4801
  - 'NAI: VPN concentrators, External-facing RDP gateways, Authentication logs on Domain Controllers and
    Member Servers, Network sensors at egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per user: set(ASN,country,subnet) from 4624 (GeoIP enriched)\non 4779 reconnect:\n\
      \  if srcASN/country NOT IN baseline OR freq < p1(user):\n    alert; ENRICH with count(4625 fails)\
      \ for user/host in preceding 15m"
- question: Does graph link-prediction over the authentication graph flag an RDP reconnect whose source->host
    edge is improbable or newly appearing at an atypical time?
  context: Machine-learning ranking of reconnect anomalies. Rank reconnects with graph link-prediction
    over the authentication graph - [CyberGraph, Bowman et al](https://www.usenix.org/system/files/raid20-bowman.pdf)
    (node2vec + logistic regression) or temporal [Euler, King and Huang](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf)
    ([Euler code](https://github.com/iHeartGraph/Euler)) - flagging a reconnect whose source->host edge
    is improbable or newly appearing at an unusual time. This captures lateral-movement patterns invisible
    to per-user baselines by modeling the whole login topology. Emit the top-3 contributors (edge rarity,
    source novelty, time-of-day) in the alert so analysts can validate the hijacking hypothesis.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4778
  - Windows Event ID 4779
  - Windows Event ID 4800
  - Windows Event ID 4801
  - 'NAI: VPN concentrators, External-facing RDP gateways, Authentication logs on Domain Controllers and
    Member Servers, Network sensors at egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "build auth_graph(nodes=hosts/users, edges=logon source->host)\nembed = node2vec(auth_graph);\
      \ model = link_predictor(embed)\nfor reconnect in 4779:\n  p_edge = model.score(src->host, time)\n\
      \  if p_edge < threshold:\n    alert(top3=[edge_rarity, source_novelty, time_of_day])"
- question: Within a remote logon session (tracked by Logon ID from 4624), were discovery or credential-access
    commands (e.g., nltest, net group, reg save hklm\sam, whoami /priv) executed by users not in an administrator
    or red-team group?
  context: 'Causal-invariant detection of inherited-session abuse. Within a logon session (keyed by Logon
    ID from 4624), alert on execution (4688) of discovery/credential-access commands by users not in a
    predefined ''Systems Administrators''/''Red Team'' group. This operationalizes the [Hopper, Ho et
    al](https://www.usenix.org/system/files/sec21-ho.pdf) causal invariant: in-session commands with no
    preceding legitimate authentication for that source/credential are flagged. Extend to Linux by correlating
    auditd execve against auth.log/wtmp. Such commands inside a session the user did not legitimately
    establish is a hallmark of an attacker abusing a hijacked remote session to enumerate and pivot.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Host-based process and network monitoring agents, Network TAPs at key egress/ingress points,
    DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join 4624(LogonID,user) with 4688(LogonID,CommandLine)\nwhere CommandLine MATCHES '(nltest|net\
      \ group|reg save hklm\\\\sam|whoami /priv)'\n  AND user NOT IN (sysadmins, redteam)\n-> alert(user,\
      \ LogonID, CommandLine)"
- question: Does in-session process, command-line entropy, or network-connection volume deviate from the
    user's established baseline over a rolling window, indicating abuse of an inherited session?
  context: 'Statistical session-entropy deviation. Per user, baseline normal-session activity: the set
    of executed processes, command-line Shannon entropy, and volume (bytes out)/frequency (process and
    network-connection count per minute) over a rolling 15-minute window. Alert if a process outside the
    baseline set runs, if command-line entropy exceeds mean+3 sigma, or if connection rate exceeds the
    99th percentile (outlier scoring per [Bohara et al](https://mnoureddine.com/files/17BOH01.pdf)). A
    behavioral regime change inside an existing session points to a different operator having taken control
    and using it for lateral movement.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Host-based process and network monitoring agents, Network TAPs at key egress/ingress points,
    DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per user: proc_set, cmd_entropy, bytes_out, conn_rate (15m window)\nalert if proc\
      \ NOT IN baseline_proc_set\n  OR cmd_entropy > mean+3*std\n  OR conn_rate > p99(user)"
- question: Do in-session command sequences or 5-minute activity aggregates produce high anomaly scores
    from a sequence model or one-class detector, indicating inherited-session abuse?
  context: Machine-learning session modeling. Model in-session command sequences with [DeepLog, Du et
    al](https://doi.org/10.1145/3133956.3134015) or transformer session modeling ([DistilBERT shell-session
    anomaly detection, Liu et al](https://arxiv.org/abs/2310.13247)); also train a one-class SVM/autoencoder
    on 5-minute aggregates (process/network/DNS counts, total bytes). High reconstruction error or low
    next-event probability indicates inherited-session abuse. The alert MUST surface the top-3 anomalous
    features/commands (token attention from the DistilBERT model) rather than a bare score, enabling the
    analyst to confirm whether a hijacked RDP session is being driven by an adversary.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Host-based process and network monitoring agents, Network TAPs at key egress/ingress points,
    DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq_score = deeplog_or_distilbert(cmd_sequence per LogonID)\nagg_score = oneclass_svm_or_ae(5m\
      \ aggregates: proc,net,dns counts,bytes)\nif seq_score low_prob OR agg_score high_recon_error:\n\
      \  alert(top3_anomalous_commands_or_features)"
- question: Did a successful SSH authentication use a client or server version string not on the approved
    list, correlated with an unusually long-lived session (e.g., duration > 8h)?
  context: Deterministic SSH anomaly floor with failure-mode profiling. From Zeek ssh.log, alert on any
    successful auth (auth_success=true) using a client/server version string not on an approved list,
    correlated with a conn.log session duration above threshold (e.g., > 8h). As a failure-mode signal,
    separately profile bursts of auth_success=false and Zeek conn_state S0/REJ (failed/rejected) per src-dst
    preceding a successful long session ([Bian et al](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf)).
    Unapproved clients and abnormally persistent sessions on jump boxes or critical infrastructure can
    indicate a hijacked or tunneled SSH session used for lateral movement.
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - Linux auditd logs
  - 'NAI: Network sensors monitoring traffic to and from Linux/Unix servers, SSH jump boxes, and critical
    infrastructure.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "ssh.log where auth_success=true AND client_version NOT IN approved_list\nJOIN conn.log on\
      \ uid where duration > 8h\n-> alert; ALSO profile bursts(auth_success=false OR conn_state in (S0,REJ))\n\
      \   per src-dst preceding the successful session"
- question: Does an SSH session's duration, byte count, or orig/resp byte ratio exceed the baseline for
    that source-destination pair, shifting from interactive to bulk-transfer characteristics?
  context: Statistical detection of mid-session regime change. From Zeek conn.log, build per src-dst SSH-pair
    distributions of duration and total bytes (orig_bytes/resp_bytes). Alert when a session's duration
    or byte count exceeds the 98th percentile for that pair, or when the orig/resp byte ratio shifts from
    interactive (small, balanced) to bulk-transfer (large, asymmetric). Derive percentiles per pair from
    your own traffic (rarity per [Kent et al](https://doi.org/10.1016/j.cose.2014.09.001)). A single authenticated
    session suddenly transferring bulk data or tunneling traffic is consistent with an attacker who has
    commandeered the session to exfiltrate or pivot.
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - Linux auditd logs
  - 'NAI: Network sensors monitoring traffic to and from Linux/Unix servers, SSH jump boxes, and critical
    infrastructure.'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "baseline per (src,dst) SSH pair: dist(duration), dist(orig+resp bytes)\nalert where session.duration\
      \ > p98(pair)\n  OR session.bytes > p98(pair)\n  OR orig/resp ratio shifts interactive->bulk(asymmetric)"
- question: Does online time-series anomaly detection on SSH session traffic (inter-arrival times, packet-size
    distribution, per-window bandwidth/jitter) show a reconstruction-error spike marking a regime shift
    within one session?
  context: Machine-learning time-series detection of intra-session takeover. Score SSH session traffic
    (packet inter-arrival times, packet-size distribution, per-window bandwidth/jitter) online with an
    autoencoder ensemble such as [Kitsune, Mirsky et al](https://arxiv.org/abs/1802.09089) ([Kitsune code](https://github.com/ymirsky/Kitsune-py)).
    A spike in reconstruction error marks a regime shift from interactive typing to bulk transfer or tunneling
    within a single session - the signature of a hijacked SSH session. Report the top-3 feature deviations
    (e.g., 'bandwidth +20x', 'inter-arrival collapse') in the alert so the analyst can corroborate lateral-movement
    abuse.
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - Linux auditd logs
  - 'NAI: Network sensors monitoring traffic to and from Linux/Unix servers, SSH jump boxes, and critical
    infrastructure.'
  range: Last 90 days
  queries:
  - technology: Zeek/ML pseudocode
    query: "features per window = [inter_arrival, pkt_size_dist, bandwidth, jitter]\nrecon_err = kitsune_ensemble.score(features\
      \ stream)\nif recon_err spikes within session:\n  alert(top3_feature_deviations)"
- question: Within an interactive Linux/macOS session, did auditd execve or a new wtmp/utmp session entry
    occur without a matching successful authentication in auth.log/secure, or did a process attach to
    another user's screen/tmux session or reuse their SSH_AUTH_SOCK/ControlMaster socket?
  context: Deterministic authentication-decoupling floor for *nix session hijacking. For each interactive
    session (keyed by audit session id / PTY), alert when auditd execve or a new wtmp/utmp session entry
    exists without a matching successful authentication in auth.log/secure (or macOS unified log) within
    the session window. Also alert on processes that attach to another user's 'screen -x'/'tmux attach'
    or reuse another user's SSH_AUTH_SOCK/ControlMaster socket. This operationalizes the [Hopper, Ho et
    al](https://www.usenix.org/system/files/sec21-ho.pdf) causal-path invariant and the [Siadati and Memon](https://doi.org/10.1145/3133956.3134003)
    structural-login model. Activity inside a session with no corresponding login is the definitive marker
    of session hijacking for lateral movement. Tune session-window tolerance; do not remove the rule.
  answer_sources:
  - Linux auditd logs
  - auth.log
  - wtmp/utmp
  - Zeek ssh.log
  - Zeek conn.log
  - macos:unifiedlog
  - 'NAI: SSH jump boxes, Linux/Unix multi-user servers, bastion hosts, macOS endpoints with Remote Login/VNC
    enabled'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each session (audit_session_id/PTY):\n  if exists(auditd execve OR new wtmp/utmp entry)\n\
      \     AND NOT exists(successful auth in auth.log/secure within window):\n    alert(session, user,\
      \ source)\nALSO alert on (screen -x | tmux attach) to other user\n  OR reuse of another user's SSH_AUTH_SOCK/ControlMaster\
      \ socket"
- question: Is a Linux/macOS session sourced from a host/subnet/ASN in the bottom 1st percentile of the
    user's history, or does its command set/volume deviate beyond mean+3 sigma, and is it preceded by
    bursts of failed SSH auth or S0/REJ connections?
  context: 'Statistical source-rarity and failure profiling. Per user, baseline source host/subnet/ASN
    and command set per session; flag a session whose source is in the bottom 1st percentile of the user''s
    history or whose command set/volume deviates beyond mean+3 sigma. Explicitly profile the failure state:
    bursts of failed SSH auth (auth_success=false) and Zeek conn_state S0/REJ preceding a successful session
    are distinct signals ([Bian et al](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf));
    rarity grounding per [Kent et al](https://doi.org/10.1016/j.cose.2014.09.001). A session from a never-seen
    source after a wave of auth failures is consistent with credential abuse or hijacking enabling lateral
    movement.'
  answer_sources:
  - Linux auditd logs
  - auth.log
  - wtmp/utmp
  - Zeek ssh.log
  - Zeek conn.log
  - macos:unifiedlog
  - 'NAI: SSH jump boxes, Linux/Unix multi-user servers, bastion hosts, macOS endpoints with Remote Login/VNC
    enabled'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per user: source(host/subnet/ASN), command_set, volume\nalert where session.source\
      \ freq < p1(user)\n  OR command_set/volume deviates > mean+3*std\nENRICH: bursts(auth_success=false\
      \ OR conn_state in (S0,REJ)) preceding session"
- question: Do per-user/host shell command sequences in a Linux/macOS session yield low-probability or
    high-anomaly scores from a sequence model or unsupervised ensemble, indicating a hijacked session?
  context: Machine-learning command-sequence modeling. Model per-user/host shell command sequences with
    [DeepLog, Du et al](https://doi.org/10.1145/3133956.3134015) (LSTM next-event probability) or [DistilBERT
    shell-session anomaly detection, Liu et al](https://arxiv.org/abs/2310.13247); a hijacked session
    yields low-probability/high-anomaly command sequences. For unlabeled environments use the unsupervised
    host-communication ensemble of [Bohara et al](https://mnoureddine.com/files/17BOH01.pdf). The alert
    MUST surface the top-3 anomalous commands/features (token attention) for triage, so the analyst can
    determine whether a different operator has taken over an interactive session to move laterally.
