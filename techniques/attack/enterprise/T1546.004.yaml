questions:
- question: '[Persistence] Allowlist known editors and installers: Can you determine whether a user-specific
    Unix shell configuration file (e.g., ~/.bashrc, ~/.bash_profile, ~/.bash_login, ~/.profile, ~/.bash_logout,
    ~/.zshrc, ~/.zprofile, ~/.zlogin, ~/.zshenv, ~/.zlogout) is written by a process that is not an interactive
    text editor or an authorized package manager/configuration-management agent. -- specifically by applying
    the ''Allowlist known editors and installers'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary poisons Unix/macOS shell
    initialization or logout scripts (e.g., ~/.bashrc, ~/.bash_profile, ~/.profile, ~/.zshrc, ~/.zprofile,
    /etc/profile, /etc/profile.d/*) so that attacker-chosen commands run automatically every time a user
    opens a terminal or logs in remotely via SSH, surviving reboots and credential changes. This evidence
    focuses on the condition that a user-specific Unix shell configuration file (e.g., ~/.bashrc, ~/.bash_profile,
    ~/.bash_login, ~/.profile, ~/.bash_logout, ~/.zshrc, ~/.zprofile, ~/.zlogin, ~/.zshenv, ~/.zlogout)
    is written by a process that is not an interactive text editor or an authorized package manager/configuration-management
    agent. This Symbolic Logic approach looks for the following signal: Monitor write/rename events to
    user shell init and logout files via auditd SYSCALL/PATH (and macOS EndpointSecurity ES_EVENT_TYPE_NOTIFY_WRITE).
    Alert when the writing process comm/exe is NOT on an allow-list of interactive editors (vi, vim, nano,
    emacs, code, gedit) or change-managed package/config agents (apt, dpkg, yum, dnf, rpm, ansible, chef,
    puppet, brew). Deterministic floor modeled on the [SigmaHQ Unix Shell Configuration Modification Rule](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/path/lnx_auditd_unix_shell_configuration_modification.yml);
    validate coverage with the append-to-dotfile cases in [Atomic Red Team T1546.004](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1546.004/T1546.004.md).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates that a shell configuration
    file was changed or executed outside sanctioned change-management, or that a login/boot was followed
    by anomalous execution or network activity consistent with a poisoned shell config; pivot to the writing/executing
    process and its lineage, the UID/login context (auid vs uid for sudo), the exact bytes inserted into
    the file, the child processes spawned at shell startup, and any subsequent outbound connections or
    lateral authentication. A negative result helps reduce suspicion for this vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land modifications.'
