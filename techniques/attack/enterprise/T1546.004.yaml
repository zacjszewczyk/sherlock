name: 'T1546.004: Unix Shell Configuration Modification'
id: cee42d8d-2787-4dd9-ac1d-a7b839ed9564
description: 'This playbook helps an analyst investigate adversary modification of Unix and macOS shell
  configuration files to achieve persistence and privilege escalation via event-triggered execution (MITRE
  ATT&CK T1546.004). Adversaries insert commands into user-level init/logout scripts (~/.bashrc, ~/.bash_profile,
  ~/.bash_login, ~/.profile, ~/.bash_logout, ~/.zshrc, ~/.zprofile, ~/.zlogin, ~/.zshenv, ~/.zlogout)
  and system-wide scripts (/etc/profile, /etc/profile.d/*, /etc/bashrc, /etc/zprofile, /etc/zshenv, /etc/zlogin,
  /etc/zlogout) so malicious code runs each time a user opens a terminal, logs in over SSH, or the system
  boots -- and, for system-wide files, in the context of every future privileged shell. It guides the
  hunt across several behavioral angles: detecting writes to shell init/logout files by processes outside
  an allow-list of interactive editors and change-managed package/config agents; inspecting inserted content
  for download-and-execute and reverse-shell cradles (curl/wget piped to sh, base64 -d | sh, nc -e); statistical
  baselining of file size/frequency, content entropy, and Levenshtein/diff deltas; classifying suspicious
  edits and startup process chains with sequence and provenance-graph models; and correlating interactive/remote
  logins and system boots with anomalous startup-triggered process trees, C2 callbacks to threat-intelligence
  or rare/DGA destinations, post-login beaconing, internal reconnaissance (LDAP/Kerberoasting/SMB enumeration),
  and cross-platform privileged authentication into Windows/AD resources. Detection methods combine symbolic-logic
  rules, robust statistical baselining, and machine-learning models applied to Linux auditd (SYSCALL/PATH,
  EXECVE, USER_LOGIN), macOS EndpointSecurity and unified logs, File Integrity Monitoring, Windows Security
  events, and Zeek network telemetry, so the analyst can corroborate a suspected shell-config compromise
  across file modification, process lineage, login context, and network behavior.'
