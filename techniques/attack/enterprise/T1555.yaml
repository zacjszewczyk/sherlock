name: 'T1555: Credentials from Password Stores'
id: 585dd8ff-e177-4f0d-a7ce-b3b889b5fc93
description: Investigate whether an adversary is attempting to obtain credentials from password stores
  on endpoints, in memory, or in the cloud. This playbook helps an analyst hunt for execution of credential-dumping
  tooling (by hash IOC, rare-hash prevalence, or ML classification), suspicious command lines that target
  credential stores, unauthorized reads of credential-store files (browser Login Data, KeePass .kdbx,
  Windows Credential Manager, /etc/shadow, GNOME Keyring/KWallet, macOS Keychain), abnormal LSASS memory
  access indicative of credential extraction, credential-read events followed by anomalous outbound network
  connections (theft and exfiltration), and abnormal enumeration or bulk retrieval of secrets from cloud
  secrets vaults (AWS Secrets Manager, EC2 GetPasswordData, KMS Decrypt, Azure Key Vault, GCP Secret Manager).
  Each question pairs symbolic-logic, statistical, and machine-learning approaches so the analyst can
  confirm or refute credential access against the Credential Access tactic.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any process execute whose executable hash matches a known credential-dumping tool, including
    renamed or obfuscated variants?
  context: Adversaries pursuing Credential Access frequently drop or run purpose-built credential dumpers
    (Mimikatz, LaZagne, SafetyKatz, nanodump) to harvest passwords from password stores. For every process
    creation event, compare the executable's SHA256 against a continuously updated threat-intelligence
    list of known credential-dumper hashes and raise a critical alert on any match. Seed and validate
    the list with artifacts emulated by [Atomic Red Team T1555](https://www.atomicredteam.io/docs/atomics/T1555).
    A match is high-confidence evidence of credential theft; absence of a match does not clear the host
    because attackers recompile and rename tooling, so pair this with the prevalence and ML methods.
  answer_sources: &id001
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoints (workstations, servers), with high priority on Tier 0 assets like Domain Controllers,
    Active Directory Federation Services (ADFS), and Privileged Access Workstations (PAWs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=endpoint (EventCode=4688 OR (source=Sysmon EventCode=1))

      | eval sha256=lower(Hashes_SHA256)

      | lookup cred_dumper_hashes_iocs sha256 OUTPUT threat_name

      | where isnotnull(threat_name)

      | table _time host User Image sha256 threat_name CommandLine'
- question: Is a rarely-seen, unsigned executable running across the enterprise that could be a renamed
    credential dumper?
  context: Known-bad hash matching misses recompiled or obfuscated dumpers. Calculate enterprise-wide
    prevalence (unique host count) for each process hash over a 30-day rolling window and flag any process
    whose hash is present on fewer than 1% of endpoints and is not signed by a trusted publisher. Derive
    the 1% cutoff from your environment's hash-prevalence distribution using standard-deviation event-log
    baselining ([Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)).
    Rare + unsigned binaries on Tier 0 assets (DCs, ADFS, PAWs) are prime candidates for credential-access
    tooling and warrant triage even without an IOC hit.
  answer_sources: *id001
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint (EventCode=4688 OR (source=Sysmon EventCode=1)) earliest=-30d

      | stats dc(host) as host_count values(Signed) as signed by Hashes_SHA256 Image

      | eventstats count as total_hosts

      | eval prevalence=host_count/total_hosts

      | where prevalence < 0.01 AND signed!="true"

      | sort prevalence'
- question: Does a supervised model classify a newly executed process as a credential dumper based on
    its features?
  context: 'To catch renamed and obfuscated variants that bypass static IOC matching, train a classification
    model (XGBoost, Random Forest) on process-creation features: parent process path, command-line entropy,
    hash prevalence, and PE header fields, using labeled known-good and known-bad executables. Score new
    processes and alert when the ''malicious'' class confidence exceeds a calibrated threshold (e.g.,
    > 0.9). Layer an adaptive misuse model ([AMIDES, Uetz et al.](https://github.com/fkie-cad/amides))
    that learns from rule evasions. The alert must surface the top-3 contributing features so the analyst
    can validate the model''s reasoning against the host context.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "model = load('cred_dumper_xgboost.pkl')\nfor proc in process_creation_events:\n    feats =\
      \ extract([parent_path, cmdline_entropy, hash_prevalence, pe_header_fields])\n    p = model.predict_proba(feats)['malicious']\n\
      \    if p > 0.90:\n        alert(proc, score=p, top_features=model.top_k_shap(feats, 3))"
- question: Did a process run with command-line arguments matching known credential-store extraction commands?
  context: Credential-access utilities expose telltale command-line syntax. Scan the CommandLine/ProcessCommandLine
    field of all process-creation events for regexes such as sekurlsa::logonpasswords, lsadump::sam, vault::cred,
    vaultcmd /listcreds, reg (save|export) hklm\\(sam|security|system), security dump-keychain, secretsdump,
    and browser-profile paths (User Data\\Default\\Login Data, Mozilla\\Firefox\\Profiles). Seed patterns
    from [Atomic Red Team T1555](https://www.atomicredteam.io/docs/atomics/T1555). A match strongly indicates
    an attempt to read credential stores; tune for admin tooling that legitimately exports registry hives
    during backups.
  answer_sources: &id002
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd:EXECVE
  - macos:unifiedlog
  - 'NAI: Endpoints (workstations, servers), with high priority on Tier 0 assets like Domain Controllers,
    ADFS, and Privileged Access Workstations (PAWs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=endpoint (EventCode=4688 OR Sysmon EventCode=1 OR source=auditd:EXECVE OR source=macos:unifiedlog)

      | regex CommandLine="(?i)(sekurlsa::logonpasswords|lsadump::sam|vault::cred|vaultcmd\s+/listcreds|reg\s+(save|export)\s+hklm\\(sam|security|system)|security\s+dump-keychain|secretsdump|User
      Data\\Default\\Login Data|Mozilla\\Firefox\\Profiles)"

      | table _time host User Image CommandLine'
- question: Are common interpreters running command lines with abnormally high entropy or length, suggesting
    obfuscation of credential-access commands?
  context: Attackers obfuscate built-in tooling (powershell.exe, cmd.exe, wscript.exe, bash, reg.exe)
    to evade regex watchlists. Establish a per-user/host baseline of command-line argument entropy (Shannon
    entropy H(X) = -sum p(xi) log2 p(xi)) and length, then flag executions exceeding 3 standard deviations
    from baseline. High-entropy command lines often indicate encoded/packed payloads used to extract credential
    stores. Use standard-deviation thresholding ([Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)).
    Pair positives with the regex and ML methods to confirm intent.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint (EventCode=4688 OR Sysmon EventCode=1) Image IN (powershell.exe,cmd.exe,wscript.exe,bash,reg.exe)

      | eval cl_entropy=shannon_entropy(CommandLine), cl_len=len(CommandLine)

      | eventstats avg(cl_entropy) as mu_e stdev(cl_entropy) as sd_e by host User Image

      | where cl_entropy > mu_e + 3*sd_e

      | table _time host User Image cl_entropy cl_len CommandLine'
- question: Does a language model score a command line as likely credential-access activity based on its
    tokens?
  context: Adversaries continually mutate living-off-the-land commands. Score command lines with a token/embedding
    model trained on labeled benign and credential-access commands, kept current via active learning ([Living-Off-The-Land
    Command Detection, Ongun et al.](https://arxiv.org/abs/2111.15039)). Alert when the malicious probability
    exceeds a calibrated threshold and surface the top-3 contributing tokens. This catches semantically
    similar but syntactically novel credential-store extraction commands that static regexes miss; the
    surfaced tokens let the analyst verify which arguments drove the score.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "model = load('lotl_cmdline_lm.pkl')\nfor proc in process_creation_events:\n    p = model.predict_proba(tokenize(proc.CommandLine))['malicious']\n\
      \    if p > threshold:\n        alert(proc, score=p, top_tokens=model.top_k_tokens(proc.CommandLine,\
      \ 3))"
- question: Did a process other than an approved browser or password manager read a known credential-store
    file?
  context: Credential stores live in predictable file paths. Configure SACLs to log read access (Event
    ID 4663/4656) on credential-store paths (Login Data, .kdbx, %APPDATA%\\Microsoft\\Credentials, /etc/shadow,
    GNOME Keyring/KWallet, macOS login.keychain-db) and alert when the accessing Process Name is not on
    a pre-approved allowlist (chrome.exe, firefox.exe, keepass.exe, gnome-keyring-daemon). Validate coverage
    with [Atomic Red Team T1555](https://www.atomicredteam.io/docs/atomics/T1555). An off-allowlist reader
    of these files is a strong credential-theft signal.
  answer_sources: &id003
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Sysmon Event ID 11
  - auditd:SYSCALL
  - 'NAI: User profile directories on workstations (e.g., `%APPDATA%`, `%LOCALAPPDATA%`) and server directories
    containing application configuration or credential files.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=endpoint (EventCode=4663 OR EventCode=4656 OR Sysmon EventCode=11 OR source=auditd:SYSCALL)

      | where match(ObjectName, "(?i)(Login Data|\.kdbx|\\Microsoft\\Credentials|/etc/shadow|keyring|kwallet|login\.keychain-db)")

      | where NOT ProcessName IN (chrome.exe,firefox.exe,keepass.exe,gnome-keyring-daemon)

      | table _time host User ProcessName ObjectName AccessMask'
- question: Is a statistically rare process reading critical credential-store paths, or is there a spike
    in failed/denied reads against them?
  context: For each critical credential-store path, build a 30-day frequency profile of accessing process
    names and alert when a statistically rare process (bottom 5th percentile or never seen) reads the
    file. Separately profile the per-host rate of failed/denied reads (Event ID 4656 failure, auditd EACCES)
    on these paths as a distinct enumeration signal, alerting on >3 standard deviations above baseline
    ([Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)). Rare readers
    indicate novel tooling; bursts of denied reads indicate an attacker probing for accessible credential
    stores.
  answer_sources: *id003
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint (EventCode=4663 OR EventCode=4656 OR source=auditd:SYSCALL) ObjectName IN (cred_store_paths)

      | stats count as access_count by ObjectName ProcessName

      | eventstats sum(access_count) as path_total by ObjectName

      | eval pct=access_count/path_total

      | where pct < 0.05

      | append [search EventCode=4656 status=failure | bin _time span=1d | stats count as fails by host
      _time | eventstats avg(fails) as mu stdev(fails) as sd by host | where fails > mu+3*sd]'
- question: Does a provenance-graph detector flag the credential-store access subgraph as anomalous?
  context: Model the provenance subgraph of credential-store access (process lineage, file, and subsequent
    file/network nodes) with a node-level GraphSAGE detector ([ThreaTrace, Wang et al.](https://arxiv.org/pdf/2111.04333),
    [code](https://github.com/threaTrace-detector/threaTrace)) and alert on nodes scored anomalous without
    prior attack labels. Surface the offending process node and its top-3 anomalous neighbors. This unsupervised
    approach catches credential-store access patterns that deviate from learned-normal behavior even when
    individual events look benign, tying the read back to its execution lineage and downstream actions
    for the analyst.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "G = build_provenance_graph(process_lineage, file_access, network_events)\ndetector = ThreaTrace_GraphSAGE.load()\n\
      for node in G.nodes:\n    if detector.is_anomalous(node):\n        alert(node, top_neighbors=detector.top_k_neighbors(node,\
      \ 3))"
- question: Did an unauthorized process open LSASS with memory-read access rights characteristic of credential
    dumping?
  context: LSASS holds plaintext and hashed domain credentials in memory. Monitor Sysmon Event ID 10 where
    TargetImage ends with lsass.exe and GrantedAccess includes high-risk masks (0x1010, 0x1410, 0x143A
    = PROCESS_VM_READ/QUERY) or call-trace DLLs dbghelp.dll/dbgcore.dll, and alert if SourceImage is not
    on a strict allowlist of authorized processes (EDR/AV, MsMpEng.exe). Reference [Sigma proc_access_win_lsass_memdump](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_access/proc_access_win_lsass_memdump.yml)
    and [Elastic LSASS Memory Dump](https://www.elastic.co/guide/en/security/8.19/potential-credential-access-via-lsass-memory-dump.html).
    Off-allowlist LSASS reads on Tier 0 assets are critical credential-theft indicators.
  answer_sources: &id004
  - Sysmon Event ID 10
  - Windows Event ID 4656
  - Windows Event ID 4663
  - 'NAI: All Windows endpoints, with the highest priority on Tier 0 assets including Domain Controllers
    and ADFS servers, where LSASS memory contains high-value domain credentials.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=endpoint source=Sysmon EventCode=10 TargetImage="*\\lsass.exe"

      | where (GrantedAccess IN (0x1010,0x1410,0x143A)) OR match(CallTrace, "dbghelp\.dll|dbgcore\.dll")

      | where NOT SourceImage IN (allowlist_edr_av)

      | table _time host SourceImage GrantedAccess CallTrace'
- question: Is a process reading abnormally large volumes from LSASS memory, or is the reader a rare/unsigned
    binary?
  context: Baseline the total bytes read and number of read attempts/sessions against LSASS per SourceImage,
    and flag access whose volume exceeds the benign baseline or whose SourceImage is present on <1% of
    hosts or lacks a trusted signature. The bytes-read and attempt-count features distinguish credential
    theft (which reads large memory regions) from benign LSASS probes ([Effective Detection of Credential
    Thefts from Windows Memory, Ah-Fat et al.](https://www.usenix.org/system/files/raid20-ah-fat.pdf)).
    A high-volume or rare reader of LSASS is strong evidence of credential extraction even if the binary
    is unknown.
  answer_sources: *id004
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint (Sysmon EventCode=10 OR EventCode=4663) TargetImage="*lsass.exe"

      | stats sum(bytes_read) as total_bytes count as attempts dc(host) as hosts values(Signed) as signed
      by SourceImage

      | eventstats avg(total_bytes) as mu stdev(total_bytes) as sd, max(hosts) as fleet

      | where total_bytes > mu+3*sd OR (hosts/fleet) < 0.01 OR signed!="true"

      | table SourceImage total_bytes attempts hosts signed'
- question: Does a behavioral classifier label an LSASS memory-read event as malicious credential extraction?
  context: Train a supervised classifier on LSASS read-event features (granted-access mask, bytes read,
    read attempts, source process lineage) to classify memory-read behaviour as malicious vs. benign rather
    than matching binaries ([Ah-Fat et al.](https://www.usenix.org/system/files/raid20-ah-fat.pdf), deployed
    in production at scale). Complement with DBSCAN clustering over SourceImage/ParentProcess/User/GrantedAccess
    to flag noise points, and surface the top-3 contributing features in the alert. This behavior-based
    approach detects novel dumpers and minidump techniques that signature rules miss.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "clf = load('lsass_access_classifier.pkl')\nfor ev in lsass_read_events:\n    feats = [granted_access,\
      \ bytes_read, attempts, source_lineage]\n    if clf.predict_proba(feats)['malicious'] > threshold:\n\
      \        alert(ev, top_features=clf.top_k(feats,3))\n# also: DBSCAN over [SourceImage,ParentProcess,User,GrantedAccess]\
      \ -> alert noise points"
- question: Was a credential-store read followed within minutes by an outbound connection to a known-bad
    IP or a DNS NXDOMAIN burst from the same host?
  context: Theft of credential stores is often followed quickly by exfiltration or C2 check-in. Correlate
    a credential-store read event (Event ID 4663) with a subsequent network connection (Zeek conn.log)
    from the same id.orig_h to a destination IP on a threat-intel blocklist within a 5-minute window and
    alert on a match. Also flag follow-on DNS NXDOMAIN bursts (Zeek dns.log) from the host as a distinct
    exfil/C2 failure-mode signal. This temporal chaining elevates a single read into a high-confidence
    theft-and-exfil sequence.
  answer_sources: &id005
  - Windows Event ID 4663
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: SIEM or data lake where host and network logs are correlated, endpoint file systems, network
    egress points (e.g., firewalls, proxies), and DNS servers.'
  range: 'Last 90 days; event-centered: 5-minute window after each credential-store read'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=endpoint EventCode=4663 ObjectName IN (cred_store_paths)

      | join host [search index=zeek sourcetype=conn | lookup ti_blocklist id_resp_h]

      | where conn._time>=read._time AND conn._time<=read._time+300 AND isnotnull(threat)

      | append [search index=zeek sourcetype=dns rcode=NXDOMAIN | bin _time span=1m | stats count by host
      _time | where count>20]'
- question: After a credential-store read, did the host connect to a rare destination or send an abnormally
    large outbound payload?
  context: When a credential-store read occurs, monitor the host's Zeek conn.log for 5 minutes and score
    destination IP rarity and outbound payload volume (orig_bytes), alerting if the IP is in the top 1%
    of rarity and orig_bytes exceeds the host's 95th percentile. Derive both thresholds from 30-day per-host
    baselines ([Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)).
    This catches exfiltration to novel infrastructure that is not yet on any blocklist, where the unusual
    destination plus large upload immediately after credential access signals data theft.
  answer_sources: *id005
  range: 'Last 30 days for baseline; event-centered: 5-minute window after each read'
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=zeek sourcetype=conn [search index=endpoint EventCode=4663 ObjectName IN (cred_store_paths)\
      \ | return host]\n| where _time within 300s of read_time\n| eventstats count as dst_seen by id_resp_h\n\
      | eval rarity_rank=... \n| eventstats perc95(orig_bytes) as p95 by id_orig_h\n| where rarity_pct\
      \ < 0.01 AND orig_bytes > p95\n| table _time id_orig_h id_resp_h orig_bytes"
- question: Does a provenance/temporal-graph model flag the read-to-exfil subgraph as anomalous?
  context: Construct the whole-system provenance graph linking credential-store read -> staging -> outbound
    connection and score it with a temporal graph autoencoder ([KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf),
    [code](https://github.com/ProvenanceAnalytics/kairos)), emitting a compact analyst-readable attack
    graph for triage. A masked-graph model ([MAGIC, Jia et al.](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf),
    [code](https://github.com/FDUDSDE/MAGIC)) provides concept-drift-resilient scoring of the same subgraph.
    Surface the top-3 anomalous edges/nodes. This connects credential access to downstream staging and
    egress, producing a defensible end-to-end theft narrative even when individual steps appear benign.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "G = whole_system_provenance(cred_read, staging, outbound_conn)\nscore = KAIROS_temporal_autoencoder.score(G)\n\
      if score > threshold:\n    alert(attack_graph=KAIROS.render(G), top_edges=KAIROS.top_k_edges(G,3))\n\
      # drift-resilient cross-check: MAGIC.masked_graph_score(G)"
- question: Did a cloud principal call sensitive secret-retrieval APIs from outside the approved automation
    allowlist?
  context: Cloud secrets vaults centralize high-value credentials. Alert on CloudTrail/audit events for
    sensitive secret-retrieval actions (GetSecretValue, BatchGetSecretValue, GetPasswordData, Decrypt,
    Azure VaultGet/SecretGet, GCP AccessSecretVersion) where the calling principal, source IP, or user
    agent is outside the approved automation allowlist ([AWS Credential Access GetPasswordData, Splunk](https://research.splunk.com/endpoint/4d347c4a-306e-41db-8d10-b46baf71b3e2/)).
    A human or unfamiliar principal pulling secrets that are normally accessed only by automation strongly
    indicates cloud credential theft.
  answer_sources: &id006
  - AWS:CloudTrail
  - Azure Activity Logs
  - GCP Audit Logs
  - 'NAI: Cloud control plane / audit log pipeline (CloudTrail, Azure Monitor, GCP Cloud Logging) for
    accounts holding secrets-manager, key-vault, and KMS services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=cloud (sourcetype=aws:cloudtrail OR azure:activity OR gcp:audit)

      | where eventName IN ("GetSecretValue","BatchGetSecretValue","GetPasswordData","Decrypt","VaultGet","SecretGet","AccessSecretVersion")

      | where NOT (userIdentity_arn IN (automation_allowlist) AND sourceIPAddress IN (approved_ranges))

      | table _time userIdentity_arn eventName sourceIPAddress userAgent'
- question: Is a cloud principal bulk-retrieving secrets or generating a burst of access-denied errors
    against secrets services?
  context: Count secret-retrieval calls per principal in a 5-minute window and alert when distinct secrets/instances
    accessed exceed a threshold (e.g., >10 GetPasswordData/5min, or distinct GetSecretValue above the
    principal's 95th percentile). Separately profile AccessDenied/403 responses per principal as a distinct
    enumeration signal, alerting on bursts above baseline ([Splunk GetPasswordData](https://research.splunk.com/endpoint/4d347c4a-306e-41db-8d10-b46baf71b3e2/),
    [AWS IAM AccessDenied Discovery Events, Splunk](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/)).
    Bulk retrieval indicates wholesale credential harvesting; access-denied bursts indicate an attacker
    probing for secrets they can reach.
  answer_sources: *id006
  range: 'Last 90 days; correlation window: 5 minutes per principal'
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=cloud sourcetype=aws:cloudtrail eventName IN (GetSecretValue,GetPasswordData,AccessSecretVersion)

      | bin _time span=5m

      | stats dc(secretId) as distinct_secrets count as calls by userIdentity_arn _time

      | eventstats perc95(distinct_secrets) as p95 by userIdentity_arn

      | where distinct_secrets > p95 OR calls > 10

      | append [search errorCode=AccessDenied | bin _time span=5m | stats count as denials by userIdentity_arn
      _time | eventstats avg(denials) as mu stdev(denials) as sd | where denials > mu+3*sd]'
- question: Does a per-principal behavioral model flag anomalous secrets-access volume, breadth, timing,
    or source?
  context: Build a per-principal behavioral model of secrets-access volume, breadth (distinct secrets),
    timing, and source, and alert on deviations using an unsupervised anomaly detector. Surface the top-3
    contributing features (e.g., new source IP, breadth spike, off-hours) in the alert. Validate detections
    against access-denied/enumeration baselines ([Splunk AWS AccessDenied](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/)).
    This captures compromised-credential or insider abuse where a principal suddenly accesses more secrets,
    from new locations, or at unusual times than its learned norm.
  answer_sources: *id006
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "model = per_principal_anomaly_detector.load()\nfor principal in principals:\n    feats = [secrets_volume,\
      \ distinct_secrets_breadth, hour_of_day, source_ip_novelty]\n    if model.anomaly_score(principal,\
      \ feats) > threshold:\n        alert(principal, top_features=model.top_k(feats,3))"
