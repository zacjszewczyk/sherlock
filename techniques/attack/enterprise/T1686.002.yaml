    an out-of-policy rule create, modify, disable, or commit event on the managed firewall outside the
    approved change window. The ''After-hours rule change baseline'' approach (Statistical Method) works
    as follows: Build a 30-day baseline of rule-change sessions per administrator, source host, and hour
    of day from firewall configuration-audit logs. Alert when a user or host exceeds the 99th percentile
    for after-hours changes, when a user performs their first observed rule commit from a new management
    host, or when a change-point detector ([Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/))
    flags an abrupt shift in commit timing. Derive per-environment thresholds from your own audit-log
    history; profile failed/denied logons (Event ID 4625) to the management plane as a distinct precursor
    signal. A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    unauthorized firewall tampering; pivot to the responsible administrator identity and source host,
    the management IP/interface used, the specific rule or object changed, the matching (or missing) change
    request, and the traffic that began flowing after the commit to scope what was exposed. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land firewall
    changes.'
