name: 'T1686.002: Disable or Modify System Firewall: Network Device Firewall'
id: 6826c070-97c2-4046-b1d5-27921507da0d
description: 'This playbook helps an analyst investigate whether an adversary has disabled or modified
  a network device-based firewall to bypass controls limiting network usage (MITRE ATT&CK T1686.002, Disable
  or Modify System Firewall: Network Device Firewall). Adversaries who gain access to a firewall management
  console -- via valid accounts, privilege escalation, API abuse, or exploitation of an internet-exposed
  management interface -- may create, modify, disable, or delete access-control/NAT rules to enable C2
  communications, lateral movement, and data exfiltration that policy would otherwise block. The hunt
  pursues this behavior from several complementary angles: out-of-policy firewall management sessions
  and rule commits made outside approved change windows or from hosts not on the firewall-admin allowlist;
  traffic that begins reaching internet-facing or inter-segment services on ports the rulebase and recent
  baseline say should remain blocked; bursts of API/SSH/web-console policy-edit transactions paired with
  local execution of vendor CLI or automation tooling without a matching change record; connection tuples
  that recently failed and then begin succeeding immediately after a commit, especially on administrative,
  domain-controller, jump-host, or bulk-transfer ports; and policy edits that materially weaken enforcement
  (deny rule deleted, object group widened, interface flipped block->allow) followed by previously denied
  sessions succeeding. Detection methods combine deterministic symbolic-logic correlation (admin-session-to-commit
  correlation, rulebase/data-plane reachability diffing with Header Space Analysis/Batfish/VeriFlow, rule-relation/shadowing
  analysis, blocked-to-allowed transition rules, change-management validation against approved-change
  records), statistical baselining (per-admin after-hours and commit-rate control charts, multi-model
  per-feature profiling, dark-port volume/frequency/source-diversity baselines, success-ratio change scoring,
  and change-point detection), and machine learning (LSTM/DeepLog event-sequence modeling, Isolation Forest/One-Class
  SVM and Kitsune-style online autoencoders, and policy-drift classifiers with top-feature explanations),
  applied across Zeek conn.log, firewall configuration-audit and traffic logs, and Windows Event IDs 4624/4625/4688,
  so the analyst can corroborate suspected firewall tampering against admin, host, rule, and traffic context.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
