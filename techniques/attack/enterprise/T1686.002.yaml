    since a single method can miss stealthy, low-and-slow, or living-off-the-land firewall changes.'
  answer_sources:
  - Firewall configuration audit logs
  - Firewall traffic logs
  - Zeek conn.log
  - 'NAI: Firewall management plane, Border firewalls, East-west segmentation firewalls'
  range: Last 90 days (correlate event-centered windows of +/- 30 minutes around each firewall commit)
  queries:
  - technology: SIEM/ML pseudocode
    query: '# Firewall policy drift classifier (Machine Learning)

      source IN [Firewall configuration audit logs, Firewall traffic logs, Zeek conn.log]

      | scope to NAI: Firewall management plane, Border firewalls, East-west segmentation firewalls

      | approach: Train a model on firewall change metadata, admin identity, change timing, source-IP
      reputation, and subsequent traffic deltas, scoring policy edits likely to be malicious or unauthorized—especially
      those producing an abrupt increase in reachable services or an unusual burst of management-plane
      activity. Score post-change traffic with Isolation Forest / One-Class SVM or an online autoencoder
      traine...

      | emit: admin_identity, source_host, mgmt_ip, rule/object_changed, change_record, post_commit_traffic,
      score/reason'
