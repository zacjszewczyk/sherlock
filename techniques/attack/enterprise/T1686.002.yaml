questions:
- question: '[Defense Impairment] Unscheduled admin session with rule commit (Symbolic Logic): Can you
    determine whether a firewall management session from an administrator workstation is followed by an
    out-of-policy rule create, modify, disable, or commit event on the managed firewall outside the approved
    change window. -- specifically, using the ''Unscheduled admin session with rule commit'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary disables or modifies
    a network device firewall to bypass controls limiting network usage, which can open paths for C2,
    lateral movement, or data exfiltration that policy would otherwise block. This evidence focuses on
    the condition that a firewall management session from an administrator workstation is followed by
    an out-of-policy rule create, modify, disable, or commit event on the managed firewall outside the
    approved change window. The ''Unscheduled admin session with rule commit'' approach (Symbolic Logic)
    works as follows: Correlate Zeek conn.log sessions to firewall management IPs/ports with Windows Event
    ID 4624 administrator logons and vendor firewall configuration-audit events showing rule create, modify,
    disable, or commit actions. Alert when the same admin identity or source host performs a rule change
    outside an approved maintenance window or from a workstation not on the firewall-admin allowlist.
    Every committed change should map to an approved change request per firewall change-management guidance
    ([NIST SP 800-41 Rev. 1](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-41r1.pdf));
    treat commits with no matching change record as out-of-policy. Prioritize logons to internet-exposed
    management interfaces, which are the documented access path for firewall takeover ([CVE-2024-55591](https://nvd.nist.gov/vuln/detail/CVE-2024-55591);
    [MITRE T1686.002](https://attack.mitre.org/techniques/T1686/002/)). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable unauthorized firewall tampering; pivot to
    the responsible administrator identity and source host, the management IP/interface used, the specific
    rule or object changed, the matching (or missing) change request, and the traffic that began flowing
    after the commit to scope what was exposed. A negative result helps rule out this particular vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-and-slow, or living-off-the-land firewall changes.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Firewall configuration audit logs
  - 'NAI: Firewall management plane, Security Operations Console, Vendor admin laptops'
  range: Last 90 days (correlate event-centered windows of +/- 30 minutes around each firewall commit)
  queries:
