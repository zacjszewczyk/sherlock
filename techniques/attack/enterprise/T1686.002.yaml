- question: '[Defense Impairment] After-hours rule change baseline (Statistical Method): Can you determine
    whether a firewall management session from an administrator workstation is followed by an out-of-policy
    rule create, modify, disable, or commit event on the managed firewall outside the approved change
    window. -- specifically, using the ''After-hours rule change baseline'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary disables or modifies
    a network device firewall to bypass controls limiting network usage, which can open paths for C2,
    lateral movement, or data exfiltration that policy would otherwise block. This evidence focuses on
