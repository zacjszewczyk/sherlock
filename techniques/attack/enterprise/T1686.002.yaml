- question: '[Defense Impairment] Blocked service exposure detection (Symbolic Logic): Can you determine
    whether traffic begins reaching an internet-facing or inter-segment service on a port or network path
    that the firewall rulebase and recent baseline indicate should remain blocked, implying that a deny
    rule was removed, narrowed, or reordered. -- specifically, using the ''Blocked service exposure detection''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary disables or modifies
    a network device firewall to bypass controls limiting network usage, which can open paths for C2,
    lateral movement, or data exfiltration that policy would otherwise block. This evidence focuses on
    the condition that traffic begins reaching an internet-facing or inter-segment service on a port or
    network path that the firewall rulebase and recent baseline indicate should remain blocked, implying
    that a deny rule was removed, narrowed, or reordered. The ''Blocked service exposure detection'' approach
    (Symbolic Logic) works as follows: Compare live Zeek conn.log and firewall traffic logs against the
    approved rulebase ([Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html)). Alert when inbound
    or east-west traffic succeeds (conn_state SF/S1/RSTO with bytes) to a service/port the latest committed
    policy marks denied, or when a committed rule broadens source ranges, destination objects, or service
    objects for a protected asset. Use static reachability/policy analysis to confirm a committed change
    actually opens a previously-blocked path ([Header Space Analysis](https://www.usenix.org/system/files/conference/nsdi12/nsdi12-final8.pdf);
    [Batfish](https://www.usenix.org/system/files/conference/nsdi15/nsdi15-paper-fogel.pdf)). A positive
