questions:
- question: '[Persistence] Installer IOC hash correlation: Can you determine whether a file creation or
    process execution event is correlated to a parent installer process (e.g., msiexec.exe, setup.exe),
    and the hash of the created file or executed child process matches a known-malicious indicator from
    a threat intelligence feed. -- specifically, using the ''Installer IOC hash correlation'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses installer packages
    whose scripts inherit elevated permissions to run malicious content, persist, or escalate privileges.
    This evidence focuses on the condition that a file creation or process execution event is correlated
    to a parent installer process (e.g., msiexec.exe, setup.exe), and the hash of the created file or
    executed child process matches a known-malicious indicator from a threat intelligence feed. This Symbolic
    Logic approach works as follows: Query process creation (Windows EID 4688 / Sysmon EID 1) and file
    creation (Sysmon EID 11) where the parent/creating process is an installer (msiexec.exe, setup.exe,
    install*.exe, /usr/sbin/installer, dpkg, rpm). Hash the child executable or written file and match
    against a known-malware feed; alert on any match. Keep deterministic LOLBin floors regardless of hash
    verdict: msiexec.exe with a remote path (`/i http`, `/package \\`) or loading a custom-action DLL
    from a user-writable temp directory, per [LOLBins Abuse: How to Detect LOLBins Abuse in the Wild](https://redcanary.com/blog/blog/lolbins-abuse/)
    and [SigmaHQ Detection Rules Repository](https://github.com/SigmaHQ/sigma). On macOS, alert when a
    `.pkg` postinstall script copies/launches a binary from `/private/tmp` or `/Users/Shared` as seen
    in [OSX.EvilQuest Uncovered](https://objective-see.org/blog/blog_0x59.html); on Linux, when a dpkg/rpm
    maintainer script (postinst/preinst) writes outside package scope. Failure-mode signal: count installer-initiated
    downloads that return HTTP 404 or DNS NXDOMAIN (staging-server churn) as a distinct suspicious indicator.
    A positive result -- a rule match, statistical outlier, or model alert -- indicates an installer or
    one of its children behaved in a way that deviates from sanctioned software deployment and warrants
    pivoting to the responsible process, its full parent/child lineage, the user/integrity context, any
    files/persistence/registry/network artifacts it produced, and the originating installer package and
    its source. A negative result helps reduce confidence in this specific installer-abuse vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    living-off-the-land, or multi-stage installer activity.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Windows Event ID 4104
  - macOS Unified Logs
  - Linux auditd
  - 'NAI: Endpoint devices, Application servers, Software deployment servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Installer IOC hash correlation (Symbolic Logic)

      source IN [Windows Event ID 4688, Sysmon Event ID 11, Windows Event ID 4104, macOS Unified Logs,
      Linux auditd]

      | correlate installer parent (msiexec.exe, setup.exe, install*.exe, /usr/sbin/installer, dpkg, rpm)
      to child/file/registry/network events by ProcessGUID/PID

      | apply IOC/Sigma/YARA matching and deterministic LOLBin/path floors per the method description

      | alert on any match'
- question: '[Persistence] Installer script entropy baseline: Can you determine whether a file creation
    or process execution event is correlated to a parent installer process (e.g., msiexec.exe, setup.exe),
    and the hash of the created file or executed child process matches a known-malicious indicator from
    a threat intelligence feed. -- specifically, using the ''Installer script entropy baseline'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses installer packages
    whose scripts inherit elevated permissions to run malicious content, persist, or escalate privileges.
    This evidence focuses on the condition that a file creation or process execution event is correlated
    to a parent installer process (e.g., msiexec.exe, setup.exe), and the hash of the created file or
    executed child process matches a known-malicious indicator from a threat intelligence feed. This Statistical
    Method approach works as follows: For installer-spawned PowerShell (4688 parent/child correlated to
    4104 script blocks), compute Shannon entropy and character/casing-frequency distributions of the script
    body. Build a per-enterprise baseline of legitimate installer scripts and flag scripts above the 95th
    percentile (typically Shannon > 6.0, or KL-divergence from the natural-language/PowerShell baseline
    beyond 3 sigma), following [Revoke-Obfuscation: PowerShell Obfuscation Detection Using Science](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf),
    [More Detecting Obfuscated PowerShell](https://www.leeholmes.com/more-detecting-obfuscated-powershell/),
    and [Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).
    Pair the style metric with Volume (script byte length vs. baseline mean) and Frequency (count of script
    blocks emitted per install) so a short benign one-liner is not penalized like a 50 KB obfuscated blob.
    Derive thresholds per organization from a 30-day collection of known-good installer scripts. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates an installer or one of its
    children behaved in a way that deviates from sanctioned software deployment and warrants pivoting
    to the responsible process, its full parent/child lineage, the user/integrity context, any files/persistence/registry/network
    artifacts it produced, and the originating installer package and its source. A negative result helps
    reduce confidence in this specific installer-abuse vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, living-off-the-land, or multi-stage
    installer activity.'
