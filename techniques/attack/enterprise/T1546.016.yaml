name: 'T1546.016: Installer Packages'
id: 5d3f912d-4cbf-43c4-8899-6a1f8bb28ca9
description: 'This playbook helps an analyst investigate whether an adversary is abusing installer packages
  (Windows .msi/msiexec, macOS .pkg/.mpkg postinstall scripts, and Linux dpkg/rpm maintainer scripts such
  as preinst/postinst/prerm/postrm) to establish persistence and elevate privileges as part of MITRE ATT&CK
  T1546.016. Installer scripts frequently run with inherited elevated (SYSTEM/root) permissions, so adversaries
  trojanize legitimate installers to execute malicious content, drop persistence mechanisms (services,
  scheduled tasks, run keys, LaunchDaemons/Agents, systemd units, cron entries), reach out to malicious
  infrastructure, run obfuscated scripts, and escalate privileges. The playbook guides the hunt across
  several behavioral angles spanning Windows, macOS, and Linux: correlating installer-spawned file writes
  and child processes to known-malicious hashes and LOLBin patterns; baselining and classifying installer-emitted
  scripts for obfuscation/entropy; matching and rarity-scoring installer-created persistence objects and
  deviations from baselined installer behavior; profiling installer network connections against CTI and
  statistical/one-class anomaly models; identifying installers that match known-vulnerable (CVE) versions;
  detecting privilege-escalation tooling, unexpected integrity-level elevation, privileged group additions,
  and writes to sensitive registry keys (IFEO, Winlogon, LSA) by installers or their children. Detection
  methods combine symbolic-logic rules, statistical baselining/scoring, and machine-learning models applied
  to Windows Security/Sysmon events, PowerShell script-block logs, macOS unified logs, Linux auditd, and
  Zeek network telemetry so the analyst can corroborate suspected installer abuse against process lineage,
  persistence creation, privilege changes, and network context.'
type: technique
