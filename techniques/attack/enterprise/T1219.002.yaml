    network connection from an internal host to an external IP address or domain that matches a known
    malicious C2 threat intelligence feed or a curated list of unsanctioned remote desktop services (e.g.,
    AnyDesk, TeamViewer, RustDesk). This Machine Learning approach works as follows: Train a Random Forest
    classifier on labeled Zeek conn.log using volume features (orig_bytes, resp_bytes, byte ratio), duration,
    destination port, protocol, and connection state; classify new long-lived connections to unknown external
    IPs and alert above confidence 0.9. Use version-agnostic flow features (duration, byte ratios, packet
    sizes, timing) per [Extending C2 Detection to TLS 1.3, Novo et al.](https://dl.acm.org/doi/10.1145/3678890.3678921)
    so detection survives TLS 1.3 encryption. Surface the top-3 contributing features (e.g., byte ratio,
    duration, dst ASN) in every alert per [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
