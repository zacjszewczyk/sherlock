name: 'T1219.002: Remote Desktop Software'
id: 5b9814f9-8507-488c-b349-b77daa5b95b4
description: 'This playbook helps an analyst investigate whether an adversary is abusing legitimate remote
  desktop and remote monitoring & management (RMM) software -- such as AnyDesk, TeamViewer, ScreenConnect,
  RustDesk, NetSupport, VNC, Splashtop, Atera, LogMeIn, and Chrome Remote Desktop -- to establish an interactive
  command-and-control channel into target systems (T1219.002, Command and Control). It guides the hunt
  across multiple behavioral angles spanning Windows, Linux, and macOS: outbound network connections matched
  against threat intelligence and unsanctioned-RMM allowlists, with DNS subdomain-entropy and resolution-failure
  profiling for relay/DGA infrastructure; process executions of remote desktop binaries from non-standard
  paths, spawned by unusual parents, or carrying silent/unattended-install and password-setting command-line
  flags; correlated download-execute-beacon chains; long-lived or high-volume sessions and beacon cadence
  to remote desktop infrastructure with failed/aborted-connection profiling; and anomalous remote interactive
  logons (Event ID 4624 Logon Type 10) by time-of-day, source host, and geolocation/ASN. Detection methods
  combine symbolic-logic rules, statistical baselining, and machine-learning models (Random Forest, one-class
  SVM, LDA, RNN/HMM sequence models, LSTM autoencoders, DBSCAN, Isolation Forest) applied to Zeek conn/dns/http/files
  logs, Windows Event IDs 4688/4624/4625, Sysmon, auditd, and macOS unified logs, so the analyst can corroborate
  suspected remote-access C2 against process lineage, command-line context, session volume/duration, and
  authentication behavior.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
contributors:
- Zachary Szewczyk
