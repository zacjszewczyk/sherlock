  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary abuses legitimate
    remote desktop / RMM software (e.g., AnyDesk, TeamViewer, ScreenConnect, RustDesk, NetSupport, VNC,
    Splashtop, Atera, Chrome Remote Desktop) to establish an interactive, often application-allowlisted
