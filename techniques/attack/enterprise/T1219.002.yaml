questions:
- question: '[Command and Control] Match remote desktop flows to TI (Symbolic Logic): For T1219.002 Remote
    Desktop Software, can you determine whether an outbound network connection from an internal host to
    an external IP address or domain that matches a known malicious C2 threat intelligence feed or a curated
    list of unsanctioned remote desktop services (e.g., AnyDesk, TeamViewer, RustDesk). -- specifically
    by applying the ''Match remote desktop flows to TI'' approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary abuses legitimate
    remote desktop / RMM software (e.g., AnyDesk, TeamViewer, ScreenConnect, RustDesk, NetSupport, VNC,
    Splashtop, Atera, Chrome Remote Desktop) to establish an interactive, often application-allowlisted
    command-and-control channel into the environment. This evidence focuses on the condition that an outbound
    network connection from an internal host to an external IP address or domain that matches a known
    malicious C2 threat intelligence feed or a curated list of unsanctioned remote desktop services (e.g.,
    AnyDesk, TeamViewer, RustDesk). This Symbolic Logic approach works as follows: Query Zeek dns.log
    for requests to domains and Zeek conn.log for connections to destination IPs found on curated threat
    intelligence feeds for known malicious C2 or lists of unsanctioned remote desktop/RMM software (e.g.,
    AnyDesk, TeamViewer, ScreenConnect, RustDesk, NetSupport, Splashtop, Atera). Maintain the authorized-RMM
    inventory and alert (high severity) on any tool NOT on the allowlist, per [Guide to Securing Remote
    Access Software](https://www.cisa.gov/sites/default/files/2023-06/Guide%20to%20Securing%20Remote%20Access%20Software_clean%20Final_508c.pdf),
    which recommends allowlisting authorized remote access software and flagging all other tools. A positive
    result -- a rule match, statistical outlier, or model alert -- suggests that remote desktop software
    is being installed, executed, or used to beacon/control a host in a way that deviates from sanctioned
    IT support and normal user behavior; pivot to the responsible host, user/account context, process
    lineage, command-line arguments, the external destination (IP/domain/ASN), and any correlated logon
    or file-download activity. A negative result helps reduce the likelihood of this specific remote-access
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, portable/in-memory, or living-off-the-land RMM abuse.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate network egress points (firewalls, proxies), DNS resolvers, network sensor grid'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '# Match remote desktop flows to TI

      source IN [Zeek conn.log, Zeek dns.log]

      | apply symbolic-logic detection per source action

      | where <condition matches the described pattern>

      | alert and pivot to host, user, parent process, and destination'
- question: '[Command and Control] Flag unusual subdomain entropy (Statistical Method): For T1219.002
    Remote Desktop Software, can you determine whether an outbound network connection from an internal
    host to an external IP address or domain that matches a known malicious C2 threat intelligence feed
    or a curated list of unsanctioned remote desktop services (e.g., AnyDesk, TeamViewer, RustDesk). --
    specifically by applying the ''Flag unusual subdomain entropy'' approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary abuses legitimate
    remote desktop / RMM software (e.g., AnyDesk, TeamViewer, ScreenConnect, RustDesk, NetSupport, VNC,
    Splashtop, Atera, Chrome Remote Desktop) to establish an interactive, often application-allowlisted
    command-and-control channel into the environment. This evidence focuses on the condition that an outbound
    network connection from an internal host to an external IP address or domain that matches a known
    malicious C2 threat intelligence feed or a curated list of unsanctioned remote desktop services (e.g.,
    AnyDesk, TeamViewer, RustDesk). This Statistical Method approach works as follows: For domains associated
    with remote desktop services, calculate the Shannon entropy of the subdomain portion of the FQDN in
    Zeek dns.log. Alert on hosts querying subdomains with entropy above a dynamically calculated baseline
    (>99th percentile of that domain''s historical subdomains) or a static fallback (>3.5), indicating
    DGA/relay infrastructure; combine entropy with query length and unique-query counts as in [Real-Time
    DNS Exfiltration Detection, Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).
    Derive the threshold per-environment from 30 days of resolver logs. A positive result -- a rule match,
    statistical outlier, or model alert -- suggests that remote desktop software is being installed, executed,
    or used to beacon/control a host in a way that deviates from sanctioned IT support and normal user
    behavior; pivot to the responsible host, user/account context, process lineage, command-line arguments,
    the external destination (IP/domain/ASN), and any correlated logon or file-download activity. A negative
    result helps reduce the likelihood of this specific remote-access vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, portable/in-memory,
    or living-off-the-land RMM abuse.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate network egress points (firewalls, proxies), DNS resolvers, network sensor grid'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Flag unusual subdomain entropy

      source IN [Zeek conn.log, Zeek dns.log]

      | build per-entity baseline over 30 days

      | compute metric and compare to percentile/threshold

      | where metric > baseline_threshold

      | alert on statistical outliers'
