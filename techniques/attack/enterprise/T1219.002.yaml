- question: '[Command and Control] Alert on remote desktop from odd paths (Symbolic Logic): For T1219.002
    Remote Desktop Software, can you determine whether a process execution event (Windows Event ID 4688)
    where the process name matches a known remote desktop application (e.g., ''anydesk.exe'') and is executed
    from a non-standard file path (e.g., not ''C:\Program Files\'') or is spawned by an unusual parent
    process (e.g., ''wscript.exe''). -- specifically by applying the ''Alert on remote desktop from odd
    paths'' approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary abuses legitimate
    remote desktop / RMM software (e.g., AnyDesk, TeamViewer, ScreenConnect, RustDesk, NetSupport, VNC,
    Splashtop, Atera, Chrome Remote Desktop) to establish an interactive, often application-allowlisted
    command-and-control channel into the environment. This evidence focuses on the condition that a process
    execution event (Windows Event ID 4688) where the process name matches a known remote desktop application
    (e.g., ''anydesk.exe'') and is executed from a non-standard file path (e.g., not ''C:\Program Files\'')
    or is spawned by an unusual parent process (e.g., ''wscript.exe''). This Symbolic Logic approach works
    as follows: Using Windows Event ID 4688 (and Sysmon EID 1 / auditd execve on Linux/macOS), alert when
    a process name from the predefined RMM/remote-desktop list (anydesk.exe, rustdesk.exe, teamviewer.exe,
    screenconnect*.exe, nsm.exe, etc.) executes from a directory outside ''C:\Program Files\*'' or ''C:\Program
    Files (x86)\*''. Also flag RMM running as a portable executable or only loaded in memory (no install/uninstall
    registry footprint) per [Guide to Securing Remote Access Software](https://www.cisa.gov/sites/default/files/2023-06/Guide%20to%20Securing%20Remote%20Access%20Software_clean%20Final_508c.pdf),
    and reuse community signatures in [SigmaHQ](https://github.com/SigmaHQ/sigma). A positive result --
    a rule match, statistical outlier, or model alert -- suggests that remote desktop software is being
    installed, executed, or used to beacon/control a host in a way that deviates from sanctioned IT support
    and normal user behavior; pivot to the responsible host, user/account context, process lineage, command-line
    arguments, the external destination (IP/domain/ASN), and any correlated logon or file-download activity.
    A negative result helps reduce the likelihood of this specific remote-access vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, portable/in-memory,
    or living-off-the-land RMM abuse.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoint Detection and Response (EDR) agents on workstations and servers, SIEM log collectors
    for Windows Event Logs'
  range: Last 90 days
  queries:
