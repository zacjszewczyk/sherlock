questions:
- question: Did a newly created Kubernetes Job, CronJob, or pod launch a container whose image hash, source
    registry, command-line arguments, or resulting outbound network connections match known-bad threat-intelligence
    indicators?
  context: 'For the Execution tactic, an adversary who has gained API-server access can schedule a Job/CronJob
    that pulls a malicious image and runs attacker code on cluster nodes. This question joins API-server
    audit events for Job/CronJob/pod creation (verb=create, resource=jobs/cronjobs/pods, group=batch)
    with the spawned pod''s Zeek conn.log/dns.log records for the same pod IP. A match fires when the
    pod resolves or connects to a known C2 destination, when the image originates from a non-allowlisted
    or public registry, or when the container runtime starts a process whose image hash equals a TI indicator.
    This deterministic IOC floor (mirrored by Falco''s container-to-API-server and crypto-miner rules)
    gives high-confidence detections; a positive result means a job is executing attacker-controlled code
    and should be isolated immediately, while a negative result still leaves room for the statistical/ML
    methods to catch novel payloads. Treat the registry/RBAC allowlist (per NSA/CISA Kubernetes Hardening
    Guidance) as the baseline of what is ''known good''. Source references: [Datadog Kubernetes audit
    logs](https://www.datadoghq.com/blog/key-kubernetes-audit-logs-for-monitoring-cluster-security/);
    [Contact K8S API Server From Container and crypto-miner rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml);
    [Kubernetes Hardening Guidance](https://media.defense.gov/2022/Aug/29/2003066362/-1/-1/0/CTR_KUBERNETES_HARDENING_GUIDANCE_1.2_20220829.PDF).'
  answer_sources:
  - Kubernetes audit logs
  - Container runtime logs
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - 'NAI: Kubernetes API Server, Container Registries, Kubernetes Worker Nodes, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  k8s_audit verb=create resource IN (jobs,cronjobs,pods)\n  | join pod_ip [ zeek_conn,\
      \ zeek_dns ]\n  | where image_registry NOT IN allowlist\n      OR image_sha256 IN ti_hashes\n  \
      \    OR dst_ip IN ti_c2 OR dns_query IN ti_domains\n  | emit alert(job, namespace, image, pod_ip,\
      \ dst, matched_ioc)"
- question: Does a newly launched container job communicate with rare or first-seen external destinations,
    transfer anomalous byte volumes, or generate an abnormal rate of failed DNS lookups (NXDOMAIN/SERVFAIL)
    compared with the workload's historical profile?
  context: 'Novel malware may not match any IOC, so this statistical method profiles each new container
    job against a 30-day baseline. For every job compute outbound-byte Volume and connection Frequency
    (connections/min), and compare the pod''s contacted-FQDN set and destination-ASN set to the historical
    service profile using Jaccard similarity. Alert when similarity falls below the 10th percentile, when
    the pod reaches first-seen destinations, or when NXDOMAIN/SERVFAIL responses exceed the 99th percentile
    — the failure spike is a classic signal of DGA beaconing or probing of dead C2 infrastructure. Bag-of-system-calls
    frequency baselining and hierarchical Markov models provide the foundation; thresholds should be derived
    per application from conn.log/dns.log. A positive result indicates an executing job behaving unlike
    its peers and warrants pivoting to the symbolic and ML checks for confirmation. Source references:
    [frequency-vector baselining](https://arxiv.org/abs/1611.03053); [hierarchical Markov models](https://www.mdpi.com/2079-9292/9/1/64).'
  answer_sources:
  - Kubernetes audit logs
  - Container runtime logs
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - 'NAI: Kubernetes API Server, Container Registries, Kubernetes Worker Nodes, Network Egress Points'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  zeek_conn, zeek_dns where pod_ip IN new_job_pods\n  | stats sum(bytes) as vol, count\
      \ as conns, dc(dst_fqdn) as fqdns,\n          sum(dns_rcode IN (NXDOMAIN,SERVFAIL)) as dns_fail\
      \ by pod_ip, app\n  | eval jacc = jaccard(fqdn_set, baseline_fqdn_set[app])\n  | where jacc < pctl10(app)\
      \ OR dns_fail > pctl99(app) OR vol > mean+3*std\n  | emit alert(pod_ip, app, vol, conns, jacc, dns_fail)"
- question: When a process is spawned by a container orchestration job, does a trained classifier score
    it as likely malicious based on command-line length/entropy, special-character density, parent process,
    image path, image-registry rarity, and syscall-frequency features?
  context: 'This machine-learning method generalizes beyond signatures to catch obfuscated or previously
    unseen execution. Train a supervised classifier on job-launched process events using features such
    as command-line length and entropy, special-character density, parent process, image path, image-registry
    rarity, and syscall-frequency vectors, threshold against the Kubernetes misuse dataset. Score each
    new process spawned by a container job and alert on high maliciousness probability. Crucially, surface
    the top-3 contributing features (e.g., image rarity, command entropy, miner-like syscall profile)
    using SHAP/LIME so the analyst can triage quickly and the alert is explainable. A high-confidence
    positive on an Execution-tactic job points to attacker code running in-cluster; the explanatory features
    tell the analyst whether the driver is a rare image, an obfuscated command, or miner behavior. Source
    references: [CDL classified distributed learning](https://dl.acm.org/doi/10.1145/3427228.3427236);
    [syscall data representations](https://www.sciencedirect.com/science/article/pii/S0167404825001270);
    [explainability guidance (SHAP/LIME)](https://arxiv.org/pdf/2302.13865); [Kubernetes misuse dataset](https://www.itu.int/dms_pub/itu-s/opb/jnl/S-JNL-VOL4.ISSUE2-2023-A26-PDF-E.pdf).'
  answer_sources:
  - Kubernetes audit logs
  - Container runtime logs
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - 'NAI: Kubernetes API Server, Container Registries, Kubernetes Worker Nodes, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: ">-\n  feats = extract(cmdline_len, cmdline_entropy, special_char_density,\n              \
      \    parent_proc, image_path, registry_rarity, syscall_freq_vec)\n  score = clf.predict_proba(feats)\n\
      \  if score >= threshold:\n      emit alert(pod, process, score, top3_features=shap(feats))"
- question: Do any processes launched by container jobs have command lines or process names matching known
    reconnaissance tools, C2 stagers, reverse shells (bash -i, nc -e, curl|sh), or cryptominers such as
    kinsing, xmrig, or kdevtmpfsi?
  context: 'Once an adversary executes code in a container, the in-container process often reveals intent.
    This symbolic-logic check searches Windows Event ID 4688 and container runtime logs for process command
    lines originating from container jobs that match regex patterns for recon tooling, C2 stagers, reverse-shell
    primitives, or named cryptominers. Falco''s run-shell-untrusted and crypto-miner Stratum rules cover
    these primitives at the syscall level on Linux nodes and should be kept as the deterministic floor.
    A positive result is strong evidence of malicious Execution inside a job-spawned container — escalate
    and contain. Maintain and tune the regex/IOC list so legitimate admin tooling (kubectl exec, debugging
    shells) does not generate noise, and capture parent process, image, and full command line for attribution
    back to the originating Job/CronJob. Source references: [Run shell untrusted / crypto-miner Stratum
    rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml).'
  answer_sources:
  - Kubernetes audit logs
  - Windows Event ID 4688
  - Container runtime logs
  - 'NAI: Kubernetes Worker Nodes, Kubernetes API Server'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (WinEventLog:4688, container_runtime) where container_job=true\n  | eval cmd=lower(CommandLine)\n\
      \  | where cmd MATCHES '(bash -i|nc .*-e|curl.*\\\\| ?sh|wget.*\\\\| ?sh)'\n      OR proc_name IN\
      \ (kinsing,xmrig,kdevtmpfsi,masscan,nmap)\n  | emit alert(pod, job, ParentImage, Image, CommandLine)"
- question: Does a container job process exhibit abnormally high command-line entropy or an abnormally
    high rate of shell invocations per pod relative to that application's benign baseline?
  context: 'Attackers frequently obfuscate commands (base64, packed one-liners) and spawn shells far more
    often than normal workloads. This statistical method computes command-line entropy and shell-invocation
    Frequency (shells spawned/min per pod) for all container-job processes and compares against per-application
    baselines built from benign traces. Alert when a command line exceeds the 99th percentile of entropy,
    sharply diverges from the expected token distribution, or when the shell-spawn rate exceeds baseline
    by 3 standard deviations. Probabilistic syscall n-gram likelihood (MLE with Good-Turing smoothing)
    flags low-probability scripted sessions that signatures miss. A positive result indicates obfuscated
    or scripted Execution worth deeper inspection; because thresholds are per-service, a quiet workload
    suddenly spawning shells is highly suspicious even at modest absolute counts. Source references: [MLE
    + Good-Turing smoothing](https://www.semanticscholar.org/paper/Probabilistic-Real-Time-Intrusion-Detection-System-Srinivasan-Kumar/0dcb0f6625e1b7059cdb58bef3fba32c95c6a4ce).'
  answer_sources:
  - Kubernetes audit logs
  - Windows Event ID 4688
  - Container runtime logs
  - 'NAI: Kubernetes Worker Nodes, Kubernetes API Server'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  proc where container_job=true\n  | eval ent=entropy(CommandLine)\n  | stats max(ent)\
      \ as max_ent, count(shell_spawn) as shells by pod, app, bin(_time,1m)\n  | where max_ent > pctl99_entropy[app]\
      \ OR shells > mean_shells[app]+3*std_shells[app]\n  | emit alert(pod, app, max_ent, shells)"
- question: Can a sequence/language model classify the shell commands and syscalls produced by a container
    job as reconnaissance, C2 communication, payload execution, or benign administration with high confidence?
  context: 'Terse pattern matching cannot infer intent, so this ML method fine-tunes a language/sequence
    model on shell-command and syscall data from benign and malicious container jobs (e.g., CHIDS syscall-sequence
    graphs). For each job it classifies activity into reconnaissance, C2 communication, payload execution,
    or benign administration and alerts on high-confidence malicious outputs, reporting the top-3 tokens/syscalls
    driving the decision for explainability. This is valuable when an adversary chains legitimate-looking
    commands toward a malicious goal: the model captures the sequence semantics rather than a single keyword.
    A positive ''payload execution'' or ''C2 communication'' classification on an Execution-tactic job
    is a strong escalation signal; the explanatory tokens help the analyst confirm whether the model latched
    onto genuine malice or a benign automation pattern. Source references: [CHIDS syscall sequence graphs](https://dl.acm.org/doi/10.1145/3560810.3564266);
    [syscall data representations](https://www.sciencedirect.com/science/article/pii/S0167404825001270);
    [AI container security survey](https://arxiv.org/pdf/2302.13865).'
  answer_sources:
  - Kubernetes audit logs
  - Windows Event ID 4688
  - Container runtime logs
  - 'NAI: Kubernetes Worker Nodes, Kubernetes API Server'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: ">-\n  seq = tokenize(shell_cmds + syscalls for job)\n  label, conf = seqmodel.classify(seq)\
      \  # {recon,c2,payload,benign}\n  if label != 'benign' and conf >= threshold:\n      emit alert(job,\
      \ pod, label, conf, top3_tokens=attribution(seq))"
- question: Within a short window of a container job's creation, does the resulting pod connect to a suspicious
    ASN, a TOR exit node, or a blocklisted destination?
  context: 'Malicious jobs often reach out to attacker infrastructure almost immediately after starting.
    This symbolic-logic check correlates new container-job creation (API-server audit) with subsequent
    Zeek conn.log entries from the resulting pod IP, alerting when the pod connects to a suspicious ASN,
    TOR exit node, or blocklisted destination within a short post-creation window (e.g., 5 minutes). This
    aligns with NSA/CISA egress-restriction guidance and NIST SP 800-190 runtime monitoring. A positive
    result strongly suggests the job exists to run code that calls home, supporting the Execution mission
    question. Because the correlation is time-bounded to job creation, it cleanly attributes the suspicious
    egress to a specific Job/CronJob and namespace, accelerating containment. Source references: [egress-restriction
    guidance](https://media.defense.gov/2022/Aug/29/2003066362/-1/-1/0/CTR_KUBERNETES_HARDENING_GUIDANCE_1.2_20220829.PDF);
    [NIST SP 800-190 runtime monitoring](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-190.pdf).'
  answer_sources:
  - Kubernetes audit logs
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Kubernetes Worker Nodes, Network Egress Points, Monitoring and Metrics Platform, Kubernetes
    API Server'
  range: 'Last 90 days (event-centered: job_create to +5m)'
  queries:
  - technology: Zeek/pseudocode + SIEM
    query: ">-\n  let jobs = k8s_audit verb=create resource IN (jobs,cronjobs,pods)\n  zeek_conn where\
      \ ts within [job.create_ts, +5m] and src_ip = pod_ip\n  | where dst_asn IN suspicious_asns OR dst_ip\
      \ IN tor_exits OR dst_ip IN blocklist\n  | emit alert(job, namespace, pod_ip, dst_ip, dst_asn, delay)"
- question: Does a pod show post-job-creation spikes in CPU/memory or outbound bytes (Volume), connection
    rate (Frequency), or failed-connection ratio (State) exceeding three standard deviations above its
    30-day node/application baseline, or connections to countries/ASNs unseen in 30 days?
  context: 'This statistical method detects behavioral deviation when neither IOC nor destination reputation
    fires. Establish 30-day baselines for CPU, memory, outbound bytes (Volume), connections/min (Frequency),
    and success/fail ratio (State) per worker node and per application profile. Alert on spikes beyond
    3 standard deviations, on connections to destination countries/ASNs unseen in the baseline, and on
    a surge in failed/refused connections (a distinct failure-mode signal of probing). Markov-model anomaly
    localization attributes the deviation to a specific pod/node so the analyst knows exactly where to
    look. A positive result indicates an executing job behaving materially differently from its historical
    norm — for example a quiet batch job suddenly saturating egress — which is a high-value lead for the
    Execution investigation. Source references: [Markov-model anomaly localization](https://www.mdpi.com/2079-9292/9/1/64).'
  answer_sources:
  - Kubernetes audit logs
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Kubernetes Worker Nodes, Network Egress Points, Monitoring and Metrics Platform, Kubernetes
    API Server'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  metrics+conn where pod IN new_job_pods\n  | stats avg(cpu) avg(mem) sum(bytes) as vol\
      \ count as freq\n          sum(conn_state IN (REJ,RSTO)) as fails by pod, node, app\n  | where vol>mean+3*std\
      \ OR freq>mean+3*std OR fails>mean+3*std\n      OR dst_country NOT IN seen30d[app]\n  | emit alert(pod,\
      \ node, app, vol, freq, fails)"
- question: Does a time-series anomaly detector flag a pod's outbound-byte stream or process-creation
    sequence as anomalous, and does comparing kernel-event distributions across identical workload replicas
    reveal one divergent (compromised) pod?
  context: 'Identical replicas of the same Deployment/Job should behave nearly identically, so divergence
    pinpoints compromise without per-app training. This ML method applies a time-series anomaly detector
    to outbound bytes from pod IPs and to process-creation sequences on the worker node, and uses a ReplicaWatcher-style
    comparison of kernel-event distributions across replicas to flag the divergent (compromised) job-spawned
    pod. The alert surfaces the top-3 divergent features (bytes, new process, new destination). This is
    especially powerful for the Execution tactic because attacker code injected into one replica stands
    out against its siblings even if the absolute volumes look plausible. A positive result is a strong,
    low-false-positive indicator that one specific pod is executing something its peers are not. Source
    references: [ReplicaWatcher](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf).'
  answer_sources:
  - Kubernetes audit logs
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Kubernetes Worker Nodes, Network Egress Points, Monitoring and Metrics Platform, Kubernetes
    API Server'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: ">-\n  for workload in deployments_with_replicas:\n      dists = [kernel_event_dist(p) for\
      \ p in workload.pods]\n      divergent = replicawatcher_outlier(dists)\n      if divergent or ts_anomaly(outbytes[p])\
      \ or ts_anomaly(proc_seq[p]):\n          emit alert(workload, divergent_pod, top3_features)"
- question: Did a process spawned by a container job access sensitive file paths — service-account tokens
    (/var/run/secrets/kubernetes.io), kubelet.conf, admin.conf, or cloud-provider credential files — where
    the source process is not on an allowlist?
  context: 'Job-spawned processes that read cluster credentials are often staging for lateral movement
    or escalation, but the read itself is an Execution-tactic action by attacker code. This symbolic-logic
    check triggers when a process from a container job (identified by parent process in Windows Event
    ID 4688) accesses a critical file object (Windows Event ID 4663) such as kubelet.conf, admin.conf,
    service-account tokens, or cloud credential files, and the source process name is not on a predefined
    allowlist. Falco''s read-sensitive-file-untrusted rule gives the equivalent syscall-level condition
    on Linux nodes. A positive result means job code is touching secrets it has no business reading —
    a high-priority lead. Tune the allowlist to legitimate agents (kubelet, CSI drivers, logging sidecars)
    to keep precision high. Source references: [Read sensitive file untrusted rule](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Kubernetes Worker Nodes, Internal Network Segments, Kubernetes API Server'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  4663 ObjectName IN ('*kubelet.conf','*admin.conf',\n                      '/var/run/secrets/kubernetes.io/*','*credentials','*.kube/config')\n\
      \  | join ProcessId -> 4688 (container_job=true)\n  | where source_proc NOT IN allowlist\n  | emit\
      \ alert(pod, job, source_proc, ObjectName)"
- question: Does a new container job establish a number of previously-unseen internal (east-west) connections
    exceeding the 95th percentile of its application baseline, or generate a spike in blocked/refused
    east-west attempts (NetworkPolicy denials)?
  context: Lateral exploration shows up as new edges in the cluster communication graph. This statistical
    method builds a baseline pod-to-pod / pod-to-service communication graph per application from historical
    Zeek conn.log, then for each new job counts the new/unseen internal connections its pod(s) establish;
    a count above the 95th percentile of the application baseline is anomalous. It also profiles connection
    State — a spike in blocked/refused east-west attempts indicates NetworkPolicy denials, a distinct
    failure-mode signal of attempted lateral movement. A positive result suggests the executing job is
    mapping or reaching into parts of the cluster it normally never touches, which is suspicious even
    when each individual connection looks benign. Pair with the symbolic sensitive-file check to confirm
    intent.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Kubernetes Worker Nodes, Internal Network Segments, Kubernetes API Server'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  zeek_conn internal where src_pod IN new_job_pods\n  | eval new_edge = (src,dst,dport)\
      \ NOT IN baseline_graph[app]\n  | stats sum(new_edge) as new_edges,\n          sum(conn_state IN\
      \ (REJ,RSTO,S0)) as blocked by src_pod, app\n  | where new_edges > pctl95_edges[app] OR blocked\
      \ > pctl95_blocked[app]\n  | emit alert(src_pod, app, new_edges, blocked)"
- question: When pod internal-flow features (destination port, protocol, data volume, duration) are clustered,
    do any job-spawned pods fall into a new small cluster or get marked as noise/outliers?
  context: 'Clustering reveals behavioral families and the pods that do not fit any of them. This ML method
    applies DBSCAN (or similar) to features extracted from internal flows — destination port, protocol,
    data volume, duration — to group pods into behavioral profiles, then flags jobs whose pods land in
    a new, small cluster or are labeled noise/outliers, reporting the top-3 deviating flow features. For
    the Execution investigation this surfaces job-spawned pods whose internal communication pattern is
    unlike any established workload, a hallmark of attacker tooling probing the network. A positive result
    (outlier/noise pod) is a focused lead; the deviating features tell the analyst whether the oddity
    is an unusual port, protocol, or transfer size, guiding confirmation against NetworkPolicy and the
    sensitive-file check. Source references: [CDL workload classification](https://dl.acm.org/doi/10.1145/3427228.3427236).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Kubernetes Worker Nodes, Internal Network Segments, Kubernetes API Server'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: ">-\n  X = features(dst_port, proto, bytes, duration) for pod_flows\n  labels = DBSCAN(eps,\
      \ min_samples).fit_predict(X)\n  for pod in job_pods:\n      if labels[pod] == -1 or cluster_size(labels[pod])\
      \ < k:\n          emit alert(pod, job, top3_flow_features)"
- question: Are there API-server create/patch requests on jobs, cronjobs, or pods returning 403/401, or
    Kubernetes ImagePullBackOff/ErrImagePull events from non-allowlisted registries, indicating blocked
    or failing malicious deployments?
  context: 'Attacker trial-and-error and blocked payloads leave a trail of denials and pull failures.
    This symbolic-logic check queries API-server audit logs for create/patch requests on jobs/cronjobs/pods
    returning responseStatus.code 403 (Forbidden) or 401, and Kubernetes events of type ImagePullBackOff/ErrImagePull
    from non-allowlisted registries. A burst of denials from one user or service account is a strong precursor
    signal that an adversary is probing what they can deploy. Kyverno/OPA admission policies can both
    block and emit these events. A positive result — especially a cluster of 403s or pulls from public
    registries by an unexpected principal — is an early-warning lead for the Execution mission, catching
    the adversary before a payload succeeds. Capture the principal (user/service account), namespace,
    resource, and registry for follow-up. Source references: [Datadog audit-log fields](https://www.datadoghq.com/blog/key-kubernetes-audit-logs-for-monitoring-cluster-security/);
    [admission policies](https://kyverno.io/policies/other/audit-event-on-exec/audit-event-on-exec/).'
  answer_sources:
  - Kubernetes audit logs
  - Kubernetes events
  - Container runtime logs
  - 'NAI: Kubernetes API Server, Kubernetes Worker Nodes, Container Registries'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  k8s_audit verb IN (create,patch) resource IN (jobs,cronjobs,pods)\n  | where responseStatus_code\
      \ IN (401,403)\n  OR (event_reason IN (ImagePullBackOff,ErrImagePull) AND registry NOT IN allowlist)\n\
      \  | stats count by principal, namespace, resource, registry\n  | emit alert(principal, namespace,\
      \ resource, count)"
- question: Does any user or service account exceed the 99th percentile (or 3 standard deviations above
    its own mean) for job-creation failure ratio, image-pull failure rate, or pod restart/backoff rate
    over a rolling 1-hour window?
  context: Healthy automation has stable, low failure rates; reconnaissance and blocked attacks spike
    them. This statistical method establishes per-user and per-service-account baselines for job-creation
    failure ratio (403 ratio), image-pull failure rate, and pod restart/backoff rate over a rolling 1-hour
    window, then alerts when any principal's failure ratio exceeds its 99th percentile or 3 standard deviations
    above its mean. This explicit failure-mode profiling distinguishes attacker trial-and-error from normal
    CI/CD churn. A positive result points to a principal repeatedly failing to deploy or run jobs — a
    behavior consistent with an adversary iterating on a payload or hitting policy guardrails — and is
    a strong lead for the Execution investigation even when no single request is independently alarming.
  answer_sources:
  - Kubernetes audit logs
  - Kubernetes events
  - Container runtime logs
  - 'NAI: Kubernetes API Server, Kubernetes Worker Nodes, Container Registries'
  range: Last 90 days (rolling 1-hour windows)
  queries:
  - technology: SIEM/Stats pseudocode
