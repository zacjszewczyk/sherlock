- question: Within five minutes of a container job executing, was a new local account created on the worker
    node (4720) or a high-privilege Kubernetes object (ClusterRoleBinding/RoleBinding to cluster-admin)
    created, not attributable to a legitimate admin tool?
  context: 'Successful escalation frequently produces a new account or a new powerful RBAC binding moments
    after the job runs. This symbolic-logic check correlates process execution from a container job with
    local account creation on the same worker node (Windows Event ID 4720) or creation of high-privilege
    Kubernetes objects (ClusterRoleBinding, RoleBinding to cluster-admin) in audit logs within a short
    window, alerting when not attributable to a legitimate admin tool. Audit fields and 403-vs-success
    status distinguish granted from denied escalations. A positive result is strong evidence of completed
    privilege escalation driven by a job — investigate the new principal/binding and the originating job
    urgently. The time-bounded correlation cleanly attributes the change to the job, and the success/denied
    distinction tells the analyst whether the escalation actually took effect. Source references: [Datadog
    guidance](https://www.datadoghq.com/blog/key-kubernetes-audit-logs-for-monitoring-cluster-security/).'
  answer_sources:
