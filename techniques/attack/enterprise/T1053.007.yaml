- question: Does a container job access host-mounted paths outside its expected filesystem or exceed the
    99th percentile of host-path access counts for its application profile, including denied/blocked host-path
    attempts?
  context: Breakout attempts disturb a workload's normal file-access footprint. This statistical method
    profiles file-access patterns for legitimate container jobs using Windows Event ID 4663, flags jobs
    that access host-mounted paths outside the expected filesystem or exceed the 99th percentile of host-path
    access counts for the application profile, and separately profiles failed/denied host-path access
    attempts (AppArmor/SELinux/AccessDenied) as a distinct attempted-breakout signal. A positive result
    indicates a job reaching into host filesystem regions it normally never touches — or repeatedly being
    denied — both consistent with escalation via the node filesystem. The denied-access channel is especially
    valuable because blocked attempts reveal intent even when controls succeed; pair with the symbolic
    escape-command check to confirm.
  answer_sources:
