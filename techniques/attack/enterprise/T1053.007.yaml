    and align the allowlist with NSA/CISA Kubernetes Hardening Guidance. A positive result is a suspicious
    scheduled object that may re-deploy a payload on a cadence — review the full spec, the creating principal,
    and whether it is sanctioned. Even a single matching CronJob warrants investigation because persistence
    requires only one. Source references: [policy-as-code admission control](https://kyverno.io/policies/other/audit-event-on-exec/audit-event-on-exec/);
    [Kubernetes Hardening Guidance](https://media.defense.gov/2022/Aug/29/2003066362/-1/-1/0/CTR_KUBERNETES_HARDENING_GUIDANCE_1.2_20220829.PDF).'
