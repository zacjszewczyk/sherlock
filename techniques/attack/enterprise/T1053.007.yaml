- question: Does a sequence-analysis model flag unexpected lifecycle transitions such as job-create ->
    pod-running -> new ClusterRoleBinding or new local admin account, indicating malicious follow-on escalation?
  context: 'The escalation story is in the transition sequence, not any single event. This ML method trains
    a sequence-analysis model (e.g., SHIL self-supervised hybrid learning) on legitimate job/pod lifecycles
    and flags unexpected transitions such as job-create -> pod-running -> new ClusterRoleBinding or new
    local admin account, reporting the top-3 contributing transition events; it is trained/thresholded
    against the Kubernetes misuse dataset. For the Privilege Escalation mission this catches multi-step
    chains where each step is individually plausible but the ordering reveals follow-on escalation. A
    positive result is a job whose lifecycle veers into privileged-object or account creation in a way
    benign jobs never do; the contributing transitions tell the analyst exactly which steps (e.g., the
    RBAC creation following pod-running) drove the alert, focusing confirmation and response. Source references:
    [SHIL self-supervised hybrid learning](https://dl.acm.org/doi/10.1145/3665795); [Kubernetes misuse
    dataset](https://www.itu.int/dms_pub/itu-s/opb/jnl/S-JNL-VOL4.ISSUE2-2023-A26-PDF-E.pdf).'
