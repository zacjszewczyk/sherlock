- question: Did a job-spawned pod connect to a sensitive host/control-plane service — Kubelet API (10250),
    etcd (2379-2380), or the API server — with no matching NetworkPolicy allowance for that pod and port?
  context: 'Reaching control-plane services from a workload pod is a classic escalation move. This symbolic-logic
    check alerts when Zeek conn.log shows a pod IP connecting to a sensitive host service such as the
    Kubelet API (10250), etcd (2379-2380), or the API server, with no matching NetworkPolicy allowance
    for that pod and port. Falco''s contact-K8S-API-server-from-container rule detects the same pattern
    at runtime, and segmentation is required by NSA/CISA hardening guidance. A positive result indicates
    a pod attempting to talk to powerful infrastructure it is not authorized to reach — a strong escalation
    lead, since access to kubelet or etcd can yield secrets, tokens, or full cluster control. Capture
    the pod, destination service/port, and the absent NetworkPolicy for containment and policy remediation.
    Source references: [Contact K8S API Server From Container rule](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml);
    [hardening guidance](https://media.defense.gov/2022/Aug/29/2003066362/-1/-1/0/CTR_KUBERNETES_HARDENING_GUIDANCE_1.2_20220829.PDF).'
  answer_sources:
  - Kubernetes audit logs
  - Zeek conn.log
  - 'NAI: Kubernetes Worker Nodes, Kubernetes Control Plane Network, Internal Administrative Networks'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  zeek_conn where src_ip IN pod_ranges\n      AND dst_port IN (10250, 2379, 2380, apiserver_port)\n\
      \  | where NOT networkpolicy_allows(src_pod, dst, dst_port)\n  | emit alert(src_pod, dst_ip, dst_port,\
      \ service)"
- question: Does a pod contact an unusual number of privileged host/node ports (>3 std dev above its application-profile
    mean), or generate a spike in refused/blocked connections to control-plane ports?
