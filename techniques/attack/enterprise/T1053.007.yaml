- question: Does an autoencoder/sequence model trained on benign command-line and syscall sequences flag
    a new job with high reconstruction error, especially sequences containing breakout primitives or host
    file access?
  context: 'Novel escape chains evade keyword rules but disturb learned sequence structure. This ML method
    trains an autoencoder or sequence model on benign command-line and syscall sequences from container
    jobs (e.g., CHIDS syscall-sequence graphs) and alerts when a new job produces a sequence with high
    reconstruction error, especially one containing breakout primitives or host file access, surfacing
    the top-3 anomalous syscalls/arguments. For the Privilege Escalation mission this catches obfuscated
    or previously unseen breakout techniques that the symbolic check would miss. A positive result is
    a job whose execution sequence is structurally unlike anything benign; the anomalous syscalls/arguments
    reported tell the analyst whether namespace manipulation, host mounts, or unusual privileged calls
    drove the score, guiding rapid confirmation. Source references: [CHIDS syscall sequence graphs](https://dl.acm.org/doi/10.1145/3560810.3564266);
    [syscall representations](https://www.sciencedirect.com/science/article/pii/S0167404825001270).'
