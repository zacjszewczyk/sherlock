    spike of denials. This statistical method baselines normal pod-to-node-port communications from Zeek
    conn.log and counts the unique privileged ports each pod contacts, flagging pods exceeding three standard
    deviations above the application-profile mean; it separately profiles refused/blocked connection State
    to control-plane ports (NetworkPolicy/firewall denials) as an attempted-access failure-mode signal.
    A positive result indicates a pod scanning or repeatedly trying to reach privileged services — behavior
    consistent with escalation reconnaissance. The denied-connection channel is critical: even when segmentation
    blocks the attempt, the burst of refusals reveals the adversary''s intent. Correlate with the symbolic
    control-plane-access check to confirm targeting.'
