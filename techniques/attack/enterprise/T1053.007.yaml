- question: Does a One-Class SVM or autoencoder trained on legitimate pod-to-host/pod-to-service flows
    flag a new outlier flow from a job-spawned pod, optionally corroborated by replica-divergence analysis?
  context: 'Legitimate pod-to-host communication is narrow and learnable, so outliers stand out. This
    ML method trains a One-Class SVM (or autoencoder) on legitimate pod-to-host/pod-to-service flows using
    destination IP, destination port, protocol, and duration, and treats new outlier flows as possible
    unauthorized access from a compromised pod; a ReplicaWatcher-style replica-divergence comparison can
    corroborate by flagging the divergent replica. The alert reports the top-3 deviating flow features.
    For the Privilege Escalation mission this catches subtle unauthorized access to host/service endpoints
    that fall outside learned norms even when no fixed rule matches. A positive result — an outlier flow,
    especially one from a single divergent replica — is a focused escalation lead; the deviating features
    guide the analyst to the specific destination/port/protocol anomaly. Source references: [ReplicaWatcher
    replica-divergence approach](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf).'
