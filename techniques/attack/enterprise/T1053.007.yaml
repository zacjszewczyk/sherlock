name: 'T1053.007: Container Orchestration Job'
id: 2551d248-869d-4f70-82eb-c51adccfc087
description: 'Investigate whether an adversary is abusing container-orchestration task scheduling (primarily
  Kubernetes Jobs and CronJobs) to execute malicious code, maintain persistence, or escalate privileges
  within a cluster. Adversaries with API-server access can schedule Jobs/CronJobs that pull untrusted
  images and run attacker code across nodes, configure controllers to keep killed payloads respawning,
  beacon to C2 on a fixed cadence, read service-account tokens and kubelet/cloud credentials, mount the
  host filesystem or abuse docker.sock/nsenter to break out of the container, and create privileged pods,
  new local accounts, or cluster-admin RBAC bindings. This playbook helps an analyst hunt the full chain:
  suspicious Job/CronJob specs (high-frequency schedules, public/non-allowlisted images, privileged or
  hostPID/hostNetwork/hostPath contexts, reverse-shell commands); job-launched processes matching recon
  tools, C2 stagers, reverse shells, or cryptominers; rare or first-seen egress, NXDOMAIN/SERVFAIL spikes,
  and low-jitter beaconing; unattributed periodic network and process activity that maps to no configured
  CronJob; sensitive-file and host-path access; pod-to-control-plane (kubelet/etcd/API-server) connections
  that violate NetworkPolicy; high-backoff self-healing jobs; and 403/401 denials, ImagePullBackOff, and
  CrashLoopBackOff bursts that betray attacker trial-and-error. Each question pairs deterministic symbolic-logic
  detection with statistical baselining and machine-learning approaches so that successful, evasive, and
  failed/blocked attempts are all surfaced. Focus collection on the Kubernetes API server, worker nodes,
  container registries, control-plane network, and network egress points.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
