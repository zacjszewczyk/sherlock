    Windows Event ID 4688 from that pod. Markov state-transition modeling detects the abnormal repeated
    kill/restart state cycle. A positive result points to a payload that security controls keep killing
    and the controller keeps restarting — the essence of resilient persistence. The entropy correlation
    helps distinguish a genuinely buggy app (benign crashes) from an obfuscated malicious command being
    relaunched. Source references: [state-transition modeling](https://www.mdpi.com/2079-9292/9/1/64).'
