- question: Is there a sudden spike (>3 std dev above moving average) in creation of high-privilege Kubernetes
    objects near a recent container-job execution, or a rise in failed (403) RBAC-modification attempts
    per service account?
  context: Escalation campaigns create privileged objects in bursts and leave failed attempts behind.
    This statistical method monitors the creation rate of high-privilege Kubernetes objects (ClusterRoleBindings,
    privileged pods) and flags sudden spikes deviating from a moving-average baseline by more than three
    standard deviations that occur near recent container-job execution; it also profiles failed (403)
    RBAC-modification attempts per service account as a distinct privilege-probing signal. A positive
    result indicates an abnormal rate of privileged-object creation tied to job activity, or a service
    account repeatedly being denied RBAC changes — both consistent with attempted escalation. The 403
    channel is valuable because it exposes probing even when admission control blocks the change; correlate
    spikes with the symbolic account/RBAC-creation check to confirm impact.
