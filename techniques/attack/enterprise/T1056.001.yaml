    query: ">-\n  index=sysmon EventCode=7 ImageLoaded=\"*\\\\user32.dll\"\n  | join ProcessGuid [search\
      \ index=sysmon EventCode=1 | table ProcessGuid Image ParentImage]\n  | where NOT (Image LIKE \"\
      C:\\\\Windows\\\\System32\\\\%\" OR Image LIKE \"C:\\\\Program Files%\")\n      AND NOT ParentImage\
      \ IN (\"*explorer.exe\",\"*winlogon.exe\")\n  | table _time host Image ParentImage"
- question: Are there newly written executables with Shannon entropy above 7.2 (a packing indicator) that
    are not signed by a trusted publisher nor allowlisted, especially in temp directories with subsequent
    small repeated writes?
  context: 'Packed/obfuscated keyloggers exhibit high file entropy. Computing Shannon entropy on each
    new EID 11 executable and flagging >7.2 when unsigned/unallowlisted highlights packed droppers used
    for Credential Access; pairing with the volume signal of later small repeated writes strengthens the
    case. High-entropy unsigned binaries in temp paths warrant detonation/analysis; signed enterprise
    software is excluded. Source method (Statistical Method): For each new executable (Sysmon EID 11),
    compute Shannon entropy and flag entropy >7.2 (packing indicator) when not signed by a trusted publisher
    and not allowlisted; pair with the Volume signal of subsequent small repeated writes ([The Evolution
    of Keylogger Technologies, Salas-Nino et al](https://arxiv.org/abs/2312.10445)).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Virtual Desktop Infrastructure (VDI) fleet, Terminal Servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=sysmon EventCode=11 TargetFilename=\"*.exe\"\n  | eval entropy=shannon(TargetFilename)\n\
      \  | where entropy > 7.2 AND Signed!=\"true\" AND NOT Hashes IN (allowlist)\n  | table _time host\
      \ TargetFilename entropy"
- question: When a One-Class SVM trained on benign user32.dll-loading processes scores live processes
    (by parent name, command-line length, loaded-DLL count, has-window flag), which are outliers?
  context: 'Most processes that load user32.dll are ordinary GUI apps; a one-class model learns that benign
    profile and flags processes that deviate, catching keystroke-API consumers that masquerade as normal
    for Credential Access. Features include parent name, command-line length, loaded-DLL count, and whether
    the process has a window. Reporting the top-3 deviating features makes the outlier explainable. Outliers
    warrant manual review of the process behavior. Source method (Machine Learning): Train a One-Class
    SVM on benign profiles of processes that load `user32.dll` (parent name, command-line length, loaded-DLL
    count, has-window flag) and flag outliers; report the top-3 deviating features in the alert ([Towards
    Trustworthy Keylogger Detection, Mahmud](https://arxiv.org/abs/2505.16103)).'
  answer_sources:
