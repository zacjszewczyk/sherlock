questions:
- question: Did any process create a file or modify a registry key/value that matches a known keylogger
    indicator of compromise, including the autostart/hook keys (AppInit_DLLs, Winlogon Userinit/Shell,
    Keyboard Layout) abused to load keystroke-capturing DLLs?
  context: 'Keyloggers supporting Credential Access frequently drop a known binary or set a persistence/hook
    registry value so their capture DLL loads into interactive sessions. Matching Sysmon file-create (EID
    11) hashes and registry-modify (EID 13) object paths against a maintained keylogger IOC feed gives
    a high-confidence detection; explicitly covering AppInit_DLLs, Userinit/Shell, and Keyboard Layout
    keys catches DLL-injection persistence. A hit warrants host isolation and credential reset for users
    of that host; no hit lowers but does not eliminate suspicion (custom/unknown tooling). Source method
    (Symbolic Logic): Query file creation (Sysmon EID 11) and registry modification (Sysmon EID 13) events;
    alert when a file hash or registry object path matches a maintained keylogger IOC feed. Cover keystroke-relevant
    autostart/hook keys explicitly: `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_DLLs`,
    `...\Winlogon\Userinit`/`Shell`, and `HKLM\SYSTEM\CurrentControlSet\Control\Keyboard Layout\...`,
    which are abused to load keystroke-capturing DLLs ([About Hooks, Microsoft](https://learn.microsoft.com/en-us/windows/win32/winmsg/about-hooks)).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=sysmon (EventCode=11 OR EventCode=13)\n  | eval obj=coalesce(TargetFilename,TargetObject)\n\
      \  | search (Hashes IN (keylogger_ioc_hashes) OR obj IN (keylogger_ioc_paths)\n      OR obj=\"*\\\
      \\AppInit_DLLs*\" OR obj=\"*\\\\Winlogon\\\\Userinit*\"\n      OR obj=\"*\\\\Winlogon\\\\Shell*\"\
      \ OR obj=\"*\\\\Keyboard Layout*\")\n  | table _time host Image obj Hashes"
- question: Is there an anomalous spike in modifications to keylogging-relevant registry keys (e.g., AppInit_DLLs,
    Userinit) on a host versus its own 90-day baseline, and are blocked tamper attempts being tracked
    separately?
  context: 'Even without an exact IOC, a sudden burst of writes to keystroke-hook persistence keys can
    reveal Credential Access tooling being installed or reconfigured. Building a per-host 90-day daily-frequency
    baseline and alerting beyond 3 standard deviations surfaces deviations; tracking write success (EID
    13) versus access-denied (4657/4656) as a distinct state ensures blocked tamper attempts are not lost.
    A spike on a normally quiet host is suspicious; baseline noise from patching is benign. Source method
    (Statistical Method): For modifications to keylogging-relevant keys (e.g., `AppInit_DLLs`, `Userinit`),
    build a 90-day per-host baseline of daily modification frequency (Volume/Frequency) and alert when
    the daily count exceeds the host mean by >3 standard deviations. Track write success/failure (EID
    13 vs. access-denied 4657/4656) as a distinct state signal so blocked tamper attempts are not lost
    ([SwiftOnSecurity Sysmon config baseline informs included keys](https://github.com/SwiftOnSecurity/sysmon-config)).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=sysmon EventCode=13 TargetObject IN (\"*AppInit_DLLs*\",\"*Userinit*\",\"*Winlogon*\"\
      )\n  | bin _time span=1d | stats count as daily by host _time\n  | eventstats avg(daily) as mu stdev(daily)\
      \ as sd by host\n  | where daily > mu + 3*sd\n  | append [search index=wineventlog (EventCode=4657\
      \ OR EventCode=4656) ObjectName IN (\"*AppInit_DLLs*\",\"*Userinit*\") Accesses=\"DENIED\" | stats\
      \ count by host]"
- question: When scored by a Gradient Boosting Machine on registry-modification features (parent image
    path, target path, value type, value length, signer), which modifications exceed 0.9 likelihood of
    being keylogger-related, and what are the top SHAP features?
  context: 'For Credential Access, an ML classifier generalizes beyond static IOCs by learning which registry-write
    characteristics correlate with keystroke-hook installation. Feeding parent process image path, target
    registry path, value data type/length, and signer into a GBM and alerting above 0.9 highlights novel
    tooling; surfacing the top-3 SHAP contributors (e.g., ''AppInit_DLLs path + unsigned parent + long
    value'') makes the alert explainable and triageable. High scores merit investigation of the parent
    process lineage. Source method (Machine Learning): Feed registry-modification features (parent process
    image path, target registry path, value data type, value length, signer) into a Gradient Boosting
    Machine and alert when score >0.9. Surface the top-3 SHAP contributing features in the alert text
    so analysts see why it fired (e.g., ''AppInit_DLLs path + unsigned parent + value length''), following
    the explainable keylogger-classification approach in [Towards Trustworthy Keylogger Detection, Mahmud](https://arxiv.org/abs/2505.16103).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [parent_image_path, target_reg_path, value_type, value_length, signer]\n\
      \  score = gbm_model.predict_proba(features)\n  if score > 0.9: alert(top3=shap_values(features))"
- question: Did a non-allowlisted process create a remote thread (Sysmon EID 8) or access (EID 10, PROCESS_VM_WRITE/QueryInformation)
    an interactive input-handling process such as explorer.exe, winlogon.exe, or a browser - or on macOS
    create an event tap after gaining TCC Accessibility, or on Linux open/read /dev/input/event*?
  context: 'Capturing keystrokes for Credential Access often requires injecting into the process that
    owns the input message loop, or tapping OS input services. Cross-process thread creation (EID 8) is
    rare in benign software, making it high-fidelity; EID 10 with VM_WRITE into winlogon/explorer/browsers
    indicates hook/thread injection. On macOS, a non-allowlisted process granted TCC Accessibility then
    calling CGEventTapCreate is a classic keylogger pattern; on Linux, a non-input-subsystem process reading
    /dev/input/event* reads raw keystrokes. Allowlist known injectors to cut false positives. Source method
    (Symbolic Logic): Alert on Sysmon EID 8 (CreateRemoteThread) or EID 10 (ProcessAccess with PROCESS_VM_WRITE/QueryInformation)
    where the target is an interactive/input-handling process (e.g., `explorer.exe`, `winlogon.exe`, browsers)
    and the source is not on a known-good injector allowlist; cross-process thread creation is rare in
    benign software, making EID 8 high-fidelity ([Sysmon Community Guide: CreateRemoteThread, TrustedSec](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md)).
    On macOS, alert when a non-allowlisted process is granted TCC Accessibility and creates an event tap
    ([Quartz Event Services, Apple](https://developer.apple.com/documentation/coregraphics/quartz_event_services));
    on Linux, alert when a non-input-subsystem process opens/reads `/dev/input/event*` (auditd open/read).'
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - macos:unifiedlog
  - auditd:SYSCALL
  - 'NAI: User Workstations, Terminal Servers, Privileged Access Workstations, VDI fleet'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=sysmon (EventCode=8 OR (EventCode=10 AND GrantedAccess IN (\"0x1438\",\"0x143a\"\
      ,\"PROCESS_VM_WRITE\")))\n  TargetImage IN (\"*explorer.exe\",\"*winlogon.exe\",\"*chrome.exe\"\
      ,\"*msedge.exe\",\"*firefox.exe\")\n  NOT SourceImage IN (known_good_injectors)\n  | table _time\
      \ host SourceImage TargetImage GrantedAccess\n  ; macOS: unifiedlog subsystem=com.apple.TCC service=Accessibility\
      \ granted AND process creates CGEventTap\n  ; Linux: auditd SYSCALL (open|read) path=/dev/input/event*\
      \ comm NOT IN (Xorg,libinput)"
- question: Are there processes that load user32.dll (host of SetWindowsHookEx/GetAsyncKeyState) yet have
    no visible window or message loop and are not known interactive applications?
  context: 'The keyboard-hook and key-state polling APIs live in user32.dll. A legitimate GUI app loading
    user32.dll is normal, but a headless/service process loading it while running no message loop is a
    strong sign of keystroke interception for Credential Access. Correlate Sysmon EID 7 (image load of
    user32.dll) with the absence of a window/interactive session and exclude known interactive apps. Positive
    results point to covert hook consumers; benign automation that legitimately uses user32 should be
    allowlisted. Source method (Symbolic Logic): Alert when a process loads `user32.dll` (the host of
    SetWindowsHookEx/GetAsyncKeyState) (Sysmon EID 7) yet has no visible window / message loop and is
    not a known interactive app, isolating keystroke-API consumers from ordinary GUI apps ([About Hooks,
    Microsoft](https://learn.microsoft.com/en-us/windows/win32/winmsg/about-hooks); [Preventing Malicious
    Use of Keyloggers, Malla et al](https://arxiv.org/abs/2304.07594)).'
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - macos:unifiedlog
  - auditd:SYSCALL
  - 'NAI: User Workstations, Terminal Servers, Privileged Access Workstations, VDI fleet'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=sysmon EventCode=7 ImageLoaded=\"*\\\\user32.dll\"\n  | join ProcessGuid [search\
      \ index=sysmon EventCode=1 | table ProcessGuid Image has_window]\n  | where has_window=\"false\"\
      \ AND NOT Image IN (known_interactive_apps)\n  | table _time host Image ProcessGuid"
- question: On instrumented hosts or sandboxes, do any processes' I/O write byte-rates correlate with
    an injected synthetic keystroke stream, betraying that they transform keystroke input into proportional
    storage writes?
  context: 'A genuine keylogger turns keystroke input into proportional file/exfil writes. By injecting
    a synthetic keystroke stream on an instrumented host and measuring each process''s write volume, you
    can flag processes whose write byte-rate tracks the injected keystroke rate - a behavioral signature
    that does not depend on signatures or IOCs, relevant to confirming Credential Access. A strong correlation
    strongly implicates the process; no correlation clears it for that test window. Source method (Statistical
    Method): On instrumented hosts/sandboxes, inject a synthetic keystroke stream and measure each process''s
    I/O write Volume; flag processes whose write byte-rate correlates with the injected keystroke rate
    (a genuine keylogger transforms input keystroke volume into proportional storage/exfil writes), per
    the bait-injection technique of [Bait Your Hooks, Ortolani et al](https://link.springer.com/chapter/10.1007/978-3-642-15512-3_11).'
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - macos:unifiedlog
  - auditd:SYSCALL
  - 'NAI: User Workstations, Terminal Servers, Privileged Access Workstations, VDI fleet'
  range: Last 7 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  inject synthetic_keystroke_stream(rate=R)\n  for proc in processes:\n    corr = pearson(proc.write_bytes_per_sec_series,\
      \ keystroke_rate_series)\n    if corr > 0.8: alert(proc, corr)"
- question: Does an LSTM log-key sequence model (DeepLog-style) flag an out-of-distribution event chain
    of process-create -> user32.dll load / EID 8 injection -> small repeated file/registry writes that
    deviates from normal Sysmon ordering?
  context: 'Keylogging for Credential Access produces a characteristic ordering of events: a process starts,
    loads keystroke libraries or injects a hook, then begins small repeated writes to a log/registry.
    Training a DeepLog-style LSTM on normal Sysmon process/module/registry/network ordering lets you flag
    the anomalous chain even when individual events look benign. Reporting the log key that broke the
    prediction aids explainability. Out-of-distribution sequences merit deep host triage. Source method
    (Machine Learning): Train an LSTM log-key sequence model (DeepLog-style) on normal Sysmon process/module/registry/network
    ordering and flag the out-of-distribution chain process-create -> user32.dll load / EID 8 injection
    -> small repeated file/registry writes; report the log key that broke the prediction for explainability
    ([DeepLog, Du et al](https://acmccs.github.io/papers/p1285-duA.pdf)).'
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - macos:unifiedlog
  - auditd:SYSCALL
  - 'NAI: User Workstations, Terminal Servers, Privileged Access Workstations, VDI fleet'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  seq = ordered_log_keys(host, window=10m)  # process_create, image_load, remote_thread,\
      \ file_write, reg_write\n  pred = deeplog_lstm.next_key(seq[:-1])\n  if seq[-1] not in pred.topk:\
      \ alert(host, broke_at=seq[-1], context=seq)"
- question: Was an unsigned kernel driver loaded (Sysmon EID 6, Signed=false) whose hash is not on the
    enterprise allowlist of legitimate unsigned drivers?
  context: 'Kernel/driver keyloggers read the raw hardware keystroke buffer and therefore require a driver
    load. Triggering on EID 6 where Signed is false and the hash is unknown surfaces these for Credential
    Access. Because some legitimate niche drivers are unsigned, an allowlist prevents noise. A non-allowlisted
    unsigned driver load on a workstation is highly suspicious and warrants immediate driver/file analysis
    and host isolation. Source method (Symbolic Logic): Trigger on Sysmon EID 6 when ''Signed'' is false
    and the driver hash is not on the enterprise allowlist of legitimate unsigned drivers; kernel/driver
    keyloggers read the raw hardware keystroke buffer and require a driver load ([The Evolution of Keylogger
    Technologies, Salas-Nino et al](https://arxiv.org/abs/2312.10445)).'
  answer_sources:
  - Sysmon Event ID 6
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers, Privileged Access Workstations, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=sysmon EventCode=6 Signed=false\n  NOT Hashes IN (allowlisted_unsigned_driver_hashes)\n\
      \  | table _time host ImageLoaded Signature Signed Hashes"
- question: Did a host load a driver whose signer is in the bottom 5th percentile of enterprise-wide signer
    prevalence, and are blocked/failed driver loads being counted as a separate signal?
  context: 'Rarity is a powerful heuristic: a driver signed by a publisher almost never seen across the
    fleet is more likely to be malicious tooling supporting Credential Access. Baseline signer prevalence
    per host and across the enterprise from the EID 6 Signature field, then alert on bottom-5th-percentile
    signers; separately count load failures/blocked loads as a distinct state signal so prevented attempts
    are visible. Rare-signer loads merit reputation lookup and reverse engineering. Source method (Statistical
    Method): Baseline signer prevalence from the EID 6 ''Signature'' field per host and across the fleet;
    alert when a loaded driver''s signer is in the bottom 5th percentile of enterprise frequency (rarity),
    and separately count load failures/blocked loads as a distinct state signal ([The Evolution of Keylogger
    Technologies, Salas-Nino et al](https://arxiv.org/abs/2312.10445)).'
  answer_sources:
  - Sysmon Event ID 6
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers, Privileged Access Workstations, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=sysmon EventCode=6 | stats dc(host) as hosts by Signature\n  | eventstats perc5(hosts)\
      \ as p5\n  | where hosts <= p5\n  | append [search index=sysmon EventCode=6 LoadResult=\"blocked\"\
      \ | stats count by Signature host]"
- question: Does an LSTM anomaly detector flag a statistically significant spike in hourly new service
    installations (Windows EID 7045) not explained by scheduled deployments?
  context: 'Driver/keylogger persistence is frequently installed as a service. Modeling hourly EID 7045
    counts with an LSTM and alerting on spikes that deviate from learned deployment rhythms surfaces bursts
    of new services consistent with malware install waves for Credential Access. Listing the contributing
    hosts/timestamps focuses triage. Spikes overlapping change windows are likely benign; off-cycle spikes
    warrant review of the installed binaries. Source method (Machine Learning): Run an LSTM anomaly detector
    on hourly counts of new service installations (Windows EID 7045); alert on statistically significant
    spikes not explained by scheduled deployments, and list the contributing hosts/timestamps in the alert
    ([DeepLog, Du et al](https://acmccs.github.io/papers/p1285-duA.pdf)).'
  answer_sources:
