name: 'T1056.001: Keylogging'
id: 92412e29-e381-4e14-8ed4-c86e59a67d90
description: 'Investigate potential keystroke logging (keylogging) used to intercept user credentials
  and collect sensitive input. This playbook helps an analyst hunt across the full keylogger lifecycle:
  the installation of keylogging tooling (file/registry IOC matches, autostart/hook keys, unsigned kernel
  drivers, suspicious service installs); the active interception of keystrokes (global keyboard hooks
  via SetWindowsHookEx, GetAsyncKeyState polling, CreateRemoteThread injection into input-handling processes,
  macOS Quartz event taps/TCC abuse, Linux reads of /dev/input/event*, and network-device firmware tampering);
  the preparatory clearing of browser cookies to force reauthentication; and the staging, batching, and
  exfiltration of captured keystrokes (high-entropy staging files/named pipes, incremental small writes,
  low-and-slow beaconing, rare JA3 fingerprints, DNS tunneling, and file-size-to-bytes-sent correlation).
  It spans Windows, macOS, Linux, and network devices using endpoint (Windows Event IDs, Sysmon, auditd,
  macOS unified log) and network (Zeek, PCAP/DPI) telemetry, and pairs symbolic-logic, statistical, and
  machine-learning methods so analysts can both detect and explain keylogging activity for credential
  access and collection.'
type: technique
