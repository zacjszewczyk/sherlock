      \  if ocsvm.decision_function(X) < 0: alert(top3=most_deviating_features(X))"
- question: Did a non-browser, non-approved process delete files matching browser cookie paths (Sysmon
    EID 23, TargetFilename contains 'Cookies')?
  context: 'Adversaries clear browser cookies to force users to reauthenticate so an installed keylogger
    captures fresh credentials quickly - a precursor behavior for Credential Access. Alerting when a process
    other than chrome.exe/firefox.exe/msedge.exe or an approved utility deletes cookie files surfaces
    this manipulation. A non-browser cookie wipe, especially near keylogger indicators, is highly suspicious;
    browser-initiated cleanup is benign. Source method (Symbolic Logic): Alert when a process deletes
    files matching browser cookie paths (Sysmon EID 23, `TargetFilename` contains ''Cookies'') and the
    image is not `chrome.exe`/`firefox.exe`/`msedge.exe` or an approved utility; adversaries clear cookies
    to force reauthentication so keystrokes capture fresh credentials ([Preventing Malicious Use of Keyloggers,
    Malla et al](https://arxiv.org/abs/2304.07594)).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - 'NAI: User Workstations, Web Application Servers, Authentication Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=sysmon EventCode=23 TargetFilename=\"*Cookies*\"\n  NOT Image IN (\"*chrome.exe\"\
      ,\"*firefox.exe\",\"*msedge.exe\", approved_utilities)\n  | table _time host Image TargetFilename"
- question: Are there files receiving more than 10 writes per minute with an average write size under
    1KB - the volume/frequency signature of incremental keystroke logging?
  context: 'Keystroke logs grow through many tiny appends rather than large document saves. Monitoring
    EID 11 file-modification rate and flagging files with >10 writes/min and average write size <1KB isolates
    this incremental-write pattern for Credential Access, particularly when it follows a cookie deletion.
    Such write cadence is anomalous for normal saves; matching files should be pulled and inspected for
    keystroke content. Source method (Statistical Method): Monitor file-modification rate (Sysmon EID
    11); flag files receiving >10 writes/min with average write size <1KB (the Volume/Frequency signature
    of incremental keystroke logging), which is anomalous for normal document saves ([Bait Your Hooks,
    Ortolani et al](https://link.springer.com/chapter/10.1007/978-3-642-15512-3_11)).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - 'NAI: User Workstations, Web Application Servers, Authentication Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
