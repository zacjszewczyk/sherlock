      \ alert(hosts=top_contributors, times=spike_window)"
- question: Did a process load user32.dll while its own image path is outside C:\Windows\System32 or C:\Program
    Files and its parent is not explorer.exe/winlogon.exe?
  context: 'user32.dll hosts the keyboard-hook APIs, so a binary running from a user-writable/odd path
    that loads it - especially when not spawned by a normal interactive shell - is a candidate keylogger
    for Credential Access. Correlate EID 7 (user32 load) with EID 1 (image path and parent) and filter
    to non-standard paths with non-shell parents. Positive results point to masqueraded or dropped tooling;
    legitimate apps in standard paths are excluded. Source method (Symbolic Logic): Alert when a process
    loads `user32.dll` (Sysmon EID 7) while its image path (EID 1) is outside `C:\Windows\System32`/`C:\Program
    Files` and its parent is not `explorer.exe`/`winlogon.exe`; user32.dll hosts the keyboard-hook APIs
    ([About Hooks, Microsoft](https://learn.microsoft.com/en-us/windows/win32/winmsg/about-hooks)).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Virtual Desktop Infrastructure (VDI) fleet, Terminal Servers.'
