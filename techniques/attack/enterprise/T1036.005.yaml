name: 'T1036.005: Masquerading: Match Legitimate Resource Name or Location'
id: 5dafeb49-2c96-4c6a-a537-3497de76441b
description: >-
  Investigate evidence that an adversary is masquerading by matching or approximating the name or location
  of legitimate files, processes, Registry keys, services, or container/cloud resources to evade defenses
  and analyst scrutiny (MITRE ATT&CK T1036.005, Match Legitimate Resource Name or Location). This playbook
  helps an analyst hunt across endpoint, container, and ESXi telemetry for: (1) processes carrying trusted
  system names (e.g., svchost.exe, lsass.exe) whose hash, Authenticode signature state, or enterprise
  prevalence is inconsistent with the genuine binary; (2) trusted system process names executing from
  non-canonical paths (outside %SystemRoot%\System32/SysWOW64, /usr/bin, /System/Library, ESXi /bin, or
  trusted container namespaces); (3) renamed binaries whose embedded PE metadata (OriginalFileName, InternalName,
  CompanyName) is null, junk, or mismatched against known-good baselines; (4) high-value system utilities
  spawned from illegitimate parent processes that violate expected ancestry (e.g., lsass.exe not under
  wininit.exe); (5) trusted-named processes exhibiting anomalous secondary behavior such as high-entropy
  command lines, unusual egress ports, or DGA-style DNS; (6) files whose true byte content (magic bytes
  / inferred content type) contradicts their claimed extension or trusted name in a trusted directory;
  and (7) resources whose names closely approximate (but do not exactly match) legitimate trusted names
  via typosquatting, character substitution, or Unicode homoglyphs. It combines deterministic symbolic-logic
  invariants, statistical rarity/entropy/edit-distance baselining, and explainable machine-learning classifiers
  across Windows Event Log, Sysmon, auditd, macOS unified log, Kubernetes apiserver, containerd, ESXi,
  and Zeek telemetry.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
