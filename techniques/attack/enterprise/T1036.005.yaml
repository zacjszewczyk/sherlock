questions:
- question: >-
    [Symbolic Logic] TI hash matches for system names: Does the available telemetry reveal this condition?
    Evidence under investigation: A process creation event is observed where the on-disk filename corresponds
    to a known legitimate system utility (e.g., svchost.exe, lsass.exe), but the executable's hash, signature
    state, or enterprise prevalence is inconsistent with the genuine binary: the MD5/SHA256 matches a
    known-bad indicator, the Authenticode signature is absent/invalid/not Microsoft-signed, or the (name,hash)
    tuple is seen on a single host.
  context: >-
    Tactic context (TA0005 Stealth): the adversary is trying to hide and conceal their actions by blending
    in with legitimate activity; under T1036.005 they reuse or approximate the names/locations of trusted
    resources so malicious activity is indistinguishable from benign system operations. What to look for
    and why: A process creation event is observed where the on-disk filename corresponds to a known legitimate
    system utility (e.g., svchost.exe, lsass.exe), but the executable's hash, signature state, or enterprise
    prevalence is inconsistent with the genuine binary: the MD5/SHA256 matches a known-bad indicator,
    the Authenticode signature is absent/invalid/not Microsoft-signed, or the (name,hash) tuple is seen
    on a single host. Method (Symbolic Logic): Symbolic Logic: Alert when process creation events for
    canonical system utilities (names and expected paths drawn from the [LOLBAS catalog](https://lolbas-project.github.io/))
    have hashes matching known malicious indicators from an integrated TI feed (first-party correlation;
    no live external lookup required if feed is mirrored locally). A positive result is an instance matching
    the evidence above (a trusted name/location reused or approximated by an impostor) -- pivot to the
    responsible process, file, account, parent chain, and host, confirm provenance against the known-good
    baseline, and scope adjacent activity. A negative or benign result is typically explained by legitimate
    vendor binaries, sanctioned admin tooling, or known deployment locations; document and allowlist those
    to reduce false positives rather than dropping the detection.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - >-
    NAI: SIEM/Data Lake containing aggregated process creation logs (Sysmon Event ID 1, Windows Event
    ID 4688) from all Windows hosts, with a focus on servers hosting critical services (e.g., Domain Controllers,
    database servers) and user endpoints.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=process (Image IN canonical_lolbas_names)
      | eval sha=lower(Hashes.SHA256)
      | lookup ti_feed_known_bad sha256 AS sha OUTPUT verdict
      | where verdict="malicious"
      | table _time host Image sha ParentImage verdict
