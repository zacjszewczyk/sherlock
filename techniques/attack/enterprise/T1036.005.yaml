  - technology: SIEM/Stats pseudocode
    query: |-
      index=create resource_name=*
      | eval d=min_levenshtein(resource_name, legit_name_dictionary), ent=shannon(resource_name)
      | where (d>=1 AND d<=2) OR has_mixed_script(resource_name) OR has_unicode_confusable(resource_name)
      | sort d
- question: >-
    [Machine Learning] ML name-legitimacy classification: Does the available telemetry reveal this condition?
    Evidence under investigation: A process, file, Registry key, service, or container/pod/namespace resource
    is created with a name that closely approximates — but does not exactly match — a legitimate trusted
    resource name (e.g., scvhost.exe vs svchost.exe, 1sass.exe vs lsass.exe, a pod named like a kube-system
    workload, or names using Unicode homoglyphs).
  context: >-
    Tactic context (TA0005 Stealth): the adversary is trying to hide and conceal their actions by blending
    in with legitimate activity; under T1036.005 they reuse or approximate the names/locations of trusted
    resources so malicious activity is indistinguishable from benign system operations. What to look for
    and why: A process, file, Registry key, service, or container/pod/namespace resource is created with
    a name that closely approximates — but does not exactly match — a legitimate trusted resource name
    (e.g., scvhost.exe vs svchost.exe, 1sass.exe vs lsass.exe, a pod named like a kube-system workload,
    or names using Unicode homoglyphs). Method (Machine Learning): Machine Learning: Score names with
    a character-frequency / token model (cosine similarity to the legitimate-name corpus, per [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf);
    RF/XGBoost over lexical features per [Mal-API-2019 evaluation](https://arxiv.org/abs/2403.02232))
    and surface the nearest legitimate name plus the top-3 distinguishing characters in the alert. A positive
    result is an instance matching the evidence above (a trusted name/location reused or approximated
    by an impostor) -- pivot to the responsible process, file, account, parent chain, and host, confirm
    provenance against the known-good baseline, and scope adjacent activity. A negative or benign result
    is typically explained by legitimate vendor binaries, sanctioned admin tooling, or known deployment
    locations; document and allowlist those to reduce false positives rather than dropping the detection.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - kubernetes:apiserver
  - auditd:SYSCALL (execve)
  - >-
    NAI: Process creation, file/Registry/service creation, and container orchestration (Kubernetes apiserver
    resource creation) telemetry across all platforms, compared against a maintained dictionary of legitimate
    trusted resource names and namespaces.
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      # char-frequency/token model + RF/XGBoost over lexical features
      sim = cosine(charfreq(resource_name), legit_name_corpus)
      score = rf_xgb.predict_proba(lexical_features(resource_name))
      if score>=threshold or sim<sim_floor:
          alert(resource_name, nearest=nearest_legit(resource_name), top3=distinguishing_chars)
