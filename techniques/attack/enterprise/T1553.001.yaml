questions:
- question: '[Defense Impairment] Match malicious macOS download hashes and C2 infrastructure: Can you
    determine whether A file (e.g., DMG, PKG, APP) is transferred over the network, and its hash matches
    a known malware signature, or a macOS endpoint connects to a network indicator (IP, domain) associated
    with malware that uses Gatekeeper bypass techniques. -- specifically, using the ''Match malicious
    macOS download hashes and C2 infrastructure'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary subverts macOS
    Gatekeeper trust controls so that unsigned, un-notarized, or otherwise untrusted code can run without
    the expected user prompts -- degrading defenders'' ability to trust what executes on the host. This
    evidence focuses on the condition that A file (e.g., DMG, PKG, APP) is transferred over the network,
    and its hash matches a known malware signature, or a macOS endpoint connects to a network indicator
    (IP, domain) associated with malware that uses Gatekeeper bypass techniques. This Symbolic Logic approach
    works as follows: Continuously process Zeek files.log, hash all observed files (focus on MIME types
    application/x-mach-binary, application/x-apple-diskimage, com.apple.installer-package-archive and
    .dmg/.pkg/.app/.zip extensions), and join SHA256 results against a threat-intelligence feed of known-malware
    hashes. Correlate with Zeek http.log macOS user-agent strings. Join destination IP (Zeek conn.log)
    and queried domain (Zeek dns.log) against a C2 feed and alert on any match from a known macOS host
    range. Add deterministic TLS allow/deny-listing using [JA3](https://github.com/salesforce/ja3)/[JA4+](https://github.com/FoxIO-LLC/ja4)
    fingerprints of the TLS ClientHello, flagging implant fingerprints regardless of SNI/IP. Note that
    USB/optical/network-share/curl-delivered payloads never traverse files.log, so this must be layered
    with on-host detection per [theevilbit](https://theevilbit.github.io/posts/gatekeeper_not_a_bypass/).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable Gatekeeper
    bypass or trust-control tampering; pivot to the responsible process and its parent lineage, the user
    and host context, the source file''s origin and quarantine/signature state, any downstream execution,
    and subsequent external network callbacks. A negative result helps rule out this particular bypass
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy delivery paths (USB, optical media, network shares, curl, or archive/DMG payloads)
    that never set or propagate the quarantine flag.'
