name: 'T1553.001: Subvert Trust Controls: Gatekeeper Bypass'
id: 29b4a9bc-3e12-41b7-a8dc-71a385db39b9
description: 'This playbook helps an analyst investigate whether an adversary is subverting macOS Gatekeeper
  to execute untrusted code, evading the trust controls that ensure only signed, notarized, and policy-compliant
  applications run on a host (Defense Impairment). Gatekeeper relies on the `com.apple.quarantine` extended
  attribute set on downloaded files, code-signing and Developer ID checks, notarization verification against
  Apple servers, and the QuarantineEvents database; adversaries bypass these by stripping or never setting
  the quarantine flag (via xattr -d/-c, removexattr, ditto, find -exec, AppleScript, or curl/USB/network-share
  delivery), by disabling quarantine flagging (LSFileQuarantineEnabled=false in an app''s Info.plist or
  spctl --master-disable / syspolicyd policy edits), by tampering with the QuarantineEventsV2 database,
  and by executing unsigned, ad-hoc, invalid, revoked, or non-notarized binaries. The hunt spans macOS
  endpoint telemetry (Endpoint Security Framework ES_EVENT_TYPE_NOTIFY_EXEC, Sysmon for macOS, osquery,
  unified logs, FIM/EDR file events) and network telemetry (Zeek files/conn/dns/http/ssl logs) at egress
  points, DNS resolvers, and web proxies. It guides the analyst across several angles: matching downloaded
  DMG/PKG/APP file hashes and C2 infrastructure against threat intelligence; detecting quarantine-attribute
  removal and its anomalous parent processes; correlating download -> de-quarantine -> execute -> external-callback
  chains within a tight time window; flagging execution of quarantined binaries with bad code signatures
  or failed notarization; and catching tampering with the quarantine database or Info.plist trust keys.
  Detection methods combine symbolic-logic rules, statistical baselining (parent-child probabilities,
  certificate/Team ID prevalence, new-domain and failure-mode profiling), and machine-learning models
  (Random Forest C2 classification, Hidden Markov sequence modeling, FFT beacon detection, one-class SVM
  signature novelty, Isolation Forest file-modification anomalies) so the analyst can corroborate suspected
  Gatekeeper bypass across host trust state, process lineage, file metadata, and network behavior.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
