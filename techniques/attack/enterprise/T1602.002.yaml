questions:
- question: '[Collection] Config tool hash match: Can you determine whether A process execution (Windows
    Event ID 4688) on a management host, where the process hash matches a known IOC for a network reconnaissance
    tool, is correlated with an outbound network connection (Zeek conn.log) to a known malicious C2 server
    IP or domain (Zeek dns.log) within a 5-minute window. -- specifically, using the ''Config tool hash
    match'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary collects network device
    configuration files to harvest the network''s layout, device details, and reusable credentials (enable
    secrets, SNMP communities, crypto keys). This evidence focuses on the condition that A process execution
    (Windows Event ID 4688) on a management host, where the process hash matches a known IOC for a network
    reconnaissance tool, is correlated with an outbound network connection (Zeek conn.log) to a known
    malicious C2 server IP or domain (Zeek dns.log) within a 5-minute window. This Symbolic Logic approach
    works as follows: Match EID 4688 process hashes on management jump boxes against a curated list of
    config-dump/recon tools (Smart Install Exploitation Tool/SIET, snmpwalk, snmpbulkget, ncat) and correlate
    with Zeek conn/dns to outbound non-management destinations within a 5-minute window; log the matched
    session for analyst review Russian State-Sponsored Cyber Actors Targeting Network Infrastructure Devices
    (TA18-106A). A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    network device configuration collection; pivot to the responsible host, user/source IP, and process
    lineage, the targeted network devices and management ports, the protocol used (SNMP/SMI/CLI/TFTP/SCP/FTP),
    and the volume and timing of any transfer to scope what configuration data and credentials may have
    been exposed. A negative result helps rule out this particular collection vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, encrypted, or
    low-and-slow activity.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Management jump boxes, DNS resolvers, Internet gateway firewall, Network device management interfaces'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Config tool hash match

      SEARCH events matching the rule logic described above

      // match indicators/hashes/keywords/ports/commands against curated lists

      | WHERE source NOT IN approved_management_hosts

      | ALERT and log session for analyst review'
  - technology: Zeek/pseudocode
    query: '// Zeek view for: Config tool hash match

      FROM relevant Zeek logs (Zeek conn.log, Zeek dns.log)

      APPLY the Symbolic Logic logic above over the same fields

      | OUTPUT matching uid/connection records for correlation'
- question: '[Collection] Outbound volume and failure profile: Can you determine whether A process execution
    (Windows Event ID 4688) on a management host, where the process hash matches a known IOC for a network
    reconnaissance tool, is correlated with an outbound network connection (Zeek conn.log) to a known
    malicious C2 server IP or domain (Zeek dns.log) within a 5-minute window. -- specifically, using the
    ''Outbound volume and failure profile'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary collects network device
    configuration files to harvest the network''s layout, device details, and reusable credentials (enable
    secrets, SNMP communities, crypto keys). This evidence focuses on the condition that A process execution
    (Windows Event ID 4688) on a management host, where the process hash matches a known IOC for a network
    reconnaissance tool, is correlated with an outbound network connection (Zeek conn.log) to a known
    malicious C2 server IP or domain (Zeek dns.log) within a 5-minute window. This Statistical Method
    approach works as follows: Per management host track outbound bytes (orig_bytes) per 5-min window
    plus the rate of NXDOMAIN/failed DNS resolutions and blocked/reset connections; alert on volume change-points
    (CUSUM/PELT) beyond the per-host baseline when accompanied by an elevated failure rate, and keep the
    existing 95th-percentile Zeek dns.log domain-entropy spike as a parallel deterministic floor A Survey
    of Methods for Time Series Change Point Detection. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable network device configuration collection; pivot to the
    responsible host, user/source IP, and process lineage, the targeted network devices and management
    ports, the protocol used (SNMP/SMI/CLI/TFTP/SCP/FTP), and the volume and timing of any transfer to
    scope what configuration data and credentials may have been exposed. A negative result helps rule
    out this particular collection vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, encrypted, or low-and-slow activity.'
