name: 'T1602.002: Network Device Configuration Dump'
id: e07f4f53-772d-4fad-95de-34197204f67c
description: 'This playbook helps an analyst investigate whether an adversary is accessing and dumping
  network device configuration files to collect sensitive data about the device and the network (MITRE
  ATT&CK T1602.002, Network Device Configuration Dump). Network configuration files (running-config, startup-config)
  reveal the target network''s layout, the device hardware and software, and legitimate accounts and credentials
  (enable secrets, SNMP communities, crypto keys) that an adversary can reuse. Adversaries commonly use
  management tools and protocols -- SNMP (snmpwalk/snmpbulkget GETBULK), Cisco Smart Install (SMI, TCP/4786),
  and CLI/API commands such as ''show running-config'' or ''copy running-config'' to TFTP/SCP/FTP -- to
  query a configuration repository or coerce the device to export its configuration. Under the Collection
  tactic, this hunt spans management jump boxes, general user workstations, network backbone sensors,
  authentication servers (RADIUS/TACACS+), and the network device management interfaces themselves. It
  pursues the behavior from several complementary angles: process executions of config-dump/recon tooling
  on management hosts correlated with outbound C2; unauthorized management/recon command lines run on
  non-admin hosts; unencrypted FTP/TFTP/HTTP transfers whose content or filename matches configuration
  keywords; anomalous connections to management ports (22/23/161/4786) from non-approved sources or at
  unusual volume; and automated fan-out where one source touches many devices quickly. Detection methods
  combine deterministic symbolic-logic rules (tool-hash matches, command-line and config-keyword regex,
  unauthorized-port and fan-out rules), statistical baselining (CUSUM/PELT change-point detection, percentile/3-sigma
  outliers, SNMP byte-ratio and failure-rate profiling, sensitivity scoring), and machine learning (Random
  Forest exfil/config classifiers, Naive Bayes config labeling, LSTM/DeepLog command-sequence modeling,
  Isolation Forest, DBSCAN/autoencoder auth clustering, ARIMA/Prophet volume forecasting), applied across
  Windows Event ID 4688/4624, Sysmon Event ID 1, and Zeek conn/dns/files/ftp/http/ssh/snmp logs.'
type: technique
