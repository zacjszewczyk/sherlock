name: 'T1556.002: Modify Authentication Process: Password Filter DLL'
id: 8dccdc92-fa9f-4f92-a901-3f98db00b057
description: 'Investigate whether an adversary has registered a malicious Windows password filter DLL
  into the authentication process to harvest plaintext credentials, maintain persistence, and impair defensive
  trust in the LSA. This playbook helps an analyst hunt for and triage: modifications to the ''HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Notification
  Packages'' registry value that add new or previously unseen DLLs; filter DLLs that are unsigned, low-prevalence,
  non-System32-resident, typosquatted, timestomped, or packed (high entropy); new or unauthorized modules
  loaded into lsass.exe; registry changes made by suspicious scripting/Office processes; and post-compromise
  LSASS behaviors such as outbound network connections, file writes to temp/non-standard locations, and
  child-process creation. Each question pairs symbolic-logic rules, statistical baselining/frequency analysis,
  and machine-learning approaches across registry, file, process, module-load, and network telemetry on
  Domain Controllers and endpoints, tied to the Persistence, Credential Access, and Defense Impairment
  tactics.'
type: technique
