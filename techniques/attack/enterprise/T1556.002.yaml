questions:
- question: Has the 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Notification Packages' value been modified
    to add a new or previously unseen DLL name, and was the change made without a paired trusted-installer/reboot
    context?
  context: 'Legitimate password filter registration is rare, performed by administrators or trusted installers,
    and only takes effect after a reboot. Build a detection that fires on any change to the Notification
    Packages REG_MULTI_SZ value (Sysmon Event ID 13 / Windows Event ID 4657), diffs the new contents against
    the prior value to extract the added DLL base name, and also matches the command-line registration
    pattern (reg add or PowerShell Set-ItemProperty referencing the LSA key plus the ''scecli\0*'' delimiter).
    Correlate the added DLL against the corresponding Sysmon Event ID 11 file-create hash and query threat
    intel. A positive result is any added entry, especially one lacking a paired trusted-installer or
    reboot context; a negative result confirms the registered filter set is unchanged. From a Defense
    Impairment perspective, a malicious password filter undermines the trustworthiness of the authentication
    pipeline itself: it sits inside LSASS, a Protected Process the SOC must be able to trust, and silently
    subverts a security control (password policy enforcement) to harvest secrets without tripping conventional
    alarms. Detecting it restores confidence that the authentication path has not been tampered with.
    Source evidence: A modification event is recorded for the ''HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Notification
    Packages'' registry key, where the value data includes a new or previously unseen DLL name. Method
    detail: Symbolic Logic: Create a SIEM rule to trigger on any modification to the ''HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Notification
    Packages'' value (Sysmon Event ID 13 / Windows Event ID 4657), diffing the new REG_MULTI_SZ contents
    against the prior value to extract the added DLL base name. Also match the command-line registration
    pattern (reg add / PowerShell Set-ItemProperty containing the LSA key path plus the ''scecli\0*''
    delimiter) per [Dropping Of Password Filter DLL Sigma](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_reg_credential_access_via_password_filter.yml).
    Because legitimate registration is rare, admin-driven, and reboot-gated [Microsoft: Installing and
    Registering a Password Filter DLL](https://learn.microsoft.com/en-us/windows/win32/secmgmt/installing-and-registering-a-password-filter-dll),
    correlate with the corresponding Sysmon Event ID 11 file hash, query threat intel, and generate a
    critical alert on any match or on an entry lacking a paired trusted-installer/reboot context.'
  answer_sources: &id001
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 11
  - 'NAI: Registry and file systems on all Domain Controllers, specifically the ''HKLM\SYSTEM\CurrentControlSet\Control\Lsa''
    key and the ''%SystemRoot%\System32\'' directory.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  src IN (WinEventLog:Security EventCode=4657, WinEventLog:Sysmon EventCode=13)\n  AND\
      \ TargetObject ENDSWITH \"\\\\Control\\\\Lsa\\\\Notification Packages\"\n  | eval added = diff(new_value,\
      \ prev_value)\n  WHERE added != null\n  | join file_hash from (Sysmon EventCode=11 where TargetFilename\
      \ ENDSWITH added+\".dll\")\n  | lookup threat_intel file_hash\n  | where NOT preceded_by(trusted_installer\
      \ OR reboot)\n  | alert severity=critical"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  process_creation where CommandLine MATCHES /(reg add|Set-ItemProperty).*Lsa.*Notification\
      \ Packages.*scecli\\\\0/i\n  | alert severity=critical, msg=\"Password filter registration command\""
- question: When a DLL is added to 'Notification Packages', how rare is that DLL across the fleet, and
    does the per-DC modification frequency exceed its 90-day baseline?
  context: 'Maintain an enterprise-wide historical set of every DLL ever registered in Notification Packages
    and compute fleet prevalence (count of hosts) for each new entry. The frequency of modifications to
    this key is normally near zero per Domain Controller, so derive a threshold from a 90-day per-role
    baseline and alert beyond mean+3sigma or on any zero-frequency process. A prevalence of 1 (first-ever
    registration anywhere in the fleet) is a high-risk anomaly requiring immediate review; a high prevalence
    across many comparable DCs is more consistent with a sanctioned deployment. From a Defense Impairment
    perspective, a malicious password filter undermines the trustworthiness of the authentication pipeline
    itself: it sits inside LSASS, a Protected Process the SOC must be able to trust, and silently subverts
    a security control (password policy enforcement) to harvest secrets without tripping conventional
    alarms. Detecting it restores confidence that the authentication path has not been tampered with.
    Source evidence: A modification event is recorded for the ''HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Notification
    Packages'' registry key, where the value data includes a new or previously unseen DLL name. Method
    detail: Statistical Method: Maintain an enterprise-wide historical set of all DLLs ever registered
    in ''Notification Packages'' and compute fleet prevalence (count of hosts) for each new entry, following
    the fleet-wide DLL frequency approach in [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).
    Frequency (count/min) of modifications to this key is normally ~0 per DC; derive the threshold from
    a 90-day per-role baseline (alert beyond mean+3sigma or any zero-frequency process) per [Finding Anomalies
    in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
    Prevalence==1 (first-ever registration) is a high-risk anomaly requiring immediate review.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=registry TargetObject=\"*Lsa\\\\Notification Packages*\"\n  | stats dc(host) AS\
      \ prevalence BY added_dll\n  | append [ historical_baseline per_role 90d mods_per_min ]\n  | eval\
      \ z=(rate-mean)/stdev\n  | where prevalence==1 OR z>3 OR rate>0\n  | alert priority=high"
- question: Does a trained classifier label a Notification Packages registry modification as malicious
    based on the modifying process, user privilege, timing, DLL rarity, and absence of an install+reboot?
  context: 'Train a supervised classifier (e.g., Random Forest) on registry-modification features: modifying
    process and its parent, user context/privilege, time-of-day versus the user baseline, DLL name prevalence/rarity,
    and whether a preceding install and reboot occurred. Complement it with an adaptive misuse detector
    trained on evaded rules to catch renamed or obfuscated registration commands. The alert must surface
    the top-3 contributing features (e.g., modifier=powershell.exe, DLL prevalence=1, no reboot correlation)
    alongside the score so an analyst can triage quickly. From a Defense Impairment perspective, a malicious
    password filter undermines the trustworthiness of the authentication pipeline itself: it sits inside
    LSASS, a Protected Process the SOC must be able to trust, and silently subverts a security control
    (password policy enforcement) to harvest secrets without tripping conventional alarms. Detecting it
    restores confidence that the authentication path has not been tampered with. Source evidence: A modification
    event is recorded for the ''HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Notification Packages'' registry
    key, where the value data includes a new or previously unseen DLL name. Method detail: Machine Learning:
    Train a supervised classifier (e.g., Random Forest) on registry-modification features (modifying process
    and parent, user context/privilege, time-of-day vs. user baseline, DLL name prevalence/rarity, presence
    of a preceding install+reboot) to label each event benign/malicious; complement with an adaptive misuse
    detector trained on evaded rules to catch renamed/obfuscated registration commands [AMIDES](https://github.com/fkie-cad/amides).
    The alert MUST surface the top-3 contributing features (e.g., ''modifier=powershell.exe'', ''DLL prevalence=1'',
    ''no reboot correlation'') alongside the score for triage.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [modifier_image, parent_image, user_priv, hour_vs_baseline,\n           \
      \  dll_prevalence, preceding_install_reboot]\n  score = RandomForest.predict_proba(features)\n \
      \ misuse = AMIDES.score(commandline)\n  if score>thresh OR misuse>thresh: alert(top3=shap(features))"
- question: Is a DLL registered as a password filter unsigned, located outside '%SystemRoot%\System32\',
    or missing the required password-filter export functions?
  context: 'Genuine password filters are Authenticode-signed, reside in System32, and export InitializeChangeNotify,
    PasswordFilter, and PasswordChangeNotify. Build a composite rule that fires when a DLL is added to
    Notification Packages (Sysmon Event ID 13) AND its file properties (from EDR or Sysmon Event ID 7/11)
    show it is unsigned OR its path is not System32. Also verify the DLL exports the three required functions;
    their absence indicates a non-conformant, suspicious filter. An unsigned image loaded into lsass.exe
    is a high-fidelity indicator of a malicious filter. From a Defense Impairment perspective, a malicious
    password filter undermines the trustworthiness of the authentication pipeline itself: it sits inside
    LSASS, a Protected Process the SOC must be able to trust, and silently subverts a security control
    (password policy enforcement) to harvest secrets without tripping conventional alarms. Detecting it
    restores confidence that the authentication path has not been tampered with. Source evidence: A DLL
    registered as a password filter is found to be unsigned, has an enterprise-wide installation prevalence
    of 1, or resides outside the standard ''%SystemRoot%\System32\'' directory. Method detail: Symbolic
    Logic: Create a composite SIEM rule that triggers if a DLL is added to ''Notification Packages'' (Sysmon
    Event ID 13) AND its file properties (EDR or Sysmon Event ID 7/11) indicate it is unsigned OR its
    path is not ''%SystemRoot%\System32\''. Legitimate filters are Authenticode-signed and System32-resident,
    so an unsigned image loaded into lsass.exe is a high-fidelity match per [Unsigned Image Loaded Into
    LSASS Sigma](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/image_load/image_load_lsass_unsigned_image_load.yml)
    and the platform spec [Microsoft: Password Filters](https://learn.microsoft.com/en-us/windows/win32/secmgmt/password-filters).
    Additionally verify the DLL exports InitializeChangeNotify/PasswordFilter/PasswordChangeNotify; absence
    indicates a non-conformant (suspicious) filter.'
  answer_sources: &id002
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - 'NAI: Process, registry, and file system audit logs on all Domain Controllers; enterprise-wide software
    and asset inventory database.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  registry EventCode=13 TargetObject=\"*Notification Packages*\"\n  | join dll on (Sysmon\
      \ EventCode=7 OR 11)\n  | where signed==false OR NOT path STARTSWITH \"%SystemRoot%\\\\System32\\\
      \\\"\n         OR NOT exports HAS_ALL [InitializeChangeNotify,PasswordFilter,PasswordChangeNotify]\n\
      \  | alert severity=critical"
- question: Does the central software/asset inventory show the registered filter DLL hash on very few
    hosts, and is the file large or high-entropy enough to suggest packing?
  context: 'On a Notification Packages alert, query the central software inventory for the new DLL hash
    and compute prevalence (count of hosts) using fleet-wide frequency analysis. Escalate when prevalence
    falls below a statistically derived low-frequency threshold (e.g., fewer than 5 hosts or the 1st percentile).
    Combine with file volume features such as size and Shannon entropy (>7.2 indicating packing) to raise
    severity. A widely deployed, signed, low-entropy DLL is likely benign; a near-unique, high-entropy
    binary is a strong lead. From a Defense Impairment perspective, a malicious password filter undermines
    the trustworthiness of the authentication pipeline itself: it sits inside LSASS, a Protected Process
    the SOC must be able to trust, and silently subverts a security control (password policy enforcement)
    to harvest secrets without tripping conventional alarms. Detecting it restores confidence that the
    authentication path has not been tampered with. Source evidence: A DLL registered as a password filter
    is found to be unsigned, has an enterprise-wide installation prevalence of 1, or resides outside the
    standard ''%SystemRoot%\System32\'' directory. Method detail: Statistical Method: Upon a ''Notification
    Packages'' alert, query the central software inventory for the new DLL hash and compute prevalence
    (count of hosts) using the fleet-wide frequency method in [Using Frequency Analysis to Defend Office
    365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).
    Escalate when prevalence falls below a statistically derived low-frequency threshold (e.g., < 5 hosts
    or 1st percentile). Combine with file Volume features (size, Shannon entropy >7.2 indicating packing
    per [Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989)) to raise severity.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  lookup inventory file_hash=$dll_hash\n  | stats dc(host) AS prevalence, values(size)\
      \ AS size, values(entropy) AS H\n  | where prevalence<5 OR prevalence<=p1(prevalence) \n  | eval\
      \ sev = if(H>7.2,\"high\",\"medium\")\n  | alert"
- question: Does an Isolation Forest flag a newly registered filter DLL as an outlier across signature,
    prevalence, path, publisher rarity, size, and entropy?
  context: 'Apply an Isolation Forest to all newly registered filter DLLs using features is_signed (bool),
    prevalence_count (int), path_is_standard (bool), publisher_rarity_score (float), file_size, and entropy.
    Output an anomaly score and, for explainability, the top-3 features pushing the score (e.g., is_signed=false,
    prevalence=1, entropy=7.8). Treat a missing or invalid digital signature as a distinct failure-mode
    feature rather than folding it into the score, so unsigned filters are never masked by otherwise benign-looking
    attributes. From a Defense Impairment perspective, a malicious password filter undermines the trustworthiness
    of the authentication pipeline itself: it sits inside LSASS, a Protected Process the SOC must be able
    to trust, and silently subverts a security control (password policy enforcement) to harvest secrets
    without tripping conventional alarms. Detecting it restores confidence that the authentication path
    has not been tampered with. Source evidence: A DLL registered as a password filter is found to be
    unsigned, has an enterprise-wide installation prevalence of 1, or resides outside the standard ''%SystemRoot%\System32\''
    directory. Method detail: Machine Learning: Apply Isolation Forest [Liu, Ting & Zhou](https://doi.org/10.1145/2133360.2133363)
    to all newly registered filter DLLs using features is_signed (bool), prevalence_count (int), path_is_standard
    (bool), publisher_rarity_score (float), file_size, and entropy. Output an anomaly score and, for explainability,
    the top-3 features pushing the score (e.g., ''is_signed=false'', ''prevalence=1'', ''entropy=7.8'')
    in the alert text. Treat a missing/invalid digital signature as a distinct failure-mode feature rather
    than folding it into the score.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = [is_signed, prevalence_count, path_is_standard,\n       publisher_rarity, file_size,\
      \ entropy]\n  score = IsolationForest.decision_function(X)\n  if not is_signed: flag(\"unsigned\"\
      )  # distinct failure-mode\n  if score<thresh: alert(top3=feature_contrib(X))"
- question: Has lsass.exe loaded a DLL that is not on the per-build/per-role allow-list of authorized
    modules, and is that module unsigned or untied to a Notification Packages registration?
  context: 'For each server OS build and role, maintain a strict allow-list of DLLs authorized to load
    into lsass.exe and alert on any DLL load (Sysmon Event ID 7, ImageLoaded by *\lsass.exe) not on the
    list, prioritizing unsigned modules. Cross-reference the loaded module against the current Notification
    Packages value so that a new filter load is tied back to its registration. A load that is both off
    allow-list and unsigned, or that has no corresponding sanctioned registration, is a high-fidelity
    indicator of a malicious filter being activated inside LSASS. From a Defense Impairment perspective,
    a malicious password filter undermines the trustworthiness of the authentication pipeline itself:
    it sits inside LSASS, a Protected Process the SOC must be able to trust, and silently subverts a security
    control (password policy enforcement) to harvest secrets without tripping conventional alarms. Detecting
    it restores confidence that the authentication path has not been tampered with. Source evidence: A
    new or previously unobserved DLL is loaded by the lsass.exe process on a Domain Controller. Method
    detail: Symbolic Logic: For each server OS build and role, maintain a strict allow-list of DLLs authorized
    to load into lsass.exe and alert on any DLL load (Sysmon Event ID 7, ImageLoaded by *\lsass.exe) not
    on the list, prioritizing unsigned modules [Unsigned Image Loaded Into LSASS Sigma](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/image_load/image_load_lsass_unsigned_image_load.yml).
    Cross-reference the loaded module against the current ''Notification Packages'' value so a new filter
    load is tied to its registration [Microsoft: Password Filters](https://learn.microsoft.com/en-us/windows/win32/secmgmt/password-filters).'
  answer_sources: &id003
