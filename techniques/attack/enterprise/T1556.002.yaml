      \  | eval unsigned = (Signed==false)\n  | eval tied = ImageLoaded IN current_notification_packages\n\
      \  | where unsigned OR NOT tied\n  | alert severity=high"
- question: Has the set of DLLs loaded into lsass.exe on a DC diverged from its 30-day baseline (Jaccard
    < ~0.95), or has the rate of distinct new modules spiked above mean+3sigma?
  context: 'For each DC, baseline the set of DLLs loaded into lsass.exe over a 30-day rolling window and
    compute the daily Jaccard similarity to the baseline; a score below about 0.95 indicates a significant
    module-set change. Also track the frequency (count/hour) of distinct new modules and alert when it
    exceeds the role baseline mean+3sigma. A sudden drop in similarity or a burst of new modules suggests
    a filter (or other code) was injected into the authentication process. From a Defense Impairment perspective,
    a malicious password filter undermines the trustworthiness of the authentication pipeline itself:
    it sits inside LSASS, a Protected Process the SOC must be able to trust, and silently subverts a security
    control (password policy enforcement) to harvest secrets without tripping conventional alarms. Detecting
    it restores confidence that the authentication path has not been tampered with. Source evidence: A
    new or previously unobserved DLL is loaded by the lsass.exe process on a Domain Controller. Method
    detail: Statistical Method: For each DC, baseline the set of DLLs loaded into lsass.exe over a 30-day
    rolling window and compute the daily Jaccard similarity to the baseline; a score below ~0.95 indicates
    significant module-set change. Track the Frequency (count/hour) of distinct new modules and alert
    when it exceeds the role baseline mean+3sigma per [Finding Anomalies in Windows Event Logs Using Standard
    Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
