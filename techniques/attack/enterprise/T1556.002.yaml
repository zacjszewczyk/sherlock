- question: Is a newly registered filter name within an edit distance of 1-2 of a legitimate System32
    DLL, especially while unsigned or having prevalence==1?
  context: 'For any new name added to Notification Packages, compute the Levenshtein (edit) distance to
    every legitimate DLL in System32. A distance of 1-2 strongly indicates typosquatting, particularly
    when the DLL is also unsigned or has a fleet prevalence of 1. Flag and alert on such near-collisions.
    A name identical to a known-good filter that is signed and widely deployed is benign; a one-character
    variant of a system DLL that is rare and unsigned is a clear deception attempt. From a Defense Impairment
    perspective, a malicious password filter undermines the trustworthiness of the authentication pipeline
    itself: it sits inside LSASS, a Protected Process the SOC must be able to trust, and silently subverts
    a security control (password policy enforcement) to harvest secrets without tripping conventional
    alarms. Detecting it restores confidence that the authentication path has not been tampered with.
    Source evidence: A DLL registered in ''Notification Packages'' has a filename that is a close variant
    of a known legitimate system DLL (e.g., ''rassapi32.dll'' vs. ''rasapi32.dll''), indicating potential
    typosquatting. Method detail: Statistical Method: For any new name added to ''Notification Packages'',
    compute the Levenshtein distance to every legitimate DLL in ''%SystemRoot%\System32\''; a distance
    of 1-2 (especially when the DLL is unsigned or has prevalence==1 per [Using Frequency Analysis to
    Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365))
    strongly indicates typosquatting and should alert.'
