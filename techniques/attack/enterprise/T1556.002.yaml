- question: Does a DLL name added to 'Notification Packages' match a known typosquatting blocklist or
    resemble a legitimate system DLL while failing the signed/System32/required-exports invariant?
  context: 'Maintain a blocklist of known malicious or typosquatted filter DLL names (e.g., ''rassapi32.dll''
    versus the legitimate ''rasapi32.dll'') and alert on any match when Notification Packages is modified
    (Sysmon Event ID 13). Also enforce the platform invariant that a genuine filter is signed, System32-resident,
    and exports the required functions; a name resembling a system DLL that is unsigned or non-conformant
    is treated as malicious. This catches adversaries trying to hide a filter behind a plausible-looking
    name. From a Defense Impairment perspective, a malicious password filter undermines the trustworthiness
    of the authentication pipeline itself: it sits inside LSASS, a Protected Process the SOC must be able
    to trust, and silently subverts a security control (password policy enforcement) to harvest secrets
    without tripping conventional alarms. Detecting it restores confidence that the authentication path
    has not been tampered with. Source evidence: A DLL registered in ''Notification Packages'' has a filename
    that is a close variant of a known legitimate system DLL (e.g., ''rassapi32.dll'' vs. ''rasapi32.dll''),
    indicating potential typosquatting. Method detail: Symbolic Logic: Maintain a blocklist of known malicious/typosquatted
    filter DLL names and, on a ''Notification Packages'' modification (Sysmon Event ID 13), alert on any
    match. Also enforce the platform invariant that a genuine filter is signed, System32-resident, and
    exports the required functions [Microsoft: Password Filters](https://learn.microsoft.com/en-us/windows/win32/secmgmt/password-filters);
    a name resembling a system DLL that is unsigned or non-conformant is treated as malicious.'
