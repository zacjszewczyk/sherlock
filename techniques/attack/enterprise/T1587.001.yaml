name: 'T1587.001: Malware'
id: 75acb2d4-975d-4bbc-b6e0-b1d965d00e01
description: 'This playbook helps an analyst investigate whether an adversary has developed and deployed
  newly created or uniquely modified malware on the network (MITRE ATT&CK T1587.001, Develop Capabilities:
  Malware). Because the actual development of payloads, droppers, post-compromise tools, backdoors, packers,
  and custom C2 protocols happens outside the victim''s visibility, detection focuses on the post-compromise
  execution and behavior of that malware on enterprise endpoints and across the network. The hunt pursues
  the behavior from several complementary angles: novel or unsigned executables whose hashes have no threat-intel
  reputation, were first seen recently, or exhibit high on-disk entropy consistent with packing/encryption;
  YARA matches against reused implant components such as Cobalt Strike and Metasploit beacons on disk,
  in memory, and in TLS certificates; rare signing publishers and high-entropy image names/command lines
  measured against first-party baselines; correlation of unsigned/high-entropy execution with rapid persistence
  establishment (service, scheduled task, registry autorun); correlation of low-reputation execution with
  outbound network connections and local discovery LOLBins; and command-and-control network patterns including
  periodic beaconing, high-entropy DNS TXT/NULL queries, fast-flux, and non-protocol traffic over standard
  web ports. Detection methods combine deterministic symbolic-logic rules (threat-intel hash/entropy gates,
  YARA signatures, JA3/JA3S TLS fingerprinting, DNS record-type and domain-age checks, timed parent-child
  correlation), statistical baselining (publisher rarity and entropy percentiles, persistence-event standard-deviation
  baselines, beacon inter-arrival/Fourier periodicity scoring, DNS lexical and fast-flux scoring), and
  machine learning (Random Forest/XGBoost PE+API classifiers with SHAP explanations, early API-sequence
  models, provenance-graph GNN anomaly detection, and LSTM/self-supervised beacon and encrypted-traffic
  models), applied across Windows Security and Sysmon events and Zeek conn/dns/ssl logs, so the analyst
  can corroborate suspected adversary-developed malware against process provenance, persistence, discovery
  activity, and C2 network telemetry.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution (Detecting the use of malware developed via T1587.001)
