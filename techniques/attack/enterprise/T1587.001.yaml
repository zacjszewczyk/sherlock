    mode: a spike in failed service-install (Event ID 7045 errors) or access-denied autorun writes is
    itself a distinct signal. A positive result -- a rule match, statistical outlier, or model verdict
    -- indicates probable execution or command-and-control of adversary-developed malware; pivot to the
    responsible process and its parent/child lineage, the user and host, the image hash and signing/publisher
