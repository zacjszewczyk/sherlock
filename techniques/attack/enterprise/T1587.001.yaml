    Frequency (executions/hour), and State (signed vs unsigned, first-seen age) in the alert. A positive
    result -- a rule match, statistical outlier, or model verdict -- indicates probable execution or command-and-control
    of adversary-developed malware; pivot to the responsible process and its parent/child lineage, the
    user and host, the image hash and signing/publisher state, any persistence written, discovery commands
    run, and the destination and timing of outbound connections to scope the intrusion. A negative result
