questions:
- question: '[Execution] Using the ''Threat-intel hash and entropy gate'' (Symbolic Logic) approach, can
    you determine whether an executable file is observed executing that meets one or more of the following
    testable criteria: a) its file hash has zero positive detections across aggregated threat intelligence
    platforms; b) its file hash was first seen by a platform like VirusTotal within the last 72 hours;
    or c) the executable is unsigned or signed by a publisher not present on an established corporate
    allowlist.'
  context: 'Why this matters: Under the Execution tactic (TA0002), the mission question is: Has newly
    developed or uniquely modified malware been executed on the network? Adversary-developed malware (T1587.001)
    is built outside the victim''s view, so the analyst must catch it by its on-host execution and network
    behavior. This evidence focuses on the condition that an executable file is observed executing that
    meets one or more of the following testable criteria: a) its file hash has zero positive detections
    across aggregated threat intelligence platforms; b) its file hash was first seen by a platform like
    VirusTotal within the last 72 hours; or c) the executable is unsigned or signed by a publisher not
    present on an established corporate allowlist. The Symbolic Logic approach works as follows: For every
    new process (Windows Event ID 4688, Sysmon Event ID 1) join the image hash against internal threat-intel
    and reputation feeds and alert when (a) the hash has zero positive detections AND was first-seen <72h,
    OR (b) the image is unsigned/signed by a publisher absent from the corporate allowlist, OR (c) on-disk
    PE Shannon entropy exceeds 7.2 (packed/encrypted heuristic from [Using Entropy Analysis to Find Encrypted
    and Packed Malware](https://ieeexplore.ieee.org/document/4140989)). Keep these concrete thresholds
    as the deterministic floor; tune the 72h/7.2 values per environment but do not remove them. A positive
    result -- a rule match, statistical outlier, or model verdict -- indicates probable execution or command-and-control
    of adversary-developed malware; pivot to the responsible process and its parent/child lineage, the
    user and host, the image hash and signing/publisher state, any persistence written, discovery commands
    run, and the destination and timing of outbound connections to scope the intrusion. A negative result
    helps reduce confidence in this particular vector but should be corroborated with the other questions
    in this playbook, since a single method can miss novel, packed, living-off-the-land, or low-and-slow
    tradecraft. Relevant named area of interest: All Windows endpoints and servers, particularly user
    workstations and public-facing servers.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, particularly user workstations and public-facing servers.'
  range: Last 90 days (correlate parent/child and follow-on events within minutes of the triggering execution)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from process_create (WinEventID=4688 OR Sysmon=1)\n| join ti_reputation on image_sha256\n\
      | where (ti_positive_detections == 0 AND ti_first_seen_age_hours < 72)\n     OR signature_status\
      \ == 'unsigned'\n     OR (signature_status == 'signed' AND publisher NOT IN corporate_allowlist)\n\
      \     OR pe_shannon_entropy > 7.2\n| emit host, user, image, image_sha256, publisher, pe_shannon_entropy,\
      \ ti_first_seen_age_hours"
