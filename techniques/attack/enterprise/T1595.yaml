name: 'T1595: Active Scanning'
id: 50a87cf3-caec-4a09-9538-34e437e1d2c7
description: This playbook helps an analyst investigate whether an adversary is conducting active reconnaissance
  scanning (MITRE ATT&CK T1595) against the organization's internet-facing infrastructure. Active scanning
  is direct, network-based probing of victim infrastructure to enumerate live hosts, open ports, running
  services, software versions, and exploitable weaknesses, and it frequently precedes Exploit Public-Facing
  Application (T1190) or abuse of External Remote Services (T1133). The playbook guides the analyst through
  corroborating inbound source IPs against threat-intelligence feeds of known scanners and anonymizers;
  detecting high connection rejection/failure ratios characteristic of port sweeps; identifying automated-tool
  User-Agent strings and JA3/JA3S TLS fingerprints; profiling anomalous TCP states and flag combinations
  (SYN/FIN/NULL scans); thresholding vertical and horizontal port/host fan-out; and uncovering low-and-slow,
  high-entropy evasive probing. It blends symbolic-logic rules, statistical baselining, and machine-learning
  approaches across Zeek network logs (conn.log, http.log, ssl.log, icmp.log, weird.log), Windows filtering/firewall
  events (5156, 4688, 2004), and cloud flow logs so the analyst can determine the scope, source, intent,
  and targets of suspected reconnaissance.
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any external source IP that initiated inbound connections (confirmed by Zeek conn.log
    and Windows Filtering Platform Event ID 5156) appear on a subscribed threat-intelligence feed of known
    scanners, malicious hosts, or anonymizing proxies?
  context: 'During Reconnaissance, adversaries frequently scan from infrastructure already catalogued
    by threat-intel providers (mass-scan services, bulletproof hosts, Tor/VPN exit nodes, commodity botnets).
    Continuously enriching inbound source IPs from Zeek conn.log and the inbound direction of Windows
    Event ID 5156 against these feeds gives fast, high-confidence corroboration. A match should raise
    a high-severity alert and be enriched with the count of rejected/REJ endpoints and the set of targeted
    ports, which indicates scanning intent rather than benign access. Treat CTI as corroboration only:
    the primary failure-ratio detections must still run on first-party logs without external lookups,
    because adversaries rotate IPs and absence from a feed never clears a host.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network perimeter firewalls, VPN gateways, cloud network security groups (e.g., AWS Security
    Groups, Azure NSGs), and other internet-facing network appliances.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  inbound = conn.log WHERE local_orig=false JOIN winlog EventID=5156 Direction=Inbound\n\
      \  ON src_ip\n  | enrich src_ip WITH cti_feed(category IN [scanner, malicious, anonymizer])\n  |\
      \ WHERE cti_match=true\n  | stats count(distinct dst_port) AS ports, sum(conn_state IN [REJ,S0])\
      \ AS rejected BY src_ip\n  | ALERT severity=high"
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log -> intel framework match src on Intel::ADDR\n  emit notice ActiveScanning::CTI_Match\
      \ with note=ports,rejected_count"
- question: For each external source IP, does the ratio of rejected or unanswered connections (Zeek conn_state
    S0/REJ/RSTR, firewall drops, Windows 5156 drop counts) to total connections over a 10-minute window
    exceed three standard deviations above the external-traffic baseline?
  context: 'The most robust, IP-agnostic discriminator of scanning is the failed-to-successful connection
    ratio: scanners probe many endpoints that never complete a handshake, producing S0 (no reply), REJ
    (rejected), or RSTR states, whereas legitimate clients overwhelmingly complete sessions (SF/RSTO).
    Computing this ratio per source over rolling 10-minute windows and flagging IPs more than 3 standard
    deviations above the learned baseline catches scanners even when they are absent from CTI and even
    when they rotate User-Agents. This Threshold-Random-Walk-style logic runs entirely on first-party
    data. A high ratio with broad port/host coverage strongly indicates a sweep; a low ratio with completed
    sessions argues for benign traffic.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network perimeter firewalls, VPN gateways, cloud network security groups (e.g., AWS Security
    Groups, Azure NSGs), and other internet-facing network appliances.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  events = conn.log + firewall_drops + winlog(5156)\n  | bin 10m BY src_ip\n  | eval failed\
      \ = count(conn_state IN [S0,REJ,RSTR] OR action=drop)\n  | eval ratio = failed / total\n  | eventstats\
      \ mean(ratio) AS mu, stdev(ratio) AS sd OVER baseline\n  | WHERE ratio > mu + 3*sd\n  | ALERT"
- question: When scoring each external source IP with a supervised classifier trained on combined Zeek
    connection features and Windows filtering metadata, is the host classified as a port scanner with
    high confidence?
  context: 'A supervised model (Random Forest or Logistic Regression) trained on labeled scan traffic
    such as the CICIDS2017 PortScan class can learn the joint signature of scanning across many features
    at once: direction, protocol, interface, byte counts, conn_state, and failure ratio. This catches
    scanners that any single rule would miss. Score each inbound source and, on alert, surface the top-3
    contributing features via SHAP attribution so the analyst can validate the verdict (e.g., ''high REJ
    ratio + many distinct ports + tiny byte counts''). Careful dataset selection and baselining are required
    to avoid drift and false positives on legitimate high-volume clients. A high-confidence scanner classification
    corroborated by SHAP features warrants escalation.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network perimeter firewalls, VPN gateways, cloud network security groups (e.g., AWS Security
    Groups, Azure NSGs), and other internet-facing network appliances.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = features(direction, proto, interface, orig_bytes, resp_bytes, conn_state, failure_ratio)\n\
      \  model = RandomForest.load('cicids2017_portscan')\n  score = model.predict_proba(X)[:, PortScan]\n\
      \  IF score > 0.8: ALERT with shap_top3(X)"
- question: Do inbound HTTP/S requests to internet-facing services carry User-Agent strings or JA3/JA3S
    TLS fingerprints matching known scanning tools, or does the parent process in Windows Event ID 4688
    correspond to recon tooling (nmap, nikto, sqlmap, masscan, zgrab, python-requests, curl, wget)?
  context: Automated scanners often betray themselves through default or distinctive User-Agent strings
    and TLS client fingerprints (JA3/JA3S) even when their source IPs rotate. Applying substring/regex
    matching to Zeek http.log user_agent values and Windows 4688 parent command lines, plus matching ssl.log
    JA3/JA3S against a tool deny-list, gives durable detection tied to tooling rather than to ephemeral
    infrastructure. A match should alert regardless of source IP rotation. Note that some legitimate automation
    also uses curl/python-requests, so corroborate with request rate and 4xx ratio before escalating.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - 'NAI: Internet-facing web servers, reverse proxies, Web Application Firewalls (WAFs), and Application
    Load Balancers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  http.log WHERE user_agent MATCHES /(nmap|nikto|sqlmap|masscan|zgrab|python-requests|curl|wget)/i\n\
      \  OR ssl.log.ja3 IN ja3_tool_denylist\n  OR ssl.log.ja3s IN ja3s_tool_denylist\n  OR winlog(4688).parent_cmdline\
      \ MATCHES tool_regex\n  | ALERT"
  - technology: Zeek/pseudocode
    query: ">-\n  http.log -> regex_match(user_agent, tool_patterns)\n  ssl.log -> lookup(ja3, ja3s) IN\
      \ Intel::tool_fingerprints\n  emit notice ActiveScanning::ToolFingerprint"
- question: Are there User-Agent strings or JA3/JA3S fingerprints that are rare across a 24-hour window
    (seen fewer than 5 times) and absent from the allow-list of legitimate browser/app values?
  context: Beyond known-bad signatures, scanners and bespoke tooling produce rare header/TLS fingerprints
    not seen from normal user traffic. By computing 24-hour frequencies of each User-Agent and JA3/JA3S,
    maintaining an allow-list of legitimate browser and application values, and flagging values seen fewer
    than 5 times that are not allow-listed, the analyst surfaces novel automated clients while suppressing
    noise. Surface the initiating process where available. A rare, non-allow-listed fingerprint hitting
    many endpoints suggests reconnaissance; a rare value confined to a single benign transaction is likely
    noise.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - 'NAI: Internet-facing web servers, reverse proxies, Web Application Firewalls (WAFs), and Application
    Load Balancers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  http.log + ssl.log\n  | bin 24h\n  | stats count BY fingerprint(user_agent OR ja3 OR\
      \ ja3s)\n  | WHERE count < 5 AND fingerprint NOT IN allowlist\n  | join initiator_process\n  | ALERT"
- question: Does an Isolation Forest scoring inbound requests on header and process features (User-Agent
    length/entropy, missing Referer/Accept-Language, JA3/JA3S, request rate, 4xx ratio, process path)
    flag any source with a high anomaly score?
  context: Unsupervised anomaly detection catches scanning clients that evade signature and frequency
    rules by mimicking benign headers imperfectly. An Isolation Forest trained on normal request/header/process
    features isolates outliers such as high-entropy or abnormally short User-Agents, missing Referer/Accept-Language
    headers, anomalous request rates, and elevated 4xx ratios. On a high anomaly score, report the top-3
    driving features via SHAP so the analyst can judge whether the anomaly reflects scanning. High scores
    combining missing headers, high request rate, and elevated 4xx ratio are strong reconnaissance indicators.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - 'NAI: Internet-facing web servers, reverse proxies, Web Application Firewalls (WAFs), and Application
    Load Balancers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = features(ua_len, ua_entropy, missing_referer, missing_accept_lang, ja3, ja3s, req_rate,\
      \ ratio_4xx, proc_path)\n  model = IsolationForest.fit(baseline_requests)\n  score = model.score(X)\n\
      \  IF score > threshold: ALERT with shap_top3(X)"
- question: Per source IP, does the ratio of 4xx/404 responses to total requests over a 5-minute window
    exceed the 99th percentile of the web-server baseline?
  context: Vulnerability and path/content scanners (dirbusting, CVE probes) request many non-existent
    paths, producing a high 404/4xx ratio that legitimate users rarely generate. Tracking the per-source
    4xx/404-to-total ratio over 5-minute windows and flagging sources above the 99th percentile of the
    web-server baseline isolates web application reconnaissance. This Failure-mode signal complements
    the connection-State logic for lower layers. A high 404 ratio across many distinct URIs from one source
    strongly suggests path enumeration; investigate the requested paths for sensitive endpoints.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - 'NAI: Internet-facing web servers, reverse proxies, Web Application Firewalls (WAFs), and Application
    Load Balancers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  http.log\n  | bin 5m BY src_ip\n  | eval ratio_4xx = count(status_code >= 400 AND status_code\
      \ < 500) / total\n  | eventstats perc99(ratio_4xx) AS p99 OVER baseline\n  | WHERE ratio_4xx > p99\n\
      \  | ALERT"
- question: Did any single source IP produce more than 100 Zeek conn.log connections in S0, REJ, or RSTR/RSTRH
    states within a 1-minute window, corroborated by Windows Firewall Event ID 2004 drops and weird.log
    indicators?
  context: Burst port scans (SYN/FIN/NULL scans) generate many half-open or rejected connections in a
    very short time. Alerting when a source IP exceeds a tuned threshold (e.g., >100 connections in S0/REJ/RSTR
    states per minute), corroborated by Windows Firewall 2004 blocked/flushed events and weird.log protocol
    anomalies, catches noisy, fast sweeps with high confidence. Tune the count to the site baseline to
    avoid flagging busy legitimate clients or load balancers. A burst of anomalous states across many
    ports/hosts is a hallmark of active scanning.
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - Windows Event ID 2004
  - 'NAI: Network perimeter firewalls, internet-facing hosts, and Internet-facing Windows Servers (e.g.,
    IIS, RDP gateways).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  conn.log WHERE conn_state IN [S0,REJ,RSTR,RSTRH]\n  | bin 1m BY src_ip\n  | stats count\
      \ AS c\n  | WHERE c > 100\n  | join winlog(2004) drops, weird.log anomalies ON src_ip\n  | ALERT\
      \ severity=high"
  - technology: Suricata/pseudocode
    query: ">-\n  threshold: type rate_filter, track by_src, count 100, seconds 60\n  applied to SYN-without-ACK\
      \ / RST-heavy flows"
- question: Does a 5-minute per-source conn_state distribution (including Windows Firewall rejected counts)
    deviate significantly from the benign baseline (dominated by SF/RSTO) toward S0/REJ when tested with
    a chi-squared test?
  context: Rather than a single threshold, comparing the full distribution of connection states per source
    against the benign baseline detects subtle shifts toward scanning behavior. Benign traffic is dominated
    by SF (normal completion) and RSTO; scanners skew toward S0 and REJ. A chi-squared goodness-of-fit
    test over 5-minute per-source distributions, incorporating Windows Firewall rejected counts, flags
    sources whose state mix deviates significantly. This is robust to overall volume and catches both
    fast and moderate scanners. A significant skew toward S0/REJ indicates probing.
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - Windows Event ID 2004
  - 'NAI: Network perimeter firewalls, internet-facing hosts, and Internet-facing Windows Servers (e.g.,
    IIS, RDP gateways).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  conn.log + winlog(2004)\n  | bin 5m BY src_ip\n  | hist conn_state -> observed_dist\n\
      \  | chisq(observed_dist, baseline_dist[SF,RSTO,...])\n  | WHERE p_value < 0.01 AND skew_toward(S0,REJ)\n\
      \  | ALERT"
- question: When forecasting per-IP counts of anomalous connection states (S0, REJ, RSTR from Zeek and
    Windows firewall) with a time-series model, do observed counts exceed the predicted interval, or does
    a Kitsune autoencoder flag high reconstruction error?
  context: Scan activity often appears as a sudden spike above the expected, seasonally-aware level of
    anomalous-state connections. A time-series model (ARIMA/Prophet) per source IP forecasts the expected
    count of S0/REJ/RSTR states; observations exceeding the prediction interval indicate emerging scanning.
    For label-free, real-time coverage, a Kitsune online autoencoder ensemble over incremental flow statistics
    flags high reconstruction error and surfaces the driving features. This combination catches both gradual
    ramp-ups and novel scan patterns. Exceedance of the forecast interval or high reconstruction error
    warrants triage of the source's port/host coverage.
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - Windows Event ID 2004
  - 'NAI: Network perimeter firewalls, internet-facing hosts, and Internet-facing Windows Servers (e.g.,
    IIS, RDP gateways).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  series = count(conn_state IN [S0,REJ,RSTR]) per src_ip per interval\n  model = Prophet.fit(series_history)\n\
      \  IF observed > model.predict_upper: ALERT\n  ALT: kitsune = AutoencoderEnsemble(incremental_flow_stats)\n\
      \  IF kitsune.rmse > threshold: ALERT with top_features"
- question: Within a 1-minute window, does any single source IP connect to more than 50 distinct destination
    ports on one host (vertical scan) or more than 50 distinct hosts on one port (horizontal scan), as
    seen across Zeek conn.log, icmp.log, and Windows Event ID 5156 sessions?
  context: 'The defining behavior of port scanning is fan-out: a vertical scan touches many ports on one
    host (service enumeration), while a horizontal scan touches one port across many hosts (finding all
    instances of a service). Counting distinct destination ports per host and distinct hosts per port
    per source in 1-minute windows and alerting when either exceeds a tuned threshold (e.g., 50) directly
    detects this canonical pattern. Combine Zeek conn.log, icmp.log (ping sweeps), and Windows 5156 sessions.
    Tune to the site baseline; legitimate scanners (vuln management) should be allow-listed. Exceeding
    the threshold strongly indicates reconnaissance.'
  answer_sources:
  - Zeek conn.log
  - Zeek icmp.log
  - Windows Event ID 5156
  - 'NAI: Network perimeter firewalls, demilitarized zone (DMZ) segments, and Cloud VPC Flow Logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  conn.log + icmp.log + winlog(5156)\n  | bin 1m BY src_ip\n  | eval vertical = max(distinct\
      \ dst_port) BY dst_ip\n  | eval horizontal = max(distinct dst_ip) BY dst_port\n  | WHERE vertical\
      \ > 50 OR horizontal > 50\n  | ALERT"
  - technology: Suricata/pseudocode
    query: ">-\n  detect_scan: track by_src, distinct dst_port > 50 OR distinct dst_ip > 50 per 60s"
- question: Over a 5-minute window, does any source IP exceed the 99th-percentile thresholds (derived
    across all external sources) for unique destination ports or unique destination hosts?
  context: Fixed thresholds can miss site-specific norms or generate false positives. Computing 5-minute
    counts of unique destination ports and hosts per source IP across all external sources, deriving the
    99th-percentile cutoffs, and flagging any IP exceeding them adapts the fan-out detection to the environment's
    real traffic distribution. Dataset-specific cutoffs can be calibrated from labeled scans in CICIDS2017
    or internal baselines from the Unified Host and Network Data Set. A source at the extreme tail of
    port/host fan-out is a likely scanner.
  answer_sources:
  - Zeek conn.log
  - Zeek icmp.log
  - Windows Event ID 5156
  - 'NAI: Network perimeter firewalls, demilitarized zone (DMZ) segments, and Cloud VPC Flow Logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  conn.log + winlog(5156)\n  | bin 5m BY src_ip\n  | stats dc(dst_port) AS ports, dc(dst_ip)\
      \ AS hosts\n  | eventstats perc99(ports) AS p99_ports, perc99(hosts) AS p99_hosts\n  | WHERE ports\
      \ > p99_ports OR hosts > p99_hosts\n  | ALERT"
- question: Does DBSCAN clustering of 5-minute batches of [source IP, destination IP, destination port]
    reveal dense clusters indicative of vertical/horizontal scans, or does an Isolation Forest on per-source
    fan-out vectors flag stealthy probers?
  context: Clustering reveals scan structure that thresholds alone miss. Applying DBSCAN to 5-minute batches
    of [source IP, destination IP, destination port] tuples combined with Windows connection metadata
    produces dense clusters where one source touches many ports/hosts (vertical/horizontal scans), while
    noise points isolate stealthy, low-rate probers. Alternatively, scoring per-source fan-out vectors
    with an Isolation Forest and reporting the top-3 features via SHAP highlights outliers. This catches
    both noisy and evasive scanners. Dense scan clusters or outlier fan-out vectors warrant investigation
    of the targeted services.
  answer_sources:
  - Zeek conn.log
  - Zeek icmp.log
  - Windows Event ID 5156
  - 'NAI: Network perimeter firewalls, demilitarized zone (DMZ) segments, and Cloud VPC Flow Logs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  batch = 5m tuples[src_ip, dst_ip, dst_port] + win_metadata\n  labels = DBSCAN(eps, min_samples).fit(batch)\n\
      \  dense_clusters -> scan candidates; noise -> stealthy probers\n  ALT: IsolationForest(per_src\
      \ fanout_vector) -> outliers + shap_top3"
- question: Does any external source exhibit low-and-slow scanning, where the mean inter-probe delta between
    first contacts to new destination ports/hosts exceeds 10 seconds while the 24-hour unique-port count
    exceeds 100?
  context: Sophisticated adversaries deliberately scan slowly to stay under rate-based thresholds. Tracking
    per-source time deltas between first observations of new destination ports/hosts (from Zeek conn.log
    and Windows 5156 timestamps) and alerting when the mean inter-probe delta is large (>10s) yet the
    24-hour unique-port count still exceeds 100 applies first-contact accounting so slow probing accrues
    a scanner verdict despite a low instantaneous rate. This catches evasive reconnaissance that burst-detectors
    miss. A source steadily touching new ports/hosts over many hours is conducting deliberate, stealthy
    scanning.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network perimeter firewalls, log aggregation systems, and SIEM/Data Lake holding long-term network
    logs.'
  range: Last 24 hours (extend the first-contact accumulation window up to 7 days for very slow probers)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  conn.log + winlog(5156)\n  | first_seen(dst_port, dst_ip) BY src_ip\n  | eval delta\
      \ = ts - lag(ts) over new_targets\n  | stats mean(delta) AS mean_delta, dc(dst_port) AS ports_24h\
      \ BY src_ip\n  | WHERE mean_delta > 10s AND ports_24h > 100\n  | ALERT"
- question: Does the Shannon entropy of a source's set of unique destination ports (and hosts) over a
    rolling hour, combined with Windows 5156 counts and the S0/REJ failure ratio, exceed the 98th percentile
    of the baseline?
  context: Broad, uniform probing across many ports/hosts produces high Shannon entropy in the destination
    distribution, distinguishing systematic scanners from clients that repeatedly contact a few endpoints.
    Computing per-source Shannon entropy of unique destination ports and hosts over a rolling hour, incorporating
    Windows 5156 counts and the S0/REJ failure ratio, and flagging sources above the 98th percentile surfaces
    evasive, spread-out reconnaissance. Calibrate against dataset baselines. High entropy combined with
    a high failure ratio is a strong indicator of broad scanning intent.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network perimeter firewalls, log aggregation systems, and SIEM/Data Lake holding long-term network
    logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  conn.log + winlog(5156)\n  | bin 1h BY src_ip\n  | eval H = shannon_entropy(distinct\
      \ dst_port, distinct dst_ip)\n  | eval fail_ratio = count(conn_state IN [S0,REJ]) / total\n  | eventstats\
      \ perc98(H) AS p98\n  | WHERE H > p98 AND fail_ratio high\n  | ALERT"
- question: When modeling historical per-source port/host-entropy and new-edge time series, does a Kitsune
    (or RNN) online autoencoder flag high reconstruction error for any source?
  context: Evasive scanners that defeat thresholds and percentile rules can still be caught by learning
    each source's normal port/host-entropy and new-edge (first-contact) time series and flagging deviations.
    An online autoencoder ensemble (Kitsune) or RNN autoencoder produces high reconstruction error when
    a source's fan-out and entropy patterns diverge from its history and from the population baseline
    (e.g., Unified Host and Network Data Set). Surfacing the top contributing features via SHAP supports
    triage. High reconstruction error tied to rising port/host entropy indicates emerging low-and-slow
    reconnaissance.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network perimeter firewalls, log aggregation systems, and SIEM/Data Lake holding long-term network
    logs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = per_src[port_entropy, host_entropy, new_edge_rate] time series\n  model =\
      \ Kitsune.AutoencoderEnsemble()  # or RNN autoencoder\n  rmse = model.reconstruction_error(features)\n\
      \  IF rmse > threshold: ALERT with shap_top3(features)"
