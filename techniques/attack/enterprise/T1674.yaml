questions:
- question: '[Execution] Input injection IOC matching: Can you determine whether a process command line
    (CommandLine field), DNS query (query field), or HTTP request (host or uri fields) contains a value
    that is an exact match to a known-malicious indicator of compromise (IOC) associated with input injection
    campaigns -- specifically, using the ''Input injection IOC matching'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary uses Input Injection to
    simulate keystrokes or inject input on a victim host -- launching command interpreters via keyboard
    shortcuts, typing or pasting inline scripts, or driving GUI applications, often via malicious USB
    Human Interface Devices (HIDs) or tooling that watches the Windows message loop (e.g., BackSwap-style
    clipboard-paste-and-execute). This evidence focuses on the condition that a process command line (CommandLine
    field), DNS query (query field), or HTTP request (host or uri fields) contains a value that is an
    exact match to a known-malicious indicator of compromise (IOC) associated with input injection campaigns.
    This Symbolic Logic approach works as follows: Join Windows Event ID 4688, Zeek dns.log, and Zeek
    http.log to match CommandLine, query, host, or uri fields against IOC feeds tagged for input injection
    campaigns (e.g., BackSwap clipboard-paste-and-execute domains). Operate on first-party logs; treat
    IOC lookup as enrichment, not a gate. A positive result -- a rule match, statistical outlier, or model
    alert -- indicates probable input injection; pivot to the responsible parent application, the spawned
    interpreter and its command line, the user/session context, any newly enumerated USB HID device (VID/PID,
    interface class), the inter-keystroke timing of the session, and any subsequent download, execution,
    or network activity. A negative result helps rule out this particular injection vector but should
    be corroborated with the other questions in this playbook, since a single method can miss slow, randomized-delay,
    or software-only injection.'
