name: 'T1674: Input Injection'
id: 798362fd-fb69-421d-9903-7927eafb66a2
description: 'This playbook helps an analyst investigate Input Injection -- adversary simulation of keystrokes
  or other input on a victim host to execute commands or code on behalf of the user. An adversary may
  launch a command interpreter via keyboard shortcuts, type or paste an inline script for execution, or
  drive a GUI application directly; these actions may be preprogrammed in tooling or delivered through
  physical Human Interface Devices (HIDs) such as malicious USB ''BadUSB'' devices, and may include BackSwap-style
  monitoring of the Windows message loop to paste and execute malicious JavaScript in a browser. The playbook
  guides the analyst across several investigative angles: matching command line, DNS, and HTTP fields
  against input-injection IOC feeds; correlating user-facing GUI/browser/Office applications spawning
  command interpreters or scripting engines; detecting obfuscated/encoded command lines and abnormal entropy;
  flagging bursts of child processes too fast for human interaction; spotting external JavaScript loads
  that violate per-site allowlists on high-value web apps; correlating new USB keyboard-class HID enumeration
  (including duplicate/spoofed VID/PID and second keyboard interfaces) with rapid interpreter launches;
  and analyzing inter-keystroke timing for sub-human or machine-uniform patterns. Detection methods combine
  symbolic-logic rules, statistical baselining (median+MAD, percentile, Jaccard similarity), and machine
  learning (Random Forest, Isolation Forest/COPOD, XGBoost process-lineage models, LSTM/DeepLog sequence
  models, BERT command-line embeddings, and adversarially-hardened timing classifiers) applied to Windows
  Event ID 4688/Security, WinEventLog System (PnP/USB), PowerShell script-block logs, ETW USB providers,
  Linux auditd and syslog, macOS unified logs, and Zeek dns/http/ssl logs, so the analyst can corroborate
  suspected input injection across endpoint, HID, timing, and network evidence.'
type: technique
related:
