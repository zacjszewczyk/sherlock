questions:
- question: Network evidence enrichment for scheduler-spawned traffic — within execution via scheduled
    tasks/jobs, When scheduler-spawned traffic is detected, enrich the alert with Zeek `conn.log`, `dns.log`,
    and where available `http.log`/TLS metadata including queried domain, resolved IP, URI, HTTP method,
    User-Agent, JA3/JA3S or TLS fingerprint, bytes sent/received, and connection duration?
  context: 'Information requirement (TA0002 / Execution): Is the adversary executing malicious code using
    scheduled tasks or jobs? Evidence under investigation: A Task Scheduler-created or Task Scheduler-spawned
    process initiates new or suspicious outbound communications shortly after task execution, indicating
    staged download, callback, or remote payload retrieval. Detection approach (Symbolic Logic): When
    scheduler-spawned traffic is detected, enrich the alert with Zeek `conn.log`, `dns.log`, and where
    available `http.log`/TLS metadata including queried domain, resolved IP, URI, HTTP method, User-Agent,
    JA3/JA3S or TLS fingerprint, bytes sent/received, and connection duration. These fields should be
    emitted even when the destination is not known-malicious so analysts can validate staging, callback,
    or payload retrieval behavior. Why it matters for Execution: scheduled task/job abuse is a core execution
    mechanism; a positive result (the described condition is observed) is a strong lead that warrants
    triage of the task definition, creator identity, run-as principal, child process, and any resulting
    network or file activity, while a negative result helps narrow scope. Pursue it by pivoting from the
    task lifecycle events to the spawned process, the on-disk artifact, and correlated host/identity context.'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4702
  - Microsoft-Windows-TaskScheduler/Operational Event ID 106
  - Microsoft-Windows-TaskScheduler/Operational Event ID 129
  - Microsoft-Windows-TaskScheduler/Operational Event ID 200
  - Microsoft-Windows-TaskScheduler/Operational Event ID 201
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Critical Windows servers, user endpoints, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Symbolic Logic -- Network evidence enrichment for scheduler-spawned traffic

      source IN ("Windows Event ID 4698", "Windows Event ID 4702", "Microsoft-Windows-TaskScheduler/Operational
      Event ID 106", "Microsoft-Windows-TaskScheduler/Operational Event ID 129", "Microsoft-Windows-TaskScheduler/Operational
      Event ID 200", "Microsoft-Windows-TaskScheduler/Operational Event ID 201", "Sysmon Event ID 1",
      "Sysmon Event ID 3", "Zeek conn.log", "Zeek dns.log")

      | // intent: When scheduler-spawned traffic is detected, enrich the alert with Zeek `conn.log`,
      `dns.log`, and where available `http.log`/TLS metadata including queried domain, resolved IP, URI,
      HTTP method, User-Agent, JA3/JA3S or TLS fingerprint, bytes sent/received, and connection duration.

      | where match_any(task_command, action_path, child_image, ["conn.log", "dns.log", "http.log"])

      | eval correlate task_create(4698/4702/Op106) -> task_run(Op129/200/201) -> child(Sysmon1/3/11)

      | where condition_met

      | table _time, host, task_name, creator_sid, run_as, child_image, command_line, destination'
  - technology: Zeek/pseudocode
    query: '// Enrich/confirm scheduler-spawned network behavior

      zeek conn.log, dns.log (+ http.log/ssl.log when available)

      | join on host/src_ip with scheduler-spawned child process pid/time window

      | project query, answer, resp_h, resp_p, uri, method, user_agent, ja3, ja3s, orig_bytes, resp_bytes,
      duration

      | where dest is first_seen on host AND not in enterprise_allowlist'
- question: Task execution to new external destination — within execution via scheduled tasks/jobs, Can
    we correlate task registration/update (4698/4702 or Operational 106/140) with task execution (Operational
    129/200/201) and the spawned child process (Sysmon 1/3 or Zeek)?
  context: 'Information requirement (TA0002 / Execution): Is the adversary executing malicious code using
    scheduled tasks or jobs? Evidence under investigation: A Task Scheduler-created or Task Scheduler-spawned
    process initiates new or suspicious outbound communications shortly after task execution, indicating
    staged download, callback, or remote payload retrieval. Detection approach (Symbolic Logic): Correlate
    task registration/update (4698/4702 or Operational 106/140) with task execution (Operational 129/200/201)
    and the spawned child process (Sysmon 1/3 or Zeek). Alert when a scheduler-spawned process contacts
    an external destination within 60 seconds of task execution and the destination is first-seen on the
    host and absent from the enterprise allowlist. Include task name, creator SID/logon ID, run-as SID,
    child image, destination, bytes, and first execution timestamp in the alert. Why it matters for Execution:
    scheduled task/job abuse is a core execution mechanism; a positive result (the described condition
    is observed) is a strong lead that warrants triage of the task definition, creator identity, run-as
    principal, child process, and any resulting network or file activity, while a negative result helps
    narrow scope. Pursue it by pivoting from the task lifecycle events to the spawned process, the on-disk
    artifact, and correlated host/identity context.'
