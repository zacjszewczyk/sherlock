name: 'T1053: Scheduled Task-Job'
id: 58d82379-0f21-4fe7-abf6-3cfa200267f7
description: Investigate suspected abuse of operating-system task-scheduling features (Windows Task Scheduler,
  Linux cron and systemd timers, macOS launchd, container cron/sleep loops, and ESXi cron/local.sh) for
  execution, persistence, and privilege escalation. This playbook helps an analyst determine whether an
  adversary used scheduled tasks or jobs to run malicious or staged code (including scheduler-spawned
  processes that beacon or download payloads), to maintain a foothold via logon/boot/recurring triggers
  and hidden or TaskCache-tampered tasks, and to escalate privileges by running content as SYSTEM/Administrator
  or via UAC-bypass and run-level abuse. It correlates task creation/update, execution, and deletion events
  with the spawned process, on-disk artifacts, signer and path context, identity and tier of the creator
  versus the run-as principal, and any resulting network behavior, combining deterministic rules with
  statistical baselines and explainable models to surface one-shot, ephemeral, and stealthy scheduled-task
  abuse.
type: technique
