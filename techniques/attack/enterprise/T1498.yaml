    signal: Within a 1-hour rolling window, compute per-threat-IP total connections (Frequency), byte
    volume (Volume), and blocked/failed-connection ratio (State) from conn.log/Event 5157; rank by connection
    count and alert when any IP exceeds 1,000 connections/hour or 100 MB transferred, deriving site-specific
    cutoffs as the 99th percentile of benign per-source rates using the time-aware, false-alarm-controlled
    thresholding of [Robust Anomaly Detection in Dynamic Networks, Wang and Paschalidis](https://arxiv.org/abs/1503.02332).
    Treat a high blocked-connection ratio as an independent flood signal. A positive result -- a rule
    match, statistical outlier, or model alert -- suggests inbound or reflected traffic consistent with
    a volumetric, protocol, or application-layer flood against the monitored resource; pivot to the destination
    host/service, the protocol mix and top source IPs, the time-of-onset, upstream link utilization, and
    any concurrent intrusion activity the flood may be masking. A negative result helps rule out this
    DoS vector at this observation point but should be corroborated with the other questions in this playbook,
    since spoofing, reflection, low-and-slow application-layer attacks, and short bursts can evade any
    single method.'
