questions:
- question: '[Impact] Alert on known DDoS sources: Can you determine whether a connection is established
    from an external source IP address that matches an entry on a high-confidence threat intelligence
    feed categorized as ''DDoS'', ''botnet'', or ''stresser''. -- specifically, using the ''Alert on known
    DDoS sources'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary performs a Network Denial
    of Service to degrade or block the availability of targeted resources (websites, email, DNS, APIs)
    by exhausting the bandwidth or connection capacity those services depend on, whether sourced from
    a single host or a distributed botnet, often using spoofed source addresses and reflection/amplification
    to mask the origin. This evidence focuses on the condition that a connection is established from an
    external source IP address that matches an entry on a high-confidence threat intelligence feed categorized
    as ''DDoS'', ''botnet'', or ''stresser''. This Symbolic Logic approach looks for the following signal:
    Continuously ingest threat intelligence on DDoS/booter/stresser and botnet infrastructure (e.g., Mirai-class
    IoT bot source ranges and their SYN/ACK/UDP/GRE/HTTP-flood behaviors per [Understanding the Mirai
    Botnet, Antonakakis et al.](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf)),
    correlate Zeek conn.log `id.orig_h` and Windows Event ID 5156 `SourceAddress` against the feed, and
    alert with details (source/destination IPs, protocol, connection count, bytes, matched feed category).
    This is a first-party rule requiring no live external lookup once the feed is cached locally. A positive
    result -- a rule match, statistical outlier, or model alert -- suggests inbound or reflected traffic
    consistent with a volumetric, protocol, or application-layer flood against the monitored resource;
    pivot to the destination host/service, the protocol mix and top source IPs, the time-of-onset, upstream
    link utilization, and any concurrent intrusion activity the flood may be masking. A negative result
    helps rule out this DoS vector at this observation point but should be corroborated with the other
    questions in this playbook, since spoofing, reflection, low-and-slow application-layer attacks, and
    short bursts can evade any single method.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Internet Gateway/Firewall, Edge Routers, Public-facing server segments'
  range: Last 90 days (correlate within 5-minute windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Alert on known DDoS sources

      source IN [Zeek conn.log, Windows Event ID 5156]

      | WHERE matches_action_criteria("Alert on known DDoS sources")

      // Continuously ingest threat intelligence on DDoS/booter/stresser and botnet infrastructure (e.g.,
      Mirai-class IoT bot sou

      | ALERT enrich(dest, service, protocol, top_sources, conn_count, bytes, factor)'
  - technology: Zeek/pseudocode
    query: '# Alert on known DDoS sources (Zeek)

      conn.log

      | FILTER inbound external->internal flows per NAI

      | COMPUTE per-source/per-dest volume, conn rate, resp/orig byte ratio, TCP history, entropy

      | flag floods/amplification/anomalies per action criteria'
- question: '[Impact] Prioritize high-volume threat IPs: Can you determine whether a connection is established
    from an external source IP address that matches an entry on a high-confidence threat intelligence
    feed categorized as ''DDoS'', ''botnet'', or ''stresser''. -- specifically, using the ''Prioritize
    high-volume threat IPs'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary performs a Network Denial
    of Service to degrade or block the availability of targeted resources (websites, email, DNS, APIs)
    by exhausting the bandwidth or connection capacity those services depend on, whether sourced from
