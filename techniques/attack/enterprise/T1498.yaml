name: 'T1498: Network Denial of Service'
id: 04d20504-8ba8-40b9-90d4-4b939b173945
description: 'This playbook helps an analyst investigate whether an adversary is conducting a Network
  Denial of Service (DoS/DDoS) attack to degrade or block the availability of targeted resources under
  the Impact tactic. It guides the hunt across several behavioral angles against network-edge and public-facing
  telemetry: connections from external source IPs that match high-confidence DDoS/booter/stresser/botnet
  threat intelligence; application-layer (Layer 7) DoS sessions identified by known DoS-tool user-agents,
  long-duration low-throughput slow-rate sessions, and incomplete HTTP requests or server-exhaustion error
  responses; UDP reflection/amplification abuse on services such as DNS, NTP, CLDAP, Memcached, SSDP and
  CharGen where the response-to-request byte ratio exceeds known bandwidth-amplification factors; sustained
  volumetric surges in bytes/sec, packets/sec, or new-connection rate that exceed dynamic time-aware baselines;
  and shifts in traffic structure such as source-IP entropy changes, SYN-only/half-open flag patterns,
  and rapid UDP-to-TCP ratio changes that betray spoofing and victim-centered fan-in. Detection methods
  combine symbolic-logic rules (threat-feed correlation, user-agent and TCP-flag matching, amplification
  and circuit-breaker thresholds), statistical baselining (percentile/mean+3sigma, entropy, change-point
  onset detection), and machine learning (Random Forest/CNN flow classifiers, Isolation Forest/Extended
  Isolation Forest, DBSCAN, ARIMA/Prophet forecasting, and graph models) applied to Zeek conn/http/dns/ntp/dstats
  logs and Windows Filtering Platform events (Event ID 5156/5157), so the analyst can corroborate a suspected
  flood against source reputation, traffic volume, protocol behavior, amplification ratio, and onset timing.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
