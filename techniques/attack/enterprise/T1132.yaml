  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Threat intel C2 correlation\nMATCH network/host events WHERE\n\
      \  // threat-intel + encoded-content floors\n  dest IN ti_c2_indicators\n  OR field MATCHES /^[A-Za-z0-9+\\\
      /]{50,}={0,2}$/   // long Base64 (add hex/Base32 variants)\n  OR (port IN [21,23,25] AND payload_entropy\
      \ > 6.5) // cleartext-port entropy floor\n  OR (dns_query_len > 255 OR txt_null_resp_bytes > 512)\n\
      \  OR (proc IN watchlist[notepad.exe,calc.exe] AND outbound_conn)\n  OR (cli_encoder IN [base64,xxd,gzip,plutil]\
      \ BEFORE_60s curl|wget|nc)\nTHEN alert(severity='high', enrich=[dest, field_sample, proc_chain])"
- question: 'Using deterministic rule logic, can you determine whether ''Encoding-agnostic information
    bound'' indicates adversary use of data encoding to obfuscate command-and-control traffic? Specifically:
    For each destination domain, gzip/bzip2-compress the concatenated payload-bearing fields (query labels,
    TXT/NULL data, URI/header values) and alert when residual compressed bytes exceed a derived per-domain
    threshold, per [Practical Comprehensive Bounds on Surreptitious Communication Over DNS](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf);
    this catches encoded C2 regardless of alphabet (Base64/Base32/hex).'
