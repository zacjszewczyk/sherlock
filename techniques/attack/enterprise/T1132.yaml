  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: Port-specific entropy scoring\nWINDOW = 5m   // also maintain\
      \ 30d per-(host,port,domain) baselines\nFOR EACH (dest_domain / src_host / port):\n  entropy   \
      \   = shannon_entropy(payload_or_field)\n  comp_resid   = gzip_size(concat(payload_fields))   //\
      \ encoding-agnostic info bound\n  kl_div       = KL(char_dist(value) || baseline_char_dist)\n  ngram_score\
      \  = bigram_match(value, benign_lang_model)\n  mahal        = mahalanobis(byte_freq_1gram, port_profile)\n\
      \  byte_ratio   = orig_bytes / resp_bytes\n  fail_rate    = count(reset|blocked|4xx|NXDOMAIN)\n\
      COMPUTE per-entity baseline (mean,sigma,percentiles)\nALERT WHEN entropy > p99 OR kl_div high OR\
      \ ngram_score collapses\n  OR mahal large OR byte_ratio > mean+3*sigma\n  OR fail_rate > mean+3*sigma\
      \   // failure burst = distinct C2-staging signal"
- question: 'Using statistical baselining, can you determine whether ''Connection failure-rate profiling''
    indicates adversary use of data encoding to obfuscate command-and-control traffic? Specifically: Track
    per-destination blocked/reset connection and HTTP 4xx rates; alert when failures to a single destination
    exceed mean+3σ within 5 minutes, since encoded C2 setup and retries produce distinct failure bursts.'
