- question: 'Using statistical baselining, can you determine whether ''Port-specific entropy scoring''
    indicates adversary use of data encoding to obfuscate command-and-control traffic? Specifically: Baseline
    payload entropy per port and protocol over 30 days and flag new connections exceeding the 99th percentile;
