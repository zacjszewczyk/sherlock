questions:
- question: 'Using deterministic rule logic, can you determine whether ''Threat intel C2 correlation''
    indicates adversary use of data encoding to obfuscate command-and-control traffic? Specifically: Alert
    on Zeek conn.log when destination IP, SSL server_name, HTTP host, or DNS resolution matches known
    C2 indicators tied to encoded traffic; keep this deterministic match as the floor and treat field-specific
    encoded-content regex from [Detecting Popular Cobalt Strike Malleable C2 Profile Techniques](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/)
    (Base64/NetBIOS data in URI, Cookie, User-Agent, POST body) as parallel high-fidelity matches.'
  context: 'Tactic context (Command and Control): the adversary encodes C2 data to blend malicious traffic
    into normal, expected protocol streams and evade content inspection. Evidence under investigation:
    A network connection to a destination IP, domain, SSL server_name, or HTTP host identified as malicious
    C2 via threat intelligence has a corresponding data payload with a Shannon entropy score greater than
    6.0, indicating high randomness typical of encoded/encrypted data rather than ordinary application
    traffic. Entropy alone is encoding-agnostic and survives an adversary switching from Base64 to Base32
    or hex. Profile failure state in parallel: a burst of blocked/reset connections or HTTP 4xx to the
    same destination is itself a distinct C2-staging signal. Approach (Threat intel C2 correlation): Alert
    on Zeek conn.log when destination IP, SSL server_name, HTTP host, or DNS resolution matches known
    C2 indicators tied to encoded traffic; keep this deterministic match as the floor and treat field-specific
    encoded-content regex from [Detecting Popular Cobalt Strike Malleable C2 Profile Techniques](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/)
    (Base64/NetBIOS data in URI, Cookie, User-Agent, POST body) as parallel high-fidelity matches. A positive
    result means a destination, flow, field value, or process exhibits encoded-content characteristics
    (high entropy, Base64/Base32/hex structure, abnormal byte/char distribution, inflated outbound volume,
    or host-side encoding before egress) consistent with obfuscated C2; a negative result means the traffic
    matches expected protocol and language baselines. Investigate the named area of interest (Internet
    gateway, DNS resolvers, Proxy servers, Threat intelligence platform) and pivot from any hit to the
    destination infrastructure, the originating process and account, and any decoded C2 content or follow-on
    actions.'
