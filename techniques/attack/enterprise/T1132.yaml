name: 'T1132: Data Encoding'
id: ce5e90c6-a55d-4c24-8c90-63c3c94b6e76
description: 'This playbook helps an analyst determine whether an adversary is using Data Encoding (T1132)
  to obfuscate command-and-control (C2) traffic by encoding payloads with standard schemes such as ASCII,
  Unicode, Base64, Base32, hex, MIME, or compression like gzip. Encoding lets an adversary smuggle structured
  C2 inside otherwise normal-looking protocol fields, so the strongest signals are encoding-agnostic:
  high Shannon entropy on payloads, byte-frequency distributions that deviate from a port''s baseline,
  character-frequency/KL-divergence and n-gram deviations from natural language, and information-theoretic
  compressibility bounds. It correlates network telemetry (Zeek conn.log, dns.log, http.log, ssl.log)
  with host telemetry (Windows Event ID 4688/Sysmon 1 process creation and Event ID 5156/Sysmon 3 network
  connections, auditd execve, macOS unified log, ESXi shell) to surface encoded C2. Investigative angles
  include: threat-intel C2 correlation against destinations carrying encoded content; long Base64/Base32/hex
  strings in DNS query names and HTTP User-Agent/Cookie/URI/POST fields; entropy floors on cleartext ports
  (21/23/25); per-port byte-frequency Mahalanobis outliers; excessive DNS query lengths and outbound byte-ratio
  inflation; low-throughput per-domain information-rate heavy hitters; failure-state bursts (blocked/reset
  connections, HTTP 4xx, NXDOMAIN) as distinct C2-staging signals; and non-networking processes or CLI
  encoders (base64, xxd, gzip, plutil) chained into curl/wget/nc before egress. Detection blends symbolic-logic
  rules, statistical baselining (entropy percentiles, KL-divergence, n-gram scoring, Mahalanobis distance,
  heavy hitters, 3-sigma deviation), and machine learning (Random Forest/Gradient Boosting, One-Class
  SVM, Isolation Forest, autoencoders, CNN/LSTM, forecasting) with SHAP-style explainability for evasion-resistant
  alerts in the Command and Control tactic.'
type: technique
