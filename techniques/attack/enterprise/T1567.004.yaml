name: 'T1567.004: Exfiltration Over Webhook'
id: 0dec3399-bf5d-4147-bdfc-5ca97198411b
description: 'Investigate potential exfiltration of data to webhook endpoints, where an adversary pushes
  sensitive data over HTTP/S to collaboration or messaging services (e.g., Discord, Slack, Telegram, webhook.site)
  instead of using a primary command-and-control channel. This playbook helps an analyst hunt for: outbound
  HTTP POST requests to known or structurally-recognizable webhook endpoints, including matches against
  threat-intelligence watchlists and abnormal HTTP response-code patterns indicating endpoint discovery
  then exfil; LOLBin and scripting-utility process creation (curl, wget, bitsadmin, certutil, powershell,
  osascript) issuing POST-to-webhook command lines; archive/binary Content-Type or high-entropy POST bodies
  suggesting compressed or encrypted staged data; statistically significant per-host surges in POST count,
  volume, or size to webhook/collaboration domains versus a rolling baseline; and stateful collection-then-exfil
  chains where an archiving tool runs and is shortly followed by an outbound POST to a rarely-visited
  destination. It spans Windows, Linux, macOS, ESXi, Office Suite, and SaaS telemetry and combines symbolic-logic
  signatures, statistical baselining, and explainable machine-learning approaches.'
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any internal hosts sending outbound HTTP POST requests to webhook destinations (host,
    URI, or IP) that match a threat-intelligence watchlist of known malicious or abusable webhook endpoints?
  context: An adversary abusing T1567.004 (Exfiltration Over Webhook) under the Exfiltration tactic will
    push staged data to a webhook URL. Build and maintain a watchlist that combines threat-intel feeds
    (malicious domains/URLs/IPs tied to webhook abuse) with the structural paths of legitimate-but-abusable
    services such as `discord.com/api/webhooks/`, `hooks.slack.com/services/`, `webhook.site`, and `api.telegram.org/bot`.
    Join Zeek http.log to conn.log on `uid` and alert when the http.log host/uri or the conn.log responder
    IP matches the list. A positive match is a strong exfiltration signal; a negative result narrows the
    hunt to unknown endpoints that other questions in this playbook cover. Faithful to SigmaHQ outbound-to-collaboration-webhook
    rules.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., proxies, firewalls), DNS resolvers, Cloud Access Security Broker
    (CASB) logs'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  watchlist = load_ti_feeds() + [\"discord.com/api/webhooks/\", \"hooks.slack.com/services/\"\
      ,\n  \"webhook.site\", \"api.telegram.org/bot\"]\n  join http.log to conn.log on uid\n  where http.method\
      \ == \"POST\"\n  and (http.host in watchlist or http.uri matches watchlist_paths or conn.id.resp_h\
      \ in watchlist_ips)\n  -> alert"
- question: For each webhook destination, what is the distribution of HTTP response codes, and is there
    a pattern of failed POSTs (401/403/404) followed by a successful POST (200/204) indicating endpoint
    discovery or registration then exfiltration?
  context: Adversaries often probe or register a webhook endpoint before successfully exfiltrating, producing
    a distinct failure-mode signature. Track per-destination HTTP status codes from Zeek http.log `status_code`.
    A burst of 200/204 POSTs to a never-before-seen webhook path, or a run of authentication/not-found
    failures immediately followed by a success from the same host, suggests an adversary getting an exfil
    channel working. Alert when a host sends >= N (default 3, tune per environment) failed POSTs to a
    webhook domain followed by a successful POST within 10 minutes. This supports the Exfiltration tactic
    by catching channel setup, not just steady-state transfer.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., proxies, firewalls), DNS resolvers, Cloud Access Security Broker
    (CASB) logs'
  range: 'Last 90 days; event-centered: correlate failures and the subsequent success within a 10-minute
    window'
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  stream http.log where method==\"POST\" and host in webhook_domains\n  per (src_ip, host):\
      \ count failures = status_code in {401,403,404,5xx}\n  if failures >= 3 then a successful status_code\
      \ in {200,204} within 10m\n  -> alert \"webhook endpoint discovery then exfil\""
- question: Which webhook service domains show URI-path entropy and per-host outbound POST volume that
    jointly exceed their 30-day baseline, indicating random adversary-controlled endpoints carrying bulk
    data?
  context: 'Legitimate webhook services have characteristic URI-path structures and host traffic volumes.
    Over a 30-day baseline, compute the Shannon entropy of POST URI paths per service domain and the per-host
    outbound byte volume (conn.log `orig_bytes`) and POST count per hour. Flag when URI-path entropy is
    above the 95th percentile (suggesting a random, adversary-generated endpoint token) AND outbound volume
    is above Q3 + 1.5*IQR together. The conjunction reduces false positives: high entropy alone may be
    benign tokens, but combined with volume it indicates bulk data leaving over a fresh webhook. This
    directly addresses the Exfiltration tactic''s data-theft objective.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., proxies, firewalls), DNS resolvers, Cloud Access Security Broker
    (CASB) logs'
  range: Last 90 days (with 30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for each webhook_domain over 30d baseline:\n    uri_entropy = shannon(post_uri_paths)\n\
      \    host_vol = sum(conn.orig_bytes) per src per hour\n  flag where uri_entropy > p95(uri_entropy)\n\
      \    AND host_vol > Q3 + 1.5*IQR\n  -> alert"
- question: Can an explainable supervised classifier over HTTP POST flow features distinguish malicious
    webhook exfiltration from benign webhook traffic, and which features drive each high-probability alert?
  context: When signatures and simple thresholds are evaded, a trained classifier can catch novel webhook
    exfiltration. Train a gradient-boosted or logistic-regression model on labeled benign/malicious webhook
    POSTs using features such as URI length, URI entropy, destination-domain rarity, User-Agent, outbound:inbound
    byte ratio, request frequency, and presence of `webhook`/`api`/`bot` tokens. Flag predictions with
    probability > 0.8 and, for analyst trust, emit the top-3 SHAP-contributing features (e.g., destination
    rarity, outbound bytes, URI entropy) in the alert. This serves the Exfiltration tactic by generalizing
    beyond known indicators while keeping decisions auditable.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., proxies, firewalls), DNS resolvers, Cloud Access Security Broker
    (CASB) logs'
  range: Last 90 days (model trained on longer labeled history)
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [uri_len, uri_entropy, dst_rarity, user_agent, out_in_byte_ratio,\n     \
      \        req_freq, has_webhook_api_bot_token]\n  model = gradient_boosted_classifier.fit(labeled_benign_malicious)\n\
      \  p = model.predict_proba(post_event)\n  if p > 0.8: alert with top3 shap(features)"
- question: Are command-line utilities (curl, wget, bitsadmin, certutil, powershell, osascript) being
    launched with arguments that specify an HTTP POST and a webhook URL, optionally with a file or piped
    data as the payload?
  context: Living-off-the-land binaries and scripting tools are a common way to POST staged data to a
    webhook without dropping bespoke malware. From Windows Event ID 4688 / Sysmon Event ID 1 (and auditd
    EXECVE on Linux/macOS) detect these utilities, then regex command lines for `-X POST`, `--data`/`--data-binary`,
    `Invoke-RestMethod -Method Post`, `-InFile`, and webhook URLs (`discord.com/api/webhooks`, `hooks.slack.com`,
    `api.telegram.org/bot`, `webhook.site`). Alert on any match. A positive hit is a high-fidelity Exfiltration
    indicator tying a process to a webhook destination; correlate with the corresponding Zeek http.log
    POST to confirm the transfer occurred.
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - 'NAI: User workstations, servers (especially web and application servers), development environments,
    and CI/CD pipeline runners'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  where EventID in {4688, sysmon:1} or auditd:EXECVE\n  and image in {curl.exe,wget,bitsadmin.exe,certutil.exe,powershell.exe,osascript}\n\
      \  and cmdline matches /(-X POST|--data(-binary)?|Invoke-RestMethod.*-Method Post|-InFile)/\n  and\
      \ cmdline matches /(discord.com\\/api\\/webhooks|hooks.slack.com|api.telegram.org\\/bot|webhook.site)/\n\
      \  -> alert"
- question: On each host, do any process executions contain command-line argument n-grams that are rare
    (below the 1st percentile) for that utility, or is there a burst of more than five POST-capable process
    spawns to external hosts within five minutes from one user?
  context: 'Adversaries reuse common utilities in uncommon ways. Establish a per-host baseline of argument
    bi/tri-gram frequencies for common utilities and flag executions containing n-grams below the 1st
    percentile (e.g., `Invoke-RestMethod` + `-InFile` on a host where that combination is unseen). Pair
    this rare-behavior signal with a frequency signal: more than five POST-capable process spawns to external
    hosts within five minutes from a single user is anomalous. Together these surface novel exfiltration
    tooling under the Exfiltration tactic even when the exact command line is not on a signature list.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - 'NAI: User workstations, servers (especially web and application servers), development environments,
    and CI/CD pipeline runners'
  range: Last 90 days (with rolling per-host n-gram baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline[host][util] = freq(arg_bigrams, arg_trigrams)\n  for exec in process_creation:\n\
      \    if any(ngram_freq < p01) -> flag rare\n  if count(post_capable_spawns to external) per user\
      \ > 5 within 5m -> flag burst\n  -> alert on rare OR burst"
- question: Does an explainable one-class or outlier model flag process invocations as anomalous without
    relying on signatures, and what features explain each flag?
  context: Signature-free detection catches unknown exfiltration tooling. Train a One-Class SVM or Isolation
    Forest on benign command-line invocations (tokenized args, byte length, parent process, network-egress
    flag) per host group, flagging outliers. Surface the top-3 contributing features so analysts can see
    why a command line was flagged (e.g., unusual parent process plus egress flag plus long argument byte
    length). Under the Exfiltration tactic this finds processes whose behavior deviates from normal even
    if no rule matched, while keeping the alert interpretable and actionable for triage.
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - 'NAI: User workstations, servers (especially web and application servers), development environments,
    and CI/CD pipeline runners'
  range: Last 90 days (model trained on benign history per host group)
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = [tokenized_args, byte_len, parent_process, network_egress_flag]\n  model = IsolationForest.fit(benign_invocations_per_hostgroup)\n\
      \  if model.decision(exec) == outlier:\n    alert with top3 feature_contributions"
- question: Are there outbound HTTP POSTs to webhook/collaboration domains whose Content-Type indicates
    archived or binary data (application/zip, x-rar-compressed, x-7z-compressed, octet-stream)?
  context: Staged data is often compressed before exfiltration. From Zeek http.log filter POSTs whose
    `Content-Type` is `application/zip`, `application/x-rar-compressed`, `application/x-7z-compressed`,
    or `application/octet-stream` AND directed to a known webhook/collaboration domain; alert on match.
    This is a high-signal Exfiltration indicator because legitimate webhook integrations rarely push raw
    archives. Correlate with Zeek files.log to confirm the transferred object type and size. A positive
    result strongly suggests bulk data leaving the environment over a webhook channel.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Network egress points, Data Loss Prevention (DLP) systems, servers hosting sensitive data (e.g.,
    databases, file shares)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  where http.method == \"POST\"\n  and http.resp_mime_types or content_type in\n    {application/zip,\
      \ application/x-rar-compressed, application/x-7z-compressed, application/octet-stream}\n  and http.host\
      \ in webhook_collab_domains\n  -> alert"
- question: Do any POST bodies to webhook domains exhibit high byte-entropy (> 7.5 bits/byte) or a byte-frequency
    distribution that is a statistical outlier versus the host's normal egress, indicating encryption
    or encoding?
  context: Encryption/encoding of stolen data raises the entropy of the POST body. Compute Shannon entropy
    of the first 4096 bytes of available POST bodies and model per-length byte-frequency distributions
    with Mahalanobis distance (PAYL-style); flag entropy > 7.5/byte or a content outlier relative to the
    host's normal egress, reinforced by compression-based information bounds. Under the Exfiltration tactic
    this catches data that has been compressed or encrypted to evade DLP keyword matching. Where bodies
    are unavailable due to TLS, defer to flow-metadata methods. A positive result warrants inspecting
    the destination and the staging host.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Network egress points, Data Loss Prevention (DLP) systems, servers hosting sensitive data (e.g.,
    databases, file shares)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for post_body in webhook_posts:\n    H = shannon_entropy(first_4096_bytes)\n    d =\
      \ mahalanobis(byte_freq_dist, host_baseline_by_length)\n  if H > 7.5 or d > threshold -> alert \"\
      high-entropy/outlier POST body\""
- question: Does a time-series model of outbound POST byte volume per host and Content-Type show spikes
    that break the learned baseline, and for TLS bodies, do flow-metadata features indicate anomalous
    transfer?
  context: Bulk exfiltration shows up as volume anomalies even when content is hidden. Build a time-series
    anomaly detector (ARIMA/LSTM) over POST byte volume segmented by `Content-Type` and source host, alerting
    on spikes that break the learned baseline. For TLS-encrypted bodies where content is unavailable,
    score flow metadata (sizes, directions, timing) with a self-supervised encrypted-traffic model. Include
    the top-3 driving features in the alert. This serves the Exfiltration tactic by detecting abnormal
    data egress over webhooks regardless of encryption, while remaining explainable for analyst review.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Network egress points, Data Loss Prevention (DLP) systems, servers hosting sensitive data (e.g.,
    databases, file shares)'
  range: Last 90 days (with learned seasonal baseline)
  queries:
  - technology: ML/pseudocode
    query: ">-\n  series = post_byte_volume per (host, content_type) over time\n  model = LSTM_or_ARIMA.fit(series)\n\
      \  if observed > predicted_upper -> alert\n  for TLS bodies: score flow_meta(sizes, directions,\
      \ timing) with encrypted-traffic model\n  emit top3 features"
- question: Has any single internal host's count of POSTs to known webhook domains exceeded its 24-hour
    rolling average by more than 300% within a one-hour window?
  context: A sudden surge of webhook POSTs from one host suggests an active exfiltration burst. Alert
    if a single host's count of POSTs to known webhook domains exceeds its 24-hour rolling average by
    300% within a one-hour window; tune the multiplier from an initial traffic study. This simple threshold
    under the Exfiltration tactic gives an early, low-complexity signal of abnormal channel use. A positive
    result should be corroborated with destination reputation and payload characteristics from the other
    questions to confirm exfiltration versus a benign integration change.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: All internal host subnets, Virtual Private Network (VPN) concentrators, and servers with direct
    internet access'
  range: Last 90 days (24-hour rolling average; 1-hour evaluation window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per host: avg24h = rolling_avg(count(POST to webhook_domains), 24h)\n  if count(POST\
      \ to webhook_domains in last 1h) > avg24h * 4.0 (>300% increase)\n  -> alert"
- question: Using a 30-day robust baseline of daily POST volume, count, and failure rate per host, does
    any day exceed Q3 + 1.5*IQR, especially with a spike in failed-then-successful POSTs?
  context: Robust statistics resist outlier-driven baseline inflation. Build a 30-day rolling per-source
    profile of daily POST volume (sum of conn.log `orig_bytes`) and POST count, plus the rate of failed
    POSTs (HTTP 4xx/5xx). Flag any day exceeding Q3 + 1.5*IQR using adaptive time-varying thresholds and
    multi-window per-destination accounting. A spike in failed-then-successful POSTs is a distinct failure-mode
    signal of an adversary getting a channel working. Under the Exfiltration tactic this catches both
    gradual and bursty data theft while controlling false positives through the IQR rule.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: All internal host subnets, Virtual Private Network (VPN) concentrators, and servers with direct
    internet access'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per host over 30d: daily_volume = sum(conn.orig_bytes); daily_count; fail_rate(4xx/5xx)\n\
      \  threshold = Q3 + 1.5*IQR\n  if daily_volume or daily_count > threshold -> flag\n  if failed_posts\
      \ spike then successful_posts -> flag failure-mode\n  -> alert"
- question: Does an explainable per-host forecasting model (with daily/weekly seasonality) for outbound
    webhook POST volume show observed traffic exceeding the prediction interval, and what features explain
    the deviation?
  context: Seasonality-aware forecasting separates normal business rhythms from true anomalies. Fit a
    forecasting model (e.g., Prophet) per host for outbound POST volume to webhook domains, learning daily/weekly
    seasonality; alert when observed volume exceeds the prediction interval (`yhat_upper`). Report contributing
    features (deviation magnitude, destination rarity, hour-of-day) for interpretability. Under the Exfiltration
    tactic this reduces false positives from predictable spikes (e.g., nightly CI jobs) while still catching
    off-pattern exfiltration. A positive result with high destination rarity and odd-hour timing is especially
    suspicious.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: All internal host subnets, Virtual Private Network (VPN) concentrators, and servers with direct
    internet access'
  range: Last 90 days (model learns daily/weekly seasonality)
  queries:
  - technology: ML/pseudocode
    query: ">-\n  model = Prophet.fit(per_host_webhook_post_volume)  # daily/weekly seasonality\n  forecast\
      \ = model.predict()\n  if observed > forecast.yhat_upper:\n    alert with features [deviation_magnitude,\
      \ dst_rarity, hour_of_day]"
- question: On a single host, is an archiving utility (7z.exe, rar.exe, tar, zip.exe) executed and then
    followed within five minutes by that same host issuing an outbound HTTP POST to an external destination?
  context: 'The collection-before-exfil chain is a strong behavioral signature. Trigger when Windows Event
    ID 4688 / Sysmon ID 1 shows an archiving tool on a host followed within five minutes by the same host
    issuing an HTTP POST (Zeek http.log) to any external destination; alert for review. This stateful
    correlation under the Exfiltration tactic captures the staging-then-transfer pattern even when each
    step alone looks benign. A positive result is high-value: pivot to the archive''s source files and
    the POST destination''s reputation to confirm data theft.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Staging servers, developer workstations, CI/CD pipeline runners, and any host with both sensitive
    data access and direct internet connectivity'
  range: 'Last 90 days; event-centered: 5-minute correlation window between archive process and POST'
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  archive = process_creation where image in {7z.exe,rar.exe,tar,zip.exe}\n  post = http.log\
      \ where method==\"POST\" and dst is external\n  if same host(archive) and post.time - archive.time\
      \ <= 5m\n  -> alert \"archive then outbound POST\""
- question: For the subsequent outbound connection, how rare is the destination across the organization
    (bottom 5th percentile of host prevalence) and how regular is its POST cadence (low coefficient of
    variation, periodicity)?
  context: Adversary webhook endpoints are typically visited by very few internal hosts and may exhibit
    beacon-like regularity. Maintain a 30-day rolling prevalence (unique internal hosts per domain) from
    Zeek dns.log and raise risk when the POST destination is in the bottom 5th percentile of prevalence.
    Additionally score inter-arrival regularity (coefficient of variation, Bowley skewness, FFT periodicity)
    and external-destination rarity, plus per-destination volume/frequency features. Under the Exfiltration
    tactic, a rare destination receiving regular, automated POSTs is a hallmark of an exfil/beacon channel
    and merits investigation alongside the staging evidence.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Staging servers, developer workstations, CI/CD pipeline runners, and any host with both sensitive
    data access and direct internet connectivity'
  range: Last 90 days (30-day rolling prevalence)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  prevalence[domain] = distinct_count(internal_hosts) over 30d (dns.log)\n  if prevalence(dst)\
      \ <= p05 -> rare\n  cadence = {coef_variation(interarrival), bowley_skew, fft_periodicity}\n  score\
      \ risk(rare, cadence, per_dst_volume_freq) -> alert if high"
- question: Does a sequence model (HMM/Markov) over host event sequences flag a rare, high-cost transition
    from a data-staging state (archive process) to an exfiltration state (POST to a low-prevalence webhook
    domain)?
  context: Modeling the order of events catches the staging-to-exfil progression that point detections
    miss. Train a Hidden Markov Model / Markov sequence model on host event sequences (process creation,
    file read, network connection) and alert on rare high-cost transitions from a Data-Staging state (archive
    process) to an Exfiltration state (POST to a low-prevalence webhook domain). Emit the top-3 contributing
    transitions/features in the alert. Under the Exfiltration tactic this provides a behavioral, explainable
    detection of the full kill-chain segment, complementing the deterministic 5-minute correlation rule
    with probabilistic sequence reasoning.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Staging servers, developer workstations, CI/CD pipeline runners, and any host with both sensitive
    data access and direct internet connectivity'
  range: Last 90 days (model trained on host event sequences)
  queries:
  - technology: ML/pseudocode
    query: ">-\n  seq = ordered_events(process_creation, file_read, network_connection) per host\n  model\
      \ = HMM.fit(benign_sequences)\n  if transition(Staging[archive] -> Exfil[POST to low_prevalence_webhook])\
      \ is rare/high_cost:\n    alert with top3 contributing_transitions"
