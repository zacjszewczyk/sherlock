name: 'T1598.004: Spearphishing Voice'
id: 0e481c35-5cee-4838-b052-b3f2d239e2e8
description: 'This playbook helps an analyst investigate whether an adversary is using voice communications
  ("vishing") or callback phishing to elicit sensitive information and drive intrusion against the organization
  (MITRE ATT&CK T1598.004, Spearphishing Voice). Because the social-engineering phone call itself is rarely
  logged, the hunt focuses on the network- and endpoint-observable artifacts that follow a successful
  voice lure: an internal host resolving or connecting to known vishing/callback-phishing (TOAD) or refund-scam
  infrastructure; installation or execution of remote administration tools (AnyDesk, TeamViewer, ScreenConnect)
  that are not approved or not tied to an authorized IT role, often run install-free from user-writable
  paths; download of a disk image or archive (ISO, VHD, IMG, ZIP) followed quickly by execution of a script
  interpreter from the mounted or extracted path (a Mark-of-the-Web bypass); successful remote authentications
  (VPN, RDP, Cloud SSO) from anomalous geographies or ASNs, especially when correlated with prior web
  traffic to a newly registered or low-reputation domain or with impossible-travel logic; and anomalous
  parent-child process lineage where a browser or Office application spawns a script interpreter that
  then reaches out to the internet. Detection methods combine deterministic symbolic-logic rules (threat-intel
  matching, RMM allow-lists, download-to-execute sequencing, phishing-visit-to-logon correlation, browser/Office-to-interpreter
  lineage), statistical baselining (domain age/prevalence/entropy/NXDOMAIN scoring, role and first-seen
  profiling, per-user MIME-type rarity, weighted geo/ASN/time anomaly scoring with failed-logon ratios,
  command-line entropy/length thresholds), and machine learning (network/lexical lure and AiTM classifiers,
  LSTM/DeepLog sequence models, download-stage-execute sequence classifiers, UEBA peer-group deviation,
  and deep-NLP malicious-script classification), applied across Zeek dns/conn/http/files logs and Windows
  Security/Sysmon events so the analyst can corroborate suspected voice-phishing-driven access from multiple
  angles.'
