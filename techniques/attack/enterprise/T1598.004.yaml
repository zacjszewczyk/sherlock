  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary uses voice calls
    or callback phishing to manipulate a victim into actions or disclosures that enable unauthorized access.
    This evidence focuses on the condition that a remote administration tool (e.g., AnyDesk, TeamViewer,
    ScreenConnect) is installed or executed on an endpoint, and the tool is not on the organization''s
    approved software list or the user is not part of an authorized group (e.g., IT support). This Statistical
    Method approach works as follows: Establish a baseline of legitimate RMM usage, mapping each tool
    to authorized user roles (Help Desk, SysAdmin). Flag execution where the user''s role does not match
    the tool''s authorized group, and flag first-time execution of any RMM on a host or by a user. Add
    Physics metrics: Frequency (RMM process starts and outbound RMM-port connections per hour), Volume
    (bytes sent/received over the RMM session), and a State/failure signal (failed installs, blocked outbound
    RMM connections at the proxy/firewall). Derive per-role thresholds from the 99th percentile of historical
    session counts/bytes. A positive result -- a rule match, statistical outlier, or model alert -- is
    a strong lead that a voice-phishing operation has produced follow-on activity; pivot to the responsible
    user, host, and process lineage, the destination infrastructure and its reputation, any remote-access
    sessions or downloaded payloads, and the timeline around the suspected call to scope impact. A negative
    result helps reduce suspicion for this specific vector but should be corroborated with the other questions
    in this playbook, since voice phishing leaves few direct logs and a single method can miss stealthy
    activity.'
