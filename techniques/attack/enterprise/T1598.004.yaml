- question: '[Reconnaissance] Domain age + prevalence + entropy + NXDOMAIN rarity scoring: Can you determine
    whether an internal host resolves or connects to an external domain/IP address that is present on
    a threat intelligence feed specifically tracking vishing or callback phishing infrastructure. -- specifically,
    using the ''Domain age + prevalence + entropy + NXDOMAIN rarity scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary uses voice calls
    or callback phishing to manipulate a victim into actions or disclosures that enable unauthorized access.
    This evidence focuses on the condition that an internal host resolves or connects to an external domain/IP
    address that is present on a threat intelligence feed specifically tracking vishing or callback phishing
    infrastructure. This Statistical Method approach works as follows: For domains not on a threat list,
    score risk using registration-time signals: WHOIS registration age <30 days is a strong multiplier
    ([PREDATOR, Hao et al.](https://dl.acm.org/doi/10.1145/2976749.2978317)). Combine with internal prevalence
    (unique-host count over 90 days <0.1% of hosts) ranked via Directed Anomaly Scoring within a fixed
    daily alert budget ([Ho et al. 2017](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho)).
    Add Volume (HTTP request/response byte counts and request rate per minute), and a State/failure signal:
    count NXDOMAIN responses and high-entropy failed lookups per host (Shannon entropy of subdomain >3.5
    per [Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989)); an NXDOMAIN burst of high-entropy
    names is a distinct algorithmic-domain indicator ([FANCI, Schüppen et al.](https://www.usenix.org/conference/usenixsecurity18/presentation/schuppen)).
    Derive thresholds per environment from the 98th percentile of historical per-host values. A positive
    result -- a rule match, statistical outlier, or model alert -- is a strong lead that a voice-phishing
    operation has produced follow-on activity; pivot to the responsible user, host, and process lineage,
    the destination infrastructure and its reputation, any remote-access sessions or downloaded payloads,
    and the timeline around the suspected call to scope impact. A negative result helps reduce suspicion
    for this specific vector but should be corroborated with the other questions in this playbook, since
    voice phishing leaves few direct logs and a single method can miss stealthy activity.'
