questions:
- question: '[Reconnaissance] Threat-feed match on egress DNS/IP/HTTP: Can you determine whether an internal
    host resolves or connects to an external domain/IP address that is present on a threat intelligence
    feed specifically tracking vishing or callback phishing infrastructure. -- specifically, using the
    ''Threat-feed match on egress DNS/IP/HTTP'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary uses voice calls
    or callback phishing to manipulate a victim into actions or disclosures that enable unauthorized access.
    This evidence focuses on the condition that an internal host resolves or connects to an external domain/IP
    address that is present on a threat intelligence feed specifically tracking vishing or callback phishing
    infrastructure. This Symbolic Logic approach works as follows: Continuously match all destination
    IPs (Zeek conn.log), queried domains (Zeek dns.log), and HTTP host headers (Zeek http.log) against
    a curated threat-intelligence list of known vishing/callback-phishing and refund-scam infrastructure;
    generate a high-severity alert on any match. Callback phishing (''TOAD'') delivers no link/attachment,
    so the lure domain or follow-on RMM/credential-capture host is the first network-observable artifact
    ([Caught Beneath the Landline / TOAD, Proofpoint](https://www.proofpoint.com/us/blog/threat-insight/caught-beneath-landline-411-scam-emergent-threat);
    [CISA AA23-025A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-025a)). A positive
    result -- a rule match, statistical outlier, or model alert -- is a strong lead that a voice-phishing
    operation has produced follow-on activity; pivot to the responsible user, host, and process lineage,
    the destination infrastructure and its reputation, any remote-access sessions or downloaded payloads,
    and the timeline around the suspected call to scope impact. A negative result helps reduce suspicion
    for this specific vector but should be corroborated with the other questions in this playbook, since
    voice phishing leaves few direct logs and a single method can miss stealthy activity.'
