    execution of a script interpreter (powershell.exe, wscript.exe, cscript.exe) or mshta.exe from that
    path (Event ID 4688). ISO/container delivery bypasses Mark-of-the-Web and pairs with anomalous parent
    lineage ([SigmaHQ unusual parent](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_cmd_unusual_parent.yml)).
