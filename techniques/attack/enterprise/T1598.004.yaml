- question: '[Reconnaissance] RMM allow-list on process/install/service events: Can you determine whether
    a remote administration tool (e.g., AnyDesk, TeamViewer, ScreenConnect) is installed or executed on
    an endpoint, and the tool is not on the organization''s approved software list or the user is not
    part of an authorized group (e.g., IT support). -- specifically, using the ''RMM allow-list on process/install/service
    events'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary uses voice calls
    or callback phishing to manipulate a victim into actions or disclosures that enable unauthorized access.
    This evidence focuses on the condition that a remote administration tool (e.g., AnyDesk, TeamViewer,
    ScreenConnect) is installed or executed on an endpoint, and the tool is not on the organization''s
    approved software list or the user is not part of an authorized group (e.g., IT support). This Symbolic
    Logic approach works as follows: Maintain an allow-list of approved RMM tools (process names, file
    hashes, signing certificates). Alert on any process creation (Event ID 4688), software install (Event
    ID 11707), or service install (Event ID 7045/4697) involving RMM not on the list, and specifically
    on portable RMM executables launched from user-writable paths (\Users\*\Downloads, \AppData\Local\Temp)
    — the exact callback-phishing pattern where the operator has the victim run signed, install-free RMM
    to evade application control ([CISA AA23-025A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-025a)).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong lead that a
    voice-phishing operation has produced follow-on activity; pivot to the responsible user, host, and
    process lineage, the destination infrastructure and its reputation, any remote-access sessions or
    downloaded payloads, and the timeline around the suspected call to scope impact. A negative result
    helps reduce suspicion for this specific vector but should be corroborated with the other questions
    in this playbook, since voice phishing leaves few direct logs and a single method can miss stealthy
    activity.'
