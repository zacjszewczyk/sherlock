- question: '[Reconnaissance] Role baseline, first-seen, and connection-volume profiling: Can you determine
    whether a remote administration tool (e.g., AnyDesk, TeamViewer, ScreenConnect) is installed or executed
    on an endpoint, and the tool is not on the organization''s approved software list or the user is not
    part of an authorized group (e.g., IT support). -- specifically, using the ''Role baseline, first-seen,
