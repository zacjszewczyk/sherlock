questions:
- question: '[Privilege Escalation] Security Auth Execution Rule: Can you determine whether execution
    of the ''/usr/libexec/security_authtrampoline'' binary, the underlying mechanism for the AuthorizationExecuteWithPrivileges
    API call, where the parent process is unsigned, uncommon, or located in a user-writable directory
    and the execution context indicates an attempt to elevate privileges through a user prompt. -- specifically,
    using the ''Security Auth Execution Rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Privilege Escalation tactic (TA0004), this technique addresses
    the mission question -- Has the adversary successfully escalated privileges on a macOS host using
    an execution prompt? T1548.004 abuses the macOS AuthorizationExecuteWithPrivileges API (routed through
    /usr/libexec/security_authtrampoline), which prompts the user for credentials but performs NO validation
    of the calling program''s origin or integrity, so malware such as Shlayer/ZShlayer fake installers
    and OSX/Coldroot use it to obtain root and then install persistence. This evidence focuses on the
    condition that Execution of the ''/usr/libexec/security_authtrampoline'' binary, the underlying mechanism
    for the AuthorizationExecuteWithPrivileges API call, where the parent process is unsigned, uncommon,
    or located in a user-writable directory and the execution context indicates an attempt to elevate
    privileges through a user prompt. This Symbolic Logic approach works as follows: Alert on any process
    execution of ''/usr/libexec/security_authtrampoline'' (the deterministic kernel/securityd routing
    for the AuthorizationExecuteWithPrivileges API, which performs NO origin/integrity validation of the
    caller [AuthorizationExecuteWithPrivileges, Apple](https://developer.apple.com/documentation/security/1540038-authorizationexecutewithprivileg))
    where the ESF-reported parent process is unsigned, is not an Apple platform binary, has a non-Apple/non-approved
    Team ID, or executes from a user-writable path (''/tmp/'',''/var/tmp/'',''/Users/Shared/'',''~/Downloads'',''~/Library/Application
    Support''). Use Endpoint Security ES_EVENT_TYPE_NOTIFY_EXEC fields (signing status, team ID, cdhash,
    responsible UID, full lineage) directly, with no external API lookup required [Endpoint Security Framework,
    Apple](https://developer.apple.com/documentation/endpointsecurity). Add the Elastic deterministic
    floor for scripted elevation: process.name==''osascript'' and command_line matches ''osascript*with
    administrator privileges'' executed without an interactive password prompt [Apple Scripting Execution
    with Administrator Privileges, Elastic](https://www.elastic.co/guide/en/security/current/apple-scripting-execution-with-administrator-privileges.html).
    Tradecraft and real callers (Shlayer/ZShlayer fake installers, OSX/Coldroot) per [T1548.004, MITRE
    ATT&CK](https://attack.mitre.org/techniques/T1548/004/) and [From Shlayer to ZShlayer, SentinelOne](https://www.sentinelone.com/blog/coming-out-of-your-shell-from-shlayer-to-zshlayer/).
    A positive result -- a rule match, statistical outlier, or model alert -- is consistent with an adversary
    coaxing a user into granting root and then operating with elevated privileges; pivot to the responsible
    (parent) process, its signing status/Team ID and cdhash, its on-disk path and age, the full execution
    lineage, whether the credential prompt was cancelled before a later success, and any subsequent persistence
    creation or network egress. A negative result helps rule out this elevation vector for the inspected
    scope but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy or living-off-the-land abuse.'
  answer_sources:
  - macOS Endpoint Security Framework (ESF) ES_EVENT_TYPE_NOTIFY_EXEC
  - macOS Unified Log
  - 'NAI: macOS Endpoints (laptops, desktops, servers)'
  range: Last 90 days (correlate within short windows, e.g. <=15 min around the prompt)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Security Auth Execution Rule

      source IN [macOS Endpoint Security Framework (ESF) ES_EVENT_TYPE_NOTIFY_EXEC, macOS Unified Log]

      | WHERE matches_action_criteria("Security Auth Execution Rule")

      // Alert on any process execution of ''/usr/libexec/security_authtrampoline'' (the deterministic
      kernel/securityd routing for the AuthorizationEx

      | ALERT enrich(host, user, parent_process, process, signing_id, team_id, file, dest)'
- question: '[Privilege Escalation] Parent Prevalence Baseline: Can you determine whether execution of
    the ''/usr/libexec/security_authtrampoline'' binary, the underlying mechanism for the AuthorizationExecuteWithPrivileges
    API call, where the parent process is unsigned, uncommon, or located in a user-writable directory
