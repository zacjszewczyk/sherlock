name: 'T1548.004: Abuse Elevation Control Mechanism: Elevated Execution with Prompt'
id: 78baa0f9-3b46-4e0b-8879-fa66bc4701ce
description: 'This playbook helps an analyst investigate whether an adversary has abused the macOS AuthorizationExecuteWithPrivileges
  API (MITRE ATT&CK T1548.004) -- realized on disk as execution of /usr/libexec/security_authtrampoline
  -- to escalate to root by prompting the user for credentials. Because this API performs no origin or
  integrity checks on the calling program, fake installers and trojanized apps (e.g. Shlayer/ZShlayer,
  OSX/Coldroot) can coax a user into granting root and then install persistence or pivot into the wider
  environment. The playbook hunts the abuse from several angles: execution of security_authtrampoline
  whose parent is unsigned, non-Apple, has an unknown Team ID, or runs from a user-writable path (including
  osascript ''with administrator privileges''); statistical rarity of the elevating parent across the
  fleet and repeated cancelled-then-successful prompts indicating credential coaxing; explainable ML classification
  of the elevation call; correlation of elevation to threat-intel C2 callbacks, rare JA3/JA3S TLS fingerprints,
  self-signed/odd-port TLS, DGA/anonymization DNS, and anomalous outbound data volume; macOS-to-Windows
  remote logons and follow-on defense-evasion/log-clearing on critical servers; and creation of LaunchAgents,
  LaunchDaemons, or privileged helper tools minutes after a successful prompt. Detection methods combine
  symbolic-logic rules, statistical baselining/anomaly detection, and machine-learning models (decision
  trees, isolation forests, one-class SVM, ARIMA/seasonal time series, HMMs, and provenance-graph learning)
  applied to macOS Endpoint Security Framework and Unified Log telemetry, Zeek network logs, and Windows
  event logs, so the analyst can corroborate suspected privilege escalation against process lineage, prompt
  state, persistence, and exfiltration context.'
