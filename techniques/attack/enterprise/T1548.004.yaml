  context: 'Why this matters: Under the Privilege Escalation tactic (TA0004), this technique addresses
    the mission question -- Has the adversary successfully escalated privileges on a macOS host using
    an execution prompt? T1548.004 abuses the macOS AuthorizationExecuteWithPrivileges API (routed through
    /usr/libexec/security_authtrampoline), which prompts the user for credentials but performs NO validation
    of the calling program''s origin or integrity, so malware such as Shlayer/ZShlayer fake installers
    and OSX/Coldroot use it to obtain root and then install persistence. This evidence focuses on the
    condition that Execution of the ''/usr/libexec/security_authtrampoline'' binary, the underlying mechanism
    for the AuthorizationExecuteWithPrivileges API call, where the parent process is unsigned, uncommon,
    or located in a user-writable directory and the execution context indicates an attempt to elevate
    privileges through a user prompt. This Statistical Method approach works as follows: For each ''security_authtrampoline''
    execution, compute the enterprise-wide prevalence of its parent process (by cdhash and by signing-id).
    Flag parents in the bottom 5th percentile of prevalence, those seen on fewer than 5 hosts, or those
    never observed in the prior 90 days; treat first-seen unsigned parents as high-confidence outliers.
    Profile the FAILURE/STATE dimension explicitly: count authorization prompts that the user CANCELS
    or that return errSecAuthFailed per parent — repeated failed-then-success elevation attempts from
    one binary is a distinct credential-coaxing signal [Isolation Forest, Liu et al](https://doi.org/10.1145/2133360.2133363).
    Also surface VOLUME (number of trampoline execs per parent per day) and FREQUENCY (execs/min) since
    benign installers elevate once, not repeatedly. A positive result -- a rule match, statistical outlier,
    or model alert -- is consistent with an adversary coaxing a user into granting root and then operating
    with elevated privileges; pivot to the responsible (parent) process, its signing status/Team ID and
    cdhash, its on-disk path and age, the full execution lineage, whether the credential prompt was cancelled
    before a later success, and any subsequent persistence creation or network egress. A negative result
    helps rule out this elevation vector for the inspected scope but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy or living-off-the-land abuse.'
