    Services.xml, ScheduledTasks.xml) from the SYSVOL share, and this access is inconsistent with its
    established baseline of behavior. This Statistical Method approach works as follows: Per user/host,
    baseline the volume and frequency of SYSVOL GPP-XML access — files read per hour, distinct GPP files
