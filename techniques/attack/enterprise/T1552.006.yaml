    approach works as follows: Apply a time-series anomaly model (ARIMA or STL decomposition) to the per-minute
    frequency of command executions targeting the SYSVOL path, trained on historical baselines to flag
    sudden spikes indicative of automated discovery scripts. For richer sequence context, model the log-key
    sequence of search/enumeration events with an LSTM and flag low-probability execution paths ([DeepLog,
