- question: '[Credential Access] Alert on non-admin SYSVOL GPP reads: Can you determine whether a user
    account or host machine is observed reading specific GPP XML files (e.g., Groups.xml, Services.xml,
    ScheduledTasks.xml) from the SYSVOL share, and this access is inconsistent with its established baseline
    of behavior. -- specifically, using the ''Alert on non-admin SYSVOL GPP reads'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary searches the world-readable
    SYSVOL share on Domain Controllers for Group Policy Preferences XML files and decrypts the embedded
    ''cpassword'' using the public AES key (MS14-025) to recover local-admin and service credentials --
    a fast path to privileged access across many domain-joined hosts. This evidence focuses on the condition
    that a user account or host machine is observed reading specific GPP XML files (e.g., Groups.xml,
    Services.xml, ScheduledTasks.xml) from the SYSVOL share, and this access is inconsistent with its
    established baseline of behavior. This Symbolic Logic approach works as follows: Generate a high-priority
    alert when a principal NOT in Domain Admins / Enterprise Admins reads GPP-related XML files (Groups.xml,
    Services.xml, ScheduledTasks.xml, DataSources.xml, Printers.xml, Drives.xml) from SYSVOL, via Windows
    Event ID 5145/4663 or Zeek smb_files.log. These exact file names and SYSVOL paths are the documented
    GPP credential stores ([Get-GPPPassword, PowerShellMafia PowerSploit](https://github.com/PowerShellMafia/PowerSploit/blob/master/Exfiltration/Get-GPPPassword.ps1);
    [Microsoft Security Bulletin MS14-025](https://learn.microsoft.com/en-us/security-updates/securitybulletins/2014/ms14-025)).
    Separately track access-denied results (Event ID 4656, SMB STATUS_ACCESS_DENIED) as a distinct failed-discovery
    signal — a burst of denials still indicates hunting. A positive result -- a rule match, statistical
    outlier, or model alert -- is strong evidence of GPP credential hunting or decryption; pivot to the
    responsible process and its parent lineage, the user/host and its privilege context, the specific
    SYSVOL GPP files touched, the enumeration-to-read sequence, and any subsequent reuse of recovered
    credentials across hosts. A negative result helps rule out this particular GPP vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy or
    living-off-the-land tradecraft.'
