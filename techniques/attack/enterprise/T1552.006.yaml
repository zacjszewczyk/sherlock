    or model alert -- is strong evidence of GPP credential hunting or decryption; pivot to the responsible
    process and its parent lineage, the user/host and its privilege context, the specific SYSVOL GPP files
    touched, the enumeration-to-read sequence, and any subsequent reuse of recovered credentials across
    hosts. A negative result helps rule out this particular GPP vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy or living-off-the-land
    tradecraft.'
