    Z-score |z|>3.5 to resist administrative bursts ([Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    The same baseline-then-percentile-spike pattern used to catch defense-impairment tooling transfers
    directly here ([Detecting EDR Killers Using Statistical Deviations](https://www.cardinalops.com/blog/detecting-edr-killers-using-statistical-deviations/)).
