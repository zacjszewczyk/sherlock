name: 'T1552.006: Group Policy Preferences'
id: fd0ba678-3b40-4ae2-af18-c81fb4002cd8
description: 'This playbook helps an analyst investigate whether an adversary has located and decrypted
  unsecured credentials stored in Group Policy Preferences (GPP) as part of the Credential Access tactic.
  Administrators historically used GPP to push local accounts and passwords to domain-joined machines,
  embedding an AES-encrypted ''cpassword'' value inside XML files (Groups.xml, Services.xml, ScheduledTasks.xml,
  DataSources.xml, Printers.xml, Drives.xml) stored in the world-readable SYSVOL share on every Domain
  Controller. Because Microsoft published the static AES key (MS14-025), any authenticated domain user
  can read these files and trivially recover plaintext credentials, often granting local-administrator
  or service access across many hosts at once. This playbook guides the analyst across several complementary
  detection angles: execution of known GPP credential-dumping tools and scripts (Get-GPPPassword, gpprefdecrypt.py,
  the Metasploit GPP module) matched by command line, script block, and file hash; command-line searches
  for the ''cpassword'' string and recursive ''*.xml'' enumeration of SYSVOL using findstr/grep/Select-String;
  unauthorized or anomalous reads of the specific GPP XML files from SYSVOL via SMB; access patterns where
  a host first broadly enumerates SYSVOL and then targets a specific GPP XML file; and high-fidelity honeyfile
  tripwires placed inside SYSVOL policy directories. Detection methods combine symbolic-logic rules, statistical
  baselining and spike detection, and machine-learning models applied to Windows Security audit events
  (4688, 4663, 5145, 4656), PowerShell script-block logs (4104), Sysmon process and file events, and Zeek
  SMB telemetry (smb_files.log, smb_mapping.log), so the analyst can corroborate suspected GPP credential
  theft against process lineage, file and share access, enumeration-to-read sequences, and decoy interaction.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
