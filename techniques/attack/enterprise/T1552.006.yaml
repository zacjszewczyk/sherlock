  - 'NAI: File access audit logs on Domain Controllers; Network traffic monitoring points capturing SMB
    traffic to and from Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: FROM gpp_xml_access | bin _time span=1h | stats count AS files_read, dc(object) AS distinct_gpp,
      sum(bytes) AS bytes BY user,_time | eventstats mean(files_read) AS mu, stdev(files_read) AS sd,
      median(files_read) AS med, median(abs(files_read-med)) AS mad BY user_or_peer | eval z=(files_read-mu)/sd,
      mz=0.6745*(files_read-med)/mad | where z > 3 OR abs(mz) > 3.5
