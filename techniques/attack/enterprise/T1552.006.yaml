  - 'NAI: File access audit logs on Domain Controllers; Network traffic monitoring points capturing SMB
    traffic to and from Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM file_access WHERE source IN ('WinEventID:5145','WinEventID:4663') OR zeek_smb_files AND
      object_name MATCHES /(Groups|Services|ScheduledTasks|DataSources|Printers|Drives)\.xml/i AND object_path
      CONTAINS 'SYSVOL' AND subject_user NOT IN (Domain_Admins, Enterprise_Admins) | alert priority=high;
      ALSO track WinEventID:4656 / SMB STATUS_ACCESS_DENIED as failed-discovery signal
  - technology: Zeek/pseudocode
    query: smb_files.log WHERE name =~ /(Groups|Services|ScheduledTasks|DataSources|Printers|Drives)\.xml/
      AND path =~ /SYSVOL/ AND action=='SMB::FILE_OPEN' AND client_user NOT IN admin_set -> notice
- question: '[Credential Access] Baseline and flag anomalous SYSVOL access volume: Can you determine whether
    a user account or host machine is observed reading specific GPP XML files (e.g., Groups.xml, Services.xml,
    ScheduledTasks.xml) from the SYSVOL share, and this access is inconsistent with its established baseline
