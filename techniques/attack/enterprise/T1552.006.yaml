    that a command-line execution is observed using a text-searching utility (e.g., findstr, grep, Select-String)
    to find the string ''cpassword'' within XML files on a SYSVOL network share. This Symbolic Logic approach
    works as follows: Create a SIEM rule using regex over process command lines (Windows Event ID 4688
    / Sysmon EID 1) and PowerShell script blocks (Windows Event ID 4104) to detect search/enumeration
    utilities targeting the ''cpassword'' string in SYSVOL XML files, e.g. `.*(findstr|find|grep|Select-String|sls).*cpassword.*`
