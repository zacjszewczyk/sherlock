- question: '[Credential Access] Time-series spike detection for cpassword: Can you determine whether
    a command-line execution is observed using a text-searching utility (e.g., findstr, grep, Select-String)
    to find the string ''cpassword'' within XML files on a SYSVOL network share. -- specifically, using
    the ''Time-series spike detection for cpassword'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary searches the world-readable
    SYSVOL share on Domain Controllers for Group Policy Preferences XML files and decrypts the embedded
    ''cpassword'' using the public AES key (MS14-025) to recover local-admin and service credentials --
