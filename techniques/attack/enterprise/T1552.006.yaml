    one-liners are documented offensive tradecraft per [Get-GPPPassword, PowerShellMafia PowerSploit](https://github.com/PowerShellMafia/PowerSploit/blob/master/Exfiltration/Get-GPPPassword.ps1);
    reuse the argument-matching approach in [Suspicious Windows Command Shell Arguments, Elastic](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/)
