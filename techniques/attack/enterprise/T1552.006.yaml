questions:
- question: '[Credential Access] Rule for GPP tool command lines: Can you determine whether a process
    creation event is observed where the process name, command-line arguments, or file hash corresponds
    to a known Group Policy Preferences (GPP) credential dumping tool. -- specifically, using the ''Rule
    for GPP tool command lines'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary searches the world-readable
    SYSVOL share on Domain Controllers for Group Policy Preferences XML files and decrypts the embedded
    ''cpassword'' using the public AES key (MS14-025) to recover local-admin and service credentials --
    a fast path to privileged access across many domain-joined hosts. This evidence focuses on the condition
    that a process creation event is observed where the process name, command-line arguments, or file
    hash corresponds to a known Group Policy Preferences (GPP) credential dumping tool. This Symbolic
    Logic approach works as follows: Implement a SIEM rule that triggers on process creation (Windows
    Event ID 4688 / Sysmon EID 1) or PowerShell script block logs (Windows Event ID 4104) where the command
    line or script content contains GPP-dumping indicators: ''Get-GPPPassword'', ''gpprefdecrypt'', ''Get-DecryptedCpassword'',
    ''cpassword'', the Metasploit module ''post/windows/gather/credentials/gpp'', or the public GPP AES
    key bytes. These strings and the SYSVOL file targets (Groups.xml, ScheduledTasks.xml, Services.xml,
    DataSources.xml) are defined by [Get-GPPPassword, PowerShellMafia PowerSploit](https://github.com/PowerShellMafia/PowerSploit/blob/master/Exfiltration/Get-GPPPassword.ps1)
    and the underlying flaw is documented in [Microsoft Security Bulletin MS14-025](https://learn.microsoft.com/en-us/security-updates/securitybulletins/2014/ms14-025).
    Translate to deployable rules using the [SigmaHQ](https://github.com/SigmaHQ/sigma) corpus and correlate
    process hashes against known-tool hash feeds. A positive result -- a rule match, statistical outlier,
    or model alert -- is strong evidence of GPP credential hunting or decryption; pivot to the responsible
    process and its parent lineage, the user/host and its privilege context, the specific SYSVOL GPP files
    touched, the enumeration-to-read sequence, and any subsequent reuse of recovered credentials across
    hosts. A negative result helps rule out this particular GPP vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy or living-off-the-land
    tradecraft.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Process execution logs on all endpoints, including Domain Controllers, Member Servers, and User
    Workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: SELECT host, user, process, command_line, hash FROM proc_creation WHERE source IN ('WinEventID:4688','Sysmon:EID1','WinEventID:4104')
      AND (command_line MATCHES /(Get-GPPPassword|gpprefdecrypt|Get-DecryptedCpassword|cpassword)/i OR
      command_line CONTAINS 'post/windows/gather/credentials/gpp' OR command_line CONTAINS '<public GPP
      AES key bytes>' OR hash IN (known_gpp_tool_hashes)) | alert priority=high
- question: '[Credential Access] Baseline rare GPP-dumping process volume and frequency: Can you determine
    whether a process creation event is observed where the process name, command-line arguments, or file
    hash corresponds to a known Group Policy Preferences (GPP) credential dumping tool. -- specifically,
    using the ''Baseline rare GPP-dumping process volume and frequency'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary searches the world-readable
    SYSVOL share on Domain Controllers for Group Policy Preferences XML files and decrypts the embedded
    ''cpassword'' using the public AES key (MS14-025) to recover local-admin and service credentials --
    a fast path to privileged access across many domain-joined hosts. This evidence focuses on the condition
    that a process creation event is observed where the process name, command-line arguments, or file
    hash corresponds to a known Group Policy Preferences (GPP) credential dumping tool. This Statistical
    Method approach works as follows: Per host, baseline the daily count and inter-arrival frequency of
    processes that read SYSVOL XML files and the count of AES-decrypt operations; alert when a host''s
    count exceeds the outlier-resistant modified Z-score threshold (|z|>3.5, median/MAD) computed across
    the fleet, which resists distortion from legitimate gpupdate batch jobs ([Modified Z-Score for Anomaly
    Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)). Reinforce
    with simple mean ± 3σ per-account baselining of process-execution rates as in [Finding Anomalies in
    Windows Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
    The alert text must state the observed count, the host baseline, and the z-score. A positive result
    -- a rule match, statistical outlier, or model alert -- is strong evidence of GPP credential hunting
    or decryption; pivot to the responsible process and its parent lineage, the user/host and its privilege
    context, the specific SYSVOL GPP files touched, the enumeration-to-read sequence, and any subsequent
    reuse of recovered credentials across hosts. A negative result helps rule out this particular GPP
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy or living-off-the-land tradecraft.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Process execution logs on all endpoints, including Domain Controllers, Member Servers, and User
    Workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: FROM proc_creation WHERE reads_sysvol_xml OR aes_decrypt_op | bin _time span=1d | stats count
      AS c BY host,_time | eventstats median(c) AS med, median(abs(c-med)) AS mad BY host | eval mz =
      0.6745*(c-med)/mad | where abs(mz) > 3.5 | table host,_time,c,med,mz
- question: '[Credential Access] ML score for suspicious GPP processes: Can you determine whether a process
    creation event is observed where the process name, command-line arguments, or file hash corresponds
    to a known Group Policy Preferences (GPP) credential dumping tool. -- specifically, using the ''ML
    score for suspicious GPP processes'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary searches the world-readable
    SYSVOL share on Domain Controllers for Group Policy Preferences XML files and decrypts the embedded
    ''cpassword'' using the public AES key (MS14-025) to recover local-admin and service credentials --
    a fast path to privileged access across many domain-joined hosts. This evidence focuses on the condition
    that a process creation event is observed where the process name, command-line arguments, or file
    hash corresponds to a known Group Policy Preferences (GPP) credential dumping tool. This Machine Learning
    approach works as follows: Score process-creation feature vectors (parent process, command-line tokens,
    user context, image path, child network connection to a DC SYSVOL UNC) with an unsupervised Isolation
    Forest or its robust Extended Isolation Forest variant ([Isolation Forest, Liu et al](https://doi.org/10.1145/2133360.2133363);
    [Extended Isolation Forest, Hariri et al](https://arxiv.org/pdf/1811.02141)); a One-Class SVM trained
    only on benign process activity with LIME attribution surfaces why a process scored anomalous ([Robust
    IoT security using isolation forest and one class SVM algorithms](https://www.nature.com/articles/s41598-025-20445-4)).
    Escalate any anomalous process also connecting to \\<DOMAIN>\SYSVOL\. The alert must list the top-3
    contributing features (e.g., command-line token ''cpassword'', parent=powershell, SYSVOL connection).
    A positive result -- a rule match, statistical outlier, or model alert -- is strong evidence of GPP
    credential hunting or decryption; pivot to the responsible process and its parent lineage, the user/host
    and its privilege context, the specific SYSVOL GPP files touched, the enumeration-to-read sequence,
    and any subsequent reuse of recovered credentials across hosts. A negative result helps rule out this
    particular GPP vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy or living-off-the-land tradecraft.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Process execution logs on all endpoints, including Domain Controllers, Member Servers, and User
    Workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = vectorize(parent_process, command_line_tokens, user_context, image_path, child_conn_to_DC_SYSVOL_UNC)
      FROM proc_creation; model = IsolationForest(or ExtendedIsolationForest) trained on benign proc activity;
      score = model.decision_function(features); if score is outlier AND connects_to(''\\<DOMAIN>\SYSVOL\''):
      alert(top3_contributing_features)  # e.g. token ''cpassword'', parent=powershell, SYSVOL conn'
- question: '[Credential Access] Detect cpassword searches via regex: Can you determine whether a command-line
    execution is observed using a text-searching utility (e.g., findstr, grep, Select-String) to find
    the string ''cpassword'' within XML files on a SYSVOL network share. -- specifically, using the ''Detect
    cpassword searches via regex'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary searches the world-readable
