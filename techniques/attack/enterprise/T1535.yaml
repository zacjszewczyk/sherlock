- question: '[Stealth] Rare-region baseline (Statistical Method): Can you determine whether a cloud API
    call or image import originates from an identity, source IP, or user agent that is associated with
    an unapproved region or unusual management path, and the request references a public image or resource
    used for follow-on activity. -- specifically, using the ''Rare-region baseline'' (Statistical Method)
    approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary who controls cloud-management
    credentials provisions or modifies resources in regions the organization neither uses nor monitors,
    blending malicious activity into a blind spot where standard logging and detection may be absent.
    This evidence focuses on the condition that a cloud API call or image import originates from an identity,
    source IP, or user agent that is associated with an unapproved region or unusual management path,
    and the request references a public image or resource used for follow-on activity. This Statistical
    Method approach works as follows: Build a 90-day per-account/per-workload baseline of region usage,
    source-IP frequency, and user-agent rarity. Flag first-time regions or combinations below the 5th
    percentile of historical frequency; for sparse regions use the median/MAD modified z-score and flag
    |Mz|>3.5 (robust to skew) ([DEW #145: Anomaly Detection with the Modified Z-Score, Detection Engineering
    Weekly](https://www.detectionengineering.net/p/dew-145-anomaly-detection-with-the)). Profile AccessDenied/throttling
    rate per principal as a distinct precursor signal. A positive result -- a statistical outlier -- suggests
    cloud activity is occurring in an unapproved or historically unused region in a way that deviates
    from sanctioned administration; pivot to the responsible IAM principal, its source IP/user agent,
    the region and resource(s) created, any preceding credential or permission-enumeration activity, and
    subsequent egress. A negative result helps reduce the likelihood of unused-region abuse along this
    dimension but should be corroborated with the other questions in this playbook, since a single method
    can miss slow, low-volume, or otherwise stealthy region abuse.'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud Provider Management Console/API Endpoints, Threat Intelligence Platform, Cloud Provider
    Image Marketplace'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "# Rare-region baseline\nsource IN [AWS CloudTrail, Azure Activity Logs, GCP Audit Logs]\n\
      baseline = per_principal_per_region(window=90d): count, freq, entropy\ncompute modified_z = 0.6745*(x\
      \ - median)/MAD\nif region.freq < p05 OR abs(modified_z) > 3.5 OR change_point_detected(series):\n\
      \    alert(principal, region, metric, deviation)"
