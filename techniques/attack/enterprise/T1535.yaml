questions:
- question: '[Stealth] Region and source allowlist rule (Symbolic Logic): Can you determine whether a
    cloud API call or image import originates from an identity, source IP, or user agent that is associated
    with an unapproved region or unusual management path, and the request references a public image or
    resource used for follow-on activity. -- specifically, using the ''Region and source allowlist rule''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary who controls cloud-management
    credentials provisions or modifies resources in regions the organization neither uses nor monitors,
    blending malicious activity into a blind spot where standard logging and detection may be absent.
    This evidence focuses on the condition that a cloud API call or image import originates from an identity,
    source IP, or user agent that is associated with an unapproved region or unusual management path,
    and the request references a public image or resource used for follow-on activity. This Symbolic Logic
    approach works as follows: Maintain an explicit allow-list of approved regions and approved management
    source IPs/CIDRs and user agents. Alert (high severity) on any cloud-audit event whose region/location
    is off-list, or whose source IP/user agent is not on the management allow-list, especially when the
    call creates or references a public image/resource for follow-on activity. Enforce preventatively
    with AWS SCP `aws:RequestedRegion` deny, Azure Policy allowed-locations, or GCP Org Policy `gcp.resourceLocations`
    ([Detections in the Sky: Sigma Rules to Enhance Cloud Security, Recorded Future](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security)).
    A positive result -- a deterministic rule match -- suggests cloud activity is occurring in an unapproved
    or historically unused region in a way that deviates from sanctioned administration; pivot to the
    responsible IAM principal, its source IP/user agent, the region and resource(s) created, any preceding
    credential or permission-enumeration activity, and subsequent egress. A negative result helps reduce
    the likelihood of unused-region abuse along this dimension but should be corroborated with the other
    questions in this playbook, since a single method can miss slow, low-volume, or otherwise stealthy
    region abuse.'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud Provider Management Console/API Endpoints, Threat Intelligence Platform, Cloud Provider
    Image Marketplace'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Region and source allowlist rule\nsource IN [AWS CloudTrail, Azure Activity Logs, GCP Audit\
      \ Logs]\napproved_regions = allowlist(); approved_src = mgmt_allowlist()\nif event.region NOT IN\
      \ approved_regions\n   OR event.sourceIP NOT IN approved_src\n   OR event.userAgent NOT IN approved_src:\n\
      \    alert(severity=high, principal=userIdentity, region=event.region,\n          api=eventName,\
      \ src=sourceIPAddress)"
