name: 'T1535: Unused/Unsupported Cloud Regions'
id: 3cda5d56-4980-4e76-be96-ab61692ca241
description: 'This playbook helps an analyst investigate whether an adversary is abusing unused or unsupported
  cloud regions to evade detection (MITRE ATT&CK T1535) under the Stealth tactic. Adversaries who have
  compromised cloud-management credentials may stand up resources -- compute instances, storage buckets,
  databases -- in geographic service regions the organization does not normally use or actively monitor,
  where logging services such as GuardDuty may be disabled and advanced detection is unavailable, in order
  to operate undetected (e.g., cryptomining via resource hijacking or C2 staging). It guides the hunt
  across several behavioral angles: cloud API calls or image imports originating from off-allowlist regions,
  source IPs, or user agents; first-seen and rare-region baselining per IAM principal; rapid resource
  setup chains (CreateUser -> CreateAccessKey -> RunInstances) in unapproved regions; AccessDenied/permission-enumeration
  bursts preceding new-region provisioning; resource-creation events whose region/location field is off
  the approved allow-list; security-degrading calls (StopLogging, DeleteTrail, open 0.0.0.0/0 security
  groups) and rare/high-powered instance types appearing in dead regions; and outbound network traffic,
  DNS, and TLS from unapproved-region resources indicative of C2 or cryptomining. Detection methods combine
  symbolic-logic allow-list and sequence rules, statistical baselining/change-point/forecasting, and machine-learning
  anomaly detection applied to AWS CloudTrail, Azure Activity Logs, Google Cloud Audit Logs, VPC Flow
  Logs, and Zeek conn/dns/http telemetry, so the analyst can corroborate suspected unused-region abuse
  against identity, region history, resource posture, and egress context.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
