- question: 'Using statistical baselining (Script entropy / char-frequency anomaly), can you identify
    anomalous decoding behavior that deviates from normal activity? Specifically: Per [More Detecting
    Obfuscated PowerShell](https://www.leeholmes.com/more-detecting-obfuscated-powershell/) and [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf),
    baseline 30 days of PowerShell script-block Shannon entropy AND cosine similarity to an English letter-frequency
    vector; alert when a block exceeds the 99th entropy percentile or drops below ~0.6 cosine similarity.
    Per [Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/),
    prefer KL-divergence vs. a natural-language reference for embedded Base64 blobs. Track Volume (decoded
    byte length), Frequency (script blocks/min/host), and State (parse success vs. error) as distinct
    features.'
