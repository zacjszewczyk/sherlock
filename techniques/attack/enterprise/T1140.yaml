    query: "// Deterministic rule: Decoder utility IOC list\nMATCH events FROM [Windows Event ID 4688,\
      \ Windows Event ID 4104, Windows Event ID 4663, Zeek http.log]\nWHERE decode_indicator_present()\
      \   // see approach below\n  AND enrich(parent_process, user, host, command_line, output_path)\n\
      ALERT WITH context\n// Approach: Monitor 4688/4104 for executables or script hosts on the curated\
      \ decoder list (certutil.exe, expand.exe, makecab.exe, extrac32.exe, powershell.exe, cscript/wscript)\
      \ enumerated in [LOLBAS Project](https://lolbas-project.github.io/), then enrich each hit with parent\
      \ process, user, and command line; apply user/host/parent context gating per [Identifying and Mitigating\
      \ Living off the Land Techniques](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF)\
      \ so signed-binary decodes are scored, not whitelisted."
