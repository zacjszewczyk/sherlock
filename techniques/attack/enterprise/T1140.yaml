questions:
- question: 'Using deterministic rule logic (Decoder utility IOC list), can you confirm that an adversary
    is deobfuscating or decoding files or information on this host? Specifically: Monitor 4688/4104 for
    executables or script hosts on the curated decoder list (certutil.exe, expand.exe, makecab.exe, extrac32.exe,
    powershell.exe, cscript/wscript) enumerated in [LOLBAS Project](https://lolbas-project.github.io/),
    then enrich each hit with parent process, user, and command line; apply user/host/parent context gating
    per [Identifying and Mitigating Living off the Land Techniques](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF)
    so signed-binary decodes are scored, not whitelisted.'
  context: 'Information requirement: Is the adversary attempting to deobfuscate or decode files or information
    to evade our defenses? (PIR) Tactic context (Stealth): the adversary deobfuscates or decodes staged,
    encoded, compressed, or encrypted artifacts to reveal a payload at runtime while blending in with
    legitimate tool usage, reducing the likelihood of detection. Evidence under investigation: A process
    is created from a known decoding utility or script host, and the same host produces script block content
    or file access patterns consistent with deobfuscation behavior. Approach (Decoder utility IOC list):
    Monitor 4688/4104 for executables or script hosts on the curated decoder list (certutil.exe, expand.exe,
    makecab.exe, extrac32.exe, powershell.exe, cscript/wscript) enumerated in [LOLBAS Project](https://lolbas-project.github.io/),
    then enrich each hit with parent process, user, and command line; apply user/host/parent context gating
    per [Identifying and Mitigating Living off the Land Techniques](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF)
    so signed-binary decodes are scored, not whitelisted. A positive result means a host exhibits decoding
    behavior consistent with concealing an intrusion artifact - pivot from the hit to the decoder''s parent
    process, user, command line, output file, and any subsequent child-process execution or outbound network
    connection to a low-reputation host. A negative result means observed activity matches expected baselines
    for legitimate administrative or developer use. Investigate the named area of interest (Domain Controllers,
    Application Servers, User Workstations, Network Egress Points, DMZ Servers) and correlate the decode
    step with preceding download/staging events and following execution to establish the full download
    -> decode -> execute chain.'
