name: 'T1140: Deobfuscate/Decode Files or Information'
id: 2121ce0c-dea7-46b6-a47a-f999fa0a35cb
description: 'This playbook helps an analyst determine whether an adversary is deobfuscating or decoding
  files or information to reveal concealed payloads and evade analysis (T1140). Adversaries frequently
  stage obfuscated, encoded, compressed, or encrypted artifacts and then rely on built-in utilities or
  scripting hosts to reconstruct the real payload at runtime. This playbook surfaces that decoding step
  across platforms: on Windows it watches LOLBins such as certutil.exe (-decode/-decodehex/-urlcache -split
  -f), expand.exe, makecab.exe, extrac32.exe, and script hosts (powershell.exe -EncodedCommand, cscript/wscript/mshta),
  plus PowerShell script-block decode literals (FromBase64String, -bxor, [char], -join, Invoke-Expression)
  and cmd.exe copy /b or type binary reassembly; on Linux/ESXi and macOS it watches native decoders (base64
  -d/-D, xxd -r, openssl enc -d, gzip/gunzip, tar, uudecode, osascript) chained to chmod +x or interpreter
  execution shortly after a file is written or downloaded. It correlates host process and script telemetry
  (Windows Event ID 4688/4104/4663, Sysmon, auditd EXECVE/SYSCALL, macOS unified log) with network telemetry
  (Zeek http.log/conn.log) to catch the download -> decode -> execute/connect sequence, and flags suspicious
  Office-to-decoder parent-child spawns. Detection blends symbolic-logic IOC and parent-child rules, statistical
  baselining (entropy, character-frequency/KL-divergence, decode failure rates, ARIMA/EWMA time-series,
  percentile thresholds), and machine learning (script-block and command-line classifiers, AST/AMSI models,
  parent-child Bayesian networks, process->file->connection graph anomaly detection) to deliver explainable,
  evasion-resistant alerts for the Stealth tactic.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
