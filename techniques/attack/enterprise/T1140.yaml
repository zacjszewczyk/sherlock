  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4663
  - Zeek http.log
  - 'NAI: Domain Controllers, Application Servers, User Workstations, Network Egress Points, DMZ Servers'
  range: Last 90 days
  queries:
