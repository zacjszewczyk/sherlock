- question: 'Using statistical baselining (Decode failure-rate signal), can you identify anomalous decoding
    behavior that deviates from normal activity? Specifically: Profile malformed/throwing decode attempts
    (PowerShell 4104 error records, certutil non-zero exit) separately; a burst of failed decodes followed
    by a success on one host is high-signal per [DOSfuscation](https://i.blackhat.com/briefings/asia/2018/asia-18-bohannon-invoke_dosfuscation_techniques_for_fin_style_dos_level_cmd_obfuscation-wp.pdf).
