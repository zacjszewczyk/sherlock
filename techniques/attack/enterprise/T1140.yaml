- question: 'Using a machine-learning model (Script block classifier), can you score and flag likely deobfuscation/decoding
    activity that evades static signatures? Specifically: Train a gradient-boosted/Random-Forest classifier
    on script length, character-frequency ratios, entropy, decode-keyword counts, and symbol ratios ([Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf),[Effective
    Method for Detecting Malicious PowerShell Scripts Based on Hybrid Features](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099));
    for higher robustness add AST-structure features ([AST-Based Deep Learning for Detecting Malicious
    PowerShell](https://dl.acm.org/doi/10.1145/3243734.3278496)) or score AMSI-captured post-deobfuscation
    content with contextual embeddings ([AMSI-Based Detection of Malicious PowerShell Code Using Contextual
    Embeddings](https://arxiv.org/pdf/1905.09538)). Emit the top-3 contributing features (e.g., entropy,
    FromBase64String count, encoded length) in alert text.'
