name: 'T1001: Data Obfuscation'
id: a388e3d1-8fbc-4a1b-9e8c-8d253194afd3
description: 'This playbook helps an analyst investigate adversary Data Obfuscation of command-and-control
  traffic (T1001) — where C2 content is hidden, but not necessarily encrypted, via junk-data padding,
  steganography, protocol impersonation, and DNS/TLS tunneling. It guides investigation of Zeek network
  telemetry (conn.log, dns.log, ssl.log, http.log, weird.log) and host telemetry (Windows Event IDs 4688/5156,
  Sysmon, auditd) to surface obfuscated C2 through layered methods: deterministic threat-intel and JA3/JA3S/JA4+
  fingerprint matching, YARA on TLS certificates and HTTP POST bodies, statistical detection of high-frequency/high-volume
  destinations, byte-ratio and Shannon-entropy outliers, beacon cadence (coefficient of variation), DNS
  query-length/TXT-ratio/n-gram and information-content anomalies, and machine-learning classifiers, clustering,
  time-series, graph, and autoencoder models. Each question pairs a concrete detection approach with answer
  sources, a time range, and search pseudocode so a SOC analyst can confirm or rule out obfuscated C2
  across endpoint and network evidence.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any outbound network connections, DNS queries, or TLS sessions in Zeek logs resolve to
    or match an IP address, domain, server name, or TLS fingerprint that appears on a curated threat-intelligence
    feed of known command-and-control infrastructure?
  context: 'Tactic: Command and Control. This is the deterministic detection floor for obfuscated C2.
    Adversaries hide C2 content but the endpoint they reach is often already cataloged in CTI. Join Zeek
    conn.log destination IPs, dns.log query names, and ssl.log server_name values against a maintained
    feed of malicious indicators and alert on any exact match. Because obfuscated/encrypted C2 may carry
    no usable IP or domain IOC, also hard-match Zeek ssl.log JA3/JA3S hashes against known-bad TLS fingerprint
    lists and the randomization-resilient JA4+ fingerprints, so the implant is caught by how it negotiates
    TLS even when no address IOC exists. A match is a high-confidence indicator warranting immediate host
    isolation and triage; a clean result raises confidence but does not exonerate, since novel infrastructure
    will not yet be in CTI.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Internet Gateway, DNS Resolvers, Proxy Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_conn, zeek_dns, zeek_ssl\nWHERE conn.id_resp_h IN ti_feed.c2_ip\n   OR dns.query\
      \ IN ti_feed.c2_domain\n   OR ssl.server_name IN ti_feed.c2_domain\n   OR ssl.ja3 IN ti_feed.bad_ja3\n\
      \   OR ssl.ja3s IN ti_feed.bad_ja3s\n   OR ssl.ja4 IN ti_feed.bad_ja4\nALERT severity=high, action=isolate_host"
  - technology: Zeek/pseudocode
    query: 'load intel framework; populate Intel::Item from c2 feed (ADDR, DOMAIN, ja3)

      on Intel::match -> notice(C2_IOC_Hit)'
- question: Which outbound destinations are receiving an unusually high frequency or volume of connections
    relative to a learned baseline, and are absent from the allowlist of common, expected services?
  context: 'Tactic: Command and Control. Newly stood-up C2 that is not yet in CTI still betrays itself
    statistically. Over a 24-hour sliding window, compute per-destination connections/min, connections/24h,
    and total bytes, then flag destinations in the top 99th percentile of frequency or volume that are
    not on an allowlist of common services. In parallel, profile the failure state: a destination receiving
    a high ratio of failed/reset/blocked connections (Zeek conn_state S0, REJ, RSTR) at a steady cadence
    is a strong beaconing-to-dead-infrastructure signal. Derive percentile cutoffs from at least 30 days
    of your own conn.log so thresholds reflect your environment. A flagged destination with no business
    justification is a strong lead; legitimate but rare bulk services (backups, updates) are the main
    false-positive source and should be allowlisted.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Internet Gateway, DNS Resolvers, Proxy Servers'
  range: Last 30 days for baseline; evaluate over rolling 24-hour windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_conn EARLIEST=-24h\nSTATS count AS conns, sum(orig_bytes+resp_bytes) AS bytes,\n\
      \      count(eval(conn_state IN(\"S0\",\"REJ\",\"RSTR\"))) AS failed BY id_resp_h\nEVAL fail_ratio\
      \ = failed/conns\nWHERE id_resp_h NOT IN allowlist\n  AND (conns > pct99(conns) OR bytes > pct99(bytes)\
      \ OR (fail_ratio>0.8 AND conns>50))\nALERT severity=medium"
- question: When a supervised classifier scores outbound Zeek connections for C2 likelihood using flow
    and TLS features enriched with threat intelligence, which connections exceed the high-probability
    threshold?
  context: 'Tactic: Command and Control. Obfuscation defeats single-feature rules, so combine many weak
    signals with a Random Forest trained on Zeek features (duration, orig_bytes, resp_bytes, orig/resp
    byte ratio, protocol, destination port, JA3) enriched with CTI to estimate C2 probability. Retrain
    weekly on analyst-labeled events to track drift, and escalate connections above a high-probability
    threshold. Emit the top-3 SHAP-contributing features (e.g., byte_ratio, duration, rare JA3) in the
    alert so analysts can immediately judge why a flow scored high. A high score with corroborating SHAP
    drivers is a strong investigative lead; the model supplements, never replaces, the deterministic IOC
    and statistical layers.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Internet Gateway, DNS Resolvers, Proxy Servers'
  range: Last 90 days; retrain weekly on labeled events
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [duration, orig_bytes, resp_bytes, orig_bytes/resp_bytes,\n            proto, id_resp_p,\
      \ ja3, cti_score]\nscore = RandomForest.predict_proba(features)[c2]\nIF score > 0.85:\n  ALERT severity=high,\
      \ detail=top3_shap(features)"
- question: Are any observed TLS sessions presenting a JA3 or JA3S fingerprint that matches a known malicious
    offensive-tooling signature (e.g., Cobalt Strike, Metasploit, Empire), or do extracted certificates
    match beacon YARA artifacts?
  context: 'Tactic: Command and Control. Encrypted C2 hides payload content but the TLS handshake still
    fingerprints the client and server stacks. Continuously match Zeek ssl.log JA3 and JA3S hashes against
    curated hashes for malicious frameworks and alert on exact matches. Because modern clients randomize
    TLS extensions and degrade plain JA3, additionally fingerprint with the sorted, version-stable JA4+
    suite, and YARA-scan extracted certificates for beacon artifacts. An exact fingerprint match to known
    offensive tooling is high fidelity and rarely benign; treat it as an active-implant indicator. JA4+
    coverage closes the gap left by extension randomization.'
  answer_sources:
  - Zeek ssl.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internet Gateway, DNS Resolvers, Endpoints with EDR/NTA sensors'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_ssl\nWHERE ja3 IN bad_ja3_list OR ja3s IN bad_ja3s_list\n   OR ja4 IN bad_ja4_list\n\
      ALERT severity=high, label=offensive_tool_tls"
  - technology: YARA/pseudocode
    query: 'yara_scan(zeek_extracted_certs, rules=apt_cobaltstrike.yar)

      on match -> notice(Beacon_Cert_Artifact)'
- question: Do any DNS TXT (or NULL) responses carry payloads whose Shannon entropy is far above the baseline
    for their record context, suggesting encrypted or encoded data smuggled through DNS?
  context: 'Tactic: Command and Control. DNS TXT records normally hold structured, low-entropy text (SPF,
    DKIM, domain-verification tokens). Encrypted or encoded C2 payloads cluster near maximal entropy (~7.0-8.0
    bits/byte). Compute Shannon entropy for TXT responses in Zeek dns.log, baseline legitimate contexts
    separately, and flag records with entropy more than 3 standard deviations above the per-context mean.
    Layer a volume signal: count TXT/NULL bytes returned per source host per 5-minute window and flag
    heavy hitters, since exfil/C2 via DNS requires sustained data transfer. High-entropy TXT content from
    a host with no reason to query such records is a strong tunneling indicator; per-context baselining
    avoids alerting on legitimately random verification tokens.'
  answer_sources:
  - Zeek ssl.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internet Gateway, DNS Resolvers, Endpoints with EDR/NTA sensors'
  range: Last 90 days; evaluate over rolling 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_dns WHERE qtype_name IN("TXT","NULL")

      EVAL H = shannon_entropy(answers)

      STATS mean(H) AS mu, stdev(H) AS sd BY record_context

      WHERE H > mu + 3*sd OR H >= 7.0

      | JOIN per-host 5min byte volume; flag heavy_hitters

      ALERT severity=medium'
- question: Do DNS query or response labels deviate from the expected benign character-frequency distribution,
    indicating machine-encoded tunnel data rather than human-readable domain names?
  context: 'Tactic: Command and Control. Encoded DNS-tunnel labels lose the natural-language statistics
    of legitimate domains. Score query/response label bigram (n-gram) frequencies against a benign Zipfian
    baseline table and flag low-match scores indicative of encoded content. This operates purely on first-party
    Zeek dns.log without DPI, making it resilient to encryption. Build the benign table from at least
    30 days of local DNS so it reflects your namespace. A low n-gram match score concentrated on a single
    registered domain or host points to active tunneling; established CDNs and randomized-but-legitimate
    hostnames are the main false positives and can be context-allowlisted.'
  answer_sources:
  - Zeek ssl.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internet Gateway, DNS Resolvers, Endpoints with EDR/NTA sensors'
  range: Last 90 days; benign n-gram table from last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_dns

      EVAL score = ngram_match(query_labels, benign_zipf_table)

      WHERE score < threshold_low

      STATS avg(score), count BY id_orig_h, registered_domain

      ALERT severity=medium WHERE count>20'
- question: Is there a sudden network-wide surge in the volume or novelty of JA3/JA4 TLS fingerprints
    over time that could indicate the rollout of a new C2 campaign?
  context: 'Tactic: Command and Control. A new C2 campaign introduces previously unseen TLS fingerprints
    across many hosts at once. Apply ARIMA or LSTM time-series anomaly detection to the network-wide volume
    and novelty of JA3/JA4 hashes, alerting on sudden spikes of rare or never-before-seen fingerprints.
    Surface the top-3 drivers (count of new hashes, number of source hosts, common destination) in the
    alert to speed triage. A coordinated spike of novel fingerprints, especially toward a shared destination,
    is a campaign-level indicator; gradual, single-host fingerprint changes are usually benign software
    updates.'
  answer_sources:
  - Zeek ssl.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internet Gateway, DNS Resolvers, Endpoints with EDR/NTA sensors'
  range: Last 90 days for model fit; score continuously
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = count_distinct(new_ja3_ja4) per 1h network-wide\nforecast = ARIMA/LSTM.fit(series).predict()\n\
      IF observed > forecast + k*sigma:\n  ALERT severity=medium, detail=top3(new_hash_count, src_host_count,\
      \ dest)"
- question: Do any HTTP POST request bodies in Zeek http.log contain encoding patterns, C2-framework markers,
    or protocol-impersonation indicators consistent with Malleable C2 profiles?
  context: 'Tactic: Command and Control. Adversaries impersonate legitimate HTTP and pad traffic with
    junk transforms to disguise C2. Apply YARA against Zeek http.log POST bodies to detect custom Base64
    alphabets, framework markers, and protocol-impersonation indicators such as anomalous URI/Host/User-Agent
    combinations and junk data-transform padding that persist even in customized Malleable C2 profiles.
    Alert on any hit. A YARA match on a POST body is high-fidelity given the specificity of these signatures;
    analysts should pivot to the source host and full session to confirm the implant. This complements
    entropy and ratio statistics by catching obfuscation that keeps near-normal byte distributions.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Web Proxies, Application Servers, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: YARA/pseudocode
    query: 'FROM zeek_http WHERE method="POST"

      yara_scan(post_body, rules=[malleable_c2, custom_base64, apt_cobaltstrike])

      ALSO flag anomalous (uri,host,user_agent) tuples

      on match -> ALERT severity=high'
- question: Which connections show a statistically anomalous bytes-sent-to-bytes-received ratio for their
    destination port, or carry unexpectedly high-entropy payloads on a nominally plaintext protocol?
  context: 'Tactic: Command and Control. Obfuscated C2 and staging often produce upload-heavy flows and
    high-entropy content where plaintext is expected. For Zeek conn.log connections compute orig_bytes/resp_bytes
    ratios, build port-specific IQR baselines, and flag ratios more than 1.5x IQR above Q3 as upload-heavy
    obfuscated C2. Independently compute Shannon entropy of http.log bodies and flag values above the
    per-service baseline (~7.0+), since high entropy in plaintext HTTP indicates hidden or encoded content.
    Also profile the failure state: high counts of HTTP 4xx/5xx or empty-response POSTs at a regular cadence.
    Per-port baselining keeps legitimate uploads (mail, file shares) from dominating the alerts.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Web Proxies, Application Servers, Internet Gateway'
  range: Last 90 days; port baselines from last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_conn

      EVAL ratio = orig_bytes/resp_bytes

      STATS p25(ratio) AS q1, p75(ratio) AS q3 BY id_resp_p

      EVAL iqr=q3-q1

      WHERE ratio > q3 + 1.5*iqr

      UNION (FROM zeek_http EVAL H=entropy(body) WHERE H>=7.0)

      ALERT severity=medium'
- question: Are any source-destination pairs communicating with highly regular timing and payload sizes
    (low coefficient of variation), indicating machine-generated beaconing even when the payload is obfuscated?
  context: 'Tactic: Command and Control. Beacons phone home on a schedule; obfuscation hides content but
    not cadence. Per source-destination pair, compute the coefficient of variation (CV) of connection
    inter-arrival times and of payload sizes over a 24-hour window. Low CV (highly regular intervals)
    combined with low data-size variance indicates automated beaconing rather than human-driven traffic.
    Report connection-count/min and total session duration as supporting frequency and state metrics.
    A low-CV pair with no business justification is a classic beacon; jitter-enabled implants reduce regularity,
    so combine with the IOC, fingerprint, and entropy layers rather than relying on cadence alone.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Web Proxies, Application Servers, Internet Gateway'
  range: Last 90 days; evaluate over rolling 24-hour windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_conn EARLIEST=-24h\nSORT ts BY id_orig_h,id_resp_h\nEVAL dt = ts - prev_ts\nSTATS\
      \ cv(dt) AS cv_time, cv(orig_bytes) AS cv_size,\n      count AS conns BY id_orig_h,id_resp_h\nWHERE\
      \ cv_time < 0.1 AND cv_size < 0.1 AND conns > 20\nALERT severity=medium label=beacon"
- question: When connections are clustered by their flow characteristics, which small, distant clusters
    (outliers) represent anomalous C2 that hides within individual flows?
  context: 'Tactic: Command and Control. Individual obfuscated flows can look ordinary, but as a population,
    C2 separates from normal traffic. Run DBSCAN or another density-based clustering algorithm on Zeek
    conn.log features (duration, payload size, port, protocol, byte ratio, CV) and investigate small,
    distant clusters as candidate C2. For encrypted TLS 1.3 where fingerprints fade, apply self-supervised
    representation learning on packet-size/timing/direction metadata to flag out-of-distribution flows
    without decryption. Report the top-3 contributing features per alert. Outlier clusters with consistent
    destinations or processes are strong leads; the method is unsupervised and benefits from analyst review
    to label recurring benign outliers.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Web Proxies, Application Servers, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = scale([duration, payload_size, port, proto, byte_ratio, cv])\nlabels = DBSCAN(eps, min_samples).fit_predict(X)\n\
      for small_distant_cluster in labels:\n  ALERT severity=medium, detail=top3_features(cluster)\n#\
      \ TLS1.3: score ET-SSL OOD on size/timing/direction"
- question: Are Zeek weird.log protocol-violation events (e.g., dns_unmatched_reply, data_before_established,
    possible_split_routing, malformed/oversized labels) firing, or do DNS messages exceed structural limits
    for label and name length?
  context: 'Tactic: Command and Control. Tunneling tools abuse protocols in ways that trip Zeek''s anomaly
    detectors. Monitor weird.log for high-fidelity protocol-violation events and trigger investigation
    on any match. Enforce DNS structural limits as deterministic rules: label longer than 63 bytes, name
    longer than 255 bytes, or an excessive subdomain count per registered domain. These are RFC-defined
    boundaries, so violations are inherently suspicious and rarely benign. A cluster of weird events or
    oversized labels from one host strongly suggests tunneling or split-routing C2; this deterministic
    layer underpins the statistical and ML DNS detections.'
  answer_sources:
  - Zeek weird.log
  - Zeek dns.log
  - 'NAI: Internal DNS Resolvers, Domain Controllers, Network Taps/SPAN ports'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM zeek_weird\nWHERE name IN(\"dns_unmatched_reply\",\"data_before_established\",\n    \
      \         \"possible_split_routing\",\"dns_label_too_long\")\nALERT severity=medium\n# structural:\
      \ FROM zeek_dns WHERE max(label_len)>63 OR name_len>255\n#            OR distinct_subdomains_per_domain\
      \ > N"
- question: Which hosts show abnormally long DNS query names, a high ratio of TXT/NULL to A/AAAA queries,
    or excessive distinct-subdomain counts per registered domain over short windows, exceeding baseline
    by percentile or sigma?
  context: 'Tactic: Command and Control. DNS tunneling needs many long, unique queries to move data. Over
    rolling 5-minute windows, compute each host''s average DNS query length, ratio of TXT/NULL to A/AAAA
    queries, and distinct-subdomain count per registered domain from dns.log; flag hosts above the 98th
    percentile or more than 3 sigma above baseline. Confirm with compression-based information bounds:
    incompressible per-domain query sets exceed benign limits. Profile the failure state: a spike in NXDOMAIN/SERVFAIL
    responses for one host''s long random subdomains is a strong tunneling or DGA signal. A host crossing
    several of these thresholds simultaneously is a high-confidence tunneling lead.'
  answer_sources:
  - Zeek weird.log
  - Zeek dns.log
  - 'NAI: Internal DNS Resolvers, Domain Controllers, Network Taps/SPAN ports'
  range: Last 90 days; evaluate over rolling 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_dns EARLIEST=-5m\nSTATS avg(len(query)) AS qlen,\n      count(eval(qtype IN(\"TXT\"\
      ,\"NULL\")))/count(eval(qtype IN(\"A\",\"AAAA\"))) AS txt_ratio,\n      dc(subdomain) AS subs,\n\
      \      count(eval(rcode_name IN(\"NXDOMAIN\",\"SERVFAIL\"))) AS errs BY id_orig_h, registered_domain\n\
      WHERE qlen>p98 OR txt_ratio>3sigma OR subs>p98 OR errs>p98\nALERT severity=medium"
- question: Do DNS query labels for a host fail an n-gram character-frequency check against a benign baseline,
    isolating encoded tunnel traffic from human-readable domains?
  context: 'Tactic: Command and Control. This is the DNS-specific application of n-gram analysis: compute
    bigram character-frequency match scores of query labels against a benign Zipfian table and flag low
    scores, which isolates encoded tunnel data from legitimate, language-like domain names. It requires
    no DPI and works on first-party dns.log, complementing the length/ratio thresholds and weird.log rules.
    A persistently low n-gram score on queries to a single registered domain indicates structured encoding
    consistent with tunneling; build and periodically refresh the benign table from local DNS to minimize
    false positives from legitimate randomized hostnames.'
  answer_sources:
  - Zeek weird.log
  - Zeek dns.log
  - 'NAI: Internal DNS Resolvers, Domain Controllers, Network Taps/SPAN ports'
  range: Last 90 days; benign table from last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_dns

      EVAL ngscore = bigram_match(query_labels, benign_zipf_table)

      WHERE ngscore < low_threshold

      STATS avg(ngscore), count BY id_orig_h, registered_domain

      ALERT severity=medium WHERE count>20'
- question: When per-query lexical models (Isolation Forest) and character/byte-level CNN classifiers
    score DNS traffic, which hosts produce query sequences classified as anomalous across tunnel-tool
    variants?
  context: 'Tactic: Command and Control. To catch tunneling robustly across tools, train an Isolation
    Forest on stateless per-query lexical features (character counts, label length, entropy) for real-time
    line-rate scoring, and/or a character/byte-level CNN with clustering for resilience to tunnel-tool
    variants. Escalate hosts whose query sequences are classified anomalous and emit the top-3 features
    (entropy, label length, TXT ratio) in the alert. The lexical Isolation Forest is cheap enough for
    inline scoring; the CNN generalizes to encoding schemes the statistical rules miss. Convergence of
    both models on the same host, with high-entropy long labels, is a strong tunneling indicator.'
  answer_sources:
  - Zeek weird.log
  - Zeek dns.log
  - 'NAI: Internal DNS Resolvers, Domain Controllers, Network Taps/SPAN ports'
  range: Last 90 days; score in near real time
  queries:
  - technology: SIEM/ML pseudocode
    query: "feat = [char_counts, label_len, entropy, txt_ratio]\nif IsolationForest.score(feat) anomalous\
      \ OR CNN_classify(query_bytes)==tunnel:\n  ALERT severity=medium, detail=top3(entropy,label_len,txt_ratio)\
      \ BY id_orig_h"
- question: Can a network connection (Windows Event ID 5156 / Sysmon Event ID 3) be tied by Process ID
    to a process creation (Windows Event ID 4688 / Sysmon Event ID 1) where the networking process is
    blocklisted, unsigned, or running from %TEMP%, %APPDATA%, or ProgramData?
  context: 'Tactic: Command and Control. Endpoint correlation grounds network obfuscation in a responsible
    process. Join process-creation events with network-connection events on Process ID and alert if the
    networked process is blocklisted, unsigned, or executes outside trusted directories such as %TEMP%,
    %APPDATA%, or ProgramData. Layer JA3/JA4 fingerprint matching on that process''s TLS sessions to catch
    obfuscated C2 emanating from the implant. Keep this deterministic correlation as the floor. An unsigned
    binary in a user-writable directory making external connections is a classic implant signature; pairing
    it with a known offensive-tool fingerprint elevates confidence to near-certain compromise.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: User Workstations, Critical Servers (e.g., Domain Controllers, Database Servers), Application
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM win_4688 AS p JOIN win_5156 AS n ON p.pid=n.pid\nWHERE n.direction=outbound\n  AND (p.image\
      \ IN blocklist OR p.signed=false\n       OR p.image MATCHES \"*\\\\Temp\\\\*|*\\\\AppData\\\\*|*\\\
      \\ProgramData\\\\*\")\nLEFT JOIN zeek_ssl ON pid -> match ja3/ja4 bad lists\nALERT severity=high"
- question: Which parent-child-network process relationships are rare or previously unseen for a host
    (e.g., winword.exe -> powershell.exe -> external connection), especially short-lived children making
    outbound connections?
  context: 'Tactic: Command and Control. Obfuscated C2 frequently originates from anomalous process lineages
    spawned by exploited applications. Baseline each host''s parent-child-network combinations from Sysmon
    and Zeek, and flag rare or previously unseen relationships, particularly short-lived children initiating
    external connections. Add volume/frequency context (bytes sent and connections/min by the new process)
    and state context (count of failed/blocked outbound attempts via firewall deny or conn_state S0/REJ
    that reveal beaconing to dead infrastructure). A document-application ancestor launching a scripting
    engine that immediately connects out is a high-value lead even when the network payload is obfuscated;
    per-host baselining keeps legitimate admin tooling from generating noise.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: User Workstations, Critical Servers (e.g., Domain Controllers, Database Servers), Application
    Servers'
  range: Last 90 days; per-host baseline from last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM sysmon_1 JOIN sysmon_3 ON pid\nEVAL chain = parent_image + \">\" + image + \">net\"\n\
      STATS first_seen(chain), count, sum(bytes_sent) AS bytes,\n      count(eval(conn_state IN(\"S0\"\
      ,\"REJ\"))) AS failed BY host, chain\nWHERE chain NOT IN host_baseline OR rare(chain)\nALERT severity=medium"
- question: When host-to-destination communication graphs are analyzed, do they reveal hub-and-spoke C2
    topologies that individual flows conceal but aggregate structure exposes?
  context: 'Tactic: Command and Control. C2 infrastructure imposes a characteristic topology: many internal
    hosts converging on a small set of external controllers. Build host-destination communication graphs
    and use a graph neural network to flag hub-and-spoke structures that are invisible at the single-flow
    level but emerge in aggregate. The GNN learns normal connectivity and highlights the abnormal convergence
    patterns typical of a controller. A newly formed hub drawing connections from multiple internal hosts
    is a strong campaign-level indicator; correlate flagged hubs with the IOC, fingerprint, and process
    layers to confirm and scope the intrusion.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: User Workstations, Critical Servers (e.g., Domain Controllers, Database Servers), Application
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_graph(nodes=hosts+dests, edges=zeek_conn flows)\nscores = GNN.score_nodes(G)\nfor\
