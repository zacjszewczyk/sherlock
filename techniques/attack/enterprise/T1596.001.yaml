questions:
- question: '[Reconnaissance] TI-sourced reconnaissance query alert: Can you determine whether an external
    IP address, listed on a threat intelligence feed with a ''reconnaissance'' or ''scanner'' tag, performs
    one or more DNS queries for the organization''s domains. Alternatively, DNS queries (in passive DNS
    or resolver logs) are observed for FQDNs that mimic the organization''s domain (typosquat/lookalike)
    and are known to be associated with adversary C2, staging, or phishing infrastructure. Because much
    DNS recon occurs off-network and via passive-DNS repositories, this is a best-effort first-party signal
    and external TI lookups are an enrichment, not a prerequisite. -- specifically, using the ''TI-sourced
    reconnaissance query alert'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary searches DNS data
    and passive-DNS repositories to learn about the organization''s name servers, subdomains, mail servers,
    and other hosts, mapping the externally visible attack surface to plan initial access and follow-on
    reconnaissance. This evidence focuses on the condition that an external IP address, listed on a threat
    intelligence feed with a ''reconnaissance'' or ''scanner'' tag, performs one or more DNS queries for
    the organization''s domains. Alternatively, DNS queries (in passive DNS or resolver logs) are observed
    for FQDNs that mimic the organization''s domain (typosquat/lookalike) and are known to be associated
    with adversary C2, staging, or phishing infrastructure. Because much DNS recon occurs off-network
    and via passive-DNS repositories, this is a best-effort first-party signal and external TI lookups
    are an enrichment, not a prerequisite. This Symbolic Logic approach works as follows: Cross-reference
    each Zeek dns.log source IP against an internally-cached threat intelligence list of reconnaissance
    scanners and raise a high-severity alert on matches; keep this as a deterministic floor that runs
    even when live external lookups are unavailable. Score lookalike/typosquat query targets with passive-DNS
    lexical screening (n-gram entropy, numeric-char ratio) per [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    DNS/passive-DNS reconnaissance against the organization; pivot to the source IP and its ASN/geo and
    threat-intelligence reputation, the exact FQDNs and record types (qtype) queried, the response codes
    (NOERROR/NXDOMAIN/REFUSED) and resolved IPs, the query timing and rate, and whether the activity precedes
    other recon, infrastructure staging, or initial-access attempts. A negative result helps rule out
    this particular reconnaissance vector but should be corroborated with the other questions in this
    playbook, since much DNS recon happens off-network via passive-DNS providers and a single method can
    miss distributed, low-and-slow, or third-party-sourced enumeration.'
