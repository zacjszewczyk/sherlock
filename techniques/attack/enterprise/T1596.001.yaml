name: 'T1596.001: DNS-Passive DNS'
id: 750de901-e51e-491c-86c3-65831dead576
description: 'This playbook helps an analyst investigate whether an external adversary is conducting reconnaissance
  against the organization by searching DNS data and centralized passive-DNS repositories (MITRE ATT&CK
  T1596.001, Search Open Technical Databases: DNS/Passive DNS). Such activity reveals the organization''s
  registered name servers, subdomains, mail servers, and other hosts, and can expose DNS misconfigurations
  or leaks about internal networks, feeding follow-on website/domain reconnaissance, infrastructure acquisition/compromise,
  and initial access via external remote services or trusted relationships. Because much DNS recon occurs
  off-network through passive-DNS providers, first-party telemetry is a best-effort signal and external
  threat-intelligence lookups serve as enrichment rather than a prerequisite. The hunt centers on Zeek
  dns.log against authoritative name servers, public resolvers, and network egress/ingress points, and
  pursues the behavior from several complementary angles: DNS queries from threat-intel-tagged reconnaissance/scanner
  IPs and lookalike/typosquat query targets; tool-driven enumeration of sensitive service-discovery SRV
  records and DNS-rebinding responses; unauthorized AXFR/IXFR zone-transfer attempts and bulk ANY-query
  harvesting; subdomain brute-forcing evidenced by high NXDOMAIN ratios and high-entropy queried labels;
  and sudden, distributed surges in query volume across many ASNs inconsistent with legitimate events.
  Detection methods combine deterministic symbolic-logic rules (TI watchlists, SRV/zone-transfer allow-list
  checks, fixed NXDOMAIN-ratio and rate thresholds), statistical baselining (per-IP query-frequency and
  SRV-to-total percentiles, NXDOMAIN failure-ratio profiling, ANY-query and volume standard-deviation
  alerting, Shannon-entropy screening, ARIMA/SARIMA forecasting), and machine learning (supervised passive-DNS
  classifiers, HMM query-sequence modeling, Isolation Forest and DBSCAN outlier/clustering, Prophet/SARIMA
  forecast-deviation detection), with top contributing features surfaced for analyst triage, so the analyst
  can corroborate suspected DNS reconnaissance against source reputation, query content, response codes,
  timing, and volume.'
