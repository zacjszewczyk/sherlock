- question: '[Reconnaissance] Sensitive SRV query count detection: Can you determine whether a single
    external source IP issues a sequence of DNS queries for sensitive service-discovery (SRV) records
    (e.g., `_gc._tcp`, `_ldap._tcp`, `_kerberos._tcp`, `_autodiscover._tcp`) within a short time frame
    (e.g., under 60 seconds), consistent with tool-driven enumeration. Alternatively, an external source
    issues multiple A/AAAA queries for the same FQDN with a low TTL and receives different IP addresses
    including an internal (RFC1918) address, indicating a potential DNS Rebinding attack. -- specifically,
    using the ''Sensitive SRV query count detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary searches DNS data
    and passive-DNS repositories to learn about the organization''s name servers, subdomains, mail servers,
    and other hosts, mapping the externally visible attack surface to plan initial access and follow-on
    reconnaissance. This evidence focuses on the condition that a single external source IP issues a sequence
    of DNS queries for sensitive service-discovery (SRV) records (e.g., `_gc._tcp`, `_ldap._tcp`, `_kerberos._tcp`,
    `_autodiscover._tcp`) within a short time frame (e.g., under 60 seconds), consistent with tool-driven
    enumeration. Alternatively, an external source issues multiple A/AAAA queries for the same FQDN with
    a low TTL and receives different IP addresses including an internal (RFC1918) address, indicating
    a potential DNS Rebinding attack. This Symbolic Logic approach works as follows: Alert when an external
    IP queries more than three distinct sensitive SRV records (e.g., `_gc._tcp.*`, `_ldap._tcp.*`, `_kerberos._tcp.*`)
    within five minutes; SRV record semantics and the qtype set are defined in [RFC 1035](https://www.rfc-editor.org/rfc/rfc1035).
    Keep this fixed-threshold rule as a deterministic floor and additionally flag any A/AAAA response
    returning an RFC1918 address to an external client (rebinding). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable adversary DNS/passive-DNS reconnaissance
    against the organization; pivot to the source IP and its ASN/geo and threat-intelligence reputation,
    the exact FQDNs and record types (qtype) queried, the response codes (NOERROR/NXDOMAIN/REFUSED) and
    resolved IPs, the query timing and rate, and whether the activity precedes other recon, infrastructure
    staging, or initial-access attempts. A negative result helps rule out this particular reconnaissance
    vector but should be corroborated with the other questions in this playbook, since much DNS recon
    happens off-network via passive-DNS providers and a single method can miss distributed, low-and-slow,
    or third-party-sourced enumeration.'
