- question: '[Reconnaissance] Unauthorized zone transfer detection: Can you determine whether a DNS query
    with a `qtype` of ''AXFR'' or ''IXFR'' is received by an organizational authoritative name server
    (TCP/53) from an external IP address not explicitly authorized for zone transfers. Alternatively,
    a statistically anomalous volume of ''ANY'' `qtype` queries is observed from a single external source
    IP, used to bulk-harvest records. -- specifically, using the ''Unauthorized zone transfer detection''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary searches DNS data
    and passive-DNS repositories to learn about the organization''s name servers, subdomains, mail servers,
    and other hosts, mapping the externally visible attack surface to plan initial access and follow-on
    reconnaissance. This evidence focuses on the condition that a DNS query with a `qtype` of ''AXFR''
    or ''IXFR'' is received by an organizational authoritative name server (TCP/53) from an external IP
    address not explicitly authorized for zone transfers. Alternatively, a statistically anomalous volume
    of ''ANY'' `qtype` queries is observed from a single external source IP, used to bulk-harvest records.
    This Symbolic Logic approach works as follows: Alert immediately when Zeek dns.log records an AXFR
    or IXFR query from an IP not on the authorized-secondary allow-list; per [RFC 5936](https://www.rfc-editor.org/rfc/rfc5936)
    transfers must be restricted to authorized secondaries via IP ACL/TSIG, so any off-list request is
    unauthorized zone enumeration. Co-record whether the transfer succeeded or was REFUSED as a distinct
    state signal. A positive result -- a rule match, statistical outlier, or model alert -- indicates
