  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: Spike detection for ICMP destinations\nWINDOW = 1h   // or\
      \ 24h / 30d depending on signal\nFOR EACH src_host (and per src-dst pair / per proto-port):\n  uniq_dst\
      \   = distinct(dst_ip)\n  bytes_out  = sum(orig_bytes); dgrams_min = rate(packets)\n  echo_ratio\
      \ = count(icmp_echo_req) / count(icmp_echo_reply)\n  entropy    = shannon_entropy(payload_bytes)\n\
      COMPUTE baseline(mean,sigma,percentiles) over 30d\nALERT WHEN uniq_dst > mean+3*sigma\n  OR entropy\
      \ > p99\n  OR echo_ratio > 10 OR echo_ratio < 0.1\n  OR rare_event(vib_install|shell_enable|new_listener)\
      \ outside_maintenance"
