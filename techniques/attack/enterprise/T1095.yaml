questions:
- question: 'Using deterministic rule logic, can you determine whether ''Alert on TI-matched non-app flows''
    indicates adversary command and control over a non-application layer protocol (T1095)? Specifically:
    Query Zeek conn.log and icmp.log for outbound ICMP/UDP/TCP connections and join destination IPs against
    a C2 threat intelligence feed, alerting on any match. Per [MITRE ATT&CK T1095](https://attack.mitre.org/techniques/T1095/),
    prioritize ICMP/raw-socket egress to external destinations since these protocols are under-monitored
    and bypass application proxies.'
  context: 'Tactic context (Command and Control): the adversary is trying to communicate with compromised
    systems to control them, and may deliberately choose OSI non-application layer protocols (ICMP, raw
    UDP/TCP, SOCKS, Serial-over-LAN, or ESXi VMCI) precisely because they are under-monitored and bypass
    application-layer proxies and inspection. Evidence under investigation: An internal host initiates
    outbound communication using ICMP or raw UDP/TCP to an external IP address listed on a threat intelligence
    feed of known C2 infrastructure. Approach (Alert on TI-matched non-app flows): Query Zeek conn.log
    and icmp.log for outbound ICMP/UDP/TCP connections and join destination IPs against a C2 threat intelligence
    feed, alerting on any match. Per [MITRE ATT&CK T1095](https://attack.mitre.org/techniques/T1095/),
    prioritize ICMP/raw-socket egress to external destinations since these protocols are under-monitored
    and bypass application proxies. A positive result means a host is moving data or receiving commands
    over a non-application-layer channel in a way that diverges from legitimate diagnostic or management
    activity (TI-matched/tunneling/oversized/high-entropy/beaconing/illicit-VMCI); a negative result means
    the observed ICMP/UDP/TCP/VMCI activity matches expected baselines for that host and protocol. Investigate
    the named area of interest (Network Egress Points (e.g., Internet Gateway, VPN Concentrators)) and
    pivot from any hit to the originating process, host, account, destination infrastructure, and any
    concurrent staging or exfiltration.'
  answer_sources:
  - Zeek conn.log
  - Zeek icmp.log
  - 'NAI: Network Egress Points (e.g., Internet Gateway, VPN Concentrators)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic rule for: Alert on TI-matched non-app flows\nINPUT  = non-application-layer\
      \ telemetry (Zeek conn.log/icmp.log/weird.log,\n         Win EID 5156/4688, Sysmon EID 3, auditd\
      \ sendto/connect, esxi vmkernel/hostd)\nMATCH outbound flows WHERE proto IN ['icmp','udp','tcp']\
      \ AND not_application_layer\n  AND ( dst_ip IN c2_threat_intel\n        OR payload MATCHES tunneling_signature\
      \   // icmpsh/Loki/ptunnel bytes/regex\n        OR icmp_type_code NOT_IN rfc_allowed       // illegal/reserved\
      \ usage\n        OR icmp_payload_len > 1024                  // oversized non-app flow\n       \
      \ OR process_name NOT_IN diagnostic_allowlist // !ping.exe/!tracert\n        OR vmci_bind_by NON_VMWARE_TOOL\
      \ )\nTHEN alert(severity='high', enrich=[src,dst,proto,process,cmdline,parent])"
