- question: 'Using statistical baselining, can you determine whether ''Spike detection for ICMP destinations''
    indicates adversary command and control over a non-application layer protocol (T1095)? Specifically:
    For each internal host, baseline the daily count of unique external ICMP/UDP destinations over 30
    days and alert when a count exceeds mean+3 standard deviations; also baseline bytes-out and datagrams/minute
    (Volume/Frequency) and flag combined excursions to suppress benign monitoring noise ([Nadler et al.](https://arxiv.org/abs/1709.08395)).'
