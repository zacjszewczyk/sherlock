name: 'T1095: Non-Application Layer Protocol'
id: 4665a903-4d65-4edf-9297-279e13ef541f
description: 'This playbook helps an analyst determine whether an adversary is using an OSI non-application
  layer protocol (T1095) for command and control or data movement - for example ICMP, raw UDP/TCP on non-standard
  ports, SOCKS, Serial-over-LAN, or the ESXi Virtual Machine Communication Interface (VMCI). These protocols
  are commonly abused because they are under-monitored and bypass application proxies and standard inspection.
  It correlates network telemetry (Zeek conn.log/icmp.log/weird.log, firewall/flow records) with host
  telemetry (Windows Event ID 5156/4688, Sysmon EID 3, Linux auditd sendto/connect, macOS unified log,
  and ESXi vmkernel/hostd/VIB-install logs). Investigative angles include: outbound non-app-layer flows
  to threat-intel-listed C2 infrastructure; ICMP tunneling-tool signatures and illegal RFC type/code/payload
  usage (icmpsh, Loki, ptunnel); oversized or high-entropy/low-compressibility payloads indicating encrypted
  or packed C2; non-diagnostic processes initiating ICMP/raw sockets; periodic, low-variance or jittered
  beaconing; and host-based detection of unexpected VMCI listeners or unsigned VIB backdoors on ESXi hosts
  that are invisible to network sensors. Detection blends symbolic-logic rules, statistical baselining
  (percentiles, entropy, echo-ratio asymmetry, FFT/autocorrelation beaconing, rare-event frequency) and
  machine learning (Random Forest, Isolation Forest/one-class, RNN/LSTM and online autoencoders, contrastive
  ET-SSL) to produce evasion-resistant, explainable alerts for the Command and Control tactic.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
