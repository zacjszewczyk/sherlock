  queries:
  - technology: SIEM/ML pseudocode
    query: "// ML scoring for: Classify likely C2 destinations\nfeatures = [proto, duration, orig_bytes,\
      \ resp_bytes, byte_ratio,\n            pkt_count, avg_pkt_size, payload_entropy, payload_len,\n\
      \            inter_arrival, icmp_type_code, dst_rarity, asn, geo, ti_score,\n            process_signed,\
      \ raw_socket_use, recent_file_write]\nmodel = RandomForest | IsolationForest | OneClass | LSTM/Autoencoder(Kitsune/KitNET)\
