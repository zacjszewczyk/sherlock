    keywords/intent associated with information gathering (e.g., ''urgent request'', ''directory chart'',
    ''confirm details'', credential prompts). The Symbolic Logic approach works as follows: Apply a curated
    set of regular expressions to the `subject` (and extracted body) field in `smtp.log` to detect reconnaissance/information-elicitation
    patterns, e.g. `/(urgent|confirm|verify).*(request|details|chart|directory|credentials|password)/i`.
    Generate a medium-priority alert for any match from an external, non-allowlisted domain. The lexicon
    is grounded in the deception-indicator taxonomy enumerated by [ChatSpamDetector](https://arxiv.org/abs/2402.18093)
    (urgency, request-for-info, credential prompts). A positive result -- a rule match, a statistical
    outlier, or a model alert above threshold -- indicates probable spearphishing-for-information; pivot
    to the sending infrastructure (IP, domain, ASN, WHOIS age), the impersonated identity or brand, the
    recipient cohort and timing, the email authentication verdicts (SPF/DKIM/DMARC, TLS), and any post-click
