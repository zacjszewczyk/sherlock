  answer_sources:
  - Zeek conn.log
  - Zeek smtp.log
  - 'NAI: Corporate Email Gateway, Network Perimeter Firewalls'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [helo_entropy, sender_tld, ip_asn, country_code, spf, dkim, dmarc, byte_count]\n\
      model = GradientBoosting.train(X=zeek_features, y=ti_labels)\nfor m in inbound_mail:\n  p = model.predict_proba(features(m))\n\
      \  if p > 0.90:\n    drivers = explain(model, features(m), method='SHAP', top=3)\n    alert(score=p,\
      \ why=drivers)  # e.g. unaligned DMARC + new ASN + high HELO entropy"
- question: '[Reconnaissance] Maintain key-personnel display names and public-webmail domains; flag known-name
