  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for m in inbound_mail:\n  sim = max(jaro_winkler(m.from_display_name, name) for name in key_people)\n\
      \  no_history = not seen(m.full_from_address, window='180d')\n  if sim > 0.95 and is_public_webmail(parse_domain(m.mailfrom))\
      \ and no_history:\n    dev = behavioral_deviation(m.sender, axes=[send_hour, xmailer_mime_layout,\
