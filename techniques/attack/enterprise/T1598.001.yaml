  - Zeek smtp.log
  - 'NAI: Corporate Email Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "recon_re = /(urgent|confirm|verify).*(request|details|chart|directory|credentials|password)/i\n\
