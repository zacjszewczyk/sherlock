name: 'T1598.001: Spearphishing Service'
id: 1c0cc2a5-e99f-4e77-9653-94b99f2555f9
description: 'This playbook helps an analyst investigate whether an external adversary is conducting reconnaissance
  by sending spearphishing messages through third-party services -- social media, personal webmail, and
  other non-enterprise-controlled channels -- to elicit sensitive information such as credentials, org
  charts, or environment details from employees (MITRE ATT&CK T1598.001, Spearphishing Service). Because
  these lures often arrive from public webmail providers and impersonate trusted internal personnel or
  brands, the hunt focuses on inbound email and the network/endpoint activity that follows a clicked lure.
  It pursues the behavior from several complementary angles: inbound email whose metadata (sender IP,
  domain, SMTP HELO) matches phishing/reconnaissance threat intelligence or fails SPF/DKIM/DMARC alignment
  while impersonating a protected domain; display-name impersonation of executives or key personnel paired
  with never-before-seen public-webmail addresses; reconnaissance-themed language (urgency, requests for
  directories, details, or credentials) in subjects and bodies; first-seen sending domains with anomalous
  recipient fan-out indicative of campaign bursts; and clusters of endpoints whose browsers resolve and
  connect to the same newly-observed lure domain in a short window. Detection methods combine deterministic
  symbolic-logic rules (threat-intel IOC joins across Zeek smtp.log and conn.log, DMARC authentication
  floors, key-personnel display-name spoofing rules, recon-lexicon regex, first-seen-domain fan-out thresholds,
  and JA3/JA4 TLS and brand-mismatch lure fingerprinting), statistical baselining (per-sender TI-match,
  volume, and bounce-rate 3-sigma deviation with Directed Anomaly Scoring, Jaro-Winkler display-name similarity
  with behavioral deviation, TF-IDF rare-term scoring, 99th-percentile new-sender fan-out, and per-minute
  first-seen-domain fan-out with AiTM relay-latency statistics), and machine learning (explainable gradient-boosting
  and random-forest impersonation and phishing classifiers, fine-tuned transformer intent models, ARIMA/Prophet
  volume anomaly detection with DBSCAN campaign clustering, and user-process-domain graph community detection),
  applied across Zeek smtp, conn, dns, and ssl logs and Windows Event ID 4688, so the analyst can corroborate
  suspected spearphishing-for-information against email authentication, sender reputation, message content,
  campaign timing, and post-click network behavior. Every alerting method is required to surface its top
  contributing features so triage sees why an event is suspicious, not only a score.'
type: technique
