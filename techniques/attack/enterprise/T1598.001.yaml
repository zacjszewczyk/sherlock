  answer_sources:
  - Zeek smtp.log
  - 'NAI: Corporate Email Gateway, Human Resources Information System (for key personnel list)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "key_people = load_list(HRIS.display_names)\nwebmail = ['gmail.com','outlook.com','proton.me',\
      \ ...]\nfor m in smtp.log:\n  disp = m.from_display_name; domain = parse_domain(m.mailfrom)\n  if\
      \ disp in key_people and domain in webmail:\n    sev = 'high' if dmarc_fail_for(impersonated_domain(disp))\
      \ else 'medium'\n    alert(sev, reason='trusted name + never-before-seen public-webmail address',\
      \ signal=m)"
- question: '[Reconnaissance] Score display-name similarity with Jaro-Winkler plus per-sender behavioral
