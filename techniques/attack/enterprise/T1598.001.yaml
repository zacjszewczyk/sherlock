    The Statistical Method approach works as follows: For each inbound email, calculate the Jaro-Winkler
    similarity between the sender display name and all key-personnel names. Flag where similarity > 0.95,
    the sender domain is public webmail, and there is no prior email history with the full address in
    180 days. Layer per-sender behavioral deviation scoring (send-hour distribution, X-Mailer/MIME header
    composition, recipient set) so spoofed mail from compromised-but-genuine accounts that pass authentication
    is still caught, per [That Ain''t You: Blocking Spearphishing Through Behavioral Modelling](https://seclab.bu.edu/people/gianluca/papers/spearphishing-dimva2015.pdf).
