questions:
- question: '[Reconnaissance] Continuously query Zeek logs by joining smtp.log and conn.log on the ''uid''
    field for IOC and authentication-failure matches -- can you investigate the condition that an inbound
    email''s metadata (sender IP, sender domain, SMTP HELO string) exactly matches an indicator of compromise
    (IOC) on a high-confidence threat intelligence feed explicitly tagged with ''phishing'' or ''reconnaissance'',
    or fails SPF/DKIM/DMARC alignment while impersonating a protected domain. using the ''Symbolic Logic''
    approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary sends spearphishing
    messages via third-party services (social media, personal webmail, and other non-enterprise channels)
    to trick a specific individual or team into divulging sensitive information -- frequently credentials,
    org charts, policies, or environment details that seed later intrusion. This evidence focuses on the
    condition that an inbound email''s metadata (sender IP, sender domain, SMTP HELO string) exactly matches
    an indicator of compromise (IOC) on a high-confidence threat intelligence feed explicitly tagged with
    ''phishing'' or ''reconnaissance'', or fails SPF/DKIM/DMARC alignment while impersonating a protected
    domain. The Symbolic Logic approach works as follows: Continuously query Zeek logs by joining smtp.log
    and conn.log on the ''uid'' field. Generate a high-priority alert if the `smtp.log:helo` string, the
    domain part of `smtp.log:from`, or the associated `conn.log:id.orig_h` IP matches an entry in the
    imported threat-intelligence list. In parallel, apply a deterministic authentication floor per [DMARC
    RFC 7489](https://datatracker.ietf.org/doc/html/rfc7489): alert when inbound mail spoofs a protected
    display name/domain but fails SPF/DKIM alignment (DMARC fail), or originates from a public-webmail
    provider with no DMARC alignment to the impersonated organization. Track State explicitly: record
    the SPF/DKIM/DMARC pass/fail result and TLS verdict on every message as a distinct signal. A positive
    result -- a rule match, a statistical outlier, or a model alert above threshold -- indicates probable
    spearphishing-for-information; pivot to the sending infrastructure (IP, domain, ASN, WHOIS age), the
    impersonated identity or brand, the recipient cohort and timing, the email authentication verdicts
    (SPF/DKIM/DMARC, TLS), and any post-click DNS/TLS connections to lure domains to scope the campaign
    and whether anyone responded or clicked. A negative result helps rule out this particular vector but
    should be corroborated with the other questions in this playbook, since a single method can miss authenticated-but-compromised
    senders, low-volume targeted lures, or content-obfuscated requests.'
  answer_sources:
  - Zeek conn.log
  - Zeek smtp.log
  - 'NAI: Corporate Email Gateway, Network Perimeter Firewalls'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "smtp = load(smtp.log); conn = load(conn.log)\njoin j = smtp JOIN conn ON smtp.uid == conn.uid\n\
      ti = import_threat_intel(tags=['phishing','reconnaissance'])\nfor m in j:\n  domain = parse_domain(m.mailfrom)\n\
      \  if m.helo in ti or domain in ti or m.id_orig_h in ti:\n    alert(severity='high', reason='TI\
      \ match', signal=m)\n  # deterministic DMARC floor (RFC 7489)\n  if impersonates_protected_domain(m.from)\
      \ and (m.spf=='fail' or m.dkim=='fail' or m.dmarc=='fail'):\n    alert(severity='high', reason='DMARC/SPF/DKIM\
      \ fail while spoofing protected domain')\n  if is_public_webmail(domain) and not dmarc_aligned(m,\
      \ protected_org):\n    alert(severity='medium', reason='public webmail, no DMARC alignment')\n \
      \ record_state(m.uid, spf=m.spf, dkim=m.dkim, dmarc=m.dmarc, tls=m.tls_verdict)"
- question: '[Reconnaissance] For each sender IP address, compute the TI-match ratio, send volume, and
    failure (bounce/reject) rate against a rolling baseline -- can you investigate the condition that
    an inbound email''s metadata (sender IP, sender domain, SMTP HELO string) exactly matches an indicator
    of compromise (IOC) on a high-confidence threat intelligence feed explicitly tagged with ''phishing''
    or ''reconnaissance'', or fails SPF/DKIM/DMARC alignment while impersonating a protected domain. using
    the ''Statistical Method'' approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary sends spearphishing
    messages via third-party services (social media, personal webmail, and other non-enterprise channels)
    to trick a specific individual or team into divulging sensitive information -- frequently credentials,
    org charts, policies, or environment details that seed later intrusion. This evidence focuses on the
    condition that an inbound email''s metadata (sender IP, sender domain, SMTP HELO string) exactly matches
    an indicator of compromise (IOC) on a high-confidence threat intelligence feed explicitly tagged with
    ''phishing'' or ''reconnaissance'', or fails SPF/DKIM/DMARC alignment while impersonating a protected
    domain. The Statistical Method approach works as follows: For each sender IP observed in `conn.log`
    SMTP traffic, calculate the historical ratio of emails matching threat intelligence versus total email
    count, plus message Volume (bytes and message count/hour) and the failure-mode rate (SMTP 5xx rejects,
    NDR/bounce volume). Alert when any metric for a given IP deviates by more than 3 standard deviations
    from its own 30-day rolling baseline. Score candidates with non-parametric Directed Anomaly Scoring
    so a bounded daily alert budget surfaces only events more suspicious than all benign mail along these
    axes, per [Detecting Credential Spearphishing Attacks in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).
    A positive result -- a rule match, a statistical outlier, or a model alert above threshold -- indicates
    probable spearphishing-for-information; pivot to the sending infrastructure (IP, domain, ASN, WHOIS
    age), the impersonated identity or brand, the recipient cohort and timing, the email authentication
    verdicts (SPF/DKIM/DMARC, TLS), and any post-click DNS/TLS connections to lure domains to scope the
    campaign and whether anyone responded or clicked. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss authenticated-but-compromised senders, low-volume targeted lures, or content-obfuscated requests.'
  answer_sources:
  - Zeek conn.log
  - Zeek smtp.log
  - 'NAI: Corporate Email Gateway, Network Perimeter Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for ip in distinct(conn.smtp.id_orig_h):\n  ti_ratio = count(ti_match where src==ip) / count(email\
      \ where src==ip)\n  volume = sum(bytes per hour); msg_rate = count/hour\n  fail_rate = count(smtp_5xx\
      \ or NDR) / count(email)\n  base = rolling_baseline(ip, window='30d')\n  for metric in [ti_ratio,\
      \ volume, msg_rate, fail_rate]:\n    if metric > base.mean(metric) + 3*base.std(metric): candidate(ip,\
      \ metric)\nrank = directed_anomaly_score(candidates, daily_alert_budget=N)\nalert(top(rank))"
