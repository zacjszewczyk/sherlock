  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "feats = host_window_features(dest_category_counts, artifact_type_mix,\n                  \
      \           byte_volume, temporal_cluster_score)\nclusters = cluster_or_anomaly(feats)   # Kitsune-style\
      \ / density clustering\nfor c in clusters:\n    if multiple_hosts(c) AND similar_artifacts(c) AND\
