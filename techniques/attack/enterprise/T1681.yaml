name: 'T1681: Search Threat Vendor Data'
id: d9450742-0e7a-41e5-bf87-18134c589bbf
description: 'Investigate whether an adversary is using your environment to perform reconnaissance against
  threat-intelligence and threat-vendor reporting (Search Threat Vendor Data, T1681) to learn how their
  own infrastructure, campaigns, malware, or group is being tracked - and then adapt tradecraft to evade
  detection. This playbook helps an analyst hunt for: hosts that do not normally browse the open web initiating
  outbound sessions to TI/vendor destinations (vendor blogs/portals, malware-analysis sites, IOC repositories);
  outbound web requests containing search-like patterns and indicator-shaped tokens (FQDNs, IPs, file
  hashes, malware-family or group names), including self-referential queries that match infrastructure
  tied to the intrusion; downloads of threat reports, IOC lists, and feed artifacts (.pdf, .csv, .json,
  .stix, .xml, .zip) from TI/vendor sources; and rapid post-research shifts in outbound infrastructure
  usage (new/rare destinations, domain rotations, short-lived connections) consistent with an operator
  changing behavior after seeing indicators published. It pairs symbolic-logic detection rules, statistical
  baselining/scoring, and machine-learning anomaly/classification approaches across Zeek network telemetry
  and Windows endpoint logs, prioritizing server, domain-controller, and privileged jump-host roles and
  any asset already in incident scope.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
