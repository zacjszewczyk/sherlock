    which artifact sources are rare/first-seen across the fleet?
  context: Intel-collection bursts stand out against a host's own download history during Reconnaissance
    (TA0043). Maintain per-host/per-role baselines of download Volume (bytes and file counts) by file
    type and destination category, model seasonality, and alert on sustained confidence-band violations
    rather than single events. Flag hosts with historically near-zero TI/vendor downloads that suddenly
    retrieve multiple artifacts in a short window, and weight rare/first-seen artifact sources via fleet
    prevalence. Derive the spike threshold as the 99th percentile of each role's daily TI/vendor download
    count. A previously-silent host pulling a cluster of vendor artifacts from a fleet-rare source is
    the signal; routine, recurring downloads on analyst roles stay within the band.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Internet gateway and outbound proxy path; endpoints and servers with unusual download behavior;
    analyst workstations (to differentiate legitimate use); privileged jump hosts; systems used for staging
