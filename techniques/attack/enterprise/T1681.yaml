- question: After a host accesses TI/vendor domains, does it begin connecting within the next N hours/days
    to new or rare external domains/IPs not previously seen for that host - especially when paired with
    suspicious tool execution or scripted web retrieval - forming an explainable TI-access -> new-destination
    -> tool-execution chain?
  context: A hallmark of adaptive Reconnaissance (TA0043) is an operator rotating infrastructure right
    after reading that their indicators were published. Identify windows where a host accesses TI/vendor
    domains (Zeek http.log/ssl.log). In the subsequent N hours/days, flag if the same host begins connecting
    to new or rare external domains/IPs (dns.log/conn.log/ssl.log) not previously observed for that host,
    especially when paired with suspicious tool execution (Event ID 4688) or scripted web retrieval. Express
    this as an explainable causal chain (TI access -> new destination -> tool execution) rather than isolated
    events, following path-based correlation. The strength of this method is the temporal/causal ordering;
    a host that browses TI data and then immediately stands up fresh destinations is far more suspicious
    than either event alone.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Egress gateways; DNS resolvers; hosts in incident scope; segments where command-and-control
    traffic is observed; privileged hosts used for lateral movement and remote administration.'
  range: Last 90 days; correlate destination novelty within N hours/days after a TI/vendor access event
  queries:
  - technology: Zeek/pseudocode
    query: 'step1 = http.log/ssl.log where dest_category IN ti_vendor_list -> (host, t0)

      step2 = conn.log/dns.log/ssl.log in (t0, t0+N) where dest NOT IN host_history[host]

      step3 = WinEventLog:Security EventCode=4688 suspicious_tool OR scripted_web_retrieval on host in
      (t0,t0+N)

      | where exists(step1) AND exists(step2)

      | build_chain(ti_access -> new_destination -> tool_execution)

      | alert(host, chain, severity = if(step3, high, medium))'
- question: For each host, do destination-novelty metrics (new domains/day, new ASNs/day, external-IP
    churn, destination entropy) rise above the host's historical 95th percentile in the window after TI/vendor
    access compared with before, and is there a simultaneous spike in NXDOMAIN/blocked connections indicating
    testing of freshly-staged infrastructure?
  context: 'Adaptive Reconnaissance (TA0043) is measurable as a pre/post shift in how novel a host''s
    outbound destinations are. For each host compute destination-novelty metrics - new domains/day, new
    ASNs/day, churn rate of external IPs, and destination entropy - and compare pre- vs post-TI-access
    windows, scoring novelty with interpretable time/TTL/ASN/registrar features (EXPOSURE/Notos style).
    Alert when novelty/churn exceeds the host''s historical 95th percentile, treating the TI access as
    a candidate causal pivot. Also profile State: a simultaneous spike in NXDOMAIN/blocked connections
    during rotation indicates the operator is testing freshly-staged infrastructure. A clear pre/post
    jump in novelty anchored to a TI-access pivot, with concurrent failed-resolution spikes, is the signal.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Egress gateways; DNS resolvers; hosts in incident scope; segments where command-and-control
    traffic is observed; privileged hosts used for lateral movement and remote administration.'
