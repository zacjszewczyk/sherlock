- question: Does unsupervised anomaly/clustering over host-window download behavior (destination-category
    counts, artifact-type mix, byte volume, temporal clustering) reveal coordinated intel-collection patterns
    - multiple hosts retrieving similar artifacts within short windows - and do any clusters overlap active
    incident scope?
  context: 'Some reconnaissance (TA0043) is coordinated: multiple operator-controlled hosts pulling the
    same vendor reports or feeds in a short window. Build host-window features capturing destination-category
    counts, artifact-type mix, byte volume, and temporal clustering (bursty downloads), then apply unsupervised
    anomaly/clustering (e.g., Kitsune-style scoring) to identify coordinated patterns where multiple hosts
    retrieve similar artifacts within short windows. Prioritize clusters that overlap active incident
    scope and report the top-3 contributing features per alert for explainability. A tight cluster of
    hosts collecting similar TI artifacts, especially inside incident scope, is the signal; isolated downloads
    are handled by the rule and baseline analytics.'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Internet gateway and outbound proxy path; endpoints and servers with unusual download behavior;
    analyst workstations (to differentiate legitimate use); privileged jump hosts; systems used for staging
