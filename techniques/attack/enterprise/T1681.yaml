  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each host with ti_access at t0:\n  pre  = window(t0-7d, t0); post = window(t0, t0+7d)\n\
      \  novelty(w) = {new_domains_per_day, new_asns_per_day, ip_churn, dest_entropy}\n| eventstats perc95(novelty)\
      \ as p95 by host   ;; historical baseline\n| eval delta = novelty(post) - novelty(pre)\n| eval state_spike\
      \ = nxdomain_blocked(post) >> nxdomain_blocked(pre)\n| where novelty(post) > p95 OR delta_significant\
      \ OR state_spike"
- question: Does change-point detection (CUSUM / Bayesian online CPD) or time-series anomaly detection
    over host-level outbound telemetry (unique domains, connection counts, destination entropy, byte volume)
    flag a significant regime shift shortly after TI/vendor browsing - and can the recon-to-action event
    sequence be modeled and ranked as an anomalous ordering, with top-3 contributing features surfaced?
  context: Post-research tradecraft shifts during Reconnaissance (TA0043) appear as regime changes in
    a host's outbound behavior. Apply change-point detection (CUSUM/Bayesian online CPD) or time-series
    anomaly detection to host-level outbound telemetry - unique domains, connection counts, destination
    entropy, byte volume - triggering on significant regime shifts shortly after TI/vendor browsing events.
    Optionally model the recon-to-action event sequence as anomalous orderings via HMM/t-stide and rank
    chains using causal-path scoring. Prioritize hosts already exhibiting other intrusion signals and
    surface the top-3 contributing features. A statistically detected change-point that lines up with
    a recent TI/vendor browsing event, on a host with other signals, is the prioritized alert; the method
    finds the shift even when no single threshold is crossed.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
