questions:
- question: Which hosts that rarely browse the open web - file servers, domain controllers, application
    servers, admin workstations, jump hosts, or privileged VDI pools - are initiating outbound HTTP/TLS
    sessions to threat-intelligence or threat-vendor destinations (vendor blogs/portals, malware-analysis
    sites, IOC repositories), and do those sessions correlate with local execution of web-retrieval tooling
    (browsers, curl/wget, PowerShell Invoke-WebRequest, python-requests, headless browsers)?
  context: 'Under Reconnaissance (TA0043), an adversary checking how their campaign is being reported
    will browse TI/vendor sites from whatever foothold they hold - which is frequently a server or privileged
    host that normally has no business doing open-web research. Maintain a locally-defined allowlist/denylist
    of TI/vendor destinations by domain/category and flag outbound HTTP/TLS sessions (Zeek http.log/ssl.log/conn.log
    plus dns.log) from server subnets or privileged hosts that rarely browse, then correlate to local
    process starts that fetch web content using SIGMA-style process-creation/proxy rules matching browsers,
    curl/wget, Invoke-WebRequest, python-requests, and headless browsers by image name, command line,
    and user-agent (Event ID 4688). Raise severity when several retrievals fire in rapid succession on
    one host (burst pattern) and when tied to a rare interactive logon (Event ID 4624). A concrete floor:
    server/DC/jump-host roles with >=1 session to a TI/vendor category in 24h, or >=3 distinct TI/vendor
    domains in 1h. A positive hit on an atypical role is high-signal; a hit on an analyst workstation
    is expected and should be deprioritized.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Internet gateway and outbound proxy path; DNS resolvers; endpoints and servers where browsing
    is rare (file servers, domain controllers, application servers); admin workstations and jump hosts;
    VDI pools used for privileged access.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (Zeek:http, Zeek:ssl, Zeek:conn, Zeek:dns)\n| where dest_category IN ti_vendor_list\
      \ AND host_role IN (server, domain_controller, jump_host, vdi)\n| join host, _time(+/-60s) [ search\
      \ WinEventLog:Security EventCode=4688\n    (NewProcessName IN web_clients OR CommandLine MATCHES\
      \ \"(?i)(curl|wget|Invoke-WebRequest|python.*requests|headless)\") ]\n| stats dc(dest_domain) as\
      \ uniq_domains, count as sessions by host, bin_1h\n| eval rare_logon = lookup(EventCode=4624 interactive\
      \ on host)\n| where sessions>=1 OR uniq_domains>=3\n| eval severity = if(uniq_domains>=3 OR rare_logon,\
      \ \"high\", \"medium\")"
- question: When you build a 30-day per-host-role baseline of outbound browsing to TI/vendor categories,
    which hosts exceed their normal session volume, frequency, byte counts, or unique-domain counts -
    and which are contacting TI/vendor destinations that are rare for their role or have never been seen
    for that host before?
  context: 'Operator reconnaissance (TA0043) against TI/vendor data shows up as a deviation from a host''s
    own browsing habits. Build a 30-day baseline per host role (workstation vs server vs admin jump host)
    of outbound destination-category Volume (sessions/min and bytes), Frequency (count/hour), and unique-domain
    counts to TI/vendor categories, modeling daily/weekly seasonality with Holt-Winters and alerting only
    on k-of-m violations of the confidence band so single spikes are suppressed. Layer fleet-wide prevalence/first-seen
    scoring: flag TI/vendor destinations that are rare for a host role or never before seen for that host.
    Derive thresholds per environment as the 99th percentile of each role''s historical TI/vendor session
    count. A sustained band violation or a first-seen TI/vendor destination on a non-browsing asset is
    the signal; common, recurring analyst traffic stays inside the band and is filtered.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Internet gateway and outbound proxy path; DNS resolvers; endpoints and servers where browsing
    is rare (file servers, domain controllers, application servers); admin workstations and jump hosts;
    VDI pools used for privileged access.'
  range: Last 90 days; baseline over a rolling 30-day window
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (Zeek:http, Zeek:ssl, Zeek:conn) dest_category IN ti_vendor_list

      | stats count as sessions, sum(bytes) as vol, dc(dest_domain) as uniq by host, host_role, bin_1h

      | holtwinters(sessions, vol, uniq) by host_role -> predict, band_hi

      | eval first_seen = (dest_domain NOT IN host_history[host])

      | eventstats perc99(sessions) as p99 by host_role

      | where k_of_m(sessions>band_hi) OR sessions>p99 OR first_seen=true'
- question: Which hosts show a rising ratio of failed-to-successful requests (blocked-proxy/403/407, HTTP
    404, TCP RST, DNS NXDOMAIN) toward TI/vendor categories or toward your own attacker-relevant domains/IPs,
    even at low total volume?
  context: 'Probing and self-referential checking during Reconnaissance (TA0043) often generates failures
    before successes - blocked proxy responses, 403/407, 404s, RSTs, and NXDOMAIN as an operator gropes
    for the right URL, an unblocked path, or confirmation that their own domain is listed. Track State
    explicitly: count failed responses per host toward TI/vendor categories and toward the organization''s
    own attacker-relevant domains/IPs, and watch the failed-to-successful ratio. A rising ratio is a strong
    probing signal even at low volume; apply sequential-hypothesis (SPRT) logic so a host crosses threshold
    after only a few failed first-contacts. Alert when the failure ratio exceeds the host-role baseline
    95th percentile within a 1h window. Because this is low-volume by design, the ratio - not raw counts
    - carries the signal.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Internet gateway and outbound proxy path; DNS resolvers; endpoints and servers where browsing
    is rare (file servers, domain controllers, application servers); admin workstations and jump hosts;
    VDI pools used for privileged access.'
  range: Last 90 days; evaluate failure ratios in 1-hour windows
  queries:
  - technology: Zeek/pseudocode
    query: 'merge http.log (status_code), conn.log (conn_state), dns.log (rcode)

      | where dest_category IN ti_vendor_list OR dest IN org_attacker_relevant_assets

      | eval fail = (status_code IN (403,404,407) OR conn_state IN (REJ,RSTO,S0) OR rcode==NXDOMAIN OR
      proxy_blocked)

      | stats sum(fail) as fails, count as total by orig_h, bin_1h

      | eval ratio = fails/total

      | sprt(first_contact_failures) per orig_h

      | eventstats perc95(ratio) as p95 by host_role

      | where ratio > p95 OR sprt_decision=="H1"'
- question: When an unsupervised anomaly detector scores host-day/host-window web-research behavior (TI/vendor
    domain counts, unique-domain count and entropy, total bytes, time-of-day distribution, co-occurring
    web-client tool execution), which servers or privileged hosts produce high reconstruction error -
    especially when paired with a rare logon - and what top-3 features drive the score?
  context: 'To catch operator reconnaissance (TA0043) that evades static lists and simple baselines, train
    an unsupervised online anomaly detector (e.g., an autoencoder ensemble in the Kitsune style) over
    host-day/host-window features: TI/vendor domain counts, unique-domain count and entropy, total bytes,
    time-of-day distribution, and co-occurring web-client tool execution counts (Event ID 4688). Score
    by reconstruction error and prioritize high scores on servers/privileged hosts, especially when paired
    with rare logons. Crucially, the alert must list the top-3 contributing features (e.g., TI/vendor
    domain count, time-of-day, tool-execution count) rather than a bare score, so an analyst can judge
    it. High reconstruction error on a normally-quiet asset is the signal; the model surfaces the unusual
    for human review rather than asserting maliciousness.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Internet gateway and outbound proxy path; DNS resolvers; endpoints and servers where browsing
    is rare (file servers, domain controllers, application servers); admin workstations and jump hosts;
    VDI pools used for privileged access.'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "feats = host_window_features(ti_domain_count, uniq_domains, domain_entropy,\n            \
      \                 total_bytes, time_of_day_dist, webclient_exec_count[4688])\nscore = AutoencoderEnsemble.reconstruction_error(feats)\
      \   # Kitsune-style\nif score >= threshold:\n    boost = host_role IN (server, privileged) AND rare_logon[4624]\n\
      \    alert(host, score, top3_features(feats), priority=boost)"
- question: Which outbound web requests to TI/vendor/research destinations carry search parameters (q=,
    query=, search=, term=) AND contain indicator-shaped tokens (FQDNs, IPv4/IPv6 addresses, or 32/40/64-character
    hex hashes), and do they correlate with local browser/web-client execution within the same minute?
  context: A core reconnaissance (TA0043) tell is an operator typing their own or others' indicators into
    a vendor search box. Parse Zeek http.log URIs and query strings for search parameters (q=, query=,
    search=, term=) and for indicator-shaped tokens using fixed regexes - FQDN, IPv4/IPv6, and 32/40/64-char
    hex hashes (MD5/SHA1/SHA256). Require BOTH (a) a destination categorized as TI/vendor/research AND
    (b) at least one indicator-shaped token - an explainable two-condition rule that keeps false positives
    low. Correlate to local web-client/browser execution (Event ID 4688) within the same minute using
    SIGMA proxy/process rules. A request satisfying both conditions, especially from a compromised or
    privileged host, strongly suggests indicator lookup; either condition alone is weak. Note TLS may
    hide query strings, so this is strongest where the proxy/gateway terminates or logs full URLs.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - 'NAI: Outbound proxy/gateway where URLs and query strings are visible; DNS resolvers; endpoints used
    for interactive browsing and research; jump hosts; any host with evidence of C2 or staging that might
    be used to check exposure of indicators.'
  range: Last 90 days; correlate process and request events within a 1-minute window
  queries:
  - technology: Zeek/pseudocode
    query: 'http.log: where dest_category IN ti_vendor_research_list

      | eval has_search = uri MATCHES "(?i)[?&](q|query|search|term)="

      | eval has_ioc = uri MATCHES "(FQDN_regex|IPv4|IPv6|\\b[0-9a-f]{32}\\b|[0-9a-f]{40}|[0-9a-f]{64})"

      | where has_search AND has_ioc

      | join host, _time(+/-60s) [ search WinEventLog:Security EventCode=4688 NewProcessName IN web_clients
      ]'
- question: Which extracted query tokens are rare or first-seen enterprise-wide, exhibit anomalous length
    or character distribution (high entropy), or exactly match an internal incident watchlist of suspicious
    domains/IPs/hashes - and should the latter be treated as immediate high-severity regardless of rarity?
  context: During Reconnaissance (TA0043), the most damning query a defender can catch is one that matches
    the organization's own incident indicators - the operator checking whether their infrastructure is
    exposed. Compute enterprise-wide Frequency of extracted query tokens over time and alert on rare/first-seen
    tokens, especially those matching internal watchlists (suspicious domains/IPs/hashes observed in incidents).
    Complement with query-string structure tests - a Chebyshev length bound and chi-square character-distribution
    test - to flag anomalously long or high-entropy query values that look machine-generated or encoded.
    Treat any query token that exactly matches an internal incident indicator as an immediate high-severity
    hit regardless of rarity score. Rarity ranks the unknowns; an exact watchlist match is a near-certain
    self-referential lookup and must page.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - 'NAI: Outbound proxy/gateway where URLs and query strings are visible; DNS resolvers; endpoints used
    for interactive browsing and research; jump hosts; any host with evidence of C2 or staging that might
    be used to check exposure of indicators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=Zeek:http dest_category IN ti_vendor_research_list

      | eval tokens = extract_query_tokens(uri)

      | stats count by tokens   ;; enterprise frequency

      | eval rarity = 1/count, first_seen = (tokens NOT IN history)

      | eval len_anom = chebyshev_len(tokens), char_anom = chisquare_chardist(tokens)

      | eval wl_hit = (tokens IN internal_incident_indicators)

      | where wl_hit=true -> severity=critical

      | where first_seen OR rarity_high OR len_anom OR char_anom'
- question: When a classifier scores web requests using URL/query-string features (token n-grams, indicator-regex
    match counts, destination category, time-of-day, query diversity), which events rank as likely operator
    research - indicator-heavy, vendor destination, low diversity - particularly those from compromised
    or privileged hosts, and what top-3 features explain each?
  context: 'Operator research during Reconnaissance (TA0043) has a distinct shape compared to normal browsing:
    indicator-heavy queries, a vendor/research destination, and low query diversity (repeatedly looking
    up the same kind of artifact). Train a classifier on URL/query-string features - token n-grams, indicator-regex
    match counts, destination category, session time-of-day, and query diversity - to rank events likely
    to be operator research. Triage those originating from compromised or privileged hosts first. Surface
    the top-3 contributing features (e.g., indicator-token count, destination reputation, query rarity)
    in the alert text so analysts can validate. The classifier generalizes beyond fixed regex rules; treat
    its output as a ranked queue for human review, weighted by host context.'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - 'NAI: Outbound proxy/gateway where URLs and query strings are visible; DNS resolvers; endpoints used
    for interactive browsing and research; jump hosts; any host with evidence of C2 or staging that might
    be used to check exposure of indicators.'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "feats = url_features(token_ngrams, ioc_regex_match_count, dest_category,\n               \
      \      time_of_day, query_diversity)\np = ResearchClassifier.predict_proba(feats)\nif p >= threshold:\n\
      \    priority = src_host IN (compromised, privileged)\n    alert(event, p, top3_features(feats),\
      \ priority)"
- question: Which hosts outside your defined analyst group are downloading report/feed artifacts (.pdf,
    .csv, .json, .stix, .xml, .zip) from TI/vendor-categorized destinations, and do those downloads correlate
    with execution of download-capable tooling and an initiating user-agent (especially on servers or
    admin jump hosts)?
  context: 'Deliberate intelligence collection during Reconnaissance (TA0043) often means pulling down
    threat reports, IOC lists, and feeds to study how detections and indicators are framed. From Zeek
    http.log/files.log, flag responses with MIME/extensions consistent with reports/feeds (.pdf, .csv,
    .json, .stix, .xml, .zip) when the destination is categorized as TI/vendor. Correlate to the initiating
    user-agent and to process execution of download-capable tooling (Event ID 4688) using SIGMA process/proxy
    rules. Prioritize when downloads originate from non-analyst assets - servers, admin jump hosts - rather
    than expected analyst workstations. Concrete floor: any host outside a defined analyst group retrieving
    >=1 report/feed artifact from a TI/vendor domain. A non-analyst host pulling a STIX feed or vendor
    PDF is high-signal; analyst-group activity is expected and filtered.'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Internet gateway and outbound proxy path; endpoints and servers with unusual download behavior;
    analyst workstations (to differentiate legitimate use); privileged jump hosts; systems used for staging
    tooling.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "merge http.log, files.log where dest_category IN ti_vendor_list\n| eval is_artifact = (mime_type\
      \ IN (application/pdf,text/csv,application/json,application/xml,application/zip)\n             \
      \         OR uri MATCHES \"(?i)\\\\.(pdf|csv|json|stix|xml|zip)$\")\n| where is_artifact AND host\
      \ NOT IN analyst_group\n| join host, _time(+/-60s) [ search WinEventLog:Security EventCode=4688\
