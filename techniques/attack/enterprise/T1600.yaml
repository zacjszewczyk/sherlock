name: 'T1600: Weaken Encryption'
id: ba9c012a-e4a6-4dac-984d-cec2fcfe57eb
description: 'Investigate evidence that an adversary has compromised or manipulated a network device''s
  encryption capability to bypass protections on data communications (MITRE ATT&CK T1600, Weaken Encryption).
  This playbook helps an analyst hunt for the observable consequences of weakened encryption across the
  network and on crypto-policy hosts: TLS/SSL sessions to known C2 infrastructure or with anomalous JA3/JA3S
  fingerprints; active protocol-downgrade and cipher-weakening attempts (deprecated SSL/TLS versions,
  RC4/3DES/EXPORT ciphers, undersized keys, TLS_FALLBACK_SCSV signaling, SSL-stripping to cleartext);
  unexpected cleartext traffic to critical assets; unauthorized modification of SCHANNEL cryptographic
  registry keys and system files on Windows; suspicious administrative access to network-device management
  interfaces; anomalous file/firmware transfers from network devices; and crypto-relevant configuration
  changes, firmware-integrity mismatches, or cryptographic-hardware module state changes on routers, switches,
  firewalls, and VPN concentrators. Detection blends symbolic-logic watchlists and config/firmware integrity
  checks, statistical baselining and change-point detection, and machine-learning anomaly/classification
  models so analysts can determine whether the adversary is weakening encryption to enable unauthorized
  disclosure, data manipulation, credential access, or collection.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is any internal host -- especially a network infrastructure device -- establishing a TLS/SSL
    connection to an external IP address or domain that appears on a threat-intelligence feed of known
    adversary command-and-control (C2) infrastructure?
  context: 'Tactic: Defense Impairment. An adversary who has weakened a network device''s encryption frequently
    pairs that capability with C2 beaconing. Correlating destination IPs in Zeek conn.log and server_name
    values in Zeek ssl.log against curated C2 threat-intel feeds surfaces these connections. A positive
    match is high-severity, and the severity escalates sharply when the source is a network infrastructure
    device (router, switch, firewall, VPN concentrator) -- the documented threat model for implanted devices
    like SYNful Knock. Enrich every alert with GeoIP and WHOIS for the destination to confirm geography
    and ownership; a benign result is a connection to a misclassified or sinkholed indicator.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network egress points, such as firewalls and web proxies, and management interfaces of network
    devices (routers, switches, VPN concentrators).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'ti = load_feed(c2_ip, c2_domain)

      ssl = read(zeek.ssl.log); conn = read(zeek.conn.log)

      match = ssl[server_name in ti.domain] OR conn[id.resp_h in ti.ip]

      sev = HIGH; if src_host in network_device_inventory: sev = CRITICAL

      enrich(match, geoip(id.resp_h), whois(id.resp_h)); alert(match, sev)'
- question: Across all outbound TLS connections, are there JA3/JA3S fingerprint pairs or offered cipher/extension
    sets that are statistically rare compared to a 30-day rolling baseline?
  context: 'Tactic: Defense Impairment. JA3/JA3S hashes fingerprint the TLS client and server handshake.
    Malware and weakened-crypto tooling often produce handshakes that diverge from the enterprise norm
    (unusual offered ciphers, extensions, or client key lengths). Build a 30-day rolling frequency baseline
    of each JA3/JA3S pair and flag pairs below the 1st percentile, corroborating with handshake divergence
    shown to separate malicious from benign TLS. A rare fingerprint on a network device or to a new destination
    is a strong lead; a benign result is a newly deployed legitimate client or library update.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network egress points, such as firewalls and web proxies, and management interfaces of network
    devices (routers, switches, VPN concentrators).'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'ssl = read(zeek.ssl.log)

      baseline = rolling_freq(ssl.ja3 + ''/'' + ssl.ja3s, window=30d)

      rare = ssl[ freq(ja3/ja3s) < percentile(baseline, 1) ]

      corroborate(rare, offered_ciphers, extensions, client_key_len)

      alert(rare)'
- question: Is any device showing a spike in failed or aborted TLS handshakes immediately preceding a
    successful renegotiation to a weaker cipher or protocol version?
  context: 'Tactic: Defense Impairment. An active downgrade attack typically produces a burst of failed/aborted
    handshakes (established=F, abnormal validation_status, connection resets) right before a successful
    negotiation falls back to a weaker cipher or version. Profile per-device failed-handshake rate as
    a distinct failure-mode signal and alert when failed handshakes per minute exceed 3 standard deviations
    over the per-device 30-day mean, especially when followed by a weaker successful session. A positive
    result is the signature of an inline man-in-the-middle forcing a downgrade; benign causes include
    certificate expiry or misconfiguration.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network egress points, such as firewalls and web proxies, and management interfaces of network
    devices (routers, switches, VPN concentrators).'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'conn = read(zeek.conn.log); ssl = read(zeek.ssl.log)

      fails = conn[ established==''F'' OR conn_state in (''REJ'',''RSTO'',''RSTR'') ]

      rate = count(fails) per device per minute

      mu,sd = mean_std(rate, window=30d)

      spike = rate > mu + 3*sd

      alert( spike AND followed_by(weaker_cipher_or_version) )'
- question: Do outbound TLS session volumes per internal host and per destination ASN deviate from a forecasted
    baseline in a way consistent with new or anomalous encrypted channels?
  context: 'Tactic: Defense Impairment. After weakening encryption, an adversary may open new encrypted
    channels for C2 or exfiltration that survive TLS 1.3 inspection. Train a time-series forecasting model
    (ARIMA/Prophet) on outbound TLS session volume per host and per destination ASN, and apply payload-agnostic
    flow features (packet-size sequences, byte ratios, timing) that work without decryption. Flag spikes
    in new TLS sessions deviating from forecast and surface the top-3 contributing features (bytes-out
    ratio, new-destination count, inter-arrival regularity). A positive result is unexplained encrypted
    volume to new destinations; benign causes include new business applications or backups.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network egress points, such as firewalls and web proxies, and management interfaces of network
    devices (routers, switches, VPN concentrators).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = tls_session_volume per host, per dst_asn (hourly)

      model = Prophet/ARIMA.fit(series, history=90d)

      resid = actual - model.forecast

      feat = flow_features(packet_size_seq, byte_ratio, inter_arrival)

      anom = resid > yhat_upper OR isolation_forest(feat)

      alert(anom, top3=shap(feat))'
- question: Are any TLS/SSL sessions using a deprecated protocol version, a weak cipher suite, or an insufficient
    certificate key length in violation of policy?
  context: 'Tactic: Defense Impairment. Weakened encryption manifests directly as sessions negotiated
    with prohibited parameters. Maintain an explicit watchlist of prohibited versions/ciphers and minimum
    key lengths from NIST SP 800-52r2 (TLS 1.2 required, 1.3 recommended; SSLv2/SSLv3/TLS1.0/1.1 prohibited;
    RSA>=2048). Query Zeek ssl.log in real time where version is deprecated, cipher contains RC4/DES/3DES/NULL/EXPORT,
    or certificate key_len is below policy, and alert high-severity. Continued SSLv2/export-RSA support
    is independently exploitable (DROWN). A positive result indicates a weakened endpoint or interception
    point; benign causes are legacy systems on a documented exception list.'
  answer_sources:
  - Zeek ssl.log
  - 'NAI: All network segments, with a focus on traffic to/from critical assets (e.g., authentication
    servers, database servers, application servers) and all network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "ssl = read(zeek.ssl.log)\nbad = ssl[ version in ('SSLv2','SSLv3','TLSv10','TLSv11')\n    \
      \      OR cipher =~ /RC4|_DES_|3DES|NULL|EXPORT/\n          OR cert.key_len < 2048 ]\nalert(bad,\
      \ severity=HIGH)"
- question: Is there deterministic evidence of an active TLS version downgrade -- TLS_FALLBACK_SCSV signaling,
    inappropriate_fallback alerts, or a ServerHello version lower than the client's highest offer?
  context: 'Tactic: Defense Impairment. Active downgrades can be detected deterministically. Alert on
    handshakes carrying the fallback signaling value TLS_FALLBACK_SCSV (0x5600) or an inappropriate_fallback
    alert (RFC 7507), and on ServerHello version reductions below the highest version the client offered.
    Additionally compare the negotiated security level against the client''s advertised capability/User-Agent:
    a negotiation weaker than the client supports indicates an inline interception/downgrade point. A
    positive result strongly implicates a man-in-the-middle weakening encryption; a clean result means
    clients and servers negotiated their best mutual version.'
  answer_sources:
  - Zeek ssl.log
  - 'NAI: All network segments, with a focus on traffic to/from critical assets (e.g., authentication
    servers, database servers, application servers) and all network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "ssl = read(zeek.ssl.log)\ndg = ssl[ 'TLS_FALLBACK_SCSV' in client_ciphers\n         OR alert=='inappropriate_fallback'\n\
      \         OR server_version < max(client_offered_versions) ]\nalert(dg)"
- question: Has the network-wide ratio of policy-compliant to non-compliant TLS sessions shifted abruptly,
    indicating a systemic downgrade or weakened-cipher rollout?
  context: 'Tactic: Defense Impairment. A fleet-wide weakening of encryption shows up as a rising share
    of non-compliant TLS sessions. Establish a network-wide baseline ratio of compliant to non-compliant
    sessions, recompute hourly, and apply change-point detection (CUSUM/PELT/Bayesian online change-point).
    Alert when the non-compliant proportion rises more than 3 standard deviations above the 30-day moving
    average or a change point is detected. A positive result indicates a systemic configuration change
    weakening crypto; benign causes include a planned migration or a new low-volume legacy service.'
  answer_sources:
  - Zeek ssl.log
  - 'NAI: All network segments, with a focus on traffic to/from critical assets (e.g., authentication
    servers, database servers, application servers) and all network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'ssl = read(zeek.ssl.log)

      ratio = noncompliant_sessions / total_sessions per hour

      mu,sd = moving_avg_std(ratio, window=30d)

      cp = changepoint_detect(ratio, method=''PELT'')

      alert( ratio > mu + 3*sd OR cp )'
- question: Does a trained classifier score any TLS sessions as suspicious based on version, cipher, curve,
    resumption, certificate, and JA3 features?
  context: 'Tactic: Defense Impairment. Subtle weakening that evades simple watchlists can be caught by
    a supervised model. Train a gradient-boosting/Random Forest classifier on labeled Zeek ssl.log features
    (version, cipher, curve, resumed, established, certificate validity/key length, JA3) to score each
    session compliant vs. suspicious, using the malware-vs-benign TLS feature divergence. Attach the top-3
    Shapley feature contributions to each alert so analysts can validate the reasoning. A high suspicious
    score on critical-asset traffic is a strong lead; benign results are well-formed modern sessions.'
  answer_sources:
  - Zeek ssl.log
  - 'NAI: All network segments, with a focus on traffic to/from critical assets (e.g., authentication
    servers, database servers, application servers) and all network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'ssl = read(zeek.ssl.log)

      X = features(version,cipher,curve,resumed,established,cert_valid,key_len,ja3)

      model = GradientBoosting/RandomForest.load()

      score = model.predict_proba(X)

      alert( score.suspicious > threshold, top3=shap(X) )'
- question: Is unencrypted, cleartext protocol traffic (HTTP/80, FTP/21, Telnet/23, POP3/110, IMAP/143)
    reaching a critical asset where encryption is mandated by policy?
  context: 'Tactic: Defense Impairment. SSL-stripping at a compromised inline device downgrades HTTPS
    to HTTP, exposing data in cleartext. Define critical-asset IPs and a cleartext-port watchlist (21,23,80,110,143)
    and trigger a high-priority alert when a Zeek conn.log record shows a connection to a critical asset
    on a cleartext port from any source not on a pre-approved exception list. A positive result on a domain
    controller, database, or admin portal indicates encryption has been bypassed or stripped; benign causes
    are documented legacy services or health-check probes on the exception list.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ftp.log
  - 'NAI: Network segments containing designated critical assets, such as data center networks, management
    VLANs, and segments hosting authentication servers (e.g., Active Directory Domain Controllers).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "conn = read(zeek.conn.log)\nct = conn[ id.resp_h in critical_assets\n          AND id.resp_p\
      \ in (21,23,80,110,143)\n          AND id.orig_h not in cleartext_exceptions ]\nalert(ct, severity=HIGH)"
- question: Has the ratio of encrypted to unencrypted byte volume on any critical segment dropped sharply,
    signaling a fleet-wide fallback to plaintext?
  context: 'Tactic: Defense Impairment. A systemic weakening shows up as encrypted volume giving way to
    plaintext. For each critical segment, baseline the daily ratio of encrypted byte volume (443/993/995)
    to unencrypted byte volume (80/143/110), apply change-point detection, and alert when the ratio drops
    more than 2 standard deviations from the 30-day rolling average or a change point is detected. A positive
    result is the volume-and-state signature of a fleet-wide fallback to plaintext; benign causes include
    a planned protocol migration.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ftp.log
  - 'NAI: Network segments containing designated critical assets, such as data center networks, management
    VLANs, and segments hosting authentication servers (e.g., Active Directory Domain Controllers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'conn = read(zeek.conn.log)

      enc = bytes(port in (443,993,995)); plain = bytes(port in (80,143,110))

      ratio = enc / plain per segment per day

      mu,sd = rolling(ratio, 30d); cp = changepoint_detect(ratio)

      alert( ratio < mu - 2*sd OR cp )'
- question: Do unsupervised anomaly models flag any critical-asset flows as belonging to a cleartext cluster
    or scoring as outliers?
  context: 'Tactic: Defense Impairment. Beyond fixed port watchlists, unsupervised models catch subtler
    plaintext fallback. Run Isolation Forest (baseline) and an autoencoder (for subtler structure) over
    Zeek conn.log features (id.orig_h, id.resp_p, proto, duration, orig_bytes, resp_bytes). Flag any critical-asset
    IP whose flows fall into a cleartext cluster or score as outliers, and report the top-3 contributing
    features. A positive result identifies hosts whose communication profile shifted toward plaintext;
    benign results are stable, expected encrypted flows.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ftp.log
  - 'NAI: Network segments containing designated critical assets, such as data center networks, management
    VLANs, and segments hosting authentication servers (e.g., Active Directory Domain Controllers).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'conn = read(zeek.conn.log)

      X = features(id.orig_h,id.resp_p,proto,duration,orig_bytes,resp_bytes)

      iso = IsolationForest.fit(X); ae = Autoencoder.fit(X)

      anom = iso.outlier(X) OR ae.recon_error(X) > thr

      alert( anom AND id in critical_assets, top3=shap(X) )'
- question: Has any Windows Registry key under SCHANNEL (Ciphers, Hashes, KeyExchangeAlgorithms, Protocols)
    been modified to weaken the cryptographic baseline?
  context: 'Tactic: Defense Impairment. On Windows, system-wide TLS/SSL behavior is governed by HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL
    and its subkeys. Enable SACL auditing on these keys and alert on any modification (Event ID 4657)
    that weakens the baseline below NIST SP 800-52r2 -- re-enabling SSL 3.0/TLS 1.0, enabling RC4/DES,
    or lowering key exchange. Correlate the modifying process (Event ID 4688) and alert when it is not
    on an explicit patch/management allowlist. A positive result is direct evidence of host-level encryption
    weakening; benign causes are approved patch/hardening jobs.'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: Critical servers (especially web servers), domain controllers, and administrator workstations
    where system-wide cryptographic policies are managed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'e4657 = events(EventID=4657, ObjectName=~ /SCHANNEL\\(Ciphers|Hashes|KeyExchangeAlgorithms|Protocols)/)

      weak = e4657[ new_value re-enables SSL3/TLS1.0 OR enables RC4/DES OR lowers key_exchange ]

      proc = join(e4657, events(EventID=4688), by=process)

      alert( weak AND proc.image not in crypto_admin_allowlist )'
- question: Are modifications to cryptographic registry keys occurring at unusual frequency, time-of-day,
    or by unexpected user/process accounts compared to predictable patch cycles?
  context: 'Tactic: Defense Impairment. Legitimate crypto-config changes cluster in predictable patch
    windows by known accounts. Profile normal frequency, timing, and responsible processes for SCHANNEL
    modifications; compute a rarity score per modification over user account, process name, and time-of-day,
    and apply change-point detection to commit-rate shifts. High-rarity or change-point events trigger
    investigation. A positive result is an off-cycle change by an unusual actor; benign results align
    with the established patch cadence.'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: Critical servers (especially web servers), domain controllers, and administrator workstations
    where system-wide cryptographic policies are managed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'mods = events(EventID=4657, key in SCHANNEL_subkeys)

      rarity = score(mods, dims=[user, process, hour_of_day])

      cp = changepoint_detect(commit_rate(mods))

      alert( rarity > thr OR cp )'
- question: Do event-log sequences around crypto-config changes (e.g., 4688 -> 4657) deviate from learned
    normal administrative activity?
  context: 'Tactic: Defense Impairment. Normal crypto-config administration follows characteristic event
    sequences (a known admin process spawning then editing a key). Train an Isolation Forest / one-class
    model on event-log sequences (e.g., 4688->4657) representing normal administrative crypto-config activity
    and flag outlier sequences, surfacing the top-3 contributing features (process, key path, hour, user).
    A positive result is an anomalous sequence -- an unexpected process editing SCHANNEL outside normal
    patterns; benign results match learned admin workflows.'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: Critical servers (especially web servers), domain controllers, and administrator workstations
    where system-wide cryptographic policies are managed.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = sequences(EventID 4688 -> 4657 per host/session)

      X = encode(process, key_path, hour, user)

      model = IsolationForest/OneClassSVM.fit(normal_seq)

      alert( model.outlier(X), top3=shap(X) )'
- question: Is there an authenticated session to a network-device management interface (SSH/22, HTTPS/443)
    originating from a source IP that is not on the approved administrative-host allowlist?
  context: 'Tactic: Defense Impairment. Privileged management access is the precondition for implanting
    a modified image or weakening crypto on network devices. Maintain a strict allowlist of authorized
    admin source IPs/subnets and alert on any Zeek conn.log connection to a device''s management IP/port
    (SSH 22, HTTPS 443) from a source not on the list, correlated with successful authentications (Event
    ID 4624). A positive result indicates unauthorized administrative access that could precede device
    tampering; benign results come only from approved jump boxes.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Management VLANs, administrator jump boxes, and the network interfaces of core network infrastructure
    like firewalls, routers, and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'conn = read(zeek.conn.log)

      mgmt = conn[ id.resp_h in network_device_mgmt_ips AND id.resp_p in (22,443) ]

      unauth = mgmt[ id.orig_h not in admin_allowlist ]

      auth = events(EventID=4624)

      alert( join(unauth, auth, by=src/time) )'
- question: Is any management interface showing a spike in failed authentications, or a burst of failures
    followed by a success from a non-allowlisted source?
  context: 'Tactic: Defense Impairment. Brute-force-then-access is a common pattern preceding device compromise.
    Profile failed authentications to each management interface (failed SSH/HTTPS auth, lockouts) as a
    distinct failure-mode signal and alert when failed-logon count/min to a device exceeds 3 standard
    deviations over the 30-day baseline, or when a burst of failures is followed by a success from a non-allowlisted
    source. A positive result is a likely credential attack culminating in access; benign causes are misconfigured
    automation retrying credentials.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Management VLANs, administrator jump boxes, and the network interfaces of core network infrastructure
    like firewalls, routers, and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fails = failed_auth per device per minute

      mu,sd = mean_std(fails, 30d)

      spike = fails > mu + 3*sd

      burst_then_success = burst(fails) followed_by success(src not in admin_allowlist)

      alert( spike OR burst_then_success )'
- question: Do any admin logins deviate from each account's baseline login-time distribution, source subnet,
    or session byte volume?
  context: 'Tactic: Defense Impairment. A hijacked admin account often shows up as out-of-hours logins,
    new source subnets, or unusually large data transfers (e.g., pulling/pushing a firmware image). For
    each admin account, baseline login-time distribution, source subnets, and session byte volumes (orig_bytes/resp_bytes),
    apply change-point detection, and alert on multi-dimensional outliers (more than 3 SD from mean login
    hour and above the 98th percentile of data transferred). A positive result indicates anomalous privileged
    behavior; benign results match the account''s habitual pattern.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Management VLANs, administrator jump boxes, and the network interfaces of core network infrastructure
    like firewalls, routers, and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'sess = admin_sessions(conn + EventID 4624)

      base = baseline per account(login_hour, src_subnet, bytes)

      out = sess[ z(login_hour) > 3 AND bytes > p98(base.bytes) ]

      cp = changepoint_detect(per_account_features)

      alert( out OR cp )'
- question: Does an autoencoder flag any admin session as anomalous based on duration, byte volumes, and
    timing features?
  context: 'Tactic: Defense Impairment. Subtle deviations across multiple session features are best caught
    by reconstruction-error models. Train an autoencoder on session-feature vectors (duration, orig_bytes,
    resp_bytes, hour_of_day, day_of_week) from normal admin sessions and flag high reconstruction-error
    sessions, reporting the top-3 driving features. A positive result is a session that does not resemble
    normal administration -- a candidate for hijack or insider misuse; benign results reconstruct cleanly.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Management VLANs, administrator jump boxes, and the network interfaces of core network infrastructure
    like firewalls, routers, and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = features(duration, orig_bytes, resp_bytes, hour_of_day, day_of_week)

      ae = Autoencoder.fit(normal_admin_sessions)

      err = ae.recon_error(X)

      alert( err > threshold, top3=shap(X) )'
- question: Is any file being transferred from a network infrastructure device to a destination that is
    not on the approved configuration-backup/management server allowlist?
  context: 'Tactic: Defense Impairment. Unauthorized image push/pull is the delivery vector for modified
    system images. Alert on any file transfer in Zeek files.log or connection on ports 21 (FTP), 22 (SCP),
    or 69 (TFTP) in Zeek conn.log where the source IP is a network device and the destination is not on
    an explicit allowlist of backup/management servers; this is especially suspicious outside scheduled
    maintenance windows. Verify pulled/pushed images against signed-update and golden-measurement requirements
    (NIST SP 800-193). A positive result is potential exfiltration of config or staging of a modified
    image; benign results are scheduled backups to approved servers.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network infrastructure devices, configuration backup servers, TFTP/FTP servers, and network
    egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "files = read(zeek.files.log); conn = read(zeek.conn.log)\nxfer = files[ tx_hosts in network_devices\
      \ ]\n       UNION conn[ id.orig_h in network_devices AND id.resp_p in (21,22,69) ]\nbad = xfer[\
      \ dest not in backup_mgmt_allowlist ]\nalert( bad, escalate_if outside_maintenance_window )"
- question: Do transferred files from network devices exceed expected backup sizes, or exhibit high content/filename
    entropy suggesting an encrypted, compressed, or obfuscated image?
  context: 'Tactic: Defense Impairment. A modified or exfiltrated firmware image often differs in size
    and entropy from a normal config backup. Baseline typical config-backup file sizes per device and
    alert on transfers exceeding the 99th percentile. Compute Shannon entropy of transferred-file content
    and filenames: entropy above 7.2/byte on a region expected to be code indicates an encrypted/compressed
    (potentially modified) image, and filename entropy above 4.0 suggests obfuscation. A positive result
    indicates an anomalous payload; benign results are normal-sized, low-entropy config text.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network infrastructure devices, configuration backup servers, TFTP/FTP servers, and network
    egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
