name: 'T1578.003: Modify Cloud Compute Infrastructure: Delete Cloud Instance'
id: 5826ab91-054e-45d8-b537-f8a4fede19bb
description: Investigate whether an adversary deleted cloud compute instances to evade detection and destroy
  forensic evidence after performing malicious activity. This playbook helps an analyst correlate instance-deletion
  API calls (AWS TerminateInstances, Azure virtualMachines/delete, GCP instances.delete) across authentication,
  instance lifecycle, and account activity to surface suspicious terminations. It covers deletions originating
  from threat-intel-flagged or geographically/organizationally anomalous source IPs, deletions executed
  with rare or disallowed user-agents, short-lived create-then-delete cleanup by the same principal, removal
  of production/critical or long-running instances by unauthorized actors or outside change windows, high-volume
  burst deletions, and permission-probing (AccessDenied bursts) that often precedes a successful destructive
  call. Each question pairs symbolic-logic, statistical, and machine-learning approaches so the analyst
  can confirm or refute adversarial evidence destruction in the cloud management plane.
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any cloud instance deletion API call (AWS TerminateInstances, Azure virtualMachines/delete,
    GCP instances.delete) originate from a source IP that matches a threat-intelligence indicator, TOR
    exit node, anonymizing proxy, or datacenter ASN?
  context: 'Adversaries who delete instances to destroy evidence frequently operate from infrastructure
    that is abnormal for the compromised principal, such as TOR exit nodes, anonymizing proxies, or hosting/datacenter
    ASNs. Matching the sourceIPAddress on destructive deletion events against curated threat-intel feeds,
    paired with rare-principal and off-hours guardrails, gives high-confidence detection of evasion-driven
    terminations. A positive match (especially shortly after a credential compromise) strongly indicates
    malicious evidence destruction under the Defense Impairment tactic; a negative result helps rule out
    external operator-driven deletions. Pivot from any hit to the principal''s recent authentication and
    API history. References: [Detections in the Sky, Recorded Future](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security)
    [SigmaHQ](https://github.com/SigmaHQ/sigma) [Unit 42](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - 'NAI: Cloud Management Plane, Identity and Access Management (IAM) Service, Internet Gateway/VPC Flow
    Logs, Threat Intelligence Platform, Administrator Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM cloud_audit WHERE eventName IN (''TerminateInstances'',''virtualMachines/delete'',''instances.delete'')

      | JOIN threat_intel ON sourceIPAddress = ioc_ip

      | WHERE ioc_type IN (''malicious'',''tor'',''proxy'',''datacenter_asn'')

      | ALERT principal, sourceIPAddress, eventName, eventTime'
  - technology: Zeek/pseudocode
    query: conn.log | WHERE id.resp_h IN cloud_api_endpoints AND id.orig_h IN ti_malicious_ips | OUTPUT
      orig_h, resp_h, ts
- question: For each IAM role, is a deletion event arriving from a source country or ASN that is below
    the 1st percentile of historical rarity or has never been seen before for that role?
  context: 'Even when a source IP is not on a threat-intel feed, deletions from a country or ASN that
    the role has never used are a strong anomaly signal. Maintaining per-role baselines of source country
    and ASN and applying a first-seen / low-percentile detector over the organization''s own CloudTrail
    surfaces geographically or organizationally anomalous terminations. Using robust median/MAD (modified
    Z-score) ranking resists skew from heavy automation. A hit means the destructive call came from an
    origin atypical for that role, consistent with stolen-credential abuse aimed at evading detection;
    investigate concurrent logins and access-key usage. References: [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)
    [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - 'NAI: Cloud Management Plane, Identity and Access Management (IAM) Service, Internet Gateway/VPC Flow
    Logs, Threat Intelligence Platform, Administrator Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM cloud_audit WHERE eventName IN deletion_events

      | ENRICH geo_country, asn FROM sourceIPAddress

      | STATS rarity = first_seen_or_percentile(country,asn) BY roleName

      | WHERE rarity < 1st_percentile OR first_seen == true

      | ALERT roleName, country, asn, eventTime'
- question: Does an unsupervised Isolation Forest over enriched deletion context (geo rarity, ASN rarity,
    time anomaly, role privilege, MFA status, recent AccessDenied count) flag any instance-deletion event
    as a high-scoring anomaly?
  context: 'Single-signal rules miss multi-factor anomalies. Training an Isolation Forest on enriched
    deletion features lets subtle combinations - a rare ASN at an odd hour from a high-privilege role
    with no MFA and recent denied calls - surface as outliers even when no individual feature trips a
    threshold. Events exceeding the anomaly threshold should be triaged with the top-3 contributing features
    shown in the alert so analysts can quickly judge whether the deletion reflects adversarial evidence
    destruction. A high anomaly score with rare-ASN/off-hours/no-MFA contributors warrants immediate scoping
    of the principal''s session. References: [Isolation Forest](https://ieeexplore.ieee.org/document/4781136)
    [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf) [Elastic prebuilt ML jobs](https://www.elastic.co/guide/en/security/current/prebuilt-ml-jobs.html)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - 'NAI: Cloud Management Plane, Identity and Access Management (IAM) Service, Internet Gateway/VPC Flow
    Logs, Threat Intelligence Platform, Administrator Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [geo_rarity, asn_rarity, time_anomaly, role_privilege, mfa_status, recent_accessdenied_count]

      model = IsolationForest(contamination=auto).fit(historical_deletions[features])

      score = model.decision_function(new_deletion[features])

      IF score < threshold: ALERT with top3_contributing_features'
- question: Was any instance-deletion API call executed with a User-Agent string that is absent from the
    approved tool/SDK allow-list or matches a known offensive-tooling deny-list signature?
  context: 'The userAgent recorded on cloud API calls reveals what tool or SDK issued the request. Legitimate
    deletions come from a small set of approved consoles, SDKs, and IaC tools; deletions from unknown
    or known-offensive user-agents (e.g., red-team frameworks) indicate the call did not come through
    normal operational paths. Allow-list enforcement (alert when userAgent not in approved set) plus a
    deny-list of offensive signatures is a high-signal detection for evasion-oriented terminations. Validate
    coverage by emulating deletions with offensive tooling. A hit means the destructive call used non-standard
    tooling - investigate the issuing host and credentials. References: [SigmaHQ](https://github.com/SigmaHQ/sigma)
    [Elastic Detection Rules for AWS](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws)
    [Panther Analysis](https://github.com/panther-labs/panther-analysis) [Stratus Red Team](https://github.com/DataDog/stratus-red-team)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Cloud Management Plane, CI/CD Pipeline Servers, Administrator Workstations, Proxy and Egress
    Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM cloud_audit WHERE eventName IN deletion_events

      | WHERE userAgent NOT IN approved_useragent_allowlist OR userAgent MATCHES offensive_tool_signatures

      | ALERT principal, userAgent, sourceIPAddress, eventTime'
  - technology: Windows/EID 4688
    query: EventID=4688 WHERE NewProcessName IN (aws.exe, az.exe, gcloud) AND CommandLine CONTAINS ('terminate-instances','vm
      delete','instances delete') AND ParentImage NOT IN approved_admin_tools
- question: Is the User-Agent string used on a deletion event new (first-seen) or below the 2nd percentile
    of frequency for the actor that issued it?
  context: 'Beyond static allow-lists, modeling the per-actor frequency distribution of userAgent strings
    catches a known principal suddenly switching tooling - a common sign of session hijack or credential
    theft. Flagging deletions whose userAgent is first-seen for the actor or below the 2nd percentile,
    scored robustly with median/MAD, surfaces tooling anomalies tied to a specific identity. A positive
    result indicates the actor deleted an instance using a tool they rarely or never use, consistent with
    an attacker operating under stolen credentials to destroy evidence. References: [Netflix CloudTrail
    Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly) [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Cloud Management Plane, CI/CD Pipeline Servers, Administrator Workstations, Proxy and Egress
    Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM cloud_audit WHERE eventName IN deletion_events

      | STATS ua_freq = freq_percentile(userAgent), first_seen_flag BY principal

      | WHERE first_seen_flag == true OR ua_freq < 2nd_percentile

      | ALERT principal, userAgent, eventTime'
- question: Does TF-IDF vectorization plus DBSCAN clustering of User-Agent strings label any deletion-event
    user-agent as noise or place it in a small singleton outlier cluster near normal-tool clusters?
  context: 'Attacker tooling often produces user-agent strings that are textually distinct from the organization''s
    normal SDK/console agents. Vectorizing userAgents with TF-IDF and clustering with DBSCAN groups normal
    tools together while leaving anomalous agents as noise or singleton outliers. Alerting on noise-labeled
    or singleton-cluster user-agents on deletion events, with the nearest normal cluster and distinguishing
    tokens reported as explanation, helps analysts spot novel or obfuscated tooling. A hit suggests the
    destructive call came from tooling unlike anything in normal use - a strong evasion indicator. References:
    [DBSCAN, Ester et al.](https://cdn.aaai.org/KDD/1996/KDD96-037.pdf)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Cloud Management Plane, CI/CD Pipeline Servers, Administrator Workstations, Proxy and Egress
    Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = TfidfVectorizer(analyzer=char_ngram).fit_transform(useragents)\nlabels = DBSCAN(eps, min_samples).fit_predict(X)\n\
      FOR deletion_event: IF label == -1 OR cluster_size(label) == 1:\n  ALERT userAgent, nearest_normal_cluster,\
      \ distinguishing_tokens"
- question: Did the same principal that created an instance also delete it within a very short lifespan
    (e.g., under 15 minutes), excluding known automation and auto-scaling accounts?
  context: 'Create-then-delete cleanup by a single principal is a documented evasion pattern: an adversary
    spins up an instance for malicious use, then terminates it to remove forensic artifacts. Correlating
    creation and deletion by instanceId and alerting when the same principal deletes within a short lifespan
    - while excluding legitimate automation/auto-scaling - directly targets this behavior. A positive
    result, particularly from an interactive or unusual principal, indicates deliberate teardown to destroy
    evidence under the Defense Impairment tactic. Pivot to what the instance did during its brief life
    (network connections, data access). References: [Unit 42](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/)
    [Stratus Red Team](https://github.com/DataDog/stratus-red-team) [Elastic Detection Rules for AWS](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud Management Plane, Virtual Private Cloud (VPC), Cloud Asset Inventory Database (CMDB),
    Cloud orchestration and automation platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM cloud_audit

      | JOIN create_event c, delete_event d ON c.instanceId = d.instanceId

      | WHERE c.principal == d.principal AND (d.eventTime - c.eventTime) < 15m

      | WHERE d.principal NOT IN automation_autoscaling_accounts

      | ALERT principal, instanceId, lifespan'
- question: Is the lifespan of a deleted instance below the 5th percentile of historical lifespans for
    instances of the same type, image, or tag set, using robust median/MAD scoring?
  context: 'Comparing each deletion''s lifespan against historical distributions grouped by instanceType/imageID/tags
    reveals instances killed far sooner than their peers. Using median/MAD (modified Z-score |Mi|>3.5)
    prevents legitimately short-lived CI/CD instances from poisoning the baseline. Flagging deletions
    in the bottom 5th percentile of lifespan highlights abnormally brief instances that may have been
    created solely for malicious use and quickly destroyed. A hit warrants checking whether the short-lived
    instance accessed sensitive data or established suspicious connections before teardown. References:
    [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud Management Plane, Virtual Private Cloud (VPC), Cloud Asset Inventory Database (CMDB),
    Cloud orchestration and automation platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM cloud_audit | COMPUTE lifespan = delete_time - create_time BY instanceId

      | STATS median_ls, mad_ls BY instanceType, imageID, tagset

      | COMPUTE modZ = 0.6745*(lifespan - median_ls)/mad_ls

      | WHERE lifespan < 5th_percentile OR modZ < -3.5

      | ALERT instanceId, lifespan, group'
- question: Does a fitted distributional model (Weibull/log-normal) of instance lifespans, or an Isolation
    Forest including lifespan context, assign a deleted instance a p-value below 0.01 or a high anomaly
    score?
  context: 'Percentile cutoffs can be coarse; fitting a Weibull or log-normal distribution to instance
    lifespans yields a principled p-value for how unusual each new deletion''s lifespan is, flagging p<0.01
    as anomalous. Alternatively, scoring lifespan alongside other context features in an Isolation Forest
    and surfacing lifespan percentile as the lead contributing feature catches multi-factor cases. Either
    approach pinpoints instances whose brevity is statistically improbable, consistent with adversarial
    create-then-destroy evasion. Triage hits by reconstructing the instance''s activity during its lifetime.
    References: [Isolation Forest](https://ieeexplore.ieee.org/document/4781136) [Elastic prebuilt ML
    jobs](https://www.elastic.co/guide/en/security/current/prebuilt-ml-jobs.html)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud Management Plane, Virtual Private Cloud (VPC), Cloud Asset Inventory Database (CMDB),
    Cloud orchestration and automation platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = fit_weibull(historical_lifespans)

      p = model.sf(new_deletion.lifespan)

      IF p < 0.01: ALERT instanceId, lifespan, p

      # alt: IsolationForest([lifespan_pct, role_priv, time_anomaly]) -> ALERT with lifespan as lead feature'
- question: Was an instance tagged 'production' or 'critical' deleted by a principal who is not a member
    of the designated cloud administrator group, or outside an approved change window?
  context: 'Production and critical instances should only be deleted by authorized administrators during
    approved change windows. Alerting when a deletion targets a production/critical-tagged instance and
    is executed by a non-administrator IAM group member or outside a change window detects both destructive
    sabotage and evidence destruction on high-value assets. A positive result indicates an unauthorized
    or off-policy teardown of a sensitive asset - high priority under Defense Impairment, since loss of
    a production host can both disrupt operations and erase evidence. Confirm against ITSM change records
    and the principal''s role membership. References: [SigmaHQ](https://github.com/SigmaHQ/sigma) [Panther
    Analysis](https://github.com/panther-labs/panther-analysis) [Detections in the Sky, Recorded Future](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Production Environment VPCs, Cloud Asset Inventory Database (CMDB), IT Service Management (ITSM)
    Platform, Identity and Access Management (IAM) Service'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM cloud_audit WHERE eventName IN deletion_events

      | ENRICH tags FROM cmdb BY instanceId

      | WHERE tags CONTAINS (''production'',''critical'')

      | WHERE principal NOT IN CloudSystemAdministrators OR eventTime NOT IN approved_change_window

      | ALERT principal, instanceId, tags, eventTime'
- question: Is a deleted instance's uptime in the top decile (>90th percentile) of all running instances,
    indicating removal of a long-running asset?
  context: 'Long-running instances are typically stable, important infrastructure; their deletion is comparatively
    rare and consequential. Monitoring uptime distributions for running instances and flagging deletions
    where uptime exceeds the 90th percentile - ranked robustly via median/MAD - highlights removal of
    long-lived assets that an adversary might destroy to disrupt operations or eliminate a host that holds
    evidence. A hit should be correlated with change records and the deleting principal''s authorization
    to determine whether the teardown was legitimate. References: [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Production Environment VPCs, Cloud Asset Inventory Database (CMDB), IT Service Management (ITSM)
    Platform, Identity and Access Management (IAM) Service'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM running_instances | COMPUTE uptime = now - launch_time

      | STATS p90_uptime = percentile(uptime,90)

      | JOIN deletion_events ON instanceId

      | WHERE deleted_instance.uptime > p90_uptime

      | ALERT instanceId, uptime, principal'
- question: Does a Gradient Boosting authorization classifier (over role permissions, business hours,
    change-window status, uptime percentile, and critical-tag count) predict a deletion as 'unauthorized',
    or does an Isolation Forest baseline flag it as novel?
  context: 'Authorization is multi-dimensional: role permissions, timing, change-window status, asset
    uptime, and tag criticality together determine whether a deletion is legitimate. A supervised Gradient
    Boosting model trained on labeled authorized/unauthorized deletions can score new events and flag
    ''unauthorized'' predictions, while an unsupervised Isolation Forest catches novel patterns the labels
    never covered. Reporting the top-3 SHAP/influencer features driving each alert lets analysts judge
    the call quickly. An ''unauthorized'' prediction on a critical/long-running asset is a strong indicator
    of policy-violating or adversarial destruction. References: [Isolation Forest](https://ieeexplore.ieee.org/document/4781136)
    [Elastic prebuilt ML jobs](https://www.elastic.co/guide/en/security/current/prebuilt-ml-jobs.html)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Production Environment VPCs, Cloud Asset Inventory Database (CMDB), IT Service Management (ITSM)
    Platform, Identity and Access Management (IAM) Service'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [role_permissions, business_hours, change_window_status, uptime_percentile, critical_tag_count]

      pred = GradientBoosting.predict(new_deletion[features])

      IF pred == ''unauthorized'': ALERT with top3_shap_features

      # baseline: IsolationForest(features) flags novel patterns'
- question: Did a single principal target more than 20 distinct instanceIds for deletion within a sliding
    10-minute window?
  context: 'Mass deletion in a short window is a hallmark of destructive activity - whether an adversary
    wiping infrastructure to evade detection or sabotaging an environment. Encoding a count() aggregation/threshold
    rule (e.g., >20 distinct instanceIds per principal per 10 minutes) catches abrupt bursts that far
    exceed normal operational teardown. A positive result indicates a deliberate large-scale teardown
    event; immediately scope the principal''s session, source IP, and whether snapshots or backups were
    also deleted, and consider containment. References: [SigmaHQ](https://github.com/SigmaHQ/sigma) [Elastic
    Detection Rules for AWS](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws)
    [Panther Analysis](https://github.com/panther-labs/panther-analysis)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud Management Plane, Identity and Access Management (IAM) Service, Billing and Cost Management
    Dashboard'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM cloud_audit WHERE eventName IN deletion_events

      | SLIDING WINDOW 10m

      | STATS distinct_count = dcount(instanceId) BY principal

      | WHERE distinct_count > 20

      | ALERT principal, distinct_count, window_start'
- question: Does a principal's hourly deletion count exceed a modified Z-score of 3.5 versus their moving
    baseline, or does change-point detection identify an abrupt onset of mass deletion?
  context: 'A static threshold misses principals whose ''normal'' volume is low but who suddenly spike.
    Tracking each user/role''s deletions per hour and alerting when the median/MAD modified Z-score exceeds
    3.5 detects relative surges, while change-point detection (CUSUM/PELT/Bayesian online CPD) pinpoints
    the abrupt onset of mass deletion even when the absolute count is moderate. A positive result indicates
    anomalous acceleration in destructive activity for that identity - investigate whether it coincides
    with a compromise or off-hours access. References: [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    [change-point survey, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud Management Plane, Identity and Access Management (IAM) Service, Billing and Cost Management
    Dashboard'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM cloud_audit WHERE eventName IN deletion_events

      | STATS hourly = count() BY principal, bucket(eventTime,1h)

      | COMPUTE modZ = 0.6745*(hourly - median)/mad BY principal

      | WHERE modZ > 3.5

      | OR change_point_detected(hourly_series)

      | ALERT principal, hourly, modZ'
- question: Does Seasonal-Hybrid ESD on minute-level deletion counts (or a managed seasonal confidence
    band) flag the current deletion volume as an outlier outside the predicted interval?
  context: 'Deletion activity has daily and weekly periodicity (e.g., nightly CI/CD churn). Seasonal-Hybrid
    ESD on minute-level deletion counts accounts for that seasonality and flags counts outside the predicted
    interval, avoiding false alarms during expected busy periods while still catching true anomalies.
    A managed seasonal confidence band over a CloudTrail-derived termination metric is an alternative.
    Reporting expected-vs-observed counts and the contributing principal lets analysts judge whether a
    spike is operational or a coordinated destructive burst aimed at evading detection. References: [Hochenbaum
    et al.](https://arxiv.org/pdf/1704.07706) [AWS CloudWatch Anomaly Detection](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud Management Plane, Identity and Access Management (IAM) Service, Billing and Cost Management
    Dashboard'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = minute_level_deletion_counts(last_90d)

      anomalies = SeasonalHybridESD(series, period=daily_weekly)

      IF current_count in anomalies: ALERT expected_count, observed_count, top_principal

      # alt: CloudWatch anomaly detection band over TerminateInstances metric'
- question: Did a principal or source IP accrue 5 or more AccessDenied/Unauthorized deletion-or-describe
    calls within 10 minutes, or was a successful termination immediately preceded by such failures from
    the same actor within 30 minutes?
  context: 'Adversaries with stolen or limited credentials often probe permissions before a destructive
    action, generating bursts of AccessDenied/Client.UnauthorizedOperation errors on deletion or describe
    calls. Alerting when a principal/source IP accrues >=5 such failures in 10 minutes, or when a successful
    TerminateInstances/virtualMachines/delete follows such failures from the same actor within 30 minutes,
    captures the permission-probing-then-succeed pattern. A positive result is a strong precursor or companion
    to evasion-driven deletion - investigate how the actor ultimately obtained permission (privilege escalation,
    role assumption). References: [SigmaHQ](https://github.com/SigmaHQ/sigma) [Elastic Detection Rules
    for AWS](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws) [Panther Analysis](https://github.com/panther-labs/panther-analysis)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud Management Plane, Identity and Access Management (IAM) Service, Internet Gateway/VPC Flow
    Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM cloud_audit WHERE eventName IN (deletion_events, describe_events)

      | WHERE errorCode IN (''AccessDenied'',''Client.UnauthorizedOperation'')

      | STATS fails = count() BY principal, sourceIPAddress, window(10m)

      | WHERE fails >= 5

      | OR EXISTS(successful_delete WITHIN 30m AFTER fails BY same principal)

      | ALERT principal, sourceIPAddress, fails'
- question: Does a principal's AccessDenied count or fail/success ratio on deletion/describe calls exceed
    its median/MAD modified Z-score threshold (|Mi|>3.5) versus baseline?
  context: 'Treating the failure-rate series as a first-class signal - much like NXDOMAIN anomaly detection
    in DNS - lets you baseline each principal''s normal AccessDenied rate on deletion/describe calls and
    alert when the failed-call count or fail/success ratio robustly exceeds a modified Z-score of 3.5.
    This catches probing that a fixed 5-in-10-minutes rule would miss for normally-noisy principals, and
    surfaces abnormal failure behavior for normally-clean ones. A positive result indicates unusual permission
    probing tied to a specific identity, often presaging a destructive deletion. References: [Modified
    Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly) [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
