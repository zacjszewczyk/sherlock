name: 'T1568.003: DNS Calculation'
id: f1013b54-977a-47b5-8b13-754ea0717f1c
description: 'This playbook helps an analyst investigate whether an adversary has established command
  and control by performing DNS Calculation -- deriving the destination IP address and/or port for C2
  from the octets of an IP address returned in a DNS response (for example, summing, XOR-ing, or bit-shifting
  the first three octets to compute a non-standard high port) rather than connecting to a predetermined
  port or the literally resolved IP. Attackers (notably IXESHE/Numbered Panda) use this to bypass static
  egress filtering on a C2 channel. The investigation spans network and endpoint telemetry across ESXi,
  Linux, macOS, and Windows: Zeek dns.log/conn.log/ssl.log, Sysmon DNS (Event ID 22) and network/process
  events, auditd connect syscalls, macOS unified logs, ESXi syslog, and Windows DNS-Client operational
  logs. It guides the analyst across several behavioral angles: correlating DNS A-record responses with
  outbound connections whose destination port is a mathematical derivative of the resolved octets within
  a tight time window; profiling post-DNS high-port usage against per-host and enterprise baselines; detecting
  algorithmically generated (DGA) domains via lexical/entropy/n-gram analysis and classifiers; spotting
  bursts of NXDOMAIN responses indicative of C2-domain hunting; and identifying low-jitter beaconing to
  derived high ports that follows a suspicious resolution. Detection methods combine symbolic-logic correlation
  rules, statistical baselining/profiling, and machine-learning models so the analyst can corroborate
  suspected DNS-calculation C2 against the DNS response, the calculated port, the responsible host/process,
  and the downstream connection behavior.'
type: technique
related:
