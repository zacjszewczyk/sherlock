questions:
- question: '[Command and Control] Calculated port correlation: Can you determine whether an internal
    host connects to a destination port that is a mathematical derivative of the octets from a recently
    resolved IP address. The connection to the calculated port occurs within 60 seconds of the DNS A-record
    response, and the destination port is typically a non-standard, high-numbered port (>1024). -- specifically,
    using the ''Calculated port correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary performs DNS
    Calculation to derive the C2 IP address and/or destination port from the octets of a DNS response,
    choosing a non-standard high port to evade static egress filtering rather than using a hard-coded
    endpoint, leaving correlatable traces across DNS-resolution and outbound-connection telemetry. This
    evidence focuses on the condition that an internal host connects to a destination port that is a mathematical
    derivative of the octets from a recently resolved IP address. The connection to the calculated port
    occurs within 60 seconds of the DNS A-record response, and the destination port is typically a non-standard,
    high-numbered port (>1024). This Symbolic Logic approach works as follows: For each DNS A-record response
    in dns.log, simulate known DNS-Calculation algorithms (sum/XOR/bitwise-shift of the resolved IP octets,
    e.g., port=o1+o2+o3 or first-three-octet derivations documented for IXESHE) and correlate the source
    host with conn.log to test whether an outbound connection uses the calculated port within 60 seconds.
    Alert on any match; the destination port is typically a non-standard high port (>1024) chosen to bypass
    static egress filtering [WHOIS Numbered Panda, Meyers](https://www.crowdstrike.com/blog/whois-numbered-panda/).
    Tune the candidate-algorithm set per environment but never remove the exact-match join. A positive
    result -- a deterministic rule match, a statistical outlier, or a model alert -- indicates probable
    DNS-calculation-driven C2; pivot to the originating host and process, the exact DNS response and its
    resolved octets, the calculated destination port and IP, the time delta between resolution and connection,
    and any subsequent beaconing or data transfer over that channel. A negative result helps rule out
    this particular DNS-calculation vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, low-and-slow, or jitter-injected activity.'
