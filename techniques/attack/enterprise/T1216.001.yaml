name: 'T1216.001: System Script Proxy Execution: PubPrn'
id: d4800364-ff2e-4ac4-9af9-5c020e01ea7a
description: 'This playbook helps an analyst investigate whether an adversary is abusing the Microsoft-signed
  PubPrn.vbs printer-publishing script to proxy execution of malicious remote code as part of the Stealth/Defense
  Evasion tactic (MITRE T1216.001). It guides the hunt across several behavioral angles on Windows endpoints:
  cscript.exe/wscript.exe invocations of pubprn.vbs that use the ''script:'' moniker with a non-LDAP handler
  (http/https/ftp) to reference a remote .sct scriptlet, bypassing signature validation and application
  control; correlation of the referenced host/URL against DNS and connection telemetry for reputation,
  first-seen, domain-age, and rarity analysis; scriptlet-fetch state and failure/blocked-retrieval patterns
  that still confirm an attempted proxy-execution; suspicious child processes spawned from the signed
  script host (powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, certutil.exe, mshta.exe) indicating
  payload execution or chaining; post-execution outbound traffic, payload retrieval, and volume spikes;
  and role/host/frequency context (non-admin user, non-print-server host, off-hours or first-seen execution).
  Detection methods combine symbolic-logic rules, statistical baselining, and machine-learning models
  applied to Windows Event ID 4688 / Sysmon process-creation logs, PowerShell logs, and Zeek conn/dns/http/files
  telemetry, so the analyst can corroborate suspected PubPrn proxy execution against command-line content,
  destination rarity, process lineage, and network context.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
