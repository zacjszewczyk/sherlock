questions:
- question: '[Resource Development] Regarding the condition that an outbound network connection from an
    internal host to a domain or IP address that matches threat intelligence for social media credential
    phishing, is a known typo-squatted domain, or is a known adversary command and control (C2) server.
    can you investigate this using the "TI correlation for social media-linked domains" (Symbolic Logic)
    approach to determine whether an organization-affiliated social media account is being targeted, compromised,
    or operated by an adversary?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    an existing social media account rather than building a new persona, so that an established relationship
    and the trust attached to a real identity can be weaponized in later phases such as spearphishing
    via service for Initial Access. This evidence focuses on the situation where an outbound network connection
    from an internal host to a domain or IP address that matches threat intelligence for social media
    credential phishing, is a known typo-squatted domain, or is a known adversary command and control
    (C2) server. The "TI correlation for social media-linked domains" approach (Symbolic Logic) works
    as follows: Join Zeek dns.log queries with conn.log connections, enrich domains/IPs against phishing,
    C2, and typo-squatted threat-intel feeds, and alert on successful (established, non-RST) matches;
    track per-host NXDOMAIN, connection-refused, and HTTP 401/403 rates against the same infrastructure
    as a distinct pre-compromise failure signal [The Landscape of Domain Name Typosquatting](https://arxiv.org/abs/1603.02767).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong signal that
    account compromise or adversary persona operation is underway; pivot to the responsible host and process
    lineage, the user and account involved, the destination domain/IP and its threat-intel reputation,
    the authentication events and source ASN/geo, and the timing and volume of the activity to scope the
    incident and confirm whether a trusted account is being abused. A negative result helps reduce suspicion
    for this particular vector but should be corroborated with the other questions in this playbook, since
    a determined actor can stay within baselines or route activity through unmonitored channels.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# TI correlation for social media-linked domains (Symbolic Logic)

      source IN [Zeek conn.log, Zeek dns.log]

      | approach: Join Zeek dns.log queries with conn.log connections, enrich domains/IPs against phishing,
      C2, and typo-squatted threat-intel feeds, and alert on successful (established, non-RST) matches;
      track per-host NXDOMAIN, connect

      | correlate over NAI: Network Egress Points, DNS Resolvers, Web Proxies

      | emit alert with contributing fields and entity context (host, user, account, dest domain/IP, ASN/geo,
      process)'
  - technology: Zeek/pseudocode
    query: '# TI correlation for social media-linked domains (Zeek view)

      watch dns.log/conn.log/http.log for social-media-related infrastructure

      | join queries to established (non-RST) connections and enrich domains/IPs

      | evaluate per-host request frequency, byte volume, and TI/typo-squat/DGA matches

      | emit candidate events with host, dest, bytes, fingerprint'
