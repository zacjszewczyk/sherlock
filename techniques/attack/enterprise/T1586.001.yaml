name: 'T1586.001: Social Media Accounts'
id: 45ad8bc9-a657-41a3-9abb-fd1bd9022f8f
description: 'This playbook helps an analyst investigate whether an adversary is developing resources
  by compromising existing social media accounts affiliated with the organization (MITRE ATT&CK T1586.001,
  Social Media Accounts) for use in later operations such as Spearphishing via Service. Because attackers
  prefer to hijack real, trusted personas rather than build new ones, the hunt spans pre-compromise reconnaissance
  and credential-theft signals as well as post-compromise account operation. It pursues the behavior from
  several complementary angles: outbound connections to social-media credential-phishing, typo-squatted,
  or C2 infrastructure (TI correlation, Damerau-Levenshtein typo-squat rarity scoring, DGA classification,
  and Siamese-CNN homoglyph lookalike detection over Zeek dns/conn logs); browser and scripting-engine
  processes launched with automation flags or anomalous lineage indicative of non-interactive bot-driven
  persona access (Windows Event ID 4688, command-line entropy baselining, gradient-boosting classification);
  credential-dump-to-social-access correlation tying LSASS access and mimikatz behavior (Event IDs 4688/4656/4663)
  to subsequent social-media connections, including breach-corpus enrichment, credential-stuffing burst
  detection, conditional-probability alerting, and HMM sequence anomaly detection; anomalous egress volume
  and cadence to social-media platforms (allowlist enforcement, percentile thresholding, SARIMA/LSTM and
  PCA-residual time-series anomaly detection over Zeek conn/http logs); and behavioral takeover indicators
  on the personas themselves -- impossible-travel logins, sensitive profile/recovery changes, per-persona
  behavioral profile deviation (COMPA-style), PCA residual anomaly, and bot/Sybil scoring of inbound connection
  requests -- drawn from social-media persona activity, authentication, and IdP/SSO sign-in logs. Detection
  methods combine deterministic symbolic-logic rules, statistical baselining, and machine learning so
  the analyst can corroborate suspected account compromise across network, endpoint, authentication, and
  persona telemetry.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
