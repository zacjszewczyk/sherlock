- question: '[Privilege Escalation] FDA Parent-Network Sequence: Can you determine whether a process with
    existing Full Disk Access (FDA) permissions, such as `Finder` or `Terminal`, spawns a child process
    that is either unsigned or signed by an untrusted developer, and this child process subsequently initiates
    an outbound network connection after inheriting access to protected files. -- specifically, using
    the ''FDA Parent-Network Sequence'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Privilege Escalation tactic (TA0004), Abuse Elevation Control
    Mechanism: TCC Manipulation lets an adversary grant malicious code TCC-protected permissions on macOS,
    leaving traces in TCC.db writes, process-execution provenance, Unified Log consent events, and network
    telemetry. This evidence focuses on the condition that a process with existing Full Disk Access (FDA)
    permissions, such as `Finder` or `Terminal`, spawns a child process that is either unsigned or signed
    by an untrusted developer, and this child process subsequently initiates an outbound network connection
    after inheriting access to protected files. This Symbolic Logic approach looks for the following signal:
    Detect the ordered chain where a parent holding FDA (e.g., `Finder.app`, `Terminal`) spawns a child
    (`bash`,`python`,`osascript`,`curl`), the child is unsigned/invalidly-signed, and the child then opens
    an outbound connection — the classic inherit-FDA-via-Finder/AppleScript abuse ([SentinelLabs](https://www.sentinelone.com/labs/bypassing-macos-tcc-user-privacy-protections-by-accident-and-design/)).
    Encode this once as a query graph and align against ESF provenance per [POIROT](https://dl.acm.org/doi/10.1145/3319535.3363217).
    Include signing status and destination in the alert; count blocked/failed egress attempts as additional
    positive state. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    a process likely obtained or exercised TCC permissions through abuse rather than a legitimate user-approved
    prompt, so pivot to the initiating process and its code-signing identity, the parent/ancestry, the
    granted TCC service, and any correlated network or file-collection activity to scope the intrusion
    and confirm intent. A negative result helps rule out this TCC-abuse vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy variants that only
    emerge across multiple signals.'
