- question: '[Privilege Escalation] TCC Write Frequency Anomaly: Can you determine whether a process other
    than a standard macOS service, such as `tccd` or `systemuiserver`, or an approved Mobile Device Management
    (MDM) agent performs a write operation to the TCC.db SQLite database, located at `/Library/Application
    Support/com.apple.TCC/TCC.db` or `~/Library/Application Support/com.apple.TCC/TCC.db`, or mutates
    the related WAL or journal files. -- specifically, using the ''TCC Write Frequency Anomaly'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Privilege Escalation tactic (TA0004), Abuse Elevation Control
    Mechanism: TCC Manipulation lets an adversary grant malicious code TCC-protected permissions on macOS,
    leaving traces in TCC.db writes, process-execution provenance, Unified Log consent events, and network
    telemetry. This evidence focuses on the condition that a process other than a standard macOS service,
    such as `tccd` or `systemuiserver`, or an approved Mobile Device Management (MDM) agent performs a
    write operation to the TCC.db SQLite database, located at `/Library/Application Support/com.apple.TCC/TCC.db`
    or `~/Library/Application Support/com.apple.TCC/TCC.db`, or mutates the related WAL or journal files.
    This Statistical Method approach looks for the following signal: Baseline every process that writes
    `TCC.db` per host over 30 days. Any process not in the historical baseline writing `TCC.db` is a zero-frequency
    (first-seen) anomaly — strong tamper indicator, mirroring the path-rarity/IDF weighting in [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).
    Also apply change-point detection (CUSUM/Bayesian online) on the per-host TCC-write count time series
    to catch abrupt bursts versus the steady tccd cadence ([Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)).
    Derive per-environment thresholds from observed write counts; alert on writers in the 0th-percentile
    (never seen) bucket. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    a process likely obtained or exercised TCC permissions through abuse rather than a legitimate user-approved
    prompt, so pivot to the initiating process and its code-signing identity, the parent/ancestry, the
    granted TCC service, and any correlated network or file-collection activity to scope the intrusion
    and confirm intent. A negative result helps rule out this TCC-abuse vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy variants that only
    emerge across multiple signals.'
