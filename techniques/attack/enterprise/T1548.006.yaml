name: 'T1548.006: Abuse Elevation Control Mechanism: TCC Manipulation'
id: b534b27e-28f1-4686-b150-5e35b1d654b5
description: 'This playbook helps an analyst investigate Abuse Elevation Control Mechanism: TCC Manipulation
  (T1548.006), in which an adversary manipulates or abuses the macOS Transparency, Consent, & Control
  (TCC) service or database to grant malicious executables elevated permissions (screen capture, camera,
  microphone, Accessibility, or Full Disk Access) without a legitimate user-consent prompt, as part of
  the Privilege Escalation tactic. It guides the hunt across complementary angles on macOS endpoints and
  at the network egress: unauthorized writes to the TCC.db SQLite database (and its -wal/-journal/-shm
  files) by processes outside the small set of legitimate writers (tccd, systemuiserver, the MDM agent);
  direct programmatic manipulation of the database via the sqlite3 CLI; abuse of applications that already
  hold Full Disk Access (e.g., Finder, Terminal) to spawn unsigned children that inherit protected access
  and then reach out to the network; programmatic TCC grants that appear within seconds of a binary''s
  first execution and skip the consent UI; connections from TCC-privileged processes to threat-intel destinations;
  abuse of already-entitled collaboration apps (screen capture / Accessibility) to launch network utilities
  for exfiltration; beaconing from microphone/camera-privileged processes; and bulk file collection and
  exfiltration immediately after a process gains Full Disk Access. Detection methods combine deterministic
  symbolic-logic correlation rules, statistical baselining (first-seen/zero-frequency, percentile floors,
  change-point, entropy, beaconing regularity), and machine-learning models (Isolation Forest / one-class
  SVM, Prophet forecasting, LSTM/HMM sequence models, and provenance graph learners such as KAIROS, ThreaTrace,
  and MAGIC) applied to macOS Unified Log, Endpoint Security Framework (ESF) events, File Integrity Monitoring
  logs, and Zeek conn/ssl/intel/files logs, so the analyst can distinguish TCC abuse from legitimate user-approved
  permission grants and pivot to the offending process, its lineage, the granted service, and any C2 or
  exfiltration destination.'
type: technique
