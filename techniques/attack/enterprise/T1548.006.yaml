questions:
- question: '[Privilege Escalation] Approved TCC Writers Alert: Can you determine whether a process other
    than a standard macOS service, such as `tccd` or `systemuiserver`, or an approved Mobile Device Management
    (MDM) agent performs a write operation to the TCC.db SQLite database, located at `/Library/Application
    Support/com.apple.TCC/TCC.db` or `~/Library/Application Support/com.apple.TCC/TCC.db`, or mutates
    the related WAL or journal files. -- specifically, using the ''Approved TCC Writers Alert'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Privilege Escalation tactic (TA0004), Abuse Elevation Control
    Mechanism: TCC Manipulation lets an adversary grant malicious code TCC-protected permissions on macOS,
    leaving traces in TCC.db writes, process-execution provenance, Unified Log consent events, and network
    telemetry. This evidence focuses on the condition that a process other than a standard macOS service,
    such as `tccd` or `systemuiserver`, or an approved Mobile Device Management (MDM) agent performs a
    write operation to the TCC.db SQLite database, located at `/Library/Application Support/com.apple.TCC/TCC.db`
    or `~/Library/Application Support/com.apple.TCC/TCC.db`, or mutates the related WAL or journal files.
    This Symbolic Logic approach looks for the following signal: Maintain a strict watchlist of processes
    allowed to write `TCC.db`, its `-wal`/`-journal`/`-shm` files (`tccd`, `systemuiserver`, and the deployed
    MDM agent); legitimate writers are a tiny known set ([SentinelLabs](https://www.sentinelone.com/labs/bypassing-macos-tcc-user-privacy-protections-by-accident-and-design/)).
    From ESF `ES_EVENT_TYPE_NOTIFY_WRITE`/FIM, alert when the initiating process is NOT on the watchlist.
    Hard-fail enrichers: also alert if SIP is reported disabled (prerequisite for direct writes) or if
    the write occurred with no preceding user-consent prompt in the Unified Log (failure-mode signal).
    Include initiating process path, code-signing id, and parent in the alert. A positive result -- a
    rule match, statistical outlier, or model alert -- indicates a process likely obtained or exercised
    TCC permissions through abuse rather than a legitimate user-approved prompt, so pivot to the initiating
    process and its code-signing identity, the parent/ancestry, the granted TCC service, and any correlated
    network or file-collection activity to scope the intrusion and confirm intent. A negative result helps
    rule out this TCC-abuse vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy variants that only emerge across multiple signals.'
  answer_sources:
  - macOS Unified Log
  - macOS Endpoint Security Framework (ESF) ES_EVENT_TYPE_NOTIFY_WRITE
  - File Integrity Monitoring (FIM) logs
  - 'NAI: Endpoint agent log collectors on all macOS devices, particularly those of developers, administrators,
    and executives.'
