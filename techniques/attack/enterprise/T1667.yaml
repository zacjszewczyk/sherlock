- question: '[Impact] Recipient mass-sender rule (Symbolic Logic): Can you determine whether a single
    recipient address receives messages from a high number of unique sender domains/IPs within a 5-minute
    window where subjects/bodies exhibit high similarity (e.g., near-identical subscription-confirmation
    messages), indicating low content diversity characteristic of a bombing wave. -- specifically by applying
    the ''Recipient mass-sender rule'' Symbolic Logic approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary email-bombs a target by flooding
