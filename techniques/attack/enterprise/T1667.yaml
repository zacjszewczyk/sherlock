- question: '[Impact] Tiered traffic thresholds (Symbolic Logic): Can you determine whether the rate of
    inbound SMTP connections or total email volume for a specific recipient or the MTA as a whole exceeds
    a dynamic, statistically-derived threshold based on historical patterns for that entity and time of
    day/week — the defining volume/frequency signature of email bombing. -- specifically by applying the
    ''Tiered traffic thresholds'' Symbolic Logic approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary email-bombs a target by flooding
    a mailbox with an overwhelming volume of inbound messages to bury legitimate email and disrupt operations,
    often as a distraction or precursor to follow-on social engineering and intrusion. This evidence focuses
    on the condition that the rate of inbound SMTP connections or total email volume for a specific recipient
    or the MTA as a whole exceeds a dynamic, statistically-derived threshold based on historical patterns
    for that entity and time of day/week — the defining volume/frequency signature of email bombing. The
