questions:
- question: '[Impact] TI corpus correlation (Symbolic Logic): Can you determine whether an inbound SMTP
    transaction involves a sender IP, sender domain, HELO/EHLO, envelope sender, or email subject present
    on a threat-intelligence feed cataloging email-bombing or subscription-bombing indicators. SMTP envelope
    fields and reply codes are defined by RFC 5321 and exposed in first-party MTA and Zeek smtp.log telemetry.
    -- specifically by applying the ''TI corpus correlation'' Symbolic Logic approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary email-bombs a target by flooding
    a mailbox with an overwhelming volume of inbound messages to bury legitimate email and disrupt operations,
    often as a distraction or precursor to follow-on social engineering and intrusion. This evidence focuses
    on the condition that an inbound SMTP transaction involves a sender IP, sender domain, HELO/EHLO,
    envelope sender, or email subject present on a threat-intelligence feed cataloging email-bombing or
    subscription-bombing indicators. SMTP envelope fields and reply codes are defined by RFC 5321 and
    exposed in first-party MTA and Zeek smtp.log telemetry. The ''TI corpus correlation'' approach (Symbolic
    Logic) works as follows: Correlate Zeek smtp.log/conn.log envelope fields (source IP, HELO/EHLO, MAIL
    FROM, subject) — the deterministic fields specified by [Simple Mail Transfer Protocol (RFC 5321),
    Klensin](https://www.rfc-editor.org/rfc/rfc5321.txt) — against email-bombing TI to trigger medium
    alerts. Keep this rule even when no ML is available (Floor of Determinism). A positive result -- a
    rule match, statistical outlier, or model alert -- is consistent with an email-bombing event (or its
    automated set-up or follow-on); pivot to the targeted recipient(s), the source IPs/sender domains
    and their reputation, the message/subject content and similarity, the delivered-vs-rejected ratio,
    and any concurrent host, process, or network activity on the victim''s endpoint. A negative result
    helps rule out this particular signature but should be corroborated with the other questions in this
    playbook, since a single method can miss low-and-slow bombing, newsletter-subscription floods that
    evade volume thresholds, or a quiet follow-on intrusion.'
  answer_sources:
  - Zeek conn.log
  - Zeek smtp.log
  - 'NAI: Mail Transfer Agent (MTA) servers, Email security gateway, Perimeter firewalls, Threat Intelligence
    Platform (TIP)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '# TI corpus correlation (Symbolic Logic)

      source IN [Zeek conn.log, Zeek smtp.log]

      | approach: Correlate Zeek smtp.log/conn.log envelope fields (source IP, HELO/EHLO, MAIL FROM, subject)
