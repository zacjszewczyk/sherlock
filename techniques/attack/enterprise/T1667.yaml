name: 'T1667: Email Bombing'
id: af1bb7d3-6327-4ed4-bc52-6e9fe64945f9
description: 'This playbook helps an analyst investigate Email Bombing -- an adversary flooding one or
  more targeted mailboxes with an overwhelming volume of inbound messages to bury legitimate email (security
  alerts, help-desk tickets, client correspondence) and disrupt business operations. Email bombing is
  frequently automated (for example, a bot subscribing a victim address to thousands of newsletters and
  online services that do not validate sign-ups) and is commonly a precursor to social-engineering follow-on
  activity such as Spearphishing Voice, deployment of Remote Access Software, ransomware, or Financial
  Theft. Under the Impact tactic, this playbook guides the analyst across several complementary investigative
  angles: correlating inbound SMTP envelope fields (source IP, HELO/EHLO, MAIL FROM, subject) against
  email-bombing threat intelligence; counting unique malicious or unique total senders per recipient within
  short windows; scoring sender-domain entropy and subject similarity to detect the low content-diversity
  signature of a bombing wave; detecting outbound HTTP POST automation that registers a corporate address
  across many sign-up forms; baselining and change-point-detecting inbound message volume per recipient
  and per MTA; and correlating a confirmed bombing event with subsequent suspicious host, process, and
  network activity that may reveal the bombing as a distraction for a separate intrusion. Detection methods
  combine symbolic-logic rules, statistical baselining (modified Z-score, Shannon entropy, Jaccard similarity,
  CUSUM/EWMA change-point), and machine learning (Gradient Boosting spam scoring with SHAP, DBSCAN subject
  clustering, ARIMA forecasting, LSTM/KitNET autoencoders, Isolation Forest/One-Class SVM, DeepLog) applied
  to Zeek smtp.log/conn.log/http.log/dns.log, first-party MTA and email-gateway logs, M365/Exchange and
  macOS/Linux mail telemetry, and Windows Event IDs 4688 and 5156, so the analyst can confirm an email-bombing
  event, characterize its source and scope, and rule out or pursue any follow-on compromise.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
