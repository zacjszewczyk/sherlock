    norm ([Deciphering Malware''s use of TLS](https://arxiv.org/abs/1607.01639)). A positive result indicates
    the observed certificate or TLS behavior aligns with adversary acquisition or staging of digital certificates
    and should be escalated; a negative result helps rule out staged certificate infrastructure. Source
    evidence: Anomalous SSL/TLS certificate characteristics are observed: unusually short validity (e.g.,
    < 90 days), issuance by a rarely seen CA, few/no SANs, self-signed status, or a certificate issued
    for a very recently registered domain.'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline_30d = profile(issuer_freq, validity_dist, san_count, key_len)\nfor cert in x509.log:\n\
      \   flag if cert.issuer in bottom5pct(baseline.issuer_freq)\n        OR cert.validity_days in bottom10pct(baseline.validity)\
      \  // e.g. <30d\n        OR cert.num_sans << baseline.san_count_norm"
