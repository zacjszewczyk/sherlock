- question: '[Machine Learning] Explainable infrastructure community scoring: How can an analyst determine
    whether a single suspicious certificate (thumbprint) is reused across multiple unrelated destination
    IPs, or multiple distinct suspicious certificates (free CA, young domains) resolve to a single IP
    — indicating shared/staged adversary infrastructure.'
  context: 'Relevant to the Resource Development tactic. Build a graph of IPs, certificate thumbprints,
    and subjects with ''serves''/''has'' edges, run community detection (e.g., Louvain), score communities
    on suspicious attributes (free issuer, young domain, high CN entropy, reuse breadth), and rank investigations;
    combine with version-resilient flow features so clustering survives TLS 1.3 certificate encryption
    ([Extending C2 Traffic Detection from TLS 1.2 to TLS 1.3](https://dl.acm.org/doi/10.1145/3678890.3678921),
    [Isolation Forest](https://ieeexplore.ieee.org/document/4781136)). A positive result indicates the
    observed certificate or TLS behavior aligns with adversary acquisition or staging of digital certificates
    and should be escalated; a negative result helps rule out staged certificate infrastructure. Source
    evidence: A single suspicious certificate (thumbprint) is reused across multiple unrelated destination
    IPs, or multiple distinct suspicious certificates (free CA, young domains) resolve to a single IP
    — indicating shared/staged adversary infrastructure.'
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = graph(nodes=[ip, thumbprint, subject], edges=['serves','has'])\ncommunities = louvain(G)\n\
      for c in communities:\n   s = score(free_issuer, young_domain, high_cn_entropy, reuse_breadth)\n\
      \   s += version_resilient_flow_features(c)  // survives TLS1.3 cert encryption\nrank investigations\
      \ by s"
