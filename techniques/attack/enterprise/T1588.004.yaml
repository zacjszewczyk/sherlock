name: 'T1588.004: Digital Certificates'
id: 2746f29b-8988-411d-87e2-5dda068ecb82
description: Investigate whether an adversary is acquiring or staging SSL/TLS digital certificates to
  support future operations such as command-and-control encryption, adversary-in-the-middle, or phishing.
  This playbook helps an analyst hunt for certificates that match threat-intelligence feeds or known tool-default
  fingerprints (e.g., Cobalt Strike); certificates whose Common Name or Subject Alternative Names typosquat
  the organization's brand or use free CAs and dynamic-DNS hostnames; certificates with anomalous attributes
  (very short validity, rare issuers, few SANs, self-signed status, or issued for newly registered domains);
  spikes in self-signed certificates or certificate-validation errors that can signal unauthorized root-of-trust
  additions; and shared/staged infrastructure revealed by certificate thumbprint reuse across IPs or many
  suspicious certificates resolving to a single host. Evidence is drawn from Zeek ssl/x509/conn/dns logs,
  Certificate Transparency monitoring, and Windows CAPI2 events, combined with symbolic-logic rules, statistical
  baselining, and machine-learning models.
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
