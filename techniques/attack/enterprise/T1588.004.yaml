    A positive result indicates the observed certificate or TLS behavior aligns with adversary acquisition
    or staging of digital certificates and should be escalated; a negative result helps rule out staged
    certificate infrastructure. Source evidence: Anomalous SSL/TLS certificate characteristics are observed:
    unusually short validity (e.g., < 90 days), issuance by a rarely seen CA, few/no SANs, self-signed
    status, or a certificate issued for a very recently registered domain.'
  answer_sources: &id003
  - Zeek ssl.log
