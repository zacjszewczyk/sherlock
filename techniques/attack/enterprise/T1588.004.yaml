questions:
- question: '[Symbolic Logic] CTI thumbprint and tool-default match escalation: How can an analyst determine
    whether an observed SSL/TLS certificate''s attributes (e.g., thumbprint/SHA-1, serial number, subject,
    JA4X structural fingerprint) exactly match an entry in a threat-intelligence feed of known-malicious
    certificates or a known tool-default certificate (e.g., Cobalt Strike).'
  context: 'Relevant to the Resource Development tactic. Generate a high-severity SIEM alert when an observed
    certificate thumbprint/serial from Zeek x509.log matches a known-malicious thumbprint in an ingested
    CTI feed OR a documented tool-default certificate, and additionally match the certificate''s JA4X
    structural fingerprint (issuer/subject RDN order, extension OIDs) so tool-generated certs are caught
    even when serial/subject are randomized ([JA4+](https://github.com/FoxIO-LLC/ja4)); pivot on matching
    serials/issuer fields to surface sibling infrastructure ([Threat Hunting with TLS/SSL Certificates](https://www.splunk.com/en_us/blog/security/tall-tales-of-hunting-with-tls-ssl-certificates.html)).
    A positive result indicates the observed certificate or TLS behavior aligns with adversary acquisition
    or staging of digital certificates and should be escalated; a negative result helps rule out staged
    certificate infrastructure. Source evidence: An observed SSL/TLS certificate''s attributes (e.g.,
    thumbprint/SHA-1, serial number, subject, JA4X structural fingerprint) exactly match an entry in a
    threat-intelligence feed of known-malicious certificates or a known tool-default certificate (e.g.,
    Cobalt Strike).'
  answer_sources: &id001
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network Egress/Ingress Points, Forward Web Proxies, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Zeek x509.log enriched with CTI feed and tool-default cert list\nx509 = read(\"x509.log\"\
      )\ncti = lookup_set(\"intel.malicious_cert_thumbprints\", \"intel.tool_default_thumbprints\")\n\
      alert where x509.fingerprint in cti\n   OR ja4x(x509.issuer_rdn_order, x509.subject_rdn_order, x509.extension_oids)\
      \ in intel.ja4x_tool_fingerprints\nemit severity=HIGH, pivot on x509.serial, x509.issuer -> find\
      \ sibling certs/IPs"
- question: '[Statistical Method] CTI session volume, frequency, and state scoring: How can an analyst
    determine whether an observed SSL/TLS certificate''s attributes (e.g., thumbprint/SHA-1, serial number,
    subject, JA4X structural fingerprint) exactly match an entry in a threat-intelligence feed of known-malicious
    certificates or a known tool-default certificate (e.g., Cobalt Strike).'
  context: 'Relevant to the Resource Development tactic. For each CTI-matched certificate, profile the
    Zeek conn.log session for Volume (inbound/outbound byte counts and ratio), Frequency (connections/min
    to the destination), and State (TLS handshake success vs. validation-failure/reset rate), flagging
    byte ratios or connection rates above the 95th percentile of the egress baseline as data staging or
    beaconing ([Deciphering Malware''s use of TLS](https://arxiv.org/abs/1607.01639)). A positive result
    indicates the observed certificate or TLS behavior aligns with adversary acquisition or staging of
    digital certificates and should be escalated; a negative result helps rule out staged certificate
    infrastructure. Source evidence: An observed SSL/TLS certificate''s attributes (e.g., thumbprint/SHA-1,
    serial number, subject, JA4X structural fingerprint) exactly match an entry in a threat-intelligence
    feed of known-malicious certificates or a known tool-default certificate (e.g., Cobalt Strike).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Profile conn.log sessions tied to CTI-matched certs\njoin conn.log on uid with cti_matched_ssl\n\
      per (dest_ip):\n  volume      = sum(orig_bytes), sum(resp_bytes), ratio = orig_bytes/resp_bytes\n\
      \  frequency   = count(conn)/minutes\n  state_score = handshake_fail_or_reset / total_handshakes\n\
      alert if ratio > p95(egress_baseline)\n     OR frequency > p95(egress_baseline)   // beaconing /\
      \ staging"
- question: '[Machine Learning] Explainable CTI event classifier: How can an analyst determine whether
    an observed SSL/TLS certificate''s attributes (e.g., thumbprint/SHA-1, serial number, subject, JA4X
    structural fingerprint) exactly match an entry in a threat-intelligence feed of known-malicious certificates
    or a known tool-default certificate (e.g., Cobalt Strike).'
  context: 'Relevant to the Resource Development tactic. Feed certificate + cipher + flow features (issuer,
    validity_days, is_self_signed, num_sans, cipher-suite/extension fingerprint, duration, bytes, byte
    ratio, destination port) into a supervised model (e.g., XGBoost/logistic regression) trained on labeled
    benign/malicious TLS, escalate events with confidence > 0.9, and surface the top-3 contributing features
    (per-feature weights) in the alert text ([Deciphering Malware''s use of TLS](https://arxiv.org/abs/1607.01639)).
    A positive result indicates the observed certificate or TLS behavior aligns with adversary acquisition
    or staging of digital certificates and should be escalated; a negative result helps rule out staged
    certificate infrastructure. Source evidence: An observed SSL/TLS certificate''s attributes (e.g.,
    thumbprint/SHA-1, serial number, subject, JA4X structural fingerprint) exactly match an entry in a
    threat-intelligence feed of known-malicious certificates or a known tool-default certificate (e.g.,
    Cobalt Strike).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "// Supervised TLS classifier\nfeatures = [issuer, validity_days, is_self_signed, num_sans,\n\
      \            cipher_suite_fp, extension_fp, duration, bytes, byte_ratio, dest_port]\nscore = model.predict_proba(features)\
      \   // XGBoost / logistic regression\nif score > 0.90:\n   alert with top3 = explain(model, features)\
      \   // per-feature contributions"
- question: '[Symbolic Logic] CT brand monitoring and free-CA/dynamic-DNS watchlist: How can an analyst
    determine whether a certificate is observed (in egress TLS or, pre-deployment, in Certificate Transparency
    logs) whose Subject Common Name (CN) or a Subject Alternative Name (SAN) is a suspected typosquat/homoglyph
    of the organization''s domain or brand, or is a dynamic-DNS hostname issued by a free Certificate
    Authority.'
  context: 'Relevant to the Resource Development tactic. Continuously query Certificate Transparency logs
    for newly issued certificates whose CN/SAN contain the org''s brand terms or homoglyph variants and
    alert before deployment, the primary pre-deployment signal ([RFC 6962 Certificate Transparency](https://www.rfc-editor.org/rfc/rfc6962),
    [Certified Phishing](https://www.usenix.org/conference/soups2019/presentation/drury)); in parallel,
    trigger a Zeek ssl.log rule when issuer matches a free CA (e.g., Let''s Encrypt, ZeroSSL, cPanel)
    AND CN/SAN matches dynamic-DNS regexes (e.g., ''.*\\.duckdns\\.org'', ''.*\\.no-ip\\.com''). A positive
    result indicates the observed certificate or TLS behavior aligns with adversary acquisition or staging
    of digital certificates and should be escalated; a negative result helps rule out staged certificate
    infrastructure. Source evidence: A certificate is observed (in egress TLS or, pre-deployment, in Certificate
    Transparency logs) whose Subject Common Name (CN) or a Subject Alternative Name (SAN) is a suspected
    typosquat/homoglyph of the organization''s domain or brand, or is a dynamic-DNS hostname issued by
    a free Certificate Authority.'
  answer_sources: &id002
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek dns.log
  - Certificate Transparency logs
  - 'NAI: Network Egress/Ingress Points, Forward Web Proxies, Internal DNS Resolvers, Certificate Transparency
    Monitor'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Pre-deployment CT monitoring + egress free-CA rule\nfor cert in certificate_transparency_stream:\n\
      \   if matches(cert.cn_san, brand_terms OR homoglyph_variants):\n      alert PRE_DEPLOY\n// egress\
      \ rule\nalert ssl.log where issuer in {LetsEncrypt, ZeroSSL, cPanel}\n   AND cn_san ~ /.*\\.duckdns\\\
      .org|.*\\.no-ip\\.com/"
- question: '[Statistical Method] Typosquat Levenshtein and entropy scoring: How can an analyst determine
    whether a certificate is observed (in egress TLS or, pre-deployment, in Certificate Transparency logs)
    whose Subject Common Name (CN) or a Subject Alternative Name (SAN) is a suspected typosquat/homoglyph
    of the organization''s domain or brand, or is a dynamic-DNS hostname issued by a free Certificate
    Authority.'
  context: 'Relevant to the Resource Development tactic. For CN/SAN strings (from Zeek ssl.log and CT
    feeds), compute Levenshtein distance to the org''s brand/domain master list and Shannon entropy /
    n-gram rarity, flagging edit distances of 1-3 (typosquat) or high entropy (DGA) for review ([NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500));
    enrich the CN/SAN domain with passive-DNS prevalence, age, and IP fan-out and raise priority for young,
    rare, high-fan-out domains ([EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)).
    A positive result indicates the observed certificate or TLS behavior aligns with adversary acquisition
    or staging of digital certificates and should be escalated; a negative result helps rule out staged
    certificate infrastructure. Source evidence: A certificate is observed (in egress TLS or, pre-deployment,
    in Certificate Transparency logs) whose Subject Common Name (CN) or a Subject Alternative Name (SAN)
    is a suspected typosquat/homoglyph of the organization''s domain or brand, or is a dynamic-DNS hostname
    issued by a free Certificate Authority.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for name in (ssl.log.cn_san + ct_feed.cn_san):\n   d = min(levenshtein(name, b) for b in brand_master_list)\n\
      \   e = shannon_entropy(name); ngram = ngram_rarity(name)\n   pdns = passive_dns(name)  // prevalence,\
      \ age_days, ip_fanout\n   flag if d in 1..3 OR e high\n   raise_priority if pdns.age_days low AND\
      \ pdns.prevalence rare AND pdns.ip_fanout high"
