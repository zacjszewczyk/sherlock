name: 'T1480: Execution Guardrails'
id: 5665930c-98b6-4cf6-98f2-f6eb6118d083
description: 'Investigate whether an adversary''s payload is using execution guardrails: environment-specific
  conditional checks that constrain execution to an intended target and reduce collateral exposure. This
  playbook helps an analyst hunt for the observable footprints of guardrailing across Windows, Linux,
  macOS, and ESXi: short-lived processes that perform a burst of system enumeration (domain name, registry
  keys, hardware identifiers, MAC/timezone, security-product artifacts, AD/LDAP info) and then exit cleanly
  with no file write or network connection (a guardrail mismatch); command lines that chain discovery
  tools (whoami, hostname, ipconfig, systeminfo) with conditional logic and string matching (findstr,
  &&, ||) to validate a target value before proceeding, including obfuscated or Base64-encoded PowerShell
  variants; processes that probe a diverse, functionally-unrelated set of objects within their first seconds;
  and network connectivity canaries where a high-reputation lookup/fetch precedes contact with a low-reputation,
  newly-registered, or NXDOMAIN domain. It combines symbolic-logic detections, statistical baselining/entropy/percentile
  methods, and machine-learning approaches so an analyst can separate guardrail behavior from benign administrative
  tooling and sandbox/virtualization evasion.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
