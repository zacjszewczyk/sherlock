questions:
- question: Is any process accessing known guardrail/environment-keying artifacts (VM detection registry
    keys, VBox driver files, computer name, volume serial, MAC, timezone, user name) and then terminating
    within five seconds without ever writing a file or opening a network connection?
  context: 'Execution guardrails check for an expected target-specific value and only continue if it matches;
    a mismatch produces a clean exit with no follow-on payload. Under the Stealth tactic the adversary
    is trying to remain indistinguishable from benign activity, so the only signal is the burst of environment-keying
    object access followed by a silent termination. Watchlist the concrete artifacts (HKLM\SOFTWARE\VMware,
    Inc.; VBoxGuest service; ComputerName key; VBoxMouse.sys; GetComputerName/GetUserName/GetVolumeInformation/MAC/timezone
    APIs) and require process exit (4689) within ~5s with no Sysmon 3 connection or Sysmon 11 file write.
    A positive result is a guardrail mismatch; a negative (connection or write followed) usually means
    the guardrail passed or the tool is benign. The concrete keys/files/APIs are drawn from the environmental-keying
    artifact catalog in [Malware Dynamic Analysis Evasion Techniques: A Survey](https://arxiv.org/pdf/1811.01190).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: All Endpoints (Workstations, Laptops), Virtual Desktop Infrastructure (VDI) Environments, Security
    Analyst and Developer Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc=EventID(4688)\nobj=EventID(4663) where object IN guardrail_watchlist (HKLM\\\\SOFTWARE\\\
      \\VMware Inc, VBoxGuest, ComputerName, VBoxMouse.sys, GetComputerName, GetUserName, GetVolumeInformation,\
      \ MAC, timezone)\nterm=EventID(4689)\njoin proc,obj,term on PID\nalert if (term.time - proc.time)\
      \ < 5s\n  AND NOT exists(Sysmon EID3 connection by PID)\n  AND NOT exists(Sysmon EID11 file write\
      \ by PID)"
- question: Within the first five seconds of execution, does any process exceed its per-executable 95th-percentile
    count/rate of object accesses and WMI queries and then terminate having written and sent zero bytes?
  context: 'Guardrailing front-loads system interrogation: many object/WMI queries crammed into the first
    seconds, then exit. Baseline each executable''s first-5-second access count and query rate over 30
    days and flag instances above the 95th percentile that exit with zero bytes_out/bytes_written. This
    statistical framing catches novel artifacts that a static watchlist would miss. Where per-exe baselines
    are sparse, an Isolation Forest over [count, rate, lifetime, bytes_out] gives an unsupervised fallback.
    Positive means abnormally dense reconnaissance that produced no payload effect, consistent with a
    failed guardrail under Stealth. Use [Isolation Forest](https://doi.org/10.1145/2133360.2133363) as
    the unsupervised fallback model.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: All Endpoints (Workstations, Laptops), Virtual Desktop Infrastructure (VDI) Environments, Security
    Analyst and Developer Workstations'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per process_name compute p95(first5s_access_count), p95(first5s_query_rate) over 30d\nfor\
      \ each process: collect first5s access_count, query_rate, lifetime, bytes_out, bytes_written\nalert\
      \ if access_count > p95 AND query_rate > p95\n  AND bytes_out == 0 AND bytes_written == 0 AND terminated(4689)"
  - technology: SIEM/ML pseudocode
    query: 'X = [count, rate, lifetime, bytes_out] per process (sparse-baseline exes)

      model = IsolationForest(contamination=0.01).fit(history)

      alert if model.decision_function(x) is outlier'
- question: Does a supervised classifier, scoring each process on its first five seconds of behavior,
    label it as guardrailing rather than benign or administrative?
  context: Train a Random Forest on labeled processes using features such as parent process, command line,
    count of system-querying API calls, query rate, bytes written/sent, and a short-lived (<5s) flag.
    The model generalizes across the many possible guardrail artifacts and produces explainable triage
    output by emitting the top-3 feature importances (e.g. 'short-lived=true, sysquery_count=22, bytes_out=0').
    For the Stealth tactic this helps an analyst defensibly distinguish guardrail checks from legitimate
    fast-running tools. A high-confidence guardrail label with bytes_out=0 warrants endpoint isolation
    and sample retrieval. This follows the explainable RF/TF-IDF approach validated in [Comprehensive
    evaluation of Mal-API-2019 dataset by machine learning in malware detection](https://arxiv.org/abs/2403.02232).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: All Endpoints (Workstations, Laptops), Virtual Desktop Infrastructure (VDI) Environments, Security
    Analyst and Developer Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [parent_proc, cmdline, sysquery_count, query_rate, bytes_written, bytes_sent, short_lived<5s]

      rf = RandomForest.fit(labeled_benign_vs_guardrail)

      pred, importances = rf.predict(features)

      alert if pred == ''guardrail'' with top3 importances in alert text'
- question: Where detonation or sandbox telemetry exists for a sample, do its observable actions (files,
    registry, connections) differ between the production endpoint run and the reference/sandbox run?
  context: 'The defining property of a guardrail is behavior conditioned on an environment-specific value:
    the sample acts in production but stays inert in a sandbox (or vice versa). Comparing the action sets
    across environments isolates environment-keyed divergence from ordinary nondeterminism. Under Stealth
    this is the cleanest confirmation that an adversary deliberately scoped the payload. A positive result
    (rich behavior on a targeted host, no behavior in the reference run) confirms guardrailing and should
    drive scoping of which environment value triggered execution. Divergent behavior conditioned on environment-specific
    values is the defining guardrail signal per [BareCloud: Bare-metal Analysis-based Evasive Malware
    Detection](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-kirat.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: All Endpoints (Workstations, Laptops), Virtual Desktop Infrastructure (VDI) Environments, Security
    Analyst and Developer Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'prod = action_set(sample, environment=production)

      ref  = action_set(sample, environment=sandbox/reference)

      alert if symmetric_difference(prod, ref) over {files, registry, connections} is significant'
- question: Are there command lines that chain system-discovery tools (systeminfo, whoami, hostname, net
    user, quser) with conditional operators (&&, ||) and string matching (findstr) against a specific
    domain or hostname, especially when spawned by unexpected parents like winword.exe or wscript.exe?
  context: A common guardrail idiom validates the target by running discovery and comparing the output
    to an expected value before continuing. Regex over 4688/Sysmon-1 command lines catches the discovery+conditional+findstr
    pattern; an anomalous parent (Office app, script host) sharply raises suspicion. Add a parallel rule
    for Base64/-EncodedCommand PowerShell delivering the same logic. For the Stealth tactic the adversary
    blends the check into ordinary admin syntax, so the chained conditional comparison against a target-specific
    string is the key discriminator. A match warrants pulling the full process tree and decoding any encoded
    payload. The Base64/-EncodedCommand parallel rule mirrors [Suspicious Encoded PowerShell Command Line](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd/).
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows PowerShell EID 4104
  - 'NAI: All Endpoints (Workstations, Laptops), Domain Controllers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "regex = /(systeminfo|whoami|hostname|net user|quser).*(?:&&|\\|\\|).*findstr.*(corp\\.domain\\\
      .com|SPECIFIC_HOSTNAME)/i\nalert if EventID(4688).cmdline matches regex\n  raise severity if parent\
      \ IN (winword.exe, wscript.exe, excel.exe, mshta.exe)\nparallel: alert if PowerShell 4104 cmdline\
      \ has -EncodedCommand/Base64 decoding to same logic"
- question: Does any command-line string show abnormally high Shannon entropy relative to the baseline
    for that interpreter, indicating obfuscation of an embedded guardrail check?
  context: Adversaries obfuscate guardrail logic to evade signature rules. Computing per-process-name
    command-line entropy and alerting beyond three standard deviations (in practice >5.0 bits/char for
    normally-low-entropy interpreters like cmd.exe) flags packed/encoded content. Under Stealth, obfuscation
    is the concealment behavior; high entropy on an interpreter that normally runs plaintext commands
    is a strong anomaly. A positive result should trigger deobfuscation and inspection for hidden discovery/conditional
    logic; benign installers/encoders are the main false positives to allowlist. Thresholds follow the
    packed/encrypted vs. plaintext separation in [Using Entropy Analysis to Find Encrypted and Packed
    Malware](https://ieeexplore.ieee.org/document/4140989).
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows PowerShell EID 4104
  - 'NAI: All Endpoints (Workstations, Laptops), Domain Controllers, Application Servers'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per process_name compute mean, stddev of shannon_entropy(cmdline) over baseline

      for each new cmdline: H = shannon_entropy(cmdline)

      alert if H > mean + 3*stddev OR H > 5.0 bits/char for low-entropy interpreters'
- question: For PowerShell/script-based commands, do character-frequency, token, and AST-derived features
    deviate sharply from a benign script corpus, indicating obfuscated guardrail logic?
  context: Entropy alone misses some obfuscation; structural scoring (character frequencies, token distribution,
    AST features) against a large benign baseline catches Revoke-Obfuscation-style transforms. This is
    tuned to PowerShell guardrails that hide environment checks inside heavily transformed scripts. Under
    Stealth, the goal is to expose concealment that mimics normal scripting. A large deviation score flags
    the script for AST extraction and review of conditional environment comparisons; normal admin scripts
    score low. Uses the feature set and 408k-script baseline from [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows PowerShell EID 4104
  - 'NAI: All Endpoints (Workstations, Laptops), Domain Controllers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'features = char_freq_vector + token_stats + ast_features(script)

      score = deviation(features, benign_corpus_baseline)

      alert if score > threshold (Revoke-Obfuscation feature set)'
- question: Does a fine-tuned transformer classifier label a process/PowerShell command string as a guardrail
    check rather than benign or administrative activity?
  context: 'Feed 4688/4104 command strings into a lightweight fine-tuned transformer (e.g. BERT) trained
    on labeled benign, administrative, and guardrail commands. The model captures semantic patterns regex
    misses and, by surfacing the top-3 most-attended tokens, gives the analyst explainable triage. For
    the Stealth tactic this generalizes detection of disguised environment checks. A guardrail classification
    with attention on discovery/conditional tokens warrants escalation and full command-tree review. Sequence-model
    intuition for command/event streams follows [DeepLog: Anomaly Detection and Diagnosis from System
    Logs through Deep Learning](https://doi.org/10.1145/3133956.3134015).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows PowerShell EID 4104
  - 'NAI: All Endpoints (Workstations, Laptops), Domain Controllers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = finetuned_BERT(labels=[benign, administrative, guardrail])

      pred, attention = model(cmd_string from 4688/4104)

      alert if pred == ''guardrail'' with top3 attended tokens in alert'
- question: Are there processes that terminate within three seconds of creation with no file write and
    no network connection, after excluding known-good short-lived utilities?
  context: 'A failed guardrail exits cleanly and quickly with no payload effect. Joining 4688 creation
    to 4689 termination by PID and alerting on lifetime <3s with no Sysmon 11/Sysmon 3 follow-on captures
    this footprint; an allowlist of legitimate fast-running processes controls noise. Under Stealth the
    absence of any observable effect is precisely how the adversary avoids detection, so the short-lived
    clean exit is the signal. A positive result with a suspicious parent merits sample retrieval before
    the binary is cleaned up. The clean-exit-with-no-payload pattern is the observable footprint of a guardrail
    mismatch described in [BareCloud: Bare-metal Analysis-based Evasive Malware Detection](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-kirat.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Endpoints (Workstations, Laptops), Network Egress Points, Honeypots'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join EventID(4688) create and EventID(4689) term on PID\nalert if (term.time - create.time)\
      \ < 3s\n  AND NOT exists(Sysmon EID11 write by PID)\n  AND NOT exists(Sysmon EID3 / Zeek conn by\
      \ PID)\n  AND process NOT IN short_lived_allowlist"
- question: Does a new process instance fall below the 5th percentile of execution duration for its executable
    name, particularly when spawned by winword.exe or powershell.exe and producing zero bytes out?
  context: Some executables are normally long-running; a guardrail-bearing copy that exits almost immediately
    is an outlier against the per-executable duration distribution. Baseline durations over >=30 days
    of host and peer history, alert below the 5th percentile, and weight by zero bytes_out to suppress
    benign fast utilities. Suspicious parents add weight. For the Stealth tactic this distinguishes an
    aborted, scoped payload from normal short tools. A positive result indicates an instance behaving
    atypically fast and silently for its type.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Endpoints (Workstations, Laptops), Network Egress Points, Honeypots'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per process_name compute p5(execution_duration) over >=30d host+peer history\nalert if instance.duration\
      \ < p5 AND bytes_out == 0\n  raise severity if parent IN (winword.exe, powershell.exe, wscript.exe)"
- question: Is there a statistically significant spike in the hourly count of processes terminating in
    under three seconds on a host, relative to that host's and its peers' baselines?
  context: 'Mass detonation of a guardrailed payload (e.g. a campaign sweeping many hosts) shows up as
    a burst of sub-3-second process terminations. Modeling hourly counts per host with Seasonal-ARIMA
    or an LSTM and flagging significant spikes catches volume anomalies that single-process rules miss.
    Under Stealth, even individually quiet guardrail exits become detectable in aggregate. The alert should
    report the contributing hour/host/parent so the analyst can pivot to the underlying processes. The
    LSTM sequence-anomaly methodology follows [DeepLog: Anomaly Detection and Diagnosis from System Logs
    through Deep Learning](https://doi.org/10.1145/3133956.3134015).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Endpoints (Workstations, Laptops), Network Egress Points, Honeypots'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = hourly_count(processes with lifetime < 3s) per host

      model = SeasonalARIMA(series) or LSTM(series)

      alert if observed >> predicted (significant spike) vs host+peer baseline

      report contributing hour/host/parent'
- question: Within its first fifteen seconds, does a process touch three or more functionally-unrelated
    categories of guardrail artifacts (security-product registry, hardware/WMI classes, AD/LDAP domain
    info, VM-artifact files)?
  context: 'Guardrails probe multiple unrelated facets of the environment to confirm the target. Mapping
    each accessed object to a category (Security-Product-Registry, Hardware-WMI-Class, Domain-Info-LDAP,
    VM-Artifact-File) per PID and alerting when >=3 categories are hit in the first 15 seconds captures
    the breadth of probing rather than any single artifact. Under Stealth, no single access looks malicious
    but the simultaneous diversity does. A positive result is a process fingerprinting its environment
    and should be triaged for the conditional branch that follows. The category-to-artifact mapping is
    taken from the evasion artifact catalog in [Malware Dynamic Analysis Evasion Techniques: A Survey](https://arxiv.org/pdf/1811.01190).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 7
  - 'NAI: All Endpoints, Domain Controllers, Servers hosting security agents or management consoles'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "map each EventID(4663)/Sysmon7 object to category in\n  {Security-Product-Registry, Hardware-WMI-Class,\
      \ Domain-Info-LDAP, VM-Artifact-File}\nper PID created within last 15s count distinct categories\n\
      alert if distinct_categories >= 3"
- question: Does the Shannon entropy over the unique top-level hives/directories a process accesses in
    its first 30 seconds significantly exceed that process's baseline diversity?
  context: Treating namespace diversity as entropy quantifies how scattered a process's object access
    is. A guardrail reads across many unrelated hives/directories, producing high entropy versus its normal
    tightly-scoped access. Alerting when entropy exceeds the per-process baseline flags this broad probing
    even when the individual artifacts are novel. For the Stealth tactic this exposes concealed environmental
    fingerprinting. A positive result indicates unusually diverse reconnaissance and merits review of
    the accessed object set. Entropy-as-diversity reasoning follows [Using Entropy Analysis to Find Encrypted
    and Packed Malware](https://ieeexplore.ieee.org/document/4140989).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 7
  - 'NAI: All Endpoints, Domain Controllers, Servers hosting security agents or management consoles'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'S = set(top_level_hive_or_dir of objects accessed in first 30s) per PID

      H = shannon_entropy(S)

      alert if H >> per_process_baseline_entropy'
- question: Does a per-process provenance graph contain a node whose accessed-object neighborhood is anomalously
    high-diversity compared to learned-normal subgraphs?
  context: Building a provenance subgraph of the objects a process touches and applying node-level GNN
    anomaly scoring (GraphSAGE/ThreaTrace) or temporal-autoencoder reconstruction (KAIROS) surfaces the
    guardrail node by its anomalous, high-diversity neighborhood. This structural method catches guardrailing
    that evades count/entropy thresholds. Under Stealth, it models normal behavior and flags the deviation.
    The alert should surface the top-3 anomalous neighbor objects so the analyst can see exactly what
    the process probed. Use the GraphSAGE node-level approach of [ThreaTrace](https://arxiv.org/pdf/2111.04333)
    or the temporal-autoencoder reconstruction of [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 7
  - 'NAI: All Endpoints, Domain Controllers, Servers hosting security agents or management consoles'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'G = provenance_subgraph(process -> accessed_objects)

      scores = GraphSAGE_node_anomaly(G)  # or KAIROS temporal autoencoder

      alert on nodes with high anomaly score; report top3 anomalous neighbor objects'
- question: Does the ordered API/discovery sequence of a process align with a known guardrail API chain
    (e.g. GetComputerName -> RegOpenKey -> GetVolumeInformation -> conditional branch)?
  context: Guardrails follow characteristic ordered API chains. Using local sequence alignment to match
    a process's observed API order against chains that appear only in malicious corpora yields a signature
    for guardrailing. This complements diversity metrics by capturing the order and logic of the check.
    For the Stealth tactic, the conditional-branch terminus distinguishes a true guardrail from incidental
    discovery. A strong alignment to a malicious-only chain is a high-confidence indicator. Chains that
    occur only in malicious corpora are treated as signatures per [A Novel Approach to Detect Malware Based
    on API Call Sequence Analysis](https://journals.sagepub.com/doi/full/10.1155/2015/659101).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 7
  - 'NAI: All Endpoints, Domain Controllers, Servers hosting security agents or management consoles'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "observed = ordered_api_sequence(PID) from Sysmon7/module-load + calls\nfor sig in malicious_only_api_chains:\n\
      \  if local_sequence_alignment(observed, sig).score > threshold: alert"
- question: Is a successful high-reputation DNS lookup and connection (a connectivity canary) immediately
    followed within 30 seconds by a DNS query/connection to a low-reputation or newly-registered domain,
    or does a canary lookup return NXDOMAIN and then a payload is retrieved?
  context: Malware often verifies real internet connectivity by hitting a known-good domain (google.com,
    microsoft.com) before reaching out to attacker infrastructure; a sandbox failing the canary lets the
    payload abort. A stateful rule per source IP correlating the high-reputation success with a subsequent
    low-reputation contact (or an NXDOMAIN canary followed by a fetch) captures this network guardrail.
    Under Stealth the canary blends into normal traffic, so the reputation transition is the signal. A
    match warrants pivoting on the low-reputation domain for C2 scoping.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Network Egress/Ingress Points, DNS Servers, Web Proxies, All Endpoints'
  range: 'Last 90 days (event-centered: +/-2 min correlation window)'
  queries:
  - technology: Zeek/pseudocode
    query: "per src_ip ordered by ts:\nif dns.log lookup of high_rep_domain succeeds AND conn.log success\n\
      \   THEN within 30s dns.log lookup of (low_rep OR newly_registered) domain -> alert\nif dns.log\
      \ canary returns NXDOMAIN THEN payload retrieval follows -> alert"
- question: Across a host's outbound contacts, does the domain reputation score drop by more than 80 points
    within 60 seconds, or does a successful canary precede a low-reputation fetch alongside an elevated
    NXDOMAIN/failed-connection rate?
  context: Scoring each contacted domain 0-100 and tracking the drop between consecutive contacts quantifies
    the good-then-bad pivot characteristic of a network guardrail, while jointly tracking the per-host
    NXDOMAIN/failed-connection rate captures canaries that fail. Flagging an >80-point decline within
    60 seconds (or a successful canary before a low-reputation fetch) is robust to specific domains. For
    the Stealth tactic this exposes the deliberate transition from benign-looking validation to malicious
    retrieval. A positive result should drive enrichment of the low-reputation domain and host scoping.
    Lexical/entropy and failure-rate (NXDOMAIN) reasoning follows [Real-Time Detection of DNS Exfiltration
    and Tunneling from Enterprise Networks](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Network Egress/Ingress Points, DNS Servers, Web Proxies, All Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'score(domain) in [0,100] via reputation/lexical/entropy

      for consecutive contacts per host: drop = score[i] - score[i+1]

      track per-host NXDOMAIN_rate, failed_conn_rate

      alert if drop > 80 within 60s OR (successful_canary precedes low_rep_fetch with elevated NXDOMAIN_rate)'
- question: Do a host's network interaction sequences (domain, port, protocol, response_state tuples)
    contain low-probability transitions that a model of normal behavior would not expect?
  context: 'Training an HMM or LSTM autoencoder on Zeek-derived sequences of (domain, port, protocol, response_state)
    tuples learns normal connection transitions; a connectivity-canary-then-C2 guardrail produces improbable
    transitions. This unsupervised method catches novel canary/C2 pairs without reputation lists. Under
    Stealth it models the baseline so the deviation stands out. Reporting the top-3 improbable transitions
    lets the analyst see the exact suspicious hop and pivot to investigate it. HMM sequence-anomaly grounding
    is from [Detecting Intrusions Using System Calls: Alternative Data Models](https://ieeexplore.ieee.org/document/766910);
    LSTM log-sequence modeling from [DeepLog: Anomaly Detection and Diagnosis from System Logs through
    Deep Learning](https://doi.org/10.1145/3133956.3134015).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Network Egress/Ingress Points, DNS Servers, Web Proxies, All Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
