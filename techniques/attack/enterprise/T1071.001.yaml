  - technology: EDR/SIEM correlation pseudocode
    query: JOIN Sysmon_3(dst_port IN 80,443) TO Sysmon_22 ON host WHERE delta<=5s AND dga_domain(entropy>3.5,
      len>12, no_dictionary_words, registered<30d); CAPTURE image, cmdline, parent, queried_domain, resolved_ip.
- question: Which HTTP requests show simultaneously rare User-Agents, high URI entropy, and novel URI
    path-token structure relative to per-host and enterprise baselines?
  context: Custom implants often use odd user agents, encoded paths, and low-frequency URI structures
    rather than obvious malware signatures. Build per-host and enterprise-wide rolling 30-day baselines
    of HTTP User-Agent strings and URI path-token sets from Zeek http.log. For each new request compute
    UA prevalence (count of hosts using the same UA; flag below 1st percentile), URI Shannon entropy (flag
    above 95th percentile), and URI path-token novelty as cosine distance from the host's typical path-token
    TF-IDF vector (flag above 99th percentile), alerting when all three thresholds exceed simultaneously.
    Apply a minimum baseline volume of 1000 requests per host before alerting. Also track failure rate
    (4xx/5xx); high failure with a rare UA is a distinct C2-probe signal.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network sensors at internet egress points; DNS resolvers; Web proxies.'
  range: Last 90 days, with rolling 30-day rarity baselines and a 1000-request-per-host minimum.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline UA + uri_path_tokens per host AND enterprise OVER 30d; FLAG request when ua_prevalence<p1
