- question: Are any hosts showing an abnormal POST-to-GET ratio with large POST bodies, or high POST error
    rates, that suggest data staging or failed exfiltration over HTTP?
  context: 'Method imbalance is a practical indicator of web-based staging because malicious implants
    rely heavily on POST while normal browsing is mixed. Compute per-host HTTP method usage over 7-day
    windows and flag hosts whose POST-to-GET ratio exceeds the fleet 99th percentile AND whose mean POST
    body size exceeds the 95th percentile, indicating staging or exfiltration via POST. Add the error-rate
    dimension: if more than 30% of POST requests return 4xx/5xx, elevate priority because per Failure
    Mode Awareness failed exfiltration (dead drops, rotated infrastructure) is a louder signal than successful
    transfers. Suppress known upload-heavy applications (cloud backup, CI/CD) via allowlist. Development
    environments with API-heavy workflows may need the 99.5th percentile.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Network sensors at internet egress points; Web proxies with full packet capture or deep logging
    capabilities.'
  range: Last 90 days, with rolling 7-day method baselines and hourly error-rate checks.
  queries:
  - technology: SIEM/Stats pseudocode
    query: GROUP BY host OVER 7d => post_get_ratio, mean_post_body_size, post_error_rate; FLAG when post_get_ratio>=fleet_p99
      AND mean_post_body_size>=fleet_p95; ELEVATE if post_error_rate>0.30; SUPPRESS upload_allowlist.
- question: Does reconstruction-error scoring, enriched with graph relationships, identify HTTP requests
    whose URI, headers, methods, and byte patterns do not fit the normal request population?
  context: Autoencoder analysis is appropriate when encrypted or custom web traffic hides meaning but
    still leaves unusual structural features. Train an autoencoder on feature vectors from normal HTTP
    requests (URI length, URI Shannon entropy, parameter count, header count, one-hot method, response
    status, User-Agent category, orig_bytes, resp_bytes, duration) and flag requests with reconstruction
    error above the 99th percentile of the validation set. Cluster high-error requests with DBSCAN to
    surface repeated C2-like patterns (identical URI structures, consistent timing). Model traffic as
    graphs (source nodes, destination nodes, request edges) and apply GNN-based classification, which
    has achieved about 98% accuracy; self-supervised contrastive learning on flow-level statistical features
    enables anomaly detection without labels for encrypted payloads. Output reconstruction-error magnitude
    and top-3 anomalous features. The hard URI-length, byte-ratio, and entropy rules remain the floor.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Network sensors at internet egress points; Web proxies with full packet capture or deep logging
    capabilities.'
  range: Last 90 days for training and validation, with current requests scored as they arrive.
  queries:
  - technology: ML pipeline pseudocode
    query: features = encode_http_request(uri_len, uri_entropy, param_count, header_count, method_onehot,
      status, ua_category, orig_bytes, resp_bytes, duration); recon_error = autoencoder.score(features);
      FLAG > p99; cluster = dbscan(high_error); ENRICH gnn(graph(src,dst,request_edges)); OUTPUT recon_error,
      cluster_id, top_features.
- question: Do any DNS queries whose resolved answers are then contacted over HTTP/S within 10 minutes
    match curated DGA pattern feeds, and which process performed the resolution?
  context: DGA-feed matching catches adversaries who rotate algorithmically generated domains for resilient
    C2. For each Zeek dns.log query whose answer is contacted via conn.log/http.log/ssl.log within a 10-minute
    window, match the queried domain against curated DGA feeds (Bambenek, Andrey Abakumov, internal detector
    outputs) and alert on matches, capturing the resolving process via correlation with Sysmon Event ID
    22 (DnsQuery) on the originating host. Suppress vendor-allowlisted dynamic-DNS infrastructure. Use
    SigmaHQ dns_query_win_dga_domains.yml as a baseline. A positive result that ties a DGA domain to a
    live web session and a specific process is high-confidence; pivot to the process tree for scoping.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
