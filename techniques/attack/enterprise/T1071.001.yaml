  queries:
  - technology: SIEM/Behavior-chain pseudocode
    query: CORRELATE beacon(src,dst) WITH (any conn orig_bytes>5MB OR cumulative orig_bytes to dst>50MB)
      WITHIN 24h; ALERT C2_with_staging; SUPPRESS cloud_backup_allowlist; OUTPUT beacon_period, beacon_count,
      high_volume_uids, originating_process(Sysmon_3).
- question: Does any host process initiating outbound HTTP/S within 5 seconds of a DNS query to a DGA-characteristic
    domain reveal a process-to-DGA co-occurrence?
  context: Tying a web-capable process directly to a DGA domain resolution within a tight window provides
    strong attribution for which binary is driving the C2. Alert when a host process initiating outbound
    HTTP/S (Sysmon Event ID 3, destination port 80/443) is correlated with a DNS query (Sysmon Event ID
    22) whose queried domain has DGA characteristics (entropy over 3.5, length over 12 characters, no
    dictionary words, registered under 30 days), with the correlation occurring within 5 seconds. Capture
    process image, command line, parent process, queried domain, and resolved IP. A positive result is
    high-fidelity because it links endpoint execution, name resolution, and outbound web activity into
    one causal chain.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
