    query: 'FOR dns IN Zeek_dns WHERE answer contacted via conn/http/ssl WITHIN 10m: MATCH dns.query AGAINST
      dga_feeds (bambenek, abakumov, internal); ALERT on match; CORRELATE Sysmon_22 ON host TO capture
      resolving_process; SUPPRESS dyn_dns_allowlist.'
- question: Can we confirm a host is running a combined C2-with-staging channel by correlating beaconing
    to a destination with a large or cumulative upload to that same destination within 24 hours?
  context: Some of the most important cases are not just beacons but complete C2 channels that also move
    data, which directly supports containment and scoping. Correlate (a) beaconing detection (regular
    intervals from the beacon rules) for a (source, destination) pair AND (b) at least one connection
    in the same 24-hour window with orig_bytes over 5MB OR cumulative orig_bytes to that destination over
    50MB, and alert on the combination as a high-confidence C2-with-staging pattern. Suppress known cloud-backup
    destinations via an explicit allowlist. Output the beacon period, beacon count, the high-volume connection
    UIDs, and the originating process (correlated via Sysmon Event ID 3) so the analyst can build one
    timeline for the case.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
