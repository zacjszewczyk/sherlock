name: 'T1071.001: Web Protocols'
id: 2c56e8bd-e965-452d-834b-d080c4ca23e8
description: Investigate command-and-control activity hidden inside normal-looking HTTP, HTTPS, and WebSocket
  traffic, where adversaries embed commands and results in protocol fields to blend with expected web
  traffic. This playbook helps an analyst hunt malicious destination matches from threat intelligence,
  DNS-to-web correlation, known C2 framework fingerprints (User-Agent, URI, JA3/JA4, certificates), Host/SNI
  mismatches and domain fronting, fixed-interval and low-variance beaconing, spectral periodicity, suspicious
  process-to-network chains and LOLBin initiators on endpoints, HTTP payload anomalies and upload-heavy
  staging, DGA-like destinations, and rare or high-entropy web artifacts. It combines deterministic floor
  rules, statistical baselining, and machine-learning models so analysts can expose adversaries blending
  C2 and exfiltration into common web protocols across network, endpoint, and DNS telemetry.
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command And Control
contributors:
- Zachary Szewczyk
created: '2026-02-18'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any outbound HTTP or HTTPS sessions reach a destination IP, HTTP Host, TLS SNI, or certificate
    hash that matches curated command-and-control threat intelligence, with corroborating DNS resolution
    to that destination?
  context: For Command and Control over web protocols, the fastest defensible answer is whether a host
    is already talking to infrastructure tied to known malware or operator tooling. Join Zeek conn.log
    with http.log and ssl.log on uid for outbound TCP 80/443 and match resp_h, host, server_name, and
    cert_chain_fuids against curated C2 IP/domain/cert-hash feeds, suppressing approved security-testing
    ranges and corporate SaaS allowlists. This deterministic floor rule fires independently of any model
    and catches the majority of commodity C2 frameworks using default or known infrastructure. A positive
    result with full session context (uid, timestamps, byte counts, duration) is high-confidence and warrants
    immediate triage; a negative result does not exonerate the host because tailored actors rotate infrastructure.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network sensors at internet egress points; DNS resolvers; Web proxies.'
  range: Last 90 days, prioritizing the most recent 24 hours of outbound TCP 80/443 activity.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN conn, http, ssl ON uid WHERE resp_p IN (80,443); MATCH conn.resp_h, http.host, ssl.server_name,
      ssl.cert_chain_fuids AGAINST c2_intel_feeds; SUPPRESS approved_testing_ranges, saas_allowlist; RETURN
      uid, src, dst, host, sni, cert_hash, ts, orig_bytes, resp_bytes, duration.
- question: Which DNS lookups are followed within 10 minutes by HTTP or HTTPS connections to the resolved
    address, especially when the domain matches C2 intelligence, is newly registered, or shows DGA-like
    entropy?
  context: Chaining DNS to subsequent web sessions confirms that a suspicious name actually led to a live
    C2 channel rather than passive noise, and it suppresses false positives from shared hosting where
    many domains map to one IP. Correlate dns.log answers to conn.log resp_h within a 10-minute window
    and flag when the resolved domain matches known C2 intelligence, has a registration age under 30 days
    (via passive DNS enrichment), or has Shannon entropy above 3.5 for the second-level domain. Requiring
    the DNS-to-connection linkage before alerting keeps fidelity high. A positive result indicates disposable
    adversary infrastructure being actively used for control; analysts should pivot to the resolving host
    and process.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network sensors at internet egress points; DNS resolvers; Web proxies.'
  range: Last 90 days, using 10-minute DNS-to-HTTP/S correlation windows.
  queries:
  - technology: SIEM/Temporal correlation pseudocode
    query: dns = Zeek_dns WITH registration_age, sld_entropy, intel_tags; web = Zeek_conn JOIN http,ssl;
      LINK dns->web WHEN dns.answers CONTAINS web.resp_h AND web.ts BETWEEN dns.ts AND dns.ts+10m; FLAG
      intel_match OR registration_age<30d OR sld_entropy>3.5.
- question: Are there rare destination domains that were first seen in the last 7 days and that also exhibit
    high HTTP error or TLS handshake failure rates consistent with dead or rotated C2 infrastructure?
  context: Rare-prevalence analysis catches adversary infrastructure that is not yet on a block list but
    is contacted by very few internal systems. For each destination domain in http.host or ssl.server_name,
    compute enterprise prevalence (count of unique internal source IPs) and first-seen timestamp over
    a rolling 30-day window, and flag domains in the bottom 1st percentile of prevalence that are also
    newly observed within 7 days and absent from the business allowlist. Per Failure Mode Awareness, also
    compute the per-destination error rate (HTTP 4xx/5xx or TLS handshake failures); rarity combined with
    a failure rate above 50% is a distinct signal of probing dead C2 infrastructure. Pivot flagged domains
    to their conn.log sessions with source IP, timestamps, and byte counts. Tune the percentile to environment
    size (larger fleets may use 0.5th percentile).
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network sensors at internet egress points; DNS resolvers; Web proxies.'
  range: Last 90 days, with rolling 30-day prevalence baselines and 7-day first-seen checks.
  queries:
  - technology: SIEM/Stats pseudocode
    query: GROUP BY destination_domain OVER 30d => unique_src_count, first_seen, http_error_rate, tls_failure_rate;
      FLAG domains in bottom_1_percentile(prevalence) AND first_seen<=7d AND failure_rate>0.50 AND NOT
      allowlisted; PIVOT to conn sessions.
- question: Does a supervised destination classifier score any outbound web session as highly likely C2
    based on domain, TLS, ASN, certificate, and HTTP behavior features?
  context: Machine learning lets the analyst combine weak indicators that individually do not justify
    a deterministic alert, such as certificate age, JA4/JA4S fingerprints, ASN reputation, certificate
    self-signed flag, HTTP method ratios, and TLS-handshake packet-size statistics. Train a Gradient Boosted
    Trees or Random Forest model on labeled benign destinations and confirmed C2 endpoints, score new
    sessions, and alert when probability exceeds a tuned threshold (start at 0.9, validated with precision-recall
    curves). Packet-size features alone have achieved over 93% accuracy for C2 traffic under TLS 1.3.
    Require SHAP top-3 feature attribution in the alert so analysts see the specific drivers (for example
    self-signed cert, bulletproof ASN, domain entropy 4.2) rather than a raw score. The deterministic
    intel and rarity rules remain the floor beneath this model.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network sensors at internet egress points; DNS resolvers; Web proxies.'
  range: Last 90 days for feature extraction, with model scoring on current outbound sessions.
  queries:
  - technology: ML pipeline pseudocode
    query: features = build_web_c2_features(domain_len, domain_entropy, dst_asn, cert_age, self_signed,
      ja4, ja4s, post_get_ratio, tls_handshake_pkt_sizes); score = gbt_model.predict_proba(features);
      ALERT if score>=0.90; OUTPUT top_shap_3, uid, src, dst.
- question: Do any HTTP User-Agent strings, URIs, JA3/JA3S/JA4/JA4S fingerprints, or TLS certificates
    directly match known web-based C2 framework signatures?
  context: Many operators reuse default or lightly modified profiles for Cobalt Strike, Metasploit, Sliver,
    Havoc, and Mythic, so signature coverage remains high value. Scan http.user_agent and http.uri with
    a maintained regex library for known framework profiles and match ssl.ja3/ja3s against known-malicious
    fingerprint hashes. Extract JA4/JA4S where available because JA4+ is resilient to the TLS extension
    randomization that degrades JA3 in modern browsers, and match certificates with YARA rules for Cobalt
    Strike beacons. Generate a high-confidence alert with the matched pattern name and raw field values
    so the analyst can validate immediately. Signature-based detection achieves roughly 90% on default
    profiles, but a clean result does not rule out a customized profile.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network sensors at internet egress points; Web proxies; Endpoint Detection and Response (EDR)
    agents.'
  range: Last 90 days, with continuous matching on newly ingested HTTP/TLS telemetry.
  queries:
  - technology: SIEM/Signature pseudocode
    query: MATCH http.user_agent, http.uri AGAINST c2_regex_library; MATCH ssl.ja3, ssl.ja3s, ssl.ja4,
      ssl.ja4s AGAINST malicious_fp_hashes; MATCH ssl.certificate AGAINST cobaltstrike_yara; RETURN match_name,
      raw_value, src, dst, host, sni, ts.
- question: Which sessions show an HTTP Host header that does not match the TLS SNI, or an empty/odd User-Agent
    paired with C2-like callback URI structure?
  context: A mismatch between http.host and ssl.server_name is a classic domain-fronting indicator and
    can also reveal operator mistakes in implant profiles. For sessions where both fields are populated,
    flag where they differ, and also flag sessions where the User-Agent is empty, a single character,
    or matches no known browser AND the URI matches known C2 callback paths (short alphanumeric paths,
    predictable checksum-based URIs). Elevate severity when paired with JA3/JA4 fingerprints absent from
    the organizational baseline or with a self-signed certificate. Include both Host and SNI values in
    the alert for immediate context. Benign proxy and CDN edge cases exist, so review the artifacts together
    rather than alerting on a mismatch alone.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network sensors at internet egress points; Web proxies; Endpoint Detection and Response (EDR)
    agents.'
  range: Last 90 days, emphasizing recent sessions with both HTTP and TLS metadata present.
  queries:
  - technology: SIEM/Rule pseudocode
    query: SELECT sessions WHERE http.host IS NOT NULL AND ssl.server_name IS NOT NULL AND http.host !=
      ssl.server_name; ELEVATE if user_agent empty_or_single_char OR uri MATCHES c2_callback_pattern OR
      cert self_signed OR ja4 NOT IN baseline; RETURN host, sni, uri, user_agent, ja4.
- question: Are rare JA3 or JA4 fingerprints contacting equally rare destinations or using anomalous HTTP
    method profiles outside the enterprise baseline?
  context: When an adversary uses a custom client that avoids known signatures, it often still looks uncommon
    in the environment. For each JA3 hash (and JA4 where available), compute organizational prevalence
    as the count of distinct internal hosts using that fingerprint over a 14-day rolling window, and flag
    fingerprints below the 1st percentile that also pair with low-prevalence SNI/Host values (bottom 1%
    of domains) or anomalous method profiles (POST-only with no GET, or exclusive uncommon methods). Exclude
    known legitimate applications via allowlist. Because JA3 instability from TLS extension permutation
    is now common, compute JA4 prevalence in parallel where sensor support exists. Small environments
    (<500 hosts) may need the 5th percentile to avoid alert fatigue.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network sensors at internet egress points; Web proxies; Endpoint Detection and Response (EDR)
    agents.'
  range: Last 90 days, with rolling 14-day fingerprint prevalence baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: GROUP BY ja3_or_ja4 OVER 14d => distinct_hosts, destination_prevalence, method_profile; FLAG
      fingerprints in bottom_1_percentile that contact bottom_1_percentile destinations OR show post_only_or_uncommon_methods;
      EXCLUDE app_allowlist.
- question: Do HTTP and TLS feature outliers cluster into repeated suspicious profiles that do not resemble
    baseline browser or sanctioned-application traffic?
  context: Isolation-based anomaly detection surfaces unknown C2 profiles that recur across hosts or over
    time without relying on a static signature set. Embed HTTP header features (User-Agent token frequency,
    method), URI features (length, path depth, Shannon entropy, parameter count), and TLS features (JA4
    hash, certificate issuer, certificate validity period) into a vector, train an Isolation Forest on
    30 days of baseline browser traffic, and flag sessions in the top 1% anomaly score. Cluster flagged
    outliers with DBSCAN to surface consistent C2-like profiles such as identical repeated patterns from
    the same source. Isolation Forest outperforms autoencoders for zero-day network detection. Output
    the top-3 anomalous features via SHAP; the deterministic fingerprint signatures remain the floor.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network sensors at internet egress points; Web proxies; Endpoint Detection and Response (EDR)
    agents.'
  range: Last 90 days, trained on a 30-day baseline of normal browser traffic.
  queries:
  - technology: ML pipeline pseudocode
    query: features = vectorize(ua_token_freq, method, uri_len, uri_depth, uri_entropy, param_count, ja4,
      cert_issuer, cert_validity); anomaly = isolation_forest.score(features); FLAG top_1_percent; cluster
      = dbscan(flagged); OUTPUT anomaly_score, cluster_id, top_shap_3.
- question: Which source-destination pairs on ports 80 or 443 show fixed-interval beaconing (10+ connections
    within a tight jitter band) that persists across at least three consecutive hourly windows, including
    high failure rates suggesting dead C2 polling?
  context: Fixed-interval polling is one of the strongest behavioral indicators of web C2 because many
    implants check in on predictable schedules. For each (source IP, destination IP, destination port)
    tuple where port is 80 or 443, collect connection timestamps and detect sequences of 10+ connections
    whose inter-arrival times fall within a tight band (for example 60s +/- 2s), alerting when the pattern
    persists across at least three consecutive 1-hour windows and the destination is not on the approved
    updater/telemetry allowlist. Per Failure Mode Awareness, also flag when more than 30% of connections
    return conn_state REJ or S0 (no response), indicating probing of dead infrastructure. Include source,
    destination:port, beacon interval, jitter range, session count, and failure rate in the alert.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network sensors at internet egress points; Host-based firewalls; Netflow collectors.'
  range: Last 90 days, scored in rolling 1-hour windows and confirmed across at least three consecutive
    windows.
  queries:
  - technology: SIEM/Time-series pseudocode
    query: 'FOR each src,dst,dst_port IN (80,443): collect timestamps; FLAG if >=10 conns fit interval
      +/- jitter AND persists across 3 consecutive 1h windows AND dst NOT IN updater_allowlist; CALC failure_rate(conn_state
      IN [REJ,S0]); ELEVATE if failure_rate>0.30; RETURN src, dst:port, interval, jitter, count, failure_rate.'
- question: Do any web session pairs show simultaneously low variance in both inter-arrival timing and
    transferred byte sizes compared with normal enterprise traffic?
  context: Human browsing is noisy, but beaconing malware tends to produce very regular connection timing
    and payload sizes. For each (source, destination, destination port) tuple, compute the coefficient
    of variation (CV) of both inter-arrival times and orig_bytes over sliding 1-hour windows and flag
    pairs where both CVs fall below the 5th percentile simultaneously. Also compute Bowley skewness of
    the inter-arrival distribution; values near zero indicate symmetric machine-generated timing. Combining
    Median Absolute Deviation, CV, and Bowley skewness into a composite score above 0.85 is operationally
    effective. Requiring both dimensions reduces false positives from benign periodic jobs with variable
    payloads or noisy SaaS syncs. Suppress known telemetry via allowlist; heavy-polling environments may
    need the 3rd percentile.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network sensors at internet egress points; Host-based firewalls; Netflow collectors.'
  range: Last 90 days, using sliding 1-hour windows and 30-day baseline percentiles.
  queries:
  - technology: SIEM/Stats pseudocode
    query: GROUP BY src,dst,dst_port,1h_window => cv_interarrival, cv_orig_bytes, bowley_skew; FLAG when
      cv_interarrival<p5 AND cv_orig_bytes<p5 AND abs(bowley_skew) near 0; SUPPRESS telemetry_allowlist.
- question: Which web communication pairs exhibit strong spectral periodicity corresponding to realistic
    C2 polling intervals between 1 second and 24 hours?
  context: Frequency-domain analysis catches periodic communication even when the interval is not perfectly
    constant. Apply a Discrete Fast Fourier Transform to connection timestamps per (source, destination)
    pair to move from the time domain to the frequency domain, identify dominant frequency peaks, and
    prioritize pairs whose peak power exceeds the 99th percentile of background traffic periodicity AND
    whose period falls between 1 second and 24 hours (the typical C2 range). Apply a Lomb-Scargle periodogram
    for unevenly sampled sequences where connections are missed or dropped. Combining autocorrelation
    with Lomb-Scargle on single-flow series has achieved F1=0.90 across 61 traffic types. Present the
    dominant period, spectral power, and session volume for analyst triage.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network sensors at internet egress points; Host-based firewalls; Netflow collectors.'
  range: Last 90 days, with rolling 7-day to 30-day periodicity scoring windows.
  queries:
  - technology: Analytics pseudocode
    query: series = build_connection_time_series(src,dst); fft = dfft(series); lomb = lomb_scargle(series);
      FLAG if dominant_power>=p99(background) AND dominant_period BETWEEN 1s AND 24h; RETURN period, power,
      session_volume.
- question: Does sequence-based time-series modeling identify any source-destination pairs as likely web
    beacons even when interval jitter is intentionally varied?
  context: A sequence model captures more subtle beacon behavior than fixed-threshold rules, especially
    when the adversary adds jitter or varies payload size to evade classic detection. Model each (source,
    destination) pair as a time series of connection timestamps and byte counts and train an LSTM-based
    sequence model on labeled benign periodic services (updates, telemetry, health checks) and confirmed
    C2 beacon sequences; transformer-based models capture temporal dependencies for variable-jitter beacons.
    For environments lacking labeled C2 data, use an unsupervised CT-HMM approach that has achieved roughly
    4x better precision than statistical baselines. Alert output must include the detected period, jitter
    estimate, byte-size profile, and top-3 SHAP contributors. The deterministic DFFT and CV rules remain
    the floor.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network sensors at internet egress points; Host-based firewalls; Netflow collectors.'
  range: Last 90 days for historical feature extraction, with active scoring on current flow sequences.
  queries:
  - technology: ML pipeline pseudocode
    query: seq = build_time_series(src,dst,[timestamps,byte_counts]); beacon_score = lstm_or_cthmm.predict(seq);
      ALERT when score>threshold; OUTPUT estimated_period, jitter, byte_profile, top_shap_3.
- question: Is any outbound web connection on port 80 or 443 being initiated by a process that is not
    an approved web client or that runs from a user-writable path such as %TEMP%, %APPDATA%, C:\Users\Public,
    or Downloads?
  context: A suspicious destination becomes far more important when the connection is launched by a LOLBin,
    an unapproved binary, or an executable in a writable location. Correlate Sysmon Event ID 3 (network
    connection to destination port 80/443) with the originating process from Sysmon Event ID 1 or Windows
    Event ID 4688 and alert when the Image is not in an approved web-client allowlist (browsers, sanctioned
    update agents, approved tools) OR the Image path is under user-writable directories. This deterministic
    rule catches common LOLBin C2 initiators such as rundll32.exe, mshta.exe, regsvr32.exe, and certutil.exe
    from non-standard paths. Include process name, full path, parent, command line, destination IP:port,
    and timestamp. mshta.exe spawning rundll32.exe or regsvr32.exe with subsequent network activity is
    a high-fidelity payload-delivery indicator.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers; Domain Controllers (for security log aggregation).'
  range: Last 90 days, focusing on process launches joined to outbound 80/443 traffic within minutes.
  queries:
  - technology: EDR/SIEM correlation pseudocode
    query: JOIN Sysmon_3 TO Sysmon_1_or_4688 ON process_guid_or_pid WHERE dst_port IN (80,443); FLAG if
      Image NOT IN approved_web_clients OR Image_path IN [%TEMP%,%APPDATA%,C:\Users\Public,Downloads];
      RETURN image, path, parent, cmdline, dst_ip:port, ts.
- question: Which outbound 80/443 connections are started by unsigned or invalidly signed binaries, or
    by processes whose parent is an Office application, script host, or known LOLBin?
  context: Unsigned execution and suspicious parentage frequently expose delivery and staging chains that
    a network-only view misses. Flag processes initiating outbound 80/443 where the binary is unsigned
    or has an invalid/expired Authenticode signature per Sysmon Event ID 1, OR the parent is an Office
    app (WINWORD.EXE, EXCEL.EXE, POWERPNT.EXE), a script host (wscript.exe, cscript.exe, powershell.exe),
    or a known LOLBin (mshta.exe, certutil.exe, bitsadmin.exe). Enrich the alert with the corresponding
    Zeek conn.log session (matched on destination IP and timestamp window) for full network context including
    bytes transferred, duration, and TLS fingerprint. Understanding whether a binary should make network
    connections and its expected execution path is key to keeping false positives low.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers; Domain Controllers (for security log aggregation).'
  range: Last 90 days, with emphasis on recent unsigned or Office-spawned web-capable processes.
  queries:
  - technology: EDR/SIEM correlation pseudocode
    query: SELECT process_network_events WHERE dst_port IN (80,443) AND (signature_invalid_or_unsigned
      OR parent IN [WINWORD.EXE,EXCEL.EXE,POWERPNT.EXE,wscript.exe,cscript.exe,powershell.exe,mshta.exe,certutil.exe,bitsadmin.exe]);
      ENRICH WITH Zeek_conn ON dst_ip AND time_window; RETURN process, signer, parent, cmdline, bytes,
      duration, ja_fp.
- question: Do any rare parent-child process pairs generate web connections in ways that are both fleet-rare
    and locally novel for the affected host, or that fan out to many destinations?
  context: 'Fleet rarity catches unusual execution chains that are easy to miss when looking at one endpoint
    in isolation. Over a 30-day rolling window per host, build frequency baselines of (ParentImage, Image)
    pairs that initiate HTTP/S connections via Sysmon Event ID 3, compute rarity as inverse document frequency
    across the fleet, and flag connections where the pair is in the bottom 1st percentile OR the file
    path has never been seen on that host. Also flag command-line length above the 98th percentile or
    Shannon entropy above 4.5 (obfuscation/encoded payloads). Enforce a volume constraint: flag when the
    initiating process makes more than 50 outbound connections to different destinations in one hour,
    indicating scanning or multi-C2 check-in regardless of rarity. Recalculate baselines weekly because
    new software can spike false positives.'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers; Domain Controllers (for security log aggregation).'
  range: Last 90 days, with rolling 30-day fleet baselines and 1-hour connection fan-out checks.
  queries:
  - technology: EDR/Stats pseudocode
    query: baseline = idf(parent_image,image) OVER 30d fleetwide; FLAG when pair in bottom_1_percentile
      OR image_path first_seen_on_host OR cmdline_len>p98 OR cmdline_entropy>4.5 OR distinct_outbound_dsts>50
      in 1h.
- question: Does a supervised process-to-network classifier mark any outbound web connection as likely
    malicious based on signer, lineage, path entropy, user context, and destination features?
  context: 'This blends endpoint and network evidence into a single risk score that captures suspicious
    combinations no single rule covers. Train a Random Forest or Gradient Boosted Trees model using features
    from joined Sysmon Event ID 1 and Event ID 3 records: process name, code-signer identity, image-path
    entropy, parent process, command-line token count and entropy, user context (SYSTEM vs user), destination
    ASN, destination port, and connection count per hour. Label from confirmed benign process-network
    pairs and known-malicious LOLBin C2 initiations, then alert on classifications above 0.9 probability.
    Combining graph-based relational features (process trees as graphs) with traditional features has
    achieved about 98% accuracy. Output SHAP top-3 features (for example Parent=WINWORD.EXE, unsigned
    binary, path=%TEMP%). The hard LOLBin and unsigned-process rules remain the floor.'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers; Domain Controllers (for security log aggregation).'
  range: Last 90 days for training features, with live scoring of new process-network events.
  queries:
  - technology: ML pipeline pseudocode
    query: features = join_process_and_network(process_name, signer, image_path_entropy, parent, cmdline_tokens,
      cmdline_entropy, user_context, dst_asn, dst_port, conns_per_hour); score = model.predict_proba(features);
      ALERT if score>=0.90; OUTPUT top_shap_3.
- question: Do any HTTP requests or responses show hard-rule payload anomalies such as URIs over 1024
    characters, uncommon methods, client-to-server byte ratios over 10, suspicious user-agents, or repeated
    identical response sizes?
  context: 'Hard-rule payload checks catch overt misuse of web protocols for staging or exfiltration even
    when destination reputation is clean. Create SIEM rules that alert on HTTP requests with: URI length
    over 1024 characters; uncommon methods (PUT, DELETE, PATCH) from non-admin hosts; orig_bytes/resp_bytes
    ratio over 10 where orig_bytes exceeds 1KB (heavy client-to-server upload consistent with staging);
    or missing/single-token User-Agent combined with any of the above. Also flag response patterns such
    as repeated 200 OK with identical resp_bytes (command polling) or sequences of 204 No Content (task-complete
    acks). Because encrypted payload entropy approaches 8 bits/byte, flag unencrypted-channel HTTP payloads
    with entropy above 7.0 (embedded encrypted or base64 C2 data). Include URI, method, byte counts, entropy,
    and User-Agent in alert output.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Network sensors at internet egress points; Web proxies with full packet capture or deep logging
    capabilities.'
  range: Last 90 days, with immediate triage on new matches and a 1-hour review window for repeated status-code
    patterns.
  queries:
  - technology: SIEM/Rule pseudocode
    query: FLAG http WHERE uri_len>1024 OR method IN (PUT,DELETE,PATCH) AND host NOT admin OR (orig_bytes/resp_bytes>10
      AND orig_bytes>1024) OR user_agent missing_or_single_token; ALSO FLAG repeated 200_identical_resp_bytes
      OR 204_sequences OR payload_entropy>7.0 on cleartext.
- question: Which hosts generate compound HTTP anomalies that exceed the 99th percentile across two or
    more features at once, or that move more than 10MB to a single destination within an hour?
  context: 'Requiring several unusual characteristics to align avoids chasing single noisy measurements
    and is especially useful for staged uploads or covert channels that are strange in size, entropy,
    and volume together. Over a 30-day rolling window, baseline per-host distributions of URI length,
    URI Shannon entropy, orig_bytes, resp_bytes, and the orig_bytes/resp_bytes ratio for HTTP sessions,
    and alert when a new request exceeds the 99th percentile on two or more features simultaneously. Per
    the Physics of the Attack principle, enforce a volume floor: flag when cumulative orig_bytes to a
    single destination exceeds 10MB in a 1-hour window regardless of entropy or ratio, because exfiltration
    volume cannot be hidden by padding. Compute percentiles per host-class (workstations vs servers) since
    their distributions differ.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Network sensors at internet egress points; Web proxies with full packet capture or deep logging
    capabilities.'
