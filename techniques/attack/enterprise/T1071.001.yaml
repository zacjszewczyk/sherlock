name: "T1071.001: Web Protocols"
id: "2c56e8bd-e965-452d-834b-d080c4ca23e8"
description: >-
  Investigate command-and-control activity hidden inside normal-looking HTTP,
  HTTPS, and related web traffic. This playbook focuses on malicious destination
  matches, DNS-to-web correlation, framework fingerprints, beacon timing,
  suspicious process-to-network chains, payload anomalies, DGA-like domains, and
  rare or high-entropy web artifacts that can expose adversaries blending C2 and
  exfiltration into common web protocols.
type: "technique"
related:
  - tactic_id: "TA0011"
    tactic_name: "Command And Control"
contributors:
  - "Zachary Szewczyk"
created: "2026-02-18"
modified: "2026-02-18"
version: "1.0"
tags: "none"
questions:
  - question: "Do any outbound HTTP or HTTPS sessions resolve to IPs, hosts, SNI values, or certificates that match curated web C2 intelligence after allowlist suppression?"
    context: >-
      Start with deterministic intelligence correlation because it gives the
      analyst a fast, defensible answer to whether the host is talking to
      infrastructure already associated with known malware or operator tooling.
      Join network sessions and web metadata so the alert includes the actual
      socket, host header, SNI, and certificate evidence needed for rapid triage.
    answer_sources:
      - "Zeek conn.log"
      - "Zeek http.log"
      - "Zeek ssl.log"
      - "Zeek dns.log"
      - "NAI: Network sensors at internet egress points; DNS resolvers; Web proxies."
    range: "Last 90 days, prioritizing the most recent 24 hours of outbound TCP 80/443 activity."
    queries:
      - technology: "SIEM/Correlation pseudocode"
        query: >-
          JOIN conn, http, ssl ON uid WHERE resp_p IN (80,443); MATCH resp_h,
          http.host, ssl.server_name, ssl.cert_hash AGAINST c2_intel;
          SUPPRESS allowlisted SaaS and testing ranges; RETURN uid, src, dst,
          host, sni, cert_hash, orig_bytes, resp_bytes, duration.

  - question: "Which DNS lookups are followed within 10 minutes by HTTP or HTTPS sessions to the resolved address, especially when the domain is newly seen, high-entropy, or intelligence-linked?"
    context: >-
      DNS-to-web chaining reduces false positives from shared hosting and shows
      whether the suspicious name actually led to a live web session. Analysts
      should confirm the resolution path, domain age, and entropy so they can
      distinguish disposable C2 infrastructure from ordinary browsing.
    answer_sources:
      - "Zeek conn.log"
      - "Zeek http.log"
      - "Zeek ssl.log"
      - "Zeek dns.log"
      - "NAI: Network sensors at internet egress points; DNS resolvers; Web proxies."
    range: "Last 90 days, using 10-minute DNS-to-HTTP/S correlation windows."
    queries:
      - technology: "SIEM/Temporal correlation pseudocode"
        query: >-
          dns_hits = Zeek_dns WITH domain_age, entropy, intel_tags; web_hits =
          Zeek_conn/http/ssl; JOIN dns_hits TO web_hits WHEN dns.answers CONTAINS
          conn.resp_h AND web.ts BETWEEN dns.ts AND dns.ts+10m; FLAG intel_match
          OR domain_age<30d OR sld_entropy>3.5.

  - question: "Are there rare destination domains that were first seen recently and also produce abnormal HTTP errors or TLS failures consistent with dead or rotated C2 infrastructure?"
    context: >-
      Rare-prevalence analysis is useful when the adversary is not yet on a block
      list but still communicates with infrastructure that few internal systems
      ever contact. Combine rarity with first-seen timing and failure behavior so
      you can catch both successful C2 and failed check-ins to degraded or burned
      infrastructure.
    answer_sources:
      - "Zeek conn.log"
      - "Zeek http.log"
      - "Zeek ssl.log"
      - "Zeek dns.log"
      - "NAI: Network sensors at internet egress points; DNS resolvers; Web proxies."
    range: "Last 90 days, with rolling 30-day prevalence baselines and 7-day first-seen checks."
    queries:
      - technology: "SIEM/Stats pseudocode"
        query: >-
          GROUP BY destination_domain OVER 30d => unique_src_count, first_seen,
          http_error_rate, tls_failure_rate; FLAG domains in bottom_1_percent
          prevalence AND first_seen<=7d AND failure_rate>0.50; PIVOT to related
          conn sessions.

  - question: "Does supervised destination scoring identify any outbound web sessions as highly likely C2 based on domain, TLS, ASN, and HTTP behavior features?"
    context: >-
      Use machine learning here to combine weak indicators that may not justify a
      deterministic alert on their own, such as certificate age, JA4 features,
      ASN risk, and method ratios. Analysts should review the score with feature
      attribution so the model output is explainable and can be defended during
      escalation.
    answer_sources:
      - "Zeek conn.log"
      - "Zeek http.log"
      - "Zeek ssl.log"
      - "Zeek dns.log"
      - "NAI: Network sensors at internet egress points; DNS resolvers; Web proxies."
    range: "Last 90 days for feature extraction, with model scoring on current outbound sessions."
    queries:
      - technology: "ML pipeline pseudocode"
        query: >-
          features = build_web_c2_features(domain_len, entropy, asn, cert_age,
          self_signed, ja4, ja4s, post_get_ratio, tls_packet_sizes); score =
          model.predict_proba(features); ALERT if score>=0.90; OUTPUT top_shap_3
          plus session identifiers.

  - question: "Do any HTTP headers, URIs, JA3 or JA4 fingerprints, or certificate artifacts directly match known web-based C2 framework signatures?"
    context: >-
      Signature coverage is still valuable because many operators reuse default or
      lightly modified profiles for Cobalt Strike, Sliver, Havoc, Mythic, and
      similar tooling. The analyst should capture the exact matched string or
      fingerprint so the alert is actionable and easy to validate.
    answer_sources:
      - "Zeek http.log"
      - "Zeek ssl.log"
      - "NAI: Network sensors at internet egress points; Web proxies; Endpoint Detection and Response (EDR) agents."
    range: "Last 90 days, with continuous matching on newly ingested HTTP/TLS telemetry."
    queries:
      - technology: "SIEM/Signature pseudocode"
        query: >-
          MATCH http.user_agent, http.uri, ssl.ja3, ssl.ja3s, ssl.ja4, ssl.ja4s,
          ssl.certificate AGAINST known_web_c2_signatures_and_yara; RETURN match
          name, raw value, src, dst, host, sni, timestamp.

  - question: "Which sessions show an HTTP Host header and TLS SNI mismatch or other domain-fronting-like artifacts combined with suspicious user-agent or callback-path structure?"
    context: >-
      Host-versus-SNI mismatches matter because they can indicate domain fronting,
      covert routing, or operator mistakes in a malicious implant profile.
      Analysts should review the header mismatch together with user-agent quality,
      URI shape, and certificate trust so that benign proxy edge cases can be
      separated from genuine suspicious sessions.
    answer_sources:
      - "Zeek http.log"
      - "Zeek ssl.log"
      - "NAI: Network sensors at internet egress points; Web proxies; Endpoint Detection and Response (EDR) agents."
    range: "Last 90 days, emphasizing recent sessions with both HTTP and TLS metadata present."
    queries:
      - technology: "SIEM/Rule pseudocode"
        query: >-
          SELECT sessions WHERE http.host IS NOT NULL AND ssl.server_name IS NOT
          NULL AND http.host != ssl.server_name; ELEVATE if user_agent empty_or_odd
          OR uri MATCHES callback_pattern OR cert self_signed OR ja4 rare.

  - question: "Are rare JA3 or JA4 fingerprints contacting equally rare destinations or using unusual HTTP method patterns that fall outside the enterprise baseline?"
    context: >-
      TLS and client-fingerprint rarity is useful when an adversary uses a custom
      client that avoids known signatures but still looks uncommon in the
      environment. Pair the fingerprint baseline with destination rarity and
      method anomalies so the analyst can prioritize clients that are both rare
      and behaviorally suspicious.
    answer_sources:
      - "Zeek http.log"
      - "Zeek ssl.log"
      - "NAI: Network sensors at internet egress points; Web proxies; Endpoint Detection and Response (EDR) agents."
    range: "Last 90 days, with rolling 14-day fingerprint prevalence baselines."
    queries:
      - technology: "SIEM/Stats pseudocode"
        query: >-
          GROUP BY ja3_or_ja4 OVER 14d => distinct_hosts, common_destinations,
          method_profile; FLAG bottom_1_percent fingerprints that contact
          bottom_1_percent destinations OR show post_only_or_uncommon_methods.

  - question: "Do HTTP and TLS feature outliers cluster into repeated suspicious profiles that do not resemble baseline browser or sanctioned application traffic?"
    context: >-
      Isolation-based clustering helps surface unknown C2 profiles that recur
      across hosts or over time without relying on a static signature set. The
      analyst should inspect the highest-contributing headers, URI attributes, and
      certificate traits for each cluster to determine whether the anomaly is a
      new application rollout or a consistent malicious tradecraft pattern.
    answer_sources:
      - "Zeek http.log"
      - "Zeek ssl.log"
      - "NAI: Network sensors at internet egress points; Web proxies; Endpoint Detection and Response (EDR) agents."
    range: "Last 90 days, trained on a 30-day baseline of normal browser traffic."
    queries:
      - technology: "ML pipeline pseudocode"
        query: >-
          features = vectorize(http_headers, method, uri_len, uri_depth,
          uri_entropy, param_count, ja4, cert_issuer, cert_validity); anomaly =
          isolation_forest.score(features); cluster = dbscan(flagged_outliers);
          OUTPUT anomaly_score, cluster_id, top_shap_3.

  - question: "Which source and destination pairs on ports 80 or 443 show fixed or near-fixed beacon intervals across repeated windows, including failed connections that suggest dead C2 polling?"
    context: >-
      Fixed-interval polling remains one of the strongest behavioral indicators of
      web C2 because many implants check in on predictable schedules. Analysts
      should review interval consistency, jitter, window persistence, and failure
      states to separate benign software update traffic from machine-driven
      command polling.
    answer_sources:
      - "Zeek conn.log"
      - "NAI: Network sensors at internet egress points; Host-based firewalls; Netflow collectors."
    range: "Last 90 days, scored in rolling 1-hour windows and confirmed across at least three consecutive windows."
    queries:
      - technology: "SIEM/Time-series pseudocode"
        query: >-
          FOR each src,dst,dst_port IN (80,443): compute inter_arrivals; FLAG if
          >=10 connections fit interval±jitter AND persists across 3 windows;
          CALCULATE conn_state failure_rate and elevate if >0.30.

  - question: "Do any web session pairs show unusually low variance in both timing and transferred byte counts compared with normal enterprise traffic?"
    context: >-
      Human browsing is noisy, but beaconing malware often produces very regular
      connection timing and payload sizes. This question asks the analyst to test
      both dimensions together so a benign periodic job with variable payloads, or
      a regular SaaS sync with noisy timing, is less likely to trigger interest.
    answer_sources:
      - "Zeek conn.log"
      - "NAI: Network sensors at internet egress points; Host-based firewalls; Netflow collectors."
    range: "Last 90 days, using sliding 1-hour windows and 30-day baseline percentiles."
    queries:
      - technology: "SIEM/Stats pseudocode"
        query: >-
          GROUP BY src,dst,dst_port,window => cv_interarrival, cv_orig_bytes,
          bowley_skew; FLAG when both CV values are below 5th percentile and skew
          is near zero after allowlist suppression.

  - question: "Which web communication pairs exhibit strong spectral periodicity that corresponds to realistic C2 polling intervals between 1 second and 24 hours?"
    context: >-
      Frequency-domain analysis is valuable when the interval is not perfectly
      constant but still periodic enough to indicate automated communication.
      Analysts should compare dominant periods and spectral power against the
      background traffic baseline to determine whether the pair behaves more like
      a beacon than a user-driven browsing pattern.
    answer_sources:
      - "Zeek conn.log"
      - "NAI: Network sensors at internet egress points; Host-based firewalls; Netflow collectors."
    range: "Last 90 days, with rolling 7-day to 30-day periodicity scoring windows."
    queries:
      - technology: "Analytics pseudocode"
        query: >-
          series = build_connection_time_series(src,dst); fft = dfft(series);
          lomb = lomb_scargle(series); FLAG if dominant_power >= p99 background
          AND dominant_period BETWEEN 1s AND 24h; RETURN period, power, volume.

  - question: "Does sequence-based time-series scoring identify any source and destination pairs as likely web beacons even when interval jitter is intentionally varied?"
    context: >-
      A sequence model can capture more subtle beacon behavior than fixed-threshold
      rules, especially when the adversary adds jitter or changes payload size
      slightly to avoid classic detections. Analysts should validate model hits
      using the reported period estimate, jitter characteristics, and the
      strongest explainability features.
    answer_sources:
      - "Zeek conn.log"
      - "NAI: Network sensors at internet egress points; Host-based firewalls; Netflow collectors."
    range: "Last 90 days for historical feature extraction, with active scoring on current flow sequences."
    queries:
      - technology: "ML pipeline pseudocode"
        query: >-
          seq = build_time_series(src,dst,[timestamps,byte_counts]); beacon_score
          = lstm_or_hmm.predict(seq); ALERT when score exceeds threshold; OUTPUT
          estimated_period, jitter, byte_profile, top_shap_3.

  - question: "Are any outbound web connections being initiated by a process that should not normally act as a web client or is executing from a user-writable path?"
    context: >-
      Process-to-network correlation is critical because a suspicious destination
      becomes much more important when it is launched by a LOLBin, script host, or
      executable in `%TEMP%` or another writable location. Analysts should review
      the full process tree and command line so they can distinguish sanctioned
      automation from staged malware execution.
    answer_sources:
      - "Sysmon Event ID 1"
      - "Sysmon Event ID 3"
      - "Windows Event ID 4688"
      - "Windows Event ID 5156"
      - "Zeek conn.log"
      - "NAI: All Windows endpoints and servers; Domain Controllers (for security log aggregation)."
    range: "Last 90 days, focusing on process launches joined to outbound 80/443 traffic within minutes."
    queries:
      - technology: "EDR/SIEM correlation pseudocode"
        query: >-
          JOIN Sysmon_3 TO Sysmon_1_or_4688 ON process_guid_or_pid WHERE dst_port
          IN (80,443); FLAG if image NOT IN approved_web_clients OR image_path IN
          user_writable_dirs; RETURN image, path, parent, cmdline, dst_ip, time.

  - question: "Which outbound web sessions were started by unsigned binaries or by processes with suspicious parent chains such as Office, script hosts, or LOLBins?"
    context: >-
      Unsigned execution and suspicious parentage often expose delivery and
      staging chains that a network-only view misses. The analyst should verify
      signature status, parent lineage, and the matching network session so the
      event can be evaluated as a full intrusion story rather than an isolated
      connection.
    answer_sources:
      - "Sysmon Event ID 1"
      - "Sysmon Event ID 3"
      - "Windows Event ID 4688"
      - "Windows Event ID 5156"
      - "Zeek conn.log"
      - "NAI: All Windows endpoints and servers; Domain Controllers (for security log aggregation)."
    range: "Last 90 days, with emphasis on recent unsigned or Office-spawned web-capable processes."
    queries:
      - technology: "EDR/SIEM correlation pseudocode"
        query: >-
          SELECT process_network_events WHERE dst_port IN (80,443) AND
          (signature_invalid OR parent IN [WINWORD.EXE,EXCEL.EXE,POWERPNT.EXE,
          wscript.exe,cscript.exe,powershell.exe,mshta.exe,certutil.exe,
          bitsadmin.exe]); ENRICH WITH Zeek_conn by dst_ip and time.

  - question: "Do any rare parent-child process pairs generate web connections in ways that are both fleet-rare and locally novel for the affected host?"
    context: >-
      Fleet rarity helps catch unusual execution chains that are easy to miss when
      looking at one endpoint in isolation. Analysts should weigh parent-child
      rarity together with first-seen path, command-line entropy, and connection
      fan-out to determine whether the process is an obscure legitimate tool or a
      suspicious web-capable implant.
    answer_sources:
      - "Sysmon Event ID 1"
      - "Sysmon Event ID 3"
      - "Windows Event ID 4688"
      - "Windows Event ID 5156"
      - "Zeek conn.log"
      - "NAI: All Windows endpoints and servers; Domain Controllers (for security log aggregation)."
    range: "Last 90 days, with rolling 30-day fleet baselines and 1-hour connection fan-out checks."
    queries:
      - technology: "EDR/Stats pseudocode"
        query: >-
          baseline = frequency(parent_image,image) OVER 30d fleetwide; FLAG when
          pair in bottom_1_percent OR image_path first_seen_on_host OR cmdline_len
          >= p98 OR cmdline_entropy>4.5 OR outbound_destinations>50 in 1h.

  - question: "Does supervised process-to-network classification mark any outbound web connections as likely malicious based on signer, lineage, path entropy, user context, and destination features?"
    context: >-
      This question blends endpoint and network evidence into a single risk score
      that can capture suspicious combinations not covered by simple rules. The
      analyst should inspect the model explanation, especially signer identity,
      parent process, writable-path use, and destination context, before deciding
      whether to isolate the host.
    answer_sources:
      - "Sysmon Event ID 1"
      - "Sysmon Event ID 3"
      - "Windows Event ID 4688"
      - "Windows Event ID 5156"
      - "Zeek conn.log"
      - "NAI: All Windows endpoints and servers; Domain Controllers (for security log aggregation)."
    range: "Last 90 days for training features, with live scoring of new process-network events."
    queries:
      - technology: "ML pipeline pseudocode"
        query: >-
          features = join_process_and_network(process_name, signer, image_entropy,
          parent, cmdline_tokens, cmdline_entropy, user_context, dst_asn, dst_port,
          connections_per_hour); score = model.predict_proba(features); ALERT if
          score>=0.90; OUTPUT top_shap_3.

  - question: "Do any HTTP requests or responses show hard-rule payload anomalies such as very long URIs, rare methods, heavy client upload ratios, or suspicious response patterns?"
    context: >-
      Hard-rule payload checks catch overt misuse of web protocols for staging or
      exfiltration even when destination reputation is clean. Analysts should
      review URI length, entropy, method choice, upload ratio, user-agent quality,
      and repeated response codes to understand whether the session looks like a
      scripted callback or operator-driven data movement.
    answer_sources:
      - "Zeek http.log"
      - "Zeek conn.log"
      - "NAI: Network sensors at internet egress points; Web proxies with full packet capture or deep logging capabilities."
    range: "Last 90 days, with immediate triage on new matches and a 1-hour review window for repeated status-code patterns."
    queries:
      - technology: "SIEM/Rule pseudocode"
        query: >-
          FLAG http WHERE uri_len>1024 OR method IN (PUT,DELETE,PATCH) on
          non_admin_hosts OR orig_bytes/resp_bytes>10 AND orig_bytes>1024 OR
          suspicious_user_agent; ALSO FLAG repeated 200_same_size or 204_sequences.

  - question: "Which hosts generate compound HTTP anomalies that exceed high-percentile baselines across multiple features at the same time?"
    context: >-
      Multi-feature outliering helps the analyst avoid chasing single noisy
      measurements by requiring several unusual characteristics to align. This is
      especially useful for identifying staged uploads or covert channels that are
      strange in size, entropy, and volume simultaneously.
    answer_sources:
      - "Zeek http.log"
      - "Zeek conn.log"
      - "NAI: Network sensors at internet egress points; Web proxies with full packet capture or deep logging capabilities."
    range: "Last 90 days, with rolling 30-day per-host baselines and 1-hour cumulative volume checks."
    queries:
      - technology: "SIEM/Stats pseudocode"
        query: >-
          baseline per host over 30d for uri_len, uri_entropy, orig_bytes,
          resp_bytes, byte_ratio; FLAG requests above p99 on >=2 features OR
          cumulative orig_bytes to one destination >10MB in 1h.

  - question: "Are any hosts showing an abnormal POST-to-GET ratio, unusually large POST bodies, or high POST error rates that suggest staging or failed exfiltration over HTTP?"
    context: >-
      Method imbalance is often a practical indicator of web-based staging because
      malicious implants rely heavily on POST while normal browsing is mixed.
      Analysts should compare the host to peers, check whether the application is
      allowlisted, and pay attention to elevated 4xx or 5xx rates that may reveal
      a failing or rotated exfiltration endpoint.
    answer_sources:
      - "Zeek http.log"
      - "Zeek conn.log"
      - "NAI: Network sensors at internet egress points; Web proxies with full packet capture or deep logging capabilities."
    range: "Last 90 days, with rolling 7-day method baselines and hourly error-rate checks."
    queries:
      - technology: "SIEM/Stats pseudocode"
        query: >-
          GROUP BY host over 7d => post_get_ratio, mean_post_body_size,
          post_error_rate; FLAG when post_get_ratio>=fleet_p99 AND
          mean_post_body_size>=fleet_p95 OR post_error_rate>0.30 after allowlists.

  - question: "Does reconstruction-error scoring identify HTTP requests whose URI, headers, methods, and byte patterns do not fit the normal web request population?"
    context: >-
      Autoencoder analysis is appropriate when encrypted or custom web traffic
      hides meaning but still leaves unusual structural features. Analysts should
      examine the highest-error requests and any graph relationships among repeated
      outliers to determine whether the anomaly is isolated noise or a coherent C2
      or exfiltration channel.
    answer_sources:
      - "Zeek http.log"
      - "Zeek conn.log"
      - "NAI: Network sensors at internet egress points; Web proxies with full packet capture or deep logging capabilities."
    range: "Last 90 days for training and validation, with current requests scored as they arrive."
    queries:
      - technology: "ML pipeline pseudocode"
        query: >-
          features = encode_http_request(uri_len, uri_entropy, param_count,
          header_count, method, status, ua_category, orig_bytes, resp_bytes,
          duration); recon_error = autoencoder.score(features); cluster =
          dbscan(high_error_events); OUTPUT recon_error, cluster_id, top_features.

  - question: "Do destination domains contacted over web protocols score as DGA-like when domain features are modeled with a supervised or unsupervised detector?"
    context: >-
      DGA-oriented scoring is useful when the adversary rotates domains rapidly
      and avoids stable infrastructure signatures. Analysts should validate model
      hits by reviewing normalized domain features, recent DNS history, and any
      linked HTTP or TLS sessions before deciding whether the traffic represents
      opportunistic malware or a more tailored intrusion.
    answer_sources:
      - "Zeek conn.log"
      - "Zeek http.log"
      - "Zeek ssl.log"
      - "Zeek dns.log"
      - "NAI: Network sensors at internet egress points; DNS resolvers; Web proxies."
    range: "Last 90 days for model features, with emphasis on domains first seen recently."
    queries:
      - technology: "ML pipeline pseudocode"
        query: >-
          domains = normalize(http.host, ssl.server_name, dns.query); features =
          build_dga_features(length, entropy, ngrams, char_distribution,
          sequence_metrics, first_seen); score = dga_model.predict(domains);
          ALERT on high-risk domains with supporting web sessions.

  - question: "Can we prove that a suspicious web session is functioning as both command-and-control and data movement by correlating beacon behavior with upload-heavy or staged transfer patterns?"
    context: >-
      Some of the most important cases are not just beacons but complete C2
      channels that also move data. Analysts should connect process, timing, byte
      ratio, destination, and repeated callback behavior into one timeline so the
      case can support containment and scoping decisions.
    answer_sources:
      - "Zeek conn.log"
      - "Zeek http.log"
      - "Zeek ssl.log"
      - "Zeek dns.log"
      - "NAI: Network sensors at internet egress points; DNS resolvers; Web proxies."
    range: "Last 90 days, reconstructing 24-hour communication chains around each suspicious destination."
    queries:
      - technology: "SIEM/Behavior-chain pseudocode"
        query: >-
          CORRELATE suspicious web destinations WITH beacon intervals, upload-heavy
          sessions, repeated callbacks, process context, and dns history; FLAG
          chains that include both periodic polling and significant data transfer.

  - question: "Are there rare or high-entropy user-agents and URIs whose frequency, timing, or change rate deviates sharply from the enterprise baseline?"
    context: >-
      Entropy and rarity analysis helps expose custom implants that use odd user
      agents, encoded paths, or low-frequency URI structures instead of obvious
      malware signatures. Analysts should compare the artifact to peers and to the
      host's own history so they can determine whether the traffic is a one-off
      development tool or a sustained covert channel.
    answer_sources:
      - "Zeek conn.log"
      - "Zeek http.log"
      - "Zeek ssl.log"
      - "Zeek dns.log"
      - "NAI: Network sensors at internet egress points; DNS resolvers; Web proxies."
    range: "Last 90 days, with rolling 30-day rarity baselines and recent 24-hour change tracking."
    queries:
      - technology: "SIEM/Stats pseudocode"
        query: >-
          baseline user_agents and uris over 30d for frequency, entropy, timing,
          and change_rate; FLAG artifacts with extreme rarity or z-score shifts,
          especially when tied to suspicious destinations or processes.
