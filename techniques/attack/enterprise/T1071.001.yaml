      requests; TRACK 4xx/5xx rate.
- question: Which external domains exceed 3 sigma on at least three registration- and lookup-pattern features
    at once, indicating DGA-like infrastructure regardless of feed coverage?
  context: 'Statistical anomaly on domain features catches DGA infrastructure even when the domain matches
    no known feed. For each contacted external domain (from dns.log, http Host header, and ssl SNI), compute
