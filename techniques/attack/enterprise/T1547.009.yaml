name: 'T1547.009: Shortcut Modification'
id: 4531ea3e-c708-43c0-848c-7ae69343d464
description: Investigate adversary creation or modification of Windows shortcut files (.lnk/.url) to execute
  code during system boot or user logon for persistence, and the abuse of privileged shortcuts (Public
  Desktop, Administrative Tools, system Start Menu) to hijack execution for privilege escalation. This
  playbook helps an analyst hunt for shortcuts written to user/system Startup folders or other autostart
  locations, deterministically parse the Shell Link binary structure (target path, command-line arguments,
  icon location), and correlate .lnk-launched processes against threat intelligence, LOLBAS abuse patterns,
  obfuscated/padded command lines, masquerading (icon-target mismatch, double extensions, oversized .lnk
  files), anomalous parent-child process lineage, rare network destinations, and downstream privilege-escalation
  events (new admin accounts, privileged-group additions, elevated logons). It combines deterministic
  detection rules, statistical rarity/entropy/deviation scoring, and machine-learning classifiers/graph
  models to surface malicious shortcut activity across endpoint, network, and security-log telemetry.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
