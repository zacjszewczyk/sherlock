questions:
- question: Does any shortcut (.lnk/.url) created or modified in a user or system Startup autostart location
    launch a process whose parsed target hash matches a known-malicious indicator, or whose embedded command-line
    arguments contain an IP or domain present in a threat-intelligence feed?
  context: For persistence, adversaries drop or alter shortcuts in logon/boot autostart locations so their
    payload runs every time the user logs on or the system boots. By deterministically parsing the Shell
    Link binary structure (target path, COMMAND_LINE_ARGUMENTS, ICON_LOCATION) you extract the true execution
    intent that Explorer's UI may hide. Hash the resolved target and compare its SHA256, plus any embedded
    IPs/domains, against curated TI feeds; any match is a high-confidence indicator of a known threat
    establishing a foothold. A positive result ties a startup shortcut directly to known-bad infrastructure
    or malware. Validate writer/lineage shape using Atomic Red Team T1547.009.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 15
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints (User and System Startup Folders), DNS Resolvers, Network Egress Points, Threat Intelligence
    Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  PARSE lnk_target, cmdline_args, icon_location FROM ShellLink(file)\n  WHERE file.path\
      \ IN (user_startup, system_startup) AND file.ext IN (.lnk,.url)\n  | JOIN process_create (Sysmon1\
      \ OR EID4688) ON image=lnk_target\n  | WHERE sha256(lnk_target) IN ti_malicious_hashes\n     OR\
      \ any(extract_ip_domain(cmdline_args)) IN ti_indicators\n  | ALERT"
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log/dns.log: WHERE id.orig_proc IN lnk_launched_processes\n  AND (resp_domain IN\
      \ ti_domains OR id.resp_h IN ti_ips) | ALERT"
- question: Among network destinations contacted by processes launched from startup-folder shortcuts,
    which fall below the 1st-percentile prevalence across the fleet, and which generate NXDOMAIN or blocked/failed
    egress?
  context: A persistence shortcut frequently beacons to attacker infrastructure that is, by definition,
    rare across the enterprise. Score every destination initiated by .lnk-launched processes by fleet-wide
    prevalence and flag those below the 1st percentile, since legitimate startup programs contact common,
    well-known endpoints. Treat NXDOMAIN responses (dead/rotating C2 domains) and blocked or failed egress
    attempts as distinct failure-mode signals that often reveal malware probing for command-and-control.
    Rare destinations combined with resolution failures strongly suggest covert persistence beaconing
    rather than benign autostart behavior.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 15
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints (User and System Startup Folders), DNS Resolvers, Network Egress Points, Threat Intelligence
    Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  dest_prev = count_distinct(host) per destination over fleet/90d\n  FOR conn WHERE src_proc\
      \ IN lnk_launched_processes:\n    IF percentile_rank(dest_prev[dest]) < 1 THEN flag_rare\n  | ALSO\
      \ flag dns_rcode=NXDOMAIN, conn blocked/failed\n  | ALERT rare OR failure_mode"
- question: When the binary targeted by a startup shortcut and its parsed arguments are scored by static
    PE and obfuscated-command-line ML models, which shortcuts receive a high combined maliciousness score?
  context: Unknown payloads that are not yet in TI still exhibit malicious traits. Score the .lnk target
    binary with EMBER static PE features (LightGBM) and the parsed arguments with Mandiant's obfuscated
    command-line classifier, then fuse signed-status, path entropy, argument length, embedded IP/domain
    reputation, and hash rarity into a single maliciousness score. Surfacing the top-3 contributing features
    gives the analyst explainable, triageable reasoning. This catches novel persistence payloads that
    deterministic rules and TI matching miss, supporting investigation even when no known indicator fires.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 15
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints (User and System Startup Folders), DNS Resolvers, Network Egress Points, Threat Intelligence
    Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  feats = EMBER_PE(lnk_target) + cmdline_features(parsed_args)\n         + {signed, path_entropy,\
      \ arg_len, ip_domain_rep, hash_rarity}\n  score = w1*ember_lgbm(feats) + w2*mandiant_clf(args)\n\
      \  IF score > threshold THEN ALERT with top3_shap(feats)"
- question: Did explorer.exe or a startup-folder shortcut launch a known LOLBAS binary with high-risk
    arguments (e.g., powershell -enc / -w hidden, mshta, rundll32, regsvr32) shortly after a .lnk was
    created in a Startup folder?
  context: Adversaries use living-off-the-land binaries to execute malicious code from a benign-looking
    shortcut, evading allowlists. Alert when a startup .lnk (or explorer.exe acting on it) invokes a LOLBAS
    with high-risk patterns such as encoded PowerShell, hidden windows, mshta, rundll32, or regsvr32 close
    in time to a .lnk creation in a startup folder. The temporal pairing of a new startup shortcut with
    LOLBAS abuse is a hallmark of persistence delivery chains. A positive result indicates the shortcut
    is a launcher for fileless or downloaded payloads.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - 'NAI: Endpoints: User Startup Folder (%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup), System
    Startup Folder (C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  lnk_create = FileCreate(Sysmon11) WHERE path IN startup_folders AND ext=.lnk\n  proc\
      \ = ProcessCreate(Sysmon1/EID4688) WHERE parent IN (explorer.exe, lnk_target)\n     AND image IN\
      \ lolbas_list\n     AND cmdline ~ /(-enc|-w hidden|mshta|rundll32|regsvr32)/i\n  WHERE proc.time\
      \ - lnk_create.time < 5m | ALERT"
- question: Was any .lnk or .url file written under a Start Menu Programs Startup folder by a process
    that is not on the installer or Windows-Update allowlist?
  context: Legitimate startup shortcuts are normally created by software installers or OS update mechanisms.
    Any .lnk/.url write to '\Start Menu\Programs\StartUp' by a process outside the installer/Windows-Update
    allowlist is suspicious and is the core persistence event for this technique. Flag script interpreters,
    archive utilities, browsers, Office apps, or user-launched binaries writing startup shortcuts. A positive
    result is a direct indicator of autostart persistence being established and identifies the writer
    process for further pivoting.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - 'NAI: Endpoints: User Startup Folder (%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup), System
    Startup Folder (C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  FileCreate(Sysmon11) WHERE TargetFilename ~ /\\\\Start Menu\\\\Programs\\\\StartUp\\\
      \\.*\\.(lnk|url)$/\n  AND Image NOT IN installer_update_allowlist\n  | ALERT (writer=Image, file=TargetFilename)"
- question: Which LOLBAS executions launched from startup shortcuts have argument entropy above the 98th
    percentile for that binary, or a visible command line padded with whitespace/control characters beyond
    the 260-character Explorer limit?
  context: Attackers obfuscate or hide the real payload behind a startup shortcut. Flag LOLBAS runs whose
    argument entropy exceeds the 98th percentile for that specific binary (>6.8 bits/byte indicates packed/encoded
    content per Lyda & Hamrock) OR whose visible command line contains long runs of whitespace or control
    characters (0x09-0x0D) pushing the real command past Explorer's 260-character UI display limit. Such
    padding is a deliberate evasion to keep the malicious target invisible in the shortcut's properties
    dialog. A positive result reveals concealed persistence payloads.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - 'NAI: Endpoints: User Startup Folder (%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup), System
    Startup Folder (C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  FOR proc WHERE image IN lolbas AND parent_lnk IN startup_folders:\n    ent = shannon_entropy(proc.args)\n\
      \    p98 = percentile(entropy_baseline[image], 98)\n    IF ent > max(p98, 6.8) THEN flag\n    IF\
      \ count(args matches /[\\x09-\\x0D ]{>X}/) AND len(visible_cmd) > 260 THEN flag_padding\n  | ALERT"
- question: Do .lnk-triggered LOLBAS executions form outlier clusters when grouped on argument features
    (length, token mix, entropy, flags), and does their process lineage score as anomalous?
  context: Benign startup LOLBAS usage is repetitive and clusters tightly; malicious usage stands apart.
    Cluster .lnk-triggered LOLBAS runs on argument features (length, token mix, entropy, flag set) and
    alert on outlier/small clusters that deviate from the dominant benign clusters. Corroborate with ProblemChild
    parent-child lineage scoring to confirm anomalous process ancestry. Surface the top contributing features
    so analysts can judge intent. This unsupervised approach catches novel persistence command patterns
    that signature rules miss.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - 'NAI: Endpoints: User Startup Folder (%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup), System
    Startup Folder (C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  X = features(lnk_lolbas_runs): [arg_len, token_mix, entropy, flags]\n  labels = cluster(X)\
      \  # e.g. DBSCAN/HDBSCAN\n  lineage = ProblemChild_score(parent_child_chain)\n  IF cluster is outlier/small\
      \ OR lineage anomalous THEN ALERT top_features"
- question: Did a process launched from a startup-folder shortcut spawn discovery tools (whoami.exe, net.exe,
    nltest.exe, ipconfig.exe) within 60 seconds of execution?
  context: Once a persistence shortcut executes, malware commonly performs immediate host/domain reconnaissance.
    Using ProcessGUID parent-child correlation, alert when a startup .lnk-launched process spawns discovery
    utilities within 60 seconds. Legitimate startup programs rarely fan out into whoami/net/nltest/ipconfig
    immediately after launch. A positive result links the autostart persistence to active post-execution
    discovery behavior, strengthening the case that the shortcut is malicious and indicating the adversary's
    next-stage activity.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint Process Trees, Network Gateway Traffic Logs, DNS Query Logs, System and User Startup
    Folders'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  parent = ProcessCreate WHERE parent_image=lnk_in_startup\n  child = ProcessCreate WHERE\
      \ ParentProcessGuid=parent.ProcessGuid\n     AND child.image IN (whoami,net,nltest,ipconfig)\n \
      \    AND child.time - parent.time <= 60s\n  | ALERT"
- question: How far do child-process names, destination ports, upload byte volume, and connection frequency
    of shortcut-launched processes deviate from a per-shortcut baseline, and are there blocked connections
    or failed DNS lookups?
  context: Each startup shortcut should behave consistently over time. Build a per-shortcut baseline of
    expected child-process names, destination ports, upload byte volume, and connections-per-minute, then
    score deviations using k-sigma and time-of-day thresholds (Dwyer & Truta). Profile blocked connections
    and failed DNS resolutions as distinct signals, since malware often probes unreachable or sinkholed
    infrastructure. Large deviations indicate the shortcut's process has been repurposed or hijacked for
    persistence/C2, even when the binary itself looks benign.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint Process Trees, Network Gateway Traffic Logs, DNS Query Logs, System and User Startup
    Folders'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = per_shortcut_profile(child_names, dst_ports, upload_bytes, conn_rate)\n \
      \ FOR event IN shortcut_proc_activity:\n    z = (observed - baseline.mean)/baseline.std\n    IF\
      \ |z| > k OR observed outside time_of_day_band THEN flag\n  | ALSO flag conn_blocked, dns_failed\
      \ as distinct signals | ALERT"
- question: Do hourly .lnk creation counts spike above the forecasted confidence interval, indicating
    a burst of shortcut-based persistence activity?
  context: A sudden surge in shortcut creation across the fleet can indicate mass persistence deployment
    (e.g., a worm, phishing wave, or scripted rollout of malicious LNKs). Forecast hourly .lnk creation
    counts with Prophet or ARIMA and alert when observed counts exceed the upper confidence interval.
    This time-series approach catches campaign-level activity that per-event rules might treat as isolated.
    A positive result prompts investigation of a coordinated persistence event and helps scope its breadth
    across hosts.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint Process Trees, Network Gateway Traffic Logs, DNS Query Logs, System and User Startup
    Folders'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  series = hourly_count(FileCreate WHERE ext=.lnk)\n  model = Prophet/ARIMA(series)\n\
      \  IF observed[hour] > model.yhat_upper[hour] THEN ALERT spike"
- question: Does a host-provenance graph reveal a shortcut-write -> launch -> anomalous-child/C2 subgraph,
    or out-of-distribution logon event sequences?
  context: Provenance-based detection captures the full causal chain of shortcut persistence. Apply KAIROS
    (temporal GNN) or ThreaTrace (GraphSAGE) over host provenance to flag the shortcut-write -> process-launch
    -> anomalous-child or C2-connection subgraph as structurally anomalous, and use DeepLog to flag out-of-distribution
    logon event sequences. Surfacing the contributing nodes and edges gives analysts an explainable attack
    path. This graph approach detects multi-step persistence behavior that point detections cannot, even
    when individual events appear benign.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint Process Trees, Network Gateway Traffic Logs, DNS Query Logs, System and User Startup
    Folders'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  G = provenance_graph(host events)\n  anomaly = KAIROS_tgnn(G) OR ThreaTrace_graphsage(G)\n\
      \  seq_anom = DeepLog(logon_event_sequence)\n  IF subgraph(lnk_write->launch->anom_child/C2) flagged\
      \ OR seq_anom THEN\n     ALERT contributing_nodes_edges"
- question: Does any .lnk file have an ICON_LOCATION impersonating a document or legitimate application
    while its target is a script interpreter/LOLBIN, or carry a document double-extension (e.g., report.pdf.lnk)?
  context: Masquerading shortcuts trick users into trusting a malicious file. Parse the Shell Link ICON_LOCATION
    versus the target path and alert when the icon impersonates a document or common app (e.g., a PDF/Word/explorer
    icon) while the actual target is a script interpreter or LOLBIN, or when the .lnk uses a document
    double-extension that abuses Windows' hidden .lnk extension. These are classic spearphishing-attachment
    persistence lures. A positive result identifies a deceptive shortcut crafted to be clicked and executed
    under a false identity.
  answer_sources:
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 15
  - 'NAI: Endpoint File Systems: User profile directories, Temporary file directories (%TEMP%), Email
    attachment sandboxes, Web download folders'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  PARSE icon_location, target FROM ShellLink(file)\n  IF icon_location ~ /(\\.pdf|\\.docx?|explorer\\\
      .exe|legit_app)/i\n     AND target ~ /(powershell|cmd|wscript|cscript|mshta|rundll32)/i THEN flag\n\
      \  IF file.name ~ /\\.(pdf|docx?|xlsx?|jpg)\\.lnk$/i THEN flag_double_ext\n  | ALERT"
- question: Which .lnk files exceed the 99th file-size percentile (e.g., >1 MB) across the enterprise
    or contain embedded strings with entropy above the encrypted-payload threshold?
  context: Shortcuts are normally tiny; an oversized .lnk often hides an embedded payload. Flag .lnk files
    exceeding the 99th size percentile (e.g., >1 MB) fleet-wide, and score embedded-string entropy against
    Lyda & Hamrock thresholds (>7.2 bits/byte indicates an embedded encrypted payload). A large, high-entropy
    shortcut is a strong indicator of a self-contained dropper used for persistence. A positive result
    directs the analyst to extract and analyze the embedded content.
  answer_sources:
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 15
  - 'NAI: Endpoint File Systems: User profile directories, Temporary file directories (%TEMP%), Email
    attachment sandboxes, Web download folders'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  p99 = percentile(lnk_file_sizes_fleet, 99)\n  FOR lnk:\n    IF size > max(p99, 1MB)\
      \ THEN flag_size\n    IF shannon_entropy(embedded_strings) > 7.2 THEN flag_payload\n  | ALERT"
- question: When scored by an anomaly/classification model on icon-target mismatch, size, entropy, mark-of-the-web
    presence, target signer, and target prevalence, which shortcuts are flagged as masquerading malicious
    files?
  context: A learned model combines weak masquerading signals into a strong verdict. Train an Isolation
    Forest or Random Forest on icon-target mismatch, file size, embedded-string entropy, Zone.Identifier
    (mark-of-the-web) presence, target signer status, and target prevalence to score whether a shortcut
    is a malicious masquerader, emitting the top-3 contributing features per alert. Mark-of-the-web presence
    is especially telling because it marks internet-delivered (e.g., emailed/downloaded) lures. This catches
    novel deceptive shortcuts that fixed rules miss while keeping alerts explainable.
  answer_sources:
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 15
  - 'NAI: Endpoint File Systems: User profile directories, Temporary file directories (%TEMP%), Email
    attachment sandboxes, Web download folders'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  feats = {icon_target_mismatch, size, entropy, has_zone_identifier,\n           target_signer,\
      \ target_prevalence}\n  score = IsolationForest/RandomForest(feats)\n  IF score > threshold THEN\
      \ ALERT with top3_features"
- question: When a .lnk in a system-wide privileged directory (Public Desktop, Administrative Tools, system
    Start Menu) is modified to point to a new executable, does the new target hash match a known-malicious
    indicator or was it written by a process outside the installer allowlist?
  context: Privileged shortcuts are run by administrators or in elevated contexts, so retargeting them
    lets an adversary execute code with higher privileges. On .lnk modification in a privileged folder,
    parse and hash the new target per the Shell Link format, compare to TI malicious hashes, and alert
    on matches or on writers not on the installer allowlist. Modification of a shared/privileged shortcut
    by a non-installer process is itself suspicious. A positive result indicates an attempt to hijack
    a privileged execution path for escalation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 15
  - 'NAI: Endpoints: System-wide startup folder (C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp),
    Public Desktop folder (C:\Users\Public\Desktop), Administrative Tools folder'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  ON FileModify/Create(Sysmon11) WHERE path IN privileged_folders AND ext=.lnk:\n    new_target\
      \ = parse_ShellLink(file).target\n    IF sha256(new_target) IN ti_malicious_hashes\n       OR writer_image\
      \ NOT IN installer_allowlist THEN ALERT"
- question: Which privileged-shortcut targets are new and rare, appearing on fewer than 5 endpoints fleet-wide
    compared to their established baseline?
  context: Legitimate privileged shortcuts point to widely deployed, common binaries. Baseline the target
    hashes of privileged shortcuts and flag new targets seen on fewer than 5 endpoints across the fleet
    (F-Secure prevalence / Microsoft frequency analysis). A privileged shortcut suddenly pointing to a
    rare binary suggests retargeting to attacker tooling for escalation. A positive result highlights
    an anomalous, low-prevalence target worthy of deeper inspection even if no TI match exists.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 15
  - 'NAI: Endpoints: System-wide startup folder (C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp),
    Public Desktop folder (C:\Users\Public\Desktop), Administrative Tools folder'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = set(target_hash) per privileged_shortcut over fleet\n  FOR modified_shortcut:\n\
      \    prev = count_distinct(host WHERE target_hash=new_hash)\n    IF new_hash NOT IN baseline AND\
      \ prev < 5 THEN ALERT rare_target"
- question: When the new target binary of a modified privileged shortcut is scored with static PE ML features,
    which targets are flagged as benign-improbable (unsigned, rare imports, high section entropy)?
  context: Unknown retargeted binaries can be vetted with static ML before they detonate at high privilege.
    Score the new target binary with EMBER static PE features (LightGBM) and flag low-confidence/benign-improbable
    targets, surfacing top contributing features such as missing signature, rare imports, and high section
    entropy. This catches escalation payloads not present in TI feeds. A high maliciousness score on a
    privileged shortcut's new target is a strong escalation indicator and gives the analyst explainable
    features to triage.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 15
  - 'NAI: Endpoints: System-wide startup folder (C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp),
    Public Desktop folder (C:\Users\Public\Desktop), Administrative Tools folder'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  feats = EMBER_PE(new_target)\n  score = ember_lgbm(feats)\n  IF score > threshold THEN\
      \ ALERT with top3_features (unsigned, rare_imports, high_entropy)"
- question: Did a high-integrity process spawn a LOLBAS wrapper (cmd.exe /c, powershell -enc) launched
    from a privileged shortcut, or was the shortcut's visible command line padded with whitespace/control
    characters to hide the real target?
  context: Adversaries prepend a LOLBAS command to a legitimate privileged shortcut's target so malicious
    code runs first, in the shortcut's elevated context, before the intended app. Alert when high-integrity
    processes spawn cmd.exe/powershell.exe wrappers launched from a privileged shortcut, or when the visible
    command line is whitespace/control-char padded to conceal the real target. The elevated integrity
    level is what makes this escalation rather than mere execution. A positive result indicates execution
    hijacking of a privileged shortcut.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - 'NAI: Endpoints: Administrative Tools folder, Control Panel items folder, System-wide Start Menu programs
    folder'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  proc = ProcessCreate WHERE IntegrityLevel IN (High,System)\n     AND parent_lnk IN privileged_folders\n\
      \     AND image IN (cmd.exe, powershell.exe)\n     AND cmdline ~ /(\\/c|-enc)/i\n  IF padded(visible_cmdline)\
      \ /[\\x09-\\x0D ]{>X}/ THEN also flag\n  | ALERT"
- question: How different is a privileged shortcut's observed command line from its baseline target structure
    (Levenshtein/Jaccard distance > 0.5), and what is its argument entropy?
  context: Hijacking a privileged shortcut changes its command line away from the established legitimate
    structure. Measure Levenshtein/Jaccard distance between the observed command line and the shortcut's
    baseline target structure, flag distances above 0.5, and score argument entropy against Lyda & Hamrock
    thresholds. A large divergence indicates prepended or replaced commands; high entropy indicates encoding/obfuscation.
    Together they reveal tampering of a privileged shortcut for escalation even when individual tokens
    look plausible. A positive result quantifies how far the command drifted from normal.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - 'NAI: Endpoints: Administrative Tools folder, Control Panel items folder, System-wide Start Menu programs
    folder'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = baseline_cmdline_structure[shortcut]\n  d = max(levenshtein_norm(obs, base),\
      \ 1 - jaccard(tokens(obs), tokens(base)))\n  IF d > 0.5 OR shannon_entropy(obs.args) > entropy_thr\
      \ THEN ALERT"
