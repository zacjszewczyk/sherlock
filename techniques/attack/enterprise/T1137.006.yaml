questions:
- question: '[Persistence] Add-in drop extension-path floor: For T1137.006 Add-ins — An Office add-in
    file with a suspicious extension (e.g., .wll, .xll, .xlam, .ppam) is created on disk, or a registry
    key is modified to load an add-in, where the file''s hash or the registry value matches a known indicator
    of compromise (IOC). Using a Symbolic Logic approach, how can an analyst determine whether: Alert
    on Sysmon EID 11 (and EID 4663) file create/modify where extension is .wll/.xll/.xla/.xlam/.ppa/.ppam
    AND path is within user-writable Office trusted/startup dirs (%APPDATA%\Microsoft\Word\Startup, \Microsoft\AddIns,
    \Excel\XLSTART); exclude Excel temp files (~$*, sizes 0/165). These extension-by-path drops are auto-loaded
    at launch even with macros disabled Persistence via Microsoft Office AddIns, Elastic Detection Rules
    Add-In Opportunities for Office Persistence, WithSecure/MWR.'
  context: 'Tactic: Persistence (TA0003). This question supports the information requirement: "Is the
    adversary maintaining persistence using malicious Office add-ins? (TA0003 - Persistence)". Evidence
    under investigation: An Office add-in file with a suspicious extension (e.g., .wll, .xll, .xlam, .ppam)
    is created on disk, or a registry key is modified to load an add-in, where the file''s hash or the
    registry value matches a known indicator of compromise (IOC). Detection method (Symbolic Logic): Alert
    on Sysmon EID 11 (and EID 4663) file create/modify where extension is .wll/.xll/.xla/.xlam/.ppa/.ppam
    AND path is within user-writable Office trusted/startup dirs (%APPDATA%\Microsoft\Word\Startup, \Microsoft\AddIns,
    \Excel\XLSTART); exclude Excel temp files (~$*, sizes 0/165). These extension-by-path drops are auto-loaded
    at launch even with macros disabled Persistence via Microsoft Office AddIns, Elastic Detection Rules
    Add-In Opportunities for Office Persistence, WithSecure/MWR. Office add-ins (WLL/XLL/COM/VBA/VSTO/Outlook)
    auto-execute code when an Office application launches, making them a durable persistence mechanism
    that survives reboots and runs even when macros are disabled. A positive result — a rare/unsigned
    add-in dropped to a trusted directory, a LoadBehavior registry write, an anomalous load path, an Office
    process spawning an interpreter, or beaconing from the Office process tree — is strong evidence of
    adversary persistence and warrants host isolation, add-in removal, and credential review. A negative
    result helps scope the intrusion and rule out add-in-based footholds, but should be corroborated with
    related persistence and execution telemetry before closing.'
