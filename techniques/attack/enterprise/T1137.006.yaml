name: 'T1137.006: Add-ins'
id: c6236619-5107-4114-9abc-e3ec328cde4d
description: 'This playbook helps an analyst investigate adversary persistence achieved by abusing Microsoft
  Office add-ins (WLL/XLL libraries, VBA add-ins, COM add-ins, automation add-ins, VBE, VSTO, and Outlook
  add-ins), which can be configured to execute attacker code automatically when an Office application
  starts. It guides the investigation across the full kill-chain of add-in persistence: suspicious add-in
  files dropped to user-writable trusted/startup directories or matching IOCs; registry modifications
  that register COM add-ins or set LoadBehavior to auto-load; add-in DLLs loaded from non-standard paths
  or that are unsigned/off-allowlist; Office applications spawning uncharacteristic child processes (shells,
  scripting interpreters, LOLBins); outbound C2/beaconing from Office process trees; and post-launch writes
  to known persistence locations. For each evidence type it provides symbolic-logic detections, statistical
  rarity/entropy/periodicity scoring, and machine-learning approaches to surface and triage malicious
  Office add-in activity on Windows and Office Suite environments.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
