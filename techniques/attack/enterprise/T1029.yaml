- question: >-
    [Statistical Method] Combine inter-arrival regularity with per-destination byte-volume outlier detection?
    Concretely: A sequence of connections between a specific internal host and an external destination
    shows a statistically regular inter-arrival time, with a payload size ($$ orig_bytes $$) that is a
    statistical outlier compared to the host's typical outbound traffic profile for that destination.
  context: >-
    Tactic context (TA0010 Exfiltration): the adversary is trying to steal data, and T1029 (Scheduled
    Transfer) times that exfiltration to fixed hours or intervals to blend with normal traffic. What to
    look for and why: A sequence of connections between a specific internal host and an external destination
    shows a statistically regular inter-arrival time, with a payload size ($$ orig_bytes $$) that is a
    statistical outlier compared to the host's typical outbound traffic profile for that destination.
    Method (Statistical Method): Statistical Method: For each host establish a baseline of outbound transfer
    size (`orig_bytes`) per destination and protocol; flag recurring connections whose average transfer
    size exceeds the 95th percentile of that host's baseline for the destination. Require periodicity
    (CV of Δt < 0.1) and also compute the CV of byte sizes — highly regular *and* equal-sized transfers
    are the byte-volume signature scored by [RITA-J](https://github.com/Cyb3r-Monk/RITA-J/blob/main/C2%20Detection%20-%20HTTP.ipynb);
    confirm the period via FFT/autocorrelation per [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks).
    Tune percentiles against benign periodic-flow baselines from [Mack et al](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf).
    A positive result is a host/destination pair (or scheduled task, or staging chain) that recurs on
    a predictable cadence and aligns with the evidence above — pivot to the responsible process, account,
    and scheduled-task/cron/launchd entry and scope the data at risk. A negative or benign result is typically
    explained by known periodic services (OS/AV update, telemetry, NTP, backup) on an allowlist; document
    and tune those out rather than dropping the detection.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline orig_bytes per (host,dst,proto)
      for each recurring pair:
        cv_dt = stdev(diff(ts))/mean(diff(ts))
        cv_bytes = stdev(orig_bytes)/mean(orig_bytes)
        period = fft/autocorr(diff(ts))
      | flag where avg(orig_bytes) > p95(baseline) AND cv_dt < 0.1
      | boost where cv_bytes low (equal-sized transfers)
- question: >-
    [Machine Learning] Forecast next connection and jointly score timing predictability and volume anomaly?
    Concretely: A sequence of connections between a specific internal host and an external destination
    shows a statistically regular inter-arrival time, with a payload size ($$ orig_bytes $$) that is a
    statistical outlier compared to the host's typical outbound traffic profile for that destination.
  context: >-
    Tactic context (TA0010 Exfiltration): the adversary is trying to steal data, and T1029 (Scheduled
    Transfer) times that exfiltration to fixed hours or intervals to blend with normal traffic. What to
    look for and why: A sequence of connections between a specific internal host and an external destination
    shows a statistically regular inter-arrival time, with a payload size ($$ orig_bytes $$) that is a
    statistical outlier compared to the host's typical outbound traffic profile for that destination.
    Method (Machine Learning): Machine Learning: Apply time-series forecasting (ARIMA/Prophet) or an LSTM
    ([Gupta et al](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20)) per (src,dst) to predict
    the next connection time; a connection arriving as predicted strengthens the scheduled-task hypothesis.
    Flag flows that are both highly predictable and carry anomalous payload sizes vs. baseline, and report
    the top-3 drivers (period, predicted-vs-actual error, byte z-score) via [SHAP](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    A positive result is a host/destination pair (or scheduled task, or staging chain) that recurs on
    a predictable cadence and aligns with the evidence above — pivot to the responsible process, account,
    and scheduled-task/cron/launchd entry and scope the data at risk. A negative or benign result is typically
    explained by known periodic services (OS/AV update, telemetry, NTP, backup) on an allowlist; document
    and tune those out rather than dropping the detection.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      for each (src,dst):
        forecast = ARIMA_or_Prophet_or_LSTM(conn.ts)
        pred_err = |next_actual - forecast|
        byte_z = zscore(orig_bytes vs baseline)
      | flag where pred_err small (predictable) AND byte_z high
      | explain via SHAP -> top3(period, pred_vs_actual_error, byte_zscore)
