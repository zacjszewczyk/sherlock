name: 'T1029: Scheduled Transfer'
id: 64514d4d-df8e-4bde-9f20-2b0f4734915f
description: >-
  Investigate evidence that an adversary is exfiltrating data using scheduled or recurring transfers (MITRE
  ATT&CK T1029, Scheduled Transfer). Adversaries time data exfiltration to certain hours or fixed intervals
  to blend with normal activity, and typically pair scheduling with another exfiltration technique (e.g.,
  over C2 or an alternative protocol). This playbook helps an analyst hunt for: (1) low-jitter, periodic
  outbound network beacons from a single internal host to a single external destination, especially toward
  threat-intel-flagged or non-allowlisted endpoints and during off-hours; (2) newly created or modified
  scheduled tasks (Windows EID 4698/4702, cron, launchd) whose command lines reference staging, compression,
  and transfer tooling or carry obfuscated/encoded content; (3) recurring connections whose byte volume
  is a statistical outlier against the host's baseline for that destination; (4) regular-volume covert-channel
  carriage over DNS, ICMP, or self-signed TLS; and (5) host-side staging chains where an unsigned process
  from a non-standard path reads many sensitive files and then initiates periodic egress. It combines
  deterministic symbolic-logic gates, statistical regularity/volume/entropy methods, and explainable machine-learning
  models across network (Zeek, PCAP) and endpoint (Sysmon, Windows Event Log, auditd) telemetry.
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
