questions:
- question: >-
    [Symbolic Logic] Join Zeek dns.log and conn.log and apply deterministic beaconing gates with threat-intel
    match? Concretely: A time series of outbound network connections from a single internal host to a
    single external destination exhibits a fixed, repeating interval with low jitter, and the destination
    IP address or resolved domain is present on a high-confidence threat intelligence feed.
  context: >-
    Tactic context (TA0010 Exfiltration): the adversary is trying to steal data, and T1029 (Scheduled
    Transfer) times that exfiltration to fixed hours or intervals to blend with normal traffic. What to
    look for and why: A time series of outbound network connections from a single internal host to a single
    external destination exhibits a fixed, repeating interval with low jitter, and the destination IP
    address or resolved domain is present on a high-confidence threat intelligence feed. Method (Symbolic
    Logic): Symbolic Logic: Join Zeek `dns.log` and `conn.log`. Group by (`id.orig_h`,`id.resp_h`/resolved
    `query`) over 24h and keep pairs with a minimum connection count (floor: ≥12 connections/24h to avoid
    sparse false positives, per the connection-count gate in [RITA](https://github.com/activecm/rita)).
    Alert when the destination IP/domain matches a high-confidence threat-intel feed OR the pair is NOT
    on an allowlist of known-periodic services (OS/AV update, telemetry, NTP) and recurs during off-hours
    (e.g., 19:00–07:00 local). Use the DNS↔conn↔process correlation pattern from [MITRE DET0400](https://attack.mitre.org/detectionstrategies/DET0400/)
    and scheduled-tool command-line rules in [SigmaHQ](https://github.com/SigmaHQ/sigma) to attribute
    the recurring flow to a scheduled task/cron job. A positive result is a host/destination pair (or
    scheduled task, or staging chain) that recurs on a predictable cadence and aligns with the evidence
    above — pivot to the responsible process, account, and scheduled-task/cron/launchd entry and scope
    the data at risk. A negative or benign result is typically explained by known periodic services (OS/AV
    update, telemetry, NTP, backup) on an allowlist; document and tune those out rather than dropping
    the detection.
  answer_sources: &id001
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      join dns.log, conn.log
      | group by id.orig_h, (id.resp_h | dns.query) over 24h window
      | where conn_count >= 12
      | where dest in threat_intel_feed OR (dest not in periodic_allowlist AND hour(ts) in 19..23,0..6)
      | enrich with process/scheduled_task (EID4698 | cron | launchd) on src
      | output src, dest, conn_count, off_hours_fraction
- question: >-
    [Statistical Method] Measure inter-arrival regularity (CV, FFT period, autocorrelation) per source-destination
    pair? Concretely: A time series of outbound network connections from a single internal host to a single
    external destination exhibits a fixed, repeating interval with low jitter, and the destination IP
    address or resolved domain is present on a high-confidence threat intelligence feed.
  context: >-
    Tactic context (TA0010 Exfiltration): the adversary is trying to steal data, and T1029 (Scheduled
    Transfer) times that exfiltration to fixed hours or intervals to blend with normal traffic. What to
    look for and why: A time series of outbound network connections from a single internal host to a single
    external destination exhibits a fixed, repeating interval with low jitter, and the destination IP
    address or resolved domain is present on a high-confidence threat intelligence feed. Method (Statistical
    Method): Statistical Method: For each (src,dst) pair compute the deltas between consecutive connections
    and the coefficient of variation CV=σ/μ of those deltas; a schedule yields CV near 0 (operational
    starting threshold CV<0.1, i.e. σ_Δt≈0), as used in [RITA-J](https://github.com/Cyb3r-Monk/RITA-J/blob/main/C2%20Detection%20-%20HTTP.ipynb).
    Confirm with FFT dominant-period extraction plus autocorrelation and rank to suppress benign periodicity
    per [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks).
    Derive environment-specific thresholds from the benign periodic-traffic distributions characterized
    by [Mack et al](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf). Failure-mode
    signal: separately profile the failed/blocked connection rate per pair (Zeek `conn_state` S0/REJ)
    — a regular cadence of *failed* outbound attempts is itself indicative of a dormant scheduler. A positive
    result is a host/destination pair (or scheduled task, or staging chain) that recurs on a predictable
    cadence and aligns with the evidence above — pivot to the responsible process, account, and scheduled-task/cron/launchd
    entry and scope the data at risk. A negative or benign result is typically explained by known periodic
    services (OS/AV update, telemetry, NTP, backup) on an allowlist; document and tune those out rather
    than dropping the detection.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for each (src,dst):
        deltas = diff(sort(conn.ts))
        cv = stdev(deltas)/mean(deltas)
        period = fft_dominant_period(deltas); ac = autocorr(deltas)
        failed_rate = count(conn_state in [S0,REJ]) / count(*)
      | flag where cv < 0.1 OR (failed_rate high AND regular)
      | rank to suppress benign periodicity
- question: >-
    [Machine Learning] Jitter-tolerant sequence/HMM modeling of connection timing with explainable output?
    Concretely: A time series of outbound network connections from a single internal host to a single
    external destination exhibits a fixed, repeating interval with low jitter, and the destination IP
    address or resolved domain is present on a high-confidence threat intelligence feed.
  context: >-
    Tactic context (TA0010 Exfiltration): the adversary is trying to steal data, and T1029 (Scheduled
    Transfer) times that exfiltration to fixed hours or intervals to blend with normal traffic. What to
    look for and why: A time series of outbound network connections from a single internal host to a single
    external destination exhibits a fixed, repeating interval with low jitter, and the destination IP
    address or resolved domain is present on a high-confidence threat intelligence feed. Method (Machine
    Learning): Machine Learning: Apply a jitter-tolerant temporal model to the per-pair connection timestamp
    series: an LSTM/transformer sequence model as in [Gupta et al (ARES 2025)](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20)
    or a continuous-time HMM as in [NetSpectra Sentinel](https://www.sciencedirect.com/science/article/pii/S1084804525000244),
    both of which recover recurrence that fixed CV/FFT thresholds miss when the adversary randomizes timing
    within a window. Cluster (e.g., K-Shape) low-variance series to surface unknown channels. Surface
    the top-3 contributing features (interval CV, period, off-hours fraction, destination reputation)
    in the alert via [SHAP attribution](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    A positive result is a host/destination pair (or scheduled task, or staging chain) that recurs on
    a predictable cadence and aligns with the evidence above — pivot to the responsible process, account,
    and scheduled-task/cron/launchd entry and scope the data at risk. A negative or benign result is typically
    explained by known periodic services (OS/AV update, telemetry, NTP, backup) on an allowlist; document
    and tune those out rather than dropping the detection.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      X = per_pair_timestamp_series(conn.log)
      model = LSTM_or_continuous_time_HMM(jitter_tolerant)
      score = model.recurrence_score(X)
      clusters = KShape(low_variance_series)
      | flag high recurrence_score
      | explain via SHAP -> top3(interval_cv, period, off_hours_fraction, dest_reputation)
- question: >-
    [Symbolic Logic] Monitor scheduled-task creation/modification (EID 4698/4702) for exfil tooling? Concretely:
    A newly created or modified scheduled task (Windows Event ID 4698, 4702) is registered, and the associated
    command line or decoded script content contains keywords, tools, or encoded strings associated with
    data staging, compression, and network transfer.
  context: >-
