    Transfer) times that exfiltration to fixed hours or intervals to blend with normal traffic. What to
    look for and why: A newly created or modified scheduled task (Windows Event ID 4698, 4702) is registered,
    and the associated command line or decoded script content contains keywords, tools, or encoded strings
    associated with data staging, compression, and network transfer. Method (Statistical Method): Statistical
    Method: Compute Shannon entropy of the command-line/arguments for each new task (EID 4698); flag H(X)>6.0
    as likely Base64/obfuscated, the same lexical-entropy signal validated for encoded exfiltration content
    by [Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf). Volume/frequency context:
    baseline the count of task creations per host and per account; alert when a non-system account creates
    tasks at a rate >3σ above its historical mean or from non-standard directories. State signal: track
    task last-run result codes — a task that repeatedly runs successfully off-hours immediately before
    outbound bytes is high-priority. A positive result is a host/destination pair (or scheduled task,
    or staging chain) that recurs on a predictable cadence and aligns with the evidence above — pivot
    to the responsible process, account, and scheduled-task/cron/launchd entry and scope the data at risk.
    A negative or benign result is typically explained by known periodic services (OS/AV update, telemetry,
    NTP, backup) on an allowlist; document and tune those out rather than dropping the detection.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for each new task (EID4698):
        H = shannon_entropy(cmdline)
        flag where H > 6.0  // base64/obfuscated
      baseline task_creation_count per host, per account
      | alert where non_system_account rate > mean + 3*sigma OR path not standard
      | correlate last_run_result success off_hours -> outbound_bytes
