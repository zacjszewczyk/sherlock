    `schtasks`, cron, launchd equivalents). Scan the 'Command'/'Arguments' fields for exfil tools (`rclone`,
    `curl`, `wget`, `bitsadmin`), compression utilities (`tar`,`zip`,`7z`), and download cmdlets (`Invoke-WebRequest`,`Start-BitsTransfer`).
    When PowerShell is present, correlate with script-block logs (EID 4104) to analyze deobfuscated content.
    Prioritize tasks whose `Triggers` specify a fixed time-of-day or recurring interval — the defining
    signature of T1029. A positive result is a host/destination pair (or scheduled task, or staging chain)
    that recurs on a predictable cadence and aligns with the evidence above — pivot to the responsible
    process, account, and scheduled-task/cron/launchd entry and scope the data at risk. A negative or
    benign result is typically explained by known periodic services (OS/AV update, telemetry, NTP, backup)
    on an allowlist; document and tune those out rather than dropping the detection.
  answer_sources: &id002
  - Windows Event ID 4698
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers (for GPO-based tasks), Critical Application Servers, User Workstations, File
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      from WinEventLog where EventID in (4698,4702)
      | field cmd = Command + Arguments
      | where cmd matches (rclone|curl|wget|bitsadmin|tar|zip|7z|Invoke-WebRequest|Start-BitsTransfer)
      | join EID 4104 (script block) on host/time for deobfuscated content
      | where Triggers contains fixed_time OR recurring_interval
      | output host, account, task_name, cmd, trigger
- question: >-
    [Statistical Method] Entropy and creation-rate baselining of scheduled-task command lines? Concretely:
    A newly created or modified scheduled task (Windows Event ID 4698, 4702) is registered, and the associated
    command line or decoded script content contains keywords, tools, or encoded strings associated with
    data staging, compression, and network transfer.
  context: >-
