questions:
- question: '[Resource Development] TI enrichment across networks/dns/certs: Can you determine whether
    an outbound network connection from an internal host to an external destination (IP, domain) or secured
    by a certificate (serial, subject) matches a high-confidence indicator of compromise from a threat
    intelligence feed for known compromised adversary infrastructure. -- specifically, using the ''TI
    enrichment across networks/dns/certs'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    a third-party server they do not own to stage, launch, and execute operations against the target --
    most often for command-and-control, but also to host watering-hole drive-by content or to run email
    infrastructure for phishing. Because the compromise happens on infrastructure outside the victim''s
    visibility, the most defensible detection is the victim-side traffic that reaches back to that server.
    This evidence focuses on the condition that an outbound network connection from an internal host to
    an external destination (IP, domain) or secured by a certificate (serial, subject) matches a high-confidence
    indicator of compromise from a threat intelligence feed for known compromised adversary infrastructure.
    This Symbolic Logic approach works as follows: Ingest high-confidence threat-intelligence feeds of
    compromised-server IPs, domains, and certificate serials/hashes and join against Zeek conn.log (id.resp_h),
    dns.log (query), and x509.log (certificate.serial/subject). Alert immediately on any exact match,
    deduplicating per (src,dst,indicator) per day. Use the deterministic Sigma matching pattern as the
    floor SigmaHQ Generic Signature Format; add Cobalt Strike default-certificate serial/subject matches
    from Florian Roth''s Cobalt Strike YARA. A positive result -- a rule match, statistical outlier, or
    model alert -- indicates a likely connection to adversary-controlled infrastructure on a compromised
    server; pivot to the responsible internal host and process, the user, the destination IP/domain/certificate,
    the TLS/HTTP fingerprint, and the volume, frequency, and timing/cadence of the traffic to scope the
    activity and corroborate with other questions in this playbook. A negative result helps rule out this
    particular vector but should be corroborated with the other methods here, since a single technique
    can miss jittered, encrypted, low-and-slow, or otherwise stealthy C2 over a compromised server.'
