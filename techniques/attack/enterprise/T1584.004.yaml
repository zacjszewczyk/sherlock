name: 'T1584.004: Server'
id: cad12c71-9216-4a7a-8550-51caadb43f03
description: 'This playbook helps an analyst investigate whether an adversary has compromised a third-party
  server for use in operations against the organization (MITRE ATT&CK T1584.004, Server, under Resource
  Development). Because the adversary stands up infrastructure -- command-and-control, watering-hole web
  servers, or phishing email servers -- on machines they do not own, most of that activity is invisible
  to the victim; the defensible signal is the victim-side network traffic that reaches back to the compromised
  server. The hunt pursues that traffic from several complementary angles: outbound connections, DNS lookups,
  and TLS certificates matching high-confidence threat-intelligence indicators of known compromised infrastructure;
  failure-rate signals consistent with sinkholed or taken-down C2; risk-scoring of newly observed outbound
  domains by age, entropy, and registrar; network artifacts unique to known C2 frameworks (JA3/JA3S/JA4/JA4H/JA4X
  fingerprints, User-Agents, and URI/header patterns that survive Malleable-C2 customization); rare User-Agent/JA3
  tuples and high-entropy URI paths; regular-interval beaconing and anomalous data volumes detected through
  coefficient-of-variation, MAD, Bowley skewness, and FFT periodicity analysis; anomalous server certificates
  (self-signed, short validity, high-entropy subjects) correlated with rare TLS stacks; and correlated
  sequences where a first-seen external domain resolution is followed within minutes by suspicious scripting-engine
  execution on the same host. Detection methods combine deterministic symbolic-logic rules (Sigma/threat-intel
  matching, self-signed-cert detection, first-seen domain-to-process correlation), statistical baselining
  (percentile/entropy risk scoring, prevalence outliers, jitter and FFT cadence analysis), and machine
  learning (gradient boosting, LSTM/transformer sequence models, encrypted-flow classification, DBSCAN
  certificate clustering, CT-HMM beacon modeling, and graph neural networks), applied across Zeek conn/dns/ssl/x509/http
  logs, Windows Event ID 4688 process creation, threat-intelligence feeds, and internet-scan data, so
  the analyst can corroborate suspected compromised-server C2 against destination reputation, TLS fingerprints,
  certificate anomalies, beacon cadence, and host process activity.'
