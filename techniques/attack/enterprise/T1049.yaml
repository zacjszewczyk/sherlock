name: 'T1049: System Network Connections Discovery'
id: da939520-bd89-4f06-8648-7050eff70bf9
description: 'Investigate whether an adversary is enumerating network connections to or from compromised
  systems to map the environment and orient for lateral movement. This playbook helps an analyst hunt
  for: execution of known or rare network-discovery utilities by hash and frequency; use of native command-line
  tools (netstat, net.exe, arp, nbtstat, ss, lsof) with reconnaissance arguments; PowerShell/WMI enumeration
  of connections and adapter configurations (Get-NetTCPConnection, Win32_NetworkAdapterConfiguration);
  internal network fan-out where one host contacts many unique destinations/ports in a short window; suspicious
  parent-child process lineage where office apps, browsers, or web servers spawn discovery tools; a single
  account running discovery commands from many hosts; and cloud control-plane VPC/network enumeration
  API calls (DescribeVpcs, DescribeSubnets, DescribeNetworkInterfaces and Azure/GCP equivalents). It spans
  Windows, Linux, macOS, ESXi, network devices, and IaaS, combining symbolic-logic rules, statistical
  baselining, and machine-learning models to surface System Network Connections Discovery (T1049) activity.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any process execute on a monitored host whose SHA256 hash matches a known network-reconnaissance
    or scanning tool (e.g., nmap, masscan, advanced_ip_scanner, SoftPerfect netscan) listed in the threat-intel
    feed?
  context: Adversaries frequently drop dual-use scanning binaries to map reachable hosts and services.
    This supports the Discovery tactic (TA0007), where adversaries enumerate network connections to orient
    themselves before lateral movement. Join process-creation SHA256 hashes against the org threat-intel
    feed for recon/scan tools and alert on any match, while allowlisting approved vulnerability scanners
    and their hosts (CISA/NSA LOTL guidance). A hit is high-fidelity evidence a known recon tool ran;
    absence does not rule out native living-off-the-land discovery covered elsewhere.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Endpoints (Workstations and Laptops), Critical Servers (e.g., Domain Controllers, Application
    Servers), DMZ Servers, Developer Workstations, Administrator Jump Boxes'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'process_creation (EventID=4688 OR Sysmon EID=1)

      | where sha256 in (threat_intel.recon_tool_hashes)

      | where host NOT in (allowlist.approved_scanner_hosts)

      | alert host, user, image, sha256, command_line'
- question: For each dual-use discovery or scanning tool, is a host running it far more often than its
    own 30-day history, or running it for the very first time (first-seen)?
  context: Legitimate scanners run on predictable cadences from predictable hosts. This supports the Discovery
    tactic (TA0007), where adversaries enumerate network connections to orient themselves before lateral
    movement. Build a 30-day per-host execution-frequency baseline for each scan/discovery tool and alert
    when a host's daily count exceeds its own 95th percentile, or when the tool is first-seen on that
    host. Also track non-zero exit codes / failed launches as a distinct State sub-signal (probing/misuse).
    First-seen-per-principal baselining follows the Netflix CloudTrail Anomaly Detector; outlier scoring
    follows Isolation Forest.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Endpoints (Workstations and Laptops), Critical Servers (e.g., Domain Controllers, Application
    Servers), DMZ Servers, Developer Workstations, Administrator Jump Boxes'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'process_creation

      | where image in (dual_use_discovery_tools)

      | stats count by host, image, day

      | join baseline_p95 on host,image

      | where count > p95 OR first_seen(host,image)

      | eval failed = exit_code != 0

      | alert host, image, count, p95, failed'
- question: Does a machine-learning model scoring process-execution events (process name, parent, command-line
    tokens, user context, file hash) flag any execution as malicious with score > 0.9?
  context: Some recon binaries are renamed or novel and evade hash/name rules. This supports the Discovery
    tactic (TA0007), where adversaries enumerate network connections to orient themselves before lateral
    movement. Score process-execution events with a supervised model over process name, parent process,
    command-line tokens, user context, and file hash; flag executions scoring above 0.9 and surface the
    top-3 contributing features (e.g., parent=winword.exe, rare hash, recon args) via LIME-style attribution
    for analyst triage.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Endpoints (Workstations and Laptops), Critical Servers (e.g., Domain Controllers, Application
    Servers), DMZ Servers, Developer Workstations, Administrator Jump Boxes'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = load('discovery_binary_clf')\nfor e in process_creation_events:\n  score = model.predict_proba(features(e.image,e.parent,e.cmdline,e.user,e.sha256))\n\
      \  if score > 0.9:\n     alert(e, top3_features(LIME, e, model))"
- question: Did a known connection-discovery utility (netstat.exe, net.exe/net1.exe, arp.exe, nbtstat.exe,
    nltest.exe, ipconfig.exe, route.exe, who, w, ss, lsof) run with reconnaissance arguments such as 'net
    session', 'net use', 'net view /domain', 'netstat -anob', 'arp -a', or 'lsof -i'?
  context: Native utilities are the most common way adversaries enumerate connections without dropping
    tools. This supports the Discovery tactic (TA0007), where adversaries enumerate network connections
    to orient themselves before lateral movement. Alert on process creation (Event ID 4688 / Sysmon EID
    1) where the image is a connection-discovery utility AND the command line carries recon arguments.
    Use SigmaHQ rule templates and tune out known admin scripts and scheduled tasks (CISA/NSA LOTL guidance).
    Pay special attention to execution by non-admin users or anomalous parents.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All Endpoints (Workstations and Laptops), Jump Servers, Domain Controllers, Internal Application
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'process_creation (EventID=4688 OR 4104)

      | where image in (netstat.exe,net.exe,net1.exe,arp.exe,nbtstat.exe,nltest.exe,ipconfig.exe,route.exe,who,w,ss,lsof)

      | where cmdline matches (''net session'',''net use'',''net view /domain'',''netstat -anob'',''arp
      -a'',''lsof -i'')

      | where NOT admin_scheduled_task(process)

      | alert host, user, image, cmdline, parent_image'
- question: Is a user/host running discovery utilities at an abnormally high rate (above the 99th historical
    percentile per 5-minute window), or with command-line arguments whose character distribution diverges
    strongly (high KL divergence) from a benign baseline indicating obfuscation?
  context: Bursts of discovery commands and obfuscated/randomized arguments both signal automated or evasive
    reconnaissance. This supports the Discovery tactic (TA0007), where adversaries enumerate network connections
    to orient themselves before lateral movement. Per user/host, track the count of discovery-utility
    executions per 5-minute window and alert above the 99th percentile (Frequency), and compute the KL
    divergence of command-line argument character distribution versus a benign baseline (style), alerting
    on high divergence. Also profile failed/zero-result executions as a distinct State signal. Rationale
    follows Red Canary KL-divergence entropy hunting.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All Endpoints (Workstations and Laptops), Jump Servers, Domain Controllers, Internal Application
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'process_creation

      | where image in (discovery_utilities)

      | bin 5m, stats count by user, host, window

      | where count > p99(user,host)

      | eval kl = kl_divergence(char_dist(cmdline), benign_baseline)

      | where kl > kl_threshold OR count>p99

      | alert user, host, count, kl'
- question: Does a sequence/provenance model over ordered command events per host session place a discovery
    command within a high-anomaly sequence that differs from normal administrative command chains?
  context: Reconnaissance commands often appear in characteristic chains distinct from routine admin workflows.
    This supports the Discovery tactic (TA0007), where adversaries enumerate network connections to orient
    themselves before lateral movement. Apply a sequence/provenance model to ordered command events per
    host session to distinguish normal admin chains from recon chains (node-level provenance learning
    as in ThreaTrace, graph-pattern matching as in POIROT), and flag sessions where a discovery command
    appears in a high-anomaly sequence. Report the contributing command subsequence in the alert for triage.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All Endpoints (Workstations and Laptops), Jump Servers, Domain Controllers, Internal Application
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for session in host_sessions:\n  seq = ordered_commands(session)\n  score = seq_provenance_model.anomaly(seq)\n\
      \  if score>thr and contains_discovery_cmd(seq):\n     alert(session, anomalous_subsequence(seq))"
- question: Does a PowerShell script block (Event ID 4104) or WMI permanent event subscription (WMI-Activity
    Event ID 5858) contain network-discovery cmdlets, CIM/WMI classes, or .NET methods (Get-NetTCPConnection,
    Get-NetNeighbor, Test-NetConnection, Win32_NetworkAdapterConfiguration, System.Net.NetworkInformation),
    especially with suspicious parents?
  context: PowerShell and WMI provide fileless ways to enumerate connections and adapter configurations.
    This supports the Discovery tactic (TA0007), where adversaries enumerate network connections to orient
    themselves before lateral movement. Search script-block logs (4104) and WMI-Activity (5858) for network-discovery
    cmdlets/classes/.NET methods and suspicious parent processes such as winword.exe or w3wp.exe; apply
    SigmaHQ obfuscation patterns. A match indicates scripted network reconnaissance, particularly concerning
    when spawned by document or web-server processes.
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Microsoft-Windows-WMI-Activity/Operational Event ID 5858
  - 'NAI: All Windows Endpoints and Servers, Systems with PowerShell Remoting Enabled, Exchange Servers,
    SharePoint Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(EventID=4104) OR (WMI-Activity EventID=5858)

      | where text matches (''Get-NetTCPConnection'',''Get-NetNeighbor'',''Test-NetConnection'',''Win32_NetworkAdapterConfiguration'',''System.Net.NetworkInformation'')

      | where parent_image in (winword.exe,w3wp.exe,excel.exe) OR obfuscation_pattern(text)

      | alert host, user, parent_image, text'
- question: Does a PowerShell script block show high character-frequency KL divergence from a benign administrative-script
    baseline while also containing network keywords, or does a user invoke recon cmdlets above 3 standard
    deviations from their own history?
  context: Obfuscated recon scripts deviate statistically from normal admin scripts. This supports the
    Discovery tactic (TA0007), where adversaries enumerate network connections to orient themselves before
    lateral movement. For each script block compute character-frequency KL divergence from a benign admin-script
    baseline and flag high-divergence blocks that also contain network keywords (Red Canary entropy hunting).
    Track per-user Frequency of recon cmdlet invocations and alert above 3 standard deviations from the
    user's history.
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Microsoft-Windows-WMI-Activity/Operational Event ID 5858
  - 'NAI: All Windows Endpoints and Servers, Systems with PowerShell Remoting Enabled, Exchange Servers,
    SharePoint Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for block in scriptblock_logs(4104):\n  kl = kl_divergence(char_dist(block.text), benign_admin_baseline)\n\
      \  if kl>thr and contains_network_keyword(block):\n     alert(block)\n# per-user recon cmdlet frequency\n\
      stats recon_cmdlet_count by user | where count > mean+3*std"
- question: Does a classifier over script-block text and AST-derived features label a script as suspicious-recon
    or malicious?
  context: Recon intent can be learned from script text and structure. This supports the Discovery tactic
    (TA0007), where adversaries enumerate network connections to orient themselves before lateral movement.
    Train a classifier on script-block text and AST-derived features to label scripts benign / suspicious-recon
    / malicious; prioritize the latter two and surface the top-3 contributing tokens/AST features in the
    alert (explainable attribution via LIME) so analysts can validate quickly.
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Microsoft-Windows-WMI-Activity/Operational Event ID 5858
  - 'NAI: All Windows Endpoints and Servers, Systems with PowerShell Remoting Enabled, Exchange Servers,
    SharePoint Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = load('recon_script_clf')\nfor block in scriptblock_logs(4104):\n  label,score = model.predict(text_features(block)+ast_features(block))\n\
      \  if label in ('suspicious-recon','malicious'):\n     alert(block, top3_features(LIME,block,model))"
- question: Did a single source host connect to more than 25 unique internal destination IPs (or 25 unique
    destination ports on one host) within a 5-minute window in Zeek conn.log?
  context: Horizontal (many hosts) and vertical (many ports) fan-out from one source is a hallmark of
    internal scanning. This supports the Discovery tactic (TA0007), where adversaries enumerate network
    connections to orient themselves before lateral movement. Using Zeek conn.log, alert when a single
    source IP exceeds 25 unique internal destination IPs or 25 unique dest ports on one host within a
    5-minute window, excluding known scanners, monitoring, and DHCP/DNS/AD infrastructure. Derive the
    per-environment threshold from the 99th percentile of historical per-host out-degree.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internal network segments (East-West traffic), Network Security Monitoring Sensor locations,
    VPC/VNet Flow Log aggregation points, Core network switch SPAN/TAP ports'
  range: Last 90 days; evaluate in 5-minute windows
  queries:
  - technology: Zeek/pseudocode
    query: 'conn.log

      | where resp_h in internal_space

      | bin 5m, stats dcount(resp_h) as dst_ips, dcount(resp_p) as dst_ports by orig_h, window

      | where (dst_ips>25 OR dst_ports>25) and orig_h NOT in (scanners,monitoring,dhcp,dns,ad)

      | alert orig_h, dst_ips, dst_ports'
- question: Does a host's unique destination IP/port count per hour exceed its 30-day 99th-percentile
    baseline, and is its ratio of failed/rejected connections (Zeek conn_state S0/REJ/RSTO) above 0.5?
  context: Scanning produces both elevated out-degree and many half-open/failed connections. This supports
    the Discovery tactic (TA0007), where adversaries enumerate network connections to orient themselves
    before lateral movement. Maintain a 30-day rolling per-host baseline of unique destination IPs/ports
    per hour and alert above the 99th percentile, using host-communication-graph out-degree features (Bohara
    et al.). Add a State metric tracking the ratio of failed/rejected connections; alert when that ratio
    exceeds 0.5 together with high fan-out, which strongly indicates scanning rather than normal access.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internal network segments (East-West traffic), Network Security Monitoring Sensor locations,
    VPC/VNet Flow Log aggregation points, Core network switch SPAN/TAP ports'
  range: Last 90 days; hourly aggregation
  queries:
  - technology: Zeek/pseudocode
    query: "conn.log\n| bin 1h, stats dcount(resp_h) as outdeg, \n   sum(conn_state in (S0,REJ,RSTO))\
      \ as failed, count as total by orig_h, hour\n| eval fail_ratio = failed/total\n| join baseline_p99\
      \ on orig_h\n| where outdeg>p99 and fail_ratio>0.5\n| alert orig_h, outdeg, fail_ratio"
- question: Do per-host flow feature vectors (unique dests, unique ports, failed-conn ratio, bytes sent/received
    ratio) score as anomalous under Isolation Forest / one-class SVM, and does communication-graph link
    prediction flag anomalous new edges?
  context: Multi-feature anomaly detection catches stealthy scanners that stay under simple thresholds.
    This supports the Discovery tactic (TA0007), where adversaries enumerate network connections to orient
    themselves before lateral movement. Score per-host flow feature vectors with Isolation Forest / one-class
    SVM and report the top-3 contributing features via LIME; corroborate with graph link-prediction over
    the host communication graph to flag anomalous new edges (CyberGraph). Combined signals raise confidence
    that a host is performing network discovery.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internal network segments (East-West traffic), Network Security Monitoring Sensor locations,
    VPC/VNet Flow Log aggregation points, Core network switch SPAN/TAP ports'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = per_host_flow_features(conn.log)  # uniq_dst,uniq_port,fail_ratio,byte_ratio\nscores =\
      \ IsolationForest().fit_predict(X)\nfor h in anomalies(scores):\n  alert(h, top3_features(LIME,h))\n\
      new_edges = link_prediction(comm_graph)\nalert(anomalous_edges(new_edges))"
- question: Was a discovery utility (net.exe, netstat.exe, ipconfig.exe, arp.exe, nbtstat.exe) spawned
    by an office application (winword.exe, excel.exe), a browser (chrome.exe), or a web-server process
    (w3wp.exe, httpd.exe)?
  context: These parent-child relationships almost never occur during legitimate use and strongly suggest
    exploitation followed by hands-on-keyboard recon. This supports the Discovery tactic (TA0007), where
    adversaries enumerate network connections to orient themselves before lateral movement. Alert on high-fidelity
    anomalous parent-child relationships where a network-discovery utility is spawned by an office app,
    browser, or web-server process, using SigmaHQ process-creation rules. Such lineage is a classic post-exploitation
    discovery indicator.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Web Servers, User Workstations, Application Servers, Microsoft Office 365 / Exchange servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'process_creation (EventID=4688)

      | where image in (net.exe,netstat.exe,ipconfig.exe,arp.exe,nbtstat.exe)

      | where parent_image in (winword.exe,excel.exe,chrome.exe,w3wp.exe,httpd.exe)

      | alert host, user, parent_image, image, cmdline'
- question: Does a new or extremely rare parent->child process edge appear over a 30-day window whose
    child is a network-discovery tool (first-seen edge detection)?
  context: Rare process lineage involving discovery tools indicates novel, potentially malicious behavior.
    This supports the Discovery tactic (TA0007), where adversaries enumerate network connections to orient
    themselves before lateral movement. Aggregate parent->child process edges over 30 days into a frequency
    table and alert when a new or extremely rare edge appears whose child is a discovery tool (first-seen
    edge detection), consistent with rare-event baselining (Netflix CloudTrail Anomaly Detector; Bohara
    et al.).
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Web Servers, User Workstations, Application Servers, Microsoft Office 365 / Exchange servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'process_creation

      | stats count by parent_image, image (30d)

      | where image in (discovery_tools)

      | where first_seen(parent_image,image) OR count <= rare_threshold

      | alert parent_image, image, count'
- question: Does a provenance-graph model (GNN temporal autoencoder) flag an anomalous process subtree,
    especially one whose leaf is a network-discovery utility?
  context: Graph-based provenance modeling detects subtle anomalous execution chains missed by flat rules.
    This supports the Discovery tactic (TA0007), where adversaries enumerate network connections to orient
    themselves before lateral movement. Model process-execution chains as a provenance graph and use a
    GNN temporal autoencoder to flag anomalous subtrees, especially where a leaf is a network-discovery
    utility (KAIROS; ThreaTrace). Include the anomalous parent-child path and score in the alert for explainability.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Web Servers, User Workstations, Application Servers, Microsoft Office 365 / Exchange servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_provenance_graph(process_creation)\nrecon = gnn_temporal_autoencoder.reconstruction_error(G)\n\
      for subtree in high_error(recon):\n  if leaf_is_discovery_tool(subtree):\n     alert(path(subtree),\
      \ error_score(subtree))"
- question: Did a single user account execute network discovery commands from more than 3 unique hosts
    within a 1-hour window, correlating successful logons (4624) with subsequent process creation (4688)
    by LogonId/SessionGuid?
  context: An account running recon across many hosts in a short period signals credential abuse or attacker
    lateral reconnaissance. This supports the Discovery tactic (TA0007), where adversaries enumerate network
    connections to orient themselves before lateral movement. Correlate successful logons (4624) with
    subsequent process creation (4688) via LogonId/SessionGuid and alert if one account executes discovery
    commands from more than 3 unique hosts within a 1-hour window, excluding known admin/service accounts
    (structural login modeling per Siadati and Memon).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Domain Controllers (for login events), All Endpoints and Servers (for process events), Identity
    and Access Management Systems, Centralized SIEM/Log Aggregator'
  range: Last 90 days; correlate within 1-hour windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join logon(4624) and process_creation(4688) on LogonId/SessionGuid

      | where image in (net.exe,netstat.exe,discovery_utilities)

      | bin 1h, stats dcount(host) as hosts by user, window

      | where hosts>3 and user NOT in (admin,service_accounts)

      | alert user, hosts'
- question: Does the number of unique source hosts from which a user runs discovery commands exceed 3
    standard deviations above their 30-day mean, and were there failed logons (4625) preceding the discovery
    activity?
  context: Deviation from a user's normal host footprint, combined with failed-logon precursors, indicates
    account compromise. This supports the Discovery tactic (TA0007), where adversaries enumerate network
    connections to orient themselves before lateral movement. Keep a 30-day rolling baseline of the number
    of unique source hosts each user runs discovery commands from and alert above 3 standard deviations
    from the user's mean. Add a State metric tracking the count of failed logons (4625) preceding the
    discovery activity as a distinct signal of account abuse (Hopper).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Domain Controllers (for login events), All Endpoints and Servers (for process events), Identity
    and Access Management Systems, Centralized SIEM/Log Aggregator'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stats dcount(host) as uniq_hosts by user, day

      | join user_baseline on user

      | where uniq_hosts > mean+3*std

      | lookup failed_logons(4625) preceding by user

      | alert user, uniq_hosts, prior_failed_logons'
- question: Does a UEBA model (Isolation Forest plus temporal link-prediction over the authentication
