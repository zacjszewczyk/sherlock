- question: Did a single cloud principal issue more than 10 distinct network/VPC Describe*/List* API actions
    within a 10-minute window, call from an unsanctioned source IP/ASN, or generate a burst of AccessDenied/errorCode
    responses?
  context: Cloud network enumeration (DescribeVpcs, DescribeSubnets, DescribeNetworkInterfaces, DescribeVpcPeeringConnections,
    DescribeSecurityGroups, DescribeRouteTables and Azure/GCP equivalents) maps the virtual network for
    lateral movement. This supports the Discovery tactic (TA0007), where adversaries enumerate network
    connections to orient themselves before lateral movement. Alert when a principal issues more than
    10 distinct network/VPC Describe*/List* actions within a 10-minute window, any such call from an unsanctioned
    source IP/ASN, and treat a spike in AccessDenied/errorCode responses as a primary discovery signal
    (Splunk AWS IAM AccessDenied Discovery).
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - GCP Cloud Audit Logs
  - 'NAI: Cloud control-plane audit log aggregation (CloudTrail/Activity/Audit Logs), CSPM/SIEM, IAM identity
    store'
  range: Last 90 days; 10-minute windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'cloudtrail/azure_activity/gcp_audit

      | where eventName matches (''Describe*'',''List*'') and network_scope

      | bin 10m, stats dcount(eventName) as actions, sum(errorCode!=null) as denied by principal, window

      | where actions>10 OR source_ip NOT in sanctioned OR denied>denied_thr

      | alert principal, actions, denied, source_ip'
- question: Is a cloud principal calling a network-enumeration API it has never called before (first-seen),
    and how do its calls/min Frequency and AccessDenied ratio compare to its baseline?
  context: First-seen privileged enumeration by an identity that never performed it suggests compromise
    or misuse. This supports the Discovery tactic (TA0007), where adversaries enumerate network connections
    to orient themselves before lateral movement. Baseline each principal's historical network-enumeration
    API set and alert on first-seen actions (e.g., a role that never called DescribeNetworkInterfaces
    suddenly does), using per-principal first-seen detection (Netflix CloudTrail Anomaly Detector). Track
    per-principal Frequency (calls/min) and AccessDenied ratio as distinct metrics.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - GCP Cloud Audit Logs
  - 'NAI: Cloud control-plane audit log aggregation (CloudTrail/Activity/Audit Logs), CSPM/SIEM, IAM identity
    store'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for principal, api in network_enum_calls:\n  if api NOT in baseline_api_set(principal):\n\
