name: 'T1559.002: Dynamic Data Exchange'
id: 59eca7d7-2ec7-41bd-a204-5d785f5ffdc8
description: 'Investigate potential abuse of Windows Dynamic Data Exchange (DDE) for arbitrary command
  execution. DDE is a legacy inter-process communication protocol that adversaries weaponize by embedding
  DDE/DDEAUTO field codes or spreadsheet formulas (e.g., =cmd|..., =powershell|...) into Microsoft Office
  documents and CSV files, enabling macro-less code execution typically delivered via phishing or hosted
  web content. This playbook helps an analyst hunt the full kill chain: malicious documents traversing
  network/email gateways and file shares that contain DDE syntax or obfuscated/encoded formula payloads;
  Office applications (WINWORD.EXE, EXCEL.EXE, POWERPNT.EXE, etc.) spawning command interpreters or scripting
  hosts (cmd.exe, powershell.exe, mshta.exe, rundll32.exe, regsvr32.exe); registry tampering that re-enables
  DDE or disables the Office child-process attack-surface-reduction rule; remote DDE invocation via DCOM/RPC;
  and anomalous outbound network connections originating from Office processes or their children. It combines
  deterministic symbolic-logic detections, statistical baselining/anomaly methods, and machine-learning
  classifiers so the analyst can confirm or rule out DDE-based execution.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are files transferred over the network (.docx, .xlsx, .csv, .rtf) carrying embedded DDE syntax
    such as DDEAUTO/DDE field codes or spreadsheet formulas like =cmd|, =powershell|, =mshta|, =regsvr32|
    that initiate command execution?
  context: 'DDE-poisoned documents are the primary delivery vehicle for macro-less code execution in this
    technique. Scanning file content in flight with a YARA/inspection engine on network and email sensors
    lets you catch the literal field/formula primitives (DDEAUTO, =cmd|...) before they ever reach an
    endpoint. For OOXML files, unzip and inspect word/document.xml and xl/worksheets/*.xml for instrText/fldSimple
    nodes containing DDE. A match is a strong, deterministic indicator of weaponization and should capture
    the file hash, source/destination IPs, protocol, and user for triage and blocking; absence does not
    fully clear obfuscated payloads, which the statistical/ML methods address. This directly supports
    the Execution tactic by intercepting the payload that would run code. References: [Macro-less Code
    Execution in MSWord, SensePost](https://sensepost.com/blog/2017/macro-less-code-exec-in-msword/).'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek smb_files.log
  - Zeek smtp.log
  - 'NAI: Network egress/ingress points (e.g., internet gateway, email gateway), internal file servers,
    and cloud storage repositories (e.g., SharePoint, OneDrive) accessible by end-users.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  files.log OR smtp.log OR http.log OR smb_files.log\n  | extract file bytes -> yara_scan(rules=DDE_keywords)\n\
      \  | rule DDE_keywords: strings $a=/DDEAUTO/i $b=/\\sDDE\\s/i $c=/=cmd\\|/i $d=/=powershell\\|/i\
      \ $e=/=mshta\\|/i $f=/=regsvr32\\|/i condition any of them\n  | if OOXML: unzip -> grep word/document.xml,xl/worksheets/*.xml\
      \ for instrText|fldSimple containing 'DDE'\n  | alert with file_hash, src_ip, dst_ip, proto, user"
- question: Do any CSV or OOXML cells/fields exhibit Shannon entropy spikes (>7.2 bits/byte or above the
    99.5th percentile of a 30-day document baseline) indicating an obfuscated or encoded payload hidden
    inside a DDE formula?
  context: 'Adversaries encode or pack the payload portion of a DDE formula to evade keyword matching.
    Plaintext document text typically ranges ~4.5-6.5 bits/byte, while packed/encoded content exceeds
    ~7.2 bits/byte. By parsing each cell/field and computing Shannon entropy, you surface obfuscated content
    even when the literal keywords are mangled. Calibrate against a 30-day baseline of legitimate documents
    so naturally high-entropy fields (e.g., GUIDs, base64 attachments) do not flood the analyst. A high-entropy
    cell warrants extracting and decoding the content to confirm a DDE command. This adds statistical
    depth to the Execution-stage payload hunt. References: [Using Entropy Analysis to Find Encrypted and
    Packed Malware, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek smb_files.log
  - Zeek smtp.log
  - 'NAI: Network egress/ingress points (e.g., internet gateway, email gateway), internal file servers,
    and cloud storage repositories (e.g., SharePoint, OneDrive) accessible by end-users.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for file in (csv|ooxml):\n    for cell in parse_cells(file):\n      H = shannon_entropy(cell)\n\
      \      if H > 7.2 OR H > percentile(baseline_30d, 99.5):\n        alert(file_hash, cell_ref, H,\
      \ user)"
- question: Does extracted formula/field text score as heavily obfuscated when measured against a benign
    document corpus using interpretable features like character-frequency distribution, special-character
    ratio, and token-category counts?
  context: 'Beyond raw entropy, Revoke-Obfuscation-style interpretable features capture the statistical
    fingerprint of obfuscated command text (skewed character frequencies, high special-character ratios,
    unusual token mixes). Comparing extracted DDE formula/field strings against a benign corpus and alerting
    above the 99th percentile catches deliberately obfuscated commands that evade signatures. Including
    the top contributing features in the alert tells the analyst exactly why it scored high, accelerating
    triage. This strengthens detection of evasive Execution payloads delivered through documents. References:
    [Revoke-Obfuscation, Bohannon and Holmes](https://github.com/danielbohannon/Revoke-Obfuscation).'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek smb_files.log
  - Zeek smtp.log
  - 'NAI: Network egress/ingress points (e.g., internet gateway, email gateway), internal file servers,
    and cloud storage repositories (e.g., SharePoint, OneDrive) accessible by end-users.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  feats = extract_features(formula_text)  # char_freq, special_char_ratio, token_counts\n\
      \  score = obfuscation_model(feats)\n  if score > percentile(benign_corpus, 99):\n    alert(file_hash,\
      \ score, top_features(feats,3))"
- question: When a supervised classifier is run over inbound Office/CSV documents, do any score as malicious
    with high confidence based on DDE-keyword frequency, file metadata, OOXML structure, and entropy/character
    features?
  context: 'A supervised binary classifier (e.g., XGBoost/Gradient Boosting) trained on labeled benign
    vs. malicious documents fuses many weak signals — DDE keyword/formula frequency, author/template metadata,
    count of external relationship links and field codes, and per-cell entropy/character features — into
    a single robust verdict that is harder to evade than any individual rule. Alerting on confidence >0.9
    and surfacing the top-3 contributing features gives the analyst an explainable, high-precision lead
    on weaponized documents. This is the ML backstop for Execution-stage document delivery. References:
    [Detecting Malicious PowerShell Commands using Deep Neural Networks, Hendler et al.](https://arxiv.org/abs/1804.04177);
    [Revoke-Obfuscation, Bohannon and Holmes](https://github.com/danielbohannon/Revoke-Obfuscation).'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek smb_files.log
  - Zeek smtp.log
  - 'NAI: Network egress/ingress points (e.g., internet gateway, email gateway), internal file servers,
    and cloud storage repositories (e.g., SharePoint, OneDrive) accessible by end-users.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = featurize(doc)  # dde_kw_freq, metadata, ext_rel_links, field_code_count, entropy,\
      \ char_freq\n  p = xgboost_model.predict_proba(X)[malicious]\n  if p > 0.9:\n    alert(file_hash,\
      \ p, top3_shap(X))"
- question: Is any Microsoft Office application (WINWORD.EXE, EXCEL.EXE, POWERPNT.EXE, OUTLOOK.EXE, MSACCESS.EXE,
    VISIO.EXE) the parent process of a command interpreter or scripting host such as cmd.exe, powershell.exe,
    mshta.exe, rundll32.exe, regsvr32.exe, wscript.exe, cscript.exe, certutil.exe, msiexec.exe, or bitsadmin.exe?
  context: 'This canonical parent-child relationship is the single most reliable on-host signal of DDE
    (and macro) abuse: Office apps have no legitimate reason to spawn shells or LOLBins. Build a high-severity
    SIEM rule over Windows Event ID 4688 / Sysmon Event ID 1 matching the Office parent set against the
    interpreter/LOLBin child set, and always capture the full child command line for triage. Maintain
    a curated allow-list for Office add-ins and click-to-run updaters to suppress benign noise. A hit
    strongly indicates successful Execution and should trigger immediate host investigation. References:
    [Suspicious Microsoft Office Child Process, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_office_susp_child_processes/);
    [Detect Prohibited Applications Spawning cmd.exe, Splunk](https://research.splunk.com/endpoint/dcfd6b40-42f9-469d-a433-2e53f7486664/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, terminal servers (e.g., Citrix), Microsoft Office 365 servers, and application
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  EventID IN (4688, Sysmon:1)\n  AND ParentImage IN (WINWORD.EXE,EXCEL.EXE,POWERPNT.EXE,OUTLOOK.EXE,MSACCESS.EXE,VISIO.EXE)\n\
      \  AND Image IN (cmd.exe,powershell.exe,pwsh.exe,mshta.exe,rundll32.exe,regsvr32.exe,wscript.exe,cscript.exe,certutil.exe,msiexec.exe,bitsadmin.exe)\n\
      \  AND NOT allowlist(parent,child)\n  | alert SEVERITY=high with full CommandLine"
- question: Does an Office-spawned child process command line contain encoded-command flags (-enc/-EncodedCommand),
    long Base64 blobs, or download cradles (Net.WebClient, DownloadString, Invoke-WebRequest, IEX) indicating
    a second-stage payload?
  context: 'Once DDE launches an interpreter, the adversary commonly retrieves or decodes a second stage.
    Encoded-command switches, long Base64 strings, and download cradles are reliable indicators of that
    staging. Layering this content rule on top of the Office-parent context dramatically raises confidence
    and severity — an Office app whose child runs an encoded/downloading command is almost certainly malicious.
    This targets the immediately-following Execution/staging step and gives the analyst the exact command
    to decode and investigate. References: [Suspicious Encoded PowerShell Command Line, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, terminal servers (e.g., Citrix), Microsoft Office 365 servers, and application
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  EventID IN (4688, Sysmon:1) AND ParentImage IN (Office_apps)\n  AND ( CommandLine MATCHES\
      \ /-enc|-EncodedCommand/i\n        OR CommandLine MATCHES /[A-Za-z0-9+\\/]{200,}={0,2}/\n      \
      \  OR CommandLine MATCHES /Net\\.WebClient|DownloadString|Invoke-WebRequest|IEX/i )\n  | escalate\
      \ SEVERITY=critical"
- question: Are there registry writes to Office DDE feature-control keys or attack-surface-reduction (ASR)
    rule values that re-enable DDE (setting AllowDDE / clearing default disable keys) or disable the Office
    child-process ASR rule?
  context: 'DDE is disabled by default in patched Office; an adversary or a malicious document must re-enable
    it, or disable the ASR rule that blocks Office child processes, to succeed. Monitoring registry writes
    (Event ID 4657 / Sysmon EID 13) to these specific keys is a deterministic precursor to DDE execution.
    Any modification outside an approved change window is suspicious and should be alerted. Detecting
    this lets the analyst catch attempts before or alongside the actual code execution, supporting the
    Execution tactic at the enabling-configuration stage. References: [Dynamic Data Exchange (T1559.002),
    MITRE ATT&CK](https://attack.mitre.org/techniques/T1559/002/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, terminal servers (e.g., Citrix), Microsoft Office 365 servers, and application
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  EventID IN (4657, Sysmon:13)\n  AND TargetObject MATCHES /Office\\\\.*\\\\Security|AllowDDE|DontUpdateLinks|Word\\\
      \\Options|Defender\\\\.*ASR/i\n  AND (Action='SetValue' enabling DDE OR disabling ASR rule)\n  AND\
      \ NOT within_change_window()\n  | alert(user, host, key, old_value, new_value)"
- question: Across a 30-day enterprise baseline, is an observed Office parent-child process pair statistically
    rare (pair probability in the bottom 5th percentile or seen on fewer than ~0.3% of hosts)?
  context: 'Even when a specific child binary is not on a static blocklist, rarity is a powerful signal.
    Aggregating process-creation events into a frequency table of parent-child pairs and computing each
    pair''s empirical probability and host-prevalence lets you flag an Office app spawning an uncommon
    child that deterministic rules might miss. Trigger a medium-severity alert when the pair probability
    is in the bottom 5th percentile or the pair is seen on very few hosts (derive N from fleet size).
    This statistical method generalizes detection of novel DDE-driven Execution beyond known LOLBins.
    References: [CAR-2014-11-002 Outlier Parents of Cmd, MITRE CAR](https://car.mitre.org/analytics/CAR-2014-11-002/);
    [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365);
    [What''s the deal with prevalence, F-Secure](https://blog.f-secure.com/whats-the-deal-with-prevalence/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, terminal servers (e.g., Citrix), Microsoft Office 365 servers, and application
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = stats(Sysmon:1, window=30d) by ParentImage,Image -> count, host_count, P(pair)\n\
      \  for event where ParentImage IN Office_apps:\n    if P(pair) <= percentile(base.P, 5) OR host_count\
      \ < N(fleet):\n      alert SEVERITY=medium (parent, child, P, host_count)"
- question: Does any host or user show a daily count of Office-spawned interpreter children exceeding
    its own baseline (mean + 3 standard deviations), and is there a spike in ASR-blocked/denied Office
    child launches?
  context: 'Per-host/per-user z-score baselining of Office-child interpreter launches catches a host that
    suddenly starts producing many such events relative to its own history, even if each individual launch
    looks plausible. Report observed count, baseline mean, and sigma so the analyst can judge magnitude.
    Critically, track ASR-blocked/denied executions as a distinct state signal: a spike in blocked Office
    child launches indicates attempted DDE even when execution failed — a high-value early warning that
    the deterministic success rules would not surface. This supports detecting both successful and attempted
    Execution. References: [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer and
    Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, terminal servers (e.g., Citrix), Microsoft Office 365 servers, and application
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  daily = count(Office_parent -> interpreter_child) by host,user,day\n  mu,sd = baseline(daily,\
      \ prior 30d)\n  if today_count > mu + 3*sd: alert(host,user,today_count,mu,sd)\n  blocked = count(ASR_blocked\
      \ Office child) by host,day\n  if blocked > baseline: alert(attempted_DDE, host, blocked)"
- question: When Office-originated process events are scored with unsupervised anomaly detection and command-line
    ML classifiers, do any rank as highly anomalous or malicious?
  context: 'An Isolation Forest over Office-originated process events (features: parent image, child image,
    user context, command-line length, command-line Shannon entropy, time-of-day) flags outliers that
    don''t match learned-normal behavior. Running this alongside a character-level CNN/LSTM classifier
    on the child command line and a supervised process-lineage model provides multiple independent verdicts.
    High anomaly/maliciousness scores with the top-3 contributing features surfaced give the analyst an
    explainable, high-confidence lead on DDE-driven Execution that resists simple evasion. References:
    [Isolation Forest, Liu, Ting, and Zhou](https://doi.org/10.1145/2133360.2133363); [Detecting Malicious
    PowerShell Commands using Deep Neural Networks, Hendler et al.](https://arxiv.org/abs/1804.04177);
    [ProblemChild, Elastic](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, terminal servers (e.g., Citrix), Microsoft Office 365 servers, and application
    servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  feats = [parent_image, child_image, user, cmd_len, cmd_entropy, hour]\n  s1 = isolation_forest.score(feats)\n\
      \  s2 = charcnn_lstm.score(child_cmdline)\n  s3 = lineage_model.score(process_tree)\n  if max(s1,s2,s3)\
      \ > threshold:\n    alert(host, scores, top3_features)"
- question: On a single host and user within a ~60-second window, do you see an Office document file creation/modification,
    followed by an Office app spawning a suspicious child process, followed by that child connecting to
    a non-RFC1918 external IP?
  context: 'This temporal correlation captures the complete DDE execution flow — document touched, interpreter
    spawned by Office, then outbound C2/download — and is far higher fidelity than any single event. Build
    a SIEM correlation rule keyed on the same HostName and User within 60 seconds combining Sysmon EID
    11 (file ending .doc*/.xls*/.csv/.rtf), Sysmon EID 1 (Office parent -> interpreter child), and Sysmon
    EID 3 (same child ProcessId to a non-RFC1918 destination). Emit a critical alert with the full event
    chain. A match is near-conclusive of active DDE Execution with command-and-control egress. References:
    [Suspicious Microsoft Office Child Process, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_office_susp_child_processes/).'
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User workstations, DMZ web servers, email servers, and the network perimeter.'
  range: Last 90 days, correlate events within a 60-second window per host/user
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  correlate by HostName,User within 60s:\n    A: Sysmon:11 TargetFilename ENDSWITH (.doc*,.xls*,.csv,.rtf)\n\
      \    B: Sysmon:1 ParentImage IN Office_apps AND Image IN interpreters\n    C: Sysmon:3 ProcessId\
      \ == B.ProcessId AND DestIp NOT in RFC1918\n  WHEN A->B->C: alert SEVERITY=critical with full_chain"
- question: Is there an inbound DCOM/RPC connection (TCP 135 plus ephemeral port) with a preceding logon
    event immediately before an Office process spawns an interpreter, especially where the spawning user
    differs from the interactive console user?
  context: 'DDE can be invoked remotely via Distributed Component Object Model (DCOM), letting an adversary
    with valid credentials trigger Office code execution without an interactive session. Correlating an
    inbound DCOM/RPC connection (TCP 135 + ephemeral) and logon events (4624/4648) with a subsequent Office-spawns-interpreter
    event reveals this remote vector. Alerting when the spawning user differs from the interactive console
    user is a strong tell of remote, unattended invocation. This links the Execution technique to lateral-movement
    tradecraft (T1021.003) and helps the analyst distinguish local phishing from remote operator activity.
    References: [Remote Services: Distributed Component Object Model (T1021.003), MITRE ATT&CK](https://attack.mitre.org/techniques/T1021/003/);
    [Dynamic Data Exchange (T1559.002), MITRE ATT&CK](https://attack.mitre.org/techniques/T1559/002/).'
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User workstations, DMZ web servers, email servers, and the network perimeter.'
  range: Last 90 days, correlate logon/DCOM and process spawn within a few seconds per host
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  correlate by HostName within short window:\n    N: (Sysmon:3 OR Zeek conn.log) DstPort=135\
      \ + ephemeral (inbound DCOM/RPC)\n    L: EventID IN (4624,4648) logon\n    P: Sysmon:1 ParentImage\
      \ IN Office_apps AND Image IN interpreters\n  WHEN N->L->P AND P.User != interactive_console_user:\n\
      \    alert(remote_DDE_via_DCOM, host, remote_ip, user)"
- question: For symbolic-rule hits, does the enriched destination IP accumulate a high additive risk score
    (new country for the department, malicious ASN, off-hours, low fleet prevalence), and are there NXDOMAIN/failed/blocked
    attempts from the child process?
  context: 'Enriching the destination of a DDE-chain hit with threat intel, geolocation, ASN reputation,
    time-of-day, and fleet-wide host-prevalence and computing an additive risk score (+10 new country
    for department, +15 malicious-hosting ASN, +5 off-hours, +10 below 5th-percentile prevalence) lets
    you auto-escalate the most dangerous egress (score >20) while deprioritizing benign updates. Separately
    counting NXDOMAIN/failed/blocked connection attempts from the child captures failed C2/download attempts
    — a distinct failure-mode signal that still proves attempted Execution. This sharpens triage of the
    network leg of the DDE chain. References: [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365);
    [What''s the deal with prevalence, F-Secure](https://blog.f-secure.com/whats-the-deal-with-prevalence/).'
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User workstations, DMZ web servers, email servers, and the network perimeter.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for hit in symbolic_rule_hits:\n    score = 0\n    if dst_country NOT in dept_history:\
      \ score += 10\n    if asn in malicious_asn_list: score += 15\n    if outside_business_hours(hit):\
      \ score += 5\n    if host_prevalence(dst) < percentile(fleet,5): score += 10\n    if score > 20:\
      \ escalate(hit, score)\n  count(NXDOMAIN|failed|blocked from child) -> attempted_c2_signal"
- question: When user session event chains (file open -> helper process -> network call) are modeled with
    an HMM, do any observed sequences fall below the 0.01 percentile likelihood of benign sequences, indicating
    a deviant DDE execution flow?
  context: 'A Hidden Markov Model trained on benign user session chains learns the normal transition probabilities
    between file, process, and network states. A DDE attack produces an atypical state sequence (e.g.,
    document open -> shell -> external connect) whose overall likelihood is far lower than benign sessions.
    Flagging sequences below the 0.01 percentile and reporting the lowest-probability transition(s) gives
    the analyst both a detection and an explanation of which step was anomalous. This ML method generalizes
    detection of novel DDE Execution flows that evade fixed correlation rules. References: [Detecting
    Intrusions Using System Calls: Alternative Data Models, Warrender, Forrest, Pearlmutter](https://ieeexplore.ieee.org/document/766910).'
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User workstations, DMZ web servers, email servers, and the network perimeter.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  hmm = train_hmm(benign_session_chains)  # states: file,process,network\n  for seq in\
      \ observed_session_chains:\n    L = hmm.loglik(seq)\n    if L < percentile(benign_logliks, 0.01):\n\
      \      alert(host, user, seq, lowest_prob_transition(seq))"
- question: Does an Office process (WINWORD.EXE, EXCEL.EXE, POWERPNT.EXE, ...) or its non-standard child
    initiate a network connection to a destination port outside the expected set (not 80, 443, or 53)?
  context: 'Office applications normally talk to a small set of services over standard ports. A connection
    to an unusual destination port from an Office process or its non-standard child is a simple, deterministic
    indicator of DDE-driven C2 or download activity. Build a Sysmon EID 3 / Zeek conn.log rule alerting
    when an Office-imaged process (or its child) connects on a port not in (80,443,53), with exceptions
    for known-good corporate destinations (internal SharePoint, M365 update/telemetry). A hit warrants
    pivoting to the originating process tree to confirm DDE Execution. References: [Dynamic Data Exchange
    (T1559.002), MITRE ATT&CK](https://attack.mitre.org/techniques/T1559/002/).'
  answer_sources:
  - Sysmon Event ID 3
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All endpoints and servers running Microsoft Office, and the network gateway.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  (Sysmon:3 OR Zeek conn.log)\n  WHERE Image IN Office_apps OR ParentImage IN Office_apps\n\
      \  AND DstPort NOT IN (80,443,53)\n  AND DstIp NOT IN corporate_allowlist\n  | alert(host, image,\
      \ dst_ip, dst_port, user)"
- question: Against a 30-day per-Office-process network baseline, does any connection breach the bytes-out
    (mean + 4 sigma), use a destination port outside the established set, exceed the 3-sigma connection-rate,
    or generate excess blocked/RST/failed connections?
  context: 'A multi-dimensional per-process network baseline — set of unique destination ports, bytes-sent/received
