questions:
- question: '[Impact] Hash/signature match: Can you determine whether a file written to a web server directory,
    or an HTTP response body served from it, contains content that matches a known defacement signature,
    deviates cryptographically from its approved deployment baseline, or is statistically dissimilar to
    its previous version. -- specifically, using the ''Hash/signature match'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary defaces an organization''s
    external-facing web applications by overwriting hosted content to deliver messaging, undermine trust
    in the system''s integrity, or stage a follow-on drive-by compromise, leaving traces in web-root file
    writes, served HTTP responses, inbound request content, process lineage, and upload behavior. This
    evidence focuses on the condition that a file written to a web server directory, or an HTTP response
    body served from it, contains content that matches a known defacement signature, deviates cryptographically
    from its approved deployment baseline, or is statistically dissimilar to its previous version. This
    Symbolic Logic approach looks for the following signal: Compare Windows Event ID 4663 web file writes
    and Zeek http.log response bodies against TI defacement hashes/signatures and alert on matches. A
    positive result -- a rule match, statistical outlier, or model alert -- suggests an external web asset''s
    content or the requests that modified it deviate from the approved deployment baseline and legitimate
    traffic, consistent with defacement or its precursor exploitation; pivot to the changed file path
    and old/new hash, the modifying user and parent process, the source IP and request that drove the
    change, and any web shell or upload that preceded it. A negative result helps rule out this defacement
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss low-and-slow tampering, novel exploit strings, or living-off-the-land modification by valid
    credentials.'
  answer_sources: &id001
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4663
  - 'NAI: File systems of public-facing web servers (e.g., C:\inetpub\wwwroot, /var/www/html), network
    traffic egress points capturing HTTP responses, and file integrity monitoring agent logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Hash/signature match\n\nsource IN [Zeek http.log, Zeek files.log, Windows Event ID 4663]\n\
      \n| WHERE matches_action_criteria(\"Hash/signature match\")\n\n// Compare Windows Event ID 4663\
      \ web file writes and Zeek http.log response bodies against TI defacement hashes/signatures \n\n\
      | ALERT enrich(host, user, src_ip, process, parent, file, uri, hash)"
  - technology: Zeek/pseudocode
    query: '# Defacement web-content correlation


      http.log, files.log, conn.log


      | FILTER requests/responses for target web hosts and upload/admin endpoints


      | JOIN inbound exploit/upload requests to served-response changes on (host, uri, time-window)


      | flag exploit signatures, anomalous bodies, or content drift per action criteria'
