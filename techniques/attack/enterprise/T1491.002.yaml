name: 'T1491.002: External Defacement'
id: 671f89c6-dd81-4023-98a1-290ef932a189
description: 'This playbook helps an analyst investigate whether an adversary has impacted the integrity
  of external-facing web applications through defacement (T1491.002) as part of the Impact tactic, where
  attackers overwrite hosted HTML/JS/CSS to deliver messaging, intimidate, spread propaganda, or stage
  a follow-on drive-by compromise. It guides the hunt across the full defacement kill chain and across
  platforms (Windows/IIS, Linux/Apache, macOS, and IaaS cloud-hosted sites): detecting modified web-root
  files or served HTTP responses that match known defacement signatures, deviate cryptographically from
  an approved deployment baseline (sha256 FIM manifests), drop in structural similarity, jump in Shannon
  entropy (injected obfuscated payloads), or land outside the approved maintenance window; spotting inbound
  exploitation attempts (SQLi, XSS, command injection, path traversal, malicious file upload) against
  the application via OWASP CRS signatures, per-endpoint parameter anomaly models, HTTP error-rate spikes,
  and injected iframe/redirect heuristics; identifying web content written by non-standard accounts, at
  anomalous times, in abnormal volumes, or by rare/illegitimate parent processes; catching web shells
  where the web server process (w3wp.exe, apache2) spawns command shells or reconnaissance tooling; and
  surfacing suspicious script-file uploads, oversized POST bodies, and upload-rejection-then-success filter-bypass
  patterns. Detection methods combine symbolic-logic rules, statistical baselining, and machine learning
  applied to Zeek http/files/conn logs, WAF and reverse-proxy logs, Windows Security/Sysmon events (4663/4670/4656/4688/1),
  auditd syscalls, macOS unified logs, and cloud audit trails (AWS CloudTrail), so the analyst can corroborate
  suspected defacement against file integrity, request content, modifier identity, process lineage, and
  upload behavior.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
