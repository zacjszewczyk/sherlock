questions:
- question: '[Stealth] ROMMON transfer correlation: Can you determine whether a ROMMON image or boot-helper
    file is transferred from a non-approved management host, or the file hash matches known malicious
    firmware linked to network-device persistence. -- specifically, using the ''ROMMON transfer correlation''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary who has reflashed a network
    device''s ROMMON/boot image can persist beneath the operating system and quietly manipulate, filter,
    or redirect traffic while evading host-based defenses; the resulting traces appear in firmware-transfer,
    device-command, reboot, and network-flow telemetry. This evidence focuses on the condition that a
    ROMMON image or boot-helper file is transferred from a non-approved management host, or the file hash
    matches known malicious firmware linked to network-device persistence. This Symbolic Logic approach
    looks for the following signal: Correlate ROMMON-related transfers (Zeek files.log over TFTP/FTP/SCP)
    with authorized management sessions, hash each image against known-malicious firmware feeds, and alert
    when the source host is outside the approved management allowlist; note that SYNful Knock implant
    images match legitimate image size, so size alone is insufficient [SYNful Knock, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/)
    [CISA TA18-106A](https://www.cisa.gov/news-events/alerts/2018/04/16/russian-state-sponsored-cyber-actors-targeting-network-infrastructure).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests that a network
    device may be running tampered firmware or behaving as a covert implant; pivot to the device''s golden-image
    attestation, the responsible management session and source host, the surrounding reboot/boot-config
    events, and any emergent outbound connections or filtered flows. A negative result helps rule out
    this ROMMONkit vector but should be corroborated with the other questions in this playbook, since
    a sophisticated implant can match legitimate image size, suppress its own logs, and selectively hide
    its activity.'
  answer_sources: &id001
  - Zeek files.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Core routers, edge firewalls, TFTP/SCP/FTP management servers, and DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# ROMMON transfer correlation

      source IN [Zeek files.log, Zeek conn.log, Zeek dns.log]

      | WHERE matches_action_criteria("ROMMON transfer correlation")

      // Correlate ROMMON-related transfers (Zeek files.log over TFTP/FTP/SCP) with authorized management
      sessions, hash each ima

      | ALERT enrich(device, mgmt_source, image_hash, boot_config, reboot, dest)'
  - technology: Zeek/pseudocode
    query: '# ROMMON transfer correlation (Zeek)

      files.log, conn.log, dns.log

      | FILTER network-device IPs and management/TFTP/firmware activity

      | CORRELATE transfer -> reboot -> emergent connection per (id.orig_h, time-window)

      | flag deviations per action criteria and enrich destinations'
