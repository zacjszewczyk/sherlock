name: 'T1542.004: Pre-OS Boot: ROMMONkit'
id: b109c1fa-e0ff-40cb-b830-8f956a764dfb
description: 'This playbook helps an analyst investigate whether an adversary has compromised the ROM
  Monitor (ROMMON) firmware of Cisco-style network devices to gain stealthy, boot-level persistence (e.g.,
  SYNful Knock-class implants) under both the Persistence (TA0003) and Stealth (TA0005) tactics. It guides
  the hunt across multiple, corroborating angles drawn from network and device telemetry: unauthorized
  or known-malicious ROMMON/boot-helper image transfers (TFTP/FTP/SCP) from hosts outside the management
  allowlist and golden-image integrity mismatches verified out-of-band; suspicious CLI/AAA command chains
  for firmware modification (copy tftp flash:, config-register, boot system flash, reload) and co-occurring
  log suppression (clear logging / no logging); TFTP connections to or from sources not on the approved
  management allowlist and rare destinations by geo/ASN; unscheduled reboots followed by anomalous post-reboot
  connections, DNS, and traffic; selective filtering of security-infrastructure traffic (elevated REJ/RST/timeout
  rates); low-level packet artifacts such as anomalous TTLs and non-standard DNS opcodes/record types;
  sustained shifts in protocol-mix entropy and per-protocol volume; and cessation of expected management
  traffic (syslog/SNMP/NTP) that may indicate concealment. Detection methods combine symbolic-logic rules,
  statistical baselining/change-point analysis, and machine-learning models applied to Zeek logs (conn,
  dns, files, ftp, snmp, ntp, weird, notice, conn_summary), networkdevice:syslog/config, TACACS+/AAA accounting,
  NSM flow, and Windows authentication events, so the analyst can correlate firmware tampering, device
  reboots, and emergent command-and-control behavior into a defensible determination.'
type: technique
