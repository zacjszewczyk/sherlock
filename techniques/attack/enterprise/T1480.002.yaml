questions:
- question: '[Stealth] Threat intel named pipe/mutex match (Symbolic Logic): Can you determine whether
    a process creates a named pipe or is launched with a command-line argument that contains a name matching
    a known malicious mutex or pipe from threat intelligence. -- specifically by applying the ''Threat
    intel named pipe/mutex match'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), this technique (T1480.002: Execution
    Guardrails: Mutual Exclusion) covers adversaries who constrain execution using a mutex, named pipe,
    or lock file so that malware verifies whether a host is already compromised and avoids running a second
    instance -- a stealthy check-and-exit behavior that blends in with benign synchronization. This evidence
    focuses on the condition that a process creates a named pipe or is launched with a command-line argument
    that contains a name matching a known malicious mutex or pipe from threat intelligence. This Symbolic
    Logic approach works as follows: Match Sysmon Event ID 17/18 `PipeName` and Windows Event ID 4688
    `CommandLine` against curated lists of known-malicious mutex and pipe names (e.g., Cobalt Strike `\postex_*`,
    `\msagent_*`, `\MSSE-*-server`; Metasploit `\msf-pipe-*`) drawn from threat intel and offensive-tool
    catalogs, alerting on direct hits ([Detecting Cobalt Strike Default Modules via Named Pipe Analysis](https://labs.withsecure.com/publications/detecting-cobalt-strike-default-modules-via-named-pipe-analysis);
    [CobaltStrike Named Pipe Patterns Sigma Rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/pipe_created/pipe_created_hktl_cobaltstrike_susp_pipe_patterns.yml);
    [Named Pipes, Sysmon Community Guide](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/named-pipes.md)).
    Keep allowlist filters (Chrome `mojo.*`, Websense `DserNamePipe*`) to suppress known benign collisions.
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
    a process is performing mutual-exclusion guardrail logic to detect prior infection or to impersonate/probe
    a known channel; pivot to the responsible process, its parent lineage, the user and host context,
    the mutex/pipe/lock name involved, and any subsequent network or file activity. A negative result
    helps reduce confidence in this specific vector but should be corroborated with the other questions
    in this playbook, since a single method can miss dynamically generated names, platform-specific lock
    mechanisms, or low-and-slow reinfection checks.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 17
  - Sysmon Event ID 18
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Threat intel named pipe/mutex match

      source IN [Windows Event ID 4688, Sysmon Event ID 17, Sysmon Event ID 18]

      | where matches_guardrail_condition  // Threat intel named pipe/mutex match

      | apply allowlist_filters (known-benign pipes/paths/signers)

      | alert with process, parent, user, host, pipe_or_mutex_or_lock_name'
