name: 'T1480.002: Execution Guardrails: Mutual Exclusion'
id: f2592dd7-4d7a-4a18-8e24-7ad21fa3b079
description: 'This playbook helps an analyst investigate whether an adversary is using mutual-exclusion
  guardrails (mutexes, named pipes, or lock/pid files) to check for a pre-existing infection and constrain
  execution, a stealth behavior used by malware to avoid running a second instance or to impersonate legitimate
  channels. It guides the hunt across Windows, Linux, and macOS along several behavioral angles: matching
  named pipe/mutex names against threat-intel and offensive-tool catalogs (Cobalt Strike, Metasploit)
  with benign allowlisting; detecting short-lived ''check-and-exit'' processes launched from staging directories;
  spotting off-allowlist processes that create security-tool pipe names to evade detection; correlating
  staging-directory file locks with subsequent outbound C2 connections; identifying algorithmically generated
  (high-entropy/GUID) pipe names; and recognizing the Linux/macOS open->flock/lockf/fcntl->exit_group
  sequence used by malware such as RedXOR and BPFDoor. Each angle is pursued with three complementary
  methods -- deterministic symbolic-logic rules, statistical baselining (volume, frequency, entropy, exit/return
  state, and lock-failure profiling), and explainable machine learning (XGBoost, Isolation Forest, DBSCAN,
  LSTM autoencoders, DeepLog) -- applied to Windows Security/Sysmon events, Sysmon for Linux, auditd SYSCALL
  records, macOS unified logs, and Zeek network telemetry, so the analyst can corroborate suspected guardrail
  behavior against process lineage, indicator matches, timing, and network context.'
type: technique
