    Method approach works as follows: Build per-account behavioral profiles (post time-of-day, client
    application, language, links, follower growth, hashtag/mention sets) over 90 days and flag posts violating
    the profile; group similar anomalies across accounts to detect mass compromise, per Towards Detecting
    Compromised Accounts on Social Networks (COMPA), Egele et al. Alert when metrics deviate beyond 3
    standard deviations or Jaccard similarity of hashtags/mentions drops sharply; weight by campaign burstiness
    per Who is Targeted by Email-Based Phishing and Malware?, Simoiu et al. A positive result -- a rule
    match, statistical outlier, or model alert -- indicates a likely compromised or attacker-controlled
    account interacting with your environment; pivot to the implicated user/account, the source IP/ASN
