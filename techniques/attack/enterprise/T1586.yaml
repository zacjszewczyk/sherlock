    on the condition that A password spraying or credential stuffing attack is observed, characterized
    by a high rate of authentication failures (Windows Event ID 4625) from a single source IP across numerous
    distinct user accounts within a short time frame. Associated web logs (Zeek http.log) may show user-agent
