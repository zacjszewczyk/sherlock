questions:
- question: '[Resource Development] Breached credential and threat IP correlation for logins: Can you
    determine whether An authentication attempt (Windows Event ID 4624 or 4625) is observed where the
    target username appears in a known breached credential database or the source IP from the corresponding
    network session (Zeek conn.log) is on a threat intelligence feed for credential abuse. -- specifically,
    using the ''Breached credential and threat IP correlation for logins'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    existing third-party or partner accounts (email, social media, or other services) rather than establishing
    new personas, so they can abuse the trust and relationships those accounts already hold to support
    phishing, social engineering, and follow-on targeting against your organization. This evidence focuses
    on the condition that An authentication attempt (Windows Event ID 4624 or 4625) is observed where
    the target username appears in a known breached credential database or the source IP from the corresponding
    network session (Zeek conn.log) is on a threat intelligence feed for credential abuse. This Symbolic
    Logic approach works as follows: Join Windows Event ID 4624/4625 records with Zeek conn.log and threat
    intelligence; alert when TargetUserName matches a breached-credential watchlist or the source IP is
    on credential-stuffing/brute-force feeds. Maintain the watchlist from breach corpora using privacy-preserving
    matching as in Protecting accounts from credential stuffing with password breach alerting, Thomas
    et al; treat a 4624 SUCCESS on a breached account as higher severity than a 4625. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates a likely compromised or attacker-controlled
    account interacting with your environment; pivot to the implicated user/account, the source IP/ASN
    and geolocation, the authentication or email/social telemetry around the event, and any successful
    access or delivered content to scope the compromise and contain it (reset credentials, revoke sessions,
    block sender/domain). A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, distributed,
    or highly targeted account-compromise activity that evades any one detection.'
  answer_sources:
  - Windows Event ID 4624
