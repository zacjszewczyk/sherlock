      \ watchlist or the source IP is on credential-stuffing/brute-force feeds. Maintain the watchlist\
      \ from \n| correlate over NAI: Public-facing authentication services (e.g., VPN, OWA, M365), internal\
      \ authentication servers (e.g., Domain Controllers), network egress points, and threat intelligence\
      \ platforms.\n| emit alert with contributing fields and entity context (account/user, source IP/ASN,\
      \ geo, auth outcome, sender/domain)"
  - technology: Zeek/pseudocode
    query: '# Breached credential and threat IP correlation for logins (Zeek view)

      watch conn.log/http.log/dns.log for the implicated source IPs, domains, and sessions

