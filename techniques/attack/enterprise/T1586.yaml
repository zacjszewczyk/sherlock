name: 'T1586: Compromise Accounts'
id: 59302b7a-bc28-4802-a26b-524045f32b32
description: 'This playbook helps an analyst investigate whether an adversary has compromised existing
  accounts -- such as partner or employee email accounts, social media personas, or other online services
  -- to support targeting and operations against the organization (MITRE ATT&CK T1586, Compromise Accounts).
  Because compromised accounts carry pre-existing trust and relationships, adversaries leverage them for
  Phishing for Information (T1598) and Phishing (T1566), social engineering, and persona development,
  often after gathering credentials via breach corpora, brute force, password spraying, credential stuffing,
  or purchase. Much of the account-compromise activity occurs outside the target''s direct visibility,
  so this hunt focuses detection on the observable touchpoints: authentication telemetry (Windows Event
  ID 4624/4625) correlated with network sessions (Zeek conn.log) and threat intelligence; breached-credential
  watchlist and threat-IP correlation on logins; password-spraying and credential-stuffing patterns (high
  failure fan-out across many users from one or many IPs/ASNs); distributed brute-force against single
  high-value accounts; success-after-failure and impossible-travel/unknown-geography login anomalies;
  inbound partner email exhibiting DMARC/SPF/DKIM failures, newly registered or malicious URLs, and stylometric
  deviation from the sender baseline; and social media impersonation or takeover indicated by anomalous
  posting behavior and links to recently registered domains. Detection methods combine deterministic symbolic-logic
  rules (watchlist/TI joins, stateful spray/brute-force counters, success-after-fail correlation, email-authentication
  and malicious-URL checks), statistical baselining (per-IP failure-ratio and rate percentiles, source-IP
  entropy, impossible-travel distance/time scoring, new-domain age, behavioral profiling beyond standard
  deviations), and machine learning (random forest / logistic regression login risk scoring, DBSCAN clustering
  of low-and-slow sprays, ARIMA/LSTM time-series anomaly detection, and stylometric/behavioral classifiers
  for compromised-sender and account-takeover detection), applied across Windows Security events and Zeek
  conn/http/dns logs plus email and social media telemetry, so the analyst can corroborate suspected account
  compromise across authentication, network, email, and social signals.'
