  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    existing third-party or partner accounts (email, social media, or other services) rather than establishing
    new personas, so they can abuse the trust and relationships those accounts already hold to support
    phishing, social engineering, and follow-on targeting against your organization. This evidence focuses
    on the condition that An authentication attempt (Windows Event ID 4624 or 4625) is observed where
    the target username appears in a known breached credential database or the source IP from the corresponding
    network session (Zeek conn.log) is on a threat intelligence feed for credential abuse. This Statistical
    Method approach works as follows: Baseline per-IP hourly attempt rates and the failed/total ratio
    (State metric) for each watchlist category (TOR, hosting ASN, known attacker); alert when a single
    IP exceeds the 95th percentile of its category. Weight risk priors using observed breached-credential
    reuse base rates (~1.5% of logins) from Protecting accounts from credential stuffing with password
    breach alerting, Thomas et al and burst timing from Who is Targeted by Email-Based Phishing and Malware?,
    Simoiu et al. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    a likely compromised or attacker-controlled account interacting with your environment; pivot to the
    implicated user/account, the source IP/ASN and geolocation, the authentication or email/social telemetry
    around the event, and any successful access or delivered content to scope the compromise and contain
    it (reset credentials, revoke sessions, block sender/domain). A negative result helps rule out this
    particular vector but should be corroborated with the other questions in this playbook, since a single
    method can miss low-and-slow, distributed, or highly targeted account-compromise activity that evades
    any one detection.'
