questions:
- question: Has any Unix/Linux/ESXi host received an SSH/SCP file transfer from a known-malicious or rare
    external IP on TCP/22 whose transferred file hash matches known malware, immediately followed by a
    write to an RC script within about ten minutes?
  context: This chains delivery and persistence for T1037.004. External actors commonly land an implant
    over SSH/SCP then append a malicious path or shell command to an RC script so it re-runs as root every
    reboot. Correlate Zeek ssh.log port-22 sessions against threat-intel source IPs, match files.log hashes
    to known-malware libraries, and look for a subsequent RC-script modification on the same host within
    ~10 minutes. A TI source + malware hash + RC write sequence is high-fidelity confirmation of hands-on
    persistence; absence narrows suspicion to other delivery vectors.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek ssh.log
  - 'NAI: Internet gateways, Demilitarized zones (DMZ), Critical Unix/Linux server segments (e.g., ESXi
    management networks, web server farms)'
  range: Last 90 days; 10-minute correlation window between transfer and RC-script write
  queries:
  - technology: Zeek/pseudocode
    query: 'ssh = ssh.log WHERE id.resp_p==22

      join TI on ssh.id.orig_h in threat_intel.ip

      files = files.log WHERE sha256 in malware_hashes AND conn_uid in ssh.uid

      alert WHERE EXISTS rc_write(host=ssh.id.resp_h) WITHIN 10m AFTER files.ts'
  - technology: SIEM/Rule pseudocode
    query: correlate(ssh_session(src in TI, dport=22) -> file_xfer(hash in malware) -> rc_script_write)
      within 10m
- question: Are any SSH source IPs accumulating five or more failed authentications followed by a success
    within a five-minute window before touching an RC script?
  context: Tracks per-source SSH authentication State. A burst of auth failures resolving to a success
    within minutes is the classic brute-force / credential-stuffing pattern that precedes hands-on-keyboard
    RC tampering for persistence. Counting failed-then-success transitions per source isolates credential
    attacks from normal logons; a flagged source that subsequently writes an RC script is strong evidence
    of an adversary establishing a foothold.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek ssh.log
  - 'NAI: Internet gateways, Demilitarized zones (DMZ), Critical Unix/Linux server segments (e.g., ESXi
    management networks, web server farms)'
  range: Last 90 days; 5-minute sliding window per source IP
  queries:
  - technology: Zeek/pseudocode
    query: 'group ssh.log by id.orig_h over 5m window

      alert WHERE count(auth_result==''failure'') >= 5 AND any(auth_result==''success'') after the failures'
- question: Which SSH source ASN/country pairs fall in the bottom 1st percentile of 30-day prevalence
    for the destination segment, indicating a rare and suspicious origin?
  context: Scores SSH source ASN/country pairs by 30-day prevalence and flags those in the bottom 1st
    percentile, with the percentile derived per-segment from your own conn.log history. Rare origins connecting
    to critical Unix/ESXi segments are disproportionately associated with adversary access prior to RC
    persistence. A bottom-percentile source warrants enrichment and review of any subsequent RC-script
    activity; common, well-established origins are deprioritized.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek ssh.log
  - 'NAI: Internet gateways, Demilitarized zones (DMZ), Critical Unix/Linux server segments (e.g., ESXi
    management networks, web server farms)'
  range: Last 90 days; baseline computed over a trailing 30-day window per segment
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = freq(asn,country) per segment over 30d

      score = percentile_rank(baseline[src.asn,src.country])

      alert WHERE score <= 0.01'
- question: Do observed SSH connection counts or byte volumes for a host exceed the forecasted prediction
    interval, especially outside administrative hours?
  context: Forecasts expected SSH connection counts and byte Volume per host with online ARIMA and alerts
    when observed Volume/Frequency breaches the prediction interval - particularly outside maintenance/administrative
    windows. Spikes can indicate bulk implant delivery or interactive tampering. An observation above
    the upper interval bound, off-hours, is a candidate for the delivery phase preceding RC persistence;
    in-band variation is ignored.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek ssh.log
  - 'NAI: Internet gateways, Demilitarized zones (DMZ), Critical Unix/Linux server segments (e.g., ESXi
    management networks, web server farms)'
  range: Last 90 days; per-host hourly forecast with off-hours weighting
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'model = ARIMA(host.ssh_conn_count, host.ssh_bytes) updated online

      alert WHERE observed > predict_interval_upper AND hour NOT IN admin_hours'
- question: Which SSH sessions are flagged as multi-dimensional outliers by an Isolation Forest over enriched
    session features, and what are the top contributing features?
  context: Fits an Isolation Forest on enriched session features (bytes in/out, duration, source rarity,
    hour-of-day, auth-fail count) and surfaces the top-3 contributing features in the alert text. This
    catches subtle combinations no single rule would flag - e.g., moderate bytes + rare source + odd hour
    + several auth failures. A high anomaly score with interpretable drivers focuses analyst triage on
    the most suspicious sessions that may precede RC-script persistence.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek ssh.log
  - 'NAI: Internet gateways, Demilitarized zones (DMZ), Critical Unix/Linux server segments (e.g., ESXi
    management networks, web server farms)'
  range: Last 90 days; model retrained on a trailing window per segment
  queries:
  - technology: SIEM/ML pseudocode
    query: 'feat = [bytes_in,bytes_out,duration,src_rarity,hour,auth_fail_count]

      model = IsolationForest(feat)

      alert WHERE score > thr; emit top3 SHAP-style contributing features'
- question: On any Windows admin/jump host, was a remote-administration tool (ssh.exe, scp.exe, plink.exe)
    launched with a command line that references a Unix RC-script path (/etc/rc.local, /etc/rc.common,
    /etc/rc.local.d/local.sh, /etc/init.d/*) together with append or redirection operators (>>, echo,
    tee)?
  context: This is the deterministic persistence-write signature observed from the Windows side. Process-creation
    logs (4688 / Sysmon 1) capturing ssh/scp/plink invoked with an RC path plus redirection/append is
    the exact pattern an operator uses to inject a boot-time command that runs as root. A match identifies
    the originating admin/developer endpoint and user context for the persistence attempt; absence on
    monitored jump hosts suggests the write came via another path.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Windows administrative workstations, Windows jump servers/bastion hosts, Endpoint devices of
    system administrators and developers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "alert WHERE process.name in {ssh.exe,scp.exe,plink.exe}\n  AND command_line MATCH /\\/etc\\\
      /(rc\\.|init\\.d|rc\\.local\\.d)/\n  AND command_line MATCH /(>>|>|echo|tee)/"
- question: Which admin command lines contain token patterns (echo, tee, >, >>, /etc/rc) that fall in
    the bottom 5th percentile versus the user's 30-day baseline?
  context: Flags command lines whose token patterns fall in the bottom 5th percentile against the per-user
    30-day baseline and computes Frequency (such invocations/user/day) to separate routine admin scripting
    from anomalies. Many admins never append to RC scripts; a rare token pattern for a given user is a
    strong outlier. A bottom-percentile, low-frequency invocation referencing RC paths is suspicious and
    worth review; frequent, baseline-consistent scripting is deprioritized.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Windows administrative workstations, Windows jump servers/bastion hosts, Endpoint devices of
    system administrators and developers'
  range: Last 90 days; baseline over trailing 30 days per user
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'tokens = extract({echo,tee,>,>>,/etc/rc}) from command_line

      baseline = per_user token freq over 30d

      alert WHERE percentile_rank(tokens|user) <= 0.05'
- question: Does a Random Forest classifier score a command line as likely-malicious based on length,
    special-character ratio, keyword flags, and Shannon entropy, and what are its top drivers?
  context: Trains a Random Forest on command length, special-char ratio, keyword flags, and Shannon entropy
    to score maliciousness, emitting the top-3 features driving the score. Obfuscated or encoded RC-write
    commands evade simple regexes but score high on entropy/special-char features. A high score with interpretable
    drivers (e.g., high entropy + RC keyword) flags the command for analyst confirmation as a persistence
    attempt.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Windows administrative workstations, Windows jump servers/bastion hosts, Endpoint devices of
    system administrators and developers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'feat = [len, special_char_ratio, keyword_flags, shannon_entropy]

      model = RandomForest(feat)

      alert WHERE p_malicious > thr; emit top3 features'
- question: Did a source IP outside the authorized administrative allowlist connect to a critical Unix/ESXi
    host on TCP/22 or write /etc/rc.local.d/local.sh, especially outside the maintenance window?
  context: On ESXi, on-disk changes are discarded at shutdown except /etc/rc.local.d/local.sh, so any
    edit there is a high-fidelity persistence signal. This rule alerts when a non-allowlisted source touches
    a critical Unix/ESXi host on port 22 or writes local.sh. A hit from outside the admin group, off-window,
    strongly indicates adversary persistence on virtualization infrastructure; allowlisted, in-window
    administration is expected.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - esxi:syslog
  - 'NAI: ESXi management networks, Virtualization infrastructure, Core network switches and routers monitoring
    traffic to critical servers'
  range: Last 90 days; weight events outside defined maintenance windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: "alert WHERE (dst in critical_unix_esxi AND dport==22 AND src NOT IN admin_allowlist)\n  OR\
      \ file_write(path=='/etc/rc.local.d/local.sh' AND user NOT IN admins)"
  - technology: Zeek/pseudocode
    query: conn.log WHERE id.resp_h in esxi_hosts AND id.resp_p==22 AND id.orig_h NOT IN admin_allowlist
- question: Is the source-to-ESXi connection a first-time (never-before-seen) network edge according to
    a Bayesian new-edge model?
  context: Scores the source->ESXi pair as a first-time edge using a Bayesian new-edge model and alerts
    on never-before-seen admin paths. Legitimate ESXi management comes from a small, stable set of hosts;
    a brand-new edge into management infrastructure is anomalous. A flagged new edge to an ESXi host is
    a candidate for adversary access preceding local.sh persistence; established edges are ignored.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - esxi:syslog
  - 'NAI: ESXi management networks, Virtualization infrastructure, Core network switches and routers monitoring
    traffic to critical servers'
  range: Last 90 days; Bayesian model trained on historical edges
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'edge = (src -> esxi_dst)

      p_new = bayesian_new_edge(edge | history)

      alert WHERE p_new high (edge unseen in baseline)'
- question: Which sessions to ESXi hosts have a data Volume above the 95th percentile for that source-destination
    pair and land outside the maintenance window?
  context: Flags sessions whose data Volume exceeds the 95th percentile for that source-destination pair
    and that occur outside the maintenance window. Bulk transfers to ESXi off-hours can indicate implant
    staging before local.sh modification. A high-volume, off-window session for a given path is suspicious;
    routine, in-window transfers are not.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - esxi:syslog
  - 'NAI: ESXi management networks, Virtualization infrastructure, Core network switches and routers monitoring
    traffic to critical servers'
  range: Last 90 days; per source-destination pair volume baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = volume distribution per (src,dst)

      alert WHERE bytes > p95(baseline[src,dst]) AND time NOT IN maintenance_window'
- question: Which connections to critical Unix/ESXi hosts are flagged as multi-dimensional outliers by
    an Isolation Forest, and what features drive the score?
  context: Trains an Isolation Forest on enriched connection features (bytes, duration, port, source rarity,
    time) to flag multi-dimensional outliers, listing the top-3 contributing features. This surfaces stealthy
    access to virtualization infrastructure that no single threshold catches. A high anomaly score with
    interpretable drivers focuses triage on the connections most likely to precede ESXi RC persistence.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - esxi:syslog
  - 'NAI: ESXi management networks, Virtualization infrastructure, Core network switches and routers monitoring
    traffic to critical servers'
  range: Last 90 days; model retrained per segment
  queries:
  - technology: SIEM/ML pseudocode
    query: 'feat = [bytes,duration,port,src_rarity,hour]

      model = IsolationForest(feat)

      alert WHERE score > thr; emit top3 features'
- question: Within an hour of a reboot, does a Unix/ESXi host begin periodic outbound connections to a
    threat-intel-listed or newly registered domain/IP that is absent from its 30-day baseline?
  context: RC-script implants re-launch their callback at every boot, so post-reboot beaconing to a TI-listed
    or newly registered destination is a strong persistence indicator. Using Zeek conn/dns, alert when
    post-reboot connections target TI/NRD destinations not seen in the host's 30-day baseline. A match
    within the post-boot window points to an active implant established via RC persistence; established,
    known destinations are ignored.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet gateways, Egress points of the network, DNS resolvers, Centralized log aggregators
    (SIEM)'
  range: Last 90 days; correlate within 60 minutes after each reboot event
  queries:
  - technology: Zeek/pseudocode
    query: 'reboot_t = boot_event(host).ts

      conns = conn.log + dns.log WHERE host AND ts within [reboot_t, reboot_t+60m]

      alert WHERE dst in TI OR domain in newly_registered AND dst NOT IN host_baseline_30d'
- question: After reboot, are there repeated NXDOMAIN or blocked-connection responses to a single new
    destination, indicating C2 that is failing to resolve or connect?
  context: Treats repeated NXDOMAIN or blocked-connection responses to one new destination after reboot
    as a distinct C2-failure State signal rather than noise. Implants with dead or sinkholed infrastructure
    generate persistent failed resolutions/connections at boot. A cluster of failures to a single novel
    destination shortly after reboot is evidence of a persistence callback even when C2 is down; scattered,
    benign DNS misses are not.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet gateways, Egress points of the network, DNS resolvers, Centralized log aggregators
    (SIEM)'
  range: Last 90 days; per-destination aggregation in the post-reboot window
  queries:
  - technology: Zeek/pseudocode
    query: alert WHERE count(dns.rcode==NXDOMAIN OR conn.state in {S0,REJ}) to single new dst >= N within
      post_reboot_window
- question: Which new post-reboot destination partners show low inter-arrival jitter and consistent payload
    sizes consistent with automated beaconing?
  context: Flags new persistent partners with low inter-arrival jitter and consistent payload size after
    reboot using FFT/connection-interval analysis and ranked periodicity scoring. Automated RC-implant
    beacons are highly regular compared to human traffic. A new destination with strong periodicity and
    uniform payloads is a high-confidence beacon tied to RC persistence; irregular human traffic scores
    low.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet gateways, Egress points of the network, DNS resolvers, Centralized log aggregators
    (SIEM)'
  range: Last 90 days; per source-destination interval analysis
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'intervals = diff(ts) per (src,new_dst)

      score = periodicity(FFT(intervals)) * (1/jitter) * payload_consistency

      alert WHERE score high'
- question: Do STL/ARIMA decomposition of outbound metrics reveal a periodic residual signal that appears
    only after boot, corroborated by provenance linking the boot process to the new socket?
  context: Runs STL/ARIMA decomposition on outbound metrics to flag periodic residual signals appearing
    only after boot, then corroborates with provenance-graph anomaly scoring that links the boot process
    to the new socket. This separates boot-induced beaconing from steady-state traffic and ties it to
    the originating boot lineage. A post-boot periodic residual confirmed by a boot-process->socket provenance
    edge is strong evidence of RC persistence.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet gateways, Egress points of the network, DNS resolvers, Centralized log aggregators
    (SIEM)'
  range: Last 90 days; decomposition aligned to reboot timestamps
  queries:
  - technology: SIEM/ML pseudocode
    query: 'resid = STL/ARIMA_decompose(outbound_metrics)

      alert WHERE periodic(resid) only after boot

      corroborate WITH provenance_edge(boot_proc -> new_socket)'
- question: Has any RC script (/etc/rc.local, /etc/rc.common, /etc/init.d/*, /etc/rc.local.d/local.sh)
    or macOS StartupItems file been created, written, hash-changed, or had permission/owner changes, and
    which user and process did it?
  context: This is the primary first-party signal for T1037.004 and requires no network/external lookup.
    Deploy auditd PATH/FIM watches on all RC-script and StartupItems paths and alert on any write, hash
    change, or permission/owner change, attributing the modifying user and process. Legitimate edits are
    rare on production hosts, so any modification is the deterministic floor for detecting RC-script persistence.
    A flagged write with an unexpected actor is a direct persistence finding.
  answer_sources:
  - auditd:PATH
  - auditd:SYSCALL
  - fs:fsusage
  - esxi:shell
  - 'NAI: Critical Unix/Linux servers, ESXi hosts, macOS endpoints, Centralized log aggregation platform
    (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'watch_paths = {/etc/rc.local,/etc/rc.common,/etc/init.d/*,/etc/rc.local.d/local.sh,/Library/StartupItems/*,/System/Library/StartupItems/*}

      alert ON auditd_PATH/FIM write|chmod|chown|hash_change(path in watch_paths); record auid,uid,exe'
  - technology: auditd/pseudocode
    query: -w /etc/rc.local -p wa -k rc_persist ; -w /etc/rc.local.d/ -p wa -k rc_persist
- question: When an RC script is modified, was the modifying process a shell one-liner (echo/tee/sed appending)
    rather than an interactive editor or package manager?
  context: Raises severity when the modifying process is a non-interactive shell one-liner (echo/tee/sed
    appending to rc.local) instead of an interactive editor (vi/nano) or a package manager. Malware writes
    RC entries programmatically, while admins typically use editors or packaging. A modification made
    by echo/tee/sed redirection is the malware write pattern and should be escalated; editor/package-manager
    edits are more likely benign.
  answer_sources:
  - auditd:PATH
  - auditd:SYSCALL
  - fs:fsusage
  - esxi:shell
  - 'NAI: Critical Unix/Linux servers, ESXi hosts, macOS endpoints, Centralized log aggregation platform
    (SIEM)'
  range: Last 90 days; correlate with the file-modification event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "alert WHERE rc_modify.exe in {bash,sh,echo,tee,sed} AND command_line MATCH /(>>|>|tee|sed\
      \ -i).*\\/etc\\/rc/\n  AND exe NOT IN {vi,vim,nano,emacs,apt,dpkg,yum,rpm}; raise_severity"
- question: Which (user, process, RC-path) modification tuples have never been seen before or fall in
    the bottom 1st percentile of 90-day modification frequency?
  context: Scores (user, process, RC-path) tuples by 90-day modification Frequency and flags tuples never
    seen before or in the bottom 1st percentile. Legitimate RC edits are extremely rare on production
    hosts, so a novel actor/path combination is a strong anomaly. A never-before-seen tuple modifying
    an RC script is high-priority for persistence triage; recurring maintenance tuples are deprioritized.
  answer_sources:
  - auditd:PATH
  - auditd:SYSCALL
  - fs:fsusage
  - esxi:shell
  - 'NAI: Critical Unix/Linux servers, ESXi hosts, macOS endpoints, Centralized log aggregation platform
    (SIEM)'
  range: Last 90 days; trailing 90-day baseline of modification tuples
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = freq(user,exe,rc_path) over 90d

      alert WHERE tuple unseen OR percentile_rank(tuple) <= 0.01'
- question: Does the boot/init log event sequence contain injected or out-of-order startup executions
    following an RC modification, per a DeepLog model?
  context: Learns the normal boot/init log event sequence with DeepLog and flags injected or out-of-order
    startup executions that follow an RC modification, surfacing the anomalous event keys. A tampered
    RC script perturbs the expected ordered sequence of boot events. An anomalous event key inserted into
    the boot sequence after an RC change is evidence the persistence entry executed; a normal sequence
    indicates none ran.
  answer_sources:
  - auditd:PATH
  - auditd:SYSCALL
  - fs:fsusage
  - esxi:shell
  - 'NAI: Critical Unix/Linux servers, ESXi hosts, macOS endpoints, Centralized log aggregation platform
    (SIEM)'
  range: Last 90 days; per-host boot sequence model
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = DeepLog(boot_log_sequence per host)

      alert WHERE next_event NOT IN top_k_predicted; emit anomalous event_keys'
- question: Does a provenance subgraph show a tampered RC script spawning a root process that opens a
    network socket (file->process->network), and which node is the offending one?
  context: Uses masked/temporal provenance-graph learning to flag the file->process->network subgraph
    created when a tampered RC script spawns a root process that opens a socket, pinpointing the offending
    node for triage. This ties the static file change to runtime impact in one graph. A flagged file->process->socket
    subgraph rooted at an RC script is strong end-to-end evidence of RC persistence with C2; benign boot
    graphs do not match.
  answer_sources:
  - auditd:PATH
  - auditd:SYSCALL
  - fs:fsusage
  - esxi:shell
  - 'NAI: Critical Unix/Linux servers, ESXi hosts, macOS endpoints, Centralized log aggregation platform
    (SIEM)'
  range: Last 90 days; provenance graph windowed around boot
  queries:
  - technology: SIEM/ML pseudocode
    query: 'G = provenance_graph(host)

      model = MAGIC/ThreaTrace(G)

      alert WHERE subgraph(rc_file -> root_proc -> socket) anomalous; emit offending node'
- question: Has a file transferred to a Unix/Linux host a hash matching a known privilege-escalation exploit,
    or a filename matching escalation-tool patterns (e.g., dirtycow.c, pwnkit, exploit.c)?
  context: Under Privilege Escalation, adversaries stage local-root exploits before tampering with RC
    scripts in a root context. Alert when Zeek files.log filenames match exploit regexes or file hashes
    match TI exploit libraries, capturing transfer Volume and destination-host criticality. A match -
    especially to a high-criticality host - flags likely escalation tooling delivered ahead of root-context
    RC abuse; no match reduces likelihood of exploit-based escalation.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network taps monitoring traffic between workstations and server segments, File transfer proxies,
    DMZ'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'files.log WHERE sha256 in TI_exploit_hashes OR filename MATCH /(dirtycow|pwnkit|exploit)\.c|pwnkit/

      enrich WITH dst_criticality, tx_bytes'
- question: Which file transfers have a rare MIME type or byte size above the 99th percentile for the
    destination host?
  context: Flags transfers with rare MIME types or byte sizes (>99th percentile) for the destination host,
    deriving the threshold from that host's own files.log history. Exploit source or compiled binaries
    often differ from a host's normal file profile. A rare-MIME or oversized transfer to a sensitive host
    is a candidate for escalation tooling; routine file types matching the baseline are ignored.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network taps monitoring traffic between workstations and server segments, File transfer proxies,
    DMZ'
  range: Last 90 days; per-destination-host baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = mime/size distribution per dst_host over history

      alert WHERE mime rare OR size > p99(baseline[dst])'
- question: Does a classifier trained on file metadata (tx_hosts, mime_type, size, asset criticality)
    predict a transfer as suspicious, and what are the top features?
  context: Trains a classifier on file metadata (tx_hosts, mime_type, size, asset criticality) to predict
    suspicious transfers and reports the top-3 features. This catches escalation-tool delivery that evades
    simple regex/hash rules by combining weak signals. A high suspicion score with interpretable drivers
    (e.g., rare MIME + high-criticality destination) flags the transfer for review as possible escalation
    staging.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network taps monitoring traffic between workstations and server segments, File transfer proxies,
    DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
