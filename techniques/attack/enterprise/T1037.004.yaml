name: 'T1037.004: RC Scripts'
id: 522c5a3b-048d-4c95-a134-86fe02a3b0de
description: 'Investigate adversary abuse of Unix-like RC scripts (rc.local, rc.common, /etc/init.d/*,
  /etc/rc.local.d/local.sh on ESXi, and macOS StartupItems) for persistence and privilege escalation.
  RC scripts execute as root during system startup, so a malicious entry guarantees re-execution of attacker
  code at every reboot - a tactic especially potent on root-default systems such as ESXi hypervisors,
  IoT, and embedded/network devices where /etc/rc.local.d/local.sh is one of the few persistence mechanisms
  that survives reboot. This playbook helps an analyst trace the full kill chain: malicious SSH/SCP delivery
  of implants or escalation exploits from rare or threat-intel-listed sources, remote-administration commands
  from Windows admin/jump hosts that append shell commands to RC-script paths, the first-party file-modification
  signal (auditd who-data or FIM showing who and what process wrote a root-owned RC script), privilege
  transitions where a non-root principal writes a root-owned RC file, and the runtime fallout after reboot
  - new root processes that were not in the golden image and post-reboot beaconing to never-before-seen
  destinations. It combines deterministic symbolic-logic rules, statistical rarity/forecasting methods,
  and machine-learning models (Isolation Forest, DeepLog, provenance-graph learning) so the analyst can
  both catch the high-fidelity write and surface stealthier multi-dimensional anomalies.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
