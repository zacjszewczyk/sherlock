  context: 'This evidences a privilege transition: a non-root principal (auid != 0) operating with effective
    root (euid = 0) writes a root-owned RC script - the escalation-to-persistence pivot. Correlate the
    auditd SYSCALL write with a Windows logon (4624) and a Zeek session from a non-admin IP. A positive
    correlation is strong evidence an adversary escalated and persisted via RC; legitimate root admins
    (auid=0) do not trigger it.'
