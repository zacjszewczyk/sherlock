name: 'T1584.008: Network Devices'
id: 9c55e1fd-dec2-4191-8c7b-fc5ce8a24da7
description: 'This playbook helps an analyst investigate evidence that an adversary has compromised third-party
  network devices (e.g., SOHO routers, edge appliances, ORB/relay nodes) to build infrastructure that
  supports later targeting. It hunts for: connections to/from IPs on high-confidence threat-intel feeds
  tagged as compromised routers, botnet C2, ORB/relay nodes, or malicious proxies; low-prevalence implant
  fingerprints (JA3/JA3S, JA4/JA4S, TLS SNI, HTTP User-Agent) tied to malware that infects edge devices;
  long-running or low-variance beaconing connections to residential/mobile ISP ASNs with no business nexus;
  high-fanout scanning from residential-ASN source IPs followed by exploit or management-protocol probes
  (TFTP, Cisco Smart Install TCP/4786, SNMP); and DNS-to-connection mismatches where many resolved FQDNs
  funnel through a single proxy hub IP. Each question pairs symbolic-logic, statistical, and machine-learning
  methods so analysts can confirm or rule out adversary use of compromised network-device infrastructure.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any internal hosts communicating with IP addresses that appear on a high-confidence threat-intelligence
    feed tagged as a 'compromised router', 'botnet C2', 'ORB/relay node', or 'malicious proxy', and do
    those connections carry corroborating behavioral context such as a residential/mobile ASN, no business
    nexus, or edge-device exploitation signatures?
  context: 'Adversaries who compromise third-party network devices reuse those devices as operational
    infrastructure (proxies, relays, C2). The fastest first-pass detection is matching Zeek conn.log or
    Windows Event ID 5156 source/destination IPs against curated TI feeds. However, ORB/relay exit IPs
    rotate quickly and blocklists decay, so a raw IP match is only one signal: pair it with behavioral
    context (residential/mobile ASN, no legitimate business relationship, persistent or beaconing connection)
    before escalating. Also match exploit and management-protocol signatures of edge-device compromise
    such as TFTP egress, Cisco Smart Install on TCP/4786, and SNMP sweeps. A positive match with behavioral
    corroboration is strong evidence of adversary infrastructure use; an isolated IP-only hit with normal
    business context is likely stale TI and should be triaged but not over-weighted. This supports the
    Resource Development question of whether the adversary is building targeting infrastructure from compromised
    devices.'
  answer_sources: &id001
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Internet Gateway, Firewall Logs, Network Taps, Perimeter DNS Servers, Endpoint Network Telemetry'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn = load(''conn.log'');

      ti = load_threatintel(tags=[''compromised_router'',''botnet_c2'',''orb_relay'',''malicious_proxy'']);

      hits = conn where (id.orig_h in ti.ip) or (id.resp_h in ti.ip);

      enrich hits with asn, geo, business_nexus_flag;

      alert hits where (asn.type in [''residential'',''mobile''] or business_nexus_flag=false or beaconing=true)'
  - technology: SIEM/Rule pseudocode
    query: "index=firewall OR sourcetype=WinEventLog EventCode=5156\n| lookup ti_feed ip AS dest_ip OUTPUT\
      \ tag\n| where tag IN (\"compromised_router\",\"botnet_c2\",\"orb_relay\",\"malicious_proxy\")\n\
      \   OR dest_port IN (69,4786) OR (proto=\"snmp\" AND distinct_dest>20)\n| table _time src_ip dest_ip\
      \ dest_port tag asn"
- question: For each connection that matched a threat-intelligence feed, do the volume (bytes and byte
    ratio), frequency (connections per minute), connection state (success vs S0/REJ/RSTO failures), and
    duration percentile rank deviate from the host's own 30-day baseline enough to indicate real adversary
    use rather than incidental contact?
  context: 'A TI match alone does not confirm malicious data flow. This statistical enrichment quantifies
    how anomalous each hit is relative to the host''s own history. Compute orig_bytes/resp_bytes and their
    ratio (Volume), connections/min to the IP (Frequency), conn_state distribution (State: successful
    established vs S0/REJ/RSTO failures), and the duration percentile rank versus a 30-day per-host baseline.
    Escalate when both duration and total bytes exceed the 95th percentile (sustained exfil/relay session)
    or when the failed-connection ratio to the IP is abnormally high (probing/relay churn). Deriving thresholds
    per environment from each host''s own history avoids one-size-fits-all false positives. A high-volume,
    long-duration successful connection to a flagged IP is strong evidence of relay/proxy use; mostly-failed
    short connections may indicate scanning or churn. This directly answers whether the device is actively
    supporting adversary targeting operations.'
  answer_sources: *id001
  range: Last 90 days; baseline window 30 days per host
  queries:
  - technology: SIEM/Stats pseudocode
    query: "hits = conn join ti_hits;\nper host h, dst d:\n  vol = sum(orig_bytes+resp_bytes); ratio =\
      \ orig_bytes/max(resp_bytes,1);\n  freq = count()/window_minutes;\n  fail_ratio = count(conn_state\
      \ in [S0,REJ,RSTO])/count();\n  dur_pct = percentile_rank(duration, baseline_30d[h]);\n  byte_pct\
      \ = percentile_rank(vol, baseline_30d[h]);\nalert where (dur_pct>=0.95 and byte_pct>=0.95) or fail_ratio>0.8"
- question: When an Isolation Forest trained on benign connection attributes scores the threat-intel-matched
    connections, which connections are top-ranked anomalies, and what are the top-3 contributing features
    (e.g., duration rank, residential destination ASN, byte ratio) that explain why they look like compromised-device
    infrastructure traffic?
  context: Rule and percentile logic can miss novel combinations of features. An Isolation Forest trained
    on benign connection attributes (duration, byte counts/ratio, packet counts, conn_state, host role,
    destination ASN type) ranks TI-hit connections by anomaly score, and isolation path lengths provide
    per-feature attribution so the alert can surface the top-3 contributing features. This gives analysts
    an explainable anomaly ranking to prioritize triage. A high anomaly score driven by residential destination
    ASN plus an extreme duration/byte-ratio rank strongly suggests covert relay/proxy use of a compromised
    device; a low score suggests the connection resembles normal traffic despite the TI hit. This supports
    Resource Development hunting by elevating the most suspicious compromised-device connections for analyst
    review.
  answer_sources: *id001
  range: Last 90 days; retrain on 30-day benign window
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = features(conn, [duration, orig_bytes, resp_bytes, byte_ratio, orig_pkts, resp_pkts, conn_state,
      host_role, dst_asn_type]);

      model = IsolationForest(contamination=auto).fit(X_benign_30d);

      scored = model.decision_function(X[ti_hits]);

      for c in ti_hits: c.top3 = path_length_attribution(model, c);

      alert top_ranked(scored) with c.top3'
- question: Does any outbound connection present a JA3/JA3S, JA4/JA4S, TLS SNI, or HTTP User-Agent that
    matches known IOCs for malware families that infect SOHO routers and edge appliances (such as implants
    delivered through FortiOS or other edge zero-days), independent of the destination IP?
  context: TLS and HTTP fingerprints characterize the client's software stack rather than its destination,
    so JA3/JA4 and User-Agent/SNI matches survive IP rotation that defeats IP blocklists. Alert when a
    connection's JA3/JA3S, JA4/JA4S, TLS SNI, or HTTP User-Agent matches curated IOCs for edge-device
    malware families. This is especially valuable against implants that move across rotating relay infrastructure.
    A fingerprint match is high-fidelity evidence the host (or a device proxying through it) is running
    a known implant's TLS/HTTP stack; absence does not exonerate, since fingerprints evolve. This supports
    Resource Development by identifying compromised-device implants reaching out from or through the environment.
  answer_sources: &id002
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Internet Gateway, DNS Resolvers, Endpoint EDR Logs, Web Proxies'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'ssl = load(''ssl.log''); http = load(''http.log'');

      ioc = load_iocs([''ja3'',''ja3s'',''ja4'',''ja4s'',''sni'',''user_agent'']);

      alert ssl where ja3 in ioc.ja3 or ja3s in ioc.ja3s or ja4 in ioc.ja4 or server_name in ioc.sni;

      alert http where user_agent in ioc.user_agent or host in ioc.sni'
  - technology: SIEM/Rule pseudocode
    query: 'index=zeek (sourcetype=ssl OR sourcetype=http)

      | lookup edge_malware_ioc ja3,ja4,sni,user_agent

      | where matched=true

      | table _time src_ip dest_ip ja3 ja4 server_name user_agent ioc_family'
- question: Across the enterprise, which JA3/JA4 hashes, User-Agents, or TLS SNIs are seen on fewer than
    0.1% of hosts (or first-seen) while also showing low TLS/HTTP success ratios or high 4xx/RST failure
    rates, and do multiple such low-prevalence indicators co-occur on the same flow (compound rarity)?
  context: 'Automated implant traffic differs statistically from human browsing: it uses rare TLS stacks
    and User-Agents and often fails more (4xx, RST). Maintain per-enterprise prevalence counts of JA3/JA4
    hashes, User-Agents, and SNIs over a rolling 30-day window and flag fingerprints seen on <0.1% of
    hosts (or first-seen) that also carry low success ratios or high failure rates. Requiring multiple
    simultaneous low-prevalence indicators on one flow (compound rarity) before alerting controls false
    positives from benign-but-rare clients. A flow that is rare on several axes and fails often is a strong
    implant candidate; a rare-but-successful enterprise app is likely benign. This supports identifying
    covert compromised-device implants that blend into outbound traffic.'
  answer_sources: *id002
  range: Last 90 days; rolling 30-day prevalence window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "prev = count_distinct(host) by [ja3|ja4|user_agent|sni] over 30d / total_hosts;\nflows = ssl\
      \ join http;\nfor f in flows:\n  rare = [ind for ind in [ja3,ja4,ua,sni] if prev[ind]<0.001 or first_seen(ind)];\n\
      \  fail = (status_4xx_rate>0.5) or (rst_ratio>0.5) or (tls_success_ratio<0.5);\nalert where len(rare)>=2\
      \ and fail"
- question: When a supervised classifier scores outbound connections using JA4/JA4S, SNI rarity, User-Agent
    rarity, flow duration, byte counts/ratio, and periodicity, which connections are classified as implant
    traffic, and which top-3 features drove that classification even as implants migrate to TLS 1.3 and
    randomize extensions?
  context: Static IOC matching degrades as implants adopt TLS 1.3 and randomize extensions. A supervised
    classifier (or graph/flow model) trained on JA4/JA4S, SNI rarity, User-Agent rarity, flow duration,
    byte counts/ratio, and periodicity generalizes beyond specific fingerprint values to the behavioral
    shape of implant traffic. Reporting the top-3 features makes each verdict explainable. A high-confidence
    implant classification with corroborating periodicity and rarity features warrants investigation of
    the host and its destination; a low score with normal browser-like features is likely benign. This
    supports Resource Development hunting against evolving edge-device implants whose fingerprints change
    over time.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = features(conn+ssl+http, [ja4, ja4s, sni_rarity, ua_rarity, duration, orig_bytes, resp_bytes,
      byte_ratio, periodicity]);

      clf = load_model(''edge_implant_classifier'');

      pred = clf.predict_proba(X);

      for c in conn: c.top3 = shap_top_features(clf, c);

      alert where pred.implant>=threshold with c.top3'
- question: Is any internal host maintaining at least one hour of cumulative connection time, or repeated
    daily connections, to an IP in a residential or mobile ISP ASN that has no business nexus — especially
    on non-standard ports?
  context: The defining signal of ORB/relay use is an internal host persistently talking to a residential/mobile
    exit IP with no legitimate business relationship. Enrich Zeek conn.log flows with ASN and geo data,
    then alert when an internal host accumulates >=1 hour of connection time or recurs daily to a residential/mobile
    ISP ASN with no business nexus, particularly over non-standard ports. Legitimate enterprise traffic
    to residential ASNs is rare and usually short; sustained or recurring connections are anomalous. A
    persistent, no-nexus, non-standard-port connection to a residential ASN is strong evidence the host
    is using (or being used as) compromised-device relay infrastructure. This directly addresses whether
    the adversary is leveraging compromised network devices for targeting.
  answer_sources: &id003
  - Zeek conn.log
  - 'NAI: Internet Gateway, VPN Concentrators, Core Switches, Egress points of the network'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "conn = load('conn.log'); enrich conn with asn, geo;\nagg by (id.orig_h, id.resp_h): total_dur=sum(duration),\
      \ days=count_distinct(date), ports=set(id.resp_p);\nalert where asn.type in ['residential','mobile']\
      \ and business_nexus=false\n  and (total_dur>=3600 or days>=3) and any(port not in standard_ports)"
- question: For each (source, destination) pair, do the coefficient of variation and median absolute deviation
    of inter-arrival times, plus the Bowley skewness of payload sizes, fall below tight thresholds indicating
    a regular automated cadence — and does FFT/periodogram analysis confirm periodicity even with jitter,
    after excluding benign periodic services?
  context: Compromised-device relays and C2 beacons exhibit machine-like regularity humans rarely produce.
    For each (src,dst) pair compute the coefficient of variation and median absolute deviation of inter-arrival
    times and the Bowley skewness of payload sizes; flag pairs whose timing CV and payload std dev fall
    below tight thresholds (regular cadence) and apply FFT/periodogram periodicity extraction that tolerates
    jitter. A baseline whitelist separates benign periodic services (NTP, CDN, software updates) from
    suspicious beacons. Low timing variance plus confirmed periodicity to a residential/relay destination
    is strong beaconing evidence; high variance or a whitelisted service argues benign. This supports
    detecting C2/relay channels riding on compromised network devices.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for (src,dst) in conn pairs:\n  iat = diffs(sorted(ts)); cv = std(iat)/mean(iat); mad_iat\
      \ = mad(iat);\n  skew = bowley_skew(payload_sizes); psd = periodogram(iat);\n  period = dominant_period(psd,\
      \ jitter_tol=0.2);\nalert where cv<0.1 and std(payload)<thr and period_significant and dst not in\
      \ benign_periodic_whitelist"
- question: When per-flow temporal features (autocorrelation, Lomb-Scargle periodogram, inter-arrival
    and byte time series) are modeled with a single-flow time-series classifier, and an LSTM sequence
    model reviews each host's flow history, which new long-lived connections to residential relays are
    flagged as improbable, and what top-3 temporal features explain the flag?
  context: Beaconing detection benefits from temporal models that capture periodicity and sequence context.
    Model per-flow temporal features (autocorrelation, Lomb-Scargle periodogram for unevenly sampled data,
    inter-arrival and byte time series) with a single-flow time-series classifier, and use an LSTM sequence
    model over the host's flow history to flag improbable new long-lived connections to residential relays.
    Surfacing the top-3 contributing temporal features keeps verdicts explainable. An improbable new long-lived
    residential connection with strong periodicity signatures is a high-priority relay/C2 candidate; flows
    consistent with the host's normal history are deprioritized. This supports Resource Development detection
    of covert relays established on compromised devices.
  answer_sources: *id003
  range: Last 90 days; host flow-history sequence
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = per_flow_timeseries(conn, [autocorr, lomb_scargle_peak, iat_series, byte_series]);\n\
      ts_clf = TimeSeriesClassifier().score(feats);\nseq = LSTM_seq_model(host_flow_history);\nfor f in\
      \ flows where dst_asn.type in ['residential','mobile'] and f.long_lived:\n  if ts_clf[f]>thr or\
      \ seq.surprise(f)>thr: alert f with top3_temporal_features(f)"
- question: Does Zeek scan/notice logging show a single external IP in a residential/mobile ASN touching
    many distinct internal hosts or ports, and within 15 minutes do correlated http/notice logs show exploit
    signatures or management-protocol probes (TFTP, Cisco Smart Install TCP/4786, SNMP) — the scan-then-exploit
    pattern of compromised devices recruiting new nodes?
  context: Compromised network devices are often used to scan and then exploit additional devices, expanding
    the adversary's infrastructure. Alert when Zeek scan/notice logs reveal a single external IP (residential/mobile
    ASN) contacting many distinct internal hosts/ports and correlated http/notice logs show exploit signatures
    or management-protocol probes (TFTP, Smart Install on TCP/4786, SNMP) within a 15-minute window. The
    temporal correlation of broad fanout followed by targeted exploitation distinguishes recruitment activity
    from benign scanning. A scan-then-exploit sequence from a residential-ASN source is strong evidence
    of active node recruitment; scanning alone is lower priority but still notable. This directly addresses
    whether the adversary is expanding compromised-device infrastructure.
  answer_sources: &id004
  - Zeek conn.log
  - Zeek scan.log
  - Zeek http.log
  - Zeek notice.log
  - 'NAI: DMZ, Internet-facing Web Servers, External Firewall, Intrusion Detection/Prevention Systems
    (IDS/IPS)'
  range: Last 90 days; 15-minute correlation window
  queries:
  - technology: Zeek/pseudocode
    query: "scans = notice where note in ['Scan::Address_Scan','Scan::Port_Scan'];\nfor s in scans where\
      \ src_asn.type in ['residential','mobile']:\n  exploits = (http|notice) where src=s.src and (exploit_sig\
      \ or dst_port in [69,4786] or proto='snmp') within 15min;\n  if exploits: alert correlate(s, exploits)"
  - technology: SIEM/Rule pseudocode
    query: 'index=zeek sourcetype IN (scan,notice,http)

      | stats dc(dest_ip) AS hosts dc(dest_port) AS ports values(note) values(uri) by src_ip

      | where asn_type IN ("residential","mobile") AND (hosts>20 OR ports>50)

      | join src_ip [search exploit_sig OR dest_port IN (69,4786) earliest=-15m]'
- question: Per external source IP, do the distinct destination IP and port counts per 5-minute window,
    together with the SYN-without-completed-handshake ratio (S0/REJ) and the 404/blocked-connection rate,
    exceed the perimeter's own 99.9th percentile or approach a failed-connection ratio near 1.0 indicative
    of classic scanning physics?
  context: 'Scanning has a recognizable statistical signature: many distinct targets and overwhelmingly
    incomplete handshakes. Per external source IP, track distinct destination IP and port counts per 5-minute
    window plus the State signal (SYN-without-completed-handshake ratio: S0/REJ) and the 404/blocked-connection
    rate; alert when distinct-target count exceeds the 99.9th percentile or the failed-connection ratio
    is near 1.0. Deriving percentiles from the perimeter''s own inbound history adapts thresholds to local
    traffic. An extreme-fanout source with near-total handshake failures is almost certainly scanning,
    and a residential-ASN source doing so suggests a compromised device; modest fanout with successful
    sessions is likely benign. This supports detecting compromised-device recruitment scanning at the
    perimeter.'
  answer_sources: *id004
  range: Last 90 days; 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per src_ip per 5min:\n  dst_count = dc(dest_ip); port_count = dc(dest_port);\n  s0_ratio =\
      \ count(conn_state in [S0,REJ])/count();\n  block_rate = count(status=404 or blocked)/count();\n\
      base = percentile(dst_count, 99.9, perimeter_history);\nalert where dst_count>base or s0_ratio>=0.95\
      \ or block_rate>=0.9"
- question: When external source IPs are clustered by destination diversity, port spread, and timing using
    DBSCAN/Isolation Forest, which dense scanner clusters or isolation outliers emerge, and what top-3
    features (distinct destination count, S0 ratio, port entropy) explain them?
  context: Unsupervised models can surface coordinated or anomalous scanners that fixed thresholds miss.
    Cluster external source IPs by destination diversity, port spread, and timing with DBSCAN/Isolation
    Forest, then alert when dense scanner clusters or isolation outliers appear, reporting the top-3 features
    (distinct dst count, S0 ratio, port entropy). Clustering reveals botnet-like cohorts behaving similarly,
    while isolation outliers catch lone aggressive scanners. A dense cluster of residential-ASN sources
    with high distinct-destination counts and S0 ratios indicates a coordinated recruitment campaign;
    isolated normal-looking sources are deprioritized. This supports detecting compromised-device scanning
    infrastructure at scale.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = features_per_src([dc_dest_ip, port_spread, port_entropy, s0_ratio, timing_burstiness,
      asn_type]);

      clusters = DBSCAN(eps,min_samples).fit(X);

      iso = IsolationForest().fit(X);

      alert dense_scanner_clusters(clusters) or iso_outliers(iso) with top3=[dc_dest,s0_ratio,port_entropy]'
- question: Are there connections where a host's actual destination IP does not match any A/AAAA answer
    it resolved for the corresponding SNI/Host within the TTL window and the destination is a residential/mobile
    ASN, or where a single TLS connection shows an SNI/HTTP-Host mismatch or a blank ('domainless') SNI
    indicating domain-fronting-style proxy evasion?
  context: When traffic is funneled through a compromised proxy node, the destination IP a host actually
    connects to diverges from what DNS resolved. Alert when a host's connection destination IP does not
    match any A/AAAA answer it resolved for the corresponding SNI/Host within the TTL window and the destination
    is a residential/mobile ASN, indicating proxying through a compromised node. Also flag SNI/HTTP-Host
    mismatches and blank ('domainless') SNI on a single TLS connection, which signal domain-fronting-style
    evasion. A consistent DNS-to-IP mismatch toward a residential ASN strongly indicates relay/proxy use;
    occasional mismatches from CDNs or legitimate proxies need whitelisting. This addresses whether the
    adversary is routing traffic through compromised network-device proxies.
  answer_sources: &id005
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - 'NAI: Internal DNS Resolvers, Internet Gateway, Endpoint Network Logs, Core Network Taps'
  range: Last 90 days; per-record DNS TTL window
  queries:
  - technology: Zeek/pseudocode
    query: "dns = load('dns.log'); ssl=load('ssl.log'); http=load('http.log'); conn=load('conn.log');\n\
      resolved = map host -> {fqdn: set(A/AAAA within ttl)};\nfor c in (ssl|http) join conn:\n  name =\
      \ server_name or host;\n  if c.dst not in resolved[c.src][name] and dst_asn.type in ['residential','mobile']:\
      \ alert c;\n  if (server_name and host and server_name!=host) or server_name=='' : alert c"
- question: Per host, does the ratio of unique destination IPs to unique resolved FQDNs collapse below
    the 5th percentile (many domains resolving to one IP) while a single hub IP carries a disproportionate
    share of HTTP/TLS bytes, with handshake-success state confirming the funnel is real rather than a
    broken resolver?
  context: 'Proxy funneling produces a tell-tale statistical shape: many distinct domains but very few
    distinct destination IPs, with most bytes flowing to one hub. Per host compute the ratio of unique
    destination IPs to unique resolved FQDNs and the share of HTTP/TLS bytes (Volume) directed to a single
    hub IP; alert when the FQDN-to-IP ratio collapses (below the 5th percentile) and the hub carries a
    disproportionate byte share, using State context (handshake success) to exclude broken resolvers.
    A collapsed ratio with a dominant successful hub IP in a residential ASN is strong proxy-funnel evidence;
    a collapsed ratio caused by failed handshakes may just be DNS/resolver problems. This supports detecting
    compromised-device proxy hubs aggregating a host''s traffic.'
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per host h:\n  fqdns = dc(resolved_name); dst_ips = dc(dest_ip);\n  ratio = dst_ips/max(fqdns,1);\n\
      \  hub = argmax_bytes(dest_ip); hub_share = bytes(hub)/total_bytes;\n  succ = handshake_success_ratio(hub);\n\
      base = percentile(ratio, 5, host_population);\nalert where ratio<base and hub_share>0.6 and succ>0.5"
- question: When a host–domain–IP bipartite/communication graph is analyzed with graph-neural or community-detection
    methods, which communities show many domains funneling through one anomalous hub IP (hub-and-spoke
    relay topology), and do the hub IP, fan-in count, and ASN explain the detection?
  context: Graph methods reveal the hub-and-spoke topology of proxy relays that pairwise rules can miss.
    Build a host–domain–IP bipartite/communication graph and apply graph-neural or community-detection
    methods to flag communities where many domains funnel through a single anomalous hub IP, surfacing
    the hub IP, fan-in count, and ASN as the top-3 explanatory features. This catches relay infrastructure
    shared across multiple hosts and domains. A community with high fan-in to one residential-ASN hub
    is strong evidence of a compromised-device proxy relay; well-connected legitimate CDNs/cloud hubs
    should be whitelisted. This supports mapping and detecting the adversary's compromised-device proxy
    infrastructure.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_graph(nodes=[host,domain,ip], edges=[resolves, connects_to]);\ncomms = community_detection(G);\
      \  # or GNN node/edge scoring\nfor c in comms:\n  hub = max_degree_ip(c); fan_in = indegree(hub);\n\
      alert where fan_in>=N and hub.asn.type in ['residential','mobile'] with top3=[hub_ip, fan_in, hub.asn]"
