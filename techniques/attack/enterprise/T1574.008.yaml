name: 'T1574.008: Hijack Execution Flow: Path Interception by Search Order Hijacking'
id: 359686c2-55fd-4c3d-ae72-0a900789518a
description: 'This playbook helps an analyst investigate Path Interception by Search Order Hijacking (T1574.008),
  in which an adversary places a malicious executable in a directory that Windows searches before the
  canonical system location so that a bare-name (no full path) invocation of a trusted utility resolves
  to the attacker''s file instead. Because Windows commonly searches the initiating program''s directory
  before System32, and because the PATHEXT environment variable lets extensions such as .com, .bat, and
  .cmd take precedence over .exe, an attacker can shadow utilities like net, ipconfig, findstr, cmd, and
  powershell to gain execution, persistence, privilege escalation, and defense evasion -- all while masquerading
  as legitimate system activity. The investigation spans Windows endpoints and servers and correlates
  file-creation telemetry (Windows Event ID 4663, Sysmon EID 11/15), process-execution telemetry (Windows
  Event ID 4688, Sysmon EID 1), privileged-token and access events (4673), host firewall (WFP 5156) and
  network sensor data (Zeek conn/dns/files logs). It guides the analyst across several behavioral angles:
  executables planted in PATH or application directories whose names collide with system utilities or
  whose hashes match threat intelligence; higher-precedence PATHEXT files (e.g., net.com) staged to intercept
  .exe calls; legitimate or trusted-signed parents (explorer.exe, winword.exe, chrome.exe) spawning utility-named
  children from user-writable or temporary paths; masquerading utilities that establish outbound C2; low-privilege
  writes to world-writable directories searched by privileged services; files staged immediately before
  privileged updater/installer execution; high/SYSTEM integrity parents spawning from unusual paths; unsigned
  binaries impersonating security tools; and suspicious command-line arguments on non-standard-path utilities.
  Detection methods combine symbolic-logic rules, statistical prevalence/entropy/frequency baselining,
  and machine-learning models (Isolation Forest, DeepLog/LSTM, One-Class SVM, provenance-graph GNNs, and
  command-line embeddings) so the analyst can corroborate suspected search-order hijacking across file
  writes, process lineage, signatures, and network activity. See https://attack.mitre.org/techniques/T1574/008
  for technique background.'
type: technique
