questions:
- question: '[Stealth] Hash PATH creations against TI and verify resolution path: Can you determine whether
    an executable file (.exe, .com, .scr, .bat) is written to a directory listed in the initiating program''s
    search path, and its filename matches a known system utility or its hash matches a known malicious
    signature that is later invoked when the caller omits a full path. -- specifically, using the ''Hash
    PATH creations against TI and verify resolution path'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary abuses Windows search-order and PATHEXT
    resolution to run a malicious file in place of a trusted, bare-name utility (T1574.008), blending
    malicious execution into normal system activity. This evidence focuses on the condition that an executable
    file (.exe, .com, .scr, .bat) is written to a directory listed in the initiating program''s search
    path, and its filename matches a known system utility or its hash matches a known malicious signature
    that is later invoked when the caller omits a full path. This Symbolic Logic approach works as follows:
    On file creation (Windows Event ID 4663 / Sysmon EID 11) of an executable (.exe,.com,.scr,.bat,.cmd)
    in any PATH or application directory, compute SHA256 and alert if it matches a known-malware TI hash.
    Independently alert if the new file''s base name equals a system utility (''net'',''ipconfig'',''findstr'',''cmd'',''powershell'')
    but the directory is not the canonical resolution path (System32/SysWOW64), per T1574.008 (https://attack.mitre.org/techniques/T1574/008/)
    and 4 Ways Adversaries Hijack DLLs (https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/).
    Validate with Atomic Red Team T1574.008 (https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1574.008/T1574.008.md).
    What to look for: a planted or masquerading binary whose name or extension shadows a legitimate utility,
    an execution path outside trusted system directories (C:\Windows\System32 / C:\Windows\SysWOW64),
    an unexpected parent-child lineage, or a privilege/signature mismatch. A positive result -- a rule
    match, a statistical outlier, or a model alert -- indicates probable search-order hijacking; pivot
    to the responsible file and its creating process, the resolving/executing process and full path, the
    parent lineage and integrity level, the file''s hash and signature, and any subsequent network or
    privileged activity to confirm intent and scope. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek files.log
  - 'NAI: File systems of endpoints and servers, specifically directories listed in system and user PATH
    variables, and temporary download locations (e.g., browser caches, Downloads folder).'
  range: Last 90 days; for alerting, evaluate in near-real-time on each new file-creation or process-creation
    event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">- index=windows (EventCode=4663 OR EventCode=11)\n| where match(TargetFilename,\"(?i)\\.(exe|com|scr|bat|cmd)$\"\
      )\n| eval stem=lower(mvindex(split(replace(TargetFilename,\"\\\\.[^.]+$\",\"\"),\"\\\\\"),-1))\n\
      | lookup ti_malware_hashes SHA256 OUTPUT verdict AS ti_hit\n| where isnotnull(ti_hit)\n    OR (stem\
      \ IN (\"net\",\"ipconfig\",\"findstr\",\"cmd\",\"powershell\")\n        AND NOT match(TargetFilename,\"\
      (?i)\\\\Windows\\\\(System32|SysWOW64)\\\\\"))\n| table _time host TargetFilename SHA256 ti_hit"
- question: '[Stealth] Flag rare filename-in-path tuples by prevalence: Can you determine whether an executable
    file (.exe, .com, .scr, .bat) is written to a directory listed in the initiating program''s search
    path, and its filename matches a known system utility or its hash matches a known malicious signature
    that is later invoked when the caller omits a full path. -- specifically, using the ''Flag rare filename-in-path
    tuples by prevalence'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary abuses Windows search-order and PATHEXT
    resolution to run a malicious file in place of a trusted, bare-name utility (T1574.008), blending
    malicious execution into normal system activity. This evidence focuses on the condition that an executable
