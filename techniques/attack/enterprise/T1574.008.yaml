    path, and its filename matches a known system utility or its hash matches a known malicious signature
    that is later invoked when the caller omits a full path. This Statistical Method approach works as
    follows: Maintain fleet-wide counts of (filename, full_directory) tuples for new executables; alert
    when a tuple is first-seen or below the bottom 0.1% prevalence for that filename, derived per-environment
    rather than fixed (Using Frequency Analysis to Defend Office 365 (https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365),
    What''s the deal with prevalence? (https://blog.f-secure.com/whats-the-deal-with-prevalence/)). Retain
    Shannon entropy of the filename (>95th percentile per directory) as a secondary signal for randomly
    generated names. What to look for: a planted or masquerading binary whose name or extension shadows
    a legitimate utility, an execution path outside trusted system directories (C:\Windows\System32 /
    C:\Windows\SysWOW64), an unexpected parent-child lineage, or a privilege/signature mismatch. A positive
    result -- a rule match, a statistical outlier, or a model alert -- indicates probable search-order
    hijacking; pivot to the responsible file and its creating process, the resolving/executing process
    and full path, the parent lineage and integrity level, the file''s hash and signature, and any subsequent
    network or privileged activity to confirm intent and scope. A negative result helps rule out this
    particular vector but should be corroborated with the other questions in this playbook, since a single
    method can miss stealthy, low-and-slow, or living-off-the-land activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek files.log
  - 'NAI: File systems of endpoints and servers, specifically directories listed in system and user PATH
    variables, and temporary download locations (e.g., browser caches, Downloads folder).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>- index=windows (EventCode=4688 OR EventCode=4663)

      | eval base=lower(mvindex(split(coalesce(NewProcessName,TargetFilename),"\\"),-1))

      | eval dir=replace(coalesce(NewProcessName,TargetFilename),"\\[^\\]+$","")

      | stats count by base dir

      | eventstats sum(count) AS tot by base

      | eval prevalence=count/tot, ent=entropy(base)

      | where prevalence < 0.001 OR count<=1 OR ent>p95_entropy

      | table base dir count prevalence ent'
