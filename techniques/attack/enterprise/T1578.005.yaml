  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline per principal: set(actions), set(geo,asn), hourly_count dist over 90d\n  stream\
      \ sensitive_calls:\n    | flag if (principal,action) first_seen\n    | flag if geo/asn not in baseline\n\
      \    | flag if hourly_count > pctile99 (modified_z/MAD)\n    | track fail_rate as feature\n  | alert\
      \ with rare_field(action|geo|asn)"
- question: When each configuration-change event is scored as a feature-vector outlier (Isolation Forest
    over action, principal, ASN/geo, region, hour, byte/count) and as an unusual user-role-resource-action
    edge in a heterogeneous IAM graph, does it surface as anomalous?
  context: 'Multivariate and relational anomalies escape single-field rules. Scoring each configuration-change
    event with an Isolation Forest over features (action, principal, ASN/geo, region, hour, byte/count)
    detects feature-vector outliers, while modeling the same event as an edge in a heterogeneous IAM graph
    (GNN) detects unusual user-role-resource-action relationships even when each attribute looks normal
    alone. Surfacing the contributing neighbors/features in the alert provides explainability. Reinforcing
    with rare-API population ML over CloudTrail catches seldom-used modification APIs. In the Defense
    Impairment tactic this finds compromised principals making structurally unusual compute-configuration
    changes that evade simpler analytics. References: [Isolation Forest](https://ieeexplore.ieee.org/document/4781136)
    [Graph Neural Network Based Adaptive Threat Detection for Cloud IAM Logs](https://arxiv.org/abs/2512.10280)
    [Detecting Threats in AWS CloudTrail Logs Using Machine Learning](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning)'
