  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [image,parent,arg_len,arg_entropy,mod_verb_tokens,user_ctx,dst_asn_rep,bytes]\n\
      \  model = RandomForest(active_learning_labels)\n  score = model.predict_proba(new_cli_exec)\n \
      \ | where score > threshold\n  | alert with top3_features"
- question: Do any process command-line strings or control-plane userAgent fields match the known syntax,
    module names, or signatures of offensive cloud frameworks such as Pacu, Invoke-PowerZure, Cloudsplaining,
    or Stratus Red Team?
  context: 'Offensive cloud frameworks leave recognizable fingerprints in both endpoint command lines
    and the userAgent strings they emit to the cloud control plane. Matching process-creation command
    lines (Windows 4688 / Sysmon 1) and cloud userAgent fields against signatures for pacu, Invoke-PowerZure,
    cloudsplaining, and stratus provides a high-precision deterministic detection: any hit indicates an
    attacker (or unsanctioned red-teamer) is actively enumerating or modifying cloud configuration. Cross-checking
    the control-plane userAgent confirms whether the activity reached the cloud. A positive result is
    near-conclusive for malicious tooling use and warrants immediate response in the Defense Impairment
    context. References: [Stratus Red Team](https://github.com/DataDog/stratus-red-team)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Administrator workstations, developer endpoints, and servers with cloud SDKs/CLIs installed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  ProcCreate(4688/Sysmon1) | where cmdline ~ /(pacu|Invoke-PowerZure|cloudsplaining|stratus)/i\n\
      \  | union (cloudtrail/activity where userAgent ~ /(pacu|powerzure|cloudsplaining|stratus)/i)\n\
      \  | alert \"offensive cloud framework signature\""
- question: Within 30-minute command sessions, do any command sequences fall in the bottom 1st percentile
    of n-gram frequency while also containing compute-modification verbs (quota, policy, region)?
  context: 'Adversary tradecraft often injects rare command sequences into otherwise normal sessions.
    Computing n-gram frequencies over 30-minute command sessions and flagging sequences in the bottom
    1st percentile - with extra weight when the rare n-gram includes modification verbs like quota/policy/region
    - surfaces improbable workflows that signatures would miss. Reporting the specific rare n-gram driving
    the score gives the analyst an explainable lead. In the Defense Impairment tactic, a rare sequence
    that culminates in a quota or policy change is a meaningful indicator that an attacker is reshaping
    compute configuration to hide or expand their footprint. References: [Finding Anomalies in Windows
    Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Administrator workstations, developer endpoints, and servers with cloud SDKs/CLIs installed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  sessionize cmds by user,host into 30m windows\n  | compute ngram_freq over 30d corpus\n\
      \  | where ngram_pctile < 1 AND ngram contains (quota|policy|region)\n  | weight by rarity of modification_verb\n\
      \  | alert with driving_ngram"
- question: Does an LSTM log-key model trained on benign command/API sequences flag an observed next action
    - such as a quota or region change injected mid-workflow - as falling outside its top-g predicted
    actions?
  context: 'Some malicious modifications are individually plausible but appear at an improbable point
    in a workflow. Training an LSTM (DeepLog-style) on benign command/API sequences lets the model predict
    the probable next action; when the actual next event (e.g., a quota increase or region enablement
    injected mid-workflow) is not among the model''s top-g predictions, that deviation flags an anomalous
    workflow. Outputting the predicted-versus-observed action provides explainability. In the Defense
    Impairment context this catches stealthy reconfiguration that hides inside legitimate-looking sessions,
    complementing the n-gram and signature approaches. References: [DeepLog: Anomaly Detection and Diagnosis
    from System Logs through Deep Learning](https://acmccs.github.io/papers/p1285-duA.pdf)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Administrator workstations, developer endpoints, and servers with cloud SDKs/CLIs installed.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = LSTM_logkey(train=benign cmd/api sequences)\n  for each event: pred = model.topg(prev_sequence)\n\
      \  | where observed_action NOT in pred\n  | alert with predicted_vs_observed"
- question: Is any sensitive configuration-modification API call (RequestServiceQuotaIncrease, ModifyVpcAttribute,
    Set-AzPolicyDefinition, EnableRegion, subscription-move) being made by an identity or role that is
    NOT on the approved allow-list for such actions?
  context: 'Sensitive compute-configuration APIs should only be invoked by a small, known set of administrative
    identities or automation roles. Maintaining an allow-list of principals permitted to call these APIs
    and alerting on any call by an off-list identity gives a deterministic, low-false-positive detection
    of credential misuse. Evaluating errorCode/AccessDenied separately captures permission-probing by
    an identity that lacks the rights but is testing them. A positive result - an unlisted identity successfully
    modifying quotas, VPC attributes, policies, or regions - is strong evidence of adversary-controlled
    credentials altering compute configuration to evade defenses, the core of the Defense Impairment tactic.
    References: [Compromised Cloud Compute Credentials](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - 'NAI: Cloud provider logging services (e.g., AWS CloudTrail S3 bucket, Azure Log Analytics Workspace),
    Identity and Access Management (IAM) systems, and VPN/remote access logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  cloudtrail/activity where eventName in (RequestServiceQuotaIncrease,ModifyVpcAttribute,\n\
      \        Set-AzPolicyDefinition,EnableRegion,subscription-move)\n  | where principal NOT in approved_allowlist\n\
      \  | branch errorCode==AccessDenied -> alert \"permission probing\"\n  | else alert \"unauthorized\
      \ config modification\""
- question: For each principal, is a sensitive configuration-modification call a first-seen principal->action
    edge, originating from an unseen geography/ASN, or exceeding the 99th-percentile hourly count using
    robust modified-Z/MAD thresholds?
  context: 'Even an allow-listed principal can be compromised, so behavioral baselining adds depth. Building
    each principal''s history of sensitive calls and flagging first-time principal->action edges, calls
    from never-before-seen geos/ASNs, or hourly counts above the 99th percentile (using robust modified-Z/MAD)
    catches account takeover and lateral abuse. Tracking AccessDenied/failed-call rates as a distinct
    feature highlights enumeration. Reporting which field (action, geo, or ASN) was rare gives the analyst
    an explainable lead. In the Defense Impairment context, a first-seen quota/policy/region modification
    from a new location is a strong takeover signal; tooling such as cloudtrail-anomaly can operationalize
    first-seen detection. References: [On Bayesian new edge prediction and anomaly detection in computer
    networks](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf)
    [cloudtrail-anomaly](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)'
