questions:
- question: Are cloud CLI binaries (az.exe, aws.exe, gcloud.exe) or their python wrappers being launched
    from non-standard parent processes (such as Office applications, browsers, or archive tools), and
    can each such execution be tied within ~15 minutes to a matching cloud control-plane configuration-modification
    event from an enriched source IP/ASN/geo?
  context: 'In the Defense Impairment tactic, an adversary who has stolen cloud credentials often drives
    configuration changes from a compromised endpoint using the native cloud CLI. Legitimate CLI use is
    normally spawned by a shell or a known CI/CD agent; execution parented by an Office app, browser,
    or archive utility is a strong provenance anomaly suggestive of phishing-delivered tooling or living-off-the-land
    abuse. By inspecting process-creation logs (Windows 4688 / Sysmon 1) for these binaries, alerting
    when the parent is unexpected or the hash matches known-bad, and then correlating within a 15-minute
    window to a control-plane modification (RequestServiceQuotaIncrease, ModifyVpcAttribute, Set-AzPolicyDefinition),
    the analyst reconstructs the office-app->script->cloud-CLI->control-plane causal chain. A positive
    result - a rare causal chain landing on a quota/policy/region change from a suspicious IP - is high-confidence
    evidence of adversary-driven compute reconfiguration; a negative result helps clear benign automation.
    References: [ProvDetector: Hunting Stealthy Malware via Data Provenance Analysis](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf)
    [Compromised Cloud Compute Credentials](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Administrator workstations, DevOps jump boxes, CI/CD pipeline servers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  proc = ProcCreate(4688/Sysmon1) where image in (az.exe,aws.exe,gcloud.exe,python*)\n\
      \  | where parent_image NOT in (cmd.exe,powershell.exe,bash,known_ci_agents)\n     OR proc.hash\
      \ in threat_intel_hashes\n  | join cloudtrail/activity on user/host within 15m\n        where eventName\
      \ in (RequestServiceQuotaIncrease,ModifyVpcAttribute,Set-AzPolicyDefinition)\n  | enrich src_ip\
      \ with asn,geo,ti\n  | rank rare(parent->image->eventName) chains\n  | alert"
  - technology: Zeek/pseudocode
    query: ">-\n  conn = load conn.log; dns = load dns.log\n  | join host_proc on src_ip/time where image\
      \ in (az.exe,aws.exe,gcloud.exe)\n  | where resp_h in ti_feed OR query in ti_domains\n  | alert\
      \ \"cloud CLI host beaconing to TI infra\""
- question: For each host or role, does the execution frequency of cloud CLI tools, the byte size of their
    command arguments, or the success/failure (AccessDenied/throttling) state of the resulting control-plane
    calls deviate sharply (>3 standard deviations / modified Z-score) from its 30-day, time-of-day-aware
    baseline?
  context: 'Adversaries reconfiguring cloud compute frequently generate a spike in CLI activity or a burst
    of permission-probing failures that stand out from a host''s normal rhythm. Baselining per host/role
    the CLI execution count per minute, argument byte counts, and the AccessDenied/throttling rate, then
    flagging jumps beyond three standard deviations of the time-of-day-aware mean (using a modified Z-score/MAD
    to resist legitimate batch jobs), gives an explainable statistical signal. A run of AccessDenied responses
    is itself a distinct enumeration/permission-probing indicator that precedes a successful modification.
    A positive result - an abnormal frequency spike or failure burst with the top contributing fields
    surfaced - focuses triage on a likely compromised principal in support of the Defense Impairment assessment.
    References: [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Administrator workstations, DevOps jump boxes, CI/CD pipeline servers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline per host,role over 30d (time-of-day aware):\n     freq = count(cli_exec)/min;\
      \ argbytes; fail_rate = AccessDenied/throttle ratio\n  stream cli_exec | compute modified_z(freq),\
      \ modified_z(argbytes), modified_z(fail_rate)\n  | where any z > 3\n  | alert with top_contributing_field(freq|argbytes|fail_rate)"
- question: When scored by a supervised classifier (e.g., Random Forest kept current with analyst active-learning
    labels) using features such as process name, parent, argument length/entropy, modification verb tokens,
    user context, destination ASN reputation, and byte counts, does a new cloud CLI execution classify
    as malicious living-off-the-land usage?
  context: 'Signature and threshold rules miss renamed or obfuscated tooling. A supervised classifier
    trained on rich features - process/parent, argument length and entropy, the presence of modification
    verb tokens (quota/policy/region), user context, destination ASN reputation, and byte counts - generalizes
    across obfuscation and tool renaming, and active-learning labels from analysts keep it current as
    adversaries adapt. Emitting the top-3 contributing features in the alert gives the analyst the explanation
    needed to validate the call. In the Defense Impairment context, a high malicious score on a CLI execution
    that touches compute configuration is a strong prompt to investigate the underlying credential and
    host. Labeled positives for tuning can be generated with Stratus Red Team. References: [Living-Off-The-Land
    Command Detection Using Active Learning](https://arxiv.org/abs/2111.15039) [Stratus Red Team](https://github.com/DataDog/stratus-red-team)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - AWS CloudTrail logs
