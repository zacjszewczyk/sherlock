name: 'T1578.005: Modify Cloud Compute Infrastructure: Modify Cloud Compute Configurations'
id: 60c698ec-4a54-43a6-b6dc-4c6607e52d5f
description: 'This playbook helps an analyst investigate suspected modification of cloud compute configurations
  (T1578.005) by an adversary seeking to evade defenses and/or enable resource hijacking. It correlates
  host, network, and cloud control-plane telemetry to surface anomalous or unauthorized changes to service
  quotas, tenant-wide policies, subscription associations, and allowed deployment regions. Specifically
  it hunts for: cloud CLI binaries (az.exe, aws.exe, gcloud.exe) and their wrappers spawning from unusual
  parent processes and beaconing to threat-intel infrastructure while a matching control-plane modification
  is logged; command lines matching offensive cloud frameworks (Pacu, PowerZure, Cloudsplaining, Stratus);
  sensitive configuration-modification API calls (RequestServiceQuotaIncrease, ModifyVpcAttribute, Set-AzPolicyDefinition,
  EnableRegion, subscription moves) by identities, geographies, or ASNs with little or no history of such
  activity; enablement of unapproved or long-unused cloud regions immediately followed by resource deployment;
  and quota increases followed by bursts of resource provisioning and egress consistent with hijacking.
  For each signal it provides deterministic rules, statistical baselining, and machine-learning approaches
  so an analyst can confirm whether an adversary has tampered with cloud compute configurations.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
