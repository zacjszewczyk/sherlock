    query: ">-\n  iforest = IsolationForest(features=[action,principal,asn,geo,region,hour,byte_count])\n\
      \  graph = IAM_heterograph(user-role-resource-action)\n  score_event = max(iforest.score, gnn.edge_anomaly)\n\
      \  | where score_event > threshold\n  | alert with contributing_features_and_neighbors"
- question: Are any policy/configuration changes or resource-deployment API calls targeting cloud regions
    outside the organization's approved region list, and is the targeted region unknown in governance
    documentation?
  context: 'Adversaries enable and deploy into unused or unsupported regions to operate out of sight of
    defenders who monitor only sanctioned regions (often to support resource hijacking). Maintaining an
    approved-region allow-list and alerting on any policy/config or deployment call targeting an off-list
    region - auto-escalating when the region is absent from governance documentation - is a precise deterministic
    detection. A positive result, especially an EnableRegion or deployment into a region the organization
    has never sanctioned, is a strong indicator of defense-evasion-motivated reconfiguration. Region-abuse
    telemetry from Stratus Red Team can validate the rule. References: [Stratus Red Team](https://github.com/DataDog/stratus-red-team)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud provider logging services, corporate cloud governance documentation, and the corporate
    Asset Management Database.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  cloudtrail/activity where (eventName ~ /(EnableRegion|policy|config)/ OR isDeploymentCall)\n\
      \  | extract target_region\n  | where target_region NOT in approved_region_list\n  | escalate if\
      \ target_region NOT in governance_docs\n  | alert \"unapproved region targeted\""
- question: Do any deployments or configuration changes occur in regions with zero historical usage or
    unused for more than 180 days (a first-seen region edge), using robust thresholds, and are failed/AccessDenied
    region operations occurring as probing?
  context: 'Statistical region-novelty detection complements the static allow-list by catching regions
    that are technically permitted but never actually used. Alerting when a deployment or config change
    occurs in a region with zero history or unused for >180 days (a first-seen region edge) with robust
    thresholds flags adversary expansion into dormant regions. Profiling failed/AccessDenied region operations
    separately captures reconnaissance where an attacker probes which regions they can enable. In the
    Defense Impairment context, sudden activity in a long-dormant region is a high-value signal of an
    actor relocating compute beyond defender visibility; cloudtrail-anomaly can operationalize first-seen
    region detection. References: [On Bayesian new edge prediction and anomaly detection in computer networks](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf)
    [cloudtrail-anomaly](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)'
