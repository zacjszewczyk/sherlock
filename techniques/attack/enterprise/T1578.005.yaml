    query: ">-\n  baseline region usage per org/principal over 365d\n  stream region_ops:\n    | flag\
      \ if region_count==0 OR last_seen > 180d (first-seen region edge)\n    | profile AccessDenied/failed\
      \ region ops separately as probing\n  | alert with region,last_seen"
- question: When a one-class model (One-Class SVM / Isolation Forest) trained on benign region usage scores
    a region as outside the learned boundary, can the region-enable event be correlated with subsequent
    anomalous provisioning or egress from the same principal in a user-service-activity graph?
  context: 'A one-class model trained on benign region usage learns the organization''s normal geographic
    footprint and flags region usage outside that boundary without needing labeled attacks. Correlating
    a flagged region-enable event with subsequent anomalous provisioning or egress from the same principal
    - modeled in a user-service-activity (cross-service) graph - elevates an isolated novelty into an
    actionable attack narrative. Reporting top contributing features gives explainability. In the Defense
    Impairment context this links the act of enabling an unapproved region to the resource hijacking it
    facilitates, distinguishing benign expansion from adversarial relocation of compute. References: [Isolation
    Forest](https://ieeexplore.ieee.org/document/4781136) [CS-GAD: Cloudy with a Chance of Anomalies](https://arxiv.org/html/2409.12726v1)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud provider logging services, corporate cloud governance documentation, and the corporate
    Asset Management Database.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = OneClassSVM/IsolationForest(train=benign region usage)\n  | flag region_event\
      \ where outside_boundary\n  graph = user-service-activity\n  | correlate region_enable -> subsequent\
      \ anomalous provisioning/egress (same principal)\n  | alert with top_contributing_features"
- question: Is a service-quota increase (RequestServiceQuotaIncrease / quota-policy write) followed within
    one hour by more than 20 resource-creation calls and then more than 1GB of egress to a single destination
    within the next hour?
  context: 'The classic resource-hijacking chain is: raise the compute quota, mass-provision instances,
    then exfiltrate or mine. Deterministically alerting on the sequence quota-increase -> >20 resource-creation
    calls within 1 hour -> >1GB egress to a single destination within the next hour captures this end-to-end
    pattern from audit and flow logs. Given AI-assisted attacks can chain calls in minutes, the correlation
    window should be tightenable to minutes. A positive result is strong evidence that a configuration
    change directly enabled hijacking - precisely the abuse this technique describes - and warrants immediate
    containment of the principal and teardown of the provisioned resources. References: [AI-Assisted Cloud
    Intrusion Achieves Admin Access in 8 Minutes](https://www.sysdig.com/blog/ai-assisted-cloud-intrusion-achieves-admin-access-in-8-minutes)
    [Compromised Cloud Compute Credentials](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - 'NAI: Cloud provider logging services, network flow log sources, network egress points, and cloud
    billing/cost management dashboards.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  seq:\n    A = quota_increase (RequestServiceQuotaIncrease/quota-policy write)\n    B\
      \ = count(resource_create) > 20 within 1h after A\n    C = egress_bytes_to_single_dst > 1GB within\
      \ 1h after B\n  | tighten window to minutes if automated chaining suspected\n  | alert \"quota->provision->egress\
      \ hijacking chain\""
- question: After a quota event, does the next 24-hour resource-creation rate (count/min) or egress byte
    volume exceed a 30-day, time-of-day-aware baseline by more than 3 standard deviations (modified Z-score/MAD),
    with extra weight for non-business hours and creation failures?
  context: 'Quota increases are sometimes legitimate, so the post-event behavior must be measured statistically.
    Comparing the 24 hours after a quota event against a 30-day, time-of-day-aware baseline for both resource-creation
    rate (count/min) and egress byte volume, and alerting when either exceeds the baseline by >3 standard
    deviations (modified Z-score/MAD to resist batch jobs), separates genuine scaling from hijacking.
    Weighting non-business-hours activity and treating RunInstances/creation failures (capacity/AccessDenied)
    as a distinct signal sharpens detection. Surfacing whether creation-rate or egress drove the alert
    aids triage. In the Defense Impairment context this confirms whether a quota change translated into
    abnormal compute consumption. References: [Finding Anomalies in Windows Event Logs Using Standard
    Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - 'NAI: Cloud provider logging services, network flow log sources, network egress points, and cloud
    billing/cost management dashboards.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline 30d (time-of-day aware): create_rate count/min, egress_bytes per principal/region\n\
      \  after quota_event: measure next 24h create_rate, egress_bytes\n  | where modified_z(create_rate)\
      \ > 3 OR modified_z(egress) > 3\n  | weight non_business_hours; treat create_failures as distinct\
      \ signal\n  | alert with driving_metric(create_rate|egress)"
- question: Does a time-series forecast of per-principal/per-region provisioning and egress volumes show
    an upper-confidence-bound breach or a changepoint occurring immediately after a configuration change
    such as a quota increase?
  context: 'Forecasting models capture seasonal and trend structure that fixed thresholds miss. Forecasting
    expected per-principal/per-region provisioning and egress volumes and alerting on an upper-confidence-bound
    breach or a changepoint that occurs immediately after a config change (e.g., a quota increase) detects
    hijacking that ramps faster than normal even when absolute counts are not yet record-breaking. Reporting
    the forecast-versus-observed delta and the top contributing series gives the analyst explainable context.
    In the Defense Impairment tactic, a changepoint tightly following a quota or policy modification is
    compelling evidence that the configuration change enabled abusive compute consumption. References:
    [Intrusion detection in cloud computing based on time series anomalies utilizing machine learning](https://link.springer.com/article/10.1186/s13677-023-00491-x)'
  answer_sources:
  - AWS CloudTrail logs
