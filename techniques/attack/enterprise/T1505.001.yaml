questions:
- question: '[Persistence] Match SQL connections to TI C2 hosts: Can you determine whether the primary
    SQL Server process (sqlservr.exe) initiates an outbound network connection to a destination IP address
    or domain that matches an entry on a high-confidence threat intelligence feed of known command and
    control (C2) servers. -- specifically using the ''Match SQL connections to TI C2 hosts'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Microsoft SQL
    Server stored procedures and CLR assemblies to establish durable persistence and execute operating-system
    commands (for example by enabling xp_cmdshell or marking a startup procedure via sp_procoption), so
    they retain access across service restarts under the SQL service account. This evidence focuses on
    the condition that the primary SQL Server process (sqlservr.exe) initiates an outbound network connection
    to a destination IP address or domain that matches an entry on a high-confidence threat intelligence
    feed of known command and control (C2) servers. This Symbolic Logic approach looks for the following
    signal: Filter Zeek conn.log/Windows Event ID 5156 for sqlservr.exe outbound connections and alert
    when destinations match high-confidence C2 feeds. A positive result -- a rule match, a statistical
    outlier, or a model alert -- is consistent with malicious stored-procedure or CLR persistence (or
    the recon/command-execution it enables) and should prompt you to pivot to the responsible SQL login
    and session, the host and SQL instance, the specific procedure/assembly/configuration changed, change-management
    records, and any surrounding process, file-write, or outbound-network activity. A negative result
    helps reduce suspicion for this specific vector but does not exonerate the host: corroborate it with
    the other questions in this playbook, since a single method can miss stealthy, living-off-the-land,
    or low-and-slow database persistence.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: SQL server hosts, Enterprise edge firewalls, Network sensor appliances (e.g., Zeek), Threat
    intelligence platform feeds'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match SQL connections to TI C2 hosts

      source IN [Zeek conn.log, Windows Event ID 5156]

      | // implement: Filter Zeek conn.log/Windows Event ID 5156 for sqlservr.exe outbound connections
      and alert when destinations match high-confidence C2 feeds.

      | where matches_condition == true

      | alert'
  - technology: Zeek/pseudocode
    query: '# Match SQL connections to TI C2 hosts (network view)

      conn.log/dns.log

      | filter orig process/host == sqlservr.exe host

      | apply Symbolic Logic logic to destinations/volume/duration

      | alert'
- question: '[Persistence] Flag bottom-5% destination rarity: Can you determine whether the primary SQL
    Server process (sqlservr.exe) initiates an outbound network connection to a destination IP address
    or domain that matches an entry on a high-confidence threat intelligence feed of known command and
    control (C2) servers. -- specifically using the ''Flag bottom-5% destination rarity'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Microsoft SQL
    Server stored procedures and CLR assemblies to establish durable persistence and execute operating-system
    commands (for example by enabling xp_cmdshell or marking a startup procedure via sp_procoption), so
    they retain access across service restarts under the SQL service account. This evidence focuses on
