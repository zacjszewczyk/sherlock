  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Microsoft SQL
    Server stored procedures and CLR assemblies to establish durable persistence and execute operating-system
    commands (for example by enabling xp_cmdshell or marking a startup procedure via sp_procoption), so
    they retain access across service restarts under the SQL service account. This evidence focuses on
    the condition that adversaries enabling SQL persistence often generate distinctive failure-mode signals
    first: failed SQL logons (brute force/credential reuse), permission-denied attempts to change configuration,
    and ALTER/DROP SERVER AUDIT to disable logging before or after creating malicious procedures. This
    Statistical Method approach looks for the following signal: Track per-instance failed-logon count/min
    and permission-denied configuration attempts as distinct series; alert when a 5-minute window exceeds
    the host''s mean + 3 sigma or |modified Z|>3.5, especially when followed by a successful privileged
    action [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).
    A positive result -- a rule match, a statistical outlier, or a model alert -- is consistent with malicious
    stored-procedure or CLR persistence (or the recon/command-execution it enables) and should prompt
    you to pivot to the responsible SQL login and session, the host and SQL instance, the specific procedure/assembly/configuration
    changed, change-management records, and any surrounding process, file-write, or outbound-network activity.
    A negative result helps reduce suspicion for this specific vector but does not exonerate the host:
    corroborate it with the other questions in this playbook, since a single method can miss stealthy,
    living-off-the-land, or low-and-slow database persistence.'
