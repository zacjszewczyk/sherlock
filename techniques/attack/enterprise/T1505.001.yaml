    to a destination IP address or domain that matches an entry on a high-confidence threat intelligence
    feed of known command and control (C2) servers. This Statistical Method approach looks for the following
    signal: Track sqlservr.exe destination IP/domain/port combos over 90 days and alert when an outbound
    connection falls into the bottom 5th percentile for frequency. A positive result -- a rule match,
    a statistical outlier, or a model alert -- is consistent with malicious stored-procedure or CLR persistence
    (or the recon/command-execution it enables) and should prompt you to pivot to the responsible SQL
