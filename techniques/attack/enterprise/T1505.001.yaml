    corroborate it with the other questions in this playbook, since a single method can miss stealthy,
    living-off-the-land, or low-and-slow database persistence.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: SQL server hosts, Enterprise edge firewalls, Network sensor appliances (e.g., Zeek), Threat
    intelligence platform feeds'
  range: Last 90 days (baseline 30-90 days; evaluate per-event against the baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Flag bottom-5% destination rarity

