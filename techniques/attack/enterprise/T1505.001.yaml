name: 'T1505.001: SQL Stored Procedures'
id: 5497983b-e473-4e53-9c7d-46391db8cec8
description: 'This playbook helps an analyst investigate whether an adversary has abused Microsoft SQL
  Server stored procedures or CLR assemblies to establish persistence and execute operating-system commands
  (MITRE ATT&CK T1505.001) under the Persistence tactic. It guides the hunt across several behavioral
  angles on Windows and Linux SQL hosts: the core persistence primitives -- a stored procedure marked
  for automatic startup execution via sp_procoption, or CREATE/ALTER PROCEDURE and CREATE ASSEMBLY in
  the master database (SQL Server Audit EventID 33205); high-risk configuration toggles such as ''show
  advanced options'', ''xp_cmdshell'', and ''clr enabled'' (sp_configure change-tracking EventID 15457,
  Sysmon registry events, Windows 4657) made outside documented change windows; the sqlservr.exe process
  spawning shells, scripting engines, or recon tooling (Windows 4688/Sysmon 1) as a side effect of xp_cmdshell/CLR
  execution; sqlservr.exe writing executable files (.exe/.dll/.ps1/.bat) outside its database and log
  directories (Sysmon 11, Windows 4663); sqlservr.exe making outbound network connections to threat-intel
  C2 hosts, rare destinations, or non-business geographies and statistical volume/duration outliers (Zeek
  conn.log/dns.log, Windows 5156); and the failure-mode signals that frequently precede persistence --
  failed-logon bursts, permission-denied configuration attempts, the addition of new sysadmin logins,
  and ALTER/DROP SERVER AUDIT to disable logging. Detection methods combine symbolic-logic rules, statistical
  baselining/forecasting (modified Z-score, 3-sigma, percentile, ARIMA/Prophet), and machine-learning
  models (logistic regression, one-class SVM/Isolation Forest, Random Forest, LSTM next-event sequence
  modeling, provenance-graph GNNs) so the analyst can corroborate suspected SQL persistence across configuration
  changes, procedure/assembly DDL, process lineage, file writes, network context, and authentication anomalies.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
