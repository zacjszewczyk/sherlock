- question: Does the evidence show "Benign launch followed by tamper and persistence"? Using deterministic
    correlation rules, can you identify benign launch followed by tamper and persistence consistent with
    PEB-based process argument spoofing?
  context: 'Tactic: Stealth (TA0005). Information requirement: Is the adversary evading defenses by spoofing
    process arguments? Evidence: A process that was logged with a benign command line is later involved
    in persistence or defense-evasion activity shortly after memory-write or process-access events, indicating
    the process image continued execution under altered runtime arguments. Method (Symbolic Logic): Correlate
    benign-looking process launches with subsequent Sysmon Event ID 10 process-access (write-capable)
    events and then scheduled-task (Event ID 4698) or Run-key (Sysmon Event ID 12/13) modifications from
    the same lineage within 5 minutes. Alert when the sequence indicates a process was altered after creation
    and then used for persistence — the spoof-then-act pattern behind PEB overwrites ([The Return of the
    Spoof, NVISO](https://blog.nviso.eu/2020/02/04/the-return-of-the-spoof-part-2-command-line-spoofing/),
    [How to Argue Like Cobalt Strike, XPN](https://blog.xpnsec.com/how-to-argue-like-cobalt-strike/)).
    Treat Sysmon Event ID 25 ''image is replaced'' in the chain as confirmatory ([Detecting Process Injection
    with Wazuh](https://wazuh.com/blog/detecting-process-injection-attacks-with-wazuh/)) and an unusual
    parent/child as a co-signal ([Unusual Parent-Child Relationship, Elastic](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/)).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 10
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - Windows Event ID 4698
  - EDR process telemetry
  - 'NAI: User Workstations, Critical Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Benign launch -> tamper -> persistence within 5 min, same lineage

      launch = benign_cmdline proc (EventCode=4688)

      tamper = Sysmon EventCode=10 process_access (write-capable) on same lineage

      persist = Event ID 4698 scheduled_task OR Sysmon EventCode=12/13 Run-key mod

      alert if launch -> tamper -> persist within 5m

      confirmatory: Sysmon EventCode=25 image_replaced

      co_signal: unusual parent/child relationship'
