    source process, target image, access mask, suspend/resume timing, bytes written, and resulting child
    behaviors as features. ETW memory-sequence models detect the allocate/write/protect/resume chain at
    high accuracy and low FP ([Springer ETW](https://link.springer.com/article/10.1007/s10207-024-00836-w));
    provenance GNNs flag the tamper subgraph as a node/edge outlier ([ThreaTrace](https://arxiv.org/pdf/2111.04333);
    [KAIROS](https://tfjmp.org/publications/2024-sp.pdf)). Output the top-3 contributing features (e.g.,
    PROCESS_VM_WRITE to suspended target, resume timing, child shell) in the alert.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - EDR process access telemetry
  - 'NAI: User Workstations, Domain Controllers, Application Servers'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: '// Process-tamper lineage clustering

      features = {source_proc, target_image, access_mask, suspend_resume_timing, bytes_written, child_behavior}

      cluster process_lifecycles(creation, access, resume, child_events)

      flag tamper_subgraph as node/edge outlier (provenance GNN) or ETW allocate/write/protect/resume
      chain

      output top3_features (PROCESS_VM_WRITE to suspended target, resume_timing, child_shell)'
- question: Does the evidence show "Creation-to-memory command line mismatch"? Using deterministic correlation
    rules, can you identify creation-to-memory command line mismatch consistent with PEB-based process
    argument spoofing?
  context: 'Tactic: Stealth (TA0005). Information requirement: Is the adversary evading defenses by spoofing
    process arguments? Evidence: The command line captured at process creation differs from a later command-line
    string or memory-derived argument view collected by an EDR, sensor rescan, or memory inspection tool
    for the same running process. Method (Symbolic Logic): Compare the command line captured in Windows
    Event ID 4688/Sysmon Event ID 1 with later command-line values retrieved from EDR telemetry or memory
    inspection (PEB re-read) of the same PID/process GUID. Alert on exact mismatches, newly introduced
    suspicious flags, or replacement of a benign string with a hidden/encoded payload. Because command-line
    arguments live in the user-writable PEB RTL_USER_PROCESS_PARAMETERS.CommandLine ([PEB structure, Microsoft](https://learn.microsoft.com/en-us/windows/win32/api/winternl/ns-winternl-peb)),
    any creation-vs-runtime delta is direct evidence of the overwrite described in [How to Argue Like
    Cobalt Strike, XPN](https://blog.xpnsec.com/how-to-argue-like-cobalt-strike/) and [The Return of the
    Spoof, NVISO](https://blog.nviso.eu/2020/02/04/the-return-of-the-spoof-part-2-command-line-spoofing/).
    Score recovered runtime arguments against [Suspicious Windows Command Shell Arguments, Elastic](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - EDR process telemetry
  - Memory inspection logs
  - 'NAI: User Workstations, Application Servers, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Creation-time vs runtime/memory command line delta\ncreate_cmd = WinEventLog:Security EventCode=4688\
      \ OR Sysmon EventCode=1 .CommandLine\nruntime_cmd = EDR_telemetry OR memory_inspection(PEB re-read)\
      \ .CommandLine  // same PID/GUID\nalert if create_cmd != runtime_cmd\n   OR runtime_cmd introduces\
      \ suspicious_flags\n   OR benign_string replaced_by encoded/hidden payload\nscore runtime_cmd against\
      \ suspicious_cmd_shell_args"
- question: When you baseline normal behavior, does "Mismatch rarity baseline" reveal a statistical outlier
    indicating process argument spoofing?
  context: 'Tactic: Stealth (TA0005). Information requirement: Is the adversary evading defenses by spoofing
    process arguments? Evidence: The command line captured at process creation differs from a later command-line
    string or memory-derived argument view collected by an EDR, sensor rescan, or memory inspection tool
    for the same running process. Method (Statistical Method): Track the rate of command-line mismatches
    by image, signer, and host role over a rolling 30-day baseline. Alert on a host''s first mismatch
    for a signed binary or when mismatch frequency exceeds the 99th percentile for that image class. Include
    argument-length delta (a spoof requires the fake buffer be >= the real argument length per [The Return
    of the Spoof, NVISO](https://blog.nviso.eu/2020/02/04/the-return-of-the-spoof-part-2-command-line-spoofing/))
    and command-line entropy delta as Volume features, modeled per [High Command Line Entropy, Elastic](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).
    Derive thresholds from your own fleet distribution.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - EDR process telemetry
  - Memory inspection logs
  - 'NAI: User Workstations, Application Servers, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Mismatch rarity baseline\nbaseline mismatch_rate by {image, signer, host_role} over 30d\n\
      alert if host.first_mismatch for signed_binary\n   OR mismatch_freq > p99 for image_class\nfeatures\
      \ = {arg_length_delta (fake_buf >= real_arg_len), cmdline_entropy_delta}\nthresholds derived per-fleet\
      \ distribution"
