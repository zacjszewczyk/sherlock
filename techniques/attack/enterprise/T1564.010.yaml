questions:
- question: Does the evidence show "Benign command line with hostile follow-on behavior"? Using deterministic
    correlation rules, can you identify benign command line with hostile follow-on behavior consistent
    with PEB-based process argument spoofing?
  context: 'Tactic: Stealth (TA0005). Information requirement: Is the adversary evading defenses by spoofing
    process arguments? Evidence: A process is created with a benign-looking command line, but shortly
    afterward the same process performs network or execution behavior inconsistent with that command line,
    suggesting the command-line data exposed to sensors was altered after launch and is being used to
    disguise intent. Method (Symbolic Logic): Correlate Windows Event ID 4688/Sysmon Event ID 1 process
    creations showing common benign command lines with Zeek and EDR telemetry from the same PID/process
    GUID in the next 60 seconds. Alert when the process immediately reaches a threat-intel destination,
    launches a shell/scripting engine, or contacts ports incompatible with the logged command line''s
    stated function. Treat zero-length/blank command lines on core system processes that then make outbound
    connections as high fidelity, per [Windows Processes With Zero-length Command-line Arguments, Splunk](https://research.splunk.com/endpoint/54fa06c5-96a2-4406-a4a7-44d93ddbd173/);
    cross-check suspicious switches against [Suspicious Windows Command Shell Arguments, Elastic](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/).
    The benign-log/malicious-behavior split is the defining symptom of PEB argument overwrite described
    in [The Return of the Spoof, NVISO](https://blog.nviso.eu/2020/02/04/the-return-of-the-spoof-part-2-command-line-spoofing/)
    and [How to Argue Like Cobalt Strike, XPN](https://blog.xpnsec.com/how-to-argue-like-cobalt-strike/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - EDR process telemetry
  - 'NAI: User Workstations, Application Servers, Internet Gateway, SIEM'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Benign cmdline at creation, hostile behavior within 60s on same PID/GUID\nproc = WinEventLog:Security\
      \ EventCode=4688 OR Sysmon EventCode=1\njoin (Zeek conn.log, Zeek dns.log, EDR network) by ProcessGuid/PID\n\
      where time(net) - time(proc) <= 60s\nalert if net.dest in threat_intel\n   OR proc spawns shell/scripting\
      \ engine (cmd,powershell,wscript,cscript)\n   OR net.dest_port incompatible_with(proc.CommandLine.stated_function)\n\
      high_fidelity if proc.CommandLine == \"\" AND proc.Image in core_system_procs AND outbound_conn\n\
      cross_check proc.CommandLine against suspicious_cmd_shell_args list"
- question: When you baseline normal behavior, does "Behavior-to-command mismatch scoring" reveal a statistical
    outlier indicating process argument spoofing?
  context: 'Tactic: Stealth (TA0005). Information requirement: Is the adversary evading defenses by spoofing
    process arguments? Evidence: A process is created with a benign-looking command line, but shortly
    afterward the same process performs network or execution behavior inconsistent with that command line,
    suggesting the command-line data exposed to sensors was altered after launch and is being used to
    disguise intent. Method (Statistical Method): For high-use binaries such as `svchost.exe`, `rundll32.exe`,
    and `msedge.exe`, baseline normal command-line clusters against subsequent destinations, ports, child-process
    counts, bytes egressed, and connection-failure rates over 30 days. Alert when a new instance lands
    outside the 99th percentile for that exact command-line cluster. Profile failure states (blocked connections,
    NXDOMAIN, 404 from a ''benign'' browser command line) as distinct features, and include Volume/Frequency
    metrics (connections/min, bytes out). Derive per-environment thresholds from your own fleet; entropy
    of the command line can be modeled per [High Command Line Entropy, Elastic](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html)
    and learned representations per [BERT Embeddings for Command-Line Anomaly Detection, CrowdStrike](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - EDR process telemetry
  - 'NAI: User Workstations, Application Servers, Internet Gateway, SIEM'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Behavior-to-command mismatch scoring for high-use binaries\nfor img in [svchost.exe, rundll32.exe,\
      \ msedge.exe]:\n  baseline(cmdline_cluster) over 30d => {dest, ports, child_count, bytes_out, conn_fail_rate}\n\
      \  feat = {dest, ports, child_count, bytes_out, conn_fail_rate, NXDOMAIN, http_404, conn_per_min,\
      \ cmdline_entropy}\n  alert if new_instance.feat outside p99(cmdline_cluster)\n  thresholds derived\
      \ per-fleet"
- question: Does a trained model flag "Process behavior mismatch classifier" as likely process argument
    spoofing, and what are the top contributing features?
  context: 'Tactic: Stealth (TA0005). Information requirement: Is the adversary evading defenses by spoofing
    process arguments? Evidence: A process is created with a benign-looking command line, but shortly
    afterward the same process performs network or execution behavior inconsistent with that command line,
    suggesting the command-line data exposed to sensors was altered after launch and is being used to
    disguise intent. Method (Machine Learning): Train a supervised model on labeled process lifecycles
    using features from the initial command line, process ancestry, network destinations, child processes,
    and image reputation; flag cases where behavior strongly contradicts the logged command line. Provenance-graph
    models generalize this without per-binary rules ([ThreaTrace, Wang et al.](https://arxiv.org/pdf/2111.04333),
    code https://github.com/threaTrace-detector/threaTrace; [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf),
    code https://github.com/ProvenanceAnalytics/kairos). The model MUST surface the top-3 contributing
    features in the alert (e.g., command-line entropy delta, post-resume network destination, anomalous
    parent) rather than only a score.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - EDR process telemetry
  - 'NAI: User Workstations, Application Servers, Internet Gateway, SIEM'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "// Supervised process-behavior mismatch classifier\nmodel = train(features=[init_cmdline,\
      \ proc_ancestry, net_dest, child_procs, image_reputation],\n              labels=spoofed_vs_benign)\n\
      score = model.predict(process_lifecycle)\nalert if behavior strongly contradicts logged_cmdline\n\
      output top3_features (e.g., cmdline_entropy_delta, post_resume_dest, anomalous_parent)"
- question: Does the evidence show "Process-access plus suspicious resume chain"? Using deterministic
    correlation rules, can you identify process-access plus suspicious resume chain consistent with PEB-based
    process argument spoofing?
  context: 'Tactic: Stealth (TA0005). Information requirement: Is the adversary evading defenses by spoofing
    process arguments? Evidence: A process created in a suspended or low-activity state is accessed by
    another process using write-capable rights and later resumes execution with child-process, file, or
    network behavior inconsistent with the originally logged command line. Method (Symbolic Logic): Alert
    when Sysmon Event ID 10 or EDR process-access telemetry shows a process opening another process with
    `PROCESS_VM_WRITE`+`PROCESS_VM_OPERATION` (and the target was created suspended moments earlier),
    and the target subsequently resumes (`ResumeThread`) and spawns shells, scripting engines, or other
    high-risk children inconsistent with the logged command line. This suspended-create -> remote PEB
    write -> resume sequence is the exact spoofing recipe in [The Return of the Spoof, NVISO](https://blog.nviso.eu/2020/02/04/the-return-of-the-spoof-part-2-command-line-spoofing/)
    and [How to Argue Like Cobalt Strike, XPN](https://blog.xpnsec.com/how-to-argue-like-cobalt-strike/).
    Pair with Sysmon Event ID 25 ''image is replaced'' and Event ID 8 CreateRemoteThread as sibling tamper
    signals ([Detecting Process Injection with Wazuh](https://wazuh.com/blog/detecting-process-injection-attacks-with-wazuh/),
    [Sysmon CreateRemoteThread, TrustedSec](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md)).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - EDR process access telemetry
  - 'NAI: User Workstations, Domain Controllers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Suspended create -> remote PEB write -> resume -> high-risk child\naccess = Sysmon EventCode=10\
      \ OR EDR process_access\nwhere GrantedAccess includes PROCESS_VM_WRITE AND PROCESS_VM_OPERATION\n\
      \  AND target.created_suspended within last_few_seconds\ntarget_resume = ResumeThread(target) then\
      \ spawns shell/scripting/high_risk_child\nalert when access -> resume -> child inconsistent_with\
      \ target.CommandLine\nsibling_signals: Sysmon EventCode=25 (image replaced), EventCode=8 CreateRemoteThread"
- question: When you baseline normal behavior, does "Rare memory-write lineage score" reveal a statistical
    outlier indicating process argument spoofing?
  context: 'Tactic: Stealth (TA0005). Information requirement: Is the adversary evading defenses by spoofing
    process arguments? Evidence: A process created in a suspended or low-activity state is accessed by
    another process using write-capable rights and later resumes execution with child-process, file, or
    network behavior inconsistent with the originally logged command line. Method (Statistical Method):
    Baseline per-target-image process-access relationships, cross-process-writes/min, bytes written to
    the remote process, and child-process outcomes over 30 days. Escalate when a target receives write-capable
    access from a rare source process and then produces a child chain below the 1st percentile for that
    image/command-line combination. Track first-seen tamper events per host and per-signer write-access
    rates as rarity/failure signals; legitimate cross-process thread/memory writes are rare by default
    ([Sysmon CreateRemoteThread, TrustedSec](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md)),
    and ETW memory-event frequency baselining is demonstrated in [A New Approach for Detecting Process
    Injection Using Memory Analysis, Springer](https://link.springer.com/article/10.1007/s10207-024-00836-w).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - EDR process access telemetry
  - 'NAI: User Workstations, Domain Controllers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Rare memory-write lineage score\nbaseline per target_image over 30d => {access_relations,\
      \ cross_writes_per_min, bytes_written, child_outcomes}\nescalate if target receives write-capable\
      \ access from rare source_process\n  AND resulting child_chain below p1 for that image/cmdline\n\
      track first_seen_tamper per host, per_signer_write_rate as rarity signals"
