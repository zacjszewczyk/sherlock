name: 'T1564.010: Hide Artifacts: Process Argument Spoofing'
id: dba7351c-f583-4288-9ee9-759ea5a71ba5
description: 'Investigate whether an adversary is hiding malicious process command-line arguments by overwriting
  the Process Environment Block (PEB) after a process is created (Process Argument Spoofing). This playbook
  helps an analyst hunt the classic spoofing recipe on Windows: a process is launched (often suspended)
  with a benign-looking command line that sensors capture at creation time, then another process opens
  it with write-capable rights (PROCESS_VM_WRITE / PROCESS_VM_OPERATION), overwrites the RTL_USER_PROCESS_PARAMETERS.CommandLine
  in the PEB via WriteProcessMemory, and resumes execution under altered arguments. It correlates process-creation
  telemetry (Windows Event ID 4688, Sysmon Event ID 1) with process-access events (Sysmon Event ID 10),
  memory inspection / EDR re-reads of the PEB, network behavior (Zeek, EDR), and follow-on persistence
  and defense-evasion actions (scheduled tasks, Run keys) to surface the defining symptom of this technique:
  a benign command line logged at launch paired with runtime behavior, memory contents, or child processes
  that contradict it. The playbook spans symbolic-logic correlation rules, statistical rarity/baseline
  scoring, and machine-learning provenance and command-line models so an analyst can detect creation-vs-runtime
  mismatches, rare cross-process memory writes, and spoof-then-act chains.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
