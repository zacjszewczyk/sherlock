- question: '[Lateral Movement] Service parent spawning shell rule: Can you determine whether a parent
    process associated with a network service (e.g., services.exe, lsass.exe, svchost.exe, vmtoolsd.exe)
    spawns a child process not typically associated with its normal function, such as cmd.exe, powershell.exe,
