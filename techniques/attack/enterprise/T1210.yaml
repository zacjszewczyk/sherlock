    lengths, inter-arrival times, protocol flags, payload entropy) to catch known-family exploits. For
    every alert, surface the top-3 contributing features (e.g., resp_bytes deviation, packet-size variance,
    RST rate) using a faithful explanation method, per [xNIDS: Explaining Deep Learning-based NIDS, Feng
    et al.](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng). A positive result
