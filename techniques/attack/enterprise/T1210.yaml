  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary exploits a programming
    flaw in an exposed remote service (SMB, RDP, WinRM, SSH, NFS, databases, web servers, or ESXi/vCenter)
    to run attacker-controlled code on an internal host and pivot deeper into the network, often leaving
