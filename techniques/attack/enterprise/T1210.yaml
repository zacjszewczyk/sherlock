name: 'T1210: Exploitation of Remote Services'
id: df0478e1-6b35-48b6-9108-78541f0ae7a2
description: 'This playbook helps an analyst investigate whether a sophisticated external actor, a commodity
  intruder, or an insider is exploiting vulnerable remote services to move laterally and gain unauthorized
  access to internal systems (MITRE ATT&CK T1210) under the Lateral Movement tactic. It guides the hunt
  across complementary angles spanning Windows, Linux, macOS, and ESXi/vCenter: network-level detection
  of known exploit payloads against remote-service ports such as SMB (445/139), RDP (3389), WinRM (5985/5986),
  NFS, SSH (22), ARD/VNC (5900), and ESXi/vCenter endpoints (OpenSLP 427, CIM 5989, vSphere HTTPS 443/902)
  using NIDS/Zeek signatures, payload byte-frequency modeling, and autoencoder/streaming NIDS; host-level
  detection of lateral-movement tooling on the command line (PsExec/PSEXESVC, wmic /node:, Impacket wmiexec/smbexec
  artifacts, service and scheduled-task installs, admin-share writes); anomalous child processes spawned
  by network-service parents (services.exe/lsass.exe/svchost.exe/sshd/httpd/smbd/vmtoolsd/hostd launching
  cmd, powershell, sh, bash, curl, python); service crashes, segfaults, core dumps, and abnormal daemon
  restarts that coincide with a spike of inbound (and failed/reset) connections to the targeted port;
  and post-exploitation internal network scanning / fan-out from a freshly accessed host. Detection methods
  combine symbolic-logic rules, statistical baselining/time-series and entropy analysis, and machine-learning
  models (autoencoders, gradient boosting, random forests, SARIMA/Prophet, DBSCAN, and temporal graph
  link-prediction) applied to Zeek conn/dce_rpc/rdp/smb_files/notice logs, Windows Security/System and
  Sysmon events, auditd, Linux syslog, ESXi hostd/vmkernel logs, and macOS unified logs, so the analyst
  can corroborate suspected remote-service exploitation against payload signatures, process lineage, service-stability
  telemetry, and subsequent lateral fan-out.'
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
