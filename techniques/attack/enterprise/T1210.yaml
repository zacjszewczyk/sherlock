    This evidence focuses on the condition that a parent process associated with a network service (e.g.,
    services.exe, lsass.exe, svchost.exe, vmtoolsd.exe) spawns a child process not typically associated
    with its normal function, such as cmd.exe, powershell.exe, or whoami.exe. This Symbolic Logic approach
    works as follows: Create a high-fidelity alert for any process creation (Event ID 4688 / Sysmon 1)
    where the parent is ''lsass.exe'', or where the parent is ''services.exe'' or a network-facing ''svchost.exe''
    and the child is ''cmd.exe''/''powershell.exe'', correlated with an inbound network connection within
    the previous 5 minutes. The services.exe->cmd.exe pattern is the deterministic analytic [CAR-2014-05-002:
    Services Launching Command Shell](https://car.mitre.org/analytics/CAR-2014-05-002/); on Linux/ESXi/macOS
    apply the equivalent rule (sshd/httpd/smbd/vmtoolsd/hostd spawning /bin/sh, bash, python, curl) per
    [JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf). A positive result
