questions:
- question: '[Lateral Movement] NIDS exploit-payload signatures: Can you determine whether network traffic
    from a single source to a single destination over a remote service port (e.g., 445/tcp, 3389/tcp,
    5986/tcp) contains byte patterns or payload characteristics matching signatures of known exploits
    (e.g., CVE-2017-0144 ''EternalBlue'', CVE-2019-0708 ''BlueKeep''). -- specifically, using the ''NIDS
    exploit-payload signatures'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary exploits a programming
    flaw in an exposed remote service (SMB, RDP, WinRM, SSH, NFS, databases, web servers, or ESXi/vCenter)
    to run attacker-controlled code on an internal host and pivot deeper into the network, often leaving
    traces in network payloads, process lineage, service-stability logs, and subsequent lateral connections.
    This evidence focuses on the condition that network traffic from a single source to a single destination
    over a remote service port (e.g., 445/tcp, 3389/tcp, 5986/tcp) contains byte patterns or payload characteristics
    matching signatures of known exploits (e.g., CVE-2017-0144 ''EternalBlue'', CVE-2019-0708 ''BlueKeep'').
    This Symbolic Logic approach works as follows: Deploy and monitor NIDS signatures (Snort/Suricata/Zeek)
    that match known exploit payloads for services like SMB, RDP, NFS, or vCenter (e.g., CVE-2017-0144
    EternalBlue oversized SMB1 trans2/peeknamedpipe, CVE-2019-0708 BlueKeep MS_T120 channel binding),
    following established signature/protocol-anomaly rule design in [Network Intrusion Detection and Prevention,
    Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5). Add Zeek-layer deterministic detection
    of follow-on DCE-RPC operations (svcctl service create, atsvc/taskschd, remote registry, admin-share
    writes) using [BZAR](https://github.com/mitre-attack/bzar). Correlate every NIDS/Zeek alert with Zeek
    conn.log by joining on the 4-tuple (src IP, src port, dst IP, dst port) and timestamp to recover full
    session context. A positive result -- a signature/rule match, a statistical outlier, or a model alert
    -- suggests that a remote service on the host was exploited for lateral movement; pivot to the source
    host and account, the targeted service and its stability around the event, the process(es) spawned
    under the service context, files written to disk or admin shares, and any follow-on connections the
    host initiated to other internal assets. A negative result helps rule out this exploitation vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    novel, signatureless, or low-and-slow exploitation.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek dce_rpc.log
  - Zeek rdp.log
  - Zeek files.log
  - 'NAI: Network sensors (e.g., Zeek) monitoring East-West traffic between server subnets, at the network
    perimeter, and within the DMZ.'
  range: Last 90 days (correlate inbound connections and host events within 5-minute windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# NIDS exploit-payload signatures

      source IN [Zeek conn.log, Zeek dce_rpc.log, Zeek rdp.log, Zeek files.log]

      | WHERE matches_action_criteria("NIDS exploit-payload signatures")

      // Deploy and monitor NIDS signatures (Snort/Suricata/Zeek) that match known exploit payloads for
      services like SMB, RDP, NFS, or vCenter (e.g.

      | CORRELATE inbound_remote_service_connection WITHIN 5m

      | ALERT enrich(src_host, account, dst_host, service, port, process, parent)'
  - technology: Zeek/pseudocode
    query: '# Remote-service exploitation network correlation

      conn.log, dce_rpc.log, rdp.log, smb_files.log, notice.log

      | JOIN inbound service flow to host events on (id.resp_h, port, time-window)

      | AGG payload_match, orig:resp byte ratio, conn_state(S0/REJ/RSTO), fan-out per (id.orig_h, id.resp_h)

      | flag exploit payloads, crashes, or post-access fan-out per action criteria'
- question: '[Lateral Movement] Per-host service-flow baselining: Can you determine whether network traffic
    from a single source to a single destination over a remote service port (e.g., 445/tcp, 3389/tcp,
    5986/tcp) contains byte patterns or payload characteristics matching signatures of known exploits
    (e.g., CVE-2017-0144 ''EternalBlue'', CVE-2019-0708 ''BlueKeep''). -- specifically, using the ''Per-host
    service-flow baselining'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary exploits a programming
    flaw in an exposed remote service (SMB, RDP, WinRM, SSH, NFS, databases, web servers, or ESXi/vCenter)
    to run attacker-controlled code on an internal host and pivot deeper into the network, often leaving
    traces in network payloads, process lineage, service-stability logs, and subsequent lateral connections.
    This evidence focuses on the condition that network traffic from a single source to a single destination
    over a remote service port (e.g., 445/tcp, 3389/tcp, 5986/tcp) contains byte patterns or payload characteristics
    matching signatures of known exploits (e.g., CVE-2017-0144 ''EternalBlue'', CVE-2019-0708 ''BlueKeep'').
    This Statistical Method approach works as follows: For each remote service (e.g., SMB on 445, RDP
    3389, WinRM 5985/5986), establish a per-host baseline of Volume (orig_bytes, resp_bytes, total bytes),
    connection duration, and the orig:resp byte ratio; alert when a new connection exceeds the 99th percentile
    of the historical baseline for that host-service pair (derive the per-environment threshold from 30
    days of conn.log). In parallel, profile payload content with a PAYL-style per-port, per-length byte-frequency
    (1-gram) model scored by Mahalanobis distance to flag signatureless exploit shellcode, per [Anomalous
    Payload-Based Network Intrusion Detection, Wang and Stolfo](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).
    Failure-mode signal: separately track the per-host rate of TCP resets / aborted (conn_state S0,REJ,RSTO)
    connections to the service port — a spike of failed/half-open connections immediately before a successful
    large transfer is characteristic of iterative exploit attempts, consistent with time-series request
    modeling in [Intrusion Detection for Web Services Based on Time Series, Lahmadi et al.](https://ieeexplore.ieee.org/document/7129383/).
    A positive result -- a signature/rule match, a statistical outlier, or a model alert -- suggests that
    a remote service on the host was exploited for lateral movement; pivot to the source host and account,
    the targeted service and its stability around the event, the process(es) spawned under the service
    context, files written to disk or admin shares, and any follow-on connections the host initiated to
    other internal assets. A negative result helps rule out this exploitation vector but should be corroborated
    with the other questions in this playbook, since a single method can miss novel, signatureless, or
    low-and-slow exploitation.'
