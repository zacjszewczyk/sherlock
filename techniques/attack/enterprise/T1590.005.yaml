questions:
- question: '[Reconnaissance] CTI-matched connection alert: Can you determine whether an external IP address,
    present on a high-confidence threat intelligence feed, initiates a statistically significant volume
    of connections or DNS queries to the organization''s network perimeter. -- specifically, using the
    ''CTI-matched connection alert'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers the organization''s
    IP address information to support targeting -- mapping assigned public ranges to infer organizational
    size, location, ISP, and the hosting of internet-facing infrastructure, then using that to plan active
    scanning, acquire infrastructure, or attempt initial access. This evidence focuses on the condition
    that an external IP address, present on a high-confidence threat intelligence feed, initiates a statistically
    significant volume of connections or DNS queries to the organization''s network perimeter. This Symbolic
    Logic approach works as follows: Join Zeek conn.log and dns.log by source IP and compare with a high-confidence
    CTI feed of known scanners/C2 infrastructure; raise a medium-severity alert on matches against our
    external ranges. Operates on first-party logs ([conn.log schema](https://docs.zeek.org/en/master/logs/conn.html));
    CTI is enrichment only, not a mandatory gate. Include in the alert the matched indicator, distinct
    dst hosts/ports touched, and orig_bytes/resp_bytes volume. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable IP-address reconnaissance against the perimeter; pivot
    to the source IP and its ASN/geo and threat-intel reputation, the distinct destination hosts/ports
    and services touched, the connection success/failure state and byte volume, the DNS query types and
    names involved, and (for internal hosts) the responsible process and user, to scope the activity and
    decide whether to block the source or hunt for follow-on access attempts. A negative result helps
    rule out this particular reconnaissance vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, low-and-slow, distributed, or passive (third-party
    dataset) reconnaissance.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Perimeter Firewalls, Internet Gateway, External DNS Servers, Cloud Network Gateways'
  range: Last 90 days (correlate event-centered windows of +/- 5 minutes around the activity)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# CTI-matched connection alert (Symbolic Logic)

      source IN [Zeek conn.log, Zeek dns.log]

      | approach: Join Zeek conn.log and dns.log by source IP and compare with a high-confidence CTI feed
      of known scanners/C2 infrastructure; raise a medium-severity alert on matches against our external
      ranges. Operates on first-party logs ([conn.log schema](https://docs.zeek.org/en/master/logs/conn.html));
      CTI is enrichment only, not a mandatory gate. Include in the alert the matched indicator, distinct
      dst hosts/ports touched, and orig_bytes/resp_bytes volume.

      | correlate over NAI: Perimeter Firewalls, Internet Gateway, External DNS Servers, Cloud Network
      Gateways

      | emit alert with contributing fields and entity context (src IP, ASN/geo, distinct dst hosts/ports,
      conn_state, bytes, DNS qtype/name)'
  - technology: Zeek/pseudocode
    query: '# CTI-matched connection alert (Zeek view)

      watch Zeek conn.log, Zeek dns.log for external-source activity against the perimeter

      | derive per-source: distinct dst IPs/ports, conn_state mix (REJ/RSTO/S0 vs SF), orig_bytes/resp_bytes,
      dns qtype/rcode

      | apply the symbolic logic logic above per source over the window

      | emit candidate recon sources with src IP, scan geometry, failure ratio, volume'
- question: '[Reconnaissance] Active CTI percentile scoring: Can you determine whether an external IP
    address, present on a high-confidence threat intelligence feed, initiates a statistically significant
    volume of connections or DNS queries to the organization''s network perimeter. -- specifically, using
    the ''Active CTI percentile scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers the organization''s
    IP address information to support targeting -- mapping assigned public ranges to infer organizational
    size, location, ISP, and the hosting of internet-facing infrastructure, then using that to plan active
