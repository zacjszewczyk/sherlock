name: 'T1590.005: IP Addresses'
id: f6620935-ab7d-47ae-beb6-02f47d0d7ea0
description: 'This playbook helps an analyst investigate whether an adversary is actively gathering the
  organization''s IP address information for targeting purposes (MITRE ATT&CK T1590.005, IP Addresses),
  a Reconnaissance behavior in which an attacker enumerates assigned public IP ranges to derive organizational
  size, physical locations, ISP, and where/how internet-facing infrastructure is hosted, and to seed follow-on
  active scanning, infrastructure acquisition, or initial access. Because much of this activity occurs
  at or beyond the network perimeter and carries a high baseline false-positive rate, the hunt focuses
  on the observable footprint left in first-party perimeter telemetry and pursues the behavior from several
  complementary angles: external IPs on high-confidence threat-intel feeds generating statistically significant
  volumes of connections or DNS queries to the perimeter; external sources interacting with public-facing
  services using User-Agent strings, TLS (JA3/JA3S) fingerprints, or DNS patterns matching known reconnaissance
  tools (Nmap, Masscan, Nuclei, nikto, sqlmap); external IPs exhibiting horizontal scanning via high counts
  of distinct host/port touches or high failed-to-successful connection ratios (REJ/RSTO/S0); targeted
  service-fingerprinting probes marked by short-lived connections, protocol violations, and Zeek notice/dpd
  events; anomalous DNS reconnaissance such as AXFR/IXFR zone-transfer attempts and high NXDOMAIN ratios
  from subdomain brute-forcing; and compromised internal hosts fanning out to an anomalous number of external
  IPs/ports for outbound recon or pivoting. Detection methods combine deterministic symbolic-logic rules
  (CTI watchlists, recon tool/UA/JA3 signatures, failed-connection scan rules, Zeek notice/zone-transfer
  alerts, non-proxy fan-out rules), statistical baselining (percentile and standard-deviation thresholds,
  port/Shannon entropy, Threshold Random Walk sequential hypothesis testing, NXDOMAIN-ratio and connection-duration
  profiling), and machine learning (ARIMA/Prophet and STL time-series forecasting, Random Forest/gradient-boosting
  session classifiers, DBSCAN/Isolation Forest/one-class SVM anomaly detection, and the Kitsune autoencoder
  ensemble), applied primarily across Zeek conn/dns/http/ssl/dpd/notice logs plus Windows Event IDs 5156
  and 4688, so the analyst can corroborate suspected IP-address reconnaissance against source reputation,
  scan geometry, protocol behavior, and host-level fan-out.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
