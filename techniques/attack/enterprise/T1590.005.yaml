    that an external IP address, present on a high-confidence threat intelligence feed, initiates a statistically
    significant volume of connections or DNS queries to the organization''s network perimeter. This Statistical
    Method approach works as follows: For CTI-matched IPs, compute 5-minute connection/query counts (Frequency)
    and total bytes (Volume) and flag sources exceeding the 95th percentile of CTI activity observed over
    the prior 24h. Derive the percentile per dataset from your own perimeter baseline; re-tune monthly
    ([Ring et al. dataset/baseline guidance](https://arxiv.org/abs/1903.02460)). A positive result --
    a rule match, statistical outlier, or model alert -- indicates probable IP-address reconnaissance
    against the perimeter; pivot to the source IP and its ASN/geo and threat-intel reputation, the distinct
    destination hosts/ports and services touched, the connection success/failure state and byte volume,
    the DNS query types and names involved, and (for internal hosts) the responsible process and user,
    to scope the activity and decide whether to block the source or hunt for follow-on access attempts.
    A negative result helps rule out this particular reconnaissance vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    distributed, or passive (third-party dataset) reconnaissance.'
