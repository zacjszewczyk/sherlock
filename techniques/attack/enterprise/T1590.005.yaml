- question: '[Reconnaissance] Failed-connection ratio baseline: Can you determine whether an external
    source IP exhibits scanning behavior, defined by a high count of connection attempts to distinct hosts/ports
    or a high ratio of failed (e.g., REJ, S0) to successful connections. -- specifically, using the ''Failed-connection
    ratio baseline'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers the organization''s
    IP address information to support targeting -- mapping assigned public ranges to infer organizational
    size, location, ISP, and the hosting of internet-facing infrastructure, then using that to plan active
    scanning, acquire infrastructure, or attempt initial access. This evidence focuses on the condition
    that an external source IP exhibits scanning behavior, defined by a high count of connection attempts
    to distinct hosts/ports or a high ratio of failed (e.g., REJ, S0) to successful connections. This
    Statistical Method approach works as follows: Apply [Threshold Random Walk (TRW)](https://www.icir.org/vern/papers/portscan-oak04.pdf):
    treat each first-contact connection as a Bernoulli success/failure trial and run a sequential probability
    ratio test, declaring a scanner once the failed:successful likelihood ratio crosses the threshold
    (often ~4-5 attempts). Also flag external IPs whose failed/total ratio over 5 minutes exceeds 3 SD
