name: 'T1087.001: Local Account'
id: e8959ef9-84e4-45eb-b219-4c4151559c85
description: Investigate adversary attempts to enumerate local system accounts (MITRE ATT&CK T1087.001,
  Local Account, under the Discovery tactic). This playbook helps an analyst hunt for and triage the listing
  of local users, local administrators, and local groups across Windows, Linux, macOS, and ESXi hosts.
  It covers (1) detection of canonical account-enumeration utilities and command-line patterns such as
  net user, net localgroup, wmic useraccount get, Get-LocalUser, Get-LocalGroupMember, id, groups, reads
  of /etc/passwd, dscl . list /Users, and esxcli system account list; (2) statistical baselining of per-user/per-host
  enumeration frequency, volume, command-line entropy, and failure/access-denied rates that reveal scripted
  or low-privilege probing; (3) burst and low-and-slow clustering of discovery commands across hosts and
  time; (4) correlation of discovery activity with follow-on local logons (Logon Type 2/3) and dormant-account
  targeting; and (5) detection of SAM database dumping followed by anomalous outbound data transfer. Use
  it to distinguish benign administrator inventory activity from malicious reconnaissance that precedes
  lateral movement, privilege escalation, or credential theft.
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are the canonical local-account enumeration utilities (net user, net localgroup, wmic useraccount
    get, Get-LocalUser, Get-LocalGroupMember, Get-CimInstance Win32_UserAccount, id, groups, reads of
    /etc/passwd, /etc/group, /etc/sudoers, dscl . list /Users, dscacheutil -q user, or esxcli system account
    list) being executed on any endpoint or server, especially when spawned by a parent process that does
    not normally administer accounts?
  context: 'Discovery: A successful local-account discovery sequence typically produces a burst of account-listing
    commands. Build a watchlist that monitors process creation (Windows 4688, Sysmon EID 1), PowerShell
    ScriptBlock logging (4104), Linux auditd execve, macOS unified log, and ESXi shell for the documented
    enumeration utilities, matching on image name plus command-line substrings. Raise priority when the
    parent process is anomalous (outlook.exe, winword.exe, w3wp.exe, or a shell spawned by a web service),
    since this suggests the command originated from a compromised application rather than legitimate administration,
    or when several discovery commands cluster on one host/user. A positive result indicates an actor
    is orienting themselves on the host before follow-on actions; a negative result helps scope which
    hosts were not touched. References: [Local Account, T1087.001, MITRE ATT&CK](https://attack.mitre.org/techniques/T1087/001/);
    [Atomic Red Team T1087.001](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1087.001/T1087.001.md);
    [SigmaHQ](https://github.com/SigmaHQ/sigma); [CAR-2016-03-001 Host Discovery Commands](https://car.mitre.org/analytics/CAR-2016-03-001/).'
  answer_sources: &id001
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4798
  - Windows Event ID 4799
  - Sysmon Event ID 1
  - 'NAI: User workstations, Member servers, Domain controllers, Endpoint Detection and Response (EDR)
    platform, SIEM/Log Aggregator'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nSEARCH process_creation (EventCode=4688 OR Sysmon EID=1 OR 4104 OR auditd execve OR macos:unifiedlog\
      \ OR esxi:shell)\nWHERE Image IN (net.exe, net1.exe, wmic.exe, powershell.exe, id, groups, dscl,\
      \ dscacheutil, esxcli)\n  AND CommandLine MATCHES /(net (user|localgroup)|wmic useraccount get|Get-LocalUser|Get-LocalGroupMember|Win32_UserAccount|\\\
      /etc\\/(passwd|group|sudoers)|dscl . list \\/Users|dscacheutil -q user|esxcli system account list)/i\n\
      | EVAL priority = IF(ParentImage IN (outlook.exe,winword.exe,w3wp.exe,httpd,nginx,bash_from_web_svc),\
      \ \"high\", \"normal\")\n| TABLE host, user, ParentImage, Image, CommandLine, priority"
- question: Does a user or host exhibit an anomalous spike in account-enumeration activity compared to
    its own 30-day baseline of command frequency, number of distinct accounts returned, bytes read from
    /etc/passwd, or command-line entropy?
  context: 'Discovery: Static signatures miss novel tooling and overfire on busy admin servers. Compute
    a 30-day per-user and per-host baseline of (a) the frequency of account-enumeration commands per 5-minute
    and per-day window, (b) the volume of distinct local users/groups returned and bytes read from /etc/passwd,
    and (c) command-line entropy. Alert when a window exceeds mean + 3 sigma for that entity, when a host
    that has never run these utilities does so (first-seen), or when a single session queries an unusually
    large account set in a short burst (scripted discovery). Derive the sigma multiplier and burst count
    from local telemetry, starting near >10 discovery commands per 5 minutes. A spike against an entity''s
    own baseline is a strong indicator of automated or adversarial reconnaissance. References: [Finding
    Anomalies in Windows Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [CAR-2016-03-001](https://car.mitre.org/analytics/CAR-2016-03-001/).'
  answer_sources: *id001
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      SEARCH account_enum_events BY user, host, 5min_window

      | STATS count AS cmd_freq, dc(account_returned) AS volume, avg(cmdline_entropy) AS entropy

      | JOIN baseline (mean, stdev) ON user, host

      | WHERE cmd_freq > mean + 3*stdev OR first_seen(host)=true OR volume > burst_threshold

      | TABLE user, host, cmd_freq, volume, entropy'
- question: Is a low-privilege identity generating an elevated rate of access-denied or failed enumeration
    events (denied SAM hive access 4663/4656, failed dscl/dscacheutil calls, permission-denied reads of
    /etc/shadow, or 4625 failed logons immediately after a discovery command)?
  context: 'Discovery: The success/failure state of listing operations is itself a signal. An actor with
    limited privileges will generate failures while probing what they can enumerate. Count access-denied
    events on the SAM hive (4663/4656 with denied access), failed dscl/dscacheutil calls, permission-denied
    reads of /etc/shadow, and 4625 failed logons that immediately follow a discovery command. Alert when
    the per-host/per-user denied-or-failed rate exceeds its 99th-percentile baseline. A high failure rate
    points to a constrained identity testing the limits of its access, which is characteristic of early-stage
    post-compromise reconnaissance rather than routine administration. References: [AWS IAM AccessDenied
    Discovery Events, Splunk Threat Research Team](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      SEARCH (4663 OR 4656 access=DENIED on SAM) OR failed(dscl,dscacheutil) OR perm_denied(/etc/shadow)
      OR (4625 within 60s after discovery_cmd)

      | STATS count AS fail_rate BY user, host

      | JOIN baseline_p99 ON user, host

      | WHERE fail_rate > p99

      | TABLE user, host, fail_rate'
- question: When a supervised classifier scores process-tree, command-line, and PowerShell features, which
    events separate as high-confidence malicious local-account discovery versus benign administrator inventory?
  context: 'Discovery: Benign admin inventory and malicious discovery share tooling, so a supervised classifier
    trained on process-tree, command-line, and PowerShell features (parent image, user context/privilege,
    count of account-related tokens, distinct-account count returned, script length, time-of-day, subsequent
    privilege/group queries) can separate them. Label positives using Atomic Red Team T1087.001 telemetry.
    Emit only high-confidence detections and include the top-3 contributing features (anomalous parent,
    distinct-account count, recon-sequence membership) in the alert text for explainable triage. This
    complements sequence models (DeepLog) and provenance approaches (KAIROS). A high-confidence positive
    warrants escalation; the feature attributions guide the analyst to the specific reason it scored malicious.
    References: [Atomic Red Team T1087.001](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1087.001/T1087.001.md);
    [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015); [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '>-

      FEATURES = [parent_image, user_privilege, account_token_count, distinct_account_count, script_length,
      hour_of_day, followon_priv_query]

      MODEL = supervised_classifier(train=benign_admin + atomic_red_team_T1087.001)

      score = MODEL.predict_proba(event)

      IF score > 0.9: ALERT with top3_feature_importance(event)'
- question: Does any process creation event contain command-line arguments matching local-account enumeration
    patterns (net user, net localgroup, Get-LocalUser, Get-LocalGroupMember, wmic useraccount get, dscl
    . list /Users, id, groups, or esxcli system account list)?
  context: 'Discovery: This is the foundational command-line signature for the technique. Monitor process
    creation (Windows 4688, Sysmon EID 1) and inspect the command-line field with regular expressions
    for the canonical enumeration strings. Alert on any match, prioritizing executions spawned by non-standard
    parents (outlook.exe, winword.exe, powershell.exe, or web/app server processes), which indicate the
    command did not come from interactive administration. Validate detection coverage with Atomic Red
    Team T1087.001. A match confirms account enumeration occurred; the parent process and user context
    determine whether it is suspicious. References: [Local Account, T1087.001, MITRE ATT&CK](https://attack.mitre.org/techniques/T1087/001/);
    [SigmaHQ](https://github.com/SigmaHQ/sigma); [Atomic Red Team T1087.001](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1087.001/T1087.001.md).'
  answer_sources: &id002
  - Windows Event ID 4688
  - 'NAI: User workstations, Member servers, Domain controllers, Terminal servers, SIEM/Log Aggregator'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      SEARCH (EventCode=4688 OR Sysmon EID=1)

      WHERE CommandLine MATCHES /(net user|net localgroup|Get-LocalUser|Get-LocalGroupMember|wmic useraccount
      get|dscl . list \/Users|\bid\b|\bgroups\b|esxcli system account list)/i

      | EVAL priority = IF(ParentImage IN (outlook.exe,winword.exe,powershell.exe,w3wp.exe), "high", "normal")

      | TABLE host, user, ParentImage, CommandLine, priority'
- question: Does a new command line on a host or for a user exhibit Shannon entropy or discovery-command
    frequency that exceeds the entity's historical baseline, suggesting obfuscation or scripted enumeration?
  context: 'Discovery: Attackers often obfuscate commands or run them at higher frequency than a human
    administrator. Build a per-user/per-host baseline of command-line behavior. Compute the Shannon entropy
    of each new command line and alert when it exceeds the entity''s historical mean by more than 3 sigma
    (possible obfuscation/encoding). Track the frequency of discovery commands and alert above the 99th
    percentile of the entity''s hourly/daily count, and track the volume of distinct accounts/groups returned
    per session, flagging abnormally large enumerations. Derive thresholds from local data. Elevated entropy
    combined with high frequency strongly suggests automated, evasive reconnaissance rather than benign
    use. References: [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources: *id002
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      SEARCH process_creation BY user, host

      | EVAL entropy = shannon(CommandLine)

      | STATS avg(entropy) AS mean_e, stdev(entropy) AS sd_e, count AS freq, dc(account_returned) AS volume
      BY user, host

      | WHERE entropy > mean_e + 3*sd_e OR freq > p99(freq) OR volume > large_enum_threshold

      | TABLE user, host, entropy, freq, volume'
- question: Within a session, does a sequence model flag an improbable chain of process/command events
    (e.g., network connection -> whoami -> net user -> net localgroup administrators) as low-probability
    against learned benign behavior?
  context: 'Discovery: Individual commands may be benign, but their ordering reveals reconnaissance intent.
    Use a sequence model (LSTM/Transformer) over the temporal chain of process/command events in a session
    to flag improbable next events (DeepLog), drawing on the rare-short-sequence intuition from Forrest
    et al.''s ''A Sense of Self for Unix Processes''. Train on benign sessions so that chains such as
    network connection -> whoami -> net user -> net localgroup administrators score as low-probability.
    Surface the specific surprising event and the two preceding events (top-3 contributors) in the alert
    for explainable triage. A low-probability sequence indicates the host is being actively explored in
    a way that deviates from normal workflows. References: [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015);
    [A Sense of Self for Unix Processes, Forrest et al.](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\nSESSIONS = group_events_by_session(process_events ORDER BY time)\nMODEL = sequence_model(LSTM,\
      \ train=benign_sessions)\nFOR each next_event:\n  p = MODEL.prob(next_event | prior_window)\n  IF\
      \ p < threshold: ALERT with [surprising_event, prev_event_1, prev_event_2]"
- question: Does a single source user or host execute more than a static threshold (start at >10) of local-account
    discovery commands within a 5-minute window?
  context: 'Discovery: Scripted enumeration produces clustered bursts of discovery commands. Identify
    individual account-discovery commands via regex on command-line arguments and count them per source
    user and source host in 5-minute windows. Alert when the count exceeds a static threshold (start at
    >10 commands per 5 minutes), consistent with the clustered-discovery rationale in CAR-2016-03-001.
    This simple, high-signal rule catches automated reconnaissance tooling quickly. A positive result
    means a single entity is rapidly inventorying accounts, often the opening move of a hands-on-keyboard
    intrusion or worm. References: [SigmaHQ](https://github.com/SigmaHQ/sigma); [CAR-2016-03-001 Host
    Discovery Commands](https://car.mitre.org/analytics/CAR-2016-03-001/).'
  answer_sources: &id003
  - Windows Event ID 4688
  - 'NAI: Source host initiating discovery, Target hosts being enumerated, Security Information and Event
    Management (SIEM) system'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      SEARCH (EventCode=4688) WHERE CommandLine MATCHES /(net user|net localgroup|Get-LocalUser|wmic useraccount|dscl|esxcli
      system account list)/i

      | BUCKET _time span=5m

      | STATS count AS cmds BY source_user, source_host, _time

      | WHERE cmds > 10

      | TABLE source_user, source_host, _time, cmds'
- question: Does a source user or host exceed its own dynamic baseline (mean + 3 sigma) of discovery-command
    counts within a 5-minute sliding window?
  context: 'Discovery: Static thresholds either miss low-activity hosts or overfire on busy admin servers.
    Aggregate discovery-command counts by source user and source host over a 5-minute sliding window and
    maintain a per-entity baseline (mean, sigma). Alert when a window exceeds mean + 3 sigma for that
    specific entity. This captures scripted bursts that static thresholds miss on normally-quiet hosts
    while suppressing false positives on systems where bulk account operations are routine. An entity-relative
    spike is a tailored, lower-noise indicator of anomalous enumeration. References: [Finding Anomalies
    in Windows Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources: *id003
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      SEARCH discovery_commands

      | BUCKET _time span=5m (sliding)

      | STATS count AS cmds BY source_user, source_host, _time

      | JOIN baseline (mean, stdev) ON source_user, source_host

      | WHERE cmds > mean + 3*stdev

      | TABLE source_user, source_host, _time, cmds, mean, stdev'
- question: Can density-based clustering or graph embedding link sparse 'low-and-slow' enumeration events
    spread across multiple hosts, users, and time into a single coordinated campaign?
  context: 'Discovery: Sophisticated actors deliberately spread enumeration across hosts and time to stay
    under frequency thresholds. Feed event features (source host, target host, user, command type, timestamp)
    into density-based clustering (DBSCAN) or the heterogeneous-graph embedding of Log2vec to group sparse
    low-and-slow enumeration into one case, identifying coordinated campaigns that evade rate-based detection.
    Report the linked events and shared entities (top-3 contributors) in the alert. A cluster spanning
    multiple hosts that individually look benign reveals a campaign-level reconnaissance effort that single-host
    rules would never surface. References: [Log2vec, Liu et al.](https://doi.org/10.1145/3319535.3363749).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\nFEATURES = [source_host, target_host, user, command_type, timestamp]\nMODEL = DBSCAN(eps,\
      \ min_samples)  # or Log2vec heterogeneous graph embedding\nclusters = MODEL.fit(discovery_events)\n\
      FOR c IN clusters WHERE c spans multiple hosts/time:\n  ALERT with linked_events(c), shared_entities(c)"
- question: Is a local-account discovery command on a host followed within 60 minutes by a local logon
    (Logon Type 2/3, 4624 success or 4625 failure) from the same source IP or Logon ID using a local account?
  context: 'Discovery: The transition from discovery to access is the highest-value signal in this technique.
    Create a stateful SIEM rule that triggers when a T1087.001 discovery event (e.g., net user in 4688/Sysmon
    1) from a source host is followed within 60 minutes by a local logon on any host from the same source
    IP/Logon ID (4624 success or 4625 failure, Logon Type 2/3), and raise a high-priority alert. The discovery->access
    sequencing follows CAR-2016-03-001; for remote enumeration preceding the logon, corroborate with DCE/RPC
    SAMR/LSARPC notices from BZAR. This pattern indicates the actor has moved from reconnaissance to actively
    using an enumerated account, a critical escalation point. References: [CAR-2016-03-001](https://car.mitre.org/analytics/CAR-2016-03-001/);
    [BZAR](https://github.com/mitre-attack/bzar).'
  answer_sources: &id004
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Authentication servers, Domain Controllers, High-value servers, User workstations, SIEM system'
  range: 'Last 90 days (event-centered: 60-minute correlation window)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nSEARCH discovery_event (4688/Sysmon1 net user) AS d\n| JOIN logon (4624 OR 4625, LogonType\
      \ IN (2,3)) AS l\n  ON l.source_ip = d.source_ip OR l.logon_id = d.logon_id\n  WHERE l._time BETWEEN\
      \ d._time AND d._time + 60m\n| EVAL priority = \"high\"\n| TABLE d.host, d.CommandLine, l.host,\
      \ l.account, l.LogonType, l.status"
  - technology: Zeek/pseudocode
    query: '>-

      # corroborate remote enumeration via DCE/RPC SAMR/LSARPC (BZAR)

      SEARCH dce_rpc.log WHERE operation IN (SamrEnumerateUsersInDomain, LsarEnumerateAccountRights)

      | JOIN conn.log ON uid

      | TABLE ts, id.orig_h, id.resp_h, operation'
- question: For an enumerated local account that subsequently sees logon activity, how dormant is the
    account (time since last successful logon), and does its dormancy fall in the 95th percentile of least-used
    accounts?
  context: 'Discovery: Newly-enumerated dormant local accounts are high-value targets because attackers
    favor accounts that are unlikely to be monitored or whose anomalous use will go unnoticed. Enrich
    the discovery-to-logon correlation alert by computing, from authentication logs, the time since the
    target account''s last successful logon. Using a per-account baselining method, if dormancy falls
    in the 95th percentile (one of the least-used accounts), raise the risk score. Activity on a long-dormant
    account immediately after it was enumerated is strongly suspicious and should elevate the alert''s
    priority for analyst review. References: [Finding Anomalies in Windows Event Logs Using Standard Deviation,
    Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources: *id004
  range: Last 90 days (account dormancy lookback up to 1 year)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nFOR each correlation_alert(account):\n  last_logon = max(4624.time WHERE account)\n  dormancy\
      \ = now - last_logon\n| JOIN account_dormancy_baseline\n| EVAL risk = IF(dormancy >= p95(dormancy_all_accounts),\
      \ risk+high, risk)\n| TABLE account, last_logon, dormancy, risk"
- question: When a logon-risk classifier scores logon events using features plus a boolean is_preceded_by_discovery_event_in_last_60_min,
    which logons receive elevated risk warranting automated investigation?
  context: 'Discovery: A supervised classifier (logistic regression / gradient boosting) trained on logon
    features (logon type, time of day, source IP, target host, account dormancy) plus the boolean is_preceded_by_discovery_event_in_last_60_min
    lets logons that follow discovery receive higher risk and trigger automated investigation. Sequence
    context can be modeled with DeepLog. Include the top-3 contributing features (preceding-discovery
    flag, dormancy, rare source-target pair) in the alert. This operationalizes the discovery->access
    link probabilistically, surfacing the logons most likely to represent malicious use of an enumerated
    account while keeping triage explainable. References: [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '>-

      FEATURES = [logon_type, hour_of_day, source_ip, target_host, account_dormancy, is_preceded_by_discovery_event_in_last_60_min]

      MODEL = gradient_boosting(train=labeled_logons)

      risk = MODEL.predict_proba(logon)

      IF risk > threshold: INVESTIGATE with top3_feature_importance(logon)'
- question: Is there a SAM database dumping process event (reg.exe save hklm\sam, vssadmin create shadow,
    esentutl) or object-access (4663) on the SAM file, correlated with an outbound network file transfer
    (Zeek files.log) of a matching name or hash?
  context: 'Discovery: Local-account enumeration often precedes credential theft via SAM dumping, and
    exfiltration of the dumped hive is the damaging endgame. Monitor process creation (4688/Sysmon 1)
    for SAM hive access (reg.exe save hklm\sam, vssadmin create shadow, esentutl), object-access events
    (4663) on the SAM file, and correlate with network file-transfer logs (Zeek files.log) showing a matching
    name/hash transferred outbound. Remote SAM enumeration over named pipes can be corroborated with BZAR.
    A SAM-access event followed by a matching outbound transfer is a high-confidence credential-theft-and-exfiltration
    chain demanding immediate response. References: [SigmaHQ](https://github.com/SigmaHQ/sigma); [BZAR](https://github.com/mitre-attack/bzar).'
  answer_sources: &id005
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Domain Controllers, Critical application servers, Network egress points, File servers'
  range: Last 90 days (event-centered correlation around SAM access)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nSEARCH (4688/Sysmon1 CommandLine MATCHES /(reg(.exe)? save .*hklm\\\\sam|vssadmin create\
      \ shadow|esentutl.*sam)/i)\n  OR (4663 ObjectName ENDSWITH \\\\config\\\\SAM access=READ)\n| JOIN\
      \ zeek_files.log ON host WHERE filename ~ sam OR file_hash IN known_sam_hashes AND direction=outbound\n\
      | EVAL priority=\"critical\"\n| TABLE host, user, CommandLine, filename, file_hash, dest"
- question: After a SAM access event, does an outbound connection from that host in the next 15 minutes
    show orig_bytes in the 99th percentile of the host's typical per-connection volume, suggesting bulk
    extraction?
  context: 'Discovery: Exfiltration of stolen credential material manifests as an abnormal outbound data
    volume. When a SAM access event fires, inspect Zeek conn.log from that host for the next 15 minutes
    and baseline the host''s typical outbound bytes per connection. Alert when a connection''s orig_bytes
    is in the 99th percentile for that host (Volume metric), suggesting bulk extraction, using a per-entity
    deviation method. An outbound volume spike tightly coupled in time to SAM access strongly indicates
    the dumped hive (or other harvested data) is being exfiltrated, and should trigger containment. References:
    [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources: *id005
  range: Last 90 days (15-minute window after SAM access)
  queries:
  - technology: Zeek/pseudocode
    query: ">-\nON sam_access_event(host, t0):\n  SEARCH conn.log WHERE id.orig_h=host AND ts BETWEEN\
      \ t0 AND t0+15m\n  | JOIN host_baseline(orig_bytes p99)\n  | WHERE orig_bytes > p99\n  | TABLE ts,\
      \ id.orig_h, id.resp_h, orig_bytes, duration"
- question: Does an online anomaly detector over Zeek conn.log features (orig_bytes, resp_bytes, duration,
    protocol) flag an outbound egress spike on a critical asset (e.g., Domain Controller) that is temporally
    correlated with host-based SAM access?
  context: 'Discovery: For critical assets, unsupervised egress anomaly detection catches exfiltration
    patterns that fixed thresholds miss. Run an online anomaly detector (Isolation Forest, or the autoencoder-ensemble
    Kitsune) over Zeek conn.log features (orig_bytes, resp_bytes, duration, protocol) for critical assets
    like Domain Controllers. Provenance context from KAIROS or ThreaTrace ties the egress spike to the
    host-based SAM access process. Flag an outbound spike temporally correlated with SAM access and report
    the per-feature reconstruction error (top-3 contributors) for triage. A model-flagged egress anomaly
    that lines up with SAM access on a high-value host is a decisive exfiltration indicator. References:
    [Kitsune, Mirsky et al.](https://www.ndss-symposium.org/wp-content/uploads/2018/02/ndss2018_03A-3_Mirsky_paper.pdf);
