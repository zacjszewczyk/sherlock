name: 'T1565: Data Manipulation'
id: 94536a83-5d61-4103-80ef-4361dd1179b8
description: 'Investigate whether an adversary has inserted, deleted, or manipulated data to impact integrity
  or availability on critical systems. This playbook helps an analyst hunt for and triage data-manipulation
  activity across endpoints, file servers, database/application servers, and network egress points. It
  covers: file write/creation of known data-manipulation tooling (wipers, ransomware, tamper utilities)
  on sensitive paths; execution of native utilities or scripts that overwrite, corrupt, or delete data
  and backups (e.g., vssadmin/wbadmin/cipher/fsutil); abnormal volumes of file modification or deletion
  events against sensitive repositories (file shares, source-control, SharePoint); read->network->write
  provenance chains that suggest tampering after exfiltration; ransomware-style mass rename bursts with
  high-entropy or uniform extensions; and anomalous database writes or audit-log entries inconsistent
  with normal application/DBA fingerprints. Detection approaches span deterministic symbolic logic (hash
  matching, regex on destructive command lines, tamper-evident hash-chain verification), statistical baselining
  (entropy deviation, seasonal/change-point outliers, failure-mode profiling), and machine learning (Random
  Forest/Logistic Regression classifiers, Isolation Forest/DBSCAN clustering, LSTM/provenance sequence
  modeling, role-based query anomaly classification).'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any file write or creation event produce a file whose hash matches a known data-manipulation
    tool (wiper, ransomware payload, or tamper utility), especially on a sensitive path or shared volume?
  context: An adversary aiming to manipulate data integrity or availability (Impact, TA0040) frequently
    drops known tooling to disk before destroying or corrupting data. Hash each file-write/creation event
    (Sysmon Event ID 11, osquery file_events, 4663) and compare against a curated set of known wiper/ransomware/tamper-utility
    hashes (SHA1/MD5). A positive match on a critical file server, database server, domain controller,
    or workstation is a high-confidence indicator. Prioritize matches that write to sensitive paths or
    shared volumes. A negative result reduces but does not eliminate risk, since novel or repacked tooling
    will not match known hashes.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: Critical file servers, database servers, domain controllers, application servers, and user workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (Sysmon:EventCode=11, WinSecurity:4663, osquery:file_events)\n  | eval h=coalesce(sha1,md5,sha256)\n\
      \  | lookup known_data_manipulation_tools hash AS h OUTPUT tool_name\n  | where isnotnull(tool_name)\
      \ AND (path MATCH sensitive_paths OR path MATCH share_volumes)\n  | table _time host user process\
      \ path h tool_name"
  - technology: osquery/pseudocode
    query: ">-\n  SELECT target_path, action, sha1, size, mtime FROM file_events\n  WHERE action IN ('CREATED','UPDATED')\n\
      \  AND sha1 IN (SELECT hash FROM known_data_manipulation_tools);"
- question: Has the tamper-evident hash chain or forward-secure MAC on any protected file, log, or database
    audit trail failed verification or shown a sequence-number gap?
  context: Tamper-evident integrity chains deterministically prove modification or deletion. For protected
    files, logs, and DB audit trails, continuously verify a hash chain / forward-secure MAC and a monotonically
    increasing sequence number. Any verification failure or sequence-number gap is conclusive evidence
    that data or logs were altered or removed (Impact, TA0040), even when the modifying process itself
    was not captured. A failure should be treated as a confirmed integrity violation requiring immediate
    scoping of which records changed and when.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: Critical file servers, database servers, domain controllers, application servers, and user workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source=integrity_verifier\n  | where verify_status=\"FAIL\" OR seq_gap=true\n  | stats\
      \ count by host object seq_expected seq_observed last_good_time\n  | where count>0"
- question: Do the entropy characteristics of written file buffers deviate significantly (>3 sigma or
    above the 99th percentile) from the per-file-type baseline, indicating encryption or overwriting?
  context: Encrypting or overwriting file content drives Shannon entropy toward the ~8 bits/byte ceiling,
    the strongest signal of data destruction (UNVEIL; ShieldFS). Compute the entropy of the written buffer
    or first 4KB for each write and compare against a per-file-type baseline. Deviations beyond 3 sigma
    or the 99th percentile suggest the content is no longer normal structured/text data. This is most
    meaningful on sensitive repositories where file content is otherwise predictable; benign causes include
    legitimate compression/encryption, which should be allowlisted.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: Critical file servers, database servers, domain controllers, application servers, and user workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (Sysmon:EventCode=11, osquery:file_events)\n  | eval ent=shannon_entropy(write_buffer_first4k)\n\
      \  | join type=left file_ext [| inputlookup ext_entropy_baseline]\n  | eval z=(ent-mean_ent)/stdev_ent\n\
      \  | where z>3 OR ent>p99_ent\n  | table _time host process path ent z"
- question: Are there spikes in blocked or denied write operations, FIM verification failures, or access-denied
    (4663 failure) events on a given host or path that indicate attempted-but-blocked tampering?
  context: 'Failure Mode Awareness: even when a destructive write is blocked, the attempt leaves a trail.
    Track per-host/per-path rates of denied writes, FIM verification failures, and access-denied (Event
    ID 4663 failure) events as a distinct signal. A sudden spike indicates an adversary probing or attempting
    to tamper with protected data on a critical system (Impact, TA0040) even where controls held. Correlate
    spikes with the user/process generating them to identify the source.'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: Critical file servers, database servers, domain controllers, application servers, and user workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=WinSecurity (EventCode=4663 AND access_result=\"DENIED\")\n  | bin _time span=10m\n\
      \  | stats count AS denials by host path user _time\n  | eventstats avg(count) AS m stdev(count)\
      \ AS s by host path\n  | where denials > m + 3*s"
- question: Does a supervised file-classification model (Random Forest on extension, path, process, write-buffer
    entropy, and files-touched fraction) score any process's file activity above the 0.9 malicious threshold?
  context: A Random Forest trained on extension, path, process, write-buffer entropy, and the fraction
    of files touched (per ShieldFS) can classify file activity as benign or malicious. Alert on predictions
    above a 0.9 threshold and surface the top-3 contributing features (e.g., entropy, path coverage, parent
    process) to speed triage. This catches data-manipulation behavior that evades single-signal rules
    by combining weak indicators; investigate the implicated process tree and the files it touched (Impact,
    TA0040).
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: Critical file servers, database servers, domain controllers, application servers, and user workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [ext, path_class, process, write_entropy, files_touched_fraction]\n  score\
      \ = random_forest_model.predict_proba(features)\n  | where score >= 0.9\n  | eval top3 = explain_top_features(model,\
      \ features, n=3)\n  | table _time host process score top3"
- question: Was a native utility or scripting engine executed with command-line arguments designed to
    overwrite, corrupt, or delete data, shadow copies, or backups (e.g., vssadmin delete shadows, wbadmin
    delete, cipher /w, bcdedit recoveryenabled no, fsutil)?
  context: Adversaries pursuing impact commonly use living-off-the-land utilities to destroy data and
    inhibit recovery before or during a wiping/ransomware event (Impact, TA0040). Regex-match process-creation
    command lines (Event ID 4688, Sysmon-1) for destructive utilities and arguments, then confirm by checking
    whether the same host subsequently shows mass file deletion/modification. A positive correlation between
    a destructive command and a deletion burst is high-confidence. Single occurrences may be legitimate
    maintenance, so weigh the user, host role, and timing.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints and servers, particularly those hosting critical applications, databases,
    or file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (WinSecurity:4688, Sysmon:EventCode=1)\n  | where cmdline MATCHES \"(?i)(vssadmin\\\
      \\s+delete\\\\s+shadows|wmic\\\\s+shadowcopy\\\\s+delete|wbadmin\\\\s+delete|bcdedit.*recoveryenabled\\\
      \\s+no|cipher\\\\s+/w|fsutil)\"\n  | join host [search deletion_burst earliest=-30m]\n  | table\
      \ _time host user parent_process cmdline"
- question: Are any executed command lines statistically rare for their parent process and user, or run
    outside the normal maintenance window, and do they correlate with deletion-event volume on the host?
  context: Score command lines by parent-process and user frequency over a 30-day window and flag those
    in the bottom 5th percentile or executed outside the established maintenance window. Rare destructive
    commands that coincide with elevated deletion volume on the host suggest deliberate data manipulation
    rather than routine administration (Impact, TA0040). This catches abuse of legitimate tools by uncommon
    callers. Correlate the timing of the rare command with file-deletion spikes to confirm.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints and servers, particularly those hosting critical applications, databases,
    or file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (WinSecurity:4688, Sysmon:EventCode=1)\n  | stats count by cmdline parent_process\
      \ user\n  | eventstats perc5(count) AS p5 by parent_process user\n  | where count <= p5 OR _time\
      \ NOT IN maintenance_window\n  | join host [search deletion_volume_high]"
- question: Is there an elevated rate of failed or blocked destructive commands and process exit-error
    codes on any host, indicating attempted-but-blocked data destruction?
  context: 'Failure Mode Awareness: profile the rate of failed/blocked destructive commands and elevated
    process exit-error codes per host as a distinct signal. An adversary attempting to delete shadow copies
    or wipe data may be blocked by permissions or tamper protection, producing error exit codes rather
    than successful destruction (Impact, TA0040). A spike in such failures is a leading indicator of an
    in-progress attempt that controls partially mitigated; investigate the originating process and account.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints and servers, particularly those hosting critical applications, databases,
    or file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (WinSecurity:4688, Sysmon:EventCode=1)\n  | where cmdline MATCHES destructive_regex\
      \ AND exit_code != 0\n  | bin _time span=10m\n  | stats count by host user _time\n  | eventstats\
      \ avg(count) AS m stdev(count) AS s by host\n  | where count > m + 3*s"
- question: Does a command-line classification model (Logistic Regression / gradient-boosted on length,
    special-character ratio, n-grams, destructive keywords) score any executed command above the risk
    threshold?
  context: Train a Logistic Regression or gradient-boosted model on command length, special-character
    ratio, n-grams, and destructive keywords to classify command lines as benign or destructive. Alert
    when scores exceed the risk threshold and surface the top-3 contributing tokens/features for triage.
    This generalizes beyond static regex to catch obfuscated or novel destructive commands used for data
    manipulation (Impact, TA0040). Investigate the predicted command's full process tree, user, and subsequent
    file activity.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints and servers, particularly those hosting critical applications, databases,
    or file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [len(cmdline), special_char_ratio, char_ngrams, destructive_kw_count]\n \
      \ score = cmd_classifier.predict_proba(features)\n  | where score >= risk_threshold\n  | eval top3\
      \ = explain_top_tokens(model, cmdline, n=3)\n  | table _time host user cmdline score top3"
- question: Did any single process or user issue more than ~500 delete or modification events within 5
    minutes on a critical server or file share (or exceed that share's observed 99.9th-percentile burst)?
  context: A burst of file modifications or deletions far exceeding normal activity on a sensitive repository
    is a hallmark of bulk data destruction or ransomware encryption (Impact, TA0040). Alert when a process
    or user exceeds a high-volume threshold (e.g., >500 events in 5 minutes), tuned per environment from
    each share's observed 99.9th-percentile burst. A positive result warrants immediate investigation
    of the process, account, and affected paths, and consideration of isolating the host. Tune thresholds
    to the share's normal workload to limit false positives from legitimate batch jobs.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4659
  - Sysmon Event ID 23
  - Sysmon Event ID 26
  - 'NAI: Sensitive data repositories, including network file shares, source code management systems,
    code repositories (e.g., Git servers), and SharePoint sites.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (WinSecurity:4663, WinSecurity:4659, Sysmon:EventCode=23, osquery:file_events)\n\
      \  | where action IN (\"DELETE\",\"MODIFY\")\n  | bin _time span=5m\n  | stats count AS ops by host\
      \ process user _time\n  | where ops > coalesce(share_p999_burst, 500)"
- question: Do per-path hourly file-event counts exceed the seasonal baseline (99th percentile / 3 sigma
    for the time-of-day and day-of-week), or show an abrupt change-point level shift?
  context: Baseline per-path hourly event counts using STL decomposition with Seasonal-Hybrid ESD on robust
    (median/MAD) residuals, and flag exceedances of the 99th percentile or 3 sigma for the relevant time-of-day/day-of-week
    (Hochenbaum et al.). Additionally apply CUSUM/Bayesian change-point detection to catch abrupt level
    shifts (Aminikhanghahi & Cook). Seasonally aware baselining distinguishes a genuine anomalous surge
    of modifications/deletions on a sensitive repository (Impact, TA0040) from expected periodic spikes
    (e.g., nightly builds). Investigate the process and user driving the exceedance.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4659
  - Sysmon Event ID 23
  - Sysmon Event ID 26
  - 'NAI: Sensitive data repositories, including network file shares, source code management systems,
    code repositories (e.g., Git servers), and SharePoint sites.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (WinSecurity:4663, Sysmon:EventCode=23) | bin _time span=1h\n  | stats count\
      \ by path _time\n  | stl_decompose(count, period=168) -> residual\n  | eval robust_z=(residual-median)/(1.4826*mad)\n\
      \  | where robust_z>3 OR cusum_changepoint(count)=true"
- question: Are there surges in backup-job failures, volume-shadow errors, or constraint/permission-denied
    write failures that indicate availability manipulation distinct from successful-write volume?
  context: 'Failure Mode Awareness: treat surges in backup-job failures, volume-shadow errors, and constraint/permission-denied
    write failures as distinct availability-manipulation signals, separate from successful-write volume.
    An adversary inhibiting recovery or corrupting a repository may generate failing backup jobs and shadow-copy
    errors before or instead of visible mass writes (Impact, TA0040). A spike in these failures on a critical
    data store is a strong availability-impact indicator; correlate with destructive-command execution
    and process activity.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4659
  - Sysmon Event ID 23
  - Sysmon Event ID 26
  - 'NAI: Sensitive data repositories, including network file shares, source code management systems,
    code repositories (e.g., Git servers), and SharePoint sites.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (WinSecurity:4663, WinSecurity:4659, backup_logs, vss_logs)\n  | where status\
      \ IN (\"FAILED\",\"ACCESS_DENIED\",\"VSS_ERROR\",\"CONSTRAINT_VIOLATION\")\n  | bin _time span=15m\
      \ | stats count by host source _time\n  | eventstats avg(count) AS m stdev(count) AS s by host source\n\
      \  | where count > m + 3*s"
- question: Does an Isolation Forest over per-process file-activity features (delete/modify/rename counts,
    fraction of files touched, mean write entropy) flag any process as an outlier?
  context: Score per-process feature vectors (delete count, modify count, rename count, fraction of files
    touched, mean write entropy) with an Isolation Forest (Liu et al.; ShieldFS) and alert on outliers,
    surfacing the top-3 contributing features. Unsupervised outlier detection catches anomalous mass-modification
    behavior on sensitive repositories (Impact, TA0040) without predefined thresholds, adapting to each
    environment. Investigate the flagged process tree, the account, and the specific files affected to
    confirm whether the activity is malicious data manipulation.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4659
  - Sysmon Event ID 23
  - Sysmon Event ID 26
  - 'NAI: Sensitive data repositories, including network file shares, source code management systems,
    code repositories (e.g., Git servers), and SharePoint sites.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = per_process[delete_count, modify_count, rename_count, files_touched_fraction,\
      \ mean_write_entropy]\n  score = isolation_forest.decision_function(features)\n  | where score <\
      \ outlier_threshold\n  | eval top3 = explain_top_features(model, features, n=3)\n  | table _time\
      \ host process score top3"
- question: Did a single process read a sensitive file, then within 60 seconds connect to a non-allowlisted
    external IP, and then write back to the same file -- an anomalous read->network->write provenance
    chain?
  context: A read->network->write sequence on the same sensitive file by one process within a short window
    can indicate data tampering coordinated with exfiltration or an external command channel (Impact,
    TA0040). Alert when a file read is followed within 60 seconds by a connection to a non-allowlisted
    IP and then a write to the same file by the same process, modeling it as an anomalous provenance chain
    (KAIROS). Positive results on high-value-user endpoints, sensitive-data servers, DMZ hosts, or egress
    points are high priority. Allowlist legitimate sync/backup applications that exhibit similar patterns.
  answer_sources:
  - Windows Event ID 4663
  - Zeek conn.log
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - 'NAI: Endpoints of high-value users (e.g., developers, system administrators), servers hosting sensitive
    data, DMZ servers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  read = source=WinSecurity:4663 access=READ file=F process=P\n  net  = source=Sysmon:EventCode=3\
      \ process=P dest_ip NOT IN allowlist within 60s after read\n  write= source IN (WinSecurity:4663\
      \ access=WRITE, Sysmon:EventCode=11) file=F process=P after net\n  | correlate read->net->write\
      \ by host,P,F\n  | table _time host P F dest_ip"
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log: match egress dest to external non-allowlisted IP from host within read-write\
      \ window\n  | join host file-activity timeline"
- question: Is the external destination (IP, ASN, country) of a sensitive-file process's network connection
    rare or a new geography, or are there blocked-egress / NXDOMAIN / RST connection-failure signals?
  context: Baseline destination IP, ASN, and country frequencies for processes that handle sensitive files
    and flag connections to rare destinations or new geographies. Include connection-failure signals (blocked
    egress, NXDOMAIN, refused/RST) as distinct anomaly inputs (Failure Mode Awareness), since an adversary's
    first attempts may be blocked. A sensitive-data process suddenly contacting a rare or new-country
    destination suggests tampering-after-exfiltration or an external control channel (Impact, TA0040).
    Correlate with the file activity of the same process to assess impact.
  answer_sources:
  - Windows Event ID 4663
  - Zeek conn.log
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - 'NAI: Endpoints of high-value users (e.g., developers, system administrators), servers hosting sensitive
    data, DMZ servers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log | lookup asn,country for resp_h\n  | stats count by process resp_h asn country\n\
      \  | eventstats baseline_freq by process\n  | where freq < rare_threshold OR country NOT IN seen_countries\
      \ OR conn_state IN (\"REJ\",\"RSTO\",\"S0\")"
- question: Does a sequence model (LSTM per DeepLog, or provenance temporal-graph autoencoder per KAIROS)
    flag a process's read/network/write event sequence as a low-probability deviation from its historical
    file-handling pattern?
  context: Train an LSTM (DeepLog) or a provenance temporal-graph autoencoder (KAIROS) on the read/network/write
    event sequences of processes handling sensitive files, then alert on low-probability deviations from
    the historical pattern and surface the top-3 anomalous events/edges. This catches subtle, novel tampering-after-exfiltration
    chains (Impact, TA0040) that fixed-window rules miss by learning the normal temporal structure of
    file handling. Investigate the surfaced anomalous edges to determine which file/connection/write broke
    the pattern.
  answer_sources:
  - Windows Event ID 4663
  - Zeek conn.log
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - 'NAI: Endpoints of high-value users (e.g., developers, system administrators), servers hosting sensitive
    data, DMZ servers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  seq = ordered_events(process, [read,net,write], window)\n  p = lstm_model.sequence_probability(seq)\
      \   # or graph_autoencoder.reconstruction_error(provenance_subgraph)\n  | where p < low_prob_threshold\
      \ (or recon_error > thr)\n  | eval top3 = top_anomalous_events(model, seq, n=3)\n  | table _time\
      \ host process p top3"
- question: Did a single process create more than ~100 delete/create (rename) pairs within one minute,
    especially producing uniform ransomware-like or random file extensions, and is it corroborated by
    destructive-utility execution?
  context: Ransomware and bulk-destruction tooling rename files en masse, observable as rapid delete+create
    pairs by one process often ending in a uniform or randomized extension (Impact, TA0040). Trigger when
    a process exceeds ~100 rename pairs in one minute with such extension patterns, and corroborate with
    destructive-utility execution (e.g., vssadmin/wmic shadow-copy deletion) and the read->write burst
    pattern (UNVEIL). A positive on a workstation, file server, or backup server is high priority and
    may warrant host isolation. Tune to exclude legitimate bulk-rename jobs.
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Windows Event ID 4663
  - 'NAI: User workstations, file servers, and backup servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (Sysmon:EventCode=11, Sysmon:EventCode=23, WinSecurity:4663)\n  | rename_pair\
      \ = delete(file) then create(new_ext) by same process within 1m\n  | bin _time span=1m | stats count\
      \ AS pairs dc(new_ext) AS ext_variety by host process _time\n  | where pairs > 100 AND (ext_variety=1\
      \ OR new_ext MATCHES random_ext_regex)\n  | join host [search destructive_utility_exec]"
- question: Are file create/delete rates above the 99.5th percentile accompanied by sharp increases in
    write entropy toward ~8 bits/byte or anomalous changes in file-extension entropy?
  context: Monitor extension entropy and create/delete rates, alerting on rates above the 99.5th percentile
    combined with sharp write-entropy increases toward ~8 bits/byte that accompany bulk encryption (UNVEIL;
    ShieldFS). The simultaneous spike in operation rate and content entropy is a strong, specific signature
    of ransomware-style data destruction (Impact, TA0040) versus benign bulk file operations, which do
    not raise content entropy. Investigate the implicated process and the directories where entropy rose.
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Windows Event ID 4663
  - 'NAI: User workstations, file servers, and backup servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (Sysmon:EventCode=11, Sysmon:EventCode=23) | bin _time span=1m\n  | stats\
      \ count AS ops avg(write_entropy) AS ent ext_entropy() AS ext_ent by host process _time\n  | eventstats\
      \ perc99.5(ops) AS p995 by host\n  | where ops > p995 AND ent > 7.5"
- question: Does clustering (DBSCAN / Isolation Forest) over create/delete/rename/path-coverage/entropy-rate
    features flag any process activity as a ransomware-style rename cluster?
  context: Use DBSCAN or Isolation Forest on create/delete/rename rate, path-coverage, and entropy-rate
    features (ShieldFS; Liu et al.) to flag ransomware-style rename clusters, surfacing the top-3 contributing
    features. Unsupervised clustering groups together the coordinated, high-rate, high-coverage, high-entropy
    behavior characteristic of bulk data destruction (Impact, TA0040) without needing fixed thresholds.
    Investigate the clustered process tree, the breadth of paths it touched, and whether shadow copies/backups
    were also affected.
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Windows Event ID 4663
  - 'NAI: User workstations, file servers, and backup servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = per_process[create_rate, delete_rate, rename_rate, path_coverage, entropy_rate]\n\
      \  labels = dbscan(features) ; or score = isolation_forest.decision_function(features)\n  | where\
      \ label = outlier_cluster OR score < threshold\n  | eval top3 = explain_top_features(model, features,\
      \ n=3)\n  | table _time host process top3"
- question: Does validation of the append-only, hash-chained/notarized database audit trail detect a retroactive
