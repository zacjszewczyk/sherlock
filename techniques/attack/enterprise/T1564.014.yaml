name: 'T1564.014: Hide Artifacts: Extended Attributes'
id: c0712bd6-10e6-4210-a7f8-24a152aba7ee
description: >-
  This playbook helps an analyst investigate whether an adversary is abusing extended attributes (xattrs)
  on macOS and Linux to hide malicious payloads or data and evade detection (MITRE ATT&CK T1564.014, Hide
  Artifacts: Extended Attributes), under the Stealth tactic. Because xattrs are key-value metadata that
  standard tools like Finder, ls, and cat do not display -- requiring xattr (macOS) or getfattr (Linux)
  to inspect -- adversaries embed a second-stage payload into a legitimate file's attributes (the user.*
  namespace on Linux, custom or oversized com.apple.* keys on macOS) and later retrieve, decode, and execute
  it, all while the file body and hash stay unchanged so integrity checks are blind (e.g., Lazarus 'RustyAttr'
  used xattr -p on macOS; Linux PoCs use setfattr/getfattr). The playbook guides the analyst across several
  angles: detecting anomalous execution of xattr/setfattr/getfattr utilities and direct setxattr/getxattr
  syscalls; allow-listing legitimate macOS keys and flagging custom or oversized values; baselining execution
  frequency, value size, and entropy; decoding attribute values to find executable/script headers and
  credentials; spotting hash-stable-but-xattr-changed carriers that FIM misses; correlating xattr reads
  with near-time interpreter execution, DNS, and outbound C2 (including failure states and connection-rarity
  scoring); and modeling the whole process-file-network provenance chain with graph and time-series machine
  learning. Detection methods span symbolic-logic rules, statistical baselining, and machine-learning
  models applied to Linux auditd, Sysmon for Linux, osquery, macOS Unified Logs, and Zeek (conn/dns/http/files)
  telemetry so the analyst can corroborate suspected xattr abuse across execution, file metadata, and
  network evidence.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
