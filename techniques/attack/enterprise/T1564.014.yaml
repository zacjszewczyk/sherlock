  - Sysmon for Linux Event ID 3
  - Linux auditd getxattr syscalls
  - macOS unified log xattr events
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - >-
    NAI: Internet gateway, DNS servers, and endpoint devices of privileged users (e.g., developers, system
