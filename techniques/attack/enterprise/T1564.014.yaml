  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      SEARCH (cmd IN ("getfattr","xattr -p") OR auditd_syscall=getxattr) AS read_ev

      | JOIN ON (pid = read_ev.pid OR ppid = read_ev.pid) WITHIN 60s [
          spawn: process_creation WHERE proc IN (bash,sh,python,osascript)
          OR net: (sysmon_linux_eid=3 OR zeek_conn) WHERE dest_ip IN threat_intel
          OR dns: zeek_dns WHERE domain_reputation=low OR domain_age < 30d ]
      | ALERT severity=HIGH
- question: >-
    [Stealth] Can you track the failure and error states of the xattr-retrieval chain as distinct signals
    -- failed decodes, DNS NXDOMAIN or low-reputation responses, HTTP 404s, and blocked/RST outbound connections
    occurring within 60 seconds of an extended-attribute read -- and raise a medium-confidence alert and
