questions:
- question: >-
    [Stealth] Can you identify process-execution events in which the extended-attribute utilities are
    used to STAGE or RETRIEVE hidden content -- specifically `xattr -w`/`xattr -p` on macOS, `setfattr
    --name=user.*`, or `getfattr --only-values`/`--dump` on Linux -- and escalate when the initiating
    parent process is a web server, remote shell, downloader, script interpreter, or unsigned binary AND
    a follow-on interpreter (bash, sh, python, osascript) runs within five minutes from the same process
    tree?
  context: >-
    Tactic context (Stealth / TA0005): this playbook addresses the question -- Is an adversary hiding
    malicious payloads or data in file or directory extended attributes (xattrs) to evade detection? This
    Symbolic Logic rule directly targets the core of the technique: adversaries embed a second-stage payload
    into a file's extended attributes (xattrs) so that the carrier file's body and hash never change,
    then later read the attribute back out, decode it, and execute it. Legitimate uses of `xattr`/`setfattr`/`getfattr`
    exist (Gatekeeper quarantine, Spotlight tagging, backup/restore tooling, package managers), so the
    rule keys on the specific write/read flags used for staging and retrieval and on suspicious lineage.
    Look for the value of the parent and grandparent process, the user context, and whether an interpreter
    spawns shortly afterward from the same tree -- that write-then-read-then-execute chain is the hallmark
    of xattr abuse (Lazarus 'RustyAttr' used `xattr -p` to retrieve and execute hidden macOS payloads;
    Linux PoCs use `setfattr`/`getfattr` on the `user.*` namespace). A positive result (a flagged command
    with suspicious lineage and near-time interpreter execution) is a high-confidence lead worth immediate
    triage of the carrier file, the payload value, and any follow-on network activity; a negative result
    reduces but does not eliminate suspicion, since direct syscalls (setxattr/getxattr) can bypass the
    command-line utilities and should be covered by the syscall-based questions in this playbook. Method
    type: Symbolic Logic.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - Linux auditd logs
  - macOS Unified Logs (process execution)
  - >-
    NAI: Linux servers (web, database, application), macOS developer workstations, CI/CD pipeline runners,
    and Windows hosts with WSL enabled.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      SEARCH process_creation

      WHERE process_name IN ("xattr","setfattr","getfattr")
        AND (command_line MATCHES "xattr .*-w" OR command_line MATCHES "xattr .*-p"
             OR command_line MATCHES "setfattr .*--name=user\."
             OR command_line MATCHES "getfattr .*(--only-values|--dump)")
      | ENRICH parent_process, grandparent_process, user, is_signed

      | SET severity = HIGH
          IF parent_process IN (web_server, remote_shell, downloader, script_interpreter)
             OR is_signed = false
      | JOIN process_creation AS followon
          ON same_process_tree AND followon.process_name IN ("bash","sh","python","osascript")
          WITHIN 5m
      | ALERT
- question: >-
    [Stealth] On macOS hosts, can you detect any `xattr -w` operation that writes a custom or non-standard
    extended-attribute key, or that writes to a legitimate `com.apple.*` key with a value far larger than
    that key's documented format -- measured against a deterministic allow-list of expected keys (com.apple.quarantine,
    com.apple.metadata:_kMDItemUserTags, com.apple.FinderInfo, com.apple.ResourceFork)?
  context: >-
    Tactic context (Stealth / TA0005): this playbook addresses the question -- Is an adversary hiding
    malicious payloads or data in file or directory extended attributes (xattrs) to evade detection? macOS
    extended attributes are flat strings, and the legitimate system set is well known and small. By maintaining
    a deterministic allow-list of expected `com.apple.*` keys and their documented value formats, this
    Symbolic Logic rule surfaces two anomalies that benign software almost never produces: (1) a write
    of an entirely custom/non-standard key name, and (2) an oversized value written to a known key whose
    format is normally short and fixed (e.g., a quarantine string is a few fields, not kilobytes of data).
    Adversaries hide payloads precisely by abusing these keys, so a value that vastly exceeds the documented
    size strongly suggests embedded payload or instructions. This is especially relevant under the Stealth
    tactic because the attacker is trying to blend in with normal Apple metadata while leaving the file
    body and hash untouched. A positive result should trigger extraction and inspection of the attribute
    value (entropy, headers, decodes); a negative result narrows the search to the Linux `user.*` namespace
    and to direct-syscall paths. Method type: Symbolic Logic.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - Linux auditd logs
  - macOS Unified Logs (process execution)
  - >-
    NAI: Linux servers (web, database, application), macOS developer workstations, CI/CD pipeline runners,
    and Windows hosts with WSL enabled.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      DEFINE allow_keys = {"com.apple.quarantine","com.apple.metadata:_kMDItemUserTags",
                           "com.apple.FinderInfo","com.apple.ResourceFork"}
      SEARCH macos_unifiedlog WHERE process_name = "xattr" AND command_line MATCHES "-w"

      | PARSE attr_key, attr_value FROM command_line

      | WHERE attr_key NOT IN allow_keys
           OR (attr_key IN allow_keys AND len(attr_value) > documented_max_len(attr_key))
      | ALERT severity=HIGH
- question: >-
    [Stealth] For each host and user, can you baseline the daily count of `xattr`/`setfattr` executions
    over a rolling 30-day window and alert when a day exceeds the per-user/host 99th percentile, while
    as secondary checks flagging any `xattr -w`/`setfattr --value` whose value argument exceeds ~1 KB
    in length or whose Shannon entropy exceeds 6.0?
  context: >-
    Tactic context (Stealth / TA0005): this playbook addresses the question -- Is an adversary hiding
    malicious payloads or data in file or directory extended attributes (xattrs) to evade detection? This
    Statistical Method catches abuse that individual-rule logic misses by establishing what is normal
    for each host and user and alerting on deviations. Most users and servers run extended-attribute utilities
    rarely or never, so a sudden spike above the 99th percentile is suspicious regardless of flags. The
    Volume/State secondary checks add precision: benign tags and quarantine strings are tiny and low-entropy,
    whereas an embedded payload is large and high-entropy (compressed/encrypted content typically scores
    above 6.0), and KL-divergence against a normal-language baseline helps catch encoded short strings.
    Under the Stealth tactic the adversary tries to look routine, so volumetric and entropy anomalies
    are valuable orthogonal signals. A positive result (a count outlier or an oversized/high-entropy value)
    warrants pulling the actual attribute and the surrounding process tree; a negative result is reassuring
    only in aggregate, since a single carefully-sized payload may stay under thresholds and should be
    covered by IOC and syscall rules. Method type: Statistical Method.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - Linux auditd logs
  - macOS Unified Logs (process execution)
  - >-
    NAI: Linux servers (web, database, application), macOS developer workstations, CI/CD pipeline runners,
    and Windows hosts with WSL enabled.
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      SEARCH process_audit WHERE process_name IN ("xattr","setfattr") EARLIEST=-30d

      | BIN _time SPAN=1d | STATS count AS daily BY host, user, _time

      | EVENTSTATS perc99(daily) AS p99 BY host, user

      | WHERE daily > p99

      | ALERT

      ;; secondary value checks

      SEARCH process_audit WHERE command_line MATCHES "(xattr .*-w|setfattr .*--value)"

      | EVAL vlen = len(value_arg), vent = shannon_entropy(value_arg)

      | WHERE vlen > 1024 OR vent > 6.0

      | ALERT
- question: >-
    [Stealth] Can you train and deploy a supervised classifier (random forest / gradient boosting) that
    scores each `xattr`/`setfattr`/`getfattr` execution as benign or malicious using features such as
    parent and grandparent process name, root vs non-root user context, argument patterns (`-w`, `-p`,
    `-n user.`), value size and entropy, and time-of-day -- and pair it with an unsupervised Extended
    Isolation Forest over the same per-host feature vectors to catch novel patterns?
  context: >-
    Tactic context (Stealth / TA0005): this playbook addresses the question -- Is an adversary hiding
    malicious payloads or data in file or directory extended attributes (xattrs) to evade detection? This
    Machine Learning approach generalizes beyond fixed rules by learning the multivariate signature of
    malicious extended-attribute use. Labeled training data combines known-benign activity (installers,
    admin/tagging scripts, package managers) with known-malicious TTPs (e.g., the Lazarus RustyAttr pattern).
    The supervised model captures subtle combinations -- for instance an unsigned non-root parent writing
    a high-entropy value at an odd hour -- that no single threshold expresses, while the unsupervised
    Extended Isolation Forest flags genuinely new patterns without labels. Per explainability requirements
    each alert should emit the top-3 contributing features so an analyst can judge it quickly. This supports
    the Stealth tactic hunt because adversaries adapt their commands to evade static rules. A positive
    (high model score) result should be triaged with the cited features and corroborated against the carrier
    file and follow-on execution; a negative result is weak evidence of safety because models drift and
    adversaries can craft inputs resembling benign tooling. Method type: Machine Learning.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - Linux auditd logs
  - macOS Unified Logs (process execution)
  - >-
    NAI: Linux servers (web, database, application), macOS developer workstations, CI/CD pipeline runners,
    and Windows hosts with WSL enabled.
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: >-
      FEATURES = [parent_proc, grandparent_proc, user_is_root, has_w_flag, has_p_flag,
                  has_n_user_ns, value_size, value_entropy, hour_of_day]
      model = GradientBoostingClassifier().fit(X_train_labeled, y_train)

      for ev in stream(process_exec where proc in {xattr,setfattr,getfattr}):
          score = model.predict_proba(featurize(ev))
          if score > THRESHOLD: ALERT(top3_features=explain(model, ev))
      # unsupervised novelty

      eif = ExtendedIsolationForest().fit(per_host_feature_vectors)

      if eif.anomaly_score(featurize(ev)) > T2: ALERT(novel_pattern)
- question: >-
    [Stealth] Can you automatically decode base64/hex-looking extended-attribute values and scan the decoded
    content for executable or script headers (`MZ`, `\x7fELF`, shebang `#!`), shell one-liners, and credential
    patterns, escalating when decoded-payload indicators align with near-time interpreter execution or
    outbound network activity, and recording failed/garbled decodes as a distinct lower-confidence signal?
  context: >-
    Tactic context (Stealth / TA0005): this playbook addresses the question -- Is an adversary hiding
    malicious payloads or data in file or directory extended attributes (xattrs) to evade detection? This
    Symbolic Logic content-inspection step confirms the substance of suspected xattr abuse: if an attribute
    value decodes to an executable header, a shebang script, a shell one-liner, or credential material,
    the file is almost certainly being used as a covert payload store rather than for benign metadata.
    Decoding base64/hex and matching binary/script signatures turns a structural anomaly into concrete
    evidence. Correlating a successful decode with an interpreter executing shortly after, or with outbound
    traffic, raises confidence that the payload was actually retrieved and run. Even a failed or garbled
    decode is meaningful as a lower-confidence signal -- it can indicate encryption or a non-standard
    encoding worth a hunt. This is central to the Stealth tactic hunt because it reveals the hidden content
    the adversary worked to conceal behind an unchanged file body. A positive result is high-confidence
    and should drive containment of the host and carrier file; a negative result (clean decodes) suggests
    benign metadata but should be weighed against entropy and volume signals. Method type: Symbolic Logic.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - Linux auditd logs
  - macOS Unified Logs (process execution)
  - >-
    NAI: Linux servers (web, database, application), macOS developer workstations, CI/CD pipeline runners,
    and Windows hosts with WSL enabled.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      FOR each xattr_value collected (osquery/getfattr/xattr -p):
          for codec in (base64, hex):
              decoded = try_decode(xattr_value, codec)
              if decoded:
                  if decoded[:2]=="MZ" OR decoded[:4]=="\x7fELF" OR decoded MATCHES "^#!"
                     OR decoded MATCHES shell_oneliner_re OR decoded MATCHES credential_re:
                      sev = HIGH if interpreter_exec_or_outbound_within(host, 5m) else MEDIUM
                      ALERT(sev, indicator=signature)
              else:
                  ALERT(LOW, reason="garbled/undecodable xattr value")
- question: >-
    [Stealth] Can you monitor `setxattr`/ESF attribute-write events and alert when a Linux `user.*` key
    receives an encoded blob, when a macOS key falls outside the expected `com.apple.*` allow-list, or
    when the decoded attribute content contains executable/script headers (`MZ`, `ELF`, shebang) -- prioritizing
    writes that target system binaries (`/bin`, `/usr/bin`), dotfiles (`.bash_history`), and web-accessible
    directories?
  context: >-
    Tactic context (Stealth / TA0005): this playbook addresses the question -- Is an adversary hiding
    malicious payloads or data in file or directory extended attributes (xattrs) to evade detection? Where
    the IOC rule watches the command-line utilities, this Symbolic Logic rule watches the underlying attribute-write
    events (Linux `setxattr` syscalls, macOS Endpoint Security Framework attribute writes), catching abuse
    even when an adversary uses direct syscalls instead of `xattr`/`setfattr`. It alerts on the same fundamental
    anomaly -- an unexpected key namespace or an encoded/binary value -- and adds path-based prioritization.
    Writes that modify extended attributes on system binaries, shell dotfiles, or web-accessible directories
    are particularly concerning because those locations support persistence, tampering, and web-shell-style
    staging. Under the Stealth tactic the attacker deliberately leaves the file body intact, so the attribute
    write itself is the observable. A positive result identifies the carrier file and value for immediate
    inspection; a negative result narrows attention to command-utility paths and to size/entropy scoring
    for values that lack obvious headers. Method type: Symbolic Logic.
  answer_sources:
  - Linux auditd setxattr syscalls
  - macOS unified log xattr events
  - osquery file_extended_attributes
  - Zeek files.log
  - Sysmon for Linux Event ID 11
  - >-
    NAI: Critical system directories (/bin, /usr/bin, /etc), user home directories, and web-accessible
    directories (/var/www/html) on Linux and macOS hosts.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      DEFINE apple_allow = {com.apple.quarantine, com.apple.metadata:_kMDItemUserTags,
                           com.apple.FinderInfo, com.apple.ResourceFork}
      SEARCH (auditd_syscall=setxattr OR esf_attr_write)

      | PARSE target_path, attr_key, attr_value

      | WHERE (attr_key MATCHES "^user\." AND looks_encoded(attr_value))
            OR (platform=macos AND attr_key NOT IN apple_allow)
            OR decode(attr_value) MATCHES "^(MZ|\x7fELF|#!)"
      | EVAL sev = HIGH IF target_path MATCHES "^(/bin|/usr/bin|/var/www|.*/\.[a-z])" ELSE MEDIUM

      | ALERT sev
- question: >-
    [Stealth] Can you periodically enumerate all extended attributes across endpoints (osquery `SELECT
    path,key,value FROM extended_attributes`/`file_extended_attributes`, or `getfattr -R`), compute byte
    length and Shannon entropy for each value, baseline per segment (file type x key prefix, e.g. `com.apple.quarantine`
    vs `user.comment`), and alert when length exceeds the segment 95th percentile (or a fixed >1 KB floor)
    OR entropy exceeds 3 sigma above the segment mean (encoded/compressed content typically >6.0-7.0)?
  context: >-
    Tactic context (Stealth / TA0005): this playbook addresses the question -- Is an adversary hiding
    malicious payloads or data in file or directory extended attributes (xattrs) to evade detection? This
    Statistical Method proactively inventories extended attributes at rest rather than waiting for a write
    event, which is valuable for catching payloads staged before logging was in place or via tooling that
    evaded execution monitoring. Segment-aware baselining is the key idea: each key prefix and file type
    has its own normal length and entropy profile (a quarantine string vs a user comment vs a Finder tag),
    so comparing each value to its own segment's distribution avoids drowning in false positives. Values
    that are unusually long or high-entropy for their segment are strong indicators of embedded, compressed,
    or encrypted payloads. This directly serves the Stealth-tactic question of whether something is hidden
    in xattrs while the file body looks normal. A positive result (an outlier value) should be decoded
    and inspected and correlated to its carrier file and recent host activity; a negative result across
    a sweep provides good coverage assurance for at-rest data but should be repeated on a schedule. Method
    type: Statistical Method.
  answer_sources:
  - Linux auditd setxattr syscalls
  - macOS unified log xattr events
  - osquery file_extended_attributes
  - Zeek files.log
  - Sysmon for Linux Event ID 11
  - >-
    NAI: Critical system directories (/bin, /usr/bin, /etc), user home directories, and web-accessible
    directories (/var/www/html) on Linux and macOS hosts.
  range: Last 90 days
  queries:
  - technology: osquery/Stats pseudocode
    query: >-
      SELECT path, key, value FROM extended_attributes;  -- or file_extended_attributes / getfattr -R

      FOR each row:
          vlen = len(value); vent = shannon_entropy(value)
          seg = (file_type(path), key_prefix(key))
      GROUP BY seg COMPUTE perc95(vlen) AS p95, mean(vent) AS mu, std(vent) AS sd

      WHERE vlen > max(p95, 1024) OR vent > mu + 3*sd

      ALERT(path, key, vlen, vent)
- question: >-
    [Stealth] Can you flag any file whose content hash is unchanged between integrity scans but whose
    extended-attribute set gained a new non-standard key or grew substantially in total xattr bytes since
    the prior scan -- surfacing the payload-staging that file-hash baselines are blind to?
  context: >-
    Tactic context (Stealth / TA0005): this playbook addresses the question -- Is an adversary hiding
    malicious payloads or data in file or directory extended attributes (xattrs) to evade detection? This
    Symbolic Logic check exploits the defining weakness adversaries rely on: xattr abuse leaves the file
    content and therefore its hash unchanged, so traditional file-integrity monitoring (FIM) that only
    hashes file bodies reports 'no change' even as a payload is planted in the metadata. By recording,
    per file, both the content hash AND the set/size of extended attributes at each integrity scan, this
    check raises an alert on the precise contradiction -- hash stable, but xattr set newly grew or gained
    a non-standard key. This is one of the most specific signals available for the Stealth tactic, because
    it catches the exact blind spot the attacker is exploiting. A positive result (stable hash + new/larger
    xattrs) is a strong, low-false-positive lead that should trigger extraction and decoding of the new
    attribute; a negative result means at-rest carriers have not changed since baseline, complementing
    the real-time write and execution rules. Method type: Symbolic Logic.
  answer_sources:
  - Linux auditd setxattr syscalls
  - macOS unified log xattr events
  - osquery file_extended_attributes
  - Zeek files.log
  - Sysmon for Linux Event ID 11
  - >-
    NAI: Critical system directories (/bin, /usr/bin, /etc), user home directories, and web-accessible
    directories (/var/www/html) on Linux and macOS hosts.
  range: Last 90 days
  queries:
  - technology: FIM/Stats pseudocode
    query: >-
      FOR each monitored file f:
          cur = {hash: sha256(f), xkeys: set(xattr_keys(f)), xbytes: total_xattr_bytes(f)}
          prev = baseline[f]
          if prev and cur.hash == prev.hash:
              new_keys = cur.xkeys - prev.xkeys
              if any(k not in standard_keys for k in new_keys) \
                 or cur.xbytes - prev.xbytes > GROWTH_THRESHOLD:
                  ALERT(f, new_keys, cur.xbytes - prev.xbytes)
          baseline[f] = cur
- question: >-
    [Stealth] Can you ingest extended-attribute-creation (file-metadata write) events and network-download
    events (Zeek `files.log`, EDR/proxy logs) into a time-series model (Prophet or LSTM autoencoder) baselined
    per host over 30-60 days, and alert on anomalous spikes in new-xattr-creation rate that are NOT aligned
    to a known patching/deployment window -- raising the score when a spike is preceded by a network file
    download to the same host within five minutes?
  context: >-
    Tactic context (Stealth / TA0005): this playbook addresses the question -- Is an adversary hiding
    malicious payloads or data in file or directory extended attributes (xattrs) to evade detection? This
    Machine Learning approach models the temporal rhythm of extended-attribute creation per host and flags
    departures from it. Benign xattr creation tends to cluster around predictable events (software installs,
    deployments, backups), so an unexplained spike outside known maintenance windows is suspicious. Fusing
    the xattr-creation series with network-download events lets the model boost confidence when a payload
    download immediately precedes a burst of new attributes -- the download-then-stage pattern of xattr
    abuse. Per explainability requirements the alert should surface the top-3 contributing features (rate
    delta, file path, preceding download). This serves the Stealth tactic by detecting the staging phase
    even when individual writes look unremarkable. A positive result (an unexplained, download-correlated
    spike) warrants pulling the specific files and decoding their new attributes; a negative result indicates
    steady-state behavior but should be combined with the at-rest entropy sweep and the real-time write
    rules for full coverage. Method type: Machine Learning.
  answer_sources:
  - Linux auditd setxattr syscalls
  - macOS unified log xattr events
  - osquery file_extended_attributes
  - Zeek files.log
  - Sysmon for Linux Event ID 11
  - >-
    NAI: Critical system directories (/bin, /usr/bin, /etc), user home directories, and web-accessible
    directories (/var/www/html) on Linux and macOS hosts.
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: >-
      SERIES = per_host_count(new_xattr_write_events) BIN 1h over 30-60d

      model = Prophet()  # or LSTM autoencoder

      model.fit(SERIES minus known_maintenance_windows)

      for t in now:
          resid = observed(t) - model.predict(t)
          if resid > anomaly_band and t not in maintenance_window:
              sev = HIGH if zeek_files_download(host, within=-5m) else MEDIUM
              ALERT(sev, top3=[rate_delta, file_path, preceding_download])
- question: >-
    [Stealth] Can you build a stateful correlation rule that fires when a process reads an extended attribute
    (`getfattr`/`xattr -p` command or `getxattr` syscall) and, within 60 seconds, the same PID or a child
    process either spawns an interpreter, OR initiates an outbound connection (Sysmon-for-Linux Event
    ID 3 / Zeek `conn.log`) to a threat-intel IP, OR issues a DNS query (Zeek `dns.log`) for a low-reputation
    or newly-registered domain?
  context: >-
    Tactic context (Stealth / TA0005): this playbook addresses the question -- Is an adversary hiding
    malicious payloads or data in file or directory extended attributes (xattrs) to evade detection? This
    Symbolic Logic correlation captures the back half of the xattr attack chain: retrieval, decode, execute,
    and call home. Reading an attribute is benign in isolation, but reading one and then -- within a tight
    60-second window -- spawning an interpreter or reaching out to suspicious infrastructure strongly
    matches the getfattr/xattr -p -> decode -> interpreter -> C2 sequence observed with Lazarus tooling.
    Stitching process, syscall, and network telemetry into one timeline turns weak individual events into
    a high-confidence detection. This directly serves the Stealth tactic by exposing the moment the concealed
    payload is activated. A positive result is a strong incident lead pointing at the responsible process,
    carrier file, and destination; a negative result (xattr reads with no near-time execution or suspicious
    network) helps rule out active retrieval but should be paired with the rarity-scoring and graph methods
    to catch slower or low-reputation-evading variants. Method type: Symbolic Logic.
  answer_sources:
