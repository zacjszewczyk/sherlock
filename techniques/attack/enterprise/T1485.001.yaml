questions:
- question: '[Impact] Lifecycle API rule detection: Can you determine whether a cloud audit log (e.g.,
    AWS CloudTrail) records an API call that modifies or creates a storage lifecycle policy with an immediate
    or short-term (e.g., 1 day) object deletion rule. -- specifically, using the ''Lifecycle API rule
    detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary with write access to cloud
    storage can modify lifecycle/expiration policies to delete all objects in a bucket at once -- destroying
    data for extortion/ransomware or wiping logs for indicator removal -- and may suspend versioning to
    defeat recovery. This evidence focuses on the condition that a cloud audit log (e.g., AWS CloudTrail)
    records an API call that modifies or creates a storage lifecycle policy with an immediate or short-term
    (e.g., 1 day) object deletion rule. This Symbolic Logic approach looks for the following signal: Alert
    on AWS ''PutBucketLifecycleConfiguration'', Azure blob management/inventory policy set, or GCP ''storage.buckets.update''
    where a rule has Status=Enabled, an empty or whole-bucket Filter, and Expiration.Days <= 1 (benign
    baseline is long, prefix-scoped retention) (AWS S3 Lifecycle docs). Escalate when correlated with
    versioning suspension or NoncurrentVersionExpiration, which removes recovery (Unit 42). Map eventNames
    to Cloud Storage components via the AWS Threat Technique Catalog T1485 and regression-test with labeled
    detonations from Stratus Red Team (exclude userAgent ''stratus-red-team_*'' in production). A positive
    result -- a rule match, statistical outlier, or model alert -- suggests a principal or host is configuring
    destructive short-retention lifecycle rules or interacting with storage management APIs in a way that
    deviates from sanctioned, prefix-scoped, long-retention administration; pivot to the responsible principal/role/key,
    the source IP/ASN/geo, the host and parent process, the affected bucket(s), versioning/recovery state,
    and any recon or AccessDenied activity that preceded the change. A negative result helps rule out
    this lifecycle-triggered deletion vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, low-and-slow, or automation-blended abuse.'
  answer_sources: &id001
  - AWS CloudTrail logs
