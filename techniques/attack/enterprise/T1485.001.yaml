name: 'T1485.001: Lifecycle-Triggered Deletion'
id: 97f5dab3-5a7d-473d-9388-ff585ff4841d
description: 'This playbook helps an analyst investigate whether an adversary has abused cloud storage
  lifecycle policies to destroy data en masse (MITRE ATT&CK T1485.001, Lifecycle-Triggered Deletion) under
  the Impact tactic. Threat actors with write access to a storage bucket can apply or modify a lifecycle/expiration
  rule (e.g., AWS PutBucketLifecycleConfiguration, Azure blob management policy set, GCP storage.buckets.update)
  so that all objects are deleted after one day or less, then suspend versioning to remove recovery options.
  This is used for destructive impact and extortion/ransomware, and to wipe cloud audit logs for indicator
  removal. The playbook guides the hunt across several complementary angles: detecting lifecycle API calls
  with short, whole-bucket expiration rules in cloud audit logs (CloudTrail, Azure Activity, GCP Audit);
  spotting AccessDenied bursts that betray permission enumeration; first-seen and rare-API baselining
  of the principals issuing destructive calls; host-based detection of cloud CLI execution (aws.exe, az.exe,
  gcloud.exe) configuring 1-day expirations via Windows Event ID 4688; recon-then-destroy command sequences
  within short windows; network-level signals such as a drop in write traffic to a storage FQDN or backup
  heartbeat loss; and connections to storage management APIs from non-allowlisted hosts or outside a principal''s
  normal hours. Detection methods combine symbolic-logic rules, statistical baselining/forecasting (modified
  Z-score/MAD, Seasonal Hybrid ESD, transition probabilities), and machine-learning models (Isolation
  Forest, DeepLog-style LSTM sequence models, rare-function/population jobs, IAM graph embeddings) so
  the analyst can corroborate suspected lifecycle-triggered deletion against the responsible principal,
  source IP/geo, host, and the affected bucket and recovery posture.'
