name: 'T1078.003: Valid Accounts: Local Accounts'
id: 525c4dd7-75a3-4844-954b-f4f1c57153be
description: >-
  This playbook helps an analyst investigate adversary abuse of valid local (SAM) accounts across the
  Initial Access, Persistence, Privilege Escalation, and Stealth/Defense-Evasion tactics. It covers detecting
  remote and interactive logons by built-in or shared local accounts from rare or threat-intel source
  IPs and new authentication edges; successful brute-force and password-spray campaigns (including low-and-slow
  distributed variants); impossible-travel and geolocation anomalies; newly created or dormant local accounts
  that begin authenticating remotely; local-account persistence via scheduled tasks, startup keys, and
  beaconing/C2 processes; privilege escalation through exploit tools, UAC bypass, and unauthorized additions
  to privileged local groups; and defense evasion such as clearing audit logs, killing security services,
  modifying firewalls, and LOLBin abuse. Each question pairs deterministic (symbolic-logic), statistical-baseline,
  and machine-learning detection approaches across Windows Event Logs, Sysmon, and Zeek network telemetry.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
- tactic_id: TA0001
  tactic_name: Initial Access
