    threshold, mirroring [Microsoft Sentinel low-and-slow spray ML](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052).
    Report cluster size, distinct targets, and failure volume as the top-3 explanatory features.
  answer_sources:
  - Windows Event ID 4625
  - 'NAI: Domain Controllers, ADFS Servers, Member Servers with remote access capabilities, Public-facing
