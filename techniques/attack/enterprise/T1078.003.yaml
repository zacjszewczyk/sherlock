questions:
- question: (Stealth) Has any built-in or shared local SAM account (Administrator, Guest, support, service,
    *_adm) authenticated over the network to a host it has never reached before, and was that success
    preceded by failed attempts from the same source?
  context: >-
    Maintain a watchlist of built-in/shared local accounts and alert on any successful network logon (4624
    Logon Type 3/10 or 4776 NTLM) where TargetUserName is a local account and the authenticating computer
    is not the target host. Join with Zeek conn.log on source IP/timestamp to confirm direction and that
    the source->account->host edge is new in the prior 90 days, and count preceding 4625 failures in the
    last 10 minutes. A new edge plus prior failures is a strong credential-reuse/lateral-movement signal.
    In the Stealth context, the adversary abuses a legitimate local account to blend in with normal activity,
    so the objective is to separate this benign-looking authentication or execution from genuine administrative
    use. Source method detail: Symbolic Logic: Maintain a watchlist of built-in/shared local SAM accounts
    (Administrator, Guest, support, service, *_adm) and alert on any successful network logon by them:
    Windows Event ID 4624 Logon Type 3/10 or 4776 (NTLM) where TargetUserName is a local account and the
    authenticating computer != target host. Join with Zeek conn.log on source IP/timestamp to confirm
    direction and that the source host has never used that account in the prior 90 days (new user->host
    edge). State: also count preceding 4625 failures from the same source in the last 10 min. Alert text
    must surface top-3 context fields: source host/IP, account, and prior-edge-seen=false. This mid-path
    credential-reuse-to-a-rare-destination pattern is the core lateral-movement signal modeled by [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf)
    and the rare-edge scoring of [CyberGraph](https://www.usenix.org/system/files/raid20-bowman.pdf).
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4776
  - Zeek conn.log
  - 'NAI: Perimeter Firewalls, VPN Concentrators, Public-Facing Application Servers, Remote Desktop Gateway
    Servers, Cloud IAM Services'
  range: Last 7 days (pivot to a 5-15 minute correlation window around each candidate event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: >2-
        watch = [Administrator, Guest, support, service, *_adm]
        src=4624(LogonType in {3,10}) OR 4776 where TargetUserName in watch
           and AuthenticatingComputer != TargetHost
        join Zeek conn.log on (src_ip, ts +/- 60s)
        new_edge = not seen(src_host, account, target_host, last 90d)
        fails = count(4625 from src_ip, last 10m)
        if new_edge: alert(account, src_host/ip, prior_edge_seen=false, fails)
- question: (Stealth) For each local account, does the source host, country/ASN, logon type, or logon
    frequency of a recent logon fall into the rarest 1st-5th percentile of that account's 90-day history,
    especially with elevated failure ratios or fan-out to many hosts?
  context: >-
    Build per-host and per-account 90-day baselines of source host, source country/ASN, Logon Type, and
    authentication frequency from 4624/4776 and Zeek conn.log; flag logons whose source is below the 1st-5th
    percentile of historical use. Track the 4625:4624 failed:successful ratio and authentication volume/hour,
    and raise confidence when the rare login is followed by new service creation (7045), privilege assignment
    (4672), or fan-out across the subnet. In the Stealth context, the adversary abuses a legitimate local
    account to blend in with normal activity, so the objective is to separate this benign-looking authentication
    or execution from genuine administrative use. Source method detail: Statistical Method: Build per-host
    and per-account 90-day baselines of source host, source country/ASN, Logon Type, and logon Frequency
    (count/hour) from 4624/4776 and Zeek conn.log; flag local-account logons whose source falls below
    the 1st-5th percentile of historical use, derive percentile cutoffs per account from your own data.
    Track State by including the failed:successful logon ratio (4625:4624) and Volume of authentications/hour.
    Raise confidence when the rare login is followed by new service creation (7045), privilege assignment
    (4672), or fan-out to multiple hosts in the subnet. Feature engineering (fan-out, distinct destinations,
    success/fail ratio) follows [Bian et al.](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf)
    using [LANL auth data](https://csr.lanl.gov/data/auth/) as a baseline reference.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4776
  - Zeek conn.log
  - 'NAI: Perimeter Firewalls, VPN Concentrators, Public-Facing Application Servers, Remote Desktop Gateway
    Servers, Cloud IAM Services'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >2-
        baseline[account] = pctile distribution of {src_host, country, asn, logon_type, count/hr} over
      90d
        for ev in 4624/4776 by local account:
          if rarity(ev.source) <= P5: score++
          fail_ratio = 4625/4624 (same account, 1h)
          fanout = distinct dest hosts (1h)
          if 7045 or 4672 or fanout>threshold soon after: score++
        alert if score high
- question: (Stealth) When a supervised model scores a local-authentication event using account type,
    source rarity, host role, logon type, time-of-day, failure history, and fan-out, is the event classified
    as lateral movement rather than benign admin use, and does a temporal-graph link-prediction model
    also rate the account->host edge as low-probability?
  context: >-
    Train a Random Forest/XGBoost classifier on local-authentication events (account type, source rarity,
    host role, Logon Type, cyclic time-of-day, 4625 failure count, fan-out) to separate benign admin use
    from lateral movement, prioritizing alerts and emitting top-3 SHAP/feature contributions. As an unsupervised
    complement, score each new account->host edge with a temporal graph link-prediction model and flag
    low-probability edges. In the Stealth context, the adversary abuses a legitimate local account to
    blend in with normal activity, so the objective is to separate this benign-looking authentication
    or execution from genuine administrative use. Source method detail: Machine Learning: Train a supervised
    classifier (Random Forest/XGBoost) on local-authentication events using account type, source rarity,
    host role, Logon Type, time-of-day (sine/cosine), failure-history (4625 count), and authentication
    fan-out to separate benign admin use from lateral movement, per [Bian et al.](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf).
    Use the score to prioritize alerts and emit the top-3 SHAP/feature contributions in the alert. As
    an unsupervised complement, score each new account->host authentication edge with a temporal graph
    link-prediction model and flag low-probability edges, as in [EULER](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf)
    and [CyberGraph](https://www.usenix.org/system/files/raid20-bowman.pdf), trained on [LANL auth data](https://csr.lanl.gov/data/auth/).
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4776
  - Zeek conn.log
  - 'NAI: Perimeter Firewalls, VPN Concentrators, Public-Facing Application Servers, Remote Desktop Gateway
    Servers, Cloud IAM Services'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >2-
        X = features(account_type, source_rarity, host_role, logon_type,
                    sin/cos(hour), fail_count_4625, fanout)
        p = RandomForest/XGBoost.predict_proba(X)
        edge_p = TemporalGraphLinkPred(account -> host)
        if p>tuned_thr or edge_p<low_thr: alert(top3_shap, edge_p)
- question: (Stealth) Did a single source IP produce more than 20 failed local-account logons (4625) across
    common account names within 5 minutes, immediately followed by a success (4624) from that same IP?
  context: >-
    Stateful rule per source IP: if >20 failed logons (4625) across common local account names (admin,
    administrator, guest, support, test) within 5 minutes are immediately followed by a success (4624)
    from the same IP, raise a critical successful-brute-force alert. Tune the 20/5-min threshold to your
    environment's failure baseline and track the failed->success transition. In the Stealth context, the
    adversary abuses a legitimate local account to blend in with normal activity, so the objective is
    to separate this benign-looking authentication or execution from genuine administrative use. Source
    method detail: Symbolic Logic: Stateful rule per source IP: if >20 failed logons (4625) across common
    local account names (admin, administrator, guest, support, test) within 5 minutes are immediately
    followed by a success (4624) from the same IP, raise a critical successful-brute-force alert. Tune
    the 20/5-min threshold to your environment's failure baseline. Track Frequency (failures/min) and
    State (failed->success transition). Indicators and thresholds align with [ASD password spray guidance](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf);
    validate with [Atomic Red Team T1078.003](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1078.003/T1078.003.md).
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Authentication Servers, Public-Facing Web Servers, Domain Controllers, Bastion Hosts'
  range: Last 7 days (pivot to a 5-15 minute correlation window around each candidate event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: >2-
        group 4625 by src_ip over 5m window
        if count>20 and target in {admin,administrator,guest,support,test}
           and exists 4624(success) from same src_ip right after:
          alert(critical, src_ip, account, fail_count)
- question: (Stealth) Within a 10-minute window per source IP, do the unique-accounts-to-total-failures
    ratio and total failure volume indicate either single-account brute-force (low ratio, high total)
    or password spray (high ratio, many accounts), followed by a success?
  context: >-
    Over a 10-minute sliding window per source IP compute (a) unique local accounts with 4625 failures
    and (b) total failures. Low ratio (<0.2) with high total (>50) indicates brute-force against one account;
    high ratio (>0.9) with >10 unique accounts indicates password spray. Alert on either when followed
    by a 4624 success; derive cutoffs from your own distribution. In the Stealth context, the adversary
    abuses a legitimate local account to blend in with normal activity, so the objective is to separate
    this benign-looking authentication or execution from genuine administrative use. Source method detail:
    Statistical Method: Over a 10-minute sliding window per source IP compute (a) unique local accounts
    with 4625 failures and (b) total failures. Low ratio (<0.2) with high total (>50) indicates brute-force
    against one account; high ratio (>0.9) with >10 unique accounts indicates password spray. Alert on
    either when followed by a 4624 success. Derive ratio/volume cutoffs from your own failed-logon distribution.
    This unique-account-to-failure ratio is the deterministic spray signal in [Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html)
    and [ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Authentication Servers, Public-Facing Web Servers, Domain Controllers, Bastion Hosts'
  range: Last 7 days (pivot to a 5-15 minute correlation window around each candidate event)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >2-
        per src_ip, 10m window:
          u=distinct(target accounts in 4625); t=count(4625)
          ratio=u/t
          if (ratio<0.2 and t>50) or (ratio>0.9 and u>10):
            if exists 4624 success same src_ip: alert(mode, u, t, ratio)
- question: (Stealth) Does DBSCAN clustering of login attempts on source IP, target username, ASN, and
    inter-attempt time reveal a coordinated low-and-slow brute-force/spray campaign distributed across
    IPs that evade per-IP volumetric thresholds?
  context: >-
    Cluster 4624/4625 login attempts with DBSCAN on source IP, target username, ASN, and inter-attempt
    time to group coordinated low-and-slow campaigns spread across disparate IPs that evade per-IP thresholds.
    Report the cluster's source-IP count, distinct targets, and failure volume as the top contributing
    features. In the Stealth context, the adversary abuses a legitimate local account to blend in with
    normal activity, so the objective is to separate this benign-looking authentication or execution from
    genuine administrative use. Source method detail: Machine Learning: Cluster login attempts (4624/4625)
    with DBSCAN on features source IP, target username, ASN, and inter-attempt time to group coordinated
    low-and-slow brute-force/spray campaigns spread across disparate IPs that evade per-IP volumetric
    thresholds, as in [Microsoft Sentinel low-and-slow spray ML](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052).
    Report the cluster's source-IP count, distinct targets, and failure volume as the top contributing
    features.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Authentication Servers, Public-Facing Web Servers, Domain Controllers, Bastion Hosts'
  range: Last 7 days (pivot to a 5-15 minute correlation window around each candidate event)
  queries:
  - technology: SIEM/ML pseudocode
    query: >2-
        X=features(src_ip, target_user, asn, inter_attempt_time)
        clusters=DBSCAN(X)
        for c in clusters where multi_ip_low_rate(c):
          alert(src_ip_count, distinct_targets, fail_volume)
- question: (Stealth) For a successful remote local-account login, does the implied travel velocity from
    the account's previous successful login location exceed a feasible threshold (e.g., 965 km/h), excluding
    known VPN/proxy egress ranges?
  context: >-
    For each successful remote login (4624 Logon Type 3/10) geolocate the source IP and compute required
    travel velocity from the account's previous successful login (distance/time). If velocity exceeds
    a feasible threshold (e.g., 965 km/h) raise a high-severity impossible-travel alert; exclude known
    VPN/proxy egress ranges and surface both endpoints, elapsed time, and implied speed. In the Stealth
    context, the adversary abuses a legitimate local account to blend in with normal activity, so the
    objective is to separate this benign-looking authentication or execution from genuine administrative
    use. Source method detail: Symbolic Logic: For each successful remote login (4624 Logon Type 3/10)
    geolocate the source IP and compute required travel velocity from the account's previous successful
    login (distance/time). If velocity exceeds a feasible threshold (e.g., 965 km/h) raise a high-severity
    impossible-travel alert; exclude known VPN/proxy egress ranges to control false positives, per [Microsoft
    impossible-travel patent WO2018085161A1](https://patents.google.com/patent/WO2018085161A1/en). Surface
    both endpoints, elapsed time, and implied speed in the alert.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: VPN Concentrators, Remote Desktop Gateways, Cloud IAM Services, Geolocation Database'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >2-
        for login in 4624(LogonType in {3,10}, local account):
          prev=last_success(account)
          v = geo_distance(prev.geo, login.geo)/(login.ts-prev.ts)
          if v>965 km/h and login.src_ip not in vpn/proxy:
            alert(prev.geo, login.geo, elapsed, v)
- question: (Stealth) Modeling each local account's historical login geolocations with a Gaussian Mixture
    Model, does a new login fall in the bottom 1% of probability density even when no outright velocity
    violation occurs?
  context: >-
    Model each local account's historical login geolocations with a Gaussian Mixture Model to capture
    normal clusters (office, home); flag a new login whose probability density is in the bottom 1% even
    without a velocity violation. Complement with State signals (failed:success ratio at that location)
    and derive the density cutoff per account from history. In the Stealth context, the adversary abuses
    a legitimate local account to blend in with normal activity, so the objective is to separate this
    benign-looking authentication or execution from genuine administrative use. Source method detail:
    Statistical Method: Model each local account's historical login geolocations with a Gaussian Mixture
    Model to capture normal clusters (office, home); flag a new login whose probability density is in
    the bottom 1% even when no velocity violation occurs. Complement geo-rarity with State signals (failed:success
    ratio at that location) and derive the density cutoff per account from history. Detecting the abrupt
    distributional shift draws on change-point methods in [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)
    and baseline behavior analytics in [Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: VPN Concentrators, Remote Desktop Gateways, Cloud IAM Services, Geolocation Database'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >2-
        gmm[account]=GMM.fit(historical lat/lon)
        d=gmm[account].score(new_login.geo)
        if d < P1_density[account]: alert(geo, density, fail_success_ratio)
- question: (Stealth) Does an LSTM autoencoder modeling each user's login sequence (timestamp, latitude,
    longitude, logon type) produce high reconstruction error indicating deviation from established pattern-of-life
    and travel behavior?
  context: >-
    Model each user's login sequence (timestamp, latitude, longitude, Logon Type) with an LSTM autoencoder;
    high reconstruction error flags deviation from established pattern-of-life and travel behavior. Emit
    the most anomalous sequence steps and the geo-jump as top features. In the Stealth context, the adversary
    abuses a legitimate local account to blend in with normal activity, so the objective is to separate
    this benign-looking authentication or execution from genuine administrative use. Source method detail:
    Machine Learning: Model each user's login sequence (timestamp, latitude, longitude, Logon Type) with
    an LSTM autoencoder; high reconstruction error flags deviation from established pattern-of-life and
    travel behavior. Self-supervised sequence modeling of authentication events is shown effective on
    the [LANL dataset](https://csr.lanl.gov/data/auth/) by [Gokstorp et al.](https://people.kth.se/~gyuri/Pub/GokstorpNKJD_LogAnomaly_NOMS24.pdf).
    Emit the most anomalous sequence steps and the geo-jump as top features.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: VPN Concentrators, Remote Desktop Gateways, Cloud IAM Services, Geolocation Database'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >2-
        seq=order_by_time(login events: ts, lat, lon, logon_type)
        err=LSTM_autoencoder.reconstruction_error(seq)
        if err>thr: alert(top_anomalous_steps, geo_jump)
- question: (Stealth) Within a 15-minute window, did one source IP generate 4625 failures against more
    than 20 unique local accounts with only 1-3 failures each, indicating a password-spraying attempt?
  context: >-
    Aggregate 4625 by source IP over a 15-minute window; if one source produces failures for >20 unique
    local accounts with 1-3 failures each, raise a password-spraying alert. Tune unique-account and per-account-failure
    thresholds to your baseline and track distinct accounts/min. In the Stealth context, the adversary
    abuses a legitimate local account to blend in with normal activity, so the objective is to separate
    this benign-looking authentication or execution from genuine administrative use. Source method detail:
    Symbolic Logic: Aggregate 4625 by source IP over a 15-minute window; if one source produces failures
    for >20 unique local accounts with 1-3 failures each, raise a password-spraying alert. Tune unique-account
    and per-account-failure thresholds to your baseline. Track Frequency (distinct accounts/min). Deterministic
    spray indicators per [ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf)
    and [Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).
  answer_sources:
  - Windows Event ID 4625
  - 'NAI: Domain Controllers, ADFS Servers, Member Servers with remote access capabilities, Public-facing
    applications'
  range: Last 7 days (pivot to a 5-15 minute correlation window around each candidate event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: >2-
        per src_ip, 15m window:
          accts={a: count(4625 a) for a}
          sprayed=[a for a,n in accts if 1<=n<=3]
          if len(sprayed)>20: alert(password_spray, src_ip, len(sprayed))
- question: (Stealth) Per source IP over a 10-minute window, is the ratio of unique target local accounts
