- question: (Stealth) Was a local account created (4720) and then used for a successful remote logon (4624
    Logon Type 3/10) from a non-internal IP within 60 minutes, optionally with an immediate add-to-Administrators
    (4732)?
  context: >-
    Correlation rule firing when a local account creation (4720) is followed within 60 minutes by a successful
    logon (4624 Logon Type 3/10) for the same TargetUserName from a non-internal IP; add the immediate
    add-to-Administrators (4732) variant. Surface account, creating subject, and source IP. In the Stealth
    context, the adversary abuses a legitimate local account to blend in with normal activity, so the
    objective is to separate this benign-looking authentication or execution from genuine administrative
    use. Source method detail: Symbolic Logic: Correlation rule firing when a local account creation (4720)
    is followed within 60 minutes by a successful logon (4624 Logon Type 3/10) for the same TargetUserName
    from a non-internal IP. Add the immediate add-to-Administrators (4732) variant. Validate the chain
    with [Atomic Red Team T1078.003](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1078.003/T1078.003.md)
    account-creation tests. Surface account, creating subject, and source IP in the alert.
  answer_sources:
