    and (b) total failures. Low ratio (<0.2) with high total (>50) indicates brute-force against one account;
    high ratio (>0.9) with >10 unique accounts indicates password spray. Alert on either when followed
    by a 4624 success; derive cutoffs from your own distribution. In the Privilege Escalation context,
    the adversary uses the local account to obtain higher privileges (local administrator or SYSTEM),
    so elevation attempts, privileged-group changes, and exploit-tool execution are the focus. Source
    method detail: Statistical Method: Over a 10-minute sliding window per source IP compute (a) unique
    local accounts with 4625 failures and (b) total failures. Low ratio (<0.2) with high total (>50) indicates
    brute-force against one account; high ratio (>0.9) with >10 unique accounts indicates password spray.
    Alert on either when followed by a 4624 success. Derive ratio/volume cutoffs from your own failed-logon
    distribution. This unique-account-to-failure ratio is the deterministic spray signal in [Splunk Threat
    Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html)
    and [ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).
