    >10 unique accounts strongly indicates spraying (one password, many accounts). Also profile the failed:success
    State across the targeted set. Derive cutoffs from your environment's normal distinct-account-per-source
    distribution, following the spray-ratio analytics of [Splunk](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html)
    and [ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).
  answer_sources:
  - Windows Event ID 4625
  - 'NAI: Domain Controllers, ADFS Servers, Member Servers with remote access capabilities, Public-facing
    applications'
  range: Last 7 days (pivot to a 5-15 minute correlation window around each candidate event)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >2-
        per src_ip, 10m: u=distinct targets; t=count(4625); ratio=u/t
        if ratio>0.9 and u>10: alert(spray, u, t, fail_success_state)
- question: (Stealth) Does K-Means/DBSCAN clustering of source IPs on total failures, unique targets,
