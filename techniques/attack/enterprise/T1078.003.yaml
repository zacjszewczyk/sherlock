    Escalation context, the adversary uses the local account to obtain higher privileges (local administrator
    or SYSTEM), so elevation attempts, privileged-group changes, and exploit-tool execution are the focus.
    Source method detail: Symbolic Logic: For each successful remote login (4624 Logon Type 3/10) geolocate
    the source IP and compute required travel velocity from the account's previous successful login (distance/time).
    If velocity exceeds a feasible threshold (e.g., 965 km/h) raise a high-severity impossible-travel
    alert; exclude known VPN/proxy egress ranges to control false positives, per [Microsoft impossible-travel
    patent WO2018085161A1](https://patents.google.com/patent/WO2018085161A1/en). Surface both endpoints,
    elapsed time, and implied speed in the alert.
