- question: (Persistence) For a successful remote local-account login, does the implied travel velocity
    from the account's previous successful login location exceed a feasible threshold (e.g., 965 km/h),
    excluding known VPN/proxy egress ranges?
  context: >-
    For each successful remote login (4624 Logon Type 3/10) geolocate the source IP and compute required
    travel velocity from the account's previous successful login (distance/time). If velocity exceeds
    a feasible threshold (e.g., 965 km/h) raise a high-severity impossible-travel alert; exclude known
    VPN/proxy egress ranges and surface both endpoints, elapsed time, and implied speed. In the Persistence
    context, the adversary leverages the local account to retain a durable foothold that survives reboots
    and credential changes, so recurring, automated, or newly-established reuse is the key concern. Source
    method detail: Symbolic Logic: For each successful remote login (4624 Logon Type 3/10) geolocate the
    source IP and compute required travel velocity from the account's previous successful login (distance/time).
    If velocity exceeds a feasible threshold (e.g., 965 km/h) raise a high-severity impossible-travel
    alert; exclude known VPN/proxy egress ranges to control false positives, per [Microsoft impossible-travel
    patent WO2018085161A1](https://patents.google.com/patent/WO2018085161A1/en). Surface both endpoints,
    elapsed time, and implied speed in the alert.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: VPN Concentrators, Remote Desktop Gateways, Cloud IAM Services, Geolocation Database'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >2-
        for login in 4624(LogonType in {3,10}, local account):
          prev=last_success(account)
          v = geo_distance(prev.geo, login.geo)/(login.ts-prev.ts)
          if v>965 km/h and login.src_ip not in vpn/proxy:
            alert(prev.geo, login.geo, elapsed, v)
