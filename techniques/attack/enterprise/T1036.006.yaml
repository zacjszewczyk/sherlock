name: 'T1036.006: Masquerading: Space after Filename'
id: 2236f743-9e59-418b-a84c-da87b86f04e5
description: >-
  Investigate evidence that an adversary is masquerading a malicious binary by appending a trailing space
  to its filename (MITRE ATT&CK T1036.006, Masquerading: Space after Filename) on Linux and macOS hosts.
  On these platforms a trailing space causes the OS to ignore the benign declared extension (e.g., .txt,
  .jpg) and dispatch the file by its true Mach-O/ELF type, so a user double-clicking a benign-looking
  file unknowingly executes code — the staging pattern used by the Keydnap/Eleanor macOS backdoors. This
  playbook helps an analyst hunt for: (1) execution of trailing-space images whose hash matches known-malicious
  indicators or is statistically rare across the fleet; (2) trailing-space binaries impersonating sensitive
  program names (bash, launchd, sshd, Terminal) run from non-standard paths; (3) creation or renaming
  of trailing-space files in staging directories, especially when given the execute bit despite a document/image
  extension; (4) trailing-space processes that beacon outbound to low-reputation or threat-intel-flagged
  destinations; and (5) trailing-space executions with anomalous launcher-to-child lineage indicative
  of handler-bypass execution (Finder/'open', launchd/LaunchAgent, archive handlers, Terminal.app). It
  combines deterministic symbolic-logic gates, statistical rarity/entropy/volume baselining, and explainable
  machine-learning models across endpoint (auditd, macOS Unified Log/ESF, File Metadata, fs:fsusage) and
  network (Zeek conn.log/dns.log) telemetry.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
