questions:
- question: >-
    [Symbolic Logic] Are there execution records on Linux or macOS hosts where the executed image or argv[0]
    basename ends in one or more trailing space characters, and does the SHA-256 of that executed file
    match a known-malicious indicator from internal or external threat intelligence?
  context: >-
    Tactic context (TA0005 Stealth): the adversary is trying to hide and blend in with normal activity;
    T1036.006 (Space after Filename) abuses how Linux/macOS dispatch a file by its true type when a trailing
    space defeats the declared extension, so a benign-looking document or image silently executes a Mach-O/ELF
    binary when double-clicked or run. What to look for and why: A file is created/dropped on disk with
    a trailing space in its filename (e.g., 'invoice.txt ', 'photo.jpg ') and is later executed; the executed
    image's hash matches a known-malicious indicator. The trailing space makes the OS ignore the benign
    extension and dispatch the file by its true (Mach-O/ELF) type, executing it instead of opening it
    in the associated viewer. Method (Symbolic Logic): Symbolic Logic: Per [MITRE ATT&CK T1036.006](https://attack.mitre.org/techniques/T1036/006/),
    query execution records (auditd execve, macOS ESF exec) where the executed path or argv[0] ends with
    one or more space characters (regex '.* +$' on the basename), then join to the prior file-creation
    event for the same inode/path on the same host. Extract the image SHA-256 and cross-reference internal
    and external threat-intel feeds; the [Keydnap/Eleanor macOS campaigns](https://arstechnica.com/security/2016/07/after-hiatus-in-the-wild-mac-backdoors-are-suddenly-back/)
    staged such payloads in user download directories. Generate a CRITICAL alert on any hash match. A
    positive result is a confirmed trailing-space file or execution that aligns with the evidence above
    — pivot immediately to the responsible process, the user account, the creating/parent process, the
    file's true filetype and hash, and any subsequent network egress, then scope and contain the host.
    A negative or benign result is typically an accidental trailing space in a genuine document, a known
    developer/build artifact, or a signed/notarized binary; document and allowlist those rather than dropping
    the detection.
  answer_sources:
  - auditd:SYSCALL execve
  - auditd:PATH
  - macos:unifiedlog process events
  - File Metadata
  - fs:fsusage
  - 'NAI: Centralized SIEM/log aggregator holding endpoint file-creation and process-execution telemetry
    from all Linux and macOS hosts: auditd SYSCALL(execve)/PATH records, macOS Unified Log process events
    and Endpoint Security Framework (ESF) ES_EVENT_TYPE_NOTIFY_EXEC, plus file-creation (DC0059 File Metadata)
    and file-access (fs:fsusage) records.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      from exec_events (auditd execve | macos ESF exec)
      | where basename(image | argv0) matches '.* +$'   // trailing space
      | join file_create on same inode/path/host (prior event)
      | extract sha256
      | where sha256 in threat_intel_feed
      | output host, image, sha256, parent -> CRITICAL alert
