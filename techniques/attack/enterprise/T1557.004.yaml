questions:
- question: Did any corporate endpoint connect to a Wi-Fi BSSID, or negotiate a captive-portal TLS certificate
    whose thumbprint, that appears on a threat-intelligence blocklist or deviates from the sanctioned
    authorized-AP fingerprint (BSSID/OUI, channel, cipher, beacon parameters)?
  context: 'An Evil Twin operator''s radio infrastructure is often already catalogued in threat intelligence
    by BSSID or by the SSL certificate thumbprint served by its captive portal. Matching observed wireless
    associations (Zeek wifi.log, Windows Event ID 8001) and TLS certificates (Zeek ssl.log/x509.log) against
    TI blocklists, and simultaneously enforcing an authorized-AP whitelist, gives a deterministic, high-confidence
    detection: any AP advertising a corporate SSID but deviating from the sanctioned fingerprint is rogue
    by definition. In the Credential Access context this is the earliest tell that a device joined attacker-controlled
    radio infrastructure where credentials could be harvested. A positive match warrants immediate investigation
    of the device''s subsequent traffic and any logins performed during that session. Source citation:
    [A Flexible Framework for Rogue Access Point Detection](https://doi.org/10.5220/0006832904660471).'
  answer_sources:
  - Zeek wifi.log
  - Zeek ssl.log
  - Windows Event ID 8001
  - 'NAI: Corporate endpoints with wireless capabilities, wireless access point controllers, and network
    sensors monitoring egress traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=wifi_or_winlog (sourcetype=zeek_wifi OR EventCode=8001 OR sourcetype=zeek_ssl\
      \ OR sourcetype=zeek_x509)\n  | eval ind=coalesce(bssid, cert_thumbprint)\n  | lookup ti_blocklist\
      \ value AS ind OUTPUT verdict\n  | where verdict=\"malicious\"\n     OR (ssid IN (corporate_ssids)\
      \ AND NOT [| inputlookup authorized_ap WHERE match on bssid,oui,channel,cipher,beacon])\n  | table\
      \ _time, host, ssid, bssid, cert_thumbprint, verdict"
- question: Among connections to a corporate SSID, which sessions used a BSSID that is statistically rare
    (seen in <0.1% of historical samples), or which corporate SSID suddenly mapped to two distinct BSSIDs
    at a single physical location?
  context: 'Legitimate corporate APs produce a stable, recurring set of BSSIDs per site. An Evil Twin
    introduces a new BSSID broadcasting the same SSID, so its BSSID will be statistically rare against
    a per-site baseline, and the canonical signature is one SSID resolving to two distinct BSSIDs at the
    same location simultaneously. Derive the per-site threshold from a 30-day baseline. This statistical
    approach catches twins that are not yet in any blocklist. A positive result (a rare BSSID, or an SSID-to-two-BSSID
    collision at one site) strongly suggests a rogue AP positioned to capture credentials; a negative
    result means observed BSSIDs match the established site baseline. Source citation: [Rogue Access Point
    Detection: Taxonomy, Challenges, and Future Directions](https://doi.org/10.1007/s11277-016-3390-x).'
  answer_sources:
  - Zeek wifi.log
  - Zeek ssl.log
  - Windows Event ID 8001
  - 'NAI: Corporate endpoints with wireless capabilities, wireless access point controllers, and network
    sensors monitoring egress traffic.'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=wifi sourcetype IN (zeek_wifi,winlog_8001) ssid IN (corporate_ssids)\n  | eventstats\
      \ count AS total by ssid, site\n  | stats count AS seen dc(bssid) AS bssids_per_site by ssid, bssid,\
      \ site total\n  | eval freq=seen/total\n  | where freq<0.001 OR bssids_per_site>1\n  | table site,\
      \ ssid, bssid, freq, bssids_per_site"
- question: When scored by a machine-learning model on Wi-Fi session features (OUI, channel, signal strength,
    session duration, captive-portal indicators) and PHY-layer RF fingerprinting, which sessions are classified
    as Evil Twin, and what are the top contributing features?
  context: 'A Random Forest trained on labeled Wi-Fi session features can surface twins that evade single-feature
    rules by combining weak signals; reporting the top-3 contributing features makes each alert explainable
    for the analyst. Complementing it with a CNN over the 802.11 preamble (PHY-layer RF fingerprinting)
    catches a twin whose physical radio hardware fingerprint contradicts the BSSID it claims, which spoofing
    cannot easily defeat. In the Credential Access context this provides a robust second opinion when
    an AP looks legitimate by metadata but is physically a different transmitter. A high model score with
    corroborating top features should escalate the session for credential-exposure review. Source citation:
    [Convolutional neural network based evil twin attack detection in WiFi networks](https://doi.org/10.1051/matecconf/202133608006).'
  answer_sources:
  - Zeek wifi.log
  - Zeek ssl.log
  - Windows Event ID 8001
  - 'NAI: Corporate endpoints with wireless capabilities, wireless access point controllers, and network
    sensors monitoring egress traffic.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = extract(wifi_sessions: oui, channel, rss, duration, captive_portal_flag)\n\
      \  score = random_forest.predict_proba(features)\n  rf_fp = cnn_preamble.predict(phy_iq_samples)\n\
      \  alert where score>0.8 OR rf_fp.mismatch(claimed_bssid)\n  emit top3_feature_importances(features)"
- question: After a new Wi-Fi association, did HTTP traffic or browser process context contain known Evil
    Twin captive-portal markers (Wi-Fi Pineapple / wifiphisher templates, forced-login HTML), and in SDN/controller
    environments did the serving AP fail validation against authorized infrastructure?
  context: 'Evil Twin toolkits ship recognizable captive-portal templates and forced-login HTML. Applying
    regexes to Zeek http.log/files.log and correlating with the browser process recorded in Windows Event
    ID 4688 deterministically flags these credential-harvesting pages right after a new association. In
    SDN/controller environments, additionally validating the serving AP''s identity against authorized
    infrastructure before trusting its portal removes false positives from legitimate captive portals.
    For Credential Access this is the direct moment of credential theft: a positive match means a fake
    login page was presented to the user and any credentials entered should be considered compromised
    and reset. Source citation: [EvilScout: Detection and Mitigation of Evil Twin Attack in SDN Enabled
    WiFi](https://doi.org/10.1109/tnsm.2020.2972774).'
  answer_sources:
  - Zeek http.log
  - Zeek wifi.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Network traffic sensors at egress points, endpoint EDR agents with network visibility, and DNS
    resolvers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  http.log/files.log | where uri =~ /(wifiphisher|pineapple|firmware-upgrade|oauth-login)/i\n\
      \     OR body_html =~ /forced[-_ ]?login|please re-enter your password/i\n  | join winlog EventCode=4688\
      \ (browser process: chrome.exe|msedge.exe|firefox.exe)\n  | (SDN) drop if serving_ap in authorized_infrastructure\n\
      \  | alert host, uri, ap_bssid, proc"
- question: Which captive-portal URIs have Shannon entropy above the 95th percentile of the site baseline,
    or were reached via a forced HTTP 302 redirect to a non-standard portal immediately after association?
  context: 'Auto-generated or obfuscated phishing portal URIs tend to have high character entropy relative
    to legitimate, human-readable corporate portal URLs; flagging URIs above the 95th-percentile entropy
    of the site baseline surfaces machine-generated harvesting pages. Separately, a forced HTTP 302 redirect
    to a non-standard portal immediately after a device associates is a distinct, countable interception
    indicator. Together these statistical signals catch novel portals not covered by template regexes.
    In the Credential Access context, a high-entropy URI reached via an immediate post-association redirect
    is a strong indicator the user was funneled to a credential capture page. Source citation: [Rogue
    Access Point Detection: Taxonomy, Challenges, and Future Directions](https://doi.org/10.1007/s11277-016-3390-x).'
  answer_sources:
  - Zeek http.log
  - Zeek wifi.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Network traffic sensors at egress points, endpoint EDR agents with network visibility, and DNS
    resolvers.'
  range: Last 90 days (baseline per site)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  zeek_http | eval ent=shannon_entropy(uri)\n  | eventstats perc95(ent) AS thr by site\n\
      \  | eval redirect_after_join=(status=302 AND time_since_assoc<60s AND host NOT IN standard_portals)\n\
      \  | where ent>thr OR redirect_after_join\n  | table host, uri, ent, thr, status, redirect_after_join"
- question: When a supervised text/topic model is applied to captive-portal content plus Windows process
    metadata, which pages are classified as credential-harvesting, and what tokens or features drove the
    verdict?
  context: 'Phishing/captive portals that harvest credentials share lexical and structural patterns (password
    fields, brand impersonation, urgency language). A supervised text/topic model over portal HTML content
    combined with Windows browser process metadata (Event ID 4688) classifies harvesting pages even when
    their URIs and templates are novel, and reporting the top contributing tokens/features makes the alert
    defensible within an end-to-end detection-and-mitigation pipeline. For Credential Access this is the
    content-level confirmation that a connected portal was designed to steal credentials; a positive classification
    should trigger credential reset and session containment. Source citation: [A Machine Learning-Based
    Framework for Evil Twin Attack Detection and Mitigation in IEEE 802.11 Wireless Networks](https://doi.org/10.1109/emergin67762.2025.11450790).'
  answer_sources:
  - Zeek http.log
  - Zeek wifi.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Network traffic sensors at egress points, endpoint EDR agents with network visibility, and DNS
    resolvers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  text = fetch_portal_content(http.log, files.log) + winlog_4688_proc_meta\n  pred = supervised_topic_model.predict(text)\n\
      \  alert where pred.label==\"credential_harvest\" AND pred.score>0.7\n  emit top_contributing_tokens(text)"
- question: Did a corporate device connect to a wireless access point broadcasting a corporate SSID whose
    BSSID is absent from the authoritative inventory of approved BSSIDs, and in SDN-enabled WiFi did the
    controller's gateway/forwarding-path validation flag that AP?
  context: 'The most direct Evil Twin tell is a corporate SSID served by a BSSID that the enterprise never
    deployed. Alerting whenever a corporate-SSID connection references a BSSID missing from the authoritative
    WLC/asset inventory is a deterministic detection. In SDN-enabled WiFi, having the controller validate
    each AP''s gateway/forwarding path against authorized infrastructure and centrally block unauthorized
    APs both detects and mitigates. In the Credential Access context, an unknown BSSID under a trusted
    SSID means the device may have handed traffic and credentials to an attacker; correlate with physical
    security/location logs to locate the rogue transmitter. Source citation: [EvilScout: Detection and
    Mitigation of Evil Twin Attack in SDN Enabled WiFi](https://doi.org/10.1109/tnsm.2020.2972774).'
  answer_sources:
  - Zeek wifi.log
  - Windows Event ID 8001
  - Zeek conn.log
  - 'NAI: Wireless LAN Controllers, enterprise asset management database, endpoint wireless logs, and
    physical security access logs for location correlation.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=wifi (sourcetype=zeek_wifi OR EventCode=8001) ssid IN (corporate_ssids)\n  | lookup\
      \ approved_bssid_inventory bssid OUTPUT approved\n  | where isnull(approved)\n  | (SDN) annotate\
      \ controller_path_validation(bssid)\n  | table _time, host, ssid, bssid, location"
- question: Which new BSSIDs are associated with more than one device per location beyond the baseline,
    and does RSSI-vector clustering across distributed sensors place a co-named AP in a distinct signal
    cluster (i.e., a different physical position than the genuine AP)?
  context: 'A twin co-named with a genuine AP transmits from a different physical location, so its received-signal-strength
    (RSS) vector measured across distributed sensors forms a distinct cluster from the genuine AP''s.
    Flagging new BSSIDs whose device count exceeds the per-location baseline, and corroborating with RSSI-vector
    clustering, statistically separates a rogue from the legitimate AP even when both advertise identical
    SSID/BSSID metadata. For Credential Access, a separate RSS cluster for a co-named AP is physical evidence
    of a second transmitter intercepting clients; it also enables 2D indoor localization to find the device.
    Source citation: [Received-Signal-Strength-Based Approach for Detection and 2D Indoor Localization
    of Evil Twin Rogue Access Point in 802.11](https://doi.org/10.18280/ijsse.110102).'
  answer_sources:
  - Zeek wifi.log
  - Windows Event ID 8001
  - Zeek conn.log
  - 'NAI: Wireless LAN Controllers, enterprise asset management database, endpoint wireless logs, and
    physical security access logs for location correlation.'
  range: Last 90 days (baseline per location)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  zeek_wifi/winlog_8001 | stats dc(host) AS devices values(rssi_vector) AS rss by bssid,\
      \ location\n  | append baseline_device_count by location\n  | where new_bssid AND devices>baseline_per_location\n\
      \  | cluster rss method=kmeans\n  | where cluster_distinct_from_genuine_ap\n  | table bssid, location,\
      \ devices, cluster_id"
- question: Does per-session server inter-arrival-time (IAT) or round-trip-time analysis show the extra
    wireless hop characteristic of an Evil Twin relaying victim traffic through the genuine AP, exceeding
    the single-hop baseline?
  context: 'An Evil Twin that relays victim traffic onward through the genuine AP doubles the wireless
    segment, adding a measurable extra hop. Measuring per-session IAT/RTT distributions and applying Trained
    Mean Matching and the Hop Differentiating Technique against thresholds derived from known one-hop
    traffic statistically reveals this doubled wireless path even when all metadata is spoofed. For Credential
    Access this timing-physics signal confirms interposition: the attacker is between the victim and the
    real AP, in position to capture credentials. A session whose IAT/RTT shifts beyond the single-hop
    baseline indicates a relayed connection. Source citations: [Active User-Side Evil Twin Access Point
    Detection Using Statistical Techniques](https://doi.org/10.1109/tifs.2012.2207383); [Who is peeping
    at your passwords at Starbucks? — To catch an evil twin access point](https://doi.org/10.1109/dsn.2010.5544302).'
  answer_sources:
  - Zeek wifi.log
  - Windows Event ID 8001
  - Zeek conn.log
  - 'NAI: Wireless LAN Controllers, enterprise asset management database, endpoint wireless logs, and
    physical security access logs for location correlation.'
  range: Last 90 days (one-hop baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  zeek_conn | eval iat=server_interarrival_time, rtt=round_trip_time\n  | trained_mean_matching(iat)\
      \ ; hop_differentiating_technique(rtt)\n  | where estimated_hops>1 OR iat>onehop_threshold OR rtt>onehop_threshold\n\
      \  | table host, ap_bssid, iat, rtt, estimated_hops"
- question: When DBSCAN is applied to BSSID/SSID/client-MAC combinations, which small dense clusters contain
    new BSSIDs, and does an incremental online beacon-frame classifier flag arriving beacons as Evil Twin
    (with top contributing features)?
  context: 'Density-based clustering (DBSCAN) over BSSID/SSID/client-MAC combinations isolates small dense
    clusters containing newly-appeared BSSIDs that don''t fit established legitimate groupings. Running
    an incremental beacon-frame classifier that updates online as new beacons arrive catches twins in
    near-real-time and surfaces the top-3 features driving each verdict for explainability. In the Credential
    Access context this unsupervised+online approach detects rogue APs that evade inventory and rarity
    checks. A new BSSID in a small dense cluster, confirmed by the beacon classifier, indicates likely
    rogue infrastructure to investigate for credential capture. Source citation: [ETGuard: Detecting D2D
    attacks using wireless Evil Twins](https://doi.org/10.1016/j.cose.2019.02.014).'
  answer_sources:
  - Zeek wifi.log
  - Windows Event ID 8001
  - Zeek conn.log
  - 'NAI: Wireless LAN Controllers, enterprise asset management database, endpoint wireless logs, and
    physical security access logs for location correlation.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = combos(bssid, ssid, client_mac)\n  labels = DBSCAN(eps, min_samples).fit(X)\n  flag\
      \ small dense clusters containing new_bssid\n  online = incremental_beacon_classifier.update_and_predict(beacon_stream)\n\
      \  alert where online.label==\"evil_twin\"; emit top3_features"
- question: Within five minutes of joining a new BSSID, did any device receive a DNS answer resolving
    a corporate/high-value domain to an RFC1918 (private) IP address, with Windows Event ID 5156 showing
    the redirected connection?
  context: 'An Evil Twin reaches the Internet through a different gateway/ISP than the genuine AP and
    frequently runs a rogue resolver that points high-value domains inward to attacker-controlled RFC1918
    hosts (for credential capture or interception). Alerting when Zeek dns.log and Windows Event ID 5156
    show corporate domains resolving to private addresses within five minutes of joining a new BSSID is
    a strong deterministic tell. For Credential Access, a corporate login domain pointed at a private
    IP right after an AP change means traffic (and any credentials submitted) is being redirected to the
    attacker; treat affected accounts as exposed. Source citation: [CETAD: Detecting evil twin access
    point attacks in wireless hotspots](https://doi.org/10.1109/cns.2014.6997491).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek wifi.log
  - Windows Event ID 5156
  - 'NAI: Centralized DNS servers, network sensors capturing DNS traffic, and endpoint DNS client logs.'
  range: 'Last 90 days (event-centered: 5 min after BSSID change)'
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  dns.log | where query IN (high_value_domains) AND answer in_rfc1918\n  | join (wifi.log\
      \ new_bssid_assoc) on host where dns.ts - assoc.ts <= 5min\n  | join winlog EventCode=5156 on host,dest_ip\n\
      \  | alert host, query, answer, bssid"
- question: After a network change, which devices received more than three DNS answers outside their per-host
    baseline IP set, and how does each device's NXDOMAIN/SERVFAIL failure rate compare to baseline?
  context: 'Rogue resolvers behind an Evil Twin often answer only the names the attacker targets while
    failing others, so a device will suddenly receive DNS answers outside its established per-host IP
    set, and its NXDOMAIN/SERVFAIL pattern shifts. Flagging >3 deviant answers after a network change,
    and profiling the failure rate separately, statistically distinguishes a rogue resolver from the legitimate
    one. In the Credential Access context this reveals selective DNS manipulation aimed at steering the
    victim to credential-capture infrastructure. Elevated deviant-answer counts plus an abnormal failure
    pattern after an AP change indicate a hostile resolver. Source citation: [Rogue Access Point Detection:
    Taxonomy, Challenges, and Future Directions](https://doi.org/10.1007/s11277-016-3390-x).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek wifi.log
  - Windows Event ID 5156
  - 'NAI: Centralized DNS servers, network sensors capturing DNS traffic, and endpoint DNS client logs.'
  range: Last 90 days (baseline per host)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  zeek_dns | join wifi network_change_events on host\n  | lookup host_dns_baseline host\
      \ OUTPUT baseline_ips\n  | eval deviant=(answer NOT IN baseline_ips)\n  | stats sum(deviant) AS\
      \ dev_cnt count(eval(rcode IN (\"NXDOMAIN\",\"SERVFAIL\"))) AS fails by host\n  | where dev_cnt>3\
      \ OR fails>baseline_fail_rate"
- question: Does STL time-series decomposition of per-host private-IP DNS response counts (Zeek plus Windows
    context) show a spike, and which domains/hosts contributed to the anomaly?
  context: 'Seasonal-Trend decomposition using Loess (STL) models the normal rhythm of private-IP DNS
    responses per host and isolates anomalous spikes from trend and seasonality. A burst of high-value
    domains resolving to private IPs—the hallmark of Evil Twin DNS redirection for credential capture—appears
    as a residual spike, and reporting the contributing domains/hosts makes the alert actionable. For
    Credential Access this forecasting approach catches gradual or intermittent redirection campaigns
    that point-in-time rules miss. A significant residual spike in private-IP DNS responses should be
    investigated for which login domains were redirected. Source citation: [A Machine Learning-Based Framework
    for Evil Twin Attack Detection and Mitigation in IEEE 802.11 Wireless Networks](https://doi.org/10.1109/emergin67762.2025.11450790).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek wifi.log
  - Windows Event ID 5156
  - 'NAI: Centralized DNS servers, network sensors capturing DNS traffic, and endpoint DNS client logs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  series = count(dns answers in_rfc1918) per host per interval\n  trend,seasonal,resid\
      \ = STL(series).decompose()\n  alert where resid > k*stddev(resid)\n  emit contributing_domains_hosts(window)"
- question: After joining a new non-corporate BSSID, did a device interact with a captive portal over
    HTTP/TLS presenting a self-signed, expired, or untrusted-CA certificate (Windows Event ID 36888/36887
    validation failure) that falls outside the trusted-CA/cert-fingerprint whitelist?
  context: 'Evil Twins that intercept HTTPS typically present custom certificates that fail validation
    (self-signed, expired, or issued by an untrusted CA). Alerting when Zeek ssl.log/x509.log and Windows
    Event IDs 36888/36887 show invalid validation status following a new non-corporate BSSID session,
    while maintaining a whitelist of trusted CAs and certificate fingerprints, deterministically flags
    any captive portal outside the trusted set. For Credential Access, an invalid TLS certificate on a
    portal right after joining an unknown AP indicates an interception attempt against encrypted logins;
    credentials entered over that session should be considered exposed. Source citation: [A Flexible Framework
    for Rogue Access Point Detection](https://doi.org/10.5220/0006832904660471).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek wifi.log
  - Zeek x509.log
  - Windows Event ID 36888
  - Windows Event ID 36887
  - 'NAI: Network egress points, endpoint browsers (via EDR), wireless network sensors, and Certificate
    Transparency logs.'
  range: Last 90 days (event-centered on BSSID change)
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  ssl.log/x509.log | where validation_status IN (\"self-signed\",\"expired\",\"untrusted-CA\"\
      )\n     OR cert_fp NOT IN trusted_ca_whitelist\n  | join wifi.log new_noncorp_bssid on host\n  |\
      \ join winlog EventCode IN (36888,36887) on host\n  | alert host, server_name, validation_status,\
      \ cert_fp, bssid"
- question: Which devices show an HTTP-to-HTTPS login ratio spiking more than 3σ above baseline, and how
    does each device's TLS validation-failure rate (Event ID 36888/36887) compare as a distinct interception
    signal?
  context: 'When an Evil Twin strips or downgrades TLS to capture credentials, the share of logins occurring
    over plain HTTP rises sharply. Flagging devices whose HTTP-to-HTTPS login ratio spikes >3σ above baseline
    statistically detects this downgrade, and treating the rate of TLS validation failures (Event ID 36888/36887)
    as a separate countable signal corroborates active interception. For Credential Access these two metrics
    together indicate that encrypted login protection is being undermined on a device''s session. A simultaneous
    HTTP-ratio spike and elevated validation-failure rate after an AP change strongly suggests credential
    interception. Source citation: [Rogue Access Point Detection: Taxonomy, Challenges, and Future Directions](https://doi.org/10.1007/s11277-016-3390-x).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek wifi.log
  - Zeek x509.log
  - Windows Event ID 36888
  - Windows Event ID 36887
  - 'NAI: Network egress points, endpoint browsers (via EDR), wireless network sensors, and Certificate
    Transparency logs.'
  range: Last 90 days (baseline per host)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  http+ssl | stats count(eval(is_login AND scheme=\"http\")) AS h count(eval(is_login\
      \ AND scheme=\"https\")) AS s by host\n  | eval ratio=h/(s+1)\n  | eventstats avg(ratio) AS m stdev(ratio)\
      \ AS sd by host\n  | join winlog (count EventCode IN (36888,36887) AS tls_fail by host)\n  | where\
      \ ratio>m+3*sd OR tls_fail>baseline"
- question: When a decision tree (or equivalent classifier) scores portals on protocol, TLS validation
    status, URI keywords, and BSSID novelty enriched with Windows metadata, which captive portals are
    classified malicious, and what are the top contributing features?
  context: 'A decision-tree classifier combining protocol, TLS validation status, URI keywords, and BSSID
    novelty with Windows metadata captures the multi-feature signature of a malicious captive portal that
    no single rule fully expresses, while remaining interpretable via its top-3 contributing features.
    For Credential Access this provides an explainable, automated verdict on whether a portal a device
    interacted with after an AP change was designed to harvest credentials. A malicious classification—especially
    with BSSID novelty and invalid TLS among the top features—should trigger credential reset and containment
    of the session. Source citation: [A Machine Learning-Based Framework for Evil Twin Attack Detection
