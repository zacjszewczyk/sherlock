name: 'T1557.004: Evil Twin'
id: 378adfa2-7b15-4edd-90b3-585f4e12d70b
description: 'Investigate evidence that an adversary stood up a rogue ''Evil Twin'' Wi-Fi access point
  impersonating a legitimate corporate or public SSID to lure devices into connecting, then used that
  position to harvest credentials (captive portals / fake login pages), intercept and manipulate traffic,
  and collect or exfiltrate data. This playbook helps an analyst hunt for the signatures of a malicious
  AP and the downstream effects of a victim connecting to it: connections to unauthorized or threat-intel-flagged
  BSSIDs, corporate SSIDs that suddenly map to multiple or unknown BSSIDs, captive-portal and credential-harvesting
  artifacts (Wi-Fi Pineapple / wifiphisher templates, forced HTTP 302 redirects), self-signed/expired
  or untrusted TLS certificates and downgraded cipher suites, DNS answers redirecting high-value domains
  to RFC1918 addresses, the extra wireless relay hop revealed by IAT/RTT timing physics, and post-connection
  collection behaviors such as C2 callbacks, anomalous outbound volume, sensitive MIME uploads to non-corporate
  IPs, DNS tunneling, and local subnet scanning. It combines deterministic symbolic-logic checks (whitelists,
  blocklists, authorized-BSSID and trusted-CA enforcement), statistical baselining (rarity, entropy, RSSI
  clustering, timing, volume thresholds), and machine-learning models (Random Forest, CNN RF-fingerprinting,
  DBSCAN, one-class SVM, graph and time-series anomaly detection) across Zeek network logs and Windows
  endpoint event logs.'
type: technique
