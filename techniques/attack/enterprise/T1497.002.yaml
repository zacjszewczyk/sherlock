questions:
- question: '[Stealth] Threat hash watch: Can you determine whether a process execution event (Sysmon
    Event ID 1 / Windows Event ID 4688) contains a file hash that matches a known sandbox-evasion tool,
    or a static PE import profile heavy in user-activity probe APIs (GetCursorPos, GetForegroundWindow,
    GetLastInputInfo, GetRecentDocs). -- specifically, using the ''Threat hash watch'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), this technique addresses the mission
    question -- Is the adversary attempting to evade defenses by checking for user activity? Adversaries
    probe for signs of a real, interactive user so their malware can stay dormant or self-terminate inside
    automated sandboxes and only detonate on genuine victims, defeating dynamic analysis and delaying
    detection. This evidence focuses on the condition that a process execution event (Sysmon Event ID
    1 / Windows Event ID 4688) contains a file hash that matches a known sandbox-evasion tool, or a static
    PE import profile heavy in user-activity probe APIs (GetCursorPos, GetForegroundWindow, GetLastInputInfo,
    GetRecentDocs). This Symbolic Logic approach works as follows: Continuously match file hashes of newly
    created processes (Sysmon EID 1) against a threat-intel feed of known user-activity sandbox-evasion
    tools (e.g., ''Pafish'', ''Al-Khaser'') and malware families documented to implement T1497.002. Generate
    a high-severity alert on any match. The set of user-activity probe APIs and tools to watch is enumerated
    in [Malware Dynamic Analysis Evasion Techniques: A Survey](https://arxiv.org/abs/1811.01190), and
    [Longitudinal Study of the Prevalence of Malware Evasive Techniques](https://arxiv.org/abs/2112.11289)
    provides empirical prevalence to prioritize the most common probe families. A positive result -- a
    rule match, statistical outlier, or model alert -- indicates a process is interrogating user-presence
    artifacts or gating its behavior on user interaction in a way consistent with sandbox evasion; pivot
    to the responsible process, its parent lineage and command line, the specific artifacts/files/registry
    keys touched, the proportion of empty/denied reads, activation timing, and any subsequent network
    egress. A negative result helps rule out this evasion vector for the inspected scope but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, context-triggered,
    or living-off-the-land evasion.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All corporate endpoints (laptops, desktops); Virtual Desktop Infrastructure (VDI) environment;
    Server infrastructure.'
  range: Last 90 days (correlate within short per-process windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Threat hash watch

      source IN [Windows Event ID 4688, Sysmon Event ID 1]

      | WHERE matches_action_criteria("Threat hash watch")

      // Continuously match file hashes of newly created processes (Sysmon EID 1) against a threat-intel
      feed of known user-activity sandbox-evasion tools (e.g

