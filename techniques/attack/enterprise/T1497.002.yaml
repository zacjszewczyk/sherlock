    Alert on low-probability chains (unusual parent -> credential read -> new domain) and surface the
    top-3 contributing entities/edges in the alert. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates a process is interrogating user-presence artifacts or gating its behavior
    on user interaction in a way consistent with sandbox evasion; pivot to the responsible process, its
    parent lineage and command line, the specific artifacts/files/registry keys touched, the proportion
    of empty/denied reads, activation timing, and any subsequent network egress. A negative result helps
    rule out this evasion vector for the inspected scope but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, context-triggered, or living-off-the-land
    evasion.'
