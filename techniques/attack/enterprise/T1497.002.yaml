name: 'T1497.002: Virtualization/Sandbox Evasion: User Activity Based Checks'
id: 3c85e777-ac6f-4ada-9cb4-31b93182cc79
description: 'This playbook helps an analyst investigate whether an adversary is using user-activity-based
  virtualization/sandbox evasion (MITRE ATT&CK T1497.002) to detect a real, interactive user before activating
  malicious code, and to disengage or stall when it suspects an automated analysis environment. It guides
  the hunt across Windows, Linux, and macOS along several behavioral angles: execution of known sandbox-evasion
  tooling or binaries whose PE import tables are heavy in user-activity probe APIs (GetCursorPos, GetForegroundWindow,
  GetLastInputInfo, GetAsyncKeyState, SHAddToRecentDocs/GetRecentDocs); rapid bursts of file/registry
  reads against user-activity artifacts (browser history, RunMRU, Recent docs, Desktop, ~/.bash_history,
  Safari Bookmarks.plist) with a tell-tale high proportion of empty or access-denied reads typical of
  a freshly provisioned sandbox; document-handler children (WINWORD/EXCEL/ACROBAT) that stall or wait
  for a user-interaction trigger (document close, embedded-image double-click) before their first network
  connection or child process; command lines that enumerate user directories and browser data or invoke
  input-state tools (findstr/PowerShell over Documents, browser SQLite queries, xdotool/xinput); high-volume
  sampling of unique files in user directories to gauge user presence; and sensitive user-file reads (browser
  credential stores, SSH keys) immediately followed by anomalous outbound connections. Detection methods
  combine symbolic-logic rules, statistical baselining/anomaly detection, and machine-learning models
  (classifiers, sequence/HMM/LSTM models, isolation forests, clustering, and provenance-graph GNNs) applied
  to Windows Security/Sysmon events, auditd, macOS unified logs, and Zeek network telemetry, so the analyst
  can corroborate suspected evasion against process lineage, probe sequences, activation timing, and exfiltration
  context.'
