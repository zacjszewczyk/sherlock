questions:
- question: '[Initial Access] Continuously correlate outbound network connection logs against high-confidence
    threat intelligence: Can you determine whether an internal host establishes an outbound network connection
    to a destination IP address or domain that matches a high-confidence entry on a threat intelligence
    feed categorized as phishing, malware C2, or recently compromised. -- specifically, using the ''Continuously
    correlate outbound network connection logs against high-confidence threat intelligence'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary uses a spearphishing
    LINK to lure a target into clicking a URL that downloads malware, harvests credentials, exploits the
    browser, or grants a malicious OAuth/device-code token -- the earliest foothold in an intrusion. This
    evidence focuses on the condition that an internal host establishes an outbound network connection
    to a destination IP address or domain that matches a high-confidence entry on a threat intelligence
    feed categorized as phishing, malware C2, or recently compromised. This Symbolic Logic approach works
    as follows: Continuously correlate outbound network connection logs (Zeek conn.log `id.resp_h`, dns.log
    `query`, http.log `host`, ssl.log `server_name`) against a high-confidence threat-intelligence feed
    of known phishing/C2 indicators, and normalize/parse every URL first to defeat schema abuse (userinfo
    `@` trick, integer/hex/octal hostnames such as `hxxp://google.com@1157586937`, punycode/IDN homographs)
    per [URL Obfuscation: Schema Abuse, Mandiant](https://www.mandiant.com/resources/blog/url-obfuscation-schema-abuse).
    Generate a high-severity alert for any direct match. A positive result -- a rule match, a statistical
    outlier, or a model alert -- is a strong indicator that a user has interacted with phishing infrastructure;
    pivot to the recipient and host, the inbound email and its URLs, the destination domain/IP and its
    registration and reputation, any spawned processes, downloaded files, submitted credentials, or granted
    tokens, and downstream lateral or persistence activity. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, because a single method
    can miss obfuscated URLs, novel infrastructure, or living-off-the-land follow-on execution.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points (e.g., firewalls, proxies), DNS resolvers, Cloud Access Security Brokers
    (CASB).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Normalize URLs/hosts first to defeat schema abuse, then match TI\nti = load_feed(category\
      \ in [phishing, c2, recently_compromised], confidence=high)\nfor rec in union(conn.log[id.resp_h],\
      \ dns.log[query], http.log[host], ssl.log[server_name]):\n    host = normalize(rec)   // resolve\
      \ @userinfo trick, int/hex/octal host, punycode/IDN\n    if host in ti or rec.id.resp_h in ti.ips:\n\
      \        alert(severity=high, src=rec.id.orig_h, dst=host, feed=ti.match.category)"
- question: '[Initial Access] Rarity, volume, and failure-state scoring of matched destinations: Can you
    determine whether an internal host establishes an outbound network connection to a destination IP
    address or domain that matches a high-confidence entry on a threat intelligence feed categorized as
    phishing, malware C2, or recently compromised. -- specifically, using the ''Rarity, volume, and failure-state
    scoring of matched destinations'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary uses a spearphishing
    LINK to lure a target into clicking a URL that downloads malware, harvests credentials, exploits the
    browser, or grants a malicious OAuth/device-code token -- the earliest foothold in an intrusion. This
    evidence focuses on the condition that an internal host establishes an outbound network connection
    to a destination IP address or domain that matches a high-confidence entry on a threat intelligence
    feed categorized as phishing, malware C2, or recently compromised. This Statistical Method approach
    works as follows: For each threat-intelligence match, compute (1) the number of distinct internal
    source hosts that connected over 30 days — flag destinations below the 5th percentile (very few hosts)
    as targeted; (2) total bytes sent vs. received (Volume) and connections/min (Frequency); and (3) the
    connection success/failure state — repeated blocked-proxy/refused connections or a burst of NXDOMAIN
    for newly-seen lookalike domains is itself a distinct signal. Rank with a budget-bounded approach
    akin to Directed Anomaly Scoring in [Detecting Credential Spearphishing Attacks in Enterprise Settings,
    Ho et al.](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).
    A positive result -- a rule match, a statistical outlier, or a model alert -- is a strong indicator
    that a user has interacted with phishing infrastructure; pivot to the recipient and host, the inbound
    email and its URLs, the destination domain/IP and its registration and reputation, any spawned processes,
    downloaded files, submitted credentials, or granted tokens, and downstream lateral or persistence
    activity. A negative result helps rule out this particular vector but should be corroborated with
    the other questions in this playbook, because a single method can miss obfuscated URLs, novel infrastructure,
    or living-off-the-land follow-on execution.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points (e.g., firewalls, proxies), DNS resolvers, Cloud Access Security Brokers
    (CASB).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Score each TI-matched destination over 30d\nfor dst in ti_matched_destinations(window=30d):\n\
      \    hosts = distinct_count(src_host where resp==dst)\n    if hosts <= percentile(host_counts, 5):\
      \ tag(targeted)\n    vol  = sum(bytes_sent), vin = sum(bytes_recv); freq = conns_per_min(dst)\n\
      \    fails = count(state in [REJ, S0, blocked]) ; nx = count_nxdomain(lookalike(dst))\n    score\
      \ = das_rank(rarity=hosts, volume=vol, freq=freq, failures=fails+nx)\n    if score in top_budget(daily):\
      \ alert(dst, score)"
- question: '[Initial Access] Supervised URL maliciousness scoring layered in parallel: Can you determine
    whether an internal host establishes an outbound network connection to a destination IP address or
    domain that matches a high-confidence entry on a threat intelligence feed categorized as phishing,
    malware C2, or recently compromised. -- specifically, using the ''Supervised URL maliciousness scoring
    layered in parallel'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary uses a spearphishing
    LINK to lure a target into clicking a URL that downloads malware, harvests credentials, exploits the
    browser, or grants a malicious OAuth/device-code token -- the earliest foothold in an intrusion. This
    evidence focuses on the condition that an internal host establishes an outbound network connection
    to a destination IP address or domain that matches a high-confidence entry on a threat intelligence
    feed categorized as phishing, malware C2, or recently compromised. This Machine Learning approach
    works as follows: In parallel with the deterministic feed (never replacing it), score all outbound
    URLs with a character/word-level model such as [URLNet, Le et al.](https://arxiv.org/abs/1802.03162)
    or a transformer such as [URLBERT](https://arxiv.org/abs/2305.13035) using lexical, host (domain age,
    TLD, ASN reputation), and first-seen features. Escalate any event that is both a TI match and scores
    >0.9, and emit the top-3 contributing features (e.g., domain-age, entropy, ASN) in the alert text
    for triage. A positive result -- a rule match, a statistical outlier, or a model alert -- is a strong
    indicator that a user has interacted with phishing infrastructure; pivot to the recipient and host,
    the inbound email and its URLs, the destination domain/IP and its registration and reputation, any
    spawned processes, downloaded files, submitted credentials, or granted tokens, and downstream lateral
    or persistence activity. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, because a single method can miss obfuscated URLs, novel
    infrastructure, or living-off-the-land follow-on execution.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points (e.g., firewalls, proxies), DNS resolvers, Cloud Access Security Brokers
    (CASB).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "// Runs alongside (never replacing) the deterministic TI feed\nfeat = lexical + host(domain_age,\
      \ tld, asn_reputation) + first_seen\np = URLNet_or_URLBERT.score(url, feat)\nif ti_match(url) and\
      \ p > 0.9:\n    alert(url, p, top3=explain(feat)[:3])  // e.g. domain_age, entropy, asn"
