  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for r in http.log where method==POST and external(r.host):\n    e = shannon_entropy(r.uri);\
      \ hosts = distinct_hosts_posting(r.host, 30d)\n    vol = post_bytes(r); freq = posts_per_min(r.id.orig_h,\
      \ r.host)\n    fail = ratio_4xx_or_blocked(r.host); win = success_after_many_fails(r.host)\n   \
      \ if e>=p95 and hosts<3 and domain_age(r.host)<90d: alert(credential_theft, r)\n    elif fail high\
      \ or win: alert(failure_mode, r)"
