name: 'T1566.002: Spearphishing Link'
id: d2685496-fd7c-411c-bef7-eedab4fc7a51
description: 'This playbook helps an analyst investigate whether a sophisticated external actor, a routine
  threat actor, commodity malware operator, or insider has gained initial access by delivering a spearphishing
  message that carries a malicious LINK (rather than an attachment), under the Initial Access tactic.
  Spearphishing links rely on social engineering and User Execution: the recipient clicks or pastes a
  URL that leads to a credential-harvesting page, a browser exploit, a malware download (HTA, ISO, LNK,
  VBS, JS, EXE), or an OAuth/device-code consent flow that steals an application access token. Adversaries
  routinely obfuscate URLs with userinfo ''@'' tricks, integer/hex/octal hostnames, URL shorteners, punycode/IDN
  homographs, and freshly registered lookalike domains. The hunt therefore spans email/mail-gateway telemetry,
  DNS, web proxy and network logs (Zeek conn/dns/http/ssl/smtp/files), endpoint process-creation telemetry
  (Windows Event ID 4688, Sysmon, auditd, macOS unified logs), and Identity Provider/cloud sign-in and
  consent logs. It guides the analyst across several angles: correlating outbound connections against
  high-confidence threat intelligence; detecting credential-harvesting HTTP POSTs to new or low-reputation
  domains; flagging high-risk file downloads; spotting browser processes spawning interpreters (cmd, powershell,
  wscript, mshta, osascript) within seconds of an outbound click; correlating inbound email URLs with
  recipient clicks; and surfacing lexically suspicious domains (DGA entropy, homoglyphs, typosquats) with
  NXDOMAIN failure-state spikes. Each angle is pursued with symbolic-logic rules, statistical baselining/rarity/forecasting,
  and machine-learning classifiers run in parallel so the analyst can corroborate a suspected spearphishing-link
  compromise across email, network, endpoint, and identity telemetry.'
