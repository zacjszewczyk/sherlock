  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Web proxy servers, network taps at internet gateways, user workstations and servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "cred = /(user|pass|login|password|pin|ssn|cc_number|email)/i\nfor r in http.log where method==POST:\n\
      \    if external(r.host) and not allowlisted(r.host) and (domain_age(r.host)<90d or low_rep(r.host)):\n\
      \        if cred.search(r.uri) or cred.search(r.post_body_fields):\n            if prophiler_landing_suspicious(r.referrer):\
      \ boost()\n            alert(host=r.host, src=r.id.orig_h, fields=matched)"
- question: '[Initial Access] Entropy, host-rarity, volume, and HTTP failure-state scoring: Can you determine
