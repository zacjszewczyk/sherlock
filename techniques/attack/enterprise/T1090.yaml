name: 'T1090: Proxy'
id: e5284621-923d-4fa6-ab6b-ed267cd5ea98
description: 'Investigate potential use of connection proxies, port redirectors, tunnels, and domain-fronting
  infrastructure used to relay or disguise command-and-control (C2) traffic (MITRE ATT&CK T1090). This
  playbook helps an analyst determine whether an adversary is bridging traffic through intermediaries
  to hide their true C2 endpoint, ride trusted communication paths, or chain multiple proxies. It covers:
  outbound connections to threat-intel proxy/Tor/VPN/C2 infrastructure; execution of known proxy and tunneling
  tools (plink, ngrok, chisel, ligolo-ng, socat, ncat, ssh -R/-L/-D); network connections from non-allowlisted
  or user-writable-path processes; port/protocol mismatches and Zeek ''weird'' protocol violations; anomalous
  TLS client fingerprints (JA3/JA4+); long asymmetric or low-throughput heartbeat connections and periodic
  beaconing cadence; proxy/pivot hub-and-spoke topologies; and CDN domain fronting where the TLS SNI differs
  from the inner HTTP Host header. Methods span deterministic symbolic-logic rules, statistical baselining/anomaly
  detection, and machine-learning classifiers across Windows, Linux/auditd, macOS, ESXi, network devices,
  and Zeek/NSM network telemetry.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command And Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any internal host establish an outbound connection to an IP address or domain that appears
    on a threat-intelligence feed categorized as a proxy, Tor node, known C2 server, or unsanctioned commercial
    VPN?
  context: Adversaries route C2 through proxies, anonymizers (Tor), or commercial VPNs to hide their true
    infrastructure. Join Zeek dns.log to conn.log on the connection UID and alert when conn.log.id.resp_h
    or dns.log.query matches a feed entry tagged 'Proxy','Tor','C2', or 'Unsanctioned VPN'. Enrich with
    destination-rarity/prevalence and passive-DNS features (TTL behavior, lexical structure) per EXPOSURE.
    This is a first-party rule on internal Zeek logs; the intel join is an enrichment, not a mandatory
    live lookup. A positive result is a strong lead pointing at a C2 relay; a negative result does not
    rule out novel infrastructure absent from feeds.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress/Internet Gateway, Corporate DNS Resolvers, Web Proxy Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Zeek conn.log + dns.log\nconn = load conn.log; dns = load dns.log\njoined = join(dns, conn,\
      \ on=uid)\nalert where intel_category(conn.id_resp_h) in {Proxy,Tor,C2,UnsanctionedVPN}\n   OR intel_category(dns.query)\
      \ in {Proxy,Tor,C2,UnsanctionedVPN}\nenrich with passive_dns_rarity(conn.id_resp_h)"
- question: Is any internal host generating an abnormal burst of NXDOMAIN responses, failed/blocked outbound
    connections, or TLS handshake failures consistent with a resilient proxy/C2 client retrying against
    rotating infrastructure?
  context: Resilient proxy and C2 clients aggressively retry against rotating or fast-flux infrastructure,
    producing distinctive failure bursts. Per internal host, count NXDOMAIN responses, failed/blocked
    outbound connections (conn.log conn_state S0/REJ/RSTO), and TLS handshake failures over rolling 1-hour
    and 24-hour windows. Alert when a host's failure rate to rare external endpoints exceeds its 30-day
    baseline by more than 3 standard deviations. A spike concentrated on rare endpoints is suspicious;
    benign causes (misconfigured app, dead service) should be excluded by checking destination prevalence.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress/Internet Gateway, Corporate DNS Resolvers, Web Proxy Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Per host failure-rate baseline (Stats)\nmetrics = count(conn_state in {S0,REJ,RSTO}) +\
      \ count(dns_rcode==NXDOMAIN) + count(tls_handshake_fail)\n         by src_ip, window(1h), window(24h)\n\
      base = mean_std(metrics over last 30d by src_ip)\nalert where metrics > base.mean + 3*base.std AND\
      \ dest_is_rare(dst)"
- question: Are internal hosts successfully connecting to externally resolved domains that are extremely
    rare both in query frequency and in the number of distinct internal hosts that resolve them?
  context: Proxy/C2 domains are typically used by few hosts and queried infrequently, unlike popular legitimate
    services. For externally resolved domains in dns.log, compute query frequency and the count of unique
    internal hosts over a rolling 30-day window and derive per-environment percentile cutoffs. Alert on
    successful connections to domains in the bottom 5th percentile for both metrics that are absent from
    a known-good low-volume allowlist; rank by prevalence and dynamism per EXPOSURE. Low-and-slow rare
    lookups are a classic stealthy C2 footprint.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress/Internet Gateway, Corporate DNS Resolvers, Web Proxy Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Rare domain detection (Stats)\nby domain over 30d: q_freq=count(queries), host_card=distinct(src_ip)\n\
      cut_freq=pctl(q_freq,5); cut_host=pctl(host_card,5)\nalert where q_freq<=cut_freq AND host_card<=cut_host\n\
      \      AND domain not in lowvol_allowlist AND had_successful_conn(domain)"
- question: Does a supervised domain classifier flag any newly observed dns.log domain as a high-confidence
    proxy/malicious domain based on lexical and passive-DNS features?
  context: Newly registered or algorithmically generated proxy domains share statistical traits (length,
    TLD, subdomain count, character entropy, TTL volatility, resolution dynamism, first-seen age). Train
    a Random Forest / Gradient Boosting classifier on labeled domains per EXPOSURE and score unseen dns.log
    domains; alert when malicious-confidence > 0.9 and surface the top-3 contributing features in the
    alert text. This ML layer sits above - not replacing - the deterministic threat-intel and rarity rules
    to catch infrastructure not yet on feeds.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress/Internet Gateway, Corporate DNS Resolvers, Web Proxy Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Domain classifier (ML)

      features = [length,tld,subdomain_count,char_entropy,ttl_behavior,first_seen_age,resolution_dynamism]

      model = RandomForest/GradientBoosting trained on labeled domains

      score = model.predict_proba(domain.features)

      alert where score.malicious > 0.9 ; emit top3_features(score)'
- question: Was a known proxy or tunneling tool executed, or a process launched with command-line arguments
    indicating port forwarding, reverse tunnels, or SOCKS proxying?
  context: Direct execution of proxy tooling is the highest-fidelity host signal for T1090. Scan process
    creation events (Windows Event ID 4688 / Sysmon 1 / auditd execve) for proxy-tool filenames (plink.exe,
    ngrok.exe, chisel.exe, ligolo-ng.exe, socat, ncat) in NewProcessName, and regex the CommandLine for
    tunneling flags and keywords (\s-([RLD])\b, reverse, tunnel, socks, -proxy). Alert on any match. Preserve
    this deterministic floor; tool-name and flag lists are the highest-fidelity proxy signal. Validate
    against any sanctioned admin use of SSH tunneling.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Domain Controllers (for centralized logging)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Proxy tool / tunnel flag detection (Rule)\nproc = events(EID 4688 OR Sysmon 1 OR auditd\
      \ execve)\nalert where lower(NewProcessName) in {plink.exe,ngrok.exe,chisel.exe,ligolo-ng.exe,socat,ncat}\n\
      \   OR CommandLine =~ /\\s-([RLD])\\b/ OR CommandLine =~ /(reverse|tunnel|socks|-proxy)/i"
- question: Are there process command lines that are extremely rare across the enterprise and contain
    numeric arguments resembling ports or IP addresses?
  context: Proxy/relay invocations often produce near-unique command lines embedding host:port targets.
    Compute enterprise-wide prevalence (percentage of hosts) for each unique CommandLine and alert when
    prevalence < 0.1% AND the command line contains numeric arguments resembling ports or IPs. Derive
    the prevalence cutoff from your own fleet size. Rare command lines with embedded network endpoints
    are worth triage even when the binary name is benign or renamed.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Domain Controllers (for centralized logging)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Rare command-line + port/IP literals (Stats)\nprev = (#hosts with CommandLine) / total_hosts\n\
      alert where prev < 0.001\n   AND CommandLine =~ /(:\\d{2,5}\\b|\\b\\d{1,3}(\\.\\d{1,3}){3}\\b)/"
- question: Does an unsupervised anomaly model flag any process command line as highly unusual relative
    to a learned baseline of normal command-line activity?
  context: Renamed or novel proxy binaries evade name signatures, but their argument structure is still
    anomalous. Vectorize 4688/Sysmon command lines with TF-IDF and train an Isolation Forest on a baseline
    period; alert on high anomaly scores and report the top-3 tokens/features driving the score (e.g.,
    presence of '-R', high-port literal, rare image path) so analysts can triage. Run in parallel with
    the deterministic signatures to add recall for unknown tooling.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Domain Controllers (for centralized logging)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Command-line anomaly (ML)

      X = tfidf(CommandLine tokens)

      model = IsolationForest.fit(baseline_period)

      score = model.anomaly_score(X)

      alert where score > threshold ; emit top3_tokens(score)'
- question: Did any process that is NOT on the allowlist of network-aware applications - or any process
    running from a user-writable, non-standard path - open an outbound connection to a public (non-RFC1918)
    IP address?
  context: Legitimate external connections come from a known set of applications; proxy implants frequently
    run from user-writable paths and are not network-aware by design. Correlate Sysmon Event ID 3 / Windows
    5156 network connections with the initiating process. Maintain an explicit allowlist of image paths
    permitted to make external connections; alert when any process not on the list (or executing from
    C:\Users\*\AppData\, C:\PerfLogs\, C:\Windows\Tasks\) opens an outbound connection to a non-RFC1918
    IP. This is a first-party endpoint+host rule with a hard deterministic floor.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint Detection and Response (EDR) Systems, Critical Servers, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Process allowlist vs outbound conn (Rule)\nconn = events(Sysmon 3 OR EID 5156, direction=outbound)\n\
      alert where dest_ip not in RFC1918\n   AND (proc.image_path not in net_allowlist\n        OR proc.image_path\
      \ =~ /\\\\Users\\\\[^\\\\]+\\\\AppData\\\\|\\\\PerfLogs\\\\|\\\\Windows\\\\Tasks\\\\/i)"
- question: Is a normally-quiet process generating a burst of blocked or failed outbound connection attempts,
    suggesting a proxy/relay binary probing rotating endpoints?
  context: Relay binaries probe rotating infrastructure, generating retry/failure bursts that precede
    successful beaconing. Per process image, baseline the rate of blocked/failed outbound connections
    (5156 with deny action, conn.log S0/REJ) and alert when a normally-quiet process generates a burst
    of failed external connections. BAYWATCH treats such retry behavior as a beaconing precursor. Correlate
    with the rare-domain and beacon-cadence questions to confirm.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint Detection and Response (EDR) Systems, Critical Servers, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Per-process blocked-conn baseline (Stats)

      fails = count(5156 deny OR conn_state in {S0,REJ}) by proc.image, window(1h)

      base = mean_std(fails over 30d by proc.image)

      alert where fails > base.mean + 3*base.std AND base.mean ~ low'
- question: Is a network-connected process executing in an unusual context - an unexpected parent process,
    image path, or user account - relative to its historical norm?
  context: Proxy tooling masquerading as a known process name often runs from the wrong path, under the
    wrong user, or spawned by an unexpected parent. For each process name build a baseline of normal parent
    process, image path, and user context, then compute a rarity score for each new connection over that
    3-tuple. Alert when the score exceeds the 99th percentile (tune per environment), indicating an unusual
    execution context for a network-connected process.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint Detection and Response (EDR) Systems, Critical Servers, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Process-network context rarity (Stats)

      key = (proc_name, parent_proc, image_path, user)

      rarity = 1 - prevalence(key | proc_name) over baseline

      alert where rarity > pctl(rarity, 99) AND made_external_conn'
- question: Does a one-class model of legitimate process-network behavior flag any connection event as
    falling outside the learned normal boundary?
  context: Novel proxy binaries lack signatures but deviate from the manifold of normal process-network
    behavior. Train a one-class SVM on legitimate process-network behavior using image-path entropy, parent
    process, user context (SYSTEM vs. standard), destination IP reputation, and destination port. Alert
    when an event falls outside the learned boundary and emit the top-3 deviating features in the alert.
    Keep the allowlist rule authoritative; ML adds recall for novel binaries.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint Detection and Response (EDR) Systems, Critical Servers, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '// One-class SVM boundary (ML)

      feats = [image_path_entropy,parent_proc,user_ctx,dest_ip_reputation,dest_port]

      model = OneClassSVM.fit(legit_process_network_events)

      alert where model.predict(feats) == outlier ; emit top3_deviating(feats)'
- question: Is traffic on a standard port being identified by the network sensor as a different protocol
    than expected, or is a Zeek 'weird' notice indicating a protocol violation on a well-known port?
  context: 'Adversaries tunnel C2 over standard ports (53/80/443) to blend in, producing port/protocol
    mismatches. Build a SIEM rule on Zeek conn.log: alert if (id.resp_p==53 AND service!=''dns'') OR (id.resp_p==443
    AND service!=''ssl'') OR (id.resp_p==80 AND service!=''http''). Raise high severity on weird.log names
    matching ''non_dns_traffic_on_dns_port'' or ''possible_split_routing''. This is a deterministic protocol-violation
    floor on first-party Zeek data.'
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network Taps/Spanning Ports feeding Zeek sensors, Internet Gateway, DMZ Network Segment'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Port/protocol mismatch (Rule)\nalert on conn.log where\n    (id_resp_p==53  AND service!='dns')\n\
      \ OR (id_resp_p==443 AND service!='ssl')\n OR (id_resp_p==80  AND service!='http')\nhigh_sev on\
      \ weird.log.name in {non_dns_traffic_on_dns_port, possible_split_routing}"
- question: Does the payload entropy of traffic on a normally-plaintext port (80/53) indicate encryption
    or compression, suggesting a covert encrypted tunnel?
  context: An encrypted tunnel riding a plaintext port shows high payload entropy where low entropy is
    expected. Sample the first 1KB of payload for TCP connections on ports 80/443/53, compute Shannon
    entropy, and baseline per port. Alert when entropy exceeds the per-port mean by more than 3 standard
    deviations or is >7.0-7.2 where plaintext is expected, indicating an encrypted tunnel on a plaintext
    port (Lyda & Hamrock). Port 443 is expected to be high-entropy; the strong signal is high entropy
    on 80/53.
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network Taps/Spanning Ports feeding Zeek sensors, Internet Gateway, DMZ Network Segment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Payload entropy per port (Stats)

      e = shannon_entropy(first_1KB(payload)) by conn on ports {80,53,443}

      base = mean_std(e over baseline by port)

      alert where (port in {80,53}) AND (e > 7.0 OR e > base.mean + 3*base.std)'
- question: Does a port-agnostic protocol classifier predict a true application protocol that disagrees
    with the destination port actually in use?
  context: Flow shape reveals the real protocol regardless of port. Train a multi-class classifier (LightGBM)
    on port-agnostic conn.log features (duration, packet count, inter-arrival statistics, payload-size
    distribution) to predict the true application protocol per Koumar et al. (69 single-flow temporal
    features). Alert when the predicted protocol mismatches id.resp_p and list the top-3 features driving
    the prediction. This catches tunneling even when Zeek's service field is unset.
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network Taps/Spanning Ports feeding Zeek sensors, Internet Gateway, DMZ Network Segment'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Protocol classification (ML)

      feats = single_flow_temporal_features(conn)  // duration, pkts, IAT stats, size dist

      pred = LightGBM.predict(feats)

      alert where pred != expected_proto(id_resp_p) ; emit top3_features(pred)'
- question: Do any TLS handshakes produce JA3/JA4+ client fingerprints that match known proxy/implant
    stacks (e.g., meek, Cobalt Strike) or are extremely rare across the enterprise?
  context: TLS client fingerprints identify the implant stack independent of destination IP or SNI, defeating
    domain fronting and TLS 1.3 SNI encryption. Compute JA3/JA3S and version-resilient JA4+ fingerprints
    from ssl.log handshakes. Alert when a fingerprint matches known proxy/implant stacks or appears on
    fewer than N hosts enterprise-wide (rarity). A rare or known-bad fingerprint is a high-value lead
    even without other indicators.
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network Taps/Spanning Ports feeding Zeek sensors, Internet Gateway, DMZ Network Segment'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// TLS client fingerprint (Rule)\nfp = ja3(ssl_handshake) ; fp4 = ja4plus(ssl_handshake)\n\
      alert where fp in known_bad_fingerprints (meek, CobaltStrike)\n   OR host_count(fp) < N (enterprise-wide\
      \ rarity)"
- question: Are there long-duration, low-throughput 'heartbeat' connections, or connections with a highly
    asymmetric byte ratio on a browsing port, that resemble a persistent proxy/C2 channel?
  context: Proxy/C2 channels often persist for hours with periodic low-volume keep-alives, or push far
    more data outbound than inbound on browsing ports. Alert on conn.log TCP connections where duration
    > 12 hours, history contains keep-alive ('^'), and orig_bytes + resp_bytes < 10MB (long low-throughput
    heartbeat). Also alert when orig_bytes > 10x resp_bytes on a browsing port (volume asymmetry). Exclude
    known-good persistent services; retain these concrete thresholds as the deterministic floor.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network Egress/Internet Gateway, Internal Network Core Switches, Server-to-Server Traffic Segments'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Long heartbeat / asymmetric conn (Rule)\nalert on conn.log TCP where\n   (duration > 12h\
      \ AND history contains '^' AND orig_bytes+resp_bytes < 10MB)\n   OR (id_resp_p in {80,443,8080}\
      \ AND orig_bytes > 10*resp_bytes)\nexclude known_persistent_services"
- question: Does any new connection's outbound/inbound byte ratio deviate sharply from the historical
    norm for that source host?
  context: Per-host byte-ratio baselines catch exfiltration-style proxy channels that differ from a host's
    normal traffic mix. Every 15 minutes compute orig_bytes/resp_bytes per connection; per internal source
    IP maintain a 7-day mean/standard deviation. Alert when a new connection's ratio exceeds the host's
    historical mean by more than 3 standard deviations, deriving thresholds per host role (a server differs
    from a workstation).
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network Egress/Internet Gateway, Internal Network Core Switches, Server-to-Server Traffic Segments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Per-host byte-ratio baseline (Stats)

      ratio = orig_bytes / max(resp_bytes,1)

      base = mean_std(ratio over 7d by src_ip)

      alert where ratio > base.mean + 3*base.std'
- question: Is any source/destination pair communicating with a regular periodic cadence (low-jitter beaconing)
    characteristic of automated proxy/C2 callbacks?
  context: Beaconing is the frequency dimension of proxy C2. Per (src,dst) pair, collect connection start
    times and apply FFT/autocorrelation to find the dominant period and compute the coefficient of variation
    of inter-arrival times and byte sizes; alert on low-dispersion periodic callbacks after whitelist
    suppression of benign updaters/NTP (BAYWATCH; RITA). Low coefficient of variation across many intervals
    strongly indicates automation rather than human activity.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network Egress/Internet Gateway, Internal Network Core Switches, Server-to-Server Traffic Segments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Beacon cadence (Stats)

      by (src,dst): times=sorted(conn_start); iat=diff(times)

      period = dominant_period(FFT/autocorr(times))

      cv = std(iat)/mean(iat)

      alert where cv < 0.1 AND count(iat) >= 8 AND (src,dst) not in updater_allowlist'
- question: When clustering connections by duration and byte volumes, do any small dense outlier clusters
    stand apart from the benign web/email mass, or does a jitter-robust timing model flag periodic callbacks?
  context: Unsupervised clustering isolates proxy/C2 flows that share unusual duration/volume profiles
    distinct from normal traffic. Cluster conn.log with DBSCAN on log(duration), log(orig_bytes+1), log(resp_bytes+1),
    and orig/resp ratio; investigate small dense outlier clusters versus the benign web/email mass. For
    state-based, jitter-robust cadence detection use a Continuous-Time HMM over inter-event timing (NetSpectra
    CT-HMM). Surface the top-3 features (ratio, period, duration) per alert.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network Egress/Internet Gateway, Internal Network Core Switches, Server-to-Server Traffic Segments'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '// DBSCAN outlier clusters + CT-HMM (ML)

      X = [log(duration),log(orig_bytes+1),log(resp_bytes+1),orig/resp]

      clusters = DBSCAN(X)

      investigate small dense clusters far from web/email mass

      cadence = CT_HMM(inter_event_times) ; emit top3_features'
- question: Does the host-interaction graph reveal hub-and-spoke or relay nodes that bridge many internal
    hosts to a few external endpoints - the structural signature of proxy chaining and pivots?
  context: 'Internal pivots/proxies create a distinctive graph topology: a node bridging many internal
    sources to few external destinations. Build a host-interaction graph from conn.log and apply a graph
    neural network to flag hub-and-spoke/relay nodes (GNN-MTC). Report the bridging node and its top contributing
    edges so analysts can confirm whether an internal host has been turned into a relay.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network Egress/Internet Gateway, Internal Network Core Switches, Server-to-Server Traffic Segments'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Proxy/pivot graph topology (ML)

      G = build_graph(conn.log: nodes=hosts, edges=flows)

      scores = GNN.score_nodes(G)

      alert on nodes bridging many_internal -> few_external (hub-and-spoke)

      report bridging_node, top_edges'
- question: Does any TLS connection show a CDN domain in the SNI that differs from the HTTP Host header
    inside the same connection - the canonical signal of domain fronting?
  context: Domain fronting hides the true destination behind a benign CDN SNI while the inner HTTP Host
    targets attacker infrastructure. Join ssl.log and http.log on uid; alert when ssl.log.server_name
    != http.log.host AND ssl.log.server_name matches a known CDN list (*.cloudfront.net, *.azureedge.net,
    *.appspot.com, *.fastly.net, *.akamaihd.net). The SNI/Host mismatch is the canonical deterministic
    domain-fronting signal (Fifield et al.).
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Web Proxies, Network Taps monitoring traffic to CDNs, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Domain fronting SNI/Host mismatch (Rule)\nj = join(ssl.log, http.log, on=uid)\nalert where\
      \ ssl.server_name != http.host\n   AND ssl.server_name matches {*.cloudfront.net,*.azureedge.net,*.appspot.com,*.fastly.net,*.akamaihd.net}"
- question: Within TLS sessions to a given CDN SNI, is any inner HTTP Host header never-before-seen or
    extremely rare compared to the historical set of hosts behind that CDN front?
  context: Even legitimate CDN traffic has a stable set of inner hosts; a rare inner host behind a common
    front suggests abuse. For each CDN ssl.log.server_name, baseline the set of http.log.host values seen
    within those TLS sessions and compute prevalence. Alert when a connection uses a never-before-seen
    Host header or one in the bottom 1st percentile of historical prevalence for that CDN SNI - a rare
    inner host behind a common front (Fifield et al.).
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Web Proxies, Network Taps monitoring traffic to CDNs, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
