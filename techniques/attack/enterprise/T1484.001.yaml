    indicates code execution and escalation being deployed via a freshly created Group Policy. In the
    Defense Impairment context, the concern is that the adversary is using Group Policy to degrade, disable,
    or blind security controls and monitoring so their activity cannot be seen or trusted. This supports
    the information requirement: "Has the adversary modified Group Policy for privilege escalation?" (tactic:
    Defense Impairment). Source method: Symbolic Logic: Correlate GPO creation (Event ID 5137) with subsequent
    scheduled-task (4698) or service creation (7045) on endpoints; alert when the task/service runs as
    NT AUTHORITY\SYSTEM and the binary/path is non-standard (%APPDATA%, %TEMP%, \Users\Public, UNC). New-GPOImmediateTask
    delivers exactly this task-via-GPO pattern per [Abusing GPO Permissions](https://blog.harmj0y.net/redteaming/abusing-gpo-permissions/);
    reconstruct the GPO→task causal chain as in [R-CAID: Embedding Root Cause Analysis within Provenance-based
    Intrusion Detection](https://gangw.cs.illinois.edu/rcaid-sp24.pdf).'
