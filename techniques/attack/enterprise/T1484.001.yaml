    off, wevtutil.exe cl/sl, sc.exe config ... start= disabled, Set-MpPreference -Disable*, auditpol /set
    ... /success:disable. GPO-delivered scripts execute as SYSTEM per [Abusing GPO Permissions](https://blog.harmj0y.net/redteaming/abusing-gpo-permissions/);
    record command exit State to separate executed from failed/blocked.'
