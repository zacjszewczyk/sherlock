    control. This supports the information requirement: "Has the adversary modified Group Policy for privilege
    escalation?" (tactic: Privilege Escalation). Source method: Statistical Method: Build a per-environment
    frequency table of command-line tokens/utilities spawned by GPO scripts over ≥30 days and flag commands
    in the bottom 1st percentile or never observed; use mean±k·σ envelopes on per-host child-process counts
    to catch volume spikes as in [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
    Report the observed count vs. baseline mean in the alert.'
  answer_sources:
