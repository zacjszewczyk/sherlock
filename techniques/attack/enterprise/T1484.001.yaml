name: 'T1484.001: Domain or Tenant Policy Modification: Group Policy Modification'
id: 97147daa-dd29-4d7b-8d04-cd1dbe974bd1
description: 'Investigate whether an adversary has modified Active Directory Group Policy Objects (GPOs)
  to escalate privilege on the domain or to impair defensive controls. Group Policy centrally manages
  user and computer settings; GPOs are stored both as directory objects (groupPolicyContainer) on Domain
  Controllers and as files under the SYSVOL share (\\<DOMAIN>\SYSVOL\<DOMAIN>\Policies\{GUID}\). This
  playbook helps an analyst hunt for: malicious writes to SYSVOL policy files (payloads, ScheduledTasks.xml,
  registry.pol, GptTmpl.inf); dangerous DACL changes (WriteDacl/WriteOwner/GenericAll/GenericWrite) granted
  to non-admin principals on GPO objects; GPO-delivered immediate tasks/services and gpscript/gpupdate
  child processes that add local administrators or grant sensitive user rights such as SeEnableDelegationPrivilege;
  GPO edits that disable Defender, the firewall, UAC, auditing, or LSA protection; and the resulting suppression
  of security telemetry. It combines symbolic-logic detections, statistical baselining/rarity scoring,
  and machine-learning anomaly models across Windows Security and Sysmon event logs and SIEM telemetry
  to surface privilege-escalation and defense-impairment abuse of Group Policy.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
- tactic_id: TA0004
  tactic_name: Privilege Escalation
