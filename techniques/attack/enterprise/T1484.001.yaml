questions:
- question: Are files being created or modified within a SYSVOL Group Policy directory (\\<DOMAIN>\SYSVOL\<DOMAIN>\Policies\{GUID}\)
    whose SHA256 matches a known-bad threat-intel feed, or that are executable/script types that should
    never live under Policies?
  context: 'Monitor file write events (Windows Event ID 4663/5145) where the ObjectName resolves to a
    SYSVOL policy path, compute the SHA256 of each written file and query a threat-intel feed. ALWAYS
    alert when the written file is an executable or script type (.exe/.dll/.ps1/.bat) regardless of any
    feed match, because attacker tradecraft drops payloads or a ScheduledTasks.xml here to push code domain-wide.
    Record the State (write success vs. ACCESS_DENIED) so that even blocked writes are kept as a distinct
    signal. A positive result is a strong indicator of GPO abuse; the file type alone is suspicious because
    legitimate GPO content is configuration data, not binaries. In the Defense Impairment context, the
    concern is that the adversary is using Group Policy to degrade, disable, or blind security controls
    and monitoring so their activity cannot be seen or trusted. This supports the information requirement:
    "Has the adversary modified Group Policy for privilege escalation?" (tactic: Defense Impairment).
    Source method: Symbolic Logic: Monitor file write events (Windows Event ID 4663/5145) where ObjectName
    contains a SYSVOL policy path (\\<DOMAIN>\SYSVOL\<DOMAIN>\Policies\{GUID}\). Compute SHA256 of each
    written file, query a threat-intel feed, and ALWAYS alert when the written file is an executable/script
    type that should never appear under Policies (e.g., .exe/.dll/.ps1/.bat) regardless of feed match
    — attacker tradecraft writes payloads or ScheduledTasks.xml here per [Abusing GPO Permissions](https://blog.harmj0y.net/redteaming/abusing-gpo-permissions/).
    Record State (write success vs. ACCESS_DENIED) so blocked writes are kept as a distinct signal.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - 'NAI: Domain Controller SYSVOL Share (\\<DOMAIN>\SYSVOL\<DOMAIN>\Policies\*\)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EVENT WHERE EventID IN (4663,5145) AND ObjectName MATCHES ''*\\SYSVOL\\*\\Policies\\*''

      | COMPUTE sha256 = HASH(ObjectName)

      | LOOKUP ti_feed ON sha256 AS bad

      | WHERE bad == true OR FileExt IN (''.exe'',''.dll'',''.ps1'',''.bat'',''.vbs'',''.scr'')

      | KEEP State (SUCCESS|ACCESS_DENIED)

      | ALERT ''Suspicious file written to SYSVOL Policies'''
- question: Do any SYSVOL policy file writes have anomalously high Shannon entropy or anomalously large
    size relative to a per-file-type baseline, suggesting packed or obfuscated payloads hidden in GPO
    storage?
  context: 'For each SYSVOL file write (Event ID 4663) track the file size (Volume) and Shannon entropy
    and score both against a per-file-type baseline using the robust median/MAD modified Z-score (flag
    |z|>3.5) rather than mean/percentile, because legitimate GPO edits are bursty and would inflate a
    mean-based threshold. High-entropy or anomalously large files indicate packed/obfuscated payloads
    being staged in SYSVOL. Report the baseline median and the observed value in the alert so the analyst
    can judge the deviation. In the Defense Impairment context, the concern is that the adversary is using
    Group Policy to degrade, disable, or blind security controls and monitoring so their activity cannot
    be seen or trusted. This supports the information requirement: "Has the adversary modified Group Policy
    for privilege escalation?" (tactic: Defense Impairment). Source method: Statistical Method: For each
    SYSVOL file write (Event ID 4663) track Volume (file size in bytes) and Shannon entropy, and score
    both against a per-file-type baseline using the robust median/MAD modified Z-score (flag |z|>3.5)
    rather than mean/percentile, since legitimate GPO edits are bursty — see [Modified Z-Score for Anomaly
    Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly). Alert on
    high-entropy or anomalously large files (packed/obfuscated payloads) and report the baseline median
    and observed value in the alert.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - 'NAI: Domain Controller SYSVOL Share (\\<DOMAIN>\SYSVOL\<DOMAIN>\Policies\*\)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'EVENT WHERE EventID==4663 AND ObjectName MATCHES ''*\\SYSVOL\\*\\Policies\\*''

      | STATS median(entropy), MAD(entropy), median(size), MAD(size) BY FileExt

      | EVAL z_ent=0.6745*(entropy-median_ent)/MAD_ent, z_sz=0.6745*(size-median_sz)/MAD_sz

      | WHERE abs(z_ent)>3.5 OR abs(z_sz)>3.5

      | ALERT with baseline_median, observed_value'
- question: When scored by a one-class model trained on legitimate SYSVOL files (extension, entropy, size,
    magic bytes, string n-grams), do any new writes fall outside the learned normal distribution?
  context: 'Train a one-class model (Isolation Forest / One-Class SVM) on features of legitimate SYSVOL
    files and flag writes scored as outliers. Surface the top-3 contributing features (e.g., ''magic=MZ'',
    ''entropy=7.9'', ''unexpected .exe'') via LIME-style attribution so the analyst understands why a
    file was flagged. This catches novel payloads that evade hash and entropy rules. A positive result
    means a file structurally unlike normal GPO content was written to SYSVOL. In the Defense Impairment
    context, the concern is that the adversary is using Group Policy to degrade, disable, or blind security
    controls and monitoring so their activity cannot be seen or trusted. This supports the information
    requirement: "Has the adversary modified Group Policy for privilege escalation?" (tactic: Defense
    Impairment). Source method: Machine Learning: Train a one-class model (Isolation Forest / One-Class
    SVM) on features of legitimate SYSVOL files (extension, entropy, size, magic bytes, string n-grams)
    and flag writes scored as outliers, surfacing the top-3 contributing features (e.g., ''magic=MZ'',
    ''entropy=7.9'', ''unexpected .exe'') in the alert text via LIME-style attribution as in [Robust IoT
    Security Using Isolation Forest and One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - 'NAI: Domain Controller SYSVOL Share (\\<DOMAIN>\SYSVOL\<DOMAIN>\Policies\*\)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "MODEL one_class(IsolationForest|OneClassSVM)\n  FEATURES [extension, entropy, size, magic_bytes,\
      \ string_ngrams]\n  TRAIN ON legit_sysvol_files\n| SCORE new_write\n| WHERE outlier_score > threshold\n\
      | EXPLAIN top3_features (LIME)\n| ALERT"
- question: Are processes whose parent is gpscript.exe or gpupdate.exe running command lines that add
    a user to a privileged local group or otherwise escalate privilege (net localgroup administrators
    /add, New-LocalUser, Add-LocalGroupMember, sc.exe create)?
  context: 'Monitor Windows Event ID 4688 / Sysmon Event ID 1 for processes whose parent is gpscript.exe
    or gpupdate.exe and alert when the command line contains privilege-escalation patterns. GPO-delivered
    immediate tasks run such commands as SYSTEM at policy refresh, so a local-admin add launched from
    a GPO script is a classic escalation path. Capture process exit/State to distinguish executed vs.
    failed commands. A positive result indicates a GPO is being used to plant privileged accounts on endpoints.
    In the Defense Impairment context, the concern is that the adversary is using Group Policy to degrade,
    disable, or blind security controls and monitoring so their activity cannot be seen or trusted. This
    supports the information requirement: "Has the adversary modified Group Policy for privilege escalation?"
    (tactic: Defense Impairment). Source method: Symbolic Logic: Monitor Windows Event ID 4688 / Sysmon
    Event ID 1 for processes whose parent is gpscript.exe or gpupdate.exe and alert if the command line
    contains privilege-escalation patterns (net localgroup administrators /add, net1 localgroup, sc.exe
    create, New-LocalUser, Add-LocalGroupMember). GPO-delivered immediate tasks run such commands as SYSTEM
    at policy refresh per [Abusing GPO Permissions](https://blog.harmj0y.net/redteaming/abusing-gpo-permissions/).
    Capture process exit/State to distinguish executed vs. failed commands.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Domain-joined Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EVENT WHERE EventID IN (4688,1) AND ParentImage IN (''gpscript.exe'',''gpupdate.exe'')

      | WHERE CommandLine MATCHES ANY(''net* localgroup administrators*/add'',''net1 localgroup*'',''sc.exe
      create*'',''New-LocalUser*'',''Add-LocalGroupMember*'')

      | KEEP ExitCode/State

      | ALERT ''GPO script privilege escalation command'''
- question: Which command-line tokens or utilities spawned by GPO scripts are statistically rare (bottom
    1st percentile or never observed) over the trailing 30+ days, or show a per-host child-process volume
    spike?
  context: 'Build a per-environment frequency table of command-line tokens/utilities spawned by GPO scripts
    over at least 30 days and flag commands in the bottom 1st percentile or never observed. Apply a mean±k·σ
    envelope on per-host child-process counts to catch volume spikes. Rare utilities executed by GPO scripts
    often represent attacker tooling pushed through Group Policy. Report the observed count vs. baseline
    mean in the alert. In the Defense Impairment context, the concern is that the adversary is using Group
    Policy to degrade, disable, or blind security controls and monitoring so their activity cannot be
    seen or trusted. This supports the information requirement: "Has the adversary modified Group Policy
    for privilege escalation?" (tactic: Defense Impairment). Source method: Statistical Method: Build
    a per-environment frequency table of command-line tokens/utilities spawned by GPO scripts over ≥30
    days and flag commands in the bottom 1st percentile or never observed; use mean±k·σ envelopes on per-host
    child-process counts to catch volume spikes as in [Finding Anomalies in Windows Event Logs Using Standard
    Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf). Report the observed
    count vs. baseline mean in the alert.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Domain-joined Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'EVENT WHERE EventID IN (4688,1) AND ParentImage IN (''gpscript.exe'',''gpupdate.exe'')

      | STATS count BY utility_token OVER last 30d

      | EVAL pct = percentile_rank(count)

      | WHERE pct < 1 OR count == 0(new)

      | JOIN host_child_counts WHERE count > mean + 3*stdev

      | ALERT observed vs baseline_mean'
- question: When GPO-spawned command lines are scored by a gradient-boosted classifier using character/entropy/keyword
    features, which ones score as likely privilege-escalation or obfuscated commands?
  context: 'Score GPO-spawned command lines with a gradient-boosted classifier using interpretable character/entropy/keyword
    features and surface the top-3 feature contributions (e.g., ''keyword=localgroup'', ''special-char
    ratio'', ''longest-token'') in the alert. This detects obfuscated or novel escalation commands that
    signature rules miss. A high score with escalation-oriented features indicates GPO-delivered privilege
    abuse. In the Defense Impairment context, the concern is that the adversary is using Group Policy
    to degrade, disable, or blind security controls and monitoring so their activity cannot be seen or
    trusted. This supports the information requirement: "Has the adversary modified Group Policy for privilege
    escalation?" (tactic: Defense Impairment). Source method: Machine Learning: Score GPO-spawned command
    lines with a gradient-boosted classifier using interpretable character/entropy/keyword features and
    surface the top-3 feature contributions (e.g., ''keyword=localgroup'', ''special-char ratio'', ''longest-token'')
    in the alert, following [Obfuscated Command Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Domain-joined Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "MODEL gbdt_cmdline_classifier\n  FEATURES [char_dist, entropy, keyword_flags, token_lengths,\
      \ special_char_ratio]\n| SCORE cmdlines WHERE ParentImage IN ('gpscript.exe','gpupdate.exe')\n|\
      \ WHERE p_malicious > threshold\n| EXPLAIN top3_features\n| ALERT"
- question: Has the nTSecurityDescriptor of any groupPolicyContainer object (Event ID 5136) been changed
    to grant WriteDacl, WriteOwner, GenericWrite, or GenericAll to a subject that is not on the GPO-admin
    allow-list?
  context: 'Monitor Windows Event ID 5136 for groupPolicyContainer objects and parse nTSecurityDescriptor
    changes; ALWAYS alert when WriteDacl/WriteOwner/GenericWrite/GenericAll is granted to any subject
    not on the GPO-admin allow-list. This is the exact misconfiguration abused for domain escalation —
    once a low-privileged principal can edit a GPO, they can push code or rights to every linked host.
    Treat the grant (success State) and the granting subject as the key fields. In the Defense Impairment
    context, the concern is that the adversary is using Group Policy to degrade, disable, or blind security
    controls and monitoring so their activity cannot be seen or trusted. This supports the information
    requirement: "Has the adversary modified Group Policy for privilege escalation?" (tactic: Defense
    Impairment). Source method: Symbolic Logic: Monitor Windows Event ID 5136 for groupPolicyContainer
    objects and parse nTSecurityDescriptor changes; ALWAYS alert when WriteDacl/WriteOwner/GenericWrite/GenericAll
    is granted to any subject not on the GPO-admin allow-list, the exact misconfiguration abused for domain
    escalation in [Abusing GPO Permissions](https://blog.harmj0y.net/redteaming/abusing-gpo-permissions/).
    Treat the grant (success State) and the granting subject as the key fields.'
  answer_sources:
  - Windows Event ID 5136
  - 'NAI: Active Directory Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EVENT WHERE EventID==5136 AND ObjectClass=='groupPolicyContainer' AND AttributeLDAPDisplayName=='nTSecurityDescriptor'\n\
      | PARSE SDDL FOR granted_rights, grantee\n| WHERE granted_rights INTERSECTS ('WriteDacl','WriteOwner','GenericWrite','GenericAll')\n\
      \  AND grantee NOT IN gpo_admin_allowlist\n| ALERT grantee, rights, State"
- question: Considering historical (Subject, GPO) modification pairings, is the principal modifying this
    GPO one that rarely or never edits it (bottom-percentile rarity by modified Z-score)?
  context: 'Maintain a baseline of which subjects modify which GPOs and compute a rarity/frequency score
    for each (Subject, GPO) pair; flag pairs in the bottom percentile using the median/MAD modified Z-score
    (|z|>3.5) to resist bursty admin activity. A user editing a GPO they have never touched before is
    a strong anomaly worth review, particularly when paired with descriptor or rights changes. In the
    Defense Impairment context, the concern is that the adversary is using Group Policy to degrade, disable,
    or blind security controls and monitoring so their activity cannot be seen or trusted. This supports
    the information requirement: "Has the adversary modified Group Policy for privilege escalation?" (tactic:
    Defense Impairment). Source method: Statistical Method: Maintain a baseline of which subjects modify
    which GPOs and compute a rarity/frequency score for each (Subject, GPO) pair; flag pairs in the bottom
    percentile using the median/MAD modified Z-score (|z|>3.5) to resist bursty admin activity, as in
    [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    and the rarity-profiling approach of [An Unsupervised Multi-Detector Approach for Identifying Malicious
    Lateral Movement](https://mnoureddine.com/files/17BOH01.pdf).'
  answer_sources:
  - Windows Event ID 5136
  - 'NAI: Active Directory Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'EVENT WHERE EventID IN (5136,5137) AND ObjectClass==''groupPolicyContainer''

      | STATS count BY Subject, GPO OVER baseline

      | EVAL z = 0.6745*(count-median)/MAD

      | WHERE z < -3.5 OR count==0(new pair)

      | ALERT Subject, GPO, historical_count'
- question: When principals are clustered by their GPO-modification behavior (frequency, GPO count, descriptor
    edits, hour-of-day), does any standard user fall into the admin cluster or become an outlier?
  context: 'Cluster principals by GPO-modification behavior using PCA + k-means / MAD ensemble; alert
    when a standard user moves into the admin cluster or becomes an outlier, listing the top-3 features
    driving the assignment. This catches a compromised or rogue account whose GPO activity suddenly resembles
    a domain administrator''s — a hallmark of escalation through Group Policy. In the Defense Impairment
    context, the concern is that the adversary is using Group Policy to degrade, disable, or blind security
    controls and monitoring so their activity cannot be seen or trusted. This supports the information
    requirement: "Has the adversary modified Group Policy for privilege escalation?" (tactic: Defense
    Impairment). Source method: Machine Learning: Cluster principals by GPO-modification behavior (frequency,
    GPO count, descriptor edits, hour) using PCA + k-means / MAD ensemble per [An Unsupervised Multi-Detector
    Approach for Identifying Malicious Lateral Movement](https://mnoureddine.com/files/17BOH01.pdf); alert
    when a standard user moves into the admin cluster or becomes an outlier, listing the top-3 features
    driving the assignment in the alert.'
  answer_sources:
  - Windows Event ID 5136
  - 'NAI: Active Directory Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "MODEL pca + kmeans(behavior_profiles)\n  FEATURES [mod_frequency, distinct_gpo_count, descriptor_edits,\
      \ hour_of_day]\n| ASSIGN cluster per principal\n| WHERE standard_user IN admin_cluster OR outlier_score\
      \ high\n| EXPLAIN top3_features\n| ALERT"
- question: Is a GPO modification (Event ID 5136) followed within ~2 hours by a user-rights assignment
    (Event ID 4704) and special-privilege logon (4672) that grants a watchlisted right (SeEnableDelegationPrivilege,
    SeTcbPrivilege, SeBackupPrivilege, SeDebugPrivilege) tied to that same GPO?
  context: 'Correlate the GPO modification with the subsequent rights assignment and special-privilege
    logon within a 2-hour window and alert when a watchlisted high-impact right is granted and the GPO
    matches the one modified. Build the causal modify→grant path and surface the originating actor. SeEnableDelegationPrivilege
    abuse in particular is a documented stealthy domain backdoor, since it lets the holder modify GPOs
    and seize the domain. In the Defense Impairment context, the concern is that the adversary is using
    Group Policy to degrade, disable, or blind security controls and monitoring so their activity cannot
    be seen or trusted. This supports the information requirement: "Has the adversary modified Group Policy
    for privilege escalation?" (tactic: Defense Impairment). Source method: Symbolic Logic: Correlate
    GPO modification (Event ID 5136) with subsequent user-rights assignment (Event ID 4704) and special-privilege
    logon (4672) within a 2-hour window; alert when a watchlisted right (SeEnableDelegationPrivilege,
    SeTcbPrivilege, SeBackupPrivilege, SeDebugPrivilege) is granted and the GPO matches the modified one.
    Build the causal modify→grant path and surface the originating actor as in [R-CAID: Embedding Root
    Cause Analysis within Provenance-based Intrusion Detection](https://gangw.cs.illinois.edu/rcaid-sp24.pdf);
    SeEnableDelegationPrivilege abuse is a documented stealthy backdoor in [Abusing GPO Permissions](https://blog.harmj0y.net/redteaming/abusing-gpo-permissions/).'
  answer_sources:
  - Windows Event ID 5136
  - Windows Event ID 4704
  - Windows Event ID 4672
  - 'NAI: Active Directory Domain Controllers, All Domain-joined Endpoints and Servers'
  range: Last 90 days; correlate within a 2-hour window of the triggering GPO change.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EVENT a WHERE EventID==5136 AND ObjectClass=='groupPolicyContainer'\n| JOIN EVENT b WHERE\
      \ EventID==4704 WITHIN 2h\n| JOIN EVENT c WHERE EventID==4672 WITHIN 2h\n| WHERE b.right IN ('SeEnableDelegationPrivilege','SeTcbPrivilege','SeBackupPrivilege','SeDebugPrivilege')\n\
      \  AND b.gpo == a.gpo\n| ALERT modify->grant chain, actor"
- question: Is a sensitive user right being assigned by a GPO not authorized to grant it, or is the count
    of endpoints receiving the right from one GPO exceeding mean+3σ?
  context: 'Baseline which GPOs are authorized to assign each sensitive right and the count of endpoints
    normally receiving it; alert on an unauthorized GPO granting a sensitive right, or when the endpoint
    count from one GPO exceeds mean+3σ. A sudden fan-out of a sensitive privilege across many hosts indicates
    a malicious GPO pushing escalation domain-wide. Report observed vs. expected endpoint count. In the
    Defense Impairment context, the concern is that the adversary is using Group Policy to degrade, disable,
    or blind security controls and monitoring so their activity cannot be seen or trusted. This supports
    the information requirement: "Has the adversary modified Group Policy for privilege escalation?" (tactic:
    Defense Impairment). Source method: Statistical Method: Baseline which GPOs are authorized to assign
    each sensitive right and the count of endpoints normally receiving it; alert on an unauthorized GPO
    granting a sensitive right, or when the endpoint count from one GPO exceeds mean+3σ per the standard-deviation
    envelope of [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
    Report observed vs. expected endpoint count.'
  answer_sources:
  - Windows Event ID 5136
  - Windows Event ID 4704
  - Windows Event ID 4672
  - 'NAI: Active Directory Domain Controllers, All Domain-joined Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'EVENT WHERE EventID==4704

      | STATS dcount(host) AS endpoints BY GPO, right

      | EVAL expected = mean_endpoints, sigma = stdev_endpoints

      | WHERE GPO NOT IN authorized_for[right] OR endpoints > expected + 3*sigma

      | ALERT observed vs expected'
- question: Does the per-window count of sensitive privilege assignments (Event ID 4704) exceed the forecast
    prediction interval of a seasonal/change-point model, especially coincident with a 5136 GPO change?
  context: 'Forecast the expected per-window count of sensitive privilege assignments with a seasonal
    time-series/change-point model and flag observations beyond the prediction interval, especially when
    coincident with a 5136 GPO change. Use CUSUM/Bayesian online change-point detection. A spike in privilege
    grants right after a GPO edit is a strong escalation signal that simple thresholds may miss because
    of normal seasonality. In the Defense Impairment context, the concern is that the adversary is using
    Group Policy to degrade, disable, or blind security controls and monitoring so their activity cannot
    be seen or trusted. This supports the information requirement: "Has the adversary modified Group Policy
    for privilege escalation?" (tactic: Defense Impairment). Source method: Machine Learning: Forecast
    the expected per-window count of sensitive privilege assignments (4704) with a seasonal time-series/change-point
    model and flag observations beyond the prediction interval, especially when coincident with a 5136
    GPO change; use CUSUM/Bayesian online change-point detection from [A Survey of Methods for Time Series
    Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/) and validate on enterprise
    telemetry such as [Comprehensive, Multi-Source Cyber-Security Events (LANL)](https://csr.lanl.gov/data/cyber1/).'
  answer_sources:
  - Windows Event ID 5136
  - Windows Event ID 4704
  - Windows Event ID 4672
  - 'NAI: Active Directory Domain Controllers, All Domain-joined Endpoints and Servers'
  range: Last 90 days; for correlation center on a 2-hour window around each GPO modification (Event ID
    5136/5137).
  queries:
  - technology: SIEM/ML pseudocode
    query: "SERIES count_4704 BY window\n| MODEL seasonal_forecast + CUSUM/BOCPD\n| WHERE observed > upper_prediction_interval\n\
      \  AND exists(5136 GPO change in same window)\n| ALERT changepoint, observed vs forecast"
- question: Is a new GPO (Event ID 5137) followed by creation of a scheduled task (Event ID 4698) or service
    (Event ID 7045) that runs as NT AUTHORITY\SYSTEM from a non-standard path (%APPDATA%, %TEMP%, \Users\Public,
    UNC)?
  context: 'Correlate GPO creation with subsequent scheduled-task or service creation on endpoints and
