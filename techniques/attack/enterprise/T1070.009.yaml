      \ = {creator_proc_tree, creator_account, type}\n  for each persistence CREATE (Run/RunOnce key,\
      \ Startup item, service, task,\n    account, cron/systemd unit, LaunchAgent/Daemon, rc.local entry,\
      \ binary/plist/script)\nON delete/disable event:\n  Win 4657 (registry value delete), 4699/141 (task\
