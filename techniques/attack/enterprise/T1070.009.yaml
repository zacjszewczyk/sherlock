name: 'T1070.009: Indicator Removal: Clear Persistence'
id: 782f9c11-2421-4151-9446-1bbd10065873
description: 'This playbook helps an analyst determine whether an adversary is clearing persistence artifacts
  (T1070.009) to remove evidence of a previously established foothold on a host. It guides the investigation
  of deletion, disablement, or alteration of persistence mechanisms across Windows, Linux, macOS, and
  ESXi: Run/RunOnce registry keys, Startup items, Windows services, scheduled tasks, user accounts, cron
  and systemd units, macOS LaunchAgents/LaunchDaemons, rc.local entries, and the associated binaries,
  plists, and scripts. Investigative angles include: matching removal events to the persistence artifacts
  and creator process trees that originally established them (creator==remover causal linkage); profiling
  failed/denied deletion attempts (access-denied, EPERM/EACCES, non-zero exit codes) that betray trial-and-error
  cleanup; detecting deletion commands issued through native utilities (schtasks.exe, sc.exe, reg.exe,
  crontab, systemctl, launchctl, rm, sed); correlating multi-mechanism deletions within a single logon
  session or process tree over a short window; and surfacing high-risk artifacts that are created, used
  for suspicious activity (C2 connections, unsigned binaries), and rapidly deleted within their first
  72 hours. Detection blends symbolic-logic rules, statistical baselining (k-sigma counts, change-point
  detection, Time-To-Deletion percentiles), and machine learning (provenance-graph GNNs, command-line
  embeddings, density clustering) to produce evasion-resistant, explainable alerts for the Stealth tactic.'
type: technique
