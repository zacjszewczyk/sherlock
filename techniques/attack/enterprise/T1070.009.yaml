questions:
- question: 'Using a symbolic logic approach, can you determine whether ''Match removal events to known
    persistence artifacts'' reveals an adversary clearing persistence artifacts (T1070.009)? Specifically:
    Maintain a state table of every observed persistence artifact (Run/RunOnce key, Startup item, service,
    scheduled task, account, cron/systemd unit, LaunchAgent/Daemon, rc.local entry, binary/plist/script
    path) keyed by the process tree and account that created it, then alert when a delete/disable event
    (Windows 4657 registry value delete, 4699/141 task delete, 7034/7036 service stop/delete, 4726 account
    delete, Sysmon 23/26 file delete; auditd unlink/userdel; macOS unifiedlog rm of LaunchAgents) targets
    a tracked artifact — prioritizing cases where the same process tree or account that created the artifact
    also removes it. This creator-remover causal linkage is the deterministic core demonstrated by whole-system
    provenance correlation in [KAIROS](https://tfjmp.org/publications/2024-sp.pdf) and by the native delete-event
    rules in [SigmaHQ](https://github.com/SigmaHQ/sigma) and the [Sysmon Community Guide file-delete chapter](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/file-delete.md).'
  context: 'Tactic context (Stealth / TA0005): the adversary is trying to hide and conceal their actions
    by retiring footholds they no longer need, so the removal of a persistence artifact is itself the
    malicious signal. Evidence under investigation: A file, registry value, scheduled-task artifact, service
    artifact, or user account associated with previously identified persistence is deleted, disabled,
    or altered to remove traceable footholds after the adversary no longer needs them, leaving behind
    a previously established access path that has now been deliberately retired. Approach (Match removal
    events to known persistence artifacts): Maintain a state table of every observed persistence artifact
    (Run/RunOnce key, Startup item, service, scheduled task, account, cron/systemd unit, LaunchAgent/Daemon,
    rc.local entry, binary/plist/script path) keyed by the process tree and account that created it, then
    alert when a delete/disable event (Windows 4657 registry value delete, 4699/141 task delete, 7034/7036
    service stop/delete, 4726 account delete, Sysmon 23/26 file delete; auditd unlink/userdel; macOS unifiedlog
    rm of LaunchAgents) targets a tracked artifact — prioritizing cases where the same process tree or
    account that created the artifact also removes it. This creator-remover causal linkage is the deterministic
    core demonstrated by whole-system provenance correlation in [KAIROS](https://tfjmp.org/publications/2024-sp.pdf)
    and by the native delete-event rules in [SigmaHQ](https://github.com/SigmaHQ/sigma) and the [Sysmon
    Community Guide file-delete chapter](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/file-delete.md).
    A positive result means a persistence mechanism was deliberately removed, disabled, or altered in
    a way that matches adversary cleanup (e.g., the same process/account that created an artifact also
    deletes it, an abnormal burst of removals, a denied-then-successful delete sequence, or a short-lived
    foothold tied to suspicious activity); a negative result means the removal fits expected administrative
    or maintenance baselines. Investigate the named area of interest (Domain Controllers, Critical Application
    Servers, Standard User Endpoints) and pivot from any hit to the artifact''s full lifecycle — who created
    it, what it executed or connected to, and what other footholds the same session touched.'
