- question: 'Using a statistical method approach, can you determine whether ''Measure abnormal persistence
    cleanup volume'' reveals an adversary clearing persistence artifacts (T1070.009)? Specifically: Per
    host role and administrative group, baseline the count and byte volume of persistence-artifact removals
    (Run keys, Startup, services, tasks, accounts, cron/systemd/LaunchAgents) per session and per hour,
    then alert when a session removes artifacts at a rate above the role''s 99th percentile or applies
    a change-point shift in the count series — using k-sigma deviation of event-ID counts per [Dwyer and
    Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf) and CUSUM/PELT/Bayesian
    change-point detection from [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).
    Derive thresholds from 30–60 days of per-role history and re-fit weekly.'
