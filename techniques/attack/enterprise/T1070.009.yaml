    or `sed` and the command line specifies deletion/disable (`/delete`, `delete`, `crontab -r`, `disable`,
    removal of `~/Library/LaunchAgents/*`, `/etc/systemd/system/*.service`, or rc.local edits). Escalate
    when the parent process is atypical (e.g., not `mmc.exe`/`services.msc`-driven admin) or the initiating
    account is non-administrative, per the persistence-removal rule patterns in [SigmaHQ](https://github.com/SigmaHQ/sigma)
    and the commands enumerated in [MITRE ATT&CK T1070.009](https://attack.mitre.org/techniques/T1070/009/).'
