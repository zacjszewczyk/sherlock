- question: 'Using a symbolic logic approach, can you determine whether ''Detect deletion commands from
    persistence utilities'' reveals an adversary clearing persistence artifacts (T1070.009)? Specifically:
    Create a SIEM rule on process creation (Windows 4688 / Sysmon 1, plus auditd execve and macOS unifiedlog)
