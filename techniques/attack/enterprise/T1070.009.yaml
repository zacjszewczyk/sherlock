      \ auditd unlink/userdel;\n  macOS unifiedlog rm of LaunchAgents\nWHERE target_object IN state\n\
      ALERT, prioritizing creator_proc_tree == remover_proc_tree\n       OR creator_account == remover_account\n\
      // KAIROS provenance correlation; SigmaHQ + Sysmon Community Guide delete rules"
- question: 'Using a symbolic logic approach, can you determine whether ''Profile failed and denied removal
    attempts'' reveals an adversary clearing persistence artifacts (T1070.009)? Specifically: Treat failed/denied
    removals as a distinct signal: alert on Windows 4663 access-denied handle requests with DELETE access
    to service/task/Run-key/binary objects, auditd unlink/rename returning EACCES/EPERM, and `sc delete`/`schtasks
    /delete` processes exiting non-zero. A burst of denied delete attempts followed by a privilege change
    and a successful delete is a strong cleanup indicator, and isolating these failure modes prevents
    them from being lost in success-only baselines as recommended for explainable provenance rules in
    [CAPTAIN](https://arxiv.org/html/2404.14720v2).'
  context: 'Tactic context (Stealth / TA0005): the adversary is trying to hide and conceal their actions
