      expected.
- question: Does a sequence model flag anomalous startup/logon task-creation event sequences involving
    unusual path rarity, run-as, or image signer?
  context: 'Sequence models capture the typical event ordering around persistence registration. Train
    on normal task-creation/registry/process event streams and flag anomalous startup/logon task sequences,
    surfacing the top-3 features (path rarity, run-as principal, image signer) in the alert. An anomalous
    persistence sequence - for instance an unsigned binary registered as a logon task by an unexpected
    account - is a strong lead; routine recurring registrations match the learned model. Sources: [DeepLog](https://acmccs.github.io/papers/p1285-duA.pdf),
    [LogBERT](https://arxiv.org/pdf/2103.04475).'
