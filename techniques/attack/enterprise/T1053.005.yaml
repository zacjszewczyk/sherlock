- question: Is a user creating a scheduled task with a run-as security context they have never used before
    or one in the rarest band for that account?
  context: 'Per-user baselining of run-as contexts catches anomalous privilege use. Build a baseline of
    the run-as contexts and task security principals each user employs, tracking Frequency (privileged
    task creations per account) and State (launch success). Alert when a user creates a task with a context
    never seen for them or in the rarest band, deriving thresholds per environment over 30-90 days. A
    user suddenly registering tasks as SYSTEM when they historically use only their own context is a strong
    escalation signal; established admin patterns are normal. Sources: [Red Canary Scheduled Task & Job](https://redcanary.com/threat-detection-report/techniques/scheduled-task-job/),
    [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
