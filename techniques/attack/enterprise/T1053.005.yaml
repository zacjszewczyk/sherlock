- question: Did a non-administrative user create or update a scheduled task configured to run as SYSTEM,
    Local Service, Network Service, or another privileged account?
  context: 'A privilege jump is evident when the task''s creator lacks the privileges the task runs with.
    Alert when a non-administrative user creates or updates a task (Event ID 4698/4702) that runs as SYSTEM,
    Local Service, Network Service, or another privileged principal, and correlate the task definition
    with the executed process and Event ID 4672 (special privileges assigned) to confirm the elevation.
    A standard user spawning SYSTEM-level execution via a task is a direct privilege-escalation indicator;
    administrators legitimately creating privileged tasks are the benign case to filter. Sources: [Red
    Canary Scheduled Task & Job](https://redcanary.com/threat-detection-report/techniques/scheduled-task-job/),
    [SigmaHQ scheduled-task creation rule](https://detection.fyi/sigmahq/sigma/windows/builtin/security/win_security_scheduled_task_creation/).'
