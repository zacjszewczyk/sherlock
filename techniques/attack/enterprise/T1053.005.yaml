- question: Does a user's activity sequence leading to scheduled-task creation (process launches, file
    changes, network activity) terminate in a high-privilege task inconsistent with their historical workflow?
  context: 'Sequence/provenance modeling links the lead-up behavior to the escalation outcome. Train a
    model on user activity leading to scheduled-task creation - process launches, file changes, network
    activity - and alert when the sequence ends in a high-privilege task inconsistent with the user''s
    historical workflow, emitting an explainable subgraph and the top-3 contributing features. An anomalous
    chain culminating in a SYSTEM-level task points to deliberate escalation; sequences matching the user''s
    normal admin routine are benign. Sources: [DeepLog](https://acmccs.github.io/papers/p1285-duA.pdf),
    [KAIROS](https://tfjmp.org/publications/2024-sp.pdf), [Sometimes Simpler is Better](https://www.usenix.org/system/files/usenixsecurity25-bilot.pdf).'
