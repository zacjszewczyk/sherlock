- question: Has the Security Descriptor (SD) value been deleted under HKLM\SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\Schedule\TaskCache\Tree\<task>, hiding a scheduled task from schtasks and the Task
    Scheduler GUI?
  context: 'The Tarrask technique hides a task by deleting its SD registry value so it no longer appears
    in schtasks output or the GUI while still executing. Alert when Sysmon Event ID 13 shows deletion
    of the SD value under the TaskCache\Tree\<task> path. Prioritize tasks that vanish from schtasks output
    while remaining present in the registry. SD-value deletion under TaskCache is rarely legitimate and
    is a high-confidence defense-evasion/persistence indicator. Sources: [Microsoft Tarrask](https://www.microsoft.com/en-us/security/blog/2022/04/12/tarrask-malware-uses-scheduled-tasks-for-defense-evasion/).'
  answer_sources:
  - Sysmon Event ID 13 (RegistryValue Set)
  - Windows Event ID 4698
  - Windows Event ID 4702
  - Sysmon Event ID 1 (Process Creation)
  - Direct Registry Inspection (e.g., via PowerShell or forensics tools)
  - 'NAI: All Windows endpoints and servers, as this is a specific stealth technique.'
  range: Last 90 days, with event-centered correlation within ~10 minutes of task creation/execution.
  queries:
  - technology: SIEM/Rule pseudocode
    query: reg = events(Sysmon=13) where target_object matches /\\Schedule\\TaskCache\\Tree\\.*\\SD$/
      and event_type='DeleteValue'; alert immediately; enrich with creating user/process; output task_path,
      host, user.
- question: Comparing TaskCache Tree registry entries to schtasks /query output on a cadence, which hosts
    have tasks present in the registry but absent from enumeration (hidden tasks)?
  context: 'Hidden tasks are best found by comparing two views of the same data. On a regular cadence,
    enumerate TaskCache Tree entries and compare them to schtasks /query /xml output. Flag hosts where
    the count of hidden tasks (registry-present but enumeration-absent) is non-zero or trending upward,
    scoring tasks hidden longest as higher risk. Any positive delta indicates a deliberately concealed
    task and warrants immediate investigation; a clean diff means enumeration matches the registry. Sources:
    [Microsoft Tarrask](https://www.microsoft.com/en-us/security/blog/2022/04/12/tarrask-malware-uses-scheduled-tasks-for-defense-evasion/).'
  answer_sources:
  - Sysmon Event ID 13 (RegistryValue Set)
  - Windows Event ID 4698
  - Windows Event ID 4702
