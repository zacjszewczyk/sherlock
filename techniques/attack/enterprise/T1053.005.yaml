      host baseline; output task, failure_types, count.
- question: When ranking task-creation -> process -> file/network causal paths by rarity, which are the
    rarest for each host and therefore candidate one-shot executions?
  context: 'Provenance-style path scoring surfaces unusual causal chains rather than single events. Extract
    the task-creation -> process -> file/network causal path for each task and score its rarity using
    IDF-style path weighting plus Local Outlier Factor. The rarest paths on a host - for example a never-before-seen
    task spawning an unusual process that writes a file and reaches new infrastructure - are strong candidates
    for one-shot adversary execution. Common, frequently observed paths receive low scores and can be
    deprioritized. Sources: [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4702
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 11 (File Creation)
  - Sysmon Event ID 13 (RegistryValue Set)
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - Cloud provider audit logs (e.g., Azure Activity Logs, AWS CloudTrail)
  - 'NAI: All Windows workstations and servers, particularly internet-facing systems, domain controllers,
    and general user endpoints where initial execution might occur.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: paths = build_chain(task_create -> process -> file|network) per host; weight = idf(path_segment);
      score = LOF(path_features); rank desc; surface top-N rarest paths with full chain for triage.
- question: Does a sequence model trained on normal Windows/Sysmon event-key streams flag a low-probability
    task-creation -> rare process -> external egress -> deletion sequence?
  context: 'Sequence models learn the normal ordering of task-related events and detect anomalous progressions.
    Train an LSTM or Transformer on normal event-key streams (e.g., 4698, Sysmon 1, Sysmon 3, 4699) and
    flag low-probability sequences that move from task creation to a rare process execution to external
    egress to deletion - the classic masked one-shot pattern. The model should output the top-3 contributing
    features (rare image path, encoded command, first-seen destination) so analysts can quickly judge
    the alert. A high reconstruction/anomaly score on this chain indicates likely adversary execution;
    common sequences are scored as normal. Sources: [DeepLog](https://acmccs.github.io/papers/p1285-duA.pdf),
    [LogBERT](https://arxiv.org/pdf/2103.04475).'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4702
  - Sysmon Event ID 1 (Process Creation)
