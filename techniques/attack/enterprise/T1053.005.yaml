- question: Are binaries launched by persistent (startup/logon) tasks scoring as suspicious based on signature
    status, entropy, import-table shape, and string content?
  context: 'The binary a persistence task runs is itself classifiable. Score binaries launched by persistent
    tasks with a model considering signature status, entropy, import-table shape, and string content,
    escalating unsigned or newly introduced high-scoring binaries. Pair with provenance-graph scoring
    of the surrounding subgraph for context. An unsigned, high-entropy binary newly registered to auto-run
    is a strong persistence indicator; signed, well-known executables score low. Sources: [MAGIC](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf),
    [FLASH](https://dartlab.org/assets/pdf/flash.pdf).'
