      on image=task_action_path; exclude known_good; output task, trigger, image, user.
- question: Are scheduled tasks being created through WMI or PowerShell (PS_ScheduledTask, Invoke-CimMethod,
    Register-ScheduledTask) instead of schtasks.exe?
  context: 'Adversaries increasingly create tasks through WMI/PowerShell to evade rules that watch schtasks.exe.
    Monitor WMI activity via Sysmon Event ID 19/20/21 and PowerShell script blocks (Event ID 4104, and
    4103 module logging) for task creation through PS_ScheduledTask, Invoke-CimMethod, or Register-ScheduledTask.
    Task definitions written via WMI/PowerShell rather than the standard command-line utility are an evasion
    signal worth investigating, especially on servers where automation may not be expected. Sanctioned
    configuration-management tooling that uses these APIs is the main benign explanation to rule out.
    Sources: [Red Canary Scheduled Task & Job](https://redcanary.com/threat-detection-report/techniques/scheduled-task-job/).'
