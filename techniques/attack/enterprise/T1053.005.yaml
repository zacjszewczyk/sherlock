    query: 'baseline = stats over 30-90d by host of task_name,trigger,cmdline,image,dest; for new_task:
      score firstseen, freq_pctile(cmdline), entropy(cmdline|xml); alert when firstseen or freq < p01
      or entropy > p98; output task, score, contributing_feature.'
- question: Are newly created scheduled tasks producing a burst of failures - non-zero last-run result
    codes, failed process launches, access-denied file/registry operations, or refused outbound connections?
  context: 'Adversaries often fumble before succeeding, so failures are an early signal. Explicitly profile
    failure modes as distinct signals: non-zero task last-run result codes, failed launches by task-spawned
    images, access-denied file/registry operations, and blocked or connection-refused outbound attempts
    immediately after task execution. A cluster of failures originating from recently created tasks frequently
    precedes a successful payload run and warrants proactive triage; isolated, infrequent failures from
    established tasks are typically benign operational noise. Sources: [A Survey of Methods for Time Series
    Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
