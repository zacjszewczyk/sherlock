    query: proc = events(Sysmon=1) where parent in ['svchost.exe','taskeng.exe'] and image_path in ['C:\\Windows\\Temp','C:\\Users\\Public','%APPDATA%','%TEMP%'];
      fc = events(Sysmon=11) where dir=dirname(proc.image_path) and host=proc.host and abs(fc.ts-proc.ts)<30m;
      alert when join succeeds; output image, dir, file_create_ts.
- question: Which scheduled tasks are statistically rare for their host - first-seen names/triggers/commands,
    frequency below the 1st percentile, or command-line/XML entropy above the 98th percentile of the host
    baseline?
  context: 'Statistical baselining catches novel task behavior that signature rules miss. Build host-level
    baselines over 30-90 days for task names, triggers, command lines, executable paths, and destination
    domains/IPs, capturing Volume (new tasks per host/day), Frequency (task creations per minute per account),
    and State (launched-process exit status). Alert when a task is first-seen, falls below the 1st percentile
    of frequency, or its command-line/XML entropy exceeds the 98th percentile. High entropy and rarity
    together suggest obfuscated, adversary-introduced execution; long-established recurring tasks score
    as normal. Sources: [Red Canary Scheduled Task & Job](https://redcanary.com/threat-detection-report/techniques/scheduled-task-job/),
    [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
