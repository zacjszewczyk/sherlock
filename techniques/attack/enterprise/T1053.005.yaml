- question: Which startup/logon tasks use executable paths or parent directories that are in the 1st percentile
    of enterprise frequency or that abruptly differ from the creator's historical pattern?
  context: 'Enterprise-wide baselining reveals persistence in unusual locations. Baseline executable paths
    and parent directories used by startup/logon tasks across the environment, tracking Volume (new persistent
    tasks per host) and State (launch success/failure) over 30-90 days. Alert when a new persistent task
    uses a path in the 1st percentile of frequency or when its path/run-as abruptly changes from the creator''s
    history. Rare paths and sudden run-as changes indicate adversary-introduced persistence; widely deployed
    software paths score as common and safe. Sources: [Red Canary Scheduled Task & Job](https://redcanary.com/threat-detection-report/techniques/scheduled-task-job/),
    [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
