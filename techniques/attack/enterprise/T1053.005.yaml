  - 'NAI: All Windows workstations and servers, particularly internet-facing systems, domain controllers,
    and general user endpoints where initial execution might occur.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model = LSTM/Transformer trained on event_key_streams [4698,Sysmon1,Sysmon3,4699]; score new
      sequences; alert when seq_prob < threshold and contains create->rare_proc->egress->delete; output
      top3_features.
- question: Does provenance-graph scoring of a task and its descendant nodes/edges flag an anomalous subgraph
    worth triaging?
  context: 'Provenance-graph learning evaluates the whole behavioral subgraph a task produces rather than
    isolated events. Apply graph-based anomaly scoring (e.g., KAIROS/ThreaTrace-style) to the nodes and
    edges created by a scheduled task and its descendant processes, files, and connections, emitting an
    explainable subgraph for triage. Favor interpretable, lightweight models where cost and explainability
    matter. A highly anomalous subgraph rooted at a task creation points to adversary-driven execution;
    subgraphs resembling known-good activity are low risk. Sources: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf),
    [ThreaTrace](https://arxiv.org/pdf/2111.04333), [Sometimes Simpler is Better](https://www.usenix.org/system/files/usenixsecurity25-bilot.pdf).'
  answer_sources:
