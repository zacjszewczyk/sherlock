- question: Are there abrupt spikes in hourly counts of new startup or logon task creations that deviate
    from the forecasted baseline outside maintenance windows?
  context: 'A sudden increase in persistence registrations can indicate mass deployment of a foothold.
    Apply change-point/time-series anomaly detection (CUSUM or likelihood-ratio) to hourly counts of new
    startup or logon tasks, excluding patching and administrative maintenance windows. Alert when the
    observed rate materially exceeds the forecast. A spike aligned with other suspicious activity suggests
    coordinated persistence; spikes during scheduled patch cycles are expected and should be filtered.
    Sources: [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
