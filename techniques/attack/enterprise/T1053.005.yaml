questions:
- question: Are there scheduled tasks that are created and then deleted or updated within a very short
    window (about 10 minutes or less), with the launched process spawned by svchost.exe or taskeng.exe
    showing an unusual child process?
  context: 'One-shot execution is a hallmark of adversaries who use the Task Scheduler to run a payload
    once and then erase the persistent artifact to avoid detection. Correlate Windows Event ID 4698 (task
    created) with 4699 (task deleted) or 4702 (task updated) sharing the same task name, task path, or
    Task GUID inside a tight window, then pivot to Windows Event ID 4688 or Sysmon Event ID 1 to confirm
    the launched image and parent chain. A genuine create-run-delete cycle where svchost.exe or taskeng.exe
    spawns an unexpected child (e.g., powershell.exe, cmd.exe, rundll32.exe) strongly suggests masked
    execution under a trusted process; a benign result is an administrative task that persists or recurs
    normally. Sources: [Proofpoint Serpent](https://www.proofpoint.com/us/blog/threat-insight/serpent-no-swiping-new-backdoor-targets-french-entities-unique-attack-chain),
    [Red Canary Scheduled Task & Job](https://redcanary.com/threat-detection-report/techniques/scheduled-task-job/).'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4702
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 11 (File Creation)
  - Sysmon Event ID 13 (RegistryValue Set)
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - Cloud provider audit logs (e.g., Azure Activity Logs, AWS CloudTrail)
  - 'NAI: All Windows workstations and servers, particularly internet-facing systems, domain controllers,
    and general user endpoints where initial execution might occur.'
  range: Last 90 days, with event-centered correlation within ~10 minutes of task creation/execution.
  queries:
  - technology: SIEM/Rule pseudocode
    query: created = events(EventID=4698); deleted = events(EventID in [4699,4702]); join on task_name|task_path|task_guid
      where deleted.ts - created.ts <= 10m; proc = events(EventID=4688 or Sysmon=1) where parent in ['svchost.exe','taskeng.exe']
      and host=created.host and ts ~ created.ts; alert with task, child_image, parent, timestamps.
- question: Do any scheduled task definitions, command lines, or arguments contain encoded PowerShell,
    remote download cradles, or LOLBin invocations, especially when they reference user-writable paths
    or binaries dropped just before execution?
  context: 'The action a task runs reveals its intent. Inspect task XML, command lines, and arguments
    for encoded PowerShell (-enc/-e/-EncodedCommand), download cradles (Invoke-WebRequest, certutil -urlcache,
    bitsadmin /transfer), and living-off-the-land binaries (rundll32, mshta, regsvr32). Tasks pointing
    to user-writable paths or to binaries created shortly before the task ran are high-confidence leads
    for execution tradecraft. Filter known-good task names and paths to control false positives; a positive
    result is a task whose payload retrieves or proxies code, while routine signed maintenance tasks are
    negative. Sources: [Red Canary Scheduled Task & Job](https://redcanary.com/threat-detection-report/techniques/scheduled-task-job/),
    [SigmaHQ scheduled-task creation rule](https://detection.fyi/sigmahq/sigma/windows/builtin/security/win_security_scheduled_task_creation/).'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4702
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 11 (File Creation)
  - Sysmon Event ID 13 (RegistryValue Set)
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - Cloud provider audit logs (e.g., Azure Activity Logs, AWS CloudTrail)
  - 'NAI: All Windows workstations and servers, particularly internet-facing systems, domain controllers,
    and general user endpoints where initial execution might occur.'
  range: Last 90 days, with event-centered correlation within ~10 minutes of task creation/execution.
  queries:
  - technology: SIEM/Rule pseudocode
    query: t = events(EventID in [4698,4702]); flag where task_command matches /(-enc|-e |-EncodedCommand|Invoke-WebRequest|certutil.*urlcache|bitsadmin|rundll32|mshta|regsvr32)/i
      or task_action_path in writable_dirs; enrich with Sysmon=11 file_create where path=task_action_path
      and ts < task.ts; exclude known_good_tasks; output task, command, path.
- question: Are scheduled tasks launching processes from non-standard, world-writable directories such
    as C:\Windows\Temp, C:\Users\Public, %APPDATA%, or %TEMP%, with a matching file-creation event in
    the same directory nearby?
  context: 'Legitimate scheduled tasks almost always execute trusted binaries from protected system or
    application directories. When a task launches a process from a world-writable location, it indicates
    an adversary staged a payload where any user can write. Alert when a task-spawned process image resides
    in C:\Windows\Temp, C:\Users\Public, %APPDATA%, or %TEMP%, and strengthen confidence by correlating
    with a nearby Sysmon Event ID 11 file-creation in the same directory. A drop-then-execute sequence
    from a writable path is a strong execution indicator; software installed to standard program directories
    is benign. Sources: [Red Canary Scheduled Task & Job](https://redcanary.com/threat-detection-report/techniques/scheduled-task-job/).'
