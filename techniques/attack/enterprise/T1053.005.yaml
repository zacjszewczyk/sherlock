- question: In a bipartite graph of users and task security contexts, are there rare or impossible edges
    such as a standard user repeatedly creating SYSTEM-level tasks?
  context: 'Graph modeling exposes user-to-privilege relationships that should not exist. Model users
    and task security contexts as a bipartite graph and flag rare or impossible edges - for example a
    standard user repeatedly creating SYSTEM-level tasks - prioritizing suspicious privilege-escalation
    paths and surfacing the contributing edge in the alert. A persistent improbable edge between an unprivileged
    user and a privileged context is a clear escalation lead; well-trodden admin-to-SYSTEM edges are expected.
    Sources: [ThreaTrace](https://arxiv.org/pdf/2111.04333), [PROGRAPHER](https://www.usenix.org/system/files/usenixsecurity23-yang-fan.pdf).'
