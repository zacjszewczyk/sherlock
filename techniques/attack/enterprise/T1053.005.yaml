- question: Are there abrupt increases in per-account counts of SYSTEM or otherwise privileged task creations
    outside maintenance windows, possibly preceded by access-denied registration failures?
  context: 'A burst of privileged task creation can indicate automated or scripted escalation. Apply change-point
    detection to per-account counts of SYSTEM/privileged task creations and flag abrupt increases outside
    maintenance windows, profiling access-denied task-registration failures as a distinct precursor signal.
    A spike in privileged registrations from a single account - especially after failed attempts - suggests
    escalation attempts; routine bursts during sanctioned maintenance are benign. Sources: [A Survey of
    Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
