name: 'T1053.005: Scheduled Task'
id: 7c6ae981-9521-4e33-a6f7-6e5627b30cc4
description: Investigate adversary abuse of the Windows Task Scheduler (schtasks.exe, the Task Scheduler
  GUI, the .NET wrapper, netapi32, WMI PS_ScheduledTask/Invoke-CimMethod, and Register-ScheduledTask)
  for execution, persistence, and privilege escalation. This playbook helps an analyst hunt for rapidly
  created-and-deleted (one-shot) tasks that mask execution under svchost.exe/taskeng.exe, tasks whose
  actions reference encoded PowerShell, download cradles, or LOLBins, tasks launching binaries from world-writable
  directories, startup/logon persistence tasks, tasks hidden by deleting the Security Descriptor (SD)
  registry value under TaskCache (Tarrask), and tasks created by non-administrative users yet configured
  to run as SYSTEM or other privileged principals. It combines symbolic-logic correlations across Windows
  Security, Sysmon, and PowerShell logs with statistical baselining/change-point detection and machine-learning
  sequence, provenance-graph, and clustering methods to surface defensible, granular leads for triage.
type: technique
