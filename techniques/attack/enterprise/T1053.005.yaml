    query: g = provenance_graph(root=task_create, descendants=process|file|network); anomaly = graph_score(g);
      alert when anomaly > threshold; emit explainable_subgraph for triage.
- question: Are scheduled tasks with At-startup or At-logon triggers pointing their action to user-writable
    directories like C:\Windows\Temp, C:\Users\Public, or a user's %APPDATA%?
  context: 'Persistence via Task Scheduler typically combines an automatic trigger with a payload in a
    writable location. Alert on Windows Event ID 4698 or 4702 when the task action references C:\Windows\Temp,
    C:\Users\Public, or a user %APPDATA% folder and the trigger is ''At startup'' or ''At log on''. Correlate
    with Event ID 4688 or Sysmon Event ID 1 to verify the launched image, filtering known-good tasks.
    A startup/logon task running an unsigned binary from a writable path is a strong persistence indicator;
    vendor software that registers startup tasks in protected paths is benign. Sources: [Red Canary Scheduled
    Task & Job](https://redcanary.com/threat-detection-report/techniques/scheduled-task-job/), [SigmaHQ
    scheduled-task creation rule](https://detection.fyi/sigmahq/sigma/windows/builtin/security/win_security_scheduled_task_creation/).'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4702
  - Sysmon Event ID 1 (Process Creation)
  - Windows PowerShell Event ID 4103
  - Windows Event ID 4104
  - Sysmon Event ID 19, 20, 21 (WMI Events)
  - 'NAI: Domain Controllers, critical application servers, and administrative workstations where persistence
