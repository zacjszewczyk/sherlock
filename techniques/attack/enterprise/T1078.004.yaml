    per-IP thresholds, surfacing the contributing source IPs/targeted accounts ([Cloud Time-Series IDS](https://link.springer.com/article/10.1186/s13677-023-00491-x);
    [Hunting Low and Slow Password Sprays, Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052)).
    This learned model scores behavior and surfaces the top contributing features: a high score warrants
    analyst review and correlation with adjacent telemetry, and model drift must be monitored as tenants
    and workloads evolve. Tie this finding back to Stealth (TA0005) when assessing impact and next steps.'
  answer_sources:
  - Windows Event ID 4625
  - 'NAI: Cloud authentication endpoints, On-premises federation servers (e.g., ADFS), VPN gateways'
  range: Last 30 days (per-minute granularity)
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      forecast per_minute failed_auth (Prophet/SARIMA)

