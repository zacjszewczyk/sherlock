name: 'T1078.004: Valid Accounts: Cloud Accounts'
id: eadbc94c-43e8-4b74-9d7e-8962ea19b7ed
description: >-
  Investigate potential abuse of valid cloud accounts (T1078.004) across Initial Access, Persistence,
  Privilege Escalation, and Stealth/Defense Evasion. This playbook helps an analyst hunt for compromised
  or misused cloud identities by examining authentication and IAM API telemetry from cloud providers (Azure
  AD/Entra sign-in logs, AWS CloudTrail, Azure Activity/Monitor audit logs, Google Cloud Audit Logs),
  SaaS/identity providers (Okta, M365), and supporting on-premises and network logs (Windows Event IDs
  4624/4625/104, Zeek conn.log). It surfaces sign-ins from malicious or rare infrastructure, impossible
  travel, brute-force and low-and-slow password spraying, offensive-tool and scripted user agents, reactivation
  of dormant or watchlisted credentials, creation of high-privilege programmatic credentials, federation/SSO
  trust changes, IAM privilege-escalation chains and risky policy modifications, first-time role assumptions,
  disabling of logging/monitoring services, overly broad network rules, destructive log tampering, and
  non-MFA privileged logins. Each question pairs deterministic rules, statistical baselining, and machine-learning
  scoring so an analyst can confirm whether an adversary obtained and abused cloud credentials, and determine
  the scope of access gained.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
- tactic_id: TA0001
  tactic_name: Initial Access
