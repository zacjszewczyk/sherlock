    count as a first-class State signal ([Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    This approach baselines normal behavior and flags statistical outliers: a positive result marks a
    deviation worth investigating, and thresholds should be tuned to suppress benign change such as approved
