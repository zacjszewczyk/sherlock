- question: Between consecutive authenticated sessions, does the implied travel velocity exceed a feasible
    threshold (e.g., >1000 km/h) after excluding known VPN egress and trusted networks?
  context: 'As part of investigating Stealth, where the adversary blends compromised cloud-account activity
    in with legitimate operations to avoid detection, A successful cloud authentication occurs from a
    geographic location that is physically impossible for the user to have traveled to, given the time
    and location of their previous authenticated session. Method (Symbolic Logic): Compute the implied
    velocity between consecutive authenticated geolocations (distance/elapsed time) and alert when it
    exceeds a feasible threshold (e.g., >1000 km/h), excluding known VPN egress/trusted networks; include
    both locations and the delta in the alert ([Impossible Travel Detection, Microsoft](https://patents.google.com/patent/WO2018085161A1/en)).
    This deterministic rule produces a definitive match: a positive result is a concrete, triage-ready
    event, while a negative result lowers (but does not eliminate) suspicion and should be corroborated
    with other signals. Tie this finding back to Stealth (TA0005) when assessing impact and next steps.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Cloud Identity and Access Management (IAM) Platforms, Geolocation IP Databases, Network Gateway
    Logs'
  range: Last 24 hours (centered on consecutive sign-in pairs)
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      order signins by user, ts

      | velocity = geodistance(prev_geo,cur_geo)/elapsed_hours

      | exclude known_vpn_egress, trusted_nets

      | alert if velocity>1000 km/h | emit both_locations, delta
  - technology: Zeek/pseudocode
    query: >-
      conn.log

      | lookup src=id.orig_h against enrichment(geoip, asn, ti_malicious_ip)

      | join cloud_auth on src_ip

      | surface ts, id.orig_h, id.resp_h, service, matched_context
