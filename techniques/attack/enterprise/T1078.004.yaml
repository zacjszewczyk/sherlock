  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      model per_role api_sequence (HMM/LSTM/graph)

      | score likelihood | flag low_probability

      | report top3 anomalous api_transitions
- question: Did any single source IP generate more than 20 failed logins in 5 minutes, or target more
    than 15 distinct accounts within 10 minutes (brute-force or password spray)?
  context: 'As part of investigating Stealth, where the adversary blends compromised cloud-account activity
    in with legitimate operations to avoid detection, A high volume of failed authentication events for
    a single cloud account (brute-force) or across multiple accounts with a limited set of passwords (password
    spraying) is observed from one or more source IP addresses. Method (Symbolic Logic): Alert when a
    single source IP generates >20 failed logins in 5 minutes or targets >15 distinct accounts within
    10 minutes, capturing both brute-force and password-spray patterns. This deterministic rule produces
    a definitive match: a positive result is a concrete, triage-ready event, while a negative result lowers
    (but does not eliminate) suspicion and should be corroborated with other signals. Tie this finding
    back to Stealth (TA0005) when assessing impact and next steps.'
  answer_sources:
  - Windows Event ID 4625
  - 'NAI: Cloud authentication endpoints, On-premises federation servers (e.g., ADFS), VPN gateways'
  range: Last 7 days (correlate within 5- and 10-minute windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      failed_auth (4625 / failed signin)

      | bin 5m by src_ip: count>20 -> brute_force

      | bin 10m by src_ip: dcount(account)>15 -> password_spray
