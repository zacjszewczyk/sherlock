questions:
- question: Do any cloud sign-ins or IAM API calls originate from source IPs that match threat-intelligence
    feeds of known malicious proxies, VPNs, or anonymizing services?
  context: 'As part of investigating Stealth, where the adversary blends compromised cloud-account activity
    in with legitimate operations to avoid detection, Successful cloud account use is reflected in sign-in
    records or API activity where the principal, source IP, device, or token context differs from the
    user or service''s normal baseline. The evidence often includes successful console or API logins from
    an unfamiliar country, a new device, an unexpected user agent, or a token/session that was issued
    after suspicious failures. Method (Symbolic Logic): Correlate cloud sign-in and API activity with
    Zeek conn.log source IPs and threat-intelligence feeds of malicious proxies, VPNs, and anonymizing
    services. Alert immediately on an exact match and include the tenant, principal, user agent, and session
    metadata so analysts can validate whether the login was legitimate or the start of cloud account abuse.
    This deterministic rule produces a definitive match: a positive result is a concrete, triage-ready
    event, while a negative result lowers (but does not eliminate) suspicion and should be corroborated
    with other signals. Tie this finding back to Stealth (TA0005) when assessing impact and next steps.'
  answer_sources:
  - Zeek conn.log
  - Azure AD Sign-In logs
  - AWS CloudTrail logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud provider IAM services (e.g., Azure AD, AWS IAM), Network Egress/Ingress Points (e.g.,
    Internet Gateway, VPN Concentrators), Threat Intelligence Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      join cloud_signin, cloud_api on src_ip

      | lookup ti_feed(malicious_proxy, vpn, anonymizer) by src_ip

      | where ti_match

      | emit tenant, principal, src_ip, user_agent, session_id, ti_source
  - technology: Zeek/pseudocode
    query: >-
      conn.log

      | lookup src=id.orig_h against enrichment(geoip, asn, ti_malicious_ip)

      | join cloud_auth on src_ip

      | surface ts, id.orig_h, id.resp_h, service, matched_context
- question: Are there successful logins or IAM API calls from a source country or ASN that is new or statistically
    rare for that identity or service principal?
  context: 'As part of investigating Stealth, where the adversary blends compromised cloud-account activity
    in with legitimate operations to avoid detection, Successful cloud account use is reflected in sign-in
    records or API activity where the principal, source IP, device, or token context differs from the
    user or service''s normal baseline. The evidence often includes successful console or API logins from
    an unfamiliar country, a new device, an unexpected user agent, or a token/session that was issued
    after suspicious failures. Method (Statistical Method): Build a 30-day per-identity/service-principal
    baseline of source country and ASN, then flag successful logins or IAM API calls from a country/ASN
    that is new or below the 1st prevalence percentile, scoring with median/MAD (modified Z-score >3.5)
    to resist batch skew ([Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)).
    Elevate when accompanied by MFA failure, device novelty, or impossible travel. This approach baselines
    normal behavior and flags statistical outliers: a positive result marks a deviation worth investigating,
    and thresholds should be tuned to suppress benign change such as approved automation or travel. Tie
    this finding back to Stealth (TA0005) when assessing impact and next steps.'
  answer_sources:
  - Zeek conn.log
  - Azure AD Sign-In logs
  - AWS CloudTrail logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud provider IAM services (e.g., Azure AD, AWS IAM), Network Egress/Ingress Points (e.g.,
    Internet Gateway, VPN Concentrators), Threat Intelligence Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      per identity baseline_30d(country, asn)

      | modified_z = 0.6745*(x-median)/MAD

      | flag if country/asn first_seen OR prevalence<1pct OR modified_z>3.5

      | escalate if mfa_failure OR new_device OR impossible_travel
  - technology: Zeek/pseudocode
    query: >-
      conn.log

      | lookup src=id.orig_h against enrichment(geoip, asn, ti_malicious_ip)

      | join cloud_auth on src_ip

      | surface ts, id.orig_h, id.resp_h, service, matched_context
- question: Does a trained classifier score any cloud sign-in or audit event as a high-probability account
    compromise based on geo, ASN, user agent, device, MFA result, and failure history?
  context: 'As part of investigating Stealth, where the adversary blends compromised cloud-account activity
    in with legitimate operations to avoid detection, Successful cloud account use is reflected in sign-in
    records or API activity where the principal, source IP, device, or token context differs from the
    user or service''s normal baseline. The evidence often includes successful console or API logins from
    an unfamiliar country, a new device, an unexpected user agent, or a token/session that was issued
    after suspicious failures. Method (Machine Learning): Train a classifier on cloud sign-in/audit data
    (geo/ASN, user-agent, device ID, MFA result, request path, API name, failure history); alert on high
    compromise probability, surface the top-3 contributing features in the alert, and monitor for drift
    as tenants/workloads change ([Detecting Threats in AWS CloudTrail Logs Using ML, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning);
    [Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)).
    This learned model scores behavior and surfaces the top contributing features: a high score warrants
    analyst review and correlation with adjacent telemetry, and model drift must be monitored as tenants
    and workloads evolve. Tie this finding back to Stealth (TA0005) when assessing impact and next steps.'
  answer_sources:
  - Zeek conn.log
  - Azure AD Sign-In logs
  - AWS CloudTrail logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud provider IAM services (e.g., Azure AD, AWS IAM), Network Egress/Ingress Points (e.g.,
    Internet Gateway, VPN Concentrators), Threat Intelligence Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      features=[geo, asn, user_agent, device_id, mfa_result, request_path, api_name, failure_history]

      score=model.predict_proba(features)

      | where score>0.9 | emit principal, score, top3_features

      | monitor model_drift
  - technology: Zeek/pseudocode
    query: >-
      conn.log

      | lookup src=id.orig_h against enrichment(geoip, asn, ti_malicious_ip)

      | join cloud_auth on src_ip

      | surface ts, id.orig_h, id.resp_h, service, matched_context
- question: Do any cloud API calls carry a User-Agent matching known offensive tools (Pacu, PowerZure,
    S3 Browser) or generic scripting agents (curl, python-requests, Go-http-client)?
  context: 'As part of investigating Stealth, where the adversary blends compromised cloud-account activity
    in with legitimate operations to avoid detection, A sequence of cloud API calls is observed with a
    User-Agent string matching a known offensive security tool (e.g., PowerZure, Pacu) or a generic, script-based
    User-Agent (e.g., ''curl'', ''python-requests'', ''Go-http-client'') not typically associated with
    the user. Method (Symbolic Logic): Match the CloudTrail/Azure userAgent field against regexes for
    offensive tools and GUI utilities (e.g., S3 Browser, Pacu, PowerZure) and generic scripting agents;
    flag any match and escalate when it co-occurs with permission enumeration, access-key creation, or
    IAM changes ([AWS IAM S3Browser Creation, Sigma](https://detection.fyi/sigmahq/sigma/cloud/aws/cloudtrail/aws_iam_s3browser_user_or_accesskey_creation/)).
    This deterministic rule produces a definitive match: a positive result is a concrete, triage-ready
    event, while a negative result lowers (but does not eliminate) suspicion and should be corroborated
    with other signals. Tie this finding back to Stealth (TA0005) when assessing impact and next steps.'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - 'NAI: Cloud API endpoints, Cloud Service Provider Management Consoles, Application and Web Server
    Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      cloudtrail OR azure_activity

      | where userAgent matches regex(offensive_tools | scripting_agents)

      | escalate if co_occurs(iam_enum | CreateAccessKey | iam_change)
