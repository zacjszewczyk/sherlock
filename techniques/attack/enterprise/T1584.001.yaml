    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable domain
    compromise, lookalike registration, shadowing, or hijack; pivot to the internal hosts and users that
    queried or connected to the domain, the domain''s registration, certificate, and resolution history
    (WHOIS, Certificate Transparency, passive DNS), the resolved IP/ASN/country versus approved space,
    and any downstream web, email, or C2 activity to scope impact and confirm whether the organization''s
    identity is being abused. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since adversary domain activity often occurs outside the
    victim''s direct visibility and a single method can miss low-prevalence, slow, or well-disguised infrastructure.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Proxy Logs
  - Firewall Logs
  - Threat Intelligence Feeds for NRDs, C2, and parked domains
  - 'NAI: Enterprise DNS resolvers, Outbound web proxies and firewalls, Endpoint devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      model = char_level_LSTM_or_GRU(input=domain_string)  # no contextual lookup
      for q in dns.log.query:
        p = model.score(q); family = model.attribute(q)
        nx_burst = NXDOMAIN_rate_per_host(id.orig_h)
        if p > threshold(TPR~0.9 @ FP 1:10000):
          alert(domain=q, family=family, nx_burst=nx_burst, top_ngrams=...)
- question: '[Resource Development] Regex/edit-distance detection of combosquatting and typosquats: Can
    you determine whether a DNS query is observed for a domain that is visually or structurally similar
    to the organization''s or its key partners'' domains, but is not on an approved domain allow-list.
    This includes typosquats, homographs, and combosquats. -- specifically, using the ''Regex/edit-distance
    detection of combosquatting and typosquats'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary hijacks or
    registers domains, subdomains, or DNS records that mimic the organization''s identity to support later
    operations such as phishing, command-and-control, or data theft. This evidence focuses on the condition
    that a DNS query is observed for a domain that is visually or structurally similar to the organization''s
    or its key partners'' domains, but is not on an approved domain allow-list. This includes typosquats,
    homographs, and combosquats. This Symbolic Logic approach works as follows: Alert when Zeek dns.log
    queries non-allow-listed domains within Damerau-Levenshtein distance <=2 of protected brand/partner
    apex domains, or matching combosquat/TLD-swap/bit-squat patterns. Maintain the protected-brand list
    and an allow-list as the deterministic floor [The Landscape of Domain Name Typosquatting: Techniques
    and Countermeasures](https://arxiv.org/abs/1603.02767). A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable domain compromise, lookalike registration, shadowing,
    or hijack; pivot to the internal hosts and users that queried or connected to the domain, the domain''s
    registration, certificate, and resolution history (WHOIS, Certificate Transparency, passive DNS),
    the resolved IP/ASN/country versus approved space, and any downstream web, email, or C2 activity to
    scope impact and confirm whether the organization''s identity is being abused. A negative result helps
    rule out this particular vector but should be corroborated with the other questions in this playbook,
    since adversary domain activity often occurs outside the victim''s direct visibility and a single
    method can miss low-prevalence, slow, or well-disguised infrastructure.'
  answer_sources:
  - Zeek dns.log
  - Certificate Transparency Logs
  - Passive DNS
  - External domain monitoring services
  - 'NAI: Enterprise DNS resolvers, Certificate Transparency log aggregators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      load protected_apex[], allow_list[]
      for q in dns.log.query where q not in allow_list:
        for b in protected_apex:
          if damerau_levenshtein(strip_tld(q), strip_tld(b)) <= 2
             OR combosquat(q,b) OR tld_swap(q,b) OR bit_squat(q,b):
            alert(query=q, brand=b)
