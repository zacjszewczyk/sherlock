- question: '[Resource Development] Inventory enforcement for company-owned subdomains: Can you determine
    whether a DNS query is observed for a previously unseen subdomain of a legitimate company-owned domain,
    and the subdomain''s name exhibits random or suspicious characteristics, suggesting domain shadowing.
    -- specifically, using the ''Inventory enforcement for company-owned subdomains'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary hijacks or
    registers domains, subdomains, or DNS records that mimic the organization''s identity to support later
    operations such as phishing, command-and-control, or data theft. This evidence focuses on the condition
    that a DNS query is observed for a previously unseen subdomain of a legitimate company-owned domain,
    and the subdomain''s name exhibits random or suspicious characteristics, suggesting domain shadowing.
    This Symbolic Logic approach works as follows: Alert when a non-inventoried subdomain of a company-owned
    apex is queried or resolved. Maintain an authoritative subdomain inventory/zone-file as the deterministic
    floor; any first-seen subdomain outside it is a candidate shadowed record [Domain Shadowing: A Stealthy
