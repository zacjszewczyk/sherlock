    and the subdomain''s name exhibits random or suspicious characteristics, suggesting domain shadowing.
    This Statistical Method approach works as follows: Score new subdomain labels by Shannon entropy and
    flag values above the 98th percentile (per parent domain), corroborated by KL-divergence vs a natural-language
    baseline to filter benign random-looking CDN labels. Derive percentiles from historical resolver data
    [NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500); [Using Entropy in
    Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/). A positive result
