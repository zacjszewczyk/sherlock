  - Zeek dns.log
  - Internal DNS server logs
  - Authoritative external DNS logs
  - Certificate Transparency Logs
  - 'NAI: Public-facing DNS records, Internal DNS resolvers, Endpoint devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for new_sub of parent in company_apex:
        label = leftmost_label(new_sub)
