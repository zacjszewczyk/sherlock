name: 'T1584.001: Domains'
id: 488a073f-748e-408d-a083-e4900bf0d8dc
description: 'This playbook helps an analyst investigate whether a sophisticated external adversary, a
  commodity threat actor, or an insider has hijacked or registered domains, subdomains, or DNS records
  to mimic the organization''s identity and support follow-on operations (MITRE ATT&CK T1584.001, Compromise
  Infrastructure: Domains). It covers domain registration hijacking, subdomain takeover of deprovisioned
  or dangling DNS entries, and domain shadowing (malicious subdomains created under a compromised but
  otherwise healthy domain). Because most of this activity occurs outside the victim''s direct visibility,
  the hunt focuses on the observable consequences in enterprise telemetry: internal hosts querying or
  connecting to hijacked, newly-registered, C2, parked, or DGA-pattern domains on threat-intelligence
  feeds; DNS queries for typosquat, combosquat, homograph, and bit-squat lookalikes of protected brand
  and partner apex domains; first-seen, high-entropy subdomains of company-owned apexes that signal shadowing;
  company-owned domains resolving to IPs, ASNs, or countries outside approved CIDR/NS space; and outbound
  connections to domains that combine multiple burner-infrastructure traits (freshly issued certificates,
  very low DNS TTLs, recent registration, privacy-protected WHOIS, non-business ISPs). Detection methods
  combine deterministic symbolic-logic rules (threat-intel and allow-list/inventory enforcement, Damerau-Levenshtein
  and combosquat matching, Certificate Transparency monitoring, CIDR/NS allowlisting, multi-attribute
  correlation), statistical baselining (unique-host fan-out percentiles, entropy and KL-divergence scoring,
  resolution-attribute deviation, DNS record change velocity, weighted risk scoring), and machine learning
  (Random Forest prioritization and shadowed-subdomain classifiers, character-level LSTM/GRU DGA detection,
  Siamese CNN visual-similarity homograph detection, Isolation Forest and DBSCAN anomaly detection), applied
  across Zeek dns/conn/ssl/x509 logs, internal and authoritative DNS logs, passive DNS, Certificate Transparency,
  WHOIS, proxy and firewall logs, and external domain-monitoring services, so the analyst can corroborate
  suspected domain compromise from lexical, registration, resolution, certificate, and network angles.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
