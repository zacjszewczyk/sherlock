questions:
- question: '[Resource Development] Threat intel blocking for hijacked/NRD domains: Can you determine
    whether an internal host queries or connects to a domain listed on a threat intelligence feed of hijacked,
    command and control (C2), newly registered domains (NRDs), or known domain generation algorithm (DGA)
    patterns. -- specifically, using the ''Threat intel blocking for hijacked/NRD domains'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary hijacks or
    registers domains, subdomains, or DNS records that mimic the organization''s identity to support later
    operations such as phishing, command-and-control, or data theft. This evidence focuses on the condition
    that an internal host queries or connects to a domain listed on a threat intelligence feed of hijacked,
    command and control (C2), newly registered domains (NRDs), or known domain generation algorithm (DGA)
    patterns. This Symbolic Logic approach works as follows: Alert when Zeek dns.log/conn.log queries
    or connections match curated TI feeds for hijacked/C2/NRD/parked domains. Keep this deterministic
    floor and tune feeds; treat any first-party hit as high priority. Profile failure modes by also counting
    blocked/sinkholed connections and NXDOMAIN responses per host as a distinct signal of automated probing
    [FANCI: Feature-based Automated NXDomain Classification](https://www.usenix.org/conference/usenixsecurity18/presentation/schuppen).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable domain
    compromise, lookalike registration, shadowing, or hijack; pivot to the internal hosts and users that
    queried or connected to the domain, the domain''s registration, certificate, and resolution history
    (WHOIS, Certificate Transparency, passive DNS), the resolved IP/ASN/country versus approved space,
    and any downstream web, email, or C2 activity to scope impact and confirm whether the organization''s
    identity is being abused. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since adversary domain activity often occurs outside the
    victim''s direct visibility and a single method can miss low-prevalence, slow, or well-disguised infrastructure.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Proxy Logs
  - Firewall Logs
  - Threat Intelligence Feeds for NRDs, C2, and parked domains
  - 'NAI: Enterprise DNS resolvers, Outbound web proxies and firewalls, Endpoint devices'
  range: Last 90 days; for newly-registered domains focus on the first 24h since first-seen and correlate
    event-centered windows.
  queries:
  - technology: Zeek/pseudocode
    query: |-
      load TI_feed = hijacked + C2 + NRD + parked domains
      from dns.log, conn.log
      where query in TI_feed OR resolved_ip in TI_feed_ips
      emit alert(host=id.orig_h, domain=query, severity=high)
      // failure-mode signal
      count blocked_or_sinkholed_conns, NXDOMAIN_responses per id.orig_h
      flag hosts with high NXDOMAIN/blocked counts as automated probing
- question: '[Resource Development] Unique host spike scoring for NRDs: Can you determine whether an internal
    host queries or connects to a domain listed on a threat intelligence feed of hijacked, command and
    control (C2), newly registered domains (NRDs), or known domain generation algorithm (DGA) patterns.
    -- specifically, using the ''Unique host spike scoring for NRDs'' (Statistical Method) approach?'
