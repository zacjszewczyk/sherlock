    scope impact and confirm whether the organization''s identity is being abused. A negative result helps
    rule out this particular vector but should be corroborated with the other questions in this playbook,
    since adversary domain activity often occurs outside the victim''s direct visibility and a single
    method can miss low-prevalence, slow, or well-disguised infrastructure.'
  answer_sources:
  - Zeek dns.log
  - Certificate Transparency Logs
  - Passive DNS
  - External domain monitoring services
  - 'NAI: Enterprise DNS resolvers, Certificate Transparency log aggregators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      candidates = generate_IDN_homoglyphs(protected_apex)  # Cyrillic a->Latin a, etc
      candidates += tld_permutations + typo_permutations
      monitor CT_logs and passive_dns for new cert/registration matching candidates
      alert(candidate=c, brand=b, source=CT|pDNS) on first observation
- question: '[Resource Development] Distance and entropy scoring for typosquats: Can you determine whether
    a DNS query is observed for a domain that is visually or structurally similar to the organization''s
    or its key partners'' domains, but is not on an approved domain allow-list. This includes typosquats,
    homographs, and combosquats. -- specifically, using the ''Distance and entropy scoring for typosquats''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary hijacks or
    registers domains, subdomains, or DNS records that mimic the organization''s identity to support later
    operations such as phishing, command-and-control, or data theft. This evidence focuses on the condition
    that a DNS query is observed for a domain that is visually or structurally similar to the organization''s
    or its key partners'' domains, but is not on an approved domain allow-list. This includes typosquats,
    homographs, and combosquats. This Statistical Method approach works as follows: Flag queried domains
    with Damerau-Levenshtein distance <=2 to a protected brand, or high Shannon entropy / Punycode randomness
    above the 95th-98th percentile; refine with KL-divergence against a natural-language n-gram baseline
    to suppress benign high-entropy CDNs. Derive thresholds per environment [NIOM-DGA: Nature-Inspired
    Feature Selection for DGA Detection](https://www.sciencedirect.com/science/article/pii/S0167404825002500);
    [Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable domain
    compromise, lookalike registration, shadowing, or hijack; pivot to the internal hosts and users that
    queried or connected to the domain, the domain''s registration, certificate, and resolution history
    (WHOIS, Certificate Transparency, passive DNS), the resolved IP/ASN/country versus approved space,
    and any downstream web, email, or C2 activity to scope impact and confirm whether the organization''s
    identity is being abused. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since adversary domain activity often occurs outside the
    victim''s direct visibility and a single method can miss low-prevalence, slow, or well-disguised infrastructure.'
  answer_sources:
  - Zeek dns.log
  - Certificate Transparency Logs
  - Passive DNS
  - External domain monitoring services
  - 'NAI: Enterprise DNS resolvers, Certificate Transparency log aggregators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for q in dns.log.query:
        d = min(damerau_levenshtein(strip_tld(q), b) for b in protected_apex)
        H = shannon_entropy(q); puny = punycode_randomness(q)
        kl = kl_divergence(q_ngrams, natural_language_baseline)
        if d <= 2 OR (H > p95 AND kl > thresh): alert(query=q, dist=d, entropy=H)
- question: '[Resource Development] Visual-similarity homograph classifier: Can you determine whether
    a DNS query is observed for a domain that is visually or structurally similar to the organization''s
    or its key partners'' domains, but is not on an approved domain allow-list. This includes typosquats,
    homographs, and combosquats. -- specifically, using the ''Visual-similarity homograph classifier''
    (Machine Learning) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary hijacks or
    registers domains, subdomains, or DNS records that mimic the organization''s identity to support later
    operations such as phishing, command-and-control, or data theft. This evidence focuses on the condition
    that a DNS query is observed for a domain that is visually or structurally similar to the organization''s
    or its key partners'' domains, but is not on an approved domain allow-list. This includes typosquats,
    homographs, and combosquats. This Machine Learning approach works as follows: Score candidate lookalike
    (sub)domains against protected brands with a Siamese CNN visual-similarity embedding to catch homoglyph
    spoofs that edit-distance/Punycode rules miss; alert when perceptual distance is below a tuned threshold
    and report the matched brand [Detecting Homoglyph Attacks with a Siamese Neural Network](https://arxiv.org/abs/1805.09738).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable domain
    compromise, lookalike registration, shadowing, or hijack; pivot to the internal hosts and users that
    queried or connected to the domain, the domain''s registration, certificate, and resolution history
    (WHOIS, Certificate Transparency, passive DNS), the resolved IP/ASN/country versus approved space,
    and any downstream web, email, or C2 activity to scope impact and confirm whether the organization''s
    identity is being abused. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since adversary domain activity often occurs outside the
    victim''s direct visibility and a single method can miss low-prevalence, slow, or well-disguised infrastructure.'
  answer_sources:
  - Zeek dns.log
  - Certificate Transparency Logs
  - Passive DNS
  - External domain monitoring services
  - 'NAI: Enterprise DNS resolvers, Certificate Transparency log aggregators'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      embed = SiameseCNN_visual_embedding()
      for cand in candidate_lookalike_domains:
        for b in protected_brand_images:
          pd = perceptual_distance(embed(render(cand)), embed(render(b)))
          if pd < tuned_threshold: alert(domain=cand, matched_brand=b, distance=pd)
