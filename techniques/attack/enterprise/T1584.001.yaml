    prevalence/dynamism findings [EXPOSURE: Finding Malicious Domains Using Passive DNS Analysis](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable domain
