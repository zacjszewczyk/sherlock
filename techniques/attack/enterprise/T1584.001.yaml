    registration, shadowing, or hijack; pivot to the internal hosts and users that queried or connected
    to the domain, the domain''s registration, certificate, and resolution history (WHOIS, Certificate
    Transparency, passive DNS), the resolved IP/ASN/country versus approved space, and any downstream
    web, email, or C2 activity to scope impact and confirm whether the organization''s identity is being
    abused. A negative result helps rule out this particular vector but should be corroborated with the
    other questions in this playbook, since adversary domain activity often occurs outside the victim''s
    direct visibility and a single method can miss low-prevalence, slow, or well-disguised infrastructure.'
