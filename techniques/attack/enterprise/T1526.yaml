name: 'T1526: Cloud Service Discovery'
id: 4b6150f1-595c-4fe9-a137-9c528e284832
description: 'This playbook helps an analyst investigate whether an adversary is performing Cloud Service
  Discovery (T1526) -- enumerating cloud services, configurations, subscriptions, resources, identities,
  and SaaS integrations after gaining access -- in support of the Discovery tactic. It guides the hunt
  across several complementary angles: cloud control-plane API and management-portal requests carrying
  known discovery-tool signatures (Pacu, Stormspotter, ScoutSuite, unbranded aws-cli/boto3 user agents)
  and rapid fan-out across many distinct services/subscriptions/resource groups; bursts of AccessDenied/403
  errors on List*/Get*/Describe* calls that betray permission and service enumeration with low-privilege
  or stolen credentials; cloud CLI/PowerShell discovery verbs (aws describe-*/list-*, az account/resource
  list, gcloud projects list/asset search, Get-Mg*/Get-AzResource) executed from hosts or accounts that
  rarely administer cloud; horizontal network scanning toward cloud service endpoints seen in Zeek conn.log/dns.log;
  suspicious access to the instance metadata service (169.254.169.254, including IMDSv1 security-credentials
  paths); and anomalous discovery API sequences relative to a principal''s or role''s historical baseline.
  Detection methods combine symbolic-logic rules, statistical baselining (per-principal/per-host Volume,
  Frequency, and State profiling with median+MAD robust thresholds), and machine-learning models (sequence/graph
  classifiers, command-line language models, clustering, and time-series forecasting) applied to AWS CloudTrail,
  Azure Activity/sign-in logs, Google Cloud Audit logs, Microsoft 365/SaaS admin and auth logs, Windows
  Event IDs 4688/4104, and Zeek telemetry, so the analyst can corroborate suspected cloud reconnaissance
  against identity context, command lineage, network behavior, and metadata-service access.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
