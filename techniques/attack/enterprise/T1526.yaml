    of distinct cloud service IP addresses or ports within a short timeframe, indicative of a horizontal
    scan. This Statistical Method approach works as follows: Baseline each host''s unique destination
    IP/port counts over 10 minutes (Volume), connection rate (Frequency), and failed/blocked connection
    ratio (State: conn_state S0/REJ/RSTO) and flag values above the 98th percentile or a median+MAD modified
    z-score >3.5, per [Automatic Anomaly Detection in the Cloud Via Statistical Learning](https://arxiv.org/abs/1704.07706);
    explicitly treat high blocked/failed-connection rates as a distinct scan signal. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates that a principal or host is enumerating
    cloud services, identities, or resources in a way that diverges from sanctioned administration and
    normal usage; pivot to the responsible principal/role, the source host and IP, the session/token,
    the specific services and resources touched, the AccessDenied ratio, and any follow-on credential
    access, defense evasion, or lateral movement. A negative result helps reduce suspicion of this discovery
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss slow, low-volume, or living-off-the-land reconnaissance.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network sensors at key ingress/egress points, internal network choke points, and virtual network
    flow logs in cloud environments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "# Destination cardinality scoring\nsource IN ['Zeek conn.log', 'Zeek dns.log']\n| stats dc(id.resp_h)\
      \ as unique_dst, dc(id.resp_p) as unique_ports, count/window_min as freq,\n        sum(conn_state\
      \ IN ['S0','REJ','RSTO'])/count as failed_ratio by id.orig_h, window=10m\n| eval med=median(unique_dst),\
      \ mad=mad(unique_dst), mz=0.6745*(unique_dst-med)/mad\n| where unique_dst > p98(unique_dst) OR mz\
      \ > 3.5 OR failed_ratio_high   // blocked/failed conns = distinct scan signal\n| emit anomaly with\
      \ id.orig_h, unique_dst, failed_ratio, mz"
