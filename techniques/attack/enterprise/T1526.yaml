  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '# Command-sequence anomaly model

      source IN [''Windows Event ID 4688'', ''Windows Event ID 4104'', ''AWS CloudTrail logs'', ''Azure
      Activity Logs'', ''Google Cloud Audit Logs'']

      // command-line language model pre-trained on large command corpora

      | score = cmdline_lm.logprob(session_commands)

      | where score < low_prob_threshold AND session_is_discovery_dominated AND otherwise_idle

      | emit alert with principal, session, top3_tokens   // e.g. describe-* fan-out, resource wildcards'
- question: '[Discovery] Cloud scan cardinality rule (Symbolic Logic): Can you determine whether a single
    source IP address initiates connections to a statistically unusual number of distinct cloud service
    IP addresses or ports within a short timeframe, indicative of a horizontal scan. -- specifically,
    using the ''Cloud scan cardinality rule'' approach to apply deterministic rule logic?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary maps the cloud estate
    to shape follow-on behaviors -- targeting data and credentials from enumerated services or evading
    identified defenses (e.g., disabling cloud logging or security tooling). This evidence focuses on
    the condition that a single source IP address initiates connections to a statistically unusual number
    of distinct cloud service IP addresses or ports within a short timeframe, indicative of a horizontal
    scan. This Symbolic Logic approach works as follows: Alert when Zeek conn.log shows id.orig_h reaching
    >20 unique id.resp_h in cloud ranges within 5 minutes absent known CDN/load-balancers, and corroborate
    with DNS via Zeek dns.log bursts of distinct cloud service names; keep this deterministic cardinality
    threshold and tune the allow-list. Rule patterns adaptable from [SigmaHQ](https://github.com/SigmaHQ/sigma).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates that a principal
    or host is enumerating cloud services, identities, or resources in a way that diverges from sanctioned
    administration and normal usage; pivot to the responsible principal/role, the source host and IP,
    the session/token, the specific services and resources touched, the AccessDenied ratio, and any follow-on
    credential access, defense evasion, or lateral movement. A negative result helps reduce suspicion
    of this discovery vector but should be corroborated with the other questions in this playbook, since
    a single method can miss slow, low-volume, or living-off-the-land reconnaissance.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network sensors at key ingress/egress points, internal network choke points, and virtual network
    flow logs in cloud environments.'
  range: Last 90 days; for fan-out/burst rules correlate within the stated short window (5-10 min) per
    source event
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Cloud scan cardinality rule

      source IN [''Zeek conn.log'', ''Zeek dns.log'']

      | where id.resp_h IN cloud_ranges AND id.resp_h NOT IN cdn_loadbalancer_allowlist

      | stats dc(id.resp_h) as unique_dest by id.orig_h, window=5m

      | where unique_dest > 20   // deterministic cardinality threshold

      // corroborate with Zeek dns.log bursts of distinct cloud service names

      | emit alert with id.orig_h, unique_dest'
- question: '[Discovery] Destination cardinality scoring (Statistical Method): Can you determine whether
    a single source IP address initiates connections to a statistically unusual number of distinct cloud
