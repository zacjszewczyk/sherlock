name: 'T1526: Cloud Service Discovery'
id: 4b6150f1-595c-4fe9-a137-9c528e284832
description: 'This playbook helps an analyst investigate whether an adversary is performing Cloud Service
  Discovery (T1526) -- enumerating cloud services, configurations, subscriptions, resources, identities,
  and SaaS integrations after gaining access -- in support of the Discovery tactic. It guides the hunt
  across several complementary angles: cloud control-plane API and management-portal requests carrying
  known discovery-tool signatures (Pacu, Stormspotter, ScoutSuite, unbranded aws-cli/boto3 user agents)
  and rapid fan-out across many distinct services/subscriptions/resource groups; bursts of AccessDenied/403
  errors on List*/Get*/Describe* calls that betray permission and service enumeration with low-privilege
  or stolen credentials; cloud CLI/PowerShell discovery verbs (aws describe-*/list-*, az account/resource
  list, gcloud projects list/asset search, Get-Mg*/Get-AzResource) executed from hosts or accounts that
  rarely administer cloud; horizontal network scanning toward cloud service endpoints seen in Zeek conn.log/dns.log;
  suspicious access to the instance metadata service (169.254.169.254, including IMDSv1 security-credentials
  paths); and anomalous discovery API sequences relative to a principal''s or role''s historical baseline.
  Detection methods combine symbolic-logic rules, statistical baselining (per-principal/per-host Volume,
  Frequency, and State profiling with median+MAD robust thresholds), and machine-learning models (sequence/graph
  classifiers, command-line language models, clustering, and time-series forecasting) applied to AWS CloudTrail,
  Azure Activity/sign-in logs, Google Cloud Audit logs, Microsoft 365/SaaS admin and auth logs, Windows
  Event IDs 4688/4104, and Zeek telemetry, so the analyst can corroborate suspected cloud reconnaissance
  against identity context, command lineage, network behavior, and metadata-service access.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: '[Discovery] Cloud API and tool-signature correlation (Symbolic Logic): Can you determine
    whether a request to a cloud provider API endpoint or management portal is observed from a source
    with a suspicious user-agent or tool signature, and the same principal subsequently enumerates multiple
    services, subscriptions, or resource groups. -- specifically, using the ''Cloud API and tool-signature
    correlation'' approach to apply deterministic rule logic?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary maps the cloud estate
    to shape follow-on behaviors -- targeting data and credentials from enumerated services or evading
    identified defenses (e.g., disabling cloud logging or security tooling). This evidence focuses on
    the condition that a request to a cloud provider API endpoint or management portal is observed from
    a source with a suspicious user-agent or tool signature, and the same principal subsequently enumerates
    multiple services, subscriptions, or resource groups. This Symbolic Logic approach works as follows:
    Correlate cloud audit logs (CloudTrail/Azure Activity/GCP Audit) and Zeek HTTP for management-endpoint
    requests carrying known discovery-tool user agents or patterns (Pacu, Stormspotter, ScoutSuite, default
    unbranded aws-cli/boto3 UAs). Alert when one principal/host pivots from one service to >=N (start
    N=8, tune per env) distinct services, subscriptions, or resource groups within 10 minutes, per portable
    CloudTrail/Azure/GCP rules in [SigmaHQ](https://github.com/SigmaHQ/sigma). Treat first-seen role/API
    combinations as deterministic triggers via lookups as in [Cloud API Calls From Previously Unseen User
    Roles](https://research.splunk.com/cloud/2181ad1f-1e73-4d0c-9780-e8880482a08f/). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates that a principal or host is enumerating
    cloud services, identities, or resources in a way that diverges from sanctioned administration and
    normal usage; pivot to the responsible principal/role, the source host and IP, the session/token,
    the specific services and resources touched, the AccessDenied ratio, and any follow-on credential
    access, defense evasion, or lateral movement. A negative result helps reduce suspicion of this discovery
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss slow, low-volume, or living-off-the-land reconnaissance.'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek http.log
  - 'NAI: Network egress points, such as firewalls and web proxies, and virtual network taps monitoring
    traffic to public cloud provider API endpoints.'
  range: Last 90 days; for fan-out/burst rules correlate within the stated short window (5-10 min) per
    source event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Cloud API and tool-signature correlation\nsource IN ['AWS CloudTrail logs', 'Azure Activity\
      \ Logs', 'Google Cloud Audit Logs', 'Zeek http.log']\n// correlate management-endpoint requests\
      \ carrying known discovery-tool user agents/patterns\n| where user_agent MATCHES 'Pacu|Stormspotter|ScoutSuite'\
      \ OR user_agent IN unbranded_awscli_boto3_uas\n| stats dc(service) as distinct_services, dc(subscription)\
      \ as subs, dc(resource_group) as rgs by principal, src_host, window=10m\n| where (distinct_services\
      \ + subs + rgs) >= 8   // start N=8, tune per env\n   OR first_seen(role, api)                 \
      \     // deterministic trigger via lookup\n| emit alert with principal, src_host, distinct_services,\
      \ subs, rgs"
- question: '[Discovery] Discovery failure-rate rule (Symbolic Logic): Can you determine whether a request
    to a cloud provider API endpoint or management portal is observed from a source with a suspicious
    user-agent or tool signature, and the same principal subsequently enumerates multiple services, subscriptions,
    or resource groups. -- specifically, using the ''Discovery failure-rate rule'' approach to apply deterministic
    rule logic?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary maps the cloud estate
    to shape follow-on behaviors -- targeting data and credentials from enumerated services or evading
    identified defenses (e.g., disabling cloud logging or security tooling). This evidence focuses on
    the condition that a request to a cloud provider API endpoint or management portal is observed from
    a source with a suspicious user-agent or tool signature, and the same principal subsequently enumerates
    multiple services, subscriptions, or resource groups. This Symbolic Logic approach works as follows:
    Profile the failure mode explicitly: alert when a principal accumulates a burst of errorCode=AccessDenied/403
    on List*/Get*/Describe* calls (start >10 distinct denied actions in 10 min), a hallmark of permission
    and service enumeration with low-privilege or stolen credentials, per [AWS IAM AccessDenied Discovery
    Events](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates that a principal or host is enumerating
    cloud services, identities, or resources in a way that diverges from sanctioned administration and
    normal usage; pivot to the responsible principal/role, the source host and IP, the session/token,
    the specific services and resources touched, the AccessDenied ratio, and any follow-on credential
    access, defense evasion, or lateral movement. A negative result helps reduce suspicion of this discovery
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss slow, low-volume, or living-off-the-land reconnaissance.'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek http.log
  - 'NAI: Network egress points, such as firewalls and web proxies, and virtual network taps monitoring
    traffic to public cloud provider API endpoints.'
  range: Last 90 days; for fan-out/burst rules correlate within the stated short window (5-10 min) per
    source event
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Discovery failure-rate rule

      source IN [''AWS CloudTrail logs'', ''Azure Activity Logs'', ''Google Cloud Audit Logs'', ''Zeek
      http.log'']

      | where errorCode IN [''AccessDenied'', ''403''] AND api MATCHES ''List*|Get*|Describe*''

      | stats dc(api) as denied_actions by principal, window=10m

      | where denied_actions > 10   // burst of distinct denied discovery calls

      | emit alert with principal, denied_actions'
- question: '[Discovery] Service enumeration burst baseline (Statistical Method): Can you determine whether
    a request to a cloud provider API endpoint or management portal is observed from a source with a suspicious
    user-agent or tool signature, and the same principal subsequently enumerates multiple services, subscriptions,
    or resource groups. -- specifically, using the ''Service enumeration burst baseline'' approach to
    baseline behavior statistically?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary maps the cloud estate
    to shape follow-on behaviors -- targeting data and credentials from enumerated services or evading
    identified defenses (e.g., disabling cloud logging or security tooling). This evidence focuses on
    the condition that a request to a cloud provider API endpoint or management portal is observed from
    a source with a suspicious user-agent or tool signature, and the same principal subsequently enumerates
    multiple services, subscriptions, or resource groups. This Statistical Method approach works as follows:
    Build a 30-day per-principal baseline of distinct cloud services/subscriptions/resource-groups queried
    per session plus Volume (total calls), Frequency (calls/min), and State (AccessDenied:success ratio).
    Flag sessions exceeding the 95th percentile or a robust modified z-score >3.5 using median+MAD with
    seasonal decomposition to resist batch jobs, per [Automatic Anomaly Detection in the Cloud Via Statistical
    Learning](https://arxiv.org/abs/1704.07706); layer a first-seen novelty check per principal as in
    the [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates that a principal
    or host is enumerating cloud services, identities, or resources in a way that diverges from sanctioned
    administration and normal usage; pivot to the responsible principal/role, the source host and IP,
    the session/token, the specific services and resources touched, the AccessDenied ratio, and any follow-on
    credential access, defense evasion, or lateral movement. A negative result helps reduce suspicion
    of this discovery vector but should be corroborated with the other questions in this playbook, since
    a single method can miss slow, low-volume, or living-off-the-land reconnaissance.'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek http.log
  - 'NAI: Network egress points, such as firewalls and web proxies, and virtual network taps monitoring
    traffic to public cloud provider API endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Service enumeration burst baseline

      source IN [''AWS CloudTrail logs'', ''Azure Activity Logs'', ''Google Cloud Audit Logs'', ''Zeek
      http.log'']

      // 30d per-principal baseline of distinct services/subscriptions/resource-groups per session + Volume,
      Frequency, State

      | stats dc(service) as distinct_services, count as volume, count/window_min as freq, sum(access_denied)/count
      as denied_ratio by principal, session

      | eval med=median(distinct_services), mad=mad(distinct_services), mz=0.6745*(distinct_services-med)/mad   //
      robust w/ seasonal decomposition

      | where distinct_services > p95(distinct_services) OR mz > 3.5 OR first_seen(principal, action)

      | emit anomaly with principal, distinct_services, mz'
- question: '[Discovery] Cloud discovery sequence classifier (Machine Learning): Can you determine whether
    a request to a cloud provider API endpoint or management portal is observed from a source with a suspicious
    user-agent or tool signature, and the same principal subsequently enumerates multiple services, subscriptions,
    or resource groups. -- specifically, using the ''Cloud discovery sequence classifier'' approach to
    score behavior with a model?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary maps the cloud estate
