    a source with a suspicious user-agent or tool signature, and the same principal subsequently enumerates
    multiple services, subscriptions, or resource groups. This Machine Learning approach works as follows:
    Train a sequence/graph-aware classifier on API order, HTTP method mix, URI structure, response sizes,
    token type, principal-role-resource edges, and AccessDenied ratio to separate administration from
    reconnaissance, per [Graph Neural Network-Based Adaptive Threat Detection for Cloud IAM Logs](https://arxiv.org/abs/2512.10280)
    and [Cloudy with a Chance of Anomalies](https://arxiv.org/abs/2409.12726). Use evasion-resistant behavior-unit
    features per [Adversarial Robust Behavior Sequence Anomaly Detection](https://arxiv.org/abs/2509.15756),
    and emit the top-3 contributing features (e.g., distinct-service count, new role/API combo, denied-call
    ratio) in each alert. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    that a principal or host is enumerating cloud services, identities, or resources in a way that diverges
    from sanctioned administration and normal usage; pivot to the responsible principal/role, the source
    host and IP, the session/token, the specific services and resources touched, the AccessDenied ratio,
    and any follow-on credential access, defense evasion, or lateral movement. A negative result helps
    reduce suspicion of this discovery vector but should be corroborated with the other questions in this
    playbook, since a single method can miss slow, low-volume, or living-off-the-land reconnaissance.'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek http.log
  - 'NAI: Network egress points, such as firewalls and web proxies, and virtual network taps monitoring
    traffic to public cloud provider API endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '# Cloud discovery sequence classifier

      source IN [''AWS CloudTrail logs'', ''Azure Activity Logs'', ''Google Cloud Audit Logs'', ''Zeek
      http.log'']

      // featurize: API order, HTTP method mix, URI structure, response sizes, token type, principal-role-resource
      edges, AccessDenied ratio

      | model_score = sequence_graph_classifier.predict(features)

      | where model_score > threshold

      | emit alert with principal, model_score, top3_features   // e.g. distinct-service count, new role/API
      combo, denied ratio'
- question: '[Discovery] Discovery command pattern watch (Symbolic Logic): Can you determine whether a
    cloud CLI or PowerShell cmdlet is executed from a workstation or host with repeated list, get, or
    describe arguments that enumerate services, regions, or resources instead of performing a targeted
    management task. -- specifically, using the ''Discovery command pattern watch'' approach to apply
    deterministic rule logic?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary maps the cloud estate
    to shape follow-on behaviors -- targeting data and credentials from enumerated services or evading
    identified defenses (e.g., disabling cloud logging or security tooling). This evidence focuses on
    the condition that a cloud CLI or PowerShell cmdlet is executed from a workstation or host with repeated
    list, get, or describe arguments that enumerate services, regions, or resources instead of performing
    a targeted management task. This Symbolic Logic approach works as follows: Alert on cloud CLI/PowerShell
    discovery verbs such as aws ec2/iam/s3 describe-*/list-*, az account list, az resource list, gcloud
    projects list, gcloud asset search-all-resources, and Get-Mg*/Get-AzResource when originating from
    a host or account that normally performs little cloud administration, using process-creation and script-block
    rules from [SigmaHQ](https://github.com/SigmaHQ/sigma). Keep the concrete command/argument list as
    a deterministic floor. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    that a principal or host is enumerating cloud services, identities, or resources in a way that diverges
    from sanctioned administration and normal usage; pivot to the responsible principal/role, the source
    host and IP, the session/token, the specific services and resources touched, the AccessDenied ratio,
    and any follow-on credential access, defense evasion, or lateral movement. A negative result helps
    reduce suspicion of this discovery vector but should be corroborated with the other questions in this
    playbook, since a single method can miss slow, low-volume, or living-off-the-land reconnaissance.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Endpoints such as developer workstations, administrator jump boxes, and servers with cloud SDKs
    or CLI tools installed.'
  range: Last 90 days; for fan-out/burst rules correlate within the stated short window (5-10 min) per
    source event
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Discovery command pattern watch

      source IN [''Windows Event ID 4688'', ''Windows Event ID 4104'', ''AWS CloudTrail logs'', ''Azure
      Activity Logs'', ''Google Cloud Audit Logs'']

      | where command MATCHES ''aws (ec2|iam|s3) (describe-|list-)|az account list|az resource list|gcloud
      projects list|gcloud asset search-all-resources|Get-Mg|Get-AzResource''

      | where rarely_administers_cloud(principal, host)   // host/account with little cloud admin history

      | emit alert with principal, host, command'
- question: '[Discovery] Discovery-to-operation ratio baseline (Statistical Method): Can you determine
    whether a cloud CLI or PowerShell cmdlet is executed from a workstation or host with repeated list,
    get, or describe arguments that enumerate services, regions, or resources instead of performing a
    targeted management task. -- specifically, using the ''Discovery-to-operation ratio baseline'' approach
    to baseline behavior statistically?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary maps the cloud estate
    to shape follow-on behaviors -- targeting data and credentials from enumerated services or evading
    identified defenses (e.g., disabling cloud logging or security tooling). This evidence focuses on
    the condition that a cloud CLI or PowerShell cmdlet is executed from a workstation or host with repeated
    list, get, or describe arguments that enumerate services, regions, or resources instead of performing
    a targeted management task. This Statistical Method approach works as follows: Track each user''s
    ratio of discovery (list/get/describe) to operational (create/update/delete) commands over 30 days
    plus command Volume and Frequency (commands/min). Flag ratios exceeding the 3-sigma upper bound or
    a median+MAD modified z-score >3.5 to tolerate scripted admin spikes, per [Automatic Anomaly Detection
    in the Cloud Via Statistical Learning](https://arxiv.org/abs/1704.07706). A positive result -- a rule
    match, statistical outlier, or model alert -- indicates that a principal or host is enumerating cloud
    services, identities, or resources in a way that diverges from sanctioned administration and normal
    usage; pivot to the responsible principal/role, the source host and IP, the session/token, the specific
    services and resources touched, the AccessDenied ratio, and any follow-on credential access, defense
    evasion, or lateral movement. A negative result helps reduce suspicion of this discovery vector but
    should be corroborated with the other questions in this playbook, since a single method can miss slow,
    low-volume, or living-off-the-land reconnaissance.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Endpoints such as developer workstations, administrator jump boxes, and servers with cloud SDKs
    or CLI tools installed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Discovery-to-operation ratio baseline

      source IN [''Windows Event ID 4688'', ''Windows Event ID 4104'', ''AWS CloudTrail logs'', ''Azure
      Activity Logs'', ''Google Cloud Audit Logs'']

      // 30d per-user: discovery (list/get/describe) vs operational (create/update/delete) + Volume, Frequency

      | stats sum(is_discovery) as disc, sum(is_operational) as ops, count as volume, count/window_min
      as freq by principal, day

      | eval ratio=disc/ops, med=median(ratio), mad=mad(ratio), mz=0.6745*(ratio-med)/mad

      | where ratio > mean(ratio)+3*stdev(ratio) OR mz > 3.5

      | emit anomaly with principal, ratio, mz'
- question: '[Discovery] Command-sequence anomaly model (Machine Learning): Can you determine whether
