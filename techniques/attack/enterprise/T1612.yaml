name: 'T1612: Build Image on Host'
id: 37d90c4e-0323-438c-aa72-1ad39d75afd5
description: 'Investigate whether an adversary is building container images directly on a host to bypass
  defenses that monitor for the retrieval of malicious images from public registries (T1612, Build Image
  on Host). This playbook helps an analyst hunt for ''docker build'', ''buildah'', and ''POST /build''
  Docker daemon API activity correlated with malicious behavior: builds that fetch payloads from C2 destinations
  matching threat intelligence, download abnormal byte volumes, or reach novel/rare ASNs and non-allow-listed
  registries. It guides examination of suspicious build flags and contexts (--no-cache, -f in /tmp, stdin/remote
  build contexts, Dockerfiles piped from curl/wget), off-role or off-allow-list builders (builds on domain
  controllers, database servers, or by accounts with no development role), and the full build->deploy->execute
  chain where a newly built image is immediately run and the resulting container beacons to C2 or executes
  a payload staged in tmpfs/shared memory. Symbolic-logic correlation, statistical baselining, and machine-learning
  detectors are provided so the analyst can confirm or refute host-built malicious images and the associated
  defense-evasion (Stealth) tradecraft.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: During a container build event ('docker build', 'buildah', or a 'POST /build' Docker daemon
    API request) on a host, did that same host initiate any network connection, DNS lookup, or file download
    within a short window (about 5 minutes) to an IP, domain, or file hash that matches a threat-intelligence
    feed?
  context: Adversaries build images on the host so a vanilla base image (e.g., alpine) looks benign while
    a malicious RUN step fetches the real payload from C2. By correlating the build event with concurrent
    Zeek conn/dns/files activity and matching any destination or downloaded-file hash against TI feeds,
    the analyst exposes the payload-fetch step that the build was designed to hide. Reinforce with Falco
    rules that flag curl/wget or package-manager execution and unexpected outbound connections during
    a build. A positive result (build window + TI hit) is strong evidence of a host-built malicious image
    supporting the Stealth tactic; a negative result helps clear an otherwise unexplained build. Pivot
    on the matched destination/hash to find the staged payload and any subsequent container deployment
    (T1610).
  answer_sources: &id001
  - docker:daemon POST /build
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: Container host systems, CI/CD pipeline servers, Network egress points, DNS resolvers'
  range: Last 90 days; correlate events within a 5-minute window centered on each build event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'INDEX build_events (docker:daemon POST /build OR EID 4688 process IN [docker,buildah] AND
      args CONTAINS ''build'')

      JOIN network (Zeek conn.log/dns.log/files.log) ON host

      WHERE network.ts BETWEEN build.ts AND build.ts+5m

      AND (network.dest_ip IN ti_feed OR network.query IN ti_feed OR files.sha256 IN ti_malware_hashes)

      EMIT alert(host, build.cmd, network.dest, match_type)'
  - technology: Falco/pseudocode
    query: "rule: fetch-or-egress-during-build\ncondition: container.image.build_in_progress and\n  (proc.name\
      \ in (curl,wget,apt,apk,pip,npm) or (evt.type=connect and not fd.sip in (registry_allowlist)))\n\
      output: \"payload fetch during build (proc=%proc.cmdline dest=%fd.rip)\""
- question: For each host, does the byte volume downloaded during a build, the count of distinct external
    destinations, or the character entropy/length of build-associated domains deviate significantly (>3
    sigma or above the 95th percentile) from that host's own 30-day baseline, and are there bursts of
    NXDOMAIN responses during the build?
  context: Malicious RUN steps pull payloads from C2, inflating the bytes transferred and the number of
    distinct destinations beyond what a normal layer/package pull requires; DGA-style C2 domains also
    show abnormal character entropy and length, and failed lookups produce NXDOMAIN bursts. Baselining
    each host's per-build downloaded byte volume and distinct-destination count over 30 days and flagging
    builds above 3 sigma, plus scoring domain entropy/length against the baseline at the 95th percentile
    and treating NXDOMAIN bursts as a separate failure-mode signal, surfaces anomalous builds that pure
    rule matching would miss. A high-scoring build warrants pivoting to the destination and downloaded
    artifacts; baseline-consistent builds can be deprioritized.
  answer_sources: *id001
  range: Last 90 days; baseline window of 30 days per host.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each host:\n  base = stats(avg,std) of (download_bytes, distinct_dest_count) over builds\
      \ in last 30d\n  FOR each build today:\n    if build.download_bytes > base.avg_bytes + 3*base.std_bytes\n\
      \       OR build.distinct_dest_count > base.avg_dest + 3*base.std_dest:\n      flag(host, build,\
      \ 'volume/destination anomaly')\n    for d in build.domains:\n      if entropy(d) >= p95(base.entropy)\
      \ OR len(d) >= p95(base.len): flag(d,'dga-like')\n    if count(NXDOMAIN in build_window) > nxdomain_threshold:\
      \ flag(host,'nxdomain burst')"
- question: When a supervised classifier is applied to build-time network features (JA3/JA3S, ports, bytes,
    duration, ASN) and a character-level model to build-associated DNS, are any connections classified
    as C2 or any domains classified as algorithmically generated, with the top contributing features explained?
  context: Some host-built malicious images use C2 channels that evade static allow-lists and TI but exhibit
    learnable patterns in TLS fingerprints, flow shape, and domain structure. Training a Random Forest
    on build-time network features and a character-level LSTM on build DNS lets the analyst classify likely
    C2 connections and DGA domains, with SHAP/LIME surfacing the top-3 contributing features per alert
    for explainability and triage. Generate labeled build-then-C2 events with Stratus Red Team to validate
    the model. A confident malicious classification on a build connection strongly supports host-built-image
    C2 staging; explanations let the analyst judge confidence and avoid blindly trusting the model.
  answer_sources: *id001
  range: Last 90 days; retrain/score on rolling windows.
  queries:
  - technology: ML/pseudocode
    query: "features = [ja3, ja3s, dport, bytes_in, bytes_out, duration, dest_asn]\nrf = RandomForest.load('build_c2_rf');\
      \ lstm = CharLSTM.load('dga_lstm')\nfor conn in build_window_connections(host):\n  p = rf.predict_proba(features(conn))\n\
      \  if p_c2 >= 0.8: alert(conn, top3=shap(rf, conn))\nfor d in build_window_dns(host):\n  if lstm.score(d)\
      \ >= 0.8: alert(d, 'dga', top3=lime(lstm,d))"
- question: Does any docker/buildah build command contain evasion-indicative arguments such as --no-cache,
    an unusual Dockerfile path via -f (e.g., /tmp), --build-arg carrying secrets, a stdin or remote build
    context ('docker build -'), or a Dockerfile delivered through a pipeline from curl/wget?
  context: These flags and contexts let an adversary force re-download of layers (--no-cache), supply
    a Dockerfile from an unusual or transient location, inject secrets, or build from an off-disk/remote
    context so the build instructions are never persisted for inspection - all useful for evading defenses
    that examine on-host Dockerfiles. Flagging build commands whose flag set deviates from the documented
    legitimate flags, and cross-checking against Falco rules for fetch utilities inside containers, identifies
    builds engineered for stealth. Captured in EID 4688 process arguments or the Docker daemon API, a
    match should prompt review of the build context source and any fetched content; a clean, standard
    flag set is reassuring.
  answer_sources: &id002
  - Windows Event ID 4688
  - docker:daemon POST /build
  - 'NAI: Container host systems, Developer workstations, CI/CD pipeline servers'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "INDEX (EID 4688 OR docker:daemon POST /build)\nWHERE proc IN [docker,buildah] AND args CONTAINS\
      \ 'build'\nAND (args CONTAINS '--no-cache'\n     OR args MATCHES '-f\\s+/tmp/'\n     OR args CONTAINS\
      \ '--build-arg' AND args MATCHES '(secret|token|password|key)='\n     OR args MATCHES 'build\\s+-$'\
      \              // stdin context\n     OR args MATCHES 'build\\s+https?://|git://' // remote context\n\
      \     OR parent_cmd MATCHES '(curl|wget).*\\|.*docker build')\nEMIT alert(host, user, args)"
- question: How similar is a build's flag set to the user/host's own 30-day baseline (Jaccard similarity),
    and is the build the first-ever occurrence of a given evasion flag for that host or user?
  context: Even individually-legitimate flags become suspicious when they break from an entity's established
    pattern. Computing the Jaccard similarity between a build's flag set and the user/host 30-day baseline
    and alerting when similarity falls below 0.2 catches builds that look structurally unlike anything
    the entity normally does, while tracking per-host frequency of evasion flags and flagging first-ever
    occurrences catches the introduction of new tradecraft. Low similarity or a first-seen evasion flag
    should be triaged against the corresponding build context and network activity; high similarity to
    a developer's normal pattern reduces concern.
  answer_sources: *id002
  range: Last 90 days; baseline window of 30 days per user/host.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each (user,host):\n  baseline_flags = set of flags seen across builds in last 30d\n  evasion_flag_counts\
      \ = histogram(evasion_flags) over 30d\n  FOR each build today:\n    sim = jaccard(build.flags, baseline_flags)\n\
      \    if sim < 0.2: flag(user,host,build,'rare flag combination')\n    for f in build.flags intersect\
      \ EVASION_FLAGS:\n      if evasion_flag_counts[f] == 0: flag('first-ever evasion flag', f)"
- question: When build-command arguments are vectorized and scored by an unsupervised model (Isolation
    Forest or one-class SVM), are any build commands flagged as structurally anomalous, with the most
    anomalous tokens reported?
  context: Adversary build commands often differ structurally from normal builds in ways no single rule
    anticipates. Vectorizing build arguments and applying an Isolation Forest or one-class SVM trained
    on legitimate builds detects outlier command structures, and reporting the top-3 anomalous tokens
    lets the analyst see why a command was flagged. This complements the symbolic flag rule and rarity
    scoring by catching novel argument combinations. An anomalous command with suspicious tokens warrants
    inspection of the build context and resulting image; consistently normal scores support benign activity.
  answer_sources: *id002
  range: Last 90 days; retrain on rolling baseline.
  queries:
  - technology: ML/pseudocode
    query: "X = tokenize_and_vectorize(build_command_args)   // bag-of-tokens / char n-grams\nmodel =\
      \ IsolationForest.fit(X_train_legit_builds)  // or OneClassSVM\nfor cmd in todays_builds:\n  score\
      \ = model.decision_function(vectorize(cmd))\n  if score < anomaly_threshold:\n    alert(cmd, top3_tokens=most_anomalous_tokens(cmd))"
- question: Is any container build process running on a host that is not a designated build server or
    developer workstation (e.g., a domain controller, database server, production app server), or executed
    under a user/service account not associated with development or CI/CD roles?
  context: NIST SP 800-190 recommends restricting which hosts may build and run images; an adversary who
    has compromised a non-build host may invoke the build API there to stage malware, making off-role
    builds inherently suspicious. Alerting when build processes run on hosts or under accounts outside
    the authorized build allow-lists enforces least-privilege build placement and surfaces builds occurring
    where none should. A build on a domain controller or by a service account with no dev role is a high-fidelity
    signal of misuse and should trigger investigation of how the build was initiated and what image it
    produced; builds on sanctioned build infrastructure by dev/CI accounts are expected.
  answer_sources: &id003
  - Windows Event ID 4688
  - docker:daemon POST /build
  - 'NAI: Domain controllers, Production application servers, Database servers, Container host systems,
    Identity and Access Management (IAM) systems'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "INDEX (EID 4688 OR docker:daemon POST /build) WHERE proc IN [docker,buildah] AND args CONTAINS\
      \ 'build'\nLOOKUP host_role(host), user_role(user)\nWHERE host NOT IN build_host_allowlist\n   OR\
      \ user NOT IN build_user_allowlist\n   OR host_role IN ['domain_controller','database','prod_app']\n\
      EMIT alert(host, host_role, user, user_role, build.cmd)"
- question: Considering each host's and user's 30-day build history, is this a first-ever build for the
    host (historical build count of zero) or is the executing account in the bottom percentile of build
    rarity?
  context: Even within environments that permit builds broadly, the statistical profile of who builds
    and where is stable. Tracking each host's 30-day build frequency and flagging builds where the historical
    count is zero (a first-ever builder), and ranking users by build rarity to flag accounts in the bottom
    percentile, catches the sudden appearance of build activity on a host or by an account that has never
    built before - consistent with an adversary opportunistically using the build API on a compromised
    system. A first-ever or bottom-percentile builder should be correlated with host role and network
    activity; established builders are lower priority.
  answer_sources: *id003
  range: Last 90 days; baseline window of 30 days.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each host: hist = count(builds over last 30d)\n  if hist == 0 and build_today: flag(host,'first-ever\
      \ builder')\nuser_rank = percentile_rank(user, by build_count over 30d)\nfor user with build_today:\n\
      \  if user_rank <= 5th_percentile: flag(user,'rare builder')"
- question: When a one-class SVM is trained on build-event features (user group, host role tag, time-of-day,
    image base), are any build events flagged as anomalous, and across identical build-agent fleets does
    any agent's syscall distribution diverge from its peers?
  context: 'Off-role and off-hours builds, or builds from unusual base images, may not each trip an allow-list
    but together form an anomalous profile. A one-class SVM on build-event features detects these multi-feature
    deviations and surfaces the top-3 deviating features. Additionally, across identical build-agent fleets,
    comparing each agent''s syscall distribution to its peers (ReplicaWatcher-style) gives a training-less
    detector: the agent whose behavior diverges from otherwise-identical replicas is suspect. An anomalous
    build event or divergent agent should prompt deeper review of that host''s builds and runtime behavior;
    profiles matching the fleet norm are reassuring.'
  answer_sources: *id003
  range: Last 90 days.
  queries:
  - technology: ML/pseudocode
    query: "feat = [user_group, host_role_tag, hour_of_day, base_image]\noc = OneClassSVM.fit(feat_legit_builds)\n\
      for b in todays_builds:\n  if oc.predict(feat(b)) == -1: alert(b, top3=deviating_features(b))\n\
      # replica divergence\nfor fleet in identical_build_agent_fleets:\n  d = syscall_distribution(agent)\n\
      \  if js_divergence(d, fleet_consensus) > tau: alert(agent,'replica divergence')"
- question: During a build, did the host connect to any domain or IP outside the approved set of container
    registries, package mirrors, and source-code-management repositories?
  context: Legitimate builds reach a well-known, finite set of package repositories, registries, and SCM
    sites. Alerting when build-time connections target destinations outside that approved set - aligned
    with trusted-registry enforcement and Falco non-allow-listed outbound rules - directly exposes the
    C2/payload fetch an adversary hides inside a build. Unlike TI matching, this catches novel infrastructure
    not yet in any feed. A build-time connection to a non-allow-listed destination is a strong lead to
    pivot on; builds that touch only approved endpoints are expected.
  answer_sources: &id004
  - docker:daemon POST /build
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, DNS resolvers, Container host systems'
  range: Last 90 days; correlate connections to the build window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "JOIN build_events ON host WITH Zeek conn.log/dns.log WHERE conn.ts IN build_window\nWHERE\
      \ conn.dest_domain NOT IN registry_pkg_scm_allowlist\n  AND conn.dest_ip NOT IN registry_pkg_scm_ip_allowlist\n\
      EMIT alert(host, build.cmd, conn.dest, conn.bytes)"
  - technology: Falco/pseudocode
    query: 'rule: build-egress-not-allowlisted

      condition: container.image.build_in_progress and evt.type=connect and not fd.sip in (registry_allowlist)

      output: "non-allowlisted build egress (dest=%fd.rip bytes=%evt.res)"'
- question: Among build-time destinations, do any resolve to rare ASNs (outside the top 98% baseline),
    carry abnormal non-allow-listed transferred byte volume, or coincide with bursts of blocked/failed
    connections and NXDOMAIN responses?
  context: Malicious builds reach novel C2 infrastructure that tends to live in rarely-seen ASNs and may
    generate failed/blocked connections and NXDOMAIN responses as the adversary's infrastructure cycles.
    Scoring build destinations by ASN frequency against a top-98% baseline to flag rare ASNs, profiling
    non-allow-listed transferred byte volume, and treating blocked/failed-connection and NXDOMAIN bursts
    as distinct failure-mode signals enriches the analyst's view of where a build reached and how reliably.
    A rare-ASN, high-volume, or failure-heavy build destination is a strong pivot point; destinations
    in common, expected ASNs with clean connections are lower concern.
  answer_sources: *id004
  range: Last 90 days; baseline window of 30 days.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "asn_freq = frequency table of dest_asn over 30d; top98 = ASNs covering 98% of volume\nfor\
      \ conn in build_window_connections:\n  if conn.dest_asn NOT IN top98: flag(conn,'rare ASN')\n  if\
      \ conn.dest NOT IN allowlist: accumulate non_allowlisted_bytes\nflag if non_allowlisted_bytes >\
      \ baseline+3*std\nif count(blocked/failed conn in window) > thr OR count(NXDOMAIN) > thr: flag('failure-mode\
      \ burst')"
- question: Does a forecasting model show build-time non-allow-listed transfer volume deviating beyond
    3 sigma from expectation, or a character-level DGA classifier flag any build DNS as algorithmically
    generated?
  context: Adversary payload fetches and C2 during builds produce egress volume and domains that depart
    from learned-normal patterns. Forecasting non-allow-listed transfer volume with Prophet/ARIMA and
    alerting on >3 sigma deviations catches abnormal data movement during builds, while a character-level
    LSTM DGA classifier over build DNS catches algorithmically generated C2 domains; reporting the top-3
    contributing features per alert aids triage. A volume spike or DGA hit during a build points to hidden
    payload retrieval or C2 and should be investigated; forecasts and DNS that match normal patterns reduce
    concern.
  answer_sources: *id004
  range: Last 90 days; forecast on rolling history.
  queries:
  - technology: ML/pseudocode
    query: 'series = hourly non_allowlisted_transfer_bytes during builds

      model = Prophet.fit(series)  // or ARIMA

      yhat = model.predict(now)

      if observed > yhat + 3*sigma: alert(''egress volume anomaly'', top3_features)

      lstm = CharLSTM.load(''dga_lstm'')

      for d in build_dns: if lstm.score(d) >= 0.8: alert(d,''dga'', top3_features)'
- question: Within a short window (about 10 minutes) on one host, did a 'docker build' complete, a 'docker
    run' start using the newly built image, and the resulting container then connect to a TI-listed C2
    destination or execute a binary from tmpfs/shared memory (/dev/shm, /run/shm)?
  context: 'This is the core T1612 -> T1610 chain: build a custom image on the host, immediately deploy
    it, and execute. Alerting when a build->run sequence occurs on one host and the run stage connects
    to a TI C2 destination or executes a binary from tmpfs/shared memory (a fileless execution technique)
    captures the end-to-end attack rather than isolated events, dramatically raising fidelity. Correlate
    Docker daemon build/run events with auditd/Sysmon-for-Linux exec events and Zeek network logs, reinforced
    by Falco rules. A complete build->run->C2/fileless chain is high-confidence malicious activity demanding
    immediate response; an incomplete or benign chain can be deprioritized.'
  answer_sources: &id005
  - docker:daemon POST /build
  - Windows Event ID 4688
  - Linux syscalls (auditd/Sysmon for Linux)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Container host systems, Network egress points, Internal network segments'
  range: Last 90 days; correlate events within a 10-minute window per host.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SEQUENCE on host within 10m:\n  A: docker build / POST /build completes -> image_id\n  B:\
      \ docker run uses image_id\n  C: (Zeek conn.log dest IN ti_c2) OR (auditd/Sysmon exec path MATCHES\
      \ '/dev/shm/|/run/shm/')\nWHERE A precedes B precedes C\nEMIT alert(host, image_id, run.container,\
      \ c2_or_fileless_detail)"
  - technology: Falco/pseudocode
    query: 'rule: exec-from-shared-memory

      condition: spawned_process and proc.exepath startswith (/dev/shm/, /run/shm/)

      output: "fileless exec from shm in container (proc=%proc.cmdline image=%container.image.repository)"'
- question: Do the network connections from a freshly built/run container show near-zero inter-arrival
    jitter (standard deviation <1s over a 60s window) indicating beaconing, and do the build/run syscall
    frequency vectors deviate from baseline?
  context: C2 channels from a deployed malicious image often beacon with highly regular timing, while
    the build and run stages themselves produce syscall patterns that differ from legitimate deployments.
    Scoring connection inter-arrival standard deviation and flagging near-zero jitter (<1s over 60s) detects
    beaconing, and representing build/run syscalls as Bag-of-System-Calls frequency vectors over sliding
    windows and flagging distributions deviating from baseline detects abnormal runtime behavior. Regular
    beaconing plus anomalous syscall distributions strongly indicate an active C2 implant from a host-built
    image; jittered/irregular traffic and baseline-consistent syscalls are less concerning.
  answer_sources: *id005
  range: Last 90 days; analyze 60s sliding windows for beaconing.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for container from recent build->run:\n  iat = inter_arrival_times(connections to each dest\
      \ over 60s windows)\n  if stddev(iat) < 1s and count(iat) >= N: flag('beaconing', dest)\n  bosc\
      \ = frequency_vector(syscalls over sliding window)\n  if distance(bosc, baseline_bosc) > tau: flag('syscall\
      \ distribution anomaly')"
- question: When an HMM or sequence model trained on legitimate build->run deployment chains scores observed
    build-run-network sequences, are any flagged as low-probability, and across identical hosts does replica
    syscall-distribution divergence flag a deviant host?
  context: Legitimate deployments follow learnable build->run->network sequences; adversary chains that
    staple malware into the image and immediately call C2 produce low-probability sequences. Training
    an HMM/sequence model on legitimate chains and flagging low-probability build-run-network events -
    choosing frequency, sequence, or graph syscall representations to control false positives and surfacing
    the top-3 contributing features - catches the abnormal end-to-end flow. Across identical hosts, replica
    syscall-distribution divergence offers a training-less detector that flags the host behaving unlike
    its peers. A low-probability chain or divergent replica should be investigated as a likely host-built-image
    compromise; high-probability, peer-consistent sequences are expected.
  answer_sources: *id005
  range: Last 90 days.
  queries:
  - technology: ML/pseudocode
    query: "model = HMM.fit(sequences_of_legit_build_run_network)\nfor seq in todays_build_run_network_sequences(host):\n\
      \  if model.logprob(seq) < log_threshold:\n    alert(host, seq, top3=contributing_features(seq))\n\
      # training-less replica check\nfor host in identical_host_group:\n  if js_divergence(syscall_dist(host),\
      \ group_consensus) > tau:\n    alert(host,'replica syscall divergence')"
