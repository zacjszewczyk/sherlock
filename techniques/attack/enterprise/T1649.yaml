  context: 'Why this matters: Under the Credential Access tactic (TA0006), the adversary steals or forges
    authentication certificates to obtain credentials that survive password resets and enable lateral
    movement, privilege escalation, and persistence. This evidence focuses on the condition that file
    system auditing logs show a process creating or modifying a file with a certificate extension (e.g.,
    .pfx, .p12, .pem) in a non-standard directory (e.g., network share, user''s temp folder), immediately
    followed by an outbound network connection from the same process. The Machine Learning approach works
    as follows: Score the per-process sequence (by Process GUID) within a short window: (1) write a `.pfx/.pem`
    file (4663); (2) outbound connection (conn.log); (3) certificate-MIME file transferred (files.log).
    Train a sequence/anomaly model ([Extended Isolation Forest](https://arxiv.org/pdf/1811.02141) over
    windowed features) and emit the top-3 contributing steps/features via SHAP per the [SHAP-in-IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    High-severity alert on the full chain; keep the deterministic SACL rule independent. A positive result
    -- a rule match, a statistical outlier, or a model alert -- indicates probable certificate theft,
    forgery, or abuse; pivot to the responsible process and its parent lineage, the user and host, the
    certificate/template/key involved, and any subsequent authentication or outbound transfer to scope
    the compromise and the accounts at risk. A negative result helps rule out this particular vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    living-off-the-land, or novel certificate-abuse variants.'
