questions:
- question: '[Credential Access] Using the ''Match process hashes and TLS certificate thumbprints against
    known-bad watchlists'' (Symbolic Logic) approach: can you determine whether a process execution event
    where the process file hash matches a known hash of a certificate theft tool, or a network connection
    is observed using a TLS certificate whose thumbprint matches a known malicious certificate.'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), the adversary steals or forges
    authentication certificates to obtain credentials that survive password resets and enable lateral
    movement, privilege escalation, and persistence. This evidence focuses on the condition that a process
    execution event where the process file hash matches a known hash of a certificate theft tool, or a
    network connection is observed using a TLS certificate whose thumbprint matches a known malicious
    certificate. The Symbolic Logic approach works as follows: Create a SIEM rule that joins the process
    hash from process creation events (Windows Event ID 4688/Sysmon EID 1) against a watchlist of hashes
    for known certificate-abuse tools (Certipy, Certify/ForgeCert, Mimikatz `crypto::`, Rubeus), per the
    AD CS tradecraft in [Certified Pre-Owned](https://specterops.io/wp-content/uploads/sites/3/2022/06/Certified_Pre-Owned.pdf)
    and [Certipy](https://github.com/ly4k/Certipy). Separately, join the certificate thumbprint (`id`
    field) from Zeek x509.log against a watchlist of malicious certificate thumbprints/serials. ALSO enforce
    the deterministic forged-certificate signal of digest mismatch / signature-status=Invalid (Windows
    error 0x80096010 Bad Digest) from [Certified Malware](https://doi.org/10.1145/3133956.3133958). Alert
    text must include the matched hash/thumbprint, process, and user. Generate a high-severity alert on
    any match; never remove this hard match layer. A positive result -- a rule match, a statistical outlier,
    or a model alert -- indicates probable certificate theft, forgery, or abuse; pivot to the responsible
    process and its parent lineage, the user and host, the certificate/template/key involved, and any
    subsequent authentication or outbound transfer to scope the compromise and the accounts at risk. A
    negative result helps rule out this particular vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, living-off-the-land, or novel certificate-abuse
    variants.'
