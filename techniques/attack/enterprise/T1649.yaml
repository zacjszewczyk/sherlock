name: 'T1649: Steal or Forge Authentication Certificates'
id: d9744172-8c10-447c-87a3-a97bbb9074f6
description: 'This playbook helps an analyst investigate whether an adversary has accessed credentials
  by stealing or forging authentication certificates (MITRE ATT&CK T1649, Steal or Forge Authentication
  Certificates) under the Credential Access tactic. Digital certificates bind to an identity and can be
  used as durable authentication material; Active Directory Certificate Services (AD CS) certificates
  and Entra ID device certificates can serve as credentials for domain or machine accounts. Adversaries
  steal certificates from the Windows certificate store, the registry, files, Linux key directories (/etc/ssl,
  /etc/pki, ~/.pki/nssdb), and macOS Keychains, or they abuse certificate enrollment (ESC1-ESC8 misconfigurations,
  SAN abuse, NTLM relay to the web-enrollment endpoint) to request authentication-capable certificates,
  and may forge ''golden'' certificates with a stolen CA private key. The hunt spans Windows, Linux, macOS,
  and identity-provider telemetry and pursues the behavior from several complementary angles: process
  executions and TLS thumbprints matching known certificate-abuse tooling (Certipy, Certify/ForgeCert,
  Mimikatz crypto::, Rubeus); command-line and PowerShell script-block patterns of certificate enumeration,
  request, export, and theft; suspicious CA enrollment requests where the requester, template, or Subject
  Alternative Name violates policy; private-key export and key-store access by non-allow-listed processes;
  anomalous certificate-based logons (Kerberos PKINIT / Schannel) by unexpected accounts, from rare geographies
  or new devices; and the theft-to-exfiltration sequence where a certificate file is staged to disk and
  then transmitted outbound. Detection methods combine deterministic symbolic-logic rules (hash/thumbprint
  watchlists, ESC template/SAN policy enforcement, SACL-audited key and file access, certificate-logon
  watchlists), statistical baselining (execution frequency and failure-state profiling, command-line entropy,
  requester-template rarity, new-actor and impossible-travel scoring, outbound transfer volume percentiles),
  and explainable machine learning (gradient-boosted and isolation-forest classifiers, graph link-prediction
  over enrollment and authentication edges, multivariate time-series detectors, with SHAP-surfaced top
  contributing features), applied across Windows Security events (4688, 4104, 4886/4887/4888/4898, 5058/5059,
  4663, 4768/4771, 4624), auditd SYSCALL, macOS unified/keychain logs, Azure/M365 sign-in and audit logs,
  and Zeek x509/conn/files logs, so the analyst can corroborate suspected certificate theft or forgery
  across process lineage, enrollment activity, key access, and authentication telemetry.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
