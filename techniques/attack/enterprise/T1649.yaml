      \ joins the process hash from process creation events (Windows Event ID 4688/Sysmon EID 1) against\
      \ a watchlist of hashes for known certificate-abuse tools (Certipy, Certify/ForgeCert, Mimikatz\
      \ `crypto::`, Rubeus), per \n| correlate over NAI: Domain Controllers, Certificate Authority Servers,\
      \ All Endpoints, Network Egress Points\n| emit alert with contributing fields and entity context\
      \ (process, parent, user, host, certificate/template/thumbprint, key path, destination)"
  - technology: Zeek/pseudocode
    query: '# Match process hashes and TLS certificate thumbprints against known-bad watchlists (Zeek
      view)

      watch x509.log/conn.log/files.log for certificate-related activity

      | join thumbprint/serial and file MIME (application/x-pkcs12, x-x509-ca-cert)

