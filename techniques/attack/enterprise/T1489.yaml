name: 'T1489: Service Stop'
id: 236380f5-020d-44c6-a8de-3ccfdd79eafd
description: Investigate potential adversary attempts to disrupt system or business availability by stopping,
  disabling, or reconfiguring services across Windows, Linux, macOS, ESXi, and cloud/IaaS environments
  (MITRE ATT&CK T1489, Service Stop). Adversaries halt critical security and data services (e.g., WinDefend,
  Sysmon, EDR agents, MSExchangeIS, MSSQLSERVER, VSS, SQLWriter, wbengine) using native utilities such
  as net stop, sc.exe, taskkill, Stop-Service, systemctl/service stop, killall/pkill, launchctl bootout/disable,
  and esxcli/vim-cmd power-off, frequently as a precursor to Data Destruction (T1485) or Data Encrypted
  for Impact (T1486). This playbook helps an analyst hunt for service-control command execution and critical-service
  stops, detect mass-stop bursts by a single user or host, correlate data-protection service stops with
  shadow-copy deletion, mass file modification, or large data egress, identify service startup-configuration
  tampering (Start=Disabled or ImagePath changes) by non-allowlisted processes, and surface coordinated
  concurrent service stops across logically grouped assets. It combines symbolic-logic correlation rules,
  statistical baselining and change-point detection, and machine-learning classifiers, sequence models,
  and anomaly detectors to separate routine administrative activity from destructive impact operations.
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any process execute a service-control command (net stop, sc stop, taskkill, Stop-Service,
    systemctl/service stop, killall/pkill, launchctl bootout/disable, or esxcli/vim-cmd power-off) where
    the process hash matches a threat-intelligence watchlist, OR did any process stop a critical security
    or data service (WinDefend, SysmonSvc, MsSense/EDR agent, MSExchangeIS, MSSQLSERVER, VSS, SQLWriter)
    regardless of reputation, and did the stop succeed or fail with access-denied?
  context: Service Stop is an Impact technique adversaries use to take down defenses or data services
    before destruction or encryption, tying directly to the question of whether the adversary is disrupting
    availability. This correlation joins process-creation events (Windows EID 4688 / Sysmon 1; Linux auditd
    execve; ESXi hostd) with a malicious-hash feed to catch known-bad tooling, while a watchlist of critical
    service names catches defense-evasion or pre-impact staging even from clean, signed binaries. A successful
    stop indicates active impact; a failed stop (ERROR_ACCESS_DENIED) is a distinct, lower-volume signal
    of reconnaissance or insufficient privilege and should be profiled separately. Validate coverage against
    the exact attacker command strings in Atomic Red Team T1489 and portable SigmaHQ rules.
  answer_sources: &id001
  - Windows Event ID 4688
  - Windows Event ID 7036
  - 'NAI: All managed endpoints and servers, especially security infrastructure servers hosting AV/EDR
    management consoles.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source IN (EID4688, Sysmon1, auditd_execve, esxi_hostd)
      | where match(process_name, "(?i)net\\.exe|sc\\.exe|taskkill|powershell|systemctl|service|killall|pkill|launchctl|esxcli|vim-cmd")
            and match(command_line, "(?i)stop|bootout|disable|power\\.off|vmsvc/power")
      | lookup ti_hashes process_hash OUTPUT ti_match
      | where ti_match=true
      | eval severity="high" | emit alert
  - technology: SIEM/Rule pseudocode
    query: |-
      source=EID7036
      | where service_name IN ("WinDefend","SysmonSvc","MsSense","MSExchangeIS","MSSQLSERVER","VSS","SQLWriter")
            and state="stopped"
      | eval result=if(status_code="ERROR_ACCESS_DENIED","failed","success")
      | eval severity=if(result="success","high","medium")
      | emit alert by host, service_name, user, result
- question: For service-stop commands, do the command-line arguments exhibit anomalously high entropy
    (top 5th percentile) suggesting obfuscation, or is the (process, user, target service) tuple rare
    (above the 98th percentile of inverse-frequency)?
  context: Sophisticated actors obfuscate or encode service-stop commands to evade signature rules, and
    they often stop services they have never touched before. Building a per-parent-process (powershell.exe,
    cmd.exe, bash) frequency distribution of arguments and scoring entropy flags encoded or padded command
    lines, while inverse-frequency rarity scoring of (process, user, target service) tuples surfaces never-before-seen
    stop activity that signatures miss. A high-entropy stop command or a rare tuple, especially against
    a critical service, warrants investigation; benign administrative stops cluster in low-entropy, high-frequency
    space. Ground any file-impact confirmation in write-buffer entropy and overwrite/delete ratio statistics
    so a follow-on destructive action is not missed.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source IN (EID4688, Sysmon1) | where match(command_line, "(?i)stop|disable|bootout")
      | eval ent=shannon_entropy(command_line)
      | eventstats perc95(ent) as p95 by parent_process
      | where ent >= p95 | emit alert by host,user,command_line,ent
  - technology: SIEM/Stats pseudocode
    query: |-
      source IN (EID7036, EID4688) | stats count by process, user, target_service
      | eval rarity = 1/(count)
      | eventstats perc98(rarity) as p98
      | where rarity >= p98 | emit alert by process,user,target_service,rarity
- question: Does a supervised classifier (Random Forest / Gradient Boosting) score a service-stop process
    execution as malicious, and what are the top-3 contributing features (parent process, integrity level,
    argument keywords, target-service criticality, stop success/fail) driving that score?
  context: Rule and threshold logic miss novel combinations of benign-looking attributes; a supervised
    model trained on labeled EID 4688/Sysmon 1 and EID 7036 data learns the multivariate signature of
    malicious service stops. Engineered features include parent process, user/integrity level, argument
    count and keyword presence, target-service criticality, and stop success/fail state. The model outputs
    a benign/malicious probability and, critically for SOC triage, surfaces the top-3 contributing features
    in the alert text so the analyst can immediately judge plausibility. Use generic kernel-event ransomware
    behavior as positive-class guidance. A high-probability score with criticality and off-hours among
    the top features is a strong impact indicator.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features = extract(EID4688|Sysmon1|EID7036:
         parent_process, user_integrity, arg_count, stop_keyword_flag,
         target_service_criticality, stop_result)
      | score = rf_model.predict_proba(features)
      | where score >= 0.8
      | eval top3 = shap_top_features(features,3)
      | emit alert with score, top3
- question: Did any single user account or source host stop more than 5 distinct services within a 60-second
    sliding window, on one or across multiple hosts?
  context: Mass service stops in a tight window are a hallmark of destructive or ransomware operations
    that systematically disable defenses and data services before impact, directly answering whether the
    adversary is disrupting availability. Aggregating service-stop events (EID 7036) and stop commands
    (EID 4688 / auditd execve) by user and source host and triggering when distinct services stopped exceeds
    5 in 60 seconds catches this burst. Because most hosts stop 0-1 services per minute, the threshold
    should be tuned to the per-host 99th-percentile baseline. A service account or host suddenly stopping
    many distinct services, especially across a server group hosting the same application, is high-fidelity.
    Validate against the mass-stop command sequences in Atomic Red Team T1489 and SigmaHQ.
  answer_sources: &id002
  - Windows Event ID 4688
  - Windows Event ID 7036
  - 'NAI: All managed endpoints and servers, with a focus on server groups hosting the same application
    (e.g., web farms, database clusters).'
  range: Last 90 days; evaluate on a 60-second sliding window
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source IN (EID7036, EID4688, auditd_execve) | where action="service_stop"
      | bin _time span=60s
      | stats dc(service_name) as distinct_services by _time, user, host
      | where distinct_services > 5 | emit alert by user,host,distinct_services
- question: Does a host's service-stop rate exceed its dynamic baseline (mu + 3 sigma of a 30-day moving
    average), or does change-point detection (CUSUM/PELT/Bayesian online CPD) flag an abrupt regime shift
    in its per-host stop-count series?
  context: A fixed count threshold misses hosts whose normal behavior differs or where attackers stay
    just under it. Establishing an hourly per-host baseline of EID 7036 stop events with a 30-day moving
    average and standard deviation, then alerting when a 5-minute interval exceeds mu + 3 sigma, adapts
    to each host's normal rhythm. Layering change-point detection on the per-host stop-count series catches
    abrupt regime shifts that a static sigma threshold misses. Seasonal-trend decomposition suppresses
    diurnal and maintenance seasonality so patch windows do not generate noise. An out-of-baseline spike
    or a sudden change point on a production host is a strong signal of coordinated availability impact.
  answer_sources: *id002
  range: Last 90 days; baseline 30 days, evaluate 5-minute intervals
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source=EID7036 | bin _time span=5m | stats count as stops by _time, host
      | join host [ baseline: avg(stops) as mu, stdev(stops) as sd over 30d ]
      | where stops > mu + 3*sd | emit alert by host,_time,stops
  - technology: SIEM/Stats pseudocode
    query: |-
      series = per_host_stop_counts(EID7036, span=5m)
      | cp = change_point_detect(series, method="PELT|CUSUM")
      | where cp.shift_magnitude high | emit alert by host, cp.time
- question: Do DBSCAN density clustering or Isolation Forest isolate rare mass-stop bursts at enterprise
    scale based on windowed features (stop count, distinct services, off-hours flag, failed-stop count),
    and what features drive the anomaly?
  context: 'Unsupervised methods catch coordinated mass-stop activity without predefined thresholds. DBSCAN
    over service-stop events (features: timestamp, host, user, distinct-service count) detects dense temporal
    bursts, while Isolation Forest over per-host/per-user windowed feature vectors isolates rare mass-stop
    patterns enterprise-wide. Surfacing the top-3 contributing features (e.g., distinct_services=14, off_hours=1,
    user=svc_backup) lets the analyst quickly judge whether the cluster represents an attack or a legitimate
    bulk maintenance event. An isolated off-hours burst from a service account stopping many distinct
    services is a strong impact indicator.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      events = EID7036 + EID4688(service_stop)
      | dbscan(features=[timestamp,host,user,distinct_service_count])
      | vec = window_features(host,user: stop_count,distinct_services,off_hours,failed_stops)
      | iso = IsolationForest.fit(vec).score(vec)
      | where iso anomalous | emit alert with top3_features
- question: Was a data-protection service stop (VSS, SQLWriter, wbengine, Veeam*) followed within 15 minutes
    on the same host by (a) a shadow-copy/recovery deletion command (vssadmin/wmic/bcdedit/wbadmin), (b)
    more than 1000 file-modification events (EID 4663), or (c) more than 100MB of outbound traffic (Zeek
    conn.log)?
  context: Stopping a data-protection service is rarely an end in itself; it is the setup move before
    data destruction, ransomware encryption, or exfiltration, so the stateful chain is the highest-confidence
    impact signal. Condition 1 is a stop event (EID 7036) for a Data Protection Services watchlist member;
    condition 2, within 15 minutes on the same host, is recovery-inhibition (EID 4688 for vssadmin.exe/wmic.exe/bcdedit.exe/wbadmin.exe
    with deletion arguments per Atomic Red Team T1490), a file-modification spike above 1000 (EID 4663),
    or outbound bytes above 100MB (Zeek conn.log). Meeting both conditions should raise a critical alert
    because it captures the stop-then-destroy or stop-then-exfiltrate lifecycle in near real time.
  answer_sources: &id003
  - Windows Event ID 7036
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: File servers, database servers, virtualization hosts, backup infrastructure servers, and network
    egress points (e.g., Internet gateway).'
  range: Last 90 days; correlate within a 15-minute window centered on the stop event
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      stop = EID7036 where service_name IN ("VSS","SQLWriter","wbengine","Veeam*") and state="stopped"
      | followed_by within 15m same host:
          A = EID4688 where proc IN (vssadmin,wmic,bcdedit,wbadmin) and match(cmd,"(?i)delete|shadow|recoveryenabled no")
          OR B = count(EID4663 file_mod) > 1000
          OR C = sum(zeek_conn.orig_bytes) > 100MB
      | if stop AND (A OR B OR C): emit critical_alert
- question: After a VSS or SQLWriter stop, does any 5-minute outbound volume exceed the host's 99th-percentile
    hourly baseline, or do file-I/O features (write-buffer entropy, overwrite/delete ratio, file-type
    funneling, per-process read/write/rename rates) spike during the heightened-monitoring window?
  context: Rather than waiting for a fixed 100MB threshold, this approach precomputes each host's 99th-percentile
    hourly outbound volume (Zeek conn.log, 30 days) and, upon a critical stop, enters a 30-minute heightened
    state where any 5-minute outbound spike alerts, catching low-and-slow exfiltration relative to that
    host's normal. In parallel, monitoring file-I/O Volume/State features (write-buffer entropy, overwrite/delete
    ratio, file-type funneling, per-process read/write/rename rates) catches encryption or destruction
    following the stop. A post-stop spike in high-entropy writes is strong confirmation that impact is
    underway; the absence of either across the window lowers concern.
  answer_sources: *id003
  range: Last 90 days; baseline 30 days, 30-minute heightened window after stop
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      on EID7036 stop(VSS|SQLWriter) -> set heightened(host, 30m)
      | during heightened: stats sum(orig_bytes) as out by bin(5m), host (zeek_conn)
      | join host [ p99_hourly_out baseline 30d ]
      | where out > p99_hourly_out | emit alert
  - technology: SIEM/Stats pseudocode
    query: |-
      during heightened: per_process file_io_features(
         write_buffer_entropy, overwrite_delete_ratio, filetype_funnel, rw_rename_rate)
      | where write_buffer_entropy high AND overwrite_delete_ratio high
      | emit alert by host,process
- question: Does a sequence model (HMM or LSTM/DeepLog) over the EID 7036/4688/4663 + Zeek event stream
    indicate a high-probability transition from Benign to Service_Stop (Defense Evasion) to Impact (Data
    Encryption/Destruction) immediately after a service stop?
  context: The stop-then-destroy lifecycle is fundamentally a sequence, and sequence models capture order
    and timing that point rules miss. Modeling states (Benign -> Service_Stop_Defense_Evasion -> Impact_Data_Encryption/Destruction)
    with an HMM, or an LSTM log-sequence model (DeepLog) over the EID 7036/4688/4663 plus Zeek stream,
    lets the system alert on a high-probability transition into the Impact state right after a stop. Corroborate
    with kernel-event ransomware behavior and file-tamper/desktop-lock dynamics, and surface the contributing
    event sequence in the alert so the analyst sees the exact chain. A confident transition into Impact
    is a critical, time-sensitive finding.
  answer_sources: *id003
  range: Last 90 days; sequence window spanning the stop and 15-30 minutes after
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      stream = order_by_time(EID7036, EID4688, EID4663, zeek) per host
      | states = HMM|DeepLog.infer(stream)
      | where transition(Service_Stop -> Impact) prob >= 0.8
      | emit critical_alert with contributing_sequence
- question: Was a service's startup configuration changed to Disabled (Start value set to 4) or its ImagePath
    modified under HKLM\SYSTEM\CurrentControlSet\Services by a process not on the approved allowlist (services.exe,
    svchost.exe, msiexec.exe, patch tools), and was it preceded within the last hour by a security-log
    clear (EID 1102)?
  context: Beyond stopping a running service, adversaries persistently disable it by setting the registry
    Start value to 4 (Disabled) or hijack it by altering ImagePath, ensuring defenses stay down across
    reboots. Detecting registry modifications (EID 4657) to Start or ImagePath under the Services key
    where the initiating process is not on an allowlist catches both tactics, and correlating a preceding
    security-log clear (EID 1102) within the last hour raises severity because clearing logs around a
    config change indicates deliberate evasion. Pair with service-config-change events (EID 7040). Legitimate
    changes come from services.exe, svchost.exe, msiexec.exe, or patch tooling during maintenance windows;
    anything else is suspicious.
  answer_sources: &id004
  - Windows Event ID 4657
  - Windows Event ID 7040
  - Windows Event ID 1102
  - 'NAI: Domain Controllers, critical application servers, and endpoint workstations. The registry key
    HKLM\SYSTEM\CurrentControlSet\Services\ is the specific location on these systems.'
  range: Last 90 days; correlate log-clear within 1 hour prior
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      cfg = EID4657 where reg_path matches "HKLM\\SYSTEM\\CurrentControlSet\\Services\\*"
            and ((value_name="Start" and new_value=4) or value_name="ImagePath")
            and process_name NOT IN (services.exe,svchost.exe,msiexec.exe,patch_tools)
      | enrich EID7040 service_config_change
      | if exists(EID1102 within -1h same host): severity=critical else high
      | emit alert
- question: Is a service-configuration-change event rare by inverse-frequency scoring of (ProcessName,
    UserName, TargetService, DayOfWeek, HourOfDay) above the 98th percentile, and are there separately
    tracked failed/denied modification attempts?
  context: Allowlists can be incomplete and attackers may abuse allowlisted tools, so a statistical rarity
    model adds resilience. Maintaining a frequency table of (ProcessName, UserName, TargetService, DayOfWeek,
    HourOfDay) for all service-configuration-change events (EID 7040/4657) and computing an inverse-frequency
    rarity score per new event flags changes that deviate from established patterns, alerting above the
    98th percentile. Tracking failed or denied modification attempts separately captures a distinct failure-mode
    signal indicating an actor probing without sufficient privilege. A rare config change to a critical
    service at an unusual hour, or a cluster of denied attempts, both warrant review.
  answer_sources: *id004
  range: Last 90 days; baseline from full history
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source IN (EID7040, EID4657) | stats count by process,user,target_service,day_of_week,hour_of_day
      | eval rarity=1/count | eventstats perc98(rarity) as p98
      | where rarity >= p98 | emit alert
      ; separately: where result IN (denied,failed) | stats count by user,target_service | emit failure_signal
- question: Does an autoencoder trained on historical service-configuration-change events flag a change
    with reconstruction error above the 99th percentile, and what top-3 features (initiating process,
    parent, user, integrity level, target service, time-of-day, change type) contribute most to the error?
  context: An autoencoder learns the manifold of normal service-configuration changes and reconstructs
    unfamiliar combinations poorly, making reconstruction error a sensitive anomaly score for novel tampering.
    Trained on EID 4657/7040 history with features for initiating process, parent process, user, integrity
    level, target service, time-of-day, and change type, it flags events whose reconstruction error exceeds
    the 99th-percentile threshold. SHAP-style attribution surfaces the top-3 error-contributing features
    in the alert so the analyst understands why the change looked abnormal. A high-reconstruction-error
    disable of a security service by an unusual process is a strong defense-evasion/impact indicator.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features = EID4657|EID7040(init_proc,parent,user,integrity,target_service,hour,change_type)
      | err = autoencoder.reconstruction_error(features)
      | where err >= perc99(err)
      | eval top3 = shap_top_features(features,3)
      | emit alert with err, top3
- question: Did a single service name (e.g., MSExchangeIS) stop concurrently on more than 20% of members
    of a logically defined asset group (Domain Controllers, Exchange servers, VDI instances, DB clusters,
    ESXi hosts) within a 5-minute window?
  context: Coordinated, simultaneous stops of the same service across an asset group indicate a deliberate,
    scaled availability attack rather than isolated administration, directly answering the Impact question
    at fleet scale. Defining logical asset groups and alerting when one service name appears in stop events
    (EID 7036) from more than 20% of group members within a 5-minute window catches this pattern. For
    example, MSExchangeIS stopping across most Exchange servers, or a critical service dropping across
    many ESXi hosts, signals an attempt to take down an entire service tier. Pair with the mass-stop command
    sequences in Atomic Red Team T1489 and SigmaHQ rules.
  answer_sources: &id005
  - Windows Event ID 7036
  - 'NAI: Logically grouped assets such as all Domain Controllers, all Exchange servers, all VDI instances,
    or all hosts within a specific production subnet.'
  range: Last 90 days; evaluate on a 5-minute window
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source=EID7036 state=stopped
      | lookup asset_group host OUTPUT group, group_size
      | bin _time span=5m
      | stats dc(host) as hosts_stopped by _time, group, service_name
      | where hosts_stopped / group_size > 0.20
      | emit alert by group, service_name, hosts_stopped
- question: Does the count of unique services entering a stopped state on a single host within one hour
    exceed that host's 99th-percentile baseline, after suppressing diurnal/maintenance seasonality via
    seasonal-trend decomposition and applying CUSUM/PELT change-point tests?
  context: A single host suddenly stopping an unusual number of distinct services in an hour is a classic
    precursor to host-level impact. Computing the hourly count of unique services entering a stopped state
    (EID 7036) per host, baselining over 30 days, and alerting above the host-specific 99th percentile
    adapts to each host's normal behavior. Seasonal-trend decomposition (series_decompose_anomalies, 1.5-3
    sigma) suppresses diurnal and scheduled-maintenance seasonality to cut false positives, while CUSUM/PELT
    change-point tests catch the abrupt onset of broad disruption that a percentile alone might lag on.
    An out-of-baseline unique-stop count on a production host is a strong impact signal.
  answer_sources: *id005
  range: Last 90 days; baseline 30 days, hourly aggregation
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source=EID7036 state=stopped | bin _time span=1h
      | stats dc(service_name) as unique_stops by _time, host
      | decompose = series_decompose_anomalies(unique_stops, sigma=1.5-3) by host
      | where unique_stops > p99_host OR decompose.anomaly=true
      | changepoint(unique_stops, method=PELT|CUSUM) by host
      | emit alert by host,_time,unique_stops
- question: Does time-series decomposition plus Isolation Forest on the residual of enterprise-wide per-minute
    service-stop volume flag a spike unexplained by normal operational cycles, and which hosts/services
    and residual magnitude drive it?
  context: A coordinated, widespread attack may not breach any single host's baseline yet still represent
    an anomalous enterprise-wide surge. Aggregating service-stop events (EID 7036) per minute across the
    enterprise, decomposing into trend/seasonality/residual, and running Isolation Forest on the residual
    flags spikes that normal operational cycles cannot explain. Reporting the contributing hosts/services
    and the residual magnitude in the alert lets analysts rapidly triage and scope a broad disruption.
    A large unexplained residual concentrated on critical service tiers is a high-priority, fleet-wide
    impact indicator; a residual explained by a known maintenance window is benign.
  answer_sources: *id005
  range: Last 90 days; per-minute enterprise aggregation
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      series = stats count as stops by bin(_time,1m) (EID7036 enterprise-wide)
      | (trend,season,resid) = decompose(series)
      | iso = IsolationForest.fit(resid).score(resid)
      | where iso anomalous
      | emit alert with contributing_hosts, contributing_services, residual_magnitude
