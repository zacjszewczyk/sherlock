name: 'T1176: Software Extensions'
id: da6428ed-f226-4cac-8231-de2099e1049b
description: Investigate adversary abuse of software extensions (browser extensions, IDE/VSCode plugins,
  and similar modular add-ons) to establish persistent access to victim systems. This playbook helps an
  analyst hunt for malicious or weaponized extensions across endpoints, network egress, and developer
  workstations. It correlates browser/IDE process activity with network and DNS telemetry against C2 threat
  intelligence; detects sideloading of unpacked or developer-mode extensions from user-writable paths;
  identifies unauthorized processes reading sensitive browser credential, cookie, and session stores;
  surfaces beaconing and exfiltration patterns (rare destinations, DGA domains, periodic heartbeats, recently
  registered domains, non-standard ports); ties extension installation to host-level persistence (new
  services, scheduled tasks, registry autorun keys); and flags IDE extension hosts reading secrets (SSH
  keys, .env, cloud credentials) outside their own extension directory. Use it to determine whether an
  adversary is maintaining a foothold through malicious or abused software extensions.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has any browser process (chrome.exe, msedge.exe, firefox.exe, etc.) established a network
    connection to an IP, domain, or URL that appears on a high-confidence command-and-control (C2) threat-intelligence
    feed or matches a hardcoded C2 indicator extracted from extension code?
  context: A malicious browser extension inherits the browser's network identity and routinely beacons
    to attacker infrastructure, so a browser process reaching known C2 is a high-fidelity persistence
    indicator under the Persistence tactic. Correlate process-creation events identifying the browser
    with network connection and DNS resolution logs, then match the destination against curated C2 feeds
    and any C2 domains recovered through static analysis of suspect extensions. A positive match strongly
    suggests an active malicious extension maintaining a foothold; a negative result narrows the hunt
    to behavioral methods below. Keep this deterministic IOC rule as the floor of detection even when
    statistical or ML layers are added.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Network egress points, DNS resolvers, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'process_creation(EventID=4688 OR Sysmon=1) WHERE image IN (chrome.exe,msedge.exe,firefox.exe)

      JOIN zeek_conn/zeek_dns ON host,pid,time_window=5m

      WHERE conn.dest_ip IN ti_c2_ips OR dns.query IN ti_c2_domains OR dest IN extension_static_c2

      => ALERT high_fidelity'
  - technology: Zeek/pseudocode
    query: 'conn.log + dns.log: filter orig_proc in browser_set

      lookup dest against high_confidence_c2_feed -> emit match with proc, user, host'
- question: Which browser destinations are statistically rare across the enterprise, and do their volume,
    frequency, or connection-state metrics or a sharp drop in domain-set similarity indicate covert exfiltration
    by an extension?
  context: Marketplace-vetted extensions that are later weaponized often exfiltrate over otherwise normal-looking
    sessions, so prevalence and behavioral-drift scoring catch what IOC lists miss. Analyze browser connections
    for destinations of very low enterprise prevalence (e.g., <0.01% of hosts over 30 days), and track
    bytes-out/bytes-in ratio (Volume), connections per minute (Frequency), and counts of failed/blocked
    connections and NXDOMAIN responses (State) as distinct signals. Separately compute the Jaccard similarity
    between the user's browser destination set today versus their 90-day baseline; a score below a tuned
    threshold (e.g., 0.5) flags significant behavioral change consistent with an extension redirecting
    traffic to attacker infrastructure.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Network egress points, DNS resolvers, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for dest in browser_conn: prevalence = distinct_hosts(dest)/total_hosts

      flag dest WHERE prevalence < 0.0001

      compute volume=bytes_out/bytes_in, freq=conns/min, state=count(failed,NXDOMAIN)

      jaccard = |dests_today ∩ baseline_90d| / |dests_today ∪ baseline_90d|

      ALERT WHERE jaccard < 0.5 OR metric_delta significant'
- question: Are any browser-initiated DNS queries classified as algorithmically generated (DGA) rather
    than legitimate human-readable domains, and what lexical features drive that classification?
  context: Malicious extensions frequently resolve DGA domains to reach resilient C2 infrastructure. Classify
    browser DNS query names as legitimate vs algorithmically generated using lexical features such as
    Shannon entropy, n-gram statistics, and Levenshtein metrics; for short strings, Kullback-Leibler divergence
    against a natural-language baseline outperforms raw entropy. Flag high-confidence DGA queries originating
    from browser processes and emit the top-3 contributing features (entropy, vowel ratio, length) so
    an analyst can validate quickly. A positive result supports active extension C2 under the Persistence
    tactic.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Network egress points, DNS resolvers, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = dga_classifier(features=[shannon_entropy,ngram,levenshtein,KL_divergence,vowel_ratio,length])

      for q in browser_dns_queries: score = model.predict(q)

      ALERT WHERE score=DGA AND confidence>thr; emit top3_features'
- question: Has any browser been launched with unpacked-extension or developer-mode flags (--load-extension=,
    --user-data-dir=, --disable-extensions-except=) pointing at a user-writable or high-risk directory?
  context: Unpacked/developer-mode sideloading is the primary way attacker-controlled extensions are loaded
    onto a host without store review, making it a direct persistence mechanism. Search process-creation
    events for browser executables carrying these flags and alert when the referenced path is in a user-writable,
    high-risk location such as %TEMP%, %APPDATA%, %LOCALAPPDATA%\..\LocalLow, C:\Users\Public, /tmp, or
    ~/Downloads. A hit indicates someone bypassed marketplace vetting to load a local extension — frequently
    malicious. Retain this concrete rule as the deterministic floor for this evidence.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint devices (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'process_creation(EventID=4688 OR Sysmon=1 OR auditd_execve)

      WHERE image in browser_set AND cmdline MATCHES (''--load-extension='' OR ''--user-data-dir='' OR
      ''--disable-extensions-except='')

      AND ext_path IN (%TEMP%,%APPDATA%,LocalLow,C:\Users\Public,/tmp,~/Downloads)

      => ALERT sideload'
- question: Is a browser with extension-loading flags being launched by an unusual parent process (e.g.,
    winword.exe, powershell.exe, cmd.exe, bash) that rarely or never spawns browsers in the environment?
  context: Browsers are normally launched by a small set of parents (explorer.exe, launchd, gnome-shell).
    An anomalous parent spawning a browser with extension-loading flags suggests scripted or macro-driven
    sideloading of a malicious extension. Profile parent->browser relationships per user/host, compute
    enterprise-wide rarity of each pair, and flag pairs below the 1st percentile, especially when combined
    with extension flags. Report the baseline frequency of the pair and the exact command line so the
    analyst can judge intent. This supports the Persistence tactic by exposing automated installation
    paths.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint devices (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline parent_child_pairs(parent_image -> browser_image) per host

      rarity = freq(pair)/total; flag WHERE rarity < p01

      AND child_cmdline contains extension flag

      report freq, full cmdline'
- question: Do the command line and (where available) extension manifest of a browser launch indicate
    a high likelihood of sideloading based on argument structure, path entropy, and dangerous declared
    permissions?
  context: A trained classifier can score browser launch command lines and loaded extension manifests
    for sideloading likelihood. Features include argument count, total length, path entropy, declared
    manifest permissions known to enable theft (cookies, webRequest, scripting, <all_urls>), and keywords
    like 'load-extension' or 'debug'. Score new launch events and emit the top-3 contributing features
    for explainable triage. A high score, especially with broad manifest permissions, indicates an extension
    positioned to harvest data and persist — a Persistence-tactic concern.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint devices (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'clf = RandomForest(features=[arg_count,cmd_len,path_entropy,manifest_perms(cookies,webRequest,scripting,<all_urls>),keyword_flags])

      for launch in browser_launches: s = clf.predict(launch)

      ALERT WHERE s>thr; emit top3_features'
- question: Has any process other than the browser, its updater, or a whitelisted admin/AV tool read sensitive
    browser data files such as 'Login Data', 'Cookies', or 'Web Data'?
  context: Malicious or compromised extensions defeat Secure/HttpOnly protections by abusing privileged
    cookie/credential APIs, so an unexpected reader of these stores is a high-fidelity indicator. Deploy
    file-access auditing (SACL) on sensitive browser profile directories and monitor file/process access
    events. Maintain an allowlist of legitimate accessors (the browser binary, its updater/software_reporter_tool.exe,
    signed AV) and alert whenever any process not on the allowlist reads the protected files. This exposes
    credential/session theft enabling persistence and follow-on access.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 10
  - 'NAI: Endpoint devices, File servers hosting roaming user profiles'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'file_access(EventID=4663 OR Sysmon=10) ON (''Login Data'',''Cookies'',''Web Data'') under
      chrome/firefox profile dirs

      WHERE accessing_process NOT IN allowlist(browser,updater,software_reporter_tool,signed_av)

      => ALERT credential_store_read'
- question: Has the set or count of distinct processes accessing 'Login Data' or 'Cookies' on a host changed
    anomalously, or are there spikes in denied/failed access attempts to these files?
  context: 'Beyond a static allowlist, baseline the set and count of unique processes accessing key browser
    credential files per host over a rolling 24-hour window and compute the Shannon entropy of accessing-process
    names. A sudden increase exceeding 3 standard deviations above the host''s historical mean indicates
    anomalous new accessors. Separately track State signals: counts of denied/failed access attempts (Event
    ID 4656/4663 failures) on these files, which can reveal probing. Report the new accessor names and
    metric deltas. This catches stealthy extension-driven credential harvesting under the Persistence
    tactic.'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 10
  - 'NAI: Endpoint devices, File servers hosting roaming user profiles'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per host, 24h window: accessors = distinct(proc) on (''Login Data'',''Cookies'')

      entropy = shannon(accessor_names); mean,std = baseline(host)

      ALERT WHERE entropy > mean+3*std OR count(denied_access) spikes

      report new_accessors, deltas'
- question: Do enriched file-access events to browser credential stores contain anomalies — such as a
    script interpreter reading the cookie database off-hours — when scored by an unsupervised anomaly
    detector?
  context: Apply an Isolation Forest to enriched file-access events with features including source process
    name, target file path, access type (ReadData/WriteData), and hour-of-day. Train on normal activity
    and flag anomalies such as a script interpreter reading the cookie database at 03:00. Emit the top-3
    contributing features (rare process, off-hours, target path) for explainable triage. Anomalous readers
    of credential/cookie stores point to extension-based theft supporting persistent adversary access.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 10
  - 'NAI: Endpoint devices, File servers hosting roaming user profiles'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'iso = IsolationForest(features=[src_proc,target_path,access_type,hour])

      train on normal 4663 events; score new events

      ALERT anomalies (e.g., script_interpreter reads Cookies @03:00); emit top3_features'
- question: Are browser processes resolving domains registered within the last 30 days or connecting to
    non-standard destination ports (other than 80/443) not on a known-good allowlist?
  context: Extension botnets commonly use recently registered C2 domains and non-standard ports for callbacks.
    Enrich browser DNS queries with WHOIS/passive-DNS age and alert on resolution to domains registered
    within the last 30 days; from connection logs, alert on browser connections to ports other than 80/443,
    excluding known-good services. Match against deterministic C2 IOC lists and known-good destination
    allowlists. A hit indicates likely extension C2 establishing or maintaining persistence; this deterministic
    rule complements the statistical beaconing analysis below.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek weird.log
  - 'NAI: Network egress points, Web proxies, DNS servers, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'dns.log: enrich query with domain_age; ALERT WHERE age<30d AND orig_proc in browser_set

      conn.log: ALERT WHERE orig_proc in browser_set AND dst_port NOT IN (80,443) AND dst NOT IN good_allowlist

      cross-check dst against c2_ioc_list'
- question: Do any browser-to-destination flows exhibit periodic beaconing (near-zero coefficient of variation
    in inter-arrival times) or anomalous volume, frequency, failure-rate, or DNS-entropy patterns consistent
    with C2 heartbeats?
  context: For each (browser source, destination) pair, compute the coefficient of variation of inter-arrival
    times and connection sizes; near-zero CV across >=5 connections indicates a periodic heartbeat. Use
    FFT-based periodicity extraction with whitelist suppression to survive jitter and exclude benign updaters/CDNs.
    Add Volume (per-window bytes-out/in), Frequency (connections/min), and State (rates of HTTP 4xx/5xx,
    blocked connections, NXDOMAIN) as distinct beacon indicators, and flag hosts whose 5-minute browser
    DNS entropy exceeds the enterprise 95th percentile. Report cadence, volume, and failure metrics in
    the alert. Beaconing from a browser strongly implies an extension maintaining C2.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek weird.log
  - 'NAI: Network egress points, Web proxies, DNS servers, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for (browser_src,dst): CV = stddev(inter_arrival)/mean(inter_arrival)

      flag WHERE CV~0 over >=5 conns (confirm via FFT periodicity, suppress whitelist)

      add volume=bytes/window, freq=conns/min, state=rate(4xx,5xx,blocked,NXDOMAIN)

      flag host WHERE 5min_dns_entropy > p95; report metrics'
- question: Does an unsupervised online flow model (autoencoder ensemble) flag reconstruction-error spikes
    in per-host browser flow features indicative of extension C2 or exfiltration?
  context: Run an unsupervised online autoencoder ensemble (e.g., KitNET) over per-host per-minute flow
    features (bytes out/in, connection count, unique destinations) and flag reconstruction-error spikes
    from extension C2/exfil. Train on several weeks of baseline traffic and surface the top-3 flow features
    driving the reconstruction error in the alert. This catches novel beaconing/exfiltration that signature
    and cadence methods miss, supporting detection of persistent extension-based access.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek weird.log
  - 'NAI: Network egress points, Web proxies, DNS servers, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'ae = KitNET(features=[bytes_out,bytes_in,conn_count,unique_dests] per host/min)

      train on weeks of baseline; score live; ALERT on recon_error spike

      emit top3 driving features'
- question: Within 10 minutes of a new file appearing in a browser or IDE extension directory, did the
    same host create a new service, create a scheduled task, or modify a registry autorun key?
  context: Some malicious extensions bootstrap host-level persistence beyond the browser (e.g., VSCode
    extensions that install backdoors). Trigger an alert when a file-creation event in a known browser/IDE
    extension path is followed within 10 minutes on the same host by new service creation (Event ID 7045),
    a new scheduled task (Event ID 4698), or modification of a registry autorun key (Event ID 4657). This
    time-bound correlation directly targets the Persistence tactic by linking extension installation to
    durable system persistence.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 7045
  - Windows Event ID 4698
  - Windows Event ID 4657
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Active Directory domain controllers'
  range: Last 90 days; correlate within a 10-minute event-centered window per host
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'A = file_create(Sysmon=11) in extension_path

      B = service_create(7045) OR sched_task(4698) OR autorun_mod(4657)

      ALERT WHERE B.host==A.host AND 0 < B.time-A.time <= 10m'
- question: Is the association between new extension installs and subsequent persistence events on a host
    statistically significant compared with their independent baseline frequencies?
  context: Compute the baseline conditional probability of a persistence event occurring given a new extension
    install within the last hour, and use a chi-squared test to assess whether the 'new extension -> new
    persistence' association is statistically significant (p < 0.01) versus independent baseline frequencies.
    Report observed vs expected counts in the alert. A significant association indicates extensions are
    systematically driving persistence, elevating the hunt beyond single coincidental pairings.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 7045
  - Windows Event ID 4698
  - Windows Event ID 4657
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Active Directory domain controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'P(persistence | ext_install within 1h) vs baseline P(persistence)

      chi_squared(observed, expected); ALERT WHERE p < 0.01

      report observed vs expected counts'
- question: Using sequence/frequent-pattern mining anchored on 'extension_install', are there rare transitions
    from installation to persistence states (new service, scheduled task, run-key set) on host event streams?
  context: Apply sequence analysis (frequent-pattern mining) to host event streams with 'extension_install'
    as an anchor item. Learn benign post-install sequences and flag rare transitions from 'extension_install'
    to persistence states (New-Service, Schtasks-Create, Run-key set). Emit the top-3 anomalous transitions/events
    for triage. Rare install->persistence sequences reveal extensions establishing a foothold in ways
    simple thresholds miss, directly serving the Persistence tactic.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 7045
  - Windows Event ID 4698
  - Windows Event ID 4657
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Active Directory domain controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'mine frequent sequences anchored on item=extension_install

      learn benign post-install sequences; flag rare transitions ->{New-Service,Schtasks-Create,Run-key}

      emit top3 anomalous transitions'
- question: Is an IDE extension host (node/extensionHost child of Code.exe/code) reading sensitive files
    outside its own extension directory — such as ~/.ssh/id_*, .env, ~/.aws/credentials, ~/.config, or
    browser credential stores?
  context: Cross-extension data exposure lets a malicious IDE extension stealthily harvest other extensions'
    and the developer's secrets. Audit reads by the IDE extension host and alert when it accesses files
    outside '~/.vscode/extensions/<id>', maintaining an allowlist of expected paths per extension. Pair
    this with deterministic IOC/static-signature matching on extension code (obfuscation, hardcoded endpoints).
    A hit indicates a malicious or compromised IDE extension stealing secrets — a serious persistence
    and access concern on developer endpoints.
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4663
  - auditd:SYSCALL
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Developer endpoints/workstations, Network egress points, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'file_read by (node/extensionHost child of Code.exe/code)

      WHERE path NOT under ''~/.vscode/extensions/<id>'' AND path IN (~/.ssh/id_*,.env,~/.aws/credentials,~/.config,browser_cred_stores)

      AND path NOT IN per_extension_allowlist => ALERT secret_read'
- question: Does an IDE extension contact destinations of very low enterprise prevalence, or read an unusual
    spike of distinct secret-bearing files in a short window, when compared with the developer's baseline?
  context: Baseline, per developer, the set of destinations contacted by the IDE process and the set of
    files its extension host reads. Flag destinations of <0.01% enterprise prevalence and report Volume
    (bytes-out per session), Frequency (connections/min), and State (failed/blocked connection and NXDOMAIN
    counts). A spike in distinct secret-bearing files read in a short window (>3 sigma above the developer's
    baseline) indicates harvesting. Surface the rare files/destinations and metric deltas. This catches
    stealthy IDE-extension exfiltration that evades static allowlists.
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4663
  - auditd:SYSCALL
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Developer endpoints/workstations, Network egress points, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per developer baseline IDE dest_set and read_file_set

      flag dest WHERE prevalence<0.0001; report volume,freq,state

      flag WHERE distinct_secret_files_read > baseline_mean+3*std in short window

      surface rare files/dests + deltas'
- question: Do enriched IDE-extension file and network events contain anomalies — anomalous secret reads
    or exfiltration — when scored by an Isolation Forest and a network autoencoder?
  context: Apply an Isolation Forest to enriched IDE-extension events (file path, access type, destination,
    hour, bytes) to flag anomalous secret reads and exfiltration, and layer an online autoencoder for
    the network stage. LLM/static-hybrid risk scoring of extension code and metadata can pre-screen installs.
    Emit the top-3 contributing features in every alert. This unsupervised approach surfaces novel malicious
    IDE-extension behavior on developer endpoints that supports persistent adversary access.
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4663
  - auditd:SYSCALL
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Developer endpoints/workstations, Network egress points, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'iso = IsolationForest(features=[file_path,access_type,dest,hour,bytes]) on IDE-ext events

      ae = online_autoencoder on network stage

      ALERT anomalies; pre-screen installs via static/LLM risk score; emit top3_features'
