- question: '[Lateral Movement] Track rare encryption types per user: Can you determine whether a Kerberos
    ticket request (TGT or Service Ticket) uses the RC4-HMAC encryption type (0x17), which is deprecated
    and often used by adversary tools for compatibility, especially when the requesting account or domain
    policy supports stronger AES encryption. -- specifically, using the ''Track rare encryption types
    per user'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary performs Pass the
    Ticket -- authenticating with stolen, forged, or replayed Kerberos tickets (service tickets, TGTs,
    Silver/Golden Tickets, or overpass-the-hash) to move laterally and access remote systems without knowing
