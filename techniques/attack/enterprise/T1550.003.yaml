name: 'T1550.003: Use Alternate Authentication Material: Pass the Ticket'
id: f54d7589-8bcd-43c2-9090-97b51d69002a
description: 'This playbook helps an analyst investigate whether an adversary has forged or misused Kerberos
  tickets to evade standard authentication controls and move laterally (Pass the Ticket), including use
  of stolen service tickets and TGTs, Silver and Golden Tickets, and overpass-the-hash. It guides the
  analyst across multiple behavioral angles drawn from Domain Controller and endpoint authentication telemetry
  and network Kerberos traffic: detecting RC4-HMAC (0x17) ticket requests and KDC RC4 downgrade signals
  where AES is expected; flagging tickets whose lifetimes exceed domain policy or statistical norms (a
  Golden Ticket hallmark); identifying TGT/service-ticket requests (Event ID 4768/4769) from source IPs
  or hosts with no precedent for the account; spotting bursts of unique service-ticket requests and KDC_ERR_S_PRINCIPAL_UNKNOWN
  (0x7) failures indicative of Kerberoasting and SPN reconnaissance; surfacing anomalous successful Kerberos
  network logons (Event ID 4624, Logon Type 3) including rare user-to-host pairs and first-time workstation-to-workstation
  movement; and correlating remote logon sessions with malicious follow-on process execution under the
  same Logon ID. Detection methods combine symbolic-logic rules, statistical baselining, and machine-learning
  models (Random Forest, Isolation Forest, graph link prediction, DBSCAN clustering, and sequence autoencoders)
  applied to Windows Security Events (4768, 4769, 4624, 4648, 4672, 4688), Sysmon process-access and module-load
  events, and Zeek kerberos.log and conn.log, so the analyst can corroborate suspected ticket abuse against
  encryption type, lifetime, source provenance, request volume, logon structure, and downstream activity.'
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
