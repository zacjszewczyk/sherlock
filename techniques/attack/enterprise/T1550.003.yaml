questions:
- question: '[Lateral Movement] Alert on RC4 ticket requests: Can you determine whether a Kerberos ticket
    request (TGT or Service Ticket) uses the RC4-HMAC encryption type (0x17), which is deprecated and
    often used by adversary tools for compatibility, especially when the requesting account or domain
    policy supports stronger AES encryption. -- specifically, using the ''Alert on RC4 ticket requests''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary performs Pass the
    Ticket -- authenticating with stolen, forged, or replayed Kerberos tickets (service tickets, TGTs,
    Silver/Golden Tickets, or overpass-the-hash) to move laterally and access remote systems without knowing
    account passwords, bypassing normal access controls. This evidence focuses on the condition that a
    Kerberos ticket request (TGT or Service Ticket) uses the RC4-HMAC encryption type (0x17), which is
    deprecated and often used by adversary tools for compatibility, especially when the requesting account
    or domain policy supports stronger AES encryption. This Symbolic Logic approach works as follows:
    Alert when Windows Event ID 4768 or 4769 is generated with ''Ticket Encryption Type'' 0x17 (RC4-HMAC)
    where the account/domain supports AES (0x12), per [4769(S, F): A Kerberos service ticket was requested,
    Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769).
    Escalate to high severity if the ''Account Name'' is in a privileged group (Domain/Enterprise Admins)
    or is a designated service account, a primary Golden/Silver/passed-ticket indicator catalogued in
    [Detecting Forged Kerberos Ticket Use, Metcalf](https://adsecurity.org/?p=1515) and codified by [Suspicious
    Kerberos RC4 Ticket Encryption, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_rc4_kerberos.yml)
    (TicketOptions 0x40810000 + 0x17 for non-$ SPNs). A positive result -- a rule match, statistical outlier,
    or model alert -- is consistent with forged or misused Kerberos tickets; pivot to the requesting account
    and whether it is privileged or a service account, the source host/IP and whether it is expected for
    that user, the ticket encryption type and lifetime, correlated logon (4624 Type 3) and special-privilege
    (4672) events, and any follow-on tooling or reconnaissance launched under the same logon session.
    A negative result helps reduce suspicion for this particular vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy ticket abuse that blends
    with legitimate Kerberos traffic.'
