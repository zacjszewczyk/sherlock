- question: '[Lateral Movement] Enforce lifetime policy violations: Can you determine whether a Kerberos
    ticket is observed in network traffic with a lifetime (''till'' timestamp minus ''from'' timestamp)
    that exceeds the domain''s maximum ticket lifetime policy (typically 10 hours), a common attribute
    of a forged Golden Ticket which can be set to arbitrary durations like 10 years. -- specifically,
