- question: '[Lateral Movement] Graph-based source anomaly detection: Can you determine whether a Kerberos
    ticket-granting ticket (TGT) request (Event ID 4768) or service ticket request (Event ID 4769) originates
    from a client IP address or hostname that has no historical precedent for the requesting user account,
    especially when the account is privileged or a service account that should have predictable sources.
    -- specifically, using the ''Graph-based source anomaly detection'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary performs Pass the
    Ticket -- authenticating with stolen, forged, or replayed Kerberos tickets (service tickets, TGTs,
    Silver/Golden Tickets, or overpass-the-hash) to move laterally and access remote systems without knowing
    account passwords, bypassing normal access controls. This evidence focuses on the condition that a
    Kerberos ticket-granting ticket (TGT) request (Event ID 4768) or service ticket request (Event ID
    4769) originates from a client IP address or hostname that has no historical precedent for the requesting
    user account, especially when the account is privileged or a service account that should have predictable
    sources. This Machine Learning approach works as follows: Model the user-to-source-IP/host relationship
    as an authentication graph and score new edges with link prediction; flag improbable new (user, source)
    edges. Use the node2vec + logistic-regression approach of [Detecting Lateral Movement with Unsupervised
    Graph AI, Bowman et al](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf) or temporal
    link prediction in [Euler, King and Huang](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf),
    and surface the link-level explanation (edge rarity, community mismatch, novelty) in the alert. A
    positive result -- a rule match, statistical outlier, or model alert -- is consistent with forged
    or misused Kerberos tickets; pivot to the requesting account and whether it is privileged or a service
    account, the source host/IP and whether it is expected for that user, the ticket encryption type and
    lifetime, correlated logon (4624 Type 3) and special-privilege (4672) events, and any follow-on tooling
    or reconnaissance launched under the same logon session. A negative result helps reduce suspicion
    for this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy ticket abuse that blends with legitimate Kerberos traffic.'
