    logons'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary performs Pass the
    Ticket -- authenticating with stolen, forged, or replayed Kerberos tickets (service tickets, TGTs,
    Silver/Golden Tickets, or overpass-the-hash) to move laterally and access remote systems without knowing
    account passwords, bypassing normal access controls. This evidence focuses on the condition that a
    successful Kerberos network logon (Event ID 4624, Logon Type 3) is observed where a non-administrative
    user account authenticates from one workstation to another for the first time, a strong indicator
    of lateral movement between peer systems. This Symbolic Logic approach works as follows: Alert when
    Event 4624 with Logon Type 3 and Authentication Package ''Kerberos'' is logged where ''Account Name''
    is non-privileged and both source and destination are classified as workstations (peer-to-peer movement
    is abnormal), per the artifact mapping in [Detecting Lateral Movement through Tracking Event Logs,
    JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf). A positive result
    -- a rule match, statistical outlier, or model alert -- is consistent with forged or misused Kerberos
    tickets; pivot to the requesting account and whether it is privileged or a service account, the source
    host/IP and whether it is expected for that user, the ticket encryption type and lifetime, correlated
    logon (4624 Type 3) and special-privilege (4672) events, and any follow-on tooling or reconnaissance
    launched under the same logon session. A negative result helps reduce suspicion for this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy ticket abuse that blends with legitimate Kerberos traffic.'
