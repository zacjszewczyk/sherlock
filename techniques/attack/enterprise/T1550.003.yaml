      [Suspicious Kerberos RC4 Ticket Encryption, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_rc4_kerberos.yml)
      (TicketOptions 0x40810000 + 0x17 for non-$ SPNs).'
