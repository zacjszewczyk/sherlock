    deprecated and often used by adversary tools for compatibility, especially when the requesting account
    or domain policy supports stronger AES encryption. This Statistical Method approach works as follows:
    For each user account, baseline the 30-day frequency distribution of ''Ticket Encryption Types''.
    Alert when a user requests a type with zero/near-zero historical frequency for that user (e.g., an
    AES-only account suddenly requesting 0x17). Establish per-environment RC4 baselines before alerting
    and set per-client distinct-SPN thresholds as recommended in [Suspicious Kerberos RC4 Ticket Encryption,
