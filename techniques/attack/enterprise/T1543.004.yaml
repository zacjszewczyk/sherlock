name: 'T1543.004: Launch Daemon'
id: 3dc23d93-74ee-45da-8332-97e1bcec2e03
description: 'This playbook helps an analyst investigate whether an adversary is abusing macOS Launch
  Daemons (T1543.004) to establish persistence and to escalate privileges. Launch Daemons are plist files
  loaded by launchd from /System/Library/LaunchDaemons/ and /Library/LaunchDaemons/; they require elevated
  privileges to install, run before any user logs in, execute in the background without user interaction,
  and inherit administrative (root) permissions when launched. Adversaries create a daemon with RunAtLoad
  set to true and Program pointing at a malicious executable, masquerade the daemon Label as a legitimate
  Apple or vendor service, load it via launchctl/sudo launchctl from non-standard paths, or hijack the
  executable referenced by an existing daemon when a globally writable path (e.g., /usr/local/bin) is
  present. The playbook guides the hunt across several behavioral angles: hash/manifest/threat-intel matching
  of new or modified plists and their referenced binaries; YARA, entropy, and label-distance detection
  of user-writable Program paths, obfuscated ProgramArguments, and com.apple.* typosquats; correlation
  of daemon load with subsequent process execution and Zeek network beaconing to C2 or newly registered
  domains; file-integrity monitoring of binaries referenced by existing daemons to catch hijacks; detection
  of non-root EUID writes into the root-only /Library/LaunchDaemons/ directory; launchctl loads from /tmp/
  or /Users/Shared/; and launchd-root processes spawning sensitive privilege-modifying commands (dscl,
  sysadminctl, spctl, csrutil). Detection methods combine symbolic-logic rules, statistical baselining/outlier
  scoring, and machine-learning models applied to macOS Endpoint Security file events, Unified Logs, process-execution
  telemetry, code-signing/hash databases, and Zeek conn/dns logs, so the analyst can corroborate suspected
  Launch Daemon abuse against process lineage, writer identity, signing state, prevalence, and network
  context.'
type: technique
