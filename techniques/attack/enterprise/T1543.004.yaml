questions:
- question: '[Persistence] Does the SHA256 hash, code-signing status, or on-disk content of any newly
    created or modified plist in /Library/LaunchDaemons/ or /System/Library/LaunchDaemons/ -- or the Program/ProgramArguments[0]
    binary it references -- match a known-malicious LaunchDaemon artifact in threat intelligence or violate
    the golden manifest of approved daemons (the ''LaunchDaemon hash/manifest match'' Symbolic Logic approach)?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary installs a Launch Daemon
    so malicious code runs at boot, before any user logs in, with root privileges. The most direct confirmation
    is matching the daemon plist or its referenced executable to known-bad. How to pursue it: parse every
    plist in the privileged LaunchDaemon directories and its referenced Program/ProgramArguments[0] binary
    from Apple Endpoint Security CREATE/RENAME/WRITE events, compute SHA256, verify the code-signing Team
    ID, and alert when the hash matches a malware/C2 threat feed or deviates from a golden manifest of
    approved daemons (KnockKnock-style enumeration of unsigned or abnormal Program paths). A positive
    result strongly indicates active persistence; pivot to the writing process, its lineage, and the daemon''s
    RunAtLoad/KeepAlive state. A negative result helps rule out known tooling but cannot exclude novel
    or signed malware, so corroborate with the other questions.'
  answer_sources:
  - macOS EndpointSecurity file events
  - macOS Unified Logs
  - Threat Intelligence Feeds
  - Code Signing Status
  - File Hash Database
  - 'NAI: Privileged LaunchDaemon paths and referenced executables on managed macOS endpoints.'
  range: Last 90 days
  queries:
  - technology: EndpointSecurity/pseudocode
    query: "for plist in ES_events(CREATE|RENAME|WRITE) where path matches '/Library/LaunchDaemons/*.plist'\
      \ OR '/System/Library/LaunchDaemons/*.plist':\n  bin = parse_plist(plist).Program or ProgramArguments[0]\n\
      \  h = sha256(bin); team = codesign_team_id(bin)\n  if h in malware_c2_feed OR plist.sha256 in malware_c2_feed:\
      \ alert('known-malicious daemon')\n  if (h, plist.path) not in golden_manifest OR team not in approved_team_ids:\
      \ alert('manifest deviation')"
  - technology: SIEM/Stats pseudocode
    query: '# Executable prevalence outlier (Statistical Method)

      stats count(distinct host) as installs, min(first_seen) as age, values(team_id) by binary_sha256

      where source=''LaunchDaemon binary''

      | eventstats perc1(installs) as p1

      | where installs <= p1

      | table binary_sha256 installs age team_id  # rare-by-design daemons; add TF-IDF rarity of plist
      tokens'
  - technology: ML/pseudocode
    query: '# LaunchDaemon classifier (Machine Learning)

      feat = [path_rarity, signature_valid, hash_prevalence, file_age, plist_entropy, run_at_load]

      score = RandomForest_or_XGBoost.predict_proba(feat)

      if score > thr: alert(top3_shap_features(feat))

      # one-class IsolationForest/OCSVM+LIME trained on benign installer daemons to catch unseen variants'
- question: '[Persistence] Does any LaunchDaemon plist in /Library/LaunchDaemons/ reference an executable
    in a user-writable or unusual directory, use obfuscated (base64/hex) ProgramArguments, or masquerade
    as a legitimate system daemon through a near-match Label or name (the ''LaunchDaemon YARA rule'' Symbolic
    Logic approach)?'
  context: 'Why this matters: For Persistence (TA0003), adversaries disguise their daemon to blend in
    -- naming it com.apple.* (typosquat), pointing Program at /tmp/, /Users/Shared/, /private/var/, or
    /usr/local/bin, encoding arguments, and pairing RunAtLoad=true with KeepAlive so it survives. How
    to pursue it: run YARA on new/modified plists for user-writable Program paths, base64/hex-encoded
    ProgramArguments, RunAtLoad=true with KeepAlive, and daemon-label near-matches to Apple labels. A
    positive result indicates a masquerading or staged persistence mechanism; inspect the referenced binary
    and writer. A negative result reduces but does not eliminate suspicion since legitimate software can
    also use these directories, so combine with prevalence and lineage signals.'
  answer_sources:
  - macOS EndpointSecurity file events
  - macOS Unified Logs
  - File content
  - Process execution events
  - 'NAI: LaunchDaemon plist directories and process lineage data on managed macOS endpoints.'
  range: Last 90 days
  queries:
  - technology: EndpointSecurity/YARA pseudocode
    query: "for plist in new_or_modified('/Library/LaunchDaemons/*.plist'):\n  if yara_match(plist, rules=[program_path\
      \ in ('/tmp/','/Users/Shared/','/private/var/','/usr/local/bin'),\n                            \
      \  base64_or_hex(ProgramArguments), RunAtLoad==true AND KeepAlive present,\n                   \
      \           label ~ 'com.apple.*' typosquat]):\n    alert('masquerading/staged LaunchDaemon')"
  - technology: SIEM/Stats pseudocode
    query: '# Entropy and distance alert (Statistical Method)

      args_entropy = shannon(ProgramArguments)

      label_dist = min(levenshtein(label, L) for L in legit_label_set)

      if args_entropy > perc95(args_entropy) OR label_dist <= 2 AND label not in legit_label_set: alert(''obfuscation/masquerade'')

      | stats count by host,day | where count > mean+3*stddev  # daemon-creation burst'
  - technology: ML/pseudocode
    query: '# Plist clustering outliers (Machine Learning)

      feat = [path_depth, arg_count, arg_length, signature_state, keyword_flags]

      cluster = DBSCAN.fit(feat); escalate singletons and small noise clusters

      # provenance-graph models (ThreaTrace/PROGRAPHER) flag anomalous daemon node + driving feature/edge'
- question: '[Persistence] Does a process spawned by a newly created LaunchDaemon initiate network connections
    to a known-malicious C2 server, a newly registered domain, or a periodic low-volume beacon shortly
    after the daemon is loaded (the ''LaunchDaemon connection rule'' Symbolic Logic approach)?'
  context: 'Why this matters: A persistent daemon usually phones home. For Persistence (TA0003), correlating
    the daemon''s creation/load with the subsequent process execution and its network behavior confirms
    the implant is operational. How to pursue it: correlate LaunchDaemon file creation and launchd load
    (Unified Logs) with the subsequent process exec and its Zeek conn/dns activity within a short window;
    alert when destinations match threat intel, newly registered domains, or non-corporate IP space, anchoring
    on rare parent->daemon->network causal paths. A positive result indicates an active C2 channel; capture
    the destination, JA3/SNI, and timing. A negative result may simply mean the implant is dormant or
    beacons slowly, so pair with the jitter/volume baseline and autoencoder methods.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Process execution events
  - macOS Unified Logs
  - 'NAI: macOS endpoints and network egress points where launchd-managed processes can be observed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join daemon_create(Unified Logs) -> launchd_load -> process_exec -> zeek_conn/dns within 10m\n\
      where dest_ip in ti_feed OR domain in newly_registered OR dest_ip not in corp_space:\n  alert('LaunchDaemon\
      \ process beaconing to suspicious destination')"
  - technology: Zeek/Stats pseudocode
    query: '# Jitter/volume/failure baseline (Statistical Method)

      per daemon_process: cv = stddev(interval)/mean(interval); dest_div=distinct(dest); ratio=sent/recv

      fail_rate = (refused+timeout)/conns; nx_rate = nxdomain/dns

      if cv < perc5(cv) OR fail_rate high OR periodicity(FFT/autocorr) strong: alert(''beacon'')'
  - technology: ML/pseudocode
    query: '# Network autoencoder (Machine Learning)

      feat_ts = [bytes, packets, interval_jitter, domain_age] per flow from launchd-spawned procs

      err = Kitsune_or_LSTM_autoencoder.reconstruction_error(feat_ts)

      if err > thr: alert(top3_anomalous_features)'
- question: '[Persistence] Has the file hash, signature state, or path of an executable referenced by
    a pre-existing LaunchDaemon plist changed unexpectedly, indicating a hijack of a legitimate daemon
    entry (the ''File integrity manifest'' Symbolic Logic approach)?'
  context: 'Why this matters: Rather than create a new daemon, adversaries can swap the executable referenced
    by an existing /Library/LaunchDaemons/ plist when a globally writable path (e.g., /usr/local/bin)
    permits it -- gaining root persistence under a trusted daemon name. How to pursue it: alert when the
    SHA256 or code-signing metadata of a binary referenced by an existing plist deviates from the golden
    manifest, sourcing events from Apple Endpoint Security WRITE/RENAME notifications. A positive result
    is a strong hijack indicator; identify the writing process and compare the new binary to threat intel.
    A negative result confirms manifest integrity for that interval but should be re-checked continuously,
    since hijacks can occur at any time.'
  answer_sources:
  - macOS EndpointSecurity file events
  - File hash database
  - Code signing status
  - macOS Unified Logs
  - 'NAI: Directories containing executables referenced by plists in `/Library/LaunchDaemons/` across
    managed macOS endpoints.'
  range: Last 90 days
  queries:
  - technology: EndpointSecurity/pseudocode
    query: "for bin in referenced_executables(existing '/Library/LaunchDaemons/*.plist'):\n  on ES WRITE|RENAME(bin):\n\
      \    if sha256(bin) != golden_manifest[bin] OR codesign(bin) != golden_codesign[bin]:\n      alert('LaunchDaemon\
      \ binary hijack', writer_uid, parent)"
  - technology: SIEM/Stats pseudocode
    query: '# Modification frequency spike (Statistical Method)

      baseline mod_rate, writer_identity per referenced binary

      if mod_rate > mean+2to3*stddev OR writer not in update_process_set: alert(writer_uid, parent, prior_cadence)'
  - technology: ML/pseudocode
    query: '# Modification anomaly one-class model (Machine Learning)

      train OCSVM/IsolationForest on legit mods (installer/softwareupdated/root maint in approved windows)

      if outlier: alert(LIME_attribution)

      # whole-system provenance autoencoders (KAIROS/MAGIC) flag the hijack subgraph'
- question: '[Privilege Escalation] Is a plist created in /Library/LaunchDaemons/ or its associated executable
    identified by hash, name, or content as a known privilege-escalation tool or malware with privilege-escalation
    capabilities (the ''Privilege escalation feed match'' Symbolic Logic approach)?'
  context: 'Why this matters: Under Privilege Escalation (TA0004), a Launch Daemon executes with inherited
    root privileges, so installing one is itself a path to elevated execution. Confirming the artifact
    is a known privilege-escalation tool elevates priority. How to pursue it: hash new LaunchDaemon plists/executables
    from Apple Endpoint Security CREATE events, compare to privilege-escalation tool/malware feeds, and
    run YARA; alert on matches or on unsigned binaries in root-level daemon paths. A positive result indicates
    a high-confidence escalation attempt; isolate the host and review what the binary does. A negative
    result rules out known tooling only, so corroborate with the TF-IDF and classifier methods.'
  answer_sources:
  - File Creation Events
  - Threat Intelligence Feeds
  - YARA rule sets
  - 'NAI: File system and process logs on all macOS endpoints, with specific focus on monitoring `/Library/LaunchDaemons/`.'
  range: Last 90 days
  queries:
  - technology: EndpointSecurity/YARA pseudocode
    query: "for f in ES CREATE('/Library/LaunchDaemons/*'):\n  if sha256(f) in privesc_tool_feed OR yara_match(f,\
      \ privesc_rules) OR (is_executable(f) AND unsigned(f)):\n    alert('privilege-escalation LaunchDaemon\
      \ artifact')"
  - technology: SIEM/Stats pseudocode
    query: "# TF-IDF keyword/prevalence alert (Statistical Method)\ntfidf = tfidf(strings(plist+binary),\
      \ privesc_keywords)\nif tfidf > perc98 OR fleet_hash_prevalence(binary) < perc1:\n  alert(matched_terms,\
      \ install_count)"
  - technology: ML/pseudocode
    query: '# Privilege escalation text classifier (Machine Learning)

      tokens = tokenize(plist + binary_strings)

      pred = NaiveBayes_or_GBM.predict(tokens)

      if pred == malicious: alert(top3_indicative_tokens)'
- question: '[Privilege Escalation] Does a process -- especially one in a non-administrative user context
    -- execute ''sudo launchctl load'' (or launchctl load/bootstrap) to load a plist from a non-standard
    path such as /tmp/ or /Users/Shared/ (the ''Sudo launchctl rule'' Symbolic Logic approach)?'
  context: 'Why this matters: For Privilege Escalation (TA0004), loading a daemon via sudo launchctl from
    an unauthorized location lets an attacker bootstrap root-context execution. How to pursue it: alert
    on launchctl load/bootstrap (or sudo launchctl load) referencing plists outside /System/Library/ or
    /Library/LaunchDaemons/ (e.g., /tmp/, /Users/). A positive result indicates an unauthorized daemon
    load and likely escalation; capture the full command line, user, and parent. A negative result is
    reassuring but does not cover daemons placed directly in the standard directories, so pair with the
    non-root write rule.'
  answer_sources:
  - Process Execution Events
  - 'NAI: Process execution logs, including full command-line arguments, from all company-managed macOS
    endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "where process in ('launchctl') AND args contains ('load' OR 'bootstrap')\nAND plist_path NOT\
      \ startswith ('/System/Library/','/Library/LaunchDaemons/'):\n  alert('launchctl load from non-standard\
      \ path', user, parent, cmdline)"
  - technology: SIEM/Stats pseudocode
    query: "# User-process baseline (Statistical Method)\nbaseline {user, parent} pairs that run launchctl\n\
      if (user,parent) not in baseline OR per_user_load_freq > mean+3*stddev OR first_seen(user):\n  alert(historical_baseline)"
  - technology: ML/pseudocode
    query: '# Command sequence HMM (Machine Learning)

      p = HMM_or_freq_seq.prob(command_sequence)

      if p < thr (e.g. ''curl ... && launchctl load ...''): alert(improbable_transition)'
- question: '[Privilege Escalation] Is a file created in the root-only /Library/LaunchDaemons/ directory
    by a process running with an effective user ID (EUID) other than 0 (root), indicating a permission
    bypass (the ''Non-root write rule'' Symbolic Logic approach)?'
  context: 'Why this matters: /Library/LaunchDaemons/ is root-owned by design; a write by a non-root EUID
    process signals a permission bypass or misconfiguration being exploited for Privilege Escalation (TA0004).
    How to pursue it: alert on any write/create in /Library/LaunchDaemons/ where the writing process EUID
    != 0, captured via Apple Endpoint Security CREATE/WRITE events with actor credentials. A positive
    result is a strong escalation indicator -- a non-privileged process should not be able to write there;
    review how it obtained access. A negative result confirms expected access controls, though legitimate
    root installers will still write here, so combine with rare-parent profiling.'
  answer_sources:
  - File Creation Events
  - 'NAI: File creation logs for the `/Library/LaunchDaemons/` directory on all macOS endpoints, ensuring
    logs contain the user context of the writing process.'
  range: Last 90 days
  queries:
  - technology: EndpointSecurity/pseudocode
    query: "on ES CREATE|WRITE(path startswith '/Library/LaunchDaemons/'):\n  if actor.euid != 0: alert('non-root\
      \ write to root-only daemon dir', actor.process, actor.euid)"
  - technology: SIEM/Stats pseudocode
    query: "# Rare parent alert (Statistical Method)\nlegit_parents = {installer, system_installd, softwareupdated,\
      \ package_script_service}\nif writer_parent not in legit_parents (e.g. bash,python,osascript,browser):\n\
      \  alert(parent, historical_write_count)"
  - technology: ML/pseudocode
    query: '# Process-graph anomaly (Machine Learning)

      model process-lineage as provenance graph

      flag chains: browser/email/shell -> write ''/Library/LaunchDaemons/''

      use GNN node/edge detection (ThreaTrace/KAIROS/MAGIC); surface anomalous edge + parent'
- question: '[Privilege Escalation] Does a process launched by launchd with root privileges (UID 0) subsequently
    execute commands to create new administrative users, modify user privileges, or disable security controls
    (the ''Launchd command correlation'' Symbolic Logic approach)?'
  context: 'Why this matters: Once a malicious daemon runs as root, the adversary typically consolidates
    control -- creating admin accounts or disabling protections -- which is the payoff of Privilege Escalation
    (TA0004). How to pursue it: alert when a launchd-spawned process with UID 0 spawns children executing
    sensitive commands (dscl . -create, sysadminctl -addUser, spctl --master-disable, csrutil) within
    5 minutes of the daemon load, correlating via Unified Logs and Endpoint Security exec events. A positive
    result indicates post-escalation hardening-tamper or account creation; respond immediately. A negative
    result does not exclude slower or different consolidation actions, so monitor admin-command baselines
    and root sequences.'
  answer_sources:
  - Process Execution Events
  - 'NAI: Process execution logs, including parent process and user context, on all company-managed macOS
    endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "where parent.spawned_by=='launchd' AND parent.uid==0\nAND child.cmd in ('dscl . -create','sysadminctl\
      \ -addUser','spctl --master-disable','csrutil')\nAND child.time - daemon_load_time <= 5m:\n  alert('root\
      \ daemon performing privilege/security changes')"
  - technology: SIEM/Stats pseudocode
    query: '# Admin command outlier (Statistical Method)

      baseline freq + arg distribution of admin commands

      flag launchd-root-parented admin cmds outside approved scripts/windows

      track failed privileged ops (auth failures, denied spctl) as distinct signal; report deviation'
  - technology: ML/pseudocode
    query: '# Root sequence classifier (Machine Learning)

      pred = HMM_or_LSTM.predict(root_command_sequence)

      if pred == malicious: alert

      # PROGRAPHER provenance model corroborates anomalous root subgraph + contributing nodes'
