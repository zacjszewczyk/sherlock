name: 'T1543.004: Launch Daemon'
id: 3dc23d93-74ee-45da-8332-97e1bcec2e03
description: 'Investigate Launch Daemon (T1543.004) as it manifests under Persistence, Privilege Escalation.
  This playbook helps analysts confirm or refute the technique by examining: The SHA256 hash, code-signing
  status, or on-disk contents of a newly created or modified plist file in `/Library/LaunchDaemons/`,
  or its referenced executable, match a known-malicious LaunchDaemon artifact from threat intelligence
  or an internal allowlist violation. A LaunchDaemon plist in `/Library/LaunchDaemons/` references an
  executable in a user-writable or unusual directory, uses obfuscated arguments, or masquerades as a legitimate
  system daemon through a near-match name or label. A process spawned by a newly created LaunchDaemon
  initiates network connections to a known-malicious C2 server, a newly registered domain, or a periodic
  low-volume beacon pattern shortly after the daemon is loaded. The file hash, signature state, or path
  of an executable referenced by a pre-existing LaunchDaemon plist changes unexpectedly, indicating a
  potential hijack of a legitimate daemon entry. A plist file created in `/Library/LaunchDaemons/` or
  its associated executable is identified by hash, name, or content as a known privilege escalation tool
  or malware with privilege escalation capabilities. A process, especially one in a non-administrative
  user context, executes `sudo launchctl load` to load a plist from a non-standard path like `/tmp/` or
  `/Users/Shared/`.'
type: technique
