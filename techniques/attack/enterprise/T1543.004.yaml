- question: Using deterministic detection logic, can analysts identify launchDaemon hash/manifest match
    as it would manifest during Persistence?
  context: 'Under the Persistence tactic, the analyst is looking for the following evidence: The SHA256
    hash, code-signing status, or on-disk contents of a newly created or modified plist file in `/Library/LaunchDaemons/`,
    or its referenced executable, match a known-malicious LaunchDaemon artifact from threat intelligence
    or an internal allowlist violation. This symbolic logic approach proceeds as follows: Parse every
    plist in `/Library/LaunchDaemons/` and `/System/Library/LaunchDaemons/` and its referenced `Program`/`ProgramArguments[0]`
    binary from Apple [Endpoint Security](https://developer.apple.com/documentation/endpointsecurity)
    CREATE/RENAME/WRITE events, compute SHA256, verify code-signing Team ID, and alert when the hash matches
    a malware/C2 threat feed or deviates from the golden manifest of approved daemons defined by Apple''s
    [launchd job structure](https://developer.apple.com/library/archive/documentation/MacOSX/Conceptual/BPSystemStartup/Chapters/CreatingLaunchdJobs.html).
    KnockKnock-style enumeration of unsigned/abnormal Program paths from [Methods of Mac Malware Persistence](https://www.virusbulletin.com/uploads/pdf/conference/vb2014/VB2014-Wardle.pdf).
    A positive result strengthens the case that Launch Daemon is in use for persistence; a negative result
    helps rule it out or redirect the investigation.'
