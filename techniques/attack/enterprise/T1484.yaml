name: 'T1484: Domain or Tenant Policy Modification'
id: 21064c4c-0189-4647-94c4-39ec4b16ebce
description: This playbook helps an analyst investigate whether an adversary has modified domain or identity-tenant
  policy (MITRE ATT&CK T1484) to escalate privileges or impair defenses across a centrally managed environment.
  It covers on-premise Active Directory abuse -- weaponized Group Policy Objects that push malicious scheduled
  tasks/startup scripts via SYSVOL, unauthorized user-rights/restricted-group grants (SeBackupPrivilege,
  SeDebugPrivilege, SeTakeOwnershipPrivilege), changes to critical GPOs (Default Domain Policy/Default
  Domain Controllers Policy) outside change control, GPO-delivered Windows Defender exclusions, embedded
  scripts that disable AMSI/ETW/AV/logging, audit-policy and log-retention tampering, and rapid modify-then-revert
  'flash' GPO changes -- as well as cloud/identity-provider abuse such as federation and domain-authentication
  changes, added federated identity providers, and ADFS Claims Provider Trust / token-signing modifications
  that enable Golden SAML and federated impersonation. For each behavior it supplies symbolic-logic rules,
  statistical baselining/change-point methods, and machine-learning models across Windows Security/Sysmon
  events (5136/5137/5139/5141/5145/4688/4732/4104/307/510), PowerShell script-block logs, Zeek network
  telemetry, and Microsoft 365/Entra ID audit and sign-in logs, so the analyst can correlate who changed
  what, when, from where, and what access or evasion it produced.
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
- tactic_id: TA0004
  tactic_name: Privilege Escalation
