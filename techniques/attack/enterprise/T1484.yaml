    where the ''gPCUserRightsAssignment'' (or restricted-groups) attribute is changed to grant a sensitive
    user right such as SeBackupPrivilege, SeDebugPrivilege, or SeTakeOwnershipPrivilege to a principal
    not on an approved administrator list. -- specifically using the ''Unauthorized right assignment detection''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), adversaries abuse T1484 Domain
