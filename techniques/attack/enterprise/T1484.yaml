    assignments, federation/trust settings, or identity-provider configuration -- to escalate privileges
    and/or impair defenses across many systems at once (driving the PIR: Has the adversary escalated privileges
    by modifying domain or tenant policy? (PIR)). This evidence focuses on the condition that two GPO
    modification events (Windows Event ID 5136) for the same GPO GUID occur within a short timeframe (e.g.,
    under 30 minutes) where the versionNumber attribute changes and then reverts to its original value,
    indicating a temporary ''flash'' modification used to carry out an action then erase indicators. The
    ''GPO sequence anomaly modeling'' method (Machine Learning) pursues it as follows: Train an LSTM log-sequence/autoencoder
    model on typical GPO administrative workflows (e.g., ''modify -> link -> wait 24h'') and flag anomalous
    sequences such as ''modify -> wait 5 min -> revert'', surfacing the deviating step ([Du et al., DeepLog](https://doi.org/10.1145/3133956.3134015)).
    A positive result -- a deterministic rule hit, a statistical outlier, or a model alert -- indicates
    a policy/configuration change that may grant adversary-controlled access, weaken monitoring, or persist
    malicious tasking; pivot to the modifying account, the source host, the target GPO/domain/tenant object,
    the change-control record, and any downstream execution or authentication it enables. A negative result
    helps rule out this specific vector but should be corroborated with the other questions in this playbook,
    since sophisticated actors may temporarily modify-then-revert policy or split activity across on-premise
    AD and cloud tenants to evade any single detection.'
  answer_sources:
  - Windows Event ID 5136
  - Windows Event ID 5141
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '# GPO sequence anomaly modeling (Machine Learning)

      FEATURES from events (content, metadata, sequence, graph edges)

      SCORE with trained model (classifier | one-class | GNN | LSTM)

      WHERE score > tuned_threshold

      THEN raise_alert(entity, top_features, tactic)'
