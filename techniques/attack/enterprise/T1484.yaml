questions:
- question: '[Defense Impairment] Malicious GPO script correlation: Can you determine whether an update
    to a Group Policy Object''s script or scheduled task configuration (e.g., gpt.ini version increment
    plus a new ScheduledTasks.xml, startup/logon script, or Registry.pol entry in SYSVOL) introduces a
    file path, command, domain, or IP address matching a known malicious indicator, registers a Scheduled
    Tasks client-side-extension (CSE) GUID, or contains a script with abnormally high entropy. -- specifically
    using the ''Malicious GPO script correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), adversaries abuse T1484 Domain
    or Tenant Policy Modification -- altering Active Directory Group Policy Objects, user-rights assignments,
    federation/trust settings, or identity-provider configuration -- to escalate privileges and/or impair
    defenses across many systems at once (driving the PIR: Has the adversary escalated privileges by modifying
    domain or tenant policy? (PIR)). This evidence focuses on the condition that an update to a Group
    Policy Object''s script or scheduled task configuration (e.g., gpt.ini version increment plus a new
    ScheduledTasks.xml, startup/logon script, or Registry.pol entry in SYSVOL) introduces a file path,
    command, domain, or IP address matching a known malicious indicator, registers a Scheduled Tasks client-side-extension
    (CSE) GUID, or contains a script with abnormally high entropy. The ''Malicious GPO script correlation''
    method (Symbolic Logic) pursues it as follows: Parse GPO modification events (Windows Event ID 5136/5137)
    and SYSVOL writes (Event ID 5145, RelativeTargetName ending in ScheduledTasks.xml) to extract file
    paths, domains, IPs, and commands from script/preference content. Alert deterministically when gPCMachineExtensionNames/gPCUserExtensionNames
    adds the Scheduled Tasks CSE GUIDs (CAB54552-DEEA-4691-817E-ED4A4D1AFC72, AADCED64-746C-4633-A97C-D61349046527)
    per the [SigmaHQ GPO Scheduled Task rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_gpo_scheduledtasks.yml),
    or when extracted observables match a threat-intel feed; these SYSVOL artifacts are the documented
    weaponization path ([Schroeder, Abusing GPO Permissions](https://blog.harmj0y.net/redteaming/abusing-gpo-permissions/);
    [Metcalf, GPO Persistence](https://adsecurity.org/?p=2716)). A positive result -- a deterministic
    rule hit, a statistical outlier, or a model alert -- indicates a policy/configuration change that
    may grant adversary-controlled access, weaken monitoring, or persist malicious tasking; pivot to the
    modifying account, the source host, the target GPO/domain/tenant object, the change-control record,
    and any downstream execution or authentication it enables. A negative result helps rule out this specific
    vector but should be corroborated with the other questions in this playbook, since sophisticated actors
    may temporarily modify-then-revert policy or split activity across on-premise AD and cloud tenants
    to evade any single detection.'
  answer_sources:
  - Windows Event ID 5136
  - Windows Event ID 5137
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Domain Controllers, All Domain-joined Endpoints and Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Malicious GPO script correlation (Symbolic Logic)

      FROM events WHERE source IN data_sources

      APPLY rule logic derived from action; MATCH known-bad / allow-list violation

      THEN raise_alert(entity, evidence, tactic)'
  - technology: Zeek/pseudocode
    query: '# Malicious GPO script correlation (network corroboration)

      FROM conn.log, http.log JOIN GPO/script-extracted observables

      WHERE dest IN extracted_ips_domains OR matches threat_intel

      THEN raise_alert(host, dest, tactic)'
- question: '[Defense Impairment] Script entropy and volume scoring: Can you determine whether an update
    to a Group Policy Object''s script or scheduled task configuration (e.g., gpt.ini version increment
    plus a new ScheduledTasks.xml, startup/logon script, or Registry.pol entry in SYSVOL) introduces a
    file path, command, domain, or IP address matching a known malicious indicator, registers a Scheduled
    Tasks client-side-extension (CSE) GUID, or contains a script with abnormally high entropy. -- specifically
    using the ''Script entropy and volume scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), adversaries abuse T1484 Domain
    or Tenant Policy Modification -- altering Active Directory Group Policy Objects, user-rights assignments,
    federation/trust settings, or identity-provider configuration -- to escalate privileges and/or impair
    defenses across many systems at once (driving the PIR: Has the adversary escalated privileges by modifying
    domain or tenant policy? (PIR)). This evidence focuses on the condition that an update to a Group
    Policy Object''s script or scheduled task configuration (e.g., gpt.ini version increment plus a new
    ScheduledTasks.xml, startup/logon script, or Registry.pol entry in SYSVOL) introduces a file path,
    command, domain, or IP address matching a known malicious indicator, registers a Scheduled Tasks client-side-extension
    (CSE) GUID, or contains a script with abnormally high entropy. The ''Script entropy and volume scoring''
    method (Statistical Method) pursues it as follows: For embedded script content (.ps1/.vbs/.bat), compute
    Shannon entropy and byte length (Volume); baseline legitimate admin scripts and flag any exceeding
    the 95th percentile of entropy or length, since obfuscated payloads deviate measurably from a normal
    corpus ([Bohannon & Holmes, Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf)).
