    as a distinct State signal. A positive result -- a deterministic rule hit, a statistical outlier,
    or a model alert -- indicates a policy/configuration change that may grant adversary-controlled access,
    weaken monitoring, or persist malicious tasking; pivot to the modifying account, the source host,
    the target GPO/domain/tenant object, the change-control record, and any downstream execution or authentication
    it enables. A negative result helps rule out this specific vector but should be corroborated with
    the other questions in this playbook, since sophisticated actors may temporarily modify-then-revert
    policy or split activity across on-premise AD and cloud tenants to evade any single detection.'
