name: 'T1218.014: System Binary Proxy Execution: MMC'
id: 3336d4bc-a524-4338-a9e7-7082d0c83fc3
description: 'This playbook helps an analyst investigate whether an adversary is abusing the Microsoft
  Management Console (mmc.exe) to proxy execution of malicious .msc console files and COM objects as a
  defense-evasion / stealth technique (T1218.014). It guides the hunt across multiple behavioral angles
  on Windows endpoints and servers: execution of mmc.exe with .msc files whose hash or name matches threat
  intelligence; suspicious command-line switches such as -Embedding, /a, and destructive snap-in invocations
  like `wbadmin.msc delete catalog`; mmc.exe spawned by anomalous parents (Office apps, browsers, script
  hosts) or via remote DCOM activation; .msc files loaded from user-writable, temporary, ProgramData,
  or UNC paths instead of System32; anomalous outbound network connections from mmc.exe; creation of malicious
  COM CLSID registry keys (InprocServer32/LocalServer32) correlated with -Embedding invocations; and mmc.exe
  spawning shells or LOLBins (cmd, powershell, wscript, reg, regsvr32, bitsadmin). Each angle is pursued
  with symbolic-logic rules, statistical baselining/rarity scoring, and explainable machine-learning models
  applied to Sysmon (Event IDs 1, 3, 7, 11, 12/13, 22), Windows Security 4688, PowerShell, COM/Operational,
  and Zeek conn/dns telemetry, so the analyst can corroborate suspected MMC proxy execution against command
  line, process lineage, registry provenance, loaded modules, and network context.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
