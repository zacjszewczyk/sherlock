questions:
- question: '[Stealth] Match mmc .msc hashes to threat intel: Can you determine whether execution of mmc.exe
    with a console file (.msc) whose hash or name matches a known malicious indicator from threat intelligence.
    Use process creation telemetry for command-line, parent-process, and user context. -- specifically,
    using the ''Match mmc .msc hashes to threat intel'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses the signed Microsoft
    Management Console binary (mmc.exe) to proxy-execute malicious .msc consoles and COM objects, blending
    in with legitimate administrative activity while evading defenses. This evidence focuses on the condition
    that execution of mmc.exe with a console file (.msc) whose hash or name matches a known malicious
    indicator from threat intelligence. Use process creation telemetry for command-line, parent-process,
    and user context. This Symbolic Logic approach looks for the following signal: Correlate process,
    file, and network telemetry before applying the rule. Parse mmc.exe command lines (Sysmon Event ID
    1, Windows Event ID 4688) to extract `.msc` paths, compute or read the file hash from Sysmon Event
    ID 11/15, and alert when the hash or name matches malicious threat intelligence. Anchor the deterministic
    tokens (image=`mmc.exe`, args containing `-Embedding`, `/a`, or a non-standard `.msc` path) documented
    in [LOLBAS — Mmc.exe](https://lolbas-project.github.io/lolbas/Binaries/Mmc/) and [MITRE ATT&CK T1218.014](https://attack.mitre.org/techniques/T1218/014/);
    validate coverage with [Atomic Red Team T1218.014](https://github.com/redcanaryco/atomic-red-team).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests mmc.exe is being
    used to launch unauthorized .msc/COM payloads, evade detection, or proxy follow-on execution; pivot
    to the responsible mmc.exe process, its command line and .msc path, parent lineage, the user/host
    context, any CLSID registry writes or loaded modules, child processes, and outbound connections. A
    negative result helps rule out this MMC proxy-execution vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy or living-off-the-land abuse.'
