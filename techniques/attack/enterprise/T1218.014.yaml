    wscript.exe, cscript.exe, reg.exe, regsvr32.exe, bitsadmin.exe). A benign MMC console almost never
    launches a shell; this is the canonical proxy/DCOM execution artifact. Use process creation telemetry
    for command-line, parent-process, and user context. -- specifically, using the ''Classify mmc process
    subtrees with explainable model'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses the signed Microsoft
    Management Console binary (mmc.exe) to proxy-execute malicious .msc consoles and COM objects, blending
    in with legitimate administrative activity while evading defenses. This evidence focuses on the condition
    that mmc.exe spawns a child command interpreter, scripting host, or LOLBin (cmd.exe, powershell.exe,
    pwsh.exe, wscript.exe, cscript.exe, reg.exe, regsvr32.exe, bitsadmin.exe). A benign MMC console almost
    never launches a shell; this is the canonical proxy/DCOM execution artifact. Use process creation
    telemetry for command-line, parent-process, and user context. This Machine Learning approach looks
    for the following signal: Score the mmc.exe child subtree with an XGBoost-plus-graph model of parent-child
    probabilities per [ProblemChild, Elastic](https://ar5iv.labs.arxiv.org/html/2008.04676); flag rare/malicious
    chains (e.g., mmc.exe→powershell.exe→net.exe) and surface the top-3 contributing features (rare child,
    encoded command, network child) in the alert. A positive result -- a rule match, statistical outlier,
    or model alert -- suggests mmc.exe is being used to launch unauthorized .msc/COM payloads, evade detection,
    or proxy follow-on execution; pivot to the responsible mmc.exe process, its command line and .msc
    path, parent lineage, the user/host context, any CLSID registry writes or loaded modules, child processes,
    and outbound connections. A negative result helps rule out this MMC proxy-execution vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy
    or living-off-the-land abuse.'
  answer_sources: *id007
  range: Last 90 days (train on 30-90 day history; score rolling windows)
  queries:
  - technology: SIEM/ML pseudocode
    query: '# Classify mmc process subtrees with explainable model

      source IN [Sysmon Event ID 1, Windows Event ID 4688]

      | FEATURIZE events (path/cmdline/parent-child/registry/module/flow features)

      | SCORE model.predict(features)

      // Score the mmc.exe child subtree with an XGBoost-plus-graph model of parent-child probabilities
      per [ProblemChild, Elasti

      | WHERE score > threshold | ALERT with top-3 feature attribution'
