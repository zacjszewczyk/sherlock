questions:
- question: Are any named-pipe create (Sysmon Event ID 17) or connect (Sysmon Event ID 18) events using
    pipe names that match known-malicious or default C2 pipe signatures?
  context: Adversaries abusing IPC for execution frequently rely on named pipes whose names match well-known
    offensive tooling defaults (e.g., Cobalt Strike post-exploitation modules such as \\.\pipe\msagent_##,
    \\.\pipe\postex_####, \\.\pipe\status_##, \\.\pipe\MSSE-####). Under the Execution tactic, a match
    means a process is almost certainly using a pipe to receive commands or stage code execution. Match
    the 'PipeName' field against a curated threat-intel deny-list plus jitter-aware regex variants and
    community pipe_created Sigma rules. Any hit is high-fidelity and should be retained as a determinism
    floor regardless of ML coverage; a negative result does not rule out custom pipe names, which the
    statistical and ML methods address.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source IN (Sysmon EID 17, Sysmon EID 18)\n  | where match(PipeName, TI_pipe_regex_list)\n\
      \     OR PipeName IN known_malicious_pipes  // msagent_##, postex_####, status_##, MSSE-####\n \
      \ | emit alert(host, process, PipeName, EventID)"
  answer_sources: &id001
  - Windows Sysmon Event ID 17
  - Windows Sysmon Event ID 18
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
- question: Which hosts or processes create named pipes with anomalously high name entropy, abnormal creation
    volume, or an elevated ratio of failed-to-successful pipe connects relative to their role baseline?
  context: 'Custom or randomized pipe names defeat signature matching, so profile the statistical shape
    of named-pipe activity instead. For each pipe create (EID 17) compute Shannon entropy of the pipe
    name and baseline entropy per creating process, flagging names above the 95th percentile when created
    by non-system processes (not svchost.exe/lsass.exe). Add Volume/Frequency/State metrics: pipe creations
    per process per minute and the ratio of failed pipe connects (EID 18 to nonexistent/denied pipes)
    to successful ones. Flag hosts exceeding 3x the Median Absolute Deviation from the role baseline,
    a robust outlier threshold resistant to noisy data. In the Execution context, a spike of high-entropy
    pipes from an unusual process suggests staged IPC execution; derive per-environment thresholds from
    a 30-day baseline.'
  range: Last 90 days (derive baselines from a rolling 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  source=Sysmon EID 17\n  | eval ent = shannon_entropy(PipeName)\n  | stats p95(ent) as ent95,\
      \ by Image\n  | join baseline_30d\n  | where ent > ent95 AND Image NOT IN (svchost.exe, lsass.exe)\n\
      \  | eval create_rate = count(PipeName) by Image span=1m\n  | eval fail_ratio = failed_connects(EID18)/successful_connects(EID18)\n\
      \  | where create_rate > role_baseline + 3*MAD OR fail_ratio > role_baseline_fail + 3*MAD"
  answer_sources: *id001
- question: Does an explainable classifier or provenance-graph model flag a named-pipe event as malicious,
    and which features (parent process, pipe-name entropy, signed status) drive that score?
  context: To catch novel IPC abuse, train a Random Forest / Gradient Boosting classifier on named-pipe
    features (creating process, parent process, pipe-name entropy/length, user context, signed status)
    using labeled benign and known-malicious pipe activity. Require every alert to surface the top-3 contributing
    features (e.g., parent=WINWORD.EXE, entropy=0.92, unsigned image) so an analyst can quickly validate.
    In parallel, model process->pipe->process causality with whole-system provenance graph learning (ThreaTrace,
    KAIROS) to flag anomalous IPC nodes without labels. For the Execution tactic, a high score with an
    Office parent and unsigned image strongly indicates IPC-driven code execution; the feature attribution
    distinguishes true positives from benign-but-rare pipe usage.
  range: Last 90 days (train on a longer labeled corpus; score recent events)
  queries:
  - technology: ML/Pseudocode
    query: "  features = [creating_proc, parent_proc, pipename_entropy, pipename_len, user_ctx, signed]\n\
      \  score = RandomForest.predict_proba(features)\n  if score > threshold: alert(top3_features(features))\n\
      \  // unlabeled: provenance_graph(proc->pipe->proc); flag anomalous IPC nodes (ThreaTrace/KAIROS)"
  answer_sources: *id001
- question: Did a Microsoft Office application or PDF reader spawn a command interpreter or scripting/proxy-execution
    binary (the canonical DDE child-spawn pattern)?
  context: Dynamic Data Exchange (DDE) and related document-borne IPC abuse cause documents to launch
    child processes that should never originate from a viewer application. Alert when a process creation
    event (Windows Event ID 4688 or Sysmon Event ID 1) shows 'ParentProcessName' in [WINWORD.EXE, EXCEL.EXE,
    POWERPNT.EXE, OUTLOOK.EXE, AcroRd32.exe] and 'NewProcessName' in [cmd.exe, powershell.exe, wscript.exe,
    cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe]. This maps directly to ATT&CK T1559.002 and MITRE
    CAR-2014-05-002. Under the Execution tactic, a hit means a document very likely executed attacker
    code via IPC. Keep this as a deterministic floor; tune out any legitimate macro-enabled line-of-business
    documents observed in the baseline.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source IN (WinEventLog EID 4688, Sysmon EID 1)\n  | where ParentProcessName IN (WINWORD.EXE,EXCEL.EXE,POWERPNT.EXE,OUTLOOK.EXE,AcroRd32.exe)\n\
      \     AND NewProcessName IN (cmd.exe,powershell.exe,wscript.exe,cscript.exe,mshta.exe,rundll32.exe,regsvr32.exe)\n\
      \  | emit alert(host, ParentProcessName, NewProcessName, CommandLine)"
  answer_sources: &id002
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - 'NAI: User Workstations, Virtual Desktop Infrastructure (VDI) fleet, Remote Desktop Servers'
- question: Among parent->child process pairs, which Office-to-shell spawns fall in the rarest 1st percentile
    of your 30-day baseline, and how many of those children exit non-zero or are blocked by policy?
  context: DDE payloads are rare and often fail on first execution, so rarity and failure are strong signals.
    Build a 30-day frequency table of parent->child process pairs and alert on pairs in the bottom 1st
    percentile of rarity (e.g., EXCEL.EXE->cmd.exe with baseline near zero). Add State metrics counting
    child processes that exit non-zero or are blocked by EDR/AppLocker policy. Score deviations with robust
    statistics (Median Absolute Deviation) to resist noisy baselines. In the Execution context, a near-zero-baseline
    pair suddenly appearing—especially with execution errors—suggests document-driven IPC execution rather
    than benign automation.
  range: Last 90 days (derive baselines from a rolling 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  baseline = freq_table(parent->child, span=30d)\n  | where percentile_rank(parent->child)\
      \ < 1\n  | eval nonzero_exit = count(child where exit_code!=0 OR blocked_by_policy)\n  | score =\
      \ MAD_deviation(parent->child, baseline)\n  | emit alert(host, parent, child, rarity, nonzero_exit)"
  answer_sources: *id002
- question: Does time-series or provenance-graph analysis flag an anomalous spike in shells spawned per
    Office parent, or an anomalous execution subgraph rooted at a document application?
  context: Use time-series anomaly detection (Seasonal-Trend decomposition / LOESS) on the daily count
    of shells spawned per Office parent; a spike from a normally-zero baseline (e.g., EXCEL.EXE) is flagged
    with the offending parent and count surfaced in the alert. In parallel, score the full execution chain
    with provenance graph models that adapt to drift (MAGIC, KAIROS), reporting the anomalous causal subgraph
    for triage. For the Execution tactic this catches both a sudden campaign-driven burst of DDE activity
    and stealthy single-instance chains where an Office app leads to downstream execution that deviates
    from learned normal behavior.
  range: Last 90 days (train on a longer labeled corpus; score recent events)
  queries:
  - technology: ML/Pseudocode
    query: "  series = daily_count(shells per Office_parent)\n  resid = STL_decompose(series).residual\n\
      \  if resid > ci_upper: alert(parent, count)\n  // provenance: score execution chain (MAGIC/KAIROS);\
      \ report anomalous causal subgraph"
  answer_sources: *id002
- question: Is a single source host making an anomalously high number of DCOM/RPC connections to many
    unique internal destinations on TCP/135, or calling RPC operations associated with remote execution?
  context: Remote IPC execution via DCOM/RPC produces a recognizable fan-out and specific operation calls.
    Alert when a single source IP (id.orig_h in Zeek conn.log) connects to destination port 135 on more
    than 20 unique destinations (id.resp_h) within 10 minutes, excluding sanctioned scanners/management
    hosts. Additionally parse Zeek dce_rpc.log for remote-execution operations and endpoints (svcctl,
    atsvc, IDispatch/IRemUnknown, ShellWindows) and alert on ATT&CK-mapped DCOM/RPC execution methods
    (BZAR). Under the Execution tactic, this combination indicates lateral remote-IPC execution; the operation
    match is high-fidelity even when fan-out is low.
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "  conn.log: dest_port=135\n  | bin 10m | stats dcount(id.resp_h) as fanout by id.orig_h\n\
      \  | where fanout > 20 AND id.orig_h NOT IN sanctioned_scanners\n  ; dce_rpc.log: where operation\
      \ IN (svcctl,atsvc,IDispatch,IRemUnknown,ShellWindows)\n  | emit alert(src, fanout/operation)"
  answer_sources: &id003
  - Zeek conn.log
  - Zeek dce_rpc.log
  - Windows Event ID 5156
  - 'NAI: East-West traffic between workstations, Server-to-workstation traffic lanes, Network egress
    points monitoring port 135'
- question: Which source hosts exceed their role baseline for unique RPC (TCP/135) destinations per hour,
    or show an elevated rate of blocked connections and failed/denied RPC binds?
  context: 'Per source host, baseline the number of unique RPC (port 135) destinations per hour and alert
    when it exceeds 3 standard deviations / the 99th percentile for its role. Add Failure-Mode awareness:
    profile the rate of blocked connections (Windows Event ID 5157) and failed/denied RPC binds as a distinct
    signal of spray-style remote-IPC attempts. Use robust outlier ensembles (PCA, k-means, MAD) over host-communication
    graphs to limit false positives. In the Execution context, a workstation that normally talks to a
    handful of RPC peers suddenly spraying many destinations—especially with many denied binds—suggests
    remote-execution attempts via DCOM/RPC.'
  range: Last 90 days (derive baselines from a rolling 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  per src_host: baseline dcount(rpc_dest) per hour\n  | where dcount(rpc_dest) > mean + 3*stddev\
      \ OR > p99(role)\n  | join blocked_conns(WinEvent 5157), failed_rpc_binds\n  | ensemble_outlier(PCA,\
      \ kmeans, MAD) over host_comm_graph\n  | emit alert(src, fanout, failed_binds)"
  answer_sources: *id003
- question: Does forecasting or graph-based link-prediction flag RPC traffic above its confidence interval
    or improbable new DCOM edges between hosts?
  context: Apply time-series forecasting (ARIMA) to RPC traffic volume (bytes/connection counts) between
    zones and alert when observed traffic exceeds the forecast confidence interval. Layer temporal link-prediction
    and rare-path inference over the host-to-host RPC graph (EULER, Hopper) to rank improbable new DCOM
    edges, surfacing the source, destination, and path rarity in the alert. For the Execution tactic,
    a brand-new RPC edge between two endpoints that have never communicated, or a volume spike beyond
    forecast, is a strong indicator of remote IPC execution being used for lateral movement and code execution.
  range: Last 90 days (train on a longer labeled corpus; score recent events)
  queries:
  - technology: ML/Pseudocode
    query: "  forecast = ARIMA(rpc_volume_by_zone)\n  if observed > forecast.ci_upper: alert(zone, volume)\n\
      \  // graph: temporal link-prediction over host RPC graph (EULER/Hopper)\n  // rank improbable new\
      \ DCOM edges -> alert(src,dst,path_rarity)"
  answer_sources: *id003
- question: Is a process instantiating an abusable COM object (by CLSID/ProgID) or invoking COM-execution
    command-line patterns associated with execution?
  context: Component Object Model (COM) abuse lets adversaries execute code through privileged interfaces.
    Search command lines (Sysmon Event ID 1, Windows Event ID 4688) for COM-execution patterns (rundll32.exe
    with a CLSID, 'New-Object -ComObject', regsvr32 scriptlets) and registry/image-load events (Sysmon
    EID 7/13) referencing abusable CLSIDs/ProgIDs (MMC20.Application, ShellWindows, ShellBrowserWindow,
    Excel.Application). Match against a curated allow/deny list and alert on hits (ATT&CK T1559.001).
    Under the Execution tactic, instantiation of these objects—especially lateral-execution capable ones—signals
    IPC-driven code execution. Retain these signatures as a determinism floor.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source IN (Sysmon EID 1, WinEvent 4688, Sysmon EID 7/13)\n  | where match(CommandLine, /rundll32.*CLSID|New-Object\
      \ -ComObject|regsvr32.*scrobj/)\n     OR ProgID IN (MMC20.Application,ShellWindows,ShellBrowserWindow,Excel.Application)\n\
      \  | where CLSID/ProgID IN deny_list\n  | emit alert(host, parent, CLSID/ProgID, CommandLine)"
  answer_sources: &id004
  - Windows Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows Sysmon Event ID 10
  - Windows Sysmon Event ID 13
  - 'NAI: User Workstations, Application Servers, Windows Registry hives (HKCR\CLSID)'
- question: Which parent processes instantiate execution-related COM objects at a statistically rare rate,
    or exceed their per-host 99th-percentile instantiation frequency?
  context: Baseline the parents that legitimately instantiate execution-related COM objects (e.g., explorer.exe->ShellBrowserWindow)
    and their per-host frequency. Alert when a statistically rare parent (e.g., services.exe, powershell.exe)
    instantiates one, or when a common parent's instantiation rate exceeds its 99th percentile, scored
    with robust deviation thresholds (MAD). In the Execution context, an unusual parent reaching for an
    execution-capable COM object is a strong indicator of COM hijack/abuse for code execution, distinguishing
    it from the normal explorer/Office usage that dominates the baseline.
  range: Last 90 days (derive baselines from a rolling 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  baseline = freq(parent -> COM_object) per host\n  | where parent NOT IN legit_parents(COM_object)\
      \  // e.g., not explorer.exe->ShellBrowserWindow\n     OR rate(parent->COM_object) > p99(host)\n\
      \  | score = MAD_deviation\n  | emit alert(host, parent, COM_object)"
  answer_sources: *id004
- question: Does an explainable classifier or provenance model flag a COM instantiation as malicious,
    and which features (parent, CLSID/ProgID, command-line tokens, interactivity) explain it?
  context: Train a Gradient Boosting classifier on parent process, target CLSID/ProgID, user context,
    command-line tokens, and interactivity to classify COM instantiation as benign/malicious, with the
    top-3 contributing features included in every alert. Complement with provenance graph node-anomaly
    scoring of the COM-driven process chain (ThreaTrace, MAGIC) to catch novel CLSID abuse without labels.
    For the Execution tactic, a non-interactive process invoking an execution-capable CLSID with scriptlet-style
    command-line tokens is highly suspicious; the feature attribution lets an analyst confirm whether
    the COM call is part of an attack chain.
  range: Last 90 days (train on a longer labeled corpus; score recent events)
  queries:
  - technology: ML/Pseudocode
    query: "  features = [parent, target_CLSID/ProgID, user_ctx, cmdline_tokens, interactivity]\n  score\
      \ = GradientBoosting.predict_proba(features)\n  if score > threshold: alert(top3_features)\n  //\
      \ provenance node-anomaly on COM process chain (ThreaTrace/MAGIC) for novel CLSIDs"
  answer_sources: *id004
- question: Are there long-lived, low-volume internal TCP connections on non-allow-listed ports (duration
    > 24 hours, total bytes < 1MB) consistent with a custom socket-based C2 channel?
  context: Custom socket-based IPC/C2 between internal hosts tends to be persistent but quiet. Query successful
    internal TCP connections (Zeek conn.log, both id.orig_h and id.resp_h internal) on ports outside an
    application allow-list and alert on any connection with 'duration' > 24 hours and total bytes (orig_bytes
    + resp_bytes) < 1MB—the long-connection heuristic used by RITA for custom socket C2. Under the Execution
    tactic, such a channel may carry interactive commands between an operator-controlled foothold and
    a victim. Keep this concrete threshold as a determinism floor and exclude known long-lived application/management
    sessions.
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "  conn.log: id.orig_h internal AND id.resp_h internal\n  | where id.resp_p NOT IN app_allow_list\n\
      \     AND duration > 24h AND (orig_bytes + resp_bytes) < 1MB\n  | emit alert(src, dst, port, duration,\
      \ bytes)"
  answer_sources: &id005
  - Zeek conn.log
  - 'NAI: Internal network segments (workstation-to-workstation, server-to-server), DMZ-to-internal traffic,
    VPN user subnets'
- question: Which internal connections are outliers by low data-to-duration ratio, and do their inter-arrival
    timings show beacon-like regularity (low coefficient of variation / strong autocorrelation)?
  context: 'Compute a data-to-duration ratio ((orig_bytes + resp_bytes)/duration) for internal connections
    and flag the lowest 1st percentile. Add Frequency analysis: score inter-arrival regularity via coefficient
    of variation and autocorrelation/FFT periodicity, tuned against benign periodic-traffic baselines
    to suppress update/telemetry beacons, and profile failed/blocked connection rates as a distinct State
    signal (RITA, BAYWATCH). In the Execution context, a connection that moves almost no data yet persists,
    and beacons on a regular cadence, is characteristic of a custom IPC/C2 channel rather than bulk data
    transfer.'
  range: Last 90 days (derive baselines from a rolling 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  eval ratio = (orig_bytes + resp_bytes)/duration\n  | where percentile_rank(ratio) < 1\n\
      \  | eval cv = stddev(interarrival)/mean(interarrival)\n  | eval periodic = autocorr_or_fft(interarrival)\n\
      \  | where cv < low_threshold OR periodic_score high\n  | join failed_conn_rate\n  | emit alert(src,dst,ratio,cv)"
  answer_sources: *id005
- question: Does clustering or sequence modeling flag internal connections as beacon outliers, including
    high-jitter beacons that defeat periodicity statistics?
  context: Run DBSCAN on connection features (duration, orig_bytes, resp_bytes, id.resp_p, data-to-duration
    ratio) and flag noise points outside all clusters, surfacing the deviating features. For high-jitter
    beacons that defeat CV/FFT statistics, apply continuous-time HMM or LSTM/transformer time-series models
    on inter-arrival sequences (NetSpectra Sentinel CT-HMM; AI-based C2 beaconing detection). Under the
    Execution tactic, this catches operator-tuned jittered channels that evade fixed thresholds, identifying
    covert socket-based IPC/C2 between internal hosts where rule-based and statistical methods fall short.
  range: Last 90 days (train on a longer labeled corpus; score recent events)
  queries:
  - technology: ML/Pseudocode
    query: "  X = [duration, orig_bytes, resp_bytes, id.resp_p, data_to_duration_ratio]\n  labels = DBSCAN(X);\
      \ flag noise_points -> alert(deviating_features)\n  // high-jitter: CT-HMM or LSTM/transformer over\
      \ interarrival sequences"
  answer_sources: *id005
