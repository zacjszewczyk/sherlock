name: 'T1559: Inter-Process Communication'
id: 744d1b41-8a4c-4463-aa65-34fc24e45916
description: 'Investigate adversary abuse of inter-process communication (IPC) mechanisms for local or
  remote code and command execution across Windows, Linux, and macOS hosts. This playbook helps an analyst
  hunt for and triage: malicious or anomalous named-pipe creation/connection (Sysmon EID 17/18) matching
  known C2 signatures (e.g., Cobalt Strike default pipes); command interpreters spawned by Office applications
  or PDF readers indicative of Dynamic Data Exchange (DDE) abuse; anomalous DCOM/RPC fan-out and remote-execution
  operations over TCP/135; Component Object Model (COM) object instantiation via abusable CLSIDs/ProgIDs
  from anomalous parents; and long-lived, low-volume internal socket connections suggestive of custom
  C2 channels. Each line of inquiry pairs a deterministic signature floor with statistical outlier detection
  and explainable/provenance-based machine learning so analysts can detect both commodity tooling and
  novel IPC abuse.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
