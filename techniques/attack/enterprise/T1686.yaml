questions:
- question: '[Defense Impairment] Command-path firewall tamper alert: Can you determine whether a process
    or script executes with command-line arguments or a file path associated with firewall tampering,
    and the event is temporally correlated with subsequent firewall modification activity on the same
    host. -- specifically, using the ''Command-path firewall tamper alert'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary disables or modifies
    a system firewall to bypass controls limiting network usage, enabling C2, lateral movement, or exfiltration
    that the firewall would otherwise block. This evidence focuses on the condition that a process or
    script executes with command-line arguments or a file path associated with firewall tampering, and
    the event is temporally correlated with subsequent firewall modification activity on the same host.
    The ''Command-path firewall tamper alert'' approach (Symbolic Logic) works as follows: Alert when
    Windows Event ID 4688 or 4104 shows firewall-modifying commands/binaries (`netsh advfirewall set ...
    state off`, `Set-NetFirewallProfile -Enabled False`, `sc stop mpssvc`) executing before a registry
    edit, service stop, or other firewall change on the same host within a 5-minute window; extend the
    same pattern to Linux (`ufw disable`, `iptables -F`, `systemctl stop firewalld`) and macOS (`pfctl
    -d`, `socketfilterfw --setglobalstate off`) per [Atomic Red Team T1686](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1686/T1686.md)
    and the netsh signatures in [Sigma — Firewall Disabled via Netsh](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_netsh_fw_disable.yml).
    Encode the tamper->change->egress chain once as a provenance query graph and match it against kernel-audit
    graphs per [POIROT](https://dl.acm.org/doi/10.1145/3319535.3363217) to correlate the multi-stage behavior
    on first-party logs. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable firewall tampering; pivot to the responsible host, the user/account and parent process that
    initiated the change, the specific firewall artifact modified (command, registry key, service, or
    rule), and the resulting network posture (newly opened ports, new inbound sources, or anomalous egress)
    to scope the impact and tie the change to an approved change ticket or confirm it as malicious. A
    negative result helps rule out this particular vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land firewall
    changes.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4657
  - Windows Event ID 7036
  - Windows Event ID 7040
  - 'NAI: User Workstations, Application Servers, Domain Controllers, Virtualization Hosts (Hypervisors)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "search EventCode IN (4688,4104,4657,7036,7040)\n| where match(CommandLine, \"(?i)(netsh.*firewall.*(set|add|delete)|Set-NetFirewallProfile|EnableFirewall=0|ufw\
      \ (disable|allow)|iptables -F|pfctl -[df]|socketfilterfw --setglobalstate off|esxcli network firewall\
      \ set --enabled false|no access-list|permit any any)\")\n   OR (RegistryKey LIKE \"%SharedAccess\\\
      \\Parameters\\\\FirewallPolicy%\")\n   OR (Service=\"mpssvc\" AND EventCode IN (7036,7040))\n| join\
      \ host within 5m subsequent firewall_change OR risky_port_conn\n| where NOT change_ticket_approved\n\
      | emit alert with host, user, parent_process, artifact"
- question: '[Defense Impairment] Parent-child rarity scoring: Can you determine whether a process or
    script executes with command-line arguments or a file path associated with firewall tampering, and
    the event is temporally correlated with subsequent firewall modification activity on the same host.
    -- specifically, using the ''Parent-child rarity scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary disables or modifies
    a system firewall to bypass controls limiting network usage, enabling C2, lateral movement, or exfiltration
    that the firewall would otherwise block. This evidence focuses on the condition that a process or
    script executes with command-line arguments or a file path associated with firewall tampering, and
    the event is temporally correlated with subsequent firewall modification activity on the same host.
    The ''Parent-child rarity scoring'' approach (Statistical Method) works as follows: Score parent-child
    relationships for firewall tools against 30-day per-host/per-user baselines and prioritize rare pairings
    such as a user shell or Office/browser process spawning `netsh.exe`, PowerShell firewall cmdlets,
    `pfctl`, or `esxcli`. Use a median/MAD modified Z-score (flag |0.6745*(x-median)/MAD| > 3.5) so batch
    admin activity does not poison thresholds [DEW #145](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly),
    and profile change attributes (port scope, hour-of-day, source-set size) with a multi-model per-feature
    scorer [Kruegel & Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable firewall
    tampering; pivot to the responsible host, the user/account and parent process that initiated the change,
    the specific firewall artifact modified (command, registry key, service, or rule), and the resulting
    network posture (newly opened ports, new inbound sources, or anomalous egress) to scope the impact
    and tie the change to an approved change ticket or confirm it as malicious. A negative result helps
    rule out this particular vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, low-and-slow, or living-off-the-land firewall changes.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4657
  - Windows Event ID 7036
  - Windows Event ID 7040
  - 'NAI: User Workstations, Application Servers, Domain Controllers, Virtualization Hosts (Hypervisors)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search firewall_events OR conn_events by host,user over 30d

      | stats count as x by host,user,feature  // parent-child, port, hour, ip-count

      | eventstats median(x) as med, mad(x) as mad by feature

      | eval mz = 0.6745*(x-med)/mad

      | where abs(mz) > 3.5

      | append [ changepoint(per_host_series) where regime_shift=true ]

      | emit alert with host,user,feature,score'
- question: '[Defense Impairment] Gradient Boosting risk scoring: Can you determine whether a process
    or script executes with command-line arguments or a file path associated with firewall tampering,
    and the event is temporally correlated with subsequent firewall modification activity on the same
    host. -- specifically, using the ''Gradient Boosting risk scoring'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary disables or modifies
    a system firewall to bypass controls limiting network usage, enabling C2, lateral movement, or exfiltration
    that the firewall would otherwise block. This evidence focuses on the condition that a process or
    script executes with command-line arguments or a file path associated with firewall tampering, and
    the event is temporally correlated with subsequent firewall modification activity on the same host.
    The ''Gradient Boosting risk scoring'' approach (Machine Learning) works as follows: Use a Gradient
    Boosting model on process metadata, command text, and host events to predict firewall-evasion likelihood
    and prioritize hosts diverging from normal change-management activity; layer an adaptive misuse-detection
    model trained on benign events and known evasions to catch obfuscated `netsh`/`ufw` variants while
    naming the evaded deterministic rule [AMIDES](https://www.usenix.org/system/files/sec23winter-prepub-112-uetz.pdf).
    Surface the top-3 contributing features (parent-process rarity, command-token novelty, time-since-last-change)
    in the alert via LIME/SHAP attribution [Isolation Forest / One-Class SVM with LIME](https://www.nature.com/articles/s41598-025-20445-4)
    rather than emitting only a score. A positive result -- a rule match, statistical outlier, or model
    alert -- indicates probable firewall tampering; pivot to the responsible host, the user/account and
    parent process that initiated the change, the specific firewall artifact modified (command, registry
    key, service, or rule), and the resulting network posture (newly opened ports, new inbound sources,
    or anomalous egress) to scope the impact and tie the change to an approved change ticket or confirm
    it as malicious. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land firewall changes.'
