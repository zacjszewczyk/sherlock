name: 'T1686: Disable or Modify System Firewall'
id: 3bb94736-e9a0-4ef8-8484-9b5f1153454d
description: 'This playbook helps an analyst investigate whether an adversary has disabled or modified
  a system firewall to bypass controls limiting network usage (MITRE ATT&CK T1686, Disable or Modify System
  Firewall). Adversaries tamper with host-based and network firewalls -- disabling the entire mechanism,
  stopping or disabling the Windows Defender Firewall service (mpssvc), editing registry policy under
  HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy, or running native utilities
  (netsh, PowerShell Set-NetFirewallProfile, ufw, iptables, nftables, firewalld, pfctl, socketfilterfw,
  esxcli network firewall, or network-device ACL changes) -- in order to enable C2 communications, lateral
  movement, and data exfiltration that the firewall would otherwise block, including adding rules that
  expose remote-administration ports (RDP, SMB, SSH) on standard or non-standard ports. The hunt pursues
  the behavior from several complementary angles: firewall-modifying commands and script blocks executing
  on the host and temporally correlated with a subsequent firewall change; rare parent-child process relationships
  for firewall tools; registry and service-control modifications to firewall policy; firewall edits followed
  within minutes by connections on risky or statistically uncommon ports; sudden sustained increases in
  listening ports or unique inbound source IPs indicating a host''s posture has changed; configuration
  changes tied to newly reachable management ports; and cross-platform (Linux, macOS, ESXi, network device)
  firewall-disable commands followed by an egress/ingress posture shift. Detection methods combine deterministic
  symbolic-logic rules (command/registry/service signatures, provenance query graphs, risky-port correlation,
  allow-list and ticketed-change enforcement), statistical baselining (median/MAD modified Z-scores, parent-child
  rarity scoring, command-stream entropy and change-point detection, 99th-percentile port deviation, listening-port
  and inbound-IP spike detection), and machine learning (Gradient Boosting and adaptive misuse-detection
  risk scoring with LIME/SHAP attribution, LSTM/DistilBERT command-sequence anomaly detection, Isolation
  Forest/One-Class SVM outlier scoring, traffic-profile clustering, and whole-system provenance graph
  models such as KAIROS and ThreaTrace), applied across Windows Security and Sysmon events, auditd, macOS
  unified logs, ESXi hostd, network-device CLI, and Zeek conn.log, so the analyst can corroborate suspected
  firewall tampering against host, user, and network context.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
