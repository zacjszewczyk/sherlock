  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = extract(process_meta, command_text, registry, service, conn_stream)\nmodel = load(\"\
      gbm|isolation_forest|lstm_logkey|provenance_graph\")\nscore = model.predict(features)\nif score\
      \ > threshold:\n    top = explain(features, method=\"SHAP|LIME|node-attribution\")[:3]\n    emit\
      \ alert(host, user, score, top_features=top, subgraph=reconstruct())"
