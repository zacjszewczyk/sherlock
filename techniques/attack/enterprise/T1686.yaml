- question: '[Defense Impairment] Registry/service firewall policy alerting: Can you determine whether
    a modification is detected in a Windows Registry key under `HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy`,
    or the Windows Defender Firewall service (mpssvc) is stopped (Event ID 7036) or its start-up type
    is changed to disabled (Event ID 7040). -- specifically, using the ''Registry/service firewall policy
    alerting'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary disables or modifies
    a system firewall to bypass controls limiting network usage, enabling C2, lateral movement, or exfiltration
    that the firewall would otherwise block. This evidence focuses on the condition that a modification
    is detected in a Windows Registry key under `HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy`,
    or the Windows Defender Firewall service (mpssvc) is stopped (Event ID 7036) or its start-up type
    is changed to disabled (Event ID 7040). The ''Registry/service firewall policy alerting'' approach
    (Symbolic Logic) works as follows: Alert on modifications to `HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy`
    (including EnableFirewall=0 and DisableNotifications) or mpssvc stop/start-type changes (Event ID
    7036/7040) unless tied to an approved change ticket, per the authoritative artifact list in [Configure
    Windows Firewall logging](https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/configure-logging)
    and the registry signature in [Sigma — Disable Windows Firewall by Registry](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_disable_windows_firewall.yml).
    Require every disable or deny->allow change to map to a documented, version-controlled policy change
    [NIST SP 800-41 Rev. 1](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-41r1.pdf).
