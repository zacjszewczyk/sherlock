    | findstr /B /C:"System Locale"` or `wmic os get locale`. This Statistical Method approach works as
    follows: Apply fleet-wide prevalence (stack-counting) to the parent process and image of every matching
    event, per [Microsoft frequency-analysis guidance](0). Maintain a baseline of common parents (`explorer.exe`,
    `cmd.exe`, `powershell.exe`); flag parents below the 1st percentile (e.g., `winword.exe`, `mshta.exe`,
    web-server worker). Add Volume/Frequency physics: alert when a single host issues >3 distinct discovery
    commands in 5 minutes, and profile the Failure-mode signal of discovery commands returning non-zero
    exit codes or empty results (probing). LOTL baselining rationale in [CISA/NSA guidance](1). A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable system-language
    discovery; pivot to the responsible process and its parent lineage, the user and logon session, the
    host and its role, the exact registry keys/APIs/commands touched, and any preceding delivery (Office/script/downloaded
