questions:
- question: '[Discovery] Can you determine whether a process creation event is recorded with a command
    line containing a known system language discovery command, such as `systeminfo | findstr /B /C:"System
    Locale"` or `wmic os get locale`. -- specifically, by applying the ''Create a detection rule to monitor
    process creation events (Windows Event ID 4688, Sysmon Event ID 1) f'' (Symbolic Logic) approach to
    investigate potential system language discovery (MITRE ATT&CK T1614.001)?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary attempts to gather the
    system language, locale, and keyboard-layout of a victim host to infer its geographic location and
    decide whether to proceed, tailor follow-on actions, or abort to evade scrutiny from specific law
    enforcement or researchers. This evidence focuses on the condition that a process creation event is
    recorded with a command line containing a known system language discovery command, such as `systeminfo
    | findstr /B /C:"System Locale"` or `wmic os get locale`. This Symbolic Logic approach works as follows:
    Alert on process creation (Windows Event ID 4688 / Sysmon Event ID 1) whose command line matches curated
    high-confidence system-language discovery patterns: `reg query` containing `Control\Nls\Language`,
    `wmic os get Locale,OSLanguage,MUILanguages`, `systeminfo` piped to `findstr` for "System Locale",
    `dism.exe /online /get-intl`, and `Get-WinSystemLocale`/`Get-Culture`. These exact emulation strings
    are published in [Atomic Red Team T1614.001](0) and the [SigmaHQ reg.exe system-language rule](1);
    the API/registry targets are enumerated in [MITRE ATT&CK T1614.001](2). Keep these deterministic rules
    as the detection floor. A positive result -- a rule match, statistical outlier, or model alert --
    indicates probable system-language discovery; pivot to the responsible process and its parent lineage,
    the user and logon session, the host and its role, the exact registry keys/APIs/commands touched,
    and any preceding delivery (Office/script/downloaded binary) or following reconnaissance and network
    activity to determine whether this is benign administration or an attacker orienting before further
    action. A negative result helps rule out this particular discovery vector but should be corroborated
    with the other questions in this playbook, since a single method can miss API-only checks, obfuscated
    scripts, or low-and-slow reconnaissance.'
