name: 'T1614.001: System Language Discovery'
id: a04eb280-d3ce-4e6c-9cfa-f2b132331fda
description: 'This playbook helps an analyst investigate whether an adversary is performing system language
  discovery (MITRE ATT&CK T1614.001) -- querying the system language, locale, and keyboard layout to infer
  the geographic location of a compromised host and decide whether to continue, tailor follow-on behavior,
  or abort to evade specific law-enforcement or researcher scrutiny. Malware and ransomware operators
  (e.g., Ryuk) frequently use this language check as a guardrail. The hunt spans Windows, Linux, and macOS
  endpoints and pursues the behavior from several complementary angles: process creation with known discovery
  command lines (reg query Control\Nls\Language, wmic os get Locale, systeminfo | findstr ''System Locale'',
  dism /get-intl, Get-WinSystemLocale/Get-Culture); PowerShell script-block use of culture/locale cmdlets
  and .NET CultureInfo classes; registry read access to NLS/International/Keyboard-Layout keys via SACL
  (Event ID 4663) or Sysmon Event ID 13; suspicious process lineage where an Office/script/temp-path parent
  performs a language check shortly after creation; clustering of language discovery with other native-tool
  reconnaissance (whoami, ipconfig, net user, tasklist, systeminfo) in one session; and the *nix variant
  of locale/$LANG/$LC_ALL queries and macOS ''defaults read -g AppleLocale''/''systemsetup -gettimezone''.
  Detection methods combine deterministic symbolic-logic rules (curated command-line/registry/API watchlists,
  SACL auditing, Office-child and recon-bundle correlation), statistical baselining (fleet-wide prevalence/stack-counting
  of rare parents and images, volume/frequency/failure-mode physics, command-line and script entropy,
  per-role recon ratios), and machine learning (Random Forest/XGBoost command-line classifiers, Isolation
  Forest registry/command outlier scoring, ARIMA time-series burst detection, DBSCAN command clustering,
  provenance-graph rare-chain scoring, and HMM/LSTM sequence anomaly detection), applied across Windows
  Security and Sysmon events, PowerShell script-block logs, Sysmon-for-Linux/auditd, macOS unified log/osquery,
  and Zeek conn.log, so the analyst can corroborate suspected discovery against process lineage, registry/API
  access, command-line content, and surrounding reconnaissance and network activity.'
