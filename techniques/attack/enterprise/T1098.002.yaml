name: 'T1098.002: Additional Email Delegate Permissions'
id: 0184582c-f1b2-4db1-a527-160a3f36efd4
description: Investigate adversary abuse of mailbox delegation to maintain persistent access to, and escalate
  privileges via, email accounts. This playbook helps an analyst hunt for and triage suspicious mailbox
  permission changes (Add-MailboxPermission FullAccess, Add-RecipientPermission SendAs, Set-Mailbox GrantSendOnBehalfTo,
  and folder-permission grants to the Default/Anonymous principal on the Inbox or Top of Information Store)
  across on-premises Exchange and Microsoft 365 / Office Suite. It correlates those grants with anomalous
  delegate logins from new IPs/ASNs/User-Agents, post-delegation outbound mail bursts and lateral-phishing
  fan-out, self-grants onto privileged users' mailboxes, unauthorized or off-hours administrative changes,
  and full escalation chains that pivot from delegated mailbox access into lateral movement and exfiltration.
  It combines deterministic rules, statistical baselining (modified Z-scores, frequency/rarity, time-series
  forecasting, first-seen novelty), and machine learning (Isolation Forest, supervised classifiers, clustering,
  graph and sequence models) so analysts can detect both routine BEC-style abuse and sophisticated, stealthy
  persistence and privilege escalation.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any account add mailbox delegate rights (Add-MailboxPermission FullAccess, Add-RecipientPermission
    SendAs, or Set-Mailbox GrantSendOnBehalfTo) that should be treated as a persistence event, and was
    the actor or target on a watchlist of compromised/high-risk accounts?
  context: 'Persistence: Granting FullAccess, SendAs, or Send-on-Behalf rights on a mailbox is a primary
    way an adversary keeps durable access to a compromised inbox without re-authenticating as the victim.
    Alert on M365 Unified Audit Log Exchange events with event.outcome=success for Add-MailboxPermission
    (AccessRights=FullAccess), Add-RecipientPermission (AccessRights=SendAs), or Set-Mailbox (GrantSendOnBehalfTo
    set), and on PowerShell Script Block Logs (Event ID 4104) containing those cmdlets. Exclude NT AUTHORITY\SYSTEM
    and service identities (UserType 3-4) to control benign noise, mirroring the Elastic O365 mailbox-delegation
    rule. Raise severity when the actor''s or target''s UserPrincipalName appears on a pre-defined watchlist
    of compromised or high-risk accounts: that pivot turns a routine admin action into a likely persistence
    step worth immediate triage.'
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers, Identity and Access
    Management (IAM) systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nWORKLOAD=Exchange AND Operation IN (\"Add-MailboxPermission\",\"Add-RecipientPermission\"\
      ,\"Set-Mailbox\")\nAND result=success\nAND ((Operation=\"Add-MailboxPermission\" AND AccessRights=\"\
      FullAccess\")\n     OR (Operation=\"Add-RecipientPermission\" AND AccessRights=\"SendAs\")\n   \
      \  OR (Operation=\"Set-Mailbox\" AND GrantSendOnBehalfTo!=null))\nAND UserType NOT IN (3,4)\n| eval\
      \ severity=if(actor IN watchlist OR target IN watchlist,\"high\",\"medium\")"
  - technology: SIEM/Rule pseudocode
    query: '>-

      source="WinEventLog:Microsoft-Windows-PowerShell/Operational" EventCode=4104

      ScriptBlockText IN ("*Add-MailboxPermission*","*Add-RecipientPermission*","*Set-Mailbox*GrantSendOnBehalfTo*")

      | where actor NOT IN service_identities'
- question: Did anyone grant a non-None right to the Default or Anonymous principal on the Inbox or Top
    of Information Store of any mailbox, creating tenant-wide covert delegated access?
  context: 'Persistence: Assigning rights to the Default or Anonymous user on the Inbox or root (Top of
    Information Store) is the covert UNC2452 persistence variant: it lets ANY account in the tenant read
    the target''s mail without an explicit, per-user grant that would stand out. Alert on Add-MailboxFolderPermission/Set-MailboxFolderPermission
    (or the ''Mailbox Folder Permission Change'' UAL operation) that grants any right other than None
    to Default or Anonymous on those folders. Because these grants are easy to miss, also periodically
    enumerate current grants with Get-MailboxFolderPermission/Get-MailboxPermission and diff them against
    an allowlist of known delegation relationships (CISA Sparrow can automate the sweep). A positive result
    on a VIP or service mailbox is a strong indicator of staged persistence.'
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers, Identity and Access
    Management (IAM) systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      Operation IN ("Add-MailboxFolderPermission","Set-MailboxFolderPermission","UpdateFolderPermissions")

      AND Parameters.User IN ("Default","Anonymous")

      AND Parameters.AccessRights != "None"

      AND Parameters.FolderName IN ("\\Inbox","\\Top of Information Store","\\")

      | alert'
  - technology: SIEM/Stats pseudocode
    query: '>-

      # periodic posture diff

      current = GetMailboxFolderPermission(all_mailboxes)

      new_grants = current - allowlist_delegations

      | where principal IN ("Default","Anonymous") AND rights != "None"'
- question: Is any actor's daily count of mailbox permission changes far above its own and its peer group's
    90-day baseline, indicating scripted or bulk delegation activity?
  context: 'Persistence: A compromised admin or attacker-driven script often grants delegate rights in
    bursts that dwarf an actor''s normal cadence. For each actor, baseline the historical count of mailbox
    permission changes per day over 90 days and compute a robust modified Z-score (median/MAD). Flag any
    actor whose daily grant count exceeds the 95th percentile of its own and peer-group history, or whose
    modified Z-score is greater than 3.5. Also profile the failure/state dimension: count grants that
    error or are immediately reversed, and SendAs bounce-backs, as distinct signals of trial-and-error
    or abuse. The alert should list the top-3 contributing features (grant count, off-hours fraction,
    rare-target fraction) so the analyst can immediately judge whether the spike reflects an approved
    migration or covert persistence.'
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers, Identity and Access
    Management (IAM) systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      stats count as grants by actor, _day

      | eventstats median(grants) as med, mad(grants) as mad by actor

      | eval mz=0.6745*(grants-med)/mad

      | where grants>p95(grants) OR mz>3.5

      | table actor, grants, mz, offhours_frac, rare_target_frac'
- question: Is this the first time the actor has ever performed a delegation, or the first FullAccess/SendAs
    grant from this actor to this target mailbox in the recent lookback window?
  context: 'Persistence: First-seen behavior is a high-value novelty signal for delegated-access persistence.
    Treat an actor''s first-ever delegation, or the first FullAccess/SendAs grant to a given target mailbox
    within a 14-30 day lookback, as suspicious (new_terms style detection). Combine novelty with tenant-wide
    prevalence: rare actor/target/AccessRights tuples carry a higher prior of malice. A brand-new actor-target-rights
    combination on a sensitive mailbox, especially paired with off-hours timing or an unusual source,
    warrants triage because legitimate delegation tends to follow established, recurring relationships.'
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers, Identity and Access
    Management (IAM) systems'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n# new_terms over 14-30d\nseen = lookup(actor_target_rights, lookback=30d)\n| where (actor\
      \ NOT IN seen.actors)\n     OR (concat(actor,target,AccessRights) NOT IN seen.tuples AND AccessRights\
      \ IN (\"FullAccess\",\"SendAs\"))\n| eval prevalence=tenant_freq(actor,target,AccessRights)\n| where\
      \ prevalence < rare_threshold"
- question: Does an unsupervised Isolation Forest flag any individual permission-change event as anomalous
    against the benign delegation history, and which features drive the score?
  context: 'Persistence: Deterministic rules miss novel combinations, so layer an Isolation Forest over
    first-party features of each permission-change event: actor role, target role, AccessRights value,
    hour-of-day, source-IP/ASN rarity, actor grant-frequency, watchlist flag, and is-Default/Anonymous.
    Train on benign delegation history. Events that isolate quickly (short path length) are anomalous
    and should surface their top-3 contributing features in the alert so an analyst can reason about why.
    Run this in parallel with the deterministic delegation rules rather than as a replacement, so unusual-but-not-rule-matching
    persistence attempts still get caught.'
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers, Identity and Access
    Management (IAM) systems'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\nfeatures = [actor_role, target_role, AccessRights, hour, srcip_asn_rarity,\n         \
      \  actor_grant_freq, watchlist_flag, is_default_anon]\nmodel = IsolationForest(contamination=0.01).fit(benign_grants)\n\
      score = model.decision_function(event)\n| where score < anomaly_cutoff\n| table event, top3_feature_contributions"
- question: Did a mailbox permission change grant FullAccess or SendAs, or assign any right to an account
    younger than 30 days, a service account, or the Default/Anonymous principal?
  context: 'Persistence: Adversaries frequently route persistence through risky combinations: high-impact
    rights (FullAccess/SendAs), freshly created grantee accounts, non-interactive service accounts, or
    the catch-all Default/Anonymous principal. Parse PowerShell logs (Event ID 4104), process creation
    (Event ID 4688), and M365 audit logs for permission changes, and alert if AccessRights contains FullAccess
    or SendAs, OR the grantee''s AD creation timestamp is under 30 days old, OR the grantee is categorized
    as a service account, OR the right is granted to Default/Anonymous. Each of these conditions is independently
    suspicious because legitimate delegation usually targets established, interactive users with the least
    privilege necessary.'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers, Identity and Access
    Management (IAM) systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nOperation IN (\"Add-MailboxPermission\",\"Add-RecipientPermission\",\"Add-MailboxFolderPermission\"\
      )\n| eval grantee_age_days = now() - grantee_whenCreated\n| where AccessRights IN (\"FullAccess\"\
      ,\"SendAs\")\n     OR grantee_age_days < 30\n     OR grantee IN service_accounts\n     OR grantee\
      \ IN (\"Default\",\"Anonymous\")"
- question: Has an administrator's distribution of granted AccessRights collapsed toward a single value
    (e.g., repeated FullAccess) while their daily grant volume spiked, suggesting scripted delegation?
  context: 'Persistence: Human admins grant a mix of rights for varied reasons; automated abuse tends
    to repeat one right value at high volume. For each administrator, track the distribution of AccessRights
    granted over a rolling 30-day window. A sharp collapse to a single value (e.g., almost all FullAccess)
    indicates scripted activity. Alert when the share of one rights value exceeds 90% AND the daily grant
    count exceeds the actor''s median by a modified Z-score greater than 3.5. Report the count (volume)
    and the dominant rights value so the analyst can quickly confirm whether a script or compromised credential
    is mass-granting access for persistence.'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers, Identity and Access
    Management (IAM) systems'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      stats count as n, count(eval(AccessRights==dominant)) as dom by actor, _day

      | eval share = dom/n

      | eventstats median(n) as med, mad(n) as mad by actor

      | eval mz = 0.6745*(n-med)/mad

      | where share > 0.90 AND mz > 3.5

      | table actor, dominant_rights, n, share, mz'
- question: Does the organization-wide stream of permission-change events show a cluster of FullAccess/SendAs
    grants exceeding the seasonal time-series prediction interval, or a simultaneous spike in failed/blocked
    grants?
  context: 'Persistence: Tenant-wide delegation has predictable daily/weekly rhythm. Model the organization-wide
    stream of permission-change events with a seasonal time-series/STD baseline (e.g., ARIMA or a Sentinel
    time-series anomaly) that captures normal volume and rights mix, and alert when a cluster of FullAccess/SendAs
    grants exceeds the upper prediction-interval bound. Include the failure dimension: a concurrent spike
    in failed/blocked grant attempts is a distinct escalation signal that someone is probing or batch-applying
    delegations. This catches mass-persistence campaigns that no single-event rule would flag.'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers, Identity and Access
    Management (IAM) systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\ntimechart span=1h count(eval(AccessRights IN (\"FullAccess\",\"SendAs\"))) as grants,\n\
      \          count(eval(result=\"failure\")) as failed\n| predict grants as f_grants upper95=u lower95=l\n\
      | where grants > u OR failed > failed_baseline_u95"
- question: Does a supervised classifier trained on labeled legitimate-vs-illicit grants assign a high
    illicit probability to any permission change, and what per-event features explain it?
  context: 'Persistence: When labeled history exists, a supervised model sharpens detection of illicit
    delegation. Train a Random Forest on labeled legitimate-vs-illicit grants using features such as actor
    role, target role, AccessRights, target account age, is-service-account, source-IP rarity, and hour-of-day,
    then alert on high illicit probability and expose per-event feature importances in the alert. This
    complements the rules and statistical baselines by learning subtle multi-feature patterns of persistence
    delegation; analysts should review the surfaced features to validate each high-confidence hit before
    action.'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers, Identity and Access
    Management (IAM) systems'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      features = [actor_role,target_role,AccessRights,target_acct_age,is_svc,srcip_rarity,hour]

      model = RandomForest().fit(labeled_grants)  # legit vs illicit

      p = model.predict_proba(event)[illicit]

      | where p > 0.8

      | table event, p, top_feature_importances'
- question: Within 60 minutes of a mailbox permission change, did the newly delegated account log into
    the mailbox from a source IP/ASN or User-Agent never seen for the original owner in the prior 90 days?
  context: 'Persistence: A grant that is immediately exercised from new infrastructure is a classic compromised-access
    pattern. Correlate permission-change events (Event ID 4104, M365 UAL) with subsequent mailbox access
    (Event ID 4624, Azure AD/Entra sign-in logs) within a 60-minute window. Join against a 90-day baseline
    of source IP/ASN and User-Agent for the original owner, and alert if the new delegate''s IP/ASN or
    User-Agent is unseen. Separately count failed/blocked delegate sign-ins (Event ID 4625) as a credential-stuffing
    or escalation precursor. A grant-then-novel-login chain strongly suggests an attacker validating freshly
    established persistent access.'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4624
  - Windows Event ID 4625
  - m365:unified
  - Zeek conn.log
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, VPN Concentrators, Network Firewalls/Gateways,
    Endpoint devices'
  range: Last 90 days; correlate grant and login within a 60-minute window
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      grant = Operation IN ("Add-MailboxPermission","Add-RecipientPermission")

      login = SigninLogs OR EventCode=4624 by delegate

      | join delegate [where login.time - grant.time <= 60m]

      | lookup owner_baseline_90d srcip asn ua

      | where login.srcip_asn NOT IN baseline OR login.ua NOT IN baseline

      | append [search EventCode=4625 by delegate | stats count as failed_signins]'
- question: How rare is the new delegate's first mailbox access in terms of geo/ASN/device compared to
    the owner's profile and tenant prevalence?
  context: 'Persistence: Beyond binary new/old, score the rarity of the delegate''s first access. Maintain
    a per-user profile of access locations (countries, ASNs) and devices (User-Agents), then score the
    new delegate''s first access by the rarity of its location/device against the owner''s profile and
    tenant-wide prevalence. Flag when the combined rarity falls in the top 5th percentile, and surface
    the rarest 3 attributes (geo, ASN, UA) in the alert. This distinguishes a benign delegate logging
    in from a familiar corporate network from an attacker accessing newly granted persistence from anomalous
    infrastructure.'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4624
  - Windows Event ID 4625
  - m365:unified
  - Zeek conn.log
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, VPN Concentrators, Network Firewalls/Gateways,
    Endpoint devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      profile = owner_access_profile(geo,asn,ua, lookback=90d)

      rarity = 1 - prevalence(login.geo,login.asn,login.ua | profile, tenant)

      | where rarity >= p95

      | table delegate, owner, rarest3(geo,asn,ua), rarity'
- question: When the new delegate's access events are clustered against the mailbox's historical access
    patterns, does the access fall outside all normal clusters?
  context: 'Persistence: Cluster each mailbox''s historical access events using features such as IP geo,
    ASN, User-Agent, and hour-of-day into ''normal'' clusters. If the new delegate''s access does not
    belong to any existing cluster, flag it as anomalous and report the deviating features. Unsupervised
    clustering captures multimodal legitimate behavior (e.g., office plus home plus mobile) while still
    isolating attacker access that does not fit any established mode, which is the hallmark of newly abused
    delegated persistence.'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4624
  - Windows Event ID 4625
  - m365:unified
  - Zeek conn.log
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, VPN Concentrators, Network Firewalls/Gateways,
    Endpoint devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      clusters = DBSCAN/KMeans.fit(historical_access[geo,asn,ua,hour])

      label = clusters.predict(delegate_access)

      | where label == outlier OR min_distance_to_centroid > eps

      | table mailbox, delegate, deviating_features'
- question: After a delegation event, did the delegated mailbox send more than 100 internal emails within
    an hour to recipients who received nothing from the original owner in the prior 90 days?
  context: 'Persistence: Compromised, delegated mailboxes are commonly used for internal fan-out (lateral
    phishing) that abuses the trust of an established sender to evade spam/phishing controls. After a
    delegation event, monitor outbound mail (M365 Message Trace, Zeek smtp.log) from the delegated mailbox
    and alert if more than 100 internal emails are sent within 1 hour to recipients who received no mail
    from the original owner in the prior 90 days. This burst-to-new-recipients pattern is a strong signal
    that persistent delegated access is being weaponized for internal spearphishing.'
  answer_sources:
  - Zeek smtp.log
  - Zeek conn.log
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: Email Gateway, On-premises Exchange Servers, Microsoft 365 Tenancy, Network Egress Points'
  range: Last 90 days; evaluate the 1-hour window following each delegation event
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nafter grant_event(mailbox):\n stats count as sent, values(rcpt) as rcpts by mailbox, span=1h\n\
      \ | eval new_rcpts = rcpts NOT IN owner_recipients_90d\n | where sent > 100 AND mvcount(new_rcpts)\
      \ high"
  - technology: Zeek/pseudocode
    query: '>-

      smtp.log mailfrom=delegated_mailbox

      | where ts within 1h of delegation

      | count rcptto where rcptto not in owner_baseline_recipients > 100'
- question: After delegation, does the mailbox's outbound volume exceed its baseline by a modified Z-score
    >3.5, or does recipient-set Jaccard similarity drop below 0.2, or does the SendAs bounce rate spike?
  context: 'Persistence: Maintain a 30-day baseline of outbound volume and recipient-domain distribution
    per mailbox. After a delegation, alert if sending volume exceeds a modified Z-score greater than 3.5
    above baseline, OR the Jaccard similarity between the new and baseline recipient sets drops below
    0.2, OR the SendAs bounce/NDR rate spikes. The Jaccard collapse indicates the mailbox is suddenly
    emailing an entirely different population, while a bounce-rate spike signals bulk SendAs abuse hitting
    invalid addresses. Report volume, Jaccard, and bounce-rate together so the analyst can distinguish
    a legitimate campaign from delegated-access misuse.'
  answer_sources:
  - Zeek smtp.log
  - Zeek conn.log
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: Email Gateway, On-premises Exchange Servers, Microsoft 365 Tenancy, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      base = mailbox_outbound_baseline(30d)

      | eval mz = 0.6745*(vol-base.med)/base.mad

      | eval jacc = jaccard(new_rcpt_set, base.rcpt_set)

      | eval bounce = ndr_count/sent

      | where mz>3.5 OR jacc<0.2 OR bounce>bounce_baseline

      | table mailbox, vol, mz, jacc, bounce'
- question: Does the post-delegation outbound mail flow for a mailbox produce a forecast residual beyond
    the seasonal prediction interval, including spikes in blocked/rejected sends?
  context: 'Persistence: Forecast expected outbound volume/flow per mailbox using a seasonal model (e.g.,
    Prophet) and alert when the post-delegation residual error exceeds the upper prediction-interval bound.
    Cover both directions: an over-volume spike (spam fan-out) and the failure dimension (a surge in blocked/rejected
    sends, which indicates bulk SendAs abuse against bad recipients or content filtering). This time-series
    view catches gradual or off-peak abuse of delegated persistence that fixed thresholds would miss.'
  answer_sources:
  - Zeek smtp.log
  - Zeek conn.log
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: Email Gateway, On-premises Exchange Servers, Microsoft 365 Tenancy, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      model = Prophet().fit(mailbox_outbound_hourly)

      fc = model.predict(post_delegation_window)

      | eval resid = actual - fc.yhat

      | where actual > fc.yhat_upper OR rejected_sends > rejected_upper'
- question: Does a compromised-account misuse classifier flag any post-delegation send session as lateral
    phishing based on recipient-graph deviation, send-time anomaly, and content/link features?
  context: 'Persistence: Score post-delegation send sessions with a classifier built for detecting lateral
    phishing from compromised enterprise accounts at very low false-positive rates, using features like
    recipient-graph deviation, send-time anomaly, and content/link signals. Expose the top-3 contributing
    features in each alert. This catches the case where an attacker uses durable delegated access to send
    carefully crafted internal phishing that evades volume thresholds, by recognizing the behavioral fingerprint
    of compromised-account abuse rather than raw counts.'
  answer_sources:
  - Zeek smtp.log
  - Zeek conn.log
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: Email Gateway, On-premises Exchange Servers, Microsoft 365 Tenancy, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      features = [recipient_graph_deviation, send_time_anomaly, link_features, content_features]

      model = LateralPhishClassifier()  # tuned for low FPR

      p = model.score(send_session)

      | where p > threshold

      | table mailbox, session, p, top3_features'
- question: Did a mailbox permission change target a high-value mailbox (Domain/Enterprise Admins, C-Suite)
    where the actor is on a suspicious-accounts watchlist or is not in the authorized Exchange-admin group?
  context: 'Privilege Escalation: Granting delegate access to a privileged person''s mailbox is a direct
    route to escalation, since the attacker inherits the target''s correspondence, approvals, and reset
    flows. Fire a high-severity rule on any mailbox permission change where the target mailbox user belongs
    to a High-Value Target group (Domain Admins, Enterprise Admins, C-Suite) AND the actor is on a Suspicious
    Accounts watchlist or is not a member of the authorized Exchange-admin group. Enumerate current grants
    on VIP mailboxes (e.g., with CISA Sparrow) to confirm scope. A hit here is among the highest-priority
    escalation indicators in this playbook.'
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers, Identity and Access
    Management (IAM) systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nOperation IN (\"Add-MailboxPermission\",\"Add-RecipientPermission\",\"Add-MailboxFolderPermission\"\
      )\n| where target_user IN hvt_group(\"Domain Admins\",\"Enterprise Admins\",\"C-Suite\")\n  AND\
      \ (actor IN suspicious_watchlist OR actor NOT IN authorized_exchange_admins)\n| eval severity=\"\
      high\""
- question: Does a weighted risk score combining target-privilege, actor-watchlist, FullAccess-rarity,
    and actor-unauthorized terms place any grant event above the 99th percentile of historical scores?
  context: 'Privilege Escalation: Rather than separate rules, compute a composite RiskScore = w1*IsTargetPrivileged
    + w2*IsActorOnWatchlist + w3*PermissionRarity(FullAccess) + w4*IsActorUnauthorized for every permission-change
    event, where rarity terms derive from tenant-wide prevalence. Alert above the 99th percentile of historical
    scores and surface the dominant contributing terms in the alert. This blends multiple weak escalation
    signals into one prioritized score, helping analysts focus on the grants most likely to represent
    privilege escalation while keeping the reasoning explainable.'
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers, Identity and Access
    Management (IAM) systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\neval risk = w1*is_target_privileged + w2*is_actor_watchlist\n          + w3*rarity_fullaccess\
