    -> RDP-to-DC'' yields a low sequence probability and is flagged, with the low-probability transitions
    surfaced in the alert. Sequence modeling catches multi-step escalation that each individual event
    would not reveal, by recognizing that the ordering and transitions are improbable for legitimate behavior.'
