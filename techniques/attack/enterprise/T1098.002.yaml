- question: After a delegate accesses a high-value mailbox, does any 1-hour window of outbound bytes from
    their source IP exceed the 99th percentile / modified Z-score >3.5 of their 30-day baseline, indicating
    staging/exfiltration?
  context: 'Privilege Escalation: After a delegate accesses a high-value mailbox, baseline bytes_out from
    their source IP over 30 days (Zeek conn.log) and alert if any 1-hour window exceeds the 99th percentile
    or a modified Z-score greater than 3.5 of their typical hourly transfer, which indicates staging or
    exfiltration. Report the volume and the breadth of destinations. A volume spike following privileged-mailbox
    access suggests the attacker is collecting and moving data leveraging escalated access, and the destination
    breadth helps distinguish a single bulk download from scattered exfiltration.'
  answer_sources:
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek dce_rpc.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers, Critical Application
    Servers, Network Core, Network Egress Points'
  range: Last 90 days; evaluate 1-hour windows after each delegate access
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      base = bytes_out_baseline(delegate_ip, 30d, hourly)

      | timechart span=1h sum(bytes_out) as vol by delegate_ip

      | eval mz = 0.6745*(vol-base.med)/base.mad

      | where vol > base.p99 OR mz > 3.5

      | table delegate_ip, vol, mz, dest_breadth'
- question: Does a sequence model (HMM/Markov) assign low probability to the observed action chain grant-on-VIP
