- question: Did any actor grant a mailbox permission where the actor and grantee identities are the same
    but the target mailbox owner differs (a self-grant onto someone else's mailbox), especially a privileged
    owner?
  context: 'Privilege Escalation: An actor adding themselves as a delegate on another user''s mailbox
    is a textbook self-service escalation move. Parse PowerShell logs (Event ID 4104) and M365 audit logs
    and alert when actor identity == grantee identity but != target mailbox owner. Increase severity if
    the target owner is in a privileged group. Map the fields as actor/grantee/target = o365.audit.UserId
    / Parameters.User|Trustee / Parameters.Identity. Legitimate admins normally grant access TO other
    people, not to themselves on others'' boxes, so this pattern is rarely benign and deserves prompt
    review.'
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      Operation IN ("Add-MailboxPermission","Add-RecipientPermission")

      | eval actor=UserId, grantee=coalesce(Parameters.User,Parameters.Trustee), target=Parameters.Identity

      | where actor==grantee AND actor!=target

      | eval severity=if(target IN privileged_group,"high","medium")'
- question: Is any user's ratio of self-grants-on-others'-mailboxes to total grants spiking above their
    personal/peer baseline by a modified Z-score >3.5?
  context: 'Privilege Escalation: For each user, compute the ratio of self-grants-on-others'' mailboxes
    to total grants over 90 days. A user whose baseline ratio is near zero but who suddenly self-grants
    will spike this ratio; alert on a deviation exceeding a modified Z-score greater than 3.5 from the
    personal or peer baseline. Report the count and the target privilege level. This statistical lens
    catches escalation even when an individual self-grant might otherwise look like a one-off, by emphasizing
    the behavioral departure from the user''s norm.'
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: On-premises Exchange Servers, Microsoft 365 Tenancy, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      stats count(eval(actor==grantee AND actor!=target)) as self, count as total by actor, _day

      | eval ratio = self/total

      | eventstats median(ratio) as med, mad(ratio) as mad by actor

      | eval mz = 0.6745*(ratio-med)/mad

      | where mz > 3.5

      | table actor, self, ratio, mz, target_priv_level'
- question: Does a binary classifier separating legitimate from illicit self-grants assign high illicit
