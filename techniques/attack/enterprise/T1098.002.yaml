    confidence and surface the top features. This learns the subtle context that distinguishes a justified
    self-grant (e.g., an admin onboarding a shared mailbox) from an escalation attempt, giving analysts
    an explainable, prioritized signal to act on.'
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
