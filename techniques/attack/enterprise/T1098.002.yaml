- question: Did an authorized admin make a permission change in their lowest-10th-percentile activity
    hours or from a statistically rare source IP/ASN versus their own baseline?
  context: 'Privilege Escalation: Build a 24-hour activity histogram and a source-IP/ASN profile per authorized
    admin. Alert on changes occurring in the lowest 10th-percentile time window (e.g., 3 AM for a 9-to-5
    admin) or from statistically rare source IPs (modified Z-score), and report the rarest 3 attributes.
    Off-hours, anomalous-source delegation by an otherwise legitimate admin is a strong indicator their
    credentials have been hijacked to escalate via mailbox access, which a static allowlist alone would
    not catch.'
