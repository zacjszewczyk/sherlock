name: 'T1485: Data Destruction'
id: 13489ce1-b22c-424d-8baf-ec8f0809ab03
description: 'This playbook helps an analyst investigate whether an adversary is actively destroying or
  overwriting data and files on critical systems to disrupt availability, render data irrecoverable, or
  provide cover for a confidentiality breach, as part of the Impact tactic. It guides the hunt across
  multiple platforms (Windows, Linux, macOS, ESXi, IaaS/cloud, and containers) and several behavioral
  angles: execution of known wiper/ransomware binaries matched by cryptographic hash, fleet rarity, or
  PE/static features; abuse of legitimate destructive utilities (sdelete, cipher /w, format, rm -rf, shred,
  dd, srm) and recovery-sabotage tooling (vssadmin/wbadmin/wmic shadowcopy/bcdedit, wevtutil cl) detected
  by command-line patterns, rare argument baselining, and sequence models; statistically anomalous bursts
  of file deletion or modification on hosts and network shares; mass overwrites that leave files with
  abnormally low or uniform Shannon entropy (null/repeat fills) or near-maximal entropy (random/encrypted
  overwrite); deletion or modification of critical OS files, recovery partitions, and Volume Shadow Copies
  by non-system or rare parent-child processes; bulk Delete*/Terminate* of cloud, virtualization, and
  container infrastructure (S3 buckets, snapshots, AMIs, RDS instances, VMDK/datastore files, container
  volumes); and below-the-file-API destruction via Bring-Your-Own-Vulnerable-Driver (BYOVD) raw writes
  to physical disks/partitions. Detection methods combine symbolic-logic rules, statistical baselining
  (modified Z-score/MAD, percentile rarity, first-seen analysis), and machine-learning models applied
  to Windows Security/Sysmon events, auditd, macOS unified logs, Zeek file/entropy telemetry, AWS CloudTrail,
  ESXi vmkernel, and Docker events, so the analyst can corroborate suspected data destruction against
  process lineage, file-operation volume, content entropy, recovery tampering, and cloud/infrastructure
  deletion context.'
type: technique
