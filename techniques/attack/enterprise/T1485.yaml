questions:
- question: '[Impact] Hash IOC matching: Can you determine whether a process is executed where the executable
    file''s cryptographic hash (e.g., SHA256) matches a known data destruction tool or malware variant
    from a threat intelligence feed. -- specifically, using the ''Hash IOC matching'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary destroys or overwrites data
    and files -- on local hosts, network shares, cloud infrastructure, virtualization platforms, or below
    the file API -- to interrupt availability, render data irrecoverable, and disrupt operations, often
    as a final objective or to mask a prior intrusion. This evidence focuses on the condition that a process
    is executed where the executable file''s cryptographic hash (e.g., SHA256) matches a known data destruction
    tool or malware variant from a threat intelligence feed. This Symbolic Logic approach looks for the
    following signal: Hash each process-creation executable (Windows Event ID 4688 / Sysmon Event ID 1)
    and match SHA256 against threat intelligence for known wiper/ransomware binaries; alert on any match.
    Treat tamper-evident logging breaks (gaps in the hash-chain, silenced agents) as a corroborating signal
    per [Schneier & Kelsey, Secure Audit Logs](https://www.schneier.com/wp-content/uploads/2016/02/paper-secure-logs.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests files or infrastructure
    are being deliberately wiped, overwritten, or deleted in a way that deviates from sanctioned administration
    and normal user behavior; pivot to the responsible process or principal, its parent lineage or IAM
    context, the targeted files/objects, recovery-mechanism tampering, and any worm-like lateral spread.
    A negative result helps rule out this destruction vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, staged, or API-bypassing wipers.'
  answer_sources: &id001
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, File Servers, Database Servers, Critical Application Servers, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Hash IOC matching

      source IN [Windows Event ID 4688]

      | WHERE matches_action_criteria("Hash IOC matching")

      // Hash each process-creation executable (Windows Event ID 4688 / Sysmon Event ID 1) and match SHA256
      against threat intell

      | ALERT enrich(host, user, process, parent, file, target)'
