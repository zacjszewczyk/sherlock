questions:
- question: '[Persistence] Service/driver hash feed match: Can you determine whether a new Windows service
    (or kernel driver service) is created and its associated executable/`.sys` file hash or designated
    service name matches a known-malicious indicator from a threat-intelligence or vulnerable-driver feed.
    -- specifically, using the ''Service/driver hash feed match'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses the Windows service
    control manager and the HKLM\...\Services registry to install, modify, or hijack services so that
    malicious code (including kernel drivers) runs automatically, persistently, and under SYSTEM privileges.
    This evidence focuses on the condition that a new Windows service (or kernel driver service) is created
    and its associated executable/`.sys` file hash or designated service name matches a known-malicious
    indicator from a threat-intelligence or vulnerable-driver feed. This Symbolic Logic approach looks
    for the following signal: Extract service names, ImagePaths, and binary/`.sys` hashes (SHA256) from
    Event IDs 4697/7045 and Sysmon EID 6 driver loads and alert on matches against threat intel and the
    curated BYOVD feed in [LOLDrivers](https://www.loldrivers.io/), operationalized via the [Sigma Vulnerable
    Driver Load rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/driver_load/driver_load_win_vuln_drivers.yml)
    and the [Microsoft Recommended Driver Block Rules](https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/design/microsoft-recommended-driver-block-rules)
    (WDAC/HVCI deny-list). Keep these deterministic hash deny-lists as a hard floor; tune signer allowlists
    rather than deleting hashes. A positive result -- a deterministic rule match, a statistical outlier,
    or a model alert -- indicates a service create/modify event that deviates from sanctioned administration
    and software deployment; pivot to the responsible service name, its ImagePath and binary/.sys hash
    and signer, the creating/modifying process and user, the host''s change-management context, and any
    subsequent child process or network activity. A negative result helps rule out this service-abuse
    vector for the window examined but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, masqueraded, or living-off-the-land service abuse.'
  answer_sources: &id001
  - Windows Event ID 4697
  - Windows Event ID 7045
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - Windows Event ID 4657
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Service/driver hash feed match

      source IN [Windows Event ID 4697, Windows Event ID 7045, Windows Event ID 4688, Sysmon Event ID
      1, Sysmon Event ID 6, Sysmon Event ID 7, Sysmon Event ID 11, Windows Event ID 4657]

      | WHERE matches_action_criteria("Service/driver hash feed match")

      // Extract service names, ImagePaths, and binary/`.sys` hashes (SHA256) from Event IDs 4697/7045
      and Sysmon EID 6

      | ALERT enrich(host, user, service_name, image_path, hash, signer, parent, dest)'
- question: '[Persistence] Prevalence rarity scoring: Can you determine whether a new Windows service
    (or kernel driver service) is created and its associated executable/`.sys` file hash or designated
    service name matches a known-malicious indicator from a threat-intelligence or vulnerable-driver feed.
    -- specifically, using the ''Prevalence rarity scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses the Windows service
    control manager and the HKLM\...\Services registry to install, modify, or hijack services so that
    malicious code (including kernel drivers) runs automatically, persistently, and under SYSTEM privileges.
    This evidence focuses on the condition that a new Windows service (or kernel driver service) is created
    and its associated executable/`.sys` file hash or designated service name matches a known-malicious
    indicator from a threat-intelligence or vulnerable-driver feed. This Statistical Method approach looks
    for the following signal: Baseline fleet-wide prevalence of service names, ImagePaths, and binary
    hashes and flag those present on under 1% of hosts (Volume: new-service binary size/import count;
    tune the percentile per environment), following the frequency-inventory approach in [Using Frequency
    Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)
    and the prevalence principle in [What''s the Deal with Prevalence](https://blog.f-secure.com/whats-the-deal-with-prevalence/).
    A positive result -- a deterministic rule match, a statistical outlier, or a model alert -- indicates
    a service create/modify event that deviates from sanctioned administration and software deployment;
    pivot to the responsible service name, its ImagePath and binary/.sys hash and signer, the creating/modifying
    process and user, the host''s change-management context, and any subsequent child process or network
    activity. A negative result helps rule out this service-abuse vector for the window examined but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    masqueraded, or living-off-the-land service abuse.'
  answer_sources: *id001
  range: Last 90 days (baseline 30+ days; evaluate per-host/per-service windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Prevalence rarity scoring

      source IN [Windows Event ID 4697, Windows Event ID 7045, Windows Event ID 4688, Sysmon Event ID
      1, Sysmon Event ID 6, Sysmon Event ID 7, Sysmon Event ID 11, Windows Event ID 4657]

      | STATS baseline over 30d per (host, service, user, image_path)

      | COMPUTE deviation (prevalence / z-score / percentile / change-point)

      // Baseline fleet-wide prevalence of service names, ImagePaths, and binary hashes and flag those
      present on under

      | WHERE deviation > threshold | ALERT enrich(host, user, service_name, image_path, hash)'
