name: 'T1543.003: Windows Service'
id: ed085655-5806-4ee6-b2c6-7ea269f2306c
description: 'This playbook helps an analyst investigate whether an adversary is creating or modifying
  Windows services to maintain persistence (TA0003) or to escalate privileges (TA0004) on Windows endpoints
  and servers. Windows service configuration (the ImagePath, StartType, and service account) lives in
  the registry under HKLM\System\CurrentControlSet\Services and can be set or changed with sc.exe, PowerShell,
  direct registry edits, or the Windows API (CreateServiceW, ZwLoadDriver). The same mechanism is abused
  to install and register malicious or vulnerable kernel drivers (BYOVD), to run payloads under SYSTEM,
  and to hide services via SDDL. It guides the hunt across complementary angles: new service or driver
  creations whose binary/.sys hash or service name matches threat-intel or LOLDrivers/Microsoft driver
  block-list indicators; service ImagePaths that invoke LOLBAS/interpreters with download, encoding, or
  obfuscation arguments; service binaries planted in user-writable, temp, ProgramData, or UNC locations;
  auto-start services created outside change-management windows; modification or overwrite of high-privilege
  service ImagePaths to unsigned binaries; service reconfiguration by non-administrative users abusing
  weak service ACLs; high-privilege service processes (services.exe/svchost.exe) spawning anomalous children
  or beaconing to rare destinations; and Disabled/Manual-to-Auto-Start-then-run sequences followed by
  suspicious activity. Each evidence item is investigated with deterministic symbolic-logic rules (a hard
  floor), statistical baselining and change-point/rarity scoring, and machine-learning models (Random
  Forest/XGBoost, Isolation Forest, HMM, provenance GNNs) with top-3 feature attribution. Telemetry spans
  Windows Security events (4697, 7045, 7036, 4688, 4657, 4663), Sysmon (1, 3, 6, 7, 11, 13), PowerShell
  script-block logs (4104), and Zeek conn/dns logs so the analyst can corroborate suspected service abuse
  against service config, binary provenance, modifier identity, process lineage, and network context.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
