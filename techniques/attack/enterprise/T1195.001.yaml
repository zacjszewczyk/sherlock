name: 'T1195.001: Compromise Software Dependencies and Development Tools'
id: 6b8566fe-d716-4215-bebc-ceec1cb82898
description: Investigate adversary tampering with software dependencies and developer/CI build tools (a
  software supply-chain compromise) used to gain Initial Access. This playbook helps an analyst trace
  the canonical attack chain of package-manager or build-tool invocation (npm/yarn/pnpm, pip/pipenv, nuget/dotnet,
  chocolatey/winget, maven/gradle, cargo, go, Homebrew) writing or installing components, first-run execution
  of lifecycle hooks (preinstall/postinstall, setup.py, npm scripts) that spawn shells or downloaders,
  and subsequent network egress to non-approved registries, CDNs, or C2. It covers known-bad hash and
  threat-intel matching, build-provenance/SLSA allowlist floors, rarity and weak-link statistical scoring
  of newly published dependencies, malicious-API and obfuscation detection in install scripts, typosquatting
  and name-confusion detection, anomalous package-manager child processes, suspicious dependency-fetch
  network behavior (direct-to-IP, fresh domains, rare ASNs, dependency-confusion probing), and persistence
  or credential-store access launched during install/build. It supports both broad commodity compromises
  and targeted, sophisticated supply-chain intrusions across Windows, Linux, and macOS developer workstations,
  build servers, CI/CD runners, and internal artifact repositories.
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Does any package, library, or executable written by a package manager or build tool have a
    SHA256 hash that matches a malicious-dependency threat-intel feed, or lack valid signed build provenance?
  context: 'This is the deterministic floor for catching a known-bad supply-chain artifact during Initial
    Access. Extract the SHA256 of every file written by a package-manager/build-tool process (npm/pip/nuget/maven/gradle/cargo/go)
    from Zeek files.log and process-creation events, and (1) alert at high severity on any hash present
    in a curated malicious-dependency feed. (2) Layer a provenance floor: alert when a restored dependency
    or build artifact has no valid signed build provenance/signature, or when its builder/source/declared
    materials do not match an allowlist per SLSA Provenance. Because install-time payloads dominate real
    attacks, prioritize artifacts written immediately before lifecycle-hook execution. A positive result
    is strong evidence of a compromised dependency entering the build; a negative result still leaves
    rarity/behavioral checks to run.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Zeek files.log
  - 'NAI: Developer workstations, build servers, internal artifact repositories (e.g., Nexus, Artifactory),
    network egress points.'
  range: Last 90 days, prioritizing artifacts written immediately before lifecycle-hook execution.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'files = artifacts_written_by(package_manager_or_build_tool); FOR f IN files: ALERT high WHERE
      sha256(f) IN malicious_dependency_feed; ALERT WHERE provenance(f) MISSING OR provenance.builder/source/materials
      NOT IN slsa_allowlist; RANK by (write_time just_before lifecycle_hook_exec).'
- question: Are any newly written dependencies or build artifacts statistically rare across the environment
    (lowest prevalence percentile) while also carrying manifest/registry weak-link signals?
  context: 'Rare, newly published components are over-represented among malicious packages, so prevalence
    is a powerful triage signal. For each unique file hash written by a package manager or build tool,
    compute environment prevalence (distinct hosts) over 30 days and flag artifacts in the lowest percentile
    (e.g., <=1st pct). Combine with metadata weak-link signals derivable from manifests/registry data:
    newly added install scripts, sudden maintainer/email change, package age < 30 days, and very low download
    count. Flag dependencies exceeding 2+ weak-link signals. A hit means a freshly introduced, low-distribution
    dependency with suspicious provenance metadata warrants manual review before it propagates into more
    builds.'
  answer_sources: *id001
  range: Last 90 days, with 30-day prevalence baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each sha256 written_by package_manager: prevalence = distinct_hosts_30d(sha256); weak_links
      = count([install_script_added, maintainer_or_email_change, package_age<30d, download_count_very_low]);
      ALERT WHERE prevalence <= p1 OR weak_links >= 2.'
- question: Does an ensemble classifier flag a newly installed dependency as likely malicious based on
    install-script presence, sensitive-API use, obfuscation, encoding, and package-vs-source clone discrepancy?
  context: When no single signal is decisive, an ensemble classifier (decision tree / naive Bayes / SVM,
    per Amalfi) over lightweight features can triage newly installed dependencies at registry scale. Features
    include install-script presence, sensitive-API use (network/process/fs/crypto), obfuscation/minification,
    base64/hex encoding, and package-vs-source-repository clone discrepancy. Tune the decision threshold
    for very low false positives. Critically, every alert MUST surface the top-3 contributing features
    (e.g., 'postinstall script + outbound socket + base64 decode') via SHAP/LIME so the analyst can validate
    the verdict rather than trusting an opaque score.
  answer_sources: *id001
  range: Last 90 days for feature history, with scoring of each newly installed dependency.
  queries:
  - technology: ML pipeline pseudocode
    query: features = [install_script_present, sensitive_api_use(net/proc/fs/crypto), obfuscation/minification,
      base64_or_hex_encoding, package_vs_source_clone_discrepancy]; p = ensemble_model.predict_proba(features);
      ALERT when p >= tuned_low_fp_threshold; OUTPUT top_3_shap_features.
- question: Is a package-manager or build-tool process making a DNS query or connection to a domain/IP/ASN
    on a supply-chain threat-intel feed, or egressing to any host outside the approved registry/CDN allowlist?
  context: 'Dependency fetches should only reach approved registries; anything else is a strong supply-chain
    Initial Access signal. Ingest threat-intel for malicious domains/IPs/URLs used in supply-chain attacks
    and match Zeek dns.log (query), conn.log (id.resp_h), and http.log (host/uri) for connections from
    developer/build subnets, alerting at high severity on a match. Add a deterministic allowlist floor:
    alert when a package-manager/build process egresses to ANY host outside the approved registry/CDN
    allowlist (pypi.org, registry.npmjs.org, nuget.org, repo1.maven.org, etc.). This catches both known-bad
    infrastructure and the install-to-fresh-domain egress chain that characterizes dependency-chain abuse.'
  answer_sources: &id002
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Windows Event ID 4688
  - 'NAI: Developer workstations, build servers, domain controllers, and network egress points/gateways.'
  range: Last 90 days, correlating egress to within minutes of an install/build event.
  queries:
  - technology: Zeek/SIEM rule pseudocode
    query: conns = egress_from(developer_or_build_subnet, proc IN package_managers/build_tools); ALERT
      high WHERE dns.query OR conn.id_resp_h OR http.host/uri IN supply_chain_ti_feed; ALERT WHERE dest_host
      NOT IN approved_registry_cdn_allowlist.
- question: Do dependency-fetch connections go to first-seen/rare ASNs or freshly registered domains,
    move abnormally high bytes, or show failure-mode bursts (NXDOMAIN/404/blocked) indicating dependency-confusion
    or typosquat probing?
  context: Baseline destination ASNs/countries, domain age, and per-host Volume (bytes_out) and Frequency
    (conns/min) for dependency fetches. Flag (a) egress to first-seen/rare ASNs or freshly registered
    domains within 10 minutes of an install event, (b) bytes_out > 95th percentile of normal install traffic,
    and (c) failure-mode spikes — bursts of NXDOMAIN, blocked connections, or HTTP 404 from fresh hosts,
    which indicate dependency-confusion/typosquat probing. Retain the existing high-entropy domain heuristic
    (Shannon entropy > 3.5 bits/char, suspicious TLDs). A correlated install + anomalous egress within
    the same short window is a high-confidence supply-chain indicator.
  answer_sources: *id002
  range: Last 90 days, with a 10-minute install-to-egress correlation window and 30-day baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline dest_asn, dest_country, domain_age, bytes_out, conns_per_min for dependency_fetches;
      ALERT WHERE (asn first_seen OR domain_age<recent) within 10m of install_event OR bytes_out > p95
      OR burst(NXDOMAIN/404/blocked) from fresh_host OR domain_entropy>3.5.
- question: Does time-series anomaly detection flag a spike in outbound connections from build servers
    or developer subnets that is correlated with a recent package-install event?
  context: Model the time series of outbound connections (bytes_out, conn count/min) from build servers
    and developer subnets and detect anomalous spikes with Seasonal-Hybrid ESD (S-H-ESD), correlated to
    within 10 minutes of a package-install event from process logs. This catches data staging or beaconing
    that follows a poisoned install even when individual destinations are not on any feed. Alerts MUST
    list the top-3 anomaly drivers (e.g., destination novelty, byte-volume deviation, time-of-day) using
    SHAP-style attribution so analysts understand whether novelty, volume, or timing produced the flag.
  answer_sources: *id002
  range: Last 90 days for the baseline series, with current scoring correlated to install events within
    10 minutes.
  queries:
  - technology: ML pipeline pseudocode
    query: series = outbound(bytes_out, conn_count_per_min) per build_server/dev_subnet; anomalies = SHESD(series);
      ALERT when anomaly within 10m of package_install_event; OUTPUT top_3_drivers (dest_novelty, byte_volume_dev,
      time_of_day).
- question: Does a script executed by a package manager contain malicious-API keywords (eval/exec, base64
    decode, os.system/subprocess, child_process, Invoke-Expression, curl/wget), especially when triggered
    from an install lifecycle hook?
  context: 'Install scripts are the dominant payload-delivery mechanism in real malicious packages, so
    matching their documented malicious-API set is high value. From PowerShell script-block logs (Event
    ID 4104), process command lines (Event ID 4688), and install-hook bodies, match with YARA/regex: eval/exec,
    base64.b64decode/FromBase64String, os.system/subprocess, child_process, Invoke-Expression, and curl/wget
    invoked by a package-manager parent. Alert on a match, and escalate when the match originates from
    an install lifecycle hook (preinstall/postinstall/setup.py). A positive result indicates a dependency
    is executing downloader or recon logic at install time rather than performing legitimate build work.'
  answer_sources: &id003
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Developer workstations, build servers, CI/CD pipeline runners.'
  range: Last 90 days, prioritizing matches fired from install lifecycle hooks.
  queries:
  - technology: SIEM/Rule pseudocode
    query: scripts = scriptblocks(4104) + cmdlines(4688) + install_hook_bodies WHERE parent IN package_managers;
      ALERT WHERE matches(eval|exec|b64decode|FromBase64String|os.system|subprocess|child_process|Invoke-Expression|curl|wget);
      ESCALATE WHERE source IN [preinstall, postinstall, setup.py].
- question: Does an install script or PowerShell script block have Shannon entropy or command-line length
    far above its parent process's normal baseline, indicating obfuscation or an embedded payload?
  context: Obfuscated or packed payloads inflate entropy and length beyond what legitimate build commands
    produce. For each install script / script block (Event ID 4104), compute Shannon entropy and command-line
    length, baselined per parent process, and alert when entropy or length exceeds 3 standard deviations
    from that parent's mean. Treat the mere presence of an install script on a dependency as a weak-link
    signal that raises priority. A hit suggests an encoded or embedded payload smuggled inside a dependency's
    install logic; pair it with the malicious-API match for confirmation.
  answer_sources: *id003
  range: Last 90 days, with per-parent-process entropy and length baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each script/scriptblock(4104): e = shannon_entropy(body); L = len(cmdline); baseline per
      parent_process; ALERT WHERE e > mean+3sigma OR L > mean+3sigma; RAISE priority WHERE dependency
      has install_script.'
- question: Does a data-flow or sequence classifier flag a JavaScript install/postinstall script (or other-language
    install logic) as malicious despite obfuscation or minification?
  context: Obfuscation defeats simple keyword matching, so model the underlying data flow. For JavaScript
    install/postinstall scripts, classify with program-dependence-graph (PDG) data-flow features that
    survive obfuscation/minification (the decode→Blob→download chain) per JStap; for other languages use
    an NLP/sequence classifier over the command/argument stream. Flag scripts with probability > 0.85
    and emit the top-3 contributing tokens/flows in the alert text. This catches trojanized dependencies
    whose install scripts hide a download-and-execute behavior behind minified or encoded code.
  answer_sources: *id003
  range: Last 90 days for training, with scoring of each new install/postinstall script.
  queries:
  - technology: ML pipeline pseudocode
    query: 'IF lang==js: features = PDG_dataflow(decode->Blob->download); ELSE: features = nlp_seq(cmd/arg_stream);
      p = model.predict_proba(features); ALERT when p > 0.85; OUTPUT top_3_tokens_or_flows.'
- question: Does a process command line or download URI reference a package or executable name on the
    known-malicious-package watchlist, including re-registered or hijacked names lacking expected provenance?
  context: Adversaries publish malicious packages under specific names reported by security research (e.g.,
    'pygrata-requests'). Maintain an exact-match watchlist/blocklist of known malicious package and executable
    names and match it in process command lines (Event ID 4688) and download URIs (Zeek http.log), alerting
    on any match. Pair with the SLSA/provenance floor so re-registered or hijacked package names without
    expected provenance are rejected even if the exact name was previously legitimate. A hit means a named-bad
    dependency is being installed or fetched and should be contained immediately.
  answer_sources: &id004
  - Windows Event ID 4688
  - Zeek http.log
  - 'NAI: Developer workstations, build servers, internal artifact repositories, network egress points.'
  range: Last 90 days, refreshing the watchlist as new malicious names are reported.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ALERT WHERE package_name(cmdline_4688) IN malicious_name_watchlist OR download_uri(http.log)
      CONTAINS malicious_name; ALSO ALERT WHERE name was_reregistered/hijacked AND provenance NOT expected.
- question: Is a newly referenced package name a close typographical match (Damerau-Levenshtein distance
    1-2, or a homoglyph/transposition variant) to a popular approved dependency, indicating typosquatting?
  context: Typosquatting relies on names visually or typographically near a popular library. Maintain
    a dictionary of the organization's approved/most-used package names. For each new package name in
    command lines or download URIs, compute Damerau-Levenshtein distance to the dictionary and flag distance-1/2
    matches (e.g., 'python-dateutli' vs 'python-dateutil'), prioritizing candidates by the popularity
    of the legitimate target to bound false positives. Also enumerate omission/transposition/substitution/insertion/homoglyph
    variants of top dependencies as a deterministic typo-model. A near-miss to a heavily used package
    is a classic name-confusion attack and warrants blocking the install.
  answer_sources: *id004
  range: Last 90 days, evaluating each newly seen package name.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'approved = org_top_package_names; FOR new_name IN cmdlines/uris: d = damerau_levenshtein(new_name,
      approved); ALERT WHERE d IN [1,2] OR new_name IN typo_variants(approved); RANK by popularity(target).'
- question: Does dependency-graph community detection flag a new package that fits no existing community
    or bridges unrelated communities, combined with package-vs-source clone discrepancy?
  context: Trojanized look-alikes often do not fit the natural structure of an organization's dependency
    graph. Model the internal software dependency graph from manifests (package.json, requirements.txt,
    pom.xml) and apply community detection (e.g., Louvain) to flag a new package that fits no existing
    community or bridges unrelated communities. Combine with Amalfi-style package-vs-source clone discrepancy
    to catch trojanized look-alikes. Surface the top-3 reasons (edit-distance to a legit name, community-bridge
    score, clone mismatch) in the alert so analysts can judge whether the package is a planted impostor.
  answer_sources: *id004
  range: Last 90 days, rebuilding the dependency graph as manifests change.
  queries:
  - technology: Graph analytics pseudocode
    query: G = build_dependency_graph(package.json, requirements.txt, pom.xml); communities = louvain(G);
      ALERT WHERE new_package fits_no_community OR bridges_unrelated_communities OR clone_discrepancy(package,
      source); OUTPUT top_3 (edit_distance, bridge_score, clone_mismatch).
- question: Is a package manager or build tool spawning a high-risk child process outside the known-good
    build profile (e.g., MSBuild.exe→powershell.exe, npm.exe→cscript.exe, pip/setup.py→sh/curl)?
  context: The manager→install→spawn chain is the canonical supply-chain attack path. Alert on high-risk
    parent→child relationships from package managers/build tools outside a known-good build profile —
    for example MSBuild.exe→powershell.exe, npm.exe→cscript.exe, or pip/setup.py→sh/curl. In CI/CD, treat
    pipeline steps spawning shells or network tools as poisoned-pipeline-execution indicators. A positive
    result indicates that a dependency's install or build step is executing a shell or scripting host
    it has no legitimate reason to launch, a strong sign of code execution from a compromised dependency.
  answer_sources: &id005
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: Developer workstations, build servers, CI/CD pipeline runners.'
  range: Last 90 days, with emphasis on CI/CD runner and build-server process trees.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ALERT WHERE parent IN [MSBuild.exe, npm.exe, pip, setup.py, java, gradle, maven] AND child
      IN [powershell.exe, cscript.exe, sh, bash, curl, wget, cmd.exe] AND (parent,child) NOT IN known_good_build_profile.
- question: Does a development parent process (node.exe, python.exe, java.exe) spawn a rare or never-before-seen
    child, or a command line with entropy above the 99th percentile for that parent?
  context: Rarity baselining catches novel child processes that no build profile anticipated. For each
    development parent process (node.exe, python.exe, java.exe), build a 30-day child-process frequency
    distribution and alert on rare/never-before-seen children (e.g., seen < 5 times globally). Add Frequency
    (child spawns/min during a build) and command-line entropy, flagging command lines above the 99th
    percentile for that parent. A first-time or extremely rare child spawned during a build is a behavioral
    anomaly consistent with a poisoned dependency executing attacker logic.
  answer_sources: *id005
  range: Last 90 days, with 30-day per-parent child-process frequency baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR parent IN [node.exe, python.exe, java.exe]: dist = child_freq_30d(parent); ALERT WHERE
      child global_count < 5 OR child_spawns_per_min > p99 OR cmdline_entropy > p99(parent).'
- question: Does a sequence model flag an abnormal build-session process chain (parent→child→grandchild),
    such as postinstall→powershell→outbound?
  context: Legitimate builds follow learnable process sequences. Learn normal build-session process sequences
    (parent→child→grandchild) and detect abnormal sequences with a sequence model (e.g., LSTM autoencoder)
    or via MalOSS-style dynamic install-trace behavioral classification. The classic malicious chain is
    install→shell→network egress. Output the top-3 deviating steps (e.g., 'postinstall→powershell→outbound')
    in the alert per explainable-IDS practice so the analyst can confirm the deviation reflects code execution
    from a compromised dependency rather than a new but benign build step.
  answer_sources: *id005
  range: Last 90 days for training, with scoring of current build-session sequences.
  queries:
  - technology: ML pipeline pseudocode
    query: seq = build_session_process_chain(parent->child->grandchild); err = lstm_autoencoder.score(seq);
      ALERT when err > p99 OR maloss_install_trace_classifier=malicious; OUTPUT top_3_deviating_steps.
- question: Does a package-manager process connect directly to an IP with no preceding DNS lookup, use
    an IP-literal HTTP Host or TLS SNI, or reach a destination outside the approved registry allowlist?
  context: Resolution-bypass patterns accompany malicious dependency fetches. Alert when a package-manager
    process connects directly to an IP with no preceding DNS query (Zeek conn.log id.resp_h with no dns.log
    lookup), when the HTTP Host (http.log) or TLS SNI (ssl.log) is an IP literal, or when the destination
    is outside the approved-registry allowlist. Legitimate dependency downloads resolve and reach known
    registry hostnames; direct-to-IP fetches or IP-literal SNI from a build tool strongly suggest a dependency
    being pulled from attacker-controlled infrastructure.
  answer_sources: &id006
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network egress points, DNS resolvers, developer and build server subnets.'
  range: Last 90 days, focused on package-manager-originated flows.
  queries:
  - technology: Zeek/pseudocode
    query: ALERT WHERE proc IN package_managers AND ((conn.id_resp_h has_no preceding dns.log lookup)
      OR http.host IS ip_literal OR ssl.sni IS ip_literal OR dest_host NOT IN approved_registry_allowlist).
- question: Are dependency downloads coming from bottom-percentile domains/ASNs or rare User-Agents, or
    showing failure-mode spikes (404/NXDOMAIN/blocked) indicative of dependency-confusion enumeration?
  context: 'Baseline legitimate repository domains, ASNs, and User-Agent strings and their frequencies.
    Flag downloads from domains/ASNs in the bottom percentile (<1st pct) or User-Agents with prevalence
    <0.5%. Explicitly profile failure modes: spikes in HTTP 404, NXDOMAIN, or blocked connections from
    a dependency-fetch process signal dependency-confusion/typosquat enumeration; prioritize candidate
    squats by target popularity. A burst of failed fetches followed by a successful pull from a rare host
    is a hallmark of an actor probing for an unclaimed internal package name.'
  answer_sources: *id006
  range: Last 90 days, with baselines over the same window and short failure-burst windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline repo_domains, asns, user_agents freq; ALERT WHERE download from domain/asn < p1 OR
      user_agent prevalence < 0.5% OR burst(404/NXDOMAIN/blocked) from dependency_fetch_proc; RANK squats
      by target_popularity.
- question: Does DBSCAN clustering of connection metadata isolate a dependency download into a small anomalous
    micro-cluster away from normal registry clusters?
  context: Normal downloads from pypi.org or npmjs.com form dense clusters; malicious fetches sit outside
    them. Cluster conn.log metadata (dest port, bytes sent, duration, dest country/ASN) with DBSCAN, learn
    the normal download clusters, and flag noise points or small anomalous micro-clusters. Report the
    top-3 features pushing a connection out of normal clusters (ASN novelty, byte volume, port) in the
    alert. A dependency fetch landing in noise or a tiny isolated cluster is structurally unlike routine
    registry traffic and merits review for an attacker-hosted source.
  answer_sources: *id006
  range: Last 90 days, using historical dependency-fetch traffic to learn clusters.
  queries:
  - technology: ML pipeline pseudocode
    query: X = conn_metadata[dest_port, bytes_sent, duration, dest_country, dest_asn]; labels = dbscan(X);
      ALERT on noise_points OR small_anomalous_microclusters; OUTPUT top_3_features (asn_novelty, byte_volume,
      port).
- question: Does a process spawned during a package install or build create a scheduled task, install
    a new service, or modify a Run key to establish persistence?
  context: setup.py/postinstall persistence is a documented malicious behavior. Alert (high fidelity)
    when a process spawned during a package install/build (traced via parent PID from Event ID 4688) creates
    a scheduled task (Event ID 4698), installs a new service (Event ID 7045), or modifies a Run key (Event
    ID 4657 on HKLM\...\Run). Legitimate dependency installs do not establish OS persistence; any such
    action from within a build is a strong indicator that a compromised dependency is attempting to survive
    reboots and maintain access beyond Initial Access.
  answer_sources: &id007
  - Windows Event ID 4688
  - Windows Event ID 4698
  - Windows Event ID 4657
  - Windows Event ID 5156
  - Windows Event ID 4104
  - 'NAI: Domain controllers (for GPO changes), developer workstations, build servers, file servers hosting
    sensitive data.'
  range: Last 90 days, tracing persistence events to install/build parent processes.
  queries:
  - technology: SIEM/Rule pseudocode
    query: install_procs = procs WHERE ancestor IN package_install/build (via 4688 parent_pid); ALERT
      high WHERE install_proc creates scheduled_task(4698) OR new_service(7045) OR modifies Run_key(4657
      on HKLM\...\Run).
- question: Is an install or build process accessing credential/secret paths (~/.ssh, ~/.aws, browser
    credential stores) or env vars for the first time, or at access counts above the 99th percentile?
  context: 'Reading ~/.ssh and environment variables is a top malicious indicator for compromised dependencies.
    Enable file-access auditing (Event ID 4663) on credential/secret paths (~/.ssh, ~/.aws, %APPDATA%\...\Chrome\User
    Data) and environment-variable reads. Baseline normal access counts/paths per dev tool and alert on
    state changes: first-ever access to a sensitive directory, or access counts above the 99th percentile,
    by an install/build process. A build tool suddenly reading SSH keys or browser credential stores is
    highly likely to be credential theft staged through a poisoned dependency.'
  answer_sources: *id007
  range: Last 90 days, with per-dev-tool access baselines and first-access detection.
  queries:
  - technology: SIEM/Stats pseudocode
    query: audit 4663 on [~/.ssh, ~/.aws, %APPDATA%\...\Chrome\User Data] + env_var_reads; baseline access
      per dev_tool; ALERT WHERE install/build_proc has first_ever_access OR access_count > p99.
- question: Does a temporal event-graph model flag a suspicious causal subgraph linking package install
    → process creation → registry/file modification → network egress?
  context: Supply-chain compromise unfolds as a causal chain that a graph model can learn. Build a temporal
    event graph (package install → process creation → registry/file modification → network connection
    from Event ID 5156 + Zeek conn.log) and train a graph model on normal build/install behavior, flagging
    suspicious causal subgraphs such as install→obfuscated PowerShell (Event ID 4104)→egress to a fresh
    IP. Emit the top-3 edges/nodes driving the score in the alert. A high-scoring subgraph ties together
    otherwise separate events into a coherent compromise narrative for the analyst.
  answer_sources: *id007
  range: Last 90 days for training the graph baseline, with scoring of current install/build event graphs.
  queries:
  - technology: ML pipeline pseudocode
    query: G = temporal_event_graph(install -> process_create -> reg/file_mod -> net_conn(5156+conn.log));
      model = graph_anomaly.train(normal_builds); ALERT on suspicious_causal_subgraph (e.g., install->obf_powershell(4104)->egress_fresh_ip);
      OUTPUT top_3_edges_nodes.
