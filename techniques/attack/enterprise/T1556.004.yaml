name: 'T1556.004: Modify Authentication Process: Network Device Authentication'
id: ac698dd6-c1a6-4d3d-875d-5e4118311a06
description: 'This playbook helps an analyst investigate adversary modification of network-device authentication
  (T1556.004) - hardcoded ''magic'' passwords, patched/implanted system images (e.g., SYNful Knock), and
  tampered AAA paths that bypass native authentication on routers, switches, firewalls, and VPN concentrators.
  It guides hunting across the full kill-chain of this technique: anomalous firmware/config file transfers
  (bad or non-golden hashes, high entropy, off-window volume), device-originated connections to rogue
  RADIUS/TACACS+ servers, out-of-window or non-bastion management sessions, logins from rare geographies/ASNs/subnets
  or via legacy cleartext protocols, connections from CTI-flagged IPs reaching management ports, suspicious
  or non-allowlisted SSH client (HASSH) fingerprints, auth-bypass exploit signatures (e.g., Cisco IOS
  XE CVE-2023-20198), forbidden/default or never-before-seen usernames, long interactive sessions with
  no logged successful authentication, first-try successes from new sources with zero preceding failures,
  and device-originated post-login egress/beaconing. Each question pairs symbolic-logic, statistical,
  and machine-learning detection approaches with concrete pseudocode so a SOC analyst can answer whether
  an adversary is using modified network-device authentication for persistence, credential access, and
  defense impairment.'
type: technique
