    is characterized by one or more anomalous features, such as a source IP from a rare geolocation, a
    login time far outside the user''s normal baseline, or use of a legacy protocol (e.g., Telnet) when
    policy requires SSH. Method (Statistical Method): Per admin account, baseline source subnets/ASNs;
    for each successful login compute the historical frequency of the source ASN and alert on bottom-1st-percentile
    rarity (Frequency metric) [RITA](https://github.com/activecm/rita). Track per-source failed-vs-success
    counts as a distinct failure-mode feature.'
  answer_sources:
