- question: Does any successful device login originate from a geolocated country not on the administrators'
    approved list, or use a legacy cleartext protocol (Telnet) where policy mandates SSH?
  context: 'Under Defense Impairment, this matters because a patched/backdoored network-device image or
    a tampered authentication path lets the adversary undermine the trustworthiness of the device''s own
    security controls and logging, so detecting the change is essential to restore confidence in what
    defenders can see. Evidence: A pattern of successful logins to a network device administrative interface
    is characterized by one or more anomalous features, such as a source IP from a rare geolocation, a
    login time far outside the user''s normal baseline, or use of a legacy protocol (e.g., Telnet) when
    policy requires SSH. Method (Symbolic Logic): Enrich source IPs of every successful device login (`Zeek
    ssh.log`/`Zeek telnet.log`) with geolocation and alert when the country is not on the administrators''
    approved list; additionally alert when a legacy cleartext protocol (Telnet) is used where policy mandates
    SSH. APT router operators routinely log in from anomalous infrastructure [Salt Typhoon, CISA AA25-239A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-239a).'
  answer_sources:
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek conn.log
  - 'NAI: VPN concentrators, network management jump boxes, perimeter firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  FOR l IN (Zeek.ssh.log UNION Zeek.telnet.log) WHERE auth_success AND dst_ip IN NETWORK_DEVICES:\n\
      \    country = geoip(l.src_ip)\n    IF country NOT IN APPROVED_COUNTRIES: ALERT(\"login from unapproved\
      \ country\")\n    IF l.proto == telnet AND policy_requires_ssh: ALERT(\"cleartext protocol used\"\
      )"
- question: For each admin account, is any successful login sourced from an ASN in the bottom 1st percentile
