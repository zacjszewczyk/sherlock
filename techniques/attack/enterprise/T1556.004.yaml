    outliers in real time and report the top-3 features driving the score so analysts can confirm out-of-window/novel-source
    access [Robust IoT IF/OCSVM + LIME, Sci. Reports 2025](https://www.nature.com/articles/s41598-025-20445-4),
    [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
