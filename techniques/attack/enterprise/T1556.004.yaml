questions:
- question: Has any file transferred to a network device (via TFTP, SCP, or FTP) a SHA1/SHA256 that matches
    a known-malicious firmware deny-list, or fails to match the vendor 'golden' image allow-list for that
    device model?
  context: 'Under Defense Impairment, this matters because a patched/backdoored network-device image or
    a tampered authentication path lets the adversary undermine the trustworthiness of the device''s own
    security controls and logging, so detecting the change is essential to restore confidence in what
    defenders can see. Evidence: A file transfer event (e.g., TFTP, SCP, FTP) to a network device where
    the transferred file''s hash matches a known malicious signature, the file''s characteristics are
    anomalous, or the transfer originates from an IP address not on the authorized administrator or vendor
    whitelist. Method (Symbolic Logic): In the SIEM, compare the `sha1`/`sha256` from `Zeek files.log`
    for transfers to network-device IPs against (a) a deny-list of known malicious firmware hashes and
    (b) a per-model ALLOW-list of vendor ''golden'' image hashes; alert on any deny-list match AND on
    any transfer whose hash is not on the model''s allow-list. Implant images often match the legitimate
    image size, so size alone is insufficient and integrity verification against authoritative measurements
    is required [SYNful Knock, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/),
    [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf), [Costin
    et al., USENIX 2014](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek ftp.log
  - 'NAI: Network management subnet, data center core switches, internet-facing routers and firewalls,
    configuration management servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  files = Zeek.files.log WHERE dst_ip IN NETWORK_DEVICES\n  FOR f IN files:\n    IF f.sha256\
      \ IN MALICIOUS_FW_HASHES OR f.sha1 IN MALICIOUS_FW_HASHES:\n      ALERT(high, \"known-bad firmware\
      \ hash to device\")\n    ELIF f.sha256 NOT IN GOLDEN_IMAGE_HASHES[model(f.dst_ip)]:\n      ALERT(high,\
      \ \"image hash not on per-model golden allow-list\")"
- question: Does any firmware/config file transferred to a network device exhibit Shannon entropy above
    the 95th percentile of legitimate images for that model, or a byte-count outside the model's known
    image-size band, suggesting packing or an implanted blob?
  context: 'Under Defense Impairment, this matters because a patched/backdoored network-device image or
    a tampered authentication path lets the adversary undermine the trustworthiness of the device''s own
    security controls and logging, so detecting the change is essential to restore confidence in what
    defenders can see. Evidence: A file transfer event (e.g., TFTP, SCP, FTP) to a network device where
    the transferred file''s hash matches a known malicious signature, the file''s characteristics are
    anomalous, or the transfer originates from an IP address not on the authorized administrator or vendor
    whitelist. Method (Statistical Method): For each transfer to a network device in `Zeek files.log`,
    compute Shannon entropy of the payload (Volume metric). Baseline entropy of legitimate firmware/config
    files per model; alert when entropy exceeds the 95th percentile, indicating packing/encryption typical
    of an implanted blob [Costin et al., USENIX 2014](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf).
    Also profile transfer byte-count vs the model''s known image-size band and flag deviations.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek ftp.log
  - 'NAI: Network management subnet, data center core switches, internet-facing routers and firewalls,
    configuration management servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base95 = percentile(entropy(golden_firmware[model]), 95)\n  FOR f IN Zeek.files.log\
      \ WHERE dst_ip IN NETWORK_DEVICES:\n    e = shannon_entropy(f.bytes)\n    IF e > base95[model(f.dst_ip)]\
      \ OR f.total_bytes NOT IN IMAGE_SIZE_BAND[model]:\n      ALERT(\"high-entropy/abnormal-size firmware\
      \ transfer\")"
- question: When file-transfer counts/volumes to a device type are modeled over time, do hourly spikes
    appear that are not aligned to a documented maintenance window, with novel source IPs or high entropy
    among the top contributing features?
  context: 'Under Defense Impairment, this matters because a patched/backdoored network-device image or
    a tampered authentication path lets the adversary undermine the trustworthiness of the device''s own
    security controls and logging, so detecting the change is essential to restore confidence in what
    defenders can see. Evidence: A file transfer event (e.g., TFTP, SCP, FTP) to a network device where
    the transferred file''s hash matches a known malicious signature, the file''s characteristics are
    anomalous, or the transfer originates from an IP address not on the authorized administrator or vendor
    whitelist. Method (Machine Learning): Apply time-series anomaly detection (Seasonal-ARIMA or an Isolation
    Forest over [count, total_bytes, src_rarity, hour]) to hourly file-transfer counts per device type
    [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363). Flag spikes not aligned to
    documented maintenance windows; surface the top-3 contributing features (e.g., off-window timing,
    novel source IP, entropy) in the alert for triage [Robust IoT IF/OCSVM + LIME, Sci. Reports 2025](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek ftp.log
  - 'NAI: Network management subnet, data center core switches, internet-facing routers and firewalls,
    configuration management servers'
  range: Last 90 days (use >=30 days to train the baseline)
  queries:
  - technology: Python/pseudocode
    query: ">-\n  X = hourly_per_device_type(features=[count, total_bytes, src_rarity, hour])\n  model\
      \ = IsolationForest().fit(X_history)   # or Seasonal-ARIMA on counts\n  IF model.predict(X_now)\
      \ == -1 AND X_now.hour NOT IN MAINTENANCE_WINDOWS:\n    ALERT(rationale=top3_features_LIME(X_now))"
- question: Is any network device initiating an outbound AAA connection (TCP/49 TACACS+, UDP/1812 or UDP/1813
    RADIUS) to a destination that is NOT on the approved central authentication-server watchlist?
  context: 'Under Defense Impairment, this matters because a patched/backdoored network-device image or
    a tampered authentication path lets the adversary undermine the trustworthiness of the device''s own
    security controls and logging, so detecting the change is essential to restore confidence in what
    defenders can see. Evidence: A network device initiates an outbound connection on an authentication
    protocol port (e.g., TCP/49 for TACACS+, UDP/1812 for RADIUS) to an IP address that is not on the
    pre-approved list of central authentication servers. Method (Symbolic Logic): Maintain a watchlist
    of approved RADIUS/TACACS+ server IPs. Alert on any connection from a network-device asset on TCP/49,
    UDP/1812, or UDP/1813 to a destination not on the watchlist (`Zeek conn.log`). AAA-server redirection/tampering
    is a documented router-persistence behavior [Salt Typhoon, CISA AA25-239A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-239a),
    [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek radius.log
  - Windows Event ID 5156
  - 'NAI: Authentication servers (RADIUS, TACACS+), network device management interfaces, domain controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  FOR c IN Zeek.conn.log WHERE src_ip IN NETWORK_DEVICES\n      AND (c.proto_port IN {TCP/49,\
      \ UDP/1812, UDP/1813}):\n    IF c.dst_ip NOT IN APPROVED_AAA_SERVERS:\n      ALERT(high, \"device\
      \ -> rogue/redirected AAA server\")"
- question: Over a 30-day profile of each device's authentication-server destinations, is any device contacting
    an AAA destination in the bottom 5th percentile of frequency, or showing a spike in RADIUS Access-Reject
    / unanswered (S0) flows indicating a rogue or failing server?
  context: 'Under Defense Impairment, this matters because a patched/backdoored network-device image or
    a tampered authentication path lets the adversary undermine the trustworthiness of the device''s own
    security controls and logging, so detecting the change is essential to restore confidence in what
    defenders can see. Evidence: A network device initiates an outbound connection on an authentication
    protocol port (e.g., TCP/49 for TACACS+, UDP/1812 for RADIUS) to an IP address that is not on the
    pre-approved list of central authentication servers. Method (Statistical Method): Daily, profile each
    device''s authentication-server destinations over 30 days; alert on connections to a destination IP
    in the bottom 5th percentile of frequency (Frequency metric). Pair with a failure-mode signal: spikes
    in RADIUS Access-Reject / unanswered (S0) auth flows in `Zeek conn.log` indicate a rogue or failing
    server [RITA](https://github.com/activecm/rita).'
  answer_sources:
  - Zeek conn.log
  - Zeek radius.log
  - Windows Event ID 5156
  - 'NAI: Authentication servers (RADIUS, TACACS+), network device management interfaces, domain controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  freq = count(device, dst_ip) over 30d on AAA ports\n  IF percentile_rank(freq[device,\
      \ dst]) < 5: ALERT(\"rare AAA destination\")\n  IF spike(conn_state==S0) OR spike(RADIUS Access-Reject):\
      \ ALERT(\"rogue/failing AAA\")"
- question: When device-originated authentication traffic is clustered on (dst IP, port, proto, total_bytes,
    hour), do any connections fall into DBSCAN noise points or new small clusters that diverge from established
    AAA behavior?
  context: 'Under Defense Impairment, this matters because a patched/backdoored network-device image or
    a tampered authentication path lets the adversary undermine the trustworthiness of the device''s own
    security controls and logging, so detecting the change is essential to restore confidence in what
    defenders can see. Evidence: A network device initiates an outbound connection on an authentication
    protocol port (e.g., TCP/49 for TACACS+, UDP/1812 for RADIUS) to an IP address that is not on the
    pre-approved list of central authentication servers. Method (Machine Learning): Cluster connection
    metadata (dst IP, port, proto, total bytes, hour) for device-originated auth traffic with DBSCAN;
    classify noise points / new small clusters as anomalous. Emit the top-3 distinguishing features per
    alert via LIME-style attribution [Robust IoT IF/OCSVM + LIME, Sci. Reports 2025](https://www.nature.com/articles/s41598-025-20445-4),
    [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Zeek conn.log
  - Zeek radius.log
  - Windows Event ID 5156
  - 'NAI: Authentication servers (RADIUS, TACACS+), network device management interfaces, domain controllers'
  range: Last 90 days
  queries:
  - technology: Python/pseudocode
    query: ">-\n  X = device_auth_flows[dst_ip, port, proto, total_bytes, hour]\n  labels = DBSCAN(eps,\
      \ min_samples).fit_predict(X)\n  FLAG rows WHERE label == -1 OR cluster_size(label) < k\n  EMIT\
      \ top3 distinguishing features (LIME)"
- question: Did any TFTP/FTP/SCP/HTTPS configuration or firmware session to a network device occur outside
    the defined maintenance window or originate from a source IP that is not an authorized administrator
    workstation/bastion?
  context: 'Under Defense Impairment, this matters because a patched/backdoored network-device image or
    a tampered authentication path lets the adversary undermine the trustworthiness of the device''s own
    security controls and logging, so detecting the change is essential to restore confidence in what
    defenders can see. Evidence: A configuration or firmware management session (e.g., via TFTP, SCP,
    HTTPS) occurs at a time outside of a defined maintenance window or is initiated by a source IP not
    associated with an authorized administrator workstation or jump box. Method (Symbolic Logic): Define
    maintenance windows and an allow-list of authorized administrator source IPs/bastions. Alert on any
    TFTP/FTP/SCP/HTTPS config or firmware session to a network device outside the window or from a non-allow-listed
    source. Restricting firmware/config actions to approved accounts and windows is a prescribed control
    [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf), [Salt
    Typhoon, CISA AA25-239A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-239a).'
  answer_sources:
  - Zeek conn.log
  - Zeek ftp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - 'NAI: Network management jump boxes, network device management interfaces, configuration management
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  sessions = (Zeek.ftp.log UNION Zeek.ssh.log UNION Zeek.conn.log[tftp,scp,https])\n \
      \           WHERE dst_ip IN NETWORK_DEVICES\n  FOR s IN sessions:\n    IF s.ts NOT IN MAINTENANCE_WINDOWS\
      \ OR s.src_ip NOT IN ADMIN_BASTIONS:\n      ALERT(\"out-of-window or non-allowlisted config/firmware\
      \ session\")"
- question: For each administrator account, does any new device-management session land at a time-of-day/day-of-week
    with a z-score greater than 3 against that account's baseline, or does FFT reveal unexpected periodicity
    in management cadence?
  context: 'Under Defense Impairment, this matters because a patched/backdoored network-device image or
    a tampered authentication path lets the adversary undermine the trustworthiness of the device''s own
    security controls and logging, so detecting the change is essential to restore confidence in what
    defenders can see. Evidence: A configuration or firmware management session (e.g., via TFTP, SCP,
    HTTPS) occurs at a time outside of a defined maintenance window or is initiated by a source IP not
    associated with an authorized administrator workstation or jump box. Method (Statistical Method):
    Per administrator account, model login time-of-day/day-of-week for device access; compute a z-score
    for each new session timestamp and alert when z>3 (Frequency/cadence metric). Also FFT-test device-management
    cadence for unexpected periodicity [RITA](https://github.com/activecm/rita).'
  answer_sources:
  - Zeek conn.log
  - Zeek ftp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - 'NAI: Network management jump boxes, network device management interfaces, configuration management
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  PER admin: mu, sigma = baseline(login_hour, login_dow)\n  z = (new_session_features\
      \ - mu) / sigma\n  IF z > 3: ALERT(\"anomalous management timing\")\n  IF FFT(mgmt_cadence) shows\
      \ new periodicity: ALERT(\"automated cadence\")"
- question: Does a one-class SVM trained on legitimate admin sessions (source IP, protocol, hour, day,
    duration, bytes) flag a current device-management session as an outlier, with out-of-window timing
