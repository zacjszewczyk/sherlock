name: 'T1216: System Script Proxy Execution'
id: 71247048-dfd0-437f-864c-76a4be18caf7
description: Investigate adversary abuse of trusted, often Microsoft-signed scripts and script-proxy utilities
  (for example cscript.exe, wscript.exe, mshta.exe, forfiles.exe, SyncAppvPublishingServer.exe, pubprn.vbs,
  manage-bde.wsf, winrm.vbs) used to proxy execution of malicious files and bypass application control
  and signature validation. This playbook helps an analyst determine whether signed scripts are being
  used to launch untrusted payloads by examining process command lines for known IOCs and abuse syntax,
  scoring destination and path rarity, measuring command-line entropy and structure, profiling DNS and
  connection failures, inspecting parent-child process lineage for unexpected shells or loaders, correlating
  execution with network egress, flagging script execution from user-writable or staging directories,
  reviewing application-control block/audit events, and applying supervised, unsupervised, and provenance-graph
  machine-learning models to surface living-off-the-land proxy execution that blends in with normal administrative
  activity.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any signed script-proxy process command lines contain a URL, domain, IP address, or file
    hash that matches known-malicious threat intelligence?
  context: 'This is the most direct, deterministic test for System Script Proxy Execution: when a trusted,
    signed script such as cscript.exe, wscript.exe, SyncAppvPublishingServer.exe, forfiles.exe, mshta.exe,
    or a LOLBAS-catalogued signed script (pubprn.vbs, manage-bde.wsf, syncappvpublishingserver.vbs, winrm.vbs,
    CL_Invocation.ps1, CL_Mutexverifiers.ps1) is invoked, the analyst should extract every atomic indicator
    from the command line and compare it to threat intelligence. A match strongly confirms that the signed
    script is proxying a malicious payload to evade application control and signature validation, which
    is the core stealth objective of this technique. Also match the exact abuse syntax curated by SigmaHQ
    (for example pubprn.vbs invoked with the script: moniker). A positive result is a high-confidence
    detection; a negative result still leaves rarity- and structure-based methods to pursue.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Application Servers, Jump Servers, Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: SEARCH process_creation WHERE process IN [cscript.exe,wscript.exe,mshta.exe,forfiles.exe,SyncAppvPublishingServer.exe]
      OR command_line MATCHES signed_script_list(pubprn.vbs,manage-bde.wsf,winrm.vbs,CL_Invocation.ps1);
      EXTRACT urls,domains,ips,hashes FROM command_line; ALERT when any token IN threat_intel OR command_line
      MATCHES lolbas_abuse_syntax(script:moniker).
- question: For signed script-proxy executions without a known IOC, is the referenced domain or IP first-seen
    or extremely rare compared with the enterprise 30-to-90-day baseline of legitimate signed-script usage?
  context: Adversaries frequently use never-before-seen infrastructure that no threat-intelligence feed
    yet covers, so deterministic IOC matching alone will miss them. By scoring the destination referenced
    in a script-proxy command line against a rolling 30-to-90-day baseline of where signed scripts normally
    connect, the analyst can surface living-off-the-land abuse that is rare for the environment. Weighting
    rare tokens with BM25/log-entropy scoring derives environment-specific thresholds rather than relying
    on fixed lists. Alerting when the destination is first-seen or sits below the 1st-percentile prevalence
    band is consistent with CISA/NSA/FBI LOTL guidance and Red Canary hunting practice. This is tactic-specific
    because stealthy actors deliberately blend in, so rarity rather than reputation is the discriminating
    signal.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Application Servers, Jump Servers, Domain Controllers.'
  range: Last 90 days, with rolling 30-to-90-day destination prevalence baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline destination prevalence for signed_script processes over 30-90d; SCORE referenced domain/ip
      with BM25/log-entropy token weighting; ALERT when destination first_seen OR prevalence < p1 band;
      OUTPUT destination, prevalence_percentile, host, process.
- question: After a signed script-proxy execution, are there elevated NXDOMAIN responses or failed/blocked
    connections to the referenced destinations above the host baseline?
  context: 'Dead-drop resolvers, sinkholed domains, and staged or unregistered C2 infrastructure often
    produce a distinctive failure signature: bursts of NXDOMAIN DNS responses and failed or blocked connection
    attempts. By profiling resolution outcomes and connection state for destinations referenced by signed-script
    proxies and treating failure rate as a separate signal, the analyst can detect C2 retry loops and
    infrastructure that is not yet live. Alerting when post-execution failure rates exceed the host baseline
    upper tail (for example greater than 3 sigma) is a strong supporting indicator that a signed script
    attempted to reach malicious infrastructure even when the connection never completed. This matters
    for the stealth tactic because failed contact is easy to overlook yet reveals intent.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Application Servers, Jump Servers, Domain Controllers.'
  range: Last 90 days, with per-host failure-rate baselines and a short post-execution correlation window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: JOIN signed_script executions TO dns/conn outcomes by host,time; CALCULATE post_exec NXDOMAIN_rate,
      failed_conn_rate; ALERT when rate > host_baseline_mean+3sigma; OUTPUT host, process, destination,
      failure_counts.
- question: Does a supervised classifier rank any signed script-proxy execution as malicious with high
    confidence based on process context, IOC type, destination reputation, and user/host metadata?
  context: When no single field is decisive, a supervised model (for example gradient-boosted trees, or
    a TF-IDF/embedding SVM/RF) can combine many weak signals from process context, IOC type, destination
    reputation, and user/host metadata into a calibrated maliciousness score for each script-proxy execution.
    The analyst should rely on the top-3 contributing features surfaced in the alert rather than the raw
    score alone when deciding whether to escalate. This approach is well suited to the stealth tactic
    because adversaries abusing signed scripts intentionally produce activity that looks individually
    plausible but is collectively anomalous. A high-confidence prediction warrants triage of the host
    and the proxied payload.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Application Servers, Jump Servers, Domain Controllers.'
  range: Last 90 days for training features, with live scoring of new signed-script executions.
  queries:
  - technology: ML pipeline pseudocode
    query: features = [process_context, ioc_type, destination_reputation, user_meta, host_meta]; score
      = gbt_script_proxy_model.predict_proba(features); ALERT when score>=0.85; OUTPUT top_shap_3, host,
      process, command_line.
- question: 'Do any signed script-proxy command lines match curated regular-expression patterns for known
    abuse, such as the remote script: scriptlet moniker, the SyncAppvPublishingServer PowerShell injection
    delimiter, or encoded payload fetches?'
  context: 'Many script-proxy abuses have a recognizable command-line structure even when the destination
    changes. Applying a curated regex library drawn from the LOLBAS Project and SigmaHQ to process command
    lines lets the analyst deterministically catch patterns such as pubprn.vbs with a remote script: scriptlet
    moniker, the SyncAppvPublishingServer "n; PowerShell injection delimiter, inline script invocation,
    and encoded payload fetches. A match is high-fidelity because these syntaxes have little legitimate
    use. This is central to the stealth tactic and to application-control bypass: adversaries rely on
    the exact abuse syntax to make a signed binary load untrusted code, so encoding that syntax as detection
    logic directly counters the technique.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Application Servers, and systems enforcing Application Control (e.g., AppLocker).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: SEARCH process_creation WHERE command_line MATCHES_ANY abuse_regex_library(remote_script_moniker,
      syncappv_injection_delimiter, inline_script_invocation, encoded_payload_fetch); ALERT on any match;
      OUTPUT host, process, command_line, matched_pattern.
- question: Does any signed script-proxy command line exceed the per-tool 99th-percentile for Shannon
    entropy, length, or non-alphanumeric character density, indicating obfuscation?
  context: Obfuscated command lines used to smuggle payloads through signed scripts tend to be longer,
    higher in Shannon entropy, and denser in special characters than legitimate administrative invocations.
    By baselining command-line length, entropy, and special-character ratio per tool over 30 days and
    alerting when an execution exceeds the per-tool 99th-percentile (obfuscated cscript/wscript args commonly
    exceed ~4.5 bits/char), the analyst can flag obfuscation without needing a specific signature. These
    interpretable features are validated by Mandiant. This supports the stealth tactic because obfuscation
    is a primary way adversaries hide proxied payloads inside otherwise trusted script invocations; thresholds
    should be derived per dataset.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Application Servers, and systems enforcing Application Control (e.g., AppLocker).'
  range: Last 90 days, with 30-day per-tool entropy/length baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline per tool over 30d => cmdline_length, shannon_entropy, nonalnum_ratio; ALERT when any
      metric > tool_p99 (e.g., entropy>4.5 bits/char); OUTPUT host, process, command_line, metric_values,
      percentile.
- question: Does a classifier distinguish a signed script-proxy command line as malicious based on token
    counts, URL presence, punctuation density, and character n-grams?
  context: A Random Forest or gradient-boosted classifier trained on token counts, URL presence, punctuation
    density, and character n-grams can separate benign administrative use of signed scripts from malicious
    proxy execution, and the analyst should review the reported feature importances. For obfuscation specifically,
    an ELECTRA-style small language model trained on Invoke-DOSfuscation-augmented data can surface the
    top contributing tokens. This directly addresses the stealth tactic and application-control bypass
    intent, because adversaries craft command lines that are syntactically valid for a signed tool yet
    structurally unusual. A high-confidence malicious classification, with its contributing tokens, gives
    the analyst an explainable starting point for triage.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Application Servers, and systems enforcing Application Control (e.g., AppLocker).'
  range: Last 90 days for training, with scoring of new signed-script command lines.
  queries:
  - technology: ML pipeline pseudocode
    query: features = [token_counts, url_present, punctuation_density, char_ngrams]; score = rf_or_gbt_cmdline_model.predict(features);
      ALERT when malicious_confidence>=0.85; OPTIONAL electra_obfuscation_model surface top_tokens; OUTPUT
      feature_importances, command_line.
- question: Do BERT-style command-line embeddings place any signed-script execution far from the benign
    cluster when scored by unsupervised outlier detectors?
  context: Embedding signed-script command lines with BERT-style transformers and scoring them with unsupervised
    outlier detectors (Isolation Forest, COPOD, PCA, autoencoders) lets the analyst surface novel abuse
    variants that no signature or supervised label yet covers. When a command falls far from the benign
    cluster, the alert should surface the nearest benign neighbor for explainability so the analyst can
    judge whether the deviation is malicious or a new business pattern. Running a labeled classifier in
    parallel with active learning keeps the system robust to new abuse variants. This is valuable for
    the stealth tactic because adversaries continuously mutate obfuscation, and embedding-distance anomaly
    detection generalizes beyond fixed patterns.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Application Servers, and systems enforcing Application Control (e.g., AppLocker).'
  range: Last 90 days for training the benign embedding space, with current command lines scored individually.
  queries:
  - technology: ML pipeline pseudocode
    query: embed signed_script command_lines with bert_encoder; score = isolation_forest_or_copod(embedding);
      ALERT when distance_from_benign_cluster > p99; OUTPUT nearest_benign_neighbor, command_line, host.
- question: Does any signed script-proxy tool spawn an unexpected child process such as powershell.exe,
    cmd.exe, rundll32.exe, regsvr32.exe, or a binary in a user-writable path?
  context: Signed script proxies normally have a narrow, predictable set of child processes. By maintaining
    an allowlist of expected children for each tool (cscript/wscript/SyncAppvPublishingServer) and alerting
    when process creation records an unexpected child such as powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe,
    or any binary in a user-writable path, the analyst gets a high-fidelity signal of proxy execution.
    The canonical SigmaHQ case is wscript/cscript running manage-bde.wsf and spawning a non-cmd child.
    Signed scripts spawning shells are treated as a hard alert by Red Canary. This is core to the stealth
    tactic because launching a shell or loader through a trusted script is exactly how adversaries proxy
    untrusted code past defenses.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Jump Servers, and Development/Test Environment Servers where scripting is common.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: MATCH process_creation WHERE parent IN [cscript.exe,wscript.exe,SyncAppvPublishingServer.exe]
      OR parent_script IN signed_script_list; ALERT when child NOT IN per_tool_allowlist OR child_path
      IN user_writable_dirs; OUTPUT parent, child, child_path, command_line.
- question: Is any parent-child process pair for a signed script-proxy first-seen or present on fewer
    than a small fraction of hosts compared with the fleet baseline?
  context: Building host- and peer-group baselines of parent-child pairs for script-proxy processes over
    30-90 days lets the analyst flag lineage that is statistically rare even if the specific child is
    not on a forbidden list. Alerting when a child is first-seen, appears on fewer than N hosts (for example
    under 0.5% of the fleet), or sits in the bottom rarity percentile catches uncommon proxy chains, and
    tracking child-process spawn frequency (count per minute) catches loader bursts. This rarity-based
    approach, recommended in CISA/NSA/FBI LOTL guidance, supports the stealth tactic by surfacing the
    unusual execution chains adversaries create when abusing trusted scripts, which would otherwise hide
    among normal administration.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Jump Servers, and Development/Test Environment Servers where scripting is common.'
  range: Last 90 days, with 30-to-90-day host and peer-group lineage baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline parent_child pairs for script_proxy processes over 30-90d per host/peer_group; ALERT
      when pair first_seen OR host_prevalence<0.5% OR bottom rarity percentile OR child_spawn_rate spikes;
      OUTPUT parent, child, prevalence, host.
- question: Does a provenance-graph model flag any host whose signed-script parent-child chains are reconstruction
    outliers?
  context: Modeling normal signed-script lineage with a temporal graph neural network over whole-system
    provenance (per KAIROS) lets the analyst detect execution chains that deviate from learned-normal
    behavior across the entire host, not just a single parent-child edge. When a host's script-proxy chain
    is a reconstruction outlier, emitting the compact attack-summary subgraph that identifies the top
    contributing nodes and edges gives the analyst an explainable, triage-ready view. This is well suited
    to the stealth tactic because adversaries chaining trusted scripts into loaders and shells create
    provenance structures that differ subtly from routine administration, and graph reconstruction error
    captures those differences holistically.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Jump Servers, and Development/Test Environment Servers where scripting is common.'
  range: Last 90 days for training the provenance model, with current host activity scored continuously.
  queries:
  - technology: ML pipeline pseudocode
    query: build whole_system_provenance_graph; model = temporal_gnn(KAIROS).fit(benign); score script_proxy
      subgraphs; ALERT on reconstruction_outlier hosts; OUTPUT attack_summary_subgraph, top_nodes_edges.
- question: Does a signed script-proxy process or its child connect to a threat-intelligence match or
    a destination outside the expected network profile when correlated with Zeek conn.log and dns.log?
  context: 'Script hosts rarely make direct outbound connections, so correlating process creation records
    with Zeek conn.log and dns.log by host, timestamp, and process lineage produces a high-fidelity living-off-the-land
    signal. The analyst should alert when a signed script-proxy process or its immediate child connects
    to a threat-intelligence match or to a destination outside the expected network profile. This combines
    endpoint and network evidence to confirm that proxied execution actually reached external infrastructure,
    which is central to the stealth tactic: an adversary using a trusted script to fetch or beacon to
    C2 will reveal itself through this unexpected egress even though the originating process is signed.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points (Firewalls, Proxies), DNS Resolvers, User Endpoints, and Internet-facing
    Servers.'
  range: Last 90 days, with short execution-to-connection correlation windows.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN process_creation(signed_script or child) TO zeek_conn/zeek_dns ON host, time_window<=5m,
      lineage; ALERT when destination IN threat_intel OR destination OUTSIDE expected_network_profile;
      OUTPUT process, destination, port, bytes.
- question: Are signed script-proxy network connections going to rare destinations, non-standard ports,
    or moving byte volumes above the host/tool 99th percentile?
  context: Tracking destination FQDNs/IPs, ports, and bytes-in/bytes-out for script-proxy processes over
    a rolling baseline lets the analyst flag connections in the lowest prevalence band, on non-standard
    ports, or with transfer volumes above the host/tool 99th percentile. Computing the bytes-out to bytes-in
    ratio helps distinguish staging (large download) from exfiltration (large upload). This rarity- and
    volume-based profiling supports the stealth tactic because adversaries abusing signed scripts try
    to keep network activity low-profile; deviations in destination prevalence, port choice, or transfer
    magnitude are among the few reliable tells that the proxied payload is communicating externally.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points (Firewalls, Proxies), DNS Resolvers, User Endpoints, and Internet-facing
    Servers.'
  range: Last 90 days, with rolling per-host/per-tool destination, port, and volume baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline script_proxy connections => destination_prevalence, port, bytes_in, bytes_out; ALERT
      when destination in lowest prevalence band OR non_standard_port OR bytes>host_tool_p99; COMPUTE
      bytes_out/bytes_in ratio; OUTPUT destination, port, bytes, ratio.
- question: Do failed connections, blocked egress, or NXDOMAIN responses tied to signed script-proxy executions
    exceed the baseline upper tail, suggesting C2 retry loops or sinkholed infrastructure?
  context: 'Profiling failed connections, blocked egress, and NXDOMAIN responses tied to script-proxy
    executions as distinct signals lets the analyst detect C2 retry loops and unregistered or sinkholed
    infrastructure that never completes a connection. Alerting when post-execution failure rates exceed
    the baseline upper tail surfaces intent that successful-connection monitoring would miss. This complements
    the network-egress evidence and directly supports the stealth tactic: an adversary''s proxied payload
    may repeatedly try to reach infrastructure that is down, blocked, or sinkholed, and the resulting
    failure burst is a meaningful indicator even in the absence of a completed session.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points (Firewalls, Proxies), DNS Resolvers, User Endpoints, and Internet-facing
    Servers.'
  range: Last 90 days, with per-host failure-rate baselines and a post-execution window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: JOIN script_proxy executions TO conn/dns outcomes; CALCULATE failed_conn_rate, blocked_egress_rate,
      NXDOMAIN_rate post_exec; ALERT when any rate > baseline_upper_tail; OUTPUT host, process, destination,
      failure_type, counts.
- question: Does time-series anomaly detection reveal outbound traffic spikes or periodic beacon-like
    behavior following a signed script-proxy execution?
  context: Applying time-series anomaly detection to outbound bytes, connection counts, and unique destinations
    following a script-proxy execution lets the analyst alert on statistically significant spikes or periodic
    beacon-like behavior characteristic of C2. Using provenance-graph modeling (per KAIROS) to link the
    execution chain to the anomalous egress and presenting the causal subgraph in the alert gives the
    analyst an explainable, end-to-end view from the signed script to the suspicious traffic. This is
    central to the stealth tactic because beaconing and staging are how a proxied payload maintains contact
    with the adversary, and tying that network anomaly back to the trusted-script execution chain confirms
    the abuse.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points (Firewalls, Proxies), DNS Resolvers, User Endpoints, and Internet-facing
    Servers.'
  range: Last 90 days for training, with post-execution scoring of outbound traffic.
  queries:
  - technology: ML pipeline pseudocode
    query: series = outbound_bytes, conn_counts, unique_destinations post script_proxy exec; detect spikes/periodicity
      with time_series_anomaly + beacon_test; LINK via provenance_graph(KAIROS) to execution chain; ALERT
      on significant anomaly; OUTPUT causal_subgraph, beacon_period.
- question: Is any signed script being executed from a user-writable or staging location such as %TEMP%,
    %TMP%, %APPDATA%, C:\Users\Public\, or a downloads folder?
  context: 'Signed scripts normally run from system paths, so executing one from a user-writable or staging
    location such as %TEMP%, %TMP%, %APPDATA%, C:\Users\Public\, downloads folders, or other world-writable
    directories is a core LOLBin abuse indicator. By extracting the executed script path from process
    creation records and alerting on these high-risk locations, the analyst gets a deterministic, low-noise
    signal. This directly supports the stealth tactic and application-control bypass intent: adversaries
    stage their malicious script content in writable directories and then invoke a trusted interpreter
    against it, so the combination of a signed proxy and an anomalous path is strong evidence of abuse.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Multi-user Servers (e.g., Citrix, RDS), and Network File Shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: EXTRACT script_path FROM process_creation(signed_script_proxy); ALERT when script_path IN [%TEMP%,%TMP%,%APPDATA%,C:\Users\Public\,*\Downloads\,
      world_writable_dirs]; OUTPUT host, process, script_path, command_line.
- question: Is any signed-script execution path first-seen, unusually deep, or high in filename entropy
    compared with the per-host/role baseline?
  context: Baselining script execution paths and parent-directory usage over 30 days per host and role
    lets the analyst flag paths that are first-seen, unusually deep, or have filename entropy and rarity
    outside the normal distribution, weighting rare path tokens with log-entropy/BM25 scoring (per SCADE).
    This statistical approach catches anomalous execution locations that are not on a fixed high-risk
    list yet still deviate from how signed scripts are normally invoked in the environment. It supports
    the stealth tactic because adversaries who place scripts in unusual or randomly named directories
    to evade simple path rules will still stand out against a learned baseline of legitimate execution
    paths.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Multi-user Servers (e.g., Citrix, RDS), and Network File Shares.'
  range: Last 90 days, with 30-day per-host/role path baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline script_execution_paths per host/role over 30d; SCORE path with log_entropy/BM25 token
      weighting, depth, filename_entropy, rarity; ALERT when first_seen OR outside normal distribution;
      OUTPUT script_path, rarity_percentile, host.
- question: Are there repeated AppLocker/WDAC block or audit events for signed-script executions from
    anomalous paths, suggesting an adversary probing application-control bypasses?
  context: AppLocker/WDAC block and audit events, and Sysmon process-creation records from blocked paths,
    are a distinct failure-mode signal. Treating repeated blocked or audited signed-script executions
    from anomalous paths as an indicator lets the analyst detect an adversary actively probing for application-control
    bypasses, consistent with the bypass intent documented by the LOLBAS Project. A cluster of such block/audit
    events on a host suggests deliberate experimentation rather than incidental policy friction. This
    is squarely aligned with the stealth tactic and the technique's purpose, since System Script Proxy
    Execution exists specifically to defeat application control and signature validation, and repeated
    blocks reveal that effort.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Multi-user Servers (e.g., Citrix, RDS), and Network File Shares.'
  range: Last 90 days, with clustering of block/audit events per host and user.
  queries:
  - technology: SIEM/Rule pseudocode
    query: SEARCH applocker_wdac block/audit events AND sysmon_eid1 from blocked paths WHERE involved_process
      IN signed_script_list; GROUP BY host,user; ALERT when repeated blocks from anomalous paths; OUTPUT
      host, user, path, block_count, policy.
- question: Does a one-class or embedding-distance model flag any signed-script execution path as outside
    the learned boundary of legitimate paths?
  context: Training a one-class model, or using embedding-distance outlier detection, on legitimate script
    execution paths with features such as directory depth, directory tokens, and extension lets the analyst
    flag paths outside the learned boundary and surface the top-3 anomalous features in the alert. This
    generalizes beyond fixed high-risk-path rules and rarity thresholds to capture subtler path anomalies.
    It supports the stealth tactic because adversaries vary their staging locations to evade static detection,
    and a model of normal execution paths can still recognize a deviation. The explainable top features
    help the analyst decide quickly whether the path reflects malicious staging or a legitimate but uncommon
    location.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Multi-user Servers (e.g., Citrix, RDS), and Network File Shares.'
  range: Last 90 days for learning legitimate paths, with current executions scored individually.
  queries:
  - technology: ML pipeline pseudocode
    query: features = [path_depth, directory_tokens, extension]; model = one_class_or_embedding_outlier.fit(legitimate_paths);
      ALERT when path outside learned_boundary; OUTPUT top_3_anomalous_features, script_path, host.
