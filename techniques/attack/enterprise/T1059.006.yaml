name: 'T1059.006: Python'
id: d19f08a7-3964-4b13-9c34-faeb21987bbb
description: Investigate potential adversary abuse of the Python interpreter (python.exe, python3, py.exe)
  and Python scripts (.py or compiled binaries) for code execution across Windows, Linux, macOS, and ESXi
  endpoints and servers. This playbook helps an analyst determine whether observed Python execution is
  authorized development or data-science activity versus malicious use. It correlates Python process creation
  with network connections to known or suspicious command-and-control (C2) infrastructure, hunts for reverse-shell
  and obfuscation patterns in command-line arguments, detects interpreter execution from atypical paths
  or anomalous parent processes (e.g., Office or PDF applications), flags Python spawning Living-off-the-Land
  Binaries (LOLBins), and profiles outbound network behavior for beaconing, exfiltration-scale volume,
  and connections to newly registered domains. Each question pairs symbolic-logic, statistical, and machine-learning
  approaches so analysts can confirm or refute Python-based execution under the Execution tactic.
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
