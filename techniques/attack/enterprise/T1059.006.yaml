- question: When Python network flows are scored by an autoencoder ensemble trained on benign behavior,
    which flows exceed the 95th-percentile reconstruction error, and can they be tied back to their originating
    Python process chain with explanatory features?
  context: 'Labels for Python C2 are scarce, so unsupervised modeling is valuable. Training an autoencoder
    ensemble on benign Python flow features (src/dst port, protocol, duration, bytes_in/out, packet_count,
    inter-packet jitter, failed-connection rate) and flagging reconstruction error above the 95th percentile
    (Kitsune) catches novel malicious flows without labels. Combining this with host-side provenance-graph
    scoring (KAIROS) ties the anomalous flow to its Python process chain, and surfacing the top-3 contributing
    flow features (for example ''beacon CV 0.02; bytes-out 99.5 pct; dst port 4443'') makes the alert
    actionable. Under the Execution tactic, a high-reconstruction-error flow traceable to a suspicious
    Python chain is a strong positive; well-reconstructed flows are likely benign. Sources: [Kitsune](https://arxiv.org/abs/1802.09089)
    [KAIROS](https://tfjmp.org/publications/2024-sp.pdf)'
