questions:
- question: Did a Python interpreter process (python.exe, python3, or py.exe) create an outbound network
    connection to a destination on threat-intelligence watchlists, a dynamic-DNS or newly registered domain,
    or foreign IP space unrelated to normal business, and were any of those connections failing or being
    blocked?
  context: 'Under the Execution tactic, adversaries frequently use Python networking primitives (requests.get,
    urllib, socket.connect) to stage tooling or open a C2 channel immediately after the interpreter runs.
    Joining Python process-creation events to network-connection events within a tight 5-second window
    ties a specific interpreter invocation to its destination so the analyst can judge whether that destination
    is hostile. Matches against known C2, dynamic-DNS providers (DynDNS, No-IP), domains registered within
    the last seven days, or unexpected foreign ASNs are strong positive signals. Critically, also profile
    the failure modes: bursts of failed/blocked connections, RST floods, and DNS NXDOMAIN responses from
    a Python process are high-signal indicators of dead or rotating C2. A negative result (connections
    only to known-good, business-aligned infrastructure) helps rule out malicious execution. Sources:
    [MITRE ATT&CK T1059.006](https://attack.mitre.org/techniques/T1059/006/) [Red Canary LOLBins](https://redcanary.com/blog/blog/lolbins-abuse/)
    [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)'
  answer_sources:
  - Windows Event ID 4688 (Process Creation)
  - Windows Event ID 5156 (Network Filter Platform)
  - Zeek conn.log (network flow metadata)
  - Sysmon Event ID 3 (Network Connection)
  - File Integrity Monitoring (script hash)
  - 'NAI: Internet gateway/proxy servers, DNS resolvers, All Windows endpoints and servers, Network egress
    points'
  range: Last 90 days (correlate process and network events within a 5-second window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join (EventCode=4688 OR Sysmon=1 where Image in (python.exe,python3,py.exe)) as P\n  with\
      \ (EventCode=5156 OR Sysmon=3) as N\n  on P.host=N.host AND N.pid=P.pid AND (N.time - P.time) <=\
      \ 5s\nalert if N.dest in threat_intel_c2\n  OR N.domain in dynamic_dns_providers\n  OR whois_age(N.domain)\
      \ < 7d\n  OR N.dest_asn not in business_asn_allowlist\n  OR P.cmdline matches /(requests\\.get|urllib|urlopen|socket\\\
      .connect)/"
  - technology: Zeek/pseudocode
    query: 'conn.log | where orig_h in python_host_set

      | join dns.log on uid

      | where conn_state in (S0,REJ,RSTO) OR dns.rcode_name=="NXDOMAIN"

      | stats count by id.orig_h, id.resp_h, conn_state

      | where count > 10   // failed/rotating C2 burst'
- question: For each Python interpreter on a host, does a new outbound connection reach a rarely-seen
    ASN or TLD, or move an abnormal volume of bytes, compared with that interpreter's own 30-day historical
    baseline?
  context: 'Legitimate Python jobs (data pipelines, package installs, analytics) talk to a stable set
    of destinations and move predictable data volumes. Building a per-interpreter 30-day baseline of unique
    destination ASNs/TLDs and outbound byte volume lets the analyst spot deviations that signal C2 or
    exfiltration. Use a robust modified Z-score (|0.6745*(x-median)/MAD| > 3.5) for byte volume so legitimate
    batch jobs do not distort the threshold, and flag connections to ASNs/TLDs in the bottom 1% of historical
    frequency. Track Volume (bytes in/out and the in:out ratio), Frequency (connections per minute), and
    State (successful vs. failed/blocked) separately, because each captures a different facet of malicious
    behavior. A positive result is a rare-destination or volume spike with no business justification.
    Sources: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
  answer_sources:
  - Windows Event ID 4688 (Process Creation)
  - Windows Event ID 5156 (Network Filter Platform)
  - Zeek conn.log (network flow metadata)
  - Sysmon Event ID 3 (Network Connection)
  - File Integrity Monitoring (script hash)
  - 'NAI: Internet gateway/proxy servers, DNS resolvers, All Windows endpoints and servers, Network egress
    points'
  range: Last 90 days (with a rolling 30-day baseline window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = stats by interpreter, host over last 30d:\n  set(dest_asn), set(dest_tld), median(bytes_out),\
      \ MAD(bytes_out)\nfor each new (python spawn -> connection):\n  asn_freq = freq(dest_asn in baseline)\n\
      \  z = 0.6745*(bytes_out - median)/MAD\n  alert if asn_freq <= 0.01 OR dest_tld in bottom_1pct OR\
      \ abs(z) > 3.5\n  emit volume=bytes_out, ratio=bytes_out/bytes_in, conn_per_min, state"
- question: When Python execution is scored together with its network context using an ensemble model,
    which (python, connection) tuples fall in the riskiest 5%, and which features (parent rarity, destination
    novelty, bytes-out, failed-connection rate) drove that score?
  context: 'Single rules miss multi-factor attacks. A gradient-boosted or Random Forest model trained
    on first-party features -- command-line entropy, parent-process rarity P(python|parent), execution-path
    rarity, destination port/ASN novelty, bytes-out and in:out ratio, and failed-connection rate -- can
    rank every (python, connection) tuple by composite risk. Flagging the top 5% concentrates analyst
    attention on the most anomalous executions under the Execution tactic. The alert must surface the
    top-3 contributing features (for example ''parent=WINWORD.EXE; dst ASN unseen; bytes-out 99th pct'')
    so triage is explainable rather than a black box. An unsupervised autoencoder ensemble (Kitsune) can
    additionally flag flows by reconstruction error without labels. A high score with hostile contributing
    features warrants escalation; a high score driven solely by benign-but-rare data-science activity
    can be tuned out. Sources: [ProblemChild](https://arxiv.org/abs/2008.04676) [Mandiant ML command-line
    detection](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/)
    [Kitsune](https://arxiv.org/abs/1802.09089)'
  answer_sources:
  - Windows Event ID 4688 (Process Creation)
  - Windows Event ID 5156 (Network Filter Platform)
  - Zeek conn.log (network flow metadata)
  - Sysmon Event ID 3 (Network Connection)
  - File Integrity Monitoring (script hash)
  - 'NAI: Internet gateway/proxy servers, DNS resolvers, All Windows endpoints and servers, Network egress
    points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [cmdline_entropy, P(python|parent), path_rarity,\n            dst_port_novelty,\
      \ dst_asn_novelty, bytes_out, in_out_ratio,\n            failed_conn_rate]\nmodel = GradientBoosting();\
      \ risk = model.predict_proba(features)\nalert if risk in top_5pct\nemit top3 = feature_importance(features)[:3]\n\
      # unsupervised: kitsune_ae.reconstruction_error(flow) > p95"
- question: Was a Python interpreter launched with command-line arguments containing reverse-shell syntax
    (import pty + spawn, socket AF_INET, os.dup2), encoder/eval primitives (base64.b64decode, exec(, eval(,
    __import__), or download-and-run calls (requests.get, urllib, urlopen)?
  context: 'Adversaries abuse Python one-liners for reverse shells, in-memory payload decoding, and download-and-execute
    staging. Parsing command-line arguments from Windows Event ID 4688, Sysmon Event 1, Linux auditd execve,
    and the macOS unified log for curated patterns gives high-fidelity detection of these behaviors under
    the Execution tactic. The ''import pty'' + ''spawn'' combination in particular is a well-known reverse-shell
    tell. Encoder primitives (base64.b64decode, codecs.decode, exec(, eval(, __import__) reveal obfuscated
    payload execution, while requests.get/urllib/urlopen reveal staging. Use negative lookahead to suppress
    legitimate Jupyter/IPython/pip workflows so the rule stays precise. A match on these patterns is a
    strong positive; absence across all interpreters lowers suspicion. Sources: [Python Spawning Pretty
    TTY Via PTY Module](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_python_pty_spawn.yml)
    [Empirical Study of Malicious Code in PyPI](https://arxiv.org/abs/2309.11021) [Atomic Red Team T1059.006](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.006/T1059.006.md)'
  answer_sources:
  - Windows Event ID 4688 (Process Creation - with command-line capture)
  - Sysmon Event ID 1 (Process Creation - higher-fidelity command logging)
  - EDR command-line telemetry
  - 'NAI: Critical servers (Domain Controllers, database servers), User workstations, Development environments,
    Workstations with EDR sensors deployed'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "src = (EventCode=4688 OR Sysmon=1 OR auditd.execve OR macos.unifiedlog)\n| where proc in (python,python3,py)\n\
      | where cmdline matches any:\n    /import\\s+pty/ AND /spawn/\n    /socket.*AF_INET/  /os\\.dup2/\
      \  /bash.*-i/\n    /base64\\.b64decode/  /codecs\\.decode/  /\\bexec\\(/  /\\beval\\(/  /__import__/\n\
      \    /requests\\.get/  /urllib/  /urlopen/\n| where NOT cmdline matches /(jupyter|ipython|pip\\\
      s)/\n| alert"
- question: Do the Shannon entropy, length, character-set diversity, or rare-keyword content of a Python
    command line exceed that user/host's 30-day baseline, and are there repeated failed (non-zero exit)
    Python invocations?
  context: 'Encoded or obfuscated payloads inflate command-line entropy and length and introduce rarely-seen
    keywords (pickle.loads, marshal, compile, fromhex). Establishing 30-day rolling per-user/host baselines
    and alerting when entropy or length exceeds a robust modified Z-score threshold (>3.5) catches encoded
    one-liners while resisting distortion from normal variation. Treat rare keywords in the bottom 2%
    of historical frequency as a Frequency anomaly, and count repeated failed/erroring Python invocations
    (non-zero exit) as a distinct State signal that can indicate trial-and-error attacker tooling. Under
    the Execution tactic, a positive result is an entropy/length/keyword outlier or a cluster of failed
    invocations that diverges sharply from the user''s norm. Sources: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)'
  answer_sources:
  - Windows Event ID 4688 (Process Creation - with command-line capture)
  - Sysmon Event ID 1 (Process Creation - higher-fidelity command logging)
  - EDR command-line telemetry
  - 'NAI: Critical servers (Domain Controllers, database servers), User workstations, Development environments,
    Workstations with EDR sensors deployed'
  range: Last 90 days (with a rolling 30-day baseline window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per python cmdline compute: entropy=shannon(cmdline), len, charset_div, kw_set\nbaseline per\
      \ user,host over 30d: median+MAD of entropy,len; freq(kw)\nz_e=0.6745*(entropy-med_e)/MAD_e; z_l=0.6745*(len-med_l)/MAD_l\n\
      alert if abs(z_e)>3.5 OR abs(z_l)>3.5\n  OR any kw in {pickle.loads,marshal,compile,fromhex} with\
      \ freq<=0.02\n  OR count(exit_code!=0) per user in window > threshold"
- question: When Python command lines are embedded with transformer/BERT-style representations and scored
    by unsupervised detectors, which lines exceed the 95th-percentile anomaly score, and which tokens
    explain the anomaly?
  context: 'Regex misses novel obfuscation. Embedding Python command lines with transformer/BERT-style
    representations and scoring them with unsupervised detectors (COPOD, Isolation Forest, autoencoder)
    captures semantically anomalous invocations even when exact strings are new. For obfuscated/encoded
    one-liners, ELECTRA-style small language models trained with Invoke-DOSfuscation augmentation, or
    an interpretable gradient-boosted feature model, improve recall on evasive payloads under the Execution
    tactic. Alert above the 95th percentile and surface the top-3 contributing tokens/features in the
    alert text so analysts can triage quickly. A high anomaly score with suspicious explanatory tokens
    is a strong positive; consistently benign scores reduce concern. Sources: [CrowdStrike BERT command-line
    embeddings](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/)
    [Command-line Obfuscation Detection using Small Language Models](https://arxiv.org/html/2408.02637v1)
    [Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/)'
  answer_sources:
  - Windows Event ID 4688 (Process Creation - with command-line capture)
  - Sysmon Event ID 1 (Process Creation - higher-fidelity command logging)
  - EDR command-line telemetry
  - 'NAI: Critical servers (Domain Controllers, database servers), User workstations, Development environments,
    Workstations with EDR sensors deployed'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'emb = bert_embed(python_cmdline)

      score = ensemble([COPOD(), IsolationForest(), autoencoder()]).anomaly(emb)

      alert if score >= p95

      emit top3_tokens = token_attribution(emb)[:3]

      # obfuscated variant: electra_small(cmdline) trained w/ dosfuscation aug'
- question: Was a Python interpreter executed from outside approved installation directories, spawned
    by a parent not on the allowlist (especially Office/PDF apps like WINWORD.EXE, EXCEL.EXE, AcroRd32.exe),
    or launched off-hours?
  context: 'Authorized Python runs from known install paths (C:\Program Files\Python*, C:\Python*, AppData\Local\Programs,
    /usr/bin, /usr/local/bin) and is started by expected parents (cmd.exe, powershell.exe, explorer.exe,
    bash, sshd, scheduled task/cron, IDEs). Execution from C:\Perflogs, %APPDATA%, or %TEMP%, or a parent
    such as WINWORD.EXE/EXCEL.EXE/AcroRd32.exe, is a documented initial-execution pattern where a malicious
    document or LOLBin launches the interpreter -- a hallmark of the Execution tactic. Off-hours execution
    adds suspicion. Enforcing execution-path and parent-process allowlists turns these contextual anomalies
    into actionable alerts. A violation is a strong positive; execution from approved paths/parents during
    business hours is reassuring. Sources: [Red Canary LOLBins](https://redcanary.com/blog/blog/lolbins-abuse/)
    [MITRE ATT&CK T1059.006](https://attack.mitre.org/techniques/T1059/006/)'
  answer_sources:
  - Windows Event ID 4688 (Process Creation with executable path and parent info)
  - Windows Event ID 15 (File creation in alternate data streams - for script staging)
  - Sysmon Event ID 1 (Process Creation with full command-line context)
  - EDR process telemetry
  - 'NAI: All Windows endpoints and servers, User profile directories (%APPDATA%, %USERPROFILE%), Temporary
    file directories, Development workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "src = (EventCode=4688 OR Sysmon=1 OR auditd.execve) where proc in (python,python3,py)\napproved_paths\
      \ = [C:\\Program Files\\Python*, C:\\Python*, *\\AppData\\Local\\Programs, /usr/bin, /usr/local/bin]\n\
      allow_parents = [cmd.exe,powershell.exe,explorer.exe,bash,sshd,cron,task_sched,IDEs]\nalert if image_path\
      \ NOT match approved_paths\n  OR parent NOT in allow_parents\n  OR parent in {WINWORD.EXE,EXCEL.EXE,AcroRd32.exe}\n\
      \  OR hour(time) in off_hours"
- question: Compared with a 90-day baseline, did a user with no Python history suddenly run it, did the
    execution directory or parent become novel for that user, or did the hour-of-day deviate sharply?
  context: 'Profiling 90-day rolling counts of Python executions per user and host and decomposing the
    count series exposes spikes and first-time activity. Under the Execution tactic, a zero-history user
    suddenly running Python, a novel execution directory or parent for an established user, or an hour-of-day
    that deviates by a modified Z-score >3.5 each indicate possible misuse rather than routine development.
    Profile failed launches/permission-denied executions as a separate State signal that can reveal attacker
    probing. A positive result is new or off-pattern Python usage that lacks an obvious business explanation;
    stable, consistent usage is reassuring. Sources: [Microsoft Sentinel Time-Series Anomaly for Process
    Executions](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Windows%20Security%20Events/Analytic%20Rules/TimeSeriesAnomaly-ProcessExecutions.yaml)
    [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
  answer_sources:
  - Windows Event ID 4688 (Process Creation with executable path and parent info)
  - Windows Event ID 15 (File creation in alternate data streams - for script staging)
  - Sysmon Event ID 1 (Process Creation with full command-line context)
  - EDR process telemetry
  - 'NAI: All Windows endpoints and servers, User profile directories (%APPDATA%, %USERPROFILE%), Temporary
    file directories, Development workstations'
  range: Last 90 days (with a rolling 90-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per user,host over 90d: count(python), set(dir), set(parent), hour_hist\ntimeseries_decompose(count_series)\
      \ -> detect spikes\nalert if user has zero prior python history\n  OR exec_dir not in set(dir) OR\
      \ parent not in set(parent)\n  OR abs(0.6745*(hour - median_hour)/MAD_hour) > 3.5\nemit state =\
      \ count(failed_or_permission_denied) per user"
- question: Using an Isolation Forest over per-user/peer-group process features, which Python executions
    fall in the anomalous top 5%, and which features (path rarity, parent rarity, hour, network flags,
    execution-count z-score) explain them?
  context: 'Multivariate anomalies evade single thresholds. An Isolation Forest built per user or peer-group
    using features such as executable_path_rarity, parent_process_rarity P(python|parent), hour_of_day,
    command_line_length, presence_of_network_flags, and execution_count_zscore can isolate Python executions
    that deviate across several dimensions at once. Flagging the top 5% and reporting the top-3 contributing
    features makes the result explainable for triage under the Execution tactic. Parent-child rarity modeling
    and supervised lineage classification reinforce the score. A high anomaly score driven by rare paths/parents
    and network flags is a strong positive; benign-but-rare research workflows can be tuned out. Sources:
    [ProblemChild](https://arxiv.org/abs/2008.04676)'
  answer_sources:
  - Windows Event ID 4688 (Process Creation with executable path and parent info)
  - Windows Event ID 15 (File creation in alternate data streams - for script staging)
  - Sysmon Event ID 1 (Process Creation with full command-line context)
  - EDR process telemetry
  - 'NAI: All Windows endpoints and servers, User profile directories (%APPDATA%, %USERPROFILE%), Temporary
    file directories, Development workstations'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [path_rarity, P(python|parent), hour_of_day, cmdline_len,\n            has_network_flags,\
      \ exec_count_zscore]\nmodel = IsolationForest().fit(per_user_or_peergroup_history)\nscore = model.decision_function(features)\n\
      alert if score in top_5pct\nemit top3 = shap_or_feature_importance(features)[:3]"
- question: Did a Python process spawn a child Living-off-the-Land Binary (wmic.exe, bitsadmin.exe, rundll32.exe,
    certutil.exe, schtasks.exe, etc.) or chain into suspicious shell utilities, or did the Python command
    line call subprocess/os.system/Popen/ctypes?
  context: 'When Python is the parent of a trusted system binary, it often signals privilege escalation,
    lateral movement, or evasion executed through that trusted binary. Constructing process chains from
    Event ID 4688/Sysmon 1/auditd and alerting when Python''s immediate child matches a curated LOLBin
    list {wmic.exe, bitsadmin.exe, rundll32.exe, certutil.exe, schtasks.exe, net.exe, netsh.exe, sc.exe,
    reg.exe, powershell.exe, mshta.exe} on Windows, or {bash, sh, curl, wget, nc, chmod, base64} chained
    suspiciously on Linux/macOS, captures this core LOLBin pattern under the Execution tactic. Also flag
    Python command lines containing subprocess/os.system/Popen/ctypes, which reveal intent to shell out
    or call native code. A Python-to-LOLBin chain is a strong positive. Sources: [Red Canary LOLBins](https://redcanary.com/blog/blog/lolbins-abuse/)
    [Atomic Red Team T1059.006](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.006/T1059.006.md)'
  answer_sources:
  - Windows Event ID 4688 (Process Creation - with parent-child relationship tracking)
  - Sysmon Event ID 1 (Process Creation - with extended parent process info)
  - Sysmon Event ID 3 (Network Connection - if LOLBin establishes connections)
  - EDR process tree telemetry
  - 'NAI: All Windows endpoints and servers, especially those with EDR agents capable of capturing detailed
    parent-child process relationships, Servers hosting privilege-sensitive applications, User workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "chains = build_process_tree(EventCode=4688 OR Sysmon=1 OR auditd)\nalert if parent in (python,python3,py)\
      \ AND child in\n  {wmic.exe,bitsadmin.exe,rundll32.exe,certutil.exe,schtasks.exe,\n   net.exe,netsh.exe,sc.exe,reg.exe,powershell.exe,mshta.exe}\n\
      \  OR (child in {bash,sh,curl,wget,nc,chmod,base64} chained)\n  OR parent.cmdline matches /(subprocess|os\\\
      .system|Popen|ctypes)/"
- question: For each (python, child) process pair, is the conditional probability P(child|python) below
    1% or previously unseen, and are there rare multi-hop sequences (python -> bitsadmin -> certutil)
    or failed child executions?
  context: 'Most Python child processes are common and benign; rare children are suspicious. Computing
    P(child|python) over 60-day history and alerting when an observed child has P(child|python) < 1% or
    is entirely novel surfaces the unusual lineages adversaries create. Rare multi-hop sequences such
    as python -> bitsadmin -> certutil are especially indicative of staged tooling under the Execution
    tactic. Count failed child executions (non-zero exit, blocked by AppLocker/WDAC) as a distinct State
    signal that tooling did not run cleanly -- a useful tell even when the attack failed. A low-probability
    or novel lineage is a positive; common, high-probability children reduce concern. Sources: [ProblemChild](https://arxiv.org/abs/2008.04676)'
  answer_sources:
  - Windows Event ID 4688 (Process Creation - with parent-child relationship tracking)
  - Sysmon Event ID 1 (Process Creation - with extended parent process info)
  - Sysmon Event ID 3 (Network Connection - if LOLBin establishes connections)
  - EDR process tree telemetry
  - 'NAI: All Windows endpoints and servers, especially those with EDR agents capable of capturing detailed
    parent-child process relationships, Servers hosting privilege-sensitive applications, User workstations'
  range: Last 90 days (with a 60-day probability history)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "hist = P(child | parent==python) over last 60d\nfor each observed (python -> child):\n  alert\
      \ if P(child|python) < 0.01 OR child unseen\n  alert if multi_hop in {python->bitsadmin->certutil,\
      \ ...}\nemit state = count(child exit_code!=0 OR blocked_by_applocker_wdac)"
- question: When Python-rooted process/file/network subgraphs are scored with provenance-graph learning,
    which subgraphs exceed the learned anomaly threshold, and what reconstructed attack path or top contributing
    nodes explain them?
  context: 'Sophisticated intrusions span many steps that look benign individually but form a malicious
    pattern as a graph. Modeling Python-rooted process/file/network subgraphs and scoring them with provenance-graph
    learning -- a graph temporal autoencoder (KAIROS) and masked graph representation learning (MAGIC)
    -- detects malicious subgraphs and reconstructs attack paths for explainable triage. Sequence deviations
    after a Python launch can also be modeled with an LSTM approach (DeepLog). Under the Execution tactic,
    alert above the learned anomaly threshold and present the reconstructed subgraph or top contributing
    nodes so analysts can see how Python execution connects to follow-on activity. A high-scoring subgraph
    tying Python to suspicious children/flows is a strong positive. Sources: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf)
    [MAGIC](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf) [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)'
  answer_sources:
  - Windows Event ID 4688 (Process Creation - with parent-child relationship tracking)
  - Sysmon Event ID 1 (Process Creation - with extended parent process info)
  - Sysmon Event ID 3 (Network Connection - if LOLBin establishes connections)
  - EDR process tree telemetry
  - 'NAI: All Windows endpoints and servers, especially those with EDR agents capable of capturing detailed
    parent-child process relationships, Servers hosting privilege-sensitive applications, User workstations'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'G = build_provenance_graph(python_root, process+file+network events)

      score = kairos_temporal_ae(G)  # or magic_masked_graph(G)

      alert if score > learned_threshold

      emit reconstructed_attack_path(G), top_contributing_nodes(G)

      # sequence variant: deeplog_lstm(event_sequence_after_python)'
- question: Within 30 seconds of a Python spawn, did an outbound connection reach a domain registered
    less than 60 days ago, a known C2, a non-standard port for its protocol, or bullet-proof/VPN hosting
    -- and were there NXDOMAIN bursts or blocked responses?
  context: 'C2 over Python frequently targets freshly registered or otherwise suspicious infrastructure.
