  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary repeatedly drives resource-intensive
    application features and endpoints to exhaust CPU, memory, worker/connection pools, and bandwidth
    until the service is denied to legitimate users. This evidence focuses on the condition that a rapid,
    sustained increase in connection or request volume to a specific application service, where the rate
    exceeds 3 standard deviations above the established 30-day rolling baseline for that time of day and
