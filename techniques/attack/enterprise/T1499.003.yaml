name: 'T1499.003: Application Exhaustion Flood'
id: 2856fb35-3a8b-4dfc-9725-8d0c49cef4b4
description: 'This playbook helps an analyst investigate whether an adversary has caused a denial of service
  by exhausting application resources (MITRE ATT&CK T1499.003, Application Exhaustion Flood) under the
  Impact tactic, where attackers repeatedly invoke resource-intensive application features or endpoints
  to consume CPU, memory, worker/thread pools, and connection capacity until the service degrades or fails.
  It guides the hunt across complementary behavioral angles spanning Windows, Linux, macOS, and cloud/IaaS
  workloads: high-rate connections from CTI-flagged DoS/botnet source IPs (including rejected/half-open
  states that survive server-side shedding); HTTP requests matching application-layer DoS tool signatures
  (GoldenEye, Slowloris, RUDY, Hulk) and WAF burst counters; sudden volume surges that breach statistical
  baselines, z-score thresholds, change-point onset, and seasonal forecast intervals; host-side crash/resource-exhaustion
  events (Windows Event ID 1000/2004, Linux OOM-killer/worker-pool syslog errors, macOS spin/crash reports)
  correlated with network DoS alerts; asymmetric abuse of expensive API endpoints (search, report/export,
  render) by single sources at extreme percentiles; rapid low-entropy automated request bursts and oversized
  URIs/bodies that force heavy parsing; low-and-slow exhaustion via many concurrent, long-lived, near-zero-throughput
  partial connections; and sustained surges in 5xx/503/502/504 error responses and autoscaling triggers
  that signal backend exhaustion even when raw request counts look bounded. Detection methods combine
  symbolic-logic tripwires and rules, statistical baselining/forecasting (modified z-score, CUSUM/Bayesian
  change-point, ARIMA/Prophet, Poisson surge), and machine-learning models (logistic regression, Random
  Forest, Isolation Forest, DBSCAN, autoencoders) applied to Zeek conn.log/http.log, Windows Application/Sysmon/perfmon
  events, auditd and Linux syslog, macOS unified logs, and AWS CloudWatch/CloudTrail/CloudMetrics, so
  the analyst can corroborate suspected application-exhaustion floods against traffic volume, request
  shape, host health, and failure rates.'
type: technique
