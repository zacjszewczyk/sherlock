questions:
- question: '[Impact] CTI connection rule: Can you determine whether a rate of new connections from a
    single source IP, which is present on a high-confidence threat intelligence feed for DoS or botnet
    activity, exceeds 10 connections per minute to a critical web application. Profile both successful
    and rejected/half-open connection states so botnet hammering that the server is already shedding is
    still scored. -- specifically, using the ''CTI connection rule'' (Symbolic Logic) approach to surface
    application-exhaustion flood activity against application exhaustion flood targets?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary repeatedly drives resource-intensive
    application features and endpoints to exhaust CPU, memory, worker/connection pools, and bandwidth
    until the service is denied to legitimate users. This evidence focuses on the condition that a rate
    of new connections from a single source IP, which is present on a high-confidence threat intelligence
    feed for DoS or botnet activity, exceeds 10 connections per minute to a critical web application.
    Profile both successful and rejected/half-open connection states so botnet hammering that the server
    is already shedding is still scored. This Symbolic Logic approach works as follows: Match Zeek conn.log
    source IPs to CTI DoS/botnet lists when connecting to critical ports and alert; per CISA DoS guidance
    unusual sustained traffic from a single/few sources to one service is a primary indicator ([Understanding
    Denial-of-Service Attacks, CISA](https://www.cisa.gov/news-events/news/understanding-denial-service-attacks)).
    Keep the deterministic floor of >10 conn/min and tune per-service from baseline. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates a source or workload is consuming
    application resources in a way that deviates from sanctioned, baselined behavior and may be actively
    degrading availability; pivot to the responsible source IP(s), the targeted service/endpoint, concurrent
    host-health and error-rate telemetry, and any correlated crash or autoscaling events to confirm impact
    and scope. A negative result helps rule out this specific flood vector but should be corroborated
    with the other questions in this playbook, since slow-rate, asymmetric, and distributed floods can
    each evade any single detector.'
