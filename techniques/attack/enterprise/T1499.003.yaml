    is consuming application resources in a way that deviates from sanctioned, baselined behavior and
    may be actively degrading availability; pivot to the responsible source IP(s), the targeted service/endpoint,
    concurrent host-health and error-rate telemetry, and any correlated crash or autoscaling events to
    confirm impact and scope. A negative result helps rule out this specific flood vector but should be
    corroborated with the other questions in this playbook, since slow-rate, asymmetric, and distributed
    floods can each evade any single detector.'
