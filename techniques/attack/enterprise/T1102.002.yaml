  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: Rare URI anomaly\nBASELINE 30d per (host, web_service_domain):\n\
      \  uri_rarity      = freq_rank(uri_path)              // per-domain 24h rarity\n  ua_freq      \
      \   = freq(user_agent | service)       // 30d UA baseline\n  ua_4xx_ratio    = count(status in 4xx)/count(*)\n\
      \  delta_stats     = rolling6h(inter_conn_delta)      // mean, std, CoV, MAD, skew\n  domain_jaccard\
      \  = jaccard(domains_24h, domains_30d)\nCOMPUTE per-domain/role cutoffs (percentiles, mean+3sigma)\n\
      ALERT WHEN uri_rarity IN top 0.1%\n  OR ua_freq IN bottom 0.1% OR ua unseen-for-service\n  OR ua_4xx_ratio\
      \ > p99\n  OR (std(delta) < 5s AND 10s <= mean(delta) <= 30m AND low CoV)  // beacon timing\n  OR\
      \ domain_jaccard < 0.8                              // >20% novel destinations\n  OR DFFT_periodicity_detected(delta_series)"
- question: 'Using a machine-learning model, can you determine whether ''DNS query classifier'' indicates
    bidirectional web-service command-and-control activity? Specifically: Score DNS queries via a Random
    Forest or Gradient Boosting model trained on domain entropy, query length, non-alphanumeric ratio,
    subdomain depth, and TLD+1 rarity, and flag queries with malicious probability > 0.9 that resolve
    to legitimate web services. Use Isolation Forest as an unlabeled fallback and surface the top-3 contributing
    features (e.g., entropy, subdomain depth, rarity) in the alert for triage [Isolation Forest, Liu,
    Ting, Zhou](https://doi.org/10.1145/2133360.2133363).'
