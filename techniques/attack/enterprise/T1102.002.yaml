name: 'T1102.002: Bidirectional Communication'
id: c44193ff-2de2-41fb-8593-1b226c3bac3e
description: 'This playbook helps an analyst determine whether an adversary is using T1102.002 (Bidirectional
  Communication): abusing a legitimate external web service - popular websites, social media, code-hosting
  platforms, or cloud storage - as a covert, two-way command-and-control channel where commands are issued
  and command output is returned over the same SSL/TLS-protected service. It correlates network telemetry
  (Zeek conn.log, http.log, dns.log, ssl.log, files.log) with endpoint process telemetry (Windows Event
  ID 4688, Sysmon Event ID 1/3, auditd, macOS unified log, ETW WinINet) to surface C2 hiding in expected
  web noise. Investigative angles include: threat-intel and domain-fronting correlation (TLS SNI vs HTTP
  Host mismatch), DNS/egress failure-rate bursts from rotating or dead C2 endpoints, rare URI paths and
  unseen User-Agents per service, C2 framework signatures (Cobalt Strike, Empire, PoshC2, Sliver) and
  JA3/JA4/JA4H TLS fingerprints, asymmetric low-and-slow data ratios, high-entropy encrypted payloads,
  periodic ''heartbeat'' beaconing, anomalous process-to-network lineage (e.g., rundll32/mshta/office
  apps reaching pastebin or github from %TEMP%), and critical servers contacting consumer-grade web services
  outside their approved baseline. Detection blends symbolic-logic rules, statistical baselining (rarity
  percentiles, Shannon entropy, beacon timing statistics, Jaccard domain drift), and machine learning
  (Random Forest/Gradient Boosting, Isolation Forest, One-Class SVM, LSTM autoencoders, CT-HMM beacon
  models, KitNET flow ensembles, STL residuals, self-supervised contrastive and DeepLog sequence models)
  to produce evasion-resistant, explainable alerts for the Command and Control tactic.'
type: technique
related:
