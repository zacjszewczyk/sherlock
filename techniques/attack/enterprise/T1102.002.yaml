questions:
- question: 'Using deterministic rule logic, can you determine whether ''Threat intel URL correlation''
    indicates bidirectional web-service command-and-control activity? Specifically: Join Zeek dns.log,
    http.log, and conn.log fields with threat intelligence feeds capturing C2 infrastructure and alert
    immediately when a destination IP/domain/URI matches the intelligence. Because adversaries front C2
    behind shared CDN/web-service domains, also alert when the cleartext TLS SNI (ssl.log server_name)
    disagrees with the inner HTTP Host header on the same connection, a deterministic tell of domain fronting
    [Blocking-resistant communication through domain fronting, Fifield et al.](https://www.bamsoftware.com/papers/fronting/).'
  context: 'Tactic context (Command And Control): the adversary is trying to communicate with compromised
    systems to control them, and in T1102.002 (Bidirectional Communication) they abuse a legitimate external
    web service - popular sites, social media, code-hosting, or cloud storage - as a two-way C2 channel,
    sending commands to the host and receiving command output back over the same service (a forum comment,
    pull request, document update, tweet, or API post). Because victims routinely talk to these SSL/TLS-protected
    services already, this traffic blends into expected noise. Evidence under investigation: Observed
    network traffic to a legitimate web service resolves to or communicates with a destination IP, domain,
    or URL that matches a known-malicious indicator. Approach (Threat intel URL correlation): Join Zeek
    dns.log, http.log, and conn.log fields with threat intelligence feeds capturing C2 infrastructure
    and alert immediately when a destination IP/domain/URI matches the intelligence. Because adversaries
    front C2 behind shared CDN/web-service domains, also alert when the cleartext TLS SNI (ssl.log server_name)
    disagrees with the inner HTTP Host header on the same connection, a deterministic tell of domain fronting
    [Blocking-resistant communication through domain fronting, Fifield et al.](https://www.bamsoftware.com/papers/fronting/).
    This method works by matching observed fields against deterministic indicators, signatures, allow/deny
    lists, and invariant thresholds that hold regardless of attacker tooling. A positive result means
    a host''s interaction with a legitimate web service carries the structure, timing, payload, or process
    lineage of an implant C2 channel rather than genuine human or sanctioned application use; a negative
    result means the observed traffic matches the established benign baseline for that service. Investigate
    the named area of interest (Egress network gateways, DNS resolvers, and forward proxy servers.) and
    pivot from any hit to the originating process, account, resolved infrastructure, and any concurrent
    exfiltration or follow-on tasking.'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Egress network gateways, DNS resolvers, and forward proxy servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Threat intel URL correlation\nMATCH web_service_sessions (Zeek\
      \ conn/http/dns/ssl, Sysmon EID3, ETW WinINet) WHERE\n  dest_domain IN legitimate_web_services \
      \          // google, twitter, github, pastebin, etc.\n  AND (\n     ti_match(dest_ip|dest_domain|uri,\
      \ c2_intel_feed)             // known C2 indicator\n     OR ssl.server_name != http.host       \
      \                       // domain-fronting tell\n     OR regex_yara_hit(user_agent|uri|post_body,\
      \ c2_framework_sigs) // CS/Empire/Sliver/PoshC2\n     OR ja3|ja4|ja4h IN implant_fingerprint_denylist\n\
      \     OR (orig_bytes >= 5*resp_bytes AND orig_bytes > 1024 AND resp_pkts > orig_pkts) // asym exfil\n\
      \     OR shannon_entropy(post_body|file_bytes) > 7.2               // encrypted/packed payload\n\
      \     OR nxdomain_servfail_or_reset_burst(host) > 10 PER 5m        // rotating/dead C2\n     OR\
      \ proc_path MATCHES /(APPDATA|TEMP|PUBLIC)/ AND proc IN [rundll32,mshta,cscript,powershell]\n  \
      \   OR (src_role == critical_server AND dest NOT IN server_allowlist)\n  )\nTHEN alert(severity='high',\
      \ enrich=[host, proc_guid, dest_domain, ja3, sni_host_pair])"
- question: 'Using deterministic rule logic, can you determine whether ''DNS/egress failure-rate signal''
    indicates bidirectional web-service command-and-control activity? Specifically: Profile per-host resolution
    and egress failures as a distinct signal: alert when a host generates a burst of NXDOMAIN/SERVFAIL
    responses or repeated blocked/reset egress attempts (>10 in 5 min) toward web-service or CDN domains,
    indicating rotating or dead C2 endpoints rather than benign browsing [BAYWATCH: Robust Beaconing Detection,
    Hu et al.](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks).'
