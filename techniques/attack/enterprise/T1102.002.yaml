- question: 'Using statistical baselining, can you determine whether ''Rare URI anomaly'' indicates bidirectional
    web-service command-and-control activity? Specifically: For each legitimate web service domain, profile
    24-hour frequency of full URI paths from Zeek http.log and surface any URI that falls into the top
    0.1% of rarity for that domain, signaling unique C2 endpoints. Derive the per-domain rarity cutoff
    from your own 30-day baseline rather than a fixed global value [Modeling Analysis and Characterization
    of Periodic Traffic, Mack et al.](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf).'
