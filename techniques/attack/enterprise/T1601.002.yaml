name: 'T1601.002: Modify System Image: Downgrade System Image'
id: 7bade6f0-65f9-49b9-9893-7015bb1930c4
description: 'Investigate whether an adversary is weakening the security posture of network devices (routers,
  switches, firewalls) by installing an older, more vulnerable operating system or firmware image. This
  playbook helps an analyst hunt the canonical downgrade chain: an unauthorized or anomalous firmware/OS
  image transfer (often over legacy unencrypted protocols such as TFTP, FTP, or SCP), a boot-configuration
  change that points the device at an older or non-approved image, and a reboot/reload that brings the
  downgraded image into running state. It guides verification of OS version and image integrity against
  an authoritative golden baseline/CMDB, enforcement of anti-rollback (monotonic version) controls, and
  independent out-of-band validation because a compromised device may falsify CLI output. Downgrading
  a system image enables follow-on defense evasion such as Weaken Encryption (T1600) and is often paired
  with Patch System Image (T1601.001). Questions span deterministic hash/allowlist checks, statistical
  baselining and change-point/rollback detection, and machine-learning anomaly and sequence/graph models
  across network (Zeek) and Windows management-host telemetry.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
