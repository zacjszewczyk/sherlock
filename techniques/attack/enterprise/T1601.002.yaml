questions:
- question: Has any file transferred toward a network device (via TFTP, SCP, or FTP) carried a SHA256
    hash that matches a known-vulnerable/outdated firmware image or is absent from the per-model approved
    golden-image allowlist?
  context: 'Adversaries downgrade network devices by staging an older OS/firmware image and booting from
    it to re-enable weak ciphers and removed defenses (supporting Weaken Encryption, T1600). Maintain
    a per-model allowlist of approved CURRENT image SHA256 hashes and version banners; alert when a transferred
    file''s hash matches a known-bad/outdated hash OR is not on the approved allowlist, and enforce anti-rollback
    so any older-than-baseline signed image is flagged (NIST SP 800-193). Use exact and fuzzy (ssdeep)
    hashing to correlate unknown blobs against known-good/known-bad corpora and extract embedded version
    banners. A match to a known-vulnerable hash, or an unknown hash arriving at a device IP, is a strong
    defense-impairment indicator; an exact match to the approved current image is benign. Tie to Defense
    Impairment: a downgraded, trusted-looking image silently blinds or weakens the device. References:
    [Platform Firmware Resiliency Guidelines (NIST SP 800-193), Regenscheid](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf);
    [A Large-Scale Analysis of the Security of Embedded Firmwares, Costin et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network traffic at aggregation points, Network management servers, Firmware distribution points,
    Core routers and switches'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "files where rx_hosts in NETWORK_DEVICE_IPS\n| join allowlist on (device_model, sha256)\n|\
      \ where sha256 in KNOWN_BAD_HASHES\n   OR sha256 not in APPROVED_CURRENT_HASHES[device_model]\n\
      \   OR version_banner < baseline_version[device_model]\n| also compute ssdeep_similarity(file, known_bad_corpus)\n\
      | alert"
- question: Are firmware transfers to network devices originating from new or rare sources/protocols,
    occurring off the maintenance window, or showing a sudden step-change in frequency or in aborted/failed
    transfer rate?
  context: 'Beyond hash matching, baseline the transfer sources, protocols, and bytes-per-transfer per
    device model. Flag transfer frequencies from new or rare sources above the 95th percentile, transfers
    outside the approved maintenance window, and step changes detected via change-point methods (CUSUM/PELT).
    Separately profile failure-mode signals: aborted/failed TFTP/SCP transfers and failed admin logons
    immediately preceding a transfer, which often accompany an attacker''s trial-and-error staging. A
    spike from an unfamiliar host or a burst of failed transfers before a successful one indicates probable
    unauthorized image staging supporting a downgrade; activity confined to known sources within scheduled
    windows is likely benign maintenance. References: [A Survey of Methods for Time Series Change Point
    Detection, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/); [Network Infrastructure
    Security Guide, NSA](https://media.defense.gov/2022/Jun/15/2003018261/-1/-1/0/CTR_NSA_NETWORK_INFRASTRUCTURE_SECURITY_GUIDE_20220615.PDF).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network traffic at aggregation points, Network management servers, Firmware distribution points,
    Core routers and switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per (device_model): sources, protocols, bytes_per_transfer

      stream firmware_transfers

      | flag if source_freq_pct > 95 from rare/new source

      | flag if time outside maintenance_window

      | apply CUSUM/PELT on transfer_count_timeseries -> flag changepoint

      | profile aborted_xfer_rate, failed_logons_preceding

      | alert on anomalies'
- question: When a Random Forest classifier scores a firmware transfer as malicious, what are the top
    contributing features, and do they corroborate an unauthorized downgrade attempt?
  context: 'Layer a supervised classifier ABOVE (never replacing) the deterministic hash allowlist. Train
    a Random Forest on features [is_local, MIME type, size, source_is_admin_host, time_of_day, protocol,
    bytes] and alert on high-confidence malicious labels, surfacing the top-3 contributing features in
    the alert text rather than a bare score. Feature attribution lets the analyst confirm whether the
    decision was driven by, e.g., a non-admin source, off-hours timing, or a legacy protocol. A high-confidence
    label whose drivers align with anomalous source/timing/protocol warrants triage as a potential image
    downgrade; if drivers are benign (admin host, in-window) treat as lower priority. This residual ML
    layer catches novel transfers the allowlist alone would miss while keeping decisions explainable for
    the Defense Impairment context. References: [Explainable Anomaly Detection for Industrial Control
    System Cybersecurity, Hwang & Lee](https://arxiv.org/abs/2205.01930); [A Survey of Intrusion Detection
    in Cyber-Physical Systems, Mitchell & Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network traffic at aggregation points, Network management servers, Firmware distribution points,
    Core routers and switches'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = RandomForest(features=[is_local, mime, size, source_is_admin_host,\n         time_of_day,\
      \ protocol, bytes])\nfor xfer in firmware_transfers:\n  p = model.predict_proba(xfer)\n  if p_malicious\
      \ >= 0.8:\n    emit alert(score=p, top3=feature_importances(xfer))\n# runs above, not instead of,\
      \ hash allowlist"
- question: Did any boot-configuration command (e.g., 'boot system', 'copy <x> flash') reference a system
    image that does not match the approved CMDB/allowlist entry for that device?
  context: 'A downgrade requires repointing the device''s boot variable at an older image. Alert when
    boot-config commands reference images not matching approved CMDB/allowlist entries; continuously diff
    device configs against an authoritative baseline and assert the invariant ''boot variable references
    only the approved current image'' independent of device CLI output (Batfish-style config analysis).
    Capture these via AAA command accounting of privileged commands and centralized syslog, and corroborate
    with out-of-band verification (show bootvar / show software authenticity) because a compromised device
    may falsify output. A boot variable pointing to an unapproved/older image is a direct downgrade indicator;
    matching the approved current image satisfies the invariant. This is core Defense Impairment evidence
    — the boot config is where the attacker locks in the weakened image. References: [A General Approach
    to Network Configuration Analysis (Batfish), Fogel et al.](https://www.usenix.org/conference/nsdi15/technical-sessions/presentation/fogel);
    [Network Infrastructure Security Guide, NSA](https://media.defense.gov/2022/Jun/15/2003018261/-1/-1/0/CTR_NSA_NETWORK_INFRASTRUCTURE_SECURITY_GUIDE_20220615.PDF);
    [Cisco IOS Software Integrity Assurance, Cisco](https://sec.cloudapps.cisco.com/security/center/resources/integrity_assurance.html).'
  answer_sources:
  - Zeek syslog.log
  - Windows Event ID 4688
  - Windows Event ID 4648
  - 'NAI: Syslog servers, Network device command line interfaces (CLIs), Windows-based network management
    workstations, SIEM/Log aggregation platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'events where cmd matches /(boot system|copy .* flash)/

      | extract referenced_image

      | join CMDB allowlist on device_id

      | where referenced_image not in approved_current_image[device_id]

      | corroborate with out-of-band show bootvar

      | alert'
- question: Are boot-configuration commands being issued by a user at an abnormal frequency, outside the
    normal maintenance window, or preceded by failed logons and denied privileged-command attempts?
  context: 'Baseline the frequency and timing of boot commands per user and flag commands beyond 3 standard
    deviations or outside the normal maintenance window using change-point detection. Separately profile
    failed-logon counts and denied privileged-command attempts preceding a boot change as a distinct success/fail
    signal, since attackers frequently brute-force or escalate before reconfiguring boot. A boot command
    at an unusual hour from an account that just generated authentication failures is a strong downgrade
    indicator; routine boot changes during scheduled windows by expected admins are benign. Supports Defense
    Impairment by catching the reconfiguration step even when the image itself is not yet flagged. References:
    [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/);
    [Network Infrastructure Security Guide, NSA](https://media.defense.gov/2022/Jun/15/2003018261/-1/-1/0/CTR_NSA_NETWORK_INFRASTRUCTURE_SECURITY_GUIDE_20220615.PDF).'
  answer_sources:
  - Zeek syslog.log
  - Windows Event ID 4688
  - Windows Event ID 4648
  - 'NAI: Syslog servers, Network device command line interfaces (CLIs), Windows-based network management
    workstations, SIEM/Log aggregation platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per user: boot_cmd_freq, boot_cmd_hours\nfor cmd in boot_commands:\n  if freq > mean+3*std\
      \ OR hour outside maintenance_window: flag\ncorrelate failed_logons & denied_priv_cmds in [t-1h,\
      \ t]\n| apply changepoint on boot_cmd_timeseries\n| alert"
- question: Does the device's admin command-accounting session deviate from learned legitimate command
    sequences in a way that includes an unscheduled boot to an older image?
  context: 'Train an HMM or LSTM on legitimate admin command-accounting sessions (typical flow login->show->copy->config->reload)
    and alert when new sequences such as an unscheduled ''boot system old_image'' score low probability.
    Surface the specific anomalous log-key transition and parameter (image name, off-hours) for triage
    rather than a bare anomaly score (DeepLog-style). A low-probability sequence that culminates in pointing
    the device to an older image is a high-value downgrade indicator; sequences matching learned maintenance
    patterns are benign. This catches subtle, multi-step impairment workflows that single-event rules
    miss, directly serving the Defense Impairment information requirement. References: [DeepLog: Anomaly
    Detection and Diagnosis from System Logs, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - Zeek syslog.log
  - Windows Event ID 4688
  - Windows Event ID 4648
  - 'NAI: Syslog servers, Network device command line interfaces (CLIs), Windows-based network management
    workstations, SIEM/Log aggregation platform'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = DeepLog_LSTM(trained_on=legit_cmd_accounting_sessions)\nfor session in admin_sessions:\n\
      \  for step in session.logkeys:\n    if model.prob(step | history) < epsilon:\n      emit alert(anomalous_transition=step,\n\
      \                 params={image_name, time_of_day})"
- question: After a reboot, did any network device report an OS version that differs from and is chronologically
    OLDER than the version recorded in the authoritative CMDB/golden baseline?
  context: 'The clearest signature of a successful downgrade is a device coming up on an older version
    than the baseline records. Alert when the reported OS version differs from the CMDB and is chronologically
    older, enforcing per-model anti-rollback (monotonic version) against the authoritative golden baseline
    (NIST SP 800-193). Confirm the running image independently via ''verify /md5'' and ''show software
    authenticity'' rather than trusting ''show version'' alone, since compromised devices may falsify
    CLI output. An older-than-baseline version is a near-definitive downgrade indicator; an equal-or-newer
    approved version is benign. This is the realized-impact evidence for the Defense Impairment requirement
    — the weakened image is now running. References: [Platform Firmware Resiliency Guidelines (NIST SP
    800-193), Regenscheid](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf);
    [Cisco IOS Software Integrity Assurance, Cisco](https://sec.cloudapps.cisco.com/security/center/resources/integrity_assurance.html).'
  answer_sources:
  - Zeek syslog.log
  - 'NAI: Syslog servers, Configuration Management Database (CMDB), Network devices themselves via polling'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for device in devices_after_reboot:\n  reported = parse_version(syslog.os_version)\n  baseline\
      \ = CMDB.version[device]\n  if reported != baseline AND version_older(reported, baseline):\n   \
      \ verify_oob(verify /md5, show software authenticity)\n    alert(anti_rollback_violation)"
- question: Does the polled version time-series for any device show a decrease (rollback) relative to
    its last known-good monotone state?
  context: 'Track each device''s version as a monotone state and flag any decrease relative to the last
    known good state using change-point detection over the polled version time-series, tuning detection-delay
    versus false-alarm rate. Because legitimate upgrades only move versions forward, any observed decrease
    is anomalous by construction. A detected downward step in the version state strongly indicates a downgrade;
    stable or increasing versions are benign. This statistical, state-machine view complements the deterministic
    CMDB comparison and is resilient to gaps in change records, supporting the Defense Impairment hunt
    by catching rollbacks even when no boot command was captured. References: [A Survey of Methods for
    Time Series Change Point Detection, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek syslog.log
  - 'NAI: Syslog servers, Configuration Management Database (CMDB), Network devices themselves via polling'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per device: maintain monotone state = max(version_seen)

      poll version_timeseries

      | apply changepoint detection

      | if new_version < state: flag rollback(decrease)

      | tune detection_delay vs false_alarm_rate

      | alert'
- question: Does an LSTM-autoencoder over device telemetry flag an unexpected version change outside maintenance
    windows, and which features drive the anomaly?
  context: 'Use an LSTM-autoencoder over device telemetry (version delta, reboot count, transfer frequency,
    failed-login rate) to flag unexpected version changes outside maintenance windows, reporting the top-3
    contributing features per alert. The reconstruction error spikes when the joint behavior (e.g., a
    version drop coinciding with an off-hours reboot and a prior firmware transfer) departs from learned
    norms. A high reconstruction error driven by version delta plus off-window reboot/transfer features
    indicates a probable downgrade; errors driven by benign maintenance correlate with scheduled activity.
    Feature attribution keeps the alert explainable, helping the analyst confirm Defense Impairment versus
    routine change. References: [Explainable Anomaly Detection for Industrial Control System Cybersecurity,
    Hwang & Lee](https://arxiv.org/abs/2205.01930).'
  answer_sources:
  - Zeek syslog.log
  - 'NAI: Syslog servers, Configuration Management Database (CMDB), Network devices themselves via polling'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = LSTM_autoencoder(features=[version_delta, reboot_count,\n        transfer_freq, failed_login_rate])\n\
      for window in device_telemetry:\n  err = reconstruction_error(window)\n  if err > threshold AND\
      \ outside maintenance_window:\n    emit alert(top3=feature_attribution(window))"
- question: Was a file with a firmware extension (.bin, .img, .swi, .pkg) transferred to a device management
    IP from a non-approved source, or via a legacy unencrypted protocol (TFTP, FTP, SNMP-set) abused for
    image staging?
  context: 'Adversaries (e.g., the actors in CISA TA18-106A and the SYNful Knock implant) stage device
    images using legacy, unauthenticated transfer paths. Alert when firmware extensions transfer to device
    IPs from non-approved sources, and flag use of legacy unencrypted management/transfer protocols (TFTP,
    FTP, SNMP-set) abused for image staging. Restrict and monitor firmware-upload paths. A firmware-extension
    file arriving at a device IP from an unexpected host or over an unencrypted protocol is a strong precursor
    to a downgrade; transfers from approved management servers over approved protocols within windows
    are benign. Directly supports the Defense Impairment requirement by catching the staging step before
    the image is booted. References: [Alert TA18-106A: Russian State-Sponsored Cyber Actors Targeting
    Network Infrastructure Devices, CISA](https://www.cisa.gov/news-events/alerts/2018/04/16/russian-state-sponsored-cyber-actors-targeting-network-infrastructure);
    [Network Infrastructure Security Guide, NSA](https://media.defense.gov/2022/Jun/15/2003018261/-1/-1/0/CTR_NSA_NETWORK_INFRASTRUCTURE_SECURITY_GUIDE_20220615.PDF);
    [SYNful Knock: A Cisco Router Implant, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network traffic at aggregation points (e.g., core switch SPAN port), Network management subnet,
    Internet gateway'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "files where filename =~ /\\.(bin|img|swi|pkg)$/\n   AND rx_hosts in NETWORK_DEVICE_MGMT_IPS\n\
      | where tx_host not in APPROVED_SOURCES\n   OR conn.proto in {tftp, ftp, snmp_set}\n| alert(unauthorized_or_legacy_transfer)"
- question: Does a firmware transfer accumulate enough additive risk (external/non-admin source, off-window,
    atypical size/volume, legacy protocol, aborted/failed) and entropy characteristics to exceed the 98th-percentile
    alerting threshold?
  context: 'Score transfers by additive deviations (external or non-admin source, off-window timing, atypical
    size/volume, legacy protocol, aborted/failed transfer) and alert above the 98th percentile. Use Shannon
    entropy of the transferred blob to separate legitimate compressed/encrypted images from anomalous
    content. Derive thresholds from 30-90 days of maintenance history via change-point baselining. A transfer
    stacking several deviations with anomalous entropy is a likely image-staging event for a downgrade;
    a single mild deviation on an otherwise normal transfer is low risk. This weighted approach reduces
    false positives versus single-signal rules while still serving the Defense Impairment hunt. References:
    [A Large-Scale Analysis of the Security of Embedded Firmwares, Costin et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf);
    [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network traffic at aggregation points (e.g., core switch SPAN port), Network management subnet,
    Internet gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for xfer in firmware_transfers:\n  score = 0\n  score += w1 if external/non_admin_source\n\
      \  score += w2 if off_window\n  score += w3 if atypical_size_or_volume\n  score += w4 if legacy_protocol\n\
      \  score += w5 if aborted/failed\n  score += w6 if shannon_entropy(blob) anomalous\n  if score >\
      \ pctl98(baseline_30_90d): alert"
- question: Do clustering or Isolation-Forest models flag a firmware transfer event as an outlier on [source,
    protocol, size, time_of_day, success/fail], and which features drive it?
  context: 'Cluster or apply Isolation-Forest to transfer events on [source, protocol, size, time_of_day,
    success/fail] and flag noise/outliers for investigation, reporting the top-3 driving features. Deploy
    as a residual layer above deterministic allow-lists. Outliers that fall outside dense clusters of
    legitimate maintenance transfers — for example a rare source pushing an atypically sized image at
    an odd hour — warrant triage as possible downgrade staging; points inside normal clusters are benign.
    Feature attribution keeps decisions explainable. This catches novel staging patterns the allow-list
    and risk score may not yet encode, reinforcing the Defense Impairment information requirement. References:
    [A Survey of Intrusion Detection in Cyber-Physical Systems, Mitchell & Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network traffic at aggregation points (e.g., core switch SPAN port), Network management subnet,
    Internet gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = IsolationForest(features=[source, protocol, size,\n        time_of_day, success_fail])\n\
      model.fit(historical_transfers)\nfor xfer in firmware_transfers:\n  if model.is_outlier(xfer):\n\
      \    emit alert(top3=feature_attribution(xfer))\n# residual layer above allow-lists"
- question: For any single device, did a firmware transfer, a boot-configuration command, and a reboot/reload
    all occur within a short window (e.g., under 60 minutes), especially off-hours or from non-approved
    sources?
  context: 'This is the canonical downgrade chain documented for network-device image compromise (SYNful
    Knock). Alert when a firmware file transfer, a boot-configuration command, and a reboot/reload occur
    within 60 minutes for the same device, especially outside maintenance windows and from non-approved
    sources, correlating AAA command-accounting and centralized syslog. The tight temporal coupling of
    stage-reconfigure-reboot is far more specific than any single event. Observing the full chain on one
    device within the window is a high-confidence downgrade indicator; isolated events spread across normal
    maintenance are benign. This directly answers the Defense Impairment requirement by capturing the
    end-to-end downgrade workflow. References: [SYNful Knock: A Cisco Router Implant, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/);
    [Network Infrastructure Security Guide, NSA](https://media.defense.gov/2022/Jun/15/2003018261/-1/-1/0/CTR_NSA_NETWORK_INFRASTRUCTURE_SECURITY_GUIDE_20220615.PDF).'
  answer_sources:
  - Zeek files.log
  - Zeek syslog.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: SIEM/Log aggregation platform, Network management servers, Core network devices, Windows hosts
    used for network administration'
  range: Last 90 days; correlate events within a 60-minute sliding window per device
  queries:
  - technology: SIEM/Rule pseudocode
    query: "sequence by device_id within 60m:\n  A: firmware_transfer\n  B: boot_config_command\n  C:\
      \ reboot/reload syslog\nwhere (off_maintenance_window OR source not in APPROVED_SOURCES)\n| alert(downgrade_chain)"
- question: Is the frequency of the transfer->boot-config->reboot sequence for a device exceeding its
    expected rate (e.g., >1/quarter) or occurring outside scheduled maintenance, including failed/aborted
    attempts?
  context: 'Track the sequence frequency per device and alert on occurrences outside scheduled maintenance
    or exceeding thresholds (e.g., more than once per quarter), using change-point detection to flag step
    increases in image-change activity and profiling failed/aborted attempts as a distinct signal. Image
    changes are rare for stable infrastructure, so an unexpected rise — or any occurrence off-schedule
    — is suspicious. A step increase in downgrade-chain frequency or off-window occurrences indicates
    probable adversary activity; chains confined to planned maintenance at expected rates are benign.
    This statistical lens complements the deterministic correlation, supporting the Defense Impairment
    hunt over time. References: [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi
    & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek files.log
  - Zeek syslog.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: SIEM/Log aggregation platform, Network management servers, Core network devices, Windows hosts
    used for network administration'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per device: count downgrade_chain occurrences over time

      | alert if rate > 1/quarter OR outside maintenance_window

      | apply changepoint detection -> flag step increase

      | profile failed/aborted chain attempts separately'
- question: Does a user-host-device-image-bootconfig-reload provenance graph contain a subgraph that deviates
    from known-legitimate patterns, and which node is anomalous?
  context: 'Build user-host-device-image-bootconfig-reload provenance graphs and use node-level GraphSAGE
    scoring to flag subgraphs deviating from known legitimate patterns, localizing the specific anomalous
    node (e.g., a rare admin host transferring an old image and altering the boot variable) for explainable
    triage (ThreaTrace-style). The graph captures relationships single-event rules miss, such as an unusual
    actor linking a transfer to a boot change and reload. A low-scoring node embedded in an otherwise-normal
    admin graph pinpoints the suspect actor/asset for the downgrade; subgraphs matching learned legitimate
    maintenance are benign. Node attribution makes the alert actionable, directly serving the Defense
    Impairment information requirement. References: [ThreaTrace: Detecting and Tracing Host-based Threats
    via Provenance Graph Learning, Wang et al.](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Zeek files.log
  - Zeek syslog.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: SIEM/Log aggregation platform, Network management servers, Core network devices, Windows hosts
    used for network administration'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "graph = build_provenance(user-host-device-image-bootconfig-reload)\nmodel = GraphSAGE(trained_on=legit_admin_graphs)\n\
      for node in graph:\n  if model.score(node) < threshold:\n    emit alert(anomalous_node=node,\n \
      \              context=neighbors(node))"
