questions:
- question: '[Impact] Threat intel proxy and interception-fingerprint matching: Can you determine whether
    a network connection from a critical internal asset to an external destination, proxy, or anonymizer
    is inconsistent with that asset''s expected communications and aligns with a malicious intermediary
    or manipulation path. -- specifically, using the ''Threat intel proxy and interception-fingerprint
    matching'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary alters data in transit --
    inserting a malicious intermediary, intercepting/downgrading TLS, injecting into a transmitting process,
    or redirecting local-segment traffic -- to corrupt the integrity of transmitted data and influence
    downstream processes or conceal other activity. This evidence focuses on the condition that a network
    connection from a critical internal asset to an external destination, proxy, or anonymizer is inconsistent
    with that asset''s expected communications and aligns with a malicious intermediary or manipulation
    path. This Symbolic Logic approach works as follows: Match destination IPs, domains, and TLS JA3/JA3S
    (https://github.com/salesforce/ja3) or version-resilient JA4/JA4S (https://github.com/FoxIO-LLC/ja4)
    fingerprints against threat-intel feeds for proxies, anonymizers, and known interception/MitM stacks
    (e.g., mitmproxy, sslsplit), then alert when a critical asset uses an unapproved intermediary or presents
    a fingerprint outside its per-role allow-list. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable manipulation or interception of data in transit; pivot to the
    responsible host/process and its lineage, the source-destination pair and the path between them, the
    TLS/certificate or ARP/IP-MAC context, the affected transfer or service, and any integrity errors
    or downstream impact. A negative result helps rule out this particular manipulation vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    encrypted, or living-off-the-land tampering.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Internet gateway, Core network switches monitoring traffic from critical assets, DNS servers,
    DMZ firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Threat intel proxy and interception-fingerprint matching (Symbolic Logic)

      source IN [Zeek conn.log, Zeek dns.log, Zeek ssl.log, Zeek x509.log]

      # approach: Match destination IPs, domains, and TLS JA3/JA3S (https://github.com/salesforce/ja3)
      or version-resilient JA4/JA4S (https://github.com/FoxIO-LLC/ja4) fingerprints against threat-intel
      feeds for proxies, anonymizers, and known interception/MitM stacks (e.g., mitmproxy, sslsplit),
      then alert when a critical asset uses an unapproved intermediary or presents a fingerprint outside
      its per-role allow-list.

      correlate over NAI: Internet gateway, Core network switches monitoring traffic from critical assets,
      DNS servers, DMZ firewalls

      emit alert with contributing fields and entity context'
- question: '[Impact] Low-frequency destination and byte-ratio scoring: Can you determine whether a network
    connection from a critical internal asset to an external destination, proxy, or anonymizer is inconsistent
    with that asset''s expected communications and aligns with a malicious intermediary or manipulation
    path. -- specifically, using the ''Low-frequency destination and byte-ratio scoring'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary alters data in transit --
    inserting a malicious intermediary, intercepting/downgrading TLS, injecting into a transmitting process,
    or redirecting local-segment traffic -- to corrupt the integrity of transmitted data and influence
    downstream processes or conceal other activity. This evidence focuses on the condition that a network
    connection from a critical internal asset to an external destination, proxy, or anonymizer is inconsistent
    with that asset''s expected communications and aligns with a malicious intermediary or manipulation
    path. This Statistical Method approach works as follows: Baseline per-asset destination rarity, upload/download
    byte ratio (Volume), and connections/min (Frequency) using flow time-related features (Draper-Gil
    et al. (https://www.scitepress.org/Papers/2016/57407/57407.pdf)), then alert when a critical asset
    connects to a destination in the bottom 1st percentile of observed frequency, when the byte ratio
    deviates >3σ from baseline, or when a rare source->destination edge appears (rarity scoring per Hopper,
    Ho et al. (https://www.usenix.org/system/files/sec21-ho.pdf)). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable manipulation or interception of data in
    transit; pivot to the responsible host/process and its lineage, the source-destination pair and the
    path between them, the TLS/certificate or ARP/IP-MAC context, the affected transfer or service, and
    any integrity errors or downstream impact. A negative result helps rule out this particular manipulation
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, encrypted, or living-off-the-land tampering.'
