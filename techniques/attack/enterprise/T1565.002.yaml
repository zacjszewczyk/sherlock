name: 'T1565.002: Transmitted Data Manipulation'
id: a24f39ec-1cc1-4ec2-951d-07827a1df751
description: 'This playbook helps an analyst investigate whether an adversary has manipulated data while
  it is in transit -- altering payloads en route to storage or other systems to affect business processes,
  skew organizational understanding and decision-making, or hide other malicious activity, thereby threatening
  the integrity of the data (MITRE ATT&CK T1565.002, Transmitted Data Manipulation under the Impact tactic).
  In-transit tampering typically requires a malicious intermediary or an interception point: an unapproved
  proxy/anonymizer or man-in-the-middle (MitM) stack on the path, an SSL/TLS interception or downgrade
  that breaks the expected trust chain, process/memory injection into an application that handles network
  I/O before it transmits, or local-segment redirection via ARP/IP-MAC manipulation or an inserted relay.
  The playbook guides the analyst across several behavioral angles: outbound connections from critical
  assets to rare or threat-intel-flagged destinations and interception fingerprints (JA3/JA3S, JA4/JA4S);
  SSL/TLS sessions to internal services presenting unexpected issuers, self-signed certs, or MitM handshake
  profiles; non-allowlisted process injection (remote thread creation, WriteProcessMemory) into critical
  applications immediately before they transmit; recurring internal transfers whose size, directionality,
  content type, entropy, or origin-vs-destination hash deviates from the established baseline; spikes
  in application-level integrity errors (checksum, transaction rollback, hash-validation failures) during
  or after a transfer; and local-segment ARP/NDP redirection that creates an interception path. Detection
  methods combine symbolic-logic rules, statistical baselining/rarity scoring, and machine-learning anomaly
  models applied to Zeek conn/dns/ssl/x509/http/files/weird logs, Windows Security and Sysmon events,
  auditd syscalls, and host syslog, so the analyst can corroborate suspected in-transit manipulation against
  destination reputation, TLS trust, process behavior, transfer volume/structure, integrity errors, and
  link-layer redirection.'
