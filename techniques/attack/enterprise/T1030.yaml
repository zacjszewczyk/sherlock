name: 'T1030: Data Transfer Size Limits'
id: de374b8c-4c9d-4c3e-91dc-96c8dbb82fc0
description: 'Investigate possible use of Data Transfer Size Limits (T1030), in which an adversary exfiltrates
  data in fixed-size chunks or caps packet/transfer sizes below known thresholds to evade volume-based
  data-loss and network alerting. This playbook helps an analyst hunt for: outbound connections to known-malicious
  C2/exfiltration endpoints from threat intelligence; traffic carrying signatures of known exfil tools
  (anomalous HTTP headers, DNS TXT/NULL tunneling, fixed inter-packet delays); flows with abnormally low
  packet-size variance indicating programmatic uniform chunking; periodic beacon-like connections from
  a single host that each move a near-identical data volume; and outbound uploads originating from processes
  that do not normally communicate over the network. It combines symbolic-logic detections, statistical
  baselining (modified Z-score, entropy/heavy-hitter, autocorrelation), and machine-learning models (reputation
  scoring, time-series forecasting, one-class/Isolation-Forest anomaly detection) across Zeek network
  logs, full packet capture, and Windows endpoint telemetry to surface low-and-slow chunked exfiltration.'
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
