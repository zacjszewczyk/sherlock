questions:
- question: 'Using deterministic rule logic, can you confirm whether ''Authorized-keys write with allow-listed
    writers'' indicates malicious SSH authorized_keys abuse in support of Persistence? Specifically: Alert
    on auditd/FIM `write` events to `~/.ssh/authorized_keys`, `authorized_keys2`, `/root/.ssh/authorized_keys`,
    and ESXi `/etc/ssh/keys-*/authorized_keys` when the modifying process executable is NOT on a maintained
    allow-list of benign writers (sshd, sshd-session, openssh tooling, ansible/puppet/chef-client, cloud
    guest agents, package managers); model the allow-list on the exclusion set used by Elastic''s cross-platform
    rule (git, maven, vim, touch, puppet, chef-client, docker, Google Guest Agent, JumpCloud Agent) [SSH
    Authorized Keys File Activity, Elastic Detection Rules](https://detection.fyi/elastic/detection-rules/cross-platform/persistence_ssh_authorized_keys_modification/).
    Correlate each write with subsequent Zeek ssh.log public-key authentications and per NIST IR 7966
    record/baseline every authorized key fingerprint, restricting source addresses with the `from=` option
    so off-baseline logons stand out [NIST IR 7966](https://nvlpubs.nist.gov/nistpubs/ir/2015/NIST.IR.7966.pdf).'
  context: 'Tactic context (Persistence / TA0003; information requirement: Is the adversary maintaining
    persistence by modifying SSH authorized_keys?). Evidence under investigation: Unauthorized SSH persistence
    is visible when a user or process modifies `authorized_keys` (or `authorized_keys2`) and then the
    same account begins authenticating successfully with the new key from an unfamiliar source. The evidence
    combines file-write/audit events on the key file with later SSH public-key logons, showing the attacker
    installed long-term access rather than merely using an existing session. Approach (Authorized-keys
    write with allow-listed writers - Symbolic Logic): Alert on auditd/FIM `write` events to `~/.ssh/authorized_keys`,
    `authorized_keys2`, `/root/.ssh/authorized_keys`, and ESXi `/etc/ssh/keys-*/authorized_keys` when
    the modifying process executable is NOT on a maintained allow-list of benign writers (sshd, sshd-session,
    openssh tooling, ansible/puppet/chef-client, cloud guest agents, package managers); model the allow-list
    on the exclusion set used by Elastic''s cross-platform rule (git, maven, vim, touch, puppet, chef-client,
    docker, Google Guest Agent, JumpCloud Agent) [SSH Authorized Keys File Activity, Elastic Detection
    Rules](https://detection.fyi/elastic/detection-rules/cross-platform/persistence_ssh_authorized_keys_modification/).
    Correlate each write with subsequent Zeek ssh.log public-key authentications and per NIST IR 7966
    record/baseline every authorized key fingerprint, restricting source addresses with the `from=` option
    so off-baseline logons stand out [NIST IR 7966](https://nvlpubs.nist.gov/nistpubs/ir/2015/NIST.IR.7966.pdf).
    A positive result indicates an adversary-supplied SSH key or sshd_config change was installed and/or
    abused for durable, possibly privileged, access rather than benign administration; a negative result
    aligns the activity with approved writers, known (user, key) pairs, and baselined sources. Investigate
    the named area of interest (SSH bastion hosts, Critical Linux/macOS servers, Internet gateways, VPN
    concentrators, Centralized log repositories) and pivot from any hit to the modifying process and its
    ancestry, the account and key fingerprint involved, the source host/ASN, and any follow-on SSH logon,
    lateral movement, or privilege change.'
