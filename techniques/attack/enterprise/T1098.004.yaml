- question: 'Using statistical baselining, can you determine whether ''Write volume, frequency and entropy
    outliers'' reveals anomalous SSH key/login behavior tied to Persistence? Specifically: Capture Volume
    (bytes appended to authorized_keys; a normal ed25519/RSA entry is ~80-750 bytes—flag writes adding
    many keys at once or >2KB) and Frequency (key-file writes per host per hour). Compute Shannon entropy
    of the command string and alert above the 95th percentile of historical modifications to catch base64/obfuscated
    keys. Establish per-host baselines and treat first-ever or bottom-1st-percentile writers as outliers.'
