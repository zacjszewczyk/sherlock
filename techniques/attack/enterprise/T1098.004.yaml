- question: 'Using statistical baselining, can you determine whether ''Key-change source rarity and failure
    profile'' reveals anomalous SSH key/login behavior tied to Persistence? Specifically: For each SSH
    account build a 90-day baseline of authorized_keys modification frequency (writes/week), source country/ASN,
    and login hour. Treat the FIRST successful public-key login from a new (source-ASN, account) pair
    that follows a recent key change as a new-edge anomaly using the Bayesian first-time-connection statistic
    of [Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf)
    and the structural-login scoring of [Siadati and Memon](https://doi.org/10.1145/3133956.3134003).
    Raise priority (State/failure signal) when the same source also generated failed SSH auth attempts
    (auth_success=F in ssh.log) within the prior 24h, or when the write-to-login gap is < 15 minutes.'
