name: 'T1098.004: SSH Authorized Keys'
id: f2a38830-3b1b-46a9-a628-2c7322ba0c24
description: 'This playbook helps an analyst investigate adversary abuse of SSH authorized_keys (T1098.004)
  to maintain persistence and escalate privileges across Linux, macOS, ESXi hypervisors, network devices,
  and IaaS cloud instances. Adversaries add their own public keys to a user''s ~/.ssh/authorized_keys
  (or ESXi /etc/ssh/keys-<user>/authorized_keys), flip sshd_config directives such as PermitRootLogin/PasswordAuthentication/PubkeyAuthentication
  to yes, or push keys through cloud metadata APIs and CLIs (AWS SendSSHPublicKey/ModifyInstanceAttribute,
  GCP compute.instances.setMetadata, Azure VM PATCH) and network-device commands (ip ssh pubkey-chain)
  so that a held private key grants durable, often privileged, remote access. The playbook correlates
  file-write/FIM and process-creation telemetry on key files and sshd_config with subsequent public-key
  SSH logons, cloud audit trails, and network-device CLI history. Investigative angles include: allow-listing
  the processes/parents permitted to write authorized_keys; command-line redirection patterns by web/service
  accounts (echo|cat|printf|curl|wget|tee|base64 >> authorized_keys); first-seen (user, key-fingerprint)
  tracking; tight per-account source/ASN/country baselines and failed-logon profiling; sshd_config-change-to-root-login
  correlation; and cloud key-injection-to-login correlation. Detection blends symbolic-logic rules, statistical
  baselining (volume/frequency/entropy outliers, new-edge and change-point analysis), and machine learning
  (provenance graph autoencoders, GraphSAGE/GNN node scoring, One-Class SVM/Isolation Forest, XGBoost
  with SHAP attribution, and sequence models) to produce explainable, evasion-resistant alerts spanning
  the Persistence and Privilege Escalation tactics.'
type: technique
