name: 'T1589.001: Credentials'
id: 8202e0e4-58f4-40a7-9986-32c14f863842
description: 'This playbook helps an analyst investigate whether an adversary is gathering credentials
  associated with the organization to support targeting and future intrusion (MITRE ATT&CK T1589.001,
  Gather Victim Identity Information: Credentials, under the Reconnaissance tactic, TA0043). Credential
  gathering at the reconnaissance stage is largely external and difficult to observe directly, so this
  hunt focuses on the observable network and authentication edges where it surfaces: inbound credential-phishing
  email and web traffic carrying known-bad URLs/domains/IPs/hashes or lookalike/typosquatted/homoglyph
  sender and harvesting domains; bulk phishing campaigns delivered to many recipients in a compressed
  window; password-spraying and username-enumeration activity against external-facing authentication services
  (ADFS, VPN, OWA, web/API login endpoints, Active Directory domain controllers); and exposure of organizational
  usernames, emails, or password hashes in breach dumps, infostealer logs, dark-web markets, or public
  code repositories, optionally corroborated by anomalous post-leak authentication. Detection methods
  span deterministic symbolic-logic rules (threat-intel matching, edit-distance typosquat detection, multi-account
  failure thresholds, lockout/success-after-failure state, invalid-username failure thresholds, web-auth
  failure-mode profiling, breach-corpus watchlists, and privacy-preserving set-intersection matching),
  statistical baselining (host-string entropy and domain-age scoring, rare-destination click-reputation,
  recipient velocity and recipient-set deviation, low success-to-failure ratio, invalid/bad-password ratio,
  and post-leak logon anomaly rate), and machine learning (logistic regression on URL lexicon, Siamese-CNN
  homoglyph detection, LLM phishing classification with rationale, DBSCAN/Seasonal-Hybrid-ESD clustering,
  random forest with Directed Anomaly Scoring, Prophet forecasting of failed-auth volumes, low-and-slow
  spray clustering, and gradient-boosting session classification), applied across Zeek smtp/http/dns/files/conn
  logs, Windows authentication events (4624, 4625, 4740), and threat-intelligence breach/stealer-log feeds,
  so the analyst can corroborate suspected credential gathering across email, web, DNS, and authentication
  telemetry.'
type: technique
