questions:
- question: '[Reconnaissance] Match phishing URLs to TI: Can you determine whether evidence of credential
    phishing is observed when an inbound email or web traffic contains an indicator of compromise (IOC),
    such as a URL, IP address, domain, or file hash, that is present on a high-confidence threat intelligence
    feed specifically tracking credential harvesting campaigns. -- specifically, using the ''Match phishing
    URLs to TI'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers account credentials
    associated with the organization -- via phishing, lookalike domains, password spraying, username enumeration,
    or harvesting from breach dumps, infostealer logs, dark-web markets, and code repositories -- to enable
    later phishing, account compromise, and initial access (Valid Accounts, External Remote Services).
    This evidence focuses on the condition that evidence of credential phishing is observed when an inbound
    email or web traffic contains an indicator of compromise (IOC), such as a URL, IP address, domain,
    or file hash, that is present on a high-confidence threat intelligence feed specifically tracking
    credential harvesting campaigns. This Symbolic Logic approach works as follows: Alert when Zeek smtp.log/http.log/dns.log/files.log
    URLs, domains, IPs, or file hashes match a high-confidence credential-harvesting threat-intel feed
    (deterministic floor). Derive feed-specific allowlists for partner/marketing domains to suppress FPs.
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    credential-gathering activity; pivot to the involved sender/source IP, ASN, and domain, the targeted
    users and authentication endpoints, the destination/harvesting infrastructure, and any subsequent
    successful authentication, and treat confirmed exposures as candidates for forced password resets
    and MFA enforcement. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, distributed,
    or out-of-band credential gathering that occurs largely outside the organization''s visibility.'
  answer_sources:
  - Zeek smtp.log
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Email Gateway, Web Proxy, Network Egress Points, DNS Resolvers'
  range: Last 90 days (correlate event-centered windows around the activity)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match phishing URLs to TI (Symbolic Logic)

      source IN [Zeek smtp.log, Zeek http.log, Zeek files.log, Zeek dns.log]

      | approach: Alert when Zeek smtp.log/http.log/dns.log/files.log URLs, domains, IPs, or file hashes
      match a high-confidence credential-harvesting threat-intel feed (deterministic floor). Derive feed-specific
      allowlists for partner/marketing domains to suppress FPs.

      | correlate over NAI: Email Gateway, Web Proxy, Network Egress Points, DNS Resolvers

      | emit alert with contributing fields and entity context (source IP, ASN, sender/harvesting domain,
      targeted users, endpoint, success/failure)'
  - technology: Zeek/pseudocode
    query: '# Match phishing URLs to TI (Zeek view)

      watch smtp.log/http.log/dns.log/files.log/conn.log for credential-gathering indicators

      | match URLs/domains/IPs/hashes, sender alignment, or per-source auth-failure patterns

      | evaluate recipient counts, failure ratios, destination rarity, and domain age/entropy

      | emit candidates with source, dest, targeted users, and volume/timing'
- question: '[Reconnaissance] Lookalike/typosquat domain match: Can you determine whether evidence of
    credential phishing is observed when an inbound email or web traffic contains an indicator of compromise
    (IOC), such as a URL, IP address, domain, or file hash, that is present on a high-confidence threat
    intelligence feed specifically tracking credential harvesting campaigns. -- specifically, using the
    ''Lookalike/typosquat domain match'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers account credentials
    associated with the organization -- via phishing, lookalike domains, password spraying, username enumeration,
    or harvesting from breach dumps, infostealer logs, dark-web markets, and code repositories -- to enable
    later phishing, account compromise, and initial access (Valid Accounts, External Remote Services).
    This evidence focuses on the condition that evidence of credential phishing is observed when an inbound
    email or web traffic contains an indicator of compromise (IOC), such as a URL, IP address, domain,
    or file hash, that is present on a high-confidence threat intelligence feed specifically tracking
    credential harvesting campaigns. This Symbolic Logic approach works as follows: Flag inbound sender
    or harvesting domains within 1-2 Damerau-Levenshtein edits of protected brand/partner domains and
    check email-auth alignment (display-name vs From mismatch), per [The Landscape of Domain Name Typosquatting,
    Spaulding et al](https://arxiv.org/abs/1603.02767) and [Detecting Credential Spearphishing Attacks,
    Ho et al](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    credential-gathering activity; pivot to the involved sender/source IP, ASN, and domain, the targeted
    users and authentication endpoints, the destination/harvesting infrastructure, and any subsequent
    successful authentication, and treat confirmed exposures as candidates for forced password resets
    and MFA enforcement. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, distributed,
    or out-of-band credential gathering that occurs largely outside the organization''s visibility.'
