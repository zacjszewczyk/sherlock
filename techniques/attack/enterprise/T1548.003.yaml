name: 'T1548.003: Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
id: 8b780134-e320-4903-947d-b797a9f197d9
description: 'Investigate suspected abuse of sudo and sudo caching (T1548.003), in which an adversary
  on a Linux or macOS host escalates privileges by abusing the sudo binary, the credential cache, or the
  /etc/sudoers configuration to run commands as root or another user. This playbook helps an analyst hunt
  for: sudo executions from anomalous or non-interactive parents (web/daemon processes, automation wrappers)
  or matching malicious binary hashes; sudo command lines indicative of LOLBin abuse, shared-object injection
  (LD_PRELOAD), or known CVE exploitation (Baron Samedit, CVE-2021-3156); sudo run by users or with commands
  that are statistically rare for their baseline (newly acquired credentials); rapid non-interactive sudo
  executions that abuse the credential cache within the timestamp_timeout window (especially when tty_tickets
  is disabled); and modifications to /etc/sudoers or /etc/sudoers.d/* that disable logging (!authenticate,
  !syslog, logfile=/dev/null) or relax controls (NOPASSWD, Defaults !tty_tickets). It also covers sudo-run
  defense-evasion (stopping auditd/EDR, clearing logs/history) and obfuscated or Base64-encoded arguments.
  Each evidence item pairs deterministic symbolic-logic rules with statistical baselining (frequency,
  entropy, change-rate, risk scoring, time-series forecasting) and machine-learning approaches (classifiers,
  clustering, HMM/seq2seq sequence models, graph anomaly, One-Class SVM) across endpoint telemetry (auditd
  execve, Sysmon for Linux EID 1, sudo/auth logs, FIM) and network logs (Zeek conn/ssh/command/notice).'
type: technique
related:
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Is any sudo or sudoedit execution running a binary whose SHA256 matches a known-malicious
    threat-intel hash, or resolving to euid=0 while its parent is a non-interactive service daemon (nginx,
    apache2, php-fpm, node) that should never invoke privilege elevation?
  context: 'Privilege Escalation via sudo often begins with a tampered/trojanized sudo binary or with
    a compromised web/app daemon spawning sudo to obtain root. Monitor process-creation logs (auditd execve,
    Sysmon-for-Linux EID 1) for sudo/sudoedit, compute the SHA256 of the executed image and match it against
    a threat-intel hash feed, alerting critical on a match while preserving user, host, euid, parent,
    and full command. Independently alert when a sudo execve resolves to euid=0 while the parent is a
    non-interactive service. A hash match is a high-confidence compromise indicator; a daemon-parented
    root sudo strongly suggests a web shell or exploited service driving escalation. Negative results
    across hosts build assurance that sudo is invoked only from legitimate interactive contexts. References:
    [Falco default ruleset](https://github.com/falcosecurity/rules), [MITRE T1548.003](https://attack.mitre.org/techniques/T1548/003/).'
  answer_sources: &id001
  - Process Creation Logs (e.g., Auditd type=execve, Sysmon for Linux Event ID 1)
  - Sudo Logs (/var/log/auth.log or equivalent)
  - Zeek conn.log
  - 'NAI: Critical Linux/macOS servers (e.g., web, database, authentication), Developer and administrator
    workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Malicious-hash and daemon-parented root sudo

      src = process_creation where image_name in ("sudo","sudoedit")

      alert CRITICAL if sha256(image) in threat_intel_hash_feed

      alert CRITICAL if euid==0 and parent_name in (nginx,apache2,httpd,php-fpm,node)

      keep user, host, euid, parent_name, full_command'
- question: Which parent processes spawn sudo only rarely or for the very first time on a given host,
    and do any normally-quiet parents show a spike in failed-versus-successful sudo authentications?
  context: 'Legitimate sudo is spawned by a small, stable set of parents (interactive shells, cron, known
    tooling). Build a 30-day per-host baseline of parents that spawn sudo, tracking volume (count of sudo
    execs per parent) and frequency (sudo execs/min per parent). Alert when a parent is new or in the
    bottom 5th percentile of frequency, weighting web/daemon parents highest. Separately join with auth
    logs to score failed-vs-successful sudo auth ratios per parent; a spike in failures from a normally-quiet
    parent is a distinct probing/abuse signal. Derive percentile cutoffs per host class (workstation vs.
    server) so server baselines are not skewed by interactive workstation behavior. A rare or never-seen
    parent invoking sudo is a strong Privilege Escalation lead. References: [ProblemChild, Elastic](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources: *id001
  range: Last 90 days (30-day baseline window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Rare-parent baseline of sudo spawns\nbaseline = process_creation where image=\"sudo\" |\
      \ last 30d\n  | stats count, rate=count/min by host, parent_name, host_class\nalert if parent_name\
      \ new OR rate < p5(rate by host_class)\n  weight web/daemon parents highest\njoin auth.log: score\
      \ fail/success ratio per parent; alert on fail spike"
- question: When a gradient-boosted or logistic classifier scores live sudo events using parent process,
    user/auid, TTY presence, command, interactive-vs-cache flag, and parent network state, which executions
    are flagged as malicious and what are the top contributing features?
  context: 'Rules and simple baselines miss novel combinations; a supervised classifier learns the joint
    structure of benign vs. malicious sudo. Train a gradient-boosted/logistic model on labeled historical
    sudo events using parent process, user/auid, TTY presence, command, interactive-vs-cache flag, and
    parent network-connection state. Score new events in real time and emit the top-3 contributing features
    (e.g., parent=nginx, no-TTY, rare-command) in the alert text so an analyst can triage quickly. A high
    score with daemon-parent and no-TTY features indicates automated escalation; explainable features
    let the analyst confirm or dismiss. Periodically retrain to track environment drift and avoid stale
    baselines. References: [ProblemChild, Elastic](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources: *id001
  range: Last 90 days (retrain on rolling labeled history)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Supervised sudo classifier with explainability

      features = {parent, user/auid, has_tty, command, cache_flag, parent_net_state}

      model = gbm_or_logistic.fit(labeled_history)

      score = model.predict_proba(new_sudo_event)

      alert if score > threshold; emit top3 SHAP features'
- question: Are any sudo command lines invoking LOLBin shell-escape patterns (find -exec, awk/perl/python
    -c, vim/less shell escapes, tar/zip checkpoint) or shared-object injection via LD_PRELOAD / LD_LIBRARY_PATH?
  context: 'Adversaries use sudo to launch interpreters or utilities that can spawn a sub-shell or load
    attacker code, escalating to root without a dedicated exploit. Run SIEM regex over sudo command lines
    targeting LOLBin abuse and shared-object injection, e.g. sudo (nmap|find|awk|gawk|perl|python|vim|less|tar|zip)
    with -c/--interactive/-exec/BEGIN{system( and sudo .*LD_(PRELOAD|LIBRARY_PATH)=. Alert critical on
    match with the full command preserved. A match means a privileged process was used to break out to
    a root shell or inject a library; benign admin use of these tools rarely combines the binary with
    the shell-escape flags, so false positives are tunable by argument context. Catalog hits against the
    technique reference and detection rulesets below. References: [MITRE T1548.003](https://attack.mitre.org/techniques/T1548/003/),
    [Falco default ruleset](https://github.com/falcosecurity/rules).'
  answer_sources: &id002
  - Process Creation Logs with command-line arguments (e.g., Auditd, Sysmon for Linux Event ID 1)
  - Sudo Logs (/var/log/auth.log or equivalent with `log_input`/`log_output` enabled in sudoers)
  - 'NAI: All Linux/macOS endpoints and servers with `sudo` installed'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Sudo LOLBin and LD_PRELOAD injection

      src = process_creation where image="sudo"

      alert CRITICAL if command =~ /sudo (nmap|find|awk|gawk|perl|python[0-9.]*|vim|less|tar|zip) .*(-c|--interactive|-exec|BEGIN
      ?\{system\()/

      alert CRITICAL if command =~ /sudo .*LD_(PRELOAD|LIBRARY_PATH)=/

      preserve full_command'
- question: Are there sudoedit -s invocations whose final argument ends in an odd number of backslashes
    (the CVE-2021-3156 Baron Samedit heap-overflow trigger), or sudo crashes/malloc aborts, on hosts running
    a vulnerable sudo version?
  context: 'Baron Samedit (CVE-2021-3156) is a heap-based buffer overflow giving any local user root,
    independent of sudoers policy. Deterministically flag exploitation by alerting on sudoedit -s invocations
    whose final argument ends in an odd-count backslash (the exact trigger) and on sudo crashes or malloc
    aborts in auth logs. Correlate with the installed sudo version (vulnerable: 1.8.2-1.8.31p2 and 1.9.0-1.9.5p1)
    to set severity higher on unpatched hosts. A matching command line on a vulnerable host is near-certain
    exploitation; a crash signature alone still warrants investigation. This is a precise, low-false-positive
    Privilege Escalation detector for a widely weaponized CVE. References: [Qualys Baron Samedit CVE-2021-3156](https://blog.qualys.com/vulnerabilities-threat-research/2021/01/26/cve-2021-3156-heap-based-buffer-overflow-in-sudo-baron-samedit).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Baron Samedit CVE-2021-3156 trigger

      src = process_creation where image in (sudo,sudoedit)

      alert if command =~ /sudoedit -s .*\\(\\\\)*$/   // arg ends in odd backslash count

      alert if auth.log =~ /sudo.*(malloc|free).*abort|segfault/

      raise severity if sudo_version in [1.8.2-1.8.31p2,1.9.0-1.9.5p1]'
- question: Does the Shannon entropy of any sudo command line exceed three standard deviations above the
    per-user or per-command baseline, signaling obfuscated or encoded payloads, even for short randomized
    strings?
  context: 'Obfuscation (Base64, hex, char substitution) raises the randomness of a command line above
    normal admin syntax. Compute Shannon entropy of each full sudo command line and maintain per-user
    and per-command baselines. Alert when entropy exceeds 3 standard deviations above the relevant mean.
    Because short randomized payloads may not move whole-string entropy much, also track volume (length
    in bytes) and a non-printable/base64-character ratio so short obfuscated payloads are not missed.
    Derive thresholds per dataset. A high-entropy sudo command often hides a downloaded stager or encoded
    script run as root; pairing entropy with the base64 ratio reduces false positives from legitimately
    long-but-structured commands. References: [Elastic high command-line entropy analytic](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).'
  answer_sources: *id002
  range: Last 90 days (rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Command-line entropy outlier

      for each sudo event: H = shannon_entropy(command)

      base = per_user/per_command mean,std of H over 90d

      alert if H > mean + 3*std

      also alert if base64_ratio(command) high or length >> baseline'
- question: When sudo command lines are vectorized and clustered with DBSCAN, which executions fall outside
    dense clusters of legitimate repetitive admin commands and are flagged as noise/anomalies?
  context: 'Routine admin sudo commands repeat and form dense clusters; novel or obfuscated commands appear
    as sparse noise. Vectorize sudo command lines (TF-IDF or transformer/BERT embeddings) and cluster
    with DBSCAN so repetitive legitimate commands form dense clusters; flag noise points as anomalies,
    surfacing the nearest legitimate cluster and the distinguishing tokens for explainability. Embedding-based
    novelty and obfuscation scoring extends coverage beyond regex, catching LOLBin or encoded variants
    that signature rules miss. A noise-point sudo command warrants triage; the nearest-cluster context
    tells the analyst what normal it deviates from. Useful as a second layer behind the deterministic
    LOLBin regex. References: [CrowdStrike BERT command-line embeddings](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/),
    [Command-line Obfuscation Detection with Small Language Models, Tran et al.](https://arxiv.org/html/2408.02637v1).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '// DBSCAN clustering of sudo command lines

      vec = tfidf_or_bert_embed(sudo.command)

      clusters = DBSCAN(eps,min_samples).fit(vec)

      alert on noise points (label == -1)

      report nearest_cluster + distinguishing_tokens'
- question: Did any successful sudo execution come from a user or group that is NOT present in the parsed
    /etc/sudoers and /etc/sudoers.d/* allow-list, and are there repeated failed sudo authentications by
    non-allow-listed users?
  context: 'If a principal not authorized in sudoers successfully runs sudo, the policy was bypassed or
    credentials/UIDs were manipulated. Parse /etc/sudoers and /etc/sudoers.d/* into an explicit allow-list
    of authorized users/groups. Alert high on any successful sudo (auditd auid) by a principal absent
    from the list. Separately count failed sudo authentications per user from auth.log; repeated failures
    by non-allow-listed users indicate probing or credential testing. A successful out-of-policy sudo
    is a strong escalation signal possibly tied to newly acquired credentials; a cluster of failures hints
    at brute-force or credential-stuffing precursors. Re-parse sudoers on change so the allow-list stays
    current. References: [sudoers manual](https://www.sudo.ws/docs/man/sudoers.man/), [MITRE T1548.003](https://attack.mitre.org/techniques/T1548/003/).'
  answer_sources: &id003
  - Process Creation Logs (e.g., Auditd type=execve, Sysmon for Linux Event ID 1)
  - Authentication Logs (/var/log/secure, /var/log/auth.log)
  - Zeek ssh.log
  - 'NAI: Authentication servers, Identity and Access Management systems, All Linux/macOS endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Allow-list from sudoers vs. observed sudo principals

      allow = parse(/etc/sudoers, /etc/sudoers.d/*) -> {users,groups}

      alert HIGH if sudo success (auditd auid) and principal not in allow

      count failed sudo auth per user from auth.log

      alert if repeated failures by non-allow-listed user'
- question: Is an authorized user running a sudo command that is in the bottom 5% of their 90-day command
    history or has never been seen for them, especially from a new host or with an unusual TTY/success-fail
    pattern?
  context: 'Compromised but authorized accounts reveal themselves through commands that deviate from the
    owner''s habits. For each authorized user build a 90-day command frequency distribution (volume per
    command). Alert when a user runs a command in the bottom 5% of their history or never seen before.
    Add a state dimension: track that user''s sudo success/fail ratio and TTY/host diversity so a never-before
    user+command from a new host scores higher. Derive cutoffs per user role so power-users are not over-alerted.
    A rare command from an otherwise-normal user can indicate lateral movement using stolen credentials;
    the host/TTY context separates routine novelty from suspicious novelty.'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Per-user rare sudo command profile

      hist = per_user sudo command freq over 90d

      alert if command in bottom5%(hist) or never_seen

      boost score if new host OR unusual TTY OR fail/success spike

      cutoffs per user role'
- question: Does a user's observed sudo events-per-hour exceed the interval predicted by a time-series
    model (ARIMA/Prophet), indicating automated abuse or credential compromise?
  context: Automated tooling or scripted abuse produces sudo volume bursts beyond a human's normal rhythm.
    Forecast sudo events per user per hour with a time-series model (ARIMA/Prophet) and alert when observed
    volume exceeds the predicted confidence interval. Report contributing context (baseline vs. observed
    count, top new commands, host) in the alert for explainability. A volume spike well above the forecast
    band suggests scripted escalation or a hijacked account running many privileged actions quickly. Forecasting
    captures seasonality (e.g., maintenance windows) that a static threshold would either miss or false-positive
    on, making it robust for multi-user servers with cyclical workloads.
  answer_sources: *id003
  range: Last 90 days (hourly buckets; >=30 days history for forecast)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Time-series forecast of per-user sudo volume

      series = count(sudo) by user, hour

      model = ARIMA_or_Prophet.fit(series, history>=30d)

      alert if observed > predicted_upper_interval

      emit baseline vs observed, top new commands, host'
- question: Is a non-interactive sudo execution (tty null/absent) occurring within the credential-cache
    timeout window after the same user ran an interactive sudo on the same host, particularly where tty_tickets
    is disabled?
  context: 'Once a user authenticates an interactive sudo, the cached credential lets subsequent sudo
    calls run without a password until timestamp_timeout expires; malware exploits this from non-interactive
    contexts. Implement a stateful rule firing on a sudo execve where tty is null/absent, only if the
    same user on the same host ran an interactive (tty present) sudo within the cache window. Default
    the window to the host''s effective timestamp_timeout (default 15 min) and account for tty_tickets
    state; alert when tty_tickets is off and non-interactive sudo follows. A non-interactive sudo riding
    a cached credential is a classic sudo-caching abuse for stealthy escalation; tty_tickets being off
    broadens the attack to any tty, raising severity. References: [sudoers manual](https://www.sudo.ws/docs/man/sudoers.man/).'
  answer_sources: &id004
  - Process Creation Logs (e.g., Auditd with tty field, Sysmon for Linux Event ID 1 with TerminalSessionId)
  - 'NAI: All Linux/macOS hosts, particularly multi-user servers, Cron job and script execution environments'
  range: Last 90 days (correlate within timestamp_timeout, default 15 min)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Stateful non-interactive cache-riding sudo\non sudo execve where tty is null:\n  if exists\
      \ interactive sudo (tty present) same user+host within cache_window(default 15m):\n    alert\n \
      \ raise severity if tty_tickets == off"
- question: Does a user show a burst of short inter-arrival (<60s) non-interactive sudo executions, or
    a median sudo inter-command delta dropping below their 10th percentile, characteristic of scripted
    cache abuse?
  context: 'Human admins pause between privileged commands; scripts fire them in rapid succession while
    a cached credential is valid. Per user, model inter-arrival times between consecutive sudo events
    (frequency: sudo/min). Alert when a burst of short-delta (<60s) non-interactive executions appears
    or the user''s median delta drops below their 10th percentile. Derive thresholds per user so naturally
    fast power-users are not over-flagged. A tight cluster of sudo calls is a hallmark of automated cache
    abuse following an interactive unlock; the per-user delta model adapts to individual cadence and reduces
    false positives compared to a global threshold.'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Sudo inter-command delta model

      deltas = inter_arrival(sudo events) per user

      alert if burst of non-interactive sudo with delta<60s

      alert if median(delta) < p10(user delta history)

      thresholds per user'
- question: When a Hidden Markov / sequence model over states {Interactive-Sudo, Non-Interactive-Sudo,
    No-Sudo} scores per-user sudo sequences, which transitions from a single interactive sudo into a rapid
    run of non-interactive sudo are flagged as high-probability cache abuse?
  context: 'Cache abuse has a characteristic temporal shape: one interactive unlock followed by many non-interactive
    escalations. Train a Hidden Markov / sequence model over states {Interactive-Sudo, Non-Interactive-Sudo,
    No-Sudo} on normal per-user sequences, building on the system-call/sequence-anomaly tradition. Flag
    high-probability transitions from one interactive sudo into a rapid run of non-interactive sudo as
    cache abuse, emitting the offending subsequence as evidence. A flagged subsequence gives the analyst
    the exact escalation chain to review. The sequence model captures patterns that per-event rules miss
    and provides explainable evidence (the actual ordered sudo events) tying the anomaly to the cache-abuse
    behavior. References: [A Sense of Self for Unix Processes, Forrest et al.](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '// HMM sequence model of sudo states

      states = {Interactive-Sudo, Non-Interactive-Sudo, No-Sudo}

      model = HMM.fit(normal per-user sequences)

      alert on high-prob Interactive -> rapid Non-Interactive run

      emit offending subsequence as evidence'
- question: Was /etc/sudoers or any file in /etc/sudoers.d/* modified to add logging-suppression directives
    such as !authenticate, !syslog, !log_input, !log_output, or logfile=/dev/null?
  context: 'Disabling sudo logging is a Defense-Evasion enabler that lets subsequent privileged abuse
    go unrecorded. Apply a FIM/auditd rule on writes to /etc/sudoers and /etc/sudoers.d/*, inspect the
    diff, and alert high when added lines match !authenticate, !syslog, !log_input, !log_output, or logfile
    ?= ?["'']?/dev/null. These directives suppress sudo auditing. A matching diff means an actor is blinding
    the very telemetry this playbook relies on, so it is high-severity and should trigger preservation
    of surrounding events. Benign config-management changes rarely add logging-disable directives, so
    false positives are low; correlate the writer process to confirm intent. References: [Falco default
    ruleset](https://github.com/falcosecurity/rules), [sudoers manual](https://www.sudo.ws/docs/man/sudoers.man/).'
  answer_sources: &id005
  - File Integrity Monitoring (FIM) logs
  - File Modification Logs (e.g., Auditd syscall=write on /etc/sudoers and /etc/sudoers.d/)
  - 'NAI: Configuration management servers (e.g., Ansible, Puppet, Chef), All Linux/macOS hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Sudoers logging-disable directives\non FIM/auditd write to /etc/sudoers or /etc/sudoers.d/*:\n\
      \  diff = added_lines\n  alert HIGH if diff =~ /!(authenticate|syslog|log_input|log_output)/\n \
      \ alert HIGH if diff =~ /logfile ?= ?[\"']?\\/dev\\/null/"
- question: Is any host's sudoers change rate more than two standard deviations above its 90-day baseline,
    especially when not correlated with a configuration-management run or package update?
  context: On most hosts /etc/sudoers changes almost never; a sudden flurry of edits is suspicious. Baseline
    the sudoers change rate per host (near zero normally) and alert on any host whose change rate exceeds
    2 standard deviations above its 90-day baseline, especially when not correlated with a configuration-management
    run (puppet/ansible/chef) or package update. Track volume (bytes changed) and state (writer process)
    to suppress benign CM activity. An off-baseline change made by an interactive shell or web process,
    rather than a CM tool, points to adversarial policy tampering. The change-rate model adapts per host
    so heavily-managed servers and rarely-touched endpoints each get an appropriate threshold.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Sudoers change-rate anomaly

      rate = sudoers_writes per host over time

      alert if rate > mean90d + 2*std

      suppress if writer in (puppet,ansible,chef,dpkg,rpm) or pkg update

      track bytes_changed and writer process'
- question: When a classifier separates legitimate (writer=puppet/ansible/dpkg) from suspicious (writer=bash/web-shell)
    sudoers modifications using writer lineage, user, time-of-day, and diff content, which edits are flagged
    and what features drove the decision?
  context: 'The legitimacy of a sudoers edit is largely encoded in who/what made it and what it changed.
    Train a random-forest/GBM classifier separating legitimate (writer=puppet/ansible/dpkg) from suspicious
    (writer=bash/web-shell) sudoers modifications using writer parent lineage, user context, time-of-day,
    and diff content. Output the top-3 features (e.g., writer=apache2, off-hours, NOPASSWD added) in the
    alert. A flagged edit with a web-server writer adding NOPASSWD off-hours is a strong escalation/persistence
    signal; the explainable features let the analyst confirm against the change-management record. This
    complements the deterministic directive rules by catching subtler suspicious edits that don''t match
    a fixed pattern. References: [ProblemChild, Elastic](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Sudoers modification classifier

      features = {writer_lineage, user, time_of_day, diff_content}

      model = randomforest_or_gbm.fit(labeled sudoers edits)

      alert if predict==suspicious

      emit top3 features (e.g., writer=apache2, off-hours, NOPASSWD added)'
- question: 'Was /etc/sudoers or /etc/sudoers.d/* modified to add or expand a NOPASSWD: rule or to add
    Defaults !tty_tickets, and was it followed within five minutes by killall Terminal or pkill -HUP sudo?'
  context: 'NOPASSWD and Defaults !tty_tickets relax sudo controls, enabling password-free or cross-tty
    escalation - a known macOS malware behavior. On sudoers FIM/diff events, alert when added content
    matches NOPASSWD: or Defaults !tty_tickets. Raise severity if a killall Terminal or pkill -HUP sudo
    by the same user follows within 5 minutes, since attackers force the change to take effect. A NOPASSWD
    addition grants standing password-free root to a principal; !tty_tickets plus a terminal kill is the
    documented OSX.Proton pattern. This is a high-confidence Privilege Escalation/Persistence signal;
    correlate with the writer and change-management to rule out sanctioned changes. References: [sudoers
    manual](https://www.sudo.ws/docs/man/sudoers.man/), [MITRE T1548.003](https://attack.mitre.org/techniques/T1548/003/),
    [Elastic sudoers-modification rule](https://github.com/elastic/detection-rules).'
  answer_sources: &id006
  - Process Creation Logs (e.g., Auditd type=execve, Sysmon for Linux Event ID 1)
  - 'NAI: Configuration management servers, All Linux/macOS hosts, especially developer workstations and
    multi-user servers'
  range: Last 90 days (correlate follow-on kill within 5 minutes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Control-weakening sudoers edits + activation\non sudoers diff event:\n  alert if added\
      \ =~ /NOPASSWD:/ or added =~ /Defaults !tty_tickets/\n  raise severity if same user runs killall\
      \ Terminal or pkill -HUP sudo within 5m"
- question: Does a sudoers change raise the host's aggregate NOPASSWD risk score (weighted by principal
    privilege and command scope) beyond a learned or static threshold, and which specific rule drove the
    increase?
