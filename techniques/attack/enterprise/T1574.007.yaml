  context: 'Why this matters: Under the Execution tactic (TA0002), PATH interception lets an adversary
    silently substitute their own binary for a trusted one, blending malicious execution into routine
    name-only command invocations. This evidence focuses on the condition that A file is created in a
    directory known to be prepended to the system PATH (e.g., C:\Python27\, C:\ProgramData\Oracle\), where
    the filename matches a whitelisted application or common utility (e.g., ''powershell.exe''), but its
    hash does not match the legitimate version. This Symbolic Logic approach (''Alert on PATH directories
    receiving system utility names'') works as follows: Alert on file creation (Windows Event ID 11) in
    any directory listed in the system PATH (excluding C:\Windows and C:\Windows\System32) when the new
    filename matches a critical utility (net.exe, cmd.exe, powershell.exe). Enumerate PATH entries from
    the registry surface defined by [MITRE T1574.007](https://attack.mitre.org/techniques/T1574/007/);
    a utility name appearing in an earlier-searched third-party PATH dir is the hijack precondition flagged
    by SigmaHQ [System File Execution Location Anomaly](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_system_exe_anomaly.yml).
