questions:
- question: '[Stealth] Floor rule: utility-named file in non-canonical directory: Can you determine whether
    a file is created in a user-writable directory that appears early in the PATH search order (e.g.,
    C:\Users\*\AppData\*, C:\ProgramData\*) with a filename that matches a commonly invoked system utility
    (e.g., ''net.exe'', ''findstr.exe''), and a later execution resolves that name from the planted location
    rather than the intended system binary. -- specifically, using the ''Floor rule: utility-named file
    in non-canonical directory'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), PATH interception lets an adversary silently
    substitute their own binary for a trusted one, blending malicious execution into routine name-only
    command invocations. This evidence focuses on the condition that A file is created in a user-writable
    directory that appears early in the PATH search order (e.g., C:\Users\*\AppData\*, C:\ProgramData\*)
    with a filename that matches a commonly invoked system utility (e.g., ''net.exe'', ''findstr.exe''),
    and a later execution resolves that name from the planted location rather than the intended system
    binary. This Symbolic Logic approach (''Floor rule: utility-named file in non-canonical directory'')
    works as follows: Maintain an allowlist of expected directories per system-utility name (mirror the
    ~60-binary allowlist in SigmaHQ [System File Execution Location Anomaly](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_system_exe_anomaly.yml)).
    Alert on file creation (Windows Event ID 11) where the filename matches a watched utility (net.exe,
    findstr.exe, cmd.exe, powershell.exe) but the parent directory is user-writable (C:\Users\*, C:\ProgramData\*,
    C:\Temp\*) and not the canonical System32/SysWOW64 path defined by [MITRE T1574.007](https://attack.mitre.org/techniques/T1574/007/).
    This deterministic floor must not be removed; tune the allowlist, do not delete it. A positive result
    -- a rule match, a statistical outlier, or a model alert -- indicates probable PATH hijacking; pivot
    to the responsible binary (path, hash, signer, size vs the legitimate twin), its parent and child
    process lineage, the user and integrity context, any preceding file-creation or PATH/shell-config
    modification, and any downstream persistence or network activity. A negative result helps rule out
    this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, living-off-the-land, or low-and-slow activity.'
