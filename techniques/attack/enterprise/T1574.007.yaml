    hijacking; pivot to the responsible binary (path, hash, signer, size vs the legitimate twin), its
    parent and child process lineage, the user and integrity context, any preceding file-creation or PATH/shell-config
    modification, and any downstream persistence or network activity. A negative result helps rule out
    this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, living-off-the-land, or low-and-slow activity.'
