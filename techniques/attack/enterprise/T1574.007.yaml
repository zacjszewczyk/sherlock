name: 'T1574.007: Hijack Execution Flow: Path Interception by PATH Environment Variable'
id: ac243bd7-d7a6-488f-b9ff-4bbde0c9464e
description: 'This playbook helps an analyst investigate whether an adversary is hijacking the PATH environment
  variable to redirect execution flow to attacker-controlled binaries (MITRE T1574.007: Hijack Execution
  Flow: Path Interception by PATH Environment Variable). The core abuse is placing a malicious executable
  named after a legitimate system utility (e.g., net.exe, findstr.exe, cmd.exe, powershell.exe) in a user-writable
  directory that the OS searches before the canonical System32/SysWOW64 location, or directly modifying
  the PATH (Windows registry \Environment\Path) / $PATH or $HOME on Linux/macOS (via ~/.bashrc, ~/.profile,
  /etc/paths.d, or launchctl) so that a name-only invocation resolves to the planted binary instead of
  the intended one. It guides the analyst across several angles aligned to the Stealth and Execution tactics:
  utility-named files written to non-canonical, user-writable directories or to third-party PATH entries;
  modifications to the PATH registry value (especially prepends of user-writable directories); legitimate
  or SYSTEM parent processes spawning utility-named children that resolve to user-writable paths; relative-path
  scheduled tasks / autorun entries that depend on a manipulated PATH; write-then-privileged-execute sequences
  indicating low-to-high integrity abuse; masqueraded security/system tools running from invalid paths
  with bad signatures or unknown hashes; command-line name-vs-resolved-path mismatches; and hijacked binaries
  that beacon to C2. Detection methods combine deterministic symbolic-logic floor rules, statistical baselining/rarity
  scoring, and explainable machine-learning models applied to Windows Security and Sysmon events (Event
  IDs 1, 3, 11, 13, 4657, 4688, 4698), auditd, macOS unified logs, osquery, and Zeek conn/dns/files logs,
  so the analyst can corroborate suspected PATH interception against file creation, registry/shell-config
  changes, process lineage, persistence, and network behavior.'
