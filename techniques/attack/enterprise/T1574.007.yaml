- question: '[Execution] Alert when command-line names resolve to user paths: Can you determine whether
    a process is created where the command line invokes a utility by its name only (e.g., ''net user...''),
    but the resolved executable path is a user-writable directory (e.g., C:\Users\...\net.exe) instead
    of the expected system path (e.g., C:\Windows\System32\net.exe). -- specifically, using the ''Alert
    when command-line names resolve to user paths'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), PATH interception lets an adversary
    silently substitute their own binary for a trusted one, blending malicious execution into routine
    name-only command invocations. This evidence focuses on the condition that A process is created where
    the command line invokes a utility by its name only (e.g., ''net user...''), but the resolved executable
    path is a user-writable directory (e.g., C:\Users\...\net.exe) instead of the expected system path
    (e.g., C:\Windows\System32\net.exe). This Symbolic Logic approach (''Alert when command-line names
    resolve to user paths'') works as follows: For each process creation event (Windows Event ID 1/4688),
    if the CommandLine invokes the binary by name only (no '':\''), compare the resolved Image to the
    allowlist of expected paths for that name. Alert when the Image is not the canonical system path (e.g.,
    command ''net.exe'' but path not ''C:\Windows\System32\net.exe''); this name-vs-resolved-path mismatch
    is the exact PATH-interception signature in SigmaHQ [System File Execution Location Anomaly](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_system_exe_anomaly.yml)
    and [MITRE T1574.007](https://attack.mitre.org/techniques/T1574/007/). On Linux/macOS apply the equivalent
    check on shell-resolved paths and monitor rc/profile and ''launchctl setenv'' modifications (Elastic
    [shell-config](https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_shell_configuration_modification.toml),
    [launchctl](https://github.com/elastic/detection-rules/blob/main/rules/macos/defense_evasion_modify_environment_launchctl.toml)
    rules; real-world pattern in [Uptycs](https://www.uptycs.com/blog/threat-research-report-team/fake-poc-linux-kernel-vulnerability)).
