name: 'T1114.002: Remote Email Collection'
id: 33a169fe-1f94-4127-b28b-550848a6576a
description: Investigate suspected remote email collection against on-prem Exchange, Office 365/Exchange
  Online, or Google Workspace, where an adversary uses stolen credentials, OAuth tokens, or scripted tooling
  (e.g., MailSniper, Ruler, EWS Managed API, AADInternals) to read and bulk-export mailbox contents. This
  playbook helps an analyst correlate abnormal authentication to mail services (CTI/Tor/anonymous-proxy
  source IPs, password-spray failure bursts, impossible-travel and baseline-deviating logins) with programmatic
  mailbox access (suspicious user agents and API operation sequences, OAuth mail-scope consent grants,
  eDiscovery/PST exports, mailbox audit tampering) and with bulk or automated data egress (large IMAP/EWS/MAPI
  transfers, high MailItemsAccessed counts, sync-based full-folder downloads, and non-human request timing).
  It spans symbolic-logic rules, statistical baselining/rarity scoring, and machine-learning detections
  across Windows, identity, network, and cloud email telemetry.
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there any successful or failed authentications to mail servers or cloud email services
    whose source IP address matches a threat-intelligence feed of known-malicious IPs, anonymizing proxies,
    or Tor exit nodes?
  context: Adversaries performing remote email collection frequently log in from infrastructure already
    flagged in CTI feeds, or hide behind Tor/anonymous proxies. Join the source IP of mail-service authentications
    (Windows Event ID 4624/4625, Azure AD SignInLogs ipAddress) against a CTI feed of malicious IPs, anonymizing
    proxies, and Tor exit nodes and alert on any match, whether the logon succeeded or failed. Treat Tor
    or anonymous-proxy categories (e.g., from Microsoft Defender for Cloud Apps anomaly policies) as standalone
    high-severity even without an explicit IOC hit. A positive result against a mailbox-bearing account
    is a strong Collection-stage indicator and should trigger session review and credential containment;
    a clean result lowers but does not eliminate suspicion since adversaries rotate fresh infrastructure.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD Sign-In logs
  - Okta System Log
  - 'NAI: Authentication servers (e.g., Active Directory Domain Controllers), Cloud Identity Providers
    (e.g., Azure AD), Mail Servers (e.g., on-prem Exchange), Network Egress Points, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (WinEventLog:Security EventCode IN (4624,4625), azure:signinlogs)\n  | join\
      \ type=inner ip=ipAddress [ lookup cti_feed category IN (malicious, anon_proxy, tor) ]\n  | where\
      \ target_service IN (Exchange, EWS, OWA, O365)\n  | eval severity = if(category IN (tor, anon_proxy),\
      \ \"high\", \"medium\")\n  | alert"
- question: Is any single user account or source IP generating a burst of failed or blocked authentications
    against mail endpoints consistent with password spraying before collection?
  context: 'Password-spray-then-collect is the precursor tradecraft described in MailSniper research:
    an attacker brute-forces or sprays credentials, then logs in and harvests mail. Profile failed/blocked
    authentication as a distinct signal and alert when a single user or source IP produces >=10 Event
    ID 4625 / Azure AD failed sign-ins within 10 minutes against mail endpoints, especially with lockout
    (50126/50053) or MFA-required (50076) error codes. A spike of failures followed by a success is a
    high-confidence compromise precursor; investigate the subsequent successful session for mailbox access.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD Sign-In logs
  - Okta System Log
  - 'NAI: Authentication servers (e.g., Active Directory Domain Controllers), Cloud Identity Providers
    (e.g., Azure AD), Mail Servers (e.g., on-prem Exchange), Network Egress Points, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (WinEventLog:Security EventCode=4625, azure:signinlogs status=failure)\n \
      \ | where target_service IN (Exchange, EWS, OWA, O365)\n  | bin _time span=10m\n  | stats count\
      \ as fails, values(errorCode) by user, src_ip, _time\n  | where fails >= 10\n  | alert"
- question: For CTI-matched or first-seen logins to mail services, how rare is the user's ASN/country
    combination compared with their own 90-day history?
  context: Rather than relying only on IOC matches, score the rarity of each login's network origin. For
    every CTI-matched or first-seen login, compute the 90-day frequency of the user's ASN/country pair
    from Zeek conn.log and Azure AD logs and escalate when the pair falls in the bottom 5th percentile
    of that user's history, applying a non-parametric Directed Anomaly Scoring rarity ranking (Ho et al.
    2017) to keep the alert budget bounded. Surface the bottom-percentile ASN/country and the prior observation
    count in the alert so the analyst can judge whether this is genuinely novel infrastructure or a known
    travel pattern.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD Sign-In logs
  - Okta System Log
  - 'NAI: Authentication servers (e.g., Active Directory Domain Controllers), Cloud Identity Providers
    (e.g., Azure AD), Mail Servers (e.g., on-prem Exchange), Network Egress Points, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  logins = source IN (azure:signinlogs, zeek:conn) last 90d\n  | stats count as hist by\
      \ user, asn, country\n  | eventstats sum(hist) as total by user\n  | eval freq = hist/total\n  |\
      \ join new_login [ where cti_match OR first_seen ]\n  | where freq <= p05(freq by user)\n  | alert\
      \ with asn, country, hist"
- question: Does a supervised login-risk model flag any mail-service authentication as high risk based
    on its metadata (geolocation, ASN, hour, MFA usage, user agent, token type)?
  context: Train a binary classifier (XGBoost or Random Forest) on login metadata labeled by historical
    CTI matches and confirmed compromises, mirroring productionized Microsoft Entra ID Protection detections
    (atypical travel, unfamiliar sign-in properties, anomalous token). The model captures non-linear combinations
    of risk that simple rules miss. Output the top-3 contributing features (e.g., unfamiliar ASN, new
    device, off-hours) in the alert text so the analyst understands the rationale. High-scoring logins
    to mailbox-bearing accounts warrant session and MailItemsAccessed review.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD Sign-In logs
  - Okta System Log
  - 'NAI: Authentication servers (e.g., Active Directory Domain Controllers), Cloud Identity Providers
    (e.g., Azure AD), Mail Servers (e.g., on-prem Exchange), Network Egress Points, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [geo, asn, hour, mfa_used, user_agent, token_type]\n  model = XGBoost.load(\"\
      login_risk.model\")\n  | score each mail_login -> p_malicious\n  | where p_malicious >= 0.8\n  |\
      \ annotate top3 = shap_top_features(model, login)\n  | alert"
- question: Is there network or audit-log evidence of email-collection tool signatures, such as MailSniper,
    Ruler, EWS Managed API, or PowerShell user agents accessing mail or the global address list?
  context: Known collection tools leave recognizable fingerprints. Apply regex to Zeek http.log user_agent,
    O365 Unified Audit Log UserAgent, and MailItemsAccessed ClientInfoString to flag MailSniper/Ruler,
    EWS Managed API, and PowerShell signatures. The EWS/OWA address-book enumeration and Get-GlobalAddressList
    tradecraft is documented in MailSniper. A match indicates scripted, non-interactive mailbox access;
    pivot to the account's authentication history and the mailboxes/items touched. Note that user agents
    can be spoofed, so treat this as one corroborating signal among several.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Microsoft 365 Unified Audit Log
  - 'NAI: Mail Servers (e.g., on-prem Exchange), Web Application Firewalls (WAFs), Network Egress Points,
    Cloud Application Security Broker (CASB), Cloud Mail Tenant (e.g., O365, Google Workspace)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (zeek:http, m365:unified)\n  | where match(user_agent, \"(?i)MailSniper|Ruler|ExchangeServicesClient|EWS|python-requests|PowerShell|AADInternals\"\
      )\n     OR match(ClientInfoString, \"(?i)MailSniper|Ruler|EWS|PowerShell\")\n  | alert with user,\
      \ src_ip, user_agent, operation"
- question: Has any OAuth application been granted mail-read scopes, or has an eDiscovery/Content Search
    PST export been performed, indicating native non-interactive collection paths?
  context: Adversaries increasingly collect mail without an interactive logon by abusing OAuth app consent
    or built-in eDiscovery. Alert on Azure AD 'Consent to application' / 'Add app role assignment grant'
    events granting Mail.Read / Mail.ReadWrite / Mail.ReadWrite.All to a newly registered or low-prevalence
    app (per the Microsoft app-consent IR playbook), and on M365 eDiscovery/Content Search PST export
    alerts (per the SigmaHQ PST export rule). Both bypass session-login analytics, so they are easily
    missed. A consent grant to an obscure app, or an unexpected PST export, should be investigated as
    active collection or staging.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Microsoft 365 Unified Audit Log
  - 'NAI: Mail Servers (e.g., on-prem Exchange), Web Application Firewalls (WAFs), Network Egress Points,
    Cloud Application Security Broker (CASB), Cloud Mail Tenant (e.g., O365, Google Workspace)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  consent = m365:unified Operation IN (\"Consent to application\",\"Add app role assignment\
      \ grant to user\")\n    | where scope MATCHES \"Mail.Read|Mail.ReadWrite|Mail.ReadWrite.All\"\n\
      \    | where app_prevalence < threshold OR app_age < 30d\n  export = m365:unified Operation IN (\"\
      New-ComplianceSearchAction\",\"eDiscovery export\") AND Export=true\n  | union consent, export |\
      \ alert"
- question: Has mailbox auditing been disabled or bypassed, which would indicate an attempt to hide email
    collection?
  context: Adversaries disable auditing to blind defenders before collecting mail. As a failure-mode signal,
    alert on any Set-MailboxAuditBypassAssociation or Set-OrganizationConfig -AuditDisabled $true, and
    periodically verify that Get-OrganizationConfig | FL AuditDisabled and Get-MailboxAuditBypassAssociation
    remain false/empty (per Microsoft Purview mailbox-auditing guidance). Any audit-disabling action is
    high severity because it both indicates intent and degrades all the other detections in this playbook;
    correlate the actor and timeframe with subsequent mailbox access that may now be under-logged.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Microsoft 365 Unified Audit Log
  - 'NAI: Mail Servers (e.g., on-prem Exchange), Web Application Firewalls (WAFs), Network Egress Points,
    Cloud Application Security Broker (CASB), Cloud Mail Tenant (e.g., O365, Google Workspace)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  m365:unified Operation IN (\"Set-MailboxAuditBypassAssociation\",\"Set-OrganizationConfig\"\
      )\n  | where AuditBypassEnabled=true OR AuditDisabled=true\n  | alert severity=high with actor,\
      \ target_mailbox, _time\n  /* plus scheduled check: Get-OrganizationConfig AuditDisabled, Get-MailboxAuditBypassAssociation\
      \ */"
- question: Has a user or the organization seen a first-seen or extremely rare HTTP user-agent / ClientInfoString
    accessing mail, suggesting new tooling?
  context: Beyond static tool signatures, track each user's distribution of user-agent / ClientInfoString
    values over 30 days and alert when a string appears in <0.1% of the org's sessions or is first-seen
    for a user, ranking by rarity (Ho et al. 2017). Novel automation clients often introduce a previously
    unseen user agent. Report the new agent string and its prevalence so the analyst can confirm whether
    it corresponds to a sanctioned client or to attacker tooling. Low-prevalence agents on mailbox-bearing
    accounts merit session review.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Microsoft 365 Unified Audit Log
  - 'NAI: Mail Servers (e.g., on-prem Exchange), Web Application Firewalls (WAFs), Network Egress Points,
    Cloud Application Security Broker (CASB), Cloud Mail Tenant (e.g., O365, Google Workspace)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (zeek:http, m365:unified) last 30d\n  | stats count by user_agent\n  | eventstats\
      \ sum(count) as total\n  | eval prevalence = count/total\n  | where prevalence < 0.001 OR is_first_seen(user_agent,\
      \ user)\n  | alert with user_agent, prevalence"
- question: Do any O365 operation or EWS call sequences deviate from learned benign patterns in a way
    that indicates scripted tool usage?
  context: Scripted collection produces characteristic sequences of API operations that differ from human-driven
    mailbox use. Train an HMM/n-gram or LSTM model on benign sequences of O365 Operation values and EWS
    call types and flag deviating sequences (following sequence-anomaly approaches surveyed in Yuan &
    Wu). Emit the divergent operations in the alert. A flagged sequence such as rapid Bind/SyncFolderItems/FindItem
    loops is indicative of automated harvesting; correlate with volume and timing signals to confirm bulk
    collection.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Microsoft 365 Unified Audit Log
  - 'NAI: Mail Servers (e.g., on-prem Exchange), Web Application Firewalls (WAFs), Network Egress Points,
    Cloud Application Security Broker (CASB), Cloud Mail Tenant (e.g., O365, Google Workspace)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  model = HMM_or_LSTM.train(benign_operation_sequences)\n  | for each session: seq = ordered(Operation,\
      \ EWS_call)\n  | score = model.anomaly_score(seq)\n  | where score > threshold\n  | alert with divergent_operations(seq)"
- question: Are there consecutive logins for a user whose implied travel speed exceeds physical possibility
    ('impossible travel')?
  context: Impossible travel is a classic indicator that a credential is being used from two places at
    once, one of which is the adversary. Geocode consecutive Windows Event ID 4624 / Azure AD logins for
    a user and trigger when the implied travel speed exceeds ~1000 km/h, the deterministic logic of the
    Microsoft Defender for Cloud Apps impossible-travel policy. Exclude tagged corporate VPN egress IPs
    to control false positives. A positive result on a mailbox account suggests concurrent attacker access;
    review which session accessed mail and from where.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Azure AD Sign-In logs
  - Okta System Log
  - 'NAI: Authentication servers (e.g., Active Directory Domain Controllers), Cloud Identity Provider
    (e.g., Azure AD), VPN Concentrators, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (WinEventLog:Security EventCode=4624, azure:signinlogs)\n  | where src_ip\
      \ NOT IN corp_vpn_egress\n  | sort by user, _time\n  | eval km = geodist(prev_geo, geo), hrs = (_time\
      \ - prev_time)/3600\n  | where km/hrs > 1000\n  | alert"
- question: Does a user's successful login deviate from their multi-faceted behavioral baseline across
    at least two dimensions (country, ASN, login hour)?
  context: Single-dimension anomalies are noisy; requiring multiple simultaneous deviations sharpens precision.
    Maintain per-user distributions of countries/ASNs and login hours over 30 days using k-sigma baselining
    (Dwyer & Truta) and alert when the aggregate deviation requires >=2 simultaneous anomalies (e.g.,
    new country AND off-hours) or exceeds mean+3σ. List the contributing dimensions in the alert. A login
    that is simultaneously from a new country and at an unusual hour for that user is a strong candidate
    for compromised-credential email collection.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Azure AD Sign-In logs
  - Okta System Log
  - 'NAI: Authentication servers (e.g., Active Directory Domain Controllers), Cloud Identity Provider
    (e.g., Azure AD), VPN Concentrators, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = per_user dist(country, asn, login_hour) last 30d\n  | for each login: anomalies\
      \ = count(dim where z_score(dim) > 3)\n  | where anomalies >= 2\n  | alert with contributing_dims"
- question: Is there a per-user spike in infrequent-country or anonymous-proxy logins, or a rising failed-to-successful
    sign-in ratio preceding a rare-geo success?
  context: Separately track per-user infrequent-country and anonymous-proxy/Tor logins and the ratio of
    failed-to-successful sign-ins, treating a spike in failures preceding a rare-geo success as a distinct
    compromise precursor (per Microsoft Defender for Cloud Apps anomaly policies). This captures the brute-force/spray
    then successful-foreign-login pattern that single rules miss. A failure spike immediately followed
    by a successful login from an unusual location is a high-priority lead for follow-on mailbox collection.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Azure AD Sign-In logs
  - Okta System Log
  - 'NAI: Authentication servers (e.g., Active Directory Domain Controllers), Cloud Identity Provider
    (e.g., Azure AD), VPN Concentrators, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per user, bin 1h:\n    rare_geo = country NOT IN top_countries(user)\n    fail_ratio\
      \ = fails / (success+1)\n  | where (rare_geo AND success) AND prev_window.fail_ratio > baseline_ratio*3\n\
      \  | alert"
- question: When clustering a user's logins on geolocation, time-of-day, and ASN features, do any logins
    fall outside all established clusters?
  context: Cluster a user's logins on features (lat/long, time-of-day vectors, ASN) with DBSCAN and flag
    noise points (logins belonging to no dense cluster) for investigation, complementing the unfamiliar-sign-in-properties
    model of Microsoft Entra ID Protection. Surface which feature placed the login outside all clusters.
    Unlike fixed thresholds, density clustering adapts to each user's natural patterns, so a noise point
    represents genuinely atypical behavior worth reviewing against subsequent mail access.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Azure AD Sign-In logs
  - Okta System Log
  - 'NAI: Authentication servers (e.g., Active Directory Domain Controllers), Cloud Identity Provider
    (e.g., Azure AD), VPN Concentrators, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  for each user:\n    X = features[lat, long, tod_sin, tod_cos, asn]\n    labels = DBSCAN(eps,\
      \ min_samples).fit_predict(X)\n  | where label == -1  /* noise */\n  | alert with outlier_feature"
- question: Has any mail session transferred an abnormally large data volume or accessed an unusually
    high number of items in a short window?
  context: Bulk reads betray collection. Alert when a Zeek conn.log entry for IMAP/S, POP3/S, EWS, or
    MAPI shows resp_bytes >1 GB in a session, when O365 MailItemsAccessed exceeds 500 in 10 minutes, or
    when an IsThrottled MailItemsAccessed record (>1000 Bind ops/24h) is emitted — the deterministic bulk-read
    flag defined in Microsoft audit detailed properties. These thresholds catch wholesale mailbox harvesting.
    Correlate the session with its authentication origin and user agent to determine whether the volume
    is legitimate (e.g., a new device sync) or attacker exfiltration of mail.
  answer_sources:
  - Zeek conn.log
  - Microsoft 365 Unified Audit Log
  - 'NAI: Mail Servers (e.g., on-prem Exchange), Network Egress Points, Cloud Tenant (e.g., O365, Google
    Workspace)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  zeek:conn service IN (imap,imaps,pop3,pop3s,ews,mapi) AND resp_bytes > 1e9\n  OR m365:unified\
      \ Operation=MailItemsAccessed | bin 10m | stats count by user | where count > 500\n  OR m365:unified\
      \ MailItemsAccessed.IsThrottled=true\n  | alert"
- question: Are there MailItemsAccessed records indicating a full-folder Sync to a new client/IP, or access
    to a large number of distinct messages?
  context: Alert on MailItemsAccessed with MailAccessType=Sync (a full-folder download to a client) from
    a new client/IP, and on a high count of distinct accessed InternetMessageIds — the forensic bulk-collection
    indicators described in 'Use MailItemsAccessed to investigate compromised accounts'. A Sync from a
    previously unseen client is how attackers pull an entire mailbox offline, and a burst of distinct
    message IDs reflects keyword-driven harvesting. Both warrant scoping which messages were exposed and
    whether the client is sanctioned.
  answer_sources:
  - Zeek conn.log
  - Microsoft 365 Unified Audit Log
  - 'NAI: Mail Servers (e.g., on-prem Exchange), Network Egress Points, Cloud Tenant (e.g., O365, Google
    Workspace)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  m365:unified Operation=MailItemsAccessed\n  | where MailAccessType=\"Sync\" AND is_new(client_id,\
      \ src_ip, user)\n  | append [ stats dc(InternetMessageId) as distinct_msgs by user, session | where\
      \ distinct_msgs > 200 ]\n  | alert"
- question: Does a user's session exceed their own historical 95th-percentile data volume or item-access
    count by a wide margin?
  context: 'Static thresholds miss low-and-slow theft scaled to a user. Compute each user''s 95th percentile
    of per-session resp_bytes and MailItemsAccessed count over 30 days and trigger when a new session
    exceeds it by >3σ (Dwyer & Truta). Report observed vs baseline volume and items in the alert. This
    personalizes detection: a volume that is normal for a power user is anomalous for a light mailbox
    user, and a >3σ breach indicates an out-of-character bulk read consistent with collection.'
  answer_sources:
  - Zeek conn.log
  - Microsoft 365 Unified Audit Log
  - 'NAI: Mail Servers (e.g., on-prem Exchange), Network Egress Points, Cloud Tenant (e.g., O365, Google
    Workspace)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = per_user p95(resp_bytes), p95(mailitems), sigma last 30d\n  | for each session:\n\
      \      where resp_bytes > p95_bytes + 3*sigma_bytes\n         OR mailitems > p95_items + 3*sigma_items\n\
      \  | alert with observed, baseline"
- question: Does a forecasting model show a user's daily download volume or item count exceeding the predicted
    upper bound?
  context: Forecast daily download volume and item counts per user with SARIMA/Prophet or an autoencoder
    over activity volume (Yuan & Wu) and alert when observed exceeds the upper 95% prediction interval,
    citing the contributing day/metric. Time-series forecasting accounts for trends and seasonality (e.g.,
    month-end spikes) better than a flat percentile, reducing false positives while still catching a genuine
    collection-driven surge in mail egress. Flagged days should be correlated with login and tool signals.
  answer_sources:
  - Zeek conn.log
  - Microsoft 365 Unified Audit Log
  - 'NAI: Mail Servers (e.g., on-prem Exchange), Network Egress Points, Cloud Tenant (e.g., O365, Google
    Workspace)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  model = Prophet/SARIMA.fit(user_daily[volume, items])\n  | forecast next_day -> yhat,\
      \ yhat_upper(95%)\n  | where observed > yhat_upper\n  | alert with day, metric, observed, yhat_upper"
- question: Is any mail session producing an abnormally high request count, or is a non-admin account
    running mailbox export/search cmdlets, indicative of scripted collection?
  context: Alert when a webmail/EWS session records >200 requests in 10 minutes, or when a non-admin account
    performs >1 Search-Mailbox, New-MailboxExportRequest, or New-ComplianceSearchAction -Export per day
    — the scripted-collection thresholds reflected in the SigmaHQ eDiscovery export rule and MailSniper
    tradecraft. Human webmail use rarely reaches these rates, and export/search cmdlets from a standard
    user are abnormal. A hit points to automated harvesting or staging for exfiltration; identify the
    items targeted and the actor's authentication context.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Microsoft 365 Unified Audit Log
  - 'NAI: Mail Servers (e.g., on-prem Exchange), Web Application Firewalls (WAFs), Cloud Tenant (e.g.,
    O365, Google Workspace)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (zeek:http,m365) webmail/EWS | bin 10m | stats count by session | where count > 200\n\
      \  OR m365:unified Operation IN (\"Search-Mailbox\",\"New-MailboxExportRequest\",\"New-ComplianceSearchAction\"\
      )\n     | where user NOT IN admins | stats count by user,day | where count > 1\n  | alert"
- question: Do any sessions show unnaturally low variance in inter-request timing, indicating automated
    rather than human access?
  context: Automated clients tend to issue requests at machine-regular intervals. Group sessions by source/destination
    and compute the standard deviation of inter-request times; flag sessions whose stddev is in the bottom
    1st percentile (unnaturally regular) — the traffic-pattern discriminator between automated and human
    clients identified by Doran & Gokhale. Report the timing variance and request rate. Extremely regular
    timing on a mailbox session is a hallmark of scripted collection; corroborate with user-agent and
    volume signals.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Microsoft 365 Unified Audit Log
  - 'NAI: Mail Servers (e.g., on-prem Exchange), Web Application Firewalls (WAFs), Cloud Tenant (e.g.,
    O365, Google Workspace)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (zeek:conn, zeek:http, m365:unified)\n  | by session: deltas = diff(request_times)\n\
      \  | eval ts_stddev = stddev(deltas), rate = count/duration\n  | where ts_stddev <= p01(ts_stddev\
      \ across sessions)\n  | alert with ts_stddev, rate"
- question: Does a session-level bot classifier flag any mail session as automated based on request count,
    duration, timing entropy, and request-type distribution?
  context: Train a Gradient Boosting model on session-level features (request count, duration, inter-request
    timing entropy, request-type distribution) using the automated-client feature families of Doran &
    Gokhale and the behavioral-graph deviation of Ho et al. 2019, and flag automated sessions. Surface
    the top-3 features (e.g., low timing entropy, high request rate) driving the score. ML combines several
    weak signals into a robust automated-vs-human decision; an automated session against a mailbox, especially
    from a new origin, is a high-value lead for remote email collection.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Microsoft 365 Unified Audit Log
  - 'NAI: Mail Servers (e.g., on-prem Exchange), Web Application Firewalls (WAFs), Cloud Tenant (e.g.,
    O365, Google Workspace)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [req_count, duration, timing_entropy, req_type_dist]\n  model = GradientBoosting.load(\"\
      bot_session.model\")\n  | score each session -> p_bot\n  | where p_bot >= 0.8\n  | annotate top3\
      \ = feature_importance(model, session)\n  | alert"
