name: 'T1585.003: Cloud Accounts'
id: 8a6bbb3a-28aa-47f2-b216-a7fd912b4600
description: 'This playbook helps an analyst investigate adversary development of cloud-provider accounts
  (AWS, Azure, GCP, DigitalOcean, Linode, and cloud storage such as Dropbox, MEGA, or OneDrive) for use
  during targeting. Because most account-creation activity occurs outside the victim''s visibility, detection
  here focuses on first-party network and endpoint telemetry that betrays cloud account establishment
  or preparation from inside the enterprise: hosts querying disposable-email services and then reaching
  cloud sign-up pages; programmatic User-Agents and SDK/IaC tooling hitting cloud API endpoints from unauthorized
  systems; non-administrator hosts touching cloud account-management, billing, and IAM consoles; and a
  single host shopping across multiple distinct cloud providers in a short window. It combines symbolic-logic
  watchlists/correlation rules, statistical baselining (frequency, volume, state/failure ratios, peer-group
  percentiles, lexical entropy), and machine-learning models (sequence models, anomaly detection, clustering,
  supervised classification) so an analyst can distinguish scripted or unauthorized cloud-account development
  from benign administrative and developer activity.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any internal host resolve a disposable or temporary email-service domain and then, within
    five minutes, connect to a cloud provider's account-creation or sign-up page?
  context: 'Adversaries developing cloud accounts (Resource Development) frequently need a throwaway email
    address to register, so a disposable-email DNS lookup immediately followed by a cloud sign-up flow
    is a strong tell of account establishment from inside your network. Maintain curated watchlists of
    disposable-email domains (e.g., mailinator, guerrillamail, temp-mail) and cloud sign-up URLs/SNIs
    (e.g., signin.aws.amazon.com/signup, signup.live.com, accounts.google.com/signup). Join Zeek dns.log
    to ssl.log/http.log on source IP and look for the temporal sequence within a 5-minute window. A positive
    result (disposable lookup followed by cloud sign-up by the same host) warrants endpoint and user review;
    a clean result across the org lowers the likelihood that account development is being staged from
    your environment. Privacy-conscious users can cause false positives, so corroborate with the volume
    and failure-rate profiling below. Sources: [Zeek SSL/TLS Analyzer](https://docs.zeek.org/en/master/scripts/base/protocols/ssl/main.zeek.html),
    [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources: &id001
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Corporate network egress points and internal DNS resolvers.'
  range: Last 90 days (5-minute event-centered correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let disposable = watchlist(\"disposable_email_domains\")\nlet signup = watchlist(\"cloud_signup_urls_and_snis\"\
      )\nfrom dns.log where query in disposable as d\njoin (ssl.log OR http.log where (server_name in\
      \ signup) OR (host+uri in signup)) as s\n  on d.\"id.orig_h\" == s.\"id.orig_h\"\n  and s.ts between\
      \ d.ts and d.ts + 5min\nselect d.\"id.orig_h\", d.query, s.server_name, s.uri, d.ts, s.ts\n=> alert\
      \ \"Disposable email -> cloud sign-up correlation\""
- question: For each source host, does the sign-up flow show a burst of high-frequency POSTs to cloud
    sign-up endpoints with an abnormally high failure ratio (HTTP 4xx, CAPTCHA challenges, blocked connections,
    NXDOMAIN) relative to its 30-day baseline?
  context: 'Automated or scripted mass account creation looks very different from a human filling out
    one sign-up form: it produces distinctive bursts of high request frequency together with elevated
    failure ratios as the script trips CAPTCHAs, rate limits, and validation errors. Profile the State,
    Volume, and Frequency of the sign-up flow per source IP over a 30-day baseline: count HTTP POSTs to
    sign-up endpoints per minute, bytes up/down from conn.log, and the ratio of failed responses and NXDOMAIN
    to successful sessions. Alert when the sign-up POST rate exceeds the host''s 98th percentile AND the
    failed-response ratio exceeds the host baseline by more than three standard deviations. A positive
    result strongly suggests programmatic account development; a normal, low-volume successful sign-up
    is more consistent with benign activity. This statistical method complements the symbolic correlation
    rule by catching attempts even when the disposable-email step is missed. Sources: [Real-Time Detection
    of DNS Exfiltration and Tunneling](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf), [Sentinel
    Anomalies Reference](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference).'
  answer_sources: *id001
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from http.log where uri in watchlist(\"cloud_signup_endpoints\")\n| join conn.log on uid\n\
      | bin span=1min by \"id.orig_h\"\n| stats post_rate=count(method=\"POST\"), bytes_up=sum(orig_bytes),\
      \ bytes_down=sum(resp_bytes),\n        fail_ratio=count(status>=400 OR status==\"captcha\" OR conn_blocked)/count()\
      \ by \"id.orig_h\",_time\n| baseline p98(post_rate), mean(fail_ratio), stdev(fail_ratio) over 30d\
      \ by \"id.orig_h\"\n| where post_rate > p98_post_rate AND fail_ratio > mean_fail_ratio + 3*stdev_fail_ratio\n\
      => alert \"Scripted sign-up burst with high failure ratio\""
- question: Across the destination domains a host visits within five minutes of querying a disposable-email
    service, do the lexical features (Shannon entropy, label/character counts, unique-query ratio) indicate
    scripted, machine-generated sign-up behavior rather than human browsing?
  context: 'Scripted sign-up tooling often visits a narrow, repetitive set of programmatically generated
    or templated destinations, which shows up as low-entropy, high-frequency, low-unique-ratio DNS behavior.
    For each source IP compute a 30-day baseline frequency of DNS queries to disposable-email domains,
    and daily compute cheap stateless lexical features of the destination domains visited within five
    minutes of those queries. Alert when entropy falls below a dynamically derived threshold or when multiple
    hosts exhibit the same low-entropy, high-frequency pattern (a hallmark of a coordinated, scripted
    campaign). Derive thresholds from your own DNS corpus rather than fixed constants. A positive result
    points to automation supporting cloud account creation; ordinary diverse browsing yields higher entropy
    and unique ratios. This is a lightweight statistical filter to prioritize hosts for the heavier sequence
    model. Sources: [Real-Time Detection of DNS Exfiltration and Tunneling](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources: *id001
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from dns.log where query in watchlist(\"disposable_email_domains\") as d\n| lookup followups\
      \ = dns.log where \"id.orig_h\"==d.\"id.orig_h\" and ts between d.ts and d.ts+5min\n| eval entropy=shannon(followups.query),\
      \ labels=count_labels(followups.query),\n        chars=len(followups.query), uniq_ratio=dcount(followups.query)/count(followups.query)\n\
      | baseline freq over 30d by \"id.orig_h\"\n| derive thr = dynamic_threshold(entropy_corpus)\n| where\
      \ entropy < thr OR (low_entropy AND high_freq seen on >=2 hosts)\n=> alert \"Low-entropy scripted\
      \ sign-up pattern\""
- question: When scoring real-time web-browsing sequences with a trained sequence model, does any host
    produce a low-probability sequence consisting of a disposable-email provider domain followed by a
    cloud provider sign-up domain?
  context: 'Symbolic rules and simple statistics can miss novel or obfuscated account-creation flows.
    A sequence model (Hidden Markov Model or LSTM) trained on benign user web-browsing sequences (DNS
    queries, SNI names, HTTP URLs) learns what normal navigation looks like and assigns low probability
    to anomalous orderings. Score live event sequences and alert when the model flags a low-probability
    sequence that contains a disposable-email provider domain followed by a cloud provider sign-up domain
    - the exact pattern of staging a cloud account. Surface the top-3 contributing sequence steps/features
    in the alert text so an analyst can triage quickly. A low-probability hit is a high-value lead for
    Resource Development; high-probability (expected) sequences are deprioritized. Retrain periodically
    to track drift in legitimate browsing. Sources: [Deep Learning for Unsupervised Insider Threat Detection](https://arxiv.org/abs/1710.00811),
    [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources: *id001
  range: Last 90 days (model scored in near real time)
  queries:
  - technology: ML/pseudocode
    query: "model = load(\"hmm_or_lstm_browsing_sequence\")\nstream seq = per_host_ordered(dns.query,\
      \ ssl.server_name, http.url) window=10\nscore = model.logprob(seq)\nif score < learned_threshold\
      \ and contains(seq, disposable_email_domain followed_by cloud_signup_domain):\n    explain = top3_contributing_steps(model,\
      \ seq)\n    alert(\"Anomalous disposable-email -> cloud sign-up sequence\", host, seq, explain)"
- question: Did an HTTP/S request carrying a programmatic User-Agent (e.g., 'Terraform/', 'Boto3', 'Go-http-client',
    'aws-sdk-', 'python-requests', 'azure-cli') reach a cloud provider API endpoint from a source IP that
    is NOT on the allowlist of authorized infrastructure-as-code or administrative systems?
  context: 'Adversaries building out cloud infrastructure often drive cloud APIs with SDKs and IaC tooling
    rather than a browser, so a programmatic User-Agent hitting a cloud API from an unsanctioned host
    is a direct indicator of unauthorized cloud account development. Maintain an asset inventory of authorized
    IaC/management hosts and a watchlist of programmatic User-Agent strings, then alert on Zeek http.log
    requests to cloud API endpoints carrying those User-Agents when the source IP is not on the authorized
    inventory. A positive result identifies a candidate rogue automation host for endpoint investigation;
    an empty result indicates programmatic cloud access is confined to sanctioned systems. Because User-Agents
    are forgeable, pair this with the TLS-fingerprint corroboration below to reduce evasion and false
    attribution. Sources: [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources: &id002
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: User endpoint subnets, server subnets, and cloud management system enclaves.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let authorized = asset_inventory(\"iac_admin_hosts\")\nlet prog_ua = watchlist(\"programmatic_user_agents\"\
      )  // Terraform/, Boto3, Go-http-client, aws-sdk-, python-requests, azure-cli\nfrom http.log where\
      \ host in watchlist(\"cloud_api_endpoints\")\n  and user_agent matches_any prog_ua\n  and \"id.orig_h\"\
      \ not in authorized\nselect \"id.orig_h\", user_agent, host, uri, method\n=> alert \"Unauthorized\
      \ programmatic User-Agent to cloud API\""
- question: Does a host's TLS client fingerprint (JA3/JA4/JA4H) contradict its claimed User-Agent - for
    example presenting a non-browser fingerprint while claiming a browser, or presenting a sanctioned
    SDK/admin fingerprint from a non-admin host?
  context: 'User-Agent strings are trivially forgeable, so a sophisticated actor can mask automated cloud-API
    access as a normal browser. TLS client fingerprints are far harder to spoof and reveal the true client
    stack. Maintain JA3/JA4 fingerprints for sanctioned SDK/admin tooling and for standard browsers, then
    alert when a host presents a non-browser JA3/JA4H while claiming a browser User-Agent, or presents
    an SDK fingerprint from a non-admin host. Prefer JA4 plus User-Agent/header consistency over raw JA3
    lists, since modern browsers randomize TLS extensions. A mismatch is strong evidence of deliberate
    disguise of programmatic cloud activity; consistent fingerprint/User-Agent pairs are reassuring. Use
    this to validate or overturn hits from the User-Agent watchlist rule. Sources: [Gummy Browsers](https://arxiv.org/abs/2110.10129),
    [JA3](https://github.com/salesforce/ja3), [JA4+](https://github.com/FoxIO-LLC/ja4), [JA3 Fingerprints
    Fade](https://www.stamus-networks.com/blog/ja3-fingerprints-fade-browsers-embrace-tls-extension-randomization).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "let browser_fp = watchlist(\"browser_ja3_ja4\")\nlet sdk_fp = watchlist(\"sanctioned_sdk_admin_ja3_ja4\"\
      )\nlet admin_hosts = asset_inventory(\"iac_admin_hosts\")\njoin ssl.log s with http.log h on s.uid==h.uid\n\
      where (h.user_agent ~ \"Mozilla\" AND s.ja4 not in browser_fp)\n   OR (s.ja4 in sdk_fp AND s.\"\
      id.orig_h\" not in admin_hosts)\nselect s.\"id.orig_h\", s.ja3, s.ja4, h.user_agent, s.server_name\n\
      => alert \"TLS fingerprint vs claimed-client mismatch\""
- question: Is a non-administrative host using a programmatic User-Agent for the first time, or one that
    is rare enterprise-wide (below the 1st percentile of usage), when contacting cloud APIs - and do its
    request Volume, Frequency, and 401/403 ratio suggest credential-testing or reconnaissance?
  context: 'Even authorized-looking automation can be malicious if it appears on a host that has never
    used it. For each host, profile the set of User-Agent strings used over a 30-day baseline and alert
    when a non-authorized host uses a programmatic User-Agent for the first time. Compute enterprise-wide
    rarity per string and flag any non-admin host using a User-Agent below the 1st percentile of usage
    frequency. Track request Volume (bytes), Frequency (API calls/min), and State (HTTP 401/403 ratio)
    to distinguish credential-testing or reconnaissance (high 401/403, high frequency) from benign automation.
    A first-seen rare programmatic User-Agent with elevated auth failures is a strong lead for unauthorized
    cloud account development; established, low-rarity automation on admin hosts is expected. This statistical
    layer catches both forged and genuine-but-misplaced tooling. Sources: [Deciphering Malware''s Use
    of TLS](https://arxiv.org/abs/1607.01639), [Sentinel Anomalies Reference](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference).'
  answer_sources: *id002
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from http.log where host in watchlist(\"cloud_api_endpoints\")\n| stats first_seen=min(ts),\
      \ calls_per_min=rate(), bytes=sum(orig_bytes+resp_bytes),\n        auth_fail_ratio=count(status\
      \ in (401,403))/count() by \"id.orig_h\", user_agent\n| eval ua_rarity = global_freq_percentile(user_agent)\n\
      | where \"id.orig_h\" not in asset_inventory(\"iac_admin_hosts\")\n   and (is_first_seen(\"id.orig_h\"\
      ,user_agent) OR ua_rarity < 0.01)\n| where auth_fail_ratio high OR calls_per_min high\n=> alert\
      \ \"Rare/first-seen programmatic UA with suspicious volume/state\""
- question: When an unsupervised anomaly model (One-Class SVM or Isolation Forest) scores all internal
    cloud-API traffic, which sessions are flagged as outliers against the profile of legitimate cloud-administrative
    traffic?
  context: 'Hand-built rules cannot enumerate every form of anomalous cloud-API usage. Train a One-Class
    SVM or Isolation Forest on legitimate cloud-administrative traffic features (source subnet, JA3/JA4,
    User-Agent, destination API endpoint, request method, time-of-day, byte ratios) and apply it to all
    internal cloud API traffic, flagging outliers. OCSVM is preferred for robustness when the training
    baseline may be noisy or poisoned. Output the top-3 contributing features (e.g., rare endpoint, non-admin
    subnet, off-hours) via SHAP/LIME in each alert so analysts understand why a session was flagged. Outliers
    represent candidate unauthorized cloud account development for triage; inliers reflect normal admin/dev
    behavior. This model generalizes beyond the watchlists and statistics above to surface novel tradecraft.
    Sources: [Robust IoT Security Using Isolation Forest and One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4),
    [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources: *id002
  range: Last 90 days (model scored continuously)
  queries:
  - technology: ML/pseudocode
    query: "features = [src_subnet, ja3, ja4, user_agent, dst_api_endpoint, method, hour_of_day, bytes_up/bytes_down]\n\
      model = OneClassSVM().fit(legit_cloud_admin_traffic)   # or IsolationForest\nfor session in internal_cloud_api_traffic:\n\
      \    if model.predict(session) == outlier:\n        why = shap_top3(model, session)\n        alert(\"\
      Anomalous programmatic cloud API session\", session.host, why)"
- question: Did a host that is NOT in the 'Cloud Administrators' asset group connect to cloud account-management,
    billing-dashboard, or IAM-configuration domains/URIs (e.g., console.aws.amazon.com/billing, portal.azure.com/#create,
    myaccount.google.com, IAM consoles)?
  context: 'Cloud account creation and configuration happens through provider account-management, billing,
    and IAM pages. A non-administrator touching those resources may be establishing or configuring cloud
    accounts for adversary use. Maintain a watchlist of management/billing/IAM URIs and domains and alert
    when Zeek dns/ssl/http logs show a host outside the ''Cloud Administrators'' asset group connecting
    to them. A positive result identifies a user/host that should not normally manage cloud accounts and
    warrants review of intent and authorization; no hits means account-management access is confined to
    sanctioned admins. This is the symbolic baseline for the peer-group and clustering analytics that
    follow, which catch subtler deviations. Sources: [Zeek SSL/TLS Analyzer](https://docs.zeek.org/en/master/scripts/base/protocols/ssl/main.zeek.html),
    [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources: &id003
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - 'NAI: User endpoint subnets, corporate network egress points, and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let mgmt = watchlist(\"cloud_mgmt_billing_iam_uris\")\nlet cloud_admins = asset_group(\"Cloud\
      \ Administrators\")\nfrom (dns.log OR ssl.log OR http.log)\nwhere (query in mgmt) OR (server_name\
      \ in mgmt) OR (host+uri in mgmt)\n  and \"id.orig_h\" not in cloud_admins\nselect \"id.orig_h\"\
      , query, server_name, uri, ts\n=> alert \"Non-admin host accessing cloud management/billing/IAM\""
- question: Relative to its own 30-day history and its department/role peer group, is a non-administrative
    host's daily volume of connections to cloud management domains anomalously high or first-seen for
    that peer group?
  context: 'A single allowed visit may be benign, but a sustained or peer-group-anomalous pattern of cloud-management
    access from a non-admin is suspicious. For each non-administrative host compute a 30-day daily baseline
    of connections to cloud management domains with peer-group (department/role cohort) context. Alert
    when a host''s daily count exceeds its 98th historical percentile or is more than three standard deviations
    above its peer group''s mean, and when the activity is first-seen for that peer group. Include byte
    Volume and session Frequency as supporting features. A host suddenly exceeding both its own history
    and its peers - especially as a first-for-the-cohort behavior - is a strong indicator of unsanctioned
    cloud account development; activity within normal peer ranges is likely benign. Peer-group context
    sharply reduces false positives compared with global thresholds. Sources: [Identify Advanced Threats
    with UEBA in Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics),
    [Deep Learning for Insider Threat Detection](https://arxiv.org/abs/2005.12433).'
  answer_sources: *id003
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from (dns.log OR ssl.log OR http.log) where dest in watchlist("cloud_mgmt_domains")

      | where "id.orig_h" not in asset_group("Cloud Administrators")

      | bin span=1d by "id.orig_h"

      | stats daily=count(), bytes=sum(orig_bytes+resp_bytes), sessions=dcount(uid) by "id.orig_h",_time,
      peer_group

      | baseline p98(daily) over 30d by "id.orig_h"; peer_mean=mean(daily), peer_sd=stdev(daily) by peer_group

      | where daily > p98_daily OR daily > peer_mean + 3*peer_sd OR is_first_seen_for(peer_group)

      => alert "Anomalous cloud management access vs self/peer baseline"'
- question: After sessionizing web traffic to cloud management domains, does DBSCAN clustering reveal
    noise/outlier points or small atypical clusters indicative of unusual administrative activity?
  context: 'Unsupervised clustering can surface atypical cloud-management sessions that no rule anticipated.
    Apply DBSCAN to sessionized web traffic for cloud management domains using features such as session
    duration (conn.log), unique URIs (http.log), bytes transferred, and JA3/JA4. Flag noise/outlier points
    and small clusters, which indicate sessions that do not resemble the bulk of normal administrative
    behavior, and report the distinguishing features for each flagged session for analyst triage. Outliers
    and tiny clusters are the investigative leads (possible unauthorized cloud account configuration);
    dense, large clusters represent routine activity. This complements the peer-group statistics by grouping
    behavior rather than thresholding single metrics, catching multi-dimensional anomalies. Sources: [SHAP
    Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full),
    [Deep Learning for Unsupervised Insider Threat Detection](https://arxiv.org/abs/1710.00811).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "sessions = sessionize(http.log+conn.log+ssl.log where dest in cloud_mgmt_domains)\nX = [duration,\
      \ dcount_uri, bytes_total, ja3, ja4]\nlabels = DBSCAN(eps, min_samples).fit_predict(scale(X))\n\
      for s where label == -1 (noise) or cluster_size(label) < min_cluster:\n    alert(\"Atypical cloud\
      \ management session\", s.host, distinguishing_features(s))"
- question: Did a single internal source IP query or connect to the account-management or API domains
    of three or more distinct cloud service providers (AWS, Azure, GCP, DigitalOcean, Linode, etc.) within
    a 60-minute rolling window?
  context: 'An adversary ''shopping'' for cloud infrastructure often touches several providers in quick
    succession while evaluating or registering accounts - behavior rare for a single legitimate user.
    Maintain updated domain/IP-range lists for major cloud providers and write a SIEM rule that counts
    the distinct providers a source IP connects to within a 60-minute rolling window using Zeek dns.log
    and ssl.log SNI. Alert when a single host reaches three or more distinct providers in that window.
    A positive result is a strong lead for cloud account development/Resource Development and should trigger
    host and user review; isolated single-provider activity is normal. This symbolic rule is the front
    line for the percentile baseline and supervised classifier below, which add precision. Sources: [Zeek
    SSL/TLS Analyzer](https://docs.zeek.org/en/master/scripts/base/protocols/ssl/main.zeek.html), [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources: &id004
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - 'NAI: Corporate network egress points, internal DNS resolvers, and VPN user subnets.'
  range: Last 90 days (60-minute rolling window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'let providers = watchlist("cloud_provider_domains_and_ipranges")  // labeled by provider

      from (dns.log OR ssl.log) where (query in providers) OR (server_name in providers)

      | eval provider = lookup_provider(query, server_name)

      | window 60min by "id.orig_h"

      | stats distinct_providers=dcount(provider), providers=values(provider) by "id.orig_h"

      | where distinct_providers >= 3

      => alert "Single host contacting 3+ cloud providers in 60min"'
- question: Compared with the host's own daily baseline and its peer group (e.g., Developers, Sales),
    does the hourly count of distinct cloud providers contacted exceed the 99th percentile - especially
    when weighted toward account/console/API endpoints and accompanied by a high failed-connection/NXDOMAIN
    ratio?
  context: 'Legitimate multi-cloud usage exists (some developers genuinely span providers), so raw counts
    need baselining. For each host compute a daily baseline of distinct cloud providers contacted and
    compare hourly counts against that baseline and the host''s peer group. Alert if an hour''s total
    exceeds the 99th percentile for the host or its user group; weight provider account/console/API endpoints
    more heavily than marketing pages, and track the failed-connection/NXDOMAIN ratio as a distinct scripted-shopping
    signal. A host spiking above its peers while hitting consoles/APIs and generating many failed connections
    is a strong indicator of scripted cloud-account shopping; diverse but routine browsing of marketing
    pages is benign. This statistical refinement cuts false positives from the raw 3+-provider rule. Sources:
    [Identify Advanced Threats with UEBA in Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics),
    [Real-Time Detection of DNS Exfiltration and Tunneling](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources: *id004
  range: Last 90 days (30-day baseline, hourly evaluation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from (dns.log OR ssl.log OR conn.log) where dest in watchlist(\"cloud_provider_domains\")\n\
      | eval provider=lookup_provider(dest), is_console=endpoint_type(dest) in (account,console,api),\n\
      \        failed=(status>=400 OR rcode==\"NXDOMAIN\" OR conn_state in (S0,REJ))\n| bin span=1h by\
      \ \"id.orig_h\"\n| stats prov=dcount(provider), console_weight=sum(is_console),\n        fail_ratio=count(failed)/count()\
      \ by \"id.orig_h\",_time, peer_group\n| baseline p99(prov) over 30d by \"id.orig_h\"; peer_p99(prov)\
      \ by peer_group\n| where prov > p99_prov OR prov > peer_p99_prov\n=> alert \"Anomalous multi-cloud\
      \ shopping vs baseline/peer\""
- question: When a supervised classifier (e.g., Random Forest) scores multi-cloud activity, which sequences
    are predicted with high confidence as 'suspicious cloud shopping' based on provider set, inter-connection
    timing, marketing-vs-console/API ratio, bytes transferred, and TLS fingerprint?
  context: 'A supervised model can learn the nuanced signature of malicious cloud shopping from labeled
    examples, outperforming static thresholds. Train a Random Forest (or similar) on labeled multi-cloud
    activity using features such as the provider set, time between connections, the ratio of marketing
    pages vs console/API endpoints, total bytes transferred, and TLS client fingerprint. Flag sequences
    classified with high confidence as ''suspicious cloud shopping'' and surface the top-3 contributing
    features in the alert. High-confidence positives are prioritized leads for cloud account development;
