questions:
- question: '[Stealth] Can you determine whether zeek telemetry shows connections to or from an endpoint
    security agent or its management service on an unexpected port, destination, or HTTP resource path,
    sometimes paired with exploit-style notice events or abnormal file transfer content that suggests
    abuse of a defensive product vulnerability. -- specifically, using the ''Correlate exploit notices
    with security-management traffic and failure bursts'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the mission question is: Is the adversary
    exploiting software vulnerabilities to disable or bypass our defensive security controls? (PIR) Adversaries
    exploit software, service, or cloud-platform vulnerabilities to evade detection -- suppressing logging,
    crashing or hijacking defensive software, or operating inside trusted/unmonitored components so their
    activity blends in or disappears entirely. This evidence focuses on the condition that zeek telemetry
    shows connections to or from an endpoint security agent or its management service on an unexpected
    port, destination, or HTTP resource path, sometimes paired with exploit-style notice events or abnormal
    file transfer content that suggests abuse of a defensive product vulnerability. This Symbolic Logic
    approach looks for the following signal: Query Zeek notice.log for exploit signatures associated with
    security tooling, then join hits to conn.log, http.log, and files.log for the same destination host/service.
    Profile each management channel''s normal request structure (path tokens, parameter length/character
    distribution) as in [Anomaly Detection of Web-based Attacks](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf)
    and raise priority when a session matches a security-product CVE IOC, originates from a host that
    never administers that tool, or shows a burst of HTTP 4xx/5xx (or repeated blocked/reset conns) immediately
    followed by a 200 on a management path (failure-mode signal of exploitation success). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates that a security control, logging
    pipeline, or trusted component on this host/account may have been exploited to weaken or remove visibility;
    pivot to the responsible process/principal, its lineage and parent context, the targeted defensive
    service or log source, the surrounding service-state changes, and any gap in telemetry that follows.
    A negative result helps reduce confidence in this specific stealth-via-exploitation vector but should
    be corroborated with the other questions in this playbook, since a single method can miss a carefully
    staged exploit that defeats one signal while leaving others intact.'
