    of connection count per minute (Frequency), bytes sent/received and request entropy (Volume), destination
    diversity, and the 4xx/5xx-to-2xx ratio (State) from conn.log/http.log. Score new payloads with a
    per host/port/length byte-frequency model and Mahalanobis distance per [PAYL](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11),
