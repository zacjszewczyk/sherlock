    (e.g., bytes_out, entropy, dest_first_seen) in the alert. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates that a security control, logging pipeline, or trusted component
    on this host/account may have been exploited to weaken or remove visibility; pivot to the responsible
