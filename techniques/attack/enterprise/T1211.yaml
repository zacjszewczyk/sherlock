      failure bursts")

      // Query Zeek notice.log for exploit signatures associated with security tooling, then join hits
      to conn.log, http.log, and files.log for the s

      | ALERT enrich(host, user, process, parent, service, log_source, dest)'
  - technology: Zeek/pseudocode
    query: '# Network correlation for exploitation-for-stealth

      conn.log, http.log, files.log, notice.log

      | JOIN exploit notices/management traffic on (id.resp_h, service, time-window)

      | AGG bytes, request entropy, 4xx/5xx-to-2xx ratio, dest_first_seen

      | flag exploit-IOC or telemetry-collapse patterns per action criteria'
- question: '[Stealth] Can you determine whether zeek telemetry shows connections to or from an endpoint
