name: 'T1211: Exploitation for Stealth'
id: 32f5f48f-b5f8-437e-a36e-708d204eb3ce
description: 'This playbook helps an analyst investigate whether an adversary is exploiting software,
  service, or cloud-platform vulnerabilities to evade detection under the Stealth tactic -- hiding activity,
  suppressing logging, crashing or hijacking defensive software, or operating inside trusted and unmonitored
  components rather than overtly disabling controls. It guides the hunt across several behavioral angles
  spanning Windows, Linux, macOS, and cloud/SaaS control planes: network telemetry showing exploit-style
  notices or abnormal traffic to/from endpoint-security agents and their management services (Zeek conn/http/files/notice
  logs); Windows process creations that stop, reconfigure, or remove defensive services followed by service-state
  changes or telemetry loss (Event ID 4688/Sysmon 1 correlated with 7036/7040); security-service crashes
  or forced terminations followed by immediate discovery or beaconing (Event ID 1000/1001/7034/7031, Sysmon
  3, Zeek conn.log); previously blocked hashes/domains/IPs later appearing in successful execution or
  allow events, indicating a control was bypassed rather than merely logging the attempt; untrusted-content
  processes writing DLL/CPL files later loaded by a security process (Sysmon 1/7/11 search-order and side-loading
  abuse); and cloud/SaaS identities exploiting service flaws or excessive permissions to suppress audit
  logging (CloudTrail StopLogging/DeleteTrail/UpdateTrail/PutEventSelectors, log-group deletion, app consent)
  after which expected telemetry drops. Detection methods combine symbolic-logic rules, statistical baselining/change-point
  detection, and machine-learning models (autoencoders, LSTM next-event prediction, provenance-graph anomaly
  detection) applied to endpoint, network, and cloud audit telemetry so the analyst can corroborate suspected
  exploitation-for-stealth against process lineage, service state, block-volume trends, module-load chains,
  and gaps in expected logging.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
