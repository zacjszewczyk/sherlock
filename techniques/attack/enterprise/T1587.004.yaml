name: 'T1587.004: Exploits'
id: a69bc3b0-de8b-470b-9abc-2c6ad701bf51
description: 'Investigate evidence that an adversary is developing, testing, or refining custom exploits
  inside or adjacent to your environment (MITRE ATT&CK T1587.004, Resource Development). Although much
  exploit development occurs outside an organization''s visibility, this playbook focuses on the observable
  byproducts of in-house or lab-based exploit work: hosts repeatedly visiting exploit advisories, proof-of-concept
  (PoC) repositories, and vulnerability-disclosure sites; downloads of exploit source, PoC archives, fuzzing
  corpora, and debugger symbols; local extraction and analysis of those files; launches of compilers,
  debuggers, and fuzzers (afl, libfuzzer, honggfuzz, winafl, syzkaller, boofuzz, peach, windbg, x64dbg,
  gdb, lldb); and the canonical fuzzing artifact of an instrumented target crashing and restarting repeatedly
  after a build/debug/fuzz cycle. It helps an analyst distinguish sanctioned security research on allowlisted
  lab and research systems from unexpected exploit-iteration activity on developer laptops, build servers,
  sandbox hosts, and test VMs, using symbolic-logic correlation, statistical baselining, and sequence/graph
  machine-learning methods.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
