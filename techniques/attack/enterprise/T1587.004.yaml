questions:
- question: Which non-allowlisted hosts visit exploit writeups, vulnerability advisories, or proof-of-concept
    repositories and then download exploit source/PoC archives or launch a fuzzer, debugger, or compiler
    outside an approved build pipeline?
  context: 'Exploit development (T1587.004) under Resource Development often begins with research: an
    operator browses advisories and PoC mirrors, pulls down exploit source or fuzzing frameworks, then
    runs build/fuzz/debug tooling. This symbolic-logic check correlates Zeek dns.log/http.log/files.log
    against an allowlist of approved exploit-research domains, PoC repositories, and disclosure sites
    (built with passive-DNS features), and alerts when a host that is NOT a sanctioned research system
    either downloads exploit/PoC archives OR launches a watchlisted tool: afl-fuzz, libfuzzer, honggfuzz,
    winafl, syzkaller, boofuzz, peach, windbg.exe, x64dbg.exe, gdb, lldb, ImmunityDebugger, or cl.exe/clang/gcc/link.exe
    spawned outside approved build pipelines (Windows Event ID 4688 / Sysmon EID 1, plus PowerShell ScriptBlock
    logging via Event ID 4104). A positive hit on a non-research host is a strong signal of unsanctioned
    exploit work; suppress only for allowlisted research systems. Validate detection logic with Atomic
    Red Team.'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Security research workstations, developer laptops, lab networks, and sandbox hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  research_dns = dns.log/http.log WHERE domain NOT IN approved_research_allowlist\n  AND\
      \ (host downloaded_file IN {exploit_src,poc_archive,fuzz_corpus,debug_symbols}\n       OR proc IN\
      \ {afl-fuzz,libfuzzer,honggfuzz,winafl,syzkaller,boofuzz,peach,\n                   windbg.exe,x64dbg.exe,gdb,lldb,ImmunityDebugger,cl.exe,clang,gcc,link.exe})\n\
      \  WHERE host NOT IN research_system_allowlist\n  | join EID4688/EID4104 ON host WITHIN 1h | alert"
  - technology: Zeek/pseudocode
    query: ">-\n  files.log mime/ext IN {.tar.gz,.zip,.c,.py,.pdb} AND http.log host NOT IN allowlist\n\
      \  -> emit (src_host, fuid, url) for correlation with endpoint process launch"
- question: Are any hosts showing a statistically abnormal burst of exploit-research domain visits or
    compiler/debugger/fuzzer launches relative to their own history or their role peer group?
  context: 'Sanctioned research has a stable cadence; a sudden spike or a brand-new host engaging in exploit
    research is suspicious. Baseline per-host and peer-group daily counts of exploit-research domain visits
    and compiler/debugger/fuzzer launches from at least 30 days of your own telemetry, then alert on first-time
    hosts, role mismatches, and spikes exceeding mean+3σ or the 95th percentile after peer-group normalization.
    Add a failure-mode signal: a sustained rise in NXDOMAIN and HTTP 404 responses while probing PoC mirrors,
    scored as an elevated failed-to-successful request ratio (sequential-hypothesis-testing style). Score
    rare or newly-registered contacted domains using passive-DNS time/TTL/name features. A positive result
    means a host is deviating from established research behavior, warranting review of what it downloaded
    and ran.'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Security research workstations, developer laptops, lab networks, and sandbox hosts.'
  range: Last 90 days (baseline over >=30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per host,peer_group: cnt = daily(research_domain_visits + tool_launches)\n  mu,sigma\
      \ = stats(cnt, last_30d); p95 = pct(cnt,95)\n  alert IF cnt > max(mu+3*sigma, p95) OR host first_seen_today\n\
      \  failratio = (nxdomain+http404)/(total_req); alert IF failratio rising sustained"
- question: Does the ordered sequence of host activity (advisory browse -> source download -> archive
    extract -> compiler/debugger/fuzzer execution) deviate from the learned benign workflow for that user
    or workstation class?
  context: Exploit development leaves a characteristic ordered log-key stream. Train a per-user/workstation-class
    sequence model (stacked LSTM with top-g next-event thresholding, DeepLog-style) on the benign ordered
    host log stream and alert when the observed next event falls outside the top-g benign predictions
    — for example an unexpected fuzzer launch, a download from an anomalous host, or an out-of-order extract.
    Keep the deterministic correlation rule as the detection floor and emit the top-3 contributing events/features
    in each alert so analysts can triage quickly. A positive result indicates the host's activity sequence
    resembles exploit-development workflow rather than normal usage.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Security research workstations, developer laptops, lab networks, and sandbox hosts.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  seq = host_logkey_stream(browse,download,extract,compile,debug,fuzz)\n  model = DeepLog_LSTM(train=benign_seq_per_userclass)\n\
      \  IF observed_event NOT IN model.topg(next|history): alert(top3_contrib)"
- question: On which hosts does a compiler/debugger/fuzzer launch line up with repeated target-binary
    crashes (Windows Error Reporting 1000/1001) or three or more service restarts of the same binary within
    a 10-minute window?
  context: The instrumented-target + crash-and-restart loop is the defining artifact of fuzzing during
    exploit development. This symbolic-logic correlation links compiler/debugger/fuzzer launches (Windows
    Event ID 4688 / Sysmon EID 1, with process names from the fuzzing watchlist) to target crashes recorded
    in Windows Error Reporting Event ID 1000/1001, or to >=3 service restarts of the same target binary
    on the same host inside a 10-minute window. A positive correlation on a non-lab host strongly indicates
    active local fuzzing of a target. Suppress for allowlisted lab hosts and validate cadence with Atomic
    Red Team.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Zeek conn.log
  - 'NAI: Lab hosts, sandbox service endpoints, developer workstations, and test VMs.'
  range: Last 90 days (10-minute correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  build = EID4688 WHERE proc IN fuzz_build_watchlist\n  crash = EID1000 OR EID1001 OR\
      \ (service_restart same target_binary >=3)\n  alert IF build AND crash same host WITHIN 10m AND\
      \ host NOT IN lab_allowlist"
- question: Is the crash frequency or restart cadence for any target binary spiking above its normal range
    right after new build/test activity?
  context: Fuzzing iteration produces an abnormal rate of crashes relative to a binary's baseline. Baseline
    per-target-binary crash frequency and restart cadence (hourly/daily) and alert when crashes following
    new build/test activity exceed the 95th percentile or mean+3σ for that environment. Treat each crash/restart
    as a failure event and track the crash-to-clean-run ratio over a sliding window — a sharp ratio rise
    indicates fuzzing iteration. Complement with a system-call mismatch-count baseline (Sense-of-Self
    style) that spikes under fuzzing-induced abnormal execution paths. A positive result points to an
    instrumented target being hammered during exploit testing.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Zeek conn.log
  - 'NAI: Lab hosts, sandbox service endpoints, developer workstations, and test VMs.'
  range: Last 90 days (baseline over >=30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per target_binary: rate = crashes_per_hour; mu,sigma=stats(rate,30d); p95=pct(rate,95)\n\
      \  ratio = crashes/clean_runs (sliding window)\n  alert IF rate > max(mu+3*sigma,p95) AFTER new_build\
      \ OR ratio sharply rising"
- question: Do whole-system provenance subgraphs (build -> instrument -> spawn target -> crash) on a host
    match known exploit-iteration workflows?
  context: Exploit testing produces a recognizable process-and-crash subgraph. Build whole-system provenance-graph
    snapshots and classify build->instrument->spawn-target->crash subgraphs using graph embedding plus
    sequence classification (PROGRAPHER-style), or model the build/crash log-key sequence with DeepLog.
    Flag subgraphs matching known exploit-iteration workflows and surface the top-3 contributing nodes/features
    (fuzzer process, repeated crash edge, restart loop). A positive classification means the host's execution
    graph resembles fuzzing-driven exploit iteration rather than benign development, even when individual
    events look ordinary.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Zeek conn.log
  - 'NAI: Lab hosts, sandbox service endpoints, developer workstations, and test VMs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  G = provenance_graph(host); sub = extract(build->instrument->spawn->crash)\n  score\
      \ = PROGRAPHER_embed_classify(sub)  # or DeepLog over build/crash logkeys\n  IF score > thresh:\
      \ alert(top3_nodes: fuzzer_proc, crash_edge, restart_loop)"
- question: Which hosts outside the allowlisted research group download exploit source filenames, PoC
    archives, fuzzing corpora, or debugger-symbol packages, and do those files match exploit/shellcode
    YARA signatures when content-scanned?
  context: Acquiring exploit source and corpora is a precursor to building and refining exploits. Alert
    when Zeek files.log records exploit-source filenames, PoC archives, fuzzing corpora, or debugger-symbol
    packages downloaded by hosts outside the allowlisted research group, then content-scan the downloaded/extracted
    files with signature-base YARA rules for exploit/shellcode signatures to corroborate. Use fuzzing
    corpus/seed artifacts (large seed-file sets, crash-input archives) as additional file-pattern indicators,
    and record archive byte counts for volume context. A YARA-confirmed download on a non-research host
    is a high-confidence indicator of exploit acquisition.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Security research workstations, build servers, and isolated test environments.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  files.log WHERE (filename ~ exploit_src|poc|seed_corpus|crash_inputs OR ext IN {.pdb})\n\
      \  AND src_host NOT IN research_allowlist\n  -> yara_scan(extracted) for exploit/shellcode sigs;\
      \ record total_bytes"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  alert IF files.log_download(non_research_host) AND yara_match(exploit|shellcode)"
- question: Are any hosts downloading exploit archives, source code, or fuzzing corpora at a rate or byte
    volume far above their role peer group, especially from rare or newly-seen domains?
  context: Bulk or anomalous acquisition of exploit material stands out statistically. Baseline per-host
    and peer-group download rates and byte volumes for exploit archives, source code, and fuzzing corpora;
    flag downloads from hosts whose rate or volume departs more than 3σ from their role peer group, and
    score source-domain rarity with passive-DNS features (newly seen, low-TTL, anomalous name). Use Kitsune
    AfterImage incremental bandwidth/rate statistics to detect bursty download anomalies on your own flow
    telemetry. A positive result identifies hosts pulling unusual volumes of exploit research material,
    which merits inspection of the files and the host's role.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Security research workstations, build servers, and isolated test environments.'
  range: Last 90 days (baseline over >=30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per host,peer: rate=downloads/day; vol=bytes/day; mu,sigma=stats(peer,30d)\n  domain_rarity\
      \ = passiveDNS_score(src_domain)\n  alert IF (rate>mu+3*sigma OR vol>mu+3*sigma) AND domain_rarity\
      \ high"
- question: Does a host's download-then-open/extract behavior, combined with its HTTP request characteristics,
    resemble exploit-research cycles rather than normal browsing?
  context: Exploit research shows a repeated download-to-extract loop distinct from ordinary web browsing.
    Use a sequence model over file downloads and browser sessions (DeepLog) combined with multi-model
    HTTP-attribute profiling (request length, character distribution, structural model) to distinguish
    exploit-research download-then-open cycles from normal browsing; alert on repeated download-to-extract
    loops and emit the top-3 contributing features (download host, archive type, open/extract follow-on).
    A positive result flags a host whose acquisition-and-analysis pattern matches exploit-research behavior.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Security research workstations, build servers, and isolated test environments.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  feats = http_attrs(req_len,char_dist,struct) + dl_extract_sequence\n  model = DeepLog_seq\
      \ + kruegel_vigna_http_profiles\n  IF download->open/extract loop anomalous: alert(top3: dl_host,archive_type,extract)"
- question: Where do exploit test runs, compiler launches, or debugger sessions correlate with WER crashes
    (Event ID 1000/1001) and three or more restarts of the same target within a 10-minute window?
  context: Exploit testing against a lab target produces application faults and service restarts immediately
    after a build, debug, or fuzz cycle. This symbolic-logic linkage correlates exploit test runs, compiler
    launches, or debugger sessions (Windows Event ID 4688 / Sysmon EID 1, with the fuzzing watchlist)
    with Windows Event ID 1000/1001 crashes and >=3 service restarts of the same target within a 10-minute
    window — the canonical fuzzing signature of an instrumented target in a crash-and-restart loop. Suppress
    only for allowlisted test hosts. A positive correlation on an unexpected host indicates active exploit
    testing.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Zeek conn.log
  - 'NAI: Test hosts, lab application servers, and isolated proof-of-concept environments.'
  range: Last 90 days (10-minute correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  exec = EID4688 WHERE proc IN {compiler,debugger,fuzzer_watchlist}\n  fault = EID1000\
      \ OR EID1001 OR restart(same target >=3)\n  alert IF exec AND fault same host same target WITHIN\
      \ 10m AND host NOT IN test_allowlist"
- question: Is the per-target crash rate spiking above mean+3σ or the 99th percentile right after a new
    build or fuzzer run, and does a high-confidence crash burst trip a sequential ratio test?
  context: Targeted exploit iteration produces tight bursts of crashes. Baseline the hourly/daily crash
    rate per test target and flag spikes exceeding mean+3σ or the 99th percentile after a new build or
    fuzzer run, using thresholds derived from at least 30 days of your own data. Treat crash/restart as
    failure events and apply an SPRT-style failed-to-successful ratio test so that even a small number
    of high-confidence crash bursts triggers quickly. Raise system-call mismatch counts (Sense-of-Self
    style) as a corroborating abnormal-execution signal. A positive result indicates a target being driven
    into faults during exploit testing.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Zeek conn.log
  - 'NAI: Test hosts, lab application servers, and isolated proof-of-concept environments.'
  range: Last 90 days (baseline over >=30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per target: rate=crashes_per_hour; mu,sigma=stats(rate,30d); p99=pct(rate,99)\n  SPRT(fail=crash,success=clean_run)\
      \ -> quick trigger on high-confidence burst\n  alert IF rate>max(mu+3*sigma,p99) AFTER new_build/fuzz\
      \ OR SPRT_decision=positive"
- question: When scored against known-good versus exploit-testing sequences, does a host's process-creation,
    crash, and connection activity resemble exploit iteration rather than normal development?
  context: Distinguishing legitimate development crashes from exploit iteration benefits from a learned
    model. Train on known-good versus exploit-testing sequences using process-creation, crash, and connection
    features; score live sequences with a provenance-graph classifier (PROGRAPHER) or an unsupervised
    autoencoder (Kitsune, per-feature reconstruction error) and alert when activity resembles exploit
    iteration. Keep deterministic crash-linkage as the detection floor and surface the top-3 contributing
    features. A positive result means the host's behavior matches exploit-testing patterns even when individual
    crashes might look like ordinary debugging.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Zeek conn.log
  - 'NAI: Test hosts, lab application servers, and isolated proof-of-concept environments.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  feats = proc_create + crash_events + conn.log features\n  score = PROGRAPHER_classify(seq)\
      \ OR Kitsune_autoencoder.recon_error(feats)\n  IF score > thresh: alert(top3_contrib_features) ;\
      \ floor=crash_linkage_rule"
- question: Which hosts repeatedly return to the same exploit-advisory/repository domains and then download
    and locally open/extract files, including renamed or copied fuzzers and debuggers reused across refinement
    cycles?
  context: Building and refining a PoC leaves a visible browse->download->open pattern that repeats. Correlate
    repeated visits to exploit-advisory/repository domains (Zeek dns.log/http.log, allowlist from passive
    DNS) with subsequent file downloads and local opens/extracts on the same host (files.log + Event ID
    4688), suppressing only allowlisted research systems. Add a hash-vs-name check (CAR-2013-05-009) over
    Event ID 4688 / Sysmon EID 1 to catch renamed/copied fuzzers, debuggers, and PoC binaries reused across
    refinement cycles. A positive result on a non-research host indicates active PoC refinement, and the
    hash-vs-name check defeats simple renaming evasion.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Research workstations, build environments, and isolated lab networks.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  browse = dns.log/http.log repeat_visits(advisory_repo_domain NOT IN allowlist)\n  followon\
      \ = files.log_download + EID4688 open/extract same host\n  hashcheck = EID4688 WHERE image_hash\
      \ known_tool BUT image_name != expected (CAR-2013-05-009)\n  alert IF browse AND followon AND host\
      \ NOT IN research_allowlist (OR hashcheck hit)"
- question: Which hosts show a daily browse-download-open cycle count above the 95th percentile or sudden
    growth over a 30-day baseline, with elevated 404/NXDOMAIN failures against advisory/PoC hosts?
  context: Iterative PoC refinement multiplies the browse-download-open cycle far above normal browsing.
    Baseline the number of browse-download-open cycles per host and flag hosts whose daily cycle count
    exceeds the 95th percentile or shows sudden growth over a 30-day baseline. Apply per-attribute statistical
    profiling (Kruegel/Vigna) to request/file features and passive-DNS rarity scoring to contacted domains
    to separate refinement loops from ordinary browsing, and track 404/NXDOMAIN failures against advisory/PoC
    hosts as a distinct signal of probing dead mirrors. A positive result identifies a host engaged in
    a repetitive research-refinement loop.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Research workstations, build environments, and isolated lab networks.'
  range: Last 90 days (baseline over 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per host: cycles = count(browse->download->open per day)\n  mu=baseline(30d); p95=pct(cycles,95)\n\
      \  fails = http404+nxdomain to advisory/poc hosts\n  alert IF cycles>p95 OR cycles growth_sudden\
      \ OR fails elevated"
- question: Do repeated advisory -> download -> test loops that each end in a crash or rebuild on a host
    show high similarity to learned exploit-refinement behavior?
  context: Exploit refinement is a repeated loop terminating in a crash or rebuild. Use a time-series/sequence
    model (DeepLog) or provenance-graph snapshot embedding (PROGRAPHER) to detect repeated advisory->download->test
    loops where each loop ends in a crash or rebuild; alert on sequences with high similarity to exploit-refinement
    behavior and emit the top-3 contributing features (loop count, terminal crash edge, repeated target
    binary). A positive result means the host's overall activity matches the iterative refinement pattern
    of exploit development, tying together browse, download, open, and crash signals.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Research workstations, build environments, and isolated lab networks.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  loops = sequence(advisory->download->test->[crash|rebuild]) per host\n  score = DeepLog_seq(loops)\
      \ OR PROGRAPHER_embed(snapshot)\n  IF similarity_to_refinement > thresh: alert(top3: loop_count,crash_edge,target_binary)"
