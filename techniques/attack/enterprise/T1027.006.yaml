name: 'T1027.006: Obfuscated Files or Information: HTML Smuggling'
id: 950e7704-a254-490a-b668-ea0adc004196
description: 'Hunt for HTML Smuggling, an evasive delivery technique in which adversaries hide malicious
  payloads inside seemingly benign HTML/JavaScript files so they bypass content filters, web proxies,
  and MIME/byte inspection. Because the payload is assembled client-side from JavaScript Blobs or base64
  Data URLs and written to disk via primitives like msSaveBlob or an anchor download attribute, there
  is frequently no matching large binary transfer on the wire for the same URL. This playbook helps an
  analyst investigate suspicious HTML downloads end to end: correlating download sources and file hashes
  against threat intelligence, detecting the absence of an expected binary transfer that betrays local
  Blob assembly, profiling rare or mostly-blocked download sources, inspecting HTML/JS content for co-occurring
  smuggling primitives (Blob, atob, createObjectURL, msSaveOrOpenBlob, download=, a.click()), measuring
  oversized files, high script-to-markup ratios, large embedded base64 blobs and elevated entropy, and
  tracking the endpoint follow-through where a browser spawns a script interpreter or unsigned executable
  from a temp/download path, where a smuggled ISO/IMG is mounted, or where the Mark-of-the-Web (Zone.Identifier
  ADS) is stripped before execution. It combines symbolic-logic tripwires, statistical baselining, and
  machine-learning classifiers across Zeek network telemetry, Windows Event Logs, Sysmon, auditd, and
  macOS telemetry to expose payload delivery that evades traditional network defenses.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any text/html downloads originate from source IPs, domains, or carry SHA1/file hashes that
    match curated threat-intelligence feeds and known-malicious hash lists, and does the receiving host
    subsequently write a file tagged with a Zone.Identifier / Mark-of-the-Web stream?
  context: 'This is the fastest, most defensible starting point: deterministic intelligence correlation
    tells the analyst whether the host pulled HTML from infrastructure already tied to malware or operator
    tooling. Join Zeek conn.log/http.log source IPs and hosts plus the SHA1 of extracted text/html objects
    against TI feeds and malicious hash lists, then prioritize cases where the same client writes a file
    carrying a Zone.Identifier/Mark-of-the-Web tag shortly afterward. HTML smuggling deliberately delivers
    payloads as benign text/html, so byte- and MIME-based inspection alone fails; intelligence on the
    source and a follow-on tagged file write is therefore a strong, low-noise signal. A positive match
    warrants immediate host triage; a negative result does not clear the host because smuggling often
    uses fresh, un-attributed infrastructure, so continue to the content and behavioral questions. This
    evidence supports the Stealth tactic objective of the adversary remaining indistinguishable from benign
    activity while delivering payloads. Sources: [HTML Smuggling Explained, Outflank](https://www.outflank.nl/blog/2018/08/14/html-smuggling-explained/).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Network egress points, including firewalls and web proxies, and DNS resolvers.'
  range: Last 90 days, prioritizing the most recent 24 hours and correlating each download to file writes
    within 5 minutes on the same client.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN zeek_http, zeek_conn, zeek_files ON uid WHERE mime_type=='text/html'; MATCH src_ip, host,
      files.sha1 AGAINST ti_feeds, malicious_hash_list; CORRELATE client_ip TO endpoint_file_create WHERE
      zone_identifier_present AND time_delta<=5m; RETURN uid, src_ip, host, sha1, dropped_path, host_url
- question: For each HTML page that was followed by a file write or execution on the client, was there
    NO large (>500KB) non-HTML HTTP object retrieved from the same URL/host in the preceding 5 minutes,
    indicating the payload was assembled locally from a JavaScript Blob rather than downloaded?
  context: 'This question targets the defining state signature of HTML smuggling: a payload appears on
    disk with no matching binary transfer on the wire. Because the malicious file is reconstructed client-side
    from an embedded Blob or Data URL, the proxy/NSM record shows only a text/html retrieval, never the
    executable itself. For every HTML download, check whether a follow-on file write/execution occurred
    on the client while no large (>500KB) non-HTML HTTP object was retrieved from the same URL/host in
    the prior 5 minutes. A positive result (file on disk, no transfer) is highly discriminating and difficult
    for the adversary to avoid without giving up the smuggling advantage. A negative result (a real binary
    transfer exists) suggests a conventional download and lowers priority for this technique. This evidence
    supports the Stealth tactic objective of the adversary remaining indistinguishable from benign activity
    while delivering payloads. Sources: [HTML Smuggling Surges, Microsoft](https://www.microsoft.com/en-us/security/blog/2021/11/11/html-smuggling-surges-highly-evasive-loader-technique-increasingly-used-in-banking-malware-targeted-attacks/).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Network egress points, including firewalls and web proxies, and DNS resolvers.'
  range: Last 90 days, evaluating a 5-minute lookback window from each file-write/execution event back
    to HTTP retrievals.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: 'FOR each endpoint_file_create OR process_exec ON client: window = [t-5m, t]; html_hit = EXISTS(zeek_http
      WHERE client_ip==host AND mime==''text/html'' IN window); big_obj = EXISTS(zeek_http/zeek_files
      WHERE client_ip==host AND mime!=''text/html'' AND resp_bytes>500KB AND same_host IN window); ALERT
      WHEN html_hit AND NOT big_obj; RETURN client, url, dropped_path'
- question: Which source hosts show a download pattern dominated by blocked or forbidden HTML retrievals
    (HTTP 403/404 and proxy-blocks) punctuated by a few successful text/html deliveries that feed file
    drops on the client?
  context: 'Adversaries probing or rotating smuggling infrastructure often generate many failed or proxy-blocked
    retrievals before a successful delivery slips through. Track per-source-host rates of blocked/forbidden
    (403/404) and proxy-blocked HTML retrievals alongside successful ones; a host whose traffic is mostly
    blocked but occasionally succeeds in delivering text/html that then feeds a file drop is a distinct,
    high-priority failure-mode signal. This statistical view surfaces the evasion attempts that precede
    a successful smuggle and helps distinguish targeted delivery from routine browsing, where success
    rates are high and consistent. A positive result is a host with a skewed block-to-success ratio tied
    to downstream file writes; a uniformly successful or purely-blocked host without drops is lower priority.
    This evidence supports the Stealth tactic objective of the adversary remaining indistinguishable from
    benign activity while delivering payloads. Sources: [Prophiler, Canali et al.](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Network egress points, including firewalls and web proxies, and DNS resolvers.'
  range: Last 90 days, aggregated per source host with daily and weekly rollups of status-code outcomes.
  queries:
  - technology: SIEM/Stats pseudocode
    query: STATS count BY src_host, status_class(2xx/403/404/proxy_block) WHERE mime=='text/html'; COMPUTE
      block_ratio = (blocked+forbidden)/total; JOIN successful_html TO downstream_file_create ON client;
      ALERT WHEN block_ratio>0.7 AND successful_html_count>=1 AND downstream_drop==true
- question: Which HTML downloads come from source IPs or domains that are statistically rare for this
    environment over the last 90 days, especially when combined with young domain age and poor ASN reputation,
    scoring above the rarity threshold?
  context: 'Smuggling payloads are frequently hosted on newly registered or seldom-seen infrastructure
    that stands out against an environment''s normal browsing baseline. Compute 90-day frequency percentiles
    for the source IPs and domains of HTML downloads, then fold in domain age and ASN reputation to produce
    a composite risk score, alerting when scores exceed a high-rarity threshold (e.g., 99.5th percentile).
    The percentile threshold must be tuned per environment to balance noise against coverage. A high score
    indicates a source virtually never contacted by your users hosting an HTML file — a hallmark of disposable
    delivery infrastructure. Common, well-aged, reputable sources score low and are deprioritized. Use
    this to rank candidate downloads for deeper content and behavioral analysis. This evidence supports
    the Stealth tactic objective of the adversary remaining indistinguishable from benign activity while
    delivering payloads. Sources: [Prophiler, Canali et al.](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Network egress points, including firewalls and web proxies, and DNS resolvers.'
  range: Last 90 days for the frequency baseline; score new downloads continuously against it.
  queries:
  - technology: SIEM/Stats pseudocode
    query: BASELINE freq_pct(src_ip, domain) OVER 90d FOR mime=='text/html'; risk = w1*rarity_pct + w2*(1/domain_age_days)
      + w3*asn_reputation_penalty; ALERT WHEN rarity_pct>=99.5 OR risk>threshold; RETURN domain, src_ip,
      rarity_pct, domain_age, asn_rep, risk
- question: When a trained Random Forest scores an HTML download on combined HTML/JS/URL features (script-to-markup
    ratio, long-string/base64 counts, IP/ASN reputation, JA3, URI, MIME, browsing history) does the predicted-malicious
    probability exceed 0.9, and which top-3 features drove the score?
  context: 'Hand-written rules miss novel or lightly-obfuscated smuggling pages, so a supervised classifier
    generalizes across the feature space that distinguishes smuggled HTML from benign pages. Run a Random
    Forest trained on HTML+JS+URL features — script-to-markup ratio, counts and lengths of long/base64
    strings, source IP/ASN reputation, JA3 TLS fingerprint, URI structure, MIME, and request history —
    and alert when the predicted malicious probability exceeds 0.9. Surface the top-3 contributing features
    (for example base64-string-count, script-ratio, domain-age) so the analyst can validate the verdict
    rather than trusting a black box. High-confidence alerts with explainable drivers merit triage; low-probability
    scores reduce priority but should still be cross-checked against the symbolic and statistical signals
    because the model can lag novel obfuscation. This evidence supports the Stealth tactic objective of
    the adversary remaining indistinguishable from benign activity while delivering payloads. Sources:
    [Prophiler, Canali et al.](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf), [JaSt,
    Fass et al.](https://swag.cispa.saarland/papers/fass2018jast.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Network egress points, including firewalls and web proxies, and DNS resolvers.'
  range: Last 90 days for scoring; retrain periodically on labeled benign/malicious HTML corpora.
  queries:
  - technology: ML/Scoring pseudocode
    query: 'X = features(html: script_markup_ratio, base64_count, longstring_count; url: uri, domain_age,
      asn_rep, ja3, mime, history); p = random_forest.predict_proba(X)[malicious]; IF p>0.9: ALERT with
      top3=shap_importance(X); RETURN url, p, top3'
- question: Do extracted text/html or application/javascript objects contain co-occurring smuggling primitives
    in the same script — blob/data-URI creation and decode keywords (Blob, atob, URL.createObjectURL,
    msSaveOrOpenBlob, msSaveBlob) together with browser download-initiation keywords (download=, a.click())?
  context: 'These primitives are the defining mechanics of HTML smuggling: code that decodes embedded
    data into a Blob and then forces the browser to save it as a file. Run Yara rules or regex across
    extracted text/html and application/javascript content and flag scripts where blob/data-URI creation/decode
    keywords co-occur with download-initiation keywords inside the same file. The co-occurrence is what
    matters — any one keyword alone is common, but the decode-to-blob-to-download chain in one script
    is strongly indicative of smuggling. A positive hit gives the analyst a concrete code excerpt to confirm
    intent; a negative result on a content-extraction sensor does not fully clear the file because heavy
    obfuscation can split or rename the primitives, so pair this with the entropy, volume, and AST/ML
    questions. This evidence supports the Stealth tactic objective of the adversary remaining indistinguishable
    from benign activity while delivering payloads. Sources: [HTML Smuggling Explained, Outflank](https://www.outflank.nl/blog/2018/08/14/html-smuggling-explained/),
    [HTML Smuggling Surges, Microsoft](https://www.microsoft.com/en-us/security/blog/2021/11/11/html-smuggling-surges-highly-evasive-loader-technique-increasingly-used-in-banking-malware-targeted-attacks/).'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network Security Monitoring (NSM) sensors with file extraction capabilities, Web Content Filters.'
  range: Last 90 days against all extracted web script/HTML content.
  queries:
  - technology: NSM/Yara-regex pseudocode
    query: 'ON files.log WHERE mime IN (''text/html'',''application/javascript''): create_decode = MATCH
      any(Blob, atob, URL.createObjectURL, msSaveOrOpenBlob, msSaveBlob); download_init = MATCH any(''download='',
      ''a.click()'', ''msSaveBlob''); ALERT WHEN create_decode AND download_init IN same_object; RETURN
      fuid, host, matched_keywords'
- question: Within each HTML file, how many distinct smuggling primitive classes are present and what
    is the total byte length of embedded base64/data-URI strings — do at least two primitive classes co-occur
    AND does embedded base64 length exceed the 95th percentile of the benign HTML baseline?
  context: 'Beyond presence/absence, the quantity of smuggling machinery and the size of embedded encoded
    data sharpen the signal. For each HTML file count the occurrences and total byte length of base64/data-URI
    strings and the number of distinct smuggling primitive classes present, then alert when two or more
    primitive classes co-occur and the embedded base64 length exceeds the 95th percentile of your benign
    HTML baseline (real payloads commonly run tens of KB to several MB). This combines a structural condition
    (multiple primitive classes) with a volumetric one (large encoded payload) to separate genuine smuggling
    from benign pages that may legitimately use one primitive with small data. A positive result indicates
    an HTML file carrying a substantial encoded payload with the full decode/download toolkit; benign
    pages rarely satisfy both conditions. This evidence supports the Stealth tactic objective of the adversary
    remaining indistinguishable from benign activity while delivering payloads. Sources: [Prophiler, Canali
    et al.](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network Security Monitoring (NSM) sensors with file extraction capabilities, Web Content Filters.'
  range: Last 90 days; recompute the benign base64-length baseline on a rolling 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each html_object: prim_classes = distinct({create_decode, blob, download_init}); b64_len
      = sum(len(base64_strings)); ALERT WHEN count(prim_classes)>=2 AND b64_len > p95(benign_html_b64_len);
      RETURN fuid, prim_classes, b64_len'
- question: After a symbolic match, does the Shannon entropy of the matched script block or embedded string
    exceed the 98th percentile of the benign baseline — approaching the packed/encrypted range (>7.2)
    rather than low-entropy markup?
  context: 'Encrypted or compressed payloads embedded in HTML exhibit much higher byte entropy than ordinary
    markup, so entropy is a reliable second-stage confirmation after a keyword/structure match. Compute
    Shannon entropy for the matched script block or embedded string and alert when it exceeds the 98th
    percentile of the benign baseline; embedded encrypted/compressed payloads push toward the packed range
    (>7.2 bits/byte), while normal HTML and readable script sit well below. Using entropy only after a
    symbolic match keeps false positives low and gives the analyst confidence that the high-entropy region
    corresponds to a real smuggled blob rather than, say, a legitimate inline image. A positive result
    strongly supports an obfuscated payload; lower entropy suggests plain or lightly-encoded content and
    may indicate a benign page or a different obfuscation strategy. This evidence supports the Stealth
    tactic objective of the adversary remaining indistinguishable from benign activity while delivering
    payloads. Sources: [Using Entropy Analysis, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989),
    [Baseline Payload Entropy Values, Future Internet 2024](https://www.mdpi.com/1999-5903/16/12/470).'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network Security Monitoring (NSM) sensors with file extraction capabilities, Web Content Filters.'
  range: Last 90 days on matched script blocks; maintain a rolling benign entropy baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR matched_block IN symbolic_hits: H = shannon_entropy(block_bytes); ALERT WHEN H > p98(benign_block_entropy)
      OR H > 7.2; RETURN fuid, block_offset, H'
- question: Does an AST-based or program-dependency-graph classifier (syntactic n-grams with Random Forest,
    or control+data-flow model) label an extracted script as malicious by capturing the decode->blob->download
    chain despite surface obfuscation, and what top-3 AST/flow features drove it?
  context: 'Sophisticated actors obfuscate smuggling scripts (renaming, string-splitting, encoding) to
    defeat keyword and regex detection, but the underlying syntactic structure and data flow remain recognizable.
    Classify extracted scripts with an AST-based model — n-grams of syntactic units fed to a Random Forest,
    or a program-dependency-graph model over control and data flow — that is resilient to surface obfuscation
    and captures the decode-to-blob-to-download chain regardless of identifier names. Report the top-3
    predictive AST/flow features so the analyst can interpret the verdict. This catches the evasive cases
    that the symbolic and entropy checks miss, completing coverage for the content-inspection NAI. A positive,
    explainable classification on an obfuscated script is high-value; a benign verdict still benefits
    from cross-checking against volumetric and behavioral evidence. This evidence supports the Stealth
    tactic objective of the adversary remaining indistinguishable from benign activity while delivering
    payloads. Sources: [JaSt, Fass et al.](https://swag.cispa.saarland/papers/fass2018jast.pdf), [JStap,
    Fass et al.](https://swag.cispa.saarland/papers/fass2019jstap.pdf), [ZOZZLE, Curtsinger et al.](https://www.usenix.org/legacy/event/sec11/tech/full_papers/Curtsinger.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network Security Monitoring (NSM) sensors with file extraction capabilities, Web Content Filters.'
  range: Last 90 days for scoring; retrain on labeled benign/malicious JS corpora periodically.
  queries:
  - technology: ML/AST-dataflow pseudocode
    query: 'ast = parse(script); feats = ngram(ast_units) + pdg_flow_features(decode->blob->download);
      p = ast_model.predict_proba(feats)[malicious]; IF p>0.9: ALERT with top3=feature_importance(feats);
      RETURN fuid, p, top3'
- question: Which text/html downloads in Zeek files.log exceed 2MB total bytes — a size legitimate HTML
    pages rarely reach but that smuggled payloads inflate through embedded base64?
  context: 'A simple, high-value tripwire: legitimate HTML documents are almost never multiple megabytes,
    whereas smuggling inflates the file because the entire payload is embedded as base64 inside it. Filter
    Zeek files.log for text/html downloads with total_bytes greater than 2MB and alert as a high-priority
    signal. This deterministic threshold is cheap, explainable, and hard for the adversary to evade without
    sacrificing the payload, making it an excellent first-pass filter that feeds the entropy, primitive-count,
    and ML checks. A positive result is an oversized HTML object warranting content extraction and inspection;
    normal-sized HTML passes through and is handled by the statistical and content questions. Tune the
    2MB threshold if your environment serves unusually large legitimate HTML. This evidence supports the
    Stealth tactic objective of the adversary remaining indistinguishable from benign activity while delivering
    payloads. Sources: [HTML Smuggling Surges, Microsoft](https://www.microsoft.com/en-us/security/blog/2021/11/11/html-smuggling-surges-highly-evasive-loader-technique-increasingly-used-in-banking-malware-targeted-attacks/),
    [Prophiler, Canali et al.](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Network Security Monitoring sensor data lake, Web Proxy logs.'
  range: Last 90 days of extracted text/html objects.
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM files.log WHERE mime_type==''text/html'' AND total_bytes > 2*1024*1024: ALERT priority=high;
      RETURN fuid, tx_hosts, rx_hosts, total_bytes, source_url'
- question: Does the multivariate Mahalanobis distance of a new HTML download — across size, script-to-markup
    ratio, base64 string lengths/counts, and string entropy versus a 30-day baseline — exceed 3 standard
    deviations?
  context: 'Single-metric thresholds miss HTML files that are individually plausible but jointly anomalous.
    Baseline 30-day statistics for file size, script-to-markup ratio, base64 string lengths and counts,
    and string entropy, then compute the Mahalanobis distance of each new HTML download against that multivariate
    baseline and alert when the distance exceeds 3 standard deviations. Because Mahalanobis accounts for
    correlations among features, it catches subtle combinations — moderate size with elevated script ratio
    and high entropy — that no single rule would flag. Thresholds must be derived per environment. A positive
    result is an HTML file that deviates significantly from your population of normal pages, prompting
    content extraction; in-distribution files are deprioritized. This complements the deterministic oversize
    tripwire by catching smaller but structurally unusual smuggling files. This evidence supports the
    Stealth tactic objective of the adversary remaining indistinguishable from benign activity while delivering
    payloads. Sources: [Prophiler, Canali et al.](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf),
    [Using Entropy Analysis, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Network Security Monitoring sensor data lake, Web Proxy logs.'
  range: Last 90 days for scoring against a rolling 30-day feature baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'BASELINE mean,cov OVER 30d FOR [size, script_markup_ratio, b64_len, b64_count, str_entropy]
      ON text/html; FOR new_html: d = mahalanobis(x, mean, cov); ALERT WHEN d > 3*std; RETURN fuid, d,
      contributing_dims'
- question: When DBSCAN clusters HTML downloads on size, script ratio, entropy, encoded-string counts,
    and eval/unescape/document.write counts, which files land in small or distant outlier clusters, and
    which features placed them there?
  context: 'Unsupervised clustering surfaces emergent smuggling patterns without needing labels, grouping
    the bulk of benign HTML together and isolating unusual files as outliers. Run DBSCAN on features including
    size, script-to-markup ratio, entropy, encoded-string counts, and counts of eval/unescape/document.write,
    then investigate files landing in small or distant outlier clusters. List the features that placed
    each file in its outlier cluster to give the analyst an interpretable starting point. This catches
    families of smuggling pages that share a distinctive feature signature and any one-off oddities that
    fall outside the dense benign core. A file in a tight benign cluster is low priority; an outlier with
    high encoded-string and dynamic-eval counts is a strong candidate for content inspection. This evidence
    supports the Stealth tactic objective of the adversary remaining indistinguishable from benign activity
    while delivering payloads. Sources: [Prophiler, Canali et al.](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf),
    [Cujo, Rieck et al.](https://mlsec.org/docs/2010-acsac.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Network Security Monitoring sensor data lake, Web Proxy logs.'
  range: Last 90 days of HTML download features, re-clustered on a regular cadence.
  queries:
  - technology: ML/Clustering pseudocode
    query: X = features(size, script_ratio, entropy, encoded_str_count, eval_unescape_docwrite_count);
      labels = DBSCAN(eps, min_samples).fit(X); outliers = points WHERE label==-1 OR cluster_size<min;
      RETURN fuid, cluster, distinguishing_features(outlier)
- question: Does a browser-recorded download of a smuggling-prone file type (.html/.iso/.img/.zip/.js)
    get followed within ~90 seconds by execution of powershell/wscript/cscript/mshta or an executable
    from Downloads/AppData\Local\Temp, spawned by that browser?
  context: 'This is the endpoint payoff of smuggling: once the file is assembled and dropped, the user
    or script launches it, producing a browser-to-interpreter or browser-to-temp-executable lineage in
    a tight time window. Trigger when Zeek files.log or Sysmon EID11 records a download of .html/.iso/.img/.zip/.js
    and within 90 seconds Windows Event ID 4688 (or auditd execve, or macOS process telemetry) logs powershell/wscript/cscript/mshta
    — or an executable from Downloads/AppData\Local\Temp — spawned by a browser process. The short window
    and the suspicious parent-child relationship make this highly indicative of payload execution following
    delivery. A positive result is an actionable incident lead with full process lineage; a download with
    no follow-on execution is lower priority but still worth retaining for context. This evidence supports
    the Stealth tactic objective of the adversary remaining indistinguishable from benign activity while
    delivering payloads. Sources: [HTML Smuggling Surges, Microsoft](https://www.microsoft.com/en-us/security/blog/2021/11/11/html-smuggling-surges-highly-evasive-loader-technique-increasingly-used-in-banking-malware-targeted-attacks/),
    [Suspicious Browser Child Process, Elastic](https://github.com/elastic/detection-rules/blob/main/rules/macos/execution_initial_access_suspicious_browser_childproc.toml).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - WinEventLog:Sysmon EventCode=11
  - WinEventLog:Sysmon EventCode=15
  - WinEventLog:Sysmon EventCode=23
  - Zeek files.log
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: User Workstations, Virtual Desktop Infrastructure (VDI) fleet, Terminal Servers.'
  range: Last 90 days, correlating downloads to child-process executions within a 90-second window.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: dl = (sysmon_eid11 OR zeek_files) WHERE ext IN ('.html','.iso','.img','.zip','.js'); exec =
      (winevent_4688 OR auditd_execve OR macos_proc) WHERE child IN (powershell,wscript,cscript,mshta)
      OR child_path IN (Downloads, AppData\Local\Temp) AND parent IN browsers; ALERT WHEN exec.host==dl.host
      AND 0<exec.time-dl.time<=90s; RETURN host, dl_file, parent, child, cmdline
- question: On browser-dropped files, what does the Zone.Identifier ADS HostUrl/ReferrerUrl show (smuggling
    sets HostUrl=about:internet), and was the :Zone.Identifier stream deleted by a non-browser process
    before execution as a SmartScreen-evasion step?
  context: 'The Mark-of-the-Web (Zone.Identifier ADS) records a file''s internet origin and triggers SmartScreen/protected-view
    warnings; smuggling artifacts characteristically carry HostUrl=about:internet because the file was
    synthesized locally rather than downloaded from a named URL, and adversaries often strip the stream
    to bypass the warning. Use Sysmon EID15 to read the Zone.Identifier ADS HostUrl/ReferrerUrl on browser-dropped
    files and flag the about:internet signature, then flag deletion of the :Zone.Identifier stream by
    a non-browser process (Sysmon EID23/26) as a deliberate evasion step preceding execution. A positive
    result on either condition — the about:internet marker or an unexpected ADS deletion — is a strong
    indicator of smuggling and SmartScreen evasion; files retaining a normal HostUrl from a legitimate
    download are lower priority. This evidence supports the Stealth tactic objective of the adversary
    remaining indistinguishable from benign activity while delivering payloads. Sources: [ADS Zone.Identifier
    Deleted By Uncommon Application, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_delete/file_delete_win_zone_identifier_ads_uncommon.yml).'
