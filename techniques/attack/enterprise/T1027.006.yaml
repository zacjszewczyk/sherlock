- question: Does an LSTM/sequence-autoencoder trained on host event sequences (download, file-create,
    process, connection) produce high reconstruction error for a browser-download-immediately-followed-by-suspicious-script-execution
    pattern, and which top-3 steps are most anomalous?
  context: 'The smuggling kill chain unfolds as an ordered sequence of host events — download, file creation,
    process execution, network connection — that differs from normal user activity in its timing and composition.
    Train an LSTM or sequence autoencoder on host event sequences and alert on high reconstruction error,
    such as a browser download immediately followed by suspicious script execution, surfacing the top-3
    anomalous steps for the analyst. Sequence modeling captures temporal and ordering relationships that
    point-in-time rules miss, catching novel variants of the delivery-to-execution chain. A high reconstruction
    error with an interpretable anomalous subsequence is a strong lead; well-reconstructed (normal) sequences
    are deprioritized. Use this as the behavioral capstone that ties together the network delivery and
    endpoint execution evidence. This evidence supports the Stealth tactic objective of the adversary
    remaining indistinguishable from benign activity while delivering payloads. Sources: [Cujo, Rieck
    et al.](https://mlsec.org/docs/2010-acsac.pdf), [JStap, Fass et al.](https://swag.cispa.saarland/papers/fass2019jstap.pdf).'
