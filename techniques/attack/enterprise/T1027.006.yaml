- question: Across the fleet, which browser parent-to-child process relationships fall into the bottom
    1st percentile of prevalence, and on how few distinct hosts has that lineage ever been observed?
  context: 'Normal browsers spawn a predictable, narrow set of child processes; a browser spawning an
    unusual interpreter or binary is rare and suspicious. Build probability/prevalence tables for browser
    parent-child relationships across the fleet and alert when a relationship falls into the bottom 1st
    percentile, also tracking how many distinct hosts have ever exhibited the lineage as a rarity measure.
    This statistical approach catches smuggling execution chains even when the specific binaries are novel,
    because the rarity of the parent-child pairing itself is the signal. A positive result is a browser-to-child
    relationship seen on very few hosts and at very low prevalence — exactly what a smuggled payload launch
    looks like; common, widely-seen lineages (browser->updater, browser->helper) are deprioritized. This
    evidence supports the Stealth tactic objective of the adversary remaining indistinguishable from benign
    activity while delivering payloads. Sources: [Prophiler, Canali et al.](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf).'
