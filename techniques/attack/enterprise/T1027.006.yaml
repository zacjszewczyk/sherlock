  context: 'Mounting an ISO or IMG image strips the Mark-of-the-Web from the files inside it, so adversaries
    pair HTML smuggling with container delivery to defeat origin-based protections. With ''Audit Removable
    Storage'' enabled, alert on Security Event 4663 file access to \Device\CdRom* (an ISO/IMG mount) occurring
    shortly after an HTML download on the same host. The mount itself is a comparatively rare, high-signal
    action on most user workstations and, when chained to a recent HTML retrieval, strongly suggests a
    smuggled container being opened before its contents execute. A positive result is a mount event tied
    to a recent download that should be triaged together with subsequent process executions from the mounted
    volume; mounts unrelated to downloads (e.g., legitimate software media) are lower priority. This evidence
    supports the Stealth tactic objective of the adversary remaining indistinguishable from benign activity
