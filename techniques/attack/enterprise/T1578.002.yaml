name: 'T1578.002: Modify Cloud Compute Infrastructure: Create Cloud Instance'
id: c7bd85d8-5d52-4072-94a2-8ae9fa975e71
description: Investigate whether an adversary is creating new cloud compute instances or virtual machines
  to evade defenses or stage data. Attackers who obtain valid cloud credentials frequently launch new
  instances to bypass firewall rules, IAM permissions, and monitoring tied to existing hosts; they may
  also create snapshots of existing volumes, spin up a new instance, attach those snapshots, and apply
  a less-restrictive security policy to collect or exfiltrate data, or to run malicious workloads (e.g.,
  cryptomining) without disturbing production. This playbook helps an analyst hunt for abnormal or unauthorized
  instance-creation events across AWS CloudTrail, Azure Activity Logs, and GCP audit logs by correlating
  source IPs and image IDs with threat intelligence, scoring ASN/geolocation/attribute rarity, scanning
  naming/tag/User-Agent fields for offensive-tooling signatures and high entropy, profiling new or dormant
  principals and creation-rate spikes, detecting overly permissive security groups, correlating the snapshot->run-instances->attach-volume
  chain, and identifying AccessDenied permission-enumeration bursts that precede a successful launch.
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any cloud instance-creation events (AWS RunInstances, Azure VIRTUALMACHINES/WRITE, GCP
    compute.instances.insert) originate from a source IP listed on a threat-intelligence feed or specify
    an image/AMI on a deny-list?
  context: 'Under Defense Impairment, an adversary using stolen credentials will launch fresh instances
    to escape the firewall and IAM constraints bound to existing hosts. For every instance-creation API
    call, extract the sourceIPAddress and the imageId/AMI and join them against current threat-intel indicators
    and curated image deny-lists; any match is a high-severity signal that the launch is attacker-controlled
    rather than legitimate provisioning. Enrich confirmed hits with GuardDuty findings such as CryptoCurrency:EC2/BitcoinTool.B
    when the new host begins mining, a common outcome of stolen-credential compute abuse. A positive result
    (IP or image on a list) warrants immediate triage of the principal and instance; a negative result
    still feeds the other rarity and sequence analytics. References: [AWS Threat Technique Catalog T1578.002](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.002.html),
    [Unit 42: Compromised Cloud Compute Credentials](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - Zeek conn.log
  - 'NAI: Cloud provider management plane API endpoints, Threat Intelligence Platform, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (cloudtrail, azure_activity, gcp_audit)

      AND eventName IN ("RunInstances","MICROSOFT.COMPUTE/VIRTUALMACHINES/WRITE","compute.instances.insert")

      | lookup threat_intel_ip ip=sourceIPAddress OUTPUT ti_match

      | lookup image_denylist image=imageId OUTPUT denied_image

      | where ti_match="true" OR denied_image="true"

      | eval severity="high" | table _time, principal, sourceIPAddress, imageId, region'
  - technology: GuardDuty/pseudocode
    query: 'finding.type = "CryptoCurrency:EC2/BitcoinTool.B*"

      AND resource.instanceId IN (recently_created_instance_ids)

      | join recently_created_instance_ids ON principal | alert'
- question: Are instances being created from ASNs or geolocations that are statistically rare for the
    principal issuing the request over the trailing 90 days?
  context: 'Stolen-credential launches commonly originate from hosting providers, VPNs, or countries the
    legitimate identity has never used. Enrich each creation event with ASN and geolocation, build a 90-day
    per-principal frequency profile, and flag creations from ASNs/countries below the 1st percentile of
    that principal''s history. Use the robust modified Z-score / median absolute deviation (MAD) so that
    high-volume automation does not distort the baseline. A creation from a never-before-seen hosting
    ASN for a human user is a strong defense-evasion indicator; for service principals tied to fixed infrastructure,
    any geographic novelty is even more suspicious. References: [Unit 42: Compromised Cloud Compute Credentials](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/),
    [Detection Engineering: Modified Z-score for anomaly detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - Zeek conn.log
  - 'NAI: Cloud provider management plane API endpoints, Threat Intelligence Platform, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'creation_events | iplocation sourceIPAddress | enrich asn

      | stats count by principal, asn, country, _time

      | eventstats median(count) as med, mad(count) as mad by principal

      | eval mod_z = 0.6745*(count-med)/mad

      | where freq_percentile(asn,principal) < 0.01 OR freq_percentile(country,principal) < 0.01

      | alert'
- question: Does a supervised classifier label any instance-creation event as malicious with high confidence
    based on its source, image, and configuration features?
  context: 'To catch combinations of weak signals that individually pass thresholds, score each creation
    with a Random Forest trained on features [source IP geolocation, ASN, image owner, public-vs-private
    image, instanceType, time of day]. Investigate events scored malicious at greater than 85% confidence
    and surface the top-3 contributing features so the analyst can validate the verdict. Train and validate
    on labeled offensive telemetry (Stratus Red Team, Pacu) and public CloudTrail datasets (flaws.cloud),
    and complement with rare-function/population analysis and influencer output as used in Elastic''s
    CloudTrail ML jobs. A high-confidence malicious score with intuitive contributing features (e.g.,
    foreign ASN + public community AMI + off-hours) should be escalated. References: [Stratus Red Team](https://github.com/DataDog/stratus-red-team),
    [Pacu](https://github.com/RhinoSecurityLabs/pacu), [flaws.cloud CloudTrail dataset](https://summitroute.com/blog/2020/10/09/public_dataset_of_cloudtrail_logs_from_flaws_cloud/),
    [Elastic: Detecting threats in AWS CloudTrail logs using machine learning](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - Zeek conn.log
  - 'NAI: Cloud provider management plane API endpoints, Threat Intelligence Platform, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [ip_geo, asn, image_owner, is_public_image, instanceType, hour_of_day]\nmodel =\
      \ RandomForest(trained_on=[stratus, pacu, flaws_cloud])\nscore = model.predict_proba(features)\n\
      if score[\"malicious\"] > 0.85:\n    alert(top_features=model.top_k(3))"
- question: Do any instance-creation events carry a name, tag, or User-Agent string matching known offensive
    tooling signatures, placeholder text, or base64-encoded payloads?
  context: 'Offensive frameworks such as Pacu, CloudSploit, and Stratus Red Team emit distinctive User-Agent
    strings in CloudTrail, and attackers often leave telltale names/tags (placeholders, base64 blobs)
    on the resources they create. Scan userAgent, name, and tag fields with regexes for these signatures
    and alert on matches. Additionally fire on the AWS EC2 startup-shell-script change pattern (ModifyInstanceAttribute
    affecting userData) when a payload is injected into a freshly created instance, which under Defense
    Impairment indicates the adversary is bootstrapping malicious code. A regex match strongly implies
    tooling-driven abuse; absence does not clear the event, since attackers can spoof User-Agents. References:
    [Pacu](https://github.com/RhinoSecurityLabs/pacu), [Stratus Red Team](https://github.com/DataDog/stratus-red-team),
    [AWS EC2 Startup Shell Script Change Sigma rule](https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/aws/cloudtrail/aws_ec2_startup_script_change.yml).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - 'NAI: Cloud provider management plane, SIEM / Log Analytics Workspace, Organizational Naming Convention
    Policy Documents'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "creation_events\n| regex userAgent=\"(?i)(pacu|cloudsploit|stratus|boto3-stratus|kali)\"\n\
      \   OR name=\"(?i)(test|tmp|placeholder|[A-Za-z0-9+/]{40,}={0,2})\"\n   OR tag=\"(?i)([A-Za-z0-9+/]{40,}={0,2})\"\
      \n| alert severity=\"high\"\n;\n# userData injection\neventName=\"ModifyInstanceAttribute\" AND\
      \ requestParameters.userData!=null\n   AND instanceId IN recently_created_instance_ids | alert"
- question: Is the character entropy of a new instance's name in the 99th percentile of the organizational
    baseline for the principal or automation context that created it?
  context: 'Adversary- or tool-generated resource names are frequently overly random compared with an
    organization''s human or templated naming conventions. Establish a 90-day baseline of instance-name
    character entropy per principal/automation context, then flag new names whose entropy sits at the
    99th percentile (unusually random). Apply the modified Z-score/MAD so that legitimately batch-named
    fleets (which can look random) do not skew the baseline. A high-entropy name from a principal that
    normally uses structured names is a meaningful deviation worth correlating with the other signals
    in this playbook. References: [Detection Engineering: Modified Z-score for anomaly detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - 'NAI: Cloud provider management plane, SIEM / Log Analytics Workspace, Organizational Naming Convention
    Policy Documents'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'creation_events | eval ent = shannon_entropy(instanceName)

      | eventstats median(ent) as med, mad(ent) as mad by principal

      | eval mod_z = 0.6745*(ent-med)/mad

      | where ent >= percentile99(ent, principal)

      | alert'
- question: Does an NLP classifier flag any new instance name or tag as a low-similarity deviation from
    legitimate organizational naming conventions?
  context: 'Beyond raw entropy, the semantic structure of names and tags can reveal attacker activity.
    Train an NLP classifier on labeled historical names/tags that conform to legitimate naming structures,
    then score new values and alert on low-similarity variants, surfacing the top contributing tokens.
    Use rare-token/population analysis as in Elastic''s CloudTrail ML. Under Defense Impairment, a name
    that semantically diverges from every known convention suggests the resource was created outside sanctioned
    provisioning pipelines and merits investigation of the creating principal. References: [Elastic: Detecting
    threats in AWS CloudTrail logs using machine learning](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - 'NAI: Cloud provider management plane, SIEM / Log Analytics Workspace, Organizational Naming Convention
    Policy Documents'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = NLPNamingClassifier(trained_on=legit_names_tags)\nsim = model.similarity(instanceName\
      \ + \" \" + tags)\nif sim < threshold:\n    alert(top_tokens=model.contributing_tokens())"
- question: Is an instance being created by a principal that was created within the last 72 hours, has
    been dormant for more than 90 days, or is issuing its first-ever RunInstances/CreateCluster call?
  context: 'Newly minted or long-dormant identities suddenly creating compute are classic markers of compromise
    or attacker-created backdoor accounts. Query IAM/IdP metadata for each creating principal''s creation
    time and last-activity time and alert when the account is younger than 72 hours or has been inactive
    over 90 days. Corroborate with first-seen action analysis: a principal''s first-ever RunInstances/CreateCluster
    is a novel role/action pair, the same logic behind Splunk''s ''Cloud API Calls From Previously Unseen
    User Roles'' and the Netflix CloudTrail Anomaly Detector. Under Defense Impairment, such anomalies
    imply the adversary is operating through an account chosen to avoid scrutiny. References: [Splunk:
    Cloud API Calls From Previously Unseen User Roles](https://research.splunk.com/cloud/2181ad1f-1e73-4d0c-9780-e8880482a08f/),
    [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - 'NAI: Cloud Identity and Access Management (IAM) service, IdP Administration Portal and Logs, Human
    Resources Information System (for peer grouping)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'creation_events | lookup iam_metadata principal OUTPUT created_time, last_activity

      | eval age_h = (now()-created_time)/3600, dormant_d = (now()-last_activity)/86400

      | where age_h < 72 OR dormant_d > 90

      | append [search first_seen action=eventName by principal where is_first="true"]

      | alert'
- question: Is any principal creating instances at a daily rate exceeding three standard deviations above
    its own 30-day rolling baseline or its peer group?
  context: 'A spike in instance-creation volume can indicate scripted, automated abuse (e.g., spinning
    up a fleet for cryptomining or data staging). Maintain 30-day rolling baselines of each principal''s
    daily creation counts and flag days exceeding 3 standard deviations, or that strongly deviate from
    the peer group derived from HR/role grouping. Prefer the robust modified Z-score/MAD to resist distortion
    from legitimate batch jobs, and layer per-principal/per-region time-series forecasting with confidence
    bands. Under Defense Impairment, a sudden burst from an otherwise low-volume identity is a strong
    indicator of credential abuse. References: [Detection Engineering: Modified Z-score for anomaly detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly),
    [AWS CloudWatch ML over CloudTrail](https://aws.amazon.com/blogs/mt/simplify-analysis-of-aws-cloudtrail-data-leveraging-amazon-cloudwatch-machine-learning-and-advanced-capabilities/).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - 'NAI: Cloud Identity and Access Management (IAM) service, IdP Administration Portal and Logs, Human
    Resources Information System (for peer grouping)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'creation_events | bin _time span=1d

      | stats count as daily by principal, _time

      | eventstats median(daily) as med, mad(daily) as mad by principal

      | eval mod_z = 0.6745*(daily-med)/mad

      | where mod_z > 3 OR daily > peer_group_mean(principal)+3*peer_group_std(principal)

      | alert'
- question: Does unsupervised clustering of principal activity isolate any account as an outlier consistent
    with compromise?
  context: 'Compromised accounts often exhibit activity that does not fit any normal behavioral cluster.
    Cluster principal activity (API call frequency, resource types touched, active hours) with DBSCAN
    and review noise/distant points as candidate compromised identities. Alternatively, embed principal->role->service->action
    context with graph models (GNN over cloud IAM logs, CS-GAD) and surface the top contributing edges/features.
    Under Defense Impairment, an account that clusters as an outlier while creating instances should be
    reviewed for stolen credentials or attacker-provisioned access. References: [GNN over cloud IAM logs](https://arxiv.org/abs/2512.10280),
    [CS-GAD](https://arxiv.org/html/2409.12726v1).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - 'NAI: Cloud Identity and Access Management (IAM) service, IdP Administration Portal and Logs, Human
    Resources Information System (for peer grouping)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = features_per_principal(api_freq, resource_types, active_hours)\nlabels = DBSCAN(eps, min_samples).fit_predict(X)\n\
      for p where labels[p] == -1 (noise) or distance_to_core high:\n    review(p, contributing_features)\n\
      # optional: GNN(principal->role->service->action) anomaly score"
- question: Is any new instance launched with an overly permissive security group, such as ingress from
    0.0.0.0/0 or ::/0 on a sensitive port (22, 3389, 5985, 1433)?
  context: 'Attaching a wide-open security group to a freshly created instance is a hallmark of stolen-credential
    compute abuse and defense evasion, exposing remote-access or database ports to the internet. Scan
    security-group rules attached to new instances for 0.0.0.0/0 or ::/0 on non-approved ports, prioritizing
    22 (SSH), 3389 (RDP), 5985 (WinRM), and 1433 (MSSQL), and immediately elevate any match. Under Defense
    Impairment, this configuration lets the adversary reach the new host directly while bypassing controls
    on existing instances; a positive result is a high-fidelity indicator demanding rapid containment.
    References: [Unit 42: Compromised Cloud Compute Credentials](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - 'NAI: Cloud provider management plane, Virtual network configuration (VPC/VNet), Cloud Security Posture
    Management (CSPM) tool findings'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "creation_events | join instanceId [search security_group_rules]\n| where cidr IN (\"0.0.0.0/0\"\
      ,\"::/0\")\n   AND fromPort IN (22,3389,5985,1433) AND port NOT IN approved_ports\n| alert severity=\"\
      critical\""
- question: Does a new instance's combination of region, instance type, and size produce a rarity score
    above the 98th percentile of the organization's 180-day distribution?
  context: 'Resource-hijacking and data-staging launches often use unused regions and oversized/GPU instance
    types that the organization rarely deploys. Maintain 180-day frequency distributions for awsRegion,
    instanceType, and instanceSize, sum the rarity scores for each new creation, and alert when the total
    exceeds the 98th percentile. Use robust scoring to avoid distortion. Under Defense Impairment, an
    instance launched in a never-used region with an unusual oversized type is a strong indicator of attacker
    provisioning for mining or bulk data movement, and should be correlated with the IP/image and sequence
    analytics in this playbook. References: [Unit 42: Compromised Cloud Compute Credentials](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/),
    [Detection Engineering: Modified Z-score for anomaly detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - 'NAI: Cloud provider management plane, Virtual network configuration (VPC/VNet), Cloud Security Posture
    Management (CSPM) tool findings'
  range: Last 180 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'creation_events

      | eval r_region = rarity(awsRegion, 180d), r_type = rarity(instanceType,180d), r_size = rarity(instanceSize,180d)

      | eval rarity_total = r_region + r_type + r_size

      | where rarity_total > percentile98(rarity_total)

      | alert'
- question: Do time-series models forecasting per-region/per-family creation volumes flag any provisioning
    spike outside the expected interval?
  context: 'Bursts of provisioning that fall outside normal temporal patterns can reveal automated attacker
    activity even when individual events look benign. Use Prophet or LSTM models per region/instance-family
    to forecast creation volumes and alert on spikes that exceed the forecast confidence interval, surfacing
    the contributing region/family. Under Defense Impairment, an unexpected provisioning spike in a particular
    region/family may indicate an adversary rapidly standing up infrastructure; the analyst should pivot
    to the principals and source IPs responsible during the anomalous window. References: [Prophet-based
    cloud IDS forecasting](https://link.springer.com/article/10.1186/s13677-023-00491-x), [AWS CloudWatch
    ML over CloudTrail](https://aws.amazon.com/blogs/mt/simplify-analysis-of-aws-cloudtrail-data-leveraging-amazon-cloudwatch-machine-learning-and-advanced-capabilities/).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - 'NAI: Cloud provider management plane, Virtual network configuration (VPC/VNet), Cloud Security Posture
    Management (CSPM) tool findings'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for (region, family) in groups:\n    model = Prophet_or_LSTM(history[region,family])\n   \
      \ yhat, lo, hi = model.forecast(now)\n    if observed > hi:\n        alert(region, family, observed,\
      \ expected=yhat)"
- question: Did a single principal perform a CreateSnapshot, then RunInstances and AttachVolume within
    a 15-minute window, especially into a different region or with a less-restrictive security policy?
  context: 'This is the canonical evade-defenses chain for T1578.002: snapshot an existing volume, launch
    a new instance, attach the snapshot, and apply a looser security policy to read or exfiltrate the
    data away from the controls on the original host. Trigger when a CreateSnapshot is followed within
    15 minutes by RunInstances and AttachVolume from the same principal, and escalate when the new awsRegion
    differs from the snapshot source or a less-restrictive security policy is applied. Under Defense Impairment,
    detecting this stateful sequence is high-fidelity evidence of deliberate data staging and should drive
    immediate investigation of the principal and the destination instance. References: [AWS Threat Technique
    Catalog T1578.002](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.002.html),
    [Unit 42: Compromised Cloud Compute Credentials](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud provider management plane, SIEM correlation engine, Cloud data storage services (e.g.,
    AWS EBS, Azure Managed Disks)'
  range: 'Last 90 days; event-centered: correlate the snapshot, run-instances, and attach-volume events
    within a 15-minute window per principal'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "events by principal sort _time\n| transaction principal maxspan=15m\n   startswith=eventName=\"\
      CreateSnapshot\"\n   endswith=eventName=\"AttachVolume\"\n| where match_seq(\"CreateSnapshot\",\"\
      RunInstances\",\"AttachVolume\")\n| eval cross_region = (snapshot_region != instance_region)\n|\
      \ where cross_region OR less_restrictive_sg=\"true\"\n| alert severity=\"high\""
- question: Are the time deltas between related snapshot/instance API calls below the 5th percentile of
    legitimate per-principal behavior, indicating scripted automation?
  context: 'Human-driven administration produces variable, comparatively long gaps between related API
    calls, whereas attacker scripts execute them in rapid succession. Profile legitimate time deltas between
    related API calls per principal and flag sequences whose deltas fall below the 5th percentile. Derive
    thresholds from labeled detonations of Stratus Red Team and Pacu. Under Defense Impairment, machine-speed
    CreateSnapshot->RunInstances->AttachVolume sequencing strongly suggests automated abuse; combine with
    the stateful correlation rule to reduce false positives from legitimate IaC. References: [Stratus
    Red Team](https://github.com/DataDog/stratus-red-team), [Pacu](https://github.com/RhinoSecurityLabs/pacu).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud provider management plane, SIEM correlation engine, Cloud data storage services (e.g.,
    AWS EBS, Azure Managed Disks)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'events by principal | streamstats current=f last(_time) as prev by principal

      | eval delta = _time - prev

      | where related_call_pair(eventName, prev_eventName)

      | where delta < percentile5(delta, principal)

      | alert'
- question: Does a sequence model assign a low probability to the observed CreateSnapshot->RunInstances->AttachVolume
    ordering relative to benign administration?
  context: 'Benign cloud administration follows learnable call sequences; attacker workflows produce improbable
    transitions. Train a multi-order Markov chain or HMM/RNN on benign administration sequences and flag
    low-probability CreateSnapshot->RunInstances->AttachVolume orderings as abuse, surfacing the specific
    improbable transition. This is supported by multi-order Markov anomaly detection for cloud servers
    and graph-based session scoring (CS-GAD). Under Defense Impairment, a low-probability sequence centered
    on snapshot-to-instance mounting is a strong data-staging signal worth escalating with the contributing
    transition highlighted. References: [Multi-order Markov anomaly detection for cloud servers](https://ieeexplore.ieee.org/document/7065233/),
    [CS-GAD](https://arxiv.org/html/2409.12726v1).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud provider management plane, SIEM correlation engine, Cloud data storage services (e.g.,
    AWS EBS, Azure Managed Disks)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = MarkovChain_or_HMM(trained_on=benign_admin_sequences)\np = model.sequence_probability(session.events)\n\
      if p < threshold:\n    alert(improbable_transition=model.lowest_transition(session))"
- question: Did a principal generate a burst of AccessDenied / Client.UnauthorizedOperation errors on
    compute/IAM control-plane calls and then successfully create an instance?
  context: 'Compromised identities frequently probe their permissions, generating many denied calls before
    finding an action that succeeds. Group CloudTrail events by principal/sourceIP over a 10-minute window
    and alert when errorCode=AccessDenied or Client.UnauthorizedOperation counts exceed a tuned threshold
    (start at >5) and any subsequent RunInstances/CreateSnapshot succeeds. This failed-then-success pattern
    captures the state transition of stolen-credential probing, matching Splunk''s AWS IAM AccessDenied
    Discovery Events logic. Under Defense Impairment, an enumeration burst immediately preceding a successful
    launch is high-confidence evidence of credential abuse and should be escalated. References: [Splunk:
    AWS IAM AccessDenied Discovery Events](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - 'NAI: Cloud provider management plane API endpoints, Cloud IAM service, SIEM correlation engine'
  range: 'Last 90 days; event-centered: 10-minute window per principal/sourceIP ending at the successful
    creation'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "events by principal, sourceIPAddress within 10m\n| stats count(eval(errorCode IN (\"AccessDenied\"\
      ,\"Client.UnauthorizedOperation\"))) as denials,\n        values(eventName) as actions by principal,\
      \ sourceIPAddress, window\n| where denials > 5\n| join principal [search eventName IN (\"RunInstances\"\
      ,\"CreateSnapshot\") errorCode=null]\n| alert severity=\"high\""
- question: Is a principal's AccessDenied rate or denied-to-successful control-plane ratio exceeding three
    modified Z-scores above its 30-day baseline?
  context: 'Sudden increases in a principal''s failure rate signal probing that a single threshold may
    miss. Maintain a 30-day baseline of each principal''s AccessDenied rate and the ratio of denied:successful
    control-plane calls, and flag windows exceeding 3 modified Z-scores. Combine with first-seen action
    novelty (Netflix CloudTrail Anomaly Detector) so that a new identity''s elevated failures are weighted
    appropriately. Under Defense Impairment, an abnormal denial ratio surrounding instance creation indicates
    the credential holder is operating outside its normal authorization envelope. References: [Detection
    Engineering: Modified Z-score for anomaly detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly),
    [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - 'NAI: Cloud provider management plane API endpoints, Cloud IAM service, SIEM correlation engine'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'events | bin _time span=1h

      | stats count(eval(errorCode like "%Denied%")) as denied, count as total by principal, _time

      | eval ratio = denied/total

      | eventstats median(ratio) as med, mad(ratio) as mad by principal

      | eval mod_z = 0.6745*(ratio-med)/mad

      | where mod_z > 3 | alert'
- question: Does rare-function/population analysis over CloudTrail error events score any identity's denied-call
    cluster as anomalous?
  context: 'Rare combinations of denied API actions concentrated on one identity reveal targeted permission
    enumeration. Apply rare-function/population analysis over CloudTrail error events to score anomalous
    denied-call clusters per identity, and surface the top contributing API actions and source geography
    (as in Elastic''s CloudTrail ML jobs). Under Defense Impairment, an identity whose denied calls form
    a statistically rare cluster, particularly from unusual geography, is likely a compromised credential
    being tested before a successful instance launch; the analyst should review the contributing actions
    and pivot to any subsequent successful creations. References: [Elastic: Detecting threats in AWS CloudTrail
    logs using machine learning](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - GCP Admin Activity audit logs
  - 'NAI: Cloud provider management plane API endpoints, Cloud IAM service, SIEM correlation engine'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'errors = cloudtrail where errorCode != null

      scores = rare_function_population_analysis(by=principal, fields=[eventName, sourceGeo])

      | where anomaly_score high

      | alert(top_actions, top_geo)'
