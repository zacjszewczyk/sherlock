questions:
- question: '[Stealth] Encoded script detection: Can you determine whether a process executes an encoded
    PowerShell command (e.g., using -e, -en, -enc) which, when decoded, contains functions or cmdlets
    used for programmatic delays, such as ''Start-Sleep'' or .NET methods like ''[System.Threading.Thread]::Sleep''.
    -- specifically using the ''Encoded script detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the information requirement is "Is the
    adversary attempting to evade defenses using time-based methods? (PIR)" This technique, Virtualization/Sandbox
    Evasion: Time Based Checks, covers adversaries using time-based methods (sleeps, timer loops, API
    hammering, delayed/staged execution) to detect and outlast virtualization, sandbox, and automated-analysis
    environments so their payload only acts on a real target. This evidence focuses on the condition that
    a process executes an encoded PowerShell command (e.g., using -e, -en, -enc) which, when decoded,
    contains functions or cmdlets used for programmatic delays, such as ''Start-Sleep'' or .NET methods
    like ''[System.Threading.Thread]::Sleep''. This Symbolic Logic approach works as follows: For each
    Windows Event ID 4688 with a process name of ''powershell.exe''/''pwsh.exe'' and command line arguments
    containing ''-e'', ''-en'', or ''-enc'', extract and decode the Base64 string (deterministic, first-party
    telemetry; see the Base64 PowerShell Sigma rule Suspicious Encoded PowerShell Command Line). Concurrently,
    inspect Windows Event ID 4104 script block logs for the deobfuscated content. Search the decoded/deobfuscated
    content for delay primitives ''Start-Sleep'', ''GetTickCount'', ''Measure-Command'', ''[System.Threading.Thread]::Sleep'',
    or busy-wait loops that consume time without I/O (the stalling pattern characterized in The Power
    of Procrastination). Alert if a match is found. A positive result -- a deterministic rule match, a
    statistical outlier, or a model alert -- indicates a process is deliberately consuming or measuring
    time to stall or fingerprint the environment rather than doing useful work; pivot to the responsible
    process, its command line, parent/child lineage, the user and host context, and whatever side effects
    (file, registry, or network activity) follow the delay. A negative result helps rule out this particular
    time-based evasion vector but should be corroborated with the other questions in this playbook, since
    a single method can miss obfuscated, low-and-slow, or living-off-the-land stalling behavior tied to
    the Stealth objective.'
