    a process executes ''timeout.exe'' or ''ping.exe'' with arguments specifying a delay that significantly
    exceeds typical interactive or script usage, suggesting an attempt to wait out automated analysis
    environments. This Symbolic Logic approach works as follows: Trigger on Event ID 4688 where process
    name is ''timeout.exe'' and command line contains ''/t [number]'' with number > 300, OR process name
    ''ping.exe'' with ''-n [number]'' > 300 targeting a loopback/local address (e.g., ''127.0.0.1'') —
    a classic side-effect-free delay used as stalling code (The Power of Procrastination). State/Failure
    signal: confirm the ping loopback returns successful replies (no network egress in Zeek conn.log for
    that PID), distinguishing a deliberate local time-burn from a failed/blocked real connection. Keep
    this deterministic threshold and tune the 300s floor to your environment. A positive result -- a deterministic
    rule match, a statistical outlier, or a model alert -- indicates a process is deliberately consuming
    or measuring time to stall or fingerprint the environment rather than doing useful work; pivot to
    the responsible process, its command line, parent/child lineage, the user and host context, and whatever
