name: 'T1497.003: Virtualization/Sandbox Evasion: Time Based Checks'
id: d63736ce-3bcd-431e-8ba0-c4daf092dff8
description: 'This playbook helps an analyst investigate whether an adversary is using time-based virtualization
  and sandbox evasion (MITRE ATT&CK T1497.003) to detect or outlast automated analysis environments before
  executing malicious behavior. It hunts across Windows, Linux, and macOS for the observable consequences
  of sleep/timer stalling and delayed execution: encoded PowerShell that decodes to delay primitives such
  as Start-Sleep or [System.Threading.Thread]::Sleep; abnormally long timeout.exe/ping.exe loopback delays;
  ''sleeper'' processes that stay silent for minutes before their first network connection, file write,
  or registry modification; time-query -> sleep -> time-query sequences that reveal a sandbox accelerating
  the clock; tight ''API hammering'' loops of GetTickCount/timeGetTime with no side effects; parent processes
  that fire discovery commands (whoami, net, ipconfig, systeminfo) immediately after a sleeper child terminates;
  and Linux/macOS sleep/usleep/nanosleep/NSTimer/dispatch_after/mach_wait_until delays preceding first
  file or network activity. Each behavioral angle is pursued with three complementary methods -- deterministic
  symbolic-logic rules, statistical baselining/outlier and change-point detection, and machine-learning
  models -- applied to Windows Event IDs 4688/4104/4663/4657, Sysmon, PowerShell script-block logs, auditd:SYSCALL,
  macOS unified logs, and Zeek conn.log, so the analyst can corroborate suspected time-based evasion against
  process lineage, command line, delay magnitude, and the timing of subsequent side effects across the
  Stealth and Discovery tactics.'
