name: 'T1021.005: VNC'
id: 1b104034-01f7-4d02-b3f4-ce225810e0de
description: 'Investigate adversary abuse of Virtual Network Computing (VNC) for interactive remote control
  and lateral movement across Windows, Linux, and macOS hosts. VNC relays screen, keyboard, and mouse
  input over the RFB (remote framebuffer) protocol and is frequently abused with valid accounts to open
  documents, download files, run arbitrary commands, and pivot deeper into a network. This playbook helps
  an analyst find and triage: RFB/VNC sessions on any port (not only TCP 5900-5906) tied to threat-intelligence
  indicators or known-malicious binaries; VNC processes launched from suspicious paths, with anomalous
  parent-child relationships, or high-entropy command lines; anomalous VNC connection patterns such as
  new user-to-host edges, off-hours access, unusual durations, and policy-violating remote interactive
  logons; VNC/RFB brute-force and password-spray activity where many authentication failures precede a
  success; and suspicious follow-on activity (reconnaissance, credential access, new outbound C2) executed
  during or after a VNC session. It combines deterministic symbolic-logic rules, statistical baselining,
  and machine-learning models so a SOC analyst can confirm unauthorized VNC remote control defensibly
  across endpoint, network, and authentication telemetry.'
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is there an RFB/VNC session on any TCP port whose source or destination IP matches an active
    threat-intelligence watchlist, or a VNC binary execution whose file hash matches a known-malicious
    signature?
  context: 'This is the deterministic floor for VNC lateral movement. Zeek''s RFB analyzer parses the
    RFB handshake from the protocol stream, so it logs every VNC session in rfb.log regardless of port
    - catching adversaries who deliberately move VNC off the default 5900-5906 range to evade port-based
    rules. Confirm a real VNC session from rfb.log fields (client/server version, authentication_method,
    auth success/fail) rather than port alone, then enrich both endpoints against the current TI watchlist.
    In parallel, watch process-creation telemetry for VNC binary names (vncviewer.exe, winvnc.exe, tvnserver.exe,
    x11vnc, vncserver), hash the image, and compare to known-malicious hashes. A hit on either branch
    is a high-confidence lateral-movement lead: an external actor or commodity malware is using VNC to
    reach or control an internal host. A clean result lowers but does not eliminate suspicion, since novel
    tooling and unlisted infrastructure will not match.'
  answer_sources:
  - Zeek rfb.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Network traffic logs from internet gateways and internal network sensors; Endpoint process execution
    logs from all workstations and servers.'
  range: Last 90 days, pivoting to the full session and host timeline around any match.
  queries:
  - technology: Zeek/pseudocode
    query: "FOR rfb IN rfb.log JOIN conn.log ON uid\n  IF rfb.id.orig_h IN ti_watchlist OR rfb.id.resp_h\
      \ IN ti_watchlist\n  THEN ALERT 'VNC/RFB session to/from TI indicator' WITH rfb.client_version,\
      \ rfb.auth, port"
  - technology: SIEM/Rule pseudocode
    query: "proc = FILTER (Sysmon EID 1 OR Event 4688)\n  WHERE image_name IN ['vncviewer.exe','winvnc.exe','tvnserver.exe','x11vnc','vncserver']\n\
      ALERT WHERE sha256(proc.image) IN malicious_hash_feed"
- question: When VNC/RFB sessions are scored on a dynamic risk model, do any rank above the 95th percentile
    of risk or in the top 1% for session frequency or byte volume against baseline?
  context: 'Not every VNC session matches a known indicator, so quantify relative suspicion. Maintain
    a dynamic risk score per internal IP built from prior alerts and asset criticality; for each new RFB
    session compute session_risk = source_score + destination_score and study the distribution over a
    rolling 24-hour window, flagging sessions above the 95th percentile. Layer ''physics-of-the-attack''
    volume and frequency metrics: RFB sessions per source IP per minute and total orig_bytes+resp_bytes
    per session, flagging sources in the top 1% of session frequency or sessions in the top 1% of byte
    volume against a 30-day baseline. High frequency suggests scripted fan-out across many hosts; high
    byte volume suggests bulk data movement or sustained interactive control. For lateral movement, this
    surfaces the riskiest VNC activity to high-value assets even absent a signature.'
  answer_sources:
  - Zeek rfb.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Network traffic logs from internet gateways and internal network sensors; Endpoint process execution
    logs from all workstations and servers.'
  range: Rolling 24-hour window for percentile scoring against a 30-day baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR s IN rfb_sessions(window=24h)\n  s.risk = ip_risk[s.orig_h] + ip_risk[s.resp_h]\n  s.bytes\
      \ = s.orig_bytes + s.resp_bytes\nALERT WHERE s.risk > pct95(all.risk)\n   OR freq_per_min[s.orig_h]\
      \ > pct99(freq, baseline=30d)\n   OR s.bytes > pct99(bytes, baseline=30d)"
- question: Does an explainable anomaly/classification model flag a VNC/RFB session as malicious with
    high probability based on its connection features?
  context: 'Train an Isolation Forest (unsupervised) or supervised Random Forest on first-party rfb.log/conn.log
    features: duration, orig_bytes, resp_bytes, orig/resp byte ratio, conn history, authentication_method,
    share_flag, and hour-of-day, enriched with IP risk scores. Label from historical incidents and benign
    admin activity, then alert above a tuned probability (e.g., >0.90). The model catches subtle deviations
    that fixed thresholds miss - for example a session with auth_method=None, an unusual byte ratio, and
    off-hours timing. Crucially, emit the top-3 contributing features in the alert text (e.g., byte_ratio,
    auth_method=None, off-hours) so an analyst can triage quickly and decide whether the VNC session represents
    legitimate remote administration or adversarial control. Retrain periodically to track drift in benign
    admin behavior.'
  answer_sources:
  - Zeek rfb.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Network traffic logs from internet gateways and internal network sensors; Endpoint process execution
    logs from all workstations and servers.'
  range: Last 90 days for training corpus; score sessions in near-real-time.
  queries:
  - technology: ML/pseudocode
    query: 'feat = EXTRACT [duration,orig_bytes,resp_bytes,byte_ratio,history,auth_method,share_flag,hour]
      + ip_risk

      model = IsolationForest()/RandomForest().fit(historical_labeled)

      score = model.predict_proba(feat)

      ALERT WHERE score > 0.90 EMIT top3_features(feat)'
- question: Was a VNC-related process executed from a suspicious directory, masquerading as a system process,
    or spawned by an unexpected parent such as svchost.exe or explorer.exe?
  context: Legitimate VNC software installs to known program directories and is signed by recognized vendors.
    Adversaries instead drop VNC binaries into world-writable or user-writable paths (%TEMP%, %APPDATA%,
    C:\Users\Public, /tmp, /dev/shm) and may rename them to look like system processes. Monitor Sysmon
    EID 1 / Event 4688 / auditd EXECVE and alert when an image path is in a suspicious directory and its
    OriginalFileName/Description contains 'VNC' or 'RFB', or when a common system process is the parent
    of a process that opens an RFB listener/connection. Maintain an allowlist of sanctioned VNC binaries,
    install paths, and signing certificates as the deterministic floor so routine admin tooling is suppressed.
    A match strongly suggests an attacker staged a VNC server/client to enable covert remote control during
    lateral movement.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd:EXECVE
  - 'NAI: Process and command-line execution logs from endpoint detection and response (EDR) agents on
    all workstations and servers.'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "exec = FILTER (Sysmon EID 1 OR Event 4688 OR auditd EXECVE)\nsusp_dir = path IN ['%TEMP%','%APPDATA%','C:\\\
      \\Users\\\\Public','/tmp','/dev/shm']\nALERT WHERE (susp_dir AND (OriginalFileName CONTAINS 'VNC'\
      \ OR Description CONTAINS 'RFB'))\n   OR (parent IN ['svchost.exe','explorer.exe'] AND child opens\
      \ rfb_listener)\n   AND image NOT IN vnc_allowlist"
- question: Does a VNC process show a high-entropy command line, execute from a rarely-used directory,
    or repeatedly start and immediately exit?
  context: 'Quantify how unusual a VNC execution is. Compute Shannon entropy of the CommandLine field,
    baseline legitimate VNC client/server commands, and alert when entropy exceeds 3 standard deviations
    above that baseline - obfuscated or encoded arguments raise entropy. Independently compute the rarity
    of the image-path directory versus a 30-day baseline and flag executions from directories in the bottom
    5th percentile of frequency, catching binaries planted in unusual locations. Also track the failure
    state: VNC server processes that start then exit within seconds (Sysmon EID 5) repeatedly indicate
    misconfiguration or active probing of the host''s VNC capability. Together these statistical signals
    surface staged or experimental VNC tooling that does not match clean signature rules, supporting the
    lateral-movement hypothesis.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd:EXECVE
  - 'NAI: Process and command-line execution logs from endpoint detection and response (EDR) agents on
    all workstations and servers.'
  range: Last 90 days against a 30-day rolling baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR p IN vnc_process_execs\n  p.entropy = shannon(p.command_line)\nALERT WHERE p.entropy >\
      \ mean(baseline)+3*sd(baseline)\n   OR dir_freq[p.dir] < pct5(dir_freq, baseline=30d)\n   OR count(start_then_exit<5s\
      \ via EID5) per host > N"
- question: Does a one-class or parent-child anomaly model flag a VNC execution or its process tree as
    an outlier (e.g., winvnc.exe -> cmd.exe -> whoami)?
  context: Train a one-class SVM or Isolation Forest on features of legitimate VNC executions (path depth,
    command-line length, parent process, user context, signer) and flag outliers. Layer parent-child chain
    scoring with an XGBoost+graph model to surface anomalous process trees rooted at VNC binaries - for
    instance winvnc.exe spawning cmd.exe spawning whoami, a tree no benign VNC server should produce.
    This connects the act of running VNC to what the operator does next, which is the strongest sign that
    VNC is being abused for hands-on-keyboard lateral movement rather than legitimate remote support.
    Surface the top-3 contributing features in the alert so the analyst can validate the anomalous lineage
    and user context fast. Train on labeled benign admin sessions to keep false positives manageable.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd:EXECVE
  - 'NAI: Process and command-line execution logs from endpoint detection and response (EDR) agents on
    all workstations and servers.'
  range: Last 90 days for model training; score executions continuously.
  queries:
  - technology: ML/pseudocode
    query: 'model = OneClassSVM()/IsolationForest().fit(legit_vnc_exec_features)

      ALERT WHERE model.is_outlier(exec_features)

      tree_score = XGBoost_graph(process_tree rooted at vnc_binary)

      ALERT WHERE tree_score anomalous EMIT top3_features'
- question: Did a successful remote interactive VNC logon (Event ID 4624 Logon Type 10 / rfb auth=true)
    violate the authorized user-to-host VNC access policy or match no known benign login structure?
  context: Define an explicit policy of who may VNC to what (e.g., IT_Admins -> Workstations OU) and catalog
    the benign 'login structures' - source, destination, user, and time tuples observed historically.
    Correlate successful remote interactive logons (Event ID 4624 Logon Type 10) and rfb.log auth=true
    sessions against that policy and raise a high-severity alert when the user/target/time combination
    violates policy or matches no known structure. For lateral movement this directly catches a compromised
    or unauthorized account using VNC to reach a host it should never touch. A policy violation is a strong
    positive; a match to an existing structure is reassuring but should still be weighed against the other
    analytics here, since attackers may abuse legitimately authorized admin paths.
  answer_sources:
  - Zeek rfb.log
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Authentication logs from Active Directory Domain Controllers; Network flow logs from data center
    and user access layer switches.'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "logon = FILTER Event 4624 WHERE logon_type=10\nvnc = JOIN rfb.log WHERE auth=true ON host,time\n\
      ALERT WHERE (user,dest,hour) NOT IN authorized_policy\n   OR (src,dest,user,time) NOT IN known_login_structures"
- question: Does a user's VNC session occur outside their normal hours, run far longer than usual, reach
    a first-time destination, or beacon with regular keepalive cadence?
  context: 'Build a 30-day per-user VNC baseline of login hours, mean session duration, and frequent destinations.
    Alert when a user connects outside their normal window (>2 SD from mean hour), has a duration outlier
    (>3 SD from mean), or reaches a destination for the first time - each is a behavioral break consistent
    with account takeover or an insider exceeding their mandate. Add long-connection and cadence analytics
    from Zeek conn.log: session duration and the inter-arrival coefficient of variation flag persistent
    interactive RFB sessions and keepalive beaconing. Persistent, regularly-timed sessions can indicate
    an established foothold using VNC as a stable control channel. These statistical deviations complement
    the policy rule by catching abuse that stays within authorized paths but breaks the user''s normal
    rhythm.'
  answer_sources:
  - Zeek rfb.log
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Authentication logs from Active Directory Domain Controllers; Network flow logs from data center
    and user access layer switches.'
  range: 30-day per-user baseline; evaluate new sessions against it.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = per_user_baseline(hours,duration,dests, window=30d)\nALERT WHERE abs(hour-base.mean_hour)\
      \ > 2*base.sd_hour\n   OR duration > base.mean_dur + 3*base.sd_dur\n   OR dest NOT IN base.dests\n\
      \   OR cadence_cv(conn.log inter-arrival) LOW (beaconing)"
- question: Does a temporal authentication-graph model assign a low likelihood (surprising) to a new VNC
    source-user-to-destination-host edge, indicating compromised-account lateral movement?
  context: Model RFB and authentication sessions as a temporal authentication graph and score each new
    source-user -> destination-host edge by its predicted likelihood, alerting on low-probability edges
    that signal an account moving where it has never moved before. Complement edge scoring with path-based
    inference that flags credential-switch paths ending at never-before-accessed hosts, and an unsupervised
    PCA/k-means/MAD ensemble over host-communication features. This graph view is the most powerful detector
    of stealthy VNC lateral movement because it reasons about the structure of access across the whole
    environment rather than a single host. Benchmark and train on the LANL authentication dataset, and
    surface the top-3 edge features in alerts so the analyst can judge whether the surprising connection
    reflects a real pivot or a benign first-time admin action.
  answer_sources:
  - Zeek rfb.log
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Authentication logs from Active Directory Domain Controllers; Network flow logs from data center
    and user access layer switches.'
  range: Last 90 days of auth/RFB edges to build the graph; score new edges continuously.
  queries:
  - technology: ML/pseudocode
    query: "G = build_temporal_auth_graph(rfb.log auth=true + Event4624 type10)\nFOR edge(user@src ->\
      \ dst) NEW:\n  p = link_predict(G, edge)\n  ALERT WHERE p < threshold EMIT top3_edge_features\n\
      ALSO path_infer(credential_switch -> new_host); pca_kmeans_mad(host_features)"
- question: Did a single source produce more than ~20 failed VNC/RFB authentication attempts within 5
    minutes immediately followed by a successful VNC connection to a targeted host?
  context: RFC 6143 exposes the RFB authentication outcome as the SecurityResult OK/failed message, and
    Zeek records it as rfb.log 'auth'. Track that state and trigger when one source generates >20 failed
    VNC auth events (rfb.log auth=false or Event ID 4625 Logon Type 10) across one or more targets within
    5 minutes, immediately followed by a success (rfb.log auth=true or Event ID 4624) from that source
    to a targeted host. This failure-then-success sequence is the classic brute-force-that-worked pattern
    and is far stronger evidence than failures alone, because it shows the attacker actively gained access.
    Keep the count and window thresholds explicit and tune them to environmental noise - some hosts reconnect
    frequently - so the deterministic rule stays high-fidelity for lateral-movement triage.
  answer_sources:
  - Zeek rfb.log
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Network sensors at key aggregation points (e.g., core switches); Security event logs from all
    servers, especially authentication servers like Domain Controllers.'
  range: Last 90 days; correlate within a 5-minute failure-to-success window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'fails = COUNT(rfb auth=false OR Event4625 type10) BY src WHERE window<=5m

      succ  = (rfb auth=true OR Event4624 type10) BY src,dst

      ALERT WHERE fails > 20 AND succ FOLLOWS fails(src) WITHIN 5m'
- question: In a rolling 10-minute window, does a source exceed the failure-to-success or distinct-target-account
    thresholds for VNC, indicating password spraying followed by a successful login?
  context: Explicitly profile the failure state to catch low-and-slow or spray-style attacks the simple
    burst rule may miss. In a rolling 10-minute window per source IP, count failed RFB/auth events, distinct
    target accounts, and TCP RST/REJ on 5900-5906, then compute the failed:successful ratio. Alert when
    distinct targeted accounts exceed a threshold (e.g., >5, indicating password spraying) followed by
    a success, or when the failure ratio exceeds the 99th percentile across all sources. Spraying many
    accounts with few attempts each is designed to stay under per-account lockout thresholds, so counting
    distinct targets is essential. Baseline normal background failure rates per host to avoid alerting
    on routine reconnect noise. A breach of these statistical thresholds followed by success is a strong
    credential-access-into-lateral-movement signal.
  answer_sources:
  - Zeek rfb.log
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Network sensors at key aggregation points (e.g., core switches); Security event logs from all
    servers, especially authentication servers like Domain Controllers.'
  range: Rolling 10-minute windows; percentiles computed across all sources daily.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR src IN window(10m):\n  f = count(rfb auth=false OR 4625) ; tgts = distinct(target_account)\n\
      \  rst = count(TCP RST/REJ on 5900-5906) ; ratio = f / max(success,1)\nALERT WHERE (tgts > 5 AND\
      \ success FOLLOWS) OR ratio > pct99(all_sources)"
- question: Does a Hidden Markov Model of per-source behavior transition from a Brute-Forcing state to
    a Successful Access state with high probability?
  context: Model each source's lifecycle with a Hidden Markov Model whose hidden states are Scanning,
    Brute-Forcing, and Successful Access, and whose observations are event types - SYN with no response
    (scanning), RFB auth=false / Event 4625 (brute forcing), and RFB auth=true / Event 4624 (success).
    Alert when the model transitions a source from Brute-Forcing to Successful Access with high probability,
    and report the observation sequence that drove the transition for triage. The HMM captures the temporal
    grammar of an attack better than fixed counters, tolerating noisy, interleaved events and varying
    tempos. A high-probability transition into Successful Access is a clear indication that an external
    actor's VNC brute force just succeeded, marking the pivot from credential access to active remote
    control and lateral movement.
  answer_sources:
  - Zeek rfb.log
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Network sensors at key aggregation points (e.g., core switches); Security event logs from all
    servers, especially authentication servers like Domain Controllers.'
  range: Last 90 days for fitting; evaluate state transitions in near-real-time.
  queries:
  - technology: ML/pseudocode
    query: 'hmm = HMM(states=[Scanning,BruteForcing,SuccessfulAccess])

      obs = sequence(SYN_no_resp, rfb_auth_false/4625, rfb_auth_true/4624) per src

      ALERT WHERE viterbi(hmm,obs) transitions BruteForcing->SuccessfulAccess p>thr EMIT obs_seq'
- question: After a successful VNC session, did the target host run reconnaissance commands, credential-dumping
    tools, or encoded PowerShell within 30 minutes, scoped to the interactive session's user/logon ID?
  context: Tie what happens on the host back to the VNC session. Identify an active VNC session by correlating
    a successful remote logon (Event ID 4624 Logon Type 10) and/or rfb.log auth=true with RFB traffic.
    Within a 30-minute window, monitor the target's child processes (Sysmon EID 1 / Event 4688 / Event
    4104 script blocks) for reconnaissance (whoami, net group, nltest, ipconfig), credential-dumping tools,
    or encoded PowerShell (powershell.exe -enc), and alert on any match scoped to the interactive session's
    user and logon ID. This scoping is what separates hands-on-keyboard adversary activity from background
    noise. Recon and credential access immediately after a remote logon are textbook post-exploitation
    steps that confirm the VNC session is being used to expand access, not for legitimate support.
  answer_sources:
  - Zeek rfb.log
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint process, script block, and network connection logs from critical servers and high-value
    user workstations; Network DNS and flow logs from datacenter and user subnets.'
  range: Last 90 days; 30-minute correlation window after each VNC session start.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'sess = (Event4624 type10 OR rfb auth=true) -> capture logon_id,user

      child = FILTER (Sysmon EID1 OR 4688 OR 4104) WHERE logon_id=sess.logon_id AND t<=sess.t+30m

      ALERT WHERE child.cmd MATCH [''whoami'',''net group'',''nltest'',''ipconfig'',''powershell -enc'',
      cred_dump_tools]'
- question: Does post-VNC-session activity rank above the 98th percentile for rarity of spawned processes
    and network destinations, or show high bytes to new internal hosts and many failed outbound connections?
  context: 'After identifying a VNC session, score every spawned child process and network destination
    by inverse-frequency rarity against a 30-day organizational baseline, sum per session, and flag sessions
    above the 98th percentile - rare combinations of activity concentrated in one session are suspicious
    even when no single event is malicious. Add volume and failure-state metrics: bytes transferred to
    new internal destinations per session, count of distinct internal hosts contacted per minute, and
    the rate of failed/blocked outbound connections (conn_state S0/REJ/RSTR) that indicate internal scanning
    or pivot attempts from the controlled host. A controlled host that suddenly fans out to many internal
    peers with high connection-failure rates is exhibiting classic post-compromise lateral-movement reconnaissance,
    strengthening the case that the VNC session is adversarial.'
  answer_sources:
  - Zeek rfb.log
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint process, script block, and network connection logs from critical servers and high-value
    user workstations; Network DNS and flow logs from datacenter and user subnets.'
  range: Per-session scoring against a 30-day organizational baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR sess IN vnc_sessions:\n  score = sum(inv_freq(child_proc) + inv_freq(net_dest), baseline=30d)\n\
      \  fanout = distinct(internal_dst)/min ; fails = count(conn_state IN [S0,REJ,RSTR])\nALERT WHERE\
      \ score > pct98(all_sessions) OR fanout high OR fails high OR bytes_to_new_internal high"
- question: Does a provenance-graph GNN flag anomalous post-exploitation subgraphs (e.g., LSASS access,
    new C2 edge, rare child) within an hour of a VNC session?
  context: Construct a process/file/network provenance graph of all activity within a 1-hour window of
    the VNC session and score nodes and subgraphs with an inductive GNN to detect anomalous post-exploitation
    without prior signatures. Layer parent-child chain scoring rooted at the VNC process tree to connect
    the remote-control entry point to downstream actions. Train on labeled benign remote-admin versus
    malicious post-exploitation sessions so the model learns the difference between an admin fixing a
    workstation and an attacker harvesting credentials and establishing C2. Surface the top-3 contributing
    nodes/features in the alert - for example LSASS access, a new external C2 edge, or a rare child process
    - so the analyst can rapidly confirm whether the VNC session led to genuine compromise activity. This
    is the most context-rich detector for converting a VNC lead into a confirmed incident.
  answer_sources:
  - Zeek rfb.log
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint process, script block, and network connection logs from critical servers and high-value
    user workstations; Network DNS and flow logs from datacenter and user subnets.'
  range: 1-hour provenance window per session; model trained on Last 90 days of labeled sessions.
  queries:
  - technology: ML/pseudocode
    query: 'G = provenance_graph(process,file,network within 1h of vnc_session)

      scores = inductive_GNN.score(G.nodes, G.subgraphs)

      tree = problemchild_score(tree rooted at vnc_process)

      ALERT WHERE scores anomalous OR tree anomalous EMIT top3_nodes(e.g. lsass_access,new_c2_edge,rare_child)'
