name: 'T1207: Rogue Domain Controller'
id: f672be4a-77da-4d3e-9476-d5b45d4f1447
description: 'This playbook helps an analyst investigate whether an adversary has registered a rogue Domain
  Controller (DC) or abused Active Directory replication -- most commonly via Mimikatz DCShadow, Mimikatz/Impacket
  DCSync (secretsdump.py --just-dc), or similar tooling -- to inject, replicate, alter, or read sensitive
  AD data such as credentials, KRBTGT keys, SID history, group memberships, and access control lists while
  bypassing or suppressing normal DC logging. It guides the hunt across complementary angles aligned to
  the Defense Impairment tactic: byte-level NIDS signatures and DCE/RPC telemetry for DRSUAPI replication
  (interface UUID E3514235-4B06-11D1-AB04-00C04FC2DCD2 with DrsAddEntry/DrsReplicaAdd/GetNCChanges) sourced
  from non-DC hosts; process-creation and PowerShell script-block evidence of DCShadow/DCSync command
  lines; replication flows where either endpoint is not on the authorized-DC allowlist; Kerberos TGS requests
  (Event ID 4769 / Zeek krb.log) for DC-specific SPNs (the DRS GUID or GC/) from unauthorized clients;
  creation of nTDSDSA/server objects in the AD Configuration partition (Event ID 5137); and anomalous
  bursts of replicated AD object modifications (krbtgt, sIDHistory, Domain/Enterprise Admins via Event
  IDs 5136/4738/4732/4756). Detection methods combine symbolic-logic rules, statistical baselining/forecasting,
  and machine learning applied to Zeek (dce_rpc.log, conn.log, krb.log), PCAP/NIDS, and Windows Security/Directory
  Service Changes event logs, so the analyst can corroborate suspected rogue-DC and replication abuse
  against host role, allowlist membership, SPN usage, Configuration-partition changes, and replicated
  modification volume.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
