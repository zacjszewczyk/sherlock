questions:
- question: '[Defense Impairment] DRSUAPI NIDS signature alerting: Can you determine whether observed
    network traffic contains DCE/RPC calls to the Directory Replication Service interface that match byte-level
    signatures of known DCShadow or DCSync tools -- specifically, using the ''DRSUAPI NIDS signature alerting''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary registers a rogue
    Domain Controller or abuses Active Directory replication to read or inject sensitive directory data
    (credentials, KRBTGT keys, SID history, privileged group membership) while bypassing or suppressing
    the logging defenders rely on, directly degrading the trustworthiness of security monitoring. This
    evidence focuses on the condition that observed network traffic contains DCE/RPC calls to the Directory
    Replication Service interface that match byte-level signatures of known DCShadow or DCSync tools.
    This Symbolic Logic approach looks for the following signal: Deploy and monitor NIDS signatures (e.g.,
    Suricata/Zeek) that target the network patterns of Mimikatz DCShadow and Impacket secretsdump, keyed
    on the DRSUAPI interface UUID E3514235-4B06-11D1-AB04-00C04FC2DCD2 and DrsAddEntry/DrsReplicaAdd/GetNCChanges
    operations ([MS-DRSR](https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-drsr/f977faaa-673e-4f66-b9bf-48c640241d47);
    [Delpy & Le Toux](https://www.dcshadow.com/)). Raise a high-severity alert when any DRSUAPI bind/operation
    involves a source or destination IP that is NOT on the authorized-Domain-Controller allowlist ([Microsoft
    Defender for Identity](https://learn.microsoft.com/en-us/defender-for-identity/credential-access-alerts)).
    A positive result -- a rule match, statistical outlier, or model alert -- is high-value because legitimate
    replication occurs only between authorized DCs; any replication, DC-specific SPN use, Configuration-partition
    change, or injected modification burst that originates from a non-DC host or outside change management
    strongly suggests rogue-DC/DCShadow or DCSync activity. Pivot to the implicated host and its role
    (is it in the Domain Controllers OU?), the acting principal, the affected AD objects/attributes, and
    correlate across network (Zeek/PCAP) and DC event logs, remembering that a rogue DC may suppress local
    logging so network and replicated-metadata corroboration is essential. A negative result helps rule
    out this vector but should be confirmed against the other questions in this playbook, since a single
    method can miss stealthy or low-volume replication abuse.'
  answer_sources: &id001
  - Zeek dce_rpc.log
  - Zeek conn.log
  - 'NAI: Network traffic at network chokepoints, such as core switches or firewalls segmenting Domain
    Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# DRSUAPI NIDS signature alerting

      source IN [Zeek dce_rpc.log, Zeek conn.log]

      | WHERE matches_action_criteria("DRSUAPI NIDS signature alerting")

      // Deploy and monitor NIDS signatures (e.g., Suricata/Zeek) that target the network patterns of
      Mimikatz DCShadow and Impac

      | ALERT enrich(host, host_role, src_ip, dst_ip, principal, spn, ad_object)'
  - technology: Zeek/pseudocode
    query: '# Rogue-DC replication network correlation

      dce_rpc.log, conn.log, krb.log

      | FILTER DRSUAPI uuid==E3514235-4B06-11D1-AB04-00C04FC2DCD2 OR DC-SPN (GC/ , DRS GUID)

      | WHERE id.orig_h NOT IN authorized_DC_allowlist OR id.resp_h NOT IN authorized_DC_allowlist

      | AGG ops(DrsAddEntry/DrsReplicaAdd/GetNCChanges), bytes, faults per (orig,resp)

      | flag rogue/off-allowlist replication per action criteria'
