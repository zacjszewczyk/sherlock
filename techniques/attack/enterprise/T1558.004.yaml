name: 'T1558.004: AS-REP Roasting'
id: db14d5b4-b366-4c4c-8636-200a3ac431aa
description: 'Investigate potential AS-REP Roasting activity, in which an adversary targets Active Directory
  accounts that have Kerberos preauthentication disabled (''Do not require Kerberos preauthentication'',
  PreAuthType 0) to obtain AS-REP messages whose encrypted material—often weak RC4-HMAC (etype 0x17)—can
  be cracked offline to recover plaintext credentials. This playbook helps an analyst hunt for: AS-REQ
  requests for no-preauth accounts originating from known-compromised or threat-intelligence-listed hosts;
  execution of roasting and enumeration tooling (Rubeus asreproast, Impacket GetNPUsers, PowerView/Get-ADUser
  with the DoesNotRequirePreAuth/userAccountControl LDAP filter); requests for no-preauth accounts not
  on an approved allow-list; a single source fanning out AS-REQs across many distinct target accounts
  in a short window; and statistically significant increases in RC4-encrypted AS-REPs that deviate from
  an AES baseline. It combines deterministic symbolic-logic signatures against Domain Controller Event
  ID 4768/4688/4104 and Zeek kerberos.log/conn.log with statistical baselining and explainable machine-learning
  approaches so the analyst can confirm whether observed Kerberos behavior reflects legitimate authentication
  or credential theft.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
