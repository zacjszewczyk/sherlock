name: 'T1573.002: Asymmetric Cryptography'
id: 72c90748-4e7e-4622-b7c0-25e4401ae17b
description: 'This playbook helps an analyst investigate whether a sophisticated external actor, commodity
  malware, or an insider has established an encrypted Command and Control (C2) channel that relies on
  a known asymmetric cryptographic algorithm (e.g., RSA, ElGamal) to conceal its traffic -- most often
  by abusing SSL/TLS, where asymmetric cryptography establishes or transmits the session key before symmetric
  encryption takes over (MITRE ATT&CK T1573.002, Command and Control). Because the payload is encrypted,
  the hunt focuses on observable metadata and behavior rather than cleartext content. It guides the analyst
  across several complementary angles: correlating outbound TLS sessions against high-confidence threat
  intelligence (destination IP/domain/SNI, certificate serial/fingerprint, JA3/JA3S and version-agnostic
  JA4/JA4S/JA4X hashes); spotting self-signed, short-validity, or generic-subject certificates and TLS
  over non-standard ports; detecting C2 traffic shape such as upload-heavy byte ratios, long-lived sessions,
  and low-jitter periodic beaconing (including beacons to an offline C2 visible only as repeated failed/RST
  handshakes); identifying non-browser processes and LOLBins (powershell.exe, cscript.exe, rundll32.exe,
  mshta.exe) or non-SSL-native binaries linking libssl/libcrypto that initiate outbound TLS, especially
  from %TEMP%/%APPDATA%; flagging DGA-style domains and rapid fan-out to many unique TLS destinations;
  and surfacing anomalous handshakes (outdated TLS versions, weak/uncommon cipher suites, abnormally small
  extension sets, malformed certs, or invalid CAs). Detection methods combine symbolic-logic rules, statistical
  baselining/scoring, and machine-learning models applied to Zeek conn/ssl/x509/dns logs, NetFlow/IPFIX,
  Windows Event IDs 4688/5156 and Sysmon (EventCode 3/7/22), Linux auditd/syslog/osquery, macOS unified
  logs, and ESXi vpxd/esxcli telemetry, so the analyst can corroborate suspected asymmetric-crypto C2
  across endpoint, network, and virtualization sources.'
type: technique
