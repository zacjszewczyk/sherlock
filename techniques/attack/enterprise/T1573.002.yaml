questions:
- question: '[Command and Control] Threat feed correlation: Can you determine whether an outbound SSL/TLS
    connection matches a known malicious indicator, such as a destination IP address, domain (SNI), certificate
    serial/fingerprint, or JA3/JA3S hash present in a high-confidence threat intelligence feed. -- specifically,
    using the ''Threat feed correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary tunnels command-and-control
    traffic inside an encrypted channel built on asymmetric cryptography (such as the RSA key exchange
    that bootstraps SSL/TLS), defeating payload inspection and forcing the defender to reason from connection
    metadata, certificates, handshake characteristics, traffic shape, and the initiating process. This
    evidence focuses on the condition that an outbound SSL/TLS connection matches a known malicious indicator,
    such as a destination IP address, domain (SNI), certificate serial/fingerprint, or JA3/JA3S hash present
    in a high-confidence threat intelligence feed. This Symbolic Logic approach works as follows: Join
    Zeek conn.log and ssl.log by UID to compare destination IPs, SNIs, certificate serials/fingerprints,
    and JA3/JA3S hashes against high-confidence CTI (e.g., abuse.ch SSLBL JA3 feed); alert with the matching
    indicator details. Use version-agnostic JA4/JA4S/JA4X where available because JA3 degrades under browser
    ClientHello randomization and TLS 1.3 ([JA3, Salesforce](https://github.com/salesforce/ja3); [JA4+,
    FoxIO](https://github.com/FoxIO-LLC/ja4)). Add known default Cobalt Strike/implant certificate serials
    and JA3 hashes from maintained signature sets ([Cobalt Strike YARA, Roth](https://github.com/Neo23x0/signature-base/blob/master/yara/apt_cobaltstrike.yar);
    [Unit 42](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/)). A positive result --
    a rule match, statistical outlier, or model alert -- is a strong indicator of an encrypted C2 channel:
    pivot to the responsible host and process lineage, the destination infrastructure (IP/ASN/SNI/certificate),
    the observed handshake and traffic shape, and any concurrent beaconing or data movement, and corroborate
    against threat intelligence and the other questions in this playbook. A negative result helps rule
    out this particular asymmetric-crypto C2 vector but should not be read as all-clear, because a single
    method can miss stealthy, TLS 1.3/ECH-obscured, or low-and-slow channels -- combine network, endpoint,
    and certificate signals before concluding.'
