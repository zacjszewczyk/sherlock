- question: '[Command and Control] Indicator prevalence scoring: Can you determine whether an outbound
    SSL/TLS connection matches a known malicious indicator, such as a destination IP address, domain (SNI),
    certificate serial/fingerprint, or JA3/JA3S hash present in a high-confidence threat intelligence
    feed. -- specifically, using the ''Indicator prevalence scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary tunnels command-and-control
    traffic inside an encrypted channel built on asymmetric cryptography (such as the RSA key exchange
    that bootstraps SSL/TLS), defeating payload inspection and forcing the defender to reason from connection
    metadata, certificates, handshake characteristics, traffic shape, and the initiating process. This
    evidence focuses on the condition that an outbound SSL/TLS connection matches a known malicious indicator,
    such as a destination IP address, domain (SNI), certificate serial/fingerprint, or JA3/JA3S hash present
    in a high-confidence threat intelligence feed. This Statistical Method approach works as follows:
    For each IOC match, compute seven-day internal host prevalence and escalate severity when prevalence
    is under 0.1% or seen on fewer than three hosts; rare implant TLS stacks/certs are low-prevalence
    by design ([Anderson & McGrew](https://arxiv.org/abs/1607.01639)). Derive the percentile/threshold
    from your own JA3/JA4 and cert-fingerprint frequency tables rather than a fixed global value. A positive
    result -- a rule match, statistical outlier, or model alert -- is a strong indicator of an encrypted
    C2 channel: pivot to the responsible host and process lineage, the destination infrastructure (IP/ASN/SNI/certificate),
    the observed handshake and traffic shape, and any concurrent beaconing or data movement, and corroborate
    against threat intelligence and the other questions in this playbook. A negative result helps rule
    out this particular asymmetric-crypto C2 vector but should not be read as all-clear, because a single
    method can miss stealthy, TLS 1.3/ECH-obscured, or low-and-slow channels -- combine network, endpoint,
    and certificate signals before concluding.'
