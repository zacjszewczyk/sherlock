questions:
- question: Did a process, script block, or appliance CLI utility execute whose name, path, or command
    line matches a known tool or command used to impair command-history logging on Windows, Linux, macOS,
    or a network device?
  context: 'Defense Impairment via Prevent Command History Logging usually begins with a recognizable
    command or tool. This symbolic-logic check alerts when process names, PowerShell script blocks, or
    CLI text match vetted keyword sets curated from the MITRE ATT&CK T1690 page and community Sigma rules.
    On Linux/macOS look for `unset HISTFILE`, `export HISTFILESIZE=0`, `set +o history`, `history -c`,
    `ln -sf /dev/null *sh_history`, `chattr +i *sh_history`, `truncate -s0 *sh_history`, `shred`, and
    `rm *sh_history`; on Windows look for `ConsoleHost_history.txt` removal. A positive hit means an actor
    is deliberately silencing the command record, so treat the executing user, host, and parent process
    as immediate triage leads; a negative result lowers but does not eliminate suspicion since obfuscation
    can defeat fixed keywords. Use hash matching only when the telemetry source records hashes. This maps
    directly to Defense Impairment: the adversary degrades the trustworthiness of the host''s own audit
    trail to blind defenders.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - auditd
  - macOS Unified Log
  - networkdevice:cli
  - 'NAI: SIEM/EDR log repository aggregating process execution data from all Windows, Linux, and macOS
    endpoints and servers, correlated with a Threat Intelligence Platform.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      proc = process_events(4688|4104|auditd|unifiedlog|networkdevice_cli);
      hist_tools = feed['T1690_keywords'];  // unset HISTFILE, export HISTFILESIZE=0, set +o history,
                                            // history -c, ln -sf /dev/null *sh_history, chattr +i *sh_history,
                                            // truncate -s0 *sh_history, shred, rm *sh_history, ConsoleHost_history.txt removal
      alert when proc.name in hist_tools or proc.cmdline matches any(hist_tools)
                or (proc.hash present and proc.hash in hist_tools);
      output host, user, parent_process, cmdline, match_term
- question: Among hosts that ran a command matching a history-impairment tool feed, which executions are
    rare across the fleet and therefore most likely to be malicious rather than routine administration?
  context: Even when a command matches a history-tool feed, fleet-wide prevalence helps separate benign
    administrative use from adversary tradecraft. Score each binary or command by how many hosts run it
    and flag those present on under 1% of hosts, deriving the threshold from your own host count (for
    10,000 hosts treat fewer than 100 hosts as rare). Track volume (executions per host per day) and execution
    state (success vs. blocked) so that rare-and-successful impairment ranks highest. Surface the top-3
    contributing factors (prevalence percentage, parent process, user) in the alert so analysts can immediately
    judge whether the event reflects an automation script common across the estate or an isolated, hands-on
    impairment attempt. In a Defense Impairment context, rare execution of an audit-silencing command
    on a single host is a strong evasion signal.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - auditd
  - macOS Unified Log
  - networkdevice:cli
  - 'NAI: SIEM/EDR log repository aggregating process execution data from all Windows, Linux, and macOS
    endpoints and servers, correlated with a Threat Intelligence Platform.'
  range: Last 90 days, with a 30-90 day fleet prevalence baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      matches = process_events where matches_history_tool_feed=true;
      host_count = total_distinct_hosts;
      prev = count(distinct host) by binary_or_command;
      rare = prev < 0.01 * host_count;
      vol = count(exec) by host,day; state = success|blocked;
      rank = score(rare, vol, state==success);
      alert when rare; output binary_or_command, prevalence_pct, parent_process, user, top3_factors
- question: Does a machine-learning classifier score a suspicious process execution as likely history-impairment
    based on its entropy, parentage, user, allowlist membership, command text, and network behavior?
  context: 'Signature and prevalence rules miss novel or obfuscated impairment, so a tree-based model
    (or an active-learning command classifier such as LOLAL) scores maliciousness from rich features:
    process entropy, parent process, user, allowlist membership, command text, and concurrent network
    behavior. The model emits the top-3 SHAP or feature contributions in the alert so analysts understand
    why it fired and can triage quickly. A high score on a command that also unsets HISTFILE or rewrites
    a history path is strong corroboration of Defense Impairment; a low score with conflicting features
    warrants comparison against the host''s normal admin baseline. Retrain periodically and feed analyst
    dispositions back to keep precision high.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - auditd
  - macOS Unified Log
  - networkdevice:cli
  - 'NAI: SIEM/EDR log repository aggregating process execution data from all Windows, Linux, and macOS
    endpoints and servers, correlated with a Threat Intelligence Platform.'
  range: Last 90 days for scoring; periodic retraining
  queries:
  - technology: ML/Classifier pseudocode
    query: |-
      features = [proc_entropy, parent_process, user, allowlist_member, command_text_embedding, net_behavior];
      score = tree_model_or_LOLAL.predict_proba(features);
      explain = shap_top3(features);
      alert when score >= threshold; output host, user, cmdline, score, explain
- question: Do any command lines or PowerShell script blocks match known regular-expression patterns that
    disable, clear, or redirect shell or PowerShell history logging?
  context: This deterministic regex check targets the exact strings adversaries use to suppress history.
    Alert on `Set-PSReadLineOption -HistorySaveStyle SaveNothing` (including the en-dash homoglyph variant),
    `Remove-Module PSReadLine`, redirected `-HistorySavePath`, `unset HISTFILE`, `export HISTFILESIZE=0`,
    `set +o history`, `history -c`, `ln -sf /dev/null ~/.bash_history`, and `no logging`. Validate option/value
    baselines against the Set-PSReadLineOption documentation to keep false positives low, since administrators
    legitimately tune PSReadLine. A match indicates an active attempt to break the host's command record,
    central to Defense Impairment; pair it with the user, parent process, and session so analysts can
    decide whether this is sanctioned hardening or hostile evasion. Production EQL such as the Elastic
    Clearing Windows Console History rule provides cross-integration triage steps.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - auditd
  - macOS Unified Log
  - networkdevice:cli
  - 'NAI: SIEM platform aggregating command-line logs from all enterprise endpoints, servers, and network
    devices with command logging capabilities.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      cmd = command_line_or_scriptblock_events;
      patterns = [
        /Set-PSReadLineOption\s+-HistorySaveStyle\s+SaveNothing/i,  // also en-dash homoglyph variant
        /Remove-Module\s+PSReadLine/i,
        /Set-PSReadLineOption\s+-HistorySavePath/i,
        /unset\s+HISTFILE/, /export\s+HISTFILESIZE=0/, /set\s+\+o\s+history/,
        /history\s+-c/, /ln\s+-sf\s+\/dev\/null\s+~?\/?\.?bash_history/, /\bno logging\b/
      ];
      alert when cmd matches any(patterns); output host, user, parent_process, cmdline, matched_pattern
- question: Is a user or host issuing history-impairment commands at a frequency that statistically exceeds
    its normal baseline?
  context: Modeling counts of history-tampering commands per user and per host with a Poisson baseline
    highlights days where the observed count exceeds the p<0.01 tail, and a k-sigma baseline flags bursts
    greater than 3 sigma. A sudden spike in commands that clear or disable history is suspicious even
    when each individual command could be benign, because legitimate users rarely repeatedly silence their
    own history. Report observed-versus-expected counts and the contributing user or host in the alert
    so analysts can confirm whether the burst aligns with a maintenance window or signals concerted Defense
    Impairment. Negative results (counts within baseline) reduce urgency but should still be reviewed
    alongside the deterministic regex hits.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - auditd
  - macOS Unified Log
  - networkdevice:cli
  - 'NAI: SIEM platform aggregating command-line logs from all enterprise endpoints, servers, and network
    devices with command logging capabilities.'
  range: Last 90 days, with per-user/per-host daily baselining
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      counts = count(history_impairment_cmd) by user,host,day;
      lambda = poisson_baseline(counts, trailing_90d);
      alert when poisson_tail(observed, lambda) < 0.01
                or observed > mean + 3*stddev;
      output user, host, observed, expected, deviation_sigma
- question: Are any command lines obfuscated (e.g., via environment-variable concatenation or base64)
    in a way that yields abnormally high Shannon entropy and could hide history-impairment intent from
    fixed keyword rules?
  context: Adversaries evade keyword matching by obfuscating commands, so scoring the Shannon entropy
    of command lines catches encoded or concatenated impairment that fixed signatures miss. Calibrate
    the entropy cutoff to the 95th percentile of your privileged-command corpus, following the Elastic
    high-command-line-entropy approach. High-entropy commands warrant decoding and inspection because
    they may resolve to `unset HISTFILE`, a base64-encoded PowerShell PSReadLine change, or similar suppression.
    In a Defense Impairment context, obfuscation layered on top of history tampering signals a more deliberate,
    capable actor. Pair entropy hits with parentage and user context, and treat decoded impairment commands
    as high severity.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - auditd
  - macOS Unified Log
  - networkdevice:cli
  - 'NAI: SIEM platform aggregating command-line logs from all enterprise endpoints, servers, and network
    devices with command logging capabilities.'
  range: Last 90 days, with a privileged-command entropy baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      corpus = privileged_command_lines(trailing_90d);
      cutoff = percentile(shannon_entropy(corpus), 95);
      alert when shannon_entropy(cmdline) > cutoff;
      enrich = attempt_decode(base64|env_concat);
      output host, user, cmdline, entropy, decoded_command
- question: Does a fine-tuned language model identify command lines that are semantically equivalent to
    history-impairment commands even when their wording or encoding differs from known signatures?
  context: Semantic detection generalizes beyond literal strings. A fine-tuned language or transformer
    model (such as a DistilBERT shell-session model) recognizes commands that mean the same thing as known
    impairment commands despite different syntax, aliases, or obfuscation. The model surfaces the highest-attention
    tokens as the top-3 explanatory features so analysts see which parts of the command drove the classification.
    This is valuable against capable actors who craft novel ways to disable history; a positive result
    that also correlates with a privileged session strongly supports Defense Impairment. Validate model
    output against the deterministic regex layer and feed confirmed cases back into training.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - auditd
  - macOS Unified Log
  - networkdevice:cli
  - 'NAI: SIEM platform aggregating command-line logs from all enterprise endpoints, servers, and network
    devices with command logging capabilities.'
  range: Last 90 days for scoring; periodic retraining
  queries:
  - technology: ML/Transformer pseudocode
    query: |-
      emb = transformer_shell_model.encode(cmdline);
      score = similarity(emb, history_impairment_intent_centroids);
      explain = top_attention_tokens(cmdline, 3);
      alert when score >= threshold; output host, user, cmdline, score, explain
- question: Did a history-impairment command run from an atypical parent process or shortly after a remote
    login from an unfamiliar country or ASN, especially following a failed-then-successful logon sequence?
  context: 'Context elevates a history-impairment command from suspicious to high-priority. Correlate
    the impairment event with Windows 4624 logons and Zeek conn.log so you can tie it to a specific Logon
    ID, source IP, geolocation, and ASN. Alert when the command runs from an unusual parent process or
    soon after a remote login from a country/ASN the account never uses. Treat a failed-then-successful
    logon sequence preceding the impairment as higher severity, because it suggests credential guessing
    followed by access and immediate evasion. This directly supports the Defense Impairment hypothesis:
    an external actor who just authenticated is silencing history before acting. Capture the Logon ID,
    source IP, parent process, and account for follow-on session reconstruction.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - auditd
  - macOS Unified Log
  - Zeek conn.log
  - 'NAI: SIEM platform capable of correlating authentication logs (Windows, Zeek), process logs (Windows,
    Linux), and IP geolocation enrichment data.'
  range: Last 90 days, event-centered on the logon-to-impairment window
  queries:
  - technology: SIEM/Correlation pseudocode
    query: |-
      imp = history_impairment_events;
      logon = win_4624 OR zeek_conn (remote);
      geo = enrich(source_ip -> country, asn);
      join imp to logon on logon_id within 30m;
      alert when imp.parent_process atypical
                or geo.country/asn not_in account_baseline
                or failed_then_success(logon);
      output account, logon_id, source_ip, country, asn, parent_process, cmdline
- question: Within a session's first ten minutes, is command-line entropy or the (user, parent, command)
    tuple unusually rare compared with the user's normal early-session behavior?
  context: The opening minutes of a session often reveal an adversary's intent. Flag sessions whose first-10-minute
    command-line entropy exceeds the 95th percentile for that user, baselining per established entropy
    methods, and combine this with rare (user, parent, command) tuple scoring drawn from context-based
    irregular-activity detection. Early high entropy or a never-before-seen tuple immediately after login
    suggests scripted or obfuscated activity, including pre-emptive history impairment. Report the contributing
    attributes so analysts can compare the session against the user's routine. In a Defense Impairment
    context, an actor who logs in and immediately runs unusual, high-entropy commands is a prime candidate
    for hands-on evasion.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - auditd
  - macOS Unified Log
  - Zeek conn.log
  - 'NAI: SIEM platform capable of correlating authentication logs (Windows, Zeek), process logs (Windows,
    Linux), and IP geolocation enrichment data.'
  range: Last 90 days, scoped to the first 10 minutes of each session
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      sess = sessions(logon_id);
      early = commands where ts <= sess.start + 10m;
      ent = shannon_entropy(early.cmdline);
      tuple_freq = freq(user, parent, command);
      alert when ent > percentile(user_early_entropy, 95)
                or tuple_freq < rare_threshold;
      output user, logon_id, early_entropy, rare_tuple, contributing_attributes
- question: Does a time-series or provenance-graph model flag a reconstruction-error spike or an anomalous
    process/file edge tied to a history-impairment command within a session?
  context: Sequence- and graph-based anomaly detection captures impairment embedded in otherwise complex
    sessions. Feed process, parent, network, and file features per time step into an LSTM autoencoder
    and alert on reconstruction-error spikes coinciding with impairment commands; alternatively use provenance-graph
    GNNs (such as KAIROS or ThreaTrace) that flag the anomalous edge or node — for example, a remotely
    logged-in process redirecting `~/.bash_history` to `/dev/null` — and reconstruct an explainable subgraph
    naming the top-3 contributing entities. This gives analysts both a score and a causal picture of how
    the impairment fits the session. A spike anchored on a redirect-to-/dev/null or PSReadLine change
    strongly corroborates Defense Impairment by an active operator.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - auditd
  - macOS Unified Log
  - Zeek conn.log
  - 'NAI: SIEM platform capable of correlating authentication logs (Windows, Zeek), process logs (Windows,
    Linux), and IP geolocation enrichment data.'
  range: Last 90 days for training; event-centered scoring
  queries:
  - technology: ML/Autoencoder+GNN pseudocode
    query: |-
      steps = per_timestep_features(process, parent, network, file) by session;
      err = lstm_autoencoder.reconstruction_error(steps);
      graph = provenance_graph(session);  // KAIROS / ThreaTrace
      anomaly_edge = gnn.flag(graph);     // e.g. proc -> redirect ~/.bash_history -> /dev/null
      alert when err spikes near impairment_event or anomaly_edge present;
      output session, change_time, anomaly_edge, top3_entities, subgraph
- question: After a history-impairment command runs in a session, does the same session go on to execute
    Discovery, Credential Access, or Execution commands before it times out?
  context: 'Impairment is rarely the goal in itself; it precedes other malicious activity. Track Logon
    ID sessions and maintain a stateful watchlist: once a history-impairment command runs (using the MITRE
    T1690 and Linux history-tampering vocabularies), alert if subsequent reconnaissance, credential-access,
    or execution commands appear before session timeout. This sequence — silence the record, then act
    — is a hallmark of a deliberate intrusion and is strong evidence the Defense Impairment was in service
    of a broader objective. Prioritize sessions on critical servers, admin workstations, and developer
    endpoints. Capture the full ordered command list for the session so analysts can scope the actor''s
    intent.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - auditd
  - macOS Unified Log
  - 'NAI: Critical servers (Domain Controllers, file servers), administrator workstations, and developer
    endpoints.'
  range: Last 90 days, per-session until session timeout
  queries:
  - technology: SIEM/Stateful-rule pseudocode
    query: |-
      state[logon_id].impaired = true when history_impairment_cmd seen;
      followups = cmds tagged Discovery|CredentialAccess|Execution;
      alert when state[logon_id].impaired
                and followups occur before session_timeout;
      output logon_id, host, user, impairment_cmd, followup_cmds, sequence
- question: Within tokenized command sequences, does any ATT&CK trigram containing history impairment
    (T1690) and security-tool tampering (T1562.003) occur with a corpus probability below 0.05%?
  context: Rare command sequences expose tradecraft that individual commands hide. Tokenize each session's
    commands into ATT&CK technique trigrams and flag those that include T1690 (and T1562.003) with a corpus
    probability under 0.05%, scoring rare contextual tuples per context-based irregular-activity detection.
    A statistically rare trigram linking history impairment to other evasion or action techniques indicates
    a coordinated sequence rather than incidental administration. Surface the rare trigram and its frequency
    in the alert so analysts can immediately see the suspicious chain. This directly supports the Defense
    Impairment PIR by quantifying how unusual the observed sequence is.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - auditd
  - macOS Unified Log
  - 'NAI: Critical servers (Domain Controllers, file servers), administrator workstations, and developer
    endpoints.'
  range: Last 90 days, with a trailing trigram corpus
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      seq = map_commands_to_attack_techniques(session_cmds);
      trigrams = ngrams(seq, 3);
      corpus_p = lookup_probability(trigram, trailing_corpus);
      alert when trigram contains T1690 and corpus_p < 0.0005;
      output logon_id, rare_trigram, corpus_probability, surrounding_commands
- question: Do post-impairment commands fall outside the top-k next events predicted by a learned model
    of normal command sequences?
  context: Predictive sequence modeling detects when what happens after impairment is abnormal. Model
    timed event sequences with a DeepLog-style LSTM that predicts the next log key, and alert when post-impairment
    commands fall outside the top-k predicted next keys; a Seq2Seq variant can flag deviation after impairment
    activity. Reporting predicted-versus-observed keys as the explanation lets analysts see exactly where
    the session diverged from learned-normal behavior. Because adversaries who suppress history then run
    unexpected tools, an out-of-prediction follow-on command strongly supports Defense Impairment leading
    to further intrusion. Retrain on benign admin sessions and review deviations against maintenance baselines
    to control false positives.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - auditd
  - macOS Unified Log
  - 'NAI: Critical servers (Domain Controllers, file servers), administrator workstations, and developer
    endpoints.'
  range: Last 90 days for training; event-centered scoring
  queries:
  - technology: ML/Sequence pseudocode
    query: |-
      model = deeplog_lstm.train(normal_command_key_sequences);
      for each session after impairment_event:
        pred = model.topk_next_keys(history);
        if observed_key not in pred: deviation = true;
      alert when deviation; output logon_id, predicted_keys, observed_key, divergence_point
- question: Was a default shell history file deleted, truncated to zero, symlinked to /dev/null, or made
    immutable with chattr +i?
  context: Direct tampering with the history file itself is a clear impairment signal. Using auditd or
    Windows Event ID 4663 file-access auditing, alert on deletion, truncation, symlink-to-/dev/null, or
    `chattr +i` of default history files such as `~/.bash_history` and `ConsoleHost_history.txt`, per
    the Clearing Windows Console History and Linux history-tampering Sigma rules. These operations either
    erase the record or prevent future writes, and they have very few legitimate uses on production systems.
    Capture the actor, process, and target path so analysts can confirm intent. In a Defense Impairment
    context, an actor making the history file immutable or piping it to /dev/null is taking durable steps
    to ensure their commands are never recorded.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - auditd
  - macOS Unified Log
  - 'NAI: File Integrity Monitoring (FIM) system and SIEM, monitoring user profile directories (~, %APPDATA%)
    on all endpoints and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      fim = file_events(auditd|win_4663) on [~/.bash_history, *sh_history, %APPDATA%\\...\\ConsoleHost_history.txt];
      alert when action in [delete, truncate_to_zero, symlink_to_/dev/null, chattr +i, set_immutable];
      output host, user, process, target_file, action
- question: Does a history file's size or last-modified timestamp stay static even though more than five
    commands ran in the same 15-minute window?
  context: 'A missing expected write is itself evidence. Baseline normal history-file size and timestamp
    growth, then alert when metadata stays static despite more than 5 commands in 15 minutes — a greater-than-3-sigma
    deviation from expected growth. This profiles the failure-mode ''absence'' signal: the history write
    that should have happened never did, implying HISTFILE was unset, history was disabled, or the file
    was made immutable. Report observed-versus-expected file growth so analysts can quantify the gap.
    Because legitimate interactive activity reliably grows the history file, a flatline during active
    use is a high-confidence indicator of Defense Impairment that complements the deterministic FIM rule.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - auditd
  - macOS Unified Log
  - 'NAI: File Integrity Monitoring (FIM) system and SIEM, monitoring user profile directories (~, %APPDATA%)
    on all endpoints and servers.'
  range: Last 90 days, with 15-minute activity windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      cmds = count(interactive_commands) by host,user,15m;
      growth = delta(history_file.size, history_file.mtime) by host,user,15m;
      baseline = expected_growth_model(cmds);
      alert when cmds > 5 and growth ~ 0
                and deviation(growth, baseline) > 3*sigma;
      output host, user, history_file, observed_growth, expected_growth, command_count
- question: Does forecasting or change-point detection show history-file growth flatlining or dropping
    to zero relative to command volume, and when exactly did growth cease?
  context: Time-series modeling pinpoints the moment history stopped being recorded. Model history-file
    size growth with ARIMA using command volume as an exogenous input and flag deviations such as a flatline
    or sudden zero; apply change-point detection (CUSUM or Bayesian online CPD) to identify the precise
    moment growth ceased, and report the change-point timestamp and magnitude. This gives analysts a timeline
    anchor for when impairment began, which is invaluable for scoping concurrent malicious activity. A
    change point where expected growth (given command volume) drops to zero is strong evidence of Defense
    Impairment, especially when it aligns with a suspicious login or process. Use the timestamp to pivot
    into session and authentication logs.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - auditd
  - macOS Unified Log
  - 'NAI: File Integrity Monitoring (FIM) system and SIEM, monitoring user profile directories (~, %APPDATA%)
    on all endpoints and servers.'
  range: Last 90 days for modeling; change-point localization
  queries:
  - technology: ML/Time-series pseudocode
    query: |-
      series = history_file_size over time;
      exog = command_volume over time;
      model = ARIMA(series, exog=exog);
      cp = changepoint(CUSUM|BOCPD) on residuals;
      alert when forecast_expects_growth but observed flatline_or_zero;
      output host, user, history_file, change_point_ts, magnitude, expected_vs_observed
- question: Did a network device, ESXi shell, or appliance session suppress logging (e.g., 'no logging',
    'history size 0', 'terminal history', 'set cli history', ESXi 'unset HISTFILE') and then issue privileged
    changes that left no expected audit trail?
  context: Network and appliance command logging is a frequent blind spot adversaries exploit. Correlate
    CLI commands such as `no logging`, `history size 0`, `terminal history`, `set cli history`, ESXi `unset
    HISTFILE`, or vendor equivalents with a subsequent lack of expected command-audit records. Alert when
    the same admin account later issues privileged changes without the expected history trail. This pattern
    — disable logging, then act — is the network-device expression of Defense Impairment and is especially
    dangerous on management-plane devices where a single change can affect many systems. Capture the device,
    session, admin account, and the suppression command, and treat absent audit records following suppression
    as confirmation rather than a gap.
  answer_sources:
  - networkdevice:cli
  - esxi:shell
  - Syslog
  - 'NAI: Network management plane devices, ESXi administrators, and appliance jump boxes'
  range: Last 90 days
  queries:
  - technology: SIEM/Correlation pseudocode
    query: |-
      supp = cli_events where cmd in ['no logging','history size 0','terminal history','set cli history','unset HISTFILE'];
      later = privileged_change_events by same admin,device after supp.ts;
      audit_gap = expected_audit_records(later) missing;
      alert when supp and (audit_gap or later present);
      output device, admin_account, session, suppression_cmd, missing_records
- question: Does an administrative session record fewer commands than the device-class baseline (below
    the 1st percentile) or show an abrupt flatline in history output while still performing administrative
    actions?
  context: Quiet audit logs during active administration betray suppression. Baseline the normal recorded-command
    count per admin session and the expected history depth per device class, then alert when a session
    drops below the 1st percentile of recorded commands while still performing administrative actions,
    or when history output abruptly flatlines. Use change-point detection to catch the abrupt cessation
    and report the contributing session and device. This statistical 'absence' signal catches impairment
    even when the specific suppression command is not visible in logs, which is common on appliances.
    A session that effects configuration changes yet records almost nothing is a high-confidence Defense
    Impairment indicator on the management plane.
  answer_sources:
  - networkdevice:cli
  - esxi:shell
  - Syslog
  - 'NAI: Network management plane devices, ESXi administrators, and appliance jump boxes'
  range: Last 90 days, with per-device-class session baselines
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = recorded_command_count by device_class (trailing_90d);
      for each admin_session:
        n = count(recorded_commands);
        cp = changepoint(history_output_rate);
      alert when n < percentile(baseline,1) and admin_actions present
                or cp shows abrupt flatline;
      output device, device_class, session, recorded_count, baseline_p1, change_point
- question: Does a sequence classifier distinguish a routine appliance/ESXi administration session from
    a history-suppression session based on CLI commands, session duration, authentication context, and
    audit-event gaps?
  context: Machine learning ties together the subtle features that separate normal administration from
    deliberate suppression. Train a sequence classifier (LOLAL on command text, or DeepLog on audit-event-gap
    sequences) using CLI commands, session duration, authentication context, and audit-event gaps. Score
    higher when suppression commands are followed by configuration changes, discovery, or lateral movement,
    and emit the top-3 contributing features in the alert. This helps analysts prioritize the appliance
    and ESXi sessions most consistent with Defense Impairment in service of further intrusion, while down-weighting
    benign maintenance. Feed confirmed cases back to refine the model and pair its output with the deterministic
    suppression-correlation rule for confidence.
  answer_sources:
  - networkdevice:cli
  - esxi:shell
  - Syslog
  - 'NAI: Network management plane devices, ESXi administrators, and appliance jump boxes'
  range: Last 90 days for training; per-session scoring
  queries:
  - technology: ML/Sequence-classifier pseudocode
    query: |-
      features = [cli_command_seq, session_duration, auth_context, audit_event_gaps];
      model = LOLAL_or_DeepLog.train(labeled_sessions);
      score = model.predict(features);
      boost if suppression_cmd followed_by config_change|discovery|lateral_movement;
      explain = top3_features(features);
      alert when score >= threshold; output device, admin_account, session, score, explain
