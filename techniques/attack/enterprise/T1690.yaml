name: 'T1690: Prevent Command History Logging'
id: 63b174a6-20f4-4552-83eb-29da022048f3
description: 'Investigate adversary attempts to impair or prevent command history logging in order to
  hide the commands they run on compromised systems. This playbook helps an analyst hunt for tampering
  with shell history across platforms: unset or zeroed bash/zsh history variables (HISTFILE, HISTCONTROL,
  HISTFILESIZE) on Linux and macOS, PowerShell PSReadLine suppression (Set-PSReadLineOption -HistorySaveStyle
  SaveNothing, redirected HistorySavePath, Remove-Module PSReadLine) on Windows, ESXi shell history manipulation,
  and network-device CLI logging disablement such as ''no logging''. It covers known-tool and keyword/regex
  matching, fleet-wide prevalence and frequency-outlier scoring, command-line entropy and obfuscation
  detection, anomalous execution context such as service accounts, unusual parent processes, and suspicious
  remote logins, TTP-sequence correlation where history impairment precedes Discovery, Credential Access,
  or Execution, history-file integrity and metadata anomalies (deletion, truncation, symlink to /dev/null,
  chattr +i, static timestamps despite activity), and appliance or ESXi sessions that suppress their audit
  trails. Detection methods span symbolic logic, statistical baselining, and machine learning so analysts
  can determine whether an adversary is actively evading detection by silencing the record of their commands.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
