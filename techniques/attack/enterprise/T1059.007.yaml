questions:
- question: Did a Windows Script Host or HTA process (wscript.exe, cscript.exe, or mshta.exe) execute
    and then, within roughly two minutes, initiate an outbound network connection whose destination IP,
    domain, HTTP host, or downloaded JavaScript file hash matches threat intelligence?
  context: 'This question hunts for the core JavaScript-execution-to-C2 pattern under the Execution tactic:
    an adversary uses Windows Script Host or an HTA to run JScript that then beacons to or downloads from
    attacker infrastructure. Correlate Sysmon Event ID 1 (capturing parent image and command line of wscript.exe/cscript.exe/mshta.exe)
    with Sysmon Event ID 3 network connections from the same PID within a 2-minute window, and enrich
    the destination using Zeek dns.log/http.log and the downloaded file SHA256 from Zeek files.log. A
    positive result is a script host whose egress destination or dropped JS hash matches known-bad indicators;
    a particularly high-fidelity case is mshta.exe spawning a child that immediately opens a network connection.
    A negative result (no matching IOC, expected internal destination) suggests benign administrative
    scripting, but should still be baselined.'
  answer_sources:
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 3 (Network Connection)
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: User Workstations, Web Proxies and Gateways, DNS Servers, Email Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc = sysmon(EventID=1) where Image in [wscript.exe, cscript.exe, mshta.exe]\nnet  = sysmon(EventID=3)\
      \ where ProcessId=proc.ProcessId AND ts within 120s of proc.ts\njoin dns.log/http.log on net.dest;\
      \ join files.log on downloaded JS SHA256\nALERT if net.dest_ip|dns.query|http.host in threat_intel\n\
      \       OR files.sha256 in known_bad_hashes\n       OR (proc.Image=mshta.exe AND proc spawns child\
      \ with EventID=3)\nOUTPUT proc.ParentImage, proc.CommandLine, net.dest, files.sha256"
- question: For domains contacted by a script-host process, is the domain newly registered, low-reputation,
    rare among peers, or showing a burst of resolution/connection failures (NXDOMAIN, HTTP 404, blocked
    connections) immediately after script execution?
  context: 'Under Execution, adversaries frequently point script-host payloads at freshly stood-up or
    algorithmically generated infrastructure. Score each unique domain a script host contacts by WHOIS
    age (<30 days), ASN reputation, and passive-DNS prevalence, and compare against a 30-day per-user
    and enterprise baseline; alert when the domain is new for the user, seen by fewer than 2% of peers,
    and low-reputation. Separately, watch for failure-rate signals: a sustained burst of NXDOMAIN responses
    (>5/min) or HTTP 404/blocked-connection ratio above 30% right after script execution indicates DGA
    or dead-drop C2 where the infrastructure is stale or rotating. Positive findings warrant pivoting
    to the script-host process tree and isolating the host.'
  answer_sources:
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 3 (Network Connection)
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: User Workstations, Web Proxies and Gateways, DNS Servers, Email Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for domain in script_host_contacts:\n  score = f(whois_age<30d, asn_reputation, passivedns_prevalence)\n\
      \  baseline = per_user + enterprise over 30d\n  ALERT if domain new_for_user AND seen_by<2%_peers\
      \ AND low_reputation\n# failure-mode\nrate = nxdomain_per_min OR http4xx_blocked_ratio after script_exec\n\
      ALERT if nxdomain>5/min OR failure_ratio>0.30"
- question: Do network connections following a script-host execution show the periodic, low-volume signature
    of C2 beaconing, i.e., a low coefficient of variation in inter-arrival times and small bytes-per-connection
    to a single destination?
  context: This statistical method targets beaconing initiated by JavaScript run via a script host. For
    connections in a 15-minute window after script-host execution, compute the coefficient of variation
    (CV) of inter-arrival times per destination and the average bytes per connection. A CV below 0.15
    combined with bytes/connection below 500 is the classic periodic, low-volume heartbeat of an implant
    checking in (RITA DFFT scoring, BAYWATCH). Jitter and large data transfers raise CV/volume and reduce
    confidence, so a clean CV near regular intervals with tiny payloads is the strongest indicator. Confirmed
    beaconing should escalate to C2 scoping and blocking of the destination.
  answer_sources:
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 3 (Network Connection)
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: User Workstations, Web Proxies and Gateways, DNS Servers, Email Gateways'
  range: Last 90 days; window connections to 15 minutes after each script-host execution
  queries:
  - technology: SIEM/Stats pseudocode
    query: "conns = egress where ts in [script_exec, script_exec+15m]\ngroup by dest:\n  CV = stddev(inter_arrival)/mean(inter_arrival)\n\
      \  vol = mean(bytes_per_conn)\nALERT if CV<0.15 AND vol<500"
- question: Does a supervised ensemble model (Random Forest + Gradient Boosting) trained on Zeek-derived
    features score a script-host-triggered connection above 0.75 probability of being malicious, and what
    are the top contributing features?
  context: 'When simple rules and thresholds are evaded, an ML ensemble can catch malicious script-host
    egress by combining many weak signals. Train Random Forest + Gradient Boosting on Zeek features captured
    when a script host triggers a connection: destination IP reputation, WHOIS age, HTTP header anomalies,
    TLS issuer rarity, payload size, and connection-failure ratio. Score new connections and alert above
    0.75 maliciousness probability, always surfacing the top-3 contributing features so the analyst understands
    why (Explainability), consistent with proxy-embedded ML detection (Cujo). A high score with intuitive
    drivers (new domain, rare TLS issuer, anomalous headers) supports escalation; investigate model drift
    if benign automation scores high.'
  answer_sources:
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 3 (Network Connection)
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: User Workstations, Web Proxies and Gateways, DNS Servers, Email Gateways'
  range: Last 90 days
  queries:
  - technology: Analytics/ML pseudocode
    query: 'features = [dest_ip_rep, whois_age, http_header_anomaly, tls_issuer_rarity, payload_size,
      conn_failure_ratio]

      model = ensemble(RandomForest, GradientBoosting)

      p = model.predict_proba(features)

      ALERT if p>0.75; OUTPUT top3_feature_importance'
- question: Was a script-host process (wscript.exe, cscript.exe, mshta.exe) launched with a command line
    containing obfuscation or decode primitives such as long Base64 runs, eval/unescape/document.write,
    atob/btoa/String.fromCharCode, FromBase64String, or %var% expansion?
  context: 'Adversaries obfuscate JScript payloads to defeat static analysis (Obfuscated Files or Information),
    so the command line that invokes the script host often carries decode primitives. Parse the CommandLine
    field of Sysmon Event ID 1 / Windows 4688 for wscript.exe/cscript.exe/mshta.exe and match the Prophiler-derived
    co-occurrence set: Base64 runs (\b[A-Za-z0-9+/]{20,}={0,2}\b), eval/unescape/document.write, atob/btoa/String.fromCharCode,
    FromBase64String, and %var% environment-variable expansion. Alert immediately on any match and capture
    the surrounding payload context. Legitimate scripts occasionally use these constructs, so confirm
    with parentage and the decoded content; a clear decode-then-execute chain on a workstation is high-confidence
    malicious.'
  answer_sources:
  - Sysmon Event ID 1 (Process Creation - CommandLine field)
  - Windows Event ID 4688 (Process Creation - Parameters)
  - 'NAI: User Workstations, Application Servers, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "evt = (sysmon EventID=1 OR win EventID=4688) where Image in [wscript.exe,cscript.exe,mshta.exe]\n\
      cl = evt.CommandLine\nALERT if cl matches /[A-Za-z0-9+\\/]{20,}={0,2}/\n   OR cl contains any [eval,unescape,document.write,atob,btoa,String.fromCharCode,FromBase64String]\n\
      \   OR cl matches /%[A-Za-z0-9_]+%/\nOUTPUT evt.ParentImage, cl"
- question: Does a script-host command-line argument exhibit Shannon entropy above benign baselines (>6.5
    bits, with >7.2 indicating packed/encrypted content) or a special-character ratio above 25%, measured
    as a z-score deviation from per-host/user norms?
  context: High entropy and dense special characters are statistical fingerprints of encoded or packed
    JScript passed to a script host. Compute Shannon entropy per script argument and build 14-day per-host/user
    baselines; flag entropy above 6.5 bits (above 7.2 strongly suggests encryption/packing per Lyda &
    Hamrock) or a special-character ratio above 25%, and alert when the z-score exceeds 3 standard deviations
    from baseline. Derive your own thresholds from the benign script-host argument distribution in your
    environment, because some admin tooling is naturally high-entropy. A sustained, anomalous entropy
    spike on an interactive user host is a strong obfuscation signal worth decoding and triaging.
  answer_sources:
  - Sysmon Event ID 1 (Process Creation - CommandLine field)
  - Windows Event ID 4688 (Process Creation - Parameters)
  - 'NAI: User Workstations, Application Servers, Terminal Servers'
  range: Last 90 days; baseline window 14 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for arg in script_host.CommandLine.args:\n  H = shannon_entropy(arg); sc = special_char_ratio(arg)\n\
      \  z = (H - baseline_mean_host_user)/baseline_std\nALERT if H>6.5 (flag>7.2 packed) OR sc>0.25 OR\
      \ z>3"
- question: Does a Random Forest classifier trained on script command-line features (argument count, per-argument
    entropy, encoded-string presence, keyword density for eval/ActiveX/XMLHTTP, special-character ratio,
    length) score a script-host invocation above 0.80 probability of being malicious?
  context: 'This ML method generalizes obfuscation detection beyond fixed regexes. Train a Random Forest
    on lexical features of script-host invocations: argument count, per-argument entropy, presence of
    encoded strings, keyword density (eval, ActiveX, XMLHTTP), special-character ratio, and length distribution.
    Score all script-host invocations, alert above 0.80 probability, and output ranked feature attribution
    (Explainability), following AST/lexical classification (JaSt). The advantage is catching novel obfuscation
    that no single keyword rule covers; the analyst should validate flagged invocations against process
    lineage and decoded payloads, and retrain if legitimate automation drives false positives.'
  answer_sources:
  - Sysmon Event ID 1 (Process Creation - CommandLine field)
  - Windows Event ID 4688 (Process Creation - Parameters)
  - 'NAI: User Workstations, Application Servers, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: Analytics/ML pseudocode
    query: 'features = [arg_count, per_arg_entropy, encoded_string_present, keyword_density(eval,ActiveX,XMLHTTP),
      special_char_ratio, length_dist]

      model = RandomForest.fit(labeled_cmdlines)

      p = model.predict_proba(features)

      ALERT if p>0.80; OUTPUT ranked_feature_attribution'
- question: 'Does JavaScript extracted from network traffic (Zeek files.log, HTTP/SVG bodies, SMTP attachments)
    match a curated YARA ruleset for BeEF markers, eval(atob(...))/eval(String.fromCharCode), hardcoded
    C2 IP:port, or HTML/SVG smuggling API co-occurrence (Blob + base64 data: + URL.createObjectURL + msSaveOrOpenBlob
    + auto-clicked anchor)?'
  context: 'Adversaries deliver malicious JavaScript over the wire as drive-by payloads, phishing attachments,
    and HTML/SVG smuggling loaders. Scan JS that Zeek extracts (files.log) plus HTTP and SVG bodies with
    a curated YARA ruleset covering BeEF hooks (hook.js), eval(atob(...)) / eval(String.fromCharCode)
    decode-execute pairs, hardcoded C2 endpoints (\d{1,3}(\.\d{1,3}){3}:\d{4,5}), and the smuggling API
    co-occurrence chain (Blob + base64 data: URI + URL.createObjectURL + msSaveOrOpenBlob + an auto-clicked
    download anchor) per Microsoft and Talos research. Alert on any hit and record the matched pattern.
    This is a high-precision signal; a hit on an inbound email attachment or web response strongly indicates
    attempted delivery and should drive blocking and recipient hunting.'
  answer_sources:
  - Zeek http.log (with HTTP response body)
  - Zeek files.log (extracted files and metadata)
  - Zeek smtp.log (file attachments)
  - Network PCAP (full packet capture or selective)
  - 'NAI: Network Egress Points, Web Application Firewalls (WAFs), Intrusion Detection/Prevention Systems
    (IDS/IPS), Email Gateways, Content Delivery Networks (CDNs)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for js in zeek_files.log(mime=javascript) + http_body + svg_body + smtp_attachment:\n  yara_scan(js,\
      \ ruleset=[BeEF/hook.js, eval(atob), eval(String.fromCharCode),\n    /\\d{1,3}(\\.\\d{1,3}){3}:\\\
      d{4,5}/,\n    smuggle: Blob & 'data:base64' & URL.createObjectURL & msSaveOrOpenBlob & auto_click_anchor])\n\
      ALERT on any match; OUTPUT matched_rule, src, dst"
- question: Does the AST structure and entropy of an extracted JavaScript file diverge sharply from benign
    framework baselines, for example >2.5 SD divergence or more than 5 eval-like constructs, elevated
    StringLiteral ratios, deep nesting, or many long/base64 strings?
  context: Obfuscated malicious JavaScript has a distinctive structural footprint compared to legitimate
    CDN/framework code. Per extracted file, compute AST statistics (StringLiteral/total-node ratio, eval/Function/new
    Function frequency, average nesting depth, long-string and base64 counts) and overall file entropy,
    then compare against a benign baseline built from whitelisted scripts like jQuery and React. Alert
    at >2.5 SD divergence or more than 5 eval-like constructs, using benign-vs-malicious distributions
    from Prophiler and JSAND. Minified-but-benign frameworks can be high-entropy, so the AST features
    disambiguate true obfuscation; a strong divergence on a script delivered to an endpoint warrants deobfuscation
    and correlation with execution telemetry.
  answer_sources:
  - Zeek http.log (with HTTP response body)
  - Zeek files.log (extracted files and metadata)
  - Zeek smtp.log (file attachments)
  - Network PCAP (full packet capture or selective)
  - 'NAI: Network Egress Points, Web Application Firewalls (WAFs), Intrusion Detection/Prevention Systems
    (IDS/IPS), Email Gateways, Content Delivery Networks (CDNs)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for js in extracted_files:\n  ast = parse(js)\n  feats = [stringlit_ratio, eval_freq, nesting_depth,\
      \ longstr_count, base64_count, entropy]\n  d = stddev_divergence(feats, benign_baseline[jQuery,React])\n\
      ALERT if d>2.5 OR eval_like_constructs>5"
- question: Do obfuscation-resilient deep-learning/structural classifiers (AST-context naive Bayes ZOZZLE,
    AST n-gram Random Forest JaSt, PDG data-flow JStap) score tokenized JavaScript above 0.80 confidence
    as malicious, including detection of decode->Blob->download dependency chains?
  context: 'Sophisticated payloads defeat signatures, so structural ML that models the code''s grammar
    and data flow is needed. Classify tokenized JS with obfuscation-resilient models: hierarchical AST-context
    naive Bayes (ZOZZLE), AST syntactic n-gram Random Forest (JaSt), and PDG data-flow models (JStap)
    that capture the decode->Blob->download dependency chain characteristic of smuggling loaders. Train
    on labeled benign frameworks versus known malicious payloads, alert above 0.80 confidence, and output
    the top-3 contributing AST features for explainability. A high-confidence hit, especially one whose
    features reveal a decode-to-download flow, is strong evidence of an adversary-controlled payload and
    should feed back into YARA/signature creation.'
  answer_sources:
  - Zeek http.log (with HTTP response body)
  - Zeek files.log (extracted files and metadata)
  - Zeek smtp.log (file attachments)
  - Network PCAP (full packet capture or selective)
  - 'NAI: Network Egress Points, Web Application Firewalls (WAFs), Intrusion Detection/Prevention Systems
    (IDS/IPS), Email Gateways, Content Delivery Networks (CDNs)'
  range: Last 90 days
  queries:
  - technology: Analytics/ML pseudocode
    query: 'tokens = tokenize(js); ast = parse(js); pdg = build_pdg(ast)

      scores = [ZOZZLE(ast), JaSt(ast_ngrams), JStap(pdg)]

      p = ensemble(scores)

      ALERT if p>0.80; flag decode->Blob->download chain; OUTPUT top3_ast_features'
- question: 'Was a JavaScript interpreter (wscript.exe, cscript.exe, mshta.exe) spawned by an unusual
    parent such as WINWORD.EXE, EXCEL.EXE, a browser, or OUTLOOK.EXE, or executed from a restricted path
    (Downloads, AppData\Local\Temp, Public, Windows\Temp, or a non-C: drive)?'
  context: 'Macro-assisted delivery and drive-by downloads reveal themselves through abnormal process
    lineage and execution location. Whitelist legitimate parents (schedulers, management tools, dev environments)
    and alert on forbidden pairs in Sysmon Event ID 1: WINWORD.EXE->wscript.exe, EXCEL.EXE->cscript.exe,
    IEXPLORE.EXE/chrome.exe->wscript.exe/mshta.exe, OUTLOOK.EXE->cscript.exe; also flag execution from
    restricted paths. This lineage logic mirrors the browser->script chain in Elastic''s suspicious-browser-child-process
    rule. Output the parent name and image path. An Office or browser process birthing a script host is
    a hallmark of phishing/drive-by execution and is high-fidelity; benign exceptions (e.g., a developer
    tool) should be whitelisted explicitly.'
  answer_sources:
  - Sysmon Event ID 1 (Process Creation - ParentImage and Image fields)
  - Sysmon Event ID 10 (Process Access - for integrity analysis)
  - Windows Event ID 4688 (Process Creation - with enhanced option enabled)
  - 'NAI: User Workstations, Mail Servers, File Servers, Web Servers, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "evt = sysmon(EventID=1) where Image in [wscript.exe,cscript.exe,mshta.exe]\nforbidden = {WINWORD.EXE,EXCEL.EXE,IEXPLORE.EXE,chrome.exe,OUTLOOK.EXE,POWERPNT.EXE}\n\
      restricted = [\\Downloads\\, \\AppData\\Local\\Temp\\, \\Public\\, \\Windows\\Temp\\, non-C: drive]\n\
      ALERT if evt.ParentImage in forbidden AND evt.ParentImage not in whitelist\n   OR evt.Image path\
      \ in restricted\nOUTPUT evt.ParentImage, evt.Image"
- question: On macOS, did osascript execute JXA/.js, did a process load OSAKit or use the Objective-C
    bridge, were run-only compiled OSA scripts (osacompile -x, no recoverable source) dropped and executed,
    or did a browser spawn curl/wget/python/osascript/pwsh?
  context: macOS adversaries abuse JavaScript for Automation (JXA) for execution and persistence. Alert
    when osascript executes JXA/.js, when processes load OSAKit or use the Objective-C bridge, or when
    run-only compiled OSA scripts (osacompile -x output with no recoverable source) are dropped and run,
    per SpecterOps persistent-JXA and SentinelLabs run-only AppleScript research. Also flag browsers spawning
    curl/wget/python/osascript/pwsh per the Elastic EQL rule, which indicates initial-access-to-execution
    chaining. Run-only scripts are inherently evasive (source is stripped), so their presence and execution
    is suspicious; correlate with persistence locations and network activity to confirm.
  answer_sources:
  - Sysmon Event ID 1 (Process Creation - ParentImage and Image fields)
  - Sysmon Event ID 10 (Process Access - for integrity analysis)
  - Windows Event ID 4688 (Process Creation - with enhanced option enabled)
  - 'NAI: User Workstations, Mail Servers, File Servers, Web Servers, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "evt = macos_process_events (unifiedlog/osquery)\nALERT if evt.proc=osascript AND args contain\
      \ (.js OR -l JavaScript)\n   OR evt loads OSAKit OR uses objc_bridge\n   OR run_only_osa (osacompile\
      \ -x, no source) executed\n   OR parent in [Safari,Chrome,browser] AND child in [curl,wget,python,osascript,pwsh]"
- question: Is a given parent-child process pair or script execution directory statistically rare for
    that host and user, falling in the bottom 5th percentile or with a rarity score above 0.95 over a
    30-day baseline?
  context: Rarity scoring catches novel execution chains that fixed forbidden-pair lists miss. Build 30-day
    per-host frequency tables of parent-child pairs and script execution paths, and assign rarity = 1
    - frequency. Alert when a new pair or directory falls in the bottom 5th percentile for that host+user,
    or when rarity exceeds 0.95; derive percentile cutoffs from your own telemetry. Under Execution, a
    script host appearing under a never-before-seen parent or running from a never-before-seen directory
    for that user is anomalous and worth triage. Normal but infrequent admin activity may surface, so
    combine rarity with content and network context before escalating.
  answer_sources:
  - Sysmon Event ID 1 (Process Creation - ParentImage and Image fields)
  - Sysmon Event ID 10 (Process Access - for integrity analysis)
  - Windows Event ID 4688 (Process Creation - with enhanced option enabled)
  - 'NAI: User Workstations, Mail Servers, File Servers, Web Servers, Terminal Servers'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'freq = 30d_table(host,user, parent_child_pair, exec_dir)

      rarity = 1 - freq

      ALERT if pair/dir in bottom_5th_percentile(host,user) OR rarity>0.95'
- question: Does an Isolation Forest trained on process-spawning context (parent name/path, interpreter
    path, command-line hash, user privilege, directory class) flag a script-host launch with anomaly score
    above 0.80?
  context: 'This unsupervised method models the multidimensional context of script-host spawning to surface
    outliers without labeled data. Train an Isolation Forest on features: parent name/path, interpreter
    path, command-line hash, user context (admin vs standard), and directory class (system/user/temp/removable).
    Flag events with anomaly_score above 0.80 and surface the top-3 features driving the score (Explainability).
    An anomalous combination, e.g., a standard user running a script host from removable media with an
    unseen parent, is the kind of subtle deviation rules miss. Validate against business context and feed
    confirmed benign outliers back into the training data to reduce noise.'
  answer_sources:
  - Sysmon Event ID 1 (Process Creation - ParentImage and Image fields)
  - Sysmon Event ID 10 (Process Access - for integrity analysis)
  - Windows Event ID 4688 (Process Creation - with enhanced option enabled)
  - 'NAI: User Workstations, Mail Servers, File Servers, Web Servers, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: Analytics/ML pseudocode
    query: 'features = [parent_name, parent_path, interpreter_path, cmdline_hash, user_priv, dir_class]

      model = IsolationForest.fit(historical_spawns)

      s = model.anomaly_score(event)

      ALERT if s>0.80; OUTPUT top3_features'
- question: Within 10 minutes after a script-host execution, did the host spawn cmd.exe/powershell.exe
    with /c or -Command, write persistence registry keys (Run, RunOnce, Services, Image File Execution
    Options), create a scheduled task (Event ID 4698), or open network connections?
  context: Successful JavaScript execution is usually followed by persistence or C2 establishment, so
    temporal chaining is a powerful confirmation. For each script-host execution (Sysmon Event ID 1),
    within a 10-minute window alert if it (1) spawns cmd.exe/powershell.exe with /c or -Command, (2) writes
    Run/RunOnce/Services/Image File Execution Options keys (Sysmon Event ID 13), (3) creates a scheduled
    task (Windows 4698), or (4) opens network connections. Output the full process lineage. This execution->persistence/C2
    chain mirrors the mshta/JScript pattern in Splunk research. A script host that immediately establishes
    persistence is high-confidence malicious and should trigger containment and persistence removal.
  answer_sources:
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 12 & 13 (Registry object added/deleted, Registry value set)
  - Sysmon Event ID 3 (Network Connection)
  - Windows Event ID 4698 (Scheduled Task Created)
  - Zeek conn.log (network flow metadata)
  - 'NAI: All Endpoints and Servers, Domain Controllers, Network Egress Monitoring Points'
  range: Last 90 days; correlate events within 10 minutes of each script-host execution
  queries:
  - technology: SIEM/Rule pseudocode
    query: "sh = sysmon(EventID=1) where Image in [wscript.exe,cscript.exe,mshta.exe]\nwithin 10m of sh\
      \ ALERT if any:\n  child = sysmon(EventID=1) Image in [cmd.exe,powershell.exe] AND cl has (/c OR\
      \ -Command)\n  reg   = sysmon(EventID=13) TargetObject in [Run,RunOnce,Services,IFEO]\n  task  =\
      \ win(EventID=4698)\n  net   = sysmon(EventID=3)\nOUTPUT full_process_lineage"
- question: After a script-host execution, do Zeek conn.log connections in the next 15 minutes show beaconing
    (CV of inter-arrival times <0.15 and bytes/connection <500) or, alternatively, a spike in failed/reset
    connections or NXDOMAIN responses exceeding a 30% failure ratio?
