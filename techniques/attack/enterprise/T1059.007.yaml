name: 'T1059.007: JavaScript'
id: 61c8c625-7011-48ba-b50b-7202c8e34305
description: Investigate suspected abuse of JavaScript interpreters for adversary code execution across
  Windows, macOS, and Linux. This playbook helps an analyst hunt for and triage malicious use of Windows
  Script Host (wscript.exe, cscript.exe), HTA (mshta.exe) and JScript; macOS JavaScript for Automation
  (JXA) via osascript, OSAKit, and run-only compiled OSA scripts; and the Node.js runtime (node/node.exe).
  It covers script-host execution that initiates outbound connections to command-and-control or downloads
  payloads, obfuscated and high-entropy command lines, malicious JavaScript extracted from network traffic
  (HTTP responses, SMTP attachments, HTML/SVG smuggling), anomalous parent-child process lineage (e.g.,
  Office or a browser spawning a script host) and execution from untrusted directories, follow-on persistence
  or C2 behavior after script execution, and Node.js launched from high-risk locations or exhibiting reverse-shell,
  recon, or exfiltration patterns. Detection methods span symbolic-logic correlation rules, statistical
  baselining (entropy, rarity, beacon cadence and volume), and machine-learning classifiers (Random Forest,
  Gradient Boosting, Isolation Forest, LSTM, and AST/PDG models) so an analyst can confirm or refute malicious
  JavaScript execution and pivot to scope, persistence, and C2.
type: technique
related:
