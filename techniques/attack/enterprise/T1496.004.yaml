name: 'T1496.004: Cloud Service Hijacking'
id: cd9d6d82-df25-4657-8eaf-de9a46a9baa6
description: Investigate suspected Cloud Service Hijacking (T1496.004), in which an adversary abuses compromised
  SaaS / cloud credentials to drive resource-intensive workloads that impact availability and run up cost.
  This playbook helps an analyst hunt for LLMJacking against cloud-hosted AI (e.g., AWS Bedrock InvokeModel)
  fronted by reverse proxies; bulk spam/smishing through messaging services (AWS SES SendEmail/SendRawEmail,
  SNS Publish, SendGrid, Twilio); and the enabling steps that precede abuse (service/policy enablement
  such as UpdateAccountSendingEnabled, PutIdentityPolicy, PutFoundationModelEntitlement, sandbox/sending-limit
  increases, new IAM users/keys). It pairs deterministic symbolic-logic floors (recon-then-invoke windows,
  send-rate and recipient-domain fan-out thresholds, long-duration high-volume egress) with statistical
  baselining (Seasonal-Hybrid ESD, change-point, 3-sigma, peer-group percentiles, attribute rarity) and
  machine-learning approaches (LSTM/DeepLog sequence modeling, Extended Isolation Forest, CS-GAD graph
  anomaly) to surface anomalous principals, source regions/ASNs, and usage spikes. Evidence spans the
  cloud control plane (CloudTrail), network telemetry (Zeek http/conn/smtp), and endpoint authentication
  (Windows Event ID 4624).
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
