name: 'T1055.012: Process Injection: Process Hollowing'
id: 15ad01e0-ffcf-41ac-8962-b24521f5e655
description: 'Investigate potential MITRE ATT&CK T1055.012 Process Injection: Process Hollowing on Windows
  hosts. Process hollowing creates a trusted process in a suspended state, unmaps (hollows) its memory,
  and rewrites it with malicious code before resuming execution, so attacker code runs under the identity
  of a legitimate binary and evades process-based defenses. This playbook helps an analyst hunt the full
  hollowing lifecycle: anomalous parent-child lineage and unusual image paths for core system binaries;
  abnormal startup delays consistent with CREATE_SUSPENDED; the canonical memory-manipulation API chain
  (VirtualAllocEx, WriteProcessMemory, SetThreadContext, ResumeThread) and cross-process access/remote-thread
  creation; in-memory-versus-on-disk image discrepancies, RWX/high-entropy memory, and unbacked execution;
  suspicious or zero-length command lines; network egress from normally-quiet trusted processes pointing
  to C2; and dropper spawn-then-terminate handoff patterns. It combines deterministic symbolic-logic rules,
  statistical baselining, and machine-learning approaches across endpoint (Sysmon, Windows Security, ETW)
  and network (Zeek) telemetry.'
