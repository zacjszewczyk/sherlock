- question: Is a freshly created child process opened by its parent with memory-write or thread-manipulation
    access rights, and where API telemetry exists, does the canonical VirtualAllocEx -> WriteProcessMemory
    -> SetThreadContext -> ResumeThread chain target the same memory address?
  context: 'The mechanical core of hollowing is the parent writing into and re-pointing the child''s memory.
    Alert when a Sysmon EID 1 creation is followed by an EID 10 process access where SourceImage is the
    parent of TargetImage and GrantedAccess includes memory-write/thread flags (0x0008 PROCESS_VM_OPERATION,
    0x0020 PROCESS_VM_WRITE, 0x0002 PROCESS_CREATE_THREAD, or 0x1F0FFF PROCESS_ALL_ACCESS). Where ETW
    API telemetry is available, require the temporal sequence VirtualAllocEx -> WriteProcessMemory ->
    SetThreadContext -> ResumeThread linked by a unified target address to confirm hollowing and suppress
    benign single-API noise. A full chain to one address is near-definitive; isolated single calls are
    common and lower fidelity. In the context of the Stealth tactic, this question helps determine whether
    process hollowing is being used to blend malicious execution into a legitimate process and evade process-based
    defenses. Relevant references: [Can You Run My Code? A Close Look at Process Injection in Windows
    Malware](https://dl.acm.org/doi/10.1145/3708821.3736206). Source method: Symbolic Logic.'
