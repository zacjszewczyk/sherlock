  queries:
  - technology: ML/pseudocode
    query: "seqs = per_host_api_sequences()\np = LSTM_or_HMM.score(seq)\nif p < threshold AND smith_waterman(seq,[Create,ProcessAccess(write),RemoteThread]).score>min:\n\
      \    alert(matched_subchain)"
- question: 'Has Sysmon Event ID 25 (Process Tampering: ''Image is replaced''/''Image is changed'') fired
    for any process, and does the in-memory PE header EntryPoint/section layout differ from the matching
    file on disk?'
  context: 'The defining artifact of hollowing is a running process whose in-memory image no longer matches
    its on-disk file. Sysmon Event ID 25 (Process Tampering) fires precisely on this condition (''Image
    is replaced''/''Image is changed''). Treat any EID 25 as high priority and corroborate by comparing
    the in-memory PE header EntryPoint and section characteristics against the on-disk PE for that process.
    A positive result is among the strongest available indicators of hollowing; a clean comparison reduces
    but does not fully eliminate suspicion for stealthier in-place techniques. In the context of the Stealth
    tactic, this question helps determine whether process hollowing is being used to blend malicious execution
    into a legitimate process and evade process-based defenses. Relevant references: [Detecting Process
    Injection Attacks with Wazuh](https://wazuh.com/blog/detecting-process-injection-attacks-with-wazuh/).
    Source method: Symbolic Logic.'
