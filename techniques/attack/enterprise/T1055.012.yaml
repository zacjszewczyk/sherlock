questions:
- question: Are any core Windows system binaries (svchost.exe, lsass.exe, smss.exe, taskhostw.exe, services.exe)
    being spawned by a parent process that violates the known-good parent-child lineage, or launched from
    a directory outside %SystemRoot%\System32 or SysWOW64?
  context: 'Process hollowing creates a brand-new instance of a trusted binary so the malicious code runs
    under a legitimate-looking process name. The most deterministic tell is a broken lineage: svchost.exe
    must descend from services.exe, lsass.exe from wininit.exe, smss.exe from System, and taskhostw.exe
    from svchost.exe. Build a whitelist of these mandatory parent->child relationships and alert on every
    violation (e.g., svchost.exe whose ParentImage is winword.exe or powershell.exe). Also alert when
    the child image path for these binaries is anywhere other than System32/SysWOW64. A positive hit is
    high fidelity because there are very few benign reasons for these relationships to break; a negative
    result means lineage is intact, though it does not rule out hollowing of a non-core binary. In the
    context of the Stealth tactic, this question helps determine whether process hollowing is being used
    to blend malicious execution into a legitimate process and evade process-based defenses. Relevant
    references: [Non-Services.exe Spawn Svchost.exe](https://research.splunk.com/endpoint/1d38e5e9-2ff8-4c47-872c-bf1657cefab5/),
    [Unusual Parent-Child Relationship](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/),
    [Process Injection (T1055) - Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/).
    Source method: Symbolic Logic.'
