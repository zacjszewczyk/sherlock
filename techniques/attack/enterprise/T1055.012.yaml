  - Sysmon Event ID 1 (ProcessCreate)
  - Windows Event ID 4688
  - 'NAI: User Workstations, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=sysmon EventCode=1\n| eval bad=case(Image LIKE \"%\\\\svchost.exe\" AND ParentImage!=\"\
      C:\\\\Windows\\\\System32\\\\services.exe\",1,\n               Image LIKE \"%\\\\lsass.exe\"  AND\
      \ ParentImage!=\"C:\\\\Windows\\\\System32\\\\wininit.exe\",1,\n               Image LIKE \"%\\\\\
      smss.exe\"   AND ParentImage!=\"System\",1, true(),0)\n| eval pathbad=if(Image LIKE \"%\\\\svchost.exe\"\
      \ AND NOT(Image LIKE \"%\\\\System32\\\\%\" OR Image LIKE \"%\\\\SysWOW64\\\\%\"),1,0)\n| where\
      \ bad=1 OR pathbad=1"
- question: Over a rolling baseline, which (ParentImage, ChildImage, ChildPath) tuples are statistically
    rare across the host and the environment, and do any of those rare tuples produce a System-integrity
    trusted binary from an unusual parent?
  context: 'Hollowing often produces parent/child/path combinations that almost never occur in a healthy
    fleet. Compute the frequency of every (ParentImage, ChildImage, ChildPath) tuple over a rolling 30-day
    per-host and per-environment baseline and flag any tuple in the bottom 1st percentile or seen fewer
    than five times in 90 days. Enrich the score by tracking the integrity level of the spawned image:
    an unusual parent that yields a High/System-integrity trusted binary is a stronger signal than one
    producing a Medium-integrity process. A positive result is a rare lineage worth triage; benign rarity
    (new software, admin tooling) must be ruled out before escalation. In the context of the Stealth tactic,
    this question helps determine whether process hollowing is being used to blend malicious execution
    into a legitimate process and evade process-based defenses. Relevant references: [Process Injection
    (T1055) - Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/).
    Source method: Statistical Method.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=sysmon EventCode=1 earliest=-30d

      | stats count by ParentImage, Image, image_path host

      | eventstats perc1(count) as p1 by host

      | where count<5 OR count<=p1

      | eval score=if(IntegrityLevel IN ("System","High"),count*0.5,count) | sort score'
- question: When an unsupervised anomaly model scores new process-creation events on parent/child names,
    paths, integrity level, command-line length, and time-of-day, which creations are flagged as outliers,
    and what features drove each score?
  context: 'Rules and simple baselines miss novel parent/child combinations; an unsupervised Isolation
    Forest learns the multivariate shape of normal process creation and flags outliers without prior labeling.
    Train on features such as parent name, child name, parent path, child path, integrity level, command-line
    length, and time-of-day. For every alert, surface the top-3 SHAP-ranked contributing features in the
    alert text (e.g., parent=winword.exe, child=svchost.exe, anomalous child_path) so an analyst can triage
    without re-deriving the score. A high anomaly score with hollowing-consistent features warrants memory/lineage
    follow-up; a low score is reassuring but should be combined with the deterministic checks. In the
    context of the Stealth tactic, this question helps determine whether process hollowing is being used
    to blend malicious execution into a legitimate process and evade process-based defenses. Relevant
    references: [A hybrid CNN-GRU model with XAI-Driven interpretability using LIME and SHAP](https://peerj.com/articles/cs-3258/).
    Source method: Machine Learning.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model=IsolationForest(features=[parent_name,child_name,parent_path,child_path,integrity,cmdline_len,hour])

      score = model.decision_function(event)

      if score < threshold: alert(top3_shap=explain(event))'
- question: For whitelisted system binaries, is there an abnormally long gap (e.g., > 5 seconds) between
    process creation and the process's first image load, first network connection, or first child spawn,
    consistent with a CREATE_SUSPENDED hollowing window?
  context: 'Hollowing typically creates the victim process suspended (CREATE_SUSPENDED), then unmaps and
    rewrites its memory before ResumeThread. That manipulation introduces a measurable delay between creation
    and the first sign of real activity. For whitelisted binaries such as svchost.exe and dllhost.exe,
    set a static delta threshold (start at > 5 seconds and tune per environment) measured between Sysmon
    EID 1 creation and the first EID 7 image load / EID 3 network connection / child process. Exceedance
    is consistent with a process held suspended for unmap/rewrite. A positive result flags suspicious
    dormancy; legitimate slow-starting services must be baselined out. In the context of the Stealth tactic,
    this question helps determine whether process hollowing is being used to blend malicious execution
    into a legitimate process and evade process-based defenses. Relevant references: [A new approach for
    detecting process injection attacks using memory analysis](https://link.springer.com/article/10.1007/s10207-024-00836-w).
    Source method: Symbolic Logic.'
