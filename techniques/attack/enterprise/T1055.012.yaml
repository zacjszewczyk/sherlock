- question: When startup behavior is clustered on time-to-first-action, parent name, command-line entropy,
    and module-load count, do any process instances fall into a distinct 'suspended/hollowed' cluster,
    and what features define it?
  context: 'Density-based clustering (e.g., DBSCAN) can separate normal startups from a small anomalous
    group whose behavior matches suspended-then-resumed processes. Cluster on time-to-first-action, parent
    name, command-line entropy, and module-load count; alert on members of the suspended cluster and emit
    the cluster-defining features in the alert for triage. This is useful where the delay alone is ambiguous
    but combines with low module-load counts or unusual parents into a coherent hollowing signature. A
    positive result is membership in the suspicious cluster; validate against memory and lineage evidence.
    In the context of the Stealth tactic, this question helps determine whether process hollowing is being
    used to blend malicious execution into a legitimate process and evade process-based defenses. Relevant
    references: [Deep learning based Sequential model for malware analysis using Windows exe API Calls](https://peerj.com/articles/cs-285/).
    Source method: Machine Learning.'
