- question: Do per-host API/event sequences contain a low-probability ordering of [Create -> ProcessAccess(write)
    -> RemoteThread], even when benign calls are interleaved between the key operations?
  context: 'A learned sequence model (LSTM or HMM) trained on per-host API/event sequences can score how
    probable an observed ordering is and flag the unlikely injection pattern Create -> ProcessAccess(write)
    -> RemoteThread. Because real activity interleaves unrelated calls, use approximate sequence alignment
    (Smith-Waterman) so noise between the key calls does not defeat matching, and report the matched API
    sub-chain in the alert. A low-probability sequence containing the key sub-chain is strong evidence
    of injection; report the aligned calls so analysts can validate quickly. In the context of the Stealth
    tactic, this question helps determine whether process hollowing is being used to blend malicious execution
    into a legitimate process and evade process-based defenses. Relevant references: [A Novel Approach
    to Detect Malware Based on API Call Sequence Analysis](https://journals.sagepub.com/doi/full/10.1155/2015/659101),
    [Deep learning based Sequential model for malware analysis using Windows exe API Calls](https://peerj.com/articles/cs-285/).
    Source method: Machine Learning.'
