- question: Which processes contain private RWX (writable+executable) memory regions above their per-binary
    baseline, and do any executable code sections show Shannon entropy above 7.2, indicating packed or
    encrypted injected code?
  context: 'Injected/hollowed payloads frequently live in private executable+writable (RWX) memory and
    are packed or encrypted, raising entropy. Monitor the count/ratio of private RWX regions per process
    against the per-binary baseline and compute Shannon entropy of code sections; flag executable regions
    with entropy above 7.2 versus native code''s typical 5.0-6.5. A positive result is anomalous RWX presence
    and/or high-entropy executable memory; legitimate JIT engines (browsers, .NET) use RWX and must be
    baselined to control false positives. In the context of the Stealth tactic, this question helps determine
    whether process hollowing is being used to blend malicious execution into a legitimate process and
    evade process-based defenses. Relevant references: [Using Entropy Analysis to Find Encrypted and Packed
    Malware](https://ieeexplore.ieee.org/document/4140989). Source method: Statistical Method.'
