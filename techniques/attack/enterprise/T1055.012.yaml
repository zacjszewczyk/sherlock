- question: For each (SourceImage, TargetImage) pair, are memory-write or thread GrantedAccess codes appearing
    in fewer than 0.1% of that pair's history, and are there repeated failed OpenProcess/WriteProcessMemory
    attempts against protected processes?
  context: 'Most process-access events use innocuous rights; write/thread codes between a specific source
    and target are rare and meaningful. Profile GrantedAccess codes per (Source,Target) pair and flag
    write/thread codes that occur in under 0.1% of that pair''s history. Additionally track state by counting
    failed versus successful OpenProcess/WriteProcessMemory attempts: repeated failures against protected
    processes (e.g., PPL-protected lsass.exe) are a distinct signal of an actor probing for an injection
    target. A positive result is an anomalously rare high-power access code or a cluster of failed attempts;
    benign debuggers/AV must be allow-listed. In the context of the Stealth tactic, this question helps
    determine whether process hollowing is being used to blend malicious execution into a legitimate process
    and evade process-based defenses. Relevant references: [Process Injection (T1055) - Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/).
    Source method: Statistical Method.'
