    are anomalous in terms of their location (e.g., C:\Windows\Temp), size, count, or the process that
    created them, especially when preceded by broad file access from the same process. This Symbolic Logic
    approach works as follows: For files created by archiver processes, compute Shannon entropy on a content
    sample and confirm archive/encrypted output when entropy exceeds ~7.2 ([Using Entropy Analysis to
    Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989)), distinguishing
    real compressed/encrypted output from renamed decoys and flagging password-encrypted archives. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable malicious data staging;
    pivot to the responsible process and its parent lineage, the user and host context (especially NAI:
    File servers, document management systems (e.g., SharePoint servers), critical application servers,
    and user profile directories on workstations where large data sets reside or are commonly staged.),
    the files read and the archive(s) written, the archive's location/size/entropy, and any subsequent
    network transfer of the archive to internal staging or external destinations. A negative result helps
    rule out this particular staging vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, living-off-the-land, low-and-slow, or insider-driven
    archiving activity.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Windows Event ID 4656
  - Windows Event ID 4663
  - 'NAI: File servers, document management systems (e.g., SharePoint servers), critical application servers,
    and user profile directories on workstations where large data sets reside or are commonly staged.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      for file in archiver_created_files:
        sample = read_first_N_bytes(file); H = shannon_entropy(sample)
        if H > 7.2: confirm compressed/encrypted (flag password-encrypted)
        else: possible renamed decoy
      | alert high_entropy_archive
