- question: >-
    [Collection] Archive creation location guardrail: Can you determine whether creation of one or more
    archive files (e.g., .zip, .rar, .7z, .tar.gz, .cab) that are anomalous in terms of their location
    (e.g., C:\Windows\Temp), size, count, or the process that created them, especially when preceded by
    broad file access from the same process. -- specifically, using the 'Archive creation location guardrail'
    (Symbolic Logic) approach?
  context: >-
    Why this matters: Under the Collection tactic (TA0009), an adversary uses archiving utilities to compress
    and/or encrypt data they have collected so it is smaller, obfuscated, and easier to move out of the
    environment -- a key staging step that immediately precedes exfiltration. This evidence focuses on
    the condition that creation of one or more archive files (e.g., .zip, .rar, .7z, .tar.gz, .cab) that
    are anomalous in terms of their location (e.g., C:\Windows\Temp), size, count, or the process that
    created them, especially when preceded by broad file access from the same process. This Symbolic Logic
    approach works as follows: Alert on Sysmon Event ID 11 creations of .zip/.rar/.7z/.cab/.tar/.gz files
    in high-risk directories (C:\Windows\Temp, %APPDATA%, C:\Users\Public) when the creating process is
    not explorer.exe or a known backup tool, per [Red Canary LOLBins guidance](https://redcanary.com/blog/blog/lolbins-abuse/).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable malicious
    data staging; pivot to the responsible process and its parent lineage, the user and host context (especially
    NAI: File servers, document management systems (e.g., SharePoint servers), critical application servers,
    and user profile directories on workstations where large data sets reside or are commonly staged.),
    the files read and the archive(s) written, the archive's location/size/entropy, and any subsequent
    network transfer of the archive to internal staging or external destinations. A negative result helps
    rule out this particular staging vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, living-off-the-land, low-and-slow, or insider-driven
    archiving activity.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Windows Event ID 4656
  - Windows Event ID 4663
  - 'NAI: File servers, document management systems (e.g., SharePoint servers), critical application servers,
    and user profile directories on workstations where large data sets reside or are commonly staged.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      search Sysmon=11 where TargetFilename matches '\.(zip|rar|7z|cab|tar|gz)$'
        and TargetPath in (C:\\Windows\\Temp, %APPDATA%, C:\\Users\\Public)
        and Image not in (explorer.exe, known_backup_tools)
      | alert archive_in_highrisk_dir
- question: >-
    [Collection] High-entropy archive confirmation: Can you determine whether creation of one or more
    archive files (e.g., .zip, .rar, .7z, .tar.gz, .cab) that are anomalous in terms of their location
    (e.g., C:\Windows\Temp), size, count, or the process that created them, especially when preceded by
    broad file access from the same process. -- specifically, using the 'High-entropy archive confirmation'
    (Symbolic Logic) approach?
  context: >-
    Why this matters: Under the Collection tactic (TA0009), an adversary uses archiving utilities to compress
    and/or encrypt data they have collected so it is smaller, obfuscated, and easier to move out of the
    environment -- a key staging step that immediately precedes exfiltration. This evidence focuses on
