name: 'T1560.001: Archive via Utility'
id: 18fe7d97-6fb4-4814-aae8-d88a9fa6be0d
description: >-
  This playbook helps an analyst investigate whether an adversary has compressed and/or encrypted collected
  data with archiving utilities to stage it for exfiltration as part of the Collection tactic (T1560.001,
  Archive via Utility). Adversaries abuse built-in and third-party tools -- such as tar, gzip, bzip2,
  xz, zip on Linux/macOS; ditto and hdiutil on macOS; and 7-Zip, WinRAR, WinZip, makecab, diantz, xcopy,
  and certutil -encode on Windows -- to package, compress, password-protect, or Base64-encode sensitive
  files into archives (.zip, .rar, .7z, .tar.gz, .cab, .dmg) before transfer. The hunt spans endpoint
  process-execution telemetry (Windows Event ID 4688, Sysmon Event ID 1, auditd execve, macOS unified
  logs), file-creation and file-access telemetry (Sysmon Event ID 11, Windows Event ID 4663/4656, auditd
  FILE), and network egress telemetry (Zeek files.log, conn.log, ssl.log, dns.log). It guides the analyst
  across several investigative angles: matching archiver process hashes and command lines against threat
  intelligence and LOLBAS canonical strings; detecting legitimate archivers run with suspicious flags
  (password/encryption), target paths (sensitive user directories, temp/staging locations), or anomalous
  parents (Office apps, web servers, shells); identifying anomalous archive file creation by location,
  size, count, and entropy; spotting archive-bearing network transfers to rare or external destinations;
  and correlating end-to-end sequences of file discovery -> compression -> staging -> egress on a single
  host. Detection methods combine symbolic-logic rules, statistical baselining/prevalence/entropy analysis,
  and machine-learning models (Isolation Forest, One-Class SVM, supervised classifiers, HMM/LSTM sequence
  models, and provenance-graph analysis) so the analyst can corroborate suspected data staging across
  process lineage, file activity, content entropy, and downstream network movement.
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
