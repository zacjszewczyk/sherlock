questions:
- question: >-
    [Collection] CTI hash/command match for archiving utilities: Can you determine whether execution of
    an archiving utility process where the process executable's file hash or command-line arguments exactly
    match known malicious indicators from threat intelligence feeds. -- specifically, using the 'CTI hash/command
    match for archiving utilities' (Symbolic Logic) approach?
  context: >-
    Why this matters: Under the Collection tactic (TA0009), an adversary uses archiving utilities to compress
    and/or encrypt data they have collected so it is smaller, obfuscated, and easier to move out of the
    environment -- a key staging step that immediately precedes exfiltration. This evidence focuses on
    the condition that execution of an archiving utility process where the process executable's file hash
    or command-line arguments exactly match known malicious indicators from threat intelligence feeds.
    This Symbolic Logic approach works as follows: Ingest CTI feeds with malicious archiver hashes and
    command-line strings, query Windows Event ID 4688/Sysmon Event ID 1, and alert on exact matches to
    the IOC list. Extend with LOLBAS canonical strings for [certutil -encode](https://lolbas-project.github.io/lolbas/Binaries/Certutil/)
    and [diantz/makecab](https://lolbas-project.github.io/lolbas/Binaries/Diantz/) cab packaging. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable malicious data staging;
    pivot to the responsible process and its parent lineage, the user and host context (especially NAI:
    All enterprise endpoints and servers, particularly those hosting sensitive data or belonging to high-privilege
    users such as Domain Controllers, code repositories, and file servers.), the files read and the archive(s)
    written, the archive's location/size/entropy, and any subsequent network transfer of the archive to
    internal staging or external destinations. A negative result helps rule out this particular staging
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, living-off-the-land, low-and-slow, or insider-driven archiving activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints and servers, particularly those hosting sensitive data or belonging
    to high-privilege users such as Domain Controllers, code repositories, and file servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      ingest CTI(hashes, cmdline_strings) and LOLBAS canon(certutil -encode, diantz, makecab)
      search EventID=4688 OR Sysmon=1 where proc in archivers
        and (sha256 in CTI.hashes or CommandLine matches any CTI.cmdline_strings or LOLBAS canon)
      | alert exact_match
- question: >-
    [Collection] Rare hash prevalence detection: Can you determine whether execution of an archiving utility
    process where the process executable's file hash or command-line arguments exactly match known malicious
    indicators from threat intelligence feeds. -- specifically, using the 'Rare hash prevalence detection'
    (Statistical Method) approach?
  context: >-
    Why this matters: Under the Collection tactic (TA0009), an adversary uses archiving utilities to compress
    and/or encrypt data they have collected so it is smaller, obfuscated, and easier to move out of the
    environment -- a key staging step that immediately precedes exfiltration. This evidence focuses on
    the condition that execution of an archiving utility process where the process executable's file hash
    or command-line arguments exactly match known malicious indicators from threat intelligence feeds.
    This Statistical Method approach works as follows: Compute the enterprise prevalence of each process
    hash from Event ID 4688, flagging archiver executions whose hashes run on <1% of hosts as potential
    adversarial binaries, per fleet-wide prevalence heuristics ([What's the deal with prevalence?](https://blog.f-secure.com/whats-the-deal-with-prevalence/);
    [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)).
    Derive the <1% cutoff per environment from the observed host-count distribution. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable malicious data staging;
    pivot to the responsible process and its parent lineage, the user and host context (especially NAI:
    All enterprise endpoints and servers, particularly those hosting sensitive data or belonging to high-privilege
    users such as Domain Controllers, code repositories, and file servers.), the files read and the archive(s)
    written, the archive's location/size/entropy, and any subsequent network transfer of the archive to
    internal staging or external destinations. A negative result helps rule out this particular staging
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, living-off-the-land, low-and-slow, or insider-driven archiving activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints and servers, particularly those hosting sensitive data or belonging
    to high-privilege users such as Domain Controllers, code repositories, and file servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      from EventID=4688 where proc in archivers
      | stats dc(host) as host_count by sha256
      | eval pct = host_count / total_hosts
      | where pct < 0.01  // per-env cutoff from host-count distribution
      | alert rare_archiver_hash
- question: >-
    [Collection] Archiver execution classifier: Can you determine whether execution of an archiving utility
    process where the process executable's file hash or command-line arguments exactly match known malicious
    indicators from threat intelligence feeds. -- specifically, using the 'Archiver execution classifier'
    (Machine Learning) approach?
  context: >-
    Why this matters: Under the Collection tactic (TA0009), an adversary uses archiving utilities to compress
    and/or encrypt data they have collected so it is smaller, obfuscated, and easier to move out of the
    environment -- a key staging step that immediately precedes exfiltration. This evidence focuses on
    the condition that execution of an archiving utility process where the process executable's file hash
    or command-line arguments exactly match known malicious indicators from threat intelligence feeds.
    This Machine Learning approach works as follows: Train a supervised model (Random Forest/Gradient
    Boosting) using parent name, command-line length, argument count, hash prevalence, and signature metadata
    to predict malicious executions; surface the top-3 contributing features in the alert via SHAP/LIME
    ([Robust IoT security using isolation forest and one class SVM](https://www.nature.com/articles/s41598-025-20445-4))
    and notify on high-confidence results. A positive result -- a rule match, statistical outlier, or
    model alert -- indicates probable malicious data staging; pivot to the responsible process and its
    parent lineage, the user and host context (especially NAI: All enterprise endpoints and servers, particularly
    those hosting sensitive data or belonging to high-privilege users such as Domain Controllers, code
    repositories, and file servers.), the files read and the archive(s) written, the archive's location/size/entropy,
    and any subsequent network transfer of the archive to internal staging or external destinations. A
    negative result helps rule out this particular staging vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy, living-off-the-land, low-and-slow,
    or insider-driven archiving activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints and servers, particularly those hosting sensitive data or belonging
    to high-privilege users such as Domain Controllers, code repositories, and file servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features = [parent_name, cmdline_len, arg_count, hash_prevalence, signed, signer]
      model = RandomForest/GradientBoosting(label=malicious)
      score = model.predict_proba(features); explain = SHAP(top3)
      | where score > 0.9 | alert with top3_features
- question: >-
    [Collection] Archiver command signature rules: Can you determine whether execution of legitimate archiving
    utilities (built-in or third-party) with command-line parameters and process context indicative of
    malicious data staging, such as targeting sensitive user directories, using password protection, or
    being spawned by an anomalous parent process (e.g., a web server or Office application). -- specifically,
    using the 'Archiver command signature rules' (Symbolic Logic) approach?
  context: >-
    Why this matters: Under the Collection tactic (TA0009), an adversary uses archiving utilities to compress
    and/or encrypt data they have collected so it is smaller, obfuscated, and easier to move out of the
    environment -- a key staging step that immediately precedes exfiltration. This evidence focuses on
    the condition that execution of legitimate archiving utilities (built-in or third-party) with command-line
    parameters and process context indicative of malicious data staging, such as targeting sensitive user
    directories, using password protection, or being spawned by an anomalous parent process (e.g., a web
    server or Office application). This Symbolic Logic approach works as follows: Alert when archiving
    utilities (7z.exe/7za.exe/7zr.exe, rar.exe, tar.exe, makecab.exe, certutil.exe) run with paths in
    C:\Users/\Documents/Desktop, password/encryption flags (7z `-p`/`-hp`, `rar a -hp`, `tar -cz` piped
    to `openssl enc`), or unusual parents (winword.exe, outlook.exe, w3wp.exe, powershell.exe) as seen
    in Windows Event ID 4688/Sysmon 1, per the [Sigma 7-Zip password-compression rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_7zip_password_compression.yml)
    and [Red Canary LOLBins detection logic](https://redcanary.com/blog/blog/lolbins-abuse/). A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable malicious data staging;
    pivot to the responsible process and its parent lineage, the user and host context (especially NAI:
    User workstations, developer workstations, administrative jump boxes, and web servers where command-line
    tools are common but staging large archives, especially by automated processes, is not.), the files
    read and the archive(s) written, the archive's location/size/entropy, and any subsequent network transfer
    of the archive to internal staging or external destinations. A negative result helps rule out this
    particular staging vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, living-off-the-land, low-and-slow, or insider-driven archiving
    activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, developer workstations, administrative jump boxes, and web servers where
    command-line tools are common but staging large archives, especially by automated processes, is not.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      search EventID=4688 OR Sysmon=1 where proc in (7z.exe,7za.exe,7zr.exe,rar.exe,tar.exe,makecab.exe,certutil.exe)
        and (CommandLine matches '-p|-hp|-cz|enc' or TargetPath in (\\Users,\\Documents,\\Desktop)
             or ParentImage in (winword.exe,outlook.exe,w3wp.exe,powershell.exe))
      | alert suspicious_archive_staging
