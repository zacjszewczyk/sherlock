  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline parent_child(archiver) and cmdline_token_freq per utility
      | flag pairs/tokens below 1st percentile
      | timechart count(archiver_exec) per host per hour as freq by role
      | where freq > mean+3*stddev | alert
- question: >-
    [Collection] Process anomaly model: Can you determine whether execution of legitimate archiving utilities
    (built-in or third-party) with command-line parameters and process context indicative of malicious
    data staging, such as targeting sensitive user directories, using password protection, or being spawned
    by an anomalous parent process (e.g., a web server or Office application). -- specifically, using
