questions:
- question: Did any process execution on a Linux host run a binary whose SHA256 matches a known VDSO/ptrace
    injection tool or malware sample in threat intelligence?
  context: 'VDSO hijacking is frequently delivered by purpose-built injection tooling. By comparing the
    SHA256 of every executed binary (from auditd type=execve records) against a continuously updated threat-intelligence
    feed of hashes tied to VDSO/ptrace injection tooling, the analyst gets a deterministic, low-false-positive
    floor: any hash match is a high-confidence indicator that injection tooling ran on the host. This
    signature check must remain in place regardless of statistical or ML coverage. A positive match warrants
    immediate triage of the executing user, parent process, and host; a negative result only rules out
    KNOWN tooling and must be paired with the prevalence and classifier methods to catch novel binaries.
    In the context of the Stealth tactic, this matters because VDSO hijacking lets the adversary execute
    under the cover of a legitimate process and actively suppress or evade detection; confirming this
    evidence helps answer whether the adversary is concealing their actions while leaving security controls
    superficially intact. (Method as specified in the plan: Symbolic Logic approach.)'
  answer_sources:
  - auditd execve records
  - osquery (file_events)
  - EDR process creation logs
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), Linux
    developer workstations, Production container environments'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM auditd WHERE type=execve
      | eval sha256 = file_hash(exe)
      | lookup ti_injection_hashes sha256 OUTPUT tool_name, severity
      | WHERE tool_name IS NOT NULL
      | ALERT severity=high msg="Known VDSO/ptrace injection tool executed" host, user, exe, sha256, tool_name
- question: Is the executed binary rare or newly seen across the fleet (present on <1% of hosts or first
    observed within the last 24 hours), especially if it runs from /tmp, /dev/shm, a world-writable, or
    other non-standard path?
  context: 'Sophisticated and commodity actors alike drop novel binaries that have no legitimate footprint
    across the environment. For every newly observed executable hash, compute fleet prevalence (the percentage
    of hosts on which it has executed) and its first-seen age, then flag executions of hashes present
    on under 1% of hosts OR first seen within 24 hours, prioritizing binaries executing from /tmp, /dev/shm,
    world-writable, or otherwise non-standard paths. The percentile cutoff should be derived per environment
    from a rolling 30-day baseline. Rarity plus an unbacked execution path is a strong precursor signal
    for injection tooling; a positive result identifies a candidate dropper even when no hash signature
    exists. In the context of the Stealth tactic, this matters because VDSO hijacking lets the adversary
    execute under the cover of a legitimate process and actively suppress or evade detection; confirming
    this evidence helps answer whether the adversary is concealing their actions while leaving security
    controls superficially intact. (Method as specified in the plan: Statistical Method approach.)'
  answer_sources:
  - auditd execve records
  - osquery (file_events)
  - EDR process creation logs
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), Linux
    developer workstations, Production container environments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FROM auditd WHERE type=execve EARLIEST=-30d
      | stats dc(host) AS host_count, min(_time) AS first_seen BY sha256, exe
      | eval fleet_pct = host_count / total_hosts * 100, age_h = (now()-first_seen)/3600
      | WHERE fleet_pct < 1 OR age_h < 24
      | eval susp_path = match(exe, "^(/tmp|/dev/shm|/var/tmp)")
      | ALERT priority=if(susp_path,"high","med") host, user, exe, sha256, fleet_pct, age_h
- question: Does a machine-learning classifier score a newly executed ELF binary as likely injection tooling
    based on its metadata (entropy, imported symbols, ptrace/mmap imports, dynamic-linker references)?
  context: 'Beyond known hashes and rarity, a gradient-boosting classifier trained on ELF metadata (file
    size, string/section entropy, imported symbols, dynamic-linker references, and the presence of ptrace/mmap
    imports) using benign system binaries versus known injection tools can catch novel or repacked tooling.
    Score newly executed files in real time and require the alert to surface the top-3 contributing features
    (e.g., ''high .text entropy'', ''imports ptrace'', ''unbacked-path execution'') alongside the probability
    so the analyst can judge it quickly. This model runs in parallel with — never instead of — the hash
    and prevalence floors; a high-probability score on a binary that imports ptrace/mmap is a strong lead
    toward injection capability. In the context of the Stealth tactic, this matters because VDSO hijacking
    lets the adversary execute under the cover of a legitimate process and actively suppress or evade
    detection; confirming this evidence helps answer whether the adversary is concealing their actions
    while leaving security controls superficially intact. (Method as specified in the plan: Machine Learning
    approach.)'
  answer_sources:
  - auditd execve records
  - osquery (file_events)
  - EDR process creation logs
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), Linux
    developer workstations, Production container environments'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: |-
      features = extract_elf_meta(exe)  # size, section_entropy, imports, dynlinker_refs, has_ptrace, has_mmap
      score, top3 = gbm_injection_clf.predict_proba(features)
      if score >= THRESHOLD:
          alert(host, exe, sha256, prob=score, top_features=top3)  # run alongside hash+prevalence floors
- question: Did a lower-privileged process perform the full ptrace injection write chain — PTRACE_ATTACH,
    then read of /proc/[target]/maps, then ptrace POKETEXT/POKEDATA or mmap, with a subsequent mprotect
    adding PROT_EXEC — against a higher-privileged target within a 60-second window?
  context: 'This is the core injection behavior. A stateful rule should track a single source PID acting
    on a single target PID and fire when it observes: (1) ptrace(PTRACE_ATTACH), (2) openat on /proc/[target_pid]/maps,
    and (3) ptrace(PTRACE_POKETEXT/POKEDATA) or mmap — especially followed by an mprotect that adds PROT_EXEC,
    signalling a write-then-execute (W^X) transition. Fire only when the source UID differs from and is
    lower-privileged than the target UID, and maintain an allowlist of legitimate debuggers (gdb, strace,
    lldb, container runtimes). A positive result is high-confidence evidence of code injection and, because
    of the cross-privilege direction, of attempted privilege escalation; a clean window does not rule
    out hijacking performed entirely via vDSO-stub redirection rather than POKETEXT. In the context of
    the Stealth tactic, this matters because VDSO hijacking lets the adversary execute under the cover
    of a legitimate process and actively suppress or evade detection; confirming this evidence helps answer
    whether the adversary is concealing their actions while leaving security controls superficially intact.
    (Method as specified in the plan: Symbolic Logic approach.)'
  answer_sources:
  - auditd SYSCALL records
  - eBPF trace data
  - Falco logs
  - 'NAI: Critical Linux servers, Privileged user accounts, Core system daemons (e.g., sshd, cron, systemd)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM auditd WHERE syscall IN (ptrace, openat, mmap, mprotect)
      | WHERE src_uid != tgt_uid AND src_uid > tgt_uid AND src_comm NOT IN allowlist(gdb,strace,lldb,runc,containerd)
      | sequence BY src_pid, tgt_pid WITHIN 60s:
          ptrace(PTRACE_ATTACH) -> openat(/proc/<tgt_pid>/maps) -> (ptrace(POKETEXT|POKEDATA) OR mmap) -> mprotect(+PROT_EXEC)
      | ALERT severity=critical msg="Cross-privilege ptrace memory-write chain (W^X)" src_pid, tgt_pid, src_comm, tgt_comm
- question: For a given process, is the live sequence of syscalls statistically rare relative to its learned
    baseline — particularly a sequence containing ptrace/mmap/mprotect whose joint probability falls below
    the per-process 1st percentile?
  context: 'Legitimate daemons exhibit highly regular syscall patterns. Building STIDE n-gram or Markov
    transition baselines of syscalls per process name (e.g., nginx, java) lets you flag live sequences
    whose joint probability falls below the per-process 1st percentile, weighting sequences that contain
    ptrace/mmap/mprotect. Incorporate the syscall return-address / instruction pointer as context so identical
    syscalls issued from different code points are kept separable. Derive thresholds from a 14-30 day
    benign baseline. A flagged rare sequence in a server process that normally never calls ptrace is a
    strong anomaly pointing at injection activity; this complements the deterministic chain rule by catching
    variant orderings. In the context of the Stealth tactic, this matters because VDSO hijacking lets
    the adversary execute under the cover of a legitimate process and actively suppress or evade detection;
    confirming this evidence helps answer whether the adversary is concealing their actions while leaving
    security controls superficially intact. (Method as specified in the plan: Statistical Method approach.)'
  answer_sources:
  - auditd SYSCALL records
  - eBPF trace data
  - Falco logs
  - 'NAI: Critical Linux servers, Privileged user accounts, Core system daemons (e.g., sshd, cron, systemd)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      # baseline: per comm build STIDE n-grams / Markov transitions over 14-30d
      FROM auditd:SYSCALL
      | window ngram(syscall, n=6) BY comm, pid, ip_context
      | eval joint_p = markov_prob(ngram, baseline[comm])
      | eval w = if(ngram contains_any(ptrace,mmap,mprotect), 2.0, 1.0)
      | WHERE (joint_p * (1/w)) < pctl(baseline[comm], 1)
      | ALERT comm, pid, ngram, joint_p
- question: Does an LSTM next-event syscall model flag an out-of-distribution transition for a process
    — for example a server emitting ptrace -> mmap -> mprotect(PROT_EXEC) — outside its top-g predicted
    next events?
  context: 'An LSTM next-event predictor trained on benign per-process syscall key streams learns each
    process''s normal control flow and flags transitions that fall outside the top-g predictions, such
    as a network server suddenly emitting ptrace -> mmap -> mprotect(PROT_EXEC). Use online incremental
    updates to handle drift and emit the top-3 deviating syscalls/transitions in the alert for analyst
    context. This model layers on top of, not in place of, the deterministic chain rule, catching novel
    injection sequences that evade fixed signatures; a flagged transition concentrated on memory-manipulation
    syscalls is a high-value lead. In the context of the Stealth tactic, this matters because VDSO hijacking
    lets the adversary execute under the cover of a legitimate process and actively suppress or evade
    detection; confirming this evidence helps answer whether the adversary is concealing their actions
    while leaving security controls superficially intact. (Method as specified in the plan: Machine Learning
    approach.)'
  answer_sources:
  - auditd SYSCALL records
  - eBPF trace data
  - Falco logs
  - 'NAI: Critical Linux servers, Privileged user accounts, Core system daemons (e.g., sshd, cron, systemd)'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: |-
      stream = syscall_key_stream(pid, comm)
      pred_topg = lstm_nextevent[comm].predict(stream[-k:])
      if stream.next not in pred_topg:
          dev = rank_deviation(stream.next, pred_topg)
          alert(host, comm, pid, deviating=top3(dev))  # online-update model for drift; layer over chain rule
- question: Within 5 minutes of being targeted by a ptrace syscall, did the targeted process spawn a shell
    (/bin/sh, /bin/bash, /bin/dash) or open a sensitive file (/etc/shadow, /etc/sudoers, /root/.ssh/*)
    for writing — including FAILED/blocked opens (EACCES/EPERM)?
  context: 'Successful injection is usually followed by hands-on-keyboard or automated post-exploitation.
    A correlation rule should trigger when a process is the target of a ptrace call and, within 5 minutes,
    that same PID spawns a shell (/bin/sh, /bin/bash, /bin/dash) or opens a sensitive file (/etc/shadow,
    /etc/sudoers, /root/.ssh/*) for writing. Critically, also count and alert on FAILED or blocked opens
    (EACCES/EPERM) on those paths as a distinct privilege-probing signal — an injected payload often probes
    for access it does not yet have. A positive result tightly links the injection to concrete post-exploitation
    intent (credential theft, persistence, privilege escalation); failed-access bursts indicate an actor
    testing boundaries. In the context of the Stealth tactic, this matters because VDSO hijacking lets
    the adversary execute under the cover of a legitimate process and actively suppress or evade detection;
    confirming this evidence helps answer whether the adversary is concealing their actions while leaving
    security controls superficially intact. (Method as specified in the plan: Symbolic Logic approach.)'
  answer_sources:
  - auditd SYSCALL records
  - auditd execve records
  - osquery (file_events)
  - 'NAI: System configuration directories (e.g., /etc/, /root/), Authentication-related files (e.g.,
    /etc/shadow, /etc/sudoers), Privileged processes on critical servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM auditd
      | join target=ptrace.tgt_pid WITHIN 300s
      | WHERE (execve.exe IN (/bin/sh,/bin/bash,/bin/dash) AND execve.pid == ptrace.tgt_pid)
           OR (openat.path IN (/etc/shadow,/etc/sudoers,/root/.ssh/*) AND openat.flags has O_WRONLY|O_RDWR)
      | eval probe = openat.result IN (EACCES,EPERM)
      | ALERT severity=high label=if(probe,"priv-probe(failed)","post-ptrace-misuse") tgt_pid, action
- question: After a ptrace event targeted a high-privilege process, is any subsequent child process or
    file access statistically rare for that process (in the 99.9th rarity percentile of its historical
    behavior)?
  context: 'For each high-privilege process name, baseline its normal child-process names and file-access
    paths. After a ptrace event targets it, compute a rarity score for any subsequent child process or
    file access and flag activity in the 99.9th rarity percentile. Track volume (count of new file paths
    per minute) and state (success versus failed access) as separate features so a burst of probing is
    distinguishable from a single new access. Derive percentile cutoffs per process from historical data.
    A rare child (e.g., a database daemon spawning a shell) or a rare sensitive-path access immediately
    after a ptrace event is strong corroboration of post-injection misuse and possible privilege escalation.
    In the context of the Stealth tactic, this matters because VDSO hijacking lets the adversary execute
    under the cover of a legitimate process and actively suppress or evade detection; confirming this
    evidence helps answer whether the adversary is concealing their actions while leaving security controls
    superficially intact. (Method as specified in the plan: Statistical Method approach.)'
  answer_sources:
  - auditd SYSCALL records
  - auditd execve records
  - osquery (file_events)
  - 'NAI: System configuration directories (e.g., /etc/, /root/), Authentication-related files (e.g.,
    /etc/shadow, /etc/sudoers), Privileged processes on critical servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      # baseline per high-priv comm: child names + file paths
      FROM auditd WHERE _time BETWEEN ptrace.time AND ptrace.time+300s AND pid==ptrace.tgt_pid
      | eval rarity = 1 - hist_freq(child_comm|path, baseline[comm])
      | stats max(rarity) AS r, count(distinct path) AS newpaths_min, sum(result in (EACCES,EPERM)) AS failed BY comm, pid
      | WHERE r >= pctl99_9(baseline[comm])
      | ALERT comm, pid, r, newpaths_min, failed
- question: Does a per-process One-Class SVM / Isolation Forest behavioral model flag the targeted process
    as an outlier following a ptrace event, based on child names, file paths, user context, and memory-segment
    permissions?
  context: 'Per-critical-process behavioral profiles built with One-Class SVM or Isolation Forest over
    features such as child process names, file paths, user context, and memory-segment permissions can
    flag outliers that simple rules miss — especially when evaluated immediately after a ptrace event
    targeting the process. Use LIME/SHAP to surface the top-3 contributing features in the alert text
    so the analyst understands why the behavior is anomalous. A flagged outlier following injection (e.g.,
    unusual user context plus an executable+writable memory segment) is a strong, explainable indicator
    of compromise and potential privilege escalation. In the context of the Stealth tactic, this matters
    because VDSO hijacking lets the adversary execute under the cover of a legitimate process and actively
    suppress or evade detection; confirming this evidence helps answer whether the adversary is concealing
    their actions while leaving security controls superficially intact. (Method as specified in the plan:
    Machine Learning approach.)'
  answer_sources:
  - auditd SYSCALL records
  - auditd execve records
  - osquery (file_events)
  - 'NAI: System configuration directories (e.g., /etc/, /root/), Authentication-related files (e.g.,
    /etc/shadow, /etc/sudoers), Privileged processes on critical servers'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: "feat = profile(pid)  # child_names, file_paths, user_ctx, mem_perms\nif post_ptrace(pid):\
      \ \n  score = ocsvm_or_iforest[comm].decision(feat)\n  if score < THRESHOLD:\n      alert(host,\
      \ comm, pid, top_features=shap_top3(feat))"
- question: For syscalls issued by a monitored process, does the caller instruction pointer fall outside
    the mapped kernel/vDSO/libc ranges — i.e., into a file-unbacked/anonymous executable mapping — or
    does any region transition from PROT_WRITE to PROT_EXEC?
  context: 'This is the most direct signature of VDSO/syscall-stub hijacking. Attaching an eBPF probe
    to the raw syscall tracepoint (sys_enter) lets you inspect, for every syscall, the caller instruction
    pointer; if it falls outside the process''s mapped kernel/vDSO/libc ranges — that is, into a file-unbacked
    or anonymous executable mapping — raise an immediate high-priority alert. Also flag any memory region
    transition from PROT_WRITE to PROT_EXEC. Because legitimate syscalls are always issued from the vDSO
    or libc stubs, a syscall originating from anonymous executable memory is essentially definitive evidence
    that an adversary redirected syscall execution flow, the heart of this technique. In the context of
    the Stealth tactic, this matters because VDSO hijacking lets the adversary execute under the cover
    of a legitimate process and actively suppress or evade detection; confirming this evidence helps answer
    whether the adversary is concealing their actions while leaving security controls superficially intact.
    (Method as specified in the plan: Symbolic Logic approach.)'
  answer_sources:
  - eBPF trace data
  - Custom Kernel module logging
  - 'NAI: Kernel memory space on critical Linux hosts, vDSO memory region of running processes'
  range: Last 90 days
  queries:
  - technology: eBPF/pseudocode
    query: |-
      bpf attach tracepoint:raw_syscalls:sys_enter {
        ip = caller_ip();
        if (!in_ranges(ip, proc.maps.kernel, proc.maps.vdso, proc.maps.libc)
            && in_anon_exec_mapping(ip))
            emit_alert(pid, comm, syscall_nr, ip, "syscall from anonymous exec memory");
      }
      # also: on mprotect PROT_WRITE->PROT_EXEC transition -> emit_alert
- question: Has the entropy or distinct-count of syscall-handler instruction-pointer addresses for a critical
    process risen more than 3 standard deviations above its near-zero moving-average baseline within a
    1-minute window?
  context: 'For a healthy process, syscalls are issued from a tiny, fixed set of handler addresses, so
    the entropy/distinct-count of syscall-handler instruction-pointer addresses over 1-minute windows
    is near zero. Computing this per critical process and alerting when entropy rises more than 3 standard
    deviations above its moving average reveals syscalls being redirected to multiple new locations —
    the footprint of injected stubs. Derive the baseline window per process. A sustained entropy spike
    indicates the process''s syscall flow has been diversified by hooks; it complements the absolute IP-range
    check by catching gradual or multi-location redirection. In the context of the Stealth tactic, this
    matters because VDSO hijacking lets the adversary execute under the cover of a legitimate process
    and actively suppress or evade detection; confirming this evidence helps answer whether the adversary
    is concealing their actions while leaving security controls superficially intact. (Method as specified
    in the plan: Statistical Method approach.)'
  answer_sources:
  - eBPF trace data
  - Custom Kernel module logging
  - 'NAI: Kernel memory space on critical Linux hosts, vDSO memory region of running processes'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FROM ebpf:sys_enter
      | bin _time span=1m
      | stats dc(caller_ip) AS distinct_ip, entropy(caller_ip) AS h BY comm, pid, _time
      | eval z = (h - mov_avg(h, baseline[comm])) / mov_std(h, baseline[comm])
      | WHERE z > 3
      | ALERT comm, pid, h, distinct_ip, z
- question: Do any syscall-handler addresses for a process fall outside the dense clusters of legitimate
    kernel/vDSO/libc handlers (i.e., are labeled noise by DBSCAN), marking them as candidate user-space
    hooks?
  context: 'Clustering observed syscall-handler addresses per process name across the fleet (e.g., with
    DBSCAN) makes legitimate kernel/vDSO/libc handlers form dense clusters, while addresses labeled as
    noise become candidate user-space hooks. Surface the offending address and its nearest benign cluster
    in the alert so the analyst has immediate context for triage. An address flagged as noise — appearing
    on only one or a few hosts and far from the benign handler clusters — is a strong indicator of an
    injected syscall hook and warrants memory inspection of that process. In the context of the Stealth
    tactic, this matters because VDSO hijacking lets the adversary execute under the cover of a legitimate
    process and actively suppress or evade detection; confirming this evidence helps answer whether the
    adversary is concealing their actions while leaving security controls superficially intact. (Method
    as specified in the plan: Machine Learning approach.)'
  answer_sources:
  - eBPF trace data
  - Custom Kernel module logging
  - 'NAI: Kernel memory space on critical Linux hosts, vDSO memory region of running processes'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: |-
      addrs = collect(caller_ip by comm across fleet)
      labels = DBSCAN(eps, min_samples).fit(addrs)
      for a in addrs where labels[a]==NOISE:
          alert(comm, addr=a, nearest_benign_cluster=closest_cluster(a))
- question: Does a periodic YARA scan of security-agent processes (auditd, osqueryd, EDR) match vDSO-hook
    signatures, shellcode patterns, or pointers into anonymous user-space memory?
  context: 'Periodically scanning security-agent processes (auditd, osqueryd, EDR) with YARA rules targeting
    vDSO-hook signatures, shellcode patterns, and pointers into anonymous user-space memory provides a
    high-confidence detection of injected code residing inside the very tools meant to detect it. Generate
    a critical alert on any match. Because adversaries specifically target security agents to blind defenders,
    a YARA hit inside one of these processes is near-definitive evidence of injection and demands immediate
    host isolation and memory capture. In the context of the Stealth tactic, this matters because VDSO
    hijacking lets the adversary execute under the cover of a legitimate process and actively suppress
    or evade detection; confirming this evidence helps answer whether the adversary is concealing their
    actions while leaving security controls superficially intact. (Method as specified in the plan: Symbolic
    Logic approach.)'
  answer_sources:
  - Live memory dumps via osquery
  - YARA scan results
  - osquery memory_map
  - 'NAI: Memory space of security tools (EDR, auditd, AV) on critical Linux hosts and developer workstations'
  range: Last 90 days
  queries:
  - technology: YARA/osquery pseudocode
    query: |-
      for proc in (auditd, osqueryd, edr_agent):
        dump = osquery_read_proc_mem(proc.pid)
        hits = yara_scan(dump, rules=[vdso_hook, shellcode_patterns, anon_userspace_ptr])
        if hits: alert(severity=critical, proc, rule=hits)
- question: Has a process's count of executable file-unbacked (private, Path=NULL) memory segments risen
    more than 2 standard deviations above its per-process mean, or has any executable+writable (W^X) segment
    appeared where the baseline is zero?
  context: 'Injected code typically lives in anonymous (file-unbacked, Path=NULL) executable memory. Baseline
    each process''s count of executable file-unbacked private memory segments from osquery memory_map,
    then alert when the count rises more than 2 standard deviations above the per-process mean, or when
    any executable+writable (W^X) segment appears where the baseline is zero. Derive thresholds per process
    family. A new anonymous executable segment — and especially a W^X segment — in a process that normally
    has none is a strong, low-noise indicator of injected payload memory. In the context of the Stealth
    tactic, this matters because VDSO hijacking lets the adversary execute under the cover of a legitimate
    process and actively suppress or evade detection; confirming this evidence helps answer whether the
    adversary is concealing their actions while leaving security controls superficially intact. (Method
    as specified in the plan: Statistical Method approach.)'
  answer_sources:
  - Live memory dumps via osquery
  - YARA scan results
  - osquery memory_map
  - 'NAI: Memory space of security tools (EDR, auditd, AV) on critical Linux hosts and developer workstations'
  range: Last 90 days
  queries:
  - technology: osquery/Stats pseudocode
    query: |-
      FROM osquery.memory_map
      | eval anon_exec = (path IS NULL AND perms has 'x'), wx = (perms has 'w' AND perms has 'x')
      | stats sum(anon_exec) AS n_anon, sum(wx) AS n_wx BY comm, pid
      | eval z = (n_anon - mean(baseline[comm])) / std(baseline[comm])
      | WHERE z > 2 OR (n_wx > 0 AND baseline[comm].wx == 0)
      | ALERT comm, pid, n_anon, n_wx, z
- question: Does a memory-segment classifier (over entropy, size, permissions, file-backed vs anonymous,
    adjacency) score a segment in a critical/security process as injected code rather than benign library
    code?
  context: 'A classifier trained on memory-segment features — entropy, size, permissions, file-backed
