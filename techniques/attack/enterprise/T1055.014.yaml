name: 'T1055.014: Process Injection: VDSO Hijacking'
id: 5cec7943-4c1a-43eb-b0a3-b2696864dcf9
description: 'Investigate potential VDSO (virtual dynamic shared object) hijacking on Linux hosts, a process-injection
  subtechnique in which an adversary hijacks the syscall code stubs mapped into a process from the vDSO
  shared object and redirects execution (often via patched GOT entries) to load and run a malicious shared
  object inside a live, legitimate process. This playbook helps an analyst determine whether an adversary
  has used VDSO hijacking to execute arbitrary code in another process''s address space in order to evade
  process-based defenses and/or elevate privileges. It walks through complementary lines of inquiry: identifying
  execution of known or anomalous injection tooling; detecting the ptrace/mmap/mprotect memory-write chain
  a lower-privileged process uses against a higher-privileged target; spotting post-injection behavioral
  drift (suspicious child shells, sensitive-file access, anomalous outbound beaconing); inspecting syscall
  instruction pointers that resolve to anonymous, file-unbacked executable memory; scanning process memory
  for vDSO-hook/shellcode signatures; and catching tampering with security and logging daemons (including
  log-shipping collapse). Each line of inquiry is expressed as deterministic symbolic-logic floors backed
  by statistical-baseline and machine-learning detections so the investigation remains defensible even
  where ML coverage is incomplete.'
type: technique
