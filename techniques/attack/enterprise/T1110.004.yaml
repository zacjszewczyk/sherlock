    a high volume of failed authentication events across many distinct user accounts within a short time
    frame, with a low success-to-failure ratio and occasional successes that suggest reused breached credentials
    rather than a normal login pattern. Approach (''High-volume source rule'', Symbolic Logic): Alert
    when one source IP records >100 failed authentications (Volume) across >20 distinct accounts (Frequency)
    within 5 minutes in Windows 4625 and IdP logs, and raise severity on State transitions: any subsequent
    SUCCESS (4624) from the same source or any account-lockout (4740). Tune the distinct-account and failure
