    signal ([Detecting Password Spraying Attacks, Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html)).
    A positive result indicates an external (or insider) actor is exercising reused breached credentials
