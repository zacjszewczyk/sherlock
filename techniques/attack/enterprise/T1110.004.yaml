  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Azure AD Sign-In logs
  - Okta System Log
  - AWS CloudTrail logs
  - 'NAI: Externally-facing authentication services (VPN, OWA, M365), Internet Gateway/Firewall, Web Proxies,
    Cloud Identity Provider (e.g., Azure AD)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection: breached-credential + CTI watchlist match\nMATCH auth_events (WinEventLog\
      \ 4624/4625, AzureAD/Okta sign-ins) AS e\nLET cred_hash = k_anon_hash(e.username, e.password_or_ntlm)\n\
      LET near = mutate(cred_hash, [case_toggle, trailing_digit])  // catch lightly-tweaked replays\n\
      WHERE cred_hash IN breach_watchlist OR near IN breach_watchlist\n   OR e.src_ip IN cti_ips OR e.user_agent\
      \ IN cti_uas OR e.ja3 IN cti_ja3\nEMIT alert(severity=CRITICAL) WHEN e.result == SUCCESS       \
      \ // breach-known credential succeeded\nGROUP BY e.src_ip OVER 10m\nHAVING count(distinct e.username\
      \ WHERE breach_known) >= 5\nEMIT alert(severity=HIGH, reason='>=5 distinct breach-known accounts\
      \ in 10m')"
- question: 'Using a statistical method approach (''High breach-match ratio scoring''), can you determine
    whether this authentication activity reflects Credential Stuffing? Specifically: For each source IP
    compute the ratio of breach-known / CTI-matched attempts to total attempts (Volume) and the count
    of distinct breach-known accounts per minute (Frequency) over a rolling 1-hour window across on-prem
    and cloud auth logs, and flag ratios above the 99th percentile of the per-service 30-day baseline;
    profile the failure substatus mix as a distinct signal (a high share of failed logons against valid
    users with bad passwords, e.g. Windows 0xC000006A, indicates list replay rather than typos) ([Detecting
    stuffing of a user''s credentials at her own accounts, Wang and Reiter](https://dl.acm.org/doi/10.1145/3372297.3417895);
    [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)).'
