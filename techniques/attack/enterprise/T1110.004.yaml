  - technology: SIEM/Stats pseudocode
    query: "// Statistical: breach-match ratio + substatus profiling per source IP\nWINDOW rolling 1h\
      \ OVER on_prem + cloud auth logs\nFOR each src_ip:\n  ratio = count(breach_known OR cti_matched)\
      \ / count(total_attempts)\n  freq  = count(distinct breach_known accounts) / minutes\n  badpw_share\
