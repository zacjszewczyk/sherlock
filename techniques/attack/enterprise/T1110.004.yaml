- question: 'Using a machine learning approach (''Stuffing classification''), can you determine whether
    this authentication activity reflects Credential Stuffing? Specifically: Score each login with per-feature
    likelihood ratios under legitimate-vs-attacker hypotheses over source IP and IP reputation, ASN, geolocation,
    User-Agent/TLS (JA3) fingerprint, failure substatus codes, and success/failure ratio, alerting when
    the combined authenticity score crosses the tuned operating point and surfacing the top-3 contributing
    features (e.g., ''rare ASN, breach-known password, new device'') in the alert text; this resists attacker
    IP rotation better than blocklists alone ([Who Are You? A Statistical Approach to Measuring User Authenticity,
    Freeman et al](https://www.ndss-symposium.org/wp-content/uploads/2017/09/who-are-you-statistical-approach-measuring-user-authenticity.pdf)).'
