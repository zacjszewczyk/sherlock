- question: 'Using a symbolic logic approach (''High-volume source rule''), can you determine whether
    this authentication activity reflects Credential Stuffing? Specifically: Alert when one source IP
    records >100 failed authentications (Volume) across >20 distinct accounts (Frequency) within 5 minutes
    in Windows 4625 and IdP logs, and raise severity on State transitions: any subsequent SUCCESS (4624)
    from the same source or any account-lockout (4740). Tune the distinct-account and failure thresholds
    to the per-service standard deviation derived from a 14-30 day baseline, and treat the failure substatus
    mix (0xC0000064 unknown-user vs 0xC000006A bad-password) as a distinct enumeration-vs-stuffing signal
    ([Detecting Password Spraying Attacks, Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html)).'
