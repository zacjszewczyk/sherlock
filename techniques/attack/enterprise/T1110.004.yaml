questions:
- question: 'Using a symbolic logic approach (''Breached-credential and IOC watchlist match''), can you
    determine whether this authentication activity reflects Credential Stuffing? Specifically: Match each
    on-prem (Windows 4624/4625) and IdP (Azure AD/Okta) authentication attempt against (a) a privately-hashed/k-anonymity
    watchlist of known-breached username/password pairs and (b) CTI source IP, User-Agent, or JA3 indicators,
    alerting immediately on any SUCCESS using a breach-known credential and escalating when a single source
    attempts >=5 distinct breach-known accounts within 10 minutes; account for trivial credential mutations
    (case toggle, trailing digit) when building the near-match list so lightly-tweaked replays still hit.
    Base rate (~1.5% of live credentials are breach-known) and cross-site reuse (~43-51% of users) justify
    this as a high-yield deterministic signal ([Protecting accounts from credential stuffing with password
    breach alerting, Thomas et al](https://www.usenix.org/conference/usenixsecurity19/presentation/thomas);
    [The Tangled Web of Password Reuse, Das et al](https://www.ndss-symposium.org/wp-content/uploads/2017/09/06_1_1.pdf);
    [pASSWORD tYPOS and How to Correct Them Securely, Chatterjee et al](https://www.cs.cornell.edu/~rahul/papers/pwtypos.pdf)).'
  context: 'Tactic context (Credential Access): the adversary is attempting to gain credential access
    by replaying breach-dump username/password pairs against the organization''s authentication surfaces,
    betting on cross-site password reuse. Evidence under investigation: A successful or failed authentication
    event from an externally exposed authentication service or cloud identity provider is tied to a source
    IP address, user agent, or TLS fingerprint that matches a high-confidence credential-stuffing indicator
    of compromise, often across repeated attempts against multiple usernames on the same service. Approach
    (''Breached-credential and IOC watchlist match'', Symbolic Logic): Match each on-prem (Windows 4624/4625)
    and IdP (Azure AD/Okta) authentication attempt against (a) a privately-hashed/k-anonymity watchlist
    of known-breached username/password pairs and (b) CTI source IP, User-Agent, or JA3 indicators, alerting
    immediately on any SUCCESS using a breach-known credential and escalating when a single source attempts
    >=5 distinct breach-known accounts within 10 minutes; account for trivial credential mutations (case
    toggle, trailing digit) when building the near-match list so lightly-tweaked replays still hit. Base
    rate (~1.5% of live credentials are breach-known) and cross-site reuse (~43-51% of users) justify
    this as a high-yield deterministic signal ([Protecting accounts from credential stuffing with password
    breach alerting, Thomas et al](https://www.usenix.org/conference/usenixsecurity19/presentation/thomas);
    [The Tangled Web of Password Reuse, Das et al](https://www.ndss-symposium.org/wp-content/uploads/2017/09/06_1_1.pdf);
    [pASSWORD tYPOS and How to Correct Them Securely, Chatterjee et al](https://www.cs.cornell.edu/~rahul/papers/pwtypos.pdf)).
    A positive result indicates an external (or insider) actor is exercising reused breached credentials
    against your services — pivot immediately to any SUCCESS from the implicated source/account, check
    for follow-on access, MFA prompts, mailbox rules, or lateral movement, and consider forced password
    reset and source blocking. A negative result suggests the observed authentications fall within normal
    baselines for the service and accounts involved. Investigate the named area of interest (Externally-facing
    authentication services (VPN, OWA, M365), Internet Gateway/Firewall, Web Proxies, Cloud Identity Provider
    (e.g., Azure AD)) and correlate on-prem (Windows 4624/4625), cloud/IdP, and network/web logs.'
