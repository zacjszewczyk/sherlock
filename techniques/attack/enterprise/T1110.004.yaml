name: 'T1110.004: Credential Stuffing'
id: af28a3db-337c-45cf-8f08-41775e081ab8
description: 'This playbook helps an analyst determine whether an adversary is conducting Credential Stuffing
  (T1110.004): replaying username/password pairs harvested from breach dumps of unrelated services against
  the organization''s authentication surfaces, exploiting users'' tendency to reuse passwords across personal
  and business accounts. It correlates on-prem authentication telemetry (Windows Event ID 4624/4625 with
  failure substatus codes such as 0xC000006A bad-password and 0xC0000064 unknown-user), cloud and federated
  identity logs (Azure AD/Entra Sign-In logs, Okta System Log, Microsoft 365 Unified Audit Log, AWS CloudTrail),
  and network/web telemetry (Zeek conn/http/ssl logs, WAF and reverse-proxy access logs) to surface stuffing
  behavior across externally exposed services (VPN, OWA/M365, SSO) and management ports (SSH, RDP, SMB,
  LDAP). Investigative angles include: matching authentications against breached-credential and CTI watchlists
  (source IP, User-Agent, JA3/TLS fingerprint); high-volume failures from a single source spanning many
  distinct accounts with sparse successes; impossible-travel and concurrent-session anomalies for a single
  account; and web-automation artifacts (programmatic User-Agents, missing browser headers, near-zero
  inter-request jitter) followed by authentication failures. Detection blends symbolic-logic rules, statistical
  baselining (percentiles, Shannon entropy, CUSUM/change-point detection, Mahalanobis distance, breach-match
  ratio scoring), and machine learning (authenticity likelihood-ratio scoring, distributed source clustering,
  structural login anomaly models, LSTM autoencoders) to produce evasion-resistant, explainable alerts
  for the Credential Access tactic.'
type: technique
