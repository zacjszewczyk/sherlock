name: 'T1001.003: Protocol or Service Impersonation'
id: 2d1aa771-5d4a-47ba-863d-483d6f73db90
description: Investigate adversary attempts to disguise command-and-control (C2) traffic by impersonating
  legitimate protocols or trusted web services such as Gmail, Google Drive, or OCSP, and by faking SSL/TLS
  handshakes to blend in with normal encrypted traffic. This playbook helps an analyst hunt for outbound
  connections to known C2 infrastructure on threat intelligence feeds; TLS/HTTP artifacts that match known
  frameworks (JA3/JA3S/JA4 fingerprints, malicious User-Agents, default or short-validity certificates,
  Cobalt Strike Malleable C2 header and URI signatures); connections initiated by sensitive or non-networking
  processes and unusual parent-child chains; regular low-jitter beaconing; protocol mismatches such as
  non-TLS traffic on port 443 or SNI/Host header inconsistencies indicative of domain fronting; and atypical
  client-to-server byte ratios suggestive of tunneling or covert exfiltration. It combines deterministic
  signature matching, statistical baselining, and machine-learning anomaly detection across Zeek network
  logs, Windows/Sysmon endpoint telemetry, auditd, and host process metadata.
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any internal host complete a TCP/UDP connection to an external IP, domain, or ASN that
    appears on a high-confidence command-and-control threat intelligence feed or community JA3 blacklist?
  context: This is the fastest, most defensible signal that a host is talking to known-bad infrastructure
    used to impersonate legitimate services for C2. Correlate Zeek conn/http/dns destinations against
    curated high-confidence C2 feeds and JA3 blacklists, package the matches as portable SigmaHQ rules,
    and alert on any hit. Maintain an allow-list of sanctioned cloud/CDN endpoints so benign SaaS traffic
    that attackers mimic does not drown the signal. A positive match warrants immediate host isolation
    and triage; a negative result does not clear the host because impersonation C2 often uses fresh, unlisted
    infrastructure, so continue with the behavioral checks below.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Egress Firewalls, DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR each conn/http/dns event: MATCH dest_ip OR dest_domain OR dest_asn OR ja3 AGAINST c2_intel_feed,
      ja3_blacklist; SUPPRESS if dest IN sanctioned_cloud_cdn_allowlist; ALERT on match WITH src_host,
      dest, matched_indicator'
- question: Which external endpoints or ASNs are suddenly being contacted by an unusual number of internal
    hosts or represent newly seen, rare destinations in the top percentile of new fan-out?
  context: Impersonation C2 infrastructure often appears as a new destination that many compromised hosts
    begin contacting, or as a rare destination that almost nobody legitimately visits. Baseline the unique
    internal-host count and new-destination rate per external endpoint/ASN, then flag destinations above
    the 95th percentile of new fan-out or those scored as rare by a tool like RITA. A spike in fan-out
    can indicate a coordinated campaign or a shared C2 node; a single host reaching a rare destination
    can reveal targeted operator activity. Tie results back to Command and Control by pivoting to TLS
    and beaconing characteristics of the flagged destination.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Egress Firewalls, DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'AGGREGATE conn BY dest_endpoint, dest_asn OVER 90d: COMPUTE distinct_internal_hosts, new_dest_rate,
      first_seen; SCORE percentile(new_fan_out); FLAG where percentile > 95 OR dest is rare/new; OUTPUT
      dest, host_count, first_seen'
- question: Are internal hosts repeatedly generating failed or blocked connection attempts (conn_state
    S0/REJ/RSTO, DNS NXDOMAIN, proxy 403/407) toward flagged or newly registered infrastructure?
  context: Dead-drop and rotating C2 frequently produce a distinctive pattern of failed connections as
    malware cycles through stale or not-yet-live domains. Profile failed/blocked attempts using Zeek conn_state
    values (S0, REJ, RSTO), DNS NXDOMAIN responses, and proxy 403/407 codes directed at flagged or newly
    registered infrastructure, applying the rare-destination and certificate-validity logic found in RITA.
    A cluster of failures toward suspicious domains is a strong indicator of resilient C2 infrastructure
    even before a successful callback occurs; benign failures tend to target well-known, established domains
    and resolve quickly.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Egress Firewalls, DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: FILTER conn WHERE conn_state IN (S0,REJ,RSTO) OR dns.rcode=NXDOMAIN OR proxy.status IN (403,407);
      JOIN dest WITH newly_registered_or_flagged_list; GROUP BY src_host, dest; ALERT where failure_count
      high toward suspicious/new infra
- question: When connection metadata is scored by a trained classifier, which outbound connections are
    assigned a high probability of being malicious C2, and what features drive that score?
  context: A supervised model can fuse many weak signals into one ranked risk score that survives encryption.
    Train a Random Forest or Gradient Boosting model on Zeek connection features plus CTI enrichment and
    TLS metadata that remains observable under TLS 1.3, then flag high-probability malicious connections.
    Emit the top-3 contributing features (for example destination rarity, byte ratio, JA3 rarity) using
    SHAP attributions so analysts can validate the verdict rather than trust a black box. Use this to
    prioritize the queue; a high score with intuitive top features (rare destination + odd byte ratio
    + rare JA3) is a strong lead for protocol-impersonation C2.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Egress Firewalls, DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = extract(conn: duration, orig/resp_bytes, byte_ratio, dest_rarity, ja3_rarity, cti_tags,
      tls_meta); model = RandomForest/GBM(trained); score = model.predict_proba(features); ALERT where
      score>threshold; ATTACH top3 SHAP features to alert'
- question: Do any TLS sessions present JA3/JA3S or JA4/JA4S/JA4X fingerprints that match known C2 frameworks
    or that are non-browser fingerprints appearing on user-attributed HTTPS traffic?
  context: TLS client fingerprints reveal the actual stack negotiating the handshake regardless of the
    destination it claims to be. Match Zeek ssl.log JA3/JA3S and the more version-resilient JA4/JA4S/JA4X
    fingerprints against known-C2 fingerprint sets and your organization's browser baseline, then alert
    when a non-browser fingerprint appears on HTTPS that should be ordinary user browsing. C2 tooling
    such as Cobalt Strike often produces a stable, recognizable fingerprint; a user workstation generating
    a non-browser TLS fingerprint to an external host strongly suggests impersonated/agent C2.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek x509.log
  - 'NAI: Internet Gateway, Web Proxies, TLS-terminating Firewalls, Intrusion Detection/Prevention Systems
    (IDS/IPS)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FOR ssl.log: MATCH ja3,ja3s,ja4,ja4s,ja4x AGAINST c2_fingerprint_set; ALSO FLAG fingerprint
      NOT IN org_browser_baseline AND user_attributed_https=true; ALERT with src_host, server_name, fingerprint'
- question: Are there HTTP requests whose User-Agent, URI pattern, or header ordering match documented
    Cobalt Strike Malleable C2 profiles or JA4H fingerprints, including fixed headers impersonating Gmail,
    Drive, or OCSP?
  context: Malleable C2 profiles let operators craft HTTP traffic that mimics trusted services, but the
    templates leave repeatable artifacts. Match User-Agent strings, URI patterns, and HTTP header ordering
    against documented Malleable C2 signatures and JA4H HTTP fingerprints, and flag mismatched or fixed
    headers that impersonate Gmail/Drive/OCSP. Real Google/OCSP traffic has consistent, well-known header
    structure; a request claiming to be those services but with anomalous ordering, a hardcoded UA, or
    a telltale URI is a high-fidelity impersonation indicator tied directly to Command and Control.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek x509.log
  - 'NAI: Internet Gateway, Web Proxies, TLS-terminating Firewalls, Intrusion Detection/Prevention Systems
    (IDS/IPS)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FOR http.log: MATCH user_agent, uri, header_order AGAINST malleable_c2_signatures, ja4h_set;
      FLAG where claims gmail/drive/ocsp BUT header_order/ua/uri mismatch baseline; ALERT with src_host,
      host, uri, ua'
- question: Do any observed X.509 certificates match default or self-signed C2 certificate signatures,
    or exhibit empty subjects, short validity (<30 days), or known-default issuer/subject/serial fields?
  context: Many C2 frameworks ship default certificates or generate self-signed ones with characteristic
    fields. Match Zeek x509.log issuer/subject/serial values against default and self-signed C2 certificate
    signatures (e.g., Cobalt Strike YARA/signature-base) and alert on empty-subject, short-validity (<30
    day), or known-default certificates. A certificate that fakes TLS to look trusted but carries a default
    Cobalt Strike serial or an empty subject is strong evidence of protocol impersonation; legitimate
    services use CA-signed certificates with complete fields and standard validity periods.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek x509.log
  - 'NAI: Internet Gateway, Web Proxies, TLS-terminating Firewalls, Intrusion Detection/Prevention Systems
    (IDS/IPS)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FOR x509.log: MATCH issuer,subject,serial AGAINST default_c2_cert_signatures; FLAG where subject
      EMPTY OR validity_days<30 OR serial IN known_defaults; ALERT with src_host, dest, cert_fields'
- question: Which TLS certificates show anomalously low entropy or short validity duration, and which
    JA3 fingerprints are rare on a per-process cardinality basis rather than as single-hash novelty?
  context: Rarity scoring catches impersonation without a prior signature, but naive single-hash JA3 novelty
    produces false positives because modern browsers randomize TLS extensions. Baseline certificate entropy
    and validity duration and flag values in the lowest 5th percentile or under 30 days; measure JA3 rarity
    as per-process fingerprint cardinality (how many distinct fingerprints a process produces) rather
    than treating any new hash as suspicious. This distinguishes a process that legitimately randomizes
    extensions from a C2 implant emitting one stable, rare fingerprint to a low-entropy certificate.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek x509.log
  - 'NAI: Internet Gateway, Web Proxies, TLS-terminating Firewalls, Intrusion Detection/Prevention Systems
    (IDS/IPS)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: BASELINE cert_entropy, validity_days per population; FLAG cert in lowest 5th percentile OR
      validity<30d; COMPUTE per_process_ja3_cardinality; FLAG rare stable fingerprint per process; OUTPUT
      host, process, cert, ja3
- question: When HTTP/TLS sessions are clustered by handshake and content features, which small, distant
    clusters represent automated impersonation traffic that does not group with normal browsing?
  context: Unsupervised clustering exposes families of similar flows; legitimate browsing forms large
    dense clusters while bespoke C2 forms small, isolated ones. Cluster http/ssl features such as User-Agent
    entropy, path depth, JA3/JA4, TLS record sizes, and handshake timing, and investigate small, distant
    clusters. Retain features shown to survive TLS 1.3/ECH and corroborate with self-supervised encrypted-flow
    anomaly scores. A tight outlier cluster of HTTPS sessions sharing odd timing and record sizes but
    claiming to be a major web service is a strong lead for impersonated C2.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek x509.log
  - 'NAI: Internet Gateway, Web Proxies, TLS-terminating Firewalls, Intrusion Detection/Prevention Systems
    (IDS/IPS)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: features = [ua_entropy, path_depth, ja3/ja4, record_sizes, handshake_timing]; clusters = cluster(features);
      FLAG small distant clusters; corroborate with ssl_self_supervised_anomaly_score; INVESTIGATE flagged
      sessions
- question: Did a sensitive system process (e.g., lsass.exe, winlogon.exe) or a non-browser binary initiate
    an outbound TLS/HTTPS connection to an external destination?
  context: Certain processes should essentially never make outbound internet connections; when they do,
    it often means code injection or a masquerading implant. Join Windows Event ID 4688 (process creation)
    with 5156 (Windows Filtering Platform connection) or Sysmon Event ID 3 (network connection) and alert
    when sensitive processes or non-browser binaries open outbound TLS/HTTPS, deploying the logic as portable
    SigmaHQ process-network rules. An lsass.exe HTTPS connection to the internet is a near-certain compromise
    indicator for Command and Control; normal browsing originates from browser binaries.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Domain Controllers, Critical Application Servers, User Workstations, Endpoints of privileged
    users (e.g., developers, system administrators)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: JOIN evt4688 WITH evt5156/sysmon3 ON pid,host; FILTER process IN (lsass.exe,winlogon.exe,...)
      OR process NOT IN browser_allowlist; AND direction=outbound AND dest_port IN (443,...); ALERT with
      host, process, parent, dest
- question: Which parent-child-port process tuples are rare across the fleet, particularly chains involving
    scripting engines or LOLBins such as WINWORD.EXE -> powershell.exe -> :443?
  context: Document or Office applications spawning script interpreters that then reach the internet is
    a classic execution-to-C2 chain. Score parent-child-port tuples across the whole fleet and flag rare
    combinations involving scripting engines or LOLBins using prevalence-based rarity. A tuple like WINWORD.EXE
    -> powershell.exe -> :443 that occurs on only one or two hosts is far more suspicious than a common,
    well-understood chain, and points to impersonated/agent C2 launched from a phishing payload.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Domain Controllers, Critical Application Servers, User Workstations, Endpoints of privileged
    users (e.g., developers, system administrators)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: BUILD tuple=(parent_image,child_image,dest_port) FROM evt4688+5156/sysmon3; COMPUTE fleet_prevalence(tuple);
      FLAG rare tuples WHERE child IN scripting/LOLBin AND dest_port external; OUTPUT host, tuple, count
- question: When process-network behavior is scored by an Isolation Forest, which processes are flagged
    as anomalous based on destination rarity, byte ratio, beacon cadence, and JA3 rarity?
  context: Unsupervised anomaly detection catches novel implant behavior that no signature covers. Train
    an Isolation Forest on process-network features (destination rarity, byte ratio, beacon cadence, JA3
    rarity) and alert on anomalies, choosing Isolation Forest for low-latency unsupervised scoring; surface
    the top-3 contributing features per alert via SHAP so analysts can validate. A process whose network
    behavior is an outlier on multiple axes simultaneously is a strong candidate for protocol-impersonation
    C2 even when each individual feature looks borderline.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Domain Controllers, Critical Application Servers, User Workstations, Endpoints of privileged
    users (e.g., developers, system administrators)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: features = per_process(dest_rarity, byte_ratio, beacon_cadence, ja3_rarity); model = IsolationForest(trained);
      score = model.decision_function(features); ALERT on anomalies; ATTACH top3 SHAP features (host,
      process, dest)
- question: Are there series of connections from a single internal host to a single external destination
    with nearly constant intervals and uniform durations indicative of automated beaconing?
  context: Non-interactive C2 agents check in on a schedule, producing a regular heartbeat unlike human-driven
    traffic. Alert on connections to a single destination that exhibit nearly constant intervals and uniform
    durations, using the connection-regularity and long-connection logic implemented in RITA. Consistent
    timing and duration over many connections, especially to a rare or impersonated destination, is one
    of the strongest behavioral indicators of C2 beaconing; human browsing is bursty and irregular.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway, Network Taps/Sensors, Core network switch SPAN/TAP ports, Firewall Logs'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: GROUP conn BY (src_host,dest) OVER 90d; COMPUTE interval_deltas, duration_stats; FLAG where
      intervals near-constant AND durations uniform AND connection_count high; ALERT with src_host, dest,
      period
- question: For each source-destination pair, is the dispersion of connection time deltas abnormally low
    (low coefficient of variation/MAD/Bowley skewness) with a C2-like mean interval, even when decoy jitter
    is present?
  context: Operators add random jitter to evade naive periodicity checks, so robust statistics are needed.
    Baseline time deltas per source-destination and flag low dispersion using the coefficient of variation,
    median absolute deviation, or Bowley skewness below a threshold, combined with a C2-like mean interval.
    These robust measures, as used by RITA and BAYWATCH, remain sensitive to underlying regularity despite
    added jitter. A pair with low dispersion and a plausible beacon interval to a suspicious destination
    is a high-confidence beaconing signal for Command and Control.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway, Network Taps/Sensors, Core network switch SPAN/TAP ports, Firewall Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each (src,dest): deltas = sorted_connection_intervals; COMPUTE cv, MAD, bowley_skew, mean;
      FLAG where dispersion < threshold AND mean in c2_like_range; OUTPUT src, dest, stats'
- question: When an FFT is applied to per-host/destination connection time series, which pairs show strong
    periodic frequency peaks despite jitter, indicating a hidden beacon?
  context: Frequency-domain analysis can reveal periodicity that time-domain dispersion measures miss
    when jitter is heavy. Apply an FFT to per-(host,destination) connection time series and alert on strong
    periodic peaks, following the multi-stage FFT periodicity pipeline of BAYWATCH, and corroborate with
    self-supervised encrypted-flow timing models. A dominant spectral peak corresponding to a regular
    check-in frequency, surviving added jitter, is compelling evidence of automated C2 beaconing even
    when the raw intervals look noisy.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway, Network Taps/Sensors, Core network switch SPAN/TAP ports, Firewall Logs'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ts = connection_count_per_bin(src,dest); spectrum = FFT(ts); FLAG where dominant_peak_power
      > threshold (strong periodicity); corroborate with encrypted_flow_timing_model; ALERT with src,
      dest, period
- question: Are there connections on port 443 that have no corresponding Zeek ssl.log entry, or weird.log
    protocol violations, indicating a faked TLS handshake or a non-TLS tunnel on a well-known port?
  context: Adversaries tunnel arbitrary data over well-known ports to look legitimate while skipping real
    protocol negotiation. Join Zeek conn and ssl logs and flag connections on port 443 that lack a corresponding
    ssl entry, and surface weird.log protocol violations. Genuine HTTPS on 443 produces a matching ssl
    record; traffic on 443 with no TLS handshake, or with protocol anomalies, indicates a faked handshake
    or a non-TLS covert channel impersonating HTTPS for C2.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek weird.log
  - 'NAI: Internet Gateway, Internal Network Segments via Zeek sensors, DMZ, Network Security Monitoring
    (NSM) sensor locations'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: LEFT JOIN conn TO ssl ON uid WHERE conn.resp_p=443; FLAG conn WITH no matching ssl; UNION weird.log
      protocol_violations on well-known ports; ALERT with src_host, dest, port, note
- question: Where TLS is inspected, does the TLS SNI or outer front domain fail to match the inner HTTP
    Host header, or do rare inner hosts hide behind a common high-reputation CDN front?
  context: Domain fronting hides the true destination by presenting a benign SNI/front domain while the
    inner Host header routes to the real C2. Where TLS is inspected, alert when the SNI/outer front domain
    does not match the inner HTTP Host header, or when a rare inner host hides behind a popular high-reputation
    CDN front, the canonical domain-fronting signal. A mismatch between outer and inner names, or a rare
    host behind a major CDN, is strong evidence of evasive Command and Control masquerading as trusted
    cloud traffic.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek weird.log
  - 'NAI: Internet Gateway, Internal Network Segments via Zeek sensors, DMZ, Network Security Monitoring
    (NSM) sensor locations'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FOR inspected_tls: COMPARE ssl.server_name (SNI/front) WITH http.host (inner); FLAG where
      mismatch OR inner_host rare BEHIND high_reputation_cdn_front; ALERT with src_host, sni, inner_host'
- question: Which hosts show TLS validation or handshake error/failure rates exceeding three standard
    deviations above their own role baseline?
  context: A burst of failed or invalid TLS handshakes can indicate misconfigured impersonation tooling
    or repeated attempts to establish a faked TLS channel. Baseline ssl validation and handshake error/failure
    rates per host (treating failed/blocked handshakes as a distinct state signal) and alert when rates
    exceed 3σ above the host/role baseline. Legitimate clients rarely produce sustained TLS errors; a
    host whose handshake-error rate spikes well above its peers warrants investigation for protocol-impersonation
    C2.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek weird.log
  - 'NAI: Internet Gateway, Internal Network Segments via Zeek sensors, DMZ, Network Security Monitoring
    (NSM) sensor locations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'AGGREGATE ssl BY host: COMPUTE handshake_error_rate, validation_failure_rate; BASELINE per
      role; ALERT where rate > mean + 3*stddev(role_baseline); OUTPUT host, rate, baseline'
- question: When a one-class model is trained on TLS handshake features, which handshakes are flagged
    as outliers based on cipher/extension structure, record sizes, and timing?
  context: Faked or non-standard TLS stacks negotiate handshakes that differ subtly from mainstream clients.
    Train a one-class SVM or Isolation Forest on TLS handshake features (cipher suite/extension structure,
    record sizes, timing) and flag outliers; for TLS 1.3/ECH, use metadata features shown to remain discriminative.
    A handshake that is an outlier in cipher/extension ordering and timing, especially toward a suspicious
    destination, suggests an impersonating or custom TLS implementation used for C2 rather than a standard
    browser or library.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek weird.log
  - 'NAI: Internet Gateway, Internal Network Segments via Zeek sensors, DMZ, Network Security Monitoring
    (NSM) sensor locations'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: features = [cipher_struct, extension_struct, record_sizes, timing]; model = OneClassSVM/IsolationForest(trained
      on normal); FLAG outliers; (TLS1.3/ECH -> use metadata features); ALERT with host, dest, features
- question: Are there DNS queries larger than 255 bytes, GET requests sending or returning bodies over
    1MB, or client-to-server byte ratios impossible for the claimed protocol on that port?
  context: Covert channels abuse protocols to move data in directions the protocol does not normally support.
    Alert on DNS queries over 255 bytes, GET requests with bodies exceeding 1MB, and client-to-server
    byte ratios that are impossible for the claimed protocol on a given port. Oversized DNS or a GET that
    uploads large data violates protocol expectations and signals tunneling or exfiltration masquerading
    as ordinary traffic; legitimate DNS and GET requests stay within normal size envelopes.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: FLAG dns WHERE query_length>255; FLAG http WHERE method=GET AND (req_body>1MB OR resp_body>1MB);
      FLAG conn WHERE orig/resp byte_ratio impossible for protocol on resp_p; ALERT with src_host, dest,
      metric
- question: Which connections fall in extreme percentiles of orig/(orig+resp) byte ratio or bytes-per-second
    for the port in use, separating tunnels from genuine application traffic?
  context: Tunneled C2 and exfiltration distort the natural data-flow balance of a protocol. Baseline
    orig/(orig+resp) byte ratios and bytes/sec per port and flag values in extreme percentiles, using
    time-and-volume flow features shown to separate tunnels from genuine application traffic. A connection
    on a port whose byte ratio is wildly atypical, for example a large sustained upload over a port that
    normally downloads, is a strong indicator of covert C2 or data theft impersonating that protocol.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR conn BY resp_p: COMPUTE orig_ratio=orig_bytes/(orig_bytes+resp_bytes), bytes_per_sec;
      BASELINE per port; FLAG values in extreme percentiles; OUTPUT src_host, dest, port, ratio'
- question: When connections are clustered on log byte volumes, duration, and packet-rate, which noise/outlier
    points fall outside dense normal clusters as candidate tunnels?
  context: Density-based clustering isolates flows that do not resemble any common traffic pattern. Cluster
    log(orig_bytes), log(resp_bytes), duration, and packet-rate features and flag noise/outlier points;
    alternatively use a self-supervised encrypted-flow model or a session-graph GNN where impersonated
    flows are exposed by communication topology. A flow that is a density outlier in volume/duration space,
    or that stands out in the session graph, is a candidate covert channel impersonating a legitimate
    protocol for Command and Control.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [log(orig_bytes), log(resp_bytes), duration, packet_rate]; clusters = DBSCAN(features);
      FLAG noise/outlier points; ALT: encrypted_flow_self_supervised OR session_graph_GNN; INVESTIGATE
      flagged flows'
