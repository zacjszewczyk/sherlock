name: 'T1591.002: Business Relationships'
id: 959f53e5-1391-4fc8-9a0a-6bfdd8435151
description: 'This playbook helps an analyst investigate adversary reconnaissance against the organization''s
  business relationships (T1591.002) - the gathering of information about second/third-party partners,
  managed service providers, contractors, suppliers, and the trusted network connections and supply chains
  that link them. It guides the hunt across network and endpoint telemetry: outbound connections or DNS
  queries matching threat-intelligence on recon/supply-chain infrastructure and partner-lookalike (typosquat/homoglyph)
  domains; anomalous scraping of public-facing partner/client/vendor listing pages; unauthorized probing
  of partner-only services such as extranets, partner VPNs, and B2B API gateways; misuse of trusted partner-range
  connections that reach beyond their permitted scope or move anomalous data; and abnormal user access
  to partner-related repositories (contracts, contact lists, API keys). Each question pairs symbolic-logic
  rules, statistical baselining, and machine-learning detectors so an analyst can confirm or refute reconnaissance
  on business relationships.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any internal hosts making outbound connections or DNS queries to IPs or domains that match
    threat-intelligence on reconnaissance infrastructure, malicious proxies, or supply-chain attacker
    domains?
  context: 'Adversaries researching our business relationships frequently reuse infrastructure that is
    already catalogued in threat-intelligence feeds (scanners, anonymizers/proxies, and domains tied to
    supply-chain campaigns). Correlate Zeek conn.log and dns.log by the shared `uid` so a flagged destination
    IP can be tied back to the domain that resolved it, then intersect destinations against TI feeds.
    Encode the feed-match and partner-lookalike rules as Sigma, and cluster many lookalike domains sharing
    the same hosting (FluxBuster-style) into a single campaign rather than alerting on each separately.
    A match is a strong lead for Reconnaissance against business relationships; absence lowers but does
    not eliminate suspicion because much recon is off-network. References: [SigmaHQ](https://github.com/SigmaHQ/sigma);
    [FluxBuster](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet gateway/egress points, DNS resolvers, Network Security Monitoring (NSM) sensor grid'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  join conn.log, dns.log on uid\n  | where conn.id.resp_h in TI.recon_ips OR dns.query\
      \ in TI.supplychain_domains\n  | cluster by shared_hosting_ip (lookalike domains -> one campaign)\n\
      \  | emit alert(matched_indicator, uid, src=id.orig_h)"
  - technology: SIEM/Sigma pseudocode
    query: ">-\n  selection: dest_ip in threatintel.recon OR dns_query in threatintel.partner_lookalike\n\
      \  condition: selection\n  -> alert with TI source + campaign cluster id"
- question: Among resolved external domains, are any close lexical or homoglyph variants of our legitimate
    partner brand domains (typosquats) hosted on anomalous ASNs or newly registered?
  context: 'Typosquatting and IDN/homoglyph lookalikes of partner brands let an adversary impersonate
    trusted relationships or stage supply-chain phishing. For each non-allowlisted resolved domain, compute
    the minimum Levenshtein/edit distance to a curated list of legitimate partner domains and flag distances
    of 1-2 (plus homoglyph/IDN variants) that have no exact match. Prioritize when the resolved ASN diverges
    from the partner''s known ASN, the domain age is under 30 days, or NXDOMAIN/SERVFAIL precedes a successful
    resolution. Use lexical/host features (edit distance, n-gram entropy, numeric-char ratio, TTL, ASN)
    and prevalence/dynamism features. A hit suggests reconnaissance/impersonation infrastructure targeting
    our business relationships. References: [Malicious URL Detection survey](https://arxiv.org/abs/1701.07179);
    [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet gateway/egress points, DNS resolvers, Network Security Monitoring (NSM) sensor grid'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for domain in dns.query where domain not in allowlist:\n    d = min(edit_distance(domain,\
      \ p) for p in partner_domains)\n    if d in (1,2) or is_homoglyph(domain):\n      if resolved_asn\
      \ != partner_asn or domain_age_days < 30 or preceded_by_nxdomain:\n        alert(domain, d, resolved_asn,\
      \ domain_age_days)"
- question: Can a trained classifier flag malicious or recon-related domains resolved by our environment
    using DNS lexical and enrichment features?
  context: 'Rule and distance thresholds miss novel domains, so train a supervised classifier (Random
    Forest / Gradient Boosting / J48) on DNS features (length, n-gram entropy, label count) plus enrichment
    (domain age, WHOIS privacy, ASN reputation, resolved-IP fan-out). Emit the top-3 contributing features
    (e.g., edit-distance-to-partner, age, ASN) in alert text so analysts can triage, and tune the decision
    threshold to your resolver''s base rate to control false positives. High-confidence outputs indicate
    domains likely tied to reconnaissance of our business relationships and warrant correlation with the
    TI and typosquat checks above. References: [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf);
    [Malicious URL Detection survey](https://arxiv.org/abs/1701.07179).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet gateway/egress points, DNS resolvers, Network Security Monitoring (NSM) sensor grid'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [len, ngram_entropy, label_count, domain_age, whois_privacy, asn_rep, ip_fanout,\
      \ edit_dist_partner]\n  model = RandomForest.load('dns_malicious.pkl')\n  score = model.predict_proba(features)\n\
      \  if score > tuned_threshold: alert(domain, top3_features(model))"
- question: Is any external source IP scraping our public-facing partner, client, or vendor listing pages
    using recognizable automated-tool signatures?
  context: 'To enumerate our business relationships cheaply, adversaries scrape public pages that list
    partners, clients, or supply-chain details. Alert on Zeek dns.log AXFR/ANY queries and match http.log
    User-Agent and request signatures against known scraping tools (Scrapy, HTTrack, wget, curl, python-requests,
    Go-http-client, headless-Chrome markers) using Sigma. Also flag absent or forged UA strings and robots.txt-ignoring
    crawl patterns concentrated on partner/clients/vendor pages. A positive result indicates active reconnaissance
    harvesting of relationship data; benign crawlers (search engines) should be allowlisted to reduce
    noise. References: [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Public-facing web servers, DMZ network segments, Reverse proxy servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  dns.log: alert qtype in (AXFR, ANY)\n  http.log: where user_agent matches scraping_tools\
      \ OR user_agent empty/forged\n    and uri startswith ('/partners','/clients','/vendors','/suppliers')\n\
      \  | flag robots_txt ignored\n  -> alert(src=id.orig_h, ua, uri)"
  - technology: SIEM/Sigma pseudocode
    query: ">-\n  selection: http.user_agent in scrapers AND http.uri in partner_pages\n  condition: selection\
      \ -> alert(src_ip)"
- question: Does any source IP exceed historical request-rate, path-fanout, or error-ratio baselines for
    our partner-listing pages, consistent with scraping?
  context: Scrapers walk many URLs quickly and hit non-existent paths. Per source IP, compute request
    rate (req/min) and unique-path count per path-prefix in 5-minute windows and flag sources above the
    99th percentile of the historical distribution. Add the failure dimension (ratio of 404/403 responses)
    since scrapers walk many missing paths, and use Shannon entropy of requested paths to separate broad
    enumeration from repetitive polling. Derive percentile cutoffs per site from 30-day history. Sources
    breaching multiple dimensions are likely automated reconnaissance against our published business relationships.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Public-facing web servers, DMZ network segments, Reverse proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  window 5m by src_ip:\n    rate = count/5m; paths = distinct(uri_prefix)\n    err_ratio\
      \ = count(status in 404,403)/count\n    path_entropy = shannon(uri)\n  flag if rate > p99(history)\
      \ and (err_ratio high or path_entropy high)"
- question: Do request volumes or unique-visitor counts to partner-listing pages exceed seasonal forecast
    intervals, indicating anomalous scraping?
  context: 'Legitimate traffic to partner pages follows daily/weekly seasonality. Forecast request volume
    and unique-visitor counts with STL/ETS/SARIMA prediction intervals and alert when observed volume
    exceeds the upper interval. Corroborate with an online autoencoder (Kitsune) over per-IP flow statistics
    and surface the top-3 deviating features (rate, path-fanout, 404-ratio) in the alert. A breach of
    the forecast band that coincides with anomalous per-IP flows points to a reconnaissance scraping burst
    rather than organic interest in our business relationships. References: [Forecasting: Principles and
    Practice](https://otexts.com/fpp3/); [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089).'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Public-facing web servers, DMZ network segments, Reverse proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = SARIMA.fit(history_volume_partner_pages)\n  upper = model.forecast(interval=0.99).upper\n\
      \  if observed_volume > upper:\n    ae_score = kitsune.score(per_ip_flow_stats)\n    if ae_score\
      \ anomalous: alert(top3_features=[rate,path_fanout,err_ratio])"
- question: Are unauthorized external IPs (outside the partner allow-list) connecting to partner-only
    services such as extranets, partner VPNs, or B2B API gateways?
  context: 'Services reserved for business partners should only be reached by known partner/management
    source ranges. Alert when Zeek conn.log records connections to partner-only services (extranet, partner
    VPN, B2B API gateway) from source IPs outside the maintained partner allow-list, or when Zeek weird.log
    reports protocol anomalies on those destinations. Maintain accurate allow-lists of partner/management
    source ranges. Connections from off-list IPs to these B2B endpoints are a hallmark of an adversary
    probing trusted-relationship infrastructure during Reconnaissance. References: [CISA TA18-106A](https://www.cisa.gov/news-events/alerts/2018/04/16/russian-state-sponsored-cyber-actors-targeting-network-infrastructure).'
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: Partner extranet servers, VPN concentrators, B2B API gateways, DMZ firewalls'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log: where service in partner_only_services\n    and id.orig_h not in partner_allowlist\
      \ -> alert\n  weird.log: where id.resp_h in partner_only_assets -> alert(protocol_anomaly)"
- question: Is any unknown external IP exhibiting a statistically significant pattern of failed connection
    attempts to partner-only services, consistent with probing?
  context: 'Reconnaissance manifests as many failed connection states. Treat each unknown source IP''s
    first-contact attempts to partner services as Bernoulli trials and apply Wald''s Sequential Probability
    Ratio Test (Threshold Random Walk) on the failed (REJ, S0, RSTOS0) vs. successful outcome ratio to
    flag probing early with tunable error bounds. As a simpler floor, in 5-minute windows compute failed-state
    counts per unknown IP and flag a Z-score above 3.5 versus the unknown-IP historical mean. A flagged
    source is likely mapping which partner services exist and respond. References: [Threshold Random Walk
    SPRT, Jung et al.](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: Partner extranet servers, VPN concentrators, B2B API gateways, DMZ firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for unknown_ip first-contact to partner_services:\n    SPRT(outcome in {fail:REJ,S0,RSTOS0;\
      \ success}) with bounds(alpha,beta)\n    -> alert on 'probing' hypothesis\n  floor: window 5m ->\
      \ z = (fail_count - mean)/sd; if z > 3.5 alert"
- question: Do connections from unknown external IPs to partner services score as anomalous against a
    model of known-partner traffic?
  context: 'Train a one-class model (one-class SVM or Extended Isolation Forest) on known-partner traffic
    features (duration, orig/resp bytes, packets, source port, service) so legitimate partner behavior
    defines normal. Score unknown-IP connections and flag those judged anomalous, emitting the top-3 contributing
    features in the alert for triage. Because the model learns only from trusted partner sessions, anomalous-scoring
    unknown connections to partner-only services are strong candidates for reconnaissance against our
    business-relationship infrastructure. References: [Extended Isolation Forest, Hariri et al.](https://arxiv.org/abs/1811.02141).'
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: Partner extranet servers, VPN concentrators, B2B API gateways, DMZ firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = OneClassSVM.fit(known_partner_conn_features)\n  for c in conn.log where id.orig_h\
      \ not in partners:\n    if model.predict(c.features) == anomaly:\n      alert(c, top3_features)"
- question: Are connections from a trusted partner's IP range reaching internal hosts, services, or ports
    outside their explicitly permitted access scope?
  context: 'A compromised or abused trusted relationship lets traffic from a legitimate partner range
    overreach. Enforce SIEM/firewall rules that alert when partner-range source IPs reach destinations
    outside their permitted IP/port set (e.g., DC ports 389/445/88, RDP 3389, internal admin services),
    and encode partner-session reconnaissance signatures (net view, net use, csvde/ldifde, WMI) executed
    on reachable hosts. Such scope violations or recon commands originating from partner traffic indicate
    an adversary leveraging the trusted relationship to map the environment. References: [JPCERT/CC lateral-movement
    event logs](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Internal network segments, Data center core, Application servers, Internal firewall logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  selection: src_ip in partner_range AND (dest not in partner_allowed_scope\n    OR dest_port\
      \ in (389,445,88,3389,internal_admin))\n  recon: process in (net view, net use, csvde, ldifde, wmic)\
      \ on partner-reachable host\n  condition: selection OR recon -> alert"
- question: Is a partner's daily data-transfer volume or session-count a statistical outlier versus its
    historical baseline, or skewed toward many short/failed sessions?
  context: Baseline each partner's daily `orig_bytes+resp_bytes` and session-count distribution and flag
    values beyond Q3+1.5*IQR (or a robust modified Z-score above 3.5). Separately profile the connection
    success/failure state mix, since reconnaissance manifests as many short or failed sessions rather
    than bulk transfer. A sudden volume spike may indicate exfil-staging via the trusted relationship,
    while a surge of short/failed sessions indicates the partner channel is being used to probe internal
    hosts - both deviating from the normal partner relationship pattern.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Internal network segments, Data center core, Application servers, Internal firewall logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per partner per day:\n    bytes = sum(orig_bytes+resp_bytes); sessions = count\n   \
      \ flag bytes > Q3 + 1.5*IQR or modZ(bytes) > 3.5\n    state_mix = fraction(short/failed sessions);\
      \ flag if elevated"
- question: Does a partner node form new connection edges into internal clusters it does not normally
    communicate with?
  context: 'Model historical partner-to-host connectivity as a graph and run Louvain community detection
    to learn normal communities. Alert when a partner node forms new edges into normally-unrelated internal
    clusters, which signals lateral exploration beyond the established relationship. Corroborate flow-level
    novelty with Extended Isolation Forest and report the new destination community plus contributing
    edge features in the alert. New cross-community edges from a partner are a structural sign of reconnaissance
    abusing the trusted relationship. References: [Louvain community detection, Blondel et al.](https://arxiv.org/pdf/0803.0476);
    [Extended Isolation Forest, Hariri et al.](https://arxiv.org/abs/1811.02141).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Internal network segments, Data center core, Application servers, Internal firewall logs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  G = build_graph(partner-host conn history)\n  communities = louvain(G)\n  for new_edge(partner\
      \ -> internal_host):\n    if community(internal_host) not in partner.normal_communities:\n     \
      \ if eif.score(edge.flow_features) anomalous:\n        alert(partner, new_community, top_features)"
- question: Is any user account touching honeytoken partner files, or generating a burst of file accesses
    to partner repositories (contracts, vendor contact lists, API keys)?
  context: 'Insiders or compromised accounts harvesting business-relationship data will read partner repositories.
    Tag honeytoken/critical partner shares (contracts, vendor contact lists, API keys) and alert on any
    Windows Event ID 4663 access to honeytokens, or when a user generates more than 100 4663 accesses
    to partner repos within one hour. Also flag enumeration utilities launched by anomalous parent processes
    on these hosts. Any honeytoken touch is high-fidelity; a 4663 burst signals bulk collection of partnership
    data for reconnaissance/targeting. References: [CAR-2014-11-002, MITRE](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4624
  - 'NAI: File servers hosting partner data, SharePoint sites for vendor management, Active Directory
    domain controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  honeytoken: EventID=4663 AND ObjectName in honeytoken_files -> alert (high)\n  burst:\
      \ count(EventID=4663 where ObjectName in partner_repos) by user > 100 in 1h -> alert\n  enum: anomalous\
      \ parent spawns net/csvde/dir on partner-data host -> alert"
- question: Does a user's file-access count or data volume on partner repositories exceed their own or
    their peer group's statistical baseline, especially off-hours?
  context: 'Baseline each user''s 30-day mean/standard-deviation of daily file-access counts (Event ID
    4663) and data volume on partner repos, and flag when counts exceed 3-sigma or the 95th percentile
    of their peer group. Include off-hours access (correlate with 4624 logon times) and failed-access
    (4663 with a denied access mask) as distinct signals. A user diverging from both their own history
    and peer norms - particularly at unusual hours - is a strong indicator of reconnaissance/collection
    against business-relationship data. References: [CERT Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4624
  - 'NAI: File servers hosting partner data, SharePoint sites for vendor management, Active Directory
    domain controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per user: mean,sd = baseline_30d(count 4663 on partner_repos)\n  flag if today_count\
      \ > mean + 3*sd or > p95(peer_group)\n  enrich: off_hours via 4624 logon time; denied = 4663 access_mask\
      \ denied"
- question: Can UEBA detect multi-dimensional deviations in a user's access to partner files, logon context,
    and process behavior?
  context: 'Configure Microsoft Sentinel UEBA to learn per-user and peer-group baselines over file access
    (4663), logon times/locations (4624), and process context, triggering on multi-dimensional deviations
    - e.g., a partner-file spike outside working hours from a new host. Surface the top-3 contributing
    features so analysts can triage, and validate detector recall against the CERT Insider Threat Test
    Dataset. Multi-signal anomalies are harder to evade than single thresholds and pinpoint accounts conducting
    reconnaissance on business relationships, whether insiders or compromised credentials. References:
    [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    [CERT Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4624
  - 'NAI: File servers hosting partner data, SharePoint sites for vendor management, Active Directory
    domain controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  UEBA.baseline(per_user, peer_group) over [file_access(4663), logon(4624), process_context]\n\
      \  trigger if multi_dim_deviation (partner_file_spike + off_hours + new_host)\n  emit top3_contributing_features"
