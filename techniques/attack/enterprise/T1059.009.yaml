name: 'T1059.009: Cloud API'
id: 7dddb858-5e31-430b-8c7e-06505ec1b93d
description: >-
  Investigate adversary abuse of cloud APIs for command execution, resource control, and reconnaissance
  through CLIs (aws, az, gcloud), SDK-backed command lines, PowerShell modules, and browser-based cloud
  shells, as observed in host process telemetry and cloud control-plane audit logs. This playbook helps
  an analyst correlate host-side cloud CLI execution with cloud audit events; detect command lines and
  audited requests referencing deny-listed tenants, accounts, buckets, projects, or known-malicious endpoints;
  baseline rare or first-seen resource identifiers and destinations; surface recon-to-access-to-evasion
  attack chains, abnormal API-category transitions, and cross-service lateral movement; flag anomalous
  host execution context (non-admin users, unusual parents, staged binaries, off-hours use); identify
  bursty API volume and IAM-key/policy modification surges; reconstruct download-to-script-to-cloud-CLI
  staging sequences; and detect impossible-travel geo-velocity, bulk cloud-storage reads, and suspicious
  User-Agent/API-client signals indicative of API-driven exfiltration or compromised credentials. Methods
  span symbolic-logic correlation, robust statistical baselining (modified Z-scores, Markov transition
  models, inter-arrival timing, forecasting), and machine learning (command-line embeddings, provenance/graph
  anomaly detection).
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-02-18'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: >-
    Does a host-side cloud CLI execution (aws, az, gcloud) line up in time, identity, and egress IP with
    a cloud audit event whose request parameters reference a deny-listed account/tenant ID, bucket/project
    name, or known-malicious IP or domain?
  context: >-
    Cloud API abuse usually leaves a two-sided fingerprint: a process-creation event on the host where
    aws.exe/az.exe/gcloud.exe ran, and a matching control-plane audit entry. Correlating Windows Event
    ID 4688, Sysmon Event ID 1, or Linux auditd exec records with AWS CloudTrail, Azure Activity, or GCP
    Audit Logs by timestamp, user identity, and source/egress IP confirms the CLI actually executed a
    risky cloud action rather than merely appearing in shell history. For the Execution tactic this proves
    adversary-controlled code ran against the tenant. Baseline novel API-role combinations per AssumedRole
    identity (Splunk ESCU rule 2181ad1f) and alert when the audited request targets deny-listed resources.
    A positive result with matching deny-list parameters is a high-confidence execution finding; preserve
    the principal, request parameters, source IP, and originating command line.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - >-
    NAI: Developer workstations, administrator jump boxes, CI/CD servers, cloud control plane.
  range: Last 90 days, with host-to-cloud joins centered on the observed CLI execution.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      cli = process_events where image in ['aws','aws.exe','az','az.exe','gcloud','gcloud.exe'];

      audit = cloud_audit where principal=cli.user and source_ip=cli.egress_ip and ts near cli.ts(+/-5m);

      alert when audit.request_params match denylist(account_ids,tenant_ids,buckets,projects,ips,domains);

      output cli_command, principal, source_ip, provider, request_params, novel_api_role_flag.
- question: >-
    Do cloud CLI command lines that reference known-malicious resources (banned --profile/account ID,
    known exfil --bucket) have the same resource identifiers appearing in cloud audit logs within a 5-minute
    window from the same principal?
  context: >-
    Some abuse is visible directly in the command line through banned profiles, suspicious bucket names,
    or disallowed resource identifiers. Validating those strings against the corresponding cloud audit
    trail within a tight 5-minute window tells the analyst the difference between a copied example command
    and a real, executed cloud action by the same principal. This supports the Execution tactic by tying
    intent (the command) to effect (the audit event). Sigma rules detect specific malicious patterns such
    as the S3 Browser utility creating IAM users or access keys (a GUI-vil/p0-LUCR-1 TTP), and Sigma-over-Athena
    has out-detected GuardDuty across many attack tests. A match where the command-line resource equals
    the audited resource is strong execution evidence.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - >-
    NAI: Developer workstations, administrator jump boxes, CI/CD servers, cloud control plane.
  range: Last 90 days, with 5-minute command-to-audit validation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      cli = process_events where image in cloud_cli_list and command_line has_any denylist_resources;

      audit = cloud_audit where principal=cli.user and ts between cli.ts and cli.ts+5m;

      alert when audit.resource_id == cli.extracted_resource_id;

      output command_line, resource_id, provider_action, principal, source_ip.
- question: >-
    Is a user/host running cloud CLI tools referencing resource identifiers (account/subscription/project
    IDs, bucket names) or destination IPs/domains that fall below the 5th percentile of historical frequency,
    or that have never been seen before for that user-host pair?
  context: >-
    Cloud abuse often introduces new account IDs, subscriptions, bucket names, project IDs, or API endpoints
    into an otherwise stable workflow. Maintain a 30-day per-user-host baseline of referenced resource
    identifiers and destination IPs/domains (the latter from Zeek conn.log) and flag references below
    the 5th percentile or first-seen. Netflix's open-source CloudTrail Anomaly Detector implements a powerful
    variant: track every API action per principal over an N-day baseline and alert on any never-before-seen
    API call. For the Execution tactic this surfaces subtle programmatic misuse even when the cloud action
    itself looks administratively valid. A first-seen high-value resource reference warrants triage of
    the surrounding session.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - >-
    NAI: Developer workstations, administrator jump boxes, CI/CD servers, cloud control plane.
  range: Last 90 days, with rolling 30-day user-host baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      refs = extract_resource_ids_and_destinations(cli_processes, cloud_audit, zeek_conn);

      baseline = summarize refs by user,host over 30d;

      alert when current_ref unseen OR frequency <= percentile(user_host,5);

      output user, host, resource_id, destination, historical_frequency.
- question: >-
    Does an unsupervised command-line model rate this cloud CLI invocation as anomalous based on rare
    service/action pairs, high-entropy substrings, or unusual resource ARNs, with interpretable top contributing
    features?
  context: >-
    Unsupervised command-line modeling catches malicious or improvised cloud CLI use even when deny-lists
    do not match. Train a BERT-based embedding model on cloud CLI command lines via masked language modeling
    on unlabeled telemetry, reduce the 768-dimensional embeddings via PCA (~77 dims), then apply an ensemble
    of COPOD, Isolation Forest, PCA, and autoencoder detectors. CrowdStrike demonstrated this on 1.5M
    command lines with a 30,000-token WordPiece vocabulary without labeled data. For the Execution tactic
    this is a hypothesis generator for novel cloud CLI tradecraft. Alert output must include the top 3
    contributing features (rare service/action pair, high-entropy substring, unusual resource ARN) via
    SHAP or COPOD tail probabilities so analysts can act, not chase a bare score.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - >-
    NAI: Developer workstations, administrator jump boxes, CI/CD servers, cloud control plane.
  range: Last 90 days for feature extraction and anomaly scoring; retrain periodically.
  queries:
  - technology: ML/pseudocode
    query: >-
      emb = bert_embed(cli.command_line);

      emb_r = pca(emb, dims=77);

      score = ensemble_anomaly([copod, iforest, pca, autoencoder])(emb_r, context_features);

      explain = top3_contributors(score);

      alert when score >= threshold; output score, explain, command_line, principal, host.
- question: >-
    Is a principal referencing an unusually large number of distinct cloud resource identifiers within
    a single 15-minute session compared to its own historical median?
  context: >-
    Rapid expansion across many unique resources can signal scripted exploration or malicious automation
    against the tenant. Count distinct cloud resource identifiers (account IDs, subscription IDs, project
    IDs, bucket names) per principal over 15-minute windows and compare to the principal's historical
    median using modified Z-scores (Z = 0.6745 x (xi - median) / MAD) with a threshold of 3.5 rather than
    standard Z-scores, which are contaminated by legitimate batch operations. For the Execution tactic,
    a sudden fan-out of touched resources is consistent with automated enumeration or mass action. A modified
    Z-score above 3.5 flags the session for review of the specific identifiers touched.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - >-
    NAI: Developer workstations, administrator jump boxes, CI/CD servers, cloud control plane.
  range: Last 90 days, with 15-minute sessions and historical MAD baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      session_refs = count_distinct(resource_id) by principal,15m;

      mz = 0.6745*(session_refs - median(hist))/MAD(hist);

      alert when mz > 3.5; output principal, window, unique_resource_count, mz.
- question: >-
    Is a principal generating an abnormally high ratio of failed cloud API calls (AccessDenied, UnauthorizedAccess,
    ValidationException) during cloud CLI activity, with sufficient call volume to indicate credential
    testing or permission enumeration?
  context: >-
    Permission probing and credential testing frequently produce a surge of failures before success or
    abandonment. Track the failed-to-total API call ratio per principal over 10-minute windows and alert
    when the error rate exceeds 40% AND total calls exceed 20 in the window. Splunk's 'AWS IAM AccessDenied
    Discovery Events' operationalizes this for CloudTrail. For the Execution tactic, failed calls are
    first-class evidence: they often reveal adversary intent (what they tried and lacked permission for)
    more clearly than successful commands. Do not filter detection or training datasets to only successful
    calls. Retain the failed actions, source IP, and host-side CLI context for triage.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - >-
    NAI: Developer workstations, administrator jump boxes, CI/CD servers, cloud control plane.
  range: Last 90 days, with 10-minute error-rate windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      api = cloud_audit correlated to cloud_cli;

      error_rate = count(failed_calls)/count(total_calls) by principal,10m;

      alert when total_calls > 20 AND error_rate > 0.40;

      output principal, failed_actions, source_ip, command_line_context.
- question: >-
    Is a single principal executing a reconnaissance-to-access-to-evasion cloud API chain (e.g., IAM List*,
    then SecretsManager GetSecretValue, then CloudTrail StopLogging) within a 15-minute window?
  context: >-
    Ordered cloud attack chains are far more meaningful than any single API call. Build a SIEM correlation
    rule that maps each cloud audit event to a category (Recon, Access, Evasion) and fires when one principal
    moves through the ordered sequence within 15 minutes using services/actions from known abuse paths.
    Elastic Security provides TOML rules for chain elements (IAM changes, CloudTrail disabling), and Splunk's
    'Suspicious Cloud User Activities' story chains recon, access anomalies, privilege escalation, and
    exfiltration. For the Execution tactic this focuses analysts on multi-step adversary tradecraft rather
    than isolated administrative events. A matching ordered chain is high-confidence malicious activity.
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - >-
    NAI: Cloud provider control plane (e.g., AWS Management Console, Azure Portal), CI/CD pipeline runners,
    administrator workstations.
  range: Last 90 days, with 15-minute ordered-sequence windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      categorize cloud_audit into {Recon: List*/Describe*/Get*Policy, Access: GetSecretValue/GetObject/Export,
      Evasion: StopLogging/DeleteDetector/DeleteTrail};

      chains = ordered_sequence(principal, 15m, ['Recon','Access','Evasion']);

      alert when chains match known_abuse_paths; output principal, api_sequence, resources, timestamps.
- question: >-
    Is a principal performing high-risk access actions (GetSecretValue/GetObject/Export) within 10 minutes
    of first-time reconnaissance actions originating from a new source IP or user agent not previously
    associated with that principal?
  context: >-
    This pattern suggests freshly established or hijacked access pivoting from discovery into data or
    credential access. Build per-principal baselines of normal source IPs and user agents, then flag sessions
    where novel access context is followed within 10 minutes by high-risk reads. Microsoft Sentinel UEBA
    creates dynamic per-entity baselines and computes an Investigation Priority Score (0-10) with a 7-day
    learning period to detect exactly this novel identity-action combination. For the Execution tactic,
    novel identity context plus high-value access is much stronger evidence than either alone, indicating
    an attacker operating with stolen credentials or tokens.
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - >-
    NAI: Cloud provider control plane (e.g., AWS Management Console, Azure Portal), CI/CD pipeline runners,
    administrator workstations.
  range: Last 90 days, with 10-minute new-context correlation and 7-day entity learning.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      recon = cloud_audit where action in recon_actions;

      access = cloud_audit where action in high_risk_access_actions;

      alert when (recon.source_ip new_for_principal OR recon.user_agent new_for_principal) AND access
      follows within 10m;

      output principal, source_ip, user_agent, sequence, priority_score.
- question: >-
    Does the observed sequence of API-category transitions for a principal (List->Read, Read->Write, etc.)
    deviate beyond the 99th percentile of its 30-day variable-order Markov baseline within a 1-hour window?
  context: >-
    Transition modeling captures suspicious orderings that simple volume rules miss. For each principal,
    build a 30-day baseline of transition probabilities between API call categories using variable-order
    Markov chains, then flag 1-hour windows whose observed sequence likelihood falls beyond the 99th percentile.
    Cloudflare deployed variable-order Markov chains with Bayesian credible intervals in production for
    API sequence analysis, catching sequential abuse that volumetric methods miss; Wang et al. validated
    multi-order Markov frameworks on the DARPA dataset. For the Execution tactic this is most useful when
    individual calls are common but their ordering is operationally wrong for the user (e.g., abrupt transitions
    into write/delete or defensive-control actions).
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - >-
    NAI: Cloud provider control plane (e.g., AWS Management Console, Azure Portal), CI/CD pipeline runners,
    administrator workstations.
  range: Last 90 days, with 30-day sequence baselines and 1-hour scoring windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      seq = api_category_sequence by principal,1h;

      model = variable_order_markov(principal_baseline_30d);

      likelihood = model.score(seq);

      alert when likelihood <= percentile(principal,1); output principal, seq, likelihood, baseline_window.
- question: >-
    Does a sequence/graph model flag a cloud API session as rare or abusive even when the exact action
    path is not already codified in a rule, particularly when it includes rare transitions into defensive-control
    actions?
  context: >-
    Use a GNN-based model trained on cloud audit sessions structured as heterogeneous dynamic graphs capturing
    user-role-resource dependencies, with attention-based aggregation producing latent node embeddings
    and a decoder reconstructing expected access probability distributions; flag deviations beyond a learned
    threshold. This achieves <35ms inference latency and outperforms LSTM and GCN baselines against MITRE
    ATT&CK IAM vectors including credential theft and privilege escalation. Where graph infrastructure
    is unavailable, train an LSTM on per-principal API sequences and alert on high reconstruction error,
    especially rare transitions into defensive-control actions. For the Execution tactic this catches
    novel privilege/data-access paths that escape signatures. Surface the anomalous sequence, affected
    resources, and source IPs for validation.
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - >-
    NAI: Cloud provider control plane (e.g., AWS Management Console, Azure Portal), CI/CD pipeline runners,
    administrator workstations.
  range: Last 90 days for training and sequence scoring.
  queries:
  - technology: ML/pseudocode
    query: >-
      session_graph = build_user_role_resource_graph(cloud_audit);

      score = gnn_attention_autoencoder(session_graph)  # or lstm_recon_error per principal;

      alert when score >= anomaly_threshold; output principal, api_sequence, resources, source_ips, score.
- question: >-
    Is the inter-arrival time between reconnaissance and access actions for a principal abnormally short
    (below the 1st percentile), suggesting scripted or automated abuse rather than human-driven activity?
  context: >-
    API automation often reveals itself through unusually short or regular gaps between steps. Calculate
    the median inter-arrival time between reconnaissance and access actions per principal and alert when
    it falls below the 1st percentile. ACM TKDD research shows inter-arrival distributions reliably distinguish
    automated from human usage: bot traffic exhibits regular Weibull-distributed arrivals while human
    traffic is heavy-tailed, achieving >93% precision. For the Execution tactic, very short or tightly
    regular recon-to-access timing indicates scripts, cloud shell automation, or attacker tooling rather
    than interactive administration. Pair with the API sequence and source context to confirm.
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - >-
    NAI: Cloud provider control plane (e.g., AWS Management Console, Azure Portal), CI/CD pipeline runners,
    administrator workstations.
  range: Last 90 days, centered on ordered recon-to-access sessions.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      intervals = time_between(recon_actions, access_actions) by principal;

      alert when median(intervals) < percentile(principal,1) OR arrival_regularity ~ weibull;

      output principal, intervals, api_sequence, source_context.
- question: >-
    Does cross-service graph analysis indicate a principal is traversing cloud services (IAM, compute,
    storage, logging) in an anomalous early-stage lateral-movement path?
  context: >-
    Lateral movement in cloud environments often spans IAM, compute, storage, and logging rather than
    staying inside one service. Model cloud API audit logs as dynamic tripartite graphs of users, services,
    and activities, using GNN-generated time-framed embeddings with custom anomaly scoring to detect early-stage
    cross-service movement. CS-GAD demonstrated this for cloud user anomaly detection with relatively
    low false-positive rates. For the Execution tactic this detects attack chains that are individually
    low-volume but strategically important because they chain multiple services. Alert output must include
    the specific API call sequence, source IPs, timestamps, and affected resources to enable immediate
    analyst triage.
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - >-
    NAI: Cloud provider control plane (e.g., AWS Management Console, Azure Portal), CI/CD pipeline runners,
    administrator workstations.
  range: Last 90 days for graph construction and anomaly scoring.
  queries:
  - technology: ML/pseudocode
    query: >-
      graph = build_user_service_activity_tripartite_graph(cloud_audit);

      emb = gnn_time_framed_embeddings(graph);

      anomaly = cross_service_score(emb);

      alert when anomaly=true; output principal, traversed_services, api_sequence, source_ips, timestamps,
      affected_resources.
- question: >-
    Is a cloud CLI process running under a user without approved cloud-admin group membership, spawned
    from a parent process outside the allowlist, or launched from a non-standard install path?
  context: >-
    This question validates execution context rather than cloud-action content. Administrative cloud tooling
    launched by a non-admin user, from an unexpected parent (e.g., WINWORD.EXE), or from a non-standard
    directory is a common sign of compromise or staging. Trigger on matches from Windows Event ID 4688,
    Sysmon Event ID 1, or Linux auditd exec events where Image contains aws.exe/az.exe/gcloud.exe and
    ParentImage is not in an allowlist of approved shells/IDEs, the user is not in approved cloud-admin
    groups, or the path is non-standard. Recorded Future's Insikt Group published cloud-focused Sigma
    rules across AWS/Azure/GCP. For the Execution tactic this catches adversary code running cloud tooling
    outside sanctioned workflows. Preserve user group membership, parent process, binary path, and host.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - >-
    NAI: All corporate endpoints, application servers, developer workstations, Domain Controllers.
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      cli = process_events where image in ['aws.exe','az.exe','gcloud.exe'];

      alert when user not_in approved_cloud_admins OR parent_image not_in allowlisted_parents OR image_path
      not_in standard_install_dirs;

      output user, parent_image, image_path, host, command_line.
- question: >-
    Is a cloud CLI binary executing from a user-writable directory (C:\Users\Public\, %TEMP%, /tmp), or
    is the executable name mimicking legitimate tooling while being unsigned or in a non-standard path?
  context: >-
    Attackers may stage renamed or portable cloud CLIs in user-writable locations to avoid sanctioned
    tooling and signature checks. The investigative question is whether the binary path and signer context
    are consistent with an approved installation. Panther Labs' detection-as-code provides Python logic
    for validating expected execution contexts for cloud tools. For the Execution tactic, a cloud CLI
    running from C:\Users\Public, %TEMP%, or /tmp, or an unsigned binary masquerading as legitimate tooling,
    is a strong staging indicator. Record the full path, signature state, and command line, because a
    legitimate binary name alone is insufficient to trust the execution.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - >-
    NAI: All corporate endpoints, application servers, developer workstations, Domain Controllers.
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      alert from process_events where image_name in cloud_cli_names AND (image_path in user_writable_dirs
      OR signed=false OR path_nonstandard=true);

      output host, user, image_name, image_path, signer, command_line.
- question: >-
    Is this cloud CLI parent-child process pair or execution path new or below the 1st percentile of frequency
    for the host over the last 90 days?
  context: >-
    A cloud CLI may be normal on a developer laptop but highly unusual on a domain controller or office
    workstation. Build a 90-day frequency model of cloud CLI parent-child pairs and execution paths per
    host and flag first-seen or below-1st-percentile combinations. Elastic's ML job 'Unusual AWS Command
    for a User' operationalizes this via population-based rare-function analysis: a command not previously
    seen for a user context is flagged. For the Execution tactic this turns a generic execution event
    into a contextual question of whether the tool is appearing in a way that matches how the host is
    normally used. Output the host, current combination, and baseline frequency.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - >-
    NAI: All corporate endpoints, application servers, developer workstations, Domain Controllers.
  range: Last 90 days, with 90-day host baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      combos = summarize(parent_image, image_path, command_name) by host over 90d;

      alert when current_combo unseen=true OR frequency <= percentile(host,1);

      output host, user, current_combo, baseline_frequency.
- question: >-
    Does an execution-context anomaly model flag this cloud CLI run as an outlier based on user group,
    parent process, binary path, command-line length, and time-of-day, with interpretable top features?
  context: >-
    Context-only anomaly scoring is useful when a cloud command is syntactically valid but operationally
    wrong. Train an Isolation Forest or One-Class SVM on features such as user group membership, parent
    process, binary path, command-line length, and time-of-day, optionally combining categorical features
    with BERT embeddings of the full command line (768-dim, PCA-reduced) and COPOD/ensemble detection.
    CrowdStrike's BERT-embedding pipeline supports this. For the Execution tactic the goal is to explain
    whether the alert fired because of who launched the tool, where it lived, when it ran, or what it
    attempted. Alert output must print the top 3 contributing features (parent process, binary path, command-line
    tokens) rather than a raw score.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - >-
    NAI: All corporate endpoints, application servers, developer workstations, Domain Controllers.
  range: Last 90 days for scoring and periodic retraining.
  queries:
  - technology: ML/pseudocode
    query: >-
      features = [user_group, parent_process, image_path, command_length, time_of_day, bert_embedding_pca];

      score = iforest_or_ocsvm(features)  # or copod ensemble;

      explain = top3_contributors(features);

      alert when score >= threshold; output score, explain, host, user, command_line.
- question: >-
    Is a user running cloud CLI commands in a time-of-day / day-of-week window where they have fewer than
    two historical occurrences in the prior 60 days?
  context: >-
    Time-of-day anomalies matter when the tool and user are otherwise legitimate. Compare each user's
    cloud CLI use across time-of-day and day-of-week distributions and alert when an execution occurs
    in a window with fewer than two historical occurrences in the prior 60 days. Microsoft Sentinel UEBA
    detects unusual logon activity from CloudTrail with deviations across geolocation, device fingerprint,
    ISP, and access method, while Defender for Cloud Apps applies impossible-travel analysis over billions
    of daily activities with VPN filtering. For the Execution tactic, off-hours cloud CLI use can indicate
    compromised credentials, unattended scripts running from the wrong account, or suspicious cloud shell
    usage.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - >-
    NAI: All corporate endpoints, application servers, developer workstations, Domain Controllers.
  range: Last 90 days, with 60-day per-user timing baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      profile = cli_usage_by_user_hour_day(60d);

      alert when current_slot_count < 2 historical_occurrences;

      output user, host, timestamp, historical_slot_count, command_line.
- question: >-
    Has a host or principal exceeded a high-risk burst threshold (>50 CLI executions in 10 minutes or
    >500 cloud audit calls in 10 minutes) where the activity includes write/delete operations?
  context: >-
    Volume alone can expose aggressive automation, especially when the burst includes destructive or configuration-changing
    actions. Trigger when a host or principal exceeds the burst threshold and the activity includes write/delete
