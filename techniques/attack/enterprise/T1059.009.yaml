- question: >-
    Is cloud API usage for a principal showing geographically impossible travel (distant source IPs within
    insufficient travel time) combined with 10+ read/export API calls to high-sensitivity resources?
  context: >-
    Impossible-travel analysis identifies stolen tokens or sessions used from incompatible locations.
    For each principal, track API source IPs and timestamps in CloudTrail/audit logs, compute great-circle
    distance between consecutive sources, and estimate required travel time. Use a 5,000 km minimum-distance
    threshold to avoid VPN/CDN false alerts and GeoIP2/MaxMind databases at 95% accuracy. Microsoft Sentinel
    UEBA scores impossible travel at 8/10 with 14-day per-user baselines. Crucially, alert only when the
    impossible-travel pair is accompanied by 10+ read/export calls to high-sensitivity resources (GetSecretValue,
    GetObject from restricted buckets, Export). For the Execution tactic, this signals API-driven exfiltration
    or recon from compromised credentials. Output prior/current locations, velocity, and timestamps.
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - >-
    NAI: Cloud provider control plane (AWS Management Console, Azure Portal, GCP Console), network gateways
    with cloud traffic visibility.
  range: Last 90 days, with rolling 14-day per-principal location baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      locs = cloud_api_source_ips by principal ordered by time;

      velocity = great_circle_distance(consecutive)/time_delta;

      impossible = distance > 5000km AND velocity > feasible_travel;

      alert when impossible AND count(read_export_to_sensitive) >= 10;

      output principal, prior_location, current_location, velocity, sensitive_actions, timestamps.
- question: >-
