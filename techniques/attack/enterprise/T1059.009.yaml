    performs consecutive GetObject calls on many objects (>50 unique objects in <10 minutes) or invokes
    bulk export APIs. Cross-reference source IPs against cloud provider datacenter ranges; if the source
    is external (non-AWS/Azure/GCP IP), flag as potential remote exfiltration. Splunk's 'AWS S3 Unusual
    Data Access Patterns' flags anomalous read volumes and object-count surges. For the Execution tactic,
    the combination external source + impossible travel + bulk reads is a high-confidence exfiltration
    signal. Output the principal, listed/read objects, object count, source IP, and provider-range classification.
  answer_sources:
