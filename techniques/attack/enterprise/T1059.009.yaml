    density function with a 0.005 threshold bucketed by 4-hour windows accounting for weekday/weekend
    seasonality. Sysdig TRT documented a real-world intrusion achieving admin in under 10 minutes through
    rapid API sequences, which the volume constraint alone would have caught. For the Execution tactic,
    review the exact actions to distinguish maintenance bursts from rapid compromise-driven change.
