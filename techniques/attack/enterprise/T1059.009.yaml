name: "T1059.009: Cloud API"
id: "7dddb858-5e31-430b-8c7e-06505ec1b93d"
description: >
  Investigate cloud API execution through CLIs, SDK-backed command lines, browser-based
  cloud shells, and related audit activity. This playbook focuses on cloud CLI commands
  tied to malicious resources or disallowed tenants, suspicious host-to-audit
  correlations, recon-to-access attack chains, anomalous execution context, bursty API
  volume, staged download-to-script-to-CLI sequences, and cloud access patterns that
  suggest exfiltration, anonymized access, or geo-velocity anomalies.
type: "technique"
related:
  - tactic_id: "TA0002"
    tactic_name: "Execution"
contributors:
  - "Zachary Szewczyk"
created: "2026-02-18"
modified: "2026-02-18"
version: "1.0"
tags: "none"
questions:
  - question: >
      Does a host-side cloud CLI execution line up with a cloud audit event that targets
      a deny-listed tenant, account, bucket, project, or external endpoint?
    context: >
      Correlate host process creation for `aws`, `az`, or `gcloud` with cloud audit logs
      using timestamp, identity, and egress IP. The intent is to confirm that the CLI
      actually executed a risky cloud action rather than merely appearing on disk or in a
      shell history artifact. Analysts should preserve the principal, audit request
      parameters, source IP, and the originating command line so they can determine
      whether the tool was used with stolen credentials or an unapproved environment.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "Zeek conn.log"
      - "NAI: Developer workstations, administrator jump boxes, CI/CD servers, cloud control plane."
    range: "Last 90 days, with host-to-cloud joins centered on the observed CLI execution."
    queries:
      - technology: "SIEM correlation pseudocode"
        query: >
          cli = process_events where image in ['aws','aws.exe','az','az.exe','gcloud'];
          audit = cloud_audit where principal=cli.user and source_ip=cli.egress_ip and
          ts near cli.ts;
          alert when audit.request_params match denylist_resources; output cli_command,
          principal, source_ip, provider, request_params.

  - question: >
      Are cloud CLI command lines or their resulting audit events referencing known
      malicious resources within five minutes of execution?
    context: >
      Some abuse is visible directly in the command line through banned profiles,
      suspicious bucket names, or disallowed resource identifiers. Validate those strings
      against the corresponding cloud audit trail so analysts can tell the difference
      between a copied example command and a real cloud action. This is especially useful
      for exfiltration buckets, attacker-controlled accounts, and known hostile
      subscription or project IDs.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "Zeek conn.log"
      - "NAI: Developer workstations, administrator jump boxes, CI/CD servers, cloud control plane."
    range: "Last 90 days, with 5-minute command-to-audit validation."
    queries:
      - technology: "SIEM rule pseudocode"
        query: >
          cli = process_events where image in cloud_cli_list and command_line has denylist_resource;
          audit = cloud_audit where principal=cli.user and ts between cli.ts and cli.ts+5m;
          alert when audit.resource_id = cli.extracted_resource; output command_line,
          resource_id, provider_action, principal.

  - question: >
      Are users or hosts referencing cloud resources or destinations that are rare or
      first-seen for that principal-host pair?
    context: >
      Cloud abuse often introduces new account IDs, subscriptions, bucket names, project
      IDs, or API endpoints into an otherwise stable workflow. Maintain a 30-day baseline
      per user-host pair and score referenced resources and destinations for rarity,
      prioritizing values that have never appeared before. This helps surface subtle
      misuse even when the cloud action itself looks administratively valid.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "Zeek conn.log"
      - "NAI: Developer workstations, administrator jump boxes, CI/CD servers, cloud control plane."
    range: "Last 90 days, with 30-day user-host baselines."
    queries:
      - technology: "SIEM statistics pseudocode"
        query: >
          refs = extract_resource_ids_and_destinations(cli_processes, cloud_audit);
          baseline = summarize refs by user,host over 30d;
          alert when current_ref is unseen or frequency <= percentile(user_host,5);
          output user, host, resource_id, destination, historical_frequency.

  - question: >
      Does a command-line anomaly model rate this cloud CLI invocation as suspicious based
      on rare service-action pairs, high-entropy substrings, or unusual arguments?
    context: >
      Unsupervised command-line modeling can catch malicious or improvised cloud CLI use
      even when explicit deny-lists do not match. Score the full command line using
      embeddings and anomaly detectors, but always expose interpretable drivers such as
      rare service-action combinations or unusual resource token structure. The analyst
      should treat the model as an additional hypothesis generator, not a replacement for
      process-to-audit correlation.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "Zeek conn.log"
      - "NAI: Developer workstations, administrator jump boxes, CI/CD servers, cloud control plane."
    range: "Last 90 days for feature extraction and anomaly scoring."
    queries:
      - technology: "ML pipeline pseudocode"
        query: >
          emb = bert_embed(cli.command_line);
          score = ensemble_anomaly_model(emb, context_features);
          explain = top_contributors(score);
          alert when score >= threshold; output score, explain, command_line, principal.

  - question: >
      Is a principal touching an unusually large number of distinct cloud resources in a
      single session?
    context: >
      Rapid expansion across many unique resources can signal scripted exploration or
      malicious automation. Count unique account IDs, bucket names, subscription IDs,
      project IDs, and similar identifiers over 15-minute windows and compare the total
      to the principal's historical median and MAD-based threshold. This approach is
      robust to legitimate outliers that would otherwise distort simple standard
      deviation scoring.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "Zeek conn.log"
      - "NAI: Developer workstations, administrator jump boxes, CI/CD servers, cloud control plane."
    range: "Last 90 days, with 15-minute sessions and historical MAD baselines."
    queries:
      - technology: "SIEM baseline pseudocode"
        query: >
          session_refs = count_distinct(resource_id) by principal,15m;
          baseline = modified_zscore(session_refs historical);
          alert when modified_zscore > 3.5; output principal, window, unique_resource_count.

  - question: >
      Is a principal generating an abnormal ratio of failed cloud API calls during cloud
      CLI activity?
    context: >
      Permission probing and credential testing frequently produce a surge of
      `AccessDenied`, `UnauthorizedAccess`, and validation failures before success or
      abandonment. Track the failed-to-total API ratio per principal over 10-minute
      windows and retain both the cloud actions and host-side CLI context. Failed calls
      should be analyzed as first-class evidence because they often reveal adversary
      intent more clearly than successful commands.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "Zeek conn.log"
      - "NAI: Developer workstations, administrator jump boxes, CI/CD servers, cloud control plane."
    range: "Last 90 days, with 10-minute error-rate windows."
    queries:
      - technology: "SIEM statistics pseudocode"
        query: >
          api = cloud_audit correlated to cloud_cli;
          error_rate = failed_calls / total_calls by principal,10m;
          alert when total_calls > 20 and error_rate > 0.40; output principal,
          failed_actions, source_ip, command_line_context.

  - question: >
      Is one principal executing a reconnaissance-to-access-to-evasion cloud API chain
      within 15 minutes?
    context: >
      Ordered cloud attack chains are often more meaningful than any single API call.
      Map cloud actions into categories such as reconnaissance, access, and evasion, then
      identify sessions where the same principal quickly moves from inventorying the
      environment to pulling secrets or data and then tampering with logging or
      detection. This question helps analysts focus on multi-step abuse rather than
      isolated administrative events.
    answer_sources:
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "NAI: Cloud provider control plane (e.g., AWS Management Console, Azure Portal), CI/CD pipeline runners, administrator workstations."
    range: "Last 90 days, with 15-minute ordered-sequence windows."
    queries:
      - technology: "SIEM sequence pseudocode"
        query: >
          categorize cloud_audit into Recon, Access, Evasion;
          chains = ordered_sequence(principal,15m,['Recon','Access','Evasion']);
          alert when chains match known_abuse_paths; output principal, api_sequence,
          resources, timestamps.

  - question: >
      Is a principal performing high-risk access actions immediately after first-time
      reconnaissance from a new source IP or user agent?
    context: >
      This pattern suggests freshly established or hijacked access that pivots from
      discovery into data or credential access. Build per-principal baselines of normal
      source IPs and user agents, then highlight sessions where new access context is
      followed by `GetSecretValue`, `GetObject`, export, or similar high-risk reads
      within 10 minutes. The reasoning is that novel identity context plus high-value
      access is stronger than either condition alone.
    answer_sources:
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "NAI: Cloud provider control plane (e.g., AWS Management Console, Azure Portal), CI/CD pipeline runners, administrator workstations."
    range: "Last 90 days, with 10-minute new-context correlation."
    queries:
      - technology: "SIEM correlation pseudocode"
        query: >
          recon = cloud_audit where action in recon_actions;
          access = cloud_audit where action in high_risk_access_actions;
          alert when recon.source_ip or recon.user_agent is new_for_principal and
          access follows within 10m; output principal, source_ip, user_agent, sequence.

  - question: >
      Does the transition pattern between a principal's API categories deviate sharply
      from its historical Markov baseline?
    context: >
      Transition modeling captures suspicious orderings that simple volume rules miss.
      For each principal, estimate the normal likelihood of moving between API categories
      such as `List`, `Read`, `Write`, and `Delete`, then flag 1-hour sessions whose
      observed sequence probability falls beyond the high-percentile anomaly threshold.
      This is especially useful when the individual calls are common but their ordering
      is operationally wrong for the user.
    answer_sources:
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "NAI: Cloud provider control plane (e.g., AWS Management Console, Azure Portal), CI/CD pipeline runners, administrator workstations."
    range: "Last 90 days, with 30-day sequence baselines and 1-hour scoring windows."
    queries:
      - technology: "Sequence statistics pseudocode"
        query: >
          seq = api_category_sequence by principal,1h;
          likelihood = markov_model(principal_baseline_30d).score(seq);
          alert when likelihood <= percentile(principal,1); output principal, seq,
          likelihood, baseline_window.

  - question: >
      Does a sequence model detect a rare or abusive cloud API session even when the
      exact action path is not already codified?
    context: >
      Use a graph or sequence model to score full cloud sessions that include users,
      roles, resources, and API ordering. The objective is to catch rare privilege or
      data-access paths that do not map neatly to a known rule but still stand out from
      historical behavior. Analysts should receive the anomalous sequence, affected
      resources, and the source IPs involved so they can validate whether the workflow is
      genuinely foreign.
    answer_sources:
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "NAI: Cloud provider control plane (e.g., AWS Management Console, Azure Portal), CI/CD pipeline runners, administrator workstations."
    range: "Last 90 days for training and sequence scoring."
    queries:
      - technology: "ML sequence pseudocode"
        query: >
          session_graph = build_principal_role_resource_graph(cloud_audit);
          score = gnn_or_lstm_sequence_model(session_graph);
          alert when score >= anomaly_threshold; output principal, api_sequence,
          resources, source_ips, score.

  - question: >
      Are reconnaissance and access actions occurring with inter-arrival times that look
      automated rather than human-driven?
    context: >
      API automation often reveals itself through unusually consistent or unusually short
      gaps between steps. Measure the interval from reconnaissance to access per
      principal, then compare it to the principal's own baseline and peer expectations.
      Very short or tightly regular timings can indicate scripts, cloud shell automation,
      or attacker tooling rather than ordinary interactive administration.
    answer_sources:
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "NAI: Cloud provider control plane (e.g., AWS Management Console, Azure Portal), CI/CD pipeline runners, administrator workstations."
    range: "Last 90 days, centered on ordered recon-to-access sessions."
    queries:
      - technology: "Timing analysis pseudocode"
        query: >
          intervals = time_between(recon_actions, access_actions) by principal;
          alert when median(intervals) < percentile(principal,1); output principal,
          intervals, api_sequence, source_context.

  - question: >
      Does cross-service graph analysis suggest the principal is traversing cloud services
      in an anomalous attack path?
    context: >
      Lateral movement in cloud environments often spans IAM, compute, storage, and
      logging rather than staying inside one service. Model sessions as user-service-
      activity graphs and look for combinations that are rare for the principal or tenant
      as a whole. This helps detect attack paths that are individually low-volume but
      strategically important because they chain multiple services together.
    answer_sources:
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "NAI: Cloud provider control plane (e.g., AWS Management Console, Azure Portal), CI/CD pipeline runners, administrator workstations."
    range: "Last 90 days for graph construction and anomaly scoring."
    queries:
      - technology: "Graph ML pseudocode"
        query: >
          graph = build_user_service_activity_graph(cloud_audit);
          anomaly = cross_service_gnn.score(graph_session);
          alert when anomaly=true; output principal, traversed_services, actions,
          timestamps, affected_resources.

  - question: >
      Is a cloud CLI running under a user who is not approved for cloud administration,
      from an unapproved parent process, or from a non-standard install path?
    context: >
      This question validates execution context rather than cloud action content.
      Administrative tooling launched by a non-admin user, from `WINWORD.EXE`, or from a
      suspicious path such as a user-writable directory is often a sign of compromise or
      staging. Preserve user group membership, parent process, binary path, and host so
      analysts can quickly determine whether the execution belongs to a sanctioned
      workflow.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "NAI: All corporate endpoints, application servers, developer workstations, Domain Controllers."
    range: "Last 90 days."
    queries:
      - technology: "SIEM rule pseudocode"
        query: >
          cli = process_events where image in cloud_cli_list;
          alert when user not_in approved_cloud_admins or parent_image not_in allowlisted_parents
          or image_path not_in standard_install_dirs; output user, parent_image, image_path, host.

  - question: >
      Is a cloud CLI binary executing from a user-writable path or masquerading as a
      legitimate tool from an unsigned or unusual location?
    context: >
      Attackers may stage renamed or portable cloud CLIs in `%TEMP%`, `C:\Users\Public`,
      or `/tmp` to avoid using sanctioned tooling. The key investigative question is
      whether the binary path and signer context look consistent with an approved
      installation. Analysts should record the full path, signature state, and command
      line because a legitimate binary name alone is not enough to trust the execution.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "NAI: All corporate endpoints, application servers, developer workstations, Domain Controllers."
    range: "Last 90 days."
    queries:
      - technology: "SIEM rule pseudocode"
        query: >
          alert from process_events where image_name in cloud_cli_names and
          (image_path in user_writable_dirs or signed=false or path_nonstandard=true);
          output host, user, image_name, image_path, signer, command_line.

  - question: >
      Is this parent-child-path combination for cloud CLI execution new or extremely rare
      for the host?
    context: >
      A cloud CLI may be normal on a developer laptop but very unusual on a domain
      controller or office workstation. Track parent-child pairs and execution paths per
      host over 90 days and flag first-seen or very low-frequency combinations. This
      turns a generic execution event into a contextual question about whether the tool is
      appearing in a way that matches how the system is normally used.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "NAI: All corporate endpoints, application servers, developer workstations, Domain Controllers."
    range: "Last 90 days."
    queries:
      - technology: "SIEM rarity pseudocode"
        query: >
          combos = summarize(parent_image,image_path,command_name) by host over 90d;
          alert when current_combo unseen=true or frequency <= percentile(host,1);
          output host, user, current_combo, baseline_frequency.

  - question: >
      Does the execution context score as an outlier because of user group, parent,
      binary path, time, or command-line structure?
    context: >
      Context-only anomaly scoring is useful when a cloud command is syntactically valid
      but operationally wrong. Score executions using categorical and timing features,
      optionally combining those with command-line embeddings, and require interpretable
      feature output for triage. The analyst should be able to explain whether the alert
      exists because of who launched the tool, where it lived, when it ran, or what it
      attempted to do.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "NAI: All corporate endpoints, application servers, developer workstations, Domain Controllers."
    range: "Last 90 days for scoring and periodic retraining."
    queries:
      - technology: "ML anomaly pseudocode"
        query: >
          features = [user_group,parent_process,image_path,command_length,time_of_day,embedding];
          score = context_anomaly_model(features);
          explain = top_contributors(features);
          alert when score >= threshold; output score, explain, host, user, command_line.

  - question: >
      Is a user running cloud CLI commands during time windows where they almost never do
      so?
    context: >
      Time-of-day anomalies matter when the tool and user are otherwise legitimate. Build
      60-day day-of-week and hour-of-day distributions for each user's cloud CLI use, and
      highlight executions that occur in rarely or never used windows. This can indicate
      compromised credentials, unattended scripts running from the wrong account, or
      suspicious cloud shell usage from an analyst's workstation.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "NAI: All corporate endpoints, application servers, developer workstations, Domain Controllers."
    range: "Last 90 days, with 60-day user timing baselines."
    queries:
      - technology: "SIEM baseline pseudocode"
        query: >
          profile = cli_usage_by_user_hour_day(60d);
          alert when current_slot_count < 2 historical occurrences;
          output user, host, timestamp, historical_slot_count, command_line.

  - question: >
      Has a host or principal exceeded a dangerous burst threshold of cloud CLI or audit
      activity that includes write or delete operations?
    context: >
      Volume alone can be sufficient to expose aggressive automation, especially when the
      burst includes destructive or configuration-changing actions. Track CLI executions
      and cloud audit calls over 10-minute windows and alert on high counts with
      write/delete activity present. Analysts should review the exact actions involved to
      distinguish maintenance bursts from rapid compromise-driven change.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "Zeek conn.log"
      - "NAI: Network egress points, VPN concentrators, individual host network interfaces, and host-level process monitoring."
    range: "Last 90 days, with 10-minute burst windows."
    queries:
      - technology: "SIEM threshold pseudocode"
        query: >
          cli_counts = count cloud_cli_exec by host_or_principal,10m;
          api_counts = count cloud_audit by host_or_principal,10m;
          alert when (cli_counts > 50 or api_counts > 500) and write_delete_action=true;
          output principal, host, top_actions, window_counts.

  - question: >
      Is bursty activity concentrating on IAM key or policy modification actions?
    context: >
      Rapid sequences of `CreateAccessKey`, policy attachment, or role-policy changes are
      especially dangerous because they can establish persistence or privilege escalation.
      Instead of treating all cloud bursts equally, isolate windows where access-control
      modification events dominate. This helps analysts prioritize activity that could
      immediately expand attacker reach or survivability inside the tenant.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "Zeek conn.log"
      - "NAI: Network egress points, VPN concentrators, individual host network interfaces, and host-level process monitoring."
    range: "Last 90 days, with 15-minute windows."
    queries:
      - technology: "SIEM rule pseudocode"
        query: >
          iam_mods = cloud_audit where action in
          ['CreateAccessKey','AttachUserPolicy','AttachRolePolicy','PutRolePolicy'];
          alert when count(iam_mods by principal,15m) is unusually_high;
          output principal, source_ip, actions, resources.

  - question: >
      Is hourly API volume abnormally high for this host or principal when compared to
      historical seasonality?
    context: >
      Cloud usage often follows strong hour-of-day and day-of-week patterns. Build a
      seasonality-aware 30-day baseline for API volume and alert on hourly counts above
      the 99th percentile using robust statistics. This is useful for large tenants where
      raw volume spikes may be invisible without historical context.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "Zeek conn.log"
      - "NAI: Network egress points, VPN concentrators, individual host network interfaces, and host-level process monitoring."
    range: "Last 90 days, with 30-day hour-of-week baselines."
    queries:
      - technology: "SIEM statistics pseudocode"
        query: >
          hourly = count cloud_audit by principal_or_host,hour_of_week;
          baseline = mad_percentile(hourly,30d);
          alert when current_hourly_count > percentile(hourly,99);
          output entity, current_count, expected_band, service_breakdown.

  - question: >
      Does a forecasting model detect sustained cloud API volume above the expected range
      for the principal or host?
    context: >
      Forecasting is valuable when activity drifts upward over several windows rather
      than exploding instantly. Train a per-principal or per-host model on API and CLI
      counts and alert when observed activity breaches the upper prediction interval for
      consecutive windows. Analysts should compare the predicted range to the actual API
      mix to determine whether the spike is a job run, a provisioning surge, or possible
      misuse.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "Zeek conn.log"
      - "NAI: Network egress points, VPN concentrators, individual host network interfaces, and host-level process monitoring."
    range: "Last 90 days, with consecutive-window forecast checks."
    queries:
      - technology: "Time-series pseudocode"
        query: >
          series = aggregate cloud_api_count by principal_or_host,time_window;
          forecast = prophet_or_lstm(series);
          alert when observed > upper_prediction_interval for >=2 windows;
          output entity, observed, predicted, api_examples, source_ips.

  - question: >
      Is a specific cloud service showing a modified Z-score spike, especially when the
      activity also comes from a new source IP?
    context: >
      Service-level monitoring can reveal focused abuse that total API volume masks.
      Compute robust modified Z-scores for services such as IAM, S3, EC2, Lambda, and
      Secrets Manager, then cross-check whether the spike coincides with a new source IP
      for the principal. This is particularly useful for detecting credential misuse that
      targets one service aggressively rather than the tenant broadly.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "Zeek conn.log"
      - "NAI: Network egress points, VPN concentrators, individual host network interfaces, and host-level process monitoring."
    range: "Last 90 days, with rolling service-level MAD baselines."
    queries:
      - technology: "SIEM service-baseline pseudocode"
        query: >
          service_counts = count cloud_audit by principal,service,window;
          mz = modified_zscore(service_counts);
          alert when mz > 3.5 and source_ip new_for_principal=true;
          output principal, service, mz, source_ip, top_actions.

  - question: >
      Did the host follow a download, then script execution, then cloud API invocation
      sequence within five minutes?
    context: >
      This is a high-confidence staged-execution pattern that often precedes cloud abuse.
      Look for file retrieval or download-tool execution, followed quickly by a script
      engine such as PowerShell, Python, or Bash, and then a cloud CLI command or cloud
      audit action by the same identity. The point is to reconstruct an execution chain
      that shows the host was used as a launcher into cloud APIs, not just that cloud
      access happened nearby in time.
    answer_sources:
      - "Windows Event ID 4688"
      - "Sysmon Event ID 1"
      - "Linux auditd logs"
      - "Zeek files.log"
      - "AWS CloudTrail logs"
      - "Azure Activity Logs"
      - "Google Cloud Audit Logs"
      - "NAI: User workstations, public-facing web servers, CI/CD servers, network file transfer analysis points."
    range: "Last 90 days, with 5-minute chained-event windows."
    queries:
