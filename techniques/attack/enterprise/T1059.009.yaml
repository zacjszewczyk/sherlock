- question: >-
    Does a multi-dimensional per-principal anomaly model score a single principal above the 99th percentile
    while simultaneously showing geographic deviation and a data-volume spike?
  context: >-
    Build a multi-dimensional anomaly profile per principal combining: (1) geolocation distribution (entropy
    per region), (2) API call-type distribution (read/write/admin), (3) data volume per API family, (4)
    time-of-access patterns, and (5) source IP reputation. Train a One-Class SVM or Isolation Forest on
    30 days of CloudTrail events and score new activity against the learned boundary; alert when a principal's
    daily score exceeds the 99th percentile AND includes geographic deviation plus a volume spike simultaneously.
    This multi-signal approach reduces false positives from legitimate geographic scaling while catching
    layered attack patterns. For the Execution tactic, the simultaneity requirement isolates credential
    abuse that manifests across several behavioral dimensions at once. Output the contributing dimensions
    for triage.
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - >-
    NAI: Cloud provider control plane (AWS Management Console, Azure Portal, GCP Console), network gateways
    with cloud traffic visibility.
  range: Last 90 days, with 30-day training windows.
  queries:
  - technology: ML/pseudocode
    query: >-
      features = [geo_entropy, api_type_dist, volume_per_family, time_of_access, ip_reputation];

      model = ocsvm_or_iforest(train=30d per principal);

      score = model.score(current_day);

      alert when score >= percentile(principal,99) AND geo_deviation AND volume_spike;

      output principal, contributing_dimensions, geo_delta, volume_delta, score.
- question: >-
    Has a principal-source-IP pair produced a new User-Agent or API version (e.g., a transition from Browser
    to Custom SDK from a new IP), or a TLS version/cipher mismatch inconsistent with a modern SDK?
  context: >-
    Suspicious API clients leave fingerprints in User-Agent strings, API versions, and TLS parameters.
    For each principal-source-IP pair, build a 60-day baseline of observed User-Agents and API versions
    and alert when a new one appears AND the principal's call pattern deviates significantly. Classify
    User-Agents (AWS CLI, Terraform, Lambda, Custom SDK, Browser, etc.); a transition from Browser to
    Custom SDK from a new IP should boost the anomaly score. Also track TLS versions/ciphers; mismatches
    (e.g., old TLS 1.0 from a modern SDK) indicate attacker-controlled clients. AWS documents default
    User-Agents per SDK version, so deviations suggest non-standard clients. For the Execution tactic,
    this surfaces token abuse and session hijacking driving cloud API calls from foreign tooling.
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - >-
    NAI: Cloud provider control plane (AWS Management Console, Azure Portal, GCP Console), network gateways
    with cloud traffic visibility.
  range: Last 90 days, with 60-day per-principal-source-IP baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = observed_user_agents_and_api_versions by principal,source_ip over 60d;

      class = classify_user_agent(current);

      alert when (new_user_agent OR new_api_version) AND call_pattern_deviation;

      also alert when ua_class_transition('Browser'->'Custom SDK') from new_ip OR tls_version_cipher_mismatch;

      output principal, source_ip, user_agent, ua_class, api_version, tls_params.
