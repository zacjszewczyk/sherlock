- question: >-
    Did a host perform, within 5 minutes and under the same identity, a download event, then a script-engine
    execution (PowerShell/python/bash), then a cloud CLI execution or cloud audit API call?
  context: >-
    This is a high-confidence staged-execution pattern that often precedes cloud abuse. Trigger when a
    host performs, within 5 minutes, (1) a download event (Zeek files.log or curl/wget/bitsadmin/Invoke-WebRequest
    process creation), (2) a script-engine execution, and (3) a cloud CLI execution or cloud audit API
    call, all from the same identity. Sigma rules for AWS Systems Manager SendCommand detect one common
    variant where the cloud API itself pushes scripts to endpoints. For the Execution tactic, reconstructing
    this ordered chain shows the host was used as a launcher into cloud APIs rather than cloud access
    merely occurring nearby in time. Output the host, identity, ordered sequence, and artifacts.
  answer_sources:
