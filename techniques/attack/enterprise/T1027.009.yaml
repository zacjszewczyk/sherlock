name: 'T1027.009: Obfuscated Files or Information: Embedded Payloads'
id: 2cd46de8-2e38-47c7-879f-d384b75ccd08
description: Investigate adversary use of embedded payloads, where otherwise benign-looking files such
  as executables, PE binaries, scripts, archives, and Mach-O/AppleScript objects are abused to carry,
  conceal, and unpack secondary malicious content. This playbook helps an analyst hunt for staged or appended
  payloads delivered over the network and dropped to disk (matched by hash, packer section names, overlays,
  and entropy outliers), PowerShell script blocks that decode and execute embedded content in memory,
  process-injection chains that unpack a payload inside a legitimate process, content-versus-extension
  mismatches between downloaded objects and the files that execute them, and fast drop-and-run sequences
  from temporary or user-writable directories. It combines network telemetry (Zeek files/pe/conn), endpoint
  process and file-creation events, PowerShell logging, and Sysmon injection events to determine whether
  the adversary is evading defenses by embedding malicious payloads within non-executable or seemingly
  benign executable files.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a file transferred over the network or created/executed on an endpoint match a known malicious
    dropper or loader hash, or exhibit packer-style PE section names, overlays, and high-entropy regions
    consistent with a staged embedded payload?
  context: Embedded-payload campaigns frequently deliver droppers and loaders whose hashes are already
    documented in threat intelligence, or whose PE structure betrays packing (UPX, MPRESS, or custom packers)
    used to hide a secondary payload. Compare hashes seen in Zeek files.log and Windows process-creation
    (Event ID 4688) against dropper/loader intel feeds, and flag PE section names, overlays, or appended
    regions whose Shannon entropy exceeds ~7.2 while the import table is unusually small — a structural
    fingerprint of compressed or encrypted embedded content. A positive result indicates a benign-looking
    file is concealing executable content for stealthy delivery; a negative result helps rule out known
    tooling but does not exclude novel custom packers, so pair with the statistical and ML checks. This
    directly supports the Stealth objective of spotting malicious content hidden inside otherwise-trusted
    files.
  answer_sources:
  - Zeek files.log
  - Zeek pe.log
  - Windows Event ID 4688
  - 'NAI: Internet Gateway Firewalls, Web Proxies, Email Gateways, User Workstations, File Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "files = FROM Zeek_files.log, Event4688 SELECT sha256, pe_sections, overlay_size, import_count\n\
      ALERT WHERE sha256 IN ti_dropper_loader_hashes\n   OR ANY(section.name) IN known_packer_sections(UPX0,\
      \ .MPRESS, custom)\n   OR (section.entropy > 7.2 AND import_count < small_threshold)"
  - technology: Zeek/pseudocode
    query: 'from pe.log: emit where exists(section with entropy > 7.2) and import_count < 10

      join files.log on fuid to recover sha256 and source host/url'
- question: Does any PE section exhibit entropy that is a statistical outlier relative to the empirical
    baseline for that section type or software family, indicating encrypted or compressed embedded content?
  context: Rather than hard-coding an entropy cutoff, baseline the entropy of each section type per software
    family and alert when a section exceeds the 99th percentile or sits more than 3 standard deviations
    above the family mean. Encrypted or compressed payloads push section entropy toward the theoretical
    maximum (8.0), and an empirically derived cutoff (often >7.0) reduces false positives from legitimately
    compressed resources. For short high-entropy blobs, prefer KL divergence against a known-benign byte
    distribution, which is more robust than raw entropy on small samples. A flagged outlier suggests a
    section was repurposed to hold a hidden payload; this method catches custom packers that signature
    matching misses, advancing the Stealth detection goal.
  answer_sources:
  - Zeek pe.log
  - Zeek files.log
  - Windows Event ID 11 (Sysmon)
  - 'NAI: Internet Gateway Firewalls, Web Proxies, Email Gateways, User Workstations, File Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = PER section_type, software_family CALCULATE mean(entropy), stddev(entropy), pctl(entropy,99)\n\
      ALERT WHERE section.entropy > baseline.pctl99\n   OR section.entropy > baseline.mean + 3*baseline.stddev\n\
      for short blobs: ALERT WHERE KL_divergence(blob_byte_dist, benign_baseline) > tuned_threshold"
- question: When a static PE classifier scores a file, is the malicious probability high (>0.9), and which
    explainable features (overlay size, max section entropy, suspicious imports) drove that score?
  context: Score files with a gradient-boosted classifier trained on EMBER static features — section count,
    per-section entropy, overlay/appended-data size, import hash, and byte/string histograms — and prioritize
    files with malicious probability above 0.9. Retrain on EMBER2024 periodically to handle concept drift.
    Crucially, surface the top-3 contributing features (via TreeSHAP/SHAP) so the analyst can see whether
    an oversized overlay, an extreme section entropy, or anomalous imports drove the verdict, making the
    alert defensible and triageable. High-confidence scores with embedded-payload-aligned features (large
    overlay, high max entropy) strongly indicate a concealed payload, supporting the Stealth investigation;
    the explanations let an analyst confirm rather than blindly trust the model.
  answer_sources:
  - Zeek files.log
  - Zeek pe.log
  - Windows Event ID 4688
  - 'NAI: Internet Gateway Firewalls, Web Proxies, Email Gateways, User Workstations, File Servers'
  range: Last 90 days
  queries:
  - technology: ML/EMBER classifier pseudocode
    query: 'features = EMBER_extract(file)  # section_count, per_section_entropy, overlay_size, imphash,
      byte/string histograms

      p = gbdt_model.predict_proba(features)

      ALERT WHERE p > 0.9

      explain = TreeSHAP(model, features); REPORT top3(explain)  # e.g. overlay_size, max_section_entropy,
      suspicious_imports'
- question: Does a PE file have an unusually large overlay (appended data past the last section) combined
    with a small import table, the structural signature of a secondary payload appended after the normal
    file body?
  context: An overlay is data appended to a PE after its last section; legitimate files use it sparingly
    (signatures, small resources). A large overlay (e.g., >100 KB or >25% of file size) paired with a
    sparse import table is a strong structural indicator that a secondary payload has been appended for
    stealthy delivery. Alert on this combination from Zeek pe.log and Sysmon file-creation telemetry.
    A positive result points to an embedded-payload carrier even when the payload itself is unknown to
    intel; a negative result reduces (but does not eliminate) the likelihood of appended-overlay smuggling.
    This addresses the Stealth tactic by exposing hidden content carried inside an otherwise benign binary.
  answer_sources:
  - Zeek pe.log
  - Zeek files.log
  - Windows Event ID 11 (Sysmon)
  - 'NAI: Internet Gateway Firewalls, Web Proxies, Email Gateways, Endpoint temporary directories'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHERE pe.overlay_size > 100KB OR (pe.overlay_size / pe.file_size) > 0.25\n   AND pe.import_count\
      \ < small_threshold"
  - technology: Zeek/pseudocode
    query: 'from pe.log: compute overlay_size = file_size - end_of_last_section

      emit where overlay_size > 100KB and import_count < 10'
- question: Is a file's overlay-to-filesize ratio or section count a statistical outlier relative to its
    file family, suggesting an appended or hidden secondary payload?
  context: Baseline the overlay-to-filesize ratio and section counts per file family using the EMBER static
    feature schema, then flag files above the 95th-percentile overlay ratio or more than 2 standard deviations
    above the normal section count for that family. Track the byte-volume of the overlay region as the
    primary volume metric so analysts can gauge how much hidden data is present. Outliers here represent
    files structurally inconsistent with their peers — a hallmark of payload smuggling that evades static
    signatures. Confirming an outlier ratio supports the Stealth hypothesis that benign-looking files
    are concealing payloads; in-family normality argues against it.
  answer_sources:
  - Zeek pe.log
  - Zeek files.log
  - Windows Event ID 11 (Sysmon)
  - 'NAI: Internet Gateway Firewalls, Web Proxies, Email Gateways, Endpoint temporary directories'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = PER file_family CALCULATE pctl(overlay_ratio,95), mean(section_count), stddev(section_count)\n\
      ALERT WHERE overlay_ratio > baseline.pctl95\n   OR section_count > baseline.mean + 2*baseline.stddev\n\
      REPORT overlay_byte_volume"
- question: Do unsupervised anomaly detectors (Isolation Forest / One-Class SVM) flag a PE as a novel
    outlier on section count, per-section entropy, overlay ratio, and import counts, and which features
    make it anomalous?
  context: Apply Isolation Forest or One-Class SVM to EMBER-derived features — section count, per-section
    entropy, overlay ratio, and import counts — to catch novel embedded-payload carriers that supervised
    models and signatures have never seen. Report the top-3 anomalous features per alert using SHAP so
    the analyst understands why the file was isolated (e.g., extreme overlay ratio plus low imports).
    Unsupervised outlier detection is valuable against bespoke packers and one-off droppers used by sophisticated
    actors, directly serving the Stealth objective of finding hidden payloads that blend in. A clearly
    anomalous structure warrants escalation and deeper static/dynamic analysis.
  answer_sources:
  - Zeek pe.log
  - Zeek files.log
  - Windows Event ID 11 (Sysmon)
  - 'NAI: Internet Gateway Firewalls, Web Proxies, Email Gateways, Endpoint temporary directories'
  range: Last 90 days
  queries:
  - technology: ML/Anomaly pseudocode
    query: 'X = EMBER_features(section_count, per_section_entropy, overlay_ratio, import_count)

      model = IsolationForest() or OneClassSVM(); score = model.decision_function(X)

      ALERT WHERE score in anomalous_tail

      explain = SHAP(model, X); REPORT top3 anomalous features'
- question: Does a PowerShell script block or command line contain an encoded payload together with a
    decoding primitive and an in-memory execution primitive (e.g., -EncodedCommand, FromBase64String,
    IEX/Invoke-Expression, [Reflection.Assembly]::Load), indicating embedded content being unpacked and
    run at runtime?
  context: Embedded payloads are commonly carried as Base64 or otherwise-encoded blobs inside PowerShell,
    then decoded and executed in memory to avoid touching disk. Search Event ID 4104/4103 script blocks
    and 4688 command lines for the co-occurrence of an encoded blob, a decode primitive (FromBase64String,
    -EncodedCommand), and an in-memory execution primitive (IEX/Invoke-Expression, [Reflection.Assembly]::Load),
    especially when the encoded block is large or staged decoder calls are present. Apply content signatures
    for casing, char-array, and format-operator obfuscation. The presence of all three primitives together
    is a high-fidelity signal of runtime payload unpacking; isolated benign Base64 usage is common, so
    the conjunction is what matters. This squarely supports the Stealth tactic by catching payloads hidden
    in script text.
  answer_sources:
  - Windows Event ID 4104
  - Windows PowerShell Event ID 4103
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHERE Event4104/4103/4688 script_block MATCHES\n   (regex('-EncodedCommand|FromBase64String')\
      \ AND regex('IEX|Invoke-Expression|\\[Reflection.Assembly\\]::Load'))\n   AND has_large_encoded_block(script_block)\n\
      \   OR matches_obfuscation_yara(gen_powershell_obfuscation)"
- question: After deobfuscation, does a PowerShell script block's character distribution, token entropy,
    or special-character ratio deviate significantly from a benign corpus, indicating encoded or obfuscated
    embedded content?
  context: Score deobfuscated script-block text with character-distribution, token-entropy, and special-character-ratio
    features benchmarked against a benign PowerShell corpus, flagging text in the 98th percentile or with
    significant chi-squared / KL deviation from the baseline. Encoded or obfuscated payloads inflate entropy
    and special-character ratios well beyond normal administrative scripting. Also track the encoded-block
    byte length (volume) and the frequency of decode calls per script as supporting metrics. A strong
    statistical deviation indicates concealed content that warrants extraction and analysis, while corpus-normal
    text argues for benign use. This complements signature matching by catching novel obfuscation, in
    service of the Stealth objective.
  answer_sources:
  - Windows Event ID 4104
  - Windows PowerShell Event ID 4103
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "feat = deobfuscate(script_block); compute char_dist, token_entropy, special_char_ratio\nALERT\
      \ WHERE token_entropy > pctl(benign_corpus,98)\n   OR chi_squared(char_dist, benign_baseline) >\
      \ threshold\n   OR KL_divergence(char_dist, benign_baseline) > threshold\nREPORT encoded_block_length,\
      \ decode_call_count"
- question: When a text classifier scores a PowerShell script as malicious with high confidence, which
    tokens or features (n-grams, API references, entropy, length) drove that classification?
  context: Train a classifier on script n-grams, API/cmdlet references, entropy, and length, and alert
    on high-confidence malicious scores. Surface the top-3 contributing tokens/features per alert so the
    analyst can see whether a specific API reference, obfuscation artifact, or entropy spike drove the
    verdict. ML text classification generalizes across obfuscation variants that evade brittle signatures,
    catching embedded-payload scripts from both commodity malware and tailored intrusions. A high-confidence
    score with payload-aligned tokens (decode primitives, reflective loaders) supports escalation; the
    explanation makes the alert actionable and defensible, advancing the Stealth detection goal.
  answer_sources:
  - Windows Event ID 4104
  - Windows PowerShell Event ID 4103
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/Text classifier pseudocode
    query: 'feat = vectorize(script_block)  # n-grams, api_refs, entropy, length

      p = clf.predict_proba(feat)

      ALERT WHERE p > high_confidence_threshold

      explain = SHAP/LIME(clf, feat); REPORT top3 contributing tokens/features'
- question: Did a non-system process inject code into a legitimate target process such that the resulting
    memory region is private and executable with no backing file, consistent with an embedded payload
    being unpacked and run inside another process?
  context: Process injection is a common way to execute an unpacked embedded payload inside a trusted
    process to evade defenses. Trigger on Sysmon Event ID 8 (CreateRemoteThread) or 10 (ProcessAccess)
    where common user applications inject into system processes and the target memory is private+executable
    with no backing file. Apply high-fidelity heuristics (lsass.exe never spawns children; svchost.exe
    from a non-services.exe parent) and Sysmon Event ID 25 image-replacement logic. A private+executable
    region with no backing file is a hallmark of injected/unpacked code rather than legitimately loaded
    modules. Confirming such a pair, especially into a sensitive process, is a strong Stealth indicator
    of an embedded payload running covertly; benign automation rarely matches these patterns.
  answer_sources:
  - Windows Event ID 8 (Sysmon)
  - Windows Event ID 10 (Sysmon)
  - Windows Event ID 4688
  - 'NAI: User Workstations, Critical Servers, Terminal Servers, Domain Controllers'
  range: Last 90 days, with event-centered correlation around the injection time.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHERE (Event8 CreateRemoteThread OR Event10 ProcessAccess)\n   AND source_image IN user_applications\
      \ AND target_image IN system_processes\n   AND target_memory.private AND target_memory.executable\
      \ AND target_memory.no_backing_file\n   OR (target=='lsass.exe' has child) OR (svchost.exe parent\
      \ != services.exe)\n   OR Event25 image_replacement"
- question: Is a given source-to-target process-injection pair rare or never-before-seen across the fleet,
    and are there denied/restricted ProcessAccess attempts that signal probing?
  context: Baseline source->target injection frequencies fleet-wide over 90 days and flag (source,target)
    pairs occurring fewer than five times or never seen before — rare injection relationships are far
    more likely to be malicious than common, well-understood ones. Separately, profile failed or denied
    access attempts (Event ID 10 with restricted GrantedAccess) as a distinct failure-mode signal that
    an actor is probing a hardened process such as lsass.exe. A novel injection pair into a sensitive
    target is a strong escalation trigger; a common, expected pair (e.g., a known security agent) is likely
    benign. This frequency-based approach surfaces stealthy injection that individually looks plausible,
    supporting the Stealth investigation.
  answer_sources:
  - Windows Event ID 8 (Sysmon)
  - Windows Event ID 10 (Sysmon)
  - Windows Event ID 4688
  - 'NAI: User Workstations, Critical Servers, Terminal Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = COUNT injections GROUP BY (source_image, target_image) OVER 90d

      ALERT WHERE baseline[(source,target)] < 5 OR pair never_seen

      failures = Event10 WHERE GrantedAccess restricted/denied

      REPORT failures as probing signal'
- question: Does the runtime API sequence show the allocate->write->execute chain linked by a unified
    memory address (and broader decode->inject sequences), confirming in-memory payload unpacking and
    injection?
  context: Reliable injection detection requires the sequential allocate->write->execute API chain (e.g.,
    VirtualAllocEx -> WriteProcessMemory -> CreateRemoteThread) linked by a unified memory address before
    alerting, which dramatically reduces false positives from unrelated API calls. Optionally model broader
    decode->inject runtime API sequences with ensemble or sequence learners trained on Mal-API-2019, and
    report the contributing APIs (VirtualAllocEx, WriteProcessMemory) in the alert. Observing the full
    linked chain is near-conclusive evidence that an embedded payload was written into and executed within
    another process — a core Stealth behavior. The reported API context lets analysts validate the chain
    and scope the affected processes.
  answer_sources:
  - Windows Event ID 8 (Sysmon)
  - Windows Event ID 10 (Sysmon)
  - Windows Event ID 4688
  - 'NAI: User Workstations, Critical Servers, Terminal Servers, Domain Controllers'
  range: Last 90 days, with event-centered correlation across the API chain.
  queries:
  - technology: ML/API-sequence pseudocode
    query: "REQUIRE chain: VirtualAllocEx(addr) -> WriteProcessMemory(addr) -> CreateRemoteThread(addr)\n\
      \   linked by unified memory address\nmodel = sequence_learner(trained_on=Mal-API-2019); p = model.score(api_sequence)\n\
      ALERT WHERE chain_present OR p > threshold; REPORT contributing APIs"
- question: Did a process execute from a file with a non-executable extension while Zeek file-transfer
    telemetry identified the same object as an executable MIME type or PE/Mach-O magic, indicating the
    content and file name do not match?
  context: A classic embedded/disguised-payload trick is to deliver executable content under a misleading
    non-executable extension. Join Zeek files.log to Event ID 4688 on filename or hash and alert when
    objects with executable MIME types (or PE/Mach-O magic bytes) carry denylisted or misleading non-executable
    extensions and execute shortly after download. The same content-vs-name mismatch covers nested/run-only
    payloads such as macOS osascript-dropped Mach-O objects. A confirmed mismatch followed by execution
    is strong evidence of deliberate disguise to evade extension-based controls, directly serving the
    Stealth objective; matching content and extension argues against this technique.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: User Workstations, Web Proxies, Email Gateways, Network Egress Points, File Servers'
  range: Last 90 days, prioritizing a short download-to-execution window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join = Zeek_files.log JOIN Event4688 ON filename OR sha256\nALERT WHERE files.mime_type IN\
      \ executable_mimes (or magic in PE/Mach-O)\n   AND file_extension IN denylist_or_nonexecutable\n\
      \   AND time(execution) - time(download) < short_window"
  - technology: Zeek/pseudocode
    query: 'from files.log: flag fuid where mime_type == application/x-dosexec and inferred_ext != exe

      correlate with conn.log for source host/url'
- question: Is a process executing from a file extension that falls outside the common 95% set of observed
    execution extensions, and do Zeek HTTP/MIME error or blocked-transfer rates indicate failed disguised
    deliveries?
  context: Track extension execution frequencies from Event ID 4688, maintain the common 95% set of extensions
    that normally execute in the environment, and alert when an execution occurs from an extension outside
    that set — seldom-executed extensions are disproportionately associated with disguised payloads. Separately,
    profile download HTTP/MIME error and blocked-transfer rates from Zeek conn.log as a distinct failure-mode
    signal that an actor's disguised deliveries are partially failing. A rare execution extension is a
    low-noise lead worth investigating; common extensions are expected. This frequency approach catches
    novel disguise tricks without prior signatures, supporting the Stealth investigation.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: User Workstations, Web Proxies, Email Gateways, Network Egress Points, File Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'common95 = top extensions by exec_count covering 95% of Event4688 executions

      ALERT WHERE exec.file_extension NOT IN common95

      profile Zeek_conn.log http/mime_error_rate, blocked_transfer_rate as failure-mode signal'
- question: Does a time-series model detect a sudden spike in executions of a seldom-used file extension,
    signaling a disguised-payload campaign?
  context: Use ARIMA (or seasonal-decomposition residuals) on per-extension execution counts and flag
    sudden spikes in seldom-used extensions, reporting the extension, its baseline rate, and the observed
    spike. A disguised-payload campaign often manifests as an abrupt increase in executions from an extension
    that is normally near-zero. Time-series anomaly detection captures this temporal shift even when individual
    events look unremarkable. A statistically significant spike in a rare extension is a strong lead for
    a coordinated delivery wave, advancing the Stealth objective; stable baselines argue against an active
    campaign. The reported baseline and spike give analysts immediate context for triage.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: User Workstations, Web Proxies, Email Gateways, Network Egress Points, File Servers'
  range: Last 90 days
  queries:
  - technology: ML/Time-series pseudocode
    query: 'series = per_extension daily exec_count from Event4688

      model = ARIMA(series) or seasonal_decompose(series)

      ALERT WHERE observed - forecast > anomaly_threshold for seldom-used extension

      REPORT extension, baseline_rate, observed_spike'
- question: Was an executable created and then immediately executed by the same parent process from a
    temporary or user-writable directory, consistent with a dropper unpacking an embedded payload and
    running it in place?
  context: A dropper that unpacks an embedded payload typically writes the executable and runs it almost
    immediately from %TEMP%, %APPDATA%, or another user-writable path. Match Sysmon Event ID 11 file creation
    to Event ID 4688 process creation within 60 seconds from such directories, verify ProcessGuid linkage
    between the writer and the executed file, and exclude known installers/updaters via a signed-publisher
    allowlist. A tight create-then-execute sequence from a writable path by an untrusted parent is a high-confidence
    dropper signature; legitimate software updates are filtered out by the publisher allowlist. This directly
    supports the Stealth objective of catching embedded payloads being unpacked and executed on the host.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 11 (Sysmon)
  - 'NAI: User Workstations, Application Servers, Temporary File Directories (%TEMP%, %APPDATA%)'
  range: Last 90 days, prioritizing a 60-second create-to-execute window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "create = Event11 WHERE target_path IN [%TEMP%, %APPDATA%, user_writable]\nexec = Event4688\
      \ WHERE image == create.target_filename\nALERT WHERE JOIN create WITH exec ON ProcessGuid AND (exec.time\
      \ - create.time) < 60s\n   AND parent NOT IN signed_publisher_allowlist"
- question: Is the delay between file creation and process creation in the bottom 5th percentile (near-instant
    automated execution) for an untrusted parent, and how often does that parent perform drop-and-run
    per hour?
  context: Baseline file-create-to-process-create delays across the fleet and flag sequences in the bottom
    5th percentile — near-instant, automated execution — when the parent process is untrusted. Human-driven
    workflows rarely create and execute a binary in milliseconds, so an extremely short delay points to
    automated dropper behavior. Also count drop-and-run frequency per parent process per hour as a volume/frequency
    metric, and track failed-launch rates as a failure-mode signal. A bottom-percentile delay from an
    untrusted parent, especially recurring, strongly suggests an embedded-payload dropper, supporting
    the Stealth investigation; normal delays from trusted parents argue against it.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 11 (Sysmon)
  - 'NAI: User Workstations, Application Servers, Temporary File Directories (%TEMP%, %APPDATA%)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'delay = exec.time - create.time per ProcessGuid-linked pair

      baseline = pctl(delay, 5)

      ALERT WHERE delay < baseline AND parent NOT trusted

      REPORT drop_and_run_count per parent per hour, failed_launch_rate'
- question: Does a sequence model (LSTM / sequence autoencoder) flag a download-originated decode->write->execute
    event chain as anomalous via high reconstruction error, indicating a drop-and-execute payload?
  context: Train an LSTM or sequence autoencoder on download-originated event sequences (decode->write->execute)
    and alert when reconstruction error exceeds a tuned threshold, indicating the chain deviates from
    learned-normal behavior. Corroborate with runtime API-sequence models trained on Mal-API-2019 and
    surface the divergent steps in the alert. Sequence modeling captures the temporal structure of an
    embedded-payload dropper end-to-end, catching variants that rule-based timing windows miss. High reconstruction
    error on a download-origin chain is a strong anomaly worth escalation, especially when corroborated
    by API-sequence models; low error on a familiar benign chain argues against malicious activity. This
    advances the Stealth objective of detecting unpacked-and-executed embedded payloads.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 11 (Sysmon)
  - 'NAI: User Workstations, Application Servers, Temporary File Directories (%TEMP%, %APPDATA%)'
  range: Last 90 days, with event-centered correlation across the decode-write-execute chain.
  queries:
  - technology: ML/Sequence pseudocode
    query: 'seq = build download_originated event_sequence (decode -> write -> execute)

      model = LSTM_autoencoder(trained_on=benign_sequences)

      err = reconstruction_error(model, seq)

      ALERT WHERE err > tuned_threshold; corroborate with API-seq model (Mal-API-2019)

      REPORT divergent steps'
