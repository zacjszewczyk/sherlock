name: 'T1218.011: System Binary Proxy Execution: Rundll32'
id: 1a9ebd97-7b08-49a7-8be3-de23942afbda
description: 'This playbook helps an analyst investigate whether an adversary is abusing rundll32.exe
  to proxy the execution of malicious code in order to evade defenses, blend in with legitimate Windows
  activity, and bypass application allowlists or process-based detections (Stealth, TA0005). It guides
  the hunt across several complementary behavioral angles: rundll32 invoking DLLs whose hash or reputation
  indicates malware combined with immediate egress to suspicious infrastructure; command-line patterns
  indicative of proxy execution such as the ''javascript:'' protocol handler, Control Panel item (.cpl)
  execution via shell32.dll Control_RunDLL, abusable module+export pairs (advpack.dll LaunchINFSection,
  comsvcs.dll MiniDump, zipfldr.dll RouteTheCall), ordinal exports (,#1), and bare rundll32 launches with
  no parameters; rundll32 running from non-system paths, loading DLLs from user-writable directories (AppData/Temp),
  or spawned by anomalous parents (Office, mshta.exe, scripting engines); and host-level bursts of rundll32
  executions or rare outbound connections indicative of beaconing or dead C2. Detection methods combine
  symbolic-logic rules, statistical baselining/rarity scoring, and machine-learning models (Random Forest,
  Isolation Forest, sequence/provenance models, time-series and clustering) applied to Windows Security/Sysmon
  process, module-load, file, and network telemetry alongside Zeek conn.log and dns.log, so the analyst
  can corroborate suspected rundll32 abuse against process lineage, loaded modules, command-line obfuscation,
  and network callback context.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
