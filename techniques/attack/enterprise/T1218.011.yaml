questions:
- question: '[Stealth] Match DLL hashes and connections to Intel: For technique T1218.011 (System Binary
    Proxy Execution: Rundll32), can you determine whether rundll32 proxy execution invokes a DLL whose
    hash or reputation indicates malware, and associated network telemetry shows immediate communication
    with suspicious external infrastructure consistent with defense-evasion tradecraft. Use process creation
    telemetry for command-line, parent-process, and user context. Validate the behavior against Zeek connection
    and DNS telemetry for destination, timing, and reputation context. Use module-load telemetry to confirm
    which DLLs or payloads were actually loaded. -- specifically, using the ''Match DLL hashes and connections
    to Intel'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses rundll32.exe to proxy
    execution of malicious code so that it appears as routine, signed Windows activity and slips past
    allowlists and process-based detections. This evidence focuses on the condition that rundll32 proxy
    execution invokes a DLL whose hash or reputation indicates malware, and associated network telemetry
    shows immediate communication with suspicious external infrastructure consistent with defense-evasion
    tradecraft. Use process creation telemetry for command-line, parent-process, and user context. Validate
    the behavior against Zeek connection and DNS telemetry for destination, timing, and reputation context.
    Use module-load telemetry to confirm which DLLs or payloads were actually loaded. This Symbolic Logic
    approach looks for the following signal: Correlate process, file, and network telemetry before applying
    the rule. Extract DLL paths/hashes and the module+export pair from rundll32.exe command lines (Windows
    Event ID 4688, Sysmon EID 7), compare hashes/known-abusable exports against threat intel and the abuse
    catalog in [Rundll32, LOLBAS Project](https://lolbas-project.github.io/lolbas/Binaries/Rundll32/),
    and correlate with outbound connections (Windows Event ID 5156, Zeek conn.log/dns.log) to raise alerts
    on matches. A positive result -- a rule match, statistical outlier, or model alert -- suggests rundll32
    on the host is being used to load or execute attacker-controlled code or to reach external infrastructure
    in a way that deviates from sanctioned software-management behavior; pivot to the responsible rundll32
    process, its command line and module+export pair, the loaded DLLs and their signer/hash, the parent-process
    lineage and user context, and any subsequent file writes or outbound connections. A negative result
    helps reduce suspicion for this rundll32 abuse vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, obfuscated, or living-off-the-land execution.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 7
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, Domain Controllers, Internet Gateway/Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match DLL hashes and connections to Intel

      source IN [Windows Event ID 4688, Windows Event ID 5156, Sysmon Event ID 7, Zeek conn.log, Zeek
      dns.log]

      | where process_name == "rundll32.exe"

      | eval bad = match_abuse_pattern(command_line, module, export, dll_hash, dll_signer)

      | join (network_egress within 10m by host) as net

      | where bad AND (net.dest IN threat_intel OR net.dest IS rare)

      | alert host, user, parent_process, command_line, dll_hash, net.dest'
  - technology: Zeek/pseudocode
    query: '# corroborate rundll32 egress with Zeek

      conn.log + dns.log

      | join host->rundll32 process events by src_ip, time +/-10m

      | flag conn_state IN (S0, REJ) as failed, dns rcode==NXDOMAIN

      | score dest by rarity/reputation; alert on rare dest or beaconing'
