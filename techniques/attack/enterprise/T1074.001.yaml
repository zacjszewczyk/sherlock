questions:
- question: 'Using deterministic rule logic, can you determine whether ''Match staging tools and archive
    indicators'' indicates local data staging activity? Specifically: Compare staging-tool process hashes,
    signer metadata, archive filenames, and archive hashes against threat intelligence and prior incident
    indicators, then alert when a suspicious packer or archive artifact appears in a common staging directory
    or follows sensitive file access.'
  context: 'Tactic context (Collection / Collection): the adversary gathers and consolidates data of interest
    on a compromised host, typically as the step immediately preceding exfiltration. Evidence under investigation:
    A host executes an archiver, copy utility, or custom packer associated with known collection tooling,
    or creates a new archive in a temporary or staging directory whose naming, signer, or hash characteristics
    align with prior malicious collection activity. Approach (Match staging tools and archive indicators):
    Compare staging-tool process hashes, signer metadata, archive filenames, and archive hashes against
    threat intelligence and prior incident indicators, then alert when a suspicious packer or archive
    artifact appears in a common staging directory or follows sensitive file access. A positive result
    means a process or host is aggregating, compressing, or encrypting collected data into a staging location
    in a pattern inconsistent with legitimate administration or backup; a negative result means the observed
    packaging matches expected, baseline behavior. Investigate the named area of interest (User workstations,
    application servers, and domain controllers, focusing on common staging directories (e.g., C:\Windows\Temp,
    C:\Perflogs, C:\Users\Public, %APPDATA%\Temp, and user Recycle Bins).) and pivot from any hit to the
    creating process, account, the set of files read or aggregated, the resulting archive, and any subsequent
    exfiltration channel.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User workstations, application servers, and domain controllers, focusing on common staging directories
    (e.g., C:\Windows\Temp, C:\Perflogs, C:\Users\Public, %APPDATA%\Temp, and user Recycle Bins).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Rule: Match staging tools and archive indicators\nMATCH proc_create (EID 4688 / Sysmon\
      \ EID 1) OR file_create (Sysmon EID 11) WHERE\n  ( proc_hash IN ti_staging_tool_hashes\n    OR proc_signer\
      \ IN ti_suspicious_signers\n    OR archive_name MATCHES ti_archive_name_patterns\n    OR archive_hash\
      \ IN ti_archive_hashes )\n  AND ( file_path IN staging_dirs  // C:\\Windows\\Temp, C:\\Perflogs,\
      \ C:\\Users\\Public, %APPDATA%\\Temp, Recycle Bin\n        OR preceded_by(sensitive_file_access,\
      \ window=10m) )\nTHEN alert(severity='high', enrich=[proc_hash, signer, archive_path, prior_file_reads])"
