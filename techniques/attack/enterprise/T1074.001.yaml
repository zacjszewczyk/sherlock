name: 'T1074.001: Local Data Staging'
id: e29e4e7a-2a15-4fca-bb2d-415874253c24
description: 'This playbook helps an analyst determine whether an adversary is performing Local Data Staging
  (T1074.001): collecting and consolidating data into a central location or directory on a compromised
  host before exfiltration. It correlates host process telemetry (archiver, copy, and packer execution
  such as 7-Zip, RAR, tar, gzip, zip, ditto, robocopy, and PowerShell Compress-Archive), file-access telemetry
  (Windows EID 4663, Sysmon EID 11, auditd open/execve, macOS unified log, ESXi vmkernel/shell), and network
  file-access telemetry (Zeek smb_files.log / conn.log) to surface staging behavior. Investigative angles
  include: archiver invocation with encryption, anti-forensic, or self-delete flags; recursive discover-copy-archive
  command-line and PowerShell patterns aimed at sensitive directories; a single process reading an anomalously
  high number of unique files across diverse paths followed by a large archive write; high-entropy compressed/encrypted
  artifacts appearing in common staging directories (C:\Windows\Temp, C:\Perflogs, C:\Users\Public, %APPDATA%\Temp,
  /tmp, /mnt, /Users/Shared, /private/tmp, VMFS partitions); access-denied read-failure spikes indicating
  indiscriminate harvesting; and a burst of SMB reads from many distinct shares temporally correlated
  with local archive creation. Detection blends symbolic-logic rules, statistical baselining (fleet-wide
  prevalence, percentiles, Shannon entropy, read-failure ratios, statistical leverage), and machine learning
  (session classifiers, BERT command-line models, LSTM/DeepLog sequence models, autoencoders, and provenance
  graph learning) to produce explainable, evasion-resistant alerts for the Collection tactic.'
type: technique
