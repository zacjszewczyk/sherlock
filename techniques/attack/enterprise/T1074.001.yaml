- question: 'Using a machine-learning model, can you determine whether ''Staging sequence anomaly (DeepLog)''
    indicates local data staging activity? Specifically: Model the per-host command/log-key sequence with
    an LSTM and flag when an observed key (e.g., recursive discovery → robocopy → archive → delete) falls
    outside the top-g predicted next keys or when parameter magnitudes (files touched, output bytes) exceed
    learned norms, per [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf); the predicted-vs-observed
    key and deviating parameter are emitted as the top contributing features.'
