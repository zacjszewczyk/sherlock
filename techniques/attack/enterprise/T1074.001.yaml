- question: 'Using deterministic rule logic, can you determine whether ''Confirm archive entropy floor''
    indicates local data staging activity? Specifically: For any newly written candidate staging file,
    compute byte-level Shannon entropy and confirm a true compressed/encrypted artifact when entropy exceeds
    7.2 bits/byte (tune to >7.0 against your corpus), per [Using Entropy Analysis to Find Encrypted and
    Packed Malware](https://ieeexplore.ieee.org/document/4140989) and [Baseline Payload Entropy Values
    for Common Internet Services](https://www.mdpi.com/1999-5903/16/12/470); native code/text scores 5.0-6.5
    and is suppressed.'
