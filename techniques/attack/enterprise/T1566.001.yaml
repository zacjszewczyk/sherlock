    or sender domain matches a high-confidence threat-intelligence indicator. Profile authentication failure
    rates (SPF fail/softfail, DKIM fail, DMARC misalignment) as a distinct signal. This Machine Learning
    approach works as follows: Deploy a pre-trained classification model (e.g., Random Forest) to score
    sender domains based on first-party features (length, character ratios, n-grams, TLD rarity, first-seen
    recency from internal logs); WHOIS age may be added as an optional enrichment but is not required
    for the primary verdict. Trigger an investigation for domains scoring above a 0.9 probability of being
    malicious, and surface the top-3 contributing features in the alert text. The stylometric/social random-forest
    approach of [Analyzing Social and Stylometric Features](https://arxiv.org/abs/1406.3692) supplies
    complementary per-sender writing-style features. A positive result -- a rule match, statistical outlier,
    or model alert -- is a strong indicator of a spearphishing attachment progressing toward execution
    and callback; pivot to the responsible email (sender, subject, authentication verdicts, attachment
    hash), the recipient and host, the process lineage from the attachment, the command lines involved,
    and any subsequent outbound network connections. A negative result helps reduce suspicion for this
    particular vector but should be corroborated with the other questions in this playbook, since a single
    method can miss obfuscated, low-and-slow, or targeted spearphishing activity.'
  answer_sources:
  - Zeek files.log
  - Zeek smtp.log
  - Zeek intel.log
  - m365:unified
  - 'NAI: Email gateway, network perimeter firewalls, network security monitoring sensors (e.g., Zeek
    sensors at the internet gateway).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [domain_len, char_ratios, ngrams, tld_rarity, first_seen_recency, (whois_age optional)]

      p = RandomForest.predict_proba(features)

      ALERT IF p > 0.9 ; include top-3 contributing features'
- question: '[Initial Access] Implement a SIEM detection rule that triggers on Windows Event ID 4688 when
    the NewProcessName matches a regex for double extensions (e.g., ''.*\.(pdf|docx|xlsx|jpg|zip)\.(exe|scr|bat|ps1)$'')
    AND the process launches from a known email-client temporary directory -- specifically, using the
    Symbolic Logic approach to detect this spearphishing-attachment behavior?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary delivers a malicious
    email attachment to gain an initial foothold, relying on the recipient to open the file so the payload
    can exploit or execute on the host. This evidence focuses on the following condition: A new process
    is created from a file path associated with an email client''s temporary cache (e.g., Outlook''s ''Content.Outlook''
    directory or ~/Downloads), and the process name contains a suspicious double extension (e.g., ''report.pdf.exe'')
    or is a freshly written executable attachment. This Symbolic Logic approach works as follows: Implement
    a SIEM detection rule that triggers on Windows Event ID 4688 (or Sysmon EID 1) when the NewProcessName
    matches a regex for double extensions (e.g., ''.*\.(pdf|docx|xlsx|jpg|zip)\.(exe|scr|bat|ps1)$'')
    AND the process is launched from a known email client temporary directory (e.g., ''C:\Users\*\AppData\Local\Microsoft\Windows\INetCache\Content.Outlook\*''
    or ''*\Downloads\*''). This mirrors the Outlook-execution-from-temp logic encoded in the [SigmaHQ
    Outlook child-process rules](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_office_outlook_susp_child_processes.yml).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator of
    a spearphishing attachment progressing toward execution and callback; pivot to the responsible email
    (sender, subject, authentication verdicts, attachment hash), the recipient and host, the process lineage
    from the attachment, the command lines involved, and any subsequent outbound network connections.
    A negative result helps reduce suspicion for this particular vector but should be corroborated with
    the other questions in this playbook, since a single method can miss obfuscated, low-and-slow, or
    targeted spearphishing activity.'
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon
  - Zeek files.log
  - 'NAI: User workstations, particularly those of executives, finance, and HR personnel who are common
    targets for spearphishing.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM EID4688 OR Sysmon_EID1\nWHERE NewProcessName MATCHES '.*\\.(pdf|docx|xlsx|jpg|zip)\\\
      .(exe|scr|bat|ps1)$'\n  AND ProcessPath LIKE '%\\INetCache\\Content.Outlook\\%' OR '%\\Downloads\\\
      %'\n=> alert (attachment double-extension execution)"
- question: '[Initial Access] For each process creation event, construct a unique identifier from (ParentProcessName,
    NewProcessName, ProcessPath). -- specifically, using the Statistical Method approach to detect this
    spearphishing-attachment behavior?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary delivers a malicious
    email attachment to gain an initial foothold, relying on the recipient to open the file so the payload
    can exploit or execute on the host. This evidence focuses on the following condition: A new process
    is created from a file path associated with an email client''s temporary cache (e.g., Outlook''s ''Content.Outlook''
    directory or ~/Downloads), and the process name contains a suspicious double extension (e.g., ''report.pdf.exe'')
    or is a freshly written executable attachment. This Statistical Method approach works as follows:
    For each process creation event, construct a unique identifier from (ParentProcessName, NewProcessName,
    ProcessPath). Maintain a 30-day rolling baseline of these identifiers across the enterprise. Flag
    any execution whose frequency falls in the 1st percentile (Frequency), indicating a rare execution
    pattern almost never seen before. Profile the failure dimension too: an executable that writes then
    immediately exits, or repeated failed launches, is itself anomalous. A positive result -- a rule match,
    statistical outlier, or model alert -- is a strong indicator of a spearphishing attachment progressing
    toward execution and callback; pivot to the responsible email (sender, subject, authentication verdicts,
    attachment hash), the recipient and host, the process lineage from the attachment, the command lines
    involved, and any subsequent outbound network connections. A negative result helps reduce suspicion
    for this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss obfuscated, low-and-slow, or targeted spearphishing activity.'
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon
  - Zeek files.log
  - 'NAI: User workstations, particularly those of executives, finance, and HR personnel who are common
    targets for spearphishing.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'id = (ParentProcessName, NewProcessName, ProcessPath)

      baseline 30d rolling count(id) across enterprise

      FLAG IF percentile_rank(count(id)) <= 1

      also FLAG write-then-immediate-exit or repeated failed launches'
