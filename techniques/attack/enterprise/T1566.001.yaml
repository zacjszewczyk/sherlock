- question: '[Initial Access] Deploy SIEM rules to scan command lines in Event ID 4688 and PowerShell
    script blocks in Event ID 4104 using regular expressions for patterns like ''DownloadString'', ''FromBase64String'',
    ''IEX'', ''-EncodedCommand'', and ''mshta.exe http'' -- specifically, using the Symbolic Logic approach
    to detect this spearphishing-attachment behavior?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary delivers a malicious
    email attachment to gain an initial foothold, relying on the recipient to open the file so the payload
    can exploit or execute on the host. This evidence focuses on the following condition: The command
    line arguments for a newly created process, particularly a script host like powershell.exe or cmd.exe,
    contain high-entropy strings indicative of Base64 encoding or specific keywords associated with download
    cradles (e.g., ''DownloadString'', ''Invoke-Expression''). Profile resulting download success/failure
    (HTTP 200 vs 404/blocked, NXDOMAIN) as a distinct signal. This Symbolic Logic approach works as follows:
    Deploy SIEM rules to scan command lines in Event ID 4688 and PowerShell script blocks in Event ID
    4104 using regular expressions for patterns like ''DownloadString'', ''FromBase64String'', ''IEX'',
    ''-EncodedCommand'', and ''mshta.exe http''. Generate a high-severity alert on any match, escalating
    when the parent is an Office/mail process as in the [SigmaHQ Outlook child-process rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_office_outlook_susp_child_processes.yml).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator of
    a spearphishing attachment progressing toward execution and callback; pivot to the responsible email
    (sender, subject, authentication verdicts, attachment hash), the recipient and host, the process lineage
    from the attachment, the command lines involved, and any subsequent outbound network connections.
    A negative result helps reduce suspicion for this particular vector but should be corroborated with
    the other questions in this playbook, since a single method can miss obfuscated, low-and-slow, or
    targeted spearphishing activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: User workstations, VDI environments, terminal servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM EID4688.CommandLine OR EID4104.ScriptBlock

      WHERE matches ANY(''DownloadString'',''FromBase64String'',''IEX'',''-EncodedCommand'',''mshta.exe
      http'')

      => HIGH alert ; escalate IF parent IN {office,mail process}'
