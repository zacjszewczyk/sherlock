questions:
- question: '[Initial Access] Continuously match file hashes from Zeek files.log and sender IP addresses/domains
    from smtp.log against a high-confidence threat intelligence list loaded into Zeek''s Intelligence
    Framework. -- specifically, using the Symbolic Logic approach to detect this spearphishing-attachment
    behavior?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary delivers a malicious
    email attachment to gain an initial foothold, relying on the recipient to open the file so the payload
    can exploit or execute on the host. This evidence focuses on the following condition: An inbound attachment-bearing
    email fails sender authentication or alignment, or carries an attachment whose file hash, sender IP,
    or sender domain matches a high-confidence threat-intelligence indicator. Profile authentication failure
    rates (SPF fail/softfail, DKIM fail, DMARC misalignment) as a distinct signal. This Symbolic Logic
    approach works as follows: Continuously match file hashes from Zeek files.log and sender IP addresses/domains
    from smtp.log against a high-confidence threat intelligence list loaded into Zeek''s Intelligence
    Framework. Generate a critical alert upon a match being recorded in intel.log. A positive result --
    a rule match, statistical outlier, or model alert -- is a strong indicator of a spearphishing attachment
    progressing toward execution and callback; pivot to the responsible email (sender, subject, authentication
    verdicts, attachment hash), the recipient and host, the process lineage from the attachment, the command
    lines involved, and any subsequent outbound network connections. A negative result helps reduce suspicion
    for this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss obfuscated, low-and-slow, or targeted spearphishing activity.'
  answer_sources:
  - Zeek files.log
  - Zeek smtp.log
  - Zeek intel.log
  - m365:unified
  - 'NAI: Email gateway, network perimeter firewalls, network security monitoring sensors (e.g., Zeek
    sensors at the internet gateway).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "Zeek Intelligence Framework:\n  load high-confidence TI (file hashes, sender IPs, sender domains)\n\
      MATCH files.log.sha256 IN TI.file_hashes\n   OR smtp.log.id.orig_h IN TI.ips\n   OR domain(smtp.log.mailfrom)\
      \ IN TI.domains\n=> write intel.log AND raise CRITICAL alert"
- question: '[Initial Access] Enforce and alert on email-authentication verdicts as the deterministic
    floor before trusting any attachment-bearing sender. -- specifically, using the Symbolic Logic approach
    to detect this spearphishing-attachment behavior?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary delivers a malicious
    email attachment to gain an initial foothold, relying on the recipient to open the file so the payload
    can exploit or execute on the host. This evidence focuses on the following condition: An inbound attachment-bearing
    email fails sender authentication or alignment, or carries an attachment whose file hash, sender IP,
    or sender domain matches a high-confidence threat-intelligence indicator. Profile authentication failure
    rates (SPF fail/softfail, DKIM fail, DMARC misalignment) as a distinct signal. This Symbolic Logic
    approach works as follows: Enforce and alert on email-authentication verdicts as the deterministic
    floor: flag any inbound mail with an attachment where SPF returns fail/softfail per [RFC 7208 (SPF)](https://www.rfc-editor.org/rfc/rfc7208),
    DKIM fails, or the visible RFC5322.From domain is not DMARC-aligned per [RFC 7489 (DMARC)](https://www.rfc-editor.org/rfc/rfc7489).
    Because parsing inconsistencies let attackers bypass a passing verdict, additionally re-parse/normalize
    headers and alert on multiple/ambiguous From headers and RFC5321-vs-RFC5322 mismatches as shown in
    [Composition Kills](https://www.usenix.org/conference/usenixsecurity20/presentation/chen-jianjun),
    and treat a passing verdict as necessary-but-not-sufficient given that providers still deliver spoofed
    mail to the inbox per [End-to-End Measurements of Email Spoofing](https://www.usenix.org/conference/usenixsecurity18/presentation/hu).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator of
    a spearphishing attachment progressing toward execution and callback; pivot to the responsible email
    (sender, subject, authentication verdicts, attachment hash), the recipient and host, the process lineage
    from the attachment, the command lines involved, and any subsequent outbound network connections.
    A negative result helps reduce suspicion for this particular vector but should be corroborated with
    the other questions in this playbook, since a single method can miss obfuscated, low-and-slow, or
    targeted spearphishing activity.'
  answer_sources:
  - Zeek files.log
  - Zeek smtp.log
  - Zeek intel.log
  - m365:unified
  - 'NAI: Email gateway, network perimeter firewalls, network security monitoring sensors (e.g., Zeek
    sensors at the internet gateway).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM inbound_mail WHERE has_attachment=true\nFLAG IF spf IN ('fail','softfail')\n     OR dkim='fail'\n\
      \     OR dmarc_aligned=false\n     OR count(distinct From_headers) > 1\n     OR RFC5321.MailFrom_domain\
      \ != RFC5322.From_domain\n=> alert (auth verdict necessary-but-not-sufficient)"
- question: '[Initial Access] For each sender domain in smtp.log, calculate its historical sending frequency
    to the organization over the last 90 days. -- specifically, using the Statistical Method approach
    to detect this spearphishing-attachment behavior?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary delivers a malicious
    email attachment to gain an initial foothold, relying on the recipient to open the file so the payload
    can exploit or execute on the host. This evidence focuses on the following condition: An inbound attachment-bearing
    email fails sender authentication or alignment, or carries an attachment whose file hash, sender IP,
    or sender domain matches a high-confidence threat-intelligence indicator. Profile authentication failure
    rates (SPF fail/softfail, DKIM fail, DMARC misalignment) as a distinct signal. This Statistical Method
    approach works as follows: For each sender domain in smtp.log, calculate its historical sending frequency
    to the organization over the last 90 days (Volume/Frequency). Calculate the Shannon entropy of the
    subdomain structure. Flag any domain that falls into the bottom 5th percentile of frequency and the
    top 10th percentile of subdomain entropy, indicating it is both rare and structurally random. Weight
    the score upward for recipients in high-risk roles (executives, finance, HR) and during temporally
    clustered bursts, both shown to differentiate targeting risk in [Who is Targeted by Email-Based Phishing
    and Malware?](https://research.google/pubs/who-is-targeted-by-email-based-phishing-and-malware-measuring-factors-that-differentiate-risk/).
    Derive percentile cutoffs per-tenant from your own 90-day baseline. A positive result -- a rule match,
    statistical outlier, or model alert -- is a strong indicator of a spearphishing attachment progressing
    toward execution and callback; pivot to the responsible email (sender, subject, authentication verdicts,
    attachment hash), the recipient and host, the process lineage from the attachment, the command lines
    involved, and any subsequent outbound network connections. A negative result helps reduce suspicion
    for this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss obfuscated, low-and-slow, or targeted spearphishing activity.'
  answer_sources:
  - Zeek files.log
  - Zeek smtp.log
  - Zeek intel.log
  - m365:unified
  - 'NAI: Email gateway, network perimeter firewalls, network security monitoring sensors (e.g., Zeek
    sensors at the internet gateway).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per sender_domain over 90d: count(emails), shannon_entropy(subdomain)

      freq_pct = percentile_rank(sender_domain.count)

      ent_pct  = percentile_rank(sender_domain.subdomain_entropy)

      FLAG IF freq_pct <= 5 AND ent_pct >= 90

      score *= weight(recipient_role IN {exec,finance,hr}) * burst_factor'
- question: '[Initial Access] Score an unknown attachment-bearing sender with Directed Anomaly Scoring
    (DAS) over impersonation features computed from first-party mail logs. -- specifically, using the
    Statistical Method approach to detect this spearphishing-attachment behavior?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary delivers a malicious
    email attachment to gain an initial foothold, relying on the recipient to open the file so the payload
    can exploit or execute on the host. This evidence focuses on the following condition: An inbound attachment-bearing
    email fails sender authentication or alignment, or carries an attachment whose file hash, sender IP,
    or sender domain matches a high-confidence threat-intelligence indicator. Profile authentication failure
    rates (SPF fail/softfail, DKIM fail, DMARC misalignment) as a distinct signal. This Statistical Method
    approach works as follows: Score an unknown attachment-bearing sender with Directed Anomaly Scoring
    (DAS) over impersonation features computed entirely from first-party SMTP logs as in [Detecting Credential
    Spearphishing Attacks in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho):
    a known display name paired with a never-before-seen From address (name spoofing), a previously-unknown
    sender domain, and a first-time sender-recipient pair. DAS ranks events more suspicious than all benign
    events along these axes and emits a fixed daily alert budget (~10/day) rather than a fixed threshold,
    making volume tunable to analyst capacity. A positive result -- a rule match, statistical outlier,
    or model alert -- is a strong indicator of a spearphishing attachment progressing toward execution
    and callback; pivot to the responsible email (sender, subject, authentication verdicts, attachment
    hash), the recipient and host, the process lineage from the attachment, the command lines involved,
    and any subsequent outbound network connections. A negative result helps reduce suspicion for this
    particular vector but should be corroborated with the other questions in this playbook, since a single
    method can miss obfuscated, low-and-slow, or targeted spearphishing activity.'
  answer_sources:
  - Zeek files.log
  - Zeek smtp.log
  - Zeek intel.log
  - m365:unified
  - 'NAI: Email gateway, network perimeter firewalls, network security monitoring sensors (e.g., Zeek
    sensors at the internet gateway).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each unknown attachment-bearing sender:\n  f1 = known_display_name AND new_from_address\
      \   # name spoofing\n  f2 = sender_domain never_seen_before\n  f3 = (sender,recipient) first_time_pair\n\
      DAS_rank events more suspicious than all benign along f1..f3\nemit top ~10/day by rank as alerts"
- question: '[Initial Access] Deploy a pre-trained classification model (e.g., Random Forest) to score
    sender domains based on features like length, character ratios, n-grams, age (via WHOIS lookup), and
    TLD rarity. -- specifically, using the Machine Learning approach to detect this spearphishing-attachment
    behavior?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary delivers a malicious
    email attachment to gain an initial foothold, relying on the recipient to open the file so the payload
    can exploit or execute on the host. This evidence focuses on the following condition: An inbound attachment-bearing
