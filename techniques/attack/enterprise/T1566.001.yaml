name: 'T1566.001: Spearphishing Attachment'
id: 86d7b4f5-1955-4fed-9a81-dadc0be05135
description: 'This playbook helps an analyst investigate whether a sophisticated external actor, commodity
  malware operator, or insider used a spearphishing email carrying a malicious attachment to gain initial
  access to the network (the Initial Access tactic). Spearphishing Attachment relies on socially engineered
  email to deliver a weaponized file -- Office documents, PDFs, executables, scripts, or archives -- that
  the recipient is persuaded to open, after which the payload exploits a vulnerability or executes directly,
  usually via User Execution. The hunt spans the full delivery-to-execution-to-callback chain: inbound
  email metadata and authentication verdicts (SPF/DKIM/DMARC) at the mail gateway and Zeek SMTP sensors;
  attachment file writes into email-client temporary caches and Downloads folders; abnormal process execution
  where Office, PDF viewers, or mail clients spawn shells and scripting hosts; obfuscated command lines
  and PowerShell script blocks bearing download cradles; and rapid post-delivery outbound connections
  or low-jitter beaconing to newly seen or threat-intel-flagged infrastructure. Detection methods combine
  symbolic-logic rules, statistical baselining/anomaly scoring, and machine-learning models applied across
  Windows Event ID 4688/4104, Sysmon, auditd, macOS unified logs, and Zeek smtp/files/conn/dns/intel logs,
  so the analyst can corroborate suspected spearphishing against sender reputation, file reputation, process
  lineage, command-line content, and downstream network callbacks.'
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
