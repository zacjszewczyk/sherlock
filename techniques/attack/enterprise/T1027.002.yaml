name: 'T1027.002: Obfuscated Files or Information: Software Packing'
id: 4f394827-3716-46bd-98ec-8fcd356fb230
description: Investigate adversary use of software packing and virtual-machine software protection to
  conceal malicious executables and evade signature-based detection. This playbook helps an analyst move
  from a static packing indicator on an executable (PE, ELF, or Mach-O) to corroborating runtime evidence
  of in-memory unpacking and post-unpack malicious activity. It covers matching known malicious packed-sample
  hashes and named-packer signatures (UPX, MPRESS, ASPack, Themida, VMProtect), applying deterministic
  PE/ELF/Mach-O structural rules (writable+executable sections, abnormal entry points, sparse imports,
  anomalous section layouts), computing whole-file and per-section Shannon entropy against host-role baselines
  to localize high-entropy overlays, profiling rare section names and signer/prevalence drift, and using
  supervised and unsupervised machine learning over static PE features. It then correlates packed-binary
  detections with runtime unpacking primitives (RWX memory allocation, mprotect/VirtualProtect to executable,
  execution from non-image memory), suspicious child interpreters, and beacon-like outbound traffic. Because
  packing is also common in legitimate installers and protected commercial software, the playbook emphasizes
  corroboration with prevalence, signer reputation, and host-role context to control false positives.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
