name: 'T1498.002: Reflection Amplification'
id: 9739d75a-1149-40cb-be55-1c934b94f8dc
description: 'This playbook helps an analyst investigate whether an adversary is conducting a reflection-amplification
  denial-of-service attack (T1498.002) under the Impact tactic, in which spoofed-source requests are sent
  to open third-party reflectors (DNS, NTP, SNMP, SSDP, CharGen, memcached) so that outsized responses
  flood and degrade a victim''s network availability. It guides the hunt across several complementary
  angles at the internet gateway, DMZ firewalls, and public-facing DNS/NTP/Memcached servers: inbound
  UDP from known open-reflector/open-resolver watchlists and outbound spoofed targeting that violates
  BCP 38 ingress/egress filtering; high-amplification request types such as DNS ''ANY'', NTP mode-7 monlist,
  SNMP GetBulk, SSDP/CharGen, and memcached stats/get from non-allowlisted sources; multi-sigma excursions
  in inbound bytes/packets per second on amplifier ports; amplification-factor (response/request byte
  ratio) outliers beyond per-protocol ceilings; and Shannon-entropy spikes of converging source IPs coincident
  with volumetric increases. Detection methods combine symbolic-logic rules (watchlists, protocol-illegal-traffic
  and hard volume thresholds), statistical baselining (percentile/sigma excursions, CUSUM/PELT change-points,
  IQR outliers, entropy correlation, blocked/dropped state signals), and machine learning (Random Forest/XGBoost
  classifiers with SHAP attribution, Isolation Forest/One-Class SVM, K-Means/DBSCAN clustering, and ARIMA/Prophet/KitNET
  forecasting) applied to Zeek conn/dns/ntp/snmp logs, firewall and NSM:Flow records, so the analyst can
  corroborate suspected reflection floods against spoofing evidence, request anomalies, traffic volume,
  amplification ratios, and source dispersion.'
type: technique
