questions:
- question: '[Impact] Alert on reflector watchlist hits: Can you determine whether a flow of at least
    10 connections per minute over a 5-minute period of inbound UDP traffic on ports 53, 123, 161, 1900,
    19, or 11211 where the source IP address is present on a threat-intelligence/scan list of known open
    reflectors or open resolvers, OR an internal host emitting outbound UDP to those ports against a large
    set of external IPs. -- specifically, using the ''Alert on reflector watchlist hits'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary abuses third-party reflectors/amplifiers
    — spoofing the victim''s source address toward open DNS, NTP, SNMP, SSDP, CharGen, or memcached services
    so that disproportionately large responses flood and degrade the target''s availability. This evidence
    focuses on the condition that a flow of at least 10 connections per minute over a 5-minute period
    of inbound UDP traffic on ports 53, 123, 161, 1900, 19, or 11211 where the source IP address is present
    on a threat-intelligence/scan list of known open reflectors or open resolvers, OR an internal host
    emitting outbound UDP to those ports against a large set of external IPs. This Symbolic Logic approach
    looks for the following signal: Ingest CTI/scan-derived lists of open reflectors and open resolvers
    and alert when Zeek conn.log shows inbound connections from those IPs to UDP ports 53, 123, 161, 1900,
    19, or 11211; reflector/open-resolver populations and their abuse are characterized in [Exit from
    Hell? Reducing the Impact of Amplification DDoS Attacks](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-kuhrer.pdf)
    and [The DDoS That Almost Broke the Internet](https://blog.cloudflare.com/the-ddos-that-almost-broke-the-internet/).
    A positive result -- a rule match, statistical excursion, or model alert -- indicates traffic consistent
    with a reflection-amplification flood (spoofed sources, abnormal amplifier-port volume, or outsized
    response-to-request ratios); pivot to the offending source/destination IPs and ASNs, the amplifier
    service and port, the amplification factor, concurrent firewall drops, and whether an internal host
    is the reflector target or the spoofing origin. A negative result helps rule out this reflection vector
    for the window examined but should be corroborated with the other questions in this playbook, since
    a single method can miss low-and-slow, distributed, or multi-protocol amplification activity.'
  answer_sources: &id001
  - Zeek conn.log
  - Firewall
  - NSM:Flow
  - 'NAI: Internet Gateway, DMZ Firewalls, Public-facing DNS/NTP/Memcached Servers'
  range: Last 90 days (correlate over 1-5 minute windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Alert on reflector watchlist hits

      source IN [Zeek conn.log, Firewall, NSM:Flow]

      | WHERE matches_action_criteria("Alert on reflector watchlist hits")

      // Ingest CTI/scan-derived lists of open reflectors and open resolvers and alert when Zeek conn.log
      shows inbound connections from th

      | ALERT enrich(src_ip, dst_ip, src_asn, amplifier_port, proto, amp_factor, dropped)'
  - technology: Zeek/pseudocode
    query: '# Reflection-amplification flow analysis

      conn.log, dns.log, ntp.log, snmp.log

      | FILTER proto=udp && id.resp_p IN [19,53,123,161,1900,11211]

      | AGG conns, orig_bytes, resp_bytes, amp_factor=resp_ip_bytes/orig_ip_bytes, uniq(src), uniq(dst)
      per (id.resp_p, time-window)

      | flag spoofed/over-amplified/over-volume sessions per action criteria'
- question: '[Impact] Detect outbound spoofed reflector targeting: Can you determine whether a flow of
    at least 10 connections per minute over a 5-minute period of inbound UDP traffic on ports 53, 123,
    161, 1900, 19, or 11211 where the source IP address is present on a threat-intelligence/scan list
