questions:
- question: 'Using a symbolic logic approach (''Template DLL IOC correlation''), can you determine whether
    this activity reflects Microsoft Office "Office Test" persistence (T1137.002)? Specifically: Correlate
    the DLL path written under ''...\Office test\Special\Perf'' (Sysmon Event ID 13) with the file-create
    hash (Event ID 11) and the Office image-load (Event ID 7); alert when the loaded DLL is unsigned,
    signed by a non-Microsoft/non-allowlisted publisher, resides in a user-writable path (%APPDATA%, %TEMP%,
    C:\PerfLogs, C:\ProgramData), or matches a TI hash. Office performs no signature/path validation on
    this DLL ([Hexacorn](https://www.hexacorn.com/blog/2014/04/16/beyond-good-ol-run-key-part-10/); [Unit
    42](https://unit42.paloaltonetworks.com/unit42-technical-walkthrough-office-test-persistence-method-used-in-recent-sofacy-attacks/)).
    Use Sysmon Event ID 7 SignatureStatus as the first-party trust source ([Sysmon](https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon)).'
  context: 'Tactic context (Persistence): the adversary is trying to maintain a foothold by abusing the
    Office Test Registry key, which auto-loads an attacker-specified DLL into Office processes at startup
    without requiring macros. Evidence under investigation: A DLL file written to the path specified in
    the ''...Office test\Special\Perf'' registry value lacks a valid Authenticode signature, is signed
    by a publisher not on an organizational allowlist, or has a hash that matches known-malicious indicators.
    Approach (''Template DLL IOC correlation'', Symbolic Logic): Correlate the DLL path written under
    ''...\Office test\Special\Perf'' (Sysmon Event ID 13) with the file-create hash (Event ID 11) and
    the Office image-load (Event ID 7); alert when the loaded DLL is unsigned, signed by a non-Microsoft/non-allowlisted
    publisher, resides in a user-writable path (%APPDATA%, %TEMP%, C:\PerfLogs, C:\ProgramData), or matches
    a TI hash. Office performs no signature/path validation on this DLL ([Hexacorn](https://www.hexacorn.com/blog/2014/04/16/beyond-good-ol-run-key-part-10/);
    [Unit 42](https://unit42.paloaltonetworks.com/unit42-technical-walkthrough-office-test-persistence-method-used-in-recent-sofacy-attacks/)).
    Use Sysmon Event ID 7 SignatureStatus as the first-party trust source ([Sysmon](https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon)).
    A positive result indicates likely abuse of the Office Test key for persistent code execution and
    warrants triage of the referenced DLL, the writing process lineage, and any resulting network activity;
    a negative result helps rule out this persistence mechanism on the host. Pivot across registry, file,
    module-load, process, and network telemetry to confirm the full persistence chain.'
