name: 'T1137.002: Office Test'
id: 0f8396a6-f929-40c8-86c2-230b84cf8fd9
description: This playbook helps an analyst investigate Microsoft Office "Office Test" persistence (T1137.002),
  in which an adversary creates the 'Office test\Special\Perf' Registry key (under HKCU or HKLM) and points
  it at an arbitrary DLL that Office auto-loads into its process memory every time an application such
  as Word, Excel, PowerPoint, or Outlook starts. This key is never created by a normal Office installation,
  so its mere presence is a strong persistence indicator, and the technique requires no macro enablement,
  bypassing traditional macro defenses. The playbook correlates registry-modification telemetry (Sysmon
  Event ID 12/13/14, Windows Event ID 4657), file-creation and module-load events (Sysmon Event ID 11
  and 7), process-creation lineage (Sysmon Event ID 1, Windows Event ID 4688), and network telemetry (Sysmon
  Event ID 3, Zeek conn.log/dns.log) to surface the full write -> DLL load -> Office process execution
  -> outbound connection chain. Investigative angles include validating the referenced DLL's Authenticode
  signature, path, and reputation; baselining registry-write rarity and the identity of the writing process
  (interactive shells and script interpreters are never legitimate writers of this key); profiling Office
  applications spawning anomalous child processes and beaconing to low-reputation or newly registered
  domains; and scoring the structurally rare persistence subgraph. Detection blends symbolic-logic rules,
  statistical baselining (prevalence/rarity scoring, entropy, frequency analysis), and machine learning
  (PE static classifiers, LSTM/Isolation Forest registry models, provenance-graph anomaly detection) to
  produce explainable, evasion-resistant alerts for the Persistence tactic.
