  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary exploits weak file or
    directory permissions on installer or service binaries to overwrite a trusted executable with malicious
    code, which a legitimate (often elevated) process then loads and runs -- achieving execution, privilege
    escalation to High/SYSTEM, persistence, or stealthy blending with normal installer/service activity.
