- question: '[Stealth] Detect modified signed executables: Can you determine whether a file write event
    modifies a known, digitally signed executable in a protected directory (e.g., C:\Program Files\, C:\Windows\System32),
    and the new file''s signature is invalid, absent, or from an untrusted publisher. -- specifically,
    using the ''Detect modified signed executables'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary exploits weak file or directory
    permissions on installer or service binaries to overwrite a trusted executable with malicious code,
    which a legitimate (often elevated) process then loads and runs -- achieving execution, privilege
    escalation to High/SYSTEM, persistence, or stealthy blending with normal installer/service activity.
    This evidence focuses on the condition that a file write event modifies a known, digitally signed
    executable in a protected directory (e.g., C:\Program Files\, C:\Windows\System32), and the new file''s
    signature is invalid, absent, or from an untrusted publisher. This Symbolic Logic approach works as
    follows: Join Sysmon Event 11 (File Create/Overwrite), Event 25 (Process Tampering / image replaced),
    and Event 7 (Image Load) or 15 (FileCreateStreamHash) to detect when a file in a protected path is
    modified, and trigger if the subsequent image load shows an Invalid or Missing signature ([Detecting
    Process Injection Attacks with Wazuh](https://wazuh.com/blog/detecting-process-injection-attacks-with-wazuh/));
    signature mismatch on a previously-signed binary in a protected directory is a catalogued replacement
    indicator ([4 Ways Adversaries Hijack DLLs](https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/)).
    A positive result -- a rule match, statistical outlier, or model alert -- is consistent with installer/service
