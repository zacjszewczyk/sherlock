    This evidence focuses on the condition that a file is written to an executable path (.exe, .dll) by
    a process running with a Low or Medium integrity level, and within a short time window that same executable
    is executed by a new process running with a High or System integrity level. This Symbolic Logic approach
    works as follows: Trigger when a file creation event (Sysmon Event 11) for an executable, initiated
    by a process with IntegrityLevel Medium or Low, is followed within 5 minutes by a process creation
    event (Sysmon Event 1) for the same file path where the new process has IntegrityLevel High or System.
