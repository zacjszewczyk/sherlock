- question: '[Stealth] Flag child command lines with high entropy: Can you determine whether a file write
    or creation/overwrite event targeting a registered service''s executable path occurs within 60 seconds
    of a service start event, followed by the service process spawning an anomalous child process. Profile
    failed write attempts (Event ID 4663 access-denied) on service paths as a distinct precursor signal.
    -- specifically, using the ''Flag child command lines with high entropy'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary exploits weak file or directory
    permissions on installer or service binaries to overwrite a trusted executable with malicious code,
    which a legitimate (often elevated) process then loads and runs -- achieving execution, privilege
    escalation to High/SYSTEM, persistence, or stealthy blending with normal installer/service activity.
    This evidence focuses on the condition that a file write or creation/overwrite event targeting a registered
    service''s executable path occurs within 60 seconds of a service start event, followed by the service
    process spawning an anomalous child process. Profile failed write attempts (Event ID 4663 access-denied)
    on service paths as a distinct precursor signal. This Statistical Method approach works as follows:
    For each service process, establish a statistical baseline of its legitimate child processes and their
    command-line arguments. Calculate the Shannon entropy of command lines for any newly observed child
    processes and generate an alert if a service spawns a child with command-line entropy above the 95th
    percentile for that parent service (obfuscation), OR if the child image is in the bottom 1st percentile
    of fleet prevalence ([Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)).
    Track State/Failure: a spike in Event ID 4663 write-access-denied attempts on the service path (Frequency:
    >3/min) preceding a successful write is a strong precursor ([What''s the deal with prevalence?](https://blog.f-secure.com/whats-the-deal-with-prevalence/)).
    A positive result -- a rule match, statistical outlier, or model alert -- is consistent with installer/service
    file-permission abuse; pivot to the responsible writing process and its parent lineage, the targeted
    binary''s path and signature status, the integrity level and user context of the executing process,
    any preceding access-denied (4663) write attempts, and any follow-on child processes or network connections.
    A negative result helps rule out this particular vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, living-off-the-land, or allow-listed-abuse
    activity.'
