- question: '[Stealth] Alert on service networking or shell spawns to TI: Can you determine whether a
    service process, whose executable was recently modified, spawns a rare child process or initiates
    an external network connection inconsistent with its established baseline behavior. Blocked/failed
    outbound connections from the service are profiled as a distinct signal. -- specifically, using the
    ''Alert on service networking or shell spawns to TI'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary exploits weak file or directory
    permissions on installer or service binaries to overwrite a trusted executable with malicious code,
    which a legitimate (often elevated) process then loads and runs -- achieving execution, privilege
    escalation to High/SYSTEM, persistence, or stealthy blending with normal installer/service activity.
    This evidence focuses on the condition that a service process, whose executable was recently modified,
    spawns a rare child process or initiates an external network connection inconsistent with its established
    baseline behavior. Blocked/failed outbound connections from the service are profiled as a distinct
    signal. This Symbolic Logic approach works as follows: Alert when a process associated with a Windows
    Service spawns a known command shell (cmd.exe, powershell.exe) or initiates a Sysmon Event 3 connection
    to an IP/domain on a threat-intelligence feed. Combine with parentage allow-listing: a service host
    with an unexpected parent or child image is high-fidelity ([Unusual Parent-Child Relationship](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/)).
    A positive result -- a rule match, statistical outlier, or model alert -- is consistent with installer/service
