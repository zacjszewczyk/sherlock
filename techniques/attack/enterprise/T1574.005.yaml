- question: '[Stealth] Flag service network deviations with z-scores: Can you determine whether a service
    process, whose executable was recently modified, spawns a rare child process or initiates an external
    network connection inconsistent with its established baseline behavior. Blocked/failed outbound connections
    from the service are profiled as a distinct signal. -- specifically, using the ''Flag service network
    deviations with z-scores'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary exploits weak file or directory
