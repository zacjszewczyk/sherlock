name: 'T1574.005: Hijack Execution Flow: Executable Installer File Permissions Weakness'
id: 5386ce62-1381-4537-83af-ed22bf010349
description: 'This playbook helps an analyst investigate whether an adversary is hijacking the execution
  flow of installers and Windows services by abusing weak file or directory permissions (T1574.005). Many
  installers and self-extracting packages unpack binaries (EXEs, DLLs) into world-writable subdirectories
  of %TEMP%, %APPDATA%, C:\ProgramData, or Program Files installer paths without restricting write access.
  An adversary can overwrite or plant a binary that a legitimate, often elevated, process then loads and
  executes -- yielding code execution at the original process''s integrity level, frequently High or SYSTEM.
  The same weakness applies to service executables whose paths or directories are writable, enabling persistence
  and privilege escalation, and it is closely related to DLL search-order hijacking and UAC bypass. Across
  the Stealth and Execution tactics, this playbook guides the analyst through several behavioral angles:
  file writes/overwrites to service or protected executable paths immediately followed by service starts
  and anomalous child processes; low/medium-integrity processes writing executables that are then run
  by high/SYSTEM-integrity processes; SYSTEM processes executing from user-writable or temp directories;
  modification of previously-signed binaries in protected directories so the new image is unsigned or
  signed by an untrusted publisher; core service hosts (services.exe, svchost.exe) spawning command interpreters
  or scripting engines; and service processes making rare or threat-intel-matched network connections.
  Detection methods combine symbolic-logic correlation rules, statistical baselining/prevalence and entropy
  analysis, and machine-learning models (sequence/LSTM autoencoders, DBSCAN clustering, Random Forest/XGBoost
  classifiers, time-series forecasting, and provenance-graph anomaly detection) applied to Windows Security
  events (4663, 4688, 7036), Sysmon (Events 1, 3, 7, 11, 15, 25), and Zeek conn.log, so the analyst can
  corroborate suspected installer/service file-permission abuse against file activity, process lineage,
  integrity levels, signature status, and network behavior.'
type: technique
