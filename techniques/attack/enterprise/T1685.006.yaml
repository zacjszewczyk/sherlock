name: 'T1685.006: Disable or Modify Tools: Clear Linux or Mac System Logs'
id: fd175d9a-9ce2-4761-b6eb-2e07e993375e
description: 'Investigate whether an adversary is clearing or tampering with system logs on Linux or macOS
  endpoints to hide evidence of an intrusion (T1685.006). This playbook helps an analyst hunt for destructive
  or suppressive activity against host logging, including: execution of known log-clearing utilities and
  shell operators that truncate, delete, overwrite, or vacuum logs under /var/log/, journald archives,
  and the macOS Unified Log; deletion, rename, or truncation of critical log files (messages, syslog,
  auth.log, secure, wtmp/btmp/utmp, cron, audit/audit.log) and shell history by processes outside a benign
  log-management allowlist; privileged commands that stop or reconfigure logging services such as auditd,
  rsyslog, syslogd, or the macOS logging subsystem; and the conspicuous absence of expected log-file activity
  (a sudden collapse or silence) while the host remains active on the network per Zeek conn.log. It combines
  symbolic-logic signatures, statistical prevalence/frequency/entropy baselining, and machine-learning
  sequence, time-series, and provenance-graph models to surface log-tampering with explainable, triage-ready
  evidence.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any process execute a known log-clearing utility or command pattern targeting host log
    stores on a Linux or macOS endpoint?
  context: 'Defense Impairment (TA0112): Adversaries clear system logs to hide intrusion evidence. Continuously
    query Sysmon for Linux Event ID 1, auditd execve, and macOS Unified Log/ESF process records for process
    names, paths, and command lines associated with log clearing such as `cat /dev/null >`, `rm /var/log/`,
    `truncate -s 0`, `shred`, `journalctl --vacuum-time=`/`--vacuum-size=`, and macOS `log erase --all`.
    A critical alert should fire when a command matches a known destructive or suppressive pattern against
    a real log target rather than a benign administrative path. A positive match strongly indicates an
    attempt to destroy forensic evidence; tie the executing user, parent process, and host role into triage.
    Equivalent vendor-agnostic logic is published as a Sigma rule ([Linux Logs Clearing Attempts, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_clear_logs.yml)),
    and this telemetry is best collected from a first-party eBPF sensor ([Sysmon for Linux](https://github.com/Sysinternals/SysmonForLinux)).'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: All Linux and macOS endpoints, particularly servers with critical roles (e.g., web, database,
    authentication) and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (sysmon_linux_eid1, auditd_execve, macos_unifiedlog_process)

      | where command_line matches /(cat\s+\/dev\/null\s*>|rm\s+.*\/var\/log\/|truncate\s+-s\s*0|shred\b|journalctl\s+--vacuum-(time|size)=|log\s+erase(\s+--all)?)/

      | where target_path matches /\/var\/log\// OR command_line contains ''log erase''

      | alert severity=critical'
- question: Was a curated system log file deleted or truncated by a process that is NOT on the benign
    log-management allowlist?
  context: 'Defense Impairment (TA0112): Legitimate log churn comes from a small set of utilities (logrotate,
    gzip, dockerd, journald). On file-deletion/truncation telemetry (Sysmon for Linux EID 23/26, auditd
    unlink/truncate, macOS ESF), alert when the target matches curated log files (/var/log/{messages,syslog,auth.log,secure,wtmp,btmp,cron,audit/audit.log})
    AND the initiating process is NOT on the benign allowlist. This allow/deny plus benign-process exclusion
    design mirrors Elastic''s [System Log File Deletion, Elastic](https://github.com/elastic/detection-rules/blob/main/rules/linux/defense_evasion_log_files_deleted.toml)
    rule. A positive result (deletion by an unexpected process) is high-fidelity evidence of anti-forensic
    activity; a deletion by an allowlisted rotation/maintenance process is expected and benign.'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: All Linux and macOS endpoints, particularly servers with critical roles (e.g., web, database,
    authentication) and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (sysmon_linux_eid23, sysmon_linux_eid26, auditd_unlink, auditd_truncate, macos_esf)

      | where target_path matches /\/var\/log\/(messages|syslog|auth\.log|secure|wtmp|btmp|cron|audit\/audit\.log)/

      | where process_name NOT IN (logrotate, gzip, dockerd, journald, systemd-journald)

      | alert severity=high'
- question: Is a command, binary, or file hash that touches log files or logging services rare across
    the enterprise fleet and absent from approved software inventory?
  context: 'Defense Impairment (TA0112): The overwhelming majority of real threats are population-rare.
    For all executed commands, process paths, and file hashes, compute enterprise-wide prevalence by distinct-host
    count and isolate those present on a small number of systems (e.g., < 5 hosts or < 1% of the fleet)
    and absent from approved software inventory, especially when they target /var/log, shell history,
    or logging services. Use fleet-wide frequency inventorying to surface the long tail; derive the host-count
    threshold from your environment''s observed prevalence distribution. A binary used on only one or
    two hosts that touches /var/log is a strong lead even if its command line is obfuscated. References:
    [What''s the deal with prevalence?, F-Secure](https://blog.f-secure.com/whats-the-deal-with-prevalence/);
    [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: All Linux and macOS endpoints, particularly servers with critical roles (e.g., web, database,
    authentication) and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (sysmon_linux_eid1, auditd_execve, macos_unifiedlog_process)

      | where target_path matches /\/var\/log\// OR command_line contains ''history'' OR command_line
      matches /(rsyslog|auditd|syslogd)/

      | stats dc(host) as host_count by process_path, file_hash, command_token

      | where host_count < 5 OR host_count < 0.01*total_hosts

      | where process_path NOT IN approved_software_inventory

      | sort host_count asc'
- question: Does a supervised classifier flag a Linux or macOS process execution as anti-forensic log
    clearing with high confidence?
  context: 'Defense Impairment (TA0112): Use a supervised classifier (Gradient Boosting / Random Forest)
    trained on labeled Linux and macOS process-execution data with features including command tokens,
    file-path rarity, parent-process legitimacy, deletion fan-out (count of log files the process touches),
    user context, and log-keyword presence. Alert when confidence > 0.9 AND emit the top-3 contributing
    features in the alert text so analysts can triage quickly. Train and validate against labeled host
    benchmarks containing anti-forensic activity ([DARPA Transparent Computing E3](https://github.com/darpa-i2o/Transparent-Computing/blob/master/README-E3.md)).
    A high-confidence positive with strong fan-out and rare-path features warrants immediate containment
    review.'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: All Linux and macOS endpoints, particularly servers with critical roles (e.g., web, database,
    authentication) and developer workstations.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [command_tokens, file_path_rarity, parent_process_legitimacy, deletion_fan_out,\
      \ user_context, log_keyword_presence]\nscore = gbm_classifier.predict_proba(features)\nif score\
      \ > 0.9:\n    alert(confidence=score, top_features=explain_top_k(features, 3))"
- question: Do any process command lines contain shell operators or arguments that truncate, delete, or
    overwrite log files (e.g., redirection to /dev/null, rm under /var/log, macOS log erase)?
  context: 'Defense Impairment (TA0112): Search process command lines for log-clearing patterns: `(>|>>)
    /var/log/.*(log|messages|secure|auth|wtmp|utmp|btmp)`, `cat /dev/null >`, `: > /var/log`, `shred .*log`,
    `rm .*/var/log/`, `truncate -s ?0`, `journalctl (--rotate|--vacuum-time=|--vacuum-size=)`, and macOS
    `log erase`. The evidence is strongest when the command directly targets the active log store rather
    than a benign archive or installer path. Alert on any match; equivalent published logic ([Linux Logs
    Clearing Attempts, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_clear_logs.yml))
    targets destructive utilities against /var/log/. A match means an analyst should reconstruct the surrounding
    session and confirm whether logs were actually altered.'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: Critical Linux servers (e.g., web, database, authentication), macOS developer workstations,
    DMZ servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (sysmon_linux_eid1, auditd_execve, macos_unifiedlog_process)

      | where command_line matches /((>|>>)\s*\/var\/log\/.*(log|messages|secure|auth|wtmp|utmp|btmp)|cat\s+\/dev\/null\s*>|:\s*>\s*\/var\/log|shred\s+.*log|rm\s+.*\/var\/log\/|truncate\s+-s\s*0?|journalctl\s+(--rotate|--vacuum-(time|size)=)|log\s+erase)/

      | alert severity=high'
- question: Are a user's command-line entropy or rare-command counts deviating significantly from their
    established baseline, suggesting obfuscated log-clearing activity?
  context: 'Defense Impairment (TA0112): Per user, baseline command-line Shannon entropy over a 30-day
    window and flag commands exceeding the 95th percentile; KL-divergence against the baseline distribution
    improves obfuscation detection over raw entropy. Separately track per-user daily counts of rare commands
    (truncate, shred) and alert above 3 sigma of the user''s individual mean, consistent with syscall
    frequency-deviation modeling. High-entropy command lines may indicate encoded/obfuscated destructive
    commands, while a spike in rare destructive utilities is itself suspicious. Tune per user since power
    users and admins legitimately run varied commands. References: [Using Entropy in Threat Hunting, Red
    Canary](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/); [Detecting Intrusions
    Using System Calls, Warrender et al](https://ieeexplore.ieee.org/document/766910).'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: Critical Linux servers (e.g., web, database, authentication), macOS developer workstations,
    DMZ servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// entropy baseline

      baseline = percentile(shannon_entropy(command_line) by user over 30d, 95)

      alert if shannon_entropy(command_line) > baseline OR kl_divergence(user_cmd_dist, baseline_dist)
      high

      // rare-command frequency

      stats count as c by user, command where command IN (truncate, shred) span=1d

      alert if c > mean_user + 3*stddev_user'
- question: Does a time-series model detect an abnormal burst of log-clearing command patterns on a host
    outside normal administrative cycles?
  context: 'Defense Impairment (TA0112): Apply time-series anomaly detection (Prophet/SARIMA) to the hourly
    per-host count of log-clearing command patterns, trained to learn normal administrative cycles; alert
    on bursts that deviate from forecast and report the contributing command patterns and magnitude in
    the alert. This complements LSTM log-sequence modeling ([DeepLog, Du et al](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf))
    that flags deletion-induced discontinuities and missing expected log keys with explainable top-k predicted-vs-observed
    evidence. A forecast-exceeding burst suggests scripted or automated log destruction; normal patching/maintenance
    cycles should be learned and not alert.'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: Critical Linux servers (e.g., web, database, authentication), macOS developer workstations,
    DMZ servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "series = hourly_count(log_clearing_cmd_patterns) by host\nmodel = Prophet().fit(series)\n\
      forecast = model.predict()\nif observed > forecast.yhat_upper:\n    alert(host, magnitude=observed-forecast.yhat,\
      \ patterns=contributing_patterns)"
- question: Did a privileged session run a command that stops or reconfigures host logging (e.g., stop
    auditd/rsyslog, vacuum the journal, macOS log erase, unload syslogd) outside an approved maintenance
    window?
  context: 'Defense Impairment (TA0112): Create rules for commands that stop or reconfigure host logging,
    such as `systemctl stop auditd`, `service rsyslog stop`, `journalctl --vacuum-time=`, macOS `log erase
    --all`, or `launchctl unload com.apple.syslogd`. Generate a high-priority alert when executed outside
    an approved maintenance window. Build an integrity layer with tamper-evident logging so deletion/reconfiguration
    is detectable as broken hash chains or missing sequence numbers even when commands are obfuscated.
    Disabling logging during off-hours by a non-maintenance account is a strong defense-impairment signal;
    cross-reference change tickets to suppress approved work. Reference: [Secure Audit Logs to Support
    Computer Forensics, Schneier and Kelsey](https://www.schneier.com/wp-content/uploads/2016/02/paper-secure-logs.pdf).'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: Linux and macOS servers with centralized logging, privileged shell jump boxes, and systems where
    auditd or unified logging is expected to remain enabled'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (sysmon_linux_eid1, auditd_execve, macos_unifiedlog_process)

      | where command_line matches /(systemctl\s+(stop|disable)\s+auditd|service\s+rsyslog\s+stop|journalctl\s+--vacuum-(time|size)=|log\s+erase\s+--all|launchctl\s+unload\s+.*syslogd)/

      | where NOT within_maintenance_window(timestamp, host)

      | alert severity=high'
- question: Is this the first observed use of a log-suppression command on a host/user, or is the daily
    count abnormally high versus similarly managed systems?
  context: 'Defense Impairment (TA0112): For each host and user, flag the first-time use of any command
    that disables, truncates, or retention-shrinks logs. Separately, compute the daily count of those
    commands per host and alert if it exceeds the 99th percentile across similarly managed Linux/macOS
    systems, using fleet-wide prevalence to isolate the rare long tail. A first-seen suppression command
    on a server where logging is expected to stay on is inherently suspicious; an outlier daily count
    signals repeated tampering attempts. Peer-group comparison (servers vs developer workstations) reduces
    false positives. Reference: [What''s the deal with prevalence?, F-Secure](https://blog.f-secure.com/whats-the-deal-with-prevalence/).'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: Linux and macOS servers with centralized logging, privileged shell jump boxes, and systems where
    auditd or unified logging is expected to remain enabled'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'suppress_cmds = (stop auditd|stop rsyslog|vacuum|log erase|unload syslogd)

      // first-seen

      alert if first_observation(command, key=(host,user)) within window

      // fleet outlier

      stats count as c by host span=1d where command IN suppress_cmds

      alert if c > p99(c across peer_group)'
- question: Does a session sequence model flag a shell session where log-suppression commands follow discovery/privilege
    checks and precede a drop in log generation?
  context: 'Defense Impairment (TA0112): Use a sequence-to-sequence autoencoder or LSTM over the command
    sequence within a shell session, trained on normal administrative sessions, flagging a session when
    log-suppression commands appear after discovery/privilege-check commands and precede a sharp decline
    in expected log generation. Short system-call n-gram ''self'' profiles and HMM/stide sequence models
    provide the sequence-anomaly foundation; surface the top-3 deviating events in the alert. The behavioral
    arc (recon -> privilege confirmation -> silence the logs) is a hallmark of a deliberate intrusion,
    distinct from routine administration. References: [A Sense of Self for Unix Processes, Forrest et
    al](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf); [Detecting Intrusions Using
    System Calls, Warrender et al](https://ieeexplore.ieee.org/document/766910).'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: Linux and macOS servers with centralized logging, privileged shell jump boxes, and systems where
    auditd or unified logging is expected to remain enabled'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = ordered_commands_in_session(session_id)\nrecon_error = seq2seq_autoencoder.reconstruct(seq)\n\
      if recon_error > threshold AND contains_pattern(seq, [discovery, priv_check, log_suppression]) AND\
      \ log_gen_drops_after(session_id):\n    alert(session_id, top_events=top_k_deviating(seq, 3))"
- question: Was a log file under /var/log (or a shell history file) deleted, truncated, or renamed by
    a process outside the log-management allowlist while Zeek shows the host is still active?
  context: 'Defense Impairment (TA0112): Trigger an alert if a file deletion or truncation event targets
    /var/log/* or shell history files and the initiating process is NOT on an allowlist of known log-management
    utilities (logrotate, gzip, dockerd, journald), correlating with Zeek conn.log only to confirm the
    host is still active on the network. This mirrors the curated-path allow/deny plus benign-process
    exclusion design of Elastic''s [System Log File Deletion, Elastic](https://github.com/elastic/detection-rules/blob/main/rules/linux/defense_evasion_log_files_deleted.toml)
    rule. Confirming live network activity rules out legitimate shutdown/decommission and strengthens
    the case that logs were deliberately destroyed on a running host.'
  answer_sources:
  - Sysmon for Linux Event ID 11
  - Sysmon for Linux Event ID 23
  - auditd
  - Zeek conn.log
  - 'NAI: Log directories on critical servers (/var/log, /var/run/), User home directories (for .*_history
    files), Network gateway for traffic correlation'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (sysmon_linux_eid11, sysmon_linux_eid23, auditd)

      | where event IN (delete, truncate, rename)

      | where target_path matches /(\/var\/log\/|\.[a-z]*_history$)/

      | where process_name NOT IN (logrotate, gzip, dockerd, journald)

      | join zeek_conn on host where conn.recent_activity=true

      | alert severity=high'
- question: Is the current hourly count of file deletions/modifications in /var/log or shell history locations
    more than 3 sigma above the host's 30-day baseline?
  context: 'Defense Impairment (TA0112): For each host, compute a 30-day baseline for file deletion and
    modification events within /var/log/ and shell history locations; alert when the current hour''s count
    exceeds 3 sigma above the mean after excluding known log-rotation and package-maintenance jobs, grounded
    in frequency-deviation modeling of normal process activity. A sudden surge of deletions/modifications
    in log directories points to bulk log destruction; excluding logrotate and package maintenance keeps
    the baseline clean. Pair with the symbolic-logic allowlist check to identify the responsible process.
    Reference: [Detecting Intrusions Using System Calls, Warrender et al](https://ieeexplore.ieee.org/document/766910).'
  answer_sources:
  - Sysmon for Linux Event ID 11
  - Sysmon for Linux Event ID 23
  - auditd
  - Zeek conn.log
  - 'NAI: Log directories on critical servers (/var/log, /var/run/), User home directories (for .*_history
    files), Network gateway for traffic correlation'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'events = file_delete|modify in (/var/log/, shell_history)

      exclude process IN (logrotate, package_mgr_jobs)

      baseline = mean,stddev of hourly_count by host over 30d

      alert if current_hour_count > mean + 3*stddev'
- question: Does a multivariate time-series or provenance-graph model flag a session where log files flatten
    out or vanish after interactive shell use?
  context: 'Defense Impairment (TA0112): Run a multivariate time-series detector over file modifications,
    deletions, and creations in log directories simultaneously, learning normal relationships and flagging
    sessions where log files flatten out or vanish after interactive shell use. Whole-system provenance
    learning ([KAIROS, Cheng et al](https://tfjmp.org/publications/2024-sp.pdf)) makes the same anti-forensic
    action (a single process touching many /var/log files) an anomalous, explainable subgraph, and node-level
    GraphSAGE ([ThreaTrace, Wang et al](https://arxiv.org/pdf/2111.04333)) traces the offending entity.
    Report the top-3 contributing features (deletion fan-out, target-path category, process lineage).
    This catches subtle tampering that doesn''t trip a single-pattern rule.'
  answer_sources:
  - Sysmon for Linux Event ID 11
  - Sysmon for Linux Event ID 23
  - auditd
  - Zeek conn.log
  - 'NAI: Log directories on critical servers (/var/log, /var/run/), User home directories (for .*_history
    files), Network gateway for traffic correlation'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "ts = multivariate_series([mods, deletes, creates] in log_dirs) by host\nanomaly = mv_detector.score(ts)\n\
      graph = build_provenance_graph(events)\nsubgraph = kairos_detect(graph)  # process -> many /var/log\
      \ files\nif anomaly > threshold OR subgraph.anomalous:\n    alert(top_features=[deletion_fan_out,\
      \ target_path_category, process_lineage])"
- question: Did a command or system call stop, disable, or kill a critical logging daemon (auditd, rsyslogd,
    macOS logging subsystem) without a correlating maintenance record?
  context: 'Defense Impairment (TA0112): Trigger a high-severity alert on commands that stop or disable
    logging daemons — `systemctl stop auditd`, `service rsyslog stop`, `launchctl unload com.apple.syslogd`,
    or `kill`/`pkill` targeting a known logging process — and correlate the timestamp with maintenance
    records to suppress approved changes. Pair with tamper-evident logging so a silenced agent or telemetry
    gap is itself the alert. Killing the logging daemon is a direct attempt to blind defenders; the absence
    of a matching change ticket elevates severity and should drive rapid response. Reference: [Secure
    Audit Logs to Support Computer Forensics, Schneier and Kelsey](https://www.schneier.com/wp-content/uploads/2016/02/paper-secure-logs.pdf).'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: All Linux and macOS endpoints and servers, Change management database/ticketing system'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (sysmon_linux_eid1, auditd_execve, macos_unifiedlog_process)

      | where command_line matches /(systemctl\s+(stop|disable)\s+auditd|service\s+rsyslog\s+stop|launchctl\s+unload\s+.*syslogd|(p?kill)\s+.*(auditd|rsyslogd|syslogd))/

      | join change_mgmt_db on host,time where NOT approved_change

      | alert severity=high'
- question: Is a host in the top 1% of logging-service stop events, or stopping a logging service for
    the first time in the observed window?
  context: 'Defense Impairment (TA0112): Establish a 90-day baseline of daily logging-service stop/restart
    events per host; flag any host in the top 1% of stop events or that stops a logging service for the
    first time in the observed window, using fleet-wide prevalence/rarity to surface the long tail. Most
    servers never stop their logging daemons; a host that suddenly does, or does so far more than its
    peers, is anomalous. Combine with maintenance records to suppress legitimate patch reboots and upgrades.
    Reference: [What''s the deal with prevalence?, F-Secure](https://blog.f-secure.com/whats-the-deal-with-prevalence/).'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: All Linux and macOS endpoints and servers, Change management database/ticketing system'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stats count as stops by host span=1d where event=logging_service_stop over 90d

      alert if host IN top_1pct(stops) OR first_seen(logging_service_stop, host) within window'
- question: Did a host's logging-agent heartbeat stop arriving outside the model's expected interval,
    indicating the agent was silenced?
  context: 'Defense Impairment (TA0112): Treat per-minute logging-agent heartbeats as a time series and
    use an LSTM (or Bayesian online change-point detector) to forecast the next expected heartbeat, alerting
    when a heartbeat is missed outside the model''s tolerance window — the state/cessation change-point
    signal of unexpected suppression. Include the last-seen timestamp and expected interval in the alert.
    A missing heartbeat from an otherwise live host (confirm via Zeek/network activity) strongly suggests
    the logging agent was stopped or starved; this catches suppression even when no command was captured.
    Reference: [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd
  - macOS Unified Log
  - 'NAI: All Linux and macOS endpoints and servers, Change management database/ticketing system'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "hb = per_minute_heartbeats(agent, host)\nexpected = lstm.forecast_next(hb)  # or bayesian_online_cpd(hb)\n\
      if now - last_seen > expected_interval + tolerance:\n    alert(host, last_seen=last_seen, expected_interval=expected)"
- question: Was a suspicious shell command followed by an absence of expected log-file modifications,
    while Zeek conn.log shows the host is still active?
  context: 'Defense Impairment (TA0112): Alert when a suspicious command-line pattern or process execution
