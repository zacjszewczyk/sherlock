questions:
- question: '[Stealth] Correlate malicious resource fork hashes: Does any file''s com.apple.ResourceFork
    stream (or its ..namedfork/rsrc path) contain content whose SHA256 or ssdeep fuzzy hash matches a
    known-malicious sample, indicating concealed malware stored in the resource fork rather than the visible
    data stream?'
  context: 'Under the Stealth tactic (TA0005), adversaries hide payloads in the resource fork so the visible
    file looks benign while the malicious code lives in the named-fork stream and is extracted at a fixed
    offset for execution -- the canonical T1564.009 behavior documented by SentinelLabs and MITRE. On
    every ES_EVENT_TYPE_NOTIFY_WRITE/CREATE or SETXATTR touching com.apple.ResourceFork (or a write to
    <file>/..namedfork/rsrc), read the fork via the named-fork path and compute its SHA256, alerting at
    high priority on any match to known-malicious hashes. Because adversaries repack to defeat exact hashing,
    also compute an ssdeep context-triggered piecewise hash and alert when similarity to a known-bad sample
    exceeds 70. A positive result -- an exact or fuzzy match -- strongly indicates concealed malware in
    the fork; pivot to the writing process, its lineage, the file path, and any subsequent execution.
    A negative result reduces but does not eliminate suspicion, since novel samples may not yet be in
    intel feeds; corroborate with the entropy, writer, and chain questions. Sources: [Kornblum CTPH](https://dfrws.org/sites/default/files/session-files/2006_USA_paper-identifying_almost_identical_files_using_context_triggered_piecewise_hashing.pdf);
    [SentinelLabs](https://www.sentinelone.com/labs/resourceful-macos-malware-hides-in-named-fork/); [MITRE](https://attack.mitre.org/techniques/T1564/009/).'
  answer_sources:
  - ES_EVENT_TYPE_NOTIFY_CREATE file creation events
  - ES_EVENT_TYPE_NOTIFY_WRITE file write events
  - ES_EVENT_TYPE_NOTIFY_SETXATTR extended attribute events
  - 'NAI: User workstations (macOS), macOS-based servers, Development environments, common staging directories
    like /tmp/, ~/Downloads/, ~/Documents/'
  range: Last 90 days
  queries:
  - technology: EDR/ES rule pseudocode
    query: "on ES_EVENT (CREATE|WRITE|SETXATTR) where xattr == 'com.apple.ResourceFork' or path endswith\
      \ '/..namedfork/rsrc':\n  fork = read('<file>/..namedfork/rsrc')\n  sha = sha256(fork); fuzzy =\
      \ ssdeep(fork)\n  if sha in known_bad_hashes: alert(priority=high, reason='exact fork hash match')\n\
      \  elif ssdeep_compare(fuzzy, known_bad_fuzzy) > 70: alert(priority=high, reason='fuzzy fork match')"
- question: '[Stealth] Flag high-entropy resource forks: Which non-zero resource forks exhibit Shannon
    entropy above the environment baseline (especially >7.2), suggesting encrypted or packed payloads
    concealed in the fork rather than legitimate icons or metadata?'
  context: 'For the Stealth tactic (TA0005), packed or encrypted payloads stored in a resource fork raise
    its byte-level entropy well above that of native code or plaintext (typically 5.0-6.5). Compute Shannon
    entropy of each non-zero resource fork and build a per-environment baseline from forks belonging to
    code-signed apps; flag forks whose entropy exceeds the 95th percentile of that baseline, treating
    values above 7.2 as likely encrypted or packed. To cut false positives on legitimately compressed
    resources, pair entropy with the fork''s byte volume and the parent app''s code-signing state -- a
    large, high-entropy fork attached to an unsigned executable is far more suspicious than a small one
    on a trusted app. A positive result warrants extracting and triaging the fork content; a negative
    result suggests benign metadata but should be combined with the hash and writer checks. Sources: [Lyda
    & Hamrock](https://ieeexplore.ieee.org/document/4140989); [SentinelLabs](https://www.sentinelone.com/labs/resourceful-macos-malware-hides-in-named-fork/).'
  answer_sources:
  - ES_EVENT_TYPE_NOTIFY_CREATE file creation events
  - ES_EVENT_TYPE_NOTIFY_WRITE file write events
  - ES_EVENT_TYPE_NOTIFY_SETXATTR extended attribute events
  - 'NAI: User workstations (macOS), macOS-based servers, Development environments, common staging directories
    like /tmp/, ~/Downloads/, ~/Documents/'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = entropy distribution of forks on code-signed apps (per environment)\nfor each non-zero\
      \ resource fork:\n  H = shannon_entropy(fork_bytes)\n  if H > percentile(baseline, 95) or H > 7.2:\n\
      \    risk = combine(H, fork_byte_count, parent_signed?)\n    alert(fork, entropy=H, volume=fork_byte_count,\
      \ signed=parent_signed)"
- question: '[Stealth] Score resource fork events with an ML model: When an explainable classifier scores
    resource-fork WRITE/SETXATTR events using fork size, entropy, ssdeep cluster, writer process and signing
    state, file type, permissions, and path, which events exceed the tuned probability threshold and what
    top SHAP features drive each alert?'
  context: 'To detect resource-fork abuse under the Stealth tactic (TA0005) without rigid rules, train
    an explainable gradient-boosting or Random Forest classifier on labeled fork events. Features include
    fork size, fork entropy, ssdeep cluster, parent process name and signing/team-ID state, file type,
    file permissions, and path. Score WRITE/SETXATTR events in real time and alert above a tuned probability
    threshold. Every alert MUST list the top-3 SHAP feature contributions (e.g., high fork entropy, unsigned
    writer, oversized fork) rather than a bare score, so analysts can validate the reasoning. Run an unsupervised
    Extended Isolation Forest in parallel on the same feature vectors to catch novel variants the supervised
    model has not seen. A high-probability, well-explained alert merits fork extraction and lineage review;
    explainability also helps tune away benign patterns. Sources: [Mandiant gradient-boosting](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/);
    [SHAP IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full);
    [Hariri et al.](https://arxiv.org/pdf/1811.02141).'
  answer_sources:
  - ES_EVENT_TYPE_NOTIFY_CREATE file creation events
  - ES_EVENT_TYPE_NOTIFY_WRITE file write events
  - ES_EVENT_TYPE_NOTIFY_SETXATTR extended attribute events
  - 'NAI: User workstations (macOS), macOS-based servers, Development environments, common staging directories
    like /tmp/, ~/Downloads/, ~/Documents/'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: "features = [fork_size, fork_entropy, ssdeep_cluster, writer_proc, signing_state, file_type,\
      \ perms, path]\np = gbm.predict_proba(features)\nif p > threshold:\n  alert(score=p, top3=shap_top_features(features,\
      \ n=3))\n# parallel novelty detection\nif extended_isolation_forest.anomaly_score(features) > eif_threshold:\n\
      \  alert(reason='novel fork pattern', top3=shap_top_features(features,3))"
- question: '[Stealth] Alert on suspicious writers modifying resource forks: Is a watchlisted or non-standard
    process (curl, wget, bash, sh, zsh, python, osascript, dd, ditto, Microsoft Word/Excel, or an unsigned
    binary) writing data into a file''s com.apple.ResourceFork or ..namedfork/rsrc stream?'
  context: 'Under the Stealth tactic (TA0005), the identity of the process writing a resource fork is
    a strong signal: benign forks are typically produced by Finder, Xcode, or Archive Utility, whereas
    interpreters, network tools, and Office applications writing into a fork is inherently suspicious.
    Bundlore wrote a compressed .app into a script''s resource fork and then decompressed and executed
    it. Using Endpoint Security responsible-process metadata, alert when a watchlisted writer (curl, wget,
    bash, sh, zsh, python, osascript, dd, ditto, Word, Excel) performs a write to com.apple.ResourceFork
    or ..namedfork/rsrc, and suppress signed, allowlisted apps (Finder, Xcode, Archive Utility). A positive
    result should trigger inspection of the fork content and the writer''s command line and parentage;
    a negative result helps rule out interpreter/Office-driven fork staging. Sources: [Apple ES](https://developer.apple.com/documentation/endpointsecurity);
    [Wardle FileMonitor](https://objective-see.org/blog/blog_0x48.html); [Bundlore](https://blogs.vmware.com/security/2020/06/tau-threat-analysis-bundlore-macos-mm-install-macos.html).'
  answer_sources:
  - ES_EVENT_TYPE_NOTIFY_EXEC process execution events
  - ES_EVENT_TYPE_NOTIFY_WRITE file write events
  - ES_EVENT_TYPE_NOTIFY_SETXATTR extended attribute events
  - 'NAI: User workstations (macOS), macOS-based servers, Development environments'
  range: Last 90 days
  queries:
  - technology: EDR/ES rule pseudocode
    query: "watchlist = {curl,wget,bash,sh,zsh,python,osascript,dd,ditto,'Microsoft Word','Microsoft Excel'}\n\
      allowlist = {Finder, Xcode, 'Archive Utility'}\non ES_EVENT WRITE|SETXATTR where target in {'com.apple.ResourceFork','..namedfork/rsrc'}:\n\
      \  w = responsible_process\n  if (w.name in watchlist or not w.signed) and w.name not in allowlist:\n\
      \    alert(priority=high, writer=w, file=target_file)"
- question: '[Stealth] Score rare resource fork writing processes: Over a 30-day window, which processes
    that write resource forks are rare (lowest 5th percentile of frequency) and not on the known-good
    allowlist, especially unsigned writers appearing for the first time?'
  context: 'For the Stealth tactic (TA0005), legitimate fork-writing is dominated by a small set of recurring,
    signed system utilities; an adversary''s fork-writing tool is comparatively rare. Aggregate process
    names (with signing state) that write resource forks over a 30-day window and compute per-process
    frequency. Alert on any writer not on the known-good allowlist whose frequency falls in the lowest
    5th percentile, indicating rare or anomalous fork-writing activity. Track frequency (writes per process
    per day) and signing state as distinct features -- an unsigned writer appearing for the first time
    is higher risk. A positive result identifies a candidate malicious tool for deeper review; a negative
    result indicates the activity matches established benign writers. Sources: [Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/);
    [SentinelLabs](https://www.sentinelone.com/labs/resourceful-macos-malware-hides-in-named-fork/).'
  answer_sources:
  - ES_EVENT_TYPE_NOTIFY_EXEC process execution events
  - ES_EVENT_TYPE_NOTIFY_WRITE file write events
  - ES_EVENT_TYPE_NOTIFY_SETXATTR extended attribute events
  - 'NAI: User workstations (macOS), macOS-based servers, Development environments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "window = last 30 days\nfor each (writer, signing_state) writing a resource fork:\n  freq =\
      \ count(writes)/days\nthr = percentile(all freqs, 5)\nfor each writer not in allowlist:\n  if freq(writer)\
      \ <= thr or (not signed and first_seen within window):\n    alert(writer, freq, signed)"
- question: '[Stealth] Flag unusual process lineages with clustering: When process lineage vectors (parent
    image, child image, signing state, action=write_to_resource_fork) are clustered, which outlier lineages
    -- e.g., browser/Office/interpreter -> fork write -> exec -- fall outside dense benign clusters?'
  context: 'Under the Stealth tactic (TA0005), benign fork writes occur within a few recurring process
    lineages (Finder/Xcode), forming dense clusters, while malicious resource-fork staging produces anomalous
    lineages such as a browser, Office app, or interpreter writing a fork and then executing it. Build
    graph/lineage feature vectors (parent image, child image, signing state, action=write_to_resource_fork)
    and score them with Extended Isolation Forest or DBSCAN; dense clusters represent benign lineages
    and outliers are flagged. Surface the top-3 contributing features per alert so analysts understand
    why a lineage was deemed anomalous. A flagged outlier lineage warrants full process-tree and fork-content
    review; lineages inside known-benign clusters are lower priority. Sources: [Hariri et al.](https://arxiv.org/pdf/1811.02141);
    [SHAP IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - ES_EVENT_TYPE_NOTIFY_EXEC process execution events
  - ES_EVENT_TYPE_NOTIFY_WRITE file write events
  - ES_EVENT_TYPE_NOTIFY_SETXATTR extended attribute events
  - 'NAI: User workstations (macOS), macOS-based servers, Development environments'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: "vectors = [(parent_image, child_image, signing_state, 'write_to_resource_fork')]\nlabels =\
      \ DBSCAN(vectors)  # or ExtendedIsolationForest scores\nfor v in vectors:\n  if v is outlier (no\
      \ dense cluster / high EIF score):\n    alert(lineage=v, top3=shap_top_features(v,3))"
- question: '[Stealth] Detect executables with non-zero resource forks: Which files in user-writable or
    staging directories are both executable (have +x) AND carry a non-zero com.apple.ResourceFork, matching
    the hidden-payload-container pattern?'
  context: 'Under the Stealth tactic (TA0005), an adversary may create or modify an executable so it keeps
    execute permission while also carrying a non-zero resource fork, forming a hidden payload container
    beside the primary file data. Trigger when an ES_EVENT_TYPE_NOTIFY_CREATE/SETATTR shows a file that
    is both executable (+x) and carries a non-zero com.apple.ResourceFork; suppress files signed by trusted
    team IDs and allowlisted legacy-app paths. Note that the manual enumeration equivalents an adversary
    or analyst uses are ls -l@ (the @ flag) and xattr -l. A positive result identifies a likely hidden-payload
    container for fork extraction and triage; a negative result indicates standard executables without
    concealed fork content. Sources: [SentinelLabs](https://www.sentinelone.com/labs/resourceful-macos-malware-hides-in-named-fork/);
    [MITRE](https://attack.mitre.org/techniques/T1564/009/).'
  answer_sources:
  - ES_EVENT_TYPE_NOTIFY_SETATTR file attribute modification events
  - ES_EVENT_TYPE_NOTIFY_CREATE file creation events
  - ES_EVENT_TYPE_NOTIFY_WRITE file write events
  - 'NAI: User workstations (macOS), macOS-based servers, Staging directories (e.g., /tmp, ~/Downloads)'
  range: Last 90 days
  queries:
  - technology: EDR/ES rule pseudocode
    query: "on ES_EVENT CREATE|SETATTR for file f in user-writable/staging dirs:\n  if has_exec_bit(f)\
      \ and resource_fork_size(f) > 0:\n    if not signed_by_trusted_team(f) and f.path not in legacy_allowlist:\n\
      \      alert(priority=high, file=f, fork_size=resource_fork_size(f))"
- question: '[Stealth] Alert on resource fork size outliers: Which executable files have a resource-fork
    byte size exceeding the moving mean+3 sigma for their host class, indicating an oversized fork that
    could hold a packed payload rather than icons or metadata?'
  context: 'For the Stealth tactic (TA0005), typical resource forks on executables hold small icon or
    metadata blobs, whereas a fork concealing a packed .app can be tens to hundreds of KB -- a strong
    volume outlier. Maintain a moving mean and standard deviation of resource-fork byte size across executable
    files and alert on any executable whose fork size exceeds mean+3 sigma. Derive environment-specific
    sigma per host class so baselines reflect each population. A positive result flags an abnormally large
    fork for content extraction and hashing; a negative result means the fork size is consistent with
    normal metadata. Combine with the entropy and writer checks to confirm malicious intent. Sources:
    [Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989); [Bundlore](https://blogs.vmware.com/security/2020/06/tau-threat-analysis-bundlore-macos-mm-install-macos.html).'
  answer_sources:
  - ES_EVENT_TYPE_NOTIFY_SETATTR file attribute modification events
  - ES_EVENT_TYPE_NOTIFY_CREATE file creation events
  - ES_EVENT_TYPE_NOTIFY_WRITE file write events
  - 'NAI: User workstations (macOS), macOS-based servers, Staging directories (e.g., /tmp, ~/Downloads)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each host_class:\n  mu, sigma = moving_stats(resource_fork_size of executables)\nfor each\
      \ executable f:\n  if resource_fork_size(f) > mu + 3*sigma:\n    alert(file=f, fork_size=resource_fork_size(f),\
      \ threshold=mu+3*sigma)"
- question: '[Stealth] Flag spikes in fork-bearing executables: Are there bursts in the per-host hourly
    count of new executable files carrying non-zero resource forks that deviate from the seasonal/trend
    baseline, indicating mass deployment or worm-like staging?'
  context: 'Under the Stealth tactic (TA0005), a sudden surge of new fork-bearing executables on a host
    can indicate mass deployment of hidden payloads or worm-like staging. Apply time-series anomaly detection
    (STL/series_decompose_anomalies or SARIMA) to the count of new executable files with non-zero resource
    forks per host per hour, and alert on bursts that deviate from the seasonal and trend baseline. Report
    the baseline, observed count, and deviation in each alert for explainability. A positive result points
    to an abnormal staging event warranting host-wide review; a negative result indicates fork-bearing
    executable creation within normal rhythm. Sources: [Sentinel time-series anomaly](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Windows%20Security%20Events/Analytic%20Rules/TimeSeriesAnomaly-ProcessExecutions.yaml);
    [SHAP IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - ES_EVENT_TYPE_NOTIFY_SETATTR file attribute modification events
  - ES_EVENT_TYPE_NOTIFY_CREATE file creation events
  - ES_EVENT_TYPE_NOTIFY_WRITE file write events
  - 'NAI: User workstations (macOS), macOS-based servers, Staging directories (e.g., /tmp, ~/Downloads)'
  range: Last 90 days
  queries:
  - technology: SIEM/Time-series pseudocode
    query: "series = count(new executables with fork_size>0) per host per hour\nbaseline = series_decompose_anomalies(series)\
      \  # or SARIMA forecast\nfor t in series:\n  if observed[t] far exceeds baseline[t]:\n    alert(host,\
      \ hour=t, observed=observed[t], baseline=baseline[t], deviation=observed[t]-baseline[t])"
- question: '[Stealth] Correlate download->fork->execute chains: On a single macOS host within a 5-minute
    window, is a file download (Zeek files.log) followed by a write to that file''s ..namedfork/rsrc (or
    com.apple.ResourceFork) and then execution of the file or a related child process?'
  context: 'Under the Stealth tactic (TA0005), staged delivery through resource-fork content produces
    a distinctive chain: a file is downloaded, its resource fork is written, and the file (or an extracted
    .app) is executed -- exactly the download->fork-write->decompress->execute behavior observed in Bundlore.
    Use stateful correlation joining network and endpoint telemetry: alert when, on one host within a
    5-minute window, (1) Zeek files.log records a download, (2) an ES write targets that file''s ..namedfork/rsrc
    or com.apple.ResourceFork, and (3) an ES EXEC runs the file or a related child. A positive result
    is high-confidence staged delivery; pivot to the source URL/IP, the fork content, and the executed
    process. A negative result helps rule out network-delivered fork staging within the window. Sources:
    [Bundlore](https://blogs.vmware.com/security/2020/06/tau-threat-analysis-bundlore-macos-mm-install-macos.html);
    [SentinelLabs](https://www.sentinelone.com/labs/resourceful-macos-malware-hides-in-named-fork/).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - ES_EVENT_TYPE_NOTIFY_WRITE file write events
  - ES_EVENT_TYPE_NOTIFY_EXEC process execution events
  - 'NAI: Network egress points, User workstations (macOS), User download folders'
  range: Last 90 days
  queries:
  - technology: SIEM/Correlation pseudocode
    query: "within 5min on same host:\n  A = Zeek files.log download of file F\n  B = ES WRITE to F +\
      \ '/..namedfork/rsrc' or com.apple.ResourceFork\n  C = ES EXEC of F or related child (extracted\
      \ .app)\nif A and B and C and order(A,B,C):\n  alert(priority=high, host, file=F, src=A.url, exec=C.proc)"
- question: '[Stealth] Score low-latency chains as suspicious: For each download->fork->exec match, is
    the time delta from fork write to execution in the lowest 5th percentile (e.g., under ~15 seconds),
    indicating automated rather than user-initiated execution?'
  context: 'For the Stealth tactic (TA0005), human-initiated downloads usually involve a noticeable pause
    before execution, while automated malware extracts and runs fork content almost immediately. For each
    download->fork->exec match, compute the time delta from fork write to execution and compare it to
    the historical distribution of user-initiated executions; deltas in the lowest 5th percentile (e.g.,
    under 15s) indicate automation and should be escalated. Also profile failure/state signals -- blocked
    or failed downloads and non-executed forks are distinct, lower-risk outcomes. A positive result (very
    low latency) escalates the chain; a negative result (human-scale delay or a non-executed fork) lowers
    priority but does not clear it. Sources: [SentinelLabs](https://www.sentinelone.com/labs/resourceful-macos-malware-hides-in-named-fork/);
    [Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - ES_EVENT_TYPE_NOTIFY_WRITE file write events
  - ES_EVENT_TYPE_NOTIFY_EXEC process execution events
  - 'NAI: Network egress points, User workstations (macOS), User download folders'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "dist = historical fork_write->exec deltas for user-initiated runs\nfor each download->fork->exec\
      \ chain:\n  delta = exec_time - fork_write_time\n  if delta <= percentile(dist, 5) (e.g., <15s):\n\
      \    escalate(chain, delta)\n  if download_failed or fork_not_executed:\n    tag(chain, lower_risk)"
- question: '[Stealth] Flag anomalous sequences with sequence modeling: When a sequence model scores ordered
    endpoint+network event streams, does the sequence network_download -> resource_fork_write -> chmod+x
    -> process_exec receive a low benign-likelihood score, and what top features drive the flag?'
  context: 'Under the Stealth tactic (TA0005), the ordered sequence network_download -> resource_fork_write
    -> chmod+x -> process_exec is rare under a benign-session model and is a high-risk indicator of fork-based
    staged delivery. Train a sequence model (DistilBERT/LSTM/HMM) on ordered endpoint and network event
    streams; flag sequences with low likelihood under the benign model. Run an Extended Isolation Forest
    on aggregated chain features in parallel and surface the top-3 drivers per alert for explainability.
    A low-likelihood, well-explained sequence merits full chain investigation across network source, fork
    content, and executed process; a high-likelihood (benign-looking) sequence is lower priority. This
    catches variants that fixed correlation windows might miss. Sources: [DistilBERT shell-session anomaly](https://arxiv.org/abs/2310.13247);
    [Hariri et al.](https://arxiv.org/pdf/1811.02141); [SHAP IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - ES_EVENT_TYPE_NOTIFY_WRITE file write events
  - ES_EVENT_TYPE_NOTIFY_EXEC process execution events
  - 'NAI: Network egress points, User workstations (macOS), User download folders'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: "seq = ordered events per host session\nscore = benign_sequence_model.likelihood(seq)  # DistilBERT/LSTM/HMM\n\
      if seq contains [network_download, resource_fork_write, chmod+x, process_exec] and score < threshold:\n\
      \  alert(seq, likelihood=score)\nif extended_isolation_forest.anomaly(chain_features) high:\n  alert(top3=shap_top_features(chain_features,3))"
