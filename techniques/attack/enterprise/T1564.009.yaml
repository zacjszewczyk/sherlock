name: 'T1564.009: Hide Artifacts: Resource Forking'
id: 183a1cf9-0393-42c7-8873-747279367f5b
description: 'This playbook helps an analyst investigate whether an adversary is abusing macOS resource
  forks -- the legacy com.apple.ResourceFork extended attribute, accessible via the <file>/..namedfork/rsrc
  path -- to hide malicious code, executables, or encrypted payloads beside a file''s visible data stream
  and thereby evade detection, supporting the Stealth tactic. Resource-fork hiding (with offset-based
  extraction and execution) is the canonical T1564.009 behavior, observed in families such as Bundlore,
  which wrote a compressed .app into a script''s resource fork and then decompressed and executed it.
  The hunt spans Endpoint Security (ES) file and process telemetry (CREATE, WRITE, SETXATTR, SETATTR,
  EXEC events) and Zeek network telemetry (conn.log, files.log) on macOS workstations, servers, development
  environments, and common staging directories such as /tmp, ~/Downloads, and ~/Documents. It guides the
  analyst across several behavioral angles: resource-fork content whose hash or fuzzy hash matches known
  malware; high-entropy forks indicating packed or encrypted payloads; suspicious or rare writers (interpreters,
  browsers, Office apps, unsigned binaries) modifying forks; executables that retain execute permission
  while carrying a non-zero resource fork; oversized forks and bursts of fork-bearing executables; and
  full download->fork-write->execute chains correlated across network and endpoint sources. Detection
  methods combine symbolic-logic rules, statistical baselining and outlier analysis, and machine-learning
  models (gradient boosting, Extended Isolation Forest, sequence models) so the analyst can corroborate
  suspected resource-fork abuse against file metadata, process lineage, signing state, and timing.'
type: technique
