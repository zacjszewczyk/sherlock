name: 'T1593: Search Open Websites-Domains'
id: 5a8b33a5-e246-4d61-8898-89ccc99e2230
description: 'Investigate evidence that an adversary is conducting reconnaissance against the organization
  by searching freely available websites and domains (social media, news sites, business filings, hiring
  portals, and public-facing infrastructure) for information useful in targeting. This playbook helps
  an analyst hunt for the observable network and authentication side effects of that open-source reconnaissance
  as it touches the organization''s own assets: scanner/tool fingerprints and rare or malicious User-Agent
  strings hitting public web servers and login portals; footprinting of reconnaissance metafiles (robots.txt,
  sitemap.xml, security.txt, .well-known/) followed by enumeration of disallowed/admin paths; high-volume
  HTTP request bursts with elevated 4xx/5xx-to-2xx error ratios indicative of scraping or directory brute-forcing;
  unauthorized DNS zone transfers (AXFR/IXFR) and high-rate, high-entropy subdomain enumeration producing
  excessive NXDOMAIN responses; and spikes in failed external authentication attempts correlated with
  the appearance of organizational credentials in public breach feeds. Each question pairs symbolic-logic
  rules, statistical baselining, and machine-learning approaches so the analyst can confirm or refute
  active reconnaissance and feed findings into Initial Access and Phishing for Information detection.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are inbound connections to public-facing web assets (corporate website, login portals) originating
    from source IPs or carrying User-Agent strings that match known scanner/tool signatures or high-confidence
    threat intelligence?
  context: During Reconnaissance, adversaries commonly probe public web assets with automated scanners
    (nmap, sqlmap, Nuclei, ZGrab, masscan) whose User-Agent strings and source IPs are documented in community
    rule corpora (Sigma) and the OWASP Automated Threats taxonomy (OAT-004 Fingerprinting, OAT-011 Scraping).
    Matching Zeek http.log/conn.log fields against these signatures and curated threat-intel indicators
    provides a high-fidelity, low-cost trigger. A positive match means a known reconnaissance tool or
    flagged actor is touching the perimeter; enrich each alert with the matched signature name so the
    analyst can gauge tooling sophistication. A negative result reduces (but does not eliminate) the likelihood
    of tool-based scanning, since custom or spoofed User-Agents can evade signatures.
  answer_sources: &id001
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Public-facing web servers, Reverse proxies, Cloud-hosted web applications'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source = zeek_http OR zeek_conn\n| eval ua=lower(user_agent)\n| where (id.orig_h IN threat_intel_ips)\n\
      \      OR match(ua, \"nmap|sqlmap|nuclei|zgrab|masscan|gobuster|nikto|dirbuster\")\n      OR ua\
      \ IN sigma_scanner_ua_list\n| eval matched_sig = case(...)\n| alert message=\"Recon scanner/threat-intel\
      \ match on public web asset\" enrich=matched_sig"
- question: Did a single external source fetch reconnaissance metafiles (robots.txt, sitemap.xml, security.txt,
    .well-known/) and then request many distinct disallowed or administrative paths within a short window?
  context: The OWASP Web Security Testing Guide describes information-gathering that begins by pulling
    metafiles which advertise site structure and disallowed paths, then enumerating those hidden or admin
    endpoints. Detecting the sequence — a metafile fetch followed by >20 distinct disallowed/admin path
    requests from the same source within 5 minutes — captures the footprinting pattern more reliably than
    either signal alone. A positive result indicates deliberate site mapping ahead of exploitation; a
    negative result is expected for ordinary users and well-behaved crawlers that read robots.txt but
    do not then hammer disallowed paths. Tie any hit back to which paths were probed to assess what the
    adversary learned.
  answer_sources: *id001
  range: Last 90 days, evaluated over 5-minute sliding windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source = zeek_http

      | where uri IN ("/robots.txt","/sitemap.xml","/.well-known/security.txt") OR uri LIKE "/.well-known/%"

      | join id.orig_h [ search zeek_http | where uri IN disallowed_or_admin_paths ]

      | bin _time span=5m

      | stats values(metafile) as meta, dc(uri) as distinct_paths by id.orig_h, _time

      | where meta IS NOT NULL AND distinct_paths > 20

      | alert message="Metafile probing + disallowed/admin path enumeration"'
- question: Which inbound web requests carry User-Agent strings that are statistically rare across the
    site and originate from IPs that are not legitimate search-engine crawlers?
  context: Reconnaissance tooling frequently presents unusual or unique User-Agent strings. By building
    a 30-day baseline of inbound User-Agent frequency and flagging strings seen in fewer than 0.1% of
    requests (with the floor tuned per-site to your own http.log volume distribution, as in Lagopoulos
    et al.), the analyst surfaces anomalous clients while suppressing the long tail of normal browsers.
    Excluding verified crawler IPs (Googlebot, Bingbot via reverse-DNS validation) reduces false positives.
    A rare User-Agent from a non-crawler IP warrants review for scanning or scraping; a common User-Agent
    is unremarkable on its own but may still be malicious when combined with other signals.
  answer_sources: *id001
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source = zeek_http earliest=-30d

      | stats count by user_agent

      | eventstats sum(count) as total

      | eval freq = count/total

      | where freq < 0.001

      | join user_agent [ search zeek_http | where NOT id.orig_h IN verified_crawler_ips ]

      | stats count, values(id.orig_h) by user_agent

      | alert message="Rare non-crawler User-Agent observed"'
- question: When web requests are scored by a supervised model on robot/recon features, which ones are
    classified as malicious reconnaissance, and which features drove that verdict?
  context: Signature and rarity checks miss novel tooling, so a supervised classifier (Random Forest or
    Gradient Boosting) trained on labeled requests captures subtler patterns. Using the web-robot feature
    set of Lagopoulos et al. — User-Agent length/entropy, source-IP reputation, header count, anomalous
    header presence, percentage of 4xx responses, missing-referer rate, and HTML-to-image ratio — the
    model distinguishes automated reconnaissance from human browsing. Including the top-3 feature contributions
    (feature importances/SHAP) in each alert gives the analyst explainability to validate the call. A
    high-confidence malicious classification is strong evidence of automated recon; periodic retraining
    and label review keep precision high.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = RandomForest(features=[ua_len, ua_entropy, ip_reputation, header_count,\n    anomalous_header_flag,\
      \ pct_4xx, missing_referer_rate, html_to_image_ratio])\nfor req in zeek_http_requests:\n    score\
      \ = model.predict_proba(req)\n    if score['malicious_recon'] > 0.8:\n        alert(req, top3=shap_top_features(model,\
      \ req))"
- question: Is a single external source IP generating a burst of HTTP 404 responses against one public
    web server, indicating directory or content brute-forcing?
  context: A deterministic floor — more than 100 requests resulting in 404 responses within one minute
    from a single source IP to a single public web server — reliably catches aggressive directory brute-forcing
    and content discovery, matching the OAT-011 Scraping and OAT-018 Footprinting rate-and-error symptoms
    in OWASP Automated Threats. Profiling the 4xx/5xx failure stream separately from successful 2xx traffic
    makes scanning stand out, because legitimate clients rarely produce sustained high error rates. A
    positive result identifies an active enumeration source; the specific 404 paths reveal what content
    the adversary sought. A negative result does not rule out low-and-slow scanning, which the statistical
    and sequential methods are designed to catch.
  answer_sources: &id002
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Public-facing web servers, API Gateways'
  range: Last 90 days, evaluated over 1-minute windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source = zeek_http

      | where status_code == 404

      | bin _time span=1m

      | stats count as err404 by id.orig_h, host, _time

      | where err404 > 100

      | alert message="High-volume 404 burst (directory/content brute-force)"'
- question: Which source IPs exceed their own historical request rate AND 4xx/5xx-to-2xx error ratio baselines
    by more than three standard deviations over ten-minute windows?
  context: Fixed thresholds either miss stealthy scanners or alert on busy legitimate clients. Computing
    per-source-IP baselines — the 95th percentile request rate and the 4xx/5xx-to-2xx ratio over ten-minute
    windows — and alerting only when an IP exceeds BOTH baselines by more than three standard deviations
    adapts detection to each client's normal behavior. Per-site thresholds derived from your own http.log
    are essential because legitimate-versus-bot session statistics differ markedly (Lagopoulos et al.).
    A positive result is an IP behaving anomalously both in volume and in failure rate relative to itself,
    a strong scraping/scanning indicator; requiring both conditions limits false positives from merely
    chatty but successful clients.
  answer_sources: *id002
  range: Last 90 days (rolling per-IP baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source = zeek_http\n| bin _time span=10m\n| stats count as reqs, sum(eval(status>=400)) as\
      \ errs, sum(eval(status<300)) as ok by id.orig_h, _time\n| eval err_ratio = errs/(ok+1)\n| eventstats\
      \ perc95(reqs) as rate_b, avg(err_ratio) as er_avg, stdev(err_ratio) as er_sd,\n    avg(reqs) as\
      \ rate_avg, stdev(reqs) as rate_sd by id.orig_h\n| where reqs > rate_avg+3*rate_sd AND err_ratio\
      \ > er_avg+3*er_sd\n| alert message=\"Per-IP rate and error-ratio anomaly\""
- question: When sequential hypothesis testing accumulates the ratio of successful to failed requests
    per source IP, which sources cross the scanner-verdict likelihood bound, including low-and-slow ones?
  context: Threshold Random Walk / sequential hypothesis testing (Jung et al., implemented in Bro/Zeek)
    accumulates evidence per source IP from the ratio of successful (2xx) to failed (4xx/5xx) requests
    and raises a scanner verdict once the likelihood ratio crosses a configured bound. Because it integrates
    evidence over time rather than over a fixed window, it catches low-and-slow scraping and enumeration
    that per-minute counters miss, while bounding false positives and false negatives analytically. A
    positive verdict means the cumulative success/failure pattern is far more consistent with scanning
    than with legitimate use; the configured error bounds let the analyst trade sensitivity against noise.
  answer_sources: *id002
  range: Last 90 days (stateful per-IP accumulation)
  queries:
  - technology: Zeek/pseudocode
    query: "# Threshold Random Walk per source IP\nfor each request by ip:\n    if status in 2xx: Lambda\
      \ *= (P_success_benign / P_success_scanner)\n    else:             Lambda *= (P_fail_benign    /\
      \ P_fail_scanner)\n    if Lambda <= eta_0:  verdict[ip] = 'scanner'; alert(ip)\n    elif Lambda\
      \ >= eta_1: verdict[ip] = 'benign'"
- question: Do observed per-IP or per-site 404 error volumes fall outside the range forecast by a seasonal
    time-series model, or trigger a change-point detector on the 404 series?
  context: A Seasonal-ARIMA model trained on 30+ days of per-IP and per-site 404 counts learns normal
    diurnal/weekly error patterns; observed volumes outside the forecast interval indicate anomalous enumeration.
    As a complementary unsupervised trigger, change-point methods (CUSUM / Bayesian online CPD, surveyed
    in Aminikhanghahi and Cook) flag abrupt shifts in the 404 time series. Together these catch enumeration
    campaigns whose absolute counts may stay under static thresholds but whose temporal shape is anomalous.
    A positive result is a statistically unexpected rise in 404s; report the forecast band and the observed
    value so the analyst can judge magnitude.
  answer_sources: *id002
  range: Last 90 days (30+ day training window)
  queries:
  - technology: ML/pseudocode
    query: "model = SARIMA(order, seasonal_order).fit(history_404_counts_per_ip_or_site)\nforecast, lo,\
      \ hi = model.predict(next_window, interval=0.99)\nif observed_404 > hi or observed_404 < lo:\n \
      \   alert(observed_404, expected=(lo,hi))\n# complementary: cusum/bocpd on 404 series -> alert on\
      \ change point"
- question: When inbound traffic is reconstructed into sessions and classified by a model, which sessions
    are scrapers/robots rather than humans, and what features drove the decision?
  context: Reconstructing per-session features — requests/session, percentage of image requests, HTML-to-image
    ratio, percentage 4xx, percentage HEAD, missing-referer rate, inter-arrival timing, and robots.txt
    access — lets a Random Forest distinguish scraper/robot sessions from human browsing (Lagopoulos et
    al.). This session-level view captures scraping campaigns that look benign request-by-request. Surfacing
    the top-3 contributing features in each alert gives explainability. A session classified as a robot
    with high confidence is evidence of automated harvesting of public content; correlating offending
    sessions with the same source IPs flagged by other methods strengthens attribution.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "sessions = reconstruct_sessions(zeek_http, idle_timeout=30m)\nmodel = RandomForest(features=[reqs_per_session,\
      \ pct_image, html_to_image,\n    pct_4xx, pct_head, missing_referer_rate, mean_inter_arrival, robots_txt_access])\n\
      for s in sessions:\n    if model.predict(s) == 'robot' and model.proba(s) > 0.8:\n        alert(s,\
      \ top3=feature_importance(model, s))"
- question: Are external IPs not on the approved secondary-DNS allowlist requesting full zone transfers
    (AXFR/IXFR), or sending malformed/over-length DNS labels against authoritative servers?
  context: A full DNS zone transfer (AXFR/IXFR, query types defined in RFC 1035) hands an adversary the
    entire mapping of an organization's hostnames — a reconnaissance jackpot. Monitoring Zeek dns.log
    for AXFR/IXFR queries from any IP not on the approved secondary-DNS allowlist yields a high-priority,
    high-fidelity alert. Additionally flagging queries whose labels exceed RFC-1035 limits (label >63
    octets, name >255 octets) surfaces malformed or encoded queries used for tunneling/evasion. A positive
    result on an unauthorized AXFR is a serious exposure requiring immediate review of DNS server ACLs;
    legitimate zone transfers should come only from allowlisted secondaries.
  answer_sources: &id003
  - Zeek dns.log
  - 'NAI: Authoritative external DNS servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'source = zeek_dns

      | where qtype_name IN ("AXFR","IXFR")

      | where NOT id.orig_h IN approved_secondary_dns

      | alert priority=high message="Unauthorized DNS zone transfer"

      ; also: source = zeek_dns | where max_label_len(query) > 63 OR len(query) > 255

      | alert message="Malformed/over-length DNS name (RFC1035 violation)"'
- question: Which source IPs sustain high subdomain (qname) Shannon entropy together with NXDOMAIN response
    ratios above 80% over five-minute windows, indicating subdomain brute-forcing?
  context: Subdomain enumeration tools generate many guessed names, producing both elevated qname Shannon
    entropy and a high proportion of NXDOMAIN (RCODE 3) responses. Tracking these per source IP over five-minute
    windows and flagging sustained entropy above baseline plus NXDOMAIN ratios over 80% captures brute-force
    enumeration using the stateless lexical features (entropy, label/character counts, unique-query ratio)
    of Nadler et al. Profiling the NXDOMAIN failure stream as a distinct subdomain-brute-force signal
    separates it from ordinary resolution failures. A positive result identifies an IP systematically
    guessing subdomains to expand the attack surface; the queried names reveal what the adversary hoped
    to find.
  answer_sources: *id003
  range: Last 90 days, evaluated over 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source = zeek_dns\n| bin _time span=5m\n| stats count as q, sum(eval(rcode_name==\"NXDOMAIN\"\
      )) as nx, dc(query) as uniq,\n    avg(shannon_entropy(query)) as ent by id.orig_h, _time\n| eval\
      \ nx_ratio = nx/q\n| eventstats avg(ent) as ent_base, stdev(ent) as ent_sd by id.orig_h\n| where\
      \ nx_ratio > 0.8 AND ent > ent_base+2*ent_sd\n| alert message=\"Subdomain brute-force (high entropy\
      \ + NXDOMAIN)\""
- question: When queried domain names are scored by a lexical decision-tree classifier on burstiness and
    n-gram features, which names are flagged as brute-forced subdomain enumeration?
  context: The EXPOSURE approach scores queried names with a decision-tree classifier (J48) over time-based
    burstiness and n-gram lexical features, achieving >98% true-positive and ~1% false-positive rates,
    with tree paths providing explainable decisions. Applied to the organization's DNS logs, it separates
    brute-forced or algorithmically generated subdomain enumeration from legitimate query patterns. Because
    the model is a decision tree, the analyst can read off exactly which features (burst timing, character
    n-grams) led to each verdict. A positive result indicates names consistent with automated enumeration;
    combine with the entropy/NXDOMAIN signal to confirm an active reconnaissance source.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = J48_DecisionTree(features=[query_burstiness, ngram_lexical_features,\n    unique_query_ratio,\
      \ time_based_features])\nfor name in queried_names:\n    if model.predict(name) == 'malicious_enumeration':\n\
      \        alert(name, decision_path=model.explain(name))"
- question: When external IPs are clustered or scored on DNS behavior features, which clusters exhibit
    high-rate, high-entropy, high-NXDOMAIN reconnaissance characteristics?
  context: Unsupervised clustering with DBSCAN (or anomaly scoring with an Isolation Forest, as in Nadler
    et al.) groups external IPs by query rate, NXDOMAIN ratio, qname entropy, and query-type distribution.
    Clusters that combine high request rate, high NXDOMAIN ratio, and high entropy represent coordinated
    reconnaissance even when no single IP trips a static threshold. Including the dominant cluster features
    (rate, NXDOMAIN %, entropy) in the alert lets the analyst understand and triage the group. A positive
    result surfaces a population of recon sources — potentially distributed enumeration — that per-IP
    rules would miss; benign resolvers cluster separately with low NXDOMAIN and entropy.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = per_ip_features([query_rate, nxdomain_ratio, qname_entropy, qtype_dist])\nlabels = DBSCAN(eps,\
      \ min_samples).fit_predict(X)   # or IsolationForest.score(X)\nfor cluster in labels:\n    if cluster.mean(nxdomain_ratio)\
      \ high and cluster.mean(entropy) high and cluster.mean(rate) high:\n        alert(cluster, dominant_features=[rate,\
      \ nxdomain_pct, entropy])"
- question: Are there failed external logons (Windows Event ID 4625) for usernames that appear on monitored
    public breach feeds within the last 90 days?
  context: Adversaries who harvest the organization's credentials from public breaches (a form of open-website
    reconnaissance) often test them against external-facing services. Cross-referencing breached-credential
    feeds (e.g., privacy-preserving breach alerting per Thomas et al.) against Windows Event ID 4625 logs
    for external services, and alerting on failed logins for breached usernames within 90 days, links
    exposure to attempted abuse using the failed-login/credential-stuffing correlation searches in Splunk
    Security Content. A positive result is a breached account being actively probed — prioritize password
    resets and MFA enforcement. A negative result suggests breached credentials are not yet being tested,
    but monitoring should continue as feeds update.
  answer_sources: &id004
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: VPN concentrators, Externally-facing authentication servers (e.g., ADFS, Exchange), Remote Desktop
    Gateway servers, Cloud Identity Providers (e.g., Azure AD)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source = WinEventLog:Security EventCode=4625 Logon_Type=3 service IN external_facing

      | eval user=lower(Account_Name)

      | lookup breach_feed username AS user OUTPUT breach_date

      | where isnotnull(breach_date) AND _time >= breach_date AND _time <= breach_date+90d

      | alert message="Failed external logon for breached username"'
- question: Is any single external source IP attempting logons against more than 10 distinct usernames
    within 10 minutes on external-facing authentication services?
  context: Per OAT-008 Credential Stuffing in OWASP Automated Threats, a hallmark of credential abuse
    is one source spraying many distinct usernames. Alerting when a single external source IP attempts
    logons against more than 10 distinct usernames within 10 minutes on external-facing auth services
    (VPN, ADFS, Exchange, RD Gateway, cloud IdP) catches stuffing and spraying regardless of breach-list
    membership. A positive result indicates broad credential testing from one origin; correlate with the
    breach-feed and rate-spike methods to assess scope. Legitimate users authenticate as one identity,
    so a high distinct-username count from a single IP is strongly anomalous.
  answer_sources: *id004
  range: Last 90 days, evaluated over 10-minute windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source = WinEventLog:Security EventCode=4625 Logon_Type=3 service IN external_facing

      | bin _time span=10m

      | stats dc(Account_Name) as distinct_users by Source_Network_Address, _time

      | where distinct_users > 10

      | alert message="Credential stuffing/spraying (many usernames, one source)"'
- question: After a breach notification, does the hourly failed-external-logon count for affected accounts
    exceed each account's baseline by more than three standard deviations, with unusual source IPs?
  context: Following a breach disclosure, attackers may surge attempts against the exposed accounts. Baselining
    hourly failed external logons per account and alerting when the post-breach hourly failure count exceeds
    the account's baseline by three standard deviations — while correlating with Zeek conn.log for unusual
    source IPs — pinpoints accounts under active attack. Treating failed (4625) versus successful (4624)
    logon counts as distinct state metrics, as Splunk Security Content recommends, avoids conflating noise
    with compromise. A positive result is a statistically significant, account-specific failure spike
    tied to new infrastructure; a corresponding 4624 success would indicate a likely takeover requiring
    immediate response.
  answer_sources: *id004
  range: Last 90 days (per-account hourly baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source = WinEventLog:Security EventCode=4625 service IN external_facing

      | bin _time span=1h

      | stats count as fails by Account_Name, _time

      | eventstats avg(fails) as base, stdev(fails) as sd by Account_Name

      | where Account_Name IN breached_accounts AND fails > base+3*sd

      | join Account_Name [ search zeek_conn | where id.orig_h NOT IN known_good_ips ]

      | alert message="Post-breach failed-logon spike with unusual source IP"'
- question: Does change-point detection on the Event ID 4625 time series for high-value or breached accounts
    reveal a sudden, sustained shift in failure rate?
  context: Static thresholds miss gradual or context-dependent shifts in attack pressure. Applying change-point
    detection (CUSUM or Bayesian Online CPD, per Aminikhanghahi and Cook) to the Event ID 4625 time series
    for high-value and breached accounts flags abrupt, sustained increases in failure rate without needing
    a fixed cutoff. Reporting the detected change time and the pre/post failure rates gives the analyst
    explainability and a precise window to investigate. A positive result marks the moment an account's
    failure pattern fundamentally changed — often the onset of targeted credential attack following reconnaissance
    — and lets the analyst correlate that timestamp with source IPs, breach-feed entries, and any successful
    4624 logons.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "series = hourly_4625_counts(account)\ncp = cusum_or_bocpd(series)\nfor change in cp.change_points:\n\
      \    pre = series.mean(before=change); post = series.mean(after=change)\n    if post > pre and sustained(post):\n\
      \        alert(account, change_time=change, pre_rate=pre, post_rate=post)"
