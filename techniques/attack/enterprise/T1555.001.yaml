    that a process executes on a macOS host, where the process''s file hash, name, or path is associated
    with known keychain enumeration malware or offensive security tools (e.g., KeySteal, Chain-Reactor).
    This Statistical Method approach works as follows: For executed processes not on the enterprise allowlist,
    compute fleet-wide prevalence and flag any process that accesses keychain files whose prevalence falls
    below 1% of macOS endpoints; rank by rarity and include the prevalence percentage and first-seen date
    in the alert. Use legitimate single-secret `security` usage as the benign denominator ([netmeister](https://www.netmeister.org/blog/keychain-passwords.html))
    and standard-deviation baselining over execution counts ([Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable Keychain
    credential access or theft; pivot to the responsible process and its parent lineage, the user and
    device context, the targeted keychain file or secret, the code-signing status and on-disk age of the
    binary, and any subsequent authenticated logons or lateral movement. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, living-off-the-land, or signed-tooling abuse.'
