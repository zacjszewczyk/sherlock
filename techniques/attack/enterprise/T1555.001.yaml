questions:
- question: '[Credential Access] Threat feed correlation for keychain tools: Can you determine whether
    a process executes on a macOS host, where the process''s file hash, name, or path is associated with
    known keychain enumeration malware or offensive security tools (e.g., KeySteal, Chain-Reactor) --
    specifically, using the ''Threat feed correlation for keychain tools'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary acquires credentials
    from the macOS Keychain credential-management system -- which stores account names, passwords, private
    keys, certificates, and sensitive application data -- to gain unauthorized access, move laterally,
    and operate with legitimate credentials that are harder to detect. This evidence focuses on the condition
    that a process executes on a macOS host, where the process''s file hash, name, or path is associated
    with known keychain enumeration malware or offensive security tools (e.g., KeySteal, Chain-Reactor).
    This Symbolic Logic approach works as follows: Join macOS process-execution events (Sysmon for macOS
    Event ID 1 or Apple [Endpoint Security](https://developer.apple.com/documentation/endpointsecurity)
    exec events) with threat-intelligence feeds of known keychain-theft hashes/process names and alert
    on any match. Enrich with code-signing status and responsible UID from ESF, and treat unsigned binaries
    running from user-writable paths (e.g., `~/Downloads`, `/tmp/`) with abnormal parents as high severity
    per macOS info-stealer tradecraft ([The Mac Malware of 2017](https://objective-see.org/blog/blog_0x25.html),
    [The Art of Mac Malware](https://taomm.org/)). Validate with [Atomic Red Team T1555.001](https://www.atomicredteam.io/docs/atomics/T1555.001).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable Keychain
    credential access or theft; pivot to the responsible process and its parent lineage, the user and
    device context, the targeted keychain file or secret, the code-signing status and on-disk age of the
    binary, and any subsequent authenticated logons or lateral movement. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, living-off-the-land, or signed-tooling abuse.'
