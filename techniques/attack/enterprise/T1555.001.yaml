name: 'T1555.001: Keychain'
id: 2a5822a8-bb12-4890-896b-57a0a058af27
description: 'This playbook helps an analyst investigate whether an adversary has accessed or stolen credentials
  from macOS Keychain (Login, System, or Local Items/iCloud Keychain) as part of the Credential Access
  tactic, potentially leading to unauthorized network access and lateral movement. Keychain stores account
  names, passwords, private keys, certificates, sensitive application data, payment data, and secure notes,
  and lives in keychain database files under ~/Library/Keychains/, /Library/Keychains/, and /Network/Library/Keychains/.
  The hunt spans several behavioral angles: execution of known keychain-enumeration malware or offensive
  tools matched by hash, name, or path against threat intelligence (e.g., KeySteal, Chain-Reactor); misuse
  of the /usr/bin/security command-line utility with credential-dumping arguments such as dump-keychain,
  find-generic-password, and find-internet-password (especially with -d or spawned by unexpected parents
  like browsers, document editors, or osascript); anomalous, unsigned, or recently compiled applications
  running from user-writable paths (e.g., /tmp/) invoking keychain APIs such as SecItemCopyMatching or
  triggering SecurityAgent unlock prompts; and the downstream consequences of stolen credentials -- anomalous
  network authentications (Kerberos, NTLM, RADIUS) from unexpected source IPs, ASNs, or times for macOS
  users, and post-logon lateral-movement tooling (psexec.exe, wmic.exe, obfuscated PowerShell) on target
  Windows hosts. Detection methods combine symbolic-logic rules, statistical baselining/prevalence/anomaly
  scoring, and machine-learning models applied to Sysmon for macOS / Apple Endpoint Security execution
  events, macOS Unified Log Security/SecurityAgent subsystems, EDR API-monitoring logs, Windows Security
  and Sysmon events, PowerShell script-block logs, and Zeek conn/kerberos/dce_rpc logs, so the analyst
  can corroborate suspected Keychain credential theft against process lineage, command-line and API usage,
  file and credential read volume, and subsequent authenticated session reuse and lateral movement.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
