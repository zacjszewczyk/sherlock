name: 'T1021: Remote Services'
id: 82ae704e-f8b9-401d-9b45-db540bfb0357
description: Investigate potential adversary lateral movement performed through legitimate remote services
  such as RDP, SSH, WinRM, VNC, Apple Remote Desktop, cloud bastion/VM console sessions, and ESXi/vSphere
  management interfaces. This playbook helps an analyst hunt for remote service logins that originate
  from compromised or suspicious hosts, post-login execution of lateral-movement tooling and discovery
  bursts, first-time or statistically rare source/destination/user access tuples, credential switches
  along reconstructed login paths, pivot hosts that fan out to many internal systems, and remote-service
  protocols riding on non-standard or rarely used ports. It combines deterministic watchlist and allow-list
  rules, statistical baselining (spikes, rarity, failed-logon profiling, command entropy), and machine
  learning (supervised classification, sequence/LSTM modeling, clustering, temporal graph link prediction,
  and autoencoders) so an analyst can confirm whether observed remote access represents legitimate administration
  or an adversary moving through the environment with valid accounts.
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any successful remote service login (RDP Logon Type 10, network Logon Type 3, WinRM, or
    SSH 'Accepted') originate from an internal IP address or hostname that is currently on the watchlist
    of known-compromised or suspicious systems?
  context: Lateral Movement (TA0008) frequently launches from a host the adversary already controls. Maintain
    a dynamic watchlist of internal IPs/hostnames tied to confirmed malicious activity and continuously
    match it against successful remote logins (Windows Event ID 4624 Logon Type 10 RDP / Type 3 network
    / WinRM, and Linux sshd 'Accepted') as well as Zeek conn.log connections to remote-service ports (3389,
    22, 5985, 5986, 5900). A positive match is high-confidence evidence of pivoting from a known-bad origin;
    enrich the alert with the correlated Logon ID so the analyst can trace follow-on process execution.
    A negative result lowers the chance of staging from currently-known hosts but cannot exclude an unknown
    foothold.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication logs on Domain Controllers, Network traffic logs from core switches and perimeter
    firewalls, Security event logs on Tier 0/1 servers and Privileged Access Workstations (PAWs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "login = (EventID==4624 AND LogonType IN (3,10)) OR (sshd_msg==\"Accepted\")\nif login.SourceIP\
      \ IN watchlist OR login.SourceHost IN watchlist:\n  alert(severity=\"high\", enrich=login.LogonID)"
  - technology: Zeek/pseudocode
    query: "conn where id.resp_p in {3389,22,5985,5986,5900}\n  and id.orig_h in watchlist_ips -> alert(high,\
      \ fields: id.orig_h,id.resp_h,id.resp_p)"
- question: Has any watchlist host produced a statistically significant spike (>3 standard deviations
    above its 30-day baseline) in hourly outbound remote-service connection count or outbound byte volume?
  context: Beyond a single match, sudden surges in a watchlist host's remote-service activity indicate
    active lateral movement. Build a 30-day per-host baseline (mean, standard deviation) of hourly outbound
    remote-service connection counts and byte volume, then recompute for each trailing hour. Trigger when
    either metric exceeds the mean by more than ~3 sigma (tune the multiplier per environment against
    the 99th-percentile false-positive rate). A spike signals the host is suddenly reaching out far more
    than normal, consistent with fan-out pivoting; quiet hosts produce no alert and keep volume manageable.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication logs on Domain Controllers, Network traffic logs from core switches and perimeter
    firewalls, Security event logs on Tier 0/1 servers and Privileged Access Workstations (PAWs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = stats(count, sum(bytes_out)) by host, hour over 30d -> mean, stddev\nfor each host,\
      \ trailing_hour:\n  if count > mean_c + 3*std_c OR bytes_out > mean_b + 3*std_b: alert"
- question: Did a watchlist host generate a burst of failed remote logons against many distinct accounts
    followed by a single success (success-after-failure) within a 15-minute window?
  context: Failure state is its own signal. Count failed remote logons (Windows Event ID 4625, sshd 'Failed
    password', blocked firewall connections) and distinct targeted accounts per source over a 15-minute
    sliding window. A spike of failures across many accounts followed by one success is the classic password-spray-then-succeed
    pattern that precedes movement. Tune distinct-account thresholds per the Splunk password-spraying
    methodology. A positive result strongly suggests credential guessing succeeded from a suspect host;
    absence of the pattern argues against brute-force-driven access.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication logs on Domain Controllers, Network traffic logs from core switches and perimeter
    firewalls, Security event logs on Tier 0/1 servers and Privileged Access Workstations (PAWs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'window=15m sliding by source

      failed = count(EventID==4625 OR sshd=="Failed password")

      distinct_acct = dc(target_account)

      if failed > threshold AND distinct_acct > N AND later success(EventID==4624): alert'
- question: When scored by a supervised classifier trained on known-bad remote access events, do new connections
    from watchlist hosts classify as malicious, and what top features drive that score?
  context: Train a supervised model (e.g., Random Forest) on historical remote access events, labeling
    those from known-bad hosts as malicious, using count/ratio features (source/destination subnet, distinct
    destinations, success/fail ratio, user privilege, time-of-day, protocol). Score new watchlist-host
    connections in real time and surface the top-3 contributing features (destination rarity, failed-logon
    ratio, off-hours flag) in the alert rather than a bare score, so the analyst can validate the verdict.
    Validate against labeled red-team logins (LANL dataset). A high malicious probability with intuitive
    drivers warrants investigation; a benign score with stable features supports normal administration.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication logs on Domain Controllers, Network traffic logs from core switches and perimeter
    firewalls, Security event logs on Tier 0/1 servers and Privileged Access Workstations (PAWs).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = RandomForest.train(features=[src_subnet,dst_subnet,distinct_dst,succ_fail_ratio,priv,hour,proto],
      label=known_bad)

      score = model.predict_proba(new_conn)

      if score > 0.8: alert(top3_features=model.explain(new_conn))'
- question: Within 5 minutes of a successful remote login, did a process matching known lateral-movement
    tooling or suspicious command-line patterns execute on the same host under the same Logon ID?
  context: Correlate successful remote logins (Event ID 4624 Logon Type 3 or 10, sharing the Logon ID)
    with subsequent process creation (Event ID 4688 / Sysmon Event ID 1) on the same host within a 5-minute
    window. Scan process names/command lines against regexes for lateral-movement tooling (psexec.exe,
    paexec.exe, wmic.exe, wmiprvse.exe spawning cmd.exe, schtasks.exe, sc.exe, at.exe) and suspicious
    patterns (powershell.exe -enc, -w hidden; net.exe use \\\\). A match strongly indicates hands-on-keyboard
    movement immediately after access; no match suggests the login was not followed by known tooling in
    the watched window.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - 'NAI: Process and command-line logs on Domain Controllers, Member Servers, Application Servers, and
    Privileged Access Workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'login(4624 Type 3|10) -> capture LogonID, host

      proc(4688|Sysmon1) within 5m same LogonID, host

      if proc.name ~ /psexec|paexec|wmic|schtasks|sc|at/ OR cmdline ~ /-enc|-w hidden|net use \\/: alert'
- question: Did three or more distinct host/network discovery commands (whoami, net, nltest, ipconfig,
    arp, quser) execute under a single remote Logon ID within the 5-minute post-login window?
  context: Adversaries orient themselves immediately after gaining access. Within the 5-minute post-login
    window, count execution of discovery binaries (whoami.exe, net.exe, nltest.exe, ipconfig.exe, arp.exe,
    quser.exe) under one remote Logon ID. Three or more distinct discovery commands is a deterministic
    reconnaissance signal that precedes the rare-edge lateral movement modeled in Hopper. A positive result
    indicates likely interactive reconnaissance by an operator; legitimate administrative logins seldom
    fire a tight burst of varied discovery tools.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - 'NAI: Process and command-line logs on Domain Controllers, Member Servers, Application Servers, and
    Privileged Access Workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'login -> LogonID

      disc = count_distinct(proc.name in {whoami,net,nltest,ipconfig,arp,quser}) within 5m same LogonID

      if disc >= 3: alert'
- question: Did any command line executed within 5 minutes of a remote login exhibit Shannon entropy above
    the 95th percentile of the host-role baseline, suggesting obfuscation or encoding?
  context: Encoded or obfuscated commands often follow remote access. For each command line executed within
    5 minutes of a remote login, compute Shannon entropy and length, and compare against a per-host-role
    baseline distribution of legitimate administrative commands. Alert when entropy exceeds the 95th percentile
    (derive the cutoff per dataset). High-entropy command lines frequently indicate base64/encoded payloads
    or packed scripts; normal admin commands cluster at lower entropy, so a breach of the threshold is
    a meaningful obfuscation signal worth decoding and investigating.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - 'NAI: Process and command-line logs on Domain Controllers, Member Servers, Application Servers, and
    Privileged Access Workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline entropy dist by host_role over 30d -> p95\nfor cmd within 5m of login:\n  if shannon_entropy(cmd)\
      \ > p95(host_role): alert(cmd, entropy)"
- question: Does the sequence of events following a remote login deviate from the learned normal next-event
    model (LSTM/transformer), and which events are the most improbable?
  context: Model normal post-login event-key sequences with an LSTM next-event predictor that flags any
    event outside the top-g predicted keys (DeepLog), or a self-supervised transformer over auth/host-log
    sequences. Train per user role on first-party Sysmon/4688 data. The alert must list the top-3 most-improbable
    events in the flagged sequence (e.g., unexpected whoami.exe, net.exe, encoded PowerShell) so the analyst
    can judge relevance. Sequence anomalies capture novel tool combinations and ordering that signature
    rules miss; a tightly-predicted sequence indicates routine activity.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - 'NAI: Process and command-line logs on Domain Controllers, Member Servers, Application Servers, and
    Privileged Access Workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = LSTM.train(post_login_event_keys per role)\nfor seq after login:\n  improbable = [e\
      \ for e in seq if e not in model.topg(prev)]\n  if improbable: alert(top3=improbable[:3])"
- question: Is this successful remote login the first time the (user, source_host, destination_host, protocol)
    tuple has been observed in the last 90 days?
  context: Maintain a stateful table of all historical remote access tuples (user, source_host, destination_host,
    protocol) over the last 90 days. For each new successful remote login, query the table; if the tuple
    is absent, raise a 'first-time access' alert. First-time edges are the low-volume, high-signal core
    of Hopper's lateral-movement detection and are evaluable on the LANL dataset. A novel tuple is suspicious
    because adversaries traverse paths legitimate users never use; an existing tuple reflects established,
    expected access.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication logs from Domain Controllers and member servers, VPN concentrator logs, Cloud
    IaaS access logs, and network flow data from all internal network segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'tuple = (user, src_host, dst_host, proto)

      if tuple NOT IN history_90d: alert("first-time remote access", tuple)

      else: update_lastseen(tuple)'
- question: Along a reconstructed causal login path, does the user account on an outbound remote login
    differ from the path's originating user, indicating a credential switch?
  context: 'Reconstruct causal login paths by chaining logins where a destination host''s inbound session
    is followed by an outbound remote login within a short window. Alert when the account on the outbound
    hop differs from the path''s originating user. This credential switch is Hopper''s second core lateral-movement
    signal: adversaries commonly pivot then use a different (often more privileged) credential, which
    legitimate self-service rarely does. A detected switch is strong evidence of credential abuse during
    movement; consistent identity along the path is benign.'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication logs from Domain Controllers and member servers, VPN concentrator logs, Cloud
    IaaS access logs, and network flow data from all internal network segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'path = chain(inbound_login(host) -> outbound_login(host) within W)

      if path.outbound.user != path.origin.user: alert("credential switch", path)'
- question: On the authentication graph, does a new login traverse an edge whose frequency falls in the
    top 2% rarest (98th percentile) over the 30-day rolling window?
  context: Construct an authentication graph (nodes = users and hosts, edges = successful remote logins)
    weighted by edge frequency over a 30-day rolling window. For each new login, compute rarity as inverse
    edge frequency and alert when it lands in the top 2% rarest connections (CyberGraph edge-rarity scoring,
    with Bian et al. host/user count features). Rare edges represent unusual user-to-host or host-to-host
    access characteristic of pivoting; high-frequency edges are routine. The graph view catches rarity
    that per-host stats miss.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication logs from Domain Controllers and member servers, VPN concentrator logs, Cloud
    IaaS access logs, and network flow data from all internal network segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "graph edges = logins weighted by freq over 30d\nfor new_login edge e:\n  rarity = 1/freq(e)\n\
      \  if percentile(rarity) >= 98: alert(e, freq(e))"
- question: When user remote-access behavior is clustered (e.g., DBSCAN), does a new login classify the
    user as a noise/outlier point, and which features drive the deviation?
  context: Apply unsupervised clustering (DBSCAN) to feature vectors of user remote-access behavior (set
    of destination hosts, protocols, time-of-day distribution, session duration). A login that makes the
    user a 'noise' point indicates behavioral deviation; report the top-3 features driving the outlier
    distance. Combine with PCA/k-means/MAD host-communication detectors (Bohara et al.) for an ensemble
    vote. Outlier behavior suggests the account is being used in ways inconsistent with its history, a
    hallmark of compromise; cluster membership reflects normal behavior.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication logs from Domain Controllers and member servers, VPN concentrator logs, Cloud
    IaaS access logs, and network flow data from all internal network segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = features(user: dst_set, protos, hour_dist, duration)

      labels = DBSCAN.fit(X)

      if label(new_login)==noise: alert(top3_features=outlier_drivers(new_login))'
- question: After receiving a remote login, did an internal host initiate remote-service connections to
    more than 5 unique internal destinations within 60 minutes?
  context: Pivot hosts fan out. Trigger when a host receives a remote login (Event ID 4624 Logon Type
    10, sshd Accepted, or Zeek inbound to a remote-service port), then over the next 60 minutes count
    unique internal destination IPs it connects to on remote-service ports {3389,22,5985,5986,5900,135}.
    If the count exceeds a hard floor of 5, alert for fan-out pivoting (the abnormal host-communication
    fan-out from Bohara et al.). Crossing the floor indicates one host suddenly behaving like a jump box;
    a host that contacts few destinations is consistent with normal use.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network traffic sensors capturing East-West traffic at VLAN or subnet boundaries, network flow
    logs, and endpoint security logs across all server and workstation segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on inbound_login(host):\n  dsts = distinct(dst_ip) where proto_port in {3389,22,5985,5986,5900,135}\
      \ within 60m\n  if count(dsts) > 5: alert(\"fan-out pivot\", host, dsts)"
- question: Does a host's count of unique outbound remote-service destinations or connection volume in
    a 60-minute window exceed the 99th percentile of its own 30-day baseline?
  context: Profile each host's distribution of unique outbound remote-service destinations and total connection
    volume per 60-minute window over 30 days. Alert when a window exceeds the host's own 99th percentile
    (volume + frequency). Per-host baselining accounts for legitimately busy admin hosts while still catching
    abnormal bursts; tune the percentile per environment to hold the false-positive rate. A breach indicates
    the host is suddenly far more active than its norm, consistent with lateral movement; staying within
    baseline is expected behavior.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network traffic sensors capturing East-West traffic at VLAN or subnet boundaries, network flow
    logs, and endpoint security logs across all server and workstation segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = dist(distinct_dst, volume) per host per 60m over 30d -> p99\nfor each host window:\n\
      \  if distinct_dst > p99_dst OR volume > p99_vol: alert"
- question: Is a pivot host generating a burst of failed or blocked outbound remote-service attempts to
    many internal hosts, indicating scanning/spraying ahead of movement?
  context: Failure mode again. Count failed/blocked outbound remote-service attempts (Event ID 4625 on
    targets sharing the source Logon ID, sshd 'Connection refused', Zeek conn_state S0/REJ, firewall denies)
    from the pivot host. A burst of failed attempts to many internal hosts signals scanning or spraying
    before successful movement (Splunk failed-logon analytics). A positive result reveals reconnaissance/credential
    testing from the host even before any success; a quiet failure profile argues against active probing.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network traffic sensors capturing East-West traffic at VLAN or subnet boundaries, network flow
    logs, and endpoint security logs across all server and workstation segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fails = count(4625 same LogonID OR sshd "Connection refused" OR conn_state in {S0,REJ} OR
      fw_deny) by src within W

      targets = distinct(dst)

      if fails > baseline AND targets > N: alert("failed pivot burst")'
- question: Using temporal link prediction on the evolving authentication graph, do a host's observed
    outbound fan-out edges have low predicted probability, marking them as anomalous?
  context: Treat lateral movement as anomalous-edge detection on an evolving authentication graph and
    use temporal link prediction (a GNN over an RNN sequence encoder, e.g., EULER) to predict expected
    outbound edges per hour. Flag hosts whose observed fan-out edges have low predicted probability, and
    surface the top-3 lowest-probability destination edges in the alert text. Unexpected edges reflect
    access the temporal model never anticipated from learned patterns, capturing novel pivots; well-predicted
    edges represent routine connectivity.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network traffic sensors capturing East-West traffic at VLAN or subnet boundaries, network flow
    logs, and endpoint security logs across all server and workstation segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = EULER.train(auth_graph_timeseries)\nfor host, hour:\n  preds = model.predict_edges(host)\n\
      \  low = [e for e in observed(host) if preds[e] < tau]\n  if low: alert(top3=sorted(low)[:3])"
- question: Is any internal remote-service traffic using a protocol on a non-standard port, or using a
    remote-service port that is not on the approved allow-list?
  context: Define an explicit allow-list of approved (protocol, port) pairs for remote services. Use Zeek
    protocol analyzers (ssh.log, rdp.log, dce_rpc.log) to detect a remote-service protocol on a non-standard
    port, and monitor conn.log for remote-service ports (5985/5986 WinRM, 5900 VNC) not on the allow-list.
    Alert on any deviation; JPCERT protocol-to-port and tool-port mappings inform the baseline. Off-port
    remote services often indicate evasion or tooling that ignores conventions; allow-listed traffic on
    expected ports is normal administration.
  answer_sources:
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Zeek dce_rpc.log
  - 'NAI: Network Security Monitoring sensors at key network chokepoints, core switches, datacenter firewalls,
    and VPC flow logs in cloud environments.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'ssh.log|rdp.log|dce_rpc.log: if service_proto detected AND id.resp_p NOT IN std_port(proto):
      alert

      conn.log: if id.resp_p in {5985,5986,5900,...} AND (proto,port) NOT IN allowlist: alert'
- question: Across internal-to-internal traffic, is a remote-service destination port statistically rare
    (used fewer than 10 times enterprise-wide or below the 1st percentile of port prevalence)?
  context: Over a 30-day baseline, compute the enterprise-wide frequency of every destination port in
    internal-to-internal communications. Flag remote-service ports that are statistically rare (fewer
    than 10 uses enterprise-wide, or below the 1st percentile of port prevalence) as candidate unauthorized/adversarial
    tooling (CyberGraph rarity scoring). Rarely-used ports are unlikely to be sanctioned services and
    often reveal custom or covert remote tooling; common ports are part of normal operations.
  answer_sources:
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Zeek dce_rpc.log
  - 'NAI: Network Security Monitoring sensors at key network chokepoints, core switches, datacenter firewalls,
    and VPC flow logs in cloud environments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "port_freq = count by dst_port over 30d internal->internal\nfor remote_service_port p:\n  if\
      \ port_freq[p] < 10 OR percentile(port_freq[p]) < 1: alert(p)"
- question: Is a source host producing a burst of REJ/S0/RSTR Zeek connection states or firewall denies
    on remote-service ports that deviates from its baseline?
  context: 'Profile connection state as a failure-mode signal: baseline the rate of Zeek conn.log REJ/S0/RSTR
    states and firewall denies on remote-service ports per source host. Alert on bursts of blocked/failed
    remote-service connections that deviate from baseline, distinguishing reconnaissance and tunneling
    attempts from established sessions (analogous to failed-logon profiling). Many half-open or rejected
    attempts indicate probing or misdirected tooling before a successful pivot; a stable, low failure
    rate reflects normal connectivity.'
  answer_sources:
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Zeek dce_rpc.log
  - 'NAI: Network Security Monitoring sensors at key network chokepoints, core switches, datacenter firewalls,
    and VPC flow logs in cloud environments.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'baseline rate(conn_state in {REJ,S0,RSTR} on remote_ports) per src over 30d

      for src window: if rate > baseline + k*stddev OR fw_deny burst: alert'
- question: When new internal connections are scored by an autoencoder, does reconstruction error spike
    (indicating non-standard port use or protocol tunneling), and which features drive the residual?
  context: Train an autoencoder on feature vectors of normal internal connections (source/destination
    subnet, destination port, protocol, duration, byte counts in/out, packet counts). Score new connections
    by reconstruction error; high error signifies deviation indicative of non-standard port use or protocol
    tunneling. Report the top-3 features with the largest reconstruction residual in the alert, and validate
    against labeled LANL flows. High reconstruction error means the connection does not resemble learned
    normal traffic, capturing tunneling and odd-port use; low error indicates a typical flow.
  answer_sources:
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Zeek dce_rpc.log
  - 'NAI: Network Security Monitoring sensors at key network chokepoints, core switches, datacenter firewalls,
    and VPC flow logs in cloud environments.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'ae = Autoencoder.train(features=[src_subnet,dst_subnet,dst_port,proto,duration,bytes_in,bytes_out,pkts])

      err = ae.reconstruction_error(new_conn)

      if err > threshold: alert(top3_residual=ae.top_residuals(new_conn))'
