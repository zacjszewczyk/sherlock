name: 'T1542.003: Pre-OS Boot: Bootkit'
id: 7a9193df-4d29-44ec-be75-f5f9c3a59d87
description: 'This playbook helps an analyst investigate whether an adversary is establishing pre-OS-boot
  persistence and concealment via a bootkit (T1542.003) -- malicious code that modifies the Master Boot
  Record (MBR), Volume Boot Record (VBR), or the UEFI EFI System Partition (ESP) so it executes before
  the operating system and below most security controls. It guides the hunt across complementary behavioral
  angles on Windows and Linux: the writing of files whose hashes match known bootkit installers/components,
  revoked/downgraded boot binaries (UEFI dbx, vulnerable bootmgr/bootmgfw abused by BlackLotus), or any
  PE landing in an ESP/boot path that is not on a per-model golden allowlist; command-line use of boot
  utilities (bootsect.exe, bcdedit.exe, dd, debug.exe, grub-install, efibootmgr) to edit the MBR/VBR or
  boot configuration; non-standard processes obtaining raw write access to a physical disk and then forcing
  a shutdown/restart, including BYOVD driver-load precursors; unauthorized or statistically unusual writes
  to the ESP and bootloader files; outbound connections to known bootkit C2 (by IP/domain/URL and JA3/JA3S)
  or pre-logon boot-window traffic to unapproved destinations; command-line disabling of Secure Boot,
  driver-signature enforcement, or PatchGuard corroborated with attestation/Measured-Boot signals; and
  cross-view ''ghost connection'' discrepancies where network telemetry shows flows that host process
  telemetry cannot attribute -- a hallmark of below-the-OS concealment. Detection methods combine symbolic-logic
  rules, statistical baselining, and machine-learning models applied to Sysmon (Event IDs 1, 3, 6, 9,
  11, 23), Windows Event Logs (4688, 1074, 6005, 4624), auditd/linux syslog, and Zeek conn/dns/ssl/files
  telemetry, so the analyst can corroborate suspected bootkit activity against process lineage, low-level
  disk access, boot-chain integrity, and network context.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0003
  tactic_name: Persistence
