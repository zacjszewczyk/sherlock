    fails to attribute that connection to any running process -- specifically, using the ''Hunt for ghost
    connections'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary uses a bootkit to gain below-the-OS
    persistence and stealth by tampering with the boot process (MBR/VBR or the UEFI ESP), so malicious
    code runs before the OS and most defenses load. This evidence focuses on the condition that a discrepancy
    exists where network logs show an active outbound connection from a host, but host-level process or
    network telemetry fails to attribute that connection to any running process. This Symbolic Logic approach
    looks for the following signal: Left-join Zeek conn.log to Sysmon Event ID 3 per host/time window
    and alert on unmatched Zeek rows; corroborate with a cross-view differential (network-visible-but-host-invisible)
    which, like kernel cross-view rootkit detection ([Petroni et al. spec-based](https://www.usenix.org/legacy/event/sec06/tech/full_papers/petroni/petroni.pdf),
    [Copilot](https://www.usenix.org/legacy/event/sec04/tech/full_papers/petroni/petroni.pdf)), reveals
    concealment below the OS. A positive result -- a rule match, statistical outlier, or model alert --
    indicates that the boot path, low-level disk, boot-security configuration, or boot-time network behavior
    deviates from sanctioned maintenance and the expected secure-boot chain; pivot to the responsible
    process and its parent lineage, the user/role and host criticality, the specific boot artifact or
    device touched, boot-attestation/Measured-Boot state, and any associated network activity. A negative
    result helps rule out this bootkit vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, signed, or living-off-the-land boot tampering that
    hides below the OS.'
