questions:
- question: '[Stealth] Bootkit-hash and golden-image correlation: Can you determine whether a file with
    a hash matching a known bootkit installer or component is written to an endpoint file system or EFI-related
    path -- specifically, using the ''Bootkit-hash and golden-image correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary uses a bootkit to gain below-the-OS
    persistence and stealth by tampering with the boot process (MBR/VBR or the UEFI ESP), so malicious
    code runs before the OS and most defenses load. This evidence focuses on the condition that a file
    with a hash matching a known bootkit installer or component is written to an endpoint file system
    or EFI-related path. This Symbolic Logic approach looks for the following signal: Compare file hashes
    from Zeek files.log, Sysmon Event ID 11, and Windows Event ID 4688 against TI for known bootkit installers/components
    AND against revoked or downgraded boot-binary hashes (the UEFI dbx and old vulnerable-but-signed bootmgr/bootmgfw
    versions abused by [BlackLotus](https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/));
    additionally alert when ANY PE is written to an ESP or boot path whose hash is not on the per-model
    known-good (golden) allowlist required by [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf).
    State: record whether the write completed vs was blocked by FIM/CI. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates that the boot path, low-level disk, boot-security
    configuration, or boot-time network behavior deviates from sanctioned maintenance and the expected
    secure-boot chain; pivot to the responsible process and its parent lineage, the user/role and host
    criticality, the specific boot artifact or device touched, boot-attestation/Measured-Boot state, and
    any associated network activity. A negative result helps rule out this bootkit vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, signed,
    or living-off-the-land boot tampering that hides below the OS.'
  answer_sources: &id001
  - Zeek files.log
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - 'NAI: Internet Gateway, Email Gateway, Endpoint File Systems, Server File Systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Bootkit-hash and golden-image correlation\nsource IN [Zeek files.log, Windows Event ID 4688,\
      \ Sysmon Event ID 11]\n| WHERE matches_action_criteria(\"Bootkit-hash and golden-image correlation\"\
      )\n// Compare file hashes from Zeek files.log, Sysmon Event ID 11, and Windows Event ID 4688 against\
      \ TI for known bootkit installers/components AND against \n| ALERT enrich(host, user, process, parent,\
      \ file, dest, boot_state)"
  - technology: Zeek/pseudocode
    query: '# bootkit network/file correlation

      conn.log, dns.log, ssl.log, files.log

      | JOIN host boot/process context on (id.orig_h, time-window)

      | AGG dest rarity, JA3/JA3S, NXDOMAIN, beacon jitter, file hashes

      | flag matches to bootkit TI / rare boot-time flows per action criteria'
- question: '[Stealth] Bootkit prevalence and entropy baseline: Can you determine whether a file with
    a hash matching a known bootkit installer or component is written to an endpoint file system or EFI-related
    path -- specifically, using the ''Bootkit prevalence and entropy baseline'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary uses a bootkit to gain below-the-OS
    persistence and stealth by tampering with the boot process (MBR/VBR or the UEFI ESP), so malicious
    code runs before the OS and most defenses load. This evidence focuses on the condition that a file
    with a hash matching a known bootkit installer or component is written to an endpoint file system
    or EFI-related path. This Statistical Method approach looks for the following signal: Baseline enterprise-wide
    prevalence and Shannon entropy of written executables ([Costin et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf)).
    Alert when a hash is seen on only one host or in the bottom 1% of sightings, OR when entropy exceeds
    the 98th percentile (commonly >7.2 for packed/encrypted boot payloads). Volume metric: file size;
    Frequency metric: boot-path writes per host per day flagged via role-aware mean+k*sigma ([Dwyer &
    Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)). A positive result --
    a rule match, statistical outlier, or model alert -- indicates that the boot path, low-level disk,
    boot-security configuration, or boot-time network behavior deviates from sanctioned maintenance and
    the expected secure-boot chain; pivot to the responsible process and its parent lineage, the user/role
    and host criticality, the specific boot artifact or device touched, boot-attestation/Measured-Boot
    state, and any associated network activity. A negative result helps rule out this bootkit vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    signed, or living-off-the-land boot tampering that hides below the OS.'
  answer_sources: *id001
  range: Last 90 days (baseline 30+ days; evaluate per-host/day windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Bootkit prevalence and entropy baseline

