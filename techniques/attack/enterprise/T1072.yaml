name: 'T1072: Software Deployment Tools'
id: f47a45e3-3b65-4381-8143-1818d1bd55db
description: 'This playbook helps an analyst determine whether an adversary has abused centralized software
  deployment and configuration-management tooling (T1072) — such as SCCM, Microsoft Intune, AWS Systems
  Manager, Azure Arc, GCP Deployment Manager, JAMF/Munki MDM, Puppet/Chef/Ansible, and network-device
  managers like FortiManager/Cisco Prime — to execute commands (Execution) and move laterally (Lateral
  Movement) across the enterprise and cloud. It correlates deployment-tool logs with endpoint telemetry
  (Windows Event ID 4688 process creation, 4104 PowerShell script blocks, 4624/4625 logons, 7045 service
  installs, auditd execve, macOS unified log/JAMF) and network telemetry (Zeek conn.log/files.log, NSM
  flow, AWS CloudTrail SSM RunCommand). Investigative angles include: deployed packages matching malicious
  hashes or running as unsigned SYSTEM binaries; obfuscated or lateral-movement command lines (encoded
  PowerShell, psexec, winrs, wmic /node, schtasks /s); deployments initiated by anomalous accounts, source
  IPs, or times; small selective ''island-hopping'' targeting across high-value tiers; and suspicious
  post-deployment service creation, persistence, or C2 egress. Detection blends symbolic-logic allow-list/regex/threat-intel
  rules, statistical baselining (entropy, n-gram rarity, percentile and change-point analysis), and machine
  learning (Random Forest/Gradient Boosting static classifiers, BERT command-line embeddings with Isolation
  Forest/autoencoder, DeepLog sequence models, and provenance-graph autoencoders) to produce explainable,
  evasion-resistant alerts.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
- tactic_id: TA0008
  tactic_name: Lateral Movement
