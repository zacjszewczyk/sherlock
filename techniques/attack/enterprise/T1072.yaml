    Event ID 4104) associated with deployment jobs. Search for high-fidelity patterns such as ''powershell
    -enc'', ''IEX(New-Object Net.WebClient).DownloadString'', and credential-dumping commands like ''reg
    save HKLM\\SAM'', reusing the field logic of the SigmaHQ encoded-PowerShell rule [Suspicious Encoded
    PowerShell Command Line (SigmaHQ)](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd/).
    Alert on any match.'
