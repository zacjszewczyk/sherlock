questions:
- question: 'Using deterministic rule logic, can you determine whether the following indicator of Software
    Deployment Tools (T1072) under the Execution tactic is present? Specifically: Query deployment tool
    logs and process creation events (Windows Event ID 4688) to extract file hashes (SHA256) and executable
    names. Correlate these observables against a threat intelligence feed of known malicious indicators.
    Generate an alert for any match. As a deterministic floor that does not depend on external lookups,
    also alert when a deployment agent (ccmexec.exe, IntuneManagementExtension.exe, amazon-ssm-agent)
    launches an UNSIGNED child binary as SYSTEM, or pushes a package whose byte size deviates >3x from
    the median for that package family, mirroring documented SaaS/cloud deployment abuse where signed
    agents deliver attacker payloads [Death from Above: Lateral Movement from Azure to On-Prem AD](https://posts.specterops.io/death-from-above-lateral-movement-from-azure-to-on-prem-ad-d18cb3959d4d),
    [Abusing the SSM Agent as a Remote Access Trojan](https://www.mitiga.io/blog/mitiga-security-advisory-abusing-the-ssm-agent-as-a-remote-access-trojan).'
  context: 'Tactic context (Execution): this evidence supports the mission question "Has the adversary
    executed commands using software deployment tools?". Evidence under investigation: A software package
    deployed by a centralized management tool has a file hash or name that matches a known malicious indicator,
    or is an unsigned/anomalously-sized binary executed in SYSTEM context by a deployment agent. Method
    (Symbolic Logic): Query deployment tool logs and process creation events (Windows Event ID 4688) to
    extract file hashes (SHA256) and executable names. Correlate these observables against a threat intelligence
    feed of known malicious indicators. Generate an alert for any match. As a deterministic floor that
    does not depend on external lookups, also alert when a deployment agent (ccmexec.exe, IntuneManagementExtension.exe,
    amazon-ssm-agent) launches an UNSIGNED child binary as SYSTEM, or pushes a package whose byte size
    deviates >3x from the median for that package family, mirroring documented SaaS/cloud deployment abuse
    where signed agents deliver attacker payloads [Death from Above: Lateral Movement from Azure to On-Prem
    AD](https://posts.specterops.io/death-from-above-lateral-movement-from-azure-to-on-prem-ad-d18cb3959d4d),
    [Abusing the SSM Agent as a Remote Access Trojan](https://www.mitiga.io/blog/mitiga-security-advisory-abusing-the-ssm-agent-as-a-remote-access-trojan).
    A positive result indicates adversary abuse of centralized software deployment/configuration-management
    tooling (e.g., SCCM, Intune, AWS SSM, JAMF, Puppet/Chef/Ansible, FortiManager) to execute code or
    move laterally; a negative result means the observed deployment activity matches authorized operators,
    packages, timing, and targets. Pivot from any hit to the initiating account, source host/IP, deployment
    job ID, target asset tier, and any downstream process, service-install, persistence, or egress activity
    within the named area of interest.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - 'NAI: SCCM/Intune Management Servers, All Corporate Endpoints and Servers, SIEM/Log Aggregator'
  range: Last 90 days (correlate post-deployment activity within a 5-minute event-centered window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic rule for: Query deployment tool logs and process creation events (Windows\
      \ Event ID 4688) to extract file hashes (SHA256) and executable names\nINPUT deployment_tool_logs,\
      \ proc_creation(4688), powershell(4104), service_install(7045), zeek_conn, cloudtrail\nMATCH events\
      \ WHERE initiated_by_deployment_agent(parent_image IN ['ccmexec.exe','IntuneManagementExtension.exe','amazon-ssm-agent','jamf','puppet','chef','ansible'])\n\
      \  AND ( file_sha256 IN threat_intel_feed\n        OR (signed == false AND user == 'SYSTEM')\n \
      \       OR cmdline MATCHES /(powershell\\s+-enc|IEX\\(New-Object|reg\\s+save\\s+HKLM\\\\SAM|psexec\\\
      s+\\\\\\\\|winrs\\s+-r:|wmic\\s+/node:|schtasks\\s+/create\\s+/s)/\n        OR initiator_account\
      \ NOT IN admin_allowlist\n        OR source_ip NOT IN admin_subnet_allowlist )\nGENERATE alert(severity='high',\
      \ detail='Query deployment tool logs and process creation events (Windows Event ID 4688) to extract\
      \ ')"
- question: 'Using statistical baselining, can you determine whether the following indicator of Software
    Deployment Tools (T1072) under the Execution tactic is present? Specifically: For all deployed package
    names, calculate the character entropy and n-gram frequencies, and score them corpus-relative against
    the distribution of legitimate software names in the environment (cosine distance to the normal character/token
    profile) rather than entropy alone [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).
    Add Volume (package byte size) and State (deployment success/failure and exit code) features. Flag
    names/packages in the 99th percentile for entropy or n-gram rarity, abnormally large payloads, or
    packages whose failure/error rate spikes versus baseline as a distinct signal.'
  context: 'Tactic context (Execution): this evidence supports the mission question "Has the adversary
    executed commands using software deployment tools?". Evidence under investigation: A software package
    deployed by a centralized management tool has a file hash or name that matches a known malicious indicator,
    or is an unsigned/anomalously-sized binary executed in SYSTEM context by a deployment agent. Method
    (Statistical Method): For all deployed package names, calculate the character entropy and n-gram frequencies,
    and score them corpus-relative against the distribution of legitimate software names in the environment
    (cosine distance to the normal character/token profile) rather than entropy alone [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).
    Add Volume (package byte size) and State (deployment success/failure and exit code) features. Flag
    names/packages in the 99th percentile for entropy or n-gram rarity, abnormally large payloads, or
    packages whose failure/error rate spikes versus baseline as a distinct signal. A positive result indicates
    adversary abuse of centralized software deployment/configuration-management tooling (e.g., SCCM, Intune,
    AWS SSM, JAMF, Puppet/Chef/Ansible, FortiManager) to execute code or move laterally; a negative result
    means the observed deployment activity matches authorized operators, packages, timing, and targets.
    Pivot from any hit to the initiating account, source host/IP, deployment job ID, target asset tier,
    and any downstream process, service-install, persistence, or egress activity within the named area
    of interest.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - 'NAI: SCCM/Intune Management Servers, All Corporate Endpoints and Servers, SIEM/Log Aggregator'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baseline for: For all deployed package names, calculate the character entropy\
      \ and n-gram frequencies\nINPUT deployment_jobs OVER last_90d GROUP BY initiator, package_family,\
      \ target_group\nCOMPUTE name_entropy = char_entropy(package_name), ngram_rarity = corpus_cosine_distance(package_name,\
      \ legit_name_profile)\nCOMPUTE cmd_len, cmd_entropy, fanout = distinct(target_hosts), fail_rate\
      \ = denied_or_error/total\nBASELINE per initiator: tod_dow_dist, jobs_per_day, target_group_size,\
      \ source_ip_rarity\nSCORE = zscore(metrics) ; APPLY change_point_detection(volume_series, fanout_series)\n\
      ALERT WHEN percentile(name_entropy|ngram_rarity|cmd_len) >= 98 OR SCORE > 3sigma OR change_point_detected\
      \ OR fail_rate_spike\n  // For all deployed package names, calculate the character entropy and n-gram\
      \ frequencies"
- question: 'Using a machine-learning model, can you determine whether the following indicator of Software
    Deployment Tools (T1072) under the Execution tactic is present? Specifically: Implement a pre-trained
    classification model (e.g., Random Forest, Gradient Boosting) that uses static binary features (PE
    headers, imported functions, string entropy). For each newly deployed binary, extract its features
    and predict benign vs malicious. Surface the top-3 contributing features (e.g., suspicious import,
    section entropy, missing signature) in the alert text using SHAP-style attributions [explainable AI
    for IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    Run this in parallel with the deterministic hash/signature rules rather than replacing them, because
    ML-only detectors degrade sharply on unseen samples [A False Sense of Security?](https://arxiv.org/abs/2205.09199).'
