    query: 'source IN [Zeek smtp.log, Zeek http.log, Zeek conn.log, Zeek files.log, Zeek dns.log, Windows
      Event ID 4688]

      | WHERE matches_action_criteria("Internal-sender TI correlation")

      // Join mail, web, and network logs for internal-origin messages that carry links or attachments
      tied to known malicious de

      | ALERT enrich(host, user, sender, recipients, url, attachment, process, dest)'
  - technology: Zeek/pseudocode
    query: '# Internal-spearphishing network correlation

      smtp.log, http.log, conn.log, files.log, dns.log

      | FILTER internal-origin senders (id.orig_h in RFC1918 / internal domains)

      | JOIN message URLs/attachments to outbound flows and DNS on (id.orig_h, time-window)

      | AGG distinct recipients, URL rarity, domain age/reputation, NXDOMAIN/404 failure rate

      | flag rare-URL bulk-recipient internal mail and lure-infra hits per action criteria'
- question: '[Lateral Movement] Rare-URL bulk-recipient rule: Can you determine whether an internal sender
    or collaboration account sends a message that leads recipients to malicious infrastructure or delivers
    a malicious attachment, and the initiating process is a mail or chat client running from a compromised
    internal context. -- specifically, using the ''Rare-URL bulk-recipient rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary who has already
    compromised a legitimate internal account or endpoint abuses that trust to spearphish coworkers --
    delivering malicious links, attachments, or chat messages from a sender the recipients already know,
    which sharply raises click-through and credential-capture rates and lets the adversary pivot to additional
    accounts and systems. This evidence focuses on the condition that an internal sender or collaboration
    account sends a message that leads recipients to malicious infrastructure or delivers a malicious
    attachment, and the initiating process is a mail or chat client running from a compromised internal
    context. This Symbolic Logic approach looks for the following signal: High-recall deterministic pre-filter
    for internal mail: flag any internal-to-internal message that contains a rare URL (a host/domain seen
    in <=0.1% of prior org email or first observed in the last 7 days) AND is sent to >=25 distinct internal
    recipients, the dominant lateral-phishing pattern in [Detecting and Characterizing Lateral Phishing
    at Scale, Ho et al.](https://www.usenix.org/system/files/sec19-ho.pdf). Tune the recipient floor per
    environment. A positive result -- a rule match, statistical outlier, or model alert -- suggests a
    trusted internal account is being used to deliver phishing content or that a recipient has interacted
    with it, deviating from normal internal collaboration; pivot to the sending account and its recent
    logon/device anomalies, the recipient set, the embedded URL or attachment, any office/mail/chat-spawned
    process, and subsequent share access or outbound connections. A negative result helps rule out this
    internal-spearphishing vector but should be corroborated with the other questions in this playbook,
    since a single method can miss low-and-slow, well-crafted, or living-off-the-land campaigns.'
