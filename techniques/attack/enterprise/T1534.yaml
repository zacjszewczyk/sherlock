name: 'T1534: Internal Spearphishing'
id: e575af31-c4a2-4e52-a71a-8b329af3f636
description: 'This playbook helps an analyst investigate whether an adversary, having already compromised
  a legitimate internal account or device, is abusing that trusted internal context to conduct internal
  spearphishing for Lateral Movement (T1534). It guides the hunt across several behavioral angles spanning
  Windows, Linux, macOS, Office Suite, and SaaS/collaboration platforms: internal-to-internal messages
  that carry links to malicious infrastructure or high-risk attachments (.iso/.lnk/.html/.vhd/.img) and
  that reuse trusted sender relationships; mail, browser, office, or chat clients (OUTLOOK.EXE, WINWORD.EXE,
  EXCEL.EXE, POWERPNT.EXE, ms-teams.exe) spawning script interpreters or shells after a recipient interacts
  with a message or attachment; header anomalies such as From/Reply-To mismatch, divergent X-Mailer fingerprints,
  URL shorteners, and rare attachment MIME types; DNS-to-process-to-share correlation chains where a low-reputation
  or newly registered domain lookup precedes an office-spawned process and subsequent network-share access
  or outbound connection; and bursty, recipient-fan-out campaigns where one internal sender blasts many
  recipients with near-identical subjects or URLs. Detection methods combine symbolic-logic rules (Sigma-style
  suspicious child-process and header/attachment matches, threat-intel and rare-URL bulk-recipient filters),
  statistical baselining (per-sender volume and unique-recipient z-scores, attachment-type and parent-child
  rarity, lexical URL scoring, failure-rate profiling of NXDOMAIN/404/blocked-connection telemetry), and
  machine-learning models (lateral-phishing random forests, gradient-boosted process-chain classifiers,
  per-sender one-class email-risk models, sequence/graph anomaly detection, and coordinated-campaign clustering)
  applied to Zeek smtp/http/conn/files/dns logs, Windows Security and Sysmon process telemetry, auditd,
  macOS unified logs, and M365/Slack/Teams application logs, so the analyst can corroborate suspected
  internal spearphishing against sender behavior, message structure, process lineage, and post-click host
  and network activity.'
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
