questions:
- question: '[Lateral Movement] Internal-sender TI correlation: Can you determine whether an internal
    sender or collaboration account sends a message that leads recipients to malicious infrastructure
    or delivers a malicious attachment, and the initiating process is a mail or chat client running from
    a compromised internal context. -- specifically, using the ''Internal-sender TI correlation'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary who has already
    compromised a legitimate internal account or endpoint abuses that trust to spearphish coworkers --
    delivering malicious links, attachments, or chat messages from a sender the recipients already know,
    which sharply raises click-through and credential-capture rates and lets the adversary pivot to additional
    accounts and systems. This evidence focuses on the condition that an internal sender or collaboration
    account sends a message that leads recipients to malicious infrastructure or delivers a malicious
    attachment, and the initiating process is a mail or chat client running from a compromised internal
    context. This Symbolic Logic approach looks for the following signal: Join mail, web, and network
    logs for internal-origin messages that carry links or attachments tied to known malicious destinations.
    Alert when an internal sender reuses trusted relationships to deliver content that resolves to a threat-intel
    hit. Because the sender is legitimate, anchor on the destination (domain reputation, count of distinct
    prior employees who ever visited the domain) rather than sender reputation, per [Detecting Credential
    Spearphishing Attacks in Enterprise Settings, Ho et al.](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-ho.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a trusted internal
    account is being used to deliver phishing content or that a recipient has interacted with it, deviating
    from normal internal collaboration; pivot to the sending account and its recent logon/device anomalies,
    the recipient set, the embedded URL or attachment, any office/mail/chat-spawned process, and subsequent
    share access or outbound connections. A negative result helps rule out this internal-spearphishing
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss low-and-slow, well-crafted, or living-off-the-land campaigns.'
  answer_sources:
  - Zeek smtp.log
