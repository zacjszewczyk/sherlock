name: 'T1069.003: Cloud Groups'
id: ab337339-5255-425e-8c71-c9ac63359f66
description: Investigate potential adversary discovery of cloud groups, roles, and permission settings
  across SaaS, IaaS, Office Suite, and Identity Provider platforms (AWS, Azure, GCP, M365). Adversaries
  enumerate cloud permission groups and ACLs to learn the roles of users and groups, which accounts belong
  to which groups, and which principals can access sensitive objects, enabling targeted follow-on access
  and privilege escalation. This playbook helps an analyst hunt for high-fidelity discovery commands and
  API calls (e.g., Get-MsolRole, Get-RoleGroup, ListGroups, ListRolePolicies, ListAttachedRolePolicies,
  GetBucketAcl, az ad user get-member-groups, gcloud iam roles list, GCP cloudidentity.groups.list), to
  profile permission-error rates indicative of under-privileged stolen credentials, to detect high-volume
  or wildcard enumeration suggesting automated reconnaissance, to measure deviation from per-user and
  peer-group behavioral baselines, to enrich and assess source IP geolocation/ASN/threat-intel context,
  to correlate enumeration immediately followed by high-risk actions by the same identity, and to identify
  host-to-cloud-API network patterns in Zeek logs that corroborate audit-log enumeration.
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any process-creation event (Windows Event ID 4688 / Sysmon) or cloud audit log entry (CloudTrail,
    Entra/Azure, GCP Audit, M365 Unified Audit) contain a command line or API call name that is a known
    high-fidelity indicator of cloud group/role/ACL discovery, executed by a principal NOT on the administrative
    allowlist?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. Maintain
    a watchlist of high-fidelity discovery commands and API names (e.g., ''Get-MsolRole'', ''Get-RoleGroup'',
    ''ListGroups'', ''ListRolePolicies'', ''ListAttachedRolePolicies'', ''GetBucketAcl'', ''az ad user
    get-member-groups'', ''gcloud iam roles list'', GCP ''cloudidentity.groups.list''). An exact match
    originating from a principal outside a pre-defined administrative allowlist is a strong, low-noise
    signal of reconnaissance. Use portable rules from SigmaHQ and Elastic AWS detection rules, and validate/threshold-tune
    against emulated activity from Stratus Red Team and the public flaws.cloud CloudTrail dataset. A positive
    result (match by a non-admin principal) should trigger a high-severity alert and immediate scoping
    of that identity''s recent activity; a negative result narrows the hunt to behavioral signals. References:
    [SigmaHQ Detection Rules](https://github.com/SigmaHQ/sigma); [Elastic Detection Rules - AWS](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws);
    [Stratus Red Team](https://github.com/DataDog/stratus-red-team); [flaws.cloud CloudTrail dataset](https://summitroute.com/blog/2020/10/09/public_dataset_of_cloudtrail_logs_from_flaws_cloud/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Cloud provider IAM/Audit Log services, Domain Controllers, Administrator workstations, CI/CD
    pipeline runners'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: source IN (WinEventID=4688, sysmon=1, cloudtrail, azure_activity, gcp_audit, m365_unified)
      | where CommandLine matches_any('Get-MsolRole','Get-RoleGroup','az ad user get-member-groups','gcloud
      iam roles list') OR eventName IN ('ListGroups','ListRolePolicies','ListAttachedRolePolicies','GetBucketAcl','cloudidentity.groups.list')
      | where principal NOT IN admin_allowlist | alert severity=high
- question: Did a single principal or source generate a dense burst of permission errors (>= 5 'AccessDenied'
    / 403 / Forbidden / permission-denied) on IAM, group, role, policy, or ACL read actions within a 5-minute
    window?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. Under-privileged
    stolen credentials enumerating groups, roles, and ACLs generate dense permission errors because the
    attacker probes surfaces they are not authorized to read. This failure-mode signal is independent
    of any single command match and catches blind enumeration. Alert when one principal/source produces
    >= 5 AccessDenied (CloudTrail errorCode), 403/Forbidden, or Entra/GCP permission-denied responses
    on permission-read actions within 5 minutes, following the Splunk AWS IAM AccessDenied Discovery analytic.
    Derive the threshold from your own baseline of normal denied-read rates. A positive result suggests
    credential misuse and reconnaissance; a low denied rate is expected for legitimate, scoped automation.
    References: [Splunk AWS IAM AccessDenied Discovery analytic](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Cloud provider IAM/Audit Log services, Domain Controllers, Administrator workstations, CI/CD
    pipeline runners'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: source IN (cloudtrail, azure_activity, gcp_audit) | where errorCode IN ('AccessDenied','Forbidden','403')
      AND eventName matches('List*|Get*|Describe*') | bin span=5m | stats count by principal, sourceIPAddress,
      _time_bucket | where count >= 5 | alert
- question: Do unsupervised command-line embeddings (BERT) plus outlier detection flag any cloud CLI command
    line (az/gcloud/aws/PowerShell) as anomalous, with the top-3 contributing tokens surfaced?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. Attackers
    often use rare verbs, wildcard flags (''-All''), or anomalous parent processes that signature rules
    miss. Embed cloud CLI command lines (from Event ID 4688/Sysmon) with BERT-style representations and
    score with unsupervised outlier detectors (Isolation Forest, COPOD, autoencoder), as in CrowdStrike''s
    BERT command-line anomaly detection. The alert MUST surface the top-3 contributing tokens/features
    (rare enumeration verb, wildcard, anomalous parent process) rather than only a score, and retain a
    parallel feature-engineered classifier (command length, keyword counts of list/get/group/role/member,
    special-char frequency, parent process) as an explainable fallback. A high outlier score with discovery-related
    tokens warrants investigation of the executing identity and host. References: [CrowdStrike BERT command-line
    anomaly detection](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Cloud provider IAM/Audit Log services, Domain Controllers, Administrator workstations, CI/CD
    pipeline runners'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'cmds = collect(EventID=4688|sysmon CommandLine where image in az,gcloud,aws,powershell) |
      emb = BERT_embed(cmds) | score = IsolationForest/COPOD(emb) | if score > threshold: alert with top3_tokens(emb)
      | fallback: features=[len,kw_count(list|get|group|role|member),special_char_freq,parent_proc] ->
      classifier'
- question: Did a single principal execute more than 20 distinct enumeration API calls within a 1-minute
    window, or use broad wildcard queries (e.g., 'Get-MsolUser -All | Get-MsolUserRole'), without being
    a whitelisted service account or admin?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. A
    high volume of distinct enumeration calls in a short window, or broad wildcard queries, indicates
    automated reconnaissance rather than interactive, scoped use. Alert if a single principal executes
    more than 20 distinct enumeration API calls (e.g., ''ListGroups'',''ListRoles'',''ListPolicies'',''ListAttachedRolePolicies'',''GetBucketAcl'')
    within a 1-minute window, or uses wildcard queries, when not on the allowlist. Adapt the count from
    your population baseline and cross-check with SigmaHQ and Elastic AWS rules. Tune rather than delete
    the fixed count. A positive result suggests scripted enumeration; legitimate bulk admin tooling should
    be allowlisted to suppress noise. References: [SigmaHQ](https://github.com/SigmaHQ/sigma); [Elastic
    AWS rules](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Cloud provider API gateways, Internal network egress points, Administrator workstations and
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: source IN (cloudtrail, azure_activity, gcp_audit, EventID=4688) | where eventName matches('List*|Get*|Describe*')
      OR CommandLine matches('-All') | bin span=1m | stats dc(eventName) as distinct_calls by principal,
      _time_bucket | where distinct_calls > 20 AND principal NOT IN allowlist | alert
- question: Does any principal's or source IP's current enumeration-call rate exceed its 30-day mean+3*std
    (vs personal or peer baseline), or include first-seen enumeration actions, factoring in the success/AccessDenied
    ratio?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. A
    fixed threshold misses slow-but-anomalous actors and over-alerts on busy service accounts; a per-entity
    statistical baseline adapts to normal behavior. For each principal and source IP, compute a rolling
    per-minute enumeration-call count and a 30-day mean/std baseline; alert when the current rate exceeds
    mean+3*std vs personal or peer baseline. Combine with first-seen novelty detection per principal (Netflix
    CloudTrail Anomaly Detector) and per-service time-series spike attribution (AWS CloudWatch ML over
    CloudTrail). Track the ratio of successful vs AccessDenied enumeration calls (State) to distinguish
    authorized bulk reads from blind probing. Deviation plus novelty plus a high denied ratio strongly
    indicates reconnaissance with imperfect credentials. References: [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly);
    [AWS CloudWatch ML over CloudTrail](https://aws.amazon.com/blogs/mt/simplify-analysis-of-aws-cloudtrail-data-leveraging-amazon-cloudwatch-machine-learning-and-advanced-capabilities/).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Cloud provider API gateways, Internal network egress points, Administrator workstations and
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_principal_per_source mean,std of enum_calls_per_min over 30d | cur = enum_calls_per_min(now)
      | if cur > baseline.mean + 3*baseline.std OR action is first_seen(principal): alert | annotate success_fail_ratio
      = success_count/accessdenied_count'
- question: Do per-principal/per-source time-series anomaly models flag bursts or machine-like cadence
    in enumeration event counts that deviate from learned daily/weekly seasonality, with the top-3 drivers
    listed?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. Automated
    reconnaissance produces regular, machine-cadence bursts at times that violate a user''s learned seasonality.
    Train per-principal/per-source time-series anomaly models on enumeration event counts that learn daily/weekly
    seasonality and flag bursts or machine-like cadence deviating from forecast (AWS CloudWatch ML; rare-function/population
    ML jobs in Elastic CloudTrail ML). Alert text must list the top-3 drivers (burst magnitude, off-hours,
    rare action) for analyst triage. A flagged off-hours machine-cadence burst by a normally interactive
    user is a high-value lead. References: [AWS CloudWatch ML](https://aws.amazon.com/blogs/mt/simplify-analysis-of-aws-cloudtrail-data-leveraging-amazon-cloudwatch-machine-learning-and-advanced-capabilities/);
    [Elastic CloudTrail ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Cloud provider API gateways, Internal network egress points, Administrator workstations and
    servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'ts = enum_event_counts per principal per interval | model = SeasonalForecast(ts, daily+weekly)
      | if observed >> forecast_CI OR cadence ~ machine_like: alert with top3_drivers(burst_magnitude,
      off_hours, rare_action)'
- question: Did any account OUTSIDE the defined 'Cloud Administrators' group execute privileged enumeration
    of roles/permissions (e.g., 'Get-MsolRole', 'gcloud iam roles list', 'ListRolePolicies')?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. Reading
    the role/permission surface is inherently a privileged, administrative action; legitimate need is
    limited to a known set of principals. Enforce a least-privilege rule: alert if any account outside
    a defined ''Cloud Administrators'' group executes privileged enumeration. Maintain the allowlist of
    principals that legitimately read permission/role surfaces (per Wiz IMDS anomaly hunting) and pair
    with SigmaHQ cloud rules. A positive result means a non-admin identity is mapping privileges, a classic
    precursor to escalation; keep the allowlist current to minimize false positives from sanctioned tooling.
    References: [Wiz IMDS anomaly hunting](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day); [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Cloud provider IAM/Audit Log services, User and Entity Behavior Analytics (UEBA) platform data
    lake, SIEM log repository'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: source IN (cloudtrail, azure_activity, gcp_audit, EventID=4688) | where eventName IN ('ListRolePolicies','ListAttachedRolePolicies')
      OR CommandLine matches('Get-MsolRole|gcloud iam roles list') | where principal NOT IN cloud_administrators_group
      | alert severity=high
- question: Does a user's set of unique enumeration API calls in a sliding 1-hour window have Jaccard
    similarity below 0.2 versus their 30-day baseline set, including separate profiling of failed (AccessDenied)
    enumeration novelty?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. A
    user suddenly issuing enumeration calls unlike anything in their history signals account takeover
    or insider reconnaissance. Profile the set of unique enumeration API calls each user makes over a
    30-day window; in a sliding 1-hour window compute Jaccard similarity to the baseline set and flag
    scores below 0.2 (significant behavior change). Reinforce with first-seen action novelty (Netflix
    CloudTrail Anomaly Detector) and separately profile failed (AccessDenied) enumeration novelty (State),
    since blind probing produces novel failures. Low Jaccard plus novel denied actions is a strong behavioral
    indicator; established, stable behavior yields high similarity. References: [Netflix CloudTrail Anomaly
    Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Cloud provider IAM/Audit Log services, User and Entity Behavior Analytics (UEBA) platform data
    lake, SIEM log repository'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline_set = distinct enum_api_calls per user over 30d | window_set = distinct enum_api_calls
      per user in sliding 1h | j = |baseline ∩ window| / |baseline ∪ window| | if j < 0.2: alert | also
      compute j over AccessDenied-only sets'
- question: Does peer-group UEBA or unsupervised clustering (DBSCAN) flag a principal whose enumeration
    feature vector deviates from peers, or that moved from a low-activity to a high-activity/high-diversity
    cluster, with top-3 contributing features surfaced?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. Peers
    in the same role exhibit similar enumeration patterns; an outlier within a peer group reveals abuse
    that personal baselines may miss. Apply peer-group baselining and anomaly scoring (Microsoft Sentinel
    UEBA) or unsupervised clustering (DBSCAN) over feature vectors (API call frequency, diversity, time-of-day,
    AccessDenied ratio). Alert when a user moves from a low-activity cluster to a high-activity/high-diversity
    cluster or becomes an outlier, and surface the top-3 contributing features for explainability. A principal
    newly behaving like a power-enumerator relative to peers is a high-confidence reconnaissance lead.
    References: [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Cloud provider IAM/Audit Log services, User and Entity Behavior Analytics (UEBA) platform data
    lake, SIEM log repository'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'vec = per_principal[api_freq, diversity, time_of_day, accessdenied_ratio] | clusters = DBSCAN(vec)
      OR sentinel_ueba_peer_score(principal) | if principal is outlier OR moved low->high_diversity_cluster:
      alert with top3_features'
- question: Was any cloud group enumeration event observed originating from a source IP enriched as rare/high-risk
    geolocation or ASN, a threat-intel hit (known-malicious, TOR exit, anonymizing proxy), or an off-allowlist
    origin?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. Enumeration
    from anomalous network origins indicates the legitimate credential is being used from attacker infrastructure.
    For every cloud enumeration event, enrich the source IP with geolocation/ASN and threat intelligence,
    maintain an allowlist of approved countries/ASNs, and alert on activity outside it. Combine with rare
    source-geography ML jobs (Elastic CloudTrail ML). A positive result (e.g., enumeration from a TOR
    exit or a non-corporate foreign ASN) is high-confidence; corporate VPN/egress ranges should be allowlisted
    to avoid noise. References: [Elastic CloudTrail ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Network gateway firewalls and proxies, VPN concentrators, Cloud provider audit logs, Endpoint
    process monitoring agents'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'for each enum_event: enrich(sourceIP -> geo, asn, ti_verdict) | if ti_verdict IN (malicious,
      tor, anon_proxy) OR geo NOT IN approved_countries OR asn NOT IN approved_asns: alert'
- question: Did an enumeration event originate from a source geolocation or ASN below the 1st percentile
    of that user's 90-day source-location/ASN frequency distribution?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. A
    statistically rare source for a specific user is more meaningful than a globally rare one. For each
    user maintain a 90-day frequency distribution of source geolocations/ASNs; raise risk when an enumeration
    event originates from a location/ASN below the 1st percentile of that user''s history. This mirrors
    rare-population/source-anomaly analytics in Elastic CloudTrail ML and Microsoft Sentinel UEBA. A first-or-rare
    source for that user, combined with enumeration activity, warrants verification with the user and
    review of the session. References: [Elastic CloudTrail ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning);
    [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Network gateway firewalls and proxies, VPN concentrators, Cloud provider audit logs, Endpoint
    process monitoring agents'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'dist = per_user 90d frequency(source_geo, source_asn) | for enum_event: p = percentile_rank(event.geo_asn,
      dist) | if p < 1st_percentile: raise_risk/alert'
- question: Does a context classifier (e.g., Random Forest) over source IP geo/ASN, time-of-day, day-of-week,
    user role, parent process, and AccessDenied ratio score an enumeration event as low-probability/anomalous,
    with the top-3 contributing features surfaced?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. Multiple
    weak contextual signals combine into a strong verdict that single rules cannot capture. Train a classifier
    (e.g., Random Forest) on source IP geo/ASN, time-of-day, day-of-week, user role, parent process, and
    AccessDenied ratio to score enumeration legitimacy; low-probability (anomalous) events alert. Surface
    the top-3 contributing features in the alert per Microsoft Sentinel UEBA explainability guidance,
    and baseline rare-context behavior with Elastic CloudTrail ML. A low-legitimacy score driven by anomalous
    geo plus off-hours plus high denied ratio is a strong lead. References: [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    [Elastic CloudTrail ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Network gateway firewalls and proxies, VPN concentrators, Cloud provider audit logs, Endpoint
    process monitoring agents'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features=[geo,asn,time_of_day,day_of_week,user_role,parent_proc,accessdenied_ratio] | p_legit
      = RandomForest.predict_proba(features) | if p_legit < threshold: alert with top3_feature_importance'
- question: Was a cloud group/role/ACL enumeration event by an identity followed within 10 minutes by
    a high-risk action (e.g., AssumeRole, Add-RoleGroupMember, GetSecretValue, s3:GetObject, CreateAccessKey)
    by the SAME identity?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. Discovery
    is rarely the end goal; enumeration immediately followed by escalation or credential/data access by
    the same identity reveals an attack chain in progress. Implement a SIEM sequence rule: EVENT_A = (API
    matches ''List*''/''Get*''/''Describe*'' for IAM roles/groups/ACLs) followed by EVENT_B = (''AssumeRole'',''Add-RoleGroupMember'',''GetSecretValue'',''s3:GetObject'',''CreateAccessKey'')
    within 10 minutes where User(A)==User(B). Source the action lists from SigmaHQ and Elastic AWS rules.
    A matched sequence is high-confidence malicious and should escalate immediately with session containment.
    References: [SigmaHQ](https://github.com/SigmaHQ/sigma); [Elastic AWS rules](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: SIEM correlation engine, Cloud provider audit log services, Data Loss Prevention (DLP) systems'
  range: 'Last 90 days (event-centered: correlate EVENT_A and EVENT_B within a 10-minute window)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EVENT_A: eventName matches(''List*|Get*|Describe*'' for IAM roles/groups/ACLs) EVENT_B: eventName
      IN (''AssumeRole'',''Add-RoleGroupMember'',''GetSecretValue'',''s3:GetObject'',''CreateAccessKey'')
      | sequence A -> B within 10m where A.userIdentity == B.userIdentity | alert severity=high'
- question: Modeling each principal's session as a Markov chain of API-call types, does the observed transition
    probability P(High-Risk Action | Enumeration Action) greatly exceed the historical average for that
    principal?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. Legitimate
    sessions transition between API types in predictable ways; an improbable jump from enumeration directly
    to a high-risk action signals intent. Model each principal''s session as a Markov chain of API-call
    types and compute P(High-Risk Action | Enumeration Action); flag sessions whose observed transition
    probability greatly exceeds the historical average. Use multi-order/variable-order Markov approaches
    (statistical anomaly detection in cloud server systems; Cloudflare variable-order Markov API-abuse
    detection). A session with an anomalously high enumeration-to-escalation transition probability merits
    investigation even without an exact signature match. References: [A Statistical Learning Approach
    to Anomaly Detection in Cloud Server Systems](https://ieeexplore.ieee.org/document/7065233/); [Cloudflare
    variable-order Markov API-abuse detection](https://blog.cloudflare.com/protecting-apis-from-abuse-using-sequence-learning-and-variable-order-markov/).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: SIEM correlation engine, Cloud provider audit log services, Data Loss Prevention (DLP) systems'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'for each principal session: states = sequence(api_call_type) | model = VariableOrderMarkov(historical_sessions)
      | p = model.P(high_risk_action | enumeration_action) | if p >> historical_avg: alert'
- question: Does a directed graph of user-role-resource-action edges reveal a rare high-risk enumeration-to-escalation
    path (e.g., 'User -> ListRoles -> AssumeRole -> GetSecretValue'), with the contributing path/edges
    emitted?
  context: 'This is a Discovery-tactic activity: the adversary is orienting within your cloud environment
    to map roles, group memberships, and permissions before deciding how to escalate or access data. Attack
    chains form distinctive paths through the identity-resource graph that node- or event-level rules
    miss. Build a directed graph (nodes: users/roles/resources; edges: API calls) and apply graph anomaly
    detection to surface rare high-risk paths. Use heterogeneous-graph attention modeling of IAM logs
    (GNN-based adaptive threat detection for Cloud IAM logs) and drift-resistant provenance-graph learning
    (MAGIC). Emit the contributing path/edges in the alert for explainability. A rare path connecting
    enumeration to escalation and secret/data access is a high-value, explainable lead. References: [GNN-based
    adaptive threat detection for Cloud IAM logs](https://arxiv.org/abs/2512.10280); [MAGIC](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf);
    [MAGIC code](https://github.com/FDUDSDE/MAGIC).'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: SIEM correlation engine, Cloud provider audit log services, Data Loss Prevention (DLP) systems'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'G = build_directed_graph(nodes=users,roles,resources; edges=api_calls) | scores = graph_anomaly(GNN/MAGIC)(G)
      | surface rare paths like User->ListRoles->AssumeRole->GetSecretValue | if path_score anomalous:
      alert with contributing_edges'
