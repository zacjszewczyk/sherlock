  context: Rare, anomalous control-plane events can reveal mirror abuse that rule-based allowlists miss.
    Score cloud audit events (action, principal, source IP, region, target) with an Isolation Forest and
    surface the top-3 contributing features for rare mirror-configuration events. The model catches unusual
    combinations - e.g., a mirror API from an atypical source IP/region - and the feature attribution
    makes each alert triage-ready. A high anomaly score on a mirror-related action is a strong lead for
    cloud traffic-duplication exfiltration; common, expected events score low. Score cloud audit events
    with Isolation Forest per [Liu, Ting & Zhou](https://doi.org/10.1145/2133360.2133363).
