name: 'T1621: Multi-Factor Authentication Request Generation'
id: cb40468b-c05e-4fae-bf4e-85b76c3b83a8
description: 'This playbook helps an analyst investigate whether an adversary is attempting to bypass
  multi-factor authentication (MFA) by generating MFA requests sent to a victim user -- the technique
  known as MFA Request Generation or "push bombing"/"MFA fatigue" (MITRE ATT&CK T1621, Credential Access
  tactic TA0006). An adversary who already possesses valid account credentials (often breach-sourced)
  but lacks the second factor abuses the automatic generation of MFA push notifications, SMS, or phone
  calls -- via normal login, OAuth/SSO, or self-service password reset (SSPR) flows -- to bombard the
  user until they reflexively approve. The hunt spans identity providers (Entra ID/Azure AD, Okta, Duo),
  cloud platforms (AWS CloudTrail), Windows (Security 4624/4625), Linux (auditd/PAM), and macOS (unified
  log), plus supporting network telemetry (Zeek conn.log/http.log), and pursues the behavior from several
  complementary angles: authentication originating from known-malicious or anonymizing infrastructure;
  programmatic, non-browser clients generating challenges; anomalously high volume and frequency of MFA
  challenges or failed logins for one user; a shift in the MFA result-state distribution (bursts of denials/timeouts
  followed by an approval); a failure burst followed by an unusually fast "fatigue" approval; impossible-travel
  or structurally anomalous post-approval sessions; and SSPR-initiated challenges without a corresponding
  primary-credential success. Detection methods combine deterministic symbolic-logic rules (threat-intel/anonymizer
  IP correlation, non-browser User-Agent watchlists, prompt-rate throttling thresholds, deny/timeout-then-approval
  sequences, impossible-travel velocity, SSPR-without-primary-success), statistical baselining (ASN rarity
  modified Z-scores, per-user EMA/Seasonal-Hybrid ESD exceedance, change-point onset detection, failure-mode
  ratio baselines, approval-latency outliers, login-velocity percentiles, low-entropy User-Agent detection),
  and machine learning (explainable Isolation Forest/One-Class SVM scoring, attention-augmented LSTM fatigue-chain
  sequence models, DBSCAN structural-login clustering), so the analyst can corroborate suspected push
  bombing across origin, client, rate, failure-state, latency, and geovelocity evidence and determine
  whether a fatigue approval ultimately granted the adversary access.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
