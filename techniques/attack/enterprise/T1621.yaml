questions:
- question: '[Credential Access] TI-based IP/anonymizer correlation: Can you determine whether An MFA-approved
    login attempt (Windows Event ID 4624) or a failed login attempt (Windows Event ID 4625) originates
    from an IP address associated with known malicious infrastructure (C2, botnets, TOR exit nodes, anonymous
    proxies, bulletproof/VPS hosting ASNs). Push-bombing requires the adversary to already hold valid
    credentials, so anomalous-origin authentication is a strong precursor/confirmation signal. -- specifically,
    using the ''TI-based IP/anonymizer correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary who already holds
    valid credentials but lacks the second factor abuses MFA request generation to push-bomb a victim
    into approving access, or abuses SSPR to generate prompts even without credentials. This evidence
    focuses on the condition that An MFA-approved login attempt (Windows Event ID 4624) or a failed login
    attempt (Windows Event ID 4625) originates from an IP address associated with known malicious infrastructure
    (C2, botnets, TOR exit nodes, anonymous proxies, bulletproof/VPS hosting ASNs). Push-bombing requires
    the adversary to already hold valid credentials, so anomalous-origin authentication is a strong precursor/confirmation
    signal. This Symbolic Logic approach works as follows: Correlate authentication source IPs with threat
    intelligence on malicious IPs, TOR/proxy/VPS-hosting ASNs and alert on matches; treat anonymous-IP
    and rare-country sign-ins as high-risk per [Anomaly Detection Policies, Microsoft Defender for Cloud
    Apps](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy). Push-bombing
    presupposes pre-held credentials, often breach-sourced ([Protecting accounts from credential stuffing
    with password breach alerting, Thomas et al.](https://www.usenix.org/system/files/sec19-thomas.pdf)),
    so prioritize breach-exposed accounts. Real-world APT29 push abuse originated from such infrastructure
    ([Tracking APT29 Phishing Campaigns, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/tracking-apt29-phishing-campaigns)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable MFA request-generation/fatigue
    activity; pivot to the targeted user account, the source IP/ASN/geolocation and its threat-intel reputation,
    the MFA device and result state (approved/denied/timeout) sequence, whether a success/approval ultimately
    followed the burst, and any post-approval session activity to scope whether the adversary gained access.
    A negative result helps rule out this particular push-bombing vector but should be corroborated with
    the other questions in this playbook, since a single method can miss low-and-slow prompting, SSPR-only
    abuse, or distributed-origin campaigns.'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - azure:signinlogs
  - saas:okta
  - 'NAI: Authentication servers (ADFS, RADIUS), VPN concentrators, Cloud identity providers (Entra ID,
    Okta, Duo), Internet gateway/firewall, SIEM'
  range: Last 90 days (correlate event-centered windows of +/- 10 minutes around the MFA burst)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# TI-based IP/anonymizer correlation (Symbolic Logic)

      source IN [Windows Event ID 4625, Windows Event ID 4624, Zeek conn.log, azure:signinlogs, saas:okta]

      | approach: Correlate authentication source IPs with threat intelligence on malicious IPs, TOR/proxy/VPS-hosting
      ASNs and alert on matches; treat anonymous-IP and rare-country sign-ins as high-risk per Anomaly
      Detection Policies, Microsoft Defender for Cloud Apps. Push-bombing presupposes pre-held credentials,
      often breach-sourced (Protecting accounts from credential stuffing with password breach alerting,
      Thomas et al.), so prioritize breach-exposed accounts. Real-world APT29 push abuse originated from
      such infrastructure (Tracking APT29 Phishing Campaigns, Mandiant).

      | correlate over NAI: Authentication servers (ADFS, RADIUS), VPN concentrators, Cloud identity providers
      (Entra ID, Okta, Duo), Internet gateway/firewall, SIEM

      | group by user; sequence MFA challenge/result (approved|denied|timeout) and login outcome (4624/4625)
      over time

      | emit alert with contributing fields and entity context (user, src_ip, ASN, geo, mfa_result, challenge_count,
      approval_latency)'
  - technology: Identity Provider/pseudocode
    query: '# TI-based IP/anonymizer correlation (Identity-provider view)

      watch azure:signinlogs / saas:okta / Duo auth logs for per-user MFA challenges and results

      | filter to candidate user/session; count denied+timeout vs approved within rolling window

      | correlate with primary login success/failure and source origin

      | emit candidate push-bombing sequences with user, src, mfa_result_distribution, outcome'
