name: 'T1027.010: Obfuscated Files or Information: Command Obfuscation'
id: 64c67db2-8308-40ab-bf4d-328fda5e8b8c
description: 'Investigate whether an adversary has used command-line and script obfuscation to evade detection
  while executing commands across Windows, Linux, and macOS endpoints. This playbook helps an analyst
  hunt for syntactic obfuscation in process command lines, PowerShell script blocks, and shell execve
  arguments: known obfuscation-framework markers (Invoke-Obfuscation, Invoke-DOSfuscation, Bashfuscator,
  $DoIt), structural tricks such as string concatenation, escape characters, environment-variable substring
  substitution, FOR-loop reassembly and globbing, high-entropy or long encoded tokens (Base64/hex/URL),
  dynamic command construction immediately before execution (IEX, eval, -join/-f, build-and-call loops),
  and multi-stage layered obfuscation that defeats single-pass signatures. It pairs symbolic-logic signatures,
  statistical baselining (volume, frequency, entropy, character-frequency divergence, complexity outliers),
  and machine-learning approaches (Naive Bayes, TF-IDF/DBSCAN clustering, AST classifiers, XGBoost, seasonal
  entropy models, BERT/ELECTRA embeddings, AMSI post-deobfuscation classification, and seq2seq deobfuscation)
  so the analyst can answer whether the adversary evaded defenses through command obfuscation.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any command lines, PowerShell 4104 script blocks, or auditd execve arguments contain high-fidelity
    strings associated with command-obfuscation frameworks, such as Invoke-Obfuscation, $DoIt, Out-EncodedCommand,
    Invoke-DOSfuscation, Bashfuscator, char-array casting ([char[]]), or -join/-f reconstruction?
  context: 'Stealth depends on commands that defeat signatures, yet obfuscation toolkits leave distinctive
    artifacts in their output. Matching the exact tool markers and reconstruction primitives gives a high-fidelity,
    low-false-positive starting signal that an adversary is using off-the-shelf obfuscation to hide command
    execution. A positive match means a known framework string survived in the executed command and warrants
    immediate triage of the parent process, user, and host; a negative result narrows the hunt toward
    custom or hand-rolled obfuscation covered by later questions. Validate coverage against gen_powershell_obfuscation.yar
    and Invoke-DOSfuscation test output.


    References: [gen_powershell_obfuscation.yar](https://github.com/Neo23x0/signature-base/blob/master/yara/gen_powershell_obfuscation.yar);
    [DOSfuscation](https://i.blackhat.com/briefings/asia/2018/asia-18-bohannon-invoke_dosfuscation_techniques_for_fin_style_dos_level_cmd_obfuscation-wp.pdf);
    [Invoke-DOSfuscation](https://github.com/danielbohannon/Invoke-DOSfuscation).'
  answer_sources: &id001
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - auditd:SYSCALL execve
  - macos:unifiedlog
  - 'NAI: All enterprise workstations and servers, particularly those with PowerShell v5+ script block
    logging (4104) and command-line auditing enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  search (EventCode=4688 OR EventCode=4104 OR source=auditd:execve OR source=macos:unifiedlog)\n\
      \  | where CommandLine matches /(Invoke-Obfuscation|Invoke-DOSfuscation|Out-EncodedCommand|\\$DoIt|Bashfuscator|\\\
      [char\\[\\]\\]|-join|-f\\s)/i\n  | table _time, host, user, ParentImage, CommandLine\n  | alert\
      \ priority=high"
- question: Is any single host or the environment as a whole producing an unusual spike in the volume
    or per-minute frequency of obfuscation-marker matches compared to its trailing 30-day baseline?
  context: 'Even when individual markers are benign in isolation, a sudden surge in obfuscation-keyword
    counts often accompanies tooling deployment, mass script execution, or an active intrusion. Baselining
    marker counts per host (volume) and per minute (frequency) and alerting when hourly counts exceed
    3 standard deviations above the 30-day mean, or when one host emits more than 5 distinct markers per
    hour, surfaces bursts that signature matching alone would treat as routine. A positive result points
    to concentrated obfuscation activity that should be correlated to a user session or scheduled job;
    this corpus-baselining follows the Revoke-Obfuscation methodology.


    References: [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).'
  answer_sources: *id001
  range: Last 90 days; derive thresholds from a 30-day learning window and pivot to 1-hour windows on
    alert
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  search index=endpoint marker=obfuscation_marker\n  | bin _time span=1h\n  | stats count\
      \ AS markers, dc(marker) AS distinct_markers BY host, _time\n  | eventstats avg(markers) AS mean,\
      \ stdev(markers) AS sd BY host\n  | where markers > mean + 3*sd OR distinct_markers > 5\n  | alert"
- question: Are there commands that match only a fragment of a known obfuscation marker but fail the full
    signature rule, suggesting an adversary is mutating tool output to bypass detection?
  context: 'Sophisticated actors edit framework output just enough to break exact-match rules. Tracking
    commands that hit a partial marker but fail the complete rule captures this ''almost-match'' state
    signal, and a rising partial-match rate over time is a documented evasion path. A positive result
    means someone is iterating against your detections and should be escalated to threat hunting even
    without a clean signature hit; a flat partial-match rate is reassuring. Route partial matches to triage
    and trend them rather than discarding them as noise.


    References: [DOSfuscation](https://i.blackhat.com/briefings/asia/2018/asia-18-bohannon-invoke_dosfuscation_techniques_for_fin_style_dos_level_cmd_obfuscation-wp.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  search index=endpoint\n  | eval partial=if(match(CommandLine, /(Invoke-|Out-Encoded|DOSfusc|Bashfusc)/i)\
      \ AND NOT match(CommandLine, FULL_MARKER_RULE), 1, 0)\n  | where partial=1\n  | timechart span=1h\
      \ count BY host\n  | // rising partial-match rate => evasion attempt; route to triage"
- question: When a Naive Bayes classifier scores incoming commands on the presence and frequency of obfuscation
    tokens, which commands receive a high posterior probability of being obfuscated, and which tokens
    drove that score?
  context: 'A probabilistic model generalizes beyond brittle exact strings by weighting the co-occurrence
    of many obfuscation tokens, catching novel combinations that no single signature anticipates. Training
    Naive Bayes on token presence/frequency and alerting on high posterior probability gives a tunable,
    explainable score; surfacing the top-3 contributing tokens in the alert lets an analyst quickly confirm
    whether the flagged command is genuinely obfuscated or a benign edge case. This explainable feature-based
    scoring is consistent with published obfuscated-command-line ML detection and supports the Stealth
    question of whether obfuscation is being used to hide execution.


    References: [Obfuscated Command Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  // Naive Bayes scoring\n  model = load('naive_bayes_obfuscation')\n  for cmd in command_stream:\n\
      \      p = model.posterior(features=token_presence(cmd))\n      if p > 0.9:\n          alert(cmd,\
      \ posterior=p, top_tokens=model.top_contributors(cmd, n=3))"
- question: Do command lines or script blocks contain structural obfuscation patterns such as IEX/Invoke-Expression
    chains, Base64 indicators, environment-variable substring substitution (%VAR:~start,len%), repeated
    caret/backtick escapes, set+call variable reassembly, FOR-loop string building, or shell globbing
    like mkdir -p '/tmp/:&$NiA'?
  context: 'These primitives let an adversary hide the effective command while preserving execution, and
    they are the building blocks of both Windows cmd.exe DOSfuscation and Unix shell obfuscation. Regex
    matching across 4688/4104/execve for these patterns catches hand-built obfuscation that has no framework
    marker. A positive match should be triaged against the parent process (cmd.exe, powershell.exe, pwsh,
    bash, sh, zsh) and the acting account, with internet-facing systems and high-value users prioritized.
    This directly supports the Stealth PIR by exposing concealment syntax.


    References: [Suspicious Windows Command Shell Arguments](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/);
    [DOSfuscation](https://i.blackhat.com/briefings/asia/2018/asia-18-bohannon-invoke_dosfuscation_techniques_for_fin_style_dos_level_cmd_obfuscation-wp.pdf).'
  answer_sources: &id002
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - auditd:SYSCALL execve
  - linux:osquery process_events
  - 'NAI: All hosts, with focus on internet-facing systems and high-value user accounts; cmd.exe, powershell.exe,
    pwsh, bash, sh, zsh parents.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  search (EventCode=4688 OR EventCode=4104 OR source=auditd:execve)\n  | where CommandLine\
      \ matches /(IEX|Invoke-Expression|FromBase64String|%[A-Za-z_]+:~\\d+,\\d+%|(\\^){2,}|(`){2,}|set\\\
      s.+&\\s*call|for\\s+\\/[lf].+call|mkdir\\s+-p\\s+'[^']*[:&$]')/i\n  | table _time, host, user, ParentImage,\
      \ CommandLine\n  | alert"
- question: For each parent process, which commands are statistical outliers in structural complexity,
    exceeding the 99th percentile for the ratio of non-alphanumeric characters, counts of carets/quotes/parentheses,
    whitespace anomalies, or nested-token depth?
  context: 'Obfuscation inflates the count of special characters and nesting relative to a process''s
    normal command shape. Baselining these engineered complexity features per parent binary and flagging
    commands above the 99th percentile catches obfuscation that uses no recognizable keyword at all. A
    positive result is a command whose syntactic shape is abnormal for that interpreter and merits review
    of what it ultimately executes. Derive percentile cutoffs per parent binary from your own 30-day telemetry
    so the model reflects local normal.


    References: [Obfuscated Command Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources: *id002
  range: Last 90 days; derive percentile cutoffs from 30-day per-parent telemetry
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  search index=endpoint\n  | eval nonalnum=ratio_nonalphanum(CommandLine), carets=count(CommandLine,\"\
      ^\"),\n         quotes=count(CommandLine,'\"'), parens=count(CommandLine,\"(\")+count(CommandLine,\"\
      )\"),\n         depth=nested_token_depth(CommandLine)\n  | eventstats perc99(nonalnum) AS p99 BY\
      \ ParentImage\n  | where nonalnum > p99\n  | alert"
- question: Does a command's character-frequency distribution diverge sharply from the benign per-interpreter
    baseline when measured with cosine similarity or KL divergence?
  context: 'Normal scripts have a roughly English-like character distribution; obfuscation that relies
    on symbol-heavy reconstruction, casing tricks, or random tokens breaks that distribution. Computing
    the divergence of a command''s character-frequency profile from a benign per-interpreter baseline
    and flagging low-similarity outliers catches obfuscation independent of specific keywords. A positive
    result is a command whose character mix is statistically alien to legitimate use of that interpreter,
    warranting decode and review. This approach is grounded in Lee Holmes'' obfuscation work and Revoke-Obfuscation.


    References: [More Detecting Obfuscated PowerShell](https://www.leeholmes.com/more-detecting-obfuscated-powershell/);
    [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  // character-frequency divergence per interpreter\n  baseline = load_charfreq_baseline(interpreter)\n\
      \  for cmd in commands:\n      sim = cosine(charfreq(cmd), baseline[interpreter(cmd)])\n      kl\
      \  = kl_divergence(charfreq(cmd), baseline[interpreter(cmd)])\n      if sim < 0.6 or kl > THRESH:\n\
      \          alert(cmd, similarity=sim, kl=kl)"
- question: When commands are vectorized with TF-IDF over character 3-grams and clustered with DBSCAN,
    do small dense clusters appear that deviate from benign behavior and represent obfuscation variants?
  context: Adversaries often reuse a single obfuscation recipe across many commands, producing tight clusters
    that are similar to each other but unlike benign traffic. Vectorizing with character 3-gram TF-IDF
    and clustering with DBSCAN exposes these small dense groups for investigation; reporting the top-3
    distinguishing n-grams per cluster gives the analyst an explainable handle on what makes the cluster
    anomalous. A positive result is a cluster of related, non-benign commands that may share a campaign
    or tool, supporting the Stealth hunt for repeated concealed execution.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  // TF-IDF char 3-grams + DBSCAN\n  X = tfidf(commands, analyzer='char', ngram=(3,3))\n \
      \ labels = DBSCAN(eps=0.3, min_samples=5).fit(X)\n  for c in small_dense_clusters(labels):\n   \
      \   report(cluster=c, members=members(c), top_ngrams=distinguishing_ngrams(c, n=3))"
- question: When PowerShell is parsed to its abstract syntax tree and classified on node-type embeddings,
    do any scripts classify as obfuscated despite casing or concatenation tricks that defeat text-based
    rules?
  context: 'Casing changes and string splitting alter the text of a command but not its underlying AST
    structure, so an AST-based classifier is invariant to those evasions. Parsing PowerShell to its AST
    and classifying on node-type embeddings catches obfuscation that text signatures miss while reducing
    false positives from superficial text variation. A positive result is a script whose structural composition
    matches malicious obfuscation patterns and should be deobfuscated and reviewed. This uses AST-based
    deep learning and the hybrid text/token/AST approach of Fang et al.


    References: [AST-Based Deep Learning for Detecting Malicious PowerShell](https://dl.acm.org/doi/10.1145/3243734.3278496);
    [Fang et al.](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099); [mpsd code](https://github.com/das-lab/mpsd).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  // AST node-type embedding classifier\n  ast = parse_powershell_ast(scriptblock)\n  emb\
      \ = node_type_embedding(ast)\n  if classifier.predict_proba(emb) > 0.85:\n      alert(scriptblock,\
      \ score=classifier.predict_proba(emb))"
- question: Are there unbroken alphanumeric or Base64 strings longer than 128 characters with mixed case
    and digits in command lines or URIs, or explicit use of PowerShell -enc/-EncodedCommand?
  context: 'Long opaque encoded blobs are a hallmark of payload delivery and encoded command execution,
    whether in a process command line or an outbound URI. Alerting on unbroken 128+ character mixed-case
    alphanumeric strings (a volume signal) and on -enc/-EncodedCommand use gives a simple, high-yield
    detection for encoded execution. A positive result on a host process should be decoded and tied to
    the parent and user; a positive result on Zeek http/dns egress may indicate C2 or exfiltration channels.
    This aligns with the Sigma encoded-PowerShell rule and supports the Stealth PIR.


    References: [Suspicious Encoded PowerShell Command Line](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd/).'
  answer_sources: &id003
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Zeek http.log
  - Zeek dns.log
  - auditd:SYSCALL execve
  - 'NAI: Network egress points (Zeek) and all enterprise endpoints (host process logs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  search (EventCode=4688 OR EventCode=4104 OR index=zeek sourcetype=http OR index=zeek sourcetype=dns)\n\
      \  | rex max_match=0 field=CommandLine \"(?<blob>[A-Za-z0-9+/]{128,})\"\n  | where (isnotnull(blob)\
      \ AND has_mixed_case_digits(blob)) OR match(CommandLine,/-enc|-EncodedCommand/i)\n  | alert"
- question: Does the Shannon entropy of a command or token exceed the benign band (roughly 4.5-6.5 bits/byte)
    and approach or exceed ~7.0, above the 99.5th percentile for its parent-child process pair?
  context: 'Encoded or compressed content has markedly higher entropy than human-written code or text.
    Computing Shannon entropy per command/token, baselining it per parent-child process pair, and flagging
    values above the 99.5th percentile isolates likely encoded payloads while suppressing benign high-entropy
    noise specific to a process. A positive result is a high-entropy argument that should be decoded to
    determine whether it conceals an executable payload. Thresholds follow Lyda & Hamrock and are operationalized
    by Elastic''s high command-line entropy detection.


    References: [Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989); [Elastic high command-line
    entropy](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).'
  answer_sources: *id003
  range: Last 90 days; baseline entropy per parent-child pair
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  search index=endpoint\n  | eval ent=shannon_entropy(CommandLine)\n  | eventstats perc99_5(ent)\
      \ AS p995 BY ParentImage, ChildImage\n  | where ent >= p995 OR ent > 7.0\n  | table _time, host,\
      \ ParentImage, ChildImage, ent, CommandLine\n  | alert"
- question: When candidate tokens are decoded as Base64/hex/URL, do clean decodes reveal executable keywords
    such as IEX, http, or DownloadString, and how does the decode-failure rate trend over time?
  context: 'Decoding turns an opaque token into actionable evidence: a clean decode that yields execution
    or download keywords is a strong escalation, while decode failure or non-printable output is a distinct
    state signal that should be downweighted as a likely benign opaque ID. Tracking persistent high decode-failure
    rates can reveal custom encodings worth a dedicated hunt, since adversaries may invent encodings precisely
    to defeat your decoders. This decode-outcome profiling distinguishes encoded payloads from benign
    identifiers and directly informs whether obfuscation hides malicious execution.


    References: [DOSfuscation](https://i.blackhat.com/briefings/asia/2018/asia-18-bohannon-invoke_dosfuscation_techniques_for_fin_style_dos_level_cmd_obfuscation-wp.pdf).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  for token in candidate_tokens(cmd):\n      d = try_decode(token, ['base64','hex','url'])\n\
      \      if d.failed or non_printable(d.out): state='downweight'\n      elif match(d.out, /(IEX|http|DownloadString)/i):\
      \ escalate(cmd, decoded=d.out)\n  | timechart decode_failure_rate BY host  // persistent high failure\
      \ => custom-encoding hunt"
- question: Does a seasonal time-series model of hourly mean command-line entropy per host reveal sustained
    spikes that deviate from the expected daily/weekly pattern?
  context: Single high-entropy commands can hide in noise, but a sustained rise in a host's average command-line
    entropy is a frequency signal of bulk encoded execution. Applying a Seasonal-ARIMA or STL model to
    hourly mean entropy per host accounts for normal business-cycle variation and alerts only on genuine,
    sustained deviations; reporting the contributing processes and tokens makes the alert actionable.
    A positive result is a host whose entropy profile shifts in a way that benign seasonality cannot explain,
    warranting investigation of what changed on that host.
  answer_sources: *id003
  range: Last 90 days; hourly aggregation with seasonal decomposition
  queries:
  - technology: SIEM/ML pseudocode
    query: "  // Seasonal-ARIMA / STL on hourly mean entropy per host\n  series = hourly_mean_entropy(host)\n\
      \  fit = STL(series, period=24).fit()\n  resid = series - fit.trend - fit.seasonal\n  if sustained(resid\
      \ > 3*resid.std()):\n      alert(host, contributing_processes=top_procs(host))"
- question: When commands are scored with a BERT-style command-line embedding model, which encoded tokens
    or commands fall far from benign clusters in embedding space?
  context: 'Embedding models learn the distribution of normal command lines and can flag commands whose
    learned representation is anomalous even when no explicit rule fires. Scoring commands with a BERT-style
    embedding model and alerting on high reconstruction or embedding distance catches novel encoded tokens;
    surfacing the nearest benign neighbors helps the analyst judge how and why the command differs from
    normal. A positive result is a command that is semantically distant from anything benign, a strong
    lead for the Stealth hunt. This follows CrowdStrike''s BERT command-line anomaly approach.


    References: [BERT Embeddings for Command-Line Anomaly Detection](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  // BERT command-line embedding anomaly\n  emb = bert_cmdline_embed(cmd)\n  dist = embedding_distance(emb,\
      \ benign_centroids)\n  if dist > THRESH:\n      alert(cmd, distance=dist, nearest_benign=neighbors(emb,\
      \ n=3))"
- question: Do PowerShell script blocks perform concatenation, -join, or -f formatting operations immediately
    followed by invocation keywords (IEX, &, .Invoke()), or do cmd.exe sessions build strings with set/for
    loops and then call them?
  context: 'Dynamic command construction assembles the real command at runtime so that the static command
    line reveals nothing malicious until it is evaluated. Matching build-then-invoke patterns in PowerShell
    and cmd.exe build-and-call loops catches this deferred-execution obfuscation on application servers,
    developer workstations, and admin jump boxes where scripting is common but should still be scrutinized.
    A positive result is a command that reconstructs and immediately executes a hidden string, a classic
    concealment behavior under Stealth. This draws on Elastic''s suspicious cmd arguments rules and DOSfuscation.


    References: [Suspicious Windows Command Shell Arguments](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/);
    [DOSfuscation](https://i.blackhat.com/briefings/asia/2018/asia-18-bohannon-invoke_dosfuscation_techniques_for_fin_style_dos_level_cmd_obfuscation-wp.pdf).'
  answer_sources: &id004
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - auditd:SYSCALL execve
  - macos:endpointsecurity ES_EVENT_TYPE_NOTIFY_EXEC
  - 'NAI: Application servers, developer workstations, and administrative jump boxes where scripting and
    dynamic command generation are common.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  search (EventCode=4104 OR EventCode=4688 OR source=auditd:execve)\n  | where CommandLine\
      \ matches /((\\+|-join|-f)\\s*.+(IEX|Invoke-Expression|&\\s|\\.Invoke\\(\\)))|(set\\s.+for\\s+\\\
      /[lf].+call)/i\n  | table _time, host, user, ParentImage, CommandLine\n  | alert"
- question: Which scripts fall in the top 2% for the ratio of operators, delimiters, and environment-variable
    references relative to a benign baseline?
  context: 'Dynamically constructed commands are dense with operators, delimiters, and variable references
    because they stitch together fragments at runtime. Computing these structural ratios per script against
    a benign baseline and flagging the top 2% surfaces scripts whose construction profile is abnormal
    even without a matching keyword. A positive result is a script that is structurally consistent with
    runtime command assembly and should be reviewed for what it ultimately runs. Cutoffs should be derived
    from your own 30-day script corpus, using the structural feature families from Revoke-Obfuscation.


    References: [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).'
  answer_sources: *id004
  range: Last 90 days; derive cutoffs from a 30-day script corpus
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  search index=endpoint\n  | eval ops=count_operators(CommandLine), delims=count_delims(CommandLine),\
      \ envrefs=count_envvars(CommandLine)\n  | eval score=(ops+delims+envrefs)/len(CommandLine)\n  |\
      \ eventstats perc98(score) AS p98 BY ParentImage\n  | where score > p98\n  | alert"
- question: When a gradient-boosting (XGBoost) model scores commands on parent process, environment-variable
    counts, redirection, character ratios, entropy, and length, which commands receive a high malicious
    probability, and which SHAP features explain it?
  context: 'A supervised gradient-boosting model combines many weak structural signals into a single calibrated
    score, catching dynamic obfuscation that no individual feature flags. Training XGBoost on parent process,
    env-variable counts, redirection, character ratios, entropy, and length, then alerting on high malicious
    probability while emitting the top-3 SHAP features, gives the analyst both a prioritized lead and
    an explanation of why it fired. A positive result with intuitive SHAP features (e.g., extreme entropy
    plus unusual parent) is a strong escalation. This follows the Google Cloud obfuscated-command ML work
    and Fang et al.


    References: [Obfuscated Command Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/);
    [Fang et al.](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  // XGBoost on structural features\n  feats = [parent_image, env_var_count, redirection_count,\
      \ char_ratios, entropy, length]\n  p = xgb.predict_proba(feats)\n  if p > 0.9:\n      alert(cmd,\
      \ prob=p, top_shap=shap_top(feats, n=3))"
- question: Does an ELECTRA-style command-line language model with GUID and path token normalization flag
    generic obfuscation of LOLBin executions that evade signatures?
  context: 'Living-off-the-land binaries are often invoked with obfuscated arguments that slip past static
