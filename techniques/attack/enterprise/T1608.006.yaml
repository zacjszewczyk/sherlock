name: 'T1608.006: SEO Poisoning'
id: 3da6c9b7-005b-4ec0-a1c1-71053f428d1b
description: 'This playbook helps an analyst investigate whether an adversary is using SEO poisoning to
  stage malicious websites and lure internal users into drive-by-compromise or supply-chain attacks. SEO
  poisoning manipulates search engine rankings (keyword stuffing, hidden text, purchased/planted inbound
  links, compromised-WordPress hosts) so that adversary-controlled sites hosting malicious payloads rank
  highly for topics matching victim interests or trending news. It is frequently combined with evasive
  redirect chains and cloaking (serving different content to search-referred users versus crawlers). Because
  most of the staging activity occurs outside the target''s visibility, this playbook concentrates on
  the observable downstream effects inside the enterprise: internal hosts contacting threat-intel-flagged
  SEO-poisoning/Gootloader infrastructure; search-referrer browsing sessions that traverse rapid multi-hop
  HTTP 3xx redirect chains; high-risk file downloads (ZIP/ISO/7z/JS) followed by suspicious browser child-process
  execution (wscript, powershell, mshta); and ''flocking'' events where many internal hosts converge on
  a newly observed, low-reputation domain via a search engine. It pairs deterministic threat-intel and
  rule-based floors with statistical baselining (domain age, prevalence, Z-score bursts, redirect-chain
  percentiles, command-line entropy) and machine-learning scoring (lexical URL models, supervised session/process
  classifiers, time-series clustering) so the analyst can detect, confirm, and pivot from a poisoned lure
  to related infrastructure.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any internal hosts resolving or connecting to domains or IP addresses that exactly match
    a curated, high-confidence threat-intelligence feed of indicators tied to active SEO-poisoning and
    Gootloader campaigns?
  context: 'This is the deterministic detection floor for the Resource Development tactic: it confirms
    an internal host has touched infrastructure already attributed to SEO-poisoning/Gootloader operations
    (compromised-WordPress fake-forum hosts, redirector nodes, payload servers). Join Zeek dns.log query
    names and Zeek conn.log destination IPs against the curated feed and raise a high-severity alert on
    any exact match. A positive result means the adversary''s staged lure infrastructure was reached and
    warrants immediate host triage for follow-on drive-by execution; a negative result only means no known-bad
    indicator was seen, so retain the statistical and ML layers below. Never remove this floor when ML
    scoring is layered on top.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internet gateway/proxy servers, Corporate DNS resolvers, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      (dns.log query OR conn.log id.resp_h) JOIN threat_intel_feed[type IN (seo_poisoning, gootloader)]

      WHERE dns.query == feed.domain OR conn.id_resp_h == feed.ip

      => alert severity=HIGH, label="SEO-poisoning/Gootloader TI match", emit src_host, matched_indicator
- question: Among domains newly queried by internal hosts, which ones are recently registered, accessed
    by an unusually small fraction of the organization, or exhibit elevated failed-resolution rates consistent
    with dead or rotating poisoned infrastructure?
  context: SEO-poisoning operators rotate through short-lived, low-prevalence domains, so passive-DNS
    features expose them even without prior intel. For each domain in Zeek dns.log compute domain age
    (first-seen), unique-host prevalence (unique hosts querying / total hosts), and per-domain NXDOMAIN/failed-resolution
    rate. Flag domains with prevalence below 0.1% accessed by more than 3 hosts within 1 hour, registered
    within the last 90 days, or with an elevated NXDOMAIN ratio. Derive thresholds from your own 30-day
    DNS baseline rather than fixed magic numbers. Surface age, prevalence, and failure rate directly in
    the alert so the analyst can judge whether this is benign new SaaS adoption or adversary lure staging
    in the Resource Development phase. Positive hits feed the flocking and download checks below.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internet gateway/proxy servers, Corporate DNS resolvers, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = dns.log over last 30d -> per_domain(first_seen, unique_hosts, total_hosts, nxdomain_rate)

      FOR domain in dns.log[today]:
        prevalence = unique_hosts(domain)/total_hosts
        age_days = now - first_seen(domain)
        IF (prevalence < 0.001 AND distinct_hosts_1h(domain) > 3) OR age_days < 90 OR nxdomain_rate(domain)
      > baseline_p95:
           alert(domain, age_days, prevalence, nxdomain_rate)
- question: Do newly observed domains or URLs score as suspicious under a lexical model (Shannon entropy,
    n-gram rarity, Levenshtein/character-and-word CNN), and were they reached via a search-engine referrer?
  context: Poisoned and algorithmically generated domains often have unusual lexical structure. Apply
    lexical scoring to newly observed domains/URLs from Zeek dns.log/http.log using Shannon-entropy and
    Levenshtein features plus a character/word-level URL classifier (URLNet-style). Then correlate high-confidence
    hits against Zeek http.log to confirm a search-engine referrer, which is the signature path of an
    SEO-poisoning lure during Resource Development. Escalate correlated findings and report the top-3
    contributing features (entropy, n-gram rarity, search referrer) in the alert so the analyst understands
    the model's reasoning. A high lexical score with a search referrer is far more actionable than either
    signal alone.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internet gateway/proxy servers, Corporate DNS resolvers, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      FOR url in http.log[new] + dns.log[new]:
        score = lexical_model(url)   # entropy + Levenshtein + char/word-CNN (URLNet)
        IF score > threshold AND http.log.referer ~ /(google|bing|duckduckgo|yahoo)\./:
           alert(url, score, top3_features=[entropy, ngram_rarity, search_referrer])
- question: Are any internal source IPs, after arriving from a major search engine, being pushed through
    three or more HTTP 3xx redirects to different hosts within a 5-second window?
  context: Query-triggered redirection chains are the operational hallmark of search-redirection attacks,
    with the vast majority of infected domains chaining redirects to a final malicious destination. From
    Zeek http.log, identify sessions whose referer is a major search engine, then alert if a single source
    IP experiences 3 or more HTTP 3xx redirects to different host headers within 5 seconds. This is a
    fixed-threshold deterministic floor that catches the redirector mesh adversaries build during Resource
    Development to funnel search traffic toward staged payloads. Keep this floor even when the statistical
    and ML session models run; a positive result is a strong candidate for an active poisoned lure click.
  answer_sources:
  - 'Internet Scan: Response Content'
  - Zeek http.log
  - 'NAI: Web content filters, Internet gateway/proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      sessions = http.log WHERE referer ~ /(google|bing|duckduckgo|yahoo)\./

      GROUP BY id_orig_h, sliding_window(5s):
        redirects = events WHERE status_code IN (301,302,303,307,308)
        IF count(distinct host) over redirects >= 3:
           alert(id_orig_h, redirect_chain_hosts, window_start)
- question: When the same externally hosted URL first reached via a search referrer is re-fetched with
    a crawler User-Agent and no referrer, does the final destination host, status code, or response body
    length/hash diverge?
  context: Cloaking - serving benign content to crawlers/defenders but malicious content to real search-referred
    users - is the defining evasion of SEO/ad poisoning. For external URLs first reached via a search
    referrer, re-fetch the same URL with a crawler User-Agent (e.g., Googlebot) and no referrer, then
    alert on any divergence in final destination host, HTTP status code, or response body length/hash.
    Divergence is strong evidence the site is deliberately hiding its malicious behavior from inspection
    - a high-confidence Resource Development indicator. No divergence reduces suspicion but does not clear
    the URL if other signals fire. This active-probe technique should be rate-limited and sandboxed to
    avoid tipping off the adversary or executing payloads on production assets.
  answer_sources:
  - 'Internet Scan: Response Content'
  - Zeek http.log
  - 'NAI: Web content filters, Internet gateway/proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      FOR url in http.log WHERE referer ~ search_engine AND host is external:
        user_view  = recorded_response(url)            # actual search-referred fetch
        crawler_view = sandbox_fetch(url, UA="Googlebot", referer=none)
        IF user_view.final_host != crawler_view.final_host
           OR user_view.status != crawler_view.status
           OR hash(user_view.body) != hash(crawler_view.body):
              alert(url, divergence_fields)
- question: Do search-referred browsing sessions have redirect-chain lengths or inter-redirect time-deltas
    that exceed the 99th percentile of the organization's normal baseline?
  context: Redirect count and timing are established drive-by features. Build a 30-day baseline distribution
    of redirect-chain length and inter-redirect time-deltas per session, then alert on search-referred
    sessions whose chain length exceeds the 99th percentile of baseline. This adaptively catches anomalously
    long automated redirector chains that a fixed threshold might miss in a noisy environment, supporting
    detection of the redirection infrastructure staged during Resource Development. Separately track per-destination
    404/blocked-connection rate as a distinct state signal for dead redirector nodes, since poisoned infrastructure
    decays quickly. An above-percentile session paired with a low-reputation final host is a priority
    lead.
  answer_sources:
  - 'Internet Scan: Response Content'
  - Zeek http.log
  - 'NAI: Web content filters, Internet gateway/proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = http.log[30d] -> dist(chain_len), dist(inter_redirect_delta)

      p99_len = percentile(baseline.chain_len, 99)

      FOR session in http.log WHERE referer ~ search_engine:
        IF chain_len(session) > p99_len:
           alert(session, chain_len, final_host, dest_404_rate)
- question: When a supervised model scores search-referred redirection sessions using chain length, timing,
    User-Agent changes, final-destination reputation/age, and landing-page HTML/JS features, which sessions
    are classified as malicious?
  context: A supervised classifier (e.g., Random Forest) combines weak signals into a confident verdict.
    Train on session features - redirect-chain length, inter-redirect time delta, User-Agent change across
    requests, final-destination domain age/reputation, and final-page static HTML/JS features (Prophiler-style).
    Score search-referred sessions and emit the top-3 contributing features per alert so the analyst can
    validate. Optionally block malicious JavaScript inline at the proxy using an SVM over JS q-grams (Cujo-style).
    This catches polished SEO-poisoning lures that evade individual rules during the Resource Development
    phase. High-scoring sessions with recently registered destinations should be escalated for endpoint
    follow-up.
  answer_sources:
  - 'Internet Scan: Response Content'
  - Zeek http.log
  - 'NAI: Web content filters, Internet gateway/proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      features = [chain_len, inter_redirect_delta, ua_change_count, dest_domain_age, dest_reputation,
      html_js_features]

      FOR session in http.log WHERE referer ~ search_engine:
        score = rf_model.predict_proba(features(session))
        IF score > threshold: alert(session, score, top3_features)
        OPTIONAL: proxy_inline_block IF svm_jsqgram(landing_js) == malicious
- question: Following a web request that carried a search-engine referrer, did the host download a high-risk
    file type (ZIP, ISO, 7z, or JavaScript) from a recently registered or compromised-WordPress domain?
  context: This targets the Gootloader-style ZIP->.js delivery pattern that follows a poisoned search
    result. Correlate Zeek http.log records having a search-engine referer with Zeek files.log by session/UID,
    and alert if a downloaded file's MIME type is application/zip, application/x-iso9660-image, application/x-7z-compressed,
    or application/javascript and the source domain was registered within the last 90 days or is a compromised-WordPress
    host. Run Neo23x0 YARA over the extracted response/file body for exploit-kit/landing-page constants
    to add content confirmation. A positive result is a strong indication a user was successfully lured
    to a staged payload (Resource Development culminating in delivery) and the endpoint should be triaged
    for execution immediately.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Endpoint devices (workstations, laptops), Internet gateway/proxy servers, EDR Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      join = http.log JOIN files.log ON uid/session

      WHERE http.referer ~ search_engine
        AND files.mime_type IN (application/zip, application/x-iso9660-image,
                                application/x-7z-compressed, application/javascript)
        AND (domain_age(http.host) < 90d OR is_compromised_wordpress(http.host)):
           alert(host, file, mime, domain_age)
           enrich: yara_scan(file_body, ruleset=Neo23x0)
- question: Did a browser process spawn an unusually rare child process (e.g., wscript.exe, powershell.exe,
    mshta.exe) or launch a child with abnormally high command-line entropy, relative to that browser's
    normal behavior?
  context: After a drive-by from a poisoned link, the browser typically hands off to a script host. Using
    Windows Event ID 4688, baseline child-process frequency per browser executable (chrome.exe, msedge.exe,
    firefox.exe) and alert when a browser spawns a child below the 1st percentile of observed children.
    Also compute command-line Shannon entropy and alert when it exceeds the 98th percentile for that process
    name, since obfuscated/encoded arguments have high entropy. These statistical anomalies catch the
    post-lure execution stage of an SEO-poisoning chain. A browser spawning powershell or wscript with
    a high-entropy command line is a high-fidelity lead warranting endpoint isolation and memory capture.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Endpoint devices (workstations, laptops), Internet gateway/proxy servers, EDR Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = 4688[30d] WHERE parent IN (chrome,msedge,firefox) -> per_parent child freq dist, cmdline_entropy
      dist

      FOR e in 4688 WHERE parent_image IN (chrome.exe, msedge.exe, firefox.exe):
        IF child_freq(parent, e.child) < p01
           OR shannon_entropy(e.cmdline) > p98_for(e.child):
              alert(host, parent, child, cmdline, entropy)
- question: When a supervised classifier scores process-creation events using argument length, character-distribution
    entropy, and suspicious keywords (e.g., IEX, DownloadString, -enc), which browser-spawned child processes
    score as malicious?
  context: The post-drive-by lineage browser -> script host -> powershell is high-fidelity for SEO-poisoning
    execution. Deploy a supervised classifier on Windows Event ID 4688 using process/command-line features
    (argument length, character-distribution entropy, keyword presence such as 'IEX', 'DownloadString',
    '-enc') to score maliciousness, reusing detection-rule logic for suspicious browser child processes
    and unusual parent-child relationships. Escalate high-scoring events whose parent is a browser and
    surface the top-3 contributing features in the alert. This confirms that a poisoned search lure (Resource
    Development) led to code execution on the endpoint, and such events should be treated as active intrusion
    until proven otherwise.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Endpoint devices (workstations, laptops), Internet gateway/proxy servers, EDR Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      features = [arg_length, charset_entropy, has_kw(IEX, DownloadString, -enc, FromBase64String)]

      FOR e in 4688:
        score = clf.predict_proba(features(e))
        IF score > threshold AND parent_image IN (chrome.exe, msedge.exe, firefox.exe):
           escalate(host, e, score, top3_features)
- question: Did more than 10 distinct internal hosts reach a newly observed (first-seen within 30 days)
    domain via a search-engine referrer within a single 24-hour window, indicating a flocking event onto
    a poisoned result?
  context: SEO poisoning concentrates many victims onto a small set of high-ranked poisoned/redirector
    hosts, producing a 'flocking' pattern. For domains first seen in Zeek dns.log within the last 30 days,
    alert if more than 10 distinct internal source IPs access the domain in Zeek http.log with a search-engine
    referer inside one 24-hour window. Tune the host count to environment size and keep it as a deterministic
    floor. A flocking event onto a brand-new, low-reputation domain is a strong signal that the adversary's
    SEO manipulation succeeded in ranking a lure during the Resource Development phase, and all participating
    hosts should be reviewed for downloads and execution.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Corporate DNS resolvers, Internet gateway/proxy servers, Centralized SIEM/Log Aggregator'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      new_domains = dns.log WHERE first_seen within last 30d

      FOR domain in new_domains:
        visitors = COUNT(distinct id_orig_h) FROM http.log
                   WHERE host==domain AND referer ~ search_engine AND ts in 24h_window
        IF visitors > 10: alert(domain, visitors, window)
- question: For domains reached via a search referrer, does the daily count of unique internal visitors
    spike with a Z-score greater than 3.5 against its 30-day rolling baseline, indicating a sudden burst
    onto a possibly poisoned site?
  context: A sudden surge of internal visitors to a previously quiet domain marks a successful poisoning
    campaign. For each external domain reached via a search referrer, maintain a 30-day rolling baseline
    of unique internal visitors per day and alert on Z-score greater than 3.5 spikes. Profile the domain's
    HTTP 404/blocked-connection ratio separately as a failure-state signal for decaying infrastructure.
    Additionally, layer beaconing-regularity statistics (coefficient of variation, FFT periodicity, RITA-style)
    on post-click flows to surface C2 callbacks that follow a successful lure. This statistical view detects
    bursts that fall under the fixed flocking threshold and ties Resource Development staging to downstream
    command-and-control.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Corporate DNS resolvers, Internet gateway/proxy servers, Centralized SIEM/Log Aggregator'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      FOR domain reached via search referrer:
        baseline = rolling_30d(unique_visitors_per_day)
        z = (today_unique_visitors - mean(baseline)) / stddev(baseline)
        IF z > 3.5: alert(domain, z, today_visitors, http_404_ratio)
        enrich: beacon_stats(post_click_flows) -> coeff_of_variation, fft_periodicity
- question: When daily unique-visitor time series across external domains are clustered (e.g., k-shape),
    which domains fall into the 'sudden burst' cluster, and from any confirmed poisoned domain can related
    sibling infrastructure and redirectors be enumerated?
  context: Time-series clustering groups domains by visit-pattern shape, isolating the spike profile typical
    of a freshly poisoned lure. Apply k-shape clustering to daily unique-visitor counts across external
    domains and investigate the 'sudden burst' cluster, prioritizing low-reputation/recently registered
    members. From any confirmed poisoned domain, use guided enumeration of related infrastructure via
    content/link/SEO/DNS gadgets (EVILSEED-style) to find sibling poisoned clusters and redirectors. Report
    cluster shape, reputation, and registration age as the top contributing features. This both detects
    new lures and enables proactive pivoting across the adversary's Resource Development infrastructure,
    expanding a single confirmed hit into the full campaign footprint for blocking.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Corporate DNS resolvers, Internet gateway/proxy servers, Centralized SIEM/Log Aggregator'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      series = per_domain daily_unique_visitors[30d]

      clusters = kshape(series)

      burst_cluster = cluster matching sudden-spike centroid

      FOR domain in burst_cluster ORDER BY (low_reputation, recent_registration):
        alert(domain, cluster_shape, reputation, registration_age)
      FROM confirmed_poisoned_domain: enumerate_related(content, link, seo, dns gadgets)  # EVILSEED pivot
