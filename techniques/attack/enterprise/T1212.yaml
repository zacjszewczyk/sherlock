questions:
- question: '[Credential Access] Netlogon null-byte & EFSRPC IDS signature: Can you determine whether
    network traffic directed at a Domain Controller carrying byte patterns or RPC call sequences characteristic
    of known credential-access exploits (e.g., all-zero Netlogon challenge/credential for Zerologon, or
    EfsRpcOpenFileRaw EFSRPC calls for PetitPotam) -- specifically, using the ''Netlogon null-byte & EFSRPC
    IDS signature'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary exploits programming
    errors in credentialing and authentication mechanisms -- Kerberos/Netlogon, LSASS, PAM/sshd, macOS
    OpenDirectory/Keychain, or cloud identity providers -- to steal, forge, or replay credentials and
    gain authenticated access (and often Privilege Escalation). Exploitation leaves traces in network
    RPC/authentication telemetry, authentication-service stability, process lineage, and authentication
    logs. This evidence focuses on the condition that there is network traffic directed at a Domain Controller
    carrying byte patterns or RPC call sequences characteristic of known credential-access exploits (e.g.,
    all-zero Netlogon challenge/credential for Zerologon, or EfsRpcOpenFileRaw EFSRPC calls for PetitPotam).
    This Symbolic Logic approach looks for the following signal: Implement and monitor a network IDS signature
    that alerts on Netlogon RPC authentication attempts (NetrServerAuthenticate3/NetrServerPasswordSet2)
    where the ClientChallenge and ClientCredential fields are composed entirely of null bytes, or on EFSRPC
    API calls to ''EfsRpcOpenFileRaw'' targeting a Domain Controller. The all-zero challenge/credential
    pattern is the deterministic fingerprint of Zerologon (CVE-2020-1472); because each attempt succeeds
    only ~1/256 of the time, also alert when a single non-DC host issues >50 NetrServerAuthenticate3 attempts
    within 10 seconds, then watch for a follow-on NetrServerPasswordSet2 ([Zerologon, Tervoort](https://www.secura.com/uploads/whitepapers/Zerologon.pdf)).
    Keep these hard byte/count thresholds in place permanently; layer ML in parallel. A positive result
    -- a deterministic rule match, a statistical outlier, or a model alert -- indicates that an authentication/credential
    mechanism may have been exploited; pivot to the responsible source host, the targeted Domain Controller
    or authentication server, the specific operation or ticket involved, the process lineage, and any
    follow-on authenticated access or privilege escalation. A negative result helps rule out this exploitation
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or novel credential-access exploits.'
