name: 'T1212: Exploitation for Credential Access'
id: 26eec6da-8573-49c1-b394-80ee7b717d79
description: 'This playbook helps an analyst investigate whether an adversary has exploited a software
  vulnerability in an authentication or credential-validation mechanism to access, forge, or replay credentials
  on the network as part of the Credential Access tactic. It guides the hunt across several complementary
  angles spanning Windows, Linux, macOS, and cloud identity providers: network exploitation of Domain
  Controller RPC interfaces (Zerologon CVE-2020-1472 all-zero Netlogon challenges, PetitPotam EfsRpcOpenFileRaw
  coercion) detected through Zeek conn/dce_rpc/ntlm telemetry, signatures, RPC operation-rate baselining,
  payload byte-frequency anomaly scoring, and supervised/unsupervised models; Kerberos abuse such as Kerberoasting
  and RC4-HMAC downgrade (CVE-2022-37966) seen in Event ID 4769/4771, forged tickets (MS14-068), and authentication-graph
  link prediction; LSASS credential-access exploits evidenced by lsass.exe crashes (Event ID 1000), abnormal
  handle access (Sysmon EID 10), anomalous process lineage, and memory-read clustering; exploitation of
  internet-facing applications where a web-server process spawns shells or post-exploitation tooling that
  then reaches authentication servers; and authentication replay attacks identified through reused NTLM
  nonces, Kerberos authenticator timestamp reuse, near-zero inter-arrival timing, and sequence-anomaly
  models. Detection methods combine symbolic-logic rules, statistical baselining/change-point detection,
  and machine-learning models applied to Windows Security/Sysmon/Application logs, auditd, macOS unified
  logs, Zeek network logs, PCAP, and cloud sign-in/audit logs, so the analyst can corroborate suspected
  credential-access exploitation against process lineage, RPC/Kerberos behavior, service stability, and
  authentication context.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
