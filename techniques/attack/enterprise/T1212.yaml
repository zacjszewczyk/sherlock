    This Statistical Method approach looks for the following signal: Using Zeek dce_rpc.log, establish
    a baseline of RPC operations, endpoints, and source hosts that communicate with authentication servers.
    Compute per-source-host Volume (operations/min) and Frequency (count/min) for sensitive operations
    (NetrServerAuthenticate3, EfsRpcOpenFileRaw, LsarQueryInformationPolicy, DsrGetDcNameEx) and the State
    (RPC fault/success ratio). Alert when a host''s call rate for any single sensitive operation exceeds
    the 99th percentile of its 30-day baseline, or when its RPC fault rate spikes (failed exploit attempts
    produce bursts of STATUS_ACCESS_DENIED/fault packets). Apply CUSUM or Bayesian online change-point
    detection to the per-minute operation-rate series to flag abrupt regime shifts ([Time Series Change
    Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)). Derive
    thresholds per environment from each DC''s own history. A positive result -- a deterministic rule
    match, a statistical outlier, or a model alert -- indicates that an authentication/credential mechanism
    may have been exploited; pivot to the responsible source host, the targeted Domain Controller or authentication
    server, the specific operation or ticket involved, the process lineage, and any follow-on authenticated
    access or privilege escalation. A negative result helps rule out this exploitation vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-and-slow, or novel credential-access exploits.'
