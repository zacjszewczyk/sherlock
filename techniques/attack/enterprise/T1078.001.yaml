questions:
- question: >-
    Can you detect and confirm the following condition, then triage it as default-account abuse: successful
    logons that use known factory-default usernames or service credentials on exposed systems, especially
    when the account should have been changed or disabled, are strong indicators of default-account abuse.
    The evidence usually includes a successful authentication from an external or unusual source, the
    account name matching a vendor default list, and a target host that retains default credentials on
    an appliance or DMZ system? Apply the 'Default-account remote watchlist' approach (Symbolic Logic)
    to surface and validate this activity.
  context: >-
    This question supports the information requirement 'Has the adversary gained initial access using
    default accounts?' and is relevant to the Stealth tactic. This is a deterministic, rule-based detection:
    Maintain a curated watchlist of vendor/OS default usernames and service accounts (`admin`, `administrator`,
    `guest`, `root`, `cisco`, `vpxuser`, Kubernetes `default`) and alert when a successful authentication
    (Windows Event ID 4624 Logon Type 3/10, auditd USER_LOGIN, esxi auth.log, or network-device syslog)
    occurs for a watched account from a non-RFC1918 or never-before-seen source. Require the success state
    and record the count of preceding Windows Event ID 4625 failures from the same source as corroboration,
    mirroring the path-based login inference of Hopper: Modeling and Detecting Lateral Movement and the
    failed/successful thresholding in Detecting Password Spraying Attacks (Splunk). Treat password-based
    root/SSH logins as higher severity than key-based. A positive result (a watched default account, a
    first-seen edge, a threshold breach, or a high model score) warrants immediate triage: validate the
    source, the host role, whether the account should be disabled, and any preceding failed-authentication
    burst or maintenance window that could explain it. A negative result lowers, but does not eliminate,
    suspicion of default-account abuse for this evidence path.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - >-
    NAI: DMZ-hosted application servers, VPN Concentrators, Internet-facing network appliances (firewalls,
    routers), Domain Controllers
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      // Maintain a curated watchlist of vendor/OS default usernames and service accounts (`admin`, `administrator`,
      `guest`, `root`, `cisco`, `vpxuser`, Kubernetes `def

      FILTER events WHERE EventID IN [4624, 4625]

      MATCH indicator IN ["admin", "administrator", "guest", "root", "cisco", "vpxuser"]

      WHERE account IN default_account_watchlist AND condition_met

      THEN raise_alert(severity=high, include=[host, account, source, count_prior_failures])
- question: >-
    Can you detect and confirm the following condition, then triage it as default-account abuse: successful
    logons that use known factory-default usernames or service credentials on exposed systems, especially
    when the account should have been changed or disabled, are strong indicators of default-account abuse.
    The evidence usually includes a successful authentication from an external or unusual source, the
    account name matching a vendor default list, and a target host that retains default credentials on
    an appliance or DMZ system? Apply the 'Rare default-login frequency' approach (Statistical Method)
    to surface and validate this activity.
  context: >-
    This question supports the information requirement 'Has the adversary gained initial access using
    default accounts?' and is relevant to the Stealth tactic. This is a statistical/anomaly-baseline detection:
    For each default account compute a 90-day baseline of successful-login frequency (count/day), distinct
    source ASN/country, and time-of-day, then flag any success below the 5th-percentile frequency or following
    dormancy using median-absolute-deviation/modified z-score and online change-point detection (A Survey
    of Methods for Time Series Change Point Detection). Separately profile the failure state: a spike
    in the 4625/blocked-connection ratio preceding the success raises the score. Derive per-environment
    thresholds from enterprise authentication baselines such as the LANL User-Computer Authentication
    Dataset. A positive result (a watched default account, a first-seen edge, a threshold breach, or a
    high model score) warrants immediate triage: validate the source, the host role, whether the account
    should be disabled, and any preceding failed-authentication burst or maintenance window that could
    explain it. A negative result lowers, but does not eliminate, suspicion of default-account abuse for
    this evidence path.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - >-
    NAI: DMZ-hosted application servers, VPN Concentrators, Internet-facing network appliances (firewalls,
    routers), Domain Controllers
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      // For each default account compute a 90-day baseline of successful-login frequency (count/day),
      distinct source ASN/country, and time-of-day, then flag any succes

      baseline = rolling_stats(metric) over history GROUP BY account/host

      score = modified_zscore(observation, baseline)  // MAD-based

      WHERE score > 3 OR observation beyond percentile_threshold

      THEN raise_alert(include=[account, host, metric, score])
