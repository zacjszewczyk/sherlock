    frequency (count/day), distinct source ASN/country, and time-of-day, then flag any success below the
    5th-percentile frequency or following dormancy using median-absolute-deviation/modified z-score and
    online change-point detection ([A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)).
