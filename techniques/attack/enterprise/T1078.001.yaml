questions:
- question: 'Can you detect and confirm the following condition, then triage it as default-account abuse:
    successful logons that use known factory-default usernames or service credentials on exposed systems,
    especially when the account should have been changed or disabled, are strong indicators of default-account
    abuse. The evidence usually includes a successful authentication from an external or unusual source,
    the account name matching a vendor default list, and a target host that retains default credentials
    on an appliance or DMZ system. Apply the ''Default-account remote watchlist'' approach (Symbolic Logic)
    to surface and validate this activity.'
  context: 'This question supports the information requirement ''Has the adversary gained initial access
    using default accounts?'' and is relevant to the Stealth, Persistence, Privilege Escalation, and Initial
    Access tactics. Evidence to look for: Successful logons that use known factory-default usernames or
    service credentials on exposed systems, especially when the account should have been changed or disabled,
    are strong indicators of default-account abuse. The evidence usually includes a successful authentication
    from an external or unusual source, the account name matching a vendor default list, and a target
    host that retains default credentials on an appliance or DMZ system. Detection approach — this is
    a deterministic, rule-based detection: Maintain a curated watchlist of vendor/OS default usernames
    and service accounts (`admin`, `administrator`, `guest`, `root`, `cisco`, `vpxuser`, Kubernetes `default`)
    and alert when a successful authentication (Windows Event ID 4624 Logon Type 3/10, auditd USER_LOGIN,
    esxi auth.log, or network-device syslog) occurs for a watched account from a non-RFC1918 or never-before-seen
    source. Require the success state and record the count of preceding Windows Event ID 4625 failures
    from the same source as corroboration, mirroring the path-based login inference of [Hopper: Modeling
    and Detecting Lateral Movement](https://www.usenix.org/system/files/sec21-ho.pdf) and the failed/successful
    thresholding in [Detecting Password Spraying Attacks (Splunk)](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).
    Treat password-based root/SSH logins as higher severity than key-based. Positive vs negative: a positive
    result (a watched default account hit, a first-seen account-to-host edge, a statistical threshold
    breach, or a high model/classifier score) warrants immediate triage — validate the source IP/geo,
    the target host role, whether the default account should have been disabled or its credentials rotated,
    and any preceding failed-authentication burst or sanctioned maintenance window that could benignly
    explain it. A negative result lowers, but does not eliminate, suspicion of default-account abuse for
    this evidence path; corroborate with the other approaches for the same evidence item.'
