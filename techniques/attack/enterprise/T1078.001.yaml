    raises the score. Derive per-environment thresholds from enterprise authentication baselines such
    as the [LANL User-Computer Authentication Dataset](https://csr.lanl.gov/data/auth/). Positive vs negative:
    a positive result (a watched default account hit, a first-seen account-to-host edge, a statistical
    threshold breach, or a high model/classifier score) warrants immediate triage — validate the source
    IP/geo, the target host role, whether the default account should have been disabled or its credentials
    rotated, and any preceding failed-authentication burst or sanctioned maintenance window that could
    benignly explain it. A negative result lowers, but does not eliminate, suspicion of default-account
    abuse for this evidence path; corroborate with the other approaches for the same evidence item.'
