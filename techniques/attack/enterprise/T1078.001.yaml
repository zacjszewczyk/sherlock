name: 'T1078.001: Valid Accounts: Default Accounts'
id: 404d37b8-4a8c-4257-998e-7bc1c946686d
description: This playbook helps an analyst investigate the abuse of built-in, factory-default, and provider-set
  accounts (e.g., Windows Administrator/Guest, Linux/ESXi root, ESXi vpxuser, AWS root, Kubernetes default,
  and network-device admin/cisco credentials) for Initial Access, Persistence, Privilege Escalation, and
  Defense Evasion. It guides the hunt across authentication telemetry (successful and failed logons from
  unusual or external sources, first-seen account-to-host pairs, dormant-account reactivation, credential
  stuffing and password spraying), endpoint process activity (interactive shells from service accounts,
  credential-dumping and security-disabling command lines, persistence via scheduled tasks/services/run
  keys, privileged group changes and audit-policy tampering), and network behavior (external scanning,
  C2 beaconing, and corporate-proxy bypass). For each evidence path it offers deterministic rules, statistical
  baselining, and machine-learning approaches so a SOC analyst can detect, corroborate, and triage default-account
  abuse across Windows, Linux/macOS, ESXi, cloud, and network-device environments.
type: technique
