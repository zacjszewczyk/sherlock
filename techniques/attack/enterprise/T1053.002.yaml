    Event ID 4688) and score with an explainable gradient-boosted classifier; alert on scheduled-task
    command lines above probability 0.8 and surface the top-3 contributing features (e.g., entropy, encoded-string
    token, rare path) in alert text ([Obfuscated Command Line Detection Using Machine Learning, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/);
    [Command-line Obfuscation Detection using Small Language Models, Tran et al.](https://arxiv.org/html/2408.02637v1)).
    A positive result (a match, a statistical outlier, or a high model score) should be triaged as possible
    T1053.002 activity and corroborated with the surrounding process tree, the creating account, and downstream
    network/file actions before escalation; a negative result helps scope the host out for this hypothesis.'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Workstations, Network Egress
    Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "// ML scoring of scheduled-task / command-line features\nsource IN (Windows Event ID 4698,\
      \ Windows Event ID 4688, Zeek conn.log, Zeek dns.log)\n| eval features = extract(command_line_length,\
