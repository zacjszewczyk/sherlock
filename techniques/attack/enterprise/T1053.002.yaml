      \ trigger_type,\n                          imports, sections, file_entropy)\n| score model=anomaly_or_classifier(features)\n\
      // model: gradient-boosted / Isolation Forest / one-class SVM / BERT-embedding / LSTM / provenance-graph\n\
      | where score >= 0.8\n| eval explanation = top_3_contributing_features(features)\n| table _time,\
      \ host, user, process_image, command_line, score, explanation\n| alert priority=high"
