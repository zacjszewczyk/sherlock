name: 'T1053.002: At'
id: a60a260a-bb15-4b8e-a6df-3601e7803d11
description: 'This playbook helps an analyst investigate adversary abuse of the deprecated ''at'' scheduled-task/job
  utility (and the related Win32_ScheduledJob WMI class on Windows, and atd on Linux/macOS) across the
  Execution, Persistence, and Privilege-Escalation tactics. It guides hunting for: creation and execution
  of scheduled tasks/jobs whose command lines, hashes, domains, or IPs match threat intelligence; execution
  of at.exe or WMI scheduled jobs that spawn script interpreters; rare or anomalous children of the Task
  Scheduler service (svchost.exe/taskeng.exe) or of atd; tasks pointing at user-writable or non-standard
  directories; tasks with persistence triggers (logon/startup) or short recurrence intervals; long-lived
  tasks not tied to change management; and privilege-escalation patterns such as non-admins creating SYSTEM-run
  tasks, SYSTEM-context tasks running account/service-modification commands, escalation/credential tooling
  executed by tasks, and Linux at/sudo shell escapes. Each question pairs deterministic detection logic
  with statistical baselining and machine-learning scoring so findings are granular, explainable, and
  actionable for a SOC analyst.'
type: technique
