questions:
- question: Can you search process creation logs (Windows Event ID 4688) and task creation logs (Windows
    Event ID 4698)?
  context: 'Tactic context (TA0002 Execution): this question supports investigating whether an adversary
    is abusing the ''at'' scheduled-task/job utility for execution. Evidence sought: A scheduled task
    is created (Windows Event ID 4698) or its process executes (Windows Event ID 4688/Sysmon 1) containing
    command line arguments with a file hash, domain, or IP address that matches an entry in an active
    threat intelligence feed. Method (Symbolic Logic). Search process creation (Windows Event ID 4688/Sysmon
    1) and task creation (Windows Event ID 4698) logs. Parse command_line to extract file hashes, domains,
    and IPs and correlate against a threat-intelligence blocklist; generate a high-priority alert for
    any match. Disambiguate scheduling actions by flagging command lines containing at.exe or schtasks.exe
    with /create, /run, or /s (remote) flags ([Execution with at.exe, CAR-2013-05-004](https://car.mitre.org/analytics/CAR-2013-05-004/);
    [Execution with schtasks, CAR-2013-08-001](https://car.mitre.org/analytics/CAR-2013-08-001/)). A positive
    result (a match, a statistical outlier, or a high model score) should be triaged as possible T1053.002
    activity and corroborated with the surrounding process tree, the creating account, and downstream
    network/file actions before escalation; a negative result helps scope the host out for this hypothesis.'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Workstations, Network Egress
    Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic match for at/scheduled-task abuse\nsource IN (Windows Event ID 4698, Windows\
      \ Event ID 4688, Zeek conn.log, Zeek dns.log)\n| where (process_image in ('at.exe','schtasks.exe')\
      \ OR EventCode in (4698,4699,4702,5861)\n         OR parent_process in ('svchost.exe','taskeng.exe','atd'))\n\
      // Apply matching logic from the analytic action above:\n// IOC/threat-intel lookup, path/regex/SID\
      \ checks, or job-file correlation\n| eval suspicious = match(command_line, '(at\\.exe|interactive|/create|/run|/s)')\n\
      \       OR path_in('\\\\Users\\\\','\\\\Temp\\\\','\\\\AppData\\\\','\\\\ProgramData\\\\','\\\\\
      Perflogs')\n       OR ioc_lookup(file_hash, domain, dest_ip)\n| where suspicious=true\n| table _time,\
      \ host, user, parent_process, process_image, command_line\n| alert priority=high"
- question: Can you for each process spawned by a scheduled task, join with network connection logs (Zeek
    conn.log) on source IP and timestamp?
  context: 'Tactic context (TA0002 Execution): this question supports investigating whether an adversary
    is abusing the ''at'' scheduled-task/job utility for execution. Evidence sought: A scheduled task
    is created (Windows Event ID 4698) or its process executes (Windows Event ID 4688/Sysmon 1) containing
    command line arguments with a file hash, domain, or IP address that matches an entry in an active
    threat intelligence feed. Method (Statistical Method). For each process spawned by a scheduled task,
    join with Zeek conn.log on host and timestamp and measure Volume (bytes sent/received, out/in ratio),
    Frequency (connections per minute), and State (S0/REJ/RSTO failed-connection counts). Compute 30-day
    enterprise prevalence of each destination IP and flag connections below the 1st percentile of prevalence;
    treat repeated failed/blocked egress as a distinct C2-staging signal ([Real-Time Detection of DNS
    Exfiltration and Tunneling, Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)).
    A positive result (a match, a statistical outlier, or a high model score) should be triaged as possible
    T1053.002 activity and corroborated with the surrounding process tree, the creating account, and downstream
    network/file actions before escalation; a negative result helps scope the host out for this hypothesis.'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Workstations, Network Egress
    Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Baseline + outlier scoring for scheduled-task behavior\nsource IN (Windows Event ID 4698,\
      \ Windows Event ID 4688, Zeek conn.log, Zeek dns.log)\n| where parent_process in ('svchost.exe','taskeng.exe','atd')\
      \ OR EventCode in (4698,4702)\n| stats count as freq, dc(host) as host_spread,\n        avg(bytes_out)\
      \ as v_out, avg(conns_per_min) as freq_net by entity\n// entity = command_line | process_path |\
      \ dest_ip | trigger+creator | task_lifespan\n| eventstats perc1(freq) as p1, perc5(freq) as p5,\
      \ perc99(freq) as p99\n| where freq <= p1 OR freq <= p5 OR freq >= p99 OR host_spread < 5\n| sort\
      \ freq\n| alert priority=medium reason='rare/anomalous scheduled-task behavior vs 30-90d baseline'"
- question: Can you extract features from command-line strings in process events (Windows Event ID 4688),
