- question: Can you maintain and query an allow-list of known-good executables run by the Task Scheduler?
  context: 'Tactic context (TA0002 Execution): this question supports investigating whether an adversary
    is abusing the ''at'' scheduled-task/job utility for execution. Evidence sought: A child process is
    spawned by the Task Scheduler service (taskeng.exe on older systems, svchost.exe on modern systems)
    whose process name, command-line arguments, or file path occurs with a frequency below a defined threshold
    (e.g., 1st percentile) compared to a 30-day historical baseline of legitimate scheduled tasks. On
    Linux/macOS, an `at` job under /var/spool/cron/atjobs or /usr/lib/cron/at executes an anomalous child
    (auditd execve / macOS unified log). Method (Symbolic Logic). Maintain an allow-list of known-good
    executables run by the scheduler and alert on any child process (Windows Event ID 4688 with parent
    svchost.exe/taskeng.exe) not on the list. On Linux/macOS, match auditd execve where the parent is
    atd or the job path is /var/spool/cron/atjobs (Linux) or /usr/lib/cron/at (macOS), and flag shell
    escapes such as `echo ''…'' | at` ([GTFOBins: at](https://gtfobins.github.io/gtfobins/at/)). A positive
    result (a match, a statistical outlier, or a high model score) should be triaged as possible T1053.002
    activity and corroborated with the surrounding process tree, the creating account, and downstream
    network/file actions before escalation; a negative result helps scope the host out for this hypothesis.'
