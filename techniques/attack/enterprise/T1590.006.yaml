name: 'T1590.006: Network Security Appliances'
id: 8e2c24a4-db69-4c9f-8bbf-a3bc74c4ce8b
description: 'Investigate signs that an adversary is actively gathering information about the organization''s
  network security appliances (firewalls, VPN concentrators, reverse proxies, WAFs, NIDS, bastion hosts,
  and management interfaces) as part of Reconnaissance. This playbook helps an analyst hunt for and triage:
  inbound connections to security appliances from threat-intelligence-listed scanners or malicious IPs;
  HTTP/S probes against appliance web/admin interfaces carrying scanner signatures (Nmap, Zgrab, Nuclei,
  masscan) or known-bad JA3/JA3S hashes; horizontal scans where one source touches many internal hosts
  on a common port; vertical scans where one source enumerates many ports on a single appliance with a
  high failure ratio; and anomalous management-port access or failed logons from unexpected geolocations/ASNs.
  It combines deterministic signature/allow-list rules, statistical baselining (percentile outliers, failure-ratio
  analysis, Threshold Random Walk, entropy), and machine-learning approaches (Random Forest, one-class
  SVM, autoencoders, DBSCAN clustering, time-series forecasting) so the analyst can establish whether
  observed traffic represents reconnaissance against defensive infrastructure versus benign activity.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any inbound connections to our network security appliances originating from source IP
    addresses that appear on a high-confidence threat-intelligence feed of known scanners or malicious
    actors?
  context: 'During Reconnaissance an adversary often probes externally reachable defensive infrastructure
    first. This deterministic check is the detection floor: it matches the responder IP (id.resp_h) of
    inbound Zeek conn.log connections against the set of DMZ firewalls, VPN concentrators, and internet
    gateway routers, and the source IP (id.orig_h) against curated CTI scanner/malicious-IP lists. A match
    means a known-bad host is touching defensive infrastructure, which warrants immediate triage. Keep
    the feed tuned to high-confidence entries only to limit false positives. A negative result does not
    rule out reconnaissance from non-listed infrastructure - pursue the statistical and ML questions for
    that. References: [Suricata](https://docs.suricata.io/en/latest/rules/index.html); [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: DMZ Firewalls, VPN Concentrators, Internet Gateway Routers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_conn\nWHERE id.resp_h IN appliance_nai_set\n  AND id.orig_h IN cti_high_confidence_ips\n\
      | ALERT severity=high msg=\"Inbound connection to security appliance from CTI-listed source\""
- question: For source IPs already flagged by threat intelligence, do any exhibit per-minute distinct-destination-port
    or distinct-host fan-out that exceeds the 99th percentile of our own baseline?
  context: 'Reconnaissance against appliances frequently shows up as high fan-out: a single CTI-listed
    source sweeping many ports or hosts. Using Zeek conn.log counters, compute per-CTI-IP per-minute counts
    of distinct destination ports and distinct destination hosts, and flag those above the 99th percentile
    derived from your own 30-day distribution. Cross-check against published darknet port-popularity baselines
    (Durumeric et al.) to distinguish broad internet-wide scans from targeted probing of your appliances.
    High fan-out from an already-suspect source strongly corroborates active scanning; low fan-out may
    indicate a single targeted connection deserving separate scrutiny. References: [Zeek conn.log](https://docs.zeek.org/en/master/scripts/base/protocols/conn/main.zeek.html);
    [An Internet-Wide View of Internet-Wide Scanning](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: DMZ Firewalls, VPN Concentrators, Internet Gateway Routers'
  range: Last 90 days; compute against a rolling 30-day baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_conn WHERE id.orig_h IN cti_ips AND id.resp_h IN appliance_nai_set

      | BIN time SPAN=1m

      | STATS dcount(id.resp_p) AS ports, dcount(id.resp_h) AS hosts BY id.orig_h, time_bin

      | WHERE ports > p99(baseline_ports) OR hosts > p99(baseline_hosts)

      | ALERT msg="CTI source fan-out outlier vs appliances"'
- question: Do any threat-intelligence-listed sources show a sustained high ratio of failed or unanswered
    connections (Zeek conn_state S0/REJ/RSTOS) against our appliances, indicating scanning rather than
    benign use?
  context: 'Scanners generate many connection attempts that go unanswered or are rejected, whereas legitimate
    clients complete sessions. Applying the failure-mode logic of Jung et al.''s Threshold Random Walk,
    profile the failed/unanswered connection ratio per CTI source against appliances using Zeek conn_state
    values S0 (no reply), REJ (rejected), and RSTOS. A sustained high failure ratio confirms scanning
    behavior and raises alert confidence; a low failure ratio suggests an established or benign relationship
    that may be a false positive on the CTI feed. References: [Jung et al.''s Threshold Random Walk](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: DMZ Firewalls, VPN Concentrators, Internet Gateway Routers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_conn WHERE id.orig_h IN cti_ips AND id.resp_h IN appliance_nai_set\n| STATS count()\
      \ AS total,\n        count(eval(conn_state IN ('S0','REJ','RSTOS'))) AS failed BY id.orig_h\n| EVAL\
      \ fail_ratio = failed/total\n| WHERE fail_ratio > sustained_high_threshold\n| ALERT msg=\"High failure-ratio\
      \ scanning against appliance from CTI source\""
- question: When connections to appliances are scored by a supervised model on reputation, fan-out, failure-ratio,
    byte-ratio, and source-ASN features, which are classified as reconnaissance and what features drive
    the score?
  context: 'Deterministic and threshold methods can miss novel or blended scanning. Score connections
    with a Random Forest or logistic-regression model trained on CICIDS2017-style flow features (IP reputation,
    fan-out/port counts, failed/total ratio, byte ratios, source ASN rarity). Surface the top-3 contributing
    features per alert via SHAP (e.g., distinct-port count, failed/total ratio, ASN rarity) so the analyst
    can quickly judge whether the classification is credible. A high reconnaissance probability with intuitive
    driving features is actionable; explanations dominated by spurious features warrant model/feature
    review. References: [CICIDS2017](https://www.scitepress.org/papers/2018/66398/66398.pdf); [SHAP](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: DMZ Firewalls, VPN Concentrators, Internet Gateway Routers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [ip_reputation, distinct_ports, distinct_hosts, failed_total_ratio, byte_ratio,\
      \ src_asn_rarity]\nscore = rf_model.predict_proba(features)\nIF score >= recon_threshold:\n    top3\
      \ = shap_explain(rf_model, features)[:3]\n    ALERT(msg=\"ML-classified recon vs appliance\", drivers=top3)"
- question: Are inbound HTTP/S requests to our appliance web/admin interfaces carrying User-Agent strings,
    URI paths, TLS SNI values, or JA3/JA3S hashes that match known reconnaissance-tool signatures (Nmap,
    masscan, Nuclei, zgrab) or known-bad fingerprints?
  context: 'Adversaries enumerate appliance web portals (WAFs, reverse proxies, VPN web logins) using
    recognizable tooling. Match Suricata sticky buffers (http.user_agent, http.uri, tls.sni, ja3.hash)
    and SigmaHQ rules against Zeek http.log/ssl.log for scanner signatures such as masscan, Nmap, Nuclei,
    zgrab, and suspicious paths like /.env or /remote/login, plus known-bad JA3/JA3S hashes directed at
    appliance interfaces. A signature match against a defensive appliance is a strong reconnaissance indicator;
    absence does not clear the host because tools can be customized, so combine with the statistical questions.
    References: [Suricata](https://docs.suricata.io/en/latest/rules/index.html); [SigmaHQ](https://github.com/SigmaHQ/sigma);
    [JA3/JA3S](https://github.com/salesforce/ja3).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Web Application Firewalls (WAFs), Reverse Proxies, VPN Concentrator Web Portals'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_http JOIN zeek_ssl WHERE host IN appliance_web_nai\n| WHERE http.user_agent MATCH\
      \ scanner_ua_signatures\n     OR http.uri MATCH ('/.env','/remote/login', nuclei_paths)\n     OR\
      \ ssl.ja3 IN known_bad_ja3\n     OR tls.sni MATCH scanner_sni\n| ALERT msg=\"Scanner-signature probe\
      \ of appliance web interface\""
- question: Which source IPs are generating bursts of 401/403/404 responses from appliance web portals
    above the 99th percentile of the per-source hourly baseline, indicating path or credential probing?
  context: Reconnaissance and brute-force enumeration of appliance web interfaces produce characteristic
    clusters of error responses (401 unauthorized, 403 forbidden, 404 not found) as the adversary probes
    for valid paths and credentials. Flag source IPs whose hourly count of these failure responses exceeds
    the 99th percentile of the per-source baseline. Failed-request bursts are a distinct reconnaissance
    signal versus normal successful sessions, and help surface low-volume crawlers that evade signature
    rules. A burst against a VPN or admin portal is high priority.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Web Application Firewalls (WAFs), Reverse Proxies, VPN Concentrator Web Portals'
  range: Last 90 days; compute hourly per-source baselines
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_http WHERE host IN appliance_web_nai AND status_code IN (401,403,404)

      | BIN time SPAN=1h

      | STATS count() AS errs BY id.orig_h, time_bin

      | WHERE errs > p99(per_source_hourly_baseline)

      | ALERT msg="HTTP failure-mode burst against appliance portal"'
- question: Do inbound appliance HTTP requests carry User-Agent strings whose Shannon entropy falls outside
    three standard deviations of the baseline, especially when paired with a rare JA3 hash for the source?
  context: Automated scanners and custom tooling often use anomalous, randomized, or malformed User-Agent
    strings whose character-distribution entropy differs from normal browser traffic. Compute the Shannon
    entropy of User-Agent strings for inbound appliance HTTP traffic and flag values beyond three standard
    deviations from the baseline, combined with the rarity of the source's JA3 hash. The combination of
    an unusual User-Agent and a rare TLS fingerprint increases confidence that the client is non-browser
    tooling probing the appliance, while a common UA/JA3 pairing is likely benign.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Web Application Firewalls (WAFs), Reverse Proxies, VPN Concentrator Web Portals'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_http JOIN zeek_ssl WHERE host IN appliance_web_nai

      | EVAL ua_entropy = shannon_entropy(http.user_agent)

      | EVAL ja3_rarity = 1 - freq(ssl.ja3)

      | WHERE ua_entropy > mean+3*std OR ua_entropy < mean-3*std

      | WHERE ja3_rarity > rarity_threshold

      | ALERT msg="User-Agent entropy + rare JA3 outlier on appliance"'
- question: Does the observed hourly volume of scanner-signature or JA3 matches against appliance interfaces
    exceed the upper confidence interval predicted by a time-series forecast?
  context: 'Point-in-time signature matching misses gradual increases in scanning pressure. Use a Prophet
    or ARIMA model to forecast hourly counts of scanner-signature/JA3 matches and alert when observed
    volume exceeds the upper confidence interval. Because browser GREASE and TLS extension randomization
    make JA3 increasingly unstable (Stamus analysis), weight rate, volume, and failure features over fingerprint
    rarity, and report the contributing features. A spike above the forecast envelope indicates a campaign-level
    uptick in reconnaissance against appliance interfaces worth escalating. References: [Stamus JA3-fade
    analysis](https://www.stamus-networks.com/blog/ja3-fingerprints-fade-browsers-embrace-tls-extension-randomization).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Web Application Firewalls (WAFs), Reverse Proxies, VPN Concentrator Web Portals'
  range: Last 90 days for training; forecast next 24-72h
  queries:
  - technology: ML/pseudocode
    query: "series = hourly_count(signature_or_ja3_matches WHERE host IN appliance_web_nai)\nmodel = Prophet().fit(series)\n\
      fc = model.predict(horizon)\nIF observed > fc.yhat_upper:\n    ALERT(msg=\"Scanner-signature volume\
      \ above forecast CI\", weight=[rate,volume,failure])"
- question: Is any single external source IP attempting connections to more than 50 unique internal hosts
    on the same port within a 10-minute window, indicating a horizontal scan?
  context: 'The single-source, many-destination, single-port pattern is the canonical fast horizontal-scan
    signature (ZMap). Alert when an external source IP connects to more than 50 unique destination IPs
    on the same port within 10 minutes, prioritizing targets within the appliance NAI (gateway routers,
    core switches, DMZ firewalls). Encode as a Suricata threshold rule. This finding indicates an adversary
    mapping which hosts expose a given service - often a precursor to exploitation. Tune the host count
    and window to your environment to balance sensitivity against benign sweeps (e.g., vulnerability scanners).
    References: [Suricata](https://docs.suricata.io/en/latest/rules/index.html); [ZMap](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_durumeric.pdf).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway Routers, Core Network Switches, DMZ Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM zeek_conn WHERE id.orig_h NOT IN internal_space

      | BIN time SPAN=10m

      | STATS dcount(id.resp_h) AS hosts BY id.orig_h, id.resp_p, time_bin

      | WHERE hosts > 50

      | ALERT msg="Horizontal scan: single source -> 50+ hosts same port"'
- question: When first-contact connection attempts are evaluated as Bernoulli success/failure trials via
    the Threshold Random Walk, which external sources are declared scanners?
  context: 'Jung et al.''s sequential hypothesis test (Threshold Random Walk) is a low-false-positive
    way to declare scanners early. Treat each first-contact attempt in Zeek conn.log as a Bernoulli trial
    - success if the connection completes, failure if it does not - and walk a likelihood ratio per source,
    declaring a source a scanner after roughly 4-5 high-failure observations with tunable false-positive/negative
    bounds. This catches horizontal scanning even at modest rates that threshold rules miss. A source
    crossing the upper threshold is a confident scanner classification; sources below remain under observation.
    References: [Jung et al.''s Threshold Random Walk](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway Routers, Core Network Switches, DMZ Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each external src:\n  FOR each first_contact in zeek_conn:\n    outcome = success IF conn_state\
      \ in ('SF','S1','RSTO') ELSE failure\n    L *= likelihood_ratio(outcome)\n    IF L >= upper_bound:\
      \ DECLARE scanner; ALERT\n    IF L <= lower_bound: DECLARE benign"
- question: For each 10-minute window, which source IPs have a unique-destination-host count above the
    99.9th percentile of that window's distribution?
  context: 'Rather than a fixed host threshold, this adaptive method flags sources whose unique-destination-host
    count for a 10-minute window exceeds the 99.9th percentile of that window''s distribution, automatically
    adjusting to diurnal and environmental variation. Calibrate against the scan-rate and source-persistence
    baselines in Durumeric et al.''s internet-wide scanning study. Extreme outliers represent broad reconnaissance
    sweeps; because the threshold is relative, it surfaces the most anomalous scanners even when overall
    traffic volume shifts. References: [An Internet-Wide View of Internet-Wide Scanning](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway Routers, Core Network Switches, DMZ Firewalls'
  range: Last 90 days; per-window percentile calculation
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_conn WHERE id.orig_h NOT IN internal_space

      | BIN time SPAN=10m

      | STATS dcount(id.resp_h) AS hosts BY id.orig_h, time_bin

      | EVENTSTATS p99.9(hosts) AS cut BY time_bin

      | WHERE hosts > cut

      | ALERT msg="Unique-destination outlier (horizontal scan)"'
- question: When Zeek conn.log flow features are clustered with DBSCAN or scored by an unsupervised autoencoder
    ensemble, do dense scan clusters or high-reconstruction-error flows emerge, and what features drive
    them?
  context: 'Unsupervised methods catch scan patterns that escape rules and thresholds. Cluster Zeek conn.log
    features (source IP, destination port, inter-arrival time, fan-out, failure ratio) with DBSCAN to
    surface dense scan clusters, or score flows with the Kitsune autoencoder ensemble and use per-feature
    reconstruction error to report the drivers. Dense clusters of low-inter-arrival, high-fan-out, high-failure
    flows indicate coordinated horizontal scanning; the per-feature error/contribution highlights why
    a flow is anomalous so the analyst can validate quickly. References: [Kitsune](https://www.ndss-symposium.org/wp-content/uploads/2018/02/ndss2018_03A-3_Mirsky_paper.pdf).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway Routers, Core Network Switches, DMZ Firewalls'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = features(zeek_conn: src_ip, resp_p, inter_arrival, fanout, fail_ratio)\nclusters = DBSCAN(eps,\
      \ min_samples).fit(X)\nrecon_err = kitsune_autoencoder.score(X)\nFOR f in flows WHERE in_dense_scan_cluster(f)\
      \ OR recon_err[f] > thresh:\n    ALERT(msg=\"Unsupervised horizontal-scan detection\", drivers=top_feature_errors(f))"
- question: Is any single external source IP connecting to more than 100 unique destination ports on a
    single network security appliance within 5 minutes, and are there crafted-probe artifacts such as
    ACK scans, anomalous source ports (53/20), or fragmented probes?
  context: 'A vertical (port) scan enumerates services on one host. Alert when a single external IP hits
    more than 100 unique destination ports on the same appliance within 5 minutes (Suricata threshold).
    Additionally signature crafted-probe artifacts documented in Nmap Ch.10 - ACK scans, anomalous source
    ports such as 53 or 20 used to bypass filters, and fragmented probes - which reveal deliberate firewall/IDS
    evasion mapping. A vertical scan of a DMZ firewall, VPN concentrator, or public router indicates an
    adversary fingerprinting the appliance''s exposed services and defensive posture. References: [Suricata](https://docs.suricata.io/en/latest/rules/index.html);
    [Nmap Ch.10](https://nmap.org/book/firewalls.html).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: DMZ Firewalls, VPN Concentrators, Public-facing Routers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_conn WHERE id.resp_h IN appliance_nai_set AND id.orig_h NOT IN internal_space\n\
      | BIN time SPAN=5m\n| STATS dcount(id.resp_p) AS ports BY id.orig_h, id.resp_h, time_bin\n| WHERE\
      \ ports > 100\n     OR flagged_craft(ack_scan, src_port IN (53,20), fragmented)\n| ALERT msg=\"\
      Vertical port scan / crafted probe against appliance\""
- question: Which source IPs have a failed-to-total connection ratio against an appliance (Zeek conn_state
    S0/REJ/RSTOS) exceeding the 95th percentile of historical ratios?
  context: 'The state/failure-mode metric is the core scanner discriminator (Jung et al.). Vertical scans
    produce many connection attempts to closed/filtered ports, yielding S0 (no reply), REJ (rejected),
    and RSTOS states. Flag source IPs whose failed-to-total connection ratio toward an appliance exceeds
    the 95th percentile of historical ratios. A high ratio against a single appliance strongly indicates
    port enumeration rather than legitimate use; a low ratio suggests established services and likely
    a false positive. References: [Zeek conn.log](https://docs.zeek.org/en/master/scripts/base/protocols/conn/main.zeek.html);
    [Jung et al.''s Threshold Random Walk](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: DMZ Firewalls, VPN Concentrators, Public-facing Routers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_conn WHERE id.resp_h IN appliance_nai_set\n| STATS count() AS total,\n        count(eval(conn_state\
      \ IN ('S0','REJ','RSTOS'))) AS failed BY id.orig_h, id.resp_h\n| EVAL fail_ratio = failed/total\n\
      | WHERE fail_ratio > p95(historical_fail_ratio)\n| ALERT msg=\"High failure-ratio vertical scan\
      \ of appliance\""
- question: When a one-class SVM or autoencoder trained on benign appliance traffic scores incoming flows,
    which deviate from normal and what features explain the anomaly?
  context: 'Train a one-class SVM (or autoencoder) on benign appliance-traffic CICIDS2017-style flow features
    (destination port, protocol, duration, bytes, TCP flag counts) and flag deviations, surfacing the
    top-3 contributing features via SHAP. This captures vertical-scan and crafted-probe behavior that
    does not match a known signature - for example unusual flag combinations, very short durations, or
    atypical port distributions. The SHAP explanation lets the analyst confirm whether the deviation reflects
    scanning (e.g., dominant flag-count or port features) or a benign traffic shift. References: [CICIDS2017](https://www.scitepress.org/papers/2018/66398/66398.pdf);
    [SHAP](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: DMZ Firewalls, VPN Concentrators, Public-facing Routers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = OneClassSVM().fit(benign_appliance_flows[port,proto,duration,bytes,flag_counts])\n\
      FOR flow in incoming WHERE id.resp_h IN appliance_nai_set:\n    IF model.predict(flow) == anomaly:\n\
      \        ALERT(msg=\"One-class SVM appliance anomaly\", drivers=shap(model,flow)[:3])"
- question: Are there connection attempts to appliance management ports (TCP/22 SSH, TCP/443 admin UI,
    TCP/3389 RDP) from source IPs outside the approved administrator subnet allow-list, or failed logons
    (Windows Event ID 4625) from those IPs?
  context: 'Management interfaces of security appliances should only be reachable from a tightly scoped
    admin subnet. Alert when Zeek conn.log records management-port attempts (TCP/22, TCP/443 admin, TCP/3389)
    from IPs outside the approved admin allow-list, or when Windows Event ID 4625 logs failed logons from
    those IPs (e.g., on a bastion host). Encode as SigmaHQ rules over first-party logs. Any management-port
    contact from outside the allow-list is suspicious and may indicate an adversary probing for administrative
    access to defensive infrastructure - a high-value reconnaissance objective. References: [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 4625
  - 'NAI: Firewall Management Interfaces, VPN Administrator Portals, Router Management Consoles, Bastion
    Hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "(FROM zeek_conn WHERE id.resp_h IN mgmt_nai AND id.resp_p IN (22,443,3389)\n   AND id.orig_h\
      \ NOT IN admin_allowlist)\nOR (FROM win_security WHERE EventID=4625 AND IpAddress NOT IN admin_allowlist\n\
      \      AND target_host IN mgmt_nai)\n| ALERT msg=\"Management-port access / failed logon outside\
      \ admin allow-list\""
- question: Do management-interface connection or login attempts originate from source countries or ASNs
    not seen in the historical baseline of legitimate administrative activity, or at anomalously high
    frequency?
  context: Legitimate appliance administration comes from a predictable set of countries and ASNs. Baseline
    source countries/ASNs per management service and flag attempts from previously unseen countries/ASNs
    or at anomalously high frequency. A login or connection attempt to a firewall management interface
    or VPN admin portal from an unexpected country/ASN is a strong reconnaissance or initial-access signal,
    since adversaries typically operate from infrastructure inconsistent with the admin baseline. Correlate
    with the allow-list and failed-logon questions to confirm.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 4625
  - 'NAI: Firewall Management Interfaces, VPN Administrator Portals, Router Management Consoles, Bastion
    Hosts'
  range: Last 90 days; baseline over 90+ days of admin activity
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_conn JOIN geo_asn WHERE id.resp_h IN mgmt_nai\n| STATS count() BY id.orig_h, src_country,\
      \ src_asn, service\n| WHERE src_country NOT IN baseline_countries[service]\n     OR src_asn NOT\
      \ IN baseline_asns[service]\n     OR count > p99(freq_baseline[service])\n| ALERT msg=\"Management\
      \ access from anomalous country/ASN\""
- question: Which sources exceed their 99th-percentile failed-logon/auth-reject rate against management
    interfaces (Windows Event ID 4625, Zeek REJ on management ports), indicating low-and-slow credential
    probing?
  context: 'Adversaries often probe management credentials slowly to evade lockout and burst thresholds.
    Treat failed-logon/auth-reject counts (Windows Event ID 4625 and Zeek REJ on management ports) as
    a distinct signal and alert when a source exceeds its 99th-percentile failure rate, following the
    failure-mode model of Jung et al. This captures both rapid brute force and patient low-and-slow probing
    of firewall, VPN admin, and bastion login surfaces. A source persistently failing authentication against
    management interfaces is a high-priority reconnaissance/credential-access indicator. References: [Jung
    et al.''s Threshold Random Walk](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 4625
  - 'NAI: Firewall Management Interfaces, VPN Administrator Portals, Router Management Consoles, Bastion
    Hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '(FROM win_security WHERE EventID=4625 AND target_host IN mgmt_nai)

      UNION (FROM zeek_conn WHERE id.resp_h IN mgmt_nai AND conn_state=''REJ'')

      | STATS count() AS failures BY id.orig_h

      | WHERE failures > p99(per_source_failure_baseline)

      | ALERT msg="Failed-logon burst / low-and-slow probing of mgmt interface"'
