name: 'T1590.003: Network Trust Dependencies'
id: 9d6e2db7-4ea3-403a-9c09-26112070ddc0
description: 'Investigate whether an adversary is conducting reconnaissance against the organization''s
  network trust dependencies — the second- and third-party relationships (managed service providers, contractors,
  partners) that hold connected and potentially elevated network access. This playbook helps an analyst
  hunt for: external or partner source IPs generating anomalous volumes of connections or DNS queries
  to internal resources; partner-authenticated accounts running AD trust/domain enumeration tooling (nltest,
  dsquery, AdFind, SharpHound/BloodHound) or LDAP/SAMR reconnaissance against Domain Controllers; external/partner
  IPs exhibiting network or port scanning (high host/port fan-out with elevated failed-connection rates);
  DNS enumeration such as unauthorized AXFR/IXFR zone transfers, subdomain-entropy spikes, and NXDOMAIN
  bursts; and partner accounts accessing anomalously many distinct shares or files relative to their own
  baseline and peer cohort. Each question pairs symbolic-logic trip-wires, statistical baseline deviation,
  and machine-learning anomaly scoring so the analyst can confirm or refute trust-dependency reconnaissance
  and pivot to related Initial Access activity.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: '[Symbolic Logic] Match partner traffic to TI and allow-list: With respect to network trust-dependency
    reconnaissance (Reconnaissance), An external source IP, not associated with a known partner, generates
    a high volume of network connections or DNS queries to internal resources, or a known partner IP exhibits
    traffic patterns that deviate significantly from its established baseline. — using the symbolic logic
    approach, how can the analyst detect this? Specifically: Match partner traffic to TI and allow-list?'
  context: 'Tactic: Reconnaissance. Evidence pattern: An external source IP, not associated with a known
    partner, generates a high volume of network connections or DNS queries to internal resources, or a
    known partner IP exhibits traffic patterns that deviate significantly from its established baseline.
    Detection approach (Symbolic Logic): On Zeek conn.log/dns.log, alert when traffic to/from partner-associated
    IP ranges deviates from the documented allow-list of expected destinations/ports/services, or when
    a partner IP matches scanner/recon/C2 threat intel. Maintain an explicit per-partner expected-destination
    set; any first-seen internal host or service contacted by a partner source is a candidate ([MITRE
    ATT&CK T1590.003](https://attack.mitre.org/techniques/T1590/003/), [SigmaHQ](https://github.com/SigmaHQ/sigma)).
    A positive result suggests an external or partner entity is mapping the organization''s trust relationships
    (T1590.003); correlate it with adjacent reconnaissance, scanning, and Initial Access (e.g., Trusted
    Relationship T1199) activity before escalating. A negative result helps rule out active trust-dependency
    enumeration from this source/account over the reviewed window.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Cloud Egress Points, External DNS Resolvers, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Match partner traffic to TI and allow-list\n# Symbolic Logic for: An external source IP,\
      \ not associated with a known partner, generates a high vol...\nSOURCE conn.log + dns.log\nWHERE\
      \ matches_condition_for('Match partner traffic to TI and allow-list')\n  AND src_or_account IN partner_scope\n\
      \  AND NOT in_allow_list(dst, port, service)\nALERT enrich(src, account, dst, nai='Internet Gateway,\
      \ Cloud Egress Points, External DNS Resolvers, VPN Concentrators')"
  - technology: Zeek/pseudocode
    query: '# Zeek view for Match partner traffic to TI and allow-list

      read conn.log + dns.log; per-source aggregation over time window;

      apply symbolic logic logic above; emit notice with src, counts, nai=''Internet Gateway, Cloud Egress
      Points, External DNS Resolvers, VPN Concentrators'''
- question: '[Statistical Method] Volume/frequency baseline deviation: With respect to network trust-dependency
    reconnaissance (Reconnaissance), An external source IP, not associated with a known partner, generates
    a high volume of network connections or DNS queries to internal resources, or a known partner IP exhibits
    traffic patterns that deviate significantly from its established baseline. — using the statistical
    method approach, how can the analyst detect this? Specifically: Volume/frequency baseline deviation?'
  context: 'Tactic: Reconnaissance. Evidence pattern: An external source IP, not associated with a known
    partner, generates a high volume of network connections or DNS queries to internal resources, or a
    known partner IP exhibits traffic patterns that deviate significantly from its established baseline.
    Detection approach (Statistical Method): Track per-partner Volume (bytes in/out, conn count), Frequency
    (conns/min), and State (% failed/rejected conns) over a rolling 30-day baseline; alert when bytes
    or connection count exceed the 99th percentile or 3σ above the partner''s mean, or when the failed-connection
    ratio rises sharply. Derive thresholds per partner because traffic profiles differ widely ([Fast Portscan
    Detection, Jung et al.](https://www.icir.org/vern/papers/portscan-oak04.pdf)). A positive result suggests
    an external or partner entity is mapping the organization''s trust relationships (T1590.003); correlate
    it with adjacent reconnaissance, scanning, and Initial Access (e.g., Trusted Relationship T1199) activity
    before escalating. A negative result helps rule out active trust-dependency enumeration from this
    source/account over the reviewed window.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Cloud Egress Points, External DNS Resolvers, VPN Concentrators'
  range: Last 90 days (baseline 30 days; evaluate in rolling 1-5 minute / hourly windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Volume/frequency baseline deviation

      # Statistical Method for: An external source IP, not associated with a known partner, generates
      a high vol...

      SOURCE conn.log + dns.log

      GROUP BY entity (partner_ip|account) , window

      COMPUTE metrics from method (volume, frequency, entropy, fail_ratio, jaccard)

      BASELINE rolling 30d per-entity / per-peer-group

      ALERT WHEN metric > p98/p99 OR > mean+3*sigma (or < p10 similarity)'
  - technology: Zeek/pseudocode
    query: '# Zeek view for Volume/frequency baseline deviation

      read conn.log + dns.log; per-source aggregation over time window;

      apply statistical method logic above; emit notice with src, counts, nai=''Internet Gateway, Cloud
      Egress Points, External DNS Resolvers, VPN Concentrators'''
