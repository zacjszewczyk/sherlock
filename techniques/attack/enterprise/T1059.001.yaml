name: "T1059.001: PowerShell"
id: "f89d293e-4264-4969-955e-49e6adc396cb"
description: >-
  Investigate malicious PowerShell execution by combining script-block and
  process telemetry with network evidence. This playbook focuses on known
  malicious hashes and IOCs, obfuscation patterns, download cradles, unmanaged
  loading of System.Management.Automation.dll, risky execution switches,
  embedded payloads, and suspicious remote-session or cradle-domain behaviors
  that indicate hands-on-keyboard activity or malware staging.
type: "technique"
related:
  - tactic_id: "TA0002"
    tactic_name: "Execution"
contributors:
  - "Zachary Szewczyk"
created: "2026-02-18"
modified: "2026-02-18"
version: "1.0"
tags: "none"
questions:
  - question: "Did a PowerShell script block hash or an extracted network indicator match trusted malicious intelligence, and was the script actually executed on the host?"
    context: >-
      Start by looking for direct overlap between script-block content and known
      malicious intelligence. Validate the hit against process creation so the
      analyst can separate dead text or copied content from real PowerShell
      execution, then preserve any matched domain, URL, or IP for follow-on
      scoping.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "Zeek conn.log"
      - "Zeek dns.log"
      - "NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points"
    range: "Last 90 days, prioritizing a 2-minute script-to-process execution window."
    queries:
      - technology: "SIEM/threat-intel pseudocode"
        query: |
          scripts = FROM Event4104 CALCULATE sha256(script_block_text)
          iocs = EXTRACT(urls, ipv4, fqdn FROM script_block_text)
          proc = FROM Event4688 WHERE image IN ["powershell.exe","pwsh.exe"]
          ALERT WHERE (scripts.sha256 IN malicious_hashes OR iocs OVERLAP threat_intel) AND JOIN scripts WITH proc ON host, 2m

  - question: "Does the script block contain known malicious PowerShell function markers, tool strings, or AMSI-bypass content that is corroborated by related network activity?"
    context: >-
      Many malicious PowerShell scripts reuse recognizable function names,
      offensive-framework markers, hardcoded C2 values, or AMSI-bypass logic.
      Correlating those strings with outbound DNS or connection activity raises
      confidence that the script was not merely present but operationally active.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "Zeek conn.log"
      - "Zeek dns.log"
      - "NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points"
    range: "Last 90 days, with 5-minute script-to-network correlation."
    queries:
      - technology: "SIEM/correlation pseudocode"
        query: |
          suspicious = FILTER Event4104 BY tool_markers OR c2_strings OR amsi_bypass_patterns
          net = FILTER [Zeek_dns, Zeek_conn] BY domain_or_ip IN EXTRACTED_IOCS(suspicious)
          ALERT WHERE suspicious.exists AND JOIN suspicious WITH net ON host, 5m

  - question: "Are there rare PowerShell script hashes whose low prevalence coincides with first-seen or low-reputation network destinations?"
    context: >-
      A script hash seen on very few hosts is more suspicious when it immediately
      touches unfamiliar or low-reputation infrastructure. This question helps
      analysts prioritize novel script content that is not yet on blocklists but
      behaves like malware.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "Zeek conn.log"
      - "Zeek dns.log"
      - "NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points"
    range: "Last 90 days, using a 30-day prevalence baseline and 5-minute network join."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          prevalence = GROUP Event4104 BY script_hash => distinct_hosts
          rare = FILTER prevalence BY distinct_hosts < 5 OR estate_percent < 0.1
          net = FILTER [Zeek_dns, Zeek_conn] BY first_seen_dest=true OR reputation IN ["low","malicious"]
          ALERT WHERE JOIN rare WITH net ON host, 5m

  - question: "Can a supervised content classifier identify the script block as malicious based on its text, parser tokens, entropy, and suspicious cmdlet usage?"
    context: >-
      Use content classification to score script blocks that are suspicious but
      do not match hardcoded IOCs. Analysts should examine the model confidence
      and the top contributing features so the result is interpretable during
      triage and hunting.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "Zeek conn.log"
      - "Zeek dns.log"
      - "NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points"
    range: "Last 90 days, with model scoring at script ingestion time."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          features = EXTRACT(tfidf_3gram, entropy, cmdlet_categories, parser_token_counts, suspicious_strings)
          score = powershell_content_classifier.predict_proba(features)
          explain = SHAP_TOP3(features)
          ALERT WHERE score >= 0.85

  - question: "Does AMSI-collected post-deobfuscation content score as malicious even when command-line or script-block visibility is incomplete?"
    context: >-
      AMSI often captures decoded or otherwise transformed content that does not
      appear cleanly in command-line logs. Use it as a parallel source of truth
      to catch scripts that only become obviously malicious after deobfuscation
      or runtime expansion.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "Zeek conn.log"
      - "Zeek dns.log"
      - "NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points"
    range: "Last 90 days, with near-real-time AMSI scoring where available."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          amsi_text = COLLECT_AMSI_CONTENT(host)
          score = cnn_lstm_amsi_model.predict_proba(amsi_text)
          explain = TOP_FEATURE_DRIVERS(amsi_text)
          ALERT WHERE score >= 0.85

  - question: "Do PowerShell command lines or script blocks contain explicit obfuscation syntax such as encoded commands, character casting, string replacement, or backtick splitting?"
    context: >-
      Direct syntax matches provide fast coverage for common PowerShell
      obfuscation families. Analysts should decode the content when possible and
      preserve both the original and decoded forms because the decoding step can
      reveal second-stage malicious logic.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "NAI: All Windows Endpoints and Servers"
    range: "Last 90 days, with immediate analysis of the current process tree."
    queries:
      - technology: "SIEM/rule pseudocode"
        query: |
          ALERT FROM [Event4688, Event4104]
          WHERE command_line OR script_block_text MATCHES obfuscation_regex_library

  - question: "If an encoded PowerShell payload is present, does the decoded content reveal execution or download primitives that confirm malicious intent?"
    context: >-
      Encoded content by itself is not enough. Analysts should decode the payload
      and determine whether it actually contains execution primitives, reflective
      loading, download logic, or downgrade behavior that weakens security
      controls.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "NAI: All Windows Endpoints and Servers"
    range: "Last 90 days, focusing on the current encoded execution event."
    queries:
      - technology: "SIEM/decoding pseudocode"
        query: |
          encoded = FILTER Event4688 BY command_line CONTAINS encoded_switches
          decoded = BASE64_DECODE(encoded.payload)
          ALERT WHERE decoded CONTAINS any_of(["IEX","Invoke-Expression","Add-Type","DownloadString","Invoke-WebRequest"]) OR command_line CONTAINS "-Version 2"

  - question: "Do script blocks look statistically obfuscated based on entropy, character-frequency drift, and unusual symbol usage?"
    context: >-
      Statistical obfuscation scoring helps when attackers avoid obvious encoded
      command switches but still distort the script text. Compare the script to a
      benign PowerShell corpus and review which measurements made the content
      anomalous.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "NAI: All Windows Endpoints and Servers"
    range: "Last 90 days, with comparison to a 30-day or corpus-derived baseline."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          metrics = CALCULATE(entropy, non_alnum_ratio, cosine_similarity, special_char_zscore)
          ALERT WHERE entropy > p95 OR cosine_similarity < 0.8 OR special_char_zscore > 3

  - question: "Can a classifier identify which obfuscation technique family a PowerShell sample belongs to and show the discriminating features?"
    context: >-
      Knowing whether the script uses string, token, AST, or encoding-driven
      obfuscation helps analysts choose the right deobfuscation and hunting path.
      The result should remain explainable so the model output can support, not
      replace, analyst judgment.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "NAI: All Windows Endpoints and Servers"
    range: "Last 90 days, with scoring on newly observed PowerShell content."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          features = EXTRACT(char_ngrams, ast_node_distribution, parser_token_counts)
          pred = obfuscation_family_classifier.predict(features)
          explain = TOP_FEATURE_DRIVERS(features)
          ALERT WHERE pred.class IN ["STRING","TOKEN","AST","ENCODING"]

  - question: "Did PowerShell combine a download primitive with an execution primitive and then immediately contact an external destination?"
    context: >-
      This is the classic download cradle question. Analysts should verify both
      the content pattern and the near-immediate network activity so the alert
      captures a real download-and-execute chain rather than benign scripting.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "Sysmon Event ID 3"
      - "Zeek http.log"
      - "Zeek conn.log"
      - "Zeek dns.log"
      - "NAI: All Windows Endpoints and Servers, Network Egress Points, Web Proxies, DNS Resolvers"
    range: "Last 90 days, with 10-second process-to-network correlation."
    queries:
      - technology: "Host/network correlation pseudocode"
        query: |
          cradle = FILTER [Event4688, Event4104] BY contains_exec_primitive AND contains_download_primitive
          net = FILTER [Sysmon3, Zeek_conn, Zeek_dns, Zeek_http] BY external_destination=true
          ALERT WHERE JOIN cradle WITH net ON host, 10s

  - question: "Was remotely fetched content executed directly in memory from a destination that is not allowlisted, especially when spawned by an unusual parent?"
    context: >-
      Direct execution of remote content is especially suspicious when the
      destination is not approved and the PowerShell process comes from a
      document handler or another abuse-prone parent. Analysts should inspect
      the parent-child relationship and the destination at the same time.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "Sysmon Event ID 3"
      - "Zeek http.log"
      - "Zeek conn.log"
      - "Zeek dns.log"
      - "NAI: All Windows Endpoints and Servers, Network Egress Points, Web Proxies, DNS Resolvers"
    range: "Last 90 days, prioritizing the first execution sequence from the parent process."
    queries:
      - technology: "SIEM/rule pseudocode"
        query: |
          ALERT FROM [Event4688, Event4104]
          WHERE contains_webclient_or_iwr AND contains_direct_exec_pattern
            AND destination NOT IN allowlisted_hosts
            AND parent_image IN suspicious_parent_candidates

  - question: "Is a host generating an abnormally large volume of PowerShell-originated outbound traffic or failures relative to its peer group?"
    context: >-
      PowerShell that suddenly makes many network connections or repeatedly fails
      to reach external destinations often indicates staging, beaconing, or
      attacker trial and error. Analysts should compare the host to peers and
      include destination novelty in the triage decision.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "Sysmon Event ID 3"
      - "Zeek http.log"
      - "Zeek conn.log"
      - "Zeek dns.log"
      - "NAI: All Windows Endpoints and Servers, Network Egress Points, Web Proxies, DNS Resolvers"
    range: "Last 90 days, with a 30-day peer baseline and daily scoring."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          daily = GROUP powershell_network_activity BY host, day => conn_count, bytes_out, failure_ratio
          peer = LOOKUP host_peer_group_baseline(host)
          ALERT WHERE conn_count > peer.p99 OR bytes_out > peer.p99 OR failure_ratio > peer.failure_ratio_p99

  - question: "Does time-series modeling show a host's PowerShell network volume or destination count deviating from normal behavior?"
    context: >-
      Some malicious PowerShell activity is better seen as a time-series shift
      than as a single bad command. Analysts should capture the exact window,
      destinations, and traffic counts that caused the anomaly so the result is
      actionable during response.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "Sysmon Event ID 3"
      - "Zeek http.log"
      - "Zeek conn.log"
      - "Zeek dns.log"
      - "NAI: All Windows Endpoints and Servers, Network Egress Points, Web Proxies, DNS Resolvers"
    range: "Last 90 days, with hourly or finer-grained time-series scoring."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          series = BUILD_HOST_SERIES(conn_count, dest_count, bytes_out FOR powershell_processes)
          anomaly = timeseries_model.score(series)
          ALERT WHERE anomaly=true

  - question: "Can an NLP-based detector identify a novel PowerShell download cradle variant that evades existing regex signatures?"
    context: >-
      Novel cradle variants often preserve semantic intent even when they alter
      syntax or abbreviate parameters. Use NLP classification to surface those
      variants and record the tokens or stems that made the sample suspicious.
    answer_sources:
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "Sysmon Event ID 3"
      - "Zeek http.log"
      - "Zeek conn.log"
      - "Zeek dns.log"
      - "NAI: All Windows Endpoints and Servers, Network Egress Points, Web Proxies, DNS Resolvers"
    range: "Last 90 days, with scoring on all newly observed cradle-like content."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          text = NORMALIZE_POWERSHELL_PARAMETERS(command_or_script_text)
          score = cradle_variant_classifier.predict_proba(text)
          explain = TOP_TOKENS(text)
          ALERT WHERE score >= 0.85

  - question: "Did a non-allowlisted process load System.Management.Automation.dll, indicating unmanaged or injected PowerShell hosting?"
    context: >-
      Loading the PowerShell automation library outside a normal PowerShell host
      is a strong indicator that a process is embedding PowerShell or abusing its
      runtime. Analysts should immediately inspect the process image, parent,
      signature state, and whether the process is a common user-facing or LOLBin
      target.
    answer_sources:
      - "Sysmon Event ID 7"
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "NAI: All Windows Endpoints and Servers, especially those running Microsoft Office or other common applications."
    range: "Last 90 days, with immediate triage around the DLL load event."
    queries:
      - technology: "EDR/module-load pseudocode"
        query: |
          ALERT FROM Sysmon7
          WHERE image_loaded IN ["System.Management.Automation.dll","System.Management.Automation.ni.dll"]
            AND process_image NOT IN allowlisted_powershell_hosts

  - question: "Did the suspicious automation DLL load occur without corresponding script-block logging, suggesting unmanaged PowerShell execution or logging bypass?"
    context: >-
      A DLL load with no nearby 4104 activity can mean the process is hosting
      PowerShell outside the standard instrumentation path. Analysts should treat
      this gap itself as meaningful, especially if the process is not a known
      administrative tool.
    answer_sources:
      - "Sysmon Event ID 7"
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "NAI: All Windows Endpoints and Servers, especially those running Microsoft Office or other common applications."
    range: "Last 90 days, using a 5-minute DLL-load-to-script-log window."
    queries:
      - technology: "EDR/log-gap pseudocode"
        query: |
          loads = FILTER Sysmon7 BY image_loaded CONTAINS "System.Management.Automation"
          scripts = FILTER Event4104 BY host = loads.host
          ALERT WHERE loads.process_image NOT IN allowlisted_powershell_hosts AND NO scripts WITHIN 5m OF loads

  - question: "Are rare or low-frequency process names loading System.Management.Automation.dll in a way that departs from the environment baseline?"
    context: >-
      Some unusual module loaders are not obviously malicious on first glance,
      but rarity across the enterprise is itself useful triage context. Compare
      the process name and host combination to a 30-day baseline before deciding
      whether the load is expected.
    answer_sources:
      - "Sysmon Event ID 7"
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "NAI: All Windows Endpoints and Servers, especially those running Microsoft Office or other common applications."
    range: "Last 90 days, with a 30-day loader-frequency baseline."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          loaders = GROUP Sysmon7 BY process_name => distinct_hosts, daily_count
          ALERT WHERE process_name NOT IN allowlisted_powershell_hosts AND (distinct_hosts < 5 OR estate_percent < 0.1)

  - question: "Is the daily count of automation DLL loads for a given process name surging above its normal baseline?"
    context: >-
      A sudden increase in DLL loads by a process that normally loads the module
      rarely can indicate malware experimentation, reflective loading, or a new
      adversary tradecraft path. Include failed follow-on execution when possible
      because repeated failed loads can still be a valuable signal.
    answer_sources:
      - "Sysmon Event ID 7"
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "NAI: All Windows Endpoints and Servers, especially those running Microsoft Office or other common applications."
    range: "Last 90 days, using daily counts and a trailing 30-day baseline."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          daily = GROUP Sysmon7 BY process_name, day => dll_load_count, missing_followon_script_count
          baseline = ROLLING_30D(daily.dll_load_count)
          ALERT WHERE dll_load_count > baseline.mean + 3*baseline.stddev

  - question: "Does graph-based anomaly detection identify a new or improbable process-to-DLL relationship for the PowerShell automation library?"
    context: >-
      Graph modeling is useful when a suspicious process-to-DLL edge is novel but
      not frequent enough to trip volume-based detections. Analysts should review
      the process path, parent process, user context, and edge probability before
      escalating the event.
    answer_sources:
      - "Sysmon Event ID 7"
      - "Windows Event ID 4104"
      - "Windows Event ID 4688"
      - "NAI: All Windows Endpoints and Servers, especially those running Microsoft Office or other common applications."
    range: "Last 90 days, with graph learning over the prior 30 days."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          graph = BUILD_PROCESS_DLL_GRAPH(Sysmon7)
          score = graph_anomaly_model.edge_score(process_image, image_loaded)
          ALERT WHERE image_loaded CONTAINS "System.Management.Automation" AND score <= low_probability_threshold

  - question: "Did PowerShell launch with high-risk switches such as ExecutionPolicy Bypass, EncodedCommand, NonInteractive, Hidden windowing, or Version 2 downgrade?"
    context: >-
      These switches are common in malicious or stealth-focused PowerShell use
      because they reduce visibility, weaken controls, or hide execution from the
      user. Analysts should pay extra attention when the user or parent process
      does not fit a known administrative workflow.
    answer_sources:
      - "Windows Event ID 4688"
      - "Windows Event ID 4104"
      - "Windows Event ID 4105"
      - "NAI: All Windows Endpoints and Servers, Domain Controllers, Tier 0 assets"
    range: "Last 90 days, with priority on the current process tree."
    queries:
      - technology: "SIEM/rule pseudocode"
        query: |
          ALERT FROM Event4688
          WHERE image IN ["powershell.exe","pwsh.exe"]
            AND command_line CONTAINS any_of(["-ExecutionPolicy","-WindowStyle Hidden","-NonInteractive","-EncodedCommand","-Version 2","-ep","-w","-noni","-enc"])

  - question: "Did a PowerShell process that used high-risk switches also try to disable logging or bypass AMSI shortly afterward?"
    context: >-
      The combination of stealth-oriented launch switches and follow-on attempts
      to modify logging or AMSI settings is far more suspicious than either
      pattern alone. Analysts should inspect the timing and preserve the specific
      bypass artifacts for immediate containment.
    answer_sources:
      - "Windows Event ID 4688"
      - "Windows Event ID 4104"
      - "Windows Event ID 4105"
      - "NAI: All Windows Endpoints and Servers, Domain Controllers, Tier 0 assets"
    range: "Last 90 days, using a 5-minute switch-to-bypass correlation window."
    queries:
      - technology: "Host correlation pseudocode"
        query: |
          risky = FILTER Event4688 BY command_line CONTAINS high_risk_switches
          bypass = FILTER [Event4104, Event4105] BY amsi_bypass_patterns OR scriptblock_logging_disable_patterns
          ALERT WHERE JOIN risky WITH bypass ON host, user, 5m

  - question: "Is a user showing first-time or statistically unusual use of high-risk PowerShell switches relative to their own 90-day baseline?"
    context: >-
      A switch like EncodedCommand or WindowStyle Hidden can be normal for a few
      automation accounts and highly suspicious for everyone else. Score usage
      relative to the user's own history so the alert reflects role and behavior
      rather than only generic badness.
    answer_sources:
      - "Windows Event ID 4688"
      - "Windows Event ID 4104"
      - "Windows Event ID 4105"
      - "NAI: All Windows Endpoints and Servers, Domain Controllers, Tier 0 assets"
    range: "Last 90 days, with per-user baseline scoring."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          usage = GROUP Event4688 BY user, day => hidden_count, encoded_count, bypass_count, total_pwsh
          baseline = USER_BASELINE(user, 90d)
          ALERT WHERE first_time_high_risk_switch=true OR hidden_count/total_pwsh > 0.5 OR any_metric > baseline.p95

  - question: "Has a user's PowerShell command-line behavior shifted into a higher-risk embedding or cluster relative to their normal usage?"
    context: >-
      Embedding-based clustering can catch changes in PowerShell usage that are
      hard to represent with static signatures, especially when a user moves from
      benign administrative commands into stealthier or more offensive patterns.
      Analysts should review the tokens driving the cluster shift.
    answer_sources:
      - "Windows Event ID 4688"
      - "Windows Event ID 4104"
      - "Windows Event ID 4105"
      - "NAI: All Windows Endpoints and Servers, Domain Controllers, Tier 0 assets"
    range: "Last 90 days, with a rolling 30-day user centroid."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          embedding = COMMANDLINE_EMBEDDING(tokenized_commandline)
          distance = COSINE_DISTANCE(embedding, user_30d_centroid)
          ALERT WHERE distance > 0.7 OR predicted_cluster IN high_risk_clusters

  - question: "Does a script block contain a large embedded payload such as a PE file, shellcode, or inline P/Invoke logic?"
    context: >-
      Large embedded payloads often reveal in-memory loaders, shellcode
      injection, or packed second stages. Analysts should decode candidate Base64
      strings, look for PE headers or common shellcode markers, and inspect
      Add-Type or Marshal usage that indicates native-code interaction.
    answer_sources:
      - "Windows Event ID 4104"
      - "NAI: All Windows Endpoints and Servers"
    range: "Last 90 days, with immediate triage of oversized script blocks."
    queries:
      - technology: "SIEM/content-analysis pseudocode"
        query: |
          ALERT FROM Event4104
          WHERE script_size > 4KB
            AND (base64_decodes_to_pe=true OR shellcode_markers=true OR add_type_pinvoke=true)

  - question: "Do sliding-window entropy measurements reveal a suspicious high-entropy region inside an otherwise ordinary script block?"
    context: >-
      Mixed low-entropy code and a concentrated high-entropy blob often indicates
      an embedded payload rather than a benign administrative script. Analysts
      should record the offset and size of the anomalous region to support rapid
      review and extraction.
    answer_sources:
      - "Windows Event ID 4104"
      - "NAI: All Windows Endpoints and Servers"
    range: "Last 90 days, compared to a 30-day benign script baseline."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          windows = SLIDING_ENTROPY(script_block_text, chunk=256B)
          ALERT WHERE max_entropy > 7.0 AND entropy_distribution_is_bimodal=true

  - question: "Is a script block carrying an unusually large Base64 segment for that host or workload?"
    context: >-
      Large Base64 blobs are common in malicious PowerShell staging and much less
      common in ordinary administrative scripts. Analysts should compare both the
      absolute length and the proportion of encoded content relative to total
      script size.
    answer_sources:
      - "Windows Event ID 4104"
      - "NAI: All Windows Endpoints and Servers"
    range: "Last 90 days, with host-level comparison to the prior 30 days."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          metrics = EXTRACT(base64_segment_len, base64_ratio, script_size)
          baseline = HOST_BASELINE(base64_segment_len, 30d)
          ALERT WHERE base64_segment_len > baseline.p99 OR base64_ratio > 0.7

  - question: "Does AST-based anomaly detection judge the script structure to be inconsistent with benign PowerShell content?"
    context: >-
      AST reconstruction error can identify unusual structure even when the raw
      text is heavily obfuscated. Analysts should review which node types
      contributed most to the anomaly because that often points directly to the
      malicious construct inside the script.
    answer_sources:
      - "Windows Event ID 4104"
      - "NAI: All Windows Endpoints and Servers"
    range: "Last 90 days, scored against a benign AST baseline."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          ast = PARSE_POWERSHELL_AST(script_block_text)
          error = ast_autoencoder.reconstruction_error(ast)
          ALERT WHERE error > benign_p99

  - question: "Can semantic deobfuscation recover the underlying PowerShell behavior and classify it into known malicious payload categories?"
    context: >-
      When obfuscation hides the real script intent, semantic deobfuscation helps
      recover the original behavior before classification. Analysts should keep
      both the recovered script and the matched semantic signature so the result
      remains reviewable and reproducible.
    answer_sources:
      - "Windows Event ID 4104"
      - "NAI: All Windows Endpoints and Servers"
    range: "Last 90 days, with deobfuscation run on suspicious high-entropy or obfuscated samples."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          deob = AST_SUBTREE_EMULATION(script_block_text)
          pred = semantic_signature_classifier.predict(deob)
          ALERT WHERE pred.category IN malicious_semantic_signatures

