name: 'T1059.001: PowerShell'
id: f89d293e-4264-4969-955e-49e6adc396cb
description: Investigate adversary abuse of Windows PowerShell for execution by fusing host script-block
  and process telemetry (Windows Event IDs 4104/4103/4105/4688, Sysmon process, module-load, and network
  events) with network evidence from Zeek (conn/dns/http) and web proxies. The playbook helps an analyst
  confirm execution of known-malicious PowerShell (hash and IOC matches, offensive-tool markers, AMSI-bypass
  logic), detect obfuscation (encoded commands, casting, entropy and character-frequency drift), surface
  download-and-execute cradles and their destinations, catch unmanaged or injected loading of System.Management.Automation.dll
  outside approved hosts, flag high-risk launch switches and logging/AMSI tampering, identify large embedded
  payloads such as PE files or shellcode, and uncover suspicious remote-session (WinRM/PSRemoting) and
  lateral-movement behavior. Deterministic rules, statistical baselines, and machine-learning models run
  in parallel so each method reinforces rather than replaces the others.
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-02-18'
modified: '2026-05-31'
version: '1.2'
tags: none
questions:
- question: Did a PowerShell script block (Event ID 4104) hash to a known-malicious value, or contain
    an embedded URL, IP, or domain that matches trusted threat intelligence, and was the script actually
    executed by powershell.exe/pwsh.exe?
  context: 'This is a high-confidence, low-noise check for execution of known-bad PowerShell. For each
    4104 script block, compute its SHA256 and compare against a curated malicious-hash set, and extract
    URI/IPv4/FQDN artifacts to compare against threat feeds. Confirm execution by correlating a 4688 process-creation
    event for powershell.exe or pwsh.exe within roughly a two-minute window so dead text or copied content
    is not mistaken for live execution. Run SigmaHQ posh_ps_malicious_commandlets.yml in parallel to catch
    offensive cmdlets (Invoke-Mimikatz, Get-Keystrokes) in ScriptBlockText. Under the Execution tactic,
    a positive result is strong evidence that adversary-controlled code ran; preserve any matched domain/URL/IP
    for follow-on network scoping. References: [SigmaHQ PowerShell Rules](https://github.com/SigmaHQ/sigma)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points'
  range: Last 90 days, prioritizing a 2-minute script-to-process execution window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  scripts = FROM Event4104 COMPUTE sha256(script_block_text), iocs=extract(uri,ipv4,fqdn)\n\
      \  proc   = FROM Event4688 WHERE image IN [\"powershell.exe\",\"pwsh.exe\"]\n  ALERT WHERE (scripts.sha256\
      \ IN malicious_hashes OR scripts.iocs OVERLAP threat_intel)\n        AND JOIN scripts WITH proc\
      \ ON host WITHIN 2m"
- question: Does a PowerShell script block contain known offensive-tool function names, framework markers,
    or hardcoded C2 URIs, or AMSI-bypass reflection patterns, and is that corroborated by matching DNS/connection
    activity?
  context: 'Many malicious scripts reuse recognizable function names, tool-specific markers, or hardcoded
    C2 values, and frequently include AMSI-bypass logic (System.Management.Automation.Amsi reflection,
    AmsiUtils references). Build a rule set for these markers in 4104 script blocks, then validate by
    checking Zeek dns.log/conn.log for the same domain or IP within five minutes of execution. Flag AMSI-bypass
    patterns independently since they indicate deliberate evasion. Ensure AMSI is enabled (per NSA/CISA
    guidance) so post-deobfuscation content is available. For the Execution tactic, corroborating network
    activity raises confidence that the script was operationally active rather than merely present. References:
    [Elastic AMSI Bypass Detection Rule](https://github.com/elastic/detection-rules/blob/main/rules/windows/defense_evasion_amsi_bypass_powershell.toml)
    [NSA/CISA Keeping PowerShell](https://media.defense.gov/2022/Jun/22/2003021689/-1/-1/0/CSI_KEEPING_POWERSHELL_SECURITY_MEASURES_TO_USE_AND_EMBRACE_20220622.PDF)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points'
  range: Last 90 days, with 5-minute script-to-network correlation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  susp = FILTER Event4104 BY (tool_markers OR c2_uri OR amsi_bypass_patterns OR amsiutils_ref)\n\
      \  net  = FILTER [Zeek_dns, Zeek_conn] BY domain_or_ip IN extracted_iocs(susp)\n  ALERT WHERE susp.exists\
      \ AND JOIN susp WITH net ON host WITHIN 5m"
- question: Are there rare PowerShell script-block hashes whose low fleet-wide prevalence coincides with
    first-seen or low-reputation network destinations?
  context: 'Novel script content not yet on blocklists can still behave like malware. Compute 30-day prevalence
    per script hash across endpoints and flag hashes seen on fewer than five hosts or below 0.1% of the
    estate (use the 1st-percentile of per-hash host counts via mean/stddev for tuning). For flagged hashes,
    correlate the executing host with Zeek dns.log/conn.log for first-seen domains or low-reputation destinations
    within five minutes. For Execution, the combination of rarity plus novel outbound infrastructure is
    a strong prioritization signal for hunting unknown PowerShell-based intrusions. References: [Revoke-Obfuscation:
    PowerShell Obfuscation Detection Using Science](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points'
  range: Last 90 days, using a 30-day prevalence baseline and 5-minute network join.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  prev = GROUP Event4104 BY script_hash => distinct_hosts, estate_pct\n  rare = FILTER prev\
      \ BY distinct_hosts < 5 OR estate_pct < 0.1 OR host_count < percentile(1)\n  net  = FILTER [Zeek_dns,\
      \ Zeek_conn] BY first_seen_dest=true OR reputation IN [\"low\",\"malicious\"]\n  ALERT WHERE JOIN\
      \ rare WITH net ON host WITHIN 5m"
- question: Does a supervised content classifier score a PowerShell script block as malicious based on
    its text n-grams, entropy, cmdlet categories, parser-token counts, and suspicious string tokens?
  context: 'Use a supervised classifier (Gradient Boosting / Random Forest) trained on labeled benign/malicious
    script blocks for content that is suspicious but matches no hardcoded IOC. Features include character
    3-gram TF-IDF, Shannon entropy, cmdlet categories, the 20 PSParser token-type counts, and tokens like
    IEX or DownloadString (Hendler et al. report TPR 0.98 at FPR 1:1000). Score every new 4104 block,
    alert above a tuned confidence (~0.85), and emit the top-3 SHAP features for interpretability; monitor
    weekly FPR for drift. For Execution, this broadens coverage to novel/obfuscated scripts while keeping
    results triage-able. References: [AMSI-Based Detection of Malicious PowerShell Code Using Contextual
    Embeddings](https://arxiv.org/pdf/1905.09538) [das-lab/mpsd](https://github.com/das-lab/mpsd) [Fa2y/Malicious-PowerShell-Dataset](https://github.com/Fa2y/Malicious-PowerShell-Dataset)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points'
  range: Last 90 days, with model scoring at script-ingestion time.
  queries:
  - technology: ML pipeline pseudocode
    query: "  feats = extract(tfidf_3gram, shannon_entropy, cmdlet_categories, psparser_token_counts,\
      \ susp_tokens)\n  score = posh_content_clf.predict_proba(feats)\n  explain = shap_top3(feats)\n\
      \  ALERT WHERE score >= 0.85"
- question: Where AMSI telemetry exists, does a deep-learning model score the AMSI-intercepted, post-deobfuscation
    content as malicious even when command-line or script-block visibility is incomplete?
  context: 'AMSI captures content after runtime deobfuscation and yields roughly twice the scan events
    of command-line logging alone; Microsoft showed a Word2Vec + CNN-LSTM architecture added ~22 points
    of coverage at a fixed 0.1% FPR. Deploy a character-level CNN or CNN-LSTM on AMSI content as a parallel
    detector to the script-block classifier and the deterministic IOC rules (not a replacement). Alert
    output must include the top-3 feature contributors and the source script-block ID. For Execution,
    this catches scripts that only become obviously malicious after expansion or decoding at runtime.
    References: [Deep learning rises: New methods for detecting malicious PowerShell](https://www.microsoft.com/en-us/security/blog/2019/09/03/deep-learning-rises-new-methods-for-detecting-malicious-powershell/)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points'
  range: Last 90 days, with near-real-time AMSI scoring where available.
  queries:
  - technology: ML pipeline pseudocode
    query: "  amsi = collect_amsi_content(host)\n  score = cnn_lstm_amsi_model.predict_proba(amsi)\n \
      \ explain = top_feature_drivers(amsi)\n  ALERT WHERE score >= 0.85"
- question: Do PowerShell command lines (4688) or script blocks (4104) contain explicit obfuscation syntax
    such as -EncodedCommand, FromBase64String, [char] casting, -replace, in-keyword backticks, or concatenated
    string assembly?
  context: 'Regex/static matching gives fast coverage of common obfuscation families. Match -EncodedCommand
    and abbreviations (-e/-en/-enc), FromBase64String, [char], -replace, backticks inside keywords, and
    string concatenation in 4688 command lines and 4104 blocks. Use SigmaHQ proc_creation_win_powershell_base64_encoded_cmd
    for Base64 markers (JAB, SUVYI, SQBFAFgA) and Neo23x0 gen_powershell_obfuscation.yar YARA rules. When
    an encoded command is found, decode it and re-run detections on the decoded text, preserving both
    forms. For Execution, confirmed obfuscation paired with powershell.exe/pwsh.exe execution warrants
    alerting and second-stage analysis. References: [Suspicious Encoded PowerShell Command Line](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd/)
    [Neo23x0 PowerShell Obfuscation YARA](https://github.com/Neo23x0/signature-base/blob/master/yara/gen_powershell_obfuscation.yar)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days, with immediate analysis of the current process tree.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  ALERT FROM [Event4688, Event4104]\n  WHERE command_line OR script_block_text MATCHES obfuscation_regex_library\n\
      \        // -enc/-e/-en, FromBase64String, [char], -replace, backticks, concat\n  THEN if encoded:\
      \ decoded=base64_decode(payload); rerun detections on decoded"
- question: When an encoded PowerShell payload is present, does the decoded content reveal execution or
    download primitives, or a version-2 downgrade, that confirm obfuscated malicious intent?
  context: 'Encoding alone is not proof of malice. When a 4688 event includes -EncodedCommand, decode
    the Base64 and alert if the decoded text contains execution primitives (IEX/Invoke-Expression, Add-Type,
    reflection) or download primitives (DownloadString, Invoke-WebRequest). Also flag PowerShell v2 downgrade
    attempts (-Version 2) that bypass AMSI and Constrained Language Mode. For Execution, decoded intent
    distinguishes benign encoded configuration from staged attacker code and tells the analyst exactly
    what would have run. References: [NSA/CISA Keeping PowerShell](https://media.defense.gov/2022/Jun/22/2003021689/-1/-1/0/CSI_KEEPING_POWERSHELL_SECURITY_MEASURES_TO_USE_AND_EMBRACE_20220622.PDF)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days, focusing on the current encoded execution event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  enc = FILTER Event4688 BY command_line CONTAINS encoded_switches\n  decoded = base64_decode(enc.payload)\n\
      \  ALERT WHERE decoded CONTAINS any([\"IEX\",\"Invoke-Expression\",\"Add-Type\",\"DownloadString\"\
      ,\"Invoke-WebRequest\"])\n        OR command_line CONTAINS \"-Version 2\""
- question: Do script blocks look statistically obfuscated based on Shannon entropy, non-alphanumeric
    ratio, character-frequency cosine similarity, and special-character outliers versus a benign corpus?
  context: 'When attackers avoid obvious encoded-command switches but still distort script text, statistics
    catch them. Compute entropy, non-alphanumeric ratio, and character-frequency cosine similarity against
    a corpus baseline (Bohannon/Holmes: obfuscated scripts diverge sharply from English-like PowerShell).
    Flag scripts above the 95th entropy percentile (~5.5 for blocks, tune per environment) or with cosine
    similarity below 0.8 against the 408K-script corpus, and flag special-character (backtick/bracket/pipe/caret/dollar)
    frequencies exceeding 2-3 standard deviations. For Execution, these measurements explain why content
    is anomalous and guide deobfuscation. References: [Revoke-Obfuscation](https://github.com/danielbohannon/Revoke-Obfuscation)
    [More Detecting Obfuscated PowerShell](https://www.leeholmes.com/more-detecting-obfuscated-powershell/)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days, compared to a 30-day or corpus-derived baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  m = compute(shannon_entropy, non_alnum_ratio, charfreq_cosine_sim, special_char_zscore)\n\
      \  ALERT WHERE m.entropy > p95 OR m.charfreq_cosine_sim < 0.8 OR m.special_char_zscore > 3"
- question: Can a multinomial classifier identify which obfuscation technique family (STRING, TOKEN, AST,
    ENCODING) a PowerShell sample uses, with explainable discriminating features?
  context: 'Knowing the obfuscation family helps choose the correct deobfuscation and hunting path. Train
    a multinomial Random Forest/XGBoost on character n-gram profiles, AST node distributions, and the
    20 PSParser token counts to label Invoke-Obfuscation categories (Fang et al. ~98% with hybrid text+AST
    features; Song et al. ~98% at <0.1% FPR). Alert with the detected category and top-3 discriminating
    features; run this in parallel to the regex rules. For Execution, the family label points directly
    to the deobfuscation tooling needed to recover and assess the real payload. References: [Effective
    method for detecting malicious PowerShell scripts based on hybrid features](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099)
    [Evaluations of AI-based malicious PowerShell detection with feature optimizations](https://onlinelibrary.wiley.com/doi/full/10.4218/etrij.2020-0215)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days, with scoring on newly observed PowerShell content.
  queries:
  - technology: ML pipeline pseudocode
    query: "  feats = extract(char_ngrams, ast_node_distribution, psparser_token_counts)\n  pred  = obfuscation_family_clf.predict(feats)\
      \  # {STRING,TOKEN,AST,ENCODING}\n  explain = top_feature_drivers(feats)\n  ALERT WHERE pred.class\
      \ IN [\"STRING\",\"TOKEN\",\"AST\",\"ENCODING\"]"
- question: Did a PowerShell command (4688/4104) combine an execution primitive with a download primitive
    and then immediately generate outbound network activity to an external destination?
  context: 'This is the classic download-and-execute cradle. Trigger when 4688/4104 includes both an execution
    primitive (IEX/Invoke-Expression) and a download primitive (DownloadString, Invoke-WebRequest, Start-BitsTransfer);
    SigmaHQ proc_creation_win_powershell_susp_download_patterns covers known cradle variants. Correlate
    Sysmon Event ID 3 and Zeek conn.log/dns.log for outbound connections or DNS by the same host within
    ~10 seconds to external destinations, and include destination IP, port, domain, and bytes in the alert.
    For Execution, the near-immediate network leg confirms a real fetch-and-run rather than benign scripting.
    References: [SigmaHQ Download Patterns Rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_susp_download_patterns.yml)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, Network Egress Points, Web Proxies, DNS Resolvers'
  range: Last 90 days, with 10-second process-to-network correlation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  cradle = FILTER [Event4688, Event4104] BY exec_primitive AND download_primitive\n  net \
      \   = FILTER [Sysmon3, Zeek_conn, Zeek_dns, Zeek_http] BY external_destination=true\n  ALERT WHERE\
      \ JOIN cradle WITH net ON host WITHIN 10s\n        OUTPUT dest_ip, dest_port, domain, bytes"
- question: Was remotely fetched web content executed directly in memory toward a non-allowlisted destination,
    and was PowerShell spawned by an abuse-prone parent process?
  context: 'Direct in-memory execution of remote content is especially suspicious when the destination
    is not approved and PowerShell descends from a document handler. Alert when 4688/4104 combine WebClient/Invoke-WebRequest
    with direct-execution patterns (IEX, Invoke-Command, [ScriptBlock]::Create) toward a non-allowlisted
    host, and elevate severity when the parent is winword.exe, excel.exe, mshta.exe, or wscript.exe (Red
    Canary''s parent-child guidance). For Execution, inspect the parent-child lineage and the destination
    together to confirm phishing-driven or LOLBin-driven PowerShell execution. References: [PowerShell
    - Red Canary Threat Detection Report](https://redcanary.com/threat-detection-report/techniques/powershell/)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, Network Egress Points, Web Proxies, DNS Resolvers'
  range: Last 90 days, prioritizing the first execution sequence from the parent process.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  ALERT FROM [Event4688, Event4104]\n  WHERE contains_webclient_or_iwr AND contains_direct_exec_pattern\n\
      \        AND destination NOT IN allowlisted_hosts\n  ESCALATE WHEN parent_image IN [\"winword.exe\"\
      ,\"excel.exe\",\"mshta.exe\",\"wscript.exe\"]"
- question: Is a host generating an abnormally high volume of PowerShell-originated outbound connections,
    bytes, or failed connection attempts relative to its peer group?
  context: 'Baseline outbound connections and bytes_out from powershell.exe per host over 30 days using
    Zeek conn.log/http.log. Flag hosts whose daily PowerShell-initiated connections exceed the 99th percentile
    of their peer group with external, non-allowlisted destinations, and raise severity when http.log
    shows User-Agent values containing WindowsPowerShell/PowerShell plus newly registered domains. Track
    failed connections (conn_state S0/REJ/SF) separately, since a high failure-to-success ratio is often
    a louder indicator than a single successful download. For Execution, this surfaces staging, beaconing,
    or attacker trial-and-error against peers. References: [Revoke-Obfuscation: PowerShell Obfuscation
    Detection Using Science](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, Network Egress Points, Web Proxies, DNS Resolvers'
  range: Last 90 days, with a 30-day peer baseline and daily scoring.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  daily = GROUP powershell_net BY host, day => conn_count, bytes_out, fail_ratio\n  peer \
      \ = host_peer_group_baseline(host)\n  ALERT WHERE conn_count > peer.p99 OR bytes_out > peer.p99\
      \ OR fail_ratio > peer.fail_ratio_p99\n  ESCALATE WHEN user_agent ~ /PowerShell/ AND dest_domain_newly_registered"
- question: Does time-series modeling show a host's PowerShell outbound traffic volume or distinct-destination
    count deviating significantly from its expected pattern?
  context: 'Some malicious PowerShell is best seen as a temporal shift rather than a single bad command.
    Apply Prophet or an LSTM autoencoder to per-host PowerShell outbound volume and destination counts;
    alert on significant deviation from expected behavior. The model must output the specific time window,
    destination IPs, byte volumes, and connection counts that triggered the anomaly (a bare score is insufficient).
    Run this in parallel to the cradle regex rules and the volume baseline. For Execution, the captured
    window and destinations make the anomaly actionable during response. References: [Deep learning rises:
    New methods for detecting malicious PowerShell](https://www.microsoft.com/en-us/security/blog/2019/09/03/deep-learning-rises-new-methods-for-detecting-malicious-powershell/)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, Network Egress Points, Web Proxies, DNS Resolvers'
  range: Last 90 days, with hourly or finer-grained time-series scoring.
  queries:
  - technology: ML pipeline pseudocode
    query: "  series = build_host_series(conn_count, dest_count, bytes_out FOR powershell_procs)\n  anom\
      \   = ts_model.score(series)   # Prophet or LSTM-autoencoder\n  ALERT WHERE anom.is_anomaly OUTPUT\
      \ window, dest_ips, bytes, conn_counts"
- question: Can an NLP-based classifier identify a novel PowerShell download-cradle variant that evades
    existing regex signatures?
  context: 'Novel cradles preserve semantic intent while altering syntax or abbreviating parameters. Deploy
    a TF-IDF + kernel SVM or gradient-boosted tree with trie-based parameter stemming (e.g., -NoL -> -NoLogo)
    and NER for URLs/IPs/registry keys (Mandiant''s pipeline) to catch variants regex misses. Train on
    Invoke-CradleCrafter and real-world samples and emit the top-3 discriminating tokens per alert. For
    Execution, this surfaces semantically-equivalent cradles that bypass deterministic coverage and records
    the tokens that justify the detection. References: [Malicious PowerShell Detection via Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/malicious-powershell-detection-via-machine-learning/)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, Network Egress Points, Web Proxies, DNS Resolvers'
  range: Last 90 days, with scoring on all newly observed cradle-like content.
  queries:
  - technology: ML pipeline pseudocode
    query: "  text  = normalize_posh_params(command_or_script)  # trie stemming -NoL->-NoLogo\n  score\
      \ = cradle_variant_clf.predict_proba(tfidf(text))\n  explain = top_tokens(text)\n  ALERT WHERE score\
      \ >= 0.85"
- question: Did a non-allowlisted process load System.Management.Automation.dll (or its NGEN image), indicating
    unmanaged PowerShell hosting or injection into a non-PowerShell process?
  context: 'Loading the PowerShell automation library outside a normal host (powershell.exe, pwsh.exe,
    powershell_ise.exe, approved tools) strongly suggests embedded or injected PowerShell. Using Sysmon
    Event ID 7, alert when ImageLoaded is System.Management.Automation.dll or .ni.dll and ProcessImage
    is not allowlisted; SigmaHQ image_load_dll_system_management_automation_susp_load is the baseline.
    Elevate severity for common abuse targets (rundll32.exe, mshta.exe, wscript.exe, Office binaries)
    or unsigned images, aligning with Palantir ADS-004. For Execution, immediately inspect the process
    image, parent, signature state, and user context. References: [PowerShell Core DLL Loaded By Non PowerShell
    Process](https://detection.fyi/sigmahq/sigma/windows/image_load/image_load_dll_system_management_automation_susp_load/)
    [Palantir ADS-004](https://github.com/palantir/alerting-detection-strategy-framework/blob/master/ADS-Examples/004-Unusual-Powershell-Host-Process.md)'
  answer_sources:
  - Sysmon Event ID 7
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, especially those running Microsoft Office or other common
    applications.'
  range: Last 90 days, with immediate triage around the DLL-load event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  ALERT FROM Sysmon7\n  WHERE image_loaded IN [\"System.Management.Automation.dll\",\"System.Management.Automation.ni.dll\"\
      ]\n        AND process_image NOT IN allowlisted_powershell_hosts\n  ESCALATE WHEN process_image\
      \ IN [\"rundll32.exe\",\"mshta.exe\",\"wscript.exe\",office_bins] OR unsigned"
- question: Did a suspicious System.Management.Automation.dll load occur without corresponding script-block
    logging, suggesting unmanaged PowerShell execution that bypasses Script Block Logging and AMSI?
  context: 'AMSI and Script Block Logging require the standard PowerShell host, so their absence alongside
    a DLL load signals evasion. Correlate Sysmon Event ID 7 loads of System.Management.Automation.dll
    with 4688 showing the same process launched without a PowerShell host parent, and flag when no 4104
    script blocks appear within five minutes. Treat the logging gap itself as an indicator. For Execution,
    this catches unmanaged runspaces and .NET-based PowerShell that deliberately avoid instrumentation,
    especially when the process is not a known admin tool. References: [PowerShell Security Features](https://learn.microsoft.com/en-us/powershell/scripting/security/security-features?view=powershell-7.5)'
  answer_sources:
  - Sysmon Event ID 7
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, especially those running Microsoft Office or other common
    applications.'
  range: Last 90 days, using a 5-minute DLL-load-to-script-log window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  loads   = FILTER Sysmon7 BY image_loaded CONTAINS \"System.Management.Automation\"\n  scripts\
      \ = FILTER Event4104 BY host = loads.host\n  ALERT WHERE loads.process_image NOT IN allowlisted_powershell_hosts\n\
      \        AND NOT EXISTS scripts WITHIN 5m OF loads"
- question: Are rare or low-frequency process names loading System.Management.Automation.dll in a way
    that departs from the enterprise baseline?
  context: 'Rarity across the fleet is useful triage context even when a load is not obviously malicious.
    Build a 30-day frequency table of processes loading System.Management.Automation.dll and flag non-allowlisted
    process names appearing on fewer than five hosts or below 0.1% of endpoints; also compute mean/stddev
    of daily load counts per process name and flag process-name/host combinations exceeding 3 standard
    deviations above the mean. For Execution, compare the process-name and host combination to the baseline
    before deciding whether the load is expected. References: [Revoke-Obfuscation](https://github.com/danielbohannon/Revoke-Obfuscation)'
  answer_sources:
  - Sysmon Event ID 7
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, especially those running Microsoft Office or other common
    applications.'
  range: Last 90 days, with a 30-day loader-frequency baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  loaders = GROUP Sysmon7[image_loaded ~ \"System.Management.Automation\"] BY process_name\n\
      \            => distinct_hosts, estate_pct, daily_count\n  ALERT WHERE process_name NOT IN allowlisted_powershell_hosts\n\
      \        AND (distinct_hosts < 5 OR estate_pct < 0.1 OR daily_count > mean+3*stddev)"
- question: Is the daily count of System.Management.Automation.dll loads for a given process name surging
    above its 30-day baseline, with failed follow-on execution?
  context: 'A sudden spike in DLL loads by a process that normally loads the module rarely can indicate
    malware experimentation, reflective loading, or new tradecraft. Track daily counts per process name
    and alert on spikes exceeding three standard deviations above the 30-day mean, especially on Tier
    0 assets. Also profile error rate: count loads with no subsequent successful script execution (no
    4104/4103 within 60 seconds), since repeated failed loads suggest injection attempts or tool testing.
    For Execution, include the failed-follow-on signal as corroboration.'
  answer_sources:
  - Sysmon Event ID 7
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, especially those running Microsoft Office or other common
    applications.'
  range: Last 90 days, using daily counts and a trailing 30-day baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  daily = GROUP Sysmon7 BY process_name, day => dll_load_count, missing_followon\n  base \
      \ = rolling_30d(daily.dll_load_count)\n  ALERT WHERE dll_load_count > base.mean + 3*base.stddev\n\
      \        OR missing_followon_rate elevated  // load but no 4104/4103 within 60s"
- question: Does graph-based anomaly detection identify a new or improbable process-to-DLL relationship
    for the PowerShell automation library (e.g., wscript.exe -> System.Management.Automation.dll)?
  context: 'Graph modeling helps when a suspicious process-to-DLL edge is novel but too infrequent to
    trip volume detections. Learn normal process-to-DLL relationships from Sysmon Event ID 7 over a 30-day
    baseline (GCN or node2vec embeddings; Choi 2021 reports ~8.2% improvement over CNN baselines), then
    alert on new low-probability edges that never appeared in baseline. Output the process path, parent
    process, user context, and edge probability. For Execution, review the novel edge and adjacent context
    rather than treating the score as standalone evidence. References: [AST-Based Deep Learning for Detecting
    Malicious PowerShell](https://dl.acm.org/doi/10.1145/3243734.3278496)'
  answer_sources:
  - Sysmon Event ID 7
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, especially those running Microsoft Office or other common
    applications.'
  range: Last 90 days, with graph learning over the prior 30 days.
  queries:
  - technology: ML pipeline pseudocode
    query: "  graph = build_process_dll_graph(Sysmon7, window=30d)\n  score = graph_anomaly_model.edge_score(process_image,\
      \ image_loaded)\n  ALERT WHERE image_loaded CONTAINS \"System.Management.Automation\"\n        AND\
      \ score <= low_probability_threshold\n  OUTPUT process_path, parent, user, edge_prob"
- question: Did PowerShell launch with high-risk switches such as -ExecutionPolicy Bypass, -WindowStyle
    Hidden, -NonInteractive, -EncodedCommand, or -Version 2, especially from a non-admin user or document-handler
    parent?
  context: 'These switches weaken controls or hide execution. Detect 4688 entries where powershell.exe/pwsh.exe
    command lines include -ExecutionPolicy Bypass, -WindowStyle Hidden, -NonInteractive, or -EncodedCommand
    (and abbreviations -ep/-exec/-w/-noni/-e/-en/-enc), and detect -Version 2 downgrade that bypasses
    AMSI and CLM. Increase severity if the user is not in an approved admin group or the parent is a document
    handler (Red Canary highlights parent lineage). For Execution, weigh role and parent process so legitimate
    admin workflows are not over-alerted. References: [PowerShell - Red Canary Threat Detection Report](https://redcanary.com/threat-detection-report/techniques/powershell/)
    [NSA/CISA Keeping PowerShell](https://media.defense.gov/2022/Jun/22/2003021689/-1/-1/0/CSI_KEEPING_POWERSHELL_SECURITY_MEASURES_TO_USE_AND_EMBRACE_20220622.PDF)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4105
  - 'NAI: All Windows Endpoints and Servers, Domain Controllers, Tier 0 assets'
  range: Last 90 days, with priority on the current process tree.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  ALERT FROM Event4688\n  WHERE image IN [\"powershell.exe\",\"pwsh.exe\"]\n        AND command_line\
      \ CONTAINS any([\"-ExecutionPolicy\",\"-WindowStyle Hidden\",\"-NonInteractive\",\n            \"\
      -EncodedCommand\",\"-Version 2\",\"-ep\",\"-w\",\"-noni\",\"-enc\"])\n  ESCALATE WHEN user NOT IN\
      \ admin_group OR parent_image IN document_handlers"
- question: Did a PowerShell process using high-risk switches also attempt to disable Script Block Logging
    or bypass AMSI shortly afterward?
  context: 'Stealth-oriented launch switches combined with follow-on tampering are far more suspicious
    than either alone. Alert when 4104/4105 shows execution that disables logging or AMSI (Set-ItemProperty
    on HKLM:\SOFTWARE\...\ScriptBlockLogging, AmsiUtils reflection, or in-memory amsi.dll patching) within
    five minutes of a 4688 event carrying high-risk switches (Elastic provides EQL for these patterns).
    For Execution, inspect timing and preserve the specific bypass artifacts to support immediate containment
    of an active operator. References: [Elastic Detection Rules](https://github.com/elastic/detection-rules/blob/main/rules/windows/defense_evasion_amsi_bypass_powershell.toml)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4105
  - 'NAI: All Windows Endpoints and Servers, Domain Controllers, Tier 0 assets'
  range: Last 90 days, using a 5-minute switch-to-bypass correlation window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  risky  = FILTER Event4688 BY command_line CONTAINS high_risk_switches\n  bypass = FILTER\
      \ [Event4104, Event4105] BY amsi_bypass_patterns OR sbl_disable_patterns\n  ALERT WHERE JOIN risky\
      \ WITH bypass ON host, user WITHIN 5m"
- question: Is a user showing first-time or statistically unusual use of high-risk PowerShell switches
    relative to their own 90-day baseline, including hidden-window ratio and failed executions?
  context: 'A switch like -EncodedCommand or -WindowStyle Hidden may be normal for a few automation accounts
    but anomalous for everyone else. Maintain per-user baselines of switch usage over 90 days; alert on
    first-time use of high-risk switches or daily counts above the user''s 95th percentile. Compute the
    hidden-window-to-total ratio (>0.5 on a non-automation account is anomalous) and track failed executions
    (4688 with non-zero exit codes) alongside switch usage, since repeated bypass-flag failures suggest
    trial-and-error. For Execution, scoring against the user''s own history reflects role and behavior,
    not generic badness. References: [Revoke-Obfuscation: PowerShell Obfuscation Detection Using Science](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4105
  - 'NAI: All Windows Endpoints and Servers, Domain Controllers, Tier 0 assets'
  range: Last 90 days, with per-user baseline scoring.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  usage = GROUP Event4688 BY user, day => hidden_n, encoded_n, bypass_n, total_pwsh, fail_n\n\
      \  base  = user_baseline(user, 90d)\n  ALERT WHERE first_time_high_risk_switch\n        OR hidden_n/total_pwsh\
      \ > 0.5\n        OR any_metric > base.p95\n        OR fail_n_with_bypass elevated"
- question: Has a user's PowerShell command-line behavior shifted into a higher-risk embedding cluster
    relative to their normal usage?
  context: 'Embedding-based clustering catches usage changes hard to express with static signatures. Cluster
    accounts by tokenized command-line features (argument vectors, execution frequency, parent types)
    using contextual embeddings (Microsoft showed Word2Vec on unlabeled PowerShell captures semantic similarity).
    Alert when a user shifts from a low-usage cluster to a high-risk cluster or when command-line embedding
    distance exceeds a threshold (e.g., cosine distance > 0.7 from the user''s 30-day centroid), and output
    the tokens/switches driving the shift. For Execution, review the driving tokens to judge whether a
    user has moved from benign admin to offensive patterns. References: [Deep learning rises: New methods
    for detecting malicious PowerShell](https://www.microsoft.com/en-us/security/blog/2019/09/03/deep-learning-rises-new-methods-for-detecting-malicious-powershell/)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4105
  - 'NAI: All Windows Endpoints and Servers, Domain Controllers, Tier 0 assets'
  range: Last 90 days, with a rolling 30-day user centroid.
  queries:
  - technology: ML pipeline pseudocode
    query: "  emb  = commandline_embedding(tokenized_commandline)\n  dist = cosine_distance(emb, user_30d_centroid)\n\
      \  ALERT WHERE dist > 0.7 OR predicted_cluster IN high_risk_clusters\n  OUTPUT driving_tokens"
- question: Does a PowerShell script block contain a large embedded payload such as a Base64-decoded PE
    (MZ/4D5A) header, shellcode byte sequences, or inline P/Invoke (Add-Type with DllImport/Marshal)?
  context: 'Large embedded payloads reveal in-memory loaders, shellcode injection, or packed second stages.
    Flag 4104 blocks larger than 4KB containing Base64 that decodes to PE headers (MZ/4D5A) or shellcode
    patterns (e.g., 0xFC 0xE8 call-pop). Apply Neo23x0 gen_powershell_susp.yar for known shellcode and
    embedded-executable patterns, and detect Add-Type with inline C# using DllImport/Marshal (P/Invoke
    shellcode injection); Elastic provides PSReflect detection for Win32 API interaction. For Execution,
    decode candidate Base64 and inspect Add-Type/Marshal usage that indicates native-code interaction.
    References: [Neo23x0 PowerShell Suspicious YARA](https://github.com/Neo23x0/signature-base/blob/master/yara/gen_powershell_susp.yar)
    [PowerShell PSReflect Script Detection](https://elastic.co/guide/en/security/current/powershell-psreflect-script.html)'
  answer_sources:
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days, with immediate triage of oversized script blocks.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  ALERT FROM Event4104\n  WHERE script_size > 4KB\n        AND (base64_decodes_to_PE_header(MZ/4D5A)\n\
      \             OR shellcode_markers(0xFC,0xE8)\n             OR add_type_with_dllimport_or_marshal)"
- question: Do sliding-window entropy measurements reveal a distinct high-entropy region inside an otherwise
    ordinary script block, indicating a concentrated embedded payload?
  context: 'A mix of low-entropy code and a concentrated high-entropy blob often signals an embedded payload
    rather than a benign script. Compute sliding-window entropy over 256-byte chunks and flag scripts
    with a high-entropy region above 7.0 bits/byte and a bimodal entropy distribution versus benign baselines
    (Bohannon/Holmes identify entropy as a primary discriminator). Tune the threshold to the 99th percentile
    of maximum sliding-window entropy over a 30-day benign baseline, and output the byte offset and length
    of the high-entropy region. For Execution, record the offset/size to support rapid extraction and
    review. References: [Revoke-Obfuscation](https://github.com/danielbohannon/Revoke-Obfuscation)'
  answer_sources:
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days, compared to a 30-day benign script baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  win = sliding_entropy(script_block_text, chunk=256B)\n  ALERT WHERE max(win) > 7.0 AND entropy_distribution_is_bimodal\n\
      \  OUTPUT high_entropy_offset, high_entropy_len"
- question: Is a script block carrying an unusually large Base64 segment, or a high ratio of Base64 content
    to total script length, for that host or workload?
  context: 'Large Base64 blobs are common in malicious staging and rare in ordinary admin scripts. Compare
    Base64 string lengths per host against a 30-day baseline and alert when a block contains a segment
    above that host''s 99th percentile. Also compute the ratio of Base64 content length to total script
    length; a ratio above 0.7 in a block exceeding 4KB strongly indicates an embedded payload rather than
    legitimate encoded configuration. For Execution, weigh both absolute length and proportion to separate
    staging from benign encoded settings. References: [Effective method for detecting malicious PowerShell
    scripts based on hybrid features](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099)'
  answer_sources:
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days, with host-level comparison to the prior 30 days.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  m    = extract(base64_segment_len, base64_ratio, script_size)\n  base = host_baseline(base64_segment_len,\
      \ 30d)\n  ALERT WHERE base64_segment_len > base.p99 OR (base64_ratio > 0.7 AND script_size > 4KB)"
- question: Does AST-based anomaly detection judge a script's structure to be inconsistent with benign
    PowerShell, even when the raw text is heavily obfuscated?
  context: 'AST reconstruction error identifies unusual structure even through obfuscation. Train an autoencoder
    on ASTs of benign scripts and alert when reconstruction error exceeds the 99th percentile of the benign
    baseline (MPSAutodetect: 98% TPR at 0.6% FPR; Power-ASTNN: 98.87% accuracy via fine-grained subtree
    decomposition with multi-head attention). Output the AST node types contributing most to the error.
    For Execution, review the contributing node types since they often point directly at the embedded-payload
    literal or malicious construct. References: [MPSAutodetect](https://www.researchgate.net/publication/358559673_MPSAutodetect_A_Malicious_PowerShell_Script_Detection_Model_Based_on_a_Stacked_Denoising_Auto-Encoder)
    [Power-ASTNN](https://www.sciencedirect.com/science/article/abs/pii/S0167404825001300)'
  answer_sources:
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days, scored against a benign AST baseline.
  queries:
  - technology: ML pipeline pseudocode
    query: "  ast = parse_powershell_ast(script_block_text)\n  err = ast_autoencoder.reconstruction_error(ast)\n\
      \  ALERT WHERE err > benign_p99 OUTPUT top_contributing_node_types"
- question: Can semantic deobfuscation recover the underlying PowerShell behavior and classify it against
    known malicious payload semantic signatures?
  context: 'When obfuscation hides intent, recover behavior before classifying. Apply AST subtree emulation-based
    deobfuscation (~<0.5s per script) to recover original content, then classify against 31 known semantic
    attack signatures via objective-oriented association mining (Li et al.: 92.3% TPR at 0% FPR, outperforming
    Defender and VirusTotal on obfuscated samples). Run deobfuscation before the autoencoder and classifier
    so cleaned content improves downstream accuracy; the 31 signatures cover credential theft, lateral
    movement, persistence, and exfiltration. For Execution, keep both the recovered script and the matched
    signature so results stay reviewable and reproducible. References: [Effective and Light-Weight Deobfuscation
    and Semantic-Aware Attack Detection for PowerShell Scripts](https://dl.acm.org/doi/10.1145/3319535.3363187)
    [GitHub](https://github.com/li-zhenyuan/Effective-and-Light-Weight-Deobfuscation-and-Semantic-Aware-Attack-Detection-for-PowerShell-Scripts)'
  answer_sources:
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days, with deobfuscation run on suspicious high-entropy or obfuscated samples.
  queries:
  - technology: ML pipeline pseudocode
    query: "  deob = ast_subtree_emulation(script_block_text)\n  pred = semantic_signature_clf.predict(deob)\
      \  # 31 semantic attack signatures\n  ALERT WHERE pred.category IN malicious_semantic_signatures\n\
      \  OUTPUT recovered_script, matched_signature"
- question: Is there a newly observed remote PowerShell session pair (source host -> destination wsmprovhost.exe)
    that has not appeared in the prior 30-day baseline of admin remoting pairs?
  context: Detect 4104 entries with New-PSSession, Enter-PSSession, Invoke-Command -ComputerName, or WSMan
    usage, plus Sysmon Event ID 3 connections from wsmprovhost.exe on TCP/5985 or 5986. Pair each remote
    start with the originating client (4688 powershell.exe with -ComputerName) and the destination server-side
    wsmprovhost.exe spawn, and alert when the (source,destination) tuple is absent from the 30-day baseline
    built from 4624 logon type 3 with WinRM logon process. Suppress sources on an approved jump-server
    allowlist. For Execution, newly observed remoting pairs can indicate lateral movement or operator
    access.
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points'
  range: Last 90 days, with a rolling 30-day baseline of admin remoting pairs.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  remote = FILTER Event4104 BY [New-PSSession,Enter-PSSession,Invoke-Command -ComputerName,\
      \ WSMan]\n  srv    = FILTER Sysmon3 BY proc=wsmprovhost.exe AND resp_port IN [5985,5986]\n  pair\
      \   = JOIN client(4688 -ComputerName) WITH srv ON session\n  base   = baseline_30d(4624 type3 WinRM\
      \ pairs)\n  ALERT WHERE (src_host,dst_host) NOT IN base AND src_host NOT IN jump_server_allowlist"
- question: Do domains used in PowerShell download cradles score as risky based on age, threat-intel,
    first-seen status, TLD weight, and Punycode/subdomain depth, with correlated outbound traffic?
  context: 'For each 4104 block containing a cradle (Net.WebClient.DownloadString, Invoke-WebRequest,
    Invoke-RestMethod, Start-BitsTransfer), extract the destination FQDN/URI and compute a risk score:
    domain age <30 days (+3), TI feed match (+5), Zeek dns.log first-seen on host in 24h (+2), risky TLD
    .xyz/.top/.ru (+1), Punycode or excessive subdomain depth (+1). Alert when total >=4 and correlate
    Zeek conn.log from the same host within 60 seconds for that destination, outputting the cradle line,
    score breakdown, and Zeek UID(s). For Execution, deterministic scoring with suppression separates
    benign software sources from likely staging/C2.'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points'
  range: Last 90 days, with emphasis on the cradle execution window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  cradle = EXTRACT_DOMAIN(Event4104 WHERE cradle_pattern)\n  score  = age<30(+3) + ti_match(+5)\
      \ + dns_first_seen_24h(+2) + risky_tld(+1) + punycode_or_deep(+1)\n  conn   = FILTER Zeek_conn BY\
      \ host AND dest=cradle.domain WITHIN 60s\n  ALERT WHERE score >= 4 AND conn.exists OUTPUT cradle_line,\
      \ score_breakdown, zeek_uid"
- question: Did an inbound WinRM connection (Zeek resp_p 5985/5986, 4624 logon type 3 WinRM) originate
    from an external, non-administrative, or threat-intel-flagged source IP?
  context: Correlate inbound WinRM connections in Zeek conn.log (resp_p 5985/5986) and 4624 logon type
    3 with WsmanShell logon process against threat intelligence and an allowlist of known admin subnets
    (jump hosts, PAM gateways). Alert when the source IP is external, in a non-administrative VLAN, on
    a TI blocklist, or geolocates outside approved admin regions. Include the destination wsmprovhost.exe
    child processes, executed cmdlets from 4103 module logs, and the calling user's group memberships
    (4672). For Execution, hostile-source remoting is a strong lateral-movement and operator-access signal.
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points'
  range: Last 90 days, with correlation on the current remote-session start.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  winrm = JOIN Zeek_conn[resp_p IN 5985,5986] WITH Event4624[type3, WsmanShell]\n  ALERT WHERE\
      \ src_ip EXTERNAL OR src_ip IN non_admin_vlan OR src_ip IN ti_blocklist\n        OR geo(src_ip)\
      \ NOT IN approved_admin_regions\n  OUTPUT wsmprovhost_children, cmdlets(4103), user_groups(4672)"
- question: Is PowerShell using suspicious .NET reflection classes or P/Invoke APIs frequently abused
    by offensive tooling (Assembly::Load, Marshal::Copy/GetDelegate, VirtualAlloc/VirtualProtect, CreateRemoteThread,
    AmsiUtils)?
  context: 'Reflective .NET use reveals in-memory execution or stealthy runtime manipulation even when
    the broader script is lightly obfuscated. Alert on 4104 blocks containing System.Reflection.Assembly::Load,
    [Marshal]::Copy, [Marshal]::GetDelegateForFunctionPointer, VirtualAlloc/VirtualProtect P/Invoke, [Kernel32]::CreateRemoteThread,
    Add-Type -TypeDefinition with kernel32/ntdll DllImport, or AmsiUtils field reflection (SigmaHQ posh_pc_susp_dot_net_methods.yml
    baseline). Increase severity when combined with AMSI-bypass or download-cradle indicators in the same
    block. For Execution, preserve the class names, surrounding code, and any related network activity.
    References: [SigmaHQ Suspicious .NET Methods Rule](https://github.com/SigmaHQ/sigma)'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points'
  range: Last 90 days, focusing on the current script or process tree.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  ALERT FROM Event4104\n  WHERE script_block_text CONTAINS any([\"Reflection.Assembly]::Load\"\
      ,\"Marshal]::Copy\",\n        \"GetDelegateForFunctionPointer\",\"VirtualAlloc\",\"VirtualProtect\"\
      ,\"CreateRemoteThread\",\n        \"DllImport(kernel32/ntdll)\",\"AmsiUtils\"]) AND allowlisted_admin_pattern=false\n\
      \  ESCALATE WHEN same_block has amsi_bypass OR download_cradle"
- question: Does a per-user remote PowerShell connection-rate baseline reveal an hourly session-count
    spike, a change-point in inter-arrival times, or an elevated failure-to-success ratio?
  context: Build a 30-day rolling baseline of per-user remote PowerShell session counts and inter-arrival
    times (4624 logon type 3 with WinRM, plus 4103 from wsmprovhost.exe). Compute z-scores for hourly
    session counts and a change-point statistic (Bayesian online change-point or CUSUM) on inter-arrival
    times, applying minimum-volume guardrails (>=5 baseline sessions) and failure constraints (4625 type
    3 from the same source). Alert when current-hour sessions exceed 3 standard deviations above the user's
    mean, a change-point appears within 60 minutes, or the failure-to-success ratio exceeds 0.3. Output
    baseline horizon, feature deltas, hosts targeted, and a composite risk score. For Execution, this
    catches bursts of operator remoting against a user's own norm.
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points'
  range: Last 90 days, with a rolling 30-day per-user baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  base = baseline_30d_per_user(sessions=4624_type3_WinRM + 4103_wsmprovhost, interarrival)\n\
      \  z    = zscore(current_hour_sessions, base)\n  cp   = changepoint(interarrival)  # CUSUM/BOCPD\n\
      \  ALERT WHERE (z > 3 OR cp_within_60m OR fail_to_success_ratio > 0.3)\n        AND base.sessions\
      \ >= 5\n  OUTPUT horizon, feature_deltas, targets, risk_score"
- question: Does a per-host cradle-domain risk distribution baseline show a host's daily mean risk score,
    cradle count, or proportion of first-seen destinations exceeding normal bounds?
  context: Maintain a per-host distribution of cradle destination risk scores (from the domain-reputation
    rule) over 30 days. Flag hosts whose daily mean risk score exceeds the 95th percentile of their peer
    group or whose daily cradle-invocation count exceeds 3 standard deviations above the host's mean.
    Track the proportion of cradle destinations resolving via Zeek dns.log to first-seen IPs (not in the
    host's 90-day DNS history); a daily proportion above 0.5 is an outlier suggestive of adversary infrastructure
    rotation. For Execution, distribution-level shifts reveal sustained staging activity that single-event
    scoring may miss.
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers, DNS Resolvers, Network Egress Points'
  range: Last 90 days, with a 30-day per-host risk-distribution baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  dist = GROUP cradle_risk_scores BY host, day => mean_score, cradle_count, first_seen_dest_ratio\n\
      \  base = host_baseline(dist, 30d); peer = peer_group(host)\n  ALERT WHERE mean_score > peer.p95\n\
      \        OR cradle_count > base.mean + 3*base.stddev\n        OR first_seen_dest_ratio > 0.5"
