name: 'T1542.002: Pre-OS Boot: Component Firmware'
id: d17b6084-f4c4-4d5b-ba2a-a05103478f75
description: 'This playbook helps an analyst determine whether an adversary has modified component firmware
  (T1542.002) -- the firmware of system components such as SPI flash/BIOS, NIC, storage/HBA controllers,
  GPU, or BMC -- to persist below the operating system and evade host software defenses. Because malicious
  component firmware executes outside the OS and main BIOS, it survives OS re-imaging and disk replacement
  and is largely invisible to host security stacks, making it a hallmark of sophisticated, persistent
  actors. The playbook is organized around two mission questions -- whether the adversary established
  persistence by modifying component firmware (Persistence, TA0003) and whether they are using firmware
  to hide and blend in (Stealth, TA0005) -- and brings together firmware-integrity attestation (TPM PCR
  measurements vs signed golden baselines, CHIPSEC SPI-flash and lock-bit scans, UEFI runtime memory forensics),
  endpoint telemetry (Windows Event IDs 4688/4104/4697/5156/7036/7000/7026/7/11/55/137/1001, Sysmon driver
  loads, auditd ioctl/write syscalls, linux syslog, macOS unified log), and network telemetry (Zeek conn/dns/ssl/files/weird
  logs, PCAP) to surface the full chain of firmware compromise. Investigative angles include: measured-vs-baseline
  firmware mismatches and unsigned firmware writes; SPI write-protection and Secure Boot key tampering;
  runtime UEFI hooking; rare per-model firmware drift; anomalous firmware flashing-utility or raw SPI
  driver (e.g., RwDrv.sys) execution; threat-intel matches to known implant C2 (LoJax/CosmicStrand); covert
  DNS/ICMP C2 (entropy, NXDOMAIN ratios, record-type imbalance, beacon jitter, JA3/JA3S); below-OS egress
  that appears in network flow but not in host WFP (Event ID 5156) telemetry; persistent hardware-fault
  and scanner-crash patterns that survive re-imaging; and security-agent stops immediately preceding firmware
  activity. Detection blends symbolic-logic rules, statistical baselining (percentiles, sigma thresholds,
  entropy, jitter, change-point detection), and machine learning (autoencoders, Isolation Forest, Gradient
  Boosting, DBSCAN, HMM, Prophet/LSTM forecasting) to produce evasion-resistant, explainable alerts.'
