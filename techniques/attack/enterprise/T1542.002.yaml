  - 'NAI: TPM/attestation server PCR logs, CHIPSEC/firmware-scan output, EDR firmware telemetry, asset
    management database of known-good firmware versions per hardware model'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Compare measured firmware to signed golden baseline\n// Tactic:\
      \ Stealth (TA0005) | Technique: T1542.002\nINPUT sources = ['firmware:integrity', 'WinEventLog:Sysmon',\
      \ 'auditd:SYSCALL']\nDEFINE rule = Measure BIOS and component (NIC/storage/GPU/BMC) firmware into\
      \ TPM PCRs and alert on ANY mismatch versus the per-model signed reference value, and alert on firmware\
      \ updates not carrying a valid vendor signature, per [NIST SP 800-155](https://csrc.nist.gov/files/pubs/sp/800/155/ipd/docs/draft-SP800-155_Dec2011.pdf)\
      \ and [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf);\
      \ only authenticated capsule updates are legitimate per [NIST SP 800-147](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-147.pdf).\n\
      FOR each candidate event/measurement:\n  IF rule condition matches (mismatch / unsigned / anomalous-context\
      \ / TI-hit):\n    JOIN host asset + firmware baseline + reimage history\n    RAISE alert WITH host,\
      \ component, firmware_version/hash, process/parent, dest, evidence\n  ELSE pass"
- question: 'Using deterministic rule logic, can you determine whether ''Scan SPI flash and lock bits
    on host'' indicates component-firmware modification (T1542.002) under the Stealth tactic? Specifically:
    Run [CHIPSEC](https://github.com/chipsec/chipsec) on-host to dump SPI flash, verify BIOS write-protect/lock
    bits (BIOSWE/BLE/PRx) and Secure Boot keys, and match against a UEFI implant blacklist; flag disabled
    write-protection or known implant modules (LoJax/CosmicStrand artifacts) as documented in [SoK: Security
    Below the OS](https://arxiv.org/abs/2311.03809).'
