questions:
- question: 'Using deterministic rule logic, can you determine whether ''Compare measured firmware to
    signed golden baseline'' indicates component-firmware modification (T1542.002) under the Stealth tactic?
    Specifically: Measure BIOS and component (NIC/storage/GPU/BMC) firmware into TPM PCRs and alert on
    ANY mismatch versus the per-model signed reference value, and alert on firmware updates not carrying
    a valid vendor signature, per [NIST SP 800-155](https://csrc.nist.gov/files/pubs/sp/800/155/ipd/docs/draft-SP800-155_Dec2011.pdf)
    and [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf);
    only authenticated capsule updates are legitimate per [NIST SP 800-147](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-147.pdf).'
  context: 'Tactic context (Stealth / TA0005): The adversary is trying to hide and conceal their actions,
    appearing as normal behavior. Mission question: Has the adversary established persistence by modifying
    component firmware? Evidence under investigation: A firmware integrity verification failure or a mismatch
    between measured BIOS/component-firmware hashes (e.g., SPI flash, NIC/HBA/GPU/BMC controller firmware)
    and the signed golden baseline, or an unsigned/unauthenticated firmware write. This is the strongest,
    lowest-OS evidence of component-firmware modification and persists across OS re-imaging. Approach
    (Compare measured firmware to signed golden baseline): Measure BIOS and component (NIC/storage/GPU/BMC)
    firmware into TPM PCRs and alert on ANY mismatch versus the per-model signed reference value, and
    alert on firmware updates not carrying a valid vendor signature, per [NIST SP 800-155](https://csrc.nist.gov/files/pubs/sp/800/155/ipd/docs/draft-SP800-155_Dec2011.pdf)
    and [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf);
    only authenticated capsule updates are legitimate per [NIST SP 800-147](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-147.pdf).
    A positive result means component firmware on the host has been altered or is being abused for below-OS
    persistence/C2 -- behavior inconsistent with authenticated vendor firmware updates and normal hardware
    operation -- while a negative result means the observed firmware state, host telemetry, and traffic
    match the established golden/peer baseline. Investigate the named area of interest (TPM/attestation
    server PCR logs, CHIPSEC/firmware-scan output, EDR firmware telemetry, asset management database of
    known-good firmware versions per hardware model) and pivot from any hit to the affected hardware component,
    host, firmware version/hash, responsible process or service, and any subsequent egress, correlating
    against re-imaging history to confirm persistence below the OS.'
