- question: When write->execute event sequences are modeled with an HMM or LSTM and combined with a static
    content score (PE structure/entropy) on the written file, which sequences have very low probability,
    indicating a novel masquerading chain, and which steps/features contributed most?
  context: Sequence models learn the normal ordering of file-write and execution events, so a very-low-probability
    sequence reveals novel masquerading chains that rule-based correlation misses. Combining the sequence
    anomaly with a static content score on the written file (PE structure/entropy) reduces false positives.
    For TA0005 Stealth, an improbable write-then-execute chain involving a high-entropy/PE-structured
    disguised file is a strong candidate. Low-probability sequences with malicious content scores are
    actionable.
