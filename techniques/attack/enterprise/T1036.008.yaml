questions:
- question: Do any files written to disk (Sysmon Event ID 11, Windows Event ID 4663) or transferred over
    the network (Zeek files.log) exactly match a known-malicious MD5/SHA256 from threat intelligence WHILE
    carrying a non-executable file extension such as .txt, .jpg, .jpeg, .png, .gif, .pdf, .log, or .dat?
  context: 'This is the highest-confidence indicator of masquerading: a file whose cryptographic hash
    is already attributed to malware should never legitimately appear with a benign image/text/document
    extension. Tying TA0005 Stealth, the adversary disguises a known payload to slip past file-type validation
    when transferring (Ingress Tool Transfer) or staging it. Zeek''s file-analysis framework emits both
    the content-sniffed mime_type and the hash on the wire, so the join requires no extra lookup. A positive
    result (hash match AND non-exec extension) is an immediate escalation; a hash match with a normal
    executable extension is still worth review but is a weaker masquerade signal.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: Network egress points (e.g., proxies, firewalls), User workstations, Critical file servers,
    Email gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (source=\"Sysmon:EventID=11\" OR source=\"WinEventLog:4663\" OR source=\"zeek:files.log\"\
      )\n  | eval ext=lower(extract_extension(file_name))\n  | where (md5 IN threat_intel_md5 OR sha256\
      \ IN threat_intel_sha256)\n    AND ext IN (\"txt\",\"jpg\",\"jpeg\",\"png\",\"gif\",\"pdf\",\"log\"\
      ,\"dat\")\n  | table _time host file_name ext md5 sha256 src_ip"
  - technology: Zeek/pseudocode
    query: ">-\n  event file_hash(f: fa_file, kind: string, hash: string) {\n    if ( hash in known_bad_hashes\
      \ && nonexec_ext(f$info$filename) )\n      NOTICE([$note=Masquerade::Hash_With_NonExec_Ext, $msg=f$info$filename]);\n\
      \  }"
- question: Are there files with disguising non-executable extensions whose fuzzy hash (ssdeep) or import
    hash is highly similar (>=70%) to samples in a known-bad malware corpus, even when no exact hash match
    exists?
  context: Adversaries frequently recompile or repack payloads so the exact hash changes, defeating simple
    IOC matching. Fuzzy and import-hash similarity catches these variants by measuring structural resemblance
    to known malware while distinguishing from a known-good baseline. For TA0005 Stealth this exposes
    a disguised payload that is a near-twin of known malware. A >=70% similarity to a malicious sample
    combined with a benign extension is strong evidence of masquerading; high similarity to a known-good
    file lowers concern.
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: Network egress points (e.g., proxies, firewalls), User workstations, Critical file servers,
    Email gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for each file in (nonexec_ext files last 90d):\n    sim_bad = max(ssdeep_compare(file.ssdeep,\
      \ corpus_bad))\n    sim_good = max(ssdeep_compare(file.ssdeep, corpus_good))\n    if sim_bad >=\
      \ 70 and sim_bad > sim_good: alert(file, sim_bad)"
- question: For each file hash (or fuzzy-hash cluster), does the currently observed extension fall in
    the rare tail (bottom 5th percentile) of the historical extension distribution for that file, as measured
    by a robust modified Z-score?
  context: The same byte content normally appears with a consistent extension. When a hash that has historically
    been a .dll or .exe suddenly appears as .jpg, that anomaly is a masquerade signal. Using a modified
    Z-score (median absolute deviation) makes the baseline resistant to large batch jobs that would skew
    a mean. For TA0005 Stealth, a rare extension-for-this-content event indicates deliberate disguise.
    A bottom-5th-percentile occurrence warrants investigation; a common pairing is benign.
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: Network egress points (e.g., proxies, firewalls), User workstations, Critical file servers,
    Email gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  | stats count by file_hash, ext\n  | eventstats median(count) as med, mad(count) as\
      \ mad by file_hash\n  | eval mzscore = 0.6745*(count-med)/mad\n  | where percentile_rank(count)\
      \ <= 5 OR mzscore <= -3.5\n  | table file_hash ext count mzscore"
- question: Are there repeated blocked, truncated, or partial (HTTP 206) transfers of the same hash-matched
    non-executable file, indicated by Zeek volume signals (total_bytes/seen_bytes) and state signals (missing_bytes>0,
    proxy-blocked)?
  context: Adversaries often retry delivery of a disguised payload after a proxy or control blocks or
    truncates it. Profiling per-file volume and transfer-state signals reveals a distinct retry pattern
    that a single successful transfer would not show. For TA0005 Stealth this exposes persistent attempts
    to smuggle the same masqueraded payload past egress controls. Repeated blocked/truncated transfers
    of one disguised file is a strong signal; a single clean transfer is not.
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: Network egress points (e.g., proxies, firewalls), User workstations, Critical file servers,
    Email gateways'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  files.log\n  | where nonexec_ext(filename) AND (missing_bytes>0 OR total_bytes!=seen_bytes\
      \ OR state==\"blocked\")\n  | stats count as attempts, dc(state) by sha256, filename, tx_hosts\n\
      \  | where attempts >= 3"
- question: When a gradient-boosted classifier scores disguised file transfers using hash reputation,
    declared extension, content-sniffed MIME, byte/section entropy, and source process and source-IP reputation,
    which files are flagged as likely masquerades, and what top-3 SHAP-ranked features drove each verdict?
  context: A supervised classifier (XGBoost/Random Forest) combines many weak signals into a robust verdict
    that static PE/entropy features push toward ~98% accuracy on unseen samples. Surfacing the top-3 SHAP
    features (e.g., entropy=7.4, mime=x-dosexec, ext=.jpg) makes each alert explainable and triage-ready.
    For TA0005 Stealth, the model prioritizes the most suspicious disguised files among high transfer
    volumes. A high-confidence flag with intuitive contributing features is actionable; low scores deprioritize
    benign files.
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: Network egress points (e.g., proxies, firewalls), User workstations, Critical file servers,
    Email gateways'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = [hash_reputation, declared_ext, sniffed_mime, byte_entropy, section_entropy, src_proc_rep,\
      \ src_ip_rep]\n  score = xgboost_model.predict_proba(X)[malicious]\n  if score >= 0.8: alert(file,\
      \ top3=shap_explain(X))"
- question: Do any network-transferred files (Zeek files.log) have a content-sniffed mime_type (e.g.,
    application/x-dosexec, application/x-elf, application/zip) that directly contradicts the filename
    extension (e.g., .txt, .jpg, .gif, .pdf)?
  context: The MIME type Zeek derives from magic bytes is independent of the filename, making extension-vs-MIME
    mismatch the deterministic core of file-type validation. A .jpg that sniffs as application/x-dosexec
    is, by definition, masqueraded. For TA0005 Stealth this catches the adversary's core trick of relabeling
    executable content as benign. Any contradiction is a strong positive; matching extension and MIME
    is benign.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress points (e.g., proxies, firewalls), Internal network segments, Web servers, Mail
    servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  files.log\n  | eval ext=lower(extract_extension(filename))\n  | where ext IN (\"txt\"\
      ,\"jpg\",\"jpeg\",\"gif\",\"pdf\",\"png\")\n    AND mime_type IN (\"application/x-dosexec\",\"application/x-elf\"\
      ,\"application/zip\",\"application/java-archive\")\n  | table ts filename ext mime_type tx_hosts\
      \ rx_hosts"
- question: Are there files that simultaneously satisfy two or more file-format grammars (polyglots) -
    for example a valid GIF/JPEG header together with a valid PE/ZIP/JAR central directory or a trailing
    PE?
  context: Polyglot files are valid in multiple formats at once and behave differently depending on the
    application that opens them, routinely defeating single magic-byte or extension checks. Parsing for
    co-present format structures and alerting on any file matching >=2 grammars exposes this. For TA0005
    Stealth, a polyglot lets an adversary present a benign image to a viewer while delivering executable/archive
    content to another handler. Two or more matched grammars is a strong masquerade signal; a single grammar
    is normal.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress points (e.g., proxies, firewalls), Internal network segments, Web servers, Mail
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  for file in transferred_files:\n    grammars = [g for g in (GIF,JPEG,PNG,PDF,PE,ZIP,JAR)\
      \ if matches_grammar(file, g)]\n    if len(grammars) >= 2: alert(file, grammars)"
- question: Which (extension, mime_type) pairings observed on the network fall below the 1st percentile
    of their historical conditional probability for this environment, or have never been seen before,
    as scored by a robust modified Z-score?
  context: Even without a hard contradiction, statistically rare extension/MIME combinations signal novel
    masquerading. Baselining the conditional probability of each pairing per environment and flagging
    never-before-seen or bottom-1st-percentile pairs catches disguises that fixed rules miss. The modified
    Z-score keeps the baseline robust to noisy bursts. For TA0005 Stealth, a brand-new odd pairing is
    suspicious. Rare/unseen pairings warrant review; common pairings are benign.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress points (e.g., proxies, firewalls), Internal network segments, Web servers, Mail
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  | stats count by ext, mime_type\n  | eventstats sum(count) as tot by ext\n  | eval p\
      \ = count/tot\n  | where p <= percentile01(p) OR isnull(prior_seen(ext,mime_type))\n  | table ext\
      \ mime_type count p"
- question: For files claiming a non-executable type, does the body's Shannon entropy or 1-gram byte-frequency
    'fileprint' deviate from the expected model for that type (e.g., a claimed .jpg with body entropy
    >7.0 or a high Mahalanobis distance from the JPEG byte model)?
  context: Each file type has a characteristic byte distribution; packed or encrypted executables show
    high entropy (~>7.0) and byte frequencies unlike a real image. Computing Shannon entropy and a PAYL-style
    byte-frequency model, then measuring Mahalanobis distance from the expected type model, detects content
    that doesn't match its claimed format. For TA0005 Stealth this catches packed payloads hidden behind
    benign extensions. High entropy or large model deviation for a supposedly low-entropy type is a positive;
    a normal byte profile is benign.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress points (e.g., proxies, firewalls), Internal network segments, Web servers, Mail
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for file in nonexec_ext_files:\n    H = shannon_entropy(file.body)\n    d = mahalanobis(byte_freq(file.body),\
      \ model[file.ext])\n    if (file.ext in low_entropy_types and H > 7.0) or d > threshold: alert(file,\
      \ H, d)"
- question: When transfer feature vectors (size/total_bytes, body entropy, filename entropy, extension,
    MIME, source-IP reputation, missing_bytes) are clustered with an Extended Isolation Forest, which
    file transfers are flagged as outliers and what top-3 features explain each anomaly?
  context: Unsupervised anomaly detection finds masquerading transfers that don't match any known pattern
    without needing labeled malware. Extended Isolation Forest isolates outliers across many transfer
    features and the top contributing features explain each one. For TA0005 Stealth, an outlier transfer
    (e.g., high-entropy body, odd MIME, low-reputation source) is a candidate disguise. Strong outliers
    with intuitive explanations are actionable; in-distribution transfers are deprioritized.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress points (e.g., proxies, firewalls), Internal network segments, Web servers, Mail
    servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = [size, body_entropy, fname_entropy, ext_id, mime_id, src_ip_rep, missing_bytes]\n\
      \  scores = ExtendedIsolationForest().fit(X).anomaly_score(X)\n  for f where scores high: alert(f,\
      \ top3=feature_contributions(f))"
- question: When reassembled file bytes are scored by a polyglot-detection model and a raw-byte executable-content
    CNN (MalConv), which files are classified as polyglots or executable content despite a benign extension,
    and which byte sub-regions or header fields drove the verdict?
  context: Deep byte-content classifiers detect disguised executables and polyglots directly from raw
    bytes, catching cases that header/extension heuristics miss. MalConv flags executable content; activation
    analysis reveals which byte regions/header fields drove the decision, aiding triage. For TA0005 Stealth,
    a file that classifies as executable or polyglot while wearing a .jpg/.txt extension is a masquerade.
    A high malicious/polyglot probability with clear contributing regions is a strong positive.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress points (e.g., proxies, firewalls), Internal network segments, Web servers, Mail
    servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  p_poly = polyglot_model.predict(file.bytes)\n  p_exec = malconv.predict(file.bytes)\n\
      \  if (p_poly>0.5 or p_exec>0.5) and nonexec_ext(file): \n    alert(file, regions=activation_attribution(file.bytes))"
- question: Are interpreter or loader processes (rundll32.exe, mshta.exe, wscript.exe, cscript.exe, regsvr32.exe,
    powershell.exe; or bash/sh/python on Linux) being invoked with command-line arguments that point to
    files with non-executable extensions such as .txt, .jpg, .dat, .log, or .png?
  context: Legitimate use of these loaders rarely references image/text/log files; when rundll32 or mshta
    runs a .jpg, the extension is almost certainly hiding executable or script content. On Linux, a media/document-extension
    file passed to an interpreter or carrying an ELF magic-byte header is the equivalent signal. For TA0005
    Stealth this catches the moment a disguised payload is actually executed. An interpreter referencing
    a non-exec extension is a strong positive; normal .dll/.js arguments are benign.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (source=\"WinEventLog:4688\" OR source=\"Sysmon:EventID=1\")\n  | where lower(process_name)\
      \ IN (\"rundll32.exe\",\"mshta.exe\",\"wscript.exe\",\"cscript.exe\",\"regsvr32.exe\",\"powershell.exe\"\
      )\n    AND match(command_line, \"\\.(txt|jpg|jpeg|dat|log|png|gif)([\\\"\\s,]|$)\")\n  | table _time\
      \ host user process_name command_line parent_image"
  - technology: auditd/pseudocode
    query: ">-\n  type=SYSCALL,execve\n  | where exe IN (\"/bin/bash\",\"/bin/sh\",\"/usr/bin/python3\"\
      )\n    AND arg matches \"\\.(jpg|png|txt|dat|log)$\"\n  | OR file_magic(arg)==ELF AND ext(arg) in\
      \ media_doc_exts"
- question: For each interpreter, which command-line argument extensions fall below the 5th percentile
    of that interpreter's historical extension distribution, as scored by a robust modified Z-score?
  context: Each loader has a normal repertoire of argument extensions (rundll32 -> .dll, wscript -> .js/.vbs).
    An argument extension in the rare tail signals possible masquerading. Per-interpreter baselines with
    a modified Z-score keep scheduled batch activity from inflating the threshold. For TA0005 Stealth,
    a rarely-seen extension passed to an interpreter is suspicious. Bottom-5th-percentile extensions warrant
    review; common ones are benign.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  | stats count by process_name, arg_ext\n  | eventstats median(count) as med, mad(count)\
      \ as mad by process_name\n  | eval mz=0.6745*(count-med)/mad\n  | where percentile_rank(count) <=\
      \ 5 OR mz <= -3.5"
- question: Is there a burst of interpreter-with-odd-extension executions per host per minute, accompanied
    by process exit/error or failed-load codes (e.g., 0xC000 errors) indicating repeated failed attempts
    to load disguised files?
  context: A single successful execution and a flurry of failures look very different; a burst of failed
    rundll32 loads of .jpg files is a distinct retry signal as the adversary tunes a disguised payload.
    Tracking frequency (executions per host per minute) and state (exit/error codes) separates this from
    benign one-off activity. For TA0005 Stealth, repeated failed loads of odd-extension files indicate
    active masquerade troubleshooting. High-rate failures are a strong positive.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  | where interpreter_with_odd_ext\n  | bin _time span=1m\n  | stats count as execs, sum(eval(exit_code!=0))\
      \ as failures by host, _bin\n  | where execs >= 5 OR failures >= 3"
- question: For each file referenced on an interpreter command line, do its magic bytes/MIME and entropy
    contradict its declared extension (e.g., a .jpg argument whose header is MZ/ELF or whose entropy is
    >7.0)?
  context: Verifying the actual content of the argument file confirms whether the interpreter is executing
    disguised code. A .jpg argument whose header is MZ (PE) or ELF, or whose body entropy is ~>7.0 (packed),
    confirms masquerade rather than benign use. For TA0005 Stealth this turns a suspicious invocation
    into a high-confidence finding. Header/entropy contradicting the extension is a positive; matching
    content is benign.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for evt in interpreter_executions:\n    hdr = read_magic(evt.arg_file); H = entropy(evt.arg_file)\n\
      \    if (hdr in (MZ,ELF) or H > 7.0) and ext(evt.arg_file) in nonexec_exts:\n      alert(evt, hdr,\
      \ H)"
- question: When interpreter executions are scored by a classifier over process name/path, argument extension,
    argument file content features (entropy, MIME, PE-structure validity), user context, and integrity
    level, which executions are flagged as masquerades and what are the top-3 contributing features?
  context: A supervised model combines process metadata with content features so static structural signals
    robustly separate disguised executables from benign interpreter use. Surfacing the top-3 features
    makes each alert explainable. For TA0005 Stealth, the model elevates the most suspicious interpreter-against-disguised-file
    events. A high-confidence flag with sensible features is actionable; low scores deprioritize routine
    activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = [proc_name, proc_path, arg_ext, arg_entropy, arg_mime, pe_valid, user_ctx, integrity]\n\
      \  score = clf.predict_proba(X)[malicious]\n  if score >= 0.8: alert(evt, top3=shap_explain(X))"
- question: Are document or media handler processes (AcroRd32.exe, winword.exe, excel.exe, mspaint.exe,
    notepad.exe, Preview, gimp) spawning interpreter or shell child processes such as powershell.exe,
    cmd.exe, wscript.exe, cscript.exe, bash, or python?
  context: Document and image viewers should not normally launch command shells or scripting interpreters;
    such lineage is the classic signature of a malicious payload disguised as a document/image that executes
    on open. For TA0005 Stealth this exposes a masqueraded file detonating after a user opens it. A document-handler
    parent with a shell/interpreter child is a strong positive; ordinary helper children are benign.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (source=\"WinEventLog:4688\" OR source=\"Sysmon:EventID=1\")\n  | where lower(parent_image)\
      \ IN (\"acrord32.exe\",\"winword.exe\",\"excel.exe\",\"mspaint.exe\",\"notepad.exe\")\n    AND lower(process_name)\
      \ IN (\"powershell.exe\",\"cmd.exe\",\"wscript.exe\",\"cscript.exe\")\n  | table _time host user\
      \ parent_image process_name command_line"
- question: Which parent-child process pairs observed over the last 90 days occur below a robust rarity
    threshold (e.g., fewer than 10 occurrences or bottom 1st percentile via modified Z-score), indicating
    an anomalous lineage involving document/media handlers?
  context: Graphing all parent-child pairs and flagging the rarest exposes novel anomalous lineages even
    when the specific binaries aren't on a hard-coded list. A modified Z-score keeps the rarity threshold
    robust. For TA0005 Stealth, a never-before-seen handler-spawns-interpreter pair is a candidate masquerade
    detonation. Bottom-percentile pairs warrant investigation; common pairs are benign.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  | stats count by parent_image, process_name\n  | eventstats median(count) as med, mad(count)\
      \ as mad\n  | eval mz=0.6745*(count-med)/mad\n  | where count < 10 OR mz <= -3.5\n  | table parent_image\
      \ process_name count mz"
- question: Is there a pattern of repeated short-lived or failed shell/interpreter children launched from
    a document handler, evidenced by child exit codes, AMSI/script-block errors, and high spawn counts
    per parent per minute?
  context: A single benign spawn differs sharply from repeated short-lived failed shells, which suggest
    a disguised payload retrying or being tuned. Profiling state (child exit codes, AMSI/script-block
    errors) and frequency (spawns per parent per minute) isolates this retry behavior. For TA0005 Stealth,
    bursts of failed shells from a document handler indicate active malicious execution. High-rate or
    error-laden spawns are a strong positive.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  | where parent_image in doc_handlers AND child in shells_interps\n  | bin _time span=1m\n\
      \  | stats count as spawns, sum(eval(exit_code!=0 OR amsi_error)) as fails by parent_image, host,\
      \ _bin\n  | where spawns >= 3 OR fails >= 2"
- question: When new parent-child process events are scored by a classifier trained on process names,
    paths, command lines, user context, and integrity levels, which chains are flagged as anomalous and
    what top-3 SHAP/LIME features (e.g., parent=AcroRd32.exe, child=powershell.exe, integrity=Medium)
    explain each?
  context: A supervised model captures subtle combinations of process lineage and context that simple
    rules miss, while SHAP/LIME explanations make alerts triage-ready. For TA0005 Stealth, the model elevates
    the most suspicious handler-to-interpreter chains. A high-confidence flag with intuitive contributing
    features is actionable; benign chains score low.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
