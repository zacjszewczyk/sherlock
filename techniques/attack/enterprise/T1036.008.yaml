- question: Are browsers or email clients (chrome.exe, msedge.exe, outlook.exe) creating files with non-executable
    extensions in staging or persistence directories (%APPDATA%, %PUBLIC%, C:\Users\Public\Downloads,
    Startup folders) that are then referenced by an interpreter argument or executed within about 5 minutes?
  context: The write-then-execute chain - a benign-looking file dropped by a browser/mail client into
    a staging or persistence location and quickly run by an interpreter - is a hallmark of masquerading-enabled
    delivery and persistence. Correlating the creation event with a near-term interpreter reference exposes
    the full kill chain. For TA0005 Stealth this links the disguise to its execution. A drop-then-run
    within 5 minutes is a strong positive; a write with no execution is weaker.
