name: 'T1036.008: Masquerading: Masquerade File Type'
id: b0d8c17b-87d8-4184-8572-544fc7f4d547
description: Investigate whether an adversary is masquerading malicious payloads as legitimate, typically
  benign file types by altering a file's signature (magic bytes), extension, icon, or internal contents
  to bypass file-validation and input-sanitization controls. This playbook helps an analyst hunt for files
  written to disk or transferred over the network whose declared extension is inconsistent with their
  content-sniffed MIME type or magic bytes (e.g., a .jpg that is actually a PE/ELF/ZIP), files matching
  known-bad hashes or fuzzy-hash clusters while wearing a non-executable extension, polyglot files that
  satisfy multiple format grammars at once, and interpreter/loader processes (rundll32.exe, mshta.exe,
  wscript.exe, regsvr32.exe, bash, python) invoked against files with media or document extensions. It
  also covers anomalous parent-child process lineage (document/media handlers spawning shells or interpreters)
  and write-then-execute chains where browsers or mail clients drop disguised files into staging or persistence
  directories that are then executed shortly afterward. Detection approaches span deterministic symbolic
  logic, statistical baselining (extension rarity, conditional-probability and chi-squared anomalies,
  entropy and byte-frequency typing), and machine-learning classifiers and sequence models, giving the
  analyst layered, defensible coverage across Windows, Linux, macOS endpoint logs and network telemetry.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
