name: 'T1027: Obfuscated Files or Information'
id: b7d96311-5177-4a8f-a88f-0d9d44224620
description: Investigate whether an adversary is attempting to evade defenses by encrypting, encoding,
  compressing, archiving, or otherwise obfuscating executables, scripts, files, or information on the
  host and in transit. This playbook helps an analyst hunt for packer signatures and high-entropy payloads,
  obfuscated command lines (e.g., PowerShell -EncodedCommand, cmd.exe caret/percent escaping, and string
  concatenation), download-then-deobfuscate chains using utilities such as certutil.exe -decode, expand.exe,
  base64, and openssl, anomalous Shannon entropy and poor compressibility in files and command arguments,
  and file extension/MIME mismatches that indicate masquerading. It combines deterministic symbolic-logic
  detections, statistical baselining and prevalence analysis, and machine-learning classifiers and anomaly
  detection across endpoint (Windows Event ID 4688, Sysmon, auditd), network (Zeek, PCAP/IDS), macOS,
  and ESXi telemetry to surface obfuscation across Windows, Linux, macOS, Network Devices, and ESXi platforms,
  answering whether the adversary is hiding their files or information to slip past defensive controls.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any files transferred over the network or written by processes match known packer or obfuscated-malware
    hashes, or exhibit PE entropy above the packed/encrypted thresholds even when the hash is unknown?
  context: Adversaries pack and obfuscate payloads (UPX, MPRESS, custom crypters) to defeat signature-based
    detection and analysis, which is core to the Stealth tactic of blending in and avoiding scrutiny.
    Collect Sysmon Event ID 1 process-creation hashes and Zeek files.log transfer hashes, normalize them,
    and compare against a curated packer/obfuscation hash list and YARA packer rules (e.g., the Neo23x0
    signature-base). Because attackers constantly recompile, also deterministically flag any PE whose
    overall or per-section Shannon entropy exceeds 7.2 (encrypted) or 6.7 (packed) per Lyda and Hamrock,
    so the hard threshold catches novel samples with unknown hashes. A positive hit annotated with host,
    file size, computed entropy, and the relevant NAI is a strong lead; a clean, low-entropy, known-good
    file is a negative result.
  answer_sources:
  - Zeek files.log
  - Sysmon Event ID 1
  - 'NAI: Internet gateways, Email servers, User endpoints, File servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      events = (Sysmon EventID=1) OR (Zeek files.log)
      normalize file_hash
      flag = file_hash in packer_hash_list
            OR yara_match(file, neo23x0_packer_rules)
            OR (is_PE AND (entropy_overall > 7.2 OR section_entropy > 6.7))
      where flag -> alert(host, file_name, file_size, entropy, nai)
- question: Is a host or NAI showing an abnormal surge in packer magic-number frequency, or multiple distinct
    packer fingerprints appearing within a short window compared to its 90-day baseline?
  context: Even when individual packed files look benign, a statistically unusual rate of packer artifacts
    signals staging or a campaign, supporting the Stealth question of whether obfuscation is being used
    to evade defenses. From Zeek files.log extract magic numbers per transfer and maintain a rolling 90-day
    distribution per host/NAI; alert when a host/NAI exceeds its 95th-percentile packer-signature frequency
    or when several distinct packer fingerprints appear in a short window. Track Volume (total packed
    bytes/day) and Frequency (packed-file count/hour), and apply fleet-wide prevalence so artifacts seen
    on few hosts are scored rare per the Microsoft Office 365 frequency-analysis method. Also profile
    YARA near-misses and packer-flag-without-known-hash as a distinct anomaly. A spike above baseline
    is suspicious; steady, fleet-common packer use (e.g., legitimate installers) is likely benign.
  answer_sources:
  - Zeek files.log
  - Sysmon Event ID 1
  - 'NAI: Internet gateways, Email servers, User endpoints, File servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      from Zeek files.log extract magic_number per transfer
      baseline = rolling_90d_distribution(packer_sig_freq) by host, nai
      vol = sum(packed_bytes) by host, day ; freq = count(packed_files) by host, hour
      prevalence = fleet_count(artifact) / total_hosts
      alert if packer_sig_freq > p95(baseline)
            OR distinct_packer_fingerprints_in_window >= 2
            OR prevalence < rare_threshold OR yara_near_miss
- question: Can we forecast packer-alert surges that indicate a concentrated campaign, and isolate individual
    rare packed files by their static PE features?
  context: Modeling the time series of packer activity surfaces concentrated campaigns the moment counts
    break out of expected bounds, while unsupervised outlier detection catches the single odd packed file
    - both directly serve the Stealth goal of unmasking concealed payloads. Train an ARIMA/SARIMA model
    on aggregated packer-flagged counts from Zeek files.log and Windows Event ID 4688 and compare the
    current interval to the forecast confidence interval. In parallel run an Isolation Forest on static
    PE/file features (section entropy, file size, import count) per Liu, Ting and Zhou, plus an entropy-driven
    gradient-boosted classifier per the XGBoost/RF zero-day study. Alert text must list the top-3 contributing
    features (entropy, file size, rare-section name) via SHAP-style attribution as in the CNN-GRU XAI
    model so analysts can triage. Points outside the confidence band or high anomaly scores warrant investigation;
    in-band, low-score files are negatives.
  answer_sources:
  - Zeek files.log
  - Sysmon Event ID 1
  - 'NAI: Internet gateways, Email servers, User endpoints, File servers'
  range: Last 90 days; retrain forecast weekly and evaluate per hour/day interval
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      ts = hourly_count(packer_flagged_events) from files.log + EventID 4688
      model = SARIMA.fit(ts) ; forecast, ci = model.predict(next_interval)
      alert if observed > ci.upper
      feat = [section_entropy, file_size, import_count, rare_section]
      iso = IsolationForest.fit(feat) ; gbm = XGBoost.fit(entropy_features)
      score = iso.decision(feat) ; p = gbm.predict_proba(feat)
      alert if anomaly(score) OR p > threshold with top3 SHAP features
- question: Are any processes launched with command lines containing obfuscation patterns such as PowerShell
    -enc/-EncodedCommand flags, heavy cmd.exe caret or percent escaping, char-array casting, or string
    concatenation?
  context: Command obfuscation (T1027.010) lets adversaries hide their actual commands from signature
    engines and application control, squarely a Stealth behavior. Scan Windows Event ID 4688 and Sysmon
    Event ID 1 CommandLine fields with the SigmaHQ encoded-PowerShell rule for -enc/-EncodedCommand and
    their abbreviations, plus regexes for heavy cmd.exe caret/percent escaping, char-array casting, and
    string concatenation; apply the Neo23x0 gen_powershell_obfuscation YARA to captured script blocks.
    Alerts carry user/host context tied to the NAIs and remain deterministic regardless of any model output.
    A match on a sensitive host (e.g., a domain controller) is high-priority; legitimate admin tooling
    may produce occasional encoded commands and should be allowlisted after review.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, User endpoints, Application servers, Web servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "events = (EventID=4688) OR (Sysmon EventID=1)\ncl = lower(CommandLine)\nmatch = regex(cl,\
      \ '-enc|-encodedcommand|-e[ ]') \n      OR caret_percent_escape_ratio(cl) > k\n      OR char_array_cast(cl)\
      \ OR concat_obfuscation(cl)\n      OR yara_match(scriptblock, gen_powershell_obfuscation)\nwhere\
      \ match -> alert(user, host, parent, cl, nai)"
- question: Does a command line's entropy, KL-divergence from a normal character distribution, or cosine
    similarity to a normal PowerShell profile indicate encoded or obfuscated content relative to the 30-day
    baseline for that process?
  context: Encoded strings shift the character distribution of a command line, and KL-divergence isolates
    them better than raw entropy per Downing - a powerful statistical lens for the Stealth tactic. Compute
    Shannon entropy and Kullback-Leibler divergence of each command line against a baseline English/normal-command
    character distribution, grouped by process name with a 30-day mean/stdev; flag command lines exceeding
    mean+3 stdev or whose cosine similarity to the normal PowerShell character profile drops below baseline
    per Holmes and Bohannon and Holmes. Track Frequency (obfuscated-command count/min per host) and the
    failure signal of malformed/decode-error invocations. A command line that is statistically distant
    from its process's norm is suspicious; routine commands close to baseline are negatives.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, User endpoints, Application servers, Web servers'
  range: Last 90 days; baseline window 30 days per process name
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for each cmd in (EventID 4688, Sysmon 1):
        H = shannon_entropy(cmd) ; KL = kl_div(charfreq(cmd), normal_charfreq)
        cos = cosine(charprofile(cmd), normal_ps_profile)
      base = mean_std(H) by process_name over 30d
      alert if H > base.mean + 3*base.std OR KL > kl_thresh OR cos < cos_floor
      track freq(obfuscated_cmd)/min, decode_error_count
- question: Does a supervised classifier scoring command-line and script features flag a process invocation
    as obfuscated with high probability, including content recovered post-deobfuscation via AMSI?
  context: Surface-level regex misses adversaries who vary their obfuscation, so a model trained on structural
    features generalizes - key to robustly answering the Stealth information requirement. Train an XGBoost/Random
    Forest classifier on hybrid features (length, non-alphanumeric ratio, entropy, PSParser token counts,
    AST node frequencies) per Fang et al.; where AMSI is available, score post-deobfuscation content with
    contextual embeddings per Hendler et al., and add AST-node embeddings resistant to surface obfuscation
    per Rusak et al. Alert when obfuscation probability exceeds a tuned per-host/NAI threshold and surface
    the top-3 contributing features via SHAP/LIME per the CNN-GRU XAI model. A high-probability score
    with explanatory features is actionable; low-probability everyday commands are negatives.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, User endpoints, Application servers, Web servers'
  range: Last 90 days; retrain classifier monthly
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      feat = [len, nonalnum_ratio, entropy, psparser_tokens, ast_node_freq]
      clf = XGBoost/RandomForest.fit(labeled_cmdlines)
      if amsi_available: feat += embed(deobfuscated_content)  # Hendler et al.
      feat += ast_node_embeddings(scriptblock)  # Rusak et al.
      p = clf.predict_proba(feat)
      alert if p > per_host_threshold with top3 SHAP/LIME features
- question: Did a known decoding or deobfuscation utility (certutil.exe -decode, expand.exe, base64, openssl
    enc -d) execute within ~60 seconds of a network download or file write involving the same file on
    the same host, and were there decode failures?
  context: A download immediately followed by deobfuscation is a classic staging-then-decode chain that
    exposes concealed payloads, directly answering the Stealth question. Correlate Zeek files.log/http.log
    downloads with Windows Event ID 4688/Sysmon Event ID 1 process creations for known deobfuscation tools
    within 60 seconds on the same host, surfacing the download-to-decode chain at monitored NAIs. Explicitly
    profile the failure/state signal of decode errors (non-zero exit, repeated certutil attempts) as a
    distinct indicator of trial-and-error deobfuscation. A tight download->decode sequence on a user endpoint
    or admin console is strong evidence; isolated certutil use without a preceding download is weaker
    and may be administrative.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User endpoints, Developer workstations, System administrator consoles'
  range: Last 90 days; correlation window 60 seconds, event-centered
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      dl = (Zeek http.log/files.log download) by host, file_name, t0
      dec = (EventID 4688 / Sysmon 1) where image in
            {certutil.exe -decode, expand.exe, base64, openssl enc -d}
      join dl, dec on host AND same file within 60s
      alert(host, file_name, tool, exit_code, nai)
      flag decode_failure if exit_code != 0 OR repeated_attempts
- question: Is a deobfuscation tool being spawned by a rare parent process (bottom 1st percentile of observed
    parent-child pairings) or by a tool that is uncommon across the fleet?
  context: Legitimate deobfuscation tools usually have a stable set of parents; an unusual parent-child
    pairing betrays misuse, supporting the Stealth tactic. Build a 30-day frequency table of parent-child
    process pairs from Windows Event ID 4688 and alert when a deobfuscation tool is spawned by a parent
    in the bottom 1st percentile of observed pairings; complement with fleet-wide prevalence so deobfuscation
    tools rare across the host population are scored anomalous per the Microsoft Office 365 frequency-analysis
    method. Track Frequency (decode invocations/hour) and Volume (bytes decoded). A rare parent (e.g.,
    a Word or browser process spawning certutil) is highly suspicious; common scripted parents are likely
    benign.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User endpoints, Developer workstations, System administrator consoles'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      pairs = freq_table(parent_image -> child_image) from EventID 4688 over 30d
      deob = child_image in {certutil,expand,base64,openssl,...}
      alert if deob AND pair_percentile(parent,child) < 1
      prevalence = host_count(tool)/total_hosts ; alert if prevalence < rare
      track decode_invocations/hour, bytes_decoded
- question: Does a sequence model flag a low-probability ordering of network connection -> file write
    -> deobfuscation process execution that deviates from learned benign event chains?
  context: Adversary staging produces atypical event sequences that per-event rules miss; modeling the
    chain catches the unusual download-then-deobfuscate path central to the Stealth question. Use a sequence
    model (LSTM or HMM) trained on Zeek and Windows event streams (network connection -> file write ->
    process execution) to derive probability scores and flag low-probability download-then-deobfuscate
    sequences; structural AST/token features per Rusak et al. can characterize the decoded script, and
    the alert lists the top-3 contributing sequence steps for triage. A low-probability sequence is a
    lead; common, high-probability admin chains are negatives.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User endpoints, Developer workstations, System administrator consoles'
  range: Last 90 days; retrain sequence model monthly
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      seq = order_events(net_connect -> file_write -> proc_exec) by host
      model = LSTM/HMM.fit(benign_sequences)
      score = model.sequence_probability(seq)
      alert if score < low_prob_threshold
      annotate top3 contributing steps + ast/token features of decoded script
- question: Does a file, network payload segment, or command line show Shannon entropy above type-specific
    thresholds AND compress poorly, indicating unexpected encryption or compression?
  context: High entropy combined with low compressibility is a reliable fingerprint of encrypted/encoded
    content, the heart of the Stealth tactic of concealing files or information. Compute block-wise Shannon
    entropy on Zeek file transfers and Windows Event ID 4688 command lines using thresholds from Lyda
    and Hamrock (>7.2 encrypted, >6.7 packed; >6.0 for .ps1, >4.5 for command arguments) and corroborate
    with a lossless-compression ratio test (already-encoded content compresses poorly) per Born, Gustafson
    and Paxson. Tie alerts to applicable NAIs and report computed entropy, byte volume, and compression
    ratio. High entropy that also resists compression is strongly suspicious; naturally high-entropy but
    expected content (e.g., legitimate archives on a file server) needs context.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Internet gateways, User endpoints, Critical servers hosting sensitive data'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      for obj in (Zeek file transfers, EventID 4688 command lines):
        H = blockwise_shannon_entropy(obj)
        cr = compressed_size(obj)/raw_size(obj)
      thr = {encrypted:7.2, packed:6.7, ps1:6.0, cmd_args:4.5}
      alert if H > thr[type(obj)] AND cr > poor_compress_floor
      report entropy, byte_volume, compression_ratio, nai
- question: For its MIME type, does a transferred file exceed the 99th-percentile entropy of the rolling
    30-day baseline, or diverge in byte distribution from its peer group?
  context: Per-MIME baselining catches files that are abnormally high-entropy for their declared type
    even when below absolute thresholds, refining the Stealth detection. Group Zeek files.log entries
    by MIME type, keep a rolling 30-day entropy distribution per group with per-service reference baselines
    (encrypted typically >7.0) from Baseline Payload Entropy Values (Future Internet 2024), and flag files
    exceeding the 99th percentile for their MIME type; add KL-divergence scoring of byte/character distributions
    per Downing. Track Volume (high-entropy bytes/day per NAI) and Frequency (high-entropy transfers/hour).
    A text/document MIME with encryption-level entropy is a red flag; an archive MIME near its expected
    high entropy is normal.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Internet gateways, User endpoints, Critical servers hosting sensitive data'
  range: Last 90 days; baseline window 30 days per MIME type
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      by mime_type from Zeek files.log:
        dist = rolling_30d_entropy_distribution(mime_type)
        KL = kl_div(byte_freq(file), reference_byte_freq(mime_type))
      alert if entropy(file) > p99(dist) OR KL > kl_thresh
      track high_entropy_bytes/day per nai, high_entropy_transfers/hour
- question: Does an Isolation Forest over multi-dimensional file features flag an unusual combination
    such as a small but high-entropy script transfer?
  context: Single thresholds miss odd feature combinations; unsupervised outlier detection over multiple
    dimensions catches the small high-entropy script that a size or entropy rule alone would not, advancing
    the Stealth investigation. Train an Isolation Forest per Liu, Ting and Zhou on multi-dimensional Zeek
    files.log features (entropy, file size, MIME type, compression ratio) to flag unusual combinations
    such as small high-entropy script transfers; the alert must surface the top-3 contributing features
    (entropy, size, MIME mismatch) via SHAP-style attribution as in the CNN-GRU XAI model. A high anomaly
    score with clear feature attribution is actionable; in-distribution transfers are negatives.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Internet gateways, User endpoints, Critical servers hosting sensitive data'
  range: Last 90 days; retrain monthly
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      feat = [entropy, file_size, mime_type, compression_ratio] from files.log
      iso = IsolationForest.fit(feat)
      score = iso.decision_function(feat)
      alert if score < anomaly_threshold
      annotate top3 SHAP features (e.g., entropy, size, mime_mismatch)
- question: Is any file's observed magic-number/MIME type inconsistent with its declared extension - for
    example an executable MIME (application/x-dosexec) hiding behind a .jpg or .txt extension?
  context: Disguising an executable as a benign image or text file is masquerading used to evade defenses,
    a Stealth behavior. Compare declared file extensions to observed magic-number/MIME types from Zeek
    files.log against a benign-extension whitelist, alerting whenever an executable MIME (e.g., application/x-dosexec)
    hides behind a benign extension at tracked NAIs; corroborate with high entropy per Lyda and Hamrock
    to prioritize executable-behind-image masquerading. Record the mismatch pair, file size, and entropy
    in the alert. An executable-behind-image mismatch is high-priority; benign mislabeling (e.g., a renamed
    text file) is lower risk.
  answer_sources:
  - Zeek files.log
  - 'NAI: Web servers, Email gateways, User endpoints, Network file shares'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      for f in files.log:
        declared = ext(f.filename) ; observed = mime_from_magic(f)
        if not consistent(declared, observed, benign_whitelist):
           alert if observed in executable_mimes (e.g., application/x-dosexec)
           record mismatch_pair, file_size, entropy, nai
- question: Is a given user or host exceeding its 98th-percentile rate of extension/MIME mismatches, or
    producing rare mismatch types, and are mismatched transfers being repeatedly blocked or quarantined?
  context: A user suddenly generating many mismatched files, or rare mismatch types across the fleet,
    indicates deliberate masquerading rather than incidental mislabeling, supporting the Stealth question.
    Track extension/MIME mismatches per user/host per hour from Zeek files.log, build per-user baselines,
    and alert when a user's mismatch rate exceeds its 98th-percentile threshold or equivalent Z-score;
    complement with fleet-wide prevalence per the Microsoft Office 365 frequency-analysis method so rare
    mismatch types score higher. Profile blocked/quarantined-transfer counts (failure/state) as a distinct
    signal of repeated masquerading attempts. A baseline-breaking rate or repeated blocks is suspicious;
    an occasional benign mismatch is not.
  answer_sources:
  - Zeek files.log
  - 'NAI: Web servers, Email gateways, User endpoints, Network file shares'
  range: Last 90 days; baseline window per-user/host hourly
  queries:
  - technology: Zeek/pseudocode
    query: |-
      mm = mismatch_events from files.log by user, host, hour
      base = per_user_baseline(mm_rate)
      alert if mm_rate > p98(base) OR zscore(mm_rate) > 3
      prevalence = fleet_count(mismatch_type)/total ; boost if rare
      track blocked_or_quarantined_transfers as failure_state signal
- question: Does a classifier scoring mismatch and contextual features (file size, entropy, source-IP
    reputation, MIME type) rank a transfer as high-risk masquerading?
  context: Combining the mismatch flag with context lets a model prioritize the masquerades most likely
    to be malicious, sharpening triage for the Stealth investigation. Train a gradient-boosted/decision-tree
    classifier (or Isolation Forest per Liu, Ting and Zhou) on Zeek files.log features (mismatch_present,
    file size, entropy, source-IP reputation, MIME type) to score risk, and surface the top-3 contributing
    features in the alert via SHAP/LIME per the CNN-GRU XAI model so analysts can immediately triage high-risk
    mismatches. A high-risk score with poor source reputation and high entropy is actionable; low-risk,
    reputable transfers are negatives.
  answer_sources:
  - Zeek files.log
  - 'NAI: Web servers, Email gateways, User endpoints, Network file shares'
  range: Last 90 days; retrain monthly
  queries:
  - technology: Zeek/pseudocode
    query: |-
      feat = [mismatch_present, file_size, entropy, src_ip_reputation, mime_type]
      clf = GradientBoostedTrees / IsolationForest .fit(labeled_files)
      risk = clf.predict_proba(feat)
      alert if risk > threshold with top3 SHAP/LIME features
