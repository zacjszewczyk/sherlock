- question: '[Defense Impairment] Fleet prevalence with robust outlier thresholds: Can you determine whether
    a root certificate''s thumbprint is found to be installed on a very small number of endpoints relative
    to the total population, indicating it is not part of a standard operating system build or widespread
    software deployment. -- specifically, using the ''Fleet prevalence with robust outlier thresholds''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary installs a malicious
    or unauthorized root certificate to break the trust controls defenders and users rely on -- suppressing
    TLS warnings, enabling AiTM interception of secure traffic, and/or signing malicious code with cloned
    chains so it bypasses signature validation. This evidence focuses on the condition that a root certificate''s
    thumbprint is found to be installed on a very small number of endpoints relative to the total population,
    indicating it is not part of a standard operating system build or widespread software deployment.
    This Statistical Method approach works as follows: Daily, aggregate all installed root thumbprints
    from every endpoint. For each unique thumbprint compute prevalence = hosts_with_cert / total_hosts.
    Flag low-prevalence anchors using a robust threshold (modified Z-score |Mi|>3.5 on host-count, or
    a static floor such as installed on <10 hosts) ([Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly));
    compare the issuer set against the public CA ecosystem to distinguish a rare-but-legitimate corporate
    CA from a rogue anchor ([Analysis of the HTTPS Certificate Ecosystem, Durumeric et al.](https://jhalderm.com/pub/papers/https-imc13.pdf)).
