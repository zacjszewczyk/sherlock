name: 'T1553.004: Subvert Trust Controls: Install Root Certificate'
id: d4ee55e8-9558-44b6-ad0d-b74dcff36963
description: 'This playbook helps an analyst investigate whether an adversary has installed a malicious
  or unauthorized root certificate to subvert trust controls (T1553.004) as part of the Defense Impairment
  tactic. Installing a rogue root CA into a system trust store lets an adversary suppress the browser/OS
  warnings that normally appear when a host connects to attacker-controlled web servers, enables Adversary-in-the-Middle
  (AiTM) interception of TLS/SSL traffic to spoof legitimate sites and harvest credentials, and can be
  combined with cloned certificate chains to sign malicious code that bypasses signature-validation tooling.
  The hunt spans Windows (CAPI2 EID 41, Sysmon EID 13 registry writes to HKLM SystemCertificates\Root,
  certutil.exe/certmgr.exe/PowerShell Import-Certificate, EID 4688/4104), Linux (auditd file modifications
  under /etc/ssl/certs, /usr/local/share/ca-certificates, /etc/pki/ca-trust and update-ca-certificates/update-ca-trust
  execution), and macOS (security add-trusted-cert against System.keychain, osquery certificate enumeration).
  It guides the analyst across several angles: validating any newly installed root thumbprint against
  an enterprise allowlist/threat-intel blocklist with full-chain and Certificate Transparency verification;
  profiling issuer prevalence and TLS validation failures from Zeek ssl.log; deterministic command-line
  rules for root-store installation across all three platforms; entropy and frequency baselining of certificate
  command lines; first-seen and fleet-prevalence analysis of root thumbprints across the endpoint population;
  parent-process and initiating-actor allowlisting to catch installs spawned by browsers or office applications
  or run by non-administrative users; and correlation of a root install with immediate suspicious network
  behavior such as callbacks to newly-registered/low-reputation domains, JA3-vs-User-Agent interception
  mismatches, and anomalous per-host traffic. Detection methods combine symbolic-logic rules, statistical
  baselining, and machine-learning models (Random Forest/XGBoost X.509 classifiers, Isolation Forest over
  host trust-store vectors, LSTM sequence/autoencoder models with SHAP explanations) so the analyst can
  corroborate a suspected rogue anchor against installation telemetry, fleet rarity, actor context, and
  downstream interception activity.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
