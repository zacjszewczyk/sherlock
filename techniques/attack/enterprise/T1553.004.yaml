questions:
- question: '[Defense Impairment] Allowlist/blocklist of root thumbprints with full-chain and CT verification:
    Can you determine whether a certificate installation event is logged on an endpoint, and the certificate''s
    thumbprint (SHA-1/SHA-256 hash) is present on a blocklist of known-malicious certificates, is absent
    from an established enterprise allowlist of trusted root CAs, or does not chain to a known-good root
    and has no Certificate Transparency presence. -- specifically, using the ''Allowlist/blocklist of
    root thumbprints with full-chain and CT verification'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary installs a malicious
    or unauthorized root certificate to break the trust controls defenders and users rely on -- suppressing
    TLS warnings, enabling AiTM interception of secure traffic, and/or signing malicious code with cloned
    chains so it bypasses signature validation. This evidence focuses on the condition that a certificate
    installation event is logged on an endpoint, and the certificate''s thumbprint (SHA-1/SHA-256 hash)
    is present on a blocklist of known-malicious certificates, is absent from an established enterprise
    allowlist of trusted root CAs, or does not chain to a known-good root and has no Certificate Transparency
    presence. This Symbolic Logic approach works as follows: Maintain an enterprise allowlist of approved
    root certificate thumbprints (built from your gold OS image plus sanctioned corporate CAs) and a threat-intel
    blocklist. On any root-store registry write (Sysmon EID 13 to HKLM\SOFTWARE\Microsoft\SystemCertificates\Root\Certificates\*
    or HKLM\...\AuthRoot) or CAPI2 EID 41, extract the thumbprint, issuer, subject, validity and basicConstraints.
    Alert HIGH if the thumbprint is on the blocklist OR is not on the allowlist. Because cloned chains
    carry legitimate-looking metadata yet are not the genuine signer, verify the FULL chain resolves to
    a known-good root thumbprint rather than trusting subject/issuer strings ([Code Signing Certificate
    Cloning Attacks and Defenses, Graeber](https://posts.specterops.io/code-signing-certificate-cloning-attacks-and-defenses-6f98657fc6ec)).
    Escalate a non-allowlisted anchor that also has no public Certificate Transparency log entry, since
    legitimate CA roots are publicly logged ([RFC 6962: Certificate Transparency](https://www.rfc-editor.org/rfc/rfc6962.txt)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable rogue
    root anchor or an unauthorized trust-store modification; pivot to the responsible process and its
    parent lineage, the certificate''s thumbprint/issuer/subject and full chain, the initiating user and
    host context, the certificate''s fleet prevalence, and any subsequent TLS interception or callback
    activity from the host. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, cloned, or living-off-the-land
    certificate installs.'
  answer_sources:
  - Windows Event ID 41 (Microsoft-Windows-CAPI2/Operational)
  - Sysmon Event ID 13 (RegistryValue Set)
  - Zeek ssl.log
  - 'NAI: Domain Controllers, Public-facing Web Servers, Enterprise Certificate Authority Servers, Endpoint
    devices, Centralized log aggregation platform (SIEM)'
  range: Last 90 days (correlate within 60 minutes of any root-install event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on (Sysmon EID=13 AND TargetObject MATCHES 'HKLM\\\\SOFTWARE\\\\Microsoft\\\\SystemCertificates\\\
      \\(Root|AuthRoot)\\\\Certificates\\\\*')\n   OR (CAPI2 EID=41)\n  thumb = extract_thumbprint(event);\
      \ issuer,subject,validity,basicConstraints = parse_cert(thumb)\n  chain_root = resolve_full_chain(thumb)\n\
      \  if thumb IN blocklist: alert(HIGH, 'known-malicious root')\n  elif thumb NOT IN allowlist OR\
      \ chain_root NOT IN known_good_roots: alert(HIGH, 'non-allowlisted/uncloned root')\n  if thumb NOT\
      \ IN allowlist AND not has_CT_log_entry(thumb): escalate(HIGH, 'no Certificate Transparency presence')"
  - technology: Zeek/pseudocode
    query: "from ssl.log: collect cert_chain_fps where validation_status != 'ok'\n  if leaf_or_root_fp\
      \ NOT IN enterprise_allowlist: alert('untrusted anchor in TLS chain')"
- question: '[Defense Impairment] Issuer prevalence baseline from Zeek ssl.log with MAD thresholding:
    Can you determine whether a certificate installation event is logged on an endpoint, and the certificate''s
    thumbprint (SHA-1/SHA-256 hash) is present on a blocklist of known-malicious certificates, is absent
    from an established enterprise allowlist of trusted root CAs, or does not chain to a known-good root
    and has no Certificate Transparency presence. -- specifically, using the ''Issuer prevalence baseline
    from Zeek ssl.log with MAD thresholding'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary installs a malicious
    or unauthorized root certificate to break the trust controls defenders and users rely on -- suppressing
    TLS warnings, enabling AiTM interception of secure traffic, and/or signing malicious code with cloned
    chains so it bypasses signature validation. This evidence focuses on the condition that a certificate
    installation event is logged on an endpoint, and the certificate''s thumbprint (SHA-1/SHA-256 hash)
    is present on a blocklist of known-malicious certificates, is absent from an established enterprise
    allowlist of trusted root CAs, or does not chain to a known-good root and has no Certificate Transparency
    presence. This Statistical Method approach works as follows: From Zeek ssl.log compute the prevalence
    of each certificate ''issuer'' over a rolling 30-day window. Flag issuers seen in a low fraction of
    TLS sessions (derive the cutoff per-environment, e.g. <0.05% of sessions, or use a modified Z-score
    |Mi|>3.5 on the per-issuer session count to resist deployment spikes ([Modified Z-Score for Anomaly
    Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly))) and cross-reference
    against the enterprise allowlist and the known public CA ecosystem ([Analysis of the HTTPS Certificate
    Ecosystem, Durumeric et al.](https://jhalderm.com/pub/papers/https-imc13.pdf)). Also profile the FAILURE
    state: a spike in ssl.log validation_status != ''ok'' or in client cert-validation-error events on
    a host is a distinct signal that a rogue anchor is in play. A rare issuer not on the allowlist warrants
    investigation of the hosts communicating with it. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates a probable rogue root anchor or an unauthorized trust-store modification;
    pivot to the responsible process and its parent lineage, the certificate''s thumbprint/issuer/subject
    and full chain, the initiating user and host context, the certificate''s fleet prevalence, and any
    subsequent TLS interception or callback activity from the host. A negative result helps rule out this
    particular vector but should be corroborated with the other questions in this playbook, since a single
    method can miss stealthy, cloned, or living-off-the-land certificate installs.'
  answer_sources:
  - Windows Event ID 41 (Microsoft-Windows-CAPI2/Operational)
  - Sysmon Event ID 13 (RegistryValue Set)
  - Zeek ssl.log
  - 'NAI: Domain Controllers, Public-facing Web Servers, Enterprise Certificate Authority Servers, Endpoint
    devices, Centralized log aggregation platform (SIEM)'
  range: Last 90 days (with 14-30 day rolling baseline; correlate within 60 minutes of any root-install
    event)
  queries:
  - technology: Zeek/pseudocode
    query: "from ssl.log over rolling 30d:\n  count_by issuer -> sessions[issuer]\n  total = sum(sessions)\n\
      \  for issuer: prevalence = sessions[issuer]/total\n    modZ = 0.6745*(sessions[issuer]-median)/MAD\n\
      \    if prevalence < 0.0005 OR abs(modZ) > 3.5:\n      if issuer NOT IN allowlist AND issuer NOT\
      \ IN public_CA_list: alert('rare unknown issuer', hosts=peers)"
  - technology: SIEM/Stats pseudocode
    query: "from ssl.log: rate_by_host(validation_status != 'ok')\n  baseline per host; if spike in validation\
      \ failures: alert('possible rogue anchor in play')"
- question: '[Defense Impairment] Random Forest X.509 legitimacy classifier with SHAP top-3: Can you determine
    whether a certificate installation event is logged on an endpoint, and the certificate''s thumbprint
    (SHA-1/SHA-256 hash) is present on a blocklist of known-malicious certificates, is absent from an
    established enterprise allowlist of trusted root CAs, or does not chain to a known-good root and has
    no Certificate Transparency presence. -- specifically, using the ''Random Forest X.509 legitimacy
    classifier with SHAP top-3'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary installs a malicious
    or unauthorized root certificate to break the trust controls defenders and users rely on -- suppressing
    TLS warnings, enabling AiTM interception of secure traffic, and/or signing malicious code with cloned
    chains so it bypasses signature validation. This evidence focuses on the condition that a certificate
    installation event is logged on an endpoint, and the certificate''s thumbprint (SHA-1/SHA-256 hash)
    is present on a blocklist of known-malicious certificates, is absent from an established enterprise
    allowlist of trusted root CAs, or does not chain to a known-good root and has no Certificate Transparency
    presence. This Machine Learning approach works as follows: Train a Random Forest/XGBoost classifier
    to score certificate legitimacy using X.509 features: validity duration, key length (2048/4096), signature
    algorithm (e.g. sha256WithRSAEncryption vs weak/odd algorithms), issuer/subject string Shannon entropy,
    self-signed flag, and presence/criticality of basicConstraints; ensemble feature importance keeps
    it explainable ([Performance Comparative Study on Zero Day Malware Detection Using XGBoost and Random
    Forest Classifiers](https://www.researchgate.net/publication/386124227_Performance_Comparative_Study_on_Zero_Day_Malware_Detection_Using_XGBoost_and_Random_Forest_Classifiers)).
    Score every newly observed root in near real-time and, for any flagged certificate, emit the top-3
    contributing features in the alert via SHAP attributions ([SHAP Integration in IDS, Idrissi et al.](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full))
    so analysts see WHY (e.g., ''self-signed + 20yr validity + high subject entropy''). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates a probable rogue root anchor or
    an unauthorized trust-store modification; pivot to the responsible process and its parent lineage,
    the certificate''s thumbprint/issuer/subject and full chain, the initiating user and host context,
    the certificate''s fleet prevalence, and any subsequent TLS interception or callback activity from
    the host. A negative result helps rule out this particular vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy, cloned, or living-off-the-land
    certificate installs.'
  answer_sources:
  - Windows Event ID 41 (Microsoft-Windows-CAPI2/Operational)
  - Sysmon Event ID 13 (RegistryValue Set)
  - Zeek ssl.log
  - 'NAI: Domain Controllers, Public-facing Web Servers, Enterprise Certificate Authority Servers, Endpoint
    devices, Centralized log aggregation platform (SIEM)'
  range: Last 90 days (with 14-30 day rolling baseline; correlate within 60 minutes of any root-install
    event)
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [validity_duration, key_length, signature_algorithm, issuer_entropy, subject_entropy,\n\
      \            self_signed_flag, basicConstraints_present, basicConstraints_critical]\nmodel = RandomForest/XGBoost.train(labeled_certs)\n\
      on new_root_observed: score = model.predict_proba(features)\n  if score >= threshold: alert(top3\
      \ = SHAP(model, features))  # e.g. self-signed + 20yr validity + high subject entropy"
- question: '[Defense Impairment] Deterministic command-line rules for root-store installation (Win/Linux/macOS):
    Can you determine whether a process is created for a command-line utility (certutil.exe, certmgr.exe,
    powershell.exe on Windows; update-ca-certificates/update-ca-trust on Linux; /usr/bin/security on macOS)
    with arguments used to add a new certificate to a system''s root trust store. -- specifically, using
    the ''Deterministic command-line rules for root-store installation (Win/Linux/macOS)'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary installs a malicious
    or unauthorized root certificate to break the trust controls defenders and users rely on -- suppressing
    TLS warnings, enabling AiTM interception of secure traffic, and/or signing malicious code with cloned
    chains so it bypasses signature validation. This evidence focuses on the condition that a process
    is created for a command-line utility (certutil.exe, certmgr.exe, powershell.exe on Windows; update-ca-certificates/update-ca-trust
    on Linux; /usr/bin/security on macOS) with arguments used to add a new certificate to a system''s
    root trust store. This Symbolic Logic approach works as follows: Alert on process creation where:
    (Windows) certutil with ''-addstore'' + ''root'' ([New Root Certificate Installed Via Certutil.EXE,
    SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certutil_certificate_installation.yml)),
    CertMgr.exe with ''/add'' + ''root'' ([New Root Certificate Installed Via CertMgr.EXE, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certmgr_certificate_installation.yml)),
    or PowerShell script-block containing ''Import-Certificate''/''Move-Item'' + ''Cert:\LocalMachine\Root''
    ([Root Certificate Installed - PowerShell, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_root_certificate_installed.yml));
    (Linux) execution of update-ca-certificates or update-ca-trust ([Install Root Certificate (Linux),
    SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_install_root_certificate.yml));
    (macOS) ''/usr/bin/security add-trusted-cert'' targeting System.keychain ([Analyzing OSX/MaMi, Objective-See](https://objective-see.org/blog/blog_0x26.html)).
    Suppress only events tied to an approved change request or known software-deployment/GPO parent (the
    documented help-desk false positive). A positive result -- a rule match, statistical outlier, or model
    alert -- indicates a probable rogue root anchor or an unauthorized trust-store modification; pivot
    to the responsible process and its parent lineage, the certificate''s thumbprint/issuer/subject and
    full chain, the initiating user and host context, the certificate''s fleet prevalence, and any subsequent
    TLS interception or callback activity from the host. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, cloned, or living-off-the-land certificate installs.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Creation)
  - Windows Event ID 4104 (PowerShell ScriptBlock)
  - Linux auditd EXECVE
  - macOS unified log
  - 'NAI: Windows endpoints/servers (DCs, admin workstations, developer machines), Linux servers, macOS
    endpoints.'
  range: Last 90 days (correlate within 60 minutes of any root-install event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on ProcessCreate (EID 4688 / Sysmon EID 1) OR PowerShell EID 4104:\n  WIN: (image='certutil.exe'\
      \ AND cmd CONTAINS '-addstore' AND cmd CONTAINS 'root')\n    OR (image='CertMgr.exe' AND cmd CONTAINS\
      \ '/add' AND cmd CONTAINS 'root')\n    OR (scriptblock CONTAINS ('Import-Certificate' OR 'Move-Item')\
      \ AND CONTAINS 'Cert:\\\\LocalMachine\\\\Root')\n  LINUX: execve(update-ca-certificates) OR execve(update-ca-trust)\n\
      \  MAC: cmd CONTAINS '/usr/bin/security add-trusted-cert' AND CONTAINS 'System.keychain'\n  => alert\
      \ unless parent IN approved_change OR parent IN {software_deploy, GPO}"
