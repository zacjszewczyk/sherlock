- question: 'Using the statistical method approach ''First-seen and time-of-day baselining per principal'',
    can you determine whether an adversary is adding or modifying Kubernetes RBAC roles to support persistence?
    Specifically: For each principal, treat the first RBAC write seen in the lookback window as a first-seen
    anomaly, and build a baseline of time-of-day/day-of-week for RBAC changes using mean/standard deviation
    (or modified Z-score). Alert on a principal''s first-ever RBAC write or on changes more than two standard
    deviations outside the established window (e.g., 3 AM Sunday), reporting prior-seen count and baseline
    window [CloudTrail Anomaly Detector, Netflix-Skunkworks](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)
    [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
