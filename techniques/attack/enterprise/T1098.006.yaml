- question: 'Using the symbolic logic approach ''Parse referenced role rules for high-risk verbs'', can
    you determine whether an adversary is adding or modifying Kubernetes RBAC roles to support privilege
    escalation? Specifically: For all RBAC binding changes in the audit log, resolve and parse the referenced
    role definition. Trigger an immediate alert if the role rules contain verbs:[impersonate], verbs:[*],
    resources:[*], or (resources includes rolebindings/clusterrolebindings AND verbs includes create/update).
    Report the specific high-risk rule and the granted subject [Detection Engineering for Kubernetes Clusters,
    NCC Group](https://www.nccgroup.com/research/detection-engineering-for-kubernetes-clusters/) [Falco
    Default Detection Rules](https://falco.org/docs/reference/rules/default-rules/).'
