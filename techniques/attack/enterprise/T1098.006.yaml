- question: 'Using the machine learning approach ''Classify RBAC requests with a supervised model'', can
    you determine whether an adversary is adding or modifying Kubernetes RBAC roles to support persistence?
    Specifically: Train a classifier (Logistic Regression/Random Forest) on audit-derived features (userAgent
    characteristics, verb, objectRef.resource, namespace, sourceIP reputation/ASN rarity, hour-of-day)
    using labeled benign vs. malicious RBAC requests. Score new binding requests and alert on high-confidence
    malicious classifications, surfacing the top-3 contributing features (e.g., userAgent=python, ASN-rarity,
    off-hours) in the alert for triage [Detecting Threats in AWS CloudTrail Logs Using Machine Learning,
    Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
