questions:
- question: 'Using the symbolic logic approach ''Match audit sourceIPs and userAgent against threat intel
    and tool signatures'', can you determine whether an adversary is adding or modifying Kubernetes RBAC
    roles to support persistence? Specifically: For every Kubernetes audit event with objectRef.resource
    in {rolebindings, clusterrolebindings} and verb in {create, update, patch, replace}, compare the requestReceivedTimestamp
    sourceIPs against a threat-intelligence feed of malicious IPs/TOR exit nodes and match the userAgent
    against a deny-list of attack tools (kube-hunter, peirates) and non-kubectl agents (curl, python-requests,
    Go-http-client). Alert on any match, including the matched IP/userAgent and the bound roleRef.name/subject
    in alert text. Where audit logs are unavailable, fall back to Zeek conn.log id.orig_h and http.log
    user_agent for the API server VIP [Detection Engineering for Kubernetes Clusters, NCC Group](https://www.nccgroup.com/research/detection-engineering-for-kubernetes-clusters/)
    [Kubernetes Suspicious Self-Subject Review via Unusual User Agent, Elastic](https://www.elastic.co/guide/en/security/current/kubernetes-suspicious-self-subject-review.html).'
  context: 'Tactic context (Persistence / Is the adversary maintaining persistence by adding roles to
    container accounts?): The adversary is trying to maintain their foothold. Evidence under investigation:
    A successful RBAC modification (create/update/patch on rolebindings or clusterrolebindings) is recorded
    in the Kubernetes API server audit log where the requesting sourceIPs entry is on a threat-intelligence
    feed/TOR list or the userAgent matches a known attack-tool signature (e.g., kube-hunter, peirates,
    curl, python-requests) rather than kubectl/client-go. Approach (Match audit sourceIPs and userAgent
    against threat intel and tool signatures - Symbolic Logic): For every Kubernetes audit event with
    objectRef.resource in {rolebindings, clusterrolebindings} and verb in {create, update, patch, replace},
    compare the requestReceivedTimestamp sourceIPs against a threat-intelligence feed of malicious IPs/TOR
    exit nodes and match the userAgent against a deny-list of attack tools (kube-hunter, peirates) and
    non-kubectl agents (curl, python-requests, Go-http-client). Alert on any match, including the matched
    IP/userAgent and the bound roleRef.name/subject in alert text. Where audit logs are unavailable, fall
    back to Zeek conn.log id.orig_h and http.log user_agent for the API server VIP [Detection Engineering
    for Kubernetes Clusters, NCC Group](https://www.nccgroup.com/research/detection-engineering-for-kubernetes-clusters/)
    [Kubernetes Suspicious Self-Subject Review via Unusual User Agent, Elastic](https://www.elastic.co/guide/en/security/current/kubernetes-suspicious-self-subject-review.html).
    A positive result indicates an RBAC role/permission change consistent with adversary persistence or
    privilege escalation in the cluster; a negative result means the observed binding activity matches
    authorized, baselined administrative behavior. Pivot from any hit to the requesting principal/sourceIP,
    the bound roleRef and subject, the originating node/pod or process, and any preceding enumeration,
    denials, or suspicious execution. Investigate the named area of interest: Kubernetes API Server, Network
    Egress/Ingress Points, Threat Intelligence Platform.'
