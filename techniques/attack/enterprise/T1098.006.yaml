- question: 'Using the statistical method approach ''Score ASN and country rarity of the RBAC source'',
    can you determine whether an adversary is adding or modifying Kubernetes RBAC roles to support persistence?
    Specifically: For each sourceIP performing RBAC writes, compute the historical rarity of its ASN and
    country against a per-cluster baseline. Alert when an RBAC modification originates from an ASN/country
    accounting for less than 0.1% of historical control-plane traffic (tune per environment using median-absolute-deviation
    so batch/automation sources do not distort the threshold). Emit the rare ASN/country and prior-seen
    count in the alert [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
