- question: 'Using the machine learning approach ''Sequence-probability scoring of API verb sequences'',
    can you determine whether an adversary is adding or modifying Kubernetes RBAC roles to support persistence?
    Specifically: Train a sequence model (Hidden Markov / variable-order Markov, or an LSTM as in DeepLog)
    on audit verb sequences from legitimate administrators. Flag sessions whose ordered sequence (e.g.,
