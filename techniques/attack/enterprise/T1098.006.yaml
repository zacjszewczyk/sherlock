- question: 'Using the symbolic logic approach ''Parse binding requestObject for high-privilege roleRef
    and suspicious names'', can you determine whether an adversary is adding or modifying Kubernetes RBAC
    roles to support persistence? Specifically: On Kubernetes audit events where objectRef.resource in
    {rolebindings, clusterrolebindings} and verb=create, parse requestObject. Alert when roleRef.name
    in {cluster-admin, admin, edit} AND subjects[].kind=ServiceAccount in a namespace other than kube-system,
    OR when metadata.name matches regex ''.*-(backdoor|pwn|stealth).*''. Include roleRef.name, subject,
    namespace, and user.username in the alert. This is the canonical deterministic detection for T1098.006
    [Kubernetes Rolebinding Modification (Sigma), kelnage/SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/application/kubernetes/audit/kubernetes_audit_rolebinding_modification.yml)
