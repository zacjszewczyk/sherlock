- question: 'Using the symbolic logic approach ''Detect success despite missing permission and 403 bursts'',
    can you determine whether an adversary is adding or modifying Kubernetes RBAC roles to support privilege
    escalation? Specifically: Track audit responseStatus.code per principal. Alert on (a) a successful
    RBAC write (200/201) by a principal that, per the cached user-to-role mapping, lacks create/update
    on (cluster)rolebindings, and (b) bursts of 401/403 denials on RBAC endpoints from one principal.
    Surface the denial count and the subsequent successful verb/resource in the alert as the failure-then-success
    escalation signature [Kubernetes Unauthorized or Unauthenticated Access (Sigma), kelnage/SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/application/kubernetes/audit/kubernetes_audit_unauthorized_unauthenticated_actions.yml)
    [How to Monitor Kubernetes Audit Logs, Datadog](https://www.datadoghq.com/blog/monitor-kubernetes-audit-logs/).'
