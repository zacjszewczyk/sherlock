    Specifically: For each administrator, fit an ARIMA time-series model on their history of RBAC modification
    counts per interval. Trigger an alert when the observed count exceeds the forecast confidence interval,
    surfacing the predicted vs. actual count in the alert [Online Forecasting and Anomaly Detection Based
    on ARIMA, Pena et al.](https://www.mdpi.com/2076-3417/11/7/3194).'
  context: 'Tactic context (Persistence / Is the adversary maintaining persistence by adding roles to
    container accounts?): The adversary is trying to maintain their foothold. Evidence under investigation:
    A successful RBAC modification is executed by a user principal that has not previously performed such
    actions in the lookback window, or occurs at a time that significantly deviates from that principal''s
    baseline or from approved change-control windows. Approach (Forecast expected RBAC-change volume with
    ARIMA - Machine Learning): For each administrator, fit an ARIMA time-series model on their history
    of RBAC modification counts per interval. Trigger an alert when the observed count exceeds the forecast
    confidence interval, surfacing the predicted vs. actual count in the alert [Online Forecasting and
    Anomaly Detection Based on ARIMA, Pena et al.](https://www.mdpi.com/2076-3417/11/7/3194). A positive
    result indicates an RBAC role/permission change consistent with adversary persistence or privilege
    escalation in the cluster; a negative result means the observed binding activity matches authorized,
    baselined administrative behavior. Pivot from any hit to the requesting principal/sourceIP, the bound
    roleRef and subject, the originating node/pod or process, and any preceding enumeration, denials,
    or suspicious execution. Investigate the named area of interest: Kubernetes API Server, Identity and
    Access Management System.'
