- question: 'Using the symbolic logic approach ''Correlate known-exploit process with subsequent RBAC
    write'', can you determine whether an adversary is adding or modifying Kubernetes RBAC roles to support
    privilege escalation? Specifically: Maintain a list of process names/command-line arguments tied to
