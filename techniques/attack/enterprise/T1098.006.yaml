- question: 'Using the symbolic logic approach ''Stateful enumerate-then-bind correlation'', can you determine
    whether an adversary is adding or modifying Kubernetes RBAC roles to support persistence? Specifically:
    Implement a stateful rule that fires when a single principal/sourceIP issues more than 50 list/get
    requests against RBAC resources (roles, clusterroles) or any SelfSubjectAccessReview/SelfSubjectRulesReview
    within a 5-minute window, followed by a create/update on rolebindings or clusterrolebindings from
    the same source within the subsequent 5 minutes. Include the enumeration count and resulting binding
    in the alert [RBAC Permission Enumeration (Sigma), Leo Tsaousis/SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/application/kubernetes/audit/kubernetes_audit_rbac_permisions_listing.yml)
    [Kubernetes Suspicious Self-Subject Review via Unusual User Agent, Elastic](https://www.elastic.co/guide/en/security/current/kubernetes-suspicious-self-subject-review.html).'
