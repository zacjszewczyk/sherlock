- question: 'Using the symbolic logic approach ''Stateful watchlist correlation of suspicious host to
    RBAC write'', can you determine whether an adversary is adding or modifying Kubernetes RBAC roles
    to support privilege escalation? Specifically: Create a SIEM correlation rule. When a suspicious process
    alert fires from a host/pod (e.g., command line containing ''powershell.exe -enc'' via Windows Event
    ID 4688, or a reverse-shell/syscall alert), add the source identity/IP to a watchlist for 60 minutes.
    If any Kubernetes audit RBAC create/update is then attributed to a sourceIP/serviceaccount on the
    watchlist, raise a critical alert that includes the originating process and the new binding [Detection
    Engineering for Kubernetes Clusters, NCC Group](https://www.nccgroup.com/research/detection-engineering-for-kubernetes-clusters/)
    [Falco Default Detection Rules](https://falco.org/docs/reference/rules/default-rules/).'
  context: 'Tactic context (Privilege Escalation / Is the adversary escalating privileges by adding roles
    to container accounts?): The adversary is trying to gain higher-level permissions. Evidence under
    investigation: A successful RBAC modification API call (audit verb=create/update on (cluster)rolebindings)
    originates from a pod or node identity/IP that was associated with suspicious activity (reverse shell,
    anomalous process execution, container escape) within a preceding window such as 60 minutes. Approach
    (Stateful watchlist correlation of suspicious host to RBAC write - Symbolic Logic): Create a SIEM
    correlation rule. When a suspicious process alert fires from a host/pod (e.g., command line containing
