name: 'T1098.006: Additional Container Cluster Roles'
id: 3884124a-6fe5-4f63-b011-2d017d897a17
description: 'This playbook helps an analyst investigate Additional Container Cluster Roles (T1098.006):
  an adversary adding roles or permissions to an adversary-controlled or compromised user/service account
  to maintain persistent access to, or escalate privileges within, a Kubernetes/container orchestration
  cluster. The core abuse is creation or modification of RBAC RoleBinding and ClusterRoleBinding objects
  (or ABAC policy edits) that bind high-privilege Roles/ClusterRoles (cluster-admin, admin, edit, or roles
  granting impersonate, RBAC-write, or wildcard verbs/resources) to subjects such as ServiceAccounts outside
  kube-system. Primary telemetry is the Kubernetes API server audit log (kubernetes:audit), correlated
  with network telemetry (Zeek conn.log/http.log for the API server VIP) and node/host process telemetry
  (Windows Event ID 4688, runtime rules) to attribute RBAC changes to suspicious sources. Investigative
  angles include: matching source IPs and userAgents against threat intel and attack-tool signatures;
  parsing binding requestObjects for high-privilege roleRefs and suspicious names; allowlisting authorized
  admin/CI-CD principals; correlating enumerate-then-bind sequences; tying RBAC writes to prior suspicious
  process execution, container-escape exploits, or 401/403-then-success patterns; and statistical/ML baselining
  (ASN/country rarity, modified Z-score, first-seen, ARIMA, Isolation Forest, sequence models, graph-
  and peer-group analytics). Detection blends symbolic-logic rules, statistical baselining, and machine
  learning to produce explainable, high-fidelity alerts for both the Persistence and Privilege Escalation
  tactics.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
