name: 'T1583.004: Server'
id: c58964f3-cb3f-4816-b870-2eca49abbb66
description: |-
  Investigate evidence that an adversary has acquired, leased, or stood up physical servers (MITRE ATT&CK T1583.004 - Server, under Resource Development) for use against the organization. Although server provisioning happens outside the target's visibility, the resulting infrastructure becomes observable once internal hosts begin resolving or connecting to it - typically during Command and Control, Phishing, or Drive-by Compromise. This playbook helps an analyst hunt for and triage internal hosts contacting IPs or domains on high-confidence threat-intelligence feeds of adversary infrastructure; SSL/TLS sessions matching known C2 certificate, JA3S/JA4S, or HTTP server-header profiles; connections to young, freshly registered, or previously unbaselined domains and IPs; and bursts of multiple internal hosts converging on a single uncommon domain that resolves to newly observed or fast-flux IP infrastructure. It combines symbolic-logic watchlist matching, statistical prevalence, entropy, and volume baselining, and machine-learning scoring, clustering, and change-point/beaconing detection across Zeek network telemetry, Windows Filtering Platform events, and Sysmon DNS logging to surface adversary-controlled servers early in an engagement.
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any internal host establish a network connection to, or resolve a DNS name for, an external
    IP address or domain that exactly matches a high-confidence threat-intelligence indicator of known
    adversary-acquired server infrastructure?
  context: Under Resource Development, adversaries stand up or lease servers that later appear in Command
    and Control, phishing, or watering-hole activity. Once that infrastructure is in use, internal egress
    and DNS telemetry will reveal contact with it. Maintain a curated watchlist of high-confidence IP
    and domain indicators - enriched through internet-scan response artifacts and infrastructure pivoting
    (per SCANdalous and ThreatConnect infrastructure hunting) - and alert on any exact match in Zeek conn.log,
    Windows Event ID 5156 (Windows Filtering Platform allowed connection), or Zeek dns.log within one
    minute of the resolution or connection. A positive match against a high-confidence feed is an immediate,
    actionable lead pointing to adversary-controlled servers; a negative result narrows the hunt to behavioral
    methods. Keep feed confidence high to limit false positives, and corroborate the connecting host and
    process where possible.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, DNS Resolvers, Endpoint Devices, Threat Intelligence Platforms'
  range: Last 90 days; alert in near-real-time within 1 minute of resolution or connection
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      watchlist = load_iocs(source="high_confidence_ti", types=["ip","domain"])
      for e in stream(conn.log, dns.log, EID=5156):
        dest = e.dest_ip or e.query
        if dest in watchlist:
          alert("CTI server match", host=e.src_ip, dest=dest, age=now()-e.ts<=60s)
- question: Among threat-intelligence indicator matches, which external destinations are contacted by
    very few internal hosts (low prevalence) and should therefore be prioritized for analyst review?
  context: Adversary-acquired servers are rarely part of normal business traffic, so destinations matched
    against CTI that are also low-prevalence in your environment deserve the highest priority. Enrich
    each indicator hit with 30-day prevalence counts per destination IP or domain (informed by passive-DNS
    prevalence and dynamism features from EXPOSURE), and prioritize destinations contacted by fewer than
    five hosts or falling below your environment's 5th-percentile prevalence. Derive the percentile from
    your own 30-day NetFlow or Zeek baseline rather than a fixed threshold. Low prevalence combined with
    a CTI hit strongly suggests targeted adversary infrastructure rather than a benign popular service
    that happened to be flagged; high prevalence may indicate a stale or false-positive indicator worth
    reviewing.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, DNS Resolvers, Endpoint Devices, Threat Intelligence Platforms'
  range: Last 90 days; prevalence computed over a rolling 30-day window
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      hits = events where dest in ti_watchlist (Last 90 days)
      prev = count_distinct(src_host) by dest over last 30d
      p5 = percentile(prev_all_dest, 5)
      rank hits where prev < 5 OR prev <= p5 by ascending prev
- question: For watchlisted adversary destinations, does the pattern of failed and successful connection
    attempts show a burst of blocked or failed attempts followed by a successful session?
  context: 'The success/failure state of connections to known-bad infrastructure tells a story: repeated
    failures followed by a success often indicate retry logic in malware, infrastructure coming online,
    or controls being bypassed. For each watchlisted destination, track the ratio of failed to successful
    connections using Zeek conn.log conn_state values (S0, REJ, RSTO versus SF), Windows Event ID 5157
    (WFP blocked connection), and NXDOMAIN responses in dns.log. A burst of blocked or failed attempts
    that culminates in a successful session is a distinct, high-priority signal of an adversary establishing
    reach to its server. Alert when failed attempts exceed three within ten minutes for any watchlist
    destination, and escalate sharply if a successful session follows.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, DNS Resolvers, Endpoint Devices, Threat Intelligence Platforms'
  range: Last 90 days; evaluate failure bursts in 10-minute sliding windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for dest in ti_watchlist:
        fails = count(conn_state in [S0,REJ,RSTO] OR EID=5157 OR rcode=NXDOMAIN) by dest in 10min window
        succ = count(conn_state==SF) by dest
        if fails > 3 in 10min: alert("failure burst", dest)
        if fails>3 then succ>0: escalate("burst then success", dest)
- question: When a new threat-intelligence indicator match occurs, what is its machine-learning risk score
    based on connection behavior, and which features drove that score?
  context: Not every CTI hit is equally urgent, and analysts need explainable prioritization. Train a
    Random Forest on connection features - duration, bytes sent and received and their ratio, destination
    port, server-side TLS fingerprints (JA3S/JA4S), and CTI category - to score new indicator matches,
    escalating any score above 0.90. Surface the top three contributing features in the alert (per SHAP-based
    IDS explainability) so the analyst immediately understands why a match scored high, for example an
    unusual byte ratio consistent with beaconing plus a known C2 TLS fingerprint. High explainable scores
    let a SOC triage adversary-server contacts efficiently; low scores with a CTI hit still warrant review
    but may reflect benign or stale indicators.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, DNS Resolvers, Endpoint Devices, Threat Intelligence Platforms'
  range: Last 90 days; score each new match as it arrives
  queries:
  - technology: ML/Random Forest pseudocode
    query: |-
      features = [duration, bytes_up, bytes_down, bytes_up/bytes_down, dest_port, ja3s, ja4s, cti_category]
      score, contribs = rf_model.predict_proba(features), shap(features)
      if score > 0.90: alert("CTI ML match", score=score, top3=top_n(contribs,3))
- question: Did any internal host initiate an SSL/TLS session with an external server whose X.509 certificate,
    JA3/JA3S fingerprint, or HTTP server header matches a known adversary Command and Control profile,
    corroborated by Windows Event ID 5156?
  context: Adversary servers running C2 frameworks frequently expose recognizable TLS and HTTP artifacts.
    Alert on any Zeek ssl.log, ja3.log, or http.log record matching known adversary server fingerprints
    - server-side TLS hashes (JA3S/JA4S), default Cobalt Strike certificate serials or subjects (Roth
    YARA signature-base), or Malleable C2 URI/header/User-Agent regex (Unit 42) - when Windows Event ID
    5156 corroborates the outbound session from a specific host. Prefer server-side and certificate fingerprints,
    since client JA3 is degraded by TLS extension randomization in modern browsers (Stamus). A match identifies
    adversary-acquired server infrastructure with high confidence and ties it to a connecting endpoint
    for rapid containment; the absence of a match does not exclude custom or reconfigured C2, so pair
    with the statistical and ML methods below.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek ja3.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Proxies with SSL/TLS Inspection, Network Security Monitoring (NSM) Sensors'
  range: Last 90 days; alert in near-real-time on matching sessions
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      c2_certs = load(cobaltstrike_serials, subjects); c2_ja = load(ja3s, ja4s)
      c2_http = load(malleable_uri_header_ua_regex)
      for s in join(ssl.log, ja3.log, http.log, EID=5156):
        if s.cert_serial in c2_certs or s.ja3s in c2_ja or regex_match(s.http, c2_http):
          if corroborated_by(EID=5156, s): alert("C2 TLS profile", host=s.src, dest=s.dest)
  - technology: Zeek/pseudocode
    query: |-
      event ssl, http:
        if c.server_name in c2_set || c.cert_serial in c2_serials || c.ja3s in c2_ja3s:
          note Adversary_C2_Server, conn=c$uid, src=c$id$orig_h, dst=c$id$resp_h
- question: Are any internal hosts negotiating TLS with external servers presenting low-entropy, self-signed,
    ultra-short-validity, or default-JARM/JA3S certificates?
  context: Hastily provisioned adversary servers often use auto-generated or default certificates rather
    than properly issued ones. Baseline the Shannon entropy of certificate subject and issuer fields and
    flag connections whose entropy falls below the 10th percentile, plus certificates that are self-signed,
    have ultra-short validity windows, or present default JARM or JA3S values. Use Windows Event ID 5156
    to tie any flagged session to a specific internal host and process. These properties are statistical
    tells of throwaway infrastructure stood up for an operation; legitimate enterprise services typically
    present CA-issued certificates with normal-entropy organizational fields and longer validity. Treat
    clusters of these properties on the same destination as strong corroboration.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek ja3.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Proxies with SSL/TLS Inspection, Network Security Monitoring (NSM) Sensors'
  range: Last 90 days; entropy percentile derived from a rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base_entropy = entropy(cert.subject + cert.issuer) over baseline
      p10 = percentile(base_entropy, 10)
      for s in ssl.log:
        if entropy(s.subject+s.issuer) < p10 or s.self_signed or s.validity < 7d or s.jarm in defaults or s.ja3s in defaults:
          host = lookup(EID=5156, s); flag("suspect cert", host, s.dest)
- question: Do any TLS sessions show beacon-like flow characteristics - small consistent uploads, regular
    cadence, or elevated handshake failures - inconsistent with benign traffic baselines?
  context: Even when certificates and fingerprints are unknown, the shape of traffic to an adversary server
    is revealing. Compute per-session bytes-up to bytes-down ratio and request frequency; C2 beacons typically
    show small, consistent uploads and a regular cadence. Flag sessions whose byte-ratio and inter-arrival
    regularity fall outside benign baselines, and separately count TLS handshake failures and alerts as
    a failure-mode signal of misconfigured or staging infrastructure. Regular low-volume uploads on a
    fixed interval are a classic beaconing pattern pointing to a controlled server; bursty, asymmetric
    download-heavy flows are more typical of legitimate browsing. Use this method to catch novel C2 that
    evades signature matching.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek ja3.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Proxies with SSL/TLS Inspection, Network Security Monitoring (NSM) Sensors'
  range: Last 90 days; evaluate cadence over multi-hour windows per destination
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for s in sessions by (src,dest):
        ratio = bytes_up/max(bytes_down,1); cadence = stdev(inter_arrival)
        if ratio outside baseline AND cadence < benign_threshold: flag("beacon-like", src, dest)
      handshake_fail = count(tls_alert OR incomplete_handshake) by dest; flag if > baseline
- question: Which TLS sessions cluster together as anomalous based on certificate and flow features, and
    what features define those anomalous clusters?
  context: Unsupervised clustering can isolate adversary-server TLS even without prior indicators. Apply
    DBSCAN to certificate features (validity period, key length, signature algorithm, JA3S/JA4S) augmented
    with Windows event metadata to isolate clusters that deviate from legitimate traffic. For TLS 1.3,
    where the ClientHello is encrypted, add version-agnostic flow features (packet sizes, directions,
    timing) per Extending C2 Detection to TLS 1.3, and incorporate self-supervised encrypted-traffic features
    per ET-SSL. Report the top three cluster-defining features in each alert so analysts can judge whether
    a cluster represents a coherent adversary-server population versus a benign outlier group such as
    an internal appliance. Small, tight clusters with unusual certificate or timing properties are the
    highest-value leads.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek ja3.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Proxies with SSL/TLS Inspection, Network Security Monitoring (NSM) Sensors'
  range: Last 90 days; recluster on a daily or weekly cadence
  queries:
  - technology: ML/DBSCAN pseudocode
    query: |-
      X = [validity, key_len, sig_alg, ja3s, ja4s, pkt_sizes, directions, timing]
      labels = DBSCAN(eps, min_samples).fit(scale(X))
      for cluster in anomalous(labels):
        alert("anomalous TLS cluster", members=cluster, top3=cluster_defining_features(cluster,3))
- question: Did any internal host connect to an external domain or IP that is absent from the 90-day environment
    baseline and whose WHOIS creation date is less than 60 days old?
  context: Adversaries frequently register fresh domains shortly before an operation, so a destination
    that is both new to your environment and newly registered is a meaningful early signal of adversary-acquired
    server infrastructure. Alert when a domain or IP is absent from the 90-day baseline and its WHOIS
    creation date is under 60 days, consistent with lifecycle-based risk weighting for freshly registered
    adversary domains (DomainDynamics). Combine first-seen tracking in Zeek conn.log, dns.log, and Sysmon
    Event ID 22 (DNS query) with WHOIS enrichment. A young, never-before-seen destination contacted by
    an internal host is worth investigating even absent any CTI hit; established, widely used destinations
    are far lower risk. Confirm the WHOIS age from a reliable enrichment source to avoid false positives
    from CDN or cloud churn.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 22
  - 'NAI: Network Egress Points, DNS Resolvers, Endpoint Devices, Threat Intelligence Platforms'
  range: Last 90 days for baseline; WHOIS creation under 60 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      baseline = set(domains, ips seen last 90d)
      for e in dns.log, conn.log, EID=22:
        d = e.query or e.dest
        if d not in baseline and whois_creation_age(d) < 60d:
          alert("young unbaselined destination", host=e.src, dest=d)
- question: What is the lexical and lifecycle risk score for each newly observed domain, and which domains
    exceed the 95th-percentile risk threshold?
  context: Algorithmically generated or disposable adversary domains tend to have distinctive name and
    lifecycle properties. Compute a risk score from name length, digit ratio, Shannon entropy, and TLD
    rarity, plus passive-DNS lifecycle features such as short TTL, IP/ASN fan-out, and daily resolution
    change (per EXPOSURE), and flag domains above the 95th percentile of your baseline. High-scoring domains
    combine random-looking names with volatile, short-lived resolution behavior characteristic of adversary
    infrastructure; low scores generally reflect stable, human-readable, long-lived domains. This statistical
    scoring lets an analyst rank a flood of new domains and focus on the most suspicious without relying
    on prior knowledge of the specific server.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 22
  - 'NAI: Network Egress Points, DNS Resolvers, Endpoint Devices, Threat Intelligence Platforms'
  range: Last 90 days; recompute scores as new domains appear
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for d in new_domains:
        score = w1*len(d)+w2*digit_ratio(d)+w3*entropy(d)+w4*tld_rarity(d)+w5*lifecycle(short_ttl,ip_asn_fanout,daily_change)
      p95 = percentile(scores, 95)
      flag d where score > p95
- question: For newly observed destinations, do DNS resolution and connection success patterns show a
    young domain resolving successfully after prior NXDOMAINs, or a first successful connection to an
    otherwise rarely contacted IP?
  context: The moment adversary infrastructure comes online is observable as a transition in resolution
    and connection state. Profile NXDOMAIN and SERVFAIL rates and connection success state for newly observed
    destinations. A young domain that begins resolving successfully after prior NXDOMAIN responses, or
    whose very first connection succeeds against an otherwise rarely contacted IP, is a distinct signal
    that a staged server has been activated. Alert on the first successful connection to a domain under
    60 days old. This timing-based view complements lexical scoring by catching the activation event itself;
    benign new services typically resolve cleanly from first sight without a pattern of preceding failures.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 22
  - 'NAI: Network Egress Points, DNS Resolvers, Endpoint Devices, Threat Intelligence Platforms'
  range: Last 90 days; alert on first successful connection to a <60-day domain
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for d in new_destinations:
        nx = rate(rcode in [NXDOMAIN,SERVFAIL]) by d
        if d.age<60d and prior_nxdomain(d) and now_resolves(d): alert("young domain activated", d)
        if first_connection(d).state==SF and prevalence(dest_ip) low: alert("first success rare IP", d)
- question: Is the daily count of newly observed domains surging beyond its forecast, and how does a classifier
    score each new domain that drives the surge?
  context: A spike in brand-new domains being contacted can indicate a campaign ramping up against the
    organization. Apply SARIMA to daily counts of newly observed domains and alert when counts exceed
    the forecast confidence interval, capturing both seasonality and trend. Complement the time-series
    view with a per-domain classifier (EXPOSURE J48 or FluxBuster C4.5) that scores each new domain, surfacing
    the top three features driving the score so analysts can act on the specific domains behind a surge.
    A statistically significant spike paired with high-scoring individual domains is a strong indicator
    of adversary infrastructure being rolled out; normal day-to-day variation stays within the forecast
    band. Investigate the contributing hosts and domains together.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 22
  - 'NAI: Network Egress Points, DNS Resolvers, Endpoint Devices, Threat Intelligence Platforms'
  range: Last 90 days; daily aggregation with forecast confidence intervals
  queries:
  - technology: ML/SARIMA pseudocode
    query: "daily = count(distinct new_domains) by day (Last 90 days)\nmodel = SARIMA(daily).fit(); fc,\
      \ ci = model.forecast()\nif today_count > ci.upper: \n  for d in todays_new_domains: s,feat = clf.predict(d);\
      \ report(d, s, top3=feat)"
- question: Did more than 50 internal hosts query a single uncommon external domain - first seen within
    the last 24 hours and resolving to a newly observed IP - within a short time window?
  context: When many internal hosts suddenly converge on one brand-new domain, it can indicate mass redirection
    to an adversary-acquired server, for example through a compromised update channel, malvertising, or
    a watering hole. Count distinct hosts per domain within five-minute windows and alert when more than
    50 hosts query a domain first seen within the last 24 hours that resolves to a newly observed IP.
    Correlate Zeek dns.log and conn.log with Sysmon Event ID 22 to attribute queries to specific endpoints.
    Rapid, broad spreading to fresh infrastructure is anomalous and high-priority; a popular legitimate
    service would normally already exist in the baseline. Tune the host threshold to your environment
    size and segment the analysis per subnet where appropriate.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Sysmon Event ID 22
  - 'NAI: Internal DNS Resolvers, Network Egress Points, Endpoint Devices'
  range: Last 90 days; distinct-host counts in 5-minute windows; domain first seen <24 hours
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for d in domains:
        hosts = count_distinct(src_host) by d in 5min window
        if hosts > 50 and d.first_seen < 24h and resolves_to_new_ip(d):
          alert("rapid domain spread", domain=d, hosts=hosts)
- question: Are any uncommon external domains resolving across an anomalously diverse set of IPs or ASNs
    over a short window, consistent with fast-flux adversary server pools?
  context: Fast-flux is a hallmark of resilient adversary infrastructure where a single domain rapidly
    rotates across many hosting IPs and providers. Flag domains resolving across an anomalously diverse
    set of IPs or ASNs over a short window using IP-set clustering (per FluxBuster), and alert when a
    single uncommon domain rotates across more than five IPs or more than three ASNs within 24 hours.
    This symbolic-logic rule isolates the rotation behavior itself, which is rare among legitimate domains
    apart from large CDNs (which should be allowlisted). A flux-like footprint on an uncommon, recently
    seen domain strongly suggests an adversary-managed server pool built to evade takedown and blocklisting.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Sysmon Event ID 22
  - 'NAI: Internal DNS Resolvers, Network Egress Points, Endpoint Devices'
  range: Last 90 days; evaluate IP/ASN diversity over rolling 24-hour windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      for d in uncommon_domains:
        ips = distinct(resolved_ip) over 24h; asns = distinct(asn(ips))
        if count(ips) > 5 or count(asns) > 3: alert("fast-flux pool", domain=d, ips=ips, asns=asns)
  - technology: Zeek/pseudocode
    query: |-
      event dns_response:
        add flux[c$query][resp_ip]; add flux_asn[c$query][asn(resp_ip)]
        if |flux[c$query]| > 5 || |flux_asn[c$query]| > 3 in 24h: note FastFlux_Domain, domain=c$query
- question: Do hourly query counts for any domain exceed the mean plus three standard deviations of its
    14-day baseline, and what are the per-domain DNS resolution failure rates?
  context: Sudden spikes in query volume to a particular domain can mark the onset of activity against
    an adversary server. Use a 14-day moving average and standard deviation per domain and trigger when
    hourly query counts exceed mean plus three sigma. Separately track per-domain DNS resolution failure
    (NXDOMAIN/SERVFAIL) rates as an independent signal of staged or rotating infrastructure that is not
    yet fully online. A statistically significant volume spike, especially against a domain with a history
    of resolution failures, points to infrastructure being activated and adopted across the environment.
    Routine, established domains stay within their baseline band; investigate the hosts contributing to
    any spike.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Sysmon Event ID 22
  - 'NAI: Internal DNS Resolvers, Network Egress Points, Endpoint Devices'
  range: Last 90 days; 14-day moving baseline with hourly buckets
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for d in domains:
        mu = mean(hourly_count[d], 14d); sd = stdev(hourly_count[d], 14d)
        if hourly_count[d] > mu + 3*sd: alert("query spike", domain=d)
        fail_rate = rate(rcode in [NXDOMAIN,SERVFAIL]) by d; track(fail_rate)
- question: Do per-domain query time series show change points or regular beaconing periodicity that distinguish
    automated callbacks to an adversary server from human browsing?
  context: Automated callbacks to a controlled server differ statistically from human-driven traffic.
    Apply online change-point detection to per-domain query time series to surface subtle shifts in mean
    or variance that indicate a new campaign starting, and apply FFT or autocorrelation regularity scoring
    (per BAYWATCH and RITA) to identify the periodic, machine-like cadence of beaconing. Report the top
    contributing features in each alert. A clear change point coupled with strong periodicity is highly
    indicative of beaconing to an adversary-acquired server; irregular, bursty patterns aligned with working
    hours are more consistent with human browsing. This ML method catches low-and-slow callbacks that
    volume thresholds alone would miss.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Sysmon Event ID 22
  - 'NAI: Internal DNS Resolvers, Network Egress Points, Endpoint Devices'
  range: Last 90 days; continuous time-series with change-point and FFT analysis
  queries:
  - technology: ML/Time-series pseudocode
    query: |-
      for d in domains:
        cp = online_changepoint(query_ts[d])
        period_score = max(autocorr(query_ts[d])) or fft_peak(query_ts[d])
        if cp and period_score > beacon_threshold:
          alert("beaconing/changepoint", domain=d, top_features=contribs)
