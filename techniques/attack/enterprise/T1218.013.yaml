questions:
- question: '[Stealth] Mavinject parent and flag invariant: Can you determine whether mavinject execution
    performs DLL injection and is followed by suspicious target-process network activity, where injected
    module intelligence and destination reputation together indicate malicious proxy execution behavior.
    Use process creation telemetry for command-line, parent-process, and user context. Validate the behavior
    against Zeek connection and DNS telemetry for destination, timing, and reputation context. Use file-creation
    or file-transfer telemetry to confirm path, hash, and create timing. -- specifically, using the ''Mavinject
    parent and flag invariant'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the adversary''s information requirement
    is: "Is the adversary attempting to evade defenses by proxying execution through signed binaries?"
    Mavinject.exe is a Microsoft-signed App-V injector that adversaries abuse to proxy execution of malicious
    code into trusted processes, defeating allow-listing and signature-based controls. This evidence focuses
    on the condition that mavinject execution performs DLL injection and is followed by suspicious target-process
    network activity, where injected module intelligence and destination reputation together indicate
    malicious proxy execution behavior. Use process creation telemetry for command-line, parent-process,
    and user context. Validate the behavior against Zeek connection and DNS telemetry for destination,
    timing, and reputation context. Use file-creation or file-transfer telemetry to confirm path, hash,
    and create timing. This Symbolic Logic approach works as follows: Correlate the relevant process,
    file, and network telemetry before applying the rule. Alert on any mavinject.exe (Windows Event ID
    4688 / Sysmon EID 1) whose command line contains ` /INJECTRUNNING ` or `/HMODULE` and whose parent
    is NOT `C:\Windows\System32\AppVClient.exe`, the sole legitimate invoker; on fleets that do not deploy
    App-V, treat ANY mavinject execution as suspicious ([Mavinject Inject DLL Into Running Process, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_lolbin_mavinject_process_injection.yml);
    [Mavinject, LOLBAS](https://lolbas-project.github.io/lolbas/Binaries/Mavinject/)). A positive result
    -- a rule match, statistical outlier, or model alert -- suggests mavinject.exe is being used to inject
    code into another process for stealthy proxy execution rather than as part of a legitimate App-V workflow;
    pivot to the responsible mavinject command line, its parent process and user, the injected DLL path
    and hash, the target process and its subsequent module loads, remote threads, and outbound network
    connections. A negative result helps rule out this proxy-execution vector for the observed window
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy or low-and-slow injection.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 8
