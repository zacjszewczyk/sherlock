name: 'T1218.013: System Binary Proxy Execution: Mavinject'
id: 52788936-ddb2-41f1-96e9-4eab338ff9cb
description: 'This playbook helps an analyst investigate whether an adversary is abusing the Microsoft
  Application Virtualization Injector (mavinject.exe) to proxy execution of malicious code under the Stealth
  tactic by injecting code into legitimate, often Microsoft-signed, processes. Because mavinject.exe is
  a signed living-off-the-land binary (LOLBin), adversaries use its /INJECTRUNNING parameter to perform
  DLL injection and its /HMODULE parameter to perform import descriptor injection, masking arbitrary code
  execution under a trusted process and evading security products. It guides the hunt across several behavioral
  angles on Windows endpoints and servers: process-creation analysis of mavinject command lines, parent-process
  context, and user context (the only legitimate parent is AppVClient.exe); detection of injection from
  suspicious or non-standard DLL paths (C:\Windows\Temp, %APPDATA%, C:\Users\Public, alternate data streams),
  renamed-binary evasion via PE OriginalFileName, suspicious parent-to-sensitive-target chains (e.g.,
  winword.exe -> mavinject.exe -> lsass.exe), and first-time/anomalous-volume execution baselining. It
  corroborates injection with Sysmon ProcessAccess (EID 10), CreateRemoteThread (EID 8), and module-load
  (EID 7) telemetry, and validates post-injection behavior against Zeek conn/dns/files telemetry for destination
  reputation, novelty, and failure signals. Detection methods combine symbolic-logic rules, statistical
  baselining (prevalence, rarity, moving averages, novelty scores), and machine-learning models (Isolation
  Forest, graph anomaly detection, sequence models, time-series residual analysis, and traffic classifiers),
  so the analyst can confirm suspected mavinject proxy execution against command line, process lineage,
  injected-module intelligence, and exfiltration context.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
