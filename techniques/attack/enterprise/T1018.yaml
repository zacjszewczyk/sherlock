name: 'T1018: Remote System Discovery'
id: 1c9a7310-9fd1-4ed3-89ed-91f833e85fc1
description: 'Investigate signs that an adversary has begun active internal reconnaissance by enumerating
  remote systems on the network (MITRE ATT&CK T1018, Remote System Discovery). This playbook helps a SOC
  analyst hunt for and triage host- and network-based evidence that an actor is building a map of reachable
  internal systems by IP, hostname, or other logical identifier to enable later lateral movement. It covers:
  execution of non-native scanner binaries (e.g., Nmap, masscan, Advanced IP Scanner) correlated with
  their network signatures; automated or scripted use of native discovery utilities (ping, net, arp, tracert,
  nltest); PowerShell and WMI enumeration (Test-Connection, Get-CimInstance, Resolve-DnsName, wmic /node:)
  of multiple targets; horizontal and vertical network scanning evidenced by high connection fan-out and
  elevated failed-to-successful connection ratios; and post-logon fan-out where a freshly authenticated
  remote session rapidly touches many internal hosts on administrative ports. For each behavior the playbook
  pairs a deterministic detection floor with statistical baselining and machine-learning outlier scoring,
  drawing on endpoint logs (Windows Event IDs 4688/4104/4624, Sysmon, auditd, macOS unified log/osquery,
  ESXi and network-device command logs) and network telemetry (Zeek conn/http/dns/notice logs).'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any host execute a known non-native remote-discovery or scanner binary (e.g., nmap.exe,
    masscan.exe, Advanced_IP_Scanner.exe, angryip, fping), or generate network traffic carrying scanner
    signatures such as an 'Nmap Scripting Engine' User-Agent?
  context: Discovery (TA0007) frequently begins with an adversary staging and running a purpose-built
    scanner that is not part of the normal OS toolset. By matching process creation events (Windows EID
    4688 / Sysmon EID 1) on ProcessName, OriginalFileName, or file hash against a curated watchlist of
    unauthorized discovery tools and known threat-intel hashes, and corroborating with Zeek http.log User-Agent
    strings unique to those tools, you get a high-confidence, protocol-aware first-party detection. A
    positive result (watchlisted binary executing, especially on a DMZ server, ingress/egress host, or
    developer workstation where such tools may be illegitimately staged) is a strong indicator of active
    internal recon and should be triaged immediately with parent process, user, and destination context.
    A negative result narrows the hunt toward native-tool or scripted enumeration covered by other questions.
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Endpoints and servers across all user and data center subnets, with a focus on ingress/egress
    points, DMZ servers, and developer workstations where such tools might be illegitimately staged or
    used.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (WinEventLog:Security EID=4688, WinEventLog:Sysmon EID=1)\n| where lower(NewProcessName)\
      \ IN watchlist_tools\n   OR lower(OriginalFileName) IN watchlist_tools\n   OR Hashes IN threatintel_hashes\n\
      | table _time, host, User, ParentProcessName, NewProcessName, CommandLine, Hashes"
  - technology: Zeek/pseudocode
    query: 'from http.log

      | where user_agent matches /(Nmap Scripting Engine|masscan|ZGrab|Advanced IP Scanner)/

      | join (conn.log) on uid

      | stats count, dcount(id.resp_h) AS dst_hosts by id.orig_h, user_agent'
- question: Which executables are statistically rare across the fleet (below the 1st percentile of prevalence)
    and, immediately after running, fan out to more than 20 distinct internal hosts within five minutes?
  context: Adversary tooling is, by definition, uncommon in a healthy enterprise. Over a 30-day rolling
    window, compute each executable name's prevalence (fraction of endpoints running it and total execution
    count) and flag any execution that is both rare (below the 1st percentile) AND followed by a rapid
    connection fan-out to many internal hosts (a Volume signal characteristic of scanning). Derive the
    percentile cutoff and the fan-out floor from your own baseline rather than fixed constants. This catches
    novel or renamed scanners that evade a static watchlist. Enrich every hit with parent process, user
    context, and command line so an analyst can quickly distinguish a sanctioned admin tool from adversary
    recon; a rare binary run by a service or web-server account that then probes a subnet is high priority.
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Endpoints and servers across all user and data center subnets, with a focus on ingress/egress
    points, DMZ servers, and developer workstations where such tools might be illegitimately staged or
    used.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from process_creation (last 30d)\n| stats dc(host) AS host_spread, count AS execs by NewProcessName\n\
      | eval prevalence = host_spread / total_hosts\n| where prevalence <= percentile(prevalence, 1)\n\
      | join NewProcessName [ from conn.log within 5m of exec\n    | stats dc(id.resp_h) AS fanout by\
      \ host, exec_time ]\n| where fanout > 20\n| table host, User, ParentProcessName, NewProcessName,\
      \ CommandLine, prevalence, fanout"
- question: When process-plus-flow behavior is scored with an unsupervised outlier model, which executions
    are flagged as anomalous, and what features (e.g., unsigned binary, high destination entropy, high
    REJ ratio) drove the score?
  context: Some recon tooling will be neither watchlisted nor obviously rare, so a model-based safety
    net adds coverage. Build feature vectors per process+flow (parent process, command-line length and
    entropy, code-signing status, count of distinct post-execution destinations, failed-connection ratio)
    and score them with an Isolation Forest or one-class model trained/validated on a labeled corpus such
    as the Unified Host and Network Data Set. Flag outliers and, critically, surface the top-3 contributing
    features in the alert so the analyst understands why it fired and can confirm or dismiss it. Keep
    the deterministic watchlist rule running in parallel as the floor of determinism; the ML layer extends
    detection to unknown tools, while the rule guarantees known-bad is never missed.
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Endpoints and servers across all user and data center subnets, with a focus on ingress/egress
    points, DMZ servers, and developer workstations where such tools might be illegitimately staged or
    used.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [parent_proc, cmdline_len, cmdline_entropy, signed,\n            distinct_dst_count,\
      \ failed_conn_ratio]\nmodel = IsolationForest().fit(baseline_features)   # UHND dataset\nscore =\
      \ model.decision_function(features)\nif score < outlier_threshold:\n    alert(host, proc, top3_feature_contributions(features))"
- question: Did a host run native enumeration commands (net view, net /domain, net group 'Domain Computers',
    nltest /dclist) from a non-interactive or service-account parent process such as wmiprvse.exe, svchost.exe,
    or w3wp.exe rather than an interactive user shell?
  context: Adversaries abuse the OS's own utilities (living off the land) to enumerate domain computers
    and trusts without dropping new binaries. Legitimate use of net.exe and nltest usually descends from
    an interactive shell launched by explorer.exe; execution under wmiprvse.exe, svchost.exe, a web-server
    worker (w3wp.exe), or a service account strongly suggests scripted or remotely-driven discovery. Alert
    on process creation (Windows EID 4688 / Sysmon EID 1) where the command line matches these discovery
    patterns and the parent is non-interactive. A positive on a Domain Controller, application server,
    or bastion host is especially significant because those assets give the adversary the richest view
    of the environment. A negative does not clear the host — pair it with the frequency and clustering
    questions below.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, with heightened monitoring on critical assets like Domain
    Controllers, application servers, bastion hosts, and administrator workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (EID=4688, Sysmon EID=1)\n| where (lower(NewProcessName) endswith 'net.exe' AND\
      \ CommandLine matches\n        /(view|/domain|group \"Domain Computers\")/)\n   OR CommandLine matches\
      \ /nltest\\s+/dclist/\n| where lower(ParentProcessName) IN (wmiprvse.exe, svchost.exe, w3wp.exe)\n\
      \   OR User IN service_accounts\n| table _time, host, User, ParentProcessName, CommandLine"
- question: On a per-host basis, did execution of ping.exe, net.exe, arp.exe, or tracert.exe in any hour
    exceed three standard deviations above that host's seasonal (hour-of-day, day-of-week) baseline, corroborated
    by a burst of ICMP/connection attempts in Zeek conn.log?
  context: Scripted discovery produces execution rates far above what a human admin generates. For each
    host, baseline 30-day hourly counts of the native discovery utilities keyed by hour-of-day and day-of-week
    (capturing legitimate seasonality such as morning logon scripts), then alert when an hour's count
    exceeds 3 standard deviations above that seasonal mean. Corroborating the spike with a fan-out of
    ICMP/connection attempts in Zeek conn.log (a Volume signal) reduces false positives from benign bursts.
    Per-node profile baselining follows network-wide anomaly detection via the Dirichlet process; derive
    all thresholds from your own telemetry. This is tactic-specific to Discovery because rapid, repetitive
    enumeration is the operational signature of an actor mapping reachable hosts.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, with heightened monitoring on critical assets like Domain
    Controllers, application servers, bastion hosts, and administrator workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from process_creation

      | where NewProcessName IN (ping.exe, net.exe, arp.exe, tracert.exe)

      | bin _time span=1h | eval hod=hour, dow=weekday

      | stats count AS c by host, hod, dow, _time

      | eventstats avg(c) AS mu, stdev(c) AS sd by host, hod, dow

      | where c > mu + 3*sd

      | join host [ from conn.log | stats dc(id.resp_h) AS fanout by host, hour ]

      | where fanout > baseline_fanout'
- question: When hosts are clustered on their command-line usage features, which hosts fall into noise
    points or tiny clusters, and does sequence-anomaly scoring of the ordered discovery commands flag
    an unusual chain?
  context: Adversary recon often looks behaviorally distinct from the bulk of endpoints. Cluster hosts
    on command-line usage feature vectors (command frequency, argument patterns, distinct-target counts,
    time-of-day) using DBSCAN; hosts labeled as noise or sitting in very small clusters warrant investigation
    because they deviate from normal population behavior. Complement this with sequence anomaly scoring
    (e.g., DeepLog) over the ordered sequence of discovery commands per host, which catches abnormal command
    chains even when individual commands look benign. Surface the top-3 anomalous events in the alert
    for triage, and retain the deterministic non-interactive rule in parallel so known-bad patterns are
    never missed. Both methods target the Discovery tactic by detecting the patterned, automated enumeration
    that distinguishes recon from routine administration.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, with heightened monitoring on critical assets like Domain
    Controllers, application servers, bastion hosts, and administrator workstations.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'vectors = per_host(cmd_freq, arg_patterns, distinct_targets, time_of_day)

      labels = DBSCAN(eps, min_samples).fit_predict(vectors)

      investigate hosts where label == -1 or cluster_size < k

      seq_model = DeepLog().fit(normal_cmd_sequences)

      if seq_model.anomaly(host_cmd_sequence): alert(host, top3_anom_events)'
- question: Did PowerShell script-block logs (EID 4104) or wmic show discovery cmdlets (Test-Connection,
    Get-CimInstance, Get-WmiObject, Resolve-DnsName, Test-NetConnection) or 'wmic /node:' loops targeting
    many hosts from a variable, a Get-Content list, or more than ten comma-separated hostnames?
  context: 'PowerShell and WMI provide rich, scriptable remote-enumeration primitives that adversaries
    favor because they blend into administrative activity. The tell of malicious use is breadth and automation:
    a discovery cmdlet whose target is a variable, the output of Get-Content (reading a host list from
    disk), or a long comma-separated list of hostnames, as well as ''wmic /node:'' iterating across nodes.
    Alert on EID 4104 script blocks matching these cmdlets with such scripted target patterns. This is
    especially relevant on servers with PowerShell Remoting or WMI enabled (SCCM/management servers, Domain
    Controllers, Exchange). A positive originating from a non-admin user, a service account, or a web-server
    process is a strong Discovery indicator; a negative steers the hunt to raw connection-volume analysis
    below.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, particularly those with PowerShell Remoting or WMI enabled
    for remote management, such as application servers, management servers (e.g., SCCM), Domain Controllers,
    and Exchange servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from WinEventLog:PowerShell EID=4104\n| where ScriptBlockText matches /(Test-Connection|Get-CimInstance|Get-WmiObject|\n\
      \        Resolve-DnsName|Test-NetConnection)/\n| where ScriptBlockText matches /(\\$\\w+|Get-Content|(,\\\
      s*[\\w.-]+){10,})/\n   OR ScriptBlockText matches /wmic\\s+/node:/\n| table _time, host, User, ScriptBlockText"
- question: For each host, did outbound WinRM (5985/5986) and WMI/RPC (135 + ephemeral) connection volume
    exceed the 99th percentile of non-admin hosts, or did the failed-connection ratio for first-contact
    destinations cross a sequential-test decision bound?
  context: Even when the script content is obfuscated, the resulting remoting traffic reveals enumeration.
    Per host, baseline outbound WinRM and WMI/RPC connection volume and the failed-to-successful ratio
    (Zeek conn_state SF versus REJ/RSTO/S0). Alert when volume exceeds the 99th percentile across non-admin
    hosts (Volume) OR when the failed-connection ratio for first-contact destinations crosses a TRW-style
    threshold from sequential hypothesis testing — explicitly embracing failure-mode awareness, since
    probing many hosts produces many failed first contacts. Derive percentiles from your own data. A high
    failure ratio combined with broad fan-out is the signature of a host sweeping the network via remoting
    protocols rather than performing legitimate point administration, directly supporting the Discovery
    hypothesis.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, particularly those with PowerShell Remoting or WMI enabled
    for remote management, such as application servers, management servers (e.g., SCCM), Domain Controllers,
    and Exchange servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from conn.log\n| where id.resp_p IN (5985,5986,135) OR service IN (winrm, dce_rpc)\n| stats\
      \ count AS vol,\n        sum(eval(conn_state IN (REJ,RSTO,S0))) AS fails,\n        sum(eval(conn_state==SF))\
      \ AS oks by id.orig_h\n| eval fail_ratio = fails/(fails+oks+1)\n| where vol > p99(vol among non_admin_hosts)\
      \ OR fail_ratio > trw_bound"
- question: Does a time-series model of per-host outbound WinRM/WMI/RPC connection volume show a sharp
    spike from a host not designated as an administrative server, and what features (destination count,
    port mix, deviation magnitude) explain it?
  context: Administrative remoting volume tends to be predictable per host, so departures from the learned
    pattern are informative. Model each host's outbound WinRM/WMI/RPC connection volume as a time series
    (ARIMA or Prophet) and flag sharp spikes — particularly from hosts that are not designated administrative/management
    servers and therefore should not be initiating broad remote management. Report the top-3 contributing
    features (destination count, port mix, deviation magnitude) so the analyst can judge whether the spike
    reflects a sanctioned change or adversary discovery. Validate against the Unified Host and Network
    Data Set and keep the deterministic 4104 rule as the floor of determinism. This complements the volume/failure
    baseline by catching anomalies in temporal shape that a static percentile might miss.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, particularly those with PowerShell Remoting or WMI enabled
    for remote management, such as application servers, management servers (e.g., SCCM), Domain Controllers,
    and Exchange servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for host in hosts:\n    ts = hourly_outbound_remoting_volume(host)\n    model = Prophet().fit(ts)\
      \              # or ARIMA\n    if observed > forecast_upper(model) and host not in admin_servers:\n\
      \        alert(host, top3=[dst_count, port_mix, deviation_magnitude])"
- question: Did Zeek raise Scan::Address_Scan or Scan::Port_Scan notices, or did any single source contact
    more than 100 distinct internal destination IPs on one port (horizontal) or more than 100 distinct
    ports on one IP (vertical) within five minutes with mostly S0/REJ/RSTO connection states?
  context: Network scanning is one of the most direct expressions of Remote System Discovery. Zeek's built-in
    Scan::Address_Scan and Scan::Port_Scan notices provide a stateful, policy-script detection of these
    patterns; augment them with a deterministic threshold rule (>100 distinct destination IPs on a single
    port for horizontal sweeps, or >100 distinct ports on a single IP for vertical sweeps, within a 5-minute
    window) where the majority of connections are unestablished (conn_state S0/REJ/RSTO). Monitoring at
    core span/tap ports, segment gateways, and data-center distribution switches gives broad visibility.
    A positive is high-confidence scanning activity warranting immediate scoping of the source host; the
    failed-state condition distinguishes scanning from legitimate high-volume services.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek dns.log
  - 'NAI: Core network switch span/tap ports, internal network segment gateways, virtual network taps
    in the cloud, and data center distribution layer switches.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from notice.log where note IN (Scan::Address_Scan, Scan::Port_Scan)

      UNION

      from conn.log within 5m window

      | where conn_state IN (S0, REJ, RSTO)

      | stats dc(id.resp_h) AS dhosts, dc(id.resp_p) AS dports by id.orig_h

      | where dhosts > 100 OR dports > 100'
- question: Applying Wald's Sequential Probability Ratio Test to each source's first-contact connection
    successes and failures, which sources are declared scanners, and which exceed the enterprise 99th-percentile
    breadth score?
  context: Threshold rules can be evaded by slow or low-volume scanning, so a statistically principled
    detector adds rigor. Apply Wald's Sequential Probability Ratio Test (SPRT) to each source's sequence
    of failed-versus-successful first-contact connections, declaring a host a scanner once the likelihood
    ratio crosses the bound set by your chosen alpha/beta error rates — typically after only ~4-5 failed
    first contacts, giving fast, low-false-positive detection. In parallel compute a per-host breadth
    score = (distinct id.resp_h * distinct id.resp_p) / (total_connections + 1) and alert above the enterprise
    99th percentile (a Volume/breadth signal). Together SPRT and the breadth score catch both the failure-mode
    and the spread characteristics of Discovery scanning.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek dns.log
  - 'NAI: Core network switch span/tap ports, internal network segment gateways, virtual network taps
    in the cloud, and data center distribution layer switches.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "# SPRT on first-contact outcomes per source\nfor src in sources:\n    LLR += log(P_fail|scanner\
      \ / P_fail|benign) per first_contact\n    if LLR > log((1-beta)/alpha): declare_scanner(src)\n#\
      \ breadth score\n| stats dc(id.resp_h) AS H, dc(id.resp_p) AS P, count AS N by id.orig_h\n| eval\
      \ score = (H*P)/(N+1) | where score > p99(score)"
- question: When 5-minute per-host Zeek conn.log windows are scored by an unsupervised flow-outlier model,
    which windows are anomalous, and which features (destination IP/port entropy, protocol mix, failed-connection
    ratio) drove the score?
  context: Scanning behavior is well captured by aggregate flow features over short windows. Train an
    Isolation Forest or one-class SVM on normal 5-minute per-host Zeek conn.log feature vectors (connection
    count, destination IP entropy, destination port entropy, protocol mix, mean duration, failed-connection
    ratio), then classify new windows and alert on outliers. High destination IP or port entropy combined
    with a high failed-connection ratio is the unsupervised fingerprint of horizontal/vertical scanning.
    Surface the top-3 features driving each alert for explainability, train/validate on the Unified Host
    and Network Data Set, and keep the deterministic Zeek scan thresholds in parallel. This catches stealthier
    scans whose per-rule counts stay under static thresholds but whose window-level statistics still deviate
    from the host's norm.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek dns.log
  - 'NAI: Core network switch span/tap ports, internal network segment gateways, virtual network taps
    in the cloud, and data center distribution layer switches.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = per_host_5min(conn_count, dst_ip_entropy, dst_port_entropy,\n                 \
      \        proto_mix, mean_duration, failed_ratio)\nmodel = IsolationForest().fit(normal_windows)\
      \   # UHND dataset\nif model.decision_function(window) < threshold:\n    alert(host, window, top3_feature_contributions(window))"
- question: Within ten minutes of a successful remote logon (Windows EID 4624 Logon Type 3 or 10), did
    the logon source IP open connections to more than 20 unique internal IPs on administrative/service
    ports (135/139/445/3389)?
  context: A common adversary workflow is to authenticate to a host and immediately enumerate what else
    is reachable, producing a 'fan-out' pattern. Correlate successful remote logons (Windows EID 4624
    Logon Type 3 for network or 10 for RemoteInteractive) with subsequent Zeek conn.log activity from
    the same source IP, and alert when within 10 minutes the host reaches more than 20 unique internal
    IPs on 135/139/445/3389. Watching Domain Controllers (for logon events), VPN concentrators, bastion
    hosts, and segment gateways gives the needed visibility. Incorporating a never-before-accessed component
    (per Hopper and structural-login modeling) sharpens detection by emphasizing new destinations. A positive
    ties a specific authenticated identity to a burst of discovery, making it both high-confidence and
    immediately actionable.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Domain Controllers (for logon events), VPN Concentrators, Bastion Hosts, and internal network
    segment gateways (for correlated network traffic).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from WinEventLog:Security EID=4624 where LogonType IN (3,10)

      | join IpAddress -> conn.log id.orig_h within 10m after logon

      | where id.resp_p IN (135,139,445,3389)

      | stats dc(id.resp_h) AS fanout, dc(new_dst) AS new_edges by IpAddress, Account

      | where fanout > 20'
- question: For each account, did a session's post-login fan-out exceed four standard deviations above
    that user's mean (or the 98th percentile across users), and did the session create a burst of low-probability
    first-time host-to-host edges?
  context: 'Whether a fan-out is malicious depends on what is normal for that identity. For each account,
    baseline post-login fan-out (unique internal systems reached within 15 minutes of logon) and alert
    when a session exceeds 4 standard deviations above the user''s own mean or the 98th percentile across
    users. Additionally score first-time host-to-host edges with Bayesian new-edge prediction: a burst
    of low-probability new edges from a single session is a strong discovery signal because adversaries
    reach systems the legitimate user never touches. Build baselines from data such as the LANL User-Computer
    Authentication Dataset. This per-user approach catches recon by accounts whose absolute fan-out is
    modest but anomalous for them, complementing the deterministic threshold rule.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Domain Controllers (for logon events), VPN Concentrators, Bastion Hosts, and internal network
    segment gateways (for correlated network traffic).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from logon+conn correlation

      | stats dc(id.resp_h) AS fanout, collect(edge) AS edges by Account, session

      | eventstats avg(fanout) AS mu, stdev(fanout) AS sd by Account

      | where fanout > mu + 4*sd OR fanout > p98(fanout across users)

      | eval new_edge_burst = count(edges where bayes_edge_prob(edge) < tau)

      | where new_edge_burst > b'
- question: Modeling host-to-host communications as a directed graph, does a remote logon trigger rapid
    high-degree outbound edge creation that an unsupervised graph link-prediction model scores as structurally
    anomalous?
  context: Lateral discovery changes the structure of the host-communication graph in ways node- or user-level
    baselines miss. Model host-to-host communications as a directed graph and, on each remote logon, score
    structural change with unsupervised graph link-prediction (e.g., CyberGraph, temporal link prediction
    as in Euler, or a PCA/k-means/MAD ensemble over host-communication graphs). Flag rapid creation of
    many high-degree outbound edges from a single source — the graph-theoretic signature of a host suddenly
    probing many peers — and surface the top-3 contributing destinations/features for triage. Keep the
    deterministic fan-out rule in parallel as the floor of determinism. This method is tactic-specific
    to Discovery because it directly measures the abnormal breadth of new connections an adversary creates
    while mapping the network for subsequent lateral movement.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Domain Controllers (for logon events), VPN Concentrators, Bastion Hosts, and internal network
    segment gateways (for correlated network traffic).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = directed_graph(host_to_host_conns)\non each remote_logon(src):\n    score = graph_link_prediction_anomaly(G,\
      \ src)   # CyberGraph/Euler\n    if score > threshold and out_degree_growth(src) high:\n       \
      \ alert(src, top3_contributing_destinations(src))"
