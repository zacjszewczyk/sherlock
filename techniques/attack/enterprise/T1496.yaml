name: 'T1496: Resource Hijacking'
id: 9e5ea7a3-5045-4e22-96f0-38f16fff5426
description: 'This playbook helps an analyst investigate whether an adversary is hijacking the compute,
  GPU, or network resources of co-opted hosts, containers, or cloud accounts to mine cryptocurrency, sell
  bandwidth through proxyware, or abuse cloud messaging/SMS quotas -- degrading system and service availability
  under the Impact tactic. It guides the hunt across multiple behavioral angles spanning Windows, Linux,
  macOS, IaaS, containers, and SaaS: outbound connections to known cryptomining pool and proxyware C2/registration
  infrastructure matched against threat intel (Zeek conn/dns/ssl); execution of miner or proxyware binaries
  by name, command-line, and Stratum/JSON-RPC arguments (Windows 4688, Sysmon 1, auditd execve), including
  masqueraded system-process names running from non-allowlisted paths; statistically anomalous long-duration,
  byte-symmetric, low-jitter flows on non-standard or mining ports; Stratum protocol content and heartbeat
  inter-arrival signatures; sustained near-maximal CPU/GPU utilization beyond the 30-day workload baseline
  (perfmon, procfs, Prometheus, CloudWatch, and Hardware Performance Counters); cloud control-plane and
  orchestration abuse such as high-vCPU RunInstances bursts, unauthorized container launches, and messaging-quota
  abuse (CloudTrail, containerd, m365, SaaS); and low-CPU proxyware peer fan-out and relay behavior. Detection
  methods combine symbolic-logic rules, statistical baselining/percentile and entropy analysis, and machine-learning
  models (flow classifiers, clustering, time-series anomaly detection, and DeepLog sequence modeling)
  so the analyst can corroborate suspected resource hijacking across process lineage, resource footprint,
  network shape, and cloud control-plane context, accounting for throttling, renaming, encryption, and
  infrastructure rotation used to evade single detections.'
type: technique
