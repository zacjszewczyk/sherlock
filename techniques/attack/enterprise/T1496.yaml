questions:
- question: '[Impact] Join conn.log, dns.log, and ssl.log records by UID and match against mining/proxyware
    threat intel: Can you determine whether an internal host establishes a network connection where the
    destination IP address, DNS query, or TLS Server Name Indication (SNI) matches a known indicator of
    compromise (IOC) associated with cryptocurrency mining pools or resource hijacking command and control
    (C2) infrastructure -- specifically, using the ''Join conn.log, dns.log, and ssl.log records by UID
    and match against mining/proxyware threat intel'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary co-opts the compute, GPU,
    or network resources of victim systems to mine cryptocurrency, sell bandwidth via proxyware, or abuse
    cloud messaging/SMS quotas, degrading availability and inflating cost while often masquerading as
    legitimate workload. This evidence focuses on the condition that an internal host establishes a network
    connection where the destination IP address, DNS query, or TLS Server Name Indication (SNI) matches
    a known indicator of compromise (IOC) associated with cryptocurrency mining pools or resource hijacking
    command and control (C2) infrastructure. This Symbolic Logic approach looks for the following signal:
    Join conn.log, dns.log, and ssl.log records by UID. Match id.resp_h, query, and server_name against
    a threat-intel feed of known cryptomining pool domains/IPs AND proxyware registration/C2 endpoints
    (e.g., IPRoyal Pawns, peer2profit, Honeygain) as catalogued in [Proxyjacking: Attackers Abuse Cloud
    for Bandwidth Selling](https://sysdig.com/blog/proxyjacking-attackers-abuse-github-codespaces/) and
    [A First Look at Browser-Based Cryptojacking](https://arxiv.org/abs/1803.02887). Generate an alert
    for any match. Treat this as a tuned baseline list, not a sole control, since pools/domains flux frequently
    per [SoK: Cryptojacking Malware](https://arxiv.org/abs/2103.03851). A positive result -- a rule match,
    statistical outlier, or model alert -- suggests that a host, container, or cloud account is being
    used for resource hijacking; pivot to the responsible process or principal, its parent/lineage or
    identity, sustained CPU/GPU and network footprint, the destination infrastructure, and any persistence
    (cron, launch agents, container images, control-plane changes) used to keep the workload running.
    A negative result helps rule out this hijacking vector but should be corroborated with the other questions
    in this playbook, since adversaries throttle resources, rename binaries, encrypt traffic, and rotate
    pool/proxy infrastructure to evade any single method.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Egress points (e.g., firewalls, web proxies), DNS resolvers, Core network switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Join conn.log, dns.log, and ssl.log records by UID and match against mining/proxyware threat\
      \ intel\nsource IN [Zeek conn.log, Zeek dns.log, Zeek ssl.log]\n| WHERE matches_action_criteria(\"\
      Join conn.log, dns.log, and ssl.log records by UID and match against mining/proxyware threat intel\"\
      )\n// Join conn.log, dns.log, and ssl.log records by UID. Match id.resp_h, query, and server_name\
      \ against a threat-intel feed \n| ALERT enrich(host, user, process, parent, dest, cpu, container,\
      \ principal)"
  - technology: Zeek/pseudocode
    query: '# Resource-hijacking network correlation

      conn.log, dns.log, ssl.log, http.log

      | JOIN records by UID; profile per (id.orig_h)

      | AGG duration, orig:resp byte ratio, dest port, JA3, peer fan-out, heartbeat interval

      | match mining/proxyware IOCs and flag long, symmetric, periodic flows per action criteria'
