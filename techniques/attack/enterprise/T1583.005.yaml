questions:
- question: '[Resource Development] Match botnet CTI indicators: Can you determine whether a successful
    outbound network connection or an accepted inbound connection is established with an IP address or
    domain identified as botnet C2 infrastructure by a high-confidence threat intelligence source, and
    Windows Event ID 5156 captures the session. -- specifically, using the ''Match botnet CTI indicators''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary buys, leases,
    or rents a botnet -- a network of compromised systems (often EOL edge devices, VPS, SOHO routers,
    or IoT devices forming ORB networks) -- to support coordinated operations such as large-scale phishing,
    DDoS, proxying, or command-and-control against this organization. Much of the botnet acquisition happens
    outside the target''s visibility, so detection focuses on the observable effects: this evidence centers
    on the condition that a successful outbound network connection or an accepted inbound connection is
    established with an IP address or domain identified as botnet C2 infrastructure by a high-confidence
    threat intelligence source, and Windows Event ID 5156 captures the session. This Symbolic Logic approach
    works as follows: Join Zeek conn.log, dns.log, and Windows Event ID 5156 against high-confidence botnet
    C2 blocklists (IP/domain/JA3) from feeds such as [Feodo Tracker (abuse.ch)](https://feodotracker.abuse.ch/)
    and alert on any successful match; tag the matched family and feed name in the alert. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable interaction with or participation
    in botnet infrastructure; pivot to the responsible host and process, the user, the destination/source
    IPs, ASN and domain reputation, the TLS/HTTP fingerprints, connection cadence and volume, and any
    preceding recruitment or beaconing activity to scope the compromise and determine whether the host
    is a bot, a C2 contact, or the target of botnet-driven flooding. A negative result helps rule out
    this particular botnet behavior but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, jittered, encrypted, or low-and-slow botnet activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Internet gateways, DNS resolvers, web proxies, and perimeter firewalls.'
  range: Last 90 days (correlate event-centered windows of +/- 5 minutes around the activity)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match botnet CTI indicators (Symbolic Logic)

      source IN [Zeek conn.log, Zeek dns.log, Windows Event ID 5156]

      | approach: Join Zeek conn.log, dns.log, and Windows Event ID 5156 against high-confidence botnet
      C2 blocklists (IP/domain/JA3) from feeds such as [Feodo Tracker (abuse.ch)](https://feodotracker.abuse.ch/)
      and alert on any successful match; tag the matched family and feed name in the alert.

      | correlate over NAI: Internet gateways, DNS resolvers, web proxies, and perimeter firewalls.

      | emit alert with contributing fields and entity context (host, process, user, src/dst IP, ASN/domain
      reputation, JA3/JARM, cadence, volume)'
  - technology: Zeek/pseudocode
    query: '# Match botnet CTI indicators (Zeek view)

      watch conn.log/dns.log/http.log/ssl.log/notice.log for botnet-related behavior

      | join against CTI blocklists (IP/domain/JA3) and evaluate connection state (SF/S0/REJ), cadence,
      unique-destination count, NXDOMAIN rate

      | emit candidate hosts/sessions with src, dst, ASN, JA3/JARM, bytes, timing'
- question: '[Resource Development] Profile blocked/failed contacts to botnet IPs: Can you determine whether
    a successful outbound network connection or an accepted inbound connection is established with an
    IP address or domain identified as botnet C2 infrastructure by a high-confidence threat intelligence
    source, and Windows Event ID 5156 captures the session. -- specifically, using the ''Profile blocked/failed
    contacts to botnet IPs'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary buys, leases,
