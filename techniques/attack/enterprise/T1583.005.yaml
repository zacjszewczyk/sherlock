name: 'T1583.005: Botnet'
id: f4b1e69d-b56d-4823-8a0c-0b1d37b019ec
description: 'This playbook helps an analyst investigate whether an adversary is leveraging botnet infrastructure
  against this organization (MITRE ATT&CK T1583.005, Botnet) -- that is, a bought, leased, or rented network
  of compromised systems (commonly end-of-life Internet-facing edge devices, VPS, SOHO routers, and IoT
  devices assembled into operational relay box / ORB networks) used to carry out coordinated tasks such
  as large-scale phishing, Distributed Denial of Service (DDoS), proxying, and command-and-control. Because
  the acquisition of botnet capability largely occurs outside the target''s visibility, this hunt pursues
  the observable effects across network egress and ingress telemetry plus Windows endpoint logs from several
  complementary angles: outbound or inbound connections matching high-confidence botnet C2 threat intelligence
  (IP/domain/JA3) including blocked and failed contacts that still indicate infection; HTTP/TLS artifacts
  tied to known botnet families such as blacklisted User-Agents, rare JA3/JA3S hashes, and malicious JARM
  fingerprints correlated to the spawning process; volumetric DDoS patterns of half-open/rejected connections
  and source-IP diversity against internal services; internal hosts performing outbound scanning or DGA-style
  NXDOMAIN lookups indicative of bot recruitment and C2 rendezvous; and low-jitter, fixed-size automated
  beaconing to external destinations. Detection methods combine deterministic symbolic-logic rules (CTI
  blocklist joins, failure-state profiling, signature/fingerprint matching, volumetric and unique-destination
  thresholds, NXDOMAIN-rate rules, intel-backed and port-mismatch matching), statistical baselining (per-host
  risk scoring with CUSUM/PELT change-point detection, JA3/UA rarity, TLS handshake-failure ratios, source-IP
  Shannon entropy, destination-count and domain-entropy/Levenshtein baselines, and beacon inter-arrival
  CV/MAD/skewness analysis), and machine learning (Random Forest CTI scoring, Isolation Forest TLS outlier
  detection, ARIMA/LSTM volumetric forecasting, character-level LSTM DGA classification, DBSCAN/autoencoder
  host-behavior clustering, FFT periodicity detection, and CT-HMM/GNN beacon and shared-C2 fan-out modeling),
  with SHAP/LIME feature attribution surfaced for analyst triage. Telemetry spans Zeek conn/dns/http/ssl/notice
  logs and Windows Event IDs 5156 and 4688, so the analyst can corroborate suspected botnet participation,
  C2 contact, and DDoS targeting against process lineage, threat intelligence, network fingerprints, connection
  cadence, and volume.'
