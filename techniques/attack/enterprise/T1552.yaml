    by breadth (new secrets) and volume exceeding mean + 3σ, reporting the deviating attribute ([Kamra
    et al](https://link.springer.com/article/10.1007/s00778-007-0051-4)). A positive result -- a rule
    match, statistical outlier, or model alert -- indicates probable searching for, access to, or exfiltration
    of unsecured credentials; pivot to the responsible process and its parent lineage, the user, role,
    or service-account identity, the targeted credential files, secret stores, or registry keys, the source
    host and device context, and any subsequent outbound transfer or downstream authenticated use of the
    discovered secrets. A negative result helps rule out this particular credential-hunting vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    living-off-the-land, or cloud-native credential access.'
