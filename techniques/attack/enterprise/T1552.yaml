questions:
- question: '[Credential Access] Match credential searches to TI: Can you determine whether a network
    connection to a destination IP/domain on a threat intelligence list, originating from a host within
    10 minutes of that same host executing a process with command-line arguments matching credential-search
    patterns. -- specifically, using the ''Match credential searches to TI'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary hunts for and
    obtains insecurely stored credentials -- plaintext secrets, API keys, private keys, password and history
    files, registry-stored sessions, container secrets, and managed secret-store contents -- and often
    exfiltrates them, leaving traces across process-execution, file-access, command-execution, network,
    and cloud-audit telemetry. This evidence focuses on the condition that a network connection to a destination
    IP/domain on a threat intelligence list, originating from a host within 10 minutes of that same host
    executing a process with command-line arguments matching credential-search patterns. This Symbolic
    Logic approach works as follows: Correlate credential-hunting command lines (search utilities plus
    credential keywords/paths per [Basak et al](https://arxiv.org/pdf/2307.00714) and [Meli et al](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_04B-3_Meli_paper.pdf))
    with subsequent Zeek conn/dns entries and alert when the destination IP/domain matches threat intelligence;
    also alert on contact to the cloud metadata service 169.254.169.254 within 10 minutes of a credential
    search ([Falco default rules](https://falco.org/docs/reference/rules/default-rules/)). A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable searching for, access
    to, or exfiltration of unsecured credentials; pivot to the responsible process and its parent lineage,
    the user, role, or service-account identity, the targeted credential files, secret stores, or registry
    keys, the source host and device context, and any subsequent outbound transfer or downstream authenticated
    use of the discovered secrets. A negative result helps rule out this particular credential-hunting
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, living-off-the-land, or cloud-native credential access.'
