name: 'T1552: Unsecured Credentials'
id: 65071083-98fb-4ba1-8ca4-794b2c032ae4
description: 'This playbook helps an analyst investigate whether an adversary is searching for and obtaining
  insecurely stored credentials -- the Unsecured Credentials technique (T1552) under the Credential Access
  tactic. Adversaries comb compromised hosts and cloud control planes for plaintext secrets, API keys,
  private keys, password files, shell histories, registry-stored sessions, container secrets, and managed
  secret-store contents, then frequently exfiltrate them. The hunt spans Windows, Linux, macOS, containers,
  network devices, SaaS, IaaS, and identity-provider telemetry. It guides the analyst across several behavioral
  angles: process command lines invoking search utilities (findstr, grep, Select-String, reg query) against
  credential keywords, regexes, and known credential paths; high-volume reads of credential-like files
  (.pem,.key,.config,.bash_history, /etc/shadow, /run/secrets) by a single process; suspicious process
  lineage where document-handlers or web servers spawn shells that run credential searches; honeytoken
  tripwires; correlation of credential searches and file access with outbound network connections to threat-intelligence
  destinations, the cloud metadata service, or rare ASN/country/port egress; and anomalous secret retrieval
  from AWS Secrets Manager/SSM, Azure Key Vault, and GCP Secret Manager. Detection methods combine symbolic-logic
  rules, statistical baselining/rarity scoring, and machine-learning models (XGBoost classifiers, Isolation
  Forest, ARIMA/LSTM forecasting, provenance-graph GNNs) applied to Windows Security/Sysmon events, auditd,
  macOS unified logs, Zeek conn/dns/files logs, container runtime events, and cloud audit logs, so the
  analyst can corroborate suspected credential hunting against process behavior, file access, lineage,
  and downstream exfiltration.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
