name: 'T1592.002: Software'
id: c0048304-72e2-409d-b880-ca9c7a08b046
description: 'Investigate adversary reconnaissance aimed at gathering information about our organization''s
  host software — installed application types and versions, web/server banners, and the presence of defensive
  tooling (antivirus, EDR, SIEM) — that an attacker can cross-reference against known CVEs to plan exploitation,
  initial access, or supply-chain compromise. This playbook helps an analyst hunt the many ways software-recon
  manifests in telemetry: inbound connections from known scanners, TOR exit nodes, or C2 infrastructure
  on threat-intelligence feeds; HTTP/S requests bearing scanner User-Agents, JA3/JA3S fingerprints, or
  URI probes for sensitive paths; high-fan-out port scanning and bursts of 404/403 errors from a single
  source; verbose error pages and software/version banners leaked in HTTP responses; DNS queries to newly
  registered or ScanBox-style fingerprinting domains consistent with watering-hole attacks; bulk downloading
  of documents to harvest software metadata; and post-phishing endpoint software-enumeration commands
  (wmic, registry Uninstall-key reads, PowerShell, reg query, AV/EDR service checks). It pairs deterministic
  symbolic-logic floors with statistical baselining and machine-learning anomaly detection so software
  reconnaissance is defensible, explainable, and immediately actionable for a SOC.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any inbound connections in firewall logs or Zeek conn.log originating from a source IP
    that appears on a current threat-intelligence feed of known scanners, TOR exit nodes, or adversary
    C2 infrastructure, and can the match be corroborated with response-side artifacts such as TLS certificates,
    default banners, or JARM/JA3S fingerprints?
  context: 'This is the deterministic threat-intelligence floor for the Reconnaissance tactic. Correlate
    the source IP of every inbound perimeter connection against curated TI feeds of reconnaissance tooling,
    scanner ranges, TOR exit nodes, and known C2 infrastructure, and raise an alert on any match. Enrich
    and corroborate each match with response-side artifacts (TLS certs, default server banners, JARM/JA3S)
    as demonstrated in Mandiant''s SCANdalous work so a flagged IP is not just a list hit but a confirmed
    scanning host. A positive result indicates an external actor on known-bad infrastructure is touching
    our perimeter and likely probing our software; a negative result does not clear the source, since
    adversaries rotate fresh infrastructure, so keep this match as a floor beneath the statistical and
    ML methods and never gate it behind them. Reference: [SCANdalous, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/scandalous-external-detection-using-network-scan-data-and-automation/).'
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Network perimeter/internet gateway, Firewall logs, External-facing DNS servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'match = (firewall.log UNION conn.log) where src_ip in ti_feed(scanners | tor_exit | c2);

      enrich = join response_artifacts(tls_cert, server_banner, jarm, ja3s);

      alert on match; output src_ip, dst_ip, dst_port, matched_indicator, ja3s, cert_subject'
  - technology: Zeek/pseudocode
    query: 'for c in conn.log: if c.id.orig_h in ti_scanners_c2: alert(c.id.orig_h, c.id.resp_p, c.conn_state)'
- question: Over a 5-minute window, which external source IPs exhibit a destination-port fan-out (unique
    destination ports per unique destination IP) above the 99th percentile of the perimeter baseline,
    or an abnormally high ratio of failed/half-open connections (Zeek conn_state S0/REJ/RSTO) to successful
    (SF) sessions?
  context: 'Internet-wide enumeration of our software surface produces a distinctive single-source-to-many-destinations
    pattern with few or no completed sessions. For each source IP over a 5-minute window compute volume
    (total bytes/connections), frequency (unique destination ports per unique destination IP), and state
    (ratio of S0/REJ/RSTO to SF). Flag IPs whose fan-out exceeds the 99th percentile or whose failed-connection
    ratio is high, scoring sequentially in the spirit of the Threshold Random Walk so scanners are caught
    after a handful of failed first-contacts with bounded error. Derive percentile cutoffs from a rolling
    30-day baseline of your own perimeter rather than a fixed guess. In the Reconnaissance context, a
    high fan-out with mostly failed states is the hallmark of automated scanning quantified by tools like
    ZMap; a positive result warrants enrichment and watchlisting of the source. References: [Threshold
    Random Walk, Jung et al.](https://www.icir.org/vern/papers/portscan-oak04.pdf); [A Brief History of
    Scanning, Allman et al.](https://www.icir.org/mallman/pubs/APT07/APT07.pdf); [ZMap, Durumeric et al.](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_durumeric.pdf).'
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Network perimeter/internet gateway, Firewall logs, External-facing DNS servers'
  range: Last 90 days; baseline over rolling 30 days; evaluate in 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for src in conn.log window=5m:\n  fanout = distinct(resp_p) / distinct(resp_h)\n  fail_ratio\
      \ = count(conn_state in [S0,REJ,RSTO]) / max(count(conn_state=SF),1)\n  vol = sum(orig_bytes)+count(*)\n\
      baseline = percentile(fanout over 30d, 99)\nalert when fanout > baseline OR fail_ratio > p95(fail_ratio)\n\
      output src, fanout, fail_ratio, vol"
- question: When per-source inbound connection volume from high-risk ASNs or geolocations is forecast
    with a time-series model (ARIMA/EWMA) or scored by an unsupervised reconstruction-error detector,
    which sources exceed their predicted bounds, and what are the top-3 features (destination fan-out,
    failed-connection ratio, bytes/min) driving each anomaly?
  context: 'Static thresholds miss gradual ramp-ups and campaign-driven shifts in scanning volume. Apply
    time-series forecasting (ARIMA/EWMA) to per-source connection volume from high-risk ASNs/geolocations
    and flag observations exceeding predicted bounds, or alternatively run a Kitsune-style unsupervised
    reconstruction-error detector over incremental per-source flow statistics. The alert must surface
    the top-3 contributing features (destination fan-out, failed-connection ratio, bytes/min) so an analyst
    can triage quickly. In the Reconnaissance context, an unexpected volume surge from a suspect ASN with
    high fan-out and failed-state features is a strong indicator of an active software-enumeration sweep;
    feature attribution lets the analyst confirm it is scanning rather than a benign traffic spike before
    escalating. Reference: [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089).'
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Network perimeter/internet gateway, Firewall logs, External-facing DNS servers'
  range: Last 90 days; model trained on >=30 days of history
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = per_src connection_volume where asn in high_risk OR geo in high_risk

      yhat,sigma = ARIMA_or_EWMA.fit(series).predict(now)

      flag = src where observed > yhat + k*sigma

      alt = Kitsune.reconstruction_error(per_src_flow_stats); flag |= alt > thresh

      explain = top_k_features([fanout, fail_ratio, bytes_per_min], 3)

      output src, observed, yhat, explain'
- question: Do any inbound HTTP/S requests in Zeek http.log/ssl.log, web server access logs, or WAF logs
    carry a User-Agent, JA3/JA3S hash, or URI pattern matching known scanning tools (Nmap, Nikto, Metasploit)
    or probes for sensitive paths such as '/.git/config', '/wp-admin', or '/actuator'?
  context: 'This is the signature-based symbolic-logic floor for web-layer software reconnaissance. Alert
    when request fields match known scanner User-Agents (Nmap, Nikto, Metasploit), suspicious JA3/JA3S
    client/server hashes, or URI patterns that probe configuration files, admin consoles, and management
    endpoints. Use maintained community rules from SigmaHQ and keep them as a deterministic floor that
    runs regardless of the statistical/ML methods. A positive result is direct evidence an external actor
    is fingerprinting our web applications and frameworks to find versions and vulnerabilities; signatures
    can be evaded by changing User-Agents, so a clean result does not clear the source, but a specific
    match — particularly to sensitive-path probes — is highly actionable for the Reconnaissance tactic.
    Reference: [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Web Server Access Logs
  - WAF Logs
  - 'NAI: Public-facing web servers, Reverse proxies, Web Application Firewalls (WAFs)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "alert = (http.log UNION ssl.log UNION waf.log UNION web_access.log) where\n  user_agent matches\
      \ scanner_sigs(nmap|nikto|metasploit)\n  OR ja3 in scanner_ja3 OR ja3s in scanner_ja3s\n  OR uri\
      \ matches sensitive_paths('/.git/config','/wp-admin','/actuator')\noutput src_ip, host, uri, user_agent,\
      \ ja3, sig_id"
  - technology: Zeek/pseudocode
    query: 'load sigma_http_scanner_rules

      for r in http.log: if match(r.user_agent, r.uri) or r.ja3 in known: alert(r.id.orig_h, r.uri, r.user_agent)'
- question: Over a 1-hour window, which source IPs show a request rate, average URI character entropy
    (above the 98th percentile, indicating fuzzing), or 4xx error ratio (404/403/400) that significantly
    exceeds the 30-day site baseline?
  context: 'Automated web fuzzers and directory/path brute-forcers reveal themselves through high request
    frequency, high-entropy randomized URIs, and a large share of error responses as they guess at non-existent
    resources. For each source IP over a 1-hour window compute frequency (requests/min), the average character
    entropy of requested URIs (flag above the 98th percentile), and the 404/403/400 response ratio, treating
    the elevated error ratio as a distinct failure-mode signal. Derive percentile cutoffs from a rolling
    30-day site baseline so normal crawler and user behavior is excluded. In the Reconnaissance context,
    a single source combining high entropy and a high error ratio is enumerating our application''s paths
    and parameters to map installed software and find vulnerable endpoints; a positive result merits watchlisting
    and correlation with the signature method above. Reference: [A Brief History of Scanning, Allman et
    al.](https://www.icir.org/mallman/pubs/APT07/APT07.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Web Server Access Logs
  - WAF Logs
  - 'NAI: Public-facing web servers, Reverse proxies, Web Application Firewalls (WAFs)'
  range: Last 90 days; baseline over rolling 30 days; evaluate in 1-hour windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for src in http.log window=1h:\n  rate = count(*) / 60\n  uri_entropy = avg(shannon_entropy(uri))\n\
      \  err_ratio = count(status in [400,403,404]) / count(*)\nbase = baseline(site, 30d)\nalert when\
      \ uri_entropy > p98(base) OR err_ratio > p95(base) OR rate > p99(base)\noutput src, rate, uri_entropy,\
      \ err_ratio"
- question: When an explainable supervised model (logistic regression / Random Forest) trained on labeled
    scan flows scores an HTTP request as likely scanning, what probability does it assign and what are
    the top-3 contributing features (URI length, special-character count, User-Agent rarity, header count,
    per-source 404 rate)?
  context: 'This supervised method fuses the individual web-scan signals into a single calibrated, explainable
    score. Train logistic regression or Random Forest on features such as URI length, special-character
    count, User-Agent rarity, header count, and per-source 404 rate, using labeled scan flows from CICIDS2017
    for ground truth and feature-importance ranking. Output a probability per request and emit the top-3
    contributing features in the alert so an analyst can sanity-check why a request looks like scanning.
    In the Reconnaissance context, a high-probability classification with URI/feature attribution consistent
    with fuzzing is a defensible escalation that software enumeration is underway; the feature transparency
    reduces false positives by letting the analyst verify the model against the real request. Reference:
    [CICIDS2017, Sharafaldin et al.](https://www.scitepress.org/papers/2018/66398/66398.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Web Server Access Logs
  - WAF Logs
  - 'NAI: Public-facing web servers, Reverse proxies, Web Application Firewalls (WAFs)'
  range: Last 90 days; model trained on labeled historical window
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [uri_len, special_char_count, ua_rarity, header_count, src_404_rate]

      model = RandomForest.fit(CICIDS2017_labeled)

      p = model.predict_proba(features)

      alert when p > 0.8

      explain = feature_importance.top_k(features, 3)

      output src_ip, uri, p, explain'
- question: Does any single external source IP generate connection attempts to more than 100 unique destination
    ports on a host within a 1-minute window, indicating automated port scanning?
  context: 'This is the deterministic rate-based floor for port scanning at the network edge. Using engine
    rate primitives that track by source, count events, and bound them to a time window (e.g., Suricata
    thresholds), alert when one source IP touches more than 100 unique destination ports on a host within
    1 minute. Tune the count/window to your edge baseline rather than removing the rule. In the Reconnaissance
    context, rapid wide port enumeration from a single source is a clear attempt to discover which services
    and software our hosts expose; a positive result is high-confidence scanning and should be enriched
    against threat intel and correlated with the statistical/ML methods, while a negative result does
    not clear slower low-and-slow scans that the baselined methods below are designed to catch. Reference:
    [Suricata thresholds, OISF](https://docs.suricata.io/en/latest/configuration/global-thresholds.html).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Firewall Logs
  - 'NAI: Demilitarized Zone (DMZ), Network edge firewalls, Public-facing application servers'
  range: Last 90 days; evaluate in 1-minute windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert when count(distinct resp_p) by src_ip, resp_h within 1m > 100

      output src_ip, resp_h, distinct_port_count'
  - technology: Suricata/pseudocode
    query: 'detection_filter track by_src, count 100, seconds 60  # tune to edge baseline

      alert tcp any any -> $HOME_NET any (msg:"Port scan fan-out";)'
- question: Per source IP over a 5-minute window, what is the volume and frequency of connection attempts,
    the ratio of failed/half-open to successful connections (Zeek conn_state), and the HTTP 404 rate —
    and does the 404 rate exceed the 95th-percentile baseline while a sequential success/failure test
    flags the source as a scanner?
  context: 'Scanners produce many first-contact attempts that fail or hit non-existent resources. Compute
    per-source volume of connection attempts, frequency over a 5-minute window, the failed/half-open vs
    successful connection-state ratio, and the HTTP 404 rate. Flag sources whose 404 rate exceeds the
    95th-percentile baseline and apply the sequential success/failure test from Threshold Random Walk
    to flag scanners after roughly 4-5 failed first-contacts with bounded error. In the Reconnaissance
    context, a source with high failed-state and 404 rates is probing for live services and valid paths
    to map our software; treating failure rate as a distinct state signal catches enumeration that volume
    thresholds alone miss, and a positive result merits correlation with signature and threshold methods.
    Reference: [Threshold Random Walk, Jung et al.](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Firewall Logs
  - 'NAI: Demilitarized Zone (DMZ), Network edge firewalls, Public-facing application servers'
  range: Last 90 days; baseline over rolling 30 days; evaluate in 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for src window=5m:\n  vol = count(conn_attempts); freq = vol/5\n  fail_ratio = count(conn_state\
      \ in [S0,REJ,RSTO]) / max(count(conn_state=SF),1)\n  http404 = count(status=404)/max(count(http),1)\n\
      alert when http404 > p95(baseline) OR TRW_sequential(success,failure)=scanner\noutput src, vol,\
      \ fail_ratio, http404"
- question: When DBSCAN (or a KitNET-style reconstruction-error detector) is applied to connection events
    using destination-port fan-out, inter-arrival time, and failed-connection ratio, which events fall
    into sparse clusters, noise, or high-error points indicating scanning, and what are the top-3 features
    per alert?
  context: 'Unsupervised clustering separates automated scanning from normal traffic without labels. Apply
    DBSCAN — or KitNET-style reconstruction error per Kitsune — to connection events using features like
    destination-port fan-out, inter-arrival time, and failed-connection ratio, treating sparse clusters,
    noise points, and high-error observations as scanning. Validate the feature set against labeled PortScan
    flows in CICIDS2017 and surface the top-3 contributing features per alert. In the Reconnaissance context,
    a noise/outlier point characterized by high fan-out and failed connections is consistent with an external
    host enumerating our exposed software; the feature attribution lets the analyst confirm the anomaly
    is scanning rather than a benign rare client before escalating. References: [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089);
    [CICIDS2017, Sharafaldin et al.](https://www.scitepress.org/papers/2018/66398/66398.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Firewall Logs
  - 'NAI: Demilitarized Zone (DMZ), Network edge firewalls, Public-facing application servers'
  range: Last 90 days; model on rolling 30-day feature window
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = features(conn.log) = [port_fanout, inter_arrival_time, fail_ratio]

      labels = DBSCAN(eps, min_samples).fit_predict(normalize(X))

      flag = X where label = noise OR cluster_size small

      # or KitNET.reconstruction_error(X) > thresh

      explain = top_k_features(X, 3)

      output src_ip, label, explain'
- question: 'Do any HTTP responses to external source IPs in Zeek http.log or web server logs contain
    verbose errors (stack traces, SQL/database error strings) or software banners and version numbers
    (e.g., ''Server: Apache/2.4.29'', ''X-Powered-By: PHP/7.2''), often triggered by malformed or crafted
    requests?'
  context: 'Leaked stack traces, database errors, and software/version banners are the precise recon artifacts
    adversaries harvest to fingerprint our software and cross-reference CVEs. Use regex over HTTP response
    bodies and headers in Zeek or web server logs to detect stack traces, SQL error strings, and version
    banners, as characterized in Mandiant''s SCANdalous research. A positive result means our applications
    are disclosing exploitable version and framework detail to external clients — especially when correlated
    with the malformed/crafted probes that triggered them — and represents both an active reconnaissance
    signal and a hardening gap. In the Reconnaissance context this is a deterministic floor; flagged endpoints
    should be remediated to suppress banners and verbose errors, and the source IPs enriched and watchlisted.
    Reference: [SCANdalous, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/scandalous-external-detection-using-network-scan-data-and-automation/).'
  answer_sources:
  - Zeek http.log
  - Web Server Access Logs
  - 'NAI: Public-facing web servers and applications, Application-level logging systems'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for r in http.log:\n  if regex(r.resp_body, stack_trace|sql_error)\n     OR regex(r.resp_headers,\
      \ 'Server:.*/[0-9]'|'X-Powered-By:.*'):\n     alert(r.id.resp_h, r.uri, r.id.orig_h, matched_banner)\n\
      output server, uri, client_ip, banner"
  - technology: SIEM/Rule pseudocode
    query: 'alert = web_log where response matches (stacktrace_regex OR sql_error_regex OR version_banner_regex)

      output server, client_ip, status, banner'
- question: Does the distribution of HTTP status codes (2xx/3xx/4xx/5xx) per source or per endpoint shift
    significantly from baseline — for example a sudden 5xx spike from malformed probes — when tested with
    a Chi-squared goodness-of-fit test?
  context: 'Malformed or crafted probes that elicit verbose errors tend to perturb the status-code distribution,
    especially producing 5xx faults that are rare in normal traffic. Monitor the per-source and per-endpoint
    distribution of 2xx/3xx/4xx/5xx over time and apply a Chi-squared goodness-of-fit test against the
    baseline distribution to detect significant shifts, treating the 4xx/5xx failure rate as a distinct
    signal. Baseline expected distributions from historical site behavior. In the Reconnaissance context,
    a statistically significant shift — particularly a 5xx spike tied to one source or endpoint — indicates
    probing that is triggering application faults and harvesting the resulting error detail; a positive
    result merits correlation with the banner-regex floor to confirm what information was disclosed. Reference:
    [A Brief History of Scanning, Allman et al.](https://www.icir.org/mallman/pubs/APT07/APT07.pdf).'
  answer_sources:
  - Zeek http.log
  - Web Server Access Logs
  - 'NAI: Public-facing web servers and applications, Application-level logging systems'
  range: Last 90 days; baseline over rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for key in [src_ip, endpoint] window=1h:\n  obs = histogram(status_class in [2xx,3xx,4xx,5xx])\n\
      \  exp = baseline_distribution(key, 30d)\n  chi2, p = chisquare(obs, exp)\nalert when p < 0.01 OR\
      \ rate(5xx) > p95(baseline)\noutput key, chi2, p, fivexx_rate"
- question: When an LSTM or autoencoder trained on the per-application time series of HTTP response sizes
    flags outliers via reconstruction error, which responses are anomalous (consistent with error pages
    or banners altering response size), and what are the top-3 contributing features?
  context: 'Error pages, stack traces, and banner-laden responses change the size profile of an application''s
    HTTP responses. Train an LSTM or autoencoder on the time series of HTTP response sizes per application
    and flag outliers via reconstruction error, using a Kitsune-style per-feature reconstruction-error
    attribution and reporting the top-3 contributing features in the alert. In the Reconnaissance context,
    a response whose size the model cannot reconstruct — driven by length/structure features tied to error
    or banner content — suggests the application returned verbose recon-relevant detail in response to
    a probe; the feature attribution helps the analyst confirm the anomaly is error/banner disclosure
    rather than a benign large response before escalating. Reference: [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089).'
  answer_sources:
  - Zeek http.log
  - Web Server Access Logs
  - 'NAI: Public-facing web servers and applications, Application-level logging systems'
  range: Last 90 days; model trained on benign rolling window
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = per_app HTTP response_size time_series

      model = LSTM_or_Autoencoder.fit(benign_series)

      err = model.reconstruction_error(observed)

      mu,sd = stats(err_benign)

      alert when err > mu + 3*sd

      explain = top_k_error_features(observed, 3)

      output app, uri, response_size, err, explain'
- question: Does any internal endpoint issue a DNS query (Zeek dns.log) matching a threat-intel feed of
    fingerprinting/ScanBox domains or a domain registered within the last 30 days, and does served/loaded
    JavaScript (Zeek files.log/http.log) contain clusters of fingerprinting APIs such as font/plugin enumeration
    or navigator/screen probing?
  context: 'Watering-hole reconnaissance frameworks like ScanBox collect host-software detail from visitors
    via JavaScript fingerprinting, often served from newly registered or known-bad domains. Alert when
    a dns.log query matches a TI feed of fingerprinting/ScanBox domains or a domain registered within
    the last 30 days (NRD), and additionally scan served/loaded JavaScript for clusters of fingerprinting
    APIs — font/plugin enumeration, navigator/screen probing — that identify host-software reconnaissance
    as documented in FPDetective and Cookieless Monster. In the Reconnaissance context, an internal host
    reaching an NRD/ScanBox domain that then runs fingerprinting scripts indicates our users are being
    profiled for their installed software; a positive result is a strong watering-hole indicator warranting
    endpoint and proxy investigation. References: [FPDetective, Acar et al.](https://www.securitee.org/files/fpdetective_ccs2013.pdf);
    [Cookieless Monster, Nikiforakis et al.](https://www.securitee.org/files/cookieless_sp2013.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Internal user workstations, DNS resolvers, Egress points/Network proxy servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for q in dns.log: if q.query in ti_scanbox_domains OR domain_age(q.query) < 30d: alert_nrd(q)\n\
      for f in files.log JOIN http.log:\n  if js_contains_fingerprint_apis(f, font_enum|plugin_enum|navigator|screen):\
      \ alert_fp_script(f)\noutput host, query, domain_age, script_url"
  - technology: SIEM/Rule pseudocode
    query: 'alert = dns.log where query in nrd_or_scanbox_feed

      join http.log/files.log where served_js matches fingerprint_api_cluster

      output host, domain, script_url'
- question: Which internal hosts issue daily queries to newly registered domains (NRDs) at a rate exceeding
    3 standard deviations above the peer-group mean, and do those same domains show elevated NXDOMAIN
    (failed resolution) rates?
  context: 'A host being funneled toward watering-hole or fingerprinting infrastructure often shows an
    abnormal volume of NRD queries relative to its peers. Baseline daily queries to newly registered domains
    per host (volume/frequency) and flag any host exceeding 3 standard deviations from the peer-group
    mean, with cutoffs derived from a rolling 30-day baseline. Also profile failed resolutions (NXDOMAIN)
    to the same domains as a distinct failure-mode signal, since recon/staging domains can churn. In the
    Reconnaissance context, a host with anomalously high NRD query rates is a candidate victim of watering-hole
    software profiling; a positive result merits pivoting to the served-JavaScript and outbound-connection
    methods to confirm fingerprinting activity. Reference: [A Brief History of Scanning, Allman et al.](https://www.icir.org/mallman/pubs/APT07/APT07.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Internal user workstations, DNS resolvers, Egress points/Network proxy servers'
  range: Last 90 days; baseline over rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for host: nrd_count = count(dns.query where domain_age < 30d) per day

      peer_mu, peer_sd = stats(nrd_count over peer_group, 30d)

      nxd = count(dns where rcode=NXDOMAIN to same domains)

      alert when nrd_count > peer_mu + 3*peer_sd

      output host, nrd_count, peer_mu, nxd'
