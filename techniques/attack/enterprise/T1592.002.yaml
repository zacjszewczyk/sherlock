- question: Does any single external source IP download more than 20 documents (.pdf/.docx/.xlsx/.pptx)
    within a 1-hour window from public-facing servers, consistent with bulk harvesting to extract software/version
    metadata?
  context: 'Adversaries harvest victim-owned documents in bulk to mine their metadata for software versions,
    configurations, and timestamps that reveal outdated or vulnerable tooling. Alert when a single source
    IP downloads more than 20 documents (.pdf/.docx/.xlsx/.pptx) within a 1-hour window from public-facing
    servers, the document-metadata recon vector described by Outpost24. Tune the count/window to your
    site baseline rather than deleting the rule. In the Reconnaissance context, a positive result indicates
    an external actor is mass-collecting our published documents to fingerprint the software used to create
    them; the source should be enriched and watchlisted, and the result correlated with the per-IP baselining
    and clustering methods to distinguish a targeted harvester from a benign crawler. Reference: [Metadata:
    The Hidden Attack Vector, Outpost24](https://outpost24.com/blog/metadata-the-hidden-attack-vector/).'
  answer_sources:
  - Web Server Access Logs
  - Zeek http.log
  - 'NAI: Public-facing web servers'
  range: Last 90 days; evaluate in 1-hour windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert when count(http.uri matches ''\.(pdf|docx|xlsx|pptx)$'' AND status=200) by src_ip within
      1h > 20

      output src_ip, doc_count, distinct_docs'
  - technology: Zeek/pseudocode
    query: 'for src in http.log window=1h: if count(doc_ext(uri)) > 20: alert(src, count)

      output src, count'
- question: For each source IP, do the volume (bytes and unique documents/day), frequency (downloads/min),
    and state (200 vs 403/404 ratio on document paths) exceed 3 standard deviations from its own or a
    peer-group baseline?
  context: 'Bulk document harvesters stand out against the normal distribution of how external clients
    fetch our published files. For each source IP baseline volume (bytes and unique documents per day),
    frequency (downloads per minute), and state (the 200 vs 403/404 ratio on document paths), then flag
    IPs exceeding 3 standard deviations from their own or a peer-group baseline, with percentile cutoffs
    derived per Allman et al.''s baselining methodology. In the Reconnaissance context, an IP that suddenly
    pulls far more documents — or probes for many that 404 — than its peers is likely automating metadata
    collection on our software footprint; treating the error ratio as a distinct state signal helps separate
    a methodical harvester from a benign bulk reader, and a positive result complements the deterministic
    volume threshold above. Reference: [A Brief History of Scanning, Allman et al.](https://www.icir.org/mallman/pubs/APT07/APT07.pdf).'
  answer_sources:
  - Web Server Access Logs
  - Zeek http.log
  - 'NAI: Public-facing web servers'
  range: Last 90 days; baseline over rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for src:\n  vol = sum(bytes), distinct(doc) per day\n  freq = downloads/min\n  state = count(status=200)/max(count(status\
      \ in [403,404]),1) on doc_paths\nmu,sd = stats(vol over self_or_peer, 30d)\nalert when vol > mu\
      \ + 3*sd\noutput src, vol, freq, state"
- question: When K-Means (or a KitNET reconstruction-error detector) groups source IPs by total bytes,
    unique documents accessed, session duration, and request inter-arrival time, which clusters represent
    high-volume automated downloading, and what are the top-3 distinguishing features per cluster/alert?
  context: 'Clustering separates automated bulk downloaders from ordinary readers without labels. Use
    K-Means — or KitNET reconstruction error per Kitsune — over total bytes, unique documents accessed,
    session duration, and request inter-arrival time to group source IPs, then investigate high-volume
    automated clusters and report the top-3 distinguishing features per cluster/alert. In the Reconnaissance
    context, a tight cluster of IPs pulling many documents in long, fast sessions is consistent with metadata-harvesting
    automation rather than human browsing; the feature attribution lets the analyst confirm the cluster''s
    behavior is recon-related and pivot to the source IPs, complementing the threshold and per-IP baseline
    methods. Reference: [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089).'
  answer_sources:
  - Web Server Access Logs
  - Zeek http.log
  - 'NAI: Public-facing web servers'
