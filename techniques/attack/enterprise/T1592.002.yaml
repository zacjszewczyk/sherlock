- question: After a phishing-link click alert, do subsequent process-creation (Windows EID 4688 / Sysmon
    EID 1) or PowerShell script-block (EID 4104) events on that host contain software-enumeration commands
    such as 'wmic product get name,version', registry reads of HKLM\...\Uninstall\*, 'Get-ItemProperty',
    'reg query', or AV/EDR service queries?
  context: 'After a successful phish, an attacker (or payload) commonly enumerates installed software
    and defensive tooling to plan next steps. Correlate a phishing-link click alert with subsequent process-creation
    (EID 4688/Sysmon EID 1) or PowerShell script-block (EID 4104) events containing software-enumeration
    commands — ''wmic product get name,version'', registry reads of HKLM\...\Uninstall\*, ''Get-ItemProperty'',
    ''reg query'', and AV/EDR service queries — using maintained recon-command rules from SigmaHQ as a
    deterministic floor. In the Reconnaissance context, this is software-targeting carried out from inside
    a freshly compromised host; a positive result, especially chained to a phishing click, is a high-confidence
    indicator of hands-on enumeration and should trigger host isolation and investigation of the parent
    process and user. Reference: [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Internal user workstations'
  range: Last 90 days; correlate within 24 hours of a phishing-click alert
  queries:
  - technology: SIEM/Rule pseudocode
    query: "click = alert(phishing_link_click) by host,user\nenum = (EID=4688 OR Sysmon EID=1 OR EID=4104)\
      \ where cmd matches\n  ('wmic product get'|'Uninstall\\\\*'|'Get-ItemProperty'|'reg query'|av_edr_service_query)\n\
      alert when enum within 24h after click on same host\noutput host, user, parent_image, command"
  - technology: Sysmon/pseudocode
    query: 'for e in EID1: if matches_software_enum(e.CommandLine) and host_recently_phished(e.Computer):
      alert(e)

      output host, ParentImage, Image, CommandLine'
- question: Which users or hosts execute software-enumeration commands or registry Uninstall-key reads
    at a frequency exceeding 3 standard deviations above their historical norm, and do they also show
    failed/denied registry or WMI queries as a distinct state signal?
  context: 'Legitimate software inventory happens, but a sudden spike in enumeration from a normal user/host
    is suspicious. Baseline per-user and per-host frequency of software-enumeration command executions
    and registry Uninstall-key reads (volume/frequency) and flag executions exceeding 3 standard deviations
    from the historical norm, with cutoffs derived per Allman et al.''s baselining methodology, while
    also profiling failed/denied registry or WMI queries as a distinct state signal. In the Reconnaissance
    context, an anomalous enumeration rate from a workstation that does not normally run inventory commands
    is consistent with an attacker profiling installed software and defenses; a positive result, particularly
    with denied queries indicating probing, complements the post-phishing correlation floor and merits
    endpoint investigation. Reference: [A Brief History of Scanning, Allman et al.](https://www.icir.org/mallman/pubs/APT07/APT07.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Internal user workstations'
  range: Last 90 days; baseline over rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for key in [user, host]:\n  enum_rate = count(software_enum_cmd OR uninstall_key_read) per\
      \ day\n  fail_state = count(registry/wmi denied)\nmu,sd = stats(enum_rate, historical)\nalert when\
      \ enum_rate > mu + 3*sd OR fail_state > p95(baseline)\noutput key, enum_rate, mu, fail_state"
- question: When a sequence model (HMM/LSTM) trained on normal process-execution chains originating from
    email clients and browsers flags a low-probability sequence that includes software enumeration, which
    chains are anomalous and what are the top-3 contributing steps/features (e.g., parent=outlook.exe,
    child=wmic.exe, command tokens)?
  context: 'Post-phishing reconnaissance shows up as an unusual process lineage descending from an email
    client or browser into enumeration tools. Learn normal process-execution chains originating from email
    clients/browsers with a sequence model (HMM/LSTM) and flag low-probability sequences that include
    software enumeration, applying the unsupervised reconstruction-error/anomaly paradigm of Kitsune,
    and emit the top-3 contributing steps/features (e.g., parent=outlook.exe, child=wmic.exe, command
    tokens) in the alert. In the Reconnaissance context, a rare outlook.exe -> wmic.exe -> software-enumeration
    chain is a strong signal of an attacker enumerating software immediately after a phish; the feature
    attribution lets the analyst verify the lineage and tokens before escalating, complementing the deterministic
    correlation and statistical-rate methods. Reference: [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Internal user workstations'
  range: Last 90 days; model trained on benign rolling window
  queries:
  - technology: SIEM/ML pseudocode
    query: 'chains = process_lineage where root in [outlook.exe, browsers]

      model = HMM_or_LSTM.fit(benign_chains)

      logp = model.sequence_logprob(observed_chain)

      alert when logp < threshold AND chain contains software_enum

      explain = top_k_steps([parent, child, command_tokens], 3)

      output host, chain, logp, explain'
