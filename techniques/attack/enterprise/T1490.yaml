- question: '[Impact] API error/denied-state profiling: Can you determine whether a network connection
    from a non-administrative workstation or an unauthorized IP address to a hypervisor management interface
    (e.g., vCenter, ESXi) or cloud storage API endpoint is followed by API calls to delete virtual machine
    snapshots (e.g., ''snapshot.removeall''), S3 object versions, or backup policies. -- specifically,
    using the ''API error/denied-state profiling'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), the mission question is: Is an adversary
    attempting to inhibit system recovery capabilities to prevent restoration after an attack? An adversary
    who deletes backups, shadow copies, and snapshots, or disables recovery features, is removing the
    defender''s ability to restore systems after data encryption or destruction, so detecting this behavior
    early can interrupt an attack before its final impact. This evidence focuses on the condition that
    a network connection from a non-administrative workstation or an unauthorized IP address to a hypervisor
    management interface (e.g., vCenter, ESXi) or cloud storage API endpoint is followed by API calls
    to delete virtual machine snapshots (e.g., ''snapshot.removeall''), S3 object versions, or backup
    policies. This Statistical Method approach looks for the following signal: Profile AccessDenied/errorCode
    rates on delete/disable APIs as a distinct signal — a burst of denied DeleteSnapshot/DeleteBackupVault
    attempts indicates recovery-destruction attempts blocked by IAM, which precede privilege escalation.
    A positive result -- a rule match, statistical outlier, or model alert -- suggests that recovery mechanisms
    are being deliberately disabled or destroyed in a way that deviates from sanctioned backup administration
    and normal change windows; pivot to the responsible process, command line, parent lineage, the user
    or cloud principal, the targeted backups/snapshots/policies, and any concurrent encryption or destruction
    activity. A negative result helps rule out this recovery-inhibition vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, partial, or living-off-the-land
    recovery destruction.'
