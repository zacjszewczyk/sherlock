questions:
- question: '[Impact] Hash IOC match for recovery tools: Can you determine whether execution telemetry
    identifies binaries associated with ransomware or wiper tooling that are commonly used to disable
    or destroy recovery mechanisms, indicating likely impact-stage preparation to prevent restoration.
    -- specifically, using the ''Hash IOC match for recovery tools'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), the mission question is: Is an adversary
    attempting to inhibit system recovery capabilities to prevent restoration after an attack? An adversary
    who deletes backups, shadow copies, and snapshots, or disables recovery features, is removing the
    defender''s ability to restore systems after data encryption or destruction, so detecting this behavior
    early can interrupt an attack before its final impact. This evidence focuses on the condition that
    execution telemetry identifies binaries associated with ransomware or wiper tooling that are commonly
    used to disable or destroy recovery mechanisms, indicating likely impact-stage preparation to prevent
    restoration. This Symbolic Logic approach looks for the following signal: Match process/file hashes
    from Windows Event ID 4688 and Windows Defender Event ID 1116 against known ransomware/wiper feeds
    and alert. Seed signatures from validated recovery-destruction tooling exercised in [Atomic Red Team
    T1490](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1490/T1490.md). A positive
    result -- a rule match, statistical outlier, or model alert -- suggests that recovery mechanisms are
    being deliberately disabled or destroyed in a way that deviates from sanctioned backup administration
    and normal change windows; pivot to the responsible process, command line, parent lineage, the user
    or cloud principal, the targeted backups/snapshots/policies, and any concurrent encryption or destruction
    activity. A negative result helps rule out this recovery-inhibition vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, partial, or living-off-the-land
    recovery destruction.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Defender Event ID 1116
  - Zeek files.log
  - 'NAI: All domain-joined Windows endpoints and servers, especially critical application servers and
    domain controllers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Hash IOC match for recovery tools

      source IN [Windows Event ID 4688, Sysmon Event ID 1, Windows Defender Event ID 1116, Zeek files.log]

      | WHERE matches_action_criteria("Hash IOC match for recovery tools")

      // Match process/file hashes from Windows Event ID 4688 and Windows Defender Event ID 1116 against
      known ransomware/wiper f

      | ALERT enrich(host, user, process, parent, cmdline, file, principal, api)'
  - technology: Cloud/Audit-log pseudocode
    query: '# Recovery-destruction control-plane correlation

      CloudTrail/Azure Activity/GCP Audit + vCenter/ESXi hostd + Zeek conn/ssl

      | JOIN management-plane session (source, principal) to destructive actions (DeleteSnapshot, DeleteBackupVault,
      DeleteRecoveryPoint, PutBucketVersioning=Suspended, snapshot.removeall)

      | AGG by (principal, sourceIPAddress, region) over time-window

      | flag first-seen/unauthorized sources + denied-state bursts per action criteria'
