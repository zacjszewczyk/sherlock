name: 'T1490: Inhibit System Recovery'
id: ea64cb20-cc55-498f-bd8c-7c72b789f1e5
description: 'This playbook helps an analyst investigate whether an adversary is attempting to inhibit
  system recovery (MITRE ATT&CK T1490) to prevent restoration after a destructive or ransomware-driven
  attack, an Impact-stage behavior that frequently immediately precedes or accompanies data encryption
  and data destruction. It guides the hunt across several behavioral angles spanning Windows, Linux, macOS,
  ESXi, network devices, and cloud/IaaS: execution of known ransomware/wiper tooling matched by hash or
  AV signature; abuse of native Windows recovery utilities (vssadmin.exe, wmic.exe, wbadmin.exe, bcdedit.exe,
  diskshadow.exe, REAgentC.exe) with arguments that delete volume shadow copies, remove the backup catalog,
  resize shadow storage, or disable the Windows Recovery Environment and boot recovery; shell-driven destruction
  of Linux recovery targets, fstab/systemd backups, and boot/EFI partitions; ESXi vim-cmd snapshot.removeall
  and snapshot-file deletion; network-device erase/format/reload sequences; and cloud control-plane actions
  that disable versioning and backup policies and delete snapshots, recovery points, and database backups.
  It also looks for high-volume deletion of backup files (.bak/.vhd/.vhdx/.dmp/.bkf and System Volume
  Information), reconnaissance-then-destruction command sequences, and unauthorized access to hypervisor
  and cloud management interfaces followed by destructive API calls. Detection methods combine symbolic-logic
  rules, statistical baselining (rarity, spike, entropy, failure-state, and first-seen modeling), and
  machine-learning models (provenance/sequence classifiers, clustering, and rare-function API analysis)
  applied to Windows Security/Sysmon/Backup/PowerShell logs, auditd, ESXi hostd, network-device syslog,
  Zeek, and AWS/Azure/GCP audit logs, so the analyst can corroborate suspected recovery inhibition against
  process lineage, command content, deletion volume, and control-plane context.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
