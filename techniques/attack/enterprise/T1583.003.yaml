name: 'T1583.003: Virtual Private Server'
id: 0009ee39-d2e2-4e17-81aa-14edc996d51c
description: 'Investigate whether an adversary has acquired and is operating a Virtual Private Server
  (VPS) to support targeting, most often as Command and Control (C2) or staging infrastructure. Because
  the acquisition itself happens outside the victim''s visibility, this playbook centers detection on
  the network and endpoint traces that appear once the VPS is used against the environment: outbound connections
  and TLS sessions from internal hosts to VPS-provider IP space, matched against VPS-focused threat intelligence
  and internet-scan-derived C2 signatures (default ports, service banners, self-signed/default-CN certificates,
  JARM/JA3/JA4/JA4X fingerprints). It guides the analyst through DNS-based hunting for newly registered,
  high-entropy, dynamic-DNS, and low-TTL/fast-flux domains resolving into VPS ranges; beacon analysis
  for low-jitter heartbeats and outlier data volumes on known-C2 or protocol-mismatched ports; and certificate
  analysis for self-signed, short-lived, and free-CA certificates correlated with suspicious domains.
  Each behavior is approached with three complementary methods - deterministic symbolic-logic rules, statistical
  baselining/anomaly scoring, and explainable machine learning - and is corroborated with endpoint telemetry
  (Windows Event IDs 5156, 4688, and Sysmon Event ID 3) so leads are defensible and immediately actionable
  for a SOC analyst.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any outbound connections, DNS queries, or TLS sessions from internal hosts match VPS-focused
    threat intelligence or internet-scan-derived C2 server signatures (known-bad IPs/domains, certificate
    SHA-1 hashes, default ports, service banners, default/self-signed certificate CNs, or JARM fingerprints),
    with the same session corroborated by Windows Event IDs 5156 and 4688?
  context: Resource Development is largely invisible to the victim, so the most reliable place to catch
    an adversary's VPS is when an internal host actually reaches out to it. Joining Zeek conn.log/dns.log/ssl.log/x509.log
    and Windows Event IDs 5156 (Filtering Platform connection) and 4688 (process creation) against curated
    VPS-focused CTI feeds AND internet-scan-derived C2 signatures (per Mandiant's SCANdalous methodology)
    provides a hard, deterministic detection floor. The analyst is looking for an exact match on a malicious
    IP, domain, certificate hash, or JARM/JA-style fingerprint tied to known adversary C2 software running
    on rented infrastructure. Because these are high-confidence indicators, keep them as deterministic
    rules and triage matches immediately, pivoting to Event ID 4688 to identify the local process that
    initiated the session. A positive result strongly implies active C2 to an adversary VPS; a negative
    result does not clear the host, since signatures lag novel infrastructure - pair this with the statistical
    and ML analytics below.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Network Egress Points (e.g., Internet Gateway, Firewalls, Proxies), Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (source=zeek conn.log OR source=zeek ssl.log OR EventCode=5156)\n  | eval ip=coalesce(id.resp_h,\
      \ DestAddress), dom=coalesce(query, server_name),\n         certhash=coalesce(cert_chain_fps, sha1)\n\
      \  | lookup vps_c2_cti ip AS ip OUTPUT threat_name\n  | append [ lookup vps_c2_cti domain AS dom\
      \ OUTPUT threat_name ]\n  | append [ lookup vps_c2_cti jarm AS jarm OUTPUT threat_name ]\n  | append\
      \ [ lookup vps_c2_cti cert_sha1 AS certhash OUTPUT threat_name ]\n  | where isnotnull(threat_name)\n\
      \  | join host ProcessId [ search EventCode=4688 ]\n  | table _time, host, ip, dom, certhash, jarm,\
      \ threat_name, NewProcessName"
- question: Which internal hosts have a volume of outbound connections to abuse-tolerant VPS-provider
    ASNs that exceeds the 95th percentile of their own 30-day baseline or the global baseline, and what
    are the per-destination blocked/RST connection ratios?
  context: 'Adversaries deliberately rent from VPS providers known for minimal registration and tolerance
    of abuse (documented in Trend Micro''s ''Criminal Hideouts for Lease''). By enriching destination
    IPs from Windows Event ID 5156 with ASN/netblock reputation - weighting these abuse-tolerant providers
    - and counting connections per ASN per host, the analyst can surface hosts whose contact with VPS-provider
    space is anomalous relative to their normal behavior or the enterprise. Alerting when a host crosses
    its own 95th-percentile baseline (or the global baseline) flags an emerging relationship with rented
    infrastructure even without a specific CTI hit. Separately tracking the ratio of blocked/RST connections
    per destination is a distinct failure-mode signal: bursts of resets or denials can indicate C2 probing,
    beacon teardown, or a server being taken down/rotated. A positive result warrants pivoting to which
    process and user drove the connections; benign cloud usage (legitimately hosted SaaS on the same ASN)
    should be baselined out.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Network Egress Points (e.g., Internet Gateway, Firewalls, Proxies), Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  EventCode=5156\n  | iplocation DestAddress | eval asn=autonomous_system\n  | lookup\
      \ asn_reputation asn OUTPUT abuse_tolerant\n  | where abuse_tolerant=\"true\"\n  | stats count AS\
      \ conns sum(eval(action=\"blocked\" OR tcp_flags=\"RST\")) AS failed BY host, asn, bin(_time,1d)\n\
      \  | eventstats perc95(conns) AS p95 avg(conns) AS m BY host, asn\n  | eval fail_ratio=failed/conns\n\
      \  | where conns>p95 OR fail_ratio>0.5\n  | table _time, host, asn, conns, failed, fail_ratio"
- question: When real-time outbound connections are scored by an explainable Random Forest using ASN reputation,
    destination port, byte volume/ratio, duration, JA4 rarity, CTI/scan matches, and Event ID 4688 process
    metadata, which sessions are flagged as high-probability C2, and what are the top-3 contributing features
    for each?
  context: Single rules and thresholds miss adversary VPS traffic that blends in, so a supervised model
    can combine many weak signals into a high-confidence judgement. A Random Forest scored over {ASN reputation,
    port, byte volume/ratio, duration, JA4 fingerprint rarity, CTI/scan match flags, Event ID 4688 process
    metadata} flags sessions whose overall profile resembles known C2 to rented infrastructure. Crucially,
    the model should surface the top-3 contributing features in the alert text (e.g., 'ASN abuse-tolerant',
    'JA4 rare', 'process=rundll32 unsigned') so analysts can triage quickly. Supplementing with version-agnostic
    flow features (per Novo et al.'s work extending C2 detection to TLS 1.3) ensures detection survives
    the migration away from cleartext TLS metadata. A high-probability flag with rare JA4, abuse-tolerant
    ASN, and suspicious process lineage is a priority Resource-Development/C2 lead; low scores on common
    destinations can be deprioritized.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Network Egress Points (e.g., Internet Gateway, Firewalls, Proxies), Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = per_connection(asn_reputation, dest_port, byte_volume, byte_ratio, duration,\n\
      \                            ja4_rarity, cti_match, scan_match, proc_meta_4688)\n  model = RandomForest.fit(labeled_c2_vs_benign)\n\
      \  scores = model.predict_proba(today_connections)\n  emit sessions where p_c2 > 0.8 with top3 contributing\
      \ features"
- question: Do any outbound TLS sessions produce a JA3/JA3S or version-stable JA4+ client/server hash,
    or return a service banner, that matches a known Command and Control framework signature, with Windows
    Event ID 5156 confirming the session and an active JARM fingerprint corroborating the destination?
  context: Many adversary C2 frameworks deployed on rented VPSs have characteristic TLS client/server
    fingerprints and server banners. Continuously scanning Zeek ssl.log/conn.log and Windows Event ID
    5156 for JA3/JA3S and JA4+ hashes and banners matching catalogued C2 frameworks (per Salesforce's
    JA3 and FoxIO's JA4+ projects) gives a deterministic way to spot tools like Cobalt Strike, Sliver,
    or Metasploit talking to their server. Corroborating with an active JARM scan of the destination raises
    confidence that the server is in fact running the suspected framework. JA4+ is preferred over JA3
    because it is more resistant to TLS extension randomization. A match is high-fidelity and should be
    escalated with the local process context; tune out internal/management TLS endpoints that may share
    fingerprints.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points (e.g., Internet Gateway, Firewalls, Proxies)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  (source=zeek ssl.log OR EventCode=5156)\n  | eval fp=coalesce(ja4, ja4s, ja3, ja3s)\n\
      \  | lookup c2_tls_fingerprints fingerprint AS fp OUTPUT framework\n  | append [ search source=zeek\
      \ conn.log | lookup c2_banners banner OUTPUT framework ]\n  | where isnotnull(framework)\n  | enrich\
      \ jarm_scan(id.resp_h) AS jarm | lookup c2_jarm jarm OUTPUT framework_confirm\n  | table _time,\
      \ host, id.resp_h, fp, framework, framework_confirm"
- question: Which outbound TLS sessions use a JA4 (preferred) or JA3/JA3S fingerprint that appears in
    fewer than 0.1% of sessions over the last 30 days, particularly when Windows Event ID 5156 confirms
    the connection and the destination belongs to a VPS-provider ASN, and what are the per-destination
    TLS handshake-failure/alert rates?
  context: Adversary tooling on a fresh VPS often produces a TLS client fingerprint that is rare in the
    environment because it does not correspond to a common browser or application. By computing the prevalence
    of each JA4/JA3/JA3S hash over a 30-day window and alerting on those appearing in <0.1% of sessions
    - especially when Event ID 5156 confirms the flow and the destination is in VPS-provider IP space
    - the analyst surfaces novel or bespoke clients without needing a prior signature. JA4 is preferred
    because browser extension randomization destabilizes JA3 rarity (per Stamus Networks). Tracking per-destination
    TLS handshake-failure/alert rates as a separate signal catches misconfigured or probing C2 that fails
    negotiation. A rare fingerprint to a VPS ASN is a strong lead; common fingerprints to well-known services
    can be deprioritized.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points (e.g., Internet Gateway, Firewalls, Proxies)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=zeek ssl.log\n  | eval fp=coalesce(ja4, ja3)\n  | eventstats count AS total\n\
      \  | stats count AS seen BY fp\n  | eval prevalence=seen/total\n  | where prevalence < 0.001\n \
      \ | join fp [ search source=zeek ssl.log | iplocation id.resp_h | lookup vps_asn autonomous_system\
      \ OUTPUT is_vps\n             | where is_vps=\"true\" ]\n  | join host [ search EventCode=5156 ]\n\
      \  | table _time, host, id.resp_h, fp, prevalence"
- question: When DBSCAN is applied to TLS session features (JA3/JA4, cipher suite, TLS extensions, host
    session attributes) and self-supervised encrypted-flow anomaly scoring is added, which TLS clusters
    deviate from benign traffic, and what are the top contributing features per alert?
  context: Clustering exposes groups of TLS sessions that share an unusual profile distinct from the bulk
    of benign browsing - a pattern typical of C2 beacons from a VPS that all use the same library/configuration.
    Applying DBSCAN to {JA3/JA4, cipher suite, TLS-extension list, host session features} surfaces small,
    dense outlier clusters that warrant inspection. Adding self-supervised encrypted-flow anomaly scoring
    (per the ET-SSL approach) catches C2 without requiring decryption, which matters as TLS 1.3 hides
    handshake metadata. Reporting the top contributing features per cluster/alert lets the analyst understand
    why a session is anomalous. A tight outlier cluster of rare TLS sessions to VPS ranges, or a high
    encrypted-flow anomaly score, is a strong C2 lead; large, diffuse clusters that map to normal apps
    can be set aside.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points (e.g., Internet Gateway, Firewalls, Proxies)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  X = per_session(ja3_ja4, cipher_suite, tls_extensions, host_features)\n  clusters =\
      \ DBSCAN(eps=0.4, min_samples=5).fit(X)\n  outliers = points labeled -1 or in small dense clusters\n\
      \  flow_anom = ETSSL_selfsupervised.score(encrypted_flows)\n  emit outliers + high flow_anom with\
      \ top contributing features"
- question: Did any internal host query or connect to a domain served by a known dynamic-DNS provider
    or with very low/volatile TTL, where Zeek conn.log shows the connection going into VPS IP space and
    Windows Event ID 5156 confirms the outbound session?
  context: Adversaries commonly point dynamic-DNS (DDNS) names with short, volatile TTLs at their rented
    VPS so they can move or rotate infrastructure quickly. Alerting when Zeek dns.log queries hit DDNS-provider
    domains or low/volatile-TTL domains (a malicious-domain predicate from the EXPOSURE research), the
    corresponding conn.log connection lands in VPS IP space, and Event ID 5156 confirms the local process
    made the call, gives a deterministic way to catch this agility. The analyst is looking for the combination
    - DDNS/low-TTL name plus VPS-hosted resolution plus a confirmed endpoint connection - which is much
    more suspicious than any one element alone. A match is a solid C2-infrastructure lead; legitimate
    DDNS use (some home/IoT/remote-access tooling) should be allowlisted to reduce noise.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Internal DNS Resolvers, Network Egress Points (e.g., Internet Gateway, Firewalls)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  source=zeek dns.log\n  | lookup ddns_providers domain_suffix AS query OUTPUT is_ddns\n\
      \  | where is_ddns=\"true\" OR TTL < 60\n  | join query [ search source=zeek conn.log | iplocation\
      \ id.resp_h\n                 | lookup vps_asn autonomous_system OUTPUT is_vps | where is_vps=\"\
      true\" ]\n  | join host [ search EventCode=5156 ]\n  | table _time, host, query, TTL, id.resp_h"
- question: Which newly observed domains have a subdomain Shannon entropy above 3.5 AND a registration
    age under 30 days, and which exhibit fast-flux/hosting-abuse DNS-answer characteristics (many distinct
    resolved IPs, distinct ASNs/networks, high TTL volatility) resolving into VPS ranges - and what are
    the per-host NXDOMAIN/SERVFAIL rates?
  context: Freshly acquired adversary infrastructure frequently uses algorithmically generated or throwaway
    domains that are both young and high-entropy, and may employ fast-flux to spread resolution across
    many VPS IPs. Computing Shannon entropy per newly observed domain and alerting when entropy >3.5 and
    registration age <30 days surfaces these. Adding EXPOSURE/FluxBuster DNS-answer features - count of
    distinct resolved IPs, distinct ASNs/networks, and TTL volatility - scores hosting-abuse and fast-flux
    into VPS ranges. Tracking NXDOMAIN/SERVFAIL rates per host is a distinct failure-mode signal of DGA
    beaconing or a dead/sinkholed C2. A young, high-entropy domain resolving across many VPS ASNs is a
    strong lead; established, low-entropy domains can be deprioritized. Calibrate the entropy threshold
    to your environment to handle legitimately long CDN/cloud hostnames.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Internal DNS Resolvers, Network Egress Points (e.g., Internet Gateway, Firewalls)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=zeek dns.log\n  | eval ent=shannon_entropy(subdomain)\n  | lookup whois_age domain\
      \ OUTPUT reg_age_days\n  | stats dc(answers) AS ip_spread dc(answer_asn) AS asn_spread stdev(TTL)\
      \ AS ttl_vol\n          sum(eval(rcode IN (\"NXDOMAIN\",\"SERVFAIL\"))) AS dns_fail count AS q BY\
      \ query, host, ent, reg_age_days\n  | eval fail_ratio=dns_fail/q\n  | where (ent>3.5 AND reg_age_days<30)\
      \ OR (ip_spread>5 AND asn_spread>3) OR fail_ratio>0.3\n  | table _time, host, query, ent, reg_age_days,\
      \ ip_spread, asn_spread, ttl_vol, fail_ratio"
- question: When newly observed domain query volumes (enriched with Event ID 5156 sessions) are forecast
    with Prophet/ARIMA, which days show spikes exceeding the predicted confidence interval, and which
    flux clusters does a decision-tree model classify as malicious over IP/ASN-spread features?
  context: A sudden surge in queries to never-before-seen domains can mark the activation of adversary
    VPS infrastructure. Applying time-series forecasting (Prophet/ARIMA) to newly observed domain query
    volumes - enriched with confirmed Event ID 5156 sessions - lets the analyst alert when actual volume
    breaks above the predicted confidence band, indicating an anomalous wave of new-domain contact. Pairing
    this with a C4.5/decision-tree classifier over fast-flux features (IP spread, ASN/network spread per
    domain, per FluxBuster) labels which clusters are likely malicious flux, and surfacing the driving
    features makes the alert explainable. A forecast-breaking spike coinciding with flux-like domains
    resolving into VPS space is a strong Resource-Development/C2 lead; expected seasonal increases captured
    by the model are not alerted.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Internal DNS Resolvers, Network Egress Points (e.g., Internet Gateway, Firewalls)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  series = daily_count(new_observed_domains enriched_with EventCode=5156)\n  model = Prophet.fit(series)\n\
      \  forecast = model.predict(horizon)\n  spikes = days where actual > forecast.upper_ci\n  flux =\
      \ C45_tree.classify(per_domain(ip_spread, asn_spread, ttl_volatility))\n  emit spikes + flux==malicious\
      \ with driving features"
- question: Are any internal hosts connecting to known VPS IP ranges on known-C2 or non-standard ports
    - especially where the Zeek-detected application service does not match the destination port - as
    seen in Zeek conn.log, Sysmon Event ID 3, or Windows Event ID 5156?
  context: Adversaries running C2 on a VPS often listen on non-standard ports or on ports whose traffic
    does not match the expected protocol (e.g., a custom binary protocol over TCP/443 that Zeek does not
    classify as TLS). Alerting when conn.log, Sysmon Event ID 3 (network connection), or Event ID 5156
    connections target known VPS ranges on known-C2 or non-standard ports - particularly when the Zeek
    service field disagrees with the port number - is a deterministic way to flag this. The analyst is
    looking for port/protocol mismatches and contact with VPS space on unusual ports, which legitimate
    enterprise applications rarely do. Sysmon Event ID 3 ties the connection to a specific process and
    user for fast triage. A positive result is a credible C2 lead; allowlist sanctioned services that
    legitimately use odd ports.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 3
  - Windows Event ID 5156
  - 'NAI: Network Egress Points (e.g., Internet Gateway, Firewalls), Monitored Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (source=zeek conn.log OR EventCode=3 OR EventCode=5156)\n  | eval ip=coalesce(id.resp_h,\
      \ DestinationIp, DestAddress), port=coalesce(id.resp_p, DestinationPort, DestPort)\n  | iplocation\
      \ ip | lookup vps_asn autonomous_system OUTPUT is_vps\n  | where is_vps=\"true\"\n  | eval mismatch=if(isnotnull(service)\
      \ AND expected_port(service)!=port,1,0)\n  | where port IN (known_c2_ports) OR port NOT IN (standard_ports)\
      \ OR mismatch=1\n  | table _time, host, ip, port, service, Image, mismatch"
- question: For each source-destination pair into VPS space, which sessions show a low-jitter heartbeat
    (inter-arrival standard deviation under ~2 seconds / low coefficient of variation over >=24h) and
    byte totals that are |Z|>3 outliers versus the past 30 days, confirmed by FFT power-spectral periodicity
    with autocorrelation?
  context: 'Beaconing is the signature behavior of an implant calling back to its VPS C2: connections
    recur with very regular timing and often consistent, anomalous data volumes. For each (source, destination)
    pair, flagging sessions whose inter-arrival standard deviation is <2 seconds (low coefficient of variation)
    over a 24-hour-plus window and whose byte totals are |Z|>3 outliers against a 30-day baseline isolates
    these heartbeats. Using FFT power-spectral analysis with autocorrelation verification (per BAYWATCH)
    and the dispersion/skew scoring of RITA hardens the result against noise. Setting role/destination-aware
    baselines and minimum-observation thresholds (per Mack et al.) suppresses benign periodic traffic
    such as software updates and telemetry. A low-jitter, outlier-volume beacon into VPS space is a high-confidence
    C2 lead; remember that benign automated services also beacon, so baseline and allowlist them.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 3
  - Windows Event ID 5156
  - 'NAI: Network Egress Points (e.g., Internet Gateway, Firewalls), Monitored Endpoint Devices'
  range: Last 90 days. Require at least 24 hours of observations per source-destination pair.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=zeek conn.log\n  | iplocation id.resp_h | lookup vps_asn autonomous_system OUTPUT\
      \ is_vps | where is_vps=\"true\"\n  | stats list(_time) AS times sum(orig_bytes+resp_bytes) AS bytes\
      \ count AS n BY id.orig_h, id.resp_h, span=1d\n  | eval iat_std=stdev(diff(times)), iat_mean=avg(diff(times)),\
      \ cv=iat_std/iat_mean\n  | eventstats avg(bytes) AS mb stdev(bytes) AS sb BY id.orig_h\n  | eval\
      \ z=(bytes-mb)/sb\n  | where n>=24 AND iat_std<2 AND (abs(z)>3 OR fft_periodic(times)=1)\n  | table\
      \ id.orig_h, id.resp_h, iat_std, cv, bytes, z"
- question: When per-(host,destination) connection timing is modeled with a Continuous-Time HMM and/or
    LSTM/transformer sequence models, which observed sequences deviate from predictions in a way consistent
    with high-jitter beaconing that defeats FFT/coefficient-of-variation statistics, and what are the
    top-3 contributing features?
  context: Sophisticated implants randomize their callback timing (jitter) precisely to defeat the periodicity
    statistics above. Modeling each (host, destination) connection-timing sequence with a Continuous-Time
    HMM (per NetSpectra Sentinel) and/or LSTM/transformer sequence models (per Gupta et al.) learns the
    temporal structure of normal traffic and flags sequences that deviate even when no fixed period exists.
    This catches jittered beacons to a VPS that low-variance and FFT methods miss. Surfacing the top-3
    contributing features (e.g., 'inter-arrival distribution shift', 'burst after idle', 'destination
    VPS ASN') keeps alerts explainable for triage. A sequence-model deviation on a host-destination pair
    pointing at VPS space, especially corroborated by process context from Event ID 3/5156, is a strong
    high-jitter-C2 lead; well-modeled, predictable sequences are benign.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 3
  - Windows Event ID 5156
  - 'NAI: Network Egress Points (e.g., Internet Gateway, Firewalls), Monitored Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  seq = per_host_dest_timing_sequence(zeek_conn, EventCode in (3,5156))\n  ct_hmm = ContinuousTimeHMM.fit(benign_sequences)\n\
      \  lstm = LSTM_transformer.fit(benign_sequences)\n  anomalies = sequences where ct_hmm.loglik low\
      \ OR lstm.pred_error high\n  emit anomalies with top3 contributing features"
- question: Do any outbound TLS sessions present a certificate where the issuer DN equals the subject
    DN (self-signed) or whose CN/SAN matches default or known-C2 certificate artifacts catalogued from
    internet scanning, as parsed from Zeek x509.log and confirmed by Windows Event ID 5156?
  context: Operators standing up C2 on a VPS frequently use self-signed certificates or leave default
    certificate fields from their tooling (e.g., the Cobalt Strike default CN), which internet-scan catalogues
    like Mandiant's SCANdalous track. Parsing Zeek x509.log and flagging certificates where issuer DN
    == subject DN (self-signed) or where the CN/SAN matches default/known-C2 artifacts, then confirming
    the session in Event ID 5156, gives a hard, deterministic rule. The analyst is looking for the telltale
    certificate fingerprints of off-the-shelf C2 frameworks on rented servers. Suppress alerts for trusted
    internal management servers that legitimately use self-signed certs. A match is a high-fidelity C2
    lead worth immediate escalation with endpoint process context; absence of a match does not clear a
    host since adversaries increasingly use free trusted CAs (see the next questions).
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points with TLS Inspection Capabilities'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  source=zeek x509.log\n  | eval self_signed=if(issuer==subject,1,0)\n  | lookup c2_cert_artifacts\
      \ cn AS certificate.subject_cn OUTPUT framework\n  | where self_signed=1 OR isnotnull(framework)\n\
      \  | search NOT [| inputlookup trusted_mgmt_servers.csv | fields cert_subject ]\n  | join host [\
      \ search EventCode=5156 ]\n  | table _time, host, certificate.subject, certificate.issuer, self_signed,\
      \ framework"
- question: Which outbound TLS certificates have validity periods in the bottom 5th percentile or under
    90 days, and do they correlate with recently registered domains, VPS-provider ASNs, and confirmed
    Windows Event ID 5156 sessions?
  context: Adversary C2 certificates are often short-lived - either self-issued with brief validity or
    obtained from free CAs like Let's Encrypt that issue 90-day certificates - because infrastructure
    is provisioned and torn down quickly. Tracking certificate validity periods and flagging those in
    the bottom 5th percentile or under 90 days surfaces this pattern. Correlating the short validity with
    recent domain registration, a VPS-provider ASN for the destination, and a confirmed Event ID 5156
    session sharply increases fidelity, since the combination is far more suspicious than a short cert
    alone (Let's Encrypt is also used widely by benign sites). A short-lived certificate on a young domain
    hosted on a VPS and contacted by an internal host is a strong C2-infrastructure lead; isolated short
    certs on established, reputable domains can be deprioritized.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points with TLS Inspection Capabilities'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=zeek x509.log\n  | eval validity_days=(certificate.not_valid_after - certificate.not_valid_before)/86400\n\
      \  | eventstats perc5(validity_days) AS p5\n  | where validity_days < 90 OR validity_days <= p5\n\
      \  | lookup whois_age domain OUTPUT reg_age_days | iplocation server_ip | lookup vps_asn autonomous_system\
      \ OUTPUT is_vps\n  | join host [ search EventCode=5156 ]\n  | where reg_age_days<30 OR is_vps=\"\
      true\"\n  | table _time, host, certificate.subject, validity_days, reg_age_days, is_vps"
- question: When a Random Forest/decision tree is trained on x509/ssl certificate features (validity duration,
    public-key size, issuer, SANs, self-signed status, JA4X fingerprint) enriched with Event ID 5156 -
    and a flow-level fallback classifier is used where TLS 1.3 hides the certificate - which sessions
    are classified as malicious, and what are the top-3 driving features?
  context: A supervised model over certificate features captures malicious certs that no single rule does.
    Training a Random Forest/decision tree on {validity duration, public-key size, issuer, SAN list, self-signed
    status, JA4X certificate fingerprint} enriched with Event ID 5156 lets the analyst classify TLS sessions
    as benign or C2-like based on the overall certificate profile of rented infrastructure. Where TLS
    1.3 encrypts the certificate so x509 features are unavailable, falling back to flow-level classification
    (per Novo et al., RAID 2024) preserves coverage. The model should surface the top-3 driving features
    (e.g., 'self-signed', 'validity 7 days', 'JA4X rare') so the lead is explainable. A malicious classification
    with a rare JA4X and short validity to a VPS destination is a strong lead; well-known issuers and
    long-lived certs from reputable services score benign.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points with TLS Inspection Capabilities'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = per_cert(validity_duration, pubkey_size, issuer, san_count, self_signed,\
      \ ja4x)\n             enriched_with EventCode=5156\n  model = RandomForest.fit(labeled_cert_malicious_vs_benign)\n\
      \  tls13 = sessions where certificate hidden -> flow_clf = NovoFlowClassifier.score(flow_features)\n\
      \  emit model.predict==malicious OR flow_clf high with top3 driving features"
