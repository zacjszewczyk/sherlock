name: 'T1027.012: Obfuscated Files or Information: LNK Icon Smuggling'
id: 6438972a-ad40-42d9-b1ed-9249453764f0
description: 'Investigate adversary abuse of Windows shortcut (.LNK) files that smuggle commands or payload
  references inside the icon-location metadata (IconEnvironmentDataBlock) to slip past content filters
  and deliver malware. This playbook helps an analyst move from the creation of a suspicious .LNK file
  to evidence of hidden payload retrieval and execution: it parses icon-location fields and matches them
  against threat intelligence and recent outbound telemetry; flags remote UNC/WebDAV or user-writable
  temp icon paths that are inconsistent with benign local-DLL icon references; profiles fetch-failure
  behavior typical of short-lived or sinkholed smuggling infrastructure; baselines lexical, entropy, and
  frequency features of icon strings with statistical and machine-learning scoring; and correlates explorer.exe
  (or LNK-invoked LOLBin) outbound connections, downloaded files, and follow-on unsigned or low-prevalence
  process execution into the end-to-end LNK drop-chain used to stage and launch a concealed payload.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: When a new .LNK file is created, does its parsed icon-location path (the StringData ICON_LOCATION
    and the ExtraData IconEnvironmentDataBlock) resolve to a URL, hostname, or IP address that matches
    a threat-intelligence indicator or recent outbound telemetry tied to payload-hosting infrastructure?
  context: 'Benign shortcuts almost always reference a local icon resource (e.g., a DLL or ICO on the
    system drive). Under LNK Icon Smuggling the adversary plants a remote destination in the icon metadata
    so that merely rendering or invoking the shortcut triggers a download past content filters. Use an
    on-host parser such as LnkParse3 (fields per MS-SHLLINK) on each .LNK creation event, normalize any
    URL/hostname/IP from the icon fields, and compare against TI feeds and recent egress logs. A match
    to known payload-delivery infrastructure is a high-confidence indicator the shortcut is weaponized;
    the absence of a remote destination, or a match only to known-good CDNs, lowers suspicion. Tie this
    to the Stealth tactic: the adversary is hiding a network fetch inside an otherwise innocuous file
    metadata field. References: [LnkParse3](https://github.com/Matmaus/LnkParse3); [MS-SHLLINK](https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-shllink/16cb4ca1-9339-4d0c-a68d-bf1d6cc0f943).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Endpoints (user workstations, servers), specifically in user-writable directories like Desktop
    and Downloads; Email security gateway sandboxes; Web proxy and DNS server logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'lnk = FROM Sysmon(EID=11) OR Win(EID=4663) WHERE file ENDSWITH ''.lnk''

      parsed = LnkParse3(lnk).extract(ICON_LOCATION, IconEnvironmentDataBlock)

      dest = normalize_url_host_ip(parsed.icon)

      ALERT WHERE dest IN threat_intel OR dest IN recent_outbound_payload_infra'
- question: Do attempts to reach the destination embedded in a .LNK icon path return HTTP 404/errors,
    resolve to NXDOMAIN, or get blocked/reset, indicating the icon host is short-lived, taken-down, or
    sinkholed smuggling infrastructure?
  context: 'Smuggling infrastructure is frequently disposable: domains are registered briefly, taken down,
    or sinkholed shortly after a campaign. By correlating each icon-path destination with Zeek http.log,
    dns.log, and conn.log outcomes, an analyst can use the failure mode itself as a signal — a fresh shortcut
    pointing to a host that returns errors, NXDOMAIN, or connection resets is suspicious in a way a normal
    local icon never would be. A positive result (failed/blocked fetch to a freshly-seen icon host) supports
    concealment via smuggling; a clean, consistently-resolving destination tied to legitimate services
    lowers concern. This is tactic-specific to Stealth because the adversary relies on the fetch staying
    hidden, and its failures betray the attempt. References: [Homoliak et al.](https://www.sei.cmu.edu/documents/4495/2023_017_001_890953.pdf).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Endpoints (user workstations, servers), specifically in user-writable directories like Desktop
    and Downloads; Email security gateway sandboxes; Web proxy and DNS server logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'dest = parsed_icon_destinations

      fetch = JOIN dest WITH Zeek_http, Zeek_dns, Zeek_conn ON host

      ALERT WHERE http.status IN [404,4xx,5xx] OR dns.rcode=''NXDOMAIN'' OR conn.state IN [''REJ'',''RSTO'',''S0'']'
- question: Is the registered domain or top-level domain of a .LNK icon-path destination statistically
    rare across the enterprise, and does the icon hostname/string show high Shannon entropy or unusual
    label length consistent with attacker-controlled or generated infrastructure?
  context: 'Maintain a rolling 30-day frequency count of TLDs and registered domains observed in icon-path
    destinations. Alert when a destination''s TLD falls in the bottom 5th percentile of enterprise prevalence,
    and add stateless lexical features — Shannon entropy and label-length scoring of the hostname/icon
    string — to catch DGA-like or obfuscated hosts. Legitimate icon references cluster on a small set
    of common domains/TLDs; smuggling destinations skew toward rare, newly-seen, or randomized names.
    A rare-TLD plus high-entropy hostname is a strong combined signal, while a common, low-entropy destination
    is likely benign. Under Stealth, attackers prefer disposable, low-prevalence infrastructure that blends
    into the long tail of network destinations. References: [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf);
    [NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Endpoints (user workstations, servers), specifically in user-writable directories like Desktop
    and Downloads; Email security gateway sandboxes; Web proxy and DNS server logs.'
  range: Last 30 days for TLD/domain frequency baseline; score new events continuously.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'freq = COUNT icon_dest BY tld, registered_domain OVER last_30d

      rare = freq.tld < percentile(5, enterprise_tld_prevalence)

      ALERT WHERE rare AND (shannon_entropy(hostname) > thresh OR max_label_len(hostname) > thresh)'
- question: When scored by a supervised classifier on lexical and structural features, does a .LNK icon
    path exceed the malicious-probability threshold, and which features drive that score?
  context: 'Train an XGBoost or Random Forest model on engineered features of the icon path — string length,
    entropy, IP-literal flag, UNC/WebDAV markers, TLD rank, file age, and signed-target flag. Score each
    parsed icon path and alert when the malicious probability exceeds 0.85, surfacing the top-3 contributing
    features (e.g., entropy, IP flag, rare TLD) in the alert text so the analyst can triage quickly. This
    catches smuggling variants that evade single-feature rules by combining weak signals. A high-probability
    score with interpretable drivers warrants investigation; a low score on a path with only benign features
    is reassuring. Aligned to Stealth, ML helps separate the rare weaponized shortcut from the bulk of
    legitimate, locally-referenced icons. References: [Zero-Day XGBoost/RF](https://www.researchgate.net/publication/386124227_Performance_Comparative_Study_on_Zero_Day_Malware_Detection_Using_XGBoost_and_Random_Forest_Classifiers);
    [CNN-GRU XAI](https://peerj.com/articles/cs-3258/).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Endpoints (user workstations, servers), specifically in user-writable directories like Desktop
    and Downloads; Email security gateway sandboxes; Web proxy and DNS server logs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'feat = features(icon_path: length, entropy, ip_literal, unc_webdav, tld_rank, file_age, signed_target)

      p = XGBoost_or_RF.predict_proba(feat)

      ALERT WHERE p > 0.85 EMIT top3_features(feat)'
- question: Does a .LNK icon path point to a remote UNC/WebDAV resource (\\host\, @SSL, DavWWWRoot) or
    to a user-writable directory such as temp, public, downloads, or a roaming profile, rather than the
    local DLL/ICO references benign shortcuts use?
  context: 'Parse icon paths from Sysmon Event ID 11 .LNK creations and flag two anomalous shapes: (1)
    remote-mount patterns — UNC paths, WebDAV @SSL markers, or DavWWWRoot — which can trigger silent payload
    retrieval when the shortcut is rendered, and (2) icon paths resolving to user-writable temp/public/downloads/roaming
    directories, which legitimate software almost never uses for icons. These structural anomalies are
    strong indicators of icon smuggling because ordinary shortcuts reference stable, system-owned icon
    resources. A remote or user-writable icon path is suspicious and should be parsed and enriched; a
    local system-path icon is expected. This supports the Stealth tactic by exposing the adversary''s
    attempt to disguise a network or staging reference as a benign icon. References: [MS-SHLLINK](https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-shllink/16cb4ca1-9339-4d0c-a68d-bf1d6cc0f943);
    [Carvey](https://doi.org/10.1016/b978-1-59749-643-8.00032-8); [Joshi et al.](https://doi.org/10.1109/eit64391.2025.11103693).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: Endpoints (user workstations, terminal servers), network file shares, and logs from domain controllers
    and SMB file servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "parsed = LnkParse3(FROM Sysmon(EID=11) WHERE file ENDSWITH '.lnk').icon\nALERT WHERE parsed\
      \ MATCHES (r'^\\\\\\\\', '@SSL', 'DavWWWRoot')\n   OR parsed IN (temp, public, downloads, roaming_profile\
      \ dirs)"
- question: Are there bursts of failed or first-seen SMB/WebDAV mount attempts to the destination referenced
    in a .LNK icon path from a given host?
  context: 'Using Windows Event ID 5145 (detailed file-share access) and Zeek smb_files.log/conn.log,
    profile the success-versus-failure rate of SMB and WebDAV mounts to icon-host destinations. A spike
    of failed mounts, or a first-seen remote-icon access from a host, is consistent with a smuggling shortcut
    attempting to reach disposable or unreachable infrastructure. The failure mode is itself the signal:
    benign remote shares mount reliably and repeatedly, whereas smuggling destinations are often newly-referenced
    and prone to failure. A burst of failed/first-seen remote-icon mounts elevates concern; steady, established
    share access does not. Tied to Stealth, this catches the concealed retrieval attempt even when the
    payload fetch ultimately fails. References: [Homoliak et al.](https://www.sei.cmu.edu/documents/4495/2023_017_001_890953.pdf).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: Endpoints (user workstations, terminal servers), network file shares, and logs from domain controllers
    and SMB file servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'mounts = FROM Win(EID=5145) JOIN Zeek_smb_files, Zeek_conn ON icon_host

      rate = success_vs_failure(mounts) BY host OVER window

      ALERT WHERE failure_burst(rate) OR first_seen_remote_icon(host)'
- question: Does the Shannon entropy of a .LNK icon-path string exceed the host or business-unit baseline
    (98th percentile) or an absolute threshold of 7.0, indicating encoded or obfuscated content hidden
    in the icon field?
  context: 'Baseline the entropy of icon-path strings over 90 days per host and business unit. Alert when
    an icon string''s entropy exceeds the 98th percentile for its peer group, or crosses an absolute Shannon
    entropy of 7.0 that typically signals encoded, packed, or obfuscated content. Legitimate icon paths
    are short, readable filesystem paths with low entropy; smuggled icon fields carrying encoded URLs,
    base64-like blobs, or randomized hosts show markedly higher entropy. A high-entropy outlier is a strong
    indicator of obfuscation worth manual parsing; a low-entropy, human-readable path is normal. This
    directly serves the Stealth tactic, where the adversary obfuscates the smuggled reference to evade
    pattern-matching content filters. References: [Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989);
    [Baseline Payload Entropy](https://www.mdpi.com/1999-5903/16/12/470).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: Endpoints (user workstations, terminal servers), network file shares, and logs from domain controllers
    and SMB file servers.'
  range: Last 90 days for baseline; evaluate new icon paths in near real time.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = baseline(shannon_entropy(icon_path)) BY host, business_unit OVER 90d

      ALERT WHERE entropy(icon_path) > percentile(98, base) OR entropy(icon_path) > 7.0'
- question: When evaluated by an unsupervised anomaly detector on icon-path features, is a .LNK icon path
    flagged as an outlier relative to the enterprise's normal icon-reference behavior?
  context: 'Apply Isolation Forest or One-Class SVM to features such as path length, directory depth,
    hostname form, UNC flag, and file age to flag icon paths that deviate from the learned norm. Prefer
    OCSVM for robustness under data poisoning, and surface the top contributing features via LIME in the
    alert so the analyst understands why an item was flagged. Unsupervised detection is valuable here
    because smuggling icon paths are rare and may not match known signatures, yet they sit far from the
    dense cluster of benign local icon references. An item flagged as an outlier with interpretable drivers
    merits review; items inside the normal cluster are deprioritized. This aligns to Stealth by surfacing
    the unusual concealed reference among overwhelmingly benign shortcuts. References: [Isolation Forest
    vs Autoencoders](https://ieeexplore.ieee.org/document/10143005/); [Robust IoT IF/OCSVM](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: Endpoints (user workstations, terminal servers), network file shares, and logs from domain controllers
    and SMB file servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'feat = features(icon_path: length, depth, hostname_form, unc_flag, file_age)

      model = IsolationForest OR OneClassSVM.fit(benign_feat)

      ALERT WHERE model.predict(feat) == OUTLIER EMIT LIME_top_features(feat)'
- question: Did explorer.exe establish an external network connection that is not on the allowlist, especially
    within five minutes of a new .LNK file being created in a user-writable directory?
  context: 'explorer.exe rendering or launching a smuggling shortcut can itself reach out to fetch the
    icon/payload, so an explorer-initiated external connection is anomalous and notable. Build a process-creation
    and network correlation rule (Sysmon Event ID 3/1, Windows 4688) that alerts when explorer.exe connects
    to a non-allowlisted external destination, and weight it heavily when it occurs within ~5 minutes
    of a new .LNK creation in Desktop/Downloads/temp. Benign explorer egress is rare and usually to known
    Microsoft endpoints; an off-allowlist external connection tightly following LNK creation is a strong
    smuggling indicator. A correlated hit warrants immediate triage; explorer with no external egress,
    or only allowlisted connections, is normal. This supports Stealth by exposing the hidden retrieval
    channel masquerading as ordinary shell activity. References: [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Sysmon Event ID 3
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Endpoint EDR/process monitoring logs; Network security monitoring logs at egress points; DNS
    server query logs.'
  range: Last 90 days, with tight 5-minute correlation windows around each new LNK creation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'net = FROM Sysmon(EID=3) WHERE image=''explorer.exe'' AND dest NOT IN allowlist AND is_external(dest)

      lnk = FROM Sysmon(EID=11) WHERE file ENDSWITH ''.lnk'' AND dir IN user_writable

      ALERT WHERE net WITHIN 5m OF lnk ON same_host'
- question: Does explorer.exe egress behavior — distinct external IPs per day, connections per minute,
    and outbound byte volume — rise above the host baseline or target rare destinations?
  context: 'Score the ''egress physics'' of explorer.exe against each host''s baseline: number of distinct
    external IPs per day, connection rate per minute, and outbound byte volume, plus whether destinations
    are rare across the enterprise. A smuggling-driven fetch produces explorer connections that exceed
    the normally near-zero external baseline or reach into the long tail of rare destinations. An above-baseline
    spike or a connection to a rare external IP is suspicious; counts within the established baseline
    are benign. Tied to Stealth, this statistical view detects the abnormal network behavior of a shell
    process that should rarely talk to the internet, even when no single connection is individually flagged.
    References: [Homoliak et al.](https://www.sei.cmu.edu/documents/4495/2023_017_001_890953.pdf); [Nadler
    et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Sysmon Event ID 3
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Endpoint EDR/process monitoring logs; Network security monitoring logs at egress points; DNS
    server query logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'egress = FROM Sysmon(EID=3) WHERE image=''explorer.exe''

      stats = COUNT distinct_ext_ip/day, conn/min, out_bytes BY host

      ALERT WHERE stats > host_baseline OR dest IN rare_destinations'
- question: Are there spikes in explorer.exe DNS NXDOMAIN responses, HTTP 4xx/5xx errors, or blocked/reset
    connections, indicating failed payload-retrieval attempts against takedown or sinkhole infrastructure?
  context: 'Track explorer.exe network outcomes from Zeek dns.log/http.log/conn.log and alert on spikes
    in NXDOMAIN responses, HTTP 4xx/5xx, and blocked/reset connections. Payload-retrieval attempts driven
    by smuggling shortcuts frequently fail because the hosting infrastructure has been taken down or sinkholed
    — so the failure rate is itself a useful signal. A burst of failed explorer egress, especially correlated
    with recent LNK activity, is consistent with attempted but unsuccessful smuggling; a quiet explorer
    with no failed egress is normal. This serves the Stealth tactic by catching the concealed fetch attempt
    through its error signature even when the download never completes. References: [Homoliak et al.](https://www.sei.cmu.edu/documents/4495/2023_017_001_890953.pdf).'
  answer_sources:
  - Sysmon Event ID 3
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Endpoint EDR/process monitoring logs; Network security monitoring logs at egress points; DNS
    server query logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fail = FROM Zeek_dns,Zeek_http,Zeek_conn WHERE proc=''explorer.exe''

      rate = COUNT(NXDOMAIN, http_4xx_5xx, blocked_reset) BY host OVER window

      ALERT WHERE spike(rate) vs baseline'
- question: Do time-series and anomaly models of explorer.exe outbound bytes and connection counts show
    statistically significant deviations from its learned normal behavior?
  context: 'Fit a time-series model such as SARIMA or Prophet to explorer.exe outbound byte volume and
    connection counts, and complement it with an Isolation Forest over egress features. Alert on statistically
    significant deviations and name the top contributing features so the analyst can interpret the anomaly.
    Because explorer.exe normally generates predictable, minimal external traffic, a modeled deviation
    — a sudden burst of bytes or connections out of trend — is a meaningful signal of smuggling-driven
    retrieval. A flagged deviation with clear drivers warrants investigation; behavior within the model''s
    expected envelope is benign. Aligned to Stealth, this detects the hidden network handoff that a static
    threshold might miss amid normal variance. References: [Isolation Forest vs Autoencoders](https://ieeexplore.ieee.org/document/10143005/).'
  answer_sources:
  - Sysmon Event ID 3
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Endpoint EDR/process monitoring logs; Network security monitoring logs at egress points; DNS
    server query logs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'ts = timeseries(explorer.out_bytes, explorer.conn_count) BY host

      model = SARIMA OR Prophet.fit(ts) ; iso = IsolationForest.fit(egress_feat)

      ALERT WHERE observed DEVIATES significantly FROM model EMIT top_features'
- question: Within a five-minute window on one host, do you observe the ordered sequence of .LNK creation,
    an explorer.exe (or LNK-invoked LOLBin) outbound connection, and then execution of a suspicious unsigned
    or low-prevalence child process?
  context: 'Encode the smuggling kill-chain as a deterministic correlation rule: (1) a new .LNK file is
    created in a user-writable directory, (2) explorer.exe or an LNK-invoked LOLBin makes an outbound
    connection, and (3) a follow-on unsigned/low-prevalence process executes — all within roughly five
    minutes on the same host. This ordered handoff is the signature of staging and launching a hidden
    payload, and matching the full sequence is far more specific than any single step. A complete chain
    match is a high-confidence detection that should trigger response; isolated steps without the full
    sequence are lower priority. This directly addresses Stealth by reconstructing the concealed end-to-end
    delivery from individually unremarkable events. References: [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Sysmon Event ID 3
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: Aggregated security logs in a central SIEM or data lake containing endpoint process, file, and
    network events; EDR platform consoles.'
  range: Last 90 days, with tight 5-minute correlation windows around each new LNK creation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SEQUENCE WITHIN 5m ON same_host:\n  1) Sysmon(EID=11) lnk_create IN user_writable\n  2) Sysmon(EID=3)\
      \ explorer.exe OR lnk_lolbin outbound_conn\n  3) Sysmon(EID=1)/Win(4688) child_proc WHERE unsigned\
      \ OR low_prevalence\nALERT WHERE full_sequence_matched"
- question: Does a host's rolling one-hour risk score — weighting LNK creation with a remote/temp icon
    path, explorer network activity, egress failure spikes, unsigned execution, and temp-path execution
    — exceed the 99th percentile?
  context: 'Assign weights to the component behaviors of icon smuggling: LNK creation with a remote or
    temp icon path, explorer.exe network activity, egress failure-rate spikes, unsigned-binary execution,
    and execution from temp paths. Sum them into a rolling one-hour host risk score and alert when it
    crosses the 99th percentile. This aggregate approach catches campaigns that spread weak signals across
    multiple events that would each evade an individual rule. A host whose combined score breaches the
    threshold is a strong investigative lead; hosts with only sporadic low-weight events stay below it.
    Under Stealth, risk scoring counters the adversary''s effort to keep each step quiet by measuring
    their cumulative footprint. References: [Homoliak et al.](https://www.sei.cmu.edu/documents/4495/2023_017_001_890953.pdf).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Sysmon Event ID 3
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: Aggregated security logs in a central SIEM or data lake containing endpoint process, file, and
    network events; EDR platform consoles.'
  range: Last 90 days, scored over rolling 1-hour windows per host.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "score = w1*lnk_remote_temp_icon + w2*explorer_net + w3*egress_fail_spike\n        + w4*unsigned_exec\
      \ + w5*temp_path_exec  OVER rolling_1h BY host\nALERT WHERE score > percentile(99, host_scores)"
- question: When host events are represented as a provenance graph, does a subgraph matching LNK-download
    to explorer-execution to outbound-connection appear, as detected by a graph autoencoder or GNN?
  context: 'Model host process, file, and network events as a provenance graph and use a graph autoencoder
    or GNN (e.g., KAIROS/ThreaTrace-style approaches) to detect the characteristic icon-smuggling subgraph:
    LNK download leading to explorer-driven execution leading to an outbound connection. Emit the reconstructed
    subgraph for triage so the analyst sees the full causal chain. Graph detection captures structural
    relationships that flat correlation rules miss and is resilient to timing or naming variation across
    campaigns. A high-confidence subgraph match is a strong, explainable detection; normal provenance
    with no such structure is benign. This serves the Stealth tactic by revealing the concealed multi-stage
    delivery as a connected pattern of causality rather than disconnected alerts. References: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf);
    [ThreaTrace](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Sysmon Event ID 3
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: Aggregated security logs in a central SIEM or data lake containing endpoint process, file, and
    network events; EDR platform consoles.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'G = provenance_graph(process, file, network events) BY host

      model = GraphAutoencoder OR GNN  # KAIROS/ThreaTrace style

      ALERT WHERE subgraph(lnk_download -> explorer_exec -> outbound_conn) DETECTED EMIT reconstructed_subgraph'
