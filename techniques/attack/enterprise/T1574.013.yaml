questions:
- question: '[Stealth] Match process hashes to KernelCallbackTable-valued TI: Can you determine whether
    a GUI-capable process is accessed with write permissions and the associated binary hash matches a
    threat intelligence entry for malware families known to employ KernelCallbackTable hijacking (e.g.,
    FinFisher/FinSpy, Lazarus tooling), indicating the likely implant or loader was staged before callback
    tampering. -- specifically, using the ''Match process hashes to KernelCallbackTable-valued TI'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses the KernelCallbackTable
    of a GUI process to hijack its execution flow and run a payload under cover of a legitimate process,
    which helps satisfy the information requirement: "Is the adversary maintaining persistence by hijacking
    process execution flow via KernelCallbackTable?". This evidence focuses on the condition that a GUI-capable
    process is accessed with write permissions and the associated binary hash matches a threat intelligence
    entry for malware families known to employ KernelCallbackTable hijacking (e.g., FinFisher/FinSpy,
    Lazarus tooling), indicating the likely implant or loader was staged before callback tampering. This
    Symbolic Logic approach works as follows: Ingest process creation events (Windows Event ID 4688 /
    Sysmon Event ID 1) and compare the SHA256 of ''NewProcessName'' against a TI feed of hashes for malware/tools
    known to use KernelCallbackTable hijacking (FinFisher/FinSpy, Lazarus loaders). The KCT primitive
    requires staging a payload in a GUI process via WriteProcessMemory after reading the PEB callback
    table, so correlate any hash hit with a same-host Sysmon Event ID 10 (ProcessAccess) granting write
    rights to a GUI process. Generate a high-severity alert on match. [Windows Process Injection: KernelCallbackTable](https://modexp.wordpress.com/2019/05/25/windows-injection-finspy/)
    [LSABreaker and the KernelCallbackTable Injection](https://www.deepinstinct.com/blog/lsabreaker-and-the-kernelcallbacktable-injection)
    A positive result -- a rule match, statistical outlier, or model alert -- is consistent with KernelCallbackTable
    hijacking; pivot to the source/target processes and their parent lineage, the handle and memory-access
    activity (NtQueryInformationProcess -> WriteProcessMemory -> PEB update -> Windows-message trigger),
    the user/device and integrity context, any persistence created, and downstream child processes or
    network egress. A negative result helps reduce the likelihood of this specific vector but should be
    corroborated with the other questions in this playbook, since any single method can miss stealthy,
    masked, or evasion-hardened KCT activity.'
  answer_sources:
  - Windows Event ID 4656
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from win:4688, sysmon:1

      | eval sha256=hash(NewProcessName)

      | lookup ti_kct_hashes sha256 OUTPUT family   // FinFisher/FinSpy, Lazarus

      | join host [search sysmon:10 GrantedAccess IN (0x20,0x1FFFFF) TargetImage IN gui_apps]

      | where isnotnull(family)

      | alert severity=high'
- question: '[Stealth] Flag low-prevalence, high-entropy executables: Can you determine whether a GUI-capable
    process is accessed with write permissions and the associated binary hash matches a threat intelligence
    entry for malware families known to employ KernelCallbackTable hijacking (e.g., FinFisher/FinSpy,
    Lazarus tooling), indicating the likely implant or loader was staged before callback tampering. --
    specifically, using the ''Flag low-prevalence, high-entropy executables'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses the KernelCallbackTable
    of a GUI process to hijack its execution flow and run a payload under cover of a legitimate process,
    which helps satisfy the information requirement: "Is the adversary maintaining persistence by hijacking
    process execution flow via KernelCallbackTable?". This evidence focuses on the condition that a GUI-capable
