name: 'T1574.013: Hijack Execution Flow: KernelCallbackTable'
id: 6b81ddda-057b-4c3b-8da4-e03195f4e92e
description: 'This playbook helps an analyst investigate whether an adversary is hijacking the execution
  flow of a GUI-capable Windows process by tampering with its KernelCallbackTable (KCT) in the Process
  Environment Block (PEB) in order to run their own payload while masquerading under a legitimate, trusted
  process. The KCT primitive is associated with sophisticated actors and tooling (e.g., FinFisher/FinSpy
  and Lazarus loaders) and typically follows a recognizable chain: a source process reads a target GUI
  process''s PEB (NtQueryInformationProcess), opens a write-capable handle (PROCESS_VM_WRITE / PROCESS_VM_OPERATION
  / PROCESS_ALL_ACCESS), writes a duplicated callback table or payload into the target (WriteProcessMemory),
  updates the PEB to point at the tampered table, and then triggers execution via a Windows message before
  optionally restoring the table to evade detection. Because the malicious code executes within a benign
  GUI process, the resulting tradecraft shows up as anomalous behavior of that host process rather than
  as an obviously malicious binary. This playbook spans both the Stealth and Execution tactics and guides
  the analyst across multiple corroborating angles: matching staged loader hashes against threat intelligence;
  flagging low-prevalence, high-entropy executables; correlating write-access handle grants to GUI processes
  with subsequent persistence actions, privilege elevation without UAC consent, and low-to-high integrity
  writes; detecting GUI processes that spawn shells, reconnaissance tools, or persistence utilities (schtasks,
  reg) or modify autorun keys; identifying anomalous outbound network connections from normally quiet
  GUI processes (known-C2 IOCs, newly registered domains, rare JA3/JA3S fingerprints, DNS entropy, beaconing);
  and fusing these into multi-stage, per-instance behavioral chains. Detection methods combine symbolic-logic
  rules, statistical baselining, and machine-learning models (LSTM autoencoders, Isolation Forest, One-Class
  SVM, gradient-boosted classifiers, and provenance-graph GNNs) applied to Windows Security events (4656,
  4657, 4688, 4698, 5156), Sysmon (Event ID 1/3/10), ETW Threat-Intelligence call stacks, and Zeek conn/dns/ssl
  logs so the analyst can confirm suspected KernelCallbackTable hijacking against process lineage, handle
  and memory access, integrity transitions, persistence, and network egress.'
