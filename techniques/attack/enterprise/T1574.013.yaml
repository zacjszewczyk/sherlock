- question: '[Stealth] Detect GUI parents launching persistence tools: Can you determine whether a process
    commonly associated with GUI interaction (e.g., explorer.exe, chrome.exe, winword.exe) is observed
    as the parent process for an action that creates or modifies a system persistence mechanism, such
    as creating a scheduled task or modifying a registry autorun key. -- specifically, using the ''Detect
    GUI parents launching persistence tools'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses the KernelCallbackTable
    of a GUI process to hijack its execution flow and run a payload under cover of a legitimate process,
    which helps satisfy the information requirement: "Is the adversary maintaining persistence by hijacking
    process execution flow via KernelCallbackTable?". This evidence focuses on the condition that a process
    commonly associated with GUI interaction (e.g., explorer.exe, chrome.exe, winword.exe) is observed
    as the parent process for an action that creates or modifies a system persistence mechanism, such
    as creating a scheduled task or modifying a registry autorun key. This Symbolic Logic approach works
    as follows: Alert when a process creation event (Event ID 4688) for ''schtasks.exe'' or ''reg.exe''
    has a parent from a GUI-app watchlist (''explorer.exe'',''chrome.exe'',''outlook.exe'',''winword.exe''),
    or when a registry modification (Event ID 4657) to autorun keys (e.g., HKLM\Software\Microsoft\Windows\CurrentVersion\Run)
    is made by a GUI subject process. A hijacked GUI process driving persistence is an anomalous parent-child
    relationship. [Unusual Parent-Child Relationship](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/)
    [SigmaHQ Detection Rules](https://github.com/SigmaHQ/sigma) A positive result -- a rule match, statistical
    outlier, or model alert -- is consistent with KernelCallbackTable hijacking; pivot to the source/target
    processes and their parent lineage, the handle and memory-access activity (NtQueryInformationProcess
    -> WriteProcessMemory -> PEB update -> Windows-message trigger), the user/device and integrity context,
    any persistence created, and downstream child processes or network egress. A negative result helps
    reduce the likelihood of this specific vector but should be corroborated with the other questions
    in this playbook, since any single method can miss stealthy, masked, or evasion-hardened KCT activity.'
