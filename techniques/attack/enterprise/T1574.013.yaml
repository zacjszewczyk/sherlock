    entry for malware families known to employ KernelCallbackTable hijacking (e.g., FinFisher/FinSpy,
    Lazarus tooling), indicating the likely implant or loader was staged before callback tampering. This
    Statistical Method approach works as follows: For each new executable hash (Event ID 4688), compute
    enterprise-wide prevalence over a 30-day rolling window (Volume) and file entropy. Flag hashes that
    are both rare (seen on < 0.1% of endpoints) and high-entropy (> 7.5), indicating packed/encrypted
    loaders; derive the entropy cutoff per environment from the 99th percentile of benign signed binaries.
    [Mal-API-2019 benchmark distributions](https://github.com/ocatak/malware_api_class) A positive result
    -- a rule match, statistical outlier, or model alert -- is consistent with KernelCallbackTable hijacking;
    pivot to the source/target processes and their parent lineage, the handle and memory-access activity
    (NtQueryInformationProcess -> WriteProcessMemory -> PEB update -> Windows-message trigger), the user/device
    and integrity context, any persistence created, and downstream child processes or network egress.
    A negative result helps reduce the likelihood of this specific vector but should be corroborated with
    the other questions in this playbook, since any single method can miss stealthy, masked, or evasion-hardened
    KCT activity.'
  answer_sources:
  - Windows Event ID 4656
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from win:4688 over last 30d

      | stats dc(host) as hosts by sha256

      | eval prevalence=hosts/total_hosts, entropy=file_entropy(sha256)

      | where prevalence < 0.001 AND entropy > 7.5   // cutoff = p99 of benign signed binaries

      | alert'
