questions:
- question: '[Stealth] Match InstallUtil assemblies to known IOCs (Symbolic Logic): Can you determine
    whether the SHA256 hash of the .NET assembly file executed by InstallUtil.exe matches a known-bad
    hash from an integrated threat intelligence feed. Use process creation telemetry for command-line,
    parent-process, and user context. -- specifically, by applying the ''Match InstallUtil assemblies
    to known IOCs'' approach (Symbolic Logic) to answer the mission question "Has the adversary executed
    code via InstallUtil for defense evasion? (TA0005 - Defense Evasion)"?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses InstallUtil.exe --
    a Microsoft-signed, trusted .NET command-line utility located in C:\Windows\Microsoft.NET\Framework[64]\v*\
    -- to proxy execution of attacker-supplied code, often via the [System.ComponentModel.RunInstaller(true)]
    uninstall path, in order to bypass application control and blend malicious execution into normal,
    signed activity. This evidence focuses on the condition that the SHA256 hash of the .NET assembly
    file executed by InstallUtil.exe matches a known-bad hash from an integrated threat intelligence feed.
    Use process creation telemetry for command-line, parent-process, and user context. This Symbolic Logic
    approach pursues that signal as follows: Correlate the relevant process, file, and network telemetry
    before applying the rule. For InstallUtil.exe process creations (Windows Event ID 4688, Sysmon Event
    ID 1) where Image ends with `\InstallUtil.exe` or OriginalFileName is InstallUtil.exe, resolve and
    hash the targeted .NET assembly and compare the SHA256 to threat intelligence, alerting on any match.
    Confirm the binary executed is the signed Microsoft .NET utility from `C:\Windows\Microsoft.NET\Framework[64]\v*\`
    per [LOLBAS Installutil](https://lolbas-project.github.io/lolbas/Binaries/Installutil/) and [MITRE
    T1218.004](https://attack.mitre.org/techniques/T1218/004/). A positive result -- a rule match, a statistical
    outlier, or a model alert -- indicates InstallUtil.exe is likely being used as a living-off-the-land
    proxy rather than for legitimate software installation; pivot to the responsible InstallUtil process,
    its command line and targeted assembly, the parent/grandparent lineage, the executing user and host
    role, the file''s origin and hash, loaded modules, and any subsequent network or child-process activity.
    A negative result helps reduce suspicion for this specific vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy, signed, or context-triggered
    LOLBin abuse.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: File systems and process logs on all Windows endpoints and servers, with heightened monitoring
    on developer workstations, build servers, and application servers where .NET is prevalent.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match InstallUtil assemblies to known IOCs

      source IN [Windows Event ID 4688, Sysmon Event ID 1]

      | FILTER Image ENDSWITH ''\\InstallUtil.exe'' OR OriginalFileName == ''InstallUtil.exe''

      | WHERE matches_action_criteria("Match InstallUtil assemblies to known IOCs")

      // Correlate the relevant process, file, and network telemetry before applying the rule. For InstallUtil.exe
      process creati

      | ALERT enrich(host, user, process, parent, cmdline, assembly, hash, dest)'
