name: 'T1218.004: System Binary Proxy Execution: InstallUtil'
id: 793a2e67-7c68-41cf-9441-63b78ed4c16c
description: 'This playbook helps an analyst investigate whether an adversary has abused InstallUtil.exe
  -- a Microsoft-signed .NET command-line utility in C:\Windows\Microsoft.NET\Framework[64]\v*\ -- to
  proxy execution of malicious code and bypass application control as part of the Stealth tactic. It guides
  the hunt across several behavioral angles on Windows endpoints and servers: matching the .NET assembly
  executed by InstallUtil against threat-intelligence hashes and flagging rare, high-entropy, or ML-classified-malicious
  assemblies; detecting the /U (/uninstall) application-control-bypass pattern (`/logfile= /LogToConsole=false
  /U <dll>`) targeting user-writable or network paths and scoring path/command-line entropy and failed/blocked
  execution attempts; alerting on InstallUtil launched by anomalous parents (Office, browsers, script
  hosts) or loading unexpected modules and clustering lineage anomalies; correlating InstallUtil with
  short-window outbound connections to intel-flagged, rare, or odd-port destinations including the `InstallUtil.exe
  {REMOTEURL}` download pattern; and linking network downloads of .NET assemblies to their rapid execution
  by InstallUtil via time-delta scoring and provenance-graph analysis. Detection methods combine symbolic-logic
  rules, statistical baselining (modified Z-scores, prevalence/rarity, entropy, failure-rate profiling),
  and machine learning (gradient boosting, logistic regression, Isolation Forest, DBSCAN, LSTM/DeepLog
  sequence models, and graph anomaly detection) applied to Windows Event ID 4688, Sysmon Event IDs 1/3/7/11,
  PowerShell logs, and Zeek conn/dns/files telemetry, so the analyst can corroborate suspected InstallUtil
  proxy execution against assembly reputation, process lineage, path context, module loads, and download/C2
  activity.'
type: technique
