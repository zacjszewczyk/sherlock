name: 'T1543.005: Container Service'
id: bf3a430e-a961-43b6-ab93-0c3865083789
description: 'Investigate adversary creation or modification of container and container-cluster management
  services (Docker, Podman, kubelet, Kubernetes DaemonSets/Pods) used to establish persistence or escalate
  privileges on a host. This playbook helps an analyst hunt for: malicious or low-prevalence container
  images and pulls from non-allowlisted registries; container runtime executions that use persistence
  directives such as --restart=always/unless-stopped or systemd units that launch containers; Kubernetes
  DaemonSet and Pod creation (including privileged/hostPath specs) by unauthorized principals; container-escape
  and privilege-escalation CVE exploitation (e.g., runc, cgroups), privileged/sensitive-mount container
  launches, anomalous host child processes spawned by container runtimes (container escapes), and post-escape
  east-west pivoting to critical subnets, cloud metadata endpoints, or external C2. It combines symbolic-logic
  rules, statistical baselining/anomaly detection, and machine-learning approaches over container runtime
  logs, auditd/Sysmon process telemetry, Windows Event ID 4688, Kubernetes audit/API server logs, and
  Zeek network logs.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any containers being launched from images whose name, tag, or digest matches known-malicious
    threat intelligence, or pulled from registries outside the approved allowlist?
  context: Persistence via container services often begins with pulling an attacker-controlled image.
    Parse container runtime command lines and Zeek HTTP/file logs for image names, tags, and SHA256 digests,
    then compare them against threat-intel feeds and an approved-registry allowlist. A match, or any pull
    from a non-allowlisted registry, is a high-confidence indicator and enforces the NIST SP 800-190 image-provenance/registry-allowlist
    control. A positive result means a known-bad or unsanctioned image entered the environment and that
    container should be isolated and triaged.
  answer_sources:
  - Container runtime logs
  - Kubernetes audit logs
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Container hosts, Kubernetes control plane nodes, Container image registries, Network sensors
    monitoring traffic to external registries'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: index=container_runtime OR sourcetype=zeek_http OR sourcetype=zeek_files | rex field=cmdline
      "(docker|podman)\s+run.*?(?<image>[\w\.\-/:]+)" | eval digest=coalesce(image_digest, sha256) | lookup
      ti_malicious_images image OUTPUT verdict | eval registry=mvindex(split(image,"/"),0) | where verdict="malicious"
      OR NOT registry IN (allowlisted_registries) | table _time host user image digest registry verdict
- question: Which container images have very low prevalence across the fleet (run on very few hosts),
    especially when pulled from non-allowlisted registries?
  context: Adversary-introduced images are typically rare compared with sanctioned base images used across
    many hosts. Calculate per-image prevalence (the count of unique hosts that ran it) over a 30-day window
    and flag images in the bottom 5th percentile, particularly from non-allowlisted registries. Derive
    the per-environment cutoff using a robust modified Z-score on log(prevalence), flagging |0.6745*(x-median)/MAD|
    > 3.5. A low-prevalence image from an unusual registry warrants review for persistence tooling even
    when no threat-intel match exists.
  answer_sources:
  - Container runtime logs
  - Kubernetes audit logs
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Container hosts, Kubernetes control plane nodes, Container image registries, Network sensors
    monitoring traffic to external registries'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: index=container_runtime run_event=* | stats dc(host) as host_prevalence by image registry |
      eval lx=ln(host_prevalence) | eventstats median(lx) as med, median(abs(lx-med)) as mad | eval mz=0.6745*(lx-med)/mad
      | where mz < -3.5 OR (host_prevalence<=percentile(host_prevalence,5)) | where NOT registry IN (allowlisted_registries)
      | table image registry host_prevalence mz
- question: When container metadata is scored by a risk classifier, which newly launched images receive
    a high malicious-risk score?
  context: Some malicious images evade both intel feeds and prevalence checks. Train a Logistic Regression
    or gradient-boosted classifier on image metadata features (name length, tag entropy, registry reputation,
    layer count, pull-failure rate) and alert when the risk score is high. For triage, surface the top-3
    contributing features in the alert text, following explainability guidance in AI-Driven Container
    Security. A high score with explainable drivers (e.g., high tag entropy + low-reputation registry)
    points the analyst to likely persistence imagery without a prior signature.
  answer_sources:
  - Container runtime logs
  - Kubernetes audit logs
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Container hosts, Kubernetes control plane nodes, Container image registries, Network sensors
    monitoring traffic to external registries'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [name_len, tag_entropy, registry_reputation, layer_count, pull_failure_rate] model
      = load("image_risk_gbm") for image in new_images(window="24h"): score = model.predict_proba(features(image))
      if score >= 0.8: alert(image, score, top3=shap_top_features(model, image))'
- question: Are container runtimes being executed with persistence directives such as --restart=always,
    --restart=on-failure, or --restart=unless-stopped, or are systemd units being created that launch
    containers?
  context: The core persistence mechanism for this technique is configuring a container to survive reboots
    and failures. Monitor container runtime execution (auditd execve, Sysmon-for-Linux, or Windows EID
    4688) for docker run / podman run command lines containing --restart=always, --restart=on-failure,
    or unless-stopped, and watch systemd unit creation for container-backed services. Alert on persistence-flag
    use from non-CI/non-allowlisted accounts. These map to the privileged/persistent-container controls
    in NIST SP 800-190 and the Falco container-launch detections. A positive result from an interactive
    or service account (not the CI pipeline) is a strong persistence indicator.
  answer_sources:
  - Container runtime logs
  - Process execution events
  - System service logs
  - 'NAI: Container hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: (index=auditd syscall=execve) OR (EventCode=4688) OR (index=container_runtime) | search cmdline="*run*"
      (cmdline="*--restart=always*" OR cmdline="*--restart=on-failure*" OR cmdline="*unless-stopped*")
      | append [search index=systemd unit_event=create unit_exec IN ("*docker*","*podman*","*containerd*")]
      | where NOT user IN (ci_service_accounts) | table _time host user cmdline unit
- question: Does an account's use of container restart/persistence flags spike beyond its baseline or
    occur for the first time ever?
  context: Legitimate restart-flag usage tends to follow stable per-account patterns (often CI batch jobs).
    Baseline each account's daily count of restart-flag uses over 30 days and alert when usage exceeds
    a robust modified Z-score of 3.5 (MAD-based, which resists CI batch spikes) or when an account uses
    the flag for the first time. A first-time use by a human/service account, or a sudden spike, signals
    possible hands-on persistence setup rather than routine deployment.
  answer_sources:
  - Container runtime logs
  - Process execution events
  - System service logs
  - 'NAI: Container hosts'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: index=container_runtime cmdline="*--restart=*" | bin _time span=1d | stats count as daily by
      user _time | eventstats median(daily) as med, median(abs(daily-med)) as mad by user | eval mz=0.6745*(daily-med)/mad
      | eventstats count as days_seen by user | where mz>3.5 OR days_seen=1 | table _time user daily mz
      days_seen
- question: Do any persisted containers exhibit syscall-frequency distributions that diverge from their
    service's learned-normal profile (e.g., unexpected execve/clone/mount bursts)?
  context: A container persisted for malicious purposes will often behave differently at the kernel level
    than its benign counterpart. Represent each container's syscalls as sliding-window Bag-of-System-Calls
    frequency vectors and flag windows whose distribution diverges from the service's learned-normal profile
    (per Abed et al). Unexpected bursts of execve/clone/mount from a long-running persisted container
    suggest it is doing more than its declared job. A divergent window is a prompt to inspect that container's
    process tree and mounts.
  answer_sources:
  - Container runtime logs
  - Process execution events
  - System service logs
  - 'NAI: Container hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: index=auditd container_id=* | bin _time span=5m | stats count by container_id syscall _time
      | xyseries _time+container_id syscall count   /* BoSC freq vector per window */ | apply cosine_distance(vector,
      baseline_profile[service]) | where distance > learned_threshold | table _time container_id service
      distance top_syscalls
- question: When container command-line arguments are clustered, which commands fall out as noise/outliers
    indicative of malicious persistence?
  context: Routine deployments form dense clusters of similar command lines; bespoke attacker commands
    stand apart. Vectorize container command-line arguments (flag set, lengths, restart policy, mount
    count) and run DBSCAN, flagging noise/outlier commands as potentially malicious persistence. Report
    the nearest-cluster distance and top deviating tokens for explainability. An outlier command combining
    a restart policy with unusual mounts or flags is a strong triage lead.
  answer_sources:
  - Container runtime logs
  - Process execution events
  - System service logs
  - 'NAI: Container hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = vectorize(cmdline -> [flag_set, arg_len, restart_policy, mount_count]) labels = DBSCAN(eps,
      min_samples).fit_predict(X) for cmd where label == -1:   # noise alert(cmd, nearest_cluster_dist,
      deviating_tokens=top_tokens(cmd))'
- question: Are Kubernetes DaemonSets, or Pods with privileged/hostPath specs, being created by unauthorized
    users, service accounts, or source IPs?
  context: DaemonSets persistently deploy a pod to every node (including future nodes), making them a
    powerful cluster-wide persistence primitive. Inspect Kubernetes audit logs (and Zeek http.log POSTs
    to /apis/apps/v1/.../daemonsets) for verb=create with objectRef.resource=daemonsets, or pod creates
    with privileged/hostPath specs, and alert when the request comes from unauthorized users/service accounts
    or IPs. Use the audit fields and DaemonSet/privileged-pod mappings documented by Datadog and the k8s_audit
    Falco rules. A DaemonSet create by a non-admin principal is a high-priority persistence finding.
  answer_sources:
  - Kubernetes audit logs
  - Kubernetes API server logs
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Kubernetes API Server, Network traffic monitoring points between user segments and the Kubernetes
    control plane'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: index=k8s_audit verb=create | where objectRef.resource="daemonsets" OR (objectRef.resource="pods"
      AND (requestObject.spec.privileged=true OR requestObject.spec.volumes{}.hostPath=*)) | where NOT
      user.username IN (authorized_admins) OR NOT sourceIPs{} IN (admin_subnets) | table requestReceivedTimestamp
      user.username sourceIPs objectRef.resource objectRef.name
- question: Are there bursts of Kubernetes API 401/403 authorization failures from a principal or source
    IP immediately preceding a successful DaemonSet or Pod creation?
  context: Adversaries probing RBAC frequently generate authorization failures before landing a successful
    create. Profile per-principal/per-sourceIP Kubernetes API 401/403 (responseStatus.code) rates as a
    distinct failure signal and alert on bursts that precede a successful DaemonSet/pod create, following
    Splunk's Kubernetes Unauthorized Access guidance. A failure burst followed by a success is a strong
    indicator of trial-and-error privilege discovery culminating in persistence.
  answer_sources:
  - Kubernetes audit logs
  - Kubernetes API server logs
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Kubernetes API Server, Network traffic monitoring points between user segments and the Kubernetes
    control plane'
  range: Last 90 days; correlate +/- 1 hour around any successful create
  queries:
  - technology: SIEM/Stats pseudocode
    query: index=k8s_audit | eval fail=if(responseStatus.code IN (401,403),1,0) | bin _time span=10m |
      stats sum(fail) as fails, values(verb) as verbs by user.username sourceIPs _time | where fails>=5
      | join user.username [search index=k8s_audit verb=create responseStatus.code=201 objectRef.resource
      IN ("daemonsets","pods")] | table _time user.username sourceIPs fails objectRef.resource
- question: Does a user's DaemonSet/Deployment creation rate exceed their historical baseline, or does
    a non-admin create one at all?
  context: Even authorized users have stable creation rhythms. Baseline each user's hourly DaemonSet/Deployment
    creation rate and alert when the count exceeds the 99th percentile (MAD-based threshold) or when a
    non-admin creates one. A non-admin DaemonSet creation, or an abnormal spike from any account, points
    to automated or scripted persistence deployment across the cluster.
  answer_sources:
  - Kubernetes audit logs
  - Kubernetes API server logs
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Kubernetes API Server, Network traffic monitoring points between user segments and the Kubernetes
    control plane'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: index=k8s_audit verb=create objectRef.resource IN ("daemonsets","deployments") | bin _time
      span=1h | stats count as c by user.username _time | eventstats median(c) as med, median(abs(c-med))
      as mad by user.username | eval mz=0.6745*(c-med)/mad | where mz>3.5 OR NOT user.username IN (cluster_admins)
      | table _time user.username c mz
- question: When Kubernetes manifests are scored by an anomaly model, which DaemonSet/Pod specs are flagged
    as outliers from known-good configurations?
  context: Malicious manifests differ from sanctioned ones in subtle, multi-field ways. Vectorize manifests
    (image, securityContext.privileged, hostPath/hostPID/hostNetwork, tolerations, nodeSelector) and apply
    an Isolation Forest trained on known-good configs, flagging outliers. Models can be trained/validated
    on the labeled Kubernetes misuse dataset and must surface the top-3 anomalous fields in the alert.
    An outlier manifest combining privileged context with hostPath mounts and broad tolerations is a likely
    persistence/escalation artifact.
  answer_sources:
  - Kubernetes audit logs
  - Kubernetes API server logs
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Kubernetes API Server, Network traffic monitoring points between user segments and the Kubernetes
    control plane'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = vectorize(manifest -> [image, privileged, hostPath, hostPID, hostNetwork, tolerations,
      nodeSelector]) model = IsolationForest().fit(known_good_manifests) for m in new_manifests: if model.decision_function(m)
      < threshold: alert(m, top3_anomalous_fields(model, m))'
- question: Are persisted containers making outbound connections to known C2 IPs, or resolving DGA/newly-registered
    domains?
  context: A persistence container that beacons out reveals attacker infrastructure. Correlate outbound
    Zeek conn.log from container hosts with threat-intel C2 IPs and inspect Zeek dns.log for DGA/newly-registered
    domains, alerting on matches. Pair with Falco 'Unexpected outbound connection' and 'Redirect STDOUT/STDIN
    to Network Connection in Container' rules for first-party corroboration. A conn.log match to a C2
    IP or a DGA-style domain from a container host strongly suggests an active malicious persistence foothold.
  answer_sources:
  - Container runtime logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Container hosts, Network egress points, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: conn.log where orig_h in container_host_subnets | lookup ti_c2_ips resp_h -> verdict | join
      (dns.log | where dga_score>0.8 OR domain_age_days<14) | where verdict="c2" OR dga_match | output
      ts orig_h resp_h resp_p query verdict
- question: Do container hosts show rare JA3/JA3S fingerprints, abnormal destination-port entropy, large
    outbound byte volume, or beacon-like fixed-interval connections?
  context: Beaconing and unusual TLS clients are hallmarks of container-based C2. Baseline per-host destination-port
    entropy, outbound byte volume (orig_bytes), and JA3/JA3S prevalence; flag rare JA3s (<0.1%), large
    entropy deviations, or beacon-like fixed-interval/low-jitter connection frequency using MAD thresholds.
    A rare JA3 combined with regular low-jitter intervals is a classic C2 signature even absent an intel
    match.
  answer_sources:
  - Container runtime logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Container hosts, Network egress points, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: conn.log + ssl.log by orig_h | stats entropy(resp_p) as port_ent, sum(orig_bytes) as bytes,
      dc(ja3) as ja3s, stdev(interval) as jitter, avg(interval) as period | eventstats median(port_ent)
      as m, median(abs(port_ent-m)) as mad | eval mz=0.6745*(port_ent-m)/mad | where ja3_prevalence<0.001
      OR mz>3.5 OR (jitter<2 AND period>0) | output orig_h port_ent bytes ja3 period jitter
- question: Are persisted containers generating high rates of DNS NXDOMAIN responses or failed/refused
    outbound connections, indicating DGA C2 or dead infrastructure?
  context: Failure states are an underused but powerful signal. Track per-container DNS NXDOMAIN rate
    and blocked/failed outbound connection counts as a distinct failure-state signal; a persisted container
    generating many NXDOMAINs or refused connections indicates DGA C2 or dead infrastructure and should
    raise the egress score, consistent with failure-aware baselining in Splunk's Kubernetes guidance.
    A spike in NXDOMAINs from a single container is a high-value lead for DGA-based C2.
  answer_sources:
  - Container runtime logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Container hosts, Network egress points, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: dns.log where rcode_name="NXDOMAIN" and orig_h in container_host_subnets | bin ts span=10m
      | stats count as nx by orig_h ts | append [conn.log where conn_state in ("S0","REJ","RSTO") | stats
      count as fails by orig_h ts] | eventstats median(nx) med, median(abs(nx-med)) mad by orig_h | eval
      mz=0.6745*(nx-med)/mad | where mz>3.5 OR fails>threshold | output ts orig_h nx fails mz
- question: When each host's network rhythm is modeled by an autoencoder, which time windows show high
    reconstruction error consistent with C2 beaconing?
  context: Beaconing produces regular time-series patterns that an autoencoder learns to recognize as
    anomalous when they appear. Train an LSTM autoencoder on each host's orig_bytes/connection-interval
    time series and flag windows with high reconstruction error, reporting the contributing time-window
    features. A high-error window from a container host points to a periodic or volume-anomalous communication
    pattern that merits packet-level inspection.
  answer_sources:
  - Container runtime logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Container hosts, Network egress points, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = per_host_timeseries(orig_bytes, conn_interval, window="1h") ae = load("lstm_autoencoder_net_rhythm")
      for host, win in series: err = ae.reconstruction_error(win) if err > threshold: alert(host, win.t,
      err, top_time_features(win))'
- question: Are there command lines or API request bodies matching signatures for known container-escape
    or privilege-escalation CVEs (e.g., CVE-2019-5736 runc, CVE-2022-0492 cgroups, CVE-2024-21626 runc
    fd leak)?
  context: Container escapes via known CVEs give an adversary host-level privileges. Apply regexes for
    known container-escape CVEs to Event ID 4688 / auditd execve command lines and decoded Zeek http bodies
    targeting container daemons/k8s APIs, alerting on matches. Corroborate with Falco escape rules and
    the host-isolation controls in NIST SP 800-190. A signature match against runtime daemons or the API
    server is a critical privilege-escalation alert demanding immediate response.
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - 'NAI: Container hosts, Kubernetes API Server, Network sensors monitoring control plane traffic'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: (EventCode=4688) OR (index=auditd syscall=execve) OR (sourcetype=zeek_http) | regex cmdline
      OR http_body ="(?i)(/proc/self/exe|runc.*#R|release_agent|memory\.swap.*cgroup|/sys/fs/cgroup.*notify_on_release|fd://.*runc)"
      | table _time host user cmdline uri http_body
- question: Do any docker/podman command lines exhibit abnormally long length or high Shannon entropy
    compared with the learned baseline?
  context: Exploit payloads and obfuscated commands inflate length and entropy. Baseline command length
    and Shannon entropy for docker/podman arguments and alert when a command exceeds the 99.9th percentile
    (MAD-based). An extreme outlier in length/entropy often corresponds to an encoded escape payload and
    is worth decoding and triaging even without a CVE signature.
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - 'NAI: Container hosts, Kubernetes API Server, Network sensors monitoring control plane traffic'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: index=* (process IN ("docker","podman")) | eval len=len(cmdline), ent=shannon_entropy(cmdline)
      | eventstats median(len) ml, median(abs(len-ml)) madl, median(ent) me, median(abs(ent-me)) made
      | eval mzl=0.6745*(len-ml)/madl, mze=0.6745*(ent-me)/made | where mzl>3.29 OR mze>3.29 | table _time
      host user cmdline len ent
- question: Do container syscall sequences contain improbable n-grams (e.g., ptrace/mount/unshare chains)
    characteristic of exploitation?
  context: Escapes drive rare syscall sequences that benign workloads almost never emit. Model benign
    container syscall n-grams with MLE and Simple Good-Turing smoothing and flag improbable sequences
    emitted during exploitation (e.g., ptrace/mount/unshare chains), per the Probabilistic Real-Time Docker
    IDS. A sequence with very low modeled probability during a container's runtime is a strong signal
    of an in-progress escape.
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - 'NAI: Container hosts, Kubernetes API Server, Network sensors monitoring control plane traffic'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'ngram_model = train_mle_sgt(benign_syscall_ngrams, n=3) for seq in container_syscall_stream(window="1m"):
      logp = ngram_model.logprob(seq) if logp < improbable_threshold and contains(seq, [ptrace,mount,unshare,clone]):
      alert(container_id, seq, logp)'
- question: When container command vectors are scored by a one-class SVM trained on normal usage, which
    commands are flagged as anomalous?
  context: A one-class model captures the envelope of normal command usage so novel exploit invocations
    stand out. Train a one-class SVM on normal command vectors (argument counts, flags, lengths, entropy)
    and flag anomalies, surfacing the top-3 distinguishing features. An anomalous command vector with
    explainable drivers (e.g., unusual flag combination + high entropy) is a triage lead for escape attempts
    not covered by signatures.
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - 'NAI: Container hosts, Kubernetes API Server, Network sensors monitoring control plane traffic'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = vectorize(cmd -> [arg_count, flag_set, length, entropy]) ocsvm = OneClassSVM(nu=0.01).fit(normal_X)
      for cmd in stream: if ocsvm.predict(vectorize(cmd)) == -1: alert(cmd, top3=distinguishing_features(ocsvm,
      cmd))'
- question: Are containers being created with privileged flags or sensitive host mounts such as --privileged,
    --security-opt seccomp=unconfined, --cap-add=SYS_ADMIN, --pid=host, or mounts of /, /proc, or /var/run/docker.sock?
  context: These options break container isolation and are the primary path to host privilege escalation.
    Alert when Event ID 4688 / auditd / runtime logs show docker/podman with --privileged, --security-opt
    seccomp=unconfined, --cap-add=SYS_ADMIN, --pid=host, or sensitive host mounts (/, /proc, /var/run/docker.sock).
    These correspond directly to the Falco 'Launch Privileged Container' and 'Launch Sensitive Mount Container'
    rules and the prohibited configurations in NIST SP 800-190. A privileged/sensitive-mount launch outside
    sanctioned workloads is a high-priority escalation indicator.
  answer_sources:
  - Windows Event ID 4688
  - Container runtime logs
  - Kubernetes audit logs
  - 'NAI: All container hosts (servers and workstations with Docker/Podman installed)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: (EventCode=4688) OR (index=auditd) OR (index=container_runtime) | search process IN ("docker","podman")
      | where match(cmdline, "--privileged|seccomp=unconfined|--cap-add=SYS_ADMIN|--pid=host|-v\s+/(:|proc|var/run/docker.sock)")
      | table _time host user cmdline
- question: Is any account using privileged container flags that is not on the authorized allowlist, or
    using them above its baseline rate?
  context: Privileged flags should be rare and confined to a small set of sanctioned accounts. Allowlist
    accounts authorized for privileged flags, baseline their usage, and flag non-allowlisted attempts
    or usage above the 95th percentile (MAD-based). Incorporate the privileged-pod audit fields documented
    by Datadog. A non-allowlisted account invoking --privileged, or a sanctioned account spiking, indicates
    possible escalation abuse.
  answer_sources:
  - Windows Event ID 4688
  - Container runtime logs
  - Kubernetes audit logs
  - 'NAI: All container hosts (servers and workstations with Docker/Podman installed)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: index=container_runtime cmdline="*--privileged*" | bin _time span=1d | stats count as c by
      user _time | eventstats median(c) med, median(abs(c-med)) mad by user | eval mz=0.6745*(c-med)/mad
      | where NOT user IN (privileged_allowlist) OR mz>1.64 | table _time user c mz
- question: When a privilege-escalation classifier scores container launches, which receive a high escalation-risk
    score?
  context: Risk emerges from the interaction of role, flags, mounts, capabilities, and image source. Train
