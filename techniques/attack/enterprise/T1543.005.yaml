- question: For replicated workloads, does one replica's kernel-event (syscall) distribution diverge from
    its peers, indicating that replica is spawning host children?
  context: Replicas of the same service should behave near-identically; the odd one out is suspicious
    without any prior training. For replicated workloads, compare kernel-event (syscall) distributions
    across live replicas of the same service and flag the divergent replica spawning host children — a
    training-free signal that resists mimicry, per ReplicaWatcher. A single replica diverging from its
    peers is a strong, low-false-positive escape signal.
  answer_sources:
  - Windows Event ID 4688
  - Container runtime logs
  - 'NAI: Container hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=auditd service=* replica=* | bin _time span=5m | stats count by service replica syscall
      _time | xyseries replica syscall count | foreach service: d = pairwise_distance(replica_vectors)
      | where replica_max_distance > divergence_threshold | table _time service replica distance host_children'
