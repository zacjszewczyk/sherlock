questions:
- question: Using deterministic detection logic, can analysts identify malicious image feed match as it
    would manifest during Persistence?
  context: 'Under the Persistence tactic, the analyst is looking for the following evidence: A container
    creation event is observed (for example `docker run` or `podman run`) where the specified container
    image name, tag, or digest hash is present on a list of known malicious indicators. This symbolic
    logic approach proceeds as follows: Parse container runtime command lines and Zeek HTTP/file logs
    for image names, tags, and digest hashes, compare them against threat-intel feeds and a registry allowlist,
    and alert on matches or pulls from non-allowlisted registries. Enforce the [NIST SP 800-190](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-190.pdf)
    image-provenance/registry-allowlist control so any pull outside the approved registry set is an alertable
    deviation. A positive result strengthens the case that Container Service is in use for persistence;
    a negative result helps rule it out or redirect the investigation.'
  answer_sources: &id001
  - Container runtime logs
  - Kubernetes audit logs
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Container hosts, Kubernetes control plane nodes, Container image registries, Network sensors
    monitoring traffic to external registries'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: Parse container runtime command lines and Zeek HTTP/file logs for image names, tags, and digest
      hashes, compare them against threat-intel feeds and a registry allowlist, and alert on matches or
      pulls from non-allowlisted registries. Enforce the NIST SP 800-190 image-provenance/registry-allowlist
      control so any pull outside the approved registry set is an alertable deviation.
- question: Through statistical baselining and anomaly detection, can analysts surface low-prevalence
    image flag as it would manifest during Persistence?
  context: 'Under the Persistence tactic, the analyst is looking for the following evidence: A container
    creation event is observed (for example `docker run` or `podman run`) where the specified container
    image name, tag, or digest hash is present on a list of known malicious indicators. This statistical
    method approach proceeds as follows: Calculate per-image prevalence (unique hosts that ran it) over
    30 days and flag images in the bottom 5th percentile, especially from non-allowlisted registries;
    derive the cutoff per environment using a robust modified Z-score on log(prevalence) (flag |0.6745*(x-median)/MAD|
