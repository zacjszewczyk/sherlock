name: 'T1543.005: Container Service'
id: bf3a430e-a961-43b6-ab93-0c3865083789
description: 'Investigate Container Service (T1543.005) as it manifests under Persistence, Privilege Escalation.
  This playbook helps analysts confirm or refute the technique by examining: A container creation event
  is observed (for example `docker run` or `podman run`) where the specified container image name, tag,
  or digest hash is present on a list of known malicious indicators. A process creation event for a container
  runtime (for example `docker run` or `podman run`) includes a persistence-related argument such as `--restart=always`
  or `--restart=on-failure`. Alternatively, a new system service is installed with a service binary path
  that invokes a container. A Kubernetes DaemonSet is created, or a Pod is created with a `restartPolicy:
  Always` (the default), ensuring it is rescheduled if it fails or the node reboots. A container established
  for persistence initiates network connections to rare external IP addresses or uses non-standard ports,
  indicative of command and control communication. Execution of commands or API calls containing arguments
  or payloads that match patterns for known container escape or privilege escalation CVEs (e.g., CVE-2019-5736
  ''runc escape''). A container is created or executed using command-line patterns that grant high privileges
  or mount sensitive host system directories.'
type: technique
