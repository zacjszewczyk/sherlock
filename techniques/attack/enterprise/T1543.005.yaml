- question: Is a container connecting to a destination subnet it has never communicated with before (Jaccard
    distance 1 from its historical subnet set)?
  context: A never-before-seen destination subnet is a clean indicator of lateral expansion. Track each
    host's destination-subnet set and flag connections with Jaccard distance 1 from the historical set
    (a never-before-seen subnet), thresholded with MAD-based scoring. A brand-new subnet contact from
    a container that previously talked to only a narrow set of services suggests a deliberate pivot.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Container runtime logs
  - 'NAI: Network sensors monitoring east-west traffic, Container hosts, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: conn.log by orig_h | eval subnet=cidr24(resp_h) | stats values(subnet) as today_set by orig_h
      | lookup hist_subnets orig_h -> hist_set | eval jacc = 1 - intersect(today_set,hist_set)/union(today_set,hist_set)
      | where jacc==1 | output orig_h new_subnets=setdiff(today_set,hist_set)
- question: When a network graph is analyzed with community detection, which container-host connections
    bridge previously separate communities (lateral movement)?
  context: Lateral movement manifests as edges joining otherwise-separate network communities. Build a
    Zeek-based network graph and use Louvain community detection to flag container-host connections that
    bridge previously separate communities, reporting the bridged communities and edge for explainability.
    A new bridging edge from a container host is a graph-level indicator of pivoting across segmentation
    boundaries.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Container runtime logs
  - 'NAI: Network sensors monitoring east-west traffic, Container hosts, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'G = build_graph(zeek_conn, nodes=hosts, edges=flows) communities = louvain(G) for edge(u,v)
