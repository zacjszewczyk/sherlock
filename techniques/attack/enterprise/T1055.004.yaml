      | where GrantedAccess IN (0x1F3A,0x1FFFFF,0x0820,0x0028,0x0438)

      | join SourceProcessGuid [search EventCode=1 (Signed=false OR Image IN (*\\AppData\\*,*\\Temp\\*,C:\\Users\\Public\\*))]

      | eval prio=if(TargetImage IN (lsass.exe,winlogon.exe,svchost.exe),"high","med")

