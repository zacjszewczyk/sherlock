  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      index=endpoint source=Sysmon EventCode=1 earliest=-30d

      | eval h=SHA256

      | eventstats dc(host) AS host_count, min(_time) AS first_seen by h

      | eval fleet_pct = host_count/[total_hosts]

      | where fleet_pct < 0.001

      | join h [search EventCode=10 TargetImage IN (lsass.exe,winlogon.exe,svchost.exe)]

      | table h, fleet_pct, first_seen, host_count, SourceImage, TargetImage
