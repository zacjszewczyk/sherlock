  queries:
  - technology: ML/pseudocode
    query: >-
      features = [path_entropy(Image), parent_image, len(cmdline), entropy(cmdline),
                  signed_flag, imports_QueueUserAPC, imports_NtQueueApcThread, hash_prevalence]
      score = injector_model.predict_proba(features)

      if score > threshold: alert(score, shap_top3(features))
- question: >-
