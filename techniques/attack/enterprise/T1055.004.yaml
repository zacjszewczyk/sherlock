questions:
- question: >-
    [Stealth] Match APC injector hashes: In the context of APC injection (T1055.004), a process is created
    from an executable file whose hash matches a known malicious tool on a threat intelligence feed, specifically
    tools associated with APC injection. Using a symbolic logic approach, how can you match APC injector
    hashes to determine whether an adversary has used APC injection to conceal execution under a legitimate
    process?
  context: >-
    Tactic: Stealth (TA0005). This question pursues the evidence that A process is created from an executable
    file whose hash matches a known malicious tool on a threat intelligence feed, specifically tools associated
    with APC injection. Method (Symbolic Logic): For every process creation event (Sysmon Event ID 1 /
    Windows 4688), compare SHA256/MD5 against a continuously updated threat-intel feed of injection tooling
    and alert on any direct match. Augment with YARA static-import scanning of the on-disk image for APC/AtomBombing
    import combinations (GlobalAddAtom + GlobalGetAtomName + QueueUserAPC, or OpenProcess + VirtualAllocEx
    + WriteProcessMemory + NtQueueApcThread) [Detect_InjectCode_Unprotect.yar](https://github.com/fr0gger/Yara-Unprotect/blob/master/Detect_InjectCode_Unprotect.yar).
    Surface matched hash and matched rule name in the alert [Process Injection (T1055), Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/).
    A positive result is a strong indicator of APC injection and should be correlated with the broader
    allocate-write-APC chain (VirtualAllocEx -> WriteProcessMemory -> QueueUserAPC/NtQueueApcThread),
    the source image's signature/path, and the sensitivity of the target process; a negative result helps
    rule out this technique for the observed hosts but does not exclude other injection variants. In the
    Stealth context this matters because successful APC injection lets the adversary mask malicious execution
    inside a trusted, legitimate process to avoid process-based detection. Pivot across the listed answer
    sources and focus on the named area of interest: Domain Controllers, Critical Application Servers,
    Standard User Endpoints.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      index=endpoint (source=Sysmon EventCode=1 OR source=Security EventCode=4688)

      | eval h=coalesce(SHA256,Hashes)

      | lookup ti_injection_tooling sha256 AS h OUTPUT feed_name, malware_family

      | where isnotnull(feed_name)

      | table _time, host, Image, h, feed_name, malware_family
  - technology: YARA/pseudocode
    query: >-
      scan on-disk Image with rule APC_AtomBombing_imports {
        imports: (GlobalAddAtom and GlobalGetAtomName and QueueUserAPC)
              or (OpenProcess and VirtualAllocEx and WriteProcessMemory and NtQueueApcThread)
      } -> alert with matched_rule + hash
