    or originates from a non-standard directory (e.g., %APPDATA%) opens a handle to a separate process
    with access rights sufficient for APC injection, such as PROCESS_VM_WRITE or PROCESS_SET_INFORMATION.
    Method (Symbolic Logic): Filter Sysmon Event ID 10 for GrantedAccess masks sufficient for APC injection
    (e.g., 0x1F3A, 0x1FFFFF, 0x0820, 0x0028, 0x0438 — combining PROCESS_VM_WRITE/PROCESS_VM_OPERATION/PROCESS_QUERY_INFORMATION
    and thread rights for OpenThread) and correlate SourceImage with EID 1 to confirm unsigned or suspicious
    path (%APPDATA%, %TEMP%, C:\\Users\\Public). Prioritize TargetImage lsass.exe, winlogon.exe, svchost.exe
