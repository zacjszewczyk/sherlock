name: 'T1055.004: Process Injection: Asynchronous Procedure Call'
id: 705c5aea-076e-451c-bd0b-8797a7430f20
description: >-
  Investigate possible Asynchronous Procedure Call (APC) process injection (T1055.004), in which an adversary
  queues malicious code to a victim thread's APC queue (via QueueUserAPC / NtQueueApcThread, often after
  OpenProcess/OpenThread, VirtualAllocEx and WriteProcessMemory), or uses variants such as Early Bird
  and AtomBombing to execute code inside a legitimate process. This playbook helps an analyst hunt for
  and triage that activity across the full attack chain: malicious-injector execution matched against
  threat intelligence and YARA, cross-process handle opens requesting memory/thread modification rights
  into sensitive or network-facing targets, allocate-write-APC API sequences executing from unbacked memory,
  anomalous parent-child process lineage from common injection targets, and suspicious outbound C2 network
  activity from normally silent or injected processes. It supports both the Privilege Escalation goal
  (running code in a higher-privileged victim process) and the Stealth goal (masking execution under a
  trusted process), combining symbolic-logic detections, statistical baselining/anomaly scoring, and machine-learning
  models so the analyst can answer whether an adversary has escalated privileges or hidden execution using
  APC injection.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0004
  tactic_name: Privilege Escalation
