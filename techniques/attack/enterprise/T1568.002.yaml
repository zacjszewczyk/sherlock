questions:
- question: '[Command And Control] DGA TI watchlist alerting: Can you determine whether a DNS query recorded
    in network logs matches a known DGA domain from a threat intelligence feed, or an outbound network
    connection is established to an IP address associated with a known DGA-based C2 server. -- specifically,
    using the ''DGA TI watchlist alerting'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Command And Control tactic (TA0011), an adversary uses Domain
    Generation Algorithms to algorithmically produce and resolve large numbers of candidate C2 domains,
    making the channel hard to block, track, or sinkhole and providing a resilient fallback (T1008) when
    the primary C2 is lost. This evidence focuses on the condition that a DNS query recorded in network
    logs matches a known DGA domain from a threat intelligence feed, or an outbound network connection
    is established to an IP address associated with a known DGA-based C2 server. This Symbolic Logic approach
    works as follows: Ingest DGA-focused TI feeds (domains and IPs) into a watchlist and continuously
    match Zeek dns.log ''query'' and Zeek conn.log ''id.resp_h'' entries against it. Generate high-priority
    alerts on matches. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable DGA-based C2 resolution or probing; pivot to the resolving host and its process lineage,
    the candidate/active domains and their resolved IPs, the volume and entropy of failed (NXDOMAIN) lookups,
    any successfully resolved destination and its beaconing behavior, and the responsible binary''s signature
    and provenance. A negative result helps rule out this particular DGA vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, dictionary-based,
    or low-and-slow DGA activity.'
