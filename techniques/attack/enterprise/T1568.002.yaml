name: 'T1568.002: Domain Generation Algorithms'
id: 0c8e4be7-85ec-411b-8689-c3129a8ebfb8
description: 'This playbook helps an analyst investigate whether an adversary is using Domain Generation
  Algorithms (DGAs) to dynamically resolve command-and-control (C2) destinations rather than relying on
  static IPs or domains, often as a resilient fallback channel (T1008) when the primary C2 server is lost.
  Under the Command and Control tactic, DGA-driven malware algorithmically produces large numbers of candidate
  domains -- either gibberish character strings (e.g., istgmxdejdnxuyla.ru) or concatenated dictionary
  words (e.g., cityjulydish.net), frequently time- and seed-based -- and probes them until it finds the
  active registration the operator has stood up. The investigation spans DNS and connection telemetry
  (Zeek dns.log and conn.log), endpoint process telemetry (Windows Event ID 4688, Sysmon Event ID 1/3,
  auditd, macOS unified logs, ESXi syslog), and external enrichment (threat-intelligence feeds, passive
  DNS, and WHOIS). It guides the analyst across complementary behavioral angles: matching resolved domains
  and destination IPs against DGA-focused threat-intel watchlists and pre-computed known-family seed sets;
  detecting structural and lexical fingerprints of DGA families with regex and stateless rules; scoring
  linguistic randomness via Shannon entropy, KL divergence, and n-gram frequency; classifying domain strings
  with feature-based models (Random Forest), character-level LSTMs, and dictionary-DGA smashword detection;
  flagging suspicious domain metadata such as newly registered domains, low TTLs, and low host prevalence;
  identifying the NXDOMAIN storms characteristic of DGA probing; and correlating DGA-like network activity
  with anomalous process execution and downstream C2 beaconing on the same host. Detection methods combine
  symbolic-logic rules, statistical baselining/forecasting, and machine-learning models so the analyst
  can corroborate suspected DGA C2 against domain structure, resolution behavior, host prevalence, failed-lookup
  volume, and process lineage.'
type: technique
