questions:
- question: Did an interactive shell, scripting engine, or administrative utility run a command that explicitly
    clears, truncates, overwrites, or redirects command-history storage (for example `history -c`, `history
    -w`, `rm *sh_history`, `cat /dev/null >*sh_history`, `truncate -s0 *sh_history`, `shred *sh_history`,
    `ln -sf /dev/null *sh_history`, `chattr +i *sh_history`, `Clear-History`, removal of ConsoleHost_history.txt,
    `Remove-Module psreadline`, or network-device `clear logging`/`clear history`)?
  context: 'This question hunts for the most direct signature of T1070.003 under the Stealth tactic: an
    operator deliberately destroying the record of what they typed. Match interactive process command
    lines and PowerShell script blocks against the literal corpora from the SigmaHQ Linux Command History
    Tampering, Clearing Windows Console History, and Disable PowerShell Command History rules, plus network-device
    CLI clearing commands. A true positive is rarely benign on production servers and bastion hosts; legitimate
    admins seldom wipe their own history. Retain the initiating account, remote-session source IP, parent
    process, and full command line so triage can pivot to the surrounding session. A negative result lowers
    but does not eliminate suspicion because obfuscated variants may evade exact literals (see the statistical
    and ML questions for this evidence).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4104
  - Linux auditd logs
  - macOS Unified Log
  - Network device syslog
  - 'NAI: Domain Controllers, Critical Application Servers, Developer Workstations, Administrator Bastion
    Hosts, ESXi Hosts, Network Switches and Routers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "(EventID IN (4688,4104) OR source=\"linux_auditd\" OR source=\"macos_unifiedlog\" OR source=\"\
      networkdevice_syslog\") AND CommandLine MATCHES ANY(\n  /history\\s+-c/i, /history\\s+-w/i, /rm\\\
      s+.*sh_history/i, /cat\\s+\\/dev\\/null\\s*>\\s*.*sh_history/i,\n  /truncate\\s+-s\\s*0\\s+.*sh_history/i,\
      \ /shred\\s+.*sh_history/i, /ln\\s+-sf\\s+\\/dev\\/null\\s+.*sh_history/i,\n  /chattr\\s+\\+i\\\
      s+.*sh_history/i, /Clear-History/i, /Remove-Item.*ConsoleHost_history\\.txt/i,\n  /HistorySavePath/i,\
      \ /Remove-Module\\s+psreadline/i, /clear\\s+logging/i, /clear\\s+history/i )\n| table _time, host,\
      \ user, src_ip, ParentImage, Image, CommandLine"
- question: Is the observed history-clearing behavior rare for this host, this user, or this administrative
    peer group when baselined by shell, hour-of-day, and role, and was a successful clearing command followed
    by zero subsequent shell-history writes on that session?
  context: 'Under Stealth, adversaries try to blend in, so frequency and rarity matter. Build per-host
    and per-user (peer-group) UEBA-style baselines of how often history-clearing commands occur, segmented
    by shell, hour-of-day, and administrative role. Flag frequency anomalies (more than one clearing event
    in a session, or a daily count exceeding the role baseline by more than three standard deviations)
    and any first-seen-for-role execution. Crucially track state: a successful clearing command immediately
    followed by no further history writes on that session is high fidelity, whereas a failed or permission-denied
    attempt is a distinct, often pre-privilege signal that should be profiled separately. A spike against
    an otherwise quiet baseline is strong evidence of deliberate evasion.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4104
  - Linux auditd logs
  - macOS Unified Log
  - Network device syslog
  - 'NAI: Domain Controllers, Critical Application Servers, Developer Workstations, Administrator Bastion
    Hosts, ESXi Hosts, Network Switches and Routers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'history_clear_events

      | bin _time span=1d

      | stats count AS clears by user, host, role, shell, date

      | eventstats avg(clears) AS mu, stdev(clears) AS sd by role

      | eval z=(clears-mu)/sd, first_seen=if(prior_role_count==0,1,0)

      | where z>3 OR clears>1 OR first_seen=1

      | join session_id [search shell_history_writes | stats count AS post_writes by session_id]

      | eval fidelity=if(post_writes=0,"high","review")'
- question: When shell and PowerShell command lines are scored by an obfuscation/anomaly classifier, do
    any rank as likely destructive history-clearing workflows even though they do not match exact known
    literals?
  context: Sophisticated actors obfuscate or vary their commands to defeat signatures. Score command lines
    with a gradient-boosted obfuscation detector (per Google/Mandiant's obfuscated command-line ML) or
    BERT-embedding outlier detection (per CrowdStrike's command-line anomaly work), using token patterns,
    parent lineage, remote-session context, and adjacency to other suspicious commands. This catches encoded,
    concatenated, or novel history-clearing variants that exact-literal rules miss. The alert must surface
    the top-3 contributing features (for example 'rare parent=cron', 'token=HISTFILE redirect to /dev/null',
    'high entropy arg') so the analyst can quickly judge the score. A high score on a command near a remote
    logon strongly supports a Stealth determination.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4104
  - Linux auditd logs
  - macOS Unified Log
  - Network device syslog
  - 'NAI: Domain Controllers, Critical Application Servers, Developer Workstations, Administrator Bastion
    Hosts, ESXi Hosts, Network Switches and Routers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = extract(tokens, parent_lineage, remote_session, entropy, adjacency)

      score = gbdt_obfuscation.predict(cmdline) OR bert_outlier.score(embedding(cmdline))

      if score > threshold: alert(top3_features=explain(features), user, host, parent, cmdline)'
- question: Did a process or script block set history-related environment variables to null/zero or otherwise
    disable history saving on a live session (for example HISTSIZE=0, HISTFILESIZE=0, `unset HISTFILE`,
    HISTFILE=/dev/null, `shopt -ou history`, or `Set-PSReadlineOption -HistorySaveStyle SaveNothing`)?
  context: Rather than deleting history after the fact, an adversary can pre-emptively disable it so nothing
    is ever recorded - a quieter Stealth approach. Apply SIEM regex to process command lines (Windows
    EID 4688, Linux auditd execve) and PowerShell script blocks (EID 4104) for patterns that null/zero
    history variables or disable saving, drawing the keyword set from the SigmaHQ Linux Command History
    Tampering and Disable PowerShell Command History rules. Suppress the false-positive-prone bare `unset
    HISTFILE` unless it is paired with a remote logon or another evasion signal. A positive result on
    a server or bastion host, especially early in a session, indicates the actor intends to operate without
    leaving a trail.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Linux auditd logs
  - macOS Unified Log
  - 'NAI: Domain Controllers, Critical Application Servers, Developer Workstations, Administrator Bastion
    Hosts, Linux/Unix Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "(EventID IN (4688,4104) OR source=\"linux_auditd\" OR source=\"macos_unifiedlog\") AND CommandLine\
      \ MATCHES ANY(\n  /HISTSIZE=0/i, /HISTFILESIZE=0/i, /unset\\s+HISTFILE/i, /HISTFILE=\\/dev\\/null/i,\n\
      \  /shopt\\s+-o[u]*\\s+history/i, /Set-PSReadlineOption.*HistorySaveStyle.*SaveNothing/i )\nAND\
      \ NOT (CommandLine MATCHES /^unset\\s+HISTFILE$/i AND NOT remote_logon)\n| table _time, host, user,\
      \ ParentImage, CommandLine"
- question: Does the Shannon entropy of a command line that references HIST, PSReadline, or environment-variable
    modification exceed the per-user/per-parent baseline by more than three standard deviations, indicating
    encoded or obfuscated history-variable tampering?
  context: Obfuscation raises the randomness (entropy) of a command string. For each process-creation
    event, compute the Shannon entropy of the command line and maintain per-user and per-parent-process
    entropy baselines, alerting when entropy exceeds baseline by more than three standard deviations AND
    the command references HIST, PSReadline, or env-var modification (per Elastic's high command-line
    entropy analytic). Derive thresholds from the 99th-percentile entropy of benign privileged commands
    in your data. Combine with character-frequency deviation from a benign corpus (per Revoke-Obfuscation)
    so encoded variable-tampering is not missed. High entropy plus history-related tokens is a strong
    indicator that an actor is hiding a disable-history action from signature rules.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Linux auditd logs
  - macOS Unified Log
  - 'NAI: Domain Controllers, Critical Application Servers, Developer Workstations, Administrator Bastion
    Hosts, Linux/Unix Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'process_creation

      | eval H=shannon_entropy(CommandLine)

      | eventstats avg(H) AS mu, stdev(H) AS sd by user, ParentImage

      | eval z=(H-mu)/sd

      | where z>3 AND match(CommandLine, /HIST|PSReadline|export|set\s|unset/i)

      | table _time, host, user, ParentImage, CommandLine, H, z'
- question: When a character-level deep-learning classifier scores commands that modify shell/PowerShell
    history behavior and a per-host time-series forecasts how often such edits should occur, do any commands
    or edit rates deviate sharply from the expected pattern?
  context: This ML approach catches both content-based and rate-based anomalies. Train a character-level
    classifier (CNN/LSTM, per Hendler et al. 'Detecting Malicious PowerShell Commands using Deep Neural
    Networks') on commands that alter shell/PowerShell history behavior, and pair it with a per-host time-series
    forecast of how often such modifications occur (volume of edits/hour and frequency/min). Flag deviations
    from the forecast. Report the top-3 driving features (for example 'SaveNothing token', 'parent=non-shell',
    'rare for host') in each alert. A novel disable-history command on a host that never normally edits
    history, or a sudden burst of such edits, supports a Stealth/evasion conclusion even when no exact
    signature fires.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Linux auditd logs
  - macOS Unified Log
  - 'NAI: Domain Controllers, Critical Application Servers, Developer Workstations, Administrator Bastion
    Hosts, Linux/Unix Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "p_malicious = charlevel_cnn_lstm.predict(cmdline)\nexpected = ts_forecast(host, metric=hist_edits_per_hour)\n\
      observed = count(hist_edit_events, host, window=1h)\nif p_malicious>thr OR abs(observed-expected)>k*forecast_sd:\n\
      \    alert(top3_features=explain(), host, user, cmdline)"
- question: Was a known shell history file (ConsoleHost_history.txt, .bash_history, .zsh_history, /var/log/shell.log)
    deleted or modified by a process that is NOT an expected interactive shell, or that has an anomalous
    parent process (for example services.exe, winword.exe)?
  context: When a non-shell process touches a history file, it is a strong tampering signal. Enable file-system
    auditing (Windows SACL, Linux auditd, Sysmon) on history paths and alert on delete/write events where
    the responsible process is not an expected interactive shell, combining the SigmaHQ PowerShell Console
    History Logs Deleted rule (Sysmon EID 23/26 on \PSReadLine\ConsoleHost_history.txt), the Linux History
    File Deletion rule (rm/unlink/shred against *_history), and the Suspicious History File Operations
    rules for Linux (auditd execve) and macOS. Include ESXi /var/log/shell.log truncation/deletion. Profile
    blocked/permission-denied deletions (state) separately as a distinct pre-privilege signal. A history
    file being removed by services.exe or an Office process indicates injected or proxied evasion under
    the Stealth tactic.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Sysmon Event ID 26
  - Linux auditd logs
  - macOS FSEvents
  - 'NAI: User home directories on file servers, Local user profiles on endpoints and servers, Administrator
    Bastion Hosts, ESXi Hosts, Linux/Unix Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "(EventID=4663 OR Sysmon IN (11,23,26) OR source=\"linux_auditd\" OR source=\"macos_fsevents\"\
      ) AND TargetFilename MATCHES ANY(/ConsoleHost_history\\.txt/i, /\\.bash_history/i, /\\.zsh_history/i,\
      \ /var\\/log\\/shell\\.log/i) AND Image NOT IN (powershell.exe, pwsh.exe, bash, zsh, sh, esxcli)\
      \ \n| eval suspicious_parent=if(ParentImage IN (services.exe, winword.exe, excel.exe, explorer.exe),1,0)\n\
      | table _time, host, user, ParentImage, Image, TargetFilename, access_result"
- question: How rare is the (parent,child) process lineage responsible for a history-file modify/delete
    event when scored against an enterprise-wide probabilistic graph of process tuples, and is this a
    one-off cleanup or a rapid multi-file wipe?
  context: Lineage rarity exposes proxied or injected deletions. From process logs (EID 4688, auditd)
    build an enterprise probabilistic graph of (parent,child) process tuples; for any history-file modify/delete
    event, compute the rarity of the observed lineage and alert when its probability falls below a tuned
    threshold (for example <0.01%), using peer-group rarity scoring per Microsoft Sentinel UEBA. Track
    volume (history-file delete events/host/day) and frequency to distinguish a single benign admin cleanup
    from a rapid multi-file wipe across a host. A vanishingly rare parent-child relationship deleting
    a history file aligns with Stealth evasion and merits escalation.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Sysmon Event ID 26
  - Linux auditd logs
  - macOS FSEvents
  - 'NAI: User home directories on file servers, Local user profiles on endpoints and servers, Administrator
    Bastion Hosts, ESXi Hosts, Linux/Unix Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'history_file_delete_events

      | lookup proc_graph parent child OUTPUT p_lineage

      | where p_lineage < 0.0001

      | bin _time span=1d | stats count AS wipes, dc(TargetFilename) AS files by host, user, date

      | eval verdict=if(wipes>1 OR files>1,"multi-file wipe","one-off")'
- question: When a one-class or provenance-graph model trained on benign history-file management is applied,
    does a history-file deletion appear as an out-of-boundary event or as a node inside a broader malicious
    subgraph?
  context: 'Graph-based provenance learning provides context and explainability. Train a one-class/graph
    model on benign history-file management events (features: process, parent, user, time, path, command
    line) and flag out-of-boundary events. Provenance-graph approaches such as MAGIC and KAIROS can detect
    the file-deletion node within a broader malicious subgraph and attribute the anomalous edges, supplying
    explainable top contributing nodes/edges in the alert. This is powerful for the Stealth tactic because
    it ties an isolated history-file deletion to the surrounding intrusion (logon, payload, lateral movement).
    A deletion that sits inside a flagged malicious subgraph is far higher confidence than one in isolation.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Sysmon Event ID 26
  - Linux auditd logs
  - macOS FSEvents
  - 'NAI: User home directories on file servers, Local user profiles on endpoints and servers, Administrator
    Bastion Hosts, ESXi Hosts, Linux/Unix Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = oneclass_or_provenance_graph.fit(benign_history_file_events)\nfor event in history_file_events:\n\
      \    if model.is_outlier(event) OR provenance.in_malicious_subgraph(event):\n        alert(top_nodes_edges=model.explain(event),\
      \ host, user, path)"
- question: Did a history-clearing event or history-file deletion occur within 5 minutes after a successful
    remote logon (Windows EID 4624 Logon Type 3/10, or a new SSH/RDP session in Zeek conn.log) on the
    same host by the same account?
  context: 'Clearing history right after logging in remotely is a classic intrusion tell. Implement stateful
    SIEM correlation that triggers when a successful remote logon is followed within 5 minutes by a history-clearing
    event (from evidence #1 or #3) on the same host by the same account, joining on hostname/IP and username.
    Reuse the literal corpora from the SigmaHQ Linux Command History Tampering and Clearing Windows Console
    History rules as the clearing-event triggers. This tight temporal join is highly specific to adversary
    behavior under Stealth: legitimate users rarely log in remotely and immediately wipe their history.
    A match should be treated as high priority, especially if the logon itself is anomalous (new geography,
    unusual time).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - Linux auditd logs
  - 'NAI: Internet-facing servers, VPN gateways, Domain Controllers, Administrator Bastion Hosts, Network
    perimeter firewalls'
  range: 'Last 90 days (correlation window: 5 minutes after each remote logon)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'logon = search (EventID=4624 AND Logon_Type IN (3,10)) OR (zeek_conn new SSH/RDP session)

      clear = search history_clearing_event OR history_file_delete_event

      | join host, user [ clear ]

      | where (clear._time - logon._time) <= 300 AND clear._time >= logon._time

      | table logon._time, clear._time, host, user, src_ip, CommandLine'
- question: Does a remote logon score above the 95th-percentile risk against per-user baselines (source
    IP geo/ASN, time, day, logon type), and is it followed within 10 minutes by a history-clearing event
    - with extra confidence if a burst of failed logons (EID 4625) preceded it?
  context: 'Risk-scoring the logon adds precision over a raw temporal join. Build per-user remote-logon
    baselines (source IP geo/ASN, time, day, logon type) from EID 4624 and Zeek conn.log and assign a
    risk score from deviations, per Microsoft Sentinel UEBA; correlate logons above the 95th-percentile
    risk with subsequent history-clearing within 10 minutes for a high-priority alert. Explicitly weight
    failure state: a burst of failed logons (EID 4625) preceding the successful logon-then-clear sequence
    raises confidence and is itself a distinct signal (possible password spray/brute force). Under Stealth,
    an anomalous logon followed by evidence destruction is one of the strongest composite indicators of
    a hands-on-keyboard intruder.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - Linux auditd logs
  - 'NAI: Internet-facing servers, VPN gateways, Domain Controllers, Administrator Bastion Hosts, Network
    perimeter firewalls'
  range: 'Last 90 days (correlation window: 10 minutes after each high-risk remote logon)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'logons

      | eval risk=ueba_risk(user, src_geo, src_asn, hour, day, logon_type)

      | where risk >= pct95(risk_by_user)

      | join host,user [search history_clearing_event | eval ct=_time]

      | where (ct - logon_time) <= 600

      | eval failed_burst=count(EID4625, user, window=10m before logon)

      | eval confidence=if(failed_burst>5,"high","medium")'
- question: When session event sequences are modeled with a temporal/graph learner, do any low-probability
    chains such as [anomalous remote login -> shell/PowerShell -> history-file deletion -> rare-ASN egress]
    appear?
  context: 'Sequence modeling catches the whole attack arc, not just one step. Model session event sequences
    with a temporal/graph learner so low-probability chains such as anomalous remote login -> shell/PowerShell
    launch -> history-file deletion -> rare-ASN egress are flagged. Whole-system provenance approaches
    like KAIROS and MAGIC learn benign causal sequences, detect the deviating subgraph, and reconstruct/attribute
    it so the alert lists the top-3 contributing events. Pair this with a character-level command classifier
    (Hendler et al.) to score the clearing command within the chain. For the Stealth tactic this is the
    most contextual detection: it links the evasion act to the intrusion before and after it, dramatically
    reducing false positives and producing an explainable kill-chain narrative.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - Linux auditd logs
  - 'NAI: Internet-facing servers, VPN gateways, Domain Controllers, Administrator Bastion Hosts, Network
    perimeter firewalls'
  range: Last 90 days (session-centered correlation)
  queries:
  - technology: ML/pseudocode
    query: "seq = build_session_sequence(events by host,user)\np = temporal_graph_model.sequence_probability(seq)\
      \  # KAIROS/MAGIC\ncmd_score = charlevel_classifier.predict(clearing_cmd_in_seq)\nif p < thr OR\
      \ cmd_score > cthr:\n    alert(chain=[login, shell, hist_delete, egress], top3=explain(seq))"
