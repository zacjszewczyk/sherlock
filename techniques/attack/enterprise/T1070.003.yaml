name: 'T1070.003: Indicator Removal: Clear Command History'
id: b7b62e34-59d1-4d8c-9750-6796be20dc53
description: 'This playbook helps an analyst investigate adversary attempts to conceal intrusion activity
  by clearing or disabling command-history records (MITRE ATT&CK T1070.003, Indicator Removal: Clear Command
  History). It focuses on five complementary behaviors observed across Windows, Linux, macOS, ESXi, and
  network devices: (1) interactive shells, scripting engines, or admin utilities that explicitly clear,
  truncate, overwrite, or redirect command-history storage (e.g., `history -c`, `rm ~/.bash_history`,
  `Clear-History`, deletion of ConsoleHost_history.txt, `clear logging`/`clear history` on network CLIs,
  truncation of ESXi /var/log/shell.log); (2) processes or script blocks that tamper with history-related
  environment variables to disable logging (HISTSIZE=0, HISTFILE=/dev/null, Set-PSReadlineOption -HistorySaveStyle
  SaveNothing); (3) file modification or deletion events against known history files by anomalous or non-shell
  parent processes; and (4) clearing events that occur immediately after a successful remote logon (RDP,
  SSH, WinRM). For each behavior the playbook supplies symbolic-logic (signature), statistical (baseline/rarity/entropy),
  and machine-learning detection approaches so obfuscated and novel variants are caught. A positive finding
  indicates deliberate destruction of investigator-visible evidence and warrants host containment, history-file
  forensic recovery, and review of the surrounding session.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
