    the other questions in this playbook, since a single method can miss cloaked, low-prevalence, obfuscated,
    or out-of-band staging activity.'
  answer_sources:
  - 'Internet Scan: Response Content'
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Internet-wide scan / honeyclient pipeline, Web Proxy response capture, Threat Intelligence Platform'
  range: Last 90 days (train on 30-90 days of history; score in near-real-time)
  queries:
  - technology: Honeyclient/Internet-scan pipeline pseudocode
    query: "score = ensemble(prophiler_static_ml(page), jstap_pdg_model(page.js))\nif score > threshold:\n\
      \  confirm = honeyclient_vm_statechange(page)  # new proc/registry/file writes\n  emit alert(page.url,\
      \ top3_features, confirm)"
