questions:
- question: '[Resource Development] Continuously join outbound Zeek dns.log/conn.log against TI + NRD
    watchlists: Can you determine whether an internal host''s outbound network connection (DNS query or
    HTTP/S request) resolves to a domain or IP address listed on a threat intelligence feed as known infrastructure
    for drive-by-compromise, watering holes, or exploit kits. -- specifically, using the ''Continuously
    join outbound Zeek dns.log/conn.log against TI + NRD watchlists'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary stages infrastructure
    and malicious web content for a drive-by target / watering-hole operation so that the organization''s
    users are exploited or fingerprinted simply by browsing to an adversary-controlled or compromised
    site. This evidence focuses on the condition that an internal host''s outbound network connection
    (DNS query or HTTP/S request) resolves to a domain or IP address listed on a threat intelligence feed
    as known infrastructure for drive-by-compromise, watering holes, or exploit kits. This Symbolic Logic
    approach works as follows: Continuously join outbound Zeek dns.log and conn.log records against a
    watchlist of domains/IPs from high-confidence threat-intelligence and exploit-kit feeds, plus a Newly
    Registered Domain (NRD) feed and EXPOSURE-style low-prevalence/short-life domains ([EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)).
    Trigger a high-priority alert on any match, including source host, destination, threat-feed name,
    and (for explainability) which list matched. Pivot from any hit to related staged infrastructure sharing
    content/link/DNS gadgets ([EVILSEED](https://sites.cs.ucsb.edu/~chris/research/doc/oakland12_evilseed.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable staged
    drive-by/watering-hole infrastructure or an in-progress drive-by interaction; pivot to the responsible
    internal host and user, the destination domain/IP and its registration and reputation, the full redirect
    chain or page content, any downloaded file and the process it spawned, and corroborating threat intelligence
    to scope exposure and decide on blocking. A negative result helps reduce suspicion for this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss cloaked, low-prevalence, obfuscated, or out-of-band staging activity.'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Enterprise DNS Resolvers, Egress Firewall/Proxy, Threat Intelligence Platform (TIP), SIEM'
  range: Last 90 days (correlate event-centered windows of seconds-to-minutes per chain)
  queries:
  - technology: Zeek/pseudocode
    query: "watchlist = TI_feeds + exploit_kit_feeds + NRD_feed + low_prevalence_short_life\nfor r in\
      \ stream(zeek.dns.log, zeek.conn.log):\n  if r.dest in watchlist:\n    emit alert(src_host, dest,\
      \ feed_name, which_list, severity=high)\n    pivot related infra via shared content/link/DNS gadgets"
- question: '[Resource Development] Per-host rolling counts AND failure-rate profiling of TI/NRD connections:
