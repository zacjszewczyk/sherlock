name: 'T1608.004: Drive-by Target'
id: eda6118f-5554-41d5-818e-920abda3d620
description: 'This playbook helps an analyst investigate whether an adversary has staged resources for
  a strategic web compromise (watering hole) or other drive-by target operation against the organization''s
  users (MITRE ATT&CK T1608.004, Drive-by Target). Before a Drive-by Compromise (T1189), adversaries prepare
  adversary-controlled or previously compromised infrastructure that delivers exploits or browser-profiling
  content to users who simply browse to a web page. They inject malicious JavaScript and hidden iframes
  into legitimate or look-alike sites, abuse low-tier ad networks for malvertising, register typosquatting/homoglyph
  domains, and stand up exploit-kit landing pages and ScanBox-style fingerprinting scripts. Because most
  staging happens outside the target''s visibility, this hunt pursues the behavior from several complementary,
  evidence-backed angles using network egress and endpoint telemetry: outbound connections that resolve
  to threat-intelligence or newly-registered-domain (NRD) watchlist infrastructure; rapid Referer-linked
  redirect chains that obscure the final payload host; connections to recently registered, WHOIS-private,
  or brand-confusable domains; high-entropy or anomalous-MIME file downloads from low-reputation domains
  followed by browser-spawned process creation; advertising-traffic spikes that pivot to NRD/low-reputation/direct-to-IP
  destinations; and internet-scan/honeyclient response content bearing staged drive-by markers. Detection
  methods combine deterministic symbolic-logic rules (TI/NRD watchlist joins, redirect-chain reconstruction,
  YARA and static HTML/JS structural signatures, look-alike/homoglyph checks), statistical baselining
  (per-host rolling counts and byte-volume percentiles, NXDOMAIN/failure-rate profiling, chain length/speed
  and syndication-depth percentiles, entropy and chi-squared MIME tests, ad-traffic spike detection),
  and machine learning (gradient-boosting/logistic risk scoring with top-3 feature explainability, DBSCAN
  session clustering, SARIMA/Prophet forecasting, Siamese-CNN visual look-alike scoring, multi-representation
  JS classifiers, and multivariate time-series anomaly detection), applied across Zeek dns/conn/http/files
  logs, Windows process-creation events (Event ID 4688/Sysmon 1), and internet-scan response content,
  so the analyst can corroborate suspected drive-by staging across infrastructure reputation, page content,
  redirect behavior, and endpoint execution.'
type: technique
