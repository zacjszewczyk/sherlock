name: 'T1611: Escape to Host'
id: e67388ef-800a-4e01-b7e6-ea0f90201071
description: 'Investigate whether an adversary has broken out of a container or virtualized environment
  to reach the underlying host, escalating privileges and gaining access to other co-resident containers,
  virtual machines, or the host itself. This playbook helps an analyst hunt for the full container-escape
  kill chain on Windows, Linux, container, and ESXi platforms: execution of known escape tooling or breakout
  syscall primitives (nsenter, setns, unshare, keyctl, pivot_root, mount) from a containerized parent;
  files written to sensitive host paths by a container and then executed by a host process; processes
  whose parent is a container runtime or shim spawning children outside the container''s cgroup/namespace;
  connections to the Docker control socket (docker.sock) followed by privileged-container or host-mount
  commands; containerized processes touching host files or registry keys outside their mounted volumes;
  cgroup release_agent abuse (CVE-2022-0492) and mount-then-chroot host-root pivots; Kubernetes API requests
  that provision escape-enabling workloads (privileged securityContext, hostPath to / or /proc, hostPID/hostNetwork,
  allowPrivilegeEscalation); and post-escape outbound C2 connections. Each question pairs a deterministic
  symbolic-logic floor with statistical baselining and machine-learning approaches so detections remain
  defensible and tunable.'
type: technique
related:
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
