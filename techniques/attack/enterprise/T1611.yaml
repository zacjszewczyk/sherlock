- question: Within a per-image bag-of-syscalls / n-gram baseline (>=7 days), which windows contain escape-class
    syscalls outside the profile or exceed the 99th-percentile mismatch score, and how many failed (EPERM)
    escape syscalls occur?
  context: Workloads have stable syscall profiles; escape syscalls are anomalies. This method maintains
    a per-image bag-of-syscalls / short-sequence (n-gram) baseline over >=7 days and alerts when a window
    contains escape-class syscalls outside the profile or exceeds the 99th-percentile mismatch score,
    counting failed (EPERM) escape syscalls separately (Abed et al., Forrest et al.). An off-profile escape
    syscall, a high mismatch score, or a cluster of EPERM failures all indicate an escape attempt, including
    ones that fail. Positive results are off-baseline or denied syscalls; negatives match the image profile.
    This catches Privilege Escalation attempts that use escape primitives in ways the static rule allowlists
    might otherwise tolerate.
  answer_sources:
  - Linux auditd SYSCALL
  - Linux Sysmon Event ID 1
  - Linux Sysmon Event ID 11
  - 'NAI: Container host kernel syscall/auditd telemetry and file integrity monitoring on cgroup/namespace
    control paths'
  range: Last 90 days; baseline over >=7 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (auditd:SYSCALL, linux:Sysmon EID=1)

      | where container_id != ""

      | bucket span=5m | stats values(syscall) AS bag, count by image, window

      | eval mismatch = bag_distance(bag, baseline_bag(image,7d))

      | where any(escape_syscalls NOT IN baseline_bag(image)) OR mismatch > p99(image)

      | append [ search where syscall IN escape_syscalls AND result="EPERM" | stats count by image ]

      | emit alert'
