questions:
- question: Has any process created on a container host matched known container-escape tooling by hash
    or name, or invoked breakout primitives such as nsenter, setns, unshare, keyctl, pivot_root, or a
    mount of /dev/sd* from a containerized parent process?
  context: A container escape almost always culminates in a host-level process. This deterministic floor
    alerts when a new process on the host (Win EID 4688, auditd EXECVE, linux:Sysmon EID 1) matches CTI
    hashes/names for known escape tooling, or when a containerized parent invokes the canonical breakout
    primitives. It mirrors the Falco breakout and Elastic nsenter/unshare detections. A positive hit means
    a container process is reaching across the isolation boundary toward the host; a negative result lowers
    but does not eliminate suspicion because novel tooling will not be on any name/hash list. Tune with
    a benign-parent allowlist (systemd-udevd, snap, java, CI runners) rather than deleting rules. For
    Privilege Escalation this is the clearest sign an unprivileged container foothold is being converted
    to host-level (root/SYSTEM) access.
  answer_sources:
  - Windows Event ID 4688
  - Linux auditd EXECVE
  - Linux Sysmon Event ID 1
  - 'NAI: Container host server process execution logs and file systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (WinEventLog:Security EID=4688, auditd:EXECVE, linux:Sysmon EID=1)\n| where parent_is_container\
      \ = true\n| where (process_hash IN cti_escape_hashes\n        OR process_name IN cti_escape_names\n\
      \        OR exe IN (\"nsenter\",\"setns\",\"unshare\",\"keyctl\",\"pivot_root\")\n        OR (exe\
      \ = \"mount\" AND cmdline MATCHES \"/dev/sd*\"))\n| where parent_name NOT IN (\"systemd-udevd\"\
      ,\"udevadm\",\"snap\",\"java\",\"ci-runner\")\n| emit alert"
  - technology: Falco/pseudocode
    query: "- rule: Container Escape Tooling\n  condition: container.id != host and proc.name in (nsenter,\
      \ setns, unshare, keyctl, pivot_root)\n  output: \"breakout primitive in container (proc=%proc.name\
      \ parent=%proc.pname img=%container.image)\""
- question: Within each host/image, which new-process command lines exhibit abnormally high entropy (above
    the 95th percentile) or emit escape-primitive syscalls absent from the image's 7-day baseline, and
    are there bursts of EPERM/denied mount/capset failures?
  context: 'Sophisticated escapes use obfuscated or unusual command lines, and even failed escape attempts
    leave a fingerprint. This statistical method profiles per-host/per-image command-line entropy and
    flags the top 5% most anomalous, while also counting escape-primitive invocations per minute and alerting
    when a containerized process emits any escape syscall not seen in its >=7-day baseline (bag-of-system-calls
    / Forrest self-nonself approaches). Critically, failure rate is profiled as its own signal: a burst
    of EPERM, denied mount, or capset failures indicates an escape attempt is in progress even if the
    final pivot never succeeds. Positive results are anomalous workloads worth pivoting on; negatives
    indicate behavior consistent with the learned baseline. This catches Privilege Escalation attempts
    that evade static name/hash matching.'
  answer_sources:
  - Windows Event ID 4688
  - Linux auditd EXECVE
  - Linux Sysmon Event ID 1
  - 'NAI: Container host server process execution logs and file systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source IN (4688, auditd:EXECVE, linux:Sysmon EID=1)\n| stats entropy(cmdline) AS e by host,\
      \ image, pid\n| eventstats perc95(e) AS p95 by host, image\n| where e > p95\n| append [ search escape_syscalls\
      \ | bucket span=1m | stats count by image, syscall\n          | where syscall NOT IN baseline_syscalls(image,\
      \ 7d) ]\n| emit alert"
  - technology: SIEM/Stats pseudocode
    query: 'source = auditd:SYSCALL

      | where result IN ("EPERM","EACCES") AND syscall IN ("mount","capset","unshare","setns")

      | bucket span=1m | stats count AS fails by host, container_id

      | where fails > baseline_p99(host) | emit alert'
- question: When a high-risk process is created on a container host, does a trained classifier (Random
    Forest / autoencoder) using parent name, container-runtime ancestry, command-line tokens, and escape-primitive
    features flag it, and what top-3 features drove the score?
  context: 'Machine learning generalizes beyond static rules. Train a classifier on labeled features:
    parent process name, container-runtime ancestry (containerd-shim/runc/dockerd lineage), command-line
    tokens, and escape-primitive indicators, then flag high-risk process creations. Surfacing the top-3
    contributing features (e.g., a setns argument, a container-shim parent, a host-path token) makes alerts
    triage-ready and explainable. Validate and threshold-tune against labeled detonations from frameworks
    like Stratus Red Team so the model is calibrated against real escape behavior rather than synthetic
    noise. A positive classification on an unfamiliar binary or command structure is a strong escalation
    signal even when no known-bad hash exists, directly supporting detection of Privilege Escalation via
    host escape.'
  answer_sources:
  - Windows Event ID 4688
  - Linux auditd EXECVE
  - Linux Sysmon Event ID 1
  - 'NAI: Container host server process execution logs and file systems'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [parent_name, runtime_ancestry, cmdline_tokens, has_setns, has_mount_dev, host_path_token]\n\
      score = rf_model.predict_proba(features)\nif score >= threshold:\n  emit alert with top3 = shap_top_features(model,\
      \ features)\n# threshold tuned against Stratus Red Team detonations"
- question: Did a containerized process write a file to a sensitive host path (/, /etc/cron*, /proc/sys/kernel/core_pattern,
    cgroup release_agent) that a host process then executed within 60 seconds, or did a privileged/SYS_ADMIN
    container modify the cgroup release_agent file?
  context: This is the classic write-then-execute escape and the CVE-2022-0492 release_agent abuse. The
    deterministic floor correlates a container write to a sensitive host path with a host process executing
    that same file within a 60-second window, and separately alerts on modification of the cgroup release_agent
    file from a privileged/SYS_ADMIN interactive container (mirroring Elastic's release_agent detection).
    Keep the 60s write->exec window and the explicit sensitive-path list as the floor. A positive correlation
    is high-fidelity evidence that code planted from inside a container is now running on the host with
    host privileges, the defining moment of an Escape to Host Privilege Escalation. Negative results across
    the window suggest no successful cross-boundary execution occurred.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Linux auditd PATH/SYSCALL
  - Linux Sysmon Event ID 11
  - 'NAI: Container host server file system and process audit logs'
  range: Last 90 days; correlate write and exec within a 60-second window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "write = search source IN (4663, auditd:PATH, linux:Sysmon EID=11)\n        | where actor_is_container\
      \ = true AND path IN sensitive_host_paths\nexec  = search source IN (4688, auditd:EXECVE)\n    \
      \    | where actor_is_host = true\n| join file_path [write -> exec] within 60s\n| emit alert\n#\
      \ OR: container modifies /sys/fs/cgroup/**/release_agent with CAP_SYS_ADMIN"
- question: Which writes to host paths occur with less than 0.1% historical frequency for the container
    image, and are there denied/failed writes (EACCES/EPERM) to host-only paths that signal attempted
    escapes?
  context: Legitimate containers write to a stable, narrow set of paths. This statistical method derives
    a per-image path baseline over >=14 days and flags writes to host paths whose historical frequency
    is below 0.1% for that image. It also treats denied/failed writes (EACCES/EPERM) to host-only paths
    as a distinct elevated-risk signal, because a blocked write to a host-only location strongly implies
    an escape attempt that was constrained but tried. Positive results are rare-path or denied-path writes
    warranting investigation; negatives match the image's learned behavior. This catches Privilege Escalation
    attempts that target host paths not covered by the explicit sensitive-path list.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Linux auditd PATH/SYSCALL
  - Linux Sysmon Event ID 11
  - 'NAI: Container host server file system and process audit logs'
  range: Last 90 days; baseline derived over >=14 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (4663, auditd:PATH, linux:Sysmon EID=11)

      | where actor_is_container = true

      | stats count by image, path

      | eventstats sum(count) AS total by image

      | eval freq = count/total

      | where freq < 0.001 OR result IN ("EACCES","EPERM")

      | emit alert'
- question: Across file write, execution, and namespace events, do provenance/sequence models surface
    rare cross-boundary sequences that connect a container write to host-level execution?
  context: Individual events may look benign; the malicious signal is in the sequence. Apply provenance/sequence
    modeling (UNICORN, ThreaTrace style) over correlated file-write + execution + namespace-change events
    and alert on rare cross-boundary sequences. Reporting the contributing nodes and edges (the writing
    container process, the host file, the executing host process, the namespace transition) gives the
    analyst a ready-made attack path for triage. A flagged rare sequence is a candidate Escape to Host
    even when each constituent event individually evaded simpler rules, directly serving the Privilege
    Escalation investigation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Linux auditd PATH/SYSCALL
  - Linux Sysmon Event ID 11
  - 'NAI: Container host server file system and process audit logs'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "graph = build_provenance(write_events, exec_events, ns_events)\nscores = sequence_model.anomaly(graph.subsequences)\n\
      for seq in scores where seq.score > threshold:\n  emit alert with contributing_nodes=seq.nodes,\
      \ edges=seq.edges"
- question: Did a container runtime or shim (containerd-shim, runc, dockerd) spawn a non-container child
    running outside its cgroup/namespace, or did an nsenter from a container entry-leader cause a UID
    change using -t/--target with args_count >= 4 (entering host namespaces)?
  context: A container runtime parenting a process that lives outside the container's cgroup/namespace
    is a structural anomaly indicative of escape. The deterministic floor alerts when containerd-shim/runc/dockerd
    spawn a child executing outside their expected cgroup/namespace, or when an nsenter from a container
    entry-leader produces a UID change with -t/--target and args_count >= 4 (the signature of entering
    host namespaces), mirroring Elastic's nsenter docker-escape rule and Tetragon. Retain the explicit
    runtime-parent list as the floor. A positive result is direct evidence of a process crossing from
    container to host context, the core of Escape to Host Privilege Escalation. Negatives confirm runtime
    children stayed within their isolation boundary.
  answer_sources:
  - Windows Event ID 4688
  - Linux auditd SYSCALL
  - Linux Sysmon Event ID 1
  - 'NAI: Process creation logs on all container hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (4688, auditd:SYSCALL, linux:Sysmon EID=1)\n| where parent_name IN (\"containerd-shim\"\
      ,\"runc\",\"dockerd\")\n| where child_cgroup != parent_container_cgroup OR child_namespace = host_namespace\n\
      | append [ search exe=\"nsenter\" | where cmdline MATCHES \"-t|--target\"\n           AND args_count\
      \ >= 4 AND uid_changed = true ]\n| emit alert"
- question: Which container-parent to host-child process pairs have not been seen over a rolling 30-day
    window, and are there cross-namespace exec spikes above the 99th percentile per host?
  context: Escape behavior is rare relative to a host's normal, repetitive process tree. This statistical
    method flags container-parent->host-child process pairs unseen over a rolling 30-day window (novel
    lineage), and scores per-host frequency of cross-namespace exec events, alerting on >99th-percentile
    spikes (ReplicaWatcher / Forrest self-nonself approaches). A newly observed parent-child pair crossing
    the container boundary, or a sudden spike of cross-namespace execs, is a candidate escape. Positive
    results are rare or surging lineage relationships; negatives reflect the established baseline. This
    complements the deterministic rule by catching escapes that use legitimate-looking runtime parents
    in novel ways during Privilege Escalation.
  answer_sources:
  - Windows Event ID 4688
  - Linux auditd SYSCALL
  - Linux Sysmon Event ID 1
  - 'NAI: Process creation logs on all container hosts'
  range: Last 90 days; rolling 30-day rarity window
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (4688, auditd:SYSCALL, linux:Sysmon EID=1)

      | eval pair = parent_name . "->" . child_name

      | where actor_crosses_namespace = true

      | stats earliest(_time) AS first_seen, count by host, pair

      | where first_seen > now()-30d  // unseen before window

      | eventstats perc99(count) AS p99 by host

      | where count > p99 | emit alert'
- question: In a process/namespace provenance graph, does node-level GNN anomaly detection identify container-to-host
    edges, and what are the top contributing nodes (runtime parent, host binary, namespace change)?
  context: Graph neural network anomaly detection (ThreaTrace, UNICORN) operates on the whole process/namespace
    provenance structure rather than isolated events. Build a provenance graph of processes and namespaces
    and use node-level GNN scoring to spot container-to-host edges that deviate from normal topology.
    Surfacing the top contributing nodes (the runtime parent, the host binary executed, the namespace
    change) gives analysts an explainable subgraph to triage. A flagged container-to-host edge is a strong
    escape indicator that scales across many hosts, supporting detection of Privilege Escalation via Escape
    to Host even when per-event rules miss the relationship.
  answer_sources:
  - Windows Event ID 4688
  - Linux auditd SYSCALL
  - Linux Sysmon Event ID 1
  - 'NAI: Process creation logs on all container hosts'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = build_process_namespace_graph(events)\nnode_scores = gnn_anomaly.score(G)\nfor n in node_scores\
      \ where n.score > threshold AND n.edge_type=\"container->host\":\n  emit alert with top_nodes=[runtime_parent,\
      \ host_binary, ns_change]"
- question: Did a containerized process connect to the Docker control socket/pipe (docker.sock) and then
    issue a command containing --privileged, --pid=host, -v /:, or a host root mount?
  context: 'A mounted Docker control socket inside a container is a direct path to host control: the container
    can instruct the daemon to launch a privileged container or mount the host root. The deterministic
    floor alerts when a containerized process connects to docker.sock and issues a command containing
    --privileged, --pid=host, -v /:, or a host root mount, mirroring Falco''s docker.sock and privileged-container
    rules and NIST SP 800-190 guidance. Keep the explicit flag/mount list as the floor. A positive correlation
    means the container is leveraging the daemon to break isolation, a textbook Escape to Host Privilege
    Escalation. Negatives indicate no abusive daemon command followed the socket connection.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Linux auditd CONNECT
  - docker:daemon
  - 'NAI: Container hosts, specifically monitoring process command-lines and network connections to the
    container daemon'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "conn = search source IN (5156, Zeek:conn.log, auditd:CONNECT)\n       | where actor_is_container\
      \ = true AND dest MATCHES \"docker.sock|//./pipe/docker_engine\"\ncmd  = search source = docker:daemon\n\
      \       | where cmdline MATCHES \"--privileged|--pid=host|-v /:|--mount.*source=/\"\n| join container_id\
      \ [conn -> cmd] within 120s | emit alert"
- question: Which docker run volume/flag combinations have near-zero frequency over >=30 days of history,
    and are there bursts of failed/denied daemon requests?
  context: Privileged or host-mount docker invocations are rare in well-run environments. This statistical
    method flags docker run volume/flag combinations whose frequency is near-zero across >=30-day history,
    and profiles failed/denied daemon requests as a distinct signal (Datadog Kubernetes audit guidance,
    bag-of-system-calls). A previously unseen --privileged or host-mount combination, or a spike of denied
    daemon requests, indicates probing or an actual escape attempt against the container daemon. Positive
    results are rare-argument or denied requests; negatives reflect routine daemon usage. This catches
    Privilege Escalation that uses daemon arguments not in the explicit floor list.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Linux auditd CONNECT
  - docker:daemon
  - 'NAI: Container hosts, specifically monitoring process command-lines and network connections to the
    container daemon'
  range: Last 90 days; frequency baseline over >=30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source = docker:daemon\n| eval argset = normalize(flags + volumes)\n| stats count by argset\n\
      | eventstats sum(count) AS total | eval freq = count/total\n| where freq < 0.001\n| append [ search\
      \ docker:daemon | where status IN (\"denied\",\"403\",\"error\")\n           | bucket span=5m |\
      \ stats count by user | where count > p99 ]\n| emit alert"
- question: Do docker/CLI command lines structurally deviate from the benign baseline under an n-gram
    token model, and what are the top-3 anomalous tokens or flags?
  context: Attackers craft docker/CLI commands that differ structurally from routine operational commands.
    Model docker/CLI command lines using token n-grams to flag structural deviation from the benign baseline,
    reporting the top-3 anomalous tokens/flags in the alert for fast triage (AI-Driven Container Security
    survey, CDL). A command whose token structure diverges sharply from learned norms (unusual flag ordering,
    rare mount syntax, host-path tokens) is a candidate abuse of the daemon for escape. Positive results
    highlight structurally novel commands; negatives match the operational baseline. This complements
    both the deterministic and rare-argument methods in detecting Escape to Host Privilege Escalation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Linux auditd CONNECT
  - docker:daemon
  - 'NAI: Container hosts, specifically monitoring process command-lines and network connections to the
    container daemon'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "ngrams = tokenize_ngrams(docker_cmdline, n=3)\nscore = ngram_model.deviation(ngrams)\nif score\
      \ > threshold:\n  emit alert with top3_tokens = most_anomalous(ngrams, model)"
- question: Did a container process access host-only files or registry keys outside its configured mounts,
    read sensitive files (/etc/shadow, service-account token), or perform a mount of /dev/sd* (args_count
    >= 3) followed by chroot within 5 minutes?
  context: Reaching host-only files/registry keys or executing a mount-then-chroot pivot are hallmark
    escape behaviors. The deterministic floor alerts when a container process accesses host-only files/registry
    keys outside its configured mounts, reads sensitive files (/etc/shadow, service-account token), or
    performs a mount of /dev/sd* with args_count >= 3 followed by chroot within 5 minutes (the host-root
    pivot), mirroring Elastic's mount/chroot escape rule and Falco. Keep the explicit host-path/sensitive-file
    list and 5-minute sequence window as the floor. A positive result is direct evidence of a container
    reading or pivoting into host resources, a core Escape to Host Privilege Escalation. Negatives indicate
    the container stayed within its mounts.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Linux auditd PATH
  - Linux Sysmon Event ID 11
  - 'NAI: File integrity monitoring (FIM) and registry audit logs on container hosts'
  range: Last 90 days; correlate mount and chroot within a 5-minute window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (4663, 4657, 4688, auditd:PATH, linux:Sysmon EID=11)\n| where actor_is_container\
      \ = true\n| where (path NOT IN configured_mounts(container_id)\n        OR path IN (\"/etc/shadow\"\
      ,\"/var/run/secrets/**/token\"))\n| append [ search exe=\"mount\" cmdline MATCHES \"/dev/sd*\" args_count>=3\n\
      \           THEN exe=\"chroot\" within 5m by container_id ]\n| emit alert"
- question: Which container accesses target host paths absent from the per-image baseline, do host-path
    access frequencies exceed the 99th percentile per window, and how many denied accesses (EACCES) occur?
  context: Each container image has a characteristic set of paths it touches. This statistical method
    flags accesses to host paths absent from the container's per-image baseline list, scores host-path
    access frequency per window and alerts beyond the 99th percentile, and counts denied accesses (EACCES)
    separately (bag-of-system-calls, Forrest self-nonself). A container suddenly touching host paths it
    never used, a surge in host-path accesses, or a cluster of EACCES denials all indicate attempted boundary
    crossing. Positive results are off-baseline or denied accesses; negatives match the image profile.
    This catches Privilege Escalation against host files not covered by the explicit floor list.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Linux auditd PATH
  - Linux Sysmon Event ID 11
  - 'NAI: File integrity monitoring (FIM) and registry audit logs on container hosts'
  range: Last 90 days; per-image baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (4663, auditd:PATH, linux:Sysmon EID=11)

      | where actor_is_container = true

      | where path NOT IN baseline_paths(image)

      | bucket span=10m | stats count AS hits, sum(result="EACCES") AS denied by image, host

      | eventstats perc99(hits) AS p99 by image

      | where hits > p99 OR denied > 0 | emit alert'
- question: When comparing the live kernel-event/syscall distribution of a container against its identical
    replicas, which container's host-access profile diverges, and which event classes drove the divergence?
  context: Identical container replicas should behave identically; the one that diverges is suspect. This
    ML method (ReplicaWatcher, CDL) compares the live kernel-event/syscall distribution of each container
    against its identical replicas and flags the outlier whose host-access profile diverges, requiring
    no pre-trained model. Surfacing the divergent event classes gives analysts an immediate triage focus.
    Because it is unsupervised and replica-relative, it adapts automatically to new images and catches
    escapes that look normal in isolation but abnormal relative to peers. A divergent replica accessing
    host resources is a strong Escape to Host Privilege Escalation candidate.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Linux auditd PATH
  - Linux Sysmon Event ID 11
  - 'NAI: File integrity monitoring (FIM) and registry audit logs on container hosts'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for group in replica_sets:\n  dist = {c: syscall_distribution(c) for c in group}\n  outlier\
      \ = max_divergence(dist)  # e.g., KL divergence vs group median\n  if outlier.score > threshold:\n\
      \    emit alert with divergent_classes = top_event_classes(outlier)"
- question: Did a process previously linked to an escape alert initiate outbound connections to external
    IPs, especially CTI-listed destinations or new ASNs/ports not in the host egress allowlist?
  context: 'After a successful escape, adversaries frequently establish command and control from the host.
    This deterministic floor alerts when a process previously linked to an escape alert initiates outbound
    connections to external IPs, especially CTI-listed destinations or new ASNs/ports not in the host
    egress allowlist (Falco). Keep the allowlist-deny floor. Correlating prior escape detections with
    subsequent egress turns two medium-confidence signals into one high-confidence incident: a compromised
    host beaconing out. A positive result is post-escape C2 or exfiltration; negatives indicate the escaped
    process did not (yet) reach an unauthorized external destination. This bridges Privilege Escalation
    to follow-on Command and Control on the host.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Firewall logs
  - Linux auditd CONNECT
  - 'NAI: Container host process logs and network egress points (e.g., Firewalls, Core Routers, Zeek sensors)'
  range: Last 90 days; correlate egress within a short window after a suspected escape
  queries:
  - technology: SIEM/Rule pseudocode
    query: "esc = search escape_alerts | fields host, pid, process\nnet = search source IN (4688, Zeek:conn.log,\
      \ Firewall, auditd:CONNECT)\n      | where direction=\"outbound\" AND dest_is_external = true\n\
      | join host,pid [esc -> net]\n| where dest IN cti_bad OR asn NOT IN egress_allowlist OR port NOT\
      \ IN egress_allowlist\n| emit alert"
- question: Within a short window after a suspected escape, which outbound connections are outliers in
    destination port/ASN/protocol or byte volume versus host baselines, and are there bursts of blocked/failed
    connections?
  context: Post-escape C2 often differs statistically from a host's normal egress. This method scores
    connections by comparing destination port/ASN/protocol and byte volume against host baselines, flagging
    outliers within a short window after a suspected escape, and profiles blocked/failed connections as
    a distinct signal (Datadog audit guidance, bag-of-system-calls). An outbound connection to an unusual
    port/ASN, or an abnormal byte volume, shortly after an escape alert is strong corroboration. Blocked/failed
    connections separately reveal attempted-but-denied C2. Positive results are statistically anomalous
    or denied egress; negatives match host norms. This supports detecting the Command and Control stage
    that follows Escape to Host Privilege Escalation.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Firewall logs
  - Linux auditd CONNECT
