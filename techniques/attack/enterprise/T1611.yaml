    /, /proc, or /var/run/docker.sock, or allowPrivilegeEscalation: true (NIST SP 800-190, Datadog audit
    guidance). Keep these fields as deterministic policy tripwires. A positive result means a workload
    was created with the configuration needed to trivially reach the host, an immediate Privilege Escalation
    risk that should ideally be blocked at admission. Negatives indicate workloads conformed to least-privilege.'
