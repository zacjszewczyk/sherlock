name: 'T1546.012: Image File Execution Options Injection'
id: a19bd90a-fb5f-4ec8-a199-39f9cf5a52cf
description: 'Investigate suspected abuse of Image File Execution Options (IFEO) and the related Silent
  Process Exit mechanism on Windows, where adversaries register a ''Debugger'' value (or a SilentProcessExit
  ''MonitorProcess'' value) so that attacker-controlled code runs automatically whenever a target executable
  launches or exits. This playbook helps an analyst confirm or rule out IFEO-based persistence and privilege
  escalation by examining: registry writes to Debugger/MonitorProcess values under the Image File Execution
  Options and SilentProcessExit keys; debugger paths that resolve to user-writable directories, unsigned/missing
  files, or known-malicious hashes; the classic accessibility backdoor (sethc.exe, utilman.exe, osk.exe,
  Magnify.exe, Narrator.exe rewritten to cmd.exe or powershell.exe for SYSTEM-level access at the logon
  screen); gflags.exe invocations that enable debuggers or silent-process-exit monitoring; and the resulting
  anomalous parent-child process chains (e.g., notepad.exe or utilman.exe spawning a shell) and their
  downstream network egress. It combines deterministic symbolic-logic detections with statistical baselining
  (frequency, entropy, prevalence, Levenshtein distance) and machine-learning approaches (Random Forest
  / gradient boosting, Isolation Forest, provenance-graph and time-series models) to surface both known
  and novel variants.'
type: technique
related:
