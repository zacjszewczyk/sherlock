questions:
- question: 'Match IFEO debugger paths to threat intel: in support of the information requirement "Is
    the adversary maintaining persistence using Image File Execution Options?", using a Symbolic Logic
    approach, investigate whether a `Debugger` value within a registry key under `HKLM\SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\Image File Execution Options\` is modified to an executable path whose file hash
    matches a known malicious hash, or the path matches a known malicious pattern (for example `C:\Users\Public\a.exe`).'
  context: 'This question supports detection of Image File Execution Options Injection (T1546.012) used
    for persistence (maintaining access across reboots, credential changes, and other interruptions).
    Evidence to examine: A `Debugger` value within a registry key under `HKLM\SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\Image File Execution Options\` is modified to an executable path whose file hash
    matches a known malicious hash, or the path matches a known malicious pattern (for example `C:\Users\Public\a.exe`).
    Method (Symbolic Logic): Trigger on Windows Event ID 4657 or Sysmon Event ID 13 where ''TargetObject''/''Object
    Name'' matches `HKLM\SOFTWARE\*\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\*\Debugger`,
    as the write of a Debugger value is the deterministic floor for IFEO persistence ([Elastic IFEO rule](https://detection.fyi/elastic/detection-rules/windows/persistence_evasion_registry_ifeo_injection/),
    [Sigma GlobalFlags](https://detection.fyi/sigmahq/sigma/windows/registry/registry_set/registry_set_persistence_globalflags/)).
    Extract the new executable path, compute its SHA256 (State: resolve-success vs path-not-found), and
    compare against a known-malicious hash feed. Alert HIGH on any match; alert MEDIUM when the path resolves
    to a missing/unsigned file. Suppress documented benign debuggers (ThinKiosk, PSAppDeployToolkit) per
    [Elastic IFEO rule](https://detection.fyi/elastic/detection-rules/windows/persistence_evasion_registry_ifeo_injection/).
    A positive result (a match, a statistical outlier, or a high model score) is strong evidence of IFEO/Silent
    Process Exit abuse and should be triaged against change-management records and the modifying process
    lineage; a negative result helps rule out this persistence vector but should be corroborated with
    the other questions in this playbook because adversaries often evade any single signal.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Windows System Registry Hives and process execution logs on Domain Controllers, Critical Application
    Servers, and User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(EventID=4657 OR (source=Sysmon EventID=13))

      | where TargetObject matches "HKLM\\SOFTWARE\\*\\Microsoft\\Windows NT\\CurrentVersion\\Image File
      Execution Options\\*\\Debugger"

      | eval dbg=Details, sha256=hash_file(dbg)

      | eval state=if(file_exists(dbg),"resolve-success","path-not-found")

      | lookup threat_intel_hashes sha256 OUTPUT verdict

      | where verdict="malicious" -> severity=HIGH

      | where state="path-not-found" OR signed=false -> severity=MEDIUM

      | NOT in suppress_list(ThinKiosk, PSAppDeployToolkit)'
- question: 'Flag IFEO paths with anomalous entropy or frequency: in support of the information requirement
    "Is the adversary maintaining persistence using Image File Execution Options?", using a Statistical
    Method approach, investigate whether a `Debugger` value within a registry key under `HKLM\SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\Image File Execution Options\` is modified to an executable path whose file hash
    matches a known malicious hash, or the path matches a known malicious pattern (for example `C:\Users\Public\a.exe`).'
  context: 'This question supports detection of Image File Execution Options Injection (T1546.012) used
    for persistence (maintaining access across reboots, credential changes, and other interruptions).
    Evidence to examine: A `Debugger` value within a registry key under `HKLM\SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\Image File Execution Options\` is modified to an executable path whose file hash
    matches a known malicious hash, or the path matches a known malicious pattern (for example `C:\Users\Public\a.exe`).
    Method (Statistical Method): Maintain a per-enterprise frequency distribution of every executable
    path ever set as an IFEO Debugger and of its parent directory ([CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/)).
    For each new modification compute: filename Shannon entropy, directory depth, and directory prevalence.
    Alert when filename entropy exceeds the 95th percentile of the baseline OR the debugger directory
    (e.g., %APPDATA%, %TEMP%, C:\Users\Public) has historical prevalence <1% for debuggers. Also apply
    standard-deviation thresholding (>3σ) to the daily count of IFEO Debugger writes per host to catch
    Volume/Frequency spikes ([Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)).
    Track failed writes (ACL-denied 4657) as a distinct signal. A positive result (a match, a statistical
    outlier, or a high model score) is strong evidence of IFEO/Silent Process Exit abuse and should be
    triaged against change-management records and the modifying process lineage; a negative result helps
    rule out this persistence vector but should be corroborated with the other questions in this playbook
    because adversaries often evade any single signal.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Windows System Registry Hives and process execution logs on Domain Controllers, Critical Application
    Servers, and User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=registry TargetObject="*Image File Execution Options*Debugger"

      | eval ent=shannon_entropy(filename(Details)), depth=dir_depth(Details), dir=parentdir(Details)

      | lookup ifeo_baseline dir OUTPUT dir_prevalence, ent_p95

      | where ent > ent_p95 OR dir_prevalence < 0.01

      | stats count by host, bin(_time,1d) | where count > avg+3*stdev

      | append [search EventID=4657 status=ACL_DENIED]  // failed writes as distinct signal'
