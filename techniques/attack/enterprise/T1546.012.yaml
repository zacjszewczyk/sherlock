    directory (for example `C:\Users\*`, `C:\ProgramData\*`, `C:\Windows\Temp\*`, or `C:\Perflogs\*`).
    Method (Statistical Method): Per application, baseline its known-good debugger path strings. For each
    new IFEO modification compute the minimum Levenshtein distance to the known-good set and the prevalence
    of the target directory enterprise-wide; flag distances above the 99th percentile or directories on
    <1% of hosts ([CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/)). Record the rate
    of writes that reference nonexistent debugger files as a distinct failure-mode signal. A positive
    result (a match, a statistical outlier, or a high model score) is strong evidence of IFEO/Silent Process
    Exit abuse and should be triaged against change-management records and the modifying process lineage;
    a negative result helps rule out this persistence vector but should be corroborated with the other
    questions in this playbook because adversaries often evade any single signal.'
