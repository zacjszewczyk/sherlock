name: 'T1124: System Time Discovery'
id: df964e23-5775-436b-85ca-2af46c8cc3b8
description: Investigate whether an adversary is gathering system time and/or time zone information from
  local or remote hosts across Windows, Linux, macOS, ESXi, and network devices. Adversaries query the
  system clock, time zone, and uptime using built-in tooling (net time, w32tm /tz, Get-Date/Get-TimeZone/tzutil,
  date/timedatectl/hwclock, systemsetup -gettimezone, esxcli system clock get, 'show clock detail') or
  direct API/syscalls (GetTickCount, GetSystemTime, NtQuerySystemTime, clock_gettime, gettimeofday, timeIntervalSinceNow).
  This reconnaissance supports follow-on activity such as time-based scheduled task/job creation, victim
  geolocation via time zone, sandbox/virtualization evasion, and time-bomb or delayed execution logic.
  This playbook helps an analyst hunt for anomalous time-discovery process and script execution, unusual
  parent/child lineage, suspicious time-related API call patterns, anomalous NTP (UDP/123) egress to unapproved
  time servers, and time-command activity on network devices and hypervisors by non-standard users — then
  correlate these to subsequent scheduling, persistence, or further discovery as a behavior chain.
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a process or script execute a tool whose executable hash matches threat intelligence for
    utilities known to query system time, time zone, or device uptime?
  context: 'Supports Discovery by catching adversary reconnaissance of the system clock. This is the deterministic
    floor: alert whenever Windows Event ID 4688, Sysmon Event ID 1, or PowerShell Event ID 4104 telemetry
    shows a process whose image hash matches a curated threat-intelligence list of time/timezone/uptime
    query tools. A positive match is a high-confidence indicator to triage immediately; run statistical
    and ML detectors in parallel but never remove this rule. Inspect the hash provenance, launching account,
    and parent process to separate sanctioned administration from malicious recon.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Executive Workstations, Domain Controllers, Critical Application Servers, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=edr (EventCode=4688 OR (source=Sysmon EventCode=1))

      | eval h=lower(coalesce(Hashes,SHA256,IMPHASH))

      | lookup ti_time_discovery_tools hash AS h OUTPUT tool_name, ti_source

      | where isnotnull(tool_name)

      | table _time host user ParentImage Image CommandLine tool_name ti_source'
- question: Did a time-discovery binary get spawned by a parent process that is new or rare for that host
    over the prior 30 days?
  context: Supports Discovery by exposing recon that hides inside living-off-the-land tooling. Build a
    30-day per-host baseline of parent processes that spawn time-discovery binaries (net.exe, w32tm.exe,
    powershell.exe, tzutil.exe on Windows; date/timedatectl/hwclock on Linux; systemsetup on macOS). Alert
    when the observed parent is new or rare for that host — for example an Office application, a browser,
    or an unexpected service binary spawning the shell that runs the time query. A rare-parent outlier
    is a strong signal of injected or scripted execution rather than legitimate admin or scheduler activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Executive Workstations, Domain Controllers, Critical Application Servers, Developer Endpoints'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr (EventCode=4688 OR EventCode=1)

      | search Image IN ("*net.exe","*w32tm.exe","*powershell.exe","*tzutil.exe","*date","*timedatectl","*hwclock","*systemsetup")

      | stats earliest(_time) AS first count BY host ParentImage Image

      | where first > relative_time(now(),"-30d") OR count < 3'
- question: After a threat-intel-matched binary ran, did the same host or account execute time-query script-block
    content (Get-Date, w32tm, tzutil) within 10 minutes, and was it followed by scheduled-task creation
    in the same process tree?
  context: Supports Discovery by confirming active execution and chaining it to follow-on actions. Escalate
    when a TI-matched binary is followed within a 10-minute window by PowerShell script-block content
    such as Get-Date, w32tm, or tzutil from the same account/host, indicating live discovery rather than
    a dormant tool on disk. Then correlate the time query with subsequent scheduled-task creation or further
    discovery within the same process tree as a behavior chain. A complete chain (recon -> time query
    -> schedule) markedly raises confidence and points toward time-bomb or delayed-execution setup.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Executive Workstations, Domain Controllers, Critical Application Servers, Developer Endpoints'
  range: Last 90 days (event-centered 10-minute correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '| from time_discovery_events AS t

      | join host, user [ search EventCode=4104 (ScriptBlockText="*Get-Date*" OR "*w32tm*" OR "*tzutil*")
      ] AS s

      | where s._time - t._time BETWEEN 0 AND 600

      | join process_tree [ search (EventCode=4688 Image="*schtasks.exe*") OR (EventCode=106 source=TaskScheduler)
      ] AS k

      | table t.host t.user t.Image s.ScriptBlockText k.CommandLine'
- question: Has the volume of time-discovery tool detections for a host, user, or department exceeded
    the 95th percentile of its 90-day baseline?
  context: Supports Discovery by quantifying abnormal recon volume. Track detections of time-discovery
    tool hashes grouped by host, user, and department over 90 days and alert when a hash or cluster exceeds
    the 95th percentile of its own baseline. Emit the observed count, the baseline mean, and the percentile
    in the alert so an analyst can judge magnitude. A sharp volume increase suggests scripted sweeps or
    campaign activity rather than incidental administration.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Executive Workstations, Domain Controllers, Critical Application Servers, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr time_discovery=true

      | bin _time span=1d

      | stats count AS c BY entity entity_type day

      | eventstats mean(c) AS mu perc95(c) AS p95 BY entity entity_type

      | where c > p95

      | table entity entity_type c mu p95'
- question: Did hourly time-discovery executions on a host shift abruptly from a low baseline to a sustained
    burst, and were any executions failed or blocked?
  context: Supports Discovery by detecting onset of recon activity. Apply change-point detection (CUSUM,
    PELT, or Bayesian online CPD) to the hourly count of time-discovery executions per host and alert
    on an abrupt shift from a near-zero baseline to sustained bursts — the classic signature of an operator
    beginning enumeration. Separately profile failed or blocked executions (access-denied 4688 with non-zero
    exit, EDR-blocked launches) as a distinct State signal, since sweeps often generate failures before
    a success. A detected change point plus failure spikes strongly indicates hands-on-keyboard discovery.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Executive Workstations, Domain Controllers, Critical Application Servers, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr time_discovery=true

      | bin _time span=1h | stats count AS c BY host _time

      | sort 0 host _time

      | streamstats current=f window=24 mean(c) AS base BY host

      | where c > base*3 AND c >= 5

      | append [ search index=edr time_discovery=true (status=access_denied OR blocked=true) | stats count
      BY host ]'
- question: Do time-discovery events cluster into distinct campaigns when grouped by hash, user, host,
    parent process, and command line?
  context: Supports Discovery by revealing coordinated or lateral-spread recon. Cluster tool-driven time-discovery
    events using DBSCAN over features such as image hash, user, host, parent process, and command line
    to identify new campaigns or movement across hosts. Surface the top-3 shared features of each cluster
    (for example a common parent, an identical command line, or a shared hash) in the alert for explainability.
    A dense cluster spanning multiple hosts/users that share command-line artifacts suggests a single
    actor or automated tooling rather than unrelated admin activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Executive Workstations, Domain Controllers, Critical Application Servers, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/Clustering pseudocode
    query: "features = [hash, user, host, parent_image, cmdline_tokens]\nmodel = DBSCAN(eps=0.5, min_samples=5).fit(encode(events))\n\
      for cluster in model.labels_:\n    emit(cluster_id, size, top3_shared_features(cluster))"
- question: Is time discovery immediately followed by additional discovery techniques in the same process
    tree in an improbable sequence?
  context: Supports Discovery by modeling the order of operations adversaries follow. Train a sequence
    model over process and script telemetry to learn benign orderings, then flag cases where time discovery
    is followed by additional discovery techniques from the same process tree with low next-event probability.
    Use attention weights to report the top-3 contributing events for analyst interpretability. An improbable
    discovery sequence concentrated in one process tree indicates scripted reconnaissance chaining rather
    than isolated, routine commands.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Executive Workstations, Domain Controllers, Critical Application Servers, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/Sequence pseudocode
    query: "seq = ordered_events_per_process_tree(host)\np = deeplog.next_event_prob(seq)\nif p < threshold\
      \ and contains_time_discovery(seq):\n    alert(host, seq, top3_attention(seq))"
- question: Did a built-in Windows time utility (net time, w32tm /tz, w32tm /query, date /t, time /t,
    Get-Date, Get-TimeZone, tzutil) run with a parent process other than explorer.exe, services.exe, svchost.exe,
    or an approved admin tool?
  context: Supports Discovery on Windows by pinpointing time queries that bypass normal interactive or
    service lineage. Monitor Event ID 4688 / Sysmon Event ID 1 command lines for net time, w32tm /tz,
    w32tm /query, date /t, and time /t, and alert when the parent process is not explorer.exe, services.exe,
    svchost.exe, or an approved admin tool. Also flag PowerShell Script Block Logging (Event ID 4104)
    for Get-Date, Get-TimeZone, [System.DateTime], or tzutil originating from non-interactive scripts.
    Focus on hosts not designated as NTP servers (standard workstations and application servers) where
    such queries are rarely legitimate.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, with a focus on hosts not designated as NTP servers within
    the environment (e.g., standard user workstations, application servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=win (EventCode=4688 OR EventCode=1)

      | where match(CommandLine,"(?i)net\s+time|w32tm\s+/tz|w32tm\s+/query|date\s+/t|time\s+/t")

      | where NOT (ParentImage IN ("*explorer.exe","*services.exe","*svchost.exe") OR ParentImage IN approved_admin_tools)

      | append [ search EventCode=4104 (ScriptBlockText="*Get-Date*" OR "*Get-TimeZone*" OR "*System.DateTime*"
      OR "*tzutil*") NonInteractive=true ]

      | table _time host user ParentImage Image CommandLine'
- question: Do hourly time-discovery command counts for a user or host exceed the 99th percentile of their
    30-day baseline, with high parent-process command-line entropy in the same window?
  context: Supports Discovery by detecting abnormal Windows command frequency. Baseline hourly time-discovery
    command counts per user/host over 30 days and alert above the 99th percentile using time-series decomposition
    with a tunable anomaly score (1.5-3) and a minimum event threshold to suppress noise. Add a secondary
    signal when command-line entropy or feature deviation for the parent processes is high in windows
    that contain time discovery, which catches obfuscated or scripted invocation. Combined frequency and
    entropy anomalies indicate automated enumeration rather than occasional manual checks.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, with a focus on hosts not designated as NTP servers within
    the environment (e.g., standard user workstations, application servers).'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=win time_discovery=true

      | bin _time span=1h | stats count AS c BY entity _time

      | timechart-decompose c -> expected, residual

      | where residual_score > 2 AND c >= min_events

      | join entity [ search time_discovery=true | eval ent=entropy(ParentCommandLine) | stats max(ent)
      AS pent BY entity ]

      | where pent > entropy_threshold'
- question: Are failed or access-denied time-discovery attempts (ERROR_ACCESS_DENIED on net time \\host,
    RPC failures, w32tm errors) spiking on a host?
  context: Supports Discovery by surfacing enumeration sweeps via their failure pattern. Track command
    exit/failure State — access-denied results, ERROR_ACCESS_DENIED on net time \\host, RPC failures,
    and w32tm errors — per host and alert when failed time-discovery attempts spike. Remote enumeration
    across many hosts typically produces a burst of failures before a successful query, so a cluster of
    failures is itself a recon indicator even when no single command succeeds.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, with a focus on hosts not designated as NTP servers within
    the environment (e.g., standard user workstations, application servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=win time_discovery=true (status=access_denied OR result=ERROR_ACCESS_DENIED OR error=rpc_failure
      OR w32tm_error=true)

      | bin _time span=1h | stats count AS fails BY host _time

      | eventstats avg(fails) AS mu stdev(fails) AS sd BY host

      | where fails > mu + 3*sd'
- question: Does a supervised classifier score a Windows time-discovery command as malicious (probability
    > 0.8) based on parent, command line, user, and time-of-day features?
  context: Supports Discovery by ranking time queries by learned maliciousness. Train a Random Forest
    on process execution features — parent process, command line, user, and time-of-day — to classify
    time-discovery commands and alert on scores above 0.8. Output the top-3 contributing features (for
    example a rare parent, off-hours execution, or anomalous command tokens) in the alert text to accelerate
    triage. A high-probability classification combined with explanatory features helps an analyst quickly
    confirm whether the command reflects recon.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, with a focus on hosts not designated as NTP servers within
    the environment (e.g., standard user workstations, application servers).'
  range: Last 90 days
  queries:
  - technology: ML/Classifier pseudocode
    query: 'X = features(parent, cmdline, user, hour_of_day)

      score = random_forest.predict_proba(X)[malicious]

      if score > 0.8: alert(host, cmdline, top3_feature_importance(X))'
- question: Do time-discovery command lines embedded with a BERT-style encoder score as outliers against
    the normal command distribution?
  context: Supports Discovery by catching novel command variants static rules miss. Embed time-discovery
    command lines with a BERT-style encoder and score them with unsupervised outlier detectors (Isolation
    Forest, COPOD, PCA, or an autoencoder) to flag previously unseen invocations or obfuscated forms.
    Report the nearest-normal command and the top divergent tokens so an analyst can see why the command
    was flagged. An outlier command line is worth investigating even when it does not match any explicit
    keyword rule.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, with a focus on hosts not designated as NTP servers within
    the environment (e.g., standard user workstations, application servers).'
  range: Last 90 days
  queries:
  - technology: ML/Embedding pseudocode
    query: "emb = bert_encode(cmdline)\ns = isolation_forest.decision_function(emb)\nif s < threshold:\n\
      \    alert(cmdline, nearest_normal(emb), top_divergent_tokens(cmdline))"
- question: Did a host send NTP traffic on UDP/123 to a destination IP that is not on the organization's
    approved NTP allowlist?
  context: Supports Discovery by detecting unsanctioned external time synchronization that can leak time-zone/locality
    context or signal recon. NTPv4 clients poll a small, fixed set of configured servers on UDP/123 at
    bounded intervals, so any off-allowlist or off-port time sync is protocol-anomalous. Alert on Zeek
    conn.log traffic to UDP/123 when the destination IP is not in the approved NTP allowlist. A positive
    result may indicate misconfiguration, but it can also reveal an adversary using an attacker-controlled
    time source or probing external infrastructure.
  answer_sources:
  - Zeek conn.log
  - Zeek ntp.log
  - 'NAI: Network Egress Points, Firewall and Network Gateway logs, DNS Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'index=zeek sourcetype=conn id.resp_p=123 proto=udp

      | lookup ntp_allowlist ip AS id.resp_h OUTPUT approved

      | where isnull(approved)

      | table ts id.orig_h id.resp_h orig_bytes resp_bytes'
- question: Is a host polling NTP servers far faster than the standard minpoll (sustained queries faster
    than ~64 s per server), or receiving Kiss-o'-Death / unreachable / blocked responses?
  context: Supports Discovery by flagging abnormal NTP poll behavior and failure states. Per RFC 5905
    poll semantics, well-behaved clients respect minpoll and back off; sustained polling faster than roughly
    one query per 64 seconds per server is anomalous and may indicate scripted time probing or covert
    channel use. Separately profile Kiss-o'-Death, unreachable, and blocked responses as a distinct failure-mode
    State signal. Rapid polling or a burst of failed exchanges is worth investigating against the host's
    normal time-sync configuration.
  answer_sources:
  - Zeek conn.log
  - Zeek ntp.log
  - 'NAI: Network Egress Points, Firewall and Network Gateway logs, DNS Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'index=zeek sourcetype=ntp

      | stats count AS q min(_time) AS a max(_time) AS b BY id.orig_h id.resp_h

      | eval rate=(b-a)/q

      | where rate < 64

      | append [ search index=zeek sourcetype=ntp (kiss_code=* OR resp=unreachable OR blocked=true) |
      stats count BY id.orig_h ]'
- question: Has a host's hourly outbound NTP connection count or byte volume exceeded its 30-day mean
    plus 3 sigma, or shown a sustained change-point shift?
  context: Supports Discovery by quantifying abnormal NTP volume. Baseline hourly outbound NTP connections
    and byte volume per host over 30 days from Zeek conn.log (Volume + Frequency) and alert when counts
    exceed mean + 3 sigma. Apply change-point detection to catch sustained shifts that a static threshold
    would miss. A volume spike or sustained increase in NTP activity can indicate beaconing disguised
    as time sync, data exfiltration over UDP/123, or scripted time probing.
  answer_sources:
  - Zeek conn.log
  - Zeek ntp.log
  - 'NAI: Network Egress Points, Firewall and Network Gateway logs, DNS Servers, Domain Controllers'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'index=zeek sourcetype=conn id.resp_p=123

      | bin _time span=1h | stats count AS c sum(orig_bytes+resp_bytes) AS b BY id.orig_h _time

      | eventstats mean(c) AS mu stdev(c) AS sd BY id.orig_h

      | where c > mu + 3*sd

      | changepoint(c) BY id.orig_h'
- question: Is this the first time a host has ever connected to a given external time server?
  context: 'Supports Discovery by scoring brand-new time-server destinations as anomalies. Complement
    the static allowlist with a probabilistic first-time-destination (new-edge) model: score a host''s
    first-ever connection to a given external time server as a new-edge anomaly. A new edge to an unfamiliar
    external NTP destination is suspicious even if the IP is not explicitly disallowed, since legitimate
    clients reuse a stable set of configured servers. Weight the score by the rarity of the destination
    across the enterprise.'
  answer_sources:
  - Zeek conn.log
  - Zeek ntp.log
  - 'NAI: Network Egress Points, Firewall and Network Gateway logs, DNS Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'index=zeek sourcetype=conn id.resp_p=123

      | stats earliest(_time) AS first BY id.orig_h id.resp_h

      | where first > relative_time(now(),"-1d")

      | lookup global_dest_prevalence ip AS id.resp_h OUTPUT prevalence

      | eval anomaly = 1/(prevalence+1)

      | where anomaly > threshold'
- question: Does an autoencoder ensemble report high reconstruction error on a host's NTP traffic features
    (source, destination, bytes, timing, rate)?
  context: Supports Discovery by detecting subtle multivariate NTP anomalies. Train an online ensemble
    of autoencoders (Kitsune-style) on per-host Zeek ntp.log/conn.log features — source, destination,
    bytes, timing, and rate — and alert on high reconstruction error. Surface the top-3 reconstruction-error
    features in the alert so the analyst can see which dimension is abnormal. High reconstruction error
    indicates traffic that does not match the host's learned normal time-sync profile, which may reveal
    covert channels or scripted probing that evade single-feature thresholds.
  answer_sources:
  - Zeek conn.log
  - Zeek ntp.log
  - 'NAI: Network Egress Points, Firewall and Network Gateway logs, DNS Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/Autoencoder pseudocode
    query: "feats = perhost_ntp_features(src,dst,bytes,timing,rate)\nerr = kitsune_ensemble.reconstruction_error(feats)\n\
      if err > threshold:\n    alert(host, err, top3_error_features(feats))"
- question: Did a user outside the approved Network/Virtualization Admin groups (or anyone outside a maintenance
    window) run a time command on a network device or hypervisor (show clock, show clock detail, show
    timezone, esxcli system clock get, systemsetup -gettimezone)?
  context: Supports Discovery on infrastructure where time queries are seldom benign for non-admins. Monitor
    network-device AAA/TACACS+ accounting and hypervisor audit logs (vCenter/ESXi shell) for time-related
    commands and alert when they are executed by users outside the approved Network or Virtualization
    Admin groups, or outside maintenance windows. Map every execution to identity, source IP, and privilege
    level. Time discovery on a router, switch, or hypervisor by an unexpected account is a strong indicator
    of post-compromise reconnaissance against the infrastructure layer.
  answer_sources:
  - Network device syslog
  - vCenter Audit Logs
  - EDR API call telemetry
  - 'NAI: Network infrastructure (switches, routers), Hypervisor management interfaces, Endpoints and
    Servers with EDR agents'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=infra (sourcetype=networkdevice_syslog OR sourcetype=vcenter_audit OR sourcetype=esxi_shell)

      | where match(command,"(?i)show clock|show clock detail|show timezone|esxcli system clock get|systemsetup
      -gettimezone")

      | where NOT (user IN net_admin_group OR user IN virt_admin_group) OR NOT in_maintenance_window(_time)

      | table _time user src_ip priv_level device command'
- question: Does a process exceed the 99th percentile of its peers for time-related API/syscall frequency
    (GetTickCount, GetSystemTime, NtQuerySystemTime, clock_gettime, gettimeofday)?
  context: Supports Discovery by detecting programmatic time polling used for evasion or timing logic.
    Baseline time-related API call frequency per process from EDR/auditd telemetry and alert when a process
    exceeds the 99th percentile of its peers; emit the count and baseline in the alert. Repeated GetTickCount/GetSystemTime
    or clock_gettime calls can indicate sandbox/virtualization evasion, anti-analysis timing checks, or
    time-bomb logic. A process polling the clock far more than its peers warrants inspection of its lineage
    and on-disk artifacts.
  answer_sources:
  - Network device syslog
  - vCenter Audit Logs
  - EDR API call telemetry
  - 'NAI: Network infrastructure (switches, routers), Hypervisor management interfaces, Endpoints and
    Servers with EDR agents'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr (api IN ("GetTickCount","GetSystemTime","NtQuerySystemTime") OR syscall IN ("clock_gettime","gettimeofday"))

      | stats count AS c BY process image

      | eventstats perc99(c) AS p99

      | where c > p99

      | table process image c p99'
- question: Are failed or privilege-denied time-command attempts spiking on network devices or hypervisors?
  context: Supports Discovery by catching unauthorized actors probing for a working path. Profile failed
    or privilege-denied time-command attempts on network devices and hypervisors as a State signal and
    alert on spikes. Unauthorized actors frequently trigger authorization failures — insufficient privilege
    level, AAA denials, restricted shell rejections — before they find a command that succeeds. A burst
    of denied time-command attempts is an early indicator of hands-on reconnaissance against infrastructure.
  answer_sources:
  - Network device syslog
  - vCenter Audit Logs
  - EDR API call telemetry
  - 'NAI: Network infrastructure (switches, routers), Hypervisor management interfaces, Endpoints and
    Servers with EDR agents'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=infra (sourcetype=networkdevice_syslog OR sourcetype=vcenter_audit)

      | where match(command,"(?i)clock|timezone|clock get") AND (result=denied OR auth=failed OR priv_insufficient=true)

      | bin _time span=1h | stats count AS f BY device user _time

      | eventstats avg(f) AS mu stdev(f) AS sd BY device

      | where f > mu + 3*sd'
- question: Do API/syscall sequences that contain time-related calls produce high next-event surprise
    against a benign-sequence model?
  context: Supports Discovery by modeling normal program behavior at the API level. Train a sequence model
    (DeepLog-style) on benign API/syscall sequences and alert when sequences containing time-related calls
    produce high next-event surprise. Report attention-weighted top-3 contributing calls for explainability.
    An anomalous sequence in which a time query appears in an unusual position relative to surrounding
    calls can reveal malware performing timing checks or chaining discovery into other behavior, distinguishing
    it from routine application use of the clock.
  answer_sources:
  - Network device syslog
  - vCenter Audit Logs
  - EDR API call telemetry
  - 'NAI: Network infrastructure (switches, routers), Hypervisor management interfaces, Endpoints and
    Servers with EDR agents'
  range: Last 90 days
  queries:
  - technology: ML/Sequence pseudocode
    query: "seq = api_syscall_sequence(process)\nsurprise = deeplog.next_event_surprise(seq)\nif surprise\
      \ > threshold and contains_time_call(seq):\n    alert(process, top3_attention(seq))"
