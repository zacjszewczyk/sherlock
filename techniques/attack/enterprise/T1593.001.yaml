questions:
- question: '[Reconnaissance] Threat-intel watchlist chaining: Can you determine whether an internal host
    establishes a connection to a known malicious IP or domain from a threat intelligence feed, and within
    the subsequent 60 minutes, the same host establishes one or more connections to domains categorized
    as social media. -- specifically, using the ''Threat-intel watchlist chaining'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), Adversaries may search social
    media for information about victims that can be used during targeting. This evidence focuses on the
    condition that an internal host establishes a connection to a known malicious IP or domain from a
    threat intelligence feed, and within the subsequent 60 minutes, the same host establishes one or more
    connections to domains categorized as social media. This Symbolic Logic approach works as follows:
    Continuously monitor Zeek conn.log/ssl.log for destinations matching a curated threat-intelligence
    feed and add the originating internal IP to a 60-minute ''recently seen malicious'' watchlist. Alert
    if any IP on that watchlist subsequently connects to a host on the maintained social-media domain
    set, mirroring the dead-drop resolver pattern where implants read C2/targeting data from legitimate
    web/social services [MITRE ATT&CK T1102.001 Dead Drop Resolver](https://attack.mitre.org/techniques/T1102/001/).
    Alert text must list the CTI indicator hit, time delta, and the social-media destination. A positive
    result -- a rule match, statistical outlier, or model alert -- is evidence consistent with social-media
    reconnaissance; pivot to the responsible host and process, the user, the social-media destination
    domain/SNI and its TLS fingerprint, the timing and volume of requests, any preceding threat-intel
    indicator hits, and (for tripwires) the source IP and User-Agent that interacted with the decoy, to
    scope intent and attribution. A negative result helps reduce confidence in this particular vector
    but should be corroborated with the other questions in this playbook, since social-media recon is
    often externally hosted, low-volume, or spoofed and a single method can miss it.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., perimeter firewalls, web proxies) and internal DNS resolvers where
    traffic is monitored.'
  range: Last 90 days (correlate event-centered windows of +/- 60 minutes around the indicator hit)
