name: 'T1593.001: Social Media'
id: 8705fd3a-8a44-488d-850e-d3fc820c5bbb
description: 'This playbook helps an analyst investigate whether an adversary is conducting reconnaissance
  by searching social media for information about the victim organization, its staff, roles, locations,
  and interests (MITRE ATT&CK T1593.001, Social Media). Because most of this activity occurs on externally
  hosted platforms outside the defender''s direct visibility, the hunt focuses on the observable seams:
  internal hosts that reach social-media destinations in suspicious patterns, programmatic/automated access
  that betrays scraping or harvesting, server-class systems that have no business touching social media,
  and defender-planted tripwires (canarytokens and decoy ''social honeypot'' profiles) that turn an adversary''s
  recon into a high-fidelity alert. Specifically, it pursues: threat-intel watchlist chaining where a
  host that just touched a malicious indicator then pivots to social media (a dead-drop-resolver pattern);
  programmatic User-Agent, JA3/TLS fingerprint, and command-line correlation that exposes scripted access
  from interpreters such as powershell.exe, python.exe, curl.exe, and headless browsers; high-volume,
  low-timing-variance URI request bursts and elevated HTTP/DNS failure ratios characteristic of automated
  harvesting; servers (domain controllers, database, and application servers) deviating from baseline
  by reaching social-media domains; and canarytoken/decoy-profile trips that signal targeting despite
  limited platform telemetry. Detection methods combine deterministic symbolic-logic rules (watchlists,
  JA3/JA3S fingerprinting, robot navigational heuristics, honeytoken triggers), statistical methods (sequential
  hypothesis testing/SPRT on failure ratios, per-host zero-frequency ASN/destination baselining, command-line
  entropy thresholding, session timing and URI-distribution analysis, STL seasonal-trend residual anomaly
  detection), and machine learning (graph link prediction, supervised session/harvester classifiers, encrypted-traffic
  flow classification, Extended Isolation Forest outlier scoring, streaming autoencoder NIDS, and DBSCAN
  profile-shift clustering), applied across Zeek conn/dns/http/ssl logs, Windows Event ID 4688/Sysmon,
  canarytoken trigger logs, and social-media platform audit exports, so an analyst can corroborate suspected
  social-media reconnaissance from multiple independent angles.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
