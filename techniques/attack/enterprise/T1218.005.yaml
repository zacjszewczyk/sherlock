questions:
- question: Did an mshta.exe process initiate a network connection to an IP address or domain that appears
    on a threat-intelligence feed, or reference an.hta/.sct file whose hash is on a malware feed, within
    seconds of the process starting?
  context: 'This question tackles the highest-confidence indication of malicious mshta proxy execution
    for stealth: a trusted binary reaching out to known-bad infrastructure or pulling a known-bad payload.
    Join Windows Event ID 4688 mshta.exe process starts to Zeek conn.log/dns.log records from the same
    host within a tight (about 5-second) window, then alert when the destination IP or domain matches
    a threat-intel feed, or when the referenced.hta/.sct hash in Zeek files.log matches a malware feed.
    Because the adversary uses a signed, trusted utility, the network and file context is what unmasks
    the abuse. Critically, do not discard failed activity: dns.log NXDOMAIN responses and conn.log blocked/S0/REJ
    attempts originating from mshta are a distinct high-signal class indicating failed C2 resolution or
    connection, which often precedes successful fallback channels. A positive match is a strong incident;
    a clean result lowers but does not eliminate suspicion (intel feeds lag). Sources: [Splunk](https://research.splunk.com/endpoint/4aa5d062-e893-11eb-9eb2-acde48001122/);
    [LOLBAS](https://lolbas-project.github.io/lolbas/Binaries/Mshta/); [CISA/NSA](https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: All enterprise endpoints and servers; Network gateways and proxies; Threat Intelligence Platforms'
  range: Last 90 days; correlate process start and network/file events within a 5-second window
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n process=mshta.exe (EID 4688) JOIN zeek_conn|zeek_dns ON host AND |t_net - t_proc| <=\
      \ 5s\n WHERE dest_ip IN threat_intel_ip OR dest_domain IN threat_intel_domain\n OR referenced_hta_sct_hash\
      \ IN malware_hash_feed (zeek_files.log)\n -> ALERT"
  - technology: Zeek/pseudocode
    query: ">-\n // high-signal failure class\n dns.log where query from mshta-host AND rcode_name==\"\
      NXDOMAIN\"\n OR conn.log where orig is mshta-host AND conn_state IN (\"S0\",\"REJ\")\n -> tag failed_c2"
- question: Among the domains contacted by mshta.exe, which are statistically rare or first-seen relative
    to a rolling 30-day host, user, and enterprise baseline, and do their byte volume and failure-rate
    physics look anomalous?
  context: 'Threat intel cannot cover novel or bespoke C2 infrastructure, so this statistical line of
    inquiry catches stealthy mshta callbacks that no feed knows about. Build rolling host, user, and enterprise
    baselines of the eTLD+1 (public-suffix+1) domains contacted by mshta over a 30-day window, then alert
    on first-time observations or domains in the 99th percentile of rarity, deriving the rarity cutoff
    from your own domain-frequency distribution rather than a fixed magic number. Enrich with physics
    features: Volume (sum of http.log request/response bytes and the sent:received ratio per mshta flow)
    and State (the per-host fraction of NXDOMAIN and HTTP 4xx/5xx for mshta-initiated requests). Rare
    domains paired with small-request/large-response volume or high failure rates strongly suggest automated
    C2. A common, well-established domain is likely benign; a never-before-seen low-reputation domain
    warrants escalation. Sources: [Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/); [CISA/NSA](https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: All enterprise endpoints and servers; Network gateways and proxies; Threat Intelligence Platforms'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n baseline = count_by(etld1) for domains where process=mshta.exe over last 30d, per host/user/enterprise\n\
      \ score = rarity(etld1); ALERT if first_seen OR rarity >= p99\n features += sum(bytes), sent:received_ratio,\
      \ frac(NXDOMAIN), frac(http_4xx_5xx)"
- question: Do any domains contacted by mshta.exe score as malicious under a DGA/reputation classifier
    (length, n-gram, entropy, TLD, word-likeness), exceeding a 0.85 malicious-probability threshold?
  context: 'Algorithmically generated or low-reputation domains are a hallmark of automated mshta C2 that
    evades both signatures and simple baselines. Train a DGA/reputation classifier (for example a GCNN-LSTM
    or RNN with side-information) on benign and known-malicious domains, then score the domains mshta
    contacts using lexical features such as length, character n-grams, Shannon entropy, TLD rarity, and
    word-likeness, alerting when malicious probability exceeds 0.85. To keep the alert actionable and
    triageable, emit the top-3 contributing features (e.g., domain n-gram score, TLD rarity, low domain
    age) so the analyst understands why the model fired. A high-scoring domain contacted by a trusted
    binary that should rarely browse is a strong evasion indicator; a clearly human-readable, aged domain
    reduces concern. Sources: [GCNN-LSTM](https://arxiv.org/abs/2208.03445); [RNN side information](https://arxiv.org/abs/1810.02023);
    [Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: All enterprise endpoints and servers; Network gateways and proxies; Threat Intelligence Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n model = DGA_reputation_classifier(features=[length,ngram,entropy,tld,word_likeness])\n\
      \ for domain in domains_contacted_by(mshta): p = model.predict_proba(domain)\n ALERT if p > 0.85;\
      \ emit top3_feature_contributions"
- question: Does any mshta.exe command line contain script protocol handlers (vbscript:, javascript:),
    remote retrieval via GetObject, references to.sct, http/https URLs, or embedded data:text/html;base64
    content?
  context: 'These tokens are the canonical, documented abusable forms of mshta and are the most direct
    symbolic evidence of proxy execution. Scan Windows Event ID 4688 (or Sysmon EID 1) mshta.exe command
    lines for javascript:, vbscript:, GetObject("script:,.sct, or data:text/html;base64, and alert on
    matches. Legitimate mshta usage almost always points at a local.hta file by full path, so the presence
    of inline script monikers, remote scriptlet retrieval, or inline base64 HTML is highly suspicious
    and indicative of an adversary using the trusted utility to run code while staying stealthy. A match
    is a strong lead to triage with parent-process and network context; absence does not rule out obfuscated
    variants, which the statistical and ML methods address. Sources: [LOLBAS](https://lolbas-project.github.io/lolbas/Binaries/Mshta/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints and servers with command-line logging enabled'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n process=mshta.exe (EID 4688 / Sysmon EID 1)\n WHERE cmdline MATCHES /(javascript:|vbscript:|GetObject\\\
      (\"script:|https?:\\/\\/|\\.sct|data:text\\/html;base64,)/i\n -> ALERT"
- question: Does an mshta.exe command line exceed the environment's 95th-percentile (or 3-sigma) baseline
    for command-line length or Shannon entropy?
  context: 'Inline or embedded payloads inflate both the length and the randomness of an mshta command
    line, so statistical deviation flags obfuscation that literal token matching misses. Establish a 30-day
    rolling baseline of mshta command-line length and Shannon entropy, then alert when a new command line
    exceeds the 95th percentile or 3 standard deviations above the mean, deriving both thresholds from
    your own mshta history rather than a fixed constant. This catches base64/hex blobs, packed scripts,
    and unusual encodings that an adversary uses to hide intent. A long, high-entropy command line on
    a host that normally runs short, low-entropy mshta invocations is a strong evasion signal; values
    within baseline are likely benign legitimate HTA launches. Sources: [Elastic high command-line entropy](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints and servers with command-line logging enabled'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n baseline = dist(len(cmdline)), dist(shannon_entropy(cmdline)) for mshta over 30d\n ALERT\
      \ if len > p95(len) OR entropy > p95(entropy) OR entropy > mean+3*std"
- question: When an NLP/character n-gram model classifies mshta command lines, which invocations are flagged
    as obfuscated or malicious, and which tokens drive the score?
  context: 'Adversaries craft novel monikers and obfuscations specifically to evade signatures and simple
    thresholds, so a learned model generalizes beyond known patterns. Train a character/token n-gram model
    (active-learning or supervised NLP) or a command-line small language model on benign and known-malicious
    LOLBin command lines, then classify mshta command lines to catch obfuscated or novel forms. Surface
    the top-3 influential tokens or features driving each score so the analyst can validate the verdict
    and pivot. This method complements regex (which misses novel encodings) and entropy (which misses
    semantically malicious but low-entropy lines). A high model score with suspicious driving tokens is
    a strong lead; a low score on a clearly benign local-HTA invocation reduces concern. Sources: [LOLAL](https://arxiv.org/abs/2111.15039);
    [Stamp NLP](https://arxiv.org/abs/2208.12836); [command-line SLM](https://arxiv.org/html/2408.02637v1);
    [Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints and servers with command-line logging enabled'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n model = cmdline_NLP_classifier(char_token_ngrams | command_SLM)\n for c in mshta_cmdlines:\
      \ s = model.score(c)\n ALERT if s > threshold; emit top3_influential_tokens"
- question: Was mshta.exe spawned by a parent process not normally associated with legitimate HTA execution,
    such as winword.exe, excel.exe, powerpnt.exe, outlook.exe, wscript.exe, cscript.exe, chrome.exe, firefox.exe,
    or msedge.exe?
  context: 'Document handlers and browsers spawning interpreters or LOLBins is a classic initial-access-to-execution
    pattern; mshta launched by Office, email, or browser processes strongly implies a malicious document
    or link triggered proxy execution. Detect mshta.exe (EID 4688 / Sysmon EID 1) whose parent matches
    the denylist of office/email/browser/script-host binaries, which is the encoded SigmaHQ Office-child
    pattern. Because mshta is trusted, the suspicious signal lives in the lineage rather than the binary
    itself. A hit here, especially correlated with command-line script tokens or network callbacks, is
    a high-priority lead pointing at phishing-driven execution. Legitimate enterprise automation can occasionally
    use script hosts, so confirm with command-line and path context before escalating. Sources: [SigmaHQ
    Office child](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_office_susp_child_processes/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints and servers, particularly user workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n process=mshta.exe (EID 4688 / Sysmon EID 1)\n WHERE parent_image IN (winword.exe,excel.exe,powerpnt.exe,outlook.exe,\n\
      \ wscript.exe,cscript.exe,chrome.exe,firefox.exe,msedge.exe)\n -> ALERT"
- question: How rare is the observed mshta parent-child pair against 30-day historical frequencies, and
    is the host experiencing a burst of mshta starts above its baseline rate?
  context: 'Beyond a fixed denylist, statistical rarity surfaces unusual parents you did not anticipate
    and captures volumetric anomalies. Compute 30-day frequencies of mshta parent-child pairs and flag
    parents below the 1% prevalence threshold or never seen before. Add Frequency physics by counting
    mshta starts per minute per host and flagging bursts above the host baseline, which can indicate scripted
    loops or repeated execution attempts. This catches stealthy abuse where the parent is unusual-but-not-denylisted,
    or where mshta is invoked far more often than normal. A rare parent or a start-rate spike on a workstation
    that seldom runs mshta is a strong anomaly; common, frequent pairs are likely benign. Sources: [Red
    Canary](https://redcanary.com/blog/blog/lolbins-abuse/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints and servers, particularly user workstations'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n freq = count_by(parent_image -> mshta.exe) over 30d\n ALERT if prevalence(parent) < 1%\
      \ OR first_seen(parent)\n rate = count(mshta starts)/min per host; ALERT if rate > host_baseline_burst"
- question: Does a graph-plus-classifier model over process lineage flag the mshta process chain as rare
    or abnormal while suppressing benign LOLBin noise?
  context: 'Single parent-child rules miss multi-hop chains and produce noise; a lineage-aware model balances
    detection and precision. Train an XGBoost classifier over parent-child lineage and command-line features
    with chain aggregation (the ProblemChild approach) to flag rare or abnormal mshta process chains while
    suppressing benign LOLBin activity. Include the top-3 feature importances (e.g., rare parent, anomalous
    arguments, chain depth) in each alert for analyst triage. This catches stealthy execution where mshta
    sits deep in an unusual chain (for example office -> script host -> mshta -> network tool). A high
    anomaly score with a rare parent and odd arguments is a strong lead; a shallow, common chain is likely
    benign. Sources: [ProblemChild](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints and servers, particularly user workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n model = XGBoost(features=[parent_child_lineage, cmdline, chain_depth], aggregate=chain)\n\
      \ for chain containing mshta.exe: s = model.predict(chain)\n ALERT if s anomalous; emit top3_feature_importances"
- question: Does any mshta.exe command line contain long base64 ([A-Za-z0-9+/=]{50,}) or hexadecimal ([0-9a-fA-F]{50,})
    runs that indicate an embedded or encoded payload?
  context: 'Embedding the payload directly in the command line lets an adversary avoid dropping a file,
    a stealthy fileless technique. Scan mshta.exe command lines for long base64 or hex runs (50+ characters)
    that signal embedded payloads. This symbolic check is fast and precise for the common encodings used
    to smuggle scripts into mshta invocations. Correlate hits with parent process and any subsequent network
    or file activity to confirm execution. A long encoded blob in an mshta command line is highly suspicious
    and rarely benign; its absence does not rule out other obfuscation forms covered by the entropy and
    model-based methods. Sources: [LOLBAS](https://lolbas-project.github.io/lolbas/Binaries/Mshta/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints and servers with command-line logging'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n process=mshta.exe WHERE cmdline MATCHES /[A-Za-z0-9+\\/=]{50,}/ OR /[0-9a-fA-F]{50,}/\n\
      \ -> ALERT"
- question: Does an mshta.exe command line's Shannon entropy exceed the 95th percentile of a 30-day rolling
    baseline, indicating likely obfuscation?
  context: 'Obfuscated or encoded mshta payloads raise character entropy above what normal local-HTA invocations
    exhibit. Compare each mshta command line''s Shannon entropy to the 95th percentile of a 30-day rolling
    baseline and alert on exceedances, tuning the percentile from your own distribution to control false
    positives. This is a baseline-relative anomaly detector that catches encodings the fixed regexes miss
    while remaining adaptive to your environment. High entropy relative to your own mshta history strongly
    suggests embedded or obfuscated code intended to evade inspection; entropy within baseline reflects
    ordinary usage. Pair with length and token analysis for a fuller picture. Sources: [Elastic high command-line
    entropy](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints and servers with command-line logging'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n baseline = dist(shannon_entropy(cmdline)) for mshta over 30d\n ALERT if shannon_entropy(new_cmdline)\
      \ > p95(baseline)"
- question: When a language model or autoencoder scores mshta command lines, which novel invocations produce
    a high obfuscation score or reconstruction error, and what features drive the anomaly?
  context: 'Novel encodings defeat static rules and may not move entropy enough to trip a threshold; a
    learned representation of normal generalizes better. Train a command-line small language model (with
    command-aware tokenization) or an autoencoder on benign mshta command lines, then alert on high obfuscation
    score or high reconstruction error for novel encodings. Report the top-3 tokens or character-frequency
    features driving the anomaly so the analyst can judge and pivot. This catches creative obfuscation
    an adversary uses for stealth that signatures and percentile thresholds overlook. A high reconstruction
    error on an unfamiliar invocation is a strong lead; low error on routine local-HTA launches reduces
    concern. Sources: [command-line SLM](https://arxiv.org/html/2408.02637v1); [Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints and servers with command-line logging'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n model = command_SLM | autoencoder trained on benign mshta cmdlines\n for c in mshta_cmdlines:\
      \ err = model.reconstruction_error(c) or obf_score(c)\n ALERT if err high; emit top3_token_or_charfreq_features"
- question: Do mshta.exe network connections carry an anomalous or missing User-Agent (null/blank or lacking
    the expected 'Microsoft HTML Application host' string), or does mshta egress at all from a host that
    should not be browsing?
  context: 'Legitimate mshta HTTP traffic carries a characteristic User-Agent; missing or altered User-Agents,
    or any mshta egress from a host with no business reason to browse, expose covert C2. Link mshta.exe
    (EID 4688) to Zeek http.log flows and alert when user_agent is null/blank or lacks the expected ''Microsoft
    HTML Application host'' string, or when mshta initiates egress from a host that should not browse
    at all. Because the binary is trusted, the network signature and host role context distinguish abuse
    from benign use. An anomalous User-Agent or unexpected mshta egress is a strong stealth indicator
    worth correlating with destination reputation; expected User-Agents to known-good destinations reduce
    concern. Sources: [Splunk](https://research.splunk.com/endpoint/4aa5d062-e893-11eb-9eb2-acde48001122/);
    [LOLBAS](https://lolbas-project.github.io/lolbas/Binaries/Mshta/).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points, web proxies, and all enterprise endpoints'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n http.log where orig maps to mshta.exe (via EID 4688 host/time join)\n ALERT if user_agent\
      \ == \"\"/null OR user_agent NOT CONTAINS \"Microsoft HTML Application host\"\n OR host_role ==\
      \ no_browse_expected"
- question: Are mshta.exe connections using rare destination ports or rare JA3/JA3S TLS fingerprints (below
    1% prevalence, outside top 98% for non-80/443 ports), and what fraction of mshta connections per host
    are failing or being reset?
  context: 'Adversaries route mshta C2 over unusual ports or with distinctive TLS stacks, and failed/blocked
    connections reveal beaconing even when payloads do not land. Profile mshta connections for destination
    ports and JA3/JA3S hashes, flagging non-80/443 ports outside the top 98% and fingerprints with under
    1% prevalence. Add State physics by tracking the per-host fraction of failed/blocked/RST connections
    (Zeek conn_state S0/REJ/RSTO) for mshta as a distinct beacon-failure signal rather than discarding
    it as noise. Rare ports or fingerprints combined with elevated failure rates strongly suggest automated
    C2 from a trusted binary; common ports and fingerprints with normal success rates are likely benign.
    Sources: [Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/); [CISA/NSA](https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points, web proxies, and all enterprise endpoints'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n profile mshta dest_port, ja3, ja3s\n ALERT if (dest_port not in {80,443} AND port outside\
      \ top98%) OR prevalence(ja3|ja3s) < 1%\n state = frac(conn_state IN (S0,REJ,RSTO)) per host -> beacon_failure\
      \ signal"
- question: Do mshta.exe connections exhibit periodic 'heartbeat' beaconing (strong periodicity, low jitter,
    consistent byte volume) when analyzed with FFT or inter-arrival-delta methods, especially toward DGA-scored
    destinations?
  context: 'Automated C2 channels beacon at regular intervals; detecting that periodicity reveals mshta-based
    command-and-control even when each individual connection looks benign. Apply FFT or inter-arrival-delta
    analysis to Zeek conn.log per source-destination pair and alert on strong periodic signals (low jitter,
    consistent byte volume) indicative of automation, combining with the domain DGA score for mshta destinations
    for higher confidence. Surface the beacon period, jitter, and bytes-per-connection in the alert so
    the analyst can assess the pattern. A tight, low-jitter beacon to a high-DGA-score destination from
    mshta is a strong C2 indicator; sporadic, high-jitter, variable-volume traffic is more likely benign.
    Sources: [Splunk](https://research.splunk.com/endpoint/4aa5d062-e893-11eb-9eb2-acde48001122/); [GCNN-LSTM](https://arxiv.org/abs/2208.03445).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points, web proxies, and all enterprise endpoints'
  range: Last 90 days; analyze multi-day windows for periodicity
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n for (src,dst) where src process=mshta.exe:\n deltas = inter_arrival_times(conn.log);\
      \ spectrum = FFT(deltas)\n ALERT if strong_periodicity(spectrum) AND low_jitter AND consistent_bytes\n\
      \ combine with dga_score(dst); emit period, jitter, bytes_per_conn"
- question: Did mshta.exe execute an.hta or.sct file from a user-writable or non-standard directory such
    as \Temp\, \Downloads\, \AppData\, \Users\Public\, or an archive-extraction temp location?
  context: 'Legitimate HTAs typically live in fixed application or system paths; execution from user-writable
    or transient directories indicates a dropped or downloaded payload. Alert when mshta.exe command lines
    reference.hta/.sct paths matching \Temp\, \Downloads\, \AppData\, \Users\Public\, or archive-extraction
    temp locations, and confirm via Sysmon EID 11 file-create path, hash, and timing. These directories
    are where phishing payloads and downloaded scriptlets land, so mshta invoking them is a strong stealth-abuse
    signal. Correlate the file-create event timing with the process start to confirm a freshly written
    payload. Execution from a standard, controlled application path is far less concerning. Sources: [LOLBAS](https://lolbas-project.github.io/lolbas/Binaries/Mshta/);
    [SigmaHQ Office child](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_office_susp_child_processes/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints and servers; File servers hosting user profiles or public shares'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n process=mshta.exe WHERE cmdline MATCHES /(\\\\Temp\\\\|\\\\Downloads\\\\|\\\\AppData\\\
      \\|\\\\Users\\\\Public\\\\)/i AND cmdline MATCHES /\\.(hta|sct)/i\n JOIN Sysmon EID 11 ON path ->\
      \ confirm create time/hash -> ALERT"
- question: How rare is the directory from which mshta.exe executed an.hta file compared to 30-day path-prevalence
    history (never seen before or under 0.5%)?
  context: 'Statistical path rarity surfaces suspicious execution locations you did not explicitly denylist.
    Track 30-day.hta execution-directory frequencies and flag paths never seen before or representing
    under 0.5% of history, deriving the cutoff from your own path-prevalence distribution rather than
    a fixed value. This catches stealthy execution from unusual but not-explicitly-denylisted directories
    an adversary chooses to blend in. A first-seen or extremely rare execution directory for mshta is
    a strong anomaly to triage with file-create and parent context; a high-prevalence, well-known path
