name: 'T1218.005: System Binary Proxy Execution: Mshta'
id: ea318e3b-3b9a-4160-ac13-c8472530221d
description: 'This playbook helps an analyst investigate adversary abuse of the trusted Windows utility
  mshta.exe to proxy execution of malicious.hta files, VBScript, or JScript outside the Internet Explorer
  security context, bypassing application control and browser security settings. It guides triage across
  endpoint process-creation telemetry (command line, parent process, user, and path context) correlated
  with network and file telemetry to surface: mshta.exe contacting threat-intel-matched or statistically
  rare/DGA-like domains; command lines containing script protocol handlers (vbscript:, javascript:), GetObject
  remote retrieval,.sct/.hta references, or embedded base64/hex/data: payloads; mshta.exe spawned by anomalous
  parents such as Office applications, email clients, or browsers; command lines with abnormal length
  or entropy indicating obfuscation; mshta-initiated network connections with anomalous User-Agents, ports,
  JA3/JA3S fingerprints, or periodic beaconing; and.hta execution from user-writable or non-standard directories.
  Each line of inquiry offers symbolic-logic, statistical, and machine-learning approaches so the analyst
  can confirm or refute malicious mshta proxy execution used for stealth and defense evasion.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
