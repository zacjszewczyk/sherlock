    IP address targeting URIs on a public web server that contain sensitive keywords (e.g., ''orgchart'',
    ''directory'', ''internal'', ''hr-policy'') or file extensions indicative of bulk information gathering
    (e.g., ''.pdf'', ''.docx'', ''.xlsx'', ''.csv''). This Statistical Method approach works as follows:
    Profile each external client with multi-model HTTP anomaly detection — request count and access frequency,
    inter-request time, URI-path length (Chebyshev bound), and character distribution (chi-square) — and
    flag clients deviating from the learned baseline Anomaly Detection of Web-based Attacks, Kruegel and
    Vigna; treat an elevated 404/403 response ratio (failed fetches during fuzzing) as a distinct State
    signal and retain URI-path Shannon-entropy flagging at >3σ above the per-IP mean. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable organizational reconnaissance
    against your environment; pivot to the external source IP/ASN and its reputation, the targeted hosts,
    URIs, domains, or DNS records, the request volume, cadence, and failure ratio, and any correlated
    follow-on activity such as phishing or initial-access attempts. A negative result helps rule out this
    particular reconnaissance vector but should be corroborated with the other questions in this playbook,
