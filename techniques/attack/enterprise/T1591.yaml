- question: '[Reconnaissance] Web request anomaly models: Can you determine whether one or more HTTP/S
    GET requests are received from an external IP address targeting URIs on a public web server that contain
    sensitive keywords (e.g., ''orgchart'', ''directory'', ''internal'', ''hr-policy'') or file extensions
