questions:
- question: '[Reconnaissance] Threat intel connection matches: Can you determine whether a network connection
    is established to or from an external IP address or domain that is present on a high-confidence threat
    intelligence feed categorized as reconnaissance, scanning, or known adversary command and control
    infrastructure. -- specifically, using the ''Threat intel connection matches'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), the adversary is trying to gather
    information they can use to plan future operations. For Gather Victim Org Information (T1591), adversaries
    gather details about the victim organization -- divisions/departments, business operations, key personnel
    roles, and internet-facing assets -- to plan phishing, initial access, or further reconnaissance.
    This evidence focuses on the condition that a network connection is established to or from an external
    IP address or domain that is present on a high-confidence threat intelligence feed categorized as
    reconnaissance, scanning, or known adversary command and control infrastructure. This Symbolic Logic
    approach works as follows: Continuously correlate Zeek conn.log/dns.log source and destination IPs
    and domains against threat-intel feeds tagged scanner/reconnaissance/C2, but weight each match by
    feed confidence and indicator recency rather than treating all feeds equally, because feeds have low
    mutual overlap and varying false-positive rates and freshness Reading the Tea Leaves: A Comparative
    Analysis of Threat Intelligence, Li et al.; express the deterministic match logic as Sigma/SIEM rules
    over first-party logs so detection does not depend on a live external API lookup SigmaHQ: Generic
    Signature Format for SIEM Systems. A positive result -- a rule match, statistical outlier, or model
    alert -- indicates probable organizational reconnaissance against your environment; pivot to the external
    source IP/ASN and its reputation, the targeted hosts, URIs, domains, or DNS records, the request volume,
    cadence, and failure ratio, and any correlated follow-on activity such as phishing or initial-access
    attempts. A negative result helps rule out this particular reconnaissance vector but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, distributed,
    or out-of-band information gathering that occurs outside your visibility. Sources: [Reading the Tea
    Leaves: A Comparative Analysis of Threat Intelligence, Li et al.](https://www.usenix.org/system/files/sec19fall-li_prepub.pdf);
    [SigmaHQ: Generic Signature Format for SIEM Systems](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet gateway, Perimeter firewalls, Cloud VPC flow logs, DNS resolvers'
  range: Last 90 days (correlate event-centered windows of +/- 5 minutes around the activity)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Threat intel connection matches (Symbolic Logic)

      source IN [Zeek conn.log, Zeek dns.log]

      | approach: Continuously correlate Zeek conn.log/dns.log source and destination IPs and domains
      against threat-intel feeds tagged scanner/reconnaissance/C2, but weight each match by feed confidence
      and indicator recency rather than treating all feeds equally, because feeds have low mutual overlap
      and varying false-positive rates and freshness Reading the Tea Leaves: A Comparative Analysis of
      Threat Intelligence, Li et al.;

      | correlate over NAI: Internet gateway, Perimeter firewalls, Cloud VPC flow logs, DNS resolvers

      | emit alert with contributing fields and entity context (source IP/ASN, dest host/URI/domain, request
      volume, cadence, failure ratio)


      | sources: [Reading the Tea Leaves: A Comparative Analysis of Threat Intelligence, Li et al.](https://www.usenix.org/system/files/sec19fall-li_prepub.pdf);
      [SigmaHQ: Generic Signature Format for SIEM Systems](https://github.com/SigmaHQ/sigma)'
  - technology: Zeek/pseudocode
    query: '# Threat intel connection matches (Zeek view)

      watch Zeek conn.log, Zeek dns.log for external-source reconnaissance behavior

      | group by source IP / ASN over rolling windows

      | evaluate distinct destinations, URIs/queries, response codes, and failure (RST/404/NXDOMAIN) ratios

      | emit candidate recon sources with volume, cadence, and targets'
- question: '[Reconnaissance] IOC interaction ratio outliers: Can you determine whether a network connection
    is established to or from an external IP address or domain that is present on a high-confidence threat
    intelligence feed categorized as reconnaissance, scanning, or known adversary command and control
    infrastructure. -- specifically, using the ''IOC interaction ratio outliers'' (Statistical Method)
    approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), the adversary is trying to gather
    information they can use to plan future operations. For Gather Victim Org Information (T1591), adversaries
    gather details about the victim organization -- divisions/departments, business operations, key personnel
    roles, and internet-facing assets -- to plan phishing, initial access, or further reconnaissance.
    This evidence focuses on the condition that a network connection is established to or from an external
    IP address or domain that is present on a high-confidence threat intelligence feed categorized as
    reconnaissance, scanning, or known adversary command and control infrastructure. This Statistical
    Method approach works as follows: Compute the 24-hour ratio of IOC-flagged connections to total connections
    per external IP and flag sources above the 95th percentile; corroborate with scan-aggressiveness baselines
    (ports targeted, distinct hosts touched, scan cadence) since a small number of sources generate most
    reconnaissance volume An Internet-Wide View of Internet-Wide Scanning, Durumeric et al.. Profile the
    failed/blocked connection ratio of flagged sources as a distinct signal. A positive result -- a rule
    match, statistical outlier, or model alert -- indicates probable organizational reconnaissance against
    your environment; pivot to the external source IP/ASN and its reputation, the targeted hosts, URIs,
    domains, or DNS records, the request volume, cadence, and failure ratio, and any correlated follow-on
    activity such as phishing or initial-access attempts. A negative result helps rule out this particular
    reconnaissance vector but should be corroborated with the other questions in this playbook, since
    a single method can miss low-and-slow, distributed, or out-of-band information gathering that occurs
    outside your visibility. Sources: [An Internet-Wide View of Internet-Wide Scanning, Durumeric et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf).'
