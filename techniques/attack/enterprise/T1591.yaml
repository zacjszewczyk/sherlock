name: 'T1591: Gather Victim Org Information'
id: 0ecec27f-6079-4691-9d6c-664e7da5b9ee
description: 'This playbook helps an analyst investigate whether a sophisticated external actor, a routine
  threat actor, or commodity tooling is gathering information about your organization to support future
  targeting (MITRE ATT&CK T1591, Gather Victim Org Information). Adversaries collect organizational details
  -- division and department names, business operations, key-employee roles, and exposed internet-facing
  assets -- via direct elicitation, scraping of public web servers, DNS reconnaissance, and active scanning,
  then use what they learn to plan phishing, initial access, or deeper reconnaissance. Because much of
  this activity is high-volume, noisy, and may occur outside the target''s visibility, the hunt focuses
  on perimeter and edge telemetry and pursues the behavior from several complementary angles: connections
  to or from threat-intel-flagged reconnaissance/scanner/C2 infrastructure; HTTP requests for sensitive
  keywords and bulk documents on public web servers; reconnaissance-tool user agents and AXFR/ANY DNS
  queries; horizontal and vertical port scans; NXDOMAIN/SRV/MX query floods indicating subdomain and host
  enumeration; and external access to URIs that are normally internal-only. Detection methods combine
  deterministic symbolic-logic rules (threat-intel correlation, Sigma/WAF regex, scan and NXDOMAIN thresholds,
  admin allow-lists), statistical baselining (IOC-interaction ratios, HTTP anomaly models, rare-user-agent
  detection, sequential hypothesis testing, NXDOMAIN ratio/entropy spikes, URI publicity scoring), and
  machine learning (random-forest reconnaissance classifiers, crawler/scraper session clustering, ARIMA/LSTM
  DNS forecasting, online autoencoders and DBSCAN scan clustering, and one-class session-anomaly models),
  applied across Zeek conn/dns/http logs so the analyst can corroborate suspected reconnaissance against
  source reputation, request volume, cadence, failure ratios, and targeted assets.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
