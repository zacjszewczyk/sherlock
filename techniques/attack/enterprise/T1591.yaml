  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), the adversary is trying to gather
    information they can use to plan future operations. For Gather Victim Org Information (T1591), adversaries
    gather details about the victim organization -- divisions/departments, business operations, key personnel
