questions:
- question: 'Using deterministic rule logic (Threat intel JA3 and Malleable-C2 signature watchlist), can
    you identify non-standard-encoding C2 activity? Specifically: Ingest a feed of known-malicious JA3/JA3S
    hashes plus the regex URI/header/Cookie signatures that survive Cobalt Strike Malleable C2 customization
    (prepend/append junk, fake headers, base64url/netbios/mask transforms) and alert on exact matches
    in Zeek ssl.log/http.log [Detecting Popular Cobalt Strike Malleable C2 Profile Techniques, Unit 42](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/).'
  context: 'Tactic context (Command and Control / TA0011): the adversary communicates with compromised
    systems while mimicking normal traffic; non-standard encoding hides C2 content from content inspection.
    Evidence under investigation: A JA3/JA3S hash or a combination of HTTP headers observed in network
    traffic exactly matches a threat intelligence feed identifying C2 frameworks known to use non-standard
    encoding or custom alphabets. Approach (Threat intel JA3 and Malleable-C2 signature watchlist): Ingest
    a feed of known-malicious JA3/JA3S hashes plus the regex URI/header/Cookie signatures that survive
    Cobalt Strike Malleable C2 customization (prepend/append junk, fake headers, base64url/netbios/mask
    transforms) and alert on exact matches in Zeek ssl.log/http.log [Detecting Popular Cobalt Strike Malleable
    C2 Profile Techniques, Unit 42](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/).
    This deterministic approach matches known-bad signatures or hard logical conditions, so a hit is high-confidence
    but evasion is possible if the adversary changes the custom alphabet or header set. A positive result
    indicates traffic or a process exhibiting non-standard encoding consistent with covert C2; a negative
    result means the observed activity matches expected baselines and known-good behavior. Investigate
    the named area of interest (Internet gateways, Web proxies, TLS-terminating load balancers) and pivot
    from any hit to the originating host, process, account, destination, and any related beaconing, staging,
    or exfiltration.'
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - 'NAI: Internet gateways, Web proxies, TLS-terminating load balancers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Threat-intel JA3/Malleable-C2 watchlist match\nMATCH ssl.log s JOIN http.log h ON s.uid=h.uid\n\
      WHERE s.ja3 IN ti_ja3_watchlist OR s.ja3s IN ti_ja3s_watchlist\n   OR h.uri MATCHES ti_malleable_uri_regex\n\
      \   OR h.user_agent IN ti_ua_watchlist\n   OR any(h.headers) MATCHES ti_fake_header_regex\nALERT\
      \ severity=high, enrich=ti_source"
- question: 'Using statistical baselining (Low-frequency JA3/User-Agent rarity scoring), can you detect
    non-standard-encoding C2 activity that deviates from normal? Specifically: Daily compute JA3/JA3S
    and User-Agent population frequencies and external-destination rarity from Zeek logs (CV of inter-arrival,
    count of distinct internal hosts), escalating fingerprints seen on <5 hosts that drive persistent
    periodic beaconing [RITA, Active Countermeasures](https://github.com/activecm/rita). Tune the host-count
    and beacon-CV thresholds from a 30-day baseline.'
  context: 'Tactic context (Command and Control / TA0011): the adversary communicates with compromised
    systems while mimicking normal traffic; non-standard encoding hides C2 content from content inspection.
    Evidence under investigation: A JA3/JA3S hash or a combination of HTTP headers observed in network
