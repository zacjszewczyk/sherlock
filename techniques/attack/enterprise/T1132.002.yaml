  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - 'NAI: Internet gateways, Web proxies, TLS-terminating load balancers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Daily JA3/User-Agent rarity + beacon scoring\nFOR each (ja3, user_agent) OVER last 1d:\n\
      \  host_count = distinct(internal_src_ip)\n  beacon_cv  = stddev(inter_arrival)/mean(inter_arrival)\n\
      BASELINE 30d host_count, beacon_cv\nALERT WHERE host_count < 5 AND beacon_cv < beacon_cv_threshold"
