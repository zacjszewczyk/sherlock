    encoding or custom alphabets. Approach (Low-frequency JA3/User-Agent rarity scoring): Daily compute
    JA3/JA3S and User-Agent population frequencies and external-destination rarity from Zeek logs (CV
    of inter-arrival, count of distinct internal hosts), escalating fingerprints seen on <5 hosts that
