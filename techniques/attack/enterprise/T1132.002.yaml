  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Internal DNS resolvers, Web proxies, Egress firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
