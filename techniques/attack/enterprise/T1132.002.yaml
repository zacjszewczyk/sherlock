name: 'T1132.002: Non-Standard Encoding'
id: ebc3e0c2-947a-4eeb-8b74-54eac8655c04
description: 'This playbook helps an analyst investigate whether an adversary is using Non-Standard Encoding
  (T1132.002) to obscure command-and-control (C2) traffic — encoding C2 data with custom or modified alphabets
  (e.g., a modified Base64/base64url, base-N, NetBIOS, XOR, or character-translation scheme) that diverges
  from standard protocol specifications to evade content inspection. It correlates host telemetry (Windows
  4688/Sysmon process creation, PowerShell script blocks, auditd execve, macOS EndpointSecurity, ESXi
  shell/hostd) showing construction of custom translation tables or emission of long high-entropy tokens
  that fail standard Base64/Hex validation, with network telemetry (Zeek conn.log/http.log/dns.log/ssl.log,
  NSM flow, PF/NSX logs) revealing the resulting covert channel. Investigative angles include: JA3/JA3S
  and Malleable-C2 header/URI signature matching against threat intel; rarity scoring of fingerprints
  and User-Agents; high-entropy, fixed-length DNS subdomains and NXDOMAIN bursts; non-standard custom
  HTTP headers carrying encoded tokens; anomalous bytes-out:bytes-in ratios per port/protocol; Shannon-entropy/KL-divergence
  outliers in protocol fields; and correlation of suspicious processes (running from %TEMP%/%APPDATA%
  or off the allowlist) to anomalous egress. Detection blends symbolic-logic rules, statistical baselining
  (percentiles, entropy, KL divergence, forecasting), and machine learning (clustering, Isolation Forest,
  One-Class SVM, CNN/Random Forest classifiers, Gradient Boosting) to produce evasion-resistant, explainable
  alerts for the Command and Control tactic.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
