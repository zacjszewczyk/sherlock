  queries:
  - technology: SIEM/Rule pseudocode
    query: "search EventID IN (4688,1) OR (Channel=PowerShell EventID=4104)\n| where Image IN ('wevtutil.exe','auditpol.exe','sc.exe','powershell.exe')\n\
      \  OR CommandLine MATCHES /Stop-Service|Set-Service.*Stopped.*EventLog|Clear-EventLog/\n| match\
      \ Image,Hashes,Signer,CommandLine against SigmaHQ disable-eventlog patterns\n| enrich parent_lineage,\
      \ user_context\n| where user NOT IN approved_logging_admins AND time NOT IN maintenance_window\n\
      | alert"
- question: '[Defense Impairment] Rare process prevalence scoring: Can you determine whether execution
    of a process where the process name, file hash, signer, or command-line arguments indicate use of
    native Windows log-management utilities or scripts that can stop the EventLog service, clear audit
    policy, or alter EventLog and Autologger registry keys. The strongest evidence ties the execution
    to an unusual administrative context and to subsequent log gaps or service-state changes on the same
    host. -- specifically, using the ''Rare process prevalence scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the adversary disables or
    manipulates Windows Event Logging so defenders cannot see or trust what is happening on the host;
    every silenced channel, cleared log, or suppressed audit policy is a deliberate attempt to operate
    while leaving less evidence of compromise behind. This evidence focuses on the condition that Execution
    of a process where the process name, file hash, signer, or command-line arguments indicate use of
    native Windows log-management utilities or scripts that can stop the EventLog service, clear audit
    policy, or alter EventLog and Autologger registry keys. The strongest evidence ties the execution
    to an unusual administrative context and to subsequent log gaps or service-state changes on the same
    host. This Statistical Method approach works as follows: Calculate per-process and per-command-line
    prevalence over a rolling 30-day window and flag executions whose prevalence falls below 0.1 percent
    and whose parent is a common scripting or remote-admin engine (powershell.exe, wmiprvse.exe, cmd.exe).
    Derive the 0.1 percent floor and per-(user,host) admin-utility execution baselines from your own corpus
    using the k-sigma method of [Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf),
    recomputing monthly; realistic per-host baselines are available in the [Unified Host and Network Data
    Set](https://arxiv.org/abs/1708.07518). Track State explicitly by counting successful versus failed/blocked
    service-control attempts. A positive result -- a rule match, statistical outlier, or model alert --
    is a strong sign that logging was intentionally impaired; pivot to the responsible host and user,
    the offending process and its parent lineage and command line, the affected channels and registry
    keys, the timing relative to maintenance windows, and any surrounding activity (remote logon, recon,
    outbound C2) to scope the intrusion. A negative result helps rule out this particular indicator but
    should be corroborated with the other questions in this playbook, since a sophisticated actor may
    combine subtle tampering techniques or evade any single detection method; treat sustained telemetry
    silence itself as a failure-mode signal worth investigating.'
