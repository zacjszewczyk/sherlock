questions:
- question: '[Defense Impairment] Native log-management utility correlation: Can you determine whether
    execution of a process where the process name, file hash, signer, or command-line arguments indicate
    use of native Windows log-management utilities or scripts that can stop the EventLog service, clear
    audit policy, or alter EventLog and Autologger registry keys. The strongest evidence ties the execution
    to an unusual administrative context and to subsequent log gaps or service-state changes on the same
    host. -- specifically, using the ''Native log-management utility correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the adversary disables or
    manipulates Windows Event Logging so defenders cannot see or trust what is happening on the host;
    every silenced channel, cleared log, or suppressed audit policy is a deliberate attempt to operate
    while leaving less evidence of compromise behind. This evidence focuses on the condition that Execution
    of a process where the process name, file hash, signer, or command-line arguments indicate use of
    native Windows log-management utilities or scripts that can stop the EventLog service, clear audit
    policy, or alter EventLog and Autologger registry keys. The strongest evidence ties the execution
    to an unusual administrative context and to subsequent log gaps or service-state changes on the same
    host. This Symbolic Logic approach works as follows: Monitor Windows Event ID 4688, Sysmon Event ID
    1, and PowerShell Event ID 4104 for `wevtutil`, `auditpol`, `sc.exe`, `Stop-Service`/`Set-Service
    -Status Stopped EventLog`, or PowerShell `Clear-EventLog` invocations that disable logging, clear
    audit policy, or alter EventLog and Autologger keys, matching image name, hash, signer, and command
    line against the enumerated patterns in the [SigmaHQ Disable Windows Event Logging rule family](https://github.com/SigmaHQ/sigma).
    Capture command line, hashes, and parent lineage using a baseline such as the [SwiftOnSecurity Sysmon
    configuration](https://github.com/SwiftOnSecurity/sysmon-config) and alert when the execution context
    is not consistent with an approved logging-administration account or maintenance window. A positive
    result -- a rule match, statistical outlier, or model alert -- is a strong sign that logging was intentionally
    impaired; pivot to the responsible host and user, the offending process and its parent lineage and
    command line, the affected channels and registry keys, the timing relative to maintenance windows,
    and any surrounding activity (remote logon, recon, outbound C2) to scope the intrusion. A negative
    result helps rule out this particular indicator but should be corroborated with the other questions
    in this playbook, since a sophisticated actor may combine subtle tampering techniques or evade any
    single detection method; treat sustained telemetry silence itself as a failure-mode signal worth investigating.'
