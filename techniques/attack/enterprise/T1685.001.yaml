name: 'T1685.001: Disable or Modify Tools: Disable or Modify Windows Event Log'
id: 948abe23-99e6-4b8a-a111-406e6f191e61
description: 'This playbook helps an analyst investigate whether an adversary has attempted to evade defenses
  by disabling, tampering with, or manipulating Windows Event Logging (MITRE ATT&CK T1685.001, Disable
  or Modify Tools: Disable or Modify Windows Event Log). Adversaries silence Windows logging to limit
  the telemetry available for detection and audit -- stopping or disabling the EventLog service, modifying
  EventLog and Autologger registry keys, clearing or resetting channels with wevtutil.exe or Clear-EventLog,
  and disabling audit categories with auditpol.exe. The hunt pursues this behavior from several complementary
  angles: execution of native log-management utilities (wevtutil, auditpol, sc.exe, Stop-Service/Set-Service,
  Clear-EventLog) with suspicious command lines and parent lineage; registry edits that suppress future
  log collection; log-clearing and audit-policy-change events (1102, 104, 4719, 7035/7040); sustained
  telemetry gaps and statistically significant volume drops at the central aggregator without a matching
  shutdown or maintenance window; gaps in the sequential EventRecordID stream; and temporal chains that
  combine unsigned process execution, log tampering, and outbound connections to rare or low-reputation
  destinations. Detection methods combine deterministic symbolic-logic correlation (command-line and registry
  rules cross-referenced with clearing/audit-policy events), statistical baselining (rare-process prevalence,
  k-sigma utility-usage and entropy scoring, log-volume change-point detection, EventRecordID gap Z-scores,
  weighted chain scoring), and machine learning (log-tampering classifiers, sequence/HMM/RNN and DeepLog
  modeling, forecast-based volume loss detection, and provenance-graph learners such as KAIROS and ThreaTrace),
  applied across Windows Security/System events, Sysmon, PowerShell logging, SIEM ingestion metrics, and
  Zeek conn.log, so the analyst can distinguish deliberate log impairment from benign administration and
  scope the surrounding intrusion.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
