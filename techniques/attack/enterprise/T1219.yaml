questions:
- question: '[Command and Control] Match RAT infrastructure to TI and RMM catalog: Can you determine whether
    a network connection is established from an internal asset to an external IP address, domain, or SSL
    certificate subject known to be associated with Remote Access Software command and control infrastructure.
    -- specifically, using the ''Match RAT infrastructure to TI and RMM catalog'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary installs or
    abuses legitimate remote access / RMM software to create a redundant, interactive command-and-control
    channel that blends in with sanctioned IT-admin activity, leaving traces in process-execution, persistence,
    and network telemetry. This evidence focuses on the condition that a network connection is established
    from an internal asset to an external IP address, domain, or SSL certificate subject known to be associated
    with Remote Access Software command and control infrastructure. This Symbolic Logic approach looks
    for the following signal: Continuously match outbound connection logs against (a) a threat-intel feed
    of known malicious Remote Access/RMM C2 indicators and (b) the curated RMM catalog of default C2 domains/SNI,
    IPs, and default ports from [LOLRMM](https://lolrmm.io/) and [CISA AA23-025A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-025a)
    (e.g., myhelpcare[.]online/.cc). Alert on any match in Zeek conn.log destination IPs, Zeek dns.log
    queried domains, or Zeek ssl.log SNI that resolves to an RMM tool NOT on the organization''s approved-RMM
    allowlist. A positive result -- a rule match, statistical outlier, or model alert -- suggests an RMM/RAT
    instance on the host is operating outside the organization''s approved-RMM allowlist and normal administrative
    behavior; pivot to the responsible process, its parent lineage, the user/host context, any persistence
    artifacts, and the external destination/infrastructure involved. A negative result helps rule out
    this RAT-abuse vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or living-off-the-land remote access.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match RAT infrastructure to TI and RMM catalog

      source IN [Zeek conn.log, Zeek dns.log, Zeek ssl.log]

      | WHERE matches_action_criteria("Match RAT infrastructure to TI and RMM catalog")

      // Continuously match outbound connection logs against (a) a threat-intel feed of known malicious
      Remote Access/R

      | ALERT enrich(host, user, process, parent, dest, infra)'
