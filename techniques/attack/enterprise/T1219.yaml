    from an atypical path (e.g., C:\Users\...\AppData\, C:\Windows\Temp\), by an unusual parent process
    (e.g., winword.exe, chrome.exe), or with a filename that impersonates a standard Windows binary. --
    specifically, using the ''Track rare parent-child paths'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary installs or
    abuses legitimate remote access / RMM software to create a redundant, interactive command-and-control
    channel that blends in with sanctioned IT-admin activity, leaving traces in process-execution, persistence,
    and network telemetry. This evidence focuses on the condition that a process execution event (Windows
    Event ID 4688) shows a known remote access tool executable being launched from an atypical path (e.g.,
    C:\Users\...\AppData\, C:\Windows\Temp\), by an unusual parent process (e.g., winword.exe, chrome.exe),
    or with a filename that impersonates a standard Windows binary. This Statistical Method approach looks
    for the following signal: Maintain a statistical model of parent-child process relationships across
    all 4688 events. Alert when a remote access tool is launched by a parent whose co-occurrence probability
    is below a threshold (e.g., <0.01%). Additionally, compute Shannon entropy of executing-process file
    paths and alert when a process in a common system directory has anomalously high entropy, indicating
    a randomly named payload. A positive result -- a rule match, statistical outlier, or model alert --
    suggests an RMM/RAT instance on the host is operating outside the organization''s approved-RMM allowlist
    and normal administrative behavior; pivot to the responsible process, its parent lineage, the user/host
    context, any persistence artifacts, and the external destination/infrastructure involved. A negative
    result helps rule out this RAT-abuse vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land remote
    access.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoint devices (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Track rare parent-child paths

      source IN [Windows Event ID 4688]

      | STATS baseline(metric) BY host, destination_service OVER last_30d

      // Maintain a statistical model of parent-child process relationships across all 4688 events. Alert
      when a remote

      | WHERE observed > p99(baseline) OR deviation > threshold

      | ALERT enrich(host, user, dest, metric)'
