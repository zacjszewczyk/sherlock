- question: '[Command and Control] Spot typosquat SNI patterns: Can you determine whether a network connection
    is established from an internal asset to an external IP address, domain, or SSL certificate subject
    known to be associated with Remote Access Software command and control infrastructure. -- specifically,
    using the ''Spot typosquat SNI patterns'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary installs or
    abuses legitimate remote access / RMM software to create a redundant, interactive command-and-control
    channel that blends in with sanctioned IT-admin activity, leaving traces in process-execution, persistence,
    and network telemetry. This evidence focuses on the condition that a network connection is established
    from an internal asset to an external IP address, domain, or SSL certificate subject known to be associated
    with Remote Access Software command and control infrastructure. This Statistical Method approach looks
    for the following signal: For all outbound TLS connections, calculate the Levenshtein distance between
    the observed SNI in Zeek ssl.log and a known-good list of legitimate remote access service domains.
    Alert on domains with a low distance (e.g., 1 or 2) to a legitimate domain but which are not an exact
    match, indicating potential typosquatting (the phishing/typosquat delivery pattern documented in [CISA
    AA23-025A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-025a)). A positive result
    -- a rule match, statistical outlier, or model alert -- suggests an RMM/RAT instance on the host is
    operating outside the organization''s approved-RMM allowlist and normal administrative behavior; pivot
    to the responsible process, its parent lineage, the user/host context, any persistence artifacts,
    and the external destination/infrastructure involved. A negative result helps rule out this RAT-abuse
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land remote access.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "# Spot typosquat SNI patterns\nsource IN [Zeek conn.log, Zeek dns.log, Zeek ssl.log]\n| STATS\
      \ baseline(metric) BY host, destination_service OVER last_30d\n// For all outbound TLS connections,\
      \ calculate the Levenshtein distance between the observed SNI in Zeek ssl.log \n| WHERE observed\
      \ > p99(baseline) OR deviation > threshold\n| ALERT enrich(host, user, dest, metric)"
