name: 'T1219: Remote Access Tools'
id: 79cfe2d8-cee1-4b34-8dfc-a81399177cf1
description: 'This playbook helps an analyst investigate whether an adversary is abusing legitimate remote
  access tools (RATs) / remote monitoring and management (RMM) software -- such as AnyDesk, TeamViewer,
  ScreenConnect/ConnectWise Control, Atera, and similar agents -- to establish an interactive command-and-control
  channel within the network as part of the Command and Control tactic. It guides the hunt across the
  full behavior chain documented in MITRE DET0496 and CISA AA23-025A, spanning Windows, Linux, and macOS:
  outbound network connections to known RMM/RAT C2 infrastructure matched against threat intelligence
  and the LOLRMM catalog (Zeek conn/dns/ssl logs, JA4/JA4X TLS client fingerprints, typosquatted SNI,
  DNS failure bursts, and DGA-classified domains); installation-to-persistence correlation where an RMM
  executable run with silent/unattended flags is quickly followed by service creation (Event ID 7045)
  or Run-key modification (Event ID 4657); portable RMM binaries executed from user-writable paths without
  an installer; RMM tools launched from atypical paths, by unusual parents (Office apps, browsers, script
  interpreters), or with masqueraded PE metadata; egress-volume and beaconing anomalies (volume/ratio/connection-state
  outliers, FFT/CV cadence analysis, and jitter-robust HMM/LSTM/Isolation-Forest models); and the phishing-to-RMM
  delivery chain where an Office app spawns a script interpreter that downloads and executes an RMM tool
  within a tight time window. Detection methods combine symbolic-logic rules, statistical baselining,
  and machine-learning models applied to Windows Security/Sysmon events, auditd, macOS unified/osquery
  logs, and Zeek network telemetry, so the analyst can corroborate suspected RAT abuse against infrastructure
  reputation, process lineage, persistence, and traffic cadence.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
