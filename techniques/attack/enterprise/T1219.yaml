    behavior; pivot to the responsible process, its parent lineage, the user/host context, any persistence
    artifacts, and the external destination/infrastructure involved. A negative result helps rule out
    this RAT-abuse vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or living-off-the-land remote access.'
