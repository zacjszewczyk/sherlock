questions:
- question: '[Lateral Movement] Match NTLM logons to watchlists: Can you determine whether a successful
    NTLM network logon (Windows Event ID 4624, LogonType 3) involves a source or destination IP address
    that is present on a threat intelligence feed or an internal watchlist of known malicious or compromised
    hosts. -- specifically, using the ''Match NTLM logons to watchlists'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), the mission question is "Is
    the adversary bypassing authentication mechanisms using stolen hashes?" Pass the Hash (and overpass-the-hash)
    lets an adversary authenticate with a stolen NTLM hash instead of a cleartext password, bypassing
    interactive credential entry and enabling stealthy lateral movement with valid-but-stolen credentials;
    catching it early limits how far an intruder can pivot toward sensitive systems and data. This evidence
    focuses on the condition that a successful NTLM network logon (Windows Event ID 4624, LogonType 3)
    involves a source or destination IP address that is present on a threat intelligence feed or an internal
    watchlist of known malicious or compromised hosts. This Symbolic Logic approach works as follows:
    Join source/destination IPs from all NTLM LogonType 3 events (Event ID 4624, AuthenticationPackageName=NTLM,
    target not ''ANONYMOUS LOGON'') against TI and internal-IR watchlists; exact match raises high-severity
    alert. Anchor on the canonical PtH signature (Type 3 + NTLM + local/non-domain account) from [CAR-2016-04-004](https://car.mitre.org/analytics/CAR-2016-04-004/).
    State metric: separately flag whether the logon SUCCEEDED (4624) vs FAILED (4625) against a watchlisted
    IP - repeated failures then a success indicate hash spraying. Enrich with Zeek conn.log to confirm
    SMB/445 or 135 byte volume. A positive result -- a rule match, statistical outlier, or model alert
    -- is consistent with hash-based authentication rather than legitimate, interactive credential use;
    pivot to the source and destination hosts, the acting account and its privilege level, the authentication
    package and logon type, any preceding failed logons (4625), and the downstream process/service/ticket
    activity to confirm or refute pass-the-hash. A negative result helps rule out this vector on the inspected
    telemetry but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land hash reuse.'
