name: 'T1550.002: Use Alternate Authentication Material: Pass the Hash'
id: 5edf82cb-fd4a-4869-915d-7f3585c9000c
description: 'This playbook helps an analyst investigate whether an adversary is using stolen NTLM password
  hashes to authenticate as a user without the cleartext password (Pass the Hash, T1550.002) to move laterally
  and bypass normal access controls, including the ''overpass the hash'' variant where a hash is used
  to mint a Kerberos TGT. It centers on Windows NTLM network logons (Event ID 4624, LogonType 3) and correlates
  them with downstream behaviors to surface hash-based authentication that lacks an accompanying interactive
  logon or domain credential entry. Across ten evidence angles it guides the hunt for: NTLM logons involving
  threat-intel/watchlisted source or destination IPs; service or process creation (7045/4688/Sysmon 1)
  shortly after a network logon with high-entropy or known tool names (PSEXESVC, PAExec, remcom, Impacket/Mimikatz);
  NTLM logons from hosts with no recent interactive (Type 2/10) logon by the same user; machine-account
  (''$'') NTLM logons from non-approved sources; first-seen user source->destination logon edges; NTLM
  logons into high-value assets from unauthorized sources; remote service/scheduled-task/process execution
  chains following a logon (PsExec/WMI patterns); fan-out logons to many unique destinations in a short
  window; multi-hop logon chains that violate network segmentation; and NTLM logons immediately followed
  by Kerberos TGT/service-ticket requests (the overpass-the-hash signature). Detection methods combine
  symbolic-logic rules (watchlist joins, post-logon correlation, allow-list and segmentation checks, first-seen
  edges, fan-out thresholds), statistical baselining (reputation/criticality risk scoring, entropy and
  time-delta outliers, interactive-vs-network ratios, MAD/percentile rarity, Bayesian new-edge scoring,
  change-point and graph statistics), and machine learning (supervised classifiers with SHAP, LSTM/DeepLog
  sequence models, DBSCAN/one-class anomaly detection, graph link prediction and embeddings, forecasting),
  applied to Windows Security and Sysmon events (4624/4625/4648/4688/4698/4768/4769/7045, Sysmon 1/3/22)
  and Zeek telemetry (conn.log, dce_rpc.log, smb_files.log) so the analyst can confirm suspected pass-the-hash
  activity against authentication context, host criticality, account privilege, and downstream lateral
  execution.'
