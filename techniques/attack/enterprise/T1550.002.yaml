      NTLM logons to watchlists")

      // Join source/destination IPs from all NTLM LogonType 3 events (Event ID 4624, AuthenticationPackageName=NTLM,
      t

      | CORRELATE/JOIN per action criteria | ALERT enrich(src_host, dst_host, user, logon_type, auth_pkg,
