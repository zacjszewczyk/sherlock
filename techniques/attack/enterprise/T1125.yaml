questions:
- question: Did any process execute whose image name, code signer, or file hash matches a known video-capture
    malware family (e.g., FruitFly, Proton), especially when paired with unusual parentage or the loading
    of camera-capture libraries?
  context: 'This is the highest-fidelity Collection signal: a direct match between an executed process
    and curated threat intelligence for T1125 families. Query process creations (Windows 4688, Sysmon
    1), enrich each with host, user, and Authenticode signature metadata, and join the image path/hash
    against a maintained intel feed for video-capture malware. Reinforce with a deterministic Sysmon 7
    module-load check for camera-capture DLLs (avicap32.dll, mf.dll, mfcore.dll, ksproxy.ax) loaded by
    non-allowlisted images. A hit strongly indicates active or attempted webcam collection against a high-value
    user; a clean result reduces but does not eliminate suspicion since novel tooling will not match known
    indicators.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: User workstations and laptops, particularly those assigned to executives, developers, and system
    administrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=endpoint (EventCode=4688 OR (source=Sysmon EventCode=1))

      | eval img=lower(Image), h=coalesce(Hashes,SHA256)

      | lookup ti_t1125 image AS img OUTPUT family

      | where isnotnull(family) OR h IN (ti_t1125_hashes)

      | join host ProcessGuid [search source=Sysmon EventCode=7 ImageLoaded IN ("*avicap32.dll","*mf.dll","*mfcore.dll","*ksproxy.ax")]

      | table _time host user ParentImage Image h family ImageLoaded'
- question: After a threat-intel or camera-DLL match, how rare is the parent process across the fleet,
    and is the suspect binary repeatedly re-spawning in a way consistent with persistence?
  context: Adversary execution chains usually run from rare or anomalous parents. Aggregate parent process
    occurrences fleet-wide and compute the parent's prevalence percentile; a parent below the 5th percentile
    elevates severity because legitimate camera use rarely originates from rare launchers. Separately
    track per-host execution frequency (executions/hour) and the launch State (e.g., LaunchAgent re-spawns)
    — repeated short-lived re-executions indicate a persistence mechanism re-launching capture tooling,
    a distinct Collection+persistence signal characteristic of FruitFly/Proton.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: User workstations and laptops, particularly those assigned to executives, developers, and system
    administrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint (EventCode=4688 OR (source=Sysmon EventCode=1))

      | stats count AS pcount dc(host) AS hosts by ParentImage

      | eventstats perc5(pcount) AS p5

      | where pcount<=p5

      | appendcols [search Image IN (suspect_images) | bucket _time span=1h | stats count AS execs by
      host _time | where execs>3]'
- question: When a supervised model scores a process-creation and module-load event as likely T1125 capture
    malware, which features (parent, command line, path, signature status, loaded camera DLLs, user context)
    drive that score?
  context: Where deterministic intel fails, a supervised classifier generalizes. Feed process creation
    events (4688/Sysmon 1) plus module-load features into a Random Forest or Gradient Boosting model trained
    on labeled benign and T1125 samples, using parent process, command line, file path, Authenticode signature
    status, loaded camera DLLs, and user context. Surface the probability and the top-3 contributing features
    so an analyst can validate the verdict; alert when likelihood exceeds a calibrated threshold (e.g.,
    > 0.85). High scores on unsigned binaries loading camera libraries from rare parents merit immediate
    triage.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: User workstations and laptops, particularly those assigned to executives, developers, and system
    administrators.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = extract(proc_create+module_load: parent, cmdline, path, signed, camera_dlls, user)

      p = rf_gbm_t1125.predict_proba(features)

      if p > 0.85: alert(score=p, top3=feature_importance(features)[:3])'
- question: Was a legitimate utility such as powershell.exe or ffmpeg.exe launched with command-line arguments
    indicating non-interactive or scripted video capture (e.g., DirectShow/Media Foundation calls, 'ffmpeg
    -f dshow -i video=...')?
  context: 'Adversaries frequently abuse trusted binaries (LOLBins) to capture video without dropping
    novel malware. Search process-creation logs with command-line auditing (4688, Sysmon 1) and PowerShell
    script-block logs (4104) for regex patterns of capture automation: PowerShell invoking DirectShow/Media
    Foundation APIs or ffmpeg with ''-f dshow -i video=''. Escalate when command lines reference non-GUI
    capture targets and output files. A match indicates scripted Collection on a high-value endpoint;
    benign use is typically interactive and originates from approved conferencing apps, not scripts.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: User workstations and laptops, particularly those belonging to high-value targets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=endpoint (EventCode=4688 OR EventCode=4104 OR (source=Sysmon EventCode=1))

      | eval cl=lower(coalesce(CommandLine,ScriptBlockText))

      | regex cl="(-f\s+dshow\s+-i\s+video=|directshow|media ?foundation|avicap|capturevideo|startrecording)"

      | where match(cl,"\.(mp4|avi|mov|mkv)") OR match(cl,"-i video=")

      | table _time host user ParentImage Image cl'
- question: How far does each video-capable utility's command line deviate from the host-user's benign
    baseline by Jaccard token similarity, and is the command line abnormally high in entropy (obfuscated)?
  context: Legitimate command lines for the same utility cluster tightly per host-user. Tokenize the arguments
    of video-capable utilities per host-user pair and compute Jaccard similarity against the benign template
    baseline; executions below the 10th percentile are anomalous and likely scripted/attacker-crafted.
    Additionally compute Shannon entropy over the full command line and flag invocations above the 95th
    percentile, which betrays encoding/obfuscation often used to hide capture parameters. Low similarity
    plus high entropy is a strong combined indicator worth escalation.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: User workstations and laptops, particularly those belonging to high-value targets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint Image IN (video_utils) (EventCode=4688 OR source=Sysmon EventCode=1)

      | eval toks=split(lower(CommandLine)," ")

      | lookup cmd_baseline host user OUTPUT base_toks

      | eval jacc=jaccard(toks,base_toks), ent=entropy(CommandLine)

      | eventstats perc10(jacc) AS j10 perc95(ent) AS e95 by host user

      | where jacc<=j10 OR ent>=e95'
- question: Does an NLP classifier predict the command-line of a video-capable utility execution to be
    malicious, and which tokens carry the most weight in that prediction?
  context: A TF-IDF + Logistic Regression (or similar) classifier learns the lexical signature of malicious
    capture invocations versus benign ones. Apply it to the command-line of each video-capable utility
    execution and trigger when confidence is high, reporting the highest-weighted tokens so an analyst
    can see which arguments drove the verdict (e.g., dshow inputs, hidden output paths). This catches
    obfuscated or novel scripted-capture variants that evade static regex while keeping the alert explainable.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: User workstations and laptops, particularly those belonging to high-value targets.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'x = tfidf.transform([cmdline])

      p = logreg_cmd.predict_proba(x)[1]

      if p > 0.9: alert(score=p, top_tokens=top_weighted(tfidf,logreg_cmd,cmdline))'
- question: Does the ordered API/syscall sequence emitted by a video-capable utility match learned capture-malware
    behavior (device-open, capture calls, frame-grab loop, file write, socket send)?
  context: Capture malware follows a recognizable runtime sequence regardless of command line. Train an
    LSTM over the ordered API/syscall stream (device-open, DirectShow/Media Foundation capture calls,
    frame-grab loop, file write, socket send) and alert when an execution's sequence matches learned capture
    behavior. Surface the contributing sub-sequence for triage. This behavioral model detects capture
    even when the binary or arguments are unknown, and the matched sub-sequence (e.g., repeated frame-grab
    followed by socket send) is direct evidence of capture-then-exfiltrate.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: User workstations and laptops, particularly those belonging to high-value targets.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = ordered_api_calls(process)

      p = lstm_capture.score(seq)

      if p > thr: alert(score=p, subsequence=highlight(seq, lstm_capture))'
- question: Did a process that is NOT on the approved video-conferencing allowlist open a handle to a
    video capture device (\Device\Video*) or load camera-capture libraries, including 'piggyback' access
    while an approved app already holds the camera?
  context: Direct device-handle access by an unapproved binary is a precise capture indicator. Filter
    Sysmon 10 (ProcessAccess) where TargetObject matches \Device\Video* and compare SourceImage to the
    approved-app allowlist, alerting on non-allowlisted requesters. Reinforce with Sysmon 7 module loads
    of avicap32.dll/mf.dll/ksproxy.ax by non-allowlisted images. Critically, detect 'piggyback' capture
    where a second unexpected process attaches while a legitimate conferencing app already holds the device,
    since the camera LED stays on and the user is unaware. A hit means an unauthorized process is reaching
    the webcam.
  answer_sources:
  - Sysmon Event ID 10
  - Sysmon Event ID 7
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All endpoints equipped with integrated or peripheral webcams.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=endpoint source=Sysmon EventCode=10 TargetObject="*\\Device\\Video*"

      | where NOT SourceImage IN (camera_allowlist)

      | append [search source=Sysmon EventCode=7 ImageLoaded IN ("*avicap32.dll","*mf.dll","*ksproxy.ax")
      NOT Image IN (camera_allowlist)]

      | table _time host user SourceImage TargetObject ImageLoaded'
- question: Among processes that touch video device handles, which are rare across the fleet, and are
    there bursts of denied/failed handle opens or sustained high-frequency access by a rare process?
  context: 'Unauthorized capture utilities are uncommon fleet-wide. For each process touching a video
    device handle, compute the host-count quotient and flag those below the 5th percentile as suspicious
    rare events. Separately profile the access State (granted vs denied/failed handle opens) and the Frequency
    of access bursts per host: repeated denied opens (a process probing for the camera) or sustained high-frequency
    access by a rare process are distinct signals of unauthorized capture, complementing the simple allowlist
    check.'
  answer_sources:
  - Sysmon Event ID 10
  - Sysmon Event ID 7
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All endpoints equipped with integrated or peripheral webcams.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint source=Sysmon EventCode=10 TargetObject="*\\Device\\Video*"

      | stats count AS accesses dc(host) AS hosts by SourceImage

      | eventstats perc5(hosts) AS p5

      | where hosts<=p5

      | append [search EventCode=10 TargetObject="*\\Device\\Video*" GrantedAccess=denied | bucket _time
      span=5m | stats count AS denials by host SourceImage | where denials>3]'
- question: When an autoencoder trained on legitimate camera-handle access is given a new access event,
    does the reconstruction error exceed the learned threshold, and which features drive the anomaly?
  context: An autoencoder learns the normal manifold of legitimate video-device handle access (process
    path, parent process, user, signature status, access frequency). For each new access event, high reconstruction
    error signals deviation from all known-good behavior — useful for catching novel capture tooling no
    allowlist or signature covers. Report the top contributing features (e.g., unsigned binary, rare path,
    abnormal frequency) so the analyst understands why the event is anomalous and can confirm unauthorized
    camera access.
  answer_sources:
  - Sysmon Event ID 10
  - Sysmon Event ID 7
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All endpoints equipped with integrated or peripheral webcams.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'f = features(access_event: path, parent, user, signed, freq)

      err = autoencoder_camera.reconstruction_error(f)

      if err > thr: alert(error=err, top_features=contrib(autoencoder_camera,f))'
- question: Did a process outside the approved video-application allowlist create files with video or
    image extensions (.mp4, .avi, .mov, .jpg, .yuv) in common staging directories such as %TEMP%, %APPDATA%,
    or C:\Users\Public?
  context: 'Captured media is usually written to disk before exfiltration, frequently in staging directories.
    Monitor Sysmon 11 (FileCreate) and alert when video/image extensions are written into staging paths
    by processes outside the approved video-app allowlist. This is a direct artifact of the capture step:
    a non-conferencing process producing media files in a temp/public directory is highly anomalous and
    ties the capture to a specific writing process and location, supporting both detection and later exfiltration
    correlation.'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Common staging directories on user endpoints, such as %APPDATA%, %TEMP%, C:\Users\Public, and
    temporary internet file locations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=endpoint source=Sysmon EventCode=11

      | where match(lower(TargetFilename),"\.(mp4|avi|mov|mkv|jpg|jpeg|png|yuv)$")

      | where match(TargetFilename,"(?i)(\\temp\\|\\appdata\\|\\users\\public\\)")

      | where NOT Image IN (video_allowlist)

      | table _time host user Image TargetFilename'
- question: Do video/image filenames show high Shannon entropy (machine-generated names), and is the file
    creation cadence regular, low-jitter, and high-volume as expected for automated interval capture?
  context: Automated capture tends to emit machine-generated filenames and a steady cadence. For video/image
    FileCreate events, compute Shannon entropy of TargetFilename against an approved-app baseline and
    flag files above the 95th percentile (random/auto-generated names). Add Volume (file size and bytes/min
    growth) and Frequency (files/min and periodicity of interval capture) metrics, flagging a regular
    low-jitter creation cadence atypical for the host. Periodic, high-entropy media writes from a non-conferencing
    process strongly suggest scripted interval capture.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Common staging directories on user endpoints, such as %APPDATA%, %TEMP%, C:\Users\Public, and
    temporary internet file locations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint source=Sysmon EventCode=11 TargetFilename IN ("*.mp4","*.avi","*.mov","*.jpg")

      | eval ent=entropy(filename(TargetFilename))

      | eventstats perc95(ent) AS e95 by host

      | where ent>=e95

      | sort 0 host _time | streamstats current=f last(_time) AS prev by host Image

      | eval delta=_time-prev | stats avg(delta) AS mean stdev(delta) AS jit count by host Image

      | where jit<2 AND count>5'
- question: Do file-creation events cluster (by size, directory, creating process, inter-event delta)
    into dense periodic groups inconsistent with normal hosts?
  context: Periodic interval capture produces tight clusters in feature space. Cluster file-creation events
    with DBSCAN over file size, directory path, creating process, and inter-event delta to surface dense
    clusters of regular media creation that do not appear on normal hosts. A dense, periodic cluster from
    a single non-conferencing process is a hallmark of automated capture, and the cluster's members give
    the analyst the exact files and cadence to investigate and scope.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Common staging directories on user endpoints, such as %APPDATA%, %TEMP%, C:\Users\Public, and
    temporary internet file locations.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = features(filecreate: size, dir, proc, delta_t)

      labels = DBSCAN(eps, min_samples).fit_predict(X)

      for c in dense_clusters(labels): if periodic(c) and proc not in allowlist: alert(c)'
- question: Does the per-host endpoint event sequence (process -> module load -> device access -> file
    create -> network connect) contain a media-write subsequence that violates the learned benign next-event
    distribution?
  context: The full capture kill-chain appears as an ordered event sequence on the host. Apply a DeepLog-style
    LSTM over the per-host endpoint event sequence and alert when a media-write subsequence violates the
    learned benign next-event distribution, surfacing the offending step for triage. This catches the
    chained behavior (camera open then media write then connect) even when each individual step is subtle,
    and pinpoints exactly where normal behavior broke down so the analyst can confirm capture-to-exfiltration.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Common staging directories on user endpoints, such as %APPDATA%, %TEMP%, C:\Users\Public, and
    temporary internet file locations.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = host_event_sequence(host)\nfor i,e in enumerate(seq):\n  if e not in deeplog.topk_next(seq[:i]):\
      \ alert(step=i, event=e, context=seq[max(0,i-5):i+1])"
- question: Within ~10 minutes of a T1125 host alert, did Zeek files.log record transfers of video/* or
    image/* MIME types from the same host to destinations outside approved corporate/cloud services, and
    can the connection be attributed to the capturing process?
  context: Capture is only valuable to the adversary once exfiltrated. Trigger when a T1125 host alert
    fires and, within 10 minutes, Zeek files.log shows video/* or image/* transfers from the same host
    to non-approved destinations. Attribute the connection to the capturing process by joining Sysmon
    3 (network connection) with process lineage (Sysmon 1). This temporal correlation links collection
    to exfiltration on a single host and identifies both the destination and the responsible process —
    strong, actionable evidence of data theft.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Sysmon Event ID 3
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - Sysmon Event ID 11
  - 'NAI: Network egress points (e.g., firewalls, proxies) and the network interfaces of individual endpoints.'
  range: Last 90 days; pivot to a 10-minute window anchored on the T1125 host alert
  queries:
  - technology: Zeek/pseudocode
    query: 'files.log where mime_type in (video/*, image/*) and tx_hosts == alerted_host

      and ts within 10m after t1125_alert.ts

      and rx_host not in approved_services

      | join sysmon EventCode=3 (host,conn) -> EventCode=1 lineage -> capturing_process'
- question: Did outbound data volume from a host exceed its 99th-percentile hourly baseline shortly after
    a T1125 indicator, with high payload entropy or a cluster of blocked/failed connections suggesting
    attempted exfiltration?
  context: Bulk media exfiltration produces volume spikes. Baseline hourly outbound volume per host using
    orig_bytes from Zeek conn.log and alert when the current hour exceeds the 99th percentile, especially
    paired with a recent T1125 indicator. Compute payload entropy and flag encrypted/compressed exfiltration
    (entropy > 7.2), and profile the failure State (blocked connections, 4xx/proxy denials, resets) as
    a distinct signal of attempted-but-blocked exfiltration. Volume + recent capture + high entropy or
    repeated blocked egress is a compelling exfiltration narrative.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Sysmon Event ID 3
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - Sysmon Event ID 11
  - 'NAI: Network egress points (e.g., firewalls, proxies) and the network interfaces of individual endpoints.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn.log | bucket ts span=1h | stats sum(orig_bytes) AS vol by host ts

      | eventstats perc99(vol) AS p99 by host

      | where vol>p99

      | join host [search recent_t1125_alert]

      | eval ent=payload_entropy | where ent>7.2 OR blocked_conns>3'
- question: After fitting a SARIMA/LSTM forecast to each host's historical outbound bytes, do the current
    residuals exceed the forecast by more than ~3 sigma, and do those anomalies coincide with detected
    video-capture events?
  context: Static thresholds miss hosts with naturally variable traffic. Train a SARIMA or LSTM model
    on historical Zeek conn.log orig_bytes per host and flag residuals exceeding the forecast by >3 sigma
    as anomalous, then correlate with detected capture events. This time-series approach accounts for
    diurnal/weekly patterns so it catches subtle but statistically significant exfiltration that percentile
    thresholds overlook, and the correlation with a capture event raises confidence that the spike is
    stolen media leaving the host.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Sysmon Event ID 3
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - Sysmon Event ID 11
  - 'NAI: Network egress points (e.g., firewalls, proxies) and the network interfaces of individual endpoints.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = SARIMA_or_LSTM.fit(host_orig_bytes_history)

      resid = actual - model.forecast()

      if resid > 3*sigma and correlates(window, t1125_events): alert(resid)'
- question: Does an online autoencoder ensemble scoring per-host egress feature streams (bytes, packet/flow
    rates, destination novelty, periodicity) flag reconstruction error above threshold, and which features
    explain the post-capture transfer?
  context: Exfiltration alters multiple egress dimensions at once. Score per-host egress feature streams
    (bytes, packet/flow rates, destination novelty, periodicity) with an online autoencoder ensemble (Kitsune-style)
    and alert on reconstruction error above the learned threshold, reporting the top contributing features
    (e.g., volume spike, new destination) to explain the transfer. The model learns each host's normal
    egress online and flags deviations in real time, while the feature attribution lets the analyst quickly
    confirm whether the anomaly is captured-media exfiltration.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Sysmon Event ID 3
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - Sysmon Event ID 11
  - 'NAI: Network egress points (e.g., firewalls, proxies) and the network interfaces of individual endpoints.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'f = egress_features(host: bytes, pkt_rate, flow_rate, dest_novelty, periodicity)

      err = kitsune_ensemble.score(f)

      if err > thr: alert(error=err, top_features=contrib(kitsune_ensemble,f))'
- question: On Linux hosts, did an uncommon user or non-allowlisted process open and read a /dev/video*
    device node via the V4L2 API (openat/read/ioctl frame loop), and does the ioctl pattern (QUERYCAP,
    REQBUFS, STREAMON, dequeue loop) confirm active frame capture rather than mere enumeration?
  context: On Linux, webcam capture goes through V4L2 device nodes. Configure auditd to log openat/read/ioctl
    syscalls on /dev/video* and alert when the accessing process/user is not on the approved-camera-app
    allowlist. The V4L2 capture sequence (VIDIOC_QUERYCAP, VIDIOC_REQBUFS, VIDIOC_STREAMON, dequeue loop)
    distinguishes active frame capture from harmless enumeration. Complement with detection of ffmpeg/gst-launch/v4l2-ctl
    run by non-standard users in syslog. A non-allowlisted process sustaining the full capture ioctl sequence
    is direct evidence of webcam collection.
  answer_sources:
  - auditd:SYSCALL
  - linux:osquery
  - linux:syslog
  - 'NAI: Linux workstations, kiosks, and laptops equipped with integrated or USB cameras.'
  range: Last 90 days
  queries:
  - technology: auditd/pseudocode
    query: 'auditd SYSCALL (openat OR read OR ioctl) where path matches "/dev/video*"

      and exe not in camera_allowlist

      and ioctl_seq contains [VIDIOC_QUERYCAP, VIDIOC_REQBUFS, VIDIOC_STREAMON, VIDIOC_DQBUF]

      | union (syslog where comm in (ffmpeg,gst-launch,v4l2-ctl) and user not in std_users)'
- question: How rare across the fleet are the processes/users that access /dev/video*, and is a rare process
    sustaining a high-rate frame-read loop or generating many failed (EBUSY/EACCES) opens?
  context: Legitimate camera access on Linux endpoints is infrequent and consistent. Compute fleet prevalence
    of processes/users that access /dev/video* and flag those below the 5th percentile. Profile the Frequency
    of frame-read syscalls per second (sustained DQBUF loops) and the State of opens (granted vs EBUSY/EACCES
    failures). A rare process sustaining a high-rate read loop is high severity (active capture), while
    bursts of failed opens indicate a process probing for an available camera — both distinct from normal
    conferencing behavior.
  answer_sources:
  - auditd:SYSCALL
  - linux:osquery
  - linux:syslog
  - 'NAI: Linux workstations, kiosks, and laptops equipped with integrated or USB cameras.'
  range: Last 90 days
  queries:
  - technology: auditd/Stats pseudocode
    query: 'auditd SYSCALL path="/dev/video*"

      | stats count AS reads dc(host) AS hosts by exe uid

      | eventstats perc5(hosts) AS p5

