name: 'T1125: Video Capture'
id: b361a2df-dc40-4925-83db-30afe1fb9c5d
description: 'Investigate whether an adversary is capturing video or imagery from endpoint peripheral
  devices (integrated cameras/webcams) or capture-capable applications to gather intelligence on a target.
  This playbook helps an analyst hunt for the full T1125 behavior chain across Windows, Linux, and macOS:
  execution of known video-capture malware (e.g., FruitFly, Proton) or legitimate utilities (powershell.exe,
  ffmpeg.exe) driven for scripted capture; non-allowlisted processes opening handles to camera devices
  (\Device\Video*, /dev/video* via V4L2, AVFoundation/AppleCamera under macOS TCC); loading of camera-capture
  libraries (avicap32.dll, mf.dll, ksproxy.ax); creation of video/image artifacts (.mp4, .avi, .mov, .jpg,
  .yuv) in staging directories; and post-capture exfiltration of large or video/image MIME-typed transfers.
  It pairs deterministic detections with statistical baselining (prevalence, entropy, volume, periodicity)
  and machine-learning models (process risk scoring, command-line classifiers, API/syscall sequence models,
  autoencoders) so the analyst can confirm capture, attribute it to a process, and tie it to data theft.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
