questions:
- question: '[Persistence] Monitor suspicious webroot file writes: Can you determine whether a new file
    with an extension associated with server-side scripting or extensibility (e.g., .aspx, .jsp, .dll,
    .php) is written to a directory served by a web or application server by a process not associated
    with standard software deployment or patching. -- specifically, using the ''Monitor suspicious webroot
    file writes'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses extensible server
    software components to plant durable, often web-accessible footholds (web shells, rogue modules/plugins,
    transport agents, or vSphere extensions) that survive reboots and credential changes. This evidence
    focuses on the condition that a new file with an extension associated with server-side scripting or
    extensibility (e.g., .aspx, .jsp, .dll, .php) is written to a directory served by a web or application
    server by a process not associated with standard software deployment or patching. This Symbolic Logic
    approach looks for the following signal: Track Windows Event ID 4663 (and Zeek files.log) file creations
    under web root, plugin, and server-module paths for server-side extensions (.aspx,.asmx,.jsp,.jspx,.php,.dll,.so),
    hash each new/changed file, and alert if it matches curated web shell / server-component signatures
    (China Chopper, WSO, C99, B374K, AntSword, Behinder, Godzilla, reGeorg) from [Neo23x0 signature-base](https://github.com/Neo23x0/signature-base)
    and the [NSA Mitigating Web Shells](https://github.com/nsacyber/Mitigating-Web-Shells) YARA set. Capture
    process, user, and file size. A positive result -- a rule match, statistical outlier, or model alert
    -- suggests a server application component has been added, modified, or abused for persistent access;
    pivot to the responsible process and its parent lineage, the user/source IP behind the change, the
    file hashes and configuration deltas involved, any preceding HTTP request, and subsequent outbound
    connections. A negative result helps rule out this server-component vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, signed, or living-off-the-land
    server modifications.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Zeek files.log
  - 'NAI: Web root, application plugin, and server extension directories on public-facing and internal
    web/application servers (e.g., C:\inetpub\wwwroot\, /var/www/html/, SharePoint ''Layouts'', Confluence
    ''plugins-installed'').'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Monitor suspicious webroot file writes

      source IN [Windows Event ID 4663, Windows Event ID 4688, Zeek files.log]

      | WHERE matches_action_criteria("Monitor suspicious webroot file writes")

      // Track Windows Event ID 4663 (and Zeek files.log) file creations under web root, plugin, and server-module
      paths for server-side extensions (

      | ALERT enrich(host, user, process, parent, file, http_request, dest)'
