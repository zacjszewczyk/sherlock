name: 'T1505: Server Software Component'
id: bb0189a1-11d0-4904-9cc2-2f3523f7e8e9
description: 'This playbook helps an analyst investigate whether an adversary is abusing legitimate, extensible
  features of enterprise server software (IIS/Apache/Nginx/Tomcat modules, SQL server extensions, PHP/Node.js
  plugins, ESXi/vSphere extensions, and Exchange transport agents) to establish persistent access under
  the Persistence tactic. It guides the hunt across several behavioral angles spanning Windows, Linux,
  macOS, Network Devices, and ESXi: detection of new or modified server-side scripts and executables (.aspx/.jsp/.php/.dll/.so)
  written into web-root, plugin, and module directories and matched against curated web-shell signatures
  (China Chopper, WSO, C99, B374K, AntSword, Behinder, Godzilla, reGeorg) and known-good file-integrity
  manifests; correlation of inbound HTTP POST uploads with subsequent web-server file writes; identification
  of server processes (w3wp.exe, sqlservr.exe, httpd, php-fpm, tomcat) spawning command interpreters or
  living-off-the-land utilities; anomalous outbound connections and beaconing from server binaries to
  rare or malicious destinations; and unauthorized modifications to critical server configuration files
  (web.config, applicationHost.config, httpd.conf, php.ini, server.xml) outside approved change windows.
  Detection methods combine symbolic-logic rules, statistical baselining/forecasting, and machine-learning
  models (Random Forest, Isolation Forest, Gradient Boosting, VAE, SARIMA/DBSCAN) applied to Windows Security/Sysmon
  events, auditd, macOS unified logs, ESXi hostd/vmkernel logs, and Zeek network telemetry, so the analyst
  can corroborate suspected server-component abuse against process lineage, file integrity, HTTP upload
  context, configuration drift, and egress behavior.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
