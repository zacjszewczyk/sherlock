name: 'T1552.005: Cloud Instance Metadata API'
id: 0efcf3f4-c5bd-45e7-a59e-44421db35aad
description: 'Investigate potential adversary abuse of the Cloud Instance Metadata API (the de facto endpoint
  ) to steal IAM credentials, user-data scripts, and other sensitive instance metadata. This playbook
  helps an analyst hunt for: (1) Server-Side Request Forgery (SSRF) chains where inbound traffic to a
  public-facing web app is immediately followed by that app server reaching the metadata endpoint; (2)
  on-host command lines invoking network utilities (curl, wget, PowerShell/Invoke-WebRequest, python)
  against 169.254.169.254; (3) metadata access from processes or accounts outside a role-specific allowlist;
  (4) reconnaissance/enumeration of the metadata tree evidenced by abnormal HTTP methods, high URI entropy,
  4xx/5xx error bursts, and many unique paths in a short window; and (5) credential theft chains where
  access to ''/iam/security-credentials/'' is followed by outbound calls to sensitive cloud provider APIs
  or reuse of the fetched role credential from a different source IP. Each question pairs symbolic-logic
  detection rules, robust statistical baselining, and machine learning approaches across network (Zeek,
  VPC Flow, CloudTrail) and endpoint (Windows 4688/5156, Sysmon 1/3, auditd, eBPF) telemetry to surface
  this Credential Access activity.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
