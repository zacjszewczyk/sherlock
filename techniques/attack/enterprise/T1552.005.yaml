questions:
- question: Did an inbound request from a low-reputation or threat-intelligence-flagged source IP to a
    public-facing web application get followed, within 5 seconds, by a connection from that same application
    server's internal IP to the Instance Metadata API at 169.254.169.254 — and did the metadata URI target
    credential or secret paths?
  context: 'This question hunts for a Server-Side Request Forgery (SSRF) chain, the exact pattern behind
    high-profile cloud breaches. The analyst correlates inbound Zeek http.log entries against a low-reputation/threat-intel
    IP feed; on a match they pivot to Zeek conn.log looking for a connection from that same server''s
    internal IP to the link-local metadata address 169.254.169.254 within a 5-second window. Escalate
    to CRITICAL if the subsequent metadata URI contains ''/latest/meta-data/iam/security-credentials/''
    or ''/latest/user-data'', because those paths return IAM role credentials and bootstrap secrets. A
    positive result strongly indicates an external actor coercing the server into leaking cloud credentials
    (Credential Access). Mitigate by blocking the inbound SSRF at the WAF (OWASP CRS 934 rules for link-local/loopback
    targets and gopher://, file://, dict:// schemes) and by eliminating vulnerable source->sink code paths
    via static taint analysis. References: [AWS IMDSv2 docs](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html);
    [OWASP CRS 934 SSRF rules](https://github.com/coreruleset/coreruleset); [Artemis SSRF taint analysis,
    Ji et al.](https://arxiv.org/abs/2502.21026).'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Public-facing web application servers, Cloud network flow logs (e.g., VPC Flow Logs), and network
    traffic logs from virtual network taps.'
  range: Last 90 days (correlate inbound web request and metadata fetch within a 5-second window)
  queries:
  - technology: Zeek/pseudocode
    query: "FOR each inbound http_request in Zeek http.log\n IF src_ip IN TI_low_reputation_feed THEN\n\
      \ LET server = http_request.dst_internal_ip\n FIND conn in Zeek conn.log WHERE conn.src_ip == server\n\
      \ AND conn.dst_ip == '169.254.169.254'\n AND conn.ts BETWEEN http_request.ts AND http_request.ts\
      \ + 5s\n IF found THEN alert(HIGH)\n IF found.uri MATCHES '/latest/(meta-data/iam/security-credentials/|user-data)'\n\
      \ THEN alert(CRITICAL); block_at_WAF(src_ip, OWASP_CRS_934)"
- question: For each public-facing web server, are there statistically anomalous spikes in the frequency
    of connections to 169.254.169.254, the byte volume returned by the metadata endpoint, or the ratio
    of 2xx successes to 4xx/5xx failures — especially co-occurring with inbound traffic from a low-reputation
    IP?
  context: 'This question detects SSRF-driven metadata abuse statistically rather than by signature. Per
    public-facing web server, baseline three physics-of-attack signals over 30 days: Frequency (connections
    to 169.254.169.254 per minute), Volume (bytes returned from the metadata endpoint), and State (ratio
    of 2xx success to 4xx/5xx failures). Use the robust modified z-score / MAD (flag when |Mi| > 3.5)
    rather than mean +/- 3 sigma, so an ongoing attacker''s spike does not poison the baseline. Raise
    severity when a Frequency or Volume spike co-occurs with inbound traffic from a low-reputation IP.
    Derive per-server thresholds from each app''s own 30-day distribution because a metadata-fetching
    app server and a static web server have very different normal profiles. A positive result indicates
    a web server suddenly hammering the metadata API — a classic Credential Access reconnaissance/harvest
    signal. References: [modified z-score/MAD, NIST](https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h.htm).'
  answer_sources: *id001
  range: Last 90 days (30-day rolling baseline, per-minute evaluation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each web_server, each minute:\n freq = count(conn -> 169.254.169.254)\n vol = sum(resp_bytes\
      \ from 169.254.169.254)\n state = count(2xx) / count(4xx|5xx)\n baseline = 30d distribution per\
      \ server\n med = median(metric); mad = MAD(metric)\n mod_z = 0.6745 * (metric - med) / mad\n IF\
      \ abs(mod_z) > 3.5 THEN sev = HIGH\n IF spike AND inbound_from_low_rep_ip THEN sev = CRITICAL\n\
      \ alert(server, metric, mod_z, sev)"
- question: Can a supervised classifier flag inbound HTTP requests to public-facing web apps that are
    likely to trigger malicious metadata access, based on User-Agent, URI parameter length, character
    entropy, header set, and the presence of IP/hostname literals?
  context: 'This question applies machine learning to predict SSRF-to-metadata exploitation before or
    as it happens. Train a Random Forest / XGBoost classifier on inbound HTTP features (User-Agent, URI
    parameter length, character-distribution/entropy, header set, presence of IP/hostname literals such
    as 169.254.169.254) modeled on per-parameter request grammars. The alert MUST list the top-3 contributing
    features via SHAP (e.g., ''URL param contains 169.254.169.254'', ''anomalous param length'', ''rare
    UA'') so an analyst can triage quickly. Pair it with reconstruction-error egress scoring (Kitsune-style
    autoencoder) on flows toward the metadata endpoint to catch novel variants. A high-confidence positive,
    especially with a metadata-literal parameter, indicates an attempted credential-stealing SSRF (Credential
    Access) and warrants WAF blocking and code review. References: [Kruegel & Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf);
    [explainable-IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full);
    [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089).'
  answer_sources: *id001
  range: Last 90 days (retrain weekly on labeled inbound HTTP)
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [user_agent, uri_param_len, char_entropy, header_set,\n contains_ip_literal, contains_169.254.169.254]\n\
      model = RandomForest/XGBoost.train(labeled_http)\nscore = model.predict_proba(request)\nIF score\
      \ > threshold THEN\n top3 = SHAP(model, request).top(3)\n ae_err = Kitsune.reconstruction_error(egress_flow_to_imds)\n\
      \ alert(request, score, top3, ae_err)"
- question: Did any process on a cloud instance launch a network utility (curl, wget, PowerShell, pwsh,
    python, Invoke-WebRequest/iwr) with a command line that targets 169.254.169.254, and did the URI reach
    sensitive '/iam/security-credentials/' or '/user-data' paths?
  context: 'This question finds direct, on-host querying of the metadata API by an adversary who already
    has a foothold. Search Windows Event ID 4688 and Sysmon Event ID 1 (and Linux auditd / Zeek) command
    lines with the regex ''(?i)(curl|wget|powershell|pwsh|python|Invoke-WebRequest|iwr).*(169\.254\.169\.254)''.
    Alert on any hit, and escalate when the URI targets ''/iam/security-credentials/'' or ''/user-data'',
    which return role credentials and bootstrap secrets. Cross-reference against a per-instance-role allowlist
    of legitimate IMDS-accessing binaries (cloud SDKs, agents); non-allowlisted callers are higher severity.
    A positive result is a strong Credential Access indicator: interactive or scripted credential theft
    from the instance metadata service. References: [AWS IMDSv2 docs](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html);
    [Wiz IMDS anomaly hunting](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day).'
  answer_sources: &id002
  - Windows Event ID 4688
  - 'NAI: Cloud compute instances (VMs, containers), CI/CD pipeline runners, and Endpoint Detection and
    Response (EDR) logs on cloud instances.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each proc_create in (WinEID 4688, Sysmon 1, auditd execve, Zeek)\n IF cmdline MATCHES\
      \ '(?i)(curl|wget|powershell|pwsh|python|Invoke-WebRequest|iwr).*(169\\.254\\.169\\.254)'\n THEN\n\
      \ sev = MEDIUM\n IF cmdline CONTAINS '/iam/security-credentials/' OR '/user-data' THEN sev = HIGH\n\
      \ IF process NOT IN role_allowlist[instance_role] THEN sev = max(sev, HIGH)\n alert(host, process,\
      \ cmdline, sev)"
- question: On each host or host-group, which processes that connect to 169.254.169.254 are historically
    rare (bottom 5th percentile), and are there low-and-slow bursts of IMDS requests by any single process?
  context: 'This question catches metadata theft by uncommon or never-before-seen processes. Per host/host-group,
    baseline the frequency of each process name making network connections and the count of IMDS connections
    per minute. Flag any process touching 169.254.169.254 whose historical frequency on that host is in
    the bottom 5th percentile (a rare process). Apply the modified z-score / MAD (|Mi| > 3.5) to per-process
    IMDS request counts to catch low-and-slow scraping that stays under fixed thresholds. Profile failed/blocked
    connection attempts separately as a distinct signal, since a process repeatedly being denied IMDS
    access is itself suspicious. A positive result points to an adversary tool or compromised process
    harvesting credentials (Credential Access). References: [modified z-score/MAD, NIST](https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h.htm).'
  answer_sources: *id002
  range: Last 90 days (per-host frequency baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each host/host-group:\n baseline_freq[proc] = 30d frequency of proc network conns\n FOR\
      \ each proc connecting to 169.254.169.254:\n IF percentile_rank(baseline_freq[proc]) < 5 THEN flag(rare_process)\n\
      \ counts = per-minute IMDS requests by proc\n mod_z = 0.6745*(counts - median)/MAD\n IF abs(mod_z)\
      \ > 3.5 THEN flag(low_and_slow_burst)\n profile failed/blocked IMDS attempts separately"
- question: Can a classifier trained on command-line features (argument count, IP-literal presence, keyword
    set, token entropy) distinguish benign network-bearing process launches from suspicious metadata-access
    attempts on cloud instances?
  context: 'This question applies machine learning to process-creation telemetry. Train a classifier (logistic
    regression or gradient-boosted trees) on command-line features: argument count, presence of an IP
    literal, keyword set (e.g., curl/iwr/security-credentials), and token entropy. Classify each network-bearing
    process-creation event (Windows 4688 / Sysmon 1 / auditd execve) as benign vs suspicious-metadata-access,
    and emit the top-3 SHAP features in the alert for explainability. This generalizes beyond a fixed
    regex to catch obfuscated or novel invocations. A high-confidence positive indicates likely credential
    theft from the metadata API (Credential Access) and should be triaged against the per-role allowlist
    of legitimate IMDS callers. References: [explainable-IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources: *id002
  range: Last 90 days (retrain weekly)
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [arg_count, has_ip_literal, keyword_set, token_entropy]\nmodel = LogisticRegression\
      \ / GradientBoostedTrees.train(labeled_proc_create)\nFOR each network-bearing proc_create event:\n\
      \ p = model.predict_proba(event)\n IF p > threshold THEN\n top3 = SHAP(model, event).top(3)\n alert(host,\
      \ event, p, top3)"
- question: Did a connection to 169.254.169.254 originate from a process name or user/service account
    that is NOT on the role-specific allowlist for that instance — for example an IMDSv1-style direct
    GET from a web-server child process?
  context: 'This question enforces an allowlist model for metadata access. Maintain role-specific allowlists
    of process names and user/service accounts authorized to reach 169.254.169.254, derived from a 30-day
    baseline of legitimate SDK/agent access. Ingest Windows Event ID 5156 (Filtering Platform connection),
    Sysmon Event ID 3 (network connection), and Zeek conn.log; alert when an IMDS connection originates
    from a process or user not on the allowlist for that instance role. Treat IMDSv1-style direct GETs
    from web-server child processes as high severity, since those are the hallmark of SSRF or post-exploitation
    credential theft. A positive result means an unexpected principal reached the credential-bearing metadata
    endpoint (Credential Access). References: [Wiz IMDS anomaly hunting](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day);
    [AWS IMDSv2 docs](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html).'
  answer_sources: &id003
  - Windows Event ID 5156
  - Windows Event ID 4688
  - Zeek conn.log
  - Sysmon Event ID 3
  - 'NAI: Cloud compute instances (VMs, containers), Authentication and identity management servers, and
    host-based firewall logs.'
  range: Last 90 days (30-day allowlist baseline)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "allowlist[role] = 30d baseline of {process, user/service_account} reaching IMDS\nFOR each\
      \ imds_conn in (WinEID 5156, Sysmon 3, Zeek conn.log) -> 169.254.169.254:\n IF imds_conn.process\
      \ NOT IN allowlist[instance_role]\n OR imds_conn.user NOT IN allowlist[instance_role] THEN\n sev\
      \ = HIGH\n IF imds_conn is IMDSv1 direct GET AND parent is web_server THEN sev = CRITICAL\n alert(instance,\
      \ imds_conn, sev)"
- question: For each instance, has the set of unique processes connecting to the metadata API drifted
    significantly (Jaccard similarity < 0.5) from its 30-day baseline, or are there rare-process bursts
    in IMDS access?
  context: 'This question detects behavioral drift in which processes touch the metadata service. Per
    instance, profile the set of unique processes connecting to IMDS over 30 days. Hourly, compute the
    Jaccard similarity between the current hour''s process set and the baseline set; a similarity below
    0.5 indicates significant drift worth investigating. Additionally track Frequency (connections/min)
    and State (success vs blocked) per process and apply the modified z-score / MAD (|Mi| > 3.5) to flag
    rare-process bursts robustly. A positive result means new or unusual processes have started accessing
    credentials via the metadata API, a strong Credential Access signal that may indicate lateral compromise
    or a planted tool. References: [modified z-score/MAD, NIST](https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h.htm).'
  answer_sources: *id003
  range: Last 90 days (30-day baseline, hourly comparison)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline_set[instance] = unique procs -> IMDS over 30d\nFOR each instance, each hour:\n cur\
      \ = unique procs -> IMDS this hour\n jaccard = |cur ∩ baseline_set| / |cur ∪ baseline_set|\n IF\
      \ jaccard < 0.5 THEN alert(instance, drift, new_procs = cur - baseline_set)\n FOR each proc: mod_z\
      \ = 0.6745*(freq - median)/MAD\n IF abs(mod_z) > 3.5 THEN alert(rare_process_burst)"
- question: When IMDS-connecting processes are clustered by behavioral features (process name, parent
    process, user context, command-line tokens, connection cadence), which processes fall into noise or
    small outlier clusters rather than the dense 'normal' cluster?
  context: 'This question uses unsupervised learning to surface anomalous metadata clients without labels.
    Run DBSCAN clustering on features of IMDS-connecting processes: process name, parent process, user
    context, command-line tokens, and connection cadence. Label the densest cluster(s) as normal and flag
    noise points and small-cluster members as outliers. Surface the top-3 distinguishing features per
    flagged process to support triage. This is effective at catching one-off or stealthy tools that don''t
    match the bulk of legitimate SDK/agent traffic. A positive (outlier) result indicates a process accessing
    the credential-bearing metadata API in an unusual way, a candidate Credential Access event. References:
    [explainable-IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources: *id003
  range: Last 90 days (cluster over rolling window)
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = features(imds_procs)[process_name, parent_process, user_ctx,\n cmdline_tokens, conn_cadence]\n\
      labels = DBSCAN(eps, min_samples).fit(X)\nnormal = densest_cluster(labels)\nFOR each proc WHERE\
      \ label == noise OR small_cluster:\n top3 = distinguishing_features(proc, normal)\n alert(proc,\
      \ outlier, top3)"
- question: Are there HTTP requests to 169.254.169.254 using any method other than GET, sequential walking
    of the metadata tree, >=5 distinct 404-yielding URI paths within 60 seconds from one source, or IMDSv1
    GETs to credential paths lacking a preceding token PUT?
  context: 'This question detects reconnaissance and enumeration of the metadata API. Monitor Zeek http.log
    for requests to 169.254.169.254 and alert on any method other than GET (unexpected for IMDS). Detect
    enumeration: 5 or more distinct 404-yielding URI paths to IMDS within 60 seconds from one source,
    or sequential walking of the metadata tree. For IMDSv2-enabled fleets, alert on IMDSv1-style GETs
    to credential/user-data paths that lack a preceding token PUT (those paths should require the X-aws-ec2-metadata-token
    header). A burst of 404s is itself a distinct reconnaissance signal. A positive result indicates an
    actor mapping the metadata namespace to locate credentials (Credential Access reconnaissance). References:
    [AWS IMDSv2 docs](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html).'
  answer_sources: &id004
  - Zeek http.log
  - 'NAI: Cloud instance virtual network interfaces (VNICs), Network traffic inspection points (e.g.,
    Zeek sensors), and cloud provider-native traffic mirroring services.'
  range: Last 90 days (60-second enumeration window)
  queries:
  - technology: Zeek/pseudocode
    query: "FOR each http_request -> 169.254.169.254 in Zeek http.log:\n IF method != 'GET' THEN alert(abnormal_method)\n\
      \ count404 = distinct uri WHERE status==404 within 60s per src\n IF count404 >= 5 OR sequential_tree_walk(uris)\
      \ THEN alert(enumeration)\n IF imdsv2_fleet AND request to credential/user-data path\n AND no preceding\
      \ token PUT THEN alert(imdsv1_credential_access)"
- question: For each source IP, do the unique IMDS URI paths per hour, the Shannon entropy of the accessed-URI
    set, or the 4xx/5xx error rate exceed their 30-day baselines (99th percentile / >2 sigma / modified
    z-score |Mi|>3.5)?
  context: 'This question statistically identifies scripted metadata enumeration. Per source IP, build
    a 30-day rolling baseline for: unique IMDS URI paths per hour, Shannon entropy of the accessed-URI
    set, and the 4xx/5xx error rate (a burst of 404s is a distinct reconnaissance signal, so model it
    explicitly). Alert when the unique-path count exceeds the 99th percentile, entropy rises more than
    2 sigma above baseline, or the error rate exceeds its modified z-score / MAD threshold (|Mi| > 3.5).
    Parameter-grammar deviation corroborates scripted enumeration. A positive result means an instance
    is probing the metadata API far more broadly or noisily than normal, consistent with an attacker hunting
    for credential paths (Credential Access). References: [modified z-score/MAD, NIST](https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h.htm);
    [Kruegel & Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).'
  answer_sources: *id004
  range: Last 90 days (30-day rolling baseline, hourly)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each src_ip, hourly:\n uniq_paths = count(distinct uri -> IMDS)\n entropy = shannon(accessed_uri_set)\n\
      \ err_rate = count(4xx|5xx)/count(all)\n baseline = 30d rolling per src_ip\n IF uniq_paths > p99(baseline)\
      \ THEN alert\n IF entropy > mean + 2*sigma THEN alert\n mod_z = 0.6745*(err_rate - median)/MAD\n\
      \ IF abs(mod_z) > 3.5 THEN alert(recon_404_burst)"
- question: Does an instance's actual request count and byte volume to the metadata API fall outside the
    prediction interval of a time-series / sequence model (Prophet, LSTM, DeepLog-style next-event), or
    yield high autoencoder reconstruction error on the metadata flow?
  context: 'This question forecasts expected metadata traffic and flags deviations. Use a time-series
    forecaster (Prophet/LSTM, or a DeepLog-style next-event sequence model) to predict the expected request
    count and byte volume from each instance to IMDS; flag actuals that fall outside the prediction interval.
    Augment with a Kitsune-style autoencoder scoring reconstruction error on the metadata flow to catch
    shape changes the point forecast misses. Alerts MUST cite the top-3 contributing features (e.g., ''volume
    6x forecast'', ''404 rate'', ''unique-path count'') for explainability. A positive result indicates
    an instance deviating from its learned metadata-access rhythm, a candidate Credential Access reconnaissance
    or harvest event. References: [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015); [Kitsune,
    Mirsky et al.](https://arxiv.org/abs/1802.09089); [explainable-IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources: *id004
  range: Last 90 days (train on historical per-instance series)
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = Prophet/LSTM/DeepLog.fit(per_instance_imds_series)\nFOR each instance, interval:\n\
      \ pred = model.predict(req_count, byte_vol)\n IF actual OUTSIDE pred.interval THEN flag\n ae_err\
      \ = Kitsune.reconstruction_error(metadata_flow)\n top3 = contributing_features(actual, pred) # e.g.\
      \ 'volume 6x forecast'\n alert(instance, actual, pred, ae_err, top3)"
- question: After an instance fetched '/iam/security-credentials/' from the metadata API, did it make
    an outbound connection or DNS query to a cloud provider API endpoint (e.g., *.amazonaws.com, *.core.windows.net,
    management.azure.com) within 5 minutes — and was the same role credential then seen from a different
    external source IP?
  context: 'This question reconstructs the full credential-theft kill chain. Filter Zeek http.log for
    169.254.169.254 requests whose URI contains ''/iam/security-credentials/''. For each, search Zeek
    conn.log / dns.log for any subsequent outbound connection or DNS query to a cloud API endpoint (e.g.,
    ''*.amazonaws.com'', ''*.core.windows.net'', ''management.azure.com'') from the same source IP within
    5 minutes. The highest severity case is when the same fetched role credential is later observed in
    use from a different (external) source IP, which proves exfiltration and off-instance reuse. A positive
    result confirms stolen instance credentials being exercised against cloud APIs (Credential Access
    leading to follow-on access). References: [AWS IMDSv2 docs](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html).'
  answer_sources: &id005
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Cloud compute instances (VMs, containers), Egress network gateways, DNS resolvers, and VPC network
    access control lists (NACLs).'
  range: Last 90 days (5-minute correlation window after credential-path hit)
  queries:
  - technology: Zeek/pseudocode
    query: "FOR each http_request -> 169.254.169.254 WHERE uri CONTAINS '/iam/security-credentials/':\n\
      \ src = http_request.src_ip\n FIND out in (Zeek conn.log, dns.log) WHERE out.src_ip == src\n AND\
      \ out.dst MATCHES '*.amazonaws.com|*.core.windows.net|management.azure.com'\n AND out.ts BETWEEN\
      \ hit.ts AND hit.ts + 5m\n IF found THEN alert(HIGH)\n IF same_role_credential seen FROM different\
      \ external src_ip THEN alert(CRITICAL)"
- question: After a credential-path hit, did the instance connect to a cloud API endpoint or call an API
    never before seen for that instance role (first-seen-per-principal), or generate AccessDenied/failed
    API calls indicating credential probing?
  context: 'This question scores the novelty of post-metadata activity. Baseline the cloud API endpoints
    each instance role normally contacts. After a credential-path hit on the metadata API, score subsequent
    outbound connections; a connection to an endpoint or API never before seen for that role (first-seen-per-principal,
    as in CloudTrail anomaly detection) gets a high risk score. Track State explicitly: failed/denied
    API calls (AccessDenied) following metadata access indicate an attacker probing the limits of stolen
    credentials and are a distinct signal worth alerting on. A positive result means freshly fetched credentials
    are being used in ways inconsistent with the role''s history, a strong Credential Access / privilege-exploration
    indicator. References: [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).'
  answer_sources: *id005
  range: Last 90 days (first-seen-per-role baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline_apis[role] = endpoints/APIs role normally contacts\nAFTER credential_path_hit(instance):\n\
      \ FOR each subsequent outbound conn/API call:\n IF endpoint NOT IN baseline_apis[role] THEN risk\
      \ += HIGH # first-seen-per-principal\n IF api_result == 'AccessDenied'/failed THEN flag(credential_probing)\n\
