- question: '[Reconnaissance] Multi-account failure detection: Can you determine whether a statistically
    significant deviation from the baseline ratio of failed (Windows Event ID 4625) to successful (Windows
    Event ID 4624) authentication attempts from a single external IP address against multiple distinct
    accounts. -- specifically, using the ''Multi-account failure detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively or passively
    gathers email addresses and usernames belonging to the organization to enable later phishing, password
    spraying, brute force, and other initial-access operations (MITRE ATT&CK T1589.002, Email Addresses).
    Email addresses are often readily exposed on public websites, social media, and via active enumeration
    of authentication/identity endpoints (e.g., Office 365 GetCredentialType, Autodiscover, ActiveSync),
    so catching the reconnaissance early gives defenders a chance to anticipate and blunt the follow-on
    attack. This evidence focuses on the condition that a statistically significant deviation from the
    baseline ratio of failed (Windows Event ID 4625) to successful (Windows Event ID 4624) authentication
    attempts from a single external IP address against multiple distinct accounts. This Symbolic Logic
    approach works as follows: Alert when one external source records >10 failed logons (Windows Event
    ID 4625) across >5 distinct accounts within 1 minute, OR issues >20 requests to GetCredentialType/Autodiscover/ActiveSync
    with iterated candidate addresses, per [o365enum](https://github.com/gremwell/o365enum), [Just looking,
    Syynimaa](https://aadinternals.com/post/just-looking/), and [Password Spray Detection, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).
    Note: pure enumeration submits no password, so a high count of nonexistent-account responses (IfExistsResult=1
    / 404) with NO 4624/4625 is itself the signal. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable adversary reconnaissance for email addresses/usernames; pivot
    to the source IP and its threat-intel reputation, the specific accounts or directory pages targeted,
    the user-agent and request fingerprint, the volume and timing of the activity, and any follow-on authentication
    attempts against the enumerated accounts to scope the threat and pre-position defenses. A negative
    result helps rule out this particular reconnaissance vector but should be corroborated with the other
    questions in this playbook, since a single method can miss low-and-slow, distributed, or anonymizer-fronted
    enumeration.'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, Active Directory Federation Services (ADFS) servers, Remote Desktop Gateway
    servers, VPN concentrators, Microsoft 365 / Entra ID tenant.'
  range: Last 90 days (correlate event-centered windows of +/- 5 minutes around the activity)
  queries:
  - technology: SIEM/Rule pseudocode
