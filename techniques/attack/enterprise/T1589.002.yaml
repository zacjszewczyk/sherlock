- question: '[Reconnaissance] Graph/ML clustering for follow-on attacks: Can you determine whether a sudden,
    anomalous increase in authentication attempts or password spray attacks against a specific set of
    user accounts that share a common attribute (e.g., same department, same role) shortly after a suspected
