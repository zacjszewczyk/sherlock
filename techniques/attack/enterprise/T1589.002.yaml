questions:
- question: '[Reconnaissance] Match IPs to high-confidence TI: Can you determine whether an external IP
    address, flagged on a threat intelligence feed for reconnaissance or malicious activity, establishes
    an anomalously high number of connections to public-facing services within a defined time window,
    exceeding established baselines. -- specifically, using the ''Match IPs to high-confidence TI'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively or passively
    gathers email addresses and usernames belonging to the organization to enable later phishing, password
    spraying, brute force, and other initial-access operations (MITRE ATT&CK T1589.002, Email Addresses).
    Email addresses are often readily exposed on public websites, social media, and via active enumeration
    of authentication/identity endpoints (e.g., Office 365 GetCredentialType, Autodiscover, ActiveSync),
    so catching the reconnaissance early gives defenders a chance to anticipate and blunt the follow-on
    attack. This evidence focuses on the condition that an external IP address, flagged on a threat intelligence
    feed for reconnaissance or malicious activity, establishes an anomalously high number of connections
    to public-facing services within a defined time window, exceeding established baselines. This Symbolic
    Logic approach works as follows: Alert when Zeek conn.log source IPs match high-confidence scanner/anonymizer/recon
    TI lists, especially when they also touch enumeration endpoints (GetCredentialType, Autodiscover,
    ActiveSync) per [o365enum](https://github.com/gremwell/o365enum) and [Just looking: Azure AD reconnaissance,
    Syynimaa](https://aadinternals.com/post/just-looking/). Pair with [SigmaHQ](https://github.com/SigmaHQ/sigma)
    web-recon/UA signatures as the deterministic floor. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable adversary reconnaissance for email addresses/usernames;
    pivot to the source IP and its threat-intel reputation, the specific accounts or directory pages targeted,
    the user-agent and request fingerprint, the volume and timing of the activity, and any follow-on authentication
    attempts against the enumerated accounts to scope the threat and pre-position defenses. A negative
    result helps rule out this particular reconnaissance vector but should be corroborated with the other
    questions in this playbook, since a single method can miss low-and-slow, distributed, or anonymizer-fronted
    enumeration.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Internet gateway, network DMZ, public-facing web servers, external-facing authentication services
    (e.g., M365, VPN concentrators).'
  range: Last 90 days (correlate event-centered windows of +/- 5 minutes around the activity)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match IPs to high-confidence TI (Symbolic Logic)

      source IN [Zeek conn.log, Zeek http.log]

      | approach: Alert when Zeek conn.log source IPs match high-confidence scanner/anonymizer/recon TI
      lists, especially when they also touch enumeration endpoints (GetCredentialType, Autodiscover, ActiveSync)
      per [o365enum](https://github.com/gremwell/o365enum) and [Just looking: Azure AD reconnaissance,
      Syynimaa](https://aadinternals.com/post/just-looking/). Pair with [SigmaHQ](https://github.com/SigmaHQ/sigma)
      web-recon/UA signatures as the deterministic floor.

      | correlate over NAI: Internet gateway, network DMZ, public-facing web servers, external-facing
      authentication services (e.g., M365, VPN concentrators).

      | emit alert with contributing fields and entity context (source IP, TI reputation, targeted accounts/URIs,
      user-agent/fingerprint, request rate, follow-on auth)'
  - technology: Zeek/pseudocode
    query: '# Match IPs to high-confidence TI (Zeek view)

      watch conn.log/http.log/weird.log for recon against public-facing/auth services

      | filter source IPs against TI lists and enumeration endpoints (GetCredentialType, Autodiscover,
      ActiveSync)

      | evaluate per-source connection rate, distinct-port/account breadth, UA, URI entropy, 404/401 ratio

      | emit candidate recon sources with IP, targets, rate, fingerprint'
- question: '[Reconnaissance] Flag high connection rates from medium-confidence IPs: Can you determine
    whether an external IP address, flagged on a threat intelligence feed for reconnaissance or malicious
    activity, establishes an anomalously high number of connections to public-facing services within a
    defined time window, exceeding established baselines. -- specifically, using the ''Flag high connection
    rates from medium-confidence IPs'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively or passively
    gathers email addresses and usernames belonging to the organization to enable later phishing, password
    spraying, brute force, and other initial-access operations (MITRE ATT&CK T1589.002, Email Addresses).
    Email addresses are often readily exposed on public websites, social media, and via active enumeration
    of authentication/identity endpoints (e.g., Office 365 GetCredentialType, Autodiscover, ActiveSync),
    so catching the reconnaissance early gives defenders a chance to anticipate and blunt the follow-on
    attack. This evidence focuses on the condition that an external IP address, flagged on a threat intelligence
    feed for reconnaissance or malicious activity, establishes an anomalously high number of connections
    to public-facing services within a defined time window, exceeding established baselines. This Statistical
    Method approach works as follows: Score source IPs whose 10-minute per-port connection counts exceed
    the 99th percentile of a rolling 24-hour baseline; derive the percentile per service from your own
    conn.log history. Volume (connections, bytes) plus single-source breadth are the canonical robot signals
    in [Web robot detection techniques, Doran and Gokhale](https://link.springer.com/article/10.1007/s10618-010-0180-z)
    and [OWASP Automated Threats](https://owasp.org/www-project-automated-threats-to-web-applications/).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    reconnaissance for email addresses/usernames; pivot to the source IP and its threat-intel reputation,
    the specific accounts or directory pages targeted, the user-agent and request fingerprint, the volume
    and timing of the activity, and any follow-on authentication attempts against the enumerated accounts
    to scope the threat and pre-position defenses. A negative result helps rule out this particular reconnaissance
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss low-and-slow, distributed, or anonymizer-fronted enumeration.'
