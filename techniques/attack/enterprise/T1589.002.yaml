    Learning) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively or passively
    gathers email addresses and usernames belonging to the organization to enable later phishing, password
    spraying, brute force, and other initial-access operations (MITRE ATT&CK T1589.002, Email Addresses).
    Email addresses are often readily exposed on public websites, social media, and via active enumeration
    of authentication/identity endpoints (e.g., Office 365 GetCredentialType, Autodiscover, ActiveSync),
    so catching the reconnaissance early gives defenders a chance to anticipate and blunt the follow-on
    attack. This evidence focuses on the condition that a sudden, anomalous increase in authentication
    attempts or password spray attacks against a specific set of user accounts that share a common attribute
    (e.g., same department, same role) shortly after a suspected reconnaissance event. This Machine Learning
    approach works as follows: Apply graph-based authentication-path modeling ([Hopper, Ho et al.](https://www.usenix.org/system/files/sec21-ho.pdf))
    and cross-IP clustering of sign-ins ([Hunting Low and Slow Password Sprays, Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052))
    to link recon-tainted sources to dense clusters of targeted accounts; surface the linking IPs/accounts
    and top contributing features in the alert. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable adversary reconnaissance for email addresses/usernames; pivot
    to the source IP and its threat-intel reputation, the specific accounts or directory pages targeted,
    the user-agent and request fingerprint, the volume and timing of the activity, and any follow-on authentication
    attempts against the enumerated accounts to scope the threat and pre-position defenses. A negative
    result helps rule out this particular reconnaissance vector but should be corroborated with the other
    questions in this playbook, since a single method can miss low-and-slow, distributed, or anonymizer-fronted
    enumeration.'
