- question: '[Reconnaissance] High failure / nonexistent-account ratio threshold: Can you determine whether
    a statistically significant deviation from the baseline ratio of failed (Windows Event ID 4625) to
    successful (Windows Event ID 4624) authentication attempts from a single external IP address against
    multiple distinct accounts. -- specifically, using the ''High failure / nonexistent-account ratio
    threshold'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively or passively
    gathers email addresses and usernames belonging to the organization to enable later phishing, password
    spraying, brute force, and other initial-access operations (MITRE ATT&CK T1589.002, Email Addresses).
    Email addresses are often readily exposed on public websites, social media, and via active enumeration
    of authentication/identity endpoints (e.g., Office 365 GetCredentialType, Autodiscover, ActiveSync),
    so catching the reconnaissance early gives defenders a chance to anticipate and blunt the follow-on
    attack. This evidence focuses on the condition that a statistically significant deviation from the
    baseline ratio of failed (Windows Event ID 4625) to successful (Windows Event ID 4624) authentication
    attempts from a single external IP address against multiple distinct accounts. This Statistical Method
    approach works as follows: Flag source IPs whose failed:successful ratio (4625:4624) or nonexistent-account-response
    ratio exceeds the per-tenant baseline by >3σ while targeting >3 distinct accounts in a sliding window;
    derive distinct-account and ratio thresholds from your own sign-in history per [Detecting Password
    Spraying, Splunk](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html)
    and [ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    reconnaissance for email addresses/usernames; pivot to the source IP and its threat-intel reputation,
    the specific accounts or directory pages targeted, the user-agent and request fingerprint, the volume
    and timing of the activity, and any follow-on authentication attempts against the enumerated accounts
    to scope the threat and pre-position defenses. A negative result helps rule out this particular reconnaissance
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss low-and-slow, distributed, or anonymizer-fronted enumeration.'
