name: 'T1589.002: Email Addresses'
id: e43373bc-9c59-4115-b236-cdb1a3945343
description: 'This playbook helps an analyst investigate whether a sophisticated external actor, a routine
  threat actor, or commodity tooling is actively gathering the organization''s email addresses and usernames
  to support targeting (MITRE ATT&CK T1589.002, Email Addresses, under Reconnaissance TA0043). Adversaries
  harvest addresses from public-facing websites, employee directories, and social media, and enumerate
  valid accounts by probing authentication and identity services -- notably Office 365 / Entra ID endpoints
  such as GetCredentialType, Autodiscover, and ActiveSync -- where responses can reveal which usernames
  exist even without submitting a password. The hunt spans network egress telemetry (Zeek conn/http/weird/files
  logs) and Windows authentication logs (Event IDs 4624/4625), pursuing the behavior from several complementary
  angles: external IPs flagged on threat-intelligence feeds making anomalously high connection volumes
  to public-facing and authentication services; HTTP requests bearing user-agents or header orderings
  characteristic of harvesting/OSINT tools; low-entropy, high-rate scripted URI iteration and elevated
  404/401 failure ratios; abnormal failed-to-successful authentication ratios and nonexistent-account
  responses from a single source against many distinct accounts; automated web scraping of directory/contact/profile
  pages; and password-spray-style follow-on authentication against accounts that share a common attribute
  shortly after a suspected reconnaissance event. Detection methods combine deterministic symbolic-logic
  rules (threat-intel matching, Sigma web-recon/UA signatures, multi-account failure and URI-traversal
  thresholds, recon-to-spray correlation), statistical baselining (per-service connection-rate percentiles,
  URI Shannon-entropy plus rate, failed:successful and nonexistent-account ratio sigma thresholds, departmental
  failure spikes, Levenshtein URI-template distance), and machine learning (SARIMA volume forecasting,
  Isolation Forest per-source outlier scoring, Random Forest robot/session classification, LSTM/DeepLog
  sequence modeling, and graph-based authentication-path clustering), so the analyst can corroborate suspected
  email-address reconnaissance against source reputation, request fingerprints, enumeration endpoints,
  and downstream credential attacks.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
