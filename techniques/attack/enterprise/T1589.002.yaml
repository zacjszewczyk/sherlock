    of authentication/identity endpoints (e.g., Office 365 GetCredentialType, Autodiscover, ActiveSync),
    so catching the reconnaissance early gives defenders a chance to anticipate and blunt the follow-on
    attack. This evidence focuses on the condition that one or more HTTP requests to public-facing web
    services are observed with a User-Agent string or a combination of HTTP headers matching signatures
    of known automated email harvesting or OSINT tools. This Statistical Method approach works as follows:
    Flag source IPs whose requested-URI Shannon entropy is low (scripted iteration) AND request rate exceeds
    the 99th-percentile human baseline (start near <1.0 entropy and >30 req/min, then tune to your logs).
