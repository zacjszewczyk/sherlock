    helps strip away that camouflage. Train an Isolation Forest or autoencoder on tokenized bitsadmin
    and PowerShell BITS command sequences captured from Event ID 4688/4104, learning the normal vocabulary
    and structure of legitimate BITS use. Flag high anomaly scores and surface the top-3 anomalous tokens
    (e.g., SetNotifyCmdLine, SetMinRetryDelay) in the alert so an analyst can immediately see why the
    command was unusual. This catches novel or obfuscated command structures that static rules miss. Source
    evidence: A BITS job is configured via `bitsadmin.exe` or PowerShell to execute a specific program
    upon job completion or error, establishing a command-execution persistence mechanism. Mission question
    (information requirement): Is the adversary maintaining persistence using BITS jobs?'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: User Workstations, Domain Controllers, Member Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = IsolationForest.load('bits_cmd_anomaly.pkl')\nfor cmd in bits_commands(last=90d):\
      \  # from 4688 + 4104\n    tokens = tokenize(cmd)\n    score, top3 = model.score(vectorize(tokens))\n\
      \    if score > threshold: alert(cmd, top3)"
- question: Are there BITS jobs owned by non-SYSTEM accounts with lifetimes exceeding the 90-day default,
    extended retry delays (/SetMinRetryDelay), or a notify command set?
  context: 'From a Stealth perspective, BITS is attractive because jobs live in the self-contained BITS
    database, leave no new files or registry keys, and ride firewall-permitted updater traffic; this question
    helps strip away that camouflage. Alert when BITS-Client Event IDs 59/16391 or bitsadmin command lines
    create jobs owned by non-SYSTEM accounts that have lifetimes exceeding the 90-day default, an extended
    /SetMinRetryDelay, or /SetNotifyCmdLine set. Legitimate update jobs are normally SYSTEM-owned and
    short-lived, so a long-lived, user-owned job is a classic durable-persistence indicator. Confirming
    such a job — and reviewing its source URL and notify target — directly answers whether an adversary
    has parked a reboot-surviving foothold in the BITS queue. Source evidence: A BITS job is created with
    an abnormally long job lifetime or retry delay, especially when initiated by a non-SYSTEM user account.
    Mission question (information requirement): Is the adversary maintaining persistence using BITS jobs?'
  answer_sources:
  - Microsoft-Windows-Bits-Client/Operational Event ID 59
  - Microsoft-Windows-Bits-Client/Operational Event ID 16391
  - Windows Event ID 4688
  - 'NAI: User Workstations, Member Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source="Microsoft-Windows-Bits-Client/Operational" EventCode IN (59,16391)

      | eval owner_is_system=if(match(owner,"(?i)NT AUTHORITY\\SYSTEM|S-1-5-18"),1,0)

      | where owner_is_system=0 AND (lifetime_days>90 OR retry_delay_s>3600 OR notify_cmd!="")

      | alert'
- question: Which BITS jobs fall above the 95th percentile for lifetime or retry-delay, or show abnormal
    resume/retry frequency and error-to-resume ratios, especially non-SYSTEM jobs moving executables/scripts?
  context: 'From a Stealth perspective, BITS is attractive because jobs live in the self-contained BITS
    database, leave no new files or registry keys, and ride firewall-permitted updater traffic; this question
    helps strip away that camouflage. Baseline the distributions of BITS job lifetime and retry-delay
    and flag jobs above the 95th percentile, weighting non-SYSTEM jobs and those transferring executable
    or script file types. Incorporate Frequency (number of resumes/retries) and Failure state (error-to-resume
    ratio) as additional outlier dimensions. This statistical approach distinguishes the patient, frequently
    retrying jobs adversaries use to survive intermittent connectivity and reboots from the brief jobs
    of normal software updates. Source evidence: A BITS job is created with an abnormally long job lifetime
    or retry delay, especially when initiated by a non-SYSTEM user account. Mission question (information
    requirement): Is the adversary maintaining persistence using BITS jobs?'
  answer_sources:
  - Microsoft-Windows-Bits-Client/Operational Event ID 59
  - Microsoft-Windows-Bits-Client/Operational Event ID 16391
  - Windows Event ID 4688
  - 'NAI: User Workstations, Member Servers'
  range: Last 90 days for baseline; score continuously
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source="Microsoft-Windows-Bits-Client/Operational" EventCode IN (59,16391)

      | stats max(lifetime_days) AS life max(retry_delay_s) AS retry count(resumes) AS resumes count(errors)
      AS errs BY job_id, owner

      | eventstats perc95(life) AS p95_life perc95(retry) AS p95_retry

      | eval err_ratio=errs/(resumes+1)

      | where life>p95_life OR retry>p95_retry OR err_ratio>1 | alert'
- question: When BITS job metadata is clustered (owner SID, lifetime, retry delay, file count, total bytes),
    do any jobs appear as noise/outliers far from the dense SYSTEM-updater cluster?
  context: 'From a Stealth perspective, BITS is attractive because jobs live in the self-contained BITS
    database, leave no new files or registry keys, and ride firewall-permitted updater traffic; this question
    helps strip away that camouflage. Cluster BITS job metadata — owner SID, lifetime, retry delay, file
    count, total bytes — using DBSCAN and investigate the noise/outlier points that sit far from the dense
    cluster of SYSTEM-owned updater jobs. Report the features that placed each outlier outside the norm.
    Density-based clustering naturally isolates the handful of jobs that do not look like routine updates
    without requiring a predefined threshold, surfacing adversary jobs whose combination of attributes
    is unusual even if each attribute alone is borderline. Source evidence: A BITS job is created with
    an abnormally long job lifetime or retry delay, especially when initiated by a non-SYSTEM user account.
    Mission question (information requirement): Is the adversary maintaining persistence using BITS jobs?'
  answer_sources:
  - Microsoft-Windows-Bits-Client/Operational Event ID 59
  - Microsoft-Windows-Bits-Client/Operational Event ID 16391
  - Windows Event ID 4688
  - 'NAI: User Workstations, Member Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = bits_job_features(last=90d)  # owner_sid, lifetime, retry_delay, file_count, total_bytes\n\
      labels = DBSCAN(eps, min_samples).fit_predict(scale(X))\nfor job where labels==-1:  # noise / outlier\n\
      \    alert(job, distinguishing_features(job, cluster_centroids))"
- question: Was a BITS completion event (16387) followed within 60 seconds by a process launch (4688)
    of an unsigned/user-path binary or a process matching a prior /SetNotifyCmdLine target?
  context: 'From a Stealth perspective, BITS is attractive because jobs live in the self-contained BITS
    database, leave no new files or registry keys, and ride firewall-permitted updater traffic; this question
    helps strip away that camouflage. Alert when a BITS completion Event ID 16387 is followed within 60
    seconds by an Event ID 4688 that launches an unsigned or user-path process, or a process matching
    a previously observed /SetNotifyCmdLine target. (Where available, correlate Sysmon Event ID 12 registry
    context as well.) This launch-on-completion sequence is the programmatic fingerprint of BITS-based
    execution: the job finishes downloading and immediately runs the payload. A confirmed pairing tightly
    couples the network download to code execution and is high-value evidence. Source evidence: A BITS
    job completion or error event is consistently followed within a short, fixed time window by the execution
    of a specific process, indicating a programmatic link. Mission question (information requirement):
    Is the adversary maintaining persistence using BITS jobs?'
  answer_sources:
  - Microsoft-Windows-Bits-Client/Operational Event ID 16387
  - Windows Event ID 4688
  - 'NAI: User Workstations, Critical Servers'
  range: Last 90 days; 60s correlation window between 16387 and 4688
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=\"Microsoft-Windows-Bits-Client/Operational\" EventCode=16387\n| join host [search\
      \ source=WinEventLog:Security EventCode=4688]\n| where (proc_time - completion_time) <= 60s\n  AND\
      \ (signed=0 OR match(NewProcessName,\"(?i)\\\\users\\\\|\\\\temp\\\\|appdata\") OR NewProcessName=prior_notify_target)\n\
      | alert"
- question: For repeated BITS-completion-to-process pairs on a host, is the time delta low-jitter (near-zero
    standard deviation), indicating an automated rather than human link?
  context: 'From a Stealth perspective, BITS is attractive because jobs live in the self-contained BITS
    database, leave no new files or registry keys, and ride firewall-permitted updater traffic; this question
    helps strip away that camouflage. Baseline the time delta between Event ID 16387 (BITS completion)
    and the subsequent Event ID 4688 per host, and flag low-jitter repeats — a standard deviation near
    zero for the same child process — which indicate a programmatic, automated link rather than coincidental
    human activity. Track the Frequency of the pairing per day. Machines fire with metronomic regularity;
    humans do not, so tight, repeating deltas strongly imply scripted BITS-driven execution. Source evidence:
    A BITS job completion or error event is consistently followed within a short, fixed time window by
    the execution of a specific process, indicating a programmatic link. Mission question (information
    requirement): Is the adversary maintaining persistence using BITS jobs?'
  answer_sources:
  - Microsoft-Windows-Bits-Client/Operational Event ID 16387
  - Windows Event ID 4688
  - 'NAI: User Workstations, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '... pair 16387 -> 4688 per host,child_proc ...

      | eval delta = proc_time - completion_time

      | stats count AS pairs avg(delta) AS mu stdev(delta) AS sd BY host, child_proc

      | where pairs>=3 AND sd<2  // seconds; low jitter == automated

      | alert'
