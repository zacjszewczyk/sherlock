name: 'T1197: BITS Jobs'
id: 3dc950d6-ee6f-41aa-be7d-41f645a2dd78
description: 'Investigate suspected abuse of the Windows Background Intelligent Transfer Service (BITS)
  as described in MITRE ATT&CK T1197. Adversaries use bitsadmin.exe, PowerShell BITS cmdlets, or the BITS
  COM interface to download tooling, execute code via job completion/error notifications, and maintain
  persistence through long-lived jobs, while blending into firewall-permitted, updater-like background
  traffic. This playbook helps an analyst hunt for: BITS jobs that download from threat-intelligence-flagged
  or rare/low-reputation URLs and IPs; jobs configured with /SetNotifyCmdLine or PowerShell -NotifyCmdLine
  to launch a program on completion or error; abnormally long-lived or high-retry jobs owned by non-SYSTEM
  accounts; BITS completion events programmatically followed by process execution; BITS-attributed network
  traffic to malicious, rare, or upload-heavy destinations; custom User-Agent headers and masquerading
  job display names used to evade detection; anomalous file types, sizes, and destination paths in BITS
  transfers; and low-and-slow exfiltration or DGA-style DNS behavior. It spans the Stealth, Persistence,
  and Execution tactics and correlates Windows process, PowerShell, and BITS-Client operational telemetry
  with Zeek network and DNS logs to answer whether an adversary is using BITS jobs for ingress tool transfer,
  execution, and persistence.'
type: technique
