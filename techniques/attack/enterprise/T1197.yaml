questions:
- question: Did any BITS job download from a URL, IP, domain, or fetch a file hash that matches a current
    threat-intelligence feed, or repeatedly fail/retry against the same hardcoded source?
  context: 'From a Stealth perspective, BITS is attractive because jobs live in the self-contained BITS
    database, leave no new files or registry keys, and ride firewall-permitted updater traffic; this question
    helps strip away that camouflage. Parse Windows Security Event ID 4688 for bitsadmin command lines
    using /transfer or /addfile, and BITS-Client Operational Event IDs 59 and 16391, to extract the download
    URL/host and any /SetNotifyCmdLine target. Enrich every extracted URL, IP, domain, and downloaded
    file hash against CTI feeds and alert on any match; ship the canonical bitsadmin download/notify patterns
    as Sigma rules. As a distinct, high-confidence failure-mode signal, treat repeated BITS transient
    errors/retries (Event ID 16392/16393) or HTTP 4xx/5xx responses to the same host as evidence of a
    hardcoded malicious or sinkholed source. A positive hit on a known-bad indicator is a strong lead;
    the absence of a feed match does not clear the activity since fresh infrastructure will not yet be
    listed. Source evidence: A BITS job is created to download a file where either the source URL/IP is
    on a threat intelligence feed, or the file designated for execution upon job completion has a known
    malicious hash. Mission question (information requirement): Is the adversary maintaining persistence
    using BITS jobs?'
  answer_sources:
  - Windows Event ID 4688
  - Microsoft-Windows-Bits-Client/Operational Event ID 59
  - Microsoft-Windows-Bits-Client/Operational Event ID 16391
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: User Workstations, Application Servers, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Security EventCode=4688 (NewProcessName="*\\bitsadmin.exe" CommandLine
      IN ("*/transfer*","*/addfile*"))

      OR (source="Microsoft-Windows-Bits-Client/Operational" EventCode IN (59,16391))

      | rex extract url, host, file_hash, notify_cmd

      | lookup cti_feed indicator AS url OUTPUT verdict

      | lookup cti_feed indicator AS host OUTPUT verdict

      | lookup cti_feed indicator AS file_hash OUTPUT verdict

      | where isnotnull(verdict) | alert'
  - technology: SIEM/Stats pseudocode
    query: 'source="Microsoft-Windows-Bits-Client/Operational" EventCode IN (16392,16393)

      | stats count AS retries dc(EventCode) BY host, dest_host

      | where retries >= 5 | alert  // repeated transient errors to same host'
- question: Are any BITS downloads going to destination domains/TLDs that are rare for this host or organization,
    newly registered (<90 days), low-reputation, high-entropy, or statistical outliers in transfer volume
    or frequency?
  context: 'From a Stealth perspective, BITS is attractive because jobs live in the self-contained BITS
    database, leave no new files or registry keys, and ride firewall-permitted updater traffic; this question
    helps strip away that camouflage. Baseline the set of BITS destination domains and TLDs seen per host
    and per organization, then flag downloads to domains in the top 1% rarest, less than 90 days old,
    or with poor reputation. Additionally compute the Shannon entropy of the URL host and path and flag
    tokens above ~7.2 bits/byte that are consistent with encoded or DGA-generated strings. Add Volume
    (resp_bytes per transfer) and Frequency (transfers/hour per destination) baselines and alert on outliers
    beyond Q3+1.5*IQR. Rare-destination scoring catches first-seen adversary infrastructure that CTI has
    not yet cataloged; benign updater traffic clusters on a small set of well-known, long-lived domains.
    Source evidence: A BITS job is created to download a file where either the source URL/IP is on a threat
    intelligence feed, or the file designated for execution upon job completion has a known malicious
    hash. Mission question (information requirement): Is the adversary maintaining persistence using BITS
    jobs?'
  answer_sources:
  - Windows Event ID 4688
  - Microsoft-Windows-Bits-Client/Operational Event ID 59
  - Microsoft-Windows-Bits-Client/Operational Event ID 16391
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: User Workstations, Application Servers, Internet Gateway'
  range: Last 90 days for baseline; score new transfers daily
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source="Microsoft-Windows-Bits-Client/Operational" OR source=Zeek:http user_agent="*Microsoft
      BITS*"

      | eval dom=domain(url), tld=tld(url), ent=shannon_entropy(host.path)

      | stats count AS freq sum(resp_bytes) AS vol BY host, dom

      | eventstats perc99(rarity_rank) AS p99

      | where rarity_rank>=p99 OR domain_age_days<90 OR reputation="low" OR ent>7.2 OR freq>Q3+1.5*IQR

      | alert'
- question: When a machine-learning classifier scores each BITS download URL on purely lexical features,
    do any score as high-confidence malicious?
  context: 'From a Stealth perspective, BITS is attractive because jobs live in the self-contained BITS
    database, leave no new files or registry keys, and ride firewall-permitted updater traffic; this question
    helps strip away that camouflage. Score every captured BITS URL with a Random Forest trained on first-party
    lexical features (URL length, path depth, parameter count, digit ratio, character entropy, IP-literal-in-host,
    hex sequences, and inferred age) so that no external lookup is required and detection works on novel
    infrastructure. Escalate high-confidence malicious predictions and emit the top-3 contributing features
    in the alert text so an analyst can validate the verdict. This complements TI matching and rare-domain
    scoring by catching algorithmically suspicious URLs even when reputation data is absent. Source evidence:
    A BITS job is created to download a file where either the source URL/IP is on a threat intelligence
    feed, or the file designated for execution upon job completion has a known malicious hash. Mission
    question (information requirement): Is the adversary maintaining persistence using BITS jobs?'
  answer_sources:
  - Windows Event ID 4688
  - Microsoft-Windows-Bits-Client/Operational Event ID 59
  - Microsoft-Windows-Bits-Client/Operational Event ID 16391
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: User Workstations, Application Servers, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = RandomForest.load('bits_url_lexical.pkl')\nfor url in bits_download_urls(last=90d):\n\
      \    f = lexical_features(url)  # len, path_depth, param_count, digit_ratio, entropy, ip_in_host,\
      \ hex, age\n    p, top3 = model.predict_proba(f)\n    if p_malicious > 0.85: alert(url, top3)"
- question: Was any BITS job configured to launch a program on completion or error via /SetNotifyCmdLine
    (bitsadmin) or -NotifyCmdLine/-NotificationCmdlet (PowerShell), especially targeting cmd.exe/powershell.exe
    or a user-writable path?
  context: 'From a Stealth perspective, BITS is attractive because jobs live in the self-contained BITS
    database, leave no new files or registry keys, and ride firewall-permitted updater traffic; this question
    helps strip away that camouflage. Alert when Event ID 4688 shows bitsadmin with /SetNotifyCmdLine
    (or a /create + /addfile + /resume chain) or Event ID 4104 shows Set-BitsTransfer/Start-BitsTransfer
    with -NotificationCmdlet/-NotifyCmdLine. This is the canonical BITS persistence/execution chain abused
    by UBoatRAT. Weight the alert higher when the notify target is cmd.exe or powershell.exe, points at
    a user-writable path, or the parent process is not a legitimate updater. A confirmed notify-command
    configuration is strong evidence of BITS being weaponized for relaunch-on-completion code execution
    and reboot-surviving persistence. Source evidence: A BITS job is configured via `bitsadmin.exe` or
    PowerShell to execute a specific program upon job completion or error, establishing a command-execution
    persistence mechanism. Mission question (information requirement): Is the adversary maintaining persistence
    using BITS jobs?'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: User Workstations, Domain Controllers, Member Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(source=WinEventLog:Security EventCode=4688 NewProcessName="*\\bitsadmin.exe" CommandLine="*SetNotifyCmdLine*")

      OR (source=WinEventLog:PowerShell EventCode=4104 ScriptBlockText IN ("*-NotifyCmdLine*","*-NotificationCmdlet*","*Start-BitsTransfer*"))

      | eval risk = if(match(notify_target,"(?i)cmd\.exe|powershell\.exe|\\users\\|\\temp\\|appdata"),"high","med")

      | alert'
- question: On which days did a user or host show an anomalous spike (z-score > 3) in bitsadmin/BITS-cmdlet
    usage, particularly combined with persistence parameters or preceding job errors?
  context: 'From a Stealth perspective, BITS is attractive because jobs live in the self-contained BITS
    database, leave no new files or registry keys, and ride firewall-permitted updater traffic; this question
    helps strip away that camouflage. Baseline daily bitsadmin and BITS-cmdlet invocation counts per user
    and per host; most endpoints register essentially zero interactive uses, so even small absolute counts
    can be extreme outliers. Flag days where persistence parameters (/SetNotifyCmdLine, long retry) appear
    and the count z-score exceeds 3. Profile the Failure state by counting preceding BITS job errors (Event
    ID 16392) that drive a notify command to re-fire. This statistical lens surfaces the sudden, out-of-character
    use of BITS that distinguishes adversary tradecraft from the steady cadence of legitimate updaters.
    Source evidence: A BITS job is configured via `bitsadmin.exe` or PowerShell to execute a specific
    program upon job completion or error, establishing a command-execution persistence mechanism. Mission
    question (information requirement): Is the adversary maintaining persistence using BITS jobs?'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: User Workstations, Domain Controllers, Member Servers'
  range: Last 90 days for baseline; evaluate daily
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4688 NewProcessName="*\\bitsadmin.exe"

      OR source=WinEventLog:PowerShell EventCode=4104 ScriptBlockText="*BitsTransfer*"

      | bin _time span=1d | stats count AS c BY user, host, _time

      | eventstats mean(c) AS mu stdev(c) AS sd BY user, host

      | eval z=(c-mu)/sd | where z>3 AND persistence_param=1 | alert'
- question: Does an unsupervised anomaly model flag any tokenized bitsadmin/PowerShell BITS command sequence
