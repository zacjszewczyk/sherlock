    IP to a critical data-processing server precedes process injection (Event ID 8) or critical file modification
    (Event ID 11) within 60 seconds ([A New Approach for Detecting Process Injection Using Memory Analysis](https://link.springer.com/article/10.1007/s10207-024-00836-w)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable runtime
    data manipulation; pivot to the responsible process and its parent lineage, the user/account context,
    the targeted binary, library, registry key, configuration value, or process memory region, the integrity/signature
    state of the affected image, and any preceding network access or subsequent host activity. A negative
    result helps rule out this particular manipulation vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, living-off-the-land, or in-memory-only
    tampering.'
