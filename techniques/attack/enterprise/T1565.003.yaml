name: 'T1565.003: Runtime Data Manipulation'
id: 062ff116-8850-44cf-87b2-ae9e31bb6205
description: 'This playbook helps an analyst investigate Runtime Data Manipulation -- adversary modification
  of systems so that data is altered as it is accessed, processed, and displayed to end users, threatening
  the integrity of business, financial, industrial-control, and proprietary data and undermining organizational
  decision-making. Under the Impact tactic, an adversary alters or replaces critical application binaries
  and libraries, tampers with registry keys or configuration files that govern how an application validates/processes/displays
  data, injects code into the memory of running critical processes (e.g., sqlservr.exe, oracle.exe, custom
  financial software), forces a critical process to rewrite its own image or loaded DLLs, or rides an
  inbound connection from a non-authorized internal source into anomalous file/memory activity on a critical
  server. The playbook guides the analyst across several investigative angles: cryptographic hash/metadata
  allowlist baselining and code-signature re-verification of critical images; statistical scoring of modification
  frequency, command-line entropy, write volume, and rare injection/connection pairs; remote-thread and
  temporal API-chain injection detection; loaded-DLL and self-image write correlation; non-allowlisted
  inbound connection correlation with subsequent host activity; and machine-learning models (Random Forest/Gradient
  Boosting write classification, DeepLog-style LSTM log-sequence analysis, One-Class SVM/Isolation Forest
  write-anomaly detection, and GraphSAGE/provenance-graph node anomaly detection). Detection methods combine
  symbolic-logic rules, statistical baselining, and machine learning applied to Windows Security and Sysmon
  events (IDs 1, 3, 7, 8, 11, 13, 15, 4657, 4663, 4688), Linux auditd syscalls, macOS unified logs/osquery,
  and Zeek conn.log, so the analyst can corroborate suspected runtime data manipulation against file integrity,
  code signatures, process lineage, in-memory injection, and network provenance.'
