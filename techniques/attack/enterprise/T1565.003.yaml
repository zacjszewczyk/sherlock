questions:
- question: '[Impact] Hash and allowlist monitoring: Can you determine whether a file representing a critical
    application binary or library is modified or replaced by a process that is not an authorized software
    installation or patching utility, leaving the application to run with altered runtime behavior. --
    specifically, using the ''Hash and allowlist monitoring'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary manipulates runtime data
    by modifying systems so that data is altered as it is accessed, processed, and displayed -- threatening
    data integrity and corrupting downstream business and decision-making processes. This evidence focuses
    on the condition that a file representing a critical application binary or library is modified or
    replaced by a process that is not an authorized software installation or patching utility, leaving
    the application to run with altered runtime behavior. This Symbolic Logic approach works as follows:
    Maintain a write-protected baseline of cryptographic hashes plus metadata (size, owner, permissions,
    mtime/ctime) for every critical application binary/library, monitor Sysmon Event ID 11 writes and
    Windows Event ID 4663 access in those directories, correlate to Windows Event ID 4688 process lineage,
    and alert when a hash/metadata mismatch occurs or the writer is not on the approved installer/updater
    allowlist ([Tripwire, Kim & Spafford](https://dl.acm.org/doi/10.1145/191177.191183)). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable runtime data manipulation;
    pivot to the responsible process and its parent lineage, the user/account context, the targeted binary,
    library, registry key, configuration value, or process memory region, the integrity/signature state
    of the affected image, and any preceding network access or subsequent host activity. A negative result
    helps rule out this particular manipulation vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, living-off-the-land, or in-memory-only
    tampering.'
