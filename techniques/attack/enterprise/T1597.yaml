    dark-web markets, and cybercrime forums -- to plan targeting, scope follow-on reconnaissance, or buy
    valid credentials and access for initial access (MITRE T1597, Search Closed Sources). Because the
    search itself happens off your network, detection focuses on the downstream use of that purchased
    information against your perimeter and identities. This evidence focuses on the condition that a successful
    login (Windows Event ID 4624) that exhibits multiple anomalous properties simultaneously when compared
    to the user''s established behavioral baseline, such as originating from a rare geographic location,
    a new device, or occurring at an atypical time. This Machine Learning approach works as follows: Train
    an unsupervised outlier model (Isolation Forest or a variational autoencoder) per user or role-group
    on features hour_of_day, day_of_week, source-ASN hash, and source-country rarity; high anomaly scores
    indicate logins dissimilar to learned normal behavior. Surface the top-3 contributing features in
    the alert and reduce false positives by fusing the unsupervised score with an analyst-labeled supervised
    layer retrained daily (Veeramachaneni et al.; Mirsky et al.). A positive result -- a rule match, statistical
    outlier, or model alert -- is a strong signal that an adversary is operationalizing closed-source
    intelligence (e.g., breach-corpus credentials, dark-web listings, or knowledge of non-public assets);
    pivot to the implicated account(s), source IP/ASN/geo, target host or service, and the authentication
    or connection outcome, force credential resets where warranted, and correlate with any subsequent
    access. A negative result helps rule out this particular vector but should be corroborated with the
    other questions in this playbook, since a single method can miss low-and-slow, distributed, or first-seen
    activity. Citations: [Veeramachaneni et al.](https://people.csail.mit.edu/kalyan/AI2_Paper.pdf); [Mirsky
    et al.](https://doi.org/10.14722/ndss.2018.23204).'
