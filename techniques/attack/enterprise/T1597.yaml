name: 'T1597: Search Closed Sources'
id: c506876b-7cf5-4030-8a0d-5ba7391603aa
description: 'This playbook helps an analyst investigate whether an adversary has searched and gathered
  information about the organization from closed (paid, private, or otherwise not freely available) sources
  -- such as commercial threat-intelligence feeds, private breach databases, and dark-web or cybercrime
  marketplaces -- and is now operationalizing that intelligence against the environment (MITRE ATT&CK
  T1597, Search Closed Sources). Because the closed-source search occurs off-network, the hunt concentrates
  on the observable downstream effects: authentication attempts (Windows Event ID 4624 success / 4625
  failure) using usernames found in a pre-ingested breach corpus from external IPs; password-spraying
  fan-out where one external source touches many unique usernames with low per-account attempts; successful
  logins to long-dormant accounts reactivated with purchased valid credentials; external connection attempts
  (Zeek conn.log states S0/REJ/RSTO) to curated non-public assets that should never receive outside traffic;
  logins that simultaneously violate a user''s geo/ASN/device/time baseline; and direct exposure of the
  organization''s credentials, data, or access for sale on closed sources matched against the live Active
  Directory inventory. Detection methods combine deterministic symbolic-logic rules (breach-corpus joins,
  dormant-account watchlists, reference-set rules for non-public assets, impossible-travel/concurrent-session
  checks, AD-to-dump matching), statistical baselining (z-scores of failed-logon volume, Shannon entropy
  of targeted username sets, Wald''s SPRT/Threshold Random Walk on first-contact outcomes, per-user inter-login-time
  and additive per-feature risk scoring, and tempo baselining of org mentions across closed sources),
  and machine learning (supervised hijack classifiers with feature attribution, DBSCAN clustering of authentication
  events, LSTM login-sequence modeling, autoencoder/One-Class perimeter anomaly scoring, unsupervised
  behavioral outlier models, and supervised relevance classification of dark-web listings), applied across
  Windows Security events, Zeek conn/notice logs, Active Directory account inventory, and threat-intelligence/breach-corpus
  feeds so the analyst can corroborate suspected closed-source reconnaissance against identity, source,
  and asset context.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
