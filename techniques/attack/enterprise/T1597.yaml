  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Screen authentication events against pre-ingested breach corpus and alert on external matches
      (Symbolic Logic)

      source IN [Windows Event ID 4624, Windows Event ID 4625, Zeek conn.log]

      | approach: Maintain a pre-ingested breach corpus (e.g., HaveIBeenPwned-style lists, dark-web dumps)
      of exposed usernames/credentials, per NIST SP 800-63B Sec 5.1.1.2

      | correlate over NAI: Externally-facing authentication services (e.g., VPN, OWA, M365), Domain Controllers,
      Cloud IAM services

      | emit alert with contributing fields and entity context (account, source IP/ASN/geo, target host/service,
      outcome)'
  - technology: Zeek/pseudocode
    query: '# Screen authentication events against pre-ingested breach corpus and alert on external matches
      (Zeek view)

      watch conn.log/notice.log for external sources touching the named assets/identities

      | join authentication outcomes (4624 success / 4625 failure) by source IP

      | evaluate failed:successful ratio, unique-username fan-out, and asset sensitivity

      | emit candidates with source IP/ASN/geo, target, counts, and outcome'
- question: '[Reconnaissance] Z-score baseline of external failed-logon volume per breached account: Can
    you determine whether a successful (Windows Event ID 4624) or failed (Windows Event ID 4625) login
    attempt using a username that is present on a list of credentials known to be exposed in a third-party
    data breach, originating from an external IP address. -- specifically, using the ''Z-score baseline
    of external failed-logon volume per breached account'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary searches and gathers
    information about the victim from closed sources -- paid threat-intelligence feeds, private databases,
    dark-web markets, and cybercrime forums -- to plan targeting, scope follow-on reconnaissance, or buy
    valid credentials and access for initial access (MITRE T1597, Search Closed Sources). Because the
    search itself happens off your network, detection focuses on the downstream use of that purchased
    information against your perimeter and identities. This evidence focuses on the condition that a successful
    (Windows Event ID 4624) or failed (Windows Event ID 4625) login attempt using a username that is present
    on a list of credentials known to be exposed in a third-party data breach, originating from an external
    IP address. This Statistical Method approach works as follows: For each breach-listed account, establish
    a 30-day baseline (mean, stddev) of failed-login counts (4625) from external IPs. Using a sliding
    24-hour window, compute the z-score of the current failed-login count against the baseline and alert
    if z>3 (Ghorbani et al.). Also profile the success/fail STATE: a sudden transition from a burst of
    4625 failures to a 4624 success on a breach-listed account within the same window is a high-confidence
    credential-stuffing-then-takeover signal. Derive the per-environment z-threshold from the empirical
    99th percentile rather than assuming normality. A positive result -- a rule match, statistical outlier,
    or model alert -- is a strong signal that an adversary is operationalizing closed-source intelligence
    (e.g., breach-corpus credentials, dark-web listings, or knowledge of non-public assets); pivot to
    the implicated account(s), source IP/ASN/geo, target host or service, and the authentication or connection
    outcome, force credential resets where warranted, and correlate with any subsequent access. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss low-and-slow, distributed, or first-seen activity. Citations:
    [Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5).'
