    or breach-corpus accounts match active internal identities. Detecting this exposure enables pre-emptive
    credential resets and asset hardening before the adversary leverages the purchased data. -- specifically,
    using the ''Match ingested breach/dark-web credential dumps against the live AD account inventory''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary searches and gathers
    information about the victim from closed sources -- paid threat-intelligence feeds, private databases,
    dark-web markets, and cybercrime forums -- to plan targeting, scope follow-on reconnaissance, or buy
    valid credentials and access for initial access (MITRE T1597, Search Closed Sources). Because the
    search itself happens off your network, detection focuses on the downstream use of that purchased
    information against your perimeter and identities. This evidence focuses on the condition that the
    organization''s credentials, data, or access are observed being offered for sale on closed sources
    (dark-web markets, cybercrime forums, paid breach dumps), or breach-corpus accounts match active internal
    identities. Detecting this exposure enables pre-emptive credential resets and asset hardening before
    the adversary leverages the purchased data. This Symbolic Logic approach works as follows: Continuously
    ingest breach corpuses and dark-web credential dumps and join them against the live Active Directory
    user inventory; alert and force a password reset for any active internal identity whose username/credential
    appears in a newly observed dump (NIST SP 800-63B; Thomas et al.). This deterministic match runs on
    internal identity data and does not depend on real-time external lookups at authentication time. A
    positive result -- a rule match, statistical outlier, or model alert -- is a strong signal that an
    adversary is operationalizing closed-source intelligence (e.g., breach-corpus credentials, dark-web
    listings, or knowledge of non-public assets); pivot to the implicated account(s), source IP/ASN/geo,
    target host or service, and the authentication or connection outcome, force credential resets where
    warranted, and correlate with any subsequent access. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss low-and-slow, distributed, or first-seen activity. Citations: [NIST SP 800-63B](https://pages.nist.gov/800-63-3/sp800-63b.html);
    [Thomas et al.](https://research.google/pubs/pub46437/).'
