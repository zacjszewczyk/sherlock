questions:
- question: '[Reconnaissance] Screen authentication events against pre-ingested breach corpus and alert
    on external matches: Can you determine whether a successful (Windows Event ID 4624) or failed (Windows
    Event ID 4625) login attempt using a username that is present on a list of credentials known to be
    exposed in a third-party data breach, originating from an external IP address. -- specifically, using
    the ''Screen authentication events against pre-ingested breach corpus and alert on external matches''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary searches and gathers
    information about the victim from closed sources -- paid threat-intelligence feeds, private databases,
    dark-web markets, and cybercrime forums -- to plan targeting, scope follow-on reconnaissance, or buy
    valid credentials and access for initial access (MITRE T1597, Search Closed Sources). Because the
    search itself happens off your network, detection focuses on the downstream use of that purchased
    information against your perimeter and identities. This evidence focuses on the condition that a successful
    (Windows Event ID 4624) or failed (Windows Event ID 4625) login attempt using a username that is present
    on a list of credentials known to be exposed in a third-party data breach, originating from an external
    IP address. This Symbolic Logic approach works as follows: Maintain a pre-ingested breach corpus (e.g.,
    HaveIBeenPwned-style lists, dark-web dumps) of exposed usernames/credentials, per NIST SP 800-63B
    Sec 5.1.1.2. Query all authentication events (Windows Event IDs 4624 success / 4625 failure) where
    the source IP is external (joined from Zeek conn.log) AND the target username appears on the breach
    list; generate a high-severity alert on any match. Treat a SUCCESSFUL (4624) external login by a breach-listed
    account as critical (likely use of purchased credentials). Independently alert when any account exceeds
    the 800-63B throttle limit (e.g., >100 consecutive failed 4625 from external sources), capturing the
    credential-stuffing failure-mode signal. A positive result -- a rule match, statistical outlier, or
    model alert -- is a strong signal that an adversary is operationalizing closed-source intelligence
    (e.g., breach-corpus credentials, dark-web listings, or knowledge of non-public assets); pivot to
    the implicated account(s), source IP/ASN/geo, target host or service, and the authentication or connection
    outcome, force credential resets where warranted, and correlate with any subsequent access. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss low-and-slow, distributed, or first-seen activity. Citations:
    [NIST SP 800-63B](https://pages.nist.gov/800-63-3/sp800-63b.html).'
  answer_sources:
