name: "T1071.004: DNS"
id: "a7057ec6-5f91-4174-9673-00bd13495098"
description: "Investigate DNS activity that indicates command-and-control over DNS, including known C2 domain resolution, fast-flux characteristics, beaconing cadence, tunneling-style query patterns, and endpoint processes initiating suspicious DNS lookups. This playbook focuses on low-prevalence, high-entropy, or periodic DNS behaviors and corroborates network evidence with host telemetry to validate DNS-based C2 or tunneling."
type: "technique"
related:
- "TA0011: Command and Control"
contributors:
- "Zachary Szewczyk"
created: "2026-02-18"
modified: "2026-02-18"
version: "1.0"
tags: "none"
questions:
- question: "Are internal hosts resolving or connecting to known C2 domains or IPs identified by DNS intelligence within the last 90 days?"
  context: "Matching internal DNS lookups and immediate outbound connections against curated C2 intelligence provides a high-confidence signal that DNS is being used for command-and-control. This question validates whether DNS responses (including CNAME chains) or follow-on connections map to known malicious infrastructure, which is a strong indicator of DNS-based C2." 
  answer_sources:
  - "Zeek dns.log"
  - "Zeek intel.log"
  - "Zeek conn.log"
  - "NAI: Network Egress Points"
  - "NAI: Internal DNS Resolvers"
  - "NAI: DNS Forwarders"
  range: "Last 90 days"
  queries:
  - "Zeek dns.log -> normalize qname to registered_domain; join with intel.log on domain/ip; flag matching answers and CNAME chains"
  - "Zeek conn.log -> join dst_ip to suspicious DNS answers within 5 minutes of response"

- question: "Do any newly seen domains show fast-flux or dynamic DNS traits such as low TTL, high answer churn, or frequent CNAME indirection?"
  context: "Disposable or fast-flux DNS infrastructure is common in DNS-based C2. This question checks for new domains with rapid answer changes and low TTLs that suggest adversary-controlled DNS agility rather than normal business infrastructure." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Network Egress Points"
  - "NAI: Internal DNS Resolvers"
  - "NAI: DNS Forwarders"
  range: "Last 90 days"
  queries:
  - "Zeek dns.log -> group by registered_domain; compute TTL, answer churn, CNAME depth, first_seen; flag TTL<300 and churn>=3/hour"

- question: "Which rare, low-prevalence domains have low TTL and high churn or NXDOMAIN rates compared to baseline?"
  context: "Low-prevalence domains combined with short TTLs and churn often indicate disposable C2 domains. This question uses statistical baselines to distinguish suspicious low-visibility domains from common benign DNS." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Network Egress Points"
  - "NAI: Internal DNS Resolvers"
  range: "Last 30 days"
  queries:
  - "Zeek dns.log -> rolling windows; compute unique_hosts, query_volume, median_TTL, churn_rate, NXDOMAIN_rate; flag low_prevalence + low_TTL + (churn_top_1pct or NXDOMAIN>30%)"

- question: "Do newly seen domains score as likely C2 based on DNS feature-based classification?"
  context: "A supervised classifier helps prioritize domains that resemble known C2 infrastructure based on DNS features such as entropy, TTL, CNAME depth, and response code mix. This question surfaces high-risk domains that merit analyst review." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Network Egress Points"
  - "NAI: Internal DNS Resolvers"
  range: "Last 90 days"
  queries:
  - "ML pipeline -> train classifier on labeled domains; score new domains daily; alert when probability exceeds tuned threshold"

- question: "Are there DNS query patterns matching known DNS C2 tool signatures with persistent beaconing intervals?"
  context: "Signature-based detections can catch established DNS C2 tooling. This question checks for repeated TXT or patterned queries that persist across multiple beacon intervals to reduce false positives while detecting real C2 beacons." 
  answer_sources:
  - "Zeek dns.log"
  - "Zeek conn.log"
  - "NAI: Network Egress Points"
  - "NAI: Internal DNS Resolvers"
  range: "Last 90 days"
  queries:
  - "Zeek dns.log -> apply signature regex on qname/query_type/CNAME depth; require >=3 consecutive intervals"

- question: "Do hosts issue bursty, structured TXT/NULL queries with stable label lengths consistent with payload chunking?"
  context: "DNS tunneling often encodes data into sequential subdomain labels and uses TXT/NULL records. This question targets high-volume, tight-band label-length patterns that indicate structured payload exchange rather than normal DNS use." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Network Egress Points"
  - "NAI: Internal DNS Resolvers"
  range: "Last 90 days"
  queries:
  - "Zeek dns.log -> filter TXT/NULL; group by host+registered_domain; detect >=20 queries/30m with label_length variance <=3"

- question: "Which host-domain pairs have an unusually high ratio of TXT/NULL/CNAME queries combined with high periodicity or distinct subdomain rates?"
  context: "Atypical DNS record usage and stable cadences are hallmarks of DNS beaconing or tunneling. This question uses percentiles to identify outlier behaviors without needing explicit signatures." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Network Egress Points"
  - "NAI: Internal DNS Resolvers"
  range: "Last 30 days"
  queries:
  - "Zeek dns.log -> per host+domain per hour compute atypical_ratio, inter_query_cv, distinct_subdomain_rate; flag ratio>98th pct and (cv<0.3 or distinct_rate>99th pct)"

- question: "Do DNS query sequences show low-likelihood patterns indicative of C2 beacons when modeled as behavior sequences?"
  context: "Sequence modeling can capture subtle, repetitive C2 behaviors that evade simple rules. This question evaluates rolling windows for anomalous transitions in query type, timing, and label structure." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Network Egress Points"
  - "NAI: Internal DNS Resolvers"
  range: "Last 90 days"
  queries:
  - "ML sequence model -> score 30-minute windows per host; alert on low-likelihood sequences dominated by repetitive TXT/CNAME"

- question: "Are there DNS queries with unusually long or high-entropy labels consistent with encoded payloads?"
  context: "High-entropy or very long labels are characteristic of DNS tunneling and encoded data transfer. This question flags outlier label lengths or entropy while allowing for known benign exceptions." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Internal DNS Resolvers"
  - "NAI: Endpoint Devices"
  - "NAI: Network Egress Points"
  range: "Last 90 days"
  queries:
  - "Zeek dns.log -> flag qname_length>200 or max_label_length>=50 with base32/base64/hex-like charset; exclude allowlisted domains"

- question: "Do hosts generate bursts of distinct, high-entropy labels to a single domain with NXDOMAIN or empty responses?"
  context: "Bursting high-entropy labels with empty responses indicates query-name payload upload. This question isolates host-domain pairs exhibiting tunneling-like bursts rather than benign resolution." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Internal DNS Resolvers"
  - "NAI: Endpoint Devices"
  - "NAI: Network Egress Points"
  range: "Last 90 days"
  queries:
  - "Zeek dns.log -> group by host+domain; detect >=30 queries/10m with high-entropy distinct labels and NXDOMAIN/empty responses"

- question: "Which hosts have high-entropy DNS query rates that exceed their role-based baselines?"
  context: "Role-based baselines help differentiate normal services from compromised endpoints. This question identifies hosts whose high-entropy DNS rates spike well beyond historical baselines, suggesting tunneling or covert C2." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Internal DNS Resolvers"
  - "NAI: Endpoint Devices"
  - "NAI: Network Egress Points"
  range: "Last 30 days"
  queries:
  - "Zeek dns.log -> compute Shannon entropy per query; baseline by subnet/role; alert when rate >99th pct and >10x prior 30-day baseline"

- question: "Do anomaly detection clusters highlight persistent host-domain pairs with high-entropy label patterns?"
  context: "Clustered anomalies across multiple windows indicate structured misuse rather than transient spikes. This question uses anomaly clustering to elevate persistent DNS tunneling signals." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Internal DNS Resolvers"
  - "NAI: Endpoint Devices"
  - "NAI: Network Egress Points"
  range: "Last 90 days"
  queries:
  - "ML anomaly detector -> features entropy/length/label_count/query_rate/response_code; alert on persistent anomalous clusters per host+domain"

- question: "Is any host sending extremely high volumes of DNS queries to a single domain over short periods?"
  context: "High-volume single-domain querying can indicate tunnel keepalives or aggressive beaconing. This question flags sudden surges to non-allowlisted domains and checks if activity is isolated to a single host." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Client Network Subnets"
  - "NAI: Internal DNS Resolvers"
  range: "Last 90 days"
  queries:
  - "Zeek dns.log -> group by host+domain; alert on >500 queries/10m to non-allowlisted domain; list peer hosts in prior 24h"

- question: "Do any host-domain pairs show fixed-cadence DNS querying consistent with beaconing?"
  context: "C2 beacons often communicate on steady intervals with minor jitter. This question detects sustained fixed cadences that persist long enough to indicate automated beaconing rather than normal retry behavior." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Client Network Subnets"
  - "NAI: Internal DNS Resolvers"
  range: "Last 90 days"
  queries:
  - "Zeek dns.log -> compute inter-query intervals; flag cadence 30/60/120s ±10% sustained >=20m and >=40 queries"

- question: "Which host-domain pairs exhibit statistically strong periodicity with elevated query volume?"
  context: "Autocorrelation and low variability in inter-arrival times indicate automated beaconing. This question quantifies periodicity strength and combines it with volume to prioritize likely C2 activity." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Client Network Subnets"
  - "NAI: Internal DNS Resolvers"
  range: "Last 30 days"
  queries:
  - "Zeek dns.log -> aggregate per minute; compute inter-arrival CV and autocorrelation; flag CV<0.3 with autocorr above threshold and volume>99th pct"

- question: "Do time-series forecasts show sustained DNS query volume spikes that exceed expected bounds for a host-domain pair?"
  context: "Forecast-based residuals can detect new, sustained beaconing without hard thresholds. This question highlights persistent deviations above modeled baselines." 
  answer_sources:
  - "Zeek dns.log"
  - "NAI: Client Network Subnets"
  - "NAI: Internal DNS Resolvers"
  range: "Last 90 days"
  queries:
  - "Forecast model -> per host+domain volume; alert when observed exceeds upper bound for 3 consecutive windows"

- question: "Are there long DNS queries with NXDOMAIN or empty responses indicating data upload behavior?"
  context: "Tunneling frequently uses long query names while receiving minimal response data. This question flags long queries with empty responses to identify possible query-name payload transfer." 
  answer_sources:
  - "Zeek dns.log"
  - "Zeek conn.log"
  - "NAI: Network Egress Points"
  - "NAI: Internal DNS Resolvers"
  range: "Last 90 days"
  queries:
  - "Zeek dns.log -> filter qname_length>80 and (NXDOMAIN or NOERROR with empty answers); focus on TXT/NULL/CNAME"

- question: "Do sequential queries to the same domain show fixed-step increases in QNAME length with empty responses?"
  context: "Fixed-step length changes often indicate chunked data transfer via DNS. This question looks for sequential, patterned QNAME lengths coupled with empty responses." 
  answer_sources:
  - "Zeek dns.log"
  - "Zeek conn.log"
  - "NAI: Network Egress Points"
  - "NAI: Internal DNS Resolvers"
  range: "Last 90 days"
  queries:
  - "Zeek dns.log -> sequence qname_length per host+domain; flag fixed-size steps with NXDOMAIN/empty NOERROR"

- question: "Which host-domain pairs have anomalously large DNS query sizes with minimal response content compared to baseline?"
  context: "Combining query size with response scarcity helps distinguish tunneling from misconfiguration. This question uses percentile thresholds to identify high-risk byte patterns." 
  answer_sources:
  - "Zeek dns.log"
  - "Zeek conn.log"
  - "NAI: Network Egress Points"
  - "NAI: Internal DNS Resolvers"
  range: "Last 30 days"
  queries:
  - "Zeek dns.log + conn.log -> compute query-size proxy and empty-answer rate per host+domain; flag top 1% for both"

- question: "Do clustered DNS transactions indicate a structured protocol over DNS for specific host-domain pairs?"
  context: "Clustering can reveal structured DNS tunneling protocols even when total volume is modest. This question identifies tight clusters that persist over time and diverge from baseline traffic." 
  answer_sources:
  - "Zeek dns.log"
  - "Zeek conn.log"
  - "NAI: Network Egress Points"
  - "NAI: Internal DNS Resolvers"
  range: "Last 90 days"
  queries:
  - "ML clustering -> features query_type, qname_length, entropy, response_code, timing; alert on persistent tight clusters per host+domain"

- question: "Are high-risk Windows processes initiating DNS queries to non-allowlisted or suspicious domains?"
  context: "DNS queries from scripting or LOLBin processes are strong indicators of malicious activity, especially when targeting newly seen or high-entropy domains. This question ties DNS activity to process lineage for actionable triage." 
  answer_sources:
  - "Windows Sysmon Event ID 22"
  - "Windows Sysmon Event ID 1"
  - "Windows Sysmon Event ID 3"
  - "NAI: Endpoint Devices (Workstations and Servers)"
  - "NAI: Domain Controllers"
  range: "Last 90 days"
  queries:
  - "SIEM (Sysmon) -> filter EventID 22 with Image in high-risk list or user-writable paths; join EventID 1 for parent lineage; enrich with DNS domain risk"

- question: "Do unsigned or untrusted processes perform DNS queries that coincide with suspicious domain traits or periodicity?"
  context: "Unsigned binaries performing DNS lookups to suspicious domains can indicate malware or unauthorized tooling. This question correlates signer status, DNS query risk, and concurrent network connections." 
  answer_sources:
  - "Windows Sysmon Event ID 22"
  - "Windows Sysmon Event ID 1"
  - "Windows Sysmon Event ID 3"
  - "NAI: Endpoint Devices (Workstations and Servers)"
  range: "Last 90 days"
  queries:
  - "SIEM (Sysmon) -> EventID 22 where signer=unsigned; correlate with high-entropy/low-prevalence domains and Sysmon EventID 3 outbound connections"

- question: "Which process-to-domain pairs are extremely rare across the fleet and on the host itself?"
  context: "Rare process-domain combinations are strong outliers that often indicate compromise, especially when paired with low-prevalence domains. This question builds a fleet-wide baseline to highlight first-seen relationships." 
  answer_sources:
  - "Windows Sysmon Event ID 22"
  - "NAI: Endpoint Devices (Workstations and Servers)"
  range: "Last 30 days"
  queries:
  - "SIEM (Sysmon) -> baseline process_image to registered_domain frequency over 30 days; flag first-ever pairs and top 1% rarity"

- question: "Do endpoint DNS chains score as high risk when combining process lineage, command-line, and DNS behavior features?"
  context: "Combining endpoint process context with DNS query behavior identifies multi-stage chains (e.g., Office -> PowerShell -> periodic TXT queries) that represent high-confidence DNS C2 activity." 
  answer_sources:
  - "Windows Sysmon Event ID 1"
  - "Windows Sysmon Event ID 22"
  - "Windows Sysmon Event ID 3"
  - "NAI: Endpoint Devices (Workstations and Servers)"
  range: "Last 90 days"
  queries:
  - "ML model -> features from Sysmon 1/22/3; score chains by model; alert on high-risk sequences with top feature contributions"

- question: "Are Linux hosts executing DNS utilities or tunneling-capable tools correlated with DNS spikes from the same host?"
  context: "Auditd execution logs can confirm local tooling associated with DNS tunneling. This question correlates host execution of tools like dig, nslookup, iodine, or dnscat2 with contemporaneous DNS anomalies in network logs." 
  answer_sources:
  - "Linux auditd logs"
  - "Zeek dns.log"
  - "NAI: Linux servers"
  - "NAI: Network Egress Points"
  range: "Last 90 days"
  queries:
  - "Auditd execve -> match dns tools and tunneling utilities; join to Zeek dns.log on host IP and time window"

- question: "Do macOS scripting environments generate DNS requests to domains with suspicious characteristics?"
  context: "macOS scripting or automation frameworks are often used by attackers for DNS C2. This question ties Unified Log DNS requests to high-entropy or low-prevalence domains observed in network telemetry." 
  answer_sources:
  - "macOS Unified Log"
  - "Zeek dns.log"
  - "NAI: macOS endpoints"
  - "NAI: Network Egress Points"
  range: "Last 90 days"
  queries:
  - "macOS unified log -> filter dns_request events from osascript/AppleScript/shell/curl; enrich with domain risk from Zeek dns.log"

- question: "Do ESXi hosts show abnormal outbound DNS destinations or periodic querying that deviates from their baseline?"
  context: "ESXi management hosts typically have stable DNS behavior. Deviations toward low-prevalence or external domains may indicate compromise or malicious VIB activity. This question baselines ESXi DNS destinations and flags anomalies." 
  answer_sources:
  - "ESXi syslog (/var/log/syslog.log)"
  - "Zeek dns.log"
  - "NAI: ESXi management networks"
  range: "Last 30 days"
  queries:
  - "ESXi syslog + Zeek dns.log -> baseline DNS destinations and volumes per ESXi host; alert on new external low-prevalence domains or periodic queries"
