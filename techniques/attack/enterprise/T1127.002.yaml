questions:
- question: 'Using deterministic rule logic, can you determine whether ''Match ClickOnce downloads to
    TI'' reveals ClickOnce proxy-execution abuse for the Stealth tactic? Specifically: Correlate Zeek
    HTTP, DNS, conn, and file records for requests ending in .application or .appref-ms with threat intelligence
    on domains, IPs, and hashes, and alert when a match is found; treat manifests fetched from raw-IP
    or newly-registered domains as high severity per [Malicious URL Detection: A Survey, Sahoo et al](https://arxiv.org/abs/1701.07179).'
  context: 'Tactic context (Stealth): the adversary abuses ClickOnce to proxy execution of .NET code through
    trusted Windows utilities (dfsvc.exe/dfshim.dll) with only limited, non-administrative permissions,
    which directly serves the Stealth goal. Information requirement: Is the adversary using ClickOnce
    applications for defense evasion? Evidence under investigation: A ClickOnce .application or .appref-ms
    download is observed in Zeek, and the retrieved content, destination, or follow-on host activity matches
    threat intelligence or known malicious ClickOnce infrastructure. Track Volume (manifest/payload bytes),
    Frequency (ClickOnce fetches per host per day), and State (HTTP 200 success vs 4xx/blocked) as distinct
    signals. Approach (Match ClickOnce downloads to TI): Correlate Zeek HTTP, DNS, conn, and file records
    for requests ending in .application or .appref-ms with threat intelligence on domains, IPs, and hashes,
    and alert when a match is found; treat manifests fetched from raw-IP or newly-registered domains as
    high severity per [Malicious URL Detection: A Survey, Sahoo et al](https://arxiv.org/abs/1701.07179).
    A positive result indicates ClickOnce activity inconsistent with sanctioned deployments (e.g., a TI/infrastructure
    match, the canonical dfshim LOLBin command, an unexpected dfsvc child, a rapid download-to-execution
    chain, or a Startup .appref-ms persistence artifact); a negative result means the observed activity
    matches known-good ClickOnce baselines or no ClickOnce activity is present. Pivot from any hit to
    the originating user, host, parent process, serving domain, and any follow-on execution or persistence.
    Investigate the named area of interest: User Workstations, Internet Gateway/Proxy Servers, DNS Resolvers,
    SIEM/Threat Intelligence Platform.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: User Workstations, Internet Gateway/Proxy Servers, DNS Resolvers, SIEM/Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Symbolic: correlate ClickOnce fetches with threat intel

      events = Zeek.http + Zeek.dns + Zeek.conn + Zeek.files

      WHERE uri ENDSWITH (''.application'',''.appref-ms'')

      ENRICH host, resolved_ip, file_hash WITH ti_feeds

      ALERT IF ti_match(domain|ip|hash)

      SET severity=high IF host IS raw_ip OR domain_age < 30d'
