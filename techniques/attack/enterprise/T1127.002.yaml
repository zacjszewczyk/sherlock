name: 'T1127.002: Trusted Developer Utilities Proxy Execution: ClickOnce'
id: 0a49bf79-a001-4638-9651-b2198de9e61b
description: 'This playbook helps an analyst determine whether an adversary is abusing ClickOnce applications
  (.application and .appref-ms files) to proxy execution of code through trusted Windows utilities (T1127.002).
  ClickOnce deployments launch .NET payloads as child processes of dfsvc.exe with limited permissions
  and no administrative rights, making them attractive for stealthy, privilege-light proxy execution.
  The playbook correlates network telemetry (Zeek http/dns/conn/files logs capturing manifest and payload
  downloads) with host telemetry (Windows Event ID 4688/4663/7045, Sysmon 1/7/11) to surface several abuse
  paths: ClickOnce downloads that match threat intelligence or risky infrastructure; the canonical LOLBin
  command rundll32.exe dfshim.dll,ShOpenVerbApplication; dfsvc.exe spawning non-allowlisted or scripting-host
  children; download-to-execution chains where a manifest fetch from a disallowed domain is quickly followed
  by dfsvc/rundll32 execution; and .appref-ms files written to user Startup folders for persistence. Detection
  blends symbolic-logic rules, statistical baselining (prevalence, percentile, entropy, failure-rate and
  time-series profiling), and machine learning (Gradient Boosting, Isolation Forest, DBSCAN, k-means,
  BERT command-line embeddings, SARIMA forecasting, provenance-graph GNNs, and active learning) to produce
  explainable, evasion-resistant alerts spanning the Stealth and Execution tactics.'
type: technique
