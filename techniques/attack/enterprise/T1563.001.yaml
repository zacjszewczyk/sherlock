name: 'T1563.001: SSH Hijacking'
id: 9f6d03ba-dd21-4b94-8649-d6ab0f53ce2a
description: 'This playbook helps an analyst investigate whether an adversary has hijacked a legitimate
  user''s Secure Shell (SSH) session to move laterally within a Linux or macOS environment (MITRE ATT&CK
  T1563.001), as part of the Lateral Movement tactic. Rather than authenticating with stolen credentials,
  the adversary rides an already-established, trusted SSH connection -- typically by abusing an active
  SSH agent socket ($SSH_AUTH_SOCK or /tmp/ssh-*), an OpenSSH control socket used for connection multiplexing
  (-M/-S/ControlMaster/ControlPath), or root access on a compromised jump host -- so the pivot leaves
  little or no new authentication evidence. The hunt spans several complementary angles: network-level
  SSH connections (Zeek conn.log/ssh.log) involving threat-intel or watchlisted hosts and pre-hijack failed-authentication
  bursts; endpoint process-creation evidence of control-socket flags and cross-UID agent-socket access
  (Linux auditd EXECVE/SYSCALL, Windows Event ID 4688, Sysmon Event ID 1, macOS unified logs); anomalous
  SSH fan-out and connections to rare destinations indicating post-hijack lateral movement; recon/credential-access/lateral
  tools spawned as children of sshd on destination hosts; and SSH connections that violate access-control
  policy or invert a host''s established client/server role. Detection methods combine symbolic-logic
  rules, statistical baselining and change-point detection, and machine-learning models (classification,
  clustering, perplexity scoring, and provenance-graph learning) so the analyst can corroborate suspected
  SSH session hijacking across network flows, process lineage, authentication evidence (or its absence),
  and behavioral role baselines.'
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
