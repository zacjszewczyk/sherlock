questions:
- question: '[Lateral Movement] Match SSH endpoints to TI: Can you determine whether An SSH connection
    (TCP port 22) occurs involving a host (source or destination) on an active threat-intel watchlist
    or an internal high-severity alert list, consistent with session-takeover infrastructure or a compromised
    jump host. Failure-mode variant: a burst of failed SSH authentications (ssh.log auth_success=F) to/from
    a watchlisted host. -- specifically, using the ''Match SSH endpoints to TI'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary hijacks a legitimate
    user''s active SSH session -- by abusing the SSH agent socket, an OpenSSH control (multiplexing) socket,
    or root access on a compromised host -- to pivot to other systems without generating a new authentication
    event, which makes the movement stealthy and hard to attribute. This evidence focuses on the condition
    that An SSH connection (TCP port 22) occurs involving a host (source or destination) on an active
    threat-intel watchlist or an internal high-severity alert list, consistent with session-takeover infrastructure
    or a compromised jump host. Failure-mode variant: a burst of failed SSH authentications (ssh.log auth_success=F)
    to/from a watchlisted host. This Symbolic Logic approach works as follows: Query SSH connection logs
    (Zeek conn.log where `id.resp_p`==22) in real time and raise a high-priority alert if `id.orig_h`
    or `id.resp_h` matches a threat-intel feed or internal compromised-host watchlist. Implement as a
    first-party Zeek/NSM analytic with no external lookup at decision time ([BZAR](https://github.com/mitre-attack/bzar)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable SSH session
    hijacking or post-hijack lateral movement; pivot to the responsible process and its parent/child lineage
    (especially sshd subtrees), the involved user and UID context, the source and destination hosts, the
    SSH agent/control sockets touched, the presence or absence of a corresponding authentication event,
    and any follow-on reconnaissance, credential access, or further lateral movement. A negative result
    helps rule out this particular hijacking vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy session-riding that produces no new login.'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - 'NAI: Network security monitoring sensors (e.g., Zeek sensors at network egress/ingress points), Threat
    Intelligence platforms, SIEM alert correlation engine.'
