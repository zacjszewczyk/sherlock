name: 'T1486: Data Encrypted for Impact'
id: bfda09cf-d7c3-4d72-9e42-80c499d4ff8b
description: 'This playbook helps an analyst investigate whether an adversary has encrypted data on target
  systems to interrupt availability and impact the victim organization (ransomware and destructive encryption)
  as part of the Impact tactic. It guides the hunt across Windows, Linux, macOS, ESXi hypervisors, and
  IaaS cloud storage from several complementary angles: execution of known ransomware binaries matched
  by hash/AV intelligence and creation of files with ransom-note names or encrypted extensions; the canonical
  read->encrypt->overwrite/delete behavioral pattern with high write-buffer entropy; anti-recovery commands
  (vssadmin/wbadmin/bcdedit/wevtutil) correlated with bursts of file modification; single-process high-volume
  file write/rename operations across diverse user-data extensions; worm-like SMB write/rename fan-out
  across many remote hosts and shares; tripwire detection via canary/honey files; defacement and extortion
  indicators such as wallpaper changes and mass ransom-note drops; and ransomware C2/key-exchange network
  traffic plus spikes in blocked outbound connections surrounding an encryption burst. It also covers
  Linux (auditd/openssl/gpg/aescrypt), macOS (unified log/srm), ESXi datastore (.vmdk/.vmx rename and
  shell openssl/tar/dd), and AWS CloudTrail S3 SSE-C encryption patterns. Detection methods combine symbolic-logic
  rules, statistical baselining/forecasting, and machine-learning models applied to Windows Security/Sysmon
  events, auditd, macOS unified logs, ESXi vmkernel/shell logs, CloudTrail, and Zeek/firewall network
  telemetry, so the analyst can corroborate suspected encryption-for-impact against process lineage, file-operation
  volume and entropy, recovery tampering, lateral spread, and network context.'
