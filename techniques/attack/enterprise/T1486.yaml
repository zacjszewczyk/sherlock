questions:
- question: '[Impact] Ransomware hash and ransom note detection: Can you determine whether a process execution
    event is observed where the process hash matches a known ransomware binary, or a file creation event
    is observed for a file with a name or extension matching known ransomware patterns (e.g., ransom notes,
    encrypted file extensions). -- specifically, using the ''Ransomware hash and ransom note detection''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary encrypts files on local,
    remote, virtual, or cloud storage to render data inaccessible and coerce the victim, often after disabling
    recovery and spreading across the network. This evidence focuses on the condition that a process execution
    event is observed where the process hash matches a known ransomware binary, or a file creation event
    is observed for a file with a name or extension matching known ransomware patterns (e.g., ransom notes,
    encrypted file extensions). This Symbolic Logic approach looks for the following signal: Match Windows
    Event ID 4688/Sysmon 1 process hashes and Zeek files.log extracted files against ransomware intelligence,
    and watch for the behavioral read->encrypt->overwrite/delete pattern (a process reading original content
    then writing high-entropy content back and deleting the source) plus file creations with known ransom-note
    names or encrypted extensions, per UNVEIL and the host-indicator taxonomy in ransomware survey. A
    positive result -- a rule match, statistical outlier, or model alert -- indicates a process or account
    is encrypting data in a way consistent with ransomware or destructive impact; pivot immediately to
    the responsible process, its parent lineage, the user/host context, affected files/shares, recovery/backup
    state, and outbound network activity, and consider isolation. A negative result helps reduce confidence
    in this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss slow, low-and-slow, or living-off-the-land encryption.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 4663
  - Windows Event ID 11 (Sysmon)
  - Zeek files.log
  - 'NAI: All endpoints, User workstations, File servers, Domain Controllers, Web servers'
