- question: >-
    [Reconnaissance] Honey-port and dark-space detection: How can you determine whether a pattern of widespread,
    low-and-slow connection attempts from a single or distributed set of external IPs across the organization's
    public IP space, targeting a high number of unique hosts or non-standard ports. -- specifically by
    applying the 'Honey-port and dark-space detection' (Symbolic Logic) approach?
  context: >-
    Why this matters: Under the Reconnaissance tactic (TA0043), the adversary mines open, freely available
    technical databases (WHOIS, DNS, certificate transparency, passive DNS, and internet-wide scan repositories
    such as Shodan and Censys) to profile the enterprise and plan follow-on phishing, infrastructure acquisition,
    or initial access. Although the database queries themselves occur off-network, their effects surface
    at the perimeter as the evidence here describes: A pattern of widespread, low-and-slow connection
    attempts from a single or distributed set of external IPs across the organization's public IP space,
    targeting a high number of unique hosts or non-standard ports. This Symbolic Logic approach works
    as follows: Alert on any connection to honey-ports or unused (dark) internal address space that should
    never receive legitimate traffic, a deterministic zero-false-positive reconnaissance signal [An Internet-Wide
    View of Internet-Wide Scanning](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf),
    using Zeek stateful connection tracking [Bro](https://www.icir.org/vern/papers/bro-CN99.pdf). A positive
    result -- a source matching the scanner/recon signature, exceeding a baselined threshold, or scoring
    as an outlier -- indicates likely reconnaissance acting on open-database findings and should be enriched
    (ASN/CTI reputation, prior history, and any subsequent authentication or access) and escalated; a
    negative result helps rule out targeted scanning versus ambient internet background noise. Tie findings
    back to the Reconnaissance objective by asking what the observed enumeration would enable next.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network perimeter firewalls, internet gateways, and DMZ network segments.'
  range: >-
    Last 90 days (event-centered: pivot +/- 24 hours around any honey-port, scanner, or dormant-account
    hit)
  queries:
  - technology: Zeek/pseudocode
    query: >-
      conn.log

      | WHERE id.resp_h IN dark_space_cidrs OR id.resp_p IN honey_ports

      | // any connection here is illegitimate by construction

      | ALERT severity=high
  - technology: SIEM/Rule pseudocode
    query: >-
      source=zeek:conn (resp_h in DARK_SPACE OR resp_p in HONEY_PORTS)

      // any connection to dark space / honey-ports is illegitimate by construction

      => alert recon_scan
- question: >-
    [Reconnaissance] Low-and-slow host count and failure detection: How can you determine whether a pattern
    of widespread, low-and-slow connection attempts from a single or distributed set of external IPs across
    the organization's public IP space, targeting a high number of unique hosts or non-standard ports.
    -- specifically by applying the 'Low-and-slow host count and failure detection' (Statistical Method)
    approach?
  context: >-
    Why this matters: Under the Reconnaissance tactic (TA0043), the adversary mines open, freely available
    technical databases (WHOIS, DNS, certificate transparency, passive DNS, and internet-wide scan repositories
    such as Shodan and Censys) to profile the enterprise and plan follow-on phishing, infrastructure acquisition,
    or initial access. Although the database queries themselves occur off-network, their effects surface
    at the perimeter as the evidence here describes: A pattern of widespread, low-and-slow connection
    attempts from a single or distributed set of external IPs across the organization's public IP space,
    targeting a high number of unique hosts or non-standard ports. This Statistical Method approach works
    as follows: Flag external IPs contacting >95th percentile of unique hosts with <5th percentile per-host
    connections (low-and-slow Volume profile), and apply Threshold Random Walk on the high unanswered/rejected
    first-contact ratio to catch slow sweeps that evade rate thresholds [Fast Portscan Detection Using
    Sequential Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf). Correlate with
    scan-then-login physics where a sweep precedes authentication attempts [Understanding the Mirai Botnet](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf).
    A positive result -- a source matching the scanner/recon signature, exceeding a baselined threshold,
    or scoring as an outlier -- indicates likely reconnaissance acting on open-database findings and should
    be enriched (ASN/CTI reputation, prior history, and any subsequent authentication or access) and escalated;
    a negative result helps rule out targeted scanning versus ambient internet background noise. Tie findings
    back to the Reconnaissance objective by asking what the observed enumeration would enable next.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network perimeter firewalls, internet gateways, and DMZ network segments.'
  range: >-
    Last 90 days (baseline from 30 days of perimeter telemetry; correlate scanner sources in 1-hour and
    15-minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      source=zeek:conn

      | stats dc(resp_h) as hosts avg(per_host_conns) as ph
          sum(eval(conn_state in ("S0","REJ"))) as unanswered by orig_h
      | eventstats perc95(hosts) p95 perc5(ph) p5

      | where hosts>p95 AND ph<p5 OR TRW(unanswered)=scanner
- question: >-
    [Reconnaissance] DBSCAN low-and-slow clustering: How can you determine whether a pattern of widespread,
    low-and-slow connection attempts from a single or distributed set of external IPs across the organization's
    public IP space, targeting a high number of unique hosts or non-standard ports. -- specifically by
    applying the 'DBSCAN low-and-slow clustering' (Machine Learning) approach?
  context: >-
    Why this matters: Under the Reconnaissance tactic (TA0043), the adversary mines open, freely available
    technical databases (WHOIS, DNS, certificate transparency, passive DNS, and internet-wide scan repositories
    such as Shodan and Censys) to profile the enterprise and plan follow-on phishing, infrastructure acquisition,
    or initial access. Although the database queries themselves occur off-network, their effects surface
    at the perimeter as the evidence here describes: A pattern of widespread, low-and-slow connection
    attempts from a single or distributed set of external IPs across the organization's public IP space,
    targeting a high number of unique hosts or non-standard ports. This Machine Learning approach works
    as follows: Cluster conn.log features (source IP, destination port, inter-arrival time, byte counts)
    with DBSCAN to identify coordinated low-and-slow / distributed scans and surface singleton recon sources
    without a preset cluster count [A Density-Based Algorithm for Discovering Clusters (DBSCAN)](https://cdn.aaai.org/KDD/1996/KDD96-037.pdf);
    also score per-source flow vectors with Isolation Forest and list the top-3 contributing features
    [Isolation Forest](https://doi.org/10.1145/2133360.2133363), [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    A positive result -- a source matching the scanner/recon signature, exceeding a baselined threshold,
    or scoring as an outlier -- indicates likely reconnaissance acting on open-database findings and should
    be enriched (ASN/CTI reputation, prior history, and any subsequent authentication or access) and escalated;
    a negative result helps rule out targeted scanning versus ambient internet background noise. Tie findings
    back to the Reconnaissance objective by asking what the observed enumeration would enable next.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network perimeter firewalls, internet gateways, and DMZ network segments.'
  range: >-
    Last 90 days (train on 30-90 days of first-party telemetry; score new observations continuously)
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      X = conn.log[src_ip, dst_port, inter_arrival, orig_bytes, resp_bytes]

      labels = DBSCAN(eps, min_samples).fit(X)  # no preset k

      flag clusters/singletons of coordinated low-and-slow scans

      score = IsolationForest(X); report SHAP top3 features
- question: >-
    [Reconnaissance] Public data username success detection: How can you determine whether a spike in
    authentication failures or anomalous successful authentications for accounts whose usernames are derived
    from public data sources (e.g., WHOIS, certificate transparency logs, data breach corpuses). -- specifically
    by applying the 'Public data username success detection' (Symbolic Logic) approach?
  context: >-
    Why this matters: Under the Reconnaissance tactic (TA0043), the adversary mines open, freely available
    technical databases (WHOIS, DNS, certificate transparency, passive DNS, and internet-wide scan repositories
    such as Shodan and Censys) to profile the enterprise and plan follow-on phishing, infrastructure acquisition,
    or initial access. Although the database queries themselves occur off-network, their effects surface
    at the perimeter as the evidence here describes: A spike in authentication failures or anomalous successful
    authentications for accounts whose usernames are derived from public data sources (e.g., WHOIS, certificate
    transparency logs, data breach corpuses). This Symbolic Logic approach works as follows: Alert on
    successful authentications (Windows 4624) from external sources for usernames listed in public sources
    (WHOIS, certificate-transparency logs, breach corpuses) that have been dormant >90 days, indicating
    an adversary acted on open-database findings; correlate the preceding external scan in Zeek conn.log
    [Bro](https://www.icir.org/vern/papers/bro-CN99.pdf). A positive result -- a source matching the scanner/recon
    signature, exceeding a baselined threshold, or scoring as an outlier -- indicates likely reconnaissance
    acting on open-database findings and should be enriched (ASN/CTI reputation, prior history, and any
    subsequent authentication or access) and escalated; a negative result helps rule out targeted scanning
    versus ambient internet background noise. Tie findings back to the Reconnaissance objective by asking
    what the observed enumeration would enable next.
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - >-
    NAI: Domain Controllers, ADFS servers, VPN concentrators, and other external authentication gateways
    (e.g., OWA).
  range: >-
    Last 90 days (event-centered: pivot +/- 24 hours around any honey-port, scanner, or dormant-account
    hit)
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      source=win:4624 LogonType in (3,10) src_ip=EXTERNAL

      | join user [public_username_list (WHOIS,CT,breach)]

      | where last_logon_days > 90

      | join (source=zeek:conn orig_h=src_ip earlier scan)

      => alert
