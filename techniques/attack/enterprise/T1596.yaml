name: 'T1596: Search Open Technical Databases'
id: 7df17490-09e0-42bf-9fab-ab7cbd083ef2
description: >-
  This playbook helps an analyst investigate whether an external adversary is conducting reconnaissance
  against the enterprise by leveraging information gleaned from open, freely available technical databases
  (MITRE ATT&CK T1596, Search Open Technical Databases) -- sources such as WHOIS registrations, DNS records,
  SSL/TLS certificate transparency logs, passive DNS, CDN data, and internet-wide scan repositories like
  Shodan, Censys, and ZGrab. Because much of this collection happens off-network and outside the victim's
  direct visibility, this hunt concentrates on the observable downstream effects of that reconnaissance
  as they touch the perimeter: widespread port scanning from external IPs (high destination-port or destination-host
  fan-out, honey-port and dark-space hits, stateless single-packet sweeps); inbound HTTP/S requests carrying
  scanner-tool User-Agents, URI patterns, and abnormal 4xx/404 and entropy profiles; low-and-slow distributed
  scans that evade simple rate thresholds; authentication spikes against accounts whose usernames can
  be derived from public data (WHOIS, certificate transparency, breach corpuses); and anomalous external
  DNS query patterns indicative of subdomain enumeration (high NXDOMAIN ratios, AXFR/IXFR/ANY queries,
  high-entropy or first-seen labels). Detection methods combine deterministic symbolic-logic rules (CTI/ASN
  scanner watchlists, honey-port and dark-space alerts, signature matching, zone-transfer detection, dormant-account
  success alerts), statistical baselining (percentile and standard-deviation thresholds on port/host counts,
  request and failure rates, NXDOMAIN ratios, lexical entropy, and Threshold Random Walk sequential hypothesis
  testing), and machine learning (ARIMA/SARIMA/Prophet volume forecasting, scanner classifiers, DBSCAN
  clustering, Isolation Forest anomaly scoring, and geotemporal login scoring with SHAP feature attribution),
  applied across Zeek conn/http/dns logs and Windows authentication events so the analyst can corroborate
  suspected open-database-driven reconnaissance against perimeter, web, DNS, and authentication telemetry.
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: >-
    [Reconnaissance] Scanner IP and honey-port targeting: How can you determine whether widespread port
    scanning activity from an external IP address, identified by a high ratio of destination ports to
    connections, or originating from a known scanning service. -- specifically by applying the 'Scanner
    IP and honey-port targeting' (Symbolic Logic) approach?
  context: >-
    Why this matters: Under the Reconnaissance tactic (TA0043), the adversary mines open, freely available
    technical databases (WHOIS, DNS, certificate transparency, passive DNS, and internet-wide scan repositories
    such as Shodan and Censys) to profile the enterprise and plan follow-on phishing, infrastructure acquisition,
    or initial access. Although the database queries themselves occur off-network, their effects surface
    at the perimeter as the evidence here describes: Widespread port scanning activity from an external
    IP address, identified by a high ratio of destination ports to connections, or originating from a
    known scanning service. This Symbolic Logic approach works as follows: Alert when CTI/ASN-listed scanner
    infrastructure (e.g., Censys/Shodan/ZGrab ranges) or any source targets sensitive ports (22, 3389,
    5985) within a five-minute window in Zeek conn.log, and alert on ANY connection to honey-ports/dark
    address space which is illegitimate by construction [An Internet-Wide View of Internet-Wide Scanning](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf).
    Match the stateless single-packet sweep signature of public-database scanners [ZMap](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_durumeric.pdf)
    and known scanner banners/ASNs [Censys](https://jhalderm.com/pub/papers/censys-ccs15.pdf). A positive
    result -- a source matching the scanner/recon signature, exceeding a baselined threshold, or scoring
    as an outlier -- indicates likely reconnaissance acting on open-database findings and should be enriched
    (ASN/CTI reputation, prior history, and any subsequent authentication or access) and escalated; a
    negative result helps rule out targeted scanning versus ambient internet background noise. Tie findings
    back to the Reconnaissance objective by asking what the observed enumeration would enable next.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet gateways, external-facing firewalls, and cloud network flow logs.'
  range: >-
    Last 90 days (event-centered: pivot +/- 24 hours around any honey-port, scanner, or dormant-account
    hit)
  queries:
  - technology: Zeek/pseudocode
    query: >-
      conn.log

      | WHERE id.resp_h IN dark_space_cidrs OR id.resp_p IN honey_ports

      | // any connection here is illegitimate by construction

      | ALERT severity=high
  - technology: SIEM/Rule pseudocode
    query: >-
      source=zeek:conn (resp_h in DARK_SPACE OR resp_p in HONEY_PORTS)

      OR (orig_h in CTI_SCANNER_ASNS AND resp_p in (22,3389,5985) within 5m)

      => alert recon_scan
- question: >-
    [Reconnaissance] High port/host count percentile detection: How can you determine whether widespread
    port scanning activity from an external IP address, identified by a high ratio of destination ports
    to connections, or originating from a known scanning service. -- specifically by applying the 'High
    port/host count percentile detection' (Statistical Method) approach?
  context: >-
    Why this matters: Under the Reconnaissance tactic (TA0043), the adversary mines open, freely available
    technical databases (WHOIS, DNS, certificate transparency, passive DNS, and internet-wide scan repositories
    such as Shodan and Censys) to profile the enterprise and plan follow-on phishing, infrastructure acquisition,
    or initial access. Although the database queries themselves occur off-network, their effects surface
    at the perimeter as the evidence here describes: Widespread port scanning activity from an external
    IP address, identified by a high ratio of destination ports to connections, or originating from a
    known scanning service. This Statistical Method approach works as follows: Baseline unique destination
    port and unique destination host counts per external IP hourly and flag sources exceeding the 98th
    percentile (Volume); additionally apply Threshold Random Walk on the failed-to-successful first-contact
    ratio (Zeek conn_state S0/REJ/RSTO vs SF) to declare a scanner after ~4-5 first-contact attempts (Failure/State)
    [Fast Portscan Detection Using Sequential Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf).
    Derive percentile cutoffs from 30 days of your own perimeter conn.log using Zeek connection states
    [Bro](https://www.icir.org/vern/papers/bro-CN99.pdf). A positive result -- a source matching the scanner/recon
    signature, exceeding a baselined threshold, or scoring as an outlier -- indicates likely reconnaissance
    acting on open-database findings and should be enriched (ASN/CTI reputation, prior history, and any
    subsequent authentication or access) and escalated; a negative result helps rule out targeted scanning
    versus ambient internet background noise. Tie findings back to the Reconnaissance objective by asking
    what the observed enumeration would enable next.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet gateways, external-facing firewalls, and cloud network flow logs.'
  range: >-
    Last 90 days (baseline from 30 days of perimeter telemetry; correlate scanner sources in 1-hour and
    15-minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      source=zeek:conn | bin _time span=1h

      | stats dc(resp_p) as ports dc(resp_h) as hosts
          count(eval(conn_state in ("S0","REJ","RSTO"))) as fails
          count(eval(conn_state="SF")) as ok by orig_h _time
      | eventstats perc98(ports) p98p perc98(hosts) p98h

      | where ports>p98p OR hosts>p98h OR TRW(fails,ok)=scanner
- question: >-
    [Reconnaissance] Scanner volume forecasting: How can you determine whether widespread port scanning
    activity from an external IP address, identified by a high ratio of destination ports to connections,
    or originating from a known scanning service. -- specifically by applying the 'Scanner volume forecasting'
    (Machine Learning) approach?
  context: >-
    Why this matters: Under the Reconnaissance tactic (TA0043), the adversary mines open, freely available
    technical databases (WHOIS, DNS, certificate transparency, passive DNS, and internet-wide scan repositories
    such as Shodan and Censys) to profile the enterprise and plan follow-on phishing, infrastructure acquisition,
    or initial access. Although the database queries themselves occur off-network, their effects surface
    at the perimeter as the evidence here describes: Widespread port scanning activity from an external
    IP address, identified by a high ratio of destination ports to connections, or originating from a
    known scanning service. This Machine Learning approach works as follows: Forecast per-external-IP
    connection volume as a time series via ARIMA/SARIMA or Prophet and alert on observations above the
    upper prediction interval [Online Forecasting and Anomaly Detection Based on the ARIMA Model](https://www.mdpi.com/2076-3417/11/7/3194);
    validate the forecast-then-threshold-residual approach for perimeter telemetry [Intrusion Detection
    in Cloud Computing Based on Time Series Anomalies](https://link.springer.com/article/10.1186/s13677-023-00491-x).
    Surface the top-3 contributing features (connection count, unique-port count, failed-connection ratio)
    in alert text [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    A positive result -- a source matching the scanner/recon signature, exceeding a baselined threshold,
    or scoring as an outlier -- indicates likely reconnaissance acting on open-database findings and should
    be enriched (ASN/CTI reputation, prior history, and any subsequent authentication or access) and escalated;
    a negative result helps rule out targeted scanning versus ambient internet background noise. Tie findings
    back to the Reconnaissance objective by asking what the observed enumeration would enable next.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet gateways, external-facing firewalls, and cloud network flow logs.'
  range: >-
    Last 90 days (train on 30-90 days of first-party telemetry; score new observations continuously)
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      model = ARIMA/SARIMA|Prophet on per_ip_conn_volume(history=30d)

      forecast next interval -> (yhat, upper_pi)

      if observed > upper_pi: alert; report top3(conn_count,uniq_ports,fail_ratio)
- question: >-
    [Reconnaissance] Signature matching for scanner traffic: How can you determine whether inbound HTTP/S
    requests containing User-Agent strings, request headers, or URI patterns characteristic of automated
    internet scanning or vulnerability assessment tools. -- specifically by applying the 'Signature matching
    for scanner traffic' (Symbolic Logic) approach?
  context: >-
    Why this matters: Under the Reconnaissance tactic (TA0043), the adversary mines open, freely available
    technical databases (WHOIS, DNS, certificate transparency, passive DNS, and internet-wide scan repositories
    such as Shodan and Censys) to profile the enterprise and plan follow-on phishing, infrastructure acquisition,
    or initial access. Although the database queries themselves occur off-network, their effects surface
    at the perimeter as the evidence here describes: Inbound HTTP/S requests containing User-Agent strings,
    request headers, or URI patterns characteristic of automated internet scanning or vulnerability assessment
    tools. This Symbolic Logic approach works as follows: Match Zeek http.log user_agent and uri fields
    against maintained regexes for known scanner tools (masscan, zgrab, nuclei, nessus, X-Censys-Scanner)
    using community SIEM rules [SigmaHQ](https://github.com/SigmaHQ/sigma); these tools feed the open
    technical databases queried under T1596 and retain fingerprintable banners [Censys](https://jhalderm.com/pub/papers/censys-ccs15.pdf).
    A positive result -- a source matching the scanner/recon signature, exceeding a baselined threshold,
    or scoring as an outlier -- indicates likely reconnaissance acting on open-database findings and should
    be enriched (ASN/CTI reputation, prior history, and any subsequent authentication or access) and escalated;
    a negative result helps rule out targeted scanning versus ambient internet background noise. Tie findings
    back to the Reconnaissance objective by asking what the observed enumeration would enable next.
  answer_sources:
  - Zeek http.log
  - 'NAI: Internet-facing web servers, load balancers, and reverse proxies.'
  range: >-
    Last 90 days (event-centered: pivot +/- 24 hours around any honey-port, scanner, or dormant-account
    hit)
  queries:
  - technology: Zeek/pseudocode
    query: >-
      http.log

      | WHERE user_agent MATCHES scanner_regex(masscan,zgrab,nuclei,nessus,"X-Censys-Scanner")
          OR uri MATCHES scanner_uri_regex
      | ALERT scanner_signature
  - technology: SIEM/Rule pseudocode
    query: >-
      source=zeek:http (user_agent in SCANNER_UA_REGEX OR uri in SCANNER_URI_REGEX)

      // SigmaHQ community rules for known scanner tools

      => alert scanner_signature
- question: >-
    [Reconnaissance] Request volume and failure-rate detection: How can you determine whether inbound
    HTTP/S requests containing User-Agent strings, request headers, or URI patterns characteristic of
    automated internet scanning or vulnerability assessment tools. -- specifically by applying the 'Request
    volume and failure-rate detection' (Statistical Method) approach?
  context: >-
    Why this matters: Under the Reconnaissance tactic (TA0043), the adversary mines open, freely available
    technical databases (WHOIS, DNS, certificate transparency, passive DNS, and internet-wide scan repositories
    such as Shodan and Censys) to profile the enterprise and plan follow-on phishing, infrastructure acquisition,
    or initial access. Although the database queries themselves occur off-network, their effects surface
    at the perimeter as the evidence here describes: Inbound HTTP/S requests containing User-Agent strings,
    request headers, or URI patterns characteristic of automated internet scanning or vulnerability assessment
    tools. This Statistical Method approach works as follows: Per source IP over 15-minute windows track
    request frequency (count/min, Volume+Frequency), 4xx/404 error ratio (Failure state), and URI lexical
    entropy; flag sources with 404 ratio in the 99th percentile or entropy below the 5th percentile, baselining
    benign high-entropy CDN paths first [Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).
    Derive thresholds from your own http.log; do not delete the entropy floor, layer the error-rate signal
    in parallel. A positive result -- a source matching the scanner/recon signature, exceeding a baselined
    threshold, or scoring as an outlier -- indicates likely reconnaissance acting on open-database findings
    and should be enriched (ASN/CTI reputation, prior history, and any subsequent authentication or access)
    and escalated; a negative result helps rule out targeted scanning versus ambient internet background
    noise. Tie findings back to the Reconnaissance objective by asking what the observed enumeration would
    enable next.
  answer_sources:
  - Zeek http.log
  - 'NAI: Internet-facing web servers, load balancers, and reverse proxies.'
  range: >-
    Last 90 days (baseline from 30 days of perimeter telemetry; correlate scanner sources in 1-hour and
    15-minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      source=zeek:http | bin _time span=15m

      | stats count as reqs
          count(eval(status_code>=400))/count as err_ratio
          avg(uri_entropy) as ent by id.orig_h _time
      | eventstats perc99(err_ratio) p99 perc5(ent) p5

      | where err_ratio>p99 OR ent<p5
