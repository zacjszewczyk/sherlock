  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: FROM win:Security | WHERE 4624 LogonType=9 | BASELINE freq/entropy of (parent_process, TargetUserName),
      (source_host, TargetUserName), privilege_gap OVER last 30-90d per user/host | ALERT WHEN pair in
