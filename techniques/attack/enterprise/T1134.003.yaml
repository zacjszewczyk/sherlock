name: 'T1134.003: Access Token Manipulation: Make and Impersonate Token'
id: 45220241-ec7f-4b97-822c-9f1781d725f0
description: 'This playbook helps an analyst investigate adversary abuse of MITRE ATT&CK T1134.003 (Access
  Token Manipulation: Make and Impersonate Token), where an actor with a username and password creates
  a brand-new logon session via LogonUser/LsaLogonUser and then assigns or impersonates that freshly minted
  token (SetThreadToken/ImpersonateLoggedOnUser) to run actions under a different, often higher-privileged,
  security context. Unlike token theft, no existing token is duplicated; a new one is forged. The questions
  below correlate process creation (Windows Event ID 4688 / Sysmon Event ID 1) and new-credentials logons
  (Windows Event ID 4624, Logon Type 9, the LOGON32_LOGON_NEW_CREDENTIALS path), examine the parent processes
  that mint tokens, profile privilege gaps between the initiating subject and the impersonated target,
  and trace follow-on activity such as LSASS handle access, runas.exe /netonly or /savecred usage, lateral
  network connections, security-log clearing, and anomalous egress performed under the impersonated session.
  It supports investigating both privilege escalation and stealthy blend-in evasion, spanning symbolic-logic
  correlations, statistical baselining, and machine-learning detections across endpoint and network telemetry.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0004
  tactic_name: Privilege Escalation
