  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM win:Security, sysmon | DETECT 4688/Sysmon1 (parent, NewProcessName, cmdline, SubjectUserName,
      SubjectLogonId) JOIN 4624 WHERE LogonType=9 ON host AND time-window WHERE TargetUserName privilege
      > SubjectUserName privilege AND (parent IN suspicious_parents OR cmdline MATCHES runas /netonly|/savecred|/user)
      THEN correlate follow-on (4656/Sysmon10 on lsass, 1102 log-clear, 5156/Zeek conn) under TargetLogonId
      | ALERT
- question: 'For the Stealth (TA0005) angle of token make-and-impersonate activity, can you confirm or
    rule out the following using the ''Logon Pair Rarity Score'' (Statistical Method) approach: A process
    creation event (Windows Event ID 4688) with a file hash matching a known malicious indicator is followed
    within 60 seconds on the same host by a new logon session (Windows Event ID 4624, Logon Type 9) where
    the target user possesses higher privileges than the user who initiated the original process and the
    session is used for follow-on privileged activity. How would you operationalize this so an analyst
    can act on it?'
  context: 'Information requirement: Has the adversary escalated privileges using token manipulation on
    the enterprise network? This question matters because, under the Stealth tactic, an adversary using
    T1134.003 forges a new logon session and impersonates a user to blend in with legitimate accounts
    and conceal follow-on actions, so detecting it requires the ''Logon Pair Rarity Score'' technique.
    For every LogonType=9 event, derive the creating parent process and maintain an enterprise baseline
    of (parent process name, target user) and (source host, target user) pair frequencies; alert on pairs
    in the bottom 1st percentile or never-before-seen pairs ([Detecting Structurally Anomalous Logins,
    Siadati and Memon](https://doi.org/10.1145/3133956.3134003); [LANL auth dataset](https://csr.lanl.gov/data/auth/)).
    Layer role-aware standard-deviation thresholds on per-host/per-user LogonType=9 counts per hour to
    catch frequency spikes with explainable cutoffs ([Finding Anomalies in Windows Event Logs Using Standard
    Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)).
    A positive result (the described pattern present, especially with a privilege gap, an unusual token-minting
    parent, or follow-on privileged/evasive activity) is a strong signal of make-and-impersonate token
    abuse and should be escalated and scoped across the host and any sessions launched under the new TargetLogonId.
    A negative result lowers but does not eliminate suspicion, since well-tuned baselines, allowlists,
    or ETW API auditing of the LogonUser->SetThreadToken/ImpersonateLoggedOnUser sequence may be required
    to raise fidelity.'
