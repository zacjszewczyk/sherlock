questions:
- question: 'For the Stealth (TA0005) angle of token make-and-impersonate activity, can you confirm or
    rule out the following using the ''Logon Type 9 Threat Correlation'' (Symbolic Logic) approach: A
    process creation event (Windows Event ID 4688) with a file hash matching a known malicious indicator
    is followed within 60 seconds on the same host by a new logon session (Windows Event ID 4624, Logon
    Type 9) where the target user possesses higher privileges than the user who initiated the original
    process and the session is used for follow-on privileged activity. How would you operationalize this
    so an analyst can act on it?'
  context: 'Information requirement: Has the adversary escalated privileges using token manipulation on
    the enterprise network? This question matters because, under the Stealth tactic, an adversary using
    T1134.003 forges a new logon session and impersonates a user to blend in with legitimate accounts
    and conceal follow-on actions, so detecting it requires the ''Logon Type 9 Threat Correlation'' technique.
    Join process creation (Windows Event ID 4688 / Sysmon Event ID 1) to a threat-intel hash list; on
    match, pivot on host+time to a subsequent new-credentials logon (Windows Event ID 4624 LogonType=9,
    the LOGON32_LOGON_NEW_CREDENTIALS path of LogonUser) within 60s, and alert when the ''TargetUserName''
    is in a higher-privilege group than the initiating ''SubjectUserName''. Where ETW API auditing exists,
    require the LogonUser*->SetThreadToken/ImpersonateLoggedOnUser sequence to raise fidelity ([MITRE
    ATT&CK T1134.003](https://attack.mitre.org/techniques/T1134/003/); [LogonUser](https://learn.microsoft.com/en-us/windows/win32/api/winbase/nf-winbase-logonusera)).
    State signal: also count paired failed logons (Windows Event ID 4625) from the same process as a distinct
    credential-validation-failure indicator. A positive result (the described pattern present, especially
    with a privilege gap, an unusual token-minting parent, or follow-on privileged/evasive activity) is
    a strong signal of make-and-impersonate token abuse and should be escalated and scoped across the
    host and any sessions launched under the new TargetLogonId. A negative result lowers but does not
    eliminate suspicion, since well-tuned baselines, allowlists, or ETW API auditing of the LogonUser->SetThreadToken/ImpersonateLoggedOnUser
    sequence may be required to raise fidelity.'
