    T1134.003 forges a new logon session and impersonates a user to blend in with legitimate accounts
    and conceal follow-on actions, so detecting it requires the ''Token Logon Classifier'' technique.
    Train a supervised classifier (e.g., Random Forest / gradient boosting) on labeled LogonType=9 events
    with features from the logon and parent 4688: parent command-line entropy, parent-name rarity, target-user
    rarity for that parent, process->logon time delta, privilege-gap boolean, and post-logon byte volume;
    score each event and REQUIRE the alert to surface the top-3 contributing features (e.g., SHAP) plus
    the rare pair, not just a probability ([Isolation Forest, Liu et al.](https://ieeexplore.ieee.org/document/4781136);
    [Detecting Structurally Anomalous Logins, Siadati and Memon](https://doi.org/10.1145/3133956.3134003)).
    A positive result (the described pattern present, especially with a privilege gap, an unusual token-minting
    parent, or follow-on privileged/evasive activity) is a strong signal of make-and-impersonate token
    abuse and should be escalated and scoped across the host and any sessions launched under the new TargetLogonId.
    A negative result lowers but does not eliminate suspicion, since well-tuned baselines, allowlists,
    or ETW API auditing of the LogonUser->SetThreadToken/ImpersonateLoggedOnUser sequence may be required
    to raise fidelity.'
