- question: '[Reconnaissance] High-volume subdomain queries: Can you determine whether an external source
    IP exhibits systematic subdomain enumeration, characterized by a high volume of queries and/or high
    entropy of queried subdomain labels over a short period. -- specifically, using the ''High-volume
    subdomain queries'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers DNS information
    about the organization to plan future operations against the target''s network, mail, and SaaS infrastructure.
    This evidence focuses on the condition that an external source IP exhibits systematic subdomain enumeration,
    characterized by a high volume of queries and/or high entropy of queried subdomain labels over a short
    period. This Symbolic Logic approach works as follows: Alert when a single external IP generates >500
    distinct subdomain queries for one organizational domain within 5 minutes in [Zeek dns.log](https://docs.zeek.org/en/master/scripts/base/protocols/dns/main.zeek.html);
    also flag any label exceeding the 63-byte limit or names exceeding 255 bytes ([RFC 1035](https://www.rfc-editor.org/rfc/rfc1035)).
    [RITA](https://github.com/activecm/rita) operationalizes per-source unique-subdomain counting on the
    same logs. A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    DNS reconnaissance against organizational infrastructure; pivot to the source IP and its reputation/WHOIS/ASN,
    the queried domains and record types, the volume, timing, and failure (NXDOMAIN/REFUSED) profile of
    the queries, and whether the same source later appears in scanning, phishing, or initial-access telemetry,
    since recon often precedes those stages. A negative result helps rule out this particular DNS-recon
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss low-and-slow, distributed, or passive-DNS-based collection that never touches first-party
    logs.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: External-facing DNS servers, Network perimeter firewalls, Cloud DNS provider logs'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for src, dom in group(dns.log by id.orig_h, registered_domain), window=5m:\n    distinct_sub\
      \ = count_distinct(subdomain_labels)\n    if src is external and distinct_sub > 500:\n        alert('Subdomain\
      \ enumeration', src, dom, distinct_sub)\n    if any_label_len > 63 or fqdn_len > 255: alert('RFC1035\
      \ length violation', src, query)"
- question: '[Reconnaissance] Entropy and information-content thresholds: Can you determine whether an
    external source IP exhibits systematic subdomain enumeration, characterized by a high volume of queries
    and/or high entropy of queried subdomain labels over a short period. -- specifically, using the ''Entropy
    and information-content thresholds'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers DNS information
    about the organization to plan future operations against the target''s network, mail, and SaaS infrastructure.
    This evidence focuses on the condition that an external source IP exhibits systematic subdomain enumeration,
    characterized by a high volume of queries and/or high entropy of queried subdomain labels over a short
    period. This Statistical Method approach works as follows: Flag sources whose mean queried-subdomain
    Shannon entropy exceeds the 99th percentile of baseline, and whose cumulative per-domain information
    content (bits-per-registered-domain via lossless compression) exceeds the derived bound — robustly
    separating dictionary/random enumeration from benign automation ([Paxson et al.](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf),
    [ibHH heavy hitters](https://www.ndss-symposium.org/wp-content/uploads/2024-388-paper.pdf)). A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable DNS reconnaissance
    against organizational infrastructure; pivot to the source IP and its reputation/WHOIS/ASN, the queried
    domains and record types, the volume, timing, and failure (NXDOMAIN/REFUSED) profile of the queries,
    and whether the same source later appears in scanning, phishing, or initial-access telemetry, since
