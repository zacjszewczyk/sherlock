    but should be corroborated with the other questions in this playbook, since a single method can miss
    low-and-slow, distributed, or passive-DNS-based collection that never touches first-party logs.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: External-facing DNS servers, Internal DNS resolvers, Cloud DNS service logs (e.g., AWS Route
    53, Azure DNS)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for q in dns.log where is_org_domain(q.query) and q.id.orig_h is external:\n    if q.qtype\
      \ in {AXFR(252), ANY(255)}:\n        alert('Deprecated ANY / AXFR recon query', src=q.id.orig_h,\
      \ qtype=q.qtype, query=q.query)"
- question: '[Reconnaissance] High NXDOMAIN ratios and volume: Can you determine whether an external source
    IP generates a statistically significant volume of DNS queries for an organizational domain that result
    in a Non-Existent Domain (NXDOMAIN) response, or uses the deprecated ''ANY'' query type. -- specifically,
    using the ''High NXDOMAIN ratios and volume'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers DNS information
    about the organization to plan future operations against the target''s network, mail, and SaaS infrastructure.
    This evidence focuses on the condition that an external source IP generates a statistically significant
    volume of DNS queries for an organizational domain that result in a Non-Existent Domain (NXDOMAIN)
    response, or uses the deprecated ''ANY'' query type. This Statistical Method approach works as follows:
    Compute per-source NXDOMAIN (RCODE 3) ratio and absolute count; flag IPs with >50 queries in 5 minutes
    whose NXDOMAIN ratio exceeds the 98th percentile of the baseline. A high failure (NXDOMAIN) rate is
    the defining signal of brute-force enumeration and must be profiled as a distinct metric ([SEI behavioral
    features](https://www.sei.cmu.edu/documents/4495/2023_017_001_890953.pdf), [Ahmed et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable DNS reconnaissance
