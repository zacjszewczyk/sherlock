name: 'T1590.002: DNS'
id: 2409b0b1-aef5-4949-8760-7dbc1f3dcd0d
description: 'This playbook helps an analyst investigate whether an external adversary is gathering Domain
  Name System (DNS) information about the organization to support targeting (MITRE ATT&CK T1590.002, Gather
  Victim Network Information: DNS), a Reconnaissance (TA0043) behavior. Adversaries enumerate registered
  name servers and DNS records that map a target''s subdomains, mail servers, and other hosts, and they
  harvest MX, TXT, and SPF records that reveal third-party cloud and SaaS providers (Office 365, G Suite,
  Salesforce, Zendesk). They collect this via direct or passive DNS queries, online technical databases,
  and -- against misconfigured servers -- full zone transfers (AXFR/IXFR). Because much of this activity
  occurs outside the target''s visibility and overlaps with high-volume benign DNS traffic, detection
  is hard and is best pursued from several complementary angles using first-party telemetry. This hunt
  focuses on DNS queries that reach the organization''s own external-facing, authoritative, and resolver
  infrastructure: queries from threat-intel-listed reconnaissance/malicious source IPs against organizational
  domains; unauthorized AXFR/IXFR zone-transfer attempts from IPs not on the secondary allow-list; high
  NXDOMAIN ratios and deprecated ANY (qtype 255) queries indicative of brute-force enumeration and amplification
  recon; systematic subdomain enumeration marked by high query volume and high label entropy; and harvesting
  of sensitive record types (MX, TXT, SPF, SRV, NS) from non-partner external sources. Detection methods
  combine deterministic symbolic-logic rules (CTI matching, RFC-grounded zone-transfer and qtype checks,
  volume floors), statistical baselining (per-source volume/frequency profiling, 3-sigma and percentile
  thresholds on refusal/NXDOMAIN rates, Shannon entropy and information-content bounds), and machine learning
  (passive-DNS reputation classifiers, Isolation Forest/DBSCAN clustering of DNS session feature vectors,
  and LSTM autoencoders on query time series), applied primarily to Zeek dns.log and Windows DNS server
  events so the analyst can corroborate suspected DNS reconnaissance against source reputation, query
  mix, failure rates, and lexical structure of queried names.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: '[Reconnaissance] Match CTI-listed DNS queries: Can you determine whether a DNS query for
    an organizational domain originates from an external source IP address present on a threat intelligence
    feed with a ''reconnaissance'' or ''malicious'' category. -- specifically, using the ''Match CTI-listed
    DNS queries'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers DNS information
    about the organization to plan future operations against the target''s network, mail, and SaaS infrastructure.
    This evidence focuses on the condition that a DNS query for an organizational domain originates from
    an external source IP address present on a threat intelligence feed with a ''reconnaissance'' or ''malicious''
    category. This Symbolic Logic approach works as follows: Alert when DNS queries in [Zeek dns.log](https://docs.zeek.org/en/master/scripts/base/protocols/dns/main.zeek.html)
    originate from external IPs tagged reconnaissance/malicious by a threat-intel feed and target organizational
    domains; this is the deterministic floor and runs without external lookups once the feed is cached
    locally ([CISA AA19-024A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa19-024a)). A
    positive result -- a rule match, statistical outlier, or model alert -- indicates probable DNS reconnaissance
    against organizational infrastructure; pivot to the source IP and its reputation/WHOIS/ASN, the queried
    domains and record types, the volume, timing, and failure (NXDOMAIN/REFUSED) profile of the queries,
    and whether the same source later appears in scanning, phishing, or initial-access telemetry, since
    recon often precedes those stages. A negative result helps rule out this particular DNS-recon vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    low-and-slow, distributed, or passive-DNS-based collection that never touches first-party logs.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: External-facing DNS servers, Network perimeter firewalls, Cloud provider DNS logs, Threat Intelligence
    Platform'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "load dns.log; cti = load_local_feed(category in {reconnaissance, malicious})\nfor q in dns.log\
      \ where q.id.orig_h in cti and is_org_domain(q.query):\n    alert('CTI-listed source querying org\
      \ DNS', src=q.id.orig_h, query=q.query, feed_tag=cti[q.id.orig_h])"
- question: '[Reconnaissance] Track CTI IP query volume and domain ratio: Can you determine whether a
    DNS query for an organizational domain originates from an external source IP address present on a
    threat intelligence feed with a ''reconnaissance'' or ''malicious'' category. -- specifically, using
    the ''Track CTI IP query volume and domain ratio'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers DNS information
    about the organization to plan future operations against the target''s network, mail, and SaaS infrastructure.
    This evidence focuses on the condition that a DNS query for an organizational domain originates from
    an external source IP address present on a threat intelligence feed with a ''reconnaissance'' or ''malicious''
    category. This Statistical Method approach works as follows: For each CTI-flagged source IP compute
    hourly query Volume (count), Frequency (queries/min), and the fraction targeting org domains; alert
    when count>20 AND the org-domain fraction exceeds the 95th percentile of the 30-day source baseline.
    Also profile the per-IP NXDOMAIN/REFUSED failure rate as a distinct probing signal ([SEI behavioral
    features](https://www.sei.cmu.edu/documents/4495/2023_017_001_890953.pdf)). A positive result -- a
    rule match, statistical outlier, or model alert -- indicates probable DNS reconnaissance against organizational
    infrastructure; pivot to the source IP and its reputation/WHOIS/ASN, the queried domains and record
    types, the volume, timing, and failure (NXDOMAIN/REFUSED) profile of the queries, and whether the
    same source later appears in scanning, phishing, or initial-access telemetry, since recon often precedes
    those stages. A negative result helps rule out this particular DNS-recon vector but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, distributed,
    or passive-DNS-based collection that never touches first-party logs.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: External-facing DNS servers, Network perimeter firewalls, Cloud provider DNS logs, Threat Intelligence
    Platform'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "baseline = per_source_hourly_baseline(dns.log, 30d)\nfor src in cti_flagged_ips:\n    cnt\
      \ = count(queries[src], window=1h); freq = cnt/60.0\n    org_frac = count(org_domain_queries[src])\
      \ / cnt\n    fail_rate = count(rcode in {NXDOMAIN, REFUSED}) / cnt\n    if cnt > 20 and org_frac\
      \ > pct95(baseline[src].org_frac):\n        alert('CTI source volume/org-ratio anomaly', src, cnt,\
      \ org_frac, fail_rate)"
- question: '[Reconnaissance] Score source-domain pairs with passive-DNS reputation: Can you determine
    whether a DNS query for an organizational domain originates from an external source IP address present
    on a threat intelligence feed with a ''reconnaissance'' or ''malicious'' category. -- specifically,
    using the ''Score source-domain pairs with passive-DNS reputation'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers DNS information
    about the organization to plan future operations against the target''s network, mail, and SaaS infrastructure.
    This evidence focuses on the condition that a DNS query for an organizational domain originates from
    an external source IP address present on a threat intelligence feed with a ''reconnaissance'' or ''malicious''
    category. This Machine Learning approach works as follows: Score the source IP / queried-domain pair
    with a passive-DNS reputation/classifier model using network, prevalence/dynamism, TTL and lexical
    features ([Notos](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf), [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf));
    alert above the tuned threshold and surface the top-3 contributing features (e.g., reputation, prevalence,
    requery rate) in the alert text. A positive result -- a rule match, statistical outlier, or model
    alert -- indicates probable DNS reconnaissance against organizational infrastructure; pivot to the
    source IP and its reputation/WHOIS/ASN, the queried domains and record types, the volume, timing,
    and failure (NXDOMAIN/REFUSED) profile of the queries, and whether the same source later appears in
    scanning, phishing, or initial-access telemetry, since recon often precedes those stages. A negative
    result helps rule out this particular DNS-recon vector but should be corroborated with the other questions
    in this playbook, since a single method can miss low-and-slow, distributed, or passive-DNS-based collection
    that never touches first-party logs.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: External-facing DNS servers, Network perimeter firewalls, Cloud provider DNS logs, Threat Intelligence
    Platform'
  range: Last 90 days
  queries:
  - technology: ML pipeline/pseudocode
    query: "features = build(src_ip, queried_domain): {network, prevalence, dynamism, ttl, lexical}\n\
      score = passive_dns_reputation_model.predict(features)  # Notos/EXPOSURE-style\nif score > tuned_threshold:\n\
      \    alert('Low-reputation source/domain recon', top3=top_features(features))"
- question: '[Reconnaissance] Detect unauthorized zone transfer requests: Can you determine whether an
    AXFR or IXFR query type is observed in a DNS request originating from an IP address not on an explicit
    allow-list for zone transfers. -- specifically, using the ''Detect unauthorized zone transfer requests''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers DNS information
    about the organization to plan future operations against the target''s network, mail, and SaaS infrastructure.
    This evidence focuses on the condition that an AXFR or IXFR query type is observed in a DNS request
    originating from an IP address not on an explicit allow-list for zone transfers. This Symbolic Logic
    approach works as follows: Alert on any AXFR (qtype 252) or IXFR query in [Zeek dns.log](https://docs.zeek.org/en/master/scripts/base/protocols/dns/main.zeek.html)
    (or Windows DNS Event ID 6001/5504) whose source IP is not on the explicit authorized-secondary allow-list;
    per [RFC 5936](https://www.rfc-editor.org/rfc/rfc5936) full zone transfer must be restricted to authorized
    secondaries, so any other source is by definition anomalous ([CISA AA19-024A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa19-024a)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable DNS reconnaissance
    against organizational infrastructure; pivot to the source IP and its reputation/WHOIS/ASN, the queried
    domains and record types, the volume, timing, and failure (NXDOMAIN/REFUSED) profile of the queries,
    and whether the same source later appears in scanning, phishing, or initial-access telemetry, since
    recon often precedes those stages. A negative result helps rule out this particular DNS-recon vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    low-and-slow, distributed, or passive-DNS-based collection that never touches first-party logs.'
  answer_sources:
  - Zeek dns.log
  - Windows Event ID 5504
  - 'NAI: Authoritative DNS servers, Secondary DNS servers, Domain Controllers with DNS role'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "allowlist = authorized_secondary_ips()\nfor q in dns.log where q.qtype in {AXFR(252), IXFR}\
      \ and q.id.orig_h not in allowlist:\n    alert('Unauthorized zone transfer attempt', src=q.id.orig_h,\
      \ qtype=q.qtype, zone=q.query)\n# also: Windows DNS Event ID 6001/5504 from non-allowlisted source"
- question: '[Reconnaissance] Spot anomalous refusal and failure rates: Can you determine whether an AXFR
    or IXFR query type is observed in a DNS request originating from an IP address not on an explicit
    allow-list for zone transfers. -- specifically, using the ''Spot anomalous refusal and failure rates''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers DNS information
    about the organization to plan future operations against the target''s network, mail, and SaaS infrastructure.
    This evidence focuses on the condition that an AXFR or IXFR query type is observed in a DNS request
    originating from an IP address not on an explicit allow-list for zone transfers. This Statistical
    Method approach works as follows: Track per-source REFUSED/NOTAUTH responses to transfer/large-RR
    queries (State=failure); flag IPs whose hourly refused-query count exceeds 3σ above the 30-day mean,
    indicating repeated failed zone-transfer or probing attempts. Pair with raw count floor (>=3 refused
    transfer attempts/hour) so low-baseline servers still alert. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable DNS reconnaissance against organizational infrastructure;
    pivot to the source IP and its reputation/WHOIS/ASN, the queried domains and record types, the volume,
    timing, and failure (NXDOMAIN/REFUSED) profile of the queries, and whether the same source later appears
    in scanning, phishing, or initial-access telemetry, since recon often precedes those stages. A negative
    result helps rule out this particular DNS-recon vector but should be corroborated with the other questions
    in this playbook, since a single method can miss low-and-slow, distributed, or passive-DNS-based collection
    that never touches first-party logs.'
  answer_sources:
  - Zeek dns.log
  - Windows Event ID 5504
  - 'NAI: Authoritative DNS servers, Secondary DNS servers, Domain Controllers with DNS role'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "base = per_source_refused_baseline(dns.log, 30d)  # mean, sigma\nfor src in sources:\n   \
      \ refused = count(responses[src] where rcode in {REFUSED, NOTAUTH}, window=1h)\n    if refused >\
      \ base[src].mean + 3*base[src].sigma or refused >= 3:\n        alert('Anomalous transfer/refusal\
      \ rate', src, refused)"
- question: '[Reconnaissance] Cluster DNS session anomalies: Can you determine whether an AXFR or IXFR
    query type is observed in a DNS request originating from an IP address not on an explicit allow-list
    for zone transfers. -- specifically, using the ''Cluster DNS session anomalies'' (Machine Learning)
    approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers DNS information
    about the organization to plan future operations against the target''s network, mail, and SaaS infrastructure.
    This evidence focuses on the condition that an AXFR or IXFR query type is observed in a DNS request
    originating from an IP address not on an explicit allow-list for zone transfers. This Machine Learning
    approach works as follows: Apply Isolation Forest to per-source DNS session feature vectors (query-type
    mix, total/distinct query Volume, refusal ratio, TCP usage) ([Ahmed et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf))
    and investigate anomalies with non-zero AXFR/IXFR counts; alert text must list the top-3 contributing
    features (e.g., AXFR count, refusal ratio, distinct qtypes). A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable DNS reconnaissance against organizational infrastructure;
    pivot to the source IP and its reputation/WHOIS/ASN, the queried domains and record types, the volume,
    timing, and failure (NXDOMAIN/REFUSED) profile of the queries, and whether the same source later appears
    in scanning, phishing, or initial-access telemetry, since recon often precedes those stages. A negative
    result helps rule out this particular DNS-recon vector but should be corroborated with the other questions
    in this playbook, since a single method can miss low-and-slow, distributed, or passive-DNS-based collection
    that never touches first-party logs.'
  answer_sources:
  - Zeek dns.log
  - Windows Event ID 5504
  - 'NAI: Authoritative DNS servers, Secondary DNS servers, Domain Controllers with DNS role'
  range: Last 90 days
  queries:
  - technology: ML pipeline/pseudocode
    query: "vec = per_source_session_features: {qtype_mix, total_vol, distinct_vol, refusal_ratio, tcp_usage,\
      \ axfr_count, ixfr_count}\nmodel = IsolationForest().fit(vec_baseline)\nfor src in vec:\n    if\
      \ model.predict(vec[src]) == anomaly and (vec[src].axfr_count + vec[src].ixfr_count) > 0:\n    \
      \    alert('Anomalous DNS session w/ zone-transfer', top3=top_features(vec[src]))"
- question: '[Reconnaissance] Alert on deprecated ANY queries: Can you determine whether an external source
    IP generates a statistically significant volume of DNS queries for an organizational domain that result
    in a Non-Existent Domain (NXDOMAIN) response, or uses the deprecated ''ANY'' query type. -- specifically,
    using the ''Alert on deprecated ANY queries'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers DNS information
    about the organization to plan future operations against the target''s network, mail, and SaaS infrastructure.
    This evidence focuses on the condition that an external source IP generates a statistically significant
    volume of DNS queries for an organizational domain that result in a Non-Existent Domain (NXDOMAIN)
    response, or uses the deprecated ''ANY'' query type. This Symbolic Logic approach works as follows:
    Trigger on AXFR or the deprecated ANY (qtype 255, [RFC 1035](https://www.rfc-editor.org/rfc/rfc1035))
    query type from external IPs against organizational domains; ANY is rarely used by legitimate resolvers
    and is a strong recon/amplification indicator on first-party [Zeek dns.log](https://docs.zeek.org/en/master/scripts/base/protocols/dns/main.zeek.html).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable DNS reconnaissance
    against organizational infrastructure; pivot to the source IP and its reputation/WHOIS/ASN, the queried
    domains and record types, the volume, timing, and failure (NXDOMAIN/REFUSED) profile of the queries,
    and whether the same source later appears in scanning, phishing, or initial-access telemetry, since
