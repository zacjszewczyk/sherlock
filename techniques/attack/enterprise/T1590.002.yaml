  answer_sources:
  - Zeek dns.log
  - 'NAI: External-facing DNS servers, Internal DNS resolvers, Cloud DNS service logs (e.g., AWS Route
    53, Azure DNS)'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "base = nxdomain_ratio_baseline(dns.log)\nfor src in sources:\n    cnt = count(queries[src],\
      \ window=5m)\n    nx_ratio = count(rcode==NXDOMAIN) / cnt\n    if cnt > 50 and nx_ratio > pct98(base):\n\
      \        alert('Brute-force enumeration (NXDOMAIN)', src, cnt, nx_ratio)"
