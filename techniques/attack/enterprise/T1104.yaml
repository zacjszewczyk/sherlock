questions:
- question: 'Using deterministic rule logic, can you determine whether ''Threat intel + TLS fingerprint
    correlation for first-stage C2'' indicates multi-stage command and control activity? Specifically:
    Match outbound connections/DNS queries to TI first-stage C2 indicators and enrich with process lineage
    (loader child process initiating the connection, e.g. mshta/rundll32/curl/wget) per [Suspicious mshta
    Child Process Network Connection](https://research.splunk.com/endpoint/4aa5d062-e893-11eb-9eb2-acde48001122/).
    Additionally flag any connection whose [JA3/JA3S](https://github.com/salesforce/ja3) or version-agnostic
    [JA4+](https://github.com/FoxIO-LLC/ja4) fingerprint matches a known implant or whose HTTP URI/header/User-Agent
    matches durable staged-framework signatures from [Cobalt Strike Malleable C2 profiles](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/).'
  context: 'Tactic context (Command And Control): the adversary is trying to communicate with compromised
    systems to control them, and a multi-stage channel deliberately splits that communication across separate,
    non-overlapping infrastructure to obfuscate the C2 path and frustrate detection or blocking. A first-stage
    loader fetches instructions and a second-stage RAT, which then talks to different infrastructure -
    so the investigative goal is to catch either stage and, ideally, the hand-off between them. Evidence
    under investigation: A process on an endpoint initiates an outbound network connection to an external
    IP address or domain that is present on a threat intelligence feed of known first-stage command and
    control (C2) servers or redirectors. Approach (Threat intel + TLS fingerprint correlation for first-stage
    C2): Match outbound connections/DNS queries to TI first-stage C2 indicators and enrich with process
    lineage (loader child process initiating the connection, e.g. mshta/rundll32/curl/wget) per [Suspicious
    mshta Child Process Network Connection](https://research.splunk.com/endpoint/4aa5d062-e893-11eb-9eb2-acde48001122/).
    Additionally flag any connection whose [JA3/JA3S](https://github.com/salesforce/ja3) or version-agnostic
    [JA4+](https://github.com/FoxIO-LLC/ja4) fingerprint matches a known implant or whose HTTP URI/header/User-Agent
    matches durable staged-framework signatures from [Cobalt Strike Malleable C2 profiles](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/).
    A positive result indicates a staged C2 hand-off or a stage-specific beacon - for example a loader
    reaching first-stage infrastructure and then a second process or fingerprint connecting to unrelated
    infrastructure - and warrants pivoting to the originating process lineage, the host, the account,
    and the second-stage destination; a negative result means the observed behavior matches benign baselines
    (e.g., legitimate redirects, update/telemetry beacons, or expected periodic services). Investigate
    the named area of interest (Internet gateways and proxies, DNS resolvers, User endpoints) and correlate
    host process telemetry with network flows to reconstruct the full multi-stage chain.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Internet gateways and proxies, DNS resolvers, User endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// First-stage C2: threat-intel + fingerprint correlation\nMATCH conn/dns events JOIN process_creation\
      \ ON host, pid/process_guid OVER 5m\nWHERE (dst_ip IN ti_first_stage_c2 OR dns_query IN ti_first_stage_domains\n\
      \       OR ja3 IN known_implant_ja3 OR ja4 IN known_implant_ja4\n       OR http_uri/header/user_agent\
      \ MATCHES malleable_c2_profile_sigs)\n  AND parent_proc IN ['mshta','rundll32','regsvr32','curl','wget','powershell']\n\
      THEN alert(severity='high', enrich=[proc_lineage, ja3, ja4, ti_match])"
- question: 'Using statistical baselining, can you determine whether ''Statistical rarity and information-content
    scoring of destinations'' indicates multi-stage command and control activity? Specifically: Flag connections
    whose destination domain frequency is <1st percentile and ASN frequency <5th percentile over a 14-30
    day per-org baseline; additionally score the information content of the request path/subdomain using
    lossless-compression bounds to catch staging requests carrying disproportionate data per [Practical
    Comprehensive Bounds on Surreptitious Communication over DNS](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf).
    Profile NXDOMAIN/connection-failure rate to the destination as a distinct signal.'
