name: 'T1104: Multi-Stage Channels'
id: 55d4a46e-3c48-4017-8559-4f1c28d54bfa
description: 'This playbook helps an analyst determine whether an adversary has established a Multi-Stage
  Channel for command and control (T1104): a layered C2 design in which a first-stage loader beacons to
  an initial server or redirector to fetch instructions, collect host information, and pull a more capable
  second-stage RAT that then connects to separate, non-overlapping infrastructure (often with Fallback
  Channels). It correlates host process telemetry (Windows Event ID 4688/5156/5157, Sysmon, auditd execve/connect,
  macOS EndpointSecurity, ESXi hostd/cron) with network telemetry (Zeek conn.log/dns.log/http.log/ssl.log/files.log)
  to expose the staged hand-off. Investigative angles include: outbound connections and DNS queries to
  threat-intel first-stage C2 enriched with loader process lineage and JA3/JA4/Malleable-C2 fingerprints;
  HTTP 3xx redirect chains to low-reputation or different-ASN destinations; a single long-running process
  abruptly shifting destination port, protocol, ASN, or TLS fingerprint; download-execute-connect causal
  chains where a freshly written executable spawns a process that beacons to a different ASN; rapid sequential
  outbound attempts to many disparate IPs with high failure rates (fallback callbacks cycling candidate
  servers); and low-volume, regularly periodic first-stage beacons. Detection blends symbolic-logic rules,
  statistical baselining (rarity percentiles, entropy, Mahalanobis distance, FFT/coefficient-of-variation
  beaconing scores, information-content bounds), and machine learning (encrypted-traffic classifiers,
  LSTM/transformer sequence models, Bayesian online change-point detection, continuous-time HMMs, provenance
  GNNs, DBSCAN clustering) to produce evasion-resistant, explainable alerts for the Command and Control
  tactic.'
type: technique
