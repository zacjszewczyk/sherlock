- question: 'Using a machine-learning model, can you determine whether ''Encrypted-traffic ML classification
    with feature attribution'' indicates multi-stage command and control activity? Specifically: Score
    connections with a model over flow features (domain entropy, JA3/JA4, byte ratios, inter-arrival times)
    and alert on predictions >0.85; for opaque TLS use self-supervised flow anomaly scoring per [ET-SSL](https://www.nature.com/articles/s41598-025-08568-0).
