- question: 'Using deterministic rule logic, can you determine whether ''Redirect chain threat intel rule''
    indicates multi-stage command and control activity? Specifically: Alert when a session follows a 3xx
    redirect within 2 seconds to a blocklisted/newly-observed/non-FQDN domain or a different ASN than
    the initial server; match resulting URIs/headers against staged-framework signatures from [Cobalt
    Strike Malleable C2 profiles](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/).'
