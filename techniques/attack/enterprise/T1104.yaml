  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internet gateways, transparent/explicit web proxies, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Redirect-chain hand-off rule\nFOR EACH http session WITH status IN (301,302,303,307,308):\n\
