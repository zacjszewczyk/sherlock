  queries:
  - technology: SIEM/Stats pseudocode
    query: "// First-stage C2: rarity + information-content scoring\nFOR EACH outbound (src, dst_domain,\
      \ dst_asn) OVER 14-30d org baseline:\n  dom_freq_pctile = percentile_rank(freq(dst_domain))\n  asn_freq_pctile\
      \ = percentile_rank(freq(dst_asn))\n  path_ic = compressed_len(uri_path||subdomain) / raw_len  //\
