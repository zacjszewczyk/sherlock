questions:
- question: '[Stealth] Extract VBA stomping indicators from edge-logged documents: Can you determine whether
    a document delivered by email, web download, or file share is extracted for sandbox or gateway analysis,
    and the static-analysis result shows a structural mismatch between the VBA source streams and compiled
    p-code that is consistent with VBA stomping and macro-source tampering. -- specifically, by applying
    the ''Extract VBA stomping indicators from edge-logged documents'' (Symbolic Logic) approach to answer
    the mission question "Is an adversary using VBA stomping to execute malicious code while evading static
    analysis?"?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the adversary hides malicious VBA by
    stomping the macro source while retaining executable p-code, so the document appears benign to source-only
    analysis yet still runs hidden code -- making defenders blind unless they inspect p-code and behavioral
    side effects. This evidence focuses on the condition that a document delivered by email, web download,
    or file share is extracted for sandbox or gateway analysis, and the static-analysis result shows a
    structural mismatch between the VBA source streams and compiled p-code that is consistent with VBA
    stomping and macro-source tampering. This Symbolic Logic approach works as follows: Auto-extract MS
    Office files from network traffic (Zeek files.log) and email attachments and run olevba with `--decode
    --show-pcode` (which embeds pcodedmp). Generate a high-severity alert if the report contains the ''VBA
    Stomping'' indicator, if a module''s `PerformanceCache`/P-code is present while its VBA source stream
    is empty/zeroed/benign (''macro present in P-code but absent in source''), or if the VBA source version
    disagrees with the `_VBA_PROJECT` stream version. This is the documented bypass weaponized by Evil
    Clippy and catalogued at vbastomp.com; source-only AV/sandbox tools miss it per Koutsokostas et al..
    A positive result -- a rule match, statistical outlier, or model alert -- is strong evidence of VBA
    stomping or its downstream execution; pivot to the source document and its delivery vector, the Office
    process and child-process lineage, the user and host, and any outbound infrastructure contacted. A
    negative result helps reduce suspicion for this angle but should be corroborated with the other questions
    in this playbook, since a single method can miss version-targeted stomping, novel obfuscation, or
    living-off-the-land execution.'
