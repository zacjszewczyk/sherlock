    volume exceeds 4σ (Volume). Compute Shannon entropy of requested domains (Zeek dns.log / Sysmon EID
    22) from Office processes and alert at entropy >3.5 (DGA). As a Failure-Mode signal, alert on bursts
    of NXDOMAIN responses or a high failed/blocked-connection ratio from Office processes (failed C2 resolution).
    Derive thresholds from your own per-host history. A positive result -- a rule match, statistical outlier,
    or model alert -- is strong evidence of VBA stomping or its downstream execution; pivot to the source
    document and its delivery vector, the Office process and child-process lineage, the user and host,
    and any outbound infrastructure contacted. A negative result helps reduce suspicion for this angle
    but should be corroborated with the other questions in this playbook, since a single method can miss
    version-targeted stomping, novel obfuscation, or living-off-the-land execution.'
