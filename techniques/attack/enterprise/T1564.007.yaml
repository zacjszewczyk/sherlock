    analysis yet still runs hidden code -- making defenders blind unless they inspect p-code and behavioral
    side effects. This evidence focuses on the condition that an MS Office process initiates an outbound
    network connection with anomalous characteristics, such as a non-standard destination port, a high-entropy
    domain name, or an unusually large data payload. This Statistical Method approach works as follows:
