name: 'T1564.007: Hide Artifacts: VBA Stomping'
id: d9444ae3-61ff-42f3-9851-9d34b596d445
description: 'This playbook helps an analyst investigate whether an adversary is using VBA stomping to
  execute malicious code from MS Office documents while evading static analysis, as part of the Stealth
  tactic. In a VBA-stomping attack the adversary overwrites the human-readable VBA source stream of an
  Office macro with zeros, benign filler, or random bytes while leaving the previously compiled malicious
  p-code (PerformanceCache) intact, so that source-only AV and sandbox tooling see a benign or empty macro
  while the Office host silently executes the hidden p-code whenever the host application version matches
  the _VBA_PROJECT stream. The hunt therefore spans several complementary angles: static structural analysis
  of documents captured at the email gateway, network file transfer, or sandbox (detecting p-code-present-but-source-empty
  mismatches, _VBA_PROJECT version disagreements, recovered auto-exec entrypoints, and source-to-p-code
  ratio/entropy anomalies via olevba/pcodedmp and Evil Clippy-style indicators); behavioral detection
  of Office parent processes (winword.exe, excel.exe, powerpnt.exe) spawning suspicious script or LOLBin
  children; anomalous outbound connections from Office processes to non-standard ports, high-entropy/DGA
  domains, or oversized payloads indicating C2 callback; and correlation of Office-originated connections
  and file hashes against threat-intelligence feeds and rare-ASN baselines. Detection methods combine
  symbolic-logic rules, statistical baselining/forecasting, and machine-learning models applied to Zeek
  files/conn/dns logs, email gateway and sandbox detonation results, Sysmon (EID 1/3/22), Windows Event
  ID 4688, auditd, and macOS unified logs, so the analyst can corroborate suspected VBA stomping from
  the document artifact through process lineage to network egress.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
