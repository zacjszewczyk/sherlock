questions:
- question: Are there cloud management-plane events that indicate a direct, interactive login to a cloud-hosted
    VM via cloud-native access methods such as AWS EC2 Instance Connect (SendSSHPublicKey), AWS SSM StartSession/SendCommand/RunCommand,
    or Azure Serial Console actions?
  context: This deterministic anchor establishes whether direct cloud VM access even occurred. Hunt AWS
    CloudTrail (and Azure Activity Logs) for the specific eventNames that represent interactive console
    access to a VM. Because T1021.008 lateral movement relies on cloud-native access paths that bypass
    the network perimeter, this management-plane event is the single most reliable, first-party trigger
    and is the anchor for every correlation below. A positive result identifies the principal, source
    IP, and target VM to pivot from; a negative result across the window argues against this technique.
    Validate and threshold-tune coverage by detonating the access methods with Stratus Red Team, and model
    selectors on the 'Potential Malicious Usage of AWS SSM via CloudTrail' Sigma rule.
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Cloud management plane (e.g., AWS CloudTrail, Azure Activity Logs), Cloud VM instances (e.g.,
    Windows Event Logs), Virtual network traffic sensors (e.g., VPC Flow Logs, Zeek sensors), and Egress
    network gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=AWS:CloudTrail\nWHERE eventName IN (\"SendSSHPublicKey\", \"StartSession\", \"SendCommand\"\
      ,\n  \"RunCommand\") OR eventSource=\"ssm.amazonaws.com\"\n  OR (eventSource=\"Microsoft.SerialConsole\"\
      )\nRETURN eventTime, userIdentity.arn, sourceIPAddress, requestParameters.target AS vm\n// anchor\
      \ event for all correlations; alert and enrich with principal/VM"
- question: After a direct cloud VM access event, does the same VM make an outbound network connection
    within 30 minutes to an IP address or domain that matches a command-and-control (C2) threat-intelligence
    feed?
  context: This correlation rule ties the cloud access anchor to a concrete C2 indicator to confirm lateral
    movement is being used as a beachhead. After a direct-access event for a specific VM, look at that
    VM's outbound flows (Zeek conn.log) and resolved domains (Zeek dns.log) within a 30-minute window
    and match destination IP/FQDN against the C2 feed. A match strongly indicates the directly-accessed
    VM is now beaconing to attacker infrastructure. Keep the 30-minute window and exact eventName watchlist
    as hard thresholds; you may tune the window per environment but should not delete it.
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Cloud management plane (e.g., AWS CloudTrail, Azure Activity Logs), Cloud VM instances (e.g.,
    Windows Event Logs), Virtual network traffic sensors (e.g., VPC Flow Logs, Zeek sensors), and Egress
    network gateways.'
  range: Last 90 days (correlate within 30 minutes of each access event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "LET access = CloudTrail access event (SendSSHPublicKey|StartSession|RunCommand) -> vm, t0\n\
      JOIN Zeek conn.log/dns.log WHERE src=vm.ip AND ts BETWEEN t0 AND t0+30m\n  AND (resp_h IN ti_c2_ips\
      \ OR query IN ti_c2_domains)\nALERT with vm, principal, dest, matched_indicator"
- question: In the hour following a direct cloud VM access event, is the VM's outbound traffic volume,
    connection frequency, or destination-port spread statistically anomalous versus its own 30-day baseline?
  context: This statistical method scores exfiltration/scanning-style behavior that may not match any
    known C2 indicator. Build a per-VM 30-day baseline of outbound orig_bytes/hour, outbound connections/minute,
    and destination-port entropy from Zeek conn.log, then score the 60 minutes after a direct-access event.
    Retain the deterministic 'alert if port entropy > mean+3 sigma' rule and add a robust parallel threshold
    using the modified Z-score (0.6745*(x-median)/MAD, alert if |score|>3.5) so batch jobs and backups
    do not distort the baseline. Derive per-VM cutoffs from each VM's own history; high port entropy suggests
    scanning/pivoting, while a volume spike suggests staging or exfiltration.
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Cloud management plane (e.g., AWS CloudTrail, Azure Activity Logs), Cloud VM instances (e.g.,
    Windows Event Logs), Virtual network traffic sensors (e.g., VPC Flow Logs, Zeek sensors), and Egress
    network gateways.'
  range: Last 90 days (baseline 30 days; score 60 minutes post-access)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_vm 30d stats of orig_bytes/hr, conns/min, port_entropy (Zeek conn.log)\nscore\
      \ window = [t0, t0+60m] after access event\nALERT if port_entropy > mean+3*sigma\n  OR |0.6745*(x-median)/MAD|\
      \ > 3.5 for volume/frequency/entropy"
- question: Does the directly-accessed VM's observed hourly outbound data volume exceed the upper confidence
    bound of a time-series forecast model trained on its historical egress?
  context: This machine-learning approach catches gradual or context-dependent exfiltration that fixed
    thresholds miss. Per VM, train a time-series forecasting model (Prophet/ARIMA) on hourly outbound
    orig_bytes from Zeek conn.log; after a direct-access event, alert when observed hourly volume exceeds
    the model's upper confidence bound. Because this is lateral movement that may precede data theft,
    forecasting on the VM's own seasonality reduces false positives from normal periodic load. The alert
    MUST surface the top-3 contributors -- predicted vs. observed bytes, the offending hour, and the single
    destination contributing the most bytes -- so analysts can triage without re-deriving the anomaly
    score.
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Cloud management plane (e.g., AWS CloudTrail, Azure Activity Logs), Cloud VM instances (e.g.,
    Windows Event Logs), Virtual network traffic sensors (e.g., VPC Flow Logs, Zeek sensors), and Egress
    network gateways.'
  range: Last 90 days (train on >=30 days hourly data)
  queries:
  - technology: Python/ML pseudocode
    query: 'model = Prophet/ARIMA.fit(per_vm hourly orig_bytes, Zeek conn.log)

      yhat_upper = model.predict(post_access_hours).upper

      ALERT if observed_bytes > yhat_upper

      EXPLAIN top3: predicted_vs_observed, offending_hour, top_destination_by_bytes'
- question: Within 60 minutes of a direct cloud VM access event, does the same VM create a process whose
    name or command line matches known post-exploitation tools, discovery commands, or suspicious patterns
    (e.g., mimikatz.exe, 'powershell -enc', 'nltest /dclist')?
  context: This deterministic rule links the cloud access anchor to hands-on-keyboard tooling on the VM.
    Trigger when a direct cloud VM access event (CloudTrail SSM/EC2 Instance Connect/serial console) is
    followed within 60 minutes on the same VM by a process-creation event (Windows Event ID 4688 / Linux
    auditd) whose CommandLine or NewProcessName matches a watchlist of tool names, discovery commands,
    or encoding/obfuscation patterns. Because direct console access often grants SYSTEM/root, immediate
    execution of credential-theft or discovery tooling is a strong lateral-movement signal. Keep the explicit
    watchlist and 60-minute window as deterministic floors; generate test events with Stratus Red Team
    to confirm coverage.
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Cloud VM instance event logs (e.g., Windows Event Log, Linux auditd), Cloud management plane
    logs, and EDR agent logs.'
  range: Last 90 days (correlate within 60 minutes of each access event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "LET access = CloudTrail direct-access event -> vm, t0\nJOIN proc (EventID=4688 OR auditd execve)\
      \ WHERE host=vm AND ts BETWEEN t0 AND t0+60m\n  AND (NewProcessName IN tool_watchlist OR CommandLine\
      \ MATCHES\n    /mimikatz|-enc|nltest|whoami|net user|Invoke-/i)\nALERT vm, principal, process, commandline"
- question: After a direct VM access event, are new processes launched with command lines whose length
    or character entropy is statistically anomalous for that process name?
  context: This statistical method detects obfuscated/encoded command lines (e.g., base64 PowerShell)
    that evade static watchlists. For each common process name (powershell.exe, cmd.exe) build a per-name
    baseline of command-line length and character-level entropy; after a direct-access event, score each
    new process (Event ID 4688). Keep the deterministic 'alert if entropy in top 5th percentile for that
    name' rule and add a robust modified Z-score threshold (|0.6745*(x-median)/MAD|>3.5) on both entropy
    and length to resist outlier skew. High-entropy long command lines shortly after direct cloud access
    indicate scripted post-exploitation rather than benign administration.
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Cloud VM instance event logs (e.g., Windows Event Log, Linux auditd), Cloud management plane
    logs, and EDR agent logs.'
  range: Last 90 days (baseline per process name; score post-access)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_process_name stats of cmdline_len, cmdline_entropy\nfor each new proc (EventID=4688)\
      \ after access event:\nALERT if entropy >= p95(name)\n  OR |0.6745*(x-median)/MAD| > 3.5 for entropy\
      \ or length"
- question: After a direct-access login, does the VM (or the CloudTrail principal) execute a process or
    API action that is first-seen or population-rare relative to its learned history?
  context: This machine-learning approach surfaces novel tradecraft without a predefined watchlist. Per
    VM (and per principal in CloudTrail) learn the historical set of processes and follow-on API actions,
    then flag first-seen or population-rare items after a direct-access login. In lateral movement, an
    adversary using a compromised identity will often run binaries or call APIs that account/VM has never
    used before. The alert MUST list the top-3 contributing features (the never-before-seen binary, its
    rarity score, and the unusual parent/child or principal context) so analysts can triage without re-deriving
    the score.
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Cloud VM instance event logs (e.g., Windows Event Log, Linux auditd), Cloud management plane
    logs, and EDR agent logs.'
  range: Last 90 days (learn history >=30 days)
  queries:
  - technology: Python/ML pseudocode
    query: 'known = learn per_vm/per_principal historical {processes, api_actions}

      for items after access event: rarity = freq-based score (first-seen=max)

      ALERT if first_seen OR rarity in population tail

      EXPLAIN top3: novel_binary/api, rarity_score, parent_child/principal_context'
- question: Is there a successful interactive logon to a cloud VM (Windows Event ID 4624, Logon Type 2
    or 10) or a CloudTrail direct-access event from a source IP whose country is not on the organization's
    allow-list, or that implies impossible travel for that identity?
  context: 'This deterministic geo/velocity rule catches stolen-credential use against cloud VMs. Alert
    on a successful interactive logon (Event ID 4624, Logon Type 2 interactive or 10 RemoteInteractive/RDP)
    or a CloudTrail direct-access event where the source IP country is outside the allow-list. Layer an
    impossible-travel rule: for two access events by one identity, compute implied velocity from source-IP
    geodata and timestamps and alert when it exceeds a physical maximum. Since direct cloud VM connections
    use valid accounts, geographic and travel-feasibility anomalies are a primary tell of account compromise
    enabling lateral movement. Keep the country allow-list and velocity threshold as hard rules.'
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Cloud VM instance authentication logs (e.g., Windows Security Log), Cloud management plane logs,
    Identity and Access Management (IAM) logs, and Geolocation databases.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'events = (EventID=4624 LogonType IN (2,10)) OR CloudTrail direct-access

      geo = geoip(sourceIP)

      ALERT if geo.country NOT IN allow_list

      ALERT if velocity(prev_event, this_event)/identity > max_kmh (impossible travel)'
- question: Does a new login to a cloud VM accumulate a high cumulative risk score from deviations such
    as new country, new ISP/ASN, off-hours timing, or first-seen role/API use for that account?
  context: This statistical method fuses multiple weak signals into a defensible risk score. Per account,
    profile source country, source ISP/ASN, and login hour-of-day; for each new login (Event ID 4624)
    increment a risk score per deviation (new country, new ISP, off-hours) and combine with first-seen
    role/API signals from CloudTrail. Retain the deterministic '98th-percentile cumulative-score' alert
    and add a robust modified Z-score cutoff; combine multiple weak signals as in an unsupervised multi-detector
    ensemble. For T1021.008, no single deviation is conclusive, but a cluster of them on one login is
    a strong indicator of adversary access via a valid account.
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Cloud VM instance authentication logs (e.g., Windows Security Log), Cloud management plane logs,
    Identity and Access Management (IAM) logs, and Geolocation databases.'
  range: Last 90 days (profile per account)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'profile = per_account {country, ASN, hour_of_day, roles/APIs}

      risk = w1*new_country + w2*new_ASN + w3*off_hours + w4*first_seen_role/api

      ALERT if risk >= p98(account history) OR |0.6745*(x-median)/MAD| > 3.5'
- question: Do cloud VM login events fail to map to any established behavioral cluster for that user when
    grouped by geolocation, ASN, and timestamp?
  context: This machine-learning approach finds outlier logins without predefined rules. Apply density-based
    clustering (DBSCAN) to historical login data (user, source-IP geolocation, ASN, timestamp); logins
    that do not map to an established cluster are outliers. This is consistent with unsupervised lateral-movement
    detection and graph-anomaly scoring on IAM logs. An outlier login to a cloud VM may represent an adversary
    operating from infrastructure and at times unlike the legitimate user. The alert MUST surface the
    top-3 features driving outlier status (distance to nearest cluster, novel ASN, off-hours offset) for
    analyst review.
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Cloud VM instance authentication logs (e.g., Windows Security Log), Cloud management plane logs,
    Identity and Access Management (IAM) logs, and Geolocation databases.'
  range: Last 90 days (cluster on historical logins)
  queries:
  - technology: Python/ML pseudocode
    query: 'X = per_user logins [geo_lat, geo_lon, ASN_enc, hour]

      model = DBSCAN(eps, min_samples).fit(X)

      ALERT if new_login label == -1 (noise/outlier)

      EXPLAIN top3: dist_to_nearest_cluster, novel_ASN, off_hours_offset'
- question: Within 60 minutes of a direct cloud VM access event, does the VM issue a DNS query for a domain
    belonging to a known dynamic-DNS provider (e.g., no-ip.com, duckdns.org) that is not on the allow-list?
  context: This deterministic rule catches a common C2 staging pattern. Trigger when a direct cloud VM
    access event occurs and within 60 minutes the same VM issues a DNS query (Zeek dns.log) for a domain
    under a known dynamic-DNS provider not on the allow-list. Adversaries frequently use dynamic-DNS for
    resilient C2; after gaining direct console access, such a lookup is a strong early indicator of attacker
    tooling reaching out. Keep the provider list and window as deterministic thresholds.
  answer_sources:
  - AWS CloudTrail
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - Windows Event ID 4624
  - 'NAI: Network sensors capturing VPC/VNet flow data (e.g., Zeek sensors), Egress network gateways,
    Cloud VM network kernel logs (e.g., Windows Event ID 5156), and DNS server logs.'
  range: Last 90 days (correlate within 60 minutes of access)
  queries:
  - technology: Zeek/pseudocode
    query: "LET access = CloudTrail direct-access event -> vm, t0\nJOIN dns.log WHERE id.orig_h=vm.ip\
      \ AND ts BETWEEN t0 AND t0+60m\n  AND query MATCHES dyndns_providers (no-ip.com|duckdns.org|...)\n\
      \  AND query NOT IN allow_list\nALERT vm, query, answers"
- question: After a direct-access login, is there a spike in the VM's DNS NXDOMAIN rate, blocked/denied
    outbound connection rate, or CloudTrail AccessDenied events versus baseline?
  context: This failure-mode statistical method treats failures as first-class attacker signals. Baseline
    each VM's NXDOMAIN rate (Zeek dns.log rcode), blocked/denied outbound rate (Zeek conn.log conn_state
    S0/REJ, Windows Event ID 5156 deny), then after a direct-access login alert on spikes using change-point
    detection (CUSUM/PELT/Bayesian online), and correlate with CloudTrail AccessDenied bursts. High NXDOMAIN
    suggests DGA-based C2, failed connections suggest scanning, and AccessDenied bursts suggest permission
    probing -- distinct attacker behaviors that successful-traffic baselines miss, all consistent with
    hands-on lateral movement from a freshly accessed VM.
  answer_sources:
  - AWS CloudTrail
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - Windows Event ID 4624
  - 'NAI: Network sensors capturing VPC/VNet flow data (e.g., Zeek sensors), Egress network gateways,
    Cloud VM network kernel logs (e.g., Windows Event ID 5156), and DNS server logs.'
  range: Last 90 days (baseline rates; detect change post-access)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_vm rates: NXDOMAIN (dns.log rcode=3),\n  denied conns (conn_state IN (S0,REJ)\
      \ or EventID=5156 deny)\ndetect change-point (CUSUM/PELT/Bayesian) after access event\ncorrelate\
      \ CloudTrail AccessDenied bursts\nALERT on rate spike in any failure stream"
- question: In the hour after a direct-access event, does total outbound bytes/hour from the VM exceed
    its 30-day rolling 99th-percentile baseline (and a robust MAD-based threshold)?
  context: This statistical method quantifies data exfiltration spikes. Maintain a 30-day rolling 99th-percentile
    baseline of total outbound bytes/hour (orig_bytes, Zeek conn.log) per VM and alert when the hour after
    a direct-access event exceeds it. Add a robust modified Z-score threshold (|score|>3.5 via MAD) so
    periodic backups do not inflate the mean. A large egress spike immediately after direct console access
    to a VM is a classic indicator of staging/exfiltration during lateral movement.
  answer_sources:
  - AWS CloudTrail
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - Windows Event ID 4624
  - 'NAI: Network sensors capturing VPC/VNet flow data (e.g., Zeek sensors), Egress network gateways,
    Cloud VM network kernel logs (e.g., Windows Event ID 5156), and DNS server logs.'
  range: Last 90 days (30-day rolling baseline; score hour after access)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_vm 30d rolling p99 of sum(orig_bytes)/hour (Zeek conn.log)

      x = outbound bytes in [t0, t0+60m] after access event

      ALERT if x > p99 OR |0.6745*(x-median)/MAD| > 3.5'
- question: After a direct-access event, does a multivariate time-series model of the VM's egress (bytes
