name: 'T1021.008: Direct Cloud VM Connections'
id: 693e6911-b02e-423c-855a-6216b98184e4
description: 'Investigate adversary use of Direct Cloud VM Connections (T1021.008), where an actor with
  valid accounts logs directly into cloud-hosted virtual machines through cloud-native interactive access
  methods such as AWS EC2 Instance Connect, AWS Systems Manager (SSM) StartSession/SendCommand, and Azure
  Serial Console. These connections frequently grant SYSTEM or root-level console access and let an adversary
  pivot through a cloud environment while bypassing traditional network controls. This playbook helps
  an analyst confirm or refute suspected lateral movement by correlating cloud management-plane access
  events (CloudTrail/Azure Activity) with on-VM activity and network egress: direct logins followed by
  C2 callouts, post-exploitation tooling, anomalous outbound data spikes, dynamic-DNS or DGA-style queries,
  suspicious interactive logons (impossible travel, new geo/ASN, off-hours), and the classic login ->
  discovery -> internal pivot sequence. It combines deterministic symbolic-logic rules, statistical baselining/anomaly
  scoring, and machine-learning models so a SOC analyst can triage across the cloud control plane, VM
  endpoint logs (Windows Event IDs, Linux auditd), and network sensors (Zeek, VPC/VNet flow).'
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
