  context: This machine-learning approach captures correlated multi-metric anomalies and regime shifts.
    Per VM, train a multivariate time-series model on bytes sent, connection count, and unique destination
    ports/hour; after a direct-access event score the subsequent window and alert on deviations, using
    forecasting/causal-feature methods and change-point/regime-shift detection. Considering several egress
    metrics jointly catches lateral-movement behaviors (scanning + exfil) that any single metric would
    miss. Surface the top-3 contributing metrics and the destinations responsible in the alert text.
  answer_sources:
  - AWS CloudTrail
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - Windows Event ID 4624
  - 'NAI: Network sensors capturing VPC/VNet flow data (e.g., Zeek sensors), Egress network gateways,
    Cloud VM network kernel logs (e.g., Windows Event ID 5156), and DNS server logs.'
  range: Last 90 days (train >=30 days multivariate hourly)
  queries:
  - technology: Python/ML pseudocode
    query: 'X = per_vm hourly [bytes_sent, conn_count, unique_dst_ports]

      model = multivariate_TS_forecast + change_point detector

      score window after access event

      ALERT if deviation/regime-shift detected

      EXPLAIN top3 metrics + responsible destinations'
- question: On a single VM within a 60-minute window, is there an ordered sequence of (1) a direct cloud
    VM access event, then (2) at least two distinct discovery commands, then (3) an outbound connection
    to a different internal IP on an administrative port (22/3389/5985)?
  context: 'This stateful symbolic-logic rule models the canonical login -> discovery -> pivot path of
    lateral movement. On one VM within 60 minutes, require: 1) a direct cloud VM access event (CloudTrail
    SSM/EC2 Instance Connect/serial console), then 2) >=2 process-creation events (Event ID 4688) for
    discovery commands (whoami, net, ipconfig, hostname, nltest), then 3) an outbound attempt (Zeek conn.log)
    to a different internal IP on an admin port (22, 3389, 5985). Alert on the full ordered sequence --
    this causal chain is far more specific than any single step and directly evidences an adversary pivoting
    deeper. Keep counts/ports/window as hard thresholds.'
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 4648
  - Zeek conn.log
  - 'NAI: Cloud VM instance logs (Security and System), Cloud management plane logs, Network sensors monitoring
    east-west traffic between internal segments, and Domain Controller authentication logs.'
  range: Last 90 days (stateful 60-minute window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "stateful per vm, window=60m:\n  S1 = CloudTrail direct-access event\n  S2 = >=2 distinct EventID=4688\
      \ in {whoami,net,ipconfig,hostname,nltest}\n  S3 = Zeek conn.log to internal dst != vm on port IN\
      \ (22,3389,5985)\nALERT if ORDERED(S1 -> S2 -> S3)"
- question: In the first 60 minutes after a direct login, is the count of discovery commands (and the
    count of failed internal logons / AccessDenied events) statistically elevated for that user role?
  context: 'This statistical method baselines reconnaissance intensity and failures. Profile sessions
    by count of discovery commands (net.exe, ipconfig.exe, nltest.exe, whoami.exe) in the first 60 minutes
    post-login, baselined per user role; keep the deterministic ''95th-percentile'' alert and add a robust
    modified Z-score cutoff. Add the failure-mode signal: count failed internal logons (Event ID 4625)
    and CloudTrail AccessDenied events in the same window. A burst of discovery alongside authentication/permission
    failures indicates scripted reconnaissance and probing typical of an adversary mapping the environment
    after direct VM access.'
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 4648
  - Zeek conn.log
  - 'NAI: Cloud VM instance logs (Security and System), Cloud management plane logs, Network sensors monitoring
    east-west traffic between internal segments, and Domain Controller authentication logs.'
  range: Last 90 days (baseline per role; score 60 minutes post-login)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_role count of discovery procs in first 60m post-login

      x = discovery_count this session; f = EventID=4625 + CloudTrail AccessDenied count

      ALERT if x >= p95(role) OR |0.6745*(x-median)/MAD| > 3.5

      ALERT if f spikes alongside discovery'
- question: When a VM session after a direct-access event is represented as an event sequence (login ->
    process_create -> net_conn -> ...), does an LSTM autoencoder flag it with high reconstruction error
    versus normal admin sessions?
  context: This machine-learning approach detects anomalous session shapes that rules and counts miss.
    Represent sessions as event sequences and train an LSTM autoencoder on normal admin sessions; after
    a direct-access event, alert on high reconstruction error, complementing path-rarity and graph link-prediction
    models of lateral movement. An adversary's login -> discovery -> pivot session will reconstruct poorly
    because its ordering and composition differ from legitimate administration. The alert MUST surface
    the top-3 events/edges contributing most to the reconstruction error (or lowest predicted edge probability)
    so analysts see why the sequence is anomalous.
  answer_sources:
  - AWS CloudTrail
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 4648
  - Zeek conn.log
  - 'NAI: Cloud VM instance logs (Security and System), Cloud management plane logs, Network sensors monitoring
    east-west traffic between internal segments, and Domain Controller authentication logs.'
  range: Last 90 days (train on normal admin sessions)
  queries:
  - technology: Python/ML pseudocode
    query: 'seq = per_session event sequence [login, proc_create, net_conn, ...]

      model = LSTM_autoencoder.fit(normal_admin_sessions)

      err = reconstruction_error(seq after access event)

      ALERT if err > threshold

      EXPLAIN top3 events/edges by error contribution'
