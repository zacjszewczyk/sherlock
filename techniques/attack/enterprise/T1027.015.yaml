name: 'T1027.015: Obfuscated Files or Information: Compression'
id: f2d6f32a-630b-4319-9b75-6e5ccaa792f3
description: Investigate adversary use of compression to obfuscate, stage, and deliver payloads or to
  exfiltrate data. This playbook helps an analyst hunt for compressed archives (ZIP, gzip, 7z, RAR, tar,
  SFX) whose hashes match known-malicious samples, archives built by concatenating multiple ZIP central
  directories to evade parsers, compression utilities run with concealment flags (password protection,
  self-extraction, source deletion, archiving of sensitive directories), download-decompress-execute chains
  that unpack into temporary or user-writable locations before running, interpreter command lines carrying
  long high-entropy or Base64-encoded tokens consistent with packed shellcode or compressed data, and
  network transfers of archives with suspicious packaging (low compression ratio, double extensions, password
  protection, off-port delivery). It correlates endpoint process and file telemetry (Windows Event IDs,
  Sysmon, auditd, macOS unified log) with network evidence (Zeek files.log/conn.log) and applies symbolic-logic
  rules, statistical baselining (frequency, entropy, compression ratio, time-delta and rarity outliers),
  and machine-learning methods (forecasting, classification, clustering, graph and anomaly detection)
  so a SOC analyst can move from a suspicious archive to evidence of concealment, staging, or data theft.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Does any compressed archive seen crossing the network or written to disk have a file hash
    that matches a known-malicious sample in our threat-intelligence feeds, and is that archive present
    on only one or two hosts fleet-wide?
  context: 'This is the strongest deterministic signal: a compressed archive (ZIP, gzip, 7z, RAR) whose
    hash matches threat intelligence is a payload or staging archive already identified by another defender.
    Hash every archive observed in Zeek files.log or accessed per Windows Event ID 4663 and query reputation/TI
    feeds, alerting on any match. Because adversaries trivially repack to evade hash matching, also apply
    prevalence/frequency analysis: an archive hash or filename seen on only 1-2 hosts across the fleet
    is suspicious even without a TI hit. In the context of Stealth, the adversary is trying to blend compressed
    payloads into normal file transfers; a TI match or extreme rarity strips away that concealment. A
    positive result (TI match or near-zero prevalence) warrants immediate isolation and triage of the
    host and the source; a negative result does not clear the archive, since novel samples will not yet
    be in TI.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - 'NAI: Network egress/ingress points (web proxies, email gateways), User endpoints, File servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      archives = FROM Zeek_files.log WHERE mime_type IN archive_types
                  OR FROM WinEventLog WHERE EventID=4663 AND object_name MATCHES archive_ext
      hashes = HASH(archives.payload)
      ti = LOOKUP hashes IN threat_intel_feeds
      prevalence = COUNT_DISTINCT(host) PER hash OVER fleet
      ALERT WHERE ti.match == TRUE OR prevalence <= 2
- question: Does any ZIP archive captured on the network contain more than one End-Of-Central-Directory
    / central-directory record, indicating concatenated ZIP files used to smuggle a hidden payload past
    archive readers?
  context: Adversaries concatenate multiple ZIP files into a single file so the archive appears normal
    but actually embeds extra central directories; some readers (e.g., 7zip vs. native Windows) parse
    different members, letting a malicious payload slip past inspection. Recursively parse each archive
    captured in Zeek files.log and count central-directory / EOCD records; alert when an archive contains
    more than one central directory or fails strict structural parsing. For Stealth, this is a deliberate
    concealment trick that hides the malicious member inside an otherwise benign-looking archive. A positive
    result (multiple central directories or a parse failure that still yields extractable content) is
    a high-confidence evasion indicator that should be detonated in a sandbox; a clean single-directory
    parse is expected for legitimate archives.
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - 'NAI: Network egress/ingress points (web proxies, email gateways), User endpoints, File servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      FOR each archive IN Zeek_files.log WHERE mime_type == "application/zip":
        records = PARSE_ALL_CENTRAL_DIRECTORIES(archive)
        eocd_count = COUNT(records.end_of_central_directory)
        ALERT WHERE eocd_count > 1 OR strict_parse(archive) == FAIL
- question: Which archive filenames or hashes have a fleet-wide prevalence below the 5th percentile (e.g.,
    seen on fewer than two hosts) AND originate from a low-reputation source?
  context: Rarity is itself a signal. Build a fleet-wide frequency distribution of archive filenames and
    hashes, then flag those falling below the 5th percentile of prevalence, especially when they arrive
    from low-reputation domains, IPs, or senders. This catches bespoke payloads that will never appear
    in a TI feed but that betray themselves by being unique to one or two endpoints. For Stealth, a rare
    archive that mimics ordinary file naming yet has no fleet history is a strong concealment indicator.
    A positive result (very low prevalence + low-reputation origin) should be triaged and the archive
    detonated; common archives widely distributed across the fleet are likely benign software or business
    data.
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - 'NAI: Network egress/ingress points (web proxies, email gateways), User endpoints, File servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      counts = COUNT_DISTINCT(host) PER (filename, hash) OVER fleet, 90d
      p5 = PERCENTILE(counts, 5)
      ALERT WHERE counts <= p5 AND source_reputation IN ["low","unknown"]
- question: Does the hourly volume or count of compressed-file transfers deviate sharply from the seasonally-adjusted
    forecast, suggesting bulk staging or exfiltration via archives?
  context: Beyond individual archives, the aggregate flow of compressed data over time reveals staging
    and exfiltration. Fit an online ARIMA/SARIMA model on hourly compressed-transfer byte volume (and
    counts) with business-hour seasonality, alerting when observations exceed the 99th-percentile prediction
    interval. Complement this with CUSUM or PELT change-point detection on the same series to catch abrupt
    regime shifts that a smooth forecast might miss. For Stealth, adversaries try to keep exfiltration
    within normal-looking traffic, but bulk archiving frequently produces volume spikes or sustained shifts.
    A positive result (observed volume above the forecast interval or a detected change point) points
    the analyst to the time window and source to investigate; staying inside the predicted band is consistent
    with normal business compression.
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - 'NAI: Network egress/ingress points (web proxies, email gateways), User endpoints, File servers'
  range: Last 90 days, with hourly buckets and event-centered review of any flagged window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      series = SUM(bytes) PER hour WHERE mime_type IN archive_types
      model = SARIMA(series, seasonal=business_hours)
      pi99 = model.predict_interval(0.99)
      cp = PELT(series) OR CUSUM(series)
      ALERT WHERE observed > pi99.upper OR cp.change_point_detected
- question: Was a compression utility executed with command-line flags indicating password protection,
    self-extraction, source deletion, or archiving of sensitive directories?
  context: 'Compression tools are dual-use, so the differentiator is the flags. Match process-creation
    command lines in Windows Event ID 4688 and Sysmon Event ID 1 for concealment indicators: 7-Zip `-p`
    (password), WinRAR `-hp` (encrypt headers) or `-m5` (max compression), `Compress-Archive` writing
    to temp, `tar`/`gzip`/`zip` writing to /tmp or /dev/shm, source-deletion flags (e.g., `-sdel`, `--remove-files`),
    and self-extracting (SFX) archive creation. These patterns derive from community Sigma rules and can
    be validated with Atomic Red Team emulation. In the Stealth context, password protection and SFX hide
    payload contents and functionality, while source deletion erases the cleartext staging files. A positive
    match on a host with no business reason to archive sensitive paths is a strong staging/concealment
    indicator; benign backup or software-packaging jobs may match and should be allow-listed by user,
    path, and schedule.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User endpoints, Servers (especially those accessible by users or web applications), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM (EventID=4688 OR Sysmon EventID=1)
      WHERE process IN [7z,7za,winrar,rar,Compress-Archive,tar,gzip,zip,makecab]
        AND ( cmdline MATCHES /-p|-hp|-mhe|-m5/        # password / encrypt / max
           OR cmdline MATCHES /-sdel|--remove-files/   # source deletion
           OR cmdline MATCHES /-sfx|self-extract/      # SFX creation
           OR cmdline MATCHES /\\Temp\\|\/tmp\/|\/dev\/shm\// # writable paths
           OR cmdline MATCHES sensitive_dir_regex )
      ALERT with matched_flags
- question: Is a host or user running compression utilities at a rate above its own baseline, or generating
    an unusual spike in failed/aborted archive operations and password-prompt failures?
  context: Track per-host and per-user frequency of compression-tool executions (execs per minute) and
    the state of each operation (success vs. failed/aborted, password-prompt failures). Alert when execution
    count exceeds the host's baseline 99th percentile or when the failure rate spikes. Treat extraction/compression
    errors as a distinct signal because brute-forcing a password, trying multiple archive formats, or
    scripting bulk staging tends to produce bursts and errors that human-driven archiving does not. For
    Stealth, a surge of archive operations or repeated failures suggests automated staging rather than
    normal user activity. A positive result (rate or failure spike above baseline) focuses triage on that
    host/user and time window; steady, low-volume usage matching baseline is expected.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User endpoints, Servers (especially those accessible by users or web applications), Domain Controllers'
  range: Last 90 days, baselined per host/user with event-centered review of spikes.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = BASELINE(count(exec) per minute) PER host,user
      fail = STATE(archive_op) IN ["failed","aborted","password_fail"]
      ALERT WHERE count(exec)/min > P99(base)
         OR rate(fail) > baseline_failure_rate(host,user)
- question: Do the command-line arguments of a compression run differ markedly (low Jaccard similarity)
    from that user's or host's historical compression commands?
  context: Build a per-user/per-host history of compression command argument sets and score each new invocation
    with Jaccard similarity against that history, flagging scores below the 10th percentile as novel or
    rare argument combinations. A user who normally runs `zip -r backup.zip ./docs` but suddenly issues
    `7z a -p -mhe -sdel secret.7z C:\Finance` produces a low-similarity score. For Stealth, sudden adoption
    of concealment-oriented flags by an account that never used them is a behavioral anomaly even when
    each individual flag is legitimate. A positive result (low Jaccard score) is a lead to corroborate
    with the file targets and timing; high similarity to routine usage is benign.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User endpoints, Servers (especially those accessible by users or web applications), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      hist = SET(args) PER user OVER prior 90d
      FOR each new compression exec:
        sim = JACCARD(args(exec), hist[user])
      ALERT WHERE sim < PERCENTILE(sim_distribution, 10)
- question: Does a supervised model (Random Forest / XGBoost) score a compression invocation as suspicious
    based on its flags, command length, entropy, byte volume, and path categories?
  context: 'Where simple rules miss novel combinations, train a Random Forest or Gradient-Boosting (XGBoost)
    classifier on engineered features of compression activity: flag set, command-line length, command-line
    entropy, archived byte volume, and path categories (temp, user-writable, sensitive directories). Score
    each invocation and surface the top-3 feature importances in the alert text so the analyst understands
    why it fired. For Stealth, this captures the holistic ''shape'' of malicious archiving that no single
    flag reveals. A high model score with interpretable drivers (e.g., ''password flag + temp path + high
    entropy'') is a strong triage lead; the explainability lets the analyst confirm or dismiss quickly.
    Requires a labeled training set and periodic retraining to control false positives.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User endpoints, Servers (especially those accessible by users or web applications), Domain Controllers'
  range: Last 90 days for scoring; model trained on a longer labeled history.
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features = [flag_vector, cmd_len, cmd_entropy, byte_volume, path_category]
      model = RandomForest_or_XGBoost.train(labeled_history)
      score = model.predict_proba(features)
      ALERT WHERE score > threshold
        WITH top3 = model.feature_importances(features)[:3]
- question: Did a host download an archive from the internet and, within about five minutes, decompress
    it and execute a file from a temporary or user-writable directory?
  context: This reconstructs the classic download-decompress-execute kill-chain segment. Correlate a downloaded
    archive (Zeek files.log/conn.log) with subsequent decompression (Windows Event ID 4688/4663) and execution
    from a temporary or user-writable path within a 5-minute window. On Linux, look for `chmod +x` followed
    by `execve` from /tmp or /dev/shm. For Stealth, compression hides the payload during delivery, and
    immediate unpack-and-run from a writable directory is exactly how concealed payloads are launched.
    A positive result (full chain within the window) is high-confidence malicious staging and execution
    warranting containment; a download with no decompression or execution, or extraction to a normal install
    location, is far less concerning.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User endpoints, Network ingress points, DMZ servers'
  range: Last 90 days, correlating events within rolling 5-minute windows.
  queries:
  - technology: SIEM/Sequence pseudocode
    query: |-
      dl = FROM Zeek_files.log/conn.log WHERE mime_type IN archive_types
      dec = FROM (EventID=4688 OR 4663) WHERE process IN archivers
      exe = FROM EventID=4688 WHERE image_path IN [temp, user_writable]
             OR (Linux: chmod +x THEN execve FROM /tmp,/dev/shm)
      ALERT WHERE dl THEN dec THEN exe ON same host WITHIN 5m
- question: Is the elapsed time between an archive download and the execution of its unpacked contents
    under 60 seconds (or below the host's 5th-percentile baseline), indicating automated unpack-and-run
    rather than human extraction?
  context: Humans browse, save, and later open downloaded archives; automation unpacks and runs in seconds.
    Baseline the download-to-execution time delta per host and flag sequences below 60 seconds or below
    the 5th percentile of that host's distribution. For Stealth, an automated unpack-and-run flow betrays
    a dropper or loader that the adversary intended to look like an ordinary user opening a file. A positive
    result (very short delta) strongly favors malicious automation and should be correlated with the archive's
    origin and the executed file; longer, human-scale deltas are consistent with normal use.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User endpoints, Network ingress points, DMZ servers'
  range: Last 90 days, computing per-host deltas with event-centered review.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      delta = time(exec_of_unpacked) - time(archive_download) PER host
      base = BASELINE(delta) PER host
      ALERT WHERE delta < 60s OR delta < PERCENTILE(base, 5)
- question: Does provenance graph analysis surface a rare host/file/process subgraph matching a download-extract-execute
    structure?
  context: Model host, file, and process provenance as a graph (downloaded-file -> archiver process ->
    extracted-file -> spawned process) and apply temporal graph-neural-network or node-level graph-anomaly
    detection to flag rare download-extract-execute structures, surfacing the offending nodes and edges
    for triage. This captures multi-step relationships that flat correlation misses and adapts to variations
    in tooling and paths. For Stealth, adversaries vary individual steps to evade signatures, but the
    overall provenance shape remains distinctive and rare. A positive result (anomalous subgraph) gives
    the analyst the exact files and processes to examine; common, frequently-seen subgraphs (e.g., a software
    updater) are benign. Requires provenance collection and a trained graph model.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User endpoints, Network ingress points, DMZ servers'
  range: Last 90 days of provenance data.
  queries:
  - technology: SIEM/Graph-ML pseudocode
    query: |-
      G = BUILD_PROVENANCE_GRAPH(downloaded_file -> archiver -> extracted_file -> spawned_proc)
      scores = TemporalGNN_or_NodeAnomaly(G)
      ALERT WHERE subgraph matches download-extract-execute AND rarity_score > threshold
        WITH offending_nodes, offending_edges
- question: Does any interpreter command line contain a long Base64 string combined with decompression
    keywords such as GZipStream, DeflateStream, IO.Compression, FromBase64String, or ::Decompress?
  context: Adversaries inline compressed shellcode into scripts and decompress it at runtime to avoid
    dropping files. Scan Windows Event ID 4688 and Sysmon Event ID 1 command lines for long Base64 tokens
    paired with .NET/PowerShell decompression keywords (`GZipStream`, `::Decompress`, `DeflateStream`,
    `IO.Compression`, `FromBase64String`). These patterns derive from Sigma gzip/base64 archive-decode
    rules. For Stealth, this fileless decompression hides the payload inside an otherwise normal-looking
    interpreter invocation. A positive match is a high-confidence indicator of in-memory payload staging
    and should trigger capture of the full command line and memory triage; ordinary administrative scripts
    rarely combine large Base64 blobs with decompression APIs.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User endpoints, Domain Controllers, Application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM (EventID=4688 OR Sysmon EventID=1)
      WHERE cmdline MATCHES /[A-Za-z0-9+\/]{200,}={0,2}/   # long Base64
        AND cmdline MATCHES /GZipStream|DeflateStream|IO\.Compression|FromBase64String|::Decompress/
      ALERT with decoded_preview
- question: Is the Shannon entropy of a process's command line above the 99th percentile for that process
    name (e.g., exceeding roughly 6.8-7.0 bits/byte), indicating packed or compressed tokens rather than
    readable script?
  context: Compressed or encoded data has high entropy; ordinary command lines do not. Baseline command-line
    Shannon entropy per process name and flag values above the 99th percentile, using empirical thresholds
    around 6.8-7.0 bits/byte where compressed/encoded tokens live. Operationalize this as a per-process
    entropy detector (e.g., as Elastic does for privileged commands). For Stealth, high-entropy command
    lines reveal concealed payloads that the adversary hoped would pass as normal arguments. A positive
    result (entropy above the per-process threshold) flags a command line for decoding and deeper review;
    normal, low-entropy command lines are expected for most processes. Per-process baselining avoids false
    positives from inherently high-entropy but legitimate tools.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User endpoints, Domain Controllers, Application servers'
  range: Last 90 days, baselined per process name.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each (EventID=4688 OR Sysmon EventID=1):
        H = SHANNON_ENTROPY(cmdline)
      base = BASELINE(H) PER process_name
      ALERT WHERE H > PERCENTILE(base, 99) OR H >= 6.8
- question: Does an unsupervised model (Isolation Forest / One-Class SVM) flag a command line as an outlier
    based on entropy, length, special-character ratio, and decompression-keyword presence?
  context: To catch encoded/compressed command lines without explicit rules, train an Isolation Forest
    or One-Class SVM on features such as command-line entropy, length, special-character ratio, and presence
    of decompression keywords, flagging statistical outliers. Pair the model with LIME to surface the
    top-3 contributing features in each alert so the analyst sees why it fired. For Stealth, this generalizes
    beyond known keyword lists to spot novel obfuscation of compressed payloads. A high outlier score
    with interpretable drivers (e.g., 'entropy + length + FromBase64String') is a strong lead for decoding
    and triage; normal command lines cluster as inliers. Requires a representative baseline of benign
    command lines and periodic retraining.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User endpoints, Domain Controllers, Application servers'
  range: Last 90 days for scoring; trained on a longer benign baseline.
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features = [cmd_entropy, cmd_len, special_char_ratio, decompress_keyword_flag]
      model = IsolationForest_or_OneClassSVM.fit(benign_baseline)
      score = model.decision_function(features)
      ALERT WHERE score indicates outlier
        WITH top3 = LIME(model, features)[:3]
- question: Did a network file transfer carry an archive with a double extension, password protection,
    or an ISO/IMG opened inside an archiver (Mark-of-the-Web bypass), and was it delivered over a non-80/443
    port?
  context: Suspicious packaging on the wire reveals concealment intent. Alert in Zeek when transferred
    files show double extensions (e.g., invoice.pdf.zip), password protection, or are container formats
    (ISO/IMG) handled by an archiver to bypass Mark-of-the-Web, and especially when delivered over non-standard
    ports rather than 80/443. These patterns derive from Sigma compression rules and reported concatenated-ZIP
    campaigns. For Stealth, double extensions and MOTW bypass are designed to fool users and defenses
    into trusting a malicious archive. A positive result (one or more of these traits, particularly off-port)
    is a strong delivery-concealment indicator warranting extraction and detonation; standard archives
    over HTTPS without these traits are routine.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress/ingress points, DMZ'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      FROM Zeek_files.log JOIN Zeek_conn.log ON uid
      WHERE filename MATCHES /\.[a-z]{2,4}\.(zip|rar|7z|gz)$/   # double extension
        OR password_protected == TRUE
        OR (mime_type IN [iso,img] AND opened_by_archiver)
        AND conn.dest_port NOT IN [80,443]
      ALERT
- question: Does a transferred archive have a compression ratio or payload entropy outside the per-service
    baseline, such as a claimed-compressed file whose data is nearly incompressible (ratio near 1) or
    whose entropy exceeds ~7.0?
  context: Compute each transferred archive's Shannon entropy and compression ratio and compare against
    per-service baselines. A claimed-compressed archive whose data is poorly compressible (ratio near
    1) is likely already packed or encrypted content masquerading as a normal archive, and payload entropy
    above roughly 7.0 indicates encrypted or compressed-then-encrypted contents. For Stealth, adversaries
    combine compression with encryption (T1027.013) to defeat content inspection; the resulting entropy/ratio
    signature stands out from genuine compressible documents. A positive result (anomalous ratio and/or
    high entropy) flags the transfer for extraction, password analysis, and detonation; ordinary compressible
    business files fall within baseline. Tune baselines per service to avoid flagging legitimately encrypted
    traffic.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress/ingress points, DMZ'
  range: Last 90 days, baselined per service.
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      FOR each archive IN Zeek_files.log:
        ratio = compressed_size / uncompressed_size
        H = SHANNON_ENTROPY(payload)
      base = BASELINE(ratio, H) PER service
      ALERT WHERE ratio NEAR 1 (outside base percentiles) OR H > 7.0
- question: Is the rate of archive transfers per source, or the rate of blocked/failed archive transfers,
    deviating from baseline at an egress or ingress point?
  context: Track per-source frequency of archive transfers (transfers per minute) and the state of each
    transfer (completed vs. blocked/failed). Alert when transfer volume or the blocked-transfer rate deviates
    from baseline, treating failed or blocked egress as a distinct signal because an adversary probing
    exfiltration paths or hitting DLP controls generates bursts of blocked/failed attempts. For Stealth,
    a source suddenly pushing many archives, or repeatedly failing to, indicates staging or attempted
    data theft that is not blending in. A positive result (rate or failure-rate spike above baseline)
    focuses triage on that source and window; steady, low transfer rates matching baseline are expected.
    Combine with the packaging and entropy signals above for higher confidence.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress/ingress points, DMZ'
  range: Last 90 days, baselined per source with event-centered review of spikes.
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      rate = COUNT(archive_transfer) per minute PER source
      fail = STATE(transfer) IN ["blocked","failed"]
      base = BASELINE(rate, rate(fail)) PER source
      ALERT WHERE rate > P99(base) OR rate(fail) > baseline_block_rate
- question: Does clustering (DBSCAN / Isolation Forest) over archive-transfer features place a transfer
    in a small or noise cluster, indicating an anomalous packaging-and-delivery pattern?
  context: 'Combine multiple transfer attributes for a holistic view: compression ratio, payload entropy,
    password flag, double-extension flag, MIME type, byte volume, and port/service. Run DBSCAN or Isolation
    Forest over these features and investigate transfers that fall into small clusters or are labeled
    noise, surfacing the top contributing features per alert. For Stealth, malicious archive deliveries
    differ from the bulk of normal transfers across several dimensions at once, so they separate from
    the dense benign cluster. A positive result (noise/small-cluster membership) gives the analyst a multi-feature
    rationale to triage the transfer; membership in a large dense cluster of routine transfers is benign.
    Requires periodic re-fitting as normal traffic evolves.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress/ingress points, DMZ'
  range: Last 90 days for clustering, refit periodically.
  queries:
  - technology: Zeek/ML pseudocode
    query: |-
      features = [ratio, payload_entropy, password_flag, double_ext_flag, mime_type, byte_volume, port_service]
      model = DBSCAN_or_IsolationForest.fit(features)
      ALERT WHERE cluster == noise OR cluster_size small
        WITH top_contributing_features
