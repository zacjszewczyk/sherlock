name: 'T1036.004: Masquerading: Masquerade Task or Service'
id: 14331140-1526-44d9-8d49-029480263c96
description: Investigate whether an adversary is masquerading scheduled tasks or services to blend malicious
  persistence and execution into legitimate system activity. This playbook helps an analyst hunt for newly
  created or modified Windows services (Event ID 7045), scheduled tasks (Event ID 4698), Linux systemd
  units and cron jobs, and macOS LaunchAgents/LaunchDaemons whose names, display names, or descriptions
  imitate trusted system entries. It covers correlating task/service executables against known-malicious
  hashes and canonical install paths and signers; scoring fleet-wide hash and path rarity; detecting homoglyph,
  typo, and high-entropy name spoofs via allowlists, Levenshtein/entropy scoring, and anomaly models;
  flagging executables that run from user-writable or temporary directories; spotting core service hosts
  (services.exe, svchost.exe, taskhostw.exe) spawning unexpected scripting interpreters or anomalous child
  processes; and tracing service/task process ancestry to anomalous network destinations using threat
  intelligence, baseline deviation, and time-series anomaly detection. Together these questions let a
  SOC analyst confirm or refute defense-evasion via masqueraded tasks or services across Windows, Linux,
  and macOS estates.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: When a new scheduled task (Event ID 4698) or Windows service (Event ID 7045) is created, does
    the associated executable's hash match a known-malicious indicator, and does an image impersonating
    a system binary run from a non-canonical path or carry a mismatched Authenticode signer?
  context: Supports the Stealth/defense-evasion objective by catching adversaries who name a task or service
    after a trusted system entry while pointing it at malicious code. Correlate the task/service creation
    event with the corresponding process-creation event (Sysmon EID 1 or Security EID 4688) to recover
    the executable hash and full path, then check that hash against integrated threat-intelligence and
    known-malicious blocklists. For any name that impersonates a system binary, assert that the image
    runs from its canonical install path and is signed by the expected vendor; a path or signer mismatch
    is a strong masquerade signal even when the hash is unknown. A positive result (TI hash hit or path/signer
    mismatch) is high-confidence malicious persistence; a clean, properly signed binary in its canonical
    location lowers suspicion.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 7045
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days, centered on the task/service creation or execution event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      newsvc = Event7045 OR Event4698
      proc = JOIN newsvc WITH (Sysmon1 OR Event4688) ON image_path, host
      ALERT WHERE proc.hash IN ti_malicious_hashes
        OR (impersonates_system_name(newsvc.name) AND
            (proc.path != canonical_path(newsvc.name) OR proc.signer != expected_signer(newsvc.name)))
- question: How rare across the fleet is the executable hash and path backing a newly created task or
    service, and is it confined to a single host or the bottom prevalence percentile?
  context: Rare artifacts are a hallmark of targeted, masqueraded persistence; mass-deployed legitimate
    services appear on many hosts, while attacker tooling typically lands on one or a few. Compute fleet-wide
    prevalence of each task/service executable hash and path using bucketed round-robin logging, and flag
    artifacts in the bottom percentile (for example seen on <0.5% of hosts or a single host). Derive the
    percentile threshold from a rolling 30-day baseline of your own estate so it adapts to your environment.
    Record the host count and first-seen time in the alert so an analyst can immediately judge whether
    this is a fresh, isolated implant versus an established benign service.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 7045
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days; baseline computed over a rolling 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = STATS count_distinct(host) AS hosts, min(_time) AS first_seen
               BY exe_hash, exe_path FROM (Event7045 OR Event4698) LAST 30d
      thresh = percentile(base.hosts, 0.5)  // bottom prevalence
      ALERT WHERE base.hosts <= thresh
        EMIT exe_hash, exe_path, base.hosts, base.first_seen
- question: Does a machine-learning model trained on executable entropy, signing status, PE metadata,
    prevalence, and threat-intel scores flag the task/service binary as high-risk, and which features
    drive that score?
  context: Single heuristics produce noise; a learned model can combine many weak signals to prioritize
    the riskiest masquerading binaries. Train XGBoost or Random Forest models on features such as executable
    entropy, signing information, PE metadata, fleet prevalence, and threat-intelligence reputation, then
    use the model score to rank alerts. Crucially, surface the top-3 contributing features (e.g., rare
    prevalence, unsigned, user-writable path) in the alert so the analyst understands why the task/service
    binary was flagged. A high score with explanatory features pointing to rarity and lack of signing
    strongly supports a defense-evasion finding.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 7045
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days; baseline computed over a rolling 30-day window.
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [entropy, signed, pe_metadata, prevalence, ti_score] FOR task_service_exe
      score = xgboost_model.predict(features)
      ALERT WHERE score > risk_threshold
        EMIT top3_features(model, features)
- question: Was a task or service created with a name or display name absent from the allowlist of legitimate
    entries, or one that spoofs a protected name via homoglyphs, typos, trailing spaces, or mixed case?
  context: Adversaries deliberately choose names that look like trusted system tasks/services to evade
    casual review. Alert on new task/service names and display names not present on the allowlist of legitimate
    entries, and on homoglyph or typo spoofs of protected names (for example svch0st, Cyrillic look-alike
    characters, trailing-space or mixed-case variants) matched against the legitimate-name list. A name
    that visually mimics a system service but is not the genuine entry is a direct indicator of masquerading;
    a clean allowlist match is benign.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 7045
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days, centered on the task/service creation or execution event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      newname = (Event7045 OR Event4698).(name, display_name)
      ALERT WHERE newname NOT IN legit_allowlist
        AND is_homoglyph_or_typo_spoof(newname, protected_names)
- question: For non-allowlisted task/service names, how close is each to the nearest legitimate name by
    edit distance (≤2), and does the name's Shannon entropy place it in the random-looking outlier range?
  context: Typo-impersonation and randomly generated names are both statistical tells of masquerading.
    For names not on the allowlist, compute Levenshtein/Damerau distance to the nearest allowlisted name
    and flag a distance of 2 or less as likely typo-impersonation. Separately compute Shannon entropy
    and flag the top 99th percentile as random-looking. Use a robust modified Z-score (median/MAD with
    |score|>3.5) for entropy and length so legitimate naming spikes do not distort the baseline. A near-miss
    edit distance to a real service name, or an unusually high-entropy name, both warrant triage as deceptive
    naming.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 7045
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days; baseline computed over a rolling 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR name NOT IN legit_allowlist:
        d = min(levenshtein(name, n) for n in legit_allowlist)
        ent = shannon_entropy(name)
        z = (ent - median(ent_base)) / (1.4826*MAD(ent_base))
      ALERT WHERE d <= 2 OR z > 3.5
- question: Do anomaly-detection and visual-similarity models flag a task/service name as an outlier on
    length, character n-grams, and digit ratios, or as a homoglyph spoof of a legitimate name?
  context: Edit distance alone misses homoglyph attacks that are visually identical but use different
    code points. Apply Isolation Forest or One-Class SVM to features such as name length, character n-grams,
    and digit ratios to flag outlier names, and use a Siamese visual-similarity model to catch homoglyph
    spoofs that defeat raw code-point edit distance. Report the nearest legitimate name and the top contributing
    features in the alert. A name that is a visual twin of a real system service, or a statistical outlier
    in its feature profile, is strong evidence of masquerading.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 7045
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days; baseline computed over a rolling 30-day window.
  queries:
  - technology: ML/pseudocode
    query: |-
      feat = [length, char_ngrams, digit_ratio] FOR name
      outlier = isolation_forest.predict(feat)
      visual = siamese_homoglyph_model.match(name, legit_names)
      ALERT WHERE outlier OR visual.similarity > 0.9
        EMIT nearest_legit_name, top_features
- question: Does a newly created task or service point to an executable in a user-writable or temporary
    directory (Users, ProgramData, Temp, AppData, /tmp, world-writable paths) rather than a protected
    system location?
  context: Legitimate system tasks and services run from protected, system-owned directories; execution
    from user-writable or temporary locations is abnormal and a common masquerading tell. Alert when task/service
    executables point to user-writable directories (Users, ProgramData, Temp, AppData, /tmp, world-writable
    paths) that are not on an exceptions list, especially when the name impersonates a system service.
    The combination of a system-like name with a non-system, user-writable path is a high-confidence defense-evasion
    indicator.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 7045
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days, centered on the task/service creation or execution event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      newsvc = Event7045 OR Event4698
      risky = [Users, ProgramData, Temp, AppData, /tmp, world_writable]
      ALERT WHERE dir_of(newsvc.exe_path) IN risky
        AND newsvc.exe_path NOT IN exceptions
        AND impersonates_system_name(newsvc.name)
- question: Is the parent directory of a new task/service executable in the bottom 5th percentile of prevalence
    for tasks/services across a 30-day estate baseline?
  context: Beyond fixed risky-directory lists, statistical rarity of the install directory itself catches
    novel masquerade locations. Flag new task/service executables whose parent directories fall into the
    bottom 5th percentile of prevalence for tasks/services over a 30-day estate baseline, and include
    the directory's host count and first-seen time in the alert. A directory that almost no other host
    uses to back a task or service is suspicious regardless of whether it matches a hardcoded risky-path
    pattern.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 7045
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days; baseline computed over a rolling 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = STATS count_distinct(host) AS hosts, min(_time) AS first_seen
               BY parent_dir FROM (Event7045 OR Event4698) LAST 30d
      p5 = percentile(base.hosts, 5)
      ALERT WHERE base.hosts <= p5
        EMIT parent_dir, base.hosts, base.first_seen
- question: Does a model scoring the executable path on directory depth, keywords, rarity, and embedded
    usernames rank it as a suspicious, illegitimate location for a task or service?
  context: Paths carry rich signal that simple rules miss. Score task/service executable paths with models
    that use directory depth, directory keywords, prevalence rarity, and the presence of a username in
    the path to identify suspicious locations, combining prevalence with dynamism and lexical features
    for explainable risk ranking. Surface the top-3 features driving the score in the alert. A high path-risk
    score driven by rarity, deep user-profile nesting, or username presence indicates an attacker-chosen
    masquerade location.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 7045
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days; baseline computed over a rolling 30-day window.
  queries:
  - technology: ML/pseudocode
    query: |-
      feat = [depth, dir_keywords, rarity, username_in_path] FOR exe_path
      score = path_legitimacy_model.predict(feat)
      ALERT WHERE score > threshold
        EMIT top3_features(model, feat)
- question: Did a core service host (services.exe, svchost.exe, taskhostw.exe) spawn a scripting interpreter
    (cmd, powershell, wscript, bash) with suspicious arguments, or was svchost.exe parented by anything
    other than services.exe?
  context: A masqueraded service often reveals itself at execution time by spawning interpreters its legitimate
    counterpart never would. Alert when service hosts (services.exe, svchost.exe, taskhostw.exe) spawn
    interpreters or scripting hosts (cmd, powershell, wscript, bash) with suspicious arguments, and when
    svchost.exe is parented by anything other than services.exe. Legitimate svchost.exe is always launched
    by services.exe; any other parent, or a service host launching a shell, is a strong defense-evasion
    and execution signal warranting immediate triage.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, Domain Controllers'
  range: Last 90 days, centered on the task/service creation or execution event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      ALERT WHERE Event4688.parent IN [services.exe, svchost.exe, taskhostw.exe]
        AND Event4688.child IN [cmd.exe, powershell.exe, wscript.exe, bash]
        AND suspicious_args(Event4688.cmdline)
      ALERT WHERE Event4688.child = svchost.exe AND Event4688.parent != services.exe
- question: Is the parent-child process pairing rooted at a service host unseen across a 90-day fleet
    window, or does its command line exhibit entropy above the 98th percentile?
  context: Rare process lineage and high-entropy command lines distinguish masqueraded service execution
    from benign operations. Build a frequency table of parent-child image pairs across the fleet and flag
    relationships unseen over a 90-day window (rare-parent outliers), plus command lines with entropy
    above the 98th percentile for known pairs. Track child-spawn frequency (children per minute) and failed-start
    counts as distinct signals. A never-before-seen child for a service-host parent, or an obfuscated
    high-entropy command line, indicates anomalous execution under a masqueraded task or service.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, Domain Controllers'
  range: Last 90 days, centered on the task/service creation or execution event.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = STATS count BY parent_image, child_image FROM Event4688 LAST 90d
      ALERT WHERE (parent_image, child_image) NOT IN base
        OR entropy(cmdline) > percentile(entropy_base, 98)
        EMIT children_per_min, failed_starts
- question: Does a process-lineage model (XGBoost or DBSCAN clustering) flag the service-rooted process
    chain as an outlier, with rare-parent, unusual-child, or high-entropy command-line features?
  context: Sequential and clustering models capture multi-step malicious lineage that pairwise rules miss.
    Score process-creation events with an XGBoost lineage model over parent-child and command-line features,
    and/or cluster events with DBSCAN and investigate noise points. Surface the top-3 contributing features
    such as rare-parent, unusual-child, and high-entropy command line in the alert. A process chain flagged
    as a lineage outlier under a service or scheduled-task ancestor supports a masquerading-with-execution
    hypothesis.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, Domain Controllers'
  range: Last 90 days; baseline computed over a rolling 30-day window.
  queries:
  - technology: ML/pseudocode
    query: |-
      feat = lineage_features(parent, child, cmdline)
      score = xgboost_lineage_model.predict(feat)
      clusters = dbscan(feat); noise = points_labeled_-1
      ALERT WHERE score > threshold OR event IN noise
        EMIT top3_features(model, feat)
- question: Does a network connection trace back to a scheduled-task or service ancestor and reach a threat-intel
    destination, a newly registered domain, or trigger NXDOMAIN bursts?
  context: Masqueraded services frequently beacon out; tying network activity back to a service/task ancestor
    reveals C2 hiding behind a trusted-looking name. Trace network connections (Zeek conn/dns/ssl, Sysmon
    EID 3) back to a scheduled-task or service ancestor and alert on destinations present in threat intelligence,
    newly registered domains, or DNS resolution failures (NXDOMAIN bursts) from a process that masquerades
    as a system service. A service-rooted process contacting a known-bad or just-registered domain is
    high-confidence command-and-control behind a defense-evasion facade.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: All Windows Endpoints and Servers; Network Egress Points; DNS Servers'
  range: Last 90 days, correlated to the parent task/service creation time.
  queries:
  - technology: Zeek/pseudocode
    query: |-
      conn = JOIN (Zeek conn/dns/ssl OR Sysmon3) WITH proc_tree ON pid
      svc_rooted = FILTER conn WHERE ancestor IN scheduled_task_or_service
      ALERT WHERE dest IN ti_indicators
        OR domain_age(dest) < 30d
        OR nxdomain_burst(host)
- question: Do a service's connections deviate from its learned baseline of ports, protocols, JA3/JA3S
    hashes, byte volumes, connection rates, and success/blocked ratios beyond 3σ or modified-Z |score|>3.5?
  context: Each legitimate service has a stable network fingerprint; deviation exposes hijacked or masqueraded
    behavior. Compare connections against the service's baseline ports, protocols, JA3/JA3S, byte volumes,
    connections per minute, and success/blocked ratios; flag new ports, rare TLS hashes, NXDOMAIN or blocked-connection
    spikes, or volumes beyond 3σ / modified-Z |score|>3.5 from the learned profile. A service suddenly
    using a new port, a rare JA3, or anomalous data volumes is behaving inconsistently with its identity,
    indicating possible masquerade and C2.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: All Windows Endpoints and Servers; Network Egress Points; DNS Servers'
  range: Last 90 days, correlated to the parent task/service creation time.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      prof = baseline(service) -> {ports, proto, ja3, bytes, conns_min, state_ratio}
      FOR conn IN service_conns:
        z = (metric - median(prof.metric))/(1.4826*MAD(prof.metric))
      ALERT WHERE conn.port NOT IN prof.ports
        OR conn.ja3 NOT IN prof.ja3
        OR z > 3.5 OR metric > mean+3*sigma
- question: Do LSTM autoencoder or provenance-graph models detect traffic spikes/dips inconsistent with
    a service's learned heartbeat, or anomalous causal edges (service-host → interpreter → network)?
  context: Beaconing and staged exfiltration manifest as temporal and causal anomalies that point-in-time
    stats miss. Bucket per-service traffic volumes and apply LSTM autoencoders or provenance-graph anomaly
    models to detect spikes and dips inconsistent with the learned heartbeat and anomalous causal edges
    (service-host → interpreter → network). Report the deviating metric and the graph path in the alert.
    A service whose traffic rhythm breaks from its history, or whose process-to-network provenance path
    is novel, indicates masqueraded execution leading to network activity.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: All Windows Endpoints and Servers; Network Egress Points; DNS Servers'
  range: Last 90 days, correlated to the parent task/service creation time.
  queries:
  - technology: ML/pseudocode
    query: |-
      ts = bucket_volume_per_service(window=5m)
      recon_err = lstm_autoencoder.error(ts)
      graph_anom = provenance_graph_model.score(svc_host -> interpreter -> network)
      ALERT WHERE recon_err > threshold OR graph_anom > threshold
        EMIT deviating_metric, graph_path
