    MIME types, file sizes, and user agents over 30 days and alert when a download size exceeds Q3 + 1.5*IQR
    or the MIME type/user-agent is previously unseen for that host.'
  context: 'Tactic context (Resource Development / Resource Development): for Command and Control the
    adversary pulls additional tooling through C2 or alternate protocols once a foothold exists; for Resource
    Development the analyst is hunting evidence that tools have been staged on external infrastructure
    for use against the network. Evidence under investigation: A file is downloaded from a legitimate
    code or file hosting service (e.g., GitHub, GitLab, Pastebin, Discord CDN, MEGA) where the activity
    is anomalous for the source host or the organization. Anomalies include downloads by non-technical
    users or servers, unusual User-Agent strings, or file types inconsistent with the host''s role. Approach
    (Flag outlier download profiles via IQR, Statistical Method): Baseline per-host MIME types, file sizes,
    and user agents over 30 days and alert when a download size exceeds Q3 + 1.5*IQR or the MIME type/user-agent
    is previously unseen for that host. A positive result means a host or process is receiving files from
    external infrastructure in a manner inconsistent with sanctioned activity (e.g., LOLBin download invocation,
    one-way bulk ingress, download from CTI-flagged or newly registered infrastructure, or extension/MIME
    masquerade); a negative result means the observed transfer matches expected baselines. Investigate
    the named area of interest (Internet gateways, developer workstations, and servers or endpoints that
    are expected to interact with code repositories or file sharing services.) and pivot from any hit
    to the originating process, account, downloaded file hash, and subsequent execution or persistence.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Internet gateways, developer workstations, and servers or endpoints that are expected to interact
    with code repositories or file sharing services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Statistical detection for: Flag outlier download profiles via IQR

      BASELINE metric OVER 30d PER entity

      COMPUTE score (entropy / TF-IDF / percentile / mean+3sigma / IQR / risk-score)

      // Baseline per-host MIME types, file sizes, and user agents over 30 days and alert when a download
      size exceeds Q3 + 1.5*IQR or the MIME type/user-agent is previo

      ALERT WHEN score crosses threshold'
