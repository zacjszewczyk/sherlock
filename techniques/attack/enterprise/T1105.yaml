name: 'T1105: Ingress Tool Transfer'
id: 6d0316e7-93a5-4202-aad3-c6c779c88ae8
description: 'This playbook helps an analyst determine whether an adversary is performing Ingress Tool
  Transfer (T1105): copying tools, malware, scripts, or other files from external adversary-controlled
  infrastructure into the compromised environment over the command-and-control channel or alternate protocols
  (ftp, tftp, scp, sftp, rsync, http/s, web services, and cloud-sync clients). It supports two mission
  questions: whether the adversary is actively transferring tools or files into the network (Command and
  Control), and whether the adversary has staged tools on external infrastructure for use against the
  network (Resource Development). Investigative angles include: matching network flows and downloaded
  files against CTI/malware-hash feeds (Zeek conn/dns/http/ssl/files logs); detecting download-capable
  LOLBin invocations on endpoints (Windows Event ID 4688, Sysmon EID 1 — certutil, bitsadmin, powershell
  IWR/DownloadString, curl, wget); large one-way ingress byte ratios, periodic tool-pull cadence, and
  seasonal volume forecasting on conn.log; Office/browser-spawned shell download chains terminating in
  executable file writes; downloads from newly registered domains and unsanctioned cloud-storage/code-repository
  services initiated by non-browser processes; and file extension/MIME-type masquerade. Detection blends
  symbolic-logic rules, statistical baselining (entropy, TF-IDF, percentiles/IQR, prevalence/domain-age
  scoring, FFT beaconing, SARIMA), and machine learning (Random Forest/XGBoost, autoencoders, Isolation
  Forest, One-Class SVM, DBSCAN, GNN provenance graphs) to produce evasion-resistant, explainable alerts.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
- tactic_id: TA0042
  tactic_name: Resource Development
