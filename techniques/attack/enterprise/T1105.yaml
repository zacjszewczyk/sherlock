questions:
- question: 'Using deterministic rule logic, can you determine whether the activity described by ''Match
    flows and files to TI'' indicates ingress tool transfer? Specifically: Join Zeek logs on uid (conn.log↔dns.log↔http.log↔ssl.log↔files.log)
    and compare id.resp_h, query, host, and server_name against CTI feeds, and files.log md5/sha1 against
    malware-hash repositories; alert high-severity on any match. Reinforce with vendor-neutral [SigmaHQ](https://github.com/SigmaHQ/sigma)
    network rules and [Unit 42 Cobalt Strike Malleable C2](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/)
    URI/header/User-Agent regexes for framework tool-staging. Run TI lookups on internal logs first; external
    API enrichment is optional.'
  context: 'Tactic context (Command and Control / Command and Control): for Command and Control the adversary
    pulls additional tooling through C2 or alternate protocols once a foothold exists; for Resource Development
    the analyst is hunting evidence that tools have been staged on external infrastructure for use against
    the network. Evidence under investigation: A network connection or file transfer event contains an
    indicator (IP address, domain, TLS/SSL certificate, or file hash) that matches an entry in a threat
    intelligence database of known malicious infrastructure or malware. Approach (Match flows and files
    to TI, Symbolic Logic): Join Zeek logs on uid (conn.log↔dns.log↔http.log↔ssl.log↔files.log) and compare
    id.resp_h, query, host, and server_name against CTI feeds, and files.log md5/sha1 against malware-hash
    repositories; alert high-severity on any match. Reinforce with vendor-neutral [SigmaHQ](https://github.com/SigmaHQ/sigma)
    network rules and [Unit 42 Cobalt Strike Malleable C2](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/)
    URI/header/User-Agent regexes for framework tool-staging. Run TI lookups on internal logs first; external
    API enrichment is optional. A positive result means a host or process is receiving files from external
    infrastructure in a manner inconsistent with sanctioned activity (e.g., LOLBin download invocation,
    one-way bulk ingress, download from CTI-flagged or newly registered infrastructure, or extension/MIME
    masquerade); a negative result means the observed transfer matches expected baselines. Investigate
    the named area of interest (Internet gateways, external-facing web proxies, and DNS resolvers.) and
    pivot from any hit to the originating process, account, downloaded file hash, and subsequent execution
    or persistence.'
