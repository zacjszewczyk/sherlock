- question: 'Using statistical baselining, can you determine whether the activity described by ''Alert
    on high-entropy transfer filenames'' indicates ingress tool transfer? Specifically: For files in files.log
    compute Shannon entropy of the filename and, where available, of file content/sections; baseline over
    30 days and flag names above the 99th percentile, applying [Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989)
    thresholds (content/section entropy >7.2 indicates packed/encrypted payloads vs 4.7–6.3 for native
    code) to separate obfuscated downloads from benign files.'
