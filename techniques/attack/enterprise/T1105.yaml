- question: 'Using deterministic rule logic, can you determine whether the activity described by ''Profile
    failed-then-successful pull bursts'' indicates ingress tool transfer? Specifically: As an explicit
    failure-mode signal, count NXDOMAIN responses (dns.log rcode), HTTP 4xx (http.log status_code), and
