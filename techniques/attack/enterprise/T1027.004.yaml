name: 'T1027.004: Obfuscated Files or Information: Compile After Delivery'
id: 42eff30a-6067-46f3-95d0-7a66a5e1e52f
description: Investigate evidence that an adversary delivered payloads as uncompiled source code and compiled
  them on-host to evade defenses (Compile After Delivery, T1027.004). This playbook helps an analyst (1)
  detect source-code artifacts (.cs/.cpp/.c/.il and similar) appearing in non-developer, user-writable
  paths followed by suspicious executable creation; (2) identify compiler execution (csc.exe, ilasm.exe,
  msbuild.exe, gcc, clang, mingw, Xcode/MONO) with atypical parent process lineage or with source/output
  in temporary or web-root locations; (3) reconstruct and correlate the short-window chain of source-write
  -> compile -> binary execution that characterizes a compile-after-delivery workflow; and (4) catch newly
  compiled binaries that immediately establish outbound network connections to rare or untrusted destinations
  indicative of C2. It combines symbolic-logic lineage/path rules, statistical baselining (volume, entropy,
  time-delta, destination rarity), and machine-learning anomaly and sequence models with feature attribution
  across Windows, Linux, and macOS endpoint and network telemetry.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are source-code files (.cs, .cpp, .c, .il, or script-to-source artifacts) being created in
    non-developer, user-writable locations such as %TEMP%, %APPDATA%, Downloads, network shares, or web
    roots, and is a related executable subsequently created or executed from a related directory or name
    within a short window?
  context: 'Compile-after-delivery (TA0005, Stealth) hides a payload as benign text-based source code
    that subverts protections aimed at binaries; the adversary then compiles it on-host. Track creation
    of source files in user-writable/non-developer paths, hash them, and optionally compare against threat
    intelligence — but first-party logic must still fire on lineage and path alone, without a TI hit,
    so detection does not depend on prior knowledge of the sample. Alert when a coupled executable (matching
    directory or base name) is created or executed within a short time window. Exclude sanctioned IDE/CI
    project folders to suppress legitimate developer activity. A positive result (source drop in a temp
    path coupled to a new binary) is a strong indicator of on-host compilation used for defense evasion;
    a negative result narrows the investigation. References: [LOLBins Abuse, Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/);
    [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User profile temporary directories (%APPDATA%, %TEMP%, Downloads), shared network drives, and
    web server directories, excluding designated software development project folders.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  file_create where target_path in (%TEMP%,%APPDATA%,Downloads,\\\\*\\share,webroot)\n\
      \    and extension in (.cs,.cpp,.c,.il)\n    and target_path not in (sanctioned_ide_ci_paths)\n\
      \  | join (process_create or file_create where extension=.exe\n            and (same_dir or same_basename)\
      \ within 10m) on host\n  | enrich hash with TI  // first-party alert fires even if TI miss\n  |\
      \ alert"
- question: Do newly written candidate source-code artifacts exhibit byte entropy inconsistent with human-readable
    source (e.g., Shannon entropy above ~7.0), and are any high-entropy files later decoded or compiled
    into a binary?
  context: 'Benign human-readable source code is low entropy, while encoded or encrypted staged payloads
    exceed roughly 7.0 bits/byte and compiled output is high entropy. Computing Shannon byte-entropy of
    newly written candidate-source artifacts lets an analyst distinguish genuine source from obfuscated
    staged payloads masquerading as source. The deterministic signal to flag is a ''high-entropy file
    later decoded or compiled to a binary'' chain — encoding hides intent from text-targeted scanners
    until the moment of compilation. A high-entropy ''source'' file that becomes an executable strongly
    supports staged-payload defense evasion under TA0005. References: [Using Entropy Analysis to Find
    Encrypted and Packed Malware, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User profile temporary directories (%APPDATA%, %TEMP%, Downloads), shared network drives, and
    web server directories, excluding designated software development project folders.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for f in newly_written_files(ext in source_like):\n    H = shannon_entropy(f.bytes)\n\
      \    if H > 7.0: tag f as high_entropy\n  | correlate high_entropy_file -> (decode_event or compile_event)\
      \ -> binary_create within window\n  | alert"
- question: Is a host or user creating source-code files at a rate or volume that significantly exceeds
    its baseline — for example a non-developer host exceeding the 99th-percentile or three-standard-deviation
    threshold, or creating source where none was observed in the prior 90 days?
  context: 'Abnormal surges in source-file creation on systems that do not normally see development activity
    can indicate staging for on-host compilation. Baseline source-file creation count per minute and daily
    volume per host and per user role, deriving thresholds from a 30-day rolling window, and alert when
    a non-developer host crosses the 99th-percentile or 3-sigma threshold, or produces source files for
    the first time in 90 days. This statistical approach (TA0005) catches anomalous activity even when
    individual files appear benign; a surge on a finance or HR workstation is far more suspicious than
    the same on a developer''s machine. References: [Beehive: Large-Scale Log Analysis, Yen et al.](https://doi.org/10.1145/2523649.2523670).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User profile temporary directories (%APPDATA%, %TEMP%, Downloads), shared network drives, and
    web server directories, excluding designated software development project folders.'
  range: Last 90 days (baseline over 30-day rolling window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = rolling_30d(count(source_file_create) per host, per user_role)\n  for host,user\
      \ in current_window:\n    n = count(source_file_create)\n    if n > p99(baseline) or n > mean+3*std(baseline)\n\
      \       or (n>0 and baseline_90d(host)==0 and role!=developer):\n      alert"
- question: When source and executable files are created together, does an explainable classifier or Isolation
    Forest rate the creation context as high-probability compile-after-delivery, and what are the top
    contributing features?
  context: 'Train a classifier (or Isolation Forest) on source-plus-executable creation contexts using
    features such as path entropy, parent process lineage, signer trust, host role, byte-entropy, and
    the source-to-binary time delta, then prioritize high-probability compile-after-delivery events. The
    alert text must surface the top-3 contributing features so an analyst can quickly judge the verdict
    (e.g., ''untrusted signer + temp path + 4-second source-to-binary delta''). This machine-learning
    method (TA0005) generalizes beyond brittle signatures and provides explainable triage; a high-probability
    score with intuitive features warrants immediate escalation. References: [Isolation Forest vs. Autoencoders,
    Ramaswamy and Palanisamy](https://ieeexplore.ieee.org/document/10143005/); [Obfuscated Command Line
    Detection Using Machine Learning, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User profile temporary directories (%APPDATA%, %TEMP%, Downloads), shared network drives, and
    web server directories, excluding designated software development project folders.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [path_entropy, parent_lineage, signer_trust, host_role,\n             byte_entropy,\
      \ source_to_binary_delta]\n  model = IsolationForest().fit(historical_source_plus_exe_contexts)\n\
      \  score = model.decision_function(event.features)\n  if score in outlier_region:\n    alert(top3=shap_topk(event,3))"
- question: Are compilers (csc.exe, ilasm.exe, msbuild.exe, gcc, clang, mingw) being launched with atypical
    parent processes (Office apps, script hosts, browsers, mail clients), with inline or encoded source
    arguments, or with output written to temp/public/web paths not tied to approved build tooling?
  context: 'Sanctioned compilation runs under known build tooling with predictable parentage; adversary
    on-host compilation (TA0005) is typically spawned by delivery vectors. Alert on compiler launches
    with atypical parentage, inline/encoded source arguments, or output written to temp/public/web paths
    outside approved build pipelines, maintaining a per-binary expected-parent allow-list. A csc.exe child
    of winword.exe writing an EXE to %TEMP% is a classic compile-after-delivery pattern; matching against
    the allow-list of expected parents distinguishes it from legitimate developer or CI builds. References:
    [Unusual Parent-Child Relationship, Elastic](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/);
    [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Application Servers, User endpoints (especially non-developer workstations),
    and software development environments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  process_create where name in (csc.exe,ilasm.exe,msbuild.exe,gcc,clang,mingw)\n    and\
      \ ( parent_image in (winword,excel,powershell,wscript,cscript,browser,outlook)\n          or cmdline\
      \ matches inline_or_encoded_source\n          or output_path in (%TEMP%,public,webroot) )\n    and\
      \ parent_image not in expected_parent_allowlist[name]\n  | alert"
- question: For each user, does a compiler execution deviate from their baseline — a parent process new
    to that user, frequency above the 95th percentile, or command-line Shannon entropy above the high-entropy
    threshold suggesting encoded inline source or randomized arguments?
  context: 'Baseline each user''s compiler usage (typical parents, argument patterns, and frequency) and
    flag executions where the parent process is new to that user, the frequency exceeds the 95th percentile,
    or command-line entropy is high (indicating encoded inline source or randomized/obfuscated arguments).
    This statistical approach (TA0005) adapts to each user, so a developer''s routine builds stay quiet
    while an anomalous compiler invocation on a non-developer account, or with an obfuscated command line,
    stands out. High command-line entropy is a known indicator of inline encoded payloads passed directly
    to a compiler. References: [High Command Line Entropy Detected for Privileged Commands, Elastic](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html);
    [Using Entropy Analysis, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Application Servers, User endpoints (especially non-developer workstations),
    and software development environments.'
  range: Last 90 days (baseline over 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = per_user(compiler parents, arg_patterns, freq) over 30d\n  for exec in compiler_executions:\n\
      \    if exec.parent not in baseline.parents[user]\n       or exec.freq > p95(baseline.freq[user])\n\
      \       or shannon_entropy(exec.cmdline) > high_entropy_threshold:\n      alert"
- question: Does an Isolation Forest trained on compiler executions flag this invocation as a significant
    outlier, and what top features drive the anomaly?
  context: 'Train an Isolation Forest on features from both developer and non-developer workstations —
    parent process, user, host role, tokenized command arguments, output path, and working directory —
    and alert on significant outliers, emitting the top-3 anomaly-driving features in each alert. This
    machine-learning method (TA0005) captures multi-dimensional ''weirdness'' that single rules miss,
    while the feature attribution (e.g., ''non-dev host + output to %TEMP% + browser parent'') gives the
    analyst an immediate, explainable rationale to triage suspected compile-after-delivery. References:
    [Isolation Forest vs. Autoencoders, Ramaswamy and Palanisamy](https://ieeexplore.ieee.org/document/10143005/);
    [Obfuscated Command Line Detection Using Machine Learning, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Application Servers, User endpoints (especially non-developer workstations),
    and software development environments.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [parent_process, user, host_role, tokenized_args,\n             output_path,\
      \ working_dir]\n  model = IsolationForest().fit(compiler_execs_dev_and_nondev)\n  if model.predict(exec.features)\
      \ == outlier:\n    alert(top3=feature_attribution(exec,3))"
- question: Can you correlate a complete chain of source-file creation, compiler invocation, and execution
    of the produced binary on a single host — with path/name linkage validating that the same artifact
    flows through each stage — occurring outside approved CI/CD or developer endpoints?
  context: 'The defining signature of compile-after-delivery (TA0005) is a short-window chain: source
    written, compiler invoked on it, and the resulting binary executed. Statefully correlate these three
    events with path/name linkage validation so you only fire on genuinely linked artifacts, and alert
    on complete chains (success state) outside approved CI/CD or developer systems. Treat compile-then-failed-execute
    and compile-then-blocked-egress as distinct lower-severity signals so partial chains are still recorded
    for context. A complete validated chain on a user workstation is a high-confidence detection. References:
    [LOLBins Abuse, Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/); [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User workstations, Web application servers, CI/CD pipeline servers, and ephemeral or containerized
    environments.'
  range: Last 90 days (event-centered correlation, link events within a short window per host)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  seq by host within 10m:\n    A = file_create(source_ext)\n    B = process_create(compiler)\
      \ where cmdline references A.path/name\n    C = process_create(binary) where image links to B.output\
      \ (path/name)\n  if A->B->C complete and host not in approved_ci_dev:\n    alert(severity=high)\n\
      \  elif A->B and C.failed: alert(severity=low)\n  elif A->B->C and egress_blocked: alert(severity=low)"
- question: On a given host, is the time delta between source-file writes and compiler execution (or between
    compiler execution and binary execution) anomalously short — below the 5th percentile (under ~10 seconds)
    — indicating automated rather than interactive build behavior?
  context: 'Interactive human development involves editing and pauses; automated compile-after-delivery
    executes the chain near-instantly. Baseline per host the delta between source-file writes and compiler
    executions, and between compiler-exec and binary-exec, then flag non-developer hosts where the delta
    falls below the 5th percentile (under ~10 seconds), deriving thresholds from a 30-day per-host window.
    This statistical timing signal (TA0005) catches scripted build-and-run workflows; sub-10-second source-to-binary
    transitions on a non-developer host strongly suggest an automated dropper rather than legitimate coding.
    References: [Beehive: Large-Scale Log Analysis, Yen et al.](https://doi.org/10.1145/2523649.2523670).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User workstations, Web application servers, CI/CD pipeline servers, and ephemeral or containerized
    environments.'
  range: Last 90 days (baseline over 30-day per-host window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = per_host p5(delta(source_write -> compiler_exec),\n                     \
      \     delta(compiler_exec -> binary_exec)) over 30d\n  for chain on host:\n    if host.role != developer\
      \ and chain.delta < min(p5, 10s):\n      alert"
- question: Does a sequence model (HMM/RNN) or provenance-graph learner score a host's event stream (file
    create, process exec, network) as a low-probability compile-after-delivery sequence, and can the contributing
    subgraph be reconstructed for triage?
  context: 'Train an HMM/RNN, or use provenance-graph learning, on host event streams (file creation,
    process execution, network) to learn benign transition probabilities, then alert when an observed
    sequence matches a low-probability compile-after-delivery chain. Provenance approaches additionally
    reconstruct the offending subgraph and surface contributing nodes, accelerating triage. This machine-learning
    method (TA0005) detects novel orderings of file/process/network events that rule logic would miss,
    and the reconstructed subgraph gives the analyst a ready-made causal narrative of source-write ->
    compile -> execute -> network. References: [Detecting Intrusions Using System Calls, Warrender et
    al.](https://ieeexplore.ieee.org/document/766910); [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf);
    [ThreaTrace, Wang et al.](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User workstations, Web application servers, CI/CD pipeline servers, and ephemeral or containerized
    environments.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  model = HMM_or_RNN.fit(benign_host_event_sequences)  # or provenance GNN\n  p = model.sequence_probability(host.recent_events)\n\
      \  if p < low_prob_threshold and matches(compile_after_delivery_pattern):\n    alert(subgraph=reconstruct_provenance(host.events))"
- question: Does a newly compiled process (by process GUID) initiate immediate outbound connections, and
    do DNS/TI enrichment reveal malicious infrastructure or DGA-like domains — recognizing that the compile->binary->egress
    lineage itself is suspicious even without a TI match?
  context: 'A compile-after-delivery payload often reaches out for C2 immediately after it is built and
    run (TA0005). Correlate newly compiled process GUIDs to their immediate outbound connections, enrich
    with DNS and threat intelligence, and alert on connections to malicious infrastructure or DGA-like
    domains. Critically, the first-party logic fires on the compile->binary->egress lineage even absent
    a TI match, so freshly minted, never-before-seen malware is still caught. A newly compiled binary
    calling out to a rare or algorithmically generated domain within seconds is a strong C2 indicator.
    References: [LOLBins Abuse, Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/); [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network egress points (Firewalls/Gateways), DNS servers, Endpoint network stacks (via Sysmon),
    and cloud service provider flow logs.'
  range: Last 90 days (event-centered on compile/execution time)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  newly_compiled = process_create where image links to recent compile output\n  | join\
      \ network_connect on process_guid within 5m\n  | enrich dest with dns + TI + dga_score\n  if TI_malicious\
      \ or dga_score high or (lineage compile->binary->egress):\n    alert"
- question: After a compiled binary executes, are its destination IP/port and JA3/JA3S fingerprints rare
    (occurring in under 1% of traffic over 30 days) or directed to a country unseen in 90 days, and is
    there a spike in post-compile connection failures (NXDOMAIN, 404, RST/blocked)?
  context: 'After a compiled binary executes, measure destination IP/port and JA3/JA3S prevalence over
    30 days and alert when those hashes occur in under 1% of traffic or the destination country has not
    been seen in 90 days. Separately profile post-compile failure rates — NXDOMAIN responses, HTTP 404s,
    blocked or RST connections — and alert on spikes as a distinct beacon/failed-C2 signal. This statistical
    approach (TA0005) flags both successful rare-destination C2 and the failure bursts typical of a payload
    probing for a live controller; either pattern following a fresh compile is highly suspicious. References:
    [Beehive: Large-Scale Log Analysis, Yen et al.](https://doi.org/10.1145/2523649.2523670); [Using Entropy
    Analysis, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network egress points (Firewalls/Gateways), DNS servers, Endpoint network stacks (via Sysmon),
    and cloud service provider flow logs.'
  range: Last 90 days (prevalence over 30 days, novelty over 90 days)
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  prevalence = count(dest_ip:port, ja3, ja3s)/total over 30d\n  for conn from post_compile_process:\n\
      \    if prevalence(conn) < 0.01 or conn.dest_country not_seen_in 90d:\n      alert(type=rare_destination)\n\
      \  fail_rate = count(NXDOMAIN,http_404,RST,blocked) per host post_compile\n  if fail_rate > baseline_spike:\
      \ alert(type=failed_c2)"
- question: Following a compile execution, does the host's outbound byte volume or unique-destination-IP
    count significantly deviate from a per-host forecast produced by a sequence/provenance model, and
    what top features explain the deviation?
  context: 'Use sequence/provenance models or per-host volume forecasting to predict expected outbound
    byte volume and unique-IP counts, then — following a compile execution — alert when observed network
    behavior significantly deviates from the forecast, emitting the top-3 contributing features (for example
    new destination, byte-volume ratio, connection frequency). This machine-learning method (TA0005) catches
    data staging or C2 from a freshly compiled binary that does not trip rare-destination thresholds,
    and the feature attribution lets an analyst confirm whether the deviation reflects malicious exfiltration
    or benign change. References: [ThreaTrace, Wang et al.](https://arxiv.org/pdf/2111.04333); [Deep learning
    Sequential model, Catak et al.](https://peerj.com/articles/cs-285/); [Isolation Forest vs. Autoencoders,
    Ramaswamy and Palanisamy](https://ieeexplore.ieee.org/document/10143005/).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network egress points (Firewalls/Gateways), DNS servers, Endpoint network stacks (via Sysmon),
    and cloud service provider flow logs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  forecast = per_host_model.predict(out_bytes, unique_dest_ips)\n  observed = measure_after(compile_exec)\n\
      \  if abs(observed - forecast) > deviation_threshold:\n    alert(top3=attribution([new_dest, byte_volume_ratio,\
      \ conn_freq]))"
