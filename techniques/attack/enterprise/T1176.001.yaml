name: 'T1176.001: Browser Extensions'
id: ec7c59fe-7b36-4da1-9fb3-6830174b104d
description: 'Investigate adversary use of malicious browser extensions to establish and maintain persistent
  access on Windows, Linux, and macOS endpoints. This playbook helps an analyst hunt the full lifecycle
  of extension abuse: silent side-loading and update-hijacking (out-of-browser writes to extension directories,
  chromium Preferences/Secure Preferences files, force-install registry keys, and macOS .mobileconfig
  profiles), high-risk permission grants in extension manifests, benign-to-malicious silent update deltas,
  browser processes spawning command shells or scripting engines as RAT installers/droppers, and the network
  signatures of extension-driven C2 and data exfiltration (process-bound connections to known C2, TLS/HTTP
  fingerprint mismatches, beaconing, rare or newly-registered destinations, volume/frequency anomalies,
  and browser-initiated internal reconnaissance or lateral movement). Each question pairs deterministic
  symbolic-logic rules with statistical baselining and machine-learning anomaly scoring so a SOC can confirm
  or refute browser-extension persistence across endpoint and network telemetry.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is a browser process on any endpoint connecting to a destination IP or domain that appears
    on a high-confidence command-and-control (C2) threat-intelligence feed, and can that connection be
    bound to the originating browser image?
  context: 'Tactic: Persistence. Malicious browser extensions inherit the browser''s permissions and exfiltrate
    user data to attacker endpoints distinct from the sites a user is visiting, so the deterministic floor
    is a process-bound network match. Bind each outbound connection to its initiating image using Sysmon
    Event ID 3 or Windows Event ID 5156, then join Zeek conn.log with dns.log to map destination IPs to
    the domains that were resolved, and compare both the IP and domain against a curated, high-confidence
    C2 feed. A match where the initiator is chrome.exe/firefox.exe/msedge.exe is a high-severity true
    positive worthy of immediate host isolation; no match lowers but does not eliminate suspicion since
    novel C2 will not yet be on a feed.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - WinEventLog:Sysmon EventCode=3
  - 'NAI: Egress points to the internet (e.g., firewalls, proxies), DNS resolvers, User workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'let browsers = (chrome.exe, firefox.exe, msedge.exe, brave.exe, opera.exe)

      from netconn (Sysmon EID 3 OR WinEventLog 5156)

      where image in browsers

      join zeek_conn on (src_ip, dst_ip, dst_port, ts within 5m)

      join zeek_dns on (dst_ip == answers)

      where dst_ip in ti_c2_feed OR query in ti_c2_feed

      -> alert severity=high "Browser process connecting to known C2"'
  - technology: Zeek/pseudocode
    query: 'conn.log JOIN dns.log ON id.resp_h == dns.answers

      WHERE id.resp_h IN c2_intel OR dns.query IN c2_intel

      OUTPUT id.orig_h, id.resp_h, dns.query, ts'
- question: Does TLS or HTTP traffic attributed to a browser process present a JA4/JA4H fingerprint that
    does not match the genuine, version-appropriate fingerprint for that browser build, or does a rare
    fingerprint talk to a low-prevalence domain?
  context: 'Tactic: Persistence. Extension-delivered code, native-messaging helpers, or scripting stacks
    may speak on the browser''s behalf but cannot perfectly mimic the real browser''s TLS/HTTP stack.
    Compute JA4 (TLS) and JA4H (HTTP header order/case) fingerprints from Zeek ssl.log/http.log and compare
    them against the expected fingerprint for the installed browser and version on that host. A mismatch,
    or a rare JA4 reaching a low-prevalence domain, indicates non-browser code using the browser''s network
    identity. A clean match argues the traffic is genuinely the browser; a mismatch warrants deeper inspection
    of the host''s extensions and native messaging hosts.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - WinEventLog:Sysmon EventCode=3
  - 'NAI: Egress points to the internet (e.g., firewalls, proxies), DNS resolvers, User workstations'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "ssl.log/http.log -> compute ja4, ja4h per (host, ts)\nexpected = lookup_expected_ja4(host_browser_version)\n\
      where ja4 != expected OR ja4h != expected_ja4h\n   OR (rare(ja4) AND prevalence(dst_domain) < p01)\n\
      -> alert \"TLS/HTTP fingerprint inconsistent with claimed browser\""
- question: Is any host generating an abnormal spike in failed DNS resolutions (NXDOMAIN) or blocked/denied
    egress connections, consistent with an extension beaconing to dead or sinkholed C2 infrastructure?
  context: 'Tactic: Persistence. An extension beaconing to C2 that is offline, taken down, or sinkholed
    produces a measurable State signal: bursts of NXDOMAIN answers and blocked/refused egress attempts.
    Profile each host''s hourly NXDOMAIN count (Zeek dns.log) and blocked-connection count (firewall logs,
    Windows Event ID 5157) over a 14-day baseline, then flag hosts whose hourly count exceeds a robust
    modified z-score threshold of |M| > 3.5. A spike isolated to one host, especially tied to a browser
    process, strongly suggests automated beaconing rather than human browsing.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - WinEventLog:Sysmon EventCode=3
  - 'NAI: Egress points to the internet (e.g., firewalls, proxies), DNS resolvers, User workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per host, per hour: nxdomain_ct = count(dns.rcode==NXDOMAIN)\n                    blocked_ct\
      \  = count(EID 5157 OR fw_deny)\nbaseline = 14d median + MAD per host\nM = 0.6745*(x - median)/MAD\n\
      where abs(M) > 3.5 -> alert \"Beacon-to-dead-C2 failure spike\""
- question: Are browser processes connecting to destination domains that are rare across the enterprise
    (bottom 1st percentile of prevalence) or newly registered, mirroring the reputation features that
    drive high extension-detection rates?
  context: 'Tactic: Persistence. Malicious extension C2 and exfil destinations are typically rare or newly-registered
    domains rather than the popular sites a fleet visits daily. For each destination domain in Zeek dns.log,
    compute enterprise-wide prevalence over a 30-day window and flag browser connections to domains in
    the bottom 1st percentile. This mirrors the destination/developer reputation features behind WebEval''s
    96.5% detection rate. A connection to a domain seen on only one host, or registered days ago, is a
    strong lead; widely-seen domains are likely benign.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - WinEventLog:Sysmon EventCode=3
  - 'NAI: Egress points to the internet (e.g., firewalls, proxies), DNS resolvers, User workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'prevalence[domain] = count(distinct host) over 30d

      threshold = percentile(prevalence, 1)

      from dns.log where initiator==browser

      where prevalence[query] <= threshold OR domain_age(query) < 14d

      -> alert "Browser connecting to rare/new domain"'
- question: When each browser-host hour is scored by an unsupervised anomaly model over outbound volume,
    connection frequency, distinct destinations, domain entropy, and failure ratio, which hours surface
    as outliers indicating extension-driven exfiltration?
  context: 'Tactic: Persistence. The physics of extension exfiltration (large outbound transfers, many
    connections, high-entropy or numerous destinations, elevated failure ratios) can be captured collectively
    even when no single rule fires. Score each browser-host hour with an Isolation Forest over {outbound
    bytes, connections/min, distinct destinations, domain-name entropy, fraction of failed connections}
    on a rolling 30-day baseline, and surface the top-3 contributing features (e.g., ''bytes_out=+6 sigma,
    distinct_dst=+4 sigma, fail_ratio=0.4'') so analysts understand why it fired. High-scoring hours warrant
    correlation with installed extensions and process lineage.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - WinEventLog:Sysmon EventCode=3
  - 'NAI: Egress points to the internet (e.g., firewalls, proxies), DNS resolvers, User workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features per (host, hour) for browser flows:\n  [bytes_out, conns_per_min, distinct_dst, domain_entropy,\
      \ fail_ratio]\nmodel = IsolationForest(train=30d_rolling)\nscore = model.decision_function(x)\n\
      where score in top anomalies -> alert with top3_contributing_features"
- question: Is a non-browser process writing to a browser extension directory, modifying chromium Preferences/Secure
    Preferences, or writing to extension force-install or update_url registry keys without being a legitimate
    browser or whitelisted MDM/installer?
  context: 'Tactic: Persistence. Silent side-load and update-hijack are the core persistence vectors for
    this technique: editing %LOCALAPPDATA%\Google\Chrome\User Data\Default\Extensions, the Preferences/Secure
    Preferences files, or registry keys such as HKLM\Software\Policies\Google\Chrome\ExtensionInstallForcelist
    and an extension''s update_url allows an attacker to register an extension with no Web Store review
    and no user consent. Alert when a file modification (Sysmon EID 11 / auditd) or registry write (Windows
    Event ID 4657 / Sysmon EID 13,14) hits these protected paths and the initiating process is not a legitimate
    browser or approved management tool. Legitimate force-install via verified GPO/MDM is the main benign
    cause to exclude.'
  answer_sources:
  - WinEventLog:Sysmon EventCode=11
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4657
  - WinEventLog:Sysmon EventCode=13,14
  - auditd:SYSCALL
  - 'NAI: User workstations, Domain Controllers (for Group Policy Objects), Configuration management servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let protected = (\"*\\\\User Data\\\\*\\\\Extensions\\\\*\", \"*\\\\Secure Preferences\",\
      \ \"*\\\\Preferences\")\nlet reg = (\"*\\\\ExtensionInstallForcelist\\\\*\", \"*\\\\Extensions\\\
      \\*\\\\update_url\")\nfrom (Sysmon EID 11 OR auditd path-write OR EID 4657 OR Sysmon EID 13,14)\n\
      where (target in protected OR reg_key in reg)\n  and initiator not in (browser_images, approved_mdm)\n\
      -> alert \"Out-of-browser extension install/side-load\""
  - technology: auditd/pseudocode
    query: '-w /home/*/.config/google-chrome/Default/Extensions -p wa -k ext_write

      -w /home/*/.config/google-chrome/Default/Secure Preferences -p wa -k ext_pref

      search SYSCALL where key in (ext_write, ext_pref) and comm not in browsers'
- question: Does any chromium extension entry have an invalid HMAC/super_mac in Secure Preferences, or
    appear immediately after an out-of-browser file write, indicating an extension planted while the browser
    was not running?
  context: 'Tactic: Persistence. Chromium HMAC-signs each extension entry in Secure Preferences so that
    entries cannot be silently added while the browser is closed; an attacker who edits the file directly
    cannot recompute a valid signature without the per-profile seed. Flag any extension whose super_mac/HMAC
    does not validate, or whose registration appears right after an external file write to Secure Preferences.
    A failed HMAC validation is high-confidence evidence of tampering and direct file-level persistence;
    valid signatures indicate the extension was installed through the browser''s normal flow.'
  answer_sources:
  - WinEventLog:Sysmon EventCode=11
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4657
  - WinEventLog:Sysmon EventCode=13,14
  - auditd:SYSCALL
  - 'NAI: User workstations, Domain Controllers (for Group Policy Objects), Configuration management servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "collect Secure Preferences per host\nfor each extension entry: recompute HMAC(seed, path||entry)\n\
      where stored_hmac != computed_hmac OR super_mac invalid\n   OR entry_added_ts within 5m of external_write(Secure\
      \ Preferences)\n-> alert \"Tampered Secure Preferences extension entry\""
- question: Across the fleet, which processes that write to browser extension directories or Preferences
    files are first-seen or statistically rare for that protected path?
  context: 'Tactic: Persistence. Beyond explicit allow/deny lists, a behavioral baseline catches novel
    side-load tooling. Baseline every process image that writes to browser extension directories and Preferences/Secure
    Preferences files across the fleet, then alert on any source process that is first-seen or statistically
    rare for that protected path using a robust modified z-score (|M| > 3.5) instead of a brittle fixed
    count. A rare writer (e.g., a one-off PowerShell or a renamed installer) touching extension state
    is a strong lead for silent persistence; common writers (the browser itself, your standard MDM agent)
    are filtered out.'
  answer_sources:
  - WinEventLog:Sysmon EventCode=11
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4657
  - WinEventLog:Sysmon EventCode=13,14
  - auditd:SYSCALL
  - 'NAI: User workstations, Domain Controllers (for Group Policy Objects), Configuration management servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "writers[path_class] = histogram(process_image) over fleet, 90d\nfor each new write event:\n\
      \  M = modified_zscore(freq(writer, path_class))\nwhere first_seen(writer, path_class) OR abs(M)\
      \ > 3.5\n-> alert \"Rare process writing extension state\""
- question: When each extension-directory or registry write is classified by a supervised model using
    parent image, command line, user context, signing status, and target path, which writes score as suspicious
    side-loads rather than benign installs?
  context: 'Tactic: Persistence. Many writes to extension paths are legitimate (the browser updating itself,
    sanctioned MDM force-install), so a classifier blending behavioral and provenance features separates
    benign installs from attacker side-loads. Train a Random Forest on process-execution features {parent
    image, command-line tokens, user context, signing status, target path class} to label each extension-directory/registry
    write as benign-install vs suspicious side-load, emitting the top-3 features behind each verdict.
    This mirrors WebEval''s blend of behavioral and provenance signals. Suspicious verdicts feed triage
    with explainable reasons.'
  answer_sources:
  - WinEventLog:Sysmon EventCode=11
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4657
  - WinEventLog:Sysmon EventCode=13,14
  - auditd:SYSCALL
  - 'NAI: User workstations, Domain Controllers (for Group Policy Objects), Configuration management servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features per write-event:\n  [parent_image, cmdline_tokens, user_context, signed?, target_path_class]\n\
      model = RandomForest(labels=benign_install|suspicious_sideload)\npred, importances = model.predict(x)\n\
      where pred==suspicious_sideload -> alert with top3_importances"
- question: Does a newly created or modified extension manifest.json declare a high-risk permission combination
    such as <all_urls> with webRequest/cookies, or any use of nativeMessaging or the debugger permission?
  context: 'Tactic: Persistence. The permissions an extension declares define exactly the cross-site data
    access and command channels it can abuse. On creation/modification of an extension''s manifest.json
    (Sysmon EID 11 / auditd), parse the declared permissions and content_scripts matches, then raise an
    alert for high-risk combinations: <all_urls> host permissions combined with webRequest or cookies
    (enabling broad data interception), or any nativeMessaging (a path to local code execution) or debugger
    permission (full page control). These are the capabilities exploited by data-stealing and RAT-installer
    extensions. A high-risk grant on a freshly installed or recently changed extension is a priority review;
    common low-permission extensions are deprioritized.'
  answer_sources:
  - WinEventLog:Sysmon EventCode=11
  - Extension manifest.json files
  - Chromium Secure Preferences
  - auditd:SYSCALL
  - 'NAI: User workstations, Configuration management servers, EDR file-content collection'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on manifest.json create/modify (Sysmon EID 11 / auditd):\n  perms = parse(permissions, host_permissions,\
      \ content_scripts)\nwhere (\"<all_urls>\" in perms AND (\"webRequest\" in perms OR \"cookies\" in\
      \ perms))\n   OR \"nativeMessaging\" in perms OR \"debugger\" in perms\n-> alert \"High-risk extension\
      \ permission set\""
- question: Which installed extensions have a permission set that is rare across the fleet (bottom percentile)
    or appear on only a single host?
  context: 'Tactic: Persistence. Reputation and prevalence are central to large-scale extension triage:
    malicious or unwanted extensions tend to have unusual permission profiles and tiny install footprints.
    Compute the fleet-wide prevalence of each extension''s permission set and flag rare combinations (bottom
    percentile) or extensions installed on a single host. A unique extension carrying broad permissions
    on one workstation is a much stronger lead than a widely-deployed corporate extension; this surfaces
    targeted side-loads that signature rules miss.'
  answer_sources:
  - WinEventLog:Sysmon EventCode=11
  - Extension manifest.json files
  - Chromium Secure Preferences
  - auditd:SYSCALL
  - 'NAI: User workstations, Configuration management servers, EDR file-content collection'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each extension: perms_hash, install_host_count\nprevalence[perms_hash] = count(distinct\
      \ host)\nwhere prevalence[perms_hash] <= percentile(prevalence, 5)\n   OR install_host_count ==\
      \ 1\n-> alert \"Rare extension permission set / single-host extension\""
- question: When an extension version changes, does the code delta newly reach sensitive WebExtension
    APIs (cookies, downloads, tabs.executeScript, fetch/XHR) in a pattern resembling known-malicious update
    deltas?
  context: 'Tactic: Persistence. Benign-to-malicious silent updates via update_url are a documented attack:
    an extension passes review, then a later version introduces malicious behavior pushed automatically.
    When an extension version changes, diff the code, encode the delta by the sensitive APIs it newly
    reaches, and score it against clusters of known-malicious deltas, surfacing the top-3 newly-abused
    APIs in the alert. This directly targets update-hijack persistence and reuses static sensitive-flow
    modeling. A delta that suddenly routes externally controllable input into cookies/downloads/executeScript
    is a high-priority finding even if the extension was previously trusted.'
  answer_sources:
  - WinEventLog:Sysmon EventCode=11
  - Extension manifest.json files
  - Chromium Secure Preferences
  - auditd:SYSCALL
  - 'NAI: User workstations, Configuration management servers, EDR file-content collection'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "on extension version change:\n  delta = diff(code_v_new, code_v_old)\n  feat = sensitive_apis_newly_reached(delta)\
      \  # cookies, downloads, executeScript, fetch\nscore = cluster_distance(feat, known_malicious_delta_clusters)\n\
      where score crosses threshold -> alert with top3_newly_abused_apis"
- question: Is a browser process the parent of a command shell or scripting engine such as cmd.exe, powershell.exe,
    wscript.exe, cscript.exe, mshta.exe, or rundll32.exe?
  context: 'Tactic: Persistence. Extensions have been used as installers/droppers for persistent RATs,
    and a browser spawning a shell or script interpreter is not normal browsing behavior. Create a high-priority
    alert when a browser process is the parent of cmd.exe, powershell.exe, wscript.exe, cscript.exe, mshta.exe,
    or rundll32.exe in Windows Event ID 4688 or Sysmon EID 1 (and the equivalent execve lineage in auditd).
    This anomalous browser->shell lineage is a deterministic, high-fidelity signal; correlate the spawned
    command line and any subsequent network activity to confirm dropper behavior.'
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=1
  - auditd:SYSCALL execve
  - 'NAI: User workstations, Terminal servers / VDI environments'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'let browsers = (chrome.exe, firefox.exe, msedge.exe, brave.exe, opera.exe)

      let shells = (cmd.exe, powershell.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe)

      from (EID 4688 OR Sysmon EID 1)

      where parent_image in browsers and child_image in shells

      -> alert severity=high "Browser spawned shell/script engine"'
  - technology: auditd/pseudocode
    query: "search SYSCALL execve where ppid->comm in browsers\n   and comm in (bash, sh, python, perl,\
      \ osascript)\n-> alert \"Browser-rooted shell on Linux/macOS\""
- question: For each host, which child process names spawned by browsers have an enterprise-wide probability
    below the anomaly threshold, indicating an unusual browser child?
  context: 'Tactic: Persistence. Some browser children are legitimate (crash handlers, updaters), so a
    probabilistic baseline distinguishes the rare/abnormal from the routine. For each host build the historical
    probability of each unique child process name spawned by browsers and alert on children whose enterprise-wide
    probability falls below a robust modified z-score threshold (|M| > 3.5). A child name almost never
    seen spawned by a browser anywhere in the fleet is a strong anomaly; common helper processes are suppressed,
    reducing noise versus a static list.'
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=1
  - auditd:SYSCALL execve
  - 'NAI: User workstations, Terminal servers / VDI environments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "child_prob[name] = count(browser_parent->name)/total over fleet 90d\nfor each event where\
      \ parent in browsers:\n  M = modified_zscore(child_prob[child_name])\nwhere abs(M) > 3.5 OR child_prob[child_name]\
      \ ~ 0\n-> alert \"Anomalous browser child process\""
- question: When each browser-rooted process event is scored over child rarity, command-line entropy,
    signing status, tree depth, and a network-after-spawn flag, which events surface as anomalies?
  context: 'Tactic: Persistence. A multi-feature model catches dropper lineage that no single attribute
    reveals. Represent each browser-rooted process event as {child image rarity, command-line entropy,
    signing status, depth in process tree, network-after-spawn flag} and score with an Isolation Forest,
    reporting the top-3 contributing features per alert. High scores typically combine a rare unsigned
    child with an obfuscated command line that then makes network connections, the signature of an extension-delivered
    installer; the explainable features let analysts triage quickly.'
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=1
  - auditd:SYSCALL execve
  - 'NAI: User workstations, Terminal servers / VDI environments'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features per browser-rooted proc event:\n  [child_rarity, cmdline_entropy, signed?, tree_depth,\
      \ network_after_spawn]\nmodel = IsolationForest(train=30d)\nwhere score in top anomalies -> alert\
      \ with top3_features"
- question: Do browser HTTP requests carry a missing/malformed user-agent or a JA4H/JA4 fingerprint inconsistent
    with the host's actual browser, especially to non-categorized or newly-registered domains?
  context: 'Tactic: Persistence. Non-browser code riding on the browser''s network identity often gets
    the HTTP semantics subtly wrong. Monitor Zeek http.log for requests whose user_agent is missing/malformed
    or inconsistent with the browser identified in host logs, and corroborate with JA4H (HTTP header order/case)
    and JA4 (TLS) fingerprints. A claimed-vs-observed mismatch to a non-categorized or newly-registered
    domain indicates extension/native code communicating, not the genuine browser. Consistent fingerprints
    to known sites are benign; mismatches to obscure destinations are leads.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Egress points to the internet, Network taps/sensors providing Zeek data, User workstations'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from http.log compute ja4h; from ssl.log compute ja4\nwhere user_agent is null OR malformed(user_agent)\n\
      \   OR ja4h != expected_for(host_browser)\n   OR (ja4 mismatch AND (uncategorized(dst) OR domain_age(dst)<14d))\n\
      -> alert \"Non-browser code on browser network identity\""
- question: Does any host's hourly outbound volume or connection frequency exceed its 30-day baseline
    (99th percentile or |M|>3.5), or show elevated DNS entropy / NXDOMAIN failure ratio suggesting DGA
    or beaconing?
  context: 'Tactic: Persistence. Extension exfiltration and C2 deviate from a host''s normal traffic shape.
    For each host build a 30-day rolling baseline of outbound bytes (Volume) and connection count (Frequency)
    per hour and alert when hourly values exceed the 99th percentile or a modified z-score |M| > 3.5.
    Additionally compute per-host domain-name entropy from dns.log to surface DGA-like activity and track
    the NXDOMAIN/4xx failure ratio (State) as a separate signal. Coincident spikes across volume, entropy,
    and failures strongly indicate automated extension traffic rather than human browsing.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Egress points to the internet, Network taps/sensors providing Zeek data, User workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per (host, hour): bytes_out, conn_ct, dns_entropy, fail_ratio\nbaseline = 30d rolling per\
      \ host\nwhere bytes_out > p99 OR conn_ct > p99 OR abs(modz(bytes_out))>3.5\n   OR dns_entropy high\
      \ OR fail_ratio elevated\n-> alert \"Host browser network baseline deviation\""
- question: When per-host hourly browser traffic is scored over bytes_out, conns/min, distinct domains,
    inter-arrival jitter, domain entropy, and failure ratio, which hours surface as anomalies distinguishing
    exfiltration from benign bursts?
  context: 'Tactic: Persistence. A single anomaly model fusing volume, timing, diversity, and failure
    features captures exfiltration physics holistically. Score per-host hourly traffic with an Isolation
    Forest over {bytes_out, conns/min, distinct domains, mean inter-arrival jitter, domain entropy, fail_ratio}
    and emit the top-3 features driving each anomaly so analysts can distinguish exfiltration from benign
    bursts (e.g., a software update). Low inter-arrival jitter combined with steady small payloads points
    to beaconing; high bytes_out with many distinct domains points to bulk exfiltration.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
