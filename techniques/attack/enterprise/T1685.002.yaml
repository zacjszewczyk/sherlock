name: 'T1685.002: Disable or Modify Tools: Disable or Modify Cloud Log'
id: 30b2f6f0-a6cf-486c-bcbd-60b2b0952fb2
description: >-
  Investigate whether an adversary has disabled, deleted, or modified cloud logging capabilities and integrations
  to limit telemetry and evade detection. This playbook helps an analyst hunt across cloud control-plane
  audit trails, SaaS administration portals, and endpoint command-line activity for the canonical log-tampering
  actions — stopping or deleting CloudTrail trails, changing event selectors or retention policies, updating
  or deleting GCP logging sinks, deleting Azure diagnostic settings, and Microsoft 365 mailbox audit bypass
  or Advanced Auditing/license downgrades. It also covers the second-order signals of tampering: sustained
  drops or complete cessation of expected log volume from a tenant, subscription, region, or account;
  logging-control API calls from identities, source IPs, ASNs, or countries outside the administrative
  baseline; rare or first-seen control-plane actions and anomalous API sequences; cloud-CLI tampering
  commands launched on endpoints by non-administrators; and high-risk follow-on activity from the same
  identity or host after a confirmed tampering event. Use it to answer whether logging was deliberately
  impaired, who did it, from where, and what they did next.
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: >-
    Did a cloud management API call that disables or redirects logging come from an identity outside the
    approved cloud-admin allowlist, or from a source IP that fails a threat-intel or approved-admin check?
  context: >-
    This is the deterministic floor for Defense Impairment of cloud logging. Alert on the canonical logging-control
    API actions (AWS cloudtrail:StopLogging/DeleteTrail/UpdateTrail/PutEventSelectors and cloudwatch:DeleteLogGroup/DeleteLogStream/PutRetentionPolicy;
    GCP logging UpdateSink/DeleteSink; Azure diagnosticSettings/delete; O365 Set-MailboxAuditBypassAssociation)
    when the userIdentity is not on the curated cloud-administration allowlist OR when the originating
    source IP from Zeek conn.log fails a threat-intel or approved-admin verification. Profile the result
    state explicitly: a successful call (errorCode=success) that tampers with logging is a high-severity
    signal that an adversary is actively blinding defenders, while AccessDenied or failed attempts are
    a separate, lower-severity probing signal that the actor is testing for the same capability. A positive
    match warrants immediate containment of the identity and review of what activity the disabled logging
    was meant to hide.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - Google Cloud Audit Logs
  - Microsoft 365 Unified Audit Log
  - Zeek conn.log
  - 'NAI: Internet gateway and cloud management access points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      log_events = cloud_audit where eventName in ['StopLogging','DeleteTrail','UpdateTrail','PutEventSelectors','DeleteLogGroup','DeleteLogStream','PutRetentionPolicy','UpdateSink','DeleteSink','diagnosticSettings/delete','Set-MailboxAuditBypassAssociation'];

      src = join Zeek conn.log on source_ip;

      alert when userIdentity not_in cloud_admin_allowlist or src.ip fails threat_intel_or_admin_check;

      tier = 'high' if errorCode=success else 'low';

      output identity, eventName, source_ip, errorCode, tier.
- question: >-
    Is a logging-control API call originating from a country or ASN that is rare for that identity, or
    is a principal generating an abnormal burst of AccessDenied failures on logging-control or IAM actions?
  context: >-
    Sophisticated actors using stolen credentials frequently call from network locations the legitimate
    owner never uses. For each identity, baseline source country/ASN and per-action call volume over a
    30-day window, then flag logging-control calls from a country or ASN below the 5th percentile of that
    identity's history. Use the modified Z-score (median absolute deviation, |Mi|>3.5) so that batch jobs
    and automation spikes do not inflate the threshold and hide a genuine outlier. Separately, track the
    AccessDenied rate per principal: a burst of failed logging-control or IAM calls above the 99th percentile
    is a distinct discovery/probing signal indicating the actor is searching for a way to disable logging
    even if they have not yet succeeded. A positive result should be correlated with the identity's recent
    successful actions to judge intent.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - Google Cloud Audit Logs
  - Microsoft 365 Unified Audit Log
  - Zeek conn.log
  - 'NAI: Internet gateway and cloud management access points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = per_identity stats(country, asn, action_volume) over 30d;

      rarity = flag logging_control_calls where country/asn < p5(identity_history);

      mz = modified_zscore(action_volume, MAD); alert when |mz|>3.5;

      denied = count AccessDenied per principal; alert when denied > p99;

      output identity, country, asn, action, mz_score, denied_rate.
- question: >-
    Does an explainable anomaly model score this logging-control API call as abusive based on enriched
    CloudTrail/Zeek features, and which top features drove the score?
  context: >-
    When deterministic allowlists and simple rarity miss subtle abuse, a rare-function/population model
    over enriched features can surface it. Score the API call using source IP reputation, geo/ASN, role,
    time of day, user-agent, and the principal's prior use of that specific action. Crucially, the alert
    must surface the top-3 contributing features (for example, 'never-before-used action by this role',
    'source IP with poor reputation', 'off-hours') rather than just a numeric score, so the analyst can
    triage quickly. Production UEBA anomaly types — anomalous AWS API volume, rare user behavior, unusual
    source IP — provide ready feature surfaces. A high score with explainable drivers tied to logging-control
    actions is strong evidence of deliberate Defense Impairment.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - Google Cloud Audit Logs
  - Microsoft 365 Unified Audit Log
  - Zeek conn.log
  - 'NAI: Internet gateway and cloud management access points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      features = enrich(cloudtrail+zeek: ip_reputation, geo, asn, role, hour, user_agent, prior_action_use);

      score = rare_function_population_model.predict(features);

      explain = top3_features(features);

      alert when score >= threshold and action in logging_control_set;

      output identity, action, score, explain.
- question: >-
    Do cloud audit logs contain any event or cmdlet from the canonical log-disabling set, including removal
    of log integrity controls such as multi-region logging, log-file validation, SNS topics, or KMS encryption?
  context: >-
    This question establishes a vendor-neutral detection floor for explicit logging changes. Alert on
    audit-log entries matching the canonical log-disabling set: DeleteTrail, StopLogging, UpdateTrail,
    PutEventSelectors, DeleteLogGroup, PutRetentionPolicy, logging UpdateSink/DeleteSink, diagnosticSettings/delete,
    and Microsoft 365 Set-MailboxAuditBypassAssociation or Get-OrganizationConfig showing AuditDisabled.
    Equally important, treat the removal of integrity controls as suspicious — disabling multi-region
    logging, turning off log-file validation, removing the associated SNS topic, or stripping KMS encryption
    all degrade the trustworthiness of the audit trail even if logging is nominally still on. A positive
    hit identifies the precise tampering action and the resource affected, anchoring the rest of the investigation.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - Google Cloud Audit Logs
  - Microsoft 365 Unified Audit Log
  - >-
    NAI: Cloud management accounts, SaaS administration portals, and logging destinations configured for
    enterprise audit export.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      alert from cloud_audit where eventName in ['DeleteTrail','StopLogging','UpdateTrail','PutEventSelectors','DeleteLogGroup','PutRetentionPolicy','UpdateSink','DeleteSink','diagnosticSettings/delete','Set-MailboxAuditBypassAssociation']

      or (eventName='UpdateTrail' and (MultiRegion->false or LogFileValidation->false or SNSTopic removed
      or KMSKey removed))

      or (Get-OrganizationConfig AuditDisabled=true);

      output identity, eventName, resource, changed_fields.
- question: >-
    Has this identity or role ever issued this log-modification action before, and does the API session's
    length and per-action rarity deviate from the account's normal session shape?
  context: >-
    Maintain a per-principal first-seen baseline of API actions over a 90-day lookback and alert when
    a log-modification action has never been issued by that identity or role — the first time an account
    ever deletes a trail or sink is inherently noteworthy. Additionally, score the API session by sequence
    length and per-action rarity, flagging low-frequency log-modification patterns relative to the account's
    normal session shape. This catches both compromised human identities and machine/automation identities
    whose behavior suddenly includes destructive logging changes. A first-seen log-modification action
    combined with an abnormal session shape strongly suggests the credential is being misused.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - Google Cloud Audit Logs
  - Microsoft 365 Unified Audit Log
  - >-
    NAI: Cloud management accounts, SaaS administration portals, and logging destinations configured for
    enterprise audit export.
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      firstseen = per_principal first_seen(action) over 90d;

      alert when action in log_modification_set and firstseen=true;

      session_score = rarity(action) * f(session_length vs baseline_session_shape);

      alert when session_score high;

      output identity, action, first_seen_flag, session_score.
- question: >-
    Does the observed control-plane API sequence place a log-modification action outside the model's predicted
    next actions, such as a StopLogging that does not fit the account's normal session pattern?
  context: >-
    Model normal control-plane API sequences with an LSTM/log-key model (DeepLog style) and alert when
    an observed action falls outside the top-g predicted next actions — for example, a log-modification
    action immediately followed by a change to export or diagnostic configuration. Complement this with
    a variable-order Markov model with Bayesian credible intervals, which flags an out-of-pattern StopLogging
    inside an otherwise common session and yields a calibrated, explainable per-transition score. This
    approach catches tampering that is camouflaged within otherwise legitimate-looking activity, where
    each individual call is permitted but the ordering is anomalous. A low-probability transition into
    a logging change is a strong indicator of staged Defense Impairment.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - Google Cloud Audit Logs
  - Microsoft 365 Unified Audit Log
  - >-
    NAI: Cloud management accounts, SaaS administration portals, and logging destinations configured for
    enterprise audit export.
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      seq = ordered_control_plane_actions by principal,session;

      pred = lstm_logkey_model.next(seq);

      alert when observed_action not_in top_g(pred) and observed_action in log_modification_set;

      vomm = variable_order_markov(seq); alert when transition_prob below credible_interval;

      output identity, session, anomalous_action, transition_prob, explain.
- question: >-
    Have expected cloud logs from a known source gone silent for more than 15 minutes without an approved
    maintenance window or a documented provider outage?
  context: >-
    Adversaries who disable logging produce a tell-tale silence in the telemetry stream. Build a per-source
    expected-arrival inventory from CloudWatch/Monitor metrics and trail/sink configuration so that 'silence'
    is measured against a known baseline of what should be arriving and when. Alert when expected cloud
    logs are missing for more than 15 minutes without an approved maintenance window or provider outage.
    This heartbeat rule catches both explicit disablement and quieter integrity tampering (for example,
    redirecting a sink elsewhere) whenever it interrupts the expected flow to the SIEM. A positive result
    should trigger immediate verification of the source's trail/sink/diagnostic configuration and a check
    for the disabling action.
  answer_sources:
  - AWS CloudWatch Metrics
  - Azure Monitor Metrics
  - GCP Cloud Monitoring
  - >-
    NAI: SIEM and cloud provider monitoring dashboards for the affected tenant, subscription, or project.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      inventory = expected_arrival(source) from cloudwatch/monitor metrics + trail/sink config;

      alert when no_logs(source) for > 15m and not in maintenance_window and not provider_outage;

      output source, account, last_seen_ts, gap_minutes.
- question: >-
    Has the hourly log volume (event count and bytes) from a source dropped more than 3 standard deviations
    below its 30-day average for that hour across multiple consecutive intervals?
  context: >-
    Establish per-source, per-hour volume baselines and flag when hourly volume — measured in both event
    count and bytes — drops more than 3 standard deviations below the 30-day average for that hour-of-day
    across multiple consecutive intervals. For sources with bursty or batch traffic, use the modified
    Z-score (MAD-based, |Mi|>3.5) so that legitimate spikes do not raise the floor and mask a genuine
    drop. Requiring multiple consecutive intervals reduces noise from transient dips. A sustained, statistically
    significant drop without a maintenance window is a hallmark of logging that has been disabled or throttled
    to hide adversary activity.
  answer_sources:
  - AWS CloudWatch Metrics
  - Azure Monitor Metrics
  - GCP Cloud Monitoring
  - >-
    NAI: SIEM and cloud provider monitoring dashboards for the affected tenant, subscription, or project.
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = per_source per_hour mean,std(event_count,bytes) over 30d;

      alert when volume < mean - 3*std for >= N consecutive intervals;

      mz = modified_zscore(volume, MAD); alert when |mz|>3.5 for bursty sources;

      output source, hour, observed_volume, expected_volume, deviation.
- question: >-
    Does the observed per-source log volume fall below the 99% lower confidence bound of a time-series
    forecast, and how large is the deviation for the affected source/account?
  context: >-
    Forecast expected per-source volume with a time-series model (ARIMA or Prophet) that captures daily
    and weekly seasonality, then alert when observed volume falls below the 99% lower confidence bound.
    Unlike a static standard-deviation threshold, a forecast adapts to normal trends and seasonality,
    reducing false positives during predictable quiet periods while still catching anomalous suppression.
    The alert should surface the magnitude of the deviation and the affected source/account so the analyst
    can prioritize. A forecast-bound violation that coincides with control-plane logging changes is strong
    corroboration that logging was deliberately impaired.
  answer_sources:
  - AWS CloudWatch Metrics
  - Azure Monitor Metrics
  - GCP Cloud Monitoring
  - >-
    NAI: SIEM and cloud provider monitoring dashboards for the affected tenant, subscription, or project.
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      model = arima_or_prophet(per_source_volume_history);

      lower = forecast.lower_bound(0.99);

      alert when observed_volume < lower;

      output source, account, observed_volume, forecast, lower_bound, deviation_magnitude.
- question: >-
    Did a process on an endpoint launch a cloud CLI command containing log-disabling tokens while the
    executing user is not a member of the approved cloud-administration group?
  context: >-
    Tampering is often performed from an operator endpoint via cloud CLIs, leaving a process-creation
    trace. Alert when process command lines (Windows Event ID 4688 or Sysmon Event ID 1) contain log-disabling
    tokens — delete-trail, stop-logging, update-trail, put-event-selectors, delete-log-group, put-retention-policy,
    logging sinks delete/update, az monitor diagnostic-settings delete, or Set-MailboxAuditBypassAssociation
    — and the user is not in the approved cloud-administration group. This catches non-administrators
    (or compromised accounts) attempting logging changes from developer endpoints, admin workstations,
    or CI/CD servers. Pair the endpoint event with the source IP from Zeek conn.log to confirm the originating
    host. A positive match from a non-admin is a high-confidence Defense Impairment signal.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Administrator workstations, developer endpoints, and CI/CD servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      proc = process_create (4688 or Sysmon EID 1) where command_line contains_any ['delete-trail','stop-logging','update-trail','put-event-selectors','delete-log-group','put-retention-policy','sinks
      delete','sinks update','diagnostic-settings delete','Set-MailboxAuditBypassAssociation'];

      alert when user not_in approved_cloud_admin_group;

      join Zeek conn.log on host_ip;

      output user, host, command_line, source_ip.
- question: >-
    Is this cloud CLI command/argument pair rare for the user's peer group or role, or is it a command
    this principal has never run before?
  context: >-
    Flag cloud CLI command/argument pairs that fall below the 5th percentile of frequency for the user's
    peer group or role, using the modified Z-score over per-(user,command) counts to resist automation
    skew. Layer a first-seen-per-principal check that raises any command this user or role has never executed.
    This statistical lens catches insiders or compromised accounts whose logging-related commands are
    individually valid but anomalous for who is running them. The combination of low peer-group frequency
    and a first-seen flag for a logging-control command is a strong indicator that the endpoint activity
    is illegitimate.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Administrator workstations, developer endpoints, and CI/CD servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      counts = per (user,command) frequency;

      peer = peer_group_or_role frequency distribution;

      mz = modified_zscore(counts); flag when command < p5(peer) or |mz|>3.5;

      firstseen = per_principal first_seen(command);

      alert when firstseen=true or rare=true;

      output user, command, frequency, peer_percentile, first_seen_flag.
- question: >-
    Does a user execute log-modification commands that are unusual for their behavioral peer group, and
    which commands most distinguish them from the group?
  context: >-
    Cluster users by command-vector behavior and alert when a user executes log-modification commands
    that are unusual for that peer group. The alert should surface the top-3 distinguishing commands or
    features so the analyst understands why the user stands out from peers performing similar roles. This
    peer-group ML approach reduces false positives for legitimate admins while highlighting accounts whose
    behavior diverges — for example, a developer suddenly running CloudTrail-disabling commands that none
    of their peers use. A clear peer-group divergence centered on logging-control commands warrants investigation
    for credential compromise or insider misuse.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Administrator workstations, developer endpoints, and CI/CD servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      vectors = command_vector per user;

      clusters = cluster(users by vectors);

      score = peer_group_anomaly(user, log_modification_commands);

      explain = top3_distinguishing_commands(user, peer_group);

      alert when score >= threshold;

      output user, peer_group, score, explain.
- question: >-
    After a confirmed cloud log-tampering alert, are other alerts from the same identity or host within
    24 hours combining into an escalated, high-priority incident?
  context: >-
    A confirmed tampering event changes the risk posture of everything that identity or host does next.
    After a confirmed cloud log-tampering alert, boost the risk score of all alerts from the same identity/host
    for 24 hours and escalate when the combined score crosses a predefined threshold. Model the identity-resource
    graph so the tampering edge raises the priority of connected follow-on actions (for example, IAM changes
    or data access from the same principal). This meta-alert scoring ensures that activity which would
    otherwise be low-priority is correctly elevated once an actor has demonstrably tried to blind defenders.
    Crossing the combined threshold should drive incident escalation and proactive containment.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - Google Cloud Audit Logs
  - Windows Event ID 4688
  - Zeek conn.log
  - >-
    NAI: SIEM alert database, cloud management accounts, and high-value asset endpoints.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      tamper = confirmed_log_tampering_alert(identity,host,ts);

      window = [ts, ts+24h];

      boost all alerts from same identity/host in window;

      graph = identity_resource_graph; raise priority of edges connected to tamper;

      alert when combined_score > threshold;

      output identity, host, contributing_alerts, combined_score.
- question: >-
    Within 60 minutes of a tampering event, do post-event volume metrics (bytes out, process executions,
    API call rate, or failure states) for the same identity/host exceed the 99th percentile of their baselines?
  context: >-
    Compare post-event volume metrics — bytes_out, process-execution counts, API call rate — for the same
    identity or host against historical baselines and alert when they exceed the 99th percentile within
    the 60-minute window after tampering. Track failure-state metrics (AccessDenied, failed logons) separately,
    because a spike in failures following tampering indicates active escalation or lateral movement attempts
    rather than benign activity. This statistical follow-on check helps confirm that the logging change
    was a precursor to further malicious action. Exceeding the 99th-percentile threshold inside the correlation
    window is strong evidence the actor proceeded with their objective once logging was impaired.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - Google Cloud Audit Logs
  - Windows Event ID 4688
  - Zeek conn.log
  - >-
    NAI: SIEM alert database, cloud management accounts, and high-value asset endpoints.
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = per identity/host p99(bytes_out, proc_exec_count, api_rate, access_denied, failed_logons);

      window = [tamper_ts, tamper_ts+60m];

      alert when any post_event_metric > p99 in window;

      output identity, host, metric, observed, p99, failure_state_metrics.
- question: >-
    After adding the log-tampering edge to the user-service-activity graph, what likely next hops (IAM
    role/key creation, data access) does the model predict for the same principal, and which graph relations
    explain the prediction?
  context: >-
    Once the log-tampering edge is added to the user-service-activity graph, score subsequent cross-service
    activity from the same principal and predict likely next hops — such as IAM role or access-key creation,
    or sensitive data access — to guide proactive hunts. Surface the contributing graph relations as explanation
    so analysts can validate the predicted path. This graph-based ML approach turns a single tampering
    event into a forward-looking hunt plan, anticipating where a sophisticated actor will go next after
    blinding defenders. Predicted high-risk next hops should be hunted immediately and pre-emptively monitored.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - Google Cloud Audit Logs
  - Windows Event ID 4688
  - Zeek conn.log
  - >-
    NAI: SIEM alert database, cloud management accounts, and high-value asset endpoints.
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      graph = user_service_activity_graph + log_tampering_edge(principal);

      score = gnn.score(subsequent_cross_service_activity, principal);

      predict = top_next_hops(principal); # IAM role/key creation, data access

      explain = contributing_graph_relations;

      output principal, predicted_next_hops, score, explain.
- question: >-
    Can a control-plane change that disabled or modified an audit trail, sink, or diagnostic setting be
    correlated with a subsequent gap in expected log ingestion for the same tenant, region, or account?
  context: >-
    This question chains the cause (a control-plane change) to the effect (a telemetry gap). Track control-plane
    events that disable or modify audit trails, sinks, or diagnostic settings, and correlate each with
    a subsequent gap in expected log ingestion for the same tenant/region/account. Treat removal of integrity
    controls — multi-region logging, log-file validation, SNS, KMS — as part of the same tampering chain.
    This correlation distinguishes deliberate adversary action from benign ingestion hiccups: when a disabling
    action is immediately followed by the predicted drop, the causal link is clear. A confirmed change-then-gap
    pairing is high-confidence evidence of Defense Impairment and should anchor the incident timeline.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - Google Cloud Audit Logs
  - Microsoft 365 Unified Audit Log
  - SIEM ingestion metrics
  - >-
    NAI: Cloud management accounts, CI/CD automation identities, and cloud logging destinations that normally
    forward activity to the enterprise SIEM.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      changes = control_plane where action in ['DeleteTrail','StopLogging','UpdateTrail','PutEventSelectors','UpdateSink','DeleteSink','diagnosticSettings/delete']
      or integrity_control_removed;

      gaps = siem_ingestion gap by tenant/region/account;

      alert when gap follows change for same tenant/region/account within window;

      output identity, action, tenant, region, gap_start, gap_duration.
- question: >-
    Has a log stream fallen below the 1st percentile of its historical volume by source, service, and
    time of day for a sustained interval without a known outage?
  context: >-
    Baseline cloud-log arrival rates by source, service, and time of day, then alert when a stream falls
    below the 1st percentile of its historical volume for a sustained interval without a known outage.
    Use robust, MAD-based thresholds and CloudWatch anomaly bands so that automation noise does not mask
    the drop. This statistical method complements the heartbeat and 3-sigma rules by focusing on extreme,
    sustained reductions that indicate near-total suppression rather than a transient dip. A sustained
    sub-1st-percentile reduction tied to a specific account or region is strong evidence that logging
    was disabled or rerouted to evade detection.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - Google Cloud Audit Logs
  - Microsoft 365 Unified Audit Log
  - SIEM ingestion metrics
  - >-
    NAI: Cloud management accounts, CI/CD automation identities, and cloud logging destinations that normally
    forward activity to the enterprise SIEM.
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = per source,service,hour historical volume distribution;

      alert when volume < p1(baseline) for sustained interval and not known_outage;

      use MAD-based robust thresholds + cloudwatch anomaly bands;

      output source, service, account, region, observed_volume, p1_threshold, duration.
- question: >-
    Does a sequence model on control-plane events combined with a forecasting model on log-ingestion rates
    reveal a disablement action followed by an abnormal telemetry drop attributable to a specific principal?
  context: >-
    Train a sequence model on control-plane events plus a forecasting model on log-ingestion rates, then
    detect patterns where a disablement action is followed by an abnormal telemetry drop or other high-risk
    activity that falls below the forecast lower bound. Contextualize the finding with the identity graph
    to attribute the drop to a specific principal, answering not just that logging stopped but who caused
    it. This combined ML approach fuses the action signal and the volume signal into a single, attributable
    detection, which is especially valuable against sophisticated actors who try to make suppression look
    like a routine configuration change. A correlated sequence-plus-forecast violation attributed to a
    principal is high-confidence evidence of intentional logging impairment.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Log
  - Google Cloud Audit Logs
  - Microsoft 365 Unified Audit Log
  - SIEM ingestion metrics
  - >-
    NAI: Cloud management accounts, CI/CD automation identities, and cloud logging destinations that normally
    forward activity to the enterprise SIEM.
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      seq = sequence_model(control_plane_events);

      fc = forecast_model(log_ingestion_rate);

      alert when seq detects disablement_action and observed_volume < fc.lower_bound;

      attribute = identity_graph.principal_for(drop);

      output principal, disablement_action, observed_volume, forecast_lower, attribution.
