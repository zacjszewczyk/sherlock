questions:
- question: '[Impact] Hash and IOC correlation: Can you determine whether a process is created whose SHA256
    hash or file name matches a known wiper malware signature, or is blocked/quarantined by endpoint protection,
    providing direct evidence of destructive tooling on the host. Track both successful executions and
    blocked/denied attempts (Volume/State). -- specifically, using the ''Hash and IOC correlation'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary erases the contents of storage
    devices -- overwriting arbitrary disk regions via raw/direct access or vulnerable drivers so data
    is irrecoverable -- to interrupt availability of systems and network resources, often as a final destructive
    objective or to mask a prior intrusion, and frequently with worm-like propagation across the network.
    This evidence focuses on the condition that a process is created whose SHA256 hash or file name matches
    a known wiper malware signature, or is blocked/quarantined by endpoint protection, providing direct
    evidence of destructive tooling on the host. Track both successful executions and blocked/denied attempts
    (Volume/State). This Symbolic Logic approach looks for the following signal: Continuously correlate
    the SHA256 hash and image name from process-creation events (Windows Event ID 4688, Sysmon Event ID
    1) against threat-intelligence IOCs for known wiper families (WhisperGate, HermeticWiper, IsaacWiper,
    CaddyWiper, Shamoon) published in [CISA AA22-057A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-057a)
    and [CrowdStrike, The Anatomy of Wiper Malware Part 3](https://www.crowdstrike.com/en-us/blog/the-anatomy-of-wiper-malware-part-3/).
    Alert on any match. Keep this deterministic hash floor; do not rely on it alone because wipers recompile
    per operation. A positive result -- a rule match, statistical outlier, or model alert -- suggests
    storage is being deliberately wiped or overwritten in a way that deviates from sanctioned administration
    and normal user behavior; pivot to the responsible process or principal, its parent lineage and signer,
    the targeted disk/device, any preceding driver load, and any worm-like lateral spread to administrative
    shares. A negative result helps rule out this wiping vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, staged, or API-bypassing wipers.'
