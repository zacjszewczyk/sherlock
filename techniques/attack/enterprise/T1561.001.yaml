name: 'T1561.001: Disk Content Wipe'
id: 3de6d320-6d43-4b64-aab5-58f869714809
description: 'This playbook helps an analyst investigate whether an adversary is wiping the contents of
  storage devices -- partially or completely overwriting disk sectors so data is irrecoverable through
  the storage interface -- to interrupt the availability of systems and network resources as part of the
  Impact tactic. Disk Content Wipe (T1561.001) is distinct from file-level Data Destruction because adversaries
  erase arbitrary regions of a drive via direct/raw disk access (\\.\PhysicalDrive, /dev/sd*, /dev/nvme*)
  or third-party/vulnerable drivers (e.g., RawDisk, BYOVD), and destructive wiper malware often carries
  worm-like features to propagate fleet-wide. The playbook guides the hunt across Windows, Linux, macOS,
  and network devices along several behavioral angles: execution of known wiper binaries matched by hash/IOC,
  name, fleet rarity, or static/dynamic ML features (WhisperGate, HermeticWiper, IsaacWiper, CaddyWiper,
  Shamoon); abuse of legitimate destructive utilities (cipher /w, format, sdelete, diskpart clean all,
  dd, shred, wipefs, blkdiscard, diskutil eraseDisk/zeroDisk, asr, and network-device erase flash:/erase
  nvram:/format) detected by command patterns, rare-argument baselining, and command-sequence models;
  non-allow-listed processes performing raw reads/writes to physical drive objects or block devices, frequently
  preceded by a vulnerable-driver load (new kernel service -> rare/expired-signer driver -> raw PhysicalDrive
  write -> forced reboot); statistically anomalous bursts of file overwrite/deletion with extreme write
  content entropy (random ~8.0 or null/pattern ~0) across protected paths; and worm-like SMB fan-out to
  administrative shares (C$, ADMIN$) across many hosts. Detection methods combine deterministic symbolic-logic
  rules, statistical baselining (percentile, standard-deviation, entropy/KL-divergence), and machine-learning
  models over Windows Security/Sysmon events, auditd, macOS unified logs, network-device CLI/syslog, and
  Zeek conn telemetry, so the analyst can corroborate suspected disk wiping against process lineage, raw-disk
  access, driver loads, write-content entropy, and lateral propagation.'
