- question: '[Collection] Detect scraping patterns: Can you determine whether database access over application
    pathways (e.g., via a web application) that results in abnormal database-related network patterns
    (e.g., sudden increases in backend DB connections or long-lived high-volume sessions), consistent
    with adversary-driven scraping or automated extraction through the app tier. -- specifically, using
    the ''Detect scraping patterns'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary mines on-premises or
    cloud-hosted databases to harvest usernames, hashed passwords, PII, and financial data for lateral
    movement, command and control, or exfiltration and extortion. This evidence focuses on the condition
    that database access over application pathways (e.g., via a web application) that results in abnormal
    database-related network patterns (e.g., sudden increases in backend DB connections or long-lived
    high-volume sessions), consistent with adversary-driven scraping or automated extraction through the
    app tier. This Machine Learning approach looks for the following signal: Build per-app-host time-series
    features (connections/min, bytes/min, connection-duration distribution, entropy of destination DB
    hosts) and apply a change-point/anomaly model to detect extraction-like regimes A Survey of Methods
    for Time Series Change Point Detection, Aminikhanghahi and Cook. Correlate with upstream HTTP behavior
    using multi-model parameter profiling (request length, character distribution, templated URIs, unusual
    user agents, high request rates) to confirm automation driving backend collection Anomaly Detection
    of Web-based Attacks, Kruegel and Vigna. A positive result -- a rule match, statistical outlier, or
    model alert -- suggests an identity or host is accessing database content in a way that deviates from
    sanctioned application or analytics behavior; pivot to the responsible account and source host, the
    targeted database assets and tables, the session/query lineage, any export files staged on disk or
    written to cloud storage, and subsequent outbound transfers. A negative result helps rule out this
    database-mining vector but should be corroborated with the other questions in this playbook, since
    a single method can miss slow, low-and-slow, or living-off-the-land collection that blends into legitimate
    database operations. Source citations: [A Survey of Methods for Time Series Change Point Detection,
    Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/); [Anomaly Detection of
    Web-based Attacks, Kruegel and Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).'
