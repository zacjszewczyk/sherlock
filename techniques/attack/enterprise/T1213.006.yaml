    sensitive tables, making the activity look like interactive collection rather than normal application
    use. -- specifically, using the ''Baseline query volume'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary mines on-premises or
    cloud-hosted databases to harvest usernames, hashed passwords, PII, and financial data for lateral
    movement, command and control, or exfiltration and extortion. This evidence focuses on the condition
    that an authenticated user or service account establishes a database session from a first-time host
    or unusual login hour and then queries sensitive tables, making the activity look like interactive
    collection rather than normal application use. This Statistical Method approach looks for the following
    signal: Build >=30-day per-user/service baselines for (a) DB host targets, (b) source hosts/subnets,
    (c) login-hour buckets, and (d) daily connection counts. Trigger when a session exceeds the 99th percentile
    of daily connections OR falls in a rare hour bucket (<1% historical mass) while targeting sensitive
    DB hosts. Use median + MAD robust thresholds (flag |modified Z|>3.5) so batch/ETL jobs do not inflate
    cutoffs Modified Z-Score for Anomaly Detection. A positive result -- a rule match, statistical outlier,
    or model alert -- suggests an identity or host is accessing database content in a way that deviates
    from sanctioned application or analytics behavior; pivot to the responsible account and source host,
    the targeted database assets and tables, the session/query lineage, any export files staged on disk
    or written to cloud storage, and subsequent outbound transfers. A negative result helps rule out this
    database-mining vector but should be corroborated with the other questions in this playbook, since
    a single method can miss slow, low-and-slow, or living-off-the-land collection that blends into legitimate
    database operations. Source citations: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
