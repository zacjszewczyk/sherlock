questions:
- question: '[Collection] Correlate DB sessions: Can you determine whether an authenticated user or service
    account establishes a database session from a first-time host or unusual login hour and then queries
    sensitive tables, making the activity look like interactive collection rather than normal application
    use. -- specifically, using the ''Correlate DB sessions'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary mines on-premises or
    cloud-hosted databases to harvest usernames, hashed passwords, PII, and financial data for lateral
    movement, command and control, or exfiltration and extortion. This evidence focuses on the condition
    that an authenticated user or service account establishes a database session from a first-time host
    or unusual login hour and then queries sensitive tables, making the activity look like interactive
    collection rather than normal application use. This Symbolic Logic approach looks for the following
    signal: Identify successful interactive/network logons to DB hosts (Event ID 4624) and explicit-credential
    use (Event ID 4648), link to process creation (Event ID 4688) and DB-port sessions in Zeek conn.log
    (e.g., 1433/3306/5432/27017/1521). Flag any session whose source host is NOT an approved app tier
    or jump host, or whose account is NOT an approved DB service identity. Treat first-time source-host
    -> DB-host edges and rare user->table pairings as high-priority novelty, scoring them by new-edge
    probability On Bayesian new edge prediction and anomaly detection in computer networks, Metelli and
    Heard. For DBaaS, additionally flag logins from non-corporate ASNs and atypical client strings, a
    field-validated signal of credential-based DB theft UNC5537 Targets Snowflake Customer Instances,
    Mandiant. A positive result -- a rule match, statistical outlier, or model alert -- suggests an identity
    or host is accessing database content in a way that deviates from sanctioned application or analytics
    behavior; pivot to the responsible account and source host, the targeted database assets and tables,
    the session/query lineage, any export files staged on disk or written to cloud storage, and subsequent
    outbound transfers. A negative result helps rule out this database-mining vector but should be corroborated
    with the other questions in this playbook, since a single method can miss slow, low-and-slow, or living-off-the-land
    collection that blends into legitimate database operations. Source citations: [On Bayesian new edge
    prediction and anomaly detection in computer networks, Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.full);
    [UNC5537 Targets Snowflake Customer Instances, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/unc5537-snowflake-data-theft-extortion).'
