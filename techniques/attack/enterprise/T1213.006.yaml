name: 'T1213.006: Data from Information Repositories: Databases'
id: c36c7478-018f-489f-88fd-d4233394e97d
description: 'This playbook helps an analyst investigate whether an adversary has mined sensitive data
  from on-premises or cloud-hosted databases (MySQL, PostgreSQL, MongoDB, MSSQL/Oracle, Amazon RDS/Aurora,
  Azure SQL, Google Firebase/BigQuery, Snowflake, and database-like SaaS repositories) as part of the
  Collection tactic. It guides the hunt across several behavioral angles: authenticated database sessions
  established from first-time hosts, unusual hours, or non-corporate ASNs that then query sensitive tables
  (looking like interactive collection rather than normal application use); bulk discovery and enumeration
  activity such as catalog/schema queries, SHOW DATABASES, and repeated SELECT * across credential/PII/payment
  tables; staging and packaging of database exports (.sql/.bak/.csv/.dmp dump files and 7z/zip/rar archives)
  on DB hosts, jump hosts, and backup shares; first-time or off-network access to cloud DBaaS endpoints
  and admin APIs where endpoint telemetry is limited; and abnormal backend traffic through the application
  tier consistent with automated scraping or extraction. Detection methods combine symbolic-logic correlation
  rules, statistical baselining (robust median+MAD thresholds, percentile bursts, change-point detection,
  auth-failure profiling), and machine-learning models (Isolation Forest/One-Class SVM, LSTM sequence
  anomaly, peer-group UEBA) applied to Windows Security/Sysmon events, auditd, database audit logs, Zeek
  conn/dns/http/ssl logs, and cloud audit trails (CloudTrail, GCP, Azure), so the analyst can corroborate
  suspected database mining against session novelty, query shape, result-set volume, staging artifacts,
  and exfiltration context.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
