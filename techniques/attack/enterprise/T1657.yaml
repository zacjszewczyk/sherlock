name: 'T1657: Financial Theft'
id: 87e9561f-cf8a-485d-b041-11055d20144a
description: 'Investigate whether an adversary is attempting to perform or facilitate financial theft
  against the organization through extortion (e.g., ransomware), business email compromise (BEC) and invoice/payment
  fraud, account-compromise-driven unauthorized transfers, cryptocurrency theft and cryptojacking, or
  bulk theft and exfiltration of sensitive financial data for extortion. This playbook helps an analyst
  correlate evidence across the kill chain: outbound connections to financial-malware, ransomware-C2,
  or mining-pool infrastructure; processes matching fraud-tool, ransomware, or cryptominer signatures
  (including recovery-inhibition and clipboard-clipper behavior); BEC emails exhibiting header/domain
  anomalies and financial-urgency language; risky logins followed by access to financial services; anomalous
  access to financial file shares, databases, and ERP systems; and anomalous outbound data flows from
  servers hosting financial data. Each question pairs deterministic symbolic-logic detections with statistical
  baselining and machine-learning approaches spanning Windows, Linux, macOS, SaaS, and Office Suite telemetry
  plus network sensors.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any internal hosts connecting to external destinations (IPs, domains, URLs, or mining-pool
    endpoints) that match curated threat intelligence for financial malware, ransomware command-and-control,
    or cryptocurrency mining?
  context: 'Financial theft frequently begins with an internal host reaching attacker-controlled infrastructure:
    ransomware C2 for keying/exfiltration, financial-malware drop/control servers, or cryptocurrency mining
    pools that monetize stolen compute. Compare Zeek conn.log/dns.log/http.log/ssl.log destinations against
    a maintained TI feed of malicious IPs/FQDNs/URLs and known mining-pool indicators (Stratum ports 3333/4444/5555/7777/14444
    and pool FQDNs), alerting on any match. A hit is high-fidelity and warrants immediate host triage;
    retain concrete string/IP/JA3 rules even after ML is layered on, because deterministic IOC matches
    remain explainable and defensible in support of the Impact tactic''s financial-theft objective.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network egress points, including internet gateways, DNS resolvers, and web proxies.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "load TI_financial_iocs (ip, domain, url, ja3, stratum_ports)\n  from conn.log, dns.log, http.log,\
      \ ssl.log\n  where dest_ip in TI.ip OR query in TI.domain OR uri in TI.url\n     OR (resp_p in [3333,4444,5555,7777,14444])\n\
      \  alert match=\"financial_malware_c2_or_mining\""
- question: Is any internal host beaconing to an external destination on a regular, low-variance interval
    consistent with ransomware or financial-malware command-and-control check-ins?
  context: Automated C2 implants check in on a periodic schedule, producing connection inter-arrival times
    with very low variability. On Zeek conn.log, score each source-destination pair for beaconing using
    the coefficient of variation (CV) of inter-arrival times, DFFT periodicity, and payload-size consistency;
    alert when CV<0.1 across >=24 connections to a single external destination. Derive per-environment
    CV/count thresholds from a 30-day baseline to limit false positives from benign polling (updates,
    telemetry). Detected beaconing to a non-business destination is a strong indicator of an active implant
    supporting extortion-based or fraud-based financial theft.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network egress points, including internet gateways, DNS resolvers, and web proxies.'
  range: Last 90 days (baseline beaconing over rolling 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from conn.log group by (src_ip, dest_ip)\n  compute interarrival = diff(ts); cv = stddev(interarrival)/mean(interarrival)\n\
      \  compute periodicity = dfft_peak(interarrival); payload_consistency = stddev(orig_bytes)\n  where\
      \ count >= 24 AND cv < 0.1\n  alert \"periodic_c2_beaconing\""
- question: Does any host show an abnormal rate of failed connections, such as NXDOMAIN responses or rejected/reset
    TCP connections, indicating C2 domain rotation or blocked exfiltration?
  context: Adversaries cycling through DGA/rotating C2 domains or attempting blocked exfiltration generate
    elevated failure signals before they find a working channel. Track per-host outbound NXDOMAIN counts
    (dns.log) and rejected/reset connection states (conn.log S0/REJ/RSTO) as distinct signals; alert when
    a host's failed-connection ratio exceeds its 30-day 99th percentile. A spike suggests the host is
    searching for live attacker infrastructure or being blocked while attempting data theft, both relevant
    to financial-theft impact. Pair with the beaconing and IOC checks to confirm intent.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network egress points, including internet gateways, DNS resolvers, and web proxies.'
  range: Last 90 days (per-host 30-day percentile baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from dns.log count nxdomain per src_ip per hour\n  from conn.log count states in (S0,REJ,RSTO)\
      \ per src_ip per hour\n  fail_ratio = failed / total\n  baseline p99 over trailing 30d per host\n\
      \  where fail_ratio > p99 alert \"c2_rotation_or_blocked_exfil\""
- question: Are rare TLS client fingerprints (JA3/JA4) appearing on low-reputation or newly-seen external
    IPs, suggesting non-standard malware tooling negotiating encrypted C2?
  context: Malware and custom tooling often produce TLS client fingerprints distinct from sanctioned browsers
    and apps. Baseline JA3/JA4 hashes from Zeek ssl.log and alert when a hash below the 1st percentile
    of observed frequency appears on a low-reputation or first-seen IP. Treat fingerprint rarity as corroboration
    rather than a verdict, since legitimate browsers randomize TLS parameters and may produce rare hashes.
    A rare JA3 to suspicious infrastructure strengthens confidence that observed encrypted traffic is
    attacker C2/exfiltration tied to financial theft.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Network egress points, including internet gateways, DNS resolvers, and web proxies.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from ssl.log compute freq(ja3) over trailing 30d\n  where freq(ja3) <= p1 AND dest_ip in (low_reputation\
      \ OR first_seen)\n  alert \"rare_ja3_on_suspicious_ip\" (corroborating, not standalone)"
- question: Can a self-supervised model over encrypted-flow metadata identify TLS sessions that resemble
    exfiltration or C2 to attacker infrastructure without decrypting the traffic?
  context: Much financial-theft C2 and exfiltration rides over TLS, defeating payload inspection. Apply
    a contrastive self-supervised model over Zeek flow metadata (orig/resp bytes, packet-size and inter-arrival
    sequences, duration, directionality) to flag encrypted sessions that deviate from learned normal traffic.
    Surface the top-3 contributing features (byte ratio, duration, destination rarity) in each alert so
    analysts can triage. This catches novel/obfuscated channels that evade IOC matching while keeping
    outputs explainable, supporting detection of exfiltration-for-extortion and covert C2.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Network egress points, including internet gateways, DNS resolvers, and web proxies.'
  range: Last 90 days (model trained on >=30 days of normal flows)
  queries:
  - technology: ML/pseudocode
    query: "features = [orig_bytes,resp_bytes,byte_ratio,pkt_size_seq,iat_seq,duration,direction,dest_rarity]\n\
      \  model = contrastive_self_supervised(flow_metadata)\n  score = model.anomaly(flow); if score >\
      \ threshold:\n    alert with top3_features"
- question: Is any endpoint or browser session exhibiting in-browser cryptojacking behavior used as a
    financial-theft vector?
  context: Drive-by/in-browser mining steals compute for the adversary's financial gain. Score endpoint
    and proxy telemetry with a model trained on robust runtime features (Web Worker parallelism, WebSocket/postMessage
    message rates, hash-loop activity, sustained high CPU) that generalizes to unseen miners and survives
    obfuscation. Corroborate ML hits with static CryptoNight WASM primitives where available. Sustained
    mining indicates resource theft and often co-occurs with broader compromise; confirm against process-level
    CPU profiling on the host.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Network egress points, including internet gateways, DNS resolvers, and web proxies.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [web_worker_parallelism, websocket_rate, postmessage_rate, hashloop_activity, sustained_cpu]\n\
      \  score = cryptojacking_model(features)\n  if score > threshold OR static_match(cryptonight_wasm):\
      \ alert \"browser_cryptojacking\""
- question: Are any processes being created whose name, file hash, path, or command line matches watchlists
    for cryptominers or financial-malware tooling (e.g., xmrig, kinsing, kdevtmpfsi)?
  context: Direct signature matching on process telemetry is the most deterministic way to catch known
    financial-theft tooling. Check Windows Event ID 4688 and Sysmon Event ID 1 for process names, hashes,
    paths, or command-line tokens listed in cryptominer/financial-malware watchlists and alert on hits.
    Retain concrete strings even as behavioral/ML detections are added, because an exact match is immediately
    actionable and explainable. A confirmed match on a finance endpoint or server is a high-priority indicator
    of active monetization or fraud tooling.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoints and servers, particularly those used by Finance/Accounting personnel or hosting financial
    applications.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from 4688, sysmon(1)\n  where image_name in TI.proc OR sha256 in TI.hash OR image_path in\
      \ TI.path\n     OR cmdline matches TI.cmd_regex (xmrig|kinsing|kdevtmpfsi|...)\n  alert \"financial_malware_process\""
- question: Are there process or command sequences that inhibit system recovery or invoke bulk-encryption
    behavior, indicating ransomware staging extortion?
  context: 'Before encrypting, ransomware reliably disables recovery and prepares mass file changes. Alert
    on deterministic ransomware precursors in 4688/Sysmon 1 and command logs: vssadmin/wmic shadowcopy
    delete, wbadmin delete catalog, bcdedit recovery disable, mass file rename/extension change, and ransom-note
    creation. These are unambiguous precursors to extortion-based financial theft and should trigger immediate
    containment. Because they are rarely legitimate in bulk, false positives are low; correlate with file-share
    canaries and exfiltration signals to scope the incident.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoints and servers, particularly those used by Finance/Accounting personnel or hosting financial
    applications.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from 4688, sysmon(1), cmd_logs\n  where cmdline matches (vssadmin delete shadows|wmic shadowcopy\
      \ delete|\n        wbadmin delete catalog|bcdedit /set .* recoveryenabled no)\n     OR mass_file_rename_or_ext_change\
      \ OR ransom_note_created\n  alert \"ransomware_recovery_inhibition\""
- question: Is any process polling the clipboard in a high-frequency loop while matching cryptocurrency
    wallet-address patterns, the signature of clipper malware?
  context: 'Clipper malware silently replaces a copied cryptocurrency wallet address with the attacker''s,
    redirecting payments. Flag processes that open the clipboard in a high-frequency poll-and-write loop
    while matching cryptocurrency wallet-address regexes (BTC/ETH/XMR formats). This behavior is distinctive:
    legitimate apps rarely poll-and-overwrite clipboard content matching wallet formats. A hit indicates
    direct theft of crypto transfers and should be treated as confirmed financial-theft activity on the
    host.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoints and servers, particularly those used by Finance/Accounting personnel or hosting financial
    applications.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from sysmon(1)/edr_clipboard_events\n  detect process with clipboard_open_rate high AND clipboard_write\n\
      \  AND clipboard_content matches wallet_regex(BTC|ETH|XMR)\n  alert \"clipboard_clipper_malware\""
- question: Are command lines on finance endpoints showing abnormally high entropy or length compared
    to that host's baseline, suggesting obfuscated or encoded malicious execution?
  context: Obfuscated, encoded, or packed command lines (e.g., long Base64 PowerShell) carry high Shannon
    entropy and length relative to ordinary shell usage. Baseline command-line entropy and length per
    host for common shells and alert when entropy exceeds the 99th percentile; report the offending token
    span so the analyst can quickly judge intent. High-entropy commands on Finance/Accounting hosts are
    a useful weak signal that, combined with TI and behavioral hits, points to fraud tooling or staging
    for financial theft.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoints and servers, particularly those used by Finance/Accounting personnel or hosting financial
    applications.'
  range: Last 90 days (per-host baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from 4688, sysmon(1) compute entropy(cmdline), len(cmdline) per shell per host\n  baseline\
      \ p99 per host\n  where entropy > p99 OR len > p99 alert with offending_token_span"
- question: Is any non-interactive process sustaining very high CPU usage or aggressively spawning/killing
    sibling processes, consistent with cryptomining turf-war behavior?
  context: Cryptominers consume CPU continuously and often kill competing miners or cron jobs to monopolize
    resources. Track sustained high CPU and child-process spawn rate per host; alert when a non-interactive
    process sustains >85% CPU for >10 minutes or kills sibling processes/cron jobs beyond baseline. This
    profiling catches miners that evade signature matching (renamed binaries) and identifies the resource
    theft directly, corroborating mining-pool network indicators from the connection evidence.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoints and servers, particularly those used by Finance/Accounting personnel or hosting financial
    applications.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per process track cpu_pct over time, child_spawn_rate, sibling_kill_count\n  where interactive=false\
      \ AND cpu_pct>85 for >10min\n     OR sibling_kill_count > baseline\n  alert \"miner_resource_turf_war\""
- question: Can an anomaly model isolate processes whose combined attributes (parent, user context, elevation,
    command-line entropy/length, signing status) deviate from normal, even without a known signature?
  context: Novel financial-theft tooling evades watchlists, so unsupervised modeling adds coverage. Train
    an Isolation Forest or autoencoder on process features (parent process, user context, elevation, command-line
    length/entropy, signing status) to flag outliers, surfacing the top-3 contributing features in the
    alert for triage. Outliers such as an unsigned, elevated process spawned by Office on a finance host
    warrant investigation. Use this to catch the unknown-unknowns while keeping deterministic rules for
    explainability.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoints and servers, particularly those used by Finance/Accounting personnel or hosting financial
    applications.'
  range: Last 90 days (model trained on >=30 days of process telemetry)
  queries:
  - technology: ML/pseudocode
    query: "features = [parent_proc,user_ctx,is_elevated,cmd_len,cmd_entropy,signed]\n  model = IsolationForest()/autoencoder\
      \ over normal processes\n  if model.anomaly(proc) high: alert with top3_features"
- question: Do inbound emails to finance staff exhibit header and domain anomalies combined with financial-urgency
    language characteristic of Business Email Compromise?
  context: BEC is a leading cause of financial loss and is detectable by deterministic tells. Inspect
    Zeek smtp.log and M365/Workspace headers for SPF/DKIM/DMARC failures, From/Reply-To and display-name
    vs. address mismatches, lookalike/cousin domains, and financial-urgency keywords (wire transfer, urgent
    payment, change bank details). Any single tell is weak, but their combination targeting a finance
    recipient is a strong BEC indicator. A positive result should trigger user warning, sender verification
    out-of-band, and review of any payment changes requested in the message.
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Email gateways, mail servers, network sensors monitoring SMTP traffic, and cloud email tenants
    (e.g., Microsoft 365, Google Workspace).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from smtp.log, m365/workspace headers\n  flag if (spf_fail OR dkim_fail OR dmarc_fail)\n \
      \    AND (from_domain != replyto_domain OR display_name_mismatch OR lookalike_domain)\n     AND\
      \ body matches urgency_kw(wire transfer|urgent payment|change bank details)\n     AND recipient\
      \ in finance_group\n  alert \"bec_email\""
- question: Are finance recipients receiving payment-related emails from sender-recipient pairs that are
    rare or first-seen, indicating an unfamiliar party requesting a financial action?
  context: Legitimate finance correspondence tends to recur among established pairs; BEC often arrives
    from a never-before-seen or rarely-seen sender. Baseline sender-recipient pair frequencies and first-contact
    status; flag emails carrying financial/payment keywords whose pair frequency falls in the bottom 5th
    percentile or whose sender domain is first-seen for a finance recipient. A first-contact sender pushing
    a wire transfer is suspicious even when headers pass authentication (e.g., attacker-registered look-alike
    domain with valid SPF). Fuse with the header/domain rule to raise confidence.
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Email gateways, mail servers, network sensors monitoring SMTP traffic, and cloud email tenants
    (e.g., Microsoft 365, Google Workspace).'
  range: Last 90 days (pair-frequency baseline over trailing history)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline freq(sender,recipient) and first_seen(sender_domain, recipient)\n  where body has\
      \ payment_kw AND (pair_freq <= p5 OR first_seen=true)\n     AND recipient in finance_group\n  alert\
      \ \"rare_payment_sender_pair\""
- question: Is any mailbox showing a burst of SMTP/IMAP authentication failures followed by an anomalous
    spike in outbound mail to finance contacts, indicating account-compromise-driven BEC?
  context: When attackers take over a mailbox, they often brute/spray it (failed logons) then send fraudulent
    payment requests internally from the trusted account. Profile SMTP/IMAP auth-failure rates and outbound
    mail volume per mailbox; a burst of failed logons followed by anomalous mass mailing to finance contacts
    indicates account-compromise-driven BEC. Internal-origin BEC bypasses many header checks because the
    account is legitimate, so this state-change signal is essential. Confirm by reviewing new inbox rules
    and the content of the outbound messages.
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Email gateways, mail servers, network sensors monitoring SMTP traffic, and cloud email tenants
    (e.g., Microsoft 365, Google Workspace).'
  range: Last 90 days (per-mailbox baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per mailbox track auth_failures and outbound_mail_volume over time\n  detect: auth_failure_burst\
      \ THEN outbound_volume_spike to finance_contacts\n  where volume > baseline_p99 alert \"compromised_mailbox_bec\""
- question: Can an NLP classifier score the social-engineering and payment-fraud intent of an email and,
    fused with header and pair signals, identify BEC that evades deterministic rules?
  context: Adversaries vary wording to evade keyword lists, but the underlying social-engineering intent
    (urgency, authority, payment redirection) is learnable. Fine-tune a transformer (BERT-like) classifier
    on labeled BEC vs. benign emails to score intent; fuse with header/pair scores and surface the top-3
    driving features (intent score, domain-similarity, pair-rarity) in the alert. A high intent score
    on a payment-related email from a rare sender is strong evidence of BEC. This catches paraphrased
    and novel lures while remaining explainable for triage.
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Email gateways, mail servers, network sensors monitoring SMTP traffic, and cloud email tenants
    (e.g., Microsoft 365, Google Workspace).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "intent = bert_bec_classifier(subject+body)\n  combined = fuse(intent, header_anomaly_score,\
      \ pair_rarity)\n  if combined > threshold: alert with top3_features(intent,domain_similarity,pair_rarity)"
- question: Did a high-risk authentication (from a TOR/anonymizer/known-malicious IP or an impossible-travel
    pair) get followed within 30 minutes by connections from that host to financial-services or crypto-exchange
    destinations?
  context: 'Account takeover monetization shows a tight sequence: a risky login then access to where the
    money is. Alert if a 4624 login from a TOR/anonymizer/known-malicious IP, or an impossible-travel
    pair, is followed within 30 minutes by a Zeek conn.log/http.log connection to a financial-services
    or crypto-exchange destination. This time-bounded correlation is high-fidelity because the two events
    together imply intent: the attacker authenticated and immediately pivoted to financial resources.
    A positive result warrants session termination and credential reset.'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Authentication servers (e.g., Active Directory), VPN concentrators, SSO platforms, and network
    egress points.'
  range: Last 90 days (30-minute correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "login = 4624 where src_ip in (tor|anonymizer|malicious) OR impossible_travel\n  net = conn.log/http.log\
      \ to dest in financial_services|crypto_exchange\n  correlate by user/host where net.ts - login.ts\
      \ <= 30min\n  alert \"risky_login_to_financial_access\""
- question: Does a multi-factor login risk score (geo rarity, time-of-day, device novelty, impossible
    travel, failed-then-success sequence) flag a session that then performs POSTs to payment/transfer
    URLs?
  context: Not all risky logins come from blocklisted IPs; a composite score catches subtler takeovers.
    Build a per-user login risk score from geo rarity, time-of-day, device novelty, and impossible travel
    with ~7-day learning baselines, explicitly weighting failed-then-success (4625->4624) sequences. Flag
    sessions in the 98th percentile when followed by Zeek http.log POSTs to payment/transfer URIs. The
    combination of an anomalous authentication and an actual money-movement request is what distinguishes
    fraud from benign rare logins. Surface the contributing risk factors for analyst triage.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Authentication servers (e.g., Active Directory), VPN concentrators, SSO platforms, and network
    egress points.'
  range: Last 90 days (per-user ~7-day learning baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "risk = score(geo_rarity,time_of_day,device_novelty,impossible_travel, weight(4625->4624))\n\
      \  per user baseline ~7d\n  where risk >= p98 AND followed_by http.log POST to (payment|transfer\
      \ URI)\n  alert \"high_risk_login_then_payment_post\""
- question: Can an LSTM autoencoder over login-to-resource session sequences flag abnormal paths that
    begin with a high-risk login and culminate in financial web/API access?
  context: Attack sessions form atypical action sequences that point models can miss. Train an LSTM autoencoder
    on normal login->resource session sequences and flag high reconstruction error when a sequence begins
    with a high-risk login and reaches financial web/API access, surfacing the top-3 contributing steps/features
    in the alert. High reconstruction error means the session does not resemble that user's normal behavioral
    arc, e.g., an off-hours rare-geo login that jumps straight to payment APIs. This captures multi-step
    takeover-to-theft behavior holistically.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Authentication servers (e.g., Active Directory), VPN concentrators, SSO platforms, and network
    egress points.'
  range: Last 90 days (model trained on normal session sequences)
  queries:
  - technology: ML/pseudocode
    query: "seq = ordered(login_event ... resource_accesses) per user session\n  model = LSTM_autoencoder(normal_sequences)\n\
      \  if reconstruction_error(seq) high AND seq starts high_risk_login AND reaches financial_api:\n\
      \    alert with top3_steps"
- question: Is a non-whitelisted user or process accessing critical financial shares/ERP tables with write/delete
    rights, or is a service account reading payroll/payment tables outside its sanctioned application
    path?
  context: Insiders and compromised accounts reveal themselves by touching financial data outside sanctioned
    paths. Trigger alerts when 4663 events or database logs show a non-whitelisted user/process accessing
    critical financial shares/ERP tables with write/delete rights, or a service account reading payroll/payment
    tables outside its sanctioned application path. Service accounts should only access their data through
    their application; direct interactive reads of payroll/payment tables are anomalous and suggest theft
    or fraud staging. Validate against an allowlist of expected principals and paths.
  answer_sources:
  - Windows Event ID 4663
  - Zeek conn.log
  - 'NAI: Financial databases (e.g., ERP systems), payment processing servers, file servers containing
    sensitive accounting or payroll data, and cloud storage buckets containing financial data.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from 4663, db_audit_logs\n  where (user/process NOT in allowlist) AND object in financial_shares|erp_tables\n\
      \        AND access in (write,delete)\n     OR (svc_account reads payroll|payment tables AND path\
      \ != sanctioned_app_path)\n  alert \"unauthorized_financial_data_access\""
- question: Have any honeyfiles or decoy records placed in financial directories and ERP schemas been
    read or modified?
  context: Canary tripwires give a near-zero-false-positive signal of intrusion. Place honeyfiles/decoy
    records in financial directories and ERP schemas, chosen to be touched early by traversal or bulk
    operations; any read/modify of a canary is a high-fidelity alert for ransomware encryption or bulk
    theft. Because no legitimate business process touches these decoys, a single hit justifies immediate
    containment of the accessing principal/host. Combine with access-baseline alerts to scope what else
    was touched.
  answer_sources:
  - Windows Event ID 4663
  - Zeek conn.log
  - 'NAI: Financial databases (e.g., ERP systems), payment processing servers, file servers containing
    sensitive accounting or payroll data, and cloud storage buckets containing financial data.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "define canary_objects in financial_dirs and erp_schemas\n  from 4663, db_audit_logs\n  where\
      \ object in canary_objects AND access in (read,write,delete)\n  alert \"canary_tripwire_financial\"\
      \ severity=high"
- question: Are there spikes in unique-user access counts, off-hours access, or abnormally large/structurally-different
    query result sets against critical financial servers and databases versus role baselines?
  context: Bulk theft and reconnaissance show up as statistical deviations in access patterns. For critical
    servers/DBs, model unique-user counts per hour and per-role result-set size/row counts; alert on >3
    standard-deviation spikes, accesses during historically idle windows, or queries returning abnormally
    large or structurally-different result sets versus role baseline. A finance analyst suddenly pulling
    whole-table dumps, or access at 3 a.m. when the system is normally idle, indicates staged exfiltration
    for extortion. Tie volume anomalies to the user/role to prioritize.
  answer_sources:
  - Windows Event ID 4663
  - Zeek conn.log
  - 'NAI: Financial databases (e.g., ERP systems), payment processing servers, file servers containing
    sensitive accounting or payroll data, and cloud storage buckets containing financial data.'
  range: Last 90 days (per-role baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per server/db model unique_users_per_hour, result_set_size per role\n  baseline mean,std\n\
      \  where unique_users > mean+3std OR access in idle_window\n     OR result_rows > role_baseline*k\
      \ OR result_schema != typical\n  alert \"anomalous_financial_db_access\""
- question: Can clustering of users by access pattern reveal peer-group deviations, such as marketing
    users touching payroll tables?
  context: Users in the same role normally cluster together by what they access; outliers betray misuse.
    Cluster users by access patterns (k-means/DBSCAN) and flag deviations such as marketing users touching
    payroll tables, reporting the deviating features (object, time, volume) in the alert. A user who accesses
    objects unlike their peer cluster is a candidate insider threat or compromised account staging financial
    theft. This complements static allowlists by learning peer norms and catching role-inconsistent access
    that no explicit rule anticipated.
  answer_sources:
  - Windows Event ID 4663
  - Zeek conn.log
  - 'NAI: Financial databases (e.g., ERP systems), payment processing servers, file servers containing
    sensitive accounting or payroll data, and cloud storage buckets containing financial data.'
