- question: Are unexpected file types (archives, database dumps, screenshots) being transferred outbound
    from production financial/database servers to external IPs, or are macOS credential/cookie stores
    being accessed?
  context: Exfiltration-for-extortion moves bulk data off sensitive servers, often as archives or DB dumps.
    Alert when Zeek files.log records outbound files with unexpected MIME types/extensions (archives,
    db dumps, image/* of screenshots) from production database/financial servers to external IPs; also
    flag macOS cookie-store/credential file access used for exchange-account takeover. Production financial
    servers rarely push archives to the internet, so this is a strong exfiltration signal. macOS cookie/credential
    theft enables crypto-exchange account takeover, a direct financial-theft path.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Critical data repositories, database servers, file servers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from files.log where source_host in financial_servers AND dest_ip external\n        AND mime_type\
      \ in (application/zip,application/x-tar,application/sql,image/*)\n  OR macos file access to (cookie_store|keychain|credential\
      \ files)\n  alert \"sensitive_data_exfil\""
- question: Is the outbound byte volume from any financial/database server spiking beyond its hourly baseline
    or showing a sustained upward shift indicative of staged exfiltration?
  context: Large or sustained data egress from a sensitive server is a hallmark of theft. Use per-server
    hourly outbound orig_bytes baselines and flag windows exceeding the 75th percentile plus 1.5xIQR,
    or detect sustained shifts via CUSUM/PELT change-point on the byte-volume series. A short spike may
    be a bulk copy; a sustained shift may be slow, low-and-slow exfiltration. Either deviation from the
    server's own normal egress warrants investigation, especially when paired with unusual MIME types
    or external low-reputation destinations.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Critical data repositories, database servers, file servers, and network egress points.'
  range: Last 90 days (per-server hourly baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per server hourly sum(orig_bytes)\n  baseline q75, iqr; threshold = q75 + 1.5*iqr\n  flag\
      \ windows > threshold\n  OR cusum/pelt change_point(byte_series) -> sustained_shift\n  alert \"\
      egress_volume_anomaly\""
- question: Do outbound HTTP requests from sensitive servers show oversized parameters or anomalous character
    distributions (Base64/binary) to financial/crypto endpoints, with elevated blocked-POST failure rates?
  context: Staged exfiltration over HTTP shows up as abnormal request structure. Profile per-parameter
    HTTP POST/GET attribute length (Chebyshev) and character distribution (chi-square) on http.log; alert
    on oversized parameters or Base64/binary distributions to financial/crypto endpoints indicative of
    staged exfiltration, and track 4xx/blocked-POST failure rates as a distinct signal. Oversized, high-entropy
    parameters carry stolen data; a rise in blocked POSTs suggests the attacker is probing for an open
    channel. Compare against the server's normal HTTP behavior to reduce noise.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Critical data repositories, database servers, file servers, and network egress points.'
  range: Last 90 days (per-parameter baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from http.log per uri/param model length (chebyshev), char_dist (chi-square)\n  where param_len\
      \ >> baseline OR char_dist ~ base64/binary\n        AND dest in financial|crypto endpoints\n  also\
      \ track 4xx/blocked POST rate per server\n  alert \"http_exfil_structure_anomaly\""
- question: Does payload byte-frequency analysis (PAYL/Mahalanobis) flag anomalous outbound content on
    exfiltration channels relative to normal traffic on that port/length?
  context: Content-level anomaly detection catches exfiltration even without known IOCs, using only first-party
    data. Build per-port/per-length byte-frequency profiles of normal egress and score outbound payloads
    with Mahalanobis distance to flag anomalous content/volume on exfiltration channels. A payload whose
    byte distribution diverges sharply from the learned norm for its port/length suggests encoded or compressed
    stolen data riding an unusual channel. This is a strong complement to volume- and structure-based
    methods, and requires no external threat intelligence.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Critical data repositories, database servers, file servers, and network egress points.'
  range: Last 90 days (per-port/per-length baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "build byte_freq profile per (port,length) from normal egress\n  for outbound payload: d =\
      \ mahalanobis(byte_freq, profile)\n  where d > threshold: alert \"payl_content_anomaly\""
- question: Can a one-class or self-supervised model over outbound flow features from sensitive servers
    identify exfiltration that other methods miss?
  context: A learned model of normal egress from sensitive servers captures multivariate normality better
    than single-metric rules. Train a one-class SVM on outbound flows (ASN, port, bytes, protocol, duration)
    from sensitive servers, or apply a self-supervised encrypted-traffic model for TLS flows, and surface
    the top-3 contributing features (bytes-out, destination rarity, duration) in the alert. Flows that
    fall outside the learned boundary, e.g., a large, long TLS session to a rare ASN, are flagged as candidate
    exfiltration. Explainable top features let analysts quickly confirm or dismiss, supporting detection
    of data theft for extortion.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Critical data repositories, database servers, file servers, and network egress points.'
  range: Last 90 days (model trained on >=30 days of normal egress)
  queries:
  - technology: ML/pseudocode
    query: "features = [dest_asn,resp_p,orig_bytes,proto,duration,dest_rarity]\n  model = one_class_svm(normal_egress)\
      \ OR ssl_self_supervised(tls_flows)\n  if model.outlier(flow): alert with top3_features(bytes_out,dest_rarity,duration)"
