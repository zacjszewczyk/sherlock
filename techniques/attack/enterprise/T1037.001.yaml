    is redirected to a new script file, and the referenced payload or its child process matches a known
    privilege-escalation tool, exploit chain, or offensive framework. This question applies the ''Privilege
    script IOC match'' detection method. Alert when a logon-script pointer change (UserInitMprLogonScript
    write via Sysmon 13 / 4657, or SYSVOL script modification via 4663/Sysmon 11) points to a script hash,
    signer, or child process associated with known privilege-escalation tooling and the change is not
    tied to approved maintenance; match interpreter/command signatures via [LOLBAS](https://lolbas-project.github.io/)
    and offensive-tool rules in [SigmaHQ](https://github.com/SigmaHQ/sigma). The UserInitMprLogonScript
    value itself is near-zero-legitimate ([Hexacorn Run Key Part 55](https://www.hexacorn.com/blog/2017/01/13/beyond-good-ol-run-key-part-55/)).
    A positive result indicates likely adversary use of a Windows logon script to escalate privileges
    or execute code in a higher-privilege logon context; a negative result helps rule out logon-script
    abuse for this host/user and refocus on other persistence or privilege-escalation primitives. Investigate
    within the named area of interest: Domain controller SYSVOL shares, user endpoint registry hives (HKCU\Environment),
    and file systems on endpoints and servers.'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - 'NAI: Domain controller SYSVOL shares, user endpoint registry hives (HKCU\Environment), and file systems
    on endpoints and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'ptr = search (Sysmon EventID=13 OR 4657 on UserInitMprLogonScript) OR (4663/Sysmon EventID=11
      on SYSVOL script)

      resolve new_script_hash, signer, child_process

      where hash/signer/child IN privesc_tool_signatures (LOLBAS, SigmaHQ offensive rules) AND NOT approved_maintenance

      => alert ''Logon script redirected to privilege-escalation tooling'''
