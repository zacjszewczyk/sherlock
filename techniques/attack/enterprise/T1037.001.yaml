name: 'T1037.001: Logon Script (Windows)'
id: e24e2169-c519-4d16-bc96-6a9adb3eeb97
description: This playbook helps an analyst investigate adversary abuse of Windows logon scripts (T1037.001)
  for both persistence and privilege escalation. Adversaries register or redirect a logon script so that
  code runs automatically when a user authenticates, most commonly by writing the near-zero-legitimate
  HKCU\Environment\UserInitMprLogonScript registry value, or by creating/modifying script files in SYSVOL,
  NETLOGON, or approved user script paths. The playbook guides the analyst through correlating logon-script
  creation/modification with subsequent execution in a user logon context; detecting registry pointer
  changes and cross-user or out-of-band administrative edits; identifying logon-script interpreters (cscript,
  wscript, powershell, cmd) that spawn children making rare or malicious outbound connections; finding
  weak ACLs on script paths that allow low-privilege tampering before higher-privilege execution; and
  spotting logon-script children that create services, scheduled tasks, or access LSASS. Each question
  pairs symbolic-logic allowlist checks, statistical prevalence/rarity scoring, and machine-learning behavioral
  models so detection is granular, defensible, and immediately actionable for a SOC analyst.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: '[Persistence] Script inventory correlation: Using a symbolic-logic approach, can you determine
    whether a script file in a logon-script location such as SYSVOL, NETLOGON, or an approved user script
    path is created or modified and then referenced at logon, with the file hash, signer, or command line
    matching an unapproved or known-malicious script.'
  context: 'Tactic: Persistence (TA0003). Evidence under investigation: A script file in a logon-script
    location such as SYSVOL, NETLOGON, or an approved user script path is created or modified and then
    referenced at logon, with the file hash, signer, or command line matching an unapproved or known-malicious
    script. This question applies the ''Script inventory correlation'' detection method. Alert when a
    newly created or modified logon script in SYSVOL, NETLOGON, or a user script path (Sysmon 11 / 4663
    write) is later executed at logon (4688/Sysmon 1 within 120s of 4624 LogonType 2/10) and the file
    hash, signer, or command line is absent from the approved inventory or matches TI; build the allowlist
    from signed admin scripts and use LOLBAS interpreter/command signatures ([LOLBAS](https://lolbas-project.github.io/))
    and SigmaHQ script-execution rules ([SigmaHQ](https://github.com/SigmaHQ/sigma)) to flag reg.exe/cscript/wscript/powershell
    launchers. Collect via [SwiftOnSecurity Sysmon config](https://github.com/SwiftOnSecurity/sysmon-config).
    A positive result indicates likely adversary use of a Windows logon script to maintain persistence
    across logons, restarts, and credential changes; a negative result helps rule out logon-script abuse
    for this host/user and refocus on other persistence or privilege-escalation primitives. Investigate
    within the named area of interest: User profile script paths, SYSVOL and NETLOGON shares on domain
    controllers, and file servers hosting shared logon scripts.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 5145
  - Sysmon Event ID 11
  - 'NAI: User profile script paths, SYSVOL and NETLOGON shares on domain controllers, and file servers
    hosting shared logon scripts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'logon = search EventID=4624 where LogonType IN (2,10)

      write = search (Sysmon EventID=11 OR Security EventID=4663) where TargetFilename IN (SYSVOL_PATHS,
      NETLOGON_PATHS, USER_SCRIPT_PATHS)

      exec  = search (Security EventID=4688 OR Sysmon EventID=1) where Image IN (cscript,wscript,powershell,cmd,reg)

      join write, exec, logon on Host where exec.time - logon.time <= 120s AND exec.time >= write.time

      where exec.Hash NOT IN approved_script_inventory OR exec.Signer NOT IN approved_signers OR exec.Hash
      IN threat_intel

      => alert ''Unapproved logon script created then executed'''
- question: '[Persistence] Script prevalence scoring: Using a statistical approach, can you determine
    whether a script file in a logon-script location such as SYSVOL, NETLOGON, or an approved user script
    path is created or modified and then referenced at logon, with the file hash, signer, or command line
    matching an unapproved or known-malicious script.'
  context: 'Tactic: Persistence (TA0003). Evidence under investigation: A script file in a logon-script
    location such as SYSVOL, NETLOGON, or an approved user script path is created or modified and then
    referenced at logon, with the file hash, signer, or command line matching an unapproved or known-malicious
    script. This question applies the ''Script prevalence scoring'' detection method. Baseline script
    paths, extensions, hashes, and first-seen times across hosts and users, then flag first-seen or low-prevalence
    (<0.1% of hosts) script+path combinations that execute within 120s after logon, following fleet-wide
    frequency analysis ([Microsoft O365 Frequency Analysis](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365);
    [F-Secure prevalence](https://blog.f-secure.com/whats-the-deal-with-prevalence/)). Add a Volume/State
    check: score script file size and Shannon entropy (flag content entropy >7.0 as likely encoded/packed
    per [Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989)) and count failed executions (non-zero
    exit, 4688 with error) as a distinct signal. Derive the prevalence and entropy cutoffs per environment
    from 30-day baselines. A positive result indicates likely adversary use of a Windows logon script
    to maintain persistence across logons, restarts, and credential changes; a negative result helps rule
    out logon-script abuse for this host/user and refocus on other persistence or privilege-escalation
    primitives. Investigate within the named area of interest: User profile script paths, SYSVOL and NETLOGON
    shares on domain controllers, and file servers hosting shared logon scripts.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 5145
  - Sysmon Event ID 11
  - 'NAI: User profile script paths, SYSVOL and NETLOGON shares on domain controllers, and file servers
    hosting shared logon scripts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = stats dc(Host) as host_count, min(_time) as first_seen by ScriptPath, Extension,
      Hash over last 30d

      prevalence = host_count / total_hosts

      entropy = shannon_entropy(file_content); size = file_size

      events = join script_exec with EventID=4624 where exec.time - logon.time <= 120s

      flag where prevalence < 0.001 OR first_seen within last 24h OR entropy > 7.0

      add_signal failed_exec = count(EventID=4688 where ExitCode != 0)

      => rank by rarity*entropy*failed_exec'
- question: '[Persistence] Script behavior classifier: Using a machine-learning approach, can you determine
    whether a script file in a logon-script location such as SYSVOL, NETLOGON, or an approved user script
    path is created or modified and then referenced at logon, with the file hash, signer, or command line
    matching an unapproved or known-malicious script.'
