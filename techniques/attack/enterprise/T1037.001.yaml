    and parent-lineage features for logon-script registry edits and alert on high anomaly scores; complement
    with sequence models that learn normal logon-session event-key order and flag deviations (LSTM next-event
    in [DeepLog](https://acmccs.github.io/papers/p1285-duA.pdf); Transformer baseline [LogBERT](https://arxiv.org/abs/2103.04475)).
    Surface the top-3 contributing features (e.g., unusual modifying process, off-hours edit, first-seen
    value) in the alert. A positive result indicates likely adversary use of a Windows logon script to
    maintain persistence across logons, restarts, and credential changes; a negative result helps rule
    out logon-script abuse for this host/user and refocus on other persistence or privilege-escalation
    primitives. Investigate within the named area of interest: User endpoint registry hives, especially
    HKCU\Environment for local and roaming profiles.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: User endpoint registry hives, especially HKCU\Environment for local and roaming profiles.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [User, Image, hour_of_day, parent_lineage, first_seen_value]

      iso = IsolationForest.fit(historic_logon_script_registry_edits)

      seq = DeepLog/LogBERT.next_event(logon_session_key_sequence)

      if iso.score > thr OR seq.is_anomaly: alert top_3_features(unusual_process, off_hours, first_seen_value)'
- question: '[Persistence] Interpreter egress correlation: Using a symbolic-logic approach, can you determine
    whether a logon-script interpreter such as cscript.exe, wscript.exe, powershell.exe, or cmd.exe spawns
    a child process that opens outbound connections to a rare or known-malicious destination shortly after
    user logon.'
  context: 'Tactic: Persistence (TA0003). Evidence under investigation: A logon-script interpreter such
    as cscript.exe, wscript.exe, powershell.exe, or cmd.exe spawns a child process that opens outbound
    connections to a rare or known-malicious destination shortly after user logon. This question applies
    the ''Interpreter egress correlation'' detection method. Correlate logon-script child processes (Sysmon
    1 with parent cscript/wscript/powershell/cmd within 120s of 4624) with Sysmon 3 / Zeek conn.log outbound
    connections and alert on known-bad, newly registered, or non-allowlisted destinations reached within
    a short window after logon; encode the install->spawn->network chain once as a query graph and match
    it against host provenance ([POIROT](https://dl.acm.org/doi/10.1145/3319535.3363217)). A positive
    result indicates likely adversary use of a Windows logon script to maintain persistence across logons,
    restarts, and credential changes; a negative result helps rule out logon-script abuse for this host/user
    and refocus on other persistence or privilege-escalation primitives. Investigate within the named
    area of interest: User endpoints and servers, network egress points, and DNS servers.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User endpoints and servers, network egress points, and DNS servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'child = search Sysmon EventID=1 where ParentImage IN (cscript,wscript,powershell,cmd)

      logon = search EventID=4624 where child.time - logon.time <= 120s same Host

      net = search (Sysmon EventID=3 OR Zeek conn.log) where SourcePID = child.PID

      where net.DestIP IN threat_intel OR net.Domain IN newly_registered OR net.Dest NOT IN allowlist

      => match install->spawn->network chain as query graph (POIROT); alert'
  - technology: Zeek/pseudocode
    query: 'conn := conn.log JOIN dns.log by query

      filter orig_h IN logon_script_hosts AND ts within 120s of logon

      alert where resp_h IN ti_bad OR query IN newly_registered_domains'
- question: '[Persistence] Destination rarity scoring: Using a statistical approach, can you determine
    whether a logon-script interpreter such as cscript.exe, wscript.exe, powershell.exe, or cmd.exe spawns
    a child process that opens outbound connections to a rare or known-malicious destination shortly after
    user logon.'
  context: 'Tactic: Persistence (TA0003). Evidence under investigation: A logon-script interpreter such
    as cscript.exe, wscript.exe, powershell.exe, or cmd.exe spawns a child process that opens outbound
    connections to a rare or known-malicious destination shortly after user logon. This question applies
    the ''Destination rarity scoring'' detection method. Baseline destination IPs, domains, ports, and
    connection timing per user or host, then flag rare destinations or session-level egress patterns below
    the 5th percentile of normal script activity; profile Volume (orig_bytes per session), Frequency (connections/min),
    and Failure state (NXDOMAIN in dns.log, blocked/RST conns) as distinct signals, since beaconing failure
    and DNS-resolution failure are high-signal ([F-Secure prevalence](https://blog.f-secure.com/whats-the-deal-with-prevalence/);
    [Microsoft O365 Frequency Analysis](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)).
    A positive result indicates likely adversary use of a Windows logon script to maintain persistence
    across logons, restarts, and credential changes; a negative result helps rule out logon-script abuse
    for this host/user and refocus on other persistence or privilege-escalation primitives. Investigate
    within the named area of interest: User endpoints and servers, network egress points, and DNS servers.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User endpoints and servers, network egress points, and DNS servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = stats by DestIP, Domain, Port, hour per User,Host over 90d

      rarity = percentile_rank(dest_session)

      volume = orig_bytes; freq = conns_per_min; fail = count(NXDOMAIN in dns.log) + count(RST/blocked)

      flag where rarity < 5th_percentile OR fail high

      => rank rare destinations and failed beacons'
