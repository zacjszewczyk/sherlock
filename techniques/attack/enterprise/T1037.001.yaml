    location such as SYSVOL, NETLOGON, or an approved user script path is created or modified and then
    referenced at logon, with the file hash, signer, or command line matching an unapproved or known-malicious
    script. This question applies the ''Script behavior classifier'' detection method. Train a model on
    content features, signer metadata, size, entropy, and parent-child process lineage to score scripts
    that resemble persistence payloads or post-logon launchers; for PowerShell-bearing scripts use character/token/AST
    features from [Revoke-Obfuscation](https://github.com/danielbohannon/Revoke-Obfuscation), and rank
    anomalous logon-script causal paths with rarest-path IDF + Local Outlier Factor ([ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf)).
    Train/validate on Atomic-generated labeled telemetry ([Atomic Red Team T1037.001](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1037.001/T1037.001.md))
    and surface the top-3 contributing features (e.g., rare hash, high entropy, anomalous parent) in the
    alert text. A positive result indicates likely adversary use of a Windows logon script to maintain
    persistence across logons, restarts, and credential changes; a negative result helps rule out logon-script
    abuse for this host/user and refocus on other persistence or privilege-escalation primitives. Investigate
    within the named area of interest: User profile script paths, SYSVOL and NETLOGON shares on domain
    controllers, and file servers hosting shared logon scripts.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 5145
  - Sysmon Event ID 11
  - 'NAI: User profile script paths, SYSVOL and NETLOGON shares on domain controllers, and file servers
    hosting shared logon scripts.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [content_ngram, AST_tokens(powershell), signer_meta, file_size, entropy, parent_child_lineage]

      model = train(labeled_atomic_T1037_001 + benign_corpus)  # Revoke-Obfuscation features for PS

      score = model.predict(logon_script_event)

      provdetector = rank_causal_paths(rarest_path_IDF + LocalOutlierFactor)

      if score > threshold: alert with top_3_features(rare_hash, high_entropy, anomalous_parent)'
- question: '[Persistence] Registry whitelist check: Using a symbolic-logic approach, can you determine
    whether the HKCU\Environment\UserInitMprLogonScript registry value is changed so a different script
    runs at user logon, and the modifying process or account is not part of the standard administrative
    toolchain or approved change process.'
  context: 'Tactic: Persistence (TA0003). Evidence under investigation: The HKCU\Environment\UserInitMprLogonScript
    registry value is changed so a different script runs at user logon, and the modifying process or account
    is not part of the standard administrative toolchain or approved change process. This question applies
    the ''Registry whitelist check'' detection method. Alert on ANY write to HKCU\Environment\UserInitMprLogonScript
    (Sysmon 13 / 4657) — this value has near-zero legitimate use ([Hexacorn Run Key Part 55](https://www.hexacorn.com/blog/2017/01/13/beyond-good-ol-run-key-part-55/))
    and is the exact primitive set by reg.exe in [Atomic Red Team T1037.001](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1037.001/T1037.001.md);
    escalate when the modifying user, process image, or signer is not in the approved administrative allowlist,
    then correlate the write with the next interactive logon (4624 LogonType 2/10). Use [SigmaHQ](https://github.com/SigmaHQ/sigma)
    registry-persistence rules as portable logic. A positive result indicates likely adversary use of
    a Windows logon script to maintain persistence across logons, restarts, and credential changes; a
    negative result helps rule out logon-script abuse for this host/user and refocus on other persistence
    or privilege-escalation primitives. Investigate within the named area of interest: User endpoint registry
    hives, especially HKCU\Environment for local and roaming profiles.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: User endpoint registry hives, especially HKCU\Environment for local and roaming profiles.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'write = search (Sysmon EventID=13 OR Security EventID=4657) where TargetObject ENDSWITH ''Environment\UserInitMprLogonScript''

      # value has near-zero legitimate use

      escalate where write.User NOT IN admin_allowlist OR write.Image NOT IN approved_tools OR write.Signer
      NOT IN approved_signers

      correlate with next EventID=4624 LogonType IN (2,10) same User

      => alert ''UserInitMprLogonScript persistence write'''
- question: '[Persistence] Change-rate scoring: Using a statistical approach, can you determine whether
    the HKCU\Environment\UserInitMprLogonScript registry value is changed so a different script runs at
    user logon, and the modifying process or account is not part of the standard administrative toolchain
    or approved change process.'
  context: 'Tactic: Persistence (TA0003). Evidence under investigation: The HKCU\Environment\UserInitMprLogonScript
    registry value is changed so a different script runs at user logon, and the modifying process or account
    is not part of the standard administrative toolchain or approved change process. This question applies
    the ''Change-rate scoring'' detection method. Compare registry-write frequency per host and user over
    a 30-day baseline and flag UserInitMprLogonScript or HKCU\Environment edits whose rate exceeds expectation
    using a MAD-based modified Z-score >3.5 ([Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)),
    which resists skew from automation. Track Frequency (writes/hour) and State (was the value previously
    empty/created-new vs. modified) as separate features, since first-creation of this value is far rarer
    and higher-signal than modification. A positive result indicates likely adversary use of a Windows
    logon script to maintain persistence across logons, restarts, and credential changes; a negative result
    helps rule out logon-script abuse for this host/user and refocus on other persistence or privilege-escalation
    primitives. Investigate within the named area of interest: User endpoint registry hives, especially
    HKCU\Environment for local and roaming profiles.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: User endpoint registry hives, especially HKCU\Environment for local and roaming profiles.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = registry_writes per Host,User over 30d

      rate = writes_to(UserInitMprLogonScript OR HKCU\Environment) per hour

      modZ = 0.6745*(rate - median)/MAD

      state = (prior_value == empty) ? ''created-new'' : ''modified''

      flag where modZ > 3.5 ; weight created-new higher than modified

      => alert ranked by modZ and state'
- question: '[Persistence] Registry anomaly model: Using a machine-learning approach, can you determine
    whether the HKCU\Environment\UserInitMprLogonScript registry value is changed so a different script
    runs at user logon, and the modifying process or account is not part of the standard administrative
    toolchain or approved change process.'
  context: 'Tactic: Persistence (TA0003). Evidence under investigation: The HKCU\Environment\UserInitMprLogonScript
