questions:
- question: '[Execution] Alert on ExecStart IOC and anomalies: Can you determine whether a systemd service
    unit file (.service) is created or modified, and its content, specifically the `ExecStart` directive,
    contains a command string that is obfuscated, references a known malicious indicator (IP, domain,
    hash), or is otherwise anomalous. -- specifically, using the ''Alert on ExecStart IOC and anomalies''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary abuses the systemctl utility
    to run commands/programs or to install and control systemd services for persistent execution on Linux
    hosts, blending in with legitimate administrative activity. This evidence focuses on the condition
    that a systemd service unit file (.service) is created or modified, and its content, specifically
    the `ExecStart` directive, contains a command string that is obfuscated, references a known malicious
    indicator (IP, domain, hash), or is otherwise anomalous. This Symbolic Logic approach works as follows:
    Parse auditd PATH (nametype=CREATE) and Sysmon-for-Linux Event ID 11 records for newly created/modified
    `.service` files under systemd directories (`/etc/systemd/system/`, `/run/systemd/system/`, `/usr/lib/systemd/system/`,
    `~/.config/systemd/user/`), as scoped by Systemd Service Creation, SigmaHQ and Systemd Service Created,
    Elastic. Extract the `ExecStart=`/`ExecStartPre=` line, fire high severity when it matches threat-intel
    hashes/IPs/domains or contains high-signal tokens (`/tmp`, `/dev/shm`, `bash -i`, `nc`, `curl|wget
    ... | sh`, `base64 -d`, `python -c`) per the Elastic Linux persistence primer. Suppress writes by
    package managers (dpkg/rpm/apt/yum) and config-management agents to control false positives. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable systemctl abuse
    for execution, persistence, or defense evasion; pivot to the responsible unit file and its ExecStart
    command, the writing/parent process and full lineage, the user and host context, the targeted service,
    and any subsequent network activity or telemetry loss. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy or living-off-the-land activity.'
