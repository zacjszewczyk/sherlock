name: 'T1569.003: Systemctl'
id: 145789d1-e8d3-4b04-9993-8df333bec3cf
description: 'This playbook helps an analyst investigate whether an adversary is abusing systemctl --
  the primary interface for systemd, the Linux init system and service manager -- to execute commands
  or programs and to establish persistence as systemd services, under the Execution tactic. Because systemctl
  is a legitimate administrative tool, the hunt focuses on distinguishing malicious tradecraft from routine
  operations across Linux endpoint and network telemetry (auditd EXECVE/SYSCALL/PATH/CONFIG_CHANGE, Sysmon
  for Linux process- and file-creation events, and Zeek conn.log). It guides the analyst across several
  behavioral angles: newly created or modified .service unit files whose ExecStart directives contain
  IOCs, obfuscation, or high-entropy/encoded payloads; .service files dropped in world-writable directories
  (/tmp, /var/tmp, /dev/shm) and quickly loaded with systemctl start/enable/daemon-reload; systemctl spawned
  by anomalous parents such as web servers, databases, or interpreters rather than interactive shells
  or config-management tooling; systemctl stop/disable/mask targeting security and logging services (auditd,
  rsyslog, osqueryd, EDR sensors) as defense evasion, corroborated by SIEM heartbeat loss and suspicious
  Zeek connections; and bursts of systemctl enumeration subcommands (status, list-units, list-unit-files,
  is-enabled) indicating automated reconnaissance. Detection methods combine symbolic-logic rules, statistical
  baselining/entropy/rarity scoring and time-series forecasting, and machine-learning models (Random Forest/XGBoost
  classification, Isolation Forest, DBSCAN, and provenance-graph anomaly detection) so the analyst can
  corroborate suspected systemctl abuse against unit-file content, file and process lineage, telemetry
  health, and network behavior.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
