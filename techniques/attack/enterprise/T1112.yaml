    or PowerShell registry cmdlets with command-line arguments that include ''add'' or ''import'' targeting
    a known persistence key path, or the command line contains patterns indicative of obfuscation, such
    as embedded null characters (`^@`) for key hiding. Detection method (Machine Learning): Train an LSTM
    autoencoder on event chains (process creation -> reg.exe execution -> registry value set -> subsequent
    process behavior) extracted from Sysmon Event IDs 1, 13, 14. Alert when sequences containing downloads
    or LOLBin invocations followed by persistence-key writes show reconstruction error above the 99th
    percentile. [DeepLog, ACM CCS 2017](https://acmccs.github.io/papers/p1285-duA.pdf) [ATLAS, USENIX
    Security 2021](https://www.usenix.org/conference/usenixsecurity21/presentation/alsaheel). Why it matters
    for Persistence: registry modification is a low-friction primitive adversaries reuse to either weaken
    defensive telemetry or anchor a foothold, so confirming this evidence directly answers whether the
    technique is in play. A positive result (a match, a statistical outlier above the stated threshold,
    or a high-confidence model score) should be triaged by capturing the writing process, its parent and
    command line, the exact key path and old/new value, the user context, and any subsequent process,
    service-control, or network activity; a negative result lowers confidence in this specific vector
    but does not exclude the others in this playbook. Pivot across the listed answer sources and the named
