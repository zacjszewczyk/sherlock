  context: 'Mission requirement: "Is the adversary maintaining persistence by modifying the Registry?".
    Evidence under investigation: A single process on a host modifies or deletes three or more distinct
    registry keys associated with persistence implantation within a short time window (e.g., less than
    60 seconds), often as part of automated implantation scripts dropping multiple persistence mechanisms
    simultaneously for redundancy. Detection method (Symbolic Logic): Alert when a single process (matched
