name: 'T1112: Modify Registry'
id: c7975665-2650-4006-beea-7ef83c65fd27
description: Investigate adversary abuse of the Windows Registry (MITRE ATT&CK T1112, Modify Registry)
  for defense impairment and persistence. This playbook helps an analyst determine whether an adversary
  is degrading or disabling security controls (Windows Defender, AMSI, ETW providers, EDR tamper protection,
  SafeBoot, PowerShell ScriptBlock logging) and/or establishing and hiding persistence (Run/RunOnce/RunOnceEx
  keys, Winlogon Userinit/Shell/Notify, Image File Execution Options debuggers, COM/CLSID hijacks, AppInit_DLLs/AppCertDlls,
  service installs) by creating, modifying, deleting, or concealing registry keys and values. It covers
  local CLI/PowerShell/WMI/API modification, exploit- and document-handler-driven writes from non-allowlisted
  processes, remote registry tampering over MS-RRP (winreg) RPC during lateral movement, storage of obfuscated/encoded/encrypted
  payloads in large or high-entropy registry values (Poweliks/Kovter fileless patterns), null-character
  key hiding, and rapid multi-key tamper or persistence bursts. The questions span deterministic watchlist
  and allowlist logic, statistical rarity/entropy/rate baselines, and machine-learning sequence, graph,
  and classifier methods to give a SOC analyst granular, defensible detection coverage across endpoint
  (Windows Event IDs, Sysmon) and network (Zeek) telemetry.
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
- tactic_id: TA0003
  tactic_name: Persistence
