questions:
- question: During the defense impairment phase of registry abuse, can you confirm or rule out "Defense-impairment
    registry key TI match"? Specifically, using a symbolic logic approach, determine whether alert when
    Sysmon Event ID 13 (registry value set) or Windows Event ID 4657 targets defense-impairment / persistence-hiding
    locations (HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\, HKLM\SOFTWARE\Microsoft\Windows Defender\,
    HKLM\SYSTEM\CurrentControlSet\Services\WinDefend\, HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image
    File Execution Options\ debugger entries, HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot\, AMSI keys
    at HKLM\Software\Microsoft\AMSIEnable, ETW providers under HKLM\System\CurrentControlSet\Control\WMI\Autologger\)
    AND the new value matches a TI feed of known defense-impairment patterns.
  context: 'Mission requirement: "Is the adversary impairing defenses or hiding artifacts by modifying
    the Windows Registry?". Evidence under investigation: A new or modified registry value within a known
    persistence location (e.g., HKLM\Software\Microsoft\Windows\CurrentVersion\Run, HKCU\Software\Microsoft\Windows\CurrentVersion\RunOnce)
    contains a value string that exactly matches a known-bad file path, command, or CLSID from an active
    threat intelligence feed, often created by a script or installer-like process to survive reboot. Detection
    method (Symbolic Logic): Alert when Sysmon Event ID 13 (registry value set) or Windows Event ID 4657
    targets defense-impairment / persistence-hiding locations (HKLM\SOFTWARE\Policies\Microsoft\Windows
    Defender\, HKLM\SOFTWARE\Microsoft\Windows Defender\, HKLM\SYSTEM\CurrentControlSet\Services\WinDefend\,
    HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\ debugger entries,
    HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot\, AMSI keys at HKLM\Software\Microsoft\AMSIEnable,
    ETW providers under HKLM\System\CurrentControlSet\Control\WMI\Autologger\) AND the new value matches
    a TI feed of known defense-impairment patterns. Use SigmaHQ rule registry_set_disable_defender_av.yml
    as a baseline. Capture the writing process, command line, parent, the exact registry path and old/new
    value. [SigmaHQ/sigma](https://github.com/SigmaHQ/sigma) [LOLBAS Project](https://lolbas-project.github.io/).
    Why it matters for Defense Impairment: registry modification is a low-friction primitive adversaries
    reuse to either weaken defensive telemetry or anchor a foothold, so confirming this evidence directly
    answers whether the technique is in play. A positive result (a match, a statistical outlier above
    the stated threshold, or a high-confidence model score) should be triaged by capturing the writing
    process, its parent and command line, the exact key path and old/new value, the user context, and
    any subsequent process, service-control, or network activity; a negative result lowers confidence
    in this specific vector but does not exclude the others in this playbook. Pivot across the listed
    answer sources and the named area of interest to corroborate findings.'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Windows endpoints, Windows servers, Domain Controllers, Application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Defense-impairment registry key TI match\nsource IN [Windows Event ID 4657, Windows Event\
      \ ID 4688, Windows Event ID 4104]\n| where registry_path matches defense_or_persistence_watchlist\n\
      \    OR command_line matches suspicious_pattern\n| eval method=\"Defense-impairment registry key\
      \ TI match\"\n| table _time, host, user, process_image, parent_image, command_line, registry_path,\
      \ value_name, old_value, new_value\n| alert"
