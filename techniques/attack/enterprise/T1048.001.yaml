questions:
- question: Are any internal hosts making outbound connections to destination IPs, domains, or ASNs that
    appear on a curated threat-intelligence feed of known-malicious infrastructure?
  context: Because the exfiltration payload is wrapped in a custom symmetric cipher, deep packet inspection
    cannot read it, so the reputation of the destination becomes a high-value first-party signal for the
    Exfiltration tactic. Join the responder IP from Zeek conn.log (id.resp_h) and the resolved answers
    from Zeek dns.log against IP/domain/ASN entries on your CTI feeds and alert on any match. A positive
    match means an internal asset is communicating with infrastructure already associated with adversary
    activity and warrants immediate scoping of what data may have left; a negative result lowers but does
    not eliminate suspicion because novel infrastructure will not yet appear on any feed.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway/Egress Firewalls, Internal DNS Servers, Network Security Monitoring (NSM) Sensors'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      conn = load zeek_conn.log
      dns = load zeek_dns.log
      ti  = load cti_feed (ip, domain, asn)
      matches = conn JOIN ti ON conn.id.resp_h == ti.ip OR asn(conn.id.resp_h) == ti.asn
      matches += dns JOIN ti ON dns.answers CONTAINS ti.domain OR dns.answers CONTAINS ti.ip
      ALERT each match with src=id.orig_h, dst=id.resp_h, feed_source
- question: Is any outbound TLS session being opened by a client whose JA3 fingerprint is not on the approved
    enterprise allow-list of browsers, OS updaters, and known agents?
  context: Adversaries who manually implement symmetric encryption frequently use custom or non-browser
    TLS stacks, which produce TLS Client Hello structures distinct from sanctioned software. Compute the
    JA3 hash from Zeek ssl.log for each outbound TLS handshake and compare it to an allow-list of fingerprints
    from approved browsers, updaters, and agents. An off-list JA3 opening an outbound session suggests
    a bespoke tool establishing an encrypted egress channel — directly relevant to Exfiltration over a
    symmetric encrypted non-C2 protocol. Tune the allow-list carefully because legitimate but rare clients
    can also fall outside it.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway/Egress Firewalls, Internal DNS Servers, Network Security Monitoring (NSM) Sensors'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      ssl = load zeek_ssl.log
      allow = load ja3_allowlist
      FOR each handshake in ssl WHERE direction == outbound:
        ja3 = compute_ja3(client_hello)
        IF ja3 NOT IN allow:
          ALERT src=id.orig_h, dst=id.resp_h, ja3, server_name
- question: Which external destinations are contacted by very few internal hosts while also receiving
    far more bytes than they return, indicating a rare, one-sided egress channel?
  context: Exfiltration channels tend to be rare (seen by only a handful of hosts) and heavily skewed
    toward outbound data. Count distinct internal hosts that contacted each external destination over
    30 days and flag those seen by fewer than five hosts where the orig_bytes/resp_bytes ratio exceeds
    ten. Cumulative outbound byte volume combined with a skewed sent/received ratio per source-destination
    pair is a core exfiltration signal. Tune both the seen-count and ratio thresholds per environment;
    a positive result points to a candidate covert data-egress destination, while busy CDNs or popular
    services should be excluded.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway/Egress Firewalls, Internal DNS Servers, Network Security Monitoring (NSM) Sensors'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      conn = load zeek_conn.log over last 30d
      GROUP BY id.resp_h:
        host_count = distinct_count(id.orig_h)
        ratio = sum(orig_bytes) / max(sum(resp_bytes), 1)
      WHERE host_count < 5 AND ratio > 10:
        ALERT dst=id.resp_h, host_count, ratio, total_orig_bytes
- question: Is any host showing a spike in failed or blocked outbound connection attempts to a new external
    destination shortly before a successful high-volume flow to that same destination?
  context: Adversaries probing a new exfiltration channel often generate a burst of failed attempts —
    firewall denials, conn.log history with no SYN-ACK, or aborted TLS handshakes — before the channel
    succeeds. Profile each host's failed/blocked outbound rate and look for a spike toward a new external
    destination that immediately precedes a successful high-volume transfer. This failure-then-success
    pattern is a distinct failure-mode signal of channel establishment under the Exfiltration tactic.
    A positive result is a strong lead; benign causes include misconfigured clients or transient network
    issues, so correlate with the subsequent successful flow.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway/Egress Firewalls, Internal DNS Servers, Network Security Monitoring (NSM) Sensors'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      fw   = load firewall_denies
      conn = load zeek_conn.log
      FOR each (host, dst):
        fail_rate = count(fw.deny OR conn.history has no SYN-ACK OR tls_abort) per hour
        baseline  = rolling_mean(fail_rate, 30d)
        IF fail_rate > baseline + 4*stddev AND dst is new(host)
           AND exists later conn WHERE orig_bytes large:
          ALERT host, dst, fail_rate, followon_bytes
- question: When internal-to-external connection patterns are modeled as a graph, which rare high-volume
    edges toward threat-intel-linked subnets or ASNs score as anomalous?
  context: Modeling the network as a graph of internal-to-external edges lets you score connections by
    how unusual they are relative to normal egress structure. Apply graph anomaly detection and prioritize
    rare, high-volume edges directed at TI-linked subnets or ASNs, emitting the top-three contributing
    features (destination rarity, orig_bytes, JA3 mismatch) so an analyst can triage quickly. This catches
    exfiltration that no single threshold would flag. A high anomaly score with explanatory features is
    an actionable lead; the explainability output helps separate true covert channels from rare-but-benign
    connectivity.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway/Egress Firewalls, Internal DNS Servers, Network Security Monitoring (NSM) Sensors'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      edges = build_graph(zeek_conn.log, nodes=hosts/ASNs, edge_weight=orig_bytes)
      scores = graph_anomaly_detect(edges)
      FOR edge WHERE score > threshold AND dst_asn IN ti_linked:
        feats = top3_features(edge)  # dest_rarity, orig_bytes, ja3_mismatch
        ALERT src, dst, score, feats
- question: Are there DNS TXT or NULL responses whose payload Shannon entropy exceeds 7.5 while the query
    length exceeds 200 bytes, suggesting encrypted or compressed data is being smuggled in DNS?
  context: Encrypted or compressed data approaches Shannon entropy of 7.5-8.0 per byte, versus roughly
    4.3-6.5 for plaintext. Computing the entropy of DNS TXT/NULL payloads in Zeek dns.log and alerting
    when entropy exceeds 7.5 and the query length exceeds 200 bytes flags DNS being used as a high-capacity
    encrypted carrier for Exfiltration. A positive result indicates likely tunneled ciphertext and should
    be scoped against the originating host and destination domain; legitimate high-entropy uses (DKIM,
    some security records) exist, so corroborate with volume and destination novelty.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Firewalls, Internal DNS Servers, Network Taps with Full Packet Capture'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      dns = load zeek_dns.log
      FOR each record WHERE qtype IN (TXT, NULL):
        e = shannon_entropy(payload)
        IF e > 7.5 AND length(query) > 200:
          ALERT src=id.orig_h, query, qtype, entropy=e
- question: Within nominally cleartext carriers such as HTTP bodies or FTP-DATA, is the payload entropy
    exceeding the empirical per-protocol baseline, indicating manually encrypted content inside an unencrypted
    protocol?
  context: Manually applied AES or RC4 inside a protocol that is normally plaintext (HTTP bodies in Zeek
    http.log/files.log, FTP-DATA) raises the payload entropy well above the service's normal baseline,
    with encrypted clusters above 7.0. Establish an empirical per-protocol entropy baseline and alert
    when a payload exceeds it. This directly targets the technique's hallmark of wrapping data in symmetric
    encryption inside a non-encrypted protocol for Exfiltration. A positive result strongly suggests covert
    ciphertext; per-protocol baselining (rather than a flat global threshold) limits false positives on
    services that legitimately carry compressed content.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Firewalls, Internal DNS Servers, Network Taps with Full Packet Capture'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      baseline = per_protocol_entropy_baseline(http, ftp-data)
      files = load zeek_files.log; http = load zeek_http.log
      FOR each payload in (http.body, files, ftp_data):
        e = shannon_entropy(payload)
        IF e > baseline[proto] (encrypted cluster > 7.0):
          ALERT src, proto, entropy=e, uri/path
- question: For each host and protocol, which connections have both payload entropy and outbound byte
    volume above the 99th percentile of their own baseline?
  context: Combining two anomaly axes — high entropy and high outbound volume — sharpens detection of
    encrypted bulk egress. For each host/protocol pair, baseline the distribution of payload entropy and
    orig_bytes and flag connections that exceed the 99th percentile on both. Per-protocol baselining avoids
    flat global thresholds and the false positives they cause on natively encrypted services, supporting
    the Exfiltration tactic by isolating connections that are simultaneously high-entropy and high-volume.
    A positive result is a high-confidence exfiltration candidate; review the host role to confirm the
    volume is genuinely anomalous for that asset.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Firewalls, Internal DNS Servers, Network Taps with Full Packet Capture'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each (host, proto):
        e99 = percentile(entropy, 99)
        b99 = percentile(orig_bytes, 99)
      FOR each conn:
        IF entropy > e99[host,proto] AND orig_bytes > b99[host,proto]:
          ALERT host, proto, entropy, orig_bytes
- question: When a model scores connections over Zeek flow features, which connections score above 0.9
    as non-standard encrypted channels, and what features drive those scores?
  context: Pre-trained or self-supervised encrypted-traffic models (e.g., ET-BERT, ET-SSL) can identify
    non-standard encrypted channels without decryption by learning from flow features such as protocol,
    responder port, payload entropy, orig/resp bytes, duration, and directionality. Score each connection,
    flag those above 0.9, and report the top-three driving features for triage. This is well suited to
    the technique because it detects manually encrypted channels that signature-based DPI cannot read,
    supporting Exfiltration detection. A high score with sensible driving features is an actionable lead;
    validate against destination reputation and volume.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Firewalls, Internal DNS Servers, Network Taps with Full Packet Capture'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      feats = extract(zeek_conn.log: proto, resp_p, payload_entropy, orig_bytes, resp_bytes, duration, direction)
      score = encrypted_traffic_model.predict(feats)
      FOR conn WHERE score > 0.9:
        ALERT src, dst, score, top3_features(conn)
- question: Is any user-zone asset transferring more than ~500MB of outbound data to an external IP within
    a single session?
  context: A defensible static floor on outbound volume catches blatant bulk exfiltration. Alert when
    Zeek conn.log orig_bytes exceeds 500MB from user-zone assets to external IPs in one session, tuning
    the threshold per zone. Information-theoretic ceilings on covert encoded-byte volume per destination
    provide a defensible floor for this kind of rule under the Exfiltration tactic. A positive result
    is an obvious candidate for investigation; legitimate large transfers (backups, software uploads)
    exist, so confirm the destination and process.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Firewalls, Critical Asset Subnets (e.g., Database Servers, File Servers),
    User Workstation Subnets'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      conn = load zeek_conn.log
      FOR each session WHERE src IN user_zone AND dst is external:
        IF orig_bytes > 500MB:
          ALERT src, dst, orig_bytes, duration
- question: For each source-destination pair, do the 24-hour outbound byte totals or the sent/received
    ratio exceed the host's 30-day rolling mean plus four standard deviations?
  context: Static thresholds miss assets whose normal traffic is low; a per-pair rolling baseline adapts
    to each host's behavior. Baseline orig_bytes and the orig/resp ratio per source-destination pair over
    30 days and alert when 24-hour aggregates exceed mean+4-sigma, deriving the mean and sigma per host
    role because servers and workstations differ greatly. This catches host-relative spikes in outbound
    data characteristic of Exfiltration. A positive result indicates a deviation from the host's own norm;
    correlate with destination novelty and entropy to reduce noise from legitimate but bursty workloads.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Firewalls, Critical Asset Subnets (e.g., Database Servers, File Servers),
    User Workstation Subnets'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each (src, dst):
        mu, sigma = rolling_stats(orig_bytes_24h, window=30d, by host_role)
        ratio = orig_bytes / max(resp_bytes,1)
        IF orig_bytes_24h > mu + 4*sigma OR ratio anomalous:
          ALERT src, dst, orig_bytes_24h, mu, sigma
- question: Which external destinations rank highest by encoded information content (unique bytes carried)
    rather than by raw connection count?
  context: Counting connections misses low-and-slow exfiltration; ranking by information content captures
    both bursty and slow channels. Stream-rank external destinations by the encoded information they receive
    (unique bytes carried) rather than raw connection count to surface information heavy-hitters with
    low memory overhead. This is tuned to the Exfiltration tactic because it focuses on the actual data
    moved, not session frequency. A destination that ranks high by carried information but low by connection
    count is a strong low-and-slow exfiltration candidate worth investigating; popular bulk services should
    be allow-listed.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Firewalls, Critical Asset Subnets (e.g., Database Servers, File Servers),
    User Workstation Subnets'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      stream conn = zeek_conn.log
      FOR each id.resp_h:
        info = estimate_unique_bytes(orig_bytes stream)  # heavy-hitter sketch
      rank destinations by info DESC
      ALERT top-N info heavy-hitters not in allowlist
- question: After modeling each host's hourly outbound bytes with seasonal decomposition, which hours
    show residuals above the mean plus four standard deviations of the residual distribution?
  context: Outbound traffic has strong diurnal and weekly seasonality; naive thresholds either miss off-hours
    exfiltration or alert on normal daytime peaks. Apply SARIMA decomposition to hourly outbound bytes
    per host and flag residuals above mean+4-sigma of the residual distribution to catch egress that violates
    the host's seasonal pattern. This supports the Exfiltration tactic by isolating bytes moved outside
    the expected diurnal rhythm. A large positive residual — especially during off-hours — is a meaningful
    anomaly; confirm with destination and process context before escalating.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Firewalls, Critical Asset Subnets (e.g., Database Servers, File Servers),
    User Workstation Subnets'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each host:
        series = hourly_sum(orig_bytes)
        model  = SARIMA(series)  # captures diurnal/weekly seasonality
        resid  = series - model.fitted
        IF resid > mean(resid) + 4*std(resid):
          ALERT host, hour, observed, expected, residual
- question: Which outbound flows does an Isolation Forest trained on flow features score as out-of-distribution,
    and what features explain each anomaly?
  context: Unsupervised anomaly detection can surface novel exfiltration that no rule anticipates. Train
    an Isolation Forest on flow features (orig_bytes, resp_bytes, ratio, duration, responder port, destination
    rarity, entropy) to score egress connections, surfacing the top-three contributing features for explainability.
    This supports Exfiltration detection by flagging connections that are unusual across multiple dimensions
    simultaneously. A high anomaly score with coherent driving features is an actionable lead; the SHAP-style
    explanation helps an analyst quickly judge whether the flow is genuinely covert or a rare-but-benign
    transfer.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Firewalls, Critical Asset Subnets (e.g., Database Servers, File Servers),
    User Workstation Subnets'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      feats = extract(zeek_conn.log: orig_bytes, resp_bytes, ratio, duration, resp_p, dest_rarity, entropy)
      model = IsolationForest.fit(feats)
      score = model.anomaly_score(feats)
      FOR conn WHERE score high:
        ALERT src, dst, score, top3_features(conn)
- question: Are watchlisted processes (certutil.exe, bitsadmin.exe, powershell.exe, openssl, gpg, python)
    or processes running from suspicious paths spawning outbound network connections within 60 seconds
    of execution?
  context: Encryption plus alternate-channel exfiltration typically originates from non-browser tooling
    rather than normal applications. Correlate process creation (Windows Event ID 4688, Sysmon Event ID
    1, auditd execve) with outbound network connection events (Windows 5156, Sysmon 3) by Process GUID,
    and alert when watchlisted binaries or suspicious paths (e.g., C:\Windows\Temp\*) initiate an outbound
    connection within 60 seconds. This ties process behavior directly to the Exfiltration tactic. A positive
    correlation — for example powershell.exe or openssl opening an external connection right after launch
    — is a strong lead; baseline legitimate admin/automation use to limit noise.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint Devices (Workstations and Servers), Domain Controllers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      proc = load (WinEventID 4688, Sysmon 1, auditd execve)
      net  = load (WinEventID 5156, Sysmon 3, zeek_conn.log)
      watch = {certutil.exe, bitsadmin.exe, powershell.exe, openssl, gpg, python, C:\\Windows\\Temp\\*}
      JOIN proc, net ON process_guid WHERE net.time - proc.time <= 60s
        AND proc.image IN watch:
          ALERT host, image, cmdline, dst, bytes
- question: Which infrequently seen process paths initiate network connections that carry outbound byte
    volumes in the top 5% for that host role?
  context: Rare processes that also move large amounts of data are suspicious. Identify process paths
    in the bottom 5% of frequency that initiate network connections with orig_bytes in the top 5% of volume
    for that host role, joining process-creation telemetry to network events. This supports the Exfiltration
    tactic by surfacing uncommon tools doing high-volume egress. A positive result flags an unusual process
    moving anomalously large data and merits investigation of the binary and destination; account for
    legitimate but infrequent admin tools by host role.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint Devices (Workstations and Servers), Domain Controllers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      freq = process_path_frequency(by host_role)
      FOR each conn-initiating process:
        IF freq(path) in bottom 5% AND orig_bytes in top 5% (host_role):
          ALERT host, path, orig_bytes, dst
- question: Which combinations of process path rarity, command-line entropy, parent path, destination
    port/ASN, and byte volume does an Isolation Forest flag as anomalous, with explanatory features?
  context: Clustering anomalies across joined process and network features catches unusual combinations
    that no single feature reveals. Train an Isolation Forest on path rarity, command-line entropy, parent
    path, destination port/ASN, and outbound bytes, and emit the top-three contributing features in the
    alert text for triage. This supports Exfiltration detection by linking suspicious process execution
    to its network egress. A high anomaly score with coherent driving features (e.g., rare path + high-entropy
    command line + unusual ASN + large bytes) is an actionable lead; the explanation helps separate covert
    tooling from rare-but-legitimate automation.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint Devices (Workstations and Servers), Domain Controllers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      feats = join(proc, net): path_rarity, cmdline_entropy, parent_path, dst_port, dst_asn, orig_bytes
      model = IsolationForest.fit(feats)
      FOR row WHERE anomaly_score high:
        ALERT host, image, cmdline, dst, top3_features(row)
- question: Are there DNS TXT or NULL queries with more than 10 subdomains and length over 100 characters,
    consistent with high-information DNS tunneling carriers?
  context: DNS tunneling encodes outbound data across long, subdomain-heavy queries. Alert when DNS TXT
    or NULL queries contain more than ten subdomains and exceed 100 characters in length; by bounding
    the expected covert-byte capacity per domain, treat lookback-novel high-information domains as exfiltration
    carriers. This supports the Exfiltration tactic by detecting protocol misuse where DNS structure is
    abused for bulk data transfer. A positive result against a domain not seen in the historical lookback
    is a strong tunneling indicator; exclude known high-volume but benign DNS services.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Firewalls, Internal DNS Servers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      dns = load zeek_dns.log
      FOR each query WHERE qtype IN (TXT, NULL):
        IF subdomain_count(query) > 10 AND length(query) > 100:
          IF domain not in historical_lookback:
            ALERT src=id.orig_h, query, domain
- question: Which source IPs have a 1-hour HTTP POST/GET (client-to-server byte) ratio above the 98th
    percentile of their own 30-day baseline, indicating one-way bulk upload?
  context: A high client-to-server data ratio without corresponding server responses indicates one-way
    bulk transfer rather than normal browsing. Flag source IPs whose 1-hour POST/GET orig/resp byte ratio
    exceeds the 98th percentile of their 30-day baseline. This supports the Exfiltration tactic by detecting
    HTTP being used to push data out rather than retrieve it. A positive result is a candidate upload
    channel; validate against the destination and content type, since some legitimate apps (telemetry,
    sync clients) also post heavily and should be baselined.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Firewalls, Internal DNS Servers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      http = load zeek_http.log
      FOR each src per 1h:
        ratio = sum(post_orig_bytes) / max(sum(get_resp_bytes),1)
        p98 = percentile(baseline_ratio_30d, 98)
        IF ratio > p98:
          ALERT src, ratio, p98, dst_hosts
- question: Do any source-destination pairs exhibit a periodic connection or transfer cadence (regular
    check-in intervals) once benign periodic services are filtered out?
  context: Automated exfiltration and beaconing often transfer on a regular cadence. Apply FFT or autocorrelation
    to per-pair connection timestamps to detect periodic check-in/transfer intervals, then apply ranking
    filters to suppress benign periodic services such as software updaters and telemetry. This supports
    the Exfiltration tactic by revealing scheduled covert transfers. A strong periodic signal toward an
    external destination not explained by a known service is a meaningful lead; tune the filtering to
    avoid drowning in legitimate periodic traffic.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Firewalls, Internal DNS Servers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each (src, dst):
        ts = connection_timestamps
        spectrum = FFT(ts) OR autocorrelation(ts)
        IF dominant_period detected AND dst NOT IN benign_periodic_services:
          ALERT src, dst, period, strength
- question: Is there an elevated NXDOMAIN or HTTP 4xx/5xx error rate per host/domain followed by a successful
    high-volume flow, indicating an emerging exfiltration channel?
  context: New exfiltration channels often produce failed lookups or posts before they succeed. Profile
    NXDOMAIN and HTTP 4xx/5xx rates per host/domain and look for an error-then-success pattern, where
    failed resolutions or posts precede a successful high-volume flow. This failure-mode signal supports
    the Exfiltration tactic by catching channels during their unreliable setup phase. A positive result
