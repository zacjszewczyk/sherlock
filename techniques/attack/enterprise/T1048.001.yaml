name: 'T1048.001: Exfiltration Over Symmetric Encrypted Non-C2 Protocol'
id: 7e24dc99-549d-4fdf-9d8f-eb7da331a928
description: 'Investigate potential data exfiltration conducted over a network protocol that the adversary
  has manually wrapped in a symmetric encryption scheme (e.g., RC4 or AES) separate from the existing
  command-and-control channel, often to an alternate external destination. Because the payload is encrypted
  with a custom or non-standard scheme, deep packet inspection cannot read the content, so this playbook
  pivots an analyst toward first-party signals: outbound connections to threat-intelligence flagged infrastructure,
  anomalous TLS client fingerprints (JA3), high Shannon entropy in nominally cleartext carriers (HTTP
  bodies, DNS TXT/NULL records, FTP-DATA), anomalous outbound data volume and skewed sent/received byte
  ratios, non-browser or watchlisted processes initiating high-volume egress, and protocol-structure violations
  such as one-way bulk transfer or periodic transfer cadence. It combines symbolic-logic rules, statistical
  baselining (percentiles, rolling mean+sigma, SARIMA residuals, heavy-hitter ranking, beaconing periodicity),
  and machine-learning scoring (Isolation Forest, encrypted-traffic classifiers, sequence autoencoders)
  so an analyst can detect non-standard encrypted channels without decrypting the traffic, across Windows,
  Linux, macOS, and ESXi telemetry.'
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
