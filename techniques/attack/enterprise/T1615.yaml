  - Zeek ldap.log
  - Windows Event ID 4661
  - 'NAI: Network traffic to and from Domain Controllers, and Directory Service Access audit logs on Domain
    Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/pseudocode
    query: "FOR each src_host over 30d rolling:\n  cnt = hourly count(groupPolicyContainer queries)\n\
      \  med,mad = robust_baseline(cnt); mz = 0.6745*(cnt-med)/mad\n  IF cnt > mean+3*sigma OR abs(mz)>3.5\
      \ THEN ALERT\n  cusum = CUSUM(cnt); IF cusum.step_change THEN ALERT(src_host,dc,cnt)"
- question: '[Discovery] LDAP rarity and clustering model: Can you determine whether an unusual volume
    or pattern of LDAP queries from a single source host targeting objects of class ''groupPolicyContainer''.
    -- specifically, using the ''LDAP rarity and clustering model'' (Machine Learning) approach?'
