    and its parent lineage, the user and host involved, the targeted Domain Controller or SYSVOL path,
    and any follow-on LDAP, SMB, or GPO-modification activity to scope the actor''s intent. A negative
    result helps rule out this particular discovery vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, living-off-the-land, low-and-slow, or admin-blended
    enumeration.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All domain-joined endpoints and member servers, especially those used by system administrators
    where PowerShell logging is enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/pseudocode
    query: "ALERT WHERE (EventCode=4688 image='gpresult.exe' AND cmdline MATCHES regex('/z|/v|/s'))\n\
      \  OR (EventCode=4104 scriptblock CONTAINS ANY('Get-DomainGPO','Get-DomainGPOLocalGroup','Get-NetGPO','Get-GPO\
      \ -All','GPOAudit','GPORemoteAccessPolicy'))\nSET severity=high IF cmdline MATCHES 'gpresult.*/s\
      \ '  // remote RSoP\nfields=[host,user,cmdline,parent_image]"
- question: '[Discovery] Command entropy and frequency scoring: Can you determine whether execution of
    native utilities (e.g., gpresult.exe) or PowerShell with command-line arguments and script block content
    characteristic of GPO enumeration (e.g., `gpresult /z`, `Get-DomainGPO`, `Get-NetGPO`). -- specifically,
