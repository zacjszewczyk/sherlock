    how to act. This evidence focuses on the condition that execution of a process where the file hash
    (e.g., SHA256) matches a known signature for a Group Policy discovery tool, such as PowerView or a
    BloodHound ingestor. This Machine Learning approach works as follows: Deploy a supervised classifier
    (e.g., Random Forest) on process-execution features (image name, parent, command-line tokens, user
    context, file hash, integrity level) to label each GPO-related execution benign/suspicious against
    an administrative baseline; for script-based tooling use a character-level CNN/LSTM over command/script
    content to catch obfuscated cradles ([Hendler et al.](https://arxiv.org/abs/1804.04177)). The alert
    MUST surface the top-3 contributing features (e.g., ''parent=winword.exe'', ''arg=/z'', ''rare-user'')
    rather than only a score. A positive result -- a rule match, statistical outlier, or model alert --
    indicates probable Group Policy reconnaissance; pivot to the responsible process and its parent lineage,
    the user and host involved, the targeted Domain Controller or SYSVOL path, and any follow-on LDAP,
    SMB, or GPO-modification activity to scope the actor''s intent. A negative result helps rule out this
    particular discovery vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, living-off-the-land, low-and-slow, or admin-blended enumeration.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: Domain-joined endpoints and member servers where command execution and process creation are
    logged.'
  range: Last 90 days
  queries:
  - technology: SIEM/pseudocode
    query: 'features = [image_name,parent_image,cmdline_tokens,user_context,file_hash,integrity_level]

      score = RandomForest.predict_proba(features)

      IF script_based: content_score = CharCNN_LSTM(script_content)

      IF score>thr OR content_score>thr THEN ALERT(top3_features(features), host,user,image)'
- question: '[Discovery] GPO command pattern match: Can you determine whether execution of native utilities
