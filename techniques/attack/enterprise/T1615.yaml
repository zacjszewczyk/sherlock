    filter complexity, time-of-day) with unsupervised embeddings/heterogeneous-graph methods to separate
    ''normal administration'' from ''anomalous enumeration'' ([Liu et al. Log2vec](https://doi.org/10.1145/3319535.3363749)).
    Alerts MUST surface the top-3 features (e.g., ''new host→DC edge'', ''filter=groupPolicyContainer'',
    ''rate 20x peers''). A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable Group Policy reconnaissance; pivot to the responsible process and its parent lineage, the
    user and host involved, the targeted Domain Controller or SYSVOL path, and any follow-on LDAP, SMB,
    or GPO-modification activity to scope the actor''s intent. A negative result helps rule out this particular
    discovery vector but should be corroborated with the other questions in this playbook, since a single
    method can miss stealthy, living-off-the-land, low-and-slow, or admin-blended enumeration.'
