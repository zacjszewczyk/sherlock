  - technology: SIEM/pseudocode
    query: 'edge = (src_host -> DC, query=groupPolicyContainer)

      rarity = BayesianNewEdge.score(edge)  // calibrated first-seen

      cluster = Log2vec.embed([src_ip,query_freq,filter_complexity,time_of_day])

      IF rarity high OR cluster==''anomalous enumeration'' THEN ALERT(top3=[''new host->DC edge'',''filter=groupPolicyContainer'',''rate
      Nx peers''])'
- question: '[Discovery] Unauthorized SYSVOL access rule: Can you determine whether an anomalous pattern
