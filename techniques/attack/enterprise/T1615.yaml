  - Windows Event ID 4104
  - 'NAI: All domain-joined endpoints and member servers, especially those used by system administrators
    where PowerShell logging is enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/pseudocode
    query: "FOR each gpo_cmd:\n  ent = shannon_entropy(cmdline); pct = percentile_vs(admin_script_corpus,\
      \ ent)\n  freq = count(gpo_cmd) per user per hour\n  med,mad = robust_baseline(freq, 30d); mz =\
      \ 0.6745*(freq-med)/mad\n  fail_rate = count(exit_code!=0 OR access_denied from gpresult /s)\n \
      \ IF pct>0.99 OR freq > mean+3*sigma OR abs(mz)>3.5 OR fail_rate spikes THEN ALERT(host,user,cmdline)"
- question: '[Discovery] Command anomaly forecasting: Can you determine whether execution of native utilities
