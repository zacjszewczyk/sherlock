- question: '[Discovery] GroupPolicyContainer query detection: Can you determine whether an unusual volume
    or pattern of LDAP queries from a single source host targeting objects of class ''groupPolicyContainer''.
    -- specifically, using the ''GroupPolicyContainer query detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary gathers information on
    Group Policy settings to identify paths for privilege escalation, understand the security measures
    applied within the domain, and find domain objects they can manipulate or use to blend in before deciding
    how to act. This evidence focuses on the condition that an unusual volume or pattern of LDAP queries
    from a single source host targeting objects of class ''groupPolicyContainer''. This Symbolic Logic
    approach works as follows: Alert on any LDAP search whose filter contains `(objectClass=groupPolicyContainer)`
    or `(objectCategory=groupPolicyContainer)` from Zeek ldap.log or Windows Event ID 4661, a known precursor
    used by PowerView/BloodHound ([PowerView docs](https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainGPO/),
    [Metcalf](https://adsecurity.org/?p=2716), [Robbins & Schroeder](https://posts.specterops.io/an-ace-up-the-sleeve-designing-active-directory-dacl-backdoors-92941715cf9a)).
    Raise priority when correlated with other recon from the same source IP. Profile the FAILURE state
    explicitly: a burst of failed LDAP binds or result-code errors preceding the query indicates credential
    probing. A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    Group Policy reconnaissance; pivot to the responsible process and its parent lineage, the user and
    host involved, the targeted Domain Controller or SYSVOL path, and any follow-on LDAP, SMB, or GPO-modification
    activity to scope the actor''s intent. A negative result helps rule out this particular discovery
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, living-off-the-land, low-and-slow, or admin-blended enumeration.'
  answer_sources:
  - Zeek ldap.log
  - Windows Event ID 4661
  - 'NAI: Network traffic to and from Domain Controllers, and Directory Service Access audit logs on Domain
    Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/pseudocode
    query: "ALERT WHERE (Zeek ldap.log filter CONTAINS '(objectClass=groupPolicyContainer)' OR '(objectCategory=groupPolicyContainer)')\n\
      \  OR (WinEventLog:Security EventCode=4661 ObjectType='groupPolicyContainer')\nRAISE_PRIORITY IF\
      \ correlated_recon(same src_ip)\nALSO ALERT IF burst(failed_ldap_binds OR ldap_result_error) precedes\
      \ query  // credential probing\nfields=[src_ip,dc,filter,result_code]"
- question: '[Discovery] LDAP query volume scoring: Can you determine whether an unusual volume or pattern
    of LDAP queries from a single source host targeting objects of class ''groupPolicyContainer''. --
    specifically, using the ''LDAP query volume scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary gathers information on
    Group Policy settings to identify paths for privilege escalation, understand the security measures
    applied within the domain, and find domain objects they can manipulate or use to blend in before deciding
    how to act. This evidence focuses on the condition that an unusual volume or pattern of LDAP queries
    from a single source host targeting objects of class ''groupPolicyContainer''. This Statistical Method
    approach works as follows: Baseline the hourly COUNT (volume/frequency) of groupPolicyContainer-targeting
    queries per source host over a 30-day rolling window and alert when a host exceeds a dynamic threshold
    of mean + 3σ ($$Z>3$$) or robust median/MAD |z|>3.5 to resist outliers ([Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf),
    [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    Apply CUSUM/change-point detection to catch sustained step-changes distinct from diurnal admin maintenance
    ([Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)). Derive thresholds per
    environment from the observed host distribution. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable Group Policy reconnaissance; pivot to the responsible process
    and its parent lineage, the user and host involved, the targeted Domain Controller or SYSVOL path,
    and any follow-on LDAP, SMB, or GPO-modification activity to scope the actor''s intent. A negative
    result helps rule out this particular discovery vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, living-off-the-land, low-and-slow, or admin-blended
    enumeration.'
