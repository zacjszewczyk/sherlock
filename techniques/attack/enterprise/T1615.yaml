    Alert on process creation (Event ID 4688) and PowerShell script-block logs (Event ID 4104) where gpresult.exe
    runs with high-risk flags `/z`, `/v`, or remote `/s` ([Sigma gpresult rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_gpresult_execution.yml),
