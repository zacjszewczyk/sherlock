questions:
- question: '[Discovery] Malicious hash IOC match: Can you determine whether execution of a process where
    the file hash (e.g., SHA256) matches a known signature for a Group Policy discovery tool, such as
    PowerView or a BloodHound ingestor. -- specifically, using the ''Malicious hash IOC match'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary gathers information on
    Group Policy settings to identify paths for privilege escalation, understand the security measures
    applied within the domain, and find domain objects they can manipulate or use to blend in before deciding
    how to act. This evidence focuses on the condition that execution of a process where the file hash
    (e.g., SHA256) matches a known signature for a Group Policy discovery tool, such as PowerView or a
    BloodHound ingestor. This Symbolic Logic approach works as follows: Monitor process creation (Windows
    Event ID 4688, Sysmon Event ID 1) and alert when a process image SHA256 matches a known GPO discovery
    tool (PowerView/SharpHound/BloodHound ingestor, WinPwn) from an integrated threat-intel feed. As a
    deterministic fallback that does not depend on external lookups, alert on the original/internal file
    names and tool tokens documented in [Atomic Red Team T1615](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1615/T1615.md)
    (e.g., SharpHound.exe, powerview.ps1, WinPwn.ps1). Keep this hard floor regardless of ML. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable Group Policy reconnaissance;
    pivot to the responsible process and its parent lineage, the user and host involved, the targeted
    Domain Controller or SYSVOL path, and any follow-on LDAP, SMB, or GPO-modification activity to scope
    the actor''s intent. A negative result helps rule out this particular discovery vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    living-off-the-land, low-and-slow, or admin-blended enumeration.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: Domain-joined endpoints and member servers where command execution and process creation are
    logged.'
  range: Last 90 days
  queries:
  - technology: SIEM/pseudocode
    query: "process_events = SELECT * FROM (WinEventLog:Security EventCode=4688 OR WinEventLog:Sysmon\
      \ EventCode=1)\nMATCH WHERE image_sha256 IN threat_intel_gpo_tool_hashes\n  OR lower(original_file_name)\
      \ IN ['sharphound.exe','powerview.ps1','winpwn.ps1','sharphound']\n  OR lower(image) MATCHES ('*sharphound*','*powerview*','*winpwn*')\n\
      ALERT severity=high, fields=[host,user,image,parent_image,image_sha256]"
- question: '[Discovery] Rare parent-process and frequency scoring: Can you determine whether execution
    of a process where the file hash (e.g., SHA256) matches a known signature for a Group Policy discovery
    tool, such as PowerView or a BloodHound ingestor. -- specifically, using the ''Rare parent-process
    and frequency scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary gathers information on
    Group Policy settings to identify paths for privilege escalation, understand the security measures
    applied within the domain, and find domain objects they can manipulate or use to blend in before deciding
    how to act. This evidence focuses on the condition that execution of a process where the file hash
    (e.g., SHA256) matches a known signature for a Group Policy discovery tool, such as PowerView or a
    BloodHound ingestor. This Statistical Method approach works as follows: For GPO discovery processes
    (gpresult.exe, powershell.exe spawning Get-DomainGPO) that do not match a known hash, score the rarity
    of the parent→child pairing and the per-host execution FREQUENCY (count/hour) and STATE (success vs
    error exit) over a 30-day baseline. Flag parent processes outside the 99th percentile of normal parents
    for that tool, or any parent never previously seen spawning it, using robust median/MAD scoring (|z|>3.5)
    to resist bursty admin noise ([Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf),
    [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    Treat the first-ever (parent,tool) pairing on a host as a rarity signal ([Ho et al.](https://www.usenix.org/system/files/sec21-ho.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable Group
    Policy reconnaissance; pivot to the responsible process and its parent lineage, the user and host
    involved, the targeted Domain Controller or SYSVOL path, and any follow-on LDAP, SMB, or GPO-modification
    activity to scope the actor''s intent. A negative result helps rule out this particular discovery
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, living-off-the-land, low-and-slow, or admin-blended enumeration.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: Domain-joined endpoints and member servers where command execution and process creation are
    logged.'
  range: Last 90 days
  queries:
  - technology: SIEM/pseudocode
    query: "FOR each (parent_image -> child_image) WHERE child_image IN ['gpresult.exe','powershell.exe(Get-DomainGPO)']\
      \ AND not hash_match:\n  baseline = 30d history of parents-of(child) per host\n  rarity = (parent\
      \ never seen OR parent_freq < p01)\n  med, mad = median(freq_per_hour), MAD(freq_per_hour)\n  mz\
      \ = 0.6745*(obs_freq - med)/mad\n  IF rarity OR abs(mz) > 3.5 THEN ALERT(host,user,parent_image,child_image,exit_state)"
- question: '[Discovery] Process behavior classifier: Can you determine whether execution of a process
    where the file hash (e.g., SHA256) matches a known signature for a Group Policy discovery tool, such
    as PowerView or a BloodHound ingestor. -- specifically, using the ''Process behavior classifier''
    (Machine Learning) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary gathers information on
