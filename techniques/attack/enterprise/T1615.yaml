name: 'T1615: Group Policy Discovery'
id: 76f1034e-7c31-4a04-94bb-50c27ae72e4c
description: 'This playbook helps an analyst investigate whether an adversary has performed discovery
  of Active Directory Group Policy settings to map paths for privilege escalation, identify security measures
  applied within a domain, and discover patterns in domain objects they can manipulate or abuse to blend
  in (MITRE ATT&CK T1615, Group Policy Discovery). Group Policy Objects (GPOs) are stored at the predictable
  network path \\<DOMAIN>\SYSVOL\<DOMAIN>\Policies\, and adversaries enumerate them with native tools
  such as gpresult, with PowerShell functions like Get-DomainGPO, Get-DomainGPOLocalGroup, and Get-NetGPO
  (PowerView), and with collectors such as SharpHound/BloodHound. The hunt spans domain-joined Windows
  endpoints, member servers, and Domain Controllers, and pursues the behavior from several complementary
  angles: execution of known GPO discovery tooling matched by file hash or original/internal tool name;
  native gpresult and PowerView/PowerSploit command-line and script-block patterns (including high-risk
  gpresult flags /z, /v, and remote /s); unusual volumes or first-ever LDAP queries filtered on the groupPolicyContainer
  object class against Domain Controllers; anomalous read access to the SYSVOL Policies directory by non-administrative
  accounts or in bulk; and the canonical LDAP-groupPolicyContainer-query-followed-by-SMB-SYSVOL-access
  sequence from a single source host. Detection methods combine deterministic symbolic-logic rules (hash/tool-name
  IOC matching, command and LDAP-filter token rules, unauthorized SYSVOL access thresholds, stateful LDAP-to-SYSVOL
  sequence correlation), statistical baselining (rare parent-process and frequency scoring, command entropy
  and frequency scoring, LDAP and SYSVOL volume scoring with modified z-score/MAD and CUSUM change-point
  detection, transition-probability scoring), and machine learning (supervised process-behavior classifiers,
  character-level neural models for obfuscated cradles, seasonal time-series/change-point forecasting,
  Bayesian new-edge rarity models, One-Class SVM/isolation detectors, and HMM/LSTM/DeepLog sequence likelihood
  scoring), applied across Windows Security and Sysmon events, PowerShell script-block logs, and Zeek
  ldap/smb_files logs, so the analyst can corroborate suspected Group Policy reconnaissance against process
  lineage, command content, LDAP activity, SYSVOL file access, and event sequencing.'
type: technique
