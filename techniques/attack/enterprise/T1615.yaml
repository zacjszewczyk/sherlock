    (e.g., `gpresult /z`, `Get-DomainGPO`, `Get-NetGPO`). This Statistical Method approach works as follows:
    For GPO-related command-lines, compute character-frequency/entropy and score percentile distance from
    a normal admin-script corpus to flag obfuscation ([Bohannon & Holmes](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf)).
    In parallel, baseline the per-user/host FREQUENCY (count/hour) of discovery commands and flag values
    beyond mean ± 3σ or robust |z|>3.5 ([Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf),
    [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    Profile the FAILURE state: repeated non-zero exit codes / access-denied from gpresult `/s` against
    hosts the actor lacks rights to is a distinct probing signal. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable Group Policy reconnaissance; pivot to the responsible
    process and its parent lineage, the user and host involved, the targeted Domain Controller or SYSVOL
    path, and any follow-on LDAP, SMB, or GPO-modification activity to scope the actor''s intent. A negative
    result helps rule out this particular discovery vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, living-off-the-land, low-and-slow, or admin-blended
    enumeration.'
  answer_sources:
