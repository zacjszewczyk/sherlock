    Office, installer, or administrative activity?'
  context: 'Tactic relevance (Persistence): adversaries leverage Office startup mechanisms (template macros,
    add-ins, Outlook rules/forms/Home Page) to regain execution every time an Office application launches,
    surviving reboots and credential changes. Evidence under investigation: An Outlook rule is created
    that is configured to launch an external application, contains keywords associated with scripting
    (`.vbs`, `.ps1`), or has a name with high entropy or consisting only of non-alphanumeric characters
    (e.g., ''.'', ''..''). Method (Statistical Method): Baseline entropy for rule names and flag those
    in the 99th percentile or composed solely of non-alphanumeric/blank characters (a known hidden-rule
    indicator per [Microsoft](https://learn.microsoft.com/en-us/defender-office-365/detect-and-remediate-outlook-rules-forms-attack));
    alert when a user''s rule/form creation Frequency exceeds 3σ over a 30-day baseline, and track failed/blocked
    rule-creation attempts (State) separately. A positive result (a rare/never-before-seen artifact, a
    denylisted process writing to a startup path or registry key, an Office app spawning a script interpreter
    or LOLBin, or an Outlook rule invoking an external application) is a strong persistence indicator
    and should be escalated and scoped across the fleet/tenant. A negative result helps narrow the investigation
    but should be corroborated with the other detection methods for this evidence.'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4663
  - 'NAI: User workstations, Microsoft Exchange servers, Office 365 tenant'
  range: Last 90 days (baseline over trailing 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '(index=m365 OR index=mailboxaudit) Operation IN (New-InboxRule,Set-InboxRule)

      | eval ent=shannon(rule_name), nonalnum=is_nonalphanumeric(rule_name)

      | stats count AS rule_rate by user, _time span=1d

      | where ent>p99(ent) OR nonalnum=true OR rule_rate>mean+3*stdev'
