- question: 'As part of investigating Office Application Startup persistence (Persistence), can you confirm
    or rule out malicious activity for the evidence: "An Office application process (e.g., winword.exe,
    excel.exe) spawns a child process (e.g., powershell.exe, wscript.exe) with a command line that contains
    obfuscation patterns, download cradles, or encoded payloads." by applying the ''Obfuscation regex
    detection'' technique? Specifically, symbolic logic — what artifacts, processes, or anomalies does
    this surface, and are any of them unexplained by legitimate Office, installer, or administrative activity?'
  context: 'Tactic relevance (Persistence): adversaries leverage Office startup mechanisms (template macros,
    add-ins, Outlook rules/forms/Home Page) to regain execution every time an Office application launches,
    surviving reboots and credential changes. Evidence under investigation: An Office application process
    (e.g., winword.exe, excel.exe) spawns a child process (e.g., powershell.exe, wscript.exe) with a command
    line that contains obfuscation patterns, download cradles, or encoded payloads. Method (Symbolic Logic):
    Apply regexes to command lines of Office child processes (winword/excel/powerpnt/outlook/msaccess
    parents) to detect `-enc`/`-EncodedCommand`, `-nop`, `-w hidden`, `IEX`, `DownloadString`, `Invoke-Expression`,
    `MSXML2.XMLHTTP`, `ADODB.Stream`, or long Base64 strings, alerting on matches; the canonical parent->interpreter
    signal is documented in [Suspicious Microsoft Office Child Process, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_office_susp_child_processes/)
    and the macro download-cradle indicators in [oletools / olevba](https://www.decalage.info/python/oletools).
    A positive result (a rare/never-before-seen artifact, a denylisted process writing to a startup path
    or registry key, an Office app spawning a script interpreter or LOLBin, or an Outlook rule invoking
    an external application) is a strong persistence indicator and should be escalated and scoped across
    the fleet/tenant. A negative result helps narrow the investigation but should be corroborated with
    the other detection methods for this evidence.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User workstations, Terminal servers, Internet gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=wineventlog EventCode=4688 ParentImage IN (winword.exe,excel.exe,powerpnt.exe,outlook.exe,msaccess.exe)

      | regex CommandLine="(?i)(-enc|-encodedcommand|-nop|-w hidden|IEX|DownloadString|Invoke-Expression|MSXML2.XMLHTTP|ADODB.Stream|[A-Za-z0-9+/]{200,})"

      | table _time host ParentImage Image CommandLine'
- question: 'As part of investigating Office Application Startup persistence (Persistence), can you confirm
    or rule out malicious activity for the evidence: "An Office application process (e.g., winword.exe,
    excel.exe) spawns a child process (e.g., powershell.exe, wscript.exe) with a command line that contains
    obfuscation patterns, download cradles, or encoded payloads." by applying the ''Entropy, length, and
    character-frequency scoring'' technique? Specifically, statistical method — what artifacts, processes,
    or anomalies does this surface, and are any of them unexplained by legitimate Office, installer, or
    administrative activity?'
  context: 'Tactic relevance (Persistence): adversaries leverage Office startup mechanisms (template macros,
    add-ins, Outlook rules/forms/Home Page) to regain execution every time an Office application launches,
    surviving reboots and credential changes. Evidence under investigation: An Office application process
    (e.g., winword.exe, excel.exe) spawns a child process (e.g., powershell.exe, wscript.exe) with a command
    line that contains obfuscation patterns, download cradles, or encoded payloads. Method (Statistical
    Method): Baseline command-line length and Shannon entropy per parent-child pair, flagging entries
    >3 standard deviations above the mean, and add a character-frequency cosine-similarity deviation score
    against a normal-script baseline to catch encoding as distributional drift per [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).
    Track State by counting failed vs successful child launches. A positive result (a rare/never-before-seen
    artifact, a denylisted process writing to a startup path or registry key, an Office app spawning a
    script interpreter or LOLBin, or an Outlook rule invoking an external application) is a strong persistence
    indicator and should be escalated and scoped across the fleet/tenant. A negative result helps narrow
    the investigation but should be corroborated with the other detection methods for this evidence.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User workstations, Terminal servers, Internet gateway'
  range: Last 90 days (baseline over trailing 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=wineventlog EventCode=4688 ParentImage IN (winword.exe,excel.exe,powerpnt.exe,outlook.exe)

      | eval len=len(CommandLine), ent=shannon(CommandLine)

      | stats mean(len) AS mlen stdev(len) AS slen mean(ent) AS ment stdev(ent) AS sent by ParentImage,Image

      | where len>mlen+3*slen OR ent>ment+3*sent OR cosine_dev(CommandLine,normal_script_baseline)>thr'
- question: 'As part of investigating Office Application Startup persistence (Persistence), can you confirm
    or rule out malicious activity for the evidence: "An Office application process (e.g., winword.exe,
    excel.exe) spawns a child process (e.g., powershell.exe, wscript.exe) with a command line that contains
    obfuscation patterns, download cradles, or encoded payloads." by applying the ''Command-line/content
    classifier'' technique? Specifically, machine learning — what artifacts, processes, or anomalies does
    this surface, and are any of them unexplained by legitimate Office, installer, or administrative activity?'
  context: 'Tactic relevance (Persistence): adversaries leverage Office startup mechanisms (template macros,
    add-ins, Outlook rules/forms/Home Page) to regain execution every time an Office application launches,
    surviving reboots and credential changes. Evidence under investigation: An Office application process
    (e.g., winword.exe, excel.exe) spawns a child process (e.g., powershell.exe, wscript.exe) with a command
    line that contains obfuscation patterns, download cradles, or encoded payloads. Method (Machine Learning):
    Train a classifier (Random Forest/XGBoost) on command-line features (keywords, n-grams, entropy, length)
    and, where AMSI is enabled, on post-deobfuscation script content using contextual embeddings per [AMSI-Based
    Detection of Malicious PowerShell Using Contextual Embeddings](https://arxiv.org/pdf/1905.09538);
    supervised VBA-content detection via [Using LSI to Detect Unknown Malicious VBA Macros](https://www.jstage.jst.go.jp/article/ipsjjip/28/0/28_493/_article/-char/en)
    covers the macro body. Emit the top-3 contributing features/tokens with each alert. A positive result
    (a rare/never-before-seen artifact, a denylisted process writing to a startup path or registry key,
    an Office app spawning a script interpreter or LOLBin, or an Outlook rule invoking an external application)
    is a strong persistence indicator and should be escalated and scoped across the fleet/tenant. A negative
    result helps narrow the investigation but should be corroborated with the other detection methods
    for this evidence.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User workstations, Terminal servers, Internet gateway'
  range: Last 90 days (baseline over trailing 30 days)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Train RF/XGBoost on cmdline features (keywords,n-grams,entropy,length)

      // + AMSI post-deobfuscation content embeddings where available

      score = model.predict(features(EventCode=4688 office_child_processes))

      if score>threshold: alert(top3_features)'
