name: 'T1137: Office Application Startup'
id: 6936d3ad-58bc-4aac-b7b9-05bb2f7a9cb6
description: Investigate adversary use of Microsoft Office application startup mechanisms for persistence
  between application restarts. This playbook helps an analyst hunt for and triage malicious Office Template
  macros (Word STARTUP, Excel XLSTART, Normal.dotm), Office add-ins (WLL/XLL/DLL and registry Addins keys
  with LoadBehavior), and Outlook abuses including malicious rules (RunAnApplication/ForwardTo/RedirectTo),
  custom forms, and Home Page/WebView redirects. It correlates suspicious file writes and registry modifications
  in Office startup/template paths, detects Office applications spawning script interpreters and LOLBins
  with obfuscated command lines, scores artifacts by enterprise prevalence and entropy, and applies time-series
  and supervised models to surface rare, anomalous Office-driven activity across endpoints, Exchange,
  and Microsoft 365/Office 365 tenants.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: 'As part of investigating Office Application Startup persistence (Persistence), can you confirm
    or rule out malicious activity for the evidence: "A file creation event is logged for a file written
    to a known Office startup or template path, or a registry modification event is logged for a key related
    to Office add-ins." by applying the ''Startup file/registry IOC correlation'' technique? Specifically,
    symbolic logic — what artifacts, processes, or anomalies does this surface, and are any of them unexplained
    by legitimate Office, installer, or administrative activity?'
  context: 'Tactic relevance (Persistence): adversaries leverage Office startup mechanisms (template macros,
    add-ins, Outlook rules/forms/Home Page) to regain execution every time an Office application launches,
    surviving reboots and credential changes. Evidence under investigation: A file creation event is logged
    for a file written to a known Office startup or template path, or a registry modification event is
    logged for a key related to Office add-ins. Method (Symbolic Logic): Hash files written to Office
    startup/template paths (e.g., `%APPDATA%\Microsoft\Word\STARTUP`, `%APPDATA%\Microsoft\Excel\XLSTART`,
    `%APPDATA%\Microsoft\Templates\Normal.dotm`, `%APPDATA%\Microsoft\AddIns`) and correlate against malicious-hash
    feeds, and match registry modifications under `HKCU\Software\Microsoft\Office\<app>\Addins` and Outlook
    `WebView`/`Forms` keys to watchlists of malicious add-ins/CLSIDs. Require Sysmon EID 11 (file) / EID
    13/14 (registry) collection of these exact paths per [SwiftOnSecurity Sysmon Configuration](https://github.com/SwiftOnSecurity/sysmon-config)
    and emulate true positives with [Atomic Red Team - T1137](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1137/T1137.md).
    A positive result (a rare/never-before-seen artifact, a denylisted process writing to a startup path
    or registry key, an Office app spawning a script interpreter or LOLBin, or an Outlook rule invoking
    an external application) is a strong persistence indicator and should be escalated and scoped across
    the fleet/tenant. A negative result helps narrow the investigation but should be corroborated with
    the other detection methods for this evidence.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Windows Event ID 4688
  - 'NAI: User workstations, Terminal servers, File servers hosting shared Office templates'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=sysmon (EventCode=11 TargetFilename IN ("*\\Microsoft\\Word\\STARTUP\\*","*\\Microsoft\\Excel\\XLSTART\\*","*\\Microsoft\\Templates\\Normal.dotm","*\\Microsoft\\AddIns\\*"))
      OR (EventCode IN (13,14) TargetObject="*\\Software\\Microsoft\\Office\\*\\Addins\\*")

      | eval h=hash(file)

      | lookup malicious_hash_feed sha256 AS h OUTPUT verdict

      | lookup malicious_addin_clsid_watchlist clsid AS TargetObject OUTPUT mal

      | where isnotnull(verdict) OR isnotnull(mal)'
- question: 'As part of investigating Office Application Startup persistence (Persistence), can you confirm
    or rule out malicious activity for the evidence: "A file creation event is logged for a file written
    to a known Office startup or template path, or a registry modification event is logged for a key related
    to Office add-ins." by applying the ''Prevalence and entropy scoring'' technique? Specifically, statistical
    method — what artifacts, processes, or anomalies does this surface, and are any of them unexplained
    by legitimate Office, installer, or administrative activity?'
  context: 'Tactic relevance (Persistence): adversaries leverage Office startup mechanisms (template macros,
    add-ins, Outlook rules/forms/Home Page) to regain execution every time an Office application launches,
    surviving reboots and credential changes. Evidence under investigation: A file creation event is logged
    for a file written to a known Office startup or template path, or a registry modification event is
    logged for a key related to Office add-ins. Method (Statistical Method): Score each startup/template
    file and add-in DLL path by enterprise prevalence and flag artifacts present on <1% of endpoints or
    never seen before, using the fleet-wide frequency-analysis approach in [Using Frequency Analysis to
    Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).
    Add Volume (bytes written to the path) and Frequency (writes/day per host) metrics and flag filename
    entropy in the 99th percentile; derive the 1% prevalence and entropy cutoffs from your own 30-day
    baseline. A positive result (a rare/never-before-seen artifact, a denylisted process writing to a
    startup path or registry key, an Office app spawning a script interpreter or LOLBin, or an Outlook
    rule invoking an external application) is a strong persistence indicator and should be escalated and
    scoped across the fleet/tenant. A negative result helps narrow the investigation but should be corroborated
    with the other detection methods for this evidence.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Windows Event ID 4688
  - 'NAI: User workstations, Terminal servers, File servers hosting shared Office templates'
  range: Last 90 days (baseline over trailing 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=sysmon EventCode IN (11,13,14) (Office startup/template/addin paths)

      | stats dc(host) AS host_count sum(bytes) AS volume count AS writes_per_day by file_path

      | eval prevalence=host_count/total_hosts, entropy=shannon(file_name)

      | where prevalence<0.01 OR entropy>p99(entropy)'
