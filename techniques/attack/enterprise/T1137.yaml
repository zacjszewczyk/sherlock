      (RunAnApplication=* OR ForwardTo=* OR RedirectTo=* OR DeleteMessage=*)

      OR registry TargetObject IN (Outlook WebView, Home Page, Forms keys) Details IN (*.exe,*.dll,*.vbs,*.ps1)

      | table _time user Operation Parameters'
- question: 'As part of investigating Office Application Startup persistence (Persistence), can you confirm
