    by applying the ''RunAnApplication and form/homepage detection'' technique? Specifically, symbolic
    logic — what artifacts, processes, or anomalies does this surface, and are any of them unexplained
    by legitimate Office, installer, or administrative activity?'
  context: 'Tactic relevance (Persistence): adversaries leverage Office startup mechanisms (template macros,
    add-ins, Outlook rules/forms/Home Page) to regain execution every time an Office application launches,
    surviving reboots and credential changes. Evidence under investigation: An Outlook rule is created
    that is configured to launch an external application, contains keywords associated with scripting
    (`.vbs`, `.ps1`), or has a name with high entropy or consisting only of non-alphanumeric characters
    (e.g., ''.'', ''..''). Method (Symbolic Logic): Search Unified/Mailbox Audit Logs for New-InboxRule/Set-InboxRule
    events using `-RunAnApplication` or `-ForwardTo`/`-RedirectTo`/`-DeleteMessage`, hunt custom-form
    and Outlook `WebView`/Home Page registry artifacts, and monitor Outlook rule registry keys referencing
    `.exe`/`.dll`/`.vbs`/`.ps1`, per [Detect and Remediate Outlook Rules and Custom Forms Injection Attacks,
    Microsoft](https://learn.microsoft.com/en-us/defender-office-365/detect-and-remediate-outlook-rules-forms-attack),
    [MAPI over HTTP and Mailrule Pwnage, SensePost](https://sensepost.com/blog/2016/mapi-over-http-and-mailrule-pwnage/),
    and [Outlook Forms and Shells, SensePost](https://sensepost.com/blog/2017/outlook-forms-and-shells/).
    A positive result (a rare/never-before-seen artifact, a denylisted process writing to a startup path
    or registry key, an Office app spawning a script interpreter or LOLBin, or an Outlook rule invoking
    an external application) is a strong persistence indicator and should be escalated and scoped across
    the fleet/tenant. A negative result helps narrow the investigation but should be corroborated with
    the other detection methods for this evidence.'
