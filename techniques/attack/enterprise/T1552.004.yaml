name: 'T1552.004: Private Keys'
id: 61c0b8c1-3d33-43de-9c05-4fb4e05b79c2
description: 'This playbook helps an analyst investigate whether an adversary has discovered, collected,
  or misused private cryptographic keys and certificates stored insecurely on compromised systems, as
  part of the Credential Access tactic. Private keys and certificates (file extensions such as .key, .pem,
  .pgp, .gpg, .ppk, .p12, .pfx, .cer, .p7b, .asc) are used for authentication, encryption, and digital
  signatures, and adversaries target common key locations -- ~/.ssh on *nix, C:\Users\<user>\.ssh and
  Windows certificate stores (C:\ProgramData\Microsoft\Crypto\*), macOS keychains, web-server TLS directories,
  Entra ID device/transport keys, and network-device key material exportable via CLI commands like ''crypto
  pki export''. The hunt spans Windows, Linux, macOS, and network devices. It guides the analyst across
  several behavioral angles: execution of known key-theft tooling matched by hash or command line (Mimikatz,
  LaZagne, SharpDPAPI, AADInternals, keytheft); native-utility command lines that search, copy, or export
  keys (find, grep, findstr, certutil, copy, tar, Compress-Archive); unauthorized or anomalous reads of
  key files and directories including denied-access probing; statistically unusual volumes of distinct
  key-file access suggesting automated discovery; anomalous certificate-/key-based authentication from
  new devices, geographies, or IPs (including Entra ID device-token sign-ins and SSH public-key auth);
  correlated collect-stage-exfiltrate sequences (mass key reads -> archive creation -> anomalous egress);
  and explicit private-key export commands on network infrastructure preceded by privilege escalation.
  Detection methods combine deterministic symbolic-logic rules, statistical baselining, and machine-learning
  models applied to Windows Security/Sysmon events (4688, 1, 4663, 11, 4624), Linux auditd, macOS unified
  logs, Zeek conn/files/ssh/ssl logs, Azure AD sign-in logs, and network device syslog/TACACS+/RADIUS,
  so the analyst can corroborate suspected private-key theft against process lineage, file and directory
  access, key-access volume, authentication anomalies, exfiltration chains, and infrastructure export
  commands.'
type: technique
