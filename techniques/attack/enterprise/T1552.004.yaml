questions:
- question: '[Credential Access] Match known threat intelligence for key-stealing tools: Can you determine
    whether a running process''s file hash or command-line signature matches a known credential theft
    tool that targets private keys (e.g., Mimikatz, LaZagne, SharpDPAPI, AADInternals, keytheft). The
    process may be observed on Windows, Linux, or macOS. -- specifically, using the ''Match known threat
    intelligence for key-stealing tools'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary searches for and
    harvests insecurely stored private cryptographic keys and certificates to authenticate to remote services
    (SSH, VPN, client-certificate logins), impersonate devices and users, or decrypt collected data --
    often making subsequent access harder to detect because it uses legitimate credentials. This evidence
    focuses on the condition that a running process''s file hash or command-line signature matches a known
    credential theft tool that targets private keys (e.g., Mimikatz, LaZagne, SharpDPAPI, AADInternals,
    keytheft). The process may be observed on Windows, Linux, or macOS. This Symbolic Logic approach works
    as follows: Alert when process hashes or command-line arguments match a threat-intel feed of known
    private-key/cert theft tools (Mimikatz `crypto::certificates /export`, LaZagne, SharpDPAPI, AADInternals,
    keytheft) and the canonical export commands documented for AD CS abuse ([Certified Pre-Owned](https://posts.specterops.io/certified-pre-owned-d95910965cd2))
    and emulation tests ([Atomic Red Team T1552.004](https://www.atomicredteam.io/atomic-red-team/atomics/T1552.004)).
    Keep this deterministic floor (hash/string match) and layer statistics/ML in parallel ([MITRE ATT&CK
    T1552.004](https://attack.mitre.org/techniques/T1552/004/)). A positive result -- a deterministic
    rule match, a statistical outlier, or a model alert -- indicates probable discovery, collection, or
    misuse of private keys; pivot to the responsible process and its parent lineage, the user/device context,
    the specific key files and directories touched, any staging or archive activity, the destination or
    authentication source, and any downstream certificate/key reuse. A negative result helps rule out
    this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, living-off-the-land, or low-and-slow key theft.'
