    credential theft tool that targets private keys (e.g., Mimikatz, LaZagne, SharpDPAPI, AADInternals,
    keytheft). The process may be observed on Windows, Linux, or macOS. This Statistical Method approach
    works as follows: Beyond command-line entropy, baseline per-process access behaviour to key files
    — total bytes read (Volume) and number of distinct key files / handle-open attempts (Frequency) —
    and flag processes exceeding the 99th percentile or >3σ of a 7–30 day baseline, the access-behaviour
    model shown to separate theft from benign access ([Ah-Fat et al.](https://www.usenix.org/system/files/raid20-ah-fat.pdf)).
    Track failed/denied key opens (Event 4663 access-denied, auditd EACCES) as a distinct State signal
    that often precedes a successful theft. A positive result -- a deterministic rule match, a statistical
    outlier, or a model alert -- indicates probable discovery, collection, or misuse of private keys;
    pivot to the responsible process and its parent lineage, the user/device context, the specific key
    files and directories touched, any staging or archive activity, the destination or authentication
    source, and any downstream certificate/key reuse. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, living-off-the-land, or low-and-slow key theft.'
