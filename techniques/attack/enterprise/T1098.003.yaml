    over per-principal features (source geo/city, ASN, identity, User-Agent, time-of-day as sine/cosine,
    IAM action name). Alert on rare user-command, rare-geo, or high-API-volume populations [Detecting
    Threats in AWS CloudTrail Logs Using Machine Learning](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).
