questions:
- question: 'Using a symbolic logic approach, can you determine whether "Continuously ingest threat intelligence
    feeds for" reveals Additional Cloud Roles activity supporting Persistence (TA0003)? Specifically:
    Continuously ingest threat intelligence feeds for malicious IPs, ASNs, and User-Agents (e.g., known
    offensive-tool UAs such as Boto3/aws-cli automation, S3Browser, or Tor exit nodes). Create a real-time
    SIEM rule to alert when an IAM modification event (AttachUserPolicy, PutUserPolicy, CreatePolicyVersion,
    UpdateAssumeRolePolicy, Add member to role) has a `sourceIPAddress`, ASN, or `userAgent` matching
    the feed. Anchor on first-party CloudTrail/Entra logs so the rule fires without external lookup if
    the feed is down. Real-world AWS persistence intrusions used exactly these IAM API calls from attacker
    IPs [The Curious Case of DangerDev](https://www.invictus-ir.com/news/the-curious-case-of-dangerdev-protonmail-me).'
  context: 'Tactic context (Persistence): mission question - Is the adversary maintaining persistence
    by adding roles to a compromised cloud account? (PIR) Evidence under investigation: A cloud audit
    log event for an IAM policy modification (e.g., AWS CreatePolicyVersion) shows a source IP address
    or User-Agent string that is either on a threat intelligence feed or is statistically anomalous for
    the actor making the change. Approach (Continuously ingest threat intelligence feeds for | Symbolic
    Logic): Continuously ingest threat intelligence feeds for malicious IPs, ASNs, and User-Agents (e.g.,
    known offensive-tool UAs such as Boto3/aws-cli automation, S3Browser, or Tor exit nodes). Create a
    real-time SIEM rule to alert when an IAM modification event (AttachUserPolicy, PutUserPolicy, CreatePolicyVersion,
    UpdateAssumeRolePolicy, Add member to role) has a `sourceIPAddress`, ASN, or `userAgent` matching
    the feed. Anchor on first-party CloudTrail/Entra logs so the rule fires without external lookup if
    the feed is down. Real-world AWS persistence intrusions used exactly these IAM API calls from attacker
    IPs [The Curious Case of DangerDev](https://www.invictus-ir.com/news/the-curious-case-of-dangerdev-protonmail-me).
    A positive result indicates a cloud role/permission change consistent with adversary persistence -
    investigate the targeted principal, the granting identity, the source IP/ASN/User-Agent, and any subsequent
    high-impact API use; a negative result means the change matches established administrative baselines.
    Pivot from any hit through the named area of interest (Cloud provider IAM API endpoints; Network egress
    points and VPN gateways; Threat intelligence platform feeds.) to scope the full blast radius.'
