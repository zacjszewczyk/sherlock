- question: 'Using a statistical method approach, can you determine whether "For all existing IAM policies
    calculate" reveals Additional Cloud Roles activity supporting Persistence (TA0003)? Specifically:
    For all existing policies compute a ''permission power'' score = (count of distinct write/IAM/* actions)
    + wildcard weight (Action:* or Resource:* count double). Baseline the distribution and alert when
    a newly attached/created policy exceeds the 98th percentile or contains an Action:* + Resource:* grant.
    Use a robust median/MAD baseline rather than mean/stddev so a few admin policies do not raise the
    threshold [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).
    Cloudsplaining''s escalation/exposure action lists supply the per-action weights [Cloudsplaining](https://github.com/salesforce/cloudsplaining).'
