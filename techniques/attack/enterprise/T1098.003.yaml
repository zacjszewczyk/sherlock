name: 'T1098.003: Additional Cloud Roles'
id: 0ffb84ca-9cca-4cad-b6b6-8cc68240a61e
description: 'This playbook helps an analyst investigate Additional Cloud Roles (T1098.003): an adversary
  adding IAM roles, policies, or administrative privileges to an adversary-controlled or compromised cloud
  account to maintain persistence and/or escalate privileges across IaaS (AWS, Azure, GCP), Identity Provider
  (Entra ID, Okta), Office Suite (Microsoft 365/O365), and SaaS tenants. It correlates cloud audit telemetry
  (AWS CloudTrail, Azure Activity Logs, Google Cloud Audit Logs) and identity logs (IdP sign-in logs,
  M365 unified/audit, Windows Event ID 4624) to surface suspicious permission grants. Investigative angles
  include: IAM modification events (AttachUserPolicy, PutUserPolicy, CreatePolicyVersion, SetDefaultPolicyVersion,
  UpdateAssumeRolePolicy, PutRolePolicy, Add member to role) originating from threat-intel-flagged or
  statistically anomalous source IPs/ASNs/User-Agents; grants of self-modification or escalation permission
  combinations; high-privilege roles assigned to newly created, dormant, or external/guest accounts and
  cross-account trust additions; bursts of role/policy changes or off-hours activity; malicious or high-entropy
  role/policy names; non-admin principals receiving IAM write permissions; and AccessDenied-to-Success
  transitions where a freshly granted principal immediately exercises high-impact APIs. Detection blends
  symbolic-logic watchlists, statistical baselining (modified Z-score/MAD, percentiles, Jaccard similarity,
  Levenshtein/Shannon entropy, time-series decomposition), and machine learning (rare-population CloudTrail
  jobs, IAM permission-graph reachability/PMapper, GNNs, DBSCAN clustering, LSTM autoencoders, Prophet/ARIMA
  forecasting) to produce explainable, evasion-resistant alerts for the Persistence and Privilege Escalation
  tactics.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
