name: 'T1564.012: Hide Artifacts: File/Path Exclusions'
id: 90da2c68-98a6-4061-81b1-a61816b51d77
description: 'Investigate whether an adversary is abusing antivirus/EDR file and path exclusions to hide
  file-based artifacts (MITRE ATT&CK T1564.012). This playbook helps an analyst hunt for payloads written
  to or executed from known security-software exclusion paths (default Defender exclusions, automatic
  server-role exclusions for Exchange/SQL/IIS/DFS, and over-broad admin-defined paths such as %Temp% or
  whole-drive/extension exclusions), as well as for the precursor activity that turns a folder into a
  hiding spot: creation or modification of exclusions themselves and reconnaissance of existing exclusion
  configurations. It covers deterministic detection (known-bad hash/name matches, exclusion-add registry/PowerShell/reg.exe
  signatures, discovery-then-write chains), statistical baselining (write frequency/volume, command-line
  entropy, file-property anomalies, source rarity, conditional probability of staging after discovery),
  and machine-learning approaches (file classifiers, one-class models, command clustering, time-series
  mass-deployment detection, and provenance-graph subgraph anomaly detection). Evidence spans Windows
  endpoint logs (Event IDs 4663, 4688, 4657, 4104; Sysmon 11/13), Linux/macOS file and process telemetry
  (auditd, unified log), and network egress telemetry (Zeek conn.log/files.log) to correlate downloads
  with writes into excluded directories.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Has any file been written to or executed from a known security-software exclusion path whose
    hash matches a known-bad IOC or whose name matches a malicious-tool naming pattern?
  context: 'Adversaries drop payloads into default or well-known AV/EDR exclusion paths so file-based
    scanners never inspect them. Build and continuously maintain a centralized inventory of every active
    exclusion path by parsing Defender registry keys (HKLM\SOFTWARE\Microsoft\Windows Defender\Exclusions)
    and Group Policy, the documented automatic server-role exclusions (Exchange, SQL, IIS, DFS), and any
    over-broad admin-defined paths (e.g., %Temp%, whole-drive, executable-extension exclusions). For every
    file access/creation (Event ID 4663) and process creation (Event ID 4688) inside those paths, compute
    the file hash and match it against a high-fidelity known-bad feed, and apply regex name patterns for
    hacking-tool/suspicious naming. This deterministic floor for the Stealth tactic should be tuned (path
    list + IOC feed) rather than removed; a match is a high-confidence indicator of deliberate exclusion
    abuse to keep a payload hidden from security tooling. References: [Configure custom exclusions for
    Microsoft Defender Antivirus](https://learn.microsoft.com/en-us/defender-endpoint/configure-exclusions-microsoft-defender-antivirus);
    [Common mistakes to avoid when defining exclusions](https://learn.microsoft.com/en-us/defender-endpoint/common-exclusion-mistakes-microsoft-defender-antivirus).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: File systems on Windows endpoints and servers, focusing on common default exclusion paths (e.g.,
    %windir%\Temp, %appdata%\Temp) and configured exclusion directories for security tools (e.g., Microsoft
    Defender, CrowdStrike) and enterprise applications (e.g., SQL Server data directories, developer build
    folders).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'exclusion_paths = inventory(defender_registry + GPO + server_role_exclusions + admin_overbroad)

      from (EventID=4663 OR EventID=4688) where TargetFilename in exclusion_paths

      | eval h = file_hash(TargetFilename)

      | where h in knownbad_feed OR regex_match(file_name, malicious_tool_name_patterns)

      | alert severity=high'
- question: Was an antivirus/EDR exclusion itself created or modified (registry write, PowerShell Add/Set-MpPreference,
    or reg.exe ADD against the Exclusions key)?
  context: 'Creating or modifying an exclusion is the precondition that turns an ordinary folder into
    a T1564.012 hiding spot, so detecting the exclusion-add is an early, high-value Stealth signal. Trigger
    on registry writes whose target contains ''\Microsoft\Windows Defender\Exclusions'' (Sysmon Event
    ID 13 / Windows Event ID 4657); on PowerShell script blocks (Event ID 4104) combining Add-MpPreference/Set-MpPreference
    with -ExclusionPath/-ExclusionExtension/-ExclusionProcess; and on reg.exe ADD against Exclusions\Paths
    (Event ID 4688), a technique observed in Qbot. Escalate severity when an exclusion-add is followed
    within one hour by a write to that same path, which strongly suggests the exclusion was created specifically
    to stage a payload. References: [Windows Defender Exclusions Added - Registry, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_defender_exclusions.yml);
    [Windows Defender Exclusions Added - PowerShell, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_win_defender_exclusions_added.yml);
    [Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_reg_defender_exclusion.yml).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: File systems on Windows endpoints and servers, focusing on common default exclusion paths (e.g.,
    %windir%\Temp, %appdata%\Temp) and configured exclusion directories for security tools (e.g., Microsoft
    Defender, CrowdStrike) and enterprise applications (e.g., SQL Server data directories, developer build
    folders).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'reg_add = (EventID=4657 OR Sysmon=13) where TargetObject matches ''*\\Microsoft\\Windows Defender\\Exclusions*''

      ps_add  = EventID=4104 where ScriptBlock matches ''*(Add|Set)-MpPreference*'' AND ''*-Exclusion(Path|Extension|Process)*''

      exe_add = EventID=4688 where Image=''*\\reg.exe'' AND CommandLine matches ''*ADD*Exclusions\\Paths*''

      | alert on any(reg_add, ps_add, exe_add)

      | if write_to_same_path within 1h after add: severity=high'
- question: Does any host exhibit anomalous write frequency or volume into an exclusion path, or repeated
    denied/blocked exclusion writes, relative to a 30-day baseline?
  context: 'Legitimate writes into exclusion paths follow stable per-host patterns; sudden spikes in write
    frequency (Event ID 4663 count/host/24h) or bytes written can reveal payload staging under the Stealth
    tactic. Baseline both features over a rolling 30-day window and compute the 99th percentile per exclusion
    path, alerting when a host exceeds either. Separately profile the failure/state signal: access-denied
    writes (4663 with denied access) and blocked exclusion-add attempts as a distinct rare-event feature,
    since adversaries probe defenses before succeeding. Derive thresholds per environment from observed
    percentiles; an Isolation Forest can score the resulting feature vector for unsupervised outliers.
    References: [LOLBins Abuse, Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/); [Robust IoT
    security using isolation forest and one class SVM algorithms](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: File systems on Windows endpoints and servers, focusing on common default exclusion paths (e.g.,
    %windir%\Temp, %appdata%\Temp) and configured exclusion directories for security tools (e.g., Microsoft
    Defender, CrowdStrike) and enterprise applications (e.g., SQL Server data directories, developer build
    folders).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from EventID=4663 where TargetFilename in exclusion_paths and access_status=''success''

      | stats count as writes, sum(bytes) as vol by host, path, day

      | eventstats perc99(writes) as p99w, perc99(vol) as p99v by path (window=30d)

      | where writes>p99w OR vol>p99v | alert

      | append [ from EventID=4663 where access_status=''denied'' | stats count as denied by host,path
      | where denied rare ]'
  - technology: ML/pseudocode
    query: 'X = features(write_freq, write_vol, denied_count, blocked_add_count) per host/path

      model = IsolationForest().fit(baseline_X)

      alert where model.score(X) anomalous'
- question: When a new file is written into an exclusion path, does a trained file classifier flag it
    as malicious or anomalous based on its properties?
  context: 'Many malicious payloads staged in exclusion paths differ from legitimate files in measurable
    properties even when no IOC match exists. Train a gradient-boosted/random-forest classifier on labeled
    benign vs malicious file-write events within exclusion paths using features such as file extension,
    Shannon entropy, digital-signer status, file-name length, file size, and parent-process name; where
    malicious labels are scarce, train a one-class model (Isolation Forest/autoencoder/OCSVM) only on
    benign per-path writes. Classify each new Event ID 4663 write and alert on suspicious/anomalous results.
    To keep alerts actionable for the Stealth tactic, every alert must surface the top-3 contributing
    features (e.g., ''unsigned, entropy=7.8, parent=reg.exe'') via SHAP/LIME. References: [Malware Detection
    for Internet of Things Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/);
    [A systematic review on the integration of explainable AI in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: File systems on Windows endpoints and servers, focusing on common default exclusion paths (e.g.,
    %windir%\Temp, %appdata%\Temp) and configured exclusion directories for security tools (e.g., Microsoft
    Defender, CrowdStrike) and enterprise applications (e.g., SQL Server data directories, developer build
    folders).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [ext, entropy, signer_status, name_len, size, parent_proc]\nclf = GradientBoosting/RandomForest.fit(labeled_writes)\
      \  # or OneClassSVM/IsolationForest on benign\nfor w in new EventID=4663 in exclusion_paths:\n \
      \ p = clf.predict(features(w))\n  if p == 'suspicious': alert with top3_shap(features(w))"
- question: Has a process executed exclusion-discovery commands or used built-in utilities to move/download
    files into an exclusion path?
  context: 'Before abusing an exclusion, adversaries often enumerate existing exclusions and then stage
    files into them using living-off-the-land binaries. Monitor process creation (Event ID 4688) and PowerShell
    script-block logs (Event ID 4104) for exclusion-discovery command lines (e.g., reg query HKLM\SOFTWARE\Microsoft\Windows
    Defender\Exclusions, Get-MpPreference, Get-MpPreference | Select Exclusion*) and for file-movement
    into excluded paths (e.g., copy *.exe C:\AV_Exclusion\, Invoke-WebRequest ... -OutFile C:\Vendor\Exclude\).
    Scope the LOLBins watched (reg.exe, powershell.exe, certutil, wmic) using prevalence guidance, generate
    a medium-severity alert on any match, and correlate to exclusion-add signatures. This directly supports
    the Stealth PIR by catching reconnaissance and staging behavior tied to exclusion abuse. References:
    [LOLBins Abuse, Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/); [Suspicious Windows Defender
    Folder Exclusion Added Via Reg.EXE, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_reg_defender_exclusion.yml).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Process execution logs (command-line and PowerShell) on all Windows endpoints and servers. Network
    traffic logs at egress points (proxies, firewalls) to correlate download commands observed in command-line
    arguments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from (EventID=4688 OR EventID=4104)\n| where CommandLine matches '*reg query*Windows Defender\\\
      \\Exclusions*'\n      OR CommandLine matches '*Get-MpPreference*'\n      OR CommandLine matches\
      \ '*copy*.exe*\\\\(AV_Exclusion|Exclude)\\\\*'\n      OR CommandLine matches '*Invoke-WebRequest*-OutFile*exclusion_path*'\n\
      | where Image in [reg.exe, powershell.exe, certutil.exe, wmic.exe]\n| alert severity=medium"
- question: Do command-line invocations of common utilities show anomalous length, entropy, or exclusion-discovery
    frequency relative to per-host baselines?
  context: 'Obfuscated or scripted exclusion-abuse commands tend to deviate statistically from normal
    admin usage. For common utilities (powershell.exe, cmd.exe, wmic.exe, reg.exe), baseline per host
    the command-line length, Shannon entropy, and character-frequency distribution, alerting on outliers
    (>3 standard deviations from the per-parent mean) - the approach validated for obfuscated PowerShell
    detection. Add a frequency dimension: count exclusion-discovery commands/host/day and flag hosts whose
    rate exceeds the fleet 99th percentile. Under the Stealth tactic this catches both heavily obfuscated
    commands and unusually frequent enumeration that precedes payload hiding. References: [Revoke-Obfuscation,
    Bohannon and Holmes](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf);
    [LOLBins Abuse, Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Process execution logs (command-line and PowerShell) on all Windows endpoints and servers. Network
    traffic logs at egress points (proxies, firewalls) to correlate download commands observed in command-line
    arguments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from EventID=4688 where Image in [powershell.exe,cmd.exe,wmic.exe,reg.exe]

      | eval len=length(CommandLine), ent=shannon_entropy(CommandLine)

      | eventstats mean(len) as mu_l, stdev(len) as sd_l, mean(ent) as mu_e, stdev(ent) as sd_e by host,
      parent

      | where len>mu_l+3*sd_l OR ent>mu_e+3*sd_e | alert

      | append [ stats count as disc by host where is_exclusion_discovery | where disc>fleet_perc99 ]'
- question: Do command lines of processes that touch exclusion paths form new clusters that do not match
    known admin/benign activity?
  context: 'Novel adversary tradecraft for exclusion abuse may not match any existing signature but will
    stand out as a new behavioral cluster. Vectorize command-line arguments of processes that touch exclusion
    paths using TF-IDF and cluster with DBSCAN; investigate new clusters that do not match known admin/benign
    activity as possible novel tradecraft, retraining periodically to track benign drift. For each surfaced
    cluster member, report the top-3 distinguishing tokens/features in the alert. This supports the Stealth
    PIR by surfacing previously unseen exclusion-staging patterns. References: [A systematic review on
    the integration of explainable AI in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Process execution logs (command-line and PowerShell) on all Windows endpoints and servers. Network
    traffic logs at egress points (proxies, firewalls) to correlate download commands observed in command-line
    arguments.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'cmds = command_lines(processes touching exclusion_paths)

      X = TfidfVectorizer().fit_transform(cmds)

      labels = DBSCAN().fit_predict(X)

      for cluster not in known_benign_clusters: alert with top3_tokens(cluster)

      retrain periodically to track benign drift'
- question: Was an executable or script created in an exclusion path that is unsigned (or not signed by
    an allow-listed publisher) or carries a file extension never previously seen in that directory?
  context: 'A trustworthy directory added to an exclusion list should only hold predictable, signed content;
    an unsigned executable/script or a never-before-seen extension there is a strong sign of hidden tooling.
    Enrich every file write (Event ID 4663) and execution (Event ID 4688) in an exclusion path with file
    properties and raise a high-severity alert for any executable/script (.exe, .dll, .ps1, .bat, .scr,
    .js) created in an exclusion path that is not signed by an allow-listed publisher, or whose extension
    has never previously appeared in that directory. Prioritize the over-broad data/role paths flagged
    as risky and derive the path list from the documented exclusion configuration. This is a direct, defensible
    Stealth-tactic detection of artifact hiding. References: [Common mistakes to avoid when defining exclusions](https://learn.microsoft.com/en-us/defender-endpoint/common-exclusion-mistakes-microsoft-defender-antivirus);
    [Configure custom exclusions for Microsoft Defender Antivirus](https://learn.microsoft.com/en-us/defender-endpoint/configure-exclusions-microsoft-defender-antivirus).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: File systems on Windows endpoints and servers, particularly application directories commonly
    added to exclusion lists (e.g., database folders, development toolchains, source code repositories)
    and user profile directories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from (EventID=4663 OR EventID=4688) where TargetFilename in exclusion_paths\n| enrich signer_status,\
      \ extension\n| where extension in [.exe,.dll,.ps1,.bat,.scr,.js]\n    AND (signer not in allowlist\
      \ OR extension not in seen_extensions[path])\n| alert severity=high (prioritize over-broad/role\
      \ paths)"
- question: Do file properties (entropy, size, extension mix, parent process) of writes into an exclusion
    directory deviate statistically from that directory's 30-day baseline, including denied-write attempts?
  context: 'Packed or obfuscated payloads and atypical writers stand out statistically even inside trusted
    exclusion directories. For each exclusion directory, baseline over 30 days the distribution of file
    extensions, Shannon entropy, and file size, and the set of parent processes; alert on statistical
    outliers (e.g., entropy >7.5 where p95~6.0, a .bat in a path that has never held one, or a file far
    above the directory''s size norm). Entropy/character-frequency separability between benign and packed
    artifacts is well established. Also profile the failure signal - denied-write attempts into the path
    - as a distinct rare feature, since adversaries probe before succeeding. This statistical layer reinforces
    the Stealth-tactic hunt for hidden artifacts. References: [Revoke-Obfuscation, Bohannon and Holmes](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: File systems on Windows endpoints and servers, particularly application directories commonly
    added to exclusion lists (e.g., database folders, development toolchains, source code repositories)
    and user profile directories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from EventID=4663 where TargetFilename in exclusion_paths

      | eval ent=shannon_entropy(file), sz=size, ext=extension, pp=parent_proc

      | eventstats perc95(ent) as p95e, mean(sz) as mu_s, stdev(sz) as sd_s, set(ext) as seen_ext, set(pp)
      as seen_pp by path (window=30d)

      | where ent>7.5 OR ext not in seen_ext OR sz>mu_s+3*sd_s OR pp not in seen_pp | alert

      | append [ where access_status=''denied'' | stats count as denied by host,path | where denied rare
      ]'
- question: Does a one-class model trained on legitimate files in high-value exclusion paths flag a new
    file as outside the learned benign distribution?
  context: 'When labeled malware is scarce, modeling only what ''normal'' looks like in a high-value exclusion
    path is an effective way to catch hidden artifacts. Train a one-class model (One-Class SVM or Isolation
    Forest/autoencoder) on the features of legitimate files in high-value exclusion paths (entropy, size,
    extension, parent process, signer status) and flag files outside the learned benign distribution.
    Surface the top-3 contributing features in each alert to make results explainable and actionable.
    This supports the Stealth PIR by identifying anomalous files even when no signature or IOC exists.
    References: [Malware Detection for Internet of Things Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/);
    [Robust IoT security using isolation forest and one class SVM algorithms](https://www.nature.com/articles/s41598-025-20445-4);
    [A systematic review on the integration of explainable AI in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: File systems on Windows endpoints and servers, particularly application directories commonly
    added to exclusion lists (e.g., database folders, development toolchains, source code repositories)
    and user profile directories.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X_benign = features(legit_files in high_value_exclusion_paths)  # entropy,size,ext,parent,signer\n\
      model = OneClassSVM/IsolationForest/Autoencoder.fit(X_benign)\nfor f in new file writes in exclusion_paths:\n\
      \  if model.predict(features(f)) == outlier: alert with top3_features(f)"
- question: Did a process download a file from an external source and then (the same or a child process)
    write a file into a known exclusion path within ~5 minutes?
  context: 'A tight download-then-stage sequence into an exclusion path is a classic payload-delivery-and-hide
    pattern under the Stealth tactic. In the SIEM, trigger when a process (by PID in Event ID 4688) makes
    an external network connection (Zeek conn.log) and a subsequent file write (Event ID 4663) into a
    known exclusion path occurs within a 5-minute window. Raise severity when the downloaded MIME type
    (Zeek files.log) is an executable/script, the destination is a low-reputation IP, or the write lands
    in an over-broad exclusion. Derive the exclusion path list from the documented configuration. A positive
    result strongly indicates remote payload retrieval staged into a hidden location. References: [Common
    mistakes to avoid when defining exclusions](https://learn.microsoft.com/en-us/defender-endpoint/common-exclusion-mistakes-microsoft-defender-antivirus);
    [Configure custom exclusions for Microsoft Defender Antivirus](https://learn.microsoft.com/en-us/defender-endpoint/configure-exclusions-microsoft-defender-antivirus).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: Network egress points (e.g., firewalls, web proxies), DNS servers, and endpoint file systems.
    Correlation requires access to both network logs (Zeek) and endpoint logs (Windows Event IDs).'
  range: 'Last 90 days (event-centered: +/- 5 minutes around each external download)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'down = join(EventID=4688 process, Zeek conn.log external_conn) by host,pid,time

      write = EventID=4663 where TargetFilename in exclusion_paths

      | correlate down -> write where same(process or child) AND write.time-down.time <= 5m

      | eval mime = lookup(Zeek files.log, conn)

      | if mime in [exe,script] OR dest_ip low_reputation OR path over_broad: severity=high'
- question: For each download-then-write-to-exclusion chain, how rare is the source IP/ASN/country, and
    are there associated failure signals (HTTP 404, DNS NXDOMAIN, blocked/RST connections)?
  context: 'Staging downloads frequently originate from rarely-seen infrastructure and are often preceded
    by failed retrieval attempts. For all ''download-then-write-to-exclusion'' chains, score the source
    IP''s ASN/country rarity from Zeek conn.log (bottom 5th percentile of historical download frequency
    = high risk). In parallel, profile failure/state signals around the chain - HTTP 404s, DNS NXDOMAIN,
    and blocked/RST connections from the same host - as distinct features, since staging often follows
    failed retrievals. An Isolation Forest can score the combined feature vector. Under the Stealth tactic
    this prioritizes chains most likely to represent adversary tooling pulled from uncommon sources. References:
    [LOLBins Abuse, Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/); [Robust IoT security
    using isolation forest and one class SVM algorithms](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: Network egress points (e.g., firewalls, web proxies), DNS servers, and endpoint file systems.
    Correlation requires access to both network logs (Zeek) and endpoint logs (Windows Event IDs).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for chain in download_then_write_to_exclusion:\n  rarity = percentile_rank(src_ip.ASN/country\
      \ download_freq history)  # bottom 5% = high risk\n  fails = count(http_404, dns_nxdomain, conn_RST/blocked)\
      \ by same host near chain\n  X = [rarity, fails]; score = IsolationForest.score(X)\n  if rarity<=5pct\
      \ OR score anomalous: alert"
- question: Is the hourly volume of correlated 'download-then-write-to-exclusion' events deviating from
    its forecast, indicating mass tool deployment?
  context: 'A coordinated campaign or mass tool deployment shows up as an abnormal spike in the rate of
    correlated download-and-stage events. Apply a time-series model (ARIMA or LSTM) to the hourly count
    of correlated ''download-then-write-to-exclusion'' events; train on >=30 days and alert when observed
    volume deviates from forecast. Include the forecast-vs-observed delta and the dominant contributing
    hosts/paths in the alert. This supports the Stealth PIR by detecting broad, simultaneous exclusion
    abuse that per-host rules might individually under-weight. References: [DeepLog, Du et al](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: Network egress points (e.g., firewalls, web proxies), DNS servers, and endpoint file systems.
    Correlation requires access to both network logs (Zeek) and endpoint logs (Windows Event IDs).'
  range: Last 90 days (hourly aggregation; >=30 days training window)
  queries:
  - technology: ML/pseudocode
    query: "ts = hourly_count(correlated download_then_write_to_exclusion events)\nmodel = ARIMA/LSTM.fit(ts[>=30d])\n\
      forecast = model.predict(next_hour)\nif observed - forecast > anomaly_threshold:\n  alert with delta=observed-forecast,\
      \ top_hosts, top_paths"
- question: Did a host or user session perform exclusion discovery (e.g., query AV exclusion registry
    keys / Get-MpPreference) and then write or execute a file in a discovered or default exclusion path
    within 60 minutes?
  context: 'Pairing reconnaissance of exclusions with a subsequent write into an excluded path is a high-confidence
    T1564.012 sequence. Implement a stateful SIEM rule: when a host runs a known exclusion-discovery command
    (reg query on an exclusion key or Get-MpPreference in Event ID 4688/4104), place it in a ''Discovery''
    state for 60 minutes; if within that window a file is written to any exclusion path (Event ID 4663)
    by the same user or a descendant process, raise a high-severity alert. This directly answers the Stealth
    PIR by linking intent (discovery) to action (staging) in a single chain. References: [Suspicious Windows
