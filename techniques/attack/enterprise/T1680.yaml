name: 'T1680: Local Storage Discovery'
id: 3f9e64ca-4b34-4958-bf5e-3f83172fd973
description: This playbook helps an analyst determine whether an adversary has enumerated local drives,
  disks, volumes, and their attributes (total/free space, volume serial numbers, mount paths, filesystem
  types) as reconnaissance for ransomware-related encryption, data staging, Direct Volume Access, or lateral
  movement (MITRE ATT&CK T1680, Discovery / TA0007). It addresses three complementary evidence classes.
  First, host command telemetry that shows deliberate local storage enumeration across platforms - Windows
  (`wmic logicaldisk get`, `Get-PSDrive`, `Get-WmiObject/Get-CimInstance Win32_LogicalDisk`, `diskpart
  list disk/volume`, `fsutil fsinfo drives`), Linux (`lsblk`, `fdisk -l`, `parted -l`, `lshw -class disk`,
  `df`), macOS (`diskutil list`, `system_profiler SPStorageDataType`), and ESXi (`esxcli storage *`, `vim-cmd
  vmsvc/getallvms`) - including bundled host-survey tools such as Seatbelt, obfuscated/encoded command
  lines, and rare-command sequences. Second, file-access telemetry showing repeated reads of physical-drive/volume
  objects (`\\.\PhysicalDrive*`, `\Device\HarddiskVolume*`) or sensitive directory trees, especially when
  correlated with concurrent SMB metadata/share probing. Third, network telemetry showing atypical bursts
  of SMB/CIFS sessions to many internal destinations, consistent with remote discovery of file systems,
  shares, and storage-hosting systems. Each question pairs a symbolic-logic, statistical, or machine-learning
  method with concrete pseudocode so a SOC analyst can confirm or refute local storage discovery and the
  transition from local recon toward staging, ransomware impact, or lateral movement.
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Has any host executed known storage- or volume-enumeration commands - Windows `wmic logicaldisk
    get`, `Get-PSDrive`, `Get-WmiObject/Get-CimInstance Win32_LogicalDisk`, `diskpart list disk/volume`,
    `fsutil fsinfo drives`; Linux `lsblk`, `fdisk -l`, `parted -l`, `lshw -class disk`, `df`; macOS `diskutil
    list`, `system_profiler SPStorageDataType`; or ESXi `esxcli storage *` / `vim-cmd vmsvc/getallvms`
    - especially three or more distinct utilities or a full sweep of mounted volumes within 60 seconds,
    by a non-admin user, or spawned by an unusual parent process?
  context: 'This is the deterministic floor for T1680. Match the known storage/volume enumeration command
    families across platforms on first-party process telemetry (Windows 4688/4104, Sysmon 1, auditd EXECVE,
    macOS unified log, ESXi shell) using argv[0]/PATH selection and argument allow/deny lists. Adversaries
    run these to map drives, free space, and serial numbers before ransomware encryption, staging, or
    movement decisions. Raise an alert when >=3 distinct storage utilities are used OR all mounted volumes
    are enumerated within 60 seconds by one session, or when the commands run under a non-admin user,
    from a remote session, or from non-standard parents (for example w3wp, wmiprvse, or shells spawned
    by Office). A burst of disk-survey commands from an interactive or injected process is a positive
    result; a single inventory command from a known administration script is benign. Keep these thresholds
    as a non-deletable floor. References: [System Information Discovery - Auditd](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/lnx_auditd_system_info_discovery.yml),
    [Suspicious Windows Command Shell Arguments](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/),
    and [CAR-2016-03-001 Host Discovery Commands](https://car.mitre.org/analytics/CAR-2016-03-001/).'
  answer_sources: &id001
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Linux auditd logs
  - macOS Unified Logs (process execution)
  - ESXi shell command logs
  - 'NAI: All Windows hosts and ESXi management consoles where local drive metadata carries high value
    for staging and ransomware activities.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=edr (EventCode=4688 OR EventCode=4104 OR sysmon_id=1 OR source=auditd:EXECVE OR source=macos:unifiedlog
      OR source=esxi:hostd)

      | eval cmd=lower(CommandLine)

      | where match(cmd,"logicaldisk|get-psdrive|win32_logicaldisk|diskpart|fsutil fsinfo drives|lsblk|fdisk
      -l|parted -l|lshw -class disk|\bdf\b|diskutil list|spstoragedatatype|esxcli storage|vmsvc/getallvms")

      | bin _time span=60s

      | stats dc(util) as utils, values(util) as which, values(volume) as vols by host, session, user,
      ParentImage, _time

      | where utils>=3 OR all_volumes_enumerated=true OR user_is_admin=false OR ParentImage IN ("w3wp.exe","wmiprvse.exe","winword.exe","excel.exe")

      | table _time, host, user, ParentImage, which, utils'
- question: Did any process match a host-survey/recon tool signature that bundles volume enumeration -
    for example GhostPack Seatbelt - identified by image name, OriginalFileName, or characteristic module
    arguments, regardless of the user account that launched it?
  context: 'Beyond hand-typed commands, adversaries deploy host-survey toolkits (such as GhostPack Seatbelt)
    that include volume/disk enumeration as one of many recon modules. Match these tool signatures on
    process-creation telemetry using image name, OriginalFileName/internal name (which survives renaming),
    and characteristic module arguments. Because a legitimate user has essentially no reason to run these
    offensive tools, treat any match as high-confidence T1680 reconnaissance regardless of user role or
    privilege. A signature hit is a strong positive; the only benign explanation is a sanctioned red-team
    exercise, which should be deconflicted. Reference: [PUA - Seatbelt Execution](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_pua_seatbelt.yml).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=edr (EventCode=4688 OR sysmon_id=1)

      | eval oname=lower(OriginalFileName), img=lower(Image), cl=lower(CommandLine)

      | where match(oname,"seatbelt") OR match(img,"seatbelt") OR match(cl,"seatbelt|-group=system|nonstandardprocesses|logonsessions")

      | eval severity="high"

      | table _time, host, user, Image, OriginalFileName, CommandLine'
- question: For each host-role and user-role, is the rate of storage-discovery commands per minute, the
    number of distinct volumes/drives enumerated per session, or the ratio of access-denied/failed enumerations
    to successes above the rolling 99th-percentile or three-sigma baseline - particularly a low-success,
    high-attempt pattern?
  context: 'Build rolling per-(host-role, user-role) baselines of three physics metrics: Frequency (storage-discovery
    commands per minute), Volume (distinct volumes/drives enumerated per session), and State (ratio of
    access-denied/failed enumerations to successes). Derive thresholds per dataset from 30 days of history
    and alert on 99th-percentile or three-sigma bursts. A normally-quiet workstation that suddenly issues
    a flurry of disk-survey commands, or that probes many volumes with many failures, is consistent with
    reconnaissance rather than routine inventory. Profile failed/denied enumerations as a distinct signal
    - a low-success, high-attempt pattern often indicates an adversary probing for accessible storage.
    Steady, expected admin/inventory activity is the benign baseline. For command-line obfuscation, also
    apply a per-environment Shannon-entropy cutoff. For the command-line obfuscation entropy cutoff, see
    [High Command Line Entropy](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr storage_discovery=true

      | bin _time span=1m

      | stats count as freq, dc(volume) as vols, count(eval(status="denied")) as denied, count(eval(status="ok"))
      as ok by host_role, user_role, host, session, _time

      | eval deny_ratio=denied/(ok+1)

      | eventstats avg(freq) as mu_f, stdev(freq) as sd_f, perc99(vols) as p99_v by host_role, user_role

      | where freq>mu_f+3*sd_f OR vols>p99_v OR deny_ratio>0.5

      | table _time, host, user_role, freq, vols, deny_ratio'
- question: Do any storage-discovery command lines score as obfuscated using interpretable features (length,
    entropy, special-character ratio, token count), indicating an encoded or disguised attempt to enumerate
    drives that the literal-string match would miss?
  context: 'Adversaries encode or obfuscate commands (Base64 PowerShell, caret/quote insertion, environment-variable
    substitution) to evade literal-string detection. Score command-line strings with interpretable features
    - length, Shannon entropy, special-character ratio, and token count - and surface the top-3 contributing
    features in the alert so an analyst can see why it scored high. This complements the deterministic
    match so encoded or disguised storage-enumeration commands (for example an obfuscated `Get-PSDrive`
    or `Win32_LogicalDisk` invocation) are not missed. A high obfuscation score on a command that decodes
    to a storage query is a strong positive; legitimate but long automation command lines should be baselined
    out. Reference: [Obfuscated Command Line Detection Using Machine Learning, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr (EventCode=4688 OR EventCode=4104 OR sysmon_id=1)

      | eval len=len(CommandLine), ent=shannon(CommandLine), spc=special_char_ratio(CommandLine), toks=token_count(CommandLine)

      | eval obf_score=score(len,ent,spc,toks)

      | where obf_score>threshold AND (decoded_cmd matches storage_enum_families)

      | table _time, host, user, CommandLine, obf_score, top3_features'
- question: Does a rare-command or sequence-anomaly model (BERT-style command-line embeddings, a small-LM
    obfuscation detector, a PowerShell DNN classifier, or DeepLog/DeepCASE sequence scoring) flag storage-enumeration
    activity as anomalous - especially when the enumeration precedes file staging, SMB probing, or archive
    creation?
  context: 'Run explainable ML in parallel with the deterministic floor. Use BERT-style command-line embeddings
    with nearest-neighbor explanation to find rare commands, a small-LM detector for obfuscation, and
    a PowerShell text classifier for constructs like `Get-PSDrive`/`Win32_LogicalDisk`; every model alert
    must list the top-3 contributing tokens/features. Then score the sequence of process/log events with
    DeepLog and triage with attention-based DeepCASE to capture context. The highest-priority cases are
    those where storage enumeration is immediately followed by file staging, SMB share probing, or archive
    creation - the recon-then-act pattern that precedes ransomware or exfiltration. A low-probability
    command or sequence with a meaningful explanation is a positive; common admin commands score low and
    are benign. References: [CrowdStrike BERT command-line anomaly detection](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/),
    [Command-line Obfuscation Detection using SLMs](https://arxiv.org/abs/2408.02637), [Detecting Malicious
    PowerShell Commands using DNNs](https://arxiv.org/abs/1804.04177), [DeepLog](https://doi.org/10.1145/3133956.3134015),
    and [DeepCASE](https://research.utwente.nl/en/publications/deepcase-semi-supervised-contextual-analysis-of-security-events).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "emb = bert_cmdline.embed(CommandLine)\nif rare_nn(emb).distance > tau OR ps_dnn.predict_proba(CommandLine)\
      \ > 0.8 OR slm_obf.is_obfuscated(CommandLine):\n    seq = order_by_time(host_events)\n    if deeplog.anomaly(seq)\
      \ and followed_by(seq, [\"file_staging\",\"smb_probe\",\"archive_create\"]):\n        alert(top3=explain(emb),\
      \ context=deepcase.triage(seq))"
- question: Did a host/account that ran local storage-discovery commands then, within a short window,
    initiate SMB share enumeration and remote-connection fan-out to many internal destinations - the transition
    from local recon to lateral discovery?
  context: 'The dangerous pivot is when local storage reconnaissance is followed by outbound discovery.
    Correlate local storage-discovery commands with near-time SMB share enumeration and remote-connection
    fan-out from the same host/account, and score rare login/causality paths (Hopper-style) to surface
    improbable account-host traversal. This identifies the transition from local recon to lateral discovery
    that often precedes staging or ransomware deployment across shares. A storage-enumeration event chained
    to a burst of SMB connections to diverse internal hosts by the same actor is a high-confidence positive;
    isolated local enumeration with no follow-on network activity is lower risk. Reference: [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf).'
  answer_sources: *id001
  range: 'Last 90 days (event-centered: pivot on a storage-discovery event and inspect +/- 30 minutes
    of network activity)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=edr storage_discovery=true

      | join host, user [ search index=network (proto=smb OR EventCode=5145) earliest=-30m latest=+30m
      ]

      | stats dc(dest) as smb_dests, count as smb_sessions, min(disc_time) as t0 by host, user

      | where smb_dests > 10 AND smb_sessions > smb_dests

      | eval rare_path_score=hopper_score(user,host,dest)

      | table t0, host, user, smb_dests, rare_path_score'
- question: Did a non-admin process open two or more distinct physical-drive or volume objects (for example
    `\\.\PhysicalDrive*` or `\Device\HarddiskVolume*`) in one session, or did such physical-drive/volume
    reads correlate with SMB metadata/share queries (Windows 5145) within 60 seconds?
  context: Direct reads of physical-drive/volume objects are a precursor to Direct Volume Access and storage
    mapping. On first-party file-access telemetry (Windows 4663 with object names like `\Device\HarddiskVolume*`
    or `\\.\PhysicalDrive*`, auditd PATH records, macOS unified log), alert when a non-admin process opens
    >=2 distinct physical-drive/volume objects in one session, or when those reads correlate with SMB
    metadata/share queries (Windows 5145) within 60 seconds. Opening raw volume handles outside of backup
    or imaging software is unusual and suggests an adversary mapping storage before staging or bypassing
    file-system ACLs. Multiple distinct raw-volume opens by a non-admin process is a positive; sanctioned
    backup/EDR/imaging tools are the benign baseline to allow-list. Preserve the concrete object-name
    and count thresholds as a deterministic floor.
  answer_sources: &id002
  - Windows Event ID 4663
  - Linux auditd file access logs
  - macOS unified log file access
  - Zeek conn.log
  - Zeek smb_files.log
  - Windows Event ID 5145
  - 'NAI: Endpoints, file servers, and network chokepoints (SMB/CIFS sensors) where access to physical
    or logical volumes can lead to further discovery or staging behavior.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=edr (EventCode=4663 OR source=auditd:PATH OR source=macos:unifiedlog)

      | where match(ObjectName,"\\\\Device\\\\HarddiskVolume|\\\\\\.\\PhysicalDrive") AND user_is_admin=false

      | bin _time span=60s

      | stats dc(ObjectName) as objs, values(ObjectName) as which by host, process, session, user, _time

      | join type=left host, _time [ search index=edr EventCode=5145 ]

      | where objs>=2 OR smb_share_query=true

      | table _time, host, user, process, which, objs'
- question: For each host, do the number of distinct volume objects read, the SMB share-query rate, or
    the failed/denied-open ratio exceed the 99th percentile - or does destination-share fan-out spike
    with low bytes transferred (enumeration rather than transfer)?
  context: 'Baseline per-host Volume (distinct volume objects read), Frequency (SMB share queries per
    minute), and State (failed/denied opens versus successes), and alert when any metric exceeds the 99th
    percentile or when destination-share fan-out spikes versus history. Treat low-bytes/high-fan-out as
    enumeration rather than data transfer. Use mismatch-count deviation from a normal per-host execution
    profile (a Sense-of-Self style anomaly) and parameter/path baselining (DeepLog) to model what is normal
    for the host. Track access-denied opens as a distinct failure signal, since adversaries probing storage
    often generate many denied attempts. A host whose volume-read and share-query counts jump above baseline
    while moving almost no data is a strong enumeration indicator; high-byte transfers to a few known
    destinations are likely benign file operations. References: [A Sense of Self for Unix Processes](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf)
    and [DeepLog](https://doi.org/10.1145/3133956.3134015).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr (EventCode=4663 OR source=zeek_smb_files OR EventCode=5145)

      | bin _time span=1m

      | stats dc(volume_obj) as vols, count(eval(action="share_query")) as shareq, count(eval(status="denied"))
      as denied, sum(bytes) as bytes, dc(dest_share) as fanout by host, _time

      | eventstats perc99(vols) as p99v, perc99(shareq) as p99q by host

      | where vols>p99v OR shareq>p99q OR (fanout>10 AND bytes<low_threshold) OR denied>denied_baseline

      | table _time, host, vols, shareq, fanout, bytes, denied'
- question: Does clustering of combined endpoint and network features (volume-read count, share-query
    count, destination diversity, bytes-per-session, timing) place a host's behavior in a sparse cluster
    or as a noise point indicative of storage-plus-SMB enumeration?
  context: 'Cluster combined endpoint+network features - volume-read count, share-query count, destination
    diversity, bytes-per-session, and timing - and investigate sparse clusters and noise points that do
    not match the bulk of normal file/SMB activity. Contextualize and triage the underlying event sequences
    with attention-based DeepCASE, emitting the top-3 features or events that drove the cluster assignment
    so an analyst understands the call. Sessions that combine many volume reads, many share queries, high
    destination diversity, and low bytes-per-session form a distinctive enumeration fingerprint that clustering
    isolates from benign bulk-transfer or single-share access. A host landing in a small dense anomaly
    cluster with that profile is a positive; mainstream clusters of routine activity are benign. Reference:
    [DeepCASE](https://research.utwente.nl/en/publications/deepcase-semi-supervised-contextual-analysis-of-security-events).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = features(volume_reads, share_queries, dest_diversity, bytes_per_session, timing) per host_session\n\
      labels = DBSCAN(eps, min_samples).fit(X)\nfor c in sparse_clusters_or_noise(labels):\n    alert(members=c,\
      \ top3=deepcase.explain(c))"
- question: Is a single source initiating many short-lived SMB sessions to a large number of diverse internal
    destinations - for example more than 20 unique SMB destinations in 5 minutes from a workstation -
    with corresponding host-firewall allow events (Windows 5156/5157)?
  context: Remote storage discovery shows up as SMB/CIFS fan-out. On Zeek conn.log/smb_files.log and host-firewall
    logs (Windows 5156 allows / 5157 blocks), detect a source initiating many short-lived SMB sessions
    to diverse internal targets and correlate with firewall allows. Alert when the unique-destination
    count and connection rate exceed policy for the source subnet/role - for example more than 20 unique
    SMB destinations in 5 minutes from a workstation, which normally talks to only a handful of file servers.
    This fan-out pattern is how adversaries discover file systems, shares, and storage-hosting systems
    before staging or ransomware spread. A workstation suddenly touching dozens of SMB endpoints is a
    positive; a server or backup host with a known broad SMB footprint is the benign baseline. Keep the
    explicit per-role threshold as a floor.
  answer_sources: &id003
  - Zeek conn.log
  - Zeek dns.log
  - Zeek smb_files.log
  - Windows Event ID 5156
  - 'NAI: Core network ingress/egress points and VPN gateways that see a majority of SMB/CIFS traffic
    and remote command-control sessions.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn.log/smb_files.log + (Win 5156/5157)

      | filter service="smb" OR id.resp_p IN (445,139)

      | bin 5m

      | stats dc(id.resp_h) as uniq_dests, count as sessions, avg(duration) as dur by id.orig_h, src_role

      | where uniq_dests > role_threshold(src_role)  # e.g. >20 for workstation

      | join firewall_allow on id.orig_h

      | table ts, id.orig_h, src_role, uniq_dests, sessions, dur'
- question: For each host class, do hourly SMB session count, bytes-per-session, unique-destination count,
    or connection success/failure ratio show three-sigma spikes - especially a low-bytes/high-fan-out
    pattern or a surge of blocked/RST/failed SMB connections?
  context: Baseline by host class the hourly SMB session count, bytes-per-session (Volume), unique-destination
    count (Frequency/diversity), and connection success/failure ratio (State), deriving thresholds from
    30 days of per-class history. Flag three-sigma spikes and the low-bytes/high-fan-out pattern that
    is characteristic of enumeration rather than legitimate transfer. Profile blocked/RST/failed SMB connections
    separately as a distinct signal, since a host scanning for reachable shares generates many failed/reset
    connections. A host class member whose SMB diversity and session count spike while bytes stay low
    - or that suddenly produces a wave of failed SMB attempts - is consistent with remote storage discovery.
    Normal, stable per-class SMB activity is the benign baseline.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=network (source=zeek_conn OR source=zeek_smb_files OR EventCode=5156 OR EventCode=5157)

      | where service="smb"

      | bin _time span=1h

      | stats count as sessions, avg(bytes) as bps, dc(dest) as uniq_dest, count(eval(state IN ("RST","blocked","failed")))
      as fails by host_class, src, _time

      | eventstats avg(sessions) as mu, stdev(sessions) as sd, avg(uniq_dest) as mu_d, stdev(uniq_dest)
      as sd_d by host_class

      | where sessions>mu+3*sd OR uniq_dest>mu_d+3*sd_d OR (uniq_dest>20 AND bps<low) OR fails>fail_baseline

      | table _time, src, host_class, sessions, uniq_dest, bps, fails'
- question: Does a temporal anomaly model of SMB session sequences, or a GNN/temporal-link-prediction
    model over the authentication/connection graph, flag cross-host expansion that follows storage discovery
    - surfacing the top contributing edges (new destination, rare account-host pair, elevated rate)?
  context: 'Model SMB session sequences and destination-expansion with a temporal anomaly model, and score
    the cross-host expansion that follows storage discovery using a graph neural network plus temporal
    link prediction on the authentication/connection graph (Euler-style); for path-level rarity use Hopper.
    This captures the structural and temporal signature of an actor spreading from an initial host across
    storage-hosting systems after local recon. Alerts must surface the top-3 contributing edges/features
    - for example a brand-new destination, a rare account-host pair, or an elevated connection rate -
    so analysts can validate the path quickly. A rapidly expanding, low-probability connection subgraph
    that emerges right after storage enumeration is a high-confidence positive; established, recurring
    SMB relationships score low and are benign. References: [Euler](https://dl.acm.org/doi/10.1145/3588771)
    and [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf).'
  answer_sources: *id003
  range: Last 90 days (event-centered on the first storage-discovery event for the actor)
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_graph(auth_and_conn_events)  # nodes=hosts/accounts, edges=SMB sessions\nscores\
      \ = euler_gnn.temporal_link_predict(G)\nfor edge in scores.anomalous(after=storage_discovery_event):\n\
      \    if hopper_path_rarity(edge.path) > tau:\n        alert(edge, top3=[edge.new_dest, edge.rare_acct_host,\
      \ edge.rate])"
