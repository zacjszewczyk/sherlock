questions:
- question: '[Resource Development] Threat feed IOC matching: Can you determine whether an inbound email
    is received where the sender''s source IP, mail-from domain, or display-name+From-address pairing
    matches adversary-established-account infrastructure: a high-confidence threat-intel IOC, an SPF fail
    / DMARC non-alignment, or a known display name paired with a never-before-seen From address. Profile
    the failure state (SPF=fail/softfail, DMARC=reject/quarantine) as a distinct signal, not just the
    match. -- specifically, using the ''Threat feed IOC matching'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary creates and
    cultivates accounts with external services (email providers, social media, code repositories, web
    services) to build credible personas they can later weaponize against your organization for phishing,
    social engineering, or to acquire infrastructure. Most of this activity occurs outside your perimeter,
    so detection leans on the moments adversary-established accounts touch your environment -- inbound
    mail, DNS lookups, web/CASB telemetry, and OSINT on impersonating personas. This evidence focuses
    on the condition that an inbound email is received where the sender''s source IP, mail-from domain,
    or display-name+From-address pairing matches adversary-established-account infrastructure: a high-confidence
    threat-intel IOC, an SPF fail / DMARC non-alignment, or a known display name paired with a never-before-seen
    From address. Profile the failure state (SPF=fail/softfail, DMARC=reject/quarantine) as a distinct
    signal, not just the match. This Symbolic Logic approach works as follows: Match Zeek conn.log source
    IP and smtp.log mail-from domain against curated CTI feeds and alert on any match. Layer the deterministic
    authentication floor in parallel: alert when SPF returns fail/softfail for the HELO/MAIL FROM identity
    ([RFC 7208 SPF](https://www.rfc-editor.org/rfc/rfc7208)) or DMARC identifier alignment fails ([RFC
    7489 DMARC](https://www.rfc-editor.org/rfc/rfc7489)), and on the ''known display name + first-seen
    From address'' impersonation predicate ([Ho et al. 2017](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable adversary-established
    account or persona engaging your organization; pivot to the sender/persona identity, the source IP/domain
    and its registration and reputation, the targeted recipients or employees being impersonated, authentication
    (SPF/DMARC) state, and any linked accounts or campaign infrastructure to scope the operation and feed
    blocklists and user awareness. A negative result helps rule out this particular vector but should
    be corroborated with the other questions in this playbook, since a single method can miss low-volume,
    well-aged, or carefully-authenticated adversary personas, and much account-establishment activity
    is only observable at later lifecycle stages such as Initial Access (Phishing).'
  answer_sources:
  - Zeek conn.log
  - Zeek smtp.log
  - 'NAI: Cloud-based Email Security Service, On-premise Mail Transfer Agent (MTA), Network Egress/Ingress
    Points (Firewalls/Proxies)'
  range: Last 90 days (correlate event-centered windows of +/- 24 hours around the sender/persona activity)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Threat feed IOC matching (Symbolic Logic)

      source IN [Zeek conn.log, Zeek smtp.log]

      | approach: Match Zeek conn.log source IP and smtp.log mail-from domain against curated CTI feeds
      and alert on any match. Layer the deterministic authentication floor in parallel: alert when SPF
      returns fail/softfail for the HELO/MAIL FROM identity ([R

      | correlate over NAI: Cloud-based Email Security Service, On-premise Mail Transfer Agent (MTA),
      Network Egress/Ingress Points (Firewalls/Proxies)

      | emit alert with contributing fields and entity context (sender/persona, source IP/domain, WHOIS
      age, SPF/DMARC result, recipients, linked accounts)'
  - technology: Zeek/pseudocode
    query: '# Threat feed IOC matching (Zeek view)

      watch smtp.log/conn.log/dns.log/http.log for inbound sender and persona activity

      | extract mailfrom domain, source IP, SNI/host, query names, SPF/DMARC results

      | evaluate against watchlists, baselines, or model per the approach above

