name: 'T1585: Establish Accounts'
id: ebf1e26a-88db-4dc5-b488-090b62d26274
description: 'This playbook helps an analyst investigate whether an adversary has established and cultivated
  accounts with external services -- email providers, social media, forums, and code repositories -- to
  build personas for use in targeting the organization (MITRE ATT&CK T1585, Establish Accounts, under
  Resource Development). Because account creation itself happens outside the perimeter, the hunt focuses
  on the points where these adversary-established accounts make contact with or impersonate the organization.
  It pursues the behavior from several complementary angles: inbound email whose source IP, mail-from
  domain, or display-name/From pairing matches known adversary infrastructure or fails SPF/DMARC; sender
  domains that are typosquats or homoglyphs of protected brands or whose WHOIS registration is freshly
  minted; low-volume, high-fan-out senders that hit many internal recipients with no replies; spikes in
  mail volume or authentication failures from free-webmail, dynamic-DNS, or disposable-email categories;
  newly discovered public personas that use corporate email or impersonate executives and administrators;
  and clusters of personas linked to a single operator by co-activity, synchronized behavior, or near-duplicate
  content. Detection methods combine deterministic symbolic-logic rules (threat-intel IOC matching, SPF/DMARC
  authentication floors, typosquat/homoglyph generation, low-volume multi-recipient rules, CASB account-creation
  alerts, co-activity linkage), statistical baselining (IOC risk and directed anomaly scoring, domain-age
  and recipient-entropy percentiles, category volume deviation, persona maturity scoring, synchronized-change
  correlation), and machine learning (CTI-informed random forests, Siamese-CNN visual-similarity detection,
  sender-graph outlier detection, isolation-forest time-series anomaly detection, bot-vs-human persona
  classification, and sockpuppet pair classifiers), applied primarily across Zeek smtp/conn/dns/http logs
  plus Windows file-access events and CASB/SWG/OSINT telemetry, so the analyst can corroborate suspected
  adversary-established accounts against sender reputation, domain registration, authentication state,
  persona authenticity, and operator linkage.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
