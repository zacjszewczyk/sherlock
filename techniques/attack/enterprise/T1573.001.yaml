name: 'T1573.001: Symmetric Cryptography'
id: 783bb36b-3946-432e-8a4f-cc4b787b685f
description: 'This playbook helps an analyst investigate whether an adversary is concealing command and
  control (C2) traffic with a known symmetric encryption algorithm (e.g., AES, DES, 3DES, Blowfish, RC4)
  rather than relying on a protocol''s inherent protections, across ESXi, Linux, macOS, Network Devices,
  and Windows. Because symmetric C2 uses the same key to encrypt and decrypt and is frequently rolled
  by the implant itself, the resulting traffic tends to lack a legitimate TLS handshake or key exchange,
  carries high-entropy payloads, and is often emitted by processes or service daemons that do not normally
  perform cryptographic operations. It guides the analyst across several complementary angles: correlating
  outbound connections and DNS queries against curated threat-intelligence feeds of symmetric-encryption
  C2 infrastructure (enriched with JA3/JA4 implant fingerprints); identifying suspicious processes launched
  from non-standard directories or matching malicious hashes that then beacon out; detecting protocol
  mismatches such as encrypted, high-entropy traffic on port 443/80 with no valid TLS handshake; spotting
  periodic ''heartbeat'' beaconing with consistent timing and anomalous byte ratios; and fusing process,
  network, entropy, and beaconing signals into composite scoring and outlier models. Detection methods
  combine symbolic-logic rules, statistical baselining/forecasting, and machine-learning models applied
  to Zeek conn/dns/ssl/files logs, NetFlow/IPFIX, Windows Event ID 4688, auditd, macOS unified logs, and
  ESXi service logs, so the analyst can corroborate suspected symmetric-cryptography C2 against endpoint
  execution, network fingerprints, payload entropy, and timing behavior.'
type: technique
