questions:
- question: '[Command and Control] Prospective symmetric C2 correlation: Can you determine whether a network
    connection is established from an internal host to an external IP address or domain that is present
    on a threat intelligence feed and tagged as C2 infrastructure known to use symmetric encryption. --
    specifically, using the ''Prospective symmetric C2 correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary employs a known
    symmetric encryption algorithm (AES, DES, 3DES, Blowfish, RC4) to conceal command and control traffic,
    so the channel evades protocol-based inspection and presents as high-entropy data without a legitimate
    key exchange. This evidence focuses on the condition that a network connection is established from
    an internal host to an external IP address or domain that is present on a threat intelligence feed
    and tagged as C2 infrastructure known to use symmetric encryption. This Symbolic Logic approach works
    as follows: Ingest a curated CTI feed of symmetric-encryption C2 IPs/domains and correlate Zeek conn.log
    destination IPs and Zeek dns.log queried domains to raise alerts when matches occur. Enrich with TLS-stack
    identity by computing JA3 ([JA3 TLS Client Fingerprinting](https://github.com/salesforce/ja3)) and
    version-resilient JA4 ([JA4+ Network Fingerprinting Suite](https://github.com/FoxIO-LLC/ja4)) fingerprints
    and matching against known implant hashes (e.g., Cobalt Strike/Meterpreter), since these persist independent
    of destination IP/SNI. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable symmetric-cryptography C2: pivot to the responsible host and process, its parent lineage
    and loaded crypto libraries, the destination IP/domain and its reputation, the timing/beaconing profile,
    and any concurrent high-entropy or protocol-mismatched flows to scope the channel and any data staged
    for exfiltration. A negative result helps reduce the likelihood of this particular encrypted-channel
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss low-and-slow, jittered, or destination-rotating C2.'
