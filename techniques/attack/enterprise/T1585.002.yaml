name: 'T1585.002: Email Accounts'
id: 8db3a947-7413-4bd6-bc44-a4fadb71121b
description: >-
  This playbook helps an analyst investigate whether an adversary has acquired or created email accounts
  to support targeting (MITRE ATT&CK T1585.002, Email Accounts). Adversaries establish accounts with email
  providers -- free webmail, disposable/temporary services, or attacker-registered lookalike domains --
  to conduct phishing and phishing for information, cultivate personas, abuse free trials, and acquire
  follow-on infrastructure such as domains. Because most of this activity occurs outside the target's
  visibility, the hunt centers on the point where adversary-controlled email and its supporting infrastructure
  touch the organization, pursued from several complementary angles: inbound mail that fails SPF/DKIM/DMARC
  alignment or matches threat-intel indicators; typosquat/combosquat and visually-confusable lookalike
  sender domains; newly-registered domains sending anomalous volume to executives and sensitive roles;
  internal hosts (especially servers) contacting disposable-email infrastructure; and free-provider mail
  whose headers, composition, and language deviate from legitimate business communication. Detection methods
  combine deterministic symbolic-logic rules (authentication-floor enforcement, CTI matching, typosquat
  watchlists, WHOIS-age and disposable-provider blocklists, free-provider header analysis), statistical
  baselining (authentication failure-rate and reputation profiling, Damerau-Levenshtein/entropy similarity
  scoring, NXDOMAIN/failure profiling, directed anomaly scoring, recipient-count and business-language
  anomaly scoring, sender behavioral baselines), and machine learning (Random Forest email classifiers,
  Siamese-CNN homoglyph detection, ARIMA/LSTM volume forecasting, DBSCAN connection clustering, transformer/LLM
  persona classifiers, and internal-log lateral-phishing classifiers), applied across Zeek smtp/dns/http/files/conn
  logs, email gateway authentication results, threat-intel and domain-registration feeds, web proxy, and
  DNS resolver telemetry, so the analyst can corroborate suspected adversary email accounts against authentication
  verdicts, domain age and similarity, recipient targeting, and network behavior.
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
