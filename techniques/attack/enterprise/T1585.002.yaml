questions:
- question: >-
    [Resource Development] Enforce SPF/DKIM/DMARC authentication floor: Can you determine whether an inbound
    email fails sender authentication or matches a high-confidence threat-intel indicator: the message
    fails SPF/DMARC alignment, the sender address/domain/link/attachment hash matches a known-malicious
    feed, or the From domain is otherwise untrusted — all consistent with an adversary-established email
    account. -- specifically, using the 'Enforce SPF/DKIM/DMARC authentication floor' (Symbolic Logic)
    approach?
  context: >-
    Why this matters: Under the Resource Development tactic (TA0042), an adversary establishes email accounts
    with email providers (free, disposable, or attacker-registered lookalike domains) to support targeting
    -- for phishing, phishing for information, persona cultivation, or acquiring follow-on infrastructure
    such as domains and free-trial services. Much of this account creation happens outside the target's
    visibility, so detection focuses on the moment that adversary-controlled email touches the organization.
    This evidence focuses on the condition that an inbound email fails sender authentication or matches
    a high-confidence threat-intel indicator: the message fails SPF/DMARC alignment, the sender address/domain/link/attachment
    hash matches a known-malicious feed, or the From domain is otherwise untrusted — all consistent with
    an adversary-established email account. This Symbolic Logic approach works as follows: Parse Email
    Gateway authentication-results and Zeek smtp.log; deterministically alert on any inbound mail with
    dmarc=fail, spf=fail, or RFC5322.From-vs-authenticated-domain misalignment per [DMARC RFC 7489](https://www.rfc-editor.org/rfc/rfc7489)
    and [SPF RFC 7208](https://www.rfc-editor.org/rfc/rfc7208). Never delete these rules; they are the
    floor of determinism for spoofed/established-account mail. A positive result -- a deterministic rule
    match, a statistical outlier, or a model alert -- indicates probable contact from an adversary-established
    email account or its supporting infrastructure; pivot to the sender domain and its registration/WHOIS
    age, the authentication verdicts (SPF/DKIM/DMARC), the recipients (especially executives and sensitive
    roles), any links or attachments, and correlated DNS/web activity to scope the campaign and feed blocklists.
    A negative result helps rule out this particular vector but should be corroborated with the other
    questions in this playbook, since a single method can miss novel domains, authentication-passing impersonation,
    visually-confusable lookalikes, or low-and-slow account churn.
  answer_sources:
  - Zeek smtp.log
  - Zeek http.log
  - Zeek files.log
  - Email Gateway Authentication Results
  - Threat Intelligence Feeds
  - 'NAI: Email Gateway, Web Proxy, DNS Resolver, Network Egress Points'
  range: Last 90 days (correlate event-centered windows around the message/connection)
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      # Enforce SPF/DKIM/DMARC authentication floor (Symbolic Logic)

      source IN [Zeek smtp.log, Zeek http.log, Zeek files.log, Email Gateway Authentication Results, Threat
      Intelligence Feeds]

      | approach: Parse Email Gateway authentication-results and Zeek smtp.log; deterministically alert
      on any inbound mail with dmarc=fail, spf=fail, or RFC5322.From-vs-authenticated-domain misalignment
      per [DMARC RFC 7489](https://www.rfc-editor.org/rfc/rfc7489) and [SPF RFC 7208](https://www.rfc-editor.org/rfc/rfc7208)

      | correlate over NAI: Email Gateway, Web Proxy, DNS Resolver, Network Egress Points

      | emit alert with contributing fields and entity context (sender domain, From/Reply-To, auth verdicts,
      WHOIS age, recipients, links/attachments, host)
  - technology: Zeek/pseudocode
    query: >-
      # Enforce SPF/DKIM/DMARC authentication floor (Zeek view)

      watch smtp.log/dns.log/http.log/files.log/conn.log for adversary email infrastructure

      | filter sender domains, lookalike/typosquat domains, disposable/free providers per the watchlist

      | evaluate auth alignment, domain age/similarity, recipient counts, byte/volume anomalies

      | emit candidate events with domain, recipients, auth verdicts, and matched indicator
