    defense evasion, and lateral movement. This evidence focuses on the condition that a legitimate, auto-elevating
    Windows binary (e.g., `eventvwr.exe`, `sdclt.exe`, `fodhelper.exe`) is executed with an anomalous
    parent process (e.g., `winword.exe`, `powershell.exe`, `outlook.exe`) or with unusual command-line
    arguments, indicating a hijack attempt to inherit elevated privileges. This Symbolic Logic approach
    works as follows: Alert when a known auto-elevating binary (`eventvwr.exe`,`fodhelper.exe`,`sdclt.exe`,`computerdefaults.exe`,`slui.exe`,`wsreset.exe`,`cmstp.exe`)
    is spawned by a parent NOT on an approved list (`explorer.exe`,`svchost.exe`,`services.exe`,`userinit.exe`),
    or conversely when one of these auto-elevators parents a non-canonical child (e.g., eventvwr.exe ->
    anything other than `mmc.exe`), per the [Sigma UAC-bypass-via-eventvwr rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_uac_bypass_eventvwr.yml)
    and [Elastic Unusual Parent-Child](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/).
    Match command lines against known UACME invocation patterns (dism, cmstp /au, sdclt) catalogued in
    [UACMe](https://github.com/hfiref0x/UACME). A positive result -- a rule match, statistical outlier,
    or model alert -- is consistent with a UAC bypass or its downstream abuse and should be triaged by
    pivoting to the responsible process, its command line, the full parent/child lineage, the user and
    integrity level, the modified registry keys, and any follow-on elevated activity. A negative result
    helps reduce suspicion for this particular vector but should be corroborated with the other questions
    in this playbook, since a single method can miss obfuscated, renamed, or living-off-the-land bypass
    variants across the 70+ techniques catalogued in UACMe.'
