- question: '[Privilege Escalation] Auto-Elevating Parent Mismatch Rule: Can you determine whether a legitimate,
    auto-elevating Windows binary (e.g., `eventvwr.exe`, `sdclt.exe`, `fodhelper.exe`) is executed with
    an anomalous parent process (e.g., `winword.exe`, `powershell.exe`, `outlook.exe`) or with unusual
    command-line arguments, indicating a hijack attempt to inherit elevated privileges. -- specifically,
    using the ''Auto-Elevating Parent Mismatch Rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Privilege Escalation tactic (TA0004), the mission question is:
    Has the adversary escalated privileges using UAC bypass techniques? An adversary who bypasses Windows
    User Account Control (UAC) can elevate a process from medium to high integrity without triggering
