questions:
- question: '[Privilege Escalation] HKCU Bypass Registry Watchlist: Can you determine whether an unauthorized
    or anomalous modification is made to a registry key within the HKEY_CURRENT_USER (HKCU) hive, specifically
    targeting keys used by auto-elevating processes, such as `eventvwr.exe`, `sdclt.exe`, or `fodhelper.exe`,
    for the purpose of command hijacking to execute arbitrary code from a user-writable location. -- specifically,
    using the ''HKCU Bypass Registry Watchlist'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Privilege Escalation tactic (TA0004), the mission question is:
    Has the adversary escalated privileges using UAC bypass techniques? An adversary who bypasses Windows
    User Account Control (UAC) can elevate a process from medium to high integrity without triggering
    the consent prompt, gaining administrator-level control that enables persistence, credential theft,
    defense evasion, and lateral movement. This evidence focuses on the condition that an unauthorized
    or anomalous modification is made to a registry key within the HKEY_CURRENT_USER (HKCU) hive, specifically
    targeting keys used by auto-elevating processes, such as `eventvwr.exe`, `sdclt.exe`, or `fodhelper.exe`,
    for the purpose of command hijacking to execute arbitrary code from a user-writable location. This
    Symbolic Logic approach works as follows: Maintain a watchlist of HKCU command keys abused for UAC
    bypass and enumerated in the [UACMe catalog](https://github.com/hfiref0x/UACME): `HKCU\Software\Classes\mscfile\shell\open\command`,
    `HKCU\Software\Classes\ms-settings\shell\open\command`, `HKCU\Software\Classes\exefile\shell\runas\command\isolatedCommand`,
    and Folder/App Paths variants disclosed by [enigma0x3 (eventvwr)](https://enigma0x3.net/2016/08/15/fileless-uac-bypass-using-eventvwr-exe-and-registry-hijacking/)
    and [enigma0x3 (sdclt)](https://enigma0x3.net/2017/03/17/fileless-uac-bypass-using-sdclt-exe/). Trigger
    when a registry-set event (Sysmon Event ID 13 or Windows Event ID 4657) matches a watchlist key AND
    the new value references a shell/interpreter (`powershell.exe`,`cmd.exe`,`wscript`,`mshta`,`rundll32`)
    or a user-writable path (`%APPDATA%`,`%TEMP%`,`C:\Users\Public`). These keys have no legitimate per-user
    write in most environments, so a single matching write is high fidelity. State signal: confirm whether
    the write is followed by execution of the corresponding auto-elevator (failure to fire = staged but
    unused hijack). A positive result -- a rule match, statistical outlier, or model alert -- is consistent
    with a UAC bypass or its downstream abuse and should be triaged by pivoting to the responsible process,
    its command line, the full parent/child lineage, the user and integrity level, the modified registry
    keys, and any follow-on elevated activity. A negative result helps reduce suspicion for this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss obfuscated, renamed, or living-off-the-land bypass variants across the 70+ techniques catalogued
    in UACMe.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: User Workstations, Administrative Workstations, Windows Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "watchlist = [HKCU\\Software\\Classes\\mscfile\\shell\\open\\command, ms-settings\\shell\\\
      open\\command, exefile\\shell\\runas\\command\\isolatedCommand, Folder/AppPaths variants]\nALERT\
      \ WHEN (Sysmon EID 13 OR WinEvent 4657) AND TargetObject IN watchlist\n  AND (NewValue MATCHES /powershell|cmd|wscript|mshta|rundll32/\
      \ OR NewValue MATCHES /%APPDATA%|%TEMP%|C:\\\\Users\\\\Public/)\nTHEN raise high-fidelity; pivot\
      \ to check execution of corresponding auto-elevator"
- question: '[Privilege Escalation] HKCU Write Frequency & Entropy Baseline: Can you determine whether
    an unauthorized or anomalous modification is made to a registry key within the HKEY_CURRENT_USER (HKCU)
    hive, specifically targeting keys used by auto-elevating processes, such as `eventvwr.exe`, `sdclt.exe`,
    or `fodhelper.exe`, for the purpose of command hijacking to execute arbitrary code from a user-writable
    location. -- specifically, using the ''HKCU Write Frequency & Entropy Baseline'' (Statistical Method)
    approach?'
  context: 'Why this matters: Under the Privilege Escalation tactic (TA0004), the mission question is:
    Has the adversary escalated privileges using UAC bypass techniques? An adversary who bypasses Windows
    User Account Control (UAC) can elevate a process from medium to high integrity without triggering
    the consent prompt, gaining administrator-level control that enables persistence, credential theft,
    defense evasion, and lateral movement. This evidence focuses on the condition that an unauthorized
    or anomalous modification is made to a registry key within the HKEY_CURRENT_USER (HKCU) hive, specifically
    targeting keys used by auto-elevating processes, such as `eventvwr.exe`, `sdclt.exe`, or `fodhelper.exe`,
    for the purpose of command hijacking to execute arbitrary code from a user-writable location. This
    Statistical Method approach works as follows: Following the per-host/per-user log-baselining approach
    of [Beehive](https://doi.org/10.1145/2523649.2523670), establish a 30-day baseline of registry-modification
    volume in the HKCU\Software\Classes hive per user and host. Alert when the count of writes to sensitive
    command keys in a 5-minute window exceeds the user/host mean by >3 standard deviations (Frequency),
    or when daily volume crosses the 99th percentile. Compute Shannon entropy of each new value and alert
    when it exceeds the 95th percentile for that key type (obfuscated/encoded commands), consistent with
    per-context entropy alerting in [Elastic High Command Line Entropy](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).
    Derive thresholds per environment from benign baselines plus emulation runs from [Atomic Red Team
    T1548.002](https://www.atomicredteam.io/atomic-red-team/atomics/T1548.002). A positive result -- a
    rule match, statistical outlier, or model alert -- is consistent with a UAC bypass or its downstream
    abuse and should be triaged by pivoting to the responsible process, its command line, the full parent/child
    lineage, the user and integrity level, the modified registry keys, and any follow-on elevated activity.
    A negative result helps reduce suspicion for this particular vector but should be corroborated with
    the other questions in this playbook, since a single method can miss obfuscated, renamed, or living-off-the-land
    bypass variants across the 70+ techniques catalogued in UACMe.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: User Workstations, Administrative Workstations, Windows Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per user,host = 30d mean,stddev of writes to HKCU\Software\Classes command keys

      ALERT WHEN writes_in_5min > mean + 3*stddev OR daily_volume > p99

      ALERT WHEN shannon_entropy(NewValue) > p95(key_type)'
