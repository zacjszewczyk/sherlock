name: 'T1548.002: Abuse Elevation Control Mechanism: Bypass User Account Control'
id: d9b0cf75-87b1-44e2-a6b5-f21399c418a1
description: 'This playbook helps an analyst investigate whether an adversary has bypassed Windows User
  Account Control (UAC) to elevate process privileges from medium to high integrity (MITRE ATT&CK T1548.002),
  a Privilege Escalation behavior that frequently precedes persistence, credential access, defense evasion,
  and lateral movement. It guides the hunt across multiple behavioral angles on Windows endpoints and
  servers: unauthorized HKCU command-key hijacks targeting auto-elevating binaries (eventvwr.exe, sdclt.exe,
  fodhelper.exe, computerdefaults.exe, slui.exe, wsreset.exe, cmstp.exe) as catalogued in UACMe; auto-elevating
  binaries spawned by anomalous parents or with UACMe-style command lines; low-integrity-to-auto-elevator-to-high-integrity
  process chains; remote network logons (Logon Type 3) by administrators that obtain high integrity without
  a local consent prompt; and the downstream abuse of the elevated context, including defense-evasion
  commands, code injection into high-integrity system processes, suspicious DLL loads, anomalous high-integrity
  file writes, and outbound C2/exfiltration. Detection methods combine symbolic-logic rules, statistical
  baselining (rarity, frequency, entropy, IQR, percentile, and failure-state signals), and machine-learning
  models (supervised classifiers, clustering, sequence/HMM/RNN models, provenance-graph matching, and
  isolation-forest/one-class anomaly detection with explainable top-feature attribution) applied to Windows
  Security and Sysmon process, registry, image-load, file, and network telemetry plus Zeek conn/dns logs,
  so the analyst can corroborate a suspected UAC bypass against process lineage, registry modifications,
  integrity-level jumps, and follow-on elevated activity.'
type: technique
