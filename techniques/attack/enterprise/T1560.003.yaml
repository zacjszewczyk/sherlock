- question: '[Collection] High read count correlation: Can you determine whether a single process, not
    on an approved backup/archiving allowlist, reads more than 100 unique files from sensitive directories
    within a 5-minute window (Frequency) and subsequently writes one new file in a staging location (e.g.,
    C:\Users\Public, %TEMP%) whose size is a large fraction of the bytes read (Volume) and whose entropy
    is high (>7.2 bits/byte). Successful-read vs access-denied counts (State) are tracked as a distinct
    signal. -- specifically, using the ''High read count correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary compresses or encrypts
