name: 'T1560.003: Archive via Custom Method'
id: 30a0c630-373a-4c96-98c2-2b14371ae7fe
description: 'This playbook helps an analyst investigate whether an adversary is compressing or encrypting
  collected data with a custom method -- such as XOR or stream ciphers, or hand-rolled implementations
  of common compression algorithms with no external library or utility references -- to stage it for exfiltration
  as part of the Collection tactic. Because custom archiving deliberately avoids invoking known archiver
  utilities (7z, tar, gzip, rar, zip), the primary host signal is anomalous script or binary execution
  that produces high-entropy output files lacking standard archive magic numbers. The hunt spans Windows,
  Linux, and macOS endpoints (process-creation, file-access, and process-access/memory telemetry) plus
  network egress sensors (Zeek conn/file/dns logs). It guides the analyst across several behavioral angles:
  command lines matching CTI custom-archiver indicators and obfuscation patterns (encoded PowerShell,
  inline bitwise/XOR loops) and the tell-tale absence of any known archiver name; command-line Shannon-entropy
  spikes and rare producing-process prevalence; mass reads of sensitive files followed by a single high-entropy
  staging write with a read/write volume mismatch; high-entropy, poorly re-compressible outbound flows
  on non-standard ports correlated to host anomalies; suspicious parent-child process lineage (office/browser
  spawning script hosts) followed by mass-read-then-write behavior; oversized staging-file creation followed
  by large outbound volume; and outbound volume z-score spikes to newly observed or low-reputation destinations.
  Detection methods combine symbolic-logic rules, statistical baselining/anomaly scoring, and machine-learning
  models (command-line embedding anomaly detectors, session clustering, flow autoencoders, HMM sequence
  models, and provenance graph GNNs) applied to Windows Security/Sysmon events, auditd, macOS unified
  logs, and Zeek network telemetry, so the analyst can corroborate suspected custom archiving across process
  lineage, file and memory access, output entropy/structure, and downstream egress.'
type: technique
