questions:
- question: '[Collection] Custom archiver hash/pattern match: Can you determine whether a process is created
    (e.g., powershell.exe, python.exe, certutil.exe, or an unknown/low-prevalence binary) where the command-line
    arguments have a calculated Shannon entropy exceeding the 95th percentile of the 30-day baseline for
    that specific process name, OR the process hash matches known custom archivers from threat intelligence.
    Custom archiving (XOR/stream ciphers, hand-rolled compression) deliberately avoids known archiver
    invocation, so encoded/obfuscated command lines and rare producing binaries are the primary host signal.
    -- specifically, using the ''Custom archiver hash/pattern match'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary compresses or encrypts
    collected data using a custom archival method (e.g., XOR/stream ciphers or hand-rolled compression)
    prior to exfiltration, deliberately avoiding known archiver utilities so that high-entropy, non-standard
    output and anomalous producing processes become the detection surface. This evidence focuses on the
    condition that a process is created (e.g., powershell.exe, python.exe, certutil.exe, or an unknown/low-prevalence
    binary) where the command-line arguments have a calculated Shannon entropy exceeding the 95th percentile
    of the 30-day baseline for that specific process name, OR the process hash matches known custom archivers
    from threat intelligence. Custom archiving (XOR/stream ciphers, hand-rolled compression) deliberately
    avoids known archiver invocation, so encoded/obfuscated command lines and rare producing binaries
    are the primary host signal. This Symbolic Logic approach works as follows: Check Windows Event ID
    4688 command lines and hashes against CTI custom-archiver indicators and obfuscation patterns (powershell
    -e/-enc, long Base64 blobs, inline bitwise/XOR loops); the absence of any known archiver name (7z/tar/gzip/rar/zip)
    alongside archive-like activity is itself the custom-method signal, since adversaries roll their own
    compression/encryption ([En Route with Sednit, Part 2](https://www.welivesecurity.com/wp-content/uploads/2016/10/eset-sednit-part-2.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable custom
    archiving of staged data; pivot to the responsible process and its parent lineage, the user and host
    context, the files read and the staging output (its entropy and header), and any subsequent outbound
    transfer. A negative result helps rule out this particular custom-archiving vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, living-off-the-land,
    or low-and-slow activity.'
