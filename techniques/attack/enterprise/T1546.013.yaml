    the 95th percentile or mean+3σ entropy, or with cosine distance from the corpus character-frequency
    vector above the derived threshold. A positive result -- a rule match, statistical outlier, or model
    alert -- indicates a PowerShell profile has likely been weaponized or executed maliciously; pivot
