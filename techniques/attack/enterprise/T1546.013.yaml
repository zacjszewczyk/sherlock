name: 'T1546.013: PowerShell Profile'
id: 12b74ce4-f595-47fb-9e66-9a68050b3726
description: 'This playbook helps an analyst investigate whether an adversary is abusing PowerShell profiles
  (profile.ps1, Microsoft.PowerShell_profile.ps1, the VS Code host profile, and the machine-wide AllUsersAllHosts
  profile under C:\Windows\System32\WindowsPowerShell\v1.0) to gain persistence (TA0003) and to escalate
  privileges (TA0004) on Windows endpoints, servers, domain controllers, and privileged access workstations.
  Because profile scripts execute automatically whenever a PowerShell, ISE, or VS Code session starts
  -- unless -NoProfile is used -- a weaponized profile both re-runs across reboots/logons and silently
  inherits the token of any higher-privileged user who opens PowerShell. The playbook guides the hunt
  across several behavioral angles: matching profile script content/hashes against known-malicious indicators
  and YARA signatures (Invoke-Mimikatz, IEX, DownloadString, FromBase64String); detecting Add-Content
  $profile write/append patterns and persistence primitives (encoded commands, download cradles, Register-ScheduledTask/Register-WmiEvent);
  flagging profile writes by anomalous parent processes (winword.exe, outlook.exe, mshta.exe, wscript.exe,
  unsigned binaries) or at anomalous frequencies; correlating profile-triggered PowerShell to low-reputation/rare/high-volume
  C2 destinations; and -- for privilege escalation -- correlating elevated-token sessions with privesc
  tooling, reflective DLL loads, LSASS access, new service/user/group creation, and cross-privilege profile
  tampering where a low-privilege user writes a profile later executed by an administrator. Detection
  methods combine symbolic-logic rules, statistical baselining (entropy, TF-IDF, Markov/chi-square, modification-burst
  and outlier scoring), and machine-learning models (script classifiers, NLP/AST embeddings, sequence
  models, graph and time-series anomaly detection) applied to PowerShell script-block logs (Event ID 4104),
  process creation (4688 / Sysmon 1), logon (4624), file write/audit (4663 / Sysmon 11), service/task/account
  events (7045/4698/4720/4732/5861), Sysmon process-access (Event ID 10), and Zeek conn/dns telemetry,
  so the analyst can corroborate suspected profile abuse against content, lineage, privilege context,
  and network behavior.'
