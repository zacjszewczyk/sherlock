questions:
- question: '[Persistence] Watch list and YARA detection: Can you determine whether a PowerShell profile
    script''s file hash matches a known malicious hash, or its script block content contains strings,
    commands, or functions associated with known malware or hacking tools (e.g., ''Invoke-Mimikatz'',
    ''IEX'', ''DownloadString''). -- specifically, using the ''Watch list and YARA detection'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), the mission question is: "Is the
    adversary maintaining persistence using PowerShell profiles?" Adversaries abuse PowerShell profiles
    (profile.ps1 / Microsoft.PowerShell_profile.ps1 and the AllUsersAllHosts machine-wide profile) because
    these scripts execute automatically every time a PowerShell, ISE, or VS Code session starts unless
    launched with -NoProfile, giving a reliable trigger for both persistence and privilege escalation
    when a higher-privileged user opens PowerShell. This evidence focuses on the condition that a PowerShell
    profile script''s file hash matches a known malicious hash, or its script block content contains strings,
    commands, or functions associated with known malware or hacking tools (e.g., ''Invoke-Mimikatz'',
    ''IEX'', ''DownloadString''). This Symbolic Logic approach looks for the following signal: Maintain
    a watch list of known-malicious file hashes and a YARA rule for malicious PowerShell content (e.g.,
    ''Invoke-Mimikatz'', ''DownloadString'', ''[Convert]::FromBase64String'', long Base64 blobs). Correlate
    file create/modify events in canonical profile paths ([SigmaHQ file_event](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_susp_powershell_profile.yml):
    `\Microsoft.PowerShell_profile.ps1`, `\PowerShell\profile.ps1`, `\WindowsPowerShell\profile.ps1`,
    `\Windows\System32\WindowsPowerShell\v1.0\profile.ps1`, plus the VS Code host profile `\Microsoft.VSCode_profile.ps1`
    ([SigmaHQ VSCode](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_susp_vscode_powershell_profile.yml)))
    against the hash list, and apply the YARA rule to ScriptBlockText in Event ID 4104 (enable Deep Script
    Block Logging + AMSI to capture deobfuscated content per [NSA/CISA Keeping PowerShell](https://media.defense.gov/2022/Jun/22/2003021689/-1/-1/0/CSI_KEEPING_POWERSHELL_SECURITY_MEASURES_TO_USE_AND_EMBRACE_20220622.PDF)).
    Treat the legitimate path/writer/signing baseline from [Microsoft About Profiles](https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_profiles?view=powershell-7.5)
    as the allowlist. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    a PowerShell profile has likely been weaponized or executed maliciously; pivot to the exact profile
    path, the writing process and its parent lineage, the SID/integrity level of the session that executed
    it, the deobfuscated script-block content (Event ID 4104), and any follow-on persistence, privileged
    changes, or outbound C2. A negative result helps rule out this profile-abuse vector for the window
    examined but should be corroborated with the other questions in this playbook, since a single method
    can miss obfuscated, low-and-slow, or living-off-the-land profile tampering.'
