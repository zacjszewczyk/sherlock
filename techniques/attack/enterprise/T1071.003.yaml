    lexical and passive-DNS features drove that score?
  context: 'This question supports the Command and Control tactic and the hypothesis that an adversary
    is using mail protocols (SMTP, POP3, IMAP) for C2. Evidence sought: A mail protocol connection (SMTP,
    POP3, IMAP) where the source or destination IP address or domain matches an entry on a threat intelligence
    feed of known malicious C2 infrastructure. Detection approach (Machine Learning): Train a Random Forest
    on domain age, lexical entropy, vowel/consonant ratios, character n-gram scores, and passive-DNS patterns,
    then score new mail-server domains and escalate any with a malicious probability greater than 0.9.
    To keep the alert triageable, emit the top-3 contributing features (e.g., entropy, domain age, n-gram
    score) via SHAP attributions so the analyst sees why the model fired. This catches algorithmically-generated
    or freshly registered mail domains that evade static CTI feeds. A positive result — mail-protocol
    activity matching this pattern that is not explained by sanctioned mail clients, enterprise mail infrastructure,
    or benign periodic polling — is a high-confidence indicator of mail-based C2 and should be escalated,
    with the host triaged/isolated and the destination blocked. A negative result lowers but does not
    eliminate suspicion on this vector; pivot to the other questions in this playbook (beaconing cadence,
    content entropy, process attribution, volume anomalies) to avoid missing stealthier mail C2. Baseline
    per host role and tune thresholds/allowlists to keep the signal defensible against benign mail polling.
    References: [Real-Time Detection of DNS Exfiltration and Tunneling, Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf);
    [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek smtp.log
  - 'NAI: Internet Gateway/Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [domain_age, lexical_entropy, vowel_consonant_ratio, ngram_score, passive_dns_pattern]\n\
      rf = RandomForest.train(labeled benign vs malicious mail domains)\np = rf.predict_proba(domain.features)\n\
      IF p > 0.9:\n  EMIT alert(domain, p) WITH top3 = SHAP(domain.features)"
