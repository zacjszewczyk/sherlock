questions:
- question: Do any mail-protocol connections match a CTI feed of known malicious C2 infrastructure (by
    IP or eTLD+1), including blocked/rejected callbacks?
  context: 'This question supports the Command and Control tactic and the hypothesis that an adversary
    is using mail protocols (SMTP, POP3, IMAP) for C2. Evidence sought: A mail protocol connection (SMTP,
    POP3, IMAP) where the source or destination IP address or domain matches an entry on a threat intelligence
    feed of known malicious C2 infrastructure. Detection approach (Symbolic Logic): Monitor Zeek conn.log
    on mail ports (25/465/587/110/995/143/993) and the smtp.log HELO, MAIL FROM, and RCPT TO fields, then
    join both the destination/source IP and the registered domain (eTLD+1) against a CTI feed of known
    malicious C2 mail indicators and alert on any match. Critically, record the conn_state so the analyst
    can see whether the callback succeeded (SF/S1) or was reset/rejected/half-open (REJ/RSTO/S0) — a blocked
    C2 callback is still a high-value indicator of intent and compromise. Maintain these as vendor-neutral
    Sigma rules so the feed-match logic is portable across the estate. A positive result — mail-protocol
    activity matching this pattern that is not explained by sanctioned mail clients, enterprise mail infrastructure,
    or benign periodic polling — is a high-confidence indicator of mail-based C2 and should be escalated,
    with the host triaged/isolated and the destination blocked. A negative result lowers but does not
    eliminate suspicion on this vector; pivot to the other questions in this playbook (beaconing cadence,
    content entropy, process attribution, volume anomalies) to avoid missing stealthier mail C2. Baseline
    per host role and tune thresholds/allowlists to keep the signal defensible against benign mail polling.
    References: [MITRE ATT&CK T1071.003](https://attack.mitre.org/techniques/T1071/003/); [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek smtp.log
  - 'NAI: Internet Gateway/Egress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "LOAD cti_mail_indicators (ips, domains_etld1)\nFROM zeek_conn WHERE id_resp_p IN {25,465,587,110,995,143,993}\n\
      JOIN zeek_smtp ON conn.uid=smtp.uid\nWHERE conn.id_resp_h IN cti_mail_indicators.ips\n   OR etld1(smtp.helo)\
      \ IN cti_mail_indicators.domains_etld1\n   OR etld1(smtp.mailfrom) IN cti_mail_indicators.domains_etld1\n\
      EMIT alert(uid, src, dst, conn_state, matched_indicator)  // deploy as Sigma"
- question: Which external mail-server domains are statistically rare, newly observed, or low-prevalence
    over the last 30 days and warrant review as possible C2?
  context: 'This question supports the Command and Control tactic and the hypothesis that an adversary
    is using mail protocols (SMTP, POP3, IMAP) for C2. Evidence sought: A mail protocol connection (SMTP,
    POP3, IMAP) where the source or destination IP address or domain matches an entry on a threat intelligence
    feed of known malicious C2 infrastructure. Detection approach (Statistical Method): For external mail-server
    domains that are NOT already on a CTI feed, compute a 30-day eTLD+1 frequency distribution and flag
    domains in the lowest 5th percentile, plus any newly-observed or first-seen low-prevalence destination,
    for analyst review. Rarity and recency raise risk because legitimate enterprise mail talks to a small,
    stable set of relays; a host suddenly emitting mail to an unfamiliar domain is suspicious. Baseline
    per host role to suppress benign periodic mail polling (e.g., service accounts that poll a known IMAP
    host). A positive result — mail-protocol activity matching this pattern that is not explained by sanctioned
    mail clients, enterprise mail infrastructure, or benign periodic polling — is a high-confidence indicator
    of mail-based C2 and should be escalated, with the host triaged/isolated and the destination blocked.
    A negative result lowers but does not eliminate suspicion on this vector; pivot to the other questions
    in this playbook (beaconing cadence, content entropy, process attribution, volume anomalies) to avoid
    missing stealthier mail C2. Baseline per host role and tune thresholds/allowlists to keep the signal
    defensible against benign mail polling. References: [Real-Time Detection of DNS Exfiltration and Tunneling,
    Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf); [Modeling Analysis and Characterization
    of Periodic Traffic, Mack et al](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek smtp.log
  - 'NAI: Internet Gateway/Egress Points'
  range: Last 90 days; build/refresh the eTLD+1 prevalence baseline over a 30-day rolling window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "BASELINE 30d PER host_role:\n  freq[etld1] = COUNT(distinct days seen) for external mail domains\
      \ NOT IN cti_feed\n  p5 = PERCENTILE(freq, 5)\nFOR each mail_conn:\n  IF freq[etld1] <= p5 OR first_seen(etld1)\
      \ within 7d:\n    EMIT review(host, etld1, freq, first_seen)"
