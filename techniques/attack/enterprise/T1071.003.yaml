      \ subject MATCHES /(?:[0-9a-fA-F]{32,})/                 // hex blob\n   OR user_agent IN known_c2_user_agents\n\
      \   OR x_originating_ip IN cti_c2_ips\nEMIT alert(uid, field, matched_signature)  // maintain as\
      \ Sigma"
