- question: Are there source-destination pairs on mail ports beaconing at consistent intervals (10+ connections
    with inter-arrival deltas within +/-5 seconds)?
  context: 'This question supports the Command and Control tactic and the hypothesis that an adversary
    is using mail protocols (SMTP, POP3, IMAP) for C2. Evidence sought: Mail protocol connections from
    a single host to a single destination that occur at regular, periodic intervals with low jitter, or
    consistently outside of profiled user activity hours. Detection approach (Symbolic Logic): Flag source-destination
    pairs on mail ports whose 10 or more consecutive connections maintain inter-arrival deltas within
    +/-5 seconds (low jitter), implementing the coefficient-of-variation beacon heuristic from RITA and
    its explainable RITA-J re-implementation. Automated C2 check-ins are metronomic in a way human mail
    use is not, so tight, repeated timing over mail ports is a strong beaconing indicator. A positive
    result — mail-protocol activity matching this pattern that is not explained by sanctioned mail clients,
    enterprise mail infrastructure, or benign periodic polling — is a high-confidence indicator of mail-based
    C2 and should be escalated, with the host triaged/isolated and the destination blocked. A negative
    result lowers but does not eliminate suspicion on this vector; pivot to the other questions in this
    playbook (beaconing cadence, content entropy, process attribution, volume anomalies) to avoid missing
    stealthier mail C2. Baseline per host role and tune thresholds/allowlists to keep the signal defensible
    against benign mail polling. References: [Active Countermeasures RITA](https://github.com/activecm/rita);
    [RITA-J, Cyb3r-Monk](https://github.com/Cyb3r-Monk/RITA-J/blob/main/C2%20Detection%20-%20HTTP.ipynb).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Endpoint Devices and Internet Gateway/Egress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM zeek_conn WHERE id_resp_p IN {25,465,587,110,995,143,993}

      GROUP BY (id_orig_h, id_resp_h)

      ORDER BY ts; deltas = diff(ts)

      WHERE COUNT(conns) >= 10 AND stddev(deltas) <= 5s

      EMIT alert(src, dst, count, mean_interval)  // RITA / RITA-J CV heuristic'
- question: Which mail-port source-destination pairs show low coefficient-of-variation and low-skew inter-arrival
    times with high connection counts (periodic beaconing)?
  context: 'This question supports the Command and Control tactic and the hypothesis that an adversary
    is using mail protocols (SMTP, POP3, IMAP) for C2. Evidence sought: Mail protocol connections from
    a single host to a single destination that occur at regular, periodic intervals with low jitter, or
    consistently outside of profiled user activity hours. Detection approach (Statistical Method): Compute
    the coefficient of variation and skewness of inter-arrival times per source-destination pair over
    a 24-hour window and flag low-CV, low-skew pairs that also have high connection counts. Rank candidates
    with autocorrelation/FFT periodicity extraction (BAYWATCH) to confirm a dominant period, and baseline
    per host role to suppress benign IMAP/POP3 polling that is itself periodic but expected. A positive
    result — mail-protocol activity matching this pattern that is not explained by sanctioned mail clients,
    enterprise mail infrastructure, or benign periodic polling — is a high-confidence indicator of mail-based
    C2 and should be escalated, with the host triaged/isolated and the destination blocked. A negative
    result lowers but does not eliminate suspicion on this vector; pivot to the other questions in this
    playbook (beaconing cadence, content entropy, process attribution, volume anomalies) to avoid missing
    stealthier mail C2. Baseline per host role and tune thresholds/allowlists to keep the signal defensible
    against benign mail polling. References: [RITA-J, Cyb3r-Monk](https://github.com/Cyb3r-Monk/RITA-J/blob/main/C2%20Detection%20-%20HTTP.ipynb);
    [BAYWATCH, Hassan et al](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks);
    [Modeling Analysis and Characterization of Periodic Traffic, Mack et al](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Endpoint Devices and Internet Gateway/Egress Points'
  range: Last 90 days; evaluate cadence over rolling 24-hour windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "WINDOW 24h PER (src, dst) on mail ports:\n  deltas = diff(ts)\n  cv = stddev(deltas)/mean(deltas)\n\
      \  sk = skew(deltas); n = COUNT(conns)\n  period = FFT_autocorr_peak(deltas)\nWHERE cv < 0.1 AND\
      \ sk low AND n >= threshold\n  AND NOT benign_polling_baseline[role]\nEMIT alert(src, dst, cv, sk,\
      \ n, period)"
- question: Does STL/time-series decomposition reveal strong periodic mail-connection components misaligned
    with business hours, including jitter-randomized beacons?
  context: 'This question supports the Command and Control tactic and the hypothesis that an adversary
    is using mail protocols (SMTP, POP3, IMAP) for C2. Evidence sought: Mail protocol connections from
    a single host to a single destination that occur at regular, periodic intervals with low jitter, or
    consistently outside of profiled user activity hours. Detection approach (Machine Learning): Apply
    STL decomposition to per-host mail connection counts and alert on strong periodic components that
    are misaligned with business hours (e.g., regular 3 a.m. check-ins). For jitter-randomized beacons
    that defeat CV/FFT methods, add LSTM/transformer time-series models or a Continuous-Time HMM latent-state
    cadence detector to recover the hidden periodicity. Off-hours, machine-regular mail activity is a
    hallmark of automated C2 rather than human correspondence. A positive result — mail-protocol activity
    matching this pattern that is not explained by sanctioned mail clients, enterprise mail infrastructure,
    or benign periodic polling — is a high-confidence indicator of mail-based C2 and should be escalated,
    with the host triaged/isolated and the destination blocked. A negative result lowers but does not
    eliminate suspicion on this vector; pivot to the other questions in this playbook (beaconing cadence,
    content entropy, process attribution, volume anomalies) to avoid missing stealthier mail C2. Baseline
    per host role and tune thresholds/allowlists to keep the signal defensible against benign mail polling.
    References: [C2 Beaconing Detection via AI-Based Time-Series Analysis, Gupta et al](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20);
    [NetSpectra Sentinel](https://www.sciencedirect.com/science/article/pii/S1084804525000244).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Endpoint Devices and Internet Gateway/Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = aggregate(mail_conn_count, 15min) PER host

      trend,seasonal,resid = STL.decompose(series)

      IF seasonal.power high AND peak_phase OUTSIDE business_hours: flag

      lstm = LSTM_or_Transformer.fit(series); ctHMM = CTHMM.fit(series)

      IF model.anomaly_score high: flag

      EMIT alert WITH contributing_time_windows'
- question: Are there single mail connections with abnormally large outbound volume (e.g., >50MB) or an
    upload-heavy client-to-server byte ratio indicating bulk exfiltration?
  context: 'This question supports the Command and Control tactic and the hypothesis that an adversary
    is using mail protocols (SMTP, POP3, IMAP) for C2. Evidence sought: A mail protocol session with an
    anomalous data transfer volume or a client-to-server byte ratio that deviates significantly from an
    established baseline. Detection approach (Symbolic Logic): Trigger on single mail connections where
    orig_bytes exceeds an environment-specific threshold (e.g., 50MB) or where the client-to-server (orig:resp)
    byte ratio is abnormally upload-heavy. Mail sessions are normally modest and roughly balanced; a large,
    upload-skewed mail flow suggests bulk data is being pushed out over the mail channel rather than normal
    message delivery. A positive result — mail-protocol activity matching this pattern that is not explained
    by sanctioned mail clients, enterprise mail infrastructure, or benign periodic polling — is a high-confidence
    indicator of mail-based C2 and should be escalated, with the host triaged/isolated and the destination
    blocked. A negative result lowers but does not eliminate suspicion on this vector; pivot to the other
    questions in this playbook (beaconing cadence, content entropy, process attribution, volume anomalies)
    to avoid missing stealthier mail C2. Baseline per host role and tune thresholds/allowlists to keep
    the signal defensible against benign mail polling. References: [MITRE ATT&CK T1071.003](https://attack.mitre.org/techniques/T1071/003/).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway/Egress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM zeek_conn WHERE id_resp_p IN {25,465,587,110,995,143,993}\nWHERE orig_bytes > 50_000_000\n\
      \   OR (orig_bytes / NULLIF(resp_bytes,0)) > upload_ratio_threshold\n  AND id_resp_h NOT IN allowlisted_mail_infra\n\
      EMIT alert(uid, src, dst, orig_bytes, resp_bytes)"
