name: 'T1071.003: Mail Protocols'
id: 102b8836-555c-4408-ae67-fed6931f4dad
description: 'Investigate whether an adversary is abusing electronic-mail application-layer protocols
  (SMTP/S on 25/465/587, POP3/S on 110/995, and IMAP on 143/993) as a command-and-control (C2) channel
  that blends in with normal, expected mail traffic. Sophisticated actors embed tasking and exfiltrated
  results inside mail headers, subject lines, and message bodies, or simply tunnel bulk data over mail
  ports to evade proxy and content filters. This playbook guides a SOC analyst across the network edge,
  internal mail relays, and endpoints to confirm or refute mail-protocol C2 by: matching mail connections
  and HELO/MAIL FROM/RCPT TO fields against current CTI feeds (recording conn_state so blocked callbacks
  are still captured); scoring rare, newly-observed, or low-prevalence external mail domains; classifying
  suspicious mail-server domains with lexical and passive-DNS features; hunting C2 signatures, Base64/hex
  tokens, and high-entropy content in mail headers, subjects, and bodies; detecting low-jitter, periodic
  beaconing and off-hours cadence over mail ports; profiling anomalous data-transfer volumes, upload-heavy
  byte ratios, and bursts of failed/reset mail callbacks; and correlating mail-port network traffic with
  the originating process so that non-allowlisted binaries (powershell.exe, rundll32, curl, certutil)
  or mail clients spawned by unusual parents (OUTLOOK.EXE from wmic.exe) are surfaced. It pairs symbolic-logic
  rules, statistical baselines, and machine-learning models with explainable feature attribution so detections
  stay defensible against benign periodic mail polling and legitimate enterprise mail infrastructure.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
