name: 'T1529: System Shutdown-Reboot'
id: aad97a7f-3fe4-413f-8dd0-4f360c1467d1
description: 'This playbook helps an analyst investigate whether an adversary is shutting down or rebooting
  systems to interrupt access to computing resources, impede incident response and recovery, or hasten
  the effects of prior destructive activity (disk/boot wipe, recovery inhibition) as part of the Impact
  tactic. It guides the hunt across many behavioral angles spanning Windows, Linux, macOS, ESXi hypervisors,
  and network devices: execution of shutdown/reboot binaries and cmdlets matched by hash or deterministic
  command-line tokens (shutdown /s|/r|/g|/l, Restart-Computer/Stop-Computer, /sbin/shutdown|reboot|halt|poweroff,
  systemctl poweroff, Magic SysRq writes to /proc/sysrq-trigger, esxcli system shutdown, vim-cmd vmsvc/power.off,
  network-device reload); forced/immediate flag usage (/f, /t 0, -Force) spawned by scripting interpreters;
  remote-administration-driven shutdowns (psexec, wmic os call shutdown, Invoke-Command/Enter-PSSession,
  shutdown /m) correlated with management-port network connections; remote-logon-then-shutdown sequences
  (Event ID 4624 followed by 1074) and burst-failed-logon precursors; enterprise-wide mass shutdown/reboot
  surges (Event IDs 1074/6006/6008) outside maintenance windows; sudden collapses in network flow volume
  signalling mass outage; and stealthy API-based shutdowns (AdjustTokenPrivileges for SeShutdownPrivilege
  followed by InitializeSystemShutdownExW/ExitWindowsEx/NtRaiseHardError) that evade command-line detection.
  Detection methods combine symbolic-logic rules, statistical baselining/forecasting/change-point analysis,
  and machine-learning models (Isolation Forest, DBSCAN, XGBoost, DeepLog/LSTM, graph anomaly detection,
  ARIMA/Prophet) applied to Windows Security/Sysmon events, PowerShell script-block logs, auditd, Linux/macOS/ESXi/network-device
  syslog and unified logs, and Zeek conn.log, so the analyst can corroborate suspected shutdown/reboot
  impact against process lineage, privilege use, user/maintenance context, host-status records, and network
  outage signals.'
