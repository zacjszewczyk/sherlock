questions:
- question: '[Impact] A process creation event (Windows Event ID 4688 or Sysmon Event ID 1) where the
    new process''s file hash matches a known malicious binary associated with impact tactics (e.g., wiper,
    ransomware) and the command line explicitly initiates a system shutdown (e.g., contains ''shutdown
    /s'' or ''shutdown /r''). How can you investigate this using the Symbolic Logic approach described
    as: Create a real-time rule to scan process creation events (Windows Event ID 468...?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary may shut down or reboot systems
    to disrupt availability, frustrate responders, or finalize destructive operations, so unexpected shutdown/reboot
    activity demands scrutiny. This evidence focuses on the condition that a process creation event (Windows
    Event ID 4688 or Sysmon Event ID 1) where the new process''s file hash matches a known malicious binary
    associated with impact tactics (e.g., wiper, ransomware) and the command line explicitly initiates
    a system shutdown (e.g., contains ''shutdown /s'' or ''shutdown /r''). This Symbolic Logic approach
    works as follows: Create a real-time rule to scan process creation events (Windows Event ID 4688,
    Sysmon Event ID 1). Alert if the process''s file hash (SHA256, MD5) is present in a threat intelligence
    feed of known impact-related malware AND the command line initiates a shutdown/reboot. Match the deterministic
    tokens enumerated by [Atomic Red Team T1529](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1529/T1529.md)
    and the parameter set in the [Microsoft shutdown reference](https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/shutdown):
    `shutdown` with `/s`, `/r`, `/g`, or `/l`, plus `Restart-Computer`/`Stop-Computer`. Escalate to CRITICAL
    when the same host shows preceding destructive activity (Disk/Boot wipe, recovery deletion) within
    30 minutes, per [CISA AA22-057A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-057a).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a shutdown/reboot
    that deviates from sanctioned administration and scheduled maintenance, and warrants pivoting to the
    responsible process, user/logon context, host-status records, privilege use, and any preceding destructive
    or remote-access activity. A negative result helps rule out this specific shutdown/reboot vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    API-based, or living-off-the-land shutdown techniques.'
