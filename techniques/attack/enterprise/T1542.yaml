- question: '[Persistence] Predictive log silence detection: Can you determine whether an endpoint is
    observed generating significant outbound network traffic, but its corresponding host-based security
    logs (e.g., EDR telemetry) are absent from the central log aggregator for an anomalous period of time.
    -- specifically, using the ''Predictive log silence detection'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary tampers with Pre-OS
    Boot mechanisms (BIOS/UEFI firmware, bootloaders, MBR/VBR, boot-start drivers) to survive reboots,
    credential changes, and reinstallation, re-establishing a foothold before the operating system and
    its defenses ever load. This evidence focuses on the condition that an endpoint is observed generating
    significant outbound network traffic, but its corresponding host-based security logs (e.g., EDR telemetry)
    are absent from the central log aggregator for an anomalous period of time. This Machine Learning
    approach implements the following detection logic: Use a regression or LSTM-autoencoder model on historical
    network traffic (volume, protocol mix, destinations) to predict expected log volume from an endpoint
    and alert when actual ingested volume falls below the prediction for a sustained period, surfacing
    the top-3 contributing features ([Explainable Anomaly Detection, Hwang](https://arxiv.org/abs/2205.01930)).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
    boot-level code, firmware, or boot configuration is being manipulated or that a bootkit is loading
    beneath the OS; pivot to the responsible process and its parent lineage, the user/host context, the
    targeted boot object (firmware, NVRAM/UEFI variable, MBR/VBR, ESP, boot-start driver, or boot configuration),
    and any correlated network, service-health, or boot-stability anomalies, and verify against change-management/maintenance
    records. A negative result helps reduce suspicion for this specific vector but does not clear the
    host, since Pre-OS Boot threats are designed to evade host software defenses -- corroborate with the
    other questions in this playbook (ideally including out-of-band firmware/measured-boot integrity checks).'
