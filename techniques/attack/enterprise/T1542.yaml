questions:
- question: '[Stealth] Correlate boot-related destinations: Can you determine whether a host or network
    segment shows outbound traffic to a known bootkit, UEFI, or firmware-update infrastructure destination,
    including unusual DNS lookups, TFTP-style transfers, or connections to vendor-impersonating update
    hosts that are inconsistent with normal maintenance windows. -- specifically, using the ''Correlate
    boot-related destinations'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses Pre-OS Boot mechanisms
    (BIOS/UEFI firmware, bootloaders, MBR/VBR, boot-start drivers) to operate at a layer beneath the operating
    system, where software-based host defenses are blind and the activity blends into legitimate firmware/boot
    maintenance. This evidence focuses on the condition that a host or network segment shows outbound
    traffic to a known bootkit, UEFI, or firmware-update infrastructure destination, including unusual
    DNS lookups, TFTP-style transfers, or connections to vendor-impersonating update hosts that are inconsistent
    with normal maintenance windows. This Symbolic Logic approach implements the following detection logic:
    Join Zeek conn.log and dns.log, then match destinations, queried domains, and update-related hostnames
    to high-confidence bootkit, UEFI, or malicious firmware-infrastructure feeds. Alert when the destination
    is not an approved vendor update endpoint, when firmware-update protocols (TFTP 69/UDP, FTP 21, SCP
    22, or vendor protocols) reach non-vendor hosts, or when the transfer occurs outside an expected maintenance
    window; legitimate firmware must traverse the authenticated vendor update path ([BIOS Protection Guidelines
    (NIST SP 800-147)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-147.pdf)).
    Treat covert management-plane channels using crafted TCP with non-standard sequence/ACK values as
    pseudo-authentication as high-confidence on network devices ([SYNful Knock: A Cisco Router Implant,
    Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/)). A positive
    result -- a rule match, statistical outlier, or model alert -- is a strong indicator that boot-level
    code, firmware, or boot configuration is being manipulated or that a bootkit is loading beneath the
    OS; pivot to the responsible process and its parent lineage, the user/host context, the targeted boot
    object (firmware, NVRAM/UEFI variable, MBR/VBR, ESP, boot-start driver, or boot configuration), and
    any correlated network, service-health, or boot-stability anomalies, and verify against change-management/maintenance
    records. A negative result helps reduce suspicion for this specific vector but does not clear the
    host, since Pre-OS Boot threats are designed to evade host software defenses -- corroborate with the
    other questions in this playbook (ideally including out-of-band firmware/measured-boot integrity checks).'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek dns.log
  - Threat Intelligence Feeds
  - DHCP Logs
  - 'NAI: Network Egress/Gateway, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Correlate boot-related destinations\nsource IN [Zeek conn.log, Zeek dns.log, Threat Intelligence\
      \ Feeds, DHCP Logs]\n| WHERE matches_action_criteria(\"Correlate boot-related destinations\")\n\
      // Join Zeek conn.log and dns.log, then match destinations, queried domains, and update-related\
      \ hostnames to high-confidence bootkit, UEFI, or \n| ALERT enrich(host, user, process, parent, boot_object,\
      \ dest)"
  - technology: Zeek/pseudocode
    query: '# Pre-OS Boot network correlation

      conn.log, dns.log

      | JOIN host activity to outbound flows on (id.orig_h, time-window)

      | MATCH dest/domain against bootkit/UEFI/firmware-infra TI feeds; flag TFTP(69)/FTP(21)/SCP(22)
      to non-vendor hosts

      | AGG dns_entropy, NXDOMAIN_rate, dest_rarity, bytes per (id.orig_h)

      | flag firmware-update traffic to non-approved destinations per action criteria'
- question: '[Stealth] Flag unusual firmware-update patterns: Can you determine whether a host or network
    segment shows outbound traffic to a known bootkit, UEFI, or firmware-update infrastructure destination,
    including unusual DNS lookups, TFTP-style transfers, or connections to vendor-impersonating update
    hosts that are inconsistent with normal maintenance windows. -- specifically, using the ''Flag unusual
    firmware-update patterns'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses Pre-OS Boot mechanisms
    (BIOS/UEFI firmware, bootloaders, MBR/VBR, boot-start drivers) to operate at a layer beneath the operating
    system, where software-based host defenses are blind and the activity blends into legitimate firmware/boot
    maintenance. This evidence focuses on the condition that a host or network segment shows outbound
    traffic to a known bootkit, UEFI, or firmware-update infrastructure destination, including unusual
    DNS lookups, TFTP-style transfers, or connections to vendor-impersonating update hosts that are inconsistent
    with normal maintenance windows. This Statistical Method approach implements the following detection
    logic: Baseline firmware-related destinations, per-host DNS Shannon entropy, and TFTP-like transfer
    frequency and byte volume by host and network segment. Alert when a destination falls below the 5th
    percentile of historical prevalence or per-host DNS entropy is sustained above the 95th percentile
    ([Real-Time Detection of DNS Exfiltration and Tunneling, Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)).
    Profile NXDOMAIN and blocked-connection rates per host as a distinct failure-mode signal of beaconing
    to dead firmware/C2 infrastructure. A positive result -- a rule match, statistical outlier, or model
    alert -- is a strong indicator that boot-level code, firmware, or boot configuration is being manipulated
    or that a bootkit is loading beneath the OS; pivot to the responsible process and its parent lineage,
    the user/host context, the targeted boot object (firmware, NVRAM/UEFI variable, MBR/VBR, ESP, boot-start
    driver, or boot configuration), and any correlated network, service-health, or boot-stability anomalies,
    and verify against change-management/maintenance records. A negative result helps reduce suspicion
    for this specific vector but does not clear the host, since Pre-OS Boot threats are designed to evade
    host software defenses -- corroborate with the other questions in this playbook (ideally including
    out-of-band firmware/measured-boot integrity checks).'
