- question: '[Stealth] Detect suspicious boot utility usage: Can you determine whether an unauthorized
    process or user context executes a known utility (e.g., bcdedit.exe, bootsect.exe) with command-line
    arguments that modify the boot configuration, Master Boot Record (MBR), or UEFI variables. -- specifically,
    using the ''Detect suspicious boot utility usage'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses Pre-OS Boot mechanisms
    (BIOS/UEFI firmware, bootloaders, MBR/VBR, boot-start drivers) to operate at a layer beneath the operating
    system, where software-based host defenses are blind and the activity blends into legitimate firmware/boot
    maintenance. This evidence focuses on the condition that an unauthorized process or user context executes
    a known utility (e.g., bcdedit.exe, bootsect.exe) with command-line arguments that modify the boot
    configuration, Master Boot Record (MBR), or UEFI variables. This Symbolic Logic approach implements
    the following detection logic: Alert on executions of bcdedit.exe, bootsect.exe, reagentc.exe, or
    efibootmgr.exe with modification arguments (e.g., /set, /store, /create, /export) originating from
    a parent process that is not a trusted installer, system-management/MDM tool, or interactive administrator
    session. BlackLotus altered Boot Configuration Data and wrote to the EFI System Partition during installation,
    so treat these as high-confidence on non-maintenance hosts ([BlackLotus UEFI Bootkit, ESET](https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/)).
