name: 'T1542: Pre-OS Boot'
id: f9e96c9b-8a0c-4d8d-b99d-46bddb7ffb68
description: 'This playbook helps an analyst investigate whether an adversary is abusing Pre-OS Boot mechanisms
  (T1542) to establish stealthy persistence beneath the operating system across Windows, Linux, macOS,
  and network devices. It guides the hunt across complementary angles drawn from the analysis plan for
  both the Stealth (TA0005) and Persistence (TA0003) tactics: outbound traffic to bootkit/UEFI/firmware
  command-and-control or vendor-impersonating update infrastructure (Zeek conn/dns, TI feeds, firewall,
  DHCP), including covert management-plane channels on network gear; suspicious execution of boot/firmware
  utilities on Windows (bcdedit.exe, bootsect.exe, reagentc.exe, efibootmgr) and on Linux/macOS (efibootmgr,
  dd, bless, nvram, flashrom); raw writes to physical disk sectors, the MBR/VBR, EFI System Partition,
  or system-reserved partitions; boot-configuration regressions that disable security controls (nx AlwaysOff,
  testsigning on, safeboot) and unauthorized Secure Boot/MOK/UEFI-variable changes; installation or loading
  of unsigned, vulnerable, or known-malicious boot-start drivers (BYOVD); anomalous shutdown/boot-failure
  sequences and Secure Boot or measured-boot/TPM validation failures; post-reboot security-agent (EDR/AV)
  stoppages without change-management context; and active hosts that fall silent in the log pipeline.
  Detection methods combine symbolic-logic rules, statistical baselining and change-point detection, and
  machine-learning models (provenance graphs, LSTM log-sequence models, isolation forests, autoencoders)
  over Windows Event Logs/Sysmon, auditd, macOS unified logs, UEFI/BIOS and TPM event logs, network-device
  config/firmware telemetry, and Zeek/firewall network logs, so the analyst can corroborate suspected
  Pre-OS Boot tampering against process lineage, boot-object integrity, boot stability, and out-of-band
  firmware measurements.'
type: technique
