name: 'T1546.001: Change Default File Association'
id: 082199dd-be07-45b8-964f-2d922de4c706
description: 'This playbook helps an analyst investigate whether an adversary is abusing the Windows default
  file-association (handler) mechanism to maintain persistence (TA0003) and/or escalate privileges (TA0004)
  by executing malicious content when a user or system service opens a file of a given type. File associations
  are stored in the Windows Registry under HKEY_CLASSES_ROOT\.[ext] and the corresponding handler''s shell\open\command
  (and print/printto) subkeys, and can be rewritten by reg.exe, PowerShell Set-ItemProperty/New-ItemProperty,
  or the built-in assoc/ftype utilities. The playbook guides the hunt across several behavioral angles:
  registry value-set events on shell\open\command keys (HKCR and per-user FileExts\UserChoice) whose writer
  process or new command value matches threat-intelligence indicators, calls a script interpreter/LOLBin,
  points at user-writable paths, or carries privilege-escalation toolmarks; anomalous process lineage
  where a document/file handler (explorer.exe, notepad.exe, winword.exe, acrord32.exe) or a SYSTEM-context
  service (services.exe, svchost.exe, spoolsv.exe) spawns shells, interpreters, or executables from temp/user
  directories; rogue token-elevation events tied to document handlers; and outbound network connections
  from handler-spawned processes to rare or blocklisted destinations. Detection methods combine symbolic-logic
  rules, statistical baselining/prevalence and frequency analysis, and machine learning (Random Forest/XGBoost
  with TF-IDF and SHAP, DBSCAN clustering, LSTM/DeepLog sequence models, and provenance-graph models such
  as KAIROS/ThreaTrace) applied to Windows Security Event ID 4657/4688/4672, Sysmon Event ID 1/3/13, and
  Zeek conn.log/dns.log telemetry, so the analyst can corroborate suspected file-association hijacks across
  registry writes, process execution, privilege context, and network activity.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
