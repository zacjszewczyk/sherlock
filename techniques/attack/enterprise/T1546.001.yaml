- question: '[Persistence] Alert when non-executable handlers call scripts or LOLBins: Can you determine
    whether a registry modification event is recorded for a file extension handler associated with non-executable
    files (e.g., txtfile, jpegfile, rtffile) where the new command value is set to execute a script interpreter
    or a living-off-the-land binary (LOLBin). -- specifically, using the ''Alert when non-executable handlers
    call scripts or LOLBins'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses the Windows default
    file-association mechanism so that opening a file silently runs attacker-chosen code. This evidence
    focuses on the condition that a registry modification event is recorded for a file extension handler
    associated with non-executable files (e.g., txtfile, jpegfile, rtffile) where the new command value
    is set to execute a script interpreter or a living-off-the-land binary (LOLBin). This Symbolic Logic
    approach works as follows: Develop a SIEM rule for registry value-set events where the target key
    is a handler for a non-executable file type (e.g., `txtfile`, `jpegfile`, `pdffile`, `htmlfile`) and
