    and the child `Image` is a script interpreter or LOLBin, or executes from `%APPDATA%`, `%TEMP%`, or
    `C:\Users\Public\` [Red Canary LOLBins](https://redcanary.com/blog/threat-intelligence/lolbins-abuse/),
    [MITRE T1546.001](https://attack.mitre.org/techniques/T1546/001/). A positive result -- a rule match,
