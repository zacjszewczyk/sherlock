questions:
- question: '[Persistence] Alert on file association keys matching TI indicators: Can you determine whether
    a registry modification event is recorded for a `shell\open\command` key within HKEY_CLASSES_ROOT
    or a user''s FileExts key, where the process performing the modification or the new command value
    matches a known threat intelligence indicator. -- specifically, using the ''Alert on file association
    keys matching TI indicators'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses the Windows default
    file-association mechanism so that opening a file silently runs attacker-chosen code. This evidence
    focuses on the condition that a registry modification event is recorded for a `shell\open\command`
    key within HKEY_CLASSES_ROOT or a user''s FileExts key, where the process performing the modification
    or the new command value matches a known threat intelligence indicator. This Symbolic Logic approach
    works as follows: Create a SIEM rule that alerts when a registry value is set (Sysmon Event ID 13
    captures the written value in Details, or Windows Event ID 4657) for a key path ending in `\shell\open\command`
    (under HKEY_CLASSES_ROOT or a user''s `...\FileExts\...\UserChoice`) and the `ProcessImage` or new
    `Details` value matches a known malicious hash, command-line pattern, or file path from a threat-intelligence
    feed. Also fire on `reg.exe add` or PowerShell `Set-ItemProperty`/`New-ItemProperty` targeting these
    paths, and on `assoc`/`ftype` execution that rewrites a handler [Sysmon Registry Actions](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/registry-actions.md),
    [Splunk: File Association Modification via Ftype](https://research.splunk.com/endpoint/bab530d7-f3b4-428d-a3e6-30d7d0393fc8/),
    [MITRE T1546.001](https://attack.mitre.org/techniques/T1546/001/). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates a file-association handler or its triggered process
    is behaving in a way that diverges from sanctioned installers/updaters and normal user activity; pivot
    to the writer process and its lineage, the modified registry key and new command value, the user and
    integrity/token context, and any follow-on process or network activity. Tie to Persistence: confirm
    whether the modified handler would re-execute the payload every time the associated file type is opened,
    granting durable re-entry.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: Registry hives (HKEY_CLASSES_ROOT, HKEY_CURRENT_USER) on all Windows endpoints, with a focus
    on servers hosting critical applications and privileged access workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Alert on file association keys matching TI indicators

      source IN [Windows Event ID 4657, Sysmon Event ID 13]

      filter target_key matches ''*\\shell\\open\\command'' OR ''*\\FileExts\\*\\UserChoice''

      where ProcessImage in TI_hash OR new_value matches TI_cmd_pattern OR new_value contains TI_path

      also: process_name in [reg.exe,powershell.exe] and cmdline matches ''add|Set-ItemProperty|New-ItemProperty
      .*shell\\open\\command''

      also: cmdline matches ''assoc'' OR ''ftype'' rewriting a handler

      emit alert {host, writer=ProcessImage, key=target_key, value=new_value}

      '
- question: '[Persistence] Flag rare source processes modifying associations: Can you determine whether
    a registry modification event is recorded for a `shell\open\command` key within HKEY_CLASSES_ROOT
    or a user''s FileExts key, where the process performing the modification or the new command value
    matches a known threat intelligence indicator. -- specifically, using the ''Flag rare source processes
    modifying associations'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses the Windows default
    file-association mechanism so that opening a file silently runs attacker-chosen code. This evidence
    focuses on the condition that a registry modification event is recorded for a `shell\open\command`
    key within HKEY_CLASSES_ROOT or a user''s FileExts key, where the process performing the modification
    or the new command value matches a known threat intelligence indicator. This Statistical Method approach
    works as follows: Establish a fleet-wide baseline of processes that legitimately modify file-association
    registry keys (typically installers, MSI, software-update services). For each modification, compute
    the prevalence of the source process across the enterprise using bucketed round-robin frequency logging;
    flag modifications by processes in the bottom 5th percentile of frequency for this action or never
    before seen performing it. Track failed/denied registry writes (4657 with access-denied) as a distinct
    signal of probing [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a file-association
    handler or its triggered process is behaving in a way that diverges from sanctioned installers/updaters
    and normal user activity; pivot to the writer process and its lineage, the modified registry key and
    new command value, the user and integrity/token context, and any follow-on process or network activity.
    Tie to Persistence: confirm whether the modified handler would re-execute the payload every time the
    associated file type is opened, granting durable re-entry.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: Registry hives (HKEY_CLASSES_ROOT, HKEY_CURRENT_USER) on all Windows endpoints, with a focus
    on servers hosting critical applications and privileged access workstations.'
  range: Last 90 days; for correlation, center on the registry-modify/process-create event +/- 10 minutes
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Flag rare source processes modifying associations

      source IN [Windows Event ID 4657, Sysmon Event ID 13]

      baseline = freq(writer_process) for shell\open\command modifications fleet-wide

      flag modification if prevalence(writer) < 5th_percentile OR never_seen(writer, action)

      track 4657 access-denied writes as distinct probing signal

      '
