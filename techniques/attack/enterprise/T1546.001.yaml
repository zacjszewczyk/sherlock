    handling application (e.g., explorer.exe, notepad.exe, winword.exe) spawns a child process that is
    a script interpreter or an executable located in a user-writable or temporary directory. This Symbolic
    Logic approach works as follows: Alert on process creation (Sysmon Event ID 1 / Windows 4688) where
