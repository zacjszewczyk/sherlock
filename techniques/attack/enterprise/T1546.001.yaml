    triggered process is behaving in a way that diverges from sanctioned installers/updaters and normal
    user activity; pivot to the writer process and its lineage, the modified registry key and new command
    value, the user and integrity/token context, and any follow-on process or network activity. Tie to
    Persistence: confirm whether the modified handler would re-execute the payload every time the associated
    file type is opened, granting durable re-entry.'
