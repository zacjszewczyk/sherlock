- question: '[Persistence] Alert when document handlers spawn script interpreters: Can you determine whether
    a process creation event is observed where a common document or file handling application (e.g., explorer.exe,
    notepad.exe, winword.exe) spawns a child process that is a script interpreter or an executable located
    in a user-writable or temporary directory. -- specifically, using the ''Alert when document handlers
    spawn script interpreters'' (Symbolic Logic) approach?'
