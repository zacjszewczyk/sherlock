    `wscript.exe`, `mshta.exe`) or LOLBin (`rundll32.exe`, `regsvr32.exe`, `certutil.exe`). A concrete
    high-fidelity case is re-associating an extension to `notepad.exe` (Prestige ransomware ransom-note
