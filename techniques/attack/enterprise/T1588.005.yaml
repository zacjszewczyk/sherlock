name: 'T1588.005: Exploits'
id: a4e2eeef-9e20-4392-9ab8-4348676ba5d7
description: Investigate whether an internal host is acquiring exploits - downloading, transferring, or
  executing exploit proof-of-concept code, exploit archives, exploit-kit content, or weaponized scripts
  - in support of an adversary's Resource Development. This playbook helps an analyst hunt for hosts outside
  the sanctioned security-research or vulnerability-management groups that browse exploit databases, hacking
  forums, criminal marketplaces, and public code repositories and then retrieve exploit material; file
  transfers carrying CVE-referenced or PoC filenames and hashes that are later unpacked or executed locally;
  rapid browse-then-download bursts against exploit-related sites; and full browse-download-execute chains
  where a downloaded exploit is launched with a local interpreter or archive utility. It combines deterministic
  IOC/YARA/filename watchlists, statistical baselining of domain/MIME rarity and failure-rate spikes,
  and sequence/anomaly machine-learning models to surface exploit-acquisition behavior across network
  egress, proxy, DNS, and endpoint process-creation telemetry.
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has any host that is NOT part of the security-research or vulnerability-management organizational
    unit contacted known exploit vendors, exploit-kit infrastructure, criminal marketplaces, or exploit-discussion
    forums, or downloaded exploit material from them?
  context: 'Adversaries (and insiders supporting them) acquire exploits by reaching out to a known ecosystem
    of exploit vendors, exploit-kit families, criminal marketplaces, and exploit-discussion forums. Joining
    Zeek dns.log, http.log, and conn.log against a curated threat-intelligence feed of these indicators
    - grounded in the observed exploit-trade economy and expanded with seed-pivoting - lets you detect
    contact or downloads from any host that has no legitimate business touching that infrastructure. Scoping
    the alert to hosts outside the sanctioned research/vuln-management OU keeps false positives down:
    a hit means an unexpected host is sourcing exploit capability, a direct indicator of Resource Development.
    A negative result narrows the hunt to hosts that only used unknown infrastructure (pursue with the
    rarity and ML methods).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Corporate network egress points, DNS resolvers, web proxies, and user workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nLET exploit_ti = lookup('ti_exploit_vendors_kits_marketplaces_forums')\nFROM zeek_dns,\
      \ zeek_http, zeek_conn\nWHERE (query IN exploit_ti.domain OR host IN exploit_ti.domain\n       OR\
      \ id.resp_h IN exploit_ti.ip OR uri MATCHES exploit_ti.url_pattern)\n  AND src_host.ou NOT IN ('security-research','vuln-management')\n\
      JOIN zeek_files ON conn uid WHERE files.mime_type IN ('application/zip','application/x-dosexec','text/x-python')\n\
      ALERT 'Non-research host contacted/downloaded from exploit infrastructure'"
- question: Are there downloads whose Content-Type does not match the file extension, that originate from
    short-lived single-purpose 'drop' hosts, or that follow a landing-page-to-payload redirect chain,
    and whose extracted bodies match exploit YARA signatures?
  context: 'Exploit-kit and PoC delivery frequently uses structural tricks: serving an executable or archive
    under a mismatched MIME type, hosting payloads on ephemeral drop servers, or chaining a landing page
    through a redirect to the actual payload. Applying deterministic Nazca-style graph predicates over
    first-party HTTP/file logs flags these structural anomalies without needing prior IOCs, and confirming
    the body against the Neo23x0 signature-base YARA rules validates that the downloaded object is genuinely
    exploit content. A positive result is high-confidence exploit acquisition even from previously unknown
    infrastructure; a negative result suggests the download, if any, was benign or delivered conventionally.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Corporate network egress points, DNS resolvers, web proxies, and user workstations.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\nFROM zeek_http JOIN zeek_files ON uid\nWHERE (declared_ext NOT_CONSISTENT_WITH resp_mime_type)\n\
      \   OR (resp_host SEEN_FIRST_TIME AND resp_host.connections < 5)\n   OR (referrer CHAIN landing->payload\
      \ redirect)\nEXTRACT file body\nWHERE yara_scan(body, 'signature-base/exploits') == MATCH\nALERT\
      \ 'Structural exploit download predicate + YARA hit'"
- question: Which hosts queried exploit databases, forums, marketplaces, or code repositories in the 99.9th
    rarity percentile for their peer group, or downloaded a first-seen exploit archive, when scored against
    a 30-day baseline and passive-DNS novelty features?
  context: Most users never touch exploit-trade sites, so per-host visits to exploit databases, forums,
    marketplaces, and repositories baselined over 30 days make rare access stand out. Alerting when a
    host queries domains in the 99.9th rarity percentile for its peer group, or downloads a first-seen
    exploit archive, surfaces exploit acquisition even without a curated IOC list. Passive-DNS features
    (low/changing TTL, IP/ASN dynamism, lexical improbability) and fleet-wide prevalence add a malice
    prior. Derive percentile cutoffs from your own proxy/DNS volume so the baseline reflects local normal.
    A hit indicates anomalously rare exploit-related browsing; a negative result means the activity is
    consistent with the host's and peers' normal behavior.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Corporate network egress points, DNS resolvers, web proxies, and user workstations.'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nbaseline = per_host_domain_visit_counts(window=30d, scope=peer_group)\nFOR each host,\
      \ domain IN exploit_related_categories:\n  rarity = percentile_rank(visits, peer_group)\n  novelty\
      \ = passive_dns_score(ttl_variance, ip_asn_churn, lexical_improbability)\n  IF rarity >= 99.9 OR\
      \ first_seen_download(exploit_archive):\n     ALERT score=rarity+novelty"
- question: Did any host show a spike in HTTP 404 responses on repository/exploit paths or NXDOMAIN responses
    on rotating exploit-kit domains exceeding 3 sigma of its 30-day baseline while also fetching at least
    one exploit-related object?
  context: 'Automated exploit harvesting and stale exploit-kit links produce a distinctive failure signature:
    bursts of HTTP 404s on repository/exploit paths and NXDOMAIN responses on rotating kit domains. Profiling
    these error signals as their own features and alerting when a host''s failed-request rate exceeds
    3 sigma of its 30-day baseline - gated on the host also successfully fetching at least one exploit-related
    object - distinguishes deliberate, scripted exploit collection from ordinary mistyped URLs. A positive
    result strongly suggests automated harvesting against ephemeral or churned infrastructure; a negative
    result means failure rates are within normal variance.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Corporate network egress points, DNS resolvers, web proxies, and user workstations.'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nbaseline = per_host_failure_rate(window=30d)  // 404 on exploit paths + NXDOMAIN\nFOR\
      \ each host:\n  cur_fail = count(http_404 on exploit_paths) + count(dns_NXDOMAIN on kit_domains)\n\
      \  IF cur_fail > mean + 3*stddev(baseline)\n     AND exists(fetch of exploit_related_object):\n\
      \     ALERT 'Exploit-harvesting failure-rate spike'"
- question: When an exploit-acquisition classifier scores outbound sessions on download volume/ratio,
    request rate, domain reputation, MIME/type, and host role, which sessions score as likely exploit
    acquisition, and what top-3 features drove the score?
  context: A supervised Random Forest / gradient-boosted model (or an unsupervised Extended Isolation
    Forest over the same vectors) can fuse many weak outbound-session signals - download byte volume and
    ratio, requests per minute, domain prevalence/reputation, download MIME/type, and host role - into
    a single exploit-acquisition score that catches behavior no single rule would. Surfacing the top-3
    contributing features via SHAP/LIME (e.g., first-seen exploit domain, high download entropy, rare
    MIME) makes alerts triage-ready and explains why the model fired. Run it in parallel with the deterministic
    IOC/YARA floor so explainable ML extends, rather than replaces, the high-confidence rules. A high
    score with strong feature attribution flags probable exploit acquisition; a low score deprioritizes
    the session.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Corporate network egress points, DNS resolvers, web proxies, and user workstations.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\nfeatures = [dl_bytes, dl_ratio, req_per_min, domain_reputation,\n            download_mime,\
      \ host_role]\nmodel = RandomForest()  // or ExtendedIsolationForest (unsupervised)\nscore = model.predict_proba(features)\n\
      IF score > threshold:\n  top3 = shap_explain(model, features)[:3]\n  ALERT 'Exploit-acquisition\
      \ session' WITH top3\nRUN_PARALLEL deterministic_ioc_yara_floor"
- question: Are there file transfers whose filenames or hashes match exploit-PoC, exploit-kit, or CVE-referenced
    watchlists, and were those files subsequently unpacked or executed locally as seen in process-creation
    logs?
  context: Exploit material often arrives with telltale names (CVE-2024-1234*, poc*, *exploit*) or known-bad
    hashes. Monitoring Zeek files.log against exploit-PoC/kit/CVE watchlists and scanning extracted bodies
    with YARA detects the transfer; correlating with Windows Event ID 4688 / Sysmon Event ID 1 process-creation
    rules confirms the file was actually unpacked or executed on the receiving host. The execution step
    elevates the finding from 'a suspicious file crossed the wire' to 'a host is testing or weaponizing
    an exploit locally.' A positive result is strong evidence of hands-on exploit acquisition and preparation;
    a transfer with no follow-on execution warrants lower-priority review.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Web proxies, network taps at egress points, endpoint devices, and file servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nFROM zeek_files\nWHERE filename MATCHES /CVE-\\d{4}-\\d+/ OR filename MATCHES /(poc|exploit)/i\n\
      \   OR sha256 IN exploit_hash_watchlist\n   OR yara_scan(body,'signature-base/exploits') == MATCH\n\
      JOIN proc_create (WinEID 4688 / Sysmon 1)\n  ON dst_host AND file_path WITHIN 1h\nWHERE child_image\
      \ IN ('python.exe','powershell.exe','7z.exe','rar.exe',target_image)\nALERT 'Exploit file transferred\
      \ then executed locally'"
- question: Which hosts downloaded an exploit-related file type below the 5th prevalence percentile for
    their peer group, or with anomalous download byte-volume, against a 30-day baseline of MIME types,
    extensions, volume, and source domains?
  context: Baselining downloaded MIME types, file extensions, byte volume, and source domains per host
    group over 30 days reveals when a host pulls down a file type that is rare for its peers - a strong
    prior for maliciousness given how seldom normal users fetch exploit archives or scripts. Alerting
    below the 5th prevalence percentile, or on anomalous byte-volume, catches exploit acquisition that
    evades name/hash watchlists. Using fleet-wide rarity as a malice prior keeps the signal meaningful.
    A hit means the host's download deviates from peer norms in a way consistent with exploit retrieval;
    a negative result means the download matches common, expected file types.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Web proxies, network taps at egress points, endpoint devices, and file servers.'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nbaseline = per_host_group_dist(mime, ext, dl_bytes, source_domain, window=30d)\nFOR each\
      \ download:\n  prev = prevalence_percentile(mime/ext, peer_group)\n  IF prev < 5 OR dl_bytes outside\
      \ [p5,p95] of baseline:\n     ALERT 'Rare-MIME/source exploit download' score=1-prev/100"
- question: Does the per-host sequence of download events (HTTP GET -> file write -> process launch) contain
    low-probability transitions where a download leads to unusual unpacking or interpreter launches?
  context: 'A DeepLog-style per-host sequence model learns the normal log-key stream of download events
    - HTTP GET, file write, process launch - together with file sizes and source ASN. Exploit acquisition
    disrupts that learned order: a download that leads straight to an unexpected unpacking step or interpreter
    launch appears as a low-probability transition. Flagging the deviating step and reporting top contributing
    features gives the analyst the exact link in the chain to investigate. A positive result indicates
    a download workflow that does not match benign patterns and may represent exploit retrieval-and-test;
    a negative result means the download sequence is statistically routine.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Web proxies, network taps at egress points, endpoint devices, and file servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\nseq = per_host_logkey_stream(http_get -> file_write -> proc_launch)\n       + [file_size,\
      \ source_asn]\nmodel = DeepLog.train(benign_sequences)\nFOR each new event:\n  p = model.next_prob(event\
      \ | history)\n  IF p < anomaly_threshold:\n     ALERT 'Low-probability download->execute transition'\n\
      \            WITH deviating_step, top_features"
- question: Did the same non-research host both repeatedly request exploit databases/forums/marketplaces/repositories
    AND download files matching known exploit filenames or hashes within a short window?
  context: The combination of browsing and downloading is more telling than either alone. Correlating
    repeated requests to exploit databases, forums, marketplaces, and public repositories (Zeek dns.log/http.log)
    with exploit filenames/hashes in Zeek files.log - while applying structural Nazca download predicates
    - identifies hosts that both shop for and then retrieve exploit content. Restricting to non-research
    hosts removes sanctioned activity. A positive result shows a complete browse-and-acquire pattern on
    a host with no legitimate reason, a hallmark of Resource Development; a negative result (browse without
    download, or download without browse) is lower confidence and handled by the other methods.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: User subnets, VPN egress, and web proxy infrastructure.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nbrowse = SELECT host FROM zeek_dns,zeek_http\n         WHERE domain IN exploit_sites GROUP\
      \ BY host HAVING count>=N\ndownload = SELECT host FROM zeek_files\n           WHERE filename/hash\
      \ IN exploit_watchlist\n             AND nazca_structural_predicate==TRUE\nFROM browse JOIN download\
      \ USING(host)\nWHERE host.ou NOT IN ('security-research')\n  AND time_gap < short_window\nALERT\
      \ 'Non-research host browsed AND downloaded exploit content'"
- question: Which users/hosts exceeded their 30-day exploit-browsing/download baseline - via request frequency
    over the 95th percentile, first-time access to exploit material, or elevated 404/NXDOMAIN failure
    rates - when these weak signals are fused with Directed Anomaly Scoring?
  context: Baselining exploit-related browsing and download counts per user/host over 30 days lets you
    flag frequency spikes (>N requests/min or above the 95th percentile), first-time access to exploit
    material, and elevated 404/NXDOMAIN rates that betray automated harvesting. Individually these are
    weak signals; fusing them with budget-bounded Directed Anomaly Scoring keeps daily alert volume manageable
    while still surfacing the highest-ranked anomalies. Derive N and percentile cutoffs from local proxy
    volume. A positive result identifies a host whose combined exploit-related behavior is anomalous relative
    to itself and its peers; a negative result means the activity stays within expected bounds.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: User subnets, VPN egress, and web proxy infrastructure.'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nbaseline = per_host_exploit_activity(window=30d)\nsignals = {\n  freq: requests_per_min\
      \ > p95 OR > N,\n  novelty: first_time_access(exploit_material),\n  failure: rate(404+NXDOMAIN)\
      \ elevated\n}\nscore = directed_anomaly_score(signals, budget=daily_alert_cap)\nIF score in top_ranked:\
      \ ALERT 'Anomalous exploit browse/download'"
- question: Do per-host event sequences (exploit-related DNS/HTTP -> file transfer -> local process launch)
    form low-probability browse-to-download workflows when scored by a temporal LSTM?
  context: A temporal LSTM trained over per-host event sequences captures the normal ordering of DNS/HTTP
    requests, file transfers, and local process launches. Exploit-discovery workflows - browsing exploit
    pages, transferring a file, then launching something against it - produce low-probability sequences
    the model flags. Optionally pre-ranking candidate pages cheaply with static HTML/JS/URL features (Prophiler)
    focuses the model on likely-malicious pages, and surfacing contributing features makes the alert actionable.
    A positive result indicates a browse-to-download chain that diverges from learned benign behavior;
    a negative result means the sequence is statistically ordinary.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: User subnets, VPN egress, and web proxy infrastructure.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\nseq = per_host(exploit_dns/http -> file_transfer -> proc_launch)\nmodel = LSTM.train(benign_host_sequences)\n\
      candidates = prophiler_static_prefilter(pages)  // optional cheap rank\nFOR seq IN candidates:\n\
      \  if model.sequence_logprob(seq) < threshold:\n     ALERT 'Low-probability exploit-discovery workflow'\
      \ WITH features"
- question: Has a non-research host completed the full chain - visiting an exploit-disclosure/repository
    domain, downloading an exploit script or archive, then launching python.exe, powershell.exe, or an
    archive utility against that downloaded file?
  context: Stateful tracking of the complete browse-download-execute chain is the highest-confidence indicator
    of hands-on exploit acquisition. Alerting when a non-research host visits exploit-disclosure or repository
    domains, downloads an exploit script/archive, and then launches a local interpreter (python.exe, powershell.exe)
    or archive utility against that specific downloaded file - tying SigmaHQ process-creation/parent-child
    rules to Zeek files.log and Nazca structural predicates - links network intent to endpoint action
    on a single file. A positive result is a near-complete exploit-preparation story on a host with no
    legitimate research role; a partial chain is escalated by the weighted-scoring and ML methods.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, developer environments, web proxies, and DNS servers.'
  range: 'Last 90 days (event-centered: correlate across the browse-download-execute window per host)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nSTATEFUL per host WHERE host.ou NOT IN ('security-research'):\n  S1 = visit(exploit_disclosure/repo_domain)\
      \        // zeek_dns/http\n  S2 = download(exploit_script/archive)             // zeek_files + nazca_predicate\n\
      \  S3 = proc_create child IN ('python.exe','powershell.exe','7z.exe','rar.exe')\n         WITH cmdline\
      \ REFERENCES S2.file_path        // WinEID 4688 / Sysmon 1\n  IF S1 -> S2 -> S3 within window:\n\
      \     ALERT 'Full browse-download-execute exploit chain'"
- question: Which hosts/users exceeded 3 sigma of their personal baseline or 2 sigma of the peer-group
    baseline on a weighted score of first-seen exploit domains, exploit downloads (and byte volume), failed-request
    bursts, and high-entropy interpreter launches?
  context: This method assigns weights to the individual building blocks of exploit acquisition - first-seen
    exploit domains, exploit-related downloads and their byte volume, failed-request bursts, and interpreter
    launches with high-entropy command lines - and alerts when a host/user exceeds 3 sigma of its personal
    baseline or 2 sigma of the peer-group baseline. Ranking events with non-parametric Directed Anomaly
    Scoring keeps daily alert volume bounded while still elevating the most anomalous combinations. It
    catches exploit-acquisition stories where no single step trips a deterministic rule. A positive result
    indicates a host whose combined weighted behavior is statistically extreme; a negative result means
    it remains within baseline tolerances.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, developer environments, web proxies, and DNS servers.'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nscore = w1*first_seen_exploit_domain + w2*exploit_download(bytes)\n      + w3*failed_request_burst\
      \ + w4*high_entropy_interpreter_cmdline\nself = zscore(score, host_personal_baseline_30d)\npeer\
      \ = zscore(score, peer_group_baseline_30d)\nranked = directed_anomaly_score(events, budget=daily_cap)\n\
      IF self > 3 OR peer > 2: ALERT 'Weighted exploit-acquisition anomaly'"
- question: Do live host browse-download-execute or process/system-call sequences score with very low
    log-likelihood under an HMM/LSTM trained on benign behavior, and what is the deviating transition?
  context: Training a Hidden Markov Model or LSTM on benign browse-download-execute and process/system-call
    sequences yields a model of normal host behavior; scoring live streams and flagging sequences with
    very low log-likelihood surfaces likely exploit-acquisition behavior that no signature anticipates.
    Reporting the deviating transition plus the top-3 contributing features (via SHAP) tells the analyst
    exactly where and why the sequence broke from normal. This complements the deterministic chain rule
    by catching novel variants. A very low log-likelihood with a clear deviating transition indicates
    probable exploit acquisition; a high-likelihood sequence is consistent with benign activity.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, developer environments, web proxies, and DNS servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\nmodel = HMM_or_LSTM.train(benign_browse_download_execute + syscall_seqs)\nFOR live_seq\
      \ IN host_streams:\n  ll = model.log_likelihood(live_seq)\n  IF ll < very_low_threshold:\n     dev\
      \ = argmin_transition_prob(live_seq)\n     ALERT 'Low-likelihood exploit-acquisition sequence'\n\
      \            WITH dev, shap_top3(live_seq)"
