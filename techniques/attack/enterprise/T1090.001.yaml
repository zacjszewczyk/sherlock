- question: 'Using deterministic rule logic, can you determine whether ''Flag port/protocol mismatches''
    indicates internal proxy / relay C2 activity? Specifically: Trigger when Zeek conn.log shows a ''service''
    value of ''ssl'', ''http'', or ''unknown'' on a destination port where that service is unexpected
    (e.g., 135/rpc, 445/smb, 3389/rdp). Corroborate relay tunnels by fingerprinting the TLS stack with
    [JA3/JA3S](https://github.com/salesforce/ja3) — a non-browser/non-host-appropriate JA3 on an internal
    host is a strong relay indicator — and by matching SMB named-pipe relay traffic with [BZAR](https://github.com/mitre-attack/bzar).'
  context: 'Tactic context (Command and Control): the adversary communicates with compromised systems
    to control them, and uses an internal host as a proxy to relay C2 between systems while concealing
    the true destination and blending into trusted east-west paths. Evidence under investigation: A network
    connection recorded in Zeek conn.log shows a mismatch between the destination port''s IANA-assigned
    protocol and the dynamically analyzed protocol in the ''service'' field, or the connection''s payload
    exhibits unusually high entropy for that port. Approach (Flag port/protocol mismatches): Trigger when
    Zeek conn.log shows a ''service'' value of ''ssl'', ''http'', or ''unknown'' on a destination port
    where that service is unexpected (e.g., 135/rpc, 445/smb, 3389/rdp). Corroborate relay tunnels by
    fingerprinting the TLS stack with [JA3/JA3S](https://github.com/salesforce/ja3) — a non-browser/non-host-appropriate
    JA3 on an internal host is a strong relay indicator — and by matching SMB named-pipe relay traffic
    with [BZAR](https://github.com/mitre-attack/bzar). A positive result means an internal host is exhibiting
    relay/proxy behavior inconsistent with its normal role (e.g., proxy-tool execution, fan-in/fan-out
    funneling, port/protocol mismatch, novel long-lived peer links, or unauthorized NAT/forwarding rules);
    a negative result means the observed activity matches established baselines and authorized gateways.
    Investigate the named area of interest (Internal Network Segments (East-West Traffic), Network Egress
    Points, Server VLANs, DMZ) and pivot from any hit to the relaying process, account, the internal sources
    being funneled, and the upstream/external destination to scope the C2 relay chain.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Internal Network Segments (East-West Traffic), Network Egress Points, Server VLANs, DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Flag port/protocol mismatches\nMATCH zeek_conn.log\n  WHERE\
      \ service IN {'ssl','http','unknown'}\n    AND dest_port IN unexpected_for_service {135/rpc, 445/smb,\
      \ 3389/rdp, ...}\nCORROBORATE:\n  - JA3/JA3S TLS fingerprint not browser/host-appropriate on an\
      \ internal host (strong relay indicator)\n  - SMB named-pipe relay traffic matched via BZAR\nALERT\
      \ on port/protocol mismatch"
- question: 'Using statistical baselining, can you determine whether ''Detect payload entropy and volume
    outliers'' indicates internal proxy / relay C2 activity? Specifically: Per common destination port,
