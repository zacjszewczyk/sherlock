- question: 'Using deterministic rule logic, can you determine whether ''Detect port-forward command usage''
    indicates internal proxy / relay C2 activity? Specifically: Scan command-line arguments (Windows 4688
    / Sysmon EID 1, auditd execve) for port-forward/proxy patterns — ''interface portproxy add'', ''ssh
    -L'', ''ssh -R'', ''ssh -D'', ''plink.exe -L'', ''socat TCP-LISTEN'', ''ncat --sh-exec'', ''chisel'',
    ''frpc'' — using the maintained rule set in [SigmaHQ](https://github.com/SigmaHQ/sigma). Alert on
    first occurrence per host outside the admin/jump-server allowlist.'
