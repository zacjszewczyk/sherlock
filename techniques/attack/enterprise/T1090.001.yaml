name: 'T1090.001: Internal Proxy'
id: 0bb27843-48f7-409d-9021-6daacbd993bb
description: 'This playbook helps an analyst determine whether an adversary is using an internal system
  as a proxy to relay Command and Control traffic between compromised hosts (T1090.001 Internal Proxy).
  Adversaries redirect C2 through internal proxies/port-redirectors (e.g., HTRAN, ZXProxy, ZXPortMap,
  socat, ncat/nc, plink, chisel, frp, ssh -L/-R/-D, netsh portproxy) to conceal the true destination of
  traffic, reduce outbound connections, ride trusted peer-to-peer paths (often SMB/DCE-RPC), and add resiliency.
  Investigative angles include: execution of known relay/port-forward tooling and command-line patterns
  on Windows, Linux (auditd), macOS, ESXi, and network devices; east-west relay shapes where one non-gateway
  host accepts many inbound internal connections and funnels them to few upstream destinations (fan-in/fan-out);
  port/protocol mismatches and high-entropy payloads in Zeek conn.log/ssl.log; novel long-duration host-to-host
  tuples that break a 30-day baseline; and firewall/NAT/proxy rule changes that bridge trust zones. Detection
  blends symbolic-logic rules, statistical baselining (Volume/Frequency/State physics-of-traffic metrics,
  percentiles, 3-sigma, Jaccard novelty, periodicity/beaconing analysis), and machine learning (autoencoder
  reconstruction error, graph centrality change-point detection, and temporal link prediction) to produce
  evasion-resistant, explainable alerts for the Command and Control tactic.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
