- question: 'Using a machine-learning model, can you determine whether ''Proxy-relay behavior classifier''
    indicates internal proxy / relay C2 activity? Specifically: Train a classifier on process-tree features
    and aggregated east-west connection statistics (fan-out, byte ratio, edge rarity, peer novelty) to
    distinguish benign admin tunnels from malicious internal proxies, following the PCA/k-means/MAD ensemble
    of [Bohara et al.](https://mnoureddine.com/files/17BOH01.pdf) and the temporal link-prediction approach
    of [EULER](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf). Surface the top-3
    contributing features (e.g., fan-out, new-peer edge probability, relay byte volume) in the alert text
    so analysts can triage without re-deriving the score.'
