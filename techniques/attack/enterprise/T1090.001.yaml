questions:
- question: 'Using deterministic rule logic, can you determine whether ''Proxy-tool execution and relay
    match'' indicates internal proxy / relay C2 activity? Specifically: Correlate process creation (Sysmon
    EID 1 / Windows 4688, auditd execve, ESXi shell.log, macOS unifiedlog) for known relay tools (HTRAN,
    ZXProxy, socat, ncat/nc, plink, chisel, frp, ssh) or scripts with Zeek conn.log records showing the
    SAME host accepting >=3 inbound internal connections and forwarding to other internal destinations
    within 5 minutes. Match SMB/DCE-RPC relay and admin-share/named-pipe brokering with [BZAR](https://github.com/mitre-attack/bzar)
    Zeek analytics, and port-forward command lines with [SigmaHQ](https://github.com/SigmaHQ/sigma). Alert
    when a host opens a listener or brokers traffic for endpoints that normally communicate directly.'
  context: 'Tactic context (Command and Control): the adversary communicates with compromised systems
    to control them, and uses an internal host as a proxy to relay C2 between systems while concealing
    the true destination and blending into trusted east-west paths. Evidence under investigation: Internal
    proxy use appears when one host relays traffic for another or when a proxy tool begins listening on
    an internal interface and forwarding connections to other internal destinations. The evidence is a
    combination of a proxy-like process, repeated east-west connections through the same host, and unusual
    fan-out or chaining behavior inside the enterprise network. Approach (Proxy-tool execution and relay
    match): Correlate process creation (Sysmon EID 1 / Windows 4688, auditd execve, ESXi shell.log, macOS
    unifiedlog) for known relay tools (HTRAN, ZXProxy, socat, ncat/nc, plink, chisel, frp, ssh) or scripts
    with Zeek conn.log records showing the SAME host accepting >=3 inbound internal connections and forwarding
    to other internal destinations within 5 minutes. Match SMB/DCE-RPC relay and admin-share/named-pipe
    brokering with [BZAR](https://github.com/mitre-attack/bzar) Zeek analytics, and port-forward command
    lines with [SigmaHQ](https://github.com/SigmaHQ/sigma). Alert when a host opens a listener or brokers
    traffic for endpoints that normally communicate directly. A positive result means an internal host
    is exhibiting relay/proxy behavior inconsistent with its normal role (e.g., proxy-tool execution,
    fan-in/fan-out funneling, port/protocol mismatch, novel long-lived peer links, or unauthorized NAT/forwarding
    rules); a negative result means the observed activity matches established baselines and authorized
    gateways. Investigate the named area of interest (Workstations, Application Servers, Domain Controllers,
    Network Egress Points) and pivot from any hit to the relaying process, account, the internal sources
    being funneled, and the upstream/external destination to scope the C2 relay chain.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Workstations, Application Servers, Domain Controllers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Proxy-tool execution and relay match\nMATCH process_creation\
      \  // Sysmon EID1 / Win 4688 / auditd execve / esxi shell.log / macos unifiedlog\n  WHERE image\
      \ OR cmdline MATCHES relay_tools {HTRAN,ZXProxy,socat,ncat/nc,plink,chisel,frp,ssh} OR scripts\n\
      JOIN zeek_conn.log AS f ON f.host = process.host\nWHERE host accepts >=3 inbound internal conns\n\
      \  AND forwards to other internal destinations within 5m\nCORROBORATE SMB/DCE-RPC + admin-share/named-pipe\
      \ brokering via BZAR; port-forward cmdlines via SigmaHQ\nALERT when host opens a listener or brokers\
      \ traffic for endpoints that normally talk directly"
- question: 'Using statistical baselining, can you determine whether ''Internal relay burst anomaly''
    indicates internal proxy / relay C2 activity? Specifically: Per host, baseline three physics-of-traffic
    metrics over 30 days — Volume (relayed byte totals and in/out byte ratio), Frequency (inbound internal
    connections per minute and distinct internal peers per hour), and State (count of blocked/RST/failed
    connections). Following [Bohara et al.](https://mnoureddine.com/files/17BOH01.pdf), flag hosts whose
    east-west fan-out or relay byte volume exceeds the 95th percentile or 3-sigma threshold after a relay-like
    process starts; treat a simultaneous spike in failed/RST connections as a distinct corroborating signal
    of scanning/relay setup. Combine with FFT/dispersion periodicity scoring of the relayed flows from
    [RITA](https://github.com/activecm/rita).'
