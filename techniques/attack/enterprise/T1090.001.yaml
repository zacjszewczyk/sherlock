- question: 'Using statistical baselining, can you determine whether ''Flag novel utility arguments''
    indicates internal proxy / relay C2 activity? Specifically: For each host and common utility (e.g.,
    ''netsh.exe'', ''ssh.exe''), build a historical set of unique command-line argument tokens. For each
    new execution, compute the Jaccard similarity between its tokens and the historical set and alert
    below 0.2 (novel usage). Additionally profile State: count failed/aborted port-forward setups (e.g.,
    bind/permission errors in companion logs) per host as a distinct early-setup signal.'
