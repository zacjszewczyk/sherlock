name: 'T1204.004: Malicious Copy and Paste'
id: 4df8c81c-1d0e-4adb-9694-9f72aa7e001f
description: 'This playbook helps an analyst investigate Malicious Copy and Paste (T1204.004), the "ClickFix"
  social-engineering chain in which a user is tricked by a fake error message, CAPTCHA prompt, drive-by
  web page, or phishing attachment into copying an obfuscated command and pasting it into a command interpreter
  (PowerShell, cmd, mshta, the Windows Run dialog, or a macOS/Linux terminal) to gain code execution.
  Under the Execution tactic, it guides the hunt across the full post-paste behavioral chain on Windows,
  macOS, and Linux: command interpreters spawned shortly after browser/email/document activity carrying
  IOC-matching, Living-off-the-Land download/decode one-liners (mshta, certutil -urlcache, msiexec, curl,
  bitsadmin, PowerShell download cradles, base64-encoded payloads); anomalously long or high-entropy command
  lines for a given parent-child context; interpreter processes immediately followed by outbound connections
  to rare destinations or threat-intel hits consistent with a download cradle reaching staging or C2;
  explorer.exe and Win+R Run-dialog artifacts (the RunMRU registry key) recording pasted commands; malicious
  web pages staging clipboard content via JavaScript (navigator.clipboard.writeText, document.execCommand(''copy''))
  observable in proxy/NSM telemetry before execution; and the cross-platform terminal pipe-to-shell pattern
  (curl/wget | bash, base64 -d) followed by transient file drops and immediate egress. Detection methods
  combine symbolic-logic rules, statistical baselining (entropy, command-length percentiles, DNS rarity,
  drop-to-egress timing), and machine learning (obfuscation classifiers, Isolation Forest, embedding-based
  outlier detection) applied to Windows Security/Sysmon/PowerShell logs, the RunMRU registry, auditd and
  macOS unified logs, web proxy content, and Zeek/Sysmon network telemetry, so the analyst can corroborate
  a suspected copy-paste compromise across process lineage, command content, user-interaction context,
  and network egress.'
type: technique
