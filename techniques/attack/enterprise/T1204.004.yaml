questions:
- question: '[Execution] IOC detection in pasted commands: Can you determine whether a command-line interpreter
    such as powershell.exe, cmd.exe, or mshta.exe is created shortly after user interaction with a browser,
    email client, or document reader, and its command line contains a known malicious indicator (domain,
    IP, hash) or a Living-off-the-Land download/decode invocation consistent with a pasted ClickFix one-liner.
    -- specifically, using the ''IOC detection in pasted commands'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary relies on a user being
    socially engineered into copying and pasting an obfuscated command into a command interpreter (the
    ClickFix technique) to gain execution while bypassing email filtering, browser sandboxing, and download-based
    controls. This evidence focuses on the condition that a command-line interpreter such as powershell.exe,
    cmd.exe, or mshta.exe is created shortly after user interaction with a browser, email client, or document
    reader, and its command line contains a known malicious indicator (domain, IP, hash) or a Living-off-the-Land
    download/decode invocation consistent with a pasted ClickFix one-liner. This Symbolic Logic approach
    looks for the following signal: Query Windows Event ID 4688 / Sysmon Event ID 1 command lines for
    known malicious hashes, domains, and IPs from TI feeds, and for LOLBin invocation syntax (mshta, certutil
    -urlcache, msiexec, curl/bitsadmin) catalogued in [LOLBAS](https://lolbas-project.github.io/); alert
    on matches, especially when the interpreter is launched within 60s of browser/email/Office activity
    consistent with the [ClickFix copy-paste chain](https://www.proofpoint.com/us/blog/threat-insight/security-brief-clickfix-social-engineering-technique-floods-threat-landscape),
    and log the event for SOC follow-up. A positive result -- a rule match, statistical outlier, or model
    alert -- suggests that a user pasted and executed adversary-supplied code, giving the actor a foothold;
    pivot to the responsible interpreter process, its parent lineage (browser/email/Office/explorer/terminal),
    the user and session context, the full command line and any RunMRU/clipboard artifact, dropped files
    in %TEMP%/%APPDATA%//tmp/~/Library, and any subsequent outbound connection to staging or C2. A negative
    result helps rule out this copy-paste execution vector for the window examined but should be corroborated
    with the other questions in this playbook, since a single method can miss heavily obfuscated, low-and-slow,
    or living-off-the-land pastes.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek dns.log
  - Sysmon Event ID 1
  - 'NAI: User workstations, Developer endpoints, Administrative jump boxes, Virtual Desktop Infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# IOC detection in pasted commands

      source IN [Windows Event ID 4688, Windows Event ID 4104, Zeek dns.log, Sysmon Event ID 1]

      | WHERE matches_action_criteria("IOC detection in pasted commands")

      // Query Windows Event ID 4688 / Sysmon Event ID 1 command lines for known malicious hashes, domains,
      and IPs from TI feeds

      | ALERT enrich(host, user, process, parent, cmdline, file, dest)'
  - technology: Zeek/pseudocode
    query: '# ClickFix interpreter-to-egress correlation

      conn.log, dns.log, http.log, files.log

      | JOIN interpreter exec (host/process) to outbound flows on (id.orig_h, time-window <=5s)

      | AGG dest rarity, NXDOMAIN/failed conns, JA3/JA4, orig_bytes per (id.orig_h)

      | flag rare/new/blocked destinations from pasted-command interpreters per action criteria'
- question: '[Execution] Low-frequency DNS follow-up with failure profiling: Can you determine whether
    a command-line interpreter such as powershell.exe, cmd.exe, or mshta.exe is created shortly after
    user interaction with a browser, email client, or document reader, and its command line contains a
    known malicious indicator (domain, IP, hash) or a Living-off-the-Land download/decode invocation consistent
    with a pasted ClickFix one-liner. -- specifically, using the ''Low-frequency DNS follow-up with failure
    profiling'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary relies on a user being
    socially engineered into copying and pasting an obfuscated command into a command interpreter (the
    ClickFix technique) to gain execution while bypassing email filtering, browser sandboxing, and download-based
    controls. This evidence focuses on the condition that a command-line interpreter such as powershell.exe,
    cmd.exe, or mshta.exe is created shortly after user interaction with a browser, email client, or document
    reader, and its command line contains a known malicious indicator (domain, IP, hash) or a Living-off-the-Land
    download/decode invocation consistent with a pasted ClickFix one-liner. This Statistical Method approach
    looks for the following signal: Extract domains from interpreter command lines, correlate with Zeek
    dns.log within 60 seconds, and flag domains in the bottom 5th percentile of enterprise frequency;
    separately profile NXDOMAIN/no-answer responses and blocked connections in the same window as distinct
    ClickFix staging-failure signals per [ReliaQuest](https://www.reliaquest.com/blog/clickfix-overcoming-detection-challenges/),
    deriving the percentile from your own 90-day DNS baseline. A positive result -- a rule match, statistical
    outlier, or model alert -- suggests that a user pasted and executed adversary-supplied code, giving
    the actor a foothold; pivot to the responsible interpreter process, its parent lineage (browser/email/Office/explorer/terminal),
    the user and session context, the full command line and any RunMRU/clipboard artifact, dropped files
    in %TEMP%/%APPDATA%//tmp/~/Library, and any subsequent outbound connection to staging or C2. A negative
    result helps rule out this copy-paste execution vector for the window examined but should be corroborated
    with the other questions in this playbook, since a single method can miss heavily obfuscated, low-and-slow,
    or living-off-the-land pastes.'
