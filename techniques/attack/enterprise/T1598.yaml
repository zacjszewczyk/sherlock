questions:
- question: '[Reconnaissance] Match inbound email metadata and URLs against threat intel, and treat authentication
    failure as a deterministic indicator: Can you determine whether an incoming email contains metadata
    (sender IP, sender domain) or content (embedded URLs) that matches a high-confidence threat intelligence
    feed of known phishing indicators -- specifically, using the ''Match inbound email metadata and URLs
    against threat intel, and treat authentication failure as a deterministic indicator'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), the adversary sends phishing messages
    to trick targets into divulging sensitive information (credentials, payroll/PII, org charts) rather
    than to execute code, so the objective is data elicitation that feeds later targeting. This evidence
    focuses on the condition that an incoming email contains metadata (sender IP, sender domain) or content
    (embedded URLs) that matches a high-confidence threat intelligence feed of known phishing indicators.
    This Symbolic Logic approach works as follows: Create a rule to query all inbound emails. For each
    email, compare the sender IP (`id.orig_h` in `Zeek conn.log`), sender domain (`from` field in `Zeek
    smtp.log`), and any extracted URLs from the email body against a high-confidence threat-intelligence
    feed of known malicious indicators; generate a high-severity alert on any match. Layer this with the
    deterministic authentication floor: also alert when the message fails or is misaligned under RFC 7208
    SPF / RFC 7489 DMARC, since attackers reuse infrastructure faster than feeds update and authentication
    catches exact-domain spoofs. Failure-mode signal: log and weight `NXDOMAIN`/SERVFAIL responses (`Zeek
    dns.log`) and HTTP 4xx/blocked-connection results (`Zeek http.log`/proxy) for any embedded URL, which
    indicate take-down or sinkholed credential-harvesting pages and corroborate maliciousness (End-to-End
    Measurements of Email Spoofing Attacks). A positive result -- a rule match, a statistical outlier,
    or a model alert -- indicates probable phishing-for-information activity; pivot to the sender identity
    (IP, domain, display name, authentication results), the recipient(s) and whether they are high-value
    targets, the message content/URLs/requested data, and any subsequent user interaction or outbound
    activity to scope the elicitation attempt. A negative result helps rule out this particular vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, text-only, look-alike, or compromised-account phishing that passes authentication. Source
    citations for this detection method: [RFC 7208 SPF](https://www.rfc-editor.org/rfc/rfc7208); [RFC
    7489 DMARC](https://www.rfc-editor.org/rfc/rfc7489); [End-to-End Measurements of Email Spoofing Attacks](https://www.usenix.org/conference/usenixsecurity18/presentation/hu).'
