name: 'T1598: Phishing for Information'
id: 2efc26d6-b4fd-4a26-95c8-6bf4d7199283
description: 'This playbook helps an analyst investigate whether an adversary is conducting phishing for
  information (MITRE ATT&CK T1598, Phishing for Information) -- electronically delivered social engineering
  whose objective is to elicit sensitive data (credentials, payroll/W-2 and PII, org charts, or a callback
  phone number for vishing) rather than to execute malicious code. It spans the full elicitation lifecycle
  observable in email and network telemetry: inbound messages whose sender metadata or embedded URLs match
  threat intelligence; messages that fail SPF/DKIM/DMARC authentication, originate from newly registered
  domains, or use typosquatted/look-alike and homoglyph sender domains; high fan-out bursts from a single
  low-history sender to many internal recipients; targeted lures to high-value targets using reply-style
  spoofing, urgency keywords, and display-name impersonation; text-only solicitations with no URL or attachment
  that evade link/attachment scanners; and the downstream chain where a user interacts with a lure and
  then sends anomalous outbound email or data transfers. Detection methods combine deterministic symbolic-logic
  rules (threat-intel matching, SPF/DKIM/DMARC and header validation, look-alike domain rules, fan-out
  thresholds, stateful inbound-to-outbound correlation, credential/PII solicitation regex), statistical
  baselining (domain rarity and WHOIS-age percentiles, fan-out and failed-recipient ratios, sender-domain
  entropy, per-user volume and stylometric profiles), and machine learning (impersonation/lookalike scoring,
  Siamese-CNN homoglyph embeddings, time-series volume anomaly detection, sequence models over the inbound-to-exfil
  chain, and explainable NLP intent classifiers). It draws on Zeek smtp/dns/http/conn/files logs, email
  gateway logs, and Windows endpoint events (4688, 4663, 4625) so the analyst can corroborate suspected
  elicitation against sender reputation, domain age, recipient targeting, message content, and subsequent
  user behavior.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
