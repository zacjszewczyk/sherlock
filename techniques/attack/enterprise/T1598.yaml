- question: '[Reconnaissance] Threshold rule on unique-recipient fan-out per source: Can you determine
    whether a single external source (IP or domain) sends emails to a statistically significant number
    of unique internal recipients over a short period (e.g., one hour), where the source has no or very
    limited prior communication history with the organization -- specifically, using the ''Threshold rule
    on unique-recipient fan-out per source'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), the adversary sends phishing messages
    to trick targets into divulging sensitive information (credentials, payroll/PII, org charts) rather
    than to execute code, so the objective is data elicitation that feeds later targeting. This evidence
    focuses on the condition that a single external source (IP or domain) sends emails to a statistically
    significant number of unique internal recipients over a short period (e.g., one hour), where the source
    has no or very limited prior communication history with the organization. This Symbolic Logic approach
    works as follows: Create a threshold-based rule that alerts when a single source IP (`id.orig_h` in
    `Zeek conn.log`) or sender domain (`from` in `Zeek smtp.log`) sends to more than 50 unique internal
    recipients (`rcpt_to`) within a 60-minute window. Tune thresholds to organizational baselines. Mass
    credential-harvesting and targeted campaigns are temporally clustered, justifying short-window burst
    rules (Who is Targeted by Email-Based Phishing). A positive result -- a rule match, a statistical
    outlier, or a model alert -- indicates probable phishing-for-information activity; pivot to the sender
    identity (IP, domain, display name, authentication results), the recipient(s) and whether they are
