- question: '[Reconnaissance] Reject authentication failures, ambiguous headers, spoofed replies, and
    look-alike sender domains: Can you determine whether an incoming email either fails DMARC/SPF/DKIM
    authentication, originates from a domain registered within the last 30 days (Newly Registered Domain),
    or uses a typosquatted/look-alike domain visually similar to the organization''s or a trusted partner''s
    domain -- specifically, using the ''Reject authentication failures, ambiguous headers, spoofed replies,
    and look-alike sender domains'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), the adversary sends phishing messages
    to trick targets into divulging sensitive information (credentials, payroll/PII, org charts) rather
    than to execute code, so the objective is data elicitation that feeds later targeting. This evidence
    focuses on the condition that an incoming email either fails DMARC/SPF/DKIM authentication, originates
    from a domain registered within the last 30 days (Newly Registered Domain), or uses a typosquatted/look-alike
    domain visually similar to the organization''s or a trusted partner''s domain. This Symbolic Logic
    approach works as follows: Validate the email''s authentication results and headers, including RFC
    7208 SPF, DKIM, RFC 7489 DMARC alignment, subject prefix, and `In-Reply-To`/`References` consistency.
    Per Composition Kills, re-parse and normalize headers and flag messages with multiple/ambiguous `From`
    headers or RFC5321(envelope)-vs-RFC5322(header) From mismatches rather than trusting a single ''pass''
    verdict. Flag any message that claims to be a reply but lacks a valid conversation chain, or whose
    sender domain matches a look-alike pattern (character omission/insertion/substitution/permutation,
    homophone, or TLD swap) per the The Landscape of Domain Name Typosquatting taxonomy. A positive result
    -- a rule match, a statistical outlier, or a model alert -- indicates probable phishing-for-information
    activity; pivot to the sender identity (IP, domain, display name, authentication results), the recipient(s)
    and whether they are high-value targets, the message content/URLs/requested data, and any subsequent
    user interaction or outbound activity to scope the elicitation attempt. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, text-only, look-alike, or compromised-account phishing that passes
    authentication. Source citations for this detection method: [RFC 7208 SPF](https://www.rfc-editor.org/rfc/rfc7208);
    [RFC 7489 DMARC](https://www.rfc-editor.org/rfc/rfc7489); [Composition Kills](https://www.usenix.org/conference/usenixsecurity20/presentation/chen-jianjun);
    [The Landscape of Domain Name Typosquatting](https://arxiv.org/abs/1603.02767).'
