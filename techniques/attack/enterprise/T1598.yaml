- question: '[Reconnaissance] Score inbound emails with an impersonation/lookalike model and surface the
    top contributing features: Can you determine whether an incoming email contains metadata (sender IP,
    sender domain) or content (embedded URLs) that matches a high-confidence threat intelligence feed
