- question: '[Reconnaissance] Score the rarity of embedded/sender domains using first-party query history:
    Can you determine whether an incoming email contains metadata (sender IP, sender domain) or content
    (embedded URLs) that matches a high-confidence threat intelligence feed of known phishing indicators
    -- specifically, using the ''Score the rarity of embedded/sender domains using first-party query history''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), the adversary sends phishing messages
    to trick targets into divulging sensitive information (credentials, payroll/PII, org charts) rather
    than to execute code, so the objective is data elicitation that feeds later targeting. This evidence
    focuses on the condition that an incoming email contains metadata (sender IP, sender domain) or content
    (embedded URLs) that matches a high-confidence threat intelligence feed of known phishing indicators.
    This Statistical Method approach works as follows: For domains observed in `Zeek dns.log`/email URLs
    that are not on an organizational allowlist, calculate historical query frequency across the enterprise
    over the last 90 days. A domain with a query count below the 5th percentile that appears in an email
    is rare and suspicious; increase suspicion if its TLD is also statistically rare for the organization.
    Combine domain rarity with a click-reputation count (distinct internal users who have previously visited
    the domain) as in Detecting Credential Spearphishing Attacks in Enterprise Settings, and elevate priority
    during temporally clustered bursts of first-contact senders, which Who is Targeted by Email-Based
    Phishing shows characterize targeted campaigns. A positive result -- a rule match, a statistical outlier,
    or a model alert -- indicates probable phishing-for-information activity; pivot to the sender identity
    (IP, domain, display name, authentication results), the recipient(s) and whether they are high-value
    targets, the message content/URLs/requested data, and any subsequent user interaction or outbound
    activity to scope the elicitation attempt. A negative result helps rule out this particular vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, text-only, look-alike, or compromised-account phishing that passes authentication. Source
    citations for this detection method: [Detecting Credential Spearphishing Attacks in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho);
    [Who is Targeted by Email-Based Phishing](https://research.google/pubs/who-is-targeted-by-email-based-phishing-and-malware-measuring-factors-that-differentiate-risk/).'
