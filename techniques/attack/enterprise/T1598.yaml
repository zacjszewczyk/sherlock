  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), the adversary sends phishing messages
    to trick targets into divulging sensitive information (credentials, payroll/PII, org charts) rather
    than to execute code, so the objective is data elicitation that feeds later targeting. This evidence
    focuses on the condition that an incoming email contains metadata (sender IP, sender domain) or content
    (embedded URLs) that matches a high-confidence threat intelligence feed of known phishing indicators.
    This Machine Learning approach works as follows: Score each email using sender IP/domain reputation,
    domain age, ASN, TLD, phishing keywords, Levenshtein distance to internal domains, and whether the
    sender has prior communication history, following the impersonation feature families of Detecting
    Credential Spearphishing Attacks in Enterprise Settings and the visual lookalike embedding of Detecting
    Homoglyph Attacks with a Siamese Neural Network. An email scoring above a dynamically tuned threshold
    (e.g., 0.85) is quarantined or flagged. The alert MUST surface the top-3 contributing features (e.g.,
    ''display name matches a known executive but From address never seen before'', ''domain registered
    4 days ago'', ''URL domain 1 edit from corp domain'') for analyst triage. A positive result -- a rule
    match, a statistical outlier, or a model alert -- indicates probable phishing-for-information activity;
    pivot to the sender identity (IP, domain, display name, authentication results), the recipient(s)
    and whether they are high-value targets, the message content/URLs/requested data, and any subsequent
    user interaction or outbound activity to scope the elicitation attempt. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, text-only, look-alike, or compromised-account phishing that passes
    authentication. Source citations for this detection method: [Detecting Credential Spearphishing Attacks
    in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho);
    [Detecting Homoglyph Attacks with a Siamese Neural Network](https://arxiv.org/abs/1805.09738).'
