name: 'T1499.002: Service Exhaustion Flood'
id: f8eb8d92-64b8-4e5f-8dd3-855bf703f194
description: 'This playbook helps an analyst investigate a suspected Service Exhaustion Flood (T1499.002)
  endpoint denial-of-service against critical network services such as web (HTTP/HTTPS), DNS, and TLS-terminating
  applications. It correlates several complementary signals across network and host telemetry: high-volume
  connections from threat-intelligence-listed source IPs (DoS botnets, open proxies, TOR exit nodes) to
  critical service ports; anomalous application-layer request patterns (slow-DoS long-duration/low-byte
  connections, request floods to resource-intensive URIs, and HTTP-flood/slow-DoS tool signatures); sustained
  statistically significant spikes in inbound bytes/packets/new-connection rate paired with rising source-IP
  entropy and collapsing destination concentration (the distributed-flood signature); abnormal TCP connection-state
  distributions (S0/S1/REJ spikes signalling SYN-backlog exhaustion) and expensive TLS renegotiation/failed
  handshakes; and observable service degradation (rising latency, connection timeouts, HTTP 5xx and http.sys
  queue-full errors, CPU/memory exhaustion). For each signal the playbook offers deterministic rules,
  statistical baselining, and machine-learning approaches so an analyst can confirm whether an adversary
  is actively exhausting service resources to disrupt availability.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there inbound connections to critical service ports (80, 443, 53) whose source IP addresses
    match a threat-intelligence feed of known DoS botnets, open proxies, or TOR exit nodes?
  context: 'In the Impact tactic, an adversary conducting a Service Exhaustion Flood frequently sources
    traffic from rented botnets, open proxies, or anonymization networks. Correlating Zeek conn.log source
    IPs against curated CTI lists (DoS/botnet C2, open-proxy, TOR exit-node feeds) provides a high-precision
    deterministic floor: any connection to a critical service port (80/443/53) from a CTI-listed address
    is inherently suspicious. A positive result (one or many CTI-listed sources hammering a service) is
    strong corroboration that observed load is hostile rather than organic. A negative result does not
    clear the host but shifts weight to the volumetric and application-layer analytics. This follows rule/threshold
    IDS practice for high-confidence list-membership matching.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network border gateways, firewalls, load balancers, and public-facing web/application servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  load conn.log\n  | where id.resp_p in (80, 443, 53)\n  | join cti_feed on id.orig_h\
      \ == cti_feed.ip   // botnet, open-proxy, TOR lists\n  | summarize conns=count(), bytes=sum(orig_bytes)\
      \ by id.orig_h, id.resp_h, id.resp_p\n  | where conns > 0\n  | alert \"CTI-listed source connecting\
      \ to critical service\""
- question: Does the share of inbound connections and bytes coming from CTI-listed source IPs to a given
    service exceed its statistical baseline (99th percentile or mean+3 sigma) over rolling five-minute
    windows?
  context: Beyond a single CTI hit, a Service Exhaustion Flood manifests as a sudden surge in the PROPORTION
    of traffic attributable to known-bad infrastructure. By baselining, over 30 days of history, the percentage
    of inbound connections and bytes from CTI-listed IPs per service and alerting when a rolling five-minute
    window exceeds the 99th percentile or mean+3 sigma, the analyst gets an explainable z-score signal
    that distinguishes a coordinated flood from background scanning. A positive result indicates CTI-sourced
    traffic now dominates the service well beyond normal levels — consistent with active resource exhaustion.
    This supports the Impact assessment by quantifying how much of the load is hostile.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network border gateways, firewalls, load balancers, and public-facing web/application servers.'
  range: Last 90 days (baseline 30 days; evaluate rolling 5-minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = pctile(cti_share_pct, 99) over last 30d per service\n  stream conn.log |\
      \ bin 5m, per service:\n    cti_share = sum(bytes where src in CTI)/sum(bytes)\n  | where cti_share\
      \ > baseline OR cti_share > mean+3*stddev\n  | alert with observed_share, baseline_share, service"
- question: Does the observed CTI-sourced connection volume to a service exceed the volume predicted by
    a time-series forecast model for the current period?
  context: Floods often arrive as abrupt departures from a service's normal diurnal/weekly traffic rhythm.
    Fitting an ARIMA or Prophet forecast to per-service CTI-sourced connection volume lets the analyst
    predict expected load with a confidence interval and alert when observed traffic exceeds the upper
    bound. This machine-learning approach catches floods that ramp faster than seasonal norms even if
    absolute counts are not yet record-breaking. A positive result (observed >> forecast) — especially
    with the contributing source ASNs enumerated in the alert — strongly indicates an externally driven
    availability attack consistent with the Impact tactic. Include forecast value, observed value, and
    top ASNs for triage.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network border gateways, firewalls, load balancers, and public-facing web/application servers.'
  range: Last 90 days (train on >=30 days; forecast current interval)
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = ARIMA/Prophet.fit(cti_conn_volume per service, history>=30d)\n  forecast, ci_upper\
      \ = model.predict(current_window)\n  if observed_volume > ci_upper:\n    alert(service, forecast,\
      \ observed_volume, top_source_asns)"
- question: Do any HTTP requests match known signatures (URIs, user-agents, methods) of HTTP-flood or
    slow-DoS tools such as Slowloris, Slowhttptest, Hulk, or GoldenEye?
  context: Many endpoint DoS floods are launched with off-the-shelf tooling that leaves recognizable fingerprints
    in Zeek http.log — characteristic user-agent strings, repetitive URI patterns, and method choices.
    Matching http.log fields against a signature set drawn from documented HTTP-flood/slow-DoS tools and
    labeled DoS traces (e.g., CIC-IDS2017) gives a deterministic, high-confidence detection. A positive
    hit means a known attack tool is actively targeting the service, directly supporting the Impact hypothesis.
    A negative result does not exclude custom tooling, so pair it with the rate-based and statistical
    analytics below.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: API gateways, public-facing web servers, and backend application servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  load http.log\n  | where user_agent matches dos_tool_ua_signatures   // Slowloris, Hulk,\
      \ GoldenEye...\n     OR uri matches dos_tool_uri_patterns\n     OR method in suspicious_methods\n\
      \  | summarize hits=count() by id.orig_h, host, user_agent\n  | alert \"Known HTTP-flood/slow-DoS\
      \ tool signature\""
- question: Is any single source exceeding a deterministic per-URI request-rate ceiling against resource-intensive
    endpoints (e.g., search, report generation, login)?
  context: Resource-exhaustion floods often concentrate on the most computationally expensive endpoints
    — search, reporting, authentication, or heavy database queries — where each request consumes disproportionate
    server resources. Enforcing per-source, per-URI request-rate ceilings (e.g., more than X requests/minute
    to a known-expensive endpoint from one source) derived from learned per-application request-frequency
    models gives a clear, deterministic trigger. A positive result indicates one source is deliberately
    driving an expensive code path far above human-plausible rates, a hallmark of application-layer DoS
    aligned to the Impact tactic.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: API gateways, public-facing web servers, and backend application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  load http.log | bin 1m\n  | where uri in resource_intensive_uris\n  | summarize req=count()\
      \ by id.orig_h, uri, bin\n  | where req > per_uri_ceiling[uri]\n  | alert(src=id.orig_h, uri, req)"
- question: Are there many concurrent connections from a single source where the ratio of connection duration
    to bytes transferred is abnormally high (long-lived, low-data connections)?
  context: Slow-DoS attacks (e.g., Slowloris) hold many connections open with minimal data transfer to
    exhaust the server's connection/worker pool. By baselining per-URI the ratio of connection duration
    to request+response body length and alerting when this ratio exceeds the 95th percentile across many
    concurrent connections from one source, the analyst captures the slow-DoS signature. A complementary
    per-parameter chi-square character-distribution check flags malformed or repetitive flood requests.
    A positive result — numerous long-duration, near-empty connections from one source — is direct evidence
    of connection-pool exhaustion under the Impact tactic.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: API gateways, public-facing web servers, and backend application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  join conn.log,http.log on uid\n  | compute ratio = duration / (req_body_len + resp_body_len\
      \ + 1)\n  | baseline p95_ratio per uri over 30d\n  | where ratio > p95_ratio AND concurrent_conns[src]\
      \ > N\n  | optional: chi_square(param_char_dist) deviates from model\n  | alert(src, uri, ratio,\
      \ concurrent_conns)"
- question: Is any source generating an abnormally high rate of HTTP 408/499/503 or incomplete-request
    errors compared to its baseline?
  context: Slow and resource-exhaustion floods frequently manifest not as successful requests but as timeouts,
    aborted connections, and server rejections (HTTP 408 request timeout, 499 client closed, 503 service
    unavailable). Profiling the per-source rate of these failure-mode codes as a distinct signal and alerting
    when it exceeds mean+3 sigma surfaces floods that volume-only metrics miss. A positive result indicates
    a source is repeatedly pushing the service into timeout/reject states — strong evidence of an availability
    attack consistent with Impact.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: API gateways, public-facing web servers, and backend application servers.'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  load http.log | bin 1m\n  | where status_code in (408, 499, 503) OR incomplete_request\n\
      \  | summarize err=count() by id.orig_h, bin\n  | baseline mean,stddev per src over 30d\n  | where\
      \ err > mean + 3*stddev\n  | alert(src, err_rate)"
- question: Does a machine-learning classifier trained on HTTP/connection features flag traffic as belonging
    to a DoS class, and which features drive that decision?
  context: When signatures and fixed thresholds miss novel or distributed application-layer floods, a
    supervised model (Random Forest / Gradient Boosting) trained on labeled DoS traffic, or an unsupervised
    Isolation Forest baselining normal behavior, can classify Zeek http/conn feature vectors (request
    frequency, URI repetition/entropy, user-agent anomalies, duration, duration-to-bytes ratio, error
    ratio) as benign or DoS. Surfacing the top-3 contributing features via SHAP/attribution makes each
    alert explainable and triageable. A positive classification with interpretable drivers (e.g., extreme
    URI repetition + high error ratio) corroborates an application-layer Service Exhaustion Flood under
    the Impact tactic.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: API gateways, public-facing web servers, and backend application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [req_freq, uri_entropy, ua_anomaly, duration, dur_to_bytes, err_ratio]\n\
      \  model = RandomForest/GBM(trained on CIC-IDS2017 DoS) or IsolationForest(unsup)\n  score = model.predict(features\
      \ per src/window)\n  if score == DoS or anomaly:\n    alert(src, top3_shap_features)"
- question: Has any critical service exceeded hard volumetric limits (e.g., more than 10,000 new connections/minute
    or N inbound packets/sec) sustained for over 60 seconds?
  context: 'A deterministic volumetric circuit breaker provides an irreducible floor: when a critical
    service sees connection or packet rates above engineered hard limits sustained beyond a brief window
    (>60s), availability is at risk regardless of source. Tuning these limits per service capacity (and
    never removing them) ensures the most blatant floods always raise a high-priority alert. A positive
    result is immediate, actionable evidence of a volumetric Service Exhaustion Flood under the Impact
    tactic and typically warrants escalation to mitigation (rate-limiting, scrubbing).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network border gateways, ISP peering points, firewalls, and load balancers.'
  range: Last 90 days (evaluate per-minute, sustained >60s)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  load conn.log | bin 1m per service\n  | summarize new_conns=count(), pps=sum(packets)/60\n\
      \  | where (new_conns > 10000 OR pps > N) sustained over >60s\n  | alert HIGH \"Volumetric circuit\
      \ breaker tripped\""
- question: Is the Shannon entropy of source IP addresses rising abnormally while destination address/port
    entropy collapses, indicating a distributed flood concentrated on one target?
  context: 'The canonical signature of a distributed flood is a feature-distribution shift: source-address
    entropy increases (traffic from many dispersed sources) while destination address/port entropy decreases
    (all traffic converging on one service). Computing per-minute Shannon entropy of source IP and destination
    port distributions and alerting when source entropy exceeds its 98th percentile while destination
    entropy collapses detects this pattern even when total volume is partially obscured. A positive result
    is high-confidence evidence of a distributed Service Exhaustion Flood targeting a specific service
    under the Impact tactic.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network border gateways, ISP peering points, firewalls, and load balancers.'
  range: Last 90 days (per-minute entropy windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  load conn.log | bin 1m\n  | H_src = shannon_entropy(src_ip dist)\n  | H_dst = shannon_entropy(dst_ip/port\
      \ dist)\n  | baseline p98(H_src) over history\n  | where H_src > p98 AND H_dst dropping sharply\n\
      \  | alert(service, H_src, H_dst)"
- question: Does an LSTM/autoencoder model over per-minute traffic metrics show reconstruction error beyond
    a learned threshold, and which metrics contribute most?
  context: Multivariate volumetric anomalies are well captured by sequence models. Training an LSTM/autoencoder
    ensemble on per-minute total bytes, packets, new-connection counts, and unique-host counts learns
    the normal joint dynamics of a service; reconstruction error spiking beyond a learned threshold flags
    abnormal traffic states such as floods, even novel ones. Reporting top contributing features (e.g.,
    packet rate, source-host count) makes the alert explainable. A positive result corroborates a volumetric
    Service Exhaustion Flood under the Impact tactic and complements the deterministic and entropy-based
    detections.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network border gateways, ISP peering points, firewalls, and load balancers.'
  range: Last 90 days (train on normal history; score per-minute)
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  X = per-minute [total_bytes, packets, new_conns, unique_hosts]\n  model = LSTM/Autoencoder.fit(normal_history)\n\
      \  err = reconstruction_error(model, X_now)\n  if err > learned_threshold:\n    alert(service, top_contributing_features)"
- question: Is any single source generating more than 100 S0 or REJ connection attempts to a destination
    within one minute, or repeated TLS renegotiation requests?
  context: TCP SYN-backlog exhaustion shows up in Zeek conn.log as a spike in half-open or rejected states
    (S0, REJ) from a source. Likewise, SSL renegotiation attacks appear in ssl.log as repeated, computationally
    expensive renegotiations from one client. Alerting when a source exceeds a deterministic connection-state
    threshold (>100 S0/REJ in 1 minute) or shows repeated TLS renegotiation provides a clear, defensible
    trigger. A positive result indicates deliberate exhaustion of TCP backlog or TLS handshake resources
    — a direct Service Exhaustion Flood under the Impact tactic.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Web servers handling TLS/SSL termination, stateful firewalls, and load balancers.'
  range: Last 90 days (per-minute evaluation)
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  load conn.log | bin 1m\n  | where conn_state in (\"S0\",\"REJ\")\n  | summarize attempts=count()\
      \ by id.orig_h, id.resp_h\n  | where attempts > 100 -> alert SYN-backlog exhaustion\n  ; load ssl.log\
      \ | summarize reneg=count() by id.orig_h\n  | where reneg > reneg_threshold -> alert TLS renegotiation\
      \ flood"
- question: Has a service's TCP success ratio SF/(SF+S0+REJ+S1) dropped more than 3 sigma below its historical
    mean, or TLS failed/renegotiation counts risen above mean+3 sigma?
  context: 'A failure-mode signal: when a service''s connection success ratio collapses (proportion of
    fully established SF connections falls more than 3 sigma below baseline), it indicates clients cannot
    complete handshakes — consistent with backlog exhaustion. For TLS, a surge in ssl.log resumed=''F''
    plus renegotiation counts above mean+3 sigma signals handshake-resource exhaustion. Z-score baselining
    makes this explainable. A positive result shows the service is degraded at the connection layer, supporting
    the Impact hypothesis even before host metrics react.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Web servers handling TLS/SSL termination, stateful firewalls, and load balancers.'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  load conn.log | bin 5m per service\n  | success = SF/(SF+S0+REJ+S1)\n  | baseline mean,stddev(success)\
      \ over 30d\n  | where success < mean - 3*stddev -> alert\n  ; load ssl.log | where resumed=='F'\n\
      \  | summarize reneg by src; where reneg > mean+3*stddev -> alert"
- question: Does change-point detection on the vector of connection-state percentages reveal an abrupt,
    sustained shift toward S0/REJ dominance?
  context: Floods often begin at a discrete moment; CUSUM or Bayesian online change-point detection applied
    to the time series of connection-state percentages detects abrupt, sustained regime shifts toward
    S0/REJ dominance that gradual thresholds may smear over. Reporting the pre/post state distribution
    makes the change interpretable. A positive result pinpoints when the service's connection behavior
    shifted into a flood/exhaustion regime, giving the analyst both confirmation and a timeline anchor
    for the Impact incident.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Web servers handling TLS/SSL termination, stateful firewalls, and load balancers.'
  range: Last 90 days (online change-point detection)
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  series = per-minute [%SF, %S0, %REJ, %S1] per service\n  cp = CUSUM/BayesianOnlineChangePoint(series)\n\
      \  if change_point detected AND post shifts toward S0/REJ:\n    alert(service, t_change, dist_before,\
      \ dist_after)"
- question: Are http.sys queue-full errors (Windows Event ID 15005) or equivalent worker-exhaustion/503
    errors exceeding five occurrences within one minute?
  context: Server-side resource-limit errors are a direct failure-mode indicator of exhaustion. Windows
    Event ID 15005 signals the http.sys request queue is full; Apache/Nginx worker exhaustion and HTTP
    503 are the cross-platform equivalents. Alerting when these exceed five occurrences in one minute
    provides a deterministic floor that fires when the service can no longer accept work. A positive result
    is strong, host-confirmed evidence that a Service Exhaustion Flood has overwhelmed the service under
    the Impact tactic.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 15005
  - 'NAI: Application servers, web servers, and database servers.'
  range: Last 90 days (per-minute evaluation)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (WinEventLog where EventID==15005)\n   OR (web logs where status==503 OR worker_exhaustion)\n\
      \  | bin 1m | summarize errs=count() by host\n  | where errs > 5\n  | alert \"Service resource-limit\
      \ errors (queue/worker full)\""
- question: Is P95 application latency exceeding twice its 24-hour rolling average (or beyond an ARIMA
    prediction interval), or the HTTP 5xx error rate exceeding mean+3 sigma?
  context: Service degradation is the observable consequence of exhaustion. Flagging when P95 latency
    exceeds twice its 24-hour rolling average or breaks an ARIMA forecast interval, and when the HTTP
    5xx error rate exceeds mean+3 sigma via z-score baselining, captures the performance impact of a flood.
    A positive result quantifies that the service is materially degraded — slow and erroring beyond statistical
    norms — corroborating an availability attack under the Impact tactic and helping gauge severity.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 15005
  - 'NAI: Application servers, web servers, and database servers.'
  range: Last 90 days (24-hour rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  load http.log/conn.log | bin 1m per service\n  | p95_lat = pctile(latency,95); base\
      \ = rolling_avg_24h(p95_lat)\n  | where p95_lat > 2*base OR p95_lat > arima_ci_upper -> alert\n\
      \  | err5xx_rate; baseline mean,stddev\n  | where err5xx_rate > mean+3*stddev -> alert"
- question: Does a multivariate model over latency, error rates, CPU, memory, and error-event frequency
    place the service in a learned degraded state, and which metrics drive it?
  context: Single-metric thresholds can miss compound degradation. Modeling network latency, error rates,
    CPU, memory, and error-event frequency jointly with an Isolation Forest or autoencoder learns the
    service's healthy operating envelope; when the combined state vector enters a learned degraded region,
    the model fires. Surfacing the top-3 contributing metrics via SHAP/attribution makes the alert actionable.
    A positive result confirms holistic service degradation consistent with a Service Exhaustion Flood
    under the Impact tactic, integrating network and host evidence into one decision.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 15005
  - 'NAI: Application servers, web servers, and database servers.'
  range: Last 90 days (train on healthy history; score continuously)
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  X = [latency, error_rate, cpu, memory, err_event_freq]\n  model = IsolationForest/Autoencoder.fit(healthy_history)\n\
      \  if model.flags(X_now) as degraded:\n    alert(service, top3_shap_metrics)"
