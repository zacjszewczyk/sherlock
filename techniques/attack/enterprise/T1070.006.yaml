name: 'T1070.006: Indicator Removal: Timestomp'
id: 635d3888-ac59-4878-87fc-8ddb03f509cb
description: 'Investigate whether an adversary is using timestomping (MITRE ATT&CK T1070.006) to evade
  defenses by modifying file time attributes (modify, access, create, change) to hide newly staged files
  or to make malicious files blend in with legitimate ones. This playbook helps a SOC analyst hunt across
  the full timestomping lifecycle: (1) the network delivery of a known timestomping utility, helper script,
  or payload identified by file-hash intelligence; (2) process-creation and script evidence of native
  or third-party timestamp-manipulation commands such as PowerShell property setters, [IO.File]::SetCreationTime,
  timestomp.exe, SetMACE, nircmd, touch -a -m -t, touch -r, and direct SetFileTime API calls on Windows,
  Linux, macOS, and ESXi; (3) backdated files whose recorded metadata is older than the system event that
  logged their creation/write; (4) NTFS $STANDARD_INFORMATION ($SI) versus $FILE_NAME ($FN) timestamp
  mismatches and double-timestomping; (5) files cloning the MACE timestamps of legitimate OS files to
  hide in plain sight; and (6) files with illogical internal timestamp ordering (e.g., creation time newer
  than last-write time). For each lead the playbook offers symbolic-logic detections, robust statistical
  baselines, and machine-learning approaches, with cross-validation against tamper-resistant artifacts
  such as the NTFS $UsnJrnl and $LogFile change journals so that an analyst can confirm or refute metadata
  tampering and pivot to the responsible process, user, and preceding download or execution.'
type: technique
