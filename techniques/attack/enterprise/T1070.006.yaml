- question: Does any file exhibit impossible internal timestamp ordering, such as CreationTime newer than
    LastWriteTime or $SI newer than $FN, confirmed against the $UsnJrnl/$LogFile and nanosecond-zero checks
    to rule out clock skew?
  context: 'A normal file is created before it is modified, so an inverted ordering signals that metadata
    was altered after the write. From file-system monitoring or periodic MFT scans, raise a high-severity
    alert when internal ordering is impossible, e.g., CreationTime > LastWriteTime or $SI newer than $FN,
    which legitimate file lifecycles do not produce. Confirm with the $UsnJrnl/$LogFile and nanosecond-zero
    checks to separate genuine tampering from clock skew. Preserve path, parent process, and user context.
    A positive result is near-unambiguous evidence of timestamp manipulation because it violates the basic
    causality of file creation and modification, and the analyst should immediately scope the responsible
    process and the file''s purpose. References: [Fortuna](https://andreafortuna.org/2017/10/06/macb-times-in-windows-forensic-analysis/)
    [Palmbach & Breitinger](https://www.sciencedirect.com/science/article/pii/S2666281720300937) [Lau
    (inversecos)](https://www.inversecos.com/2022/04/defence-evasion-technique-timestomping.html)'
  answer_sources:
  - Sysmon Event ID 11
  - MFT Record Data
  - EDR file system telemetry
  - 'NAI: NTFS volumes on all Windows endpoints and servers where file lifecycle metadata should remain
    internally consistent.'
