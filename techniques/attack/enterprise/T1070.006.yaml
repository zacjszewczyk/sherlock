questions:
- question: Did a host download or receive over the network a file whose MD5/SHA1/SHA256 hash matches
    a curated intelligence feed of known timestomping tools, helper scripts, or payloads (e.g., timestomp.exe,
    SetMACE, nircmd, PowerShell timestomp scripts, or beacons that call SetFileTime), and did that same
    host later show metadata tampering on newly staged files?
  context: 'This question hunts for the tool-delivery step that precedes timestamp manipulation. Under
    the Stealth tactic, an adversary first stages a utility capable of altering file times, then uses
    it to make malicious artifacts blend in. Continuously matching transferred-object hashes from Zeek
    files.log/http.log/conn.log against a timestomping intelligence feed gives a high-confidence, low-false-positive
    lead. A positive match should be enriched with source/destination host, URL, fuid, and transfer time
    so the analyst can pivot to the first execution of the tool and any subsequent SI/FN mismatch or backdated
    file on the receiving host. A negative result does not rule out timestomping performed with native
    OS primitives (touch, PowerShell), which are covered by other questions. References: [Sigma Powershell
    Timestomp](https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/powershell/powershell_script/posh_ps_timestomp.yml)'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 2
  - MFT Record Data
  - 'NAI: Monitored network segments including internet gateways, DMZ traffic, and any endpoint segments
    that routinely receive downloaded tooling before execution.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from files.log join http.log, conn.log on fuid/uid

      where md5 in TI_timestomp_hashes or sha1 in TI_timestomp_hashes or sha256 in TI_timestomp_hashes

      emit src_host, dst_host, url, fuid, mime_type, ts

      then correlate dst_host with later SetFileTime / SI-FN-mismatch events within 7d'
- question: Is a source host transferring executables or scripts at a volume that significantly exceeds
    its own 30-day baseline, and are there clusters of failed (blocked / HTTP 40x / reset) download attempts
    immediately preceding a successful pull?
  context: 'Tool staging often manifests as an abnormal burst of executable/script transfers or as repeated
    failed download attempts that finally succeed. Build a per-source-host 30-day baseline of daily executable/script
    transfer counts and first-seen file prevalence from files.log/http.log, then alert using a modified
    z-score (median absolute deviation, |z|>3.5) so routine batch updates do not inflate the baseline
    and mask real spikes. Separately count blocked/40x/reset attempts as a distinct failure-mode signal
    because repeated failed pulls before a success are a common marker of an operator iterating to stage
    tooling. A positive result is a host whose download behavior deviates sharply from its own norm and
    warrants pivoting to subsequent execution and metadata-change activity. References: [Modified Z-Score
    for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 2
  - MFT Record Data
  - 'NAI: Monitored network segments including internet gateways, DMZ traffic, and any endpoint segments
    that routinely receive downloaded tooling before execution.'
  range: Last 90 days (30-day baseline, current-day evaluation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per src_host daily count(exe_or_script transfers) over trailing 30d

      med = median(baseline); mad = MAD(baseline)

      mod_z = 0.6745 * (today_count - med) / mad

      alert if mod_z > 3.5

      also count(status in {403,404,reset,blocked}) per src_host per hour as failure_signal

      flag failure_signal burst followed by successful 200 download'
- question: When scored by an anomaly/classification model trained on Zeek transfer and endpoint execution
    features, do any new downloads rank as rare combinations consistent with staging a timestomping tool
    (e.g., high entropy, unsigned, first-seen destination, short time-to-execution)?
  context: 'Hash and volume rules miss novel or repacked tooling. Train an Isolation Forest or supervised
    gradient-boosting model on engineered features such as mime_type, is_exe, file entropy, byte count,
    destination reputation, and time-to-execution to score new downloads and surface rare combinations
    that resemble tool staging. The same engineered-feature plus isolation-forest methodology is effective
    for stealthy, low-throughput abuse. To make alerts triageable, surface the top-3 contributing features
    (e.g., high entropy, unsigned binary, first-seen destination) so the analyst understands why the download
    was flagged and can quickly decide whether to pivot to execution and metadata-tampering evidence on
    the receiving host. References: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363)
    [Nadler et al.](https://arxiv.org/abs/1709.08395)'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 2
  - MFT Record Data
  - 'NAI: Monitored network segments including internet gateways, DMZ traffic, and any endpoint segments
    that routinely receive downloaded tooling before execution.'
  range: Last 90 days (model trained on longer history)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [mime_type, is_exe, entropy, byte_count, dst_reputation, time_to_execution]

      model = IsolationForest() or GradientBoosting() trained on historical downloads

      score = model.decision_function(new_download)

      alert if score in anomalous_tail

      attach top_3_contributing_features(new_download)'
- question: Did any process-creation or script-execution event contain command-line or script syntax that
    manipulates file timestamps, such as PowerShell .CreationTime=/.LastWriteTime=/.LastAccessTime= assignments,
    [IO.File]::SetCreationTime/SetLastAccessTime/SetLastWriteTime, timestomp.exe/nircmd.exe/SetMACE with
    timestamp arguments, touch -a -m -t, touch -r <ref> <target>, or direct SetFileTime API calls?
  context: 'This is the core direct-evidence detection for timestomping. Examine Windows 4688, Sysmon
    1, PowerShell 4104 script blocks, and auditd execve for timestamp-manipulation primitives. On Windows,
    match PowerShell property setters and the [IO.File] static methods plus known binaries (timestomp.exe,
    nircmd.exe, SetMACE) invoked with timestamp arguments. On Linux/ESXi, match touch -a -m -t, touch
    -r, and touch -t, especially against .service or other system files. EDR OS-API telemetry for SetFileTime
    catches tooling that bypasses the CLI entirely. A positive result shows deliberate metadata manipulation
    rather than ordinary file access; preserve the file path, user, and parent process so the analyst
    can determine which artifact was being concealed. This activity is operationally unusual on high-value
    assets (domain controllers, database servers, jump hosts) and should be treated with elevated priority
    there. References: [Sigma Powershell Timestomp](https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/powershell/powershell_script/posh_ps_timestomp.yml)
    [Sigma Touch Suspicious Service File](https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/linux/process_creation/proc_creation_lnx_touch_susp.yml)
    [Lau (inversecos)](https://www.inversecos.com/2022/04/defence-evasion-technique-timestomping.html)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - auditd:SYSCALL
  - EDR:OS API (SetFileTime)
  - 'NAI: All Windows endpoints and servers, particularly high-value assets like domain controllers, database
    servers, and jump hosts where timestamp manipulation would be operationally unusual.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "windows: 4688/Sysmon1/4104 where cmd_or_script matches\n  /\\.(CreationTime|LastWriteTime|LastAccessTime)\\\
      s*=/ or\n  /\\[IO\\.File\\]::Set(Creation|LastAccess|LastWrite)Time/ or\n  /(timestomp|nircmd|SetMACE)\\\
      .exe/ with time args\nlinux/esxi: auditd execve where exe='touch' and args ~ /-a|-m|-t|-r/ on .service\
      \ or system file\nedr: OS API == SetFileTime\nemit host, user, parent_process, target_file"
- question: For each host and user, is the frequency of timestamp-modifying commands spiking above a 30-day
    baseline, or does such a utility appear in a context where it is rarely used (non-admin endpoint,
    outside maintenance window, unusual parent process)?
  context: 'Even legitimate admins occasionally adjust timestamps, so raw matches need behavioral context.
    Build a 30-day per-host and per-user baseline of the frequency (count/day), parent-process distribution,
    and run-time window of timestamp-modifying commands. Alert with a modified z-score (|z|>3.5) when
    frequency spikes or when the utility surfaces in an anomalous context, such as a non-admin endpoint
    or outside the normal maintenance window. Also track non-zero process exit codes or API failures as
    a distinct state signal, since failed timestomp attempts can reveal experimentation. A positive result
    is a deviation from the established norm for that host/user pairing and is far more indicative of
    adversary stealth than a single in-context invocation. References: [Unified Host and Network Data
    Set, Turcotte et al.](https://arxiv.org/abs/1708.07518) [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - auditd:SYSCALL
  - EDR:OS API (SetFileTime)
  - 'NAI: All Windows endpoints and servers, particularly high-value assets like domain controllers, database
    servers, and jump hosts where timestamp manipulation would be operationally unusual.'
  range: Last 90 days (30-day baseline, current-day evaluation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per (host,user) daily count(timestamp_mod_cmd) over 30d\nmod_z = 0.6745*(today\
      \ - median)/MAD\nalert if mod_z > 3.5\n  or parent_process not in baseline_parent_set\n  or run_time\
      \ outside maintenance_window\n  or host_role == non_admin_endpoint\nadd feature: exit_code != 0\
      \ or api_failure"
- question: When per-host process and file-operation events are modeled as sequences, does a SetFileTime
    or touch operation appear out of normal execution order (especially immediately following a file write),
    and do command features score as anomalous in an Isolation Forest?
  context: 'Adversaries can hide a single timestomp call within otherwise normal activity, so sequence
    context matters. Treat per-host process/file-operation events as ordered sequences and learn the normal
    execution order with a DeepLog-style LSTM; flag an out-of-pattern SetFileTime/touch, particularly
    when it directly follows a file write (the canonical write-then-backdate pattern), and return the
    offending log key for explainability. Complement this with an Isolation Forest over command features
    (token n-grams, command length, entropy, parent process) that emits its top-3 contributing features.
    A positive result is a timestamp operation that breaks the host''s learned behavioral grammar or scores
    as a rare command, pointing the analyst to a concealment attempt that simple pattern matching would
    treat as benign. References: [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015) [Isolation
    Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - auditd:SYSCALL
  - EDR:OS API (SetFileTime)
  - 'NAI: All Windows endpoints and servers, particularly high-value assets like domain controllers, database
    servers, and jump hosts where timestamp manipulation would be operationally unusual.'
  range: Last 90 days (model trained on longer history)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = ordered per-host (process,file_op) log keys

      lstm = DeepLog(seq); predict next key

      alert if observed key (SetFileTime|touch) not in top_k predictions, esp. after file_write

      return offending_log_key

      iso = IsolationForest(features=[token_ngrams,len,entropy,parent_process])

      alert if iso anomalous; attach top_3_features'
- question: For each file create/write event, is the file's recorded CreationTime/LastWriteTime significantly
    older than the system event time that logged the write (beyond allowed clock skew), and does the independent
    NTFS $UsnJrnl/$LogFile change journal contradict the recorded metadata?
  context: 'Backdating is a hallmark of timestomping meant to conceal a freshly staged payload. For each
    Sysmon 11 / Windows 4663 create/write event, compare the file''s recorded CreationTime/LastWriteTime
    against the observed event time and flag metadata that is older than the write beyond an allowed clock-skew
    window. Crucially, cross-validate against the NTFS $UsnJrnl and $LogFile change journals, which record
    the true change time even when the $SI attribute has been altered. A positive result means the file
    claims to be older than the moment it was actually written, which legitimate file creation does not
    produce; preserve path, user, and parent process to determine whether the backdating concealed a staged
    payload. Newly written or downloaded files in temp directories and network shares should normally
    carry fresh timestamps, making this a strong stealth indicator there. References: [Lau (inversecos)](https://www.inversecos.com/2022/04/defence-evasion-technique-timestomping.html)
    [Palmbach & Breitinger](https://www.sciencedirect.com/science/article/pii/S2666281720300937)'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Zeek files.log
  - NTFS $UsnJrnl
  - NTFS $LogFile
  - 'NAI: Critical file system directories on endpoints and servers, temporary directories, and network
    file shares where newly written or downloaded files should have fresh timestamps.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each (Sysmon11|4663) write event:\n  delta = event_time - file.CreationTime (or LastWriteTime)\n\
      \  alert if delta > clock_skew_allowance (file older than its write)\n  cross_check: usnjrnl/$LogFile\
      \ true_change_time vs file metadata\n  alert if true_change_time != recorded metadata\nemit path,\
      \ user, parent_process"
- question: Across the enterprise and by host role, are there files whose delta between observed event
    time and recorded timestamp falls in the extreme lower percentile or is impossibly negative (file
    dated in the future relative to its write)?
  context: 'The magnitude of backdating is itself a signal: a delta of seconds is normal jitter, while
    a delta of months or years, or an impossible negative delta, indicates tampering. Compute the delta
    between observed event time and recorded file timestamp across the enterprise and segmented by host
    role, then flag deltas in the extreme lower percentile or with impossible values using median-absolute-deviation
    thresholds that remain robust against legitimate archive extraction (which can produce large but explainable
    deltas). Favor signals that survive tampering by weighting against artifact-reliability rankings.
    A positive result is a file whose claimed age is statistically implausible given when it was actually
    written, prioritizing the most egregiously backdated artifacts for analyst review. References: [Modified
    Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    [Palmbach & Breitinger](https://www.sciencedirect.com/science/article/pii/S2666281720300937)'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Zeek files.log
  - NTFS $UsnJrnl
  - NTFS $LogFile
  - 'NAI: Critical file system directories on endpoints and servers, temporary directories, and network
    file shares where newly written or downloaded files should have fresh timestamps.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'delta = event_time - recorded_file_time

      per host_role: med=median(delta); mad=MAD(delta)

      mod_z = 0.6745*(delta-med)/mad

      alert if mod_z < -3.5 (extreme backdating) or delta < 0 (impossible)

      weight thresholds by artifact_reliability_rank'
- question: When each host's stream of timestamp deltas and metadata-change counts is forecast with online
    ARIMA, do any observations fall outside the prediction interval, and can a provenance graph link the
    writing process to the backdated file and its preceding download/execution?
  context: 'Per-host modeling captures gradual or stealthy backdating that enterprise-wide percentiles
    might smooth over. Model each host''s stream of timestamp deltas and metadata-change counts with online
    ARIMA forecasting and alert on observations outside the prediction interval. For causal context, use
    a whole-system provenance GNN (e.g., KAIROS) to link the writing process to the backdated file and
    to the preceding download or execution, surfacing the contributing nodes and edges. A positive result
    combines a statistically anomalous backdating event with a clear provenance chain, giving the analyst
    both the anomaly and the surrounding kill-chain context needed to confirm a concealment attempt and
    scope the incident. References: [Online Forecasting and Anomaly Detection Based on ARIMA, Pena et
    al.](https://www.mdpi.com/2076-3417/11/7/3194) [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf)'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Zeek files.log
  - NTFS $UsnJrnl
  - NTFS $LogFile
  - 'NAI: Critical file system directories on endpoints and servers, temporary directories, and network
    file shares where newly written or downloaded files should have fresh timestamps.'
  range: Last 90 days (per-host time series)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = per-host (timestamp_delta, metadata_change_count) over time

      model = online_ARIMA(series); predict interval

      alert if observation outside prediction_interval

      graph = provenance_GNN(events)

      link writing_process -> backdated_file -> preceding download/exec

      surface contributing nodes/edges'
- question: Does any file's $STANDARD_INFORMATION ($SI) MACB times disagree with its kernel-controlled
    $FILE_NAME ($FN) times within the same MFT record, do any timestamps have nanosecond precision equal
    to 0000000, and do the $UsnJrnl/$LogFile contradict the visible metadata (double timestomping)?
  context: 'An $SI/$FN mismatch is a classic timestomping artifact because $SI is user-modifiable via
    API while $FN is normally only set by the kernel. On scheduled MFT triage, alert when a file''s $SI
    MACB times do not agree with the corresponding $FN times. Add the tool-artifact rule that sub-second
    (nanosecond) precision of exactly 0000000 indicates automated timestomping, and detect double timestomping
    by comparing both attributes plus the $UsnJrnl/$LogFile change journals. Apply updated NTFS time rules
    to suppress application-driven false positives (some legitimate operations create benign mismatches).
    Prioritize executables and recently written files in user-writable directories. A positive result
    is strong evidence that visible metadata was forged, and the analyst should pivot to the responsible
    process and any associated payload. References: [Fortuna](https://andreafortuna.org/2017/10/06/macb-times-in-windows-forensic-analysis/)
    [Palmbach & Breitinger](https://www.sciencedirect.com/science/article/pii/S2666281720300937) [Lau
    (inversecos)](https://www.inversecos.com/2022/04/defence-evasion-technique-timestomping.html) [Galhuber
    & Luh](https://dl.acm.org/doi/10.1145/3465481.3470016)'
  answer_sources:
  - EDR file system telemetry
  - MFT Record Data
  - NTFS $UsnJrnl
  - NTFS $LogFile
  - 'NAI: NTFS volumes on all Windows endpoints and servers, especially user-writable directories and
    locations where newly dropped binaries should have consistent timestamps.'
  range: Last 90 days (scheduled MFT triage)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each MFT record:\n  alert if SI.MACB != FN.MACB (within record)\n  alert if any timestamp.nanoseconds\
      \ == 0000000\n  alert if usnjrnl/$LogFile contradicts SI (double timestomp)\nsuppress known-benign\
      \ app patterns (updated NTFS time rules)\nprioritize executables and recent files in user-writable\
      \ dirs"
- question: Is the per-host percentage of files with $SI/$FN mismatches, or the count of nanosecond-zeroed
    timestamps, exceeding the host's robust baseline (which normally stays near zero for roles with stable
    metadata)?
  context: 'For most host roles the rate of $SI/$FN mismatches is effectively zero, so any sustained rise
    is meaningful. Compute the percentage of files with $SI/$FN mismatches per host on an hourly or daily
    basis (a state metric) along with the count of nanosecond-zeroed timestamps, then alert when the rate
    exceeds the host''s robust baseline using a modified z-score (|z|>3.5). Because the baseline hovers
    near zero for stable-metadata roles, even a small absolute increase produces a large z-score and a
    confident alert. A positive result indicates a host experiencing an unusual concentration of metadata
    inconsistencies, which may reflect bulk timestomping of staged tools or payloads and warrants immediate
    triage of the affected files. References: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
  answer_sources:
  - EDR file system telemetry
  - MFT Record Data
  - NTFS $UsnJrnl
  - NTFS $LogFile
  - 'NAI: NTFS volumes on all Windows endpoints and servers, especially user-writable directories and
    locations where newly dropped binaries should have consistent timestamps.'
  range: Last 90 days (hourly/daily aggregation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per host per hour/day:\n  mismatch_pct = count(SI!=FN)/count(files)\n  ns_zero_count = count(nanoseconds==0000000)\n\
      med/MAD baseline per host\nmod_z = 0.6745*(value-median)/MAD\nalert if mod_z > 3.5"
- question: When binary features has_mft_si_fn_mismatch, has_nanosecond_zero, and has_usnjrnl_contradiction
    are fed into a host-level Isolation Forest alongside process, egress, and directory context, do timestomped
    files co-occur with other suspicious behavior to raise the host risk score?
  context: 'A lone mismatch may be benign, but a mismatch occurring alongside suspicious process, egress,
    or directory activity is far more concerning. Feed the binary features has_mft_si_fn_mismatch, has_nanosecond_zero,
    and has_usnjrnl_contradiction into a host-level Isolation Forest together with process, network-egress,
    and directory context so that timestomped files co-occurring with other suspicious behavior elevate
    the host''s risk score. Emit the top-3 contributing features in the alert for explainability. A positive
    result is a host whose combined behavioral profile, including metadata tampering, is a rare outlier,
    helping the analyst distinguish coordinated adversary stealth from isolated, benign metadata quirks.
    References: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363) [Nadler et al.](https://arxiv.org/abs/1709.08395)'
  answer_sources:
  - EDR file system telemetry
  - MFT Record Data
  - NTFS $UsnJrnl
  - NTFS $LogFile
  - 'NAI: NTFS volumes on all Windows endpoints and servers, especially user-writable directories and
    locations where newly dropped binaries should have consistent timestamps.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [has_mft_si_fn_mismatch, has_nanosecond_zero,\n           has_usnjrnl_contradiction,\
      \ process_ctx, egress_ctx, dir_ctx]\nmodel = IsolationForest(per_host)\nscore = model.decision_function(host_features)\n\
      alert if anomalous; attach top_3_contributing_features"
- question: On creation of an executable in a user-writable directory, are its MACE timestamps identical
    or near-identical across multiple fields to those of a nearby trusted OS file despite a different
    name, signer, or path, and does the $FN/$UsnJrnl confirm the cloned $SI is forged?
  context: 'Adversaries clone the MACE vector of a well-known OS file so a payload appears as old and
    routine as its neighbors. On creation of executables in user-writable directories (%APPDATA%, %TEMP%,
    %PUBLIC%, C:\ProgramData), compare the new file''s MACE vector against nearby trusted OS files and
    alert when timestamps match across multiple fields but the file differs in name, signer, or path.
    Validate against $FN/$UsnJrnl to confirm the cloned $SI is forged, and apply updated NTFS time rules
    to avoid flagging legitimate copy or install operations that naturally preserve timestamps. A positive
    result is a strong indicator that a payload is masquerading as a system file via timestamp cloning,
    and the analyst should examine the file''s signature, hash, and origin. References: [Lau (inversecos)](https://www.inversecos.com/2022/04/defence-evasion-technique-timestomping.html)
    [Galhuber & Luh](https://dl.acm.org/doi/10.1145/3465481.3470016) [Palmbach & Breitinger](https://www.sciencedirect.com/science/article/pii/S2666281720300937)'
  answer_sources:
  - Sysmon Event ID 11
  - MFT Record Data
  - EDR file system telemetry
  - 'NAI: User-writable directories such as %APPDATA%, %TEMP%, %PUBLIC%, and C:\ProgramData on all Windows
    endpoints and servers where cloned timestamps would help a payload blend into nearby system files.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on file_create(exe) in user_writable_dir:\n  for nearby trusted_os_file:\n    if new.MACE\
      \ ~= trusted.MACE across multiple fields\n       and (new.name != trusted.name or new.signer !=\
      \ trusted.signer\n            or new.path != trusted.path):\n      validate FN/$UsnJrnl shows SI\
      \ forged\n      alert (suppress legit copy/install via NTFS time rules)"
- question: Does a new unsigned file in a user-writable directory have a MACE-vector hash that matches
    a high-prevalence OS-file timestamp cluster (extreme upper percentile of environment-wide frequency)?
  context: 'Cloning produces identical timestamp vectors, so hashing the full MACE vector and counting
    environment-wide frequency exposes payloads that copy a popular OS-file timestamp. Maintain an environment-wide
    frequency count of MACE-vector hashes; a new unsigned file in a user-writable directory whose timestamp
    hash matches a high-prevalence OS-file cluster (extreme upper percentile) is a strong cloning indicator.
    Use robust percentile/MAD thresholds to avoid imaging or patch-day false positives, when many files
    legitimately share timestamps. A positive result is a freshly created, unsigned file whose timestamp
    fingerprint improbably coincides with a common system-file cluster, suggesting the timestamps were
    copied to blend the payload into its surroundings. References: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
