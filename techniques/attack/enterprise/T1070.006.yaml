- question: Modeling each host role's daily count of files with inverted timestamps as a near-zero time
    series with online ARIMA, does any day deviate beyond the prediction interval or show a sudden appearance
    of inverted timestamps in directories that normally hold routine artifacts?
  context: 'Inverted timestamps are essentially nonexistent in normal operation, so the per-host-role
    baseline is near zero and any deviation is notable. Daily, count files with inverted timestamps per
    host role and model the near-zero baseline as a time series with online ARIMA, alerting on any deviation
    beyond the prediction interval or a sudden appearance of inverted timestamps in directories that normally
    hold routine, untampered artifacts. A positive result is a statistically significant emergence of
    impossible timestamps on a host, which strongly suggests an adversary is timestomping staged files,
    and the location of those files helps the analyst prioritize the most suspicious artifacts for deeper
    forensic review. References: [Online Forecasting and Anomaly Detection Based on ARIMA, Pena et al.](https://www.mdpi.com/2076-3417/11/7/3194)'
  answer_sources:
  - Sysmon Event ID 11
