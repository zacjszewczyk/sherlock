- question: When DBSCAN clusters newly created files by their MACE timestamps and path metadata, does
    any file land in a dense cluster of core OS timestamps while having an anomalous path or filename,
    and can provenance learning localize the responsible process?
  context: 'Density-based clustering naturally groups files that share OS-like timestamps, making cloned
    payloads with mismatched paths stand out. Run DBSCAN over newly created files using MACE timestamps
    plus path metadata; a file landing in a dense cluster of core OS timestamps but with an anomalous
    path or filename is a high-confidence clone outlier. For attribution, use node-level provenance learning
    (e.g., ThreaTrace) to localize the process and exact file involved, and KAIROS to reconstruct the
    surrounding activity. A positive result identifies a file whose timestamps belong to the OS-file population
    but whose location betrays it as a planted payload, and provenance reconstruction gives the analyst
    the responsible process and broader incident context. References: [ThreaTrace, Wang et al.](https://arxiv.org/pdf/2111.04333)
