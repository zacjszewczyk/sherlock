- question: '[Reconnaissance] Using the ''Scanner User-Agent detection'' (Symbolic Logic) approach, can
    you detect the following condition: The user_agent field in an HTTP request contains a substring that
    exactly matches a known web scanning or content discovery tool, while Windows Event ID 4688 continues
    to show the suspicious process. What does the ''Scanner User-Agent detection'' method reveal about
    possible wordlist scanning of the perimeter?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively probes the
    organization''s internet-facing infrastructure with wordlists and crawling tools to enumerate content,
    hidden paths, administrative portals, API parameters, and cloud-storage objects that can feed later
    initial-access or data-collection operations (T1595.003, Wordlist Scanning). This evidence focuses
    on the condition that the user_agent field in an HTTP request contains a substring that exactly matches
    a known web scanning or content discovery tool, while Windows Event ID 4688 continues to show the
    suspicious process. The ''Scanner User-Agent detection'' approach (Symbolic Logic) works as follows:
    Alert when Zeek http.log user_agent matches the maintained scanner/recon-tool and scripted-client
    watchlists (Wfuzz, WPScan, gobuster, ffuf, feroxbuster, nikto, sqlmap, masscan, curl/wget/python-requests)
    and tie matches to Windows Event ID 4688 command lines; maintain as an extensible enterprise UA allow/deny
    list ([Suspicious User-Agents Related To Recon Tools, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_susp_useragents.yml);
    [OWASP CRS REQUEST-913 Scanner Detection](https://github.com/coreruleset/coreruleset/blob/main/rules/REQUEST-913-SCANNER-DETECTION.conf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable wordlist
    scanning; pivot to the source IP and its threat-intel reputation, the targeted hosts/URIs or cloud-storage
    endpoints, the request volume, success/failure (2xx vs 4xx/5xx) profile, the User-Agent and any initiating
    Windows process (Event ID 4688 command line, Event ID 5156 flow) to scope what the adversary discovered.
    A negative result helps rule out this particular angle but should be corroborated with the other questions
    in this playbook, since a single method can miss distributed, low-and-slow, or obfuscated scanning.'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Public-facing web servers, Application load balancers, API Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'let ua_deny = watchlist("Wfuzz","WPScan","gobuster","ffuf","feroxbuster","nikto","sqlmap","masscan","curl","wget","python-requests")

      from zeek_http

      | where user_agent matches_any(ua_deny)

      | join win_4688 on host(src_ip) -> command_line

      | alert "Scanner/recon-tool User-Agent observed"'
  - technology: Zeek/pseudocode
    query: 'zeek http.log

      | where user_agent in scanner_ua_watchlist

      | emit src=id.orig_h ua=user_agent uri=uri host=host'
- question: '[Reconnaissance] Using the ''Novel agent rarity scoring'' (Statistical Method) approach,
    can you detect the following condition: The user_agent field in an HTTP request contains a substring
    that exactly matches a known web scanning or content discovery tool, while Windows Event ID 4688 continues
    to show the suspicious process. What does the ''Novel agent rarity scoring'' method reveal about possible
