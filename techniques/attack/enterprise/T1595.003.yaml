    Flag User-Agents unseen in the prior 30 days that generate >10 req/s from a single IP, and separately
    profile the per-UA 4xx/5xx failure rate so high-failure novel agents rank highest; reference the initiating
    process if available ([Network Intrusion Detection and Prevention, Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable wordlist
    scanning; pivot to the source IP and its threat-intel reputation, the targeted hosts/URIs or cloud-storage
    endpoints, the request volume, success/failure (2xx vs 4xx/5xx) profile, the User-Agent and any initiating
