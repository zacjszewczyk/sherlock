    A negative result helps rule out this particular angle but should be corroborated with the other questions
    in this playbook, since a single method can miss distributed, low-and-slow, or obfuscated scanning.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 5156
  - 'NAI: Network egress/ingress points (e.g., Firewalls, Edge Routers), Web Application Firewalls (WAFs),
    Reverse Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per host: p98 = percentile(error_ratio, 98) over rolling 30d

      error_ratio = count(status in 4xx,5xx) / count(status in 2xx)

      from zeek_http join win_5156 on src_ip

      | summarize error_ratio by src_ip, host

      | where error_ratio > p98[host]

      | alert "Anomalous 4xx/5xx-to-2xx ratio (primary signal)"'
