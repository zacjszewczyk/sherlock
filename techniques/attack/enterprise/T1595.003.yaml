name: 'T1595.003: Wordlist Scanning'
id: 1fd19c0c-6343-498c-92b9-c714f9303b5f
description: 'This playbook helps an analyst investigate whether an adversary is performing active reconnaissance
  against the organization''s internet-facing perimeter using wordlist scanning (MITRE ATT&CK T1595.003,
  Wordlist Scanning, under Reconnaissance, TA0043). Unlike credential brute forcing, the goal here is
  to iteratively probe infrastructure with brute-force and crawling techniques to discover content and
  infrastructure -- hidden pages, directories, administrative portals, vulnerable legacy endpoints, API
  parameters, and globally-named cloud storage buckets/containers -- that can seed later Exploit Public-Facing
  Application, Brute Force, or Data from Cloud Storage operations. Adversaries use tools such as Dirb,
  DirBuster, GoBuster, ffuf, feroxbuster, Wfuzz, nikto, sqlmap, WPScan, masscan, s3recon, and GCPBucketBrute,
  often driven by generic or target-specific wordlists. The hunt spans network egress/ingress telemetry
  (Zeek conn.log, http.log, dns.log) and Windows host telemetry (Event ID 5156 filtering-platform connections
  and Event ID 4688 process creation), pursuing the behavior from several complementary angles: threat-intelligence
  correlation of inbound scanner/botnet source IPs (as an enrichment layer only); sequential-hypothesis
  and error-ratio profiling of per-source request success/failure outcomes; scanner and scripted-client
  User-Agent watchlisting and rarity scoring; statistically anomalous bursts of 4xx/5xx responses; cloud-storage
  bucket-name enumeration via keyworded DNS queries and NoSuchBucket/AccessDenied failure rates with Levenshtein
  permutation scoring; and parameter-fuzzing detection against single URIs. Detection methods combine
  deterministic symbolic-logic rules, statistical baselining (SPRT, percentile and standard-deviation
  error-ratio anomalies, Seasonal Hybrid ESD, parameter statistical models, Shannon entropy, Levenshtein
  distance), and machine learning (Random Forest maliciousity classification, character-level User-Agent
  NLP, DeepLog-style LSTM request-sequence modeling, Kitsune autoencoder ensemble clustering, and URL-structure
  autoencoding), so the analyst can corroborate suspected wordlist scanning against threat intel, request
  outcomes, User-Agent strings, cloud-storage enumeration patterns, and the responsible Windows process
  lineage.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
