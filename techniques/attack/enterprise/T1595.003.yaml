    A negative result helps rule out this particular angle but should be corroborated with the other questions
    in this playbook, since a single method can miss distributed, low-and-slow, or obfuscated scanning.'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Public-facing web servers, Application load balancers, API Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'seen_ua = set(user_agent over prior 30d)

      from zeek_http

      | where user_agent not in seen_ua

      | summarize req_rate=count()/window_secs, fail_rate=avg(status in 4xx,5xx) by user_agent, src_ip

      | where req_rate > 10  -- req/s from single IP

      | order by fail_rate desc   -- high-failure novel agents rank highest

      | enrich win_4688 initiating_process'
