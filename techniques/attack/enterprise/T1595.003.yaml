questions:
- question: '[Reconnaissance] Using the ''CTI scanner correlation'' (Symbolic Logic) approach, can you
    detect the following condition: An inbound network connection originates from an IP address present
    on a threat intelligence feed categorized as a known scanner, botnet, or malicious actor, and Windows
    Event ID 5156 records the session. What does the ''CTI scanner correlation'' method reveal about possible
    wordlist scanning of the perimeter?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively probes the
    organization''s internet-facing infrastructure with wordlists and crawling tools to enumerate content,
    hidden paths, administrative portals, API parameters, and cloud-storage objects that can feed later
    initial-access or data-collection operations (T1595.003, Wordlist Scanning). This evidence focuses
    on the condition that an inbound network connection originates from an IP address present on a threat
    intelligence feed categorized as a known scanner, botnet, or malicious actor, and Windows Event ID
    5156 records the session. The ''CTI scanner correlation'' approach (Symbolic Logic) works as follows:
    Alert when Zeek conn.log, http.log, and Windows Event ID 5156 source IPs match threat-intelligence
    entries for known scanners, botnets, or malicious actors. This is an enrichment layer only; never
    gate the primary first-party rules below on external feed availability ([Network Intrusion Detection
    and Prevention, Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5)). A positive result --
    a rule match, statistical outlier, or model alert -- indicates probable wordlist scanning; pivot to
    the source IP and its threat-intel reputation, the targeted hosts/URIs or cloud-storage endpoints,
    the request volume, success/failure (2xx vs 4xx/5xx) profile, the User-Agent and any initiating Windows
    process (Event ID 4688 command line, Event ID 5156 flow) to scope what the adversary discovered. A
    negative result helps rule out this particular angle but should be corroborated with the other questions
    in this playbook, since a single method can miss distributed, low-and-slow, or obfuscated scanning.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 5156
  - 'NAI: Network egress/ingress points (e.g., Firewalls, Edge Routers), Web Application Firewalls (WAFs),
    Reverse Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '-- Enrichment layer only; do not gate first-party rules on feed availability

      let scanners = lookup threat_intel where category in ("scanner","botnet","malicious")

      from zeek_conn, zeek_http, win_5156

      | where src_ip in (scanners.ip)

      | project src_ip, dest_ip, dest_port, uri, status_code, ti_category

      | alert "Inbound connection from known scanner/botnet/malicious IP"'
  - technology: Zeek/pseudocode
    query: 'zeek conn.log, http.log

      | lookup ti on id.orig_h

      | where ti.category in ("scanner","botnet","malicious")

      | emit src=id.orig_h dst=id.resp_h uri=http.uri ti=ti.category'
- question: '[Reconnaissance] Using the ''Failure-ratio first-contact (SPRT)'' (Statistical Method) approach,
    can you detect the following condition: An inbound network connection originates from an IP address
    present on a threat intelligence feed categorized as a known scanner, botnet, or malicious actor,
    and Windows Event ID 5156 records the session. What does the ''Failure-ratio first-contact (SPRT)''
    method reveal about possible wordlist scanning of the perimeter?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively probes the
    organization''s internet-facing infrastructure with wordlists and crawling tools to enumerate content,
    hidden paths, administrative portals, API parameters, and cloud-storage objects that can feed later
    initial-access or data-collection operations (T1595.003, Wordlist Scanning). This evidence focuses
    on the condition that an inbound network connection originates from an IP address present on a threat
    intelligence feed categorized as a known scanner, botnet, or malicious actor, and Windows Event ID
    5156 records the session. The ''Failure-ratio first-contact (SPRT)'' approach (Statistical Method)
    works as follows: Run Wald''s Sequential Probability Ratio Test per source IP over its first-contact
    request outcomes, treating 200/302 as success and 404/403/401/no-response as failure; declare ''scanner''
    once the log-likelihood ratio crosses the upper bound (typically after 4-5 high-failure requests).
    Tune success/failure priors so benign clients (failure ratio <0.2) are not flagged ([Fast Portscan
    Detection Using Sequential Hypothesis Testing, Jung et al.](https://www.icir.org/vern/papers/portscan-oak04.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable wordlist
    scanning; pivot to the source IP and its threat-intel reputation, the targeted hosts/URIs or cloud-storage
    endpoints, the request volume, success/failure (2xx vs 4xx/5xx) profile, the User-Agent and any initiating
    Windows process (Event ID 4688 command line, Event ID 5156 flow) to scope what the adversary discovered.
    A negative result helps rule out this particular angle but should be corroborated with the other questions
    in this playbook, since a single method can miss distributed, low-and-slow, or obfuscated scanning.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 5156
  - 'NAI: Network egress/ingress points (e.g., Firewalls, Edge Routers), Web Application Firewalls (WAFs),
    Reverse Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "-- Wald SPRT per first-contact source IP\nfor each src_ip on first contact:\n  outcome = success\
      \ if status in (200,302) else failure  # 404/403/401/no-response=failure\n  llr += log( P(outcome|scanner)\
      \ / P(outcome|benign) )\n  if llr >= upper_bound:  alert \"scanner (SPRT)\"   # typically after\
      \ 4-5 high-failure reqs\n  if llr <= lower_bound:  clear\n-- tune priors so benign clients (failure_ratio<0.2)\
      \ are not flagged"
