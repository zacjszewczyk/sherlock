- question: '[Reconnaissance] Using the ''Error burst threshold'' (Symbolic Logic) approach, can you detect
    the following condition: A single external source IP address generates a statistically anomalous rate
    of HTTP requests resulting in client or server errors, with Windows Event ID 4688 identifying the
    executing scanner process. What does the ''Error burst threshold'' method reveal about possible wordlist
    scanning of the perimeter?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively probes the
    organization''s internet-facing infrastructure with wordlists and crawling tools to enumerate content,
    hidden paths, administrative portals, API parameters, and cloud-storage objects that can feed later
    initial-access or data-collection operations (T1595.003, Wordlist Scanning). This evidence focuses
    on the condition that a single external source IP address generates a statistically anomalous rate
    of HTTP requests resulting in client or server errors, with Windows Event ID 4688 identifying the
    executing scanner process. The ''Error burst threshold'' approach (Symbolic Logic) works as follows:
    Alert when a source IP issues >100 403/404 responses in 1 minute to a single host, profiling the failed-request
    count as the explicit signal, and match the process in Windows event logs; derive the count from each
    host''s normal peak error rate ([Network Intrusion Detection and Prevention, Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable wordlist
    scanning; pivot to the source IP and its threat-intel reputation, the targeted hosts/URIs or cloud-storage
    endpoints, the request volume, success/failure (2xx vs 4xx/5xx) profile, the User-Agent and any initiating
    Windows process (Event ID 4688 command line, Event ID 5156 flow) to scope what the adversary discovered.
    A negative result helps rule out this particular angle but should be corroborated with the other questions
    in this playbook, since a single method can miss distributed, low-and-slow, or obfuscated scanning.'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Public-facing web servers, API Gateways, Cloud Storage Buckets'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from zeek_http

      | where status in (403,404)

      | summarize errs=count() by src_ip, host, bin(1m)

      | where errs > 100   -- derive from host normal peak error rate

      | join win_4688 on host(src_ip)

      | alert "Error burst (>100 4xx/min to single host)"'
