name: 'T1113: Screen Capture'
id: 8f499c05-befd-490d-8928-32a7ccda6238
description: 'This playbook helps an analyst determine whether an adversary is performing Screen Capture
  (T1113): taking screenshots of the desktop to gather sensitive information during an operation, whether
  via remote access tool features, native utilities (psr.exe, snippingtool.exe, screencapture, xwd, import),
  or API calls such as CopyFromScreen/BitBlt. It correlates host process telemetry (Windows Event ID 4688,
  Sysmon EID 1, PowerShell script-block 4104, module loads Sysmon EID 7) with file-creation events (Sysmon
  EID 11) and network egress telemetry (Zeek files.log/conn.log/dns.log) to surface the capture-then-write
  and capture-then-exfil chains. Investigative angles include: threat-intel matching of capture-tool hashes/filenames
  and image MIME types; rare-prevalence and rare parent-child analysis; suspicious command lines and obfuscated
  CopyFromScreen one-liners; non-interactive/system-account execution on hosts where GUI use is rare;
  image files written to temp/staging directories; spikes and machine-like periodicity in capture executions
  and outbound image transfers (including encrypted exfil); and capture activity coincident with sensitive
  active-window titles. Detection blends symbolic-logic rules, statistical baselining (prevalence, Z-score,
  entropy, 3-sigma volume, FFT/autocorrelation periodicity, failure-mode analysis) and machine learning
  (Random Forest/Gradient Boosting classifiers, Isolation Forest, LSTM/DBSCAN, SARIMA/Prophet forecasting)
  to produce explainable, evasion-resistant alerts for the Collection tactic.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
