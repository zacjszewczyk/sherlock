- question: 'Using deterministic rule logic, can you determine whether ''Correlate suspicious parents
    to unusual image file creation'' indicates screen capture activity (T1113)? Specifically: 1. Symbolic
    Match: Join process creation (Sysmon EID 1) with file creation (Sysmon EID 11). Alert when a process
    with a non-interactive parent (services.exe, svchost.exe, taskhostw.exe) creates a file ending in
    .png/.jpg/.bmp/.gif, especially in temp/staging paths. This recognizes the capture-then-write chain
    documented for CopyFromScreen tooling ([Graphics.CopyFromScreen, Microsoft](https://learn.microsoft.com/en-us/dotnet/api/system.drawing.graphics.copyfromscreen)).'
