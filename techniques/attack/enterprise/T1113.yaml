    A process running in a non-interactive context (e.g., as a service, under a system account) creates
    one or more files with common image extensions (.png, .jpg, .bmp) in a non-standard or temporary directory.
    Approach (Correlate suspicious parents to unusual image file creation): 1. Symbolic Match: Join process
    creation (Sysmon EID 1) with file creation (Sysmon EID 11). Alert when a process with a non-interactive
    parent (services.exe, svchost.exe, taskhostw.exe) creates a file ending in .png/.jpg/.bmp/.gif, especially
    in temp/staging paths. This recognizes the capture-then-write chain documented for CopyFromScreen
