  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Flag rare capture-tool hashes below fleet prevalence\nWINDOW = 30d\nFOR EACH proc_hash\
      \ WHERE name ~ capture_tool_pattern AND hash NOT IN allowlist:\n  prevalence = distinct_count(host)\
      \ / total_hosts\nCOMPUTE p1 = 1st_percentile(per_hash_host_count_distribution)\nALERT WHEN prevalence\
      \ < max(0.01, p1)  // tune per environment"
- question: 'Using a machine-learning model, can you determine whether ''Score process metadata and API
    chains with a classifier for screen capture risk'' indicates screen capture activity (T1113)? Specifically:
    3. Machine Learning Classification: Deploy a supervised classifier (Random Forest/Gradient Boosting)
    over process metadata (parent process, user context, command-line tokens, signer, module loads). Additionally
    apply API-call-sequence matching for the canonical capture chain GetDC -> CreateCompatibleBitmap ->
    BitBlt -> GetDIBits/CreateFile, which occurs predominantly in malware ([A Novel Approach to Detect
    Malware Based on API Call Sequence Analysis, Cho et al.](https://journals.sagepub.com/doi/full/10.1155/2015/659101)),
    and/or an LSTM over API-call sequences ([Catak et al.](https://peerj.com/articles/cs-285/)). Flag
    high-risk processes performing image file I/O even when the hash is unknown, and surface the top-3
    contributing features (e.g., parent process, capture API call, signer) in the alert text per [xNIDS,
    Feng et al.](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng).'
