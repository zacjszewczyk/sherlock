    query: "// Classify process risk + canonical capture API-call chain\nfeatures = [parent_proc, user_ctx,\
      \ cmdline_tokens, signer, module_loads]\nmodel = RandomForest|GradientBoosting (or LSTM over API\
      \ seq)\napi_chain = GetDC -> CreateCompatibleBitmap -> BitBlt -> GetDIBits/CreateFile\nscore = model.predict(features)\n\
      IF score>thr OR matches(api_chain) AND image_file_io THEN\n  alert(score, top3_features=SHAP(model,features))"
- question: 'Using deterministic rule logic, can you determine whether ''Detect screen capture command
    lines and API calls'' indicates screen capture activity (T1113)? Specifically: 1. Symbolic Match:
    Search process command lines (Sysmon EID 1, Windows Event ID 4688) and PowerShell script-block logs
    (Event ID 4104) for psr.exe with silent/non-GUI args (''/start'',''/gui 0'',''/sc'',''/output'' per
    [Psr.exe LOLBAS Entry](https://lolbas-project.github.io/lolbas/Binaries/Psr/) and [SigmaHQ Psr rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_psr_capture_screenshots.yml)),
    snippingtool.exe automation, and .NET capture primitives such as ''[System.Drawing.Graphics]::CopyFromScreen''
    or System.Drawing assembly loads (Sysmon EID 7) per [Graphics.CopyFromScreen, Microsoft](https://learn.microsoft.com/en-us/dotnet/api/system.drawing.graphics.copyfromscreen).'
  context: 'Tactic context (Collection): adversaries gather data of interest to their objective; screen
    capture lets them harvest sensitive on-screen information for later exfiltration. Evidence under investigation:
    A native Windows utility (e.g., psr.exe, snippingtool.exe) or a PowerShell script is executed with
    command-line arguments or script content indicative of automated, non-interactive, or hidden screen
    capture operations. Approach (Detect screen capture command lines and API calls): 1. Symbolic Match:
    Search process command lines (Sysmon EID 1, Windows Event ID 4688) and PowerShell script-block logs
    (Event ID 4104) for psr.exe with silent/non-GUI args (''/start'',''/gui 0'',''/sc'',''/output'' per
    [Psr.exe LOLBAS Entry](https://lolbas-project.github.io/lolbas/Binaries/Psr/) and [SigmaHQ Psr rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_psr_capture_screenshots.yml)),
    snippingtool.exe automation, and .NET capture primitives such as ''[System.Drawing.Graphics]::CopyFromScreen''
    or System.Drawing assembly loads (Sysmon EID 7) per [Graphics.CopyFromScreen, Microsoft](https://learn.microsoft.com/en-us/dotnet/api/system.drawing.graphics.copyfromscreen).
    A positive result means a process or host is capturing the screen and/or staging and exfiltrating
    images in a manner inconsistent with legitimate user activity (e.g., non-interactive/system context,
    machine-like periodicity, obfuscated capture primitives, or anomalous outbound image volume); a negative
    result means the observed behavior matches expected baselines. Investigate the named area of interest
    (User workstations, especially those of privileged users or personnel handling sensitive data (e.g.,
    finance, legal, R&D).) and pivot from any hit to the originating process, parent, account, logon type,
    written image files, and any downstream exfiltration.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: User workstations, especially those of privileged users or personnel handling sensitive data
    (e.g., finance, legal, R&D).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Detect screen-capture command lines / API calls\nMATCH (SysmonID=1 OR WinEventID=4688 OR\
      \ WinEventID=4104)\n  WHERE (proc_name='psr.exe' AND cmdline MATCHES /\\/start|\\/gui 0|\\/sc|\\\
      /output/)\n     OR (proc_name='snippingtool.exe' AND cmdline_has_automation)\n     OR scriptblock\
      \ MATCHES /\\[System\\.Drawing\\.Graphics\\]::CopyFromScreen/\nOR MATCH SysmonID=7 WHERE module='System.Drawing'\n\
      THEN alert(severity='high')"
- question: 'Using statistical baselining, can you determine whether ''Score command-line complexity via
    Z-score to highlight anomalies'' indicates screen capture activity (T1113)? Specifically: 2. Statistical
    Analysis: Per user and process (e.g., powershell.exe), profile the distribution (mean, std) of command-line
    length and Shannon entropy. Compute the Z-score for each new execution and flag Z>3.0 (tune to your
    fleet''s distribution), indicating abnormally complex/obfuscated commands often used to hide CopyFromScreen
    one-liners. Unsupervised command-line embeddings can replace hand features for novel obfuscation ([BERT
    Embeddings for Command-Line Anomaly Detection, CrowdStrike](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/)).'
