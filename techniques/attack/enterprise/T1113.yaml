questions:
- question: 'Using deterministic rule logic, can you determine whether ''Match screen capture hashes and
    filenames against threat intel'' indicates screen capture activity (T1113)? Specifically: 1. Symbolic
    Match: Continuously monitor process creation events (Windows Event ID 4688, Sysmon EID 1) and network
    file transfers (Zeek files.log). Compare process hashes and names against a curated threat-intel feed
    of known screen-capture malware and LOLBins (e.g., psr.exe per [Psr.exe LOLBAS Entry](https://lolbas-project.github.io/lolbas/Binaries/Psr/),
    [Screen Capture Activity Via Psr.EXE, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_psr_capture_screenshots.yml)).
    Simultaneously use regex on Zeek files.log to match filenames/MIME types (image/png, image/jpeg, .mht)
    associated with capture output. Generate a high-priority alert on any match.'
  context: 'Tactic context (Collection): adversaries gather data of interest to their objective; screen
    capture lets them harvest sensitive on-screen information for later exfiltration. Evidence under investigation:
    A process creation event is observed where the executable''s name or file hash matches an entry on
    a threat intelligence list of unauthorized screen capture utilities. Alternatively, a file transfer
    is detected where the filename or MIME type matches patterns associated with the output of these tools.
    Approach (Match screen capture hashes and filenames against threat intel): 1. Symbolic Match: Continuously
    monitor process creation events (Windows Event ID 4688, Sysmon EID 1) and network file transfers (Zeek
    files.log). Compare process hashes and names against a curated threat-intel feed of known screen-capture
    malware and LOLBins (e.g., psr.exe per [Psr.exe LOLBAS Entry](https://lolbas-project.github.io/lolbas/Binaries/Psr/),
    [Screen Capture Activity Via Psr.EXE, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_psr_capture_screenshots.yml)).
    Simultaneously use regex on Zeek files.log to match filenames/MIME types (image/png, image/jpeg, .mht)
    associated with capture output. Generate a high-priority alert on any match. A positive result means
    a process or host is capturing the screen and/or staging and exfiltrating images in a manner inconsistent
    with legitimate user activity (e.g., non-interactive/system context, machine-like periodicity, obfuscated
    capture primitives, or anomalous outbound image volume); a negative result means the observed behavior
    matches expected baselines. Investigate the named area of interest (User workstations, Virtual Desktop
    Infrastructure (VDI) instances, Network egress points (e.g., firewalls, proxies).) and pivot from
    any hit to the originating process, parent, account, logon type, written image files, and any downstream
    exfiltration.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek files.log
  - 'NAI: User workstations, Virtual Desktop Infrastructure (VDI) instances, Network egress points (e.g.,
    firewalls, proxies).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Match screen-capture hashes/filenames against threat intel\nMATCH proc_create (WinEventID=4688\
      \ OR SysmonID=1)\n  WHERE proc_hash IN ti_screencapture_hashes\n     OR proc_name IN ['psr.exe','screencapture','xwd','import']\n\
      OR MATCH zeek.files.log\n  WHERE mime_type IN ['image/png','image/jpeg']\n     OR filename MATCHES\
      \ /\\.(png|jpe?g|bmp|gif|mht)$/\nTHEN alert(severity='high', enrich=[host,user,dest_ip])"
- question: 'Using statistical baselining, can you determine whether ''Flag rare screen capture hashes
    below baseline prevalence'' indicates screen capture activity (T1113)? Specifically: 2. Statistical
    Analysis (Volume/Prevalence): Compute enterprise-wide prevalence (count of distinct endpoints) for
    each process hash over a 30-day window. If a hash matches a capture-tool name pattern but is not allowlisted
    and its prevalence is below a low threshold (derive per environment; start at <1% of endpoints), escalate.
    Tune the threshold to the 1st percentile of your fleet''s per-hash host-count distribution to control
    false positives.'
