- question: 'Using a machine-learning model, can you determine whether ''Spot periodic execution patterns
    with time-series analysis'' indicates screen capture activity (T1113)? Specifically: 3. Time-Series
    Analysis (Frequency): Ingest execution timestamps for capture utilities per host and apply FFT/autocorrelation
    to detect strong periodic signals (e.g., every 300s) per [BAYWATCH, Hu et al.](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks)
    and [RITA, Active Countermeasures](https://github.com/activecm/rita). A repeating cadence not tied
    to a known scheduled task strongly indicates automated collection; report the detected period and
    confidence in the alert.'
