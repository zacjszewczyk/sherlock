    is present and to decide whether and how to proceed without tripping defenses. This evidence focuses
    on the condition that a process is created where the file hash of the executable matches a known malicious
    hash specifically associated with security software discovery tools. This Statistical Method approach
    looks for the following signal: For process events not matching a known hash, compute file-hash prevalence
    across the environment over 30 days (derive your own percentile cutoffs per fleet; start at the bottom
    1st percentile) and flag rare hashes whose command line contains discovery keywords (''antivirus'',''firewall'',''defender'',''edr'',''sysmon'').
    In parallel, fit an [Isolation Forest](https://doi.org/10.1145/2133360.2133363) on per-process features
    (hash prevalence, argument count, parent rarity, user privilege, child-of-shell flag) using rare-argument/token
    features from [Living-Off-The-Land Command Detection](https://arxiv.org/abs/2111.15039); flag the
    top anomaly-score outliers. Profile failure context (process exits with access-denied to security
    paths) as a distinct signal. A positive result -- a rule match, statistical outlier, or model alert
    -- suggests a process or user on the host is actively probing installed security products in a way
    that deviates from sanctioned administration and normal usage; pivot to the responsible process, its
    parent lineage, the executing user and privilege context, the targeted security paths/products, and
    any subsequent evasion or network activity. A negative result helps rule out this reconnaissance vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-and-slow, or living-off-the-land enumeration.'
