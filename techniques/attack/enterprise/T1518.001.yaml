- question: '[Discovery] Tripwire on high-volume reads of security software paths including access-denied:
    Can you determine whether a single process generates a high volume of file system or registry read
    access events within a short time frame, targeting directories or registry hives associated with security
    software -- specifically, using the ''Tripwire on high-volume reads of security software paths including
    access-denied'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary enumerates the security
    software, defensive agents, and configurations on a host or in the cloud to learn what monitoring
    is present and to decide whether and how to proceed without tripping defenses. This evidence focuses
    on the condition that a single process generates a high volume of file system or registry read access
    events within a short time frame, targeting directories or registry hives associated with security
    software. This Symbolic Logic approach looks for the following signal: Trigger when a single Process
    ID generates more than 500 object-access events (Event ID 4663) in under 60 seconds where Object Name
    includes `C:\Program Files\`, `C:\ProgramData\`, or `HKLM\SOFTWARE\` (tune the 500/60s threshold per
    host role). Add a distinct failure-mode rule for bursts of 4663 events with Access Mask reads returning
    access-denied against vendor security directories (CrowdStrike, SentinelOne, Defender, Carbon Black),
    per the logging guidance in [CISA/NSA LOTL](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF).
    This deterministic tripwire is the floor. A positive result -- a rule match, statistical outlier,
    or model alert -- suggests a process or user on the host is actively probing installed security products
    in a way that deviates from sanctioned administration and normal usage; pivot to the responsible process,
    its parent lineage, the executing user and privilege context, the targeted security paths/products,
    and any subsequent evasion or network activity. A negative result helps rule out this reconnaissance
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
