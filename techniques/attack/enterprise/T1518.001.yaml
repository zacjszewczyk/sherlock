questions:
- question: '[Discovery] Match executable hash against threat intelligence and deterministic enumeration-tool
    signatures: Can you determine whether a process is created where the file hash of the executable matches
    a known malicious hash specifically associated with security software discovery tools -- specifically,
    using the ''Match executable hash against threat intelligence and deterministic enumeration-tool signatures''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary enumerates the security
    software, defensive agents, and configurations on a host or in the cloud to learn what monitoring
    is present and to decide whether and how to proceed without tripping defenses. This evidence focuses
    on the condition that a process is created where the file hash of the executable matches a known malicious
    hash specifically associated with security software discovery tools. This Symbolic Logic approach
    looks for the following signal: For each process creation (Windows Event ID 4688 / Sysmon EID1 / auditd
    execve), compare the executable SHA256 against a curated threat-intel feed of known security-discovery
    tooling (e.g., Seatbelt, SharpEDRChecker) and trigger high-severity on any match. Layer a deterministic
    fallback on image name + argument groups using published rules from [SigmaHQ](https://github.com/SigmaHQ/sigma)
    and the [Seatbelt enumeration rule](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_pua_seatbelt/)
    so unknown-hash but known-behavior tools still fire, consistent with the comprehensive-logging posture
    in [CISA/NSA LOTL guidance](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF).
    Keep these concrete signatures as the determinism floor. A positive result -- a rule match, statistical
    outlier, or model alert -- suggests a process or user on the host is actively probing installed security
    products in a way that deviates from sanctioned administration and normal usage; pivot to the responsible
    process, its parent lineage, the executing user and privilege context, the targeted security paths/products,
    and any subsequent evasion or network activity. A negative result helps rule out this reconnaissance
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - auditd:SYSCALL execve
  - 'NAI: User Workstations, Domain Controllers, Application Servers, Cloud Compute Instances'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match executable hash against threat intelligence and deterministic enumeration-tool signatures

      source IN [Windows Event ID 4688, Windows Event ID 1 (Sysmon), auditd:SYSCALL execve]

      | WHERE matches_action_criteria("Match executable hash against threat intelligence and deterministic
      enumeration-tool signatures")

      // For each process creation (Windows Event ID 4688 / Sysmon EID1 / auditd execve), compare the
      executable SHA256 against a

      | ALERT enrich(host, user, process, parent, cmdline, target, dest)'
- question: '[Discovery] Score hash/command prevalence and rare multi-feature process vectors: Can you
    determine whether a process is created where the file hash of the executable matches a known malicious
    hash specifically associated with security software discovery tools -- specifically, using the ''Score
    hash/command prevalence and rare multi-feature process vectors'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary enumerates the security
