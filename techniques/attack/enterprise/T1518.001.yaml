name: 'T1518.001: Security Software Discovery'
id: 09334020-cd0a-434c-b2db-2691bcf2cd00
description: 'This playbook helps an analyst investigate whether an adversary is enumerating the security
  software, defensive agents, sensors, and configurations present on a host or in a cloud environment
  (MITRE ATT&CK T1518.001, Security Software Discovery) so they can shape follow-on behavior such as defense
  evasion, deeper compromise, or selective deployment of payloads. It guides the hunt across several behavioral
  angles spanning Windows, Linux, macOS, and IaaS: execution of known security-discovery tooling matched
  by file hash or behavior signature (e.g., Seatbelt, SharpEDRChecker); invocation of native utilities
  (tasklist, wmic, reg query, sc query, netsh, Get-MpComputerStatus, ps/grep, systemctl) with arguments
  that name antivirus/EDR/firewall products; bursts of high-volume file-system and registry read access
  against vendor security directories and hives, including access-denied probing of locked-down hosts;
  discovery utilities spawned by anomalous parents such as Office applications, browsers, or PDF readers;
  and on-host discovery commands followed quickly by outbound connections to blocklisted, newly registered,
  or high-entropy DNS/IP infrastructure. Detection methods combine symbolic-logic rules, statistical baselining/anomaly
  scoring, and machine-learning models (Isolation Forest, supervised classifiers, NLP/transformer command
  models, log-sequence and provenance-graph learners) applied to Windows Security/Sysmon events, PowerShell
  script-block logs, auditd, macOS unified logs, and Zeek conn/dns telemetry, so the analyst can corroborate
  suspected security-software reconnaissance against process lineage, command intent, read-access volume,
  and subsequent network behavior.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
