name: 'T1037.003: Network Logon Script'
id: fa429a25-99a5-4045-8550-0a63c36bbc33
description: Investigate adversary abuse of Active Directory and Group Policy network logon scripts (T1037.003),
  which run automatically at user logon with the privileges of the assigned user and can apply to many
  or all hosts in a domain. This playbook helps an analyst hunt for both PERSISTENCE and PRIVILEGE ESCALATION
  abuse of these scripts. For persistence it covers out-of-band changes to logon scripts in SYSVOL/NETLOGON
  or via GPO (gPCMachineExtensionNames/scriptPath) followed by execution, child processes whose hash/signer/command
  line is unapproved or matches threat intelligence, obfuscated or LOLBin download-execute commands run
  at logon, modifications by unauthorized writers or outside maintenance windows, and logon-script child
  processes that beacon, resolve DGA-like domains, or reach known-malicious destinations. For privilege
  escalation it covers logon-script children that run LPE tools/exploits or encoded launchers, that invoke
  net.exe/sc.exe/schtasks.exe to create or modify privileged accounts/services/tasks, tight edit-then-privileged-execution
  chains, and token/integrity mismatches such as a non-admin user's logon-script child running with a
  Full token or spawning an NT AUTHORITY\SYSTEM process. It combines symbolic-logic correlation rules,
  statistical baselining, and machine-learning scoring across Windows Security/System events and Zeek
  network logs.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
