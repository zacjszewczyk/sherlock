    CNN/LSTM classifier) on benign logon-script command tokens and alert on high reconstruction error
    / malicious score indicating staged execution or obfuscation, reporting the highest-error tokens as
    explanation ([Hendler et al.](https://cris.bgu.ac.il/en/publications/detecting-malicious-powershell-commands-using-deep-neural-network),
    [Fang et al.](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099)). A positive
    result (a correlation match, an anomaly above threshold, or a high model score) is a high-priority
    lead: triage by reviewing the offending script path, the writer/editor identity, the spawned child-process
    lineage and command line, and the logon session in which it ran. A negative result helps scope and
    rule out logon-script abuse for the host/share in question. Pivot across Windows Event ID 4688, and
    focus collection on the named area of interest: Domain controllers, member servers, and user workstations.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain controllers, member servers, and user workstations.'
  range: Last 90 days for model training/baseline; score events in near-real-time and correlate the edit-then-execution
    chain within a +/- 15 minute window.
  queries:
  - technology: Python/ML pseudocode
    query: 'ae = Autoencoder|CharCNN_LSTM.fit(benign_logon_script_command_tokens)

      err = reconstruction_error(ae, tokenize(cmd))

      ALERT WHERE err > threshold REPORT highest_error_tokens(cmd)'
- question: '[Persistence] Using the ''Unauthorized writer rule'' approach (Symbolic Logic), can you determine
    whether a logon script file located in a SYSVOL or Netlogon share is modified by a user account not
    authorized for such changes or at a time outside of an established maintenance window?'
  context: 'In the context of Persistence, an adversary who can alter a network logon script gains code
    execution every time the affected users log on, surviving reboots and credential resets and potentially
    fanning out across every host the script applies to. This question pursues the evidence that A logon
    script file located in a SYSVOL or Netlogon share is modified by a user account not authorized for
    such changes or at a time outside of an established maintenance window. It applies the Symbolic Logic
    technique known as ''Unauthorized writer rule''. Method guidance: Alert when a non-allowlisted SubjectUserName
    modifies a SYSVOL/NETLOGON logon script (EID 4663 write/4656, 5145 with AccessMask write), then correlate
    the write with the next script-execution event; treat any writer outside the GPO-admin allowlist as
    suspicious since policy-driven changes flow only through Group Policy ([Microsoft GPO logon scripts](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/dn789196(v=ws.11)),
    [MITRE ATT&CK T1037.003](https://attack.mitre.org/techniques/T1037/003/), [SigmaHQ](https://github.com/SigmaHQ/sigma)).
    A positive result (a correlation match, an anomaly above threshold, or a high model score) is a high-priority
    lead: triage by reviewing the offending script path, the writer/editor identity, the spawned child-process
    lineage and command line, and the logon session in which it ran. A negative result helps scope and
    rule out logon-script abuse for the host/share in question. Pivot across Windows Event ID 4663, Windows
    Event ID 5145, and focus collection on the named area of interest: Domain controllers hosting SYSVOL
    and NETLOGON shares.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - 'NAI: Domain controllers hosting SYSVOL and NETLOGON shares.'
  range: Last 90 days, centered on the script modification and the subsequent logon/execution with a +/-
    15 minute correlation window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'writes = FILTER WinEvent BY (EID IN [4663,4656] AND AccessMask=write OR EID=5145 AND AccessMask=write)
      AND path MATCHES "*\\SYSVOL\\*|*\\NETLOGON\\*" AND path MATCHES "*.bat|*.cmd|*.vbs|*.ps1"

      ALERT WHERE SubjectUserName NOT IN gpo_admin_allowlist

      THEN correlate write WITH next script-execution event on same script'
- question: '[Persistence] Using the ''Temporal anomaly scoring'' approach (Statistical Method), can you
    determine whether a logon script file located in a SYSVOL or Netlogon share is modified by a user
    account not authorized for such changes or at a time outside of an established maintenance window?'
  context: 'In the context of Persistence, an adversary who can alter a network logon script gains code
