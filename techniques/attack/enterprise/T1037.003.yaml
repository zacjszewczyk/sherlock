questions:
- question: '[Persistence] Using the ''Script IOC correlation'' approach (Symbolic Logic), can you determine
    whether a network logon script in SYSVOL, NETLOGON, or a GPO-linked share is changed in Active Directory
    or on disk and then executed at user logon, with the resulting child process hash, signer, or command
    line matching an unapproved or known-malicious script?'
  context: 'In the context of Persistence, an adversary who can alter a network logon script gains code
    execution every time the affected users log on, surviving reboots and credential resets and potentially
    fanning out across every host the script applies to. This question pursues the evidence that A network
    logon script in SYSVOL, NETLOGON, or a GPO-linked share is changed in Active Directory or on disk
    and then executed at user logon, with the resulting child process hash, signer, or command line matching
    an unapproved or known-malicious script. It applies the Symbolic Logic technique known as ''Script
    IOC correlation''. Method guidance: Alert when a logon-script change in AD (EID 5136 on gPCMachineExtensionNames/scriptPath)
    or a write to SYSVOL/NETLOGON (EID 5145/4663) is followed within the same or next logon (EID 4624
    type 2/10) by execution of that script and the resulting child-process SHA256, signer, or destination
    matches threat intel or is absent from an approved-script inventory. Legitimate logon-script changes
    occur only via GPO edit and SYSVOL replication, so out-of-band writes are high fidelity ([Microsoft
    GPO logon scripts](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/dn789196(v=ws.11)),
    [MITRE ATT&CK T1037.003](https://attack.mitre.org/techniques/T1037/003/), [SigmaHQ](https://github.com/SigmaHQ/sigma),
    [MITRE CAR](https://github.com/mitre-attack/car)). A positive result (a correlation match, an anomaly
    above threshold, or a high model score) is a high-priority lead: triage by reviewing the offending
    script path, the writer/editor identity, the spawned child-process lineage and command line, and the
    logon session in which it ran. A negative result helps scope and rule out logon-script abuse for the
    host/share in question. Pivot across Windows Event ID 4688, Windows Event ID 4624, Windows Event ID
    5136, Windows Event ID 5145, Zeek conn.log, and focus collection on the named area of interest: Domain
    controllers, member servers, user workstations, and network shares hosting logon scripts.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 5136
  - Windows Event ID 5145
  - Zeek conn.log
  - 'NAI: Domain controllers, member servers, user workstations, and network shares hosting logon scripts.'
  range: Last 90 days, centered on the script modification and the subsequent logon/execution with a +/-
    15 minute correlation window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'edits = FILTER WinEvent BY (EID=5136 AND attr IN [gPCMachineExtensionNames,scriptPath]) OR
      (EID IN [5145,4663] AND path MATCHES "*\\SYSVOL\\*" OR path MATCHES "*\\NETLOGON\\*" AND AccessMask=write)

      logons = FILTER WinEvent BY EID=4624 AND LogonType IN [2,10]

      exec = FILTER WinEvent BY EID=4688 AND parent IN [wscript.exe,cscript.exe,cmd.exe,powershell.exe]

      chain = JOIN edits, logons, exec ON Host WHERE exec.time within next_logon_of(edits)

      ALERT WHERE chain.child_sha256 IN ti_hashes OR chain.signer NOT IN trusted OR chain.script_path
      NOT IN approved_script_inventory'
- question: '[Persistence] Using the ''Child rarity scoring'' approach (Statistical Method), can you determine
    whether a network logon script in SYSVOL, NETLOGON, or a GPO-linked share is changed in Active Directory
    or on disk and then executed at user logon, with the resulting child process hash, signer, or command
    line matching an unapproved or known-malicious script?'
  context: 'In the context of Persistence, an adversary who can alter a network logon script gains code
    execution every time the affected users log on, surviving reboots and credential resets and potentially
    fanning out across every host the script applies to. This question pursues the evidence that A network
    logon script in SYSVOL, NETLOGON, or a GPO-linked share is changed in Active Directory or on disk
    and then executed at user logon, with the resulting child process hash, signer, or command line matching
    an unapproved or known-malicious script. It applies the Statistical Method technique known as ''Child
    rarity scoring''. Method guidance: For each script path/GPO, baseline the set of child images and
    argument templates over 30-90 days; flag child-process or argument combinations seen in <1% of historical
    runs, and surface Volume (child count/logon), Frequency (executions/min vs baseline), and State (process
    exit code / failed-write rate) in the alert. Use Isolation Forest over these per-script feature vectors
    as an unsupervised parallel baseline ([Isolation Forest](https://doi.org/10.1145/2133360.2133363),
    [Siadati & Memon](https://doi.org/10.1145/3133956.3134003)). A positive result (a correlation match,
    an anomaly above threshold, or a high model score) is a high-priority lead: triage by reviewing the
    offending script path, the writer/editor identity, the spawned child-process lineage and command line,
    and the logon session in which it ran. A negative result helps scope and rule out logon-script abuse
    for the host/share in question. Pivot across Windows Event ID 4688, Windows Event ID 4624, Windows
    Event ID 5136, Windows Event ID 5145, Zeek conn.log, and focus collection on the named area of interest:
    Domain controllers, member servers, user workstations, and network shares hosting logon scripts.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 5136
  - Windows Event ID 5145
  - Zeek conn.log
  - 'NAI: Domain controllers, member servers, user workstations, and network shares hosting logon scripts.'
  range: Last 90 days for baselining; evaluate new events against the 30-90 day baseline and center correlation
    on the logon/modification event with a +/- 15 minute window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = SELECT script_path, child_image, arg_template, count() AS c FROM exec WHERE time>now-90d
      GROUP BY script_path,child_image,arg_template

      freq = c / SUM(c) OVER (PARTITION BY script_path)

      ALERT WHERE freq < 0.01

      REPORT Volume=child_count_per_logon, Frequency=exec_per_min_vs_baseline, State=exit_code|failed_write_rate'
  - technology: Python/IsolationForest pseudocode
    query: 'X = per_script_feature_vectors(child_image, arg_template, child_count, freq)

      model = IsolationForest().fit(X_baseline)

      ALERT WHERE model.decision_function(x) < anomaly_threshold'
- question: '[Persistence] Using the ''Process classifier'' approach (Machine Learning), can you determine
