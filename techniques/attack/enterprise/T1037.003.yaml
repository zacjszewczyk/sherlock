    script file located in a SYSVOL or Netlogon share is modified by a user account not authorized for
    such changes or at a time outside of an established maintenance window. It applies the Statistical
    Method technique known as ''Temporal anomaly scoring''. Method guidance: Model the historical modification
    cadence of each script with change-point detection (CUSUM/PELT/Bayesian online CPD); flag edits outside
    the established maintenance window or that constitute a statistically significant rate change, and
    report the deviation magnitude. Track failed/denied write attempts (EID 4663 status 0xC0000022) as
    a distinct precursor signal ([Aminikhanghahi & Cook change-point survey](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)).
    A positive result (a correlation match, an anomaly above threshold, or a high model score) is a high-priority
    lead: triage by reviewing the offending script path, the writer/editor identity, the spawned child-process
    lineage and command line, and the logon session in which it ran. A negative result helps scope and
    rule out logon-script abuse for the host/share in question. Pivot across Windows Event ID 4663, Windows
    Event ID 5145, and focus collection on the named area of interest: Domain controllers hosting SYSVOL
    and NETLOGON shares.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - 'NAI: Domain controllers hosting SYSVOL and NETLOGON shares.'
  range: Last 90 days for baselining; evaluate new events against the 30-90 day baseline and center correlation
    on the logon/modification event with a +/- 15 minute window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = per_script modification_timestamps

      cp = changepoint_detect(series, method=CUSUM|PELT|BayesianOnlineCPD)

      ALERT WHERE edit_time OUTSIDE maintenance_window OR cp.significant REPORT deviation_magnitude

      TRACK denied_writes = FILTER EID=4663 AND status=0xC0000022 AS precursor_signal'
