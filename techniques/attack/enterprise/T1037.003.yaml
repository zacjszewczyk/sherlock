    lineage and command line, and the logon session in which it ran. A negative result helps scope and
    rule out logon-script abuse for the host/share in question. Pivot across Windows Event ID 4688, Windows
    Event ID 4624, Windows Event ID 5136, Windows Event ID 5145, Zeek conn.log, and focus collection on
    the named area of interest: Domain controllers, member servers, user workstations, and network shares
    hosting logon scripts.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 5136
  - Windows Event ID 5145
  - Zeek conn.log
  - 'NAI: Domain controllers, member servers, user workstations, and network shares hosting logon scripts.'
  range: Last 90 days for model training/baseline; score events in near-real-time and correlate the edit-then-execution
    chain within a +/- 15 minute window.
  queries:
  - technology: Python/ML pseudocode
    query: 'feat = features(cmd_length, token_entropy, keyword_flags, parent_lineage, user_role, host_class)

      model = RandomForest|XGBoost.fit(labeled_logon_script_children)

      score = model.predict_proba(feat)

      ALERT WHERE score > threshold REPORT top3_features(feat)  # e.g. encoded_flag, rare_child_image,
      off_hours'
- question: '[Persistence] Using the ''Obfuscation regex detection'' approach (Symbolic Logic), can you
    determine whether a command executed by a logon script contains high-entropy strings, suspicious keywords,
    or invokes a LOLBin with parameters for downloading or executing code during interactive logon?'
  context: 'In the context of Persistence, an adversary who can alter a network logon script gains code
    execution every time the affected users log on, surviving reboots and credential resets and potentially
    fanning out across every host the script applies to. This question pursues the evidence that A command
    executed by a logon script contains high-entropy strings, suspicious keywords, or invokes a LOLBin
    with parameters for downloading or executing code during interactive logon. It applies the Symbolic
    Logic technique known as ''Obfuscation regex detection''. Method guidance: Apply Sigma/CAR regexes
    to logon-script child commands for PowerShell obfuscation (-enc/-EncodedCommand, -w hidden, -nop,
    FromBase64String, IEX), VBScript/CMD obfuscation, and LOLBin download-execute (certutil -urlcache,
    bitsadmin /transfer, mshta http, regsvr32 /i:http) and alert on match ([SigmaHQ](https://github.com/SigmaHQ/sigma),
    [MITRE CAR](https://github.com/mitre-attack/car), [MITRE ATT&CK T1037.003](https://attack.mitre.org/techniques/T1037/003/)).
    A positive result (a correlation match, an anomaly above threshold, or a high model score) is a high-priority
    lead: triage by reviewing the offending script path, the writer/editor identity, the spawned child-process
    lineage and command line, and the logon session in which it ran. A negative result helps scope and
    rule out logon-script abuse for the host/share in question. Pivot across Windows Event ID 4688, and
    focus collection on the named area of interest: Domain controllers, member servers, and user workstations.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain controllers, member servers, and user workstations.'
  range: Last 90 days, centered on the script modification and the subsequent logon/execution with a +/-
    15 minute correlation window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "cmds = FILTER WinEvent BY EID=4688 AND parent IN [wscript.exe,cscript.exe,cmd.exe,powershell.exe]\n\
      ALERT WHERE CommandLine MATCHES regex(\"-enc|-EncodedCommand|-w hidden|-nop|FromBase64String|IEX\"\
      )\n   OR CommandLine MATCHES regex(\"certutil .*-urlcache|bitsadmin .*/transfer|mshta http|regsvr32\
      \ .*/i:http\")\n   OR CommandLine MATCHES vbscript_cmd_obfuscation_patterns"
- question: '[Persistence] Using the ''Entropy/ratio scoring'' approach (Statistical Method), can you
    determine whether a command executed by a logon script contains high-entropy strings, suspicious keywords,
    or invokes a LOLBin with parameters for downloading or executing code during interactive logon?'
  context: 'In the context of Persistence, an adversary who can alter a network logon script gains code
    execution every time the affected users log on, surviving reboots and credential resets and potentially
    fanning out across every host the script applies to. This question pursues the evidence that A command
    executed by a logon script contains high-entropy strings, suspicious keywords, or invokes a LOLBin
    with parameters for downloading or executing code during interactive logon. It applies the Statistical
    Method technique known as ''Entropy/ratio scoring''. Method guidance: Compute Shannon entropy and
    non-alphanumeric ratio per command line; alert above the per-script/per-host 99th percentile (typical
    benign command entropy ~3.0-4.5, encoded blobs >5.0). Combine with letter-frequency cosine distance
    from a benign corpus to reduce false positives ([Lee Holmes](https://www.leeholmes.com/more-detecting-obfuscated-powershell/),
    [Elastic high command-line entropy](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html),
    [Revoke-Obfuscation](https://github.com/danielbohannon/Revoke-Obfuscation)). A positive result (a
    correlation match, an anomaly above threshold, or a high model score) is a high-priority lead: triage
    by reviewing the offending script path, the writer/editor identity, the spawned child-process lineage
    and command line, and the logon session in which it ran. A negative result helps scope and rule out
    logon-script abuse for the host/share in question. Pivot across Windows Event ID 4688, and focus collection
    on the named area of interest: Domain controllers, member servers, and user workstations.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain controllers, member servers, and user workstations.'
  range: Last 90 days for baselining; evaluate new events against the 30-90 day baseline and center correlation
    on the logon/modification event with a +/- 15 minute window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each cmd IN logon_script_children:\n  H = shannon_entropy(cmd); R = nonalnum_ratio(cmd)\n\
      \  D = cosine_distance(letter_freq(cmd), benign_corpus_freq)\nALERT WHERE H > p99(script,host) OR\
      \ (H > 5.0 AND D large)  # benign ~3.0-4.5, encoded >5.0"
- question: '[Persistence] Using the ''Command autoencoder'' approach (Machine Learning), can you determine
