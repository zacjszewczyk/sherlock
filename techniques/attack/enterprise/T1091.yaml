  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical: 90d enterprise prevalence + PE section-entropy on removable-media executables\n\
      baseline = removable_media executions over last 90d\nFOR EACH exec e:\n  host_prevalence     = count_distinct(host\
      \ WHERE sha256 == e.sha256)\n  max_section_entropy = max(entropy(section) for section in PE(e))\n\
      ALERT WHEN host_prevalence < p1(baseline)     // <1st percentile = rare/targeted tooling\n   OR\
      \ max_section_entropy > 7.0               // packing/obfuscation (EMBER static baseline)\n// derive\
      \ the p1 cutoff per environment from the 90d fleet baseline, not a fixed global value"
- question: 'Using a machine-learning model, can you determine whether ''Explainable PE classifier on
    removable-media executions'' reveals Replication Through Removable Media for the Initial Access tactic?
    Specifically: Machine Learning: Apply a pre-trained classifier (LightGBM/XGBoost/Random Forest) to
    feature vectors from each removable-media execution — file/section entropy, PE header imports and
    sections, command-line, parent process, user context — flagging executions with malicious probability
    >0.9 for review. Use the static-feature classifiers validated in [EMBER, Anderson and Roth](https://arxiv.org/abs/1804.04637)
