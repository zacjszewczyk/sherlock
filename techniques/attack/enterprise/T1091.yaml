questions:
- question: 'Using deterministic rule logic, can you determine whether ''Hash USB-origin executions and
    match against threat intel, correlated to device insertion'' reveals Replication Through Removable
    Media for the Initial Access tactic? Specifically: Symbolic Logic: For each process creation event
    (Sysmon Event ID 1 / Windows Event ID 4688) whose image path is on a removable drive, calculate the
    file''s SHA256 hash and query all subscribed threat-intelligence feeds; generate a critical alert
    for any match. Anchor the removable-volume determination on the preceding Plug-and-Play device-insertion
    audit event ([6416(S): A new external device was recognized, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-6416);
    [SigmaHQ win_security_external_device](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_external_device.yml))
    correlated by drive letter and timestamp. Enforce device allowlisting on vendor/product/serial IDs
    and flag execution from any non-allowlisted device per [Enhancing SCADA Security: A Host-Based IDS,
    Sen et al](https://arxiv.org/abs/2402.14599); the USB execution-and-trojanized-binary patterns are
    catalogued in [USB-based attacks, Nissim et al](https://www.sciencedirect.com/science/article/abs/pii/S0167404817301578).'
  context: 'Tactic context (Initial Access / TA0001): Has the adversary gained initial access via replication
    through removable media? Adversaries copy malware to removable media and abuse Autorun/.lnk handling,
    trojanized or deceptively named binaries, and mobile/USB connections to cross trust boundaries - including
    onto air-gapped networks - and to spread between hosts. Evidence under investigation: A process creation
    event is observed where the executable''s path originates from a removable drive volume, the execution
    follows a device-insertion audit event (Event ID 6416 / Kernel-PnP 400/410 / System 1006), and the
    file''s SHA256 hash is present in a known-malware threat intelligence feed. Approach (Hash USB-origin
    executions and match against threat intel, correlated to device insertion): Symbolic Logic: For each
    process creation event (Sysmon Event ID 1 / Windows Event ID 4688) whose image path is on a removable
    drive, calculate the file''s SHA256 hash and query all subscribed threat-intelligence feeds; generate
    a critical alert for any match. Anchor the removable-volume determination on the preceding Plug-and-Play
    device-insertion audit event ([6416(S): A new external device was recognized, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-6416);
    [SigmaHQ win_security_external_device](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_external_device.yml))
    correlated by drive letter and timestamp. Enforce device allowlisting on vendor/product/serial IDs
    and flag execution from any non-allowlisted device per [Enhancing SCADA Security: A Host-Based IDS,
    Sen et al](https://arxiv.org/abs/2402.14599); the USB execution-and-trojanized-binary patterns are
    catalogued in [USB-based attacks, Nissim et al](https://www.sciencedirect.com/science/article/abs/pii/S0167404817301578).
    A positive result means a file/process tied to removable media matches malicious intelligence, structure,
    naming, timing, or behavior consistent with removable-media replication; a negative result means the
    observed media activity fits expected, benign baselines. Investigate the named area of interest (All
    endpoint devices (workstations, laptops), Kiosks and shared-use terminals, Physical entry points to
    sensitive or air-gapped networks, Visitor check-in stations) and pivot from any hit to the device
    VID/PID/serial, the originating/receiving host and user, and downstream execution, persistence, C2,
    or cross-host spread.'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows Event ID 6416
  - WinEventLog:System Event ID 1006
  - 'NAI: All endpoint devices (workstations, laptops), Kiosks and shared-use terminals, Physical entry
    points to sensitive or air-gapped networks, Visitor check-in stations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Symbolic: hash USB-origin executions, match threat intel, anchor on device insertion\n\
      JOIN device_insert d (WinEvent 6416 | Kernel-PnP 400/410 | System 1006)\n  WITH process_create p\
      \ (Sysmon 1 | WinEvent 4688)\n  ON p.drive_letter == d.drive_letter AND p.time BETWEEN d.time AND\
      \ d.time + Xs\nWHERE p.image_path STARTSWITH removable_volume\n  AND ( sha256(p.image) IN threat_intel_feeds\n\
      \        OR device.vid_pid_serial NOT IN device_allowlist )   // allowlist by VID/PID/serial\nTHEN\
      \ alert(severity='critical',\n           enrich=[sha256, device_vid_pid_serial, drive_letter, host,\
      \ user])"
- question: 'Using statistical baselining, can you determine whether ''Prevalence and PE-entropy rarity
    scoring of removable-media executables'' reveals Replication Through Removable Media for the Initial
    Access tactic? Specifically: Statistical Method: Calculate the enterprise-wide prevalence (count of
    unique hosts) for the hash of every executable launched from removable media over the last 90 days
    and flag any hash below the 1st percentile (rare/targeted tooling) for investigation. In parallel,
    compute PE section byte-entropy; a section entropy >7.0 indicates packing/obfuscation per the static
    baselines in [EMBER, Anderson and Roth](https://arxiv.org/abs/1804.04637). Derive the percentile cutoff
    per environment from a 90-day fleet baseline rather than a fixed global value.'
