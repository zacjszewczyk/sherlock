    observed media activity fits expected, benign baselines. Investigate the named area of interest (All
    endpoint devices with enabled USB ports, Systems used for imaging or deploying software, Vendor maintenance
    laptops) and pivot from any hit to the device VID/PID/serial, the originating/receiving host and user,
    and downstream execution, persistence, C2, or cross-host spread.'
