name: 'T1091: Replication Through Removable Media'
id: 80dcfaa5-50ef-4423-adcc-a5fabdd9aa08
description: 'This playbook helps an analyst investigate Replication Through Removable Media (T1091):
  the use of USB drives, mobile devices, and other removable media to gain initial access to (including
  air-gapped/disconnected) systems and to move laterally between hosts. It correlates Plug-and-Play device-insertion
  telemetry (Windows Event ID 6416, Kernel-PnP 400/410, System 1006) with file-creation and process-creation
  events on removable-drive volumes (Sysmon Event ID 11 / 1, Windows Event ID 4688) to surface the full
  removable-media execution chain. Investigative angles include: hashing USB-origin file writes and executions
  against threat intelligence; deterministic detection of autorun.inf, malicious .lnk auto-load (CVE-2010-2568
  / Stuxnet), deceptive names (double extensions, RTLO U+202E, Hidden/System attributes); statistical
  baselining of executable prevalence, PE/file/filename entropy (packing), insertion-to-execution timing,
  and per-host write-rate/fan-out; tracking the USB-origin ProcessGUID to follow-on C2, persistence, or
  system writes; cross-host writer-vs-executor hash correlation and propagation-graph centrality to prove
  replication; and worm-like SMB/RDP fan-out with failed-logon spikes. Detection blends symbolic-logic
  rules, statistical methods (percentiles, entropy, change-point detection, graph centrality), and explainable
  machine learning (LightGBM/XGBoost/Random Forest PE classifiers, Isolation Forest, API-sequence and
  process-tree/graph models) to produce evasion-resistant, analyst-ready alerts across the Initial Access
  and Lateral Movement tactics.'
type: technique
