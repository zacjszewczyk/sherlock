- question: 'Using deterministic rule logic, can you determine whether ''Deterministic autorun.inf, malicious
    .lnk, and deceptive-name rules'' reveals Replication Through Removable Media for the Initial Access
    tactic? Specifically: Symbolic Logic: Alert on any file creation (Sysmon Event ID 11) named ''autorun.inf''
    on a removable drive. For .lnk creations, parse the target path/arguments and alert if the target
    is an executable or script located on the same media — the removable-media `.lnk` auto-load technique
    (CVE-2010-2568) used by Stuxnet, documented in the [W32.Stuxnet Dossier, Falliere et al](https://docs.broadcom.com/doc/security-response-w32-stuxnet-dossier-11-en).
    Add rules for filenames containing the RTLO character (U+202E), common double extensions (''.pdf.exe'',
    ''.doc.scr''), and executables written with Hidden/System attributes — the deceptive-naming patterns
    catalogued in [USB-based attacks, Nissim et al](https://www.sciencedirect.com/science/article/abs/pii/S0167404817301578).'
  context: 'Tactic context (Initial Access / TA0001): Has the adversary gained initial access via replication
    through removable media? Adversaries copy malware to removable media and abuse Autorun/.lnk handling,
    trojanized or deceptively named binaries, and mobile/USB connections to cross trust boundaries - including
    onto air-gapped networks - and to spread between hosts. Evidence under investigation: A file creation
    event (Sysmon Event ID 11) for ''autorun.inf'' or a Link file (.lnk) is observed on a removable drive
    volume; or a process creation event (Sysmon Event ID 1) executes a file with ''Hidden''/''System''
    attributes set, a double extension (e.g., ''document.pdf.exe''), or a right-to-left-override (RTLO,
    U+202E) character in its name. Approach (Deterministic autorun.inf, malicious .lnk, and deceptive-name
    rules): Symbolic Logic: Alert on any file creation (Sysmon Event ID 11) named ''autorun.inf'' on a
    removable drive. For .lnk creations, parse the target path/arguments and alert if the target is an
