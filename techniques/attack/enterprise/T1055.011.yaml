questions:
- question: Did any process call SetWindowLongPtrA/W or SetClassLongPtr against a window or class handle
    owned by a DIFFERENT process using nIndex = GWLP_WNDPROC (-4) to overwrite the window-procedure address,
    and then within roughly one second send a triggering window message (SendNotifyMessage, NtUserMessageCall,
    or PostMessage) to that same hWnd?
  context: 'In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    This is the deterministic detection floor for Extra Window Memory (EWM) injection. EWM injection works
    by writing a 32-bit/64-bit code pointer into a target window''s extra window memory at the GWLP_WNDPROC
    index (-4), which replaces the address of the function that handles that window''s messages; the adversary
    then dispatches a window message to force the hijacked procedure to run their shellcode. Look for
    the full causal chain captured in Microsoft-Windows-Win32k ETW and Sysmon Event ID 10 (ProcessAccess):
    a section create/map, a cross-process SetWindowLongPtr/SetClassLongPtr at index -4, and a message-trigger
    call all bound to the same window/memory object. A positive result is a high-confidence injection
    finding, especially when the caller is not a window manager and the target is a higher-privilege GUI
    process. Suppress benign window management by excluding verified managers dwm.exe, csrss.exe, and
    explorer.exe; a negative result does not clear the host because attackers may stage the chain across
    longer intervals or different handles.'
  answer_sources:
  - etw:Microsoft-Windows-Win32k (SetWindowLong/SetClassLong, NtUserMessageCall, SendNotifyMessage, PostMessage)
  - Sysmon Event ID 10 (ProcessAccess)
  - Sysmon Event ID 25 (Process Tampering)
  - 'NAI: Endpoint devices, Privileged Access Workstations, Critical Application Servers'
  range: Last 90 days; correlate the SetWindowLongPtr and message-trigger events within a ~1s window
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'setcalls = win32k where api in (SetWindowLongPtrA,SetWindowLongPtrW,SetClassLongPtr) AND nIndex
      == -4 (GWLP_WNDPROC) AND target_pid != source_pid

      triggers = win32k where api in (SendNotifyMessage,NtUserMessageCall,PostMessage)

      alert when setcalls JOIN triggers on hWnd within 1s AND source_image NOT IN (dwm.exe,csrss.exe,explorer.exe)

      output source_image, source_pid, target_pid, hWnd, nIndex'
- question: Which executables are issuing SetWindowLongPtr, SetClassLongPtr, or SendNotifyMessage calls
    at a rate more than three standard deviations above their own 30-day historical mean, or for the very
    first time — particularly script and interpreter hosts (powershell.exe, mshta.exe, wscript.exe, rundll32.exe)
    that never legitimately manage GUI windows?
  context: In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    EWM injection requires window-management APIs that most processes — and nearly all script interpreters
    — never call. Baseline per-executable call frequency (calls/hour) for SetWindowLongPtr/SetClassLongPtr/SendNotifyMessage
    from 30 days of Win32k ETW, then alert when a process exceeds its 3-sigma threshold or emits any such
    call for the first time. A scripting or LOLBin host suddenly invoking window-procedure APIs is a strong
    tell that injected code is preparing an EWM callback. Use approximate (Smith-Waterman-style) sequence
    matching so that benign calls interleaved by the attacker do not let the malicious sequence slip below
    threshold. A positive result warrants pivoting to the deterministic EWM callback rule; a negative
    result is expected for normal GUI applications that routinely manage their own windows.
  answer_sources:
  - etw:Microsoft-Windows-Win32k (SetWindowLong/SetClassLong, NtUserMessageCall, SendNotifyMessage, PostMessage)
  - Sysmon Event ID 10 (ProcessAccess)
  - Sysmon Event ID 25 (Process Tampering)
  - 'NAI: Endpoint devices, Privileged Access Workstations, Critical Application Servers'
  range: Last 90 days; baseline derived from 30 days of Win32k ETW
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = stats mean(calls_per_hour) as mu, stddev(calls_per_hour) as sd by image where api
      in (SetWindowLongPtr,SetClassLongPtr,SendNotifyMessage) over 30d

      alert when (calls_per_hour > mu + 3*sd) OR first_seen(image,api)

      prioritize image in (powershell.exe,mshta.exe,wscript.exe,rundll32.exe)

      output image, api, calls_per_hour, mu, sd'
- question: When a window message is dispatched, does the executing window-procedure call-stack frame
    reside in unbacked/private (non-image) memory rather than in a module file on disk — indicating that
    the window procedure now points to injected shellcode instead of legitimate code?
  context: In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    A defining artifact of EWM/shellcode callbacks is that the code executed when the window procedure
    runs lives in private, executable memory that is not backed by any DLL or EXE on disk. Walk the ETW/Sysmon
    call stack at message dispatch and flag any frame whose return address falls in unbacked/private memory
    regions. This catches injection that evades classic thread-start-address checks because the malicious
    code never creates a remote thread — it rides an existing GUI thread via the hijacked window procedure.
    A positive result (an unbacked window-procedure frame) is high-fidelity evidence of in-memory code
    execution under a legitimate process; benign window procedures resolve to on-disk image modules.
  answer_sources:
  - etw:Microsoft-Windows-Win32k (SetWindowLong/SetClassLong, NtUserMessageCall, SendNotifyMessage, PostMessage)
  - Sysmon Event ID 10 (ProcessAccess)
  - Sysmon Event ID 25 (Process Tampering)
  - 'NAI: Endpoint devices, Privileged Access Workstations, Critical Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each window_message_dispatch event with call_stack:\n  wndproc_frame = frame_executing_window_procedure(call_stack)\n\
      \  if wndproc_frame.memory_type in (PRIVATE,MAPPED) AND wndproc_frame.backed_by_image == false:\n\
      \    alert(image, pid, hWnd, wndproc_frame.address)"
- question: Does a learned sequence model score the API chain [CreateFileMapping -> MapViewOfFile -> SetWindowLongPtr
    -> SendNotifyMessage] originating from a script host or document reader as a low-probability (anomalous)
    sequence relative to benign Win32k+memory API behavior?
  context: 'In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    EWM injection has a recognizable primitive chain: allocate/map a shared section, write shellcode,
    set the window-procedure pointer into EWM, then trigger it with a message. Train an HMM/LSTM/Transformer
    on benign Win32k and memory-API sequences and score live sequences; the full malicious chain from
    an unexpected host (script interpreter, document reader) scores as extremely unlikely. Combining ETW
    with parallel memory analysis that requires the complete primitive chain has been shown to reach ~99.93%
    accuracy at ~0.068% FPR. The alert must surface the top-3 contributing features (e.g., the GWLP_WNDPROC
    set, the unbacked-memory frame, the calling image) via SHAP/LIME so an analyst can triage quickly.
    A high anomaly score is a strong injection signal; the model complements, not replaces, the deterministic
    rule.'
  answer_sources:
  - etw:Microsoft-Windows-Win32k (SetWindowLong/SetClassLong, NtUserMessageCall, SendNotifyMessage, PostMessage)
  - Sysmon Event ID 10 (ProcessAccess)
  - Sysmon Event ID 25 (Process Tampering)
  - 'NAI: Endpoint devices, Privileged Access Workstations, Critical Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = train_sequence_model(benign Win32k+memory API sequences)  # HMM/LSTM/Transformer

      score = model.logprob([CreateFileMapping,MapViewOfFile,SetWindowLongPtr,SendNotifyMessage] for image)

      alert when score < threshold AND image in (script_hosts, document_readers)

      explain top3 features via SHAP/LIME'
- question: Did a watchlisted low-privilege process (mshta.exe, wscript.exe, regsvr32.exe, rundll32.exe)
    execute within 60 seconds before a sensitive privileged action on the same host — such as user creation
    (EID 4720) or service installation (EID 4697) emitted by a high-privilege process (services.exe, lsass.exe,
    wininit.exe) — with no logged parent-child relationship between them?
  context: In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    When code is injected into a privileged GUI/system process, that process suddenly performs privileged
    actions it normally never initiates, and crucially there is no parent-child link to the low-privilege
    launcher that staged the injection. Correlate watchlisted low-privilege launchers against subsequent
    EID 4720/4697 events from high-privilege processes within a 60s window on the same host where no direct
    lineage exists. A positive result is consistent with EWM injection leading to out-of-character privileged
    behavior. The temporal proximity plus the missing lineage is what distinguishes this from ordinary
    administrative activity, where the privileged action traces back through a legitimate parent chain.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4672
  - Windows Event ID 4720
  - Windows Event ID 4697
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days; correlate precursor and privileged action within 60s
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'precursor = proc_create(EID 4688/Sysmon 1) where image in (mshta.exe,wscript.exe,regsvr32.exe,rundll32.exe)

      sensitive = (EID 4720 user_create OR EID 4697 service_install) where actor_image in (services.exe,lsass.exe,wininit.exe)

      alert when sensitive within 60s after precursor on same host AND no_parent_child_link(precursor,
      sensitive)'
- question: For each high-privilege process, does the set of non-parent processes active in the preceding
    5-minute window contain a precursor that appears in fewer than 1% of that process's historical sequences
    — and is that rare precursor accompanied by a spike in failed privileged actions (failed 4720/4697
    or Access Denied)?
  context: 'In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    Even without a parent-child link, injected privileged behavior leaves a statistical footprint: an
    unusual process becomes active just before a privileged process performs a sensitive action. Baseline,
    per high-privilege process, the distribution of non-parent processes seen in the preceding 5 minutes,
    and flag sequences where the precursor is in the bottom 1%. Explicitly track failure state — a burst
    of failed user creations or service installs (Access Denied) alongside the rare precursor strengthens
    the signal, because injected code often probes before succeeding. A positive result is a behavioral
    anomaly worth correlating against the EWM API evidence; a negative result reflects normal, frequently-seen
    precursor processes.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4672
  - Windows Event ID 4720
  - Windows Event ID 4697
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days; 5-minute preceding window per privileged action
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = freq(precursor_image | privileged_proc) over 30d using 5-min preceding windows

      alert when seen(precursor_image) has historical_freq < 1%

      boost score when failed_4720 OR failed_4697 OR access_denied spikes in same window

      output privileged_proc, precursor_image, freq, failed_count'
- question: Does a sequence model (LSTM/HMM) trained on benign host event streams (process, user, and
    service creations) assign a low probability to chains such as [mshta_activity -> services_creates_user],
    indicating an anomalous precursor-to-privileged-action sequence?
  context: In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    Privileged actions stemming from injected code form improbable event sequences across the host's process/user/service
    streams. Train an LSTM/HMM on benign sequences and score live chains; low-probability chains like
    a script host immediately preceding a privileged user creation alert. Augment with provenance-graph
    models (e.g., KAIROS) that add causal context and reconstruct the precursor-to-privileged-action subgraph,
    giving the analyst the full lineage for triage. A high anomaly score points to out-of-character privileged
    behavior consistent with EWM injection into a system process; benign administrative sequences score
    as expected.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4672
  - Windows Event ID 4720
  - Windows Event ID 4697
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = train_sequence_model(benign host event streams: proc/user/service creations)

      score = model.logprob(observed_chain)

      alert when score < threshold  # e.g., [mshta_activity -> services_creates_user]

      augment with provenance_graph.reconstruct(precursor -> privileged_action)'
- question: Did a non-administrative GUI parent (winword.exe, acrord32.exe, excel.exe) launch a command
    interpreter (cmd.exe/powershell.exe), followed within 5 minutes by a service install (EID 4697) or
    scheduled task (EID 4698) whose binary path points to a non-standard directory such as C:\Users\Public\
    or C:\Windows\Temp\?
  context: In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    GUI document applications spawning shells is a classic exploitation/injection lineage, and when that
    shell is quickly followed by a service or task install pointing at a suspicious directory, it suggests
    injected code establishing execution or persistence under cover of a trusted process. Correlate the
    GUI->interpreter spawn with subsequent EID 4697/4698 events within 5 minutes and inspect the binary/command
    path for non-standard locations. A positive result is a high-fidelity chain worth immediate triage;
    legitimate office workflows rarely spawn interpreters that then install services from world-writable
    directories.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4698
  - Windows Event ID 4702
  - Windows Event ID 4697
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Enterprise Workstations, Application Servers'
  range: Last 90 days; correlate the spawn and the install within 5 minutes
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'spawn = proc_create where parent_image in (winword.exe,acrord32.exe,excel.exe) AND child_image
      in (cmd.exe,powershell.exe)

      install = (EID 4697 service_install OR EID 4698 task_create) where binary_path matches (C:\\Users\\Public\\*,
      C:\\Windows\\Temp\\*)

      alert when install within 5m after spawn on same host'
- question: Do any newly created scheduled tasks (EID 4698) have command-line arguments whose Shannon
    entropy and length exceed the 95th percentile of the host's historical task distribution, especially
    shortly after a non-admin process spawned a shell?
  context: In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    Injected/automated payloads often register scheduled tasks with obfuscated or encoded command lines
    that exhibit abnormally high entropy and length compared to the routine, human-authored tasks on a
    host. Compute Shannon entropy and length for each new task's arguments and flag values above the 95th
    percentile derived from 30 days of local task history, prioritizing tasks created soon after a non-admin
    process spawned a shell. A positive result flags likely encoded/obfuscated payload delivery; normal
    administrative tasks have low-entropy, readable command lines.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4698
  - Windows Event ID 4702
  - Windows Event ID 4697
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Enterprise Workstations, Application Servers'
  range: Last 90 days; percentile baseline from 30 days of local task history
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for task in EID 4698:\n  e = shannon_entropy(task.args); L = len(task.args)\n  baseline =\
      \ percentile(host_task_args_entropy_len, 95) over 30d\n  alert when e > baseline.entropy OR L >\
      \ baseline.length\n  boost when preceded by nonadmin_spawned_shell"
- question: Does a Random Forest classifier, trained on features from process creation and the subsequent
    task/service creation (parent/child image, user context, time delta, command-line length/entropy/special-character
    ratio), label the observed sequence as malicious?
  context: In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    Malicious injection-to-persistence chains differ from benign ones across many weak features that a
    tree ensemble can combine. Train a Random Forest on labeled process-creation + task/service-creation
    sequences using parent/child image, user context, time delta, and command-line length/entropy/special-char
    ratio, then classify live sequences and surface the top-3 SHAP features in the alert. Injection-related
    APIs and obfuscated command lines typically dominate feature importance. A malicious classification
    with interpretable feature attribution gives the analyst a defensible, actionable lead; the model
    complements the deterministic lineage rule above.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4698
  - Windows Event ID 4702
  - Windows Event ID 4697
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Enterprise Workstations, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [parent_image, child_image, user_context, time_delta, cmd_len, cmd_entropy, special_char_ratio]

      model = RandomForest.train(labeled process+task/service sequences)

      alert when model.predict(features) == malicious

      explain top3 SHAP features in alert'
- question: Was a process that is not on the allowlist of debuggers/security tools (procexp.exe, windbg.exe)
    granted SeDebugPrivilege (EID 4672) and then observed opening a handle to lsass.exe (EID 4656/4663
    or Sysmon EID 10 with TargetImage lsass.exe)?
  context: In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    A benign-looking host such as notepad.exe or calc.exe being assigned SeDebugPrivilege and then touching
    LSASS memory is a strong sign that injected code is abusing privileges to harvest credentials. GUI
    utilities should essentially never open lsass. Trigger when a non-allowlisted process receives SeDebugPrivilege
    via EID 4672 and subsequently opens an lsass handle. A positive result is a high-severity credential-access/privilege-abuse
    lead; legitimate debuggers and security tools that need this access are excluded via the allowlist.
  answer_sources:
  - Windows Event ID 4672
  - Windows Event ID 4688
  - Windows Event ID 4656
  - Windows Event ID 4663
  - Sysmon Event ID 10
  - 'NAI: Domain Controllers (for LSASS access), Privileged Access Workstations, Tier 0 Servers'
  range: Last 90 days; correlate the privilege grant and the lsass handle open
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'sedebug = EID 4672 where SeDebugPrivilege granted AND image NOT IN (procexp.exe,windbg.exe,
      allowlisted_tools)

      lsass = (EID 4656/4663 OR Sysmon 10) where target_image == lsass.exe AND source_image == sedebug.image

      alert when lsass after sedebug on same host'
- question: For each process image, does any granted privilege (EID 4672) appear in fewer than 0.1% of
    that executable's historical privilege-assignment instances — and is there a corresponding burst of
    failed lsass handle opens (Access Denied in EID 4656/4663)?
  context: 'In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    Per-executable privilege baselines expose injected code that suddenly wields privileges its host process
    never normally receives. Baseline assigned privileges per image and alert when a privilege appears
    in under 0.1% of that image''s history. Track failure state explicitly: a burst of failed lsass handle
    opens is itself a distinct signal of injected code probing for credential access before it succeeds.
    A positive result is a rare-privilege anomaly worth correlating with the LSASS-access rule; common,
    expected privileges for an image score as normal.'
  answer_sources:
  - Windows Event ID 4672
