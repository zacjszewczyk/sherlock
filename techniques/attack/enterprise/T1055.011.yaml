name: 'T1055.011: Process Injection: Extra Window Memory Injection'
id: 02467b6e-23f6-49c2-b289-a817af7dd28a
description: Investigate adversary use of Extra Window Memory (EWM) injection (T1055.011), a stealthy
  process-injection technique in which malicious code writes a pointer into a GUI window's extra window
  memory at the GWLP_WNDPROC index via SetWindowLongPtr/SetClassLongPtr and then triggers execution by
  dispatching a window message (SendNotifyMessage/PostMessage/NtUserMessageCall), running shellcode under
  a legitimate, often higher-privilege process while avoiding heavily monitored APIs like WriteProcessMemory
  and CreateRemoteThread. This playbook helps an analyst hunt that behavior across endpoint and network
  telemetry to answer whether the adversary leveraged EWM injection for stealth and privilege escalation.
  It correlates the cross-process window-procedure-hijack API chain in Microsoft-Windows-Win32k ETW and
  Sysmon (Event IDs 10 and 25); detects unbacked/private-memory window-procedure callbacks; baselines
  rare window-management API usage by script hosts; spots injected privileged behavior such as out-of-character
  user/service creation (EID 4720/4697), SeDebugPrivilege abuse and LSASS access (EID 4672/4656/4663),
  GUI applications spawning interpreters with high-entropy command lines, and anomalous scheduled tasks
  (EID 4698); and surfaces injected command-and-control and exfiltration through system-process and trusted-app
  network egress (Zeek conn/dns/http/ssl logs, EID 5156), JA3/JA4 fingerprint drift, beacon regularity,
  and crash-correlated volume spikes (EID 1000). It combines deterministic symbolic-logic floors, statistical
  baselining, and machine-learning anomaly detection to make EWM injection defensible and actionable for
  a SOC.
type: technique
