- question: Did a high-privilege system process (services.exe, wininit.exe, svchost.exe) initiate an external
    network connection (Zeek conn.log / EID 5156) — in particular svchost.exe whose parent is not services.exe,
    or a system process with a zero-length command line making a connection — correlated with recent suspicious
    host activity?
  context: In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    System processes are predictable; injected code riding them breaks that predictability by reaching
    out to the network. Deterministically flag svchost.exe not parented by services.exe and system processes
    with zero-length command lines that initiate connections — both strong injection/hollowing tells —
    and correlate with recent suspicious activity such as a user launching a document reader. A positive
    result is a high-confidence injection lead against a Tier-0/system process; legitimately networked
    system services with correct lineage and command lines are expected.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - 'NAI: Network Egress Points, DNS Servers, Endpoint devices, Internal Network Segments'
  range: Last 90 days; correlate egress with preceding suspicious host activity (e.g., 5 minutes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'egress = (Zeek conn.log OR EID 5156) where image in (services.exe,wininit.exe,svchost.exe)
      AND resp_h is external

      alert when (image==svchost.exe AND parent_image != services.exe) OR (command_line length == 0)

      correlate with recent suspicious host activity

      output image, parent_image, resp_h, resp_p'
- question: Do any critical system processes connect to destination ports outside their 99th-percentile
    historical set, transfer byte volumes (orig_bytes) outside their normal profile, or spawn never-before-seen
    children (e.g., svchost.exe -> powershell.exe) — accompanied by bursts of blocked/failed connections
    (EID 5157)?
  context: In the Stealth context, EWM injection lets the adversary execute under a trusted, allow-listed
    process so their activity blends in with benign behavior; this method helps surface that concealment.
    Profile each critical system process's destination ports, outbound byte volume, and child processes,
    then alert on connections to rare ports, abnormal volumes, or unprecedented children. Track state
    by watching for blocked/failed connection bursts (EID 5157) from a normally quiet process, which is
    a distinct anomaly. A positive result indicates a system process behaving outside its established
    network/spawn profile, consistent with injected code; expected destinations and children for that
    service score as normal.
