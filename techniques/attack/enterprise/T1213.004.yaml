- question: >-
    Focus: Large egress/record threshold. Using a symbolic logic approach, can you determine whether the
    volume of CRM data retrieved or transferred during a session (records read, report rows, or bytes
    egressed) is a statistical outlier versus the user's or peer group's historical behavior? Investigate
    this as a potential indicator that an adversary is mining the CRM for sensitive customer data.
