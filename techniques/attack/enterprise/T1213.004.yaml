    or client characteristic of programmatic access (curl, python-requests, Go-http-client) or an automation
    API type used by an account that normally logs in via browser. Method (Machine Learning): Machine
    Learning: Cluster CRM request feature vectors (user-agent, method, endpoint/URI, header count, byte
    volume) with DBSCAN and flag small/noise clusters as programmatic harvesting, per [A Density-Based
    Algorithm for Discovering Clusters (DBSCAN), Ester et al](https://cdn.aaai.org/KDD/1996/KDD96-037.pdf);
    report the cluster's defining features in the alert. A positive result indicates likely unauthorized
    CRM data collection warranting escalation and review of the implicated account, source, and exported
    data; a negative result helps rule out this collection vector for the period examined.
  answer_sources:
  - Salesforce Event Monitoring (RestApi, BulkApi, URI)
  - Zeek http.log
  - >-
    NAI: SaaS CRM API/event logs (Salesforce RestApi/BulkApi/URI events); WAF, reverse-proxy, and web-server
    logs for on-prem CRM front-ends.
  range: Last 30 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      features = [user_agent, method, uri, header_count, byte_volume]

      clusters = DBSCAN(features)

      ALERT small/noise clusters as programmatic harvesting; report cluster features
- question: >-
    Focus: Bulk export command/event detection. Using a symbolic logic approach, can you determine whether
    a bulk data-export operation is performed against the CRM: a single Salesforce ReportExport/BulkApi
    event with an abnormally large record count, mass record retrieval via API, or on-prem CRM/DB host
    commands dumping the database to file? Investigate this as a potential indicator that an adversary
    is mining the CRM for sensitive customer data.
  context: >-
    This question supports the Collection (TA0009) objective of detecting adversary mining of CRM customer
    data. Evidence: A bulk data-export operation is performed against the CRM: a single Salesforce ReportExport/BulkApi
    event with an abnormally large record count, mass record retrieval via API, or on-prem CRM/DB host
    commands dumping the database to file. Method (Symbolic Logic): Symbolic Logic: Alert on Salesforce
    ReportExport/BulkApi events whose ROW_COUNT/NUMBER_OF_RECORDS exceeds a tenant ceiling (start >10,000
    records or >5x the report's normal page size) or are issued by a non-integration user; on hybrid on-prem
    hosts detect sqlcmd/bcp/mysqldump or Invoke-Sqlcmd/Export-Csv with SELECT *, > *.csv, or -OutFile.
    Field semantics per [Salesforce Shield Event Monitoring](https://help.salesforce.com/s/articleView?id=platform.salesforce_shield.htm&type=5);
    export-rule patterns per [Panther Built-in Detection Rules](https://github.com/panther-labs/panther-analysis).
    A positive result indicates likely unauthorized CRM data collection warranting escalation and review
    of the implicated account, source, and exported data; a negative result helps rule out this collection
    vector for the period examined.
  answer_sources:
  - Salesforce Event Monitoring (ReportExport, BulkApi)
  - Windows Event ID 4688
  - Windows Event ID 4104
  - >-
    NAI: SaaS CRM export/report/bulk-API event logs; on-prem CRM application and database servers.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      ALERT Salesforce ReportExport/BulkApi where ROW_COUNT > 10000
        OR ROW_COUNT > 5x normal_page_size OR user.role != integration
      on-prem: 4688/4104 match {sqlcmd, bcp, mysqldump, Invoke-Sqlcmd, Export-Csv}
        with 'SELECT *', '> *.csv', or -OutFile
- question: >-
    Focus: Export volume/frequency baseline. Using a statistical method approach, can you determine whether
    a bulk data-export operation is performed against the CRM: a single Salesforce ReportExport/BulkApi
    event with an abnormally large record count, mass record retrieval via API, or on-prem CRM/DB host
    commands dumping the database to file? Investigate this as a potential indicator that an adversary
    is mining the CRM for sensitive customer data.
  context: >-
    This question supports the Collection (TA0009) objective of detecting adversary mining of CRM customer
    data. Evidence: A bulk data-export operation is performed against the CRM: a single Salesforce ReportExport/BulkApi
    event with an abnormally large record count, mass record retrieval via API, or on-prem CRM/DB host
    commands dumping the database to file. Method (Statistical Method): Statistical Method: Baseline per-user
    exported-record count and export frequency; flag days exceeding the user's rolling mean + 4σ AND the
    99th percentile of their role peer group, the per-user/peer breadth-baselining approach surveyed in
    [Insight into Insiders and IT, Homoliak et al](https://arxiv.org/abs/1805.01612) (tune on [CERT Insider
    Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/)). A positive result
    indicates likely unauthorized CRM data collection warranting escalation and review of the implicated
    account, source, and exported data; a negative result helps rule out this collection vector for the
    period examined.
  answer_sources:
  - Salesforce Event Monitoring (ReportExport, BulkApi)
  - Windows Event ID 4688
  - Windows Event ID 4104
  - >-
    NAI: SaaS CRM export/report/bulk-API event logs; on-prem CRM application and database servers.
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = per_user exported_record_count & export_freq

      ALERT if day > (mean + 4*sigma) AND > 99th_percentile(role_peer_group)
- question: >-
    Focus: Export-sequence anomaly. Using a machine learning approach, can you determine whether a bulk
    data-export operation is performed against the CRM: a single Salesforce ReportExport/BulkApi event
    with an abnormally large record count, mass record retrieval via API, or on-prem CRM/DB host commands
    dumping the database to file? Investigate this as a potential indicator that an adversary is mining
    the CRM for sensitive customer data.
  context: >-
    This question supports the Collection (TA0009) objective of detecting adversary mining of CRM customer
    data. Evidence: A bulk data-export operation is performed against the CRM: a single Salesforce ReportExport/BulkApi
    event with an abnormally large record count, mass record retrieval via API, or on-prem CRM/DB host
    commands dumping the database to file. Method (Machine Learning): Machine Learning: Model CRM audit-event
    sequences (login -> report -> bulk export) and exported record-count parameters with an LSTM and flag
    low-probability execution paths/parameter values per [DeepLog, Du et al](https://doi.org/10.1145/3133956.3134015)
    ([impl](https://github.com/Thijsvanede/DeepLog)); complement with a TF-IDF command-line classifier
    on Event ID 4688 for on-prem dumps, surfacing the deviating step in the alert. A positive result indicates
    likely unauthorized CRM data collection warranting escalation and review of the implicated account,
    source, and exported data; a negative result helps rule out this collection vector for the period
    examined.
  answer_sources:
  - Salesforce Event Monitoring (ReportExport, BulkApi)
  - Windows Event ID 4688
  - Windows Event ID 4104
  - >-
    NAI: SaaS CRM export/report/bulk-API event logs; on-prem CRM application and database servers.
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      seq = CRM audit events [login -> report -> bulk_export] + record_count params

      model = LSTM (DeepLog)

      ALERT low-probability path/param; + TF-IDF classifier on 4688 cmdlines; surface deviating step
- question: >-
    Focus: Impossible travel alert. Using a symbolic logic approach, can you determine whether a user
    account authenticates to a CRM application with session characteristics statistically anomalous for
    that user: unfamiliar geographic origin, unusual time-of-day, new device, or an impossible-travel
    event between consecutive logins? Investigate this as a potential indicator that an adversary is mining
    the CRM for sensitive customer data.
  context: >-
    This question supports the Collection (TA0009) objective of detecting adversary mining of CRM customer
    data. Evidence: A user account authenticates to a CRM application with session characteristics statistically
    anomalous for that user: unfamiliar geographic origin, unusual time-of-day, new device, or an impossible-travel
    event between consecutive logins. Method (Symbolic Logic): Symbolic Logic: Correlate consecutive CRM
    login geolocations and timestamps (Salesforce Login CLIENT_IP, M365 sign-in) and alert when the implied
    velocity exceeds feasible travel, the deterministic geo/time logic of [Impossible Travel Detection,
    Microsoft (WO2018085161A1)](https://patents.google.com/patent/WO2018085161A1/en). A positive result
    indicates likely unauthorized CRM data collection warranting escalation and review of the implicated
    account, source, and exported data; a negative result helps rule out this collection vector for the
    period examined.
  answer_sources:
  - Salesforce Event Monitoring (Login)
  - m365:signinlogs
  - Windows Event ID 4624
  - Zeek conn.log
  - >-
    NAI: Cloud identity providers and SaaS CRM login logs; Domain Controllers, VPN concentrators, and
    on-prem CRM hosts for local logins.
  range: Last 7 days; correlate events within a 10-minute window per account/IP
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      FOR consecutive logins(user): velocity = geo_dist / time_delta

      ALERT if velocity > max_feasible_travel_speed
- question: >-
    Focus: Login risk scoring. Using a statistical method approach, can you determine whether a user account
    authenticates to a CRM application with session characteristics statistically anomalous for that user:
    unfamiliar geographic origin, unusual time-of-day, new device, or an impossible-travel event between
    consecutive logins? Investigate this as a potential indicator that an adversary is mining the CRM
    for sensitive customer data.
  context: >-
    This question supports the Collection (TA0009) objective of detecting adversary mining of CRM customer
    data. Evidence: A user account authenticates to a CRM application with session characteristics statistically
    anomalous for that user: unfamiliar geographic origin, unusual time-of-day, new device, or an impossible-travel
    event between consecutive logins. Method (Statistical Method): Statistical Method: Assign risk points
    for deviations (off-hours, rare country/ASN, new device, first-seen access) and alert when cumulative
    score exceeds the user's 98th percentile, using the per-entity baseline + peer-group + first-seen
    scoring of [Advanced threat detection with UEBA in Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    treat the first-ever CRM access by an account as a Bayesian rare edge per [On Bayesian new edge prediction,
    Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf).
    A positive result indicates likely unauthorized CRM data collection warranting escalation and review
    of the implicated account, source, and exported data; a negative result helps rule out this collection
    vector for the period examined.
  answer_sources:
  - Salesforce Event Monitoring (Login)
  - m365:signinlogs
  - Windows Event ID 4624
  - Zeek conn.log
  - >-
    NAI: Cloud identity providers and SaaS CRM login logs; Domain Controllers, VPN concentrators, and
    on-prem CRM hosts for local logins.
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      score = sum(points for off_hours, rare_country/asn, new_device, first_seen_access)

      ALERT if score > user_98th_percentile

      treat first-ever CRM access as Bayesian rare edge
