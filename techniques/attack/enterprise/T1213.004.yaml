    token set) as in [Anomaly Detection of Web-based Attacks, Kruegel and Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).
    A positive result indicates likely unauthorized CRM data collection warranting escalation and review
    of the implicated account, source, and exported data; a negative result helps rule out this collection
    vector for the period examined.
  answer_sources:
  - Salesforce Event Monitoring (RestApi, BulkApi, URI)
  - Zeek http.log
  - >-
    NAI: SaaS CRM API/event logs (Salesforce RestApi/BulkApi/URI events); WAF, reverse-proxy, and web-server
    logs for on-prem CRM front-ends.
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      freq = count(user_agent, endpoint) over 24h / total

      ALERT if freq < 0.1% AND not in allowlist

      + profile request param length/char-distribution/token-set
- question: >-
    Focus: HTTP/API request clustering. Using a machine learning approach, can you determine whether an
    HTTP/API request to a CRM web interface or REST/Bulk API presents a User-Agent or client characteristic
    of programmatic access (curl, python-requests, Go-http-client) or an automation API type used by an
    account that normally logs in via browser? Investigate this as a potential indicator that an adversary
