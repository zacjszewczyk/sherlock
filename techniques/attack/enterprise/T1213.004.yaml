name: 'T1213.004: Customer Relationship Management Software'
id: 12614955-08c0-4465-8bda-d56fbceeb6a4
description: >-
  Investigate whether an adversary is mining a Customer Relationship Management (CRM) platform (e.g. Salesforce,
  Microsoft Dynamics 365, Zoho, Zendesk, HubSpot), hosted in SaaS or on-premises, to collect sensitive
  customer data such as PII, purchase histories, and support interactions. This playbook helps an analyst
  hunt for connections and logins to CRM applications from malicious or rare source infrastructure, programmatic/non-browser
  API access, bulk data-export operations, statistically anomalous session and login behavior (impossible
  travel, off-hours, new device), abnormal data-retrieval/egress volumes, misuse of non-interactive service/integration
  accounts, and failed-then-successful authentication bursts that precede data mining. Each question pairs
  symbolic-logic, statistical, and machine-learning approaches across SaaS CRM event logs, cloud identity
  sign-in logs, and network/endpoint telemetry to surface adversary collection activity against CRM data.
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: >-
    Focus: Threat feed CRM connection monitoring. Using a symbolic logic approach, can you determine whether
    a successful authentication or network connection to a CRM application (SaaS or on-prem) originates
    from a source IP on a threat-intelligence feed of known malicious C2, proxies, anonymizers (TOR),
    or bulletproof/VPS providers, or from an ASN never before seen for that tenant? Investigate this as
    a potential indicator that an adversary is mining the CRM for sensitive customer data.
  context: >-
    This question supports the Collection (TA0009) objective of detecting adversary mining of CRM customer
    data. Evidence: A successful authentication or network connection to a CRM application (SaaS or on-prem)
    originates from a source IP on a threat-intelligence feed of known malicious C2, proxies, anonymizers
    (TOR), or bulletproof/VPS providers, or from an ASN never before seen for that tenant. Method (Symbolic
    Logic): Symbolic Logic: Join CRM login CLIENT_IP (Salesforce Event Monitoring Login events) and Zeek
    conn.log CRM sessions against high-confidence malicious/TOR/anonymizer IP feeds and alert on any match;
    this signature/feed approach is a primary exfiltration countermeasure per [Data exfiltration: A review
    of external attack vectors and countermeasures, Ullah et al](https://www.sciencedirect.com/science/article/pii/S1084804518301626).
    Reuse the SaaS login deny-list patterns in [Panther Built-in Detection Rules](https://github.com/panther-labs/panther-analysis).
    A positive result indicates likely unauthorized CRM data collection warranting escalation and review
    of the implicated account, source, and exported data; a negative result helps rule out this collection
    vector for the period examined.
  answer_sources:
  - Salesforce Event Monitoring (Login)
  - m365:signinlogs
  - Zeek conn.log
  - >-
    NAI: Cloud identity providers and SaaS CRM login logs (Salesforce ELF Login, Entra/M365 sign-in);
    network sensors at internet gateways, VPN termination, and on-prem CRM server segments.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      logins = CRM_login_events(CLIENT_IP) UNION zeek_conn(crm_dst, src_ip)

      JOIN ti_feed ON ip IN {malicious, TOR, anonymizer, bulletproof_VPS}

      OR asn NOT IN known_tenant_asns

      ALERT match
- question: >-
    Focus: Rare ASN detection. Using a statistical method approach, can you determine whether a successful
    authentication or network connection to a CRM application (SaaS or on-prem) originates from a source
    IP on a threat-intelligence feed of known malicious C2, proxies, anonymizers (TOR), or bulletproof/VPS
    providers, or from an ASN never before seen for that tenant? Investigate this as a potential indicator
    that an adversary is mining the CRM for sensitive customer data.
  context: >-
    This question supports the Collection (TA0009) objective of detecting adversary mining of CRM customer
    data. Evidence: A successful authentication or network connection to a CRM application (SaaS or on-prem)
    originates from a source IP on a threat-intelligence feed of known malicious C2, proxies, anonymizers
    (TOR), or bulletproof/VPS providers, or from an ASN never before seen for that tenant. Method (Statistical
    Method): Statistical Method: Baseline CRM-source ASNs/countries per user over 30 days and flag logins
    from ASNs below the 5th-percentile prevalence or never previously seen for the tenant, scoring rarity
    as a first-seen anomaly as in [Advanced threat detection with UEBA in Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).
    A positive result indicates likely unauthorized CRM data collection warranting escalation and review
    of the implicated account, source, and exported data; a negative result helps rule out this collection
    vector for the period examined.
  answer_sources:
  - Salesforce Event Monitoring (Login)
  - m365:signinlogs
  - Zeek conn.log
  - >-
    NAI: Cloud identity providers and SaaS CRM login logs (Salesforce ELF Login, Entra/M365 sign-in);
    network sensors at internet gateways, VPN termination, and on-prem CRM server segments.
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = per_user CRM source ASN/country over last 30d

      FOR new login: rarity = prevalence(asn,user)

      ALERT if asn first_seen OR prevalence < 5th_percentile
- question: >-
    Focus: CRM connection/login classifier. Using a machine learning approach, can you determine whether
    a successful authentication or network connection to a CRM application (SaaS or on-prem) originates
    from a source IP on a threat-intelligence feed of known malicious C2, proxies, anonymizers (TOR),
    or bulletproof/VPS providers, or from an ASN never before seen for that tenant? Investigate this as
    a potential indicator that an adversary is mining the CRM for sensitive customer data.
  context: >-
    This question supports the Collection (TA0009) objective of detecting adversary mining of CRM customer
    data. Evidence: A successful authentication or network connection to a CRM application (SaaS or on-prem)
    originates from a source IP on a threat-intelligence feed of known malicious C2, proxies, anonymizers
    (TOR), or bulletproof/VPS providers, or from an ASN never before seen for that tenant. Method (Machine
    Learning): Machine Learning: Score login/connection feature vectors (duration, resp_bytes, geolocation,
    ASN, reputation, cyclic time-of-day) with per-user Isolation Forest and alert on short-path-length
    outliers, surfacing the top-3 contributing features in the alert per [Isolation Forest, Liu Ting and
    Zhou](https://doi.org/10.1145/2133360.2133363). A positive result indicates likely unauthorized CRM
    data collection warranting escalation and review of the implicated account, source, and exported data;
    a negative result helps rule out this collection vector for the period examined.
  answer_sources:
  - Salesforce Event Monitoring (Login)
  - m365:signinlogs
  - Zeek conn.log
  - >-
    NAI: Cloud identity providers and SaaS CRM login logs (Salesforce ELF Login, Entra/M365 sign-in);
    network sensors at internet gateways, VPN termination, and on-prem CRM server segments.
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      features = [duration, resp_bytes, geo, asn, reputation, sin/cos(hour)]

      model = IsolationForest per user

      ALERT if path_length outlier; emit top-3 contributing features
- question: >-
    Focus: Non-browser User-Agent detection. Using a symbolic logic approach, can you determine whether
    an HTTP/API request to a CRM web interface or REST/Bulk API presents a User-Agent or client characteristic
    of programmatic access (curl, python-requests, Go-http-client) or an automation API type used by an
    account that normally logs in via browser? Investigate this as a potential indicator that an adversary
    is mining the CRM for sensitive customer data.
  context: >-
    This question supports the Collection (TA0009) objective of detecting adversary mining of CRM customer
    data. Evidence: An HTTP/API request to a CRM web interface or REST/Bulk API presents a User-Agent
    or client characteristic of programmatic access (curl, python-requests, Go-http-client) or an automation
    API type used by an account that normally logs in via browser. Method (Symbolic Logic): Symbolic Logic:
    Match CRM USER_AGENT/http.log user_agent against a deny-list (curl, Wget, python-requests, Go-http-client,
    sqlmap) and alert; also flag API_TYPE=Bulk/REST for users with no integration role, mirroring the
    Salesforce-aware rules in [Panther Built-in Detection Rules](https://github.com/panther-labs/panther-analysis)
    and the first-party event schema in [Salesforce Shield Event Monitoring](https://help.salesforce.com/s/articleView?id=platform.salesforce_shield.htm&type=5).
    A positive result indicates likely unauthorized CRM data collection warranting escalation and review
    of the implicated account, source, and exported data; a negative result helps rule out this collection
    vector for the period examined.
  answer_sources:
  - Salesforce Event Monitoring (RestApi, BulkApi, URI)
  - Zeek http.log
  - >-
    NAI: SaaS CRM API/event logs (Salesforce RestApi/BulkApi/URI events); WAF, reverse-proxy, and web-server
    logs for on-prem CRM front-ends.
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      denylist = [curl, Wget, python-requests, Go-http-client, sqlmap]

      ALERT if CRM USER_AGENT / http.user_agent IN denylist

      OR API_TYPE IN {Bulk, REST} AND user.role != integration
