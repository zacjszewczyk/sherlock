questions:
- question: Did an AutoIT or AutoHotKey interpreter or compiled script execute (identified by PE OriginalFileName
    rather than on-disk name) with a SHA256 matching known-malicious threat intelligence, and did that
    process or its children call out to known command-and-control infrastructure within roughly ten minutes?
  context: 'This question targets the loader-then-callback chain central to AutoIT/AutoHotKey abuse in
    the Execution tactic, mirroring DarkGate''s AutoIt3 loader staging and C2. Identify automation interpreters
    by PE OriginalFileName (AutoIt*.exe, AutoHotkey.exe, InternalAHK.exe) so that renaming the binary
    to evade name-based rules does not hide it; alert when OriginalFileName indicates AutoIt/AutoHotkey
    but process.name differs. Match the interpreter or compiled-script SHA256 against hash threat-intel
    feeds, then correlate matched processes within a 10-minute window to outbound network connections
    (Sysmon Event ID 3, Zeek conn.log/dns.log) reaching known C2 domains/IPs. A positive result (hash
    match plus near-term C2 callback) is high-confidence malicious execution and should be escalated;
    a negative result still warrants review if the interpreter is renamed or running from an unusual context.
    Include matched hash, OriginalFileName, parent, and destination in the alert. Sources: [Renamed Automation
    Script Interpreter, Elastic](https://github.com/elastic/detection-rules/blob/main/rules/windows/defense_evasion_masquerading_renamed_autoit.toml),
    [Enter The Gates: DarkGate AutoIt Loader, Splunk](https://www.splunk.com/en_us/blog/security/enter-the-gates-an-analysis-of-the-darkgate-autoit-loader.html).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Hash intelligence feeds (e.g., OSINT, commercial TI)
  - 'NAI: Enterprise workstations, Application Servers, Domain Controllers, Network Egress/Internet Gateway,
    DNS infrastructure'
  range: Last 90 days (correlate process and network within a 10-minute window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  PROC = process_creation(EventCode IN [4688, Sysmon 1])\n  | where pe.OriginalFileName IN\
      \ ['AutoIt3.exe','AutoIt3_x64.exe','AutoHotkey.exe','InternalAHK.exe']\n  | eval renamed = (lower(process.name)\
      \ != lower(pe.OriginalFileName))\n  | join sha256 [ lookup ti_hash_feed sha256 OUTPUT verdict ]\
      \ where verdict='malicious'\n  NET = network(EventCode IN [Sysmon 3] OR zeek.conn/zeek.dns)\n  |\
      \ join host, process_guid PROC where NET.time between PROC.time and PROC.time+10m\n  | join NET.dest_ip/dest_host\
      \ [ lookup ti_c2_feed indicator ]\n  | alert severity=high msg=concat('AutoIt/AHK malicious-hash\
      \ + C2: ', sha256, ' OFN=', pe.OriginalFileName, ' parent=', parent.name, ' dst=', NET.dest)"
  - technology: Zeek/pseudocode
    query: "  files.log: select sha256 where seen with conn to host H\n  | lookup ti_hash_feed sha256\
      \ -> malicious\n  | join conn.log/dns.log on H within 600s of file/proc event\n  | where dest in\
      \ ti_c2_feed -> emit high_severity"
- question: Do the outbound connections from AutoIT/AutoHotKey interpreters deviate from the host's 60-day
    baseline in volume, frequency, or connection-state failure rate enough to indicate command-and-control
    traffic?
  context: 'Within the Execution tactic, an AutoIT/AutoHotKey loader frequently establishes automated
    C2 once it runs. Build a 60-day per-host baseline of outbound connections from these interpreters
    capturing Volume (orig_bytes, resp_bytes, byte ratio), Frequency (connections/min to each destination),
    and State (TCP success vs RST/timeout, DNS NOERROR vs NXDOMAIN). Use robust median-absolute-deviation
    thresholds (flag modified z-score |M| > 3.5) to derive site-specific cutoffs so batch or noisy hosts
    do not inflate the threshold. Alert when a destination/port-protocol pair from an AutoIt process is
    in the bottom 2nd percentile of prevalence, when the NXDOMAIN/failed-connection rate exceeds the host''s
    99th percentile (C2 fallback domains / DGA), or when ASN/domain reputation is high-risk. A spike in
    failed lookups or rare destinations from an automation interpreter is a strong C2 signal; report the
    three largest deviating metrics for triage. Sources: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Hash intelligence feeds (e.g., OSINT, commercial TI)
  - 'NAI: Enterprise workstations, Application Servers, Domain Controllers, Network Egress/Internet Gateway,
    DNS infrastructure'
  range: Last 90 days (baseline over trailing 60 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  base = network from AutoIt/AHK procs over 60d\n  | stats per host,dest,port_proto: vol=sum(bytes),\
      \ freq=count/min, fail=avg(state in [RST,timeout,NXDOMAIN])\n  | eval median, mad ; modz = 0.6745*(x-median)/mad\n\
      \  | flag where abs(modz) > 3.5 OR prevalence_pct(dest) < 2 OR fail_rate > p99(host) OR asn_reputation='high-risk'\n\
      \  | alert top3_deviating_metrics"
- question: Does a gradient-boosted ensemble model, trained on joined process-creation and network features,
    score an AutoIT/AutoHotKey execution-plus-callback chain as malicious with probability above 0.85?
  context: 'This applies supervised machine learning to the Execution-then-C2 chain that AutoIT/AutoHotKey
    loaders exhibit. Train a gradient-boosted ensemble on labeled process-creation (Sysmon Event ID 1)
    events joined to network events (Zeek conn.log), using static PE features from the EMBER schema (section
    entropy, imports, version-info, AU3!/AHK! markers) plus command-line token features, parent-child
    rarity, destination reputation (ASN, domain age, TLD), and JA3/JA3S TLS fingerprints. Alert when P(malicious)
    > 0.85 and surface the top-3 SHAP feature contributions (e.g., ''unsigned high-entropy PE'', ''rare
    ASN'', ''renamed interpreter'') so the analyst can validate. The model fuses many weak signals into
    one decision; explainability via SHAP keeps the verdict defensible and gives the analyst concrete
    leads to confirm or dismiss. Sources: [EMBER](https://arxiv.org/abs/1804.04637), [JA3, Salesforce](https://github.com/salesforce/ja3).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Hash intelligence feeds (e.g., OSINT, commercial TI)
  - 'NAI: Enterprise workstations, Application Servers, Domain Controllers, Network Egress/Internet Gateway,
    DNS infrastructure'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  X = join(proc_create[Sysmon 1], zeek.conn) by host,process_guid\n  features = EMBER(pe)\
      \ + cmdline_tokens + parent_child_rarity + dest_reputation(asn,domain_age,tld) + ja3/ja3s\n  model\
      \ = GradientBoostedTrees.predict_proba(X)\n  if P(malicious) > 0.85: alert(top3=shap_values(X))"
- question: Did an AutoIT/AutoHotKey interpreter or its .au3/.ahk script execute from a non-standard,
    user-writable or temporary path (e.g., %TEMP%, %APPDATA%, %LOCALAPPDATA%, \Users\Public\, Downloads)
    outside approved installation directories, or was it spawned by a document handler, browser, archiver,
    or LOLBin?
  context: 'Within the Execution tactic, legitimate AutoIT/AutoHotKey runs from installed locations; delivery
    via phishing, downloads, or lateral movement instead drops the interpreter and script into user-writable
    folders. Resolve the interpreter via PE OriginalFileName to defeat renaming, then alert when: (1)
    the interpreter or its script resides outside approved install dirs and instead in %TEMP%, %APPDATA%,
    %LOCALAPPDATA%, \Users\Public\, or Downloads; (2) the .au3/.ahk script and interpreter were dropped
    to the same user-writable folder shortly before execution (the DarkGate staging pattern); or (3) the
    parent is a document handler, browser, archiver, or LOLBin. Log the full execution chain. A match
    strongly suggests delivered/staged malware rather than sanctioned automation; absence of a match where
    automation is expected from a standard path is benign. Sources: [Elastic Renamed Automation Script
    Interpreter](https://github.com/elastic/detection-rules/blob/main/rules/windows/defense_evasion_masquerading_renamed_autoit.toml),
    [Splunk STRT](https://www.splunk.com/en_us/blog/security/enter-the-gates-an-analysis-of-the-darkgate-autoit-loader.html),
    [LOLBAS](https://lolbas-project.github.io/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - File system auditing logs
  - 'NAI: Enterprise workstations, User profile directories on servers, Shared network drives, Downloads
    folders, Temporary directories'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  P = process_creation(EventCode IN [4688, Sysmon 1])\n  | where pe.OriginalFileName IN ['AutoIt3.exe','AutoIt3_x64.exe','AutoHotkey.exe','InternalAHK.exe']\n\
      \  | eval script = extract_script_arg(command_line)  // .au3/.ahk\n  | where path_in(image_path,\
      \ [TEMP,APPDATA,LOCALAPPDATA,'C:\\Users\\Public',Downloads])\n        OR path_in(script, [TEMP,APPDATA,LOCALAPPDATA,'C:\\\
      Users\\Public',Downloads])\n        OR parent.name IN [winword,excel,outlook,*browser*,7z,winrar,\
      \ lolbas_list]\n  | alert severity=high chain=parent->image->script"
- question: Is the observed (interpreter, script, user, hour) execution tuple statistically rare or entirely
    new against the host's 90-day baseline, and was the script created and executed within seconds (a
    short write-then-execute latency)?
  context: 'This statistical method profiles where and when AutoIT/AutoHotKey execution normally occurs
    under the Execution tactic. Build a per-asset 90-day baseline of all (interpreter, script, user, hour)
    tuples and their Frequency (executions/day). Score new executions by prevalence and alert when a tuple
    is in the bottom 0.5th percentile or entirely new for a high-risk account, using robust MAD thresholds
    so batch/admin spikes do not inflate the cutoff. Additionally track the State signal of write-then-execute
    latency: a script created (Sysmon Event ID 11) and executed within seconds is materially more suspicious
    than a long-resident script, because malware typically drops and immediately runs. A rare tuple plus
    near-zero write-to-execute latency is a strong indicator of freshly delivered malicious automation.
    Sources: [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - File system auditing logs
  - 'NAI: Enterprise workstations, User profile directories on servers, Shared network drives, Downloads
    folders, Temporary directories'
  range: Last 90 days (baseline over trailing 90 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  base = executions of AutoIt/AHK over 90d grouped by (interpreter,script,user,hour)\n  |\
      \ stats freq=count by tuple ; prevalence_pct=tuple_count/total\n  | new_or_rare = prevalence_pct\
      \ < 0.5 OR tuple unseen\n  | join file_create[Sysmon 11] on script -> latency = exec_time - create_time\n\
      \  | alert where (new_or_rare AND user in high_risk) OR latency < 10s"
- question: Does an Isolation Forest trained on AutoIT/AutoHotKey execution context flag this event above
    the 95th-percentile anomaly score, and which features (e.g., temp-dir script, Office-app parent, high
    command-line entropy) drive the score?
  context: 'Unsupervised anomaly detection complements rule-based path checks in the Execution tactic
    by learning the normal multivariate execution context. Train an Isolation Forest on Sysmon Event ID
    1 features for AutoIt/AutoHotkey executions: interpreter path depth/keywords, script path location/depth,
    parent process (including LOLBAS), user privilege, hour, file hash, signature status, and command-line
    entropy/length. Flag events above the 95th-percentile anomaly score and list the top-3 contributing
    features (e.g., ''temp-dir script'', ''office-app parent'', ''high command-line entropy'') in the
    alert. Because Isolation Forest isolates outliers efficiently in high dimensions, it surfaces novel
    combinations that no single rule covers; analysts validate by reviewing the contributing features
    against known-good automation. Sources: [Isolation Forest, Liu, Ting and Zhou](https://doi.org/10.1109/ICDM.2008.17).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - File system auditing logs
  - 'NAI: Enterprise workstations, User profile directories on servers, Shared network drives, Downloads
    folders, Temporary directories'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  X = features(Sysmon 1 AutoIt/AHK): [interp_path_depth, interp_keywords, script_loc, script_depth,\
      \ parent(lolbas?), user_priv, hour, sha256, sig_status, cmdline_entropy, cmdline_len]\n  iforest\
      \ = IsolationForest(contamination=auto).fit(history)\n  score = iforest.decision_function(X)\n \
      \ if percentile(score) > 95: alert(top3=feature_contributions(X))"
- question: At file write and before execution, does a PE contain compiled-AutoIT/AutoHotKey markers —
    section names '.AU3!.'/'.AHK!.' or resource entries 'AU3!.AU3!'/'AHK!.AHK!' — and does a content-type
    classifier confirm it is an executable rather than what its extension claims?
  context: 'Compiled AutoIT/AutoHotKey scripts retain distinctive PE markers, enabling detection of packaged
    payloads under the Execution tactic before they run. At file write (Sysmon Event ID 11) and before
    execution, scan the PE with YARA/custom Sigma rules for compiled-AutoIt/AutoHotkey markers: section
    names ''.AU3!.''/''.AHK!.'' and resource entries ''AU3!.AU3!''/''AHK!.AHK!''. Confirm the true file
    type from the bytes with a content-type classifier such as Magika to catch interpreters/scripts masquerading
    by extension. For any flagged file, correlate its SHA256 to process-creation events and raise a critical
    alert on execution; include the matched marker and content-type verdict. A positive marker match is
    a high-fidelity signal of a compiled automation payload, distinguishing malicious droppers from ordinary
    executables. Sources: [SigmaHQ](https://github.com/SigmaHQ/sigma), [Magika](https://arxiv.org/abs/2409.13768).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek pe.log
  - Zeek files.log
  - Endpoint file hashing and PE analysis
  - 'NAI: Network Egress/Internet Gateway (for PE file capture), Enterprise workstations, Download directories,
    email gateways'
  range: Last 90 days
  queries:
  - technology: YARA/Sigma pseudocode
    query: "  on file_create(Sysmon 11) OR zeek.files/pe.log:\n    yara: $s1='.AU3!.' $s2='.AHK!.' $r1='AU3!.AU3!'\
      \ $r2='AHK!.AHK!'\n    condition: is_pe and (any of ($s*) or any of ($r*))\n  | content_type = magika(bytes);\
      \ flag if magika='PE' but extension != exe\n  | join sha256 -> process_creation\n  | alert severity=critical\
      \ on execution include(marker, magika_verdict)"
- question: Did an unsigned (or revoked-signature) binary with file/section Shannon entropy above ~7.0
    and AU3!/AHK! metadata execute, indicating a packed or encrypted compiled AutoIT/AutoHotKey dropper?
  context: 'Packed/encrypted payloads exhibit elevated entropy, and compiled AHK/AU3 droppers are typically
    unsigned with sparse import tables — measurable statistics for the Execution tactic. For all executed
    binaries compute section/file Shannon entropy and verify Authenticode status. Legitimate native code
    is roughly 5.0-6.5 entropy while packed/encrypted payloads exceed ~7.2; alert (State = unsigned/revoked)
    when an unsigned binary with entropy > 7.0 and AU3!/AHK! metadata executes, deriving the exact entropy
    cutoff from the site''s benign signed-binary distribution. High entropy plus missing/invalid signature
    plus AutoIt markers is a strong combined indicator; a high-entropy but validly signed installer is
    more likely benign. Report the entropy and signature verdict for triage. Sources: [Using Entropy Analysis
    to Find Encrypted and Packed Malware, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek pe.log
  - Zeek files.log
  - Endpoint file hashing and PE analysis
  - 'NAI: Network Egress/Internet Gateway (for PE file capture), Enterprise workstations, Download directories,
    email gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  B = executed_binaries\n  | eval entropy = shannon(file/section_bytes), sig = authenticode_status\n\
      \  | eval cutoff = p99(benign_signed_entropy)  // ~7.0-7.2\n  | flag where sig IN ['unsigned','revoked']\
      \ AND entropy > max(7.0, cutoff) AND has_marker(['AU3!','AHK!'])\n  | alert state=unsigned_high_entropy\
      \ include(entropy, sig, import_count)"
- question: Does a Random Forest / LightGBM model trained on the EMBER static feature schema classify
    a PE as a compiled-malicious AutoIT/AutoHotKey script with probability above 0.80 at write or execute
    time?
  context: 'Supervised PE classification generalizes beyond fixed markers and entropy thresholds for the
    Execution tactic. Train a Random Forest/LightGBM on labeled PEs (benign vs compiled AutoIt/AutoHotkey)
    using the EMBER static feature schema: section-name patterns (one-hot), AU3!/AHK! resource presence,
    byte/entropy histograms, import count, file size, signature status, and version/language strings.
    Score files at write/execute time; alert when P(compiled-malicious-script) > 0.80 and report the top-3
    feature importances (e.g., ''no signature'', ''section entropy 7.4'', ''import count = 9''). The model
    captures subtle joint patterns a single rule misses; the reported feature importances let the analyst
    confirm whether the verdict reflects genuine compiled-script characteristics. Sources: [EMBER](https://arxiv.org/abs/1804.04637).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek pe.log
  - Zeek files.log
  - Endpoint file hashing and PE analysis
  - 'NAI: Network Egress/Internet Gateway (for PE file capture), Enterprise workstations, Download directories,
    email gateways'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  X = EMBER_features(PE): [section_name_onehot, au3_ahk_resource, byte_hist, entropy_hist,\
      \ import_count, file_size, sig_status, version_lang_strings]\n  model = RandomForest/LightGBM.predict_proba(X)\n\
      \  on file_write or execute:\n    if P(compiled_malicious) > 0.80: alert(top3=feature_importances(X))"
- question: Did an AutoIT/AutoHotKey interpreter spawn a LOLBAS child process (cmd, powershell, certutil,
    regsvcs, csc, msbuild, rundll32, mshta, wmic) with suspicious command-line substrings (-enc, IEX,
    DownloadString, Invoke-WebRequest, /urlcache, /node:, net use, reg add) or open a system process via
    process access?
  context: 'Under the Execution tactic, an AutoIT/AutoHotKey loader commonly chains into LOLBins for download,
    code execution, or lateral movement, and may inject into system processes. From Sysmon Event ID 1
    identify AutoIt/AutoHotkey parents (by PE OriginalFileName) and inspect each child against the LOLBAS
    catalog (cmd, powershell, certutil, regsvcs, csc, msbuild, rundll32, mshta, wmic) and suspicious substrings
    (-enc, -encoded, IEX, DownloadString, Invoke-WebRequest, certutil, /urlcache, /node:, net use, reg
    add). Alert high on first occurrence and critical when combined with privilege escalation or Sysmon
    Event ID 10 process access from the interpreter to system processes. Use AMIDES to catch semantically-equivalent
    obfuscated/abbreviated commands that evade literal keyword lists, and report the evaded rule. A LOLBin
    child with download/exec keywords spawned by an automation interpreter is a strong execution-abuse
    signal. Sources: [LOLBAS](https://lolbas-project.github.io/), [AMIDES, Uetz et al.](https://www.usenix.org/system/files/usenixsecurity24-uetz.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - Process memory analysis
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers, Sensitive hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  parents = process_creation[Sysmon 1] where pe.OriginalFileName IN AutoIt/AHK\n  children\
      \ = process_creation where parent.guid in parents\n  | where child.name in LOLBAS[cmd,powershell,certutil,regsvcs,csc,msbuild,rundll32,mshta,wmic]\n\
      \        OR child.command_line matches ['-enc','-encoded','IEX','DownloadString','Invoke-WebRequest','/urlcache','/node:','net\
      \ use','reg add']\n  | enrich amides_semantic_score(child.command_line)\n  | join Sysmon 10 (process_access\
      \ interp -> system_proc)\n  | alert severity = critical if (priv_esc OR proc_access) else high"
- question: Does a child process of an AutoIT/AutoHotKey parent have command-line entropy or child-spawn
    frequency exceeding the 99th percentile of its 60-day baseline, or a burst of failed/blocked child
    executions?
  context: 'Obfuscated or encoded commands raise command-line entropy, and rapid child spawning departs
    from normal automation under the Execution tactic. For each child of an AutoIt/AutoHotkey parent compute
    Shannon entropy and length of the command-line arguments (excluding the image path) and the child-spawn
    Frequency (children/min). Baseline per process-type over 60 days; alert when entropy exceeds the 99th
    percentile (e.g., cmd.exe children typically <3.5; AutoIt children >4.5 flagged) or when the child-spawn
    rate is anomalous. Track State by profiling failed/blocked child executions and access-denied results
    as a distinct burst signal, using robust MAD cutoffs. High-entropy command lines suggest base64/obfuscation;
    spawn bursts and access-denied clusters suggest scripted exploitation or failed privilege escalation.
    Sources: [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - Process memory analysis
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers, Sensitive hosts'
  range: Last 90 days (baseline over trailing 60 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  C = children_of(AutoIt/AHK)\n  | eval cl_entropy = shannon(command_line minus image_path),\
      \ cl_len = len(...)\n  | stats spawn_rate = count/min by parent_guid\n  | baseline per child.name\
      \ over 60d; modz via MAD\n  | flag where cl_entropy > p99(child.name) OR spawn_rate anomalous OR\
      \ burst(failed/access_denied children)\n  | alert include(top metrics)"
- question: Does a log-sequence anomaly model (e.g., DeepLog LSTM next-event prediction) or command-line
    classifier flag the observed (parent -> child1 -> child2 ... + command tokens) chain as outside expected
    behavior?
  context: 'Adversarial execution chains under the Execution tactic form sequences that deviate from learned-normal
    process lineage. Model (parent, child1, child2, ... + command tokens) sequences from Sysmon Event
    ID 1 with a log-sequence anomaly detector such as DeepLog (LSTM next-event prediction) or a command-line
    classifier such as LOLAL. Flag chains whose observed child falls outside the top-g predicted events
    or scores malicious; surface the deviating step and the top-3 influential tokens in the alert for
    analyst review. Sequence models capture order and context that point-in-time rules miss — for example
    an AutoIt parent that unexpectedly spawns powershell which then spawns certutil. A flagged deviating
    step gives the analyst a precise pivot for confirmation. Sources: [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015),
    [LOLAL, Ongun et al.](https://arxiv.org/abs/2111.15039).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - Process memory analysis
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers, Sensitive hosts'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  seq = ordered_process_events[Sysmon 1] keyed by root AutoIt/AHK process\n  tokens = [parent,\
      \ child1, child2, ... , cmd_tokens]\n  deeplog = LSTM.next_event_prob(seq)\n  if observed_child\
      \ not in top_g(predicted) OR lolal_classifier(cmd)=='malicious':\n     alert(deviating_step, top3_tokens)"
- question: Do the destination IP/hostname pairs from AutoIT/AutoHotKey network connections match threat
    intelligence for known C2, botnet, or phishing/malware infrastructure, and can the connection be bound
    to the interpreter's parent, user, and TLS JA3/JA3S fingerprint?
  context: 'This binds AutoIT loader execution to its C2 under the Execution tactic, as seen in DarkGate.
    Extract AutoIt/AutoHotkey process identifiers from Sysmon Event ID 3 and cross-reference destination
    IP/hostname pairs against threat intelligence (known C2, botnet IPs, phishing/malware C2 domains,
