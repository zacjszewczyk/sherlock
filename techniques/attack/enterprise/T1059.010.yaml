name: 'T1059.010: AutoHotKey & AutoIT'
id: 51e4d903-8d54-4654-b2c3-fd50052a0e00
description: Investigate adversary use of AutoHotKey (.ahk) and AutoIT (.au3) automation scripts and their
  compiled executable payloads to run malicious code on Windows hosts. This playbook helps an analyst
  hunt for execution of AutoHotkey.exe/AutoIt3.exe interpreters (including renamed interpreters identified
  by PE OriginalFileName), compiled scripts bearing AU3!/AHK! PE section and resource markers, scripts
  staged to user-writable or temporary directories, suspicious parent/child process chains spawning LOLBins,
  and the loader-then-callback pattern seen in malware such as DarkGate. It correlates endpoint process-creation
  and file-creation telemetry (Windows Event ID 4688, Sysmon Event IDs 1, 3, 10, 11, 22) with network
  telemetry (Zeek conn/dns/http/files/pe logs, Sysmon network events) and threat intelligence to surface
  malicious automation, command execution, payload delivery, privilege escalation, process injection,
  and command-and-control beaconing. Each question pairs symbolic-logic, statistical, and machine-learning
  methods so an analyst can confirm or refute AutoIT/AutoHotKey abuse with defensible evidence.
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
