name: 'T1600.002: Weaken Encryption: Disable Crypto Hardware'
id: c4741752-18f3-4d4c-a321-5c8a5b0f23b1
description: Investigate whether an adversary has disabled or downgraded a network device's dedicated
  hardware cryptographic acceleration (e.g., crypto engines, AES-NI) to force the device into weaker software-based
  encryption that is easier to collect, manipulate, and exfiltrate. This playbook helps an analyst hunt
  for unauthorized administrative access to routers, switches, firewalls, and VPN concentrators; CLI/config
  commands that disable or downgrade crypto hardware (e.g., 'no crypto engine', 'crypto engine software');
  anomalous administrative logins (geolocation, time-of-day, source host outliers); statistically significant
  drops in the proportion of encrypted traffic or device throughput at network chokepoints; and deviations
  of firmware/OS image, secure-boot state, or running-configuration crypto settings from a known-good
  (golden) baseline (the Modify System Image path). It combines symbolic-logic rules, statistical baselining/change-point
  detection, and machine-learning outlier models across network logs (Zeek conn/ssl/ipsec), authentication
  logs (Windows 4624/4688, TACACS+/RADIUS), and network-device config/CLI sources to determine whether
  crypto hardware is being weakened as part of defense impairment.
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are there administrative connections (SSH/22 or Telnet/23) to network devices that originate
    from a source IP not on the authorized management allow-list, or from an IP present on a current threat-intelligence
    feed?
  context: 'This identifies the initial unauthorized access an adversary needs before they can disable
    crypto hardware. Join Zeek conn.log records where the responder port is 22 (SSH) or 23 (Telnet) and
    the responder host is a known network-device IP against an allow-list of authorized management source
    IPs/subnets and a threat-intel IP feed. Any management connection from outside the allow-list, or
    from a flagged IP, is a high-severity lead. Restrict management access to authorized accounts/subnets
    and pre-approved maintenance windows (NIST SP 800-82r3) and corroborate against external syslog/TACACS+
    accounting (Cisco IOS Software Integrity Assurance). As a failure-mode signal, separately count failed/aborted
    auth attempts (Zeek conn_state S0/REJ, repeated Windows 4625) per source; a burst of failures preceding
    a success is a brute-force/credential-stuffing precursor. In the Defense Impairment context, unauthorized
    management access is the gateway to disabling crypto hardware, so a positive result warrants immediate
    device integrity checks. References: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [Cisco IOS Software Integrity Assurance](https://sec.cloudapps.cisco.com/security/center/resources/integrity_assurance.html).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network device management interfaces, management subnets, jump boxes, log aggregation platforms
    (SIEM), internet gateways'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "conn.log where id.resp_p in (22,23) and id.resp_h in network_device_ips\n  | lookup mgmt_allowlist\
      \ on id.orig_h, threatintel_feed on id.orig_h\n  | where id.orig_h not in mgmt_allowlist OR id.orig_h\
      \ in threatintel_feed\n  | alert severity=high"
  - technology: SIEM/Rule pseudocode
    query: "index=auth EventID=4625 dest in network_devices\n  | stats count as fails by src, dest within\
      \ 10m\n  | where fails >= 5 then look for subsequent EventID=4624 same src/dest\n  | alert 'failed-burst-then-success'"
- question: For administrative connections to network devices, is a new connection originating from a
    source ASN or country that is historically rare (below the 5th percentile), or has the per-source
    connection rate suddenly changed?
  context: 'An adversary operating from infrastructure that differs from normal administrators will show
    up as a rare or first-seen ASN/country. Build a 30-day baseline of source ASN and country-of-origin
    frequency for all admin connections to network devices, and alert when a connection comes from an
    ASN or country below the 5th percentile of historical frequency. Treat a sudden change in per-source
    connection rate (connections/hour) as a change-point using CUSUM/PELT, and track the failed-vs-successful
    login ratio as a distinct state metric. A positive result (rare-geo plus rate change) strongly suggests
    adversary access preceding crypto-hardware tampering; a negative result helps rule out external operator
    anomalies. This supports Defense Impairment hunting by surfacing the unusual access path before the
    destructive config change. References: [Change-Point Detection survey, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network device management interfaces, management subnets, jump boxes, log aggregation platforms
    (SIEM), internet gateways'
  range: Last 90 days (30-day baseline + change-point window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "conn to network_devices over 30d\n  | enrich src_asn, src_country\n  | compute freq percentile\
      \ per asn/country\n  | alert if new_conn.asn_pctile < 5 or new_conn.country_pctile < 5\n  | CUSUM/PELT\
      \ on connections_per_hour per src -> alert on change-point"
- question: Does an unsupervised outlier model flag any administrative connection to a network device
    as anomalous based on source subnet, ASN, byte volume, session duration, time-of-day, and failed-attempt
    count?
  context: 'Single-feature rules miss multivariate anomalies; an Isolation Forest trained on historical
    legitimate admin connections (features: source subnet, ASN, bytes in/out, session duration, time-of-day,
    day-of-week, failed-attempt count) scores new connections in near-real-time and flags outliers that
    combine several mildly-unusual properties. Every alert must surface the top-3 contributing features
    (e.g., ''new ASN'', ''off-hours'', ''failed-attempt burst'') in the alert text rather than only the
    anomaly score, so analysts can triage quickly. A flagged connection is a candidate adversary session
    preceding crypto-hardware disablement; correlate it with subsequent CLI/config and traffic-downgrade
    evidence. In the Defense Impairment context this catches stealthy access that evades static allow-lists.
    References: [Isolation Forest, Liu et al](https://doi.org/10.1145/2133360.2133363); [Explainable AI
    in IDS review, Frontiers 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network device management interfaces, management subnets, jump boxes, log aggregation platforms
    (SIEM), internet gateways'
  range: Last 90 days (rolling retrain)
  queries:
  - technology: ML/pseudocode
    query: "features = [src_subnet, src_asn, bytes_in, bytes_out, duration, hour, dow, failed_count]\n\
      \  model = IsolationForest.fit(legit_admin_conns_history)\n  score = model.decision_function(new_conn)\n\
      \  if score < threshold: alert(top3_features=explain(new_conn))"
- question: Do any network-device CLI audit logs, syslog, or IOS core-dump command history contain commands
    that disable or downgrade hardware crypto, such as 'no crypto engine', 'crypto engine software', or
    'hw-module ... disable'?
  context: 'This is the direct action of the technique. Apply a regular expression to all network-device
    CLI audit and syslog (and IOS core-dump command history) for patterns like /(no\s+crypto\s+engine|crypto\s+engine\s+software|no\s+crypto\s+engine\s+(slot|accelerator)|hw-module\s+\S+\s+disable)/i.
    Trigger a high-severity alert on any match AND on the configuration-commit/write event that persists
    it - confirm the change was saved, not merely typed. Disabling hardware crypto forces weaker software
    ciphers (exploitability documented by DROWN); pair this with cipher-policy enforcement (NIST SP 800-52r2).
    A positive match with a persisted write is near-confirmation of T1600.002 and should trigger image/config
    integrity verification and traffic-downgrade analysis. This is the highest-fidelity Defense Impairment
    signal in the playbook. References: [Cisco IOS Software Integrity Assurance](https://sec.cloudapps.cisco.com/security/center/resources/integrity_assurance.html);
    [DROWN, Aviram et al](https://drownattack.com/drown-attack-paper.pdf); [NIST SP 800-52r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-52r2.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Network devices (routers, switches, firewalls), centralized syslog servers, TACACS+/RADIUS servers,
    management servers/jump boxes'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=netdevice (cli OR syslog OR coredump_cmdhist)\n  | regex cmd=/(no\\s+crypto\\s+engine|crypto\\\
      s+engine\\s+software|no\\s+crypto\\s+engine\\s+(slot|accelerator)|hw-module\\s+\\S+\\s+disable)/i\n\
      \  | alert severity=high\n  | correlate with config_commit/write_mem event same device/session (State:\
      \ persisted=true)"
- question: For each administrative user/session on a network device, does command frequency or command-string
    entropy deviate sharply from that user's baseline, and are there bursts of failed/rejected (authorization-denied)
    commands?
  context: 'Adversaries often behave differently from routine operators: scripted bulk changes raise command
    rate, while unfamiliar or obfuscated commands raise string entropy. Per administrative user/session,
    compute (a) command frequency (commands/min) and (b) Shannon entropy of command strings against a
    per-user 30-day baseline. Alert when entropy exceeds the user''s mean by more than 2 standard deviations,
    OR when command rate shows a change-point (CUSUM/PELT). Separately track failed/rejected command counts
    (authorization denials) as a failure-mode signal indicating privilege probing. A spike in entropy
    plus authorization denials suggests an actor exploring how to disable crypto hardware. This statistical
    layer complements the keyword regex by catching novel command forms tied to Defense Impairment. References:
    [Change-Point Detection survey, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Network devices (routers, switches, firewalls), centralized syslog servers, TACACS+/RADIUS servers,
    management servers/jump boxes'
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per user/session over 30d baseline:\n    cmd_rate = count(cmd)/min\n    entropy = shannon(cmd_string)\n\
      \  alert if entropy > mean_user + 2*sd_user\n  alert if CUSUM/PELT change-point in cmd_rate\n  track\
      \ denied_cmd_count as separate failure signal"
- question: Does an embedding-based or sequence-based model flag any network-device CLI command as a rare,
    out-of-sequence crypto/engine/image-modification command that keyword lists would miss?
  context: 'Brittle keyword lists miss obfuscated or vendor-variant commands. Encode CLI command lines
    with BERT-style embeddings and score them with an unsupervised outlier detector (Isolation Forest/COPOD/PCA)
    to catch rare crypto/engine/image-modification commands. In parallel, model normal per-device command
    sequences with DeepLog; a crypto-disable command appears as an out-of-sequence, low-probability log
    key. Surface the top-3 driving tokens/features per alert so analysts understand why a command was
    flagged. A flagged out-of-sequence crypto command is a strong lead even if it doesn''t match the regex,
    directly supporting the Defense Impairment information requirement by detecting novel disablement
    commands. References: [BERT Command Line Anomaly Detection, CrowdStrike](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/);
    [DeepLog, Du et al](https://doi.org/10.1145/3133956.3134015); [Explainable AI in IDS review, Frontiers
    2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Network devices (routers, switches, firewalls), centralized syslog servers, TACACS+/RADIUS servers,
    management servers/jump boxes'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "emb = BERT_encode(cli_command_lines)\n  outlier = IsolationForest/COPOD/PCA.fit(history).score(emb)\n\
      \  seq_model = DeepLog.fit(per_device_cmd_sequences)\n  if outlier flagged OR seq_model.logkey_prob(cmd)\
      \ < eps:\n     alert(top3_tokens=explain(cmd))"
- question: Did any successful administrative login to a network device occur from a source IP outside
    the account's expected geofence (expected countries) or outside its established business-hours time
    window?
  context: 'Per-account geofencing catches account misuse from unexpected locations or times. For each
    account define an explicit geofence of expected source countries and a business-hours window, then
    alert if a successful login (Windows 4624 / TACACS+ accounting) to a network device occurs from a
    source IP outside the geofence OR outside the time window. Enforce TACACS+ command authorization and
    centralized logging (Cisco IOS Software Integrity Assurance) and restrict management to authorized
    subnets (NIST SP 800-82r3). A login outside the geofence/time window on a privileged network-device
    account is a high-confidence access anomaly that precedes crypto-hardware tampering; correlate with
    subsequent CLI/config evidence. This anchors the Defense Impairment hunt to identity-level anomalies.
    References: [Cisco IOS Software Integrity Assurance](https://sec.cloudapps.cisco.com/security/center/resources/integrity_assurance.html);
    [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication servers (Active Directory, RADIUS, TACACS+), management servers/jump boxes, network
    gateway (for geolocation)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=auth (EventID=4624 OR tacacs_accounting) dest in network_devices\n  | enrich src_country\
      \ = geoip(src)\n  | where src_country not in account.geofence OR hour not in account.bizhours\n\
      \  | alert severity=high"
- question: Does the cumulative per-session risk score for an administrative login to a network device
    exceed the tuned alert threshold when combining new source country, off-hours timing, unusual session
    duration, and preceding failed-logon bursts?
  context: 'A single weak signal may be benign, but several together indicate compromise. Build a per-session
    cumulative risk score: +2 for a new source country, +1 if login time is >2 SD from the user''s mean
    hour, +1 if session duration is >3 SD from the user''s mean, and +2 if preceded by a burst of failed
    logons (failure-mode state signal). Alert when the total exceeds a tuned threshold (e.g., 3). Derive
    thresholds per-dataset from the user''s own 30-day distribution. A high cumulative score on a network-device
    admin session is a prioritized lead that an adversary is positioning to disable crypto hardware; the
    additive scheme also gives analysts a transparent rationale. This statistical fusion supports the
    Defense Impairment PIR.'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication servers (Active Directory, RADIUS, TACACS+), management servers/jump boxes, network
    gateway (for geolocation)'
  range: Last 90 days (30-day per-user baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "score = 0\n  if new_source_country: score += 2\n  if abs(login_hour - user_mean_hour) > 2*user_sd_hour:\
      \ score += 1\n  if session_dur > user_mean_dur + 3*user_sd_dur: score += 1\n  if preceded_by_failed_logon_burst:\
      \ score += 2\n  if score > 3: alert(reasons)"
- question: Does a clustering or outlier model (K-Means distance-to-centroid plus Isolation Forest) flag
    any network-device admin login as far from normal behavior across hour-of-day, day-of-week, source
    ASN, byte volume, session duration, and failed-attempt count?
  context: 'Multivariate models catch logins that are individually plausible but jointly anomalous. Score
    logins with both K-Means distance-to-centroid and an Isolation Forest over features (hour-of-day,
    day-of-week, source ASN, byte volume, session duration, failed-attempt count); logins far from any
    centroid or flagged as outliers are alerted. Include the top-3 contributing features in each alert
    for explainability. A login that both models flag is a strong candidate for adversary access preceding
    crypto-hardware disablement; correlate it with CLI/config and traffic-downgrade evidence to confirm.
    This ML layer rounds out the identity-anomaly detection for the Defense Impairment information requirement.
    References: [Isolation Forest, Liu et al](https://doi.org/10.1145/2133360.2133363); [Explainable AI
    in IDS review, Frontiers 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication servers (Active Directory, RADIUS, TACACS+), management servers/jump boxes, network
    gateway (for geolocation)'
  range: Last 90 days (rolling retrain)
  queries:
  - technology: ML/pseudocode
    query: "features = [hour, dow, src_asn, byte_volume, session_dur, failed_count]\n  km = KMeans.fit(login_history);\
      \ dist = km.distance_to_nearest_centroid(login)\n  iso = IsolationForest.fit(login_history); s =\
      \ iso.score(login)\n  if dist > d_thresh OR iso_outlier(s): alert(top3_features=explain(login))"
- question: Is a network device communicating over an unencrypted management protocol (telnet, ftp, http)
    or negotiating a non-approved/weakened cipher suite (export-grade, RC4, 3DES, SSLv3/TLS1.0) versus
    the approved baseline?
  context: 'Hardware-to-software crypto fallback typically manifests as cipher/version downgrade or a
    shift to cleartext protocols. Alert if a Zeek conn.log service field indicates an unencrypted management
    protocol (telnet, ftp, http) to a known network-device IP, or if Zeek ssl.log shows the device negotiating
    a non-approved/weakened cipher suite (export-grade, RC4, 3DES, SSLv3/TLS1.0) versus the approved baseline
    (NIST SP 800-52r2) and downgrade signaling (RFC 7507 TLS Fallback SCSV). A positive result indicates
    the device''s encryption has degraded - exactly the observable effect of disabled crypto hardware
    - and should be correlated with any recent config change on that device. This directly answers whether
    crypto is being weakened for Defense Impairment. References: [NIST SP 800-52r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-52r2.pdf);
    [RFC 7507 TLS Fallback SCSV](https://www.rfc-editor.org/rfc/rfc7507.txt).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek ipsec.log
  - 'NAI: Network backbone switches, internet gateways, datacenter core routers, VPN concentrators'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "conn.log where id.resp_h in network_device_ips and service in (telnet,ftp,http) -> alert\n\
      \  ssl.log where id.resp_h in network_device_ips and (cipher in weak_ciphers OR version in (SSLv3,TLS1.0))\n\
      \  | compare to approved_cipher_baseline -> alert on downgrade"
- question: At key chokepoints, has the ratio of encrypted sessions/bytes to total traffic dropped more
    than 3 SD below baseline for consecutive intervals, or has a change-point been detected, especially
    concurrent with a device throughput drop?
  context: 'A statistically significant decrease in the proportion of encrypted traffic is a strong, decryption-free
    indicator of weakened encryption. In 10-minute intervals compute the ratio of encrypted sessions (ssl.log
    + ipsec.log counts) and encrypted bytes to total TCP sessions/bytes (conn.log). Baseline mean/SD over
    30 days and alert when the ratio drops >3 SD below baseline for >=2 consecutive intervals, or when
    a CUSUM/PELT change-point is detected. Include device throughput (bytes/sec) as a volume metric: a
    sharp throughput drop concurrent with a config change corroborates loss of hardware acceleration.
    A correlated ratio drop plus throughput drop plus recent config change is high-confidence evidence
    of T1600.002 in the Defense Impairment context. References: [Change-Point Detection survey, Aminikhanghahi
    & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek ipsec.log
  - 'NAI: Network backbone switches, internet gateways, datacenter core routers, VPN concentrators'
  range: Last 90 days (30-day baseline, 10-min intervals)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per 10m interval:\n    enc_ratio = (ssl_sessions+ipsec_sessions)/total_tcp_sessions\n    enc_byte_ratio\
      \ = enc_bytes/total_bytes\n  baseline mean/sd over 30d\n  alert if enc_ratio < mean - 3*sd for >=2\
      \ consecutive intervals\n  alert if CUSUM/PELT change-point\n  corroborate with throughput_bytes_per_sec\
      \ drop + recent config change"
- question: Does encrypted-traffic volume/throughput fall below the lower prediction-interval bound of
    a time-series forecast, or does a self-supervised encrypted-traffic model detect downgrade-induced
    flow shifts?
  context: 'Forecast-based detection catches gradual or scheduled degradations a static threshold misses.
    Forecast expected encrypted-traffic volume/throughput with (S)ARIMA or Prophet and alert when observed
    volume falls below the lower prediction-interval bound for consecutive intervals. Complement with
    a self-supervised encrypted-traffic anomaly detector on flow metadata (sizes, timing, directionality)
    to catch downgrade-induced flow shifts without decryption, and surface the top-3 contributing features
    per alert. A sustained shortfall below the forecast band, or a flagged flow-shape shift, indicates
    the volume/character of encrypted traffic changed - consistent with crypto-hardware disablement. This
    ML layer answers the Defense Impairment PIR by detecting subtle encryption degradation over time.
    References: [Forecasting: Principles and Practice, Hyndman & Athanasopoulos](https://otexts.com/fpp3/arima.html);
    [Anomaly Detection in Encrypted Traffic, Scientific Reports 2025](https://www.nature.com/articles/s41598-025-08568-0);
    [Explainable AI in IDS review, Frontiers 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek ipsec.log
  - 'NAI: Network backbone switches, internet gateways, datacenter core routers, VPN concentrators'
  range: Last 90 days (forecast horizon dependent)
  queries:
  - technology: ML/pseudocode
    query: "model = SARIMA/Prophet.fit(encrypted_volume_timeseries)\n  pred = model.forecast(); lower\
      \ = pred.interval_low\n  if observed < lower for consecutive intervals: alert\n  ssl_model = SelfSupervisedFlowAD.fit(flow_metadata[sizes,timing,direction])\n\
      \  if ssl_model.anomaly(flow): alert(top3_features)"
- question: Does a network device's running/stored image hash, digital signature, secure-boot state, or
    running-config crypto-engine settings differ from the per-model known-good (golden) baseline, or is
    the device booting an unsigned/unexpected image?
  context: 'Disabling crypto hardware is often achieved via the Modify System Image path, so integrity
    verification against a golden baseline is decisive. On a schedule and after every change window, verify
    the running and stored image hash and digital signature against a per-model known-good (golden) allow-list
    and require signed images / Secure Boot (Cisco IOS Software Integrity Assurance; NIST SP 800-193 roots-of-trust/golden-measurement).
    Alert on any hash/signature mismatch, unexpected image size, or running-config diff that disables
    a crypto engine. Image hash/size deviation was the core SYNful Knock detection signal. Restrict and
    log firmware/config upload (TFTP/FTP) to authorized hosts (NIST SP 800-82r3). A mismatch is near-confirmation
    that the device has been tampered with to weaken encryption - the strongest device-side Defense Impairment
    evidence. References: [Cisco IOS Software Integrity Assurance](https://sec.cloudapps.cisco.com/security/center/resources/integrity_assurance.html);
    [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf); [SYNful
    Knock, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/); [NIST
    SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - networkdevice:config
  - networkdevice:cli
  - Zeek ssl.log
  - 'NAI: Network devices (routers, switches, firewalls), software-distribution/TFTP servers, configuration-management/NCCM
    systems, secure-boot/attestation logs, centralized syslog'
  range: Last 90 days (per change window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "schedule + post-change:\n    h = hash(running_image); sig = verify_signature(running_image)\n\
      \    if h not in golden_allowlist[model] OR sig invalid OR size != expected: alert high\n    if\
      \ running_config diff disables crypto_engine: alert high\n    if boot_image unsigned/unexpected:\
      \ alert high\n  log tftp/ftp uploads from non-authorized hosts"
- question: For any newly observed or uploaded firmware image, does its Shannon entropy or fuzzy-hash
    (ssdeep) similarity to known-good/known-bad corpora fall outside the per-model baseline band (e.g.,
    <90% similarity to any approved image)?
  context: 'Tampered images often differ in entropy or fuzzy-hash similarity even when version strings
    are spoofed. For any newly observed or uploaded image, compute Shannon entropy and ssdeep fuzzy-hash
    similarity against known-good and known-bad corpora, and flag images whose entropy or similarity score
    falls outside the per-model baseline band (e.g., similarity <90% to any approved image) for forensic
    review. Track the count of unauthorized image-change events per device as a frequency signal. A low-similarity
    or anomalous-entropy image on a device that performs encryption is a strong candidate for a modified
    image used to disable crypto hardware; escalate to integrity verification and forensic imaging. This
    statistical triage complements exact-hash matching for the Defense Impairment hunt. References: [Large-Scale
    Analysis of Embedded Firmwares, Costin et al](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf).'
  answer_sources:
  - networkdevice:config
  - networkdevice:cli
  - Zeek ssl.log
  - 'NAI: Network devices (routers, switches, firewalls), software-distribution/TFTP servers, configuration-management/NCCM
    systems, secure-boot/attestation logs, centralized syslog'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for new_or_uploaded_image:\n    ent = shannon_entropy(image)\n    sim_good = max(ssdeep_compare(image,\
