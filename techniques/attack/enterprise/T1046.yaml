  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: Network egress points, Internal network segments (East-West traffic), Server subnets, DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: Baseline weird and failure event counts\nWINDOW = 10m  // or\
      \ 24h for daily counts\nFOR EACH src_ip (and per host-utility / per source-dst pair):\n  fanout\
      \      = distinct(dst_ip or dst_port)\n  fail_ratio  = count(conn_state IN ['S0','REJ','RSTR'])\
      \ / count(*)\n  entropy     = shannon_entropy(dst_port)\n  cmd_entropy = shannon_entropy(cmdline_tokens)\n\
      COMPUTE per-segment baseline (mean,sigma,percentiles)\nALERT WHEN fanout > p98/p99 OR entropy >\
      \ p99\n  OR fail_ratio > mean+3*sigma  // sequential hypothesis test (SPRT) on success/fail\n  OR\
      \ cmd_entropy > mean+3*sigma"
