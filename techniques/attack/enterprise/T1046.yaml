questions:
- question: 'Using deterministic rule logic, can you determine whether ''Match known scanner user agents''
    indicates network service discovery activity? Specifically: Match Zeek http.log user_agent values
    against a scanner watchlist (e.g., ''Nmap Scripting Engine'', ''masscan/1.3.2'', ''zgrab'', ''Nikto'')
    and alert on hits. Pair with conn.log failure-state rules: alert when a source''s S0+REJ+RSTR connections
    exceed 80% of its attempts within 5 min, per [Zeek conn.log Documentation](https://docs.zeek.org/en/master/logs/conn.html)
    and the failure-ratio principle in [Fast Portscan Detection Using Sequential Hypothesis Testing, Jung
    et al](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  context: 'Tactic context (Discovery / Discovery): adversaries enumerate reachable services to orient
    themselves and find exploitable targets before acting. Evidence under investigation: Network traffic
    contains artifacts uniquely associated with scanning tools: scanner User-Agent strings in HTTP (Zeek
    http.log), protocol anomalies logged as ''weird'' events (Zeek weird.log, e.g., TCP Christmas/NULL/FIN
    scans), and a high proportion of failed/unanswered connections (Zeek conn.log conn_state S0/REJ/RSTR)
    from a single source. The failure-state ratio is the most evasion-resistant signal because scanners
    necessarily probe nonexistent hosts and closed ports. Approach (Match known scanner user agents):
    Match Zeek http.log user_agent values against a scanner watchlist (e.g., ''Nmap Scripting Engine'',
    ''masscan/1.3.2'', ''zgrab'', ''Nikto'') and alert on hits. Pair with conn.log failure-state rules:
    alert when a source''s S0+REJ+RSTR connections exceed 80% of its attempts within 5 min, per [Zeek
    conn.log Documentation](https://docs.zeek.org/en/master/logs/conn.html) and the failure-ratio principle
    in [Fast Portscan Detection Using Sequential Hypothesis Testing, Jung et al](https://www.icir.org/vern/papers/portscan-oak04.pdf).
    A positive result means a source/process is probing services in a pattern inconsistent with legitimate
    activity (e.g., high failure ratios, large fan-out, scanner signatures); a negative result means the
    observed traffic matches expected baselines. Investigate the named area of interest (Network egress
    points, Internal network segments (East-West traffic), Server subnets, DMZ) and pivot from any hit
    to the originating process, account, and downstream lateral-movement or exploitation attempts.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: Network egress points, Internal network segments (East-West traffic), Server subnets, DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Match known scanner user agents\nMATCH events WHERE\n  (user_agent\
      \ IN scanner_watchlist  // e.g. 'Nmap Scripting Engine','masscan','zgrab','Nikto'\n   OR process_name\
      \ IN ['nmap','masscan','zmap','rustscan','nc','ncat']\n   OR cmdline MATCHES /(-sV|-p\\s*1-65535|Test-NetConnection.*-Port|dns-sd\
      \ -B|nc .*-z)/)\nGROUP BY src_ip, process_guid OVER 5m\nHAVING count(conn_state IN ['S0','REJ','RSTR'])\
      \ / count(*) > 0.80\n  OR distinct_dst_or_port_fanout > threshold\nTHEN alert(severity='high', enrich=[dst_list,\
      \ conn_state_breakdown])"
- question: 'Using statistical baselining, can you determine whether ''Baseline weird and failure event
    counts'' indicates network service discovery activity? Specifically: Baseline 24-hour counts of scanner-related
    Zeek weird.log events AND the per-source connection failure ratio; alert when a source exceeds the
    99th percentile on either, treating elevated REJ/S0 rate as a distinct failure-mode signal as in [Fast
    Portscan Detection Using Sequential Hypothesis Testing, Jung et al](https://www.icir.org/vern/papers/portscan-oak04.pdf).
    Derive percentile cutoffs per segment from labeled scan distributions in [CICIDS2017, Sharafaldin
    et al](https://www.scitepress.org/papers/2018/66398/66398.pdf) and dataset guidance in [A Survey of
    Network-based IDS Data Sets, Ring et al](https://arxiv.org/abs/1903.02460).'
  context: 'Tactic context (Discovery / Discovery): adversaries enumerate reachable services to orient
    themselves and find exploitable targets before acting. Evidence under investigation: Network traffic
