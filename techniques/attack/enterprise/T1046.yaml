name: 'T1046: Network Service Discovery'
id: c1b484a7-73dc-4570-99fd-0c63fdd12d54
description: 'This playbook helps an analyst determine whether an adversary is performing Network Service
  Discovery (T1046): enumerating services running on remote hosts and network infrastructure via port,
  vulnerability, or wordlist scans. It correlates host-based process telemetry (scanner binaries such
  as nmap, masscan, zmap, rustscan, netcat -z, and abused native utilities like Test-NetConnection or
  macOS dns-sd) with network telemetry to surface scanning behavior. Investigative angles include: scanner
  User-Agent strings and protocol anomalies (Zeek http.log/weird.log), high connection-failure ratios
  (Zeek conn.log conn_state S0/REJ/RSTR), horizontal scans (many unique destination hosts on one port),
  vertical scans (many unique ports on one host), and benign processes exhibiting abnormal network fan-out,
  frequency, or failure rates. Detection blends symbolic-logic rules, statistical baselining (percentiles,
  entropy, sequential hypothesis testing), and machine learning (Random Forest, Isolation Forest, autoencoder
  ensembles, sequence models) to produce evasion-resistant, explainable alerts for the Discovery tactic.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
