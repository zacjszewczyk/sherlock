- question: 'Using deterministic rule logic, can you determine whether ''Rule for horizontal scan fan-out''
    indicates network service discovery activity? Specifically: Alert when a source IP connects to >50
    distinct destination IPs on the same port within 5 minutes, prioritizing connections with conn_state
    S0/REJ (no reply/rejected) per [Zeek conn.log Documentation](https://docs.zeek.org/en/master/logs/conn.html).
    Encode with engine primitives (track by_src, count, seconds) as described in [Suricata thresholds](https://docs.suricata.io/en/latest/configuration/global-thresholds.html);
    tune the count per segment, do not delete it.'
