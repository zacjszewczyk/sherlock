- question: 'Using deterministic rule logic, can you determine whether ''Watch for scanner binaries''
    indicates network service discovery activity? Specifically: Alert when process-creation logs show
    scanner executables (nmap, masscan, zmap, rustscan, netcat -z) or command lines matching scanning
    options (Test-NetConnection -Port, nmap -sV, ''dns-sd -B''), applying the unauthorized-probe logic
    formalized in [Network Intrusion Detection and Prevention, Ghorbani et al](https://doi.org/10.1007/978-0-387-88771-5).'
  context: 'Tactic context (Discovery / Discovery): adversaries enumerate reachable services to orient
    themselves and find exploitable targets before acting. Evidence under investigation: A process is
    created with a filename matching a known network scanning tool (nmap.exe, masscan, zmap, rustscan)
    or a native utility is executed with arguments indicative of service discovery (e.g., ''Test-NetConnection
    -Port'', ''nmap -sV -p 1-65535'', netcat ''-z'', or macOS ''dns-sd -B _ssh._tcp''). Correlate the
    process with the volume and failure rate of the network connections it subsequently emits. Approach
    (Watch for scanner binaries): Alert when process-creation logs show scanner executables (nmap, masscan,
    zmap, rustscan, netcat -z) or command lines matching scanning options (Test-NetConnection -Port, nmap
    -sV, ''dns-sd -B''), applying the unauthorized-probe logic formalized in [Network Intrusion Detection
    and Prevention, Ghorbani et al](https://doi.org/10.1007/978-0-387-88771-5). A positive result means
    a source/process is probing services in a pattern inconsistent with legitimate activity (e.g., high
    failure ratios, large fan-out, scanner signatures); a negative result means the observed traffic matches
    expected baselines. Investigate the named area of interest (Domain Controllers, Member Servers, Critical
    Workstations, Jump Boxes) and pivot from any hit to the originating process, account, and downstream
    lateral-movement or exploitation attempts.'
