name: 'T1546.015: Component Object Model Hijacking'
id: 1964552b-d30e-44a0-8085-07d6c7650b9d
description: Investigate Component Object Model (COM) hijacking, in which an adversary modifies Registry
  references to COM objects so that their malicious code executes in place of legitimate system components.
  This playbook helps an analyst hunt for COM server keys (InProcServer32 / LocalServer32 / TreatAs) and
  TypeLib entries under both the per-user HKCU/HKU\Software\Classes\CLSID hive (persistence) and the machine-wide
  HKLM\SOFTWARE\Classes\CLSID hive (privilege escalation) that have been repointed to known-bad binaries,
  script interpreters (powershell.exe, mshta.exe, wscript.exe), scrobj.dll (squiblydoo), remote 'script:'
  monikers, or user-writable staging directories (%APPDATA%, %TEMP%, C:\Users\Public). It correlates those
  Registry writes with the process that performed them (integrity level, parent-child rarity), with subsequent
  suspicious child processes spawned by COM-loading hosts (explorer.exe, svchost.exe), and with anomalous
  or failed network egress that signals attempted remote-payload retrieval or C2. The playbook combines
  deterministic symbolic-logic detections, statistical baselining (frequency, entropy, and rarity thresholds),
  and machine-learning approaches (Random Forest/XGBoost, Isolation Forest, DBSCAN, One-Class SVM, ARIMA/LSTM
  time-series, and provenance-graph learning) to surface both routine commodity persistence and sophisticated,
  stealthy COM hijacking.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
