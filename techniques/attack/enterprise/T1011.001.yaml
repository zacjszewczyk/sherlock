- question: Did a host receive more than 500MB from internal RFC1918 servers in one hour while sending
    under 5MB to external IPs in the same hour — and which process (Sysmon Event ID 3 / Windows Event
    ID 5156) was responsible?
  context: 'A large internal ingress without matching external egress is the network hallmark of data
    leaving over an alternate channel such as Bluetooth (TA0010). Alert when a host''s received bytes
    from internal RFC1918 servers (Zeek conn.log) exceed 500MB in one hour while sent bytes to external
    IPs stay under 5MB in the same hour, then correlate with Sysmon Event ID 3 / Windows Event ID 5156
    to identify the responsible process. Tune the thresholds to your environment. This pattern indicates
    a host hoarding data internally but not shipping it over the network — consistent with off-IP exfiltration
    — and the responsible process is the pivot for host-side Bluetooth investigation. References: [MAGNETO:
    Covert Channel between Air-Gapped Systems and Smartphones](https://arxiv.org/abs/1802.02317); [Robust
    Anomaly Detection in Dynamic Networks](https://arxiv.org/abs/1503.02332).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: Internal network segments, DMZ, and connections to high-value data repositories (file servers,
    databases)'
  range: Last 90 days; per 1-hour window
  queries:
  - technology: Zeek/pseudocode
    query: 'source=conn.log | where is_rfc1918(id.resp_h)

      | bin _time span=1h | stats sum(resp_bytes) AS in_bytes by id.orig_h,_time

      | join id.orig_h,_time [search conn.log where NOT is_rfc1918(id.resp_h) | bin _time span=1h | stats
      sum(orig_bytes) AS out_bytes by id.orig_h,_time]

      | where in_bytes>500MB AND out_bytes<5MB

      | join id.orig_h [search (Sysmon EID 3 OR EID 5156) | fields host,Image,dest_ip]

      | table _time,id.orig_h,in_bytes,out_bytes,Image'
- question: Does a host's 24-hour rolling ratio of internal bytes-received to external bytes-sent deviate
    more than 3 standard deviations from its baseline in any hour, or does a cumulative low-and-slow detector
    flag a slow trickle that never trips the hourly volume rule?
  context: 'A behavioral ratio metric adapts to each host''s normal traffic profile and catches data hoarding
    that fixed thresholds miss (TA0010). Per host, compute a 24-hour rolling ratio of internal bytes-received
    to external bytes-sent (Zeek conn.log) and alert when an hour deviates more than 3 standard deviations
    from the host baseline, indicating ingress without commensurate egress. Add a cumulative low-and-slow
    detector so a slow trickle that never trips the hourly volume rule is still caught over multi-hour
    windows. A host whose ingress/egress ratio spikes far above its norm — or whose cumulative imbalance
    grows steadily — is a candidate for alternate-channel exfiltration. References: [Robust Anomaly Detection
    in Dynamic Networks](https://arxiv.org/abs/1503.02332); [Detection of Malicious and Low Throughput
    Data Exfiltration](https://arxiv.org/abs/1709.08395).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: Internal network segments, DMZ, and connections to high-value data repositories (file servers,
    databases)'
  range: Last 90 days; 24-hour rolling window
  queries:
  - technology: Zeek/pseudocode
    query: 'source=conn.log | bin _time span=1h

      | stats sum(if(is_rfc1918(id.resp_h),resp_bytes,0)) AS in_int, sum(if(NOT is_rfc1918(id.resp_h),orig_bytes,0))
      AS out_ext by id.orig_h,_time

      | eval ratio=in_int/(out_ext+1)

      | streamstats time_window=24h avg(ratio) AS mu, stdev(ratio) AS sd by id.orig_h

      | eval cum=cumulative_sum(in_int-out_ext, by=id.orig_h, window=24h)

      | where ratio>mu+3*sd OR cum>lowslow_threshold | table _time,id.orig_h,ratio,mu,sd,cum'
- question: When per-host net-flow (bytes_in minus bytes_out) is modeled with a time-series detector (Prophet/LSTM)
    trained on historical Zeek conn.log, are there large positive ingress spikes not followed by the predicted
    egress?
  context: 'A time-series model of net-flow learns each host''s normal ingress/egress dynamics and flags
    the anomalous ''data came in but never left over the network'' pattern of Bluetooth exfiltration (TA0010).
    Model per-host (or host-to-server) net-flow (bytes_in minus bytes_out) with a Prophet or LSTM detector
    trained on historical Zeek conn.log and alert on a large positive ingress spike not followed by predicted
    egress. Report the top-3 contributors (peer server, ingress volume, missing-egress gap) in the alert
    for explainability. A positive net-flow spike that the model expected to be balanced by outbound traffic
    — but which never materializes — points to data exiting off the monitored network. References: [Robust
    Anomaly Detection in Dynamic Networks](https://arxiv.org/abs/1503.02332).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: Internal network segments, DMZ, and connections to high-value data repositories (file servers,
    databases)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series=per_host_netflow(bytes_in - bytes_out)  // from Zeek conn.log

      model=Prophet_or_LSTM.fit(historical_series)

      | eval pred=model.predict(_time), gap=actual-pred

      | where actual>0 AND gap>model.upper_band AND expected_egress_unrealized(host,_time)

      | eval top3=[peer_server, ingress_volume, missing_egress_gap]

      | table _time,host,actual,pred,top3'
