questions:
- question: Did any newly created process on a user workstation or laptop match — by file hash — a known
    malicious tool or script capable of transferring data over Bluetooth, or load Bluetooth APIs (e.g.,
    bthprops.cpl, BluetoothAPIs.dll, Linux libbluetooth)?
  context: 'Exfiltration over Bluetooth (TA0010) often relies on purpose-built tooling that can drive
    a Bluetooth radio to push staged data off-host through a weakly defended, off-IP channel. The deterministic
    floor here is to query every process-creation event with command-line logging enabled and compare
    each new binary''s file hash against a curated threat-intel feed of known Bluetooth-capable malware
    and tooling, raising a high-severity alert on any confirmed match. Any binary that imports Bluetooth
    APIs should be treated as in-scope even if not yet on a feed. A positive hash match is a strong, low-false-positive
    indicator warranting immediate host isolation and triage; a negative result does not clear the host
    because novel or repacked tooling will not match, which is why prevalence and ML methods run in parallel.
    References: [The KNOB is Broken](https://www.usenix.org/system/files/sec19-antonioli.pdf); [Machine
    Learning for Detecting Data Exfiltration: A Review](https://arxiv.org/abs/2012.09344).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations and Laptops, especially those of high-value targets'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (WinEventLog:Security EventCode=4688, WinEventLog:Sysmon EventCode=1)

      | eval h=lower(Hashes)

      | lookup ti_bluetooth_malware sha256 AS h OUTPUT verdict

      | where verdict="malicious" OR match(ImageLoaded, "(?i)bthprops|BluetoothAPIs|libbluetooth")

      | eval severity="high" | table _time,host,User,Image,h,ParentImage,verdict'
- question: Is a process that imports Bluetooth functions also extremely rare across the enterprise —
    running on fewer hosts than the 1st prevalence percentile — and exhibiting failed Bluetooth DLL loads
    or failed device-handle activity?
  context: 'A sophisticated actor''s custom Bluetooth exfiltration tool will be uncommon by definition,
    so fleet-wide prevalence is a powerful anomaly signal for TA0010 exfiltration. Baseline every process
    hash across the estate and compute prevalence (the percent of hosts a hash appears on); then flag
    any hash below the 1st prevalence percentile that also imports Bluetooth functions. Layer in State/Failure
    signals — counts of failed Bluetooth DLL loads and failed device-handle acquisitions per process —
    because trial-and-error driving of an unfamiliar radio produces these errors. Derive the percentile
    cut from your own fleet, starting at the 1st percentile and tightening until the daily candidate list
    is triageable. A rare, Bluetooth-importing binary with repeated device failures is a high-value lead;
    common, signed software will sit well above the cut. References: [Insight into Insiders and IT](https://arxiv.org/abs/1805.01612).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations and Laptops, especially those of high-value targets'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (4688, Sysmon EID 1)

      | stats dc(host) AS host_count by Hashes

      | eventstats count(eval(true())) AS fleet, percentile(host_count,1) AS p1

      | where host_count<=p1 AND imports_bluetooth(Hashes)

      | join Hashes [search bt_failures | stats sum(failed_dll_load) AS dllfail, sum(failed_handle) AS
      hfail by Hashes]

      | where dllfail>0 OR hfail>0 | table Hashes,host_count,dllfail,hfail'
- question: When scored by a supervised classifier trained on process metadata (PE header fields, section
    entropy, imported functions, parent process, signer), do any newly observed processes receive a high
    maliciousness score while co-occurring with Bluetooth device or service activity?
  context: 'Hash and prevalence rules miss never-before-seen tooling, so a supervised model (Random Forest
    or gradient boosting) trained on process metadata can score new processes for likely-malicious characteristics
    relevant to Bluetooth exfiltration (TA0010). Escalate high scores that co-occur with Bluetooth device
    or service activity on the same host. For explainability the alert must emit the top-3 contributing
    features (e.g., ''unsigned binary'', ''imports BluetoothAPIs'', ''rare parent svchost''). Retain the
    deterministic hash rule as the fallback floor so the ML layer only adds coverage. A high score plus
    contemporaneous Bluetooth activity is a strong combined signal; a high score alone may be a benign
    rare tool and should be triaged with the contributing features. References: [Machine Learning for
    Detecting Data Exfiltration: A Review](https://arxiv.org/abs/2012.09344).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations and Laptops, especially those of high-value targets'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=rf_process_meta

      features=[pe_header, section_entropy, imported_funcs, parent_image, signer]

      score=model.predict_proba(new_process)

      | where score>=0.85 AND bluetooth_activity_on_host(host, _time, window=10m)

      | eval top3=model.explain(new_process)

      | table _time,host,Image,score,top3'
- question: Were legitimate transfer utilities (fsquirt.exe, PowerShell Bluetooth cmdlets, or Linux/macOS
    equivalents) executed with arguments indicating a scripted or non-interactive Bluetooth file transfer
    — especially when launched by a non-interactive parent process?
  context: 'Adversaries frequently abuse built-in, living-off-the-land utilities to move staged data over
    Bluetooth, avoiding custom malware (TA0010). Monitor process creation for fsquirt.exe and PowerShell
    and alert on fsquirt.exe with -send; on PowerShell script blocks (Event ID 4104) containing Send-BluetoothFile,
    Get-BluetoothDevice, or InTheHand.Net; and on Linux bluetoothctl, obexftp, rfcomm, hcitool or macOS
    blueutil. Weight the alert higher when the parent is non-interactive (svchost.exe, services.exe, wscript.exe,
    cron), since interactive Bluetooth sharing is normally user-driven. A scripted invocation from a service
    parent is a strong exfiltration indicator; routine user-initiated transfers are expected and should
    be deprioritized. References: [Machine Learning for Detecting Data Exfiltration: A Review](https://arxiv.org/abs/2012.09344).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: User Workstations and Laptops'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "(source=Sysmon EID 1 AND ((Image=\"*\\\\fsquirt.exe\" AND CommandLine=\"*-send*\")\n  OR Image\
      \ IN (\"*bluetoothctl\",\"*obexftp\",\"*rfcomm\",\"*hcitool\",\"*blueutil\")))\nOR (source=WinEventLog\
      \ EID 4104 AND ScriptBlockText=\"*Send-BluetoothFile*\" OR \"*Get-BluetoothDevice*\" OR \"*InTheHand.Net*\"\
      )\n| eval weight=if(ParentImage IN (\"*svchost.exe\",\"*services.exe\",\"*wscript.exe\",\"*cron*\"\
      ),\"high\",\"medium\")\n| table _time,host,User,Image,CommandLine,ParentImage,weight"
- question: Does any user or host show a statistically anomalous spike in the frequency or argument entropy
    of Bluetooth-transfer utilities — exceeding 3 standard deviations from its historical norm or landing
    in the top 5% of argument entropy — including repeated failed or aborted OBEX/Bluetooth transfers?
  context: 'Beyond catching known argument strings, per-user/per-host behavioral baselining catches abuse
    of these utilities that hides in otherwise legitimate tooling (TA0010). Baseline daily frequency (count
    per minute) and command-line argument patterns for each utility and compute the Shannon entropy of
    arguments; alert at greater than 3 standard deviations above the historical norm or when argument
    entropy is in the top 5% for that utility. Profile failure explicitly: repeated failed or aborted
    OBEX/Bluetooth transfers (non-zero exit codes, ''device not reachable'') are a distinct trial-and-error
    exfiltration signal. A sudden burst of high-entropy, partially failing invocations on a host that
    rarely uses these tools is a strong lead. References: [Insight into Insiders and IT](https://arxiv.org/abs/1805.01612);
    [Detection of Malicious and Low Throughput Data Exfiltration](https://arxiv.org/abs/1709.08395).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: User Workstations and Laptops'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (4688, Sysmon EID 1, 4104)

      | where bluetooth_utility(Image)

      | bin _time span=1d | stats count AS freq, entropy(CommandLine) AS argent, sum(eval(ExitCode!=0))
      AS fails by user,host,Image,_time

      | eventstats avg(freq) AS mu, stdev(freq) AS sd, perc95(argent) AS e95 by user,host,Image

      | where freq>mu+3*sd OR argent>=e95 OR fails>=3

      | table _time,user,host,Image,freq,argent,fails'
- question: Does seasonal time-series anomaly detection on per-host frequency of Bluetooth-related transfer
    commands reveal spikes that cannot be explained by software updates or normal usage?
  context: 'Static thresholds miss seasonality (e.g., weekly admin tasks), so apply seasonal time-series
    anomaly detection (Seasonal-ARIMA or Prophet) to per-host frequency of Bluetooth-related transfer
    commands and flag spikes outside the expected band that are not attributable to software updates or
    normal behavior (TA0010). Surface the top-3 drivers (host, utility, deviation magnitude versus the
    expected band) in the alert and keep the deterministic argument rule as the floor. A spike that breaks
    the learned seasonal pattern, on a host with no corresponding maintenance event, indicates possible
    scripted Bluetooth exfiltration; spikes aligned with patch windows are likely benign. References:
    [Robust Anomaly Detection in Dynamic Networks](https://arxiv.org/abs/1503.02332).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: User Workstations and Laptops'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series=per_host_hourly_count(bluetooth_transfer_cmds)

      model=Prophet.fit(series, seasonality=[daily,weekly])

      | eval expected=model.predict(_time), resid=actual-expected

      | where resid>model.upper_band AND NOT software_update_window(host,_time)

      | eval top3=[host,utility,resid] | table _time,host,actual,expected,top3'
- question: Were archiving tools (7z.exe, rar.exe, tar, zip) executed from non-standard paths (e.g., C:\Users\*\AppData\Local\Temp)
    or by system/service accounts, suggesting pre-exfiltration data staging?
  context: 'Before exfiltrating over Bluetooth an adversary typically stages and compresses data, so anomalous
    use of archiving tools is an early TA0010 indicator. Monitor process creation for 7z.exe, rar.exe,
    tar, and zip and alert when they run from non-standard locations such as a user''s Temp directory
    or when invoked by system/service accounts, both of which commonly indicate automated staging rather
    than a user compressing files in place. A positive hit — an archiver running from Temp under a service
    account — is a strong staging lead to correlate with subsequent Bluetooth activity; user-initiated
    archiving from normal install paths is expected. References: [Machine Learning for Detecting Data
    Exfiltration: A Review](https://arxiv.org/abs/2012.09344); [Insight into Insiders and IT](https://arxiv.org/abs/1805.01612).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - 'NAI: File Servers, User Workstations, and Document Management Systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=Sysmon EID 1 AND Image IN (\"*\\\\7z.exe\",\"*\\\\rar.exe\",\"*\\\\tar*\",\"*\\\\zip*\"\
      ,\"*/tar\",\"*/zip\")\n| where match(Image,\"(?i)\\\\AppData\\\\Local\\\\Temp|/tmp/\")\n   OR User\
      \ IN (\"SYSTEM\",\"LOCAL SERVICE\",\"NETWORK SERVICE\")\n| table _time,host,User,Image,CommandLine,ParentImage"
- question: Did the rate or volume of newly created archive files (.zip/.rar/.7z/.tar.gz) on a host exceed
    its 99th-percentile baseline within a 10-minute window, or did a 24-hour cumulative archived-byte
    counter trip on slow trickle staging?
  context: 'Statistical volume/frequency monitoring on file creation catches staging that uses legitimate
    tools from legitimate paths (TA0010). From file-creation events track new .zip/.rar/.7z/.tar.gz files
    and, per host, baseline volume (total bytes) and frequency (count) of archives per hour; alert when
    a 10-minute window exceeds that host''s 99th percentile. To defeat low-and-slow staging that stays
    under the per-window cap, also accumulate a 24-hour cumulative archived-byte counter that trips on
    trickle behavior. Derive percentiles from your own telemetry. A burst of archive creation far above
    baseline, or a steadily climbing cumulative byte counter, indicates bulk data being prepared for exfiltration.
    References: [Robust Anomaly Detection in Dynamic Networks](https://arxiv.org/abs/1503.02332); [Detection
    of Malicious and Low Throughput Data Exfiltration](https://arxiv.org/abs/1709.08395).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - 'NAI: File Servers, User Workstations, and Document Management Systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=Sysmon EID 11 AND TargetFilename IN ("*.zip","*.rar","*.7z","*.tar.gz")

      | bin _time span=10m | stats count AS cnt, sum(FileSize) AS bytes by host,_time

      | eventstats perc99(cnt) AS p99c, perc99(bytes) AS p99b by host

      | eval cum24h=cumulative_sum(bytes, by=host, window=24h)

      | where cnt>p99c OR bytes>p99b OR cum24h>cum_threshold(host)

      | table _time,host,cnt,bytes,cum24h'
- question: When file-creation events are clustered on features like extension, directory-path entropy,
    file size, and parent process, do any archive writes fall into noise/outlier clusters distinct from
    normal user or software behavior?
  context: 'Density-based clustering (e.g., DBSCAN) finds staging that does not match any simple threshold
    by isolating file-creation events that are structurally unlike normal activity (TA0010). Cluster on
    features such as extension, directory-path entropy, file size, and parent process, and alert on noise/outlier
    points that sit apart from the dense regions representing routine user and software behavior. Report
    the top-3 features that placed the event in the outlier set (e.g., ''temp path'', ''size 1.2GB'',
    ''parent powershell'') for analyst triage. An outlier archive write — large, in a high-entropy temp
    path, spawned by an unusual parent — is a credible staging signal worth pivoting to subsequent Bluetooth
    activity. References: [Machine Learning for Detecting Data Exfiltration: A Review](https://arxiv.org/abs/2012.09344).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - 'NAI: File Servers, User Workstations, and Document Management Systems'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'events=file_creation(Sysmon EID 11)

      X=[extension, path_entropy(TargetFilename), FileSize, ParentImage]

      labels=DBSCAN(eps, min_samples).fit_predict(X)

      | where labels==-1

      | eval top3=feature_contrib(X) | table _time,host,TargetFilename,FileSize,ParentImage,top3'
- question: Did the Bluetooth Support Service (bthserv) enter a running state, or was its Start registry
    value changed away from 4 (Disabled), on any host in a 'Servers' or 'Bluetooth-Disabled' asset group?
  context: 'On hosts where Bluetooth is disabled by policy, any enablement is deterministically anomalous
    and a direct precursor to Bluetooth exfiltration (TA0010). Alert on Windows Event ID 7036 showing
    bthserv entering ''running'' for any host in a Servers/Bluetooth-Disabled asset group, and on Sysmon
    Event ID 13 changing HKLM\SYSTEM\CurrentControlSet\Services\bthserv\Start to anything other than 4.
    NIST guidance recommends Bluetooth be disabled where unused, so service enablement or a Start-value
    change on a restricted host is a high-confidence indicator that someone is preparing an out-of-band
    channel. A legitimate change should map to an approved change ticket; absent that, treat it as malicious.
    References: [Guide to Bluetooth Security (NIST SP 800-121r2)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-121r2.pdf).'
  answer_sources:
  - Windows Event ID 7036
  - Microsoft-Windows-Kernel-PnP/Configuration Event ID 400
  - Microsoft-Windows-Kernel-PnP/Configuration Event ID 400
  - Sysmon Event ID 13
  - 'NAI: Servers in Datacenters, Critical Workstations, and any host where Bluetooth is disabled by Group
    Policy'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(source=WinEventLog:System EventCode=7036 AND Service="Bluetooth Support Service" AND State="running")

      OR (source=Sysmon EID 13 AND TargetObject="*\\Services\\bthserv\\Start" AND Details!="DWORD (0x00000004)")

      | lookup asset_groups host OUTPUT group

      | where group IN ("Servers","Bluetooth-Disabled")

      | eval severity="high" | table _time,host,group,EventCode,TargetObject,Details'
- question: On hosts that maintained a zero Bluetooth-device baseline over the last 90 days, did any new
    Bluetooth device connection (Kernel-PnP Event ID 400/410) appear, or were there repeated failed pairings/authentication
    failures?
  context: 'Tracking Bluetooth device connection events and maintaining the set of hosts that have never
    seen one establishes a strong zero-baseline from which any deviation is suspicious (TA0010). Track
    daily frequency of Kernel-PnP Event IDs 400/410 for Bluetooth devices across endpoints, keep the list
    of hosts with a zero-count baseline over 90 days, and flag any new Bluetooth device connection on
    those hosts as high-priority. Also record State/Failure: repeated failed pairings or authentication
    failures indicate an unauthorized device attempting to attach. A first-ever Bluetooth adapter on a
    locked-down server, or a burst of failed pairings, is a strong sign of an adversary introducing an
    exfiltration peripheral. References: [Guide to Bluetooth Security (NIST SP 800-121r2)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-121r2.pdf);
    [Insight into Insiders and IT](https://arxiv.org/abs/1805.01612).'
  answer_sources:
  - Windows Event ID 7036
  - Microsoft-Windows-Kernel-PnP/Configuration Event ID 400
  - Microsoft-Windows-Kernel-PnP/Configuration Event ID 400
  - Sysmon Event ID 13
  - 'NAI: Servers in Datacenters, Critical Workstations, and any host where Bluetooth is disabled by Group
    Policy'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=Microsoft-Windows-Kernel-PnP/Configuration EventCode IN (400,410) AND DeviceClass="Bluetooth"

      | stats count AS conns, sum(eval(Status="pair_failed" OR Status="auth_failed")) AS fails by host

      | join host [search zero_bt_baseline_90d | fields host]

      | where conns>0 OR fails>=2 | eval severity="high" | table host,conns,fails'
- question: When a classifier predicts the expected Bluetooth-service state from host features (OS, asset
    group, role, installed software), do any hosts have an actual state that contradicts the 'should be
    disabled' prediction?
  context: 'A supervised model (e.g., Logistic Regression) learns which hosts should have Bluetooth disabled
    based on OS, asset group, role, and installed software, allowing detection of policy drift and covert
    enablement even outside formal asset groups (TA0010). Flag hosts whose actual Bluetooth state contradicts
    the prediction and include the top-3 features driving the ''should be disabled'' prediction in the
    alert. A datacenter server with no Bluetooth-dependent software whose radio is nonetheless active
    is exactly the contradiction this method surfaces; hosts where the role and software justify Bluetooth
    will match the prediction and stay quiet. References: [Machine Learning for Detecting Data Exfiltration:
    A Review](https://arxiv.org/abs/2012.09344).'
  answer_sources:
  - Windows Event ID 7036
  - Microsoft-Windows-Kernel-PnP/Configuration Event ID 400
  - Microsoft-Windows-Kernel-PnP/Configuration Event ID 400
  - Sysmon Event ID 13
  - 'NAI: Servers in Datacenters, Critical Workstations, and any host where Bluetooth is disabled by Group
    Policy'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=logreg_bt_state

      features=[os, asset_group, role, installed_software]

      | eval predicted=model.predict(features), actual=current_bt_state(host)

      | where predicted=="disabled" AND actual=="enabled"

      | eval top3=model.explain(features) | table host,predicted,actual,top3'
- question: Where a radio sensor exists, did physical-layer RF fingerprinting detect a Bluetooth/BLE device
    that is not on the allowlist of known peripherals pairing or transferring near a host — especially
    a host where the channel should not exist?
  context: 'Host logs can be tampered with, so an independent RF sensor provides physical corroboration
    of Bluetooth exfiltration (TA0010). Fingerprint nearby Bluetooth radios at the physical layer (transient
    phase, IQ imbalance) and allowlist known peripherals so an unknown device that pairs or transfers
    is flagged; corroborate with a protocol-independent RF intrusion-detection system that anomaly-scores
    unexpected Bluetooth/BLE emissions near hosts where the channel should not exist. Use this as a non-host
    sensor to confirm host-side bthserv enablement with physical evidence. An un-allowlisted RF fingerprint
    emitting near a Bluetooth-disabled server, time-aligned with a bthserv enable event, is compelling
    combined evidence of an exfiltration device. References: [An Experimental Study: RF Fingerprinting
    of Bluetooth Devices](https://arxiv.org/abs/2402.06250); [RadIoT: Radio Communications Intrusion Detection
    for IoT](https://arxiv.org/abs/1811.03934).'
  answer_sources:
  - Windows Event ID 7036
  - Microsoft-Windows-Kernel-PnP/Configuration Event ID 400
  - Microsoft-Windows-Kernel-PnP/Configuration Event ID 400
  - Sysmon Event ID 13
  - 'NAI: Servers in Datacenters, Critical Workstations, and any host where Bluetooth is disabled by Group
    Policy'
  range: Last 90 days
  queries:
  - technology: RF-IDS/pseudocode
    query: "for emission in rf_sensor.bluetooth_ble_observations():\n  fp=fingerprint(transient_phase,\
      \ iq_imbalance)\n  if fp not in peripheral_allowlist or anomaly_score(emission)>thr:\n    if near_restricted_host(emission.location):\n\
      \      alert(host, fp, emission.rssi, corroborate=bthserv_enabled(host, emission.time))"
- question: Was a data-staging event (e.g., rar.exe run from a temp directory) followed within 15 minutes
    by a Bluetooth-activity event (e.g., fsquirt.exe execution or bthserv start) on the same host?
  context: 'Because Bluetooth exfiltration leaves no matching network egress, the most reliable signal
    is the internal correlation of staging followed by host-side radio/peripheral activation (TA0010).
    Implement a SIEM correlation rule that fires when a ''Data Staging'' event (such as rar.exe from a
    temp directory) is followed by a ''Bluetooth Activity'' event (such as fsquirt.exe execution or bthserv
    start) on the same host within a 15-minute window. This temporal chain on an executive, developer,
    or admin endpoint is a high-confidence exfiltration sequence; either event alone is far weaker, which
    is why correlating them sharply reduces false positives. References: [MAGNETO: Covert Channel between
    Air-Gapped Systems and Smartphones](https://arxiv.org/abs/1802.02317); [Machine Learning for Detecting
    Data Exfiltration: A Review](https://arxiv.org/abs/2012.09344).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Executive Laptops and workstations of developers or system administrators'
  range: Last 90 days; correlate within a 15-minute event-centered window
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'stage=process_create where (Image~"7z|rar|zip|tar" AND path~"Temp|/tmp")

      bt=event where (Image~"fsquirt" OR (EventCode=7036 AND Service="Bluetooth Support Service" AND State="running"))

      | transaction host maxspan=15m startswith=stage endswith=bt

      | eval severity="critical" | table _time,host,User,stage.Image,bt.Image'
- question: Did a per-host risk score — incremented on technique events such as large archive creation,
    Bluetooth service start on a server, and failed Bluetooth pairings — cross the fleet 95th percentile
    on its 1-hour moving average?
  context: 'Aggregating weak signals into a per-host risk score catches multi-step Bluetooth exfiltration
    where no single event is decisive (TA0010). Maintain a running score, incrementing on technique events
    (e.g., +10 large archive creation, +50 Bluetooth service start on a server, +20 failed Bluetooth pairing),
    and alert when the 1-hour moving average exceeds the fleet 95th percentile. Include failure-rate components
    so trial-and-error attempts raise the score even before a successful transfer. A host whose score
    climbs through staging, service enablement, and failed pairings within an hour is exhibiting the full
    exfiltration pattern and should be prioritized over hosts with a single isolated event. References:
    [Insight into Insiders and IT](https://arxiv.org/abs/1805.01612).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Executive Laptops and workstations of developers or system administrators'
  range: Last 90 days; 1-hour moving-average window
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'events=technique_events(host)

      | eval pts=case(type="large_archive",10, type="bthserv_start_server",50, type="bt_pair_fail",20,
      true(),0)

      | bin _time span=1h | stats sum(pts) AS score by host,_time

      | streamstats avg(score) AS ma1h by host

      | eventstats perc95(ma1h) AS fleet95

      | where ma1h>fleet95 | table _time,host,ma1h,fleet95'
