name: 'T1011.001: Exfiltration Over Bluetooth'
id: 12bfd490-a13c-450b-b4d9-2c287bb95db7
description: 'This playbook helps an analyst investigate whether an adversary is exfiltrating data over
  a Bluetooth channel rather than the primary command-and-control or wired Internet path. Bluetooth is
  an off-IP, short-range channel that is frequently less monitored and less defended than the enterprise
  network, making it attractive to an actor who has gained local access and physical proximity. The investigation
  spans the full exfiltration kill chain on Linux, macOS, and Windows endpoints: execution of malicious
  or living-off-the-land Bluetooth transfer tooling (e.g., fsquirt.exe, PowerShell Bluetooth cmdlets,
  bluetoothctl, obexftp, rfcomm, hcitool, blueutil); anomalous data staging such as large archive or encrypted-file
  creation in temp paths or user profiles; unexpected activation of Bluetooth services or connection of
  Bluetooth adapters on hosts where the radio should be disabled by policy; correlated staging-then-Bluetooth
  sequences on the same host within a short window; and the network-level fingerprint of large internal
  ingress to a host with little corresponding outbound egress, which is the hallmark of data leaving over
  an alternate channel. For each evidence type the playbook provides deterministic (symbolic-logic) detections
  as the reliable floor, statistical baselining for prevalence/volume/frequency anomalies, and machine-learning
  approaches for scoring rare processes, sequences, and RF device fingerprints, so the guidance is granular,
  defensible, and immediately actionable in a SOC.'
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
