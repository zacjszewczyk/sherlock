questions:
- question: Did any internal host issue a DNS query (Zeek dns.log 'query') or open a network connection
    (Zeek conn.log 'id.resp_h') to a domain that exactly matches an entry on a high-confidence threat-intelligence
    feed of known malicious domains, with the outbound session corroborated on the endpoint by Windows
    Event ID 5156?
  context: 'This question matches our own resolution and egress traffic against curated, high-confidence
    malicious-domain indicators to catch hosts touching adversary-acquired infrastructure (Resource Development:
    Domains). Continuously ingest the CTI feed and join it against Zeek dns.log ''query'' and conn.log
    ''id.resp_h'', then confirm the connection actually completed on the host using Windows Event ID 5156
    (Filtering Platform permitted connection) to suppress passive/sinkholed noise. Because freshly acquired
    domains are often not yet blacklisted, reputation and passive-DNS scoring ([EXPOSURE, Bilge et al](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf);
    [Notos, Antonakakis et al](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf))
    raise confidence for newly observed domains. Alert on an exact match and surface the matched indicator,
    the feed name, and the first-seen time so an analyst can immediately gauge freshness and provenance.
    A positive result means a host reached known-bad adversary infrastructure and is a strong lead for
    Initial Access or Command and Control follow-up; a negative result reduces, but does not eliminate,
    exposure (the domain may simply not be in the feed yet).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Corporate DNS Resolvers, Egress Web Proxies, Network Security Monitoring (NSM) Sensors, Firewall
    Egress Logs'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FOR each dns_q in Zeek dns.log, each conn in Zeek conn.log:\n  IF dns_q.query IN CTI_malicious_domains\n\
      \     OR resolve(conn.id.resp_h) IN CTI_malicious_domains THEN\n    LET host = conn.id.orig_h\n\
      \    IF EXISTS WinEID 5156 WHERE dst_addr == conn.id.resp_h\n       AND host_ip == host AND ts ~\
      \ conn.ts THEN\n      alert(host, matched_indicator, feed_name, first_seen, sev=HIGH)"
- question: Which internal source IPs contacted an unusually high number of DISTINCT malicious domains
    within short (5-minute) windows, and what is each host's ratio of blocked/failed (conn_state S0/REJ/RST)
    versus established sessions to the threat feed?
  context: This question escalates from single-indicator matches to behavioral severity using the physics
    of the attack. Count distinct malicious domains contacted per source IP over rolling 5-minute windows
    (Frequency) and sum bytes transferred (Volume) from conn.log corroborated by Windows Event ID 5156.
    A host touching many distinct feed domains in a tight window is far more likely to be running adversary
    tooling (e.g., a C2 implant cycling through acquired domains) than a user who incidentally hit one
    bad ad domain. Escalate when the distinct-domain count exceeds a behavioral threshold (default >3,
    tuned to the per-host 99th percentile so chatty servers do not generate noise). Separately track the
    State signal, the ratio of blocked/failed (S0/REJ, RST) to established sessions, because a burst of
    failed attempts to known-bad domains (domains taken down or sinkholed) is itself a strong indicator
    of an implant trying dead infrastructure (per [Notos, Antonakakis et al](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf)).
    A positive result identifies a host worth isolating and imaging.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Corporate DNS Resolvers, Egress Web Proxies, Network Security Monitoring (NSM) Sensors, Firewall
    Egress Logs'
  range: Last 90 days (5-minute sliding windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each src_ip, each 5-min window:\n  distinct_bad = count(distinct domain IN CTI_feed contacted)\n\
      \  vol = sum(orig_bytes + resp_bytes to CTI_feed)\n  fail_ratio = count(conn_state IN {S0,REJ,RSTO,RSTR})\
      \ / count(established)\n  thr = max(3, p99(per_host distinct_bad baseline))\n  IF distinct_bad >\
      \ thr THEN alert(src_ip, distinct_bad, vol, fail_ratio, sev=HIGH)\n  IF fail_ratio high THEN flag(dead_c2_probing)"
- question: Are hourly threat-intelligence match counts (from Zeek and Windows Event ID 5156) spiking
    more than 3 standard deviations above the rolling 24-hour seasonal baseline, and which hosts/domains
    are driving the spike?
  context: This question detects organization-wide surges in contact with adversary-acquired domains that
    individual alerts can miss. Apply a SARIMA or seasonal-decomposition time-series model to hourly CTI
    match counts derived from Zeek dns/conn.log and Windows Event ID 5156, and flag hours where the observed
    count exceeds 3 standard deviations above the rolling 24-hour seasonal baseline (accounting for normal
    business-hour rhythm). The alert must include the top-3 contributing hosts and domains plus the observed-vs-expected
    delta, so an analyst can immediately pivot. Domain dynamism features ([EXPOSURE, Bilge et al](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf))
    help distinguish a genuine campaign spike from a feed-update artifact. A positive result often signals
    the start of a phishing wave or a C2 campaign leveraging newly stood-up domains (Resource Development
    feeding Initial Access / Command and Control); a negative result confirms baseline exposure.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Corporate DNS Resolvers, Egress Web Proxies, Network Security Monitoring (NSM) Sensors, Firewall
    Egress Logs'
  range: Last 90 days (hourly buckets, rolling 24-hour seasonal baseline)
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = hourly_count(CTI_matches from Zeek + WinEID 5156)\nmodel = SARIMA/seasonal_decompose.fit(series,\
      \ period=24h)\nFOR each hour:\n  expected, sigma = model.forecast(hour)\n  IF observed > expected\
      \ + 3*sigma THEN\n    top3 = top_contributors(host, domain)\n    alert(hour, observed, expected,\
      \ delta=observed-expected, top3)"
- question: Did an internal host resolve a domain (Zeek dns.log 'query') that exactly matches a pre-generated
    typosquat permutation (Damerau-Levenshtein distance 1-2, homophone, or TLD swap) of a corporate or
    partner brand, with the query tied to a specific process via Windows Event ID 4688?
  context: 'This question hunts for lookalike domains an adversary may have acquired to impersonate our
    brand or our partners (Resource Development: Domains), typically as a prelude to phishing or drive-by
    compromise. Pre-generate a watchlist of squats for each protected brand: Damerau-Levenshtein distance-1/2
    permutations, homophones, and TLD swaps ([The Landscape of Domain Name Typosquatting, Spaulding et
    al](https://arxiv.org/abs/1603.02767); popularity-weighted distance-1 enumeration per [The Long Tail
    of Typosquatting, Szurdi et al](https://www.usenix.org/conference/usenixsecurity14/technical-sessions/presentation/szurdi)).
    Alert when a Zeek dns.log query exactly matches a generated squat, and tie the resolution to the responsible
    process via Windows Event ID 4688 so the analyst knows whether a browser, mail client, or scripted
    tool triggered it. Surface the impersonated brand in the alert. A positive result means a host resolved
    a deliberate lookalike of a trusted domain, a high-value early-warning signal for credential-phishing
    infrastructure; precompute and refresh the squat list as new brands/partners are onboarded.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Corporate DNS Resolvers, Mail Gateway Logs, Egress Web Proxies, Endpoint DNS Cache, Network
    Security Monitoring (NSM) Sensors'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "squats = generate(brands, {damerau_levenshtein<=2, homophones, tld_swaps})\nFOR each dns_q\
      \ in Zeek dns.log:\n  IF dns_q.query IN squats THEN\n    proc = join WinEID 4688 ON host, time(dns_q)\n\
      \    alert(host, dns_q.query, impersonated_brand, proc, sev=HIGH)"
- question: Did an internal host resolve an internationalized/mixed-script domain whose Unicode confusable
    'skeleton' equals that of a protected brand while its raw code points differ, indicating an IDN homograph
    attack?
  context: 'This question catches visually identical lookalike domains that evade plain string matching
    by using Unicode characters from other scripts (e.g., Cyrillic ''a'' for Latin ''a''). Normalize each
    queried label to its Unicode confusable skeleton ([Unicode Security Mechanisms (UTS #39)](https://www.unicode.org/reports/tr39/))
    and flag mixed-script labels; alert when a non-protected domain''s skeleton equals a protected brand''s
    skeleton but the underlying raw code points differ. Name the matched brand in the alert. This is a
    deterministic, low-false-positive signal because legitimate brand domains do not normally appear as
    mixed-script homographs of themselves. A positive result strongly indicates adversary-acquired homograph
    infrastructure for phishing or malware delivery (Resource Development feeding Initial Access). Tie
    the resolution to the responsible process (Windows Event ID 4688) for triage and containment.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Corporate DNS Resolvers, Mail Gateway Logs, Egress Web Proxies, Endpoint DNS Cache, Network
    Security Monitoring (NSM) Sensors'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each dns_q in Zeek dns.log:\n  label = dns_q.query\n  skel = unicode_confusable_skeleton(label)\n\
      \  IF is_mixed_script(label)\n     AND skel IN {skeleton(b) for b in protected_brands}\n     AND\
      \ codepoints(label) != codepoints(matched_brand) THEN\n    proc = join WinEID 4688 ON host, time(dns_q)\n\
      \    alert(host, label, matched_brand, proc, sev=HIGH)"
- question: For each queried registered domain, is the Levenshtein distance to a protected brand small
    (<=2) while the share of non-alphanumeric characters and KL-divergence from an English character distribution
    exceed the per-environment 95th percentile, tying the query to Windows Event ID 4688?
  context: 'This question statistically flags domains that are close to a brand yet ''look wrong''. For
    each queried registered domain, compute the Levenshtein edit distance to the protected-brand list,
    the percentage of non-alphanumeric characters, and the KL divergence/entropy of its character distribution
    against expected English text ([Using Entropy in Threat Hunting, Downing](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/);
    lexical features of [The Many Faces of Typosquatting, Spaulding et al](https://arxiv.org/abs/2005.07930)).
    Flag when the edit distance is <=2 AND the entropy/KL exceeds the environment''s 95th percentile,
    and join to Windows Event ID 4688 to attribute the lookup to a process. The combination is powerful:
    small edit distance captures brand proximity while high entropy/odd character mix captures the algorithmically
    generated or obfuscated nature of many squats, reducing the false positives a distance filter alone
    would produce. A positive result is a candidate typosquat/lookalike worth WHOIS enrichment and blocking
    (Resource Development: Domains).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Corporate DNS Resolvers, Mail Gateway Logs, Egress Web Proxies, Endpoint DNS Cache, Network
    Security Monitoring (NSM) Sensors'
  range: Last 90 days (per-environment 95th-percentile baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each registered_domain d in Zeek dns.log:\n  dist = min(levenshtein(d, b) for b in protected_brands)\n\
      \  pct_nonalnum = nonalnum_chars(d) / len(d)\n  kl = KL_divergence(char_dist(d), english_char_dist)\n\
      \  IF dist <= 2 AND (kl > p95(env) OR pct_nonalnum > p95(env)) THEN\n    proc = join WinEID 4688\
      \ ON host, time(d)\n    alert(host, d, nearest_brand=argmin_b, dist, kl, proc)"
- question: Does a machine-learning classifier (Random Forest on lexical features plus a visual-similarity
    embedding) score a queried domain as a typosquat/lookalike with probability >0.9, and what is the
    nearest legitimate brand and the top-3 features driving the score?
  context: This question generalizes lookalike detection beyond hand-built rules. Score each queried domain
    with a Random Forest trained on n-gram frequency, character entropy, edit distance to known-good domains,
    TLD, and length ([NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500) feature
    set), and complement edit distance with a visual-similarity Siamese-CNN embedding ([Detecting Homoglyph
    Attacks, Woodbridge et al](https://arxiv.org/abs/1805.09738); [homoglyph code](https://github.com/endgameinc/homoglyph))
    to catch glyph-level impersonation that lexical features miss. Enrich with Windows Event ID 4688 process
    metadata (e.g., which application requested the domain). Alert when typosquat probability exceeds
    0.9 and surface the nearest legitimate brand plus the top-3 contributing features for analyst explainability.
    This ML approach catches novel squats that are not on any precomputed list. A high-confidence positive
    indicates adversary-acquired impersonation infrastructure (Resource Development) and warrants blocking,
    brand-protection takedown, and user awareness.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Corporate DNS Resolvers, Mail Gateway Logs, Egress Web Proxies, Endpoint DNS Cache, Network
    Security Monitoring (NSM) Sensors'
  range: Last 90 days (retrain periodically on labeled brand/squat data)
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [ngram_freq, entropy, edit_distance_to_good, tld, length,\n            proc_metadata(WinEID\
      \ 4688)]\nrf = RandomForest.train(labeled_domains)\nFOR each queried_domain d:\n  p = rf.predict_proba(d)\n\
      \  vis = siamese_cnn_similarity(d, brand_glyph_embeddings)\n  IF p > 0.9 OR vis > vis_thr THEN\n\
      \    top3 = SHAP(rf, d).top(3)\n    alert(host, d, nearest_brand, p, vis, top3)"
- question: Did an internal host establish a TLS connection (Zeek ssl.log) to a domain registered less
    than 30 days ago that presents a certificate from a free Certificate Authority (e.g., Let's Encrypt)
    with a short validity period (<=90 days), corroborated by Windows Event ID 5156 for the same host/session?
  context: 'This question targets the freshly acquired, low-cost infrastructure adversaries commonly stand
    up (Resource Development: Domains). Enrich Zeek ssl.log fields (server_name, issuer, validity window)
    with WHOIS/RDAP registration age and join to Windows Event ID 5156 for the same host/session to confirm
    the connection happened on the endpoint. Alert when the domain was registered <30 days ago AND uses
    a free-CA issuer AND the certificate validity is <=90 days, the typical profile of disposable C2/phishing
    domains. Newly observed domains can be scored on reputation features ([Notos, Antonakakis et al](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf))
    before they are blacklisted. None of these attributes alone is malicious (many benign sites use Let''s
    Encrypt), so the conjunction is what makes this defensible. A positive result is a strong candidate
    for newly weaponized adversary infrastructure and should be enriched with passive DNS and Certificate
    Transparency before blocking.'
  answer_sources:
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Egress Web Proxies, Corporate DNS Resolvers, Certificate Transparency Log Feeds, Network Security
    Monitoring (NSM) Sensors'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FOR each ssl in Zeek ssl.log:\n  age = now - whois_rdap_registration_date(ssl.server_name)\n\
      \  validity = cert.not_after - cert.not_before\n  IF age < 30d AND ssl.issuer IN free_CAs AND validity\
      \ <= 90d THEN\n    IF EXISTS WinEID 5156 WHERE host, dst==ssl.id.resp_h, ts~ssl.ts THEN\n      alert(host,\
      \ ssl.server_name, ssl.issuer, age, validity, sev=HIGH)"
- question: Is the TLS SNI (Zeek ssl.log server_name) naming a high-reputation CDN front while the observed
    HTTP Host header or downstream request names a different, rare inner host, indicating domain fronting?
  context: 'This question detects domain fronting, where an adversary routes C2 through a trusted CDN
    so the acquired inner domain inherits the CDN''s reputation (Resource Development: Domains feeding
    Command and Control). Alert when the TLS SNI (ssl.log server_name) names a high-reputation CDN front
    but the decrypted or otherwise observed HTTP Host header (or downstream request) names a different,
    rare inner host, the deterministic mismatch described by [Blocking-resistant Communication through
    Domain Fronting, Fifield et al](https://www.petsymposium.org/2015/papers/03_Fifield.pdf). This is
    a high-fidelity signal because legitimate traffic generally aligns SNI and Host. Where TLS is not
    decrypted, approximate with ESNI/ECH anomalies and CDN-IP-with-rare-host heuristics. A positive result
    indicates an attempt to disguise C2 behind a trusted front and warrants deeper inspection and, where
    policy allows, blocking the inner host. Pair with Windows Event ID 5156 to attribute the session to
    a host/process.'
  answer_sources:
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Egress Web Proxies, Corporate DNS Resolvers, Certificate Transparency Log Feeds, Network Security
    Monitoring (NSM) Sensors'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FOR each ssl in Zeek ssl.log JOIN http in Zeek http.log ON conn uid:\n  front = ssl.server_name\
      \   # SNI\n  inner = http.host         # decrypted/observed Host header\n  IF front IN high_rep_cdn_fronts\n\
      \     AND inner != front AND prevalence(inner) low THEN\n    alert(host, front, inner, sev=HIGH,\
      \ reason='domain_fronting')"
- question: Does a new external connection accrue an additive risk score (e.g., +10 registration age <60
    days, +5 WHOIS privacy, +5 free CA, +5 rare ASN/IP fan-out) above the 95th percentile of daily domain
    scores, and which components contributed?
  context: 'This question blends multiple weak signals into one tunable risk score so analysts triage
    the riskiest new domains first. For each new connection (Zeek dns/ssl/conn.log corroborated by Windows
    Event ID 5156), compute an additive score: +10 if registration age <60 days, +5 for WHOIS privacy/redaction,
    +5 for a free-CA issuer, +5 for rare ASN or unusual IP fan-out, weighting passive-DNS prevalence/dynamism
    features ([EXPOSURE, Bilge et al](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)).
    Alert above the 95th percentile of the day''s domain scores and list the contributing components so
    the analyst sees exactly why a domain ranked high. This is more robust than any single rule because
    no one attribute dominates, and it adapts as the daily distribution shifts. A positive (high-score)
    result flags likely adversary-acquired infrastructure (Resource Development: Domains) for enrichment
    and possible blocking.'
  answer_sources:
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Egress Web Proxies, Corporate DNS Resolvers, Certificate Transparency Log Feeds, Network Security
    Monitoring (NSM) Sensors'
  range: Last 90 days (daily 95th-percentile scoring)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each new external connection c (Zeek + WinEID 5156):\n  s = 0; comp = []\n  IF reg_age(c.domain)\
      \ < 60d THEN s+=10; comp+='age<60d'\n  IF whois_privacy(c.domain) THEN s+=5; comp+='whois_privacy'\n\
      \  IF issuer(c) IN free_CAs THEN s+=5; comp+='free_CA'\n  IF rare_asn(c) OR high_ip_fanout(c.domain)\
      \ THEN s+=5; comp+='rare_asn/fanout'\n  IF s > p95(today_domain_scores) THEN alert(c.domain, s,\
      \ comp)"
- question: When domains are clustered by resolved-IP-set, ASN diversity, registration age, TLD, and certificate
    attributes, do any new connections land in a cluster labeled suspicious/malicious (e.g., fast-flux),
    and what defines that cluster?
  context: 'This question uses unsupervised clustering to expose adversary infrastructure that shares
    hidden structure. Cluster domains by resolved-IP set, ASN diversity, registration age, TLD, and certificate
    attributes (fast-flux clustering per [FluxBuster, Perdisci et al](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf)),
    enriched with host metadata from Windows Event ID 5156. Label clusters exhibiting fast-flux or other
    malicious patterns and alert when a new connection lands in such a cluster, surfacing the cluster''s
    defining features. Fast-flux and shared-hosting clusters reveal domains that look benign individually
    but collectively betray throwaway adversary infrastructure (Resource Development: Domains). A positive
    result groups an observed domain with known-bad patterns and gives the analyst the cluster characteristics
    to justify action; pair with passive DNS to confirm rapid IP rotation.'
  answer_sources:
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Egress Web Proxies, Corporate DNS Resolvers, Certificate Transparency Log Feeds, Network Security
    Monitoring (NSM) Sensors'
  range: Last 90 days (cluster over rolling window)
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = features(domains)[resolved_ip_set, asn_diversity, reg_age, tld,\n    cert_attrs, host_metadata(WinEID\
      \ 5156)]\nclusters = DBSCAN/KMeans.fit(X)\nlabel_clusters(fast_flux, shared_hosting => suspicious)\n\
      FOR each new connection c:\n  cl = assign_cluster(c)\n  IF cl.label == 'suspicious/malicious' THEN\n\
      \    alert(c.domain, cl.defining_features, sev=HIGH)"
- question: Did a source IP generate more than 20 NXDOMAIN responses within 60 seconds, and does the responsible
    parent process (Windows Event ID 4688) fall outside the allowlist of expected NXDOMAIN-generating
    applications?
  context: 'This question catches Domain Generation Algorithm (DGA) behavior, where malware queries many
    algorithmically generated domains to find the one the adversary has actually registered (Resource
    Development: Domains feeding Command and Control). Alert when a source IP produces >20 NXDOMAIN responses
    in 60 seconds (Frequency plus failure State) and correlate with Windows Event ID 4688 to verify the
    parent process is not on an allowlist of known NXDOMAIN-noisy software (browsers with DNS prefetch,
    some security agents). NXDOMAIN/error rate is a primary DGA discriminator ([Real-Time Detection of
    DNS Exfiltration, Nadler et al](https://arxiv.org/abs/1709.08395)). Anchoring the alert to a non-allowlisted
    process dramatically cuts false positives and points the analyst straight at the offending binary.
    A positive result is a strong DGA/C2 lead; pivot to the subsequent successful (NOERROR) resolution
    to identify the registered C2 domain.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Endpoint Processes, Corporate DNS Resolvers, Domain Controllers, Endpoint DNS Cache'
  range: Last 90 days (60-second burst window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each src_ip, 60-sec window:\n  nx = count(dns.log WHERE rcode_name=='NXDOMAIN')\n  IF\
      \ nx > 20 THEN\n    proc = join WinEID 4688 ON host, window\n    IF proc.parent NOT IN nxdomain_allowlist\
      \ THEN\n      alert(src_ip, nx, proc, sev=HIGH)"
- question: Over 5-minute windows, do a host's NXDOMAIN-to-total-query ratio AND the KL-divergence/Shannon
    entropy of its queried labels both exceed that host's 99th-percentile baseline, and is the burst followed
    by a successful (NOERROR) resolution of a low-prevalence newly registered domain?
  context: 'This question statistically profiles DGA activity per host rather than via a fixed count.
    Track each host''s NXDOMAIN-to-total-query ratio (failure State) and the KL-divergence/Shannon entropy
    of its queried labels over 5-minute windows ([Using Entropy in Threat Hunting, Downing](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/);
    [NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500) lexical features).
    Alert when BOTH the failure ratio and the entropy exceed that host''s own 99th-percentile baseline,
    which captures the signature combination of many failed lookups for high-entropy, random-looking names.
    Then confirm a subsequent successful (NOERROR) resolution to a low-prevalence newly registered domain,
    which is the moment the implant finds its live C2. Per-host baselining tolerates naturally noisy hosts
    while still catching their deviations. A positive result is a high-confidence DGA detection that also
    yields the actual adversary-acquired domain for blocking (Resource Development: Domains).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Endpoint Processes, Corporate DNS Resolvers, Domain Controllers, Endpoint DNS Cache'
  range: Last 90 days (5-minute windows, per-host 99th-percentile baseline)
  queries:
  - technology: SIEM/Stats pseudocode
