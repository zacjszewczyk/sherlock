- question: Which source-destination pairs show low-jitter periodic connections (inter-arrival coefficient
    of variation low, jitter <1s, mean interval 1 min-2 h) with byte volumes above the destination port's
    95th percentile, and what is their failed/reset (S0/REJ/RSTO) ratio?
  context: 'This question statistically detects beaconing, the regular check-ins implants make to acquired
    C2 domains (Resource Development: Domains feeding Command and Control). Flag source-destination pairs
    whose inter-arrival coefficient of variation/jitter is low (jitter <1s, mean interval between roughly
    1 minute and 2 hours) using FFT-periodicity and multi-stage filtering ([BAYWATCH, Hu et al](https://dsail.kaist.ac.kr/files/WWW17.pdf)),
    and whose orig_bytes/resp_bytes (Volume) exceed the destination port''s 95th percentile. Track the
    failed/reset (conn_state S0/REJ/RSTO) ratio as a distinct State signal, since beacons to dead infrastructure
    produce characteristic retry patterns. Periodicity plus volume plus retry behavior together discriminate
    beacons from chatty-but-benign services. Attribute via Windows Event ID 4688. A positive result is
    a high-priority C2 lead; enrich the destination with registration age and reputation before action.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - 'NAI: Firewall Egress Logs, Egress Web Proxies, Network Sensor Taps, Endpoint Process Execution Logs'
  range: Last 90 days (multi-day window for periodicity analysis)
