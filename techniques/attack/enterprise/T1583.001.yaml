  - technology: SIEM/Stats pseudocode
    query: "FOR each (src, dst) pair over multi-day window:\n  intervals = diff(sorted(conn.ts))\n  cv\
      \ = stddev(intervals) / mean(intervals)\n  period = FFT_dominant_period(timeseries)\n  fail_ratio\
      \ = count(conn_state IN {S0,REJ,RSTO}) / count(all)\n  IF cv low AND jitter<1s AND 60s<=mean(intervals)<=7200s\n\
      \     AND volume > p95(dst_port_volume) THEN\n    proc = join WinEID 4688 ON src\n    alert(src,\
      \ dst, period, volume, fail_ratio, proc, sev=HIGH)"
