name: 'T1583.001: Domains'
id: 9de246d2-68e2-4b6d-bcd9-754223108714
description: 'Investigate whether an adversary has acquired or is using malicious domains to support operations
  against the organization (MITRE ATT&CK T1583.001, Resource Development). Although domain acquisition
  itself occurs in adversary-controlled (PRE) infrastructure, its effects are observable in our own DNS,
  proxy, TLS, and endpoint telemetry when those domains are exercised for phishing, drive-by compromise,
  or command and control. This playbook helps an analyst hunt for: (1) internal hosts resolving or connecting
  to domains that match high-confidence threat-intelligence feeds, confirmed at the host with Windows
  Event ID 5156; (2) lookalike, typosquatted, and IDN-homograph domains visually or typographically similar
  to corporate/partner brands, tied to a process via Windows Event ID 4688; (3) newly registered domains
  presenting short-lived free-CA TLS certificates and domain-fronting SNI/Host mismatches in Zeek ssl.log;
  (4) Domain Generation Algorithm (DGA) behavior evidenced by high-entropy NXDOMAIN bursts followed by
  resolution of a low-prevalence newly registered domain; and (5) beaconing toward acquired C2 domains
  characterized by low-jitter periodicity, service/port mismatches, and anomalous transfer volumes. Each
  question pairs symbolic-logic detection rules, robust statistical baselining, and machine-learning approaches
  across network (Zeek dns/conn/ssl, passive DNS, WHOIS/RDAP, Certificate Transparency) and endpoint (Windows
  Event ID 4688/5156) telemetry so a SOC analyst can surface adversary domain infrastructure before or
  as it is weaponized.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
