    known proxies, internal services on nonstandard ports). This is a deterministic protocol-state signal:
    malware frequently tunnels over unexpected ports to evade port-based filtering. Tie the connection
    to its originating process via Windows Event ID 4688 for attribution. A positive result is a strong
    lead for covert C2 and should be triaged alongside destination-domain reputation and registration
    age; a clean allowlist is essential to keep false positives low.'
