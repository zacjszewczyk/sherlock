      \ associated_ttps, destination_rarity)\n| rank ioc_matches by feed_score desc\n| emit top3_features(feed_precision,\
      \ indicator_recency, destination_rarity)\n| alert"
- question: '[Resource Development] Using the ''Symbolic (Rule-based suspicious cert)'' (Symbolic Logic)
    approach: can you determine whether an outbound SSL/TLS connection uses a certificate with suspicious
    attributes: a subject domain that is a likely typosquat of a corporate domain (Damerau-Levenshtein
    distance 1-2), a very short validity period (< 90 days), issuance from a free CA for a recently registered
    domain (age < 30 days), a Common Name (CN) that does not match the SNI, or a certificate that does
    not appear in Certificate Transparency logs.'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary installs SSL/TLS
    digital certificates on infrastructure they control or have compromised, enabling encrypted command-and-control
    or lending credibility to credential-harvesting and phishing sites. This evidence focuses on the condition
    that an outbound SSL/TLS connection uses a certificate with suspicious attributes: a subject domain
    that is a likely typosquat of a corporate domain (Damerau-Levenshtein distance 1-2), a very short
    validity period (< 90 days), issuance from a free CA for a recently registered domain (age < 30 days),
    a Common Name (CN) that does not match the SNI, or a certificate that does not appear in Certificate
    Transparency logs. This Symbolic Logic approach works as follows: Flag SSL/TLS sessions where (1)
    the `x509.log` issuer is a known free CA (e.g., "Let''s Encrypt", ''ZeroSSL'') AND the subject domain
    WHOIS creation date (enrichment) is < 30 days old, (2) the certificate subject CN does not exactly
    match the `ssl.log` SNI, (3) the certificate validity window is < 90 days, or (4) a certificate presented
    for one of your brand/lookalike domains has no corresponding entry in Certificate Transparency, indicating
    a self-signed/locally-staged certificate ([Beyond the Lock Icon, Dong et al.](https://doi.org/10.1109/ecrime.2015.7120795);
    [SigmaHQ](https://github.com/SigmaHQ/sigma); [RFC 6962 Certificate Transparency](https://www.rfc-editor.org/rfc/rfc6962.txt)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    certificate staging; pivot to the responsible internal host and process or installing account, the
    destination server''s IP, domain, and certificate hash/serial/issuer, the certificate''s validity
    window and CT status, and the volume and timing of connections to scope the activity and identify
    related infrastructure. A negative result helps rule out this particular facet of certificate staging
    but should be corroborated with the other questions in this playbook, since a single method can miss
    certificates hidden by TLS 1.3/ECH, rotated indicators, or legitimately issued certificates abused
    for malicious sites.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - 'NAI: Network Egress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'ssl.log JOIN x509.log ON cert_chain_fps

      | eval issuer=x509.certificate.issuer, subject_cn=x509.certificate.subject_cn, sni=ssl.server_name

      | eval free_ca = issuer CONTAINS (''Let''s Encrypt'',''ZeroSSL'')

      | eval new_domain = whois_creation_age(subject_domain) < 30d

      | eval cn_sni_mismatch = subject_cn != sni

      | eval short_validity = (not_after - not_before) < 90d

      | eval ct_absent = ct_monitor_absent(subject) for brand/lookalike domains

      | where (free_ca AND new_domain) OR cn_sni_mismatch OR short_validity OR ct_absent

      | alert priority=high'
- question: '[Resource Development] Using the ''Statistical (Typosquatting + cert-feature scoring)'' (Statistical
    Method) approach: can you determine whether an outbound SSL/TLS connection uses a certificate with
    suspicious attributes: a subject domain that is a likely typosquat of a corporate domain (Damerau-Levenshtein
    distance 1-2), a very short validity period (< 90 days), issuance from a free CA for a recently registered
    domain (age < 30 days), a Common Name (CN) that does not match the SNI, or a certificate that does
    not appear in Certificate Transparency logs.'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary installs SSL/TLS
    digital certificates on infrastructure they control or have compromised, enabling encrypted command-and-control
    or lending credibility to credential-harvesting and phishing sites. This evidence focuses on the condition
