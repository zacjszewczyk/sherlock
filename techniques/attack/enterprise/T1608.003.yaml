- question: '[Resource Development] Using the ''Symbolic (First-seen issuer/cert rule)'' (Symbolic Logic)
    approach: can you determine whether SSL/TLS certificates observed on the network exhibit characteristics
    that are statistical outliers versus an established enterprise-wide baseline, such as an anomalous
    spike in first-seen certificate issuers, certificates with unusually low- or high-entropy subject/issuer
    names, or rare combinations of issuer + short validity + self-signed status.'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary installs SSL/TLS
    digital certificates on infrastructure they control or have compromised, enabling encrypted command-and-control
    or lending credibility to credential-harvesting and phishing sites. This evidence focuses on the condition
    that SSL/TLS certificates observed on the network exhibit characteristics that are statistical outliers
    versus an established enterprise-wide baseline, such as an anomalous spike in first-seen certificate
    issuers, certificates with unusually low- or high-entropy subject/issuer names, or rare combinations
    of issuer + short validity + self-signed status. This Symbolic Logic approach works as follows: Maintain
    a 90-day lookup of all certificate SHA1 hashes and issuer organizational (''O'') names seen on the
    network; alert when a connection uses a hash or issuer absent from the lookup, prioritizing those
    also flagged free-CA, short-validity, or self-signed ([Tall Tales of Hunting with TLS/SSL Certificates,
    Kovar](https://www.splunk.com/en_us/blog/security/tall-tales-of-hunting-with-tls-ssl-certificates.html)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    certificate staging; pivot to the responsible internal host and process or installing account, the
    destination server''s IP, domain, and certificate hash/serial/issuer, the certificate''s validity
    window and CT status, and the volume and timing of connections to scope the activity and identify
    related infrastructure. A negative result helps rule out this particular facet of certificate staging
    but should be corroborated with the other questions in this playbook, since a single method can miss
    certificates hidden by TLS 1.3/ECH, rotated indicators, or legitimately issued certificates abused
    for malicious sites.'
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - 'NAI: SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'lookup_90d = distinct(x509.fingerprint_sha1, x509.issuer_O) seen on network last 90d

      | current = ssl.log JOIN x509.log ON cert_chain_fps

      | where current.cert_sha NOT IN lookup_90d OR current.issuer_O NOT IN lookup_90d

      | eval prioritized = free_ca OR short_validity OR self_signed

      | sort by prioritized desc

      | alert'
