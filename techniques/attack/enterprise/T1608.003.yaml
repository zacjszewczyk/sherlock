    validity period (< 90 days), issuance from a free CA for a recently registered domain (age < 30 days),
    a Common Name (CN) that does not match the SNI, or a certificate that does not appear in Certificate
    Transparency logs. This Statistical Method approach works as follows: For each `x509.log` subject
    domain compute Damerau-Levenshtein distance against the organization''s domains, brands, and partners;
    baseline distances for legitimate traffic and flag distance 1-2, especially when correlated with low
    reputation or recent registration ([Beyond the Lock Icon, Dong et al.](https://doi.org/10.1109/ecrime.2015.7120795)).
    In parallel, score each certificate against the benign distribution of validity duration, key length,
    SAN count, and issuer prevalence; staged certs cluster at short validity, single-SAN, free/uncommon
    CA ([Deciphering Malware''s use of TLS, Anderson McGrew](https://arxiv.org/abs/1607.01639)). A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable adversary certificate
    staging; pivot to the responsible internal host and process or installing account, the destination
    server''s IP, domain, and certificate hash/serial/issuer, the certificate''s validity window and CT
    status, and the volume and timing of connections to scope the activity and identify related infrastructure.
    A negative result helps rule out this particular facet of certificate staging but should be corroborated
    with the other questions in this playbook, since a single method can miss certificates hidden by TLS
    1.3/ECH, rotated indicators, or legitimately issued certificates abused for malicious sites.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - 'NAI: Network Egress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'x509.log

      | eval typosquat = damerau_levenshtein(subject_domain, corp_domains/brands/partners) BETWEEN 1 AND
      2

      | eval cert_score = distance_from_benign(validity_duration, key_length, san_count, issuer_prevalence)

      | where (typosquat AND (low_reputation OR recent_registration)) OR cert_score > threshold

      | sort by cert_score desc'
