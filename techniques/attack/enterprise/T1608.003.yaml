    attempts before a successful connection; alert when failure-then-success to a rare destination co-occurs
    with an IOC or suspicious certificate ([Certified Malware, Kim Kwon Dumitras](https://doi.org/10.1145/3133956.3133958)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    certificate staging; pivot to the responsible internal host and process or installing account, the
    destination server''s IP, domain, and certificate hash/serial/issuer, the certificate''s validity
    window and CT status, and the volume and timing of connections to scope the activity and identify
    related infrastructure. A negative result helps rule out this particular facet of certificate staging
    but should be corroborated with the other questions in this playbook, since a single method can miss
    certificates hidden by TLS 1.3/ECH, rotated indicators, or legitimately issued certificates abused
    for malicious sites.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network Egress/Ingress Points (Firewalls, Proxies)'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'conn.log JOIN x509.log JOIN ssl.log JOIN dns.log ON uid/sni

      | stats by dest: firewall_deny_count, tls_handshake_fail_count, count(x509.validation_status!=''ok''),
      dns_nxdomain_servfail_count

      | eval rare = hist_freq_90d <= p1 OR first_seen==true

      | eval fail_then_success = (failed_or_blocked_attempts>0 BEFORE successful_conn)

      | where fail_then_success AND rare AND (ioc_match OR suspicious_cert)

      | alert'
