questions:
- question: '[Resource Development] Using the ''Symbolic (IOC + default-cert match)'' (Symbolic Logic)
    approach: can you determine whether an outbound SSL/TLS connection is established with a remote server
    whose certificate hash (SHA1/SHA256), serial number, Subject/Issuer fields, or JA4X certificate fingerprint
    matches a known-malicious indicator from a high-confidence threat intelligence feed, a Certificate
    Transparency monitor, or a default tooling certificate (e.g., the Cobalt Strike default self-signed
    certificate, serial 146473198).'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary installs SSL/TLS
    digital certificates on infrastructure they control or have compromised, enabling encrypted command-and-control
    or lending credibility to credential-harvesting and phishing sites. This evidence focuses on the condition
    that an outbound SSL/TLS connection is established with a remote server whose certificate hash (SHA1/SHA256),
    serial number, Subject/Issuer fields, or JA4X certificate fingerprint matches a known-malicious indicator
    from a high-confidence threat intelligence feed, a Certificate Transparency monitor, or a default
    tooling certificate (e.g., the Cobalt Strike default self-signed certificate, serial 146473198). This
    Symbolic Logic approach works as follows: Extract certificate SHA1/SHA256 hashes, serial numbers,
    and issuer/subject CN+O from `x509.log` and SNI from `ssl.log` for all outbound connections, joining
    to `conn.log` on `uid`. Cross-reference hashes, serials, and server names against threat-intel feeds
    and Certificate Transparency monitors of your brand/lookalike domains, generating a high-priority
    alert on any exact match ([Tall Tales of Hunting with TLS/SSL Certificates, Kovar](https://www.splunk.com/en_us/blog/security/tall-tales-of-hunting-with-tls-ssl-certificates.html);
    [RFC 6962 Certificate Transparency](https://www.rfc-editor.org/rfc/rfc6962.txt)). Add deterministic
    rules for default tooling certificates — e.g., x509 issuer/subject containing ''Major Cobalt Strike''
    or serial 146473198 — and maintain a JA4X allow/deny list of templated certificate structures ([Cobalt
    Strike YARA Signature Base, Roth](https://github.com/Neo23x0/signature-base/blob/master/yara/apt_cobaltstrike.yar);
    [JA4+ Network Fingerprinting Suite, FoxIO](https://github.com/FoxIO-LLC/ja4)). A positive result --
    a rule match, statistical outlier, or model alert -- indicates probable adversary certificate staging;
    pivot to the responsible internal host and process or installing account, the destination server''s
    IP, domain, and certificate hash/serial/issuer, the certificate''s validity window and CT status,
    and the volume and timing of connections to scope the activity and identify related infrastructure.
    A negative result helps rule out this particular facet of certificate staging but should be corroborated
    with the other questions in this playbook, since a single method can miss certificates hidden by TLS
    1.3/ECH, rotated indicators, or legitimately issued certificates abused for malicious sites.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network Egress/Ingress Points (Firewalls, Proxies)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'ssl.log JOIN x509.log ON cert_chain_fps JOIN conn.log ON uid

      | eval cert_sha=x509.fingerprint, serial=x509.serial, issuer=x509.certificate.issuer, subject=x509.certificate.subject,
      sni=ssl.server_name

      | lookup ioc_certs(cert_sha, serial, sni) OR issuer CONTAINS ''Major Cobalt Strike'' OR serial==''146473198''

      | lookup ct_monitor_absent(subject) for brand/lookalike domains

      | where match==true

      | alert priority=high'
- question: '[Resource Development] Using the ''Statistical (Rarity + volume enrichment)'' (Statistical
    Method) approach: can you determine whether an outbound SSL/TLS connection is established with a remote
    server whose certificate hash (SHA1/SHA256), serial number, Subject/Issuer fields, or JA4X certificate
    fingerprint matches a known-malicious indicator from a high-confidence threat intelligence feed, a
    Certificate Transparency monitor, or a default tooling certificate (e.g., the Cobalt Strike default
    self-signed certificate, serial 146473198).'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary installs SSL/TLS
    digital certificates on infrastructure they control or have compromised, enabling encrypted command-and-control
    or lending credibility to credential-harvesting and phishing sites. This evidence focuses on the condition
    that an outbound SSL/TLS connection is established with a remote server whose certificate hash (SHA1/SHA256),
    serial number, Subject/Issuer fields, or JA4X certificate fingerprint matches a known-malicious indicator
    from a high-confidence threat intelligence feed, a Certificate Transparency monitor, or a default
    tooling certificate (e.g., the Cobalt Strike default self-signed certificate, serial 146473198). This
    Statistical Method approach works as follows: For every IOC match, enrich with rarity and volume context
    from `conn.log`: historical connection frequency to the matched destination IP/domain over 90 days
    (flag bottom 1st percentile / first-seen), count of distinct internal hosts contacting it, total bytes
    sent vs received, and the JA3/JA4 client-fingerprint prevalence of the initiating host ([Tall Tales
    of Hunting with TLS/SSL Certificates, Kovar](https://www.splunk.com/en_us/blog/security/tall-tales-of-hunting-with-tls-ssl-certificates.html);
    [RITA, Active Countermeasures](https://github.com/activecm/rita); [JA3 TLS Client Fingerprinting,
    Salesforce](https://github.com/salesforce/ja3)). A match to a zero-history destination reached by
    a single host with a rare client fingerprint is highest severity. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable adversary certificate staging; pivot to
    the responsible internal host and process or installing account, the destination server''s IP, domain,
    and certificate hash/serial/issuer, the certificate''s validity window and CT status, and the volume
    and timing of connections to scope the activity and identify related infrastructure. A negative result
    helps rule out this particular facet of certificate staging but should be corroborated with the other
    questions in this playbook, since a single method can miss certificates hidden by TLS 1.3/ECH, rotated
    indicators, or legitimately issued certificates abused for malicious sites.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network Egress/Ingress Points (Firewalls, Proxies)'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'ioc_matches = x509.log JOIN ssl.log JOIN conn.log ON uid

      | stats by dest_ip,dest_domain: hist_freq_90d, distinct_internal_hosts, bytes_out, bytes_in, ja3_prevalence

      | eval rare = hist_freq_90d <= p1 OR first_seen==true

      | eval single_host = distinct_internal_hosts==1

      | eval rare_client = ja3_prevalence <= p1

      | where rare AND single_host AND rare_client

      | sort by severity desc'
- question: '[Resource Development] Using the ''Statistical (Failure-mode profiling)'' (Statistical Method)
    approach: can you determine whether an outbound SSL/TLS connection is established with a remote server
    whose certificate hash (SHA1/SHA256), serial number, Subject/Issuer fields, or JA4X certificate fingerprint
    matches a known-malicious indicator from a high-confidence threat intelligence feed, a Certificate
