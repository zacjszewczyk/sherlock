name: 'T1608.003: Install Digital Certificate'
id: a6776337-8423-437e-8df5-a461dfdf1ac4
description: 'This playbook helps an analyst investigate whether an adversary has installed SSL/TLS digital
  certificates on attacker-controlled or compromised infrastructure as part of Resource Development (MITRE
  ATT&CK T1608.003, Install Digital Certificate). Adversaries install certificates to encrypt command-and-control
  traffic (e.g., asymmetric cryptography over web protocols) or to lend credibility to credential-harvesting
  and phishing sites, staging the TLS material on acquired or compromised web and email servers. Because
  the certificate itself is observable when the staged server is contacted, the hunt is driven primarily
  by network-side certificate telemetry (Zeek ssl.log, x509.log, conn.log, dns.log) augmented by Certificate
  Transparency monitoring and threat intelligence, plus host-side evidence of certificate installation
  on corporate servers (Windows process-creation 4688, PowerShell script-block 4104, and service-install
  4697 events). It pursues the behavior from several complementary angles: outbound TLS sessions whose
  certificate hash, serial, subject/issuer, or JA4X fingerprint matches a known-malicious or default-tooling
  indicator (e.g., the Cobalt Strike default certificate); certificates with suspicious attributes such
  as typosquatted subjects, very short validity, free-CA issuance for newly registered domains, CN/SNI
  mismatch, or absence from Certificate Transparency; certificates that are statistical outliers against
  an enterprise-wide baseline of issuers, entropy, and feature distributions; single internal hosts beaconing
  to many distinct external destinations presenting suspicious certificates; and certificate-installation
  activity on servers outside change windows or by unexpected accounts and parent processes. Detection
  methods combine deterministic symbolic-logic rules (IOC and default-cert matching, free-CA/short-validity/CT-absence
  rules, first-seen issuer lookups, self-signed beaconing thresholds, certutil/PowerShell install-command
  rules), statistical baselining (rarity and volume enrichment, failure-mode profiling, typosquat Damerau-Levenshtein
  scoring, entropy and multivariate feature-distribution outliers, cadence/periodicity detection, behavioral
  install anomalies), and machine learning (explainable threat-feed scoring, supervised suspicious-certificate
  classification, Isolation Forest/autoencoder and SARIMA/Prophet anomaly detection, host-to-certificate
  graph community detection, encrypted-flow anomaly detection, and UEBA), so the analyst can corroborate
  suspected adversary certificate staging against certificate metadata, network cadence, destination rarity,
  and host install activity.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
