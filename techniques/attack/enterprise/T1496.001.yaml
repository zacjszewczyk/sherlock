    query: '# Mining-pool threat-intel and Stratum-port matching

      source IN [Zeek dns.log, Zeek conn.log, Windows Event ID 4688, Sysmon Event ID 1, Sysmon Event ID
      3, Sysmon Event ID 22]

      | WHERE matches_action_criteria("Mining-pool threat-intel and Stratum-port matching")

      // Continuously compare DNS queries (Zeek dns.log query) and outbound destination IPs (Zeek conn.log
      id.resp_h) against a frequently updated th

      | ALERT enrich(host, user, process, parent, hash, dest, asn, cpu)'
  - technology: Zeek/pseudocode
    query: '# Compute-hijack network correlation

