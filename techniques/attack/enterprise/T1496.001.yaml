name: 'T1496.001: Compute Hijacking'
id: cd1aff18-546f-490b-a409-6d5d64c9d188
description: 'This playbook helps an analyst investigate whether an adversary is hijacking the compute
  resources of co-opted systems -- endpoints, servers, cloud instances, and containers -- to run resource-intensive
  workloads such as cryptocurrency mining, degrading system and hosted-service availability under the
  Impact tactic. It guides the hunt across multiple, mutually corroborating behavioral angles spanning
  Windows, Linux, macOS, IaaS/cloud, and containerized environments: processes resolving or connecting
  to known cryptomining pool domains/IPs and canonical Stratum ports, or matching known miner-executable
  hashes; command-lines and PowerShell script blocks bearing pool URLs, wallet addresses, algorithm/threads
  flags, miner binary names (xmrig, cpuminer, kdevtmpfsi, kinsing, minerd), and the ''kill the competing
  miner'' signature; sustained near-saturation CPU utilization attributed to a single unsigned or unusually-pathed
  process; a stateful kill-chain of security-service disablement followed by suspicious execution, CPU
  spikes, and long-lived external connections; and resource-starvation instability where application-crash
  and service-termination bursts co-occur with high CPU. Detection methods combine symbolic-logic rules
  (threat-intel/IOC and Stratum matching, regex, stateful correlation), statistical baselining (DNS entropy
  and NXDOMAIN failure rates, periodic-heartbeat flow scoring, robust per-host CPU and Poisson failure-rate
  modeling, rolling host risk scoring), and machine learning (supervised flow classifiers, command-line
  embeddings, CPU/HPC time-series forecasting, provenance-graph/log-sequence and Bayesian-network models)
  applied to Zeek conn.log/dns.log, Windows Security/Sysmon events, PowerShell script-block logs, auditd,
  macOS unified logs, container runtime events, and cloud CloudTrail/CloudWatch telemetry, so the analyst
  can corroborate suspected compute hijacking against network, execution, resource-utilization, evasion,
  and instability context.'
type: technique
