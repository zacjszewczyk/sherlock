questions:
- question: '[Impact] Mining-pool threat-intel and Stratum-port matching: Can you determine whether a
    process initiates a network connection to a destination IP address or resolves a domain name present
    on a threat intelligence feed of known cryptocurrency mining pools. Alternatively, a process executes
    with a file hash matching a known cryptominer executable. -- specifically, using the ''Mining-pool
    threat-intel and Stratum-port matching'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary co-opts the compute resources
    of victim systems to run resource-intensive workloads (most often cryptocurrency mining), consuming
    CPU/GPU until machines slow, become unresponsive, or hosted services degrade -- leaving traces in
    network, process-execution, resource-utilization, evasion, and instability telemetry. This evidence
    focuses on the condition that a process initiates a network connection to a destination IP address
    or resolves a domain name present on a threat intelligence feed of known cryptocurrency mining pools.
    Alternatively, a process executes with a file hash matching a known cryptominer executable. This Symbolic
    Logic approach looks for the following signal: Continuously compare DNS queries (Zeek dns.log query)
    and outbound destination IPs (Zeek conn.log id.resp_h) against a frequently updated threat-intel feed
    of known cryptomining pool domains/IPs, and compare the file hash of every new process (Windows Event
    ID 4688 / Sysmon Event ID 1) against known miner-executable hashes. Additionally flag any outbound
    TCP connection to canonical Stratum ports (3333, 4444, 5555, 7777, 14444, 45700) or containing the
    literal ''stratum+tcp://'' / ''stratum+ssl://'' in payload/SNI. Generate a high-severity alert on
    any match and enrich with process name, hash, user, and destination ASN [Cryptomining Makes Noise,
    Caprolu et al](https://arxiv.org/abs/1910.09272); [Hildegard, Unit 42](https://unit42.paloaltonetworks.com/hildegard-malware-teamtnt/).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a process or instance
    is being driven to abnormal, sustained resource consumption consistent with compute hijacking rather
    than sanctioned heavy workloads; pivot to the responsible process and its lineage, the executing user/principal,
    the destination pool/ASN, the host''s CPU timeline, and any evasion (security-service stops, masquerading,
    competitor-miner kills) or availability impact (crashes, service terminations). A negative result
    helps rule out this hijacking vector but should be corroborated with the other questions in this playbook,
    since a single method can miss throttled, encrypted, or living-off-the-land mining.'
