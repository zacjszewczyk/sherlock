- question: '[Impact] DNS entropy + NXDOMAIN failure-rate and periodic-heartbeat flow outliers: Can you
    determine whether a process initiates a network connection to a destination IP address or resolves
    a domain name present on a threat intelligence feed of known cryptocurrency mining pools. Alternatively,
    a process executes with a file hash matching a known cryptominer executable. -- specifically, using
    the ''DNS entropy + NXDOMAIN failure-rate and periodic-heartbeat flow outliers'' (Statistical Method)
