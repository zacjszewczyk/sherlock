    Alternatively, a process executes with a file hash matching a known cryptominer executable. This Statistical
    Method approach looks for the following signal: From Zeek dns.log compute per-registered-domain subdomain
    entropy and flag the 95th-percentile tail (DGA/pool fluxing), and separately track each host''s NXDOMAIN
    rate per 10 min as a distinct failure-mode signal — domain-fluxing miners cycling dead pool domains
    produce NXDOMAIN bursts well above the host''s baseline [SoK Cryptojacking, Tekiner et al](https://arxiv.org/abs/2103.03851).
    In Zeek conn.log, score flows for the mining heartbeat signature: low bytes-per-flow with near-constant
    inter-arrival period and long duration (> 10 min); flag flows whose period coefficient-of-variation
    is low and duration is a high outlier. Correlate high-entropy domains with these long, low-volume
    periodic flows to raise confidence [Cryptomining Makes Noise, Caprolu et al](https://arxiv.org/abs/1910.09272).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a process or instance
    is being driven to abnormal, sustained resource consumption consistent with compute hijacking rather
    than sanctioned heavy workloads; pivot to the responsible process and its lineage, the executing user/principal,
    the destination pool/ASN, the host''s CPU timeline, and any evasion (security-service stops, masquerading,
    competitor-miner kills) or availability impact (crashes, service terminations). A negative result
    helps rule out this hijacking vector but should be corroborated with the other questions in this playbook,
