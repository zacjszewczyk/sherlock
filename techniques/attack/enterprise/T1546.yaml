name: 'T1546: Event Triggered Execution'
id: b16c4e0d-76cb-4fad-b8a5-0cc64eff75ca
description: 'This playbook helps an analyst investigate whether an adversary is abusing event-triggered
  execution mechanisms to maintain persistence and/or escalate privileges (MITRE ATT&CK T1546) across
  Windows, Linux, macOS, cloud (IaaS/SaaS), and Office Suite environments. It guides the hunt across multiple
  behavioral angles: creation or modification of autorun/event-trigger locations (Run/RunOnce keys, services,
  AppInit_DLLs, shell extensions, COM CLSID handlers, startup folders, Image File Execution Options, Winlogon
  Notify, SilentProcessExit) that point to rare, user-writable, or living-off-the-land binaries; WMI permanent
  event subscriptions (filter/consumer/binding) carrying high-entropy or interpreter-laden payloads; processes
  launched shortly after interactive logon that beacon to external infrastructure; high-privilege (NT
  AUTHORITY\SYSTEM) processes spawned by task-scheduler/service/WMI hosts that match malicious hashes,
  run from rare paths, spawn risky shells, or exploit unquoted-service-path and weak-ACL interception;
  and low-privilege trigger modifications that culminate in SYSTEM execution. Detection methods combine
  symbolic-logic rules, statistical baselining/entropy/beaconing analysis, and machine-learning models
  (Isolation Forest, Random Forest, LSTM sequence models, and provenance-graph IDS such as HOLMES, POIROT,
  UNICORN, and KAIROS) applied to Sysmon, Windows Security events, auditd, macOS unified logs, cloud audit
  logs (CloudTrail, m365 unified/office), and Zeek network telemetry, so the analyst can corroborate suspected
  event-triggered execution against trigger modification, process lineage, privilege context, and command-and-control
  activity.'
type: technique
