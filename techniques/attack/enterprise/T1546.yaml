questions:
- question: '[Persistence] Alert on malicious autorun changes: Can you determine whether a new or modified
    persistence trigger, such as a Run key, startup folder item, shell extension, or other autorun mechanism,
    points to an executable or script that is rare for the host, resides in a user-writable location,
    or is associated with a known malicious hash or command line. -- specifically, using the ''Alert on
    malicious autorun changes'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses event-triggered
    execution mechanisms (autorun/Run keys, services, WMI event subscriptions, scheduled tasks, launchd/cron/systemd
    timers, cloud functions, Office macros) so that malicious code runs automatically whenever a triggering
    event fires, granting persistent access and, when the trigger runs under SYSTEM/root or service accounts,
    privilege escalation. This evidence focuses on the condition that a new or modified persistence trigger,
    such as a Run key, startup folder item, shell extension, or other autorun mechanism, points to an
    executable or script that is rare for the host, resides in a user-writable location, or is associated
    with a known malicious hash or command line. This Symbolic Logic approach looks for the following
    signal: Continuously monitor Sysmon Event ID 13 and Windows Event ID 4657 for changes to the full
    inventory of autorun/event-trigger locations (Run, RunOnce, Services, AppInit_DLLs, shell extensions,
    COM CLSID handlers, startup folders) catalogued in [Hexacorn Beyond Good Ol'' Run Key](https://www.hexacorn.com/blog/2017/01/13/beyond-good-ol-run-key-part-55/).
    Resolve the referenced executable/script and alert when its command line matches a known living-off-the-land
    abuse pattern from [LOLBAS](https://lolbas-project.github.io/) (mshta, rundll32, regsvr32, wmic XSL,
    powershell -enc) or its hash matches threat intelligence. Treat repeated ACCESS_DENIED/failed write
    attempts (Failure Mode) on these keys as a distinct tampering signal. A positive result -- a rule
    match, statistical outlier, or model alert -- suggests an event trigger has been created or modified
    to launch attacker-controlled code; pivot to the modifying process and user, the referenced executable/script,
    its parent-child lineage, the privilege context it runs under, and any subsequent network or escalation
    activity. A negative result helps rule out this specific event-triggered-execution vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    fileless, or living-off-the-land persistence.'
  answer_sources: &id001
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - Windows Event ID 4657
  - Windows Event ID 4688
  - 'NAI: Windows Workstations, Windows Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Alert on malicious autorun changes

      source IN [Sysmon Event ID 1, Sysmon Event ID 11, Sysmon Event ID 13, Windows Event ID 4657, Windows
      Event ID 4688]

      | WHERE matches_action_criteria("Alert on malicious autorun changes")

      // Continuously monitor Sysmon Event ID 13 and Windows Event ID 4657 for changes to the full inventory
      of autorun/event-tri

      | ALERT enrich(host, user, process, parent, registry/file, trigger, dest)'
- question: '[Persistence] Baseline persistence rarity: Can you determine whether a new or modified persistence
    trigger, such as a Run key, startup folder item, shell extension, or other autorun mechanism, points
    to an executable or script that is rare for the host, resides in a user-writable location, or is associated
    with a known malicious hash or command line. -- specifically, using the ''Baseline persistence rarity''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses event-triggered
    execution mechanisms (autorun/Run keys, services, WMI event subscriptions, scheduled tasks, launchd/cron/systemd
    timers, cloud functions, Office macros) so that malicious code runs automatically whenever a triggering
    event fires, granting persistent access and, when the trigger runs under SYSTEM/root or service accounts,
    privilege escalation. This evidence focuses on the condition that a new or modified persistence trigger,
    such as a Run key, startup folder item, shell extension, or other autorun mechanism, points to an
    executable or script that is rare for the host, resides in a user-writable location, or is associated
    with a known malicious hash or command line. This Statistical Method approach looks for the following
    signal: Build host- and peer-group baselines for autorun locations, referenced file paths, and parent-child
    process relationships. Alert when a persistence artifact falls below the 5th percentile of prevalence
    (Volume/rarity), appears in a user-writable path, or when the Shannon entropy of its command line
    exceeds the benign 95th percentile (encoded payloads typically exceed 7.2 per [Lyda & Hamrock entropy
    analysis](https://ieeexplore.ieee.org/document/4140989)). Track Frequency (autorun-key writes per
    host per hour) and flag bursts above 3 standard deviations. A positive result -- a rule match, statistical
    outlier, or model alert -- suggests an event trigger has been created or modified to launch attacker-controlled
    code; pivot to the modifying process and user, the referenced executable/script, its parent-child
    lineage, the privilege context it runs under, and any subsequent network or escalation activity. A
    negative result helps rule out this specific event-triggered-execution vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, fileless, or living-off-the-land
    persistence.'
  answer_sources: *id001
  range: Last 90 days (baseline 30+ days; evaluate per-hour/day windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Baseline persistence rarity

      source IN [Sysmon Event ID 1, Sysmon Event ID 11, Sysmon Event ID 13, Windows Event ID 4657, Windows
      Event ID 4688]

      | STATS baseline over 30d per (host, trigger/process)

      | COMPUTE deviation (z-score / percentile / entropy / change-point)

