    unsigned firmware-update binary fails code-integrity validation. This Machine Learning approach looks
    for the following signal: Score unknown executables/transfers with an unsupervised Isolation Forest
    over features from process creation (Event ID 4688) and file transfers (Zeek files.log) — file size,
    MIME type, entropy, parent/child image, user context, integrity level, signing status, source/destination
    reputation — to isolate rare firmware-utility events without labels; surface the top-3 contributing
    features in the alert text rather than only a score [Isolation Forest, Liu Ting and Zhou](https://doi.org/10.1145/2133360.2133363);
    [Explainable Anomaly Detection for Industrial Control System Cybersecurity](https://arxiv.org/abs/2205.01930).
    A positive result -- a model anomaly score above threshold -- indicates rare firmware-utility executions,
    anomalous command/flow sequences, or out-of-distribution boot/firmware log chains; review the surfaced
    top-contributing features, then pivot to the host/device, account, parent process, firmware image/interface,
    and any boot-integrity failure or unexpected reboot. A negative result helps rule out this firmware-corruption
    vector for the observed scope but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, out-of-band, or low-and-slow firmware tampering -- and because
