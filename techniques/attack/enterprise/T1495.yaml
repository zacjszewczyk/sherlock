- question: '[Impact] Measure entropy and similarity of transferred firmware (Volume): Can you determine
    whether a file transfer or process/driver-load event is observed containing a file hash, filename,
    or low-level raw-access driver associated with firmware modification (e.g., flashrom, fwupd, Lojax/RwDrv.sys,
