- question: '[Impact] Cluster shutdowns spatially and temporally: Can you determine whether a sharp, statistically
    significant increase in unexpected system reboots or crashes is observed across multiple systems,
    which is not attributable to any scheduled maintenance or authorized change request. -- specifically,
    using the ''Cluster shutdowns spatially and temporally'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary corrupts or overwrites BIOS/UEFI
    or device firmware to render systems or network devices inoperable, denying availability and sometimes
    destroying data. This evidence focuses on the condition that a sharp, statistically significant increase
    in unexpected system reboots or crashes is observed across multiple systems, which is not attributable
    to any scheduled maintenance or authorized change request. This Machine Learning approach looks for
    the following signal: Use ST-DBSCAN over reboot/shutdown timestamps and /24 subnets to flag dense
    clusters indicating coordinated firmware corruption, and Isolation Forest to score hosts whose reboot
    cadence becomes an outlier, surfacing the contributing features (subnet, time window, event mix) in
    the alert [Isolation Forest, Liu Ting and Zhou](https://doi.org/10.1145/2133360.2133363); [Explainable
    Anomaly Detection for Industrial Control System Cybersecurity](https://arxiv.org/abs/2205.01930).
    A positive result -- a model anomaly score above threshold -- indicates rare firmware-utility executions,
    anomalous command/flow sequences, or out-of-distribution boot/firmware log chains; review the surfaced
    top-contributing features, then pivot to the host/device, account, parent process, firmware image/interface,
    and any boot-integrity failure or unexpected reboot. A negative result helps rule out this firmware-corruption
    vector for the observed scope but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, out-of-band, or low-and-slow firmware tampering -- and because
    a corrupted host cannot be trusted to report its own state, prefer out-of-band Root-of-Trust corroboration
    where available.'
  answer_sources: *id005
  range: Last 90 days (train on 30-90 day history; score rolling windows)
  queries:
  - technology: SIEM/ML pseudocode
    query: '# Cluster shutdowns spatially and temporally

      source IN [Windows Event ID 1074, Windows Event ID 6005, Windows Event ID 6006, Windows Event ID
      41]

      | FEATURIZE events (process/parent/cmd/entropy/signing/flow/boot-sequence features)

      | SCORE model.predict(features)

      // Use ST-DBSCAN over reboot/shutdown timestamps and /24 subnets to flag dense clusters indicating
      coordinated firmware cor

      | WHERE score > threshold | ALERT with top-3 feature attribution'
