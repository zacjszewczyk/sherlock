name: 'T1495: Firmware Corruption'
id: 7d880e57-ff4a-41a1-9e95-9b87eb04f4da
description: 'This playbook helps an analyst investigate whether an adversary has impacted system or device
  availability by corrupting BIOS/UEFI or device firmware (T1495) under the Impact tactic, rendering hosts
  or network devices inoperable or unbootable and potentially destroying data. It guides the hunt across
  several behavioral angles spanning Windows, Linux, macOS, and network devices: execution or transfer
  of known firmware-modification and low-level flash-access tooling matched by hash/name (flashrom, CHIPSEC,
  fwupd, Lojax/RwDrv.sys, TrickBoot, MosaicRegressor); unsigned/failed-validation drivers and firmware
  binaries via Windows CodeIntegrity events (3004/3033/3037/3077) and Sysmon driver loads; verification
  of firmware images against signed golden measurements and entropy/ssdeep similarity; anomalous firmware-utility
  command lines, raw firmware-interface writes (/dev/mem, /sys/firmware/efi/efivars, EFI System Partition)
  outside maintenance windows, and Secure-Boot/signature downgrades (bcdedit tampering, MOK enrollment);
  correlation of firmware kill-chain sequences (reconnaissance -> tool acquisition -> privileged execution
  -> unexpected shutdown/boot-integrity failure); anomalous traffic to network-device management interfaces
  with high-volume firmware uploads via TFTP/FTP/SCP/web UI and post-update behavioral change; and fleet-wide
  bursts of unexpected reboots or crashes not tied to change management. Detection methods combine symbolic-logic
  rules, statistical baselining (entropy, Levenshtein, moving-average, Bayesian new-edge), and machine-learning
  models (Isolation Forest, DBSCAN/ST-DBSCAN, LSTM/DeepLog, CNN/RNN telemetry models) applied to Windows
  Security/Sysmon/CodeIntegrity/Kernel-Boot events, auditd, macOS unified logs, Zeek conn/files logs,
  NSM flow, and network-device firmware telemetry, so the analyst can corroborate suspected firmware corruption
  across host, network, and out-of-band Root-of-Trust evidence.'
type: technique
