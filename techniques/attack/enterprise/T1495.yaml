questions:
- question: '[Impact] Match firmware tool executions to TI: Can you determine whether a file transfer
    or process/driver-load event is observed containing a file hash, filename, or low-level raw-access
    driver associated with firmware modification (e.g., flashrom, fwupd, Lojax/RwDrv.sys, TrickBoot, MosaicRegressor),
    or an unsigned firmware-update binary fails code-integrity validation. -- specifically, using the
    ''Match firmware tool executions to TI'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary corrupts or overwrites BIOS/UEFI
    or device firmware to render systems or network devices inoperable, denying availability and sometimes
    destroying data. This evidence focuses on the condition that a file transfer or process/driver-load
    event is observed containing a file hash, filename, or low-level raw-access driver associated with
    firmware modification (e.g., flashrom, fwupd, Lojax/RwDrv.sys, TrickBoot, MosaicRegressor), or an
    unsigned firmware-update binary fails code-integrity validation. This Symbolic Logic approach looks
    for the following signal: Generate an alert when a file hash (MD5/SHA1/SHA256) in Zeek files.log or
    a process/image hash from Windows Event ID 4688 / Sysmon EID 1 matches a maintained list of known
    firmware modification tools and low-level flash-access utilities (e.g., flashrom, CHIPSEC, Lojax,
    TrickBoot, MosaicRegressor); record host, NAI, and file metadata in the firmware-integrity tracking
    table for triage [LoJax: First UEFI Rootkit Found in the Wild, ESET](https://www.welivesecurity.com/2018/09/27/lojax-first-uefi-rootkit-found-wild-courtesy-sednit-group/).
    A positive result -- a deterministic rule match -- indicates firmware/flash tooling, raw firmware-interface
    access, signature/boot-integrity failures, or anomalous management-plane activity consistent with
    firmware corruption; pivot to the responsible host/device, the executing account and parent process,
    the firmware image or interface touched, and any subsequent boot-integrity failure or unexpected reboot.
    A negative result helps rule out this firmware-corruption vector for the observed scope but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    out-of-band, or low-and-slow firmware tampering -- and because a corrupted host cannot be trusted
    to report its own state, prefer out-of-band Root-of-Trust corroboration where available.'
