  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary corrupts or overwrites BIOS/UEFI
    or device firmware to render systems or network devices inoperable, denying availability and sometimes
    destroying data. This evidence focuses on the condition that a file transfer or process/driver-load
    event is observed containing a file hash, filename, or low-level raw-access driver associated with
    firmware modification (e.g., flashrom, fwupd, Lojax/RwDrv.sys, TrickBoot, MosaicRegressor), or an
    unsigned firmware-update binary fails code-integrity validation. This Statistical Method approach
    looks for the following signal: For executable/firmware files transferred over the network (Zeek files.log),
    compute Shannon entropy and exact + fuzzy (ssdeep) hashes; alert when entropy exceeds ~7.9 bits/byte
    (packed/encrypted blob) or when the image fails ssdeep similarity to the known-good golden image for
    that device model, and baseline transfer byte volume per model flagging sizes outside the expected
    firmware-image range [A Large-Scale Analysis of the Security of Embedded Firmwares, Costin et al](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf).
    Derive dataset-specific entropy/size thresholds from a corpus of legitimate vendor images. A positive
    result -- a statistical outlier against the established baseline -- indicates volumes, timings, command-line
    patterns, or reboot/transfer rates departing from normal, predictable firmware-maintenance behavior;
    pivot to the host/device, the account and parent process, the firmware image or interface, and corroborating
    boot-integrity or shutdown events. A negative result helps rule out this firmware-corruption vector
    for the observed scope but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, out-of-band, or low-and-slow firmware tampering -- and because
    a corrupted host cannot be trusted to report its own state, prefer out-of-band Root-of-Trust corroboration
    where available.'
