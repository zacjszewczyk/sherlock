name: 'T1010: Application Window Discovery'
id: c6ceeb6b-a7f3-4443-8883-8c7557fa426b
description: 'Investigate adversary attempts to enumerate open application windows (MITRE ATT&CK T1010)
  on Windows, Linux, and macOS endpoints. Window listings reveal how a system is used and help an adversary
  identify data worth collecting and security tooling to evade. This playbook helps an analyst hunt for:
  execution of known window-discovery tooling matched by file hash to threat intelligence; command-line
  and PowerShell script blocks containing window/process enumeration strings (tasklist /v, Get-Process
  MainWindowTitle, GetForegroundWindow, GetWindowText); common discovery utilities spawned from unusual
  parents (Office apps, browsers, web servers) or by service accounts outside maintenance windows; application-window
  discovery occurring in sequence with collection, credential access, or exfiltration on the same host;
  obfuscated PowerShell using .NET/Win32 API calls (EnumWindows) to enumerate windows; Linux X11 window
  utilities (xdotool, wmctrl, xwininfo, xprop); and macOS window enumeration via AppleScript, CGWindowListCopyWindowInfo,
  or NSRunningApplication. Each question pairs symbolic-logic, statistical, and machine-learning approaches
  so the analyst can detect both commodity and sophisticated reconnaissance behavior.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a process execute whose file hash (SHA256/MD5), or whose transferred-file hash on the
    wire, exactly matches a threat-intelligence entry for tooling known to perform application window
    discovery (e.g., DarkWatchman, Grandoreiro, Cobalt Strike)?
  context: 'In the Discovery tactic an adversary enumerates open windows to learn how a host is used and
    what security tooling is present. A direct hash match against a curated watchlist of window-discovery
    tooling is the highest-confidence lead: continuously compare SHA256/MD5 values from Windows 4688,
    Sysmon ID 1, and Zeek files.log against the watchlist and alert on any exact match. A positive result
    strongly implies known malicious tooling is resident; a negative result does not clear the host because
    actors recompile and repack binaries, so pair this with prevalence and behavioral methods.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek files.log
  - 'NAI: Enterprise endpoints (workstations, servers) with process creation logging; network egress points
    monitoring file transfers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'exec = UNION(Event4688, SysmonID1, ZeekFilesLog)

      ALERT WHERE exec.sha256 IN ioc_watchlist OR exec.md5 IN ioc_watchlist'
- question: Among recently executed binaries, which file hashes are exceptionally rare across the fleet
    (seen on <0.1% of hosts) or first-seen within the last 24 hours, especially when spawned by anomalous
    parents such as winword.exe or powershell.exe?
  context: Rarity and novelty are proxies for malicious recon tooling that has not yet been catalogued
    by intel. Compute each hash's 30-day fleet prevalence and first-seen age, flag hashes on under 0.1%
    of hosts or younger than 24h, and prioritize those with Office/script parents. Derive the percentile
    cutoff from your own host count. A rare hash with a suspicious parent warrants triage; a common, long-lived
    hash is likely benign.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek files.log
  - 'NAI: Enterprise endpoints (workstations, servers) with process creation logging; network egress points
    monitoring file transfers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "prev = COUNT_DISTINCT(host) BY hash OVER 30d\npct = prev / total_hosts\nALERT WHERE pct <\
      \ 0.001 OR first_seen_age < 24h\n  AND parent IN [winword.exe, powershell.exe, excel.exe, outlook.exe]"
- question: Does an unsupervised provenance/feature anomaly model score a process execution above the
    99th percentile based on parent process, command line, hash prevalence, signer, and name features?
  context: Hash and rarity rules miss novel or signed tooling. An unsupervised node-level anomaly model
    (ThreaTrace-style) scores each execution on combined features and surfaces the top-3 contributing
    features (e.g., parent=winword.exe, hash prevalence=0.02%, unsigned). Alert above the 99th percentile
    and use the explanation to speed triage. High scores indicate behaviorally anomalous execution consistent
    with discovery tooling.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek files.log
  - 'NAI: Enterprise endpoints (workstations, servers) with process creation logging; network egress points
    monitoring file transfers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'score = AnomalyModel(parent, cmdline, hash_prevalence, signer, name)

      ALERT WHERE score > p99 EMIT top3_features'
- question: Does a process command line (Event ID 4688) or PowerShell script block (Event ID 4104) contain
    window/process-enumeration strings such as 'tasklist /v', 'Get-Process ... MainWindowTitle', 'GetForegroundWindow',
    or 'GetWindowText'?
  context: Adversaries abuse native features to list windows. Scan 4688 and 4104 for regexes matching
    window/process discovery commands and escalate when the parent is an Office app, web server, or unsigned
    binary. A match from a normal admin session may be benign; the same string from outlook.exe or a web-server
    worker process is a strong Discovery signal.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All endpoints and servers with command-line and PowerShell script block logging enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "events = UNION(Event4688, Event4104)\nALERT WHERE events.text MATCHES /tasklist\\s+\\/v|Get-Process.*MainWindowTitle|GetForegroundWindow|GetWindowText/i\n\
      \  AND parent IN [office_apps, web_servers, unsigned_binaries]"
- question: Has a user-host pair executed known window/process-discovery utilities at a rate exceeding
    its 30-day baseline (mean+3 sigma), or has a service/non-interactive account run them for the first
    time ever?
  context: Discovery commands are noisy among admins but anomalous for most accounts. Baseline each user-host
    pair's hourly count over 30 days and flag hours above mean+3 sigma, plus any first-ever use by a service
    or non-interactive account. Calibrate thresholds from fleet inventory. Spikes or never-before-seen
    usage by automation accounts are the strongest leads.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All endpoints and servers with command-line and PowerShell script block logging enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = MEAN+3*STD of hourly_count BY user_host OVER 30d\nALERT WHERE hourly_count > base\n\
      \  OR (account_type IN [service, non_interactive] AND first_seen=true)"
- question: Is a single process producing a burst of failed or empty enumeration results (e.g., tasklist
    returning no rows, GetWindowText returning 0, access-denied) within a short window?
  context: Track State by profiling discovery commands that return access-denied or empty output. A burst
    of failed enumerations from one process is a distinct recon signal, often from headless or low-privilege
    contexts probing the environment. Correlate the failing process with subsequent activity; repeated
    failures followed by a success indicate active orientation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All endpoints and servers with command-line and PowerShell script block logging enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fails = FILTER discovery_cmds WHERE result IN [access_denied, empty, exit!=0]

      ALERT WHERE COUNT(fails) BY process OVER 5m > threshold'
- question: Does an LDA topic model assign a PowerShell script block (Event ID 4104) to a rare discovery-oriented
    behavioral topic when run from a non-admin or non-interactive context?
  context: Apply LDA to 4104 script blocks to assign behavioral topics and alert when a script falls into
    a rare discovery topic from a non-admin/non-interactive context, surfacing the top-3 topic-defining
    tokens. For obfuscated scripts, use AMSI post-deobfuscation content and contextual embeddings. A rare
    discovery topic from an unexpected account is a high-value lead even when individual tokens evade
    regex.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All endpoints and servers with command-line and PowerShell script block logging enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "topic = LDA(scriptblock_4104)\nALERT WHERE topic IN rare_discovery_topics\n  AND context IN\
      \ [non_admin, non_interactive] EMIT top3_tokens"
- question: Was a common discovery utility (e.g., tasklist.exe) executed via a parent-child chain that
    is NOT in a vetted allowlist (e.g., explorer.exe -> cmd.exe -> tasklist.exe), particularly with Office,
    browser, or web-server parents?
  context: Legitimate discovery follows predictable lineage. Alert on discovery utilities in 4688/Sysmon
    ID 1 whose parent-child chains are not in a vetted allowlist, prioritizing Office/browser/web-server
    parents as high-risk. winword.exe spawning tasklist.exe is a classic post-exploitation pattern; allowlisting
    reduces false positives from legitimate admin chains.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: All endpoints and servers, particularly Domain Controllers and application servers, with parent-child
    process logging enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "exec = FILTER UNION(Event4688, SysmonID1) WHERE child IN discovery_utils\nALERT WHERE (parent->child)\
      \ NOT IN allowlist\n  PRIORITIZE parent IN [office, browser, web_server]"
- question: Which parent-child process pairs involving discovery utilities fall in the bottom 1st percentile
    of frequency across the fleet over the last 30 days?
  context: Rare lineage is suspicious even without an explicit allowlist. Track parent-child pair frequency
    over 30 days and flag pairs in the bottom 1st percentile, deriving the rarity cutoff from per-host
    and fleet counts. A statistically rare pair like winword.exe -> tasklist.exe surfaces unexpected execution
    chains that signature rules miss.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: All endpoints and servers, particularly Domain Controllers and application servers, with parent-child
    process logging enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'freq = COUNT(parent_child_pair) OVER 30d

      ALERT WHERE percentile_rank(freq) < 0.01 AND child IN discovery_utils'
- question: Does a process-lineage provenance graph anomaly detector assign a high score to a new edge
    that invokes a discovery utility (e.g., winword.exe -> tasklist.exe)?
  context: Build a process-lineage provenance graph and score new edges with a graph anomaly detector
    (KAIROS/ThreaTrace), flagging high-scoring edges and reporting the top-3 contributing edge/node features.
    This captures structurally anomalous execution that point statistics on a single pair would miss,
    and the feature explanation accelerates triage.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: All endpoints and servers, particularly Domain Controllers and application servers, with parent-child
    process logging enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'graph = BUILD_PROVENANCE(process_lineage)

      score = GraphAnomaly(new_edges)

      ALERT WHERE score > threshold AND child IN discovery_utils EMIT top3_features'
- question: Was a T1010 application-window discovery indicator followed within 10 minutes by collection,
    credential-access, or exfiltration activity on the same host (e.g., 7z.exe, LSASS access via Event
    4663, outbound connection to a low-reputation IP)?
  context: Discovery is rarely the end goal; it precedes objective actions. Alert when a T1010 indicator
    is followed within 10 minutes by Collection/Credential/Exfiltration indicators on the same host. This
    chaining converts a low-severity recon hit into a high-confidence intrusion signal, reflecting the
    post-discovery objective chaining documented for T1010.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Critical servers and user endpoints with comprehensive host logging; network gateways and VPN
    concentrators with traffic logging.'
  range: Last 90 days, correlate events within a 10-minute window on the same host.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'disc = FILTER events WHERE technique=T1010

      follow = FILTER events WHERE technique IN [T1560.001, T1003, T1071]

      ALERT WHERE follow.host=disc.host AND follow.time - disc.time <= 10m'
- question: Do the time deltas between Discovery and subsequent Collection/Exfiltration techniques on
    a host fall within the fastest 5th percentile, and are there corroborating failed/blocked outbound
    connection attempts?
  context: Model technique-to-technique time deltas and flag Discovery->Collection sequences whose delta
    falls in the fastest 5th percentile; very fast transitions suggest scripted, automated tradecraft.
    Also count outbound connection State (failed/blocked egress) as a corroborating signal. Rapid recon-to-action
    timing combined with blocked egress strongly indicates an active operation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Critical servers and user endpoints with comprehensive host logging; network gateways and VPN
    concentrators with traffic logging.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "delta = time(collection) - time(discovery) BY host\nALERT WHERE percentile_rank(delta) < 0.05\n\
      \  CORROBORATE blocked_egress_count > 0"
- question: Does an HMM/RNN sequence model trained on tagged ATT&CK event sequences flag a high-probability
    Discovery->Collection/Exfiltration transition for a single host?
  context: Train an HMM/RNN on tagged ATT&CK event sequences and trigger critical alerts on high-probability
    Discovery->Collection/Exfiltration transitions for a single host; apply path-based causal scoring
    (Hopper) and surface the top-3 sequence steps driving the score. Sequence models capture multi-step
    intrusion narratives that single-event rules cannot, reducing alert fatigue while catching staged
    operations.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Critical servers and user endpoints with comprehensive host logging; network gateways and VPN
    concentrators with traffic logging.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = ORDER events BY time PER host

      score = SequenceModel(seq)  # HMM/RNN on ATT&CK tags

      ALERT WHERE P(Discovery->Collection|Exfil) > threshold EMIT top3_steps'
- question: Does a PowerShell script block (Event ID 4104) reference window-enumeration Win32/.NET APIs
    (EnumWindows, GetWindowText, GetForegroundWindow) alongside obfuscation tokens such as FromBase64String,
    -join, [char], or format operators?
  context: Sophisticated actors avoid command-line tools by calling APIs directly via Add-Type. Scan 4104
    script blocks for these API references co-occurring with obfuscation tokens and alert on co-occurrence.
    The combination of low-level window APIs and obfuscation is far more suspicious than either alone,
    indicating deliberate evasion of signature detection.
  answer_sources:
  - Windows Event ID 4104
  - 'NAI: All endpoints and servers with PowerShell v5+ and module/script block logging enabled, especially
    those used by administrators and developers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'sb = Event4104.scriptblock

      api = sb MATCHES /EnumWindows|GetWindowText|GetForegroundWindow/

      obf = sb MATCHES /FromBase64String|-join|\[char\]|-f /

      ALERT WHERE api AND obf'
- question: Does a PowerShell script block exceed the 98th percentile on two or more obfuscation metrics
    (character entropy, KL-divergence from normal PowerShell letter frequency, non-alphanumeric ratio)?
  context: Baseline character entropy, KL-divergence from a normal PowerShell letter-frequency distribution,
    and non-alphanumeric ratio per script block, flagging those above the 98th percentile on two or more
    metrics. Heavily obfuscated script content is a hallmark of evasion; requiring two metrics reduces
    false positives from legitimately dense scripts. Pair with API/regex hits for high confidence.
  answer_sources:
  - Windows Event ID 4104
  - 'NAI: All endpoints and servers with PowerShell v5+ and module/script block logging enabled, especially
    those used by administrators and developers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'metrics = {entropy, kl_div, non_alnum_ratio}(scriptblock)

      ALERT WHERE COUNT(m > p98 for m in metrics) >= 2'
- question: Does a contextual-embedding PowerShell classifier (trained on labeled benign/malicious scripts,
    using AMSI/4104 content) score a script block as malicious with confidence above 0.95?
  context: Score AMSI/4104 script content with a contextual-embedding classifier trained on labeled benign/malicious
    PowerShell, alerting when confidence >0.95 and emitting the top-3 contributing tokens/features. This
    catches semantically malicious scripts that evade regex and entropy heuristics, especially after AMSI
    deobfuscation reveals true intent.
  answer_sources:
  - Windows Event ID 4104
  - 'NAI: All endpoints and servers with PowerShell v5+ and module/script block logging enabled, especially
    those used by administrators and developers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'conf = PSClassifier(amsi_content OR scriptblock_4104)

      ALERT WHERE conf > 0.95 EMIT top3_tokens'
- question: Did auditd record EXECVE of an X11 window utility (xdotool, wmctrl, xwininfo, xprop) with
    window-listing arguments (e.g., 'wmctrl -l', 'xdotool search'), especially from a shell script, web-server,
    or service account?
  context: On Linux, adversaries enumerate GUI windows with X11 utilities. Alert on auditd EXECVE of these
    tools with window-listing arguments, especially from shell scripts, web-server, or service accounts.
    Interactive desktop users running wmctrl may be benign; the same tool invoked by a daemon or web process
    is a strong Discovery signal on multi-user/RDP/X11 hosts.
  answer_sources:
  - auditd:EXECVE
  - linux:syslog
  - 'NAI: Linux workstations and multi-user/RDP/X11 hosts with auditd execve logging enabled.'
  range: Last 90 days
  queries:
  - technology: auditd/Rule pseudocode
    query: "ALERT WHERE execve.comm IN [xdotool, wmctrl, xwininfo, xprop]\n  AND execve.args MATCHES /-l|search|-root|list/\n\
      \  AND uid IN [service_accounts] OR parent IN [shell_script, web_server]"
- question: Is an X11 window utility being used for the first time on a host, or on a host that is among
    the rarest <0.5% of the fleet to run it, and are there failed invocations ('Can't open display', non-zero
    exit) indicating headless reconnaissance?
  context: Baseline per-host 30-day frequency of these utilities and flag first-time use or rare hosts
    (<0.5% of fleet); count failed invocations (no X display, exit!=0) as a distinct State signal of headless
    recon. An adversary running window tools on a server with no display generates display-open failures
    that betray automated reconnaissance.
  answer_sources:
  - auditd:EXECVE
  - linux:syslog
  - 'NAI: Linux workstations and multi-user/RDP/X11 hosts with auditd execve logging enabled.'
  range: Last 90 days
  queries:
  - technology: auditd/Stats pseudocode
    query: "freq = COUNT(host) BY utility OVER 30d\nALERT WHERE first_seen OR percentile_rank(host_freq)\
      \ < 0.005\n  OR result MATCHES /Can't open display|exit!=0/"
- question: Does a Linux provenance-graph anomaly model flag an anomalous node or edge that invokes an
    X11 window utility?
  context: Score Linux process lineage with a provenance graph anomaly model and flag anomalous nodes/edges
    invoking window utilities, reporting the top-3 contributing features. This catches structurally unusual
    invocations (e.g., a web service spawning wmctrl) that prevalence baselines may miss, with feature
    explanations to speed analyst triage.
  answer_sources:
  - auditd:EXECVE
  - linux:syslog
  - 'NAI: Linux workstations and multi-user/RDP/X11 hosts with auditd execve logging enabled.'
  range: Last 90 days
  queries:
  - technology: auditd/ML pseudocode
    query: 'graph = BUILD_PROVENANCE(linux_process_lineage)

      score = GraphAnomaly(nodes, edges)

      ALERT WHERE score > threshold AND involves(x11_window_utils) EMIT top3_features'
- question: Did osquery or the macOS unified log show osascript invoking 'System Events ... windows',
    or a process calling CGWindowListCopyWindowInfo / NSRunningApplication, particularly when parented
    by a non-interactive or recently-downloaded binary?
  context: On macOS, adversaries list windows via AppleScript or window-info APIs. Alert on unified-log/osquery
    evidence of osascript enumerating windows or processes calling CGWindowListCopyWindowInfo/NSRunningApplication,
    especially from non-interactive or recently-downloaded parents. Legitimate automation tools use these
    APIs, so the parent provenance is the key discriminator.
  answer_sources:
  - macos:unifiedlog
  - macos:osquery process_events
  - 'NAI: macOS endpoints with unified logging and osquery process_events collection enabled.'
  range: Last 90 days
  queries:
  - technology: osquery/Rule pseudocode
    query: "ALERT WHERE (proc=osascript AND args MATCHES /System Events.*windows/)\n  OR api IN [CGWindowListCopyWindowInfo,\
      \ NSRunningApplication]\n  AND parent IN [non_interactive, recently_downloaded]"
- question: Is a macOS window-enumeration API or utility being used rarely or for the first time on a
    host, or invoked under an unusual code signer / Team ID?
  context: Baseline per-host 30-day frequency of these API/utility calls and flag rare or first-seen usage
    and unusual signer/Team IDs. Deriving cutoffs from fleet inventory, rare usage combined with an unexpected
    or absent Team ID points to unsigned or repurposed tooling performing reconnaissance.
  answer_sources:
  - macos:unifiedlog
  - macos:osquery process_events
  - 'NAI: macOS endpoints with unified logging and osquery process_events collection enabled.'
  range: Last 90 days
  queries:
  - technology: osquery/Stats pseudocode
    query: 'freq = COUNT(host) BY api_or_utility OVER 30d

      ALERT WHERE first_seen OR rare_host OR team_id NOT IN known_signers'
- question: Does a log-sequence anomaly detector flag macOS window-enumeration appearing in an unexpected
    position within the sequence of OS API/process events?
  context: 'Model the sequence of OS API/process events with a log-sequence anomaly detector (DeepLog-style)
    and alert when window-enumeration appears in an unexpected sequence position, surfacing the top-3
    preceding events. Context matters: window enumeration immediately after a download or before a network
    connection is more suspicious than the same call in a routine automation flow.'
  answer_sources:
  - macos:unifiedlog
  - macos:osquery process_events
  - 'NAI: macOS endpoints with unified logging and osquery process_events collection enabled.'
  range: Last 90 days
  queries:
  - technology: osquery/ML pseudocode
    query: 'seq = ORDER os_api_events BY time PER host

      score = LogSequenceModel(seq)

      ALERT WHERE window_enum in unexpected_position EMIT top3_preceding'
