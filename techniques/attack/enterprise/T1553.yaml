questions:
- question: '[Defense Impairment] Join process/cert logs against known-bad signer deny-lists (Symbolic
    Logic): Can you determine whether a process executes a binary signed by a certificate whose thumbprint
    or issuer matches a known-bad entry in a threat intelligence feed, or a new certificate is added to
    a trust store that matches a known-bad thumbprint. -- specifically, using the ''Join process/cert
    logs against known-bad signer deny-lists'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic, an adversary subverts trust controls
    to make malicious code appear trusted or to suppress warnings so untrusted programs run -- degrading
    defenders'' ability to detect, interpret, and respond to the activity. This evidence focuses on the
    condition that a process executes a binary signed by a certificate whose thumbprint or issuer matches
    a known-bad entry in a threat intelligence feed, or a new certificate is added to a trust store that
    matches a known-bad thumbprint. This Symbolic Logic approach works as follows: Join process creation
    events (Windows Event ID 4688, Sysmon Event ID 1) and network certificate logs (Zeek x509.log) against
    a threat-intelligence feed of known-malicious certificate thumbprints, serials, and issuers, and against
    curated signer deny-lists for abused code-signing certificates and BYOVD drivers ([LOLDrivers](https://www.loldrivers.io/);
    [Microsoft Recommended Driver Block Rules](https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/design/microsoft-recommended-driver-block-rules);
    abused-certificate corpus in [Certified Malware, Kim et al.](http://www.umiacs.umd.edu/~tdumitra/papers/CCS-2017.pdf)).
    Alert on any thumbprint/serial/issuer match, and on any new certificate added to a Root/AuthRoot store
    that matches a known-bad entry. A positive result -- a rule match, statistical outlier, or model alert
    -- indicates probable subversion of trust controls; pivot to the responsible process and its parent
    lineage, the user and host context, the certificate thumbprint/issuer/serial or registry key involved,
    the source of any downloaded certificate or payload, and any subsequent execution that the bypass
    enabled. A negative result helps rule out this particular trust-subversion vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, living-off-the-land,
    or novel evasions.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek x509.log
  - 'NAI: All Endpoints and Servers, Network Egress/Ingress Points, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index IN (wineventlog:security EventCode=4688, sysmon EventCode=1)\n| eval thumb=coalesce(Signature_Thumbprint,\
      \ Hashes)\n| lookup ti_known_bad_certs thumbprint AS thumb, issuer AS Signer, serial AS SerialNumber\
      \ OUTPUT verdict\n| append [ search index=zeek sourcetype=zeek_x509\n          | lookup ti_known_bad_certs\
      \ thumbprint AS certificate.fingerprint, issuer AS certificate.issuer OUTPUT verdict ]\n| append\
      \ [ search index=wineventlog:security EventCode=4657\n          ObjectName=\"*\\\\SystemCertificates\\\
      \\Root*\" OR ObjectName=\"*\\\\SystemCertificates\\\\AuthRoot*\"\n          | lookup ti_known_bad_certs\
      \ thumbprint AS NewValue OUTPUT verdict ]\n| where isnotnull(verdict)\n| table _time host user process\
      \ thumb Signer verdict"
  - technology: Zeek/pseudocode
    query: 'x509.log

      | join (loldrivers_and_known_bad_signers) ON certificate.fingerprint OR certificate.issuer OR certificate.serial

      | alert match -> {ts, id.orig_h, certificate.subject, certificate.issuer, fingerprint}'
- question: '[Defense Impairment] Prevalence, validity, and verification-failure statistics on newly observed
    certificates (Statistical Method): Can you determine whether a process executes a binary signed by
    a certificate whose thumbprint or issuer matches a known-bad entry in a threat intelligence feed,
    or a new certificate is added to a trust store that matches a known-bad thumbprint. -- specifically,
    using the ''Prevalence, validity, and verification-failure statistics on newly observed certificates''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic, an adversary subverts trust controls
    to make malicious code appear trusted or to suppress warnings so untrusted programs run -- degrading
    defenders'' ability to detect, interpret, and respond to the activity. This evidence focuses on the
    condition that a process executes a binary signed by a certificate whose thumbprint or issuer matches
    a known-bad entry in a threat intelligence feed, or a new certificate is added to a trust store that
    matches a known-bad thumbprint. This Statistical Method approach works as follows: For all newly observed
    certificates (Zeek x509.log, Sysmon EID 1 signature fields) compute (a) Shannon entropy of issuer
    and subject CN, (b) fleet prevalence = count of unique hosts the signing cert appears on, and (c)
    validity-period length. Empirically, abused signing certificates have very low file/host prevalence
    and atypical/short validity ([Certified Malware, Kim et al.](http://www.umiacs.umd.edu/~tdumitra/papers/CCS-2017.pdf);
    [Issued for Abuse, Kotzias et al.](https://arxiv.org/abs/1803.02931)). Alert when entropy exceeds
    the 99th percentile of baseline, prevalence is below 0.1% of endpoints, OR validity < 90 days. As
    a distinct failure-mode signal, separately count and alert on signature-verification failures and
    revocation-check failures (malformed-but-trusted signatures the loader still honors per Kim et al.).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable subversion
    of trust controls; pivot to the responsible process and its parent lineage, the user and host context,
    the certificate thumbprint/issuer/serial or registry key involved, the source of any downloaded certificate
    or payload, and any subsequent execution that the bypass enabled. A negative result helps rule out
    this particular trust-subversion vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, living-off-the-land, or novel evasions.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek x509.log
  - 'NAI: All Endpoints and Servers, Network Egress/Ingress Points, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=zeek sourcetype=zeek_x509 OR (index=sysmon EventCode=1)

      | eval validity_days = (cert_not_after - cert_not_before)/86400

      | eval issuer_entropy = shannon(issuer_cn), subject_entropy = shannon(subject_cn)

      | eventstats dc(host) AS host_prev, count(host) AS fleet_total BY thumbprint

      | eval prevalence_pct = host_prev / fleet_total * 100

      | eventstats perc99(issuer_entropy) AS ent99

      | where issuer_entropy > ent99 OR prevalence_pct < 0.1 OR validity_days < 90

      | table thumbprint issuer subject validity_days prevalence_pct issuer_entropy'
  - technology: SIEM/Stats pseudocode
    query: '/* distinct failure-mode signal */

      index=sysmon EventCode=1 (SignatureStatus!=Valid OR Signed=false) OR index=zeek sourcetype=zeek_x509
      validation_status!=ok

      | stats count BY host, thumbprint, SignatureStatus, validation_status

      | where count > 0  /* malformed-but-trusted / revocation-check failures honored by loader */'
- question: '[Defense Impairment] Explainable certificate classifier with top-3 feature attribution (Machine
    Learning): Can you determine whether a process executes a binary signed by a certificate whose thumbprint
    or issuer matches a known-bad entry in a threat intelligence feed, or a new certificate is added to
    a trust store that matches a known-bad thumbprint. -- specifically, using the ''Explainable certificate
    classifier with top-3 feature attribution'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic, an adversary subverts trust controls
    to make malicious code appear trusted or to suppress warnings so untrusted programs run -- degrading
    defenders'' ability to detect, interpret, and respond to the activity. This evidence focuses on the
    condition that a process executes a binary signed by a certificate whose thumbprint or issuer matches
    a known-bad entry in a threat intelligence feed, or a new certificate is added to a trust store that
    matches a known-bad thumbprint. This Machine Learning approach works as follows: Train a Random Forest/gradient-boosting
    classifier on certificate features derived from the code-signing measurement literature ([Certified
    Malware, Kim et al.](http://www.umiacs.umd.edu/~tdumitra/papers/CCS-2017.pdf); [Issued for Abuse,
    Kotzias et al.](https://arxiv.org/abs/1803.02931)): validity period, key length, self-signed flag,
    issuer prevalence, file/host counts, issuer/subject entropy. Classify newly observed certificates
    and alert above a tuned confidence (e.g., 0.85). Emit the top-3 SHAP contributing features in the
    alert text so analysts can triage the score ([SHAP in IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).
    Run this in parallel with the deterministic deny-list rule above and never as a replacement, because
    ML detection collapses on novel/unknown samples ([Kus et al.](https://arxiv.org/abs/2205.09199)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable subversion
    of trust controls; pivot to the responsible process and its parent lineage, the user and host context,
    the certificate thumbprint/issuer/serial or registry key involved, the source of any downloaded certificate
    or payload, and any subsequent execution that the bypass enabled. A negative result helps rule out
    this particular trust-subversion vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, living-off-the-land, or novel evasions.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek x509.log
  - 'NAI: All Endpoints and Servers, Network Egress/Ingress Points, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [validity_period, key_length, self_signed, issuer_prevalence, file_count, host_count,\
      \ issuer_entropy, subject_entropy]\nmodel = RandomForest/GBM trained on labeled abused vs benign\
      \ code-signing certs\nfor cert in newly_observed_certs:\n    p = model.predict_proba(cert)\n   \
      \ if p >= 0.85:\n        alert(cert, confidence=p, top3=shap_top_features(model, cert, 3))\n# run\
      \ in PARALLEL with deterministic deny-list rule; never as replacement (ML collapses on novel samples)"
- question: '[Defense Impairment] Regex match on certificate-store and trust-provider modification commands
    (Symbolic Logic): Can you determine whether the execution of certutil.exe, reg.exe, or PowerShell.exe
    with command-line arguments or script block content that explicitly adds a certificate to a root store,
    modifies certificate-related registry keys, or disables trust provider checks. -- specifically, using
    the ''Regex match on certificate-store and trust-provider modification commands'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Defense Impairment tactic, an adversary subverts trust controls
    to make malicious code appear trusted or to suppress warnings so untrusted programs run -- degrading
    defenders'' ability to detect, interpret, and respond to the activity. This evidence focuses on the
    condition that the execution of certutil.exe, reg.exe, or PowerShell.exe with command-line arguments
    or script block content that explicitly adds a certificate to a root store, modifies certificate-related
    registry keys, or disables trust provider checks. This Symbolic Logic approach works as follows: Search
    process command-line (Windows Event ID 4688, Sysmon EID 1) and PowerShell script-block logs (Event
    ID 4104) for certificate-store and trust-provider tampering: `certutil .* -addstore .* root`, `certutil
    .* -addstore -enterprise .* Root`, `Import-Certificate .* -CertStoreLocation .*\\Root`, and direct
    registry writes to `HKLM\\SOFTWARE\\Microsoft\\SystemCertificates\\Root` or to Subject Interface Package
    / trust-provider keys under `HKLM\\SOFTWARE\\Microsoft\\Cryptography\\OID...` and `...\\Trust` ([New
    Root Certificate Installed Via Certutil.EXE, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certutil_certificate_installation.yml);
    certutil verb reference [Cryptography Tools, Microsoft](https://learn.microsoft.com/en-us/windows/win32/seccrypto/cryptography-tools);
    SIP/trust-provider hijack paths [Subverting Trust in Windows, Graeber](https://specterops.io/wp-content/uploads/sites/3/2022/06/SpecterOps_Subverting_Trust_in_Windows.pdf);
    LOLBAS syntax [LOLBAS Project](https://lolbas-project.github.io/)). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable subversion of trust controls; pivot to the
    responsible process and its parent lineage, the user and host context, the certificate thumbprint/issuer/serial
    or registry key involved, the source of any downloaded certificate or payload, and any subsequent
    execution that the bypass enabled. A negative result helps rule out this particular trust-subversion
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, living-off-the-land, or novel evasions.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 13
  - Windows Event ID 4657
  - 'NAI: All Endpoints and Servers, Domain Controllers, Certificate Authority Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index IN (wineventlog:security EventCode=4688, sysmon EventCode=1, powershell EventCode=4104)\n\
      | eval cmd=coalesce(CommandLine, ScriptBlockText)\n| where match(cmd, \"(?i)certutil.*-addstore.*root\"\
      )\n   OR match(cmd, \"(?i)certutil.*-addstore\\\\s+-enterprise.*Root\")\n   OR match(cmd, \"(?i)Import-Certificate.*-CertStoreLocation.*\\\
      \\\\\\Root\")\n| append [ search index=wineventlog:security EventCode=4657\n          (ObjectName=\"\
      *\\\\SystemCertificates\\\\Root*\"\n           OR ObjectName=\"*\\\\Cryptography\\\\OID*\" OR ObjectName=\"\
      *\\\\Trust*\") ]\n| table _time host user cmd ObjectName"
- question: '[Defense Impairment] Per-host rarity baseline of certutil/reg argument sets with rate ceiling
    (Statistical Method): Can you determine whether the execution of certutil.exe, reg.exe, or PowerShell.exe
    with command-line arguments or script block content that explicitly adds a certificate to a root store,
    modifies certificate-related registry keys, or disables trust provider checks. -- specifically, using
    the ''Per-host rarity baseline of certutil/reg argument sets with rate ceiling'' (Statistical Method)
    approach?'
  context: 'Why this matters: Under the Defense Impairment tactic, an adversary subverts trust controls
    to make malicious code appear trusted or to suppress warnings so untrusted programs run -- degrading
    defenders'' ability to detect, interpret, and respond to the activity. This evidence focuses on the
    condition that the execution of certutil.exe, reg.exe, or PowerShell.exe with command-line arguments
    or script block content that explicitly adds a certificate to a root store, modifies certificate-related
    registry keys, or disables trust provider checks. This Statistical Method approach works as follows:
    Per host, baseline the frequency of `certutil.exe`/`reg.exe` argument combinations targeting certificate
    or trust-provider paths and compute each set''s historical probability. Alert when an argument combination
    falls below a low-probability threshold (e.g., <0.01% historical prevalence for the host or org).
    Add a Volume/Frequency ceiling: alert on more than 1 root-store install or trust-provider registry
    write per host per day, since legitimate root installs are rare ([Certified Malware, Kim et al.](http://www.umiacs.umd.edu/~tdumitra/papers/CCS-2017.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable subversion
    of trust controls; pivot to the responsible process and its parent lineage, the user and host context,
    the certificate thumbprint/issuer/serial or registry key involved, the source of any downloaded certificate
    or payload, and any subsequent execution that the bypass enabled. A negative result helps rule out
    this particular trust-subversion vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, living-off-the-land, or novel evasions.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 13
  - Windows Event ID 4657
  - 'NAI: All Endpoints and Servers, Domain Controllers, Certificate Authority Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index IN (wineventlog:security EventCode=4688, sysmon EventCode=1)\n(process IN (certutil.exe,\
      \ reg.exe)) (CommandLine=\"*cert*\" OR CommandLine=\"*Root*\" OR CommandLine=\"*Trust*\")\n| eval\
      \ argset = normalize(CommandLine)\n| eventstats count AS argset_count, count(eval(true())) AS host_total\
      \ BY host, argset\n| eval prob = argset_count / host_total\n| where prob < 0.0001\n| append [ search\
      \ ...root-store installs/trust-provider writes\n          | bin _time span=1d | stats count BY host,\
      \ _time | where count > 1 ]\n| table _time host argset prob count"
- question: '[Defense Impairment] Sequence autoencoder over command histories with explainable deviation
    (Machine Learning): Can you determine whether the execution of certutil.exe, reg.exe, or PowerShell.exe
    with command-line arguments or script block content that explicitly adds a certificate to a root store,
    modifies certificate-related registry keys, or disables trust provider checks. -- specifically, using
    the ''Sequence autoencoder over command histories with explainable deviation'' (Machine Learning)
    approach?'
  context: 'Why this matters: Under the Defense Impairment tactic, an adversary subverts trust controls
    to make malicious code appear trusted or to suppress warnings so untrusted programs run -- degrading
    defenders'' ability to detect, interpret, and respond to the activity. This evidence focuses on the
    condition that the execution of certutil.exe, reg.exe, or PowerShell.exe with command-line arguments
    or script block content that explicitly adds a certificate to a root store, modifies certificate-related
    registry keys, or disables trust provider checks. This Machine Learning approach works as follows:
    Train an LSTM sequence-to-sequence autoencoder on normal per-session command-execution sequences (drawing
    on behavioral API/command corpora such as [Mal-API-2019, Catak](https://github.com/ocatak/malware_api_class))
    and alert when reconstruction error exceeds a dynamically determined threshold — e.g., a file download
    followed by `certutil -addstore` then execution. Surface the top-3 highest-error tokens/features in
    the alert ([SHAP in IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full))
    and keep it parallel to the deterministic regex rule, since ML degrades on unseen patterns ([Kus et
    al.](https://arxiv.org/abs/2205.09199)). A positive result -- a rule match, statistical outlier, or
    model alert -- indicates probable subversion of trust controls; pivot to the responsible process and
    its parent lineage, the user and host context, the certificate thumbprint/issuer/serial or registry
    key involved, the source of any downloaded certificate or payload, and any subsequent execution that
    the bypass enabled. A negative result helps rule out this particular trust-subversion vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    living-off-the-land, or novel evasions.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 13
  - Windows Event ID 4657
  - 'NAI: All Endpoints and Servers, Domain Controllers, Certificate Authority Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "sequences = per_session_ordered_commands(host, user)  # e.g. download -> certutil -addstore\
      \ -> exec\nmodel = LSTM_seq2seq_autoencoder trained on NORMAL command sequences\nfor seq in sequences:\n\
      \    err = reconstruction_error(model, seq)\n    if err > dynamic_threshold:\n        alert(seq,\
      \ error=err, top3_tokens=highest_error_tokens(seq, 3))\n# keep parallel to deterministic regex rule\
      \ (ML degrades on unseen patterns)"
- question: '[Defense Impairment] Correlate certificate download with subsequent trust-store install (Symbolic
    Logic): Can you determine whether a certificate file (e.g., .cer, .crt, .p7b) is downloaded from an
    external network source, and within a short time window (e.g., under 5 minutes), a process on the
    same host installs a certificate into a system trust store. -- specifically, using the ''Correlate
    certificate download with subsequent trust-store install'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic, an adversary subverts trust controls
    to make malicious code appear trusted or to suppress warnings so untrusted programs run -- degrading
    defenders'' ability to detect, interpret, and respond to the activity. This evidence focuses on the
    condition that a certificate file (e.g., .cer, .crt, .p7b) is downloaded from an external network
    source, and within a short time window (e.g., under 5 minutes), a process on the same host installs
    a certificate into a system trust store. This Symbolic Logic approach works as follows: Correlate
    Zeek files.log events (mime-type `application/x-x509-ca-cert` or extensions `.cer`/`.crt`/`.p7b`)
    with subsequent process creation (Windows Event ID 4688) or PowerShell script-block (Event ID 4104)
    on the same host within a 5-minute window, alerting if the later event contains a trust-store install
    (`certutil -addstore`, `Import-Certificate -CertStoreLocation *\Root`) ([Cryptography Tools, Microsoft](https://learn.microsoft.com/en-us/windows/win32/seccrypto/cryptography-tools);
    [New Root Certificate Installed Via Certutil.EXE, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certutil_certificate_installation.yml)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable subversion
    of trust controls; pivot to the responsible process and its parent lineage, the user and host context,
    the certificate thumbprint/issuer/serial or registry key involved, the source of any downloaded certificate
    or payload, and any subsequent execution that the bypass enabled. A negative result helps rule out
    this particular trust-subversion vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, living-off-the-land, or novel evasions.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - 'NAI: Network Egress/Ingress Points, User Workstations, Public-Facing Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "search index=zeek sourcetype=zeek_files\n  (mime_type=\"application/x-x509-ca-cert\" OR filename\
      \ IN (*.cer,*.crt,*.p7b))\n| eval dl_time=_time, host=resp_or_client_host\n| join host [ search\
      \ index IN (wineventlog:security EventCode=4688, powershell EventCode=4104)\n             (CommandLine=\"\
      *certutil*-addstore*\" OR ScriptBlockText=\"*Import-Certificate*-CertStoreLocation*Root*\") ]\n\
      | where (install_time - dl_time) >= 0 AND (install_time - dl_time) <= 300\n| table dl_time install_time\
      \ host filename CommandLine"
- question: '[Defense Impairment] Install-rate moving average with download-failure enrichment (Statistical
    Method): Can you determine whether a certificate file (e.g., .cer, .crt, .p7b) is downloaded from
    an external network source, and within a short time window (e.g., under 5 minutes), a process on the
    same host installs a certificate into a system trust store. -- specifically, using the ''Install-rate
    moving average with download-failure enrichment'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic, an adversary subverts trust controls
    to make malicious code appear trusted or to suppress warnings so untrusted programs run -- degrading
    defenders'' ability to detect, interpret, and respond to the activity. This evidence focuses on the
