name: 'T1553: Subvert Trust Controls'
id: a4d6472f-32e9-410b-bfc8-1d3c2b6560c7
description: 'This playbook helps an analyst investigate whether an adversary is subverting trust controls
  (MITRE ATT&CK T1553) to bypass mechanisms that warn users of untrusted activity or prevent execution
  of untrusted programs -- part of the Defense Impairment tactic. Adversaries abuse code-signing trust
  (creating, stealing, or purchasing certificates; bring-your-own-vulnerable-driver signing), install
  rogue root/AuthRoot certificates into system trust stores, tamper with Subject Interface Package (SIP)
  and trust-provider registry keys, and strip Mark-of-the-Web / quarantine metadata so downloaded payloads
  execute without warnings. The hunt spans Windows, Linux, and macOS endpoints plus network egress. It
  guides the analyst across several behavioral angles: matching observed signing certificates and trust-store
  additions against known-bad thumbprint/issuer/serial deny-lists and BYOVD corpora (LOLDrivers, Microsoft
  driver block rules); statistical baselining of certificate prevalence, validity period, and issuer/subject
  entropy to surface ad-hoc or purchased-for-abuse signing; detecting certutil.exe/reg.exe/PowerShell
  command lines and script blocks that add certificates to root stores or disable trust-provider checks;
  correlating certificate downloads with subsequent trust-store installs within tight time windows; seasonal
  and rate-based anomaly detection over enterprise certificate-install volume; and detection of Mark-of-the-Web
  removal utilities (Unblock-File, streams.exe -d, ADS Zone.Identifier deletion) preceding execution of
  internet-downloaded files. Detection methods combine symbolic-logic rules, statistical baselining/forecasting,
  and machine-learning models (explainable certificate classifiers, DBSCAN outlier detection, LSTM command-sequence
  autoencoders) applied to Windows Security/Sysmon events, PowerShell script-block logs, auditd, macOS
  unified logs, and Zeek x509/files/conn/pe logs, so the analyst can corroborate suspected trust subversion
  across signer reputation, certificate-store changes, command execution, and downloaded-file provenance.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
