    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable subversion
    of trust controls; pivot to the responsible process and its parent lineage, the user and host context,
    the certificate thumbprint/issuer/serial or registry key involved, the source of any downloaded certificate
    or payload, and any subsequent execution that the bypass enabled. A negative result helps rule out
    this particular trust-subversion vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, living-off-the-land, or novel evasions.'
