    source, and within a short time window (e.g., under 5 minutes), a process on the same host installs
    a certificate into a system trust store. This Statistical Method approach works as follows: Per host,
    model the daily rate of certificate installations with a 30-day moving average and standard deviation;
    alert when a 24-hour count exceeds 3σ above the host baseline. Raise priority when installs are preceded
    by downloads from low-reputation IPs/uncategorized domains (Zeek conn.log/dns.log enrichment). Profile
    failure-mode signals as distinct features: spikes in NXDOMAIN, HTTP 404, and blocked/failed connections
    preceding the install indicate staging from disposable infrastructure typical of the underground certificate
    trade ([Issued for Abuse, Kotzias et al.](https://arxiv.org/abs/1803.02931)). A positive result --
    a rule match, statistical outlier, or model alert -- indicates probable subversion of trust controls;
    pivot to the responsible process and its parent lineage, the user and host context, the certificate
    thumbprint/issuer/serial or registry key involved, the source of any downloaded certificate or payload,
    and any subsequent execution that the bypass enabled. A negative result helps rule out this particular
    trust-subversion vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, living-off-the-land, or novel evasions.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - 'NAI: Network Egress/Ingress Points, User Workstations, Public-Facing Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=* cert_install_event=true | bin _time span=1d\n| stats count AS daily BY host, _time\n\
      | eventstats avg(daily) AS mu, stdev(daily) AS sd BY host  /* 30-day window */\n| where daily >\
      \ mu + 3*sd\n| join host [ search index=zeek (sourcetype=zeek_conn OR zeek_dns)\n             |\
      \ stats count(eval(rcode_name=\"NXDOMAIN\")) AS nxd,\n                     count(eval(conn_state\
