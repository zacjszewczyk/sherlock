    defenders'' ability to detect, interpret, and respond to the activity. This evidence focuses on the
    condition that a certificate file (e.g., .cer, .crt, .p7b) is downloaded from an external network
    source, and within a short time window (e.g., under 5 minutes), a process on the same host installs
    a certificate into a system trust store. This Statistical Method approach works as follows: Apply
    Seasonal-Hybrid ESD (Extreme Studentized Deviate) time-series anomaly detection to the enterprise-wide
    hourly count of certificate-install events, alerting on statistically significant spikes that deviate
    from historical seasonal patterns (time-of-day, day-of-week), indicating a coordinated push of rogue
