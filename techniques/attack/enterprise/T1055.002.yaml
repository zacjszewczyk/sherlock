name: 'T1055.002: Process Injection: Portable Executable Injection'
id: 2c80e3f8-7d1f-4794-a3fb-f892ff64fa7f
description: Investigate Portable Executable (PE) injection, where an adversary copies a PE image or shellcode
  into the address space of a separate live process and executes it via a new remote thread to evade process-based
  defenses and potentially elevate privileges. This playbook helps an analyst hunt the canonical injection
  primitive chain (OpenProcess -> VirtualAllocEx RWX -> WriteProcessMemory of an MZ/PE header or shellcode
  -> CreateRemoteThread/NtCreateThreadEx into the same target address with no on-disk module backing the
  code), atypical and rare source-to-target remote-thread pairs against critical processes (lsass.exe,
  services.exe, wininit.exe, csrss.exe, winlogon.exe), IOC and low-prevalence process hashes from user-writable
  paths, injection-style command-line arguments and anomalous parent-child relationships, core/trusted
  processes that make unexpected egress or spawn children (including zero-length argv hollowing artifacts),
  beaconing and low-reputation/high-entropy network destinations, suspicious TLS fingerprints and certificates,
  and correlated dropper-to-beacon sequences. It spans deterministic (symbolic-logic), statistical-baseline,
  and machine-learning detection methods across Windows endpoint telemetry (Sysmon, Windows Security events,
  ETW Threat-Intelligence) and network telemetry (Zeek).
type: technique
