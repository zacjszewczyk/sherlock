      \ where thread.ts - open.ts <= 10s\n  and same target memory address;\nalert; output SourceImage,\
      \ TargetImage, StartAddress, GrantedAccess, ts"
- question: 'In support of the "Has the adversary escalated privileges using PE injection?" requirement
    and the Stealth objective, can analysts apply deterministic detection logic to detect "Unbacked start
    address / private RWX" for Process Injection: Portable Executable Injection? Concretely: Flag Event
