questions:
- question: 'In support of the "Has the adversary escalated privileges using PE injection?" requirement
    and the Stealth objective, can analysts apply deterministic detection logic to detect "Temporal injection-primitive
    correlation" for Process Injection: Portable Executable Injection? Concretely: Require the sequential
    presence of remote allocation, remote write, and remote thread creation linked by a unified target
    memory address within a short window (<=10s) per [Can You Run My Code?](https://dl.acm.org/doi/10.1145/3708821.3736206)
    and the [Sysmon CreateRemoteThread guide](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md).
    Trigger when Sysmon Event ID 10 OpenProcess GrantedAccess includes PROCESS_VM_WRITE|PROCESS_CREATE_THREAD
    (mask & 0x0022, e.g., 0x1F0FFF/0x1FFFFF) and is followed by Event ID 8 CreateRemoteThread into the
    same TargetImage, where SourceImage is not in C:\Windows\System32.'
  context: 'This question advances the Stealth (TA0005) line of inquiry into Process Injection: Portable
    Executable Injection. Observed evidence: A source process opens a handle to a target process and performs
    the canonical PE-injection primitive chain: remote RWX allocation (VirtualAllocEx), writing of a PE
    header (bytes 0x4D5A / ''MZ'') or shellcode (WriteProcessMemory), and execution via a new remote thread
    (CreateRemoteThread/NtCreateThreadEx). The strongest signal is these stages occurring in sequence
    against the SAME target memory address with no on-disk module backing the executed code. Detection
    method (Symbolic Logic): Require the sequential presence of remote allocation, remote write, and remote
    thread creation linked by a unified target memory address within a short window (<=10s) per [Can You
    Run My Code?](https://dl.acm.org/doi/10.1145/3708821.3736206) and the [Sysmon CreateRemoteThread guide](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md).
    Trigger when Sysmon Event ID 10 OpenProcess GrantedAccess includes PROCESS_VM_WRITE|PROCESS_CREATE_THREAD
    (mask & 0x0022, e.g., 0x1F0FFF/0x1FFFFF) and is followed by Event ID 8 CreateRemoteThread into the
    same TargetImage, where SourceImage is not in C:\Windows\System32. What to look for: the analyst is
    testing whether this specific behavior is present on the named area of interest (All Windows Endpoints
    and Servers, especially Privileged Access Workstations (PAWs) and Domain Controllers.), then enriching
    with the listed answer sources to confirm or refute it. Interpreting results: a match is a high-fidelity
    indicator that should be triaged immediately; a clean result narrows the hypothesis but does not by
    itself exonerate the host. Because PE injection runs adversary code inside a legitimate process, confirming
    this evidence directly supports the Stealth hypothesis — whether the adversary is hiding execution
    under a trusted image or riding an injected high-privilege process to elevate access.'
