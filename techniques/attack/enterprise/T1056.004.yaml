  - Sysmon Event ID 1 (Process Creation with parent context)
  - Zeek conn.log (network flow records)
  - Zeek dns.log (DNS resolution queries)
  - Windows Security Event ID 4768 (Kerberos Authentication Ticket Request) if domain context
  - 'NAI: Domain Controllers (for lsass.exe), User workstations (for browsers, RDP clients), Jump boxes,
    Internet Gateway'
  range: Last 60 days for baseline; evaluate against last 24 hours (event-centered correlation +/- 1 hour)
  queries:
  - technology: SIEM/Zeek pseudocode
    query: 'index=zeek_conn earliest=-60d proc IN (credential_procs)

      | stats count AS freq sum(orig_bytes) AS bytes BY proc dest_ip dest_port resp_asn

      | eventstats sum(freq) AS proc_total BY proc

      | eval pct=freq/proc_total

      | where pct < 0.005 OR freq=1

      | eval beacon=regularity(ts), failed_ratio=conn_fail/freq

      | table proc dest_ip dest_port pct bytes beacon failed_ratio'
