- question: '[Credential Access] Enforce strict parent-child and connection allow-lists for sensitive
    processes. Using the symbolic logic approach, how can an analyst confirm this for technique T1056.004
    (Credential API Hooking)?'
  context: 'Evidence: A legitimate credential-handling process (such as lsass.exe, chrome.exe, mstsc.exe,
    winlogon.exe, or svchost.exe in authentication contexts) unexpectedly spawns an anomalous child process
    or initiates a network connection to a rare, suspicious, or malicious destination. This indicates
    that the process has been compromised via API hooking and may be exfiltrating stolen credentials or
    communicating with command-and-control infrastructure.


    Method (Symbolic Logic): Symbolic Logic: Define and enforce a strict allow-list of legitimate child
    processes and outbound destinations for lsass.exe, winlogon.exe, and authentication services. Any
    process creation (Event ID 4688) or network initiation from these parents that deviates triggers a
    critical alert — lsass.exe spawning cmd.exe/powershell.exe/rundll32.exe is almost always malicious
    [Red Canary Process Injection](https://redcanary.com/threat-detection-report/techniques/process-injection/),
    [Sysmon Community Guide CreateRemoteThread](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md).
    Add explicit failure-State signals: a credential process generating bursts of blocked/RST connections
    (Windows Firewall drops) or NXDOMAIN responses (Zeek dns.log rcode=3) indicates beaconing to dead/rotating
    C2 and should escalate.


    Why it matters for Credential Access (TA0006): Is the adversary attempting to gain access to credentials
    using API hooking? A positive result indicates likely credential API hooking activity warranting escalation
    and forensic capture; a negative result helps rule out this technique on the named area of interest.
    Pivot on the host, process lineage, loaded modules, and destination to corroborate across the other
    questions in this playbook.'
  answer_sources:
  - Windows Security Event ID 4688 (Process Creation - parent/child relationships)
  - Sysmon Event ID 1 (Process Creation with parent context)
  - Zeek conn.log (network flow records)
  - Zeek dns.log (DNS resolution queries)
  - Windows Security Event ID 4768 (Kerberos Authentication Ticket Request) if domain context
  - 'NAI: Domain Controllers (for lsass.exe), User workstations (for browsers, RDP clients), Jump boxes,
    Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=process (EventCode=4688 OR EventID=1) ParentImage IN ("lsass.exe","winlogon.exe","<auth_services>")

      | lookup allowed_children parent AS ParentImage child AS Image OUTPUT allowed

      | where isnull(allowed)

      | append [ search Zeek_conn ParentImage IN ("lsass.exe","winlogon.exe") NOT dest_in_allowlist ]

      | append [ search (FirewallDrop OR conn_state=REJ) host=* | stats count BY host ]

      | append [ search Zeek_dns rcode=3 | stats count AS nxdomain BY host ]

      | eval priority="critical"'
- question: '[Credential Access] Identify rare destinations, volume, and frequency from credential processes.
    Using the statistical method approach, how can an analyst confirm this for technique T1056.004 (Credential
    API Hooking)?'
  context: 'Evidence: A legitimate credential-handling process (such as lsass.exe, chrome.exe, mstsc.exe,
    winlogon.exe, or svchost.exe in authentication contexts) unexpectedly spawns an anomalous child process
    or initiates a network connection to a rare, suspicious, or malicious destination. This indicates
    that the process has been compromised via API hooking and may be exfiltrating stolen credentials or
    communicating with command-and-control infrastructure.


    Method (Statistical Method): Statistical Method: For each credential-sensitive process, profile typical
    outbound destinations (IP, domain, port, ASN) from Zeek conn.log/dns.log over 60 days. Alert when
    the process connects to a destination in the lowest 0.5% of connection frequency or never seen before
    for that process. Add Physics-of-the-attack metrics: Volume (orig_bytes per connection vs baseline),
    Frequency (connections/min, regular beacon inter-arrival), and State (ratio of failed/blocked connections
    and NXDOMAIN). Time-windowed anomaly scoring over host+network telemetry is an effective, low-false-positive
    primitive [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).


    Why it matters for Credential Access (TA0006): Is the adversary attempting to gain access to credentials
