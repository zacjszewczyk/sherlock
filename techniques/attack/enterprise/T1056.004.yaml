name: 'T1056.004: Credential API Hooking'
id: 628a9068-0d05-4737-abf9-a60378915685
description: Investigate suspected Credential API Hooking (T1056.004), in which an adversary intercepts
  Windows API functions or Linux/macOS system functions to steal authentication credentials and collect
  sensitive data. On Windows this includes SetWindowsHookEx hook procedures, Import Address Table (IAT)
  hooking, and inline hooking that overwrites the first bytes of an API function; on Linux/macOS it includes
  LD_PRELOAD / DYLD_INSERT_LIBRARIES library injection that interposes functions such as libc read used
  by SSH/SCP (e.g., the Symbiote malware). This playbook helps an analyst hunt for the deployment of known
  hooking tools, hooking-specific command-line and memory primitives (allocate -> write -> remote-execute),
  unsigned or rare module loads into credential-sensitive processes (lsass.exe, winlogon.exe, services.exe,
  browsers, ssh/sudo/scp), anomalous parent-child relationships, and the downstream collection and exfiltration
  behavior (archiving of staged data and outbound transfer to rare or known-malicious C2 destinations)
  that follows a successful hook. It spans the Credential Access and Collection tactics and provides symbolic-logic,
  statistical, and machine-learning approaches across endpoint, network, and host-provenance telemetry.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
