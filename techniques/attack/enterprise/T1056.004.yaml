    is being exfiltrated to attacker infrastructure via an automated process.


    Method (Statistical Method): Statistical Method: Apply time-series models (Holt-Winters exponential
    smoothing or CUSUM) to daily outbound Volume per host-destination pair over a 30-day window. Alert
    when observations exceed the trailing 30-day 99th percentile, or when volume rises more than 10x the
    median daily volume to that destination. Pair with State metrics (failed/blocked connection ratio)
    to distinguish completed exfil from blocked attempts. Time-windowed anomaly scoring of telemetry streams
    is a robust primitive [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).


    Why it matters for Collection (TA0009): Is the adversary collecting sensitive data via API hooking?
    A positive result indicates likely credential API hooking activity warranting escalation and forensic
    capture; a negative result helps rule out this technique on the named area of interest. Pivot on the
    host, process lineage, loaded modules, and destination to corroborate across the other questions in
    this playbook.'
