questions:
- question: '[Credential Access] Match process hashes and hook-installation calls against threat intelligence.
    Using the symbolic logic approach, how can an analyst confirm this for technique T1056.004 (Credential
    API Hooking)?'
  context: 'Evidence: A process execution is observed where the executable''s file hash or digital signature
    matches a known malicious indicator (such as open-source hooking tools or malware families) specifically
    associated with API hooking techniques. This provides direct evidence of a known hooking tool being
    deployed, particularly when it targets credential-sensitive processes.


    Method (Symbolic Logic): Symbolic Logic: Query all process creation events (Windows Security Event
    ID 4688 or Sysmon Event ID 1) and correlate the executable file hash and Authenticode signature status
    against threat intelligence (known hooking-tool/malware hashes, YARA). Independently confirm hook
    installation from first-party telemetry: on Sysmon Event ID 8 (CreateRemoteThread) alert when StartModule/StartFunction
    references SetWindowsHookEx, NtSetWindowsHookEx, or LdrLoadDll targeting a credential process, and
    on Sysmon Event ID 7 when an unsigned/low-trust module is loaded into lsass.exe, winlogon.exe, or
    svchost.exe in an auth context. Cross-process thread creation and hooks into these processes are extremely
    rare in benign software, making a log-all-with-exceptions stance high-fidelity [Sysmon Community Guide
    CreateRemoteThread](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md),
    [Red Canary Process Injection](https://redcanary.com/threat-detection-report/techniques/process-injection/).
    Generate a high-priority alert on any match.


    Why it matters for Credential Access (TA0006): Is the adversary attempting to gain access to credentials
    using API hooking? A positive result indicates likely credential API hooking activity warranting escalation
    and forensic capture; a negative result helps rule out this technique on the named area of interest.
    Pivot on the host, process lineage, loaded modules, and destination to corroborate across the other
    questions in this playbook.'
  answer_sources:
  - Windows Security Event ID 4688 (Process Creation)
  - Sysmon Event ID 1 (Process Creation)
  - Windows Security Event ID 4720 (User Account Created) if hooking malware creates test accounts
  - 'NAI: User workstations, Domain Controllers, Critical application servers (e.g., HR, Finance), Jump
    boxes'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=process (EventCode=4688 OR (source=Sysmon EventID=1))

      | eval h=lower(Hashes)

      | lookup ti_hooking_hashes hash AS h OUTPUT verdict

      | where verdict="malicious" OR Signature IN ("unsigned","untrusted")

      | append [ search source=Sysmon EventID=8 (StartModule IN ("SetWindowsHookEx","NtSetWindowsHookEx","LdrLoadDll"))
      TargetImage IN ("lsass.exe","winlogon.exe","svchost.exe") ]

      | append [ search source=Sysmon EventID=7 TargetImage IN ("lsass.exe","winlogon.exe","svchost.exe")
      Signed=false ]

      | eval priority="high" | table _time host User Image h Signature priority'
- question: '[Credential Access] Flag low-prevalence hashes and profile execution failure state. Using
    the statistical method approach, how can an analyst confirm this for technique T1056.004 (Credential
    API Hooking)?'
  context: 'Evidence: A process execution is observed where the executable''s file hash or digital signature
    matches a known malicious indicator (such as open-source hooking tools or malware families) specifically
    associated with API hooking techniques. This provides direct evidence of a known hooking tool being
    deployed, particularly when it targets credential-sensitive processes.


    Method (Statistical Method): Statistical Method: Calculate the prevalence of each process hash across
    all endpoints over the trailing 30 days. Flag any hash that appears on fewer than 5 systems (or less
    than 0.1% of the endpoint population) and is not tied to a known deployment/patch/admin tool. Add
    an explicit failure-mode signal: track per-hash execution State by pairing Event ID 4688 with subsequent
    process-exit/crash codes and Windows Error Reporting / Event ID 1000 application-error events — a
    rare hash that repeatedly crashes lsass.exe/winlogon.exe is a strong injection-failure indicator.
    Rare host-telemetry nodes/edges are a validated anomaly primitive [ThreaTrace](https://arxiv.org/pdf/2111.04333).
    Rare hashes executing in sensitive contexts (Domain Controller, high-value user) require immediate
    investigation.


    Why it matters for Credential Access (TA0006): Is the adversary attempting to gain access to credentials
    using API hooking? A positive result indicates likely credential API hooking activity warranting escalation
    and forensic capture; a negative result helps rule out this technique on the named area of interest.
    Pivot on the host, process lineage, loaded modules, and destination to corroborate across the other
    questions in this playbook.'
  answer_sources:
  - Windows Security Event ID 4688 (Process Creation)
  - Sysmon Event ID 1 (Process Creation)
  - Windows Security Event ID 4720 (User Account Created) if hooking malware creates test accounts
  - 'NAI: User workstations, Domain Controllers, Critical application servers (e.g., HR, Finance), Jump
    boxes'
  range: Last 60 days for baseline; evaluate against last 24 hours (event-centered correlation +/- 1 hour)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=process earliest=-30d (EventCode=4688 OR EventID=1)

      | stats dc(host) AS host_count values(host) AS hosts BY Hashes Image

      | eventstats count AS total_hosts

      | where host_count < 5 OR (host_count/total_hosts) < 0.001

      | join Hashes [ search (EventCode=1000 OR WER) AppName IN ("lsass.exe","winlogon.exe") | stats count
      AS crashes BY Hashes ]

      | where NOT match(Image,"known_admin_tool")

      | table Image Hashes host_count crashes hosts'
- question: '[Credential Access] Supervised + sequence classification on process features with explainability.
    Using the machine learning approach, how can an analyst confirm this for technique T1056.004 (Credential
    API Hooking)?'
  context: 'Evidence: A process execution is observed where the executable''s file hash or digital signature
    matches a known malicious indicator (such as open-source hooking tools or malware families) specifically
    associated with API hooking techniques. This provides direct evidence of a known hooking tool being
    deployed, particularly when it targets credential-sensitive processes.


    Method (Machine Learning): Machine Learning: Train a supervised classifier (Random Forest or Gradient
    Boosting) on process-creation features (parent-process identity, command-line argument entropy, hash
    prevalence, signer status, privilege level, working directory) and alert when a low-prevalence hash
    scores above the 95th percentile. The alert MUST surface the top-3 contributing features (e.g., hash
    prevalence, signer status, anomalous parent) via model feature importances/SHAP so analysts can triage
    the score rather than trust it blindly. Complement with an LSTM over the process module-load/API-call
    sequence, since hook-install chains (LoadLibrary → GetProcAddress → VirtualProtect → WriteProcessMemory)
    are highly discriminative [Deep LSTM Malware Analysis](https://github.com/ocatak/lstm_malware_detection),
    and reconstruct the surrounding causal attack story for context [ATLAS](https://www.usenix.org/conference/usenixsecurity21/presentation/alsaheel).


    Why it matters for Credential Access (TA0006): Is the adversary attempting to gain access to credentials
    using API hooking? A positive result indicates likely credential API hooking activity warranting escalation
    and forensic capture; a negative result helps rule out this technique on the named area of interest.
    Pivot on the host, process lineage, loaded modules, and destination to corroborate across the other
    questions in this playbook.'
  answer_sources:
  - Windows Security Event ID 4688 (Process Creation)
  - Sysmon Event ID 1 (Process Creation)
  - Windows Security Event ID 4720 (User Account Created) if hooking malware creates test accounts
  - 'NAI: User workstations, Domain Controllers, Critical application servers (e.g., HR, Finance), Jump
    boxes'
  range: Last 90 days for training; score streaming/last 24 hours
  queries:
  - technology: ML/pseudocode
    query: 'features = [parent_image, cmdline_entropy, hash_prevalence, signer_status, integrity_level,
      working_dir]

      model = RandomForest/GradientBoosting.predict_proba(features)

      alert if hash_prevalence low AND score > p95

      report top3 = SHAP(features)   # surface hash_prevalence, signer_status, anomalous_parent

      seq = LSTM(module_load/api_call_sequence)  # LoadLibrary->GetProcAddress->VirtualProtect->WriteProcessMemory

      if seq.anomaly: reconstruct_causal_graph(event)'
- question: '[Credential Access] Detect hooking-specific command-line and memory-primitive patterns. Using
    the symbolic logic approach, how can an analyst confirm this for technique T1056.004 (Credential API
    Hooking)?'
  context: 'Evidence: A process is executed with command-line arguments, parent-child relationships, or
    execution context indicative of direct API hooking or in-memory injection. Examples include rundll32.exe
    or regsvcs.exe loading a DLL from a non-standard path (such as %TEMP%, %USERPROFILE%, or %PUBLIC%),
    or parent-child relationships (e.g., explorer.exe spawning SetWindowsHookEx, or lsass.exe unexpectedly
    spawning child processes) that are strongly associated with hooking techniques.


    Method (Symbolic Logic): Symbolic Logic: Apply regular expressions and pattern matching to process
    command-line arguments (Windows Security Event ID 4688 with command-line, Sysmon Event ID 1) to detect
    hooking signatures such as "SetWindowsHookEx", "LdrLoadDll", "VirtualProtect", "WriteProcessMemory",
    or known hooking-tool parameters. Enforce a strict deny-list of high-risk parent-child relationships
    — lsass.exe, winlogon.exe, or services.exe spawning cmd.exe, powershell.exe, or rundll32.exe — because
    these credential processes should essentially never spawn children [Red Canary Process Injection](https://redcanary.com/threat-detection-report/techniques/process-injection/).
    Confirm in-memory hooking by correlating the canonical allocate → write → remote-execute primitive
    chain across ETW/Sysmon, linked by a common target address and RWX/unbacked memory regions [A new
    approach for detecting process injection using memory analysis](https://link.springer.com/article/10.1007/s10207-024-00836-w).


    Why it matters for Credential Access (TA0006): Is the adversary attempting to gain access to credentials
    using API hooking? A positive result indicates likely credential API hooking activity warranting escalation
    and forensic capture; a negative result helps rule out this technique on the named area of interest.
    Pivot on the host, process lineage, loaded modules, and destination to corroborate across the other
    questions in this playbook.'
  answer_sources:
  - Windows Security Event ID 4688 (Process Creation with command-line)
  - Sysmon Event ID 1 (Process Creation with full command-line arguments)
  - Windows Security Event ID 4770 if hooking interacts with Kerberos
  - 'NAI: User workstations, Servers with administrative tools, Development environments, Authentication
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=process (EventCode=4688 OR EventID=1)

      | where match(CommandLine,"(?i)SetWindowsHookEx|LdrLoadDll|VirtualProtect|WriteProcessMemory")

      | append [ search EventID=1 ParentImage IN ("lsass.exe","winlogon.exe","services.exe") Image IN
      ("cmd.exe","powershell.exe","rundll32.exe") ]

      | append [ search Sysmon (EventID=8 OR EventID=10) | correlate by TargetAddress memory_protect=RWX
      ]

      | table _time host ParentImage Image CommandLine'
- question: '[Credential Access] Detect anomalous command-line entropy in critical processes. Using the
    statistical method approach, how can an analyst confirm this for technique T1056.004 (Credential API
    Hooking)?'
  context: 'Evidence: A process is executed with command-line arguments, parent-child relationships, or
    execution context indicative of direct API hooking or in-memory injection. Examples include rundll32.exe
    or regsvcs.exe loading a DLL from a non-standard path (such as %TEMP%, %USERPROFILE%, or %PUBLIC%),
    or parent-child relationships (e.g., explorer.exe spawning SetWindowsHookEx, or lsass.exe unexpectedly
    spawning child processes) that are strongly associated with hooking techniques.


    Method (Statistical Method): Statistical Method: Compute Shannon entropy of command-line arguments
    per unique executable. For high-legitimacy processes (svchost.exe, explorer.exe, powershell.exe) establish
    per-process entropy baselines over 30 days and alert when entropy exceeds the process-specific baseline
    by more than 2.5 standard deviations — a sign of obfuscated parameters or injection. Treat the command-line
    as a structured-log parameter and flag values that violate the learned per-key distribution, an approach
    shown effective for online log anomaly detection [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).


    Why it matters for Credential Access (TA0006): Is the adversary attempting to gain access to credentials
    using API hooking? A positive result indicates likely credential API hooking activity warranting escalation
    and forensic capture; a negative result helps rule out this technique on the named area of interest.
    Pivot on the host, process lineage, loaded modules, and destination to corroborate across the other
    questions in this playbook.'
  answer_sources:
  - Windows Security Event ID 4688 (Process Creation with command-line)
  - Sysmon Event ID 1 (Process Creation with full command-line arguments)
  - Windows Security Event ID 4770 if hooking interacts with Kerberos
  - 'NAI: User workstations, Servers with administrative tools, Development environments, Authentication
    servers'
  range: Last 60 days for baseline; evaluate against last 24 hours (event-centered correlation +/- 1 hour)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=process earliest=-30d Image IN ("svchost.exe","explorer.exe","powershell.exe")

      | eval ent=shannon_entropy(CommandLine)

      | stats avg(ent) AS mu stdev(ent) AS sd BY Image

      | join Image [ search index=process earliest=-1d | eval ent=shannon_entropy(CommandLine) ]

      | where ent > mu + 2.5*sd

      | table _time host Image CommandLine ent mu sd'
