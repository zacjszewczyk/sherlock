- question: '[Credential Access] Alert on suspicious DLL load paths and signatures. Using the symbolic
    logic approach, how can an analyst confirm this for technique T1056.004 (Credential API Hooking)?'
  context: 'Evidence: A process, particularly a sensitive one like lsass.exe, explorer.exe, or browser
    processes, loads a DLL module from a non-standard location (such as %TEMP%, %USERPROFILE%, removable
    media, or network shares) or loads a DLL that is extremely rare or never before seen with that parent
    process, strongly suggesting the loading of a malicious hook procedure or injection payload into memory.


    Method (Symbolic Logic): Symbolic Logic: Monitor image-load events (Sysmon Event ID 7) and alert when
    (1) a DLL loaded by credential-sensitive processes (lsass.exe, winlogon.exe, services.exe) is not
    on the system-DLL allow-list; (2) a DLL loads from suspicious paths (C:\\Users\\Public\\, C:\\Temp\\,
    %APPDATA%, network shares \\\\); (3) an unsigned or revoked-signature DLL loads; or (4) the path contains
    obfuscation (Unicode, encoding, unusual separators). Unsigned modules loading into credential processes
    are a high-fidelity hook indicator [Red Canary Process Injection](https://redcanary.com/threat-detection-report/techniques/process-injection/),
    [Sysmon Community Guide CreateRemoteThread](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md).


    Why it matters for Credential Access (TA0006): Is the adversary attempting to gain access to credentials
    using API hooking? A positive result indicates likely credential API hooking activity warranting escalation
    and forensic capture; a negative result helps rule out this technique on the named area of interest.
    Pivot on the host, process lineage, loaded modules, and destination to corroborate across the other
    questions in this playbook.'
  answer_sources:
  - Sysmon Event ID 7 (Image Load / DLL Loading)
  - Windows Security Event ID 4688 (with module loads if enabled)
  - Procmon logs (if available in the environment)
  - 'NAI: User workstations, Application servers, Virtual Desktop Infrastructure (VDI) environments'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=sysmon EventID=7 Image IN (\"lsass.exe\",\"winlogon.exe\",\"services.exe\")\n| where\
      \ (NOT ImageLoaded IN system_dll_allowlist)\n   OR match(ImageLoaded,\"(?i)\\\\\\\\Users\\\\\\\\\
      Public\\\\\\\\|\\\\\\\\Temp\\\\\\\\|AppData|^\\\\\\\\\\\\\\\\\")\n   OR Signed=false OR SignatureStatus=\"\
      Revoked\"\n   OR match(ImageLoaded,\"[^\\\\x00-\\\\x7F]\")\n| table _time host Image ImageLoaded\
      \ Signed SignatureStatus"
- question: '[Credential Access] Detect LD_PRELOAD/DYLD library injection into credential utilities. Using
