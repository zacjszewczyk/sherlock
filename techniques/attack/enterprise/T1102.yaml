name: 'T1102: Web Service'
id: 054226ef-47f9-4d3d-b0e7-5c6ea6a04f22
description: 'This playbook helps an analyst determine whether an adversary is abusing a legitimate external
  web service for command and control (T1102): relaying data to and from a compromised host through popular
  cloud, social-media, or developer services (e.g., Microsoft Graph API, Google, Discord, Slack, Dropbox,
  GitHub, Pastebin) so the malicious traffic blends into expected, SSL/TLS-encrypted noise and hides resilient
  back-end infrastructure. It correlates network telemetry (Zeek conn.log, dns.log, ssl.log, http.log,
  Windows 5156) with host process telemetry (Sysmon EID 1/3, Windows 4688) across five investigative angles:
  (1) connections matching threat-intel C2 indicators including domains, IPs, JA3/JA4 client fingerprints,
  and TLS cert hashes; (2) HTTP/decrypted-HTTPS requests matching known C2 framework signatures (Cobalt
  Strike Malleable-C2 URIs, Empire User-Agents) and URI/UA entropy outliers; (3) low-jitter, uniform-cadence
  beaconing detected by timing/byte uniformity, periodicity analysis, and beacon clustering; (4) anomalous
  upload-to-download byte ratios to file-sharing and paste sites indicating exfiltration; and (5) unexpected
  or sensitive processes (lsass.exe, LOLBins, binaries from unusual paths, anomalous parent-child chains)
  initiating web-service connections. Detection blends symbolic-logic rules (IoC joins, regex/Sigma signatures,
  watchlists), statistical baselining (percentiles, z-scores, Shannon entropy, coefficient-of-variation,
  failure-mode counts), and machine learning (Gradient Boosting, Isolation Forest, Random Forest, DBSCAN,
  time-series forecasting) with SHAP explanations to produce evasion-resistant, TLS-1.3-resilient, explainable
  alerts for the Command and Control tactic.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
