      \ tls_version, ja4, dst_port, inter_arrival_std,\n            uri_entropy, ua_entropy, parent_proc,\
      \ child_proc, cmdline_entropy, path_depth]\nmodel = GradientBoosting | IsolationForest | RandomForest\
      \ | DBSCAN | TimeSeries(Prophet/ARIMA/LSTM)\nscore = model.predict(features)  // train with IoC\
      \ hits as positive labels; run beside deterministic IoC match\nIF score > threshold THEN\n  alert(score,\
      \ top3_features = SHAP(model, features))  // e.g. upload_ratio, rare JA4, duration"
