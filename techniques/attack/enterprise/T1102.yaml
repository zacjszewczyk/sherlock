questions:
- question: 'Using deterministic rule logic, can you determine whether ''Threat-intel connection alert''
    indicates adversary use of a legitimate web service for command and control (T1102)? Specifically:
    Continuously ingest C2 threat intelligence feeds (domains, IPs, JA3/JA4 hashes, SSL cert hashes) and
    join Zeek conn.log, dns.log, and ssl.log on UID, alerting when a connection''s destination IP/domain,
    JA3/JA4 client fingerprint, or cert hash matches an indicator. Fingerprint implant TLS stacks reaching
    legitimate web services with [JA4+](https://github.com/FoxIO-LLC/ja4) and legacy [JA3](https://github.com/salesforce/ja3)
    (SNI-independent), and back endpoint/LOLBin matches with [SigmaHQ](https://github.com/SigmaHQ/sigma)
    rules. Emit the matched indicator type and value in the alert text.'
  context: 'Tactic context (TA0011 / Command and Control): The adversary is trying to communicate with
    compromised systems to control them. Adversaries relay C2 data through popular, legitimate web services
    (Google, Microsoft Graph, Twitter/X, Discord, Slack, Dropbox, GitHub, Pastebin) because hosts already
    talk to them and the traffic is SSL/TLS encrypted, providing cover and resilient, swappable back-end
    infrastructure. Evidence under investigation: A network connection event where the destination IP/hostname,
    associated DNS query, or the server name in the TLS handshake matches a known C2 indicator from an
    active threat intelligence feed. Approach (Threat-intel connection alert): Continuously ingest C2
    threat intelligence feeds (domains, IPs, JA3/JA4 hashes, SSL cert hashes) and join Zeek conn.log,
    dns.log, and ssl.log on UID, alerting when a connection''s destination IP/domain, JA3/JA4 client fingerprint,
    or cert hash matches an indicator. Fingerprint implant TLS stacks reaching legitimate web services
    with [JA4+](https://github.com/FoxIO-LLC/ja4) and legacy [JA3](https://github.com/salesforce/ja3)
    (SNI-independent), and back endpoint/LOLBin matches with [SigmaHQ](https://github.com/SigmaHQ/sigma)
    rules. Emit the matched indicator type and value in the alert text. A positive result means an internal
    host is communicating with a legitimate web service in a manner consistent with automated C2 or staging/exfiltration
    (IoC match, framework signature, uniform beaconing cadence, anomalous upload ratio, or an unexpected/sensitive
    process egressing); a negative result means the observed traffic matches normal, expected use of that
    service. Investigate the named area of interest (Network Egress Points (e.g., Firewalls, Proxies),
    DNS Resolvers) and pivot from any hit to the originating process and account, the full request history
    to that service, and any subsequent lateral movement or data staging.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Threat-intel connection alert\n// T1102 Web Service C2 - join\
      \ host + network telemetry\nMATCH conn IN (Zeek conn.log|dns.log|ssl.log|http.log, Sysmon EID 3,\
      \ Win 5156)\nWHERE dst_service IN known_web_services  // github,pastebin,discord,dropbox,graph.microsoft.com,slack\n\
      \  AND ( indicator_match(dst_ip|domain|JA3|JA4|cert_hash, threat_intel_feed)\n        OR uri|user_agent|host|cookie\
      \ MATCHES c2_signature_regex  // Cobalt Strike / Empire / Malleable-C2\n        OR process_name\
      \ IN sensitive_watchlist  // lsass,winlogon,csrss,services\n        OR process_name IN lolbins )\
      \       // mshta,rundll32,certutil,powershell\nJOIN process_create (Sysmon EID 1|Win 4688) ON host,pid\n\
      THEN alert(severity='high', enrich=[matched_field, matched_value, process_lineage])"
- question: 'Using statistical baselining, can you determine whether ''IoC hit outlier'' indicates adversary
    use of a legitimate web service for command and control (T1102)? Specifically: Per host, count distinct
    C2 IoC hits over rolling 24h; compute the 95th percentile across all hosts and flag hosts exceeding
    it. Track external-destination rarity (first-seen domains, low organization-wide prevalence) as in
    [RITA](https://github.com/activecm/rita). Failure-mode signal: separately count failed/blocked egress
    and NXDOMAIN responses to flagged indicators per host — a burst of blocked connections to a known-bad
    web service indicates an active but contained implant. Derive thresholds from your own 30-day baseline.'
