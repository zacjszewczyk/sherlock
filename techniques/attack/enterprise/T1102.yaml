  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: IoC hit outlier\n// Build per-host / per-web-service baselines\
      \ over 30-day history\nWINDOW = 1h  // also roll up to 24h\nFOR EACH (src_host, dst_service):\n\
      \  ioc_hits     = count(distinct c2_indicator_match)\n  upload_ratio = orig_bytes / max(resp_bytes,1)\n\
      \  uri_entropy  = shannon_entropy(uri_path); ua_entropy = shannon_entropy(user_agent)\n  iat_cv\
      \       = stddev(inter_arrival)/mean(inter_arrival)  // beacon jitter\n  fail_ct      = count(conn_state\
      \ IN ['S0','REJ'] OR http_status IN [403,404,413] OR NXDOMAIN)\nCOMPUTE baseline (mean,std,percentiles)\
      \ per service\nALERT WHEN ioc_hits > p95 OR z(upload_ratio) > 3\n  OR uri_entropy > p99 OR ua_entropy\
      \ < p10\n  OR iat_cv < 0.1 (uniform beacon) OR fail_ct burst  // failure-mode signal"
- question: 'Using a machine-learning model, can you determine whether ''Connection risk classifier''
    indicates adversary use of a legitimate web service for command and control (T1102)? Specifically:
    Train a supervised classifier (Gradient Boosting) on labeled Zeek features (duration, orig_bytes,
    resp_bytes, proto, TLS cipher/version) using IoC hits as positives, and keep features payload-agnostic
    so detection survives TLS 1.3 per [Novo et al. (RAID 2024)](https://dl.acm.org/doi/10.1145/3678890.3678921).
