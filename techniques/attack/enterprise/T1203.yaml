- question: '[Execution] Failed-exploit / NXDOMAIN burst from client app -- Using the ''Failed-exploit
    / NXDOMAIN burst from client app'' (Symbolic Logic) approach, can you determine whether a client application
    process, such as a browser or document reader, initiates an outbound network connection to a domain,
    IP address, or URL matching a known malicious indicator associated with exploit kits, malware distribution,
    or phishing campaigns. Specifically, how would you operationalize this: Profile Zeek dns.log NXDOMAIN
    responses and Zeek conn.log REJ/RSTRH/RSTOS0 conn_states originating from client-app processes. Alert
    when a single client-app process produces > 20 NXDOMAINs OR > 10 failed connection attempts to external
    destinations within a 5-minute window - characteristic of exploit-kit fall-back chains and DGA-driven
    payload retrieval. Failure volume must be a distinct alert class, not filtered as noise [Anomaly Detection
    of Web-based Attacks, ACM CCS 2003](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).'
