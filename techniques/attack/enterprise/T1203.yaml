- question: '[Execution] EXPOSURE-style passive-DNS feature scoring -- Using the ''EXPOSURE-style passive-DNS
    feature scoring'' (Statistical Method) approach, can you determine whether a client application process,
    such as a browser or document reader, initiates an outbound network connection to a domain, IP address,
    or URL matching a known malicious indicator associated with exploit kits, malware distribution, or
    phishing campaigns. Specifically, how would you operationalize this: For each external domain contacted
    by a client-app process, compute the EXPOSURE 15 features over 30 days from internal passive DNS:
    TTL minimum/mean, distinct-IP fan-out, country fan-out, query-time-of-day similarity, repeating-pattern
    score, name n-gram entropy, % numeric chars, % unique chars. Train a J48 / LightGBM classifier on
    labeled malicious vs benign domains. Alert on probability > 0.85, output the top-3 features. Threshold
    guidance: TPR > 95% / FPR < 1% on internal labeled set; retrain monthly [EXPOSURE NDSS 2011](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf).'
