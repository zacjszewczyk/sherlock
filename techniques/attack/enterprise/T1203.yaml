questions:
- question: '[Execution] Client-application connection to TI-listed exploit infrastructure -- Using the
    ''Client-application connection to TI-listed exploit infrastructure'' (Symbolic Logic) approach, can
    you determine whether a client application process, such as a browser or document reader, initiates
    an outbound network connection to a domain, IP address, or URL matching a known malicious indicator
    associated with exploit kits, malware distribution, or phishing campaigns. Specifically, how would
    you operationalize this: Join Zeek conn.log and Zeek http.log with curated TI feeds (exploit kit infrastructure,
    malware C2, phishing landing pages, malvertising domains, watering-hole IOCs) and Zeek dns.log to
    identify client applications (browser, document reader, mail client) initiating connections to TI-flagged
    IPs/domains/URIs. Alert on matches and capture the originating process via Sysmon Event ID 3 correlation.
    Output the matched IOC source/confidence, the source URI from Zeek http.log Referer chain (entry-point
    page), and any file downloaded (Zeek files.log SHA256). This is the deterministic floor: TI-list lookups
    must run regardless of any model layered above them [SigmaHQ/sigma](https://github.com/SigmaHQ/sigma),
    [Roth signature-base](https://github.com/Neo23x0/signature-base).'
  context: 'Why this matters: Under the Execution tactic (TA0002), adversaries exploit vulnerabilities
    in client applications (browsers, Office, PDF/Flash/third-party readers) to achieve arbitrary code
    execution, typically followed by file drops, anomalous child processes, and outbound C2. This evidence
    focuses on the condition that a client application process, such as a browser or document reader,
    initiates an outbound network connection to a domain, IP address, or URL matching a known malicious
    indicator associated with exploit kits, malware distribution, or phishing campaigns. The ''Client-application
    connection to TI-listed exploit infrastructure'' approach (Symbolic Logic) pursues this signal as
    follows: Join Zeek conn.log and Zeek http.log with curated TI feeds (exploit kit infrastructure, malware
    C2, phishing landing pages, malvertising domains, watering-hole IOCs) and Zeek dns.log to identify
    client applications (browser, document reader, mail client) initiating connections to TI-flagged IPs/domains/URIs.
    Alert on matches and capture the originating process via Sysmon Event ID 3 correlation. Output the
    matched IOC source/confidence, the source URI from Zeek http.log Referer chain (entry-point page),
    and any file downloaded (Zeek files.log SHA256). This is the deterministic floor: TI-list lookups
    must run regardless of any model layered above them [SigmaHQ/sigma](https://github.com/SigmaHQ/sigma),
    [Roth signature-base](https://github.com/Neo23x0/signature-base). A positive result -- a rule match,
    statistical outlier, or model alert -- is consistent with client-application exploitation; pivot to
    the responsible process and its parent lineage, the command line, any files written to disk, the originating
    document/URL, and subsequent outbound network connections to confirm or refute exploitation. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, because a single method can miss stealthy, staged, or living-off-the-land exploitation
    chains.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - 'NAI: Internet gateway, Forward proxy servers, DNS resolvers, User workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Client-application connection to TI-listed exploit infrastructure [Symbolic Logic]\n# Tactic:\
      \ Execution\nsources = [\"Zeek conn.log\", \"Zeek dns.log\", \"Zeek http.log\", \"Zeek files.log\"\
      , \"Zeek ssl.log\", \"Sysmon Event ID 3\"]\n  - filter events to client-application processes (browser/Office/reader/mail)\n\
      \  - join with curated TI / IOC feeds (exploit-kit, C2, phishing)\n  - emit alert with process lineage,\
      \ command line, dest, file SHA256"
- question: '[Execution] File download from rare or new domain by client app -- Using the ''File download
    from rare or new domain by client app'' (Symbolic Logic) approach, can you determine whether a client
    application process, such as a browser or document reader, initiates an outbound network connection
    to a domain, IP address, or URL matching a known malicious indicator associated with exploit kits,
    malware distribution, or phishing campaigns. Specifically, how would you operationalize this: From
    Zeek dns.log + http.log + files.log, alert when a client-application process downloads a high-risk
    file type (.pdf, .doc, .docm, .xls, .xlsm, .swf, .jar, .hta, .iso, .lnk, .one, .img, .vhd) from a
    domain whose first-seen for the host is within the last 24 hours AND whose enterprise prevalence over
    30 days is below the 5th percentile. Capture full URL, file SHA256, Content-Type and bytes. Apply
    a minimum-volume guardrail (host must have >=100 daily DNS queries) before flagging to suppress low-traffic
    VDI noise [EXPOSURE NDSS 2011](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf).'
