name: 'T1203: Exploitation for Client Execution'
id: be832506-89df-4113-89ec-aa816bf3b7bd
description: 'This playbook helps an analyst investigate whether an adversary has exploited a vulnerability
  in a client application -- a web browser, Microsoft Office or other productivity suite, a PDF/Flash/third-party
  reader, or a mail client -- to execute arbitrary code on an endpoint as part of the Execution tactic.
  It guides the hunt across the full cause-and-effect chain of client-side exploitation on Windows, Linux,
  and macOS: (1) a client application crashing, terminating abnormally, or initiating outbound connections
  to threat-intel-listed exploit-kit, malvertising, watering-hole, or C2 infrastructure (with JA3/JA4
  fingerprint matching, rare/new-domain scoring, fast-flux and NXDOMAIN/failed-connection bursts, and
  passive-DNS/URL classifiers); (2) a client application spawning command interpreters or scripting/LOLBIN
  hosts (cmd, powershell, wscript, mshta, rundll32, regsvr32, certutil, bitsadmin, msiexec) with download/execute
  primitives, Squiblydoo/Squiblytwo patterns, Office add-in/template-injection, and EQNEDT32/msdt (Follina)
  child processes; (3) statistically rare or first-seen parent-child process relationships originating
  from client applications; (4) client applications dropping executables or scripts into user-writable
  paths, extension/magic-byte mismatches (Magika), Office trusted-location writes, RTL/LNK tricks, and
  YARA/EMBER detections on dropped files; and (5) anomalous egress such as direct-to-IP connections, non-standard
  ports, high-entropy domains, and beaconing. Detection methods combine symbolic-logic rules, statistical
  baselining/forecasting, and machine-learning models (Kitsune autoencoders, URLNet/URLBERT, DistilBERT/CodeBERT
  command-line classifiers, provenance-graph GNNs, HDBSCAN clustering) applied to Zeek conn/dns/http/files/ssl
  logs, Sysmon Event IDs 1/3/11, Windows Event ID 4688, Linux auditd, and macOS unified/fsevents/osquery
  telemetry, so the analyst can corroborate suspected exploitation against process lineage, file writes,
  and network context.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
