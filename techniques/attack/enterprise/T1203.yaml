- question: '[Execution] Exploit-kit JA3/JA4 fingerprint match -- Using the ''Exploit-kit JA3/JA4 fingerprint
    match'' (Symbolic Logic) approach, can you determine whether a client application process, such as
    a browser or document reader, initiates an outbound network connection to a domain, IP address, or
    URL matching a known malicious indicator associated with exploit kits, malware distribution, or phishing
    campaigns. Specifically, how would you operationalize this: Match Zeek ssl.log JA3, JA3S, and JA4/JA4H
    fingerprints against curated lists of known exploit-kit and malicious-infrastructure fingerprints
    (RIG EK, Magnitude, Underminer, Fallout, Spelevo, Purple Fox, Cobalt Strike, Metasploit) and against
    the per-host browser baseline. Alert on (a) any match against known-bad lists when the originating
    client process is a browser (chrome.exe, msedge.exe, firefox.exe), and (b) any new JA3 emitted by
    the browser process mid-session - a strong indicator of an injected DLL with its own TLS stack. Reference
    [salesforce/ja3](https://github.com/salesforce/ja3) and [FoxIO-LLC/ja4](https://github.com/FoxIO-LLC/ja4).'
