- question: '[Execution] Per-user new-domain time-series anomaly -- Using the ''Per-user new-domain time-series
    anomaly'' (Statistical Method) approach, can you determine whether a client application process, such
    as a browser or document reader, initiates an outbound network connection to a domain, IP address,
    or URL matching a known malicious indicator associated with exploit kits, malware distribution, or
    phishing campaigns. Specifically, how would you operationalize this: Per-user time-series model (Seasonal-ARIMA,
    Prophet, or Holt-Winters) forecasting the expected daily count of connections to newly observed domains
    (not seen in prior 60 days for that user). Alert when observed exceeds the 99% prediction interval,
    especially when correlated with a high-risk file download in Zeek files.log within 5 minutes. Maintain
    a parallel hard rule: if newly-observed-domain count > 25 per user in any 1-hour window, alert regardless
    of model state [Online Forecasting and Anomaly Detection Based on ARIMA](https://www.mdpi.com/2076-3417/11/7/3194).'
