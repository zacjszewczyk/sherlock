- question: '[Execution] Per-host long-tail domain frequency baseline -- Using the ''Per-host long-tail
    domain frequency baseline'' (Statistical Method) approach, can you determine whether a client application
    process, such as a browser or document reader, initiates an outbound network connection to a domain,
    IP address, or URL matching a known malicious indicator associated with exploit kits, malware distribution,
    or phishing campaigns. Specifically, how would you operationalize this: For all requested domains
    in Zeek dns.log, calculate frequency over a 30-day rolling window per host AND enterprise-wide. Identify
    domains in the long tail (bottom 5th percentile of host or enterprise popularity) AND first-seen for
    the host. Flag connections from Zeek conn.log to these domains, especially if Zeek files.log shows
    concurrent download of a high-risk file type. Apply minimum-volume guardrail (host must have >=100
    daily DNS queries) and emit the top-3 contributing features (rarity rank, first-seen age, file-type)
    in the alert text [EXPOSURE NDSS 2011](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf).'
