name: 'T1037.002: Login Hook'
id: 6ae73de7-ac2b-42ca-a0b1-6c12a0c4f80a
description: Investigate potential abuse of macOS Login/Logout Hooks (MITRE ATT&CK T1037.002) for persistence
  and privilege escalation. A login/logout hook is defined by the LoginHook or LogoutHook key in /Library/Preferences/com.apple.loginwindow.plist;
  loginwindow executes the referenced script as root at user logon/logout. This playbook helps an analyst
  determine whether an adversary created, replaced, or re-enabled a hook (via defaults, plutil, PlistBuddy,
  editors, or raw file writes), whether the referenced payload was dropped or made executable in a temporary,
  user-writable, or hidden location shortly before logon, whether a root-privileged loginwindow child
  executed the configured hook target, and whether that privileged execution led to follow-on actions
  such as account creation, security-control changes, launch-infrastructure edits, or rare outbound network
  connections. It combines symbolic-logic detections, statistical prevalence and anomaly baselining, and
  machine-learning graph/tabular models across macOS endpoint telemetry (Unified Log, EndpointSecurity,
  FSEvents, File Integrity Monitoring) and network telemetry (Zeek conn/dns).
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
