questions:
- question: Did any process write the LoginHook or LogoutHook keys in /Library/Preferences/com.apple.loginwindow.plist,
    and is the referenced script unsigned, user-writable, or absent from the approved enterprise startup
    inventory?
  context: 'Login-hook persistence works by writing the LoginHook/LogoutHook key in /Library/Preferences/com.apple.loginwindow.plist
    so loginwindow runs the referenced script as root at every logon/logout. Detect both the canonical
    ''defaults write ... (LoginHook|LogoutHook)'' form and non-defaults modifiers (plutil, PlistBuddy,
    cp/mv, text editors) as well as raw EndpointSecurity/FSEvents file-modification events on the plist
    itself. Allowlist sanctioned management paths (e.g., JAMF ManagementFrameworkScripts/loginhook.sh)
    and treat everything else as suspicious. Surface the modifying process and command line, effective
    UID, code signer, and the referenced script path. In a Persistence context, a hook pointing at an
    unsigned, user-writable, or inventory-absent script is a strong indicator the adversary has established
    a root-executing foothold that survives reboot and logout. References: [Apple](https://developer.apple.com/library/archive/documentation/MacOSX/Conceptual/BPSystemStartup/Chapters/CustomLogin.html),
    [Elastic](https://detection.fyi/elastic/detection-rules/macos/persistence_login_logout_hooks_defaults/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: All macOS endpoints, `/Library/Preferences/com.apple.loginwindow.plist`, and centralized macOS
    telemetry platforms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "filter event in (process_exec, es_file_modify, fsevents)\n| where target_path == \"/Library/Preferences/com.apple.loginwindow.plist\"\
      \n| where (process.name == \"defaults\" and args contains \"write\" and (args contains \"LoginHook\"\
      \ or args contains \"LogoutHook\"))\n      or process.name in (\"plutil\",\"PlistBuddy\",\"cp\"\
      ,\"mv\",\"vim\",\"nano\",\"TextEdit\")\n      or event in (es_file_modify, fsevents)\n| where referenced_script\
      \ NOT in approved_startup_inventory\n      or referenced_script.signer == unsigned\n      or referenced_script.writable_by_user\
      \ == true\n| project ts, process.name, process.command_line, euid, referenced_script, referenced_script.signer\n\
      | alert severity=high"
- question: Has a real-time EndpointSecurity persistence monitor observed a new loginwindow hook being
    registered, and is the hook target unsigned, user-writable, hidden, or outside the approved startup
    inventory?
  context: 'Beyond after-the-fact log review, an EndpointSecurity-based persistence monitor (BlockBlock-style)
    can fire the instant a new loginwindow hook is registered, naming the responsible process and target
    path. This catches persistence at registration time rather than at the next logon. Escalate to high
    severity when the hook target is unsigned, user-writable, a hidden dotfile, or outside the approved
    enterprise startup inventory, because legitimate hooks are admin-only and extremely rare. A positive
    hit means an adversary is actively installing persistence; a negative result across the fleet provides
    assurance no new hooks were registered in the window. References: [Objective-See](https://objective-see.org/products/blockblock.html),
    [SentinelOne](https://www.sentinelone.com/blog/how-malware-persists-on-macos/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: All macOS endpoints, `/Library/Preferences/com.apple.loginwindow.plist`, and centralized macOS
    telemetry platforms.'
  range: Last 90 days
  queries:
  - technology: EndpointSecurity/pseudocode
    query: "subscribe ES_EVENT_TYPE_NOTIFY_WRITE on /Library/Preferences/com.apple.loginwindow.plist\n\
      | on event: parse loginwindow plist for new/changed LoginHook|LogoutHook\n| emit { responsible_process,\
      \ responsible_pid, signer, target_path }\n| if target.signer==unsigned or target.writable_by_user\
      \ or target.hidden or target NOT in approved_inventory:\n      alert severity=high"
- question: Are the modifying process, target hook path, and modifying user for any login-hook change
    first-seen or below the 1st percentile of fleet-wide prevalence, and are there failed (non-admin)
    write attempts or write-frequency spikes?
  context: 'Legitimate login hooks are admin-only and extremely rare, so prevalence baselining is powerful.
    Maintain a fleet-wide baseline of hook target paths, modifier processes, and modifying users, and
    flag first-seen or sub-1st-percentile combinations (the CAR outlier-parent pattern). Additionally
    profile failure-state signals as distinct evidence: defaults/plist write attempts that fail because
    the effective UID lacks admin rights, and write frequency (writes/host/day) above baseline. A rare
    or first-seen combination, repeated failed attempts (indicating an actor probing without privileges),
    or a frequency spike all warrant investigation as potential persistence activity. References: [Apple](https://developer.apple.com/library/archive/documentation/MacOSX/Conceptual/BPSystemStartup/Chapters/CustomLogin.html),
    [MITRE CAR](https://car.mitre.org/analytics/CAR-2014-11-002/), [Elastic](https://detection.fyi/elastic/detection-rules/macos/persistence_login_logout_hooks_defaults/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: All macOS endpoints, `/Library/Preferences/com.apple.loginwindow.plist`, and centralized macOS
    telemetry platforms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = prevalence_over(90d) by (modifier_process, hook_target_path, modifying_user)\n\
      | for each hook_write event:\n    p = baseline.percentile(modifier_process, hook_target_path, modifying_user)\n\
      \    flag if first_seen or p < 0.01\n| also: count write_attempts where result==denied and euid\
      \ not in admins\n| also: writes_per_host_per_day > mean+3*stddev\n| alert"
- question: Does an explainable classifier score a login-hook change as malicious based on modifier lineage,
    signer status, effective UID, target path class, file age, write success/fail, and coexistence with
    other persistence artifacts?
  context: 'Where labeled history exists, train an explainable tabular classifier (e.g., XGBoost) on login-hook
    change events. Useful features include modifier process lineage, code-signer status, effective UID,
    target path depth/class, file age, write success/failure, and whether the change coexists with other
    persistence artifacts (launch agents/daemons, cron, etc.). Escalate events scoring above a tuned malicious
    threshold and surface the top-3 contributing features in the alert text so analysts can validate quickly.
    This complements deterministic rules by catching novel persistence variants that evade signature logic
    while remaining interpretable for SOC triage. References: [ProblemChild](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: All macOS endpoints, `/Library/Preferences/com.apple.loginwindow.plist`, and centralized macOS
    telemetry platforms.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [modifier_lineage, signer_status, euid, target_path_class, target_path_depth,\n\
      \            file_age, write_success, coexisting_persistence_count]\nscore = xgboost_model.predict_proba(features)\n\
      if score > malicious_threshold:\n    emit alert(score, top3_shap_features(features))"
- question: Was the script or binary referenced by a LoginHook/LogoutHook created, replaced, or made executable
    shortly before user logon, and does it reside in a temporary, user-writable, or hidden location?
  context: 'The hook configuration is only half the story; the payload it points to must also be examined.
    Correlate hook configuration with file create/rename/chmod events for the referenced payload path,
    and alert when the hook target is dropped or made executable shortly before the next interactive login,
    since loginwindow will run it as root. Targets in temporary, user-writable, or hidden locations (e.g.,
    /tmp, /Users/<user>, dotfile paths) are high severity because enterprise startup components normally
    live in managed, signed, root-owned directories. A payload freshly staged just before logon is a classic
    just-in-time persistence pattern. References: [Apple](https://developer.apple.com/library/archive/documentation/MacOSX/Conceptual/BPSystemStartup/Chapters/CustomLogin.html),
    [SentinelOne](https://www.sentinelone.com/blog/how-malware-persists-on-macos/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: macOS endpoints, temporary directories, user home folders, shared administrative tooling repositories'
  range: Last 90 days; pivot +/- 1 hour around the hook write and the next interactive login
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'let hook_target = current LoginHook|LogoutHook value

      | filter event in (file_create, file_rename, chmod)

      | where path == hook_target

      | where (chmod added execute) or event in (file_create, file_rename)

      | join next_interactive_login by host within 1h

      | where hook_target matches ("/tmp/*","/private/tmp/*","/Users/*","*/.*")

      | alert severity=high'
- question: Does the hook target's location, signer, byte size, or file age deviate from the baseline
    of legitimate hook payloads, and does its runtime syscall/behavior profile deviate from a normal-process
    self model?
  context: 'Baseline legitimate hook-target locations, signer distributions, byte size, and file ages
    for approved macOS workflows, then flag payloads in low-prevalence directories, hidden paths, or recently
    created/modified files (e.g., file age < a few hours before login) that deviate from baseline. Complement
    the static deviation check by profiling the dropped script''s behavioral footprint (its short-sequence
    syscall pattern) against a normal-process self model and flagging deviation. A payload that is both
    statistically anomalous in placement/age and behaviorally divergent at runtime is highly likely to
    be malicious persistence rather than a sanctioned management script. References: [MITRE CAR](https://car.mitre.org/analytics/CAR-2014-11-002/),
    [Forrest et al.](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: macOS endpoints, temporary directories, user home folders, shared administrative tooling repositories'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = dist_over(90d) of hook_target by (directory, signer, byte_size, file_age)\n| flag\
      \ payload if directory.prevalence < p01 or path.hidden\n      or file_age < 4h_before_login\n  \
      \    or signer not in baseline.signers\n| then: syscall_seq = collect_short_sequences(payload_runtime)\n\
      | flag if mismatch_rate(syscall_seq, normal_self_model) > threshold"
- question: Does node-level provenance graph anomaly detection flag the hook-target's lifecycle (creation
    process, signer, parent, permission changes, downstream children) as differing from sanctioned management
    scripts?
  context: 'Model the hook-target file as a node within the host provenance graph, capturing its creation
    process, signer metadata, parent process, permission changes, and downstream children. Apply node-level
    GNN anomaly detection (ThreaTrace-style) to highlight payloads whose lifecycle differs from sanctioned
    management scripts, and use self-supervised graph learning (MAGIC-style) to adapt to natural fleet
    drift without constant relabeling. This catches stealthy persistence where the payload mimics a legitimate
    path but exhibits an anomalous provenance lineage (e.g., created by a downloaded binary, made executable
    by a shell, then wired into the hook), which static or single-event detections miss. References: [ThreaTrace](https://arxiv.org/pdf/2111.04333),
    [MAGIC](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: macOS endpoints, temporary directories, user home folders, shared administrative tooling repositories'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'build host_provenance_graph(window=90d)

      node = hook_target_file

      embed = GNN.node_embedding(node, neighbors=[creator_proc, parent, signer, perm_changes, children])

      score = anomaly_score(embed)  # ThreaTrace node-level

      if score > tuned_threshold: emit alert(node, reconstruct_lifecycle(node))

      retrain = self_supervised_masked_graph(MAGIC)  # drift adaptation'
- question: Did loginwindow spawn a root (EUID 0) process whose executable path matches the configured
    LoginHook/LogoutHook target, especially when that path is user-controlled, recently created, unsigned,
    or non-standard?
  context: 'The privilege-escalation payoff of a login hook is execution as root. Cache the current LoginHook/LogoutHook
    values from /Library/Preferences/com.apple.loginwindow.plist, then alert when loginwindow spawns a
    root (EUID 0) process whose executable path matches the configured hook target or a child script it
    invokes. Raise severity when that path is user-controlled, recently created, unsigned, or non-standard.
    Surface the signer, path, and EUID in the alert. A confirmed root-level loginwindow child running
    an attacker-controlled script is direct evidence the hook is delivering elevated execution, the core
    privilege-escalation outcome of this technique. References: [Apple](https://developer.apple.com/library/archive/documentation/MacOSX/Conceptual/BPSystemStartup/Chapters/CustomLogin.html),
    [SentinelOne](https://www.sentinelone.com/blog/how-malware-persists-on-macos/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: macOS endpoints, authentication telemetry, privileged session monitoring for shared or admin-managed
    Macs'
  range: Last 90 days; correlate with the most recent interactive login event on the host
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'let hook_target = cached LoginHook|LogoutHook from loginwindow.plist

      | filter process_exec where parent.name == "loginwindow"

      | where euid == 0

      | where exec_path == hook_target or parent_chain contains hook_target

      | where exec_path.user_controlled or exec_path.recently_created or exec_path.signer==unsigned or
      exec_path.non_standard

      | project ts, exec_path, signer, euid, parent.name

      | alert severity=high'
- question: Is a root-level loginwindow child executable, its signer, or its path first-seen or below
    the 1st percentile across the fleet, and does its syscall/behavior sequence (including non-zero exit
    states) deviate from a normal self model?
  context: 'Build fleet-wide prevalence baselines for root-level loginwindow child executables, signer
    identity, and paths, then flag executions that are first-seen or below the 1st percentile in that
    context (CAR outlier-parent baseline). Because loginwindow normally spawns a small, stable set of
    children, a rare root child is suspicious. Additionally profile the syscall/behavior sequence of the
    root child against a normal self model and flag deviation, treating non-zero exit (failure) states
    as a distinct signal since failed privileged execution can indicate experimentation or a broken implant.
    Combined rarity plus behavioral deviation strengthens the case for privilege-escalation abuse. References:
    [MITRE CAR](https://car.mitre.org/analytics/CAR-2014-11-002/), [Forrest et al.](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: macOS endpoints, authentication telemetry, privileged session monitoring for shared or admin-managed
    Macs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = prevalence_over(90d) of root_loginwindow_children by (exec_path, signer)\n| for\
      \ each root child of loginwindow (euid==0):\n    flag if first_seen or percentile(exec_path, signer)\
      \ < 0.01\n| syscall_seq = short_sequences(child_runtime)\n| flag if mismatch(syscall_seq, normal_self_model)\
      \ or exit_code != 0\n| alert"
- question: Does an explainable model and provenance anomaly scoring flag a root loginwindow execution
    as privilege-escalation abuse based on lineage, signer, path class, post-login timing, and recent
    file modifications?
  context: 'Train an explainable tabular classifier on root loginwindow execution events using lineage,
    signer metadata, path class, execution timing after login, and recent file modifications, escalating
    events that resemble privilege-escalation abuse and reporting the top-3 contributing features. Complement
    this with node-level provenance anomaly scoring of the executing process so that interpretable tabular
    signals and graph-structural signals reinforce each other. This is valuable for catching novel or
    obfuscated hook payloads that achieve root execution but evade static rules, while keeping output
    explainable enough for analysts to act on quickly. References: [ProblemChild](https://ar5iv.labs.arxiv.org/html/2008.04676),
    [ThreaTrace](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: macOS endpoints, authentication telemetry, privileged session monitoring for shared or admin-managed
    Macs'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [lineage, signer_meta, path_class, time_since_login, recent_file_mods, euid]\n\
      score = xgboost_model.predict_proba(features)\ngraph_score = provenance_node_anomaly(executing_process)\
      \  # ThreaTrace\nif score > threshold or graph_score > threshold:\n    emit alert(score, graph_score,\
      \ top3_features(features))"
- question: After a root loginwindow child runs, does it perform privileged follow-on actions such as
    dscl/sysadminctl/launchctl/spctl/chmod/chown, writes into protected launch or /etc locations, or new
    outbound connections?
  context: 'Once a hook executes as root, adversaries typically pivot to consolidate access. Alert when
    root loginwindow children execute privileged commands such as dscl, sysadminctl (user/account creation),
    launchctl, spctl (Gatekeeper changes), chmod, chown, or write into protected system/launch locations
    (/Library/LaunchAgents, /Library/LaunchDaemons, /etc/), or initiate outbound network connections shortly
    after execution. This chain links the privilege-escalation primitive to concrete impact: new accounts,
    weakened security controls, additional persistence, or C2 egress. Observing several of these in sequence
    from a loginwindow-rooted process is high-confidence malicious activity. References: [SentinelOne](https://www.sentinelone.com/blog/how-malware-persists-on-macos/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: macOS endpoints, `/etc/`, `/Library/LaunchAgents`, `/Library/LaunchDaemons`, DNS resolvers,
    network egress points'
  range: Last 90 days; pivot to a 10-minute window after the root hook execution
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let root_hook = process where parent.name==\"loginwindow\" and euid==0\n| filter descendants_of(root_hook)\n\
      | where process.name in (\"dscl\",\"sysadminctl\",\"launchctl\",\"spctl\",\"chmod\",\"chown\")\n\
      \      or file_write.path startswith (\"/Library/LaunchAgents\",\"/Library/LaunchDaemons\",\"/etc/\"\
      )\n      or network.direction == outbound\n| within 10m of root_hook\n| alert severity=high"
- question: Does post-hook privileged activity (volume and category of privileged actions, bytes egressed,
    commands/min, success vs. failure states) exceed the 99th percentile of benign login behavior for
    the host role?
  context: 'Characterize the ''physics'' of the post-hook session per host role: Volume (count and category
    of privileged actions, bytes egressed), Frequency (privileged commands per minute after login), and
    State (command/connection success vs. failure). Flag sessions whose post-hook activity volume or action
    diversity exceeds the 99th percentile of benign login behavior. Track failed privileged calls, blocked
    connections, and NXDOMAIN/DNS-failure spikes as distinct signals, since failures often reveal an actor
    probing or a misconfigured implant. A session that erupts into high-volume, high-diversity privileged
    activity right after a hook fires is a strong privilege-escalation/post-exploitation indicator. References:
    [MITRE CAR](https://car.mitre.org/analytics/CAR-2014-11-002/), [Forrest et al.](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: macOS endpoints, `/etc/`, `/Library/LaunchAgents`, `/Library/LaunchDaemons`, DNS resolvers,
    network egress points'
  range: Last 90 days; baseline per host role, evaluate the post-login session window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_host_role benign login sessions over 90d\n| metrics per post_hook_session:\n\
      \    volume = count(privileged_actions); diversity = distinct(action_categories); bytes = sum(egress_bytes)\n\
      \    freq = privileged_cmds / minutes_after_login\n    fails = count(denied_calls) + count(blocked_conns)\
      \ + count(nxdomain)\n| flag if volume > p99 or diversity > p99 or freq > p99\n| surface fails as\
      \ distinct signal\n| alert"
- question: Does provenance-graph anomaly detection on the loginwindow-rooted process-file-network subgraph
    reveal rapid expansion into account manipulation, security-control changes, persistence edits, or
    rare egress?
  context: 'Build process-file-network subgraphs rooted at loginwindow and apply provenance graph anomaly
    detection to surface sessions where a login hook rapidly expands into account manipulation, security-control
    changes, persistence edits, or rare egress, and auto-reconstruct the attack subgraph for triage (KAIROS-style).
    Use graph-snapshot embeddings with outlier detection (PROGRAPHER-style) and self-supervised masked
    graph learning (MAGIC-style) for drift-resilient detection. This whole-session graph view connects
    the dots that per-event rules miss, and the reconstructed subgraph gives analysts an immediate, explainable
    picture of how the hook escalated into broader compromise. References: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf),
    [PROGRAPHER](https://www.usenix.org/system/files/usenixsecurity23-yang-fan.pdf), [MAGIC](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: macOS endpoints, `/etc/`, `/Library/LaunchAgents`, `/Library/LaunchDaemons`, DNS resolvers,
    network egress points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = build_subgraph(root=loginwindow_session, nodes=[processes, files, network])\nscore = provenance_anomaly(G)\
      \  # KAIROS streaming detection\nsnap = graph_snapshot_embedding(G); outlier = detect_outlier(snap)\
      \  # PROGRAPHER\nif score > threshold or outlier:\n    emit alert(reconstruct_attack_subgraph(G))\n\
      model = self_supervised_masked_graph(MAGIC)  # drift resilience"
