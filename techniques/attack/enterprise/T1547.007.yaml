questions:
- question: >-
    [Persistence] Non-loginwindow writer alert (Symbolic Logic): The 'com.apple.loginwindow.[UUID].plist'
    file in ~/Library/Preferences/ByHost is created or modified by a process other than the expected 'loginwindow'
    process, or outside of a user-initiated logout/restart sequence. Apple's reopen-windows feature writes
    this plist only via loginwindow during logout/restart, so any other writer or out-of-band write is
    anomalous. How can you investigate this using the 'Non-loginwindow writer alert' (Symbolic Logic)
    approach?
  context: >-
    Why this matters: Under the Persistence tactic (TA0003), the mission question is: "Is the adversary
    maintaining persistence on macOS by modifying 'Reopen windows' login property list files?" T1547.007
    (Re-opened Applications) abuses macOS's reopen-windows feature, which normally writes ~/Library/Preferences/ByHost/com.apple.loginwindow.[UUID].plist
    only via the loginwindow process at user-initiated logout/restart; adversaries instead inject a malicious
    application path so their payload relaunches at the next login. This evidence focuses on the condition
    that The 'com.apple.loginwindow.[UUID].plist' file in ~/Library/Preferences/ByHost is created or modified
    by a process other than the expected 'loginwindow' process, or outside of a user-initiated logout/restart
    sequence. Apple's reopen-windows feature writes this plist only via loginwindow during logout/restart,
    so any other writer or out-of-band write is anomalous. The 'Non-loginwindow writer alert' (Symbolic
    Logic) approach pursues it as follows: Alert when an ES_EVENT_TYPE_NOTIFY_WRITE/RENAME targets com.apple.loginwindow.*.plist
    and the writing process is not /System/Library/CoreServices/loginwindow.app/Contents/MacOS/loginwindow,
    OR when loginwindow writes it while no logout/restart session event is present in the unified log
    within +/-5s. Include writing-process path, code-signing/team ID, SHA-256, and parent for triage,
    per the ground truth that this plist is written only by loginwindow at user-initiated logout/restart
    [Reopen windows when you log back in, Apple](https://support.apple.com/guide/mac-help/reopen-windows-when-you-log-back-in-mh35932/mac)
    [Methods of Malware Persistence on Mac OS X, Wardle](https://www.virusbulletin.com/uploads/pdf/conference/vb2014/VB2014-Wardle.pdf).
    Reference real-time persistence monitoring of this location [BlockBlock, Objective-See](https://objective-see.org/products/blockblock.html).
    A positive result -- a rule match, statistical outlier, or model alert -- is consistent with reopen-windows
    abuse for persistence; pivot to the responsible writer/process, its code signature and team ID, the
    reopened application path, the full process ancestry rooted at loginwindow, and any subsequent privileged
    or network activity. A negative result helps rule out this vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy or low-and-slow tradecraft.
