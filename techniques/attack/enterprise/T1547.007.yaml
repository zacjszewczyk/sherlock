name: 'T1547.007: Re-opened Applications'
id: a4a734f6-eb2e-44ec-823c-ffff358fcda2
description: >-
  This playbook helps an analyst investigate macOS persistence and privilege escalation carried out via
  the 'Re-opened Applications' mechanism (T1547.007), in which adversaries modify the per-host loginwindow
  property list file (com.apple.loginwindow.[UUID].plist in ~/Library/Preferences/ByHost) so that a malicious
  application is automatically relaunched when a user logs in. The ground truth is that Apple's reopen-windows
  feature writes this plist only via the loginwindow process during a user-initiated logout or restart,
  so any other writer, out-of-band write, or suspicious application path added to the SessionItems / TALAppsToRelaunchAtLogin
  arrays is anomalous. Under the Persistence tactic, the playbook guides the hunt for non-loginwindow
  writers, rare or first-seen writers, suspicious or unsigned application paths in non-standard locations
  (/tmp, ~/Downloads, /Users/Shared, hidden directories), and reopened processes that beacon to command-and-control
  infrastructure. Under the Privilege Escalation tactic, it hunts reopened-app process lineage that spawns
  root-privileged children without legitimate authorization, or that writes into protected system directories
  (LaunchDaemons, LaunchAgents, PrivilegedHelperTools, /usr/local/bin, /System). Detection methods combine
  symbolic-logic rules, statistical baselining/prevalence scoring, and explainable machine learning applied
  to macOS Endpoint Security Framework (ESF) events, the macOS Unified Log, osquery and File Integrity
  Monitoring output, and Zeek network telemetry, so the analyst can corroborate suspected reopen-windows
  abuse against the plist writer, the reopened application paths, process ancestry, privilege transitions,
  and network context.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
