    baseline-and-flag-rare template [CAR-2014-11-002: Outlier Parents of Cmd, MITRE](https://car.mitre.org/analytics/CAR-2014-11-002/)
    and enumerate-then-rank approach [KnockKnock, Objective-See](https://github.com/objective-see/KnockKnock).
