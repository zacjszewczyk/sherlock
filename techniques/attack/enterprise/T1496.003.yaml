name: 'T1496.003: SMS Pumping'
id: 847e7e09-571d-455a-92b2-278d9ba6af68
description: 'This playbook helps an analyst investigate SMS pumping (T1496.003), a telecommunications-fraud
  form of resource hijacking in which an adversary abuses a victim''s messaging infrastructure to blast
  large volumes of SMS messages toward attacker-controlled phone-number ranges, driving up messaging costs
  and overwhelming communication channels for financial and availability impact under the Impact tactic.
  Adversaries typically abuse publicly exposed OTP, account-verification, or other web forms that invoke
  background messaging APIs such as Twilio, AWS SNS, and Amazon Cognito. It guides the hunt across several
  complementary angles: web-form submissions whose source IPs or User-Agents match fraud blocklists and
  threat-intelligence feeds; single source IPs hitting SMS-generating endpoints with abnormally high frequency
  and robotic inter-request timing; command-line execution of known SMS-pumping scripts/tools on internal
  hosts and developer workstations; outbound SMS send rates from a single API key or endpoint that exceed
  statistical baselines; sudden messaging-cost spikes coinciding with traffic to high-cost premium/IPRN
  or geographically anomalous destination prefixes; sharp drops in the geographic entropy of destination
  country codes; and impossible-travel patterns where one session or account submits form requests from
  geographically distant IPs. Detection methods combine symbolic-logic rules (blocklists, User-Agent matching,
  WAF rate limits, country-code allowlists, impossible-travel logic), statistical baselining (robust modified
  z-score, inter-request timing variance, Shannon entropy, change-point detection, great-circle speed),
  and machine learning (explainable classifiers, DBSCAN clustering, time-series forecasting, Isolation
  Forest, LSTM autoencoders) applied to Zeek http.log/conn.log, Windows Event IDs 4688/4104/4624, cloud
  messaging-service logs, and cloud billing/cost-management logs, so the analyst can corroborate suspected
  SMS pumping across web telemetry, send-rate anomalies, destination geography, and cost impact.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
