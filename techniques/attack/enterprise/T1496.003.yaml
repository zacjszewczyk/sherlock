questions:
- question: '[Impact] Cross-reference destination prefixes and source IPs/User-Agents against fraud blocklists
    and TI feeds (Symbolic): For SMS pumping, can you determine whether web form submissions that trigger
    SMS messages originate from source IPs or contain User-Agent strings matching known malicious indicators
    from threat intelligence feeds. -- specifically by applying the ''Cross-reference destination prefixes
    and source IPs/User-Agents against fraud blocklists and TI feeds'' (Symbolic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary hijacks the victim''s messaging
    infrastructure to pump SMS traffic toward attacker-controlled number ranges, earning fraud revenue
    while inflating messaging spend and degrading availability of OTP/verification channels. This evidence
    focuses on the condition that web form submissions that trigger SMS messages originate from source
    IPs or contain User-Agent strings matching known malicious indicators from threat intelligence feeds.
    The Symbolic approach works as follows: Ingest threat-intelligence feeds plus IPRN/premium-rate and
    known test-number ranges documented in telephony-fraud research ([SoK: Fraud in Telephony Networks](http://s3.eurecom.fr/docs/eurosp17_sahin.pdf))
    and Twilio''s recommended high-risk destination controls ([Twilio SMS Pumping Fraud](https://www.twilio.com/docs/usage/fraud-prevention/sms-pumping-fraud)).
    Cross-reference in real-time against destination phone numbers from Cloud Messaging Service Logs and
    source IPs/User-Agents from Zeek http.log and web access logs. Deploy OWASP CRS bot/automation User-Agent
    and anomaly-scoring rules at the web tier as a deterministic floor ([OWASP ModSecurity Core Rule Set](https://github.com/coreruleset/coreruleset)).
    Generate a high-severity alert on any blocklist match. Failure-mode signal: also track CAPTCHA-failed
    and WAF-blocked submissions per IP as a distinct indicator of automation. A positive result -- a rule
    match, statistical outlier, or model alert -- indicates likely automated abuse of an SMS-generating
    endpoint or anomalous messaging cost/volume/geography consistent with SMS pumping; pivot to the responsible
    source IP/User-Agent, API key, web-form endpoint, user session, destination prefixes, and the associated
    billing impact to confirm. A negative result helps rule out this specific vector but should be corroborated
    with the other questions in this playbook, since pumping campaigns can rotate IPs, throttle pacing,
    or stay below individual thresholds.'
  answer_sources:
  - Zeek http.log
  - 'NAI: Public-facing Web Servers hosting OTP/verification forms, API Gateway, Cloud tenant for Messaging
    Services, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Cross-reference destination prefixes and source IPs/User-Agents against fraud blocklists\
      \ and TI feeds\nsource IN [Zeek http.log]\n| where endpoint matches SMS-generating form/API endpoint\n\
      | match against blocklist / TI feed / automation User-Agents / IPRN-premium\n   ranges / country-code\
      \ allowlist / rate cap / impossible-travel logic\n| where condition met (e.g. blocklist hit, UA\
      \ = curl|python-requests|\n   HeadlessChrome|Go-http-client, >100 SMS/min per key, country not allowlisted,\n\
      \   session country change < 10 min)\n| emit high-severity alert"
- question: '[Impact] Robust per-IP request-frequency baseline using median/MAD (Statistical): For SMS
    pumping, can you determine whether web form submissions that trigger SMS messages originate from source
    IPs or contain User-Agent strings matching known malicious indicators from threat intelligence feeds.
    -- specifically by applying the ''Robust per-IP request-frequency baseline using median/MAD'' (Statistical)
    approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary hijacks the victim''s messaging
    infrastructure to pump SMS traffic toward attacker-controlled number ranges, earning fraud revenue
    while inflating messaging spend and degrading availability of OTP/verification channels. This evidence
    focuses on the condition that web form submissions that trigger SMS messages originate from source
    IPs or contain User-Agent strings matching known malicious indicators from threat intelligence feeds.
    The Statistical approach works as follows: For each web form, compute requests per source IP per 5-minute
    window. Replace fragile mean/percentile thresholds with a robust modified z-score using the median
    and median absolute deviation (alert when |Mi| > 3.5), which resists contamination from legitimate
    batch spikes ([Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    Build the per-endpoint baseline from the request-frequency model of [Kruegel & Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf)
    over the last 30 days. Alert if a single IP exceeds the robust threshold, indicating a bot not yet
    on a threat list. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    likely automated abuse of an SMS-generating endpoint or anomalous messaging cost/volume/geography
    consistent with SMS pumping; pivot to the responsible source IP/User-Agent, API key, web-form endpoint,
    user session, destination prefixes, and the associated billing impact to confirm. A negative result
    helps rule out this specific vector but should be corroborated with the other questions in this playbook,
    since pumping campaigns can rotate IPs, throttle pacing, or stay below individual thresholds.'
  answer_sources:
  - Zeek http.log
  - 'NAI: Public-facing Web Servers hosting OTP/verification forms, API Gateway, Cloud tenant for Messaging
    Services, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "# Robust per-IP request-frequency baseline using median/MAD\nsource IN [Zeek http.log]\n|\
      \ where endpoint matches SMS-generating form/API or destination = SMS dest\n| bin by entity (source_ip\
      \ / api_key / session / country_code) and time window\n| compute robust statistics (median, MAD,\
      \ modified z-score, stddev of deltas,\n   Shannon entropy, or change-point as appropriate)\n| where\
      \ metric breaches threshold (e.g. |Mi| > 3.5, stddev < 0.5s,\n   entropy drop > 2*sigma, or change-point\
