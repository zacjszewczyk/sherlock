    while inflating messaging spend and degrading availability of OTP/verification channels. This evidence
    focuses on the condition that a series of requests to an SMS-generating web form, associated with
    a single user session or account, originates from multiple, geographically distant IP addresses in
    a time frame that would be impossible for a legitimate user to travel between. The Machine Learning
    approach works as follows: Train an LSTM autoencoder on sequences of (timestamp, source-IP geolocation)
    per session to learn normal mobility, flagging high reconstruction-error sequences as impossible-travel/anomalous
    ([Intrusion detection in cloud computing based on time series anomalies](https://link.springer.com/article/10.1186/s13677-023-00491-x));
    surface contributing features (geo jump, time delta, IP reputation) via SHAP for analyst triage ([XAI
    in IDS systematic review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates likely automated
    abuse of an SMS-generating endpoint or anomalous messaging cost/volume/geography consistent with SMS
    pumping; pivot to the responsible source IP/User-Agent, API key, web-form endpoint, user session,
    destination prefixes, and the associated billing impact to confirm. A negative result helps rule out
    this specific vector but should be corroborated with the other questions in this playbook, since pumping
    campaigns can rotate IPs, throttle pacing, or stay below individual thresholds.'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 4624
  - 'NAI: Public-facing Web Servers, Authentication Servers, Geolocation Enrichment Service'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "# Explainable sequence model of session mobility\nsource IN [Zeek http.log, Windows Event\
      \ ID 4624]\n| extract features (IP reputation, User-Agent commonality, requests/min,\n   inter-request\
      \ jitter, time-of-day, country, destination-prefix entropy,\n   cost, volume, geo-sequence)\n| score\
      \ with model (classifier / DBSCAN / IsolationForest / Prophet-ARIMA-LSTM /\n   LSTM-autoencoder\
      \ as appropriate)\n| where score/cluster/reconstruction-error flags anomaly\n| attach SHAP/LIME\
      \ top-3 contributing features\n| emit alert for analyst triage"
