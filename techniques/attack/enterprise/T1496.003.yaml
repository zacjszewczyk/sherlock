    IPs or contain User-Agent strings matching known malicious indicators from threat intelligence feeds.
    The Machine Learning approach works as follows: Deploy a classification model (logistic regression
    / random forest) on features such as IP reputation, User-Agent commonality, requests/min, inter-request
    jitter, time-of-day, and country of origin to score each request as high-risk-bot in real time ([SMS
    Pumping Fraud Prevention](https://www.twilio.com/en-us/blog/products/sms-pumping-fraud-prevention)).
    Wrap with SHAP/LIME so each alert surfaces the top-3 contributing features (e.g., requests/min, IP
    reputation, country) rather than a bare score ([XAI in IDS systematic review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates likely automated
    abuse of an SMS-generating endpoint or anomalous messaging cost/volume/geography consistent with SMS
    pumping; pivot to the responsible source IP/User-Agent, API key, web-form endpoint, user session,
    destination prefixes, and the associated billing impact to confirm. A negative result helps rule out
    this specific vector but should be corroborated with the other questions in this playbook, since pumping
    campaigns can rotate IPs, throttle pacing, or stay below individual thresholds.'
