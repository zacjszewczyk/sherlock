name: 'T1137.001: Office Template Macros'
id: 7a2f8968-8fe2-4bc4-8663-b79ecd201849
description: Investigate adversary persistence achieved by abusing Microsoft Office templates and template
  macros. This playbook helps an analyst determine whether an attacker has injected auto-executing VBA
  macros into Office base templates (Normal.dotm, PERSONAL.XLSB) or startup/template-path files, redirected
  the template load path via the GlobalDotName registry key, or weakened macro security (VBAWarnings,
  Trusted Locations, Trusted Documents) so that malicious code runs each time an Office application starts.
  It guides the analyst through detecting template-path file creation and modification, statically triaging
  the written VBA for auto-execution triggers and obfuscation, correlating template writes with subsequent
  Office launches, spotting Office processes spawning suspicious child processes or making rare outbound
  connections, and chaining these observations into a single high-confidence persistence sequence on a
  host. Detection methods span deterministic symbolic logic, statistical baselining/prevalence/entropy
  scoring, and machine-learning classifiers.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has any process other than WINWORD.EXE or EXCEL.EXE created or written a file with a template/document
    extension (.dot, .dotm, .xlt, .xltm, .doc, .docm, .xls, .xlsm) into a Word STARTUP folder, the Excel
    XLSTART folder, %APPDATA%\Microsoft\Templates, or a Program Files Office startup folder?
  context: Office loads base templates and startup-folder add-ins automatically on launch, so an attacker
    who drops a template into these paths gains code execution every time the user opens the application
    (Persistence). Legitimately, only the Office apps themselves (or known sync/backup agents) write here.
    Alert when any other process creates such a file, then triage the writer's image path and lineage.
    Tune out template synchronization, profile-roaming, and backup/restore agents by allowlisting their
    image paths. A positive result is a strong persistence indicator warranting host isolation and template
    removal.
  answer_sources:
  - WinEventLog:Sysmon EventCode=11 (FileCreate)
  - WinEventLog:Sysmon EventCode=15 (FileCreateStreamHash/MOTW)
  - Windows Event ID 4663
  - Windows Event ID 4688
  - WinEventLog:Microsoft-Office-Alerts
  - 'NAI: User workstations (specifically %APPDATA%\Microsoft\Templates and %APPDATA%\Microsoft\Excel\XLSTART),
    File servers hosting shared templates, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source IN ("Sysmon:EID11", "WinEventLog:4663")
      | where target_filename matches "(?i)\\(STARTUP|XLSTART|Microsoft\\Templates)\\.*\.(dot|dotm|xlt|xltm|doc|docm|xls|xlsm)$"
      | where image NOT IN ("WINWORD.EXE","EXCEL.EXE")
      | where image NOT IN (allowlist_sync_backup_agents)
      | emit alert(host, user, image, target_filename)
- question: When a template path is written, does static extraction of the embedded VBA reveal an auto-execution
    trigger (AutoOpen, AutoExec, Document_Open, Workbook_Open) co-occurring with execution or download
    keywords (Shell, CreateObject, WScript.Shell, URLDownloadToFile, MSXML2.XMLHTTP)?
  context: 'Auto-execution triggers are what make a template macro persistent: they fire automatically
    on application startup or document open. When combined with shell/download primitives, the macro is
    almost certainly malicious. Use olevba (oletools) to extract VBA from every newly written template
    and run a concrete, additive keyword denylist. This is the deterministic floor for triage. A positive
    co-occurrence should be treated as confirmed malicious persistence; a negative result still merits
    prevalence/entropy review.'
  answer_sources:
  - WinEventLog:Sysmon EventCode=11 (FileCreate)
  - WinEventLog:Sysmon EventCode=15 (FileCreateStreamHash/MOTW)
  - Windows Event ID 4663
  - Windows Event ID 4688
  - WinEventLog:Microsoft-Office-Alerts
  - 'NAI: User workstations (specifically %APPDATA%\Microsoft\Templates and %APPDATA%\Microsoft\Excel\XLSTART),
    File servers hosting shared templates, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      on file_write(template_path):
      vba = olevba_extract(template_path)
      triggers = {AutoOpen, AutoExec, Document_Open, Workbook_Open}
      exec_kw  = {Shell, CreateObject, WScript.Shell, URLDownloadToFile, MSXML2.XMLHTTP}
      if (vba CONTAINS any(triggers)) AND (vba CONTAINS any(exec_kw)):
          emit alert(host, template_path, matched_trigger, matched_keyword)
- question: Is a template-path write (Sysmon EID 11 / Event ID 4663) followed within 24 hours by an Office
    launch (Event ID 4688) on the same host that loads a template from that path, and does the written
    template carry Mark-of-the-Web (Sysmon EID 15)?
  context: Persistence is realized only when the planted template is actually loaded by Office. Correlating
    the write to a subsequent Office launch that loads that path confirms the persistence mechanism is
    live. Mark-of-the-Web on the written template indicates it originated from the internet/email, an
    aggravating factor that raises severity. A positive correlation strongly supports an active persistence
    foothold.
  answer_sources:
  - WinEventLog:Sysmon EventCode=11 (FileCreate)
  - WinEventLog:Sysmon EventCode=15 (FileCreateStreamHash/MOTW)
  - Windows Event ID 4663
  - Windows Event ID 4688
  - WinEventLog:Microsoft-Office-Alerts
  - 'NAI: User workstations (specifically %APPDATA%\Microsoft\Templates and %APPDATA%\Microsoft\Excel\XLSTART),
    File servers hosting shared templates, Network egress points'
  range: Last 90 days; correlate write event with Office launches in the following 24h window
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      let writes = source("Sysmon:EID11","4663") where template_path
      let launches = source("4688") where image IN ("WINWORD.EXE","EXCEL.EXE") and loads template_path
      join writes, launches on host where launch.time - write.time <= 24h
      | enrich motw = exists("Sysmon:EID15", template_path)
      | emit alert(host, template_path, motw)
- question: Does a host exceed its own baseline (mean + 3 sigma or 95th percentile) of daily template-path
    writes, or is the written template's filename/extension seen on fewer than 1% of hosts fleet-wide?
  context: Legitimate template churn is low and consistent per host. A spike in template writes, or a
    template name/path that is rare across the fleet, is anomalous and may indicate persistence staging.
    Build per-host/OU daily-count baselines and fleet-wide prevalence over 30+ days of history. A host
    above its threshold or a sub-1% prevalence template warrants investigation even when no keyword matched.
  answer_sources:
  - WinEventLog:Sysmon EventCode=11 (FileCreate)
  - WinEventLog:Sysmon EventCode=15 (FileCreateStreamHash/MOTW)
  - Windows Event ID 4663
  - Windows Event ID 4688
  - WinEventLog:Microsoft-Office-Alerts
  - 'NAI: User workstations (specifically %APPDATA%\Microsoft\Templates and %APPDATA%\Microsoft\Excel\XLSTART),
    File servers hosting shared templates, Network egress points'
  range: Last 90 days; baseline derived from 30+ days of history
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = per_host_daily_count(template_writes, lookback=30d)
      if today_count(host) > mean(baseline) + 3*stddev(baseline): flag(host)
      prevalence = count_distinct_hosts(template_name) / total_hosts
      if prevalence < 0.01: flag(template_name)
      emit alert(host, template_name, today_count, prevalence)
- question: Does the extracted VBA module (or its long string literals) have Shannon entropy above 7.0,
    indicating encryption or packing rather than the ~4.5-6.5 band typical of native VBA source?
  context: Attackers obfuscate template macros to evade keyword detection. High Shannon entropy of the
    VBA bytes or of embedded string literals indicates encrypted/packed content. Compute entropy on every
    extracted module and report the value plus the offending string. Values >7.0 are a statistical signal
    of obfuscation; the native-code band is roughly 4.5-6.5. High entropy alone is suspicious and should
    route the sample for deeper analysis.
  answer_sources:
  - WinEventLog:Sysmon EventCode=11 (FileCreate)
  - WinEventLog:Sysmon EventCode=15 (FileCreateStreamHash/MOTW)
  - Windows Event ID 4663
  - Windows Event ID 4688
  - WinEventLog:Microsoft-Office-Alerts
  - 'NAI: User workstations (specifically %APPDATA%\Microsoft\Templates and %APPDATA%\Microsoft\Excel\XLSTART),
    File servers hosting shared templates, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      vba = olevba_extract(template_path)
      H_bytes = shannon_entropy(vba.module_bytes)
      H_str   = max(shannon_entropy(s) for s in vba.long_strings)
      if H_bytes > 7.0 OR H_str > 7.0:
          emit alert(host, template_path, H_bytes, H_str, offending_string)
- question: Does an obfuscation-aware machine-learning classifier score the extracted VBA as malicious
    based on keyword/identifier statistics, character distribution, entropy, and length features?
  context: Beyond fixed keyword lists, a trained classifier (e.g., Random Forest over keyword/identifier
    statistics, character distribution, entropy, and length) catches novel and obfuscated template macros.
    Score every extracted VBA module and surface the top-3 contributing features (e.g., AutoOpen present,
    entropy, Shell call) so analysts can validate. A high score with explanatory features is a strong
    lead for malicious persistence.
  answer_sources:
  - WinEventLog:Sysmon EventCode=11 (FileCreate)
  - WinEventLog:Sysmon EventCode=15 (FileCreateStreamHash/MOTW)
  - Windows Event ID 4663
  - Windows Event ID 4688
  - WinEventLog:Microsoft-Office-Alerts
  - 'NAI: User workstations (specifically %APPDATA%\Microsoft\Templates and %APPDATA%\Microsoft\Excel\XLSTART),
    File servers hosting shared templates, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features = extract(vba: keyword_stats, char_distribution, entropy, length, suspicious_api)
      score = vba_obfuscation_model.predict_proba(features)
      if score > threshold:
          emit alert(host, template_path, score, top3_features(features))
- question: Does an active-learning structural classifier flag the written template (.dotm/.xltm) as anomalous
    based on its OOXML/OLE structure, and is the sample one of the most informative cases to route to
    an analyst?
  context: Structural (OOXML/OLE) classification complements VBA content analysis by detecting malformed
    or evasive template files. Using an active-learning framework (per ALDOCX), the model classifies structure
    and routes the most informative samples to analysts, continuously adapting to novel template-macro
    variants. Use this to catch structurally evasive templates that slip past content rules.
  answer_sources:
  - WinEventLog:Sysmon EventCode=11 (FileCreate)
  - WinEventLog:Sysmon EventCode=15 (FileCreateStreamHash/MOTW)
  - Windows Event ID 4663
  - Windows Event ID 4688
  - WinEventLog:Microsoft-Office-Alerts
  - 'NAI: User workstations (specifically %APPDATA%\Microsoft\Templates and %APPDATA%\Microsoft\Excel\XLSTART),
    File servers hosting shared templates, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = ooxml_ole_structure_features(template_file)\nscore = aldocx_active_model.predict(features)\n\
      if score == malicious OR is_informative(features): \n    emit alert(host, template_file, score);\
      \ route_to_analyst(template_file)"
- question: Has the GlobalDotName registry value (HKCU\Software\Microsoft\Office\<ver>\Word\Options\GlobalDotName
    or equivalent app keys) been written to point the template to a non-default path or extension?
  context: GlobalDotName lets an adversary redirect Office to load an arbitrary template from any location
    (including remote paths), bypassing all Normal.dotm file monitoring (Persistence). The key is empty/absent
    by default, so any non-empty value is high severity. Alert on any write that sets a non-default path/extension
    and investigate the modifying process. A positive result is a strong, stealthy persistence indicator.
  answer_sources:
  - WinEventLog:Sysmon EventCode=13,14 (RegistryValueSet)
  - Windows Event ID 4657
  - Windows Event ID 4688
  - 'NAI: Windows Registry on all endpoints (user workstations and servers), Group Policy Objects on Domain
    Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source IN ("Sysmon:EID13,14","WinEventLog:4657")
      | where registry_key matches "(?i)\\Office\\.*\\(Word|Excel)\\Options\\GlobalDotName$"
      | where registry_value != "" and registry_value != default_template_path
      | emit alert(host, user, registry_key, registry_value, modifying_process)
- question: Has a non-allowlisted process lowered Office macro security (VBAWarnings set to 1 or 2), added
    a new Trusted Location, or registered a Trusted Document under HKCU\Software\Policies\Microsoft\Office\...\Security?
  context: 'To make template macros run unrestricted, adversaries weaken macro-security policy: VBAWarnings=1
    enables all macros, =2 disables warnings; new Trusted Locations and Trusted Documents bypass Mark-of-the-Web
    blocking. Alert when any process outside the explicit allowlist of installers/GPO/management agents
    makes these edits. A positive result indicates deliberate weakening of defenses to support macro persistence.'
  answer_sources:
  - WinEventLog:Sysmon EventCode=13,14 (RegistryValueSet)
  - Windows Event ID 4657
  - Windows Event ID 4688
  - 'NAI: Windows Registry on all endpoints (user workstations and servers), Group Policy Objects on Domain
    Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source IN ("Sysmon:EID13,14","WinEventLog:4657")
      | where registry_key matches "(?i)\\Office\\.*\\Security\\(VBAWarnings|Trusted Locations|Trusted Documents)"
      | where (registry_value IN (1,2)) OR new_trusted_location OR new_trusted_document
      | where modifying_process NOT IN (allowlist_installers_gpo_agents)
      | emit alert(host, user, registry_key, registry_value, modifying_process)
- question: Is an Office security registry key being set to a value or path seen on fewer than 1% of endpoints,
    or is a host exceeding mean + 3 sigma of its daily count of Office security-key edits (Event ID 4657)?
  context: Rare registry values and edit bursts are statistical anomalies. Baseline observed values per
    key across the fleet and per-host daily edit counts, then flag sub-1% values/paths and counts beyond
    mean + 3 sigma. This catches novel GlobalDotName paths or unusual security edits even when they are
    not on a fixed denylist.
  answer_sources:
  - WinEventLog:Sysmon EventCode=13,14 (RegistryValueSet)
  - Windows Event ID 4657
  - Windows Event ID 4688
  - 'NAI: Windows Registry on all endpoints (user workstations and servers), Group Policy Objects on Domain
    Controllers'
  range: Last 90 days; baseline derived from 30+ days of history
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      prevalence = count_distinct_hosts(key, value) / total_hosts
      if prevalence < 0.01: flag(key, value)
      baseline = per_host_daily_count(office_security_4657, lookback=30d)
      if today_count(host) > mean(baseline) + 3*stddev(baseline): flag(host)
      emit alert(host, key, value, prevalence, today_count)
- question: Does a user or host's Office registry-modification behavior deviate from its OU/role peer
    group (UEBA peer-group anomaly)?
  context: A registry edit that is globally common may still be anomalous for a specific user's peer group.
    Compare each user/host's Office registry-modification behavior against OU/role peers (per Sentinel
    UEBA peer-group anomaly detection) and alert on peer-relative deviation. This reduces false positives
    from broadly common but locally unusual edits and highlights compromised accounts behaving unlike
    their peers.
  answer_sources:
  - WinEventLog:Sysmon EventCode=13,14 (RegistryValueSet)
  - Windows Event ID 4657
  - Windows Event ID 4688
  - 'NAI: Windows Registry on all endpoints (user workstations and servers), Group Policy Objects on Domain
    Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      peer_group = peers_by_OU_role(user)
      peer_baseline = office_reg_mod_profile(peer_group)
      dev = deviation(user.office_reg_mods, peer_baseline)
      if dev > peer_threshold: emit alert(user, host, dev, anomalous_keys)
- question: Does a supervised registry-edit chain classifier flag the modification based on modifying
    process, key, value, and parent-child lineage, with the modifying-process rarity profiled explicitly?
  context: A model over (modifying process, key, value, parent-child lineage) features (per the ProblemChild
    parent-child probability + XGBoost approach) ranks suspicious registry edits and explains why. Surface
    the top-3 contributing features and profile the modifying-process rarity explicitly rather than emitting
    a bare score. A high-ranked edit by a rare process with anomalous lineage is a strong persistence
    lead.
  answer_sources:
  - WinEventLog:Sysmon EventCode=13,14 (RegistryValueSet)
  - Windows Event ID 4657
  - Windows Event ID 4688
  - 'NAI: Windows Registry on all endpoints (user workstations and servers), Group Policy Objects on Domain
    Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features = (modifying_process, key, value, parent_child_lineage, process_rarity)
      score = reg_edit_chain_model.predict_proba(features)
      if score > threshold:
          emit alert(host, user, key, value, score, top3_features(features))
- question: Has an Office application (WINWORD.EXE, EXCEL.EXE, POWERPNT.EXE, MSACCESS.EXE) spawned a denylisted
    child process such as cmd.exe, powershell.exe, pwsh.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe,
    regsvr32.exe, certutil.exe, bitsadmin.exe, or schtasks.exe?
  context: When a template macro executes at startup it typically spawns a shell, script interpreter,
    or LOLBin to carry out the next stage. Office apps rarely launch these children during normal use,
    so a denylist match is a high-fidelity indicator that a macro ran (Persistence). Maintain a tuned
    allowlist of benign add-in children and keep the denylist concrete. A positive match warrants immediate
    investigation of the spawned command line.
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=1 (ProcessCreate)
  - WinEventLog:Microsoft-Office-Alerts
  - 'NAI: User workstations, remote desktop servers, and virtual desktop infrastructure (VDI) endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source IN ("WinEventLog:4688","Sysmon:EID1")
      | where parent_image IN ("WINWORD.EXE","EXCEL.EXE","POWERPNT.EXE","MSACCESS.EXE")
      | where child_image IN (cmd.exe,powershell.exe,pwsh.exe,wscript.exe,cscript.exe,mshta.exe,rundll32.exe,regsvr32.exe,certutil.exe,bitsadmin.exe,schtasks.exe)
      | where child_image NOT IN (allowlist_benign_addin_children)
      | emit alert(host, user, parent_image, child_image, command_line)
- question: Is an Office-child process image rare for the host/OU baseline, or does its command line have
    Shannon entropy in the top 1% or above the >7.0 obfuscation band?
  context: Even outside the fixed denylist, a child image that is rare for the host/OU, or a command line
    with very high entropy, indicates obfuscated macro-driven execution. Combine per-host/OU rarity with
    fleet prevalence and command-line entropy scoring; report the entropy value and rarity in the alert.
    High entropy and rarity together strongly suggest encoded payloads launched by a template macro.
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=1 (ProcessCreate)
  - WinEventLog:Microsoft-Office-Alerts
  - 'NAI: User workstations, remote desktop servers, and virtual desktop infrastructure (VDI) endpoints'
  range: Last 90 days; baseline derived from 30+ days of history
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      rarity = 1 - (count(child_image on host/OU) / total_proc)
      H = shannon_entropy(command_line)
      if rarity high OR H > 7.0 OR H in top_1pct:
          emit alert(host, parent_image, child_image, command_line, H, rarity)
- question: Are there bursts of Microsoft-Office-Alerts macro-block or warning events on a host, indicating
    repeated attempts to run blocked template macros even when execution does not succeed?
  context: 'Macro-block/warning events are a distinct failure signal: even when modern Office blocks the
    macro, repeated attempts show an adversary trying to execute template persistence. Baseline normal
    macro-block rates per host and alert on bursts. This catches in-progress attempts that produce no
    successful child process, which content/process detections would miss.'
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=1 (ProcessCreate)
  - WinEventLog:Microsoft-Office-Alerts
  - 'NAI: User workstations, remote desktop servers, and virtual desktop infrastructure (VDI) endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = per_host_daily_count("Microsoft-Office-Alerts":macro_block, lookback=30d)
      if today_count(host) > mean(baseline) + 3*stddev(baseline) OR today_count(host) > burst_floor:
          emit alert(host, today_count, sample_alerts)
- question: Does an anomalous parent-child chain classifier rank the Office-parent process chain as suspicious
    using parent-child pair probabilities, graph features, and XGBoost?
  context: A trained model (ProblemChild-style) ranks Office-parent process chains by pair rarity, graph
    features, and gradient boosting, surfacing the top-3 contributing features (pair rarity, command-line
    tokens, signing status). This catches macro-driven execution chains that evade fixed denylists. A
    high-ranked chain with rare pairings and unsigned children is a strong indicator of template-macro
    persistence executing.
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=1 (ProcessCreate)
  - WinEventLog:Microsoft-Office-Alerts
  - 'NAI: User workstations, remote desktop servers, and virtual desktop infrastructure (VDI) endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features = (parent_child_pair_prob, graph_features, command_line_tokens, signing_status)
      score = problemchild_model.predict_proba(features)
      if score > threshold:
          emit alert(host, parent_image, child_image, score, top3_features(features))
- question: Does a hybrid-feature command-line classifier (text/token/function/AST features with gradient
    boosting) score the spawned command line as malicious?
  context: PowerShell and script command lines launched by Office macros can be scored with hybrid text/token/function/AST
    features and a gradient-boosted classifier (per Fang et al.). Emit feature-importance explanations
    rather than a bare score so analysts can validate. A high score on an Office-spawned command line
    indicates malicious macro execution and supports confirming the persistence chain.
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=1 (ProcessCreate)
  - WinEventLog:Microsoft-Office-Alerts
  - 'NAI: User workstations, remote desktop servers, and virtual desktop infrastructure (VDI) endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features = hybrid(command_line: text, tokens, function_calls, AST)
      score = cmdline_model.predict_proba(features)
      if score > threshold:
          emit alert(host, parent_image, command_line, score, feature_importance)
- question: Has an Office application process initiated an outbound connection or DNS lookup to a destination
    that matches threat intel, Tor exit lists, low DNS reputation, or newly observed/registered infrastructure,
    shortly after template modification or loading?
  context: Office processes generally should not make arbitrary outbound connections; macro persistence
    often beacons or downloads a payload after the template loads (Persistence). Enrich Office-initiated
    connections (Zeek/Sysmon EID 3/22) with threat intel, Tor exit lists, DNS reputation, and domain age,
    and alert on matches or first-seen/newly registered destinations. A positive match is strong evidence
    of callback or staging.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=3 (NetworkConnect),22 (DnsQuery)
  - 'NAI: Network egress points, DNS resolvers, User workstations'
  range: Last 90 days; correlate to template write/load events in the preceding hours
  queries:
  - technology: Zeek/pseudocode
    query: |-
      conns = join(conn.log, dns.log) where orig_process IN (WINWORD,EXCEL,POWERPNT,MSACCESS)
      | enrich ti=threat_intel(dest), tor=tor_exit(dest), rep=dns_reputation(domain), age=domain_age(domain)
      | where ti.match OR tor OR rep.low OR age < 30d OR first_seen(dest)
      | emit alert(host, orig_process, dest, domain, enrichments)
- question: Is an Office app connecting to a new country, ASN, or domain it has not used before, or transferring
    orig_bytes above the 98th percentile of its baseline?
  context: Baseline each Office app's destination countries, ASNs, domains, and orig_bytes, then flag
    new countries/ASNs or sessions above the 98th percentile, combining per-host std-dev baselines with
    fleet prevalence. New destinations and large transfers from an Office process are anomalous and may
    indicate payload download or exfil staging triggered by a template macro.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=3 (NetworkConnect),22 (DnsQuery)
  - 'NAI: Network egress points, DNS resolvers, User workstations'
  range: Last 90 days; baseline derived from 30+ days of history
  queries:
  - technology: Zeek/pseudocode
    query: |-
      baseline = per_host_office_dest_profile(country, asn, domain, orig_bytes, lookback=30d)
      if dest.country NOT IN baseline.countries OR dest.asn NOT IN baseline.asns: flag(new_dest)
      if session.orig_bytes > p98(baseline.orig_bytes): flag(volume)
      emit alert(host, orig_process, dest, orig_bytes)
- question: Does an Office process's outbound byte volume or connection count exceed the upper confidence
    bound of an ARIMA (or Prophet) forecast of its normal behavior?
  context: Time-series forecasting models normal per-host Office network volume; observed traffic above
    the forecast's upper confidence bound is anomalous (per Kozitsin et al.). Report the forecast-vs-observed
    delta in the alert. A breach of the bound shortly after template activity suggests macro-driven exfiltration
    or beaconing that simple thresholds would miss.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=3 (NetworkConnect),22 (DnsQuery)
  - 'NAI: Network egress points, DNS resolvers, User workstations'
  range: Last 90 days; forecast trained on rolling 30-60 day history
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      model = ARIMA(per_host_office_orig_bytes_series)
      forecast, upper = model.predict(now)
      if observed(now) > upper:
