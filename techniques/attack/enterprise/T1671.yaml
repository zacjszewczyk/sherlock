questions:
- question: '[Persistence] Can you identify any OAuth consent or application-grant event whose Application
    ID, publisher name, or redirect URI matches a known-bad indicator from a threat-intelligence feed
    -- specifically using the ''App TI correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary leverages an OAuth application
    integration so its service principal retains access even after the consenting account loses access.
    Known-bad integrations -- AppIds, publisher names, or redirect URIs already attributed to consent-phishing
    or backdoor campaigns -- are the highest-confidence signal of malicious persistence. This Symbolic
    Logic approach matches OAuth consent events (''Consent to application'', ''Add OAuth2PermissionGrant'',
    ''Add app role assignment grant to user'') in the Unified Audit Log and Entra audit logs against threat-intelligence-listed
    AppIds, publishers, and redirect URIs, and alerts on any hit. The alert text must name the matched
    indicator, the granting user, and the granted scopes per the canonical Entra/UAL event list (Detecting
    Microsoft 365 and Azure AD Backdoors, Mandiant). A positive result -- a TI match -- is strong evidence
    of a malicious integration; pivot immediately to the granting user, the service principal''s owner,
    the granted scopes, and any data the principal has since accessed, then move to revoke consent and
    the app''s tokens. A negative result lowers the likelihood of a known campaign but does not rule out
    a novel app, so corroborate with the first-seen and rarity questions below.'
  answer_sources:
  - Microsoft 365 Unified Audit Log
  - Azure Active Directory Audit Logs
  - Threat Intelligence Platform Data
  - 'NAI: Microsoft Entra ID tenant, Threat intelligence platforms'
  range: Last 90 days (correlate event-centered windows of +/- 24 hours around the consent event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# App TI correlation (Symbolic Logic)

      source IN [M365 UnifiedAuditLog, EntraID AuditLogs]

      | where Operation IN (''Consent to application'',''Add OAuth2PermissionGrant'',''Add app role assignment
      grant to user'')

      | join TI on (AppId == TI.appid OR PublisherName == TI.publisher OR RedirectUri == TI.redirect_uri)

      | emit alert(matched_indicator, granting_user, app_id, granted_scopes)'
- question: '[Persistence] Can you find any OAuth consent where the (granting user, client AppId) pair
    has not been observed in the prior 14 days, prioritizing grants that carry offline_access (refresh
    token) or ConsentContext_OnBehalfOfAll=true -- specifically using the ''First-seen consent rule''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), durable access is created the moment
    a user consents to an app and that app receives a refresh token (offline_access) or tenant-wide (admin)
    consent. A first-seen (granting user, client AppId) pair is a behavioral floor rule: it catches the
    very first time a given user authorizes a given app, which is exactly when consent-phishing succeeds.
    This Symbolic Logic approach alerts when the pair has not been seen in the prior 14 days and prioritizes
    grants carrying offline_access or ConsentContext_OnBehalfOfAll=true, because refresh-token and on-behalf-of-all
    grants create durable, MFA-bypassing access (A Comprehensive Formal Security Analysis of OAuth 2.0;
    template/triage fields from Elastic''s illicit-consent-grant rule). A positive result means a new,
    persistence-capable grant occurred; validate whether the user and app are legitimate, inspect the
    scopes, and check for refresh-token issuance. A negative result indicates the consent is to a previously
    trusted app, lowering risk, though a co-opted existing app would not trip this rule -- pair it with
    the credential-addition question.'
  answer_sources:
  - Microsoft 365 Unified Audit Log
  - Azure Active Directory Audit Logs
  - Threat Intelligence Platform Data
  - 'NAI: Microsoft Entra ID tenant, Threat intelligence platforms'
  range: Last 90 days (14-day first-seen lookback per (user, AppId) pair)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# First-seen consent rule (Symbolic Logic)

      source = UnifiedAuditLog where Operation == ''Consent to application''

      | key = (granting_user, client_app_id)

      | if key NOT seen in prior 14 days then candidate

      | priority = HIGH if scopes contains ''offline_access'' OR ConsentContext_OnBehalfOfAll == true

      | emit alert(granting_user, client_app_id, scopes, priority)'
- question: '[Persistence] Can you score OAuth publisher domains and AppIds by their 180-day tenant-wide
    consent frequency and cross-tenant prevalence, flagging apps below the 5th percentile or consented
    to by very few users -- specifically using the ''Publisher rarity scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), malicious integrations are almost
    always rare -- a custom or attacker-controlled app is consented to by only one or a handful of users
    and has little or no community/cross-tenant footprint, unlike a widely adopted SaaS product. This
    Statistical Method scores each publisher domain/AppId by 180-day tenant-wide consent frequency AND
    cross-tenant prevalence (community use), flagging apps below the 5th percentile or consented to by
    very few users -- an explicit OAuth risk indicator (Investigate risky OAuth apps, Microsoft Defender
    for Cloud Apps). A positive result (a rare publisher/app) is a prioritization signal: investigate
    the app''s scopes, publisher verification, and which users consented. A negative result (a common,
    widely-used app) lowers risk but does not clear an app that has been co-opted; combine with the high-risk-scope
    and TI questions.'
  answer_sources:
  - Microsoft 365 Unified Audit Log
  - Azure Active Directory Audit Logs
  - Threat Intelligence Platform Data
  - 'NAI: Microsoft Entra ID tenant, Threat intelligence platforms'
  range: Last 180 days (rolling rarity baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Publisher rarity scoring (Statistical Method)

      baseline = consent_events last 180d grouped by publisher_domain, app_id

      | freq = count(distinct granting_user) per app; prevalence = cross_tenant_use(app)

      | score = percentile_rank(freq) blended with prevalence

      | flag where score < 5th percentile OR distinct_users <= 2

      | emit ranked rare apps with scopes and consenters'
- question: '[Persistence] Can you profile blocked or declined OAuth consents (admin-consent-required
    denials, Conditional-Access blocks) per app and per user to detect bursts of failed consent prompts
    that precede a successful grant -- specifically using the ''Consent failure-rate profiling'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), consent-phishing campaigns frequently
    generate failed attempts before they succeed -- users hit admin-consent-required denials or Conditional-Access
    blocks, then the attacker retargets or escalates. A burst of failed consent prompts is therefore an
    early indicator of an active campaign distinct from the eventual successful grant. This Statistical
    Method profiles blocked/declined consents per app and per user against a behavioral baseline and flags
    bursts (Create anomaly detection policies, Microsoft Defender for Cloud Apps). A positive result --
    an anomalous spike of failed consent prompts -- warrants proactive hunting for a subsequent success
    from the same app/user and user awareness/lockdown. A negative result indicates no observable consent-phishing
    failure pattern, though a clean single successful grant would not produce failures; corroborate with
    the first-seen and high-risk-scope rules.'
  answer_sources:
  - Microsoft 365 Unified Audit Log
  - Azure Active Directory Audit Logs
  - Threat Intelligence Platform Data
  - 'NAI: Microsoft Entra ID tenant, Threat intelligence platforms'
  range: Last 90 days (per-app and per-user failure baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Consent failure-rate profiling (Statistical Method)

      failed = consent_events where result IN (''admin_consent_required'',''blocked_by_CA'',''declined'')

      | series = count per (app_id) and per (user) over 1h buckets

      | baseline mean,std per entity over 30d

      | flag buckets > mean + 3*std (burst)

      | emit alerts pivoting to any subsequent successful consent for same app/user'
- question: '[Persistence] Can you apply a trained Random Forest classifier to OAuth consent features
    (publisher strings, redirect-URI age, scope-risk score, first-seen flag, granting-user privilege)
    and alert on consents scoring above 0.85, surfacing the top-3 feature importances -- specifically
    using the ''Consent classifier'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), no single deterministic rule captures
    every malicious integration; a supervised model can weigh many weak OAuth risk indicators together.
    This Machine Learning approach trains a Random Forest on consent features -- publisher strings, redirect-URI
    age, scope-risk score, first-seen flag, and granting-user privilege -- and alerts on scores above
    0.85, emitting the top-3 contributing feature importances (e.g., rare publisher, high-risk scope,
    first-seen pair) in the alert text so analysts can triage quickly. The feature set is derived from
    documented OAuth risk indicators (Investigate risky OAuth apps, Microsoft Defender for Cloud Apps).
    A positive result is a model-prioritized consent for human review; use the surfaced features to confirm.
    A negative result lowers risk but, like any model, can miss novel patterns, so deterministic floor
    rules (TI match, first-seen) must run in parallel.'
  answer_sources:
  - Microsoft 365 Unified Audit Log
  - Azure Active Directory Audit Logs
  - Threat Intelligence Platform Data
  - 'NAI: Microsoft Entra ID tenant, Threat intelligence platforms'
  range: Last 90 days (model scored on incoming consent events; retrain monthly)
  queries:
  - technology: SIEM/ML pseudocode
    query: '# Consent classifier (Machine Learning)

      features = [publisher_string_embeddings, redirect_uri_age, scope_risk_score, first_seen_flag, granting_user_privilege]

      model = RandomForestClassifier(trained on labeled consent corpus)

      | score = model.predict_proba(consent_event)

      | alert where score > 0.85 with top3_feature_importances

      | emit(app_id, granting_user, scopes, score, top3_features)'
- question: '[Persistence] Can you detect new application registrations or consents whose display names
    show typosquatting or homoglyph impersonation (e.g., M.crosoft, 0ffice, Goog1e) or impersonate a verified
    first-party app, cross-checked against publisher-verification status -- specifically using the ''Impersonation
    regex rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), adversaries name their malicious
    OAuth apps to look like trusted vendors so users grant consent without suspicion. This Symbolic Logic
    approach applies regex to app display names for typosquatting/homoglyph patterns (M.crosoft, 0ffice,
    Goog1e) and for impersonation of verified first-party apps, then cross-checks against the app''s publisher-verification
    status -- a documented risk indicator (Investigate risky OAuth apps, Microsoft Defender for Cloud
    Apps; multi-SaaS rule templates from Panther Analysis). A positive result -- a deceptive name from
    an unverified publisher -- is a strong consent-phishing indicator; pull the consenting users, scopes,
    and redirect URI and consider blocking the app. A negative result lowers the likelihood of brand impersonation
    but a legitimately-named malicious app would evade it; pair with the publisher-age and redirect-URI
    questions.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Microsoft Entra ID tenant, Public DNS and WHOIS services, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Impersonation regex rule (Symbolic Logic)

      source = app_registration/consent events

      | regex display_name for homoglyphs/typosquats (M.crosoft|0ffice|Goog1e|micr0soft|0ffice365)

      | OR fuzzy_match(display_name, first_party_app_names) AND publisher_verified == false

      | emit alert(app_id, display_name, publisher_verified, consenters)'
- question: '[Persistence] Can you alert on app registrations or consents whose redirect URIs are non-HTTPS,
    localhost, wildcard, or do not exactly match the publisher''s verified domains -- specifically using
    the ''Redirect-URI integrity rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), the redirect URI is the core OAuth
    attack surface -- an attacker who controls or loosely-matches the redirect endpoint can intercept
    authorization codes and tokens. This Symbolic Logic floor rule alerts on registrations/consents whose
    redirect URIs are non-HTTPS, localhost, wildcard, or do not exactly match the publisher''s verified
    domains; exact-match redirect-URI integrity is proven critical to OAuth security (A Comprehensive
    Formal Security Analysis of OAuth 2.0, Fett, Küsters, and Schmitz). A positive result -- a loose or
    mismatched redirect URI -- indicates a misconfigured or malicious app capable of token theft; investigate
    the app, its owner, and the consenting users. A negative result (clean, exact-match HTTPS redirect
    to a verified domain) lowers risk but does not clear a co-opted app that reuses a legitimate redirect;
    corroborate with the impersonation and high-risk-scope rules.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Microsoft Entra ID tenant, Public DNS and WHOIS services, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Redirect-URI integrity rule (Symbolic Logic)\nsource = app_registration/consent events\n\
      | flag where redirect_uri NOT startswith 'https://'\n   OR redirect_uri matches (localhost|127.0.0.1|*wildcard*)\n\
      \   OR host(redirect_uri) NOT in publisher_verified_domains (exact match)\n| emit alert(app_id,\
      \ redirect_uri, publisher_domains)"
- question: '[Persistence] Can you flag new publishers whose WHOIS domain age is under 90 days, or app
    names with Levenshtein distance 1-2 from known apps, and profile the unverified-publisher consent
    rate per day -- specifically using the ''Publisher age scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), freshly-registered domains and near-miss
    app names are hallmarks of throwaway attacker infrastructure used for consent phishing. This Statistical
    Method flags new publishers with WHOIS domain age under 90 days, or app names with Levenshtein distance
    1-2 from known apps (typosquats), and profiles the unverified-publisher consent rate per day as a
    baseline-deviation signal (Investigate risky OAuth apps, Microsoft Defender for Cloud Apps). Zeek
    dns.log and WHOIS enrichment supply domain-age context for publisher/redirect domains observed in
    egress traffic. A positive result -- a young domain or near-duplicate name with rising consent rate
    -- prioritizes the app for review. A negative result lowers suspicion but established attacker domains
    older than 90 days would evade the age check; combine with TI correlation and the impersonation cluster
    detector.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Microsoft Entra ID tenant, Public DNS and WHOIS services, Network egress points'
  range: Last 90 days (WHOIS age check + daily unverified-consent-rate baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Publisher age scoring (Statistical Method)

      for each app: domain_age = now - whois_creation(publisher_domain)

      | flag domain_age < 90d

      | OR min Levenshtein(app_name, known_app_names) in [1,2]

      | baseline daily_unverified_consent_rate; flag deviation > 3*std

      | emit ranked(app_id, publisher_domain, domain_age, nearest_name)'
  - technology: Zeek/pseudocode
    query: '# Publisher age scoring (Zeek dns view)

      watch dns.log for queries to publisher/redirect domains seen in consents

      | enrich with WHOIS creation date

      | flag domains first-resolved within 90d or newly registered

      | emit candidate young-domain apps'
- question: '[Persistence] Can you cluster app-name feature vectors (character n-grams, non-ASCII/homoglyph
    indicators) with DBSCAN and investigate small or noise clusters, surfacing the nearest legitimate
    app name -- specifically using the ''Impersonation cluster detector'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), brand-impersonating app names that
    evade fixed regex still cluster oddly in feature space -- they sit near a legitimate name but carry
    non-ASCII or homoglyph signatures that place them in small or noise clusters. This Machine Learning
    approach encodes app names as feature vectors (character n-grams, non-ASCII/homoglyph indicators),
    clusters them with DBSCAN, and investigates small/noise clusters, surfacing the nearest legitimate
    app name in the alert (feature-engineered representation approach from Deep Learning for Insider Threat
    Detection, Yuan and Wu). A positive result -- an outlier name near a trusted brand -- is a candidate
    impersonation app for review. A negative result lowers suspicion but the method is unsupervised and
    benign rare names can appear; treat it as a prioritization aid alongside the deterministic impersonation
    regex and redirect-URI rules.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Microsoft Entra ID tenant, Public DNS and WHOIS services, Network egress points'
  range: Last 90 days (periodic re-clustering of observed app names)
  queries:
  - technology: SIEM/ML pseudocode
    query: '# Impersonation cluster detector (Machine Learning)

      vectors = encode(app_display_names -> char_ngrams + nonascii/homoglyph_flags)

      clusters = DBSCAN(vectors, eps, min_samples)

      | investigate noise points and small clusters

      | for each outlier compute nearest legitimate app name

      | emit(app_id, display_name, nearest_legit_name)'
- question: '[Persistence] Can you alert when an OAuth consent grants high-risk scopes such as Mail.ReadWrite.All,
    full_access_as_app, Directory.ReadWrite.All, Application.ReadWrite.All, or offline_access combined
    with mail/file scopes -- specifically using the ''High-risk permission rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), the danger of a malicious integration
    scales with the scopes it holds -- full_access_as_app to Exchange Online was the exact grant APT29/Midnight
    Blizzard used to read mailboxes at will (Midnight Blizzard Microsoft Breach Analysis, Wiz). This Symbolic
    Logic floor rule alerts whenever a consent grants high-privilege scopes (Mail.ReadWrite.All, full_access_as_app,
    Directory.ReadWrite.All, Application.ReadWrite.All, or offline_access combined with mail/file scopes),
    using the high-privilege scope lists from Microsoft Defender for Cloud Apps and Mandiant. A positive
    result -- a high-risk scope grant -- demands review regardless of the app''s reputation; confirm business
    need, the granting user, and whether a refresh token was issued. A negative result (only low-risk
    scopes) reduces but does not eliminate concern, since scope creep can follow via credential addition;
    pair with the credential-addition rule.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Microsoft Entra ID tenant, Network gateways and proxies, VPN concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# High-risk permission rule (Symbolic Logic)\nHIGH_RISK = {Mail.ReadWrite.All, full_access_as_app,\
      \ Directory.ReadWrite.All, Application.ReadWrite.All}\nsource = consent events\n| flag where granted_scopes\
      \ intersects HIGH_RISK\n   OR ('offline_access' in scopes AND scopes intersects {Mail.*, Files.*,\
      \ Sites.*})\n| emit alert(app_id, granting_user, granted_scopes)"
- question: '[Persistence] Can you score consent events by impossible travel, infrequent-country, and
    anonymous/Tor IP relative to the granting user''s baseline, flagging events outside the user''s top-95%
    locations or with high scope-entropy -- specifically using the ''Location/geo anomaly scoring'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), a consent granted from an IP or geography
    the user never uses -- or via Tor/anonymizing proxy -- suggests the account was compromised and is
    being used to authorize a persistence app. This Statistical Method scores consent events for impossible
    travel, infrequent-country, and anonymous/Tor IP relative to the granting user''s behavioral baseline,
    flagging events outside the user''s top-95% locations or with high scope-entropy (Create anomaly detection
    policies, Microsoft Defender for Cloud Apps). Zeek conn.log and Windows Event ID 4624 logons supply
    corroborating session origin/geo context. A positive result -- an anomalous-origin consent -- should
    be correlated with the user''s recent sign-ins and the granted scopes to confirm account takeover.
    A negative result lowers risk but an attacker operating from the user''s normal location/VPN would
    evade it; corroborate with the high-risk-scope and first-seen rules.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Microsoft Entra ID tenant, Network gateways and proxies, VPN concentrators'
  range: Last 90 days (per-user location baseline; +/- correlate sign-in geo)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "# Location/geo anomaly scoring (Statistical Method)\nfor each consent: user_baseline = top95_locations(user,\
      \ 90d)\n| flag if src_geo NOT in baseline\n   OR impossible_travel(prev_signin, this_event)\n  \
      \ OR ip in {Tor, anon_proxy, infrequent_country}\n   OR scope_entropy high\n| emit(app_id, granting_user,\
      \ src_ip, geo, anomaly_reasons)"
  - technology: Zeek/pseudocode
    query: '# Location/geo corroboration (Zeek conn view)

      join consent.src_ip to conn.log/4624 logon origin

      | enrich asn, geo, anon/tor reputation

      | flag sessions from new ASN/country for the user near consent time'
- question: '[Persistence] Can you profile Conditional-Access-blocked or admin-consent-required-denied
    consent attempts originating from anomalous IPs or ASNs as a distinct consent-phishing indicator --
    specifically using the ''Blocked-consent failure profiling'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), failed consent attempts from suspicious
    network origins are a separate, earlier signal than a successful grant -- they reveal an attacker
    probing for a way in before persistence is achieved. This Statistical Method profiles Conditional-Access-blocked
    or admin-consent-required-denied consent attempts originating from anomalous IPs/ASNs and treats them
    as a distinct consent-phishing indicator (Create anomaly detection policies, Microsoft Defender for
    Cloud Apps), enriched with Zeek conn.log network context. A positive result -- blocked consents from
    odd ASNs -- warrants proactive hunting for a follow-on success and tightening of consent policy. A
    negative result indicates no observed blocked-consent campaign, though a policy that silently allows
    consent would produce no failures; pair with the first-seen and high-risk-scope rules.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Microsoft Entra ID tenant, Network gateways and proxies, VPN concentrators'
  range: Last 90 days (per-app/per-IP failure baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Blocked-consent failure profiling (Statistical Method)

      failed = consent attempts where result IN (''blocked_by_CA'',''admin_consent_required_denied'')

      | enrich src_ip with asn, geo, reputation

      | baseline failures per app and per asn

      | flag bursts from anomalous/low-reputation ASNs

      | emit alerts pivoting to subsequent successful consents'
- question: '[Persistence] Can you apply a trained Isolation Forest to consent features (granting-user
    role, permission-risk score, hour-of-day, IP reputation, scope-count entropy) and alert above the
    99th percentile of anomaly score, surfacing the top-3 contributing features -- specifically using
    the ''Consent anomaly detector'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), malicious consents are anomalous
    along several dimensions at once -- an unusual user role, high-risk scopes, off-hours timing, poor
    IP reputation, and high scope-count entropy. This Machine Learning approach trains an Isolation Forest
    on those consent features and alerts above the 99th percentile of anomaly score, surfacing the top-3
    contributing features in the alert (Isolation Forest, Liu, Ting, and Zhou). A positive result is a
    model-prioritized outlier consent for human review; use the surfaced features to confirm. A negative
    result lowers risk, but unsupervised isolation scoring can miss low-and-slow grants that resemble
    normal activity, so run the deterministic high-risk-scope and TI rules alongside it.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Microsoft Entra ID tenant, Network gateways and proxies, VPN concentrators'
  range: Last 90 days (model scored on incoming consents; retrain monthly)
  queries:
  - technology: SIEM/ML pseudocode
    query: '# Consent anomaly detector (Machine Learning)

      features = [granting_user_role, permission_risk_score, hour_of_day, ip_reputation, scope_count_entropy]

      model = IsolationForest(trained on consent history)

      | score = model.anomaly_score(consent_event)

      | alert where score > 99th percentile with top3_contributing_features

      | emit(app_id, granting_user, score, top3_features)'
- question: '[Persistence] Can you alert when service-principal sign-ins (ServicePrincipalSignIn) or data
    access originate from threat-intelligence-listed malicious IPs, Tor, or proxies, mapping the principal
    to its owning app and surfacing the owner -- specifically using the ''Service principal TI correlation''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), a malicious or co-opted integration
    acts through its service principal; sign-ins or data access from known-bad infrastructure reveal the
    persistence in use. This Symbolic Logic approach alerts when ServicePrincipalSignIn events or data
    access originate from TI-listed malicious IPs/Tor/proxies, maps the principal to its owning app, and
    surfaces the owner in the alert (Detecting Microsoft 365 and Azure AD Backdoors, Mandiant). A positive
    result -- a service principal authenticating from bad infrastructure -- is high-confidence evidence
    of an abused integration; revoke its credentials and scope the data it touched. A negative result
    lowers risk for known-bad origins but a principal operating from clean cloud IPs would evade it; corroborate
    with the unusual-client-AppId and access-volume questions.'
  answer_sources:
