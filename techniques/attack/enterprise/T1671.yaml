- question: '[Persistence] Can you correlate endpoint CLI process events (az ad sp create, New-AzureADServicePrincipal/New-MgServicePrincipal,
    gcloud iam service-accounts create) with Entra ''Add service principal'' / ''Add service principal
    credentials'' audit events on matching names within a short window -- specifically using the ''Service
    principal creation correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), creating a dedicated service principal
    (and assigning it cloud roles) is a common way to stand up an integration-based backdoor; correlating
    the on-endpoint CLI invocation with the cloud-side creation event ties the action to a specific host
    and user. This Symbolic Logic approach correlates Windows Event ID 4688 process creations for cloud
    CLI tools (az ad sp create, New-AzureADServicePrincipal/New-MgServicePrincipal, gcloud iam service-accounts
    create) with Entra ''Add service principal'' / ''Add service principal credentials'' audit events
    on matching names within a short window (Detecting Microsoft 365 and Azure AD Backdoors, Mandiant).
    A positive result -- a matched endpoint+cloud creation pair -- attributes the new principal to a host/user
    and warrants validating its legitimacy. A negative result lowers suspicion of endpoint-driven creation,
    though portal/API-only creation would not produce a 4688; pair with the credential-addition and creation-frequency
    rules.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Enterprise workstations and servers, Microsoft Entra ID tenant'
  range: Last 90 days (correlate +/- 30 minutes between 4688 and Entra audit event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Service principal creation correlation (Symbolic Logic)

      proc = 4688 where CommandLine matches (''az ad sp create''|''New-AzureADServicePrincipal''|''New-MgServicePrincipal''|''gcloud
      iam service-accounts create'')

      audit = EntraID where Operation IN (''Add service principal'',''Add service principal credentials'')

      | join proc.target_name == audit.sp_name within 30m

      | emit(host, user, sp_name, command_line)'
- question: '[Persistence] Can you alert on ''Add service principal credentials'' (a new client secret/key
    credential) added to an existing application, especially by an account with no prior app-management
    history -- specifically using the ''Credential addition rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), co-opting an existing trusted app
    by quietly adding a new client secret/key is a stealthy backdoor -- the app already has consent and
    scopes, so a fresh credential gives the attacker durable access without a new consent prompt. This
    Symbolic Logic state signal alerts on ''Add service principal credentials'' to an existing app, especially
    by an account with no prior app-management history, a documented backdoor pattern (Detecting Microsoft
    365 and Azure AD Backdoors, Mandiant). A positive result -- an unexpected actor adding a credential
    to a privileged app -- is high-priority; verify the change, the app''s scopes, and remove unauthorized
    credentials. A negative result lowers risk, though a routine admin adding a credential can be benign;
    corroborate with the high-risk-scope and creation-correlation rules.'
  answer_sources:
