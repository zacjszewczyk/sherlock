name: 'T1671: Cloud Application Integration'
id: fc42c009-23e8-40e1-bd7d-0ed2b00edfa2
description: 'This playbook helps an analyst investigate whether an adversary is establishing or maintaining
  persistence in a software-as-a-service (SaaS) or Office Suite environment by leveraging OAuth application
  integrations (MITRE ATT&CK T1671, Cloud Application Integration). Adversaries may register a custom
  OAuth application, add a legitimate third-party app, or co-opt an existing integration, then grant it
  consent from a high-privileged account so the app''s service principal retains access to mail, files,
  and directory data even after the original account is disabled, password-reset, or MFA-challenged. Because
  integrations can hold refresh tokens and application access tokens, they survive credential changes
  and can bypass MFA, enabling durable access and automated exfiltration over time (as seen in the Midnight
  Blizzard/APT29 full_access_as_app Exchange grant). The hunt spans Microsoft 365 / Entra ID and other
  SaaS platforms (Slack, Salesforce) plus supporting endpoint and network telemetry, and pursues the behavior
  from several complementary angles: matching consent and app-registration events against threat-intelligence-listed
  AppIds, publishers, and redirect URIs; first-seen (user, AppId) consent floor rules prioritizing offline_access/refresh-token
  grants; impersonation and typosquatting/homoglyph detection on app display names; redirect-URI integrity
  checks; high-risk-scope consent rules; geo/impossible-travel anomaly scoring on consent origin; service-principal
  data-access baselining for volume, frequency, and sequence anomalies; first-seen client AppId access
  per mailbox/site; and correlation of endpoint CLI service-principal creation (az ad sp create, New-MgServicePrincipal,
  gcloud iam service-accounts create) and credential-addition events with subsequent sign-ins. Detection
  methods combine deterministic symbolic-logic rules (TI correlation, first-seen pairs, regex impersonation,
  redirect-URI integrity, high-risk scope lists, credential-addition state signals), statistical baselining
  (publisher rarity, consent/sign-in failure-rate profiling, geo anomaly, access-volume sigma scoring,
  creation-frequency and peer-group UEBA baselines), and machine learning (Random Forest and Isolation
  Forest consent scoring, DBSCAN impersonation clustering, LSTM/DeepLog access-sequence modeling, and
  graph-neural-network access anomaly detection), applied across the Microsoft 365 Unified Audit Log,
  Entra ID audit and sign-in logs, SaaS integration/audit logs, Zeek dns/conn logs, and Windows Event
  IDs 4624/4688, so the analyst can corroborate a suspected malicious integration against the granting
  user, app publisher, granted scopes, service-principal owner, and downstream data access.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
