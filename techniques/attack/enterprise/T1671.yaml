- question: '[Persistence] Can you flag service-principal creation or credential-addition performed by
    users whose UEBA peer group never performs that operation, surfacing the peer-relative deviation --
    specifically using the ''Peer-group baseline'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), a user who suddenly creates a service
    principal or adds app credentials -- when no one in their UEBA peer group ever does -- is a strong
    sign of either compromise or insider abuse, regardless of raw counts. This Statistical Method flags
    such operations by comparing the actor against their peer group''s behavior and surfaces the peer-relative
    deviation as alert evidence (Microsoft Sentinel UEBA). A positive result -- an out-of-peer-group app-management
    action -- prioritizes the user and the new principal for review. A negative result (the action is
    normal for the user''s role/peers) lowers risk, though a privileged admin abusing legitimate rights
    would blend in; corroborate with the credential-addition state signal and creation-frequency scoring.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Enterprise workstations and servers, Microsoft Entra ID tenant'
  range: Last 90 days (UEBA peer-group baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Peer-group baseline (Statistical Method)

      peer_group = UEBA cluster(user) by role/dept/behavior

      operation IN (''create service principal'',''add sp credentials'')

      | flag if peer_group historical_rate(operation) ~ 0 but user performed it

      | emit(user, peer_group, operation, peer_relative_deviation)'
- question: '[Persistence] Can you train a classifier on post-creation features (time-to-first-sign-in,
