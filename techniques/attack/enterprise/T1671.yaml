    indicates bulk download or staging. This Statistical Method scores hourly bytes and item/file counts
    per principal versus a 30-day baseline and flags >3-sigma spikes or counts above the 99th percentile,
    combining per-entity volume baselines (Create anomaly detection policies, MDCA) with the volume/frequency
    feature framing (Deep Learning for Insider Threat Detection, Yuan and Wu). A positive result -- a
    volume spike -- should trigger scoping of what data was accessed and whether it left the tenant. A
    negative result indicates access within normal bounds, though low-and-slow exfiltration may stay under
    threshold; pair with the access-sequence and graph anomaly models.'
