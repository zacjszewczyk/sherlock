    per Elastic''s unusual-OAuth-client-AppId rule. A positive result -- a new app accessing a sensitive
    mailbox/site -- should be checked against the app''s consent history, owner, and scopes. A negative
    result indicates access by a previously-seen app, lowering risk, though a long-dormant malicious app
    could appear legitimate; pair with TI correlation and the access-sequence model.'
