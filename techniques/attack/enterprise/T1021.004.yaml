name: 'T1021.004: SSH'
id: abf350f2-99dd-409e-b73d-8b17d42cad7c
description: 'Investigate adversary use of Secure Shell (SSH) for lateral movement and remote access across
  Linux, macOS, and ESXi hosts (including Windows pivot/management workstations that launch SSH clients).
  This playbook helps an analyst hunt for malicious or anomalous SSH activity from several complementary
  angles: SSH handshakes whose client/server version strings, JA4/JA4SSH fingerprints, or host keys match
  known-bad threat intelligence or are rare for the enterprise; brute-force and default-credential abuse
  evidenced by high authentication-failure ratios; SSH client processes invoked with automation/evasion
  flags (e.g., StrictHostKeyChecking=no, BatchMode, /dev/null known-hosts, sshpass, plink); novel user-to-host
  or host-to-host authentication pathways, credential switches, and anomalous source geolocation/ASN or
  off-hours logins; fan-out where one source reaches many distinct destinations consistent with automated
  lateral movement or credential spraying; and SSH sessions used for port forwarding/tunneling or exhibiting
  byte-volume, byte-ratio, and duration characteristics consistent with bulk transfer rather than interactive
  shells. Each question pairs symbolic-logic, statistical, and machine-learning methods so an analyst
  can move from a high-confidence indicator match to behavioral and graph-based anomaly detection while
  staying grounded in endpoint and network telemetry.'
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Does any observed SSH handshake match a known-bad client/server version string, host key hash,
    or JA4/JA4SSH fingerprint from threat intelligence, or has a server's pinned host key unexpectedly
    changed?
  context: 'This question matches SSH session metadata against curated threat intelligence to catch adversary
    tooling and impersonation. Maintain a feed of known-bad SSH client/server version strings (for example
    libssh exploit clients, or ''PuTTY''/''WinSCP'' strings appearing as clients on Linux servers), host_key
    hashes, and JA4SSH fingerprints, then compare the ''client'', ''server'', and ''host_key'' fields
    in Zeek ssh.log and JA4/JA4SSH fingerprints against those lists for exact matches. Also pin the expected
    host key per server and alert on any change, which can indicate a man-in-the-middle or an imposter
    host. A positive match is a strong, defensible lateral-movement indicator because it ties a specific
    connection to adversary infrastructure or tooling; a clean result lowers but does not eliminate suspicion.
    This is tactic-specific to Lateral Movement: adversaries reuse SSH clients and keys to pivot between
    systems, so a recognized fingerprint or an unexpected host-key swap directly exposes that pivot. References:
    [Zeek ssh.log](https://docs.zeek.org/en/master/scripts/base/protocols/ssh/main.zeek.html), [JA4+ suite](https://github.com/FoxIO-LLC/ja4).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - 'NAI: Network traffic inspection points (e.g., Zeek sensors), Bastion/jump hosts, Internet gateways,
    east-west taps in front of server subnets'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'ssh = ssh.log; alert when ssh.client in TI_clients OR ssh.server in TI_servers OR ssh.host_key
      in TI_hostkeys OR ssh.ja4ssh in TI_ja4ssh; also: expected=hostkey_baseline[ssh.id_resp_h]; alert
      when expected and ssh.host_key != expected; output client, server, host_key, ja4ssh, id_orig_h,
      id_resp_h, ts.'
- question: Which SSH client version strings or JA4SSH fingerprints are statistically rare across the
    enterprise over a rolling baseline, and on how few hosts do they appear?
  context: 'Rare client software or fingerprints often reveal attacker-introduced tooling that does not
    match the organization''s standard SSH clients. Over a 30-day rolling window, compute the enterprise
    frequency of every ''client'' string and JA4SSH fingerprint in Zeek ssh.log and flag any value below
    a rarity threshold (for example present in fewer than 0.01% of sessions or on fewer than 3 hosts),
    deriving the threshold per environment from the observed long-tail distribution. The alert should
    surface the rarity rank, host count, and first-seen time so the analyst can judge whether the rare
    client is a new admin tool or attacker tradecraft. For Lateral Movement, a never-before-seen client
    suddenly appearing on a sensitive server is a meaningful signal that an outsider has brought their
    own SSH tooling onto the network. References: [Zeek ssh.log](https://docs.zeek.org/en/master/scripts/base/protocols/ssh/main.zeek.html),
    [Bian et al](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - 'NAI: Network traffic inspection points (e.g., Zeek sensors), Bastion/jump hosts, Internet gateways,
    east-west taps in front of server subnets'
  range: Last 90 days, computed over a trailing 30-day rolling baseline
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'window = last 30d; for each client_str, ja4ssh in ssh.log: freq = count(sessions)/total; hosts
      = distinct(id_resp_h); first_seen = min(ts); flag when freq < 0.0001 OR hosts < 3; output client_str,
      ja4ssh, rarity_rank, hosts, first_seen.'
- question: Which source IPs exhibit a high SSH authentication-failure ratio and elevated attempt rate
    followed by a successful login, indicating brute-force or default-credential abuse?
  context: 'This question profiles authentication behavior to distinguish automated credential attacks
    from legitimate access. Using Zeek ssh.log ''auth_success'' and ''auth_attempts'' (and Linux auth.log/sshd),
    compute per source IP the failed-to-total auth ratio and attempts/min in a 5-minute window. Alert
    when attempts/min exceeds a baseline-derived threshold (for example more than 10 per minute) AND the
    failure ratio exceeds 0.8 followed by a single success — the scan-then-login pattern of automated
    default-credential abuse seen in botnets such as Mirai. Include the failure count, the success time,
    and the source in the alert. A high-failure burst that ends in success is far more suspicious than
    clean authentication and signals an adversary gaining a foothold to move laterally; a low failure
    ratio suggests normal credentialed access. References: [Understanding the Mirai Botnet](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - 'NAI: Network traffic inspection points (e.g., Zeek sensors), Bastion/jump hosts, Internet gateways,
    east-west taps in front of server subnets'
  range: Last 90 days, with per-source aggregation in 5-minute windows
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'for each src in 5m windows: attempts = sum(auth_attempts); fails = attempts - successes; ratio
      = fails/attempts; rate = attempts/5; alert when rate > 10/min AND ratio > 0.8 AND successes >= 1;
      output src, fails, success_ts, attempts.'
- question: Does a trained classifier score any SSH client version string or JA4SSH fingerprint as likely
    malicious, and what features drove that score?
  context: 'This applies machine learning to generalize beyond exact threat-intelligence matches and rarity
    heuristics. Train a classifier (for example a Random Forest) on labeled good/bad SSH client strings
    and JA4SSH fingerprints using features such as string length, character entropy, n-grams, and packet-size
    statistics, then score new version strings in real time. The alert must list the top-3 contributing
    features (for example ''unusual n-gram'', ''rare on network'', ''entropy'') alongside the maliciousness
    score so analysts can validate the model''s reasoning. For Lateral Movement, this catches novel or
    obfuscated SSH clients that evade static signatures but still carry statistical hallmarks of attacker
    tooling; a high score with explainable features warrants investigation of the connecting host and
    account. References: [JA4+ suite](https://github.com/FoxIO-LLC/ja4).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - 'NAI: Network traffic inspection points (e.g., Zeek sensors), Bastion/jump hosts, Internet gateways,
    east-west taps in front of server subnets'
  range: Last 90 days for scoring; model trained on a longer labeled history
  queries:
  - technology: ML/pseudocode
    query: features = [len(client), entropy(client), ngrams(client), ja4ssh_pkt_stats]; score = rf_model.predict_proba(features);
      alert when score > threshold; output client, score, top3_features.
- question: Are SSH client processes (ssh, scp, sshpass, plink.exe) being launched with automation or
    evasion flags such as StrictHostKeyChecking=no, UserKnownHostsFile=/dev/null, BatchMode=yes, unusual
    key paths, or -batch?
  context: 'This question hunts for the command-line tradecraft of scripted, non-interactive SSH used
    to pivot quietly. Search process-creation events across platforms — Linux auditd EXECVE ''a*'' arguments,
    macOS unified log, ESXi shell, and Windows Event ID 4688 CommandLine — for ''ssh''/''scp''/''sshpass''/''plink.exe''
    invoked with evasion arguments like ''-o StrictHostKeyChecking=no'', ''-o UserKnownHostsFile=/dev/null'',
    ''-o BatchMode=yes'', ''-i <unusual_keypath>'', or ''-batch'', the artifacts emulated by Atomic Red
    Team T1021.004. Alert and capture the parent process and user. These flags suppress host-key prompts
    and interactive checks so automation can connect without human input, which is characteristic of adversary
    lateral-movement scripts; a legitimate one-off admin command rarely needs to disable host-key verification,
    so the parent process and user context are key to triage. References: [Atomic Red Team T1021.004](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1021.004/T1021.004.md).'
  answer_sources:
  - auditd:EXECVE
  - macos:unifiedlog
  - esxi:shell
  - Windows Event ID 4688
  - 'NAI: All Linux/macOS endpoints and servers, ESXi hosts, and Windows pivot/management workstations;
    especially bastion hosts, developer workstations, and management servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: proc = process_events where exe in ('ssh','scp','sshpass','plink.exe'); alert when cmdline
      matches any of ('StrictHostKeyChecking=no','UserKnownHostsFile=/dev/null','BatchMode=yes','-batch','-i
      <unusual_keypath>'); output host, user, parent_process, cmdline, ts.
- question: For each principal, are SSH client invocations using argument tokens that are rare relative
    to that user/host's own 90-day baseline?
  context: 'This question detects deviations in how a specific user or host normally invokes SSH, catching
    account misuse even when no single flag is overtly malicious. Per user/host, establish a 90-day baseline
    of SSH argument tokens and their frequencies, then score each new execution by the rarity (inverse
    document frequency) of its arguments for that principal and alert when the cumulative score exceeds
    the 99th percentile of that principal''s history. Include the rarest 3 tokens in the alert text. For
    Lateral Movement, an account that suddenly issues SSH commands with arguments it has never used before
    may indicate a compromised credential being driven by an adversary; a result within normal range suggests
    routine activity for that principal. References: [Bian et al](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf).'
  answer_sources:
  - auditd:EXECVE
  - macos:unifiedlog
  - esxi:shell
  - Windows Event ID 4688
  - 'NAI: All Linux/macOS endpoints and servers, ESXi hosts, and Windows pivot/management workstations;
    especially bastion hosts, developer workstations, and management servers'
  range: Last 90 days baseline per principal
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = idf(arg_tokens) per (user,host) over 90d; for new exec: score = sum(idf(token)
      for token in args); alert when score > p99(principal_history); output user, host, cmdline, top3_rare_tokens,
      score.'
- question: Do any SSH command lines cluster as outliers that do not match known-good, admin-approved
    scripts?
  context: 'This question uses unsupervised clustering to separate sanctioned automation from anomalous
    SSH usage at scale. Vectorize SSH command lines with TF-IDF over their arguments and cluster them
    with DBSCAN; mark clusters that lack known-good, admin-approved scripts as suspicious and alert on
    new command lines that fall into outlier clusters, reporting the nearest known-good cluster and the
    top-3 distinguishing tokens for explainability. For Lateral Movement, attacker-driven SSH commands
    tend to differ structurally from the organization''s standard automation and surface as outliers;
    the explainability output lets an analyst confirm whether an outlier represents a new legitimate workflow
    or hostile activity. References: [Bian et al](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf).'
  answer_sources:
  - auditd:EXECVE
  - macos:unifiedlog
  - esxi:shell
  - Windows Event ID 4688
  - 'NAI: All Linux/macOS endpoints and servers, ESXi hosts, and Windows pivot/management workstations;
    especially bastion hosts, developer workstations, and management servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: X = tfidf(ssh_cmdlines.args); labels = DBSCAN(X); flag clusters with no approved_script; alert
      when new cmdline in outlier_cluster; output cmdline, nearest_goodcluster, top3_distinguishing_tokens.
- question: Has a successful SSH login created a new (user, destination_host) pathway not present in the
    recent baseline, and did that session involve a credential switch or chain to a further hop?
  context: 'This question reconstructs the authentication graph to spot the new edges that lateral movement
    creates. Maintain a 30-day state table of successful ''(user, destination_host)'' SSH pairs from Zeek
    ssh.log auth_success, linux:syslog/auth.log, and esxi:auth, then alert on any successful login that
    forms a new pair and escalate when the same login session reaches a host via a credential switch or
    chains to a further hop — the causal new-edge/credential-switch logic of the Hopper system. Surface
    the user''s prior known pairs in the alert. A new pathway, especially one combined with switching
    identities mid-session or hopping onward, is the defining behavior of an adversary traversing the
    network; familiar pairs without switches are likely benign. References: [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - linux:syslog
  - macos:unifiedlog
  - esxi:auth
  - 'NAI: Authentication servers, bastion/jump hosts, critical Linux/macOS/ESXi servers, network choke
    points, VPN concentrators, Zeek sensors'
  range: Last 90 days, with a trailing 30-day pathway state table
  queries:
  - technology: SIEM correlation pseudocode
    query: 'pairs = state_table of successful (user,dest) over 30d; for each new success: if (user,dest)
      not in pairs -> alert new_edge; if session shows credential_switch OR onward_hop -> escalate; output
      user, dest, prior_pairs, switch_flag, next_hop, ts.'
- question: Does a successful SSH login deviate strongly from the account's historical source geolocation,
    ASN, time-of-day, and destination set?
  context: 'This question scores each login against a per-account behavioral profile to flag credential
    misuse. Per account, model the typical source geolocation (Country, ASN), time-of-day, and destination
    set from history, then score each login: +5 for a new country, +3 for a new ASN, +2 for off-hours
    (00:00–05:00 local), and +4 for a new destination host. Flag logins that exceed the 98th percentile
    of that account''s historical scores and list the contributing deviations in the alert. For Lateral
    Movement, a login arriving from an unfamiliar country/ASN at an odd hour to a new server strongly
    suggests the credential is being used by someone other than its owner; a low score reflects normal
    access patterns. References: [Bian et al](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - linux:syslog
  - macos:unifiedlog
  - esxi:auth
  - 'NAI: Authentication servers, bastion/jump hosts, critical Linux/macOS/ESXi servers, network choke
    points, VPN concentrators, Zeek sensors'
  range: Last 90 days, scored against per-account history
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each login: s=0; s+=5 if new_country; s+=3 if new_asn; s+=2 if hour in 00:00-05:00; s+=4
      if new_dest; alert when s > p98(account_history); output account, src_geo, asn, hour, dest, contributing_deviations,
      s.'
- question: Was a successful new-pathway SSH login immediately preceded by a burst of failed authentications
    from the same source to the same destination?
  context: 'This question separates brute-forced access from clean credential use as a severity modifier
    on new-pathway logins. Before crediting a successful new-pathway login, compute the failed SSH auth
    count from that source to that destination in the preceding 10 minutes; treat a success preceded by
    a failure burst (for example more than 5 failures, baseline-derived) as higher severity. A new pathway
    that is opened only after repeated failures indicates the adversary guessed or sprayed the credential
    rather than possessing it legitimately, which raises the urgency for Lateral Movement response; a
    clean success with no preceding failures is comparatively lower risk but still worth confirming. References:
    [Understanding the Mirai Botnet](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - linux:syslog
  - macos:unifiedlog
  - esxi:auth
  - 'NAI: Authentication servers, bastion/jump hosts, critical Linux/macOS/ESXi servers, network choke
    points, VPN concentrators, Zeek sensors'
  range: Last 90 days, evaluating the 10-minute window before each successful login
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each successful new-pair login at t: fails = count(failed_auth where src,dest match and
      ts in [t-10m, t]); if fails > 5 -> raise_severity; output src, dest, success_ts, fails.'
- question: Does a temporal-graph link-prediction model score any new SSH/authentication edge as highly
    improbable given historical connectivity?
  context: 'This question applies graph machine learning to surface improbable authentication relationships
    that simpler rules miss. Model authentication/SSH events as a temporal graph and score each new edge''s
    improbability with unsupervised link prediction — node2vec embeddings plus a link predictor (as in
    CyberGraph) or a GNN-plus-recurrent encoder (as in EULER) — or alternatively score login sequences
    with a self-supervised sequence model. Calibrate on the LANL authentication dataset and emit the contributing
    nodes/edge and predicted probability in the alert. For Lateral Movement, an edge the model deems highly
    unlikely often corresponds to an adversary connecting systems that have no legitimate reason to communicate;
    the probability score and contributing nodes give analysts a ranked, explainable lead to pursue. References:
    [CyberGraph](https://www.usenix.org/system/files/raid20-bowman.pdf), [EULER](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf),
    [Gökstorp et al](https://people.kth.se/~gyuri/Pub/GokstorpNKJD_LogAnomaly_NOMS24.pdf), [LANL authentication
    dataset](https://csr.lanl.gov/data/auth/).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - linux:syslog
  - macos:unifiedlog
  - esxi:auth
  - 'NAI: Authentication servers, bastion/jump hosts, critical Linux/macOS/ESXi servers, network choke
    points, VPN concentrators, Zeek sensors'
  range: Last 90 days for scoring; model trained on longer historical authentication graphs
  queries:
  - technology: ML/pseudocode
    query: 'G = temporal_graph(auth_events); emb = node2vec(G); for each new_edge(u,v): p = link_predictor(emb[u],
      emb[v]); alert when p < threshold; output u, v, predicted_probability, contributing_nodes.'
- question: Is any single source IP or user account establishing successful SSH connections to more than
    a threshold number of distinct destinations within a short window (fan-out)?
  context: 'This question implements a streaming detector for rapid many-host propagation. Alert when
    a single source IP/user (Zeek conn.log service=''ssh'' / ssh.log) establishes successful SSH connections
    to more than a fixed number of distinct destinations (for example more than 10) within 15 minutes
    — the rapid many-host propagation pattern of automated SSH abuse. Tune the count to the environment
    and include the destination list in the alert. High SSH fan-out from one origin in minutes is a hallmark
    of automated lateral movement, worm-like propagation, or credential spraying; legitimate admins occasionally
    fan out via orchestration, so the destination list and account context drive triage. References: [Understanding
    the Mirai Botnet](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - linux:syslog
  - esxi:auth
  - 'NAI: Internal network segments, server subnets, data-center core switches, Zeek sensors monitoring
    east-west traffic'
  range: Last 90 days, evaluated in streaming 15-minute windows
  queries:
  - technology: Zeek/Rule pseudocode
    query: 'for each src in 15m windows: dests = distinct(id_resp_h where service=''ssh'' and success);
      alert when count(dests) > 10; output src, count(dests), dest_list, window.'
- question: Which source hosts have a distinct-destination SSH count that is a statistical outlier (>3
    sigma or >99th percentile) versus the population baseline?
  context: 'This question uses robust statistics to find fan-out that beats fixed thresholds and adapts
    to the environment. In a 1-hour sliding window, group successful SSH sessions by source and count
    distinct destinations, then flag sources whose count exceeds 3 standard deviations (or Median Absolute
    Deviation) above the population mean or the 99th percentile — the robust outlier scoring used by unsupervised
    host-communication-graph ensembles. Report the count, baseline mean, and z/MAD score. For Lateral
    Movement, a source whose reach is a dramatic outlier relative to its peers is suspicious even if it
    stays under a hard count limit; MAD-based scoring resists distortion from a few naturally chatty hosts.
    References: [Bohara et al](https://mnoureddine.com/files/17BOH01.pdf).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - linux:syslog
  - esxi:auth
  - 'NAI: Internal network segments, server subnets, data-center core switches, Zeek sensors monitoring
    east-west traffic'
  range: Last 90 days, with 1-hour sliding-window aggregation
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'for each src in 1h windows: dcount = distinct_dest(successful ssh); mu,sigma = population_stats(dcount);
      z = (dcount-mu)/sigma; alert when z > 3 OR dcount > p99; output src, dcount, mu, z.'
- question: Which source hosts show a high count of failed/blocked SSH connections to many distinct destinations
    with a low success rate, indicating scanning or spraying?
  context: 'This question profiles failed fan-out separately to distinguish reconnaissance and credential
    spraying from legitimate orchestration. Count blocked/failed SSH connections (Zeek conn.log conn_state
    S0/REJ, failed auth) per source to distinct destinations; a high failed-fan-out with low success rate
    indicates scanning/spraying versus legitimate orchestration that mostly succeeds. Alert on a failed-destination
    count above a baseline-derived threshold. For Lateral Movement, many failed attempts spread across
    hosts reveal an adversary probing for a way in before any successful pivot, providing early warning;
    a high success ratio instead points to sanctioned automation. References: [Understanding the Mirai
    Botnet](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - linux:syslog
  - esxi:auth
  - 'NAI: Internal network segments, server subnets, data-center core switches, Zeek sensors monitoring
    east-west traffic'
  range: Last 90 days, aggregated per source
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'for each src: failed_dests = distinct(id_resp_h where conn_state in (''S0'',''REJ'') OR auth_failed);
      success_rate = successes/attempts; alert when failed_dests > baseline_threshold AND success_rate
      low; output src, failed_dests, success_rate.'
- question: Does community detection on the SSH connection graph reveal star-shaped subgraphs where one
    source reaches many destinations with high out-degree centrality?
  context: 'This question applies graph analytics to expose the structural signature of fan-out lateral
    movement. Model SSH connections as a directed graph and apply community detection / centrality (for
    example Louvain) to identify star-shaped subgraphs where one source reaches many destinations with
    high out-degree centrality, then rank such structures with graph link-prediction scores. Surface the
    source node, its out-degree, and top destinations in the alert. For Lateral Movement, a star topology
    centered on a single host is a clear structural indicator of automated or scripted propagation across
    the estate; ranking by link-prediction improbability helps prioritize the most anomalous hubs over
    normally central servers. References: [Bohara et al](https://mnoureddine.com/files/17BOH01.pdf), [CyberGraph](https://www.usenix.org/system/files/raid20-bowman.pdf),
    [EULER](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - linux:syslog
  - esxi:auth
  - 'NAI: Internal network segments, server subnets, data-center core switches, Zeek sensors monitoring
    east-west traffic'
  range: Last 90 days for graph construction and scoring
  queries:
  - technology: ML/pseudocode
    query: 'G = directed_graph(ssh_connections); communities = louvain(G); for each node n: if out_degree(n)
      high and star_shape(n) -> candidate; rank candidates by link_prediction_score; output source_node,
      out_degree, top_destinations, score.'
- question: Is any SSH session requesting port forwarding or tunneling (direct/remote tunnel indicators),
    and what are the true tunneled endpoints and ports?
  context: 'This question detects SSH being used as a covert transport rather than for interactive administration.
    Alert on any SSH session in Zeek ssh.log requesting forwarding (direct/remote tunnel indicators),
    then correlate the session uid with Zeek conn.log to identify the tunneled flow''s true endpoints/ports
    and enrich the destination with threat intelligence. Port forwarding lets an adversary pivot traffic
    through a compromised host to reach otherwise unreachable systems or to exfiltrate data, so confirming
    the real endpoints behind the tunnel is critical for Lateral Movement (and downstream collection/exfiltration)
    triage; a tunnel terminating at sensitive infrastructure or known-bad IPs is high priority. References:
    [Zeek ssh.log](https://docs.zeek.org/en/master/scripts/base/protocols/ssh/main.zeek.html).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - 'NAI: Network traffic inspection points (e.g., Zeek sensors), DMZ, Internet gateways, internal taps
    between segments'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: fwd = ssh.log where forwarding_requested (direct/remote tunnel indicator); join conn.log on
      uid to resolve tunneled endpoints/ports; enrich dest with TI; output uid, id_orig_h, tunneled_endpoints,
      ports, ti_match.
- question: Which completed SSH sessions are statistical outliers in total bytes, orig/resp byte ratio,
    and duration, consistent with bulk transfer rather than interactive use?
  context: This question separates interactive shells from data-moving sessions using flow statistics.
    For completed SSH sessions (Zeek conn.log service='ssh'), compute total bytes (orig_bytes+resp_bytes),
    the orig/resp byte ratio, and duration, then flag sessions in the top 5th percentile for both volume
    and duration, or with a byte ratio far from interactive norms — interactive SSH is bursty and roughly
    balanced, whereas bulk transfer is sustained and asymmetric. Include the byte total, ratio, and duration
    in the alert. For Lateral Movement and data theft, an SSH session moving large, lopsided volumes over
