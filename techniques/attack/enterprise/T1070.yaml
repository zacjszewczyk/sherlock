questions:
- question: 'Using deterministic rule logic, can you determine whether "Match known indicator removal
    command chains" reveals adversary indicator removal under the Stealth tactic? Specifically: Trigger
    on process creation (Sysmon Event ID 1 / Windows Event ID 4688) where the image hash matches a known
    wiping tool (SDelete, BCWipe) or the command line contains high-specificity patterns (`wevtutil cl`,
    `sdelete -accepteula`, `cipher /w:`, `fsutil usn deletejournal`). Build the rule from the deterministic
    [Sigma Important Windows Eventlog Cleared](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/microsoft_windows_eventlog/win_system_susp_eventlog_cleared.yml)
    and [Detect Credential Access with Elastic Security](https://www.elastic.co/security-labs/detect-credential-access)
    patterns; keep these concrete strings as the deterministic floor and tune, do not delete.'
  context: 'Tactic context (Stealth): Is the adversary attempting to remove indicators of compromise to
    evade detection? Adversaries selectively delete or modify artifacts they generate to reduce indications
    of their presence and blend in with legitimate activity, complicating timeline reconstruction and
    attribution. Evidence under investigation: A process creation event is observed where the executable''s
    hash matches a known indicator removal tool, or a built-in utility is executed with a command-line
    signature associated with artifact wiping, log cleanup, or deliberate overwrite behavior. Approach
    (Match known indicator removal command chains): Trigger on process creation (Sysmon Event ID 1 / Windows
    Event ID 4688) where the image hash matches a known wiping tool (SDelete, BCWipe) or the command line
    contains high-specificity patterns (`wevtutil cl`, `sdelete -accepteula`, `cipher /w:`, `fsutil usn
    deletejournal`). Build the rule from the deterministic [Sigma Important Windows Eventlog Cleared](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/microsoft_windows_eventlog/win_system_susp_eventlog_cleared.yml)
    and [Detect Credential Access with Elastic Security](https://www.elastic.co/security-labs/detect-credential-access)
    patterns; keep these concrete strings as the deterministic floor and tune, do not delete. A positive
    result indicates that logs, command histories, backups, audit policy, file timestamps, or other forensic
    artifacts are being cleared, truncated, disabled, or altered in a way inconsistent with sanctioned
    administrative or maintenance activity; a negative result means the observed behavior matches an established
    benign baseline (e.g., scheduled log rotation, golden-image provisioning, approved change ticket).
    Note that the ABSENCE of expected telemetry is itself a positive indicator here. Investigate the named
    area of interest (Critical servers (Domain Controllers, Exchange), user endpoints, central log repositories,
    software deployment servers.) and pivot from any hit to the originating process, account, parent-process
    chain, and the suspicious activity the removal was likely intended to conceal.'
  answer_sources:
  - Windows Event ID 4660
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: Critical servers (Domain Controllers, Exchange), user endpoints, central log repositories, software
    deployment servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Match known indicator removal command chains\nMATCH process_creation\
      \ OR audit_event WHERE\n  image_hash IN known_wiper_hashes        // e.g. SDelete, BCWipe\n  OR\
      \ cmdline MATCHES indicator_removal_patterns\n     // e.g. /wevtutil\\s+cl|Clear-EventLog|vssadmin.*delete\\\
      s+shadows|\n     //      fsutil\\s+usn\\s+deletejournal|cipher\\s+/w:|auditpol.*disable|\n     //\
      \      history\\s+-c|HISTFILE=/dev/null|rm.*(/var/log|bash_history)|\n     //      clear\\s+logging|no\\\
      s+logging/\n  OR event_id IN [1102,104,4719,4660]      // log cleared / audit policy changed\nENRICH\
      \ WITH actor, parent_process, host, target_artifact\nTHEN alert(severity='high', keep_benign_exclusions_for_triage=true)"
- question: 'Using statistical baselining, can you determine whether "Alert on command-line entropy outliers"
    reveals adversary indicator removal under the Stealth tactic? Specifically: For all command-line executions
    compute Shannon entropy and per-(user,host) baselines, flagging the top 99th percentile, following
    [High Command Line Entropy Detected for Privileged Commands](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).
    Use the robust median/MAD modified Z-score (|Mz|>3.5) from [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    so batch admin jobs do not inflate thresholds; include command length and special-char count (Volume)
    and executions/min (Frequency) as parallel features.'
