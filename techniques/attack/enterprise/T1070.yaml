name: 'T1070: Indicator Removal'
id: 4a4903a5-41c7-4f81-92a0-4bd5ea5ae83e
description: 'This playbook helps an analyst determine whether an adversary is performing Indicator Removal
  (T1070): selectively deleting, truncating, disabling, or altering the artifacts they generate in order
  to evade detection and frustrate forensic timeline reconstruction. It spans every platform in the source
  plan - Windows, Linux, macOS, Containers, ESXi, Network Devices, and Office/M365 - and covers the major
  removal behaviors: clearing Windows event logs (Event ID 1102/104, wevtutil, Clear-EventLog), wiping
  files and shadow copies (vssadmin/wbadmin/fsutil, SDelete/BCWipe, del /F /S /Q, cipher /w:, Remove-Item
  -Recurse -Force), tampering with audit policy (Event ID 4719, auditpol, auditctl, Cisco ''no logging''/''clear
  logging''), timestomping (Sysmon Event ID 2, PowerShell SetCreationTime/$SI vs $FN divergence), shell-history
  destruction (history -c, unset HISTFILE, truncation of ~/.bash_history), and clearing or redirecting
  logs on network devices, ESXi, and containers (including ephemeral filesystem/volume destruction of
  /var/log). Detection blends symbolic-logic rules (Sigma-style deterministic floors), statistical baselining
  (median/MAD modified Z-score, percentile thresholds, and treating the unexplained absence of normally-present
  logs as a positive signal), and machine learning (gradient-boosted and small-language-model command-line
  classifiers, BERT command-line embeddings with unsupervised outlier detection, LSTM log-sequence models
  such as DeepLog, multivariate detectors such as Kitsune, and provenance-graph methods such as KAIROS/ThreaTrace)
  to produce evasion-resistant, explainable alerts for the Stealth tactic.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
