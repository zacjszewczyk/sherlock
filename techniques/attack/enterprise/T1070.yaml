  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: Alert on command-line entropy outliers\nWINDOW = 1h   // also\
      \ evaluate 24h and 90d rolling baselines\nFOR EACH (user, host[, artifact]):\n  count        = events_in_window\
      \      // e.g. 1102/104, deletions, vss runs\n  median, mad  = robust_stats(history_90d)\n  mod_z\
