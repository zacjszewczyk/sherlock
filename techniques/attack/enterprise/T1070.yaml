- question: 'Using a machine-learning model, can you determine whether "Embed and outlier-score command-lines"
    reveals adversary indicator removal under the Stealth tactic? Specifically: Train BERT-style command-line
    embeddings on first-party endpoint telemetry and apply unsupervised outlier detectors (COPOD, Isolation
    Forest, PCA, autoencoder) to flag rare wiping/log-clear command structures relative to the host baseline,
    per [BERT Embeddings: A New Approach for Command-Line Anomaly Detection](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).
    Emit the nearest benign neighbors and top contributing tokens for explainability.'
