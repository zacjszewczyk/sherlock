- question: 'Using deterministic rule logic, can you determine whether "Detect volume shadow copy deletion
    commands" reveals adversary indicator removal under the Stealth tactic? Specifically: High-priority
    rule on process creation for `vssadmin.exe delete shadows`, `wbadmin.exe delete catalog`, `wbadmin
    delete systemstatebackup`, `fsutil usn deletejournal`, `bcdedit /set recoveryenabled no`, or PowerShell
    `Get-WmiObject Win32_Shadowcopy | Remove-WmiObject`. Anchor on the concrete strings catalogued in
    [MITRE ATT&CK T1070](https://attack.mitre.org/techniques/T1070/); keep as deterministic floor.'
  context: 'Tactic context (Stealth): Is the adversary attempting to remove indicators of compromise to
