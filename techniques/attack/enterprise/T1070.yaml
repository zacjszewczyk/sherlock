      COMPUTE per-(user,host) and per-role baselines (median/MAD, p99, p99.9)\nALERT WHEN mod_z > 3.5\
      \ OR count > p99\n  OR (clear/disable event AND no_change_ticket)   // absence/State signal\n  OR\
      \ sudden_drop_in_expected_log_volume"
- question: 'Using a machine-learning model, can you determine whether "Score command-lines with supervised
    modeling" reveals adversary indicator removal under the Stealth tactic? Specifically: Train a gradient-boosted
    classifier on labeled command lines using character-distribution, keyword, n-gram, parent-process,
    and entropy features per [Obfuscated Command Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/);
    for obfuscation-resilient coverage add an ELECTRA small language model from [Command-line Obfuscation
    Detection using Small Language Models](https://arxiv.org/abs/2408.02637) (test corpus: [Invoke-DOSfuscation](https://github.com/danielbohannon/Invoke-DOSfuscation)).
    The alert MUST surface the top-3 contributing features (e.g., entropy, deletion verb, parent=services.exe)
    alongside the score.'
