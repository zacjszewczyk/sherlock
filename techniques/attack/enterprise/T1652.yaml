name: 'T1652: Device Driver Discovery'
id: 3c0ec947-d9c5-4d23-92d9-7bc50c3b4d02
description: 'This playbook helps an analyst investigate whether an adversary is enumerating local device
  drivers and kernel modules on a compromised host as part of post-compromise discovery (MITRE ATT&CK
  T1652, Device Driver Discovery). Knowledge of installed drivers reveals the host''s function, present
  security tools, virtualization/sandbox defenses, and exploitable vulnerable drivers that enable later
  privilege escalation. The hunt spans Windows, Linux, and macOS endpoints and servers (with emphasis
  on Tier 0/1 assets) and pursues the behavior from several complementary angles: process-creation and
  script-block execution of driver-enumeration utilities (driverquery.exe, wmic/Get-CimInstance Win32_SystemDriver,
  lsmod, modinfo, cat /proc/modules, kextstat, kextfind); threat-intel hash matches on discovery-tagged
  binaries; high-volume reads of the HKLM\SYSTEM\CurrentControlSet\Services registry hive by non-allowlisted
  processes; and driver-discovery commands that follow closely behind a remote logon or special-privilege
  assignment. Detection methods combine deterministic symbolic-logic rules (TI overlays, command-line
  and registry-access allowlists, remote-session correlation), statistical baselining (prevalence and
  z-score anomaly detection, burst/co-occurrence of distinct discovery commands, command-line entropy,
  failure-rate profiling, risk scoring of precursor events), and machine learning (gradient-boosted command
  classification, BERT/Isolation Forest/COPOD outlier detection, LSTM/HMM sequence modeling, and provenance-graph
  scoring), applied across Windows Security and Sysmon events, PowerShell script-block logs, auditd, macOS
  unified logs, and Zeek, so the analyst can corroborate suspected driver discovery against process lineage,
  registry access, authentication context, and the broader discovery chain.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
