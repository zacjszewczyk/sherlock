    a rule match, statistical outlier, or model alert -- indicates probable device-driver discovery activity;
    pivot to the responsible process and its parent lineage, the user and logon session, the host''s role
    (workstation, server, Tier 0 asset), any preceding remote logon or privilege assignment, and co-occurring
    discovery commands to determine whether this is benign inventory/administration or hands-on-keyboard
    reconnaissance. A negative result helps rule out this particular discovery vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, allowlisted-tool-abuse,
    or low-and-slow enumeration.'
