    the process''s SHA256 hash is present in a threat intelligence feed of known malicious binaries specifically
    tagged for ''discovery'' or ''driver enumeration''. This Statistical Method approach works as follows:
    Compute org-wide prevalence for each process hash and prioritize hashes present on <0.1% of hosts
    (derive the exact percentile from your fleet size); rank these against the per-host discovery-binary
    frequency baseline so rare binaries running driver-enumeration syntax surface first ([CAR-2016-03-001](https://car.mitre.org/analytics/CAR-2016-03-001/),
