questions:
- question: '[Discovery] Threat-intel hash detection: Can you determine whether a process creation event
    is recorded where the process''s SHA256 hash is present in a threat intelligence feed of known malicious
    binaries specifically tagged for ''discovery'' or ''driver enumeration''. -- specifically, using the
    ''Threat-intel hash detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary enumerates local device
    drivers and kernel modules on a compromised host to understand its function, identify installed security
    tooling or virtualization/sandbox defenses, and spot vulnerable drivers they could exploit for privilege
    escalation. This evidence focuses on the condition that a process creation event is recorded where
    the process''s SHA256 hash is present in a threat intelligence feed of known malicious binaries specifically
    tagged for ''discovery'' or ''driver enumeration''. This Symbolic Logic approach works as follows:
    Monitor Windows Event ID 4688 and Zeek files.log and alert when a new process hash matches a discovery/driver-enumeration-tagged
    threat intelligence indicator. Treat TI as an enrichment overlay, not the sole trigger, so detection
    still fires on the first-party command/registry/file logic below ([MITRE T1652](https://attack.mitre.org/techniques/T1652/)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable device-driver
    discovery activity; pivot to the responsible process and its parent lineage, the user and logon session,
    the host''s role (workstation, server, Tier 0 asset), any preceding remote logon or privilege assignment,
    and co-occurring discovery commands to determine whether this is benign inventory/administration or
    hands-on-keyboard reconnaissance. A negative result helps rule out this particular discovery vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, allowlisted-tool-abuse, or low-and-slow enumeration.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - 'NAI: All Windows Endpoints and Servers, particularly Tier 0/1 assets like Domain Controllers and
    critical application servers; Network sensors capturing file transfers.'
