name: 'T1675: ESXi Administration Command'
id: 90fbca49-3ece-4ebb-899a-81edd8e60e54
description: 'This playbook helps an analyst investigate whether an adversary has abused ESXi administration
  services - particularly the VMware Tools Daemon (vmtoolsd.exe on Windows, vmware-tools-daemon on macOS,
  vmtoolsd on Linux) and the vSphere Web Services Guest Operations APIs (StartProgramInGuest, ListProcessesInGuest,
  ListFileInGuest, InitiateFileTransferFromGuest) - to execute commands and transfer files on guest virtual
  machines hosted within an ESXi environment (MITRE ATT&CK T1675, ESXi Administration Command). Because
  the ESXi host can drive code execution inside guests through the tools daemon, an adversary who controls
  the hypervisor or exploits a flaw such as CVE-2023-20867 (unauthenticated guest operations) can run
  arbitrary commands on many VMs without leaving normal guest authentication artifacts, enabling follow-on
  File and Directory Discovery, Data from Local System, OS Credential Dumping, lateral movement, and hypervisor-scale
  ransomware deployment. The hunt pursues this behavior from several complementary angles: children of
  vmtoolsd correlated against threat intelligence; vmtoolsd spawning command interpreters or scripting
  engines; vmtoolsd children that fall outside an established allowlist or fleet-wide prevalence baseline;
  ESXi management connections on TCP/902 followed by anomalous guest process creation or egress; a single
  source fanning out guest operations across many VMs; and host-side esxi:hostd / vCenter vpxd Guest Operations
  API invocations that occur without a matching guest authentication event, from unexpected accounts,
  off-hours, or at anomalous frequency. Detection methods combine deterministic symbolic-logic rules (TI
  correlation, shell-spawn and child-process allowlists, port-902-to-process correlation, fan-out and
  unauthenticated-guest-op rules), statistical baselining (TF-IDF/BM25 command rarity, Shannon-entropy
  command and target scoring, prevalence thresholds, connection-volume and guest-op-rate off-hours baselines)
  and machine learning (command-line maliciousness classifiers, LSTM process-sequence anomaly detection,
  Extended Isolation Forest / one-class SVM child-process and guest-op outlier scoring, and graph/DBSCAN
  path-rarity scoring), applied across Windows Event ID 4688/4624, auditd, Sysmon, Zeek conn.log/dns.log,
  and ESXi hostd / vCenter vpxd logs.'
type: technique
