questions:
- question: '[Execution] VMtoolsd child correlation (Symbolic Logic): Considering the evidence that a
    process spawned by vmtoolsd.exe on a guest VM whose process hash, command-line arguments, or subsequent
    network connections match known-bad indicators from threat intelligence. can you determine whether
    this is occurring in your environment using the ''VMtoolsd child correlation'' approach, and if so,
    scope the source account/host, the affected guest VM(s), the command or guest operation invoked, and
    any follow-on activity?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary abuses ESXi administration
    services and the VMware Tools daemon to run code inside guest VMs from the hypervisor, which can bypass
    normal in-guest controls and authentication and enable discovery, credential theft, lateral movement,
    or mass ransomware. This evidence focuses on the condition that a process spawned by vmtoolsd.exe
    on a guest VM whose process hash, command-line arguments, or subsequent network connections match
    known-bad indicators from threat intelligence. Approach (Symbolic Logic): When Windows Event ID 4688
    (or auditd execve / Sysmon 1) logs a child of ''vmtoolsd.exe''/''vmware-tools-daemon''/''vmtoolsd'',
    extract the child hash, full command line, and PID; correlate with Zeek conn.log and dns.log to alert
    on matches with TI for hashes, commands, destinations, or domains. Because UNC3886-class actors rotate
    atomic IOCs within ~1 week, treat TI hits as one signal among the TTP-based rules below ([VMware ESXi
    Zero-Day, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/vmware-esxi-zero-day-bypass/);
    [ESXi Administration Command T1675, MITRE](https://attack.mitre.org/techniques/T1675/)). A positive
    result - a rule match, statistical outlier, or model alert - is a strong signal of ESXi-driven guest
    command execution; pivot to the source IP/account that initiated the guest operation, the targeted
    guest VM(s) (prioritizing Domain Controllers and Database Servers), the full command line or API method
    and arguments, whether a corresponding guest authentication (Windows 4624) event exists, and any subsequent
    process creation or outbound network activity. A negative result helps reduce confidence in this specific
    vector but should be corroborated with the other questions in this playbook, since atomic IOCs rotate
    quickly and a single method can miss stealthy or unauthenticated abuse.'
