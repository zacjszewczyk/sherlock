  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary abuses ESXi administration
    services and the VMware Tools daemon to run code inside guest VMs from the hypervisor, which can bypass
    normal in-guest controls and authentication and enable discovery, credential theft, lateral movement,
    or mass ransomware. This evidence focuses on the condition that a process spawned by vmtoolsd.exe
    on a guest VM whose process hash, command-line arguments, or subsequent network connections match
    known-bad indicators from threat intelligence. Approach (Statistical Method): Score tokens from vmtoolsd
    child command lines with TF-IDF/BM25 plus log-entropy term weighting and flag commands whose rarest
    token falls below the 1st percentile over a 30-day baseline; surface the 3 rarest (highest-weighted)
    tokens in the alert as the explanation. Cross-reference rare tokens with the LOLESXi/LOLBin watchlist
    (esxcli vm process kill, vim-cmd vmsvc/getallvms, vmkfstools) ([SCADE, Vinay & Mangal](https://arxiv.org/abs/2412.04259);
    [LOLESXi](https://lolesxi-project.github.io/LOLESXi/)). A positive result - a rule match, statistical
    outlier, or model alert - is a strong signal of ESXi-driven guest command execution; pivot to the
    source IP/account that initiated the guest operation, the targeted guest VM(s) (prioritizing Domain
    Controllers and Database Servers), the full command line or API method and arguments, whether a corresponding
    guest authentication (Windows 4624) event exists, and any subsequent process creation or outbound
    network activity. A negative result helps reduce confidence in this specific vector but should be
    corroborated with the other questions in this playbook, since atomic IOCs rotate quickly and a single
    method can miss stealthy or unauthenticated abuse.'
