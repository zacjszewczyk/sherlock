- question: Does a process download or launch content that presents a fake security or system notification,
    where the content was staged from an external host or embedded in a script, HTML, or notification
    mechanism?
  context: 'Tactic: Defense Impairment. Detect msg.exe, mshta.exe, powershell.exe, or similar processes
    (Windows Event ID 4688 / Sysmon Event ID 1) that retrieve remote scripts/HTML/images (Zeek http.log/dns.log/conn.log)
    and then display security-themed text or UI, using GUI-utility and remote-content rules from Sigma.
    Raise severity when paired with a concurrent security-service stop, an explainable multi-premise rule.
    A positive is a GUI utility fetching remote content and rendering a security-themed notification,
    especially with a concurrent service stop; benign software-update fetches are negatives. References:
    [Sigma](https://github.com/SigmaHQ/sigma); [Detecting Malware Activities With MalpMiner: A Dynamic
    Analysis Approach](https://doi.org/10.1109/ACCESS.2023.3266562).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: User workstations, help-desk endpoints, and systems that routinely run security tools with visible
    tray notifications or alert dialogs.'
  range: Last 90 days (correlate process and network within minutes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'proc = read(''win:4688'',''sysmon:1'') WHERE image IN {msg.exe,mshta.exe,powershell.exe}

      net = read(''zeek:http'',''zeek:dns'',''zeek:conn'') WHERE remote_content fetched

      alert WHERE proc JOIN net ON host/time AND rendered_text ~ /security|defender|alert|scan/i

      severity = HIGH WHERE concurrent svc_stop(host,''security'')'
