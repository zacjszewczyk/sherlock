questions:
- question: Is there a process creation or network event showing a fake security UI process or loader
    that displays a healthy status while the legitimate security tooling is stopped, hidden, or known-bad?
  context: 'Tactic: Defense Impairment. Adversaries spoof a security UI to convince defenders that protection
    is healthy even after the real tool was disabled. Join process creation (Sysmon Event ID 1 / Windows
    Event ID 4688) to network connection events on process identifier and compare file hash, destination
    IP, and requested domain against threat feeds for fake security UI / alert-spoofing tooling. In parallel,
    correlate against first-party security-control state so a fresh UI process appearing while WinDefend/MsMpEng
    services are stopped (Windows Event ID 7034/7036) is alerted even without a TI hit, as an explainable
    contradiction. A positive is a UI/loader tied to a TI match or to a stopped-service-but-healthy-UI
    contradiction; a negative is a signed security UI running with live services. References: [Detecting
    Malware Activities With MalpMiner: A Dynamic Analysis Approach](https://doi.org/10.1109/ACCESS.2023.3266562);
    [Sigma](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 7036
  - Windows Event ID 7034
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Network Egress/Ingress Points (e.g., Firewalls,
    Proxies), Threat Intelligence Platform'
  range: Last 90 days (real-time correlation, 5-10 min windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc = read('sysmon:1','win:4688'); net = read('net:conn')\njoin = proc JOIN net ON proc.pid\
      \ = net.pid\nti = load('threat_intel:fake_ui,alert_spoofing')\nalert WHERE join.hash IN ti OR join.dest_ip\
      \ IN ti OR join.dns_query IN ti\nOR (proc.image MATCHES security_ui_pattern\n    AND exists svc_stop(host,\
      \ 'WinDefend|MsMpEng', win:7034|7036) WITHIN 10m\n    AND NOT exists svc_reenable(host) WITHIN window)"
  - technology: Zeek/pseudocode
    query: 'conn = read(''zeek:conn''); dns = read(''zeek:dns'')

      alert WHERE conn.id.resp_h IN ti.fake_ui OR dns.query IN ti.fake_ui_domains'
- question: Are executed process hashes that are not on the approved-software allowlist statistically
    rare across the enterprise and exhibiting anomalous connection volume, frequency, or failure state?
  context: 'Tactic: Defense Impairment. A spoofing UI loader is typically rare and may beacon or fail
    many connections. For executed process hashes not on the approved-software allowlist, compute enterprise
    prevalence over 30 days and flag hashes below the 1st percentile; enrich with Volume (outbound bytes),
    Frequency (connections/min), and State (count of failed/blocked connections and NXDOMAIN responses)
    so a rare UI loader that beacons or fails many connections scores higher. Derive the 1st-percentile
    cut per environment. Treat the rare-context appearance as a contextual anomaly. A positive is a rare
    hash with anomalous beaconing/failure context; common allowlisted binaries are negatives. References:
    [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [Anomaly Detection: A Survey](https://doi.org/10.1145/1541880.1541882).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 7036
  - Windows Event ID 7034
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Network Egress/Ingress Points (e.g., Firewalls,
    Proxies), Threat Intelligence Platform'
  range: Last 90 days (30-day prevalence baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'hashes = read(''sysmon:1'',''win:4688'') WHERE hash NOT IN allowlist

      prevalence = count_distinct(host) per hash over 30d

      rare = hashes WHERE prevalence <= percentile(prevalence, 1)

      enrich rare WITH out_bytes, conns_per_min, failed_conns, nxdomain

      score = f(rarity, volume, frequency, failure_state); alert WHERE score >= threshold'
- question: Does a whole-system provenance-graph model flag the process-and-network chain of a suspected
    spoofing tool as anomalous, with explainable top contributing nodes and features?
  context: 'Tactic: Defense Impairment. To catch novel or label-free spoofing chains, score the process-and-network
    chain with a whole-system provenance graph autoencoder that flags anomalous edges (e.g., a defensive
    process or unsigned UI loader connecting externally) and reconstructs the causal path so the alert
    lists the top-3 contributing nodes/features (parent, hash reputation, destination ASN/JA3). Retain
    a supervised classifier on hash reputation, parent legitimacy, command-line entropy, path, destination
    ASN, JA3/JA3S, and connection duration, and adapt to drift with masked graph representation learning.
    A positive is a high reconstruction-error subgraph with a defensive/unsigned process connecting externally;
    benign well-known chains reconstruct cleanly. References: [KAIROS: Practical Intrusion Detection and
    Investigation using Whole-system Provenance](https://tfjmp.org/publications/2024-sp.pdf); [MAGIC:
    Detecting Advanced Persistent Threats via Masked Graph Representation Learning](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 7036
  - Windows Event ID 7034
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Network Egress/Ingress Points (e.g., Firewalls,
    Proxies), Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'G = build_provenance_graph(proc_events, net_events)

      ae = ProvenanceAutoencoder(); err = ae.reconstruction_error(G.edges)

      anom = edges WHERE err > tau; explain = top3_nodes_features(anom)

      clf = SupervisedClassifier([hash_rep,parent_legit,cmd_entropy,path,dest_asn,ja3,duration])

      alert WHERE anom OR clf.predict == malicious; adapt via masked_graph_repr_learning()'
- question: Are processes being created with command-line arguments that manipulate Windows GUI elements
    or notification tooling to imitate a security alert while bypassing the legitimate security console?
  context: 'Tactic: Defense Impairment. Adversaries render fake alert dialogs to impersonate a security
    tool. Apply regex rules to command lines from Windows Event ID 4688 / Sysmon Event ID 1 for patterns
    such as msg.exe, mshta.exe, PowerShell ShowDialog / Windows.Forms MessageBox calls, and alert-like
    VBScript/JScript strings. Raise severity when the same host shows a security service stop (Windows
    Event ID 7034/7036) without a re-enable, an explainable two-premise rule. A positive is a GUI/notification
    command line paired with a contradictory service-stop; a negative is a legitimate admin notification
    with no service tampering. References: [Sigma](https://github.com/SigmaHQ/sigma); [Detecting Malware
    Activities With MalpMiner: A Dynamic Analysis Approach](https://doi.org/10.1109/ACCESS.2023.3266562).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints, Centralized Log Aggregator (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'proc = read(''win:4688'',''sysmon:1'')

      gui = proc WHERE cmdline ~ /(msg\.exe|mshta\.exe|ShowDialog|Windows\.Forms.*MessageBox|MsgBox)/i

      OR cmdline ~ /(vbscript|jscript).*(security|defender|alert|scan)/i

      alert WHERE gui; severity = HIGH WHERE svc_stop(host,''security'',7034|7036) AND NOT re-enable'
- question: Do command lines of GUI/notification utilities show abnormally high length or Shannon entropy,
    or a burst of dialog-rendering invocations, relative to a per-process baseline?
  context: 'Tactic: Defense Impairment. Spoofed-alert commands often carry obfuscated or unusually long
    argument strings and may fire in bursts. Establish a 30-day per-process-name baseline of command-line
    length and Shannon entropy and alert above the 99th percentile (point/contextual anomaly). Additionally
    track Frequency (executions/min of GUI utilities per host) and State (process exit codes / failed
    spawns) so a burst of dialog-rendering invocations is caught. Choose the anomaly type per the canonical
    taxonomy. A positive is a high-entropy/long or bursty GUI-utility invocation; routine short notifications
    are negatives. References: [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [Anomaly Detection: A Survey](https://doi.org/10.1145/1541880.1541882).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints, Centralized Log Aggregator (SIEM)'
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = baseline(cmdline_len, shannon_entropy) per process_name over 30d

      alert WHERE cmdline_len > p99(base) OR entropy > p99(base)

      OR exec_rate(gui_util, host) > burst_threshold

      enrich WITH exit_code, failed_spawn_count'
- question: Does a transformer-based command-line sequence model flag disable-then-fake-status chains,
    and does an adaptive misuse classifier catch rule-evasive renames?
  context: 'Tactic: Defense Impairment. Sequences of commands that disable a tool and then render a fake
    healthy status are detectable as session anomalies. Tokenize command-line arguments and model session
    sequences with a transformer language model (unsupervised masked-LM plus supervised head) to flag
    disable-then-fake-status chains and surface the top offending tokens via attention for triage. Run
    an adaptive misuse classifier in parallel to catch rule-evasive renames while naming the likely evaded
    rule. A positive is a low-likelihood disable->spoof session or an evasive rename of a known pattern;
    ordinary admin sessions are negatives. References: [Anomaly Detection of Command Shell Sessions based
    on DistilBERT](https://arxiv.org/abs/2310.13247); [Detecting Evasions of SIEM Rules in Enterprise
    Networks](https://www.usenix.org/system/files/sec23winter-prepub-112-uetz.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints, Centralized Log Aggregator (SIEM)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'tokens = tokenize(cmdline_sequence_per_session)

      lm = TransformerLM(masked_lm + supervised_head)

      score = lm.session_anomaly(tokens); attn = top_tokens(lm.attention)

      alert WHERE score >= threshold; parallel: adaptive_misuse_clf -> name_evaded_rule'
- question: Is a trusted security tool process observed as the parent of an unexpected child process,
    such as a script interpreter, command shell, or unsigned binary, that is not on the per-environment
    allowlist?
  context: 'Tactic: Defense Impairment. A security tool spawning a shell or scripting engine is a strong
    sign its identity is being abused to present a spoofed status. Build process trees from Windows Event
    ID 4688 / Sysmon Event ID 1 and alert on any parent-child relationship not on the per-environment
    allowlist for the security-tool executable (e.g., MsMpEng/Defender UI spawning cmd.exe, powershell.exe,
    mshta.exe, or an unsigned binary). A positive is a security-tool parent with a non-allowlisted child;
    legitimate updater children are negatives once allowlisted. References: [Sigma](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoints with standard EDR/Antivirus solutions installed, Domain Controllers, Critical Application
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "tree = build_process_tree(read('win:4688','sysmon:1'))\nalert WHERE parent.image IN security_tools\n\
      \  AND (parent.image, child.image) NOT IN allowlist\n  AND child.image IN {cmd.exe,powershell.exe,mshta.exe,wscript.exe}\
      \ OR child.signed == false"
- question: Is the parent-child relationship between a security tool and its child process statistically
    rare versus a rolling baseline, after accounting for child signature and exit state?
  context: 'Tactic: Defense Impairment. Compute the historical frequency of each child spawned by a security
    tool and alert when the parent-child probability falls below 0.1% versus a rolling baseline, with
    State enrichment (child signature status, child exit/failure code) to separate benign updaters from
    spoofing loaders. Derive the rarity cut from environment baselines. A positive is a very-low-probability
    child of a security tool with unsigned/failed state; frequent signed updater children are negatives.
    References: [CAR-2014-11-002: Outlier Parents of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/);
    [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoints with standard EDR/Antivirus solutions installed, Domain Controllers, Critical Application
    Servers'
  range: Last 90 days (rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'p(child|parent) = count(parent->child) / count(parent->*) over rolling_baseline

      alert WHERE parent IN security_tools AND p(child|parent) < 0.001

      enrich WITH child.signature_status, child.exit_code'
- question: Does a graph-ML model (GraphSAGE / autoencoder) flag a security-tool node spawning an unexpected
    scripting engine as anomalous, returning the offending node and neighbors?
  context: 'Tactic: Defense Impairment. Model parent-child relationships as a directed provenance graph
    and use node-level inductive GraphSAGE to flag the anomalous node (a security tool spawning an unexpected
    scripting engine) without prior attack labels, returning the offending node and its neighbors for
    explainability. Complement with a graph autoencoder that reconstructs the suspicious subgraph. A positive
    is an anomalous node embedding for a security-tool->interpreter edge; normal process trees produce
    in-distribution embeddings. References: [ThreaTrace: Detecting and Tracing Host-based Threats in Node
    Level Through Provenance Graph Learning](https://arxiv.org/pdf/2111.04333); [KAIROS: Practical Intrusion
    Detection and Investigation using Whole-system Provenance](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoints with standard EDR/Antivirus solutions installed, Domain Controllers, Critical Application
    Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'G = directed_provenance_graph(process_events)

      emb = GraphSAGE.inductive(G); anom = nodes WHERE emb_outlier(emb)

      alert WHERE anom.node IN security_tools->interpreter; explain = node + neighbors

      complement: graph_autoencoder.reconstruct_subgraph(anom)'
- question: Within a short time window on a single host, does a security tool report a healthy or scan-complete
    status while the System / Service Control Manager log shows its service stopped or terminated unexpectedly?
  context: 'Tactic: Defense Impairment. This logical contradiction is the core signature of spoofed tool
    UI. Trigger when a host emits a security-service stopped/terminated event (Windows Event ID 7034/7036;
    Linux syslog/auditd for security daemons; macOS unified log for XProtect/Gatekeeper/AV) and then logs
    a healthy/scan-complete status from that same tool within 5 minutes without an intervening re-enable,
    encoded as an explainable open-world contradiction rule that reports which premises fired. Keep deterministic
    service-state rules from Sigma. A positive is healthy-status-after-stop with no re-enable; a clean
    restart with re-enable is a negative. References: [Detecting Malware Activities With MalpMiner: A
    Dynamic Analysis Approach](https://doi.org/10.1109/ACCESS.2023.3266562); [Sigma](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 7036
  - Windows Event ID 7034
  - Zeek conn.log
  - 'NAI: Centralized SIEM Platform (for event correlation), All Windows Endpoints (forwarding Service
    Control Manager and Application logs), Network Security Monitoring sensors at key chokepoints'
  range: Last 90 days (5-minute correlation windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "stop = svc_event(host, tool, state in {stopped,terminated})  # win:7034/7036, syslog, auditd,\
      \ unifiedlog\nhealthy = status_event(host, tool, state in {healthy,scan_complete})\nalert WHERE\
      \ healthy.time - stop.time <= 5m\n  AND NOT exists reenable(host, tool) BETWEEN stop AND healthy\n\
      report premises_fired"
- question: Has the normally-positive correlation between scan-complete and healthy events become significantly
    negative, or do service-query failures rise while healthy counts persist, versus a 30-day baseline?
  context: 'Tactic: Defense Impairment. Track per-host time-series counts of service-stopped, healthy-status,
    and service-query-failure events for each security tool and alert when the normally-positive correlation
    between scan-complete and healthy becomes significantly negative versus a 30-day baseline, or when
    service-query failures rise while healthy counts persist. Model the start->scan->scan-complete->healthy
    trace and flag high-leverage traces where healthy lacks a preceding scan-complete. A positive is decoupled
    scan/healthy correlation or failures-with-persistent-healthy; aligned scan-then-healthy is a negative.
    References: [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [Business Process Event Log Anomaly Detection based on Statistical Leverage](https://ceur-ws.org/Vol-2952/paper_291a.pdf).'
  answer_sources:
  - Windows Event ID 7036
  - Windows Event ID 7034
  - Zeek conn.log
  - 'NAI: Centralized SIEM Platform (for event correlation), All Windows Endpoints (forwarding Service
    Control Manager and Application logs), Network Security Monitoring sensors at key chokepoints'
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "ts = per_host_per_tool counts(stopped, healthy, query_failure)\ncorr = rolling_corr(scan_complete,\
      \ healthy)\nalert WHERE corr << baseline_corr (significantly negative)\n  OR (query_failure rising\
      \ AND healthy persists)\ntrace = model(start->scan->scan_complete->healthy); flag high_leverage(healthy\
      \ WITHOUT scan_complete)"
- question: Does a sequence model trained on legitimate service-state sequences flag low-probability traces,
    such as a healthy status without a preceding scan-complete, surfacing the deviating transition?
  context: 'Tactic: Defense Impairment. Treat the contradiction as a contextual/collective anomaly and
    train a sequence model (e.g., HMM or trace-leverage scorer) on legitimate service-state sequences,
    alerting on low-probability sequences such as a healthy status without a preceding scan-complete,
    and surface the deviating transition in the alert. Score the host event trace unsupervised with statistical
    leverage. A positive is a low-likelihood service-state sequence with a missing expected transition;
    normal start->scan->complete->healthy traces are negatives. References: [Anomaly Detection: A Survey](https://doi.org/10.1145/1541880.1541882);
    [Business Process Event Log Anomaly Detection based on Statistical Leverage](https://ceur-ws.org/Vol-2952/paper_291a.pdf).'
  answer_sources:
  - Windows Event ID 7036
  - Windows Event ID 7034
  - Zeek conn.log
  - 'NAI: Centralized SIEM Platform (for event correlation), All Windows Endpoints (forwarding Service
    Control Manager and Application logs), Network Security Monitoring sensors at key chokepoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = HMM.train(legit_service_state_sequences)

      p = model.sequence_prob(host_trace)

      alert WHERE p < tau; explain = deviating_transition

      unsupervised: leverage_score(host_event_trace)'
- question: Is a process running with a misspelled security-tool name or from an unauthorized file path,
    with a missing/invalid signature or unknown hash, indicating impersonation of the legitimate security
    UI or service?
  context: 'Tactic: Defense Impairment. Maintain a dictionary of legitimate security-tool executables
    (name, signer, expected path, known hashes) and alert when Windows Event ID 4688 / Sysmon Event ID
    1 shows a matching or near-matching name (small Levenshtein distance) with the wrong path, missing/invalid
    signature, or unknown hash, using impersonation/rename rules from Sigma. Run an adaptive misuse layer
    to catch relocated/renamed variants while naming the evaded rule. A positive is a near-name match
    from the wrong path or with an invalid signature; the genuine signed binary in its expected path is
    a negative. References: [Sigma](https://github.com/SigmaHQ/sigma); [Detecting Evasions of SIEM Rules
    in Enterprise Networks](https://www.usenix.org/system/files/sec23winter-prepub-112-uetz.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows Endpoints (File System and Process Monitoring), Network Firewalls and Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "dict = security_tools(name, signer, expected_path, known_hashes)\nproc = read('win:4688','sysmon:1','win:5156')\n\
      alert WHERE (levenshtein(proc.name, dict.name) <= 2)\n  AND (proc.path != dict.expected_path OR\
      \ proc.signature invalid OR proc.hash NOT IN dict.known_hashes)\nadaptive_misuse -> name_evaded_rule"
- question: Does a process impersonating a security-tool name land at an anomalous file-path entropy or
    directory depth (98th percentile or higher) or in an unexpected directory, with signature-validation
    failures?
  context: 'Tactic: Defense Impairment. Baseline entropy and directory depth of legitimate security-tool
    paths and alert when a process impersonating a security-tool name lands at the 98th percentile or
    higher, or in an unexpected directory, with State enrichment (signature-validation failures). Treat
    the unusual path-in-context as a contextual anomaly. A positive is an impersonating-named process
    from a high-entropy/deep or unexpected path with a bad signature; genuine tools in standard program
    directories are negatives. References: [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [Anomaly Detection: A Survey](https://doi.org/10.1145/1541880.1541882).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows Endpoints (File System and Process Monitoring), Network Firewalls and Proxies'
  range: Last 90 days (path baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = baseline(path_entropy, dir_depth) for legit security-tool paths\nalert WHERE proc.name\
      \ ~ security_tool_name\n  AND (path_entropy >= p98(base) OR dir_depth >= p98(base) OR path NOT IN\
      \ expected_dirs)\nenrich WITH signature_validation_failure"
- question: Does a one-class model trained on legitimate tool executions flag an outlier resembling impersonation,
    reporting the top deviating features and rare context tuples?
  context: 'Tactic: Defense Impairment. Train a one-class model (e.g., one-class SVM) on file-path depth,
    parent process, signature status, and PE metadata to flag outlier executions resembling impersonation,
    reporting the top-3 deviating features in the alert. Cross-reference rare context tuples (name, path,
    signer, parent) and expose the contributing attribute. A positive is an out-of-distribution execution
    for a tool name with rare (name,path,signer,parent) context; in-distribution legitimate executions
    are negatives. References: [Anomaly Detection: A Survey](https://doi.org/10.1145/1541880.1541882);
    [Context-based irregular activity detection in event logs for forensic investigations](https://www.sciencedirect.com/science/article/pii/S0957417423014938).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows Endpoints (File System and Process Monitoring), Network Firewalls and Proxies'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'ocsvm = OneClassSVM.train(legit_tool_execs[path_depth,parent,signature,pe_meta])

      alert WHERE ocsvm.predict(exec) == outlier; explain = top3_deviating_features

      xref rare_context_tuple(name, path, signer, parent) -> contributing_attribute'
- question: After a security control is disabled or stopped, do healthy-status messages from the same
    host and tool continue without a corresponding re-enable within 15 minutes?
  context: 'Tactic: Defense Impairment. Monitor for security-control disabled/stopped events and alert
    when healthy status messages continue without a corresponding re-enable from the same host and tool
    within 15 minutes, encoded as an explainable contradiction rule and backed by service-state rules
    from Sigma. A positive is persistent healthy messaging after a disable with no re-enable; a disable
    followed by a prompt legitimate re-enable is a negative. References: [Detecting Malware Activities
    With MalpMiner: A Dynamic Analysis Approach](https://doi.org/10.1109/ACCESS.2023.3266562); [Sigma](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Application Event Log
  - Microsoft-Windows-Windows Defender/Operational
  - 'NAI: Centralized Log Management Platform (SIEM), All Windows Endpoints'
  range: Last 90 days (15-minute correlation windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'disable = control_event(host, tool, state in {disabled,stopped})

      healthy = status_event(host, tool, state == healthy)

      alert WHERE healthy AFTER disable AND NOT reenable(host,tool) WITHIN 15m'
- question: Does the hourly volume of healthy-status reports per host/tool exceed 3 standard deviations
    above baseline (flood) or drop to zero longer than the normal reporting interval (dead reporter)?
  context: 'Tactic: Defense Impairment. Model the hourly count of healthy status reports per host/tool
    over a 30-day baseline and alert when the count exceeds 3 standard deviations above baseline (flood)
    or drops to zero longer than the normal reporting interval (dead reporter / failure-mode signal);
    also baseline the rate of report-delivery failures, treating floods/cessations as collective anomalies.
    A positive is a flood or a prolonged cessation of healthy reports; steady periodic reporting is a
    negative. References: [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [Anomaly Detection: A Survey](https://doi.org/10.1145/1541880.1541882).'
