name: 'T1685.003: Disable or Modify Tools: Modify or Spoof Tool UI'
id: e84409fd-4f2d-47e2-8213-13f22efb98ad
description: 'Investigate adversary attempts to spoof or fake the user interface and status reporting
  of security tools so that defenders believe protection is healthy while it has in fact been disabled,
  terminated, or bypassed (MITRE ATT&CK T1685.003, Modify or Spoof Tool UI). This playbook helps an analyst
  hunt for the tell-tale contradiction at the heart of this technique: a security control reporting a
  "healthy" or "scan-complete" status while its underlying service or daemon is stopped, terminated, or
  missing. Across Windows, macOS, and Linux endpoints it guides hunting for fake security UIs and loaders
  (process creation via Windows Event ID 4688 / Sysmon Event ID 1 correlated with network events and threat
  intelligence), command lines that drive GUI/notification primitives (msg.exe, mshta.exe, PowerShell
  ShowDialog / Windows.Forms MessageBox, alert-like VBScript/JScript), trusted security tools spawning
  unexpected child interpreters or unsigned binaries, impersonation via misspelled names or wrong file
  paths (Levenshtein/path/hash checks), abnormal floods or cessations of healthy-status messages, and
  spoofing content staged from external hosts (Zeek dns/http/conn logs). Detection spans explainable symbolic-logic
  contradiction rules and Sigma watchlists, statistical baselining (prevalence, entropy, z-score, rarity,
  time-series), and machine-learning approaches (provenance-graph autoencoders/GraphSAGE, transformer
  command-line modeling, one-class and sequence models), giving layered, defensible coverage for this
  Defense Impairment technique.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
