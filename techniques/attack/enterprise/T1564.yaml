name: 'T1564: Hide Artifacts'
id: 7168d769-7c49-40e0-ae87-def1626f8fc4
description: Investigate whether an adversary is attempting to conceal artifacts of their activity to
  evade detection on Windows, Linux, macOS, ESXi, and Office Suite environments. This playbook helps an
  analyst hunt for hidden files, directories, user accounts, and scheduled tasks; abuse of file/registry
  attributes (attrib +h, chattr +i/+a, chflags hidden, Alternate Data Streams); known artifact-hiding
  tools and rootkits; timestomping of file metadata; execution from unusual or hidden paths correlated
  with suspicious outbound network activity; typosquatted or high-entropy account and task names; hidden
  scheduled tasks (deleted Security Descriptor values); and concealed objects surfaced through cross-view
  differencing of tamper-resistant versus user-visible enumerations. It supports symbolic-logic detection
  rules, statistical baselining/scoring, and machine-learning anomaly and classification approaches to
  expose stealth behavior across endpoint, network, and cloud telemetry.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any processes or files on Windows endpoints, servers, or domain controllers matching known
    artifact-hiding tools or rootkits (e.g., Slacker, Transmo, Ghost-in-the-Logs), or exhibiting the deterministic
    hidden+system attribute combination with system-mimicking filenames?
  context: An adversary practicing Stealth (TA0005) frequently brings purpose-built concealment tooling
    or rootkit components onto a host. Watching process creation (Event ID 4688) and file creation/access
    (Event ID 4663) for matches against a curated threat-intelligence list of artifact-hiding tools and
    rootkit hashes catches the concealment mechanism either at execution or simply at rest on disk. Seed
    the IOC list from reproducible atomic command lines (attrib +h, hidden-user creation, hidden window
    styles, ADS writes) and treat the deterministic hidden+system attribute combination plus system-mimicking
    filenames as a high-fidelity floor. A positive match is strong evidence concealment tooling is present;
    a negative result narrows but does not exclude novel/unknown tooling, so pair it with behavioral analytics.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: All Windows Endpoints, All Windows Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "        source IN (WinEventLog:Security EventCode=4688 OR EventCode=4663)\n        | eval\
      \ ioc_match = (NewProcessName IN known_hiding_tools)\n            OR (lower(CommandLine) MATCHES\
      \ known_hiding_cmdlines)\n            OR (file_hash IN known_rootkit_hashes)\n            OR (file_attributes\
      \ CONTAINS \"HIDDEN\" AND file_attributes CONTAINS \"SYSTEM\"\n                AND filename LIKE\
      \ system_mimicking_names)\n        | where ioc_match=true\n        | table _time, host, user, NewProcessName,\
      \ CommandLine, file_hash"
- question: Which Windows process creation events show a rare or improbable parent-child relationship
    (e.g., winword.exe or outlook.exe spawning cmd.exe/powershell.exe), a new process name within Levenshtein
    distance 1-2 of a system process, or a spike in access-denied/error returns from enumeration tooling?
  context: Concealment under Stealth (TA0005) often manifests as anomalous process lineage and name spoofing.
    Computing enterprise-wide prevalence of parent processes surfaces office applications or other unexpected
    parents launching shells - a classic living-off-the-land pattern. Levenshtein-distance scoring against
    legitimate system process names exposes typosquatting (e.g., svch0st.exe). Separately, a spike in
    access-denied/error returns from enumeration tooling is itself a concealment signal because hidden
    objects cause failed reads. Positive findings warrant pivoting to the full process tree and command
    line; rarity alone is not malicious, so correlate with other risk factors.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: All Windows Endpoints, All Windows Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "        source=WinEventLog:Security EventCode=4688\n        | stats count by ParentProcessName,\
      \ NewProcessName\n        | eventstats sum(count) as total\n        | eval prevalence = count/total\n\
      \        | eval susp_parent = (ParentProcessName IN (\"winword.exe\",\"outlook.exe\",\"excel.exe\"\
      )\n            AND NewProcessName IN (\"cmd.exe\",\"powershell.exe\"))\n        | eval lev = levenshtein(NewProcessName,\
      \ nearest_system_proc)\n        | where prevalence < 0.01 OR susp_parent=true OR lev IN (1,2)\n\
      \        | append [ search EventCode=4688 status=\"access_denied\" | timechart span=1h count as\
      \ denials ]"
- question: When new process creation events are scored by a supervised classifier (using process-name
    entropy, command-line length/entropy, parent rarity, and suspicious keywords), which executions rank
    as likely malicious tool execution, and do any benign-named files actually contain executable content?
  context: To catch novel artifact-hiding tooling that evades IOC lists, train a supervised model (Random
    Forest / Gradient Boosting) on labeled Event ID 4688 data with engineered features (name entropy,
    command-line length and entropy, parent rarity, suspicious-keyword presence). The model scores each
    new process and emits the top-3 contributing features for explainability. In parallel, run a raw-byte
    CNN (MalConv-style) over files whose extension/name is benign but whose content may be executable,
    classifying content independent of surface obfuscation - directly countering Stealth (TA0005). High-scoring
    events should be triaged with their feature explanations; the classifier complements, rather than
    replaces, deterministic rules.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: All Windows Endpoints, All Windows Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "        features = extract(EventID=4688: name_entropy, cmdline_len, cmdline_entropy,\n   \
      \                        parent_rarity, suspicious_keyword_flags)\n        score = RandomForest.predict_proba(features)\n\
      \        if score >= threshold: alert(top3_features(features), score)\n        # parallel content\
      \ classifier independent of extension\n        for f in created_files: if MalConv.predict(raw_bytes(f))\
      \ == 'malicious': alert(f)"
- question: Do tamper-resistant enumerations of processes, modules, files, or registry keys reveal objects
    that are absent from the standard user-visible view (i.e., objects that are actively concealed)?
  context: 'The most direct test for Stealth (TA0005) concealment is cross-view differencing: any object
    present in an authoritative, tamper-resistant enumeration but missing from the standard view is hidden
    by definition. Apply kernel data-structure invariants (a runnable task must appear in the all-tasks
    list), hypervisor semantic-view reconstruction, and for the registry compare native-API/WMI StdRegProv
    enumeration to reg.exe output to surface null-byte hidden keys. Alert with the specific object(s)
    that differ between views. This is a deterministic, high-fidelity method; any discrepancy is suspicious
    and should be captured for forensics before the attacker can clean up.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: All Windows Endpoints, All Windows Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: EDR/Cross-view pseudocode
    query: "        auth_view = enumerate_via_kernel_or_wmi(processes, modules, files, registry)\n   \
      \     user_view = enumerate_via_standard_api(processes, modules, files, registry)\n        hidden\
      \ = auth_view - user_view\n        if hidden not empty: alert(object_type, hidden_objects)\n   \
      \     # registry: diff StdRegProv/native-API keys vs reg.exe output for null-byte keys"
- question: Are any process command lines invoking artifact-hiding syntax such as 'attrib.exe +h', 'icacls
    /deny', PowerShell 'Set-Content -Stream', redirection into an Alternate Data Stream (type file > path:stream),
    or Linux/macOS equivalents (chattr +i/+a, chflags hidden, setfile -a V, leading-dot files in /etc,
    /var, /usr/bin)?
  context: 'Adversaries hide artifacts (Stealth, TA0005) using built-in OS utilities. Regex detection
    over command lines (Event ID 4688) catches the explicit syntax of hiding: attrib +h, icacls /deny,
    PowerShell Set-Content -Stream, and ADS-creating redirection. Extend coverage with the full ADS/extended-attribute
    toolkit (makecab, esentutl, wmic, expand, mklink, certutil writing to a '':stream''). On Linux/macOS
    add chattr +i/+a, chflags hidden, setfile -a V, and creation of leading-dot files in sensitive directories.
    Matches are high-signal but legitimate admin use exists, so confirm the actor, target file, and surrounding
    context.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints, File Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "        source=WinEventLog:Security EventCode=4688\n        | regex CommandLine=\"(?i)(attrib\\\
      .exe.*\\+h|icacls\\.exe.*\\/deny|powershell.*Set-Content.*-Stream|type .*>.*:.*|makecab|esentutl|expand|mklink|certutil.*:.*)\"\
      \n        | table _time, host, user, NewProcessName, CommandLine\n        ;; Linux/macOS (auditd:EXECVE\
      \ / unifiedlog):\n        cmd MATCHES \"(chattr \\+[ia]|chflags hidden|setfile -a V|touch .*/\\\
      .[^/]+ in /etc|/var|/usr/bin)\""
- question: For common utilities (attrib.exe, icacls.exe, powershell.exe), which executions use rare argument
    combinations (below the 5th percentile of a 30-day baseline), exhibit high Shannon entropy (>7.0)
    in the command string, or produce access-denied results from 'icacls /deny'?
  context: Beyond static regex, baselining the argument sets of common utilities over 30 days lets you
    flag the rare-and-suspicious tail (below the 5th percentile) that simple rules miss - a hallmark of
    Stealth (TA0005) misuse. Layering Shannon-entropy scoring on the raw command string catches encoded/encrypted
    payloads that trend toward entropy >7.0. The access-denied result of 'icacls /deny' is itself a distinct
    failure-mode signal worth tracking. Positive results indicate uncommon usage that merits review against
    the user's role and baseline; common arguments at high frequency are likely benign.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints, File Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "        source=WinEventLog:Security EventCode=4688\n        | where NewProcessName IN (\"\
      attrib.exe\",\"icacls.exe\",\"powershell.exe\")\n        | stats count by NewProcessName, CommandLine\n\
      \        | eventstats perc5(count) as p5 by NewProcessName\n        | eval cmd_entropy = shannon_entropy(CommandLine)\n\
      \        | where count <= p5 OR cmd_entropy > 7.0 OR CommandLine LIKE \"%/deny%\"\n        | table\
      \ _time, host, user, NewProcessName, CommandLine, count, cmd_entropy"
- question: When tokenized command-line arguments are scored by an unsupervised anomaly model (variational
    autoencoder or isolation forest), which commands exceed the anomaly threshold, and what are their
    top-3 anomalous tokens?
  context: An unsupervised model trained on tokenized Event ID 4688 command lines learns the distribution
    of normal command structure, then flags high reconstruction-error / high-anomaly-score commands -
    effective against obfuscated or never-before-seen hiding commands used for Stealth (TA0005). Use character/token-frequency,
    entropy, and AST feature families validated for obfuscated PowerShell. Reporting the top-3 anomalous
    tokens supports rapid triage. Anomalous does not equal malicious, so analysts should review flagged
    commands in context; the model's value is surfacing the unusual for human judgment.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints, File Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "        tokens = tokenize(CommandLine)  # char/token-freq, entropy, AST features\n       \
      \ score = IsolationForest.score(tokens)  # or VAE reconstruction_error\n        if score >= threshold:\
      \ alert(command=CommandLine, top3_tokens=most_anomalous(tokens))"
- question: Is a known timestomping utility or PowerShell timestomping command (e.g., Set-ItemProperty
    -Name CreationTime) executed within a few seconds of a file modification on the same host, or do NTFS
    $STANDARD_INFORMATION timestamps appear coarser or earlier than the corresponding $FILE_NAME timestamps?
  context: Timestomping is a Stealth (TA0005) technique to make malicious files blend with legitimate
    ones by altering their MACE timestamps. A correlation rule firing when a timestomping tool/command
    (Event ID 4688/4104) precedes a file modification (Event ID 4663) on the same host within a tight
    window (e.g., 5 seconds) catches the act. Add a forensic floor flagging NTFS records where $STANDARD_INFORMATION
    timestamps are coarser (zeroed sub-second) than, or earlier than, the $FILE_NAME timestamps - the
    classic deterministic timestomp tell. Reproduce the behavior with atomic tests for baselining. A correlated
    hit is strong evidence of anti-forensic timestamp manipulation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4104
  - 'NAI: Critical System Directories (e.g., System32), User Profile Directories, Temporary File Locations'
  range: Last 90 days; correlate within a 5-second window around the timestomping process event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "        source=WinEventLog:Security EventCode IN (4688,4104)\n          (CommandLine LIKE\
      \ \"%Set-ItemProperty%CreationTime%\" OR NewProcessName IN known_timestomp_tools)\n        | join\
      \ host [ search EventCode=4663 action=\"modify\" ]\n        | where abs(proc_time - file_mod_time)\
      \ <= 5\n        ;; forensic floor:\n        | where SI_timestamp < FN_timestamp OR subsecond(SI_timestamp)==0"
- question: For file modifications in sensitive directories, which events show a negative or extreme (>99th
    percentile) delta between the event time and the file's new Modified timestamp, an exact timestamp
    match to an unrelated neighboring file, or sub-second-precision loss?
  context: Statistical profiling of timestamp deltas reveals timestomping that bypasses tool-name matching
    - core to detecting Stealth (TA0005) anti-forensics. For each file modification (Event ID 4663) compute
    the difference between event time and the file's new Modified time; negative deltas (timestamp set
    to the past) or values beyond the 99th percentile are suspicious. Comparing a modified file's timestamp
    to neighbors flags copy-from-neighbor timestomps (exact match to an unrelated file). Profile sub-second-precision
    loss as a separate feature, since many timestomp tools zero the sub-second component. Hits warrant
    forensic timeline review.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4104
  - 'NAI: Critical System Directories (e.g., System32), User Profile Directories, Temporary File Locations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "        source=WinEventLog:Security EventCode=4663 path IN sensitive_dirs\n        | eval\
      \ delta = event_time - new_modified_time\n        | eventstats perc99(delta) as p99\n        | eval\
      \ neighbor_match = (new_modified_time IN neighbor_file_times)\n        | eval subsec_zero = (subsecond(new_modified_time)==0)\n\
      \        | where delta < 0 OR delta > p99 OR neighbor_match=true OR subsec_zero=true"
- question: Does a sequence/time-series model over file-metadata and audit-log streams detect any event
    that moves a timestamp backward or to a statistically improbable value, and which log key or metadata
    transition broke the expected pattern?
  context: A sequence anomaly model (DeepLog-style log-key sequencing, with a system-call-sequence anomaly
    foundation) learns the normal ordering of log keys and metadata transitions across EDR/file-integrity
    streams, then flags any event that regresses a timestamp or transitions improbably - catching subtle
    Stealth (TA0005) timestomping that static thresholds miss. Crucially, it surfaces the specific log
    key/transition that broke the expected pattern, so analysts can triage the exact anomalous step. This
    complements deterministic and statistical timestamp checks by modeling temporal context rather than
    single values.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4104
  - 'NAI: Critical System Directories (e.g., System32), User Profile Directories, Temporary File Locations'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "        seq = ordered_log_keys(file_metadata_stream + audit_stream)\n        pred = DeepLog.next_key_distribution(seq)\n\
      \        for event in seq:\n          if event.key not in pred.topk OR event.timestamp < prev.timestamp:\n\
      \            alert(broken_key=event.key, transition=event.transition)"
- question: Do any processes launched from unusual or hidden locations (C:\Users\Public\, C:\$Recycle.Bin\,
    temp directories, or Alternate Data Streams like file.txt:implant.exe) initiate outbound network connections,
    especially to non-standard ports, low-reputation IPs, or with connection failures / DNS NXDOMAIN bursts?
  context: Adversaries hide payloads in non-standard paths and ADS (Stealth, TA0005) and then beacon out.
    Joining process creation (Event ID 4688) with network logs (Zeek conn.log / Event ID 5156) on source
    IP within a tight time window exposes a hidden-path process making outbound connections. Treat execution
    directly from an Alternate Data Stream as a deterministic high-fidelity trigger. Profiling connection
    failures (blocked/refused/RST) and DNS NXDOMAIN bursts from such processes catches concealed C2 even
    when the destination is blocked. A correlated hit strongly suggests a concealed implant communicating
    externally.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows Endpoints, Network Egress Points (Firewalls, Proxies), DNS Servers'
  range: Last 90 days; correlate process and network events within a tight (e.g., 60-second) window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "        source=WinEventLog:Security EventCode=4688\n        | regex NewProcessName=\"(?i)(\\\
      \\Users\\\\Public\\\\|\\\\AppData\\\\Local\\\\Temp\\\\|\\\\\\$Recycle\\.Bin\\\\|:[^\\\\]+\\.exe)\"\
      \n        | join src_ip, _time(+/-60s) [ search source IN (Zeek:conn, EventCode=5156) direction=outbound\
      \ ]\n        | eval ads_exec = NewProcessName LIKE \"%:%\"\n        | where ads_exec=true OR dest_port\
      \ NOT IN common_ports OR dest_ip_reputation=low OR conn_state IN (\"REJ\",\"RSTO\",\"S0\")"
  - technology: Zeek/pseudocode
    query: "        conn.log: filter orig_h=host where proc_path matches hidden_path_regex\n        |\
      \ flag conn_state in (S0,REJ,RSTO) as failed\n        | join dns.log NXDOMAIN bursts by orig_h"
- question: Which process execution paths are rare across the enterprise (high inverse-document-frequency)
    and, combined with unsigned binaries, non-standard destination ports, new destination IPs, outbound
    volume/frequency, and failed-connection counts, produce a composite risk score exceeding ~3 standard
    deviations above the mean?
  context: A single rare path is weak evidence; a weighted composite is strong. For every Event ID 4688
    path, compute enterprise rarity over a 30-day baseline (IDF-style) and combine it with signed-status,
    destination-port normality, destination-IP novelty, outbound byte volume/ratio, and connections-per-minute.
    Treat failed-connection counts as a separate dimension. Processes whose composite risk exceeds ~3
    standard deviations above the mean are prioritized - efficiently surfacing concealed (Stealth, TA0005)
    tooling beaconing out. The score ranks investigation order; analysts confirm by examining the binary,
    path, and network destination.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows Endpoints, Network Egress Points (Firewalls, Proxies), DNS Servers'
  range: Last 90 days; baseline path rarity over a rolling 30-day window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "        source=WinEventLog:Security EventCode=4688\n        | stats count by NewProcessName_path\n\
      \        | eval idf = log(total_hosts / hosts_with_path)\n        | eval risk = w1*idf + w2*unsigned\
      \ + w3*nonstd_port + w4*new_dest_ip\n                     + w5*out_bytes_z + w6*conn_per_min_z +\
      \ w7*failed_conns\n        | eventstats mean(risk) as mu, stdev(risk) as sd\n        | where risk\
      \ > mu + 3*sd"
- question: In a whole-system provenance graph (processes, files, IPs, domains as nodes; interactions
    as edges), does a process from a rare or hidden path connect to a new external IP in a way that drifts
    structurally from the benign envelope, and which nodes/edges contribute most?
  context: Graph-based detection captures the relational structure of concealed (Stealth, TA0005) activity
    that point detections miss. Build a heterogeneous provenance graph and detect the structural anomaly
    of a rare/hidden-path process reaching a new external IP using graph-sketch drift from a benign envelope
    (UNICORN-style), then score individual nodes with GraphSAGE to localize the specific hidden/injected
    node (ThreaTrace-style) for explainable triage. Emit the top-3 contributing nodes/edges. Reference
    datasets include DARPA TC and StreamSpot. A flagged subgraph directs analysts to the precise concealed
    component and its external contact.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows Endpoints, Network Egress Points (Firewalls, Proxies), DNS Servers'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "        G = build_provenance_graph(process, file, ip, domain nodes; interaction edges)\n \
      \       sketch = graph_sketch(G)\n        if drift(sketch, benign_envelope) > threshold:\n     \
      \     node_scores = GraphSAGE.score_nodes(G)\n          alert(top3_nodes_edges=rank(node_scores))"
- question: Are any new user accounts (Event ID 4720) or scheduled tasks (Event ID 4698) created with
    names within Levenshtein distance 1-2 of critical system/service accounts, or are scheduled-task Security
    Descriptor (SD) values being deleted (hiding the task), or hidden inbox rules created visible only
    in raw MAPI properties?
  context: 'Adversaries hide persistence by mimicking trusted names and by making tasks invisible (Stealth,
    TA0005). A rule comparing new account/task names against a watchlist with a low Levenshtein distance
    (1-2) catches typosquats like ''Administartor'' or ''svch0st''. Add deterministic hidden-task detection:
    alert on deletion of the SD value under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\<task>,
    which makes a task vanish from schtasks/GUI. Also alert on hidden inbox-rule creation visible only
    in raw MAPI properties. Reproduce hidden-account creation for tuning with atomic tests. Hits are high-fidelity
    persistence-concealment indicators.'
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4698
  - 'NAI: Domain Controllers, Active Directory Servers, All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "        source=WinEventLog:Security EventCode IN (4720,4698)\n        | eval lev = min_levenshtein(TargetName,\
      \ critical_account_watchlist)\n        | where lev IN (1,2)\n        ;; hidden task via SD deletion:\n\
      \        EventCode=4657 path LIKE \"%TaskCache\\\\Tree\\\\%\\\\SD\" action=deleted\n        ;; hidden\
      \ inbox rule visible only in raw MAPI properties -> alert"
- question: Which new account or task names have Shannon entropy in the top 5th percentile of the environment
    baseline (suggesting machine-generated names), and do cross-view count checks (net user / Get-LocalUser
    / AD versus SAM hive) disagree, indicating a hidden account?
  context: High name randomness signals automated, throwaway artifacts an adversary would rather you not
    notice (Stealth, TA0005). Computing Shannon entropy for each new account/task name and flagging the
    top 5th percentile against a baseline distribution surfaces machine-generated naming. Separately,
    a cross-view count check comparing net user / Get-LocalUser / AD enumeration against direct SAM hive
    enumeration catches hidden accounts when the counts disagree - a deterministic concealment signal
    grounded in cross-view differencing. Entropy outliers warrant review of who/what created the name;
    count mismatches are high-confidence indicators of a hidden account.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4698
  - 'NAI: Domain Controllers, Active Directory Servers, All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "        source=WinEventLog:Security EventCode IN (4720,4698)\n        | eval ent = shannon_entropy(TargetName)\n\
      \        | eventstats perc95(ent) as p95\n        | where ent >= p95\n        ;; cross-view account\
      \ count check:\n        | eval visible = count(net_user/Get-LocalUser/AD)\n        | eval authoritative\
      \ = count(SAM_hive_enum)\n        | where visible != authoritative -> alert(hidden_account)"
- question: When a one-class model (one-class SVM or isolation forest) trained on known-good account and
    task names scores new names, which are classified as outliers, and does sequence/provenance analysis
    show the name was created by an anomalous process chain?
  context: 'A one-class model trained on legitimate account/task names (features: length, character-pair
    frequency, n-gram distribution, entropy) classifies new names as inliers or outliers, generalizing
    beyond explicit watchlists to catch novel concealed (Stealth, TA0005) naming. Reporting the top-3
    contributing features aids triage. Complementing name-only scoring with sequence/provenance anomaly
    detection (DeepLog/ThreaTrace-style) lets the model also learn that a hidden account/task is created
    by an anomalous process chain - raising confidence when both the name and its creation context look
    wrong. Outliers should be reviewed with their feature explanations and creating-process lineage.'
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4698
  - 'NAI: Domain Controllers, Active Directory Servers, All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "        feats = name_features(TargetName)  # length, char-pair freq, n-grams, entropy\n  \
      \      if OneClassSVM.predict(feats) == 'outlier':\n          chain_anom = DeepLog/ThreaTrace.score(creation_process_chain)\n\
      \          alert(top3_features(feats), chain_anomaly=chain_anom)"
