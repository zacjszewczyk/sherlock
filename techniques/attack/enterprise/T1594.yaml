    web server originates from a source IP address or contains a User-Agent string matching an entry on
    a threat intelligence feed of known malicious indicators (e.g., TOR exit nodes, known scanning infrastructure,
    malicious user agents). The ''Explainable recon scoring'' approach (Machine Learning) works as follows:
    Train a logistic-regression or gradient-boosted classifier on labeled sessions using spoof-resistant
    navigational features (request volume, request rate, %HEAD, null-referer ratio, %4xx error responses)
    from [Tan & Kumar](https://link.springer.com/article/10.1023/A:1013228602957), validated on [CIC-IDS2017](https://www.unb.ca/cic/datasets/ids-2017.html);
    alert when predicted malicious probability exceeds 0.85 and surface the top-3 contributing features
    (e.g., null-referer %, 404 rate, request rate) in the alert text for triage. A positive result --
    a rule match, statistical outlier, or model alert -- indicates probable web reconnaissance against
    victim-owned content; pivot to the source IP and its ASN/geolocation, the User-Agent and referer,
    the specific URIs and sensitive resources requested, the request rate and error profile, and any reverse-DNS
    or threat-intel attribution to scope what the adversary may have learned and to inform perimeter blocking
    or rate-limiting. A negative result helps rule out this particular reconnaissance vector but should
    be corroborated with the other questions in this playbook, since adversaries spoof User-Agents and
    IPs, distribute requests across sources, and throttle low-and-slow crawling to evade any single method.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Public-facing web servers, Network perimeter firewalls/proxies, Web Application Firewalls (WAFs),
    Cloud-hosted web applications, Threat Intelligence Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model = train(GBM|LogReg, features=[req_volume,req_rate,pct_HEAD,null_referer_ratio,pct_4xx],
      data=CIC-IDS2017_labeled); score session features -> p_malicious; IF p_malicious > 0.85 THEN ALERT(top3_features(SHAP),
      source=id.orig_h)
