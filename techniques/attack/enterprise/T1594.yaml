    and initial-access efforts. This evidence focuses on the condition that a single external source IP
    generates a volume of requests, rate of requests, or diversity of unique URIs accessed that is statistically
    anomalous compared to a baseline of typical user behavior. The ''Volume, rate and URI-diversity thresholds''
    approach (Statistical Method) works as follows: For each source IP over 10-minute windows compute
    request rate, total request volume (bytes and count), unique-URI count, and the 4xx error ratio (state),
