    These traffic-pattern features are the established robot discriminators ([Doran & Gokhale](https://link.springer.com/article/10.1007/s10618-010-0180-z),[Tan
    & Kumar](https://link.springer.com/article/10.1023/A:1013228602957)). A positive result -- a rule
