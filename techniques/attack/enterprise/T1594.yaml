    query: vectors = session_features[duration,req_count,inter_req_regularity,pct_HEAD,null_referer_ratio,uri_diversity];
      labels = DBSCAN(vectors); ALERT sessions WHERE label==noise OR cluster IN robot_clusters (report
      top3 deviating features)
