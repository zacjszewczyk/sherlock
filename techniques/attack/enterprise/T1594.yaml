name: 'T1594: Search Victim-Owned Websites'
id: 6effe55b-e579-44ce-aad7-61126223a90d
description: 'This playbook helps an analyst investigate whether an external adversary is conducting reconnaissance
  by searching the organization''s public-facing, victim-owned websites for actionable information (MITRE
  ATT&CK T1594, Search Victim-Owned Websites). Victim-owned sites expose department/division names, physical
  locations, key-personnel details (names, roles, email addresses), and business operations and relationships
  that an adversary can leverage for follow-on Phishing for Information, Search Open Technical Databases,
  account establishment or compromise, and ultimately initial access. Beyond manual browsing, adversaries
  enumerate hidden directories and files (forced browsing / wordlist scanning), harvest robots.txt and
  sitemap.xml, and pull sensitive paths such as /.git/, /wp-admin/, and /.env. Because this technique
  manifests in web-facing telemetry rather than on endpoints, the hunt centers on perimeter and application
  logs: Zeek http.log and conn.log from public web servers, CDN edge nodes, load balancers, WAFs, NIDS,
  and CMS access logs. It pursues the behavior from several complementary angles: HTTP/S sessions matching
  threat-intel indicators (malicious IPs, TOR exit nodes, scanner User-Agents); requests to sensitive
  URIs/extensions or from scanning tools (sqlmap, nikto, dirbuster, gobuster); statistically anomalous
  request volume, rate, and URI diversity from a single source; bursts of access to sensitive personnel/business
  sections (/about/team/, /investors/, /careers/); and deep-linked requests carrying null, malformed,
  or non-organizational Referer headers that bypass intended navigation. Detection methods combine deterministic
  symbolic-logic rules (Sigma and OWASP CRS scanner signatures, sensitive-URI and scanner-UA regexes,
  reverse-DNS-validated crawler whitelisting, null/external-referer rules), statistical baselining (anonymizing-service
  volume baselines, forced-browsing error-rate and path-entropy windows, request-rate/volume/URI-diversity
  percentile thresholds, sensitive-page ratio tails, referer-deviation monitoring), and machine learning
  (explainable logistic-regression/gradient-boosted recon classifiers, DBSCAN session clustering, Markov
  navigation models, and seq2seq navigation autoencoders), each surfacing the top contributing features
  so a SOC analyst can triage, attribute, and scope suspected web reconnaissance against the source IP,
  ASN, User-Agent, and requested resources.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
