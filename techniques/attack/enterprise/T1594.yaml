  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Public-facing web servers, Load balancers, Web Application Firewalls (WAFs), Network Intrusion
    Detection Systems (NIDS)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM zeek_http WHERE NOT (user_agent IN benign_crawlers(Googlebot,Bingbot) AND reverse_dns(id.orig_h)
      VERIFIES crawler_domain) | STATS rps = count() / 1s BY id.orig_h | WHERE rps > 10 | ALERT source=id.orig_h
      rps=rps  // OAT-011/OAT-014
- question: '[Reconnaissance] Using the ''Volume, rate and URI-diversity thresholds'' (Statistical Method)
