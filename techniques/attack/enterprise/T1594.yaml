    query: FROM zeek_http | BUCKET window=10m BY id.orig_h | EVAL rps=count()/600, vol=sum(resp_bytes),
      uniq_uri=dc(uri), err4xx=count(status>=400 AND status<500)/count() | WHERE rps > percentile(site_baseline_rps,98)
      AND uniq_uri > percentile(site_baseline_uniq,98) | ALERT source=id.orig_h rps=rps uniq=uniq_uri
- question: '[Reconnaissance] Using the ''Session clustering anomaly detection'' (Machine Learning) approach,
    can you determine whether a single external source IP generates a volume of requests, rate of requests,
