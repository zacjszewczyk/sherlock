questions:
- question: '[Reconnaissance] Using the ''Threat-intel and scanner-UA correlation'' (Symbolic Logic) approach,
    can you determine whether an HTTP/S session to a public-facing web server originates from a source
    IP address or contains a User-Agent string matching an entry on a threat intelligence feed of known
    malicious indicators (e.g., TOR exit nodes, known scanning infrastructure, malicious user agents).'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively gathers
    information from the organization''s public-facing, victim-owned websites to support targeting --
    mapping personnel, business operations, and exposed resources that feed phishing, account compromise,
    and initial-access efforts. This evidence focuses on the condition that an HTTP/S session to a public-facing
    web server originates from a source IP address or contains a User-Agent string matching an entry on
    a threat intelligence feed of known malicious indicators (e.g., TOR exit nodes, known scanning infrastructure,
    malicious user agents). The ''Threat-intel and scanner-UA correlation'' approach (Symbolic Logic)
    works as follows: Ingest threat-intel feeds (malicious IPs, TOR exit nodes) and known scanner/recon
    User-Agent signatures from [Sigma](https://github.com/SigmaHQ/sigma) and the 913xxx scanner rules
    of [OWASP CRS](https://github.com/coreruleset/coreruleset); alert when Zeek conn.log/http.log records
    match. Keep these as deterministic floor rules and treat UA/IP as untrustworthy because adversaries
    spoof them ([Doran & Gokhale](https://link.springer.com/article/10.1007/s10618-010-0180-z)). A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable web reconnaissance
    against victim-owned content; pivot to the source IP and its ASN/geolocation, the User-Agent and referer,
    the specific URIs and sensitive resources requested, the request rate and error profile, and any reverse-DNS
    or threat-intel attribution to scope what the adversary may have learned and to inform perimeter blocking
    or rate-limiting. A negative result helps rule out this particular reconnaissance vector but should
    be corroborated with the other questions in this playbook, since adversaries spoof User-Agents and
    IPs, distribute requests across sources, and throttle low-and-slow crawling to evade any single method.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Public-facing web servers, Network perimeter firewalls/proxies, Web Application Firewalls (WAFs),
    Cloud-hosted web applications, Threat Intelligence Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM zeek_conn JOIN zeek_http ON uid WHERE id.orig_h IN threat_intel_ips(malicious_ips,TOR_exit_nodes)
      OR user_agent MATCHES scanner_recon_ua_signatures // signatures from SigmaHQ + OWASP CRS 913xxx
      scanner rules | ALERT source=id.orig_h ua=user_agent match=ti_ip_or_scanner_ua  // treat UA/IP as
      untrustworthy (spoofable)
- question: '[Reconnaissance] Using the ''Anonymizing service volume baseline'' (Statistical Method) approach,
    can you determine whether an HTTP/S session to a public-facing web server originates from a source
    IP address or contains a User-Agent string matching an entry on a threat intelligence feed of known
    malicious indicators (e.g., TOR exit nodes, known scanning infrastructure, malicious user agents).'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively gathers
    information from the organization''s public-facing, victim-owned websites to support targeting --
    mapping personnel, business operations, and exposed resources that feed phishing, account compromise,
    and initial-access efforts. This evidence focuses on the condition that an HTTP/S session to a public-facing
    web server originates from a source IP address or contains a User-Agent string matching an entry on
    a threat intelligence feed of known malicious indicators (e.g., TOR exit nodes, known scanning infrastructure,
    malicious user agents). The ''Anonymizing service volume baseline'' approach (Statistical Method)
    works as follows: Baseline daily volume of anonymizing-service/ASN-tagged connections by source ASN
    and geolocation, alerting when current volume exceeds the 95th percentile or three standard deviations
    of the trailing 30-day baseline; pair with the request-frequency model of [Kruegel & Vigna](https://dl.acm.org/doi/10.1145/948109.948144)
    so a sudden burst of sessions from one ASN is scored, not just classic style. A positive result --
    a rule match, statistical outlier, or model alert -- indicates probable web reconnaissance against
    victim-owned content; pivot to the source IP and its ASN/geolocation, the User-Agent and referer,
    the specific URIs and sensitive resources requested, the request rate and error profile, and any reverse-DNS
    or threat-intel attribution to scope what the adversary may have learned and to inform perimeter blocking
    or rate-limiting. A negative result helps rule out this particular reconnaissance vector but should
    be corroborated with the other questions in this playbook, since adversaries spoof User-Agents and
    IPs, distribute requests across sources, and throttle low-and-slow crawling to evade any single method.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Public-facing web servers, Network perimeter firewalls/proxies, Web Application Firewalls (WAFs),
    Cloud-hosted web applications, Threat Intelligence Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: FROM zeek_conn WHERE id.orig_h IN anonymizing_asn_tagged | STATS daily_vol = count() BY src_asn,
      geo, day | EVAL p95 = percentile(daily_vol,95,trailing_30d), mean=avg(daily_vol,30d), sd=stdev(daily_vol,30d)
      | WHERE daily_vol > p95 OR daily_vol > mean + 3*sd | ALERT asn=src_asn vol=daily_vol
- question: '[Reconnaissance] Using the ''Explainable recon scoring'' (Machine Learning) approach, can
    you determine whether an HTTP/S session to a public-facing web server originates from a source IP
    address or contains a User-Agent string matching an entry on a threat intelligence feed of known malicious
    indicators (e.g., TOR exit nodes, known scanning infrastructure, malicious user agents).'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively gathers
