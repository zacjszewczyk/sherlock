- question: '[Reconnaissance] Using the ''High-rate non-whitelisted bot detection'' (Symbolic Logic) approach,
    can you determine whether a single external source IP generates a volume of requests, rate of requests,
    or diversity of unique URIs accessed that is statistically anomalous compared to a baseline of typical
    user behavior.'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary actively gathers
    information from the organization''s public-facing, victim-owned websites to support targeting --
    mapping personnel, business operations, and exposed resources that feed phishing, account compromise,
    and initial-access efforts. This evidence focuses on the condition that a single external source IP
    generates a volume of requests, rate of requests, or diversity of unique URIs accessed that is statistically
    anomalous compared to a baseline of typical user behavior. The ''High-rate non-whitelisted bot detection''
    approach (Symbolic Logic) works as follows: Whitelist verified benign crawler User-Agents (Googlebot,
    Bingbot) — validating by reverse-DNS, not UA string alone ([Doran & Gokhale](https://link.springer.com/article/10.1007/s10618-010-0180-z))
    — and alert when a non-whitelisted source IP generates more than 10 requests per second, consistent
    with OAT-011 Scraping / OAT-014 scanning behavior in the [OWASP Automated Threat Handbook](https://owasp.org/www-project-automated-threats-to-web-applications/).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable web reconnaissance
    against victim-owned content; pivot to the source IP and its ASN/geolocation, the User-Agent and referer,
    the specific URIs and sensitive resources requested, the request rate and error profile, and any reverse-DNS
    or threat-intel attribution to scope what the adversary may have learned and to inform perimeter blocking
    or rate-limiting. A negative result helps rule out this particular reconnaissance vector but should
    be corroborated with the other questions in this playbook, since adversaries spoof User-Agents and
    IPs, distribute requests across sources, and throttle low-and-slow crawling to evade any single method.'
