  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Member Servers, Privileged User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Maintain high-fidelity string signatures for known domain-group\
      \ enumeration tooling and built-in commands\nMATCH events FROM (proc_creation:4688, sysmon:1, powershell:4104,\
      \ auditd:execve,\n                   macos:unifiedlog, zeek:ldap.log, dirsvc:4662, logon:4624)\n\
      WHERE cmdline OR script_block OR ldap_filter OR object_property MATCHES\n      enumeration_signatures\
      \   // net group /domain, Get-ADGroup, AdFind, PowerView,\n                               // SharpHound,\
      \ dsquery group, ldapsearch, dscacheutil,\n                               // (objectCategory=group),\
      \ samaccounttype recon filters\n  AND NOT cmdline MATCHES /(\\s\\/add|\\s\\/delete)/   // recon-only,\
      \ exclude modification\n  AND actor/host NOT IN authorized_allowlist\nRAISE alert WITH evidence,\
      \ severity boosted for service/SYSTEM accounts,\n      anomalous parent process, or sensitive-group\
      \ target"
- question: 'Using statistical baselining, can you confirm anomalous domain-group discovery by applying
    the approach ''Profile prevalence and failure state of enumeration binaries rather than mere presence''?
    Specifically: Following [LOLBins Abuse: How to Detect LOLBins Abuse in the Wild](https://redcanary.com/blog/blog/lolbins-abuse/),
    do not alert on presence alone; compute the organization-wide and per-host prevalence of `net.exe
    group/localgroup`, `Get-ADGroup`, and AdFind over a 30-day window. Flag executions from hosts in the
    bottom 1st percentile of historical prevalence (a host/user that has never run them). State/Failure
    signal: track command exit codes and PowerShell error records — a burst of `net group` invocations
    producing ''System error 5''/access-denied or ''group could not be found'' errors indicates blind
    probing rather than legitimate administration and should be scored higher. For Event ID 4104, also
    compute Shannon entropy of the script block; alert when entropy exceeds the 95th percentile of known-good
    admin scripts, indicating likely obfuscation.'
