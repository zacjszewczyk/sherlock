    search requests targeting Active Directory group objects that is statistically anomalous compared
    to its own historical baseline and the baseline of its peer group. Approach (Baseline LDAP query volume
    per source against self and peer group): From Zeek `ldap.log`/`conn.log` compute hourly LDAP search
