    Reconnaissance Activity Using Net.EXE](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_net_groups_and_accounts_recon.yml)
    with the context-over-presence principle of [LOLBins Abuse](https://redcanary.com/blog/blog/lolbins-abuse/).
    A web/database server emitting domain enumeration is near-zero false positive.'
