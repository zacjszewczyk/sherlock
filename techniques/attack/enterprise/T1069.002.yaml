- question: 'Using statistical baselining, can you confirm anomalous domain-group discovery by applying
    the approach ''Baseline LDAP query volume per source against self and peer group''? Specifically:
    From Zeek `ldap.log`/`conn.log` compute hourly LDAP search count and distinct-objects-returned per
