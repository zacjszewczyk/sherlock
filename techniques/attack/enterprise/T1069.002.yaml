    mean + 3σ (or robust MAD equivalent), consistent with edge-rarity/fan-out baselining in [Authentication
    graphs: Analyzing user behavior within an enterprise network](https://doi.org/10.1016/j.cose.2014.09.001)
    and the structural-relationship modeling of [Detecting Structurally Anomalous Logins Within Enterprise
    Networks](https://doi.org/10.1145/3133956.3134003). Failure-state signal: track LDAP result codes
    — a high ratio of size-limit-exceeded or insufficient-access (code 50) results indicates aggressive
    scraping and should raise severity.'
