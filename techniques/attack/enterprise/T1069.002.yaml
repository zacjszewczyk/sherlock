- question: 'Using statistical baselining, can you confirm anomalous domain-group discovery by applying
    the approach ''Baseline per-user discovery-command frequency and flag volume/failure bursts''? Specifically:
    For each account build a 30-day baseline of discovery-command count per hour (Volume/Frequency); compute
    the moving average and standard deviation and alert when an hour exceeds mean + 3σ of that user''s
    personal baseline, an approach consistent with the robust per-entity feature baselining in [An Unsupervised
    Multi-Detector Approach for Identifying Malicious Lateral Movement](https://mnoureddine.com/files/17BOH01.pdf)
    (MAD-based deviation is preferred over standard deviation when the baseline is noisy). Add explicit
    failure-state profiling: a spike in access-denied/`group not found` results per minute is a distinct,
    higher-weight signal of automated enumeration. Surface the contributing hour, command count, and failure
    ratio in the alert.'
