  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: Profile prevalence and failure state of enumeration binaries\
      \ rather than mere presence\nFOR each entity IN (user, host, logon_id, source_ip):\n  baseline =\
      \ rolling_window(30d) of discovery_command_count | ldap_query_count per hour\n  mean_b, sd_b, mad_b\
      \ = robust_stats(baseline)\n  prevalence = org_and_host_rank(enumeration_binaries, 30d)\n  failure_ratio\
      \ = denied_or_notfound_results / total_results   // access-denied, code 50\n  entropy = shannon(script_block)\n\
      RAISE alert WHEN current_hour > mean_b + 3*sd_b   // or MAD-based equivalent\n          OR prevalence\
      \ IN bottom_1st_percentile\n          OR failure_ratio spikes  OR entropy > p95\n          OR rate\
      \ > peer_group_mean + 3*sigma\nEMIT contributing hour, command_count, failure_ratio, deviating_feature"
- question: 'Using a machine-learning model, can you surface anomalous domain-group discovery by applying
    the approach ''Train an explainable command-line anomaly model using embeddings plus a rarity detector''?
    Specifically: Per [BERT Embeddings: A Modern Machine-learning Approach for Detecting Malware from
    Command Lines](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/),
    embed process command lines / script blocks with a transformer (or n-gram/TF-IDF features: command
    length, special-char frequency, token n-grams, enumeration-keyword presence) and score rarity with
    Isolation Forest, COPOD, or PCA reconstruction error. Train on benign baselines (e.g., `net start`,
    scheduled inventory jobs) and validate against labeled malicious examples (`net group /domain`, SharpHound).
    Explainability requirement: every alert must list the top-3 contributing tokens/features and the nearest
    known-bad neighbor command so analysts can triage; deploy in parallel with the deterministic signatures
    above, never replacing them.'
