name: 'T1069.002: Domain Groups'
id: 7c261b9f-537a-4641-a27c-c3b917b79efa
description: 'This playbook helps an analyst determine whether an adversary is performing Domain Groups
  discovery (T1069.002): enumerating domain-level groups and permission settings to learn which groups
  exist, who belongs to them, and which accounts hold elevated rights such as Domain Admins, Enterprise
  Admins, or Schema Admins. It correlates host-based process and PowerShell telemetry (Windows Event ID
  4688/4104, auditd execve, macOS unified log) for tooling and built-ins such as AdFind, PowerView, SharpHound/BloodHound,
  net group /domain, Get-ADGroup/Get-ADGroupMember, dsquery group, dscacheutil, dscl, and ldapsearch with
  network-side LDAP/DCE-RPC telemetry (Zeek ldap.log/conn.log, BZAR SAMR/LSARPC analytics) and directory-service
  auditing on Domain Controllers (Event ID 4662 reads of sensitive group membership, correlated with logon
  Event ID 4624). Investigative angles include: high-fidelity tool/command signatures, recon-only argument
  filtering, bursts of distinct discovery commands from one actor in a short window, prevalence and failure-state
  (access-denied / group-not-found) profiling, per-user and peer-group volume baselining, anomalous LDAP
  query volume and reconnaissance filters on the wire, allowlisted reads of sensitive groups, and enumeration
  originating from roles with no operational need. Detection blends symbolic-logic rules, statistical
  baselining (percentiles, z-score/MAD deviation, entropy, time-series forecasting), and machine learning
  (Isolation Forest, One-Class SVM, COPOD/PCA, transformer/TF-IDF command embeddings, Hidden Markov sequence
  models, DBSCAN clustering, and graph/temporal link-prediction GNNs) to produce evasion-resistant, explainable
  alerts for the Discovery tactic.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
