- question: 'Using a machine-learning model, can you surface anomalous domain-group discovery by applying
    the approach ''Score command sequences with a probabilistic sequence model''? Specifically: Train
    a Hidden Markov Model (or other sequence model) on per-actor command-execution sequences as in [Detecting
    Intrusions Using System Calls: Alternative Data Models](https://www.cs.unm.edu/~forrest/publications/oakland-with-cite.pdf),
    where the HMM sequence model best distinguished normal from anomalous process behavior. Learn transition
    probabilities between benign administrative steps and flag low-probability sequences (a dense reconnaissance
    run with no preceding legitimate task) below a calibrated likelihood threshold. The alert must report
    the specific low-probability transitions (top-3) so analysts see why the sequence scored anomalous;
    run alongside, not instead of, the deterministic correlation rule.'
