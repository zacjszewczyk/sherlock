questions:
- question: 'Using deterministic rule logic, can you confirm domain-group discovery by applying the approach
    ''Maintain high-fidelity string signatures for known domain-group enumeration tooling and built-in
    commands''? Specifically: Maintain a list of high-fidelity string signatures for tools and built-ins
    on process command lines (Event ID 4688 / Sysmon 1) and PowerShell script blocks (Event ID 4104).
    Cover AdFind (`-sc admincountdmp`, `-sc exchaddresses`, password-policy attributes like maxpwdage/pwdhistorylength)
    per the Sigma AdFind rule [PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_pua_adfind_enumeration.yml);
    PowerView (`Get-NetGroup`, `Get-DomainGroup`, `Get-NetGroupMember`); BloodHound ingestors (`SharpHound.exe`,
    `Invoke-BloodHound`); and native `net group /domain`, `net group "domain admins" /domain`, `Get-ADGroup`,
    `Get-ADGroupMember`, `dsquery group` from MITRE [CAR-2013-07-001: Suspicious Arguments](https://car.mitre.org/analytics/CAR-2013-07-001/).
    Critically, exclude modification (` /add`, ` /delete`) to keep recon-only fidelity as in [Suspicious
    Group And Account Reconnaissance Activity Using Net.EXE](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_net_groups_and_accounts_recon.yml).
    Alert on exact match; raise severity when the executing account is a service/LOCAL_SYSTEM account
    or the parent process is anomalous.'
  context: 'Tactic context (Discovery): the adversary is trying to figure out your environment, and domain-group
    enumeration reveals which groups exist, who is in them, and which accounts hold elevated rights (e.g.,
    Domain Admins) so the actor can plan privilege escalation, lateral movement, and access to sensitive
    data. Evidence under investigation: The command line of a created process (Windows Event ID 4688)
    or PowerShell script block (Windows Event ID 4104) contains a unique string, function name, or parameter
    combination directly matching a signature from a known malicious domain enumeration tool (e.g., AdFind,
    PowerView, BloodHound ingestor). Approach (Maintain high-fidelity string signatures for known domain-group
    enumeration tooling and built-in commands): Maintain a list of high-fidelity string signatures for
    tools and built-ins on process command lines (Event ID 4688 / Sysmon 1) and PowerShell script blocks
    (Event ID 4104). Cover AdFind (`-sc admincountdmp`, `-sc exchaddresses`, password-policy attributes
    like maxpwdage/pwdhistorylength) per the Sigma AdFind rule [PUA - Suspicious ActiveDirectory Enumeration
    Via AdFind.EXE](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_pua_adfind_enumeration.yml);
    PowerView (`Get-NetGroup`, `Get-DomainGroup`, `Get-NetGroupMember`); BloodHound ingestors (`SharpHound.exe`,
    `Invoke-BloodHound`); and native `net group /domain`, `net group "domain admins" /domain`, `Get-ADGroup`,
    `Get-ADGroupMember`, `dsquery group` from MITRE [CAR-2013-07-001: Suspicious Arguments](https://car.mitre.org/analytics/CAR-2013-07-001/).
    Critically, exclude modification (` /add`, ` /delete`) to keep recon-only fidelity as in [Suspicious
    Group And Account Reconnaissance Activity Using Net.EXE](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_net_groups_and_accounts_recon.yml).
    Alert on exact match; raise severity when the executing account is a service/LOCAL_SYSTEM account
    or the parent process is anomalous. A positive result indicates domain-group discovery activity inconsistent
    with normal/authorized administration; a negative result means the observed behavior matches expected
    baselines and authorized roles. Investigate the named area of interest (Domain Controllers, Member
    Servers, Privileged User Workstations) and pivot from any hit to the originating account, host, parent
    process, and any follow-on credential access, privilege escalation, or lateral movement.'
