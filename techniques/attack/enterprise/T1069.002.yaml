- question: 'Using deterministic rule logic, can you confirm domain-group discovery by applying the approach
    ''Block enumeration from roles with no operational need via an authority allowlist''? Specifically:
    Maintain an inventory mapping accounts and hosts to functional roles (e.g., ''IT-Admin'', ''Finance-User'',
    ''WebServer-Prod''). Raise a high-severity alert when a domain-group enumeration pattern (`net group
