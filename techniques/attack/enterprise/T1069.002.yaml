- question: 'Using a machine-learning model, can you surface anomalous domain-group discovery by applying
    the approach ''Score access events with an explainable one-class anomaly model''? Specifically: Train
    a One-Class SVM or Isolation Forest on features from legitimate access events (User, Source Host,
    Logon Type, Time-of-Day, Day-of-Week, access count) to learn the boundary of normal sensitive-group
    access; flag out-of-boundary events. Per [Robust IoT security using isolation forest and one class
    SVM algorithms](https://www.nature.com/articles/s41598-025-20445-4), OCSVM is more robust under data
    poisoning and LIME provides per-feature explanations; the broader detection of malicious access by
    otherwise-authorized accounts is framed in [Deep Learning for Insider Threat Detection: Review, Challenges
    and Opportunities](https://arxiv.org/pdf/2005.12433). Explainability requirement: emit the top-3 contributing
    features (e.g., off-hours, new source host, abnormal count) with each anomaly, and run in parallel
    with the deterministic SACL allowlist rule.'
