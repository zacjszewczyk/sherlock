questions:
- question: '[Command And Control] Match remote hardware C2 to TI: Can you determine whether a host initiates
    an external network connection or resolves a domain matching a known Indicator of Compromise (IOC)
    such as an IP address, domain name, JA4/JA4H/JA4X client fingerprint, or TLS server certificate associated
    with remote access hardware (e.g., PiKVM/TinyPilot web stacks) or DPRK IT-worker IP-KVM C2 infrastructure.
    -- specifically, using the ''Match remote hardware C2 to TI'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Command And Control tactic (TA0011), an adversary installs legitimate
    remote access hardware (e.g., PiKVM, TinyPilot, USB HID gadgets) to create a stealthy, out-of-band
    interactive C2 channel that evades software defenses, leaving traces in network egress, physical-device,
    logon-session, process-execution, and keystroke telemetry. This evidence focuses on the condition
    that a host initiates an external network connection or resolves a domain matching a known Indicator
    of Compromise (IOC) such as an IP address, domain name, JA4/JA4H/JA4X client fingerprint, or TLS server
    certificate associated with remote access hardware (e.g., PiKVM/TinyPilot web stacks) or DPRK IT-worker
    IP-KVM C2 infrastructure. This Symbolic Logic approach looks for the following signal: Join network
    connection logs (Zeek conn.log), DNS query logs (Zeek dns.log), and TLS logs (Zeek ssl.log) against
    a threat-intelligence feed of IPs, domains, and certificates associated with remote access hardware
    (e.g., default C2/management endpoints for PiKVM, TinyPilot) and reported DPRK IT-worker IP-KVM infrastructure
    ([North Korean IT Workers, Unit 42](https://unit42.paloaltonetworks.com/north-korean-it-workers/);
    [Mitigating the DPRK IT Worker Threat, Google/Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/mitigating-dprk-it-worker-threat)).
    Alert on any match. A positive result -- a rule match, statistical outlier, or model alert -- suggests
    remote access hardware is present and being used to drive the host out of band; pivot to the implicated
    host, the connected/enumerated device (MAC OUI, USB VID/PID, EDID, DHCP hostname), the external destination
    and its fingerprint, the initiating process and user, and whether any interactive logon session exists.
    A negative result helps rule out this hardware-C2 vector but should be corroborated with the other
    questions in this playbook, since a single method can miss carefully timed, randomized, or low-and-slow
    hardware channels.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network egress points, internal DNS resolvers, and internet gateways.'
