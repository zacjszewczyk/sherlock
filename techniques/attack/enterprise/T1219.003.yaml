name: 'T1219.003: Remote Access Hardware'
id: 368a06f8-ebe0-4674-8354-6a64e6805734
description: 'This playbook helps an analyst investigate whether an adversary is establishing an interactive
  command-and-control channel using legitimate remote access hardware -- IP-based keyboard/video/mouse
  (KVM) devices such as TinyPilot and PiKVM, USB HID-emulation gadgets (e.g., USB Rubber Ducky, LAN Turtle),
  and similar embedded appliances -- under the Command and Control tactic. Such hardware is physically
  installed post-compromise to provide redundant, out-of-band access that bypasses software security controls,
  a primary tradecraft pattern observed in DPRK IT-worker operations. The playbook guides the hunt across
  complementary angles spanning Windows, Linux, and macOS endpoints plus network telemetry: matching egress
  connections, DNS, and TLS fingerprints (JA4/JA4H/JA4X) against threat intelligence and rarity baselines
  for known IP-KVM/embedded C2 stacks; detecting new physical-device arrivals via Windows Event ID 6416,
  Drive Creation (EventCode 2003), auditd udev, and macOS IOKit logs whose DHCP hostname, MAC OUI, USB
  VID/PID, or display EDID match remote-access-hardware watchlists or rare onboarding fingerprints; correlating
  device-arrival to scripted external connections and interactive-shell process creation that occur without
  any corresponding interactive logon (the BadUSB/IP-KVM ghost-session signal); profiling long, low-volume
  periodic beaconing flows; and discriminating human from machine-injected keystrokes via inter-key timing.
  Detection methods combine symbolic-logic rules, statistical baselining, and machine-learning models
  applied to Zeek conn/dns/ssl/dhcp logs, Windows Security and Sysmon events, auditd, macOS unified logs,
  and ETW USB telemetry, so the analyst can corroborate suspected hardware C2 against device provenance,
  session context, network behavior, and keystroke cadence.'
type: technique
