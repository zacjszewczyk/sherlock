name: 'T1593.002: Search Engines'
id: 98b3afe4-3076-48f9-ad72-c5180d8cd6f1
description: 'This playbook helps an analyst investigate whether an adversary is using public search engines
  and search-engine dorking to find exploitable information about the organization (TA0043 Reconnaissance,
  T1593.002 Search Engines). Because much of this activity occurs outside the organization''s visibility
  and has a high baseline of benign crawling, the playbook combines proactive self-reconnaissance with
  passive detection. It covers: (1) public search-engine results that index sensitive organizational documents,
  leaked credentials, secrets, or misconfigured cloud/code-repository content matched by Google Hacking
  Database operators, high-precision secret regexes, entropy scoring, honeytokens, and ML classifiers;
  (2) endpoint process-creation events where command-line download utilities (curl, wget, bitsadmin, certutil)
  fetch adversary tooling or scripts discovered through reconnaissance; (3) inbound HTTP requests to public-facing
  web servers whose Referer headers contain dork query strings and whose request/error rates indicate
  automated enumeration or scraping; and (4) outbound requests from internal hosts to URLs on a watchlist
  of previously discovered sensitive-data exposures. Together these questions let a SOC analyst find,
  score, and respond to the discovery and exploitation of leaked organizational information.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are public search engines indexing any of our organization's documents, repositories, cloud
    storage, or paste-site content that contain sensitive keywords, secret-bearing file types, or internal
    hostnames that an adversary could discover through dorking?
  context: 'During Reconnaissance an adversary crafts Google Hacking Database (GHDB) operator queries
    (filetype:, inurl:admin, intitle:"index of", site:, ext:) and high-precision secret regexes to find
    spilled credentials, configuration files, and internal details about the target. By proactively running
    the same dork operator corpus and secret regexes (password, api_key, secret, AWS AKIA, BEGIN PRIVATE
    KEY) plus Shannon-entropy checks against your own domains, public repos, paste sites, and cloud-storage
    namespaces, the defender sees exactly what the adversary would see. Prioritize exposed .env/.git/config/backup
    files. Any deterministic hit is the floor for action: a positive result means sensitive content is
    already exposed and must be remediated; a clean result reduces (but does not eliminate) exposure risk.
    Key references: [Google Hacking Database](https://www.exploit-db.com/google-hacking-database), [Meli
    et al.](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_04B-3_Meli_paper.pdf),
    [Basak et al.](https://arxiv.org/abs/2307.00714), and [Unit 42](https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/).'
  answer_sources:
  - External Search Engine API Query Results
  - 'NAI: Public-facing websites and web applications, public code repositories (e.g., GitHub, GitLab),
    public cloud storage (e.g., S3 buckets, Azure blobs), and public paste sites (e.g., Pastebin) indexed
    by search engines.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for doc in search_index(domains=OUR_DOMAINS, sources=[web,repos,paste,cloud_storage]):\n \
      \ if matches_GHDB_operator(doc.url) OR regex_secret(doc.body, [password,api_key,secret,'AKIA[0-9A-Z]{16}','BEGIN\
      \ PRIVATE KEY']) OR shannon_entropy(token) > E_THRESHOLD:\n    if file_ext(doc) in ['.env','.git','config','.sql','.pem','backup']:\
      \ severity='high'\n    ALERT(doc.url, matched_terms)"
- question: Has any inbound search query or external retrieval matched a planted honeytoken canary document,
    decoy credential, or canary URL seeded in indexable locations?
  context: Honeytokens are unique decoy documents, fake credentials, and canary URLs placed in public
    web roots, sacrificial repos, and paste sites that no legitimate user ever has a reason to access.
    Because they are never referenced by real workflows, ANY retrieval or any inbound query whose terms
    match a planted canary string is an extremely high-fidelity, near-zero-false-positive signal that
    an adversary is dorking for and harvesting organizational data during Reconnaissance. A hit immediately
    attributes interest to a specific decoy and often reveals the attacker's source IP, user agent, and
    the exact search terms used. Methodology per [Kahlhofer & Rass](https://arxiv.org/abs/2405.12852).
  answer_sources:
  - External Search Engine API Query Results
  - 'NAI: Public-facing websites and web applications, public code repositories (e.g., GitHub, GitLab),
    public cloud storage (e.g., S3 buckets, Azure blobs), and public paste sites (e.g., Pastebin) indexed
    by search engines.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for event in (decoy_retrievals UNION inbound_queries):\n  if event.target_url in HONEYTOKEN_URLS\
      \ OR contains_any(event.query_terms, CANARY_STRINGS):\n    ALERT(source_ip=event.src, decoy=event.target_url,\
      \ terms=event.query_terms, confidence='very_high')"
- question: Which newly indexed public documents score above our normal exposure baseline when weighted
    by high-risk keyword/regex matches, secret entropy, file type, and presence of internal hostnames?
  context: Not every indexed page is sensitive, so a statistical risk score separates routine public content
    from genuine leaks. For each newly indexed document compute a weighted score (count of high-risk keyword/regex
    hits, secret entropy, file-type weight, internal-hostname presence) and maintain a 30-day baseline
    of normal public-content scores. Flag documents above the 95th percentile and track the failure/exposure
    state explicitly as new-exposures-per-day versus baseline. Tune the entropy cutoff using measured
    precision/recall trade-offs to fit your data. The alert should emit the top-3 contributing factors
    (matched secret type, entropy, file extension) so the analyst can triage quickly. A spike above baseline
    indicates the adversary's reconnaissance surface is growing. Tune the entropy cutoff using the precision/recall
    trade-offs measured by [Basak et al.](https://arxiv.org/abs/2307.00714).
  answer_sources:
  - External Search Engine API Query Results
  - 'NAI: Public-facing websites and web applications, public code repositories (e.g., GitHub, GitLab),
    public cloud storage (e.g., S3 buckets, Azure blobs), and public paste sites (e.g., Pastebin) indexed
    by search engines.'
  range: Last 90 days (with a 30-day rolling baseline for percentile scoring)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = rolling_30d_distribution(public_doc_scores)\nfor doc in newly_indexed:\n  score\
      \ = w1*count_keyword_hits + w2*secret_entropy + w3*filetype_weight + w4*internal_hostname_present\n\
      \  if score > percentile(baseline, 95):\n    ALERT(doc, top3_factors(doc), new_exposures_today vs\
      \ baseline_mean)"
- question: Does a trained text classifier label any newly indexed public document as 'sensitive' with
    high confidence, indicating a data leak discoverable by search-engine reconnaissance?
  context: A supervised classifier (Naive Bayes or BERT) trained on known leaks versus approved public
    materials, grounded in established secret patterns, can catch sensitive content that simple keyword
    rules miss. Alert when a document is labeled 'sensitive' with confidence greater than 0.90 and list
    the top-3 token/feature contributions (credential regex hit, internal hostname, high-entropy string)
    in the alert text so the analyst understands why. Validate thresholds against a public web-attack
    dataset. This complements the deterministic dork/regex floor by generalizing to novel leak formats;
    a high-confidence hit warrants immediate takedown/rotation. Grounded in the secret patterns of [Meli
    et al.](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_04B-3_Meli_paper.pdf) and
    calibrated per [Basak et al.](https://arxiv.org/abs/2307.00714); validate thresholds against the [Web
    Attack Detection Dataset](https://data.mendeley.com/datasets/wt8m6bcwbr/1).
  answer_sources:
  - External Search Engine API Query Results
  - 'NAI: Public-facing websites and web applications, public code repositories (e.g., GitHub, GitLab),
    public cloud storage (e.g., S3 buckets, Azure blobs), and public paste sites (e.g., Pastebin) indexed
    by search engines.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = load_classifier('naive_bayes|bert')  # trained leaks vs approved-public\nfor doc in\
      \ newly_indexed:\n  p, feats = model.predict_proba(doc)\n  if label(p)=='sensitive' and p > 0.90:\n\
      \    ALERT(doc, top3_token_contributions(feats))"
- question: On servers or non-developer workstations, did a command-line download utility (curl, wget,
    bitsadmin, certutil) execute with a URL argument pointing to a domain that appears on a malicious-domain
    threat-intelligence feed?
  context: After using search engines to discover tools, exploits, or scripts, an adversary often pulls
    them onto a foothold using living-off-the-land binaries. Correlate Windows Event ID 4688 process creation
    showing curl/wget/bitsadmin/certutil with a URL argument against the destination domain from Zeek
    conn.log, alerting when the destination matches a malicious-domain feed. Use SigmaHQ process_creation
    download-utility/LOLBin rules (image name + command-line URL token + anomalous parent) as the deterministic
    floor. These utilities are rarely legitimate on domain controllers, database/application servers,
    or ordinary user workstations, so a feed match here is a strong indicator of post-reconnaissance tool
    retrieval. Use the [SigmaHQ](https://github.com/SigmaHQ/sigma) process_creation download-utility and
    LOLBin rules as the deterministic floor.
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Domain Controllers, database servers, application servers, non-developer user workstations,
    and DMZ-hosted servers.'
  range: Last 90 days (pivot to a tight window around each 4688 event for network correlation)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for e in win_event_4688 where image in ['curl.exe','wget.exe','bitsadmin.exe','certutil.exe']\
      \ and cmdline ~ URL_REGEX:\n  dest = join_zeek_conn(e.host, e.time).resp_h\n  if dest in MALICIOUS_DOMAIN_FEED\
      \ or sigma_lolbin_match(e):\n    if host_role in [DC,db,app,workstation_nondev]: ALERT(e, dest)"
- question: Which hosts or users show rare or anomalously high-volume command-line download-utility activity
    compared with their 30-day role baseline, including blocked or failed fetch outcomes?
  context: 'Baseline command-line download-utility usage per host/user/role over 30 days, capturing frequency
    (executions/day), distinct destination domains, and bytes downloaded. Flag executions on servers or
    non-privileged workstations in the bottom 5th percentile of frequency (i.e., utilities that almost
    never run there), and separately flag volume outliers where downloaded bytes exceed the host''s 99th
    percentile. Explicitly track the state/failure dimension: failed or blocked connections and non-200
    fetch outcomes are a distinct signal of an adversary probing for reconnaissance-discovered resources.
    Rare-but-present utility usage on a sensitive server is exactly what this method surfaces.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Domain Controllers, database servers, application servers, non-developer user workstations,
    and DMZ-hosted servers.'
  range: Last 90 days (with a 30-day rolling baseline per host/user/role)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = baseline_30d(per host,user,role: count_per_day, distinct_domains, bytes)\nfor e in\
      \ download_utility_exec:\n  if e.host_role in [server, nonpriv_ws] and freq_percentile(e) < 5: ALERT('rare_usage',\
      \ e)\n  if e.bytes > host_percentile(99): ALERT('volume_outlier', e)\n  if e.conn_state in [blocked,failed]\
      \ or e.http_status != 200: ALERT('failed_fetch', e)"
- question: Does a probability model flag any download-utility execution as likely malicious based on
    host role, privileges, process name, source-URL age/reputation, byte count, and time-of-day?
  context: Train logistic regression or gradient boosting on features such as host role, privilege level,
    process name, source-URL age and reputation, downloaded byte count, and time-of-day. Alert when the
    predicted probability of maliciousness exceeds 0.85 and surface the top-3 contributing features (e.g.,
    server role, low-reputation domain, off-hours execution) in the alert text. This model fuses weak
    signals that individually would not trip a rule, catching a download from a newly registered low-reputation
    site on a domain controller at 3 a.m. even when no single indicator is conclusive, supporting detection
    of post-reconnaissance tool staging.
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Domain Controllers, database servers, application servers, non-developer user workstations,
    and DMZ-hosted servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = gbm_or_logreg(features=[host_role,privileges,process,url_age,url_reputation,bytes,hour])\n\
      for e in download_utility_exec:\n  p, feats = model.predict_proba(e)\n  if p > 0.85: ALERT(e, top3_features(feats))"
- question: Are external clients arriving at our public-facing web servers via a search-engine Referer
    URL whose query string contains advanced search operators (dorks) such as filetype:, inurl:admin,
    intitle:index of, site:, or ext:?
  context: When an adversary clicks through a dork search result, the inbound HTTP request to the landing
    page carries a Referer header containing the search-engine URL and the dork query string. Parse Zeek
    http.log Referer headers and match the embedded query strings against GHDB operator signatures; alert
    when an external IP lands via a dork query, since this directly reveals that the visitor found the
    resource through targeted reconnaissance rather than normal browsing. Encode declared-bot/User-Agent
    and robots.txt-hit checks as supporting deterministic rules to raise confidence. A hit pinpoints both
    the exposed resource and the search terms used to find it. Match embedded query strings against [Google
    Hacking Database](https://www.exploit-db.com/google-hacking-database) operator signatures, and encode
    the declared-bot/User-Agent and robots.txt-hit checks from [Doran & Gokhale](https://link.springer.com/article/10.1007/s10618-010-0180-z).
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Network ingress points (firewalls, load balancers), public-facing web server farms, and reverse
    proxy servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for r in zeek_http where is_external(r.id.orig_h):\n  ref_q = parse_query(r.referrer)\n  if\
      \ matches_GHDB_operator(ref_q, ['filetype:','inurl:admin','intitle:index of','site:','ext:']):\n\
      \    support = declared_bot(r.user_agent) or hit_robots_txt(r.id.orig_h)\n    ALERT(r.id.orig_h,\
      \ r.uri, ref_q, support)"
- question: Which external source IPs exhibit anomalous request volume, URI entropy, request frequency,
    and HTTP error ratios against our public-facing web servers within short time windows?
  context: Automated dorking and scraping clients behave differently from normal users. Per external source
    IP within 5-minute windows, compute volume (request count, distinct URIs), URI entropy, frequency
    (requests/min and inter-arrival timing), and state (HTTP 4xx/2xx ratio, %404, %HEAD) using robot-detection
    and per-parameter access-frequency feature models. Alert when both the request rate and the 4xx ratio
    exceed the 98th percentile, deriving percentiles from your own logs or a public web-attack dataset,
    and report the top-3 deviating features. High entropy plus elevated 404s indicates an automated client
    probing for reconnaissance-discovered paths rather than a human browsing legitimately. Use the robot-detection
    feature catalog of [Doran & Gokhale](https://link.springer.com/article/10.1007/s10618-010-0180-z)
    and the per-parameter access-frequency models of [Kruegel & Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf);
    derive percentiles from your own logs or the [Web Attack Detection Dataset](https://data.mendeley.com/datasets/wt8m6bcwbr/1).
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Network ingress points (firewalls, load balancers), public-facing web server farms, and reverse
    proxy servers.'
  range: Last 90 days (computed over rolling 5-minute per-IP windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for ip, win in group_by(zeek_http, key=orig_h, window='5min'):\n  vol=count(win); uris=distinct(win.uri);\
      \ ent=uri_entropy(win)\n  freq=req_per_min(win); err=ratio_4xx(win)\n  if freq > p98(freq_base)\
      \ and err > p98(err_base):\n    ALERT(ip, top3_deviating_features(vol,uris,ent,freq,err))"
- question: Do any external IPs show a statistically elevated ratio of failed (4xx/401/403/404) to successful
    (2xx/3xx) first-contact requests consistent with sequential enumeration or scraping?
  context: Treat each first-contact request from an external IP as a Bernoulli trial where success is
    a 2xx/3xx response and failure is a 4xx/404/401/403, then apply a Threshold Random Walk Sequential
    Probability Ratio Test (SPRT). Dorking and scraping clients generate a high failed-to-successful ratio
    because they probe many guessed or indexed paths that no longer exist or are protected, so the SPRT
    raises an early, tunable-error-bound alarm well before a fixed-count threshold would. The failure-mode
    state is the primary signal here, making this method effective even against slow, low-volume enumeration
    during Reconnaissance. Applies the Threshold Random Walk SPRT of [Jung et al.](https://www.icir.org/vern/papers/portscan-oak04.pdf).
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Network ingress points (firewalls, load balancers), public-facing web server farms, and reverse
    proxy servers.'
  range: Last 90 days (evaluated per external IP as requests arrive)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for ip in external_ips:\n  init TRW_SPRT(p0=success_benign, p1=success_scanner, alpha, beta)\n\
      \  for req in first_contact_requests(ip):\n    outcome = success if status in [2xx,3xx] else failure\n\
      \    update_walk(outcome)\n    if walk crosses upper_threshold: ALERT(ip, 'enumeration', failed_ratio)"
- question: Does an unsupervised anomaly model flag any external client's per-IP flow/request statistics
    as automated enumeration or scraping of our public-facing web servers?
  context: Run an unsupervised model over per-IP flow and request statistics, such as a Kitsune autoencoder
    ensemble for online scoring or analytical-learning robot classifiers (decision tree/Bayesian), to
    flag automated enumeration that signature rules miss. Surface the top-3 contributing features (per-feature
    reconstruction error or split features) in the alert so the analyst can validate the finding. This
    online approach adapts to traffic and catches novel scraping patterns; a flagged client warrants correlation
    with the dork-Referer and SPRT signals to confirm reconnaissance-driven access. Use a [Kitsune](https://www.ndss-symposium.org/wp-content/uploads/2018/02/ndss2018_03A-3_Mirsky_paper.pdf)
    autoencoder ensemble for online scoring, or the analytical-learning robot classifiers (decision tree/Bayesian)
    of [Doran & Gokhale](https://link.springer.com/article/10.1007/s10618-010-0180-z).
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Network ingress points (firewalls, load balancers), public-facing web server farms, and reverse
    proxy servers.'
  range: Last 90 days (online/streaming scoring)
  queries:
  - technology: ML/pseudocode
    query: "model = kitsune_autoencoder_ensemble()  # or decision_tree/bayesian robot classifier\nfor\
      \ ip, feats in stream(per_ip_flow_request_stats):\n  score = model.score(feats)\n  if score > THRESHOLD:\
      \ ALERT(ip, top3_features_by_recon_error(feats))"
- question: Did any internal host make an outbound HTTP request whose host and URI exactly match an entry
    on our watchlist of known leaked corporate-data URLs discovered through self-dorking and leak monitoring?
  context: Maintain a dynamic watchlist of leaked corporate-data URLs/hosts discovered via self-dorking
    and leak monitoring, and alert when Zeek http.log shows an outbound request whose host and URI exactly
    match an entry. An internal host reaching a known leak location can mean a curious or malicious insider
    accessing exposed data, or a compromised host being used to validate the leak. Seed honeytoken URLs
    into the watchlist for near-zero-false-positive hits. An exact-match hit is high fidelity and should
    trigger investigation of the requesting host and user. Watchlist seeded via leak monitoring per [Meli
    et al.](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_04B-3_Meli_paper.pdf) and
    [Unit 42](https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/); seed honeytoken
    URLs per [Kahlhofer & Rass](https://arxiv.org/abs/2405.12852) for near-zero-false-positive hits.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network egress points, forward proxy server logs, DNS resolver logs, and user workstations subnets.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for r in zeek_http where internal(r.id.orig_h):\n  if (r.host, r.uri) in LEAKED_URL_WATCHLIST:\n\
      \    sev = 'very_high' if r.host in HONEYTOKEN_URLS else 'high'\n    ALERT(r.id.orig_h, r.host,\
      \ r.uri, sev)"
- question: Which outbound URLs from internal hosts are highly similar (token/Jaccard similarity > 0.85)
    to watchlist leak entries, and did the request successfully retrieve data or only probe it?
  context: Exact matching misses variants, so compute Jaccard/token similarity between each outbound URL
    and watchlist entries and flag requests above 0.85 similarity as access to related leaked resources.
    Profile volume (bytes pulled) and state (success vs. 404/403) to distinguish successful retrieval
    from mere probing. Use query-pivoting gadgets to expand the watchlist toward adversary-likely related
    URLs so near-miss accesses to sibling leak paths are also caught. A high-similarity, high-byte success
    indicates an actor actually pulling down leaked organizational data. Use the query-pivoting gadgets
    of [EVILSEED](https://sites.cs.ucsb.edu/~chris/research/doc/oakland12_evilseed.pdf) to expand the
    watchlist to adversary-likely related URLs.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network egress points, forward proxy server logs, DNS resolver logs, and user workstations subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for r in zeek_http where internal(r.id.orig_h):\n  for w in expand_watchlist(LEAKED_URL_WATCHLIST):\
      \  # query-pivot gadgets\n    if jaccard_token_sim(r.url, w) > 0.85:\n      state = 'retrieved'\
      \ if r.status in [2xx] else 'probed'\n      ALERT(r.id.orig_h, r.url, w, bytes=r.resp_bytes, state)"
- question: Does an anomaly model over outbound HTTP/DNS features flag any internal request to a leaked-data
    URL as abnormal relative to the user's and peers' historical behavior?
  context: Train an Isolation Forest or autoencoder on Zeek http.log/dns.log features such as domain reputation,
    site category, per-user and peer historical access frequency, DNS characteristics, and response bytes
    to flag anomalous requests to leaked-data URLs. Surface the top-3 contributing features in the alert
    and validate thresholds against a public web-attack dataset. This catches a user or host suddenly
    reaching low-reputation leak infrastructure they have never contacted before, complementing the exact-match
    and similarity methods and helping confirm exploitation of reconnaissance-discovered exposures. Train
    an Isolation Forest / autoencoder ([Kitsune](https://www.ndss-symposium.org/wp-content/uploads/2018/02/ndss2018_03A-3_Mirsky_paper.pdf))
    and validate thresholds against the [Web Attack Detection Dataset](https://data.mendeley.com/datasets/wt8m6bcwbr/1).
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network egress points, forward proxy server logs, DNS resolver logs, and user workstations subnets.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = isolation_forest_or_autoencoder(features=[domain_reputation,site_category,user_hist_freq,peer_hist_freq,dns_chars,resp_bytes])\n\
      for r in zeek_http join zeek_dns where url_in_or_near_leak_watchlist(r):\n  s, feats = model.score(r)\n\
      \  if s > THRESHOLD: ALERT(r.id.orig_h, r.url, top3_features(feats))"
