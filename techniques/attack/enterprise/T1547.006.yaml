name: 'T1547.006: Kernel Modules and Extensions'
id: 8851f949-b85c-4cb8-84c7-06502e8b9e0e
description: 'This playbook helps an analyst investigate adversary use of malicious kernel modules and
  kernel extensions (T1547.006) to gain Persistence and/or Privilege Escalation on Linux, macOS, and Windows
  hosts. It guides the hunt across multiple behavioral angles: Windows kernel-driver service creation
  (Event ID 7045) and driver loads where the driver is unsigned, lives in an anomalous directory, or matches
  a known-vulnerable/malicious (LOLDrivers/BYOVD) corpus; rare or newly-seen drivers correlated with anomalous
  post-load network egress (Zeek conn/dns, Sysmon 3); Linux loadable kernel module loads via insmod/modprobe/finit_module
  from temp or user-writable paths and modules not owned by any package, including the download->chmod->insmod->root-shell
  chain; macOS kextload/kmutil execution of unsigned or non-allowlisted Team-ID kexts and SIP downgrades;
  hidden LKM rootkits that diverge from a trusted kernel/golden baseline; non-admin BYOVD driver loads
  via sc.exe/fltmc.exe; integrity-level transitions (Medium/Low parent spawning a SYSTEM child); and non-root-to-root
  EUID transitions following module loads. Detection methods combine symbolic-logic rules, statistical
  baselining/rarity and change-point scoring, and machine learning models applied to Windows Security/Sysmon/CodeIntegrity
  events, auditd, Falco/eBPF, osquery, unified logs, and Zeek network telemetry so the analyst can corroborate
  suspected kernel tampering against signing state, path rarity, process lineage, privilege transitions,
  and network context.'
type: technique
