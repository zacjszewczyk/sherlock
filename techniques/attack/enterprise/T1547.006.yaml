questions:
- question: '[Persistence] Kernel driver IOC correlation: Can you determine whether a Windows service
    is created (Event ID 7045) for a kernel driver where the driver file is unsigned, located in an anomalous
    directory (e.g., C:\Users\), or its hash matches known malicious indicators. -- specifically, using
    the ''Kernel driver IOC correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary loads code directly
    into the kernel (Loadable Kernel Modules on Linux, kernel extensions on macOS, or signed/vulnerable
    drivers on Windows) to run at the highest privilege (Ring 0), survive reboots, and hide their presence.
    This evidence focuses on the condition that a Windows service is created (Event ID 7045) for a kernel
    driver where the driver file is unsigned, located in an anomalous directory (e.g., C:\Users\), or
    its hash matches known malicious indicators. This Symbolic Logic approach looks for the following
    signal: Inspect Windows Event ID 7045 driver creation entries, extract ImagePath, verify the Authenticode
    signature, and alert when the driver is unsigned (corroborate with Windows CodeIntegrity-Operational
    EventID 3001 [CodeIntegrity - Unsigned Kernel Module Loaded](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/code_integrity/win_codeintegrity_unsigned_driver_loaded.yml))
    or its MD5/SHA256 matches the known vulnerable/malicious driver corpus in [Vulnerable Driver Load
    (LOLDrivers)](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/driver_load/driver_load_win_vuln_drivers.yml).
    Treat ImagePaths under C:\Users\, C:\Windows\Temp, or ProgramData as high severity ([Trend Micro](https://documents.trendmicro.com/assets/white_papers/wp-an-in-depth-look-at-windows-kernel-threats.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a process is loading
    or has loaded kernel-level code in a way that deviates from sanctioned drivers, modules, or kexts;
    pivot to the responsible process, its parent lineage, the user/account context, the module/driver/kext
    file and its signing state, and any subsequent privilege transition or network activity. A negative
    result helps rule out this kernel-tampering vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy rootkits, BYOVD abuse, or living-off-the-land
    module loads.'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4688
  - Windows Sysmon Event ID 6
  - 'NAI: Windows endpoint and server fleet, including Domain Controllers and application servers; System
    driver directories (%SystemRoot%\System32\drivers) for baselining.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Kernel driver IOC correlation

      source IN [Windows Event ID 7045, Windows Event ID 4688, Windows Sysmon Event ID 6]

      | WHERE matches_action_criteria("Kernel driver IOC correlation")

      // Inspect Windows Event ID 7045 driver creation entries, extract ImagePath, verify the Authenticode
      signature, and alert w

      | ALERT enrich(host, user, process, parent, driver/module/kext, signature, dest)'
- question: '[Persistence] Driver path rarity scoring: Can you determine whether a Windows service is
    created (Event ID 7045) for a kernel driver where the driver file is unsigned, located in an anomalous
    directory (e.g., C:\Users\), or its hash matches known malicious indicators. -- specifically, using
    the ''Driver path rarity scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary loads code directly
    into the kernel (Loadable Kernel Modules on Linux, kernel extensions on macOS, or signed/vulnerable
    drivers on Windows) to run at the highest privilege (Ring 0), survive reboots, and hide their presence.
    This evidence focuses on the condition that a Windows service is created (Event ID 7045) for a kernel
    driver where the driver file is unsigned, located in an anomalous directory (e.g., C:\Users\), or
    its hash matches known malicious indicators. This Statistical Method approach looks for the following
    signal: Baseline driver ImagePaths from Windows 7045/Sysmon 6 over 90 days and flag paths below the
    5th percentile frequency or with <1% fleet prevalence; rarity-as-malice is justified because ~99.7%
    of real threats are rare in host populations ([F-Secure prevalence](https://blog.f-secure.com/whats-the-deal-with-prevalence/)).
    Track the count of distinct new drivers per host per day (Volume/Frequency) and the unsigned-load
    failure/block count (State). A positive result -- a rule match, statistical outlier, or model alert
    -- suggests a process is loading or has loaded kernel-level code in a way that deviates from sanctioned
    drivers, modules, or kexts; pivot to the responsible process, its parent lineage, the user/account
    context, the module/driver/kext file and its signing state, and any subsequent privilege transition
    or network activity. A negative result helps rule out this kernel-tampering vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy rootkits, BYOVD
    abuse, or living-off-the-land module loads.'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4688
  - Windows Sysmon Event ID 6
  - 'NAI: Windows endpoint and server fleet, including Domain Controllers and application servers; System
