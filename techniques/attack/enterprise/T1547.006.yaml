- question: '[Persistence] Linux module path detection: Can you determine whether the `insmod` or `modprobe`
    commands are executed on a Linux host to load a kernel module (.ko file) from a temporary or user-writable
    directory, or a module is loaded that is not part of a legitimate software package. -- specifically,
    using the ''Linux module path detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary loads code directly
    into the kernel (Loadable Kernel Modules on Linux, kernel extensions on macOS, or signed/vulnerable
    drivers on Windows) to run at the highest privilege (Ring 0), survive reboots, and hide their presence.
    This evidence focuses on the condition that the `insmod` or `modprobe` commands are executed on a
    Linux host to load a kernel module (.ko file) from a temporary or user-writable directory, or a module
    is loaded that is not part of a legitimate software package. This Symbolic Logic approach looks for
    the following signal: Alert on auditd SYSCALL/EXECVE insmod/modprobe/kmod events ([Loading of Kernel
    Module via Insmod, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/syscall/lnx_auditd_load_module_insmod.yml))
    where the module path is non-standard (/tmp, /dev/shm, home dirs) or the .ko is not owned by a package,
    and record the syscall result to separate successful loads from blocked/failed ones (State). Corroborate
    with the [Falco Linux Kernel Module Injection rule](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml)
    (CAP_SYS_MODULE, parent lineage) and [Sysmon for Linux](https://github.com/Sysinternals/SysmonForLinux)
    EID 1/11 (.ko creation under /lib/modules). A positive result -- a rule match, statistical outlier,
    or model alert -- suggests a process is loading or has loaded kernel-level code in a way that deviates
    from sanctioned drivers, modules, or kexts; pivot to the responsible process, its parent lineage,
    the user/account context, the module/driver/kext file and its signing state, and any subsequent privilege
    transition or network activity. A negative result helps rule out this kernel-tampering vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy
    rootkits, BYOVD abuse, or living-off-the-land module loads.'
