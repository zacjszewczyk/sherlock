name: 'T1011: Exfiltration Over Other Network Medium'
id: 4fb90466-d3fd-4d49-81bf-836eb95f55f1
description: Investigate potential exfiltration of data over a non-primary or secondary network medium
  (e.g., Wi-Fi, Bluetooth, cellular/modem, or another RF channel) that bypasses monitoring on the main
  enterprise egress path. This playbook helps an analyst hunt for processes that match known IOC hashes
  connecting outbound over secondary interfaces to TI-listed destinations; network-capable-but-unexpected
  processes (e.g., rundll32, regsvr32, powershell) using alternate interfaces; execution of interface-enable
  utilities (netsh, Enable-NetAdapter, New-NetIPAddress on Windows; rfkill/nmcli/iw/hcitool/pppd on Linux;
  networksetup/blueutil on macOS) in anomalous user or parent context; stage-then-exfiltrate sequences
  pairing archiving of sensitive directories with large outbound transfers on a freshly enabled interface;
  statistical and beaconing anomalies in secondary-interface traffic (byte volume, duration, port, protocol,
  JA3, periodicity, failed associations); and connections from non-allowlisted or non-standard-path processes.
  It combines symbolic-logic detections, statistical baselining, and machine-learning models to surface
  defensible, triage-ready alerts.
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a process whose file hash matches a known T1011 tool IOC initiate an outbound connection
    over a non-primary interface (Wi-Fi, Bluetooth, cellular) to a TI-listed destination, or did a network-capable-but-unexpected
    process (rundll32, regsvr32, powershell) connect over a secondary interface regardless of IOC match?
  context: This deterministic correlation joins process-creation, host network-connection, and flow records
    to catch the highest-confidence case of exfiltration (TA0010), where the adversary steals data over
    an alternate medium that is not routed through and defended like the primary enterprise egress. A
    positive result means a known-bad binary reached a known-bad IP over a secondary NIC — a near-certain
    exfiltration event. Because adversaries deliberately pick alternate media to evade primary-egress
    monitoring, also alert when LOLBins or normally non-networking processes create connections on a non-primary
    interface even without an IOC match; that broadens coverage to novel tooling. Join Windows Event ID
    4688 (process + hash) with 5156 (filtering-platform connection) and Zeek conn.log (flow, interface)
    and pivot on process hash, destination reputation, and interface type.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Endpoints with multiple network interfaces (e.g., laptops, workstations with cellular cards),
    Network egress points monitoring secondary channels, VPN concentrators'
  range: Last 90 days, with event-centered correlation around each matching process execution.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc = EventID4688; conn = EventID5156; flow = zeek_conn;\njoin proc.pid=conn.pid, conn.dest_ip=flow.dest_ip\
      \ on time_window<=5m;\nalert when (proc.hash in T1011_IOC_hashes and flow.dest_ip in TI_list and\
      \ flow.interface in {wifi,bluetooth,cellular})\n   or (proc.image in {rundll32.exe,regsvr32.exe,powershell.exe}\
      \ and flow.interface != primary_nic);\noutput host, user, proc.image, proc.hash, flow.dest_ip, flow.interface,\
      \ flow.orig_bytes."
- question: Within the last 30 days, are there per-host (process name, interface type) pairings that are
    statistically rare — exceeding µ+3σ of historical counts or never seen before — and that also appear
    on fewer than 0.1% of hosts fleet-wide?
  context: Statistical baselining surfaces unusual process-to-interface behavior that no static IOC would
    catch, supporting detection of exfiltration (TA0010), where the adversary steals data over an alternate
    medium that is not routed through and defended like the primary enterprise egress. Build 30-day per-host
    counts of (process name, interface type) tuples and flag values above an explainable mean+kσ threshold
    (or entirely unseen pairings). Cross-check with fleet-wide prevalence so that a tuple that is rare
    both for the host and across the enterprise rises to the top. A positive result indicates a process
    is using an interface it normally never touches — a hallmark of opportunistic alternate-channel exfiltration;
    a negative result means the behavior fits established norms.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Endpoints with multiple network interfaces (e.g., laptops, workstations with cellular cards),
    Network egress points monitoring secondary channels, VPN concentrators'
  range: Last 90 days, baselined over a trailing 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = stats count by host, process, interface over last 30d;

      compute mu=mean(count), sigma=std(count) per (host, process);

      flag when current(process,interface) unseen or count > mu + 3*sigma;

      fleet = stats dc(host) by process, interface; flag when fleet_hosts/total_hosts < 0.001;

      alert on tuples meeting both host-rarity and fleet-rarity.'
- question: Does a gradient-boosting classifier trained on flow features assign a T1011 probability greater
    than 0.90 to any secondary-interface connection, and what are the top-3 features driving that score?
  context: A supervised model captures multivariate exfiltration patterns that single-feature rules miss,
    advancing detection of exfiltration (TA0010), where the adversary steals data over an alternate medium
    that is not routed through and defended like the primary enterprise egress. Train on CICFlowMeter-style
    features (process path, parent, command line, interface type, destination ASN/port, orig_bytes, resp_bytes,
    duration, connection-state counts) and alert when predicted T1011 probability exceeds 0.90. Surfacing
    the top-3 contributing features (e.g., interface type, byte volume, destination rarity) makes the
    alert explainable and triage-ready. A high-confidence positive warrants immediate investigation of
    the host and destination; the feature attributions tell the analyst what to verify first.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Endpoints with multiple network interfaces (e.g., laptops, workstations with cellular cards),
    Network egress points monitoring secondary channels, VPN concentrators'
  range: Last 90 days; score in near-real-time, retrain monthly.
  queries:
  - technology: ML/pseudocode
    query: "features = extract(process_path, parent, cmdline, interface_type, dest_asn, dest_port,\n \
      \                  orig_bytes, resp_bytes, duration, state_counts);\np = gbm.predict_proba(features)[T1011];\n\
      alert when p > 0.90; include shap_top3(features) in alert text."
- question: Were network-configuration utilities used to enable or modify a secondary interface — Windows
    netsh wlan/interface, Enable-NetAdapter, New-NetIPAddress; Linux rfkill unblock/nmcli/iw/hcitool/pppd;
    macOS networksetup/blueutil — and were they run by a non-standard user or unexpected parent process?
  context: 'Enabling an otherwise-dormant interface is a deterministic precursor to alternate-channel
    exfiltration (TA0010), where the adversary steals data over an alternate medium that is not routed
    through and defended like the primary enterprise egress. Match Event ID 4688 command lines and 4104
    script blocks (and the OS-equivalent commands on Linux/macOS) against the interface-activation patterns
    from DET0077, then qualify on execution context: a non-standard user, service account, or anomalous
    parent (e.g., Office, browser, or a script host spawning netsh) sharply raises suspicion. A positive
    result means someone is bringing up a side channel; correlate forward to traffic on that interface
    to confirm intent.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, Domain Controllers (for GPO changes), System management servers
    (MECM, Intune)'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "win = EventID4688 or EventID4104 where cmdline matches\n  /netsh\\s+(wlan|interface)|Enable-NetAdapter|New-NetIPAddress/i;\n\
      lin = auditd_syscall where cmd matches /rfkill\\s+unblock|nmcli|\\biw\\b|hcitool|pppd/;\nmac = process_events\
      \ where cmd matches /networksetup|blueutil/;\nalert when (win|lin|mac) and (user not in standard_admins\
      \ or parent not in expected_parents)."
- question: Per user, is the frequency or entropy of network-configuration commands anomalously high (entropy
    > µ+2σ) or does it contain rare command patterns relative to a learned baseline?
  context: Interface-config activity is normal for IT staff but anomalous for most users, so per-user
    baselining isolates suspicious operators pursuing exfiltration (TA0010), where the adversary steals
    data over an alternate medium that is not routed through and defended like the primary enterprise
    egress. Track each user's rate and the entropy of their network-config command set with mean+kσ thresholds,
    flagging executions whose entropy exceeds µ+2σ or that introduce rare patterns. A positive result
    highlights a user who suddenly began manipulating interfaces in unusual ways — worth correlating with
    their data-access and outbound-traffic history.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, Domain Controllers (for GPO changes), System management servers
    (MECM, Intune)'
  range: Last 90 days, baselined over a trailing 30-day window per user.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'cmds = netconfig_commands by user over 30d;

      compute freq, entropy(command_distribution) per user;

      mu=mean(entropy), sigma=std(entropy) across baseline;

      flag when user_entropy > mu + 2*sigma or command_pattern rare(<0.5%);

      alert with user, command, entropy_score.'
- question: Does an Isolation Forest trained on benign network-config command telemetry flag any execution
    as anomalous, and which top-3 features explain the anomaly?
  context: Unsupervised anomaly detection generalizes beyond known-bad patterns to catch novel interface-manipulation
    tied to exfiltration (TA0010), where the adversary steals data over an alternate medium that is not
    routed through and defended like the primary enterprise egress. Train an Isolation Forest on features
    such as time-of-day, user SID, parent process, command length, and presence of tokens like wlan/wwan/bluetooth/rfkill/nmcli,
    then flag outliers. Emitting the top-3 contributing features lets the analyst quickly judge whether
    the anomaly reflects benign troubleshooting or hostile side-channel setup. A positive result is strongest
    when combined with subsequent traffic on the affected interface.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, Domain Controllers (for GPO changes), System management servers
    (MECM, Intune)'
  range: Last 90 days; retrain monthly on benign telemetry.
  queries:
  - technology: ML/pseudocode
    query: "features = [hour, user_sid, parent_process, cmd_length,\n            has_token(wlan|wwan|bluetooth|rfkill|nmcli)];\n\
      score = IsolationForest.decision_function(features);\nalert when score < anomaly_threshold; include\
      \ top3_features(features)."
- question: On a single host, did a secondary-interface activation, then execution of an archiver/compression
    utility against sensitive directories, then a >50MB outbound connection on that interface all occur
    within a 15-minute window?
  context: This sequence-based correlation captures the classic stage-then-exfiltrate chain that characterizes
    exfiltration (TA0010), where the adversary steals data over an alternate medium that is not routed
    through and defended like the primary enterprise egress. Each step alone may be benign, but their
    ordered occurrence within a tight window on one host is highly indicative of deliberate data theft
    over an alternate channel. Look for [1] interface-enable command, [2] archiver (zip/rar/7z/tar) touching
    sensitive paths, and [3] a large outbound transfer on the newly enabled interface. A positive match
    should be treated as an active exfiltration in progress.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Endpoints, File servers hosting sensitive data, Network egress points, Data Loss Prevention
    (DLP) sensor locations'
  range: Last 90 days, with 15-minute event-centered sequence correlation per host.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 's1 = interface_enable_event(host);

      s2 = EventID4688 where image in {7z,rar,zip,tar,Compress-Archive} and target in sensitive_dirs;

      s3 = (EventID5156 join zeek_conn) where interface=s1.interface and orig_bytes > 50MB;

      alert when s1 -> s2 -> s3 on same host within 15m; output host, archiver_cmd, dest_ip, bytes.'
- question: Did a post-staging outbound connection on a secondary interface exceed that interface's 30-day
    98th-percentile byte volume, or score high on RITA-style per-tuple byte-volume and long-connection
    metrics?
  context: Volume-based percentile baselining quantifies abnormally large transfers that signal exfiltration
    (TA0010), where the adversary steals data over an alternate medium that is not routed through and
    defended like the primary enterprise egress. Compute the trailing 30-day 98th-percentile outbound
    orig_bytes per secondary interface and flag connections (especially those following interface/archiver
    activity) that exceed it. Reusing RITA's per-tuple byte-volume and long-connection scoring on Zeek
    conn.log adds resilience to chunked or long-lived transfers. A positive result indicates a transfer
    well outside normal bounds for that medium — prioritize hosts where it follows staging activity.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Endpoints, File servers hosting sensitive data, Network egress points, Data Loss Prevention
    (DLP) sensor locations'
  range: Last 90 days, baselined over a trailing 30-day window per interface.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'p98 = percentile(orig_bytes, 98) by interface over 30d;

      flag conn where interface in secondary and orig_bytes > p98[interface];

      rita_score = byte_volume_and_long_conn_score(src,dst,interface);

      alert when flagged or rita_score high, boost when preceded by staging.'
- question: Does a time-series model (ARIMA on 5-minute volumes, or an LSTM/transformer for jittered slow
    drips) flag outbound volume on a secondary interface that exceeds its confidence bound after interface/archiving
    commands?
  context: Time-series anomaly detection models the temporal shape of exfiltration to catch both bursts
    and low-and-slow transfers tied to exfiltration (TA0010), where the adversary steals data over an
    alternate medium that is not routed through and defended like the primary enterprise egress. Apply
    ARIMA to 5-minute per-interface outbound volumes and alert when observed values breach the prediction
    confidence bound, especially right after interface-enable or archiving events. For high-jitter or
    drip exfiltration, model the per-interface volume/timing sequence with an LSTM or transformer and
    surface the contributing time windows. A positive result points the analyst to the exact intervals
    of anomalous egress.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Endpoints, File servers hosting sensitive data, Network egress points, Data Loss Prevention
    (DLP) sensor locations'
  range: Last 90 days; evaluate on rolling 5-minute buckets.
  queries:
  - technology: ML/pseudocode
    query: 'series = sum(orig_bytes) per 5min per interface;

      pred, ci = ARIMA(series).forecast();

      alert when observed > ci_upper after interface_or_archive_event;

      for jitter: seq_model = LSTM(volume,timing); alert on anomaly, output time_windows.'
- question: Does traffic on a secondary interface hit non-standard ports (port 53 carrying non-DNS, 6667,
    8888), use a known T1011 User-Agent, or sustain a long-lived connection to a rare external destination?
  context: 'Deterministic network watchlists catch known covert-channel signatures of exfiltration (TA0010),
    where the adversary steals data over an alternate medium that is not routed through and defended like
    the primary enterprise egress. Inspect Zeek conn/dns/ssl logs for secondary-interface flows that use
    suspicious ports, protocol-port mismatches (e.g., non-DNS over 53), known-bad User-Agents, or long-duration
    connections to rarely-seen externals. These are RITA-style long-connection and known-bad rules. A
    positive result is a concrete lead: pivot on the destination and interface to determine what data
    left the host.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network traffic sensors at egress points, Wireless Access Points, Endpoints with packet monitoring
    agents, Cloud Access Security Brokers (CASBs)'
  range: Last 90 days.
  queries:
  - technology: Zeek/pseudocode
    query: "alert conn where interface in secondary and (\n   (dest_port==53 and service!='dns') or dest_port\
      \ in {6667,8888}\n   or http.user_agent in T1011_UA_list\n   or (duration > long_conn_threshold\
      \ and dest_ip rare_external));\njoin dns.log, ssl.log for context; output src, dest, port, ja3,\
      \ duration."
- question: Do secondary-interface flows breach per-port 99th-percentile baselines for orig_bytes, duration,
    or JA3, show beaconing cadence (low CoV/MAD, Bowley skew, FFT periodicity), exhibit rising blocked/failed-connection
    and failed Wi-Fi/Bluetooth association counts, or match a low-throughput covert-channel signature?
  context: Multi-metric statistical profiling detects covert exfiltration and its failure-mode tells over
    exfiltration (TA0010), where the adversary steals data over an alternate medium that is not routed
    through and defended like the primary enterprise egress. Baseline 99th-percentile orig_bytes, duration,
    and JA3 per port and flag exceedances; measure beaconing regularity via coefficient of variation,
    MAD, Bowley skewness, and FFT periodicity. Separately profile the State/failure-mode signal — counts
    of blocked/failed connections and failed Wi-Fi/Bluetooth associations per interface — and alert on
    rises that betray side-channel setup. Add a per-destination entropy/rate detector for slow drips.
    Positive results cluster these weak signals into a defensible case.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network traffic sensors at egress points, Wireless Access Points, Endpoints with packet monitoring
    agents, Cloud Access Security Brokers (CASBs)'
  range: Last 90 days, baselined over a trailing 30-day window per port/interface.
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'p99 = percentile([orig_bytes,duration,ja3_rarity],99) by port over 30d;

      beacon = {cov, mad, bowley_skew, fft_periodicity} per (src,dst);

      fails = count(state in {S0,REJ,RSTO} or wifi/bt_assoc_fail) per interface;

      drip = entropy_rate per dst over time;

      alert when p99 exceeded or beacon regular or fails rising or drip anomalous.'
- question: Does an unsupervised autoencoder ensemble (KitNET) over incremental per-interface flow statistics
    produce high reconstruction-error (RMSE) anomalies, and do DBSCAN-clustered Zeek features flag the
    same flows as noise points?
  context: Unsupervised deep models detect never-before-seen anomalous traffic shapes consistent with
    exfiltration (TA0010), where the adversary steals data over an alternate medium that is not routed
    through and defended like the primary enterprise egress. Train a KitNET autoencoder ensemble on benign
    per-interface flow statistics (bandwidth, jitter, inter-arrival, protocol mix) and alert on RMSE reconstruction-error
    spikes, emitting the top-3 contributing features for explainability. Optionally cluster Zeek features
    (log10 bytes, duration, port, protocol) with DBSCAN and treat noise points as anomalies. Convergence
    of both methods on the same flow strengthens confidence that the secondary-interface traffic is malicious.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network traffic sensors at egress points, Wireless Access Points, Endpoints with packet monitoring
    agents, Cloud Access Security Brokers (CASBs)'
  range: Last 90 days; incremental online scoring with monthly benign retraining.
  queries:
  - technology: ML/pseudocode
    query: 'stats = incremental_features(bandwidth, jitter, inter_arrival, proto_mix) per interface;

      rmse = KitNET.process(stats); alert when rmse > anomaly_threshold, output top3_features;

      clusters = DBSCAN(log10_bytes, duration, port, protocol);

      flag noise_points as anomalies; corroborate with rmse alerts.'
- question: Was a secondary-interface connection initiated by a process not on the network-capable-application
    allowlist (e.g., notepad.exe), or by a legitimate networking process (e.g., powershell.exe) running
    from a user-writable path such as %APPDATA% or C:\Temp\?
  context: Allowlist and path enforcement deterministically flags processes that have no business using
    a side channel, a strong signal of exfiltration (TA0010), where the adversary steals data over an
    alternate medium that is not routed through and defended like the primary enterprise egress. Alert
    when a secondary-interface flow originates from a process whose path is absent from the approved network-capable
    allowlist, or from a normally-legitimate networking binary executing out of a user-writable directory
    (masquerading/relocation). A positive result identifies either an unexpected networking process or
    a relocated LOLBin — both warrant immediate host investigation and consideration of disabling the
    unused interface.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, Virtual Desktop Infrastructure (VDI) instances'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "conn = (EventID5156 join zeek_conn) where interface in secondary;\nproc = EventID4688 by pid;\n\
      alert when proc.path not in network_allowlist\n   or proc.path matches /\\\\AppData\\\\|\\\\Temp\\\
      \\/i;\noutput host, user, proc.image, proc.path, dest_ip, interface."
- question: Among (Process Path, Parent Path, Interface) triples observed over 30 days, are there new
    triples occurring on less than 0.01% of hosts (mean+kσ rare) that are also rare fleet-wide?
  context: Group frequency analysis isolates novel process/parent/interface combinations indicative of
    exfiltration (TA0010), where the adversary steals data over an alternate medium that is not routed
    through and defended like the primary enterprise egress. Baseline (Process Path, Parent Path, Interface)
    triples over 30 days and flag new ones with per-host frequency below 0.01% using mean+kσ, then corroborate
    with fleet-wide rarity scoring. A positive result reveals an unprecedented lineage reaching a secondary
    interface — e.g., a script host spawning an unusual child that connects over Bluetooth — which is
    far more suspicious than any single rare attribute alone.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, Virtual Desktop Infrastructure (VDI) instances'
  range: Last 90 days, baselined over a trailing 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'triples = (process_path, parent_path, interface) over 30d;

      per_host_freq = count(triple)/host_events;

      flag new triple where per_host_freq < 0.0001 (mean+k*sigma);

      fleet_rarity = dc(host) by triple / total_hosts;

      alert when host-rare and fleet-rare.'
- question: Does a lexical classifier scoring process paths, combined with interface, port, and byte features,
    flag any secondary-interface connection as anomalous, and what top-3 features explain it?
  context: ML path-legitimacy scoring detects masqueraded or randomly-named binaries exfiltrating over
    alternate media in support of exfiltration (TA0010), where the adversary steals data over an alternate
    medium that is not routed through and defended like the primary enterprise egress. Score each process
    path with a lexical model (capturing randomness, suspicious directories, masquerade patterns) and
    combine it with interface type, destination port, and byte volume to classify the connection. Surfacing
    the top-3 contributing features (path lexical score, interface type, byte volume) makes the alert
    explainable. A positive result flags connections from suspicious binaries that allowlists may not
    yet cover.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, Virtual Desktop Infrastructure (VDI) instances'
  range: Last 90 days; score continuously, retrain periodically.
  queries:
  - technology: ML/pseudocode
    query: 'lex = lexical_classifier.score(process_path);

      features = [lex, interface_type, dest_port, orig_bytes];

      p = model.predict_proba(features)[anomalous];

      alert when p > threshold; include top3_features(features) in alert.'
