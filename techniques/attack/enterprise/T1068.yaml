name: 'T1068: Exploitation for Privilege Escalation'
id: 38c95235-f973-4e70-84a6-cb1cf4a373a7
description: This playbook helps an analyst determine whether an adversary has exploited a software vulnerability
  to achieve Privilege Escalation (T1068) — moving from unprivileged or user-level access to SYSTEM/root,
  local administrator, or out of a container/VM onto the host. It covers Bring Your Own Vulnerable Driver
  (BYOVD) activity on Windows (vulnerable/malicious .sys/.exe/.dll files matched against the LOLDrivers
  and Microsoft Recommended Driver Block Rules catalogs), exploit-tool and RPC string signatures (e.g.,
  PrintNightmare, PetitPotam, Juicy/Rotten/GodPotato, token-elevation tooling) correlated with Zeek dce_rpc.log,
  anomalous parent-child process lineage from sensitive system processes (lsass.exe, services.exe, wininit.exe,
  spoolsv.exe), integrity-level inversion and excessive process-access requests (UAC bypass and credential/token
  theft against lsass.exe), stateful correlation of the post-escalation kill-chain (account creation,
  privileged-group additions, service/scheduled-task install), and Linux/macOS/container exploitation
  primitives (unexpected setuid/setgid, capset capability changes, kernel-module loads, namespace escapes
  via setns/unshare, and DirtyPipe/DirtyCOW-style overwrites). Each investigative question pairs deterministic
  symbolic-logic rules with statistical baselining (rarity, entropy, prevalence percentiles, failure-rate
  and risk scoring) and machine-learning methods (PE-feature classifiers, sequence models, one-class/anomaly
  detectors, and provenance-graph learning) to produce evasion-resistant, explainable detections for the
  Privilege Escalation tactic across Windows endpoint logs, Linux auditd/eBPF (Falco), macOS EndpointSecurity,
  container runtimes, and network telemetry.
type: technique
related:
- tactic_id: TA0004
  tactic_name: Privilege Escalation
