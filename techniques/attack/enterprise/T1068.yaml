- question: 'Using statistical baselining, can you determine whether ''rarity, first-seen, and byte-distribution
    scoring of new drivers/executables'' reveals exploitation for privilege escalation in the activity
    described as: A driver (.sys), executable (.exe), or library (.dll) file is created on disk, and its
    file hash matches a known-vulnerable driver or a known privilege escalation exploit payload. Specifically:
    From >=30 days of Event ID 11/6, build a fleet prevalence table of (file name, directory, signer,
    SHA256). Frequency metric: flag drivers/executables appearing on a single host or below the 1st percentile
    of fleet prevalence, and flag any first-seen .sys written to writable/temp paths (C:\Windows\Temp,
    %TEMP%, user-writable dirs) rather than %SystemRoot%\System32\drivers. Volume metric: compute Shannon
    entropy and per-byte frequency distribution (Mahalanobis distance against a benign signed-driver profile,
    per [Anomalous Payload-Based Network Intrusion Detection](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11));
    high entropy + low prevalence + non-standard path is the escalation-prone combination. Derive thresholds
    per environment from the empirical percentile of benign signed drivers. Alert text must list the top-3
    contributors (e.g., prevalence=1 host, path=%TEMP%, entropy=7.9).'
