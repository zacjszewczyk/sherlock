questions:
- question: 'Using deterministic rule logic, can you determine whether ''known-vulnerable/malicious driver
    and exploit hash + name blocklist'' reveals exploitation for privilege escalation in the activity
    described as: A driver (.sys), executable (.exe), or library (.dll) file is created on disk, and its
    file hash matches a known-vulnerable driver or a known privilege escalation exploit payload. Specifically:
    Monitor Sysmon Event ID 11 (FileCreate), 15 (FileCreateStreamHash), and especially Event ID 6 (DriverLoad).
    For every created/loaded .sys/.exe/.dll compute SHA256/SHA1/MD5 and the file name+signer, then match
    against the BYOVD catalog from [LOLDrivers](https://www.loldrivers.io/) and the [Microsoft Recommended
    Driver Block Rules](https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/design/microsoft-recommended-driver-block-rules)
    blocklist (keyed on name + version range + signer + hash). Trigger high-severity on any hash match,
    and medium-severity when a known-vulnerable driver name loads with a signature outside the blocked
    version range (renamed/repacked BYOVD). State/Failure signal: also alert when WDAC/code-integrity
    blocks a driver load (Event ID 3077 / DeviceGuard) as this marks an attempted-and-blocked BYOVD. Refresh
    feeds daily; see [SigmaHQ](https://github.com/SigmaHQ/sigma) vulnerable-driver rules for field mappings.'
  context: 'Tactic context (Privilege Escalation): adversaries exploit programming errors in the OS kernel,
    drivers, services, or applications to elevate from low-privilege access to SYSTEM/root, administrator,
    or to break out of a container/VM onto the host. Evidence under investigation: A driver (.sys), executable
    (.exe), or library (.dll) file is created on disk, and its file hash matches a known-vulnerable driver
    or a known privilege escalation exploit payload. Approach (known-vulnerable/malicious driver and exploit
    hash + name blocklist): Monitor Sysmon Event ID 11 (FileCreate), 15 (FileCreateStreamHash), and especially
    Event ID 6 (DriverLoad). For every created/loaded .sys/.exe/.dll compute SHA256/SHA1/MD5 and the file
    name+signer, then match against the BYOVD catalog from [LOLDrivers](https://www.loldrivers.io/) and
    the [Microsoft Recommended Driver Block Rules](https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/design/microsoft-recommended-driver-block-rules)
    blocklist (keyed on name + version range + signer + hash). Trigger high-severity on any hash match,
    and medium-severity when a known-vulnerable driver name loads with a signature outside the blocked
    version range (renamed/repacked BYOVD). State/Failure signal: also alert when WDAC/code-integrity
    blocks a driver load (Event ID 3077 / DeviceGuard) as this marks an attempted-and-blocked BYOVD. Refresh
    feeds daily; see [SigmaHQ](https://github.com/SigmaHQ/sigma) vulnerable-driver rules for field mappings.
    A positive result indicates an exploitation or escalation attempt that warrants immediate triage —
    pivot to the originating account, process lineage, host integrity level, and any follow-on persistence,
    credential access, or lateral movement; a negative result means the observed behavior matches established
    benign baselines for this NAI. Run statistical and ML methods in parallel with the deterministic rules
    so novel or obfuscated exploits are not missed, and require the top contributing features/events in
    every alert for explainability.'
