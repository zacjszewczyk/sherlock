- question: Did a process with EUID==0 that was spawned from a non-root real UID initiate an external
    network connection to a threat-intel blocklist IP, and what was the connection state (established
    S1/SF/RSTO versus failed/blocked S0/REJ)?
  context: 'Tactic context (TA0004 Privilege Escalation): this supports the information requirement "Has
    the adversary escalated privileges using Setuid/Setgid?". Evidence sought: A process running with
    root privileges (EUID=0), spawned via SUID or SGID from a non-root user context, initiates an outbound
    network connection to an IP address outside of the organization''s network space, indicating that
    privilege escalation may be enabling command-and-control or exfiltration. Method (symbolic logic)
    [SUID Network Correlation]: Correlate process logs (Sysmon EID 1, auditd) with network logs (Sysmon
    EID 3, Zeek conn.log) on PID+host and alert when a process with EUID==0 spawned from a non-root real
    UID makes an external connection to a threat-intel blocklist IP. Profile connection STATE explicitly:
    separate established (conn_state S1/SF/RSTO) from failed/blocked attempts (S0, REJ), since post-escalation
    C2 beaconing and blocked egress are distinct signals. Reference [ATT&CK T1548.001](https://attack.mitre.org/techniques/T1548/001/)
    and [Falco default rules](https://falco.org/docs/reference/rules/default-rules/) unexpected-outbound
    logic; include EUID/RUID, destination, and conn_state in the alert. A positive result strongly indicates
    setuid/setgid privilege abuse and warrants escalation and host triage - review parent-process lineage,
    real vs effective UID/GID, binary path and hash, and exit status; a negative result lowers but does
    not eliminate suspicion, since intelligence feeds and statistical baselines lag novel tradecraft.'
