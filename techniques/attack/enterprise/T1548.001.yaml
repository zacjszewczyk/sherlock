name: 'T1548.001: Abuse Elevation Control Mechanism: Setuid and Setgid'
id: 76d52b14-2337-4d7e-8d47-b1fbe41daa33
description: 'This playbook helps an analyst investigate adversary abuse of the Linux/macOS setuid and
  setgid permission bits to escalate privileges (MITRE ATT&CK T1548.001). When a binary has the SUID or
  SGID bit set it runs with the privileges of the owning user or group (often root) rather than the calling
  user, so attackers either set these bits on their own malware, target vulnerable binaries that already
  carry them, or use GTFOBins-style shell escapes from legitimate SUID helpers (pkexec, sudo, passwd,
  find, vim, nmap) to obtain a root shell. The investigative questions below cover: process executions
  where the effective UID/GID is 0 but the real UID/GID is non-zero (the defining state of SUID/SGID elevation);
  discovery and modification commands such as ''find -perm -4000'' and ''chmod +s/4755''; SUID binaries
  spawning unexpected child shells; escalated processes initiating external network connections for C2
  or exfiltration; SUID/SGID files whose hashes match IOCs or that sit in user-writable or non-standard
  paths; rapid file-create-then-chmod backdoor workflows; and anomalous SUID usage by users or service
  accounts. Each line of inquiry offers symbolic-logic, statistical, and machine-learning approaches across
  auditd, Sysmon for Linux, macOS unified logs, FIM/osquery inventory, and Zeek network telemetry so the
  analyst can confirm or refute setuid/setgid privilege abuse.'
type: technique
related:
