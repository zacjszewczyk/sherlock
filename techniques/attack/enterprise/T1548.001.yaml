questions:
- question: Did any process execute with an effective UID/GID of 0 while its real UID/GID was non-zero
    (the defining EUID==0 && RUID!=0 state of SUID/SGID elevation), and did the executed binary's hash
    match a known-malicious SUID/SGID abuse indicator?
  context: 'Tactic context (TA0004 Privilege Escalation): this supports the information requirement "Has
    the adversary escalated privileges using Setuid/Setgid?". Evidence sought: A process creation event
    records a non-root user launching a binary that is confirmed by file inventory or FIM telemetry to
    have SUID or SGID permissions, and the executable hash matches a threat-intelligence indicator associated
    with privilege-escalation tooling or malware. Method (symbolic logic) [SUID Hash Correlation]: Query
    process creation logs (Sysmon for Linux EID 1 and auditd execve/syscall) joined with file inventory
    to find exec events where effective UID/GID is 0 but real UID/GID is non-zero (EUID==0 && RUID!=0),
    the defining state of SUID/SGID elevation per [Elastic Linux SUID/SGID rules](https://github.com/elastic/detection-rules/tree/main/rules/linux)
    and [ATT&CK T1548.001](https://attack.mitre.org/techniques/T1548/001/), AND the executed binary hash
    matches a known-malicious SUID/SGID abuse indicator. Trigger high severity on any match; if no hash
    match, still record the EUID!=RUID transition as a lower-severity event. Alert text MUST include the
    binary path+hash, real vs effective UID, parent process lineage, and process exit status (success
    vs non-zero) to support triage. A positive result strongly indicates setuid/setgid privilege abuse
    and warrants escalation and host triage - review parent-process lineage, real vs effective UID/GID,
    binary path and hash, and exit status; a negative result lowers but does not eliminate suspicion,
    since intelligence feeds and statistical baselines lag novel tradecraft.'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - Auditd type=execve
  - File Integrity Monitoring (FIM) logs
  - 'NAI: All Linux endpoints and servers; Centralized log management platform (e.g., SIEM).'
  range: Last 90 days; correlate related process, file, and network events within a tight window (e.g.,
    60 seconds)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  process_exec (sysmon_linux EID1 / auditd execve) JOIN file_inventory ON binary_path\n\
      \  WHERE EUID==0 AND RUID!=0\n  IF binary_hash IN malicious_suid_hash_feed -> ALERT severity=high\n\
      \  ELSE -> RECORD severity=low (EUID!=RUID transition)\n  EMIT binary_path, binary_hash, RUID, EUID,\
      \ parent_lineage, exit_status"
- question: For processes running with EUID==0 && RUID!=0, is the command-line Shannon entropy above the
    95th percentile for that binary, is the per-binary daily execution count beyond 3 sigma, or has the
    non-zero exit (failure) rate spiked relative to a per-binary, per-host-role baseline?
  context: 'Tactic context (TA0004 Privilege Escalation): this supports the information requirement "Has
    the adversary escalated privileges using Setuid/Setgid?". Evidence sought: A process creation event
    records a non-root user launching a binary that is confirmed by file inventory or FIM telemetry to
    have SUID or SGID permissions, and the executable hash matches a threat-intelligence indicator associated
    with privilege-escalation tooling or malware. Method (statistical) [SUID Command Entropy Baseline]:
    For all processes executed with EUID==0 && RUID!=0, compute (a) Shannon entropy of the command line,
    (b) per-binary daily execution count (Volume/Frequency), and (c) the share of non-zero exit codes
    (Failure rate). Maintain per-binary, per-host-role baselines and flag any execution whose command-line
    entropy exceeds the 95th percentile for that binary, whose count exceeds 3 sigma, or whose failure
    rate spikes — the frequency/rarity thresholding validated by [Warrender et al., Alternative Data Models](https://www.cs.unm.edu/~forrest/publications/oakland-with-cite.pdf).
    Escalate when the parent is unusual or the path is user-writable (/tmp,/dev/shm). Derive percentiles
    per dataset over a >=30-day window. A positive result strongly indicates setuid/setgid privilege abuse
    and warrants escalation and host triage - review parent-process lineage, real vs effective UID/GID,
    binary path and hash, and exit status; a negative result lowers but does not eliminate suspicion,
    since intelligence feeds and statistical baselines lag novel tradecraft.'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - Auditd type=execve
  - File Integrity Monitoring (FIM) logs
  - 'NAI: All Linux endpoints and servers; Centralized log management platform (e.g., SIEM).'
  range: Last 90 days; derive baselines over a rolling 30-day (or longer) window
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  FOR each exec WHERE EUID==0 AND RUID!=0:\n    e = shannon_entropy(command_line)\n  \
      \  cnt = daily_count(binary, host_role)\n    fail = nonzero_exit_rate(binary, host_role)\n  baseline\
      \ per (binary, host_role) over >=30d\n  ALERT IF e > p95(binary) OR cnt > mean+3*sigma OR fail spikes\n\
      \  ESCALATE IF parent unusual OR path IN (/tmp,/dev/shm)"
- question: When SUID/SGID executions are clustered (e.g., DBSCAN) on features such as executing user,
    parent process, binary path, command-line token pattern, EUID/RUID delta, and inventory-presence flag,
    do any events fall out as noise points or tiny clusters indicating anomalous elevation behavior?
  context: 'Tactic context (TA0004 Privilege Escalation): this supports the information requirement "Has
    the adversary escalated privileges using Setuid/Setgid?". Evidence sought: A process creation event
    records a non-root user launching a binary that is confirmed by file inventory or FIM telemetry to
    have SUID or SGID permissions, and the executable hash matches a threat-intelligence indicator associated
    with privilege-escalation tooling or malware. Method (machine learning) [SUID Execution Clustering]:
    Build an unsupervised clustering model (e.g., DBSCAN) over SUID/SGID exec features (executing user,
    parent process, binary path, command-line token pattern, EUID/RUID delta, inventory-presence flag)
    to isolate noise points and small clusters that represent anomalous elevation behavior, analogous
    to node-level provenance anomaly scoring in [ThreaTrace](https://arxiv.org/pdf/2111.04333) and [MAGIC](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf).
    The alert MUST list the top-3 features that pushed the event from the dense benign cluster (e.g.,
    parent=curl, path=/dev/shm, binary absent from inventory). A positive result strongly indicates setuid/setgid
    privilege abuse and warrants escalation and host triage - review parent-process lineage, real vs effective
    UID/GID, binary path and hash, and exit status; a negative result lowers but does not eliminate suspicion,
    since intelligence feeds and statistical baselines lag novel tradecraft.'
