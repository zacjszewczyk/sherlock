    used to discover (''-perm -4000'' or ''-perm -2000'') or apply (''+s'', ''u+s'', ''g+s'', ''4755'',
    ''2755'') SUID or SGID permissions on local binaries. Method (symbolic logic) [SUID Discovery Command
    Alert]: Alert on process creation where ProcessName is ''find'' and the command line contains ''-perm''
    with ''/4000'',''-4000'',''/2000'',''-2000'',''/6000'',''/u=s'', or ''/g=s'', or where ProcessName
    is ''chmod'' with ''+s'',''u+s'',''g+s'', or an octal mode (4xxx/2xxx/6xxx) — the discovery/modification
    primitives codified by [Elastic Linux SUID/SGID rules](https://github.com/elastic/detection-rules/tree/main/rules/linux)
    and [ATT&CK T1548.001](https://attack.mitre.org/techniques/T1548/001/). Escalate when the target is
    a shell interpreter, an interpreter in a temp directory, or a binary in a world-writable path (/tmp,/dev/shm),
    and suppress root-run system scans with high arg counts as [Elastic Linux SUID/SGID rules](https://github.com/elastic/detection-rules/tree/main/rules/linux)
    does. Include the full command line and target path in the alert. A positive result strongly indicates
    setuid/setgid privilege abuse and warrants escalation and host triage - review parent-process lineage,
    real vs effective UID/GID, binary path and hash, and exit status; a negative result lowers but does
    not eliminate suspicion, since intelligence feeds and statistical baselines lag novel tradecraft.'
