- question: Did a process create event show 'find' with '-perm' and SUID/SGID masks ('/4000','-4000','/2000','-2000','/6000','/u=s','/g=s'),
    or 'chmod' with '+s','u+s','g+s', or an octal 4xxx/2xxx/6xxx mode, indicating discovery or application
