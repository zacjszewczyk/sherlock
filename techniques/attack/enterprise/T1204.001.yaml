    byte ratio, beacon CV) in the alert per [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a user clicked
    a malicious link and the resulting browser/mail/document process reached attacker infrastructure or
    executed attacker-controlled code; pivot to the responsible user and host, the clicked URL/domain
    and its reputation, the parent application and its child processes, any downloaded files and their
    execution, and subsequent outbound connections for beaconing. A negative result helps rule out this
    malicious-link vector for the inspected window but should be corroborated with the other questions
    in this playbook, since any single method can miss stealthy, low-and-slow, or living-off-the-land
    click-to-execution chains.'
  answer_sources: *id005
  range: Last 90 days (train on 30-90 day history; score rolling windows)
  queries:
  - technology: SIEM/ML pseudocode
    query: '# Network flow anomaly autoencoder

      source IN [Zeek conn.log, Zeek dns.log, Windows Event ID 4688, Sysmon Event ID 1, Sysmon Event ID
      3]

      | FEATURIZE events (url/domain/process/parent/file/flow features)

      | SCORE model.predict(features)

      // Train an LSTM autoencoder on per-process flow features (bytes in/out, byte ratio, packet counts,
      connection frequency, i

      | WHERE score > threshold | ALERT with top-3 feature attribution'
