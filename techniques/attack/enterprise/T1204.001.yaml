name: 'T1204.001: Malicious Link'
id: d2ab7d33-b79e-4668-9c29-6237e703175e
description: 'This playbook helps an analyst investigate whether an adversary achieved execution by convincing
  a user to click a malicious link (User Execution: Malicious Link), typically as follow-on behavior from
  a spearphishing link, browser/application exploitation, or a drive-by download. It guides the hunt across
  the full click-to-compromise chain on Windows, Linux, and macOS: (1) the endpoint resolving and connecting
  to a domain/IP on a threat-intelligence blocklist or a URL with anomalous lexical characteristics (entropy,
  length, lookalike/typosquat domains, URL shorteners, rare TLDs, newly-registered or short-lived infrastructure,
  and bursts of failed DNS/HTTP responses); (2) a user-facing application (browser, email client, or document
  reader such as chrome.exe, outlook.exe, acrord32.exe) spawning a command interpreter or Living-off-the-Land
  Binary (powershell, cmd, wscript, mshta, rundll32, regsvr32, certutil); (3) a file downloaded by a browser
  or mail client being executed within a short window after it is written to disk; (4) browser/mail child
  processes executing from non-standard, user-writable directories (%APPDATA%, %TEMP%, Downloads, Public,
  /tmp, ~/.cache); and (5) browser- or document-reader-spawned processes establishing outbound connections
  to non-allowlisted destinations or exhibiting C2 beaconing characteristics. Detection methods combine
  symbolic-logic rules, statistical baselining/outlier and failure-rate profiling, and machine-learning
  models (URL classifiers, provenance-graph rarity, time-series spike models, DBSCAN clustering, and LSTM
  flow autoencoders) applied to Zeek (http.log, dns.log, conn.log, files.log), Windows Security Event
  ID 4688, Sysmon (Event IDs 1, 3, 11), and auditd/macOS telemetry, so the analyst can corroborate a suspected
  malicious-link click across URL reputation, process lineage, download-to-execute timing, execution path,
  and egress/beaconing context.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
