    evidence focuses on the condition that an endpoint initiates a network connection to a domain or IP
    address on a threat intelligence blocklist, or a requested URL exhibits anomalous lexical characteristics.
    This Statistical Method approach looks for the following signal: From Zeek http.log compute per-URL
    lexical metrics — Shannon entropy, length, numeric/alpha ratio, subdomain depth, unique-character
    count — baseline per host, and flag values above the 95th percentile (or >3σ), the stateless lexical
    approach validated in [Real-Time Detection of DNS Exfiltration and Tunneling](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).
    Track domain prevalence/age and short-lived-domain rate (EXPOSURE-style time/TTL features, [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf))
    so newly-seen destinations are weighted higher. A positive result -- a rule match, statistical outlier,
    or model alert -- suggests a user clicked a malicious link and the resulting browser/mail/document
    process reached attacker infrastructure or executed attacker-controlled code; pivot to the responsible
    user and host, the clicked URL/domain and its reputation, the parent application and its child processes,
    any downloaded files and their execution, and subsequent outbound connections for beaconing. A negative
    result helps rule out this malicious-link vector for the inspected window but should be corroborated
    with the other questions in this playbook, since any single method can miss stealthy, low-and-slow,
    or living-off-the-land click-to-execution chains.'
