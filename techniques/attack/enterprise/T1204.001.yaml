questions:
- question: '[Execution] Match clicked domains to TI: Can you determine whether an endpoint initiates
    a network connection to a domain or IP address on a threat intelligence blocklist, or a requested
    URL exhibits anomalous lexical characteristics. -- specifically, using the ''Match clicked domains
    to TI'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary relies on a user clicking
    a malicious link to gain code execution -- usually as follow-on behavior from a spearphishing link,
    a browser/application exploit, or a drive-by download -- leaving traces across URL/DNS reputation,
    process lineage, file-write/execution timing, execution path, and outbound-connection telemetry. This
    evidence focuses on the condition that an endpoint initiates a network connection to a domain or IP
    address on a threat intelligence blocklist, or a requested URL exhibits anomalous lexical characteristics.
    This Symbolic Logic approach looks for the following signal: Correlate Zeek dns.log domains and conn.log
    IPs against TI blocklists AND apply edit-distance (Levenshtein/Damerau-Levenshtein <=2) lookalike
    rules versus a protected brand/partner domain list per [The Landscape of Domain Name Typosquatting](https://arxiv.org/abs/1603.02767);
    alert on any match, logging host/session for SOC triage. Also flag URL shorteners and uncommon TLDs
    as deterministic enrichment. A positive result -- a rule match, statistical outlier, or model alert
    -- suggests a user clicked a malicious link and the resulting browser/mail/document process reached
    attacker infrastructure or executed attacker-controlled code; pivot to the responsible user and host,
    the clicked URL/domain and its reputation, the parent application and its child processes, any downloaded
    files and their execution, and subsequent outbound connections for beaconing. A negative result helps
    rule out this malicious-link vector for the inspected window but should be corroborated with the other
    questions in this playbook, since any single method can miss stealthy, low-and-slow, or living-off-the-land
    click-to-execution chains.'
  answer_sources: &id001
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Enterprise Web Gateway, DNS Resolvers, Firewall Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match clicked domains to TI

      source IN [Zeek http.log, Zeek conn.log, Zeek dns.log]

      | WHERE matches_action_criteria("Match clicked domains to TI")

      // Correlate Zeek dns.log domains and conn.log IPs against TI blocklists AND apply edit-distance
      (Levenshtein/Damerau-Leven

      | ALERT enrich(host, user, url, domain, process, parent, file, dest)'
  - technology: Zeek/pseudocode
    query: '# Malicious-link network correlation

      http.log, dns.log, conn.log, files.log

      | JOIN clicked URL/domain to host outbound flows on (id.orig_h, time-window)

      | AGG url-lexicon, TI-match, dest rarity, NXDOMAIN/4xx, JA3, beacon-cadence per (id.orig_h)

      | flag TI hits / anomalous URLs / rare-egress per action criteria'
- question: '[Execution] Alert on anomalous URL lexicons: Can you determine whether an endpoint initiates
    a network connection to a domain or IP address on a threat intelligence blocklist, or a requested
    URL exhibits anomalous lexical characteristics. -- specifically, using the ''Alert on anomalous URL
    lexicons'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary relies on a user clicking
