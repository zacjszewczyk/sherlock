questions:
- question: 'Using deterministic rule logic, can you determine whether ''Correlate suspicious XSL script
    executions with known malicious endpoints'' reveals an adversary evading defenses by executing malicious
    scripts embedded in XSL files (Stealth tactic)? Specifically: Join process creation logs (Sysmon Event
    ID 1 or Windows Event ID 4688) for `wmic.exe`/`msxsl.exe` with outbound connection logs (Sysmon Event
    ID 3, Zeek conn.log) and Zeek http/dns logs to alert when these binaries contact destinations on high-confidence
    threat-intel feeds (malware C2 / malicious script hosting). Per [LOLBAS wmic.exe](https://lolbas-project.github.io/lolbas/Binaries/Wmic/)
    and [LOLBAS msxsl.exe](https://lolbas-project.github.io/lolbas/OtherMSBinaries/Msxsl/), either binary
    making ANY outbound connection is inherently suspicious; treat a TI hit as critical. Because these
    are trusted LOLBins, anchor on behavior not the binary ([Red Canary LOLBins](https://redcanary.com/blog/blog/lolbins-abuse/)).'
  context: 'Tactic context (Stealth): The adversary is trying to hide and conceal their actions, appearing
    as normal behavior. Adversaries abuse XSL script processing to proxy-execute malicious JScript/VBScript
    through trusted, signed Windows binaries (msxsl.exe and wmic.exe via the /FORMAT switch, the "Squiblytwo"
    variation), bypassing application control while blending into normal system activity. Evidence under
    investigation: The wmic.exe or msxsl.exe process initiates an outbound network connection to a remote
    IP address, domain, or URL that is present on a high-confidence threat intelligence feed of known
    malicious hosts. Approach (Correlate suspicious XSL script executions with known malicious endpoints):
    Join process creation logs (Sysmon Event ID 1 or Windows Event ID 4688) for `wmic.exe`/`msxsl.exe`
    with outbound connection logs (Sysmon Event ID 3, Zeek conn.log) and Zeek http/dns logs to alert when
    these binaries contact destinations on high-confidence threat-intel feeds (malware C2 / malicious
    script hosting). Per [LOLBAS wmic.exe](https://lolbas-project.github.io/lolbas/Binaries/Wmic/) and
    [LOLBAS msxsl.exe](https://lolbas-project.github.io/lolbas/OtherMSBinaries/Msxsl/), either binary
    making ANY outbound connection is inherently suspicious; treat a TI hit as critical. Because these
    are trusted LOLBins, anchor on behavior not the binary ([Red Canary LOLBins](https://redcanary.com/blog/blog/lolbins-abuse/)).
    A positive result indicates XSL script processing behaving inconsistently with the rare, narrow set
    of legitimate uses for msxsl.exe/wmic.exe and warrants escalation; a negative result means the observed
    activity matches the established benign baseline. Investigate the named area of interest (Network
    perimeter firewalls, outbound web proxies, corporate DNS resolvers, and all Windows workstations and
    servers.) and Pivot from any hit to the parent process, the executing user account and its group membership,
    the host''s role (developer/admin vs. non-IT), the full process lineage and command line, the source
    and integrity of the referenced XSL/XML file, and any outbound connections, dropped binaries, or follow-on
    execution.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 22
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network perimeter firewalls, outbound web proxies, corporate DNS resolvers, and all Windows
    workstations and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic XSL-processing abuse detection\nPROC = EID4688 OR Sysmon1 WHERE image IN\
      \ [msxsl.exe, wmic.exe]\nALERT WHERE cmdline MATCHES /\\/format:/i (normalize windash/abbrev)\n\
      \   OR cmdline MATCHES /:\\/\\/|\\\\\\\\|AppData|\\\\Temp\\\\|ProgramData/\n   OR ext NOT IN [.xml,.xsl]\n\
      \   OR parent IN [winword,excel,powerpnt,outlook,mshta,cscript,wscript]\n   OR image_hash NOT IN\
      \ microsoft_known_good"
  - technology: Zeek/pseudocode
    query: '// Correlate script host to network activity

      conn.log: orig_h IN xsl_exec_hosts, summarize resp_h,resp_p,conn_state,bytes

      dns.log/http.log: rare/NXDOMAIN/404 near msxsl|wmic exec time

      join to threat_intel feeds; flag any outbound from these binaries'
- question: 'Using statistical baselining, can you determine whether ''Flag low-frequency domains and
    failed resolutions from script hosts'' reveals an adversary evading defenses by executing malicious
    scripts embedded in XSL files (Stealth tactic)? Specifically: For every domain contacted by `wmic.exe`/`msxsl.exe`,
    count unique internal hosts that connected to it over the prior 30 days and elevate when the domain
    is in the bottom 1st percentile of popularity, and additionally score domain age and lexical/n-gram
    entropy per [EXPOSURE](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf). Profile
    failure state explicitly: a burst of NXDOMAIN responses or HTTP 404/blocked-connection results tied
    to these binaries (Zeek dns.log/http.log) is a distinct signal of dead/rotating C2 or remote-XSL staging
    and should raise severity ([Red Canary entropy](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/)).'
