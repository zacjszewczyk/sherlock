- question: 'Using a machine-learning model, can you determine whether ''Score script-induced connections
    with an explainable supervised model'' reveals an adversary evading defenses by executing malicious
    scripts embedded in XSL files (Stealth tactic)? Specifically: Train a classifier (Random Forest /
    gradient boosting, analogous to the J48 decision tree in [EXPOSURE](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf))
    on features such as destination IP/domain reputation, JA3/JA3S (Zeek ssl.log), domain n-gram entropy,
    URL query-parameter entropy, bytes-out/bytes-in ratio, and transport port; alternatively embed the
    full command line with [BERT command-line embeddings](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/)
    and score with an outlier detector. Escalate above a high-confidence threshold and surface the top-3
    contributing features (e.g., rare domain, high query entropy, abnormal byte ratio) in the alert text
    for triage.'
