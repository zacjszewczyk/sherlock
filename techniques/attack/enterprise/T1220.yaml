name: 'T1220: XSL Script Processing'
id: 98bdc48c-a863-4248-b360-c5dd0d2e8a30
description: 'This playbook helps an analyst determine whether an adversary is evading defenses by executing
  malicious JScript/VBScript embedded in Extensible Stylesheet Language (XSL) files to proxy-execute code
  and bypass application control (T1220). It focuses on abuse of two trusted, signed Windows binaries:
  msxsl.exe (deprecated, not installed by default, so its mere presence is suspicious) and wmic.exe invoked
  with the /FORMAT switch (the "Squiblytwo" variation). Investigative angles include: msxsl.exe/wmic.exe
  making outbound connections to threat-intel-flagged or rare/low-popularity destinations (EID 4688/Sysmon
  1/3/22 correlated with Zeek conn/dns/http); wmic /FORMAT pointing at remote URLs, UNC paths, or user-writable/temp
  directories; msxsl command lines referencing remote files or non-standard extensions (.jpeg/.txt/.tmp)
  instead of .xml/.xsl; untrusted parents (Office apps, browsers, script interpreters) spawning these
  binaries; and the suspicious-execution-to-C2 chain where a host beacons within five minutes of XSL processing.
  Detection blends symbolic-logic rules (image/IMPHASH matching, /FORMAT and extension regexes, parent-child
  allowlists, TI joins), statistical baselining (rarity percentiles, Shannon entropy of paths, domain
  popularity/age, beaconing inter-arrival variance, failure-state profiling), and machine learning (Isolation
  Forest, Random Forest/gradient boosting, BERT command-line embeddings, KAIROS provenance-graph and Kitsune
  autoencoder anomaly detection) to produce evasion-resistant, explainable alerts.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
