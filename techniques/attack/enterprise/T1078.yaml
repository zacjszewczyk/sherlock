name: "T1078: Valid Accounts"
id: "2848f1e0-99d7-4b0c-afde-e91f7e026842"
description: >-
  Investigate valid-account abuse across initial access, persistence, privilege
  escalation, and defense evasion. This playbook focuses on breached-credential
  use, password spraying, anomalous successful logons, external-to-internal
  pivots, dormant and restricted account misuse, recurring scripted logons,
  privileged-group abuse, explicit credential use from non-approved workstations,
  off-hours access to security tooling, and stealthy non-interactive network
  logons that let an adversary blend into legitimate authentication traffic.
type: "technique"
related:
  - tactic_id: "TA0001"
    tactic_name: "Initial Access"
  - tactic_id: "TA0003"
    tactic_name: "Persistence"
  - tactic_id: "TA0004"
    tactic_name: "Privilege Escalation"
  - tactic_id: "TA0005"
    tactic_name: "Defense Evasion"
contributors:
  - "Zachary Szewczyk"
created: "2026-02-18"
modified: "2026-02-18"
version: "1.0"
tags: "none"
questions:
  - question: "Did a successful remote logon use a username or email that appears in a known breach dataset?"
    context: >-
      Treat a breach-list overlap on a successful remote authentication as a
      high-priority initial-access lead. Confirm the remote login path and retain
      MFA and source-IP context so the analyst can quickly decide whether the
      credentials were likely abused.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4625"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "Threat Intelligence Feeds"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers, Cloud identity providers"
    range: "Last 90 days, prioritizing the current successful remote login."
    queries:
      - technology: "SIEM/threat-intel pseudocode"
        query: |
          remote_success = FILTER Event4624 BY logon_type IN [3,10]
          breach_hit = ENRICH remote_success.user WITH breach_dataset
          ALERT WHERE breach_hit=true

  - question: "Was a successful remote logon preceded by repeated failures for the same user and source, indicating credential stuffing or guessing that finally worked?"
    context: >-
      Failure-to-success sequences are stronger than isolated successes because
      they show the source actively working toward access. Raise priority when
      the account is breach-listed and the source is internet-facing.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4625"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "Threat Intelligence Feeds"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers, Cloud identity providers"
    range: "Last 90 days, with a 15-minute failure-to-success window."
    queries:
      - technology: "SIEM/correlation pseudocode"
        query: |
          failures = FILTER Event4625 BY logon_type IN [3,10]
          success = FILTER Event4624 BY logon_type IN [3,10]
          ALERT WHERE JOIN failures WITH success ON user, src_ip, 15m AND breach_dataset_hit(user)=true

  - question: "Did a successful remote login arrive from a new ASN or country while the user's recent failure rate was already abnormally high?"
    context: >-
      This combines geographic novelty and failure pressure into one suspicious
      story. Analysts should compare the current event to the user's normal ASN,
      country, and pre-authentication failure baseline.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4625"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "Threat Intelligence Feeds"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers, Cloud identity providers"
    range: "Last 90 days, with a rolling 60-minute failure window and historical user baseline."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          baseline = USER_LOGIN_BASELINE(user, geo, asn, failure_rate)
          current = ENRICH current_success WITH geo_asn
          ALERT WHERE current.asn_new=true AND current.country_new=true AND prior_60m_failure_rate > baseline.failure_rate_p95

  - question: "Does a supervised login-risk model classify the successful remote login as likely compromised access?"
    context: >-
      Use machine learning to combine breach membership, device novelty,
      geography, timing, and recent failures into one compromise probability.
      Analysts should inspect the feature attribution before acting.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4625"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "Threat Intelligence Feeds"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers, Cloud identity providers"
    range: "Last 90 days, with scoring on each successful remote login."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          features = EXTRACT(breach_hit, new_geo, new_asn, device_novelty, time_of_day_deviation, recent_failure_count)
          score = compromised_login_model.predict_proba(features)
          ALERT WHERE score >= 0.85

  - question: "Is one source IP failing logons for an unusually large number of distinct accounts in a short period, indicating password spraying?"
    context: >-
      Breadth-first authentication failures across many users are one of the most
      recognizable forms of valid-account initial access. Include Kerberos
      pre-authentication failures to avoid missing non-NTLM variants.
    answer_sources:
      - "Windows Event ID 4625"
      - "Windows Event ID 4771"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers"
    range: "Last 90 days, with 5-minute spray windows."
    queries:
      - technology: "SIEM/rule pseudocode"
        query: |
          burst = GROUP failed_logons BY src_ip, 5m => distinct_users
          ALERT WHERE distinct_users > 20

  - question: "Is a source attempting exactly one failed logon across many users over a longer window, suggesting low-and-slow spraying?"
    context: >-
      Low-and-slow spraying intentionally avoids obvious bursts. Analysts should
      look for one-password-per-user behavior over an hour rather than only for
      dense failure spikes.
    answer_sources:
      - "Windows Event ID 4625"
      - "Windows Event ID 4771"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers"
    range: "Last 90 days, with 60-minute windows."
    queries:
      - technology: "SIEM/rule pseudocode"
        query: |
          spray = GROUP failed_logons BY src_ip, 60m => distinct_users, attempts_per_user
          ALERT WHERE distinct_users >= 30 AND attempts_per_user ~= 1

  - question: "Does a source IP have a statistically abnormal ratio of distinct usernames to failed attempts?"
    context: >-
      Password spraying tends to maximize username diversity relative to total
      attempts. Comparing that ratio against the environment baseline is a more
      robust way to spot breadth-first guessing.
    answer_sources:
      - "Windows Event ID 4625"
      - "Windows Event ID 4771"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers"
    range: "Last 90 days, with rolling 10-minute windows and long-term baseline comparison."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          ratio = GROUP failed_logons BY src_ip, 10m => distinct_users / total_attempts
          ALERT WHERE ratio > long_term_ratio_p99

  - question: "Do clustered authentication failures reveal coordinated spray behavior that does not exactly match a static threshold?"
    context: >-
      Clustering can surface coordinated failure campaigns that spread across
      time or slightly vary their rate. Analysts should review cluster density,
      burstiness, and account spread together.
    answer_sources:
      - "Windows Event ID 4625"
      - "Windows Event ID 4771"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers"
    range: "Last 90 days, with clustering over the incident period."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          features = EXTRACT(src_ip, timestamp, distinct_user_count, burstiness)
          clusters = DBSCAN(features)
          ALERT WHERE cluster_density >= threshold AND user_spread_high=true

  - question: "Do sequential successful logins for the same user imply impossible travel between their geolocated source IPs?"
    context: >-
      Impossible travel remains a strong deterministic signal for stolen valid
      accounts when the telemetry quality is good. Analysts should verify the
      order, geolocation, and travel speed between the two authentications.
    answer_sources:
      - "Windows Event ID 4624"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "VPN authentication logs"
      - "Okta System Log"
      - "NAI: Domain Controllers, VPN Concentrators, Cloud identity providers, User workstations"
    range: "Last 90 days, comparing adjacent successful logons."
    queries:
      - technology: "SIEM/rule pseudocode"
        query: |
          seq = ORDER successful_logons BY user, time
          velocity = GEO_VELOCITY(seq.prev_ip, seq.curr_ip, seq.delta_t)
          ALERT WHERE velocity > 600mph

  - question: "Did a successful login occur from both a first-seen device and a first-seen country outside the user's normal working hours?"
    context: >-
      Combining multiple novelty dimensions gives a more defensible indicator
      than any single unusual attribute. Analysts should compare device, country,
      and hour against the user's established baseline.
    answer_sources:
      - "Windows Event ID 4624"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "VPN authentication logs"
      - "Okta System Log"
      - "NAI: Domain Controllers, VPN Concentrators, Cloud identity providers, User workstations"
    range: "Last 90 days, using a per-user historical baseline."
    queries:
      - technology: "SIEM/rule pseudocode"
        query: |
          profile = USER_PROFILE(user, devices, countries, working_hours)
          ALERT WHERE device_first_seen=true AND country_first_seen=true AND outside_working_hours=true

  - question: "Does the login exceed the user's weighted deviation score for time, country, and device behavior?"
    context: >-
      Weighted deviation scoring helps analysts quantify how unusual a logon is
      instead of relying on one binary condition. Preserve the component scores
      so the analyst can see which dimensions drove the alert.
    answer_sources:
      - "Windows Event ID 4624"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "VPN authentication logs"
      - "Okta System Log"
      - "NAI: Domain Controllers, VPN Concentrators, Cloud identity providers, User workstations"
    range: "Last 90 days, with a rolling user baseline."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          score = WEIGHTED_DEVIATION(login_hour, day_of_week, country, device_fingerprint)
          ALERT WHERE score > user_risk_p99

  - question: "Does an anomaly model on user login features score this successful login as compromised-account activity?"
    context: >-
      Isolation-based anomaly scoring is useful as a secondary layer beneath hard
      rules and graph analytics. Analysts should inspect the top anomalous login
      features before escalating.
    answer_sources:
      - "Windows Event ID 4624"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "VPN authentication logs"
      - "Okta System Log"
      - "NAI: Domain Controllers, VPN Concentrators, Cloud identity providers, User workstations"
    range: "Last 90 days, with scoring on each successful login."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          features = EXTRACT(geo, device, hour, asn)
          score = isolation_forest.score(features)
          ALERT WHERE score >= anomaly_threshold

  - question: "Did a user access an internal system for the first time shortly after an external remote login?"
    context: >-
      This pattern suggests the adversary gained access externally and then began
      moving inside using the same valid account. Analysts should preserve the
      external login, the first internal destination, and the time delta.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4648"
      - "Zeek conn.log"
      - "VPN authentication logs"
      - "Okta System Log"
      - "NAI: VPN Concentrators, Domain Controllers, Critical application servers, Internal network segments"
    range: "Last 90 days, using a 30-minute external-to-internal pivot window."
    queries:
      - technology: "SIEM/correlation pseudocode"
        query: |
          ext = FILTER external_auth BY success=true
          internal = FILTER internal_auth BY success=true
          ALERT WHERE JOIN ext WITH internal ON user, 30m AND first_seen_host_for_user=true

  - question: "Did the user create a brand-new authentication edge to an internal host shortly after external access?"
    context: >-
      A new user-to-host edge shortly after remote entry is a practical way to
      spot foothold expansion. Analysts should compare the edge to historical
      authentication graph data.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4648"
      - "Zeek conn.log"
      - "VPN authentication logs"
      - "Okta System Log"
      - "NAI: VPN Concentrators, Domain Controllers, Critical application servers, Internal network segments"
    range: "Last 90 days, with a 60-minute post-external-login window."
    queries:
      - technology: "SIEM/graph pseudocode"
        query: |
          graph = HISTORICAL_USER_HOST_GRAPH()
          ALERT WHERE external_login=true AND NEW_EDGE(user, internal_host)=true WITHIN 60m

  - question: "Was the time between external access and first internal access unusually short for this user and destination?"
    context: >-
      Extremely short pivot timing can indicate scripted or operator-driven
      movement rather than ordinary human behavior. Compare the current timing to
      the user's normal post-VPN or remote-access pattern.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4648"
      - "Zeek conn.log"
      - "VPN authentication logs"
      - "Okta System Log"
      - "NAI: VPN Concentrators, Domain Controllers, Critical application servers, Internal network segments"
    range: "Last 90 days, with per-user timing baselines."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          delta = TIME_TO_FIRST_INTERNAL_HOST(user, session)
          ALERT WHERE delta < user_delta_p1 AND destination_unseen_90d=true

  - question: "Did the user fan out to an unusually large number of internal hosts soon after external access?"
    context: >-
      High fan-out immediately after remote entry is often the first sign of
      post-compromise exploration. Analysts should note both the host count and
      how many of those destinations are first-seen for the user.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4648"
      - "Zeek conn.log"
      - "VPN authentication logs"
      - "Okta System Log"
      - "NAI: VPN Concentrators, Domain Controllers, Critical application servers, Internal network segments"
    range: "Last 90 days, using a 60-minute post-external-login window."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          fanout = COUNT_DISTINCT_INTERNAL_HOSTS(user, 60m_after_external_login)
          ALERT WHERE fanout > user_fanout_p99 AND first_seen_host_ratio > 0.5

  - question: "Does graph-path anomaly detection identify the external-login-to-internal-host sequence as unusually suspicious?"
    context: >-
      Graph sequence modeling helps analysts detect rare transition paths even
      when no single hop is individually extreme. Preserve the full path so the
      next hosts and accounts can be scoped quickly.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4648"
      - "Zeek conn.log"
      - "VPN authentication logs"
      - "Okta System Log"
      - "NAI: VPN Concentrators, Domain Controllers, Critical application servers, Internal network segments"
    range: "Last 90 days, with graph scoring on the observed login path."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          path = BUILD_LOGIN_PATH(external_login, internal_logons)
          score = graph_path_model.score(path)
          ALERT WHERE score >= anomaly_threshold

  - question: "Did a dormant account authenticate successfully to an exposed or sensitive service?"
    context: >-
      Accounts with no recent successful activity should not suddenly return
      without a business explanation. Analysts should verify the dormancy period,
      the target service, and whether the access matches the account's role.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4625"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "Threat Intelligence Feeds"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers, Cloud identity providers"
    range: "Last 90 days, prioritizing the current successful dormant-account use."
    queries:
      - technology: "SIEM/rule pseudocode"
        query: |
          dormant = LOOKUP accounts WITH no_successful_logins_over_90d
          ALERT WHERE success_login.user IN dormant

  - question: "Did a restricted service account perform an interactive authentication that its role should not allow?"
    context: >-
      Service accounts are often abused because they attract less scrutiny than
      human users. Analysts should compare the logon type and source host to the
      account's intended, non-interactive use.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4625"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "Threat Intelligence Feeds"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers, Cloud identity providers"
    range: "Last 90 days, with immediate triage on interactive service-account logons."
    queries:
      - technology: "SIEM/rule pseudocode"
        query: |
          ALERT FROM auth_logs
          WHERE user IN restricted_service_accounts AND logon_type IN [2,10]

  - question: "Did a non-administrative account execute reconnaissance or evasion-style commands after authenticating successfully?"
    context: >-
      Post-authentication command behavior can reveal that the valid account is
      being used offensively rather than for ordinary work. Analysts should tie
      the unusual commands back to the same account and session context.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4625"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "Threat Intelligence Feeds"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers, Cloud identity providers"
    range: "Last 90 days, correlating command activity in the same session window."
    queries:
      - technology: "SIEM/correlation pseudocode"
        query: |
          auth = FILTER successful_logons BY user NOT IN admin_accounts
          cmds = FILTER process_or_command_logs BY recon_or_evasion_patterns=true
          ALERT WHERE JOIN auth WITH cmds ON user, host, 30m

  - question: "Did a partner or federated login fail validation against allowlists or align with threat-intelligence concerns?"
    context: >-
      Third-party or partner access can be abused to gain entry with apparently
      valid credentials. Analysts should validate the partner identity, source,
      expected application, and any intelligence indicators before trusting it.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4625"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "Threat Intelligence Feeds"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers, Cloud identity providers"
    range: "Last 90 days, with focus on current partner-identity events."
    queries:
      - technology: "SIEM/validation pseudocode"
        query: |
          partner = FILTER auth_logs BY identity_type="partner"
          ALERT WHERE partner.source NOT IN approved_partner_sources OR partner.src_ip IN threat_intel

  - question: "Do TF-IDF or rarity-based command models show the account executing command lines that are highly unusual for its peers?"
    context: >-
      Rare command usage can reveal identity abuse even when the account logs in
      successfully. Analysts should review the tokens that made the command rare
      and whether the command occurred shortly after suspicious authentication.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4625"
      - "Zeek conn.log"
      - "Azure AD Sign-In logs"
      - "AWS CloudTrail logs"
      - "Threat Intelligence Feeds"
      - "Okta System Log"
      - "NAI: Externally-facing authentication services (e.g., VPN gateways, OWA, RDP gateways), Domain Controllers, Cloud identity providers"
    range: "Last 90 days, with model scoring on post-authentication command activity."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          text = TOKENIZE(post_login_commands)
          score = rare_command_model.score(text)
          ALERT WHERE score >= anomaly_threshold

  - question: "Did a successful remote login for persistence originate from an IP already known as C2, TOR, or malicious proxy infrastructure?"
    context: >-
      Repeated access from hostile infrastructure indicates the adversary may be
      maintaining access rather than merely gaining it once. Analysts should
      validate the source against curated intelligence and preserve the affected
      gateway or endpoint.
    answer_sources:
      - "Windows Event ID 4624"
      - "Zeek conn.log"
      - "VPN authentication logs"
      - "RADIUS logs"
      - "Threat Intelligence Feeds"
      - "Azure AD Sign-In logs"
      - "Okta System Log"
      - "NAI: VPN Concentrators, RDP Gateways, Firewall and proxy servers, Network egress points"
    range: "Last 90 days, prioritizing the most recent successful remote sessions."
    queries:
      - technology: "SIEM/threat-intel pseudocode"
        query: |
          success = FILTER Event4624 BY logon_type IN [3,10]
          ALERT WHERE ENRICH(success.src_ip, threat_intel).category IN ["C2","TOR","malicious_proxy"]

  - question: "Can the hostile source IP be corroborated in network telemetry reaching the same authentication endpoint?"
    context: >-
      Dual-source validation reduces false positives from stale or noisy threat
      intelligence. Analysts should confirm that the same IP was actually seen in
      connection logs to the same service near the authentication event.
    answer_sources:
      - "Windows Event ID 4624"
      - "Zeek conn.log"
      - "VPN authentication logs"
      - "RADIUS logs"
      - "Threat Intelligence Feeds"
      - "Azure AD Sign-In logs"
      - "Okta System Log"
      - "NAI: VPN Concentrators, RDP Gateways, Firewall and proxy servers, Network egress points"
    range: "Last 90 days, with 5-minute cross-log correlation."
    queries:
      - technology: "SIEM/correlation pseudocode"
        query: |
          auth = FILTER successful_remote_logons BY src_ip IN threat_intel
          net = FILTER Zeek_conn BY src_ip = auth.src_ip AND dest = auth.target
          ALERT WHERE JOIN auth WITH net ON 5m

  - question: "Is the source ASN or country for a successful persistence logon statistically rare for the environment?"
    context: >-
      Persistent remote access often reuses infrastructure that is uncommon for
      the organization. Analysts should compare the successful source ASN and
      country to environment-wide success baselines.
    answer_sources:
      - "Windows Event ID 4624"
      - "Zeek conn.log"
      - "VPN authentication logs"
      - "RADIUS logs"
      - "Threat Intelligence Feeds"
      - "Azure AD Sign-In logs"
      - "Okta System Log"
      - "NAI: VPN Concentrators, RDP Gateways, Firewall and proxy servers, Network egress points"
    range: "Last 90 days, with per-ASN success baselines."
    queries:
      - technology: "Statistical analysis pseudocode"
        query: |
          enriched = ENRICH successful_remote_logons WITH asn, country
          ALERT WHERE asn_success_rate < env_asn_success_p5

  - question: "Does an IP-reputation or new-edge model score the successful persistence logon as malicious infrastructure use?"
    context: >-
      Model-based scoring is useful when the source is suspicious but not an
      exact intelligence hit. Analysts should review both the reputation score
      and whether the source-to-host edge is historically new.
    answer_sources:
      - "Windows Event ID 4624"
      - "Zeek conn.log"
      - "VPN authentication logs"
      - "RADIUS logs"
      - "Threat Intelligence Feeds"
      - "Azure AD Sign-In logs"
      - "Okta System Log"
      - "NAI: VPN Concentrators, RDP Gateways, Firewall and proxy servers, Network egress points"
    range: "Last 90 days, with scoring on each successful remote login."
    queries:
      - technology: "ML pipeline pseudocode"
        query: |
          score = ip_reputation_model.score(src_ip)
          new_edge = NEW_AUTH_EDGE(src_ip, target_host)
          ALERT WHERE score >= high_confidence OR new_edge=true

  - question: "Is the same user-source pair reauthenticating at a fixed interval over multiple cycles, suggesting scripted persistence?"
    context: >-
      Periodic reauthentication is hard for human users to reproduce and often
      reveals automation maintaining access. Analysts should verify the interval,
      the host pair, and the number of repeated cycles.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4634"
      - "Zeek conn.log"
      - "VPN session logs"
      - "Azure AD Sign-In logs"
      - "Okta System Log"
      - "NAI: User workstations, Jump servers, VPN concentrators, Internal network segments"
    range: "Last 90 days, with 24-hour cycle checks."
    queries:
      - technology: "SIEM/rule pseudocode"
        query: |
          sessions = BUILD_SESSIONS(user, src_ip, dest_host)
          ALERT WHERE interval ~= 60m +/- 5m AND cycles >= 6 WITHIN 24h

  - question: "Are repeated remote sessions showing nearly identical durations that indicate automated reconnect behavior?"
    context: >-
      Highly consistent session durations from the same source over multiple days
      are often more machine-like than human. Analysts should inspect both the
      interval and the duration regularity together.
    answer_sources:
      - "Windows Event ID 4624"
      - "Windows Event ID 4634"
      - "Zeek conn.log"
      - "VPN session logs"
