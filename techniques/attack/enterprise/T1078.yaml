  context: 'A single source IP address generates a high volume of failed authentication events (Logon
    Type 3 or 10) across numerous distinct user accounts within a short time frame, indicative of a password
    spraying attack. This question supports the Initial Access information requirement: "Has the adversary
    gained initial access using valid accounts?" Adversaries abusing valid accounts deliberately blend
    into legitimate authentication, so this evidence helps separate hostile credential reuse from normal
    activity. Approach (Symbolic Logic): Trigger when a single source IP produces failed logons (Windows
