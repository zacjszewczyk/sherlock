questions:
- question: 'For Initial Access via valid accounts, does available telemetry support the ''Breached-account
    remote-login match'' detection — that is, can you find activity matching this logic: For each successful
    remote login (Windows Event ID 4624 with Logon Type 3 or 10), join the username/email against the
    breach intelligence feed and confirm the source IP via Zeek conn.log; alert on any exact match and
    include MFA status from IdP logs in the alert context?'
  context: 'A successful remote authentication (Logon Type 3 or 10) occurs using a username known to be
    part of a public or private credential breach dataset, indicating the adversary leveraged exposed
    credentials for initial access. This question supports the Initial Access information requirement:
    "Has the adversary gained initial access using valid accounts?" Adversaries abusing valid accounts
    deliberately blend into legitimate authentication, so this evidence helps separate hostile credential
    reuse from normal activity. Approach (Symbolic Logic): For each successful remote login (Windows Event
    ID 4624 with Logon Type 3 or 10), join the username/email against the breach intelligence feed and
    confirm the source IP via Zeek conn.log; alert on any exact match and include MFA status from IdP
    logs in the alert context. Privacy-preserving breach matching at scale is validated by Thomas et al.
    using private set intersection with k-anonymity across 4 billion breach records [Protecting accounts
    from credential stuffing with password breach alerting, USENIX Security 2019](https://www.usenix.org/conference/usenixsecurity19/presentation/thomas).
    This is a deterministic, rule-based detection. Because it fires only when explicit, corroborated conditions
    are met, a positive result is high-confidence and warrants immediate triage; a negative result lowers
    but does not eliminate suspicion of stealthier credential abuse.'
