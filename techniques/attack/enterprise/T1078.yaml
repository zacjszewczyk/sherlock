    to blend into legitimate activity. This question supports the Stealth information requirement: "Is
    the adversary using valid accounts to maintain stealth?" Adversaries abusing valid accounts deliberately
    blend into legitimate authentication, so this evidence helps separate hostile credential reuse from
    normal activity. Approach (Symbolic Logic): Alert when a user generates more than N Logon Type 3 events
    to distinct hosts within 30 minutes without a corresponding Logon Type 2 or 10 on those hosts in the
    same window. Tune N based on environment; start at 10 for non-admin users and 25 for administrators.
    This catches the volume ‘physics’: accessing multiple hosts silently still requires generating authentication
    events. This is a deterministic, rule-based detection. Because it fires only when explicit, corroborated
    conditions are met, a positive result is high-confidence and warrants immediate triage; a negative
    result lowers but does not eliminate suspicion of stealthier credential abuse.'
