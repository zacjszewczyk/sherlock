- question: 'For Initial Access via valid accounts, does available telemetry support the ''Novel-ASN breached-account
    baseline'' detection — that is, can you find activity matching this logic: Maintain per-user baselines
    for remote login geolocation, ASN, and recent failure rate?'
  context: 'A successful remote authentication (Logon Type 3 or 10) occurs using a username known to be
    part of a public or private credential breach dataset, indicating the adversary leveraged exposed
    credentials for initial access. This question supports the Initial Access information requirement:
    "Has the adversary gained initial access using valid accounts?" Adversaries abusing valid accounts
    deliberately blend into legitimate authentication, so this evidence helps separate hostile credential
    reuse from normal activity. Approach (Statistical Method): Maintain per-user baselines for remote
    login geolocation, ASN, and recent failure rate. Flag events when a successful login comes from a
    new ASN/country and the preceding 60-minute failure rate exceeds the user’s 95th-percentile baseline.
    Metelli and Heard demonstrated Bayesian agglomerative clustering with Cox proportional hazards models
    for detecting new-edge authentication anomalies with calibrated p-values [On Bayesian New Edge Prediction
    and Anomaly Detection in Computer Networks, Annals of Applied Statistics 13(4), 2019](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf).
    This is a baseline-and-deviation detection. It compares observed activity against a per-user, per-account,
    or environment-wide historical baseline and flags statistically rare values, so weigh the deviation
    magnitude and confirm the baseline is representative before escalating.'
