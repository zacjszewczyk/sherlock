- question: 'For Initial Access via valid accounts, does available telemetry support the ''Breached-credential
    compromise model'' detection — that is, can you find activity matching this logic: Train a supervised
    classifier on labeled login events using features such as breach-list membership, new geo/ASN, device
    novelty, time-of-day deviation, and recent failure count; alert when the predicted compromise probability
    exceeds a calibrated threshold (e.g., > 0.85)?'
  context: 'A successful remote authentication (Logon Type 3 or 10) occurs using a username known to be
    part of a public or private credential breach dataset, indicating the adversary leveraged exposed
    credentials for initial access. This question supports the Initial Access information requirement:
    "Has the adversary gained initial access using valid accounts?" Adversaries abusing valid accounts
    deliberately blend into legitimate authentication, so this evidence helps separate hostile credential
    reuse from normal activity. Approach (Machine Learning): Train a supervised classifier on labeled
    login events using features such as breach-list membership, new geo/ASN, device novelty, time-of-day
    deviation, and recent failure count; alert when the predicted compromise probability exceeds a calibrated
    threshold (e.g., > 0.85). Per Tuor et al., online DNN/LSTM models decompose anomaly scores into per-feature
    contributions, enabling explainable triage showing which features (breach membership, geo novelty,
    failure count) drove the alert (Tuor et al., Deep Learning for Unsupervised Insider Threat Detection,
    AAAI Workshop 2017). This is a model-driven detection. Features are extracted from telemetry and scored
    by a trained model, so review the per-feature attribution/explainability for each alert and keep the
    deterministic detections running in parallel as a resilient floor.'
