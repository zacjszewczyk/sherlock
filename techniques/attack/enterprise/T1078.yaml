- tactic_id: TA0001
  tactic_name: Initial Access
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
- tactic_id: TA0005
  tactic_name: Stealth
