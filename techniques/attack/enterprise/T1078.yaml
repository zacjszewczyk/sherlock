name: 'T1078: Valid Accounts'
id: 2848f1e0-99d7-4b0c-afde-e91f7e026842
description: Investigate adversary abuse of valid accounts across initial access, persistence, privilege
  escalation, and stealth. This playbook helps an analyst hunt for breached-credential remote logons,
  password spraying (including low-and-slow variants), multi-anomalous successful logins (impossible travel,
  novel device/country/time), external-to-internal pivots, dormant and restricted/service-account misuse,
  scripted periodic reauthentication, immediate abuse of newly granted privileged-group membership, explicit-credential
  use from non-approved workstations, off-hours access to security tooling, and stealthy non-interactive
  network logons that let an adversary blend into legitimate authentication traffic. It spans Windows,
  Linux, macOS, network device, identity-provider, SaaS, IaaS, and container telemetry to answer whether
  valid accounts are being misused to gain, keep, escalate, or conceal access.
type: technique
