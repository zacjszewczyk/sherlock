questions:
- question: For Initial Access via valid accounts, does the telemetry support 'Breached-account remote-login
    match'? In other words, can you confirm that for each successful remote login (Windows Event ID 4624
    with Logon Type 3 or 10), join the username/email against the breach intelligence feed and confirm
    the source IP via Zeek conn.log; alert on any exact match and include MFA status from IdP logs in
    the alert context?
  context: 'A successful remote authentication (Logon Type 3 or 10) occurs using a username known to be
    part of a public or private credential breach dataset, indicating the adversary leveraged exposed
    credentials for initial access. This question supports the Initial Access mission question: "Has the
    adversary gained initial access using valid accounts?" Adversaries abusing valid accounts deliberately
    blend into legitimate authentication, so this evidence helps distinguish hostile reuse of credentials
    from normal activity. Approach (Symbolic Logic): For each successful remote login (Windows Event ID
    4624 with Logon Type 3 or 10), join the username/email against the breach intelligence feed and confirm
    the source IP via Zeek conn.log; alert on any exact match and include MFA status from IdP logs in
    the alert context. Privacy-preserving breach matching at scale is validated by Thomas et al. using
    private set intersection with k-anonymity across 4 billion breach records Protecting accounts from
    credential stuffing with password breach alerting, USENIX Security 2019. This is a deterministic,
    rule-based check: it fires only when explicit, corroborated conditions are met, so a positive result
    is high-confidence and should be triaged immediately, while a negative result narrows the field but
    does not rule out stealthier behavior.'
