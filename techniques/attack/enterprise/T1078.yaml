    failure) and flag alphabetical username enumeration patterns, per [Password Spray Attacks – Detection
    and Mitigation Strategies, ACSC 2019](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).
