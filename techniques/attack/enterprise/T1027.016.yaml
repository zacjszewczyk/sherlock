name: 'T1027.016: Obfuscated Files or Information: Junk Code Insertion'
id: 2a6a7e7a-6b96-4636-90ba-7fb67ed22e24
description: 'Investigate whether an adversary is concealing malware functionality with junk/dead-code
  insertion (T1027.016) to frustrate static analysis and evade signature-based detection. This playbook
  helps an analyst hunt for the durable static hallmarks of junk code -- long contiguous NOP (0x90) runs
  or repeated no-effect instruction sequences, file size far larger than the functional code requires,
  abnormally high section/whole-file entropy, and a low ratio of meaningful opcodes to total bytes --
  across newly written or executed binaries on Windows, Linux, and macOS. It also pivots to behavioral
  corroboration that survives recompilation even when the file hash changes: known-malicious or YARA junk-code
  hash matches, packer/obfuscator command-line indicators, low-prevalence unsigned files, system-process
  spoofing from user-writable paths, anomalous parent/child process chains, masqueraded binaries, and
  beacon-like or DGA-style network activity from first-seen executables. Detection methods span symbolic-logic
  rules, statistical baselining (entropy, KL divergence, prevalence, Levenshtein, jitter), and machine
  learning (gradient-boosted classifiers, one-class anomaly models, sequence autoencoders, clustering,
  and time-series forecasting), tying each back to the Stealth tactic of blending in with legitimate activity.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
