questions:
- question: Does any newly written or executed binary contain long contiguous runs of NOP (0x90) bytes
    or repeated no-effect instruction sequences, or sections whose meaningful-opcode-to-byte ratio falls
    below your environment's baseline floor?
  context: 'Junk/dead-code insertion is the core, durable signal of T1027.016: adversaries pad real code
    with instructions that never execute or have no effect (most commonly 0x90 NOP sleds) so analysts
    waste time stepping through filler and static signatures miss the real logic. As a Stealth technique
    the goal is to blend in by mutating the binary while preserving behavior. Deploy a YARA-style rule
    on file-write and file-transfer events that fires when a code section holds a contiguous run of >=32
    0x90 NOP bytes (or a repeated no-effect instruction pattern), or when the ratio of meaningful opcodes
    to total bytes in a section drops below a floor derived from a benign-binary corpus. A positive hit
    indicates a likely obfuscated payload worth pulling for deeper analysis; tune the run-length and ratio
    thresholds per platform to control false positives from legitimate alignment padding.'
  answer_sources:
  - WinEventLog:Sysmon EventCode=11
  - Zeek files.log
  - auditd:SYSCALL (write/execve)
  - Windows Defender Event ID 1116
  - 'NAI: User Workstations, File Servers, Network Egress Points, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: YARA/pseudocode
    query: 'rule junk_code_nop_run { strings: $nop = { (90){32,} } condition: $nop or section.opcode_to_byte_ratio
      < BASELINE_FLOOR }'
  - technology: SIEM/Rule pseudocode
    query: 'INDEX=sysmon EventCode=11 OR source=zeek_files OR (auditd syscall IN [write,execve])

      | scan file_bytes for contiguous_0x90_run >= 32 OR meaningful_opcode_ratio < baseline_floor

      | WHERE match=true | ALERT "NOP-sled / junk-code section detected"'
- question: Do any executables have section-level or whole-file Shannon entropy above roughly 7.2 (versus
    the 5.0-6.5 typical of normal code), suggesting packing or encoding that frequently accompanies junk-code
    bloat?
  context: High entropy indicates compressed, encrypted, or otherwise encoded content that often travels
    with junk-code obfuscation, especially when combined with software packing (T1027.002) or compression
    (T1027.015). Compute Shannon entropy per section and for the whole file at write/transfer time and
    flag binaries exceeding a cutoff (~7.2) derived from your own benign distribution rather than a fixed
    magic number. In a Stealth context, elevated entropy is a sign the adversary is hiding the true payload;
    a positive result warrants unpacking and static review, while a negative result (entropy in the normal
    band) makes pure packing less likely though does not rule out lightweight NOP-style junk code, so
    pair this with the NOP-run rule.
  answer_sources:
  - WinEventLog:Sysmon EventCode=11
  - Zeek files.log
  - auditd:SYSCALL (write/execve)
  - Windows Defender Event ID 1116
  - 'NAI: User Workstations, File Servers, Network Egress Points, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=files event IN [sysmon_11, zeek_files, auditd_write]

      | EVAL section_entropy = shannon(section_bytes)

      | WHERE section_entropy > 7.2  /* cutoff from benign distribution */

      | STATS count BY file_hash, path | ALERT "High-entropy section"'
- question: Does a binary's opcode-frequency distribution diverge from your per-architecture benign baseline,
    or is its file-size-to-import-count ratio a statistical outlier consistent with the bloat junk-code
    insertion produces?
  context: Junk-code insertion inflates file size and skews the instruction mix without adding real imports
    or functionality. Build per-architecture opcode-frequency baselines and byte-entropy histograms from
    benign binaries, then alert when a sample's opcode distribution diverges (measured with KL divergence,
    which catches algorithmic byte/string distributions better than raw entropy) or when its file-size-to-import-count
    volume ratio is an outlier. This is tactic-relevant because the adversary is trying to look normal
    while padding the binary; an unusually large file with few imports and a distorted opcode histogram
    is a strong tell. A positive result flags a candidate obfuscated binary; calibrate the divergence
    threshold against the benign corpus to avoid flagging legitimately large statically-linked programs.
  answer_sources:
  - WinEventLog:Sysmon EventCode=11
  - Zeek files.log
  - auditd:SYSCALL (write/execve)
  - Windows Defender Event ID 1116
  - 'NAI: User Workstations, File Servers, Network Egress Points, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each new_binary:\n  kl = KL_divergence(opcode_freq(binary), benign_opcode_baseline[arch])\n\
      \  vol = file_size / max(import_count,1)\n  IF kl > KL_THRESH OR vol > percentile(benign_vol, 99):\
      \ ALERT \"Opcode/size-volume outlier\""
- question: When scored by a gradient-boosted static-feature classifier (LightGBM/XGBoost/Random Forest
    on EMBER-style features), do any binaries exceed a tuned malicious probability (e.g., >0.90), with
    junk-code features such as NOP-run ratio, section entropy, and import sparsity among the top contributors?
  context: Supervised static classifiers generalize across polymorphic variants better than fixed signatures.
    Train LightGBM/XGBoost/Random Forest on EMBER-style static features -- byte-entropy histogram, section
    entropy and sizes, imports, and string statistics -- and alert when predicted maliciousness exceeds
    a tuned threshold (e.g., 0.90). Emit SHAP top-3 features so the analyst sees why it fired (typically
    NOP-run ratio, section entropy, import sparsity), which directly maps to junk-code hallmarks and supports
    the Stealth hunt. A high-confidence positive with junk-code-aligned SHAP features is a strong lead
    for triage; a low score reduces but does not eliminate suspicion, so combine with the symbolic NOP
    rule and entropy checks.
  answer_sources:
  - WinEventLog:Sysmon EventCode=11
  - Zeek files.log
  - auditd:SYSCALL (write/execve)
  - Windows Defender Event ID 1116
  - 'NAI: User Workstations, File Servers, Network Egress Points, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = ember_static_features(binary)\np = gbm_model.predict_proba(features)\nIF p > 0.90:\n\
      \  top3 = shap_top_features(gbm_model, features, k=3)\n  ALERT(\"Static-feature classifier hit\"\
      , prob=p, reasons=top3)"
- question: Do any binaries score as anomalies against a one-class model (Isolation Forest or autoencoder)
    trained only on benign static features, indicating they fall off the benign manifold the way unlabeled
    polymorphic junk-code variants do?
  context: Junk-code variants are polymorphic and largely unlabeled, so supervised models can lag novel
    mutations. Train an Isolation Forest or autoencoder exclusively on benign static features and alert
    on high isolation score or high reconstruction error. This unsupervised approach catches never-before-seen
    obfuscated binaries that simply do not look like known-good software -- exactly the Stealth failure
    mode where an attacker mutates code to evade signatures. A high anomaly score is a triage lead even
    with no matching signature; expect some benign novelty, so corroborate with the NOP-run rule, entropy
    threshold, and prevalence checks before escalating.
  answer_sources:
  - WinEventLog:Sysmon EventCode=11
  - Zeek files.log
  - auditd:SYSCALL (write/execve)
  - Windows Defender Event ID 1116
  - 'NAI: User Workstations, File Servers, Network Egress Points, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = IsolationForest().fit(benign_static_features)  # or autoencoder

      score = model.anomaly_score(binary_features)

      IF score > ANOMALY_THRESH: ALERT "Off benign manifold (possible junk-code variant)"'
- question: Do any newly observed file hashes from process execution or file transfers match a watchlist
    of hashes tagged T1027.016 / Junk Code (or related packing/obfuscation families), or match a YARA
    junk-code static pattern?
  context: Known-bad hash matching is the cheapest high-confidence detection, but junk-code recompilation
    changes hashes, so it must be layered with static YARA. Maintain a watchlist of hashes tagged T1027.016
    or Junk Code, evaluate new hashes seen in Event ID 4688 and Zeek files.log against it, and additionally
    run YARA junk-code signatures (NOP/no-op runs) so polymorphic variants with brand-new hashes are still
    caught. In the Stealth context this catches both reused tooling and mutated reissues. A hash hit is
    an immediate escalation; a YARA-only hit (no hash match) indicates a fresh variant worth deeper analysis.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Windows Defender Event ID 1116
  - 'NAI: Network Egress Points, User Workstations, Email Gateways, File Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'INDEX=proc OR zeek_files

      | LOOKUP hash IN watchlist_T1027_016

      | WHERE matched=true OR yara_junkcode_match=true

      | ALERT "Junk-code hash / YARA indicator hit"'
- question: Are there executable hashes seen on fewer than 5 hosts (or below the 1st prevalence percentile)
    that are also unsigned, and how many files are failing Authenticode/signature verification overall?
  context: Rare + unsigned is a classic profile for bespoke or freshly mutated malware, including junk-code-padded
    droppers that recompile per target. Alert on executable hashes present on fewer than 5 hosts or below
    the 1st prevalence percentile that fail signing, and separately track the count of files failing Authenticode/signature
    verification as a distinct failure-state signal that may indicate tampering or unsigned obfuscated
    payloads. Tactically, attackers relying on Stealth often cannot or will not properly sign mutated
    binaries. A low-prevalence unsigned hit is a strong triage lead; signed, widely-deployed software
    is generally lower risk for this technique.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Windows Defender Event ID 1116
  - 'NAI: Network Egress Points, User Workstations, Email Gateways, File Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=proc | STATS dc(host) AS prevalence BY file_hash, signed

      | WHERE signed=false AND (prevalence < 5 OR prevalence <= percentile_1)

      | ALERT "Low-prevalence unsigned executable"

      /* also: STATS count WHERE authenticode_status=fail */'
- question: When an executable is scored by a reputation model (XGBoost/Random Forest over prevalence,
    static PE/header features, byte-entropy histogram, and path entropy), does it exceed a 0.90 threshold,
    and what are the top-3 contributing features?
  context: A reputation model fuses weak signals (rarity, header anomalies, entropy, suspicious paths)
    into a single risk score that is robust to hash churn from junk-code recompilation. Train XGBoost
    or Random Forest on prevalence, static PE/header features, byte-entropy histogram, and path entropy,
    alert above 0.90, and surface the top-3 contributing features for analyst context. This supports the
    Stealth investigation by ranking first-seen or low-reputation binaries that mimic benign software.
    A high score with entropy/prevalence drivers is a priority lead; calibrate the threshold to your alert
    budget and review SHAP/feature contributions before escalation.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Windows Defender Event ID 1116
  - 'NAI: Network Egress Points, User Workstations, Email Gateways, File Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'feat = [prevalence, pe_header_features, byte_entropy_hist, path_entropy]

      score = reputation_model.predict_proba(feat)

      IF score > 0.90: ALERT("Low reputation executable", reasons=shap_top_features(feat,3))'
- question: Do any process-creation events have a ProcessName or CommandLine matching known packer/obfuscator
    tooling such as upx, themida, vmprotect, or aspack, indicating a binary that may carry dead code to
    frustrate analysis?
  context: Packers and obfuscators are commonly used to wrap junk-code-laden payloads, and their command-line
    invocation is a reliable rule-based indicator. Match ProcessName and CommandLine against a maintained
    list of packer/obfuscator names (upx, themida, vmprotect, aspack, and similar) and alert on hits.
    In the Stealth context, observing such tooling on endpoints -- especially outside developer or build
    systems -- suggests active obfuscation of a payload. A positive on a non-developer host is suspicious;
    on developer/staging endpoints it may be benign, so weight by NAI and corroborate with the static
    junk-code markers.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Developer Endpoints, Staging Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "INDEX=proc EventCode=4688\n| WHERE ProcessName MATCHES /(upx|themida|vmprotect|aspack)/i\n\
      \     OR CommandLine MATCHES /(upx|themida|vmprotect|aspack)/i\n| ALERT \"Packer/obfuscator tooling\
      \ invoked\""
- question: Do any process command lines have entropy deviating from the per-process historical or global
    percentile baseline, suggesting algorithmically generated or obfuscated arguments?
  context: Obfuscated loaders and packers often pass encoded or randomized command-line arguments. Baseline
    command-line entropy per process and flag values that deviate from historical or global percentiles,
    preferring KL divergence over raw entropy to catch algorithmic strings. Tactically, abnormally high
    command-line entropy is a sign of attempts to hide intent within otherwise normal-looking process
    invocations. A positive result warrants decoding/inspecting the command line and tracing the parent
    process; benign high-entropy cases (e.g., GUIDs, tokens) exist, so baseline per-process to reduce
    noise.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Developer Endpoints, Staging Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=proc EventCode=4688

      | EVAL cl_entropy = shannon(CommandLine)

      | EVENTSTATS p99(cl_entropy) AS thr BY ProcessName

      | WHERE cl_entropy > thr  /* or KL_divergence vs per-process baseline */

      | ALERT "Anomalous command-line entropy"'
- question: When command-line and static-structure features are clustered (DBSCAN/OPTICS), do any small
    or outlier clusters emerge that merit review, and do opcode/API n-gram models corroborate malicious
    behavior despite inserted dead code?
  context: Unsupervised clustering surfaces rare command/structure patterns that rules miss. Cluster command-line
    and static-structure features with DBSCAN or OPTICS, mark small or outlier clusters for analyst review,
    and corroborate with opcode/API n-gram models whose behavioral signal persists even when dead code
    is inserted. This aligns with the Stealth hunt because polymorphic junk code changes surface features
    while behavior clusters remain detectable. A point in a tiny/outlier cluster is a lead; n-gram corroboration
    raises confidence, while a large dense cluster of known-good patterns lowers it.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Developer Endpoints, Staging Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = features(commandlines + static_structure)\nlabels = DBSCAN(eps, min_samples).fit_predict(X)\
      \  # or OPTICS\nFOR cluster IN small_or_outlier_clusters(labels):\n  IF opcode_api_ngram_model.flags(cluster):\
      \ ALERT \"Anomalous command cluster\""
- question: Are non-service parent processes spawning system processes outside System32 that then establish
    a successful outbound connection to known C2 infrastructure within 60 seconds?
  context: Polymorphic loaders frequently launch standard-looking child processes that beacon out shortly
    after creation. Alert when a non-service parent spawns a system process outside System32 and a successful
    outbound connection to a C2 IP follows within 60 seconds; require state corroboration that the connection
    actually succeeded (Event ID 5156 allowed, established conn.log flow) rather than a blocked or failed
    attempt, which reduces false positives. In the Stealth context, the adversary disguises the loader
    as a normal system process; the tight process-to-network correlation is the tell. A confirmed sequence
    is high-fidelity and should be escalated with host and netflow context.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Domain Controllers, User Workstations, Internal Web Servers, Application Servers'
  range: Last 90 days; correlate within a 60-second window around each process-creation event
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'INDEX=proc EventCode=4688 WHERE parent NOT IN service_processes AND child_is_system_name AND
      child_path != "\System32\"

      | JOIN host WITHIN 60s [INDEX=net (5156 OR zeek_conn) WHERE dest IN c2_list AND conn_state=established]

      | ALERT "System-process loader -> C2 within 60s"'
- question: Are any parent process paths in the bottom 1 percent of observed paths or located in high-risk
    directories such as %TEMP% and other user-writable locations, and how many blocked connections originate
    from such parents?
  context: Loaders that carry junk code commonly run from temp or user-writable directories rather than
    legitimate install paths. Baseline parent-process paths and flag those in the bottom 1 percent of
    prevalence or in high-risk directories (%TEMP%, AppData, user profile, /tmp), and profile the count
    of blocked connections from such parents as a distinct failure-state signal of thwarted C2. Tactically
    this catches the Stealth pattern of running disguised binaries from non-standard locations. A rare
    parent path in %TEMP% spawning network-active children is suspicious; correlate with the process-to-C2
    rule and static markers to confirm.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Domain Controllers, User Workstations, Internal Web Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=proc EventCode=4688 | STATS count BY parent_path

      | WHERE parent_path IN risky_dirs(%TEMP%,AppData,/tmp) OR prevalence <= percentile_1

      | ALERT "Risky parent path"

      /* failure signal: STATS count WHERE 5156 action=blocked BY parent_path */'
- question: Does an LSTM autoencoder over parent/child/network/file event sequences produce high reconstruction
    error for any host activity chain, indicating an anomalous execution-to-network sequence?
  context: Junk-code loaders may evade per-event rules but still produce unusual event sequences. Train
    an LSTM autoencoder on sequences of parent, child, network, and file events and alert on high reconstruction
    error, surfacing the top contributing events for the analyst. This is valuable for the Stealth hunt
    because the obfuscated binary's individual events look normal while the ordering and combination do
    not. A high reconstruction error is a lead to reconstruct the full chain; expect occasional benign
    novelty, so review the contributing events and corroborate with the deterministic correlation rule
    before escalating.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Domain Controllers, User Workstations, Internal Web Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = order_events(proc_create, net_conn, file_ops) BY host, time

      err = lstm_autoencoder.reconstruction_error(seq)

      IF err > THRESH: ALERT("Anomalous event chain", top_events=contributors(seq))'
- question: Are critical system process names executing outside the authorized System32 allowlist, particularly
    when the binary also shows junk-code static markers such as size bloat or NOP runs?
  context: A binary named like svchost.exe, lsass.exe, or services.exe running from anywhere other than
    the approved System32 location is a strong masquerade indicator and a common pattern for polymorphic
    droppers. Maintain an allowlist of authorized paths for critical system names and alert when those
    names execute elsewhere, escalating confidence when the file also exhibits junk-code static markers
    (size bloat, NOP runs). In the Stealth context the adversary borrows a trusted name to blend in; the
    path mismatch breaks the disguise. A critical name outside System32 is high-fidelity and should be
    escalated, especially with corroborating static markers.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Public-facing Servers, Shared Network Drives'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "INDEX=proc EventCode=4688\n| WHERE NewProcessName_basename IN critical_system_names\n    \
      \ AND NewProcessName_dir NOT IN system32_allowlist\n| ALERT \"Critical system name outside System32\
      \ (masquerade)\""
- question: Are there processes whose names are a small Levenshtein distance from critical system binaries
    (typosquatting) and/or that execute from rare paths, after applying outlier-resilient structural summaries
    to resist obfuscation noise?
  context: Adversaries name droppers to closely resemble legitimate binaries (e.g., scvhost.exe, lsasss.exe)
    and run them from uncommon paths. Flag processes within a small Levenshtein distance of critical binary
    names and those executing from rare paths, and use outlier-resilient structural summaries (L-moments)
    to resist the noise injected by junk code. Tactically this catches the Stealth tactic of near-name
    impersonation. A close-but-not-exact name from a rare path is a strong lead; tune the distance threshold
    to avoid catching legitimate similarly-named utilities and corroborate with the System32 allowlist
    check.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Public-facing Servers, Shared Network Drives'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=proc EventCode=4688

      | EVAL d = min_levenshtein(name, critical_system_names)

      | EVAL path_rarity = 1 - prevalence(path)

      | WHERE (d BETWEEN 1 AND 2) OR path_rarity > 0.99

      | ALERT "Near-name impersonation / rare path"'
- question: When executions are scored by a classifier (Logistic Regression/Random Forest over path, name
    length, parent, user, System32 presence, and static-file features), which are flagged as masqueraded,
    and what top-3 features drove the decision?
  context: A supervised model combines many masquerade signals into one decision that is harder to evade
    than any single rule. Score executions with Logistic Regression or Random Forest using features such
    as path, name length, parent process, user, System32 presence, and static-file features, emitting
    the top-3 contributing features in the alert. This supports the Stealth hunt by ranking likely masqueraded
    loaders that carry junk code. A high-confidence flag with path/System32/static drivers is a triage
    lead; review the contributing features and corroborate with the allowlist and Levenshtein checks before
    escalation.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Public-facing Servers, Shared Network Drives'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'feat = [path, name_len, parent, user, in_system32, static_file_features]

      p = masquerade_model.predict_proba(feat)

      IF p > THRESH: ALERT("Masqueraded execution", reasons=top_features(feat,3))'
- question: Do hashes from process-creation events correlate with Zeek DNS resolutions to known C2 or
    DGA domains, indicating a first-seen executable beaconing despite code changes?
  context: Behavior survives junk-code recompilation even when the file hash changes, so DNS-to-process
    correlation catches mutated variants that hash-only detection misses. Correlate Event ID 4688 process
    hashes with Zeek dns.log resolutions and alert when a process resolves a known C2 or DGA domain. In
    the Stealth context the adversary keeps mutating the binary while preserving its callback behavior;
    the network destination betrays it. A process resolving a known-bad domain is high-fidelity; for DGA,
    pair this with the beaconing/NXDOMAIN statistics below to raise confidence.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, DNS Servers, All Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'INDEX=proc EventCode=4688

      | JOIN host [INDEX=zeek_dns WHERE query IN c2_or_dga_domains]

      | ALERT "First-seen process resolving known C2/DGA domain"'
- question: Are there outbound sessions with very low jitter -- standard deviation of inter-arrival times
    under 2 seconds across at least 5 connections -- and what are the NXDOMAIN/failed-resolution rates
    that would indicate DGA activity?
  context: Automated beacons exhibit regular, low-jitter callback timing, and DGA resolvers generate many
    failed lookups. Compute the standard deviation of inter-arrival times per session and flag sessions
    below 2 seconds of jitter with at least 5 connections (frequency), and separately profile NXDOMAIN/failed-resolution
    rates as a distinct DGA failure signal. This aligns with the Stealth hunt because the junk-code/polymorphic
    variant changes its code but keeps its beacon cadence. Low-jitter repeated connections plus elevated
    NXDOMAIN is a strong combined lead; legitimate polling exists, so baseline expected services and corroborate
    with the C2-domain correlation.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, DNS Servers, All Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'GROUP zeek_conn BY src,dest

      | EVAL jitter = stddev(inter_arrival_times), n = count

      | WHERE jitter < 2s AND n >= 5

      | ALERT "Low-jitter beaconing"

      /* DGA: STATS nxdomain_rate BY src FROM zeek_dns */'
- question: Does a time-series model (Prophet/SARIMA) over per-minute outbound bytes show large periodic
    spikes in the residuals, and does an Isolation Forest over flow features corroborate low-latency anomalous
    traffic?
  context: Beaconing and data movement from polymorphic variants appear as periodic anomalies in outbound
    volume. Fit Prophet or SARIMA to per-minute outbound bytes (volume) and flag large periodic spikes
    in the residuals, then corroborate with an Isolation Forest over flow features for fast unsupervised
    scoring. This supports the Stealth investigation by catching behavior-preserving variants through
    their network footprint rather than their mutable code. A residual spike with a periodic structure
    plus an Isolation Forest flow anomaly is a strong combined lead; tune sensitivity to seasonal business
    traffic and corroborate with the beaconing and C2-domain checks.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, DNS Servers, All Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'series = per_minute(sum(orig_bytes)) FROM zeek_conn

      model = Prophet().fit(series)  # or SARIMA

      resid = series - model.predict(series)

      IF periodic_spike(resid): ALERT "Outbound volume anomaly"

      # corroborate: IsolationForest(flow_features).anomaly()'
