name: 'T1055.013: Process Injection: Process Doppelgänging'
id: 480faf98-ef59-4d7a-9600-5d21ffe0b2ff
description: 'Investigate possible Process Doppelganging (MITRE ATT&CK T1055.013), a fileless variation
  of process injection in which an adversary abuses Windows Transactional NTFS (TxF) to overwrite a legitimate
  executable inside a transaction, map the tainted image into a section, roll the transaction back, and
  then animate a new process from the uncommitted section so malicious code executes under the guise of
  a trusted on-disk binary. This playbook helps an analyst hunt for the defining artifacts of that behavior
  across endpoint, kernel, and network telemetry: Sysmon process-tampering (''Image is replaced'') events
  and in-memory/on-disk image mismatches, the rare TxF API ordering (CreateTransaction -> CreateFileTransacted
  -> NtCreateSection -> RollbackTransaction -> NtCreateProcessEx -> NtCreateThreadEx), anomalous process-creation
  lineage and token elevation, post-injection credential access against LSASS and the SAM, and C2/beaconing
  or recon spawned by masqueraded system binaries. It covers both the Stealth objective (blending malicious
  execution into a legitimate process to evade process-based defenses) and the Privilege Escalation objective,
  and pairs symbolic-logic, statistical, and machine-learning detection methods so a SOC analyst can confirm,
  scope, and triage the activity.'
type: technique
