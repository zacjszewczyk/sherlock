questions:
- question: '[Stealth] Using a symbolic logic approach, can you identify "Image-replaced tampering" —
    Alert on every Sysmon Event ID 25 with Type ''Image is replaced''; this is a near-deterministic indicator
    of Doppelganging/hollowing and should be treated as high severity, baselining and excepting only verified
    self-patching software (Detecting Process Injection with Wazuh, Microsoft Sysmon)?'
  context: 'Mission question: Is the adversary escalating privileges using Process Doppelganging? Evidence
    under investigation: Sysmon Process Tampering (Event ID 25, Type ''Image is replaced'') fires when
    a process''s in-memory image diverges from its on-disk image — the defining artifact of Process Doppelganging/hollowing.
    Corroborate with kernel image/section-pointer mismatch where available. Detection method (Symbolic
    Logic): Alert on every Sysmon Event ID 25 with Type ''Image is replaced''; this is a near-deterministic
    indicator of Doppelganging/hollowing and should be treated as high severity, baselining and excepting
    only verified self-patching software (Detecting Process Injection with Wazuh, Microsoft Sysmon). Why
    it matters for Stealth: Process Doppelganging lets an adversary run code inside a trusted-looking
    process image. In the Stealth context the goal is to surface execution that has been deliberately
    masked under a legitimate process so it blends in with normal activity; a positive result means a
    process is not what its on-disk image, lineage, or behavior claims to be and warrants immediate isolation
    and memory capture, while a negative result helps you exonerate benign self-patching or installer
    behavior. Citations: [Detecting Process Injection with Wazuh](https://wazuh.com/blog/detecting-process-injection-attacks-with-wazuh/),
    [Microsoft Sysmon](https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon).'
  answer_sources:
  - Sysmon Event ID 25
  - ETW (Microsoft-Windows-Kernel-Process)
  - ETW (Microsoft-Windows-Threat-Intelligence)
  - 'NAI: User Workstations, Application Servers, Critical Servers'
  range: Last 90 days; pivot +/- 5 minutes around each hit for correlation
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Sysmon EventCode=25 Type="Image is replaced"

      | where Image NOT IN (verified_self_patching_allowlist)

      | eval severity="high" | table _time, host, Image, ProcessId, User'
