questions:
- question: '[Credential Access] Match source IP to threat intel: Can you determine whether A successful
    authenticated web session to a corporate web application originates from a source IP/ASN tied to AiTM/phishing-relay
    or C2 infrastructure (TOR exit, anonymizing proxy, hosting/VPS ranges), or whose TLS client fingerprint
    and added relay latency are inconsistent with a direct browser connection. Forged/stolen session cookies
    are predominantly delivered via reverse-proxy AiTM toolkits. -- specifically, using the ''Match source
    IP to threat intel'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), the adversary forges web cookies
    or other authentication material (session cookies, SAML/OAuth tokens) to gain access to web applications
    and cloud/SaaS services without ever stealing a live session or completing a legitimate login, which
    lets them bypass multi-factor authentication and operate as a trusted user. This evidence focuses
    on the condition that A successful authenticated web session to a corporate web application originates
    from a source IP/ASN tied to AiTM/phishing-relay or C2 infrastructure (TOR exit, anonymizing proxy,
    hosting/VPS ranges), or whose TLS client fingerprint and added relay latency are inconsistent with
    a direct browser connection. Forged/stolen session cookies are predominantly delivered via reverse-proxy
    AiTM toolkits. This Symbolic Logic approach works as follows: Cross-reference Zeek session source
    IPs/ASNs with blocklisted infrastructure (C2, TOR exit nodes, anonymizing proxies, bulletproof hosting)
    and alert on matches; corroborate with AiTM-relay fingerprints (added round-trip latency, server TLS
    certificate/cipher discrepancies) characteristic of reverse-proxy phishing kits per [Catching Transparent
    Phish](https://catching-transparent-phish.github.io/). A positive result -- a rule match, a statistical
    outlier, or a model alert -- indicates probable forged-cookie or forged-token access; pivot to the
    affected identity and its recent authentication history (or lack of one), the source IP/ASN/geo and
    TLS/HTTP fingerprint of the session, the web application or cloud service reached, any MFA/IdP events
    that should have preceded the session, and the post-authentication actions taken with the session
    to scope impact and data accessed. A negative result helps rule out this particular forged-authentication
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy AiTM-relayed, low-and-slow, or cloud-federated forgery.'
