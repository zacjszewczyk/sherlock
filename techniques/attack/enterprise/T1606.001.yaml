name: 'T1606.001: Web Cookies'
id: 4a5792dc-cbea-4dc9-92f8-1cf44a80265f
description: 'This playbook helps an analyst investigate whether an adversary has forged web cookies or
  other authentication material to gain access to web applications and cloud/SaaS services (MITRE ATT&CK
  T1606.001, Web Cookies). Unlike stolen or intercepted session cookies, forged cookies and tokens are
  generated by the adversary -- often using leaked secrets, private keys, or token-signing certificates
  (e.g., Golden SAML) -- producing valid-looking authenticated sessions that bypass multi-factor and other
  authentication controls with no corresponding legitimate login. The hunt spans Windows, Linux, macOS,
  SaaS, and IaaS telemetry and pursues the behavior from several complementary angles: authenticated web
  sessions arriving from threat-intel/AiTM-relay/anonymizing infrastructure or with inconsistent TLS/HTTP
  fingerprints; impossible-travel and concurrent-session cookie replay across geographies; User-Agent
  and cross-layer fingerprint inconsistencies; authenticated web access with no antecedent interactive
  logon, IdP authentication, or MFA event; anomalous post-authentication behavior (sensitive/admin URL
  access, enumeration spikes, bulk data egress); cookie-issuance and prefix/scope-binding violations indicating
  cookies generated outside the normal flow; and cloud token forgery via federation/trust and signing-certificate
  changes. Detection methods combine deterministic symbolic-logic rules (threat-intel matching, impossible-travel
  and concurrent-session checks, logon/IdP/MFA correlation, cookie-issuance validation, federation-change
  tripwires), statistical baselining (rare ASN/location profiling, first-seen User-Agent, delta-based
  logon timing, enumeration and egress percentiles, cookie lifetime/reuse baselines), and machine learning
  (Isolation Forest session scoring, DBSCAN session clustering, sequence/navigation modeling), applied
  across Zeek conn/http/ssl/files logs, web application logs, Windows Security and Sysmon events, auditd,
  macOS unified logs, and AWS CloudTrail / M365 / Azure AD / AD FS logs, so the analyst can corroborate
  suspected forged-cookie or forged-token access against authentication history, network fingerprints,
  session geography, and post-auth behavior.'
type: technique
