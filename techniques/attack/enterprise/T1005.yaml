name: 'T1005: Data from Local System'
id: 02bca0f2-6440-48e3-a2cb-fad0de32fa85
description: Hunt for adversaries who search, enumerate, stage, or copy data from local system sources
  -- file systems, configuration files, local databases, virtual machine files, and process memory --
  in preparation for exfiltration (MITRE ATT&CK T1005, Collection). It guides an analyst through process-creation
  evidence of known staging/archiving utilities, command-line and PowerShell use of recursive discovery,
  content search, and archiving primitives, bursts of mass file enumeration or reads by a single process,
  processes touching directories inconsistent with their behavioral profile (e.g., a web worker reading
  NTDS.dit), and network-device or ESXi configuration-dump commands destined for remote TFTP/SCP/FTP servers.
  For each lead it pairs symbolic-logic detection rules, statistical baselining, and machine-learning
  approaches across Windows, Linux, macOS, ESXi, and network-device telemetry so a SOC analyst can confirm
  or refute local-data collection on critical servers, executive and developer endpoints, file servers,
  and infrastructure devices.
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any host execute a process whose file hash or image name matches a known data-staging,
    credential-dumping, or archiving utility (for example secretsdump.py, SharpHound.exe, Rubeus.exe,
    or 7z.exe run with password/archive switches)?
  context: 'Adversaries pursuing Collection frequently drop or run purpose-built tools to gather and compress
    local data before exfiltration. Matching process hashes and image names from Event ID 4688 / Sysmon
    1 against threat-intelligence feeds gives a high-confidence, low-noise signal. Layer a name-plus-argument
    floor so renamed archivers are still caught when invoked with collection flags (e.g., 7z/rar/zip with
    -p or archive switches, per the SigmaHQ 7-Zip password-compression rule). A hit on a critical server,
    PAW, or executive endpoint should be treated as an active collection event and triaged immediately;
    absence of hits does not clear the host, since attackers rename or recompile tooling. Sources: [Sigma
    7-Zip password-compression rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_7zip_password_compression.yml),
    [SigmaHQ corpus](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Critical servers (Domain Controllers, Database Servers), Executive workstations, Developer endpoints,
    Privileged Access Workstations (PAWs)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'proc = FILTER (Event4688 OR Sysmon1)

      ti_hit = proc.image_hash IN threat_intel_hashes OR proc.image_name IN known_stager_names

      arg_hit = proc.image_name MATCHES /(7z|rar|zip)/i AND proc.cmdline MATCHES /(-p|-r|a )/

      ALERT WHERE ti_hit OR arg_hit'
- question: Which executed binaries are statistically rare across the fleet (seen on very few endpoints
    or below 0.1% prevalence) and also exhibit heavy collection behavior such as large bytes written or
    many child files created?
  context: 'Bespoke or freshly compiled collection tools are rare by nature. Scoring process hashes by
    prevalence (<0.1% or seen on <5 endpoints) surfaces first-seen binaries, while combining that with
    execution physics -- bytes written and child-file count per minute -- separates benign rare admin
    tools from active stagers. Feed the per-process feature vectors to an Isolation Forest for rankable
    outlier scores, and track execution-failure state (process exit errors, access-denied) as its own
    signal, since failed mass collection still reveals intent. High-scoring rare binaries on sensitive
    hosts warrant binary retrieval and detonation. Sources: [Isolation Forest](https://ieeexplore.ieee.org/abstract/document/4781136).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Critical servers (Domain Controllers, Database Servers), Executive workstations, Developer endpoints,
    Privileged Access Workstations (PAWs)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'feats = AGG proc BY image_hash -> prevalence, bytes_written, child_files_per_min, exit_error

      rare = feats WHERE prevalence < 0.001 OR endpoint_count < 5

      score = IsolationForest(rare[bytes_written, child_files_per_min, exit_error])

      ALERT WHERE score > threshold'
- question: Does a supervised model classify a process as likely-malicious based on its parent, user,
    command-line length/entropy, hash prevalence, and child-file volume, and which features drove that
    decision?
  context: 'Single heuristics miss novel tooling, so train a Random Forest or Gradient Boosting classifier
    on labeled benign/malicious process features (parent image, user, command-line length and entropy,
    hash prevalence, child-file volume) and alert on high-probability scores, surfacing the top-3 contributing
    features so analysts can validate quickly. Complement with transformer embeddings of command lines
    scored by unsupervised detectors (per CrowdStrike BERT command-line anomaly detection) to catch obfuscation.
    Validate against the CERT Insider Threat Test Dataset to calibrate false positives. A confident malicious
    score on a collection-relevant host is a strong lead for staging. Sources: [CrowdStrike BERT command-line
    anomaly detection](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/),
    [CERT Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Critical servers (Domain Controllers, Database Servers), Executive workstations, Developer endpoints,
    Privileged Access Workstations (PAWs)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = features(proc: parent, user, cmd_len, cmd_entropy, hash_prevalence, child_files)

      p = RandomForest.predict_proba(X)

      ALERT WHERE p_malicious > 0.8 WITH top3_features(X)'
- question: Was a command interpreter or scripting host (cmd.exe, powershell.exe) run with arguments combining
    recursive file discovery (dir /s, Get-ChildItem -Recurse, grep -r), content searching (findstr, Select-String),
    and archiving keywords (tar, zip, Compress-Archive, password)?
  context: 'The classic Collection pattern is discover-then-stage: enumerate files recursively, search
    their contents for secrets, then compress the results. Matching command-line arguments and Event ID
    4104 script blocks for the co-occurrence of recursion tokens with content-search and archiver keywords
    produces a faithful, portable rule grounded in Maxion & Townsend and the SigmaHQ corpus. This catches
    both hands-on-keyboard operators and scripted collection on file servers, SharePoint, and code repositories.
    A match where discovery and archiving co-occur in a short window is a strong staging indicator; isolated
    discovery alone is lower priority. Sources: [Maxion & Townsend](https://www.cs.cmu.edu/~maxion/pubs/MaxionTownsend02.pdf),
    [SigmaHQ corpus](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: User workstations, File servers, SharePoint servers, Code repositories, Application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'cmd = FILTER (Event4688 OR Event4104 OR Sysmon1)

      recurse = cmd.text MATCHES /(dir /s|findstr /s|Get-ChildItem.*-Recurse|grep -r|Select-String)/i

      stage = cmd.text MATCHES /(tar|zip|Compress-Archive|password|rar)/i

      ALERT WHERE recurse AND stage'
- question: Are a user's or role's discovery and archiving command rates spiking above their historical
    99th-percentile baseline, or is command-string entropy abnormally high?
  context: 'Most users rarely run recursive discovery or archiving commands, so per-user and per-role
    command-frequency profiles make abuse stand out. Use naive-Bayes deviation scoring (Maxion & Townsend)
    to flag discovery/archiving command counts above the 99th percentile, baseline command-string entropy
    per process and flag executions above the 99th percentile, and treat failed or empty-result discovery
    commands as a distinct state signal that an actor is probing. Derive site thresholds from the CERT
    dataset. A user suddenly issuing many high-entropy discovery commands is a behavioral outlier worth
    pivoting on. Sources: [Maxion & Townsend](https://www.cs.cmu.edu/~maxion/pubs/MaxionTownsend02.pdf),
    [CERT dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: User workstations, File servers, SharePoint servers, Code repositories, Application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'profile = BASELINE cmd_count, cmd_entropy BY user, role OVER 90d

      rate = AGG discovery_archive_cmds BY user PER min

      ALERT WHERE rate > p99(profile) OR cmd_entropy > p99(profile) OR empty_result_burst'
- question: Do transformer (BERT) embeddings of observed command lines, scored by unsupervised detectors,
    flag obfuscated or rare discovery and staging commands that signature rules would miss?
  context: 'Attackers obfuscate command lines (encoding, concatenation, aliasing) to evade token-based
    rules. Embedding command lines with BERT and scoring with unsupervised detectors (Isolation Forest,
    COPOD, PCA, autoencoders) captures semantic rarity rather than literal strings, catching novel staging
    invocations (per CrowdStrike BERT command-line anomaly detection). Surface the top-3 tokens or nearest-neighbor
    commands in the alert so an analyst can judge intent. A command that is far from the learned benign
    manifold on a file server or developer endpoint is a candidate for hidden collection activity. Sources:
    [CrowdStrike BERT command-line anomaly detection](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: User workstations, File servers, SharePoint servers, Code repositories, Application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'emb = BERT.embed(cmd.text)

      score = IsolationForest(emb)  # or COPOD/PCA/autoencoder

      ALERT WHERE score > threshold WITH top3_tokens, nearest_neighbors'
- question: Did a single process read an unusually large number of unique files across many directories
    in a short window (e.g., >500 unique files across >20 directories in 5 minutes), or generate a burst
    of access-denied file reads?
  context: Mass enumeration or bulk copying produces a tell-tale burst of file-access events (Event ID
    4663 / Sysmon 11) concentrated on one process. Alert when a process exceeds tuned thresholds (>500
    unique files across >20 directories in 5 minutes), excluding allow-listed backup, indexing, and AV
    processes that legitimately touch many files. Pair this with a failure-state rule on bursts of EID
    4663 access-denied events, which indicate brute file enumeration against protected data. A burst on
    a file server holding PII/PHI/financial data or in cloud-sync folders is a strong collection lead.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: File servers containing sensitive PII/PHI/Financial data, Critical system directories (e.g.,
    C:\Windows\System32), User profile directories, Cloud storage synchronization folders (e.g., OneDrive,
    Dropbox) on endpoints'
  range: Last 90 days, evaluated in rolling 5-minute windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "win = WINDOW 5min BY process\nagg = COUNT distinct files, distinct dirs, access_denied IN\
      \ win\nALERT WHERE (distinct_files > 500 AND distinct_dirs > 20 AND process NOT IN allowlist)\n\
      \       OR access_denied_burst"
- question: For a given process name, are its unique-file count, directory breadth, bytes-read volume,
    and read-failure ratio above the 99.5th percentile of that process's own historical behavior?
  context: 'A fixed threshold misfits diverse processes, so baseline each process name''s unique-file
    count, directory breadth, bytes-read volume, and read-fail ratio, then flag instances above the 99.5th
    percentile. Score the multi-dimensional feature vector with Isolation Forest for rankable outliers,
    following the feature set and per-baseline methodology in the Deep Learning for Insider Threat survey.
    This catches a normally quiet process that suddenly behaves like a bulk collector while tolerating
    naturally file-heavy software. Outliers on sensitive file shares or user-profile directories deserve
    immediate review. Sources: [Isolation Forest](https://ieeexplore.ieee.org/abstract/document/4781136),
    [Deep Learning for Insider Threat survey](https://arxiv.org/pdf/2005.12433).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: File servers containing sensitive PII/PHI/Financial data, Critical system directories (e.g.,
    C:\Windows\System32), User profile directories, Cloud storage synchronization folders (e.g., OneDrive,
    Dropbox) on endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = BASELINE unique_files, dir_breadth, bytes_read, read_fail_ratio BY process_name

      score = IsolationForest(current_vector)

      ALERT WHERE any_dim > p99.5(base) OR score > threshold'
- question: When file-access events are clustered on process, user, file extension, directory depth, bytes
    read, and hour, do anomalous read fan-out patterns appear as noise/outliers outside normal clusters?
  context: 'Unsupervised clustering reveals collection behavior without predefined thresholds. Cluster
    file-access events on (ProcessName, UserName, FileExtension, DirectoryDepth, BytesRead, Hour) with
    DBSCAN and treat noise points as outliers. Complement with node-level provenance scoring of abnormal
    process-to-file read fan-out (per ThreaTrace), reporting the top-3 deviating features, and evaluate
    on DARPA TC E3. A process whose read pattern lands in DBSCAN noise -- many extensions, deep directory
    traversal, off-hours -- is a candidate for mass collection that rule thresholds would miss. Sources:
    [ThreaTrace](https://arxiv.org/pdf/2111.04333), [DARPA TC E3](https://github.com/darpa-i2o/Transparent-Computing/blob/master/README-E3.md).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: File servers containing sensitive PII/PHI/Financial data, Critical system directories (e.g.,
    C:\Windows\System32), User profile directories, Cloud storage synchronization folders (e.g., OneDrive,
    Dropbox) on endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = features(process, user, file_ext, dir_depth, bytes_read, hour)

      labels = DBSCAN(X)

      ALERT WHERE label == NOISE WITH top3_features, provenance_fanout_score'
- question: Did a process spawn an unexpected child or access a path inconsistent with its role -- for
    example w3wp.exe spawning cmd.exe, winword.exe spawning powershell.exe, or a non-SYSTEM actor reading
    NTDS.dit or registry hives?
  context: 'Servers and applications have predictable process lineage and file-access footprints; deviations
    betray exploitation and credential/data theft. Alert on strange parent-child pairs (winword->powershell,
    w3wp->cmd, services->whoami) and on non-SYSTEM principals reading sensitive stores like NTDS.dit or
    registry hives, extending the deterministic lineage logic of MITRE CAR-2014-05-002. A web worker reaching
    into C:\Windows\NTDS\ or an IIS process launching a shell to browse user profiles is a high-fidelity
    sign of post-exploitation local collection and should be escalated. Sources: [MITRE CAR-2014-05-002](https://car.mitre.org/analytics/CAR-2014-05-002/).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Web servers (IIS, Apache), Application servers, Domain Controllers, Endpoints with local administrator
    privileges'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHERE (parent_image, child_image) IN {(winword,powershell),(w3wp,cmd),(services,whoami)}\n\
      \   OR (target_file IN {NTDS.dit, SYSTEM, SAM, SECURITY hives} AND user != SYSTEM)"
- question: How rare is the (ProcessName, DirectoryPrefix, UserName) tuple over the last 90 days, and
    what is its read-success versus access-denied ratio?
  context: 'Rare combinations of who, what, and where expose processes operating outside their normal
    data footprint. Score (ProcessName, DirectoryPrefix, UserName) tuples and flag those below 0.01% prevalence
    over 90 days, adding the read-success vs access-denied ratio per tuple as a distinct state feature
    so probing (high denial) is distinguishable from successful theft. This prevalence-baseline approach
    follows the Deep Learning for Insider Threat survey. A near-unique tuple in which a service account
    suddenly reads an executive''s profile directory is a defensible anomaly worth investigating. Sources:
    [Deep Learning for Insider Threat survey](https://arxiv.org/pdf/2005.12433).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Web servers (IIS, Apache), Application servers, Domain Controllers, Endpoints with local administrator
    privileges'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'tuple = (process_name, dir_prefix, user)

      prev = PREVALENCE tuple OVER 90d

      ratio = read_success / access_denied PER tuple

      ALERT WHERE prev < 0.0001 WITH ratio'
- question: Does an ML lineage classifier or provenance graph model score a process chain or its file-access
    subgraph as anomalous, indicating exploitation-driven local data access?
  context: 'Graph-aware models capture multi-step attack structure that pairwise rules miss. Score parent-child
    process chains with an XGBoost lineage classifier plus graph features (per ProblemChild), and detect
    anomalous process-to-file access structure with whole-system provenance GNN autoencoders (per KAIROS),
    surfacing the top-3 contributing features and the reconstructed access subgraph in the alert. This
    finds, for example, an exploited web service whose descendant processes fan out into sensitive directories.
    A high anomaly score on a web/app server or domain controller is a strong post-exploitation collection
    signal. Sources: [ProblemChild](https://ar5iv.labs.arxiv.org/html/2008.04676), [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Web servers (IIS, Apache), Application servers, Domain Controllers, Endpoints with local administrator
    privileges'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'chain_score = XGBoost.lineage(parent_child_chain + graph_features)

      graph_score = GNN_autoencoder.reconstruction_error(provenance_graph)

      ALERT WHERE chain_score > t1 OR graph_score > t2 WITH top3_features, subgraph'
- question: Was a command run on a network device to display or copy its running/startup configuration
    (show running-config, more system:running-config, copy running-config tftp/scp/ftp), especially with
    a destination of an external IP?
  context: 'Network-device configurations contain credentials, topology, and ACLs that adversaries collect
    from routers, switches, firewalls, and VPN concentrators. Alert on syslog/AAA-accounting records showing
    config display or copy commands (show running-config, more system:running-config, copy running-config
    tftp/scp/ftp), prioritizing transfers to external IPs, using the Cisco show running-config/copy command
    vocabulary. A config export to an off-network TFTP or SCP server -- particularly by a non-standard
    admin account -- is a strong indicator of infrastructure data theft and should be escalated to network
    and IR teams. Sources: [Cisco show running-config/copy reference](https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/fundamentals/command/cf_command_ref/show_protocols_through_showmon.html).'
  answer_sources:
  - Zeek syslog.log
  - Zeek conn.log
  - 'NAI: Core network switches, Edge routers, Firewalls, VPN concentrators, Wireless LAN Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'log = FILTER (Zeek.syslog OR aaa_accounting)

      cmd = log.text MATCHES /(show running-config|more system:running-config|copy running-config (tftp|scp|ftp))/i

      ALERT WHERE cmd AND (dest_ip IS EXTERNAL OR user NOT IN approved_admins)'
- question: Are config-access commands or logins originating from rare or unseen source IPs (by ASN/geolocation),
    or are there config-export frequency spikes or AAA-reject bursts preceding config access?
  context: 'Legitimate device administration comes from a small, stable set of management sources. Cross-reference
    source IPs against Zeek conn.log, scoring rarity by ASN and geolocation and flagging non-whitelisted
    or never-before-seen sources plus config-export frequency spikes (count/hour) above baseline. Profile
    failed-login/AAA-reject bursts immediately preceding config access as a distinct state signal of credential
    brute-forcing. Use Isolation Forest for outlier scoring. A config dump from an unfamiliar ASN, or
    one preceded by authentication failures, is a high-priority infrastructure-collection lead. Sources:
    [Isolation Forest](https://ieeexplore.ieee.org/abstract/document/4781136).'
  answer_sources:
  - Zeek syslog.log
  - Zeek conn.log
  - 'NAI: Core network switches, Edge routers, Firewalls, VPN concentrators, Wireless LAN Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'src = ENRICH conn.log.src_ip WITH asn, geo, first_seen

      score = IsolationForest(src[asn_rarity, geo_rarity, export_rate])

      ALERT WHERE src NOT IN whitelist OR score > threshold OR aaa_reject_burst_before_config'
- question: Does a sequence/Markov model show an admin session that exported device configuration while
    skipping the usual diagnostic command steps, correlated with elevated egress volume in Zeek conn.log?
  context: 'Routine administration follows habitual command sequences; an operator who jumps straight
    to exporting configuration without the usual diagnostics is behaving abnormally. Use Markov chains
    or sequence models on admin command sequences to flag config exports missing the expected diagnostic
    steps, correlate with Zeek conn.log egress volume to confirm data leaving the device, and report the
    top-3 anomalous sequence transitions, grounding per-user command-profile deviation in Maxion & Townsend.
    An anomalous export sequence paired with a matching egress spike strongly suggests deliberate infrastructure
    data collection and exfiltration. Sources: [Maxion & Townsend](https://www.cs.cmu.edu/~maxion/pubs/MaxionTownsend02.pdf).'
  answer_sources:
  - Zeek syslog.log
  - Zeek conn.log
  - 'NAI: Core network switches, Edge routers, Firewalls, VPN concentrators, Wireless LAN Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = SESSIONIZE admin_commands BY user

      p = MarkovModel.transition_prob(seq)

      egress = CORRELATE Zeek.conn.log bytes_out AROUND config_export

      ALERT WHERE p < threshold AND egress > baseline WITH top3_transitions'
