name: 'T1053.006: Systemd Timers'
id: d9c9f6c7-6b3b-471c-b86a-98a6cf674823
description: 'Investigate suspected abuse of systemd timers (T1053.006) on Linux hosts, where adversaries
  create or modify .timer/.service unit files to schedule initial or recurring execution of malicious
  code for execution, persistence at user or root level, and privilege escalation. This playbook helps
  an analyst hunt for: processes spawned directly by systemd (PPID 1) running known-bad, rare, or world-writable
  binaries; systemd-run/systemctl download-and-execute and Base64-encoded commands; PPID-1 beaconing or
  rare/known-bad egress destinations; unit files written to privileged or user systemd directories by
  unexpected processes (web daemons, shells) or non-root (euid!=0) accounts; service definitions lacking
  ''User='' that point ExecStart at world-writable payloads; user-level timers created by service or out-of-pattern
  accounts; and root systemd children modifying critical auth files such as /etc/passwd, /etc/shadow,
  and /etc/sudoers.d/. It combines deterministic rules, statistical baselining, and machine-learning methods
  across auditd, Zeek, and osquery telemetry.'
type: technique
