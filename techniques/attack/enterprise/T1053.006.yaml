questions:
- question: Are there any processes whose parent process ID is 1 (i.e., spawned directly by systemd) whose
    executable hash, image path, or full command line matches a current threat-intelligence watchlist,
    or that were launched from a newly created .timer/.service unit in /etc/systemd/system, /usr/lib/systemd/system,
    or ~/.config/systemd/user?
  context: 'For the Execution tactic the core question is whether adversary-controlled code is actually
    running, and systemd timers fire their payloads as direct children of PID 1. Pivot on auditd EXECVE
    events where PPID==1, then compare the binary hash, image path, and argv against your current IOC
    feed; also cross-reference any unit file recently written to the system or user systemd directories.
    PPID-1 children that fall outside the known systemd-managed service set are the primary ATT&CK signal
    for T1053.006. Where auditd lineage is incomplete, eBPF execve/lineage hooks give reliable PPID-1
    attribution. A direct hash/path/cmdline match to known-bad is a high-confidence true positive; a clean
    match against the IOC feed does not exonerate the host (use the prevalence and ML methods below).
    References: [MITRE ATT&CK T1053.006](https://attack.mitre.org/techniques/T1053/006/); [SANS eBPF process
    observation](https://www.sans.org/white-papers/run-cannot-hide-process-memory-observing-process-injection-ebpf-linux).'
  answer_sources:
  - Linux auditd EXECVE
  - Linux auditd SYSCALL
  - Linux auditd PATH
  - 'NAI: All Linux servers and workstations, particularly those hosting critical services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=auditd type=EXECVE ppid=1\n| eval ioc = (sha256 IN threat_intel_hashes)\n      OR (exe\
      \ IN threat_intel_paths)\n      OR match(cmdline, threat_intel_cmd_regex)\n| join exe [ search source=auditd\
      \ type=PATH\n     path IN (\"/etc/systemd/system/*\",\"/usr/lib/systemd/system/*\",\"*/.config/systemd/user/*\"\
      )\n     recently_created=true ]\n| where ioc OR unit_recently_created\n| table host,_time,ppid,pid,euid,exe,sha256,cmdline,unit_file"
- question: Do any systemd-spawned (PPID 1) processes show repeated failed execution attempts — non-zero
    exit codes, segfaults, or permission-denied (EACCES) execve results — before eventually running successfully,
    which is a common fingerprint of a freshly dropped or misconfigured timer payload?
  context: 'Failed executions are themselves a signal. A newly installed malicious timer/service often
    misfires before it works: wrong interpreter, missing library, bad permissions on a dropped binary.
    Treat non-zero exit codes, SIGSEGV, and EACCES execve returns for PID 1 children as a distinct state
    signal and alert when a newly created unit produces three or more failed exec attempts within ten
    minutes followed by a success. Instrument execve return codes via auditd or eBPF. A burst of failures
    localized to one new unit on one host is suspicious; sustained failures across many hosts usually
    indicate a benign packaging/config issue worth tuning out. References: [SANS eBPF process observation](https://www.sans.org/white-papers/run-cannot-hide-process-memory-observing-process-injection-ebpf-linux).'
  answer_sources:
  - Linux auditd EXECVE
  - Linux auditd SYSCALL
  - Linux auditd PATH
  - 'NAI: All Linux servers and workstations, particularly those hosting critical services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=auditd type=(SYSCALL OR EXECVE) ppid=1\n| eval failed = (exit!=0 OR signal=\"SIGSEGV\"\
      \ OR exit_str=\"EACCES\")\n| bin _time span=10m\n| stats count(eval(failed)) as fails count(eval(NOT\
      \ failed)) as oks\n        values(unit_file) as unit by host, exe, _time\n| where fails>=3 AND oks>=1"
- question: Across the enterprise, which binaries launched by PID 1 are rare — present on fewer than ~1%
    of endpoints — especially those executing from unusual paths or running low-and-slow, and how do their
    execution frequency and data volume compare to the fleet baseline?
  context: 'Sophisticated actors avoid known-bad IOCs, so prevalence is the better lens. Build a fleet-wide
    baseline of binaries (hash + image path) spawned by PID 1 and flag those in the lowest prevalence
    band (<1% of endpoints), prioritizing ones that also run from atypical paths. Fold in execution frequency
    (executions/min) and volume (bytes spawned/read) so that infrequent, quiet timer runs still surface
    rather than hiding under thresholds tuned for noisy malware. Use one-class/prevalence scoring (isolation
    forest / OCSVM style). Rarity plus an odd path is a strong lead for the Execution question; ubiquitous,
    signed system binaries are expected and can be deprioritized. References: [Robust IoT isolation forest
    and OCSVM](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Linux auditd EXECVE
  - Linux auditd SYSCALL
  - Linux auditd PATH
  - 'NAI: All Linux servers and workstations, particularly those hosting critical services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=auditd type=EXECVE ppid=1

      | stats dc(host) as host_count avg(exec_per_min) as freq sum(bytes) as vol by sha256, exe

      | eval prevalence = host_count / total_hosts

      | where prevalence < 0.01

      | sort prevalence, -freq'
- question: When a new process is spawned by systemd, can a supervised classifier — using features like
    user/euid, executable path, command-line tokens, parent unit, hash rarity, and child-process fan-out
    — score it as likely malicious, and can the alert name the top contributing features?
  context: 'This generalizes detection beyond static rules. Train a supervised model on labeled PID-1
    execution features (euid, exe path, argv tokens, parent unit, hash rarity, fan-out of child processes)
    and score each new systemd child, alerting above a tuned probability threshold. Surface the top-3
    contributing features (e.g., rare path, encoded args, a non-root-to-root transition) using LIME/SHAP-style
    attribution so analysts can triage quickly, and corroborate causal lineage with provenance-graph node
    scoring. For the Execution tactic this catches novel payloads that evade IOC and simple prevalence
    checks; a high score with a root transition from an odd path is a priority investigation. References:
    [Robust IoT isolation forest and OCSVM](https://www.nature.com/articles/s41598-025-20445-4); [ThreaTrace
    provenance graph learning](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Linux auditd EXECVE
  - Linux auditd SYSCALL
  - Linux auditd PATH
  - 'NAI: All Linux servers and workstations, particularly those hosting critical services.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = load(\"systemd_child_classifier\")\nfor e in execve where ppid==1:\n    feats = [e.euid,\
      \ e.exe_path, tokens(e.cmdline), e.parent_unit,\n             hash_rarity(e.sha256), child_fanout(e.pid)]\n\
      \    p = model.predict_proba(feats)\n    if p >= THRESHOLD:\n        alert(e, score=p, top_features=shap(model,\
      \ feats, k=3))"
- question: Are there systemd-run or systemctl invocations that chain curl or wget into sh/bash, decode
    Base64 (base64 -d, echo ... | base64), or call an interpreter with -c/-e — and do those commands correlate
    with outbound DNS/connections in Zeek logs?
  context: 'systemd-run lets an adversary schedule arbitrary commands on the fly, and download-and-execute
    one-liners are a hallmark of staging. Apply regexes to auditd EXECVE for systemd-run/systemctl command
    lines that pipe curl/wget into a shell, decode Base64, or run interpreters with inline code, then
    correlate with Zeek dns.log and conn.log to confirm the egress actually occurred. This mirrors path-pinned
    scheduler-abuse and impostor-process Sigma patterns. A regex hit confirmed by a matching outbound
    fetch is a strong Execution lead; a regex hit with no egress may be a dry run or benign automation
    and warrants lighter triage. References: [SigmaHQ systemd service creation rule](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/path/lnx_auditd_systemd_service_creation.yml);
    [SigmaHQ masquerading crond rule](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/execve/lnx_auditd_masquerading_crond.yml).'
  answer_sources:
  - Linux auditd EXECVE
  - Linux auditd SYSCALL
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Linux endpoints, Network egress gateways, DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=auditd type=EXECVE (exe=\"*systemd-run\" OR exe=\"*systemctl\")\n| where match(cmdline,\"\
      (curl|wget).*(\\\\||sh|bash)\")\n       OR match(cmdline,\"base64\\\\s+-d|base64 --decode|echo .*\\\
      \\| ?base64\")\n       OR match(cmdline,\"-(c|e)\\\\s\")\n| join host [search source=zeek_conn OR\
      \ source=zeek_dns]\n| table host,_time,exe,cmdline,dest_ip,query"
  - technology: Zeek/pseudocode
    query: '# confirm egress tied to the host that ran systemd-run

      dns.log | where host==suspect | table ts,query,rcode

      conn.log | where host==suspect | table ts,id.resp_h,id.resp_p,orig_bytes,resp_bytes'
- question: For commands initiated by systemd-run, are there clusters of failed network retrievals — NXDOMAIN
    responses, connections to blocked/closed ports, or HTTP 4xx/5xx — that suggest covert or automated
    download attempts (e.g., five or more NXDOMAIN or repeated blocked connections in a short window)?
  context: 'Blocked or failed egress is signal, not noise. Profile failure modes for systemd-run-initiated
    network activity: count NXDOMAIN responses (Zeek dns.log rcode), connection attempts to blocked/closed
    ports, and HTTP 4xx/5xx, and alert when one systemd-run command triggers >=5 NXDOMAIN or repeated
    blocked connections in a short window. This pattern is consistent with covert/automated retrieval
    and resilient C2 staging characterized in beaconing research. For the Execution tactic this catches
    a payload that is trying — but failing — to pull its next stage; a tight burst of failures from a
    single timer-driven command is a priority lead. References: [BAYWATCH robust beaconing detection](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks).'
  answer_sources:
  - Linux auditd EXECVE
  - Linux auditd SYSCALL
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Linux endpoints, Network egress gateways, DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=auditd type=EXECVE exe="*systemd-run"

      | join host,_time [search source=zeek_dns OR source=zeek_conn OR source=http]

      | eval fail = (rcode="NXDOMAIN") OR (conn_state IN ("S0","REJ")) OR (status>=400)

      | bin _time span=5m

      | stats sum(eval(fail)) as failures by host, cmdline, _time

      | where failures>=5'
- question: Do any systemd-run command lines deviate sharply from a given user's historical norms — argument
    length more than three standard deviations above their mean, or unusually high Shannon entropy / token
    n-gram improbability — indicating obfuscated or encoded execution?
  context: 'Per-user behavioral baselines catch obfuscation that static rules miss. Build per-user baselines
    for systemd-run argument length, token entropy, and shell syntax, then flag commands exceeding the
    user''s historical mean length by >=3 standard deviations or showing high Shannon entropy, and score
    token n-gram deviation from natural-language/command baselines. Long, high-entropy command lines typically
    mean Base64/packed payloads. For the Execution tactic, a normally terse admin suddenly issuing a 4KB
    high-entropy systemd-run command is a strong anomaly; tune for power users and automation that legitimately
    use long arguments. References: [Elastic high command-line entropy detection](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html);
    [NgViz n-gram analysis](https://arxiv.org/pdf/1004.4359).'
  answer_sources:
  - Linux auditd EXECVE
  - Linux auditd SYSCALL
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Linux endpoints, Network egress gateways, DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=auditd type=EXECVE exe="*systemd-run"

      | eval arglen=len(cmdline), ent=shannon_entropy(cmdline)

      | stats mean(arglen) as mu stdev(arglen) as sd avg(ent) as ent_mu by user

      | where arglen > mu + 3*sd OR ent > 4.5

      | table host,user,arglen,ent,cmdline'
- question: Can an unsupervised model that embeds systemd-run/ExecStart command lines (e.g., BERT-style
    embeddings scored with Isolation Forest, COPOD, or an autoencoder) surface top-percentile outliers,
    list the most anomalous tokens, and prioritize those paired with rare network destinations?
  context: 'For novel or obfuscated commands that no signature or per-user threshold catches, embed systemd-run/ExecStart
    command lines with BERT-style representations and score them with unsupervised outlier detectors (Isolation
    Forest, COPOD, autoencoder reconstruction error). Escalate top-percentile outliers, list the top-3
    anomalous tokens in the alert, and raise priority when the command is paired with a rare destination
    from Zeek logs. This addresses the Execution question for commodity-to-sophisticated actors alike:
    it learns what ''normal'' command structure looks like and flags structurally weird ones regardless
    of specific keywords. References: [CrowdStrike BERT command-line embeddings](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).'
  answer_sources:
  - Linux auditd EXECVE
  - Linux auditd SYSCALL
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Linux endpoints, Network egress gateways, DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "emb = bert_embed(execve.cmdline where exe~=\"systemd-run|systemctl\")\nscore = isolation_forest.decision_function(emb)\
      \  # or COPOD / autoencoder error\nif score in top_percentile(1):\n    alert(cmdline, anomalous_tokens=top_tokens(emb,3),\n\
      \          rare_dest=join_zeek_rare_destination(host))"
- question: Do any PID-1-spawned processes initiate outbound connections whose destination IP or resolved
    domain matches a known-bad / high-confidence C2 watchlist — and do any of those egress events immediately
    follow an inbound SSH session (consistent with remote timer activation via systemctl)?
  context: 'Timer payloads frequently call home. Join auditd PID-1 execution events with Zeek conn.log/dns.log
    and test whether the destination IP or resolved domain matches a known-bad/C2 watchlist. Because timers
    can be activated remotely over SSH via systemctl, also flag PID-1 egress that immediately follows
    an inbound SSH connection. For the Execution tactic this ties a running timer payload to actual command-and-control.
    A watchlist match is high confidence; the SSH-then-egress sequence is a useful behavioral corroborator
    even when the destination is not yet known-bad. References: [MITRE ATT&CK T1053.006](https://attack.mitre.org/techniques/T1053/006/).'
  answer_sources:
  - Linux auditd EXECVE
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress gateways, DNS resolvers, All Linux endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=auditd type=EXECVE ppid=1

      | join host,pid [search source=zeek_conn OR source=zeek_dns]

      | eval bad = (dest_ip IN c2_ip_watchlist) OR (query IN c2_domain_watchlist)

      | join host [search source=zeek_conn id.resp_p=22 dir=inbound earlier_than=egress_time]

      | where bad OR inbound_ssh_preceded

      | table host,_time,exe,dest_ip,query,prior_ssh_src'
- question: For each PID-1 process/destination pair, is there a dominant periodic signal in the connection
    timing — confirmed by FFT plus autocorrelation — that indicates beaconing, after filtering known software-update
    domains and tuning jitter/duty-cycle against benign periodic baselines?
  context: 'Beaconing is the network fingerprint of scheduled C2, and a timer is literally a scheduler.
    For each PID-1 process/destination pair, extract the dominant period via FFT and confirm it with autocorrelation,
    filtering known-update domains to cut false positives, and tune jitter/duty-cycle thresholds from
    benign periodic baselines to separate legitimate scheduled polling from timer-driven C2. For the Execution
    tactic, a regular, low-jitter callback from a PID-1 process to an unfamiliar destination is a hallmark
    of an active implant on a timer. References: [BAYWATCH robust beaconing detection](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks);
    [Mack periodic traffic characterization](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf).'
  answer_sources:
  - Linux auditd EXECVE
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress gateways, DNS resolvers, All Linux endpoints.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=auditd type=EXECVE ppid=1

      | join host,pid [search source=zeek_conn]

      | stats list(_time) as ts by host, pid, exe, dest_ip

      | eval period = fft_dominant_period(ts), ac = autocorr_peak(ts)

      | where ac > 0.7 AND NOT (dest_ip IN known_update_domains)

      | where jitter(ts) < jitter_threshold

      | table host,exe,dest_ip,period,ac'
- question: Which destinations (IPs, domains, ASNs) contacted by systemd-spawned processes fall in the
    lowest enterprise-wide frequency band, or have high subdomain entropy / DGA-style naming, and what
    are the associated outbound byte volume and connection frequency?
  context: 'Rare destinations and algorithmically-generated domains betray fresh C2. Baseline destination
    IPs, domains, and ASNs for systemd-spawned processes and alert on those in the lowest frequency band
    fleet-wide, plus domains with high subdomain entropy or DGA-style naming scored via character n-gram
    deviation. Report outbound volume (bytes out) and frequency (conns/min) in the alert so analysts can
    gauge exfil vs. heartbeat. For the Execution tactic this surfaces never-before-seen C2 endpoints reached
    by timer payloads even when no watchlist entry or clean beacon period exists. References: [NgViz n-gram
    analysis](https://arxiv.org/pdf/1004.4359).'
  answer_sources:
  - Linux auditd EXECVE
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress gateways, DNS resolvers, All Linux endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=auditd type=EXECVE ppid=1

      | join host,pid [search source=zeek_conn OR source=zeek_dns]

      | stats dc(host) as hc sum(orig_bytes) as bytes_out count as conns by dest_ip, query, asn

      | eval prevalence = hc/total_hosts, dga = ngram_improbability(query)

      | where prevalence < 0.01 OR dga > 0.8

      | sort prevalence, -bytes_out'
- question: Does the outbound byte/connection volume per systemd-spawned process per host diverge from
    a provenance-aware forecast — the kind of jump that signals a newly activated timer or payload — and
    can the model attribute the anomalous flow back to its originating unit?
  context: 'Forecasting catches activation. Model outbound bytes and connection counts per systemd-spawned
    process per host with a provenance-aware anomaly model and flag divergence from the forecast that
    indicates a newly activated timer/payload. Use whole-system provenance temporal autoencoding to attribute
    the anomalous flow to its originating unit, surfacing the top-3 contributing edges/features for triage.
    For the Execution tactic this is especially useful for slow exfil or staged downloads that only appear
    once a dormant timer fires; a sudden, unforecast volume spike traced to a recently created unit is
    a high-value lead. References: [KAIROS whole-system provenance detection](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Linux auditd EXECVE
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress gateways, DNS resolvers, All Linux endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for (host,proc) in systemd_spawned:\n    forecast = temporal_autoencoder.predict(bytes_out_series[host,proc])\n\
      \    actual = observed_bytes_out[host,proc]\n    if abs(actual - forecast) > band:\n        unit\
      \ = provenance_attribute(host, proc)  # KAIROS-style\n        alert(host, proc, unit, top_edges=3)"
- question: Are there any PID-1-spawned processes whose executable path is in a deny-listed, world-writable
    location (/tmp, /var/tmp, /dev/shm) or a hidden directory, and can the originating .timer/.service
    unit be identified to confirm the source?
  context: 'Legitimate system services almost never run binaries out of world-writable or hidden directories.
    Alert when an auditd EXECVE has PPID==1 and the executable path matches deny-listed locations (^/(tmp|var/tmp|dev/shm)/
    or hidden /\.), then correlate with the parent unit/timer name to confirm the origin is a hidden or
    rogue service. Apply path-pinning logic and lean on eBPF execve visibility where auditd is thin. For
    the Execution tactic this is a high-fidelity indicator: a PID-1 child running from /dev/shm is rarely
    benign and the linked unit file usually reveals the persistence mechanism. References: [SigmaHQ masquerading
    crond rule](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/execve/lnx_auditd_masquerading_crond.yml);
    [SANS eBPF process observation](https://www.sans.org/white-papers/run-cannot-hide-process-memory-observing-process-injection-ebpf-linux).'
  answer_sources:
  - Linux auditd EXECVE
  - Linux auditd PATH
  - 'NAI: File systems on all Linux servers and workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=auditd type=EXECVE ppid=1

      | where match(exe,"^/(tmp|var/tmp|dev/shm)/") OR match(exe,"/\\.[^/]+/")

      | lookup unit_by_pid pid OUTPUT parent_unit

      | table host,_time,euid,exe,cmdline,parent_unit'
- question: Among PID-1 processes, which executable paths are first-seen or below the 1% frequency threshold
    across the fleet, and do any have filenames with high entropy / n-gram improbability suggesting randomly
    generated names dropped into writable directories?
  context: 'Path prevalence plus filename randomness catches dropped payloads that avoid the obvious world-writable
    deny-list. Maintain a frequency distribution of executable paths for PID-1 processes and alert on
    first-seen paths or those below the 1% frequency threshold, and additionally score filename entropy/n-gram
    improbability to catch randomized names. For the Execution tactic, a brand-new, fleet-unique path
    running under systemd — particularly with a gibberish filename — is a strong indicator of malicious
    scheduled execution even if the directory itself is not on a deny-list. References: [NgViz n-gram
    analysis](https://arxiv.org/pdf/1004.4359).'
  answer_sources:
  - Linux auditd EXECVE
  - Linux auditd PATH
  - 'NAI: File systems on all Linux servers and workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=auditd type=EXECVE ppid=1

      | stats dc(host) as hc earliest(_time) as first_seen by exe

      | eval prevalence = hc/total_hosts, rnd = ngram_improbability(basename(exe))

      | where prevalence < 0.01 OR first_seen > now()-7d OR rnd > 0.8

      | sort prevalence'
- question: Can clustering PID-1 process features (executable path, user context, command-line tokens)
    with DBSCAN isolate noise/outlier processes as anomalous, and does provenance-graph node scoring corroborate
    which ones are part of a malicious causal chain?
  context: 'Unsupervised clustering finds the odd ones out without labels. Cluster PID-1 process features
    (exe path, user context, argv tokens) with DBSCAN, treat noise points as anomalous, and prioritize
    them, surfacing the defining outlier features in the alert. Complement with node-level provenance
    graph anomaly scoring and drift-tolerant graph representation learning to confirm whether the outlier
    sits in a suspicious causal chain. For the Execution tactic this catches malicious systemd children
    that do not match any single rule but stand apart from the dense clusters of normal services. References:
    [ThreaTrace provenance graph learning](https://arxiv.org/pdf/2111.04333); [MAGIC masked graph representation
    learning](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf).'
  answer_sources:
  - Linux auditd EXECVE
  - Linux auditd PATH
  - 'NAI: File systems on all Linux servers and workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = features(execve where ppid==1)  # exe, user/euid, cmdline tokens\nlabels = DBSCAN(eps,\
      \ min_samples).fit_predict(X)\nfor i where labels[i]==-1:        # noise = anomalous\n    alert(X[i],\
      \ defining_features=outlier_features(X[i]),\n          graph_score=provenance_node_score(X[i].pid))"
