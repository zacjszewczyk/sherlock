name: 'T1592.001: Hardware'
id: acced692-1874-492a-b465-7e2fca6f967d
description: 'Investigate adversary reconnaissance aimed at discovering victim host hardware (types, versions,
  and the presence of defensive components such as card/biometric readers or dedicated encryption hardware).
  This playbook helps an analyst hunt for both externally-driven and on-host indicators of hardware enumeration:
  inbound scanning and sweeps from known-bad or anomalous external IPs (Zeek conn/http logs correlated
  with threat intelligence), scanner client fingerprinting (JA3/JA4H), high-volume failed connections
  and port sweeps, unauthorized SNMP/SMB management queries, and on-host execution of hardware-discovery
  commands (systeminfo, Get-ComputerInfo, wmic, lshw, dmidecode, lspci, system_profiler) via Windows Event
  ID 4688 / Sysmon 1. It also covers correlated recon-then-beacon patterns (an enumeration command followed
  by an outbound low-reputation connection) and browser-based ScanBox-style fingerprinting that enumerates
  host/browser/hardware attributes and beacons them to attacker infrastructure. Detection spans symbolic-logic
  watchlists and thresholds, statistical baselining and sequential hypothesis testing, and machine-learning
  anomaly models, giving the analyst layered, defensible coverage for this Reconnaissance technique.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are inbound connections from external source IPs that appear on high-confidence threat-intelligence
    feeds of known scanners or malicious actors reaching internal or DMZ assets?
  context: 'Tactic: Reconnaissance. During reconnaissance, high-rate internet-wide scanners concentrate
    in a small set of reputation-listable sources, so real-time correlation of inbound source IPs in Zeek
    conn.log against high-confidence TI feeds quickly surfaces adversaries probing your perimeter for
    host/hardware details. Weight feeds toward known scanners and malicious actors, and suppress ubiquitous
    untargeted background-radiation scanning so alerts stay actionable. A match against an internal/DMZ
    target is a strong positive; matches only against background noise without targeting of real assets
    are lower priority.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek http.log
  - Threat Intelligence Feeds
  - 'NAI: Internet gateways, perimeter firewalls, public-facing web servers, DMZ subnets'
  range: Last 90 days (real-time correlation, 5-10 min windows)
  queries:
  - technology: Zeek/pseudocode
    query: |-
      conn = read('zeek:conn'); ti = load('threat_intel:scanners,malicious')
      alert WHERE conn.id.orig_h IN ti.high_confidence
        AND conn.id.resp_h IN internal_or_dmz_subnets
      SUPPRESS conn.id.orig_h IN background_radiation_baseline
- question: Do inbound clients present non-browser TLS/HTTP fingerprints (JA3/JA4H) while claiming to
    be browsers, indicating automated scanner or recon tooling?
  context: 'Tactic: Reconnaissance. Scanner and recon toolkits have distinctive TLS and HTTP client stacks.
    By deny-listing known scanner/recon JA3 and JA4H fingerprints (JA4H captures HTTP header ordering
    and is resilient to TLS GREASE) and comparing the fingerprint to the declared User-Agent, the analyst
    can catch tools that spoof a browser User-Agent but expose a non-browser stack. A mismatch (non-browser
    JA3/JA4H + browser UA) is a high-fidelity signal of automated host-information reconnaissance.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      ssl = read('zeek:ssl'); http = read('zeek:http')
      alert WHERE (ssl.ja3 IN scanner_ja3_denylist OR http.ja4h IN scanner_ja4h_denylist)
        OR (http.user_agent ~ browser_regex AND http.ja4h NOT IN known_browser_ja4h)
- question: Is any external source IP exhibiting the connection-failure pattern of a port scanner as measured
    by a sequential hypothesis (Threshold Random Walk) test?
  context: 'Tactic: Reconnaissance. Threshold Random Walk (TRW) applies a Wald sequential probability
    ratio test per external source, updating a likelihood ratio on each connection''s success/fail outcome
    and crossing a scanner threshold typically after only ~4-5 failed attempts. This gives fast, error-bounded
    detection of reconnaissance scanning directly from conn.log, distinguishing benign clients (mostly
    successful connections) from scanners (mostly failed/refused connections) much earlier than fixed-count
    thresholds.'
  answer_sources: *id001
  range: Last 90 days (per-source streaming)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each external src:
        on each conn outcome: update L *= (success? theta1/theta0 : (1-theta1)/(1-theta0))
        if L >= upper_threshold: alert(src, 'scanner via TRW')
        if L <= lower_threshold: reset(src, 'benign')
- question: Which external source IPs exceed the 99th percentile for host/port fan-out with a very low
    completed-handshake ratio over a rolling window?
  context: 'Tactic: Reconnaissance. Scanners exhibit a single-packet, high-fan-out, no-handshake signature.
    Computing per-source unique destination-host count, unique destination-port count, and the completed-handshake
    (success) ratio over a 10-minute rolling window, then alerting on sources above the 99th percentile
    for fan-out or port count — especially with a success ratio under 5% — reliably isolates reconnaissance
    sweeps from legitimate high-volume clients that complete handshakes.'
  answer_sources: *id001
  range: Last 90 days (10-minute rolling windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      GROUP conn BY id.orig_h OVER window=10m
      COMPUTE uniq_hosts=dcount(id.resp_h), uniq_ports=dcount(id.resp_p),
              succ_ratio=count(state in {SF,S1})/count(*)
      alert WHERE (uniq_hosts > pctl99(uniq_hosts) OR uniq_ports > pctl99(uniq_ports))
        AND succ_ratio < 0.05
- question: Can a Random Forest classifier on connection-flow features identify inbound flows matching
    automated-scanner behavior used for hardware reconnaissance?
  context: 'Tactic: Reconnaissance. A Random Forest trained on network-flow features (duration, bytes_in,
    bytes_out, protocol, TCP flags, fan-out) can classify inbound flows that match automated-scanner fingerprints,
    surfacing the top-3 contributing features for explainable triage. Scope it narrowly, baseline on first-party
    flows, and always pair it with the deterministic TRW/threshold rules so the ML acts as a corroborating
    layer rather than a sole authority.'
  answer_sources: *id001
  range: Last 90 days (retrain monthly)
  queries:
  - technology: ML/pseudocode
    query: |-
      X = features(conn: duration,bytes_in,bytes_out,proto,tcp_flags,fan_out)
      model = RandomForest.load('scanner_clf')
      score = model.predict_proba(X)
      alert WHERE score >= 0.8 WITH top3_feature_importances
      baseline_on first_party_flows; gate_with deterministic_rules
- question: Are known hardware-enumeration commands or scripts (systeminfo, Get-ComputerInfo, wmic, lshw,
    dmidecode, lspci, system_profiler) being executed, especially by non-administrative users or unusual
    parent processes?
  context: 'Tactic: Reconnaissance. On-host hardware discovery is a hallmark of reconnaissance after access,
    or of an attacker pivoting through a compromised service. Monitoring process-creation logs (Windows
    Event ID 4688, Sysmon 1) for a watchlist of hardware-enumeration commands and applying Sigma rules
    catches this activity. The discriminating context is the actor and parent: enumeration spawned by
    non-administrative users or unusual parents such as w3wp.exe, java.exe, or httpd strongly suggests
    adversary recon via a web/app server rather than legitimate admin work.'
  answer_sources: &id002
  - Windows Event ID 4688
  - Sysmon Event 1
  - 'NAI: Domain controllers, database servers, developer workstations, executive endpoints, web servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      proc = read('win:4688','sysmon:1')
      watchlist = [systeminfo, Get-ComputerInfo, wmic computersystem, wmic path Win32_VideoController,
                   lshw, dmidecode, lspci, system_profiler]
      alert WHERE proc.image_or_cmd IN watchlist
        AND (proc.user NOT IN admins OR proc.parent IN {w3wp.exe,java.exe,httpd})
- question: Is the per-host daily volume or inter-arrival frequency of hardware-discovery tools anomalously
    high, or is a tool running on a host where it has not appeared recently?
  context: 'Tactic: Reconnaissance. Baselining per-host daily execution counts and inter-arrival frequency
    of hardware-discovery tools lets the analyst flag bursts (daily count above the 95th percentile) or
    first-appearance events (a tool not seen on that host in the last 30 days). Deriving percentile thresholds
    per host-role avoids false positives from admin workstations where such tools run routinely, while
    catching reconnaissance on servers and user endpoints where they should be rare.'
  answer_sources: *id002
  range: Last 90 days (baseline 30 days, daily eval)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      GROUP proc BY host, tool, day WHERE tool IN hw_discovery_tools
      baseline = pctl95(daily_count) PER host_role
      alert WHERE daily_count > baseline
        OR tool NOT seen_on host IN last_30d
- question: Can an Isolation Forest over process-lineage features detect anomalous hardware-discovery
    executions on a host?
  context: 'Tactic: Reconnaissance. An Isolation Forest on process-lineage features (ParentImage, Image,
    CommandLine, User, integrity level) provides a low-latency, low-tuning anomaly baseline that isolates
    unusual discovery-tool executions — for example, a hardware-enumeration command run at an odd integrity
    level or under an unexpected parent. Emitting the top-3 anomalous features per alert helps the analyst
    quickly judge whether the execution reflects reconnaissance versus benign administration.'
  answer_sources: *id002
  range: Last 90 days (retrain monthly)
  queries:
  - technology: ML/pseudocode
    query: |-
      X = features(proc: parent_image,image,cmdline_tokens,user,integrity)
      model = IsolationForest.fit(historical_proc)
      alert WHERE model.anomaly_score(X) >= threshold WITH top3_features
- question: Does an LSTM next-event model of per-host command streams flag an out-of-distribution burst
    of enumeration commands not preceded by normal admin context?
  context: 'Tactic: Reconnaissance. Modeling per-host command-event streams with an LSTM next-event predictor
    (DeepLog-style) lets the analyst flag sequences that the model finds improbable — e.g., a burst of
    hardware-enumeration commands appearing without the normal preceding admin context. Reporting which
    predicted events were violated focuses triage on the exact anomalous transitions, distinguishing scripted
    reconnaissance from routine operational sequences.'
  answer_sources: *id002
  range: Last 90 days (event-centered sequences)
  queries:
  - technology: ML/pseudocode
    query: |-
      seq = per_host_command_stream
      model = DeepLog_LSTM.train(normal_seq)
      for window in seq:
        if observed_event NOT IN model.topk_predicted(window):
          alert(host, violated_events=diff(predicted,observed))
- question: Is a single external source IP generating a high volume of failed connections (REJ/RSTO/RSTR)
    or touching many distinct internal hosts/ports, consistent with a network sweep?
  context: 'Tactic: Reconnaissance. A network sweep to map hosts/hardware shows up as one external source
    producing many failed connections. Alerting when a single external IP generates more than ~100 connections
    with a REJ, RSTO, or RSTR state within a 5-minute window, or touches more than ~25 distinct internal
    hosts/ports, captures the sweep. The failed-connection STATE is the discriminating signal: legitimate
    clients complete handshakes, scanners do not.'
  answer_sources: &id003
  - Zeek conn.log
  - 'NAI: Perimeter firewalls, internet-facing network sensors, network backbone taps'
  range: Last 90 days (5-minute windows)
  queries:
  - technology: Zeek/pseudocode
    query: |-
      GROUP conn BY id.orig_h OVER window=5m WHERE id.orig_h external
      fails = count(state IN {REJ,RSTO,RSTR})
      alert WHERE fails > 100
        OR dcount(id.resp_h)+dcount(id.resp_p) > 25
- question: Which inbound source IPs show a very low success ratio combined with high destination-port
    entropy, indicating randomized scanning?
  context: 'Tactic: Reconnaissance. Computing the success/failure ratio and destination-port entropy for
    inbound connections operationalizes failed-outcome discrimination: source IPs with a success ratio
    under 5% and port entropy in the 98th percentile are performing randomized scanning. Tuning these
    thresholds against background-radiation baselines keeps benign internet noise from drowning out targeted
    reconnaissance.'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      GROUP conn BY id.orig_h
      succ_ratio = count(state in {SF,S1})/count(*)
      port_entropy = shannon_entropy(id.resp_p)
      alert WHERE succ_ratio < 0.05 AND port_entropy >= pctl98(port_entropy)
      tune_against background_radiation_baseline
- question: Does an LSTM/Kitsune autoencoder over inbound connection-volume time series reveal reconstruction-error
    spikes indicating low-and-slow scanning?
  context: 'Tactic: Reconnaissance. An LSTM autoencoder, or a Kitsune/KitNET ensemble over incremental
    flow statistics, models inbound connection-attempt volume as a time series; reconstruction-error spikes
    reveal low-and-slow scanning that evades fixed thresholds. Surfacing the top-3 contributing flow features
    (fan-out, fail-rate, rate) gives the analyst an explainable basis to confirm a stealthy reconnaissance
    sweep.'
  answer_sources: *id003
  range: Last 90 days (streaming)
  queries:
  - technology: ML/pseudocode
    query: |-
      ts = inbound_attempt_volume_features(fan_out,fail_rate,rate)
      model = LSTM_AE_or_KitNET.fit(normal_ts)
      err = model.reconstruction_error(ts)
      alert WHERE err >= spike_threshold WITH top3_features
- question: Are SNMP (UDP/161) or SMB (TCP/445) management queries originating from external IPs or from
    internal hosts not authorized for network administration?
  context: 'Tactic: Reconnaissance. Management protocols expose device and hardware details, making them
    prime reconnaissance targets. By whitelisting authorized network-management stations and alerting
    on any SNMP or SMB query in Zeek snmp.log/smb_mapping.log originating from an external IP or a non-whitelisted
    internal host, the analyst catches unauthorized enumeration of network and hardware inventory. A query
    from outside the management whitelist is a strong positive.'
  answer_sources: &id004
  - Zeek conn.log
  - Zeek smb_mapping.log
  - Zeek snmp.log
  - 'NAI: Internal server subnets, network management segments, legacy equipment zones'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      snmp = read('zeek:snmp'); smb = read('zeek:smb_mapping')
      alert WHERE (snmp OR smb) AND src NOT IN mgmt_station_whitelist
        OR src external
- question: Is a single source generating a burst of failed or denied management queries (SNMP auth failures,
    community brute force, SMB access-denied/anonymous enumeration)?
  context: 'Tactic: Reconnaissance. Failed and denied management queries are a distinct Failure-Mode signal
    of reconnaissance: an actor enumerating devices it cannot fully access. Alerting when a single source
    generates more than ~20 failed/denied management queries (SNMP authentication failures, community-string
    brute force, SMB ''access denied'' or anonymous enumeration) in 5 minutes catches attempts to inventory
    hardware behind authentication.'
  answer_sources: *id004
  range: Last 90 days (5-minute windows)
  queries:
  - technology: Zeek/pseudocode
    query: |-
      GROUP mgmt_queries BY src OVER window=5m
      fails = count(snmp_auth_fail OR snmp_community_bruteforce
                    OR smb_access_denied OR smb_anonymous_enum)
      alert WHERE fails > 20
- question: Has a new source-destination pair for management protocols appeared, or have connection counts
    for an existing pair spiked beyond 3 standard deviations from baseline?
  context: 'Tactic: Reconnaissance. Building a 30-day historical baseline of source-destination pairs
    for SNMP/SMB management traffic lets the analyst flag any brand-new communication pair, or pairs whose
    connection counts exceed 3 standard deviations above the per-pair mean. New pairs and volume spikes
    both indicate reconnaissance that deviates from established management relationships.'
  answer_sources: *id004
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = mean,std OF conn_count PER (src,dst,proto) OVER 30d
      alert WHERE (src,dst) NOT IN baseline.pairs
        OR conn_count > baseline.mean + 3*baseline.std
- question: Does community-detection on the internal host-communication graph reveal a host initiating
    management traffic to nodes outside its assigned community?
  context: 'Tactic: Reconnaissance. Applying community detection (e.g., Louvain) to the graph of internal
    host communications models normal neighborhoods of interaction. When a host initiates management traffic
    to nodes outside its assigned community, that cross-community edge often signals reconnaissance/lateral
    mapping. Listing the top-3 anomalous edges/destinations focuses triage; anchor on first-party flow
    data with a deterministic floor to keep the model honest.'
  answer_sources: *id004
  range: Last 90 days (rebuild weekly)
  queries:
  - technology: ML/pseudocode
    query: |-
      G = graph(internal_host_comms); C = Louvain(G)
      alert WHERE host emits mgmt_traffic TO dst AND community(dst) != community(host)
        WITH top3_anomalous_edges
      anchor_on first_party_flows; gate_with deterministic_floor
- question: Did a host execute a hardware-discovery command and then, within 60 seconds, make an outbound
    connection to a low-reputation external IP (recon-then-beacon)?
  context: 'Tactic: Reconnaissance. The recon-then-beacon pattern — a host runs a hardware-enumeration
    command, then quickly contacts attacker infrastructure to exfiltrate or signal — is characteristic
    of ScanBox-style reconnaissance. Correlating a hardware-discovery process event (Event ID 4688) and/or
    outbound flow (Event ID 5156, Zeek conn.log) with a TI-listed low-reputation destination within a
    60-second window produces a high-fidelity alert tying local recon to external command infrastructure.'
  answer_sources: &id005
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Threat Intelligence Feeds
  - 'NAI: Critical application servers, administrator workstations, endpoints handling sensitive data'
  range: Last 90 days (60-second correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      recon = read('win:4688') WHERE cmd IN hw_discovery_watchlist
      net = read('win:5156','zeek:conn'); ti = load('threat_intel:low_reputation')
      alert WHERE recon.host == net.host
        AND net.dest_ip IN ti
        AND net.time - recon.time <= 60s
- question: Is the conditional probability of an outbound external connection given a hardware-enumeration
    event on this host below 0.01 relative to its baseline?
  context: 'Tactic: Reconnaissance. Computing the conditional probability of an outbound external connection
    given a hardware-enumeration event, relative to the host''s own baseline, quantifies how unusual the
    recon-then-egress sequence is. Profiling each host''s normal recon-command and egress rates makes
    the baseline role-specific; alerting when the observed sequence has p < 0.01 highlights statistically
    rare, suspicious chains while tolerating routine behavior.'
  answer_sources: *id005
  range: Last 90 days (per-host baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      p = P(outbound_external_conn | hw_enum_event) PER host FROM baseline
      alert WHERE observed_sequence_prob < 0.01
      profile_per_host recon_rate, egress_rate
- question: Does an HMM/DeepLog model of 'Process Create' -> 'Network Connect' sequences score the observed
    recon-to-beacon transition as low-probability?
  context: 'Tactic: Reconnaissance. Training a Hidden Markov Model (or DeepLog LSTM) on sequences of ''Process
    Create'' followed by ''Network Connect'' events lets the analyst score observed sequences and alert
    on low-probability transitions — precisely the unusual jump from a hardware-discovery process to an
    external connection. Reporting the specific transition(s) that drove the low score gives the analyst
    a concrete, explainable lead for triage.'
  answer_sources: *id005
  range: Last 90 days (event-centered sequences)
  queries:
  - technology: ML/pseudocode
    query: |-
      seq = ordered_events(ProcessCreate, NetworkConnect) PER host
      model = HMM_or_DeepLog.train(normal_seq)
      alert WHERE transition_prob(observed) < threshold
        REPORT driving_transitions
- question: Is an internal user loading a page that serves externally-hosted reconnaissance JavaScript
    (ScanBox-style) and beaconing collected host/browser attributes to an unrelated external domain?
  context: 'Tactic: Reconnaissance. ScanBox-style reconnaissance plants JavaScript on compromised or attacker
    pages to enumerate host/browser/hardware attributes and beacon them out. Matching served JavaScript
    and callback domains against ScanBox IOCs, flagging pages that load recon JS from a domain unrelated
    to the visited site, and corroborating clients with JA4H HTTP fingerprinting lets the analyst detect
    this browser-based hardware reconnaissance in Zeek http/ssl logs and web-proxy logs.'
  answer_sources: &id006
  - Zeek http.log
  - Zeek ssl.log
  - Web Proxy Logs
  - Threat Intelligence Feeds
  - 'NAI: Web proxies, TLS-inspecting gateways, browser-isolation sensors, perimeter HTTP sensors'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      http = read('zeek:http','web_proxy'); ti = load('threat_intel:scanbox_iocs')
      alert WHERE http.js_url IN ti OR http.callback_domain IN ti
        OR (http.script_origin_domain != http.page_domain AND http.script ~ recon_api_signatures)
      corroborate WITH http.ja4h IN automation_fingerprints
- question: Are hosts repeatedly attempting to reach newly-registered or low-reputation recon domains
    that fail (proxy-blocked POSTs, NXDOMAIN/404 callbacks)?
  context: 'Tactic: Reconnaissance. Failed exfiltration of collected attributes is a distinct Failure-Mode
    signal: proxy-blocked POSTs and NXDOMAIN/404 responses to candidate callback domains reveal recon
    attempts even when the beacon does not succeed. Alerting on hosts that repeatedly try to reach newly-registered
    or low-reputation recon domains catches ScanBox-style fingerprinting whose exfiltration was thwarted,
    providing early warning of compromise.'
  answer_sources: *id006
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      http = read('zeek:http','web_proxy'); dns = read('zeek:dns')
      alert WHERE host repeatedly_targets domain
        AND (proxy_blocked_POST OR dns.rcode == NXDOMAIN OR http.status == 404)
        AND (domain newly_registered OR domain low_reputation)
- question: Does a single script read an unusually broad set of device attributes (navigator/screen/font/canvas/WebGL/audio
    enumeration) exceeding a per-site breadth/entropy threshold?
  context: 'Tactic: Reconnaissance. Browser fingerprinting reads many device attributes to build a unique,
    identifying signature. Instrumenting or inferring the breadth of attributes a single script accesses
    — navigator, screen, plugins, canvas/WebGL, fonts, audio — and alerting when it exceeds a per-site
    breadth/entropy threshold catches reconnaissance scripts whose attribute-harvesting far outstrips
    a normal page''s needs, using per-attribute identifying entropy and known in-the-wild fingerprinting
    API signatures.'
  answer_sources: *id006
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      per_script_attrs = count_distinct(fingerprint_apis_read:
        navigator,screen,plugins,canvas,webgl,fonts,audio)
      breadth_entropy = sum(per_attribute_identifying_entropy)
      alert WHERE per_script_attrs > pctl_threshold PER site
        OR breadth_entropy > entropy_threshold
- question: Does a fingerprint-inconsistency classifier (FP-Scanner style) flag clients whose declared
    User-Agent conflicts with observed canvas/WebGL/font/feature attributes (headless/automation/recon
    tooling)?
  context: 'Tactic: Reconnaissance. An FP-Scanner-style decision-tree consistency check detects clients/scripts
    whose declared identity (User-Agent) conflicts with observed canvas/WebGL/font/feature attributes
    — the signature of headless browsers, automation frameworks, and recon tooling masquerading as normal
    users. Surfacing the top-3 inconsistent attributes in the alert lets the analyst confirm that the
    client is reconnaissance tooling rather than a legitimate visitor.'
  answer_sources: *id006
  range: Last 90 days (retrain periodically)
  queries:
  - technology: ML/pseudocode
    query: |-
      feats = observed(canvas,webgl,fonts,features,declared_user_agent)
      model = FPScanner_decision_tree
      alert WHERE model.inconsistent(declared_ua, observed_attrs)
        WITH top3_inconsistent_attributes
