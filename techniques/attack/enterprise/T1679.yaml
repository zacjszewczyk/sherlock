name: 'T1679: Selective Exclusion'
id: 0018cbe7-e3a5-4c52-b552-e4adc48cc05b
description: 'This playbook helps an analyst investigate whether an adversary is using Selective Exclusion
  (MITRE ATT&CK T1679) to deliberately spare certain files, folders, directories, file types, or system
  components from encryption or tampering during ransomware or malicious payload execution -- commonly
  avoiding extensions such as .dll, .exe, .sys, and .lnk and system paths such as Windows and Program
  Files so the host stays bootable and interactive (e.g., to deliver a ransom note, preserve operator
  control, or evade tripping security tooling). Aligned to the Stealth tactic (TA0005), the hunt looks
  for the signature ''enumerate broadly but modify selectively'' pattern: a process that touches a high
  volume of user/shared data while showing near-zero activity against system directories and stability-critical
  executable/library extensions. It pursues the behavior from several complementary angles -- asymmetric
  file-access patterns per process; quantified gaps between enumerated and modified file sets across directory
  class and extension distributions; command lines and embedded configuration carrying explicit include/exclude/skip
  filter logic; host-wide modification waves that preserve system integrity; and selective-exclusion file
  activity that converges with suspicious logons, process lineage, and external/lateral network connectivity
  indicative of active operator control. Detection methods combine deterministic symbolic-logic rules
  (asymmetric access correlation, enumeration-vs-modification mismatch, exclude/include command-line tokens,
  user-data-focused modification waves correlated to logon and process tree), statistical baselining (directory/extension
  distribution outliers, modified z-score rarity scoring, write-entropy and file-type-funneling indicators,
  composite multi-signal convergence scores), and machine learning (random-forest and isolation-forest
  per-process I/O models, traversal-and-modify clustering, NLP command-line scoring with DeepLog sequence
  context, campaign-level and fusion models with top-feature attribution). Telemetry spans Windows endpoint
  logs (Event IDs 4663, 4656, 4670, 4688, 4624, and PowerShell 4103/4104) and network egress logs (Zeek
  conn, dns, http, ssl), and the guidance recommends seeding honeyfiles in non-excluded user paths as
  deterministic tripwires so the analyst can corroborate suspected selective-exclusion ransomware against
  process lineage, file-access asymmetry, command-line filters, and concurrent network behavior.'
type: technique
