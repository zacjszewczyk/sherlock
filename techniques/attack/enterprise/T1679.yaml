questions:
- question: '[Stealth] Detect asymmetric file access patterns by process: Can you determine whether file
    modification activity consistent with mass tampering or encryption is present on a host, but specific
    high-impact system paths and file types (e.g., Windows system directories and executable/library extensions)
    are conspicuously untouched relative to surrounding activity, indicating deliberate exclusion logic.
    -- specifically, using the ''Detect asymmetric file access patterns by process'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary practices Selective Exclusion
    (T1679) by intentionally avoiding the encryption or tampering of specific files, directories, file
    types, or system components so the compromised host remains operational, blends in with normal activity,
    and evades detection by users, analysts, and security tooling. This evidence focuses on the condition
    that file modification activity consistent with mass tampering or encryption is present on a host,
    but specific high-impact system paths and file types (e.g., Windows system directories and executable/library
    extensions) are conspicuously untouched relative to surrounding activity, indicating deliberate exclusion
    logic. This Symbolic Logic approach works as follows: Identify processes that access or modify a high
    volume of files (Event IDs 4656/4663) and compute whether those accesses disproportionately target
    user data paths (e.g., user profiles, documents, shared drives) while avoiding system directories
    (e.g., Windows and Program Files). Flag a process when it exhibits both (a) high-volume file operations
    and (b) near-zero activity against system paths and executable/library file extensions during the
    same window. The broad-enumeration-but-allowlist-shaped-modification observable is defined by [Selective
    Exclusion (T1679), MITRE ATT&CK](https://attack.mitre.org/techniques/T1679/) and exemplified by the
    hard-coded extension/directory exclusion lists in [Medusa Ransomware, Unit 42](https://unit42.paloaltonetworks.com/medusa-ransomware/);
    seed honeyfiles in non-excluded user paths as a deterministic tripwire per [R-Locker, Gomez-Hernandez
    et al.](https://digibug.ugr.es/bitstream/handle/10481/53309/R-Locker.pdf) and [UNVEIL, Kharaz et al.](https://seclab.nu/static/publications/sec2016unveil.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable selective-exclusion
    tampering/ransomware; pivot to the responsible process and its parent lineage, the initiating user
    and logon type, the exact set of directories and extensions that were touched versus conspicuously
    skipped, any embedded include/exclude configuration or command-line filters, and any concurrent external/lateral
    network connectivity to scope the exclusion logic and impact. A negative result helps rule out this
    particular manifestation of the technique but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, slow, or narrowly-scoped exclusion behavior.'
