questions:
- question: '[Impact] Threat-intel watchlist match on account modification: Can you determine whether
    an account modification event (Windows Event IDs 4723, 4724, 4726, 4738, 4740) is observed where the
    initiating subject user or source client address is present on a threat intelligence watchlist of
    known malicious or compromised entities. -- specifically, using the ''Threat-intel watchlist match
    on account modification'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary removes or manipulates account
    access -- deleting, disabling, locking, or resetting credentials for accounts used by legitimate users
    -- to deny availability of systems and data, lock out defenders, and impede incident response and
    recovery. This behavior frequently precedes ransomware objectives (Data Destruction, Defacement, Data
    Encrypted for Impact) and may be followed by logoff or system shutdown/reboot to set malicious changes
    in place. This evidence focuses on the condition that an account modification event (Windows Event
    IDs 4723, 4724, 4726, 4738, 4740) is observed where the initiating subject user or source client address
    is present on a threat intelligence watchlist of known malicious or compromised entities. This Symbolic
    Logic approach looks for the following signal: Maintain a dynamic watchlist of suspicious or confirmed-compromised
    user accounts and host IP addresses. Create a SIEM rule that generates a high-priority alert when
    the ''SubjectUserName'' or ''Client Address'' field in account modification events (4723, 4724, 4726,
    4738, 4740) matches a watchlist entry. Chain to the impact sequence documented for ransomware operators—account
    deletion/disable + password change + log/shadow-copy deletion + logoff—to raise severity ([CISA LockBit
    AA23-165A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-165a)); align field selections
    to vetted signatures ([SigmaHQ](https://github.com/SigmaHQ/sigma)). A positive result -- a rule match,
    statistical outlier, or model alert -- suggests an account-access-removal action that deviates from
    sanctioned IT administration and may be part of an Impact/ransomware sequence; pivot to the initiating
    subject account, source host/IP, the targeted account(s) and their privilege level, the parent process
    lineage, the change window, and any follow-on authentication failures, log/shadow-copy deletion, or
    shutdown activity. A negative result helps rule out this account-removal vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land account manipulation.'
