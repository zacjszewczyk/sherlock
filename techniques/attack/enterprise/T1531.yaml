name: 'T1531: Account Access Removal'
id: fa23d0bd-8b88-44f4-971e-577e0c519e59
description: 'This playbook helps an analyst investigate whether an adversary is removing or manipulating
  account access (deletion, disablement, lockout, credential reset, or revoked permissions) to deny legitimate
  users and impede incident response as part of the Impact tactic. It guides the hunt across Windows,
  Linux, macOS, ESXi, and SaaS/Office-Suite identity platforms using several behavioral angles: account
  modification events (Windows Event IDs 4723, 4724, 4726, 4738, 4740) where the initiating subject or
  source address matches a threat-intelligence watchlist; process and script-block execution (4688/Sysmon
  1, 4104) of removal utilities such as net user, dsmod, Remove/Disable-LocalUser, Set-ADAccountPassword,
  Disable-ADAccount, Linux passwd/userdel/chage, macOS dscl/sysadminctl, and esxcli system account remove;
  enterprise-wide spikes in deletion/disablement/lockout counts beyond a dynamic baseline; account changes
  made by non-administrative users, service accounts, unusual subnets/ASNs, or at anomalous times; and
  temporal correlation between modifications and subsequent authentication failures (4625, 4771) that
  confirms access was actually removed. Detection methods combine symbolic-logic watchlists/allowlists
  and rules, statistical baselining (risk scoring, sliding windows, Z-score, change-point detection),
  and machine-learning models (supervised classifiers, command-line intent classifiers, time-series anomaly
  detection, unsupervised clustering, and sequence modeling) applied to Windows Security/Sysmon events,
  PowerShell script-block logs, auditd, macOS unified logs, ESXi host logs, M365/SaaS audit and sign-in
  logs, and Zeek network telemetry, so the analyst can corroborate suspected account-access removal against
  actor identity, source, privilege level, change windows, and downstream access impact.'
