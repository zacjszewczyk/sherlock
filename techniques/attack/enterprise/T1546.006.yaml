name: 'T1546.006: LC_LOAD_DYLIB Addition'
id: 993795b5-7c94-404a-896d-08b854a6b925
description: 'This playbook helps an analyst investigate whether an adversary is abusing the LC_LOAD_DYLIB
  Mach-O load command on macOS to achieve persistence and/or privilege escalation. Adversaries insert
  a new LC_LOAD_DYLIB header into a trusted Mach-O binary (using tools such as optool, install_name_tool
  -add_dylib, or yololib) so that a malicious dylib is loaded and executed every time the binary runs,
  and they often strip the LC_CODE_SIGNATURE command so the tampered, now invalidly-signed binary still
  loads. The playbook guides the hunt across several complementary angles: detecting binary-modification
  tools that reference threat-intel-listed dylibs; correlating modification-tool execution with dylib
  additions from user-writable/non-standard paths (/tmp, /Users/Shared, ~/Downloads); joining file-integrity
  hash/signature changes against change-management and patch-deployment records; scoring rare or unsigned
  dylib loads and novel process->dylib pairs; watching for setuid/setgid binary tampering followed by
  EUID-0 execution; flagging root processes that load dylibs from non-standard directories; and correlating
  suspicious dylib loads with anomalous child processes (shells/interpreters/network tools) and low-reputation
  or beaconing outbound connections. Detection methods combine symbolic-logic correlation rules, statistical
  baselining/outlier scoring (prevalence, entropy, time-to-execution, beacon variance), and machine-learning
  models (random forests, one-class SVM/isolation forest, LSTM sequence models, and provenance-graph anomaly
  detection) applied to macOS Endpoint Security Framework (ESF) telemetry, the unified log, file-integrity
  monitoring, EDR module-load events, and Zeek conn.log/dns.log, so the analyst can corroborate suspected
  LC_LOAD_DYLIB injection against code-signing state, process lineage, dylib provenance, and exfiltration
  context.'
