questions:
- question: '[Persistence] Detect TI-listed dylib additions (Symbolic Logic): For T1546.006 (LC_LOAD_DYLIB
    Addition) on macOS, can you investigate the following condition -- A known benign Mach-O binary is
    modified, and a subsequent inspection of its load commands reveals a new entry for a dylib whose path
    or file hash is present on a threat intelligence feed. Specifically, apply the ''Detect TI-listed
    dylib additions'' approach using a Symbolic Logic technique to surface this activity.'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses the LC_LOAD_DYLIB
    Mach-O load command to make a trusted/signed binary load and execute a malicious dynamic library every
    time it runs, optionally stripping LC_CODE_SIGNATURE so the tampered binary still loads despite a
    broken signature. This evidence focuses on the condition that a known benign Mach-O binary is modified,
    and a subsequent inspection of its load commands reveals a new entry for a dylib whose path or file
    hash is present on a threat intelligence feed. This Symbolic Logic approach pursues the signal as
    follows: From process-execution telemetry, trigger when a Mach-O modification tool (`optool`, `install_name_tool
    -add_dylib`, `yololib`) runs with a command line referencing a dylib path/name or SHA256 matching
    a threat-intel feed; these are the canonical tools for inserting LC_LOAD_DYLIB commands ([MITRE T1546.006](https://attack.mitre.org/techniques/T1546/006/)).
    Pivot with Endpoint Security to confirm the targeted binary''s post-edit code signature is now invalid
    or its LC_CODE_SIGNATURE was stripped ([Apple Code Signing](https://developer.apple.com/documentation/security/code-signing-services)),
    and record success/fail State (did the modify syscall succeed) as a distinct signal ([Apple Endpoint
    Security](https://developer.apple.com/documentation/endpointsecurity)). A positive result -- a rule
    match, statistical outlier, or model alert -- indicates a binary or its dylib load chain deviates
    from sanctioned software-update behavior; pivot to the modifying process and its lineage, the targeted
    binary''s code-signing state (valid vs. invalid/stripped), the source path of the inserted dylib,
    and any subsequent privileged execution or outbound network activity. In the context of persistence,
    this corroborates whether the adversary is using LC_LOAD_DYLIB injection to maintain a foothold that
    survives restarts and reauthentication. A negative result helps rule out this specific vector but
    should be corroborated with the other questions in this playbook, since any single method can miss
    stealthy or staged injection.'
  answer_sources:
  - macOS ESF Process Events
  - File Integrity Monitoring (FIM) logs
  - EDR Module Load Events
  - 'NAI: macOS endpoints (laptops, desktops), macOS-based servers (e.g., build servers, web servers),
    and threat intelligence platforms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Detect TI-listed dylib additions (Symbolic Logic)

      source IN [macOS ESF Process Events, File Integrity Monitoring (FIM) logs, EDR Module Load Events]

      // From process-execution telemetry, trigger when a Mach-O modification tool (`optool`, `install_name_tool
      -add_dylib`, `yololib`) runs with a command line referencing a dylib path/name or SHA256 matching
      a threat-intel feed; these are the canonical tools for inserting LC_LOAD_DYLIB commands . Pivot
      with Endpoint...

      WHERE matches_condition

      | eval signature_state = (cs_flags_valid==false OR lc_code_signature_removed==true)

      | where signature_state==true

      | table _time, host, process, parent_process, target_binary, dylib_path, modify_result, signature_state'
