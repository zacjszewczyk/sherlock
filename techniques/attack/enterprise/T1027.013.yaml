name: 'T1027.013: Obfuscated Files or Information: Encrypted/Encoded File'
id: b837ee99-0da6-4989-9fa7-094d484d3932
description: Investigate whether an adversary is using encrypted or encoded files to obfuscate strings,
  bytes, and payload contents in order to defeat static signatures and conceal malicious artifacts (T1027.013).
  This playbook helps an analyst hunt for files whose hashes match known encrypted droppers or archives,
  processes that explicitly decode/decrypt or self-extract an artifact before executing it (PowerShell
  -EncodedCommand, certutil -decode, openssl/base64/gpg decode), deceptive filenames (double extensions,
  RTLO/Unicode reordering, manipulated Byte Order Marks, and content/extension mismatches), high-entropy
  or password-protected archives staged in download/temp directories, long Base64/hex/Base32 strings hidden
  in command lines, HTTP bodies, and DNS labels, and full staged sequences in which a high-entropy file
  is decoded and then drives a new executable write or low-reputation outbound connection. For each behavior
  it pairs deterministic symbolic-logic detections with statistical baselining (entropy, length, frequency,
  KL-divergence, and failure-mode signals) and machine-learning approaches (reputation classifiers, n-gram/AST
  obfuscation models, Isolation Forests, seasonal forecasters, and provenance-graph anomaly detection)
  so that both known and novel obfuscation tradecraft can be surfaced and triaged.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Does a file observed on the network or written to a host carry a SHA-256 hash that matches
    threat intelligence for encrypted droppers, password-protected archives, or other payloads used to
    hide malicious content — and, for samples with no known hash, does its content trip YARA encoding-wrapper
    rules for decode primitives?
  context: 'This is the deterministic floor for the Stealth tactic: adversaries encrypt or encode files
    precisely so static signatures lapse, so begin by hashing every file captured in Zeek files.log and
    from object-access events (Windows Event ID 4663) and comparing those hashes to aggregated threat-intelligence
    feeds for encrypted droppers and archives. A direct hash match is a high-confidence hit indicating
    a known-bad sample already on or entering the environment. Because hashing alone cannot catch a freshly
    repacked sample, run a parallel content scan with YARA encoding-wrapper rules (gen_powershell_obfuscation.yar,
    PHP Malware Finder) that fire on base64/gzinflate/FromBase64String decode primitives, so novel samples
    with no known hash still alert. A positive result warrants immediate isolation and scoping; a negative
    result lowers but does not eliminate suspicion, which is why the statistical and ML questions below
    complement it.'
  answer_sources: &id001
  - Zeek files.log
  - Windows Event ID 4663
  - 'NAI: Internet gateways, web proxies, email servers, user workstations, file servers, cloud storage
    synchronization folders'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'files = FROM [Zeek_files, Event4663] CALCULATE sha256(content)

      ALERT WHERE sha256 IN ti_feed(encrypted_droppers, archives)

      OR yara_match(content, [gen_powershell_obfuscation, php_malware_finder])'
- question: Is the hourly rate of unique malicious-or-suspicious file hashes per named area of interest
    spiking far above its 7-day baseline, or conversely collapsing in a way that suggests a new packer
    is evading threat intelligence?
  context: A burst of newly seen suspicious hashes within a gateway, proxy, or file server can mark the
    delivery stage of an obfuscated-payload campaign, while a sudden drop in matchable known hashes can
    paradoxically signal that an adversary has adopted a new packer that no longer lines up with existing
    intelligence. Track the hourly unique-hash detection rate per NAI, baseline it with a 7-day moving
    average, and alert when counts exceed mean + 3 sigma, deriving sigma per environment from 30 days
    of history. Profile the inverse failure mode explicitly. This frequency view turns isolated single-file
    hits into a campaign-level signal and helps an analyst decide whether they are seeing routine commodity
    noise or a coordinated stealthy delivery wave.
  answer_sources: *id001
  range: Last 30 days for baseline, evaluated hourly
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'rate = COUNT(DISTINCT sha256) BY nai, bin(1h)

      base = MOVING_AVG(rate, 7d) ; sd = MOVING_STDDEV(rate, 30d)

      ALERT WHERE rate > base + 3*sd OR rate < base - 3*sd  // spike or collapse'
- question: When a reputation classifier scores a file on static features such as source reputation, MIME-versus-extension
    agreement, size, per-section Shannon entropy, and byte-entropy histograms, does it rank the file as
    likely-malicious — and which features drove that verdict?
  context: 'Hash matching and YARA cannot generalize to truly novel obfuscated files, so a gradient-boosted
    classifier trained on labeled corpora such as EMBER scores files on static features that correlate
    with encryption/encoding: source reputation, MIME type disagreeing with the file extension, file size,
    per-section Shannon entropy, and byte-entropy histograms. High scores prioritize files for analyst
    review even when no signature exists. Per XAI guidance, the alert should emit the top-3 contributing
    features (e.g. ''section .text entropy 7.8'', ''MIME=PE but ext=.pdf'') so the analyst can immediately
    judge whether the verdict is trustworthy and actionable. This supports the Stealth investigation by
    catching concealment that defeats deterministic methods.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = EXTRACT(source_rep, mime_vs_ext, size, section_entropy, byte_entropy_hist)

      score = gbdt_model.predict(features)  // trained on EMBER

      ALERT WHERE score > threshold REPORT top3_shap(features)'
- question: Did a process launch with command-line arguments or script content that explicitly decode,
    decrypt, or self-extract an artifact — for example PowerShell -EncodedCommand/-enc, FromBase64String,
    certutil -decode, openssl enc -d, base64 -d, or gpg -d — especially with a source path in a user-writable
    or temporary directory?
  context: Deobfuscation at execution time is the moment the adversary's concealed payload is revealed,
    making it one of the most valuable Stealth-tactic signals. Apply regex to Windows Event ID 4688 (process
    creation) and 4104 (script block logging) — and equivalently to auditd execve and macOS unified log
    — for explicit decode/decrypt invocations, and raise the priority when the source or output path is
    user-writable (%TEMP%, %LOCALAPPDATA%, /tmp, ~/Downloads), since legitimate software rarely decodes
    payloads from those locations. Use the SigmaHQ encoded-command rule as the deterministic floor. A
    positive result is a strong indicator of staged execution and should pivot the analyst to the parent
    process, the decoded output, and any subsequent network activity.
  answer_sources: &id002
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHERE cmdline MATCHES regex(\n  '-enc|-EncodedCommand|FromBase64String|certutil .*-decode|openssl\
      \ enc -d|base64 -d|gpg -d')\nAND source_path IN ['%TEMP%','%LOCALAPPDATA%','/tmp','~/Downloads']\n\
      FROM [Event4688, Event4104, auditd_execve, macos_unifiedlog]"
- question: Is a process command line an outlier in byte length or Shannon entropy relative to the baseline
    for that parent-child process pair, indicating an encoded blob rather than a long-but-normal command?
  context: Encoded command lines tend to be both unusually long and statistically high-entropy. Baseline
    command-line byte length and Shannon entropy per parent-child process pair, then flag executions above
    the 98th percentile or with entropy >5.5 and length >1024 bytes. To avoid false positives from legitimately
    long commands (e.g. verbose build or installer command lines), compute the KL divergence of character
    frequency against a normal-language baseline; true encoded blobs diverge sharply because their byte
    distribution is near-uniform. A positive result tells the analyst that a process is carrying concealed
    data inline, which under the Stealth tactic is exactly the behavior an adversary uses to slip a payload
    past inspection.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'p = PERCENTILE(len(cmdline), 98) BY parent_child_pair

      ALERT WHERE (len(cmdline) > p OR (entropy(cmdline) > 5.5 AND len(cmdline) > 1024))

      AND kl_divergence(char_freq(cmdline), natural_language) > kl_threshold'
- question: Does an n-gram/AST obfuscation classifier flag a process or script-block command as obfuscated,
    and does that decode command exit non-zero, suggesting a failed or aborted decryption attempt?
  context: 'Statistical length/entropy thresholds miss cleverly chunked or low-entropy obfuscation, so
    train a logistic-regression or gradient-boosted model on character n-gram, tokenizer, and AST-structure
    features following Revoke-Obfuscation, and score every Event ID 4688/4104 command. Surface the top-3
    features driving each score so the analyst can validate the verdict. Additionally profile decode commands
    that exit with a non-zero status as a distinct triage signal: a failed or aborted decryption often
    marks adversary trial-and-error or a wrong key, which is an early, high-value indicator under the
    Stealth tactic before a successful unpack occurs. Positive results should be correlated with the file
    and network questions to confirm a staged sequence.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'feat = ngram(cmdline) + tokenizer_feats + ast_features

      score = obfuscation_model.predict(feat)  // Revoke-Obfuscation style

      ALERT WHERE score > threshold OR (is_decode(cmdline) AND exit_code != 0)

      REPORT top3_features(feat)'
- question: Was a file created or transferred with a deceptive double extension (e.g. *.pdf.exe, *.jpg.scr),
    an RTLO/Unicode-reordered name, or an anomalous Byte Order Mark — or does a content-type classifier
    disagree with the file's declared extension?
  context: Filename and BOM tricks are a classic Stealth ploy to disguise executable content as a benign
    document or image so users and tools mishandle it. Use regex on Zeek files.log and Windows Event ID
    4663 to flag double extensions, right-to-left-override or Unicode-reordered names, and manipulated
    Byte Order Mark headers. Crucially, also run a content-type classifier (e.g. Magika) and alert whenever
    the detected true type disagrees with the extension — for instance bytes that parse as PE or Zip while
    the name ends in .pdf. A positive result strongly suggests deliberate masquerading of an encoded/encrypted
    payload; the analyst should examine delivery path (email, web download, removable media, network share)
    and whether the file was opened.
  answer_sources: &id003
  - Windows Event ID 4663
  - Zeek files.log
  - 'NAI: Network shares, user home directories (%USERPROFILE%), email attachment directories, web download
    folders, removable media'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'ALERT WHERE filename MATCHES regex(''\.(pdf|jpg|png|doc|txt)\.(exe|scr|js|vbs)$'')

      OR contains_rtlo_or_reorder(filename) OR anomalous_bom(header)

      OR magika_type(content) != declared_extension

      FROM [Zeek_files, Event4663]'
- question: Is a particular combination of (file extension, true MIME type, source NAI) rare over the
    last 90 days, or is there a spike in 'unknown/high-entropy' content classifications within a named
    area of interest?
  context: Masquerading produces statistically rare extension/type/source tuples. Compute the frequency
    or rarity of (extension, true-MIME, source-NAI) combinations across a 90-day window and alert when
    a combination has appeared fewer than 5 times, since genuinely novel pairings often represent crafted
    or disguised files rather than routine business activity. Separately, treat a spike in 'type=unknown'
    or high-entropy classifications per NAI as an explicit anomaly, because encrypted containers frequently
    classify as unknown. This frequency lens helps the analyst distinguish a one-off odd file from an
    emerging stealthy delivery pattern targeting a specific share, mailbox directory, or download folder.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'c = COUNT(*) BY (extension, true_mime, source_nai) OVER 90d

      ALERT WHERE c < 5

      ALERT WHERE COUNT(type==''unknown'' OR entropy>7.0) BY nai SPIKES vs baseline'
- question: Do daily counts of content/extension-mismatch and double-extension events exceed the prediction
    interval of a seasonal forecaster, and which extensions or types are contributing to the deviation?
  context: Routine masquerade noise has a predictable daily/seasonal rhythm; an adversary campaign breaks
    it. Model daily counts of content/extension-mismatch and double-extension events with a seasonal forecaster
    (ARIMA or Prophet) and alert when the observed count exceeds the prediction interval. Report the contributing
    extensions and detected types, and cross-check each implicated file's Magika confidence as an explainable
    feature so the analyst can see exactly which masquerade patterns drove the anomaly. Under the Stealth
    tactic, an unexpected surge in masquerading files often precedes or accompanies user-execution of
    an obfuscated payload, making this a useful early-warning and scoping signal.
  answer_sources: *id003
  range: Last 90 days for training, evaluated daily
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = DAILY_COUNT(mismatch_events + double_extension_events)

      model = Prophet.fit(series)

      ALERT WHERE observed > model.upper_interval

      REPORT contributing_extensions, magika_confidence'
- question: Was a password-protected or encrypted archive (ZIP/RAR/7z central-directory encryption flags,
    SFX stub) or a high-entropy file (normalized entropy >7.2 for declared-plaintext/document types) created
    or transferred from a low-reputation origin or into a download/staging directory?
  context: Password-protected archives and SFX stubs are a documented way to wrap a phishing or staging
    payload so content scanners cannot inspect it, directly serving the Stealth tactic. Detect encryption
    flags in ZIP/RAR/7z central directories and SFX decompressor stubs from Zeek files.log or Event ID
    4663, and alert when such files come from low-reputation external origins or land in download/staging
    directories like %TEMP%, %LOCALAPPDATA%, or browser download folders. Apply the deterministic entropy
    floor by flagging whole-file normalized entropy >7.2 for types that should be plaintext or documents,
    since such high entropy implies encryption or compression hiding the real content. Positive hits warrant
    retrieving and detonating the file.
  answer_sources: &id004
  - Windows Event ID 4663
  - Zeek files.log
  - 'NAI: User profile temporary directories (e.g., %TEMP%, %LOCALAPPDATA%), web browser cache and download
    folders, network egress points, email quarantine systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'ALERT WHERE (is_encrypted_archive(flags) OR is_sfx_stub(content))

      AND (source_reputation == ''low'' OR path IN download_staging_dirs)

      OR (declared_type IN [doc,txt] AND norm_entropy(content) > 7.2)

      FROM [Zeek_files, Event4663]'
- question: Is a file's entropy more than 3 sigma above the mean for its file type or service baseline,
    or does a sliding-window scan reveal a localized high-entropy region embedded inside an otherwise
    low-entropy file?
  context: Encrypted payloads can hide either as wholly high-entropy files or as a high-entropy blob smuggled
    inside a benign-looking container. Baseline mean and standard deviation of entropy and file size per
    extension and per service, then flag files more than 3 sigma above their type mean or above published
    per-service baselines (>7.0). Importantly, run a sliding-window entropy scan to localize a high-entropy
    region within an otherwise low-entropy file — this catches an encrypted payload appended to or embedded
    in a normal document, which whole-file entropy would average away. A positive result under the Stealth
    tactic indicates content engineered to evade inspection, and the analyst should correlate it with
    subsequent decode and execution activity.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'mu, sd = MEAN_STDDEV(entropy) BY extension, service

      ALERT WHERE entropy > mu + 3*sd OR entropy > 7.0

      ALERT WHERE max_window_entropy(sliding_scan(content)) > 7.2  // embedded blob'
- question: Does an Isolation Forest over file metadata (extension, size, whole-file and max-window entropy,
    byte-entropy histogram, source IP reputation, path) assign a file a high anomaly score, and which
    features explain it?
  context: Unsupervised anomaly detection generalizes beyond fixed entropy thresholds and is well suited
    to low-latency streaming triage. Score files with an Isolation Forest on extension, size, whole-file
    and maximum-window entropy, byte-entropy histogram, source IP reputation, and path; prioritize the
    highest anomaly scores and surface the top-3 contributing features so the analyst can judge whether
    the outlier reflects genuine encryption/encoding concealment. Isolation Forest provides fast unsupervised
    ranking that complements the deterministic and statistical entropy checks, catching novel combinations
    of metadata that individually look benign but jointly indicate a concealed payload consistent with
    the Stealth tactic.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'feat = [extension, size, file_entropy, max_window_entropy, byte_hist, src_ip_rep, path]

      score = IsolationForest.decision_function(feat)

      ALERT WHERE score IN top_anomalies REPORT top3_features(feat)'
- question: Do long Base64, hex, or Base32 strings (>1024 chars in commands/HTTP, or ~50+ chars in DNS
    labels) appear in process command lines, script-block logs, Zeek http.log POST bodies, or dns.log
    query labels — and do they co-occur with a decode primitive?
  context: Encoded strings in commands and network traffic are how adversaries smuggle payloads, keys,
    and configuration blobs past inspection, which is central to the Stealth tactic. Scan Event ID 4688/4104,
    Zeek http.log POST bodies, and dns.log query labels for Base64/hex/Base32 strings longer than 1024
    characters, lowering the DNS-label threshold to roughly 50+ characters given the 63-byte label limit
    that forces encoded C2/exfil into many small labels. Pair the detection with YARA encoding-wrapper
    rules so a decode primitive plus a long encoded operand fire together, sharply reducing false positives.
    A positive result points to encoded C2, staging, or exfiltration and should drive the analyst to decode
    the string and identify the channel.
  answer_sources: &id005
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Domain Name System (DNS) infrastructure, web proxies and gateways, user workstations, application
    servers, API gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'ALERT WHERE regex_match(field, ''base64|hex|base32'') AND len(blob) > 1024

      FROM [Event4688, Event4104, Zeek_http.post_body]

      ALERT WHERE len(dns_label) > 50 FROM Zeek_dns

      AND yara_match(encoding_wrapper_rules)'
- question: Are encoded-string length or entropy anomalous per context (per host, per URI path, per DNS
    parent domain), and are DNS NXDOMAIN rates or HTTP 4xx/5xx rates elevated for a source in a way that
    signals failed encoded C2 or exfil attempts?
  context: 'Baseline encoded-string length and entropy per context — per host, per URI path, and per DNS
    parent domain — and alert above the 99th percentile or when KL divergence versus natural language
    exceeds a threshold, isolating encoded blobs from ordinary long strings. Crucially, track failure-mode
    signals explicitly: a rising DNS NXDOMAIN rate or HTTP 4xx/5xx rate per source frequently betrays
    encoded C2 or exfiltration attempts against unregistered or misconfigured infrastructure, an early
    indicator before a channel succeeds. Under the Stealth tactic these statistics convert raw encoded
    traffic into prioritized leads, and a positive result should pivot the analyst to the implicated host,
    domain, or URI for decoding and blocking.'
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'p99 = PERCENTILE(len(encoded_str), 99) BY host, uri_path, dns_parent

      ALERT WHERE len > p99 OR kl_divergence(char_freq, natural_lang) > t

      ALERT WHERE nxdomain_rate BY src SPIKES OR http_4xx_5xx_rate BY src SPIKES'
- question: Does a forecaster of hourly encoded-data volume (bytes and event count) per channel flag a
    deviation outside its prediction interval, and does a per-string obfuscation classifier corroborate
    the verdict?
  context: Model hourly encoded-data volume — both byte volume and event count — per channel (host, URI,
    DNS domain) with Prophet or ARIMA and flag deviations outside the prediction interval, reporting the
    channel and the contributing strings. Volume forecasting catches slow-building or bursty encoded exfiltration
    and C2 that per-event thresholds miss. Combine it with a Revoke-Obfuscation-style classifier for a
    per-string verdict, surfacing the classifier's top features so the analyst can confirm that the volume
    spike is genuinely encoded malicious data rather than a benign batch job. This dual approach supports
    the Stealth investigation by tying anomalous volume to actual obfuscated content.
  answer_sources: *id005
  range: Last 90 days for training, evaluated hourly
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = HOURLY(SUM(encoded_bytes), COUNT(encoded_events)) BY channel

      model = Prophet.fit(series)

      ALERT WHERE observed OUTSIDE model.interval

      REPORT channel, top_strings, revoke_obfuscation_features(strings)'
- question: Within a 60-second window on the same host and process lineage, did a high-entropy file creation
    (>7.2) lead to a decode/decrypt process execution and then a new executable write or a low-reputation
    outbound connection — forming an unpack-and-execute chain?
  context: The strongest evidence of encrypted-payload abuse under the Stealth tactic is the full staged
    sequence, not any single artifact. Build a correlation rule that fires when a high-entropy file creation
    (normalized entropy >7.2) is followed by a decode/decrypt process execution and then by a new executable
    write or a low-reputation outbound connection within 60 seconds, all on the same host and process
    lineage. Anchor each stage on deterministic primitives — the entropy threshold, the decode regex,
    a new-PE-write event, and a conn.log connection to a rare external IP — so the chain is defensible.
    A positive result is a high-confidence unpacking detection that should trigger containment and full
    timeline reconstruction of the lineage.
  answer_sources: &id006
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User workstations, critical servers (e.g., Domain Controllers, database servers), network egress
    points, virtual desktop infrastructure (VDI) environments'
  range: Last 90 days, correlated within a 60-second event window per host/process lineage
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SEQUENCE BY host, process_lineage WITHIN 60s:\n  1) Event4663 WHERE norm_entropy > 7.2  (high-entropy\
      \ file write)\n  2) Event4688 WHERE is_decode(cmdline)  (decode/decrypt)\n  3) (new_pe_write OR\
      \ Zeek_conn TO rare_external_ip)\nALERT on full sequence"
- question: Does the cumulative weighted risk score of a process session — accruing points for Office-to-interpreter
    spawns, high-entropy writes, FromBase64String/certutil decodes, first-seen external IPs, and failed-then-successful
    decode retries — exceed the 99.5th percentile?
  context: Not every malicious chain completes cleanly, so a state-based risk model captures partial and
    retried sequences a strict correlation rule would miss. Assign weighted risk to chained events within
    a process session — Office spawning a script interpreter, a high-entropy file write, a FromBase64String
    or certutil decode, a first-seen external IP, and failed-then-successful decode retries — and alert
    when the cumulative session score exceeds the 99.5th percentile. Crucially, include the success/fail
    state of each decode and connection so that partial or aborted chains are scored distinctly from completed
    ones, giving the analyst graded prioritization. Under the Stealth tactic this surfaces attempts that
    are concealed across multiple low-signal steps rather than any single obvious event.
  answer_sources: *id006
  range: Last 90 days, scored per process session
  queries:
  - technology: SIEM/Stats pseudocode
    query: "score = SUM(weights[\n  office_spawns_interpreter, high_entropy_write, base64_or_certutil_decode,\n\
      \  first_seen_external_ip, failed_then_success_decode]) BY session\nALERT WHERE score > PERCENTILE(session_scores,\
      \ 99.5)\nREPORT per_stage_state(success/fail)"
- question: Does a provenance-graph model (Isolation Forest on subgraph features or a graph autoencoder)
    flag a process/file/network subgraph that mirrors known unpack-and-execute patterns, and which nodes
    or edges explain the anomaly?
  context: Adversaries vary timing and ordering to evade fixed correlation windows, so model the behavior
    structurally. Build process/file/network provenance graphs and apply an Isolation Forest on subgraph
    features or a graph autoencoder to detect subgraphs that mirror known unpack-and-execute sequences
    — a high-entropy file node feeding a decode-process node that produces a new executable or egress
    edge. Surface the top-3 contributing nodes and edges (the high-entropy file, the decode process, the
    egress IP) so the analyst gets an explainable starting point for triage. This graph view catches obfuscated
    staging that is distributed across events and reordered to evade linear rules, reinforcing the Stealth-tactic
    investigation with structural anomaly detection.
  answer_sources: *id006
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'G = build_provenance_graph(process, file, network events)

      subg = extract_subgraphs(G)

      score = IsolationForest(subgraph_features(subg))  // or graph_autoencoder(subg)

      ALERT WHERE score IN top_anomalies REPORT top3_nodes_edges(subg)'
