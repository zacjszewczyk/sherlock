name: 'T1102.003: One-Way Communication'
id: 89bf4056-7a71-4824-aba4-62fdd36cc6cc
description: 'Investigate potential adversary use of legitimate external web services (e.g., social media,
  code repositories, paste/text-sharing sites) as a one-way command-and-control channel, where a compromised
  host fetches instructions from a dead-drop resolver but returns little or no output over the same channel.
  This playbook helps an analyst hunt for: outbound connections to known malicious dead-drop domains/URLs/IPs
  identified by threat intelligence; connections to high-reputation services carrying anomalous metadata
  (rare User-Agents, high-entropy URI paths, malicious JA3/JA4 TLS fingerprints); non-browser processes
  and LOLBins initiating outbound web connections; beacon-like traffic with regular timing and small,
  consistent request sizes; and connections with anomalously low response-to-request byte ratios indicative
  of one-way check-ins. It spans symbolic-logic rules, statistical baselining/outlier detection, and machine-learning
  approaches across Windows, Linux, macOS, and ESXi endpoints plus network telemetry.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any internal host make an outbound connection to a known one-way dead-drop C2 channel
    (domain, URL, IP, or TLS fingerprint) listed in current threat-intelligence feeds, observed across
    Zeek conn, dns, ssl, and http logs?
  context: Adversaries hide one-way C2 instructions on popular file/text-sharing and social-media platforms
    because hosts routinely talk to them, providing cover. By ingesting CTI feeds of known dead-drop channels
    and matching responder IPs (conn.log id.resp_h), DNS queries (dns.log), TLS server names plus JA3/JA4
    client fingerprints (ssl.log), and HTTP host/uri (http.log) against the list, an exact match is a
    high-confidence indicator of Command and Control (TA0011). Enriching TLS matches with JA3/JA4 fingerprints
    of known implant tooling raises confidence; a positive match warrants immediate host triage, while
    a negative result does not exonerate—dead drops rotate, so combine with the statistical and ML methods
    below.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Enterprise Web Proxy, Egress Firewalls, and Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  cti = load_feed(dead_drop_indicators)\n  conn.log where id.resp_h in cti.ip\n  OR dns.log\
      \ where query in cti.domain\n  OR ssl.log where server_name in cti.domain OR ja3 in cti.ja3 OR ja4\
      \ in cti.ja4\n  OR http.log where host in cti.domain OR uri matches cti.uri\n  => alert(host=id.orig_h,\
      \ indicator)"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  lookup network_event against threat_intel(one_way_deaddrop)\n  match on dest_ip OR dns_query\
      \ OR tls_server_name OR ja3 OR ja4 OR http_host OR http_uri\n  | enrich ja3/ja4 with known_implant_tooling\n\
      \  | alert"
- question: Has any internal host shown an anomalous spike in connection volume or hourly request frequency
    to high-volume sharing/social services (pastebin.com, gist.github.com, raw.githubusercontent.com,
    mega.nz, t.me) relative to its own 30-day baseline?
  context: One-way C2 typically polls a dead-drop resource repeatedly. By baselining each host's 30-day
    connection count and per-hour request rate to popular sharing services and alerting when the daily
    count or hourly rate exceeds the host's own 99th percentile, the analyst surfaces hosts that suddenly
    poll these services far more than normal—consistent with Command and Control (TA0011). Benign periodic
    services (package mirrors, CI agents) must be allow-listed using periodicity baselines to reduce false
    positives. A spike above baseline is suspicious; a flat profile argues against active polling on these
    services.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Enterprise Web Proxy, Egress Firewalls, and Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for host, service in (pastebin, gist.github, raw.githubusercontent, mega.nz, t.me):\n\
      \    base = percentile(daily_count[host,service] over 30d, 99)\n    rate = percentile(hourly_count[host,service]\
      \ over 30d, 99)\n    if today_count > base OR this_hour_count > rate: alert\n  exclude allowlisted_periodic_services"
- question: Is any host generating a high ratio of failed fetches (DNS NXDOMAIN or HTTP 404/403/410) to
    a single sharing/social dead-drop host, consistent with polling for instructions that have not yet
    been posted?
  context: When an implant polls a dead drop before the operator posts a task, the fetches fail. Tracking
    per-host failure-state rates as a distinct signal—NXDOMAIN in dns.log and HTTP 404/403/410 in http.log—and
    alerting when the failed-fetch ratio to a single dead-drop host exceeds a baseline-derived threshold
    (e.g., >20% of requests over 1 hour) reveals this repeated-miss pattern characteristic of Command
    and Control (TA0011). A high miss ratio against one specific host/URL is suspicious; sporadic broad
    failures across many destinations are typically benign browsing or broken links.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Enterprise Web Proxy, Egress Firewalls, and Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  window = 1h\n  per (host, deaddrop_host):\n    fails = count(dns.log rcode==NXDOMAIN)\
      \ + count(http.log status in {404,403,410})\n    total = count(all requests)\n    if fails/total\
      \ > 0.20 AND total >= min_n: alert"
- question: Does the host-to-service connection graph reveal a rare external service acting as a shared
    hub for many internal hosts—a topology characteristic of a common dead drop?
  context: Shared dead drops produce a distinctive many-infected-hosts-to-one-rare-service pattern. Building
    a host-to-service bipartite graph from Zeek conn.log and applying a graph neural network surfaces
    these hub patterns; passive-DNS infrastructure-reuse clustering corroborates whether the service's
    infrastructure is freshly registered or reused across campaigns. This supports Command and Control
    (TA0011) by finding low-prevalence services that disproportionately many hosts contact. Emit the top
    contributing features (service rarity, shared-host count, domain age) so analysts can triage; a dense
    hub to a rare/young service is high-priority, while popular CDNs naturally form benign hubs and should
    be down-weighted.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Enterprise Web Proxy, Egress Firewalls, and Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  G = bipartite_graph(internal_host -> external_service, from conn.log)\n  scores = GNN(G).rank_service_hubs(features=[service_rarity,\
      \ shared_host_count, domain_age])\n  corroborate with passive_dns_reuse_cluster(service)\n  alert\
      \ top_hubs with SHAP_top3_features"
- question: Do any outbound HTTP/S connections to high-reputation web services carry anomalous metadata—rare
    or non-standard User-Agents, missing/abnormal header sets or ordering, malicious JA3/JA4 hashes, or
    C2-style URI patterns (e.g., '/raw/[A-Za-z0-9]{20,}', Malleable-C2 shapes)?
  context: Even when traffic goes to a trusted domain, the HTTP/TLS metadata of an implant often deviates
    from real browsers. Applying rules over Zeek http.log (rare User-Agent, abnormal header ordering/set)
    and ssl.log (known-malicious JA3/JA4), plus regexes for C2 URI shapes, detects one-way C2 hiding on
    legitimate services—core to Command and Control (TA0011). Malleable-C2 profiles deliberately mimic
    legitimate traffic, so header ordering and URI regexes catch what domain reputation alone misses.
    A match on malicious fingerprints or C2 URI shapes is strong; benign automation (some SDKs) can also
    produce odd User-Agents, so corroborate.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Enterprise Web Proxy and Egress Firewalls with TLS Inspection Capabilities'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  http.log where user_agent in rare_ua_list OR header_order != browser_profile\n    OR\
      \ uri matches '/raw/[A-Za-z0-9]{20,}' OR uri matches malleable_c2_patterns\n  OR ssl.log where ja3\
      \ in malicious_ja3 OR ja4 in malicious_ja4\n  on dest in high_reputation_services => alert"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  filter http to trusted_domains\n  | match user_agent against rare/known_bad\n  | match\
      \ header_set/ordering deviation\n  | regex uri for c2_patterns\n  | join tls ja3/ja4 malicious =>\
      \ alert"
- question: Are there connections to trusted domains where the User-Agent is exceedingly rare enterprise-wide
    and the URI path or inspectable payload has high Shannon entropy (~>7.0 bits/byte), deviating from
    the host's learned application profile?
  context: Encoded commands and encrypted payloads tend to have high entropy, and implants often use a
    User-Agent almost no other host uses. Computing Shannon entropy of http.log URI paths and any inspectable
    payload, plus enterprise prevalence of each User-Agent, and flagging connections to trusted domains
    where the UA is below the 5th percentile and entropy exceeds ~7.0 bits/byte surfaces hidden C2 channels—supporting
    Command and Control (TA0011). Comparing the header fingerprint to the host's learned profile reduces
    noise. High entropy plus a near-unique UA to a trusted domain is suspicious; legitimate API tokens
    in URLs can also be high-entropy, so weigh prevalence.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Enterprise Web Proxy and Egress Firewalls with TLS Inspection Capabilities'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for conn to trusted_domain:\n    ua_prev = enterprise_prevalence(user_agent)\n    h\
      \ = shannon_entropy(uri_path + inspectable_payload)\n    if ua_prev < p5 AND h > 7.0: \n      if\
      \ header_fingerprint deviates from host_app_profile: alert"
- question: Do TLS JA3/JA4 fingerprint clusters reveal small or newly-formed clusters, or hosts migrating
    from normal browser clusters to anomalous ones, indicating non-browser tooling reaching web services?
  context: Clustering JA3/JA4 hashes from ssl.log (DBSCAN/K-Means) groups clients by TLS stack; small
    or newly-formed clusters and hosts that drift from a browser cluster to an anomalous one indicate
    implant tooling—relevant to Command and Control (TA0011). Where TLS 1.3 hides handshake metadata,
    fall back to version-agnostic flow features (packet sizes, directions, timing, byte ratios). Surface
    the top cluster-distinguishing features in alert text. A host newly appearing in a tiny anomalous
    cluster while talking to web services is high-priority; large stable clusters are typically benign
    browsers.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Enterprise Web Proxy and Egress Firewalls with TLS Inspection Capabilities'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = ja3/ja4 hashes + flow_features(packet_sizes, directions, timing, byte_ratios) from\
      \ ssl.log\n  clusters = DBSCAN(X)  # or KMeans\n  flag small_or_new_clusters\n  flag hosts migrating\
      \ browser_cluster -> anomalous_cluster\n  alert with SHAP_top3_cluster_features"
- question: Did a watchlisted LOLBin (powershell.exe, rundll32.exe, mshta.exe, cscript.exe, curl.exe,
    certutil.exe, bitsadmin.exe)—especially from a non-standard path—initiate an outbound connection to
    ports 80/443, as seen by joining process creation (Windows EID 4688 / Sysmon EID 1) with network connections
    (Sysmon EID 3 / Zeek conn.log)?
  context: Processes that don't normally browse the web are a strong tell for C2. Joining Windows Event
    ID 4688 / Sysmon EID 1+3 with Zeek conn.log on source IP and time, then alerting when watchlisted
    LOLBins make outbound 80/443 connections—particularly from non-standard paths—detects living-off-the-land
    one-way C2, supporting Command and Control (TA0011). A signed system binary or scripting host reaching
    a public web service with no user-driven browsing context is suspicious; legitimate admin scripts
    and updaters can also use these binaries, so validate path, command line, and destination.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Workstations, Servers, and Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  proc = EID4688 OR Sysmon_EID1 where image in LOLBins\n  net  = Sysmon_EID3 OR Zeek conn.log\
      \ where dport in {80,443}\n  join proc, net on src_ip AND time_window\n  if proc.image_path not\
      \ in standard_paths OR proc.image in LOLBins: alert"
- question: Which {process, parent} tuples that initiate network connections are rare on a given host—especially
    system-critical binaries with no GUI—based on observed frequency and global rarity?
  context: Profiling each host's {process, parent} tuples that make network connections and computing
    their frequency lets the analyst flag low-prevalence combinations, such as a GUI-less system binary
    spawning outbound web traffic. Using global rarity across the fleet suppresses benign-but-uncommon
    noise. This statistical lineage scoring supports Command and Control (TA0011) by elevating anomalous
    process ancestry behind web connections. A rare tuple involving a non-interactive binary is suspicious;
    common admin tooling tuples are expected and should rank low.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Workstations, Servers, and Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for host: build freq[(process,parent)] for net-initiating procs\n  global_rarity = fleetwide_prevalence(process,parent)\n\
      \  score = low_local_freq * low_global_rarity\n  flag system_critical_no_gui binaries with high\
      \ score => alert"
- question: Does an unsupervised model flag a process's network behavior as anomalous based on features
    like process/parent name, command-line length and entropy, destination port, bytes sent/received,
    and connection count?
  context: Training an autoencoder (with an Isolation Forest baseline) on feature vectors—process name,
    parent, command-line length/entropy, destination port, bytes sent/received, connection count—and flagging
    high reconstruction/anomaly scores captures subtle deviations that rules miss, supporting Command
    and Control (TA0011). Including the top contributing features in the alert helps analysts judge relevance.
    A high anomaly score driven by, e.g., a system binary with a long high-entropy command line and small
    periodic outbound traffic is suspicious; routine software with normal feature profiles scores low.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Workstations, Servers, and Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  feats = [process, parent, cmdline_len, cmdline_entropy, dport, bytes_sent, bytes_recv,\
      \ conn_count]\n  model = Autoencoder(feats)  # baseline: IsolationForest\n  score = reconstruction_error(model,\
      \ feats)\n  if score > threshold: alert with SHAP_top3_features"
- question: Within any 1-hour window, does a source-destination pair show beacon-like behavior in Zeek
    conn.log—more than 10 connections with inter-arrival standard deviation under 1 second and average
    orig_bytes under 512?
  context: One-way C2 often beacons on a fixed schedule with small check-in requests. Within each 1-hour
    window, alerting when a source-destination pair has >10 connections where inter-arrival std dev is
    <1 second and avg orig_bytes <512 captures this robotic timing—directly supporting Command and Control
    (TA0011). Tight timing plus tiny requests is a classic beacon signature; legitimate keep-alives and
    polling apps can mimic it, so correlate with destination reputation and process context.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Egress Firewalls, Core Network Switches, and Network Taps'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  window = 1h\n  per (orig_h, resp_h):\n    n = count(conn)\n    if n > 10 AND stddev(inter_arrival)\
      \ < 1s AND avg(orig_bytes) < 512: alert"
- question: Does a source-destination pair score high on a combined beacon-regularity metric built from
    time-delta coefficient of variation, Bowley skewness, interval mode-density, and data-size consistency?
  context: A single timing rule misses jittered beacons. Computing, per source-destination pair, the time-delta
    coefficient of variation, Bowley skewness, interval mode-density, and data-size consistency, then
    combining them into a 0-1 beacon score and alerting above a tuned threshold (while excluding known
    benign periodic services) provides robust detection of Command and Control (TA0011). A high composite
    score indicates machine-like regularity; tuning and allow-listing benign periodic services (NTP, update
    checks) keeps false positives manageable.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Egress Firewalls, Core Network Switches, and Network Taps'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per (src,dst):\n    cv = stddev(deltas)/mean(deltas)\n    skew = bowley_skewness(deltas)\n\
      \    mode_density = interval_mode_density(deltas)\n    size_consistency = 1 - cv(orig_bytes)\n \
      \   beacon = combine(cv, skew, mode_density, size_consistency) in [0,1]\n    if beacon > threshold\
      \ AND dst not in benign_periodic: alert"
- question: Does frequency-domain analysis (FFT/autocorrelation) of a source-destination pair's connection
    timestamps reveal a dominant periodicity robust to jitter and missing observations?
  context: Transforming per-pair connection timestamps to the frequency domain (FFT/autocorrelation) and
    applying layered filtering detects a dominant beaconing period even when jitter or dropped connections
    obscure it in the time domain—strengthening Command and Control (TA0011) detection. Alternatively,
    single-flow time-series features can classify beaconing. A strong spectral peak at a consistent interval
    is a high-confidence beacon indicator; noisy, peak-less spectra suggest human-driven or irregular
    traffic.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Egress Firewalls, Core Network Switches, and Network Taps'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  per (src,dst):\n    ts = connection_timestamps\n    spectrum = FFT(binned(ts))  # or\
      \ autocorrelation\n    peak = layered_filter(spectrum)\n    if dominant_periodicity(peak): alert(period=peak.freq)"
- question: Are there established (SF) connections to ports 80/443 in Zeek conn.log where the response-to-request
    byte ratio is anomalously low (resp_bytes/orig_bytes < 1.1 with orig_bytes > 0), indicating one-way
    check-ins or exfil with little return content?
  context: Normal web browsing receives far more bytes than it sends; one-way C2 check-ins and small exfil
    invert or flatten this ratio. Filtering Zeek conn.log for SF (established) connections to 80/443 and
    alerting when resp_bytes/orig_bytes < 1.1 but orig_bytes > 0 captures connections that send data without
    a proportionate response—directly supporting Command and Control (TA0011). A consistently low ratio
    to an external web service is suspicious; some uploads and telemetry posts are legitimately low-ratio,
    so correlate with destination and process.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Egress Firewalls and Network Taps'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log where conn_state == 'SF' AND resp_p in {80,443}\n    AND orig_bytes > 0 AND\
      \ (resp_bytes/orig_bytes) < 1.1\n  => alert(host=id.orig_h, dest=id.resp_h)"
- question: Does a host's daily response-to-request byte ratio to web services deviate by more than two
    standard deviations from its 30-day rolling baseline, or show repeated zero-response connection failures
    (S0/REJ/RSTO)?
  context: Maintaining a 30-day rolling mean/standard deviation of each host's resp_bytes/orig_bytes ratio
    to web services and flagging any day deviating by more than two standard deviations detects shifts
    toward one-way communication—supporting Command and Control (TA0011). Jointly tracking connection-state
    outcomes (S0/REJ/RSTO) lets repeated zero-response attempts be scored as a distinct failure-mode signal,
    since a dead drop that is down or empty yields failed check-ins. A baseline-breaking ratio shift or
    a burst of failed states to one destination is suspicious; gradual, broad changes usually reflect
    normal usage drift.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Egress Firewalls and Network Taps'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for host: roll = mean/std of (resp_bytes/orig_bytes) over 30d to web_services\n  if\
      \ today_ratio deviates > 2*std from roll.mean: alert\n  also count conn_state in {S0,REJ,RSTO} per\
      \ (host,dst)\n  if repeated zero_response failures: alert(failure_mode)"
- question: Does an Isolation Forest (with encrypted-traffic embeddings for TLS flows) flag connections
    as anomalous based on byte-asymmetry and flow features such as resp_bytes/orig_bytes ratio, duration,
    orig_pkts, resp_pkts, and protocol/service?
  context: Training an Isolation Forest on flow features (resp_bytes/orig_bytes ratio, duration, orig_pkts,
    resp_pkts, protocol/service) gives low-latency unsupervised scoring of byte-asymmetry anomalies—supporting
    Command and Control (TA0011). For encrypted flows where ratios alone are weak, adding self-supervised
    encrypted-traffic embeddings and version-agnostic TLS flow features strengthens detection. Surface
    the top drivers per alert. A high anomaly score driven by lopsided byte ratios and unusual packet
    counts is suspicious; balanced, browser-like flows score low.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Egress Firewalls and Network Taps'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  feats = [resp_bytes/orig_bytes, duration, orig_pkts, resp_pkts, proto, service]\n  if\
      \ encrypted: feats += ssl_embeddings + version_agnostic_tls_flow_features\n  model = IsolationForest(feats)\n\
      \  if anomaly_score(model, feats) > threshold: alert with SHAP_top3_drivers"
