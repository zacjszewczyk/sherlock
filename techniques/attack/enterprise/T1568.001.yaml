questions:
- question: '[Command And Control] Fast flux TI correlation: Can you determine whether a DNS query for
    a domain or an outbound network connection to an IP address matches an entry on a high-confidence
    threat intelligence feed categorized as ''fast flux''. -- specifically, using the ''Fast flux TI correlation''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Command And Control tactic (TA0011), an adversary uses Fast Flux
    DNS to hide a command and control channel behind an array of rapidly changing IP addresses linked
    to a single domain resolution, using high-frequency round-robin IP rotation and very short TTLs (single-flux)
    or additionally rotating name-server/CNAME records (double-flux) to keep C2 infrastructure resilient
    and resistant to takedown. This evidence focuses on the condition that a DNS query for a domain or
    an outbound network connection to an IP address matches an entry on a high-confidence threat intelligence
    feed categorized as ''fast flux''. This Symbolic Logic approach works as follows: Ingest TI for known
    fast flux domains/IPs/ASNs and alert on matches with Zeek dns.log ''query''/''answers'' or conn.log
    ''id.resp_h''. Maintain a CDN/CGN allowlist (by registrar/ASN) to suppress benign low-TTL infrastructure
    as recommended in [CISA AA25-093A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-093a),
    and enrich matches with [Notos, Antonakakis et al.](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf)
    reputation features (distinct ASNs, BGP prefixes, registrar) to rank confidence. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable fast-flux C2 infrastructure;
    pivot to the resolving host(s), the responsible process and its parent lineage (Windows Event ID 4688)
    and outbound connections (Event ID 5156 / Zeek conn.log), the offending domain and its rotating IP/ASN
    set, the TTL and name-server behavior, and any data staged or exfiltrated over the channel. A negative
    result helps rule out this particular fast-flux vector but should be corroborated with the other questions
    in this playbook, since a single method can misclassify CDN/CGN traffic or miss low-and-slow rotation;
    always cross-check against the CDN/CGN allowlist and the other detection angles before escalating
    or dismissing.'
