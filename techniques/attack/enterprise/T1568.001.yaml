name: 'T1568.001: Fast Flux DNS'
id: d67f4666-c0e4-4f02-b9be-1ac534ccc420
description: 'This playbook helps an analyst investigate whether an adversary is using Fast Flux DNS to
  hide a command and control (C2) channel behind an array of rapidly changing IP addresses tied to a single
  domain, as part of the Command and Control tactic. Fast flux abuses round-robin A/AAAA record rotation
  and very short Time-To-Live (TTL) values (single-flux), and in the double-flux variant also rotates
  the authoritative Name Server (NS) and CNAME records, to make C2 infrastructure resilient and hard to
  take down. The hunt is primarily network/DNS-centric and spans Zeek dns.log and conn.log, corporate
  and external-facing DNS resolvers, the internet egress gateway, and endpoint correlation via Windows
  Event ID 4688 (process creation) and 5156 (network connection). It guides the analyst across several
  complementary angles: matching DNS queries and outbound connections against high-confidence fast-flux
  threat intelligence; detecting domains that resolve to a high count of unique IPs with low TTLs and
  high Autonomous System (AS)/geographic diversity within short windows; scoring answer-set churn, TTL
  distribution, and flux ratios with robust statistics; detecting double-flux through rapid NS/CNAME record
  changes; scoring FQDN randomness/entropy for DGA-style names that front fast-flux C2; and correlating
  DNS-query bursts with the resulting fan-out of outbound connections from an endpoint. Detection methods
  combine symbolic-logic rules, robust statistical baselining (modified z-score, percentile/quadrant thresholds),
  and machine-learning models (decision trees/Random Forests, DBSCAN, Isolation Forest, dynamic DNS-graph
  clustering) applied to DNS and flow telemetry. Throughout, the analyst maintains CDN/CGN allowlists
  by ASN/registrar to suppress benign low-TTL infrastructure and enriches matches with passive-DNS reputation
  features so that legitimate content-delivery networks are separated from genuine fast-flux C2.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command And Control
