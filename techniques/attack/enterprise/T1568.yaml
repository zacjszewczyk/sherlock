- question: '[Command and Control] TTL and answer count rule: Can you determine whether a DNS response
    (Zeek dns.log) for a single domain (`query`) contains an unusually high count of IP addresses in the
    `answers` field or an unusually low Time-To-Live (TTL) value in the `TTLs` field, which are characteristics
    of fast-flux DNS. -- specifically using the ''TTL and answer count rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), adversaries use Dynamic Resolution
    to algorithmically compute or rotate C2 endpoints so static blocking and takedowns fail. This evidence
    focuses on: A DNS response (Zeek dns.log) for a single domain (`query`) contains an unusually high
    count of IP addresses in the `answers` field or an unusually low Time-To-Live (TTL) value in the `TTLs`
    field, which are characteristics of fast-flux DNS. How to pursue it: Flag Zeek dns.log responses where
    any TTL in `TTLs` is <300 seconds while the `answers` array contains >5 unique IPs, the canonical
    fast-flux signature from [FluxBuster](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf).
    Additionally flag a single domain whose resolved IPs span >3 distinct /24 prefixes or ASNs. Tune thresholds
    to observed warm traffic (CDNs legitimately use short TTLs but stable ASNs). A positive result (a
    match, a statistical outlier, or a high-risk model score) is a strong lead that an internal host is
    contacting dynamically resolved C2 and warrants pivoting on the host''s process lineage and full DNS/connection
    history; a negative result reduces but does not eliminate suspicion, since adversaries tune jitter,
    wordlist DGAs, and CDN-style infrastructure to blend in. Retain the deterministic symbolic-logic floor
    even where statistical and ML layers run in parallel.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal DNS resolvers, Recursive DNS servers, Egress network gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from dns.log\nwhere min(TTLs) < 300 AND distinct(answers) > 5\n   OR distinct_24prefix(answers)\
      \ > 3 OR distinct_asn(answers) > 3\nexclude known_cdn_asns -> alert(query)"
