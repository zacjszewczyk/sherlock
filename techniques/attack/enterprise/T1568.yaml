questions:
- question: '[Command and Control] Dynamic-resolution TI correlation: Can you determine whether an internal
    host (`id.orig_h`) initiates a DNS query (`query`) or network connection (`id.resp_h`) to infrastructure
    associated with fast flux, DGA, or DNS-calculation C2, with the match corroborated by threat intelligence
    or resolver telemetry. -- specifically using the ''Dynamic-resolution TI correlation'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), adversaries use Dynamic Resolution
    to algorithmically compute or rotate C2 endpoints so static blocking and takedowns fail. This evidence
    focuses on: An internal host (`id.orig_h`) initiates a DNS query (`query`) or network connection (`id.resp_h`)
    to infrastructure associated with fast flux, DGA, or DNS-calculation C2, with the match corroborated
    by threat intelligence or resolver telemetry. How to pursue it: Real-time lookup each Zeek dns.log
    `query` and Zeek conn.log `id.resp_h` against threat-intelligence feeds of known dynamic-resolution,
    fast-flux, and DGA-C2 indicators (e.g., SUNBURST avsvmcloud[.]com and YARA/IOC sets in [CISA AA20-352A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-352a)).
    Alert on matches; this is the deterministic floor and must be retained even as ML is layered in parallel.
    A positive result (a match, a statistical outlier, or a high-risk model score) is a strong lead that
    an internal host is contacting dynamically resolved C2 and warrants pivoting on the host''s process
    lineage and full DNS/connection history; a negative result reduces but does not eliminate suspicion,
    since adversaries tune jitter, wordlist DGAs, and CDN-style infrastructure to blend in. Retain the
    deterministic symbolic-logic floor even where statistical and ML layers run in parallel.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Egress network gateways, internal DNS resolvers, and integrated Threat Intelligence Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from dns.log, conn.log

      let iocs = TI_feed(category in ["dynamic_resolution","fast_flux","dga_c2"])

      where query in iocs.domains OR id.resp_h in iocs.ips

      emit alert(host=id.orig_h, indicator=query|id.resp_h, source="TI")'
