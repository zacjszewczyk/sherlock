name: 'T1568: Dynamic Resolution'
id: f21b1c47-cf52-4d14-920e-20df8195f7f9
description: 'This playbook helps an analyst investigate whether an adversary is using Dynamic Resolution
  (T1568) to dynamically establish or maintain command-and-control (C2) infrastructure -- evading static
  blocklists and takedowns by algorithmically computing or rotating the domain names, IP addresses, or
  ports used for callbacks. It supports the Command and Control tactic and spans endpoint and network
  telemetry on ESXi, Linux, macOS, and Windows. The hunt covers several behavioral angles: DNS queries
  and connections matching threat-intelligence indicators of fast flux, domain generation algorithms (DGAs),
  and DNS-calculation C2; fast-flux DNS signatures such as low TTLs with large, geographically diverse
  answer sets spanning many /24s and ASNs; client-side fast flux where a single host resolves one domain
  to many IPs in minutes (T1568.001); algorithmically generated domains exhibiting high Shannon entropy,
  low n-gram probability, and NXDOMAIN bursts from DGA probing (T1568.002); DNS Calculation where a C2
  IP is derived from content fetched from a legitimate, abused web service (T1568.003); DNS-over-HTTPS
  (DoH) used as an encrypted beaconing channel; and spikes in queries to newly registered or low-prevalence
  domains used for ephemeral C2. Detection methods combine deterministic symbolic-logic rules, statistical
  baselining and anomaly thresholds, and machine-learning classifiers (lexical/passive-DNS reputation,
  fast-flux clustering, character-level deep models, and time-series beacon detectors) applied to Zeek
  dns/conn/ssl/http logs, Windows Event IDs 4688/5156, Sysmon, auditd, macOS unified logs, and ESXi syslog,
  so the analyst can corroborate suspected dynamic resolution against process lineage, DNS answer characteristics,
  beacon timing, and domain reputation.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
