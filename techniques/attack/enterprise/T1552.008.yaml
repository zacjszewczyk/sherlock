questions:
- question: '[Credential Access] Match chat credential tool hashes: Can you determine whether endpoint
    telemetry shows execution of tooling associated with stealing chat-application credentials or tokens,
    where process identity and intelligence context indicate likely credential access activity against
    collaboration platforms. -- specifically, using the ''Match chat credential tool hashes'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary directly collects
    unsecured credentials that users have shared or stored in chat and collaboration services (Teams,
    Slack, Exchange/Outlook email, Jira, Trello), then abuses those secrets for follow-on lateral movement
    or privilege escalation. This evidence focuses on the condition that endpoint telemetry shows execution
    of tooling associated with stealing chat-application credentials or tokens, where process identity
    and intelligence context indicate likely credential access activity against collaboration platforms.
    This Symbolic Logic approach works as follows: Query process creation logs (Windows Event ID 4688)
    against a threat intelligence watchlist of known malicious file hashes and process names associated
    with chat credential theft. Generate a high-priority alert on any direct match. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable harvesting of credentials
    exposed through chat/collaboration channels; pivot to the responsible process or principal and its
    lineage, the user and device or app identity involved, the specific chat data store, message, or API
    action touched, the exposed secret and the asset it unlocks, and any subsequent authenticated reuse
    of that credential. A negative result helps rule out this particular collection vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-and-slow, or living-off-the-land activity -- and because the secret may have been exposed through
    a channel or platform not covered by this specific evidence source.'
