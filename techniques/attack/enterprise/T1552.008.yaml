name: 'T1552.008: Chat Messages'
id: f0f9f3e4-c2d3-48d4-a563-a48b08698f21
description: 'This playbook helps an analyst investigate whether an adversary has collected unsecured
  credentials (passwords, API keys, OAuth/authentication tokens, connection strings, and private keys)
  that users have shared or stored in chat and collaboration services such as Microsoft Teams, Slack,
  Exchange/Outlook email, Jira, and Trello -- the behavior described by MITRE ATT&CK T1552.008, Chat Messages,
  under the Credential Access tactic. Rather than relying on a single vantage point, it spans the full
  kill-chain for this technique: endpoint execution of tooling that steals chat-client credentials or
  local token stores (Windows 4688/Sysmon 1), scripting engines (PowerShell, Python, cscript) that crawl
  chat data directories for secrets (4688/4104 script-block logs), unauthorized reads of chat-client local
  storage such as %APPDATA%\Microsoft\Teams\Local Storage\leveldb and %APPDATA%\Slack\storage (SACL-audited
  4663), anomalous network egress to chat-service FQDNs or typosquatted look-alike domains (Zeek conn/http/ssl/dns
  logs), and -- most importantly for the technique''s actual SaaS/Office Suite platforms -- first-party
  detection of credential-like content in message bodies and attachments (M365 unified audit log, Microsoft
  Purview DLP, Slack audit logs) and abnormal bulk message retrieval or illicit OAuth message-read grants
  (Slack/Okta/M365/Entra audit and consent logs). Detection methods combine deterministic symbolic-logic
  rules (regex/IOC matching, SACL allowlists, OAuth scope enumeration), statistical baselining (hash rarity,
  entropy scoring, first-seen profiling, volume and failure-burst anomalies), and machine-learning models
  (supervised classifiers, NLP/LLM contextual secret detection, DBSCAN clustering, time-series forecasting,
  and UEBA rare-feature scoring) so the analyst can corroborate suspected chat-credential theft across
  endpoint, network, and cloud/SaaS telemetry.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
