- question: When unsupervised rare-by-population jobs are run over CloudTrail, which principals show unusual
    API calls, user-command pairs, geographies, or high error-code rates, ranked by influencer?
  context: 'Rare-by-population ML over CloudTrail flags API calls, user-command pairings, geographies,
    and error-code rates that are unusual relative to the whole population of principals, ranking influencers
    so the alert names the rare action and identity. This surfaces automated cloud collection by compromised
    or rogue identities that individual baselines might miss. In the Collection tactic this prioritizes
    the rarest, most anomalous principal/action combinations. A positive result names a principal performing
    population-rare bulk actions; validate against legitimate automation and investigate the targeted
    data stores. Reference: [Detecting Threats in AWS CloudTrail Logs Using ML, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning)'
