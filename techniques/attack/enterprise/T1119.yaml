- question: When users, services, and activities are modeled as a dynamic graph with GNN embeddings, which
    principals touch services/objects outside their normal community (cross-service bulk reads/exports)?
  context: 'Modeling cloud users, services, and activities as a dynamic graph and learning GNN embeddings
    flags a principal that begins touching services or objects outside its normal community, e.g., an
    identity that suddenly performs cross-service bulk reads/exports. Surfacing the anomalous service
    edges as top contributors makes the alert explainable. This ties to the Collection tactic by detecting
    identities reaching into data stores they do not normally use. A positive result is a principal with
    new cross-community service edges; investigate which sensitive objects (S3, SharePoint/OneDrive, mailboxes)
    were accessed and why. Reference: [CS-GAD: Cloudy with a Chance of Anomalies](https://arxiv.org/html/2409.12726v1)'
