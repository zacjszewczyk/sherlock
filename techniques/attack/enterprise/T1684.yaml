name: 'T1684: Social Engineering'
id: 9dc42133-093a-4b0d-99de-69ba421ba0fa
description: 'This playbook helps an analyst investigate social engineering activity in which an adversary
  influences a user to take an action that results in unauthorized access, approval of changes, disclosure
  of sensitive information, or execution of adversary-supplied instructions while minimizing technical
  indicators. The core evidence pattern is an externally influenced user action that follows inbound contact
  deviating from the user''s normal workflow: OAuth consent grants, password resets or MFA factor changes
  through unapproved channels, security-control changes after a purported help-desk request, financial/wire
  approvals, external sharing, or execution of instructions copied from chat, ticket, or email (e.g.,
  ClickFix curl|bash, osascript, mshta). Strong evidence ties the inbound message, the sensitive action,
  and the short time delta between them, especially when the requester identity, domain, language, or
  caller voice is atypical or impersonated. Investigate across email and collaboration logs, web proxy,
  endpoint process/command execution, authentication and SaaS audit logs, and help desk ticketing to correlate
  communication events with follow-on sensitive actions.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
