questions:
- question: Did an external message, call, chat invite, or help-desk ticket occur shortly before a sensitive
    user-authorized action (link click, attachment open, callback, OAuth authorization, MFA factor add/reset,
    password reset, security-control change, external share, wire/financial approval, or execution of
    pasted instructions such as curl|bash, osascript, or mshta), all within a short window?
  context: 'This is the central sequence-based detection for social engineering. An adversary persuades
    a user to perform a privileged or risky action; the telltale signature is the short time delta between
    inbound external contact and the sensitive action. Build a timeline joining communication events to
    follow-on actions per user and alert when the gap is small (default <=30 minutes; tune to the environment''s
    median benign request-to-action delta). Cross-reference the sender, callback number, or chat handle
    against known-external domains, freemail providers, and unmanaged identities to catch impersonation
    and vendor-pretext activity. A positive result is a tight inbound-contact-to-sensitive-action pairing
    from an atypical requester; a negative result is an action with no preceding external contact or with
    an established, expected requester relationship. This supports the Stealth tactic because the adversary
    blends a malicious request into routine business communication, leaving few technical indicators beyond
    the behavioral sequence. References: [Detecting Credential Spearphishing Attacks in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
  answer_sources:
  - Email logs (Exchange, Microsoft 365 Unified Audit Logs)
  - Chat and collaboration logs (Teams, Slack, Zoom)
  - Web proxy logs
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - PowerShell logs (Event ID 4104)
  - Authentication logs (Okta, Azure AD, Active Directory Event ID 4624)
  - SaaS audit logs (OAuth consent grants, file sharing changes)
  - Help desk ticketing system logs
  - 'NAI: TBD'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join inbound_comm (email|chat|call|ticket WHERE sender_external=true) AS c\n  with sensitive_action\
      \ (oauth_authorize|mfa_reset|password_reset|secctrl_change|external_share|wire_approval|pasted_cmd_exec)\
      \ AS a\n  on c.user == a.user\nwhere a.time - c.time between 0 and 30m\nand (c.sender_domain in\
      \ external_domains or c.sender_domain in freemail or c.identity unmanaged)\nemit user, c.sender,\
      \ a.action, (a.time - c.time) as delta\nsort delta asc"
- question: Does a help-desk or support interaction (ticket text, caller identity, callback number, account-change
    request) fail to match the employee's normal support channels or asset ownership, particularly when
    it immediately precedes a password reset, MFA enrollment, or approval exception?
  context: 'Scattered Spider and similar actors routinely impersonate executives, vendors, or the service
    desk to trigger account changes. Correlate the ticket text, caller identity, callback number, and
    the requested account change against the employee''s historical support channels and assigned assets.
    Flag and gate any password reset, MFA factor enrollment, or approval exception that follows a message
    claiming executive/vendor/service-desk authority; require a callback to the number on record plus
    manager approval before completion. A positive result is a help-desk-driven security change where
    the requester or callback number is inconsistent with records. This is a Stealth concern because the
    adversary leverages a legitimate, trusted workflow to obtain access without tripping technical controls.
    References: [CISA/FBI Scattered Spider advisory AA23-320A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-320a).'
  answer_sources:
