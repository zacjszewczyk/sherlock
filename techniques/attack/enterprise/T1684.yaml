    query: "for each sender s: baseline = profile(stylometry, mua_fingerprint, send_hour, recipient_set,\
      \ window=180d)\nfor each new_email e from s:\n  d_style = stylometry_distance(e, baseline.stylometry)\n\
      \  d_struct = mua_fingerprint_distance(e, baseline.mua_fingerprint)\n  d_recip = recipient_set_unlikelihood(e.recipients,\
      \ baseline.recipient_set)\n  if any(d_style, d_struct, d_recip) > sender_threshold:\n    emit alert(\"\
      per-sender deviation / possible account compromise\", s, e)"
- question: Are there spikes in failure-state signals such as failed logons after a help-desk reset, MFA-fatigue
    prompts per user per minute, blocked/quarantined sends, or NXDOMAIN/404 on lure URLs, or a consent
    burst where one uncommon app is consented by abnormally many users in a short window?
  context: 'Failure states are distinct, high-value signals often discarded as noise. Profile failed-logon
    spikes after a help-desk reset, MFA-fatigue prompt counts per user per minute, blocked/quarantined
    send attempts, and NXDOMAIN/404 rates on lure URLs. Alert on consent bursts: the same uncommon app
    consented by an abnormal number of users within a short window. Fuse per-signal scores adaptively
    per organization. A positive result is a measurable surge in one of these failure/consent metrics
    coinciding with social-engineering activity. This supports Stealth detection by catching the residue
    of manipulation campaigns even when each individual action appears authorized. References: [Investigate
    and Remediate Risky OAuth Apps](https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-risky-oauth);
    [A Modular and Adaptive System for Business Email Compromise Detection](https://arxiv.org/abs/2308.10776).'
