      , e.from_domain, d)\n  if e.display_name in known_display_names\n     and e.from_address not in\
      \ seen_addresses_for(e.display_name):\n    emit alert(\"display_name_spoof\", e.display_name, e.from_address)"
- question: Did a third-party OAuth app from an unverified publisher request high-privilege delegated
    scopes, or did an OAuth consent grant, MFA factor activation, or password reset occur shortly after
    an inbound external message, invite, or help-desk contact?
  context: 'Illicit consent grants let adversaries gain persistent access to mail and files without stealing
    credentials. Block or hold OAuth apps from unverified publishers requesting high-privilege delegated
    scopes (mail.read, files.readwrite.all, offline_access), and alert when a consent grant, MFA factor
    activation, or password reset follows inbound external contact. Pivot on concrete log fields: app.oauth2.authorize,
    ConsentToApplication, user.mfa.factor.activate, user.account.reset_password. A positive result is
    a high-privilege consent or auth change tied to a recent external prompt. This is a Stealth concern
    because consent abuse looks like a legitimate user-authorized grant rather than an intrusion. References:
    [Investigate and Remediate Risky OAuth Apps](https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-risky-oauth).'
  answer_sources:
