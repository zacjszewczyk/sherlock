  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_user_and_peergroup_daily_counts(action in sensitive_actions, window=90d)\n\
      for user, day:\n  score = chi_squared(observed=today_count, expected=baseline.mean)\n  pct = percentile(today_count,\
      \ baseline.distribution)\n  if pct > 99 or score > threshold:\n    weight = boost_if(new_requester,\
      \ off_hours, new_device)\n    emit alert(user, action, pct, weight)"
- question: When ranked by Directed Anomaly Scoring across sender-domain novelty, first-contact, and URL/click
    reputation, which inbound-message-plus-follow-on-action events are more suspicious than all benign
    events?
  context: 'Directed Anomaly Scoring (DAS) is a non-parametric method that surfaces only events more suspicious
    than all benign events along chosen axes, bounding analyst review to a fixed daily budget (~10 alerts/day)
    while retaining high recall. Score inbound-message + follow-on-action events on sender domain novelty,
    first-contact status, and URL/click reputation, then present the top events within budget. Tune the
    budget to local volume rather than a fixed score threshold. A positive result is an event that dominates
    all benign comparators on the suspicion axes. This serves Stealth detection by efficiently prioritizing
    the rare manipulative communications hidden in high-volume legitimate traffic. References: [Ho et
    al. 2017](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
  answer_sources:
