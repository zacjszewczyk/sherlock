      \     and event.scopes intersects {mail.read, files.readwrite.all, offline_access}):\n    block_or_hold(event)\n\
      \  if exists inbound_external (message|invite|helpdesk) for event.user within 30m before event:\n\
      \    raise alert(\"guardrail: auth/consent change after external contact\", event)"
- question: Is a user performing high-privilege actions (password resets, security-control changes, large/external
    file shares, consent grants, financial approvals) at a frequency or timing that exceeds their own
    and their peer group's baseline?
  context: 'Statistical baselining surfaces users showing unusual compliance with outside requests. Baseline
    the frequency and timing of high-privilege actions per user and peer group, then use chi-squared or
    percentile-based scoring (alert above the per-group 99th percentile per day) to flag outliers. Weight
    new requester relationships, off-hours timing, and new-device context. A positive result is a user
    whose sensitive-action rate or timing sharply diverges from peers, suggesting they were induced to
    act. This addresses Stealth by detecting the behavioral footprint of manipulation even when individual
    actions look legitimate. References: [Detecting Credential Spearphishing Attacks in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
  answer_sources:
