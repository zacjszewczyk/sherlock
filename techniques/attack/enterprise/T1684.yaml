      \ burst\", a)\nfused = adaptive_fuse(per_signal_scores, per_org_weights)\nemit alert where fused\
      \ > threshold"
- question: Does NLP scoring of inbound email, chat, and ticket text reveal urgency, coercion, authority
    pressure, or out-of-band request patterns that correlate with a follow-on sensitive user action?
  context: 'A transformer-based classifier can score communication text for the persuasion tactics characteristic
    of social engineering: urgency, coercion, authority pressure, and out-of-band requests. Correlate
    model output with follow-on user actions so investigators focus on communications most likely to have
    induced a sensitive action. Surface the top-3 contributing tokens/features in the alert via LIME/attention
    attribution and named-deception-indicator rationale for explainability. A positive result is high-scoring
    manipulative text immediately preceding a sensitive action. This addresses Stealth by reading the
    social-engineering intent that technical indicators alone miss. References: [An Explainable Transformer-based
    Model for Phishing Email Detection](https://arxiv.org/abs/2402.13871); [ChatSpamDetector](https://arxiv.org/abs/2402.18093).'
