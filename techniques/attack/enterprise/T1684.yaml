- question: Are there lookalike sender domains, display names, or brand strings that defeat edit-distance
    matching but score as visually similar when rendered to images and compared with a Siamese neural
    network?
  context: 'Unicode homoglyph substitution can produce strings that are visually identical to a trusted
    brand yet lexically distant, defeating edit-distance rules. Render each sender domain, display name,
    and brand string to an image and score visual similarity with a Siamese convolutional network, layering
    this beneath the deterministic edit-distance rules. A positive result is a sender that looks like
    a trusted identity to the human eye but uses substituted unicode glyphs. This is a Stealth detection
    because visual impersonation is engineered specifically to pass casual human inspection and avoid
    suspicion. References: [Detecting Homoglyph Attacks with a Siamese Neural Network](https://arxiv.org/abs/1805.09738).'
