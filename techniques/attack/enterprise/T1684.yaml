  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each helpdesk_ticket t involving (password_reset|mfa_enroll|approval_exception):\n  if\
      \ t.callback_number not in employee_record(t.user).phones\n     or t.caller_identity != employee_record(t.user).manager_chain\n\
      \     or t.requested_asset not in asset_owner(t.user):\n    raise alert(require_callback_on_record\
      \ + manager_approval)\n  if exists message m claiming exec/vendor/servicedesk within 60m before\
      \ t:\n    raise alert(\"impersonation pretext -> account change\")"
- question: Did inbound mail for protected domains fail DMARC identifier alignment, SPF, or exhibit header
    anomalies such as multiple/ambiguous From headers or RFC5321-vs-RFC5322 mismatches?
  context: 'Email authentication provides a deterministic floor against spoofed senders. Enforce DMARC
    identifier alignment over SPF and quarantine/reject misaligned mail for protected domains. Because
    MTA/client parser ambiguities can forge aligned mail, re-parse and normalize headers to flag multiple
    or ambiguous From headers and envelope-vs-header (RFC5321 vs RFC5322) mismatches. Treat SPF fail/softfail
    and DMARC misalignment as distinct failure-state signals rather than dropping events silently. A positive
    result is a misaligned or structurally ambiguous message impersonating a trusted domain. This counters
    Stealth by exposing the spoofing technique adversaries use to make malicious requests appear routine.
    References: [RFC 7489](https://www.rfc-editor.org/rfc/rfc7489); [RFC 7208](https://www.rfc-editor.org/rfc/rfc7208);
    [Composition Kills](https://www.usenix.org/conference/usenixsecurity20/presentation/chen-jianjun).'
