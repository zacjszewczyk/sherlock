      \ alert(t, score, phrases)"
- question: Does a classifier over first-party mail-log features (recipient-set unlikelihood vs sender
    history, URL reputation, phishing-intent text, stylometric/social features) flag compromised-internal-account
    pretexting or text-only BEC?
  context: 'Lateral phishing from compromised internal accounts and text-only BEC evade content filters.
    Train a classifier (e.g., random forest) over first-party mail-log features: recipient-set unlikelihood
    versus the sender''s historical contacts, URL reputation, and phishing-intent text, complemented by
    body-only stylometric/social features for text-only BEC. Report contributing features per alert. A
    positive result is internal mail whose recipient pattern, links, or language match learned phishing
    behavior at low false-positive rates. This supports Stealth detection because attacks from genuine
    accounts otherwise carry no spoofing indicators. References: [Detecting and Characterizing Lateral
    Phishing at Scale](https://www.usenix.org/conference/usenixsecurity19/presentation/ho); [Analyzing
    Social and Stylometric Features to Identify Spear Phishing Emails](https://arxiv.org/abs/1406.3692).'
