    query: 'events = inbound_message_join_followon_action(window=90d)

      features = [sender_domain_novelty, first_contact, url_click_reputation]

      ranked = directed_anomaly_score(events, features)   # keep events not dominated by any benign event

      budget = local_daily_volume_budget()                 # ~10/day, tuned to volume

      emit top(ranked, budget)'
- question: Does an inbound message deviate from the sender's per-sender baseline of writing style, composition
    (X-Mailer/MIME/header layout, send-hour), or recipient set, indicating pretexting from a compromised-but-genuine
    internal account?
  context: 'Compromised internal accounts are powerful for social engineering because they are trusted.
    Build per-sender baselines of writing style (stylometry), composition (X-Mailer/MIME/header layout,
    send-hour), and interaction (recipient set), and flag deviations. Add content-agnostic structural/MUA
    fingerprint profiles that flag spoofed mail at very low false-positive rates, and recipient-set-unlikelihood
    scoring for lateral pretexting. A positive result is mail attributed to a known sender whose style,
    structure, or recipient choice no longer matches their history. This counters Stealth because adversaries
    riding a legitimate account otherwise blend perfectly into normal correspondence. References: [That
    Ain''t You: Blocking Spearphishing Through Behavioral Modelling](https://seclab.bu.edu/people/gianluca/papers/spearphishing-dimva2015.pdf);
    [Reading Between the Lines](https://seclab.bu.edu/people/gianluca/papers/spearphishing-dimva2015.pdf);
    [Detecting and Characterizing Lateral Phishing at Scale](https://www.usenix.org/conference/usenixsecurity19/presentation/ho).'
