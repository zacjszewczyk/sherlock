  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each inbound_email e:\n  spf = eval_spf(e)\n  dmarc = eval_dmarc_alignment(e)   # alignment\
      \ over SPF\n  if e.to_domain in protected_domains and dmarc != \"aligned\":\n    action = quarantine_or_reject;\
      \ emit signal(\"dmarc_misalign\")\n  if count(parse_all_from_headers(e)) > 1 or ambiguous_from(e):\n\
      \    emit signal(\"ambiguous_from\")\n  if e.rfc5321_from.domain != e.rfc5322_from.domain:\n   \
      \ emit signal(\"5321_5322_mismatch\")\n  if spf in (fail, softfail): emit signal(\"spf_\"+spf)"
- question: Are inbound sender or display domains lookalikes of protected brand/partner domains, within
    edit distance 1-2, known typosquat transforms, or display-name spoofs pairing a known name with a
    never-before-seen address?
  context: 'Adversaries register lookalike domains and spoof display names to build trust. Flag inbound
    sender/display domains within Levenshtein/Damerau edit distance 1-2 of protected brand and partner
    domains, and known typosquat transforms (omission, permutation, substitution, insertion, homophone,
    TLD swap). Additionally flag display-name spoofing where a known display name pairs with a never-before-seen
    From address. A positive result is a sender that is visually or lexically close to a trusted identity
    but is not the genuine domain/address. This is a Stealth detection because impersonation lets the
    adversary mimic legitimate correspondents and avoid suspicion. References: [The Landscape of Domain
    Name Typosquatting](https://arxiv.org/abs/1603.02767); [Ho et al. 2017](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
