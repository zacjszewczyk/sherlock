      \ score > threshold and exists sensitive_action(comm.user) within 60m after comm:\n    emit alert(comm,\
      \ score, top_tokens[:3])"
- question: Do email or chat transcripts exhibit escalating pressure, repeated follow-up requests, or
    authority-impersonation cues that precede a user-authorized action such as MFA reset, external sharing,
    or OAuth consent?
  context: 'Beyond single-message scoring, conversation-level modeling captures escalation. Score email
    and chat transcripts for escalating pressure, repeated follow-up requests, and authority-impersonation
    cues, prioritizing conversations whose model output aligns with a sensitive action. Emit the specific
    phrases driving the score for analyst review. A positive result is a multi-turn conversation with
    rising pressure that culminates in a privileged action. This is a Stealth detection because persistent,
    polite-seeming pressure campaigns are designed to look like normal back-and-forth while steering the
    victim toward the adversary''s goal. References: [An Explainable Transformer-based Model for Phishing
    Email Detection](https://arxiv.org/abs/2402.13871).'
