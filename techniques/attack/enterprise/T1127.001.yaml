    off the Land Techniques, CISA/NSA/FBI](https://www.cisa.gov/sites/default/files/2024-02/Joint-Guidance-Identifying-and-Mitigating-LOTL_V3508c.pdf).
    A positive result indicates MSBuild behavior inconsistent with approved developer/build activity on
    this host or fleet — pivot to the originating user, parent process, project file, dropped artifacts,
    child processes, and downstream network destinations; a negative result means the observed MSBuild
    execution aligns with established baselines. Investigate the named area of interest (Developer workstations,
