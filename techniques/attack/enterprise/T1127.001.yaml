name: 'T1127.001: Trusted Developer Utilities Proxy Execution: MSBuild'
id: 5969286e-d564-4214-9908-fea5543ac349
description: 'This playbook helps an analyst determine whether an adversary is abusing MSBuild.exe (the
  Microsoft Build Engine) to proxy execution of malicious code through a signed, trusted Windows developer
  utility (T1127.001), bypassing application-control defenses configured to allow MSBuild. Because MSBuild
  can compile and run inline C#/VB tasks embedded in XML project files, adversaries use it as a living-off-the-land
  binary to execute arbitrary code while appearing as legitimate build activity. Investigative angles
  include: MSBuild launched from non-canonical paths or referencing project files in user-writable/temporary
  directories or non-build extensions; command lines containing inline-task markers (UsingTask, CodeTaskFactory,
  RoslynCodeTaskFactory, <Code Language=) or large Base64/hex blobs; high command-line length/entropy;
  MSBuild spawned by non-developer parents (Office, browser, email, scripting hosts); suspicious child-process
  chains; file writes of new PE/DLL/script artifacts; and outbound connections exhibiting beaconing, DGA-like
  lookups, rare destinations, or abnormal transfer volume. It correlates Windows Security 4688 and Sysmon
  process, file, and network telemetry with Zeek conn/dns/ssl flow records. Detection blends symbolic-logic
  rules, statistical baselining (percentiles, Shannon/KL entropy, z-scores, beacon periodicity), and machine
  learning (Random Forest/Gradient Boosting, Isolation Forest, parent-child graph models, NLP/SLM command-line
  classifiers, time-series forecasting) to produce evasion-resistant, explainable alerts supporting both
  the Stealth/Defense-Evasion and Execution tactics.'
type: technique
