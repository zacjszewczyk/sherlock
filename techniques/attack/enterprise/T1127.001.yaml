    Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/) and [Identifying and Mitigating Living
    off the Land Techniques, CISA/NSA/FBI](https://www.cisa.gov/sites/default/files/2024-02/Joint-Guidance-Identifying-and-Mitigating-LOTL_V3508c.pdf).'
  context: 'Tactic context (Execution / TA0002): adversaries abuse the signed MSBuild.exe binary to proxy
    execution of arbitrary code and bypass application control, blending into legitimate build activity.
    Evidence under investigation: MSBuild.exe is launched from a project file or inline task and then
    creates suspicious child processes or outbound network traffic that does not align with approved build
    activity on the host. Profile the full behavior chain: process launch, child spawn (success/fail),
    file writes, and connection success vs blocked/refused. Approach (Developer baseline allowlist gate):
    Require the MSBuild parent process, working directory, signed-project source path, and destination
    domain to align with approved developer/build-server profiles; alert when any single control fails,
    treating signed-binary presence as insufficient and demanding behavioral context, per [LOLBins Abuse,
