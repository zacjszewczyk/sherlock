questions:
- question: 'Using a symbolic logic approach, can you determine whether ''Correlate MSBuild launches and
    flow data'' indicates abuse of MSBuild.exe for trusted-developer-utility proxy execution? Specifically:
    Join 4688/Sysmon-1 msbuild.exe process events with Sysmon-3/Zeek conn/dns/ssl records within a 5-minute
    window and alert when MSBuild launches from a non-canonical path (outside C:\Windows\Microsoft.NET\Framework[64]\v*\),
    then spawns child shells/script hosts (cmd, powershell, wscript, cscript, mshta, rundll32) or reaches
    a rare external destination, per [Msbuild (LOLBAS Project)](https://lolbas-project.github.io/lolbas/Binaries/Msbuild/)
    and [SigmaHQ Generic Signature Format for SIEM Systems](https://github.com/SigmaHQ/sigma).'
  context: 'Tactic context (Stealth / TA0005): adversaries abuse the signed MSBuild.exe binary to proxy
    execution of arbitrary code and bypass application control, blending into legitimate build activity.
    Evidence under investigation: MSBuild.exe is launched from a project file or inline task and then
    creates suspicious child processes or outbound network traffic that does not align with approved build
    activity on the host. Profile the full behavior chain: process launch, child spawn (success/fail),
    file writes, and connection success vs blocked/refused. Approach (Correlate MSBuild launches and flow
    data): Join 4688/Sysmon-1 msbuild.exe process events with Sysmon-3/Zeek conn/dns/ssl records within
    a 5-minute window and alert when MSBuild launches from a non-canonical path (outside C:\Windows\Microsoft.NET\Framework[64]\v*\),
    then spawns child shells/script hosts (cmd, powershell, wscript, cscript, mshta, rundll32) or reaches
    a rare external destination, per [Msbuild (LOLBAS Project)](https://lolbas-project.github.io/lolbas/Binaries/Msbuild/)
    and [SigmaHQ Generic Signature Format for SIEM Systems](https://github.com/SigmaHQ/sigma). A positive
    result indicates MSBuild behavior inconsistent with approved developer/build activity on this host
    or fleet — pivot to the originating user, parent process, project file, dropped artifacts, child processes,
    and downstream network destinations; a negative result means the observed MSBuild execution aligns
    with established baselines. Investigate the named area of interest (Developer workstations, CI/CD
    build servers, Internet gateway, Egress points) and corroborate across host process, file, and network
    telemetry.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Developer workstations, CI/CD build servers, Internet gateway, Egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Correlate MSBuild process and flow data\nJOIN proc(4688|Sysmon-1 image=msbuild.exe) p\n\
      \  WITH net(Sysmon-3|zeek conn/dns/ssl) n ON p.host=n.host AND |p.time-n.time|<=5m\nALERT WHEN p.path\
      \ NOT LIKE 'C:\\Windows\\Microsoft.NET\\Framework*\\v*\\'\n  AND (child IN [cmd,powershell,wscript,cscript,mshta,rundll32]\n\
      \       OR n.dest IS rare_external_destination)"
