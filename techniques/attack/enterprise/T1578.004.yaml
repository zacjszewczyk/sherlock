name: 'T1578.004: Modify Cloud Compute Infrastructure: Revert Cloud Instance'
id: e9772027-d10b-4e71-89b3-8bfabbb6dd84
description: 'This playbook helps an analyst investigate whether an adversary is reverting a cloud compute
  instance -- restoring a VM or data-storage snapshot, resetting an instance, or relying on ephemeral
  storage resets -- to evade detection and erase evidence of prior malicious activity, as part of the
  Defense Impairment tactic. When an instance is reverted, host-based forensic artifacts and logs from
  the period of intrusion are silently rolled back, the system clock can jump backward, and the host may
  restart or stop reporting telemetry. The playbook guides the analyst across several corroborating angles:
  cloud audit-log evidence of snapshot-restore, instance-reset, and storage-type-change API calls (AWS
  CloudTrail RestoreSnapshot/StartInstances/StopInstances, Azure ''Restore-AzVM'', GCP ''compute.instances.reset'')
  correlated with an unexpected Windows shutdown (Event ID 1074) or loss of heartbeat; first-seen and
  frequency baselining of revert-related API calls per principal; network evidence of anomalous connections
  or data volume to cloud management API endpoints and the instance metadata service (169.254.169.254)
  just before a host goes dark; verifiable gaps in host-based logs that begin at a restart and mask confirmed
  malicious activity; system-time rollbacks (Event ID 4616 where NewTime precedes PreviousTime) indicative
  of a snapshot restore; and unexpected restarts or sudden cessation of all network flows shortly after
  a high-severity EDR/IDS alert. Detection methods combine symbolic-logic correlation rules, statistical
  baselining (first-seen, modified Z-score, percentile thresholds, time-series forecasting), and machine-learning
  models (Random Forest, graph neural networks, LSTM forecasting, DBSCAN clustering, and Bayesian/Markov
  sequence scoring) applied to AWS CloudTrail, Azure Activity Logs, Google Cloud Audit Logs, Zeek conn/dns
  logs, and Windows event logs (1074, 4616, 4624, 4688, 6005, 6006), so the analyst can prove or disprove
  an evidence-destroying cloud reversion against multiple independent data sources.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
