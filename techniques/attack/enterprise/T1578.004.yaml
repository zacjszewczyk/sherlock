questions:
- question: '[Defense Impairment] Snapshot restore correlation with shutdown: Can you determine whether
    evidence of a cloud snapshot restoration, instance state reset, or storage type modification (e.g.,
    ''Restore-AzVM'', ''ec2 restore-snapshot'', ''gcloud compute instances reset'') found in cloud provider
    audit logs, or a process creation event (Windows Event ID 4688) on a host containing similar command-line
    arguments, followed within a 30-minute window by a system shutdown event (Windows Event ID 1074) or
    loss of heartbeat from the same host. -- specifically, using the ''Snapshot restore correlation with
    shutdown'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary reverts a cloud
    compute instance after malicious activity -- restoring a snapshot, resetting the instance, or exploiting
    ephemeral storage -- to roll back forensic artifacts, remove evidence of their presence, and re-establish
    a clean execution state for persistence. This evidence focuses on the following observable: Evidence
    of a cloud snapshot restoration, instance state reset, or storage type modification (e.g., ''Restore-AzVM'',
    ''ec2 restore-snapshot'', ''gcloud compute instances reset'') found in cloud provider audit logs,
    or a process creation event (Windows Event ID 4688) on a host containing similar command-line arguments,
    followed within a 30-minute window by a system shutdown event (Windows Event ID 1074) or loss of heartbeat
    from the same host. This Symbolic Logic approach works as follows: Monitor cloud audit logs for revert/snapshot-restore
    and instance-reset API events (e.g., AWS RestoreSnapshotFromRecycleBin/CreateSnapshot then RunInstances,
    StopInstances/StartInstances; Azure ''Restore-AzVM''; GCP ''compute.instances.reset'') and alert when
    the same instance emits an unexpected Windows Event ID 1074 or stops sending telemetry within 30 minutes,
    using vendor-neutral CloudTrail rule logic from [SigmaHQ Repository](https://github.com/SigmaHQ/sigma)
    and [Elastic Detection Rules - AWS](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws).
    Suppress events inside approved change windows and known automation principals via stateful allow-lists
    as in [Panther Analysis](https://github.com/panther-labs/panther-analysis). Validate rule coverage
    with emulation from [Stratus Red Team, DataDog](https://github.com/DataDog/stratus-red-team) and [Pacu](https://github.com/RhinoSecurityLabs/pacu).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable evidence-destroying
    reversion; pivot to the responsible principal/role and source IP, the affected instance and its snapshot
    lineage, the correlated host shutdown/restart or telemetry gap, and any malicious activity that the
    revert may have erased, and confirm whether it occurred inside an approved change window or was performed
    by sanctioned automation. A negative result helps rule out this particular reversion vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy
    activity that hides inside legitimate change-management or automation workflows.'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Windows Event ID 4688
  - Windows Event ID 1074
  - 'NAI: Cloud provider audit log streams (e.g., CloudTrail, Azure Monitor); Cloud-hosted virtual machines
    (Windows); Centralized SIEM/Log Management Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM cloud_audit WHERE eventName IN (\"RestoreSnapshotFromRecycleBin\",\"CreateSnapshot\"\
      ,\"RunInstances\",\"StopInstances\",\"StartInstances\",\"Restore-AzVM\",\"compute.instances.reset\"\
      )\n| JOIN windows_events e ON e.instanceId = cloud_audit.instanceId\nWHERE (e.EventID == 1074 OR\
      \ e.heartbeat_lost == true)\n  AND e._time BETWEEN cloud_audit._time AND cloud_audit._time + 30m\n\
      \  AND principal NOT IN approved_automation AND _time NOT IN change_window\n| ALERT \"Snapshot revert\
      \ followed by host shutdown/telemetry loss\""
- question: '[Defense Impairment] First-seen revert API per principal: Can you determine whether evidence
    of a cloud snapshot restoration, instance state reset, or storage type modification (e.g., ''Restore-AzVM'',
    ''ec2 restore-snapshot'', ''gcloud compute instances reset'') found in cloud provider audit logs,
    or a process creation event (Windows Event ID 4688) on a host containing similar command-line arguments,
    followed within a 30-minute window by a system shutdown event (Windows Event ID 1074) or loss of heartbeat
    from the same host. -- specifically, using the ''First-seen revert API per principal'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary reverts a cloud
    compute instance after malicious activity -- restoring a snapshot, resetting the instance, or exploiting
    ephemeral storage -- to roll back forensic artifacts, remove evidence of their presence, and re-establish
    a clean execution state for persistence. This evidence focuses on the following observable: Evidence
    of a cloud snapshot restoration, instance state reset, or storage type modification (e.g., ''Restore-AzVM'',
    ''ec2 restore-snapshot'', ''gcloud compute instances reset'') found in cloud provider audit logs,
    or a process creation event (Windows Event ID 4688) on a host containing similar command-line arguments,
    followed within a 30-minute window by a system shutdown event (Windows Event ID 1074) or loss of heartbeat
    from the same host. This Statistical Method approach works as follows: Flag the first-ever revert/snapshot
    API call (RestoreSnapshot, StartInstances, ResetInstance) by a given principal/role over a 90-day
    lookback using per-principal first-seen baselining as implemented in the [Netflix CloudTrail Anomaly
    Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly); treat first-seen + outside maintenance
    window as high priority. A positive result -- a rule match, statistical outlier, or model alert --
    indicates a probable evidence-destroying reversion; pivot to the responsible principal/role and source
    IP, the affected instance and its snapshot lineage, the correlated host shutdown/restart or telemetry
    gap, and any malicious activity that the revert may have erased, and confirm whether it occurred inside
    an approved change window or was performed by sanctioned automation. A negative result helps rule
    out this particular reversion vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy activity that hides inside legitimate change-management or
    automation workflows.'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Windows Event ID 4688
  - Windows Event ID 1074
  - 'NAI: Cloud provider audit log streams (e.g., CloudTrail, Azure Monitor); Cloud-hosted virtual machines
    (Windows); Centralized SIEM/Log Management Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = DISTINCT(principal, eventName) OVER last_90d

      FROM cloud_audit WHERE eventName IN ("RestoreSnapshot","StartInstances","ResetInstance")

      | WHERE (principal, eventName) NOT IN baseline   // first-ever call

      | WHERE _time NOT IN maintenance_window

      | ALERT priority=high "First-seen revert API by principal"'
