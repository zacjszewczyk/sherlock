questions:
- question: '[Impact] Alert on known threat actor sources: Can you determine whether an anomalous percentage
    of inbound traffic volume and/or connection count targeting a specific service originates from source
    IPs matching a known DDoS/botnet threat intelligence feed. -- specifically, using the ''Alert on known
    threat actor sources'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary directly floods a target
    host, service, or network with high-volume traffic to exhaust bandwidth, connection state, or compute
    and deny availability to legitimate users, leaving traces in network flow, notice, connection-state,
    and resource-usage telemetry. This evidence focuses on the condition that an anomalous percentage
    of inbound traffic volume and/or connection count targeting a specific service originates from source
    IPs matching a known DDoS/botnet threat intelligence feed. This Symbolic Logic approach looks for
    the following signal: Query Zeek conn.log for connections whose `id.orig_h` matches a curated botnet/DDoS
    threat-intelligence feed and raise a high-severity alert including count of feed-matched connections,
    total bytes, and target service. Seed the feed with known flood-tool and botnet infrastructure fingerprints
    such as the Mirai bot population and its SYN/ACK/UDP/GRE/DNS/HTTP flood behavior [Understanding the
    Mirai Botnet](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates traffic toward
    the asset has shifted from normal, diverse client behavior to the high-volume, homogeneous, or distributed
    pattern characteristic of a direct network flood; pivot to the targeted service and interface, the
    contributing source IPs and protocols, the connection-state mix, and any correlated saturation, drops,
    or service degradation, and consider upstream mitigation (rate limiting, ACLs, scrubbing, ISP engagement).
    A negative result helps rule out this flood vector for the window examined but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, reflected/amplified,
    or slowly ramping floods.'
  answer_sources: &id001
  - Zeek conn.log
  - 'NAI: Internet gateways, Border routers and firewalls, External-facing web servers, DNS servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Alert on known threat actor sources

      source IN [Zeek conn.log]

      | WHERE matches_action_criteria("Alert on known threat actor sources")

      // Query Zeek conn.log for connections whose `id.orig_h` matches a curated botnet/DDoS threat-intelligence
      feed and raise a

      | ALERT enrich(target_service, src_ip, protocol, conn_state, bytes, pps)'
  - technology: Zeek/pseudocode
    query: '# Direct network flood -- Zeek flow analysis

      conn.log, notice.log

      | AGG per (id.resp_h, id.resp_p, window): pps, bps, conn_state counts, unique id.orig_h, packet-size
      stats, src/proto entropy

      | flag floods per action criteria (Alert on known threat actor sources)'
- question: '[Impact] Flag unusual inbound ratios: Can you determine whether an anomalous percentage of
    inbound traffic volume and/or connection count targeting a specific service originates from source
    IPs matching a known DDoS/botnet threat intelligence feed. -- specifically, using the ''Flag unusual
    inbound ratios'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary directly floods a target
    host, service, or network with high-volume traffic to exhaust bandwidth, connection state, or compute
    and deny availability to legitimate users, leaving traces in network flow, notice, connection-state,
    and resource-usage telemetry. This evidence focuses on the condition that an anomalous percentage
    of inbound traffic volume and/or connection count targeting a specific service originates from source
    IPs matching a known DDoS/botnet threat intelligence feed. This Statistical Method approach looks
    for the following signal: In 1-minute windows compute Volume (bytes and connection count) from feed-matched
    IPs as a percentage of total inbound to the service, compare to the 30-day service-specific 99th percentile,
    and alert when exceeded; derive per-service thresholds from a rolling mean ± 3σ baseline as in [Finding
    Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates traffic toward
    the asset has shifted from normal, diverse client behavior to the high-volume, homogeneous, or distributed
    pattern characteristic of a direct network flood; pivot to the targeted service and interface, the
    contributing source IPs and protocols, the connection-state mix, and any correlated saturation, drops,
    or service degradation, and consider upstream mitigation (rate limiting, ACLs, scrubbing, ISP engagement).
    A negative result helps rule out this flood vector for the window examined but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, reflected/amplified,
    or slowly ramping floods.'
  answer_sources: *id001
  range: Last 90 days (baseline 30+ days; evaluate per-minute/window intervals)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Flag unusual inbound ratios

      source IN [Zeek conn.log]

      | STATS baseline over 30d per (dest_service, protocol, window)

      | COMPUTE deviation (z-score / percentile / CUSUM change-point)

      // In 1-minute windows compute Volume (bytes and connection count) from feed-matched IPs as a percentage
      of total inbound t

      | WHERE deviation > threshold | ALERT enrich(target_service, src_ip, ratio)'
  - technology: Zeek/pseudocode
    query: '# Direct network flood -- Zeek flow analysis

      conn.log, notice.log

      | AGG per (id.resp_h, id.resp_p, window): pps, bps, conn_state counts, unique id.orig_h, packet-size
