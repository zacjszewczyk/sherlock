name: 'T1498.001: Direct Network Flood'
id: 9b3013c2-3972-42f6-b197-9bb805b7b4d5
description: 'This playbook helps an analyst investigate whether an adversary is attempting to cause a
  denial of service (DoS/DDoS) by directly flooding a target host, service, or network with a high volume
  of network traffic, as part of the Impact tactic. Direct Network Floods saturate the victim with packets
  over stateless protocols (UDP, ICMP) or stateful ones (TCP SYN), frequently sourced from botnets such
  as Mirai. It guides the hunt across several complementary, network-centric angles using Zeek conn.log/notice.log
  and supporting telemetry: matching inbound source IPs against curated DDoS/botnet threat-intelligence
  feeds and profiling their failure/REJ rates; fingerprinting packet- and flow-level flood signatures
  (fixed packet sizes, illegal TCP flag combinations, reflection source ports such as NTP/DNS/LDAP/SSDP/SNMP);
  baselining and forecasting packets-per-second and bytes-per- second against per-asset 30-day baselines
  and high-watermark thresholds; detecting Shannon-entropy collapse in source IPs, source ports, and protocols
  that marks a shift from diverse legitimate traffic to a homogeneous flood; spotting the high-unique-source-count
  / low-bytes-per-source ratio characteristic of distributed botnet floods; and identifying surges in
  non-established TCP session states (S0, S1, REJ, RSTR) that indicate SYN/TCP floods. Detection methods
  combine symbolic-logic rules, statistical baselining (z-score, percentile, CUSUM change-point), and
  machine-learning models (ARIMA/Prophet forecasting, Random Forest/Gradient Boosting classifiers, Extended
  Isolation Forest, DBSCAN clustering) applied to Zeek flow records, notice events, interface/firewall
  failure counters, Windows Filtering Platform Event ID 2004, and cloud VPC Flow/CloudWatch telemetry,
  so the analyst can corroborate a suspected flood across threat-intel attribution, volumetric saturation,
  traffic homogeneity, source distribution, and connection-state imbalance.'
