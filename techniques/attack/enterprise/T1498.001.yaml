    count of TCP sessions with a non-established final state (e.g., S0, S1, REJ, RSTR) targeting a specific
    port, indicating a potential SYN or TCP flood. This Machine Learning approach looks for the following
    signal: Train a regression/classifier on historical ratios of established to non-established connections
    accounting for time-of-day/day-of-week and alert when residuals spike toward non-established states
    ([An Efficient Real Time DDoS Detection Model Using Machine Learning Algorithms](https://arxiv.org/abs/2501.14311));
    cross-organization models can be trained without sharing raw traffic via federated learning ([FLAD:
    Adaptive Federated Learning for DDoS Attack Detection](https://arxiv.org/abs/2205.06661)), and alerts
    should surface the top-3 features (SYN rate, S0 count, established ratio) per [SHAP Integration in
    Intrusion Detection Systems](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates traffic toward
    the asset has shifted from normal, diverse client behavior to the high-volume, homogeneous, or distributed
    pattern characteristic of a direct network flood; pivot to the targeted service and interface, the
    contributing source IPs and protocols, the connection-state mix, and any correlated saturation, drops,
    or service degradation, and consider upstream mitigation (rate limiting, ACLs, scrubbing, ISP engagement).
    A negative result helps rule out this flood vector for the window examined but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, reflected/amplified,
    or slowly ramping floods.'
