questions:
- question: '[Defense Impairment] TI match on container downloads: Can you determine whether network delivery
    of containerized payloads (ISO/VHD/ZIP/RAR and similar) from malicious or highly suspicious infrastructure,
    which is the entry point of a MOTW bypass because the inner files do not inherit the :Zone.Identifier
    ADS once the container is mounted or extracted -- specifically, by applying the ''TI match on container
    downloads'' (Symbolic Logic) approach to network telemetry shows delivery of containerized payloads
    (for example ISO/VHD/ZIP/RAR) from malicious or highly suspicious infrastructure, indicating likely
    abuse of trusted-signing and user-execution workflows for defense evasion?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the adversary''s goal is to
    break or sidestep security mechanisms so defenders cannot see or trust what is happening; here that
    means defeating Windows Mark-of-the-Web so untrusted, Internet-delivered code runs as if it were trusted
    local content. This evidence focuses on Network telemetry shows delivery of containerized payloads
    (for example ISO/VHD/ZIP/RAR) from malicious or highly suspicious infrastructure, indicating likely
    abuse of trusted-signing and user-execution workflows for defense evasion. This Symbolic Logic approach
    works as follows: For each file identified in Zeek logs (files.log, http.log) with a MIME type of
    ''application/zip'', ''application/x-rar-compressed'', ''application/x-iso9660-image'', ''application/octet-stream'',
    or a file extension of ''.iso'', ''.img'', ''.vhd'', ''.vhdx'', ''.zip'', ''.rar'', ''.arj'', ''.gz'',
    ''.cab'', compare its SHA256 hash, the source IP address (id.orig_h), and the server name (host) against
    threat intelligence feeds. Generate an alert upon a match. Container/archive formats are abused precisely
    because the inner files do not inherit the NTFS :Zone.Identifier MOTW once mounted/extracted [Mark-of-the-Web
    from a Red Team''s Perspective, Outflank](https://www.outflank.nl/blog/2020/03/30/mark-of-the-web-from-a-red-teams-perspective/),
    and ZIP/ISO/IMG containers are the dominant smuggling payload [HTML Smuggling Surges, Microsoft](https://www.microsoft.com/en-us/security/blog/2021/11/11/html-smuggling-surges-highly-evasive-loader-technique-increasingly-used-in-banking-malware-targeted-attacks/).
    A positive result -- a rule match, a statistical outlier, or a model alert -- is a strong indicator
    that a container/disk-image was used to strip MOTW and stage execution; pivot to the responsible process
    and its full parent lineage (browser/Office/archiver/mount tool), the user and host context, the container''s
    network provenance and reputation, the inner file''s signing status and :Zone.Identifier ADS state,
    and any child processes or network callbacks the inner executable spawned. A negative result helps
    rule out this specific MOTW-bypass vector but should be corroborated with the other questions in this
    playbook, since any single method can miss stealthy, low-volume, or partially-blocked delivery.'
