name: 'T1553.005: Subvert Trust Controls: Mark-of-the-Web Bypass'
id: 0b4bcd72-05bb-4630-8ac5-794c66f20bd8
description: 'This playbook helps an analyst investigate whether an adversary has abused container and
  disk-image file formats to bypass Windows Mark-of-the-Web (MOTW) protections and execute untrusted code
  under the Defense Impairment tactic. When a file is downloaded from the Internet, Windows tags it with
  the hidden NTFS :Zone.Identifier Alternate Data Stream (the MOTW), which forces Office files into Protected
  View and routes executables through Defender SmartScreen. Adversaries defeat this by delivering payloads
  inside archive (.zip, .rar, .arj, .gz, .cab) and disk-image (.iso, .img, .vhd, .vhdx) containers: the
  container is marked with MOTW, but because these formats do not carry NTFS alternate data streams, the
  inner files lose the MOTW once extracted or mounted and then run as trusted local content without SmartScreen
  or Protected View. The hunt spans the full delivery-to-execution chain on Windows endpoints and at network
  egress: network delivery of containerized payloads from suspicious or low-prevalence infrastructure
  (Zeek files/http/conn/dns); browser- or Office-spawned mount/extract activity (Windows Event ID 4688,
  Security 4663 CdRom access); the tight download->mount/extract->inner-executable timeline; and execution
  of unsigned or recently-compiled binaries from mounted volumes or temporary directories whose inner
  files lack a :Zone.Identifier ADS (or had it explicitly stripped). Detection methods combine symbolic-logic
  rules, statistical baselining (prevalence, parent-child rarity, volume/frequency bursts, time-to-execution,
  path entropy, failure-state profiling) and machine-learning models (supervised container classifiers,
  time-series spike detection, provenance-graph and isolation-forest anomaly detection) so the analyst
  can corroborate suspected MOTW bypass across network telemetry, process lineage, file metadata, signing/Defender
  verdicts, and downstream execution behavior.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
