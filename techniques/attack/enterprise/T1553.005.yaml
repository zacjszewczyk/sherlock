- question: '[Defense Impairment] Browser/Office to mount/extract rule: Can you determine whether a process
    being created to mount a disk image or extract an archive where the parent process is a web browser
    or Microsoft Office application -- the canonical phishing-to-container handoff that delivers MOTW-stripped
    payloads to disk -- specifically, by applying the ''Browser/Office to mount/extract rule'' (Symbolic
    Logic) approach to a process (e.g., powershell.exe, explorer.exe) is created to mount a disk image
    or extract an archive file, and the parent process is a web browser or Microsoft Office application?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the adversary''s goal is to
    break or sidestep security mechanisms so defenders cannot see or trust what is happening; here that
    means defeating Windows Mark-of-the-Web so untrusted, Internet-delivered code runs as if it were trusted
    local content. This evidence focuses on A process (e.g., powershell.exe, explorer.exe) is created
    to mount a disk image or extract an archive file, and the parent process is a web browser or Microsoft
    Office application. This Symbolic Logic approach works as follows: Create a detection rule for process
    creation events (Windows Event ID 4688) where ParentProcessName is in (`chrome.exe`, `msedge.exe`,
    `firefox.exe`, `winword.exe`, `excel.exe`, `powerpnt.exe`, `outlook.exe`) and ProcessName is in (`powershell.exe`,
    `explorer.exe`, `7z.exe`, `7zFM.exe`, `winrar.exe`, `Winrar.exe`, `peazip.exe`, `tar.exe`, `isoburn.exe`,
