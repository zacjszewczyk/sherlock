name: 'T1218: System Binary Proxy Execution'
id: 1b6a0f08-eafb-41ff-910c-f660a22b1ae8
description: Investigate potential abuse of trusted, signed system binaries (LOLBins) to proxy execution
  of malicious content and evade process- and signature-based defenses (MITRE ATT&CK T1218, System Binary
  Proxy Execution). This playbook helps an analyst hunt for Microsoft-signed proxy binaries (e.g., rundll32.exe,
  regsvr32.exe, mshta.exe, msiexec.exe, cmstp.exe, installutil.exe, odbcconf.exe) and trusted Linux/macOS
  binaries (e.g., split, tee, osascript, curl) leveraged to load remote objects, execute payloads from
  low-trust directories, spawn from statistically unusual parents, initiate anomalous outbound connections
  or drop executables, or appear within suspicious Office -> scripting host -> proxy execution chains.
  It combines first-party deterministic rules, threat-intel enrichment, statistical baselining (prevalence,
  token rarity, network deviation, failure profiling), and machine-learning approaches (command-line clustering,
  provenance-graph and sequence anomaly detection) so an analyst can determine whether an adversary is
  hiding malicious execution behind trusted binaries.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any trusted, Microsoft-signed proxy binaries (rundll32.exe, regsvr32.exe, mshta.exe, msiexec.exe,
    cmstp.exe, installutil.exe, odbcconf.exe) executing with command lines that reference a remote object
    such as an http(s):// or ftp:// URL, a UNC path (\\server\share), or known LOLBin loader syntax (scrobj.dll,
    /i:, javascript:, vbscript:)?
  context: 'Under the Stealth tactic, adversaries proxy execution through signed binaries so malicious
    activity blends in with trusted processes. This first-party rule fires on internal process-creation
    telemetry alone, with no external lookup, making it the deterministic floor for detection. Match the
    curated LOLBAS / Red Canary abusable-syntax corpus against the command line. A positive hit means
    a trusted binary is reaching out to or loading remote content - a strong indicator of staged payload
    retrieval. Benign administrative use exists (e.g., legitimate installers), so confirm parent process,
    user, and destination before escalating. References: [LOLBAS Project](https://lolbas-project.github.io/),
    [Red Canary LOLBins Abuse](https://redcanary.com/blog/threat-detection/lolbins-abuse/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 11 (File Create)
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: All Windows Endpoints and Servers; Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proxy_bins = [\"rundll32.exe\",\"regsvr32.exe\",\"mshta.exe\",\"msiexec.exe\",\n  \"cmstp.exe\"\
      ,\"installutil.exe\",\"odbcconf.exe\"]\nremote_re = /(https?:\\/\\/|ftp:\\/\\/|\\\\\\\\)|scrobj\\\
      .dll|\\/i:|javascript:|vbscript:/i\nSEARCH (EventCode=1 OR EventCode=4688)\n| WHERE lower(Image)\
      \ endswith_any proxy_bins\n| WHERE CommandLine MATCHES remote_re\n| TABLE _time, host, User, ParentImage,\
      \ Image, CommandLine"
- question: After detecting a proxy-binary execution, do any referenced file paths, URLs, or computed
    file hashes (SHA256) match known-bad indicators in the threat-intelligence feed?
  context: 'This enrichment layer is additive to the first-party rule, never a prerequisite, so detection
    does not depend on external lookups. For each proxy execution, extract the referenced URL/path and
    the dropped/loaded file hash from process-creation and file events (Sysmon EID 1/11, Windows EID 4688/4663)
    and compare against blocklisted IOCs. A match confirms the proxy binary is handling known-malicious
    content and raises confidence to high. A non-match does not clear the event - novel infrastructure
    is common - so fall back to the behavioral signals. References: [Red Canary LOLBins Abuse](https://redcanary.com/blog/threat-detection/lolbins-abuse/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 11 (File Create)
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: All Windows Endpoints and Servers; Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'SEARCH (EventCode IN [1,11,4688,4663])

      | WHERE lower(Image) endswith_any proxy_bins

      | EVAL ioc = coalesce(Hashes.SHA256, TargetFilename, extract_url(CommandLine))

      | LOOKUP threat_intel_feed ON ioc

      | WHERE ti_match == true

      | TABLE _time, host, Image, CommandLine, ioc, ti_source, ti_category'
- question: Is a signed proxy binary generating a burst of failed network retrievals (DNS NXDOMAIN, conn_state
    S0/REJ, proxy 404/blocked) that exceeds its normal per-binary failure rate?
  context: 'Retrieval failure is itself a high-signal event: a trusted proxy binary repeatedly failing
    to resolve or connect often reflects dead/rotating C2 or a sinkholed domain. Baseline the per-binary
    failure ratio over the period and alert when an execution''s failure rate exceeds the 99th percentile.
    This catches malicious activity even when no successful C2 ever occurs, which is valuable against
    the Stealth tactic where successful connections may be rare or blocked. References: [Sysmon Event
    ID 3 Network Connection Reference, Elastic](https://www.elastic.co/docs/reference/security/prebuilt-rules/audit_policies/windows/sysmon_eventid3_network_connection).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 11 (File Create)
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: All Windows Endpoints and Servers; Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SEARCH zeek_dns OR zeek_conn OR proxy_logs (orig_proc endswith_any proxy_bins)

      | EVAL failed = (dns_rcode=="NXDOMAIN" OR conn_state IN ["S0","REJ","RSTO"] OR http_status IN [403,404])

      | STATS count AS total, sum(failed) AS fails BY orig_proc, host, exec_id

      | EVAL fail_ratio = fails/total

      | EVENTSTATS perc99(fail_ratio) AS p99 BY orig_proc

      | WHERE fail_ratio > p99'
- question: For each proxy-binary IOC hit, how rare are the parent process and the user account, and is
    the execution running in a privileged or unusual context?
  context: 'Context scoring separates true positives from benign noise. Compute 30-day prevalence of the
    parent image and user account for each hit; risk increases when the parent is uncommon for that binary
    (e.g., winword.exe rather than svchost.exe) or the account is privileged. This applies the outlier-parent
    baseline method (CAR-2014-11-002). Aggregate the scores and alert above an enterprise-specific percentile
    (e.g., 99th). High scores indicate stealthy execution from an unexpected origin worth immediate triage.
    References: [CAR-2014-11-002 Outlier Parents of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 11 (File Create)
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: All Windows Endpoints and Servers; Threat Intelligence Platform'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SEARCH (EventCode IN [1,4688]) (lower(Image) endswith_any proxy_bins)

      | STATS count AS pair_ct BY Image, ParentImage

      | EVENTSTATS sum(pair_ct) AS img_total BY Image

      | EVAL parent_prev = pair_ct/img_total

      | EVAL risk = (parent_prev<0.001)*3 + (User IN privileged_accounts)*2

      | EVENTSTATS perc99(risk) AS p99

      | WHERE risk >= p99'
- question: Can a supervised classifier rank proxy-binary alerts by likelihood of being a true positive
    using process lineage, user context, time of day, host criticality, and parent prevalence - and explain
    the top contributing features?
  context: 'To reduce analyst fatigue, train a gradient-boosted classifier on historical alerts labeled
    true/false positive. Features include process lineage, user context, time of day, host criticality,
    and parent prevalence. The model must surface the top-3 contributing features (e.g., ''rare parent
    winword.exe'', ''remote URL in args'', ''first-seen on host'') so analysts receive an explainable
    score rather than an opaque probability. This concentrates attention on the highest-confidence proxy-execution
    events that signal an adversary attempting to remain undetected. References: [Living-Off-The-Land
    Command Detection Using Active Learning](https://arxiv.org/abs/2111.15039), [Obfuscated Command Line
    Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 11 (File Create)
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: All Windows Endpoints and Servers; Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [process_lineage, user_context, hour_of_day, host_criticality,\n  parent_prevalence,\
      \ remote_url_flag, first_seen_on_host]\nmodel = GradientBoostedClassifier(labels=analyst_dispositions)\n\
      score = model.predict_proba(features)\nWHERE score > threshold\nEMIT alert WITH top3_feature_importances(model,\
      \ features)"
- question: Are proxy binaries loading files from writable, low-trust directories such as \AppData\Local\Temp\,
    \Users\Public\, C:\PerfLogs\, \ProgramData\, or unapproved network shares?
  context: 'Legitimate proxy-binary usage typically loads modules from system or installed-application
    directories. Execution referencing user-writable or low-trust paths is a hallmark of payload staging.
    Match command-line paths against a maintained deny list derived from the LOLBAS / Red Canary abusable
    patterns. A hit suggests an adversary has dropped a payload into a directory they could write to and
    is now executing it via a trusted binary to evade defenses. References: [LOLBAS Project](https://lolbas-project.github.io/),
    [Red Canary LOLBins Abuse](https://redcanary.com/blog/threat-detection/lolbins-abuse/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Creation)
  - 'NAI: File systems of all Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "bad_dirs = [\"\\\\appdata\\\\local\\\\temp\\\\\",\"\\\\users\\\\public\\\\\",\n  \"c:\\\\\
      perflogs\\\\\",\"\\\\programdata\\\\\"]\nSEARCH (EventCode IN [1,4688]) (lower(Image) endswith_any\
      \ proxy_bins)\n| WHERE lower(CommandLine) contains_any bad_dirs\n  OR CommandLine MATCHES /\\\\\\\
      \\[^\\\\]+\\\\(?!approved_share)/\n| TABLE _time, host, User, ParentImage, Image, CommandLine"
- question: When ranked by 90-day prevalence, is a proxy binary loading from a directory in the bottom
    5th percentile of load directories for that binary, or one never before seen on the host?
  context: 'Maintain a 90-day prevalence model of load directories per proxy binary, computing path frequency
    across all endpoints. Executions loading from directories in the bottom 5th percentile are statistically
    rare and warrant review, applying the rarity-baselining approach of CAR-2014-11-002. Track both volume
    (count of executions per path) and first-seen status per host so a brand-new directory on a single
    host is flagged even if it is not globally rare. Rare load locations frequently mark adversary staging
    directories. References: [CAR-2014-11-002 Outlier Parents of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Creation)
  - 'NAI: File systems of all Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SEARCH (EventCode IN [1,4688]) (lower(Image) endswith_any proxy_bins)

      | EVAL load_dir = dirname(extract_path(CommandLine))

      | STATS count AS dir_ct, min(_time) AS first_seen BY Image, load_dir, host

      | EVENTSTATS perc5(dir_ct) AS p5 BY Image

      | WHERE dir_ct <= p5 OR first_seen > now()-24h'
- question: Does token-rarity (BM25 / log-entropy) weighting of the proxy-binary command line surface
    unusual argument tokens such as uncommon paths, scriptlet names, or encoded blobs?
  context: 'Apply BM25 / log-entropy token weighting (SCADE) to the command line so rare argument tokens
    raise the score while common benign invocations are suppressed. Encoded blobs, obscure scriptlet names,
    and unusual paths receive high weights. Surface the top-weighted tokens in the alert for explainability.
    This statistical approach catches novel obfuscation and staging that fixed rules miss, supporting
    the analyst''s determination of whether the execution is an evasion attempt. References: [SCADE](https://arxiv.org/abs/2412.04259).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Creation)
  - 'NAI: File systems of all Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "corpus = all_proxy_bin_commandlines(last_90d)\nFOR each execution e:\n  tokens = tokenize(e.CommandLine)\n\
      \  score = sum(bm25_weight(t, corpus) for t in tokens)\nEVENTSTATS perc99(score) AS p99\nWHERE score\
      \ > p99\nEMIT alert WITH top_weighted_tokens(e)"
- question: Do unsupervised clustering and outlier-detection methods over command-line embeddings flag
    a proxy-binary execution as a sparse-cluster or high-outlier-score anomaly?
  context: 'Embed proxy-binary command lines (BERT-style) and apply unsupervised outlier detection (DBSCAN,
    Isolation Forest, COPOD) over directory strings, extensions, and argument patterns. Executions in
    sparse clusters or with high outlier scores deviate from the bulk of benign activity. Report the nearest-neighbor
    distance and the top-3 distinguishing tokens in the alert. This detects previously unseen abuse patterns
    that signature rules cannot, helping reveal stealthy proxy execution. References: [BERT Embeddings
    for Command-Line Anomaly Detection](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Creation)
  - 'NAI: File systems of all Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "emb = bert_embed(proxy_bin_commandlines)\nclusters = DBSCAN(emb)  # plus IsolationForest /\
      \ COPOD scores\nFOR each execution e:\n  IF cluster_size(e) < min_cluster OR outlier_score(e) >\
      \ thr:\n    EMIT alert WITH nn_distance(e), top3_distinguishing_tokens(e)"
- question: Is a proxy binary (rundll32.exe, mshta.exe, regsvr32.exe, msiexec.exe, cmstp.exe) being spawned
    by an atypical parent such as an Office application (winword.exe, excel.exe, powerpnt.exe, outlook.exe)
    or a non-system browser (chrome.exe, firefox.exe, msedge.exe)?
  context: 'Proxy binaries normally descend from system processes like svchost.exe or explorer.exe. When
    an Office app or browser spawns one, it commonly reflects a malicious document or web-delivered payload
    invoking a trusted binary to execute its content - a classic Stealth-tactic pattern. This deterministic
    lineage rule (per SigmaHQ unusual-parent and Red Canary) fires on internal telemetry and is high-fidelity.
    Confirm the document/URL source and downstream activity to scope the incident. References: [Unusual
    Parent Process For Cmd.EXE, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_unusual_parent/),
    [Red Canary LOLBins Abuse](https://redcanary.com/blog/threat-detection/lolbins-abuse/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Creation)
  - 'NAI: All Windows Endpoints and Servers, particularly those with Microsoft Office Suite or web browsers
    installed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'office = ["winword.exe","excel.exe","powerpnt.exe","outlook.exe"]

      browsers = ["chrome.exe","firefox.exe","msedge.exe"]

      SEARCH (EventCode IN [1,4688]) (lower(Image) endswith_any proxy_bins)

      | WHERE lower(ParentImage) endswith_any (office + browsers)

      | TABLE _time, host, User, ParentImage, Image, CommandLine'
- question: Against a 30-day frequency distribution of parent images per proxy binary, is a new or rare
    parent-child pairing (e.g., observed in under 0.1% of history) appearing?
  context: 'Build a 30-day frequency distribution of parent images per proxy binary and alert when a new
    or rare pairing appears (CAR-2014-11-002). Report the observed parent prevalence (e.g., ''0/90 days'')
    in the alert for triage. This statistical method generalizes beyond a fixed parent list, catching
    unexpected parents the deterministic rule did not enumerate. A parent never previously seen launching
    a given proxy binary is a strong anomaly indicating possible defense evasion. References: [CAR-2014-11-002
    Outlier Parents of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Creation)
  - 'NAI: All Windows Endpoints and Servers, particularly those with Microsoft Office Suite or web browsers
    installed.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SEARCH (EventCode IN [1,4688]) (lower(Image) endswith_any proxy_bins)

      | STATS count AS pair_ct, min(_time) AS first_seen BY Image, ParentImage

      | EVENTSTATS sum(pair_ct) AS img_total BY Image

      | EVAL prevalence = pair_ct/img_total

      | WHERE prevalence < 0.001 OR first_seen > now()-24h

      | TABLE Image, ParentImage, prevalence, pair_ct'
- question: Does graph-based anomaly detection over the process-provenance graph flag the parent->proxy
    edge as a newly formed connection between previously separated communities?
  context: 'Model parent-child relationships as a provenance graph using Sysmon ProcessGUIDs and apply
    node-level graph learning (ThreaTrace, GraphSAGE) or temporal-graph edge scoring (KAIROS) to learn
    normal neighborhoods and flag anomalous new edges that connect previously separated communities. Surface
    the specific anomalous edge (parent->proxy) and its reconstruction/anomaly score in the alert. This
    captures subtle lineage anomalies that frequency counting misses and supports detecting stealthy proxy
    execution embedded in otherwise normal activity. References: [ThreaTrace](https://arxiv.org/pdf/2111.04333),
    [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Creation)
  - 'NAI: All Windows Endpoints and Servers, particularly those with Microsoft Office Suite or web browsers
    installed.'
  range: Last 30 days
  queries:
  - technology: ML/pseudocode
    query: "G = build_provenance_graph(sysmon_eid1, key=ProcessGUID)\nmodel = ThreaTrace_or_KAIROS(train=benign_30d)\n\
      FOR edge (parent -> proxy_bin) in G:\n  score = model.edge_anomaly(edge)\n  IF score > thr:\n  \
      \  EMIT alert WITH edge, score, connected_communities(edge)"
- question: Is a proxy binary (regsvr32.exe, cmstp.exe, rundll32.exe, mshta.exe) initiating an outbound
    connection to a non-RFC1918 (external) IP, or creating a file with an executable extension (.exe,
    .dll, .ps1, .bat), outside its established baseline?
  context: 'Join process-creation events with network connections on ProcessGUID/timestamp and alert when
    a proxy binary initiates an outbound connection to an external IP, following the lineage-to-network
    correlation pattern. Also alert when the proxy binary writes a file with an executable extension.
    Many proxy binaries have little or no legitimate need to make external connections or drop executables;
    doing so suggests C2 communication or payload staging behind a trusted process - a core Stealth behavior.
    References: [Sysmon Event ID 3 Network Connection Reference, Elastic](https://www.elastic.co/docs/reference/security/prebuilt-rules/audit_policies/windows/sysmon_eventid3_network_connection),
    [Red Canary LOLBins Abuse](https://redcanary.com/blog/threat-detection/lolbins-abuse/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Windows Event ID 4663
  - Sysmon Event ID 3 (Network Connection)
  - Sysmon Event ID 11 (File Create)
  - 'NAI: Network Egress Points (Firewalls, Proxies) and All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc = SEARCH EventCode=1 (lower(Image) endswith_any proxy_bins)\nnet  = SEARCH (EventCode=3\
      \ OR zeek_conn)\nfile = SEARCH EventCode=11\nJOIN proc, net ON ProcessGUID WITHIN 60s\n| WHERE NOT\
      \ cidr_match(dest_ip, RFC1918)\nOR JOIN proc, file ON ProcessGUID\n  WHERE TargetFilename MATCHES\
      \ /\\.(exe|dll|ps1|bat)$/i\n| TABLE _time, host, Image, dest_ip, dest_port, TargetFilename"
- question: For each proxy binary, do network metrics (orig/resp bytes, connection duration, destination-port
    entropy, byte ratio) deviate by more than 3 standard deviations from its baseline?
  context: 'Per proxy binary, baseline volume (orig_bytes/resp_bytes), connection duration, destination-port
    entropy, and connection state from Zeek conn.log / Sysmon EID 3, and alert when any metric exceeds
    3 standard deviations from baseline. Capture sent:received byte ratios to catch beaconing or upload
    patterns. Statistical deviation reveals anomalous communication - e.g., a binary that normally never
    transfers data suddenly uploading large volumes - indicating exfiltration or C2 hidden in a trusted
    process. References: [Sysmon Event ID 3 Network Connection Reference, Elastic](https://www.elastic.co/docs/reference/security/prebuilt-rules/audit_policies/windows/sysmon_eventid3_network_connection).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Windows Event ID 4663
  - Sysmon Event ID 3 (Network Connection)
  - Sysmon Event ID 11 (File Create)
  - 'NAI: Network Egress Points (Firewalls, Proxies) and All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "SEARCH zeek_conn OR EventCode=3 (orig_proc endswith_any proxy_bins)\n| EVAL byte_ratio = orig_bytes/(resp_bytes+1)\n\
      | STATS avg(orig_bytes) AS mu, stdev(orig_bytes) AS sd,\n        avg(duration) AS mu_d, stdev(duration)\
      \ AS sd_d BY orig_proc\n| EVAL z = abs(orig_bytes-mu)/sd\n| WHERE z > 3 OR abs(duration-mu_d)/sd_d\
      \ > 3"
- question: Is a signed proxy binary generating an elevated rate of failed or blocked outbound attempts
    (conn_state S0/REJ/RSTO, firewall deny, proxy 403/404) above its per-binary 99th percentile?
  context: Separately baseline failed/blocked outbound attempts for each proxy binary; a signed proxy
    generating elevated connection failures is high-signal even when no successful C2 occurs. Alert when
    the failure rate exceeds the per-binary 99th percentile. Failed connections often reveal C2 attempts
    against dead, rotating, or blocked infrastructure - valuable in the Stealth context where successful
    beacons may be suppressed by controls but the attempt itself betrays the intrusion.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Windows Event ID 4663
  - Sysmon Event ID 3 (Network Connection)
  - Sysmon Event ID 11 (File Create)
  - 'NAI: Network Egress Points (Firewalls, Proxies) and All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SEARCH zeek_conn OR firewall OR proxy_logs (orig_proc endswith_any proxy_bins)

      | EVAL failed = (conn_state IN ["S0","REJ","RSTO"] OR fw_action=="deny" OR http_status IN [403,404])

      | STATS count AS total, sum(failed) AS fails BY orig_proc, host

      | EVAL fail_rate = fails/total

      | EVENTSTATS perc99(fail_rate) AS p99 BY orig_proc

      | WHERE fail_rate > p99'
- question: Can a supervised classifier (Random Forest / gradient-boosted) score outbound connections
    from proxy binaries as malicious using flow features (duration, orig_bytes, resp_bytes, protocol,
    conn_state, destination port)?
  context: 'Train a Random Forest / gradient-boosted classifier on labeled Zeek conn.log flows using duration,
    orig_bytes, resp_bytes, protocol, conn_state, and destination port to score outbound connections from
    proxy binaries. Output the top-3 contributing flow features in the alert text for explainability.
    This learns subtle multivariate signatures of malicious flows (e.g., beaconing cadence with small
    payloads) that single-metric thresholds miss, helping the analyst confirm whether a trusted binary
    is performing covert C2. References: [Living-Off-The-Land Command Detection Using Active Learning](https://arxiv.org/abs/2111.15039),
    [Obfuscated Command Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Windows Event ID 4663
  - Sysmon Event ID 3 (Network Connection)
  - Sysmon Event ID 11 (File Create)
  - 'NAI: Network Egress Points (Firewalls, Proxies) and All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [duration, orig_bytes, resp_bytes, proto, conn_state, dest_port]\nmodel = RandomForest(labels=flow_dispositions)\n\
      FOR flow in proxy_bin_flows:\n  p = model.predict_proba(flow)\n  IF p > threshold:\n    EMIT alert\
      \ WITH top3_feature_importances(model, flow)"
- question: Within a 60-second window, is there an execution chain matching Office app (winword.exe, excel.exe,
    outlook.exe) -> scripting host (cmd.exe, powershell.exe, wscript.exe, mshta.exe) -> proxy binary (rundll32.exe,
    msiexec.exe, regsvr32.exe)?
  context: 'Trace parent/child relationships via PIDs (Windows EID 4688) and ProcessGUIDs (Sysmon EID
    1) and alert when a three-stage sequence within 60 seconds matches Office -> scripting host -> system
    proxy. This lineage is the canonical phishing-to-execution kill chain: a malicious document spawns
    a script interpreter that in turn invokes a trusted proxy binary to run the payload. It is one of
    the highest-fidelity indicators in this playbook and warrants prompt triage of the originating document
    and user. References: [Unusual Parent Process For Cmd.EXE, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_unusual_parent/),
