- question: Over a 90-day baseline of process-lineage triples (depth >= 3), how rare is an observed 'User
    App -> Script Host -> System Proxy' chain - does it occur fewer than ~5 times?
  context: 'Enumerate Sysmon EID 1 lineage triples of depth >= 3 over 90 days, compute the frequency of
    each triple, and flag chains occurring fewer than ~5 times that match the User App -> Script Host
    -> System Proxy pattern (CAR-2014-11-002). Include the observed triple count in the alert. Rarity
    scoring generalizes the deterministic chain rule and catches uncommon but malicious variations of
    the kill chain that a fixed image list would miss. References: [CAR-2014-11-002 Outlier Parents of
    Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Creation)
  - 'NAI: All Windows Endpoints, especially those used by front-office personnel or executives.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SEARCH EventCode=1

      | BUILD lineage_triples(depth>=3) BY ProcessGUID

      | EVAL triple = grandparent+" -> "+parent+" -> "+child

      | STATS count AS triple_ct BY triple

      | WHERE child endswith_any proxy_bins AND triple_ct < 5

      | TABLE triple, triple_ct'
- question: Does the grandchild proxy-binary command line in the chain show signs of obfuscation when
    scored with statistical features (entropy, special-character ratio, env-var references) and an ELECTRA-style
    small language model?
  context: 'Score the grandchild proxy command line for obfuscation using statistical features (entropy,
    special-character ratio, env-var refs) and an ELECTRA-style small language model (augmented via Invoke-DOSfuscation).
    Surface the top obfuscation features/tokens in the alert. Obfuscated command lines within an Office-spawned
    chain strongly indicate an attacker concealing payload syntax to evade signature defenses - precisely
    the Stealth tactic. High obfuscation scores combined with the chain lineage are near-conclusive of
    malicious proxy execution. References: [Obfuscated Command Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/),
    [Command-line Obfuscation Detection using Small Language Models](https://arxiv.org/html/2408.02637v1).'
