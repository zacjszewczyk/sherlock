  queries:
  - technology: ML/pseudocode
    query: 'features = [shannon_entropy(cmd), special_char_ratio(cmd), envvar_ref_count(cmd)]

      slm = ELECTRA_obfuscation_model()

      score = 0.5*stat_score(features) + 0.5*slm.score(cmd)

      WHERE score > threshold

      EMIT alert WITH top_obfuscation_features(cmd)'
- question: Does a sequence anomaly detector (LSTM autoencoder) or provenance-subgraph scorer flag the
    execution chain as high reconstruction error, and which step is the anomalous one?
  context: 'Encode execution chains as sequences of process names/command lines and train a sequence anomaly
