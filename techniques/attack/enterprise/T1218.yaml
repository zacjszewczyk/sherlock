    specific anomalous step for triage. This learns the shape of normal execution sequences and surfaces
    novel malicious chains that neither fixed rules nor simple rarity counting detect, pinpointing exactly
    where the chain departs from benign behavior. References: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf),
    [ThreaTrace](https://arxiv.org/pdf/2111.04333).'
