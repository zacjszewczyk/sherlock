questions:
- question: '[Impact] Match wiper hashes and names: Can you determine whether a process whose image hash
    or filename matches a known data-wiper, ransomware, or file-manipulation tool is observed alongside
    unauthorized write, delete, or overwrite activity on protected business data. -- specifically, using
    the ''Match wiper hashes and names'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary inserts, deletes, or manipulates
    data at rest to influence external outcomes, alter business decisions, or conceal prior activity,
    threatening the integrity of stored Office documents, databases, mail archives, logs, and configuration
    files. This evidence focuses on the condition that a process whose image hash or filename matches
    a known data-wiper, ransomware, or file-manipulation tool is observed alongside unauthorized write,
    delete, or overwrite activity on protected business data. This Symbolic Logic approach works as follows:
    Compare process image hashes and filenames from Windows Event ID 4688 / Sysmon EID 1 against threat-intelligence
    lists for wipers, ransomware payloads, and unauthorized data-tampering tools, then correlate any hit
    with file create, modify, delete, or rename activity on sensitive paths attributed to that process
    and its lineage (Sysmon). Treat any write/rename touching a deployed canary/honeyfile as an immediate
    high-fidelity alert (ML file-trap selection). A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable unauthorized manipulation of stored data; pivot to the responsible
    process and its parent lineage, the acting user and host, the targeted files/paths and their business
    sensitivity, the change record or maintenance window (if any), and any backups or notarized digests
    that can confirm or refute tampering. A negative result helps rule out this particular manipulation
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, slow, or living-off-the-land tampering against stored data.'
