- question: '[Impact] Flag high write/delete rates and write-entropy: Can you determine whether a process
    whose image hash or filename matches a known data-wiper, ransomware, or file-manipulation tool is
    observed alongside unauthorized write, delete, or overwrite activity on protected business data. --
    specifically, using the ''Flag high write/delete rates and write-entropy'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary inserts, deletes, or manipulates
    data at rest to influence external outcomes, alter business decisions, or conceal prior activity,
    threatening the integrity of stored Office documents, databases, mail archives, logs, and configuration
    files. This evidence focuses on the condition that a process whose image hash or filename matches
    a known data-wiper, ransomware, or file-manipulation tool is observed alongside unauthorized write,
    delete, or overwrite activity on protected business data. This Statistical Method approach works as
    follows: Baseline per-process and per-share write, delete, and rename rates over 30 days and alert
    when a host or user exceeds the 99th percentile of its own activity (or mean+3σ) in a short window
    outside an approved maintenance period; in parallel measure Shannon entropy of per-process write buffers
    and alert on a sharp rise toward maximal entropy that signals encryption/overwrite of stored data
    (UNVEIL, change-point survey). Derive thresholds per host role from each environment''s own history.
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable unauthorized
    manipulation of stored data; pivot to the responsible process and its parent lineage, the acting user
    and host, the targeted files/paths and their business sensitivity, the change record or maintenance
    window (if any), and any backups or notarized digests that can confirm or refute tampering. A negative
    result helps rule out this particular manipulation vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, slow, or living-off-the-land
    tampering against stored data.'
