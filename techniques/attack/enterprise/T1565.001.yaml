- question: '[Impact] Critical hash mismatch and tamper-evidence detection: Can you determine whether
    the cryptographic hash of a critical system file or configuration file changes and no longer matches
    the established approved baseline or expected change ticket for that asset. -- specifically, using
    the ''Critical hash mismatch and tamper-evidence detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary inserts, deletes, or manipulates
    data at rest to influence external outcomes, alter business decisions, or conceal prior activity,
    threatening the integrity of stored Office documents, databases, mail archives, logs, and configuration
    files. This evidence focuses on the condition that the cryptographic hash of a critical system file
    or configuration file changes and no longer matches the established approved baseline or expected
    change ticket for that asset. This Symbolic Logic approach works as follows: Hash writes to monitored
    critical files and stored records and alert when the observed digest does not match the approved baseline,
    expected software version, or a valid change record; for databases and stored logs, externally notarize
    digests and treat any digest mismatch, broken hash chain, or missing sequence number as a deterministic
    tamper alert (Wazuh FIM, Snodgrass et al., Schneier & Kelsey). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable unauthorized manipulation of stored data;
    pivot to the responsible process and its parent lineage, the acting user and host, the targeted files/paths
    and their business sensitivity, the change record or maintenance window (if any), and any backups
    or notarized digests that can confirm or refute tampering. A negative result helps rule out this particular
    manipulation vector but should be corroborated with the other questions in this playbook, since a
    single method can miss stealthy, slow, or living-off-the-land tampering against stored data.'
