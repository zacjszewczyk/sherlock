name: 'T1565.001: Stored Data Manipulation'
id: 919455ef-2ffb-4c5a-b1b3-eca133ff043f
description: 'This playbook helps an analyst investigate whether an adversary has inserted, deleted, or
  manipulated data at rest -- Office documents, databases, stored emails, log archives, and critical configuration
  files -- to impact business operations, distort organizational understanding and decision-making, or
  conceal prior intrusion activity, as part of the Impact tactic. It guides the hunt across several behavioral
  angles: execution of known wipers, ransomware, or file-manipulation tooling matched by hash and filename
  alongside unauthorized write/delete/rename activity on protected data; legitimate system utilities and
  scripting engines invoked with destructive overwrite, deletion, or corruption arguments (e.g. cipher
  /w, sdelete, fsutil setZeroData, Remove-Item -Recurse -Force); cryptographic hash/baseline mismatches
  on critical files signaling tamper-evidence violations; abnormal spikes in file modification or deletion
  rates on hosts and shares outside maintenance windows; and bursts of file renames converging on uniform
  or suspicious extensions indicative of encryption or overwrite. Detection methods combine symbolic-logic
  rules, statistical baselining and change-point analysis (write-entropy, rarity, failure-state, modification-spike
  scoring), and machine-learning models (hierarchical Random Forest, Isolation Forest, DBSCAN clustering,
  time-series CPD) applied to Windows Security events (4688, 4663, 4659, 4660, 4670, 4656), Sysmon (EID
  1, 11, 15, 23, 26), auditd syscalls, macOS unified logs and osquery/FSEvents, and Zeek smb_files.log,
  so the analyst can corroborate suspected stored-data manipulation against process lineage, file/path
  sensitivity, change records, and notarized digests or backups.'
type: technique
