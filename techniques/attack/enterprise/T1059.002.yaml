name: 'T1059.002: AppleScript'
id: 6f691a64-76c5-4e24-852d-ff7afef9e77b
description: 'This playbook helps an analyst investigate adversary abuse of AppleScript (T1059.002) for
  execution on macOS endpoints. It guides triage across several distinct execution patterns: osascript
  invocations that reference malicious script files, inline payloads, or spawn suspicious child processes;
  inline `osascript -e` commands carrying shell, decode, downloader, or credential-prompt logic; user-facing
  applications (Office, Preview, Mail, browsers) spawning osascript in document-borne or socially engineered
  chains; osascript-driven writes into LaunchAgents, LaunchDaemons, ScriptingAdditions, and other persistence
  locations; and fileless in-process execution via the NSAppleScript / OSAScript Native APIs or run-only
  compiled scripts that never invoke /usr/bin/osascript. For each pattern it supplies symbolic-logic detections,
  statistical baselining, and machine-learning approaches against endpoint (macOS Unified Log, EndpointSecurity,
  FSEvents, FIM) and network (Zeek) telemetry so an analyst can determine whether AppleScript is being
  used as a malicious execution proxy rather than benign automation.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any osascript execution reference a script file, inline payload, or child process that
    matches known malicious indicators (file hash, destination IP/domain, JA3/JA3S) or contact suspicious
    external infrastructure shortly after launch?
  context: 'Under the Execution tactic adversaries abuse AppleScript as an execution proxy, commonly running
    `osascript -e "do shell script ..."` or `.scpt` files that stage downloaders (curl/wget/nscurl) and
    second-stage payloads, as in RustBucket. For each osascript exec captured in EndpointSecurity (ES_EVENT_TYPE_NOTIFY_EXEC),
    resolve the script path or inline `-e` payload, hash referenced files, and pivot on destination IP/domain,
    TLS JA3/JA3S, and child-process artifacts, matching each stage against threat intelligence. A match
    on any stage strongly indicates malicious use; absence of matches with normal automation context lowers
    suspicion. Anchor on tokens like `do shell script`, `osascript -e`, `.scpt`, and curl/wget staging.
    Citations: [How Offensive Actors Use AppleScript, SentinelOne](https://www.sentinelone.com/blog/how-offensive-actors-use-applescript-for-attacking-macos/);
    [RustBucket, Elastic Security Labs](https://www.elastic.co/security-labs/the-dprk-strikes-using-a-new-variant-of-rustbucket).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: macOS endpoints, DNS resolvers, network egress points, threat intelligence enrichment services'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EVENT exec WHERE process.name == "osascript"

      | EXTRACT script_path, inline_e_payload, file_hash, child_procs

      | ENRICH file_hash, dest_ip, dest_domain, ja3, ja3s WITH threat_intel

      | JOIN zeek_conn/dns/ssl ON host WITHIN 5m AFTER exec

      | WHERE ti_match(file_hash) OR ti_match(dest_ip|dest_domain|ja3|ja3s) OR ti_match(child_hash)

      | ALERT'
  - technology: Zeek/pseudocode
    query: 'conn.log JOIN dns.log JOIN ssl.log ON uid/host

      | WHERE host IN (hosts where osascript exec''d within 5m prior)

      | WHERE dest IN ti_indicators OR ja3 IN ti_ja3 OR query IN ti_domains

      | OUTPUT host, dest, ja3, ts'
- question: Which osascript launches occur in rare contexts (unusual parent process, launching user, code
    signer, or network destination) when compared against a 30-day per-host/role baseline of benign AppleScript
    activity?
  context: 'Legitimate AppleScript automation is repetitive and narrow per host/role. To find malicious
    execution, maintain 30-day baselines of osascript parent process, launching user, code signer, network
    destination, and child-process prevalence, then surface executions whose combined context falls below
    the 1st percentile. Track Volume (bytes downloaded after launch), Frequency (osascript execs/hour
    per host), and State (failed/blocked egress, HTTP 404, NXDOMAIN) as distinct features, since staged
    C2 often produces download failures. A rare-context launch with download failures is a high-value
    lead; common context within baseline is likely benign automation. Citations: [Going off script, Red
    Canary/Jamf/MITRE](https://redcanary.com/blog/threat-detection/applescript/); [RustBucket, Elastic
    Security Labs](https://www.elastic.co/security-labs/the-dprk-strikes-using-a-new-variant-of-rustbucket).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: macOS endpoints, DNS resolvers, network egress points, threat intelligence enrichment services'
  range: Last 90 days; baseline trailing 30 days, evaluate per execution
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = stats over last 30d BY host, role:\n  set(parent_proc), set(user), set(signer),\
      \ set(dest), pctl(child_count)\nfor each osascript exec:\n  ctx_score = rarity(parent_proc) + rarity(user)\
      \ + rarity(signer) + rarity(dest)\n  volume = bytes_downloaded_after_launch\n  freq = osascript_exec_per_hour(host)\n\
      \  state = count(failed_egress|http_404|nxdomain)\n  ALERT WHERE percentile(ctx_score) < 1 OR (state\
      \ > 0 AND ctx_rare)"
- question: Does a supervised lineage classifier score an osascript execution as malicious based on parent
    lineage, argument structure, script-path characteristics, child-process behavior, and network outcomes?
  context: 'Symbolic rules and baselines miss novel combinations; a supervised gradient-boosted/lineage
    classifier trained on labeled AppleScript executions can capture subtle malicious patterns. Features
    include parent lineage, argument structure, script-path characteristics, child-process behavior, and
    network outcomes. Escalate events above the tuned malicious-probability threshold and emit the top-3
    contributing features (e.g., parent app, inline `do shell script`, rare destination) for triage. Generate
    labeled telemetry with Atomic Red Team T1059.002. A high-probability score with explanatory features
    is an investigative lead; consistently low scores indicate benign automation. Citations: [Atomic Red
    Team T1059.002](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.002/T1059.002.md);
    [Obfuscated Command Line Detection, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: macOS endpoints, DNS resolvers, network egress points, threat intelligence enrichment services'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = features(parent_lineage, arg_structure, script_path_chars, child_behavior, net_outcome)\n\
      score = gbm_lineage_clf.predict_proba(X)\nif score > threshold:\n  ALERT with top3_shap_features(X)"
- question: Do any inline `osascript -e` commands contain high-risk AppleScript or shell behaviors such
    as `do shell script`, base64/openssl/xxd decode chains, `display dialog` credential prompts, downloaders
    (curl/wget/nscurl), clipboard reads, JXA eval+NSData URL fetches, or `osacompile -x` run-only compilation
    inconsistent with approved automation?
  context: 'Inline `osascript -e` payloads are a favored adversary delivery channel because they leave
    no script file on disk. Parse inline content and alert on high-risk tokens: `do shell script`, base64/`openssl`/`xxd`
    decode chains, `display dialog` credential prompts, downloader commands (curl/wget/nscurl), shell
    launches, clipboard reads (`the clipboard`), JXA `eval`+`NSData.dataWithContentsOfURL`, and `osacompile
    -x` run-only compilation. Compare against approved automation; tokens inconsistent with sanctioned
    tasks indicate payload retrieval, credential theft, or evasion. This mirrors SigmaHQ macOS OSA rule
    tokens. Matches warrant immediate triage; familiar admin patterns are lower risk. Citations: [Sigma
    macOS OSA rules, SigmaHQ](https://github.com/SigmaHQ/sigma/tree/master/rules/macos/process_creation);
    [How Offensive Actors Use AppleScript, SentinelOne](https://www.sentinelone.com/blog/how-offensive-actors-use-applescript-for-attacking-macos/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - 'NAI: macOS endpoints, centralized command-line telemetry, endpoint detection platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EVENT exec WHERE process.name == \"osascript\" AND cmdline CONTAINS \"-e\"\n| WHERE cmdline\
      \ MATCHES ANY (\"do shell script\", \"base64\", \"openssl\", \"xxd\",\n    \"display dialog\", \"\
      curl\", \"wget\", \"nscurl\", \"the clipboard\",\n    \"NSData.dataWithContentsOfURL\", \"eval\"\
      )\n  OR (process.name == \"osacompile\" AND cmdline CONTAINS \"-x\")\n| WHERE NOT in_approved_automation(host,\
      \ user, cmdline)\n| ALERT"
- question: Is a newly observed inline AppleScript unusually long, high-entropy, or shell-command-dense
    compared to the host-role baseline, indicating obfuscation or encoded payloads?
  context: 'Obfuscated and encoded inline scripts deviate statistically from benign automation. Baseline
    inline AppleScript length, Shannon entropy, and shell-command density by host role; alert when a new
    inline script exceeds the 95th percentile for obfuscation, when encoded payload entropy exceeds ~7.0,
    or when AppleEvent verb combinations are first-seen for that user/endpoint. KL-divergence against
    an expected character distribution isolates randomized strings better than raw entropy. High obfuscation
    in an execution context is a strong lead; short, low-entropy, familiar scripts are likely benign.
    Citations: [Using Entropy in Threat Hunting, Red Canary](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/);
    [High Command Line Entropy, Elastic](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - 'NAI: macOS endpoints, centralized command-line telemetry, endpoint detection platform'
  range: Last 90 days; baseline trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline BY host_role: pctl(len), pctl(entropy), pctl(shell_cmd_density)\nfor each inline\
      \ osascript -e:\n  e = shannon_entropy(payload); kl = kl_divergence(payload_char_dist, expected)\n\
      \  ALERT WHERE len > p95 OR entropy > p95 OR e > 7.0 OR kl high\n    OR first_seen(appleevent_verbs,\
      \ user, host)"
- question: Does a text/sequence classifier score an inline AppleScript/JXA payload as malicious based
    on character-frequency, token, and structural features?
  context: 'Some malicious inline scripts evade token rules and entropy thresholds yet differ structurally
    from benign automation. Apply a text/sequence classifier trained on benign automation snippets and
    malicious AppleScript/JXA samples using character-frequency, token, and structural features to score
    inline-script intent. Prioritize high-confidence malicious executions and surface the top-3 driving
    features. Structural-feature methodology transfers from Revoke-Obfuscation and Mandiant obfuscated
    command-line detection. A high malicious score with explanatory features is an investigative lead;
    low scores across runs indicate routine automation. Citations: [Revoke-Obfuscation, Bohannon and Holmes](https://github.com/danielbohannon/Revoke-Obfuscation);
    [Obfuscated Command Line Detection, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - 'NAI: macOS endpoints, centralized command-line telemetry, endpoint detection platform'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = text_features(char_freq, tokens, structure) of inline_payload

      score = applescript_intent_clf.predict_proba(X)

      if score > threshold: ALERT with top3_features(X)'
- question: Did a user-facing application (Microsoft Word/Excel/PowerPoint, Preview, Mail, Safari/Chrome)
    spawn osascript, osacompile, a shell, curl/wget, or python whose resulting process tree made outbound
    connections, launched shells, or touched persistence paths within a short window?
  context: 'Document-borne and socially engineered execution often begins when a document, mail, or browser
    application spawns osascript. Under the Execution tactic, alert when these parents (Word/Excel/PowerPoint,
    Preview, Mail, Safari/Chrome) spawn `osascript`, `osacompile`, a shell, curl/wget, or python, and
    the resulting tree makes outbound connections, launches shells, or touches persistence paths within
    a short window. This follows macOS Office-child and browser-child lineage rules. Such a chain from
    a productivity app is highly suspicious because these apps rarely invoke scripting interpreters; expected
    automation tools spawning osascript are lower risk. Citations: [Sigma macOS OSA rules, SigmaHQ](https://github.com/SigmaHQ/sigma/tree/master/rules/macos/process_creation);
    [Suspicious Browser Child Process, Elastic](https://github.com/elastic/detection-rules/blob/main/rules/macos/execution_initial_access_suspicious_browser_childproc.toml);
    [Word to Your Mac, Objective-See](https://objective-see.org/blog/blog_0x4B.html).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: User workstations in high-exposure departments, network egress points, DNS and TLS inspection
    sensors'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EVENT exec WHERE parent.name IN (\"Microsoft Word\",\"Microsoft Excel\",\n    \"Microsoft\
      \ PowerPoint\",\"Preview\",\"Mail\",\"Safari\",\"Google Chrome\")\n  AND child.name IN (\"osascript\"\
      ,\"osacompile\",\"sh\",\"bash\",\"zsh\",\"curl\",\"wget\",\"python\")\n| JOIN net_conn, file_write\
      \ ON tree WITHIN 5m\n| WHERE outbound_conn OR shell_launch OR write_to_persistence_path\n| ALERT"
  - technology: Zeek/pseudocode
    query: 'conn.log JOIN dns.log JOIN ssl.log

      | WHERE host IN (hosts where doc_app->osascript chain seen within 5m)

      | OUTPUT host, dest, query, ja3, ts'
- question: Which parent-application-to-osascript chains are uncommon by child frequency, destination
    rarity, downloaded byte volume, or post-launch failure rate compared to per-application enterprise
    baselines?
  context: 'Benign apps have stable osascript-spawning profiles. Build per-application baselines for osascript
    child frequency (children/hour), destination rarity, downloaded byte volume, and follow-on failure
    rate (blocked connections, 404/NXDOMAIN). Flag chains whose parent->osascript relationship or destination
    falls below the 1st percentile of enterprise prevalence, or whose post-launch download fails repeatedly.
    Rare parent-child relationships and repeated download failures suggest staged C2 from document-driven
    execution; common, successful patterns are likely benign. Citations: [Going off script, Red Canary/Jamf/MITRE](https://redcanary.com/blog/threat-detection/applescript/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: User workstations in high-exposure departments, network egress points, DNS and TLS inspection
    sensors'
  range: Last 90 days; baseline trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline BY parent_app: rate(osascript_children/hr), set(dest), pctl(bytes), fail_rate\nfor\
      \ each parent->osascript chain:\n  ALERT WHERE percentile(parent_child_prevalence) < 1\n    OR percentile(dest_prevalence)\
      \ < 1\n    OR repeated(post_launch_download_failures)"
- question: Does a sequence-anomaly model flag a document-driven parent->osascript->network->child chain
    as diverging from known-good user workflows?
  context: 'Document-to-script kill chains can be subtle, so model the parent->osascript->network->child
    token sequence with a sequence-anomaly model (e.g., transformer/DistilBERT-style) to identify chains
    diverging from known-good user workflows, reporting the top-3 anomalous sequence steps. The approach
    transfers from anomaly detection of command shell sessions based on DistilBERT. A high anomaly score
    with identifiable divergent steps is an investigative lead under the Execution tactic; sequences matching
    learned benign workflows are lower priority. Citations: [Anomaly Detection of Command Shell Sessions
    based on DistilBERT](https://arxiv.org/abs/2310.13247).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: User workstations in high-exposure departments, network egress points, DNS and TLS inspection
    sensors'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = tokenize(parent -> osascript -> network -> child)

      score = seq_anomaly_model(seq)   # transformer/DistilBERT-style

      if score > threshold: ALERT with top3_anomalous_steps(seq)'
- question: Did an osascript/osacompile process or its immediate child create, rename, chmod, or modify
    plists in LaunchAgents, LaunchDaemons, ScriptingAdditions, login items, or ~/Library/Application Support,
    indicating AppleScript-driven persistence?
  context: 'AppleScript execution is frequently used to establish follow-on persistence, as in RustBucket
    and OSAMiner. Correlate `osascript`/`osacompile` and their children with file creation, rename, chmod,
    or plist modification in `~/Library/LaunchAgents`, `/Library/LaunchAgents`, `/Library/LaunchDaemons`,
    login items, ScriptingAdditions, and `~/Library/Application Support`, alerting when AppleScript is
    the initiating mechanism. Although this evidence is mapped under Execution, a persistence write driven
    by AppleScript is a strong indicator of intrusion; legitimate management tooling writing these paths
    (not via osascript) is lower risk. Citations: [RustBucket, Elastic Security Labs](https://www.elastic.co/security-labs/the-dprk-strikes-using-a-new-variant-of-rustbucket);
    [Fade Dead, SentinelLabs](https://www.sentinelone.com/labs/fade-dead-adventures-in-reversing-malicious-run-only-applescripts/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: System-wide and user-specific macOS persistence directories, endpoint file integrity monitoring
    platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EVENT file_op WHERE op IN (create, rename, chmod, modify)\n  AND path MATCHES (\"~/Library/LaunchAgents/*\"\
      ,\"/Library/LaunchAgents/*\",\n    \"/Library/LaunchDaemons/*\",\"*/ScriptingAdditions/*\",\n  \
      \  \"*login items*\",\"~/Library/Application Support/*\")\n| JOIN exec WHERE initiator IN (\"osascript\"\
      ,\"osacompile\") OR ancestor IN (osascript tree)\n| ALERT"
- question: Do AppleScript-driven writes into persistence directories exceed the 99th percentile of benign
    automation by count, file type, or chmod pattern for that host/user?
  context: 'Persistence establishment produces measurable filesystem deviations. Maintain host/user baselines
    for AppleScript-driven writes into persistence directories: Volume of new plists, Frequency of writes/hour,
    and State of permission changes. Alert when count, file type, or chmod pattern exceeds the 99th percentile
    of benign automation activity. A burst of new plists or unusual chmod (e.g., making a payload executable)
    following osascript execution is a strong persistence indicator; activity within historical norms
    is likely sanctioned management. Citations: [Going off script, Red Canary/Jamf/MITRE](https://redcanary.com/blog/threat-detection/applescript/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: System-wide and user-specific macOS persistence directories, endpoint file integrity monitoring
    platform'
  range: Last 90 days; baseline trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline BY host, user: pctl(new_plists), rate(writes/hr), set(chmod_patterns)\nfor each applescript-linked\
      \ persistence write:\n  ALERT WHERE count > p99 OR new_file_type OR chmod_pattern NOT IN baseline"
- question: Does an anomaly model over AppleScript-linked filesystem events (path class, signer metadata,
    permission changes, follow-on process behavior) surface a persistence workflow that does not resemble
    sanctioned management tasks?
  context: 'Run-only and unsigned persistence workflows can evade signatures. Train an anomaly model over
    AppleScript-linked filesystem events using path class, signer metadata, permission changes, and follow-on
    process behavior to surface persistence workflows unlike sanctioned management, surfacing the top-3
    contributing features (path, unsigned writer, run-only payload). Methodology informed by SentinelLabs
    run-only AppleScript research. A high-anomaly persistence lifecycle with an unsigned writer and run-only
    payload is a strong lead; signed, routine management workflows score low. Citations: [Fade Dead, SentinelLabs](https://www.sentinelone.com/labs/fade-dead-adventures-in-reversing-malicious-run-only-applescripts/).'
  answer_sources:
  - macOS Unified Log
  - macOS EndpointSecurity
  - macOS FSEvents
  - macOS File Integrity Monitoring
  - 'NAI: System-wide and user-specific macOS persistence directories, endpoint file integrity monitoring
    platform'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = features(path_class, signer_meta, perm_changes, followon_behavior)

      score = persistence_anomaly_model(X)

      if score > threshold: ALERT with top3_features(X)'
- question: Did an application or Mach-O binary execute AppleScript in-process via NSAppleScript/OSAScript
    (or run-only compiled scripts) without spawning /usr/bin/osascript, evidenced by OpenScripting/AppleScript
    framework loads or AppleEvent dispatch from non-scripting binaries that then spawn shells or open
    network connections?
  context: 'Adversaries can run AppleScript fileless via the Native APIs `NSAppleScript`/`OSAScript`,
    leaving no osascript process. Alert on EndpointSecurity library-load/API telemetry showing OpenScripting/AppleScript
    framework usage or AppleEvent dispatch from non-scripting binaries that subsequently spawn shells
    or open network connections, and on `osacompile -x` run-only scripts being loaded. Because there is
    no osascript exec event, this detection relies on framework/library-load and AppleEvent telemetry.
    A non-scripting binary loading the AppleScript framework and then executing shells/egress is a strong
    fileless-execution indicator under the Execution tactic. Citations: [macOS Red Team, SentinelOne](https://www.sentinelone.com/blog/macos-red-team-calling-apple-apis-without-building-binaries/);
    [Going off script, Red Canary/Jamf/MITRE](https://redcanary.com/blog/threat-detection/applescript/).'
  answer_sources:
  - macOS EndpointSecurity
  - macOS Unified Log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: macOS endpoints with EndpointSecurity API/library and AppleEvent telemetry, network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EVENT (library_load OR api_call) WHERE module MATCHES\n    (\"OpenScripting.framework\",\"\
      AppleScript.framework\")\n  AND process.name != \"osascript\"\n| OR EVENT appleevent_dispatch WHERE\
      \ sender NOT IN scripting_apps\n| JOIN exec/net WHERE process spawns shell OR opens outbound_conn\
      \ WITHIN 5m\n| ALERT"
  - technology: Zeek/pseudocode
    query: 'conn.log JOIN dns.log

      | WHERE host IN (hosts where non-scripting binary loaded AppleScript framework within 5m)

      | OUTPUT host, dest, query, ts'
- question: Which applications sending AppleEvents or loading the AppleScript framework are first-seen
    or unsigned, and which run-only compiled scripts have stripped-source entropy above the benign 95th
    percentile?
  context: 'Fileless OSA execution is best caught by baselining who normally drives AppleEvents. Maintain
    per-host baselines of which signed applications normally send AppleEvents or load the AppleScript
    framework, plus the entropy/length distribution of compiled `.scpt` payloads. Alert on first-seen
    senders, unsigned senders, or run-only scripts whose stripped-source entropy exceeds the benign 95th
    percentile. First-seen or unsigned AppleEvent senders and high-entropy run-only scripts indicate evasive
    execution; established signed senders with normal payloads are benign. Citations: [Fade Dead, SentinelLabs](https://www.sentinelone.com/labs/fade-dead-adventures-in-reversing-malicious-run-only-applescripts/);
    [Using Entropy in Threat Hunting, Red Canary](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).'
  answer_sources:
  - macOS EndpointSecurity
  - macOS Unified Log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: macOS endpoints with EndpointSecurity API/library and AppleEvent telemetry, network egress points'
  range: Last 90 days; baseline trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline BY host: set(signed_appleevent_senders), set(framework_loaders),\n  pctl(scpt_entropy),\
      \ pctl(scpt_len)\nfor each appleevent/framework_load/run-only script:\n  ALERT WHERE first_seen(sender)\
      \ OR unsigned(sender)\n    OR scpt_entropy > p95"
- question: Does an unsupervised anomaly model over EndpointSecurity API/library-load, AppleEvent, and
    follow-on process/network telemetry surface fileless OSA execution or run-only payloads that evade
    content inspection?
  context: 'Run-only and fileless OSA payloads evade content inspection, so train an unsupervised anomaly
    model over EndpointSecurity API/library-load, AppleEvent, and follow-on process/network telemetry
    to surface them, emitting the top-3 contributing features (e.g., unsigned AppleEvent sender, framework
    load by atypical process, follow-on egress). A high-anomaly fileless execution with an unsigned sender
    and follow-on egress is a strong lead under the Execution tactic; routine framework usage by expected
    signed apps scores low. Citations: [macOS Red Team, SentinelOne](https://www.sentinelone.com/blog/macos-red-team-calling-apple-apis-without-building-binaries/);
    [Fade Dead, SentinelLabs](https://www.sentinelone.com/labs/fade-dead-adventures-in-reversing-malicious-run-only-applescripts/).'
  answer_sources:
  - macOS EndpointSecurity
  - macOS Unified Log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: macOS endpoints with EndpointSecurity API/library and AppleEvent telemetry, network egress points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = features(api_library_load, appleevent_sender, followon_proc, followon_net)

      score = fileless_osa_anomaly_model(X)   # unsupervised

      if score > threshold: ALERT with top3_features(X)'
