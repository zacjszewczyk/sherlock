name: 'T1574.009: Hijack Execution Flow: Path Interception by Unquoted Path'
id: 74f18aa0-c43d-40cc-91d2-b9051e2f1f9f
description: Investigate adversary abuse of unquoted Windows service and shortcut paths (path interception
  by unquoted path) to hijack execution flow for persistence, privilege escalation, defense evasion, and
  execution. When a service ImagePath contains a space and is not wrapped in quotation marks (for example
  C:\Program Files\My App\svc.exe instead of "C:\Program Files\My App\svc.exe"), Windows resolves each
  space-delimited prefix in turn (C:\Program.exe, C:\Program Files\My.exe), so an attacker who can write
  an executable into an ancestor directory causes Windows to launch the planted binary instead of the
  intended service image. This playbook helps an analyst (1) enumerate vulnerable unquoted service paths
  from the registry and precompute their exact interception targets; (2) correlate the full hijack chain
  of an interception-path file creation followed by a service install/restart, execution of the planted
  binary in service/SYSTEM context, and any follow-on network egress; (3) detect privilege escalation
  when a non-admin identity writes the interception binary that later runs elevated; and (4) detect defense
  evasion when the hijacked service is a security/EDR product and its telemetry, heartbeat, or stability
  drops. It pairs high-fidelity symbolic-logic rules with statistical baselining (prevalence, entropy,
  modified Z-score) and machine-learning provenance/graph and autoencoder models to surface low-and-slow
  abuse that blends in with legitimate service activity.
type: technique
