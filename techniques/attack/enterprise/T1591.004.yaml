- question: '[Reconnaissance] Connection failure ratio scoring: Can you determine whether an inbound connection
    attempt from an external IP address that is present on a threat intelligence feed listing IPs associated
    with reconnaissance activity. -- specifically, applying the ''Connection failure ratio scoring'' (Statistical
    Method) approach to confirm or rule out adversary reconnaissance to identify organizational roles?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers information
    about identities and business roles within the victim organization to identify key personnel and the
    data/resources they can access, fueling later phishing, account establishment/compromise, and initial
    access. This evidence focuses on the condition that an inbound connection attempt from an external
    IP address that is present on a threat intelligence feed listing IPs associated with reconnaissance
    activity. The Statistical Method approach works as follows: For each external source IP, compute Volume
    (total attempts), Frequency (attempts/min), and State by calculating the ratio of failed connection
    states (REJ, RSTO, RSTR, S0) to successful states (SF) within a 1-hour window. Flag any IP whose failure
    ratio is in the top 99th percentile of external traffic AND has >=20 attempts. This operationalizes
    the sequential success/failure model: scanners overwhelmingly fail because they contact non-listening
    services Fast Portscan Detection Using Sequential Hypothesis Testing, Jung et al. Derive the percentile
    cutoff from your own 30-day conn.log baseline. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable external reconnaissance enumerating roles, accounts, or exposed
    services; pivot to the source IP and its reputation/history, the targeted assets and accounts, the
    volume/frequency/state of the activity, and any follow-on access attempts to scope the campaign. A
    negative result helps rule out this specific reconnaissance vector but should be corroborated with
    the other questions in this playbook, since determined actors spread activity low-and-slow, across
    many source IPs, or outside your visibility.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway, DMZ Firewalls, Cloud VPC Flow Logs, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_conn WHERE local_orig=false GROUP BY id_orig_h, window=1h

      volume := count(*); freq := count(*)/60

      fails := count(conn_state IN (''REJ'',''RSTO'',''RSTR'',''S0''))

      succ  := count(conn_state=''SF'')

      ratio := fails / nullif(succ,0)

      p99 := percentile(ratio, 99, baseline=30d)

      IF ratio >= p99 AND volume >= 20 THEN alert(id_orig_h, ratio, volume)'
- question: '[Reconnaissance] Sequential hypothesis test (TRW): Can you determine whether an inbound connection
    attempt from an external IP address that is present on a threat intelligence feed listing IPs associated
    with reconnaissance activity. -- specifically, applying the ''Sequential hypothesis test (TRW)'' (Statistical
    Method) approach to confirm or rule out adversary reconnaissance to identify organizational roles?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers information
    about identities and business roles within the victim organization to identify key personnel and the
    data/resources they can access, fueling later phishing, account establishment/compromise, and initial
    access. This evidence focuses on the condition that an inbound connection attempt from an external
    IP address that is present on a threat intelligence feed listing IPs associated with reconnaissance
    activity. The Statistical Method approach works as follows: Implement Threshold Random Walk: treat
    each new connection from a source IP as a Bernoulli trial (success=SF, failure=REJ/RSTO/RSTR/S0) and
    accumulate the log-likelihood ratio between benign (high success) and scanner (low success) hypotheses
    until it crosses thresholds set by target false-positive (e.g., 0.01) and false-negative (e.g., 0.01)
    rates. Alert when the upper threshold is crossed, typically after 4-5 failed attempts, for fast first-party
    scan detection Fast Portscan Detection Using Sequential Hypothesis Testing, Jung et al. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable external reconnaissance
    enumerating roles, accounts, or exposed services; pivot to the source IP and its reputation/history,
    the targeted assets and accounts, the volume/frequency/state of the activity, and any follow-on access
    attempts to scope the campaign. A negative result helps rule out this specific reconnaissance vector
    but should be corroborated with the other questions in this playbook, since determined actors spread
    activity low-and-slow, across many source IPs, or outside your visibility.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway, DMZ Firewalls, Cloud VPC Flow Logs, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Threshold Random Walk per source IP\ntheta0=0.8 (benign P(success)); theta1=0.2 (scanner)\n\
      upper=ln((1-beta)/alpha); lower=ln(beta/(1-alpha)) with alpha=beta=0.01\nFOR each new conn from\
      \ src:\n  outcome := (conn_state='SF') ? success : failure\n  L += ln( P(outcome|theta1) / P(outcome|theta0)\
      \ )\n  IF L >= upper THEN alert(src, 'scanner') ; reset\n  IF L <= lower THEN reset"
