name: 'T1591.004: Identify Roles'
id: 1ecbaa9c-b558-496a-b48a-270aa03b6070
description: 'This playbook helps an analyst investigate whether an external adversary is conducting reconnaissance
  to identify organizational roles and the identities/resources tied to them (MITRE ATT&CK T1591.004,
  Identify Roles), activity that typically precedes phishing, account establishment or compromise, and
  initial access. Because role-identification often happens outside the target''s visibility (via social
  media, public websites, or third-party leaks), the hunt concentrates on the observable touch-points
  where reconnaissance reaches the perimeter: inbound connections from threat-intel-listed or first-seen
  external source IPs, port scans and service sweeps, web enumeration and scraping against public-facing
  applications, credential enumeration and password spraying against external authentication services,
  and bulk extraction of identity/role data through exposed files or API endpoints. Detection methods
  combine deterministic symbolic-logic rules (CTI IP correlation, first-time-edge floors, scanner user-agent
  and sensitive-path signatures, port-scan and failed-login thresholds, distinct-user spray rules), statistical
  baselining (connection failure-ratio and port-count scoring, Threshold Random Walk sequential hypothesis
  testing, 404/path-entropy and username-entropy scoring, parameter and Bayesian new-edge models, ARIMA/SARIMA
  forecasting, distributed-spray aggregation, and download-rarity scoring), and machine learning (Random
  Forest/Gradient Boosting classifiers, Isolation Forest and DBSCAN flow outlier/clustering, OC4Seq request-sequence
  models, and autoencoder API anomaly detection). Telemetry spans Zeek conn/http/files logs and Windows
  Security events (4625), so the analyst can corroborate suspected reconnaissance across source-IP reputation,
  scan and enumeration behavior, authentication failure patterns, and identity-data exposure.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
