questions:
- question: '[Reconnaissance] Reconnaissance IP IOC correlation: Can you determine whether an inbound
    connection attempt from an external IP address that is present on a threat intelligence feed listing
    IPs associated with reconnaissance activity. -- specifically, applying the ''Reconnaissance IP IOC
    correlation'' (Symbolic Logic) approach to confirm or rule out adversary reconnaissance to identify
    organizational roles?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers information
    about identities and business roles within the victim organization to identify key personnel and the
    data/resources they can access, fueling later phishing, account establishment/compromise, and initial
    access. This evidence focuses on the condition that an inbound connection attempt from an external
    IP address that is present on a threat intelligence feed listing IPs associated with reconnaissance
    activity. The Symbolic Logic approach works as follows: Correlate the source IP addresses from all
    inbound Zeek conn.log entries against a high-confidence, frequently updated cyber threat intelligence
    (CTI) feed of IPs known for scanning or hosting reconnaissance tools. Generate an alert for any match
    to investigate the scope and targets of the activity. This is a supporting enrichment layer only;
    do not gate primary detection on external lookups On Bayesian new edge prediction and anomaly detection
    in computer networks, Metelli and Heard. A positive result -- a rule match, statistical outlier, or
    model alert -- indicates probable external reconnaissance enumerating roles, accounts, or exposed
    services; pivot to the source IP and its reputation/history, the targeted assets and accounts, the
    volume/frequency/state of the activity, and any follow-on access attempts to scope the campaign. A
    negative result helps rule out this specific reconnaissance vector but should be corroborated with
    the other questions in this playbook, since determined actors spread activity low-and-slow, across
    many source IPs, or outside your visibility.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway, DMZ Firewalls, Cloud VPC Flow Logs, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'LET cti = lookup_feed(''recon_scanner_ips'')

      FROM zeek_conn WHERE local_orig=false

      JOIN cti ON conn.id_orig_h = cti.ip

      EMIT alert(src=id_orig_h, hits=count(*), targets=distinct(id_resp_h))

      // enrichment layer only; do not gate primary detection on feed hits'
