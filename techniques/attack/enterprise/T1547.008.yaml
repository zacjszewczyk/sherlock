questions:
- question: 'Using deterministic rule logic, can you determine whether ''LSA package allowlist & IOC match''
    indicates LSASS Driver / LSA Security Package abuse (T1547.008) supporting Persistence (CCIR: Is the
    adversary maintaining persistence by modifying or adding malicious LSASS drivers?)? Specifically:
    Alert on Sysmon 13 / Windows 4657 writes to `...\Control\Lsa\Security Packages` (and `...\OSConfig\Security
    Packages`) and diff Old/New value; flag any added package name NOT in the documented Microsoft built-in
    set (kerberos, msv1_0, schannel, wdigest, tspkg, pku2u, negoexts, cloudAP, negotiate) per [SSP Packages
    Provided by Microsoft](https://learn.microsoft.com/en-us/windows/win32/secauthn/ssp-packages-provided-by-microsoft),
    or whose DLL name/hash (Sysmon 11/1) matches TI. Exclude msiexec as a benign writer per [SigmaHQ SSP
    rule](https://detection.fyi/sigmahq/sigma/windows/registry/registry_event/registry_event_ssp_added_lsa_config/);
    attribute the writer process/account via [Event 4657 fields](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4657).'
  context: 'Tactic context (Persistence / TA0003): The adversary is trying to maintain their foothold.
    Information requirement: Is the adversary maintaining persistence by modifying or adding malicious
    LSASS drivers? Evidence under investigation: A DLL added to the LSA Security Packages registry key
    matches a known-malicious LSA driver/package name or its on-disk file hash matches threat intelligence;
    or the added package name is not in the documented Microsoft built-in set (kerberos, msv1_0, schannel,
    wdigest, tspkg, pku2u, negoexts, cloudAP, negotiate). Approach (LSA package allowlist & IOC match
    -- Symbolic Logic): Alert on Sysmon 13 / Windows 4657 writes to `...\Control\Lsa\Security Packages`
    (and `...\OSConfig\Security Packages`) and diff Old/New value; flag any added package name NOT in
    the documented Microsoft built-in set (kerberos, msv1_0, schannel, wdigest, tspkg, pku2u, negoexts,
    cloudAP, negotiate) per [SSP Packages Provided by Microsoft](https://learn.microsoft.com/en-us/windows/win32/secauthn/ssp-packages-provided-by-microsoft),
    or whose DLL name/hash (Sysmon 11/1) matches TI. Exclude msiexec as a benign writer per [SigmaHQ SSP
    rule](https://detection.fyi/sigmahq/sigma/windows/registry/registry_event/registry_event_ssp_added_lsa_config/);
    attribute the writer process/account via [Event 4657 fields](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4657).
    A positive result means an LSA security package / lsass module has been added or loaded in a way inconsistent
    with the documented Microsoft built-in set, the host''s golden baseline, signing requirements, or
    normal fleet prevalence -- a strong indicator that an adversary has planted persistent, SYSTEM-level
    code inside lsass.exe; a negative result means the observed packages/modules match expected, signed,
    System32-resident baselines and authorized administrative activity. Investigate the named area of
    interest (Domain Controllers, Tier 0 Servers (e.g., AD CS, ADFS), Standard Enterprise Workstations,
    Threat Intelligence Platforms) and pivot from any hit to the writing process, the responsible account,
    parent-process lineage, the DLL on disk, and any subsequent lsass module load or credential-access
    activity.'
