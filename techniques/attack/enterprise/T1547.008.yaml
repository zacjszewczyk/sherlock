  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - 'NAI: Domain Controllers, Tier 0 Servers (e.g., AD CS, ADFS), Standard Enterprise Workstations, Threat
    Intelligence Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: LSA package allowlist & IOC match\n// Tactic TA0003 (Persistence);\
      \ Technique T1547.008\nMATCH events FROM (Windows Event ID 4657, Windows Event ID 4688, Sysmon Event\
      \ ID 1, Sysmon Event ID 11, Sysmon Event ID 13)\nWHERE registry_path MATCHES '.*\\\\Control\\\\\
      Lsa\\\\Security Packages'\n   OR registry_path MATCHES '.*\\\\OSConfig\\\\Security Packages'\n \
      \  OR (module.image == 'lsass.exe' AND module.loaded NOT IN golden_baseline)\nDIFF old_value vs\
      \ new_value -> added_pkg\nWHERE added_pkg NOT IN ['kerberos','msv1_0','schannel','wdigest','tspkg',\n\
      \                        'pku2u','negoexts','cloudAP','negotiate']\n   OR added_pkg.path NOT LIKE\
      \ '%windir%\\\\System32\\\\%'\n   OR added_pkg.signature IN ['unsigned','invalid']\n   OR added_pkg.hash\
      \ IN threat_intel\nEXCLUDE writer_process == 'msiexec.exe'\nENRICH writer_process, writer_account\
      \ (Event 4657 fields)\n-> ALERT (priority HIGH if non-admin or interactive shell context)"
