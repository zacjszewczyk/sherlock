  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic: LSA package allowlist & IOC match\n// Tactic TA0003 (Persistence); Technique\
      \ T1547.008\nMATCH writes TO ('...\\\\Control\\\\Lsa\\\\Security Packages', '...\\\\OSConfig\\\\\
      Security Packages')\n  FROM (Sysmon Event ID 13, Windows Event ID 4657)\nDIFF Old/New value -> added_pkg\n\
      WHERE added_pkg NOT IN ['kerberos','msv1_0','schannel','wdigest','tspkg',\n                    \
      \    'pku2u','negoexts','cloudAP','negotiate']\n   OR added_pkg.dll_name/hash (Sysmon Event ID 11\
      \ / Sysmon Event ID 1) IN threat_intel\nEXCLUDE writer_process == 'msiexec.exe'   // benign writer\
      \ per SigmaHQ SSP rule\nENRICH writer_process, writer_account via Event 4657 fields\n-> ALERT (priority\
      \ HIGH if non-admin or interactive-shell context)\n// refs: SSP Packages Provided by Microsoft;\
      \ SigmaHQ SSP rule; Event 4657 fields"
