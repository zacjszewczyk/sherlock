name: 'T1547.008: LSASS Driver'
id: 516c9a86-c27a-4b03-aa0f-c52a922fd27c
description: 'This playbook helps an analyst investigate adversary abuse of LSASS drivers / LSA Security
  Packages (T1547.008) to obtain persistence (TA0003) and escalate privileges (TA0004) on Windows hosts.
  The Local Security Authority Subsystem Service (lsass.exe) loads a documented set of security-support-provider
  and authentication DLLs; adversaries add or replace these by writing a malicious DLL name into HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Security
  Packages (and the OSConfig equivalent), then forcing lsass to load attacker code at every boot/logon
  with SYSTEM-level privilege. The playbook correlates registry-modification telemetry (Sysmon 13/12,
  Windows 4657), file-creation events (Sysmon 11), module/driver loads into lsass (Sysmon 7/6, Windows
  3033 module load), code-signing/plugin failures (Windows 3063/3033), and process/script execution (Windows
  4688, Sysmon 1, PowerShell 4104) to surface the full create -> register -> load kill chain. Investigative
  angles include: validating added LSA packages against the Microsoft built-in allowlist and threat intelligence;
  flagging DLLs outside %windir%\System32, unsigned modules, and low-prevalence/high-entropy files; golden-baseline
  enforcement of lsass module loads per OS build and server role; detection of BYOVD kernel-driver loads;
  regex hunting for LSA-registration command lines and obfuscated PowerShell; tight 60-second create/register/load
  sequence correlation; and triage of LSA plugin/signature-validation failures following anomalous process
  execution. Detection blends symbolic-logic rules, statistical baselining (prevalence, modification-rate
  sigma, entropy, percentile failure rates, Jaccard similarity), and machine learning (Random Forest/XGBoost
  classifiers, Isolation Forest anomaly scoring, DeepLog/LSTM sequence models, provenance-graph scoring)
  to produce explainable, evasion-resistant alerts for Tier 0 assets such as Domain Controllers and AD
  CS/ADFS servers as well as standard workstations.'
type: technique
