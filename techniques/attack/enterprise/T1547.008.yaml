    & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)). A burst of signature-validation
    failures indicates repeated attempts to register an unsigned package. A positive result means an LSA
    security package / lsass module has been added or loaded in a way inconsistent with the documented
    Microsoft built-in set, the host''s golden baseline, signing requirements, or normal fleet prevalence
    -- a strong indicator that an adversary has planted persistent, SYSTEM-level code inside lsass.exe;
    a negative result means the observed packages/modules match expected, signed, System32-resident baselines
    and authorized administrative activity. Investigate the named area of interest (Domain Controllers,
    Tier 0 Servers, System Event Log Aggregators, Endpoint Process Execution Logs) and pivot from any
    hit to the writing process, the responsible account, parent-process lineage, the DLL on disk, and
    any subsequent lsass module load or credential-access activity.'
