name: 'T1071.002: File Transfer Protocols'
id: aaa7e37a-4294-4513-aa8e-d170ab7a487c
description: 'This playbook helps an analyst investigate adversary use of File Transfer Protocols (T1071.002)
  for command and control: abusing FTP (TCP/21,20), FTPS (990,989), SMB (TCP/445,139), TFTP (UDP/69),
  and NFS (2049) to blend C2 and data movement into traffic that is common or expected in an environment.
  It correlates network telemetry (Zeek conn.log, ftp.log, smb.log, smb_files.log, smb_mapping.log, dns.log,
  notice.log, files.log, pe.log) with host telemetry (Sysmon Event ID 1/3, Windows Event ID 4688/5156/7045/4624,
  auditd execve/connect, macOS unified log/osquery, ESXi shell history) to surface the full attack chain.
  Investigative angles include: high-confidence C2 threat-intel matches and external SMB/TFTP egress that
  violates perimeter policy; low-prevalence or newly registered file-transfer destinations; SMB write-then-execute
  and FTP STOR/RNTO payload-staging chains; Cobalt Strike / Sliver / Mythic named-pipe and beacon signatures;
  asymmetric byte ratios and high-volume exfiltration; low-jitter beaconing and idle keep-alive channels;
  LOLBins and user-writable/unsigned binaries initiating file-transfer egress; and content-based detection
  of MIME/extension mismatches, high-entropy packed payloads, and YARA/PE anomalies in transferred files.
  Detection blends deterministic symbolic-logic floor rules, statistical baselining (percentiles, z-scores,
  entropy, Chi-squared, Zipf/KS, spectral periodicity, coefficient-of-variation), and machine learning
  (XGBoost, node2vec graph anomaly, LSTM/transformer sequence models, VAE/autoencoders, DBSCAN clustering,
  CNN file-type classifiers) to produce evasion-resistant, explainable alerts for the Command and Control
  tactic.'
type: technique
