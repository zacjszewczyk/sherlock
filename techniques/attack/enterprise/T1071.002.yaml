questions:
- question: 'Using deterministic rule logic, can you confirm whether the pattern described as ''File-transfer-protocol
    C2 threat-intel match'' is present and indicates File Transfer Protocol-based C2? Specifically: Ingest
    curated high-confidence C2 feeds (MISP, internal IOC, Mandiant, Recorded Future) and continuously
    monitor Zeek conn.log and Zeek ftp.log for connections where id.resp_p is 21, 20, 990 (FTPS), 989,
    445, 139, 69, 2049 (NFS), the destination IP is external (not in RFC 1918, not in cloud-vendor ranges
    on allowlist), and the IP, FQDN (cross-referenced via Zeek dns.log), or hostname matches the feed.
    Emit a high-priority alert per match. Suppress matches against documented partner FTP servers on an
    explicit allowlist. Output the connection UID, originating internal host, the matched IOC source/confidence,
    and the connection duration/bytes. This deterministic floor rule fires independently of any ML model,
    consistent with the SigmaHQ approach for known-bad infrastructure matching [SigmaHQ Detection Rules](https://github.com/SigmaHQ/sigma).'
  context: 'Tactic context (Command and Control / TA0011): the adversary is communicating with compromised
    systems by abusing file-transfer application-layer protocols (FTP, FTPS, SMB, TFTP, NFS) to blend
    C2 and data movement into common, expected traffic. Evidence under investigation: A successful network
    connection using FTP (TCP/21), SMB (TCP/445), or TFTP (UDP/69) is established between an internal
    host and an external IP address or domain present on a high-confidence C2 threat intelligence list.
    Approach (File-transfer-protocol C2 threat-intel match): Ingest curated high-confidence C2 feeds (MISP,
    internal IOC, Mandiant, Recorded Future) and continuously monitor Zeek conn.log and Zeek ftp.log for
    connections where id.resp_p is 21, 20, 990 (FTPS), 989, 445, 139, 69, 2049 (NFS), the destination
    IP is external (not in RFC 1918, not in cloud-vendor ranges on allowlist), and the IP, FQDN (cross-referenced
    via Zeek dns.log), or hostname matches the feed. Emit a high-priority alert per match. Suppress matches
    against documented partner FTP servers on an explicit allowlist. Output the connection UID, originating
    internal host, the matched IOC source/confidence, and the connection duration/bytes. This deterministic
    floor rule fires independently of any ML model, consistent with the SigmaHQ approach for known-bad
    infrastructure matching [SigmaHQ Detection Rules](https://github.com/SigmaHQ/sigma). A positive result
    is a deterministic, high-confidence indicator that should be triaged immediately; a negative result
    narrows the investigation but does not rule out evasive or custom tradecraft (escalate to the statistical
    and ML checks). Pursue this via the answer sources below, then pivot from any hit to the originating
    host, process, user/account, the external destination''s reputation and age, and any downstream staging,
    execution, lateral movement, or exfiltration.'
  answer_sources:
  - Zeek conn.log
  - Zeek ftp.log
  - Zeek dns.log
  - Zeek notice.log
  - 'NAI: Internet Gateway Firewalls, DNS Resolvers, Network Egress Points, Cloud Access Security Brokers
    (CASB)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Deterministic C2 IOC match on file-transfer ports\nLOAD c2_feed = MISP + internal_IOC +\
      \ Mandiant + RecordedFuture (high confidence)\nFROM conn.log JOIN dns.log ON resp_h\nWHERE id.resp_p\
      \ IN [21,20,990,989,445,139,69,2049]\n  AND id.resp_h NOT IN rfc1918 AND id.resp_h NOT IN cloud_allowlist\n\
      \  AND (id.resp_h IN c2_feed.ip OR resolved_fqdn IN c2_feed.fqdn)\n  AND id.resp_h NOT IN partner_ftp_allowlist\n\
      EMIT high_priority(uid, orig_h, ioc_source, ioc_confidence, duration, orig_bytes, resp_bytes)"
- question: 'Using deterministic rule logic, can you confirm whether the pattern described as ''External
    SMB connection blocking-rule violation'' is present and indicates File Transfer Protocol-based C2?
    Specifically: Alert on any successful TCP/445 or TCP/139 connection in Zeek conn.log where id.orig_h
    is internal and id.resp_h is external. Such connections should be blocked at the perimeter per CIS
    Benchmarks and CISA guidance; their occurrence indicates either a misconfigured firewall or a tunnel
    being abused for SMB-based C2 / exfiltration. Cross-reference with Zeek smb.log for SMB dialect/version
    negotiation evidence and with Zeek notice.log for any SMB::Notice events. Per [CISA Advisory AA20-258A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-258a)
    and [CISA Alert TA18-074A](https://us-cert.cisa.gov/ncas/alerts/TA18-074A), external SMB egress is
    documented adversary tradecraft (Russian and Chinese state-sponsored campaigns) and should be treated
    as high severity by default.'
