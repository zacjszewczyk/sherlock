- question: 'Using deterministic rule logic, can you confirm whether the pattern described as ''SMB write-then-execute
    operational chain'' is present and indicates File Transfer Protocol-based C2? Specifically: From Zeek
    smb_files.log/smb_mapping.log, detect SMB writes (action=SMB::FILE_WRITE) to ADMIN$, IPC$, or C$ shares
    with executable filename extensions (.exe, .dll, .bat, .ps1, .vbs, .scr) followed within 5 minutes
    by Windows Event ID 7045 (service install) on the destination host or Windows Event ID 4624 logon
    type 3 with WinRM/PsExec logon process. Alert on the chain. This catches PsExec/Impacket-style C2
    deployment patterns documented by [MITRE ATT&CK Impacket entry (S0357)](https://attack.mitre.org/software/S0357/)
    and validated by [The DFIR Report''s Qbot+Zerologon analysis](https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/).
    Use [SigmaHQ Zeek atsvc rule](https://github.com/SigmaHQ/sigma/blob/master/rules/network/zeek/zeek_smb_converted_win_atsvc_task.yml)
    as a baseline for atexec-style remote scheduled tasks; extend to \PIPE\svcctl, \PIPE\winreg, \PIPE\samr
    for service install, remote registry, and SAMR enumeration coverage.'
