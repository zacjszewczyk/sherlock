  range: Last 30 days (rolling baseline); evaluate the current day against the baseline window
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Correlate fresh/rare domains with file-transfer flows

      JOIN dns.log -> conn.log WHERE conn.ts - dns.ts <= 60s AND resp_p IN [21,445,139,69,2049]

      COMPUTE prevalence[domain] = distinct_count(internal_host) over 30d

      COMPUTE reg_age[domain] via passive_dns/RDAP; entropy[domain]; levenshtein_to_known

      ALERT WHERE prevalence <= p1 AND reg_age <= 30d AND enterprise_queries[domain] >= 10'
- question: 'Using statistical baselining, does ''Per-host external file-transfer baseline'' deviate from
    the established normal and suggest File Transfer Protocol-based C2 or exfiltration? Specifically:
    For each internal host, baseline daily count of external connections on ports 21/445/139/69/2049 over
    30 days. Alert on counts exceeding 3 sigma above the host''s mean OR new external destinations on
    these ports not in the host''s 90-day baseline. Track also failed-connection ratio (Zeek conn_state
    REJ, S0); a high failure rate signals probing of dead C2 infrastructure and is a distinct high-priority
    signal per the Failure Mode Awareness principle [RITA (Active Countermeasures)](https://github.com/activecm/rita).'
