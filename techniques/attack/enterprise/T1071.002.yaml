- question: 'Using a machine-learning model, does ''Connection risk gradient-boosted classifier'' score
    this file-transfer activity as likely malicious C2? Specifically: Train an XGBoost classifier on labeled
    benign vs. malicious file-transfer flows using features: destination IP geolocation, destination ASN
    reputation, FQDN registration age, FQDN entropy, TLD risk weight, query type from Zeek dns.log, connection
    duration, bytes_orig, bytes_resp, conn_state, time-of-day, originating-host role. Score new file-transfer
    sessions; alert on probability > 0.90 with SHAP top-3 features in alert per [Idrissi et al. (Frontiers
    in AI, 2025)](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)
    so analysts see the specific features (e.g., ''destination ASN bulletproof, FQDN age <7 days, conn_state
    S0'') instead of a raw score. Retrain monthly. Retain the deterministic IOC and external-SMB rules
    above as the detection floor.'
