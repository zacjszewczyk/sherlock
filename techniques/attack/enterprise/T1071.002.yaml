- question: 'Using a machine-learning model, does ''Graph-based novel egress destination detection'' score
    this file-transfer activity as likely malicious C2? Specifically: Build a daily bipartite graph of
    (internal_host) <-> (external_destination) for file-transfer ports from Zeek conn.log. Compute node2vec
    embeddings on 30-day rolling history. Alert on new edges whose embedding distance from the host''s
    typical neighborhood exceeds the 99th percentile, especially when the destination has very low organizational
    reputation (rarely contacted by other hosts) and bytes_out > 1MB. Per [Bowman et al. (USENIX RAID
    2020)](https://www.usenix.org/conference/raid2020/presentation/bowman), node2vec embeddings of authentication
    graphs with logistic regression link prediction achieved >85% TPR at 0.0004% FPR on the LANL dataset
    for novel-edge lateral-movement detection; the same approach generalizes to novel internal-to-external
    SMB/FTP edges. Pair with [GNN-MTC (Tambewagh, Journal of Forensic Sciences, 2026)](https://onlinelibrary.wiley.com/doi/10.1111/1556-4029.70189)
    graph-based classification (98% accuracy) where labels are available.'
