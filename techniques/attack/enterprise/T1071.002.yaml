- question: 'Using deterministic rule logic, can you confirm whether the pattern described as ''TFTP usage
    detection (uncommon protocol baseline)'' is present and indicates File Transfer Protocol-based C2?
    Specifically: TFTP (UDP/69) is rarely used in modern enterprise networks. Alert on any TFTP traffic
    in Zeek conn.log where the destination is external or where the source is not in an allowlist of network-engineering
    segments. TFTP is favored by network device implants and IoT botnets; any external usage should be
    treated as high severity. Output the source/destination, byte counts, and the originating process
    correlated via Sysmon Event ID 3 [SigmaHQ Detection Rules](https://github.com/SigmaHQ/sigma).'
