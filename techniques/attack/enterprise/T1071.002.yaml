- question: 'Using statistical baselining, does ''Low-prevalence FQDN with file-transfer port baseline''
    deviate from the established normal and suggest File Transfer Protocol-based C2 or exfiltration? Specifically:
    Correlate Zeek dns.log lookups with subsequent FTP/SMB/TFTP flows (within 60 seconds). Compute per-domain
    enterprise prevalence (count of distinct internal hosts) and registration age (via passive DNS / RDAP)
    over 30 days. Flag domains with prevalence in bottom 1st percentile, registered in last 30 days, AND
    contacted via file-transfer ports. Apply minimum-volume guardrail (>=10 enterprise queries) before
    alerting to suppress single-host noise. Domain entropy and Levenshtein-distance features should be
    computed in parallel to FQDN prevalence per [NIOM-DGA (Computers & Security, 2025)](https://www.sciencedirect.com/science/article/pii/S0167404825002500),
    which validated 78 domain features at 98.3% accuracy across 16M+ domains.'
