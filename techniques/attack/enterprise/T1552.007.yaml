- question: '[Credential Access] Alert on discovery followed by sensitive calls: Can you determine whether
    a single source IP address or user account performs broad API discovery actions (e.g., accessing `/api`,
    `/apis`, `/version`) followed by targeted access to sensitive resources like secrets or container
    logs within a 15-minute window. -- specifically, using the ''Alert on discovery followed by sensitive
    calls'' (Symbolic Logic) approach?'
