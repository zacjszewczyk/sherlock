name: 'T1552.007: Container API'
id: 761a1e0e-492d-4be9-8073-ef643e945bd4
description: 'This playbook helps an analyst investigate whether an adversary has gathered credentials
  by abusing container-environment APIs -- principally the Docker API and the Kubernetes API server --
  as part of the Credential Access tactic. In these environments an attacker who can reach an exposed
  or weakly authenticated control plane can pull credentials directly: reading container/orchestrator
  logs that frequently embed cloud, registry, and database secrets; calling the Kubernetes secrets API
  (/api/v1/secrets) or service-account/token endpoints; or exec-ing into pods to read mounted service-account
  tokens and environment secrets. The hunt spans network telemetry (Zeek conn.log and http.log capturing
  traffic to container API ports such as Docker 2375/2376, the Kubernetes API server on 6443, and the
  kubelet on 10250) and control-plane telemetry (Kubernetes audit logs and Docker daemon logs). It guides
  the analyst across several behavioral angles: connections to container API ports from threat-intelligence-listed
  sources or insecure plaintext Docker sockets; failed/refused and 401/403 bursts indicating scanning
  and unauthorized probing; rare or scanner-like User-Agents; requests to credential-bearing watchlist
  endpoints (secrets, service accounts, exec, logs); successful kubectl exec into pods; discovery-then-sensitive-access
  correlation chains; volumetric anomalies in request count or bytes downloaded from log/export endpoints;
  broad log harvesting across many containers; and reuse of Kubernetes service-account tokens from IP
  addresses outside the cluster CIDR. Detection methods combine symbolic-logic rules, statistical baselining
  (first-seen modeling, percentile/standard-deviation thresholds, change-point and entropy analysis),
  and machine-learning models (classifiers, LSTM/autoencoder sequence models, DBSCAN/peer-group clustering,
  time-series forecasting) applied to Zeek logs, Kubernetes audit logs, and Docker daemon logs, so the
  analyst can corroborate suspected container-API credential theft against source reputation, identity
  behavior, endpoint sensitivity, and downstream secret access.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
