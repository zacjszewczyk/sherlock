    identity or service account, the targeted API endpoint or container, the cluster namespace, and any
    subsequent secret reads, exec sessions, or token reuse. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or in-cluster-pivoting activity.'
