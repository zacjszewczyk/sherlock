    query: 'baseline[user,src] = set of unique API paths over 30d (first-seen)

      FOR each new session: dist = jaccard_distance(session_paths, baseline)

      ALERT WHEN dist high, ESPECIALLY if session touches sensitive paths NOT IN baseline'
