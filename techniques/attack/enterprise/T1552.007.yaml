questions:
- question: '[Credential Access] Match TI IPs to container API traffic: Can you determine whether an HTTP
    request to a container API (e.g., Docker, Kubernetes) on ports 2375, 2376, 6443, or 10250 originates
    from a source IP address on a threat intelligence list or uses a User-Agent string associated with
    known malicious scanners. -- specifically, using the ''Match TI IPs to container API traffic'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary gathers credentials
    by abusing container APIs (the Docker API and Kubernetes API server), reading logs and secrets or
    exec-ing into pods to harvest cloud, registry, and service-account credentials. This evidence focuses
    on the condition that an HTTP request to a container API (e.g., Docker, Kubernetes) on ports 2375,
    2376, 6443, or 10250 originates from a source IP address on a threat intelligence list or uses a User-Agent
    string associated with known malicious scanners. This Symbolic Logic approach works as follows: Cross-reference
    the source IP (`id.orig_h`) in Zeek conn.log/http.log against a threat-intelligence feed for traffic
    to container API ports (Docker 2375/2376, Kubernetes API 6443, kubelet 10250). These ports should
    never be reachable by untrusted sources per [Kubernetes Hardening Guidance, NSA/CISA](https://www.cisa.gov/sites/default/files/2023-05/Kubernetes%20Hardening%20Guidance.pdf);
    generate a high-priority alert for any TI match and for ANY connection to insecure Docker socket port
    2375. A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    adversary access to container-API credential material; pivot to the source IP and its reputation/ASN,
    the authenticating identity or service account, the targeted API endpoint or container, the cluster
    namespace, and any subsequent secret reads, exec sessions, or token reuse. A negative result helps
    rule out this particular vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, low-and-slow, or in-cluster-pivoting activity.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Kubernetes Audit Logs
  - Docker daemon logs
  - 'NAI: Hosts running the Kubernetes API Server or Docker Daemon, network gateways and load balancers
    proxying traffic to the container orchestration plane, cloud network flow logs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM zeek.conn OR zeek.http\nWHERE id.resp_p IN (2375,2376,6443,10250)\n  AND (id.orig_h IN\
      \ threat_intel_feed OR id.resp_p == 2375)\nALERT severity=high WITH src=id.orig_h, dst=id.resp_h,\
      \ port=id.resp_p"
- question: '[Credential Access] Profile failed/refused connections to API ports: Can you determine whether
    an HTTP request to a container API (e.g., Docker, Kubernetes) on ports 2375, 2376, 6443, or 10250
    originates from a source IP address on a threat intelligence list or uses a User-Agent string associated
    with known malicious scanners. -- specifically, using the ''Profile failed/refused connections to
    API ports'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary gathers credentials
    by abusing container APIs (the Docker API and Kubernetes API server), reading logs and secrets or
    exec-ing into pods to harvest cloud, registry, and service-account credentials. This evidence focuses
    on the condition that an HTTP request to a container API (e.g., Docker, Kubernetes) on ports 2375,
    2376, 6443, or 10250 originates from a source IP address on a threat intelligence list or uses a User-Agent
    string associated with known malicious scanners. This Symbolic Logic approach works as follows: Treat
    connection failures as a distinct signal. From Zeek conn.log, count `conn_state` REJ/S0/RSTOS0 connections
    per source IP to ports 2375/2376/6443/10250 over 10-minute windows; alert when a single source generates
    > 20 failed/refused attempts (scanning) or when failures precede a successful (SF) connection. Correlate
    with bursts of HTTP 401/403 to the API server, a documented unauthorized-access signal ([Splunk Kubernetes
    Unauthorized Access](https://research.splunk.com/cloud/9b5f1832-e8b9-453f-93df-07a3d6a72a45/)). A
    positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    access to container-API credential material; pivot to the source IP and its reputation/ASN, the authenticating
    identity or service account, the targeted API endpoint or container, the cluster namespace, and any
    subsequent secret reads, exec sessions, or token reuse. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or in-cluster-pivoting activity.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Kubernetes Audit Logs
  - Docker daemon logs
  - 'NAI: Hosts running the Kubernetes API Server or Docker Daemon, network gateways and load balancers
    proxying traffic to the container orchestration plane, cloud network flow logs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM zeek.conn

      WHERE id.resp_p IN (2375,2376,6443,10250) AND conn_state IN (''REJ'',''S0'',''RSTOS0'')

      BIN time INTO 10m WINDOWS, GROUP BY id.orig_h

      ALERT WHEN count(failed) > 20 OR (failed THEN conn_state==''SF'')

      CORRELATE WITH http status IN (401,403) to API server'
