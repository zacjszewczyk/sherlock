      ALERT WHEN score > threshold

      EXPLAIN top3 = SHAP(features)  # surface in alert text'
- question: '[Credential Access] Alert on watchlist-sensitive endpoints: Can you determine whether an
    HTTP request is made to a sensitive container API endpoint known to expose credentials, secrets, or
    provide container execution capabilities, such as the Kubernetes secrets API (`/api/v1/secrets`) or
    the Docker exec endpoint (`/containers/{id}/exec`). -- specifically, using the ''Alert on watchlist-sensitive
    endpoints'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary gathers credentials
    by abusing container APIs (the Docker API and Kubernetes API server), reading logs and secrets or
    exec-ing into pods to harvest cloud, registry, and service-account credentials. This evidence focuses
    on the condition that an HTTP request is made to a sensitive container API endpoint known to expose
    credentials, secrets, or provide container execution capabilities, such as the Kubernetes secrets
    API (`/api/v1/secrets`) or the Docker exec endpoint (`/containers/{id}/exec`). This Symbolic Logic
    approach works as follows: High-severity alert for any request (Zeek http.log or Kubernetes audit
    log) to a watchlist of credential-bearing paths — `/api/v1/secrets`, `/api/v1/namespaces/.*/secrets`,
    `serviceaccounts`/token endpoints, `/api/v1/namespaces/.*/pods/.*/exec`, `/containers/.*/exec`, `/containers/.*/logs`
    — by any identity not on an allowlist. Audit-log field mappings (verb get/list/create, objectRef.resource)
    follow [Datadog key Kubernetes audit logs](https://www.datadoghq.com/blog/key-kubernetes-audit-logs-for-monitoring-cluster-security/)
    and [Elastic Kubernetes detection rules](https://github.com/elastic/detection-rules/tree/main/rules/integrations/kubernetes);
    combine with the in-pod service-account token-file read rule from [Falco default rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    access to container-API credential material; pivot to the source IP and its reputation/ASN, the authenticating
    identity or service account, the targeted API endpoint or container, the cluster namespace, and any
    subsequent secret reads, exec sessions, or token reuse. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or in-cluster-pivoting activity.'
  answer_sources:
  - Zeek http.log
  - Kubernetes Audit Logs
  - Docker daemon logs
  - 'NAI: Kubernetes API Server, Docker Daemon hosts, container runtime environment, cloud provider''s
    managed Kubernetes service (e.g., GKE, EKS, AKS) control plane.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "watchlist = ['/api/v1/secrets','/api/v1/namespaces/.*/secrets','serviceaccounts',\n      \
      \       '/api/v1/namespaces/.*/pods/.*/exec','/containers/.*/exec','/containers/.*/logs']\nFROM\
      \ zeek.http OR k8s.audit\nWHERE uri MATCHES watchlist AND identity NOT IN allowlist\nALERT severity=high\
      \ WITH verb, objectRef.resource, identity, src"
