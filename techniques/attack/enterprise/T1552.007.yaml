    and then, within 10 minutes, requests a watchlist sensitive path (`/secrets`,`/serviceaccounts`,`/exec`,`/logs`).
    This scan-then-exploit pattern over audit logs follows [Datadog key Kubernetes audit logs](https://www.datadoghq.com/blog/key-kubernetes-audit-logs-for-monitoring-cluster-security/)
    and [Elastic Kubernetes detection rules](https://github.com/elastic/detection-rules/tree/main/rules/integrations/kubernetes).
