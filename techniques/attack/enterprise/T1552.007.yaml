    train/validate against labeled cluster telemetry such as the [Kubernetes misuse dataset](https://www.itu.int/dms_pub/itu-s/opb/jnl/S-JNL-VOL4.ISSUE2-2023-A26-PDF-E.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
