  - Zeek http.log
  - Kubernetes Audit Logs
  - 'NAI: Kubernetes API Server, container orchestration plane, API gateway logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'discovery = uri IN (''/api'',''/apis'',''/version'',''/openapi'')

      sensitive = uri MATCHES (''/secrets'',''/serviceaccounts'',''/exec'',''/logs'')

      FROM k8s.audit OR zeek.http GROUP BY src_ip/identity

      ALERT WHEN discovery THEN sensitive WITHIN 10m'
- question: '[Credential Access] Detect change-points in request/error rate: Can you determine whether
