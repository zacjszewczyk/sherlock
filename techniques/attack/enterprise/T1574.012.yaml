name: 'T1574.012: Hijack Execution Flow: COR_PROFILER'
id: 6cea14a9-4ba0-4692-b2e4-2747dbacf4a2
description: 'This playbook helps an analyst investigate whether an adversary is abusing the .NET COR_PROFILER
  environment variable (and related CORECLR_/COR_ENABLE_PROFILING/COR_PROFILER_PATH settings) to hijack
  the execution flow of programs that load the .NET Common Language Runtime. By registering a malicious
  unmanaged profiling DLL -- via the system/user registry (HKLM or HKCU Environment keys, or an HKCR CLSID
  InprocServer32 COM registration) or registry-free in a process-scope environment block -- an adversary
  can run code inside every .NET process, establishing persistence, bypassing UAC to elevate privileges
  when a profiled .NET process auto-elevates, and hooking or impairing .NET-based security tooling. The
  hunt spans Windows endpoint telemetry (Security Event IDs 4657/4688/4689/4720/4732/4704/7034 and Sysmon
  Event IDs 1/3/5/7/10/13, plus PowerShell script-block logging) and network telemetry (Zeek conn/dns/ssl
  logs) to cover the registry, process-creation, module-load, privilege-action, C2-beacon, and defense-impairment
  facets of the technique. It guides the analyst across several behavioral angles: malicious COR_PROFILER
  registry/CLSID modifications matched by DLL hash; profiled .NET process launches whose profiler DLL
  is not on a legitimate-APM/debugger allowlist; profiled processes beaconing to low-reputation or known-C2
  infrastructure; user-writable profiler paths followed by high-integrity .NET launches (UAC bypass);
  medium-integrity HKCU modifications immediately preceding auto-elevating .NET launches; profiled processes
  spawning shells or performing privileged actions; security tools loading unsigned profiler DLLs; drops
  in security telemetry or failed synthetic tests after a profiler change; and unexpected termination
  of profiled security processes. Detection methods combine symbolic-logic rules, statistical baselining/frequency
  analysis, and machine-learning models so the analyst can corroborate suspected COR_PROFILER abuse across
  registry, process lineage, module loads, network behavior, and defensive-telemetry health.'
