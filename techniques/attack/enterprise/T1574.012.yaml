questions:
- question: '[Stealth] Alert on COR_PROFILER registry changes with malicious hashes: Can you determine
    whether a COR_PROFILER registry key (HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment\COR_PROFILER
    or HKCU\Environment\COR_PROFILER) is modified to point to a DLL, or a COM object is registered as
    a profiler DLL (HKCR\CLSID\{GUID}\InprocServer32), and the associated DLL''s file hash matches a known
    malicious signature or the CLSID is linked to known malware used to load into .NET processes. -- specifically,
    using the ''Alert on COR_PROFILER registry changes with malicious hashes'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses the COR_PROFILER
    environment variable and related .NET CLR profiling settings to hijack the execution flow of every
    .NET process that loads the Common Language Runtime -- establishing persistence, escalating privileges
    via UAC bypass, and impairing or unhooking .NET-based security defenses. This evidence focuses on
    the condition that a COR_PROFILER registry key (HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment\COR_PROFILER
    or HKCU\Environment\COR_PROFILER) is modified to point to a DLL, or a COM object is registered as
    a profiler DLL (HKCR\CLSID\{GUID}\InprocServer32), and the associated DLL''s file hash matches a known
    malicious signature or the CLSID is linked to known malware used to load into .NET processes. This
    Symbolic Logic approach works as follows: Trigger on registry-set events (Sysmon EID 13, EventID 4657)
    where TargetObject ends with ''\COR_ENABLE_PROFILING'', ''\COR_PROFILER'', ''\CORECLR_ENABLE_PROFILING''
    or contains ''COR_PROFILER_PATH''/''CORECLR_PROFILER_PATH'', or where a CLSID is written under HKCR\CLSID\{GUID}\InprocServer32,
    per [Enabling COR Profiler Environment Variables, Sigma](https://detection.fyi/sigmahq/sigma/windows/registry/registry_set/registry_set_enabling_cor_profiler_env_variables/)
    and [MITRE T1574.012](https://attack.mitre.org/techniques/T1574/012/). Extract the DLL path/CLSID,
    hash the DLL, and match against CTI and a known-bad CLSID list ([Red Canary](https://redcanary.com/blog/threat-intelligence/cor_profiler-for-persistence/)).
    State signal: emit high severity on any hash/CLSID match; medium when the write succeeds but signer
    is absent/invalid. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable COR_PROFILER abuse: pivot to the responsible process and its parent lineage, the user and
    integrity context, the registry key or environment block that set the profiler, the profiler DLL/CLSID
    on disk (path, signer, hash), any subsequently spawned children or privileged actions, downstream
    C2 connections, and any drop in security telemetry. A negative result helps rule out this particular
    COR_PROFILER vector but should be corroborated with the other questions in this playbook, since a
    single method can miss stealthy, registry-free, or living-off-the-land profiler abuse.'
