    a rule match, statistical outlier, or model alert -- indicates probable COR_PROFILER abuse: pivot
    to the responsible process and its parent lineage, the user and integrity context, the registry key
    or environment block that set the profiler, the profiler DLL/CLSID on disk (path, signer, hash), any
    subsequently spawned children or privileged actions, downstream C2 connections, and any drop in security
    telemetry. A negative result helps rule out this particular COR_PROFILER vector but should be corroborated
