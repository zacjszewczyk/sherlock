- question: When browser-originated network flows are clustered, which small, dense clusters deviate from
    normal browser behavior, and how do clicked URLs in them score against URL models?
  context: 'Unsupervised clustering surfaces anomalous browser egress that no rule anticipates. Cluster
    browser-originated Zeek conn.log flows (dest IP/port/protocol/bytes) with K-Means/DBSCAN and surface
    small, dense clusters that deviate from normal browsing; score the clicked URLs with URLNet/Sahoo
    features and surface the top-3 features (Frontiers IDS XAI review). This supports Execution-tactic
    detection by isolating the handful of flows tied to a malicious page among bulk normal browsing; investigate
    outlier clusters for the destination, the user, and any download/interpreter activity that followed.
    Source references: [URLNet](https://arxiv.org/abs/1802.03162), [Sahoo et al.](https://arxiv.org/abs/1701.07179),
    [Frontiers IDS XAI review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
