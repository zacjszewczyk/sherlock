- question: Does the pasted command line spawned via the Run dialog/terminal show abnormally high Shannon
    entropy or character-frequency deviation, and are there follow-on NXDOMAIN/blocked-connection failures?
  context: 'ClickFix payloads are usually encoded or obfuscated to hide their intent from the victim and
    from rules. Apply Shannon-entropy/character-frequency baselining to the pasted command line and flag
    values beyond the host''s 99th percentile or deviating from a normal-script corpus (Revoke-Obfuscation),
    and profile follow-on NXDOMAIN/blocked-connection failure rates (Nadler et al.). This adds a statistical
    safety net to the paste-and-run rule for the Execution tactic, catching obfuscated commands that dodge
    regex. Derive cutoffs from local history; corroborate flagged commands with the explorer/console parent
    lineage and any resulting download or egress. Source references: [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf),
    [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
