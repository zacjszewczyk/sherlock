- question: When the spawned command line is scored by a LOLBin/command intent classifier, is the pasted
    command predicted malicious, and which features drove the score?
  context: 'Because ClickFix lures rotate their wording and encoding, a learned classifier generalizes
    better than fixed patterns. Score the spawned command line with an active-learning LOLBin/command
    classifier (Boros et al.) or, where AMSI is available, post-deobfuscation contextual embeddings (Hendler
    et al.), and surface the top-3 contributing features in the alert (Frontiers IDS XAI review). This
    completes the paste-and-run Execution-tactic coverage by catching novel obfuscated commands the rule
    and entropy methods may miss; route uncertain, high-impact cases to analysts for labeling, and walk
    confirmed hits from the pasted command to the resulting payload and egress. Source references: [Boros
    et al.](https://arxiv.org/abs/2111.15039), [Hendler et al.](https://arxiv.org/abs/1905.09538), [Frontiers
    IDS XAI review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
