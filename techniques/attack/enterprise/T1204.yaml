name: 'T1204: User Execution'
id: 84bb2a0e-21c5-4c6c-a427-f52ea11da81f
description: 'This playbook helps an analyst investigate User Execution (T1204): cases where an adversary
  relies on a user taking a deliberate action - opening a malicious document or archive, clicking a link,
  manually copying and pasting a command into the Run dialog or terminal (the ClickFix / paste-and-run
  pattern), or otherwise running attacker-supplied code - to gain execution, typically as follow-on behavior
  from phishing. It guides the analyst through the full ''document/link -> helper/unpacker -> LOLBIN/child
  process -> network egress'' behavior chain across Windows, Linux, macOS, container, and cloud surfaces.
  Investigative threads include user-facing applications (Outlook, browsers, Office, PDF readers, archivers)
  spawning child processes that contact known-bad or anomalous destinations; command-line interpreters
  launched with obfuscated, encoded, execution-policy-bypassing, or remote-download arguments; anomalous
  parent-child process pairings; archive-unpack-and-run sequences; browsers spawning interpreters or contacting
  newly-registered, typosquatted, or Punycode domains; suspicious TLS fingerprints and C2 beaconing cadence;
  and socially-engineered manual paste-and-run lineages. Each question pairs symbolic, statistical, and
  machine-learning detection approaches so the analyst can confirm or refute user-driven execution and
  pivot to the responsible payload, parent application, and follow-on activity.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did a high-risk user-facing application (e.g., OUTLOOK.EXE, WINWORD.EXE, EXCEL.EXE, chrome.exe)
    spawn a child process that then made an outbound connection to an IP or domain matching a known-bad
    threat-intelligence indicator shortly after a download or link click?
  context: 'This is the core User Execution behavior chain for the Execution tactic: a user opens an attachment
    or clicks a link, the document/browser process drops or launches a child, and that child immediately
    reaches out to attacker infrastructure. Join Windows Event ID 4688 (or Sysmon EID 1) process-creation
    records to Zeek conn.log/dns.log on PID + host + a tight timestamp window, enrich the destination
    against threat-intel feeds, and alert when the lineage of a known user-facing parent contacts a flagged
    host. A positive match - recording the matched indicator, parent process, and child path - is high-confidence
    evidence of post-click execution and should trigger host isolation and payload retrieval; a negative
    result does not clear the host because TI feeds lag novel infrastructure, so pair this with the rarity/baselining
    methods. Source references: [Red Canary User Execution](https://redcanary.com/threat-detection-report/techniques/user-execution/),
    [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User workstations, Email gateways, Web proxies, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'proc=4688 OR sysmon=1 where parent IN (OUTLOOK.EXE,WINWORD.EXE,EXCEL.EXE,chrome.exe)

      | join (zeek conn,dns) on host,pid,time_window<=300s

      | lookup TI on dest_ip,dest_domain

      | where ti_match=true

      | table host,parent,child_path,dest,ti_indicator'
- question: For each high-risk parent application, which child-process-to-network destinations are statistically
    rare (below the 1st percentile of that parent's destination frequency over the last 30 days), or show
    abnormal bytes-out, connection rate, or connection state?
  context: 'Sophisticated actors often use infrastructure not yet in any TI feed, so rarity is a complementary
    signal to known-bad matching. Build a rolling 30-day frequency model of destination domains/IPs per
    high-risk parent and flag child connections in the bottom 1st percentile, scoring Volume (bytes-out
    versus the parent''s baseline), Frequency (connections/min), and State (established vs reset/blocked)
    and applying EXPOSURE-style prevalence/dynamism logic. Rare-destination egress from an Office or browser
    lineage right after a click is suspicious even with no TI hit. Derive the percentile cutoff from your
    own environment''s history to avoid over-/under-alerting; a flagged outlier warrants pulling the full
    process tree and destination reputation. Source references: [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User workstations, Email gateways, Web proxies, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = stats count by parent,dest over last 30d\n| pct = percentile_rank(dest_freq within\
      \ parent)\n| flag where pct < 1\n  OR bytes_out > baseline_mean(parent)+3*sd\n  OR conn_state IN\
      \ (RSTO,REJ,S0)\n| rank ascending by pct"
- question: Did a user-application lineage produce a burst of failed DNS resolutions (NXDOMAIN), HTTP
    4xx/5xx responses, or firewall-blocked egress that exceeds the host's normal baseline - a signature
    of C2/dead-drop resolution failures after execution?
  context: 'After a payload runs it frequently tries to resolve or reach C2 that is down, rotated, or
    blocked, producing characteristic failure bursts. Baseline per-host NXDOMAIN counts, 4xx/5xx HTTP
    responses, and blocked egress, then alert when a user-app lineage spikes above the host''s 99th percentile
    (e.g., >5 NXDOMAIN/min). This is a distinct dead-drop/C2 signal per Nadler et al. and is valuable
    because it catches malicious activity even when the destination never successfully connected. Investigate
    the originating process tree and the failed destinations, which often reveal the DGA or staged-down
    infrastructure. Source references: [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User workstations, Email gateways, Web proxies, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per host,lineage compute nxdomain_pm, http_4xx5xx_pm, fw_blocked_pm\n| baseline p99 per host\
      \ over 30d\n| alert where nxdomain_pm > max(5,p99)\n  OR http_err_pm > p99 OR fw_blocked_pm > p99\n\
      | table host,parent,child,failed_dests"
- question: When scored by a trained classifier on process and network features, which user-application
    process-to-network chains exceed the risk threshold (e.g., probability > 0.85), and what top features
    drove the score?
  context: 'Where rules and simple statistics miss multi-factor combinations, a supervised model (gradient-boosted
    trees / Random Forest) can fuse parent/child process names, child path, destination ASN/geo, port,
    TI match count, bytes-out, and domain age into a single risk probability per process-network chain.
    Alert above a tuned threshold and surface the top-3 SHAP features in the alert so the analyst can
    triage quickly and defensibly. This supports the Execution tactic by catching subtle post-click egress
    that no single indicator flags; treat high-probability hits as leads requiring corroboration from
    the symbolic/statistical methods, and feed confirmed cases back as labels. Source references: [Frontiers
    IDS XAI review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User workstations, Email gateways, Web proxies, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: ML/Pipeline pseudocode
    query: 'features = [parent,child,child_path,dest_asn,dest_geo,port,ti_hits,bytes_out,domain_age]

      model = GradientBoosting/RandomForest

      score = model.predict_proba(chain)

      alert where score > 0.85 with top3 = shap_values(chain)'
- question: Was a command-line interpreter (powershell.exe, cmd.exe, wscript.exe) executed with command-line
    arguments containing obfuscation, encoded commands, execution-policy bypasses, or remote download-and-execute
    patterns?
  context: 'Once a user triggers execution, the payload commonly launches an interpreter with telltale
    arguments. Scan Windows Event ID 4688/Sysmon EID 1 command lines for deterministic patterns: IEX /
    New-Object Net.WebClient, -enc / -EncodedCommand, -w hidden, -ExecutionPolicy Bypass, FromBase64String,
    certutil -urlcache/-decode, mshta http. Any match is a strong Execution-tactic indicator and maps
    directly to known SigmaHQ/Red Canary LOLBin rule sets. These are high-fidelity but evadable, so a
    clean result is not exoneration; combine with entropy baselining and the ML classifier to catch novel
    obfuscation. Source references: [SigmaHQ](https://github.com/SigmaHQ/sigma), [Red Canary LOLBins](https://redcanary.com/blog/blog/lolbins-abuse/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Domain Controllers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc=4688 OR sysmon=1 where image IN (powershell.exe,cmd.exe,wscript.exe,cscript.exe)\n| where\
      \ cmdline matches\n  /(IEX|New-Object\\s+Net\\.WebClient|-enc|-EncodedCommand|-w\\s+hidden|-ExecutionPolicy\\\
      s+Bypass|FromBase64String|certutil\\s+-(urlcache|decode)|mshta\\s+https?:)/i\n| table host,user,parent,cmdline"
- question: Does an interpreter command line show abnormally high Shannon entropy or character-frequency/token
    deviation versus the host's normal scripting baseline, indicating obfuscation that evades signature
    rules?
  context: 'Obfuscation inflates randomness, so entropy and character-frequency statistics catch encoded
    or mangled command lines that regex misses. Track Shannon entropy and token-distribution per interpreter
    and alert when a command line exceeds the host''s 99th percentile or deviates measurably from a normal-script
    corpus, the Revoke-Obfuscation approach. This supports Execution-tactic detection by flagging the
    obfuscated stagers that follow a user click. Derive cutoffs from local history; benign minifiers/installers
    can be noisy, so corroborate flagged lines with parent lineage and any download/egress. Source references:
    [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Domain Controllers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per host,interpreter compute shannon_entropy(cmdline), charfreq_kl(cmdline, corpus)

      | baseline p99 entropy per host over 30d

      | alert where entropy > p99 OR charfreq_kl > corpus_threshold

      | table host,interpreter,cmdline,entropy'
- question: When a command-line intent classifier scores 4688/AMSI command lines, which interpreter invocations
    are predicted malicious, and which tokens/features drove the prediction?
  context: 'Obfuscation mutates over time, so a learned classifier (TF-IDF + gradient boosting or a transformer)
    refreshed with active learning keeps pace with new syntax better than static rules. Train on benign
    vs malicious 4688/AMSI command lines; where AMSI is available use the post-deobfuscation content with
    contextual embeddings (Hendler et al.). List the top-3 contributing tokens/features in each alert
    for triage. This catches the Execution-tactic stagers that follow user interaction even when they
    are freshly obfuscated; route high-scoring, low-confidence cases to analysts for labeling to continuously
    improve the model. Source references: [Boros et al.](https://arxiv.org/abs/2111.15039), [Hendler et
    al.](https://arxiv.org/abs/1905.09538).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Domain Controllers, Application Servers'
  range: Last 90 days
  queries:
  - technology: ML/Pipeline pseudocode
    query: 'x = tfidf(cmdline) or amsi_deobfuscated_embedding(cmdline)

      model = GradientBoosting/Transformer (active-learning refresh)

      pred = model.predict_proba(x)

      alert where pred > threshold with top3 tokens; queue uncertain for labeling'
- question: Did a user-facing application (WINWORD.EXE, EXCEL.EXE, AcroRd32.exe, etc.) spawn a suspicious
    child such as a command interpreter, scripting engine, or LOLBIN (powershell.exe, wscript.exe, cscript.exe,
    mshta.exe, certutil.exe) that is not on the approved parent-child allowlist?
  context: 'The single highest-value T1204 follow-on signal is a productivity application spawning an
    interpreter or LOLBIN - behavior that almost never happens in legitimate use. Use Windows Event ID
    4688/Sysmon EID 1 to compare observed parent-child pairs against an allowlist for high-risk parents
    and alert on anomalous pairings. A positive hit (e.g., WINWORD.EXE -> powershell.exe) strongly indicates
    a malicious macro or exploit executing after a user opened the document; pull the document, the child
    command line, and any resulting network/file activity. Maintaining an accurate allowlist of legitimate
    child processes per application keeps false positives low. Source references: [Red Canary User Execution](https://redcanary.com/threat-detection-report/techniques/user-execution/),
    [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User workstations, Terminal servers, Virtual Desktop Infrastructure (VDI)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'proc=4688 OR sysmon=1 where parent IN (WINWORD.EXE,EXCEL.EXE,POWERPNT.EXE,AcroRd32.exe,OUTLOOK.EXE)

      | where child IN (powershell.exe,cmd.exe,wscript.exe,cscript.exe,mshta.exe,certutil.exe,rundll32.exe,regsvr32.exe)

      | where (parent,child) NOT IN allowlist

      | table host,user,parent,child,cmdline'
- question: Which (parent, child) process pairs are statistically rare across the enterprise (below the
    1st percentile of 30-day rolling frequency), indicating an unusual user-application execution chain?
  context: 'Allowlists require maintenance and miss novel pairs; frequency rarity finds anomalous lineages
    automatically. Compute 30-day rolling enterprise-wide frequencies for each (parent, child) pair and
    flag combinations below the 1st percentile, applying EXPOSURE prevalence logic. A rare pairing originating
    from a user-facing parent is a strong Execution-tactic lead even if it is not on any blocklist. Derive
    the percentile from the whole fleet rather than one host to avoid over-fitting; investigate flagged
    pairs by reviewing the command line, user, and downstream activity. Source references: [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User workstations, Terminal servers, Virtual Desktop Infrastructure (VDI)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'freq = stats count by parent,child over last 30d (fleet-wide)

      | pct = percentile_rank(freq)

      | flag where pct < 1

      | rank ascending; enrich with host,user,cmdline'
- question: When process-provenance graphs are built and scored, which causal paths (user-app -> interpreter
    -> network/file) are the rarest and most anomalous, and what nodes contributed to the score?
  context: 'ProvDetector-style provenance analysis ranks the rarest causal paths using IDF path weighting
    + doc2vec embeddings scored by Local Outlier Factor (reported 95.4% TPR / 2.0% FPR), surfacing the
    unusual user-app->interpreter->network/file edge that simpler counts miss. This deepens Execution-tactic
    detection by modeling the whole lineage rather than single pairs, catching multi-hop chains and living-off-the-land
    sequences. Report the contributing path nodes in the alert so the analyst can walk the chain from
    the originating document to the final egress, and corroborate with TI and command-line analysis. Source
    references: [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User workstations, Terminal servers, Virtual Desktop Infrastructure (VDI)'
  range: Last 90 days
  queries:
  - technology: ML/Pipeline pseudocode
    query: 'graph = build_provenance(proc_events)

      paths = enumerate_causal_paths(graph)

      score = LOF(doc2vec(path), idf_weight(path))

      rank top-K rarest paths; emit contributing nodes'
- question: Did a user endpoint connect to a newly-registered domain (registered in the last 30 days),
    a typosquatted domain within edit-distance 2 of a protected brand, or a homoglyph/Punycode lookalike?
  context: 'Phishing-driven User Execution frequently directs victims to freshly-registered or lookalike
    domains. Correlate Zeek dns.log with newly-registered-domain feeds and alert when endpoints (Zeek
    conn.log) reach domains registered in the last 30 days; additionally flag domains within Levenshtein/Damerau
    distance <=2 of protected brands or using homoglyph/Punycode encoding. Prioritize hits tied to user-execution
    lineage (a connection right after a browser/Office child spawn). NRD and typosquat hits are strong
    leads for credential-theft or payload-delivery sites; validate registration date and brand similarity,
    then check what the user did on the page. Source references: [typosquatting taxonomy](https://arxiv.org/abs/1603.02767).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Network egress points, Web proxies, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'zeek dns | lookup NRD_feed on domain (registered_within 30d)

      | OR where damerau_levenshtein(domain, brand_list) <= 2

      | OR where domain contains xn-- (punycode) OR homoglyph_match(domain)

      | join conn on host | table host,domain,first_seen,reg_date'
- question: Do an endpoint's destination countries, ASNs, JA3/JA4S TLS fingerprints, bytes transferred,
    or connection counts deviate sharply (>3 standard deviations, or below the 1st percentile) from that
    user's established baseline?
  context: 'User Execution to attacker infrastructure often shows up as a new destination country/ASN
    or an unfamiliar TLS client fingerprint. Build per-user baselines of destination countries, ASNs,
    and JA3/JA4S values plus Volume (bytes sent/received) and Frequency (connection counts); raise alerts
    on new connections exceeding 3 standard deviations or below the 1st percentile, incorporating domain
    age/TTL/answer features (EXPOSURE) and click-reputation distinct-visitor scoring (Ho et al.). A new
    ASN or rare JA3 from a user host right after a click is a strong post-execution egress lead; corroborate
    with the originating process and destination reputation. Source references: [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf),
    [Ho et al.](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Network egress points, Web proxies, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per user: set(country,asn,ja3,ja4s), mean/sd(bytes), mean(conn_cnt) over 30d\n| zeek\
      \ ssl,conn current\n| alert where ja3 NOT IN baseline OR asn NEW\n  OR bytes > mean+3sd OR conn_freq_pct\
      \ < 1\n| table user,host,dest,asn,ja3"
- question: Do flows from a user-application lineage to a destination show regular, jitter-robust periodicity
    (beaconing) in their timing, size, or inter-arrival regularity, indicating C2 callbacks after execution?
  context: 'A successful User Execution often installs an implant that beacons on a cadence. Score per-(host,destination)
    flow time series for jitter-robust periodicity via FFT (BAYWATCH) and for inter-arrival/size regularity
    using coefficient of variation, Bowley skewness, and MAD (RITA), flagging regular callbacks from user-app
    lineage. This catches low-and-slow C2 that volume thresholds miss. Suppress known-good periodic destinations
    (updates, telemetry) via whitelist to control false positives; a confirmed beacon from a host that
    recently ran a user-delivered payload is high-confidence compromise. Source references: [BAYWATCH](https://dsail.kaist.ac.kr/files/WWW17.pdf),
    [RITA](https://github.com/activecm/rita).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Network egress points, Web proxies, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = flows by host,dest over time

      | fft_periodicity(intervals)  # BAYWATCH jitter-robust

      | cv,bowley_skew,mad(intervals,sizes)  # RITA

      | flag where periodic_score high AND dest NOT IN whitelist

      | table host,dest,period,score'
- question: When clicked or typed URLs are scored by a URL classifier, which destinations are predicted
    malicious, and which lexical/host features (URL entropy, domain age, token ratios) drove the score?
  context: 'Because User Execution often begins with a click, scoring the URL itself catches malicious
    destinations before or as the user reaches them. Score clicked/typed URLs with a character/word CNN
    (URLNet) and the lexical/host feature families from the Sahoo et al. survey, alert above a tuned probability,
    and surface the top-3 contributing features. This supports the Execution tactic by flagging phishing/payload
    URLs even when the domain is unknown to TI; high-scoring URLs warrant checking what the user downloaded
    or entered, and confirmed-malicious URLs feed blocklists and model labels. Source references: [URLNet](https://arxiv.org/abs/1802.03162),
    [Sahoo et al. survey](https://arxiv.org/abs/1701.07179), [Frontiers IDS XAI review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Network egress points, Web proxies, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: ML/Pipeline pseudocode
    query: 'x = urlnet_charword_embedding(url) + lexical_host_features(url)

      model = URL classifier

      pred = model.predict_proba(url)

      alert where pred > threshold with top3 = [url_entropy,domain_age,token_ratio]'
- question: Was an archive utility (7z.exe, winrar.exe, tar.exe) executed and then followed within 60
    seconds by a child process launched from %APPDATA%, %TEMP%, or a Downloads directory - the unpack-and-run
    pattern?
  context: 'Adversaries package payloads in archives so users extract and run them, evading some content
    inspection. Alert when Windows Event ID 4688/Sysmon EID 1 shows an archive utility created followed
    within 60 seconds by a child process launched from a user-writable temp/download path. This is a catalogued
    T1204 unpack-and-run sequence (Red Canary/SigmaHQ) and supports the Execution tactic by tying extraction
    to immediate execution. A positive hit should prompt retrieval of the archive and the executed file;
    legitimate software installs can resemble this, so review the file path, signature, and downstream
    network/process activity. Source references: [Red Canary User Execution](https://redcanary.com/threat-detection-report/techniques/user-execution/),
    [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User workstations, Download directories on shared servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'proc=4688 OR sysmon=1 where image IN (7z.exe,winrar.exe,winzip*.exe,tar.exe)

      | sequence within 60s -> child where child_path matches /(AppData|Temp|Downloads)/i

      | table host,user,archive_proc,child_path,delta_s'
- question: Are the time deltas between archive execution and a subsequent child launch abnormally short
    (below the 10th percentile, suggesting scripting), and do archive-extraction error/exit codes indicate
    failed or password-protected extracts used as lures?
  context: Scripted unpack-and-run chains execute the dropped file almost instantly, while password-protected
    or failed extracts are a hallmark of malspam lures that coach the user through a password. Compute
    time deltas between archive execution and subsequent child launches per host, flagging deltas below
    the 10th percentile as likely scripted (Frequency/State); also profile archive-extraction error/exit
    codes as a distinct lure signal. Derive the percentile from local data. This refines the Execution-tactic
    archive thread by separating automated drops and protected-archive lures from benign manual extraction;
    investigate flagged sequences for the source archive and delivery vector.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User workstations, Download directories on shared servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per host compute delta(archive_exec -> child_exec)

      | flag where delta_pct < 10

      | also profile archive exit_code IN (failed,password_protected)

      | table host,archive,child,delta_s,exit_code'
- question: When a sequence model scores live process chains, which sequences (e.g., outlook.exe -> 7z.exe
    -> powershell.exe) are predicted malicious despite timing variation, and what steps contributed?
  context: 'Fixed time windows miss chains that run slowly or with jitter; a sequence model generalizes
    over timing. Train an RNN/HMM on labeled process sequences and score live sequences, and rank rare
    causal unpack-and-run paths via provenance scoring (ProvDetector). Report the contributing sequence
    steps in the alert. This strengthens Execution-tactic detection by recognizing the full lure->unpack->execute->egress
    narrative even when individual steps look benign; high-scoring sequences should be walked end-to-end,
    and confirmed chains feed back as training labels. Source references: [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User workstations, Download directories on shared servers'
  range: Last 90 days
  queries:
  - technology: ML/Pipeline pseudocode
    query: 'seq = ordered_process_chain(host, session)

      model = RNN/HMM trained on labeled chains

      score = model.score(seq); also ProvDetector rare-path rank

      alert where score high; emit contributing steps'
- question: Did a browser process (chrome.exe, msedge.exe, firefox.exe) spawn a command interpreter or
    scripting engine (cmd.exe, powershell.exe, wscript.exe, mshta.exe)?
  context: 'Browsers should not launch interpreters; when they do it usually means a drive-by, malicious
    download, or HTML-application lure executed after the user interacted with a page. Alert when Windows
    Event ID 4688/Sysmon EID 1 shows a browser spawning an interpreter or script engine (SigmaHQ/Red Canary
    LOLBins). This is a high-fidelity Execution-tactic indicator of browser-delivered User Execution;
    on a hit, capture the child command line, the page/URL the user was on, and any resulting download
    or egress. False positives are rare, making this a strong primary detection. Source references: [SigmaHQ](https://github.com/SigmaHQ/sigma),
    [Red Canary LOLBins](https://redcanary.com/blog/blog/lolbins-abuse/).'
  answer_sources:
