- question: Did explorer.exe, a terminal, or a console host directly spawn mshta.exe/powershell.exe/cmd.exe/wscript.exe
    (or curl/wget piped to a shell) with download or encoded arguments - the ClickFix / paste-and-run
    pattern?
  context: 'In ClickFix/self-pwn attacks the user is socially engineered to paste a command into the Run
    dialog (Win+R), a terminal, or browser console, so the malicious lineage descends from explorer.exe
    or a console host rather than a document. Alert when explorer.exe (or a terminal/console host) directly
    spawns mshta.exe/powershell.exe/cmd.exe/wscript.exe with download or encoded arguments (http(s) URL,
    -enc, -w hidden, IEX, FromBase64String, curl|wget piped to sh) - the Proofpoint ClickFix indicators
    codified in SigmaHQ. This is a high-value Execution-tactic detection for a fast-growing delivery method;
    a hit warrants capturing the pasted command, the source instructions/page, and downstream egress,
    and checking auditd execve on Linux/macOS for the same pattern. Source references: [Proofpoint](https://www.proofpoint.com/us/blog/threat-insight/security-brief-clickfix-social-engineering-technique-floods-threat-landscape),
    [SigmaHQ](https://github.com/SigmaHQ/sigma).'
