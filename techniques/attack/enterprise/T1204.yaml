- question: Are browser-originated DNS requests going to domains in the bottom 5th percentile of TLD/domain
    popularity or with high lexical entropy/character-ratio anomalies, and are there accompanying NXDOMAIN
    bursts?
  context: 'Malicious browser-driven destinations frequently use rare TLDs or algorithmically-generated/lookalike
    names. Build enterprise-wide TLD and domain character-distribution profiles from Zeek dns.log and
    alert on browser-originated requests in the bottom 5th percentile of popularity or with high lexical
    entropy/character-ratio anomalies (Nadler et al.), and profile NXDOMAIN bursts as a distinct failure
    signal. This complements the browser->interpreter rule by catching User Execution that manifests purely
    as anomalous web/DNS activity; investigate flagged domains for registration, reputation, and the originating
    browser tab/process. Source references: [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
