questions:
- question: Did any process or driver execute whose file hash or signer certificate matches a known watchlist
    of code-signing-policy modification tools or vulnerable/malicious drivers (e.g., KDU, DSEFix, gdrv-loader,
    LOLDrivers)?
  context: 'This is the deterministic floor for detecting Defense Impairment via T1553.006. An adversary
    who wants to load unsigned kernel code frequently drops a purpose-built tool or a known-vulnerable
    signed driver. By querying process creation logs (Windows Event ID 4688, Sysmon Event ID 1) and driver/file
    logs (Sysmon Event ID 6/7045, Zeek files.log) for SHA256 hashes and Authenticode signer fields, and
    matching them against the LOLDrivers corpus, Microsoft''s vulnerable-driver blocklist, and hashes
    of known DSE/SIP modification tools, the analyst gets a high-confidence, low-false-positive signal.
    A match should generate a high-priority alert; this hard watchlist must be tuned (additively) rather
    than deleted as new drivers are published. A positive result strongly indicates an active attempt
    to subvert signature enforcement; a negative result does not clear the host because attackers can
    use novel/unlisted binaries. Sources: [LOLDrivers](https://www.loldrivers.io/) ([repo](https://github.com/magicsword-io/LOLDrivers));
    signed-driver abuse background per [ESET](https://www.welivesecurity.com/2022/01/11/signed-kernel-drivers-unguarded-gateway-windows-core/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek files.log
  - 'NAI: Developer Workstations, System Administrator Workstations, Critical Servers, Network Egress
    Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=endpoint (EventCode=4688 OR sourcetype=Sysmon EventID IN (1,6,7045))

      | eval h=lower(SHA256)

      | lookup loldrivers_blocklist hash AS h OUTPUT verdict

      | lookup signing_tool_hashes hash AS h OUTPUT tool_name

      | where isnotnull(verdict) OR isnotnull(tool_name)

      | eval alert="HIGH: known signing-policy/vulnerable-driver hash"

      | table _time host user Image SHA256 Signer verdict tool_name'
  - technology: Zeek/pseudocode
    query: 'files.log

      | where mime_type in ("application/x-dosexec","application/x-pe-app")

      | lookup sha256 in (loldrivers_hashes UNION signing_tool_hashes)

      | emit {ts, tx_hosts, rx_hosts, fuid, sha256, filename} as alert'
- question: Among all executing processes and drivers, which file hashes or signing certificates are exceptionally
    rare across the enterprise (single-host or bottom-percentile prevalence, newly first-seen) while performing
    code-signing-policy actions?
  context: 'Sophisticated actors bring novel or thinly distributed binaries and signed-but-rare drivers
    (a primary BYOVD signal) that will not appear on any static watchlist. For every process/driver, compute
    enterprise-wide prevalence of both the file hash and the signing certificate (host count and first-seen
    age). Drivers or binaries in the bottom 1st percentile of host prevalence, or seen on only a single
    host, are suspicious -- especially when they coincide with code-signing-policy changes. Derive the
    percentile cutoff from your own fleet distribution rather than a fixed magic number. Also track invalid/missing-signature
    load failures (Sysmon EID 6 Signed=''false'') as a distinct rate. A rare, never-before-seen signed
    driver that loads near a policy change is a strong lead; commonplace, widely deployed binaries can
    be deprioritized. Sources: never-before-seen signed drivers are a primary BYOVD signal per [Elastic](https://www.elastic.co/security-labs/stopping-vulnerable-driver-attacks)
    and prevalence-based provenance scoring per [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek files.log
  - 'NAI: Developer Workstations, System Administrator Workstations, Critical Servers, Network Egress
    Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint (EventCode=4688 OR EventID IN (1,6,7045))

      | stats dc(host) AS host_count min(_time) AS first_seen by SHA256 Signer

      | eventstats perc1(host_count) AS p1 count AS total

      | where host_count<=p1 OR host_count=1

      | eval age_days=round((now-first_seen)/86400,1)

      | where age_days<30

      | sort host_count'
- question: Does a supervised classifier flag any process or driver execution as high-confidence malicious
    based on lineage, path, command-line, entropy, signer rarity, and host prevalence, and what top features
    drove that decision?
  context: 'Watchlists and simple rarity miss adversaries who blend in. A supervised classifier (e.g.,
    XGBoost or Random Forest) trained on labeled executions using features such as parent-child lineage,
    file-path location, command-line structure, file/path entropy, signer rarity, and host prevalence
    can score new executions in real time and alert on high-confidence malicious classifications that
    are tied to system-configuration changes. To be actionable for SOC triage, each alert MUST list the
    top-3 contributing features (e.g., ''rare signer'', ''temp-path execution'', ''low host prevalence'')
    per explainable-ML practice. This complements deterministic and statistical methods by catching subtle
    combinations; a high-confidence hit near a signing-policy change warrants escalation, while the feature
    explanation lets the analyst quickly confirm or dismiss. Sources: explainable-anomaly practice per
    [Isolation Forest](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek files.log
  - 'NAI: Developer Workstations, System Administrator Workstations, Critical Servers, Network Egress
    Points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = extract(parent_child, file_path, cmdline_struct, path_entropy, signer_rarity, host_prevalence)\n\
      score, top_feats = classifier.predict_proba(features)\nif score >= 0.9 and near_config_change(event):\n\
      \ alert(host, image, score, top3=top_feats[:3])"
- question: Did any process execute with command-line arguments that explicitly modify code signing enforcement,
    such as 'bcdedit... testsigning/nointegritychecks' on Windows or 'csrutil disable' on macOS?
  context: 'These are the authoritative, documented commands for enabling test-signing / disabling integrity
    checks (Windows) and disabling System Integrity Protection (macOS). A SIEM rule using case-insensitive
    regular expressions over the command-line field of process creation logs (Windows Event ID 4688, Sysmon
    Event ID 1; macOS unified log / EID 1) -- e.g. /(?i)(bcdedit.*(testsigning|nointegritychecks)|csrutil\s+(disable|enable\s+--without))/
    -- will catch the enabling action directly. Any match should trigger, because legitimate use of these
    commands outside controlled dev/test change windows is rare and high-impact. This is the most direct
    evidence of an attempt to impair signature-enforcement defenses; correlate the user, host, and surrounding
    events to judge whether it was sanctioned. Sources: [Microsoft Test-Signing](https://learn.microsoft.com/en-us/windows-hardware/drivers/install/introduction-to-test-signing),
    [Apple SIP](https://support.apple.com/en-us/102149), and the [Sigma bcdedit boot-tamper rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_bcdedit_boot_conf_tamper.yml).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Developer Workstations, Endpoint fleet, macOS systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=endpoint (EventCode=4688 OR (sourcetype=Sysmon EventID=1) OR sourcetype=macos_unifiedlog)\n\
      | where match(lower(CommandLine), \"bcdedit.*(testsigning|nointegritychecks)\")\n OR match(lower(CommandLine),\
      \ \"csrutil\\s+(disable|enable\\s+--without)\")\n| eval alert=\"Signing-policy modification command\"\
      \n| table _time host user ParentImage Image CommandLine"
- question: Is the observed bcdedit/csrutil signing-policy command rare for this specific user and rare
    across the population (high rarity score or first-ever for the host/user)?
  context: 'Even authoritative commands can be legitimate in the hands of certain admins or developers.
    To separate sanctioned use from abuse, build a per-user and population historical profile of bcdedit.exe/csrutil
    command-line usage (frequency and first-occurrence). For each execution compute a rarity score from
    historical frequency for that user and globally, and flag commands that are rare for the user AND
    rare globally (e.g., above the 95th percentile of rarity, or first-ever for the host/user) using k-sigma
    baselining. Also count failed/blocked execution attempts as a distinct state signal. A command that
    is routine for a build server is low priority; the same command first-ever on a finance workstation
    is a strong Defense Impairment lead. Tune the threshold to your environment''s admin patterns. Sources:
    k-sigma baselining per [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Developer Workstations, Endpoint fleet, macOS systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint (Image="*bcdedit.exe" OR Image="*csrutil*")

      | stats count AS cnt earliest(_time) AS first by user host CommandLine

      | eventstats avg(cnt) AS mu stdev(cnt) AS sd by CommandLine

      | eval rarity=(mu-cnt)/sd

      | where rarity>=2 OR first>relative_time(now,"-1d")

      | table _time user host CommandLine cnt rarity'
- question: Do any bcdedit/csrutil command lines form size-1 clusters or outliers under unsupervised analysis,
    suggesting obfuscated or novel signing-policy modification commands?
  context: 'Adversaries obfuscate or use unusual variants of enabling commands to evade exact-match and
    regex rules. Vectorize bcdedit/csrutil command lines (TF-IDF or a small command-line language model)
    and apply unsupervised clustering (e.g., DBSCAN) or an Isolation Forest; size-1 clusters and outliers
    represent obfuscated or novel commands deviating from administrative norms. Alerts should report the
    distinguishing tokens/features driving the outlier score so analysts can see why a command was flagged.
    This catches creative evasions the symbolic and statistical layers miss; an outlier command that ultimately
    manipulates signing policy is high value, while benign-but-unusual admin syntax can be whitelisted
    after review. Sources: [Isolation Forest](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Developer Workstations, Endpoint fleet, macOS systems'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "vecs = tfidf(commandlines_of(bcdedit, csrutil))\nlabels = DBSCAN(eps, min_samples).fit_predict(vecs)\n\
      for cmd in where(cluster_size==1 OR label==-1):\n alert(cmd.host, cmd.cmdline, distinguishing_tokens(cmd))"
- question: Were there any write or delete operations to the Windows code-integrity registry keys HKLM\SYSTEM\CurrentControlSet\Control\CI\Config
    or...\CI\Policy not attributable to a trusted process or approved change?
  context: 'Beyond command-line tools, adversaries can modify Driver Signature Enforcement state directly
    through the registry. Monitor write/delete operations (Windows Event ID 4657, Sysmon Event ID 13)
    on the code-integrity keys HKLM\SYSTEM\CurrentControlSet\Control\CI\Config and...\CI\Policy and alert
    on any modification not attributed to a known trusted system process or an approved change ticket.
    These keys govern DSE state, so a change here can silently weaken kernel signature enforcement. Ensure
    coverage is enabled via a Sysmon baseline (e.g., the SwiftOnSecurity config). A modification by a
    non-system, unsanctioned process is a strong Defense Impairment indicator; legitimate servicing/patching
    processes should be baselined out. Sources: enable coverage with a Sysmon baseline such as the [SwiftOnSecurity
    config](https://github.com/SwiftOnSecurity/sysmon-config); these keys govern DSE state per [Trend
    Micro](https://documents.trendmicro.com/assets/white_papers/wp-an-in-depth-look-at-windows-kernel-threats.pdf).'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: All Windows Endpoints and Servers, Active Directory Certificate Services Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=windows (EventCode=4657 OR (sourcetype=Sysmon EventID=13))

      | where like(TargetObject, "%\\Control\\CI\\Config%") OR like(TargetObject, "%\\Control\\CI\\Policy%")

      | lookup trusted_processes Image OUTPUT trusted

      | where isnull(trusted)

      | eval alert="CI code-integrity key modification"

      | table _time host user Image TargetObject Details'
- question: For processes modifying code-integrity registry keys, does the initiating process file path
    exhibit anomalously high entropy or bottom-percentile fleet prevalence (randomized/temp-path execution)?
  context: 'Legitimate tools that touch CI keys are few and well known; malware often runs from randomized
    or temporary paths. For every process modifying a monitored CI key, compute the string entropy and
    fleet prevalence of its file path. Baseline legitimate admin tools, then flag modifications where
    the initiating process path entropy exceeds 3 standard deviations from baseline or the binary is in
    the bottom 1st percentile of host prevalence. Derive thresholds from your environment. High-entropy
    or rare-path initiators modifying signing-policy registry keys strongly suggest abuse, whereas a common,
    well-distributed system binary is likely benign servicing. This adds a probabilistic layer atop the
    deterministic key-monitoring rule. Sources: baselining per [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: All Windows Endpoints and Servers, Active Directory Certificate Services Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=windows (EventCode=4657 OR EventID=13) (TargetObject="*\\Control\\CI\\*")

      | eval ent=entropy(Image)

      | eventstats avg(ent) AS mu stdev(ent) AS sd, dc(host) AS hc by Image

      | eventstats perc1(hc) AS p1

      | where ent>mu+3*sd OR hc<=p1

      | table _time host Image TargetObject ent hc'
- question: Is the frequency of code-integrity (CI) key modification events on a host or across the fleet
    anomalously high relative to a seasonal time-series forecast?
  context: 'A burst of CI-key modifications -- across many hosts or repeatedly on one -- can indicate
    a scripted campaign to disable signature enforcement at scale. Model the per-host/fleet frequency
    (volume) of CI-key modification events with a seasonal time-series forecaster (e.g., Prophet or ARIMA)
    that accounts for daily/weekly seasonality, then alert when observed counts exceed the predicted upper
    confidence interval, indicating an anomalous burst. Pairing with DeepLog-style sequence modeling lets
    the alert name the unexpected event in context. This catches volumetric anomalies that per-event rules
    miss; a sudden spike during patching may be benign, while an off-hours burst on unrelated hosts is
    suspicious and should be investigated. Sources: pair with [DeepLog](https://acmccs.github.io/papers/p1285-duA.pdf)-style
    sequence modeling so the alert names the unexpected event in context.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: All Windows Endpoints and Servers, Active Directory Certificate Services Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "ts = counts_per_interval(CI_key_modifications, by=host_or_fleet)\nmodel = Prophet(seasonality=[daily,weekly]).fit(ts.history)\n\
      yhat = model.predict(ts.now)\nif ts.observed > yhat.upper:\n alert(scope, ts.observed, yhat.upper,\
      \ context=deeplog_unexpected_event)"
- question: On any single host, did a code-signing-policy modification get followed by a reboot and then
    a driver load with invalid or missing signature within a short (e.g., 30-minute) window?
  context: 'Many DSE-bypass implementations require a reboot before the relaxed signing policy takes effect,
    after which an unsigned driver can load. Implement a stateful correlation rule that fires when, on
    the same host, a ''Code Signing Policy Modification'' alert is followed by a shutdown/reboot event
    (Windows Event ID 6006/1074) and then a driver load with invalid or missing signature (Sysmon Event
    ID 6, Signed=''false'') within a 30-minute window. This encodes the documented DSE-bypass chain end
    to end, raising confidence far above any single event. Treat the invalid-signature load (a state/failure
    signal) as the high-confidence trigger. Observing this full sequence is a near-certain indicator of
    successful signature-enforcement subversion and should be treated as a confirmed incident pending
    validation. Sources: this encodes the documented DSE-bypass chain per [ESET](https://www.welivesecurity.com/2022/01/11/signed-kernel-drivers-unguarded-gateway-windows-core/)
    and [Trend Micro](https://documents.trendmicro.com/assets/white_papers/wp-an-in-depth-look-at-windows-kernel-threats.pdf).'
  answer_sources:
  - Windows Event ID 5038
  - Sysmon Event ID 6
  - Windows Event ID 6006
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows Endpoints, especially developer and administrator workstations, Virtual Desktop
    Infrastructure (VDI) fleet'
  range: 'Last 90 days; event-centered: correlate within a 30-minute window per host across the policy-change,
    reboot, and driver-load events'
  queries:
  - technology: SIEM/Rule pseudocode
    query: '| from signing_policy_mod_alerts AS A

      | join host [reboot_events EventCode IN (6006,1074)] AS B where B._time>A._time

      | join host [Sysmon EventID=6 Signed="false"] AS C where C._time>B._time AND C._time-A._time<=1800

      | eval alert="DSE bypass chain: policy mod -> reboot -> unsigned driver load"

      | table A._time host A.CommandLine B._time C.ImageLoaded C.Signature'
- question: Which hosts are in the fleet's top percentile for the daily rate of unsigned driver loads,
    or have a first-ever unsigned driver load?
  context: 'Persistent misconfiguration or compromise produces an elevated, sustained rate of unsigned
    driver loads. Compute the daily rate (frequency) of unsigned driver load events (Sysmon Event ID 6,
    Signed=''false'') per host, smoothed with a moving average, and flag hosts in the 99th percentile
    for the fleet or with a first-ever unsigned load. Profile blocked driver installs separately as a
    distinct failure signal. A host that suddenly begins loading unsigned drivers -- or that consistently
    leads the fleet -- warrants investigation for either a weakened signing policy or active BYOVD activity.
    Most healthy hosts should load no unsigned drivers, so any first-ever occurrence is meaningful; tune
    to account for legitimate development machines. Sources: baselining per [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    vulnerable-driver context per [Elastic](https://www.elastic.co/security-labs/stopping-vulnerable-driver-attacks).'
  answer_sources:
  - Windows Event ID 5038
  - Sysmon Event ID 6
  - Windows Event ID 6006
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows Endpoints, especially developer and administrator workstations, Virtual Desktop
    Infrastructure (VDI) fleet'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=windows (sourcetype=Sysmon EventID=6 Signed="false")

      | bucket _time span=1d

      | stats count AS loads by host _time

      | streamstats avg(loads) AS ma by host

      | eventstats perc99(loads) AS p99

      | where loads>=p99 OR earliest_seen(host)

      | table host _time loads ma p99'
- question: Does a sequence or provenance-graph model assign a very low benign probability to a host's
    event chain, especially a 'policy modification -> reboot -> unsigned driver load' transition?
  context: 'Hard-coded windows and thresholds can miss variant orderings or timing of the bypass chain.
    Train a sequence model on benign endpoint event chains (process creation, registry mods, driver loads,
    reboots) -- a Hidden Markov Model, a DeepLog LSTM, or a provenance-graph learner (ThreaTrace, KAIROS)
    -- then score new sequences and flag those with very low benign probability, especially the ''policy
    modification -> reboot -> unsigned driver load'' transition. Crucially, surface the reconstructed
    subgraph or the violated expected event so the alert is explainable rather than an opaque score. This
    generalizes the stateful rule to catch novel sequencings; a low-probability chain that culminates
    in an unsigned driver load is a strong Defense Impairment signal, and the reconstructed path tells
    the analyst exactly what to verify. Sources: Hidden Markov Model per [Warrender et al.](https://ieeexplore.ieee.org/document/766910),
    DeepLog LSTM per [Du et al.](https://acmccs.github.io/papers/p1285-duA.pdf), and provenance-graph
    learners [ThreaTrace](https://arxiv.org/pdf/2111.04333) and [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 5038
  - Sysmon Event ID 6
  - Windows Event ID 6006
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows Endpoints, especially developer and administrator workstations, Virtual Desktop
    Infrastructure (VDI) fleet'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = ordered_events(host, window)\np_benign = sequence_model.score(seq) # HMM / DeepLog /\
      \ ThreaTrace\nif p_benign < tau or violates(seq, expected=\"policy_mod->reboot->unsigned_driver_load\"\
      ):\n alert(host, reconstructed_subgraph(seq), violated_event)"
- question: Did a known-vulnerable but legitimately signed driver load and, within a short window (e.g.,
    5 minutes) on the same host, was a second unsigned or anomalously signed driver loaded (the BYOVD
    chain)?
  context: 'Bring Your Own Vulnerable Driver attacks abuse a legitimately signed but exploitable driver
    to gain kernel access and then load malicious unsigned code. Maintain a watchlist of known-vulnerable
    driver hashes/signers from LOLDrivers and Microsoft''s vulnerable-driver blocklist, and alert when
    a watchlisted driver loads (Sysmon Event ID 6 / Event ID 7045) and, within 5 minutes on the same host,
    a second driver loads that is unsigned (Signed=''false'') or has anomalous signature status. This
    is the canonical BYOVD chain and a high-confidence indicator of an attempt to bypass signature enforcement
    at the kernel level. Observing it on a high-value host (DC, EDR server) is especially serious and
    should trigger immediate response. Sources: [LOLDrivers](https://www.loldrivers.io/) ([repo](https://github.com/magicsword-io/LOLDrivers));
    canonical BYOVD chain per [ESET](https://www.welivesecurity.com/2022/01/11/signed-kernel-drivers-unguarded-gateway-windows-core/)
    and [Elastic](https://www.elastic.co/security-labs/stopping-vulnerable-driver-attacks).'
  answer_sources:
  - Windows Event ID 7045
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Zeek x509.log
  - 'NAI: High-Value Target Workstations, Domain Controllers, Servers running Endpoint Detection and Response
    (EDR) agents'
  range: 'Last 90 days; event-centered: 5-minute same-host correlation window between the vulnerable-driver
    load and the subsequent unsigned-driver load'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "| from (Sysmon EventID=6 OR EventCode=7045) AS L1\n| lookup loldrivers_blocklist hash AS L1.Hashes\
      \ OUTPUT vuln\n| where isnotnull(vuln)\n| join host [Sysmon EventID=6 (Signed=\"false\" OR SignatureStatus!=\"\
      Valid\")] AS L2\n where L2._time>L1._time AND L2._time-L1._time<=300\n| eval alert=\"BYOVD: vulnerable\
      \ driver -> unsigned/anomalous driver load\"\n| table host L1._time L1.ImageLoaded L2._time L2.ImageLoaded\
      \ L2.Signed"
- question: After a known-vulnerable driver loads, is a subsequent driver signed by an entity in the bottom
    percentile of signer rarity (almost never seen in the fleet) or self-signed?
  context: 'Signer telemetry exposes BYOVD even when the second driver is technically ''signed'' but by
    an unusual or self-signed certificate. For every driver load (Sysmon Event ID 6) extract certificate
    issuer/subject and cross-reference Zeek x509.log to baseline common enterprise signers. If a known
    vulnerable driver loads and is followed by a driver signed by an entity in the 1st percentile of rarity
    (almost never seen) or self-signed, escalate. Derive the rarity cutoff from your fleet''s signer distribution.
    This catches adversaries who self-sign or use throwaway certificates after exploiting the vulnerable
    driver; a rare/self-signed driver following a watchlisted load is a strong BYOVD lead, while a follow-on
    signed by a common, trusted enterprise vendor is likely benign. Sources: signer-rarity baselining
    per [Elastic](https://www.elastic.co/security-labs/stopping-vulnerable-driver-attacks) and [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Windows Event ID 7045
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Zeek x509.log
  - 'NAI: High-Value Target Workstations, Domain Controllers, Servers running Endpoint Detection and Response
    (EDR) agents'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=windows (sourcetype=Sysmon EventID=6)

      | eval signer=coalesce(CertIssuer,Signature)

      | stats dc(host) AS hc by signer

      | eventstats perc1(hc) AS p1

      | join host [vulnerable_driver_loads]

      | where (hc<=p1 OR SelfSigned="true") AND followed_vuln_load_within("5m")

