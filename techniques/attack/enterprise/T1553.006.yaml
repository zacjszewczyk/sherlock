name: 'T1553.006: Subvert Trust Controls: Code Signing Policy Modification'
id: 8a512b3c-ebbe-4e3f-8b04-e6584dd915d5
description: 'This playbook helps an analyst investigate adversary attempts to modify code signing policies
  in order to enable execution of unsigned or self-signed code on Windows and macOS hosts (MITRE ATT&CK
  T1553.006). It guides the hunt across multiple, mutually reinforcing signals: process creation events
  matching known signing-policy and vulnerable-driver tools (e.g., KDU, DSEFix, LOLDrivers corpus); command-line
  invocations of authoritative enabling commands such as ''bcdedit.exe /set testsigning on'', ''bcdedit
  /set nointegritychecks on'', and ''csrutil disable''; registry writes/deletes to code-integrity keys
  (HKLM\SYSTEM\CurrentControlSet\Control\CI\Config and...\CI\Policy); the documented DSE-bypass chain
  of policy modification -> reboot -> unsigned/invalid-signature driver load; and Bring Your Own Vulnerable
  Driver (BYOVD) sequences where a legitimately signed but known-vulnerable driver loads and is quickly
  followed by an unsigned or anomalously signed driver. For each signal the playbook provides deterministic
  (symbolic logic) detections, statistical rarity/prevalence/baseline methods, and machine-learning approaches
  (supervised classification, clustering, time-series forecasting, sequence and provenance-graph models),
  all aimed at determining whether the adversary is degrading signature-enforcement controls to load malicious
  kernel-mode or unsigned code.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
