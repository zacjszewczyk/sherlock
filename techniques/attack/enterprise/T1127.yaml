    while blending into legitimate development activity. Evidence under investigation: A trusted developer
    utility spawns a child process that is anomalous to its baseline behavior, such as a script interpreter,
    network utility, or a process running from a user-writable directory. Approach (Graph-anomaly detection
    on lineages): Build process-lineage provenance graphs and apply node-level GraphSAGE [ThreaTrace,
    Wang et al.](https://arxiv.org/pdf/2111.04333) or graph temporal autoencoders [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf)
    to learn normal subgraph structure and alert on high-anomaly subgraphs, surfacing the offending node
    and its top contributing edges; self-supervised masked graph learning [MAGIC, Jia et al.](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf)
    adapts to drift without labeled attacks. A positive result indicates a developer utility behaving
    inconsistently with approved tooling, user, host role, or expected child/destination patterns and
    warrants escalation; a negative result means the observed activity matches the established baseline
    for that utility. Investigate the named area of interest (All Windows endpoints and servers, focusing
