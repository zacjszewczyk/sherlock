    command lines combining URL retrieval with those paths [Command Line Execution with Suspicious URL
    and AppData Strings, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_http_appdata/);
    keep this deterministic floor and tune string sets per environment [LOLBins Abuse, Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/).'
