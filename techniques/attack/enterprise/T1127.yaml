name: 'T1127: Trusted Developer Utilities Proxy Execution'
id: 43b22733-0ddb-4f9f-a705-b28b61728903
description: 'This playbook helps an analyst determine whether an adversary is abusing trusted, signed
  developer utilities (e.g., MSBuild.exe, WinDbg.exe, RCSI.exe, dnx.exe, csc.exe, tracker.exe) to proxy
  execution of malicious code and bypass application-control and Smart App Control protections (T1127).
  It spans two tactic perspectives present in the analysis plan: Stealth (blending malicious execution
  into trusted tooling) and Execution (running adversary code through a signed proxy). Investigative angles
  include: signed developer utilities launching outside a development context and reaching rare external
  destinations (Windows EID 4688 correlated with Zeek conn/dns/ssl); command lines carrying encoded payloads,
  inline code, or user-writable/temp paths; anomalous child processes (script interpreters, LOLBins, binaries
  from user-writable directories); execution by non-developer users, on non-developer assets, or spawned
  by productivity apps/browsers (joined with EID 4624 logon, AD groups, and CMDB/asset role data); and
  the drop-execute-beacon-delete temp-binary lifecycle on a single host. Detection blends symbolic-logic
  rules (regex/allowlist/context joins), statistical baselining (rarity percentiles, Shannon entropy,
  SARIMA/Prophet forecasting, low-probability parent-child relationships, temp-binary lifetime profiling),
  and machine learning (gradient-boosted and Random Forest classifiers, one-class SVM/Isolation Forest,
  ELECTRA/BERT command-line models, GraphSAGE/KAIROS/MAGIC provenance-graph anomaly detection, and HMM
  sequence models) to produce evasion-resistant, explainable alerts.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0002
  tactic_name: Execution
