questions:
- question: 'Using deterministic rule logic, can you determine whether ''Validate utility launches and
    flow data'' reveals abuse of trusted developer utilities to proxy execution (Stealth tactic)? Specifically:
    Correlate developer-utility process creations (EID 4688) with Zeek conn/dns/ssl by host and timestamp,
    and alert when the launch context (non-dev host/user, productivity-app parent), child processes, or
    destination indicators are inconsistent with approved tooling [LOLBins Abuse, Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/),
    [Identifying and Mitigating LOTL, CISA/NSA](https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques);
    preserve the requirement that the full chain (utility → anomalous child/destination) be present [Dismantling
    Smart App Control, Elastic Security Labs](https://www.elastic.co/security-labs/dismantling-smart-app-control).'
  context: 'Tactic context (Stealth): adversaries abuse signed developer utilities so that malicious code
    runs through a trusted, allow-listed process, defeating application control and Smart App Control
    while blending into legitimate development activity. Evidence under investigation: A signed developer
    utility executes outside an expected development context and then spawns suspicious children or reaches
    a rare external destination that is inconsistent with approved tooling. Approach (Validate utility
    launches and flow data): Correlate developer-utility process creations (EID 4688) with Zeek conn/dns/ssl
    by host and timestamp, and alert when the launch context (non-dev host/user, productivity-app parent),
    child processes, or destination indicators are inconsistent with approved tooling [LOLBins Abuse,
    Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/), [Identifying and Mitigating LOTL, CISA/NSA](https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques);
    preserve the requirement that the full chain (utility → anomalous child/destination) be present [Dismantling
    Smart App Control, Elastic Security Labs](https://www.elastic.co/security-labs/dismantling-smart-app-control).
    A positive result indicates a developer utility behaving inconsistently with approved tooling, user,
    host role, or expected child/destination patterns and warrants escalation; a negative result means
    the observed activity matches the established baseline for that utility. Investigate the named area
    of interest (Developer workstations, build servers, domain controllers, and network egress points/gateways.)
    and pivot from any hit to the parent process, the executing account and its group membership, the
    asset''s development role, the full process lineage, and any outbound connections, dropped binaries,
    or follow-on execution.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Developer workstations, build servers, domain controllers, and network egress points/gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Correlate developer-utility launches with network flow\nPROC = EID4688 WHERE image IN dev_utilities\
      \  // MSBuild,WinDbg,RCSI,csc,dnx,tracker\nJOIN Zeek(conn,dns,ssl) ON host AND time_window(PROC.time,\
      \ 5m)\nALERT WHERE host NOT IN dev_assets OR user NOT IN dev_group\n   OR parent IN productivity_apps\n\
      \   OR child IN suspicious_children\n   OR dest NOT IN approved_tooling_destinations\nREQUIRE full_chain(utility\
      \ -> anomalous_child OR rare_destination)"
  - technology: Zeek/pseudocode
    query: "// Zeek view for developer-utility network activity\nconn.log: filter orig_h IN affected_hosts,\
      \ summarize resp_h, resp_p,\n  conn_state, orig_bytes, resp_bytes\ndns.log: rare/NXDOMAIN query\
      \ names near utility exec time\nssl.log: rare ja3/ja3s; join to host+time window of utility launch"
