  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Domain-account discovery watchlist\nMATCH events FROM [Windows\
      \ Event ID 4688, Windows Event ID 4104, Windows Event ID 4662, Sysmon Event ID 1]\nWHERE event matches\
      \ the enumeration criteria described in the action\n // Monitor process creation (Sysmon EID 1 /\
