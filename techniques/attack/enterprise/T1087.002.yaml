      \ host_role, severity"
- question: 'Using statistical baselining, can you determine whether "LDAP enumeration burst anomaly"
    indicates adversary enumeration of domain accounts or groups? Specifically: Build a 30-day per-host
    baseline of directory-query activity capturing Volume (LDAP `orig_bytes`/`resp_bytes` and distinct
    directory objects returned), Frequency (user/group lookup commands per 5-minute window), and State
    (ratio of successful vs. denied/error responses). Flag hosts exceeding the 99th percentile on count
    or distinct-object Volume, applying the rapid-succession discovery logic from [CAR-2016-03-001: Host
    Discovery Commands](https://car.mitre.org/analytics/CAR-2016-03-001/) and the outlier-resistant MAD/fan-out
    baselining of [Bohara et al.](https://mnoureddine.com/files/17BOH01.pdf). Correlate with Windows [Event
    4662](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4662)
    directory-access events against many principals in the same interval. Derive thresholds per host role
    (DC vs. workstation) and emit the contributing metrics (distinct objects, query rate, denied ratio)
    in the alert.'
