name: 'T1087.002: Domain Account'
id: e8655dcd-39e2-43e9-9f71-31a7c1b52185
description: This playbook helps an analyst determine whether an adversary is enumerating domain accounts,
  groups, trusts, or directory objects (T1087.002 Domain Account discovery) inside an Active Directory
  environment. It correlates host-based process telemetry (Windows 4688 / Sysmon EID 1 process creation
  and 4104 PowerShell ScriptBlock logs for tools such as net.exe, net1.exe, dsquery.exe, nltest.exe, Get-ADUser/Get-ADGroupMember,
  PowerView, AdFind, and BloodHound/SharpHound) with directory-access auditing (Windows 4662 on protected
  objects), Kerberos service-ticket activity (Windows 4769 for SPN enumeration and Kerberoasting), and
  network telemetry (Zeek conn.log, ldap.log, and dce_rpc.log for LDAP/SAMR query bursts to Domain Controllers).
  On Linux and macOS it covers ldapsearch, wbinfo/winbind, dscl, and dscacheutil enumeration. Investigative
  angles include high-signal command-line argument matching, per-host and per-user statistical baselining
  of query volume, frequency, and success/failure state, script-block entropy and obfuscation scoring,
  stateful correlation of discovery command chains, and machine-learning anomaly detection (Isolation
  Forest, One-Class SVM, COPOD/PCA/autoencoder, transformer command-line embeddings, and LSTM sequence
  models) to produce evasion-resistant, explainable alerts for the Discovery tactic.
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
