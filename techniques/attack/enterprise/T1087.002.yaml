questions:
- question: 'Using deterministic rule logic, can you determine whether "Domain-account discovery watchlist"
    indicates adversary enumeration of domain accounts or groups? Specifically: Monitor process creation
    (Sysmon EID 1 / Windows 4688) and PowerShell ScriptBlock logs (4104) for AD enumeration utilities
    and arguments such as `net user /domain`, `net group "Domain Admins" /domain`, `net accounts /domain`,
    `dsquery user`, `nltest /domain_trusts`, `Get-ADUser`, `Get-ADGroup`, `Get-ADGroupMember`, PowerView
    (`Get-NetUser`, `Get-DomainUser`), AdFind, and BloodHound/SharpHound collectors, per the high-signal
    argument lists in [CAR-2013-07-001: Suspicious Arguments](https://car.mitre.org/analytics/CAR-2013-07-001/)
    and the rename-resilient flag matching in [PUA AdFind Enumeration (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_pua_adfind_enumeration.yml)
    and [Net.EXE Account Reconnaissance (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_net_groups_and_accounts_recon.yml).
    Exclude `/add`/`/delete` (modification, not recon). Raise severity when these run on user workstations,
    web/DB servers, or are spawned by a non-interactive parent (`w3wp.exe`, `sqlservr.exe`, Office apps)
    or a script host after an initial recon command.'
  context: 'Tactic context (Discovery): adversaries enumerate domain accounts, groups, and trusts to orient
    themselves and identify high-value targets such as privileged accounts before follow-on credential
    theft or lateral movement. Evidence under investigation: Domain-account discovery is visible when
    a host enumerates users, groups, trusts, or directory objects from Active Directory through LDAP,
    PowerShell, or built-in utilities. The evidence includes commands that request domain user and group
    listings, often producing a rapid burst of directory queries from an endpoint that does not normally
    perform administration. Approach (Domain-account discovery watchlist): Monitor process creation (Sysmon
    EID 1 / Windows 4688) and PowerShell ScriptBlock logs (4104) for AD enumeration utilities and arguments
    such as `net user /domain`, `net group "Domain Admins" /domain`, `net accounts /domain`, `dsquery
    user`, `nltest /domain_trusts`, `Get-ADUser`, `Get-ADGroup`, `Get-ADGroupMember`, PowerView (`Get-NetUser`,
    `Get-DomainUser`), AdFind, and BloodHound/SharpHound collectors, per the high-signal argument lists
    in [CAR-2013-07-001: Suspicious Arguments](https://car.mitre.org/analytics/CAR-2013-07-001/) and the
    rename-resilient flag matching in [PUA AdFind Enumeration (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_pua_adfind_enumeration.yml)
    and [Net.EXE Account Reconnaissance (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_net_groups_and_accounts_recon.yml).
    Exclude `/add`/`/delete` (modification, not recon). Raise severity when these run on user workstations,
    web/DB servers, or are spawned by a non-interactive parent (`w3wp.exe`, `sqlservr.exe`, Office apps)
    or a script host after an initial recon command. A positive result means a host, user, or source is
    enumerating directory objects in a pattern inconsistent with its normal administrative role; a negative
    result means the observed activity matches expected baselines. Investigate the named area of interest
    (Domain Controllers, Member Servers, Privileged User Workstations) and pivot from any hit to the originating
    process, account, parent process chain, and any subsequent credential-access or lateral-movement activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4662
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Member Servers, Privileged User Workstations'
