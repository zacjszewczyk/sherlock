name: 'T1530: Data from Cloud Storage'
id: 2cc2faa9-b14c-4675-80b7-5a8b42e23831
description: 'This playbook helps an analyst investigate whether an adversary is accessing and collecting
  data from cloud storage (Amazon S3, Azure Blob/Storage, Google Cloud Storage, and SaaS/Office Suite
  stores such as OneDrive, SharePoint, Google Drive, Dropbox, and similar) as part of the Collection tactic.
  It guides the hunt across several behavioral angles: correlating cloud storage access events (GetObject/CopyObject/Download)
  and Zeek conn/http telemetry against threat-intel, anonymous-proxy, and Tor feeds and known exfiltration-tool
  User-Agents; spotting AccessDenied/403 recon-then-access chronology indicative of stolen credentials;
  tracking User-Agent entropy drops and list-to-get recon ratios that betray a switch to programmatic
  tooling; detecting siphoning tools (Rclone, S4cmd, S3Browser) via process-creation watchlists, bulk-copy
  command lines, and concurrent-connection bursts; baselining per-principal download volume and API call
  counts with static floors, modified Z-scores, time-series forecasting, and Isolation Forests; catching
  impossible-travel, anonymous/Tor, and multi-anomaly logins via rules, weighted risk scoring, and graph/GNN
  relationship models; and flagging anonymous/unauthenticated object access and logging-tamper events.
  Detection methods combine symbolic-logic rules, statistical baselining/forecasting, and machine-learning
  models applied to cloud audit logs (AWS CloudTrail, Azure Activity/Sign-in logs, Google Cloud Audit
  Logs, m365/SharePoint unified logs), Windows Security events (4624, 4688), and Zeek/network telemetry,
  so the analyst can corroborate suspected cloud-storage collection against identity, source, volume,
  and exfiltration context.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
