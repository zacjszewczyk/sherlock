questions:
- question: '[Collection] Malicious source correlation (Symbolic Logic): Using the ''Malicious source
    correlation'' approach, can you determine whether a successful cloud storage access event (e.g., GetObject,
    Download) where the source IP address is associated with a known malicious entity (e.g., threat intelligence
    feed, anonymous proxy) or the User-Agent string matches a known data exfiltration tool signature?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary accesses data held in
    cloud object/file storage (e.g., S3, Azure Blob/Storage, Google Cloud Storage, OneDrive, SharePoint,
    Google Drive, Dropbox) -- often via the cloud API or abused credentials/OAuth tokens rather than the
    front-end application -- to collect and stage sensitive data for exfiltration. This evidence focuses
    on the condition that a successful cloud storage access event (e.g., GetObject, Download) where the
    source IP address is associated with a known malicious entity (e.g., threat intelligence feed, anonymous
    proxy) or the User-Agent string matches a known data exfiltration tool signature. This Symbolic Logic
    approach implements the following: Match cloud storage sourceIPAddress (CloudTrail S3 data events,
    Azure/GCS access logs) and Zeek conn.log id.orig_h / http.log User-Agent against threat-intel, anonymous-proxy,
    and Tor exit-node feeds, and scan userAgent for known tool names; alert on any successful GetObject
    from such a source, mirroring GuardDuty [Exfiltration:S3/MaliciousIPCaller and UnauthorizedAccess:S3/TorIPCaller](https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-s3.html).
    Post host/user context to the SIEM risk board. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates access to cloud storage that deviates from the principal''s sanctioned
    pattern of life and warrants pivoting to the responsible principal/role, the source IP and User-Agent,
    the objects and buckets touched, the authentication chain, and any subsequent outbound transfer. A
    negative result helps rule out this particular cloud-storage collection vector but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, credentialed,
    or API-native access.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Cloud provider API gateways, Internet gateway proxy servers, Enterprise SIEM platform'
  range: Last 90 days; pivot to a 15-30 minute event-centered window around any hit to reconstruct the
    access chain
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Malicious source correlation (T1530)\nsource IN [Zeek conn.log, Zeek http.log]\n| where\
      \ matches_condition_for(\"Malicious source correlation\")\n| eval rule = \"Malicious source correlation\"\
      \n// Match cloud storage sourceIPAddress (CloudTrail S3 data events, Azure/GCS access logs) and\
      \ Zeek conn.log id.orig_h / http.log User-Agent against threat-intel, anonymous-proxy, and \n| alert\
      \ principal, sourceIP, userAgent, bucket, object, rule"
- question: '[Collection] Failure-rate state check (Symbolic Logic): Using the ''Failure-rate state check''
    approach, can you determine whether a successful cloud storage access event (e.g., GetObject, Download)
    where the source IP address is associated with a known malicious entity (e.g., threat intelligence
    feed, anonymous proxy) or the User-Agent string matches a known data exfiltration tool signature?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary accesses data held in
