    ratios, action variety, unique-resource counts) with DBSCAN or score with rare-by-population ML ([Elastic
    CloudTrail ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning)),
    flag sparse ''high error, high variety'' sessions, and surface the top contributing features in the
    alert. A positive result -- a rule match, statistical outlier, or model alert -- indicates access
    to cloud storage that deviates from the principal''s sanctioned pattern of life and warrants pivoting
    to the responsible principal/role, the source IP and User-Agent, the objects and buckets touched,
    the authentication chain, and any subsequent outbound transfer. A negative result helps rule out this
    particular cloud-storage collection vector but should be corroborated with the other questions in
    this playbook, since a single method can miss low-and-slow, credentialed, or API-native access.'
