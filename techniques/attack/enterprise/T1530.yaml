    source IP address is associated with a known malicious entity (e.g., threat intelligence feed, anonymous
    proxy) or the User-Agent string matches a known data exfiltration tool signature. This Statistical
    Method approach implements the following: Track 30-day Zeek http.log User-Agent Shannon entropy per
    principal and alert when a 1-hour window drops below the 5th percentile, signaling a switch to a programmatic
    tool; validate thresholds against emulated access from [Stratus Red Team](https://github.com/DataDog/stratus-red-team).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates access to cloud
    storage that deviates from the principal''s sanctioned pattern of life and warrants pivoting to the
    responsible principal/role, the source IP and User-Agent, the objects and buckets touched, the authentication
    chain, and any subsequent outbound transfer. A negative result helps rule out this particular cloud-storage
    collection vector but should be corroborated with the other questions in this playbook, since a single
    method can miss low-and-slow, credentialed, or API-native access.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Cloud provider API gateways, Internet gateway proxy servers, Enterprise SIEM platform'
  range: Last 30 days for baselining, evaluated over rolling 5-minute to 1-hour windows
  queries:
