- question: '[Collection] User-Agent entropy drop (Statistical Method): Using the ''User-Agent entropy
    drop'' approach, can you determine whether a successful cloud storage access event (e.g., GetObject,
    Download) where the source IP address is associated with a known malicious entity (e.g., threat intelligence
    feed, anonymous proxy) or the User-Agent string matches a known data exfiltration tool signature?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary accesses data held in
