- question: '[Resource Development] Hash/domain rarity and download-failure scoring: Can you determine
    whether An executable file is created on a host where the file''s hash matches a known malicious tool
    signature from a threat intelligence feed, or a network connection is established from an internal
    host to a destination IP/domain/URL known to distribute adversary tooling. Failed lookups/fetches
    against staging infrastructure (NXDOMAIN, HTTP 404, blocked connections) are profiled as a distinct
    probing signal. -- specifically, using the ''Hash/domain rarity and download-failure scoring'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), adversaries buy, steal,
    download, or crack software tools (e.g., PsExec, Cobalt Strike, Mimikatz, Rubeus, SharpHound) to support
    post-compromise operations and to test their malware against defenses; this technique is largely staged
    off-target, so detection focuses on the point where acquired tooling touches the enterprise -- its
    download, execution, command lines, network callbacks, and lateral movement. This evidence focuses
    on the condition that An executable file is created on a host where the file''s hash matches a known
    malicious tool signature from a threat intelligence feed, or a network connection is established from
    an internal host to a destination IP/domain/URL known to distribute adversary tooling. Failed lookups/fetches
    against staging infrastructure (NXDOMAIN, HTTP 404, blocked connections) are profiled as a distinct
    probing signal. This Statistical Method approach works as follows: Calculate 30-day prevalence for
    executable hashes from Zeek files.log, flagging hashes seen on < 5 hosts, and compute Shannon entropy
    for FQDNs in Zeek dns.log, flagging 95th-percentile non-allowlisted domains tied to file downloads
    (entropy thresholds per Mandiant obfuscation features). Separately profile per-host failure rates
    (NXDOMAIN, HTTP 404, blocked/RST connections) over a rolling baseline and alert when a host exceeds
    3σ, which indicates probing of tool-staging infrastructure. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates an acquired adversary tool may be present or in use; pivot to
    the responsible process and its parent lineage, the user and host, the source/destination and TLS
    fingerprint, file hashes, and the timing of download-to-execution to scope the activity and confirm
    intent. A negative result helps rule out this particular tooling vector but should be corroborated
    with the other questions in this playbook, since a single method can miss renamed binaries, obfuscated
    command lines, low-and-slow beacons, or living-off-the-land tradecraft. References (preserve and follow
    these source citations): [Mandiant obfuscation features](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
