name: 'T1588.002: Tool'
id: 2f152dce-07ad-4291-b4ef-90b76e4bdb93
description: 'This playbook helps an analyst investigate whether an adversary has acquired or staged offensive
  software tools -- bought, stolen, downloaded, or cracked -- to support their operations (MITRE ATT&CK
  T1588.002, Tool). Unlike purpose-built malware, these are dual-use or red-team tools (e.g., PsExec,
  Cobalt Strike, Mimikatz, Rubeus, SharpHound, AdFind) whose acquisition happens largely off-target, so
  the hunt focuses on the moments acquired tooling becomes visible in the enterprise. It pursues the behavior
  from several complementary angles: executables or network connections matching tool-distribution IOCs,
  known-bad hashes, YARA/Sigma signatures, and offensive TLS (JA3/JA4) or Malleable C2 fingerprints; rarity
  and download-failure scoring of hashes and domains plus C2 beacon cadence detection; supervised and
  unsupervised classification of outbound tool-distribution traffic; command-line and PowerShell script-block
  patterns characteristic of offensive tools, with argument-rarity, entropy, and embedding-based obfuscation
  detection; download-to-execution correlation from user-writable directories with rare parent-child tuple
  and sequence-anomaly scoring; and first-seen or outlier remote-administration connections (WinRM, SMB,
  RDP, DCE/RPC) with failed-logon profiling and graph-based lateral-movement anomaly detection. Detection
  methods combine deterministic symbolic-logic rules, statistical baselining, and machine learning across
  Windows Event IDs (4688, 4104, 4624, 4648, 4625), Sysmon, and Zeek conn/dns/http/ssl/files/dce_rpc/rdp
  logs, so the analyst can corroborate suspected adversary tooling against process lineage, file hashes,
  network fingerprints, beacon timing, and lateral-movement graphs.'
