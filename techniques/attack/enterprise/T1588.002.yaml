questions:
- question: '[Resource Development] Tool distribution IOC and signature correlation: Can you determine
    whether An executable file is created on a host where the file''s hash matches a known malicious tool
    signature from a threat intelligence feed, or a network connection is established from an internal
    host to a destination IP/domain/URL known to distribute adversary tooling. Failed lookups/fetches
    against staging infrastructure (NXDOMAIN, HTTP 404, blocked connections) are profiled as a distinct
    probing signal. -- specifically, using the ''Tool distribution IOC and signature correlation'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), adversaries buy, steal,
    download, or crack software tools (e.g., PsExec, Cobalt Strike, Mimikatz, Rubeus, SharpHound) to support
    post-compromise operations and to test their malware against defenses; this technique is largely staged
    off-target, so detection focuses on the point where acquired tooling touches the enterprise -- its
    download, execution, command lines, network callbacks, and lateral movement. This evidence focuses
    on the condition that An executable file is created on a host where the file''s hash matches a known
    malicious tool signature from a threat intelligence feed, or a network connection is established from
    an internal host to a destination IP/domain/URL known to distribute adversary tooling. Failed lookups/fetches
    against staging infrastructure (NXDOMAIN, HTTP 404, blocked connections) are profiled as a distinct
    probing signal. This Symbolic Logic approach works as follows: Join Zeek conn.log/dns.log/http.log
    with IOC lists for tool-distribution sites, and simultaneously scan Windows Event ID 4688 and Zeek
    files.log hashes against known-bad tool hashes and YARA payload signatures such as the Cobalt Strike
    YARA Signature Base and offensive-tool rules in SigmaHQ; additionally match offensive-tool TLS stacks
    in Zeek ssl.log against JA3 / JA4+ fingerprint blocklists and Malleable C2 URI/header patterns from
    Unit 42. Alert on any match. Where a beacon is suspected, extract config/watermark with JPCERT CobaltStrikeScan.
    A positive result -- a rule match, statistical outlier, or model alert -- indicates an acquired adversary
    tool may be present or in use; pivot to the responsible process and its parent lineage, the user and
    host, the source/destination and TLS fingerprint, file hashes, and the timing of download-to-execution
    to scope the activity and confirm intent. A negative result helps rule out this particular tooling
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss renamed binaries, obfuscated command lines, low-and-slow beacons, or living-off-the-land
    tradecraft. References (preserve and follow these source citations): [Cobalt Strike YARA Signature
    Base](https://github.com/Neo23x0/signature-base/blob/master/yara/apt_cobaltstrike.yar), [SigmaHQ](https://github.com/SigmaHQ/sigma),
    [JA3](https://github.com/salesforce/ja3), [JA4+](https://github.com/FoxIO-LLC/ja4), [Unit 42 Cobalt
    Strike Malleable C2](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/), [JPCERT CobaltStrikeScan](https://github.com/JPCERTCC/aa-tools/tree/master/cobaltstrikescan).'
