- question: Did any host run an archiving/encryption tool (7z, rar, tar, zip, gpg) within 10 minutes before
    a non-browser connection to ports 21/80/25/53 from the same PID or process tree — the classic stage-then-exfiltrate
    sequence?
  context: 'Tactic: Exfiltration. Staging precedes exfiltration: adversaries compress or encrypt collected
    data, then ship it out. Alert when a host runs an archiving/encryption tool (7z, rar, tar, zip, gpg)
    within a short window (e.g., 10 minutes) before a non-browser connection to common cleartext exfil
    ports (21/80/25/53) from the same PID or process tree. Combine with Sigma upload-utility rules to
    confirm the egress step. The tight temporal coupling and shared process lineage are what make this
    high-confidence versus two unrelated events. An archive-then-egress sequence from an unexpected process
    is a strong lead; routine backup jobs that legitimately archive and upload should be allowlisted by
    process and destination.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint Detection and Response (EDR) agents on hosts, Security Information and Event Management
    (SIEM) correlation engine, and central log aggregators for host and network data.'
  range: Last 90 days; correlate within 10-minute windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM proc_create AS a  // EID 4688\nWHERE a.image IN (\"7z\",\"rar\",\"tar\",\"zip\",\"gpg\"\
      )\nJOIN net_conn AS c ON same_process_tree(a,c)  // Sysmon EID 3 / zeek_conn\nWHERE c.dst_port IN\
      \ (21,80,25,53) AND NOT is_browser(c.image)\n  AND c._time - a._time <= 10m\nALERT severity=high\
      \ // stage-then-exfil"
- question: Which process-event chains (archive -> exfil-tool -> external connection) are in the 99.9th
    percentile of inverse frequency over a 30-day baseline, weighted by bytes transferred and number of
    files read?
  context: 'Tactic: Exfiltration. The specific staging-to-egress chain an adversary uses is usually rare
    in a given environment. Score process-event chains (archive -> exfil-tool -> external connection)
    by inverse frequency over a 30-day baseline so that the rarest chains rise to the top, and alert when
    a chain reaches the 99.9th percentile. Weight the score by bytes transferred and number of files read
    so that rare chains touching lots of data rank highest — that is the high-impact exfiltration case.
    A very rare chain that also reads many files and moves substantial bytes is a strong lead; commonly
    recurring legitimate automation chains fall below the rarity threshold and self-suppress.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint Detection and Response (EDR) agents on hosts, Security Information and Event Management
    (SIEM) correlation engine, and central log aggregators for host and network data.'
  range: Last 90 days; baseline chain frequency over 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "chains = sequence(proc: archiver -> exfil_tool -> external_conn)\nSTATS count AS freq BY chain_signature\
      \  // 30d baseline\nEVAL rarity = 1/freq,\n     score = rarity * log(bytes_sent) * files_read\n\
      WHERE percentile_rank(score) >= 99.9\nALERT severity=high"
- question: After a staging (archival) event, did the outbound connection enter a persistent retry loop
    of failures (conn_state S0/REJ, NXDOMAIN, HTTP 403) before succeeding — distinguishing high-confidence
    exfiltration from a single benign upload?
  context: 'Tactic: Exfiltration. For the staging-then-egress chain, the connection''s success/failure
    profile is highly diagnostic. Record whether the outbound connection that follows an archival event
    succeeded (established and bytes sent) or failed (conn_state S0/REJ, NXDOMAIN, HTTP 403). A persistent
    retry loop after archival — repeated failures as the actor works to land the transfer — is a distinct,
    high-confidence exfiltration signal that a single benign upload would not produce. A retry-then-succeed
    pattern immediately after archiving sensitive data is a strong lead warranting escalation; a clean
    single upload from a known backup process is likely benign.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint Detection and Response (EDR) agents on hosts, Security Information and Event Management
    (SIEM) correlation engine, and central log aggregators for host and network data.'
  range: Last 90 days; correlate within the staging window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM archival_event AS a\nJOIN net_conn AS c ON same_host AND c._time>a._time AND c._time-a._time<30m\n\
      STATS count(eval(c.conn_state IN(\"S0\",\"REJ\") OR c.dns_rcode=\"NXDOMAIN\"\n      OR c.http_status=403))\
      \ AS retries,\n      count(eval(c.conn_state=\"SF\" AND c.orig_bytes>0)) AS success BY host,dst\n\
      WHERE retries>=3 AND success>0\nALERT severity=high // retry-loop after staging"
- question: When graph/flow anomaly detection runs over process-file-network graphs, which short paths
    link sensitive files through archivers to external destinations, and what are the top-3 contributing
    nodes/edges?
  context: 'Tactic: Exfiltration. Exfiltration is fundamentally a path through a graph: sensitive file
    -> archiver -> network utility -> external destination. Train graph/flow anomaly detection on process-file-network
    graphs and flag short paths that connect sensitive files through archiving tools to external destinations.
    An online ensemble-autoencoder approach as in Kitsune (Mirsky et al) scores the path and reports the
    top-3 contributing nodes/edges so the analyst can trace the data flow. A short, anomalous path from
    sensitive data to an external host through an archiver is a strong lead; benign data-handling workflows
    are learned into the graph baseline so only novel exfiltration-shaped paths surface.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Endpoint Detection and Response (EDR) agents on hosts, Security Information and Event Management
    (SIEM) correlation engine, and central log aggregators for host and network data.'
  range: Last 90 days; retrain periodically
  queries:
  - technology: SIEM/ML pseudocode
    query: 'graph = build(process, file_access, net_conn nodes/edges)

      model = GraphAnomaly/Autoencoder.fit(graph[-30d])

      paths = shortest_paths(sensitive_file -> archiver -> external_dst)

      score, contrib = model.score(paths), model.attribution(paths)

      WHERE score > threshold

      ALERT severity=high, detail=top3(nodes,edges)'
- question: Do any Zeek dns.log query names approach the RFC 1035 structural limits (a single label near
    63 octets or a total name near 255 octets) or contain Base64/Hex patterns, especially for TXT/NULL/CNAME
    record types that legitimate clients rarely request in volume?
  context: 'Tactic: Exfiltration. DNS tunneling encodes stolen data into query names, producing labels
    and total names that push against the DNS protocol''s structural limits and use record types uncommon
    for normal clients. Alert on Zeek dns.log query names where any single label approaches 63 octets
    or the total name approaches 255 octets (per RFC 1035), or where names contain Base64/Hex character
    patterns — particularly for TXT, NULL, or CNAME record types that legitimate clients rarely request
    in volume. These structural signatures are deterministic and hard for an adversary to avoid while
    still encoding meaningful data. Maxed-out, encoded query names for unusual record types are a strong
    lead for DNS exfiltration; some legitimate services (AV, anti-spam) use long TXT lookups and should
    be allowlisted.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal and external corporate DNS resolvers, network taps monitoring DNS traffic.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM zeek_dns\nEVAL max_label = max_label_len(query), total = len(query)\nWHERE max_label\
      \ >= 60 OR total >= 240\n  OR matches(query, /[A-Za-z0-9+/=]{40,}|[0-9a-f]{40,}/)\n  AND qtype IN\
      \ (\"TXT\",\"NULL\",\"CNAME\")\nALERT severity=high // encoded DNS exfil"
- question: Which hosts exceed the 99th percentile of DNS query volume or TXT/A record ratio with subdomain
    entropy above 4.5, and which domains carry disproportionate information content per a per-domain lossless-compression
    test even at low query rates?
  context: 'Tactic: Exfiltration. High-volume DNS exfiltration shows up as elevated query counts, a skewed
    TXT/A ratio, and high subdomain entropy, but low-and-slow tunneling needs an information-content lens
    to catch. Flag hosts exceeding the 99th percentile of query volume or TXT/A ratio with subdomain entropy
    above 4.5, and add a per-domain lossless-compression/information-content test so that domains carrying
    disproportionate bits are surfaced even at low query rates — per Born, Gustafson, and Paxson and the
    streaming heavy-hitter method of Chhabra et al. Combining rate-based and information-based signals
    catches both fast and slow tunneling. A host with high-entropy, high-volume, TXT-skewed DNS to a single
    domain is a strong lead; recursive resolvers and CDNs that aggregate queries should be profiled separately.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal and external corporate DNS resolvers, network taps monitoring DNS traffic.'
  range: Last 90 days; baseline over 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_dns\nSTATS count AS q, count(eval(qtype=\"TXT\"))/count(eval(qtype=\"A\")) AS txt_a_ratio,\n\
      \      mean(shannon(subdomain)) AS ent, info_content(subdomains) AS bits BY id_orig_h,domain\nWHERE\
      \ q > pct99(q) OR (txt_a_ratio high AND ent > 4.5) OR bits > info_threshold\nALERT severity=high"
- question: Which hosts or domains show elevated NXDOMAIN/SERVFAIL rates for unique high-entropy subdomains
    exceeding µ+3σ over baseline — the distinct failure-mode signature of DNS tunneling versus benign
    caching behavior?
  context: 'Tactic: Exfiltration. DNS tunneling and encoded exfiltration generate many lookups for unique,
    high-entropy subdomains that frequently resolve to NXDOMAIN or SERVFAIL, because the encoded labels
    do not correspond to real cacheable records. Profile per-host and per-domain NXDOMAIN and SERVFAIL
    rates, baseline the normal NXDOMAIN ratio, and alert when a host/domain exceeds µ+3σ — especially
    when the failing queries are unique high-entropy subdomains. This failure-mode signal is distinct
    from benign caching behavior, where repeated valid lookups resolve successfully. A spike in NXDOMAIN
    for unique high-entropy subdomains under one parent domain is a strong tunneling lead; misconfigured
    clients and typo domains are the main benign sources and lack the entropy signature.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal and external corporate DNS resolvers, network taps monitoring DNS traffic.'
  range: Last 90 days; baseline over 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_dns\nSTATS count(eval(rcode IN(\"NXDOMAIN\",\"SERVFAIL\"))) AS fails, count AS total,\n\
      \      dc(subdomain) AS uniq, mean(shannon(subdomain)) AS ent BY id_orig_h,domain\nEVAL fail_ratio\
      \ = fails/total\nWHERE fail_ratio > baseline_mean+3*baseline_std AND ent > 4.5 AND uniq high\nALERT\
      \ severity=medium // tunneling failure-mode"
- question: When an Isolation Forest (or logistic regression) scores domains on stateless features — unique
    subdomain count, mean label length, entropy, numeric/uppercase counts, record-type mix, request rate
