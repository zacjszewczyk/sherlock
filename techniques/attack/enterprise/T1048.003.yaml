    score?
  context: 'Tactic: Exfiltration. DNS exfiltration is well separated from benign DNS by a handful of per-domain
    stateless features. Train an Isolation Forest (or logistic regression) on unique subdomain count,
    mean label length, entropy, numeric/uppercase character counts, record-type mix, and request rate,
    as in Nadler et al (real-time and low-throughput) and validated on CIC-Bell-DNS-EXF-2021. Score live
    domains and surface the top-3 features driving each anomaly so the analyst can confirm. The stateless,
    per-domain design lets it catch both high-throughput and low-and-slow tunneling. A domain flagged
    with high unique-subdomain count and entropy is a strong lead; retrain and allowlist high-volume legitimate
    domains (CDNs, telemetry) to control false positives.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal and external corporate DNS resolvers, network taps monitoring DNS traffic.'
  range: Last 90 days; retrain periodically
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = per_domain(zeek_dns: uniq_subdomains, mean_label_len, entropy,\n          numeric_count,\
      \ upper_count, rtype_mix, request_rate)\nmodel = IsolationForest.load(\"dns_exfil\")  // Nadler;\
      \ CIC-Bell-DNS-EXF-2021\nscore, contrib = model.decision_function(features), model.explain(features)\n\
      WHERE score < anomaly_threshold\nALERT severity=high, detail=top3(contrib)"
