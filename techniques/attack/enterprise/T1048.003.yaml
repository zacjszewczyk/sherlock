name: 'T1048.003: Exfiltration Over Unencrypted Non-C2 Protocol'
id: c492ddaf-bda1-4468-b8f0-ba0b8abb3a5c
description: This playbook helps an analyst investigate Exfiltration Over Unencrypted Non-C2 Protocol
  (T1048.003) — where an adversary steals data by sending it out over a cleartext network protocol (such
  as HTTP, FTP, SMTP, TFTP, or DNS) that is separate from any existing command-and-control channel, often
  to an alternate destination and sometimes obfuscated with encoding/compression (e.g., Base64) rather
  than encryption. It guides correlation of network telemetry (Zeek conn.log, dns.log, http.log, ftp.log,
  files.log; PCAP/DPI) with endpoint telemetry (Windows Event ID 4688, Sysmon Event IDs 1/3, auditd execve/connect,
  macOS osquery/unifiedlog) and network-device CLI/syslog. Layered methods include deterministic threat-intel
  joins and Sigma-style upload-tradecraft rules (curl/wget/certutil/bitsadmin/powershell/ftp -s), rare-destination
  and peer-group volume/asymmetry baselining, command-line entropy analysis, failed-then-successful egress
  profiling, MIME/extension and file-entropy mismatch detection, HTTP POST parameter modeling, encoded-DNS
  query signatures and NXDOMAIN profiling, archival-to-egress sequence correlation, and machine-learning
  classifiers (Random Forest, Isolation Forest, LSTM sequence models, autoencoders, and graph/path anomaly
  detection). Each question pairs a concrete detection approach with answer sources, a time range, and
  search pseudocode so a SOC analyst can confirm or rule out unencrypted non-C2 exfiltration across host
  and network evidence.
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any outbound connections over unencrypted protocols (HTTP/80, FTP/21, Telnet/23, SMTP/25)
    reaching an external IP, domain, FTP username, or HTTP Host header that matches a curated threat-intelligence
    feed of known exfiltration points or C2 servers — and do they exhibit upload tradecraft such as anomalous/absent
    User-Agents, FTP STOR/RETR commands, or curl/wget/certutil/bitsadmin/powershell upload invocations?
  context: 'Tactic: Exfiltration. This is the deterministic detection floor. Adversaries exfiltrating
    over cleartext protocols frequently reach infrastructure that is already cataloged in CTI, and because
    the protocols are unencrypted their payloads and control commands are observable on the wire. Join
    Zeek conn.log destination IPs (services/ports 21, 80, 23, 25) and http.log Host headers / ftp.log
    usernames against threat-intel feeds and alert on hits. FTP control commands (STOR/RETR) are cleartext
    per RFC 959 and parseable directly from ftp.log, so an external STOR is strong evidence of an upload.
    In parallel fire Sigma-style rules for upload tradecraft (curl -T/--upload-file, wget --post-file,
    certutil -urlcache, bitsadmin /transfer, powershell Net.WebClient/Invoke-WebRequest uploads, ftp -s).
    A TI hit on an unencrypted egress channel is high-confidence and warrants immediate host isolation
    and triage; a clean result raises confidence but does not exonerate, since novel infrastructure will
    not yet be in CTI.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ftp.log
  - 'NAI: Egress points of the network (e.g., firewalls, web proxies), DNS resolvers, and Network Taps
    providing traffic to Zeek sensors.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM zeek_conn, zeek_http, zeek_ftp\nWHERE service IN (\"http\",\"ftp\",\"smtp\") OR id_resp_p\
      \ IN (21,80,23,25)\n  AND (id_resp_h IN ti_feed.exfil_ip\n       OR http.host IN ti_feed.exfil_domain\n\
      \       OR ftp.user IN ti_feed.exfil_user)\n  OR ftp.command IN (\"STOR\",\"RETR\")\n  OR http.user_agent\
      \ IS NULL OR http.user_agent IN ti_feed.bad_ua\nALERT severity=high, action=isolate_host"
  - technology: SIEM/Rule pseudocode
    query: "// Sigma-style upload tradecraft on endpoint, correlated to egress\nFROM proc_create WHERE\
      \ cmdline MATCHES\n  /(bitsadmin.*\\/transfer|certutil.*-urlcache|curl.*(-T|--upload-file)|\n  \
      \  wget.*--post-file|Invoke-WebRequest.*-Method (Put|Post)|ftp\\s+-s)/i\nJOIN zeek_conn ON same_host\
      \ AND dst_port IN (21,80,25)\nALERT severity=high"
- question: Which external destinations contacted over unencrypted protocols are statistically rare for
    the environment (contacted by <1% of hosts), newly registered (domain age <30 days), or backed by
    low-reputation TLDs — and of those, which rank highest when weighted by outbound byte volume (orig_bytes)
    and connection cadence (conns/min)?
  context: 'Tactic: Exfiltration. Newly stood-up exfiltration infrastructure that is not yet in CTI still
    betrays itself statistically. Score each external destination by rarity (fraction of internal hosts
    that ever contacted it), domain age, and TLD reputation, then flag the top 5th percentile. Weight
    the score by outbound byte volume and connection frequency so that a rare destination that is also
    receiving large or high-cadence uploads rises to the top — that combination is the behavioral fingerprint
    of staged exfiltration to attacker-controlled drops, following per-domain behavioral profiling in
    Nadler et al. A high-scoring rare destination with substantial upload volume and no business justification
    is a strong lead; rare-but-benign bulk services (backups, vendor updates) are the main false positives
    and should be allowlisted.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ftp.log
  - 'NAI: Egress points of the network (e.g., firewalls, web proxies), DNS resolvers, and Network Taps
    providing traffic to Zeek sensors.'
  range: Last 90 days; baseline rarity over 30 days, evaluate over rolling 24-hour windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_conn WHERE service IN (\"http\",\"ftp\",\"smtp\")\nSTATS dc(id_orig_h) AS host_count,\
      \ sum(orig_bytes) AS up_bytes,\n      count AS conns, min(_time) AS first_seen BY id_resp_h\nEVAL\
      \ prevalence = host_count / total_hosts,\n     cadence = conns / window_minutes,\n     score = (1-prevalence)*log(up_bytes)\
      \ * cadence\nENRICH domain_age, tld_reputation\nWHERE prevalence < 0.01 AND id_resp_h NOT IN allowlist\n\
      \  AND (domain_age_days < 30 OR tld_reputation = \"low\")\nSORT score DESC | HEAD pct95"
- question: For candidate external destinations, do internal hosts show a burst of failed or blocked outbound
    connections (Zeek conn_state S0/REJ/RSTO, proxy 403/407, NXDOMAIN) immediately followed by a successful
    unencrypted transfer — exceeding the host's normal failure ratio by more than µ+3σ?
  context: 'Tactic: Exfiltration. An adversary probing for a working egress path often generates a distinct
    probing-then-exfil pattern: repeated failed or blocked attempts as they tune around firewall/proxy
    controls, then a single successful cleartext transfer once they find an open path. Track per-host
    rates of failed/blocked outbound connections against each candidate destination, baseline the host''s
    normal failure ratio, and alert when it exceeds µ+3σ — especially when the failure burst is closely
    followed by an established connection that moves bytes. This heavy-hitter information-tracking approach
    (Chhabra et al) distinguishes active exfiltration tuning from benign connectivity. A failure burst
    capped by a successful upload is high-confidence; steady low-level failures alone (misconfig, transient
    outages) are the main benign explanation.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ftp.log
  - 'NAI: Egress points of the network (e.g., firewalls, web proxies), DNS resolvers, and Network Taps
    providing traffic to Zeek sensors.'
  range: Last 90 days; evaluate over rolling 1-6 hour windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_conn, proxy_log, zeek_dns\nSTATS count(eval(conn_state IN(\"S0\",\"REJ\",\"RSTO\"\
      ) OR proxy_status IN(403,407)\n      OR dns_rcode=\"NXDOMAIN\")) AS failures,\n      count(eval(conn_state=\"\
      SF\" AND orig_bytes>0)) AS successes BY id_orig_h,id_resp_h,bin(_time,1h)\nEVAL fail_ratio = failures/(failures+successes)\n\
      WHERE fail_ratio > baseline_mean+3*baseline_std AND successes>0\nALERT severity=medium // probing-then-exfil"
- question: When a Random Forest classifier scores external destinations using Zeek DNS/HTTP features
    (name length, entropy, TLD, query type, prevalence, User-Agent, orig/resp byte ratio), which destinations
    are classified as malicious exfiltration endpoints, and what are the top-3 features driving each alert?
  context: 'Tactic: Exfiltration. Single-feature rules are evaded easily, so combine many weak signals
    with a supervised Random Forest trained on Zeek DNS/HTTP features — name length, character entropy,
    TLD, query/record type, destination prevalence, User-Agent, and the orig/resp byte ratio that captures
    upload-heavy asymmetry. Train and validate thresholds on labeled exfiltration data (CIC-Bell-DNS-EXF-2021)
    and emulated traffic (DET), then score live destinations. The alert must surface the top-3 contributing
    features (e.g., rarity, byte volume, entropy) so an analyst can reason about why the model fired.
    A high-probability classification with explanatory features is a strong investigative lead; retrain
    periodically to counter drift and reduce false positives from new legitimate services.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ftp.log
  - 'NAI: Egress points of the network (e.g., firewalls, web proxies), DNS resolvers, and Network Taps
    providing traffic to Zeek sensors.'
  range: Last 90 days; retrain monthly
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = extract(zeek_dns, zeek_http: name_len, entropy, tld,\n          query_type, prevalence,\
      \ user_agent, orig_resp_ratio)\nmodel = RandomForest.load(\"exfil_dest_rf\")  // trained on CIC-Bell-DNS-EXF-2021\
      \ + DET\nscore, contrib = model.predict_proba(features), model.explain(features)\nWHERE score >\
      \ 0.85\nALERT severity=high, detail=top3(contrib)"
- question: Do any process creation events (Windows Event ID 4688 / Sysmon Event ID 1) contain command-line
    arguments characteristic of data upload over unencrypted protocols — bitsadmin /transfer, certutil
    -urlcache/-f, curl -T/--upload-file/-d, wget --post-file, powershell UploadFile/Invoke-WebRequest
    -Method Put/Post, or ftp -s scripts — with a correlated outbound connection to ports 21/80/25 from
    the same PID?
  context: 'Tactic: Exfiltration. Many adversaries and commodity tools rely on built-in or living-off-the-land
    utilities to push data out over cleartext protocols. Regex-search process command lines for the specific
    upload argument patterns of these utilities using community Sigma rules, then confirm a correlated
    outbound connection to ports 21/80/25 originating from the same process ID. The PID-to-flow correlation
    is what separates a benign administrative download from an actual upload of data off the host. A match
    with a confirmed outbound transfer is high-confidence, especially from a privileged user''s workstation,
    a DMZ server, or a critical server; isolated command-line matches without egress may be benign tooling
    and warrant lower-priority review.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Critical servers (e.g., domain controllers, database servers), user workstations, particularly
    those of privileged users, and servers in the DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM proc_create  // EID 4688 / Sysmon EID 1\nWHERE cmdline MATCHES\n  /(bitsadmin.*\\/transfer|certutil.*(-urlcache|-f)|curl.*(-T|--upload-file|-d)|\n\
      \    wget.*--post-file|UploadFile|Invoke-WebRequest.*-Method (Put|Post)|ftp\\s+-s)/i\nJOIN net_conn\
      \ ON same_pid AND dst_port IN (21,80,25)\nALERT severity=high"
- question: Which processes are launching with command lines whose length exceeds the 99th percentile
    or whose Shannon entropy exceeds µ+3σ for that process image — indicative of inline Base64/encoded
    payloads — and how many exfil-tool invocations occur per host per hour?
  context: 'Tactic: Exfiltration. Adversaries frequently embed encoded data (Base64, hex) directly in
    command lines or pipe large encoded payloads into upload utilities, producing abnormally long, high-entropy
    command strings. Baseline command-line length and Shannon entropy per process image, then alert when
    entropy exceeds µ+3σ or length exceeds the 99th percentile for that image. Separately, count exfil-tool
    invocations per host per hour as a frequency signal — a normally rare utility firing repeatedly is
    suspicious. High-entropy, oversized command lines on a critical or privileged-user host are a strong
    lead for inline data staging; legitimate automation and installers can produce long command lines,
    so per-image baselining is essential to limit false positives.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Critical servers (e.g., domain controllers, database servers), user workstations, particularly
    those of privileged users, and servers in the DMZ.'
  range: Last 90 days; baseline per process image over 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM proc_create

      EVAL cl_len = len(cmdline), cl_entropy = shannon(cmdline)

      STATS p99(cl_len) AS len99, mean(cl_entropy) AS mu, stdev(cl_entropy) AS sd BY image

      WHERE cl_entropy > mu+3*sd OR cl_len > len99

      STATS count BY host, image, bin(_time,1h)

      ALERT severity=medium, detail=invocations_per_hour'
- question: When an exfil-utility process executes, did its network connections repeatedly fail (Sysmon
    EID 3 dropped/RST flows, HTTP 401/403/5xx) before eventually succeeding — distinguishing active exfiltration
    tuning from a benign one-off transfer?
  context: 'Tactic: Exfiltration. A single benign upload typically succeeds on the first attempt, whereas
    an adversary tuning an exfiltration channel often hits a sequence of authentication or server errors
    (401/403, 5xx) and dropped/RST connections before landing a successful transfer. Correlate exfil-utility
    process executions with the success or failure of their network connections, comparing Sysmon EID
    3 connection events against dropped/RST flows and HTTP non-2xx responses. Repeated failed upload attempts
    before a success is a distinct, high-confidence exfiltration signal. A clean single success from a
    known-good admin process is likely benign; a retry-then-succeed pattern from an unusual process warrants
    escalation.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Critical servers (e.g., domain controllers, database servers), user workstations, particularly
    those of privileged users, and servers in the DMZ.'
  range: Last 90 days; correlate within process lifetime
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM proc_create AS p\nJOIN net_conn AS n ON p.pid=n.pid  // Sysmon EID 3\nJOIN http_log AS\
      \ h ON n.uid=h.uid\nSTATS count(eval(n.state IN(\"dropped\",\"RST\") OR h.status IN(401,403,5xx)))\
      \ AS fails,\n      count(eval(h.status BETWEEN 200 AND 299)) AS oks BY p.image,p.pid\nWHERE p.image\
      \ IN exfil_tools AND fails>=3 AND oks>0\nALERT severity=high // retry-then-succeed exfil tuning"
- question: When an LSTM trained on parent-child process sequences flags unusual chains (e.g., 7z.exe
    -> curl.exe, winword.exe -> powershell.exe -> ftp.exe), which process trees are anomalous, and what
    are the top-3 anomalous edges in each?
  context: 'Tactic: Exfiltration. Exfiltration usually appears as a sequence — a document or archive tool
    spawning a network utility — rather than a single suspicious process. Train an LSTM on legitimate
    parent-child process sequences so it learns the normal grammar of process execution, then flag chains
    it scores as unlikely, such as an Office application spawning PowerShell that spawns an FTP client,
    or an archiver spawning curl. Report the top-3 anomalous edges in the alert so the analyst sees exactly
    which transitions were abnormal, consistent with online sequence/flow anomaly modeling in Kitsune
    (Mirsky et al). An anomalous chain linking data-handling tools to network egress utilities is a strong
    lead; retrain to absorb legitimate new workflows and limit false positives.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Critical servers (e.g., domain controllers, database servers), user workstations, particularly
    those of privileged users, and servers in the DMZ.'
  range: Last 90 days; retrain periodically
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seqs = build_process_sequences(proc_create: parent_image -> child_image)

      model = LSTM.load("proc_chain_seq")

      score, edges = model.score(seqs), model.attribution(seqs)

      WHERE score < likelihood_threshold  // unlikely chain

      ALERT severity=high, detail=top3(edges)

      // e.g. 7z.exe->curl.exe, winword.exe->powershell.exe->ftp.exe'
- question: Are any workstations establishing HTTP/FTP/SMTP sessions to non-corporate IPs with outbound
    volume (orig_bytes) greater than 100MB (tuned per environment, excluding allow-listed cloud/CDN services),
    or any single FTP STOR session moving more than 50MB to an external host?
  context: 'Tactic: Exfiltration. Bulk data theft over cleartext protocols produces large outbound transfers
    that stand out from typical workstation behavior. Alert on HTTP/FTP/SMTP sessions from workstations
    to non-corporate IPs where outbound bytes exceed a tuned threshold (e.g., 100MB), excluding allow-listed
    cloud/CDN/backup services, and specifically flag any single FTP STOR session moving more than 50MB
    to an external host (STOR is the cleartext FTP upload command per RFC 959). This is a deterministic
    volume rule that catches obvious large exfiltration. A large unencrypted upload from a workstation
    to an unrecognized external host is a strong lead; legitimate large transfers (cloud sync, software
    distribution) are the main false positives and must be allowlisted to keep the rule actionable.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network egress points, internal network segments containing sensitive data repositories, and
    Data Loss Prevention (DLP) systems at the network edge.'
  range: Last 90 days; evaluate per 24-hour window
  queries:
  - technology: Zeek/pseudocode
    query: "FROM zeek_conn WHERE service IN (\"http\",\"ftp\",\"smtp\")\n  AND is_workstation(id_orig_h)\
      \ AND id_resp_h NOT IN corp_space\n  AND id_resp_h NOT IN allowlist(cloud,cdn)\nWHERE orig_bytes\
      \ > 100MB\n  OR (ftp.command=\"STOR\" AND orig_bytes > 50MB)\nALERT severity=high"
- question: Which hosts have 24-hour outbound volume over an unencrypted protocol in the 99th percentile
    of their own 30-day baseline or their peer group, or an orig_bytes/resp_bytes ratio greater than 3σ
    — the volume-plus-asymmetry signature of an upload-heavy exfiltration channel?
  context: 'Tactic: Exfiltration. Fixed byte thresholds miss adversaries who tune transfer size, so baseline
    30-day outbound bytes per host and per protocol, and compare each host against both its own history
    and its peer group (e.g., other workstations in the same department). Flag hosts in the 99th percentile
    of outbound volume, and especially those whose orig_bytes/resp_bytes ratio exceeds 3σ — a high upload-to-download
    asymmetry is the defining signature of exfiltration, since normal browsing downloads far more than
    it uploads. Derive thresholds from each segment''s own distribution rather than fixed values. A host
    that is simultaneously high-volume and upload-asymmetric versus its peers is a strong lead; data-publishing
    or backup hosts should be profiled separately or allowlisted.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network egress points, internal network segments containing sensitive data repositories, and
    Data Loss Prevention (DLP) systems at the network edge.'
  range: Last 90 days; baseline 30 days, evaluate per 24-hour window
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_conn WHERE service IN ("http","ftp","smtp")

      STATS sum(orig_bytes) AS up, sum(resp_bytes) AS down BY id_orig_h,service,bin(_time,24h)

      EVAL ratio = up/(down+1)

      JOIN baseline ON id_orig_h,service  // own 30d + peer-group distribution

      WHERE up > pct99(baseline.up) OR ratio > baseline.mean_ratio+3*baseline.std_ratio

      ALERT severity=high // volume + upload asymmetry'
- question: Is any host showing a spike in blocked/aborted outbound connections (conn_state S0/REJ/RSTR,
    proxy denials) at the same time its outbound volume is rising — indicating exfiltration attempts working
    around egress controls?
  context: 'Tactic: Exfiltration. When an adversary''s bulk transfer collides with DLP, proxy, or firewall
    controls, the host generates a burst of blocked or aborted outbound connections even as the volume
    it is trying to push rises. Profile per-host rates of blocked/aborted outbound connections (Zeek conn_state
    S0/REJ/RSTR, proxy denials) and treat a spike that is concurrent with rising outbound volume as a
    distinct alerting feature — it is the signature of exfiltration attempts being partially blocked while
    the actor retries around controls. A concurrent blocked-egress spike and volume increase is high-confidence;
    isolated connection failures (network outages, misconfig) without rising volume are the main benign
    explanation.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network egress points, internal network segments containing sensitive data repositories, and
    Data Loss Prevention (DLP) systems at the network edge.'
  range: Last 90 days; evaluate over rolling hourly windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_conn, proxy_log\nSTATS count(eval(conn_state IN(\"S0\",\"REJ\",\"RSTR\") OR proxy_action=\"\
      deny\")) AS blocked,\n      sum(orig_bytes) AS up BY id_orig_h,bin(_time,1h)\nEVAL blocked_z = (blocked-baseline_mean)/baseline_std,\n\
      \     vol_rising = up > baseline_up*2\nWHERE blocked_z > 3 AND vol_rising\nALERT severity=high //\
      \ working around egress controls"
- question: When hourly outbound volume per host/protocol is forecast with Prophet or an autoencoder,
    which hosts exceed the predicted prediction interval, and what are the top-3 features (bytes, duration,
    destination rarity) driving the anomaly?
  context: 'Tactic: Exfiltration. Static baselines miss novel egress patterns, so forecast each host''s
    hourly outbound volume per protocol with a time-series model (Prophet) or model flow statistics with
    an unsupervised autoencoder and alert when observed volume exceeds the prediction interval. An autoencoder
    over flow statistics, as in Kitsune (Mirsky et al), flags novel egress via reconstruction error even
    when the absolute volume is not record-breaking. Surface the top-3 features (bytes, duration, destination
    rarity) driving the score so the analyst can validate. An out-of-interval volume spike to a rare destination
    is a strong lead; scheduled batch jobs and backups are the main false positives and should be modeled
    or excluded.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network egress points, internal network segments containing sensitive data repositories, and
    Data Loss Prevention (DLP) systems at the network edge.'
  range: Last 90 days; forecast hourly, retrain rolling
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = hourly_outbound_bytes BY host, protocol

      model = Prophet/Autoencoder.fit(series[-30d])

      pred, lo, hi = model.forecast(series)

      recon_err = autoencoder.error(flow_stats)

      WHERE observed > hi OR recon_err > threshold

      ALERT severity=medium, detail=top3(bytes,duration,dest_rarity)'
- question: Do any files transferred over unencrypted protocols show a Zeek files.log mime_type (e.g.,
    application/octet-stream) that contradicts the declared extension (.txt/.html/.csv), or do HTTP POST/PUT
    bodies contain archive/encryption magic bytes (PK, 7z, Rar!, gzip) that structurally violate the declared
    content type?
  context: 'Tactic: Exfiltration. Adversaries often disguise compressed or encrypted archives as innocuous
    file types to slip data past content controls. Alert when Zeek files.log shows a mismatch between
    detected mime_type (e.g., application/octet-stream or an archive type) and the declared extension
    (.txt, .html, .csv), and when HTTP POST/PUT bodies begin with archive/encryption magic bytes (PK for
    ZIP, 7z, Rar!, gzip). These are structural violations of the declared content type for the carrying
    protocol and cannot be explained by normal use. A MIME/extension mismatch or archive magic bytes inside
    a cleartext upload is a strong lead for obfuscated exfiltration; occasional benign mislabeling exists
    but is rare for outbound POST/PUT bodies.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network tap points capable of deep packet inspection (DPI), web proxies, and email gateways.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM zeek_files, zeek_http\nWHERE (mime_type=\"application/octet-stream\" AND extension IN\
      \ (\".txt\",\".html\",\".csv\"))\n  OR magic_bytes(http.post_body) IN (\"PK\",\"7z\",\"Rar!\",\"\
      gzip\")\nALERT severity=high // declared content-type violated"
- question: Which files transferred over unencrypted protocols have byte entropy above 7.5 for an extension
    that is normally low-entropy, and which content fails a lossless-compression test (gzip ratio ~1.0)
    indicating near-maximal information content consistent with encryption or already-compressed data?
  context: 'Tactic: Exfiltration. Encrypted or compressed exfiltration data carries near-maximal entropy
    regardless of the file''s claimed type. Baseline byte entropy per extension and flag files whose entropy
    exceeds 7.5 for extensions that are typically low-entropy (.txt, .csv, .log). Complement entropy with
    a lossless-compression test: content that fails to compress further (gzip ratio near 1.0) is already
    at high information density, matching the covert-channel capacity reasoning of Born, Gustafson, and
    Paxson. The combination is robust because entropy alone can be noisy. A high-entropy, incompressible
    file masquerading as a low-entropy type and leaving over a cleartext protocol is a strong lead; legitimately
    encrypted/compressed payloads (TLS-in-HTTP, media) should be scoped out by extension and destination.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network tap points capable of deep packet inspection (DPI), web proxies, and email gateways.'
  range: Last 90 days; baseline entropy per extension over 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_files\nEVAL ent = shannon(bytes), gz = gzip_ratio(bytes)\nSTATS mean(ent) AS mu\
      \ BY extension  // baseline low-entropy types\nWHERE ent > 7.5 AND extension IN low_entropy_types\n\
      \  AND gz > 0.95  // fails to compress -> max information\nALERT severity=high"
- question: For each web endpoint, do any HTTP POST/GET parameters exceed the per-endpoint Chebyshev length
    bound or fail the chi-square character-distribution test — flagging oversized or Base64/binary-skewed
    request bodies?
  context: 'Tactic: Exfiltration. Data smuggled inside HTTP parameters is abnormally long and skewed toward
    Base64/binary character distributions compared with a given endpoint''s legitimate parameters. Build
    per-endpoint profiles of POST/GET parameter length (using a Chebyshev bound) and character distribution
    (using a chi-square test against the learned legitimate distribution), then flag parameters that are
