name: 'T1021.002: SMB-Windows Admin Shares'
id: 206cba47-5da2-48bd-a3b9-b22ecd7a38ee
description: Investigate lateral movement performed over SMB using Windows administrative shares (C$,
  ADMIN$, IPC$). This playbook helps an analyst hunt for adversaries who authenticate to a remote host
  with valid or stolen credentials, write a payload to an admin share, and then execute it remotely via
  service creation, scheduled tasks, WMI, or named-pipe tooling such as PsExec. It correlates Type 3 network
  logons with 5145 admin-share access, SMB file writes, and destination-side process or service execution
  to surface the complete write-to-execute chain. It also profiles structurally suspicious transferred
  payloads, first-seen and short-lived remote services, rapid multi-target propagation and trial-and-error
  denied access, rare user/source/destination/share access triplets, and applies interpretable ML and
  temporal-graph ranking on top of deterministic rules to prioritize the highest-confidence lateral-movement
  leads while keeping false positives manageable.
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a remote network logon (Logon Type 3) lead within ten minutes to access of the ADMIN$
    or C$ share, an SMB file write, and then execution of that same file on the destination host?
  context: 'This is the canonical SMB admin-share lateral-movement pattern: an adversary authenticates
    over the network, drops a payload onto an administrative share, and runs it remotely. The symbolic
    rule chains Event 4624 LogonType 3 to a 5145 access of ADMIN$/C$, an SMB write/extract, and destination-side
    execution (4688 or Sysmon 1) of the same relative target name or path. Treat as high confidence when
    the written file has an executable or script extension, lands in C:\Windows, %WINDIR%\Temp, or %TEMP%,
    or originates from a workstation. Preserve source IP, account, share, relative target name, file hash,
    and executed image in the alert, and triage immediately against software-distribution allowlists and
    approved change windows. A true positive means an operator is staging and running tooling over admin
    shares; a benign match is usually SCCM/EDR/backup deployment within a change window.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 5140
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek files.log
  - Zeek notice.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Domain Controllers, File Servers, Database Servers, Developer Workstations, Executive Laptops'
  range: Last 90 days, anchored on the 4624 LogonType 3 session and correlating events within a 10-minute
    window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  logon = FILTER Event4624 BY logon_type=3\n  share = FILTER Event5145 BY share IN ['ADMIN$','C$']\
      \ AND access='WriteData'\n  write = FILTER (Sysmon11 OR ZeekSmbFiles) BY action='create/extract'\n\
      \  exec  = FILTER (Event4688 OR Sysmon1) BY image_path = write.target_path\n  ALERT WHERE logon.account=share.account=exec.account\n\
      \    AND exec.time - logon.time <= 10m\n    AND (write.ext IN ['exe','dll','ps1','bat','scr'] OR\
      \ write.path MATCHES 'C:\\\\Windows|Temp')"
  - technology: Zeek/pseudocode
    query: ">-\n  # smb_files.log writes to admin share followed by exec evidence\n  FILTER smb_files\
      \ WHERE name MATCHES 'ADMIN\\\\$|C\\\\$' AND action='SMB::FILE_WRITE'\n  JOIN files.log ON fuid\
      \ -> capture mime_type, extracted name\n  RAISE notice WHEN extension in {exe,dll,ps1,bat} within\
      \ 10m of an SMB session"
- question: Among executables and scripts written to admin shares, which ones are structurally rare and
    first-seen for the account or destination, and was execution observed shortly afterward?
  context: Entropy alone is not enough to flag malicious payloads. Build a 30-day baseline of file size,
    signer prevalence, entropy, PE section/import sparsity, and destination path per environment, then
    alert when an admin-share write is BOTH structurally rare and first-seen for that account or destination
    host. Raise severity when execution follows within ten minutes. Values above the 99th percentile of
    the per-environment baseline are the starting trigger; tune software-deployment hosts separately because
    legitimate installers can also be large or oddly structured. A positive result indicates a novel,
    unsigned, or anomalously packed binary being introduced via SMB — a strong lateral-tool-transfer signal.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 5140
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek files.log
  - Zeek notice.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Domain Controllers, File Servers, Database Servers, Developer Workstations, Executive Laptops'
  range: Last 90 days for detection; 30-day rolling baseline for structural and first-seen statistics.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  BASELINE over 30d PER environment: file_size, signer_prevalence, entropy, section_sparsity,\
      \ import_sparsity\n  writes = FILTER smb_admin_writes BY ext IN ['exe','dll','ps1','bat','scr']\n\
      \  score = structural_rarity(writes, baseline)  # percentile rank\n  firstseen = NOT EXISTS (writes.hash,\
      \ account) IN history\n  ALERT WHERE score > p99 AND firstseen\n    SET severity=high WHERE exec_follows_within\
      \ 10m"
- question: After the deterministic SMB write-to-execute chain fires, how does an interpretable ML ranker
    prioritize the event, and which features drive the score?
  context: Use a supervised or semi-supervised ranker ONLY as a second stage after the symbolic write-to-exec
    chain has already fired — never to replace the deterministic rule. Recommended features include share
    type, AccessMask, file structure metrics, source and destination role, first-seen triplet, fan-out
    count, write-to-exec latency, signer status, and fail-to-success ratio. Favor interpretable tree models
    (e.g., gradient-boosted trees) and require the alert to print the top contributing features so analysts
    can reason about it. If the model drifts, keep the deterministic rule enabled. Validate against LANL
    Comprehensive Cyber-Security Events, OTRF Security-Datasets, and Atomic Red Team T1021.002. This stage
    helps rank a noisy queue of fired chains so analysts work the most suspicious first.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 5140
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek files.log
  - Zeek notice.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Domain Controllers, File Servers, Database Servers, Developer Workstations, Executive Laptops'
  range: Last 90 days; retrain/validate the ranker on a rolling basis and run only on sessions where the
    symbolic chain fired.
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  candidates = chains_that_fired(symbolic_write_to_exec)\n  features = [share_type, access_mask,\
      \ struct_metrics, src_role, dst_role,\n             first_seen_triplet, fan_out, write_to_exec_latency,\
      \ signer_status, fail_success_ratio]\n  model = GradientBoostedTrees(interpretable=True)\n  score,\
      \ top_feats = model.rank(candidates, features)\n  EMIT alert WITH score, top_feats  # do not disable\
      \ symbolic rule on drift"
- question: Is a single account or source host rapidly writing executables to many distinct admin-share
    destinations, or generating many denied share-access attempts before succeeding?
  context: Track per-account and per-source-host counts of distinct admin-share destinations receiving
    executable writes in 15-minute windows, and maintain separate successful and denied 5145 rates. As
    an initial floor, alert on more than 3 distinct destinations from a workstation or more than 10 from
    an admin/service host, or when denied writes exceed 5 before a success. Then refine using 95th/99th
    percentile thresholds from 30-90 day history. This catches both noisy worm-like propagation (one source
    hitting many targets) and trial-and-error share access (repeated denials then a success), both hallmarks
    of automated or hands-on-keyboard lateral movement that a single-event rule would miss.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 5140
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek files.log
  - Zeek notice.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Domain Controllers, File Servers, Database Servers, Developer Workstations, Executive Laptops'
  range: Last 90 days; sliding 15-minute windows for fan-out counting with 30-90 day percentile baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  WINDOW 15m PER account, src_host:\n    distinct_dst = COUNT_DISTINCT(dst WHERE Event5145\
      \ success AND ext IN exec_types)\n    denied = COUNT(Event5145 fail)\n    success = COUNT(Event5145\
      \ success)\n  ALERT WHERE (src_is_workstation AND distinct_dst > 3)\n           OR (src_is_admin_or_service\
      \ AND distinct_dst > 10)\n           OR (denied > 5 AND denied precedes success)\n  REFINE thresholds\
      \ WITH p95/p99 over 30-90d"
- question: Did an inbound SMB network logon precede an ADMIN$/IPC$ activity, a new service installation
    (Event 7045), and execution of that service binary — and did the service stop or delete itself shortly
    after?
  context: This detects the classic PsExec-style remote service execution over admin shares. The symbolic
    rule fires when a LogonType 3 session is followed by ADMIN$/IPC$ activity, a 7045 service installation,
    and process creation of the installed service binary or its child under services.exe. Raise to critical
    if a 7036 event shows the new service stopping or deleting within ten minutes — a strong sign of disposable
    tooling. Include source IP, account, service name, service file path, and related IPC$ object names
    in the alert. A positive indicates remote code execution via service control over SMB; benign matches
    are typically legitimate remote management tools that should be allowlisted by service name and path.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4672
  - Windows Event ID 5140
  - Windows Event ID 5145
  - Windows Event ID 7036
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 17
  - Sysmon Event ID 18
  - 'NAI: Domain Controllers, File Servers, Critical Application Servers, Privileged User Workstations'
  range: Last 90 days, correlating service install and IPC$ follow-on within a 10-minute window of the
    logon.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  logon = FILTER Event4624 BY logon_type=3\n  ipc   = FILTER Event5145 BY share IN ['ADMIN$','IPC$']\n\
      \  svc   = FILTER Event7045\n  proc  = FILTER (Sysmon1 OR Event4688) BY (image=svc.service_file\
      \ OR parent='services.exe')\n  ALERT WHERE logon.account=ipc.account AND time_window(logon,svc)\
      \ <= 10m\n  SET severity=critical WHERE EXISTS Event7036(svc.service_name, state IN ['stopped','deleted'])\
      \ within 10m"
- question: Is a newly installed remote service first-seen, short-lived, or accompanied by a recent SMB
    binary write and a burst of named-pipe/IPC$ activity?
  context: 'Baseline remote-service sessions over 30 days using service name, service file path, service
    lifetime, named-pipe count, and IPC$ object count. Alert when a 7045 install is first-seen AND any
    of: the binary was written by SMB in the prior ten minutes, service lifetime is under ten minutes,
    more than 2 named-pipe create/connect events (Sysmon 17/18) or IPC$ child objects occur within 2 minutes,
    or the service file path is first-seen on that host. Tune separately for SCCM, backup, EDR, and software-distribution
    tooling, which legitimately install services. These statistical traits separate adversary tooling
    (transient, novel, pipe-heavy) from durable, known services.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4672
  - Windows Event ID 5140
  - Windows Event ID 5145
  - Windows Event ID 7036
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 17
  - Sysmon Event ID 18
  - 'NAI: Domain Controllers, File Servers, Critical Application Servers, Privileged User Workstations'
  range: Last 90 days for detection; 30-day rolling baseline for service-name/path/lifetime and pipe statistics.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  BASELINE 30d: service_name, service_file_path, service_lifetime, pipe_count, ipc_obj_count\n\
      \  svc = FILTER Event7045\n  ALERT WHERE first_seen(svc.name OR svc.file_path on host)\n    AND\
      \ ( smb_write(svc.file_path) within prior 10m\n       OR svc.lifetime < 10m\n       OR COUNT(Sysmon17/18\
      \ OR ipc_child) > 2 within 2m\n       OR first_seen(svc.file_path on host) )\n  EXEMPT known {SCCM,\
      \ backup, EDR, swdist}"
- question: Which remote service-and-pipe contexts stand out as outliers when ranked by an unsupervised
    or graph-based model running alongside the deterministic service detector?
  context: 'Run an unsupervised outlier model or graph-based ranker over service-and-pipe contexts in
    PARALLEL with the symbolic detector, never as a replacement. Useful features: source and destination
    role, user rarity, preceding SMB write, service start type, service lifetime, named-pipe count, IPC$
    object count, and historical prevalence of the service file path. Emit the top contributing features
    or the neighboring anomalous path in the alert so analysts can triage the why, not just a score. This
    surfaces subtle remote-execution that individually passes the deterministic floor but is collectively
    anomalous (e.g., a known-named service running from an unusual path with rare user/host pairing).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4672
  - Windows Event ID 5140
  - Windows Event ID 5145
  - Windows Event ID 7036
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 17
  - Sysmon Event ID 18
  - 'NAI: Domain Controllers, File Servers, Critical Application Servers, Privileged User Workstations'
  range: Last 90 days; refresh the model on a rolling basis and correlate with the deterministic detector's
    output.
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  ctx = service_pipe_contexts(window=session)\n  features = [src_role, dst_role, user_rarity,\
      \ preceding_smb_write,\n             start_type, service_lifetime, pipe_count, ipc_obj_count, path_prevalence]\n\
      \  model = IsolationForest() OR GraphRanker()\n  anomalies = model.rank(ctx, features)\n  EMIT alert\
      \ WITH top_features, neighbor_anomalous_path  # parallel to symbolic rule"
- question: Was a default admin share accessed in a workstation-to-workstation pattern, by a non-admin
    or rarely-admin account, or immediately after explicit-credential use (Event 4648)?
  context: Successful admin-share access that breaks normal administrative topology is suspicious. Alert
    when source and destination are both workstations (workstations rarely administer each other), when
    a non-admin or rarely-admin account touches C$, ADMIN$, or IPC$, or when Event 4648 explicit credentials
    immediately precede the access (a pass-the-hash / runas pivot signal). Raise severity if denied 5145
    events occur immediately beforehand, or if the source host has not historically administered the destination.
    A positive result is consistent with an operator hopping laterally with stolen or escalated credentials
    rather than legitimate IT administration flowing from known management hosts.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Windows Event ID 5140
  - Windows Event ID 5145
  - Zeek conn.log
  - 'NAI: All Windows Servers, All Windows Workstations, Network East-West traffic monitoring points,
    VPN Concentrators'
  range: Last 90 days, with 60-90 day history for who normally administers each destination.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  access = FILTER Event5145 BY share IN ['C$','ADMIN$','IPC$'] AND status='success'\n\
      \  ALERT WHERE (src_type='workstation' AND dst_type='workstation')\n           OR account NOT IN\
      \ admin_role OR account.admin_rarity_high\n           OR EXISTS Event4648(same session) immediately_before\
      \ access\n  RAISE severity WHERE denied_5145 immediately_before\n           OR NOT historically_administers(src_host,\
      \ dst_host)"
- question: Is this admin-share access a first-seen or long-dormant (user, source, destination, share)
    combination, and is it accompanied by high fan-out or a high fail-to-success ratio?
  context: Maintain separate 60-90 day baselines for (user, source_host, destination_host, share_name)
    and (user, destination_host) admin-share access. Alert on first-seen or long-dormant triplets/tuples,
    then increase severity when the same source reaches more than 3 distinct destinations in 15 minutes
    from a workstation or more than 10 from an admin host, or when the session's fail-to-success ratio
    exceeds 0.25. Exempt approved software-distribution and management infrastructure. New or reawakened
    access edges combined with fan-out or repeated failures are classic lateral-traversal indicators,
    distinguishing exploratory adversary movement from stable, recurring administrative relationships.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Windows Event ID 5140
  - Windows Event ID 5145
  - Zeek conn.log
  - 'NAI: All Windows Servers, All Windows Workstations, Network East-West traffic monitoring points,
    VPN Concentrators'
  range: Last 90 days for detection; 60-90 day rolling baselines for triplet/tuple rarity and fan-out.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  BASELINE 60-90d: edge=(user,src,dst,share) AND (user,dst)\n  access = FILTER Event5145\
      \ success on admin shares\n  ALERT WHERE first_seen(edge) OR dormant(edge, >60d)\n  RAISE WHERE\
      \ (src=workstation AND distinct_dst_15m > 3)\n           OR (src=admin AND distinct_dst_15m > 10)\n\
      \           OR fail_success_ratio > 0.25\n  EXEMPT approved_swdist, mgmt_infra"
- question: Which new admin-share access edges does a temporal-graph link-prediction model flag as anomalous,
    and do those flags co-occur with deterministic rarity or fan-out rules?
  context: Construct a temporal graph whose edges are admin-share access events enriched with host role,
    account role, share type, hour of day, and success/failure label. Use temporal link prediction or
    an inductive temporal GNN to rank new edges, but only surface events where the model anomaly CO-OCCURS
    with deterministic rarity or fan-out rules — this avoids drowning analysts in pure model noise. Emit
    the anomalous edge, its prior neighborhood, and the top contributing features rather than only a score,
    so an analyst can validate the predicted-improbable connection. This catches structurally novel lateral
    paths that simple per-edge baselines miss while keeping precision high.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Windows Event ID 5140
  - Windows Event ID 5145
  - Zeek conn.log
  - 'NAI: All Windows Servers, All Windows Workstations, Network East-West traffic monitoring points,
    VPN Concentrators'
  range: Last 90 days; build the temporal graph over a rolling 60-90 day horizon and gate alerts on deterministic
    co-occurrence.
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  G = temporal_graph(edges=admin_share_access,\n        attrs=[host_role, account_role,\
      \ share_type, hour, success_flag])\n  model = TemporalLinkPrediction() OR InductiveTemporalGNN()\n\
      \  ranked = model.score_new_edges(G)\n  EMIT alert WHERE ranked.anomalous AND co_occurs(deterministic_rarity\
      \ OR fan_out)\n    WITH anomalous_edge, prior_neighborhood, top_features"
- question: Does a finite-state detector observe the complete SMB lateral-movement chain — network logon,
    admin-share write, file create/extract, execution or service install, and optional service stop/delete
    — under one consistent operator context?
  context: 'Implement a finite-state detector for: 4624(LogonType=3) -> 5145 admin-share write -> file
    create/extract -> 4688 or Sysmon 1 execution, OR 7045 service install -> optional 7036 stop/delete.
    Require the SAME account, source IP, and destination path or service-binary linkage across all events,
    and score as critical when the chain completes within 15 minutes. The alert should include exact timestamps,
    source and destination hosts, share name, relative target name, executed image, service name, and
    whether prior failures occurred. A completed chain is among the highest-fidelity evidence of hands-on
    SMB lateral movement and warrants immediate containment of the involved account and hosts.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Windows Event ID 5145
  - Windows Event ID 7036
  - Windows Event ID 7045
  - Zeek smb_files.log
  - Zeek notice.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Internal network segments, East-West traffic monitoring points, Domain Controllers, Critical
    Servers'
  range: Last 90 days, requiring chain completion within a 15-minute correlation window under one operator
    context.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  FSM states:\n    S0 -> Event4624(logon_type=3)\n    S1 -> Event5145(admin share, write)\n\
      \    S2 -> (Sysmon11 OR ZeekSmbFiles) create/extract\n    S3 -> (Event4688 OR Sysmon1) exec  OR\
      \  Event7045 install\n    S4 -> optional Event7036 stop/delete\n  REQUIRE same account AND src_ip\
      \ AND (dst_path OR service_binary) linkage\n  ALERT severity=critical WHERE S0..S3 complete within\
      \ 15m\n  EMIT timestamps, hosts, share, target_name, image, service_name, prior_failures"
- question: What is the additive sequence score for an admin-share session, combining first-seen edges,
    executable writes, workstation-to-workstation movement, service install, low write-to-exec latency,
    prior denials, and short service lifetime?
  context: 'Layer additive sequence scoring on top of the finite-state detector: +25 first-seen (user,
    source, destination, share) edge, +20 executable or script write, +15 workstation-to-workstation movement,
    +15 Event 7045 or child process under services.exe, +10 write-to-exec latency of 10 minutes or less,
    +10 prior denied 5145 access, and +10 short service lifetime of 10 minutes or less. Start with an
    alert threshold of 40 and tune weekly to stay within the analyst budget. Never suppress the deterministic
    critical chain even if the scoring model drifts. This graduated score lets partial or ambiguous chains
    escalate proportionally to how many adversary-like traits they exhibit.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Windows Event ID 5145
  - Windows Event ID 7036
  - Windows Event ID 7045
  - Zeek smb_files.log
  - Zeek notice.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Internal network segments, East-West traffic monitoring points, Domain Controllers, Critical
    Servers'
  range: Last 90 days; tune weights and the threshold weekly against analyst alert budget.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  score = 0\n  score += 25 IF first_seen(user,src,dst,share)\n  score += 20 IF write.ext\
      \ IN ['exe','dll','ps1','bat','scr']\n  score += 15 IF src=workstation AND dst=workstation\n  score\
      \ += 15 IF Event7045 OR parent='services.exe'\n  score += 10 IF write_to_exec_latency <= 10m\n \
      \ score += 10 IF prior_denied_5145\n  score += 10 IF service_lifetime <= 10m\n  ALERT WHERE score\
      \ >= 40   # never suppress deterministic critical chain"
- question: For ambiguous admin-share sessions, how does a sequence-aware ML model (self-supervised sequence
    model or temporal GNN) rank them, and what sequence contributors or subgraph neighbors explain the
    ranking?
  context: Apply a self-supervised sequence model or temporal GNN ONLY to sessions that already contain
    admin-share activity, using event tokens such as share type, access mask, file type, service install,
    process parent, IPC$ object count, fan-out, and failure markers. Use the model to RANK ambiguous sequences,
    not to replace the rule chain, and require the alert to show the top sequence contributors or the
    anomalous subgraph neighbors for triage. This helps analysts prioritize chains that are individually
    defensible but collectively unusual — for example, a benign-looking service install whose surrounding
    token sequence resembles known lateral-movement tradecraft.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Windows Event ID 5145
  - Windows Event ID 7036
  - Windows Event ID 7045
  - Zeek smb_files.log
  - Zeek notice.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Internal network segments, East-West traffic monitoring points, Domain Controllers, Critical
    Servers'
  range: Last 90 days; run the sequence model only on sessions containing admin-share activity and refresh
    it on a rolling basis.
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  sessions = sessions_with(admin_share_activity)\n  tokens = [share_type, access_mask,\
      \ file_type, service_install,\n            process_parent, ipc_obj_count, fan_out, failure_markers]\n\
      \  model = SelfSupervisedSeqModel() OR TemporalGNN()\n  ranked = model.rank(sessions, tokens)\n\
      \  EMIT alert WITH top_sequence_contributors, anomalous_subgraph_neighbors  # ranks, not replaces,\
      \ rule chain"
