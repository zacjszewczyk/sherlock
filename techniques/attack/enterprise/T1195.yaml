  - technology: SIEM/Rule pseudocode
    query: '# Update process TI destination match

      source IN [Windows Event ID 4688, Sysmon Event ID 1, Zeek conn.log, Zeek dns.log, Zeek software.log,
      Zeek ssl.log]

      | WHERE matches_action_criteria("Update process TI destination match")

      // Correlate process creation (Windows Event ID 4688 / Sysmon Event ID 1) with outbound connections
      in Zeek conn.log within

      | ALERT enrich(host, user, installer, updater, child_proc, binary, signer, dest)'
  - technology: Zeek/pseudocode
    query: '# Supply-chain first-run egress correlation

      conn.log, dns.log, ssl.log, software.log

      | JOIN recent install/update host+process to outbound flows on (id.orig_h, time-window)

      | AGG orig:resp byte ratio, dest rarity, TI/JA3 match, NXDOMAIN/S0/REJ per (id.orig_h)

      | flag first-seen/rare/TI-matched egress from update-spawned processes per action criteria'
