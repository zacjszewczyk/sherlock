questions:
- question: '[Initial Access] Update process TI destination match: Can you determine whether a recently
    installed or updated software component launches a child process that quickly initiates outbound communication
    to infrastructure associated with malware or supply-chain intrusion activity, indicating potential
    compromise of trusted update content. -- specifically, using the ''Update process TI destination match''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary subverts a trusted
    software supply chain so that legitimate-looking installers, updaters, and dependencies deliver attacker-controlled
    content, giving them an initial foothold that inherits the trust of the compromised vendor or package.
    This evidence focuses on the condition that a recently installed or updated software component launches
    a child process that quickly initiates outbound communication to infrastructure associated with malware
    or supply-chain intrusion activity, indicating potential compromise of trusted update content. This
    Symbolic Logic approach looks for the following signal: Correlate process creation (Windows Event
    ID 4688 / Sysmon Event ID 1) with outbound connections in Zeek conn.log within 5 minutes of a recent
    install/update (Zeek software.log or deployment logs). Resolve FQDNs via Zeek dns.log and alert on
    TI-matched destinations. Most malicious package payloads fetch a remote second stage at/after install,
    making first-run egress a reliable trigger ([Backstabber''s Knife Collection, Ohm et al.](https://arxiv.org/abs/2005.09535)).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests that a recently
    installed or updated component is behaving in a way inconsistent with sanctioned vendor update infrastructure
    and benign install behavior, consistent with a tampered package or update channel; pivot to the responsible
    installer/updater, the newly written binaries and their signer/provenance, the process lineage, the
    user and host context, and any subsequent egress, reconnaissance, or persistence. A negative result
    helps rule out this supply-chain vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, second-order, or slow-burn supply-chain intrusions.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - Zeek software.log
  - Zeek ssl.log
