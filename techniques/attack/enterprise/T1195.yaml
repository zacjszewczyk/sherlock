name: 'T1195: Supply Chain Compromise'
id: d7e4af1c-e03a-46c3-88b7-7c3b93fd23af
description: 'This playbook helps an analyst investigate whether an adversary gained initial access by
  compromising the software supply chain (T1195) — manipulating development tools, source code, open-source
  dependencies, build/CI-CD pipelines, or software update/distribution mechanisms so that trusted installers
  and updaters deliver tampered or malicious content. It is built for the Initial Access tactic and guides
  a behavioral hunt across the package/update tamper -> install -> first-run chain on Windows, Linux,
  macOS, and SaaS. The questions cover: recently installed or updated components that spawn child processes
  and quickly beacon out to malware/supply-chain infrastructure; newly written or replaced binaries carrying
  unsigned, revoked, expired, unknown-CA, or hash-vs-signature-mismatched Authenticode metadata or provenance
  that does not match the approved source/builder; update processes (updater.exe, setup.exe, package managers,
  apt/dpkg, pkg/installd) spawning script interpreters or interactive shells; post-update network anomalies
  such as fixed-interval/jittered beaconing, protocol-port mismatch (DNS off 53, TLS off 443), elevated
  outbound:inbound byte ratios, and bursts of connection/DNS resolution failures to rotating dead-drop
  infrastructure; and updater-spawned processes performing host/network reconnaissance, LSASS memory access,
  or establishing persistence via new services, scheduled tasks, or registry run keys. Detection methods
  combine symbolic-logic rules, statistical baselining (prevalence, rarity, percentile, entropy, periodicity,
  failure-rate, and byte-volume deviation), and machine-learning models (DGA classifiers, supply-chain
  behavior ensembles, Isolation Forest/One-Class SVM, LSTM/transformer/CT-HMM beacon models, and temporal
  provenance-graph GNNs) applied to Windows Security/Sysmon events, CodeIntegrity logs, auditd/journald
  package events, macOS unified/EndpointSecurity/osquery logs, and Zeek conn/dns/ssl/software telemetry,
  so the analyst can corroborate suspected supply-chain compromise against installer provenance, signer
  trust, process lineage, and egress context.'
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
