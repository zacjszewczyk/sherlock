- question: '[Discovery] Rare hypervisor path: Can you determine whether a network connection is established
    from an internal source IP address present on a threat intelligence watchlist to a known hypervisor
    management interface (e.g., ports 443, 902, 5988, 5989). -- specifically, using the ''Rare hypervisor
    path'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary enumerates running virtual
    machines after gaining access to a host, hypervisor, or virtualization management plane in order to
    inventory targets and shape destructive or disruptive follow-on actions such as Service Stop (T1489)
    and Data Encrypted for Impact (T1486). This evidence focuses on the condition that a network connection
    is established from an internal source IP address present on a threat intelligence watchlist to a
    known hypervisor management interface (e.g., ports 443, 902, 5988, 5989). This Statistical Method
    approach works as follows: For each (source IP -> hypervisor management interface) pair, compute rarity
    against a 30-day baseline of conn.log. Alert if the pair falls below the 5th percentile of historical
    frequency OR is previously unseen. Add volume/state features per [Lakhina et al.](https://conferences.sigcomm.org/sigcomm/2005/paper-LakCro.pdf):
    track per-source destination-IP/port entropy and the ratio of failed (S0/REJ/RSTO conn_state) to successful
    (SF) connections, alerting when failed-ratio exceeds 0.5 with >5 attempts. Surface the contributing
    feature (unseen pair, entropy spike, or failure ratio) in the alert. A positive result -- a watchlist/rule
    match, a statistical outlier, or a model alert -- indicates probable Virtual Machine Discovery; pivot
    to the responsible process and its parent lineage, the acting user account and its authorization,
    the source host and whether it is an approved management station, the targeted hypervisor/management
    interface, and any follow-on VM control actions (power off, snapshot, encryption) to scope intent
    and impact. A negative result helps rule out this particular discovery vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, GUI-driven, or
    living-off-the-land enumeration.'
