name: 'T1673: Virtual Machine Discovery'
id: bbd2eeef-bef6-4944-925d-738583352b45
description: 'This playbook helps an analyst investigate whether an adversary is attempting to enumerate
  running virtual machines (VMs) after gaining access to a host, hypervisor, or virtualization management
  plane (MITRE ATT&CK T1673, Virtual Machine Discovery). Adversaries enumerate VMs to shape follow-on
  actions such as Service Stop (T1489) or Data Encrypted for Impact (T1486), often by running Hypervisor
  CLI commands (e.g., `esxcli vm process list`, `vim-cmd vmsvc/getallvms`, `Get-VM`, `VBoxManage list`,
  `virsh list --all`, `qm list`, `prlctl list`) or by driving a management GUI/API such as VMware vCenter
  or SCVMM. The hunt spans ESXi, Linux, macOS, and Windows hosts plus the management network, and pursues
  the behavior from several complementary angles: network connections from watchlisted internal hosts
  to hypervisor management interfaces; process-creation events containing VM-discovery command lines;
  network sweeps across hypervisor VLANs; misuse of legitimate management tooling by unauthorized users,
  hosts, or at anomalous times; and brute-force/post-authentication sequences that culminate in VM enumeration.
  Detection methods combine deterministic symbolic-logic rules (threat-intel watchlists, command-line
  pattern matching, allow-lists, stateful sweep and failed-login correlation), statistical baselining
  (rarity scoring, destination-diversity and entropy analysis, command-frequency and timing baselines,
  login risk scoring), and machine learning (Isolation Forest/One-Class SVM connection and command anomaly
  detection, command-classification models, sequence/log models such as DeepLog/LogBERT, TRW scan detection,
  and HMM/LSTM action-sequence modeling), applied across Zeek conn.log/http.log, Windows Security events
  (4624/4625/4688), Sysmon, Linux auditd, and ESXi shell/hostd/vobd logs, so the analyst can corroborate
  suspected VM discovery against process lineage, user identity, source host, network behavior, and authentication
  context.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
