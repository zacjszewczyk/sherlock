questions:
- question: '[Discovery] TI hypervisor connection: Can you determine whether a network connection is established
    from an internal source IP address present on a threat intelligence watchlist to a known hypervisor
    management interface (e.g., ports 443, 902, 5988, 5989). -- specifically, using the ''TI hypervisor
    connection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary enumerates running virtual
    machines after gaining access to a host, hypervisor, or virtualization management plane in order to
    inventory targets and shape destructive or disruptive follow-on actions such as Service Stop (T1489)
    and Data Encrypted for Impact (T1486). This evidence focuses on the condition that a network connection
    is established from an internal source IP address present on a threat intelligence watchlist to a
    known hypervisor management interface (e.g., ports 443, 902, 5988, 5989). This Symbolic Logic approach
    works as follows: Continuously join an internal watchlist of malicious/suspect IP addresses with Zeek
    conn.log records where id.resp_h is a known hypervisor/management host and id.resp_p is a management
    port (443, 902, 5988, 5989; add 22 for ESXi SSH and 80/9080 for vSphere API). Alert on any match.
    Maintain the watchlist from first-party sources (prior incidents, blocked-connection logs) so the
    rule works without mandatory external API lookups, consistent with first-party network ATT&CK analytics
    in [BZAR](https://github.com/mitre-attack/bzar). A positive result -- a watchlist/rule match, a statistical
    outlier, or a model alert -- indicates probable Virtual Machine Discovery; pivot to the responsible
    process and its parent lineage, the acting user account and its authorization, the source host and
    whether it is an approved management station, the targeted hypervisor/management interface, and any
    follow-on VM control actions (power off, snapshot, encryption) to scope intent and impact. A negative
    result helps rule out this particular discovery vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, GUI-driven, or living-off-the-land enumeration.'
