questions:
- question: '[Resource Development] Match DNS queries against CTI (Symbolic Logic): Can you determine
    whether an internal host sends a DNS query where the queried domain, or the IP address in the DNS
    answer, matches an entry on a high-confidence threat intelligence feed of known malicious infrastructure.
    -- specifically, using the ''Match DNS queries against CTI'' approach that applies Symbolic Logic?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary stands up
    and operates its own DNS server infrastructure to support operations -- typically as the server side
    of a DNS C2 channel, to serve conditional responses to malware, or to host DGA/tunneling rendezvous
    points. Much of the build-out is invisible to the victim, so detection relies on the in-network artifacts
    adversary-run DNS produces. This evidence focuses on the condition that an internal host sends a DNS
    query where the queried domain, or the IP address in the DNS answer, matches an entry on a high-confidence
    threat intelligence feed of known malicious infrastructure. The ''Match DNS queries against CTI''
    method applies Symbolic Logic as follows: Match Zeek dns.log query names and answer IPs against high-confidence
    malicious DNS-infrastructure feeds (and authoritative-server NS records) in real time, alerting on
    any hit; deploy as SIEM-agnostic rules so they compile to Splunk/Elastic/Sentinel over first-party
    logs [SigmaHQ](https://github.com/SigmaHQ/sigma). A positive result -- a rule match, statistical outlier,
    or model alert -- is consistent with adversary-controlled DNS infrastructure: pivot to the querying
    host(s), the domain and its registration age/WHOIS, the resolved IP/AS and its fan-out, the answer
    TTL and resolution state, the invoking process (Event ID 4688) and confirming connection (Event ID
    5156), and any follow-on C2 or exfiltration behavior. A negative result helps rule out this particular
    detection angle but should be corroborated with the other questions in this playbook, since adversary
    DNS infrastructure is built to evade single signals and may surface only across multiple methods.'
  answer_sources:
  - Zeek dns.log
  - Windows Event ID 260
  - 'NAI: Network Egress Points, Enterprise DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Symbolic-logic detection for adversary-run DNS infrastructure\n\ndns  = Zeek:dns.log\n\n\
      win  = WinEventLog (260 analytic / 4688 process / 5156 connection)\n\nALERT WHEN dns.query OR dns.answer\
      \ MATCHES <condition>\n  CORRELATE WITH win ON (host, time)\n  OUTPUT host, query, answer_ip, ttl,\
      \ process, severity\n// Deploy SIEM-agnostic (Sigma) over first-party logs"
- question: '[Resource Development] Escalate low-prevalence IOC hits (Statistical Method): Can you determine
    whether an internal host sends a DNS query where the queried domain, or the IP address in the DNS
    answer, matches an entry on a high-confidence threat intelligence feed of known malicious infrastructure.
    -- specifically, using the ''Escalate low-prevalence IOC hits'' approach that applies Statistical
    Method?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary stands up
    and operates its own DNS server infrastructure to support operations -- typically as the server side
