name: 'T1583.002: DNS Server'
id: da05f2ed-3bbc-490f-9fdd-16e08fd06c1e
description: 'This playbook helps an analyst investigate evidence that an adversary has stood up and is
  operating its own Domain Name System (DNS) server infrastructure to support targeting -- most often
  as the server side of a DNS-based command-and-control (C2) channel, conditional DNS responses to malware,
  DNS tunneling, or domain-generation-algorithm (DGA) rendezvous. Because the build-out itself happens
  outside the victim''s visibility, detection focuses on the in-network artifacts that adversary-run DNS
  produces: internal hosts resolving domains or IPs that match high-confidence threat intelligence; lookups
  for typosquatted or homoglyph variants of corporate/partner/brand domains tied to a specific process
  (Windows Event ID 4688); first-in-fleet resolutions of newly registered, low-TTL domains confirmed by
  connections (Windows Event ID 5156); multiple young domains collapsing onto a single IP or /24 (disposable/fast-flux
  infrastructure); and anomalous failed-lookup (NXDOMAIN/SERVFAIL) bursts, high-entropy query names, oversized
  labels, and regular high-volume TXT/NULL subdomain queries that signal DGA beaconing or DNS tunneling
  against a non-corporate authoritative server. Detection methods combine symbolic-logic rules, statistical
  baselining/outlier scoring, and machine-learning models applied to Zeek dns.log and conn.log, Windows
  DNS analytic/audit events (260, 4688, 5156, 3008), passive-DNS and WHOIS enrichment, and CTI feeds so
  the analyst can confirm or rule out adversary-controlled DNS infrastructure across reputation, lexical
  similarity, domain age/TTL, IP fan-out, and query cadence/volume angles.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
