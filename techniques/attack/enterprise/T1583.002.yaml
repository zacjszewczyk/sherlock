    adversary-run DNS produces. This evidence focuses on the condition that an internal host sends a DNS
    query where the queried domain, or the IP address in the DNS answer, matches an entry on a high-confidence
    threat intelligence feed of known malicious infrastructure. The ''Escalate low-prevalence IOC hits''
    method applies Statistical Method as follows: For each feed match compute fleet prevalence (count
    of unique internal source hosts) and escalate priority when prevalence is below the 5th percentile
    of external-domain prevalence; rare domains resolving to adversary infrastructure are the strongest
    reputation signal [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- is consistent with adversary-controlled
    DNS infrastructure: pivot to the querying host(s), the domain and its registration age/WHOIS, the
    resolved IP/AS and its fan-out, the answer TTL and resolution state, the invoking process (Event ID
    4688) and confirming connection (Event ID 5156), and any follow-on C2 or exfiltration behavior. A
    negative result helps rule out this particular detection angle but should be corroborated with the
    other questions in this playbook, since adversary DNS infrastructure is built to evade single signals
    and may surface only across multiple methods.'
  answer_sources:
  - Zeek dns.log
  - Windows Event ID 260
  - 'NAI: Network Egress Points, Enterprise DNS Resolvers'
  range: Last 90 days; baseline 30-90 days, evaluate per event with event-centered correlation
