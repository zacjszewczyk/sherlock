    -- specifically, using the ''Anomaly-score and classify DGA/tunneling'' approach that applies Machine
    Learning?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary stands up
    and operates its own DNS server infrastructure to support operations -- typically as the server side
    of a DNS C2 channel, to serve conditional responses to malware, or to host DGA/tunneling rendezvous
    points. Much of the build-out is invisible to the victim, so detection relies on the in-network artifacts
    adversary-run DNS produces. This evidence focuses on the condition that an internal host generates
    an anomalous volume of failed DNS lookups (NXDOMAIN/SERVFAIL) for high-entropy, random-looking domains,
    and/or exhibits regular high-volume subdomain queries (TXT/NULL records, long encoded labels) to a
    small set of registered domains served by non-corporate authoritative DNS — the signature of DGA-based
    C2 rendezvous or DNS tunneling against an adversary-run DNS server. The ''Anomaly-score and classify
    DGA/tunneling'' method applies Machine Learning as follows: Run an Isolation Forest over stateless
    per-query lexical features (length, label count, unique-char count, numeric ratio, entropy) trained
    only on benign primary domains for real-time scoring, optionally with metaheuristic feature selection,
    and emit the top-3 contributing features per alert [Real-Time DNS Exfiltration](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf),
    [NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500), [XAI in IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    A positive result -- a rule match, statistical outlier, or model alert -- is consistent with adversary-controlled
    DNS infrastructure: pivot to the querying host(s), the domain and its registration age/WHOIS, the
    resolved IP/AS and its fan-out, the answer TTL and resolution state, the invoking process (Event ID
    4688) and confirming connection (Event ID 5156), and any follow-on C2 or exfiltration behavior. A
    negative result helps rule out this particular detection angle but should be corroborated with the
    other questions in this playbook, since adversary DNS infrastructure is built to evade single signals
    and may surface only across multiple methods.'
  answer_sources:
  - Zeek dns.log
  - Windows Event ID 5156
  - Windows DNS-Client/Operational (Event ID 3008)
  - 'NAI: Network Egress Points, Enterprise DNS Resolvers, Endpoint Devices'
  range: Last 90 days; baseline 30-90 days, evaluate per event with event-centered correlation
  queries:
  - technology: ML/pseudocode
    query: '// ML scoring/clustering of DNS infrastructure


      features = build(lexical, ttl_stats, ip_as_fanout, age, reputation, prevalence)

      model    = trained_on(benign primary domains / passive-DNS history)


      score = model.predict(features)


      ALERT WHEN score > threshold OUTPUT top3_contributing_features AS explanation

      // Cluster/anomaly methods: DBSCAN, Isolation Forest, Louvain, SARIMA/Prophet, C4.5'
