- question: '[Resource Development] Score domains by age and TTL (Statistical Method): Can you determine
    whether an internal host is among the first five hosts in the organization to resolve a domain registered
    within the last 30 days, where the DNS answer has a Time-To-Live (TTL) value less than 300 seconds
    and the same query is tied to a Windows Event ID 5156 connection. -- specifically, using the ''Score
    domains by age and TTL'' approach that applies Statistical Method?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary stands up
    and operates its own DNS server infrastructure to support operations -- typically as the server side
    of a DNS C2 channel, to serve conditional responses to malware, or to host DGA/tunneling rendezvous
    points. Much of the build-out is invisible to the victim, so detection relies on the in-network artifacts
    adversary-run DNS produces. This evidence focuses on the condition that an internal host is among
    the first five hosts in the organization to resolve a domain registered within the last 30 days, where
    the DNS answer has a Time-To-Live (TTL) value less than 300 seconds and the same query is tied to
    a Windows Event ID 5156 connection. The ''Score domains by age and TTL'' method applies Statistical
    Method as follows: Compute risk = (1/age_days)+(1/TTL_seconds)+(low_TTL_ratio) using EXPOSURE-style
