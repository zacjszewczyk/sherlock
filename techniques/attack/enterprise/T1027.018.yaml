name: 'T1027.018: Invisible Unicode'
id: 2f295b97-61de-416c-bd3c-f93000c2ea2a
description: Investigate adversary abuse of invisible or non-printing Unicode characters used to conceal
  malicious content inside files, scripts, source code, identifiers, URLs, or text artifacts. Attackers
  insert zero-width characters (U+200B/200C/200D/2060/FEFF), word joiners, bidirectional override/isolate
  controls (U+202A-202E, U+2066-2069), variation selectors (U+FE00-FE0F, U+E0100-E01EF), Unicode Tag characters
  (U+E0000-E007F), and Private Use Area code points to hide data, alter how content is interpreted, or
  smuggle encoded payloads (binary, Base64, or custom schemes) that are reconstructed at runtime via eval(),
  JavaScript Proxy traps, or other dynamic execution. This playbook helps an analyst hunt for visually
  benign but invisibly weaponized scripts on Windows, Linux, and macOS endpoints, decode smuggled variation-selector
  and Tag runs, detect homoglyph and confusable identifiers/domains, baseline hidden-character density
  and entropy, and correlate decoding behavior with follow-on child-process creation and outbound network
  activity that is inconsistent with the visible file content. It supports detection of Trojan Source
  style bidi attacks, emoji/Tag data smuggling, and invisible-Unicode AI prompt-injection embedded in
  documents and emails.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
