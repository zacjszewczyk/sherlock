questions:
- question: Do PowerShell script blocks, process command lines, downloaded text artifacts, or file writes
    on Windows endpoints contain invisible or default-ignorable Unicode code points, and is that same
    artifact then launched by a script interpreter within minutes?
  context: 'Under the Stealth tactic the adversary tries to blend malicious code into text that looks
    benign to an analyst''s eyes. Parse PowerShell script blocks (Event 4104), command lines (4688/Sysmon
    1), downloaded text (Zeek files.log), and file writes (Sysmon 11) for the default-ignorable and invisible
    code points enumerated in [Unicode Security Considerations (UTR #36)](https://www.unicode.org/reports/tr36/)
    and the Restricted Identifier_Type set in [UTS #39](https://www.unicode.org/reports/tr39/): zero-width
    chars (U+200B/200C/200D/2060/FEFF), word joiner, bidirectional overrides/isolates (U+202A-202E, U+2066-2069),
    variation selectors, Unicode Tags (U+E0000-E007F), and PUA. A positive result is any such character
    inside code, comments, identifiers, or URLs where the same artifact is then executed by powershell,
    pwsh, cmd, wscript/cscript, python, node, or mshta within five minutes; treat unterminated Bidi overrides/isolates
    as a hard block per [Trojan Source](https://www.usenix.org/conference/usenixsecurity23/presentation/boucher)
    (CVE-2021-42574). Even a single Tags/bidi/variation-selector code point in executable text is alert-worthy,
    while PUA/zero-width counts should be tuned to local multilingual baselines so legitimate non-English
    content does not flood the queue.'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - Zeek files.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Internet-facing download points, scripting workstations, file shares used for code distribution,
    and Windows endpoints that execute text-based artifacts.'
  range: Last 90 days, prioritizing a 5-minute artifact-to-interpreter execution window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'invisible = [U+200B,U+200C,U+200D,U+2060,U+FEFF, U+202A..U+202E, U+2066..U+2069, U+FE00..U+FE0F,
      U+E0100..U+E01EF, U+E0000..U+E007F, PUA]

      text = FROM [Event4104, Event4688, Sysmon1, Sysmon11(file), Zeek_files] EXTRACT content

      hits = FILTER text WHERE ANY(codepoint(content) IN invisible)

      exec = FROM [Sysmon1, Event4688] WHERE image IN [powershell,pwsh,cmd,wscript,cscript,python,node,mshta]

      ALERT WHERE hits AND JOIN hits WITH exec ON host, artifact WITHIN 5m

      HARD_BLOCK WHERE unterminated_bidi(content)'
- question: When a Windows text artifact contains a contiguous run of variation selectors or Unicode Tag
    characters, what bytes/ASCII does that run decode to, and does the reconstructed string reveal code,
    Base64, URLs, or AI prompt directives?
  context: Variation selectors (U+FE00-FE0F / U+E0100-E01EF) and Unicode Tag characters (U+E0000-E007F)
    can carry arbitrary smuggled data attached to a single visible glyph. To defeat this stealth technique,
    deterministically decode any contiguous run back to bytes/ASCII and inspect the reconstructed string
    for executable code, Base64 blobs, URLs, or embedded AI prompt-injection directives, following [Smuggling
    arbitrary data through an emoji](https://paulbutler.org/2025/smuggling-arbitrary-data-through-an-emoji/)
    by Paul Butler and the [ASCII Smuggler](https://embracethered.com/blog/posts/2024/hiding-and-finding-text-with-unicode-tags/)
    technique. A positive result is a hidden payload reconstructed from text that rendered as harmless
    emoji or whitespace. Alert when a single visible glyph carries more than eight trailing selector/tag
    bytes, or any artifact contains more than 32 total smuggled bytes, since that volume indicates intentional
    data smuggling rather than legitimate emoji variation.
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - Zeek files.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Internet-facing download points, scripting workstations, file shares used for code distribution,
    and Windows endpoints that execute text-based artifacts.'
  range: Last 90 days.
  queries:
  - technology: SIEM/Decode pseudocode
    query: "runs = FIND_CONTIGUOUS(content, codepoint IN [U+FE00..U+FE0F, U+E0100..U+E01EF, U+E0000..U+E007F])\n\
      FOR run IN runs:\n  decoded = decode_selector_tag_bytes(run)\n  ALERT WHERE looks_like(decoded,\
      \ [code, base64, url, prompt_directive])\n  ALERT WHERE trailing_bytes_per_glyph(run) > 8 OR total_smuggled_bytes(content)\
      \ > 32"
- question: Do non-ASCII identifiers, command names, or URLs on Windows hosts share a confusables skeleton
    with an allowlisted legitimate target while using different underlying code points (a homoglyph/confusable
    substitution)?
  context: 'Adversaries use look-alike characters to make a malicious identifier, command, or domain visually
    indistinguishable from a trusted one, supporting stealthy execution and phishing. Compute the [confusables.txt](https://www.unicode.org/Public/security/latest/confusables.txt)
    skeleton (per [UTS #39](https://www.unicode.org/reports/tr39/)) of identifiers, command names, and
    URLs, then flag non-ASCII strings whose skeleton matches an allowlisted target but whose raw code
    points differ via mixed-script or single non-Latin substitution. A positive result is a string that
    looks like a trusted name but is built from different code points; record whether the confusable then
    resolves/executes successfully versus fails, which separates a live attack from a typo or benign internationalized
    name.'
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - Zeek files.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Internet-facing download points, scripting workstations, file shares used for code distribution,
    and Windows endpoints that execute text-based artifacts.'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR s IN extract(identifiers, command_names, urls):\n  skel = confusable_skeleton(s)\n  ALERT\
      \ WHERE skel IN allowlist_skeletons AND raw_codepoints(s) != allowlist_raw(skel)\n         AND (mixed_script(s)\
      \ OR single_non_latin_sub(s))\n  RECORD resolved_or_executed(s) AS state"
- question: Which Windows hosts, users, or source repositories show statistically abnormal hidden-character
    density or depressed printable-character ratios in their text and script artifacts compared to local
    baselines?
  context: This statistical hunt establishes what 'normal' Unicode usage looks like per host, user, and
    source repository, then surfaces deviations that indicate smuggled content. Measure Volume (count
    of non-printing Unicode code points per kilobyte and printable-to-total ratio), Frequency (rate of
    Unicode category transitions per 100 chars), and the per-script share of out-of-expected-script code
    points. Flag outliers above the 95th percentile or beyond three standard deviations from local baselines;
    for non-multilingual sources alert when the printable ratio drops below 0.7 or non-printing density
    exceeds 5/KB. Because [Bad Characters](https://arxiv.org/abs/2106.09898) research shows only a handful
    of injected invisible code points are needed to change behavior, keep absolute-count floors low, and
    suppress multilingual content and trusted signed software via allowlists to control false positives.
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - Zeek files.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Internet-facing download points, scripting workstations, file shares used for code distribution,
    and Windows endpoints that execute text-based artifacts.'
  range: Last 90 days, with rolling per-host/per-user baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'metrics = FOR artifact: {nonprint_per_kb, printable_ratio, cat_transitions_per_100, out_of_script_share}

      baseline = PERCENTILE/STDDEV(metrics) BY host, user, repo

      ALERT WHERE metric > p95 OR metric > mean+3*stddev

      ALERT WHERE non_multilingual AND (printable_ratio < 0.7 OR nonprint_per_kb > 5)

      SUPPRESS multilingual_allowlist, signed_software_allowlist'
- question: Do Windows script blocks exhibit Shannon entropy or code-point distribution divergence (KL-divergence)
    from a natural-language / known-good-script baseline that indicates encoded or padded hidden blocks?
  context: Encoded or padded invisible-Unicode payloads change the statistical shape of text. Compute
    Shannon entropy and Kullback-Leibler divergence of the code-point distribution against a natural-language
    or known-good-script baseline to flag encoded or padded blocks, drawing on [Using Entropy in Threat
    Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/) guidance and the character-frequency
    shifts demonstrated in [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf)
    (~408k-script corpus) and the [Effective Method ... Hybrid Features](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099)
    obfuscation research. To reduce false positives, alert only when script-block entropy exceeds the
    local 95th percentile AND the printable ratio is depressed at the same time, which jointly indicate
    concealment rather than ordinary high-entropy data like legitimately compressed or encrypted blobs.
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - Zeek files.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Internet-facing download points, scripting workstations, file shares used for code distribution,
    and Windows endpoints that execute text-based artifacts.'
  range: Last 90 days, with rolling per-host baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR block IN Event4104_scriptblocks:\n  H = shannon_entropy(codepoints(block))\n  KL = kl_divergence(codepoint_dist(block),\
      \ known_good_baseline)\n  ALERT WHERE H > local_p95 AND printable_ratio(block) < depressed_threshold\n\
      \  RANK BY KL DESC"
- question: Does a character-level / small-language-model classifier score Windows files or script blocks
    as obfuscated, and are the highest-scoring artifacts followed by interpreter launch, child-process
    creation, or outbound web fetches?
  context: When deny-lists and thresholds miss novel encodings, a learned classifier generalizes. Score
    files and script blocks with a character-level CNN/LSTM (per [Detecting Malicious PowerShell Commands
    using Deep Neural Networks](https://arxiv.org/abs/1804.04177)) or an ELECTRA-style small language
    model (per [Command-line Obfuscation Detection](https://arxiv.org/html/2408.02637v1)) trained on benign
    multilingual content, source-controlled scripts, and known obfuscated/invisible-Unicode payloads such
    as [Trojan Source](https://www.usenix.org/conference/usenixsecurity23/presentation/boucher) and [Bad
    Characters](https://arxiv.org/abs/2106.09898) samples. Surface the top-3 contributing features in
    the alert text (for example 'tags-block-count=42, printable-ratio=0.31, decode-then-childproc=true')
    so the analyst can validate quickly. Prioritize high-score artifacts that are followed by an interpreter
    launch, child-process creation, or outbound web fetches, which converts a model score into an actionable,
    behavior-corroborated detection.
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - Zeek files.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Internet-facing download points, scripting workstations, file shares used for code distribution,
    and Windows endpoints that execute text-based artifacts.'
  range: Last 90 days, prioritizing high-score artifacts with follow-on execution or network activity.
  queries:
  - technology: SIEM/ML scoring pseudocode
    query: 'score = charlevel_or_slm_classifier(artifact_text)

      feats = top3_features(artifact)

      behavior = JOIN artifact WITH [interpreter_launch, child_proc, outbound_http] ON host WITHIN 5m

      ALERT WHERE score > threshold

      RANK BY score AND behavior; EMIT feats IN alert'
- question: Do Windows identifiers or domains that pass code-point deny-lists nonetheless render to images
    that are visually near-identical to legitimate allowlisted targets according to a learned visual-similarity
    model?
  context: Some homoglyph attacks evade code-point deny-lists because the substituted character is not
    on any block list, yet renders to look identical to a human. Render strings to images and compare
    learned visual-similarity embeddings (per [Detecting Homoglyph Attacks with a Siamese Neural Network](https://arxiv.org/abs/1805.09738),
    [code](https://github.com/endgameinc/homoglyph)) to catch look-alike identifiers and domains that
    bypass code-point checks. A positive result is a string whose rendered image matches a legitimate
    target while its code points differ; report the matched legitimate target and the differing code points
    in the alert so analysts can confirm the impersonation and scope related artifacts under the Stealth
    tactic.
  answer_sources:
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - Zeek files.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Internet-facing download points, scripting workstations, file shares used for code distribution,
    and Windows endpoints that execute text-based artifacts.'
  range: Last 90 days.
  queries:
  - technology: SIEM/ML embedding pseudocode
    query: "FOR s IN extract(identifiers, domains):\n  emb = visual_embedding(render_image(s))\n  match\
      \ = nearest(emb, allowlist_target_embeddings)\n  ALERT WHERE similarity(emb, match) > visual_threshold\
      \ AND raw_codepoints(s) != raw(match)\n  EMIT matched_target=match, differing_codepoints"
- question: For each Linux execution of bash, sh, python, perl, or node, does the target script file contain
    invisible/default-ignorable code points or unterminated Bidi overrides, and do contiguous variation-selector/Tag
    runs decode to hidden payloads?
  context: 'On Linux, the adversary stealthily executes scripts whose on-disk text looks benign but carries
    invisible Unicode. For each auditd EXECVE of bash, sh, python, perl, or node, correlate via SYSCALL
    stat/open to read the target script, then flag default-ignorable/invisible code points and unterminated
    Bidi overrides per [UTR #36](https://www.unicode.org/reports/tr36/) and [Trojan Source](https://www.usenix.org/conference/usenixsecurity23/presentation/boucher).
    Alert when at least one Tags/bidi/variation-selector code point appears in the executed file. Additionally
    decode contiguous variation-selector/Tag runs to bytes and inspect them (per [Smuggling arbitrary
    data through an emoji](https://paulbutler.org/2025/smuggling-arbitrary-data-through-an-emoji/)) for
    reconstructed code or URLs. A positive result is an executed script whose visible content differs
    from what is actually interpreted, a strong concealment signal warranting immediate triage.'
  answer_sources:
  - auditd:EXECVE
  - auditd:SYSCALL
  - Zeek files.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Linux build servers, developer workstations, and hosts that execute downloaded bash/python/node
    scripts.'
  range: Last 90 days, correlating EXECVE with the referenced script file.
  queries:
  - technology: auditd/correlation pseudocode
    query: 'exec = FROM auditd_EXECVE WHERE exe IN [bash,sh,python,perl,node]

      script = JOIN exec WITH auditd_SYSCALL(stat/open) ON pid -> target_file

      hits = FILTER script WHERE ANY(codepoint IN invisible_set) OR unterminated_bidi(script)

      FOR run IN contiguous(variation_selector|tag): inspect(decode_bytes(run))

      ALERT WHERE hits OR decoded_payload_found'
- question: Which Linux executing users or script paths show non-printing code-point density or printable
    ratios that deviate from their established baseline, separating real encoding from natural language
    via entropy/KL-divergence?
  context: Baseline per executing user and script path to detect hidden content statistically on Linux.
    Track non-printing code points per KB and printable ratio, and alert beyond three standard deviations
    or when the printable ratio falls below 0.7 for non-multilingual code. Use entropy and KL-divergence
    (per [Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/)
    and [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf)
    distribution features) to distinguish genuine encoding/obfuscation from legitimately high-variety
    natural language. A positive result is a script from a normally clean user/path that suddenly carries
    dense non-printing characters, indicating possible smuggling or obfuscation under the Stealth tactic.
  answer_sources:
  - auditd:EXECVE
  - auditd:SYSCALL
  - Zeek files.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Linux build servers, developer workstations, and hosts that execute downloaded bash/python/node
    scripts.'
  range: Last 90 days, with rolling per-user/per-path baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'metrics = FOR script: {nonprint_per_kb, printable_ratio, entropy, kl_vs_natural}

      baseline = STDDEV(metrics) BY user, script_path

      ALERT WHERE metric > mean+3*stddev

      ALERT WHERE non_multilingual AND printable_ratio < 0.7

      USE entropy/kl_vs_natural TO separate encoding FROM language'
- question: After a Linux script containing invisible Unicode runs, is there a burst of failure-mode signals
    (DNS NXDOMAIN, HTTP 404/blocked connections, non-zero process exit codes) that deviates from the host's
    normal failure rates?
  context: 'Even when a decoded payload looks benign, its operational failures betray staging activity.
    After a script with invisible Unicode runs, measure failure-mode signals from correlated telemetry
    as distinct features: DNS NXDOMAIN, HTTP 404 or blocked connections, and non-zero process exit codes.
    A decode followed by a burst of failed resolutions or connections is a strong staging/C2 signal independent
    of payload appearance. Baseline normal NXDOMAIN/404 rates per host and alert on deviation; a positive
    result is a post-decode spike in failures, suggesting the script attempted to reach infrastructure
    that is down, blocked, or not yet live.'
  answer_sources:
  - auditd:EXECVE
  - auditd:SYSCALL
  - Zeek files.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Linux build servers, developer workstations, and hosts that execute downloaded bash/python/node
    scripts.'
  range: Last 90 days, anchored to the post-execution window of flagged scripts.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'anchor = scripts_with_invisible_unicode (executed)

      fails = FROM [Zeek_dns(NXDOMAIN), Zeek_http(404/blocked), auditd(exit!=0)] WITHIN window_after(anchor)

      baseline = normal_rate(NXDOMAIN, 404) BY host

      ALERT WHERE fails_rate > baseline + deviation'
- question: Does a character-level / small-language-model classifier score the deobfuscated body of an
    executed Linux script as malicious, especially when the decoded content triggers child-process creation
    or outbound network activity?
  context: Apply a character-level or small-language-model classifier (per [Hendler et al.](https://arxiv.org/abs/1804.04177)
    and [Tran et al.](https://arxiv.org/html/2408.02637v1)) to the deobfuscated Linux script body rather
    than the raw, invisible-laden text, so the model judges what actually executes. Surface the top-3
    features driving the score for fast analyst validation, and prioritize artifacts whose decoded content
    triggers child-process creation or outbound network activity. A high score corroborated by spawned
    children or new connections strongly indicates that the invisible Unicode was concealing live malicious
    logic under the Stealth tactic.
  answer_sources:
  - auditd:EXECVE
  - auditd:SYSCALL
  - Zeek files.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Linux build servers, developer workstations, and hosts that execute downloaded bash/python/node
    scripts.'
  range: Last 90 days, prioritizing decoded scripts with follow-on execution or network activity.
  queries:
  - technology: SIEM/ML scoring pseudocode
    query: 'decoded = deobfuscate(executed_script_body)

      score = charlevel_or_slm_classifier(decoded)

      behavior = JOIN script WITH [child_proc, outbound_conn] ON host WITHIN window

      ALERT WHERE score > threshold; RANK BY behavior; EMIT top3_features'
- question: When macOS executes osascript/JXA, sh, zsh, bash, installer, or open, does the referenced
    script/file contain invisible/default-ignorable code points, bidi overrides, variation selectors,
    or Unicode Tags, followed by network connection initiation within minutes?
  context: 'On macOS the adversary hides payloads in scripts run via osascript/JXA, shells, installer,
    or open. From unified-log execution of these binaries, inspect the referenced script/file for invisible/default-ignorable
    code points, bidi overrides, variation selectors, and Unicode Tags per [UTR #36](https://www.unicode.org/reports/tr36/),
    [UTS #39](https://www.unicode.org/reports/tr39/), and [ASCII Smuggler](https://embracethered.com/blog/posts/2024/hiding-and-finding-text-with-unicode-tags/).
    Alert when such characters are present and followed by network connection initiation (NSM:Flow) within
    five minutes. A positive result is a visually benign script that contains hidden Unicode and then
    reaches out to the network, indicating concealed execution and possible C2/staging under the Stealth
    tactic.'
  answer_sources:
  - macos:unifiedlog
  - NSM:Flow
  - Zeek files.log
  - Zeek http.log
  - 'NAI: macOS developer and admin endpoints executing osascript/JXA, shell scripts, or installer packages
    from downloaded content.'
  range: Last 90 days, prioritizing a 5-minute execution-to-network window.
  queries:
  - technology: macOS unifiedlog/correlation pseudocode
    query: 'exec = FROM macos_unifiedlog WHERE process IN [osascript,sh,zsh,bash,installer,open]

      script = referenced_file(exec)

      hits = FILTER script WHERE ANY(codepoint IN invisible_set) OR bidi_override OR variation_selector
      OR tag

      net = FROM NSM_Flow WHERE connection_initiated

      ALERT WHERE hits AND JOIN hits WITH net ON host WITHIN 5m'
- question: Which macOS users or script paths show non-printing code-point density, depressed printable
    ratio, or abnormal code-point entropy beyond baseline, with KL-divergence separating encoded blocks
    from genuine multilingual text?
  context: Maintain per-user/per-path baselines on macOS of non-printing code points per KB, printable
    ratio, and code-point entropy. Flag a printable ratio below 0.7 or density/entropy beyond the 95th
    percentile, and use KL-divergence (per [Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/)
    and [Effective Method ... Hybrid Features](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099)
    research) to separate genuinely encoded blocks from legitimate multilingual text. A positive result
    is a script from a normally clean macOS user/path that suddenly shows dense hidden characters or anomalous
    entropy, a statistical indicator of concealment that complements the deterministic code-point checks.
  answer_sources:
  - macos:unifiedlog
  - NSM:Flow
  - Zeek files.log
  - Zeek http.log
  - 'NAI: macOS developer and admin endpoints executing osascript/JXA, shell scripts, or installer packages
    from downloaded content.'
  range: Last 90 days, with rolling per-user/per-path baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'metrics = FOR script: {nonprint_per_kb, printable_ratio, entropy}

      baseline = PERCENTILE(metrics) BY user, path

      ALERT WHERE printable_ratio < 0.7 OR density > p95 OR entropy > p95

      USE kl_divergence TO separate encoded_blocks FROM multilingual_text'
- question: Do macOS command/identifier strings match an allowlisted name by confusables skeleton, or
    do variation-selector/Tag runs decode to hidden code or URLs, and does the decoded action then succeed
    or fail?
  context: Combine homoglyph and decode checks on macOS. Compute [confusables.txt](https://www.unicode.org/Public/security/latest/confusables.txt)
    skeletons for command/identifier strings and decode variation-selector/Tag runs to bytes (per [Smuggling
    arbitrary data through an emoji](https://paulbutler.org/2025/smuggling-arbitrary-data-through-an-emoji/)).
    Alert on confusable matches to allowlisted names or on decoded code/URLs. As a state metric, record
    whether the decoded action then succeeds or fails, which helps distinguish a live attack from a failed
    or benign artifact. A positive result is either a look-alike command impersonating a trusted name
    or a hidden run that reconstructs executable content/URLs, both indicating stealthy abuse of Unicode
    on macOS.
  answer_sources:
  - macos:unifiedlog
  - NSM:Flow
  - Zeek files.log
  - Zeek http.log
  - 'NAI: macOS developer and admin endpoints executing osascript/JXA, shell scripts, or installer packages
    from downloaded content.'
  range: Last 90 days.
  queries:
  - technology: SIEM/Decode pseudocode
