name: 'T1592: Gather Victim Host Information'
id: e94334c4-2064-48a7-a39e-efd4c03b4b6f
description: 'Investigate whether an external adversary is actively gathering information about enterprise
  hosts during the Reconnaissance phase. This playbook helps an analyst hunt for inbound scanning and
  probing activity, malicious host-fingerprinting content served to internal users, and enumeration of
  public-facing web applications. It correlates evidence across firewall and Netflow records, Zeek conn/http/dns
  logs, web server access logs, WAF and proxy logs, and endpoint DNS query telemetry. Specific behaviors
  covered include: CTI-flagged scanner IPs making high-fan-out port scans or network sweeps; sources with
  abnormally high connection or HTTP error (failure) ratios indicative of enumeration; internal hosts
  beaconing to reconnaissance frameworks such as ScanBox and exfiltrating high-entropy host-information
  structures; rare, short, or high-entropy User-Agent strings tied to scanning tools; and requests probing
  for information-disclosure URIs (e.g., /actuator/env, /.git/config, phpinfo.php). For each behavior
  the playbook provides symbolic-logic matching, statistical baselining, and machine-learning detection
  approaches so the analyst can confirm or rule out active host reconnaissance and feed findings into
  Initial Access and follow-on hunt efforts.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any inbound connections in firewall or Zeek conn.log records sourced from IP addresses
    (or matching TLS/JARM/JA3S or service-banner fingerprints) that current cyber threat intelligence
    lists as known scanners or malicious actors?
  context: During Reconnaissance an external adversary frequently uses infrastructure already catalogued
    by threat-intelligence providers. Matching inbound source IPs and TLS/JARM/JA3S and service-banner
    fingerprints against CTI (the SCANdalous! artifact-matching method) gives a high-confidence first
    signal of targeted scanning. Allowlist known benign research scanners (Shodan, Censys, ZMap, academic
    telescopes), which behave distinctly from targeted recon, to suppress false positives. A positive
    match against a non-research CTI scanner directed at external-facing assets warrants escalation; a
    match only to research scanners is informational.
  answer_sources:
  - Firewall Logs
  - Zeek conn.log
  - Suricata/Snort alerts
  - Threat Intelligence Feeds
  - 'NAI: External-facing web servers, VPN concentrators, Firewall and network gateway logs, Domain controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=firewall OR sourcetype=zeek_conn direction=inbound
      | lookup cti_scanners ip AS src_ip OUTPUT threat_type, is_research
      | join type=left src_ip [| inputlookup tls_fingerprints (jarm,ja3s,banner)]
      | where (isnotnull(threat_type) OR jarm_match OR ja3s_match OR banner_match)
          AND is_research!="true"
      | table _time src_ip dest_ip dest_port threat_type jarm ja3s
- question: Which external source IPs connect to an abnormally large number of distinct destination hosts
    or distinct destination ports within a 5-minute window relative to the local environment baseline?
  context: 'Targeted host reconnaissance produces fan-out: one source touching many ports on a host or
    many hosts on a port. Rather than a fixed global threshold, flag IPs whose 5-minute distinct-host
    or distinct-port count exceeds the 99th percentile of the local baseline, deriving the threshold per
    environment from empirical scan-rate and port-concentration distributions (Durumeric et al.). This
    adapts to each network''s normal traffic, reducing false positives from legitimate high-volume clients
    while catching scanners that exceed normal fan-out.'
  answer_sources:
  - Firewall Logs
  - Zeek conn.log
  - Suricata/Snort alerts
  - Threat Intelligence Feeds
  - 'NAI: External-facing web servers, VPN concentrators, Firewall and network gateway logs, Domain controllers'
  range: Last 90 days; evaluate in 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      index=firewall OR sourcetype=zeek_conn direction=inbound
      | bin _time span=5m
      | stats dc(dest_ip) AS hosts dc(dest_port) AS ports BY _time src_ip
      | eventstats perc99(hosts) AS h99 perc99(ports) AS p99
      | where hosts > h99 OR ports > p99
- question: Do per-connection success/failure outcomes from any source IP cross a sequential hypothesis-test
    threshold that statistically declares the source a scanner?
  context: Scanners generate mostly failed connections (Rejected/Reset/no-response) because they probe
    addresses and ports that are not actually serving. Applying Threshold Random Walk (Wald's Sequential
    Probability Ratio Test) to the Established-vs-failed outcome of each connection declares a scanner
    once the likelihood ratio crosses the upper bound — typically after only ~4-5 mostly-failed attempts
    — with bounded error (Jung et al.). This profiles the failure rate as the primary signal and alerts
    far faster than fixed-count thresholds, while controlling false-positive/false-negative rates.
  answer_sources:
  - Firewall Logs
  - Zeek conn.log
  - Suricata/Snort alerts
  - Threat Intelligence Feeds
  - 'NAI: External-facing web servers, VPN concentrators, Firewall and network gateway logs, Domain controllers'
  range: Last 90 days; evaluate per-IP connection sequences in arrival order
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      index=firewall OR sourcetype=zeek_conn direction=inbound
      | sort 0 src_ip _time
      | eval success = if(conn_state IN ("SF","S1","ESTABLISHED"),1,0)
      | streamstats BY src_ip current=t
          eval(llr = llr + (if(success=1, ln(0.2/0.8), ln(0.8/0.2)))) AS llr
      | where llr >= ln((1-0.01)/0.01)   /* upper SPRT bound -> declare scanner */
      | table _time src_ip llr
- question: When a Random Forest is trained on CTI flag, distinct ports/hosts, connection success/failure
    ratio, and inter-arrival statistics, which source IPs receive a high reconnaissance-probability score,
    and which features drove that score?
  context: A supervised Random Forest combines weak individual signals (reputation, fan-out, failure ratio,
    timing) into a single reconnaissance-probability score, improving on any single threshold. Surfacing
    the top-3 contributing features (e.g., failed-connection ratio, distinct-host count, source reputation)
    in the alert lets an analyst triage quickly and judge whether the score reflects genuine scanning.
    High scores driven by failure ratio and host fan-out from an external IP strongly indicate active
    host reconnaissance.
  answer_sources:
  - Firewall Logs
  - Zeek conn.log
  - Suricata/Snort alerts
  - Threat Intelligence Feeds
  - 'NAI: External-facing web servers, VPN concentrators, Firewall and network gateway logs, Domain controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features per src_ip = [cti_flag, distinct_ports, distinct_hosts,
          fail_ratio, mean_interarrival, std_interarrival, total_conns]
      model = RandomForestClassifier(n_estimators=300).fit(X_train, y_train)
      score = model.predict_proba(X)[:,1]
      alert where score > 0.8
      emit top3 = argsort(model.feature_importances_ * x_contrib)[-3:]
- question: Can a classifier reliably separate benign internet-wide scanning (Shodan, Censys) from targeted
    reconnaissance against our hosts using scan rate, port-sequence pattern, distinct-host fan-out, and
    research-scanner attribution?
  context: 'Not all scanning is hostile: research scanners enumerate the entire internet and behave differently
    from an adversary focused on your assets. Training a classifier on scan rate, port sequence (random
    vs. sequential), distinct-host fan-out, and whether the source is a known research scanner — grounded
    in the scanning characterization of Durumeric et al. — lets the analyst distinguish background noise
    from targeted recon. A source classified as targeted (sequential ports, narrow host focus, non-research
    origin) is far more relevant to the Reconnaissance hunt than broad benign sweeps.'
  answer_sources:
  - Firewall Logs
  - Zeek conn.log
  - Suricata/Snort alerts
  - Threat Intelligence Feeds
  - 'NAI: External-facing web servers, VPN concentrators, Firewall and network gateway logs, Domain controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features per src_ip = [scan_rate, port_seq_is_sequential, distinct_host_fanout,
          is_known_research_scanner, distinct_ports]
      clf = GradientBoostingClassifier().fit(X_train, label in {benign_scan, targeted})
      pred = clf.predict(X)
      alert where pred == "targeted"
- question: Are any internal hosts connecting (via DNS, HTTP, or proxy) to external domains or IPs that
    threat intelligence associates with reconnaissance/fingerprinting frameworks such as ScanBox?
  context: Adversaries also collect host information by compromising sites and serving fingerprinting
    code (e.g., ScanBox) to visitors. Alerting when internal hosts resolve or connect to CTI-derived reconnaissance/fingerprinting
    infrastructure — matching infrastructure artifacts as in SCANdalous! — catches the victim side of
    host information gathering. A positive hit means an internal endpoint may have been served host-enumeration
    content, indicating the organization is being profiled and may precede targeted exploitation.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Proxy Logs
  - Endpoint DNS Query Logs (Sysmon EID 22)
  - 'NAI: DNS resolvers, Network egress points and web proxies, User workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      (sourcetype=zeek_dns OR sourcetype=zeek_http OR sourcetype=proxy OR EventCode=22)
      | eval indicator = coalesce(query, host, url, dest_ip)
      | lookup cti_recon_frameworks indicator OUTPUT framework, confidence
      | where isnotnull(framework)
      | table _time src_ip indicator framework confidence
- question: Do any outbound HTTP POST bodies exhibit character entropy above the 98th percentile and a
    chi-square character distribution that deviates from the learned normal for that endpoint, suggesting
    exfiltration of collected host information?
  context: After fingerprinting code collects host details it POSTs a structured data blob to the adversary.
    Such blobs have unusually high character entropy. Alerting when outbound POST body entropy exceeds
    the 98th percentile, and complementing raw entropy with the chi-square character-distribution test
    of Kruegel & Vigna to flag bodies deviating from the endpoint's learned normal distribution, catches
    these collected-host-info structures while reducing false positives from normally high-entropy uploads.
    A flagged POST following contact with a recon framework is a strong exfiltration signal.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Proxy Logs
  - Endpoint DNS Query Logs (Sysmon EID 22)
  - 'NAI: DNS resolvers, Network egress points and web proxies, User workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      sourcetype=zeek_http method=POST direction=outbound
      | eval ent = shannon_entropy(post_body)
      | eval chisq = chi_square(char_dist(post_body), baseline_char_dist(uri_host))
      | eventstats perc98(ent) AS e98
      | where ent > e98 AND chisq > chisq_critical_p01
      | table _time src_ip uri_host ent chisq
- question: Does an FP-Inspector-style classifier on static and dynamic JavaScript features identify host-information-collection
    (fingerprinting) scripts served to our users, and which fingerprinting APIs triggered it?
  context: Browser fingerprinting scripts enumerate canvas, WebGL, AudioContext, fonts, and navigator
    properties to profile a visitor's host. An FP-Inspector-style classifier on static+dynamic JavaScript
    features (per Fingerprinting the Fingerprinters) detects these collection scripts. Including POSTed-data
    characteristics and surfacing the top-3 triggering fingerprinting APIs in the alert helps an analyst
    confirm that host information is being harvested from internal users — a direct realization of T1592
    reconnaissance via malicious web content.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Proxy Logs
  - Endpoint DNS Query Logs (Sysmon EID 22)
  - 'NAI: DNS resolvers, Network egress points and web proxies, User workstations'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = static_js(ast n-grams, api refs) + dynamic_js(canvas, WebGL,
          AudioContext, font/navigator enumeration counts) + posted_data_stats
      clf = FPInspectorClassifier().fit(X_train, y_train)
      alert where clf.predict_proba(X) > 0.7
      emit top3 fingerprinting APIs by SHAP contribution
- question: Do any inbound HTTP/S requests carry User-Agent strings or request URIs that match known scanning-tool
    signatures in web server, Zeek http.log, or WAF logs?
  context: Many scanning and enumeration tools leave recognizable User-Agent strings or request distinctive
    URIs. Matching these against curated scanner signatures (tuned against representative baselines per
    Kruegel & Vigna's per-application structural modeling) gives a fast, low-cost signal of automated
    reconnaissance against public web applications. A signature hit from a single external IP, especially
    combined with high error ratios, indicates tool-driven probing rather than legitimate browsing.
  answer_sources:
  - Web Server Access Logs (e.g., IIS, Apache, Nginx)
  - Zeek http.log
  - WAF Logs
  - 'NAI: Public-facing web applications, API gateways, Load balancers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      (sourcetype=web_access OR sourcetype=zeek_http OR sourcetype=waf)
      | lookup scanner_signatures ua_regex AS user_agent, uri_regex AS uri
      | where match(user_agent, scanner_ua_regex) OR match(uri, scanner_uri_regex)
      | table _time src_ip user_agent uri status signature_name
- question: Is any single source IP generating a high number of HTTP 404 responses in a short window with
    requested URIs that follow sequential or dictionary-based patterns (directory traversal / forced browsing)?
  context: Forced browsing and directory enumeration produce bursts of 404s as the tool walks a wordlist
    or sequential paths — a clear deviation from the learned request structure and order modeled by Kruegel
    & Vigna. Alerting on a single IP with many 404s plus sequential/dictionary URI patterns reveals an
    adversary mapping the application's hidden content. Positive results indicate active enumeration of
    the web app's structure during Reconnaissance.
  answer_sources:
  - Web Server Access Logs (e.g., IIS, Apache, Nginx)
  - Zeek http.log
  - WAF Logs
  - 'NAI: Public-facing web applications, API gateways, Load balancers'
  range: Last 90 days; evaluate in short (e.g., 5-minute) windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      (sourcetype=web_access OR sourcetype=zeek_http) status=404
      | bin _time span=5m
      | stats count AS notfound dc(uri) AS uniq_uri values(uri) AS uris BY _time src_ip
      | where notfound > 30 AND dictionary_or_sequential(uris)
      | table _time src_ip notfound uniq_uri
- question: Which source IPs have a 10-minute HTTP 4xx/5xx-to-2xx/3xx response ratio above the 95th percentile,
    indicating mostly failed (enumeration) requests rather than legitimate use?
  context: Legitimate users mostly receive successful (2xx/3xx) responses; scanners and enumerators generate
    disproportionate errors as they probe for content and parameters that do not exist. Flagging IPs whose
    10-minute error ratio exceeds the 95th percentile mirrors the success/failure discriminator that makes
    Threshold Random Walk effective. A high error ratio sustained over many requests is strong evidence
    of automated probing of public web applications.
  answer_sources:
  - Web Server Access Logs (e.g., IIS, Apache, Nginx)
  - Zeek http.log
  - WAF Logs
  - 'NAI: Public-facing web applications, API gateways, Load balancers'
  range: Last 90 days; evaluate in 10-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      (sourcetype=web_access OR sourcetype=zeek_http OR sourcetype=waf)
      | bin _time span=10m
      | eval err = if(status>=400,1,0)
      | stats sum(err) AS errors count AS total BY _time src_ip
      | eval ratio = errors/total
      | eventstats perc95(ratio) AS r95
      | where total > 20 AND ratio > r95
- question: When per-application URI-request sequences are modeled with an LSTM, which sessions fall in
    the top 1% of perplexity, and which low-probability request transitions drove the anomaly?
  context: Normal users navigate an application in predictable sequences; scanners traverse URIs in patterns
    the application was never designed to serve. Modeling normal per-application URI-request sequences
    with an LSTM and flagging top-1% perplexity sessions (generalizing the short-sequence anomaly model
    of A Sense of Self for Unix Processes) catches enumeration that signature rules miss. Reporting the
    specific low-probability transitions that drove the score lets the analyst verify whether the session
    reflects scanning or unusual-but-benign behavior.
  answer_sources:
  - Web Server Access Logs (e.g., IIS, Apache, Nginx)
  - Zeek http.log
  - WAF Logs
  - 'NAI: Public-facing web applications, API gateways, Load balancers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      seqs = per_session ordered URI tokens grouped by (app, src_ip, session)
      lstm = train_LSTM_next_token(benign seqs)
      perplexity = exp(mean(-log p(token_t | token_<t)))
      alert where perplexity in top 1%
      emit lowest-probability transitions (uri_i -> uri_j)
- question: Does any external IP connect to more than 100 distinct destination ports on a single host,
    or to the same port on more than 50 distinct hosts in a /24 subnet, within a 60-second window?
  context: High-rate stateless scanners (e.g., ZMap) produce a distinctive volume/fan-out signature in
    very short time windows. Alerting when an IP hits >100 distinct ports on one host (port scan) or the
    same port on >50 hosts (network sweep) within 60 seconds catches this behavior directly, corroborated
    by the scan characterization in Durumeric et al. Such bursts against DMZ subnets or externally-facing
    servers are almost never legitimate and indicate active reconnaissance mapping of the attack surface.
  answer_sources:
  - Firewall Logs
  - Zeek conn.log
  - Netflow/sFlow/J-Flow data
  - 'NAI: Firewall and network gateway logs, DMZ subnets, Externally-facing servers'
  range: Last 90 days; evaluate in 60-second windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      (index=firewall OR sourcetype=zeek_conn OR sourcetype=netflow) direction=inbound
      | bin _time span=60s
      | eval subnet24 = cidr_net(dest_ip,24)
      | stats dc(dest_port) AS ports_per_host BY _time src_ip dest_ip
      | append [search ... | stats dc(dest_ip) AS hosts_per_port BY _time src_ip dest_port subnet24]
      | where ports_per_host > 100 OR hosts_per_port > 50
- question: Which source IPs show a connection failure rate above 90% over more than 50 attempts (ratio
    of Established to Rejected/Reset/no-response connections)?
  context: 'Connection state is a robust scan discriminator: scanners accumulate failed connections because
    they probe non-listening ports and unused addresses. Monitoring the ratio of successful to unsuccessful
    connections per source IP and flagging sources above a 90% failure rate over 50+ attempts implements
    the state-based Threshold Random Walk discriminator (Jung et al.), which also enables faster sequential
    alerting after only a handful of attempts. A high sustained failure rate is one of the most reliable
    indicators of scanning.'
  answer_sources:
  - Firewall Logs
  - Zeek conn.log
  - Netflow/sFlow/J-Flow data
  - 'NAI: Firewall and network gateway logs, DMZ subnets, Externally-facing servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      (index=firewall OR sourcetype=zeek_conn) direction=inbound
      | eval fail = if(conn_state IN ("REJ","RSTO","RSTR","S0","OTH"),1,0)
      | stats sum(fail) AS fails count AS attempts BY src_ip
      | eval fail_rate = fails/attempts
      | where attempts > 50 AND fail_rate > 0.9
- question: Which source IPs have a 5-minute destination-port entropy or standard deviation exceeding
    3 sigma above the local baseline?
  context: Scanning across many ports raises the entropy/spread of the destination-port distribution well
    beyond normal client behavior, which typically concentrates on a few service ports. Flagging IPs whose
    5-minute destination-port entropy or standard deviation exceeds 3 sigma above the local baseline —
    derived from observed port-targeting concentration in Durumeric et al. — catches broad port scans.
    High port entropy from an external source indicates systematic enumeration of available services.
  answer_sources:
  - Firewall Logs
  - Zeek conn.log
  - Netflow/sFlow/J-Flow data
  - 'NAI: Firewall and network gateway logs, DMZ subnets, Externally-facing servers'
  range: Last 90 days; evaluate in 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      (index=firewall OR sourcetype=zeek_conn OR sourcetype=netflow) direction=inbound
      | bin _time span=5m
      | stats port_entropy(dest_port) AS pent stdev(dest_port) AS pstd BY _time src_ip
      | eventstats avg(pent) AS mu stdev(pent) AS sd
      | where pent > mu + 3*sd
- question: When source IPs are clustered with DBSCAN on distinct ports/hosts, failure ratio, byte counts,
    and inter-arrival features, which IPs fall into sparse clusters or noise indicative of scanning?
  context: Benign traffic forms dense clusters in feature space; scanning IPs sit apart as noise or sparse
    clusters because of their unusual port/host fan-out, high failure ratio, small byte counts, and rapid
    inter-arrival. Clustering with DBSCAN (Ester et al.) isolates these outliers without labeled data.
    Reporting the feature values that placed an IP outside the dense benign clusters lets the analyst
    confirm scanning behavior and avoid mislabeling legitimate high-volume services.
  answer_sources:
  - Firewall Logs
  - Zeek conn.log
  - Netflow/sFlow/J-Flow data
  - 'NAI: Firewall and network gateway logs, DMZ subnets, Externally-facing servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      X per src_ip = [distinct_ports, distinct_hosts, fail_ratio,
          mean_bytes, mean_interarrival]
      labels = DBSCAN(eps=tuned, min_samples=k).fit_predict(scale(X))
      alert where labels == -1 (noise) OR cluster_size < small_threshold
      emit feature values vs nearest dense-cluster centroid
- question: Does Kitsune's online autoencoder ensemble (trained on benign-only traffic) flag scan or sweep
    bursts, and which reconstruction-error features drove the alert?
  context: Kitsune builds incremental flow statistics and an autoencoder ensemble that flags anomalies
    online from benign-only training, making it well suited to detecting scan/sweep bursts in real time.
    Surfacing the top-3 reconstruction-error features (e.g., distinct-host rate, packet-count window)
    in the alert gives the analyst explainable evidence. A high reconstruction error driven by host fan-out
    or packet bursts indicates network reconnaissance that fixed thresholds may miss.
  answer_sources:
  - Firewall Logs
  - Zeek conn.log
  - Netflow/sFlow/J-Flow data
  - 'NAI: Firewall and network gateway logs, DMZ subnets, Externally-facing servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      feats = Kitsune incremental flow stats (per-channel damped windows)
      model = KitNET autoencoder ensemble trained on benign-only stream
      rmse = model.execute(feats)   # online
      alert where rmse > phi (benign-calibrated threshold)
      emit top3 features by per-feature reconstruction error
- question: Are any inbound HTTP/S requests using User-Agent strings that match known malicious or scanner
    tool signatures sourced from threat intelligence?
  context: Many scanning tools ship with default or recognizable User-Agent strings. Alerting on inbound
    requests whose User-Agent matches CTI-sourced malicious/scanner signatures (artifact matching as in
    SCANdalous!) gives a quick, high-confidence indicator of automated reconnaissance against public-facing
    applications and CDNs. A blocklisted User-Agent hit identifies the tool and source for immediate triage
    and correlation with other scanning signals.
  answer_sources:
  - Web Server Access Logs
  - Zeek http.log
  - WAF Logs
  - Proxy Logs
  - 'NAI: Public-facing web applications, Content Delivery Networks (CDNs), Reverse proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      (sourcetype=web_access OR sourcetype=zeek_http OR sourcetype=waf OR sourcetype=proxy)
      | lookup cti_bad_user_agents ua AS user_agent OUTPUT tool_name
      | where isnotnull(tool_name) OR match(user_agent, scanner_ua_regex)
      | table _time src_ip user_agent uri tool_name
- question: Which inbound requests carry User-Agent strings that have never been seen before, fall in
    the bottom 0.1% of fleet-wide prevalence, or have character entropy above 3.5?
  context: Custom tools and obfuscated scanners often present rare, short, or high-entropy User-Agents
    that differ from the common browser/app strings seen across the fleet. Maintaining a fleet-wide prevalence
    baseline and alerting on never-before-seen, bottom-0.1%-prevalence, or entropy>3.5 User-Agents combines
    the rare-equals-suspicious heuristic (frequency analysis) with the character-distribution test of
    Kruegel & Vigna. A rare high-entropy User-Agent from an external source is a useful low-cost lead
    for host reconnaissance.
  answer_sources:
  - Web Server Access Logs
  - Zeek http.log
  - WAF Logs
  - Proxy Logs
  - 'NAI: Public-facing web applications, Content Delivery Networks (CDNs), Reverse proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      (sourcetype=web_access OR sourcetype=zeek_http OR sourcetype=waf OR sourcetype=proxy)
      | eval ent = shannon_entropy(user_agent), len = len(user_agent)
      | eventstats count AS total
      | stats count AS seen earliest(_time) AS first BY user_agent ent len total
      | eval prevalence = seen/total
      | where first > relative_time(now(),"-30d") OR prevalence < 0.001 OR ent > 3.5 OR len < 10
- question: When a benign-only autoencoder is trained on User-Agent and request features, which inbound
    requests produce reconstruction errors in the top 0.1%, and which features contributed most?
  context: An autoencoder trained only on benign User-Agent and request features learns what normal traffic
    looks like and reconstructs it well; anomalous scanner requests reconstruct poorly. Alerting on the
    top-0.1% reconstruction errors (per the autoencoder-ensemble approach of Kitsune) and listing the
    top-3 contributing features gives explainable anomaly detection that adapts to the environment. High
    reconstruction error tied to unusual User-Agent or request structure indicates probing that signature
    lists may not cover.
  answer_sources:
  - Web Server Access Logs
  - Zeek http.log
  - WAF Logs
  - Proxy Logs
  - 'NAI: Public-facing web applications, Content Delivery Networks (CDNs), Reverse proxies'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      feats = [ua_char_ngrams, ua_len, ua_entropy, method, uri_len, header_count]
      ae = Autoencoder().fit(benign feats)
      err = reconstruction_error(ae, feats)
      alert where err in top 0.1%
      emit top3 features by per-feature reconstruction error
- question: Are any inbound URIs matching known sensitive-file or information-disclosure patterns such
    as '/actuator/env', '/.git/config', or 'phpinfo.php'?
  context: Adversaries probe for exposed configuration, source-control, and diagnostic files that leak
    host and application details. Regex-matching requested URIs against known sensitive-file patterns
    flags these probes directly; such requests are structural deviations from the learned normal request
    set per Kruegel & Vigna. A hit means an external source is attempting to harvest information-disclosure
    content from public web servers, API endpoints, or cloud management consoles — a clear Reconnaissance
    action.
  answer_sources:
  - Web Server Access Logs
  - Zeek http.log
  - WAF Logs
  - API Gateway Logs
  - 'NAI: Public web servers, API endpoints, Cloud service management consoles'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      (sourcetype=web_access OR sourcetype=zeek_http OR sourcetype=waf OR sourcetype=api_gateway)
      | where match(uri, "(?i)(/actuator/env|/\.git/config|phpinfo\.php|/\.env|/wp-config|/server-status)")
      | table _time src_ip uri status
- question: Which source IPs issue more than 3 distinct information-disclosure probe-pattern matches within
    a 5-minute window relative to a robust per-IP baseline?
  context: A single stray request to a sensitive path may be noise, but multiple distinct probe-pattern
    hits in a short window indicate deliberate enumeration. Flagging IPs with more than 3 distinct probe
    matches in 5 minutes, with the threshold set robustly via Median Absolute Deviation over the per-IP
    baseline (Bohara et al.) to resist outlier contamination, separates targeted information-disclosure
    scanning from incidental hits. A flagged IP is actively searching for exposed sensitive files.
  answer_sources:
  - Web Server Access Logs
  - Zeek http.log
  - WAF Logs
  - API Gateway Logs
  - 'NAI: Public web servers, API endpoints, Cloud service management consoles'
  range: Last 90 days; evaluate in 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      (sourcetype=web_access OR sourcetype=zeek_http OR sourcetype=waf OR sourcetype=api_gateway)
      | where match(uri, probe_pattern_regex)
      | bin _time span=5m
      | stats dc(probe_pattern) AS hits BY _time src_ip
      | eventstats median(hits) AS med | eval mad = median(abs(hits-med))
      | where hits > 3 AND hits > med + 3*1.4826*mad
- question: When benign URI-request sequences are modeled with a Markov chain or RNN, which source IPs
    produce request sequences with low probability under the benign model, and which transitions triggered
    the alert?
  context: Probing for information-disclosure paths produces request sequences that are improbable under
    normal application usage. Learning common benign URI-request sequences with a Markov chain/RNN and
    alerting when a source IP's sequence has low probability (generalizing the short-sequence anomaly
    model of A Sense of Self for Unix Processes) catches enumeration that single-URI rules miss. Reporting
    the improbable transitions helps the analyst confirm whether the sequence reflects probing or unusual-but-legitimate
    navigation.
  answer_sources:
  - Web Server Access Logs
  - Zeek http.log
  - WAF Logs
  - API Gateway Logs
  - 'NAI: Public web servers, API endpoints, Cloud service management consoles'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      transition_probs = train_markov(benign URI sequences)  # or RNN
      for each src_ip session:
          logp = sum(log P(uri_t | uri_{t-1}))
      alert where logp < benign_pctile(1%)
      emit transitions with lowest P(uri_t | uri_{t-1})
- question: When session features (distinct paths, probe-pattern hits, 4xx ratio, byte ratios) are scored
    with a One-Class SVM or Isolation Forest trained on benign traffic, which sessions are outliers, and
    which features explain them via LIME?
  context: A One-Class SVM or Isolation Forest trained on benign session features identifies outlier sessions
    whose distinct-path counts, probe-pattern hits, 4xx ratios, and byte ratios diverge from normal use.
    Surfacing the top contributing features via LIME (per Robust IoT Security Using Isolation Forest and
    One-Class SVM) provides explainable, poisoning-resistant outlier detection. An outlier session driven
    by probe hits and high 4xx ratio indicates active information-disclosure reconnaissance against the
    application.
  answer_sources:
  - Web Server Access Logs
  - Zeek http.log
  - WAF Logs
  - API Gateway Logs
  - 'NAI: Public web servers, API endpoints, Cloud service management consoles'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      X per session = [distinct_paths, probe_hits, ratio_4xx, bytes_in/bytes_out, req_rate]
      model = IsolationForest(contamination=0.01).fit(benign X)   # or OneClassSVM
      alert where model.predict(X) == -1
      emit LIME top contributing features per flagged session
