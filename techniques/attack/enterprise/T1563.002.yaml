  queries:
  - technology: SIEM/Stats pseudocode
    query: "source IN (WinEventLog:Security EventCode=4688, WinEventLog:Sysmon EventCode=1) Image=*tscon.exe*\n\
      | bin _time span=1h\n| stats count AS freq by host, ParentImage, IntegrityLevel, User, _time\n|\
      \ lookup baseline_tscon_tuples host ParentImage IntegrityLevel User OUTPUT baseline_pct\n| eval\
      \ rare = if(baseline_pct <= 5, 1, 0)\n| eval risk = (rare*40) + if(User=\"NT AUTHORITY\\\\SYSTEM\"\
      ,30,0)\n       + if(lower(ParentImage) IN (\"winword.exe\",\"powershell.exe\"),20,0) + (freq>5)*10\n\
      | where risk >= 50 OR baseline_pct <= 5\n| sort - risk    /* thresholds derived from 30+ days baseline\
      \ */"
