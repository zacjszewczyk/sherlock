name: 'T1563.002: RDP Hijacking'
id: b068276b-fe00-475b-a741-615728ff8e7b
description: 'This playbook helps an analyst investigate whether an adversary is moving laterally by hijacking
  a legitimate user''s Remote Desktop Protocol (RDP) session under the Lateral Movement tactic. RDP session
  hijacking lets an attacker steal an existing interactive session -- often without credentials or user
  prompts -- by abusing native Windows tooling such as `tscon.exe` (e.g., `tscon.exe <session> /dest:rdp-tcp#<N>`)
  from a SYSTEM context, or by using red-team tooling (Mimikatz/Metasploit RDP modules, RedSnarf). The
  hunt spans Windows endpoint and server telemetry and supporting network logs, and guides the analyst
  across several behavioral angles: detecting tscon redirect command-line signatures and rare SYSTEM/odd-parent
  tscon executions; correlating session-enumeration tooling (`quser.exe`/`query session`) that precedes
  a takeover; tracking RDP session reconnects (Event ID 4778) and disconnects (Event ID 4779) where the
  account name or client source IP changes mid-session without a corresponding new interactive logon (Event
  ID 4624 Type 10); and identifying anomalous process execution and outbound connections originating from
  an RDP logon session that match lateral-movement tooling or deviate from per-user/per-host baselines.
  Detection methods combine symbolic-logic rules, statistical baselining/rarity scoring, and machine-learning
  models (supervised classifiers, LSTM sequence/next-event models, link-prediction and graph-embedding
  approaches) applied to Windows Security events (4624, 4625, 4634, 4648, 4778, 4779, 4688), Sysmon (Event
  IDs 1 and 3), Windows System logs (7045), and Zeek conn.log, so the analyst can corroborate suspected
  RDP session hijacking against process lineage, session state, source-IP changes, and downstream lateral-movement
  activity.'
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
