  queries:
  - technology: SIEM/Stats pseudocode
    query: '/* baseline two-step process transitions per host/user */

      transitions = seq(prev_process -> next_process) by host, User

      | eval is_qt = (prev_process IN (quser.exe,query.exe) AND next_process=tscon.exe)

      | stats count AS seq_freq by host, User, is_qt

      | lookup user_seq_baseline host User OUTPUT pctile, ever_seen

      | eval score = if(is_qt AND (pctile>=99 OR ever_seen=0), 70, 0)

      | join host User [search EventCode=4625 earliest=-5m]   /* failed reconnects raise score */

      | eval score = score + (failed_logons*10)

      | where score >= 50   /* tune 5m window and percentile per environment */'
