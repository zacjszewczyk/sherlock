questions:
- question: '[Lateral Movement] Match tscon redirect patterns: Can you determine whether the process `tscon.exe`
    is executed with command-line arguments indicative of RDP session hijacking — most reliably a numeric
    session ID together with a redirect argument such as `/dest:rdp-tcp#<N>` — or another process runs
    known hijack-tool arguments (e.g., Metasploit/Mimikatz RDP modules), especially when the process runs
    in the `NT AUTHORITY\SYSTEM` context, is spawned by `services.exe`/`cmd.exe`/PsExec, and session-state
    telemetry shows no corresponding new interactive logon (Event ID 4624 Type 10). -- specifically, using
    the ''Match tscon redirect patterns'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary hijacks a legitimate
    user''s RDP session to take over an interactive desktop on a remote system and continue moving through
    the environment -- frequently without credentials or user prompts, and potentially inheriting a Domain
    Admin or other privileged session. This evidence focuses on the condition that the process `tscon.exe`
    is executed with command-line arguments indicative of RDP session hijacking — most reliably a numeric
    session ID together with a redirect argument such as `/dest:rdp-tcp#<N>` — or another process runs
    known hijack-tool arguments (e.g., Metasploit/Mimikatz RDP modules), especially when the process runs
    in the `NT AUTHORITY\SYSTEM` context, is spawned by `services.exe`/`cmd.exe`/PsExec, and session-state
    telemetry shows no corresponding new interactive logon (Event ID 4624 Type 10). This Symbolic Logic
    approach works as follows: Create a high-fidelity detection on process creation (Windows Event ID
    4688, Sysmon Event ID 1) where the command line matches the `tscon.exe` redirect signature `tscon(\.exe)?\s+\S+\s+/dest:rdp-tcp#\d+`
    or a bare `tscon.exe \d+ /dest:\S+`, per the canonical [Suspicious RDP Redirect Using TSCON Sigma
    rule](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_tscon_rdp_redirect/)
    derived from [Korznikov''s disclosure](http://www.korznikov.com/2017/03/0-day-or-feature-privilege-escalation.html).
    Raise severity when the integrity/user is `SYSTEM` or the parent is `services.exe`/`cmd.exe`/`psexesvc.exe`,
    since legitimate `tscon` use rarely runs as SYSTEM. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable RDP session hijacking; pivot to the responsible process
    and its parent lineage, the user and integrity context, the affected session ID/name and its original
    vs. current owner, the source client IP addresses, and any subsequent lateral-movement tooling run
    under the inherited session. A negative result helps rule out this particular hijacking vector but
    should be corroborated with the other questions in this playbook, since native living-off-the-land
    session takeover can evade any single method.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4624
  - Windows Event ID 4778
  - Windows Event ID 4779
  - 'NAI: Critical infrastructure servers (e.g., Domain Controllers, database servers), bastion hosts
    or jump servers, and workstations of privileged users (e.g., system administrators, developers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (WinEventLog:Security EventCode=4688, WinEventLog:Sysmon EventCode=1)\n| where CommandLine\
      \ MATCHES /(?i)tscon(\\.exe)?\\s+\\S+\\s+\\/dest:rdp-tcp#\\d+/\n       OR CommandLine MATCHES /(?i)tscon(\\\
      .exe)?\\s+\\d+\\s+\\/dest:\\S+/\n| eval severity = if(User=\"NT AUTHORITY\\\\SYSTEM\"\n       OR\
      \ lower(ParentImage) IN (\"services.exe\",\"cmd.exe\",\"psexesvc.exe\"), \"critical\", \"high\"\
      )\n| table _time, host, User, ParentImage, Image, CommandLine, severity"
- question: '[Lateral Movement] Score rare SYSTEM tscon parents: Can you determine whether the process
