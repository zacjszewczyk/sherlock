    runs in the `NT AUTHORITY\SYSTEM` context, is spawned by `services.exe`/`cmd.exe`/PsExec, and session-state
    telemetry shows no corresponding new interactive logon (Event ID 4624 Type 10). -- specifically, using
    the ''Score rare SYSTEM tscon parents'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary hijacks a legitimate
    user''s RDP session to take over an interactive desktop on a remote system and continue moving through
