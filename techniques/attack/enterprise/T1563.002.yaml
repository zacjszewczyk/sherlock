    known hijack-tool arguments (e.g., Metasploit/Mimikatz RDP modules), especially when the process runs
    in the `NT AUTHORITY\SYSTEM` context, is spawned by `services.exe`/`cmd.exe`/PsExec, and session-state
    telemetry shows no corresponding new interactive logon (Event ID 4624 Type 10). This Statistical Method
    approach works as follows: For all `tscon.exe` executions per host, baseline the (parent process,
    integrity level, invoking user) tuple and compute its rarity (flag the bottom 5th percentile). Generate
    a high-risk score for executions running as SYSTEM, by non-administrative users, or from unusual parents
    (e.g., `winword.exe`, `powershell.exe`), and track Frequency (count of `tscon` executions per host
    per hour) so scripted reassignment bursts stand out, following the per-feature anomaly scoring of
    [Bohara et al.](https://mnoureddine.com/files/17BOH01.pdf). Derive host-specific thresholds from 30+
    days of baseline. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable RDP session hijacking; pivot to the responsible process and its parent lineage, the user
    and integrity context, the affected session ID/name and its original vs. current owner, the source
    client IP addresses, and any subsequent lateral-movement tooling run under the inherited session.
    A negative result helps rule out this particular hijacking vector but should be corroborated with
    the other questions in this playbook, since native living-off-the-land session takeover can evade
    any single method.'
