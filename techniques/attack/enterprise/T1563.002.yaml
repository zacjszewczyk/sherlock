- question: '[Lateral Movement] Correlate quser to tscon: Can you determine whether a process creation
    event for `tscon.exe` containing a numeric session ID as an argument is observed on a host, preceded
    within a 5-minute window by a process creation event for `quser.exe` or `query.exe session` initiated
    by the same user account on the same host, which is strong evidence of deliberate session enumeration
    before hijacking. -- specifically, using the ''Correlate quser to tscon'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), an adversary hijacks a legitimate
    user''s RDP session to take over an interactive desktop on a remote system and continue moving through
    the environment -- frequently without credentials or user prompts, and potentially inheriting a Domain
    Admin or other privileged session. This evidence focuses on the condition that a process creation
    event for `tscon.exe` containing a numeric session ID as an argument is observed on a host, preceded
    within a 5-minute window by a process creation event for `quser.exe` or `query.exe session` initiated
    by the same user account on the same host, which is strong evidence of deliberate session enumeration
    before hijacking. This Symbolic Logic approach works as follows: Implement a stateful rule that fires
    when `quser.exe`/`query.exe` (with `session`/`user` arguments) is followed by a `tscon.exe` execution
    on the same host by the same user within a 5-minute window, validating the `tscon` command line contains
    a numeric session ID and ideally a `/dest:` argument. This enumeration-then-takeover chain is documented
    as a core lateral-movement artifact by [JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable RDP session
    hijacking; pivot to the responsible process and its parent lineage, the user and integrity context,
    the affected session ID/name and its original vs. current owner, the source client IP addresses, and
    any subsequent lateral-movement tooling run under the inherited session. A negative result helps rule
    out this particular hijacking vector but should be corroborated with the other questions in this playbook,
    since native living-off-the-land session takeover can evade any single method.'
