name: 'T1036.010: Masquerading: Masquerade Account Name'
id: 4185f6c3-a174-4a5c-9a7e-64b7e091348f
description: Hunt for adversaries who create or rename accounts so the names closely resemble legitimate
  user, service, root, or administrator accounts in order to blend into normal activity and evade detection
  (MITRE ATT&CK T1036.010). This playbook helps an analyst investigate suspicious account-creation and
  rename events across Windows (Event IDs 4720/4781/4732/4728/4756/4624/4625/4740), Linux auditd (adduser/usermod),
  cloud and identity providers (Azure AD audit, Okta lifecycle events), and container runtimes (Docker
  daemon). It covers threat-intelligence and typo-variant matching of new account names, entropy and character-distribution
  outlier analysis, creation-rate and failure-rate profiling, regex detection of admin/service name patterns
  created by unauthorized principals, anomalous-timing and burst forecasting, Unicode mixed-script/homoglyph
  and confusable-skeleton detection, Jaro-Winkler and edit-distance similarity to privileged accounts,
  clustering of name outliers, and correlation of newborn accounts with rapid privilege escalation, rare
  login origins, and anomalous network behavior. The goal is to surface masqueraded account names early
  and provide defensible, actionable evidence for the SOC.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a new Windows account (Event ID 4720) get created with a Target Account Name that exactly
    matches a curated blocklist of malicious/suspicious usernames, or an edit-distance-1 typo variant
    of a blocklist or privileged name (e.g., 'haxor', 'system.service', 'backup_admin', 'adm1n')?
  context: This question targets adversaries who masquerade newly created accounts under names that look
    benign or trustworthy in order to hide their persistence within the Stealth tactic. The analyst monitors
    Event ID 4720 'Target Account Name' and compares it against a curated blocklist of known-bad names;
    an exact match is high-confidence. To catch deliberate near-misses, also generate edit-distance-1
    variants (omission, insertion, substitution, transposition) of each blocklist and privileged name
    and match against those, following typosquatting enumeration research. A positive result means an
    attacker likely created an account intended to blend in; a negative result reduces (but does not eliminate)
    suspicion. Correlate with creation volume per creator and any immediately following 4625 failed logons
    or 4740 lockouts on the new name to strengthen confidence.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4625
  - Windows Event ID 4740
  - 'NAI: Domain Controllers, Member Servers, Privileged Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'blocklist = load(''malicious_usernames''); privileged = load(''privileged_names'')

      variants = blocklist | union(edit_distance_1(blocklist + privileged))

      events = winlog where EventCode=4720

      alert when lower(TargetAccountName) in variants

      enrich with count(4720) by SubjectUserName, and join 4625/4740 on TargetAccountName within 1h'
- question: Do the names of newly created Windows accounts (Event ID 4720) have Shannon entropy or character-distribution
    that is a statistical outlier (top/bottom 5th percentile) versus the baseline of legitimate account
    names?
  context: Adversaries either auto-generate account names (high entropy, unnatural character mix) or pick
    overly simplistic trustworthy-looking names (low entropy) to blend in under the Stealth tactic. The
    analyst computes Shannon entropy for each new username and flags values in the top or bottom 5th percentile
    of the environment's baseline, and adds Kullback-Leibler divergence of the name's character distribution
    against a natural-language baseline to catch algorithmically generated names. Percentile cutoffs should
    be derived from 30-90 days of observed account names per environment. A positive result flags a name
    that statistically does not look human-chosen and warrants review against privileged accounts; this
    method complements exact/blocklist matching by catching novel names.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4625
  - Windows Event ID 4740
  - 'NAI: Domain Controllers, Member Servers, Privileged Workstations'
  range: Last 90 days (derive baseline from 30-90 days of account names)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = entropy(TargetAccountName) over last 30-90d

      for each new 4720: e = shannon_entropy(name); kl = kl_divergence(char_dist(name), natural_lang)

      alert when e > p95(baseline) or e < p5(baseline) or kl > threshold'
- question: Is any creator account or host producing new accounts at a rate above its historical baseline
    (mean+3sigma), or are failed account creations, 4625 failed logons, or 4740 lockouts clustering on
    newly created names within an hour?
  context: Within the Stealth tactic an adversary masquerading account names may create accounts in bursts
    or trigger failures while probing names. The analyst establishes per-creator and per-host baselines
    of new accounts/hour (volume/frequency) and alerts when counts exceed mean+3sigma. As a distinct failure-mode
    signal, profile failed account creations and any 4625 failed logons or 4740 lockouts occurring within
    one hour on a newly created name, mirroring failed-logon thresholding from Splunk security content.
    A positive result indicates either automated/bulk account creation or a struggling actor testing masqueraded
    names; a negative result suggests creation activity is within normal operational bounds.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4625
  - Windows Event ID 4740
  - 'NAI: Domain Controllers, Member Servers, Privileged Workstations'
  range: Last 90 days (baseline per-creator/per-host hourly rates)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'rate = count(4720) by SubjectUserName, Computer, bucket=1h

      alert when rate > mean(rate)+3*stddev(rate)

      fails = join(4625,4740) on TargetAccountName where ts within 1h of 4720

      alert when count(fails) > 0'
- question: Does a machine-learning classifier score a new account-creation event (Event ID 4720) as high-risk
    (confidence > 0.9) based on name length, character-type ratios, creator context, and time of day?
  context: Rule and statistical methods miss novel masquerade patterns; an ML classifier generalizes across
    them to support the Stealth-tactic detection. The analyst trains a Random Forest on labeled account-creation
    events using features such as name length, character-type ratios, creator group membership, and time
    of day, and alerts on predictions with confidence above 0.9. To make alerts actionable, surface the
    top-3 SHAP-ranked contributing features (e.g., 'creator not in IT group', 'name entropy', 'off-hours')
    in the alert text. A high-confidence positive prediction should be triaged as a likely masqueraded
    account; the SHAP features explain why it fired and speed analyst triage.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4625
  - Windows Event ID 4740
  - 'NAI: Domain Controllers, Member Servers, Privileged Workstations'
  range: Last 90 days (model trained on historical labeled creations)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [name_len, upper_ratio, digit_ratio, special_ratio, creator_in_IT, hour_of_day]

      model = RandomForest.load(''acct_risk'')

      p = model.predict_proba(features)

      alert when p > 0.9 with top3 = shap_top_features(model, features)'
- question: Was a Windows account created (Event ID 4720) whose Target Account Name matches service/admin
    patterns (e.g., 'svc_*', '*_adm', 'backup*', 'admin*', 'root*', 'help*') by a Creator Subject that
    is NOT an allowlisted IT administrator or provisioning service principal?
  context: Adversaries frequently masquerade as service or administrator accounts using trustworthy naming
    conventions to blend in under the Stealth tactic. The analyst alerts on Event ID 4720 events whose
    'Target Account Name' matches a curated set of service/admin regex patterns unless the creating subject
    is an allowlisted admin or service principal. The pattern set should also include common trustworthy-name
    lures documented for this technique (e.g., 'help', 'root', 'backup'). A positive result — a privileged-looking
    name created by an unauthorized actor — is a strong masquerade indicator; legitimate provisioning
    by allowlisted principals is filtered out to reduce noise.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Cloud IAM Services (e.g., Azure AD)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'patterns = /^(svc_|backup|admin|root|help)/ or /_adm$/

      allowlist = load(''authorized_creators'')

      events = winlog where EventCode=4720

      alert when regex_match(TargetAccountName, patterns) and SubjectUserName not in allowlist'
- question: Are service/admin pattern-matching accounts being created at anomalous times that fall outside
    the 95% confidence interval of historical creation timing (e.g., 02:00 on a Saturday)?
  context: Legitimate privileged-account provisioning typically follows business-hour patterns; adversaries
    masquerading account names within the Stealth tactic often act off-hours. The analyst compares creation
    timestamps of pattern-matching accounts against a 95% confidence interval derived from historical
    creation timing and triggers when events fall outside normal windows. Additionally, track state by
    separately counting successful versus failed creations of pattern-matching names. A positive result
    — a privileged-pattern account created at an unusual time — raises suspicion of covert account creation;
    combine with the unauthorized-creator signal for higher confidence.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Cloud IAM Services (e.g., Azure AD)'
  range: Last 90 days (historical creation-timing baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "ci = confidence_interval(creation_hour for pattern_accounts, level=0.95)\nfor each new 4720\
      \ matching service/admin pattern:\n  alert when creation_time outside ci\ntrack count(success),\
      \ count(fail) by pattern"
- question: Does the hourly count of service/admin pattern account creations exceed the forecast upper
    confidence interval from a time-series model (SARIMA/Prophet), indicating an anomalous burst?
  context: Bursts of privileged-looking account creations can indicate an adversary rapidly establishing
    masqueraded persistence under the Stealth tactic. The analyst models historical hourly counts of service/admin
    pattern creations with SARIMA or Prophet and flags bursts that exceed the forecast upper confidence
    interval. The alert should include the forecast value, the observed value, and the contributing creator/host
    so analysts can triage without re-querying. A positive result indicates abnormally many privileged-pattern
    creations relative to seasonal expectation; a negative result means creation volume is within forecast
    bounds.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Cloud IAM Services (e.g., Azure AD)'
  range: Last 90 days (model on historical hourly counts)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = hourly_count(4720 where pattern_match)

      model = Prophet/SARIMA.fit(series)

      fc = model.forecast()

      alert when observed > fc.upper_ci with {forecast, observed, creator, host}'
- question: Was a Windows account created or renamed (Event ID 4720, 4781) with a name that is mixed-script
    (e.g., Latin+Cyrillic) or contains confusable/homoglyph characters when normalized with the UTS#39
    skeleton algorithm (e.g., 'ɑdmin' vs 'admin')?
  context: Adversaries use homoglyphs and mixed-script characters to create account names that visually
    impersonate privileged accounts while remaining technically distinct, a core Stealth-tactic masquerade.
    The analyst normalizes account creation/rename names (Event ID 4720, 4781) with the UTS#39 skeleton()
    algorithm and flags any identifier that is mixed-script or whose characters appear in the Unicode
    confusables mapping. Mixed-script identifiers should alert outright for manual review against privileged
    accounts. A positive result reveals a name engineered to look like a trusted one; this defeats naive
    string matching that treats the bytes as different.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4781
  - 'NAI: Domain Controllers, HR Systems, Financial Systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each 4720/4781 name:\n  scripts = detect_scripts(name)\n  alert when len(scripts) > 1\
      \ (mixed-script)\n  alert when any(ch in unicode_confusables for ch in name)"
- question: When a new account name is mapped to its UTS#39 confusable skeleton (lowercased, alphanumerics
    only), is its Damerau-Levenshtein distance to a privileged-account skeleton <= 2 while the original
    un-normalized names still differ?
  context: This catches homoglyph/typosquat substitutions where the visible name collapses onto a privileged
    account's skeleton even though the raw strings differ — a precise Stealth-tactic masquerade indicator.
    The analyst maps each new name to its UTS#39 confusable skeleton, lowercases it, strips non-alphanumerics,
    then computes Damerau-Levenshtein distance to privileged-account skeletons; a distance of 2 or less,
    combined with originals that differ, indicates deliberate confusable substitution. A positive result
    means the account is very likely impersonating a privileged name; the small distance threshold keeps
    false positives low.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4781
  - 'NAI: Domain Controllers, HR Systems, Financial Systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "priv_skel = {skeleton(p).lower().alnum() for p in privileged}\nfor each new name n:\n  s =\
      \ skeleton(n).lower().alnum()\n  d = min(damerau_levenshtein(s, ps) for ps in priv_skel)\n  alert\
      \ when d <= 2 and n != matched_privileged_original"
- question: Does a learned visual-similarity model (Siamese CNN or character-level autoencoder) flag a
    new account name as visually confusable with a privileged account name despite passing character-substitution
    rules?
  context: Some homoglyph attacks defeat rule-based confusable mappings; a learned model that compares
    strings rendered as images catches them, supporting the Stealth tactic. The analyst uses a Siamese
    CNN that compares rendered string images, or a character-level autoencoder that flags reconstruction
    error greater than 3 standard deviations, to detect visually confusable names. The alert should emit
    the nearest privileged account name and the similarity/distance score so analysts immediately see
    why it fired. A positive result indicates the name looks like a privileged account to the human eye
    even if it evades character rules; this is a high-value catch for sophisticated actors.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4781
  - 'NAI: Domain Controllers, HR Systems, Financial Systems'
  range: Last 90 days (model trained on rendered name images)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'img = render(name); model = SiameseCNN.load(''homoglyph'')

      for p in privileged: score = model.similarity(img, render(p))

      alert when max(score) > threshold with {nearest_priv, score}

      # alt: autoencoder reconstruction_error(name) > mean+3*std'
- question: Does a newly created or renamed account name (Event ID 4720, 4781) exactly match a pre-generated
    list of edit-distance-1 typosquat variations (omission, insertion, substitution, transposition) of
    any critical/privileged account name?
  context: Adversaries typosquat privileged account names (e.g., 'admnistrator' vs 'administrator') to
    masquerade under the Stealth tactic. The analyst pre-generates edit-distance-1 typosquat variations
    of every critical/privileged account name and alerts on exact matches of new names against this list.
    This is a fast, low-false-positive deterministic check that catches the most common single-character
    mistakes an attacker uses to look legitimate. A positive result is a strong indicator of intentional
    impersonation of a known privileged account.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4781
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'typosquats = union(edit_distance_1(p) for p in privileged)

      events = winlog where EventCode in (4720,4781)

      alert when lower(TargetAccountName) in typosquats'
- question: Is the Jaro-Winkler similarity between a new account name and any privileged account name
    in the top 1% (e.g., > 0.95), indicating a likely typosquatting attempt?
  context: Jaro-Winkler weighting rewards shared prefixes, making it well suited to catching account names
    that closely approximate privileged ones — a Stealth-tactic masquerade. The analyst computes Jaro-Winkler
    similarity of each new name versus the privileged-account set and flags scores in the top 1% (e.g.,
    > 0.95), calibrating the cutoff per environment against the observed distribution of legitimate name
    pairs. A positive result means the new name is suspiciously close to a privileged name without being
    identical; per-environment calibration keeps benign similar-but-legitimate names from overwhelming
    the analyst.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4781
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, User Endpoints'
  range: Last 90 days (calibrate cutoff to environment name-pair distribution)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each new name n:\n  s = max(jaro_winkler(n, p) for p in privileged)\n  alert when s >\
      \ p99(legit_pair_scores)  # e.g., >0.95\n  emit nearest_privileged = argmax_p"
- question: When account names are vectorized with character n-gram TF-IDF (or a learned embedding) and
    clustered with DBSCAN, are new accounts labeled as noise/singletons — especially those also scoring
    high Jaro-Winkler similarity to privileged accounts?
  context: Masqueraded names often sit apart from the natural clusters of legitimate naming conventions;
    density-based clustering surfaces them for the Stealth tactic. The analyst vectorizes all account
    names with character n-gram TF-IDF or a learned embedding and clusters with DBSCAN, then investigates
    new accounts labeled noise/singletons, prioritizing those also scoring high Jaro-Winkler similarity
    to privileged accounts. The alert should include the nearest cluster label and nearest privileged
    name for triage. A positive result flags a name that does not fit established conventions and resembles
    a privileged account — a strong combined signal of deliberate masquerade.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4781
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = tfidf_char_ngrams(all_account_names)\nlabels = DBSCAN(eps, min_samples).fit_predict(X)\n\
      for new accounts where label == -1 (noise):\n  jw = max(jaro_winkler(name, p) for p in privileged)\n\
      \  alert with {nearest_cluster, nearest_priv, jw}"
- question: Does a newly created account (Event ID 4720) get added to a privileged/administrative group
    (Event ID 4728, 4732, 4756) within one hour of creation, especially a high-privilege group?
  context: A masqueraded account that immediately gains administrative rights is a high-confidence sign
    of adversary persistence and privilege escalation following the Stealth-tactic name masquerade. The
    analyst correlates Event ID 4720 creations with subsequent 4728/4732/4756 privileged-group additions
    within one hour, especially for high-privilege groups, and alerts as critical. A positive result —
    a 'newborn' account rapidly promoted to admin — is rarely benign and warrants immediate response;
    the tight time window and high-privilege focus keep it precise.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4781
  - Windows Event ID 4624
  - Windows Event ID 4728
  - Windows Event ID 4732
  - 'NAI: Domain Controllers, Network Gateway, DNS Servers, Endpoint Devices'
  range: Last 90 days (correlate creation-to-promotion within 1 hour)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'creations = 4720 keyed by TargetAccountName, ts_create

      adds = 4728/4732/4756 keyed by MemberName, GroupName, ts_add

      alert critical when ts_add - ts_create <= 1h and GroupName in high_priv_groups'
- question: For accounts younger than 7 days, do interactive logins (Event ID 4624) originate from rare
    countries/ASNs (below the 5th percentile), or show anomalous data volume, failed/blocked connections,
    or NXDOMAIN responses in Zeek conn.log?
  context: Newly created masqueraded accounts that log in from unusual locations or exhibit anomalous
    network behavior likely belong to an external actor operating under the Stealth tactic. The analyst
    correlates interactive logins of accounts younger than 7 days with Zeek conn.log, enriches source
    IPs, and increments a risk score when country/ASN frequency falls below the 5th percentile, escalating
    past a tuned threshold. Add volume (bytes sent/received per session) and failure-mode signals (failed/blocked
    connection counts, NXDOMAIN responses) as distinct contributors, consistent with structural-anomaly
    login scoring. A positive result indicates a young account behaving like an attacker foothold; risk
    scoring combines weak signals into a defensible escalation.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4781
  - Windows Event ID 4624
  - Windows Event ID 4728
  - Windows Event ID 4732
  - 'NAI: Domain Controllers, Network Gateway, DNS Servers, Endpoint Devices'
  range: Last 90 days (focus on accounts < 7 days old; event-centered on first logins)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "young = accounts where age < 7d\nfor login 4624 by young account:\n  ip = enrich(SourceIP);\
      \ risk = 0\n  risk += (freq(country/ASN) < p5)\n  risk += volume_anomaly(conn.log bytes)\n  risk\
      \ += failed_conn_count + nxdomain_count\n  alert when risk > tuned_threshold"
  - technology: Zeek/pseudocode
    query: 'conn = conn.log where id.orig_h in young_account_hosts

      summarize bytes_sent, bytes_recv, failed_conns by uid

      join dns.log for NXDOMAIN(rcode=3) counts'
- question: Does the time from account creation to its first privileged action fall in the fastest 1%
    of historical timelines, per a survival-analysis/anomaly model?
  context: Adversaries operationalize masqueraded accounts far faster than legitimate onboarding does;
    modeling time-to-action surfaces this under the Stealth tactic. The analyst trains a survival-analysis
    or anomaly model on the time from account creation to first privileged action and alerts when a new
    account acts within the fastest 1% of historical timelines. The alert should report the top-3 contributing
    features (e.g., 'minutes-to-admin', 'rare source ASN', 'off-hours creation') for interpretable triage.
    A positive result means an account was weaponized abnormally quickly after creation — a behavior strongly
    associated with attacker-controlled masqueraded accounts.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4781
  - Windows Event ID 4624
  - Windows Event ID 4728
  - Windows Event ID 4732
  - 'NAI: Domain Controllers, Network Gateway, DNS Servers, Endpoint Devices'
  range: Last 90 days (model on historical create-to-action timelines)
  queries:
  - technology: SIEM/ML pseudocode
    query: 't = time(first_privileged_action) - time(4720_creation)

      model = survival_anomaly.fit(historical_t)

      alert when t in fastest 1% with top3 = explain(model, features)'
