questions:
- question: '[Resource Development] Hash IOC correlation: Can you determine whether the MD5, SHA1, or
    SHA256 hash of a process executable or a file transferred over the network matches a known-malicious
    hash from a threat intelligence source specializing in newly developed malware. -- specifically, using
    the ''Hash IOC correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary develops their
    own capabilities in-house -- malware, exploits, implants, or self-signed certificates -- rather than
    buying, downloading, or stealing them. Although much of this development happens outside your visibility,
    the resulting tooling is eventually deployed into your environment, so detection focuses on the novel,
    low-prevalence, or anomalous artifacts that newly developed capabilities leave on endpoints and on
    the wire. This evidence focuses on the condition that the MD5, SHA1, or SHA256 hash of a process executable
    or a file transferred over the network matches a known-malicious hash from a threat intelligence source
    specializing in newly developed malware. This Symbolic Logic approach works as follows: Continuously
    join Windows Event ID 4688/Sysmon Event ID 1 process creations and Zeek files.log/conn.log transfers
    against a curated threat-intel feed of newly developed malicious hashes and escalate immediately on
    any match; feed confirmed samples into the EMBER2024 feature pipeline for family attribution. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates a newly developed or otherwise
    rare adversary capability operating in your environment; pivot to the responsible host and user, the
    process and its parent lineage, the file hash and any sibling samples, the destination infrastructure
    and its registration/reputation, and the TLS/certificate fingerprints to scope the intrusion and attribute
    the tooling. A negative result helps rule out this particular indicator but should be corroborated
    with the other questions in this playbook, since a sophisticated actor''s bespoke capability may evade
    any single method; many of these artifacts are most reliably caught at related Defense Evasion and
    Command-and-Control stages of the adversary lifecycle. Source references for this method: [EMBER2024](https://github.com/FutureComputing4AI/EMBER2024).'
