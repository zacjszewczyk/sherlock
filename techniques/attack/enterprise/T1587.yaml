name: 'T1587: Develop Capabilities'
id: 1a9c09e0-d82d-47d3-9a0c-65d36386ca30
description: 'This playbook helps an analyst investigate whether an adversary has deployed an in-house
  developed capability -- custom malware, exploits, implants, or self-signed certificates (MITRE ATT&CK
  T1587, Develop Capabilities) -- inside the environment. Because the actual development happens outside
  the target''s visibility, the hunt concentrates on the deployment artifacts these bespoke capabilities
  leave behind on endpoints and on the network. It pursues the behavior from several complementary angles:
  process executable and network file hashes that match newly-developed-malware threat intelligence or
  are low-prevalence/high-entropy across the fleet; TLS handshakes whose JA3/JA3S/JA4 fingerprints are
  statistically rare or match known implant lists, suggesting a non-standard custom client; short-window
  process behavior chains (novel executable creation, persistence via service/scheduled task/Run key,
  then external callout); outbound traffic exhibiting beaconing cadence or large staging uploads to newly
  registered or low-reputation domains; and disposable/self-signed C2 certificates with short validity,
  recent not_before dates, or low-entropy subject/issuer fields. Detection methods combine deterministic
  symbolic-logic rules (hash and JA3 watchlists, self-signed and NRD correlation, event-sequence correlation),
  statistical baselining (fleet hash prevalence and binary entropy, rare JA3 and parent-child frequency,
  beacon/staging cadence and certificate entropy), and machine learning (gradient-boosted PE-feature classifiers,
  JA3 clustering, HMM/RNN sequence likelihood scoring, continuous-time HMM/LSTM cadence models, and certificate
  risk classifiers), applied across Windows Security and Sysmon events and Zeek conn/ssl/dns/files logs,
  so the analyst can corroborate a suspected bespoke capability against process lineage, file provenance,
  network fingerprints, infrastructure reputation, and upload volume.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
