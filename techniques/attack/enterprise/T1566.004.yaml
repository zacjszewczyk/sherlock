name: 'T1566.004: Spearphishing Voice'
id: 60ae4181-1f1d-4a82-8e6f-8cb50e2d1870
description: 'This playbook helps an analyst investigate Spearphishing Voice (vishing / telephone-oriented
  attack delivery), a variant of spearphishing in which an adversary uses a phone call or other voice
  communication to socially engineer a user -- often by impersonating a trusted source and creating urgency
  -- into taking actions that grant the attacker access to victim systems. Because the lure itself is
  delivered out-of-band over voice, there is rarely a malicious email or attachment to detect; instead
  the analyst must hunt the on-host and network consequences of a successful call. As part of the Initial
  Access tactic, this playbook guides the analyst across several correlated behavioral angles: endpoint
  connections to vishing/TOAD threat-intel domains and lookalike/homoglyph lures resolved via corporate
  DNS and proxies; creation of non-approved remote access tools (AnyDesk, TeamViewer, ScreenConnect, RustDesk,
  GoToAssist, Atera, Splashtop, Zoho Assist) outside sanctioned deployment channels; command-line interpreters
  launched with obfuscation, remote-download, or security-control-tamper arguments; tightly-correlated
  web-request -> file-download -> execution sequences from user-writable paths; MFA push-bombing bursts
  followed by anomalous successful logins where the user was coached over the phone; and long-lived or
  high-volume outbound connections to never-before-seen destinations indicative of remote-access or C2
  sessions. Detection methods combine symbolic-logic rules, statistical baselining/anomaly scoring, and
  machine-learning models applied to Zeek conn/dns/http/files/ssl logs, Windows Event IDs 4688 and 4104,
  and cloud identity logs (Azure AD Sign-In, Okta System Log, M365 unified audit, Windows 4624), so the
  analyst can corroborate suspected vishing-driven intrusion across DNS, process lineage, network egress,
  and identity telemetry.'
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
