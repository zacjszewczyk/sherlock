  - technology: SIEM/Stats pseudocode
    query: 'EventID=4688 where NewProcessName IN (powershell.exe,cmd.exe)

      | eval H = shannon_entropy(CommandLine)

      | where H >= percentile(H,99) OR H > 7.2

      | append (stats mean(len) as mu, stdev(len) as sd by user | where len(CommandLine) > mu + 3*sd)'
