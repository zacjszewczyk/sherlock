    traffic shows a connection (DNS query, HTTP request, or direct TCP connection) to a destination URL,
    domain, or IP address present on a high-confidence threat intelligence feed specifically tracking
    vishing or social engineering campaigns. This Machine Learning approach works as follows: Score domain
    names from dns.log with a lexical classifier using Shannon entropy, length, n-grams, and character-class
    counts, and a Siamese-network homoglyph embedding that returns the nearest legitimate brand; investigate
    non-allowlisted domains receiving a high malicious score (prioritizing those also flagged statistically)
    and surface the top-3 contributing features and the matched brand in the alert text [NIOM-DGA: Nature-Inspired
    Feature Selection for DGA Detection](https://www.sciencedirect.com/science/article/pii/S0167404825002500)
    [Detecting Homoglyph Attacks with a Siamese Neural Network, Woodbridge et al.](https://arxiv.org/abs/1805.09738).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
    a user was manipulated over voice into granting access, installing remote-access tooling, running
    attacker-supplied commands, or approving fraudulent authentication; pivot to the responsible user
    and device, the parent process lineage, the destination infrastructure, the timing of any user-reported
    call, and subsequent authenticated or remote-access activity. A negative result helps rule out this
    particular vishing consequence but should be corroborated with the other questions in this playbook,
    since voice-delivered social engineering is multi-stage and any single method can miss living-off-the-land
    or low-volume activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network egress points (e.g., firewalls, web proxies), Corporate DNS resolvers, VPN concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'dns.log

      | eval feats = [shannon_entropy(query), len(query), ngram_score(query), charclass_counts(query)]

      | score = lexical_clf(feats); brand = siamese_homoglyph_nn(query)

      | where query NOT IN allowlist AND score >= 0.9

      | emit query, score, nearest_brand=brand, top3_features(feats)'
- question: '[Initial Access] RMM watchlist with parent allow-list and renamed-binary check: Can you determine
    whether a process for a non-approved remote access tool (e.g., AnyDesk, TeamViewer, GoToAssist, RustDesk,
    ScreenConnect) is created on an endpoint, and the parent process is not an authorized software deployment
    or IT administration tool (e.g., SCCM, Intune, Tanium). -- specifically, using the ''RMM watchlist
    with parent allow-list and renamed-binary check'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), The adversary is trying to get
    into your network. Spearphishing Voice succeeds entirely over a phone call, so the malicious lure
    leaves little or no email evidence; the analyst must instead detect the downstream host and network
    behavior a coached victim performs. This evidence focuses on the condition that a process for a non-approved
    remote access tool (e.g., AnyDesk, TeamViewer, GoToAssist, RustDesk, ScreenConnect) is created on
    an endpoint, and the parent process is not an authorized software deployment or IT administration
    tool (e.g., SCCM, Intune, Tanium). This Symbolic Logic approach works as follows: Alert on Windows
    Event ID 4688 (or Sysmon Event ID 1) where NewProcessName/OriginalFileName/Description matches a watchlist
    of RMM tools (AnyDesk, TeamViewer, ScreenConnect, RustDesk, GoToAssist, Atera, Splashtop, Zoho Assist)
    and CreatorProcessName is not on an allow-list of approved deployers (CcmExec.exe, IntuneManagementExtension.exe,
    TaniumClient.exe); additionally flag binaries whose file hash executes under multiple names to catch
    renamed portable copies [Remote Access Tool - AnyDesk Execution, Sigma](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_remote_access_tools_anydesk/)
    [CISA AA23-025A: Malicious Use of RMM Software](https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-025a)
    [CAR-2013-05-009, MITRE](https://car.mitre.org/analytics/CAR-2013-05-009/). A positive result -- a
    rule match, statistical outlier, or model alert -- is a strong indicator that a user was manipulated
    over voice into granting access, installing remote-access tooling, running attacker-supplied commands,
    or approving fraudulent authentication; pivot to the responsible user and device, the parent process
    lineage, the destination infrastructure, the timing of any user-reported call, and subsequent authenticated
    or remote-access activity. A negative result helps rule out this particular vishing consequence but
    should be corroborated with the other questions in this playbook, since voice-delivered social engineering
    is multi-stage and any single method can miss living-off-the-land or low-volume activity.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User workstations and laptops, Virtual Desktop Infrastructure (VDI) instances, Help desk operator
    consoles'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID=4688 OR Sysmon EventID=1

      | where lower(NewProcessName|OriginalFileName|Description) IN rmm_watchlist(anydesk,teamviewer,screenconnect,rustdesk,gotoassist,atera,splashtop,zohoassist)

      | where CreatorProcessName NOT IN allowlist(CcmExec.exe,IntuneManagementExtension.exe,TaniumClient.exe)

      | alert

      | append (EventID=4688 | stats dc(NewProcessName) as names by Hashes | where names>1)'
- question: '[Initial Access] Endpoint prevalence of executable: Can you determine whether a process for
    a non-approved remote access tool (e.g., AnyDesk, TeamViewer, GoToAssist, RustDesk, ScreenConnect)
    is created on an endpoint, and the parent process is not an authorized software deployment or IT administration
