    or low-volume activity.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User workstations and laptops, Virtual Desktop Infrastructure (VDI) instances, Help desk operator
    consoles'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'EventID=4688

      | features = [proc_name, parent_name, len(cmdline), user_context]

      | clusters = DBSCAN(features, eps, min_samples)

      | where cluster.size small AND cluster NOT IN benign_deploy_patterns

      | flag clusters containing rmm_names; emit top3_distinguishing_features(cluster)'
- question: '[Initial Access] Regex for obfuscation, download, and security-control modification: Can
    you determine whether a command-line interpreter (e.g., powershell.exe, cmd.exe, cscript.exe, mshta.exe)
    is executed with arguments containing indicators of obfuscation (e.g., Base64), remote file download,
    or security control modification. -- specifically, using the ''Regex for obfuscation, download, and
    security-control modification'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), The adversary is trying to get
    into your network. Spearphishing Voice succeeds entirely over a phone call, so the malicious lure
    leaves little or no email evidence; the analyst must instead detect the downstream host and network
    behavior a coached victim performs. This evidence focuses on the condition that a command-line interpreter
    (e.g., powershell.exe, cmd.exe, cscript.exe, mshta.exe) is executed with arguments containing indicators
    of obfuscation (e.g., Base64), remote file download, or security control modification. This Symbolic
    Logic approach works as follows: Scan command-line arguments in Event ID 4688 and script-block content
    in Event ID 4104 with regular expressions for ''-enc'', ''DownloadString'', ''Invoke-Expression'',
    ''IEX'', ''Set-MpPreference -DisableRealtimeMonitoring'', and Base64-encoded strings with PowerShell
    headers, alerting on any match [Caught Beneath the Landline: Telephone-Oriented Attack Delivery, Proofpoint](https://www.proofpoint.com/us/blog/threat-insight/caught-beneath-landline-411-telephone-oriented-attack-delivery).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
    a user was manipulated over voice into granting access, installing remote-access tooling, running
    attacker-supplied commands, or approving fraudulent authentication; pivot to the responsible user
    and device, the parent process lineage, the destination infrastructure, the timing of any user-reported
    call, and subsequent authenticated or remote-access activity. A negative result helps rule out this
    particular vishing consequence but should be corroborated with the other questions in this playbook,
    since voice-delivered social engineering is multi-stage and any single method can miss living-off-the-land
    or low-volume activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: User workstations, Laptops, Application servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID=4688 (CommandLine) OR EventID=4104 (ScriptBlockText)

      | where regex_match(text, ''(?i)(-enc|DownloadString|Invoke-Expression|\\bIEX\\b|Set-MpPreference\\s+-DisableRealtimeMonitoring|[A-Za-z0-9+/]{200,}={0,2})'')

      | alert'
- question: '[Initial Access] Command-line entropy and length outliers: Can you determine whether a command-line
