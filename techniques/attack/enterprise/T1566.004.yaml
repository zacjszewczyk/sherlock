    those containing RMM names) and surface the top-3 distinguishing features per flagged cluster [Detecting
    and Characterizing Lateral Phishing at Scale, Ho et al.](https://www.usenix.org/conference/usenixsecurity19/presentation/ho).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
