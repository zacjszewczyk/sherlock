questions:
- question: '[Initial Access] Threat-intel + lookalike domain match: Can you determine whether an endpoint''s
    network traffic shows a connection (DNS query, HTTP request, or direct TCP connection) to a destination
    URL, domain, or IP address present on a high-confidence threat intelligence feed specifically tracking
    vishing or social engineering campaigns. -- specifically, using the ''Threat-intel + lookalike domain
    match'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), The adversary is trying to get
    into your network. Spearphishing Voice succeeds entirely over a phone call, so the malicious lure
    leaves little or no email evidence; the analyst must instead detect the downstream host and network
    behavior a coached victim performs. This evidence focuses on the condition that an endpoint''s network
    traffic shows a connection (DNS query, HTTP request, or direct TCP connection) to a destination URL,
    domain, or IP address present on a high-confidence threat intelligence feed specifically tracking
    vishing or social engineering campaigns. This Symbolic Logic approach works as follows: Match the
    ''query'' field in dns.log, ''host'' in http.log, and ''id.resp_h'' in conn.log against high-confidence
    vishing/TOAD threat-intel lists and against domains within 1-2 Damerau-Levenshtein edits or homoglyph
    distance of protected brand/partner domains, generating a high-severity alert on any match [The Landscape
    of Domain Name Typosquatting, Spaulding et al.](https://arxiv.org/abs/1603.02767) [Caught Beneath
    the Landline: Telephone-Oriented Attack Delivery, Proofpoint](https://www.proofpoint.com/us/blog/threat-insight/caught-beneath-landline-411-telephone-oriented-attack-delivery).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
    a user was manipulated over voice into granting access, installing remote-access tooling, running
    attacker-supplied commands, or approving fraudulent authentication; pivot to the responsible user
    and device, the parent process lineage, the destination infrastructure, the timing of any user-reported
    call, and subsequent authenticated or remote-access activity. A negative result helps rule out this
    particular vishing consequence but should be corroborated with the other questions in this playbook,
    since voice-delivered social engineering is multi-stage and any single method can miss living-off-the-land
    or low-volume activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network egress points (e.g., firewalls, web proxies), Corporate DNS resolvers, VPN concentrators'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'dns.log, http.log, conn.log

      | eval dom = coalesce(query, host, resolve(id.resp_h))

      | lookup vishing_toad_ti dom OUTPUT ti_match

      | eval lookalike = (damerau_levenshtein(dom, brand_domains) <= 2) OR homoglyph_match(dom, brand_domains)

      | where ti_match=true OR lookalike=true

      | eval severity="high" | alert'
- question: '[Initial Access] Rarity, age, and resolution-failure scoring: Can you determine whether an
    endpoint''s network traffic shows a connection (DNS query, HTTP request, or direct TCP connection)
    to a destination URL, domain, or IP address present on a high-confidence threat intelligence feed
    specifically tracking vishing or social engineering campaigns. -- specifically, using the ''Rarity,
    age, and resolution-failure scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), The adversary is trying to get
    into your network. Spearphishing Voice succeeds entirely over a phone call, so the malicious lure
    leaves little or no email evidence; the analyst must instead detect the downstream host and network
    behavior a coached victim performs. This evidence focuses on the condition that an endpoint''s network
    traffic shows a connection (DNS query, HTTP request, or direct TCP connection) to a destination URL,
    domain, or IP address present on a high-confidence threat intelligence feed specifically tracking
    vishing or social engineering campaigns. This Statistical Method approach works as follows: For all
    domains in dns.log compute enterprise request frequency over a 30-day window and isolate the bottom
    1st percentile of prevalence; enrich with WHOIS and flag domains registered in the last 30 days or
    with privacy-protected registration, and rank candidates with Directed Anomaly Scoring to bound daily
    alert volume. Separately profile the NXDOMAIN/failed-resolution rate per host as a distinct failure
    signal, since lure domains are often newly stood up and intermittently resolve [EXPOSURE: Passive
    DNS Analysis, Bilge et al.](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf) [Detecting
    Credential Spearphishing Attacks in Enterprise Settings, Ho et al.](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
    a user was manipulated over voice into granting access, installing remote-access tooling, running
    attacker-supplied commands, or approving fraudulent authentication; pivot to the responsible user
    and device, the parent process lineage, the destination infrastructure, the timing of any user-reported
    call, and subsequent authenticated or remote-access activity. A negative result helps rule out this
    particular vishing consequence but should be corroborated with the other questions in this playbook,
    since voice-delivered social engineering is multi-stage and any single method can miss living-off-the-land
    or low-volume activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network egress points (e.g., firewalls, web proxies), Corporate DNS resolvers, VPN concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'dns.log over 30d

      | stats count by query, src_host

      | eval prevalence = count / total_requests

      | where prevalence <= percentile(prevalence,1)

      | lookup whois query OUTPUT reg_date, privacy

      | where age_days(reg_date) <= 30 OR privacy=true

      | rank by directed_anomaly_score desc

      | append (dns.log | stats nxdomain_rate by src_host | where nxdomain_rate > baseline)'
- question: '[Initial Access] Lexical / homoglyph domain classifier with explainable match: Can you determine
    whether an endpoint''s network traffic shows a connection (DNS query, HTTP request, or direct TCP
    connection) to a destination URL, domain, or IP address present on a high-confidence threat intelligence
    feed specifically tracking vishing or social engineering campaigns. -- specifically, using the ''Lexical
    / homoglyph domain classifier with explainable match'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), The adversary is trying to get
    into your network. Spearphishing Voice succeeds entirely over a phone call, so the malicious lure
    leaves little or no email evidence; the analyst must instead detect the downstream host and network
