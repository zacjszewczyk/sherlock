- question: '[Initial Access] Stateful web-download-execute correlation: Can you determine whether on
    a single endpoint, a sequence of correlated events occurs within a 5-minute window: 1) a web request
    to a newly observed or low-reputation domain, 2) a download of an executable or archive file, and
    3) the execution of a new process from a user-writable path (e.g., %USERPROFILE%\Downloads) that matches
    the downloaded filename. -- specifically, using the ''Stateful web-download-execute correlation''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), The adversary is trying to get
    into your network. Spearphishing Voice succeeds entirely over a phone call, so the malicious lure
    leaves little or no email evidence; the analyst must instead detect the downstream host and network
    behavior a coached victim performs. This evidence focuses on the condition that on a single endpoint,
    a sequence of correlated events occurs within a 5-minute window: 1) a web request to a newly observed
    or low-reputation domain, 2) a download of an executable or archive file, and 3) the execution of
    a new process from a user-writable path (e.g., %USERPROFILE%\Downloads) that matches the downloaded
    filename. This Symbolic Logic approach works as follows: Implement a stateful SIEM rule keyed by host
