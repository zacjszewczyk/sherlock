questions:
- question: Did any process-creation event (Windows Event ID 4688 / Sysmon Event ID 1) show a known token-manipulation
    tool or command line (e.g., JuicyPotato, RottenPotato, SweetPotato, PrintSpoofer, GodPotato, Rubeus,
    incognito, or flags like `-t * -l <port>`), or the OpenProcessToken -> DuplicateTokenEx -> CreateProcessWithTokenW/ImpersonateLoggedOnUser
    API chain, that then produced a context-switch logon on the same host?
  context: 'The analyst is hunting for the direct execution signature of token-theft and impersonation
    tooling. Match NewProcessName/CommandLine against a watchlist of named Potato-family and token utilities
    and their characteristic flags, and watch the OS API token-duplication chain through ETW. After a
    match, enrich with the most recent successful (4624) or special-privilege (4672) logon for the same
    host/user to confirm whether the security context actually changed to SYSTEM, and record failed attempts
    (4625) as a distinct, weaker signal. A positive result indicates a deliberate attempt to operate under
    a different (typically SYSTEM) security context. This evidence supports the Stealth tactic: Has the
    adversary escalated privileges using access token manipulation? Authoritative sources for this method:
    [DuplicateTokenEx](https://learn.microsoft.com/en-us/windows/win32/api/securitybaseapi/nf-securitybaseapi-duplicatetokenex);
    [CreateProcessWithTokenW](https://learn.microsoft.com/en-us/windows/win32/api/processthreadsapi/nf-processthreadsapi-createprocesswithtokenw);
    [Becoming SYSTEM, XPNSec](https://blog.xpnsec.com/becoming-system/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - 'NAI: Domain Controllers, Application Servers, User Workstations, Windows Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (WinEventLog:Security EventCode=4688, WinEventLog:Sysmon EventCode=1)\n| where match(NewProcessName,\
      \ \"(?i)(juicypotato|rottenpotato|sweetpotato|printspoofer|godpotato|rubeus|incognito)\")\n   OR\
      \ match(CommandLine, \"(?i)(-t \\* -l |duplicatetokenex|impersonateloggedonuser|createprocesswithtoken)\"\
      )\n| join host, user [ recent 4624/4672 within 5m ]\n| eval context_switch = if(logon_success, \"\
      SUCCESS(4624/4672)\", \"FAIL(4625)\")\n| emit alert with context_switch"
- question: Among historical process-creation (4688) events, which command lines and parent-child combinations
    fall in the rarest (<1st) percentile of an n-gram frequency model trained on >=30 days of data, especially
    those running on privileged hosts or immediately preceding a suspicious logon?
  context: 'This statistical hunt baselines normal command-line and lineage frequency with a tokenized/n-gram
    model and flags the most anomalous invocations. Token-manipulation tooling and unusual runas/psexec
    usage are rare by construction, so commands in the lowest percentile that land on privileged hosts
    or just before a context-switch logon are high-value leads. Track the rate of failed launches and
    denied OpenProcess as separate features, alert when token-tool/runas/psexec invocations exceed the
    host''s normal hourly count, and surface the top-3 rarest tokens so the analyst can triage quickly.
    This evidence supports the Stealth tactic: Has the adversary escalated privileges using access token
    manipulation? Authoritative sources for this method: [Outlier Parents of Cmd, MITRE CAR](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - 'NAI: Domain Controllers, Application Servers, User Workstations, Windows Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4688 earliest=-30d

      | eval toks=ngram(CommandLine), pair=ParentProcessName."->".NewProcessName

      | stats count by toks, pair, host

      | eventstats perc1(count) as p1

      | where count <= p1 AND (privileged_host(host) OR followed_by_suspicious_logon(host))

      | table host, pair, top3_rarest_tokens, count'
- question: Does a supervised process-creation classifier (trained on process name, parent name, command-line
    length/entropy, account type, logon context, and TokenElevationType) score a 4688 event as token-stealing/impersonation
    rather than normal administrative activity?
  context: 'A gradient-boosted classifier (ProblemChild-style) learns to separate benign admin behavior
    from token-stealing and impersonation using lineage and token features. Command-line length/entropy
    and TokenElevationType are strong discriminators of LOLBin-style abuse. The alert must surface the
    top-3 contributing features (e.g., SHAP) rather than just a score so the analyst can validate the
    model''s reasoning and avoid blindly trusting an opaque verdict. This evidence supports the Stealth
    tactic: Has the adversary escalated privileges using access token manipulation? Authoritative sources
    for this method: [ProblemChild, Elastic](https://www.elastic.co/blog/problemchild-detecting-living-off-the-land-attacks).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - 'NAI: Domain Controllers, Application Servers, User Workstations, Windows Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [proc_name, parent_name, cmdline_len, cmdline_entropy, account_type, logon_context,
      token_elevation_type]

      score, shap = gbm_token_classifier.predict(features)

      if score > threshold: emit alert with top3(shap)'
- question: Did a sensitive system service (services.exe, lsass.exe, spoolsv.exe, wininit.exe) spawn a
    child process that is not on the approved allow-list for that parent, such as an interactive shell
    (cmd.exe, powershell.exe) or a non-native binary?
  context: 'Core Windows service processes have tightly constrained, predictable children. lsass.exe should
    essentially never spawn a child, and svchost.exe should descend from services.exe. A sensitive parent
    spawning an interactive shell or unexpected binary is a classic indicator that an adversary has manipulated
    a token or injected into a privileged process to inherit its security context. Maintain a per-parent
    allow-list and alert on any deviation. This evidence supports the Stealth tactic: Has the adversary
    escalated privileges using access token manipulation? Authoritative sources for this method: [Unusual
    Parent-Child Relationship, Elastic](https://www.elastic.co/guide/en/security/current/unusual-parent-child-relationship.html);
    [Non-Services Spawn Svchost, Splunk](https://research.splunk.com/endpoint/1d38e5e9-2ff8-4c47-872c-bf1657cefab5/);
    [Red Canary Process Injection](https://redcanary.com/threat-detection-report/techniques/process-injection/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Critical Infrastructure Servers, Privileged Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=WinEventLog:Security EventCode=4688\n| where ParentProcessName IN (\"services.exe\"\
      ,\"lsass.exe\",\"spoolsv.exe\",\"wininit.exe\")\n   AND NOT allowlisted_child(ParentProcessName,\
      \ NewProcessName)\n| emit alert (priority=high)"
- question: Over a 30-day baseline of parent-child process pairs, which newly observed pair has a conditional
    probability P(Child|Parent) below the significance threshold (e.g., <0.01%), or is occurring for the
    first time ever on that host?
  context: 'This statistical method models how likely each child is given its parent across the environment,
    then flags pairings that are statistically improbable or unprecedented. Token manipulation frequently
    produces lineage that has never legitimately occurred (e.g., a privileged service spawning a shell).
    Report the observed probability and the historical count in the alert, and treat first-ever-per-host
    occurrences as a distinct signal, so analysts can judge whether the rarity reflects benign novelty
    or malicious context inheritance. This evidence supports the Stealth tactic: Has the adversary escalated
    privileges using access token manipulation? Authoritative sources for this method: [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Critical Infrastructure Servers, Privileged Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4688 earliest=-30d

      | stats count by ParentProcessName, NewProcessName, host

      | eval p_child_given_parent = count / parent_total

      | where p_child_given_parent < 0.0001 OR first_seen_on_host==1

      | table host, ParentProcessName, NewProcessName, p_child_given_parent, count'
- question: When process-creation events are clustered (DBSCAN) on parent name, child name, and user context,
    do any small, isolated clusters appear whose process role deviates from learned benign provenance?
  context: 'Unsupervised clustering groups normal process activity into dense clusters; token-abuse activity
    tends to form small, isolated outlier clusters far from benign behavior. Node-level provenance learning
    (ThreaTrace-style) can additionally flag processes whose graph role deviates from learned norms. Surface
    the distance-to-nearest-benign-cluster and the top contributing features so the analyst can prioritize
    the most anomalous lineages for investigation. This evidence supports the Stealth tactic: Has the
    adversary escalated privileges using access token manipulation? Authoritative sources for this method:
    [ThreaTrace](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Critical Infrastructure Servers, Privileged Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = vectorize(parent_name, child_name, user_context)\nlabels = DBSCAN(eps, min_samples).fit(X)\n\
      for c in small_isolated_clusters(labels):\n    emit alert with distance_to_nearest_benign, top_features"
- question: Was a process created by a non-privileged account quickly followed (same host/ProcessId, short
    window) by a SYSTEM or special-privilege logon (4624 Logon Type 5 for NT AUTHORITY\SYSTEM, or 4672),
    indicating a token-inheritance crossing of the privilege boundary?
  context: 'This correlation chains a low-privilege process launch to a subsequent SYSTEM/special-privilege
    logon on the same host (joining on ProcessId where available, within roughly a 5-second to short window).
    It captures the token-inheritance escalation path where a user-context process coerces or steals a
    SYSTEM token. Distinguish successful elevation (4624 Type 5 / 4672) from failed attempts (4625) to
    separate confirmed escalation from probing, and pivot from the matched ProcessId to the parent for
    full lineage. This evidence supports the Stealth tactic: Has the adversary escalated privileges using
    access token manipulation? Authoritative sources for this method: [Becoming SYSTEM, XPNSec](https://blog.xpnsec.com/becoming-system/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - 'NAI: Authentication Servers, Application Servers, User Workstations'
  range: Last 7 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join (4688 where account_type=\"non-privileged\") with (4624 LogonType=5 TargetUserName=\"\
      SYSTEM\" OR 4672)\n  on host, ProcessId within 5s\n| eval state = if(success, \"ELEVATED\", \"FAILED(4625)\"\
      )\n| emit alert with parent_lineage(ProcessId), state"
- question: Does a host or user show a rate of privilege transitions, including 4672 special-privilege
    events that follow process creation, that exceeds its 30-day profile (e.g., >3 standard deviations)
    or appears for the first time?
  context: 'Baselining the per-host/user rate of privilege transitions detects abnormal bursts of elevation
    that follow process creation. A sudden spike in 4672 special-privilege assignments, or a host that
    has never elevated suddenly doing so, is consistent with token manipulation used to escalate. Separate
    successful (4672) from failed elevation attempts so the analyst can distinguish confirmed escalation
    from unsuccessful probing under the Privilege Escalation tactic. This evidence supports the Stealth
    tactic: Has the adversary escalated privileges using access token manipulation? Authoritative sources
    for this method: [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - 'NAI: Authentication Servers, Application Servers, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode IN (4688,4672) earliest=-30d

      | stats count(4672_after_4688) as elev by host, user, day

      | eventstats avg(elev) as mu, stdev(elev) as sd by host

      | where elev > mu + 3*sd OR first_elevation(host)

      | table host, user, elev, mu, sd'
- question: Does a time-series forecast of the expected per-host rate of SYSTEM/special-privilege events
    show a spike that coincides with unusual user process activity, appearing as a high-error edge in
    causal provenance modeling?
  context: 'A forecasting model (and paired causal provenance model, KAIROS-style) learns each host''s
    normal cadence of SYSTEM/special-privilege events and surfaces deviations as spikes or high prediction-error
    edges. When such a spike aligns in time with anomalous user-process activity, it signals that token
    abuse may have produced unexpected privileged sessions. Surface the contributing time window and the
    implicated process so the analyst can confirm the privilege transition. This evidence supports the
    Stealth tactic: Has the adversary escalated privileges using access token manipulation? Authoritative
    sources for this method: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - 'NAI: Authentication Servers, Application Servers, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "yhat = forecast(per_host_system_event_rate)\nresid = actual - yhat\nif resid > 3*sigma AND\
      \ coincides(unusual_user_process):\n    emit alert with window, contributing_process"
- question: Was a successful network logon (4624, Logon Type 3) recorded from a loopback source IP (127.0.0.1
    or ::1) targeting NT AUTHORITY\SYSTEM, with a logon ProcessName not on the allow-list of legitimate
    local authenticators?
  context: 'This is the canonical Potato / local-SYSTEM token-coercion signature: a Type 3 network logon
    that originates from loopback, authenticates as SYSTEM, and is driven by a non-system, user-level
    process. Correlate the ProcessId with 4688 to inspect the parent and confirm the originating tool.
    Also count failed loopback SYSTEM logons (4625) as distinct evidence of unsuccessful Potato attempts.
    A confirmed match is a high-priority privilege-escalation indicator. This evidence supports the Stealth
    tactic: Has the adversary escalated privileges using access token manipulation? Authoritative sources
    for this method: [Becoming SYSTEM, XPNSec](https://blog.xpnsec.com/becoming-system/).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Member Servers, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=WinEventLog:Security EventCode=4624\n| where LogonType=3 AND IpAddress IN (\"127.0.0.1\"\
      ,\"::1\")\n   AND TargetUserName=\"SYSTEM\"\n   AND NOT allowlisted_local_auth(ProcessName)\n| join\
      \ ProcessId [ 4688 to get parent ]\n| emit alert (priority=critical); also count 4625 loopback-SYSTEM\
      \ fails"
- question: Does any user or process exceed its baseline frequency of loopback network logons (Type 3
    from 127.0.0.1/::1) by more than ~3 standard deviations above its historical mean?
  context: 'Legitimate loopback Type 3 logons are limited and per-user/process stable. Baselining their
    frequency and alerting on statistically significant excess (>3 standard deviations) catches Potato-style
    local SYSTEM coercion that generates abnormal loopback authentication. The explainable std-dev threshold
    lets the analyst see exactly how far the activity departs from the established norm. This evidence
    supports the Stealth tactic: Has the adversary escalated privileges using access token manipulation?
    Authoritative sources for this method: [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Member Servers, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4624 LogonType=3 IpAddress IN ("127.0.0.1","::1")

      | stats count by user, ProcessName, day

      | eventstats avg(count) as mu, stdev(count) as sd by user, ProcessName

      | where count > mu + 3*sd

      | table user, ProcessName, count, mu, sd'
- question: Does a classifier trained on 4624 features (LogonType, IpAddress, TargetUserName, ProcessName,
    parent lineage) recognize the Potato pattern (Type 3 + loopback + SYSTEM + non-system process) for
    a given logon event?
  context: 'A decision-tree/gradient-boosted classifier learns the full Potato signature from labeled
    examples, generalizing beyond a rigid rule to catch variants and obfuscated tooling. It combines loopback,
    logon type, target account, process name, and parent lineage into a single learned decision. The alert
    should output the top-3 contributing features so analysts can verify the verdict reflects genuine
    Potato characteristics and not a benign coincidence. This evidence supports the Stealth tactic: Has
    the adversary escalated privileges using access token manipulation? Authoritative sources for this
    method: [ProblemChild, Elastic](https://www.elastic.co/blog/problemchild-detecting-living-off-the-land-attacks).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Member Servers, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features=[LogonType, IpAddress, TargetUserName, ProcessName, parent_lineage]

      score, contrib = potato_clf.predict(features)

      if score > threshold: emit alert with top3(contrib)'
- question: Was psexec.exe or a variant (e.g., paexec.exe) created (4688) with the `-s` command-line argument
    to run a process under the SYSTEM account via a service token, and did it produce a service-creation
    (7045) and SYSTEM logon?
  context: 'PsExec''s `-s` flag runs the remote payload as SYSTEM by installing a service that executes
    under the SYSTEM service token. Alert on the process-creation with `-s`, then enrich with the resulting
    service-creation event (7045) and SYSTEM logon to confirm the service-token-to-SYSTEM escalation path.
    Flag failed service creation as a distinct, weaker signal of an attempted but unsuccessful escalation.
    This evidence supports the Stealth tactic: Has the adversary escalated privileges using access token
    manipulation? Authoritative sources for this method: [Becoming SYSTEM, XPNSec](https://blog.xpnsec.com/becoming-system/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, IT Administrator Systems, Jump Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Security EventCode=4688

      | where NewProcessName IN ("psexec.exe","paexec.exe") AND match(CommandLine, "(?i)(^| )-s( |$)")

      | join host [ 7045 service-create ], [ 4624 SYSTEM logon ]

      | emit alert (priority=high); flag 7045_failures separately'
- question: Which PsExec usages have a high risk score based on the account's role and the rarity of the
    source-destination host pair, particularly non-admin use or usage in the >99th percentile of unusual
    times?
  context: 'PsExec is a legitimate admin tool, so detection hinges on context: who ran it, between which
    hosts, and when. Track usage frequency by account and source/destination pair, then score the structural
    rarity of the user-source-destination relationship and time-of-day against std-dev baselines. Non-administrative
    accounts using PsExec, or admins using it across never-before-seen host pairs at unusual hours, score
    highest and warrant investigation as possible token-backed lateral movement. This evidence supports
    the Stealth tactic: Has the adversary escalated privileges using access token manipulation? Authoritative
    sources for this method: [Siadati & Memon](https://doi.org/10.1145/3133956.3134003); [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, IT Administrator Systems, Jump Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4688 NewProcessName IN ("psexec.exe","paexec.exe")

      | stats count by account, src_host, dst_host, hour

      | eval risk = role_weight(account) + rarity(src_host,dst_host) + time_outlier(hour)

      | where risk > threshold OR NOT is_admin(account) OR perc(time) > 99

      | table account, src_host, dst_host, risk'
- question: Does a sequence/causality model match the PsExec attack chain (psexec written -> executed
    with `-s` -> suspicious child such as whoami.exe or net.exe under the remote service) where the credential-switch
    path lacks a benign cause?
  context: 'Modeling the ordered attack chain (Hopper-style) detects causally linked steps that individually
    look benign but together indicate token-backed SYSTEM execution: the binary is dropped, executed with
    `-s`, then spawns reconnaissance children under the remote service context. Scoring login/credential-switch
    paths that have no benign cause distinguishes real attacks from routine admin use. Surface the matched
    state transitions so the analyst can follow the chain. This evidence supports the Stealth tactic:
    Has the adversary escalated privileges using access token manipulation? Authoritative sources for
    this method: [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, IT Administrator Systems, Jump Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "chain = [psexec_written, exec_with_-s, child IN (whoami.exe,net.exe) under service]\nif sequence_model.match(chain)\
      \ AND no_benign_cause(cred_switch):\n    emit alert with matched_transitions"
- question: Was runas.exe created with the `/netonly` argument (4688) and then, within ~2 minutes, did
    the same host make an outbound SMB (445) or WinRM (5985/5986) connection to a new internal destination
    (Zeek conn.log)?
  context: '`runas /netonly` builds an impersonation token whose network credentials differ from the local
    user, a common precursor to authenticated lateral movement under stolen credentials. Correlating the
    runas launch with a subsequent SMB/WinRM connection to a previously unseen internal host within a
    tight window exposes this pattern. Also correlate downstream failed authentications (4625/Kerberos
    failures) as distinct signals of credential probing. This evidence supports the Stealth tactic: Has
    the adversary escalated privileges using access token manipulation? Authoritative sources for this
    method: [Becoming SYSTEM, XPNSec](https://blog.xpnsec.com/becoming-system/).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User Workstations, Network Egress/Ingress Points, Authentication Servers'
  range: Last 7 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(4688 NewProcessName="runas.exe" CommandLine~"/netonly")

      THEN within 2m on same host:

      (zeek conn.log dst_port IN (445,5985,5986) AND new_internal_dest)

      | emit alert; also correlate 4625/Kerberos failures'
- question: For a given user, do the destination IPs reached after `runas /netonly` have low Jaccard similarity
    (e.g., <0.2) to that user's historical post-runas destination set?
  context: 'Each user has a characteristic set of destinations they reach after `runas /netonly`. Computing
    the Jaccard similarity of new destinations against this history flags structural login deviations:
    a similarity below ~0.2 means the user is suddenly authenticating to systems unlike anything in their
    baseline, consistent with token-backed lateral movement to new targets. Low overlap is the trigger
    for investigation. This evidence supports the Stealth tactic: Has the adversary escalated privileges
    using access token manipulation? Authoritative sources for this method: [Siadati & Memon](https://doi.org/10.1145/3133956.3134003).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User Workstations, Network Egress/Ingress Points, Authentication Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'hist = historical_dest_set(user, after="runas /netonly")

      new = current_dest_set(user)

      if jaccard(new, hist) < 0.2: emit alert with new_dests'
- question: In a user-host-process graph, does the runas-then-new-remote-host pattern form a rare/anomalous
    subgraph when scored with provenance graph learning?
  context: 'Provenance graph learning (KAIROS/ThreaTrace-style) represents users, hosts, and processes
    as a graph and learns normal connectivity. The runas-to-new-remote-host behavior forms a subgraph
    whose rarity/anomaly score rises when it deviates from learned structure. Surface the specific anomalous
    edge and its contribution so the analyst can see exactly which authentication relationship is abnormal
    and pivot accordingly. This evidence supports the Stealth tactic: Has the adversary escalated privileges
    using access token manipulation? Authoritative sources for this method: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf);
    [ThreaTrace](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User Workstations, Network Egress/Ingress Points, Authentication Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_graph(user, host, process, runas_edges)\nscores = provenance_gnn.score_subgraphs(G)\n\
      for sg in scores where anomaly > threshold:\n    emit alert with anomalous_edge, contribution"
- question: Did a critical system process that should never initiate network traffic (e.g., lsass.exe,
    winlogon.exe, csrss.exe) appear as the source of any outbound connection in Zeek conn.log?
  context: 'Core system processes like lsass.exe, winlogon.exe, and csrss.exe do not make outbound network
    connections in normal operation. Any such connection strongly suggests the process has been injected
    into or its token abused to perform C2 or lateral movement under a privileged identity. Alert on any
    outbound connection sourced from these processes and enrich with the process GUID/command line to
    identify the responsible binary. This evidence supports the Stealth tactic: Has the adversary escalated
    privileges using access token manipulation? Authoritative sources for this method: [Red Canary Process
    Injection](https://redcanary.com/threat-detection-report/techniques/process-injection/); [Unusual
    Parent-Child Relationship, Elastic](https://www.elastic.co/guide/en/security/current/unusual-parent-child-relationship.html).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Network Egress Points (Firewall, Proxy), Domain Controllers, Endpoint Security Agents'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn.log

      | where orig_process IN ("lsass.exe","winlogon.exe","csrss.exe")

      | emit alert with process_guid, command_line'
- question: For a system process such as svchost.exe, does outbound traffic exceed its baseline (bytes-out
    >99th percentile) or reach destinations with popularity <1st percentile, beyond normal std-dev variation?
  context: 'System processes have predictable destinations, ports, and byte volumes. Baselining per-process
    destination IPs/ports and volume, then applying percentile thresholds (volume >99th percentile, destination
    popularity <1st percentile) and std-dev anomaly scoring, reveals when a token-abused system process
    begins talking to rare destinations or exfiltrating data. Count blocked/denied connections separately
    as a distinct failure-mode signal. This evidence supports the Stealth tactic: Has the adversary escalated
    privileges using access token manipulation? Authoritative sources for this method: [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Network Egress Points (Firewall, Proxy), Domain Controllers, Endpoint Security Agents'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn.log

      | stats sum(orig_bytes) as bytes_out, dc(dst) as dests by orig_process, day

      | eventstats perc99(bytes_out) as v99 by orig_process

      | where bytes_out > v99 OR dest_popularity(dst) < perc1

      | table orig_process, dst, bytes_out; count denied separately'
- question: When STL time-series decomposition is applied to a system process's traffic volume, does the
    residual exceed ~3 standard deviations, indicating a behavior change consistent with a token-abused
    process performing C2?
  context: 'STL decomposition separates a process''s traffic into trend, seasonal, and residual components.
    A residual spike beyond ~3 standard deviations marks a behavioral change unexplained by normal periodicity,
    consistent with a token-abused system process beaconing or exfiltrating. Surface the residual magnitude
    and the contributing time window so the analyst can pinpoint when the deviation began and correlate
    it with other token-manipulation evidence. This evidence supports the Stealth tactic: Has the adversary
    escalated privileges using access token manipulation? Authoritative sources for this method: [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24167-paper.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Network Egress Points (Firewall, Proxy), Domain Controllers, Endpoint Security Agents'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'trend, seasonal, resid = STL(per_process_traffic_volume)

      if resid > 3*stdev(resid): emit alert with resid_magnitude, window'
- question: Within a 1-hour window, did a single source host generate Type 3 logons (4624) to many destinations
    using more than a hard threshold of unique TargetUserName values (e.g., >10 unique accounts from one
    non-server host)?
  context: 'Token theft enables an attacker to authenticate as many different accounts from one foothold,
    producing a fan-out of credential switches. Counting unique TargetUserName per source IpAddress for
    Type 3 logons over a 1-hour window and alerting above a hard threshold (e.g., >10 from a non-server
    host) catches this lateral-movement signature. A workstation suddenly authenticating as a dozen distinct
    accounts is highly anomalous. This evidence supports the Stealth tactic: Has the adversary escalated
    privileges using access token manipulation? Authoritative sources for this method: [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf);
    [Siadati & Memon](https://doi.org/10.1145/3133956.3134003).'
  answer_sources:
  - Windows Event ID 4624
  - 'NAI: Domain Controllers, Centralized Log Aggregator (SIEM), Member Servers'
  range: Last 7 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Security EventCode=4624 LogonType=3

      | bin _time span=1h

      | stats dc(TargetUserName) as accts by IpAddress, _time

      | where accts > 10 AND NOT is_server(IpAddress)

      | emit alert'
- question: Over a sliding 30-minute window, does the Shannon entropy of the TargetUserName set for Type
    3 logons from a source host exceed its host-type baseline (e.g., >3 standard deviations)?
  context: 'High entropy in the set of accounts authenticated from one host indicates many distinct, evenly-distributed
    accounts in use, a hallmark of stolen-token fan-out. Computing Shannon entropy of TargetUserName per
    source over a sliding 30-minute window and alerting when it exceeds the host-type baseline by >3 standard
    deviations captures this even when individual counts are modest. Include the count of 4625 failed
    logons spread across many accounts as a distinct signal of credential probing. This evidence supports
    the Stealth tactic: Has the adversary escalated privileges using access token manipulation? Authoritative
    sources for this method: [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4624
  - 'NAI: Domain Controllers, Centralized Log Aggregator (SIEM), Member Servers'
  range: Last 7 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4624 LogonType=3

      | streamstats window=30m entropy(TargetUserName) as H by src_host

      | eventstats avg(H) as mu, stdev(H) as sd by host_type

      | where H > mu + 3*sd

      | table src_host, H; also report 4625 spread'
- question: When hosts are grouped by role/department (AD attributes), does any host deviate from its
    peer group's typical fan-out (unique accounts/hosts contacted), modeling abnormal credential-switch
    login paths?
  context: 'Peer-group analytics (Hopper-style) compare a host''s fan-out to others in the same role/department,
    since baselines differ widely by function. A host contacting far more unique accounts or destinations
    than its peers signals abnormal credential-switching consistent with token-backed lateral movement.
    Surface the deviation magnitude versus the peer-group median so the analyst can quantify how far the
    host departs from its cohort. This evidence supports the Stealth tactic: Has the adversary escalated
    privileges using access token manipulation? Authoritative sources for this method: [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf).'
  answer_sources:
  - Windows Event ID 4624
  - 'NAI: Domain Controllers, Centralized Log Aggregator (SIEM), Member Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "groups = cluster_hosts_by(AD_role, department)\nfor host in groups:\n    fanout = unique_accounts_and_hosts(host)\n\
      \    if fanout > peer_median + k*peer_mad:\n        emit alert with deviation_vs_median"
- question: Did a 4688 event report a common spoofing-target parent (e.g., explorer.exe or a privileged
    service) for a suspicious child (e.g., non-interactive powershell.exe), where the reported ParentProcessId
    is terminated/nonexistent or disagrees with the real creator from the Microsoft-Windows-Kernel-Process
    ETW provider?
  context: 'Parent PID spoofing makes a malicious process appear to descend from a benign or privileged
    parent to evade lineage-based detection and inherit context. Detect it by flagging a reported parent
    that is a known spoof target paired with a suspicious child, a ParentProcessId that no longer exists
    or post-dates the child, or a mismatch between the 4688-reported parent and the true creator observed
    via the Kernel-Process ETW provider. Any of these contradictions indicates manipulation. This evidence
    supports the Stealth tactic: Has the adversary escalated privileges using access token manipulation?
    Authoritative sources for this method: [Detecting Parent PID Spoofing, CounterCept](https://labs.withsecure.com/publications/detecting-parent-pid-spoofing);
    [SelectMyParent, Stevens](https://blog.didierstevens.com/2009/11/22/quickpost-selectmyparent-or-playing-with-the-windows-process-tree/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=WinEventLog:Security EventCode=4688\n| where (ParentProcessName IN (\"explorer.exe\"\
      ,privileged_services) AND suspicious_child(NewProcessName))\n   OR ppid_terminated_or_nonexistent(ParentProcessId)\n\
      \   OR reported_parent != etw_kernel_process_creator\n| emit alert"
- question: Using a stateful table of running processes and creation times, does any 4688 event reference
    a ParentProcessId that did not exist or did not pre-date the child, and is the per-host orphaned-process
    rate spiking above baseline (e.g., >95th percentile)?
  context: 'By maintaining a stateful map of live processes and their start times, each new 4688 can be
    checked to confirm its parent existed and was created before the child. Orphaned processes (parent
    missing or younger than child) indicate PPID spoofing or process hollowing. Alerting when the per-host
    orphaned-process rate exceeds the 95th percentile baseline catches bursts of such manipulation while
    tolerating rare benign orphaning. This evidence supports the Stealth tactic: Has the adversary escalated
    privileges using access token manipulation? Authoritative sources for this method: [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "maintain proc_table[pid] = creation_time\nfor each 4688:\n    if ParentProcessId NOT IN proc_table\
      \ OR proc_table[ppid] > child_time: orphan++\n| stats orphan_rate by host\n| where orphan_rate >\
      \ perc95\n| emit alert"
- question: Does a graph neural network trained on process-lineage/provenance graphs flag a process tree
    as having an illogical parent or anomalous depth relative to learned normal structure?
  context: 'A GNN learns the normal topology of process-lineage graphs (typical parents, children, and
    tree depth). It flags structurally illogical parents or unusual depth that rule-based checks miss,
    capturing sophisticated PPID spoofing and injection. Surface the anomalous node/edge and top contributing
    features in the alert so the analyst can see precisely which lineage relationship the model considers
    abnormal and validate it against ground truth. This evidence supports the Stealth tactic: Has the
    adversary escalated privileges using access token manipulation? Authoritative sources for this method:
    [ThreaTrace](https://arxiv.org/pdf/2111.04333); [KAIROS](https://tfjmp.org/publications/2024-sp.pdf);
    [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24167-paper.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Developer Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_lineage_graph(process_events)\nscores = lineage_gnn.score_nodes(G)\nfor n in scores\
      \ where anomaly > threshold:\n    emit alert with anomalous_node_edge, top_features"
- question: Did any process-creation event (Windows Event ID 4688 / Sysmon Event ID 1) show a known token-manipulation
    tool or command line (e.g., JuicyPotato, RottenPotato, SweetPotato, PrintSpoofer, GodPotato, Rubeus,
    incognito, or flags like `-t * -l <port>`), or the OpenProcessToken -> DuplicateTokenEx -> CreateProcessWithTokenW/ImpersonateLoggedOnUser
    API chain, that then produced a context-switch logon on the same host?
  context: 'The analyst is hunting for the direct execution signature of token-theft and impersonation
    tooling. Match NewProcessName/CommandLine against a watchlist of named Potato-family and token utilities
    and their characteristic flags, and watch the OS API token-duplication chain through ETW. After a
    match, enrich with the most recent successful (4624) or special-privilege (4672) logon for the same
    host/user to confirm whether the security context actually changed to SYSTEM, and record failed attempts
    (4625) as a distinct, weaker signal. A positive result indicates a deliberate attempt to operate under
    a different (typically SYSTEM) security context. This evidence supports the Privilege Escalation tactic:
    Has the adversary escalated privileges using access token manipulation? Authoritative sources for
    this method: [DuplicateTokenEx](https://learn.microsoft.com/en-us/windows/win32/api/securitybaseapi/nf-securitybaseapi-duplicatetokenex);
    [CreateProcessWithTokenW](https://learn.microsoft.com/en-us/windows/win32/api/processthreadsapi/nf-processthreadsapi-createprocesswithtokenw);
    [Becoming SYSTEM, XPNSec](https://blog.xpnsec.com/becoming-system/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Application Servers, User Workstations, Windows Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (WinEventLog:Security EventCode=4688, WinEventLog:Sysmon EventCode=1)\n| where match(NewProcessName,\
      \ \"(?i)(juicypotato|rottenpotato|sweetpotato|printspoofer|godpotato|rubeus|incognito)\")\n   OR\
      \ match(CommandLine, \"(?i)(-t \\* -l |duplicatetokenex|impersonateloggedonuser|createprocesswithtoken)\"\
      )\n| join host, user [ recent 4624/4672 within 5m ]\n| eval context_switch = if(logon_success, \"\
      SUCCESS(4624/4672)\", \"FAIL(4625)\")\n| emit alert with context_switch"
- question: Among historical process-creation (4688) events, which command lines and parent-child combinations
    fall in the rarest (<1st) percentile of an n-gram frequency model trained on >=30 days of data, especially
    those running on privileged hosts or immediately preceding a suspicious logon?
  context: 'This statistical hunt baselines normal command-line and lineage frequency with a tokenized/n-gram
    model and flags the most anomalous invocations. Token-manipulation tooling and unusual runas/psexec
    usage are rare by construction, so commands in the lowest percentile that land on privileged hosts
    or just before a context-switch logon are high-value leads. Track the rate of failed launches and
    denied OpenProcess as separate features, alert when token-tool/runas/psexec invocations exceed the
    host''s normal hourly count, and surface the top-3 rarest tokens so the analyst can triage quickly.
    This evidence supports the Privilege Escalation tactic: Has the adversary escalated privileges using
    access token manipulation? Authoritative sources for this method: [Outlier Parents of Cmd, MITRE CAR](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Application Servers, User Workstations, Windows Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4688 earliest=-30d

      | eval toks=ngram(CommandLine), pair=ParentProcessName."->".NewProcessName

      | stats count by toks, pair, host

      | eventstats perc1(count) as p1

      | where count <= p1 AND (privileged_host(host) OR followed_by_suspicious_logon(host))

      | table host, pair, top3_rarest_tokens, count'
- question: Does a supervised process-creation classifier (trained on process name, parent name, command-line
    length/entropy, account type, logon context, and TokenElevationType) score a 4688 event as token-stealing/impersonation
    rather than normal administrative activity?
  context: 'A gradient-boosted classifier (ProblemChild-style) learns to separate benign admin behavior
    from token-stealing and impersonation using lineage and token features. Command-line length/entropy
    and TokenElevationType are strong discriminators of LOLBin-style abuse. The alert must surface the
    top-3 contributing features (e.g., SHAP) rather than just a score so the analyst can validate the
    model''s reasoning and avoid blindly trusting an opaque verdict. This evidence supports the Privilege
    Escalation tactic: Has the adversary escalated privileges using access token manipulation? Authoritative
    sources for this method: [ProblemChild, Elastic](https://www.elastic.co/blog/problemchild-detecting-living-off-the-land-attacks).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Application Servers, User Workstations, Windows Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [proc_name, parent_name, cmdline_len, cmdline_entropy, account_type, logon_context,
      token_elevation_type]

      score, shap = gbm_token_classifier.predict(features)

      if score > threshold: emit alert with top3(shap)'
- question: Did a sensitive system service (services.exe, lsass.exe, spoolsv.exe, wininit.exe) spawn a
    child process that is not on the approved allow-list for that parent, such as an interactive shell
    (cmd.exe, powershell.exe) or a non-native binary?
  context: 'Core Windows service processes have tightly constrained, predictable children. lsass.exe should
    essentially never spawn a child, and svchost.exe should descend from services.exe. A sensitive parent
    spawning an interactive shell or unexpected binary is a classic indicator that an adversary has manipulated
    a token or injected into a privileged process to inherit its security context. Maintain a per-parent
    allow-list and alert on any deviation. This evidence supports the Privilege Escalation tactic: Has
    the adversary escalated privileges using access token manipulation? Authoritative sources for this
    method: [Unusual Parent-Child Relationship, Elastic](https://www.elastic.co/guide/en/security/current/unusual-parent-child-relationship.html);
    [Non-Services Spawn Svchost, Splunk](https://research.splunk.com/endpoint/1d38e5e9-2ff8-4c47-872c-bf1657cefab5/);
    [Red Canary Process Injection](https://redcanary.com/threat-detection-report/techniques/process-injection/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Critical Infrastructure Servers, Privileged Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=WinEventLog:Security EventCode=4688\n| where ParentProcessName IN (\"services.exe\"\
      ,\"lsass.exe\",\"spoolsv.exe\",\"wininit.exe\")\n   AND NOT allowlisted_child(ParentProcessName,\
      \ NewProcessName)\n| emit alert (priority=high)"
- question: Over a 30-day baseline of parent-child process pairs, which newly observed pair has a conditional
    probability P(Child|Parent) below the significance threshold (e.g., <0.01%), or is occurring for the
    first time ever on that host?
  context: 'This statistical method models how likely each child is given its parent across the environment,
    then flags pairings that are statistically improbable or unprecedented. Token manipulation frequently
    produces lineage that has never legitimately occurred (e.g., a privileged service spawning a shell).
    Report the observed probability and the historical count in the alert, and treat first-ever-per-host
    occurrences as a distinct signal, so analysts can judge whether the rarity reflects benign novelty
    or malicious context inheritance. This evidence supports the Privilege Escalation tactic: Has the
    adversary escalated privileges using access token manipulation? Authoritative sources for this method:
    [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Critical Infrastructure Servers, Privileged Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4688 earliest=-30d

      | stats count by ParentProcessName, NewProcessName, host

      | eval p_child_given_parent = count / parent_total

      | where p_child_given_parent < 0.0001 OR first_seen_on_host==1

      | table host, ParentProcessName, NewProcessName, p_child_given_parent, count'
- question: When process-creation events are clustered (DBSCAN) on parent name, child name, and user context,
    do any small, isolated clusters appear whose process role deviates from learned benign provenance?
  context: 'Unsupervised clustering groups normal process activity into dense clusters; token-abuse activity
    tends to form small, isolated outlier clusters far from benign behavior. Node-level provenance learning
    (ThreaTrace-style) can additionally flag processes whose graph role deviates from learned norms. Surface
    the distance-to-nearest-benign-cluster and the top contributing features so the analyst can prioritize
    the most anomalous lineages for investigation. This evidence supports the Privilege Escalation tactic:
    Has the adversary escalated privileges using access token manipulation? Authoritative sources for
    this method: [ThreaTrace](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Critical Infrastructure Servers, Privileged Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = vectorize(parent_name, child_name, user_context)\nlabels = DBSCAN(eps, min_samples).fit(X)\n\
      for c in small_isolated_clusters(labels):\n    emit alert with distance_to_nearest_benign, top_features"
- question: Was a process created by a non-privileged account quickly followed (same host/ProcessId, short
    window) by a SYSTEM or special-privilege logon (4624 Logon Type 5 for NT AUTHORITY\SYSTEM, or 4672),
    indicating a token-inheritance crossing of the privilege boundary?
  context: 'This correlation chains a low-privilege process launch to a subsequent SYSTEM/special-privilege
    logon on the same host (joining on ProcessId where available, within roughly a 5-second to short window).
    It captures the token-inheritance escalation path where a user-context process coerces or steals a
    SYSTEM token. Distinguish successful elevation (4624 Type 5 / 4672) from failed attempts (4625) to
    separate confirmed escalation from probing, and pivot from the matched ProcessId to the parent for
    full lineage. This evidence supports the Privilege Escalation tactic: Has the adversary escalated
    privileges using access token manipulation? Authoritative sources for this method: [Becoming SYSTEM,
    XPNSec](https://blog.xpnsec.com/becoming-system/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Authentication Servers, Application Servers, User Workstations'
  range: Last 7 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join (4688 where account_type=\"non-privileged\") with (4624 LogonType=5 TargetUserName=\"\
      SYSTEM\" OR 4672)\n  on host, ProcessId within 5s\n| eval state = if(success, \"ELEVATED\", \"FAILED(4625)\"\
      )\n| emit alert with parent_lineage(ProcessId), state"
- question: Did a 4688 event show a TokenElevationType escalation to Type 1 (full token) from a limited-token
    parent that is not consent.exe, or a low-probability tuple of (parent, child, account type, token
    elevation type) that is an outlier (>3 standard deviations) for the user/host?
  context: 'Legitimate UAC elevation is mediated by consent.exe; a full-token (Type 1) elevation arising
    from a limited-token parent without consent.exe is suspicious. Baseline TokenElevationType per process
    and score the joint probability of (parent, child, account type, token elevation type) tuples, alerting
    on per-user/host outliers. This focuses the Privilege Escalation investigation on illegitimate token
    elevation rather than sanctioned UAC prompts. This evidence supports the Privilege Escalation tactic:
    Has the adversary escalated privileges using access token manipulation? Authoritative sources for
    this method: [Context-based irregular activity detection, Khan et al.](https://www.sciencedirect.com/science/article/pii/S0957417423014938);
    [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Authentication Servers, Application Servers, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=WinEventLog:Security EventCode=4688 earliest=-30d\n| eval tuple=ParentProcessName.\"\
      |\".NewProcessName.\"|\".account_type.\"|\".TokenElevationType\n| stats count by tuple, host, user\n\
      | where (TokenElevationType=\"Type1\" AND ParentProcessName!=\"consent.exe\" AND parent_limited_token)\n\
      \      OR count < lowprob_threshold\n| table host, user, tuple, count"
- question: Does a time-series forecast of the expected per-host rate of SYSTEM/special-privilege events
    show a spike that coincides with unusual user process activity, appearing as a high-error edge in
    causal provenance modeling?
  context: 'A forecasting model (and paired causal provenance model, KAIROS-style) learns each host''s
    normal cadence of SYSTEM/special-privilege events and surfaces deviations as spikes or high prediction-error
    edges. When such a spike aligns in time with anomalous user-process activity, it signals that token
    abuse may have produced unexpected privileged sessions. Surface the contributing time window and the
    implicated process so the analyst can confirm the privilege transition. This evidence supports the
    Privilege Escalation tactic: Has the adversary escalated privileges using access token manipulation?
    Authoritative sources for this method: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Authentication Servers, Application Servers, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "yhat = forecast(per_host_system_event_rate)\nresid = actual - yhat\nif resid > 3*sigma AND\
      \ coincides(unusual_user_process):\n    emit alert with window, contributing_process"
- question: Was a successful network logon (4624, Logon Type 3) recorded from a loopback source IP (127.0.0.1
    or ::1) targeting NT AUTHORITY\SYSTEM, with a logon ProcessName not on the allow-list of legitimate
    local authenticators?
  context: 'This is the canonical Potato / local-SYSTEM token-coercion signature: a Type 3 network logon
    that originates from loopback, authenticates as SYSTEM, and is driven by a non-system, user-level
    process. Correlate the ProcessId with 4688 to inspect the parent and confirm the originating tool.
    Also count failed loopback SYSTEM logons (4625) as distinct evidence of unsuccessful Potato attempts.
    A confirmed match is a high-priority privilege-escalation indicator. This evidence supports the Privilege
    Escalation tactic: Has the adversary escalated privileges using access token manipulation? Authoritative
    sources for this method: [Becoming SYSTEM, XPNSec](https://blog.xpnsec.com/becoming-system/).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Member Servers, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
