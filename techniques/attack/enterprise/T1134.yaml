name: 'T1134: Access Token Manipulation'
id: ec0489d9-bb40-4698-9032-9670e49c737a
description: Investigate whether an adversary manipulated Windows access tokens to operate under a different
  user or system security context, bypass access controls, and escalate privileges or conceal activity.
  This playbook helps an analyst hunt for execution of token-manipulation tooling (e.g., Potato-family
  tools, Rubeus, incognito) and the OpenProcessToken/DuplicateTokenEx/CreateProcessWithToken API chain;
  sensitive system services spawning unexpected children; non-privileged processes followed by SYSTEM
  or special-privilege logons; loopback Type 3 logons authenticating as SYSTEM (the Potato signature);
  PsExec `-s` and runas `/netonly` usage; system processes making anomalous network connections; high-entropy
  multi-account remote logon fan-out indicative of stolen-token lateral movement; and parent PID spoofing.
  It spans both the Privilege Escalation and Stealth tactics, combining symbolic-logic rules, statistical
  baselines, and machine-learning models across Windows event logs and Zeek network data.
type: technique
