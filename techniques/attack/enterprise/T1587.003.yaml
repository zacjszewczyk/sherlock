name: 'T1587.003: Digital Certificates'
id: 6eafccd5-4b7f-4a8d-8a82-39623afeefd3
description: Investigate adversary development of digital certificate resources intended to support future
  operations such as encrypting command-and-control traffic, enabling adversary-in-the-middle, or installing
  rogue root certificates. This playbook helps an analyst hunt for self-signed SSL/TLS certificates, certificates
  matching known-malicious threat-intelligence indicators (SHA1, serial, issuer, JA3/JA3S/JA4X), certificates
  with anomalous metadata (high-entropy subject/issuer, abnormally short or long validity periods, suspicious
  key lengths or SAN counts), certificates tied to newly registered or typosquatted domains, certificates
  issued by free CAs immediately after domain registration, and a single non-standard certificate reused
  across many distinct external IPs or SNIs that signals shared C2 infrastructure. It combines symbolic-logic
  rules, statistical baselining/outlier detection, and machine-learning classifiers/graph and forecasting
  techniques against Zeek TLS/x509/DNS/conn telemetry and Windows CAPI2 certificate events to surface
  adversary-developed certificate infrastructure.
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Does any observed TLS certificate's SHA1/fingerprint, serial number, issuer common name, or
    subject common name exactly match a high-confidence threat-intelligence indicator (including default
    implant certificates like the Cobalt Strike beacon cert, serial 146473198 / CN 'Major Cobalt Strike')?
  context: Adversaries developing certificate resources frequently reuse default or known-bad certificates
    that have already been catalogued in CTI feeds (abuse.ch SSLBL, MISP) and tool signatures. Continuously
    comparing Zeek x509.log/ssl.log certificate identity fields against these lists produces high-precision
    alerts. A positive exact match is near-certain malicious infrastructure; once matched, pivot on the
    certificate's serial and issuer to discover additional adversary infrastructure presenting the same
    certificate. This directly supports the Resource Development tactic by exposing pre-staged C2/TLS
    assets.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network egress points, web proxies, mail gateways, and inline TLS decryption devices where TLS
    inspection is performed.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM x509.log, ssl.log\nWHERE certificate.fingerprint IN cti_sha1_list\n   OR certificate.serial\
      \ IN cti_serial_list\n   OR certificate.issuer IN cti_issuer_list\n   OR certificate.subject IN\
      \ cti_subject_list\n   OR (certificate.serial=='146473198' AND certificate.issuer CONTAINS 'Major\
      \ Cobalt Strike')\nALERT priority=high; THEN pivot serial,issuer -> find all conn.log dst sharing\
      \ match"
- question: Do any TLS handshakes present a JA3/JA3S client/server fingerprint matching known-bad implant
    feeds, or a JA4/JA4S/JA4X fingerprint matching adversary-developed self-signed certificate structures?
  context: JA3/JA3S fingerprint the TLS handshake of client/server; JA4X fingerprints the X.509 issuer/subject/extension
    structure, catching adversary-developed self-signed certificates even when cosmetic fields are altered.
    Because JA3 degrades under ClientHello randomization/GREASE, prefer version-resilient JA4+ where available.
    Matching against known-bad feeds surfaces implant tooling regardless of certificate field changes,
    exposing pre-staged C2 capabilities under Resource Development. A match indicates the same tool family/structure
    is in use.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network egress points, web proxies, mail gateways, and inline TLS decryption devices where TLS
    inspection is performed.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM ssl.log\nWHERE ja3 IN bad_ja3 OR ja3s IN bad_ja3s\n   OR ja4 IN bad_ja4 OR ja4s IN bad_ja4s\
      \ OR ja4x IN bad_ja4x\nALERT priority=high; prefer ja4* when present (resilient to GREASE)"
- question: Which certificate issuers are statistically rare across the environment (bottom 0.1 percentile
    of a rolling 30-day prevalence distribution) and not on an allowlist, and do flagged issuers correlate
    with low-reputation destinations?
  context: Adversary-developed certificates often carry rogue or one-off issuers that almost never appear
    in normal traffic. Maintaining a rolling prevalence distribution of x509 issuers and flagging the
    rarest using a robust modified Z-score (|Mi|>3.5) resists benign deployment spikes. Comparing the
    flagged issuer set against the legitimate public CA ecosystem separates rare-but-legit corporate CAs
    from rogue issuers. Correlating with Zeek conn.log low-reputation destinations elevates confidence.
    This statistical lens exposes Resource Development infrastructure lacking an exact IOC.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network egress points, web proxies, mail gateways, and inline TLS decryption devices where TLS
    inspection is performed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM x509.log over rolling 30d

      COMPUTE prevalence(issuer); modified_Zscore Mi per issuer

      WHERE issuer NOT IN allowlist AND (prevalence<=0.1pct OR |Mi|>3.5)

      JOIN conn.log dst_reputation; ALERT if low-rep dst'
- question: Are there spikes of certificate-validation failures, failed/RST TLS handshakes, or repeated
    failed connects to the same CTI-matched destination per host/destination that exceed the host baseline?
  context: Certificate-validation failures are a distinct signal rather than noise. When C2 infrastructure
    is down, an implant repeatedly fails to connect while still presenting/expecting the same certificate
    (beaconing to dead C2). Tracking ssl.log validation_status != 'ok', failed/RST handshakes, and repeated
    failed connects to a CTI-matched destination over a rolling window, then alerting on spikes above
    the per-host baseline, yields high-confidence detections of pre-staged but currently-offline adversary
    certificate infrastructure, supporting Resource Development hunting.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network egress points, web proxies, mail gateways, and inline TLS decryption devices where TLS
    inspection is performed.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM ssl.log, conn.log per host,dst over rolling window

      COUNT validation_status!=''ok'' + RST/failed handshakes + failed_connects

      BASELINE per host; ALERT if rate > baseline+3sigma

      boost if dst IN cti_list'
- question: Does a supervised certificate-metadata classifier (XGBoost/Random Forest over validity period,
    key length, signature algorithm, SAN count, self-signed flag, issuer/subject Shannon entropy, JA4X,
    plus a CTI-match flag) score any certificate above a high-precision threshold even when no exact IOC
    matches?
  context: Many adversary-developed certificates evade exact IOC matching but still exhibit a tell-tale
    feature combination (self-signed + short validity + high subject entropy). A trained classifier generalizes
    across these features to flag suspicious certificates with high precision. Surfacing the top-3 contributing
    features via SHAP in the alert text makes the result actionable and explainable to the analyst. A
    high score indicates likely adversary-staged TLS resources under Resource Development.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network egress points, web proxies, mail gateways, and inline TLS decryption devices where TLS
    inspection is performed.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [validity, key_len, sig_algo, san_count, self_signed,\n            entropy(subject),\
      \ entropy(issuer), ja4x, cti_flag]\nscore = XGBoost.predict_proba(features)\nWHERE score > high_precision_threshold\
      \ ALERT + SHAP top3 features"
- question: Are there certificates that are self-signed (issuer equals subject), carry generic/low-entropy
    subjects (localhost, ACME, example.com), or have validity under 30 days, and when such a certificate
    is installed as a root, does its thumbprint correlate with Windows Event ID 41 (CAPI2/Operational)?
  context: Self-signed certificates with short validity or generic subjects are strong adversary-TLS indicators
    and persist in default Cobalt Strike profiles. Flagging Zeek x509.log certs where issuer==subject
    or subject is generic/low-entropy or validity<30d catches these. Deployable Sigma rules exist for
    this. Critically, if such a certificate is added to a host's trust store as a root (T1553.004 Install
    Root Certificate), correlating the thumbprint with Windows Event ID 41 detects the install. This ties
    certificate development (Resource Development) to its on-host abuse.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - Windows Event ID 41 (Microsoft-Windows-CAPI2/Operational)
  - 'NAI: Network egress points, corporate DNS resolvers, and all enterprise Windows endpoints'' certificate
    trust stores.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM x509.log\nWHERE issuer==subject\n   OR subject IN ['localhost','ACME','example.com']\
      \ OR entropy(subject)<low\n   OR validity_days<30\nALERT; THEN match thumbprint -> Windows EID 41\
      \ (CAPI2) install"
  - technology: SIEM/Rule pseudocode
    query: 'FROM WinEvent channel=''Microsoft-Windows-CAPI2/Operational'' EventID=41

      WHERE installed_cert_thumbprint IN suspicious_selfsigned_thumbprints

      ALERT priority=high (root cert install)'
- question: Is an observed server certificate absent from public Certificate Transparency (CT) logs, or
    did its CN/SAN first appear in CT only hours before its first network use?
  context: Legitimate CA-issued certificates are publicly logged in CT, whereas adversary-developed self-signed
    certificates are not. Enriching observed server certificates with a CT lookup makes absence-from-CT
    (or a CN/SAN that first appears in CT mere hours before first network use) a high-value enrichment
    signal. A certificate that should be CA-issued but is missing from CT, or one with suspiciously fresh
    CT appearance, points to adversary-staged certificate resources.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - Windows Event ID 41 (Microsoft-Windows-CAPI2/Operational)
  - 'NAI: Network egress points, corporate DNS resolvers, and all enterprise Windows endpoints'' certificate
    trust stores.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each server cert in ssl.log/x509.log\nct = lookup_CT(cert.fingerprint, cert.cn, cert.san)\n\
      WHERE ct.present==false\n   OR (ct.first_seen within 24h before network_first_use) ALERT"
- question: Do any certificate CN/SAN entries have a small Levenshtein distance (<3) to internal or high-value
    external domains (typosquatting), or are free-CA certificate domains unusually young (domain age below
    the 5th percentile) with short validity and recent issuance?
  context: Adversaries register typosquatted domains and obtain free-CA certificates to impersonate trusted
    brands or internal infrastructure. Computing Levenshtein distance between CN/SAN and a list of internal/high-value
    domains flags near-miss impersonation (distance<3). For free-CA certs, using Zeek dns.log history
    to flag domain ages in the bottom 5th percentile, weighted by short validity and recent issuance against
    the legitimate-certificate baseline, surfaces freshly staged phishing/C2 domains. Positive results
    indicate adversary domain+certificate resource development.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - Windows Event ID 41 (Microsoft-Windows-CAPI2/Operational)
  - 'NAI: Network egress points, corporate DNS resolvers, and all enterprise Windows endpoints'' certificate
    trust stores.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM x509.log JOIN dns.log

      FOR cn,san: d = min(levenshtein(name, protected_domains))

      WHERE d<3 ALERT typosquat

      FOR free_CA certs: WHERE domain_age <= 5th_pct ALERT (weight short validity, recent issuance)'
- question: Are there sudden spikes in DNS query volume for domains tied to self-signed or free-CA certificates
    that exceed forecasted bounds from a time-series model?
  context: A surge of DNS resolution for domains associated with suspicious self-signed/free-CA certificates
    can indicate an adversary bringing newly developed certificate-backed infrastructure online. Training
    a Prophet/LSTM forecaster on Zeek dns.log query volume for those domains and alerting when actual
    volume exceeds the forecasted upper bound flags this activation. Surfacing the contributing domains
    makes the alert actionable. This anticipates operational use of Resource-Development assets.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - Windows Event ID 41 (Microsoft-Windows-CAPI2/Operational)
  - 'NAI: Network egress points, corporate DNS resolvers, and all enterprise Windows endpoints'' certificate
    trust stores.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'series = dns.log query_count per day for cert-linked domains

      model = Prophet/LSTM.fit(series)

      WHERE actual > forecast.upper_bound ALERT + list top contributing domains'
- question: Are there certificates whose validity period is abnormally short (<30 days) or abnormally
    long (>825 days), excluding known-good issuers such as Let's Encrypt's 90-day certificates?
  context: Abnormally short or long certificate validity is a documented malware-cert characteristic.
    Flagging x509.log certs with validity delta <30d or >825d, while excluding legitimate short-lived
    issuers (Let's Encrypt), provides a simple, deployable (Sigma-codifiable) rule. A flagged certificate
    warrants review as potential adversary-developed TLS resource, especially when combined with other
    anomalies.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Network egress points, web proxies, and inline TLS decryption devices where full certificate
    details are visible.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM x509.log

      delta = not_valid_after - not_valid_before

      WHERE (delta<30d OR delta>825d) AND issuer NOT IN goodlist(LetsEncrypt,...)

      ALERT'
- question: Do any certificates exhibit Shannon entropy in the subject CN or issuer, or a validity duration,
    that exceeds +/-3 sigma or falls outside 1.5*IQR of the established 90-day baseline?
  context: Adversary-generated certificates often contain randomized/high-entropy subject or issuer fields
    and atypical validity durations. Baselining Shannon entropy of subject CN and issuer plus validity
    duration over 90 days, then flagging certs exceeding +/-3 sigma or outside 1.5*IQR, anchors expected
    ranges to the measured legitimate distribution. Outliers are candidate adversary-developed certificates
    and support Resource Development hunting without requiring labels or IOCs.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Network egress points, web proxies, and inline TLS decryption devices where full certificate
    details are visible.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "BASELINE over 90d: entropy(subject_cn), entropy(issuer), validity_days\nFOR each cert: WHERE\
      \ metric > mean+3sigma OR metric < mean-3sigma\n   OR metric outside [Q1-1.5IQR, Q3+1.5IQR] ALERT"
- question: Does an unsupervised outlier model (Isolation Forest and/or DBSCAN) over certificate feature
    vectors (subject/issuer entropy, validity, key length, SAN count, self-signed flag, JA4X) surface
    low-density outlier certificates?
  context: When labels and exact IOCs are unavailable, unsupervised methods catch novel adversary certificates.
    Isolation Forest isolates low-density outliers efficiently and DBSCAN prioritizes noise points that
    do not belong to any dense cluster. Scoring certificate feature vectors this way surfaces anomalous
    certificates for review, and emitting the top-3 features driving the outlier score (via SHAP) keeps
    the result explainable. Outliers are candidate adversary-developed certificate resources.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Network egress points, web proxies, and inline TLS decryption devices where full certificate
    details are visible.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = [entropy(subject),entropy(issuer),validity,key_len,san_count,self_signed,ja4x]

      scores = IsolationForest.fit_predict(X); clusters = DBSCAN.fit(X)

      WHERE isolation_outlier OR dbscan_noise ALERT + SHAP top3 features'
- question: Is a single suspicious certificate (self-signed/high-entropy/short-validity), identified by
    its SHA1/fingerprint, observed on more than 3 distinct destination IPs across different /24 subnets
    within a 24-hour window?
  context: Adversaries reuse one certificate across multiple C2 nodes. Tracking suspicious certificate
    fingerprints on a watchlist and alerting when one appears on >3 distinct destination IPs spanning
    different /24s within 24 hours is a reliable pivot to shared adversary infrastructure. A positive
    result strongly indicates a single operator standing up multiple endpoints with the same staged certificate,
    a hallmark of Resource Development.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network egress points, flow data collectors (e.g., NetFlow/IPFIX), and inline TLS decryption
    devices.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM ssl.log JOIN conn.log

      FOR susp_cert.fingerprint over rolling 24h

      COUNT DISTINCT id.resp_h, DISTINCT subnet(/24)

      WHERE distinct_ips>3 AND distinct_/24>1 ALERT shared-infra'
- question: For each certificate fingerprint, does the count of unique destination IPs (id.resp_h) and
    unique SNIs (server_name) over 7 days exceed the 99th percentile (or modified Z-score |Mi|>3.5), excluding
    expected CDN/shared-hosting concentration?
  context: Legitimate shared certificates concentrate on CDN/shared-hosting ASNs, whereas an adversary
    certificate spread across many unrelated IPs/SNIs is anomalous. Counting unique id.resp_h and server_name
    per fingerprint over 7 days and flagging those above the 99th percentile or |Mi|>3.5 surfaces this
    fan-out, while contrasting against the legitimate ecosystem reduces false positives. High diversity
    indicates shared adversary C2 infrastructure.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network egress points, flow data collectors (e.g., NetFlow/IPFIX), and inline TLS decryption
    devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM ssl.log over 7d GROUP BY cert.fingerprint

      COMPUTE distinct(id.resp_h), distinct(server_name)

      WHERE count>p99 OR |Mi|>3.5 AND asn NOT IN cdn_shared_hosting ALERT'
- question: Across reused certificates, are there repeated failed/RST handshakes or validation_status
    != 'ok' events to multiple distinct destinations presenting the same certificate (beaconing to dead
    C2)?
  context: Failure is signal. A reused certificate presented by multiple destinations that repeatedly
    fail handshakes or validation indicates an implant beaconing to several C2 nodes that are offline.
    Tracking failed/RST handshakes and validation_status!=ok per reused certificate, then alerting when
    the same cert fails across multiple destinations, yields a distinct high-confidence detection of shared
    but currently-down adversary infrastructure under Resource Development.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network egress points, flow data collectors (e.g., NetFlow/IPFIX), and inline TLS decryption
    devices.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM ssl.log,conn.log GROUP BY cert.fingerprint

      COUNT (validation_status!=''ok'' OR RST/failed) per distinct dst

      WHERE failing_dst_count>1 AND repeated ALERT beaconing-to-dead-C2'
- question: Does graph community detection over a certificate-fingerprint / IP / SNI tripartite graph
    reveal certificate nodes with high centrality bridging multiple disparate IP/SNI communities?
  context: Modeling certificate-fingerprint, IP, and SNI relationships as a tripartite graph and running
    Louvain community detection reveals structure that pairwise rules miss. Certificate nodes with high
    centrality that bridge otherwise disparate IP/SNI communities are strong candidates for shared C2
    infrastructure pivoting many endpoints. Listing the bridged destinations in the alert makes the finding
    actionable. This exposes the topology of adversary-developed certificate infrastructure.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Network egress points, flow data collectors (e.g., NetFlow/IPFIX), and inline TLS decryption
    devices.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'G = tripartite(cert_fingerprint -- ip -- sni)

      communities = louvain(G); centrality = betweenness(G)

      WHERE cert_node.centrality high AND bridges multiple communities

      ALERT + list bridged ip/sni destinations'
- question: Is a TLS session occurring for a domain first seen within the last 7 days whose certificate
    'not_valid_before' is also less than 7 days old, corroborated by the certificate's Certificate Transparency
    first-appearance time?
  context: A newly registered domain paired with a freshly issued certificate is a classic adversary setup.
    Querying domains' first-seen dates and alerting when a TLS session uses a domain first seen within
    7 days whose certificate not_valid_before is also <7 days old catches this pattern; corroborating
    with CT first-appearance time strengthens confidence. A match indicates just-in-time adversary infrastructure
    development supporting imminent operations.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - 'NAI: Network egress points, corporate DNS resolvers, and external threat intelligence platforms providing
    passive DNS data.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM ssl.log JOIN dns.log first_seen

      WHERE domain.first_seen within 7d AND cert.not_valid_before within 7d

      CORROBORATE CT.first_appearance ALERT new-domain+new-cert'
- question: What is the time delta between a domain's registration/first-seen date and its certificate's
    issuance, and does it fall in the bottom 1st percentile (e.g., issued within 24 hours of registration)?
  context: Adversaries often obtain a certificate immediately after registering a domain, producing an
    unusually small registration-to-issuance delta. Computing this delta and flagging cases in the bottom
    1st percentile (e.g., <24 hours), tuned to the environment's benign certificate-issuance baseline,
    surfaces freshly staged infrastructure. A very small delta is a strong indicator of adversary Resource
    Development timing.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - 'NAI: Network egress points, corporate DNS resolvers, and external threat intelligence platforms providing
    passive DNS data.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'delta = cert.not_valid_before - domain.registration/first_seen

      BASELINE benign delta distribution

      WHERE delta <= 1st_percentile (e.g. <24h) ALERT'
- question: Does a payload-agnostic flow classifier (over packet-size sequences, byte-direction ratios,
    timing, and burst structure) identify certificate-bearing adversary C2 even when certificate fields
    are not visible due to TLS 1.3/ECH encryption?
  context: TLS 1.3 and Encrypted ClientHello increasingly hide certificate fields, blinding certificate-based
    logic. Complementing it with a flow classifier trained on packet-size sequences, byte-direction ratios,
    timing, and burst structure detects adversary C2 regardless of certificate visibility. Surfacing the
    top-3 contributing features keeps alerts explainable. A positive classification flags likely C2 flows
    whose certificate resources were developed but cannot be inspected directly.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - 'NAI: Network egress points, corporate DNS resolvers, and external threat intelligence platforms providing
    passive DNS data.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = [pkt_size_seq, byte_dir_ratio, iat_timing, burst_structure]

      score = flow_classifier.predict(X)  # payload-agnostic

      WHERE score > threshold ALERT C2 + SHAP top3 features'
- question: Do daily counts of newly registered domains show forecast-exceeding spikes (ARIMA/Prophet)
    that correlate with self-signed or free-CA certificates, indicating large-scale adversary infrastructure
    setup?
  context: Large campaigns stand up many domains and certificates at once. Forecasting daily counts of
    new domains with ARIMA/Prophet and correlating forecast-exceeding spikes with self-signed/free-CA
    certificates detects bulk adversary infrastructure development. A correlated spike suggests coordinated
    Resource Development that precedes operations, giving defenders early warning.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - 'NAI: Network egress points, corporate DNS resolvers, and external threat intelligence platforms providing
    passive DNS data.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'series = daily new_domain_count; model = ARIMA/Prophet.fit(series)

      WHERE actual > forecast.upper_bound

      CORRELATE spike_domains WITH self_signed/free_CA certs ALERT'
