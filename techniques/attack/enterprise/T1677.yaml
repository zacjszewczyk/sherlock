  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary manipulates continuous
    integration / continuous delivery (CI/CD) pipelines -- by directly editing the CI configuration file,
    by poisoning files the configuration references (makefiles, scripts, tests, linters), or by abusing
    pull-request triggers from forks -- so that malicious code runs on build runners, exposing secrets
    and enabling credential theft, lateral movement, and supply-chain compromise. This evidence focuses
    on the condition that a CI/CD runner executes build steps that access secrets and then performs unexpected
    outbound network activity (e.g., HTTP/TLS to rare external domains), suggesting direct pipeline modification
    to exfiltrate credentials or artifacts. This Machine Learning approach works as follows: Train a robust
    one-class anomaly detector (Isolation Forest / One-Class SVM) over runner build-window feature vectors:
    process mix (tools invoked), command-line token features (curl/wget, base64, env dumping), network
    novelty, bytes-out, and temporal alignment of tool execution to outbound connections. Surface the
    top-3 contributing features (e.g., via LIME) in alert text rather than a bare score, per Robust IoT
    Security Using Isolation Forest and One-Class SVM. Complement with an LSTM sequence model that learns
    the normal ordered build steps per workflow and flags injected/out-of-order steps and unexpected network/process
    events, per DeepLog. Prioritize sequences where unusual egress follows immediately after secret-handling
    commands. A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    poisoned pipeline execution; pivot to the responsible build job and workflow, the runner host and
    its process tree, the triggering commit/PR and contributor, the secrets or credential files accessed,
    and the outbound destination and byte volume to scope what may have leaked and where the adversary
    went next. A negative result helps rule out this particular vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land
    pipeline abuse. Citations: [Robust IoT Security Using Isolation Forest and One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4);
    [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
