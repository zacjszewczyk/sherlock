name: 'T1677: Poisoned Pipeline Execution'
id: aba0abe4-1271-4233-b478-b8d5ce447870
description: 'This playbook helps an analyst investigate whether an adversary has achieved Poisoned Pipeline
  Execution (MITRE ATT&CK T1677) by manipulating CI/CD processes to run malicious code on build runners
  and expose secrets. It covers the three poisoning mechanisms: Direct Pipeline Execution (modifying the
  CI configuration file such as gitlab-ci.yml or .github/workflows/*.yml to exfiltrate credentials or
  export them as artifacts), Indirect Pipeline Execution (poisoning files referenced by the pipeline --
  makefiles, scripts, unit tests, linters -- so normally-offline build tools begin reaching the network),
  and Public Pipeline Execution (untrusted pull requests from forks abusing pull_request_target/workflow_run/issue_comment
  triggers and self-hosted runners to access secrets and execute attacker-controlled code). The hunt spans
  CI/CD SaaS audit logs (GitHub/GitLab Actions, RepoEvents, PR metadata), self-hosted runner endpoint
  telemetry (Windows Event IDs 4688/4624/4625, Linux auditd execve), and network egress (Zeek conn/dns/http/ssl),
  pursuing the behavior from several angles: correlating build-step process trees with runner egress to
  rare or non-allowlisted destinations during secret-bearing steps; hunting command lines for network-transfer
  and encoding/compression patterns consistent with exfiltration; detecting traditionally offline build
  tools that suddenly initiate outbound connections; statically flagging pwn-request workflow configurations
  and taint-tracking attacker-controllable context into shell sinks; baselining per-runner and per-workflow
  egress, bytes-out, failure (NXDOMAIN/403) and beaconing cadence; and correlating suspicious build egress
  with follow-on logons and new connections indicating credential theft and lateral movement. Detection
  methods combine deterministic symbolic-logic rules (egress allowlisting, LOLBin/downloader and base64-command
  signatures, pwn-request static analysis), statistical baselining (per-workflow novelty and bytes-out
  percentiles, failure-rate and FFT/autocorrelation cadence analysis, pre/post authentication change),
  and machine learning (Isolation Forest/One-Class SVM outlier scoring, LSTM/DeepLog build-sequence modeling,
  temporal-GNN provenance/KAIROS, and heterogeneous-graph embeddings/Log2vec for campaign detection),
  so the analyst can corroborate suspected pipeline poisoning against repository context, runner process
  lineage, secret access, and outbound destinations.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
