    access to secrets or execution on self-hosted runners, evidenced by build-time outbound connections
    and suspicious process execution patterns consistent with untrusted input being treated as trusted.
    -- specifically, using the ''Statically flag pwn-request workflow configurations'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary manipulates continuous
    integration / continuous delivery (CI/CD) pipelines -- by directly editing the CI configuration file,
    by poisoning files the configuration references (makefiles, scripts, tests, linters), or by abusing
