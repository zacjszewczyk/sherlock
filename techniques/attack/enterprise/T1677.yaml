questions:
- question: '[Execution] Detect runner egress to rare external destinations during secret-bearing steps:
    Can you determine whether a CI/CD runner executes build steps that access secrets and then performs
    unexpected outbound network activity (e.g., HTTP/TLS to rare external domains), suggesting direct
    pipeline modification to exfiltrate credentials or artifacts. -- specifically, using the ''Detect
    runner egress to rare external destinations during secret-bearing steps'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary manipulates continuous
    integration / continuous delivery (CI/CD) pipelines -- by directly editing the CI configuration file,
    by poisoning files the configuration references (makefiles, scripts, tests, linters), or by abusing
    pull-request triggers from forks -- so that malicious code runs on build runners, exposing secrets
    and enabling credential theft, lateral movement, and supply-chain compromise. This evidence focuses
    on the condition that a CI/CD runner executes build steps that access secrets and then performs unexpected
    outbound network activity (e.g., HTTP/TLS to rare external domains), suggesting direct pipeline modification
    to exfiltrate credentials or artifacts. This Symbolic Logic approach works as follows: On runner hosts,
    build the process tree (Event ID 4688 / auditd execve) for each job, identify CI executors (shell
    runners, powershell/cmd, python, node, make, msbuild) and correlate to outbound sessions (Zeek conn/http/ssl
    + dns) within the same step time window. Maintain a per-workflow allowlist of expected egress (e.g.,
    registry.npmjs.org, pypi.org, files.pythonhosted.org, ghcr.io, *.docker.io, github.com/api, internal
    mirrors) and ALERT when a destination is first-seen for that runner or outside the allowlist, especially
    during steps that read credentials (env export/printenv, reading ~/.npmrc/.pypirc/.docker/config.json,
    cloud credential files). This egress-allowlisting + process-correlation model is the reference design
    in Harden-Runner; secret-exposure scope follows Characterizing the Security of GitHub CI Workflows
    and CICD-SEC-4 in OWASP Top 10 CI/CD Security Risks. Reusable first-party signatures (non-network-aware
    process egress, LOLBin/downloader use) are in SigmaHQ. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable poisoned pipeline execution; pivot to the responsible
    build job and workflow, the runner host and its process tree, the triggering commit/PR and contributor,
    the secrets or credential files accessed, and the outbound destination and byte volume to scope what
    may have leaked and where the adversary went next. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land pipeline abuse. Citations: [Harden-Runner](https://github.com/step-security/harden-runner);
    [Characterizing the Security of GitHub CI Workflows](https://www.usenix.org/conference/usenixsecurity22/presentation/koishybayev);
    [OWASP Top 10 CI/CD Security Risks](https://owasp.org/www-project-top-10-ci-cd-security-risks/); [SigmaHQ](https://github.com/SigmaHQ/sigma).'
