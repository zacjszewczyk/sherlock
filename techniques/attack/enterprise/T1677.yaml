  range: Last 90 days (correlate build-step windows of +/- 5 minutes around the suspect job)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Detect runner egress to rare external destinations during secret-bearing steps (Symbolic
      Logic)

      source IN [Windows Event ID 4688, Windows Event ID 4624, Linux auditd execve, Zeek conn.log, Zeek
      dns.log, Zeek http.log, Zeek ssl.log]

      | approach: On runner hosts, build the process tree (Event ID 4688 / auditd execve) for each job,
      identify CI executors (shell runners, powershell/cmd, python, node, make, msbuild) and correlate
      to outbound sessions (Zeek conn/http/ssl + dns) within the same step time window

      | correlate over NAI: Self-hosted CI/CD runner hosts; build agents with access to secrets; egress
      gateways and DNS resolvers; build subnets; artifact storage endpoints; administrative workstations
      used to manage CI/CD infrastructure.

      | emit alert with contributing fields and entity context (workflow, job, runner host, process tree,
      contributor/PR, secret access, dest, bytes_out)'
  - technology: Zeek/pseudocode
    query: '# Detect runner egress to rare external destinations during secret-bearing steps (Zeek view)

      watch conn.log/dns.log/http.log/ssl.log for runner-host egress during build windows

      | join to process/build-step timeline on (runner host, time window)

      | flag first-seen/non-allowlisted destinations, NXDOMAIN/403 bursts, high bytes_out

      | emit candidate exfil with runner, dest, ASN, bytes, step context'
- question: '[Execution] Baseline normal runner destinations and alert on novelty bursts: Can you determine
    whether a CI/CD runner executes build steps that access secrets and then performs unexpected outbound
    network activity (e.g., HTTP/TLS to rare external domains), suggesting direct pipeline modification
    to exfiltrate credentials or artifacts. -- specifically, using the ''Baseline normal runner destinations
    and alert on novelty bursts'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary manipulates continuous
    integration / continuous delivery (CI/CD) pipelines -- by directly editing the CI configuration file,
    by poisoning files the configuration references (makefiles, scripts, tests, linters), or by abusing
    pull-request triggers from forks -- so that malicious code runs on build runners, exposing secrets
    and enabling credential theft, lateral movement, and supply-chain compromise. This evidence focuses
    on the condition that a CI/CD runner executes build steps that access secrets and then performs unexpected
    outbound network activity (e.g., HTTP/TLS to rare external domains), suggesting direct pipeline modification
    to exfiltrate credentials or artifacts. This Statistical Method approach works as follows: Establish
    per-runner/per-workflow baselines of outbound destination sets, ASNs, ports, and bytes-out during
    build windows over >=30 days. ALERT when a build shows >=1 new external domain/ASN during a signing/publish/deploy
    step, or bytes-out exceeding the per-workflow p99 (derive the threshold from your own historical builds;
    a publish job uploading artifacts has high baseline bytes, a unit-test job near zero). Apply stricter
    novelty thresholds to secret-bearing steps. Baselining of expected per-job endpoints follows Harden-Runner;
    privilege/secret scoping per Characterizing the Security of GitHub CI Workflows. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable poisoned pipeline execution;
    pivot to the responsible build job and workflow, the runner host and its process tree, the triggering
    commit/PR and contributor, the secrets or credential files accessed, and the outbound destination
    and byte volume to scope what may have leaked and where the adversary went next. A negative result
    helps rule out this particular vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land pipeline abuse.
    Citations: [Harden-Runner](https://github.com/step-security/harden-runner); [Characterizing the Security
    of GitHub CI Workflows](https://www.usenix.org/conference/usenixsecurity22/presentation/koishybayev).'
