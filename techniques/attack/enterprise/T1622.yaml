- question: Did a non-debugger process raise and handle a single-step (0x80000004), breakpoint (0x80000003),
    or illegal-instruction (0xC000001D) exception and then continue running, an SEH trick to infer whether
    a debugger 'swallowed' the exception?
  context: 'SEH-based anti-debug raises an exception and observes whether the program''s own handler receives
    it; if a debugger is present it intercepts the exception instead. Alert on STATUS_SINGLE_STEP, STATUS_BREAKPOINT,
    or illegal-instruction exceptions (Windows Event ID 1000/1001 plus Sysmon 1) raised and handled by
    a non-debugger that then continues without terminating. This trick is documented in Apriorit and al-khaser
    and quantified by Branco et al. A positive result is a process that intentionally faults on debugger-relevant
    codes yet keeps running. In the Stealth context, this matters because the adversary is trying to hide
    and conceal their actions by recognizing analysis tooling and altering behavior to blend in; detecting
    the debugger check itself exposes concealment that would otherwise leave defensive systems intact
    while the implant goes quiet. Source method: Symbolic Logic: Alert on STATUS_SINGLE_STEP (0x80000004),
    STATUS_BREAKPOINT (0x80000003), or illegal-instruction (0xC000001D) exceptions raised and handled
    by a non-debugger that then continues (no termination). This SEH/single-step debugger-inference trick
    is documented in [Apriorit anti-RE techniques](https://www.apriorit.com/dev-blog/367-anti-reverse-engineering-protection-techniques-to-use-before-releasing-software)
    and cataloged in [al-khaser](https://github.com/ayoubfaouzi/al-khaser); its prevalence is quantified
    by [Branco et al. (Black Hat 2012)](https://media.blackhat.com/bh-us-12/Briefings/Branco/BH_US_12_Branco_Scientific_Academic_WP.pdf).'
  answer_sources:
  - Windows Event ID 1000
