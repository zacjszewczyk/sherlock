name: 'T1622: Debugger Evasion'
id: d0737e60-b13b-4590-be75-8de96bb4a6d0
description: 'This playbook helps an analyst investigate evidence of Debugger Evasion (T1622), in which
  an adversary''s code attempts to detect and avoid debuggers and dynamic-analysis tools before executing
  or dropping additional payloads. It guides hunting across Windows, Linux, and macOS for the canonical
  anti-debug primitives: enumeration of debugger registry keys, files, and process/window names (x64dbg,
  OllyDbg, WinDbg, IDA Pro, ntsd, cdb, ProcMon); API-driven check-then-exit behavior (IsDebuggerPresent,
  NtQueryInformationProcess, PEB BeingDebugged) that loads kernel32.dll/ntdll.dll and terminates sub-second;
  self-debugging that occupies the single debug slot by pointing a debugger at its own parent PID; Structured
  Exception Handling and single-step/breakpoint/illegal-instruction tricks that infer a debugger from
  how exceptions are handled; threat-intelligence hash matches for families known to use anti-analysis;
  rapid bursts of process/window enumeration filtered for analysis-tool names; correlated host discovery
  followed by internal connections and unusual DNS; and the Linux/macOS /proc/self/status TracerPid, ptrace(PTRACE_TRACEME),
  and sysctl(KERN_PROC) self-trace checks. For each behavior the playbook supplies deterministic (symbolic-logic)
  detections, statistical baselining/outlier methods, and machine-learning approaches so an analyst can
  confirm whether an adversary is probing for and evading defensive instrumentation.'
