  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID IN (1000,1001) WHERE ExceptionCode IN [0x80000004,0x80000003,0xC000001D]

      AND process NOT a debugger AND process_continues (no terminate)

      | alert'
- question: Does an executable show an abnormally high handled-and-continued exception ratio for debugger-relevant
    codes, meaning it never crashes despite repeatedly faulting?
  context: 'Baseline each executable''s handled-vs-unhandled exception ratio (State) and exception Frequency
    (exceptions per minute). Flag spikes for debugger-relevant codes where exceptions are handled-and-continued
    rather than fatal. The distinguishing signal versus benign crashes is the failure-mode framing: a
    high handled-continue ratio means the program never crashes despite many exceptions, exactly what
    an SEH debugger check produces. A positive result is a process with many debugger-class exceptions,
    all handled, none fatal. In the Stealth context, this matters because the adversary is trying to hide
    and conceal their actions by recognizing analysis tooling and altering behavior to blend in; detecting
    the debugger check itself exposes concealment that would otherwise leave defensive systems intact
    while the implant goes quiet. Source method: Statistical Method: Baseline per-executable handled-vs-unhandled
    exception ratio (State) and exception Frequency (exceptions/min); flag spikes for debugger-relevant
    codes where exceptions are handled-and-continued rather than fatal. Failure-mode framing: a high handled-continue
    ratio (the program never crashes despite many exceptions) is the distinguishing signal versus benign
    crashes.'
  answer_sources:
