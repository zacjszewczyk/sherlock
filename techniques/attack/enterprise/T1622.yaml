questions:
- question: Is a process that is not part of approved software development or system administration touching
    debugger registry keys, file paths, or tool names (x64dbg, OllyDbg, WinDbg, IDA Pro, ntsd.exe, cdb.exe,
    ProcMon, ProcExp) in a way consistent with enumerating whether a debugger is present?
  context: 'Malware commonly checks for the presence of analysis tooling before revealing its real behavior.
    Using Sysmon Event ID 1 (command lines), 12/13 (registry), and 11 (file reads), alert deterministically
    when a process not on the developer/admin allowlist references debugger registry keys/paths or known
    debugger/tool names. This artifact-enumeration floor follows the al-khaser and Pafish catalogs. A
    hit from a standard user workstation or production server is high-signal because legitimate dev/admin
    tooling should be the only thing touching these artifacts. Keep the explicit name/path list and tune
    the allowlist rather than deleting entries. In the Stealth context, this matters because the adversary
    is trying to hide and conceal their actions by recognizing analysis tooling and altering behavior
    to blend in; detecting the debugger check itself exposes concealment that would otherwise leave defensive
    systems intact while the implant goes quiet. Source method: Symbolic Logic: Alert when Sysmon Event
    ID 1 command lines or registry events (12/13) or file reads (11) target debugger registry keys/paths
    or debugger/tool names (x64dbg, ollydbg, windbg, ida, ntsd.exe, cdb.exe, procmon, procexp) from a
    process not on the dev/admin allowlist. This deterministic name/path floor follows the artifact-enumeration
    catalogs in [al-khaser](https://github.com/ayoubfaouzi/al-khaser) and [Pafish](https://github.com/a0rtega/pafish).
    Keep the explicit name/path list; tune the allowlist, do not delete it.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 12 (Sysmon)
  - Windows Event ID 13 (Sysmon)
  - 'NAI: Standard user workstations, Production servers, Critical application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(EventID=1 AND CommandLine matches debugger_names) OR (EventID IN (12,13) AND TargetObject
      matches debugger_regkeys) OR (EventID=11 AND TargetFilename matches debugger_paths)

      WHERE Image NOT IN dev_admin_allowlist

      | debugger_names = [x64dbg, ollydbg, windbg, ida, ntsd.exe, cdb.exe, procmon, procexp]

      | alert'
- question: Within a baseline, does any non-developer process exceed the 99th percentile for the number
    of distinct debugger artifacts it touches, or show a burst of failed/NAME_NOT_FOUND probes that signal
    systematic debugger enumeration?
  context: 'Beyond a single deterministic match, probing behavior shows up statistically. Baseline per
    process the Volume (distinct debugger artifacts touched), Frequency (artifact accesses per minute),
    and State (successful read vs ACCESS_DENIED or registry NAME_NOT_FOUND) using Sysmon 11/12/13. Alert
    when a non-dev process exceeds the 99th percentile of distinct artifacts or shows a burst of failed/NAME_NOT_FOUND
    lookups, a classic probing signature. Branco et al. base rates justify treating such enumeration from
    non-dev hosts as high-fidelity. Derive thresholds from a 30-day per-environment baseline; a positive
    result is a process sweeping many debugger keys it does not find. In the Stealth context, this matters
    because the adversary is trying to hide and conceal their actions by recognizing analysis tooling
    and altering behavior to blend in; detecting the debugger check itself exposes concealment that would
    otherwise leave defensive systems intact while the implant goes quiet. Source method: Statistical
    Method: Baseline per-process Volume (distinct debugger artifacts touched per process), Frequency (artifact
    accesses/min), and State (successful read vs ACCESS_DENIED/registry NAME_NOT_FOUND) via Sysmon 11/12/13;
    alert when a non-dev process exceeds the 99th percentile of distinct artifacts or shows a burst of
    failed/NAME_NOT_FOUND probes (a probing signature). The prevalence base rates in [Branco et al. (Black
    Hat 2012)](https://media.blackhat.com/bh-us-12/Briefings/Branco/BH_US_12_Branco_Scientific_Academic_WP.pdf)
    justify treating any such enumeration from non-dev hosts as high-fidelity. Derive thresholds per environment
    from a 30-day baseline.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 12 (Sysmon)
  - Windows Event ID 13 (Sysmon)
  - 'NAI: Standard user workstations, Production servers, Critical application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per Image: distinct_artifacts, accesses_per_min, failed_lookup_ratio over 30d

      | WHERE Image NOT IN dev_admin_allowlist

      | ALERT if distinct_artifacts > p99 OR failed_lookup_ratio spikes (NAME_NOT_FOUND/ACCESS_DENIED
      burst)'
- question: Does a supervised classifier scoring process and registry features flag a process as likely
    malicious because of how many debugger artifacts it touched, its path entropy, signer status, and
    rare parentage?
  context: 'A Random Forest or gradient-boosted model trained on process/registry features (image name,
    path entropy, command-line tokens, count of debugger artifacts touched, signer status, parent) can
    catch enumeration that evades static lists, as in CNN-LSTM API/opcode classification work. Alert on
    high malicious probability and surface the top-3 contributing features (e.g., ''touched 4 debugger
    keys'', ''unsigned temp-path image'', ''rare parent'') so the analyst can triage quickly. A positive
    result is an unsigned, oddly-parented binary that swept several debugger artifacts. In the Stealth
    context, this matters because the adversary is trying to hide and conceal their actions by recognizing
    analysis tooling and altering behavior to blend in; detecting the debugger check itself exposes concealment
    that would otherwise leave defensive systems intact while the implant goes quiet. Source method: Machine
    Learning: Train a Random Forest/gradient-boosted classifier on process/registry features (image name,
    path entropy, command-line tokens, count of debugger artifacts touched, signer status, parent) as
    in [CNN-LSTM API/opcode classification](https://www.sciencedirect.com/science/article/abs/pii/S0950705124001783);
    alert on high malicious probability and surface the top-3 contributing features (e.g., ''touched 4
    debugger keys'', ''unsigned temp-path image'', ''rare parent'') in the alert text for triage.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 12 (Sysmon)
  - Windows Event ID 13 (Sysmon)
  - 'NAI: Standard user workstations, Production servers, Critical application servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [image_name, path_entropy, cmdline_tokens, n_debugger_artifacts, signer_status,
      parent]

      score = RandomForest/GBM.predict_proba(features)

      ALERT if score > threshold WITH top3_feature_attribution'
- question: Did a process load kernel32.dll or ntdll.dll and then terminate within one second, especially
    when it is unsigned or runs from a temp/AppData path, consistent with an API-based check-then-exit
    anti-debug routine?
  context: 'The canonical IsDebuggerPresent / NtQueryInformationProcess pattern is: load the module, perform
    the check, and exit immediately if analysis is detected. Using Sysmon 7 (image load) and 5 (process
    terminate), alert when kernel32.dll or ntdll.dll loads link to a process that terminates within 1
    second, capturing the exit code (State), and weight unsigned or temp/AppData images higher. This behavior
    is documented in al-khaser and Apriorit. Keep the 1-second floor and tune per environment; a positive
    result is a sub-second self-terminating process that never did meaningful work. In the Stealth context,
    this matters because the adversary is trying to hide and conceal their actions by recognizing analysis
    tooling and altering behavior to blend in; detecting the debugger check itself exposes concealment
    that would otherwise leave defensive systems intact while the implant goes quiet. Source method: Symbolic
    Logic: Alert when Sysmon 7/5 for kernel32.dll or ntdll.dll link to a process that terminates within
    1 second (State: capture exit code), especially if unsigned or from temp/AppData paths. This check-then-exit
    pattern is the canonical IsDebuggerPresent/NtQueryInformationProcess anti-debug behavior documented
    in [al-khaser](https://github.com/ayoubfaouzi/al-khaser) and [Apriorit anti-RE techniques](https://www.apriorit.com/dev-blog/367-anti-reverse-engineering-protection-techniques-to-use-before-releasing-software).
    Keep the 1-second floor; tune by environment.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 5 (Sysmon)
  - Windows Event ID 7 (Sysmon)
  - 'NAI: All Windows endpoints and servers, Virtual Desktop Infrastructure (VDI) instances, Security
    analysis sandbox environments'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'JOIN Sysmon EventID=7 (ImageLoaded IN [kernel32.dll, ntdll.dll]) WITH EventID=5 ON ProcessGuid

      WHERE (terminate_time - create_time) < 1s

      | weight if Signed=false OR Image IN (temp, AppData)

      | alert WITH exit_code'
- question: Is a given image consistently running for an unusually short time (bottom 1st percentile of
    its lifetime distribution), with repeated sub-second spawns, indicating it exits early only when instrumentation
    is present?
  context: 'Baseline process lifetimes per image and flag runs in the bottom 1st percentile, weighted
    by Frequency (repeated sub-second spawns of the same image per host per minute) and State (exit-code
    distribution). Cross-environment behavioral divergence, where a sample runs normally but exits early
    when instrumented, is the robust evasion signal established by DISARM and BareCloud. A positive result
    is an image whose lifetime collapses to near-zero specifically on monitored/sandboxed hosts. In the
    Stealth context, this matters because the adversary is trying to hide and conceal their actions by
    recognizing analysis tooling and altering behavior to blend in; detecting the debugger check itself
    exposes concealment that would otherwise leave defensive systems intact while the implant goes quiet.
    Source method: Statistical Method: Baseline process lifetimes per image and flag those in the bottom
    1st percentile, weighted by Frequency (repeated sub-second spawns of the same image per host/min)
    and State (exit code distribution). Cross-environment behavioral divergence — runs that exit early
    only when instrumentation is present — is the robust evasion signal established by [DISARM](https://link.springer.com/chapter/10.1007/978-3-642-23644-0_18)
    and [BareCloud](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-kirat.pdf).'
