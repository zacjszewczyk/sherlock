name: 'T1558: Steal or Forge Kerberos Tickets'
id: fcfc1392-2144-43c4-ab89-aee7a24ad5f3
description: This playbook helps an analyst investigate whether an adversary has stolen or forged Kerberos
  tickets to gain unauthorized access (Pass-the-Ticket, Kerberoasting, AS-REP Roasting, Golden and Silver
  tickets). It guides the hunt across host execution evidence (credential/ticket tooling such as Mimikatz,
  Rubeus, Kekeo and Impacket seen at process creation), abnormal Kerberos service-ticket request behavior
  (Event ID 4769 RC4-HMAC requests for user-account SPNs), AS-REP Roasting indicators (Event ID 4768 with
  pre-authentication disabled), forged-ticket indicators (anomalous SIDs in logons, TGS requests without
  a preceding TGT, abnormal ticket lifetimes), and LSASS memory access used to extract Kerberos key material.
  For each line of evidence it provides symbolic-logic detections, statistical baselining methods, and
  machine-learning approaches an analyst can apply across Windows Security/Sysmon logs, auditd, macOS
  unified logs, and Zeek kerberos.log.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are there process-creation events (Windows Event ID 4688 or Sysmon Event ID 1) where the process
    image hash matches a known credential/ticket-theft tool, or where the command line contains high-fidelity
    Kerberos attack patterns such as 'kerberos::golden', 'kerberos::ptt', 'asktgt /user:', 'kerberoast',
    'asreproast', 'klist purge', or 'lsadump::lsa'?
  context: 'This question targets the moment a Kerberos ticket theft or forgery tool executes on a host,
    which directly supports the Credential Access tactic. Tools like Mimikatz, Rubeus, Kekeo, and Impacket
    leave distinctive hashes and command-line signatures. A positive result is a strong, high-fidelity
    indicator that an operator is staging Pass-the-Ticket, Kerberoasting, or Golden/Silver ticket activity.
    Because ticket extraction for Pass-the-Ticket is typically preceded by host execution, correlate any
    hit with subsequent LSASS handle requests (Sysmon Event ID 10) on the same host. A negative result
    lowers (but does not eliminate) the chance of tool-based abuse, as adversaries may rename binaries
    or use living-off-the-land techniques. References: [SigmaHQ Potential Credential Dumping Via LSASS](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_access/proc_access_win_lsass_memdump.yml);
    [Metcalf, Detecting Forged Kerberos Tickets](https://adsecurity.org/?p=1515).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Member Servers, Privileged User Workstations, Standard User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=windows (EventCode=4688 OR (source=Sysmon EventCode=1))\n| eval cmd=lower(CommandLine)\n\
      | where (Hashes IN (known_cred_tool_hashes))\n   OR like(cmd,\"%kerberos::golden%\") OR like(cmd,\"\
      %kerberos::ptt%\")\n   OR like(cmd,\"%asktgt /user:%\") OR like(cmd,\"%kerberoast%\")\n   OR like(cmd,\"\
      %asreproast%\") OR like(cmd,\"%klist purge%\")\n   OR like(cmd,\"%lsadump::lsa%\")\n| alert priority=high\n\
      | join host [search Sysmon EventCode=10 TargetImage=*lsass.exe]"
- question: For command-line execution events, which commands deviate sharply (>2-3 standard deviations)
    from the per-user/per-host baseline of Shannon entropy and character frequency, or involve a binary
    unseen in the prior 30 days running with authentication/ticket-related parameters?
  context: 'Adversaries frequently obfuscate or encode their tooling to evade signature matching, which
    raises command-line entropy above normal administrative usage. Building a per-user and per-host baseline
    of Shannon entropy and character-frequency, then flagging >2-3 sigma deviations, surfaces obfuscated
    or encoded Kerberos payloads even when exact strings are unknown. Combine this with a rarity signal:
    count rare process executions per host and alert when a binary unseen in the prior 30 days runs with
    ticket/auth parameters, deriving the rarity threshold (top 0.5%) from your own 30-day corpus. In a
    Credential Access investigation, a positive result points to evasive execution of ticket-theft tooling;
    review the decoded command line and the executing user/host together. References: [Dwyer & Truta,
    Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Member Servers, Privileged User Workstations, Standard User Workstations'
  range: Last 90 days (baseline over trailing 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=windows (EventCode=4688 OR (source=Sysmon EventCode=1))

      | eval ent=shannon_entropy(CommandLine)

      | eventstats mean(ent) as mu stdev(ent) as sd by user host

      | eval z=(ent-mu)/sd

      | eval firstseen=earliest(_time) by host, Image

      | where z>3 OR (firstseen>relative_time(now(),"-30d") AND match(CommandLine,"(?i)tgt|ticket|asktgt|roast|kerberos"))

      | sort -z'
- question: When a supervised classifier (Gradient Boosting or Random Forest) scores process-creation
    events using features such as parent process, command-line length/argument count, entropy, Kerberos
    keywords ('kerberos','ticket','tgt','asktgt','roast','dump'), and signature status, which events are
    classified as likely credential/ticket theft?
  context: 'A supervised model trained on labeled process-creation events can separate credential dumpers
    and ticket-theft tools from benign administrative binaries using a richer feature set than a single
    rule. Useful features include the parent process (e.g., an anomalous services.exe parent), command-line
    length and argument count, entropy, presence of Kerberos keywords, and whether the binary is digitally
    signed. For analyst trust, the model should surface the top-3 contributing features in alert text
    (e.g., parent anomaly + keyword + unsigned binary). In a Credential Access hunt, model hits prioritize
    triage; validate flagged events against host telemetry and the symbolic-logic and entropy signals
    above. References: [Ah-Fat et al., Effective Detection of Credential Thefts from Windows Memory](https://www.usenix.org/system/files/raid20-ah-fat.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Member Servers, Privileged User Workstations, Standard User Workstations'
  range: Last 90 days (train on labeled historical corpus)
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = GradientBoostingClassifier()\nfeatures = [parent_process, cmdline_len, arg_count,\
      \ entropy,\n            has_kw(kerberos|ticket|tgt|asktgt|roast|dump), is_signed]\nscore = model.predict_proba(event.features)\n\
      if score >= threshold:\n    alert(event, top3_features=model.explain(event))"
- question: Are there Windows Event ID 4769 service-ticket requests with Ticket Encryption Type = 0x17
    (RC4-HMAC) and Ticket Options = 0x40810000 for a Service Name that does NOT end in '$' (i.e., a user-account
    SPN), excluding approved legacy service accounts?
  context: 'This is the core Kerberoasting indicator. Adversaries request RC4-HMAC encrypted service tickets
    for user-account SPNs so the tickets can be cracked offline to recover the service account''s plaintext
    password. Service Names ending in ''$'' are machine accounts (normal); user SPNs are the prime Kerberoasting
    targets. Maintain an allowlist of legitimate legacy RC4 service accounts to reduce noise. Correlate
    hits with Zeek kerberos.log to confirm the source IP/segment of the requester. In a Credential Access
    investigation, a positive result indicates active service-ticket harvesting; pivot to the requesting
    account and the targeted SPNs. References: [SigmaHQ Suspicious Kerberos RC4 Ticket Encryption](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_rc4_kerberos.yml);
    [Microsoft 4769](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769).'
  answer_sources:
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers, Network sensors monitoring traffic to/from Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=windows EventCode=4769 TicketEncryptionType=0x17 TicketOptions=0x40810000

      | where NOT match(ServiceName,"\$$")

      | search NOT ServiceName IN (legacy_rc4_allowlist)

      | stats count by Account_Name ServiceName Client_Address

      | join Client_Address [search source=zeek kerberos.log]

      | alert'
- question: For each client account, does the count of unique Service Names requested via Event ID 4769
    over a rolling 5-minute window exceed the 99th percentile across users or that user's 30-day mean
    + 3 sigma, and is there a sudden RC4-to-AES (0x17 vs 0x12/0x11) ratio spike?
  context: 'Kerberoasting at scale produces a burst of service-ticket requests for many distinct SPNs
    from a single account in a short window. Aggregating distinct Service Name counts per account over
    a rolling 5-minute window and comparing to a 30-day per-user mean/standard deviation (or the cross-user
    99th percentile) surfaces this spray behavior. Separately, profiling each account''s RC4-to-AES encryption
    ratio catches downgrade behavior where attackers force weaker RC4 tickets to ease offline cracking;
    failed TGS status codes form a distinct probing signal. For Credential Access, a positive result flags
    an account harvesting many service tickets at once - investigate whether the volume and encryption
    choice are consistent with legitimate application behavior. References: [Dwyer & Truta, Finding Anomalies
    in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [SigmaHQ Kerberos Manipulation](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_kerberos_manipulation.yml).'
  answer_sources:
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers, Network sensors monitoring traffic to/from Domain Controllers'
  range: Last 90 days (baseline over trailing 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=windows EventCode=4769\n| bin _time span=5m\n| stats dc(ServiceName) as spn_count,\n\
      \        sum(eval(TicketEncryptionType=\"0x17\")) as rc4,\n        sum(eval(TicketEncryptionType\
      \ IN (\"0x11\",\"0x12\"))) as aes by Account_Name _time\n| eventstats mean(spn_count) as mu stdev(spn_count)\
      \ as sd by Account_Name\n| eval rc4_ratio=rc4/(rc4+aes+1)\n| where spn_count > mu+3*sd OR spn_count\
      \ > perc99(spn_count) OR rc4_ratio > baseline_ratio*2\n| alert"
- question: Does a time-series model (Seasonal-ARIMA or LSTM autoencoder) of per-user TGS-REQ (Event ID
    4769) volume per hour show observed volume deviating sharply from the predicted time-of-day / day-of-week
    rhythm, consistent with a Kerberoasting spray?
  context: 'Legitimate service-ticket request volume follows predictable daily and weekly rhythms tied
    to business hours and application schedules. A time-series model that learns this seasonality (Seasonal-ARIMA
    or an LSTM autoencoder) can flag hours where a user''s 4769 volume departs sharply from prediction
    - a hallmark of bursty Kerberoasting. The alert should report the top-3 drivers (distinct-SPN count,
    RC4 ratio, hour-of-day) for explainability. In a Credential Access hunt, a positive result identifies
    anomalous request bursts even when the absolute count is below a static threshold; correlate with
    the RC4/SPN signals above to confirm intent. References: [DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers, Network sensors monitoring traffic to/from Domain Controllers'
  range: Last 90 days (train on multi-week history)
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = hourly_count(4769) by user\nmodel = SeasonalARIMA(series)  # or LSTM_autoencoder(series)\n\
      pred = model.forecast()\nresid = observed - pred\nif resid > k * resid_stdev:\n    alert(user, hour,\
      \ top3=[distinct_spn, rc4_ratio, hour_of_day])"
- question: Are there Windows Event ID 4768 (TGT request) events where Pre-Authentication Type = 0 and
    Result Code = 0x0 (Success), confirmed by Active Directory showing the user's userAccountControl includes
    DONT_REQ_PREAUTH?
  context: 'This is the deterministic AS-REP Roasting indicator. When an account has Kerberos pre-authentication
    disabled (DONT_REQ_PREAUTH), the KDC returns an AS-REP containing material encrypted with the account''s
    password hash without requiring proof of identity - allowing an attacker to request it and crack it
    offline. A successful 4768 with Pre-Authentication Type = 0 is the on-the-wire signature; enrich via
    LDAP to confirm the account attribute. Also flag RC4 (0x17) AS-REP encryption as a downgrade signal.
    In Credential Access, a positive result means an account is exposed to (or being actively targeted
    for) AS-REP Roasting; investigate why pre-auth is disabled and whether the requester is legitimate.
    References: [Microsoft 4768](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4768);
    [Metcalf, Detecting Forged Kerberos Tickets](https://adsecurity.org/?p=1515).'
  answer_sources:
  - Windows Event ID 4768
  - Zeek kerberos.log
  - 'NAI: Domain Controllers, Active Directory infrastructure, Network sensors monitoring traffic to/from
    Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=windows EventCode=4768 PreAuthType=0 ResultCode=0x0

      | lookup ad_users Account_Name OUTPUT userAccountControl

      | where match(userAccountControl,"DONT_REQ_PREAUTH")

      | eval downgrade=if(TicketEncryptionType="0x17","yes","no")

      | alert'
- question: Does the daily count of Active Directory accounts with pre-authentication disabled increase,
    and for any such account does the rate of successful pre-auth=0 TGT requests (Event ID 4768) exceed
    the 95th percentile of its own history?
  context: 'Two complementary State and rate signals matter here. First, a day-over-day increase in the
    number of accounts with DONT_REQ_PREAUTH set may indicate an attacker (or risky admin change) deliberately
    weakening accounts to enable AS-REP Roasting. Second, baselining each such account''s frequency of
    successful pre-auth=0 TGT requests and alerting above its 95th percentile catches sudden harvesting
    of AS-REP material. Profiling AS-REQ failure codes (0x6 no-such-user, 0x12 disabled, 0x18 bad-password)
    provides a distinct enumeration/probing signal. In a Credential Access investigation, positives indicate
    either expanded attack surface or active roasting; reconcile config changes with change-management
    records. References: [Dwyer & Truta, Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [SigmaHQ Kerberos Manipulation](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_kerberos_manipulation.yml).'
  answer_sources:
  - Windows Event ID 4768
  - Zeek kerberos.log
  - 'NAI: Domain Controllers, Active Directory infrastructure, Network sensors monitoring traffic to/from
    Domain Controllers'
  range: Last 90 days (daily State comparison)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# State change: daily count of preauth-disabled accounts

      ad_preauth_disabled = count(ad_users where DONT_REQ_PREAUTH)

      if ad_preauth_disabled > yesterday_count: alert("new preauth-disabled accounts")

      # Per-account rate

      index=windows EventCode=4768 PreAuthType=0 ResultCode=0x0

      | stats count as c by Account_Name date

      | eventstats perc95(c) as p95 by Account_Name

      | where c > p95 | alert'
- question: Using clustering (e.g., DBSCAN) for peer-group analysis that groups users by role/department/access
    pattern, which users are statistical outliers from their peer group's rate of pre-auth-disabled TGT
    requests, suggesting they are being targeted for AS-REP Roasting?
  context: 'Peer-group analysis recognizes that a single global threshold misclassifies users whose normal
    behavior differs by role. Clustering users by role, department, or access pattern (e.g., with DBSCAN)
    and baselining each group''s rate of pre-auth-disabled TGT requests lets you flag individuals who
    deviate from their peers - a sign that a specific account is being singled out for AS-REP Roasting.
    The alert should surface the deviating peer-group and feature contributions. In a Credential Access
    hunt, an outlier within an otherwise-quiet peer group warrants investigation of who is requesting
    that account''s tickets and from where. References: [CyberGraph, Bowman et al.](https://www.usenix.org/system/files/raid2020-paper-bowman.pdf).'
  answer_sources:
  - Windows Event ID 4768
  - Zeek kerberos.log
  - 'NAI: Domain Controllers, Active Directory infrastructure, Network sensors monitoring traffic to/from
    Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = per_user[role, dept, access_pattern, preauth0_tgt_rate]\nclusters = DBSCAN(eps,\
      \ min_samples).fit(features)\nfor user in clusters:\n    if user.preauth0_rate >> cluster.mean_rate:\n\
      \        alert(user, peer_group=cluster.id, contrib=top_features)"
- question: For each successful network logon (Event ID 4624, Logon Type 3 or 9), do the token SIDs include
    privileged groups (Domain/Enterprise Admins) that are NOT in a fresh AD query of the user's actual
    group memberships (Golden Ticket), or does a member-server TGS request (4769) occur for a user with
    no TGT request (4768) on any DC within the TGT lifetime (Silver Ticket)?
  context: 'This question hunts forged Kerberos tickets directly. A Golden Ticket forges a TGT with arbitrary
    group SIDs, so a logon token can carry Domain/Enterprise Admin SIDs the account does not actually
    possess, or have blank/mismatched account/domain fields. Comparing token SIDs to a fresh, authoritative
    AD membership query exposes this discrepancy. A Silver Ticket forges a service ticket (TGS) for a
    specific service without contacting the KDC, so a 4769 appears on a member server with no corresponding
    4768 TGT on any DC within the default 10-hour lifetime. Also flag RC4 (0x17) downgrade and abnormal
    ticket lifetimes. In Credential Access, positives are very high-fidelity indicators of ticket forgery;
    treat as potential domain compromise. References: [Metcalf, Detecting Forged Kerberos Tickets](https://adsecurity.org/?p=1515);
    [Microsoft 4769](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Zeek kerberos.log
  - 'NAI: Domain Controllers, Critical Member Servers (e.g., file servers, database servers), User Workstations,
    Active Directory infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Golden Ticket

      index=windows EventCode=4624 (LogonType=3 OR LogonType=9)

      | lookup ad_groups Account_Name OUTPUT actual_sids

      | where (privileged_sid_in_token AND NOT in(actual_sids)) OR Account_Name="" OR Account_Domain=""

      | alert

      # Silver Ticket

      index=windows EventCode=4769 host=member_server

      | join type=left Account_Name [search EventCode=4768 earliest=-10h]

      | where isnull(TGT_4768) | alert'
- question: When a per-logon 'privilege score' is computed from token SIDs and baselined per user (Golden
    Ticket), which sessions exceed the user's history by >3 sigma; and in Zeek kerberos.log, which ticket
    lifetimes (till - from) exceed domain policy or come from a client IP that is not a known DC (Silver
    Ticket)?
  context: 'Statistical profiling complements the deterministic rule. For Golden Tickets, scoring each
    logon by the privilege level of its token SIDs and baselining each user''s normal range flags sessions
    that are abruptly more privileged than that user ever was (>3 sigma) - a forged-TGT signature. For
    Silver Tickets, attackers often set unrealistically long ticket lifetimes (even multi-year) to maintain
    persistence; profiling the ticket lifetime distribution in Zeek kerberos.log and alerting on values
    exceeding domain policy, or TGS issued from a non-DC client IP, catches these. Kerberos failure codes
    (4769/4771) form an accompanying State signal. In Credential Access, positives indicate likely forgery;
    validate ticket lifetimes against domain policy and the issuing host. References: [Metcalf, Detecting
    Forged Kerberos Tickets](https://adsecurity.org/?p=1515); [SigmaHQ Kerberos Manipulation](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_kerberos_manipulation.yml).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Zeek kerberos.log
  - 'NAI: Domain Controllers, Critical Member Servers (e.g., file servers, database servers), User Workstations,
    Active Directory infrastructure'
  range: Last 90 days (baseline over user history)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Golden Ticket privilege score

      index=windows EventCode=4624 | eval pscore=privilege_score(token_sids)

      | eventstats mean(pscore) as mu stdev(pscore) as sd by Account_Name

      | where pscore > mu+3*sd | alert

      # Silver Ticket lifetime

      source=zeek kerberos.log | eval life=till-from

      | where life > domain_max_lifetime OR NOT client_ip IN (known_dc_ips) | alert'
- question: In a user-service authentication graph (users/hosts/SPNs as nodes; 4769/4624 events as edges
    weighted by frequency), which edges are scored as improbable new user->service relationships or credential
    switches without a benign causal explanation, consistent with forged Silver/Golden tickets?
  context: 'Modeling authentication as a graph captures relationships a per-event rule cannot. Users,
    hosts, and SPNs become nodes; 4769 and 4624 events become weighted edges. Graph link-prediction or
    anomaly-detection methods score each edge, and forged Silver/Golden tickets manifest as improbable
    brand-new user->service edges or credential switches that lack a benign causal chain. The approach
    is validated on the labeled LANL authentication dataset; alerts should surface the anomalous edge,
    its predicted probability, and a peer comparison. In a Credential Access investigation, a flagged
    edge points the analyst to exactly which user accessed which service abnormally - a precise lead for
    confirming ticket forgery. References: [CyberGraph, Bowman et al.](https://www.usenix.org/system/files/raid2020-paper-bowman.pdf);
    [Hopper, Ho et al.](https://www.usenix.org/system/files/sec21-ho.pdf); [Euler, King & Huang](https://dl.acm.org/doi/10.1145/3588771);
    [LANL dataset, Kent](https://csr.lanl.gov/data/auth/).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Zeek kerberos.log
  - 'NAI: Domain Controllers, Critical Member Servers (e.g., file servers, database servers), User Workstations,
    Active Directory infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_graph(nodes=[users,hosts,spns],\n               edges=events(4769,4624), weight=frequency)\n\
      scores = link_prediction_anomaly(G)\nfor edge in scores:\n    if edge.prob < threshold:  # improbable\
      \ new user->service\n        alert(edge, prob=edge.prob, peer_cmp=edge.peers)"
- question: Does an LSTM log-key sequence model of per-host Kerberos/logon streams flag order anomalies
    in the expected sequence (AS-REQ 4768 -> TGS-REQ 4769 -> logon 4624) - for example a 4769/4624 on
    a member server with no preceding 4768 on any DC (Silver Ticket) or replayed/injected out-of-context
    events?
  context: 'Legitimate Kerberos authentication follows a predictable order: a TGT request (4768), then
    service-ticket requests (4769), then logons (4624). An LSTM log-key sequence model learns this normal
    ordering per host and flags sequences that break it. A Silver Ticket produces 4769/4624 on a member
    server with no preceding 4768 on any DC, and replayed or injected tickets create out-of-context events;
    the model identifies these order anomalies and outputs the top candidate expected events to aid analyst
    triage. In a Credential Access hunt, this catches forgery and Pass-the-Ticket activity that individual-event
    rules miss because each event looks valid in isolation but the sequence does not. References: [DeepLog,
    Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Zeek kerberos.log
  - 'NAI: Domain Controllers, Critical Member Servers (e.g., file servers, database servers), User Workstations,
    Active Directory infrastructure'
  range: Last 90 days (train on normal per-host sequences)
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = per_host_event_keys([4768,4769,4624])\nmodel = LSTM_logkey().fit(normal_sequences)\n\
      for window in seq:\n    pred = model.predict_next(window)\n    if observed not in pred.topk:\n \
      \       alert(host, window, expected=pred.topk)"
- question: Are there Sysmon Event ID 10 events where TargetImage is lsass.exe, SourceImage is not on
    an EDR/svchost allowlist, GrantedAccess includes read masks (e.g., 0x1038, 0x1438, 0x143a, 0x1410,
    0x1010), and CallTrace contains dbghelp.dll/dbgcore.dll/ntdll.dll?
  context: 'Stealing Kerberos tickets for Pass-the-Ticket requires reading Kerberos material from LSASS
    memory, making LSASS access the host-side precursor to ticket theft. This rule alerts when a non-allowlisted
    process opens a handle to lsass.exe with read-style access masks and a call trace through the debugging
    DLLs commonly used by dumpers. Tightly maintain the allowlist of legitimate EDR/svchost accessors
    to control false positives. A positive result on a Domain Controller or Privileged Access Workstation
    is especially serious. In Credential Access, this is a leading indicator that an adversary is extracting
    tickets or credentials; pivot to the source process''s creation event and any subsequent Pass-the-Ticket
    logons. References: [SigmaHQ Potential Credential Dumping Via LSASS](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_access/proc_access_win_lsass_memdump.yml).'
  answer_sources:
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows Endpoints, especially Domain Controllers, Privileged Access Workstations, and critical
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=Sysmon EventCode=10 TargetImage="C:\\Windows\\System32\\lsass.exe"

      | where NOT SourceImage IN (edr_svchost_allowlist)

