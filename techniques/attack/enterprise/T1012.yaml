- question: '[Statistical Method] Score registry access sensitivity: For T1012 (Query Registry) under
    the Discovery tactic, can you determine whether — a process directly accesses or queries registry
    keys containing sensitive information, such as cached credentials, security software configurations,
    or remote access tool settings. — using the following approach: score registry access sensitivity?'
  context: 'Evidence sought: A process directly accesses or queries registry keys containing sensitive
    information, such as cached credentials, security software configurations, or remote access tool settings.
    This is relevant to the Discovery (TA0007) tactic because adversaries query the Registry to learn
    about the system, installed software, security tooling, and stored credentials before deciding how
    to act. Detection method (Statistical Method): Assign per-key/per-hive sensitivity weights and, per
    process over a 5-minute window, sum weights of accessed keys (Volume). Baseline the cumulative score
    per host role and alert above mean + 3 standard deviations, per the standard-deviation method of [Dwyer
    & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf). Use IDF path-rarity
    weighting so reads of rarely-touched sensitive keys dominate the score, as in [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).
    A positive result indicates a process is performing registry-based discovery consistent with T1012;
    corroborate with the parent process, user context, host role, and any following actions before escalating.
    A negative result reduces but does not eliminate suspicion — combine with the other questions in this
    playbook and tune thresholds against your environment''s benign baseline to control false positives.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 13
  - Windows Event ID 4656
  - Windows Event ID 4663
  - 'NAI: All Windows endpoints and servers, Authentication servers (e.g., Domain Controllers), Servers
    hosting sensitive applications'
  range: Last 90 days (build baselines over 30+ days; evaluate per 5-minute window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'registry_access by process, 5min window

      | eval w=sensitivity_weight(key) * idf_path_rarity(key)

      | stats sum(w) AS score by host, process, window

      | join host_role | eventstats mean(score) stdev(score) by host_role

      | where score > mean + 3*stdev

      | table _time host process score contributing_keys'
