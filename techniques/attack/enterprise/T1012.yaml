name: 'T1012: Query Registry'
id: b6b509e2-62c0-4a57-955d-1f5d8f2670b5
description: 'This playbook helps an analyst investigate adversary use of the Windows Registry for environmental
  discovery (MITRE ATT&CK T1012, Query Registry). Adversaries query the Registry to enumerate system configuration,
  installed software, security/AV settings, and stored credentials (e.g. cached secrets, PuTTY sessions,
  RDP/VNC and credential-manager keys) to shape follow-on actions. It guides hunting across several behaviors:
  command lines matching known registry-enumeration signatures; direct reads of high-value/sensitive registry
  keys (including access-denied probing); bursts of distinct registry queries indicative of automated
  reconnaissance; registry utilities (reg.exe, regedit.exe, PowerShell registry cmdlets) spawned by non-administrative
  parents such as office apps, browsers, or script hosts; and registry reads of network/credential keys
  that are quickly followed by suspicious outbound network connections suggesting C2 or exfiltration.
  Each line of inquiry pairs a deterministic symbolic-logic floor with statistical baselining and machine-learning
  approaches so detection is granular, explainable, and defensible across endpoint (Windows Event IDs,
  Sysmon, PowerShell) and network (Zeek) telemetry.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
