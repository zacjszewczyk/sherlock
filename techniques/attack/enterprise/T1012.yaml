questions:
- question: '[Symbolic Logic] Match registry command signatures: For T1012 (Query Registry) under the
    Discovery tactic, can you determine whether — a command line execution includes arguments that are
    an exact or near-exact match to a known malicious signature for registry enumeration. — using the
    following approach: match registry command signatures?'
  context: 'Evidence sought: A command line execution includes arguments that are an exact or near-exact
    match to a known malicious signature for registry enumeration. This is relevant to the Discovery (TA0007)
    tactic because adversaries query the Registry to learn about the system, installed software, security
    tooling, and stored credentials before deciding how to act. Detection method (Symbolic Logic): Scan
    process creation (Windows Event ID 4688, Sysmon Event ID 1) and PowerShell ScriptBlock (4104) for
    command lines matching a curated watchlist of registry-enumeration signatures, e.g. `reg query HKLM
    /f password /t REG_SZ /s`, queries of `HKLM\SAM`/`HKLM\SECURITY\Policy\Secrets`, `HKCU\Software\PuTTY\Sessions`,
    installed-software/AV/run keys, and PowerShell `Get-ItemProperty`/`Get-ChildItem HKLM:`. Seed and
    validate the list from [Atomic Red Team T1012](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1012/T1012.md),
    [Sigma](https://github.com/SigmaHQ/sigma), and [LOLBAS Reg.exe](https://lolbas-project.github.io/lolbas/Binaries/Reg/);
    map paths from [MITRE T1012](https://attack.mitre.org/techniques/T1012/). Keep this deterministic
    floor regardless of ML. A positive result indicates a process is performing registry-based discovery
    consistent with T1012; corroborate with the parent process, user context, host role, and any following
    actions before escalating. A negative result reduces but does not eliminate suspicion — combine with
    the other questions in this playbook and tune thresholds against your environment''s benign baseline
    to control false positives.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - WinEventLog:PowerShell EventCode 4104
  - 'NAI: Critical servers (Domain Controllers, database servers), Executive workstations, Developer workstations'
  range: Last 90 days (correlate within the stated short window, e.g. 2-5 minutes, around each candidate
    event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (WinEventLog:Security EventCode=4688, WinEventLog:Sysmon EventCode=1, WinEventLog:PowerShell
      EventCode=4104)

      | eval cmd=lower(CommandLine)

      | where like(cmd,"%reg%query%") OR like(cmd,"%get-itemproperty%") OR like(cmd,"%get-childitem%hklm:%")

      | lookup registry_enum_watchlist signature AS cmd

      | where match(cmd, registry_enum_signature_regex)

      | table _time host user ParentImage Image CommandLine matched_signature'
- question: '[Statistical Method] Score reg query similarity: For T1012 (Query Registry) under the Discovery
    tactic, can you determine whether — a command line execution includes arguments that are an exact
    or near-exact match to a known malicious signature for registry enumeration. — using the following
    approach: score reg query similarity?'
  context: 'Evidence sought: A command line execution includes arguments that are an exact or near-exact
    match to a known malicious signature for registry enumeration. This is relevant to the Discovery (TA0007)
    tactic because adversaries query the Registry to learn about the system, installed software, security
    tooling, and stored credentials before deciding how to act. Detection method (Statistical Method):
    For any command line containing ''reg.exe query'' or PowerShell registry cmdlets, compute character
    n-gram (n=3) Jaccard overlap against the known-malicious corpus and flag overlap above the 95th percentile
    of benign administration scripts; report the top-3 matched n-grams/keywords in the alert for explainability,
    following the rarity-of-path principle in [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).
    A positive result indicates a process is performing registry-based discovery consistent with T1012;
    corroborate with the parent process, user context, host role, and any following actions before escalating.
    A negative result reduces but does not eliminate suspicion — combine with the other questions in this
    playbook and tune thresholds against your environment''s benign baseline to control false positives.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - WinEventLog:PowerShell EventCode 4104
  - 'NAI: Critical servers (Domain Controllers, database servers), Executive workstations, Developer workstations'
  range: Last 90 days (build baselines over 30+ days; evaluate per 5-minute window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'events where CommandLine matches "reg.exe query" OR PowerShell registry cmdlet

      | eval ngrams=char_ngrams(lower(CommandLine), 3)

      | eval score=jaccard(ngrams, malicious_corpus_ngrams)

      | where score > percentile95(benign_admin_score)

      | eval top_ngrams=top3_overlap(ngrams, malicious_corpus_ngrams)

      | table _time host process CommandLine score top_ngrams'
