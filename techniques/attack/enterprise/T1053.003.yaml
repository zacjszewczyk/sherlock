name: 'T1053.003: Cron'
id: 6468d5f1-bb8c-46fe-ae48-712297ce2456
description: Investigate adversary abuse of the Unix/Linux/macOS/ESXi cron scheduler (T1053.003) for initial
  and recurring code execution, persistent C2, and privilege escalation. This playbook helps an analyst
  hunt for cron-scheduled outbound beacons that exhibit machine-like periodicity (low inter-arrival variance,
  consistent byte sizes) to threat-intel or rare destinations; crontab files created or modified by interpreters,
  non-package-manager processes, or non-administrative/service users under /etc/cron*, /var/spool/cron*,
  /etc/crontab, and macOS /usr/lib/cron/tabs; cron-driven remote execution and lateral movement seen as
  periodic Type-3 logons from Linux/Unix subnets; long-lived multi-day persistent beacons and DNS-tunnel
  heartbeats; low-privilege service accounts running account/permission-modifying commands on a schedule;
  and cron-spawned root processes that set SUID bits, edit /etc/sudoers, /etc/passwd, or /etc/shadow,
  or execute payloads dropped to world-writable directories. It pairs deterministic symbolic-logic rules
  with statistical periodicity/rarity scoring and machine-learning/provenance-graph methods across endpoint
  (auditd, Sysmon for Linux, macos unifiedlog, Windows Event IDs), network (Zeek conn/dns/ssl), and ESXi
  sources.
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
- tactic_id: TA0003
  tactic_name: Persistence
