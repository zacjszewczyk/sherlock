questions:
- question: Are any Linux or macOS hosts making outbound connections on a fixed cadence to a destination
    IP, domain, or TLS fingerprint that matches a threat-intelligence feed, consistent with a cron-scheduled
    callback?
  context: 'For the Execution tactic, a freshly installed cron job will fire a callback on a deterministic
    schedule. Join Zeek conn.log id.resp_h against a threat-intel IP feed, dns.log query against a malicious-domain
    feed, and ssl.log ja3/ja3s against a malicious-hash feed and alert on any match. Critically, also
    profile the failure state: a host generating repeated NXDOMAIN responses or connection RST/S0 (no-reply)
    attempts to the same destination on a fixed cadence is a strong cron-beacon indicator even before
    any TI match, because dead or not-yet-active C2 infrastructure still receives the scheduled heartbeat.
    A positive result (TI match plus regular cadence) is a high-confidence execution indicator; a negative
    TI result with regular failed attempts still warrants periodicity scoring.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network egress points (Firewalls, Routers), DNS resolvers, and the Linux/Unix server fleet (specifically
    web, application, and database servers).'
  range: Last 90 days, scored over rolling 24-hour windows
  queries:
  - technology: Zeek/pseudocode
    query: alert when (conn.id_resp_h in ti_ip_feed) OR (dns.query in ti_domain_feed) OR (ssl.ja3 in ti_hash_feed
      OR ssl.ja3s in ti_hash_feed); ALSO flag src where count(dns.rcode=NXDOMAIN | conn.conn_state in
      ['S0','REJ']) to same dst on fixed interval; output src_ip, dst, match_feed, cadence
- question: Which source-destination pairs show machine-like beacon regularity when scored on inter-arrival
    coefficient of variation, byte-size consistency, and connection frequency?
  context: Cron callbacks are timer-driven, so their inter-arrival times are far more regular than human-driven
    traffic. For each source-destination IP pair in Zeek conn.log over a 24-hour window compute frequency
    (connections/minute), the standard deviation and coefficient of variation (CV) of inter-arrival times,
    and the dispersion (CV) of orig_bytes/resp_bytes. Flag pairs with inter-arrival sigma < 1s OR interval
    CV < 0.05 AND byte-size CV < 0.1, indicating machine periodicity. Derive per-environment thresholds
    from the 1st percentile of CV across benign internal beacons (NTP, telemetry, package mirrors) to
    avoid drowning in legitimate automation. Rank candidates with frequency-domain filtering (BAYWATCH)
    and CV/skew scoring (RITA-J). The alert must surface the top-3 features (interval CV, bytes CV, destination
    rarity) so an analyst can judge it quickly.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network egress points (Firewalls, Routers), DNS resolvers, and the Linux/Unix server fleet (specifically
    web, application, and database servers).'
  range: Last 90 days, scored over rolling 24-hour windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for pair(src,dst) in conn.log[24h]: freq=count/min; ia=inter_arrival_times; ia_cv=std(ia)/mean(ia);
      bytes_cv=std(orig_bytes+resp_bytes)/mean(...); flag if (std(ia)<1s OR ia_cv<0.05) AND bytes_cv<0.1;
      threshold=p1(benign_beacon_cv); output top3=[ia_cv,bytes_cv,dst_rarity]'
- question: Does spectral or sequence-model analysis confirm a stable periodic cadence (e.g., spikes at
    60/300/3600s) in the per-minute connection counts to a candidate destination?
  context: After statistical screening, confirm the schedule mathematically. Apply a discrete Fourier
    transform / autocorrelation (ACF) to the per-minute connection count for each source-destination pair;
    significant repeating spikes at fixed lags (60s, 300s, 3600s) confirm a cron schedule. For jittered
    beacons that defeat pure spectral methods, use an LSTM/transformer time-series detector. Always keep
    the deterministic CV/FFT rule running in parallel so detections stay explainable, and emit the dominant
    period, spectral power, and destination reputation as the explanation. A confirmed stable period strongly
    implicates cron-based scheduled execution rather than ad-hoc human traffic.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network egress points (Firewalls, Routers), DNS resolvers, and the Linux/Unix server fleet (specifically
    web, application, and database servers).'
  range: Last 90 days, scored over rolling 24-hour windows
  queries:
  - technology: ML/Notebook pseudocode
    query: 'series=per_minute_conn_count(src,dst); peaks=FFT_or_ACF(series); confirm if power@lag in {60,300,3600}s
      > sig_threshold; if jittered: lstm_score=seq_model(series); run alongside CV/FFT rule; output dominant_period,
      spectral_power, dst_reputation'
- question: Is a remote-execution process (psexec, wmic, powershell with remote args, or a service spawned
    by services.exe) correlated to a Type-3 network logon originating from a Linux/Unix subnet that is
    not on the administrative allowlist?
  context: 'A cron job on a Linux host can drive remote execution into the Windows estate. Search Windows
    Event ID 4688 for psexec.exe, wmic.exe, powershell.exe (with remote args), or services spawned by
    services.exe, and correlate the LogonId to a 4624 logon with LogonType 3. Alert when the source IpAddress
    belongs to a Linux/Unix subnet and is not on an approved administrative-systems allowlist. Profile
    the failure state by correlating Event ID 4625 (failed logons) from the same Linux source: a fixed-cadence
    mix of failed-then-successful logons indicates an automated (cron) credentialed pivot. A positive
    result is a high-priority lateral-execution lead linking a scheduled Linux task to Windows code execution.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Zeek conn.log
  - auditd:SYSCALL execve
  - 'NAI: Critical Windows Servers (Domain Controllers, File Servers), Linux/Unix management servers,
    Authentication logs.'
  range: Last 90 days, correlate 4688/4624/4625 within the same logon session
  queries:
  - technology: SIEM/Rule pseudocode
    query: e4688=proc_create where image in ['psexec.exe','wmic.exe','powershell.exe'(remote)] OR parent='services.exe';
      join e4688.LogonId == e4624.LogonId where e4624.LogonType=3; alert if e4624.IpAddress in linux_subnets
      AND not in admin_allowlist; corr e4625 from same src for failed-then-success cadence
- question: How regular are the logon inter-arrival times and how rare is the source-to-target authentication
    path for these Linux-sourced remote executions?
  context: Scheduled automation produces tightly clustered timing and often novel access paths. For correlated
    logons grouped by source IP and target user, compute the inter-arrival standard deviation and CV;
    flag groups with sigma < 5s or CV < 0.1 as scheduled automation. Compare logon frequency (logons/hour)
    against the 99th percentile for that user/source, and treat a first-ever source->target edge as high-risk
    using rarity scoring (Hopper). Report interval CV, edge rarity, and the failed/success ratio in the
    alert so an analyst can distinguish a benign batch job from a cron-driven pivot using stolen or service
    credentials.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Zeek conn.log
  - auditd:SYSCALL execve
  - 'NAI: Critical Windows Servers (Domain Controllers, File Servers), Linux/Unix management servers,
    Authentication logs.'
  range: Last 90 days, correlate 4688/4624/4625 within the same logon session
  queries:
  - technology: SIEM/Stats pseudocode
    query: group logons by (src_ip,target_user); ia_cv=std(inter_arrival)/mean; flag if std<5s OR ia_cv<0.1;
      freq_anom = freq > p99(user_src); edge_rarity = first_seen(src->target); output ia_cv, edge_rarity,
      fail_success_ratio
- question: Do logon timestamps cluster into a recurring minute-of-hour pattern across multiple days,
    indicating scheduled remote access from a Linux host?
  context: Clustering exposes hidden schedules that single-event rules miss. Run DBSCAN on (day_of_year,
    time_of_day) for each source-IP/user pair; a dense cluster recurring at the same minute-of-hour across
    multiple days is flagged as periodic scheduled activity. Complement this with provenance/graph anomaly
    scoring of the source->target authentication graph (KAIROS), surfacing the recurring minute, cluster
    density, and path rarity as the explanation. A tight recurring cluster combined with a rare authentication
    edge is strong evidence of cron-driven, automated lateral execution rather than interactive administration.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Zeek conn.log
  - auditd:SYSCALL execve
  - 'NAI: Critical Windows Servers (Domain Controllers, File Servers), Linux/Unix management servers,
    Authentication logs.'
  range: Last 90 days, correlate 4688/4624/4625 within the same logon session
  queries:
  - technology: ML/Notebook pseudocode
    query: X=[(day_of_year,time_of_day) for logons per (src_ip,user)]; clusters=DBSCAN(X); flag dense
      cluster at same minute-of-hour across >=3 days; graph_anomaly=KAIROS(auth_graph src->target); output
      recurring_minute, cluster_density, path_rarity
- question: Was any crontab file under /etc/cron*, /var/spool/cron*, /etc/crontab, or macOS /usr/lib/cron/tabs
    created or modified by an interpreter or a non-administrative/service user, or via the crontab utility?
  context: Direct creation or editing of cron files is the core artifact of this technique. Alert on any
    auditd write or Sysmon-for-Linux Event ID 11 FileCreate for paths matching /etc/cron*, /var/spool/cron*,
    /etc/crontab, or macOS /usr/lib/cron/tabs/*, OR invocation of the crontab utility. Prioritize when
    the writing process image is bash, sh, python, perl, wget, or curl, or when the actor is a non-administrative/service
    user. Suppress known package managers (apt, dpkg, yum, dnf) and config-management agents (puppet,
    ansible, salt) via allowlist to control false positives. A write to a cron path by an interpreter
    or web/service account is a direct execution/persistence indicator and should be triaged immediately.
  answer_sources:
  - auditd:SYSCALL (write, execve)
  - Sysmon for Linux Event ID 11 (FileCreate)
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - macos:unifiedlog
  - Zeek conn.log
  - 'NAI: Linux/Unix server fleet, especially hosts with externally facing services or administrative
    roles.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: alert on (auditd write OR sysmon_linux EID11 FileCreate) where path matches ['/etc/cron*','/var/spool/cron*','/etc/crontab','/usr/lib/cron/tabs/*']
      OR exe='crontab'; prioritize if writer.image in [bash,sh,python,perl,wget,curl] OR user in service_accounts;
      suppress if writer in [apt,dpkg,yum,dnf,puppet,ansible,salt]
- question: Is the process or user that modified a crontab file outside the established benign baseline,
    and did the edit lead to follow-on process execution or outbound network volume within minutes?
  context: Context turns a noisy file-write into a defensible detection. Build a 30-day baseline of which
    users/processes modify crontab files and the per-host rate of such modifications. Flag any writer
    outside the baseline, then correlate the edit to subsequent process execution (Sysmon EID 1 / auditd
    execve) or outbound connections (Zeek conn.log) within a 5-minute window. Score the follow-on by volume
    (bytes sent to a low-reputation destination) and frequency (new connection count/min); flag deviations
    beyond 3 sigma of the host baseline. Report the writer identity, the new command line, and the destination
    reputation. An out-of-baseline writer whose edit is immediately followed by execution or beaconing
    is a high-confidence cron-abuse chain.
  answer_sources:
  - auditd:SYSCALL (write, execve)
  - Sysmon for Linux Event ID 11 (FileCreate)
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - macos:unifiedlog
  - Zeek conn.log
  - 'NAI: Linux/Unix server fleet, especially hosts with externally facing services or administrative
    roles.'
  range: Last 90 days, with a 5-minute edit-to-execution correlation window
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline=writers_of_crontab[30d]; flag writer not in baseline; corr edit -> (exec EID1/execve
      OR conn.log) within 5m; score follow_on by bytes_to_lowrep, new_conn_per_min; flag if > mean+3sigma
      host_baseline; output writer, new_cmdline, dst_reputation
- question: Does a classifier judge the command line written into the crontab as malicious based on encoding,
    pipe-to-shell, embedded IPs, reverse-shell syntax, or world-writable paths?
  context: The content of the cron entry often betrays intent. Train a classifier on crontab command-line
    strings using features such as base64/hex encoding presence, curl|wget piped to sh, embedded IPs,
    reverse-shell syntax, and /tmp or /dev/shm paths. Pair it with provenance-graph node-level anomaly
    detection (ThreaTrace) that roots the cron edit and its resulting process subtree. Maintain the deterministic
    Sigma/Elastic rules in parallel so detections remain explainable, and emit the top-3 contributing
    features (e.g., encoded-payload flag, pipe-to-shell flag, world-writable path) in the alert. A high
    malicious-probability command line written into cron is strong evidence of scheduled malicious execution.
  answer_sources:
  - auditd:SYSCALL (write, execve)
  - Sysmon for Linux Event ID 11 (FileCreate)
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - macos:unifiedlog
  - Zeek conn.log
  - 'NAI: Linux/Unix server fleet, especially hosts with externally facing services or administrative
    roles.'
  range: Last 90 days
  queries:
  - technology: ML/Notebook pseudocode
    query: features=[has_base64,has_hex,pipe_to_sh,embedded_ip,revshell_syntax,tmp_or_shm_path]; p=clf.predict_proba(cmdline);
      graph=ThreaTrace(node=cron_edit, subtree=resulting_procs); run alongside sigma/elastic; output top3_features,
      malicious_prob
- question: Over a 30-day lookback, does any host show C2 indicators (TI-matched IP/domain/cert) that
    recur with regular periodicity on two or more separate days, consistent with a cron-installed implant
    maintaining persistence?
  context: 'For the Persistence tactic the defining trait is longevity: a cron-installed implant calls
    home day after day. Over a 30-day lookback, correlate destination IPs (conn.log), domains (dns.log),
    and server certs/JA3 (ssl.log) against threat-intel feeds and alert on any match recurring on >=2
    separate days with regular periodicity. Also profile the failure state: a persistent cron beacon often
    produces a steady stream of NXDOMAIN or S0/RST connections to dead infrastructure on a fixed cadence,
    so flag those even without a TI hit. Multi-day recurrence is what separates a persistent foothold
    from a one-off execution event, making this a high-value persistence indicator.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network egress points, DNS resolvers, Certificate Transparency logs, Linux/Unix server fleet.'
  range: Last 30 days minimum (extend to 90 for confirmation)
  queries:
  - technology: Zeek/pseudocode
    query: 'over 30d: match conn.id_resp_h/dns.query/ssl.ja3 to ti_feeds; alert if match recurs on >=2
      distinct days with regular period; ALSO flag steady NXDOMAIN/S0/REJ to same dst on fixed cadence
      sans TI; output dst, days_seen, period'
- question: Does a destination show consistently low day-to-day connection-frequency variance over a sliding
    7-day window, and do its subdomains exhibit high Shannon entropy suggestive of DGA used with scheduled
    callbacks?
  context: Persistence schedules are stable across days, and DGA-backed C2 leaves a statistical fingerprint.
    For each source-destination pair compute the daily connection frequency over a 7-day sliding window;
    consistently low variance (CV < 0.1 across days) indicates a persistent schedule. Separately compute
    the Shannon entropy of subdomain labels per parent domain (entropy > 3.5 suggests DGA used with scheduled
    callbacks). Derive thresholds from benign periodic-traffic distributions and rank with CV/skew scoring
    (RITA-J). Surface daily-frequency CV, subdomain entropy, and destination age. A stable multi-day cadence
    to a young, high-entropy domain is a strong persistent-C2 signal.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network egress points, DNS resolvers, Certificate Transparency logs, Linux/Unix server fleet.'
  range: Last 90 days, 7-day sliding-window scoring
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for pair(src,dst): daily_freq=conn_count/day[7d sliding]; daily_cv=std(daily_freq)/mean; flag
      if daily_cv<0.1; sub_entropy=shannon(subdomain_labels); flag if sub_entropy>3.5; output daily_cv,
      sub_entropy, dst_age'
- question: Does a supervised classifier flag long-lived beaconing on conn.log features, with FFT/autocorrelation
    confirming the periodic signal persists for 7 or more days?
  context: Combining a learned beacon profile with period-stability confirmation reduces false positives
    on persistent C2. Train a classifier (e.g., Random Forest) on conn.log features (duration, orig_bytes,
    resp_bytes, inter-arrival mean/stdev) to identify C2 beaconing, then confirm with FFT/autocorrelation
    that the periodic signal persists over 7+ days; use LSTM/transformer models for jittered beacons.
    Keep deterministic periodicity rules in parallel and report the dominant period, persistence duration,
    and feature importances. A beacon classified as malicious whose period is stable for a week or more
    is highly indicative of a cron-maintained persistent implant.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network egress points, DNS resolvers, Certificate Transparency logs, Linux/Unix server fleet.'
  range: Last 90 days, requiring >=7-day period persistence
  queries:
  - technology: ML/Notebook pseudocode
    query: 'X=conn_features[duration,orig_bytes,resp_bytes,ia_mean,ia_std]; p=rf.predict(X); confirm period_stable_7d
      via FFT/ACF; if jittered: lstm_score; run alongside deterministic rules; output dominant_period,
      persistence_days, feature_importances'
- question: Is a web or service account (www-data, nginx, apache, tomcat) executing account or permission-modifying
    commands or writing to /etc/passwd, /etc/shadow, or /etc/sudoers, especially with cron in its parent
    ancestry?
  context: Web/service accounts should never manage users or permissions; doing so on a schedule indicates
    a cron persistence mechanism planted via a compromised service. Alert when a process whose user is
    a web/service account (www-data, nginx, apache, tomcat) executes usermod, useradd, chmod, chown, passwd,
    or writes to /etc/passwd, /etc/shadow, or /etc/sudoers, especially when the parent ancestry includes
    cron/crond. Map fields to auditd execve/PATH records and reuse cron-spawned-shell Sigma rule sets.
    A positive result links an unprivileged service identity to privileged account changes on a schedule,
    a hallmark of cron-based persistence and creeping privilege consolidation.
  answer_sources:
  - auditd:SYSCALL execve
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - macos:unifiedlog
  - 'NAI: Linux/Unix web and application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: alert where proc.user in [www-data,nginx,apache,tomcat] AND (proc.exe in [usermod,useradd,chmod,chown,passwd]
      OR writes ['/etc/passwd','/etc/shadow','/etc/sudoers']) AND ancestry contains [cron,crond]; map
      auditd execve/PATH
- question: How regular are the inter-arrival times of these suspicious service-account executions, and
    does the host show any recurring rate of privileged-command execution where the baseline is normally
    zero?
  context: Regular timing converts a suspicious one-off into evidence of a scheduled task. For events
    from the symbolic rule, compute inter-arrival times over 30 days; sigma < 5s or CV < 0.1 across repeated
    events indicates a scheduled persistence task. Also baseline the per-host frequency of privileged-command
    executions by service accounts (normally ~0/day) and flag any nonzero recurring rate. Report interval
    CV, the command, and the parent process. Because the benign baseline for these actions is effectively
    zero, even a low but recurring rate with tight timing is a strong cron-persistence indicator.
  answer_sources:
  - auditd:SYSCALL execve
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - macos:unifiedlog
  - 'NAI: Linux/Unix web and application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ia=inter_arrival(symbolic_rule_events)[30d]; flag if std(ia)<5s OR cv(ia)<0.1; baseline_freq=priv_cmd_by_service_acct/day
      (~0); flag any recurring nonzero; output interval_cv, command, parent_proc
- question: Does anomaly scoring surface rare service-account executions (e.g., a web-server process spawning
    a shell or user-management tool outside update windows) corroborated by provenance and log-sequence
    anomalies?
  context: Anomaly detection catches novel persistence variants that signatures miss. Apply an Isolation
    Forest on process-execution events with features User, ParentImage, Image, CommandLine tokens, and
    time-of-day to surface rare events such as a web-server process spawning a shell or user-management
    tool outside update windows. Corroborate with provenance node-anomaly scoring (ThreaTrace) and sequence-anomaly
    detection of the surrounding log stream (DeepLog). Emit the top-3 anomalous features in the alert.
    A rare service-account execution that is also anomalous in provenance and log-sequence terms is a
    strong, defensible persistence lead.
  answer_sources:
  - auditd:SYSCALL execve
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - macos:unifiedlog
  - 'NAI: Linux/Unix web and application servers.'
  range: Last 90 days
  queries:
  - technology: ML/Notebook pseudocode
    query: X=proc_events[User,ParentImage,Image,cmd_tokens,time_of_day]; score=IsolationForest(X); corroborate
      ThreaTrace(node_anomaly)+DeepLog(seq_anomaly); output top3_anomalous_features
- question: Is a Linux host making repetitive TXT/CNAME DNS queries to a single parent domain with no
    corresponding outbound connection to the resolved IP, alongside an elevated NXDOMAIN rate, indicating
    a cron-scheduled DNS tunnel?
  context: 'DNS tunneling lets an implant persist while evading connection-based monitoring. For each
    uid in Zeek dns.log check for a corresponding conn.log uid within 1 minute; alert on hosts making
    repetitive TXT/CNAME queries to a single parent domain with no matching outbound connection. Explicitly
    track the failure state: a high NXDOMAIN rate or many distinct high-entropy subdomains to one zone
    on a fixed cadence is characteristic of tunneling/beaconing. A host that queries heavily but never
    connects to the answers, on a schedule, is a strong cron-driven DNS-tunnel persistence indicator.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internal DNS resolvers, network egress points, Linux/Unix server fleet.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'for uid in dns.log: if no conn.log[uid] within 1m AND repetitive TXT/CNAME to single parent_domain:
      alert; ALSO flag high NXDOMAIN rate OR many high-entropy subdomains to one zone on fixed cadence;
      output host, parent_domain, nxdomain_rate'
- question: Does a host's ratio of DNS query volume to outbound connection volume exceed the network-wide
    99th percentile, and is the inter-arrival entropy/CV of queries to one domain low enough to imply
    cron scheduling?
  context: Quantifying the DNS-to-connection imbalance and timing regularity exposes tunnels statistically.
    Compute the per-host ratio of DNS query volume to outbound TCP/UDP connection volume over 24h; a ratio
    exceeding the network-wide 99th percentile is anomalous. Compute the entropy/CV of inter-arrival times
    of queries to the same domain; low entropy/CV signals cron scheduling. Use benign periodic-traffic
    baselines and beacon ranking (BAYWATCH). Report the DNS:conn ratio, query interval CV, and subdomain
    entropy. A high DNS:conn ratio combined with low timing variance is strong evidence of a scheduled
    DNS-tunnel persistence channel.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internal DNS resolvers, network egress points, Linux/Unix server fleet.'
  range: Last 90 days, 24-hour ratio windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: ratio = dns_query_vol/outbound_conn_vol per host[24h]; flag if ratio > p99(network); ia_cv=cv(inter_arrival
      to same domain); flag if low; output dns_conn_ratio, query_interval_cv, subdomain_entropy
- question: Does protocol-mix clustering show a host shifting to a DNS-dominant profile relative to its
    role peers, with autocorrelation confirming a periodic DNS heartbeat?
  context: Role-relative clustering finds hosts whose behavior diverges from their function. Cluster hosts
    (e.g., K-Means) on protocol-mix features (% TCP/80, TCP/443, UDP/53); flag hosts shifting to a DNS-dominant
    cluster relative to role peers, then confirm a periodic heartbeat via autocorrelation of DNS query
    counts; use an LSTM detector for jittered cadence. Maintain the deterministic ratio/entropy rule in
    parallel and surface the protocol-mix shift, dominant period, and DNS:conn ratio. A web/app server
    that drifts into a DNS-dominant cluster and shows a periodic DNS heartbeat is a compelling cron-DNS-tunnel
    persistence lead.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
