questions:
- question: '[Discovery] Using the ''geolocation watchlist'' (Symbolic Logic) approach, can you determine
    whether an internal host makes a DNS query for, or an HTTP/S connection to, a known public IP geolocation
    service.'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary performs System Location
    Discovery (T1614) to calculate or infer the geographic location of a compromised host -- using time
    zone, locale, keyboard/language settings, IP-geolocation lookups, or cloud instance metadata -- so
    it can decide whether to fully infect the target and which follow-on actions to take (some malware
    deliberately avoids or targets specific regions). This evidence focuses on the condition that An internal
    host makes a DNS query for, or an HTTP/S connection to, a known public IP geolocation service. This
    Symbolic Logic approach works as follows: Maintain a watchlist of public IP-geolocation/what-is-my-ip
    domains and IPs (ipinfo.io, ip-api.com, ifconfig.me, ifconfig.co, whatismyip.com, ipify.org, ipapi.co,
    freegeoip.app) enumerated from [MITRE ATT&CK T1614](https://attack.mitre.org/techniques/T1614/). Alert
    on any DNS query (Zeek dns.log `query`) or HTTP/S connection (Zeek conn.log `id.resp_h`, http.log
    `host`, ssl.log SNI) to these destinations from any internal host. Raise severity when the initiating
    process (correlate Sysmon EID 3 / EDR) is a script host or non-browser binary. A positive result --
    a rule match, statistical outlier, or model alert -- indicates probable location-discovery activity;
    pivot to the responsible process and its parent lineage, the initiating user or service account, the
    host and its role, the destination (geolocation domain, low-reputation IP, or IMDS endpoint), and
    any tightly-coupled follow-on network connections to scope intent and whether discovery precedes C2
    or exfiltration. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss obfuscated, API-only, or
    low-and-slow discovery.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network Egress Points, Internal DNS Resolvers, Egress Proxy Servers'
  range: Last 90 days (correlate event-centered windows of +/- 5 minutes around the discovery event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# geolocation watchlist (Symbolic Logic)

      source IN [Zeek conn.log, Zeek http.log, Zeek dns.log, Zeek ssl.log]

      | approach: Maintain a watchlist of public IP-geolocation/what-is-my-ip domains and IPs (ipinfo.io,
      ip-api.com, ifconfig.me, ifconfig.co, whatismyip.com, ipify.org, ipapi.co, freegeoip.app) enumerated
      from [MITRE ATT&CK T1614](https://attack.mitre.org/techniques/T1614/). Alert on any DNS query (Zeek
      dns.log `query`) or HTTP/S connection (Zeek conn.log `id.resp_h`, http.log `host`, ssl.log SNI)
      to these destinations from any internal host. Raise severity when the initiating process (correlate
      Sysmon EID 3 / EDR) is a script host or non-browser binary.

      | correlate over NAI: Network Egress Points, Internal DNS Resolvers, Egress Proxy Servers

      | emit alert with contributing fields and entity context (process, parent, user/account, host, destination,
      top-3 features)'
  - technology: Zeek/pseudocode
    query: '# geolocation watchlist (Zeek view)

      watch conn.log/http.log/dns.log/ssl.log for location-discovery network indicators

      | filter dst in geolocation watchlist OR dst == 169.254.169.254 OR query/host matches geolocation/IMDS
      endpoints

      | join with process/command-line telemetry on host (id.orig_h) within +/- 5 minutes

      | emit candidate events with host, process, dest, uri/query, bytes, JA3'
- question: '[Discovery] Using the ''failure-mode signals'' (Symbolic Logic) approach, can you determine
    whether an internal host makes a DNS query for, or an HTTP/S connection to, a known public IP geolocation
    service.'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary performs System Location
    Discovery (T1614) to calculate or infer the geographic location of a compromised host -- using time
