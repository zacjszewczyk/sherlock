- question: '[Discovery] Using the ''explainable rare-API/anomalous-caller model'' (Machine Learning)
    approach, can you determine whether a process on a cloud instance initiates a network connection to
    the instance metadata service IP (169.254.169.254) and requests a location-specific endpoint (e.g.,
    ''/placement/availability-zone'', ''/location'').'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary performs System Location
    Discovery (T1614) to calculate or infer the geographic location of a compromised host -- using time
    zone, locale, keyboard/language settings, IP-geolocation lookups, or cloud instance metadata -- so
    it can decide whether to fully infect the target and which follow-on actions to take (some malware
    deliberately avoids or targets specific regions). This evidence focuses on the condition that A process
    on a cloud instance initiates a network connection to the instance metadata service IP (169.254.169.254)
    and requests a location-specific endpoint (e.g., ''/placement/availability-zone'', ''/location'').
    This Machine Learning approach works as follows: Train an unsupervised rare-function/population model
    over CloudTrail and IMDS access to flag anomalous metadata/region API usage by user, geography, and
    command pair ([Elastic CloudTrail ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning));
    features include full URI path, user-agent, parent process, command line, and time-since-boot. Requests
    from a shell or recently-downloaded binary against placement/region endpoints are high severity ([Wiz
    IMDS](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day)). The alert MUST list the top-3 contributing
    features. A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    location-discovery activity; pivot to the responsible process and its parent lineage, the initiating
    user or service account, the host and its role, the destination (geolocation domain, low-reputation
    IP, or IMDS endpoint), and any tightly-coupled follow-on network connections to scope intent and whether
    discovery precedes C2 or exfiltration. A negative result helps rule out this particular vector but
    should be corroborated with the other questions in this playbook, since a single method can miss obfuscated,
    API-only, or low-and-slow discovery.'
