    host makes a DNS query for, or an HTTP/S connection to, a known public IP geolocation service. This
    Symbolic Logic approach works as follows: Profile the response/error state of geolocation lookups
    as a distinct signal ([Splunk AWS IAM AccessDenied Discovery](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/)
    pattern applied to web egress): alert when a single host generates >=5 DNS NXDOMAIN/SERVFAIL or proxy-blocked
    (HTTP 403/407) results to geolocation-category domains within 10 minutes, indicating scripted fallback
    across multiple lookup providers. A positive result -- a rule match, statistical outlier, or model
    alert -- indicates probable location-discovery activity; pivot to the responsible process and its
    parent lineage, the initiating user or service account, the host and its role, the destination (geolocation
    domain, low-reputation IP, or IMDS endpoint), and any tightly-coupled follow-on network connections
    to scope intent and whether discovery precedes C2 or exfiltration. A negative result helps rule out
    this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss obfuscated, API-only, or low-and-slow discovery.'
