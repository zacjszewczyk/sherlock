name: 'T1614: System Location Discovery'
id: 206362ba-daee-422e-8cef-3946e632fbd8
description: 'This playbook helps an analyst investigate whether an adversary is attempting to calculate
  or infer the geographic location of a compromised host as part of automated discovery, in order to shape
  follow-on behaviors such as whether to fully infect the target or pursue specific objectives (MITRE
  ATT&CK T1614, System Location Discovery, under the Discovery tactic TA0007). It covers the common location-inference
  techniques observed in the wild: querying system locale, time zone, and keyboard/language settings via
  command-line utilities or Windows API calls (GetLocaleInfoW, GetTimeZoneInformation, Get-Culture, Get-WinSystemLocale,
  Get-TimeZone, tzutil /g, systeminfo); the Linux/macOS equivalents (locale, timedatectl, cat /etc/timezone,
  /etc/localtime, defaults read -g AppleLocale, systemsetup -gettimezone); contacting public IP-geolocation
  / what-is-my-ip web services (ipinfo.io, ip-api.com, ifconfig.me, whatismyip.com, ipify.org, etc.);
  and querying cloud instance metadata services (169.254.169.254 for AWS placement/availability-zone and
  region, Azure instance/compute/location). The hunt spans Windows, Linux, macOS, and IaaS/cloud telemetry
  and pursues the behavior from several complementary angles: deterministic symbolic-logic watchlists
  and command-line rules, process-lineage and specification-based invariants (service/system accounts
  that should never run discovery commands), statistical baselining (per-host and peer-group frequency/volume,
  Z-score bursts, obfuscation entropy/KL-divergence, post-discovery new-destination rates, IMDS path variety,
  AccessDenied/failure-state spikes), and explainable machine learning (browser-vs-script classifiers,
  sequence/log-key anomaly models such as DeepLog/LSTM, syscall self-profiles, outlier clustering, discovery-to-C2
  cross-correlation, and rare-API population models). Alerts are designed to surface the top contributing
  features so an analyst can quickly corroborate a suspected location-discovery event against process
  lineage, the responsible user/account, the destination, and any tightly-coupled follow-on network activity.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
