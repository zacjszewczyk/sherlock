    deliberately avoids or targets specific regions). This evidence focuses on the condition that An internal
    host makes a DNS query for, or an HTTP/S connection to, a known public IP geolocation service. This
    Statistical Method approach works as follows: For each host compute a 30-day rolling baseline of (a)
    hourly connection count and (b) bytes_out/bytes_in volume to geolocation-category domains, plus a
    peer-group baseline by subnet/department ([Microsoft Sentinel UEBA peer-group anomaly](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)).
    Flag a host whose hourly count exceeds its own or its peer 99th percentile, or whose small (<2 KB)
    repeated JSON-sized responses recur at a fixed cadence. Score domain naming with KL-divergence vs
    a natural-language baseline rather than raw entropy to catch DGA-style fallback hosts ([Red Canary
    entropy](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/)). A positive result
