name: 'T1114.003: Email Forwarding Rule'
id: b1702e1a-9fce-4fef-ab5f-b880a6fecc5f
description: Investigate adversary abuse of email forwarding rules to collect and exfiltrate sensitive
  mail across cloud and endpoint mail platforms. This playbook helps an analyst confirm unauthorized auto-forwarding
  by fusing cloud mail telemetry (Microsoft 365 Unified Audit Log, Message Trace, Exchange Transport Logs
  and the X-MS-Exchange-Organization-AutoForwarded header), endpoint command and process telemetry (Windows
  Event IDs 4688/4104, Sysmon Event IDs 11/13), and network mail evidence (Zeek smtp.log/dns.log). It
  surfaces creation or modification of inbox and transport rules with external ForwardTo/ForwardingSmtpAddress/RedirectTo/BlindCopyTo
  parameters (including MAPI-hidden and blank-named rules and high-impact org-wide transport rules), scripted
  forwarding via PowerShell cmdlets, local tampering with Outlook/Thunderbird/Apple Mail rule stores,
  and the resulting outbound forwarding to attacker-controlled or low-reputation destinations. Deterministic
  rules, statistical baselines (destination rarity, change-point and volume break-point tests, recipient-profile
  and peer-group deviation), and machine-learning models (forwarding-event classifiers, sequence models,
  forecasting, and UEBA) run in parallel so each method reinforces rather than replaces the others, tying
  every detection back to the Collection objective.
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: 'Do Exchange transport or message-trace headers (for example X-MS-Exchange-Organization-AutoForwarded:
    true or X-Forwarded-To) show mail being auto-forwarded to external domains that match threat intelligence
    or are not on the approved partner allow-list?'
  context: Under the Collection tactic, an adversary who has seized a mailbox commonly creates an inbox
    or transport rule that silently copies mail to infrastructure they control. The AutoForwarded header
    stamped on egress mail is the deterministic confirmation that a forwarding rule actually fired, so
    it is far stronger than merely observing that a rule exists. Alert when these forwarding headers point
    to TI-matched or non-allowlisted destination domains, and suppress only known-good (sender-domain,
    destination-domain) partner-routing combinations so legitimate business forwarding does not drown
    the signal. A positive result is high-confidence evidence of active data collection/egress; a negative
    result still leaves rule-creation paths to check.
  answer_sources:
  - Microsoft 365 Message Trace
  - Microsoft 365 Unified Audit Log
  - Exchange Transport Logs
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Mail Gateway Servers, Cloud Mail Service Tenant (e.g., Microsoft 365,
    Google Workspace)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  fwd = FILTER [m365_messagetrace, exch_transport] BY header.AutoForwarded == true OR\
      \ header.X_Forwarded_To EXISTS\n  ALERT WHERE fwd.dest_domain IN ti_domains\n        OR (fwd.dest_domain\
      \ EXTERNAL AND fwd.dest_domain NOT IN partner_allowlist)\n  SUPPRESS WHERE (fwd.sender_domain, fwd.dest_domain)\
      \ IN approved_partner_routing"
- question: Was an inbox or transport rule created or modified (New-InboxRule, Set-InboxRule, UpdateInboxRules,
    New-/Set-TransportRule) whose parameters set external forwarding/redirect/BCC, deletion, or a blank/hidden
    rule name?
  context: Under Collection, the rule artifact itself is the persistence-and-collection mechanism. Flag
    rule-creation/modification audit events whose parameters contain external ForwardTo, ForwardingSmtpAddress,
    ForwardAsAttachmentTo, RedirectTo, BlindCopyTo, or DeleteMessage to non-allowlisted recipients, and
    any rule created with a blank or hidden name (a known evasion). Organization-wide transport redirect/BCC
    rules are higher impact than single-mailbox rules and must be alerted separately. Because rules can
    be MAPI-hidden from Outlook/OWA/Get-InboxRule, corroborate against raw unified/mailbox audit events
    rather than client enumeration alone. A hidden or external-forwarding rule is strong evidence of attacker-controlled
    collection.
  answer_sources:
  - Microsoft 365 Message Trace
  - Microsoft 365 Unified Audit Log
  - Exchange Transport Logs
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Mail Gateway Servers, Cloud Mail Service Tenant (e.g., Microsoft 365,
    Google Workspace)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  rules = FILTER audit BY operation IN [New-InboxRule,Set-InboxRule,UpdateInboxRules,New-TransportRule,Set-TransportRule]\n\
      \  ALERT WHERE rules.params CONTAINS any([ForwardTo,ForwardingSmtpAddress,ForwardAsAttachmentTo,RedirectTo,BlindCopyTo,DeleteMessage])\n\
      \        AND rules.target EXTERNAL AND rules.target NOT IN allowlist\n        OR rules.name IN [\"\
      \", hidden]\n  ESCALATE WHEN rules.scope == org_wide_transport"
- question: Did a rule-creation or rule-modification event precede the first outbound auto-forwarded message
    from the same mailbox within roughly 15 minutes, especially for rules forwarding all mail or sensitive
    labels?
  context: Under Collection, tightly correlating the configuration change with the very first resulting
    egress confirms intent and impact in a single timeline. Join a rule create/modify event with the first
    AutoForwarded outbound message from the same mailbox inside a 15-minute window, prioritizing rules
    that forward all messages or messages bearing sensitive classification labels. Within the same window,
    hunt PowerShell mailbox sign-ins and anomalous Microsoft Graph permission grants, which frequently
    accompany takeover-driven forwarding. A matched create-then-forward sequence is a strong, time-bound
    indicator of active collection following account compromise.
  answer_sources:
  - Microsoft 365 Message Trace
  - Microsoft 365 Unified Audit Log
  - Exchange Transport Logs
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Mail Gateway Servers, Cloud Mail Service Tenant (e.g., Microsoft 365,
    Google Workspace)'
  range: Last 90 days, with a 15-minute rule-creation-to-first-forward correlation window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  rule = FILTER audit BY operation IN [New-InboxRule,Set-InboxRule,New-TransportRule]\n\
      \  fwd  = FILTER messagetrace BY header.AutoForwarded == true\n  ALERT WHERE JOIN rule WITH fwd\
      \ ON mailbox WHERE fwd.time - rule.time <= 15m\n  ENRICH powershell_signins, graph_permission_grants\
      \ WITHIN 15m"
- question: Is a newly observed external forwarding destination rare across the tenant - for example a
    new external domain used by more than two accounts within 24 hours, with concentration by ASN, recipients-per-domain,
    or business unit?
  context: Under Collection, adversary infrastructure tends to be newly registered and shared across the
    set of mailboxes they have compromised. Baseline forwarding-destination frequencies from message-trace/transport
    logs and flag new external domains used by more than two accounts within 24 hours, scoring each by
    domain newness, ASN concentration, recipients-per-domain, and business-unit concentration. Rank candidates
    with Directed Anomaly Scoring so only events more suspicious than every benign forward consume a fixed
    daily alert budget, keeping analyst load bounded. A high-ranked rare destination shared by several
    accounts is a strong campaign-level collection signal.
  answer_sources:
  - Microsoft 365 Message Trace
  - Microsoft 365 Unified Audit Log
  - Exchange Transport Logs
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Mail Gateway Servers, Cloud Mail Service Tenant (e.g., Microsoft 365,
    Google Workspace)'
  range: Last 90 days, with a 24-hour cross-account aggregation window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = baseline_freq(messagetrace.dest_domain, 90d)\n  cand = GROUP forwards BY dest_domain,\
      \ 24h => distinct_accounts, asn_conc, recips_per_domain, bu_conc\n  score = directed_anomaly_score(domain_newness,\
      \ asn_conc, recips_per_domain, bu_conc)\n  ALERT WHERE dest_domain NOT IN base AND distinct_accounts\
      \ > 2 ORDER BY score LIMIT daily_budget"
- question: Does a per-mailbox change-point test show forwarding transitioning from a baseline of zero/near-zero
    to sustained non-zero volume, and are rejected/blocked forwards or NDRs rising in parallel?
  context: Under Collection, most users never auto-forward externally, so the most informative signal
    is the moment forwarding behavior changes regime. Run a per-mailbox change-point detector (CUSUM or
    Bayesian online change-point detection) on hourly forwarded-message counts and alert when forwarding
    moves from baseline zero/near-zero to a sustained non-zero level. Track failure signals (rejected/blocked
    forwards and NDRs) as a distinct series, since a burst of blocked forwards can reveal an attacker
    probing routing before succeeding. A detected change-point is strong evidence that a new forwarding
    rule began exfiltrating mail.
  answer_sources:
  - Microsoft 365 Message Trace
  - Microsoft 365 Unified Audit Log
  - Exchange Transport Logs
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Mail Gateway Servers, Cloud Mail Service Tenant (e.g., Microsoft 365,
    Google Workspace)'
  range: Last 90 days, with hourly change-point evaluation per mailbox.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  series = GROUP forwards BY mailbox, hour => fwd_count\n  cp = changepoint(series.fwd_count)\
      \  # CUSUM or BOCPD\n  fail = GROUP forwards BY mailbox, hour => ndr_count, blocked_count\n  ALERT\
      \ WHERE cp.detected AND series transitions zero -> sustained_nonzero\n        OR fail rising distinctly"
- question: Does the forwarding rule's destination fall outside the mailbox owner's historical contact
    and recipient set, indicating a profile-violating recipient?
  context: Under Collection, a legitimate user typically forwards to people they already correspond with;
    takeover-driven forwarding sends mail to recipients the owner has never contacted. Compare the rule's
    destination(s) against the mailbox owner's historical contact/recipient set and score the deviation
    from that per-account profile. Profile-violating recipients are a hallmark of account-takeover-driven
    collection. A large deviation from the owner's established recipient profile is strong corroboration
    that the rule was set by an adversary rather than the legitimate user.
  answer_sources:
  - Microsoft 365 Message Trace
  - Microsoft 365 Unified Audit Log
  - Exchange Transport Logs
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Mail Gateway Servers, Cloud Mail Service Tenant (e.g., Microsoft 365,
    Google Workspace)'
  range: Last 90 days, against a per-account recipient profile.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  profile = build_recipient_profile(mailbox, 90d)\n  dev = deviation(rule.destinations,\
      \ profile)\n  ALERT WHERE dev > profile_violation_threshold OUTPUT mailbox, rule.destinations, dev"
- question: Does a supervised classifier score a forwarding event as malicious (confidence > 0.9) based
    on destination domain age, ASN, geolocation, account tenure, sender/recipient counts, destination
    newness, reputation, and recipient-profile anomaly?
  context: Under Collection, individual deterministic and statistical signals can each be weak, but combined
    they discriminate malicious forwarding well. Train a Random Forest on forwarding features (domain
    age, ASN, geolocation, account tenure, sender/recipient count, destination newness, reputation, recipient-profile
    anomaly) and flag forwarding events scoring above 0.9 confidence, emitting the top-3 contributing
    features so analysts can triage rather than chase a bare score. This broadens coverage to novel malicious
    forwarding that no single rule matches while keeping output explainable for the SOC.
  answer_sources:
  - Microsoft 365 Message Trace
  - Microsoft 365 Unified Audit Log
  - Exchange Transport Logs
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Mail Gateway Servers, Cloud Mail Service Tenant (e.g., Microsoft 365,
    Google Workspace)'
  range: Last 90 days, with scoring at forwarding-event ingestion.
  queries:
  - technology: ML pipeline pseudocode
    query: ">-\n  feats = extract(domain_age, asn, geo, account_tenure, sender_recipient_count, dest_newness,\
      \ reputation, recipient_profile_anomaly)\n  score = rf_forwarding_clf.predict_proba(feats)\n  explain\
      \ = top3_features(feats)\n  ALERT WHERE score > 0.9 OUTPUT explain"
- question: Does a sequence model detect a suspicious ordering of mailbox events such as credentialed
    login -> rule creation -> immediate external-forwarding spike?
  context: Under Collection, the attacker tradecraft is an ordered sequence, not an isolated event, and
    modeling the order catches what point-rules miss. Train an LSTM sequence model on mailbox admin and
    mail-flow audit events to detect suspicious orderings - for example a credentialed login followed
    by rule creation followed by an immediate external-forwarding spike. Update the model online from
    analyst feedback so it adapts to the environment. A high-scoring sequence indicates an end-to-end
    takeover-and-collect workflow and should be triaged as likely active exfiltration.
  answer_sources:
  - Microsoft 365 Message Trace
  - Microsoft 365 Unified Audit Log
  - Exchange Transport Logs
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Mail Gateway Servers, Cloud Mail Service Tenant (e.g., Microsoft 365,
    Google Workspace)'
  range: Last 90 days, with sequence scoring over each mailbox event stream.
  queries:
  - technology: ML pipeline pseudocode
    query: ">-\n  seq = build_event_sequence(mailbox_admin + mailflow_audit)\n  score = lstm_seq_model.predict(seq)\
      \  # login->rule_create->forward_spike\n  ALERT WHERE score > threshold; update_online(analyst_feedback)"
- question: Is external-forwarding rule creation a first-time or rare-for-peer-group operation for this
    account, correlated with an anomalous sign-in (unusual geo or device)?
  context: Under Collection, behavioral analytics that compare a user to their peers surface compromise
    even when each raw event looks individually plausible. Use UEBA to score external-forwarding rule
    creation as a first-time or rare-for-peer-group operation and correlate it with anomalous sign-in
    signals (unfamiliar geolocation or device). Surface the contributing anomaly factors - new country,
    new device, peer-group rarity - so triage is grounded rather than relying on an opaque score. The
    combination of a rare forwarding action and an anomalous sign-in is strong evidence of takeover-driven
    collection.
  answer_sources:
  - Microsoft 365 Message Trace
  - Microsoft 365 Unified Audit Log
  - Exchange Transport Logs
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Mail Gateway Servers, Cloud Mail Service Tenant (e.g., Microsoft 365,
    Google Workspace)'
  range: Last 90 days, with peer-group and sign-in baselines.
  queries:
  - technology: ML pipeline pseudocode
    query: ">-\n  ueba = score_event(op=external_forward_rule_create, peer_group, user_history)\n  signin\
      \ = anomalous_signin(user)  # geo/device\n  ALERT WHERE ueba.rare_or_firsttime AND signin.anomalous\
      \ OUTPUT contributing_factors"
- question: Did PowerShell (powershell.exe/pwsh.exe) execute Set-InboxRule, New-InboxRule, or New-TransportRule
    with forwarding flags (-ForwardTo, -ForwardingSmtpAddress, -ForwardAsAttachmentTo, -RedirectTo, -BlindCopyTo)
    targeting an external, non-allowlisted address?
  context: Under Collection, scripted creation of forwarding rules is a fast, scalable way for an adversary
    to weaponize many mailboxes. Inspect Windows Event ID 4104 (script blocks) and 4688 (process creation)
    for powershell.exe or pwsh.exe running these cmdlets with forwarding flags, and alert when the target
    address is external and not on the allow-list. Because client-hidden (MAPI) rules may not appear in
    Get-InboxRule, corroborate each hit with the corresponding unified/mailbox audit record so hidden
    rules are not missed. A scripted external-forwarding cmdlet is strong evidence of deliberate collection
    setup.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Exchange Servers (On-premise), Domain Controllers, Endpoint Devices, Cloud Mail Service Tenant
    (e.g., Microsoft 365, Google Workspace)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  ps = FILTER [Event4104, Event4688] BY image IN [powershell.exe, pwsh.exe]\n        AND\
      \ text CONTAINS any([Set-InboxRule, New-InboxRule, New-TransportRule])\n        AND text CONTAINS\
      \ any([-ForwardTo,-ForwardingSmtpAddress,-ForwardAsAttachmentTo,-RedirectTo,-BlindCopyTo])\n  ALERT\
      \ WHERE target_addr EXTERNAL AND target_addr NOT IN allowlist\n  CORROBORATE m365_mailbox_audit"
- question: Did the forwarding cmdlet run from a non-mail-admin account, follow recent failed logons,
    or pair with anomalous Graph API permission grants or PowerShell mailbox sign-ins?
  context: Under Collection, context determines whether a rule-creation cmdlet is routine administration
    or attacker activity. Raise severity when the cmdlet runs from an account that is not a mail administrator,
    when it follows recent failed logon attempts (suggesting credential guessing/spraying succeeded),
    or when it pairs with anomalous Microsoft Graph API permission grants or PowerShell-based mailbox
    sign-ins. These pairings, highlighted in CISA AA21-008A, mark the difference between an admin and
    an intruder. A privileged-context mismatch around a forwarding cmdlet is strong evidence of compromise-driven
    collection.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Exchange Servers (On-premise), Domain Controllers, Endpoint Devices, Cloud Mail Service Tenant
    (e.g., Microsoft 365, Google Workspace)'
  range: Last 90 days, correlating logon and Graph events around the cmdlet.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  cmd = FILTER [Event4104,Event4688] BY forwarding_cmdlet\n  ALERT WHERE actor NOT IN\
      \ mail_admins\n        OR recent_failed_logons(actor) WITHIN 1h\n        OR anomalous_graph_grant(actor)\
      \ OR powershell_mailbox_signin(actor)\n  RAISE_SEVERITY"
- question: Is the executing account using mail-management cmdlets at an entropy or frequency well outside
    its own baseline, or for the very first time?
  context: Under Collection, legitimate mail cmdlet usage is concentrated in a small set of admin accounts
    with stable patterns. Baseline command-line entropy and per-account frequency of legitimate mail-cmdlet
    usage, then alert when a non-privileged user runs these cmdlets or when command-line entropy exceeds
    2 standard deviations above baseline. Treat first-ever use of these cmdlets by an account as a separate
    first-seen signal. Anomalous entropy or first-time use by a non-admin is a strong indicator that forwarding
    rules are being created outside sanctioned administration.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Exchange Servers (On-premise), Domain Controllers, Endpoint Devices, Cloud Mail Service Tenant
    (e.g., Microsoft 365, Google Workspace)'
  range: Last 90 days, against per-account cmdlet baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = baseline(per_account mail_cmdlet freq, cmdline_entropy)\n  ALERT WHERE (actor\
      \ NOT IN privileged)\n        OR cmdline_entropy > base.mean + 2*base.stddev\n        OR first_seen(actor,\
      \ mail_cmdlet)"
- question: Does an unsupervised model flag a rare execution of a forwarding command based on user, role,
    tenure, parent process, time/day, and cmdlet flags - without needing labels?
  context: Under Collection, labeled malicious examples of forwarding-rule abuse are scarce, so unsupervised
    anomaly detection is valuable. Train an Isolation Forest on features (user, role, tenure, parent process,
    time/day, cmdlet/flags, destination newness) to flag rare executions of forwarding commands, reporting
    the top contributing features via per-tree path contributions for explainability. This catches anomalous
    scripted forwarding that signature rules miss - for example a forwarding cmdlet launched from an unusual
    parent at an odd hour by a low-tenure account. A high anomaly score warrants triage of the surrounding
    process and account context.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Exchange Servers (On-premise), Domain Controllers, Endpoint Devices, Cloud Mail Service Tenant
    (e.g., Microsoft 365, Google Workspace)'
  range: Last 90 days, with model scoring at execution time.
  queries:
  - technology: ML pipeline pseudocode
    query: ">-\n  feats = extract(user, role, tenure, parent_process, hour, dow, cmdlet_flags, dest_newness)\n\
      \  score = isolation_forest.decision_function(feats)\n  ALERT WHERE score IN rare_region OUTPUT\
      \ top_path_contributions(feats)"
- question: Did a New-InboxRule/Set-InboxRule/New-TransportRule event with an external forwarding/redirect
    address in the Microsoft 365 Unified Audit Log temporally match Message Trace or Exchange Transport
    Logs showing immediate forwarding (AutoForwarded) to that same address?
  context: Under Collection, fusing the configuration-change record with the resulting mail flow gives
    a definitive, low-false-positive detection. Detect rule-creation events carrying external forwarding/redirect
    addresses in the Unified Audit Log and correlate them with Message Trace/Exchange Transport Logs showing
    immediate forwarding (AutoForwarded header) to that address. Alert on the temporal match and separately
    on org-wide transport redirect/BCC rules, which affect every inbound message. A confirmed audit-to-mailflow
    match is high-confidence evidence that a forwarding rule is actively collecting and exfiltrating mail.
  answer_sources:
  - Microsoft 365 Unified Audit Log
  - Microsoft 365 Message Trace
  - Exchange Transport Logs
  - 'NAI: Cloud Mail Service Tenant (e.g., Microsoft 365, Google Workspace), Network Egress Points, Mail
    Gateway Servers'
  range: Last 90 days, with tight audit-to-mailflow temporal correlation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  rule = FILTER unified_audit BY op IN [New-InboxRule,Set-InboxRule,New-TransportRule]\
      \ AND ext_forward_addr EXISTS\n  flow = FILTER [messagetrace, exch_transport] BY header.AutoForwarded\
      \ == true\n  ALERT WHERE JOIN rule WITH flow ON addr WHERE temporal_match\n  ESCALATE WHEN rule.scope\
      \ == org_wide_transport_redirect_or_bcc"
- question: Does a user's forwarded-message volume exceed 3 standard deviations above their 30-day baseline,
    or does first-day forwarding surpass the 95th percentile, with rejected/blocked forwards and NDRs
    tracked in parallel?
  context: Under Collection, a sudden jump in forwarding volume from an account that normally forwards
    nothing is a classic exfiltration signature. Maintain each user's daily forwarding-volume baseline
    (30-day moving average and standard deviation) and flag counts exceeding 3 standard deviations above
    baseline, or first-day activity surpassing the 95th percentile. Maintain a parallel series for rejected/blocked
    forwards and NDRs as a failure-rate signal that can reveal misconfigured or probing forwarding. A
    statistically significant volume break is strong evidence that newly created rules are bulk-collecting
    mail.
  answer_sources:
  - Microsoft 365 Unified Audit Log
  - Microsoft 365 Message Trace
  - Exchange Transport Logs
  - 'NAI: Cloud Mail Service Tenant (e.g., Microsoft 365, Google Workspace), Network Egress Points, Mail
    Gateway Servers'
  range: Last 90 days, with a 30-day per-user moving baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = rolling_30d(per_user forward_count) => mean, stddev, p95\n  ALERT WHERE today.forward_count\
      \ > base.mean + 3*base.stddev\n        OR (first_day_activity AND today.forward_count > base.p95)\n\
      \  TRACK ndr_count, blocked_count AS failure_series"
- question: Does rule-creation or forwarding activity violate the account's learned behavioral profile
    (sign-in source/client, recipients, activity hours), and do similar anomalies cluster across multiple
    accounts?
  context: Under Collection, account-takeover forwarding usually breaks the owner's established behavior
    even if the absolute volume is modest. Build per-account profiles (sign-in source/client, typical
    recipients, normal activity hours) and flag rule-creation or forwarding that violates the learned
    profile as account-compromise evidence. Cluster similar anomalies across accounts (COMPA-style) to
    raise confidence that a coordinated campaign, not a single odd action, is underway. Profile violations
    that cluster across users strongly indicate a tenant-wide collection campaign.
  answer_sources:
  - Microsoft 365 Unified Audit Log
  - Microsoft 365 Message Trace
  - Exchange Transport Logs
  - 'NAI: Cloud Mail Service Tenant (e.g., Microsoft 365, Google Workspace), Network Egress Points, Mail
    Gateway Servers'
  range: Last 90 days, against per-account behavioral profiles.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  profile = build_profile(user: signin_source, client, recipients, activity_hours)\n \
      \ viol = FILTER events BY violates(profile)\n  clusters = cluster(viol ACROSS accounts)\n  ALERT\
      \ WHERE viol.exists ESCALATE WHEN cluster.size > 1"
- question: Does observed forwarding volume exceed the upper prediction interval of a time-series forecast
    (SARIMA/Prophet) of the user's expected next-day volume?
  context: Under Collection, forecasting models capture seasonality and trend so they can flag genuinely
    abnormal spikes that a flat threshold would miss or over-trigger on. Forecast each user's next-day
    forwarding volume with SARIMA or Prophet and alert when observed volume exceeds the upper prediction
    interval, while keeping the deterministic 3-stddev/95th-percentile rule as a floor beneath the model
    so coverage never drops below the simple baseline. An observation above the forecast band is evidence
    that forwarding has departed from the user's expected pattern, consistent with newly enabled exfiltration.
  answer_sources:
  - Microsoft 365 Unified Audit Log
  - Microsoft 365 Message Trace
  - Exchange Transport Logs
  - 'NAI: Cloud Mail Service Tenant (e.g., Microsoft 365, Google Workspace), Network Egress Points, Mail
    Gateway Servers'
  range: Last 90 days, with daily forecast-versus-observed comparison.
  queries:
  - technology: ML pipeline pseudocode
    query: ">-\n  fc = forecast(per_user forward_volume, model=SARIMA_or_Prophet)\n  ALERT WHERE observed\
      \ > fc.upper_prediction_interval\n        OR observed > base.mean + 3*base.stddev  // deterministic\
      \ floor"
- question: Is external-forwarding rule creation rare-for-peer-group or a first-time operation for this
    account, correlated with an anomalous sign-in, with contributing factors surfaced for triage?
  context: Under Collection, peer-group behavioral analytics flag forwarding setup that is unusual for
    users in the same role even when it is not volumetrically extreme. Score external-forwarding rule
    creation as a rare-for-peer-group or first-time operation, correlate it with anomalous sign-in signals,
    and surface the contributing factors (peer rarity, new geo/device, account tenure) so analysts can
    act on a reasoned result rather than an opaque score. A rare forwarding action combined with an anomalous
    sign-in is strong evidence of takeover-driven collection in the cloud tenant.
  answer_sources:
  - Microsoft 365 Unified Audit Log
  - Microsoft 365 Message Trace
  - Exchange Transport Logs
  - 'NAI: Cloud Mail Service Tenant (e.g., Microsoft 365, Google Workspace), Network Egress Points, Mail
    Gateway Servers'
  range: Last 90 days, with peer-group and sign-in baselines.
  queries:
  - technology: ML pipeline pseudocode
    query: ">-\n  ueba = score_event(op=external_forward_rule_create, peer_group, user_history)\n  signin\
      \ = anomalous_signin(user)\n  ALERT WHERE ueba.rare_or_firsttime AND signin.anomalous OUTPUT contributing_factors"
- question: Did a non-allowlisted process (not outlook.exe) write or modify Outlook .rwz/.srs rule files,
    Outlook rule registry keys, or Thunderbird/Apple Mail filter files (msgFilterRules.dat, RulesActiveState.plist)?
  context: Under Collection, local rule edits can install forwarding behavior that bypasses server-side
    enumeration, including hidden rules that never surface in Get-InboxRule. Using Sysmon Event ID 11
    (file create/write) and Event ID 13 (registry modification), alert when Outlook .rwz/.srs rule files,
    Outlook rule registry keys, or Thunderbird/Apple Mail filter files are written by processes not on
