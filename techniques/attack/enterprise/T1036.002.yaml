name: 'T1036.002: Masquerading: Right-to-Left Override'
id: 17961a95-a3c6-4203-ae70-69d59bf508ed
description: 'Investigate adversary abuse of the Unicode right-to-left override (RTLO/RLO) character U+202E
  and related bidirectional control characters to masquerade the true extension or ordering of file names,
  command lines, download artifacts, registry values, DNS queries, and email attachments. This playbook
  helps a SOC analyst hunt for the literal control character and its encodings present in logical strings
  regardless of how a viewer renders them, identify reversed executable extensions hidden behind benign-looking
  ones, surface extension/MIME mismatches in network transfers, and trace the downstream execution chain
  when a user is tricked into running a disguised payload (for example a document-handling process spawning
  an interpreter, or a browser/mail-client download quickly followed by execution of an RTLO-bearing process).
  It combines deterministic byte-level and Unicode-security (UTS #39 / UTR #36) checks, per-environment
  statistical baselining, and machine-learning classification of disguised or confusable names to answer
  whether an adversary is evading defenses through filename manipulation.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Does any filename, command line, registry value, email attachment name, download artifact,
    or DNS query contain the literal right-to-left override character (U+202E), one of its encodings,
    or any related bidirectional control or isolate character used for text spoofing?
  context: 'The RTLO character and its sibling Bidi controls (U+202A-U+202D) and isolates (U+2066-U+2069)
    remain physically present in the logical byte stream no matter how an application renders them, so
    a byte-level scan is a reliable, deterministic defense as prescribed by [UTR #36 Bidirectional Text
    Spoofing](https://www.unicode.org/reports/tr36/tr36-15.html) and the [Trojan Source: Invisible Vulnerabilities](https://www.usenix.org/system/files/usenixsecurity23-boucher.pdf)
    research. Search process (4688, Sysmon 1), file (Sysmon 11), registry (4657), email attachment, and
    network metadata for the raw code point and every common encoding: \u202e, the UTF-8 bytes E2 80 AE,
    the URL form %E2%80%AE, and the HTML entity &#8238;. Because these invisibles are near-absent in benign
    enterprise data, even a single confirmed match warrants investigation; escalate to high severity when
    the affected string also carries an executable extension, a reversed extension, or a masquerading
    download path. This directly addresses the Stealth question of whether an adversary is concealing
    a payload''s true file type to blend in with legitimate activity. Alert text must surface the matched
    code point(s), the rendered-vs-logical string, and the true extension.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek http.log
  - Zeek dns.log
  - Email Gateway Attachment Logs
  - 'NAI: User Workstations, Web Proxies, Mail Gateways, Active Directory Domain Controllers, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rtlo_patterns = [U+202E, \"\\u202e\", bytes(E2 80 AE), \"%E2%80%AE\", \"&#8238;\",\n     \
      \            U+202A..U+202D, U+2066..U+2069]\nevents = FROM [Event4688, Sysmon1, Sysmon11, Event4657,\
      \ EmailAttachLogs, Zeek_files, Zeek_http, Zeek_dns]\nfields = [command_line, image, target_filename,\
      \ registry_value, attachment_name, uri, query]\nhits = FILTER events WHERE ANY(field CONTAINS ANY\
      \ rtlo_patterns)\nseverity = HIGH IF hits.field MATCHES exe_extension OR reversed_extension OR masquerade_path\
      \ ELSE MEDIUM\nEMIT hits WITH matched_codepoint, rendered_string, logical_string, true_extension,\
      \ severity"
- question: 'Do any file names, command lines, or registry values contain Unicode code points flagged
    as Restricted by the UTS #39 identifier profile, fail Single-Script or Highly-Restrictive restriction
    levels, or produce a confusable skeleton that collides with a known-good executable name?'
  context: 'Beyond the single RTLO character, adversaries can hide payloads using a broader set of invisible
    or visually confusable code points. Apply the [UTS #39 Unicode Security Mechanisms](https://www.unicode.org/reports/tr39/)
    identifier profile entirely offline using the shipped data files (IdentifierStatus.txt and confusables.txt)
    so no external API lookup is required. Flag any string containing code points whose Identifier_Status
    is Restricted (Bidi controls and other invisibles), any string that fails the Single-Script or Highly-Restrictive
    restriction level, or any string whose computed skeleton() collides with a legitimate executable name
    from an allow-list. A positive result indicates a name engineered to deceive a human reviewer or matching
    logic, supporting the Stealth hypothesis that the actor is mimicking benign artifacts. Report the
    offending code point and the colliding legitimate name so the analyst can confirm the masquerade target.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek http.log
  - Zeek dns.log
  - Email Gateway Attachment Logs
  - 'NAI: User Workstations, Web Proxies, Mail Gateways, Active Directory Domain Controllers, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "LOAD IdentifierStatus.txt, confusables.txt   # offline UTS #39 data\ncandidates = FROM [Event4688,\
      \ Sysmon1, Sysmon11, Event4657] SELECT filename, command_line, registry_value\nFOR s IN candidates:\n\
      \  IF ANY codepoint(s) HAS Identifier_Status == Restricted: FLAG s reason=restricted_codepoint\n\
      \  IF restriction_level(s) NOT IN [Single-Script, Highly-Restrictive]: FLAG s reason=restriction_level\n\
      \  IF skeleton(s) IN skeletons(known_good_executables) AND s != matched_good: FLAG s reason=confusable_collision\n\
      EMIT flagged WITH offending_codepoint, colliding_legitimate_name"
- question: Compared with a per-channel, per-file-type baseline, are there RTLO-bearing artifacts whose
    filename length, extension ordering, character entropy, or Unicode-control-character frequency place
    them in the rarest fraction of benign enterprise activity?
  context: Because U+202E is essentially absent from benign file names, statistical rarity is a strong
    corroborating signal. Build per-channel and per-file-type baselines for filename length, extension
    ordering, character entropy measured against a natural-language distribution (per [Lyda & Hamrock
    entropy analysis](https://ieeexplore.ieee.org/document/4140989)), and the frequency of Unicode control
    characters over a 30-day window, then flag RTLO-bearing strings whose feature combination falls below
    the 1st percentile of benign prevalence. Derive the threshold empirically per environment so the alert
    adapts to local noise. Separately profile the rate of blocked or quarantined writes carrying the control
    character as a distinct failure-mode signal, since attackers often trigger AV/EDR before succeeding.
    A hit means the artifact is both anomalous and carries a spoofing primitive, strengthening the Stealth
    finding.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek http.log
  - Zeek dns.log
  - Email Gateway Attachment Logs
  - 'NAI: User Workstations, Web Proxies, Mail Gateways, Active Directory Domain Controllers, DNS Resolvers'
  range: Last 90 days, with a 30-day rolling baseline window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = FROM events LAST 30d GROUP BY channel, file_type\n          COMPUTE dist(filename_length),\
      \ dist(extension_order), dist(char_entropy), freq(unicode_controls)\ncandidates = FILTER events\
      \ WHERE filename CONTAINS rtlo_patterns\nFOR c IN candidates:\n  pct = percentile_rank(features(c),\
      \ baseline[c.channel, c.file_type])\n  IF pct < 1st_percentile: ALERT c WITH features, pct\nquarantine_series\
      \ = COUNT blocked/quarantined writes CONTAINING unicode_controls PER hour  # failure-mode signal"
- question: When a character-level machine-learning classifier scores file names, command lines, and attachment
    names, which artifacts are predicted to be RTLO/confusable-disguised with high probability, and what
    features drive that prediction?
  context: A supervised character-level classifier generalizes beyond fixed regexes by learning from n-grams,
    extension-order features, Unicode-control-character counts, and parent-process context, analogous
    to [URLNet](https://arxiv.org/abs/1802.03162) and the malicious-PowerShell command-line model of [Hendler
    et al.](https://cris.bgu.ac.il/en/publications/detecting-malicious-powershell-commands-using-deep-neural-network)
    To also catch homoglyph and confusable variants that are not literal RTLO, embed the rendered strings
    with a [Siamese CNN of Woodbridge et al.](https://arxiv.org/pdf/1805.09738) so visually similar but
    byte-different names are detected. Escalate high-probability events and emit the top-3 contributing
    features (for example, contains U+202E, reversed extension, rare parent) plus the nearest legitimate
    name for explainability. This supports the Stealth tactic by catching novel masquerading attempts
    that evade signature rules while keeping results interpretable enough for an analyst to action quickly.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek http.log
  - Zeek dns.log
  - Email Gateway Attachment Logs
  - 'NAI: User Workstations, Web Proxies, Mail Gateways, Active Directory Domain Controllers, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = char_ngrams(name) + extension_order + count(unicode_controls) + parent_process_context\n\
      p = char_classifier.predict_proba(features)\nembed = siamese_cnn(rendered_string)   # confusable/homoglyph\
      \ similarity\nscore = combine(p, nearest_legit_distance(embed))\nIF score > escalation_threshold:\n\
      \  ALERT name WITH top3_features(explain(features)), nearest_legitimate_name"
- question: Is there a filename containing the RTLO character immediately preceding a reversed, benign-looking
    extension while the true extension is executable (for example 'report_[U+202E]gepj.scr' rendering
    as 'report_rcs.jpeg'), and for network transfers does the MIME type confirm an executable?
  context: 'This is the classic file-name corollary of the Bidi spoofing primitive from [Trojan Source](https://www.usenix.org/system/files/usenixsecurity23-boucher.pdf)
    and [UTR #36](https://www.unicode.org/reports/tr36/tr36-15.html): the RTLO flips the visible extension
    so a screensaver, executable, or script appears to be a document or image. Build a regex that matches
    the RTLO character followed by a reversed executable extension fragment (such as ''exe.'', ''rcs.'',
    ''fdp.'', ''sj.'', ''tab.'', ''moc.'', ''knl.'') and search process command lines (4688), file events
    (Sysmon 11), and network transfer filenames (Zeek files.log). For network matches, correlate with
    the mime_type field to confirm ''application/x-dosexec'' or ''application/octet-stream'', raising
    a high-severity alert when both the reversed-extension pattern and the executable MIME are present.
    A positive result is strong evidence of intentional Stealth masquerading; include the rendered vs.
    true extension in the alert.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network Egress Points, User Workstations, Email Servers, File Shares'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rev_exe = /(\\u202E)(exe|rcs|fdp|sj|tab|moc|knl)\\./i\nproc = FROM [Event4688, Sysmon1] WHERE\
      \ command_line MATCHES rev_exe\nfiles = FROM Sysmon11 WHERE target_filename MATCHES rev_exe\nnet\
      \ = FROM Zeek_files WHERE filename MATCHES rev_exe\n       AND mime_type IN [\"application/x-dosexec\"\
      , \"application/octet-stream\"]\nALERT (proc OR files OR net) severity=HIGH WITH rendered_extension,\
      \ true_extension"
- question: For each common non-executable extension, has the hourly proportion of network transfers whose
    MIME type is actually an executable risen more than three standard deviations above its seven-day
    rolling baseline?
  context: Even without catching the RTLO character directly, a surge in extension/MIME mismatch is a
    Volume/State physics signal that masquerading is occurring at scale. Aggregate Zeek files.log hourly
    and, for each common non-executable extension (.docx, .pdf, .jpg, .png), compute the proportion of
    transfers where the MIME type is 'application/x-dosexec' or 'application/octet-stream'. Baseline this
    mismatch proportion over seven days and alert when an hourly proportion exceeds three standard deviations
    above the rolling average, deriving the exact multiplier per environment from observed variance. Separately
    track the failure-mode series of mismatched transfers that AV or the proxy blocked, since blocks indicate
    active attempts. A spike points the analyst toward a campaign delivering disguised executables, advancing
    the Stealth investigation.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network Egress Points, User Workstations, Email Servers, File Shares'
  range: Last 90 days, with a 7-day rolling baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "hourly = FROM Zeek_files BUCKET 1h GROUP BY extension\nmismatch_prop = COUNT(mime_type IN\
      \ [\"application/x-dosexec\",\"application/octet-stream\"]) / COUNT(*)\nFOR ext IN [.docx,.pdf,.jpg,.png]:\n\
      \  base = rolling_mean_std(mismatch_prop[ext], window=7d)\n  IF mismatch_prop[ext] > base.mean +\
      \ 3*base.std: ALERT ext WITH proportion, source_domains\nblocked_series = COUNT mismatched transfers\
      \ WHERE av_or_proxy_blocked PER hour"
- question: 'For each newly observed executable name, is its UTS #39 skeleton or visual/edit distance
    to the curated allow-list of legitimate binary names small but non-zero, indicating a likely homoglyph
    or RTLO spoof of a known-good name?'
  context: 'Adversaries frequently name their payloads to imitate trusted binaries. For each newly observed
    executable name, compute the [UTS #39 skeleton()](https://www.unicode.org/reports/tr39/) and the edit
    or visual distance to a curated allow-list of legitimate binary names (the baseline characterized
    by [Woodbridge et al.](https://arxiv.org/pdf/1805.09738)). When the distance is small but non-zero,
    the name is probably a deliberate near-collision — a homoglyph or RTLO-driven spoof of a known-good
    binary — whereas a zero distance is the legitimate binary and a large distance is unrelated. Report
    the matched legitimate name so the analyst can immediately see what the artifact is impersonating.
    This statistical confusability check complements the byte-level RTLO scan and reinforces the Stealth
    hypothesis by quantifying how closely an attacker tried to mimic a trusted name.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network Egress Points, User Workstations, Email Servers, File Shares'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "allow = curated_legitimate_binary_names\nFOR name IN new_executable_names:\n  sk = skeleton(name)\n\
      \  d = min(visual_or_edit_distance(sk, skeleton(g)) for g in allow)\n  match = argmin g\n  IF 0\
      \ < d <= small_threshold: ALERT name WITH colliding_legitimate_name=match, distance=d"
- question: Does a time-series anomaly model trained on the hourly count of extension/MIME-mismatched
    files flag an unexpected spike that would indicate a burst of masquerading activity?
  context: Mismatched extension-versus-MIME transfers (for example an .jpg that is actually 'application/x-dosexec')
    have daily and weekly seasonality in a normal enterprise. Train a seasonal time-series model such
    as SARIMA on at least 30 days of Zeek files.log hourly mismatch counts to learn that seasonality,
    then alert when an observation is flagged anomalous, signaling an unexpected spike in masquerading.
    Surface the contributing extension and source domains in the alert so the analyst can pivot to the
    responsible transfers. Unlike a static threshold, this approach tolerates predictable busy periods
    and focuses attention on genuine deviations, directly serving the Stealth question of whether defenses
    are being evaded through filename manipulation at scale.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network Egress Points, User Workstations, Email Servers, File Shares'
  range: Last 90 days, trained on >= 30 days of history.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = FROM Zeek_files BUCKET 1h COUNT WHERE extension_disagrees_with_mime

      model = SARIMA.fit(series, span>=30d, seasonality=[daily, weekly])

      forecast, ci = model.predict(next)

      IF observed > ci.upper: ALERT WITH contributing_extension, source_domains, observed, expected'
- question: Did a document viewer or office application (winword.exe, excel.exe, powerpnt.exe, outlook.exe,
    acrord32.exe, explorer.exe) spawn a command interpreter or LOLBin (powershell.exe, cmd.exe, wscript.exe,
    cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe), or otherwise exhibit unexpected parent-child
    lineage?
  context: After a user is tricked by an RTLO-disguised file into executing a payload, a very common post-exploitation
    step is for the document-handling process to spawn a scripting interpreter or living-off-the-land
    binary. Trigger an alert when a parent from the office/document-viewer list spawns a child from the
    interpreter/LOLBin list using Windows Event ID 4688 or Sysmon Event ID 1, mirroring the [Suspicious
    Microsoft Office Child Process (SigmaHQ)](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_office_susp_child_processes/)
    rule, and additionally flag unexpected lineage for sensitive system children using the [Unusual Parent-Child
    Relationship (Elastic)](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/)
    allow-list. A positive match is a high-value pivot because it links the masquerading delivery to actual
    code execution, helping confirm whether the Stealth attempt succeeded. Capture the full parent-child
    command lines so the analyst can scope follow-on activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint Workstations, Multi-user Terminal Servers, File Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "office = [winword.exe,excel.exe,powerpnt.exe,outlook.exe,acrord32.exe,explorer.exe]\nlolbin\
      \ = [powershell.exe,cmd.exe,wscript.exe,cscript.exe,mshta.exe,rundll32.exe,regsvr32.exe]\nev = FROM\
      \ [Event4688, Sysmon1]\nALERT ev WHERE parent_image IN office AND child_image IN lolbin\n   OR child_image\
      \ IN sensitive_system_bins AND parent_image NOT IN expected_parents(child_image)\nEMIT parent_command_line,\
      \ child_command_line, host, user"
- question: Based on a 30-day conditional-probability model of parent-child process pairs, is this execution
    statistically rare or never-before-seen for the host's role?
  context: Rather than relying only on a fixed list, quantify how unusual a process chain is. Using process
    creation logs (Sysmon Event ID 1), compute the conditional probability P(Child | Parent) for all parent-child
    pairs over the last 30 days, following [CAR-2014-11-002 Outlier Parents of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/).
    For each new event, alert when the probability is below a defined threshold (for example < 0.001)
    or when the pair has never been observed, highlighting a statistically rare chain that an RTLO-driven
    execution would produce. Tune the threshold per host role from observed variance, since a developer
    workstation and a kiosk have very different norms, and report the historical frequency in the alert.
    This statistical view catches novel masquerading-driven lineages that an allow-list might miss, supporting
    the Stealth investigation.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint Workstations, Multi-user Terminal Servers, File Servers'
  range: Last 90 days, with a 30-day probability baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "pairs = FROM Sysmon1 LAST 30d COUNT BY parent_image, child_image\nP = pairs[parent,child]\
      \ / SUM(pairs[parent, *])\nFOR ev IN new_process_events:\n  p = P.get((ev.parent, ev.child), 0)\n\
      \  IF p < 0.001 OR p == 0: ALERT ev WITH conditional_probability=p, historical_frequency, host_role"
- question: On a per-host process-execution graph, does a new execution bridge two previously unconnected
    process communities (for example an Office process suddenly connecting to a network-tools cluster)?
  context: Provenance-graph analysis can reveal masquerading-driven execution that point rules miss. Construct
    a per-host process execution graph with nodes as images and edges as parent-child relationships, then
    apply graph-embedding anomaly detection (as in [PROGRAPHER](https://www.usenix.org/conference/usenixsecurity23/presentation/yang-fan))
    or community detection. Flag a new execution that connects previously unconnected communities — for
    instance, a document/Office community suddenly linking to a network-tools or remote-access community
    — which is exactly the kind of structural anomaly an RTLO-tricked payload produces when it pivots.
    Emit the bridging edge and the two communities as the top contributing features for analyst review.
    This gives the Stealth investigation a behavioral, relationship-level signal that is robust to renamed
    binaries and novel tooling.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint Workstations, Multi-user Terminal Servers, File Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_process_graph(FROM Sysmon1 PER host)  # nodes=images, edges=parent->child\ncommunities\
      \ = detect_communities(G)\nembed = graph_embedding(G)   # PROGRAPHER-style\nFOR e IN new_edges:\n\
      \  IF community(e.parent) != community(e.child) AND not_previously_connected(e):\n    ALERT WITH\
      \ bridging_edge=e, community_a, community_b, anomaly_score(embed)"
- question: Was a benign-looking file downloaded by a browser or mail client and then, within roughly
    60 seconds on the same host, executed as a same-base-name process whose name contains the RTLO character?
  context: 'This correlation captures the full attack arc of an RTLO masquerade: a user downloads what
    looks like a document or image and quickly runs it. Correlate Zeek files.log/http.log download records
    with host process creation (Sysmon Event ID 1) on the host identifier within a < 60 second window,
    and alert when a downloaded benign-looking filename is followed by execution of a same-base-name file
    whose process name contains the RTLO character (per [Trojan Source](https://www.usenix.org/system/files/usenixsecurity23-boucher.pdf)).
    Include the download URL, the rendered vs. true filename, and the time delta in the alert so the analyst
    can immediately assess delivery source and user interaction. A positive correlation is high-confidence
    evidence that a Stealth masquerade led to execution, making this one of the most actionable questions
    in the playbook.'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek files.log
  - Zeek http.log
  - 'NAI: User Workstations, Application Servers, Network Egress Points'
  range: Last 90 days, with a 60-second download-to-execution correlation window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "dl = FROM [Zeek_files, Zeek_http] SELECT host, filename, url, ts\nexec = FROM Sysmon1 SELECT\
      \ host, image, process_name, ts\nJOIN dl, exec ON host AND base_name(dl.filename) == base_name(exec.image)\n\
      \          AND 0 <= exec.ts - dl.ts <= 60s\nALERT WHERE exec.process_name CONTAINS rtlo_patterns\n\
      EMIT url, rendered_filename, true_filename, time_delta"
- question: For each user, does the rate of 'file-create-then-process-create' sequences originating from
    browser or mail-client processes exceed their own mean-plus-three-standard-deviations hourly baseline?
  context: Download-then-execute is normal in small volumes but bursts can indicate scripted or campaign-driven
    masquerading. For each user, baseline the frequency of file-create-then-process-create sequences originating
    from browser/email-client processes over 30 days (a Frequency physics signal), adapting the per-user
    behavioral baselining of [Masquerade Detection Using Truncated Command Lines (Maxion & Townsend)](https://www.cs.cmu.edu/~maxion/pubs/MaxionTownsend02.pdf).
    Compute the mean and standard deviation per user per hour and alert when activity exceeds mean + three
    standard deviations. Separately profile failed or blocked executions (AV deny, quarantine) as a distinct
    State signal, since attackers often trip defenses before succeeding. Because the baseline is per-user,
    it adapts to individual work patterns and surfaces deviations that matter, supporting the Stealth
    investigation by spotting abnormal delivery-to-execution behavior even when the filename itself is
    not conclusively flagged.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek files.log
  - Zeek http.log
  - 'NAI: User Workstations, Application Servers, Network Egress Points'
  range: Last 90 days, with a 30-day per-user baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "seq = MATCH Sysmon11(file_create) -> Sysmon1(process_create)\n      WHERE parent_image IN\
      \ [browsers, mail_clients] PER user\nbase = FROM seq LAST 30d COMPUTE mean, std PER user PER hour\n\
      FOR u, h IN current:\n  IF count(seq[u,h]) > base[u].mean + 3*base[u].std: ALERT u WITH count, expected\n\
      blocked = COUNT executions WHERE av_deny OR quarantine PER user  # State signal"
- question: When download-then-execute events are clustered on features such as download-to-execution
    delta, extension, MIME type, source domain, download parent process, Unicode-control-character count,
    and filename entropy, which events fall in noise or tiny clusters and therefore look anomalous?
  context: 'Unsupervised clustering surfaces unusual delivery-to-execution behavior without predefined
    rules. Train a model such as DBSCAN on download-then-execute events using features including the time
    delta between download and execution, file extension, MIME type, source URL/domain, the parent process
    of the download, Unicode-control-character count, and filename entropy (entropy basis: [Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989)).
    Treat noise points and members of very small clusters as anomalous and surface the deviating features
    in the alert. Optionally score the filename''s confusability with the [Siamese CNN of Woodbridge et
    al.](https://arxiv.org/pdf/1805.09738) to add explainable ''looks-like'' context naming the legitimate
    file it imitates. This catches novel RTLO masquerading campaigns that evade signatures while keeping
    the result interpretable, directly advancing the Stealth question of filename-manipulation-based defense
    evasion.'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek files.log
  - Zeek http.log
  - 'NAI: User Workstations, Application Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "events = download_then_execute_events\nX = [time_delta, extension, mime_type, source_domain,\
      \ download_parent,\n     count(unicode_controls), filename_entropy]\nlabels = DBSCAN(eps, min_samples).fit_predict(X)\n\
      anom = events WHERE label == noise OR cluster_size(label) < min_cluster\nFOR a IN anom: a.lookalike\
      \ = siamese_cnn(a.filename)  # explainable context\nALERT anom WITH deviating_features, nearest_legitimate_name"
