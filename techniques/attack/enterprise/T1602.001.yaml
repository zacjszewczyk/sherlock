    that uses a community string matching a denylist of default (''public'', ''private''), common, or
    weak strings, with risk elevated if the source is not an authorized management host. Repeated SNMP
    authentication failures or noSuchName/genErr error responses indicate community-string brute-forcing
    preceding a successful MIB dump. This Symbolic Logic approach works as follows: Alert when Zeek snmp.log
    community strings match a denylist (public, private, default, cisco, etc.) and the source IP is not
