- question: '[Collection] Weak string denylist: Can you determine whether an SNMP request is logged in
    Zeek snmp.log that uses a community string matching a denylist of default (''public'', ''private''),
    common, or weak strings, with risk elevated if the source is not an authorized management host. Repeated
    SNMP authentication failures or noSuchName/genErr error responses indicate community-string brute-forcing
    preceding a successful MIB dump. -- specifically, using the ''Weak string denylist'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary queries the Simple Network
