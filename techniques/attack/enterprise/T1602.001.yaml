name: 'T1602.001: SNMP (MIB Dump)'
id: 637003f7-ec1d-4abf-871a-c142d626020c
description: 'This playbook helps an analyst investigate whether an adversary is targeting the Simple
  Network Management Protocol (SNMP) Management Information Base (MIB) to collect and mine network information
  from SNMP-managed devices such as routers and switches (MITRE ATT&CK T1602.001, SNMP (MIB Dump)). By
  issuing SNMP GET/GETNEXT/GETBULK queries, an adversary can dump device system information, hardware
  and software inventory, running configuration, routing tables, and interface details, then assemble
  a network map to facilitate future targeted exploitation. The hunt spans network sensor telemetry (Zeek
  conn.log and snmp.log) and endpoint process telemetry (Windows Event ID 4688, Sysmon Event ID 1), and
  pursues the behavior from several complementary angles: SNMP sessions that cross the internal/external
  perimeter or involve threat-intel-listed IPs (SNMP should never traverse the boundary); response-byte
  volumes that indicate large MIB payloads or GETBULK amplification; default/weak community-string usage
  and authentication-failure bursts that betray community-string brute-forcing; execution of SNMP enumeration
  tooling (snmpwalk, snmpbulkwalk, onesixtyone, nmap -sU -p161) on non-management hosts; and high request
  volume, distinct-destination scanning, or distinct-OID traversal indicative of a MIB dump. Detection
  methods combine deterministic symbolic-logic rules (boundary-crossing and TI matches, response-byte
  ratios, weak-community denylists and authorized-station allowlists, auth-failure burst thresholds, request-count
  and scan thresholds, enumeration-tool command-line matches), statistical baselining (per-host fan-out
  and OID-entropy percentiles, community-string entropy, process-rarity baselines, Z-scores and CUSUM/Bayesian
  change-point detection on request volume), and machine learning (Random Forest connection classification,
  unsupervised clustering and Isolation Forest scoring of SNMP and process features, time-series forecasting,
  and online streaming flow anomaly detection), so the analyst can corroborate suspected MIB enumeration
  across network flows, SNMP application logs, and host process lineage.'
type: technique
