questions:
- question: '[Collection] SNMP cross-network alert: Can you determine whether an SNMP session over UDP
    port 161/162 occurs where one host is on the internal network and the other is external, or an internal
    host involved in the session is present on a threat intelligence feed. SNMP should never traverse
    the perimeter, so any boundary-crossing SNMP flow is high-signal reconnaissance/collection. -- specifically,
    using the ''SNMP cross-network alert'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary queries the Simple Network
    Management Protocol (SNMP) Management Information Base (MIB) to harvest configuration, routing, interface,
    and system data from network devices, building a map of the environment to enable future targeted
    exploitation. This evidence focuses on the condition that an SNMP session over UDP port 161/162 occurs
    where one host is on the internal network and the other is external, or an internal host involved
    in the session is present on a threat intelligence feed. SNMP should never traverse the perimeter,
    so any boundary-crossing SNMP flow is high-signal reconnaissance/collection. This Symbolic Logic approach
    works as follows: Alert when Zeek conn.log UDP 161/162 flows cross internal/external boundaries or
    involve TI-listed IPs, recording the matched session (orig, resp, bytes, community, get/get_bulk counts)
    for triage; SNMP management traffic should never egress the perimeter [Russian State-Sponsored Cyber
    Actors Targeting Network Infrastructure Devices (TA18-106A)](https://www.cisa.gov/news-events/alerts/2018/04/16/russian-state-sponsored-cyber-actors-targeting-network-infrastructure).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable SNMP
    MIB enumeration or dumping; pivot to the source host and its owner/role (confirm whether it is an
    authorized network-management station), the targeted devices, the community strings and OIDs requested,
    the volume of MIB data returned, and the timing relative to maintenance windows, then scope what device
    configuration and topology data may have been exposed. A negative result helps rule out this particular
    collection vector but should be corroborated with the other questions in this playbook, since a single
    method can miss low-and-slow, authorized-host-impersonating, or off-sensor enumeration.'
  answer_sources:
  - Zeek conn.log
  - Zeek snmp.log
  - 'NAI: Network egress/ingress points (monitored by Zeek), internal network segments (monitored by Zeek),
    integrated threat intelligence platform data feeds.'
  range: Last 90 days (correlate event-centered windows of +/- 5 minutes around the activity)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# SNMP cross-network alert (Symbolic Logic)

      source IN [Zeek conn.log, Zeek snmp.log]

      | approach: Alert when Zeek conn.log UDP 161/162 flows cross internal/external boundaries or involve
      TI-listed IPs, recording the matched session (orig, resp, bytes, community, get/get_bulk counts)
      for triage; SNMP management traffic should never egress the perimeter [Russian State-Sponsored Cyber
      Actors Targeting Network Infrastructure Devices (TA18-106A)](https://www.cisa.gov/news-events/alerts/2018/04/16/russian-state-sponsored-cyber-actors-targeting-network-infrastructure).

      | correlate over NAI: Network egress/ingress points (monitored by Zeek), internal network segments
      (monitored by Zeek), integrated threat intelligence platform data feeds.

      | emit alert with contributing fields and entity context (src host, dest device, community string,
      OID count, get/get_bulk counts, resp_bytes)'
  - technology: Zeek/pseudocode
    query: '# Zeek view of SNMP enumeration/MIB dump

      watch snmp.log/conn.log for UDP 161/162 sessions

      | extract orig/resp, community, version, get_requests, get_bulk_requests, get_responses, resp_bytes

      | flag boundary-crossing, weak-community, high-fanout, or high-volume sessions

      | emit candidate MIB-dump sessions with src, dest, community, OID/req counts, bytes'
