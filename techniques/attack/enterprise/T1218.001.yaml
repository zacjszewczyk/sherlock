name: 'T1218.001: System Binary Proxy Execution: Compiled HTML File'
id: 3f7c1f2d-4744-4b92-90ab-af3d930fd097
description: 'Investigate adversary abuse of Microsoft Compiled HTML Help files (.chm) executed through
  the signed system binary hh.exe to conceal and proxy malicious code on Windows endpoints. This playbook
  helps an analyst hunt for CHM-based intrusion chains end to end: matching malicious CHM file hashes
  to command-and-control connections made by hh.exe child processes; detecting suspicious hh.exe command-line
  arguments such as ms-its, mk:@MSITStore, javascript:, vbscript:, -decompile, and embedded URLs; spotting
  hh.exe spawning unexpected shells, scripting engines, and other LOLBINs; correlating hh.exe execution
  with the rapid drop and execution of scripts or executables in user-writable directories; and flagging
  CHM files run from high-risk delivery paths such as email attachment caches, browser download folders,
  and temp directories. It combines deterministic symbolic-logic rules, statistical baselining of rarity,
  entropy, volume, and frequency, and machine-learning approaches (supervised classifiers, isolation forests,
  sequence and provenance-graph models) so an analyst can confirm whether an adversary is evading defenses
  with compiled HTML files.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Within any 5-minute window, did a .chm file with a known-malicious hash get transferred or
    accessed on a host while a child process of the corresponding hh.exe execution reached out to a known-bad
    C2 domain or IP?
  context: 'This is the highest-confidence CHM detection because it fuses three independent evidence streams
    into one verdict. Hash .chm files seen in Zeek files.log and via Windows file-access auditing (Event
    ID 4663) and compare them against threat intelligence; tie hh.exe process creation (Event ID 4688)
    and its children to Zeek conn.log/dns.log flows; then alert when a malicious CHM hash and a known-bad
    destination co-occur within five minutes. Anchor on the canonical legitimate binary C:\Windows\hh.exe
    (LOLBAS) and rely on centralized process/network logging per CISA/NSA living-off-the-land guidance.
    A positive result means a delivered CHM almost certainly executed a payload that established C2, supporting
    the Stealth hypothesis that the adversary is hiding malicious code inside a trusted help-file workflow;
    a negative result helps rule out active CHM-based C2 during the window. References: [LOLBAS Project
    Hh.exe entry](https://lolbas-project.github.io/lolbas/Binaries/Hh/); [CISA/NSA LOTL guidance](https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-038a).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint devices, Email gateway, Web proxy/gateway, DNS servers, Network Security Monitoring
    (NSM) sensor, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: chm = hash_events(Zeek_files_log, WinEventID_4663) WHERE ext='.chm'; enrich chm.sha256 WITH
      threat_intel; proc = WinEventID_4688 WHERE parent_image='hh.exe'; net = JOIN proc.children TO (Zeek_conn_log,
      Zeek_dns_log) ON pid/host; ALERT when chm.ti_match=true AND net.dest IN c2_indicators AND abs(chm.time
      - net.time) <= 5m; OUTPUT host, user, chm_path, sha256, dest, cmdline.
- question: Do network connections made by hh.exe child processes reach rare or newly registered destinations,
    show high DNS entropy, or exhibit failure-mode beaconing such as NXDOMAIN bursts and repeated failed/dead-drop
    fetches?
  context: 'When no threat-intel hit exists, statistical rarity and failure-mode profiling can still expose
    covert C2 launched from a CHM payload. Establish rolling host, user, and enterprise baselines, then
    score destination IP/domain/ASN rarity over a 30-day window (flag domains under 30 days old, IP reputation
    in the bottom 5th percentile, rare ASNs) and raise alerts when DNS label Shannon entropy exceeds ~3.5
    bits, which is DGA-suggestive. Treat failure signals as distinct beaconing evidence: NXDOMAIN bursts,
    blocked/failed connection counts per minute, and repeated HTTP 404/dead-drop fetches; also score volume
    (bytes sent/received, request/response ratio) and frequency (connections/min) deviations using KL-divergence
    baselining. Because the parent is hh.exe, any beacon-like or rare destination strongly supports the
    Stealth hypothesis that an adversary is hiding C2 behind a help-file process. References: [Nadler
    et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf); [NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500);
    [Red Canary entropy](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint devices, Email gateway, Web proxy/gateway, DNS servers, Network Security Monitoring
    (NSM) sensor, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: conns = Zeek_conn_log JOIN Zeek_dns_log WHERE initiating_proc_parent='hh.exe'; baseline dest_ip,dest_domain,asn
      over 30d; score rarity (domain_age<30d, ip_rep<=p5, asn_rare); compute dns_label_entropy, nxdomain_rate,
      failed_conn_per_min, bytes_ratio, conns_per_min vs baseline (KL-divergence); ALERT when entropy>3.5
      OR rarity_score high OR failure_burst detected; OUTPUT dest, scores, host, user.
- question: Does an explainable supervised model classify any hh.exe-to-network chain as malicious based
    on process lineage, child rarity, destination reputation, domain age/entropy, byte volume, duration,
    and failed-connection ratio?
  context: 'A supervised classifier captures CHM C2 behavior where no single feature is decisive but the
    combined profile is. Train a Random Forest or Gradient Boosting model on benign and known-malicious
    examples using features from Event ID 4688 and Zeek conn/dns logs (lineage depth, child rarity, destination
    port, IP reputation, domain age/entropy, bytes, duration, failed-connection ratio), following a gradient-boosted
    feature-importance approach, and alert on high-confidence ''malicious'' predictions while surfacing
    the top-3 contributing features (for example domain age, child rarity, bytes-out) in the alert text.
    Pair it with an unsupervised Isolation Forest to catch novel flows the classifier has not seen. Analysts
    should rely on the feature attributions, not just the score, to confirm whether a help-file process
    is concealing C2 consistent with the Stealth tactic. References: [Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/);
    [Isolation Forest (Liu et al.)](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint devices, Email gateway, Web proxy/gateway, DNS servers, Network Security Monitoring
    (NSM) sensor, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: features = [lineage_depth, child_rarity, dest_port, ip_reputation, domain_age, domain_entropy,
      bytes_out, duration, failed_conn_ratio]; pred = gbdt_model.predict_proba(features); ALERT when pred>=0.85;
      ALSO score = isolation_forest.score(features); ALERT on top_1pct anomalies; OUTPUT verdict, top_3_features,
      host, dest.
- question: Are there hh.exe executions whose command line contains abuse syntax such as ms-its:, mk:@MSITStore:,
    javascript:, vbscript:, -decompile, or embedded http/https URLs?
  context: 'hh.exe accepts arguments that allow it to render embedded script, decompile CHM content, or
    fetch remote resources, and these patterns rarely appear in legitimate help-file viewing. Using Event
    ID 4688 (or Sysmon EID 1), find hh.exe executions and apply regex to the command line for ms-its:,
    mk:@MSITStore:, javascript:, vbscript:, -decompile, or http/https URLs, alerting whenever they appear,
    per documented LOLBAS abuse syntax and the SigmaHQ HTML Help rule. Keep these deterministic patterns
    as a detection floor regardless of any ML score. A match is a strong, low-effort signal that an adversary
    is using a trusted binary to execute concealed code (Stealth); the absence of matches narrows the
    investigation but does not rule out obfuscated invocations. References: [LOLBAS Project Hh.exe entry](https://lolbas-project.github.io/lolbas/Binaries/Hh/);
    [SigmaHQ HTML Help rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hh_html_help_susp_child_process.yml).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoint devices (workstations and servers), Active Directory domain controllers (for centralized
    logging), Log Aggregation Platform (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: SEARCH WinEventID_4688 OR Sysmon_EID_1 WHERE image='hh.exe' AND command_line MATCHES regex
      '(?i)(ms-its:|mk:@MSITStore:|javascript:|vbscript:|-decompile|https?://)'; ALERT; OUTPUT host, user,
      command_line, parent_image.
- question: Do any hh.exe command lines have abnormally high Shannon entropy or unusual length/argument
    counts compared with the 30-day host baseline, suggesting obfuscated or encoded invocation?
  context: 'Adversaries frequently obfuscate or encode command lines to evade signature matching, which
    inflates character entropy. Calculate Shannon entropy for each hh.exe command line, baseline legitimate
    entropy over 30 days, and alert above the 95th percentile to surface obfuscated or encoded invocations.
    Also track volume (command-line length, argument count) and frequency (executions per host per day)
    deviations from the host baseline. High entropy on a help-file binary''s command line is unusual and
    supports the Stealth hypothesis that the adversary is hiding intent inside hh.exe; a result within
    baseline suggests routine usage. This complements the deterministic regex floor by catching encodings
    the regex misses. References: [Red Canary entropy](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/);
    [Elastic''s high-command-line-entropy rule](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoint devices (workstations and servers), Active Directory domain controllers (for centralized
    logging), Log Aggregation Platform (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each WinEventID_4688 WHERE image=''hh.exe'': compute entropy(command_line), length, arg_count;
      baseline over 30d; ALERT when entropy>p95 OR length>p95 OR exec_per_host_day>p95; OUTPUT host, user,
      command_line, entropy, percentile.'
- question: Does an ML model flag any hh.exe command line as anomalous or obfuscated based on length,
    argument count, character distribution, and keywords like ms-its or http?
  context: 'Beyond entropy, ML models can detect structurally anomalous or deliberately obfuscated hh.exe
    command lines. Score command lines with an Isolation Forest over features such as length, argument
    count, character distribution, and keywords (ms-its, http), and add an obfuscation-resistant text
    classifier - an ELECTRA-style small language model trained with Invoke-DOSfuscation, an NLP token
    classifier, or a GBDT approach. Surface the top-3 contributing tokens/features in the alert and maintain
    coverage with active learning. The goal under the Stealth tactic is to catch novel concealment techniques
    on hh.exe that evade both static regex and simple entropy thresholds; analysts should review the highlighted
    tokens to validate the verdict. References: [Isolation Forest (Liu et al.)](https://doi.org/10.1145/2133360.2133363);
    [Tran et al.](https://arxiv.org/abs/2408.02637); [NLP token classifier (Kaya et al.)](https://doi.org/10.1007/978-3-030-12942-2_13);
    [Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/);
    [Ongun et al.](https://arxiv.org/abs/2111.15039).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoint devices (workstations and servers), Active Directory domain controllers (for centralized
    logging), Log Aggregation Platform (SIEM)'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: features = [length, arg_count, char_distribution, keyword_flags(ms-its,http)]; anomaly = isolation_forest.score(features);
      clf = obfuscation_text_model.predict(command_line); ALERT when anomaly in top_1pct OR clf='obfuscated';
      OUTPUT top_3_tokens, host, command_line.
- question: Did hh.exe spawn a child process on a LOLBIN denylist such as cmd.exe, powershell.exe, wscript.exe,
    cscript.exe, rundll32.exe, regsvr32.exe, mshta.exe, certutil.exe, or bitsadmin.exe?
  context: 'Legitimate help-file viewing does not launch command shells or scripting engines, so hh.exe
    spawning such children is a high-fidelity indicator of payload execution. Detect when hh.exe is the
    parent process (Event ID 4688 / Sysmon EID 1) and the child matches the LOLBAS denylist (cmd.exe,
    powershell.exe, pwsh.exe, wscript.exe, cscript.exe, rundll32.exe, regsvr32.exe, mshta.exe, msiexec.exe,
    bitsadmin.exe, certutil.exe, certreq.exe, installutil.exe, msbuild.exe, schtasks.exe, wmic.exe), generating
    a high-severity alert. This denylist comes directly from the SigmaHQ HTML Help suspicious child-process
    rule. A hit strongly supports the Stealth hypothesis that a CHM is proxying execution of follow-on
    tooling through a trusted binary. References: [SigmaHQ HTML Help suspicious child-process rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hh_html_help_susp_child_process.yml);
    [Red Canary''s LOLBins guidance](https://redcanary.com/blog/blog/lolbins-abuse/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Critical servers, Log aggregation platform (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: SEARCH WinEventID_4688 OR Sysmon_EID_1 WHERE parent_image='hh.exe' AND child_image IN [cmd.exe,powershell.exe,pwsh.exe,wscript.exe,cscript.exe,rundll32.exe,regsvr32.exe,mshta.exe,msiexec.exe,bitsadmin.exe,certutil.exe,certreq.exe,installutil.exe,msbuild.exe,schtasks.exe,wmic.exe];
      ALERT severity=high; OUTPUT host, user, child_image, child_cmdline.
- question: Are there hh.exe child processes that are not on a known-good allowlist and appear on fewer
    than 1% of endpoints (or fewer than 5 hosts) over a 30-day window?
  context: 'Even children not on the explicit denylist can be malicious if they are rare. Compute child-process
    frequencies for hh.exe over a 30-day rolling window and flag children not on a known-good allowlist
    that appear on fewer than 1% of endpoints (or fewer than 5 hosts) as suspicious, applying rare-parent/child
    baselining. Track frequency (child spawns per hour) and state (child exit codes / failed launches)
    as additional signals. Rarity is powerful for the Stealth tactic because adversaries introduce process
    relationships the environment has never legitimately produced; a rare hh.exe child warrants triage,
    while common allowlisted children can be deprioritized. References: [MITRE CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Critical servers, Log aggregation platform (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline child_image frequency for parent='hh.exe' over 30d across fleet; FLAG children NOT
      IN allowlist WHERE host_prevalence<1% OR host_count<5; track spawns_per_hour, child_exit_code; OUTPUT
      child_image, prevalence, hosts, host.
- question: Does provenance/parent-child graph analysis place any hh.exe execution chain outside established
    process communities, indicating an anomalous causal subgraph?
  context: 'Process-lineage graphs reveal anomalous causal structure that flat rules miss. Construct a
    provenance/parent-child graph and apply community detection (e.g., Louvain modularity) plus graph
    representation learning - masked graph learning (MAGIC) or temporal GNN autoencoders (KAIROS) - to
    flag hh.exe chains outside established communities. Surface the reconstructed causal subgraph (top
    contributing nodes/edges) in the alert for explainability. Under the Stealth tactic, this catches
    CHM execution chains whose ancestry and descendants differ from normal help-file activity even when
    individual processes look benign; analysts should examine the highlighted subgraph to confirm malicious
    lineage. References: [MAGIC (USENIX Security 2024)](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf);
    [KAIROS (IEEE S&P 2024)](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Critical servers, Log aggregation platform (SIEM)'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: build_provenance_graph(process_create_events); communities = louvain(graph); embeddings = graph_autoencoder(graph);
      FLAG hh.exe subgraphs with high reconstruction_error OR outside known communities; OUTPUT causal_subgraph,
      top_nodes_edges, host.
- question: Within a 2-minute window, did an hh.exe execution lead to the creation of a high-risk file
    (.exe, .dll, .ps1, .vbs, .js, .bat) in a writable directory that was then immediately executed?
  context: 'The classic CHM-delivery chain is hh.exe writing a payload to a writable directory and then
    running it. Alert when an Event ID 4688 for hh.exe is followed within 120 seconds by an Event ID 4663
    / Sysmon EID 11 creating a high-risk extension (.exe, .dll, .ps1, .vbs, .js, .bat) in a writable directory,
    followed immediately by a 4688 for that same file - the exact drop-and-execute chain documented by
    Trustwave SpiderLabs and matched by the SigmaHQ HTML Help rule. This three-stage temporal correlation
    is highly specific to malicious CHM use and strongly supports the Stealth hypothesis; legitimate help
    viewing does not write and launch new executables. References: [Trustwave SpiderLabs](https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/chm-badness-delivers-a-banking-trojan/);
    [SigmaHQ HTML Help rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hh_html_help_susp_child_process.yml).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User workstations, File servers, Application servers hosting user-writable directories'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'SEQUENCE: e1=WinEventID_4688 image=''hh.exe''; e2=WinEventID_4663 OR Sysmon_EID_11 WHERE new_file
      ext IN [.exe,.dll,.ps1,.vbs,.js,.bat] AND path IN writable_dirs AND e2.time-e1.time<=120s; e3=WinEventID_4688
      image=e2.new_file; ALERT when e1->e2->e3; OUTPUT host, user, dropped_file, path, timeline.'
- question: Does any hh.exe execution have a suspicious-drop score above zero - that is, does it create
    one or more executable/script files in writable directories within its first 5 minutes?
  context: 'Legitimate hh.exe should never create executable or script files, so any drop is anomalous.
    Define a suspicious-drop score equal to the count of executable/script files created in writable directories
    during the first 5 minutes of hh.exe execution; baseline legitimate hh.exe at zero and treat any execution
    with score >0 as anomalous. Include volume (dropped-file byte size, count) and state (whether the
    dropped file subsequently executes successfully) metrics. Because the benign baseline is exactly zero,
    this is a clean, defensible statistical signal for the Stealth tactic: a nonzero score means hh.exe
    is being used to stage payloads, and analysts should pivot to the dropped file''s hash and execution.
    References: [MITRE CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User workstations, File servers, Application servers hosting user-writable directories'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each hh.exe exec (WinEventID_4688): count = files_created_in_writable_dirs(WinEventID_4663/Sysmon_EID_11)
      within 5m WHERE ext IN [.exe,.dll,.ps1,.vbs,.js,.bat]; ALERT when count>0; record dropped_bytes,
      dropped_count, did_execute; OUTPUT host, user, score, dropped_files.'
- question: Does a sequence or provenance model flag an hh.exe -> file-write -> new-process chain as a
    high-reconstruction-error anomaly indicative of drop-and-execute?
  context: 'Temporal sequence models learn what normal process/file activity looks like and flag deviations.
    Train a time-series anomaly detector (LSTM autoencoder) on normal process/file-creation sequences
    and flag chains like hh.exe -> file write (.exe in %TEMP%) -> new process that produce high reconstruction
    error; augment with provenance-graph detection (KAIROS, MAGIC) to reconstruct and explain the drop-and-execute
    subgraph (top-3 anomalous edges) for analysts. This catches variations of the CHM drop chain that
    rigid rules miss, supporting the Stealth hypothesis; the reconstructed subgraph gives analysts an
    explainable basis to confirm or dismiss the anomaly. References: [KAIROS (IEEE S&P 2024)](https://tfjmp.org/publications/2024-sp.pdf);
    [MAGIC (USENIX Security 2024)](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User workstations, File servers, Application servers hosting user-writable directories'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: seq = build_event_sequence(hh.exe -> file_create -> process_create); recon_error = lstm_autoencoder.score(seq);
      graph_anom = provenance_model.score(subgraph); ALERT when recon_error>p99 OR graph_anom high; OUTPUT
      top_3_anomalous_edges, host, timeline.
- question: Is hh.exe opening a .chm file from a high-risk delivery directory such as \Downloads, \AppData\Local\Temp,
    Temporary Internet Files, INetCache, or the Outlook attachment cache?
  context: 'CHM files delivered by phishing or download land in predictable user-writable locations, not
    in the canonical help directories. Parse hh.exe command lines (Event ID 4688) to extract the .chm
    path and alert when it matches a denylist such as \Downloads, \AppData\Local\Temp, \Temporary Internet
    Files\, \Local\Microsoft\Windows\INetCache\, or \AppData\Local\Microsoft\Outlook\ - the mail/download
    delivery paths confirmed by Trustwave SpiderLabs - while allowlisting canonical C:\Windows\Help and
    C:\Program Files paths per LOLBAS and CISA/NSA guidance. Execution of a CHM from a delivery path is
    a strong Stealth indicator that an adversary is concealing code in an emailed or downloaded help file;
    allowlisted system paths can be deprioritized. References: [Trustwave SpiderLabs](https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/chm-badness-delivers-a-banking-trojan/);
    [LOLBAS Project entry](https://lolbas-project.github.io/lolbas/Binaries/Hh/); [CISA/NSA LOTL guidance](https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-038a).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User workstations (specifically profile directories), Email client cache directories, Web browser
    download directories'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR each WinEventID_4688 image=''hh.exe'': extract chm_path from command_line; ALERT when
      chm_path MATCHES [\Downloads,\AppData\Local\Temp,Temporary Internet Files,INetCache,\AppData\Local\Microsoft\Outlook]
      AND NOT under [C:\Windows\Help,C:\Program Files]; OUTPUT host, user, chm_path, command_line.'
- question: Are there .chm execution paths outside the standard help directories that occur on fewer than
    1% of CHM-using endpoints over a 30-day baseline?
  context: 'Statistical rarity scoring catches delivery paths a static denylist may not enumerate. Aggregate
    unique .chm paths over 30 days, compute execution frequency, and flag paths outside standard directories
    (not under C:\Windows\Help or C:\Program Files) that occur on fewer than 1% of CHM-using endpoints,
    using rare-behavior baselining and a rarity-frequency approach. For the Stealth tactic, an adversary''s
    CHM lands in an unusual location for a given host or fleet; flagging rare non-standard paths surfaces
    novel delivery directories while common, expected paths stay quiet. Analysts should correlate flagged
    paths with email/web delivery telemetry to confirm origin. References: [MITRE CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/);
    [Red Canary''s LOLBins guidance](https://redcanary.com/blog/blog/lolbins-abuse/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User workstations (specifically profile directories), Email client cache directories, Web browser
    download directories'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: aggregate distinct chm_path over 30d; compute exec_frequency, host_prevalence; FLAG paths NOT
      under [C:\Windows\Help,C:\Program Files] WHERE host_prevalence<1%; OUTPUT chm_path, prevalence,
      exec_count, hosts.
- question: Does an explainable classifier label any CHM execution path as suspicious based on path depth,
    keywords (Temp, Download, Cache), directory type, and character ratios?
  context: 'An ML classifier generalizes beyond fixed path denylists. Train a classifier (Naive Bayes
    or gradient-boosted trees) on benign CHM paths using features like depth, keywords (Temp, Download,
    Cache), directory type, and character ratios to label new CHM execution paths ''suspicious-like''
    for analyst review, surfacing the top-3 contributing features; use a feature-importance/explainability
    approach and pair with an Isolation Forest for unsupervised path-rarity scoring. Under the Stealth
    tactic, this catches delivery paths that resemble known-bad patterns even when exact strings differ;
    analysts should weigh the top features (for example a ''Download'' keyword plus shallow depth) when
    deciding whether a CHM path reflects adversary delivery. References: [Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/);
    [Isolation Forest (Liu et al.)](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User workstations (specifically profile directories), Email client cache directories, Web browser
    download directories'
  range: Last 90 days
  queries:
