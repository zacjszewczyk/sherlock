- question: 'Within the Stealth tactic, using deterministic rule logic, can you determine whether the
    ''Sensitive Parent Shell Rule'' approach reveals Access Token Manipulation via Create Process with
    Token (T1134.002)? Concretely: Alert on process creation where ''Creator Process Name'' is a sensitive
    system process (''lsass.exe'',''wininit.exe'',''winlogon.exe'',''services.exe'',''smss.exe'') and
    ''New Process Name'' is an interactive shell/interpreter (''cmd.exe'',''powershell.exe'',''pwsh.exe'',''wscript.exe'',''cscript.exe'',''rundll32.exe'',''regsvr32.exe'').
    services.exe -> cmd.exe is a documented SYSTEM-context execution pattern per [CAR-2014-05-002 (MITRE
    CAR)](https://car.mitre.org/analytics/CAR-2014-05-002/); any child of lsass.exe is treated as critical
    per [T1134.002 (MITRE ATT&CK)](https://attack.mitre.org/techniques/T1134/002/). Keep as a deterministic
    floor.'
