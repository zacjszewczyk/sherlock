name: 'T1134.002: Access Token Manipulation: Create Process with Token'
id: ae52181b-2984-4141-8a18-d4c2a302a85d
description: 'This playbook helps an analyst investigate Access Token Manipulation: Create Process with
  Token (T1134.002), where an adversary spawns a new process using an existing, stolen, or duplicated
  token (via CreateProcessWithTokenW/CreateProcessAsUserW or runas) so the child runs under a different,
  often more-privileged, security context than its creator. It supports two missions: escalating privilege
  (Privilege Escalation) and blending in to evade attribution (Stealth). Investigative angles include:
  process-creation events (Windows Event ID 4688 / Sysmon Event ID 1) where the target user/token is privileged
  while the creator is not; token-manipulation tool and LOLBin signatures; sensitive system processes
  (lsass.exe, services.exe, wininit.exe, smss.exe) spawning interactive shells; high-integrity children
  of critical parents running from user-writable or unsigned paths; creator-vs-parent PID mismatches indicating
  PPID spoofing; non-interactive logon sessions fanning out into many unrelated processes from a reused
  token; and elevated processes immediately initiating suspicious outbound network activity (Zeek conn.log/dns.log,
  Sysmon Event ID 3). Detection blends symbolic-logic rules (watchlists, token-context comparison, allow-listed
  brokers), statistical baselining (rarity percentiles, frequency, entropy, failure-state ratios, Jaccard
  deviation), and machine learning (Random Forest/Gradient Boosting, Isolation Forest/one-class SVM, LSTM/autoencoder
  sequence models, and graph community detection) to produce evasion-resistant, explainable alerts.'
type: technique
