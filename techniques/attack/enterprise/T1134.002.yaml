- question: 'Within the Stealth tactic, using a machine-learning model, can you determine whether the
    ''Process Elevation Classifier'' approach reveals Access Token Manipulation via Create Process with
    Token (T1134.002)? Concretely: Train a supervised classifier (Random Forest / Gradient Boosting) on
    labeled process-creation events using features: creator/new process name, creator vs. target user,
    token elevation type, integrity-level delta, command-line length, entropy, special-character ratio,
    and token n-grams, following the LOLBin/command-line feature methodologies of [ProblemChild (Elastic)](https://ar5iv.labs.arxiv.org/html/2008.04676),
    [Obfuscated Command Line Detection (Mandiant)](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/),
    [LOLBin Detection via Active Learning (Boros et al.)](https://arxiv.org/abs/2111.15039), and [Detecting
    Malicious Windows Commands with NLP (Hendler et al.)](https://doi.org/10.1007/978-3-030-12942-2_13).
    The alert MUST list the top-3 contributing features (e.g., ''integrity-level delta=+High, creator
    rarity, encoded-arg entropy'').'
