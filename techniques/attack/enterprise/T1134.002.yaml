questions:
- question: 'Within the Stealth tactic, using deterministic rule logic, can you determine whether the
    ''Token Target Creation Rule'' approach reveals Access Token Manipulation via Create Process with
    Token (T1134.002)? Concretely: Maintain a watchlist of process names/command-line tokens associated
    with token-manipulation tooling (e.g., ''incognito'', ''psgetsys'', ''Invoke-TokenManipulation'',
    ''runas /user:'', ''CreateProcessWithToken''). Alert on Windows Event ID 4688 / Sysmon Event ID 1
    where ''New Process Name'' or ''Command Line'' matches AND ''Target User Name'' is a privileged account
    AND ''Creator User Name'' is non-privileged. Where ETW thread/process telemetry exists, require correlation
    to a CreateProcessWithTokenW/CreateProcessAsUserW call ([CreateProcessWithTokenW (Microsoft)](https://learn.microsoft.com/en-us/windows/win32/api/processthreadsapi/nf-processthreadsapi-createprocesswithtokenw),
    [T1134.002 (MITRE ATT&CK)](https://attack.mitre.org/techniques/T1134/002/)). Keep deterministic floor;
    never delete thresholds, only allow-list verified broker callers (seclogon, runas, consent.exe).'
  context: 'Tactic context (Stealth): Has the adversary escalated privileges by creating a process with
    a stolen or manipulated token? This evidence focuses on: A process creation event (Windows Event ID
    4688 / Sysmon Event ID 1) shows a new process whose name or command line matches a known token-manipulation
    tool signature, the ''Target User Name''/token context is privileged (e.g., NT AUTHORITY\SYSTEM, a
    Domain Admin) while the ''Creator User Name'' is non-privileged, and (where ETW is available) the
    creation is correlated with a CreateProcessWithTokenW/CreateProcessAsUserW call. Detection approach
    (''Token Target Creation Rule'' / Symbolic Logic): Maintain a watchlist of process names/command-line
    tokens associated with token-manipulation tooling (e.g., ''incognito'', ''psgetsys'', ''Invoke-TokenManipulation'',
    ''runas /user:'', ''CreateProcessWithToken''). Alert on Windows Event ID 4688 / Sysmon Event ID 1
    where ''New Process Name'' or ''Command Line'' matches AND ''Target User Name'' is a privileged account
    AND ''Creator User Name'' is non-privileged. Where ETW thread/process telemetry exists, require correlation
    to a CreateProcessWithTokenW/CreateProcessAsUserW call ([CreateProcessWithTokenW (Microsoft)](https://learn.microsoft.com/en-us/windows/win32/api/processthreadsapi/nf-processthreadsapi-createprocesswithtokenw),
    [T1134.002 (MITRE ATT&CK)](https://attack.mitre.org/techniques/T1134/002/)). Keep deterministic floor;
    never delete thresholds, only allow-list verified broker callers (seclogon, runas, consent.exe). A
    positive result indicates a process was created with a token whose security context (SID, logon ID,
    or integrity level) differs from its creator in a way consistent with stolen or duplicated token reuse
    to escalate privilege or hide attribution; a negative result means the observed parent-child, token,
    and user context match the legitimate baseline of privilege brokers and expected workflows. Pivot
    from any hit to the creator process, the source logon session, the token''s origin (prior token theft/duplication),
    and any follow-on privileged or lateral-movement activity. Investigate within the named area of interest:
    Domain Controllers, Administrator Workstations, Critical Application Servers, Tier 0 Assets.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - ETW Microsoft-Windows-Kernel-Process / ProcThread API
  - 'NAI: Domain Controllers, Administrator Workstations, Critical Application Servers, Tier 0 Assets'
  range: Last 90 days; correlate process-creation events within a 10-minute window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic rule: Token Target Creation Rule\nMATCH process_creation_events  // WinEventLog\
      \ 4688 / Sysmon 1\nWHERE <conditions derived from action>\n  // Maintain a watchlist of process\
      \ names/command-line tokens associated with token-manipulation tooling (e.g., 'incognito', 'psgetsys',\
      \ 'Invoke-TokenManipulation',\nEMIT alert WITH creator_process, new_process, creator_user, target_user,\
      \ token_elevation_type, logon_id"
- question: 'Within the Stealth tactic, using statistical baselining, can you determine whether the ''Creator
    Rarity & Elevation-Rate Score'' approach reveals Access Token Manipulation via Create Process with
    Token (T1134.002)? Concretely: For events with ''Token Elevation Type'' = Type 1 (full) or Type 2
    (elevated), compute (a) enterprise-wide rarity of the ''Creator Process Name'' (flag below 5th percentile),
    (b) Frequency = count of privileged-child creations per creator per host per 10 min, and (c) State
    = ratio of successful elevations to failed privileged-use attempts (Event ID 4673/4674) for that account.
    Alert when a rare creator exceeds its per-host frequency baseline (>3 sigma) or its failure ratio
    spikes, adapting the per-feature profiling of [Kruegel & Vigna multi-model anomaly detection](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).
    Derive thresholds per environment from 30-day baselines.'
