    Concretely: For each ''Creator Process Name'', build the historical set of ''Target User Name'' contexts
    it spawns; measure deviation of a new context via Jaccard distance and flag when distance > 0.9 and
    target is privileged. Track Frequency (privileged-elevation count per creator/hour) and State (success
    vs. 4625/4673 failure ratio). Multi-model per-feature scoring follows [Kruegel & Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf);
    derive the distance/percentile thresholds from a 30-day per-host baseline.'
  context: 'Tactic context (Stealth): Has the adversary escalated privileges by creating a process with
    a stolen or manipulated token? This evidence focuses on: A process is created with a token granting
    higher integrity (High/System) or a different, more-privileged user context than its parent, and the
    parent is not on an allow-list of legitimate privilege brokers (e.g., svchost.exe, consent.exe, runas.exe,
    seclogon). Detection approach (''Creator-Target Set Deviation'' / Statistical Method): For each ''Creator
    Process Name'', build the historical set of ''Target User Name'' contexts it spawns; measure deviation
    of a new context via Jaccard distance and flag when distance > 0.9 and target is privileged. Track
    Frequency (privileged-elevation count per creator/hour) and State (success vs. 4625/4673 failure ratio).
    Multi-model per-feature scoring follows [Kruegel & Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf);
    derive the distance/percentile thresholds from a 30-day per-host baseline. A positive result indicates
    a process was created with a token whose security context (SID, logon ID, or integrity level) differs
    from its creator in a way consistent with stolen or duplicated token reuse to escalate privilege or
    hide attribution; a negative result means the observed parent-child, token, and user context match
    the legitimate baseline of privilege brokers and expected workflows. Pivot from any hit to the creator
    process, the source logon session, the token''s origin (prior token theft/duplication), and any follow-on
    privileged or lateral-movement activity. Investigate within the named area of interest: All Windows
    Endpoints and Servers.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baseline: Creator-Target Set Deviation\nBASELINE over last 30d PER host, PER\
      \ creator_process\nCOMPUTE rarity_pct, frequency_per_window, failure_ratio, entropy, byte_volume\n\
      \  // For each 'Creator Process Name', build the historical set of 'Target User Name' contexts it\
      \ spawns; measure deviation of a new context via Jaccard distance and \nALERT WHEN metric exceeds\
      \ learned threshold (e.g. >3 sigma or <1st percentile)"
