- question: 'Within the Stealth tactic, using statistical baselining, can you determine whether the ''Parent-Child
    Relationship Baseline'' approach reveals Access Token Manipulation via Create Process with Token (T1134.002)?
    Concretely: Profile per-parent child-process frequency enterprise-wide; alert on rare ''Creator ->
    New Process'' pairs (below 1st percentile), weighting higher when ''Target User Name'' is privileged
    and differs from ''Creator User Name''. Add Volume (command-line byte length percentile) and Frequency
    (pair rate/min) terms, applying the per-feature statistical profiling of [Kruegel & Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf)
    and the rare parent-child probability scoring of [ProblemChild](https://ar5iv.labs.arxiv.org/html/2008.04676).
    Profile failure state too: a burst of failed child launches (4688 paired with 4625/4673 failures)
    is a distinct signal.'
