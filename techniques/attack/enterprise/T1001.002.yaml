name: 'T1001.002: Steganography'
id: ee1f997d-ae73-408e-bd4d-00e8c76af41c
description: 'Investigate whether an adversary is concealing command-and-control or data exchange inside
  seemingly benign carrier files such as images, audio, video, and documents using steganography. This
  playbook helps an analyst hunt for steganography tool indicators (hashes, watermarks, EXIF/XMP keywords),
  carrier files whose size or entropy are statistical outliers for their MIME type, least-significant-bit
  (LSB) planes with near-maximal Shannon entropy or chi-square evidence of embedding, and embedded magic
  numbers hidden inside media. It also correlates these carriers with network behavior: connections to
  rare or CTI-listed external destinations, GUI or non-network processes (e.g., mspaint.exe, notepad.exe)
  that suddenly open external sockets and move media, and dead-drop polling seen as repeated failed/blocked
  connections or NXDOMAIN bursts. Symbolic-logic IOC and signature rules form an always-on floor, statistical
  baselines surface volume and frequency anomalies, and machine-learning steganalysis (CNN and rich-model
  classifiers, domain classifiers, anomaly detectors) catch adaptive embedders across Windows, Linux,
  macOS, and ESXi as well as the NSM sensor grid.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any file hashes seen on the network or in process-creation events exactly match known steganography
    tool executables, and do connecting hosts also reach CTI-listed destinations while moving large carrier
    files?
  context: 'This is the deterministic, always-on floor for steganographic C2. Extract SHA256 hashes from
    Zeek files.log and MD5/SHA1 digests from Windows Event ID 4688, then join them against STIX/CTI feeds
    for steganography tooling such as OpenStego, Steghide, OutGuess, SilentEye, and F5. Correlate destination
    IPs in conn.log and resolved names in dns.log so the alert ties a known tool to an actual egress path.
    An exact hash match is critical; a CTI-listed domain coinciding with a large carrier transfer (resp_bytes
    > 1 MB or orig_bytes > 1 MB) is high severity. In the Command and Control context this confirms an
    operator is using carrier files as a covert channel rather than ordinary media browsing; a negative
    result lowers but does not eliminate suspicion because adversaries can repack tooling. References:
    [Hidden and Uncontrolled, Wendzel et al](https://arxiv.org/abs/1407.2029).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateways, DNS Resolvers, Proxy Servers, Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: hashes = UNION(Zeek_files.sha256, EID4688.md5_sha1); MATCH hashes AGAINST cti_steg_tool_hashes
      -> CRITICAL alert; JOIN conn.log dst, dns.log query WHERE dst IN cti_steg_domains AND (resp_bytes>1e6
      OR orig_bytes>1e6) -> HIGH alert; RETURN host, hash, dst, query, bytes.
- question: Which external destinations are statistically rare across the environment or show abnormal
    connection-failure patterns, and do they appear on steganography CTI watchlists while uploads or media
    MIME types dominate the traffic?
  context: 'Covert steganographic channels are typically low-volume, so rarity and failure behavior are
    strong discriminators. Compute 30-day rolling statistics per external IP/domain (connection_count,
    unique_source_count, total_bytes, and failed/blocked counts from conn_state S0/REJ/RSTO and proxy
    4xx/5xx), then derive rarity_score = 1/(connection_count+1) and alert on destinations in the bottom
    5th percentile (rarity_score > 0.95) that also appear on CTI watchlists. Escalate when uploads dominate
    (orig_bytes > resp_bytes) or image/media MIME types appear in files.log. Treat the failure ratio as
    a distinct dead-drop polling signal: a host repeatedly retrying a rare carrier host or generating
    NXDOMAIN/404 bursts before a successful media fetch is classic dead-drop check-in. For C2 this distinguishes
    a quiet covert channel from normal CDN traffic; tune thresholds to each environment''s rarity and
    failure-rate distribution. References: [Hidden and Uncontrolled, Wendzel et al](https://arxiv.org/abs/1407.2029).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateways, DNS Resolvers, Proxy Servers, Endpoints'
  range: Last 90 days, with 30-day rolling destination baselines
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per dst over 30d: conn_count, uniq_src, total_bytes, fails = count(conn_state IN [S0,REJ,RSTO]
      OR proxy_status>=400); rarity = 1/(conn_count+1); fail_ratio = fails/(conn_count+fails); ALERT WHERE
      rarity>0.95 AND dst IN cti_watchlist; ESCALATE WHERE orig_bytes>resp_bytes OR mime LIKE ''image/%''
      OR fail_ratio>p95.'
- question: Are hosts resolving algorithmically suspicious or low-reputation domains that a trained classifier
    scores as likely steganography C2, and do those same hosts transfer media files externally within
    minutes of the lookup?
  context: 'When destinations are not yet on any block list, a supervised classifier can flag suspicious
    naming. Train an XGBoost model on DNS features (domain_length, subdomain_count, Shannon entropy, vowel/consonant
    ratio, digit_ratio, TLD_category, WHOIS domain_age_days, 2-4-gram frequencies, and per-host NXDOMAIN_rate)
    using benign and known-malicious labels, then score names from dns.log. Alert when probability > 0.85
    AND the querying host transfers image/media files externally within a 10-minute window, which fuses
    the naming signal with the carrier-file behavior that defines this technique. Surface the top-3 SHAP
    features (e.g., entropy, NXDOMAIN_rate, domain_age) in the alert so the analyst can quickly judge
    plausibility. Keep the deterministic IOC/hash rule as the always-on floor beneath this probabilistic
    layer. References: [SHAP Integration in IDS, Frontiers AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateways, DNS Resolvers, Proxy Servers, Endpoints'
  range: Last 90 days, with 10-minute DNS-to-file-transfer correlation
  queries:
  - technology: ML/Classifier pseudocode
    query: 'feats = extract(dns.log: len, subdomains, entropy, vc_ratio, digit_ratio, tld_cat, whois_age,
      ngrams, nxdomain_rate); p = xgboost.predict(feats); ALERT WHERE p>0.85 AND EXISTS files.log transfer(mime
      LIKE ''image/%'' OR ''video/%'' OR ''audio/%'') BY same_host WITHIN 10m; INCLUDE top3 SHAP features.'
- question: Do files extracted from network traffic contain steganography tool signatures, watermark magic
    bytes, or EXIF/XMP metadata keywords characteristic of embedding tools?
  context: 'Tool watermarks and first-order artifacts are deterministic anchors that even adaptive embedders
    often leave behind. Deploy YARA rules against files carved by Zeek that target steganography strings
    (''OpenStego'', ''steghide'', ''F5 algorithm'', ''outguess''), known magic bytes/watermarks, and metadata
    keywords in EXIF/XMP (''Steg'', ''Hidden'', ''Encrypted''). Configure extraction for image/*, audio/*,
    video/*, and application/pdf, and weight alert severity by file size since larger carriers can hold
    more hidden payload. For the Command and Control mission, a signature hit on a transferred carrier
    strongly implies a covert channel; a clean scan does not clear the file because custom or modified
    tooling may evade string matches, so pair this with the statistical and ML layers below. References:
    [Defending Against Statistical Steganalysis, Provos](https://www.usenix.org/legacy/event/sec01/full_papers/provos/provos.pdf).'
  answer_sources:
  - Zeek files.log
  - 'NAI: Network Security Monitoring (NSM) Sensor Grid, Internet Gateways, File Servers'
  range: Last 90 days
  queries:
  - technology: YARA/pseudocode
    query: 'FOR f IN zeek_extracted WHERE mime IN [image/*,audio/*,video/*,application/pdf]: yara_scan(f,
      rules=[steg_tool_strings, watermark_magic, exif_xmp_keywords]); ALERT severity=weight(file_size)
      ON match; RECORD matched_rule, offset, src, dst.'
- question: Do any carrier files show metadata fields that are abnormally long, non-standard, or high-entropy,
    or do their pixel/DCT histograms show chi-square evidence of LSB embedding?
  context: 'Embedding frequently distorts metadata and pixel statistics. Parse metadata with ExifTool
    to build 30-day baselines per MIME type and field (mean_field_length, stddev, percentile_95), and
    alert when fields exceed percentile_99, contain non-standard custom fields outside the top 100, or
    exhibit entropy > 6.5 (for example a JPEG Comment > 500 characters or PNG iTXt > 2 KB). In parallel
    run the chi-square Pairs-of-Values goodness-of-fit test on pixel/DCT histograms, because LSB replacement
    equalizes adjacent value pairs, and alert when the embedding probability exceeds a calibrated threshold
    (e.g., p > 0.5 over a contiguous region). Track payload-bytes per carrier (Volume) and carriers-per-host-per-hour
    (Frequency) as physical signals. In the C2 context, abnormal metadata plus histogram equalization
    is a strong indication a benign-looking media file is acting as a covert message carrier. References:
    [Attacks on Steganographic Systems, Westfeld and Pfitzmann](https://link.springer.com/chapter/10.1007/10719724_5).'
  answer_sources:
  - Zeek files.log
  - 'NAI: Network Security Monitoring (NSM) Sensor Grid, Internet Gateways, File Servers'
  range: Last 90 days, with 30-day per-MIME metadata baselines
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per mime,field over 30d: mean_len, std, p95, p99; ALERT WHERE field_len>p99 OR field
      NOT IN top100 OR field_entropy>6.5; chi2 = pairs_of_values_test(histogram); ALERT WHERE chi2_embed_prob>0.5;
      EMIT payload_bytes(Volume), carriers_per_host_hr(Frequency).'
- question: Does a steganalysis model classify any transferred image, document, or text carrier as likely
    containing hidden data based on structural and residual features?
  context: 'Adaptive embedders (WOW, S-UNIWARD, HUGO, HILL) defeat simple signatures, so use learned steganalysis.
    For images prefer a CNN steganalyzer (Yedroudj-Net style) with an SRM high-pass filter bank, truncated
    activation, and batch normalization, trained on BOSSbase/BOWS2; keep Spatial Rich Models + Ensemble
    Classifier as a handcrafted fallback and select per-image between CNN and SRM+EC. For document or
    text carriers, detect generation-based linguistic steganography with an attentional LSTM-CNN. Alert
    when steg probability > 0.80 and surface the top-3 contributing features (residual energy, LSB entropy,
    segment-size ratio) for triage. For Command and Control this catches sophisticated operators whose
    carriers pass signature and metadata checks; a high score on an externally transferred carrier warrants
    carving and offline forensic confirmation. References: [Yedroudj-Net, Yedroudj et al](https://arxiv.org/abs/1803.00407),
    [Couchot et al](https://arxiv.org/abs/1612.08882), [Text Steganalysis with Attentional LSTM-CNN, Bao
    et al](https://arxiv.org/abs/1912.12871), [SHAP Integration in IDS, Frontiers AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek files.log
  - 'NAI: Network Security Monitoring (NSM) Sensor Grid, Internet Gateways, File Servers'
  range: Last 90 days
  queries:
  - technology: ML/Steganalysis pseudocode
    query: 'FOR carrier IN zeek_extracted: IF image: p = select(CNN_SRM_steganalyzer, SRM_EC)(carrier);
      ELIF text/doc: p = lstm_cnn_linguistic(carrier); ALERT WHERE p>0.80; INCLUDE top3 features(residual_energy,
      lsb_entropy, seg_ratio).'
- question: Do any transferred files that match known standardized assets (logos, favicons, UI elements,
    templates) deviate from their expected size or known-good hash, and were they sent to unexpected external
    destinations?
  context: 'Covert carriers often reuse innocuous-looking standardized assets, so a size-inflated or hash-mismatched
    copy of a known asset is a deterministic embedding indicator. Maintain an inventory of standardized
    assets with expected file sizes and exact hashes, and alert when extracted files matching known patterns
    deviate by more than 15% in size OR mismatch the known-good hash (for example favicon.ico expected
    ~16 KB, alert if outside 13.6-18.4 KB). Cross-reference unexpected sizes with external destinations
    in conn.log to find where the modified asset went. For C2, a logo or favicon that is the wrong size
    and is being uploaded to an external host is a high-confidence covert-channel lead; matching files
    at the expected size and hash can be quickly cleared. References: [Hidden and Uncontrolled, Wendzel
    et al](https://arxiv.org/abs/1407.2029).'
  answer_sources:
  - Zeek files.log
  - 'NAI: Internet Gateways, Web Application Servers, Content Delivery Networks (CDNs)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR f IN files.log WHERE pattern_match(f, known_asset_inventory): expected = inventory[f.pattern];
      ALERT WHERE abs(f.size-expected.size)/expected.size>0.15 OR f.hash!=expected.hash; JOIN conn.log
      -> RETURN external_dst, f.size, expected.size, f.hash.'
- question: Which transferred media files are statistical size outliers for their MIME type, particularly
    high-entropy files sent externally during non-business hours?
  context: 'Embedding inflates carrier size in ways that deviate from a normal size distribution. For
    each MIME type in files.log keep rolling 30-day stats (mean_size, stddev_size, Q1, Q3, IQR), compute
    a z_score and IQR outlier flag per new file, and alert when z_score > 3.5 or the IQR flag is set,
    especially for image/jpeg, image/png, and image/gif transferred externally during non-business hours.
    Pair size with carrier entropy: a file that is both a size outlier AND exhibits payload entropy >
    7.0 (encrypted/compressed content typically exceeds ~7.2) is high-confidence. Track bytes-over-expected
    (Volume) and count failed/truncated transfers (conn_state, missing_bytes>0) as a distinct State signal.
    For Command and Control this isolates oversized carriers likely padded with hidden payload from normal
    media of expected size. References: [Baseline Payload Entropy Values, Future Internet 2024](https://www.mdpi.com/1999-5903/16/12/470),
    [Using Entropy Analysis, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Zeek files.log
  - 'NAI: Internet Gateways, Web Application Servers, Content Delivery Networks (CDNs)'
  range: Last 90 days, with 30-day per-MIME size baselines and off-hours weighting
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per mime over 30d: mean, std, Q1, Q3, IQR; z = (size-mean)/std; iqr_flag = size>Q3+1.5*IQR;
      ALERT WHERE (z>3.5 OR iqr_flag) AND mime LIKE ''image/%'' AND external AND off_hours; ESCALATE WHERE
      payload_entropy>7.0; EMIT bytes_over_expected, truncated(missing_bytes>0).'
- question: Does media transfer volume exceed forecasted seasonal levels, or do per-host carrier profiles
    look like rare embedding-consistent outliers under unsupervised modeling?
  context: 'Sustained covert exfiltration via carriers shows up as volume regime shifts and rare host
    profiles. Aggregate hourly transfer volume per MIME category (image/*, audio/*, video/*) and train
    SARIMA (Prophet fallback) using daily/weekly seasonality; generate 95% prediction intervals and alert
    when actual volume exceeds 1.5x the upper interval, supplemented with PELT change-point detection
    for sudden regime shifts. In parallel run an Isolation Forest over per-host carrier features (file_count,
    total_bytes, size_zscore, mean_entropy, off_hours_ratio) to flag rare embedding-consistent profiles
    unsupervised, and include the top contributing features in the alert. For C2, a host whose media output
    suddenly breaks its forecast or whose carrier profile is an unsupervised outlier merits investigation
    even without any single deterministic hit. References: [Isolation Forest, Liu et al](https://doi.org/10.1145/2133360.2133363),
    [SHAP Integration in IDS, Frontiers AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek files.log
  - 'NAI: Internet Gateways, Web Application Servers, Content Delivery Networks (CDNs)'
  range: Last 90 days, with hourly aggregation and 95% forecast intervals
  queries:
  - technology: ML/Forecast pseudocode
    query: vol = hourly_volume per mime_cat; model = SARIMA(vol, seasonality=daily+weekly); ALERT WHERE
      actual > 1.5*forecast_upper95 OR PELT_changepoint(vol); iso = IsolationForest(per_host[file_count,total_bytes,size_zscore,mean_entropy,off_hours_ratio]);
      ALERT WHERE iso.anomaly; INCLUDE top features.
- question: Is any process that does not normally make network connections (e.g., mspaint.exe, notepad.exe,
    calc.exe) opening an external socket and moving media-sized data, or repeatedly being blocked while
    trying?
  context: 'GUI or utility applications that suddenly speak to the internet are a classic sign of injected
    or misused tooling moving carrier files. Maintain a curated allowlist of network-capable processes
    (browsers, email clients, legitimate updaters), correlate Windows Event ID 4688 with Event ID 5156
    or Sysmon Event ID 3 within five seconds, and alert when a non-allowlisted process opens an external
    connection with inferred file transfer (conn.log orig_bytes or resp_bytes > 10 KB). Prioritize GUI
    apps such as mspaint.exe/notepad.exe/calc.exe making non-HTTP/S calls. Also alert on repeated blocked/denied
    outbound attempts (Event ID 5157) by such processes, a State signal of dead-drop polling. For Command
    and Control this directly catches the host-side mechanism delivering steganographic carriers, which
    a network-only view would miss. References: [Hidden and Uncontrolled, Wendzel et al](https://arxiv.org/abs/1407.2029).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User Workstations, Terminal Servers, Virtual Desktop Infrastructure (VDI) Environments'
  range: Last 90 days, with 5-second process-to-network correlation
  queries:
  - technology: SIEM/Rule pseudocode
    query: JOIN EID4688 TO (EID5156 OR Sysmon3) ON pid WITHIN 5s; ALERT WHERE proc NOT IN net_allowlist
      AND external AND (orig_bytes>10KB OR resp_bytes>10KB); PRIORITIZE proc IN [mspaint.exe,notepad.exe,calc.exe]
      AND proto NOT IN [http,https]; ALERT WHERE count(EID5157 deny by proc) high (dead-drop polling).
- question: Which rare processes (bottom percentile of network activity) are initiating connections that
    correlate with media file transfers to newly registered domains?
  context: Frequency baselining catches subtle abuse where a rarely-networking process is the carrier
    mover. Build a 60-day baseline per process_name for network_connection_frequency (connection_count/total_endpoint_count),
    flag the bottom 1st percentile rare processes, and alert when those rare GUI apps initiate connections
    correlating with files.log transfers within +/-30 seconds and target newly registered domains (< 30
    days). Compute confidence = (1 - frequency_percentile) x file_transfer_size_MB. Track per-process
    Frequency (connections/min) and Volume (bytes/connection), and profile each process's blocked-connection
    ratio (Event ID 5157 / total) as a distinct failure signal. For C2 this elevates the quiet, infrequent
    process-network pairings that align with carrier transfers to fresh infrastructure above ordinary
    noise; derive percentile cutoffs per environment.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User Workstations, Terminal Servers, Virtual Desktop Infrastructure (VDI) Environments'
  range: Last 90 days, with 60-day per-process baselines and 30-second transfer correlation
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per proc over 60d: net_freq = conn_count/total_endpoints; rare = proc IN bottom_1pct(net_freq);
      ALERT WHERE rare AND EXISTS files.log transfer WITHIN 30s AND dst_domain_age<30d; score = (1-freq_pct)*transfer_MB;
      EMIT conns_per_min, bytes_per_conn, blocked_ratio(EID5157).'
- question: Has any endpoint drifted into an anomalous behavioral cluster characterized by unusual process-network-file
    patterns consistent with steganographic carrier movement?
  context: 'Multivariate behavioral modeling catches compromise that no single rule flags. Extract 24-hour
    endpoint feature vectors (process_diversity, network_connection_count, top destination ports one-hot,
    bytes sent/received, file_transfer_count, rare_process_count, blocked_connection_count) and cluster
    with DBSCAN (eps=0.3, min_samples=5) into typical endpoint roles; alert when an endpoint transitions
    into sparse clusters typified by anomalous process-network behavior. Complement with an Isolation
    Forest for unsupervised outlier scoring of the same vectors, validate against other known-compromised
    hosts, and surface the top-3 contributing features. For Command and Control, an endpoint that abruptly
    leaves its normal behavioral role and lands in a sparse cluster with elevated file transfers and rare-process
    activity is a strong investigative lead, even absent any deterministic carrier match. References:
    [Isolation Forest, Liu et al](https://doi.org/10.1145/2133360.2133363), [SHAP Integration in IDS,
    Frontiers AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User Workstations, Terminal Servers, Virtual Desktop Infrastructure (VDI) Environments'
  range: Last 90 days, with 24-hour endpoint feature windows
  queries:
  - technology: ML/Clustering pseudocode
    query: vec = per_endpoint_24h[proc_diversity, conn_count, dst_port_onehot, bytes_io, file_xfer_count,
      rare_proc_count, blocked_count]; labels = DBSCAN(vec, eps=0.3, min_samples=5); ALERT WHERE endpoint
      moves into sparse/anomalous cluster; iso = IsolationForest(vec); ALERT WHERE iso.outlier; INCLUDE
      top3 features.
- question: Do the LSB planes of extracted images contain embedded file magic numbers (ZIP, PDF, PE, ELF,
    RAR) indicating an appended or hidden archive or executable?
  context: 'This is the deterministic floor for LSB steganography and survives even when statistical tests
    are evaded. Extract image files from files.log, derive LSB bitstreams for all color channels, and
    scan for embedded magic numbers: ZIP (50 4B 03 04), PDF (25 50 44 46), PE (4D 5A), ELF (7F 45 4C 46),
    and RAR (52 61 72 21). Alert on any match and record the embedded file offset for forensic follow-up.
    For Command and Control this catches the very common case of an archive or payload concealed inside
    an image used as a dead drop; a positive result is high-confidence and immediately actionable, while
    a negative result still leaves the statistical and CNN layers in play for subtler embedding. References:
    [Defending Against Statistical Steganalysis, Provos](https://www.usenix.org/legacy/event/sec01/full_papers/provos/provos.pdf).'
  answer_sources:
  - Zeek files.log
  - 'NAI: Network Security Monitoring (NSM) Sensor Grid, Data Loss Prevention (DLP) Systems'
  range: Last 90 days
  queries:
  - technology: NSM/File-carving pseudocode
    query: 'FOR img IN files.log WHERE mime LIKE ''image/%'': lsb = extract_lsb_planes(img, all_channels);
      FOR sig IN [ZIP 504B0304, PDF 25504446, PE 4D5A, ELF 7F454C46, RAR 52617221]: IF sig IN lsb: ALERT;
      RECORD offset, img, src, dst.'
- question: Do extracted images show chi-square or fused-estimator evidence of LSB embedding, such as
    a random LSB plane while higher-order planes remain natural, or near-maximal LSB entropy?
  context: 'Targeted LSB embedding randomizes the lowest bit plane while leaving higher-order planes intact,
    a signature multiple proven estimators detect. For each extracted image, run chi-square goodness-of-fit
    tests on LSB planes (observed byte histogram vs uniform/Pairs-of-Values expectation) and on higher-order
    bit planes, and alert when the LSB plane appears random while higher planes remain non-random. For
    robustness, fuse Sample Pairs, RS analysis, Chi-Square, and Primary Sets into a single ROC-calibrated
    score (StegExpose-style) and alert above the tuned threshold; also flag LSB-plane Shannon entropy
    > 7.9 (near-maximal). Record estimated embedded payload bytes (Volume) and flagged-carriers-per-host-per-hour
    (Frequency). For C2, fused statistical evidence on an externally transferred image strongly supports
    covert use even when no tool signature is present. References: [Attacks on Steganographic Systems,
    Westfeld and Pfitzmann](https://link.springer.com/chapter/10.1007/10719724_5), [StegExpose, Boehm](https://arxiv.org/abs/1410.6656),
    [Using Entropy Analysis, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Zeek files.log
  - 'NAI: Network Security Monitoring (NSM) Sensor Grid, Data Loss Prevention (DLP) Systems'
  range: Last 90 days
  queries:
  - technology: NSM/Steganalysis pseudocode
    query: 'FOR img IN files.log WHERE mime LIKE ''image/%'': chi2_lsb = chi_square(lsb_hist); chi2_high
      = chi_square(high_bit_hist); fused = roc_calibrated(SamplePairs, RS, ChiSquare, PrimarySets); ALERT
      WHERE (chi2_lsb~random AND chi2_high~natural) OR fused>threshold OR lsb_entropy>7.9; RECORD est_payload_bytes,
      carriers_per_host_hr.'
- question: Does a pre-trained CNN steganalyzer score any extracted image as likely containing hidden
    data, especially for off-hours or repeated external transfers?
  context: 'Deep steganalysis catches modern content-adaptive embedding that defeats handcrafted tests.
    Run a pre-trained CNN steganalyzer (Yedroudj-Net / Xu-Net / Ye-Net / SRNet) on extracted images (grayscale
    or per color channel), built with an SRM high-pass filter bank, truncated activation, and batch normalization,
    trained on BOSSbase/BOWS2 with WOW, S-UNIWARD, HUGO, and HILL embedding. Keep handcrafted SRM + Ensemble
    Classifier as a parallel fallback and select per-image between CNN and SRM+EC. Alert on probability(stego)
    > 0.75, escalating for external sources, off-hours transfers, or repeated flags in short intervals,
    and surface the top-3 contributing features (residual energy, LSB entropy, filter response). For Command
    and Control, a high CNN score on images repeatedly leaving the environment off-hours is a strong indicator
    of an automated carrier-based covert channel and should trigger carving and deeper forensic review.
    References: [Yedroudj-Net, Yedroudj et al](https://arxiv.org/abs/1803.00407), [Deep Learning in steganography
    and steganalysis, Chaumont](https://arxiv.org/abs/1904.01444), [Couchot et al](https://arxiv.org/abs/1612.08882),
    [SHAP Integration in IDS, Frontiers AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek files.log
