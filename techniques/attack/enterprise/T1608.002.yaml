    Azure Activity Logs) show suspicious S3 bucket creation, Azure Blob storage uploads, or changes to
    access permissions on cloud storage that align with adversary TTPs for staging offensive tools. This
    Symbolic Logic approach works as follows: Alert on the exact control-plane event set used to expose
    staging buckets, per the [SigmaHQ AWS S3 Data Management Tampering rule](https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/aws/cloudtrail/aws_s3_data_management_tampering.yml):
    PutBucketPolicy/PutBucketAcl granting AllUsers/AuthenticatedUsers read, PutBucketWebsite (static-site
    hosting), DeleteBucketPolicy, PutBucketReplication, and PutObject of executable/archive content to
    a bucket created in the last 7 days. Equivalent Azure (set blob container public access / SAS token
    issuance) and GCP (storage.setIamPolicy with allUsers) events. Cross-reference bucket/account names
    against adversary-infrastructure intel. Keep as deterministic high-priority rules. A positive result
    -- a deterministic rule match, a statistical outlier, or a model alert -- indicates probable adversary
    tool staging; pivot to the destination infrastructure (IP, domain, bucket, repo, or certificate),
    enrich against threat intelligence, capture the hosted artifact''s hash/content, and correlate with
    any inbound resolution, download, or Ingress Tool Transfer attempts from your environment to scope
    exposure and pre-position blocks. A negative result helps rule out this particular staging vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy or previously unseen adversary infrastructure.'
