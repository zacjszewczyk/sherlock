  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Symbolic (IOC + content match) (Symbolic Logic)

      source IN [Zeek http.log, Zeek files.log, Zeek ssl.log, Firewall Logs, Internet Scan: Response Content,
      Threat Intelligence Feeds]

      | approach: Match Zeek files.log SHA256/MD5 and http.log destination IP/Host against threat-intel
      and YARA payload signatures for offensive tooling, e.g. the [Cobalt Strike YARA signature base](https://github.com/Neo23x0/signature-base/blob/master/yara/apt_cobaltstrike.yar)
      and [Malleable C2 URI/header regexes](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/).
      Fingerprint the staging/C2 server

      | correlate over NAI: Internet gateways, Cloud service provider APIs, Threat intelligence platforms

      | emit alert with contributing fields and entity context (dest IP/domain/bucket/repo/cert, artifact
      hash/type, JA3/JA4, threat-intel match, top contributing features)'
  - technology: Zeek/pseudocode
    query: '# Symbolic (IOC + content match) (Zeek view)

      watch http.log/files.log/ssl.log/dns.log for staging to external infrastructure

      | filter method in (PUT, POST) or large GET, or new/low-age domains, or known-tool file hashes

      | fingerprint server with JA3/JA3S/JA4S/JA4X and match payload hashes to tool signatures

      | emit candidate staging events with src, dest, host, bytes, file hash, JA3/JA4'
