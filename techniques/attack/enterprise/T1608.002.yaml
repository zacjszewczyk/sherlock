name: 'T1608.002: Upload Tool'
id: 91d7cef0-26b5-452f-88d2-ae0188fa0d9a
description: 'This playbook helps an analyst investigate whether an adversary has uploaded dual-use tools
  or offensive utilities to third-party or adversary-controlled infrastructure in preparation for operations
  against the network (MITRE ATT&CK T1608.002, Upload Tool, under Resource Development TA0042). Because
  staging usually happens outside the target''s perimeter, the hunt leans on internet-facing and externally
  observable telemetry and pursues the behavior from several complementary angles: network traffic showing
  file uploads to cloud storage, code repositories, or file-sharing platforms whose payloads match known
  offensive-tool signatures; cloud control-plane events (AWS CloudTrail, Azure Activity, GCP Audit) that
  expose newly created public buckets, blob containers, or storage permission changes used to host tooling;
  code-repository and package-registry activity (GitHub/GitLab/Bitbucket/npm/PyPI) revealing commits or
  publishes of exploit code, compiled binaries, or malicious/typosquatted packages; and DNS/TLS/certificate-transparency
  chains where newly registered domains receive certificates and then begin serving uploaded tooling.
  Detection methods combine deterministic symbolic logic (threat-intel IOC and YARA payload matching,
  JA3/JA3S/JA4S/JA4X server fingerprinting, CloudTrail/Sigma control-plane rules, typosquat and offensive-tool-name
  regex), statistical baselining (per-destination upload volume/frequency/state profiling, percentile
  and standard-deviation thresholds, composite passive-DNS risk scoring), and explainable machine learning
  (gradient-boosted/decision-tree classifiers, DBSCAN/Isolation-Forest clustering, and temporal sequence
  models with top-feature attribution), applied across Zeek http/files/ssl/dns logs, firewall and internet-scan
  data, cloud audit logs, repository audit logs, passive DNS, WHOIS, and certificate transparency, so
  the analyst can corroborate suspected tool staging against infrastructure fingerprints, hosted-artifact
  signatures, and the registration-to-upload timeline.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
