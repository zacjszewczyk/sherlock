name: 'T1001.001: Junk Data'
id: 433c6612-89bd-4d5c-9390-dff288a47f90
description: 'Investigate adversary use of junk data added to command-and-control (C2) protocols to frustrate
  decoding, deciphering, and analysis of malicious traffic. Threat actors such as SUNBURST and Cobalt
  Strike Malleable C2 prepend, append, or interleave random or meaningless filler bytes, fake headers,
  and fixed URI patterns to obfuscate their communications. This playbook helps an analyst hunt that behavior
  across network and endpoint telemetry: correlating endpoints against C2 threat-intelligence feeds, matching
  known padding byte-sequence signatures, scoring abnormal client-to-server byte ratios and inflated/uniform
  payload lengths, measuring Shannon entropy and compressibility of DNS TXT/HTTP payloads to surface incompressible
  junk filler, spotting non-allowlisted processes initiating outbound connections, and detecting padding-driven
  perturbations in encrypted TLS flow metadata that survive without decryption. It combines deterministic
  symbolic-logic floors, statistical baselining, and machine-learning anomaly detection to make junk-padded
  beacons defensible and actionable for a SOC.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command And Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any outbound connections or DNS lookups (from Zeek conn.log and dns.log) resolve to or
    contact an IP address or domain that appears on a threat-intelligence feed of known C2 infrastructure,
    and do those channels also carry junk-data artifacts such as Malleable C2 prepend/append strings,
    fake headers, or fixed URI patterns?
  context: 'This is the deterministic C2-attribution floor for the Command and Control tactic. Correlate
    Zeek connection and DNS endpoints against curated C2 intelligence feeds and raise an alert on any
    match, then layer in known junk-data fingerprints documented for Cobalt Strike Malleable C2 (prepend/append
    junk transforms, fake header ordering, fixed URI paths) and the SUNBURST padding behavior. A positive
    result is a high-confidence indication that a host is talking to attacker infrastructure that is deliberately
    obfuscating its protocol; a negative result does not clear the host, since the actor may use unflagged
    infrastructure, so this method is paired with the statistical and ML methods below. Citations: [Detecting
    Popular Cobalt Strike Malleable C2 Profile Techniques, Unit 42](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/)
    and the SUNBURST padding behavior in [SUNBURST Additional Technical Details, FireEye/Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/sunburst-additional-technical-details/).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Egress Firewalls, Internal DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: endpoints = conn.log JOIN dns.log on host; match = endpoints where (resp_h in ti_c2_ips OR
      query in ti_c2_domains); junk = payload where matches(malleable_c2_prepend_append | fake_header
      | fixed_uri); alert when match OR junk; output host, resp_h, query, matched_indicator, uri
- question: Which destinations receive outbound traffic whose client-to-server byte ratio exceeds the
    97th percentile of the per-destination baseline while having low reputation, and which flows carry
    payloads that compress poorly (gzip ratio < 1.1) indicating incompressible junk or encoded data?
  context: Junk-padded C2 inflates the data a client sends relative to what it receives, and the filler
    is typically random/encoded so it resists compression. Baseline orig/resp byte ratios per destination
    over a rolling window and flag connections above the 97th percentile toward low-reputation destinations,
    then confirm by measuring compressibility — a gzip ratio below ~1.1 means the bytes are near-incompressible,
    consistent with encrypted/encoded covert content rather than ordinary text or media. In the C2 context,
    a high-ratio, incompressible flow to an unfamiliar destination is a strong beaconing-with-padding
    signal worth escalation. Compressibility-as-covert-channel bound per [Practical Comprehensive Bounds
    on Surreptitious Communication over DNS, Born, Gustafson, Paxson](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf).
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Egress Firewalls, Internal DNS Resolvers, Web Proxies'
  range: Last 90 days; baseline over rolling 14-30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline = percentile(orig_bytes/resp_bytes by resp_h, 97); flag = conn where ratio > baseline
      AND reputation(resp_h)=low; flag = flag where gzip_ratio(payload) < 1.1; alert; output host, resp_h,
      ratio, gzip_ratio
- question: Is any host generating an abnormal volume of failed or half-open connections (Zeek conn_state
    S0/REJ/RSTO) or a high NXDOMAIN rate (>5%/min to a single registered domain), which would indicate
    beacon-discovery or junk-padded connection attempts to C2?
  context: Beaconing malware that pads or churns its C2 attempts often leaves a trail of failed/half-open
    TCP states and high DNS NXDOMAIN rates as it probes for live infrastructure. Track per-destination
    connection success/failure state from Zeek conn_state and the per-domain NXDOMAIN rate, and derive
    thresholds from a 14-30 day per-host baseline so normal retry behavior is excluded. A host producing
    many S0/REJ/RSTO junk-padded connections, or exceeding ~5% NXDOMAIN per minute to one registered domain,
    is a distinct command-and-control beacon-discovery signal that complements payload-content methods.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Egress Firewalls, Internal DNS Resolvers, Web Proxies'
  range: Last 90 days; baseline over rolling 14-30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'states = conn group by host,resp_h: count(conn_state in [S0,REJ,RSTO]); nx = dns group by
      host,domain: rate(NXDOMAIN)/min; alert when states > baseline(host) OR nx > 0.05; output host, resp_h,
      domain, fail_count, nx_rate'
- question: When a Random Forest model trained on Zeek connection features plus padding, compressibility,
    and entropy indicators scores a flow above 0.85 probability of being malicious, what are the top-3
    features (e.g., byte ratio, payload entropy, beacon coefficient-of-variation) driving that prediction?
  context: This supervised method fuses the individual junk-data signals into a single calibrated score.
    Train a Random Forest on labeled Zeek conn features enriched with padding/compressibility/entropy
    indicators and alert on predictions above 0.85, then use SHAP to surface the top-3 contributing features
    in the alert so an analyst can immediately understand and validate why the flow looks like obfuscated
    C2. A high score with byte-ratio, entropy, and beaconing-cadence among the top features is a defensible
    escalation; SHAP transparency reduces false positives by letting the analyst sanity-check the model
    against the actual flow. Feature attribution method per [SHAP Integration in IDS, Frontiers AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Egress Firewalls, Internal DNS Resolvers, Web Proxies'
  range: Last 90 days; model trained on labeled historical window
  queries:
  - technology: SIEM/ML pseudocode
    query: features = conn + [byte_ratio, gzip_ratio, payload_entropy, beacon_cv, padding_score]; p =
      RandomForest.predict_proba(features); alert when p > 0.85; explain = SHAP.top_k(features, 3); output
      host, resp_h, p, explain
- question: Does any network payload match a Zeek/Suricata/Sigma signature for known data-padding patterns
    such as null-byte runs, fixed prepend/append strings, fake header ordering, or Malleable C2 junk transforms?
  context: This is the signature-based symbolic-logic floor for detecting junk data in C2. Deploy and
    maintain community and custom signatures (SigmaHQ rules and the Unit 42 Malleable C2 regex set) for
    the concrete padding artifacts malware uses — repeating null bytes, fixed prepend/append junk strings,
    and abnormal/fake header orderings — and alert on any match. A signature hit on these patterns is
    direct evidence of protocol obfuscation; because signatures can be evaded, this method is the floor
    under the statistical and forecasting methods, but a clean, specific match remains highly actionable.
    Reuse community rules from [Sigma, SigmaHQ](https://github.com/SigmaHQ/sigma) and the Malleable C2
    regex set in [Detecting Popular Cobalt Strike Malleable C2 Profile Techniques, Unit 42](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/).
  answer_sources:
  - Zeek signatures.log
  - 'NAI: Network Security Monitoring (NSM) Sensor Grid, DMZ Packet Capture Points, SSL/TLS Decryption
    Zones'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: load signatures(null_byte_run | fixed_prepend_append | fake_header_order | malleable_c2_regex);
      alert on signatures.log match; output host, resp_h, sig_id, matched_bytes
- question: For each padding signature, are payload lengths exceeding the 95th percentile of their baseline,
    or are match frequencies rising more than 3 standard deviations, indicating the abnormally uniform
    inflated lengths characteristic of padded C2?
  context: Padded C2 traffic tends to produce abnormally uniform, inflated payload lengths and bursts
    of signature matches. Baseline per-signature payload lengths and match frequencies, then flag lengths
    above the 95th percentile or match-frequency increases beyond 3σ. The uniformity and inflation of
    packet sizes is a packet-size time-series feature that distinguishes mechanically padded beacons from
    naturally variable legitimate traffic; a sudden 3σ surge in a specific padding signature toward particular
    destinations indicates an active, obfuscated C2 channel worth triage. Packet-size time-series features
    per [Classification of Network Traffic Based on Single Flow Time Series Analysis, Koumar et al](https://dl.acm.org/doi/abs/10.5555/3581644.3581681).
  answer_sources:
  - Zeek signatures.log
  - 'NAI: Network Security Monitoring (NSM) Sensor Grid, DMZ Packet Capture Points, SSL/TLS Decryption
    Zones'
  range: Last 90 days; baseline over rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for sig in signatures: len_p95 = percentile(payload_len[sig],95); freq_mu,freq_sd = stats(match_count_per_day[sig]);
      alert when payload_len > len_p95 OR match_count > freq_mu + 3*freq_sd; output sig, host, resp_h,
      payload_len, match_count'
- question: When daily signature-match volumes are forecast with ARIMA/Prophet, are there surges greater
    than 2 standard deviations above the prediction, and which signatures and destinations are contributing
    to the surge?
  context: Time-series forecasting catches gradual or sudden campaign-driven changes in junk-data signature
    activity that static thresholds miss. Forecast daily match volumes per signature using ARIMA or Prophet
    and alert when observed volume exceeds the forecast by more than 2σ, reporting the contributing signatures
    and destination IPs/domains in the alert. In the C2 context, an unexplained surge in padding-signature
    matches can mark the onset of a new obfuscated C2 campaign or a re-tooled implant; the contributing-destination
    detail lets analysts pivot directly to the suspect hosts.
  answer_sources:
  - Zeek signatures.log
  - 'NAI: Network Security Monitoring (NSM) Sensor Grid, DMZ Packet Capture Points, SSL/TLS Decryption
    Zones'
  range: Last 90 days; forecast trained on >=60 days of history
  queries:
  - technology: SIEM/ML pseudocode
    query: model = Prophet/ARIMA.fit(daily_match_volume per sig); yhat,sigma = model.predict(today); alert
      when observed > yhat + 2*sigma; output sig, observed, yhat, top_destinations
- question: Are there Zeek conn.log flows with an orig_bytes/resp_bytes ratio of 10 or greater (excluding
    allowlisted destinations), and is the severity elevated when the flow uses a non-standard port or
    has a long duration?
  context: This deterministic ratio threshold is the floor for spotting junk-data inflation of C2 payloads.
    A client sending at least 10x more bytes than it receives, to a non-allowlisted destination, is anomalous
    for most legitimate client-server interactions and is consistent with padded outbound C2 or staging.
    Keep the >=10 ratio as the hard floor and uplift severity when the connection also uses a non-standard
    port or runs unusually long, both of which add to the suspicion that the channel is an obfuscated
    command-and-control link rather than ordinary traffic.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway, Application Server Subnets, Database Server Subnets, Egress Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: alert = conn where (orig_bytes/resp_bytes) >= 10 AND resp_h not in allowlist; severity += 1
      if port not in standard_ports; severity += 1 if duration > p90(duration); output host, resp_h, ratio,
      port, duration
- question: Per destination port, which connections exceed mean + 3.5*stddev of the byte ratio within
    the 90th duration percentile, and do repeated flows to the same destination also show low data-size
    dispersion (low coefficient of variation) consistent with consistently padded beacons?
  context: Static thresholds miss padding that is large relative to a particular protocol but small in
    absolute terms, so baseline the orig/resp byte ratio per destination port and flag connections beyond
    mean + 3.5σ within the 90th duration percentile. Then combine with the coefficient of variation of
    payload sizes across repeated flows to the same destination — a low CV (near-constant volume) across
    many connections is the hallmark of a mechanically padded beacon, as characterized by tools like RITA.
    In the C2 context, a per-port outlier ratio plus near-constant repeated volume strongly indicates
    an automated, obfuscated beacon. Consistently-padded-beacon characterization per [RITA, Active Countermeasures](https://github.com/activecm/rita).
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway, Application Server Subnets, Database Server Subnets, Egress Firewalls'
  range: Last 90 days; baseline over rolling 14-30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for port: mu,sd = stats(ratio by port); flag = conn where ratio > mu + 3.5*sd AND duration
      > p90(duration); cv = stddev(orig_bytes)/mean(orig_bytes) per (host,resp_h); alert when flag AND
      cv < threshold; output host, resp_h, port, ratio, cv'
- question: For each source-destination pair, is the connection cadence highly regular (inter-arrival
    coefficient of variation < 0.1) and the payload volume near-constant, which together form the volume-plus-frequency
    signature of a junk-padded beacon?
  context: Beaconing C2 reveals itself through regularity in both timing and size. For each src-dst pair
    compute connections per minute and the coefficient of variation of inter-arrival times, and flag low-jitter
    cadence (CV < 0.1) combined with near-constant payload volume. Junk padding is often used precisely
    to keep payload sizes uniform, so the conjunction of low timing jitter and low size variance is a
    distinctive beacon fingerprint. Derive per-environment thresholds from a 14-day baseline to avoid
    flagging legitimate periodic services; a confirmed low-jitter, constant-volume pattern to an unfamiliar
    destination warrants escalation as obfuscated command-and-control.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway, Application Server Subnets, Database Server Subnets, Egress Firewalls'
  range: Last 90 days; baseline over rolling 14 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for (host,resp_h): iat_cv = cv(inter_arrival_times); vol_cv = cv(orig_bytes); rate = count/min;
      alert when iat_cv < 0.1 AND vol_cv < threshold; output host, resp_h, rate, iat_cv, vol_cv'
- question: When DBSCAN or Isolation Forest is applied to normalized Zeek connection features, which outlier
    flows have orig_bytes/resp_bytes greater than 5, and what are the top-3 features driving each flow's
    outlier score?
  context: Unsupervised outlier detection finds anomalous padded flows without needing labels. Apply DBSCAN
    or Isolation Forest to normalized Zeek conn features and alert on outliers that also carry an orig/resp
    ratio above 5; Isolation Forest in particular gives low-latency, label-free scoring suitable for high-volume
    network telemetry. The alert must list the top-3 features driving the outlier score so the analyst
    can confirm whether the anomaly is explained by junk-data indicators (byte ratio, size dispersion,
    duration) rather than benign rare behavior. A high-ratio outlier with padding-consistent features
    is a strong candidate for obfuscated C2. Isolation Forest gives low-latency, label-free scoring per
    [Isolation Forest vs. Autoencoders, Ramaswamy & Palanisamy](https://ieeexplore.ieee.org/document/10143005/).
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway, Application Server Subnets, Database Server Subnets, Egress Firewalls'
  range: Last 90 days; model on rolling 30-day feature window
  queries:
  - technology: SIEM/ML pseudocode
    query: X = normalize(conn_features); scores = IsolationForest.fit_predict(X); outliers = X where score=anomaly
      AND orig_bytes/resp_bytes > 5; explain = top_k_features(outlier,3); output host, resp_h, ratio,
      score, explain
- question: Do any DNS TXT answers have a Shannon entropy greater than 4.0 from a domain not on the allowlist,
    especially when the answer length exceeds 200 characters, indicating randomized junk filler or encoded
    C2?
  context: DNS TXT records are a common covert channel, and junk/encoded payloads raise their character-distribution
    entropy well above that of legitimate TXT data. Compute Shannon entropy for DNS TXT answers and alert
    when entropy exceeds 4.0 for a non-allowlisted domain, with extra weight when the answer is longer
    than ~200 characters. Established entropy bands and per-service baselines distinguish legitimate compressed/encoded
    TXT (e.g., SPF/DKIM) from anomalous high-entropy filler. In the C2 context, a long, high-entropy TXT
    answer to an unfamiliar domain is a defensible indicator of encoded command-and-control or junk obfuscation.
    Entropy bands follow [Using Entropy Analysis to Find Encrypted and Packed Malware, Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989)
    and per-service baselines in [Baseline Payload Entropy Values for Common Internet Services, Future
    Internet 2024](https://www.mdpi.com/1999-5903/16/12/470).
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internal DNS Resolvers, Web Proxies, Network Taps with SSL/TLS decryption'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'for ans in dns.log where qtype=TXT: H = shannon_entropy(answer); alert when H > 4.0 AND domain
      not in allowlist; severity += 1 if len(answer) > 200; output host, domain, H, len(answer)'
- question: Which HTTP POST payloads have entropy above the 99th percentile of their per-domain baseline
    or above 7.5 combined with unusual user agents, and does KL divergence against the legitimate per-field
    character distribution confirm randomized junk that defeats raw entropy?
  context: HTTP POST bodies carrying padded or encoded C2 deviate from the character distribution of legitimate
    traffic to the same domain. Baseline POST payload entropy per domain and flag requests above the 99th
    percentile or above 7.5, especially when paired with anomalous user agents. Because well-formed encoded
    junk can mimic high entropy without being obviously malicious, also compute KL divergence between
    the observed per-field character distribution and the legitimate baseline to catch randomized filler
    that raw entropy alone would miss. A high-divergence, high-entropy POST with an odd user agent is
    a strong sign of obfuscated command-and-control exfiltration or beaconing. KL-divergence approach
    to catch randomized junk that defeats raw entropy per [Using Entropy in Threat Hunting, Red Canary](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internal DNS Resolvers, Web Proxies, Network Taps with SSL/TLS decryption'
  range: Last 90 days; baseline over rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for domain: p99 = percentile(post_entropy[domain],99); flag = http where method=POST AND (entropy
      > p99 OR entropy > 7.5) AND user_agent rare; kl = KL_divergence(observed_char_dist, baseline_char_dist[domain]);
      alert when flag AND kl > threshold; output host, domain, entropy, kl, user_agent'
- question: Per network field, which payloads are near-incompressible (gzip ratio near 1.0) yet carry
    high aggregate bytes-of-information per domain, indicating junk or encoded covert data embedded in
    DNS/HTTP fields?
  context: Surreptitious communication over DNS/HTTP can be bounded by the information content and compressibility
    of the fields it abuses. Compute per-field lossless-compression ratio and bytes-of-information; fields
    that are incompressible (gzip ratio near 1.0) but contribute high aggregate information per domain
    indicate randomized junk or encoded covert data rather than ordinary text. Combine this with stateless
    lexical features of the queried names to catch DNS exfiltration. In the command-and-control context,
    a domain whose fields are consistently incompressible and information-dense is a strong candidate
    for a junk-padded or encoded covert channel. Information-content bounds per [Practical Comprehensive
    Bounds on Surreptitious Communication over DNS, Born, Gustafson, Paxson](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf)
    and stateless lexical features in [Real-Time Detection of DNS Exfiltration, Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internal DNS Resolvers, Web Proxies, Network Taps with SSL/TLS decryption'
  range: Last 90 days; baseline over rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for field in [dns.query, dns.answer, http.body]: cr = compress_ratio(field); info = bytes_of_information(field);
      agg = sum(info) per domain; alert when cr ~ 1.0 AND agg > threshold; output host, domain, field,
      cr, agg'
- question: When an autoencoder trained on legitimate Zeek payload features reconstructs a flow with error
    greater than 3 standard deviations from the mean, what are the top-3 reconstruction-error features
    that explain the anomaly?
  context: An autoencoder learns the structure of legitimate payload features and reconstructs anomalous
    junk/encoded content poorly. Train the model on benign Zeek payload features (entropy, length, character
    distribution, compressibility) and alert when reconstruction error exceeds 3σ from the mean, reporting
    the top-3 error-contributing features via SHAP-style attribution. In the C2 context, a payload that
    the model cannot reconstruct — driven by entropy and incompressibility features — is consistent with
    randomized junk filler or encoded command-and-control content; the feature attribution lets the analyst
    verify the anomaly is padding-related rather than a benign novel service. Top-3 reconstruction-error
    feature attribution per [SHAP Integration in IDS, Frontiers AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internal DNS Resolvers, Web Proxies, Network Taps with SSL/TLS decryption'
  range: Last 90 days; model trained on benign rolling window
  queries:
  - technology: SIEM/ML pseudocode
    query: X = payload_features(dns,http); err = Autoencoder.reconstruction_error(X); mu,sd = stats(err_benign);
      alert when err > mu + 3*sd; explain = top_k_error_features(X,3); output host, domain, err, explain
- question: Which processes that are NOT on the allowlist of approved network-communicating applications
    initiate outbound external connections (joining Windows Event ID 4688 and 5156 on ProcessId), particularly
    over atypical ports?
  context: This deterministic endpoint correlation is the floor for catching unexpected programs that
    establish C2 channels. Join Windows process-creation (4688) and Windows Filtering Platform connection
    (5156) events on ProcessId, then alert when a non-allowlisted image makes an external connection,
    with added weight for atypical destination ports. A previously unseen or non-network application reaching
    out to the Internet — optionally carrying junk-padded or anomalously sized payloads — is a hallmark
    of implant-based command-and-control. The 4688/5156 join also gives the analyst the responsible image,
    parent, user, and destination for fast triage.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: User Workstations, Domain Controllers, Critical Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: p = EventID=4688; c = EventID=5156 where Direction=Outbound AND DestAddress is external; join
      p,c on ProcessId; alert when p.Image not in allowlist AND c.DestPort in atypical_ports; output host,
      Image, ParentImage, User, DestAddress, DestPort
- question: Which parent-child-port process tuples fall in the bottom 2nd percentile of rarity (especially
    those involving scripting engines or LOLBins), and do those processes also show repeated failed or
    half-open outbound connection states indicating beaconing?
  context: Rare process-network relationships expose stealthy C2 launchers. Baseline parent-child-image-port
    tuples across the environment and flag those in the bottom 2nd percentile, prioritizing tuples involving
    scripting engines (powershell, wscript, cscript) or living-off-the-land binaries that are commonly
    abused for C2. Additionally track each process's outbound connection success/failure state so repeated
    failed/half-open beacons surface as a distinct signal. In the command-and-control context, a rare
    LOLBin-to-Internet tuple that also keeps retrying half-open connections is a strong indicator of an
    obfuscated, possibly junk-padded, beacon.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: User Workstations, Domain Controllers, Critical Application Servers'
  range: Last 90 days; baseline over rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: tuples = (ParentImage, Image, DestPort); rarity = percentile_rank(count(tuples)); flag = tuples
      in bottom 2pct AND Image in [scripting_engines, lolbins]; states = count(conn_state in [failed,half_open])
      per process; alert when flag OR states > baseline; output host, ParentImage, Image, DestPort, rarity,
      states
- question: When a One-Class SVM trained on benign process-network behavior assigns a decision_function
    score below -0.5 to a process, what are the top-3 features driving that outlier classification?
  context: A One-Class SVM models the boundary of normal process-network behavior so that novel C2 launchers
    fall outside it. Train it on benign process-network features (image, parent, ports, connection counts,
    byte ratios) and alert when the decision_function drops below -0.5, surfacing the top-3 contributing
    features for triage. In the C2 context, a process whose network behavior the model judges far from
    normal — driven by features like an unusual image/port combination or an inflated byte ratio — is
    a candidate for an obfuscated command-and-control implant; the feature attribution helps the analyst
    confirm it against the actual endpoint and network evidence. Top-3 contributing-feature attribution
    per [SHAP Integration in IDS, Frontiers AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: User Workstations, Domain Controllers, Critical Application Servers'
  range: Last 90 days; model trained on benign rolling window
  queries:
  - technology: SIEM/ML pseudocode
    query: X = process_network_features(4688,5156); score = OneClassSVM.decision_function(X); alert when
      score < -0.5; explain = SHAP.top_k(X,3); output host, Image, score, explain
- question: Do any TLS sessions present JA3/JA3S fingerprints or SNI/certificate anomalies tied to known
    C2 frameworks, where TLS 1.2 handshake metadata is visible?
  context: Even when payloads are encrypted, the TLS handshake leaks fingerprints and certificate/SNI
    characteristics that map to known C2 tooling. Alert on JA3/JA3S client/server fingerprints and SNI
    or certificate anomalies (self-signed, malformed, mismatched, or known-bad) associated with C2 frameworks,
