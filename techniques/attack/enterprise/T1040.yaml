- question: 'Credential Access (TA0006) — Enforce promiscuous whitelist: For the scenario where a host
    log or EDR event indicates that a network interface entered promiscuous mode or a packet capture driver
    was enabled, and the host is not on a pre-approved list. how can an analyst apply a symbolic logic
    approach to confirm or rule out network sniffing (T1040)?'
  context: 'Tactic context: this question advances the Credential Access objective (TA0006) for Network
    Sniffing. Triggering evidence: A host log or EDR event indicates that a network interface entered
    promiscuous mode or a packet capture driver was enabled, and the host is not on a pre-approved list.
    Method (Symbolic Logic): Monitor Windows Event ID 28001/EDR, Linux syslog/auditd setifflags, and macOS
    unified logs for ''promiscuous mode enabled'' or BPF/NPF driver loads, and alert when a host not on
    the privileged capture whitelist toggles promiscuous mode; rule-based first-party detection deployable
    via [BZAR](https://github.com/mitre-attack/bzar) and aligned with MITM-precursor artifacts in [A Review
    of Man-in-the-Middle Attacks](https://arxiv.org/abs/1504.02115). A positive result indicates a host,
    account, or cloud principal is likely sniffing traffic in support of credential access; corroborate
    with change tickets and the authorized network-monitoring allowlist before escalating, because legitimate
    IT, network-operations, and security tooling can generate similar artifacts. A negative result reduces
    but does not eliminate suspicion, so combine it with the other detection methods defined for this
    evidence.'
  answer_sources:
  - Windows Event ID 4688
  - Linux syslog
  - EDR telemetry
  - 'NAI: All endpoint and server hosts (physical and virtual), Virtualization hosts (Hyper-V/ESXi), Container
    orchestration nodes.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |2-
        source IN (WinEventLog EventCode=28001, EDR, Linux syslog/auditd setifflags, macos:unifiedlog)
        | where event MATCHES "promiscuous mode enabled" OR driver IN (BPF, NPF)
        | where host NOT IN privileged_capture_whitelist
        | alert "Promiscuous mode / capture driver on non-approved host"
- question: 'Credential Access (TA0006) — Track enterprise promiscuous spikes: For the scenario where
    a host log or EDR event indicates that a network interface entered promiscuous mode or a packet capture
    driver was enabled, and the host is not on a pre-approved list. how can an analyst apply a statistical
    method approach to confirm or rule out network sniffing (T1040)?'
