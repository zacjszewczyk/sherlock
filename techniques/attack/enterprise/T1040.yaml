    outside them, reporting the nearest-cluster distance and top distinguishing tokens; unsupervised anomaly
    framing per [A Hybrid Deep Learning Anomaly Detection Framework for Intrusion Detection](https://arxiv.org/abs/2212.00966).
    A positive result indicates a host, account, or cloud principal is likely sniffing traffic in support
    of credential access; corroborate with change tickets and the authorized network-monitoring allowlist
    before escalating, because legitimate IT, network-operations, and security tooling can generate similar
    artifacts. A negative result reduces but does not eliminate suspicion, so combine it with the other
    detection methods defined for this evidence.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, IT Administrator Workstations, Servers hosting diagnostic tools, and any
    endpoint not explicitly authorized for network analysis.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |2-
        X = vectorize(capture_tool_cmdline_args)
        labels = DBSCAN(eps, min_samples).fit_predict(X)
        for e where labels[e] == -1:  /* outside normal admin clusters */
            emit_alert(host, nearest_cluster_distance, top_tokens(e))
- question: 'Credential Access (TA0006) — Rule on MAC/IP inconsistencies: For the scenario where a single
    host''s network traffic exhibits characteristics of a man-in-the-middle attack, such as issuing a
    high volume of gratuitous ARP packets for multiple IP addresses or responding to LLMNR/NBT-NS queries
    for which it is not authoritative. how can an analyst apply a symbolic logic approach to confirm or
    rule out network sniffing (T1040)?'
  context: 'Tactic context: this question advances the Credential Access objective (TA0006) for Network
    Sniffing. Triggering evidence: A single host''s network traffic exhibits characteristics of a man-in-the-middle
    attack, such as issuing a high volume of gratuitous ARP packets for multiple IP addresses or responding
    to LLMNR/NBT-NS queries for which it is not authoritative. Method (Symbolic Logic): Alert when Zeek
    arp.log shows one MAC mapped to multiple IPs (or one IP to multiple MACs) within 60s, when unsolicited/gratuitous
    ARP replies arrive without a matching request, or when Zeek dns.log records a non-authoritative host
    answering many LLMNR/NBT-NS/DNS queries. Validate suspect IP-MAC pairs with an active request-response
    probe to deterministically confirm spoofing, per [An Active Host-Based IDS for ARP-Related Attacks](https://arxiv.org/abs/1306.1332);
    enforce authoritative IP-MAC bindings via an arpserver-style allowlist as in [Layer-2 MAC and Protocol
    Filtering and arpserver](https://arxiv.org/abs/1708.01302). Deploy as Zeek scripts following [BZAR](https://github.com/mitre-attack/bzar).
    A positive result indicates a host, account, or cloud principal is likely sniffing traffic in support
    of credential access; corroborate with change tickets and the authorized network-monitoring allowlist
    before escalating, because legitimate IT, network-operations, and security tooling can generate similar
    artifacts. A negative result reduces but does not eliminate suspicion, so combine it with the other
    detection methods defined for this evidence.'
  answer_sources:
  - Zeek arp.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Core network switch mirror ports, network tap data from VLANs containing user workstations and
    servers, network traffic at aggregation points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |2-
        arp.log: group by 60s window
          if one mac -> many ip OR one ip -> many mac: flag
          if reply seen without matching request (gratuitous): flag
        dns.log: if host answers many LLMNR/NBT-NS/DNS for which not authoritative: flag
        on flag: active_probe(ip) to confirm IP-MAC binding vs arpserver allowlist
        emit_alert "ARP/LLMNR spoofing - possible MITM sniffing"
