  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, IT Administrator Workstations, Servers hosting diagnostic tools, and any
    endpoint not explicitly authorized for network analysis.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |2-
        baseline = per (user,host): distribution(cmdline_args), pctl99(capture_bytes)
        | for each capture event compute arg_rarity and capture_volume
        | where arg_combo NOT IN baseline.common_args
           OR capture_bytes > baseline.pctl99
        | append [search action="capture" status IN ("failed","denied")] AS fail_signal
        | alert "Anomalous capture argument/volume for user-host"
- question: 'Credential Access (TA0006) — Cluster unusual command lines: For the scenario where a process
