questions:
- question: 'Credential Access (TA0006) — Match known sniffing hashes: For the scenario where a process
    is created from an executable whose file hash matches a known malicious packet sniffing tool cataloged
    by threat intelligence. how can an analyst apply a symbolic logic approach to confirm or rule out
    network sniffing (T1040)?'
  context: 'Tactic context: this question advances the Credential Access objective (TA0006) for Network
    Sniffing. Triggering evidence: A process is created from an executable whose file hash matches a known
    malicious packet sniffing tool cataloged by threat intelligence. Method (Symbolic Logic): Continuously
    monitor process creation (Windows Event ID 4688, Sysmon EID 1, Linux auditd execve) and correlate
    file hashes/image names against a curated list of capture tools (tcpdump, tshark, dumpcap, windump,
    Cain & Abel, Ettercap, bettercap, Responder.py) and known-malicious hashes; alert on any match. Catalog
    deterministic indicators consistent with man-in-the-middle/sniffing tooling described in [A Review
    of Man-in-the-Middle Attacks](https://arxiv.org/abs/1504.02115). A positive result indicates a host,
    account, or cloud principal is likely sniffing traffic in support of credential access; corroborate
    with change tickets and the authorized network-monitoring allowlist before escalating, because legitimate
    IT, network-operations, and security tooling can generate similar artifacts. A negative result reduces
    but does not eliminate suspicion, so combine it with the other detection methods defined for this
    evidence.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Application Servers, User Workstations, Privileged Access Workstations,
    and other high-value systems.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |2-
        source IN (WinEventLog:Security EventCode=4688, Sysmon EventCode=1, auditd:SYSCALL execve)
        | eval img=lower(Image), h=coalesce(Hashes, SHA256, MD5)
        | where h IN (threat_intel_sniffer_hashes)
           OR img MATCHES "(tcpdump|tshark|dumpcap|windump|cain|ettercap|bettercap|responder)"
        | alert "Known network-sniffing tool/hash executed"
- question: 'Credential Access (TA0006) — Highlight rare hashes: For the scenario where a process is created
    from an executable whose file hash matches a known malicious packet sniffing tool cataloged by threat
    intelligence. how can an analyst apply a statistical method approach to confirm or rule out network
    sniffing (T1040)?'
  context: 'Tactic context: this question advances the Credential Access objective (TA0006) for Network
    Sniffing. Triggering evidence: A process is created from an executable whose file hash matches a known
    malicious packet sniffing tool cataloged by threat intelligence. Method (Statistical Method): For
    unmatched hashes, compute fleet prevalence from Zeek software.log/endpoint logs and flag binaries
    present on <1st percentile of hosts (rare-binary signal); profile execution failure state (non-zero
    exit, access-denied to BPF/NPF device) as a distinct feature. Per-host baselining of behavior follows
    the single-flow profiling approach in [Classification of Network Traffic Based on Single Flow Time
    Series Analysis](https://dl.acm.org/doi/abs/10.5555/3581644.3581681). A positive result indicates
    a host, account, or cloud principal is likely sniffing traffic in support of credential access; corroborate
    with change tickets and the authorized network-monitoring allowlist before escalating, because legitimate
    IT, network-operations, and security tooling can generate similar artifacts. A negative result reduces
    but does not eliminate suspicion, so combine it with the other detection methods defined for this
    evidence.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Application Servers, User Workstations, Privileged Access Workstations,
    and other high-value systems.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |2-
        source IN (Zeek software.log, WinEventLog:Security EventCode=4688, Sysmon EventCode=1)
        | stats dc(host) AS host_count BY hash
        | eventstats count(host) AS fleet AS total_hosts
        | eval prevalence=host_count/total_hosts
        | where prevalence < 0.01  /* <1st percentile rare binary */
        | join hash [search exit_code!=0 OR error="access denied BPF/NPF"] AS fail_state
        | alert "Rare unmatched binary with capture-device access"
- question: 'Credential Access (TA0006) — Classify new binaries: For the scenario where a process is created
    from an executable whose file hash matches a known malicious packet sniffing tool cataloged by threat
    intelligence. how can an analyst apply a machine learning approach to confirm or rule out network
    sniffing (T1040)?'
  context: 'Tactic context: this question advances the Credential Access objective (TA0006) for Network
    Sniffing. Triggering evidence: A process is created from an executable whose file hash matches a known
    malicious packet sniffing tool cataloged by threat intelligence. Method (Machine Learning): Train
    a Random Forest on execution features (parent process, user, command-line tokens, hash prevalence,
    path, signing status) to classify new processes as benign/malicious and emit the top-3 contributing
    features in the alert; an explainable hybrid pipeline of trees/ensembles is demonstrated in [Intelligent
    ARP Spoofing Detection using Multi-layered Machine Learning Techniques](https://arxiv.org/abs/2507.21087).
    A positive result indicates a host, account, or cloud principal is likely sniffing traffic in support
    of credential access; corroborate with change tickets and the authorized network-monitoring allowlist
    before escalating, because legitimate IT, network-operations, and security tooling can generate similar
    artifacts. A negative result reduces but does not eliminate suspicion, so combine it with the other
    detection methods defined for this evidence.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Application Servers, User Workstations, Privileged Access Workstations,
    and other high-value systems.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |2-
        model = RandomForestClassifier()
        features = [parent_process, user, cmdline_tokens, hash_prevalence, path, signing_status]
        pred = model.predict(features)
        if pred == "malicious":
            emit_alert(host, process, top_features=model.explain(features, k=3))
- question: 'Credential Access (TA0006) — Watch sniffing tools with sensitive filters: For the scenario
    where a process creation event is observed for a legitimate network utility (e.g., tcpdump, Wireshark)
    with command-line arguments specifying capture of unencrypted credential protocols or writing traffic
    to an output file. how can an analyst apply a symbolic logic approach to confirm or rule out network
    sniffing (T1040)?'
  context: 'Tactic context: this question advances the Credential Access objective (TA0006) for Network
    Sniffing. Triggering evidence: A process creation event is observed for a legitimate network utility
    (e.g., tcpdump, Wireshark) with command-line arguments specifying capture of unencrypted credential
    protocols or writing traffic to an output file. Method (Symbolic Logic): Alert on process creations
    (Windows Event ID 4688, auditd) for capture binaries (tcpdump, tshark, windump, dumpcap) combined
    with regex on arguments for output capture (''-w <file>'') or BPF/port filters targeting cleartext
    credential protocols (21/23/110/143/389/80); these are canonical credential-sniffing setups noted
    in [A Review of Man-in-the-Middle Attacks](https://arxiv.org/abs/1504.02115). A positive result indicates
    a host, account, or cloud principal is likely sniffing traffic in support of credential access; corroborate
    with change tickets and the authorized network-monitoring allowlist before escalating, because legitimate
    IT, network-operations, and security tooling can generate similar artifacts. A negative result reduces
    but does not eliminate suspicion, so combine it with the other detection methods defined for this
    evidence.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, IT Administrator Workstations, Servers hosting diagnostic tools, and any
    endpoint not explicitly authorized for network analysis.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |2-
        source IN (WinEventLog:Security EventCode=4688, auditd:SYSCALL execve)
        | where lower(process) MATCHES "(tcpdump|tshark|windump|dumpcap)"
        | where cmdline MATCHES "-w \\S+"   /* writing capture to file */
           OR cmdline MATCHES "port (21|23|110|143|389|80)"  /* cleartext cred protocols */
        | alert "Capture tool with credential-protocol filter or file output"
