name: 'T1040: Network Sniffing'
id: e1f46278-478d-41ab-9ebe-854a5af7cd7c
description: Investigate potential Network Sniffing (T1040), where an adversary passively captures traffic
  to harvest credentials and map the environment. This playbook helps an analyst hunt for execution of
  packet-capture tooling (tcpdump, tshark, dumpcap, windump, Wireshark, Cain & Abel, Ettercap, bettercap,
  Responder.py) by matching known-malicious hashes, scrutinizing command-line filters that target cleartext
  credential protocols, and classifying unfamiliar binaries. It also covers detection of network interfaces
  entering promiscuous mode, packet-capture driver loads, and unauthorized BPF/NPF device access across
  Windows, Linux, and macOS hosts. On the wire it guides investigation of man-in-the-middle precursors
  such as gratuitous-ARP storms, MAC/IP inconsistencies, and rogue LLMNR/NBT-NS responders, as well as
  passive OS/service fingerprinting (p0f, Satori) and capture of layer-2 discovery protocols (CDP, LLDP).
  For cloud and network-device estates it addresses abuse of traffic-mirroring services (AWS VPC Traffic
  Mirroring, Azure vTAP, GCP Packet Mirroring) correlated with anomalous data egress, and use of Network
  Device CLI capture commands (monitor capture, debug packet). Each question pairs symbolic-logic rules,
  statistical baselining, and machine-learning approaches so a SOC analyst can confirm or refute whether
  an adversary is sniffing traffic for credential access or network discovery.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
- tactic_id: TA0007
  tactic_name: Discovery
