- question: 'Discovery (TA0007) — Match passive fingerprint signatures: For the scenario where network
    traffic from a single internal host exhibits patterns consistent with passive OS or service fingerprinting
    tools (e.g., p0f), detected by an IDS/IPS signature. how can an analyst apply a symbolic logic approach
    to confirm or rule out network sniffing (T1040)?'
  context: 'Tactic context: this question advances the Discovery objective (TA0007) for Network Sniffing.
    Triggering evidence: Network traffic from a single internal host exhibits patterns consistent with
    passive OS or service fingerprinting tools (e.g., p0f), detected by an IDS/IPS signature. Method (Symbolic
    Logic): Deploy IDS/Zeek rules for passive fingerprinting tools (p0f, Satori) and alert when signatures
