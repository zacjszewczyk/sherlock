    Sniffing. Triggering evidence: A host log or EDR event indicates that a network interface entered
    promiscuous mode or a packet capture driver was enabled, and the host is not on a pre-approved list.
    Method (Statistical Method): Periodically query interface states (ip link, ethtool, netstat) and track
    counts of interfaces in promiscuous mode; flag sudden spikes or first appearances in new host classes,
    and record probe/query failures as a state signal. Per-host baselining approach per [Single Flow Time
    Series Analysis](https://dl.acm.org/doi/abs/10.5555/3581644.3581681). A positive result indicates
    a host, account, or cloud principal is likely sniffing traffic in support of credential access; corroborate
    with change tickets and the authorized network-monitoring allowlist before escalating, because legitimate
    IT, network-operations, and security tooling can generate similar artifacts. A negative result reduces
    but does not eliminate suspicion, so combine it with the other detection methods defined for this
    evidence.'
  answer_sources:
  - Windows Event ID 4688
  - Linux syslog
  - EDR telemetry
  - 'NAI: All endpoint and server hosts (physical and virtual), Virtualization hosts (Hyper-V/ESXi), Container
    orchestration nodes.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |2-
        poll interface_state via (ip link, ethtool, netstat) every interval
        | stats count(iface WHERE flag=PROMISC) BY host_class, time
        | where count > baseline OR first_seen_in_new_host_class
        | record query_failures AS state_signal
        | alert "Spike/first appearance of promiscuous interfaces"
