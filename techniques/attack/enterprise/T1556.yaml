name: 'T1556: Modify Authentication Process'
id: a9ae0d73-110e-4d03-808a-78591ff6aae2
description: Investigate whether an adversary has modified an authentication mechanism to harvest credentials,
  bypass authentication, or maintain persistent access across Windows (LSASS, LSA Notification/Security
  packages, password filters, Credential Guard/RunAsPPL/WDigest settings, reversible-encryption and GPO
  authentication policies), Linux (PAM configuration files and pam_*.so modules), macOS (SecurityAgentPlugins
  and the authorization database), network authentication protocols (NTLM/Kerberos downgrade and logon-without-network-auth
  bypasses, including MFA bypass), and cloud identity providers / IAM control planes (MFA/conditional-access
  weakening, rogue federation or SAML trust, backdoor access keys). The playbook spans the Defense Impairment,
  Persistence, and Credential Access tactics and combines symbolic-logic correlation, statistical baselining/change-point
  detection, and machine-learning models (forecasting, one-class/isolation, graph-provenance, and new-edge
  methods) so an analyst can triage suspected authentication-process tampering across endpoint, network,
  and cloud telemetry.
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0006
  tactic_name: Credential Access
