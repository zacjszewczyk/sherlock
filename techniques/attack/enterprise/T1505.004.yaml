questions:
- question: '[Persistence] Correlate w3wp connections to TI and known C2: For IIS Components (T1505.004),
    can you determine whether the IIS worker process (w3wp.exe) initiates an outbound network connection
    to a destination IP address or domain with a known malicious reputation. -- specifically using the
    ''Correlate w3wp connections to TI and known C2'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary installs malicious IIS
    components (ISAPI extensions/filters or native/managed IIS modules) on Internet Information Services
    web servers to intercept and modify HTTP traffic, execute commands, and proxy command-and-control
    while surviving reboots and credential changes. This evidence focuses on the condition that the IIS
    worker process (w3wp.exe) initiates an outbound network connection to a destination IP address or
    domain with a known malicious reputation. This Symbolic Logic approach works as follows: Attribute
    Zeek conn.log/dns.log and Sysmon 3 connections to w3wp.exe and alert when destinations or DNS lookups
    match known C2 domains/threat feeds; IIS proxy/backdoor modules relay C2 through the worker process
    ([Anatomy of native IIS malware](https://www.welivesecurity.com/2021/08/06/anatomy-native-iis-malware/),
    [IIS modules evolution, Microsoft](https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/)).
    Baseline: w3wp.exe should normally make few/no unsolicited outbound connections beyond its app dependencies.
    A positive result -- a rule match, statistical outlier, or model alert -- indicates that an IIS component
    or its host worker process (w3wp.exe) is behaving in a way that deviates from the server''s sanctioned
    configuration and baseline, which is consistent with a backdoored IIS module establishing or operating
    persistence; pivot to the responsible process lineage, the loaded module DLL (signer, path, prevalence,
    creation time), the applicationhost.config/web.config changes, the registering command line and account,
    and any correlated outbound C2. A negative result helps rule out this specific vector for the reviewed
    window but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land IIS persistence.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - Windows Event ID 3 (Sysmon)
  - 'NAI: IIS Web Servers, DMZ Network Segment, Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Correlate w3wp connections to TI and known C2 (Symbolic Logic)

      # Evidence: The IIS worker process (w3wp.exe) initiates an outbound network connection to a destination
      IP address or domain with a known malicious reputation.

      source IN [Zeek conn.log, Zeek dns.log, Windows Event ID 5156, Windows Event ID 3 (Sysmon)]

      | filter process_image == "w3wp.exe" OR related_to IIS module/ISAPI/config

      | apply: Symbolic Logic: Attribute Zeek conn.log/dns.log and Sysmon 3 connections to w3wp.exe and
      alert when destinations or DNS lookups match known C2 domains/threat feeds; IIS proxy/backdoor modules
      relay C2 through the worker process ([Anatomy of native IIS malware](https://www.welivesecurity.com/2021/08/06/anatomy-native-iis-malware/),
      [IIS modules evolution, Microsoft](https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/)).
      Baseline: w3wp.exe should normally make few/no unsolicited outbound connections beyond its app dependencies.

      | where match/outlier/anomaly -> raise alert with context (host, process lineage, module DLL, config
      delta, dest)'
- question: '[Persistence] Flag high FQDN entropy / DGA: For IIS Components (T1505.004), can you determine
