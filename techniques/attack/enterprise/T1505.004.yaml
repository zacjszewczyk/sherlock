name: 'T1505.004: IIS Components'
id: 6d84fa32-9ec1-432c-8b30-ca64ac9930be
description: 'This playbook helps an analyst investigate whether an adversary is maintaining persistence
  on Windows Internet Information Services (IIS) web servers by installing malicious IIS components --
  ISAPI extensions/filters or native/managed IIS modules deployed as DLLs -- that intercept and modify
  HTTP requests/responses, execute commands, or proxy command-and-control through the IIS worker process
  (w3wp.exe). It guides the hunt across several complementary behavioral angles: outbound connections
  from w3wp.exe to known-malicious or anomalous destinations (TI matching, FQDN entropy/DGA, NXDOMAIN/failed-connection
  profiling, volume forecasting, beacon cadence/jitter analysis); execution of IIS module-registration
  tooling (AppCmd.exe add/install module, PowerShell Publish/gacutil) detected by rule logic, frequency/off-hours
  baselining, and command-line obfuscation scoring; creation of module DLLs in inetsrv/GAC/app bin folders
  and edits to applicationhost.config/web.config <globalModules>/<modules> detected via FIM rules, rare-writer
  frequency analysis, and write-then-load provenance graphs; w3wp.exe spawning unexpected child processes
  (shells, scripting hosts, recon tools) via allow-list rules, rare-child frequency, and process-lineage
  ML; and w3wp.exe loading unsigned, low-prevalence, or recently-created DLL modules. Detection methods
  combine symbolic-logic rules, statistical baselining/forecasting, and machine-learning models applied
  to Windows Security/Sysmon/PowerShell/IIS-Configuration event logs and Zeek conn/dns network telemetry,
  so the analyst can corroborate suspected IIS persistence against process lineage, module provenance,
  configuration changes, and C2 context.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
