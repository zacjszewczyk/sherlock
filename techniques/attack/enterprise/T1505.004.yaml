- question: '[Persistence] Match IIS module install commands: For IIS Components (T1505.004), can you
    determine whether the execution of AppCmd.exe or PowerShell IIS cmdlets with arguments indicating
    the installation, registration, or modification of an IIS module, handler, or ISAPI filter. -- specifically
    using the ''Match IIS module install commands'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary installs malicious IIS
    components (ISAPI extensions/filters or native/managed IIS modules) on Internet Information Services
    web servers to intercept and modify HTTP traffic, execute commands, and proxy command-and-control
    while surviving reboots and credential changes. This evidence focuses on the condition that the execution
    of AppCmd.exe or PowerShell IIS cmdlets with arguments indicating the installation, registration,
    or modification of an IIS module, handler, or ISAPI filter. This Symbolic Logic approach works as
    follows: Alert when w3wp.exe is the parent of `appcmd.exe add module`, PowerShell `System.EnterpriseServices.Internal.Publish`,
    or `gacutil /I`, and on `appcmd.exe install module -name:` not parented by iissetup.exe ([SigmaHQ
