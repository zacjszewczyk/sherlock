name: 'T1586.002: Email Accounts'
id: 6589d9c1-8676-4772-b944-ae2c6004d54c
description: 'Investigate evidence that an adversary has compromised email accounts and is using them
  to target the organization (MITRE ATT&CK T1586.002, Email Accounts, under Resource Development). Although
  the act of compromising third-party email accounts largely happens outside the victim''s visibility,
  the downstream use of those accounts is observable at the email perimeter and at authentication systems.
  This playbook helps an analyst hunt for: inbound email whose sender, link domain, or attachment hash
  matches threat-intelligence feeds of known-compromised indicators; structural phishing features such
  as dynamic-DNS/URL-shortener links and high-risk attachment types (ISO, VHD, LNK, IMG); previously-unseen
  sender IPs or domains directing high-volume, targeted mailings at sensitive recipient groups (Finance,
  Executives); and brute-force or password-spray sequences against internet-facing authentication services
  that succeed against accounts known to appear in public breach corpora. It combines deterministic symbolic-logic
  rules, statistical baselining/anomaly detection, and machine-learning classifiers across Zeek network
  telemetry, email-gateway logs, and Windows authentication events.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any inbound emails carry a sender address, embedded link domain, or attachment hash that
    matches a high-confidence threat-intelligence feed of known-malicious or compromised indicators?
  context: 'Adversaries operating compromised email accounts (T1586.002) frequently reuse infrastructure
    and credentials that have already been catalogued in threat-intelligence feeds and breach corpora.
    Joining SMTP sender metadata with Zeek dns/http logs and files.log hashes, then comparing against
    TI feeds of compromised accounts, domains, and malware, lets an analyst confirm a known-bad indicator
    inside their own mail flow. Enrich sender and link domains with passive-DNS reputation features (short-lived
    domain age, low TTL, high distinct-IP/ASN counts, lexical anomaly) per EXPOSURE, and flag senders
    whose credentials appear in breach corpora per Thomas et al. A positive hit is high-confidence and
    warrants immediate containment; a negative result does not clear the message, so pivot to behavioral
    and content signals. Track NXDOMAIN on link hosts and bounced/rejected SMTP (5xx) responses as a distinct
    signal of throwaway compromised infrastructure. This is a Resource-Development indicator: the compromised
    account is the resource being leveraged against you.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Perimeter email gateway (SMTP relay); Network security monitoring sensor tap points; DNS resolvers;
    Web proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "JOIN smtp.log (mailfrom, rcptto, msg_id) WITH dns.log (query, answers)\n  AND http.log (host,\
      \ uri) AND files.log (md5, sha256)\nWHERE smtp.mailfrom IN ti_feed.compromised_senders\n   OR dns.query\
      \ IN ti_feed.malicious_domains\n   OR http.host IN ti_feed.malicious_domains\n   OR files.sha256\
      \ IN ti_feed.malicious_hashes\nENRICH sender_domain WITH passive_dns(age_days, ttl, distinct_ip,\
      \ distinct_asn, lexical_entropy)\n   AND sender WITH breach_corpus.exposed\nALERT severity=high"
  - technology: Zeek/pseudocode
    query: '# flag throwaway infrastructure failure modes

      EVENT dns.log WHERE rcode_name == "NXDOMAIN" AND query IN inbound_link_hosts

      EVENT smtp.log WHERE last_reply LIKE "5__"  # 5xx reject/bounce

      CORRELATE by sender_domain -> tag suspicious_throwaway'
- question: Which inbound senders score in the bottom quartile of network-level reputation (by AS number,
    sender-to-receiver distance, /24 neighborhood density, message size, recipient count), especially
    those delivering executable or archive attachments?
  context: Content-free, network-level features expose malicious senders even when the message body looks
    benign, which matters for trusted-but-compromised accounts. Following SNARE (Hao et al.), score each
    inbound sender on sender-IP AS number, geodesic sender-to-receiver distance, /24 neighborhood density,
    message size, and recipient count, then combine with first-seen domain age and recipient diversity.
    Flag bottom-quartile-reputation domains that send executable/archive attachments. Add volume/frequency
    features (emails-per-hour, recipient count per sender) and a state feature (the sender's SMTP accept/reject
    ratio). A low reputation score plus a risky attachment is a strong lead; legitimate bulk senders can
    also score low, so corroborate with TI and content signals before acting. This supports the Resource-Development
    PIR by surfacing senders behaving like opportunistic compromised relays.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Perimeter email gateway (SMTP relay); Network security monitoring sensor tap points; DNS resolvers;
    Web proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each inbound_sender in smtp.log:\n  features = {as_number, geo_distance(src_ip, mx_ip),\
      \ neighborhood_density(/24),\n             msg_size, recipient_count, emails_per_hour, domain_age_days,\n\
      \             recipient_diversity, accept_reject_ratio}\n  rep_score = reputation_model(features)\n\
      FLAG WHERE rep_score <= quartile(rep_score, 0.25)\n   AND attachment_mime IN (application/x-msdownload,\
      \ application/zip, application/x-7z, .exe, .rar)"
- question: Does a gradient-boosting classifier trained on Zeek-derived email features flag any inbound
    message as high-confidence malicious, and which features (per SHAP) drive that decision?
  context: A gradient-boosting model trained on Zeek-derived features (sender TLD, subject length and
    keywords, URL-to-domain ratios, MIME types, first-seen domain age) can catch malicious email that
    evades single-signal rules. Per Brett et al. and the SHAP IDS review, surface the top-3 SHAP feature
    contributions in the alert text so the analyst immediately sees why a message scored high (e.g., new
    domain age, executable MIME, high URL ratio). High-confidence positives should be queued for analyst
    review and possible recall/quarantine; the explainability output guides triage and reduces false-positive
    fatigue. This ML layer complements the deterministic IOC and statistical reputation checks for the
    same Resource-Development indicator.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Perimeter email gateway (SMTP relay); Network security monitoring sensor tap points; DNS resolvers;
    Web proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = extract(smtp.log, dns.log, http.log, files.log):\n  [sender_tld, subject_len, subject_keyword_flags,\
      \ url_domain_ratio,\n   mime_types, first_seen_domain_age]\nscore = gbm_model.predict_proba(features)\n\
      IF score >= 0.9:\n  top3 = shap_top_features(gbm_model, features, k=3)\n  ALERT msg_id, score, top3"
- question: Are inbound emails linking to dynamic-DNS or URL-shortener services, or carrying high-risk
    attachment MIME types (.iso, .vhd, .lnk, .img) that are unusual for legitimate business communication?
  context: Compromised email accounts are commonly used to deliver phishing whose structure betrays it
    even when the sending persona is trusted. Apply deterministic regex against dns/http hosts to catch
    dynamic-DNS providers and URL-shortener services, and scan files.log for high-risk MIME types (.iso,
    .vhd, .lnk, .img) that are rarely part of legitimate business mail. Use SigmaHQ process/attachment
    rules and corroborate domains with passive-DNS first-seen/TTL reputation per EXPOSURE. Matches are
    strong phishing leads; because some teams legitimately use shorteners, weight the attachment-type
    signal heavily and confirm against business norms. This addresses the Resource-Development question
    of whether a compromised account is being weaponized for delivery.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek smtp.log
  - 'NAI: Perimeter email gateway; DNS resolvers; Web proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHERE dns.query MATCHES /(dyndns|no-ip|duckdns|ddns|sslip|nip\\.io)/i\n   OR http.host\
      \ MATCHES /(bit\\.ly|tinyurl|t\\.co|goo\\.gl|cutt\\.ly|is\\.gd)/i\n   OR files.mime_type IN (\"\
      application/x-iso9660-image\",\"application/x-virtualbox-vhd\")\n   OR files.filename MATCHES /\\\
      .(iso|vhd|lnk|img)$/i\nENRICH host WITH passive_dns(first_seen, ttl)"
- question: Do any inbound link hostnames exhibit Shannon entropy or character-distribution anomalies
    in the top 5th percentile versus a 90-day baseline, suggesting algorithmically generated or obfuscated
    phishing infrastructure?
  context: Algorithmically generated and obfuscated domains used by compromised-account phishing tend
    to have unusual character distributions. Compute Shannon entropy and lexical character-distribution
    features for inbound link hostnames per Nadler et al., compare to a 90-day baseline, and flag hostnames
    in the top 5th percentile; derive the percentile threshold per environment from your own resolver/proxy
    logs rather than a fixed constant. As a failure-mode signal, count 404/NXDOMAIN responses to clicked
    links as a distinct compromise indicator (clicked-but-dead infrastructure). High-entropy hostnames
    are leads, not verdicts; pair with reputation and content signals. This statistical layer strengthens
    detection of weaponized compromised accounts in the Resource-Development phase.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek smtp.log
  - 'NAI: Perimeter email gateway; DNS resolvers; Web proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = percentile_dist(hostname_entropy(dns.log[-90d]))\nFOR host in inbound_link_hosts:\n\
      \  e = shannon_entropy(host) ; lex = char_distribution_features(host)\n  IF e >= baseline.p95 OR\
      \ lex_anomaly(lex) >= baseline.p95:\n    FLAG host\n# failure mode\nCOUNT dns.log WHERE rcode_name==\"\
      NXDOMAIN\" OR http.status_code==404\n  GROUP BY clicked_link_host -> tag dead_infra"
- question: Has the daily or hourly volume of high-risk attachment MIME types exceeded the seasonally-adjusted
    upper bound predicted by a Seasonal Hybrid ESD forecast?
  context: A surge in risky attachments can mark the onset of a campaign launched from compromised accounts.
    Forecast daily/hourly counts of high-risk MIME types using Seasonal Hybrid ESD (STL decomposition
    plus MAD-robust ESD) per Hochenbaum et al., which is robust to weekly business cycles, and alert when
    observed volume exceeds the seasonal upper bound. Because it models seasonality, this avoids false
    alarms on predictable Monday-morning peaks while catching genuine spikes. An exceedance is a campaign-level
    lead warranting a sweep of the responsible senders; a within-bound result is reassuring at the aggregate
    level. This directly supports the PIR about compromised accounts being used for targeting.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek smtp.log
  - 'NAI: Perimeter email gateway; DNS resolvers; Web proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = hourly_count(files.log WHERE mime IN risky_mime_set)

      decomp = STL(series, period=weekly)

      residual = series - decomp.seasonal - decomp.trend

      upper = median(residual) + k * MAD(residual)   # S-H-ESD

      ALERT WHERE residual > upper'
- question: Does a fine-tuned transformer text classifier flag inbound message subjects/bodies as phishing
    lures (urgency, credential-reset, mismatched links), and which tokens drive the score?
  context: Mail sent from trusted-but-compromised accounts often passes sender checks but still carries
    lure language. Score message subject and body with a fine-tuned transformer (DistilBERT/RoBERTa) classifier
    per Jamal et al., and surface the LIME/attention top tokens (urgency phrasing, credential-reset prompts,
    mismatched link text) in the alert. This content layer complements behavioral and sender-reputation
    signals, catching social-engineering content even when the network indicators look clean. Positives
    should be reviewed by an analyst; the highlighted tokens accelerate triage. This is key for the Resource-Development
    indicator because the whole value of a compromised account is the trust it carries, which only content
    analysis can challenge.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek smtp.log
  - 'NAI: Perimeter email gateway; DNS resolvers; Web proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FOR msg in smtp.log:\n  text = msg.subject + \" \" + msg.body\n  score = transformer_phish_clf.predict(text)\n\
      \  IF score >= 0.85:\n    tokens = explain_tokens(transformer_phish_clf, text, method=\"LIME/attention\"\
      , k=5)\n    ALERT msg_id, score, tokens"
- question: Has any sender domain not seen in the last 60 days (or an internal sender with a novel recipient
    set) directed mail to more than 10 internal recipients within a single hour, especially toward Finance
    or Executive groups?
  context: A previously-unseen external domain, or a known internal account suddenly mailing an atypical
    recipient set, can indicate a compromised account launching a targeted burst. Track sender domains
    observed in the last 60 days and alert when an unseen domain targets more than 10 internal recipients
    in one hour, applying the recipient-novelty logic of Ho et al.'s lateral-phishing work to internal
    senders whose recipient graph deviates from their history. Enrich recipients with directory data to
    weight high-value groups (Finance, Executives). A first-seen domain blasting a sensitive group is
    a strong lead; benign new vendors exist, so confirm with reputation/content. This squarely answers
    the Resource-Development PIR about compromised accounts used against the organization.
  answer_sources:
  - Zeek conn.log
  - Zeek smtp.log
  - 'NAI: Network security monitoring sensor tap points; Perimeter email gateway logs; Directory services
    (for recipient group enrichment)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "seen60 = distinct(smtp.log.sender_domain WHERE ts >= now-60d)\nWINDOW 1h:\n  FOR sender, recipients\
      \ in smtp.log GROUP BY sender:\n    IF (sender_domain NOT IN seen60\n        OR recipient_set_novelty(sender,\
      \ recipients) > threshold)\n       AND count(distinct internal_recipients) > 10:\n      enrich =\
      \ directory_group(recipients)  # Finance/Exec weighting\n      ALERT sender, count, enrich"
- question: Is any external sender domain producing hourly email-volume or recipient-count spikes beyond
    3 standard deviations or above the seasonal upper bound from a 30-day baseline?
  context: Targeted mailings from compromised accounts produce volume and recipient-count spikes that
    stand out against a seasonal baseline. Use 30-day moving averages and standard deviations, plus Seasonal
    Hybrid ESD (Hochenbaum et al.) to handle daily/weekly seasonality, to detect hourly volume and recipient-count
    spikes (>3 std dev or above the seasonal upper bound) from each external domain. Combine with content-free
    SNARE sender-reputation features (AS number, geodesic distance, message size) to prioritize. A statistically
    significant spike from a low-reputation domain is a strong campaign lead. Seasonality modeling suppresses
    routine business-cycle peaks. This addresses whether a compromised account is being used for targeting
    in the Resource-Development phase.
  answer_sources:
  - Zeek conn.log
  - Zeek smtp.log
  - 'NAI: Network security monitoring sensor tap points; Perimeter email gateway logs; Directory services
    (for recipient group enrichment)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR domain in external_sender_domains:\n  series = hourly_count(smtp.log WHERE sender_domain==domain)\n\
      \  ma = moving_avg(series, 30d) ; sd = moving_std(series, 30d)\n  shesd_upper = S_H_ESD(series,\
      \ period=weekly).upper\n  IF current > ma + 3*sd OR current > shesd_upper:\n     rep = snare_features(domain)\
      \  # AS, distance, msg_size\n     ALERT domain, current, rep"
- question: When a sender-recipient graph is built and clustered into communities, does any new sender
    suddenly target more than 80% of a recipient cluster, and does a behavioral classifier corroborate
    it as malicious?
  context: Targeted phishing from compromised accounts shows up as a new sender saturating a tight recipient
    community. Build a sender-recipient graph, detect communities, and alert when a new sender targets
    more than 80% of a cluster. Layer a random-forest behavioral classifier over recipient-graph novelty,
    URL reputation, and lure text — Ho et al. report 87.3% detection at roughly 4 false positives per
    million — and surface the top-3 contributing features per the SHAP IDS review. A new sender saturating
    a high-value community with corroborating behavioral signals is a high-priority lead. The graph approach
    catches coordination that per-message rules miss. This directly supports the PIR about compromised
    accounts being leveraged to target specific groups.
  answer_sources:
  - Zeek conn.log
  - Zeek smtp.log
  - 'NAI: Network security monitoring sensor tap points; Perimeter email gateway logs; Directory services
    (for recipient group enrichment)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_graph(smtp.log, nodes=senders+recipients, edges=messages)\ncommunities = detect_communities(G)\n\
      FOR sender in new_senders:\n  FOR c in communities:\n    IF fraction_targeted(sender, c) > 0.80:\n\
      \       feats = [recipient_graph_novelty, url_reputation, lure_text_score]\n       p = random_forest.predict_proba(feats)\n\
      \       IF p >= threshold:\n          ALERT sender, c, shap_top_features(random_forest, feats, 3)"
- question: Did more than 10 failed logons (Status 0xc000006d) for the same account or source IP within
    5 minutes precede a successful logon (Event ID 4624), particularly for an account known to be exposed
    in a public breach?
  context: Adversaries often compromise email/SSO accounts via brute force or password spray against internet-facing
    authentication (ADFS, Exchange OWA, VPN). Alert when more than 10 failed logons (Event ID 4625, Status
    0xc000006d) for the same TargetUserName or source IP occur within 5 minutes and are followed by a
    4624 success, using SigmaHQ brute-force/password-spray rules and enriching with breached-credential
    exposure per Thomas et al. As a failure mode, profile per-account and per-IP failed-logon rates explicitly
    so low-and-slow spraying that never trips the burst threshold is still surfaced. A burst-then-success
    against a breach-exposed account is a high-confidence compromise lead requiring immediate response.
    This is the on-network observable for the Resource-Development act of compromising an email account.
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Internet-facing authentication servers (e.g., ADFS, Exchange OWA); VPN concentrators; Domain
    Controllers'
  range: Last 90 days; event-centered correlation in 5-minute windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: "WINDOW 5m GROUP BY (TargetUserName, IpAddress):\n  fails = count(EventID==4625 AND SubStatus==0xc000006d)\n\
      \  IF fails > 10 AND EXISTS(EventID==4624 same user/IP after last fail):\n     exposed = breach_corpus.contains(TargetUserName)\n\
      \     ALERT user, ip, fails, exposed severity=high\n# low-and-slow\nPROFILE fail_rate per (account),\
      \ per (ip) over 24h -> flag anomalies"
- question: Does any source IP show a failure-to-total logon ratio above the 99th percentile over 5-minute
    windows, or do consecutive successful logons for one account imply travel faster than ~900 km/h?
  context: Statistical baselining of authentication catches credential attacks that fixed thresholds miss.
    Monitor failure-to-total logon ratios per IP over 5-minute windows and alert when ratios exceed the
    99th percentile, deriving the percentile from your own auth logs. Add deterministic impossible-travel
    logic — implied speed between consecutive 4624 successes greater than about 900 km/h per Microsoft
    WO2018085161A1 — and structural login baselining over user-host-service-time-geo per Siadati & Memon.
    A high failure ratio indicates spraying/brute force; impossible travel indicates use of stolen credentials
    from disparate locations. Both are strong leads pointing at a compromised account, the resource of
    interest in this Resource-Development technique.
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Internet-facing authentication servers (e.g., ADFS, Exchange OWA); VPN concentrators; Domain
    Controllers'
  range: Last 90 days; 5-minute and consecutive-login correlation
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR ip in auth_sources, WINDOW 5m:\n  ratio = count(4625)/ (count(4625)+count(4624))\n  IF\
      \ ratio > percentile(ratio_dist, 0.99): FLAG ip\nFOR user in users:\n  FOR (a,b) consecutive 4624:\n\
      \    speed = geo_distance(a.geo,b.geo)/hours(b.ts-a.ts)\n    IF speed > 900 km/h: ALERT user impossible_travel"
- question: Does an Isolation Forest model of each user's successful logins flag anomalous sessions (new
    ASN/geo, off-hours, high preceding fail-ratio), especially immediately after a burst of failures?
  context: Per-user behavioral modeling detects account takeover even without a clean brute-force signature.
    Model each user's successful logins on features such as time, day, ASN/geo, logon type, and preceding
    fail-ratio with an Isolation Forest per Liu et al., and alert on high anomaly scores — most importantly
    for logins that follow a failure sequence. Surface the top-3 contributing features (e.g., new ASN,
    off-hours, high fail-ratio) in the alert per the SHAP IDS review so analysts understand the verdict.
    A high anomaly score on a post-failure login is a strong account-compromise lead; the explainability
    output speeds triage and reduces noise. This ML layer closes out the authentication-side detection
    for compromised email accounts in the Resource-Development phase.
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Internet-facing authentication servers (e.g., ADFS, Exchange OWA); VPN concentrators; Domain
    Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FOR user in users:\n  X = features(4624 events): [hour, day_of_week, asn, geo, logon_type,\
      \ preceding_fail_ratio]\n  model = IsolationForest.fit(user.history)\n  scores = model.score(X)\n\
      \  FOR login WHERE anomaly_score(login) high:\n     ALERT user, login, shap_top_features(model,\
      \ login, 3)"
