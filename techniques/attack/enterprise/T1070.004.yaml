  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Symbolic: secure-deletion command patterns

      events = process/script(WinEventID=4688, Sysmon EID=1, WinEventID=4104)

      match command_line (case-insensitive) ~ sdelete|sdelete64|cipher /w:|wevtutil cl|del /f|del /q|del
      *.evtx|rm -rf|unlink|shred -u

