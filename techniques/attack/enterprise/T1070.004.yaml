  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Symbolic: correlate deletions with known-bad / cleanup-oriented artifacts

      events = deletions(WinEventID=4663, Sysmon EID=23, SysmonForLinux EID=23/26, auditd unlink)

      filter file_path IN (user-writable, temp, staging) AND file recently created/downloaded/executed

      enrich each event with file_hash, path, signer, parent_process FROM WinEventID=4688

      match path vs evidence allow/deny lists; match hash vs threat intel (allowlist + benign-process
      exclusion)

      ALERT when deleted file is recently active AND maps to a malicious or cleanup artifact

      also flag WinEventID=4663 access-denied deletes on protected artifacts as a distinct signal'
- question: 'Using statistical baselining, can you determine whether ''Score deletions by rarity of file
    age and parent lineage'' surfaces anomalous file-deletion behavior? Specifically: For each host or
    user, baseline over a 30-day window the rate of deletions by parent process, directory, and file age
    at deletion, and apply role-aware mean+k·sigma thresholds as in [Finding Anomalies in Windows Event
    Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
