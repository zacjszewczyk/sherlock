name: 'T1070.004: Indicator Removal: File Deletion'
id: 03acd20b-52da-4ad6-84b4-b821a4439631
description: 'This playbook helps an analyst determine whether an adversary is deleting files to remove
  the traces of their intrusion (T1070.004: Indicator Removal: File Deletion) and thereby evade defenses
  and conceal post-exploitation activity. It guides investigation across Windows, Linux, macOS, and ESXi
  hosts where dropped payloads, tools, scripts, archives, logs, and other forensic artifacts may be removed
  during or after an intrusion. Investigative angles include: deletion telemetry correlated with known-bad
  or cleanup-oriented artifacts (Sysmon EID 23, Windows Event ID 4663/4660, auditd unlink); secure-deletion
  and log-clearing command patterns (sdelete, cipher /w:, wevtutil cl, del /f, rm -rf, shred -u) in process
  and script telemetry; execute-then-delete sequences where a file is created, run, and removed within
  minutes; mass deletion bursts targeting log/evidence file types (.log, .evtx, .bak, .history, /var/log/*);
  telemetry gaps and broken log integrity chains treated as evidence of deletion; and download-execute-delete
  payload lifecycles observed by joining Zeek network telemetry (files.log, http.log, conn.log) with host
  endpoint deletion events. Detection blends symbolic-logic rules, statistical baselining (mean+k*sigma,
  percentile, entropy, change-point detection), and machine learning (Gradient Boosting/Random Forest,
  Isolation Forest/DBSCAN, sequence models such as DeepLog, and provenance-graph models) to produce explainable,
  evasion-resistant alerts for the Stealth tactic.'
type: technique
