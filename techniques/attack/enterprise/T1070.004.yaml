- question: 'Using machine learning, can you determine whether ''Classify suspicious cleanup sessions
    with supervised learning'' identifies adversary cleanup behavior? Specifically: Train a supervised
    model such as Gradient Boosting or Random Forest on deletion events with features including parent
    process lineage, file age, directory category, file extension, file hash reputation, deletion-burst
    size, and time since file creation, and score deletion telemetry in near real time. Complement with
    frequency/sequence syscall models for deletion-heavy execution per [Detecting Intrusions Using System
    Calls, Warrender et al](https://ieeexplore.ieee.org/document/766910). Output the probability that
    a deletion is adversary cleanup and surface the top-3 contributing features (e.g., file age, parent
    rarity, directory) in the alert text so analysts can triage; escalate hosts whose aggregate session
    score exceeds the analyst-defined threshold.'
