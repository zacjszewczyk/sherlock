- question: 'Using deterministic rule logic, can you confirm whether ''Detect known secure deletion command
    patterns'' reveals adversary file-deletion activity? Specifically: Query process-creation and script
    telemetry (Windows Event ID 4688, Sysmon Event ID 1, Windows Event ID 4104) for command lines containing
    case-insensitive overwrite-and-purge syntax such as `sdelete`, `sdelete64`, `cipher /w:`, `wevtutil
    cl`, `del /f`, `del /q`, `del *.evtx`, `rm -rf`, `unlink`, or `shred -u`. The multi-pass overwrite
    flags (`-p`, `-z`, `-c`, `-s`) documented in the [SDelete, Microsoft Sysinternals](https://learn.microsoft.com/en-us/sysinternals/downloads/sdelete)
    reference are especially high-signal anti-forensic indicators. Translate destructive-utility patterns
    from [Linux Logs Clearing Attempts, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_clear_logs.yml)
    for Linux/ESXi, alert on any match, and preserve parent process, user, and execution path for triage.'
  context: 'Tactic context (Stealth): the adversary is trying to hide and conceal their actions, deleting
    files left behind by their intrusion to minimize their forensic footprint and blend in with normal
    activity. Evidence under investigation: A process creation event captures a command line that invokes
    a secure deletion utility or a native operating system command with parameters intended to remove
    on-disk traces, such as sdelete, cipher /w:, wevtutil cl, del /f, or rm -rf. The process lineage,
    command arguments, and user context indicate deliberate anti-forensic cleanup instead of normal administration.
    Approach (Detect known secure deletion command patterns): Query process-creation and script telemetry
    (Windows Event ID 4688, Sysmon Event ID 1, Windows Event ID 4104) for command lines containing case-insensitive
    overwrite-and-purge syntax such as `sdelete`, `sdelete64`, `cipher /w:`, `wevtutil cl`, `del /f`,
    `del /q`, `del *.evtx`, `rm -rf`, `unlink`, or `shred -u`. The multi-pass overwrite flags (`-p`, `-z`,
    `-c`, `-s`) documented in the [SDelete, Microsoft Sysinternals](https://learn.microsoft.com/en-us/sysinternals/downloads/sdelete)
    reference are especially high-signal anti-forensic indicators. Translate destructive-utility patterns
    from [Linux Logs Clearing Attempts, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_clear_logs.yml)
    for Linux/ESXi, alert on any match, and preserve parent process, user, and execution path for triage.
    A positive result indicates file deletion consistent with anti-forensic cleanup rather than routine
    file hygiene; a negative result means the observed deletions match expected, benign baselines for
    that host, user, and role. Investigate the named area of interest (All Windows endpoints and servers,
    especially administrative jump hosts, file servers, and systems where cleanup utilities should be
    tightly controlled.) and pivot from any hit to the originating process, parent lineage, user account,
    the deleted file''s origin (download/staging), and any surrounding execution or exfiltration activity.'
