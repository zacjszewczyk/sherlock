questions:
- question: 'Using deterministic rule logic, can you confirm whether ''Correlate suspicious deletions
    with known bad artifacts'' reveals adversary file-deletion activity? Specifically: Query deletion
    telemetry (Windows Event ID 4663, Sysmon Event ID 23, and on Linux/ESXi [Sysmon for Linux](https://github.com/Sysinternals/SysmonForLinux)
    FileDelete EID 23/26 or auditd unlink) for files recently created, downloaded, or executed from user-writable,
    temporary, or staging directories. Enrich each event with file hash, path, signer, and parent process
    from Windows Event ID 4688, then match path against evidence allow/deny lists and hash against threat
    intelligence using the first-party allowlist-plus-benign-process-exclusion pattern of [System Log
    File Deletion, Elastic Detection Rules](https://github.com/elastic/detection-rules/blob/main/rules/linux/defense_evasion_log_files_deleted.toml).
    Alert when a deletion removes a file that is both recently active and mapped to a malicious or cleanup-oriented
    artifact; validate coverage with [Atomic Red Team T1070.004](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1070.004/T1070.004.md).'
  context: 'Tactic context (Stealth): the adversary is trying to hide and conceal their actions, deleting
    files left behind by their intrusion to minimize their forensic footprint and blend in with normal
    activity. Evidence under investigation: A file deletion event records the removal of a recently created,
    downloaded, staged, or executed payload, script, or archive from a user-writable, temporary, or system
    directory, and the deleted object''s hash or path matches a known malicious file, secure-deletion
    tool, or intrusion artifact. The deletion is tied to a specific parent process and user context rather
    than ordinary file hygiene. Failed or access-denied delete attempts (Windows Event ID 4663 with an
    access-denied result) on protected artifacts are treated as a distinct, equally interesting signal.
    Approach (Correlate suspicious deletions with known bad artifacts): Query deletion telemetry (Windows
    Event ID 4663, Sysmon Event ID 23, and on Linux/ESXi [Sysmon for Linux](https://github.com/Sysinternals/SysmonForLinux)
    FileDelete EID 23/26 or auditd unlink) for files recently created, downloaded, or executed from user-writable,
    temporary, or staging directories. Enrich each event with file hash, path, signer, and parent process
    from Windows Event ID 4688, then match path against evidence allow/deny lists and hash against threat
    intelligence using the first-party allowlist-plus-benign-process-exclusion pattern of [System Log
    File Deletion, Elastic Detection Rules](https://github.com/elastic/detection-rules/blob/main/rules/linux/defense_evasion_log_files_deleted.toml).
    Alert when a deletion removes a file that is both recently active and mapped to a malicious or cleanup-oriented
    artifact; validate coverage with [Atomic Red Team T1070.004](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1070.004/T1070.004.md).
    A positive result indicates file deletion consistent with anti-forensic cleanup rather than routine
    file hygiene; a negative result means the observed deletions match expected, benign baselines for
    that host, user, and role. Investigate the named area of interest (User Workstations, Application
    Servers, Domain Controllers, and any host where newly staged files are expected to persist long enough
    to support incident response.) and pivot from any hit to the originating process, parent lineage,
    user account, the deleted file''s origin (download/staging), and any surrounding execution or exfiltration
    activity.'
