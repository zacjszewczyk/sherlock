      alert where p < low_prob_threshold | attach top3_anomalous_tokens'
- question: '[Exfiltration] Large repository upload session: Can you determine whether a single network
    session to a known code repository service exhibits an outbound-to-inbound data transfer ratio greater
    than 10:1, or the total daily outbound data volume from a single host to code repositories exceeds
    its 30-day statistical baseline by more than 3 standard deviations. -- specifically, using the ''Large
    repository upload session'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary steals data from the
    network and may route it to a public code repository service over HTTPS to blend in with legitimate
    developer traffic and gain transport encryption as cover. This evidence focuses on the condition that
    a single network session to a known code repository service exhibits an outbound-to-inbound data transfer
    ratio greater than 10:1, or the total daily outbound data volume from a single host to code repositories
    exceeds its 30-day statistical baseline by more than 3 standard deviations. This Symbolic Logic approach
    works as follows: Alert on Zeek conn.log connections to known repository destinations where orig_bytes
    > 100MB and the orig_bytes/resp_bytes ratio exceeds 10:1, or where uploads occur on uncommon ports.
    Keep these hard volume/ratio thresholds as a deterministic floor ([Data exfiltration: A review of
    external attack vectors and countermeasures, Ullah](https://www.sciencedirect.com/science/article/pii/S1084804518301626)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable staging
    or transfer of data to a code repository; pivot to the responsible host and process lineage, the initiating
    user and their role/group, the repository destination and account, the volume and direction of data
    transferred, and any preceding collection or compression activity. A negative result helps rule out
    this particular exfiltration vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, low-and-slow, or living-off-the-land repository exfiltration.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Internet Gateway and Core Network Taps'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from conn.log where id.resp_h in repo_dests

      and (orig_bytes > 100MB and (orig_bytes/resp_bytes) > 10 OR resp_p in uncommon_ports)

      | alert (deterministic floor)'
