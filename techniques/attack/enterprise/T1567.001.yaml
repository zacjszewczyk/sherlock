name: 'T1567.001: Exfiltration to Code Repository'
id: f5041403-e009-45ae-a604-5a21f1a3a2d2
description: 'This playbook helps an analyst investigate whether an adversary has exfiltrated data to
  a public code repository service (such as GitHub, GitLab, or Bitbucket) rather than over a primary command-and-control
  channel, abusing the HTTPS-based APIs of these popular developer services for both encryption and cover,
  as part of the Exfiltration tactic. The hunt spans endpoint, network, and identity telemetry across
  Windows, Linux, macOS, and ESXi platforms. It guides the analyst across several behavioral angles: outbound
  connections to repository domains/IPs that are threat-intel flagged or statistically rare for the host
  or enterprise; TLS anomalies where the SNI claims a repository but the certificate or JA3 client fingerprint
  is unexpected; bursts of repository API authentication failures indicating credential probing; host
  process sequences where an archiving utility (7z.exe, rar.exe, Compress-Archive) is immediately followed
  by a ''git push''; git pushes from user-writable or temporary paths; high outbound-to-inbound transfer
  ratios, daily-volume baseline breaches, low-and-slow cumulative uploads, and burst-upload clustering
  to repository destinations; repository access by users or hosts outside authorized developer/engineering
  groups; and connections to repository services made by living-off-the-land binaries or processes with
  no history of such behavior. Detection methods combine symbolic-logic rules, statistical baselining/forecasting,
  and machine-learning models (classifiers, sequence models, isolation forests/autoencoders, graph neural
  networks, and clustering) applied to Zeek conn/ssl/dns logs, network flow taps, proxy logs, Windows
  Security/Sysmon events (4688, 5156, 4624, 4663), auditd, macOS unified logs, and ESXi host logs, so
  the analyst can corroborate suspected repository exfiltration against process lineage, file access,
  user/role context, network fingerprints, and outbound data volume.'
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
