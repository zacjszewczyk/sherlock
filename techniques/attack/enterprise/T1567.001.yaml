questions:
- question: '[Exfiltration] IOC match on repository destinations: Can you determine whether an outbound
    network connection is made to a domain or IP address of a code repository service that is present
    on a threat intelligence feed or is statistically rare within the enterprise. -- specifically, using
    the ''IOC match on repository destinations'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary steals data from the
    network and may route it to a public code repository service over HTTPS to blend in with legitimate
    developer traffic and gain transport encryption as cover. This evidence focuses on the condition that
    an outbound network connection is made to a domain or IP address of a code repository service that
    is present on a threat intelligence feed or is statistically rare within the enterprise. This Symbolic
    Logic approach works as follows: Correlate Zeek dns.log query values, Zeek ssl.log server_name values,
    and Zeek conn.log id.resp_h destinations against a threat-intel feed of known malicious or suspicious
    code-repository indicators (per the destination/egress countermeasure taxonomy in [Data exfiltration:
    A review of external attack vectors and countermeasures, Ullah](https://www.sciencedirect.com/science/article/pii/S1084804518301626);
    repository APIs such as api.github.com noted in [T1567.001, MITRE ATT&CK](https://attack.mitre.org/techniques/T1567/001/)).
    Alert on any match and include host, user, and process context where available. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable staging or transfer of
    data to a code repository; pivot to the responsible host and process lineage, the initiating user
    and their role/group, the repository destination and account, the volume and direction of data transferred,
    and any preceding collection or compression activity. A negative result helps rule out this particular
    exfiltration vector but should be corroborated with the other questions in this playbook, since a
    single method can miss stealthy, low-and-slow, or living-off-the-land repository exfiltration.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, and Egress Proxies'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'dns.query OR ssl.server_name OR conn.id.resp_h IN threat_intel_repo_iocs

      | join host, user, process_name where available

      | emit alert(host, user, process, dest, match_source)'
- question: '[Exfiltration] Rare repository destinations by host: Can you determine whether an outbound
    network connection is made to a domain or IP address of a code repository service that is present
    on a threat intelligence feed or is statistically rare within the enterprise. -- specifically, using
    the ''Rare repository destinations by host'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary steals data from the
    network and may route it to a public code repository service over HTTPS to blend in with legitimate
    developer traffic and gain transport encryption as cover. This evidence focuses on the condition that
    an outbound network connection is made to a domain or IP address of a code repository service that
    is present on a threat intelligence feed or is statistically rare within the enterprise. This Statistical
    Method approach works as follows: Build per-host and enterprise-wide frequency tables of repository
    domains/IPs over a 30-day window and flag destinations first-seen for the host that also fall below
    the 1st percentile of enterprise frequency; combine with destination-rarity scoring as implemented
    in [RITA, Active Countermeasures](https://github.com/activecm/rita). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable staging or transfer of data to a code repository;
    pivot to the responsible host and process lineage, the initiating user and their role/group, the repository
    destination and account, the volume and direction of data transferred, and any preceding collection
    or compression activity. A negative result helps rule out this particular exfiltration vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-and-slow, or living-off-the-land repository exfiltration.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, and Egress Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'window=30d

      freq_host = count(conn) by (host, repo_dest)

      freq_ent  = count(conn) by repo_dest

      flag where first_seen(host, repo_dest) AND percentile(freq_ent) < 1

      | score destination_rarity (RITA-style) | alert'
- question: '[Exfiltration] Repository TLS mismatch or anomalous client: Can you determine whether an
    outbound network connection is made to a domain or IP address of a code repository service that is
    present on a threat intelligence feed or is statistically rare within the enterprise. -- specifically,
    using the ''Repository TLS mismatch or anomalous client'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary steals data from the
    network and may route it to a public code repository service over HTTPS to blend in with legitimate
    developer traffic and gain transport encryption as cover. This evidence focuses on the condition that
    an outbound network connection is made to a domain or IP address of a code repository service that
    is present on a threat intelligence feed or is statistically rare within the enterprise. This Symbolic
    Logic approach works as follows: Identify TLS sessions where the SNI indicates a repository domain
    but the certificate CN/issuer is mismatched, self-signed, or first-seen in the last 7 days, or where
    the client fingerprint (JA3) is an unexpected tool (curl/git/python) using version-agnostic TLS metadata
    analysis from [Extending C2 Traffic Detection Methodologies, Novo](https://github.com/CarlosANovo/extending12to13).
    Raise priority if the destination is also rare for the host. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable staging or transfer of data to a code repository; pivot
    to the responsible host and process lineage, the initiating user and their role/group, the repository
    destination and account, the volume and direction of data transferred, and any preceding collection
    or compression activity. A negative result helps rule out this particular exfiltration vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-and-slow, or living-off-the-land repository exfiltration.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, and Egress Proxies'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from ssl.log where server_name ~ repo_domain\nand (cert.CN != server_name OR cert.issuer in\
      \ (self-signed) OR cert.first_seen < 7d\n     OR ja3 in (curl,git,python))\n| raise_priority if\
      \ dest_rare_for_host(host, server_name) | alert"
- question: '[Exfiltration] Repository auth failure bursts: Can you determine whether an outbound network
    connection is made to a domain or IP address of a code repository service that is present on a threat
    intelligence feed or is statistically rare within the enterprise. -- specifically, using the ''Repository
    auth failure bursts'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary steals data from the
    network and may route it to a public code repository service over HTTPS to blend in with legitimate
    developer traffic and gain transport encryption as cover. This evidence focuses on the condition that
    an outbound network connection is made to a domain or IP address of a code repository service that
    is present on a threat intelligence feed or is statistically rare within the enterprise. This Statistical
    Method approach works as follows: Profile failure/state signals at the proxy — bursts of HTTP 401/403
    responses from repository APIs or blocked CONNECT attempts to repository domains within a 10-minute
    window exceeding the host''s baseline indicate credential probing during exfiltration ([Data exfiltration:
    A review of external attack vectors and countermeasures, Ullah](https://www.sciencedirect.com/science/article/pii/S1084804518301626)).
    Treat repeated failures-then-success as a distinct high-priority signal. A positive result -- a rule
    match, statistical outlier, or model alert -- indicates probable staging or transfer of data to a
    code repository; pivot to the responsible host and process lineage, the initiating user and their
    role/group, the repository destination and account, the volume and direction of data transferred,
    and any preceding collection or compression activity. A negative result helps rule out this particular
    exfiltration vector but should be corroborated with the other questions in this playbook, since a
    single method can miss stealthy, low-and-slow, or living-off-the-land repository exfiltration.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, and Egress Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from proxy.log where dest ~ repo_domain and (status in (401,403) OR connect_blocked)

      | bucket span=10m by host

      | flag where count > baseline(host)

      | escalate where failures_then_success(host, dest)'
- question: '[Exfiltration] Malicious repository domain scoring: Can you determine whether an outbound
