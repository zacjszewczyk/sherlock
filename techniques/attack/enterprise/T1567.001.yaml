    Alert on high-risk scores for newly observed domains and surface the top-3 contributing features in
    the alert per [SHAP Integration in IDS, Frontiers in AI](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable staging
    or transfer of data to a code repository; pivot to the responsible host and process lineage, the initiating
    user and their role/group, the repository destination and account, the volume and direction of data
    transferred, and any preceding collection or compression activity. A negative result helps rule out
    this particular exfiltration vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, low-and-slow, or living-off-the-land repository exfiltration.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, and Egress Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [domain_age, registrar, entropy, passive_dns_history, repo_api_path_prevalence]

      score = repo_domain_classifier.predict(features)

      alert where score > high_risk_threshold AND newly_observed(domain)

      | attach top3_shap_features'
- question: '[Exfiltration] Archive then git push sequence: Can you determine whether a process execution
    sequence on a single host shows a data compression utility (e.g., 7z.exe) followed by a ''git.exe''
    process execution with ''push'' arguments within a 5-minute window. -- specifically, using the ''Archive
    then git push sequence'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary steals data from the
    network and may route it to a public code repository service over HTTPS to blend in with legitimate
    developer traffic and gain transport encryption as cover. This evidence focuses on the condition that
    a process execution sequence on a single host shows a data compression utility (e.g., 7z.exe) followed
    by a ''git.exe'' process execution with ''push'' arguments within a 5-minute window. This Symbolic
    Logic approach works as follows: Alert when Windows Event ID 4688 shows a known archiving utility
    (7z.exe, rar.exe, zip.exe, tar.exe, powershell.exe Compress-Archive) — including password-protected
    archives per [Compress Data and Lock With Password for Exfiltration With 7-ZIP, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_7zip_password_compression.yml)
    — followed by git.exe with a push subcommand within 5 minutes for the same host and user ([T1567.001,
    MITRE ATT&CK](https://attack.mitre.org/techniques/T1567/001/)). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable staging or transfer of data to a code repository;
    pivot to the responsible host and process lineage, the initiating user and their role/group, the repository
    destination and account, the volume and direction of data transferred, and any preceding collection
    or compression activity. A negative result helps rule out this particular exfiltration vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-and-slow, or living-off-the-land repository exfiltration.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Developer Workstations, Build Servers, and CI/CD Pipeline Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'A = 4688 where new_process in (7z.exe,rar.exe,zip.exe,tar.exe,''powershell.exe Compress-Archive'')

      B = 4688 where new_process=git.exe and cmdline ~ ''push''

      alert where B.time - A.time <= 5m AND same(host,user)'
- question: '[Exfiltration] Git push from non-repo paths: Can you determine whether a process execution
    sequence on a single host shows a data compression utility (e.g., 7z.exe) followed by a ''git.exe''
    process execution with ''push'' arguments within a 5-minute window. -- specifically, using the ''Git
    push from non-repo paths'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary steals data from the
    network and may route it to a public code repository service over HTTPS to blend in with legitimate
