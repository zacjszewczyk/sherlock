    by a ''git.exe'' process execution with ''push'' arguments within a 5-minute window. This Symbolic
    Logic approach works as follows: Flag git.exe push executions where the working directory or command
    line references user-writable or temporary paths (e.g., %TEMP%, %APPDATA%, C:\Users\Public) rather
    than approved repository roots. A positive result -- a rule match, statistical outlier, or model alert
    -- indicates probable staging or transfer of data to a code repository; pivot to the responsible host
    and process lineage, the initiating user and their role/group, the repository destination and account,
    the volume and direction of data transferred, and any preceding collection or compression activity.
    A negative result helps rule out this particular exfiltration vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land
    repository exfiltration.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Developer Workstations, Build Servers, and CI/CD Pipeline Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from 4688 where new_process=git.exe and cmdline ~ ''push''

      and (cwd ~ ''%TEMP%|%APPDATA%|C:\\Users\\Public'' OR cmdline references such paths)

      and cwd NOT in approved_repo_roots | alert'
