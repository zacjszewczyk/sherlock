name: 'T1003.008: -etc-passwd and -etc-shadow'
id: 7189199d-8c26-4f1a-bc01-1dfc740b7af8
description: Investigate suspected dumping of Linux credential stores /etc/passwd and /etc/shadow for
  offline password cracking (e.g., via cat/less/grep, unshadow, symlinks, archive utilities, or copies
  to /tmp). This playbook helps an analyst correlate host evidence of process execution and sensitive-file
  access with network evidence of exfiltration. It covers command-line and syscall detection of credential-file
  reads, unauthorized or denied access to /etc/shadow, statistical baselining of access frequency and
  command entropy, content inspection of outbound flows for passwd/shadow record grammar, anomalous outbound
  connections to rare or threat-intel destinations, and time-bound correlation between an /etc/shadow
  read and a subsequent suspicious egress from the same host, including provenance-graph reconstruction
  of the access-to-exfil chain.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any Linux server make an outbound connection whose destination IP, domain, or host resolves
    to a known-malicious, C2, TOR, or known-exfiltration threat-intelligence entry, or was a first-seen
    external destination contacted by a server-class host?
  context: After credential files are dumped, the hashes are typically shipped off-host for offline cracking,
    so a deterministic match between server egress and curated threat intelligence is a high-confidence
    indicator of Credential Access progressing to exfiltration. Join Zeek conn.log with dns.log to resolve
    the destination, then alert when the destination matches malicious/C2/TOR/known-exfil TI. Treat first-seen
    external destinations from server-class hosts (which normally talk to a stable, small set of peers)
    as elevated even without a TI hit. A positive result warrants immediate scoping of what left the host;
    a negative result lowers but does not eliminate suspicion, since the actor may use a clean destination.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, DNS resolvers, and border routers monitoring traffic originating from
    Linux server subnets.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "conn = FROM conn.log\ndns = FROM dns.log\njoined = JOIN conn WITH dns ON conn.id.resp_h =\
      \ dns.answers\nALERT WHERE joined.resp_h IN threat_intel(malicious,C2,TOR,exfil)\n   OR joined.query\
      \ IN threat_intel_domains\n   OR (orig_h IN linux_server_subnets AND resp_h NOT IN seen_destinations(orig_h,\
      \ last=90d))"
- question: Is a Linux server contacting a statistically rare destination ASN or country, or emitting
    a small (1-100KB) text/plain transfer that it has never produced before?
  context: 'Exfiltration of /etc/passwd and /etc/shadow is low-volume: the combined files are small plain
    text, so a tiny outbound transfer to an unusual destination is exactly the signature to hunt for.
    Baseline each Linux server''s normal destination ASNs/countries and outbound byte volume, then alert
    when destination frequency falls below the 5th percentile, or when a 1-100KB text/plain transfer leaves
    a server that normally produces none. Lexical/entropy features on the destination strengthen DNS-based
    exfil detection. A positive result means a rare, small egress consistent with credential exfil; a
    negative result means traffic matches historical norms.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, DNS resolvers, and border routers monitoring traffic originating from
    Linux server subnets.'
  range: Last 90 days for baseline; evaluate on a rolling 24-hour window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = PROFILE per server: dest_asn, dest_country, bytes_out OVER last 90d\nFOR each outbound\
      \ flow:\n  ALERT WHERE freq(dest_asn|dest_country) < p5(baseline)\n     OR (mime == 'text/plain'\
      \ AND 1KB <= bytes_out <= 100KB AND server_has_no_prior_textplain_egress)"
- question: Is there a spike in failed or blocked outbound connections, or in NXDOMAIN responses, from
    a Linux host that coincides with access to credential files?
  context: Beaconing and exfil attempts often generate a burst of failed egress (blocked by firewall/proxy)
    or NXDOMAIN responses as malware cycles through C2 candidates or DNS-tunneling labels. Track per-host
    failed/blocked outbound connection counts and NXDOMAIN counts per minute as a distinct State signal.
    When a spike co-occurs with credential-file access on the same host, confidence in active exfiltration
    rises sharply. A positive result is a failure spike correlated in time with /etc/shadow activity;
    a negative result is steady, baseline failure rates.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, DNS resolvers, and border routers monitoring traffic originating from
    Linux server subnets.'
  range: Last 90 days for baseline; alert on per-minute spikes.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per_host_min = COUNT(conn WHERE conn_state IN ['REJ','S0','RSTO']) BY host, minute\nnx = COUNT(dns\
      \ WHERE rcode_name == 'NXDOMAIN') BY host, minute\nALERT WHERE (per_host_min > p99(baseline) OR\
      \ nx > p99(baseline))\n   AND host HAS credential_file_access WITHIN 10m"
- question: When outbound Linux-server flows are scored by an anomaly model on protocol, responder port,
    bytes out, duration, ASN and destination rarity, which connections are flagged as anomalous, and what
    features drove the alert?
  context: Rule-based egress detection misses novel destinations and protocols, so an unsupervised model
    gives broader coverage for credential exfil over unexpected channels. Train an Isolation Forest or
    one-class SVM on conn features (proto, resp_p, bytes_out, duration, ASN, dest-rarity) from normal
    server behavior and flag anomalies, emitting the top-3 contributing features so an analyst can triage
    quickly. A positive result is an anomalous flow with an explainable feature attribution (e.g., rare
    ASN + unusual port); a negative result is a flow that fits the learned normal manifold. Explainability
    is essential to avoid blind alerts.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, DNS resolvers, and border routers monitoring traffic originating from
    Linux server subnets.'
  range: Last 90 days for training; score in near-real-time.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [proto, resp_p, bytes_out, duration, asn, dest_rarity]

      model = IsolationForest().fit(normal_server_conn[features])

      score = model.decision_function(new_conn[features])

      ALERT WHERE score < anomaly_threshold

      EMIT top3_feature_contributions(new_conn)'
- question: Did any process execute a command line that reads, copies, or combines /etc/passwd or /etc/shadow
    using utilities such as cat, less, grep, head, tail, sed, vi, unshadow, or cp to /tmp?
  context: 'The most direct evidence of this technique is a command line that touches the credential files:
    reading them with cat/less/grep, dumping them with head/tail/sed/vi, combining them with unshadow
    for John the Ripper, or copying them to a staging directory like /tmp. Regex-match execve/process-creation
    command lines against these utilities and the /etc/passwd|/etc/shadow paths. A positive result is
    a concrete credential-dump command; confirm the user/context to rule out legitimate administration.
    A negative result means no obvious command-line access occurred, though indirect methods may still
    apply.'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd:SYSCALL execve
  - 'NAI: The local file systems and process tables of critical Linux servers, including domain controllers,
    database servers, and servers in a DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHERE event IN [Sysmon1, auditd_execve]\n  AND cmdline MATCHES /(cat|less|more|grep|head|tail|sed|awk|vi|vim|nano|unshadow)\\\
      b.*\\/etc\\/(passwd|shadow)/\n  OR cmdline MATCHES /\\bcp\\b.*\\/etc\\/(passwd|shadow).*\\/tmp\\\
      //"
- question: Was a symbolic link created to /etc/passwd or /etc/shadow, or were archive/compression utilities
    (tar, gzip, zip) used to reference those files, to indirectly access or stage them?
  context: 'Adversaries evade naive command-line rules by accessing the files indirectly: creating a symlink
    (ln -s / ln -s -f) to /etc/passwd or /etc/shadow and reading the link, or bundling the files into
    an archive (tar/gzip/zip) to stage for exfil under an innocuous name. Alert on ln -s targeting these
    paths and on archive/compress utilities referencing them. A positive result reveals an evasion or
    staging variant that simple cat-based rules would miss; a negative result means no symlink or archive
    indirection was observed in the window.'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd:SYSCALL execve
  - 'NAI: The local file systems and process tables of critical Linux servers, including domain controllers,
    database servers, and servers in a DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHERE cmdline MATCHES /\\bln\\s+-s(\\s+-f)?\\b.*\\/etc\\/(passwd|shadow)/\n  OR (cmdline\
      \ MATCHES /\\b(tar|gzip|gunzip|zip|7z|xz|bzip2)\\b/ AND cmdline CONTAINS '/etc/shadow' OR '/etc/passwd')"
- question: Which credential-file-access command lines are anomalous by command-line entropy, invocation
    frequency, or an unusual parent-child process pair (for example httpd, nginx, or postgres reading
    credential files for the first time)?
  context: Beyond exact-match rules, statistical baselining catches obfuscated or unexpected access. Baseline
    per-host/per-user command-line entropy, invocation frequency (count/min), and parent-child process
    pairs over a 30-day history, then flag entries above the 95th percentile or parent processes with
    a zero historical baseline for reading credential files. A web/database server process suddenly reading
    /etc/shadow is a strong signal of post-exploitation. A positive result is a rare, high-entropy, or
    out-of-character invocation; a negative result fits the host's learned command profile.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd:SYSCALL execve
  - 'NAI: The local file systems and process tables of critical Linux servers, including domain controllers,
    database servers, and servers in a DMZ.'
  range: Last 90 days; derive thresholds from 30-day host history.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = PROFILE per host,user: entropy(cmdline), count_per_min, parent_child_pairs OVER\
      \ 30d\nALERT WHERE event touches /etc/(passwd|shadow) AND (\n  entropy(cmdline) > p95(baseline)\n\
      \  OR count_per_min > p95(baseline)\n  OR parent_image IN [httpd,nginx,apache2,postgres,mysqld]\
      \ WITH zero_baseline_for_credfile_read)"
- question: When per-host/per-user execve and syscall streams are modeled as sequences, does the read
    of /etc/shadow occur in a low-probability execution path, and what was the expected-versus-observed
    event?
  context: Credential dumping rarely appears in isolation; it sits in a sequence of commands and syscalls
    that, for a given host or user, may be highly improbable. Train per-user/host sequence models (LSTM
    or seq2seq autoencoder) on execve+syscall streams and alert when an /etc/shadow read appears in a
    low-probability path, surfacing the expected-vs-observed event and top-3 features for triage. This
    catches stealthy access embedded in otherwise-normal activity. A positive result is a sequence with
    high reconstruction error around the credential-file read; a negative result is a sequence consistent
    with the learned model.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd:SYSCALL execve
  - 'NAI: The local file systems and process tables of critical Linux servers, including domain controllers,
    database servers, and servers in a DMZ.'
  range: Last 90 days for training; score on streaming events.
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = SeqAutoencoder().fit(per_user_execve_syscall_sequences)\nFOR sequence containing read('/etc/shadow'):\n\
      \  err = reconstruction_error(model, sequence)\n  ALERT WHERE err > threshold\n  EMIT expected_next_event,\
      \ observed_event, top3_features"
- question: Does the content of any outbound file transfer or TCP stream match the exact record grammar
    of /etc/passwd (seven colon-delimited fields) or /etc/shadow (nine fields with $1$/$5$/$6$/$y$ hash
    prefixes)?
  context: 'The strongest content-based evidence of exfiltration is the credential data itself moving
    across the wire. Apply Zeek/IDS regex to reassembled files and TCP streams for the precise passwd
    format (7 colon-delimited fields: name:x:uid:gid:gecos:home:shell) and shadow format (9 fields whose
    password field carries $1$/$5$/$6$/$y$ hash prefixes). A positive result is near-certain proof that
    credential files are leaving the environment; treat as a confirmed incident. A negative result means
    no plaintext credential-file grammar was seen, though encryption or encoding could hide it.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress points instrumented with Deep Packet Inspection (DPI) or content-aware Network
    Data Loss Prevention (NDLP) systems.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FOR reassembled_payload IN [files.log extracted, tcp_stream]:\n  ALERT WHERE payload MATCHES\
      \ /^[^:]+:[^:]*:\\d+:\\d+:[^:]*:[^:]*:[^:]*$/m   # passwd 7 fields\n     OR payload MATCHES /^[^:]+:\\\
      $(1|5|6|y)\\$[^:]+(:[^:]*){7}$/m            # shadow 9 fields w/ hash"
- question: Is any outbound transfer leaving a server with an uncommon MIME type, filename, or size, particularly
    a 1-100KB text/plain object whose name contains passwd, shadow, crack, or unshadow?
  context: 'Even without inspecting content, file metadata betrays credential exfil: the dumped/combined
    files are small text objects, and attackers often name staged copies suggestively (crack.password.db,
    shadow.txt). Baseline MIME types, filenames, and sizes leaving each server, then flag text/plain transfers
    of 1-100KB with uncommon names or names containing passwd/shadow/crack/unshadow as volume+rarity anomalies.
    A positive result is a small, oddly named text object departing a server; a negative result matches
    the server''s normal transfer profile.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress points instrumented with Deep Packet Inspection (DPI) or content-aware Network
    Data Loss Prevention (NDLP) systems.'
  range: Last 90 days for baseline; evaluate continuously.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = PROFILE per server: mime_type, filename_pattern, size OVER 90d\nALERT WHERE mime\
      \ == 'text/plain' AND 1KB <= size <= 100KB\n  AND (filename RARE_FOR(server) OR filename MATCHES\
      \ /(passwd|shadow|crack|unshadow)/)"
- question: Do byte-frequency and character n-gram models classify any outbound text payload as having
    the structure of a credential file, and which n-grams drove that prediction?
  context: Attackers may rename or lightly transform exfil files, defeating name/path rules, but the statistical
    structure of passwd/shadow content persists. Score outbound text with a byte-frequency anomaly model
    (PAYL-style) and a character n-gram classifier (Naive Bayes or CNN) trained to recognize credential-file
    structure, alerting on high-confidence predictions and reporting the top contributing n-grams. A positive
    result is a payload that statistically resembles credential files regardless of its name; a negative
    result is content unlike the learned credential-file profile. Reporting top n-grams supports analyst
    verification.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress points instrumented with Deep Packet Inspection (DPI) or content-aware Network
    Data Loss Prevention (NDLP) systems.'
  range: Last 90 days for training; score on extracted outbound text.
  queries:
  - technology: SIEM/ML pseudocode
    query: "payl = ByteFrequencyModel().fit(normal_outbound_text)\nclf = NgramClassifier(char_ngrams).fit(labeled_credfile_vs_benign)\n\
      FOR outbound_text:\n  ALERT WHERE payl.anomaly(outbound_text) HIGH OR clf.predict(outbound_text)\
      \ == 'credential_file' (p>0.9)\n  EMIT top_contributing_ngrams"
- question: Was /etc/shadow read by a process or user not on the approved allowlist, or outside a root/privileged
    context?
  context: By default /etc/shadow is readable only by root, so any read by a non-privileged user or an
    unexpected process is highly suspicious. Use auditd watches (-w /etc/shadow -p r, -w /etc/passwd -p
    wa) to alert when /etc/shadow is read by processes/users not on the allowlist and outside root/privileged
    contexts; maintain a production allowlist of legitimate readers (backup agents, PAM, vipw). eBPF offers
    a tamper-resistant alternative to auditd. A positive result is unauthorized credential-file access
    requiring investigation; a negative result means access stayed within approved, privileged actors.
  answer_sources:
  - Sysmon for Linux Event ID 11
  - auditd:SYSCALL open/read
  - auditd:PATH
  - 'NAI: File system audit logs from all production Linux servers, particularly those hosting sensitive
    applications or data.'
  range: Last 90 days
  queries:
  - technology: auditd/pseudocode
    query: "# /etc/audit/rules.d: -w /etc/shadow -p r -k shadow_read ; -w /etc/passwd -p wa -k passwd_write\n\
      ALERT WHERE key == 'shadow_read'\n  AND (auid NOT IN allowlist_users OR exe NOT IN allowlist_readers)\n\
      \  AND euid != 0"
- question: Were there permission-denied (EACCES) open or read attempts on /etc/shadow by non-root users?
  context: Before achieving privilege escalation, an adversary frequently probes /etc/shadow and is denied
    (EACCES), leaving a distinct failure-signal of attempted credential access. Alert separately on permission-denied
    open/read attempts on /etc/shadow by non-root users as a State/failure signal. This is valuable early
    warning that someone is testing for credential-dump opportunities prior to escalating. A positive
    result is one or more denied reads from a non-root user, often a precursor to escalation; a negative
    result means no failed access attempts were logged.
  answer_sources:
  - Sysmon for Linux Event ID 11
  - auditd:SYSCALL open/read
  - auditd:PATH
  - 'NAI: File system audit logs from all production Linux servers, particularly those hosting sensitive
    applications or data.'
  range: Last 90 days
  queries:
  - technology: auditd/pseudocode
    query: "ALERT WHERE syscall IN [open,openat,read] AND path == '/etc/shadow'\n  AND exit == -EACCES\
      \ AND euid != 0"
- question: Does any host show an hourly read count for /etc/passwd or /etc/shadow exceeding the 99th
    percentile of its 30-day distribution, or a process whose syscall sequence deviates from its learned
    profile while accessing these files?
  context: Automated dumping or repeated scripted access produces read-frequency spikes that stand out
    against a host's normal rhythm. Baseline per-host hourly read counts for /etc/passwd|shadow and flag
    hours exceeding the 99th percentile of the 30-day distribution. Additionally score per-process syscall-sequence
    mismatch against its learned profile (a sense-of-self approach) so that an oddly-behaving process
    accessing credential files is surfaced. A positive result is an access spike or syscall anomaly; a
    negative result fits the host's and process's normal behavior.
  answer_sources:
  - Sysmon for Linux Event ID 11
  - auditd:SYSCALL open/read
  - auditd:PATH
  - 'NAI: File system audit logs from all production Linux servers, particularly those hosting sensitive
    applications or data.'
  range: Last 90 days; baseline over 30 days.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'hourly = COUNT(read(''/etc/passwd''|''/etc/shadow'')) BY host, hour

      ALERT WHERE hourly > p99(host_30d_distribution)

      syscall_profile = LEARN per-process short syscall sequences

      ALERT WHERE mismatch_rate(process_syscalls, syscall_profile) HIGH AND process touches credfiles'
- question: When file-access events are clustered or scored on process, parent, user, uid, hour, and day,
    which /etc/passwd or /etc/shadow accesses fall outside known-legitimate behavior clusters, and what
    features explain the anomaly?
  context: Legitimate credential-file access forms tight clusters (e.g., backup process as root at 02:00);
    adversary access tends to fall outside these. Apply DBSCAN or Isolation Forest on features (process,
    parent, user, uid==0?, hour, day) and flag events outside known legitimate clusters, emitting the
    top-3 contributing features per alert. This catches access that is individually plausible but collectively
    anomalous. A positive result is an out-of-cluster access with explainable drivers (e.g., non-root
    user at an unusual hour); a negative result lands inside an established legitimate cluster.
  answer_sources:
  - Sysmon for Linux Event ID 11
  - auditd:SYSCALL open/read
  - auditd:PATH
  - 'NAI: File system audit logs from all production Linux servers, particularly those hosting sensitive
    applications or data.'
  range: Last 90 days for training; score continuously.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [process, parent, user, uid_is_zero, hour, day]

      model = DBSCAN()  # or IsolationForest

      labels = model.fit_predict(credfile_access[features])

      ALERT WHERE label == NOISE (outside legitimate clusters)

      EMIT top3_feature_contributions'
- question: After an /etc/shadow access alert, did the same host make an outbound connection within 5
    minutes to a threat-intel-listed IP, a non-allowlisted port, or a first-seen external destination?
  context: 'The complete attack chain is read-then-exfil: credential files are accessed and the data is
    sent off-host shortly after. After an /etc/shadow access alert, search Zeek conn.log within a 5-minute
    window for connections from the same host to CTI-listed IPs, non-allowlisted ports, or first-seen
    external destinations, tying host/file/network together by shared host identifier and timestamp. A
    positive result is a tightly-correlated access-then-egress sequence that strongly indicates active
    credential exfiltration; a negative result means the read was not immediately followed by suspicious
    egress.'
  answer_sources:
  - Sysmon for Linux Event ID 11
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: A centralized security data lake or SIEM platform where host-based audit logs (AuditD, Sysmon)
    and network flow logs (Zeek) are aggregated and can be correlated by timestamp and host identifier.'
  range: Last 90 days; correlate within a 5-minute access-to-egress window.
  queries:
  - technology: SIEM/correlation pseudocode
    query: "access = FROM shadow_access_alerts\negress = FROM conn.log WHERE orig_h == access.host AND\
      \ ts BETWEEN access.ts AND access.ts+5m\nALERT WHERE egress.resp_h IN threat_intel\n  OR egress.resp_p\
      \ NOT IN allowlisted_ports\n  OR egress.resp_h NOT IN seen_destinations(access.host, 90d)"
- question: Does a composite risk score over the 5-minute post-access window - combining destination ASN/country/port
    rarity, outbound byte volume, and a failure component (blocked connections and NXDOMAIN per minute)
    - exceed the host's tuned threshold?
  context: Single signals can be noisy, so a weighted composite over the post-access window improves precision
    for credential exfil. Score the window using rarity of ASN/country/port, outbound byte volume, and
    a failure component (blocked connections / NXDOMAIN count per minute), then escalate when the composite
    exceeds a host-tuned threshold derived from 30-day baselines. This balances rare-destination, volume,
    and beaconing-failure evidence into one defensible decision. A positive result is a high composite
    score indicating concerted exfil behavior; a negative result is a low score where individual signals
    are weak.
  answer_sources:
  - Sysmon for Linux Event ID 11
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: A centralized security data lake or SIEM platform where host-based audit logs (AuditD, Sysmon)
    and network flow logs (Zeek) are aggregated and can be correlated by timestamp and host identifier.'
  range: Last 90 days; baseline over 30 days, score the 5-minute post-access window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'window = post_access_window(host, 5m)

      score = w1*rarity(asn,country,port) + w2*norm(bytes_out) + w3*failure_rate(blocked,nxdomain per
      min)

      ALERT WHERE score > host_tuned_threshold(30d_baseline)'
- question: In a whole-system provenance graph, does the subgraph process -> read(/etc/shadow) -> external-IP
    appear as an anomalous pattern, and which edges and nodes reconstruct the attack footprint?
  context: Graph-based detection captures the causal structure of an attack better than isolated events.
    Build a whole-system provenance graph of hosts/processes/files/IPs and flag the process->read(/etc/shadow)->external-IP
    subgraph as anomalous, reconstructing the attack footprint and surfacing the contributing edges/nodes
    for triage (KAIROS/ThreaTrace style). This both detects the access-to-exfil chain and hands the analyst
    a ready-made narrative of which process read the file and where the data went. A positive result is
    an anomalous subgraph linking credential-file read to external egress; a negative result shows no
    such causal path.
  answer_sources:
  - Sysmon for Linux Event ID 11
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: A centralized security data lake or SIEM platform where host-based audit logs (AuditD, Sysmon)
    and network flow logs (Zeek) are aggregated and can be correlated by timestamp and host identifier.'
  range: Last 90 days; build provenance over rolling windows.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'G = build_provenance_graph(processes, files, sockets, hosts)

      model = GraphAnomalyDetector().fit(benign_provenance)

      ALERT WHERE subgraph(process -> read(''/etc/shadow'') -> external_ip) scored anomalous

      EMIT contributing_edges, contributing_nodes'
