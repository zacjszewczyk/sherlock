  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint devices, Domain Controllers, Application Servers, Network Egress Points'
  range: Last 90 days; build 30-day rolling baselines for scoring
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=endpoint Image IN (\"*\\\\control.exe\",\"*\\\\rundll32.exe\") CommandLine=\"*.cpl*\"\
      \n  earliest=-30d\n| stats dc(host) as host_count count as cnt by cpl_hash cpl_path\n| eventstats\
      \ count as total_hosts\n| eval prevalence=host_count/total_hosts,\n       path_entropy=shannon_entropy(cpl_path)\n\
      | eval rare=if(host_count<5 OR prevalence<0.01,1,0),\n       obfuscated=if(path_entropy>p95_entropy,1,0)\n\
      | append [search index=endpoint cpl_load_failed=1 OR conn_state IN (\"RSTR\",\"REJ\")\n    | stats\
      \ count as failure_count by host cpl_hash]\n| where rare=1 OR obfuscated=1 OR failure_count>3\n\
      | table host user cpl_hash cpl_path host_count prevalence path_entropy failure_count"
- question: 'Using the machine learning approach ''Classify CPL executions with a supervised model'',
    can you determine whether an adversary is abusing control.exe/rundll32.exe to proxy execution of a
    Control Panel item (.cpl) on this host (T1218.002)? Machine Learning: Train on benign and known-malicious
    process/file/network features before scoring. Train a Random Forest or XGBoost on features (path entropy,
    parent-process rarity, command-line tokens, destination port, IP reputation, orig+resp bytes, flow
    duration) to classify each CPL execution, following the explainable parent-child anomaly approach
    of [ProblemChild](https://ar5iv.labs.arxiv.org/html/2008.04676). Surface the top-3 contributing features
    (e.g., `parent=winword.exe`, `path_entropy=4.7`, `dest_port=8443`) in the alert text, and pair with
    an unsupervised [Isolation Forest](https://doi.org/10.1145/2133360.2133363) layer to catch novel variants
    the classifier has not seen.'
