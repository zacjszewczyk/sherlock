questions:
- question: 'Using the symbolic logic approach ''Match CPL execution hashes and connections to intel'',
    can you determine whether an adversary is abusing control.exe/rundll32.exe to proxy execution of a
    Control Panel item (.cpl) on this host (T1218.002)? Symbolic Logic: Correlate the relevant process,
    file, and network telemetry before applying the rule. Search Windows Event ID 4688 / Sysmon EID 1
    for `control.exe` or `rundll32.exe` command lines referencing `.cpl` (including `shell32.dll,Control_RunDLL`),
    hash the referenced file, and compare to threat intel while correlating the process GUID with Zeek
    conn.log/dns.log within five minutes. Alert when a malicious hash AND a known-bad destination IP/domain
    co-occur. Treat any `.cpl` loaded from outside `\System32\`/`\SysWOW64\` as in-scope per the canonical
    abused-binary command lines documented for [LOLBAS Control.exe](https://lolbas-project.github.io/lolbas/Binaries/Control/)
    and [LOLBAS Rundll32.exe](https://lolbas-project.github.io/lolbas/Binaries/Rundll32/).'
  context: 'Tactic context (Stealth): adversaries abuse the trusted Control Panel binary control.exe (and
    rundll32.exe via shell32.dll,Control_RunDLL) to proxy execution of malicious .cpl payloads -- often
    renamed DLLs -- so their code blends in with legitimate Windows settings activity and may bypass application
    or file-extension allow lists. Evidence under investigation: A process executes a Control Panel item
    (.cpl file) and the file''s hash matches a known malicious hash, or the process initiates a network
    connection to a destination on a threat intelligence feed. Use process creation telemetry for command-line,
    parent-process, and user context. Validate the behavior against Zeek connection and DNS telemetry
    for destination, timing, and reputation context. Approach (Match CPL execution hashes and connections
    to intel): Symbolic Logic: Correlate the relevant process, file, and network telemetry before applying
    the rule. Search Windows Event ID 4688 / Sysmon EID 1 for `control.exe` or `rundll32.exe` command
    lines referencing `.cpl` (including `shell32.dll,Control_RunDLL`), hash the referenced file, and compare
    to threat intel while correlating the process GUID with Zeek conn.log/dns.log within five minutes.
    Alert when a malicious hash AND a known-bad destination IP/domain co-occur. Treat any `.cpl` loaded
    from outside `\System32\`/`\SysWOW64\` as in-scope per the canonical abused-binary command lines documented
    for [LOLBAS Control.exe](https://lolbas-project.github.io/lolbas/Binaries/Control/) and [LOLBAS Rundll32.exe](https://lolbas-project.github.io/lolbas/Binaries/Rundll32/).
    A positive result indicates a Control Panel item executed or registered in a way that is malicious,
    untrusted, abnormally located/named, freshly dropped, abnormally parented, or generating anomalous
    network/registry activity for that host/user/fleet; a negative result means the observed control.exe/.cpl
    activity matches expected, signed, well-known baselines. Investigate the named area of interest (Endpoint
    devices, Domain Controllers, Application Servers, Network Egress Points) and pivot from any hit to
    the executing process, its parent and command line, the .cpl file''s origin and hash on disk, the
    writing process, any registered Cpls value, and follow-on child processes or network egress.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint devices, Domain Controllers, Application Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=endpoint (EventCode=4688 OR (source=Sysmon EventCode=1))\n  Image IN (\"*\\\\control.exe\"\
      ,\"*\\\\rundll32.exe\")\n  (CommandLine=\"*.cpl*\" OR CommandLine=\"*Control_RunDLL*\")\n| where\
      \ NOT match(cpl_path, \"(?i)\\\\\\\\(System32|SysWOW64)\\\\\\\\\")\n     OR cpl_hash IN (threat_intel_hashes)\n\
      \     OR ParentImage NOT IN (\"explorer.exe\",\"svchost.exe\",\"services.exe\")\n| join ProcessGuid\
      \ [search Zeek conn.log dns.log dest IN (threat_intel_dst)]\n| eval severity=case(parent IN (\"\
      winword.exe\",\"excel.exe\",\"outlook.exe\",\n    \"powershell.exe\",\"cmd.exe\",\"wscript.exe\"\
      ,\"mshta.exe\"),\"high\",true(),\"medium\")\n| table _time host user ParentImage Image CommandLine\
      \ cpl_path cpl_hash dest severity"
- question: 'Using the statistical method approach ''Score rare CPL hashes for investigation'', can you
    determine whether an adversary is abusing control.exe/rundll32.exe to proxy execution of a Control
    Panel item (.cpl) on this host (T1218.002)? Statistical Method: Establish rolling host, user, and
    enterprise baselines before scoring rarity. Compute prevalence of each `.cpl` hash and its file path
    across the enterprise over 30 days and flag hashes observed on fewer than 5 hosts or <1% of endpoints
    as rare artifacts, applying the prevalence/frequency-thresholding approach Red Canary recommends for
    LOLBin triage in [LOLBins Abuse](https://redcanary.com/blog/blog/lolbins-abuse/). Also profile the
    FAILURE mode: count `.cpl` loads that error out or whose subsequent connection is blocked/RST, as
    repeated failed loads of the same artifact indicate iterative attacker testing.'
