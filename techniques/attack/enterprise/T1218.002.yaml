- question: 'Using the symbolic logic approach ''Alert when control.exe has non-standard parents'', can
    you determine whether an adversary is abusing control.exe/rundll32.exe to proxy execution of a Control
    Panel item (.cpl) on this host (T1218.002)? Symbolic Logic: Detect `control.exe` / `rundll32.exe`
    creations (Windows Event ID 4688 / Sysmon EID 1) whose parent is not in the allowlist (`explorer.exe`,
    `svchost.exe`, `services.exe`) and raise high-severity alerts for document/interpreter parents (`winword.exe`,
