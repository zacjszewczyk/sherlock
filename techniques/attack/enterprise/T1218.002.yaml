name: 'T1218.002: System Binary Proxy Execution: Control Panel'
id: 7abfbbf8-a9b9-425c-973b-9372e5661155
description: 'This playbook helps an analyst determine whether an adversary is abusing the Windows Control
  Panel binary (control.exe) -- or rundll32.exe loading shell32.dll,Control_RunDLL -- to proxy execution
  of malicious payloads via Control Panel items (.cpl files), which are registered executables or renamed
  DLLs that export CPlApplet (T1218.002). It correlates process-creation telemetry (Windows Event ID 4688,
  Sysmon Event ID 1) with file-creation (Sysmon Event ID 11), registry (Sysmon Event ID 13), module-load
  (Sysmon Event ID 7), and network telemetry (Zeek conn.log and dns.log) to surface malicious CPL execution
  across the Stealth/defense-evasion tactic. Investigative angles include: threat-intel hash matches on
  executed .cpl files and post-execution connections to known-bad destinations; .cpl files run from outside
  \System32\/\SysWOW64\ (user profiles, %TEMP%, %ProgramData%, Alternate Data Streams, or network shares);
  control.exe spawned by abnormal parents (winword.exe, excel.exe, outlook.exe, powershell.exe, cmd.exe,
  wscript.exe, mshta.exe) or spawning rundll32.exe to load a non-Shell32 DLL; write-then-execute chains
  where a dropped .cpl is run within 60 seconds; anomalous post-CPL network beaconing/exfiltration; and
  CPL-persistence registry writes under HKCU\...\Control Panel\Cpls pointing to non-standard paths (the
  InvisiMole variant). Detection blends symbolic-logic rules, statistical baselining (fleet prevalence
  floors, Shannon entropy of paths/domains, time-delta and volume/frequency outliers, failure-mode counts),
  and machine learning (Random Forest/XGBoost classifiers, one-class SVM/Isolation Forest, provenance/graph
  models, HMM/sequence models, and RITA-style beacon cadence scoring) to produce evasion-resistant, explainable
  alerts for the SOC.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
