- question: 'Using the symbolic logic approach ''Alert on CPL paths outside system directories'', can
    you determine whether an adversary is abusing control.exe/rundll32.exe to proxy execution of a Control
    Panel item (.cpl) on this host (T1218.002)? Symbolic Logic: Use Windows Event ID 4688 / Sysmon EID
    1 to find `control.exe` or `rundll32.exe` executing `.cpl` files, extract the path, and alert when
    it is NOT under `C:\Windows\System32` / `C:\Windows\SysWOW64` (i.e., user profiles, `%TEMP%`, `%ProgramData%`,
    ADS, or network shares). This is the deterministic condition encoded in the SigmaHQ [Control Panel
    Items rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_control_panel_item.yml),
    which filters benign `\System32\`/`igfxCPL.cpl` cases. Also flag execution from Alternate Data Streams
    as documented for [LOLBAS Control.exe](https://lolbas-project.github.io/lolbas/Binaries/Control/).'
