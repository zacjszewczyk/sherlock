questions:
- question: '[Persistence] Match accessibility binary replacement and IFEO debugger registration deterministically:
    Can you determine whether an accessibility feature binary (e.g., sethc.exe, utilman.exe) is replaced
    by a file with a known malicious hash, or its Image File Execution Options (IFEO) registry key (HKLM\SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\Image File Execution Options\<binary>) is modified to point to a malicious debugger
    executable. -- specifically, using the ''Match accessibility binary replacement and IFEO debugger
    registration deterministically'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Windows accessibility
    features (e.g., sethc.exe ''sticky keys'', utilman.exe, osk.exe, magnify.exe, narrator.exe, displayswitch.exe,
    atbroker.exe) by replacing the binary or redirecting it via an Image File Execution Options (IFEO)
    ''Debugger'' registry value, so that pressing a key combination at the Windows logon screen (including
    over RDP) launches a SYSTEM-level shell or backdoor without authentication. This evidence focuses
    on the condition that an accessibility feature binary (e.g., sethc.exe, utilman.exe) is replaced by
    a file with a known malicious hash, or its Image File Execution Options (IFEO) registry key (HKLM\SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\Image File Execution Options\<binary>) is modified to point to a malicious debugger
    executable. This Symbolic Logic approach looks for the following signal: Alert on file creation/overwrite
    (Sysmon EID 11, Windows EID 4663) in C:\Windows\System32\ where the target filename is in {sethc.exe,
    utilman.exe, osk.exe, magnify.exe, narrator.exe, displayswitch.exe, atbroker.exe}, and on registry
    value set (Sysmon EID 13, Windows EID 4657) of the ''Debugger'' value under HKLM\SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\Image File Execution Options\<accessibility binary>. Use the T1546.008-tagged Sigma
    rules that match `copy /y cmd.exe sethc.exe` and reg command lines containing the IFEO path plus an
    accessibility binary name ([SigmaHQ sticky-key / debugger rules](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_cmd_sticky_keys_replace.yml));
    ensure the underlying Sysmon registry/file includes are enabled per [SwiftOnSecurity Sysmon config](https://github.com/SwiftOnSecurity/sysmon-config).
    Validate coverage with [Atomic Red Team T1546.008](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1546.008/T1546.008.md).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates that an accessibility
    binary or its IFEO key has been tampered with, or that an accessibility process is behaving as a launcher
    for shells, account manipulation, or C2, which is a high-confidence sign of accessibility-feature
    hijacking; pivot to the writing/parent process and its lineage, the host and logon session, the modified
    file/registry key, any new accounts or privileged-group changes, and subsequent network connections.
    A negative result helps rule out this vector for the examined hosts but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy IFEO backdoors, signed-binary
    replacements, or living-off-the-land tampering.'
