name: 'T1546.008: Accessibility Features'
id: e6e52c2c-1be1-4253-9f09-180569766a86
description: 'This playbook helps an analyst investigate whether an adversary is hijacking Windows accessibility
  features (sticky keys/sethc.exe, utilman.exe, osk.exe, magnify.exe, narrator.exe, displayswitch.exe,
  atbroker.exe) to establish persistence and/or escalate privileges, per MITRE ATT&CK T1546.008. It covers
  both halves of the abuse: (1) the setup, where an accessibility binary in C:\Windows\System32 is replaced
  (often with cmd.exe) or its Image File Execution Options (IFEO) ''Debugger'' registry value is pointed
  at a malicious executable -- frequently preceded by a takeown.exe -> icacls.exe -> overwrite chain or
  driven by an unexpected, non-maintenance parent process; and (2) the payoff, where pressing the accessibility
  key combination at the logon screen (locally or over RDP) executes a SYSTEM-level shell that performs
  reconnaissance, credential dumping, account creation and privileged-group additions, or outbound C2.
  Detection angles span deterministic symbolic-logic rules (binary-replacement and IFEO matching, hash/signature
  comparison against golden baselines, takeover-chain and parent allowlist logic, accessibility-parent/child
  and command-line pattern matching, C2/CTI correlation), statistical baselining (enterprise prevalence
  of debugger values and hashes, rare parents, permission-change and object-access volumes, inter-action
  time deltas, command-line entropy, and network rarity/beaconing), and machine-learning models (provenance-graph
  autoencoders, sequence/LSTM models, rare-path and tree-based classifiers, command-line DNNs, and flow
  autoencoders). Evidence draws on Windows Security events (4663, 4657, 4670, 4720, 4728, 4732, 4756),
  Sysmon (EIDs 1, 3, 11, 13, 15), and Zeek conn/dns/ssl logs, so the analyst can corroborate suspected
  accessibility-feature hijacking across file, registry, process-lineage, account, and network telemetry.'
type: technique
