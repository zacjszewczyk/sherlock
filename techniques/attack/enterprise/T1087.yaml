questions:
- question: 'Using deterministic rule logic, can you determine whether the approach ''Account-enumeration
    watchlist'' reveals Account Discovery (T1087) activity for the Discovery tactic? Specifically: Monitor
    process creation (Sysmon EID 1 / Windows EID 4688) and PowerShell script-block logs (EID 4104) for
    known account-discovery commands and tools such as `net user`, `net group`, `net localgroup`, `net
    accounts`, `whoami /all`, `Get-LocalUser`, `Get-ADUser`, `Get-ADGroup`, `Get-Mailbox`, `Get-Recipient`,
    `dsquery`, `AdFind`, `aws iam list-users`, `Get-MgUser`, and BloodHound-style collectors, following
    [CAR-2013-07-001: Suspicious Arguments](https://car.mitre.org/analytics/CAR-2013-07-001/) and the
    [SigmaHQ rule corpus](https://github.com/SigmaHQ/sigma). Alert when these execute on hosts that do
    not normally administer identities, when launched by an unusual parent (Office/web-server/browser),
    or when one process pivots from local to domain to cloud listing.'
  context: 'Tactic context (Discovery): adversaries enumerate valid accounts, usernames, groups, email
    addresses, and cloud/identity principals to orient themselves post-compromise and to plan follow-on
    actions such as brute-forcing, password spraying, spear-phishing, account takeover, privilege escalation,
    and lateral movement. Evidence under investigation: Account discovery across local, domain, email,
    and cloud identities appears as bursts of user, group, mailbox, or principal listings from a host
    that normally does not enumerate accounts. The evidence includes command-line or script activity that
    requests many names or identity objects in rapid succession, especially when the results are collected
    for follow-on attack planning. Approach (Account-enumeration watchlist): Monitor process creation
    (Sysmon EID 1 / Windows EID 4688) and PowerShell script-block logs (EID 4104) for known account-discovery
    commands and tools such as `net user`, `net group`, `net localgroup`, `net accounts`, `whoami /all`,
    `Get-LocalUser`, `Get-ADUser`, `Get-ADGroup`, `Get-Mailbox`, `Get-Recipient`, `dsquery`, `AdFind`,
    `aws iam list-users`, `Get-MgUser`, and BloodHound-style collectors, following [CAR-2013-07-001: Suspicious
    Arguments](https://car.mitre.org/analytics/CAR-2013-07-001/) and the [SigmaHQ rule corpus](https://github.com/SigmaHQ/sigma).
    Alert when these execute on hosts that do not normally administer identities, when launched by an
    unusual parent (Office/web-server/browser), or when one process pivots from local to domain to cloud
    listing. A positive result means a host, user, principal, or process is enumerating accounts or identity
    objects in a pattern inconsistent with its established baseline or peers (e.g., watchlisted commands,
    RPC/LDAP enumeration bursts, unusual parent lineage, honeytoken touches, or cloud API listing sprees
    with AccessDenied probing); a negative result means the observed activity matches expected administrative
    behavior. Pursue it by pivoting from any hit to the originating process, parent, account, and source
    host/IP, then to downstream credential-access, collection, or lateral-movement attempts. Investigate
    the named area of interest (Domain Controllers, Member Servers, Privileged Access Workstations).'
