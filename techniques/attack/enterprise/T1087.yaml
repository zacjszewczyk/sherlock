  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Account-discovery command/tool watchlist\nMATCH proc_create (EID 4688 OR Sysmon EID 1)\
      \ OR ps_scriptblock (EID 4104)\nWHERE cmdline MATCHES /(net\\s+(user|group|localgroup|accounts)|whoami\\\
      s+\\/all|Get-(LocalUser|ADUser|ADGroup|Mailbox|Recipient|MgUser)|dsquery|AdFind|aws iam list-users|SharpHound|BloodHound)/i\n\
      AND (host NOT IN identity_admin_hosts\n     OR parent_image IN ['WINWORD.EXE','EXCEL.EXE','OUTLOOK.EXE','w3wp.exe','chrome.exe'])\n\
      // escalate if one process pivots local -> domain -> cloud listing\nALERT high"
