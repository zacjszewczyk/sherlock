- question: 'Using statistical baselining, can you determine whether the approach ''Enumeration rarity
    and burst baseline'' reveals Account Discovery (T1087) activity for the Discovery tactic? Specifically:
    Build per-host 30-day baselines for account-query frequency (count/min), distinct identity objects
    queried (Volume), and command-line entropy. Flag sessions exceeding the 99th percentile or +3σ, or
    that enumerate hundreds of accounts in a short burst across multiple identity sources. Apply change-point
    detection (CUSUM/PELT/Bayesian) per [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)
    to the per-host distinct-object time series to catch abrupt regime shifts. Profile failure as a distinct
    signal: spikes in EID 4662 access-denied, SAMR/LDAP error ratios, and Kerberos `KDC_ERR_S_PRINCIPAL_UNKNOWN`
    indicate brute enumeration of non-existent principals. Derive thresholds on the [LANL](https://csr.lanl.gov/data/cyber1/)
    corpus.'
