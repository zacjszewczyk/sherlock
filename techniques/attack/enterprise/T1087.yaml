name: 'T1087: Account Discovery'
id: af8fac67-f36b-4490-85da-1eb3dd3f5f0a
description: 'This playbook helps an analyst determine whether an adversary is performing Account Discovery
  (T1087): enumerating valid local, domain, email, cloud, and SaaS accounts, usernames, groups, and identity
  objects to enable follow-on brute-forcing, spear-phishing, account takeover, lateral movement, or privilege
  escalation. It correlates host process and script telemetry (Windows EID 4688 / Sysmon EID 1, PowerShell
  script-block EID 4104, SAMR object access EID 4662, group enumeration EID 4798/4799, auditd, macOS unified
  log) with network directory-service telemetry (Zeek dce_rpc.log, ldap.log, kerberos.log, conn.log),
  file-access and honeytoken events (EID 4663/5145/4720), and cloud/identity-provider control-plane logs
  (AWS CloudTrail, Azure/Microsoft Graph sign-in logs, GCP audit, Okta system log, M365 unified). Investigative
  angles include: account-discovery command and tool watchlists (net user/group, whoami /all, Get-ADUser,
  dsquery, AdFind, BloodHound, aws iam list-users, Get-MgUser), SAMR/LSARPC RPC enumeration bursts, suspicious
  parent-child process lineage (Office/browser/web-server spawning interpreters), anomalous LDAP search
  volume and filter entropy, Kerberos KDC_ERR_S_PRINCIPAL_UNKNOWN sweeps, canary-account and decoy-file
  access, and cloud identity-listing API bursts with AccessDenied probing. Detection blends symbolic-logic
  rules, statistical baselining (percentiles, +3 sigma, entropy, change-point detection), and machine
  learning (Isolation Forest, One-Class SVM, command-line embeddings, LSTM autoencoders, link-anomaly
  GNNs, provenance-graph modeling) to produce evasion-resistant, explainable alerts for the Discovery
  tactic.'
type: technique
