name: 'T1686.003: Windows Host Firewall'
id: 1db12bb9-a33e-4f18-8f51-ccc80ebf0a05
description: 'This playbook helps an analyst investigate whether an adversary has disabled or modified
  the Windows host firewall (Windows Defender Firewall / mpssvc) to bypass controls that limit network
  usage (MITRE ATT&CK T1686.003, Windows Host Firewall, under the Defense Impairment tactic). Adversaries
  weaken host filtering to enable remote services, open inbound/outbound ports for command and control,
  and stage further actions. The hunt pursues the behavior from several complementary angles: execution
  of firewall-management utilities and cmdlets that turn filtering off or add exposure (netsh advfirewall
  set state off, netsh advfirewall firewall add rule, Set-NetFirewallProfile -Enabled False, New-NetFirewallRule,
  Disable-NetFirewallRule); registry edits that set EnableFirewall=0, change DefaultInboundAction/DisableNotifications,
  or disable firewall LOGGING under the Standard/Domain/Public profile policy keys and the SharedAccess
  FirewallPolicy parameters; mpssvc service-state and start-type transitions; native firewall audit events
  (4946 add / 4947 modify / 4948 delete / 4950 setting-change); and follow-on connectivity where a (dst,port)
  tuple that previously logged blocked (5152/5157) now completes allowed (5156) shortly after the change.
  Detection methods combine deterministic symbolic-logic rules (utility/cmdlet execution signatures, registry/profile
  disable detection, logging-tamper high-weight signals), statistical baselining (per-host/role firewall
  event-volume baselines with mean+3-sigma/z-score thresholds, rare parent-child pairings, and correlation
  of firewall changes with new network exposure and beaconing), and machine learning (sequence/graph provenance
  models such as DistilBERT command-stream scoring, DeepLog LSTM log modeling, POIROT/KAIROS/ThreaTrace
  provenance matching, and explainable Isolation Forest / One-Class SVM outlier scoring with SHAP/LIME
  attribution), applied across Windows Security, System, Sysmon, and PowerShell event logs plus Zeek conn.log
  and Windows pfirewall.log, so the analyst can corroborate suspected host-firewall tampering against
  process, user/logon, registry, service, and network-exposure context.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: '[Defense Impairment] Firewall configuration utility execution and rule modification: Can
    you identify executions of netsh.exe or PowerShell NetSecurity cmdlets that disable filtering or add
    network exposure on a Windows host -- for example ''netsh advfirewall set <profile> state off'', ''netsh
    advfirewall firewall add rule'', ''Set-NetFirewallProfile -Enabled False'', ''New-NetFirewallRule'',
    or ''Disable-NetFirewallRule'' -- and tie each to the executing user, parent process, and the ports/programs
    the new rule exposes, using the ''Firewall Configuration Utility Execution and Rule Modification''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary disables or modifies
    the Windows host firewall to bypass controls that limit network usage, opening ports for command and
    control or remote-service access. This evidence focuses on command-line and cmdlet execution that
    turns filtering off or adds exposure. The approach works by alerting on Event ID 4688 / Sysmon 1 process
    creation and PowerShell 4104 script-block content matching netsh firewall disable/add-rule patterns
    and the equivalent NetSecurity cmdlets (see [Sigma: Firewall Disabled via Netsh](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_netsh_fw_disable.yml),
    [Sigma: New Firewall Rule Added via Netsh](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_netsh_fw_add_rule.yml),
    and [Atomic Red Team T1562.004](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.004/T1562.004.md)).
    Verify whether the actor is non-administrative or the parent is suspicious (Office, browser, or a
    temp-directory binary), and flag rule names/descriptions that expose uncommon ports, high-risk executables,
    or any-to-any access. Suppress known maintenance using change-ticket/installer allow-lists; the legitimate
    management surface is documented by Microsoft in [Configure Windows Firewall](https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/configure).
    A positive result -- a command match from an unusual actor or parent -- indicates probable host-firewall
    tampering; pivot to the host, user/logon session, parent-process chain, the specific rule/profile
    changed, and any new connections on the opened port. A negative result helps rule out the utility-driven
    vector but should be corroborated with the registry, service, statistical, and ML questions, since
    attackers can disable the firewall via the registry or APIs without invoking netsh/PowerShell.'
  answer_sources:
  - Windows Security Event Logs (Event IDs 4946, 4947, 4948, 4950 firewall rule add/modify/delete/setting-change;
    4688 process creation; 4657 registry value change; 4624/4625 logon; 5152/5156/5157 WFP filtering)
  - Windows System Event Logs (Event IDs 7036/7040 for mpssvc service state/start-type changes; 7045 service
    install)
  - Sysmon Event Logs (Event IDs 1 process, 3 network, 12/13/14 registry)
  - Windows PowerShell Logs (Event IDs 4103, 4104 script block)
  - Registry auditing (HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy and
    HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\{Standard,Domain,Public}Profile)
  - Network telemetry (Zeek conn.log; Windows Firewall pfirewall.log)
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (WinEventLog:Security EventCode=4688, WinEventLog:Sysmon EventCode=1, WinEventLog:PowerShell\
      \ EventCode=4104)\nWHERE (process_name IN ('netsh.exe','powershell.exe','pwsh.exe'))\nAND (CommandLine\
      \ MATCHES /advfirewall\\s+set\\s+\\w+\\s+state\\s+off/i\n  OR CommandLine MATCHES /firewall\\s+set\\\
      s+opmode\\s+disable/i\n  OR CommandLine MATCHES /advfirewall\\s+firewall\\s+add\\s+rule/i\n  OR\
      \ ScriptBlockText MATCHES /Set-NetFirewallProfile.*-Enabled\\s+False/i\n  OR ScriptBlockText MATCHES\
      \ /New-NetFirewallRule/i\n  OR ScriptBlockText MATCHES /Disable-NetFirewallRule/i)\nAND NOT (user\
      \ IN admin_allowlist AND change_ticket_active(host, _time))\n| eval suspicious_parent = parent_process\
      \ IN ('winword.exe','excel.exe','outlook.exe','chrome.exe','msedge.exe') OR parent_path MATCHES\
      \ /\\\\(Temp|AppData|Downloads)\\\\/i\n| where suspicious_parent OR user NOT IN admin_allowlist\n\
      | table _time host user parent_process process_name CommandLine ScriptBlockText"
- question: '[Defense Impairment] Registry and profile disable detection: Can you detect when ''EnableFirewall''
    is set to DWORD 0 (or DisableNotifications / DefaultInboundAction is changed) under HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\{Standard,Domain,Public}Profile
    or the SharedAccess FirewallPolicy parameters, and separately when firewall LOGGING (LogDroppedPackets/LogSuccessfulConnections)
    is turned off, correlating these with mpssvc service-state changes, using the ''Registry and Profile
    Disable Detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), adversaries can disable the
    Windows host firewall directly through the registry, bypassing netsh/PowerShell signatures entirely.
    This evidence focuses on registry value changes that disable the firewall or its notifications and
    default actions. The approach alerts on Sysmon 13 / Event ID 4657 changes where EnableFirewall is
    set to 0 (or DisableNotifications/DefaultInboundAction is altered) under the per-profile policy keys
    and SharedAccess FirewallPolicy parameters (see [Sigma: Disable Windows Firewall by Registry](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_disable_windows_firewall.yml)).
    Disabling firewall LOGGING (LogDroppedPackets/LogSuccessfulConnections off) is treated as a distinct
    high-weight tamper signal because it blinds downstream telemetry ([Microsoft Configure Windows Firewall
    logging](https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/configure-logging)).
    Correlating with mpssvc state changes (Event ID 7036/7040) ensures the registry, service, and policy
    paths are all covered even when command-line tools are not used. A positive result -- an EnableFirewall=0
    write or a logging-disable edit, especially alongside an mpssvc stop -- indicates probable host-firewall
    tampering; pivot to the writing process, user/logon, and subsequent connectivity. A negative result
    helps rule out the registry vector but should be corroborated with the utility, service, statistical,
    and ML questions.'
  answer_sources:
  - Windows Security Event Logs (Event IDs 4946, 4947, 4948, 4950 firewall rule add/modify/delete/setting-change;
    4688 process creation; 4657 registry value change; 4624/4625 logon; 5152/5156/5157 WFP filtering)
  - Windows System Event Logs (Event IDs 7036/7040 for mpssvc service state/start-type changes; 7045 service
    install)
  - Sysmon Event Logs (Event IDs 1 process, 3 network, 12/13/14 registry)
  - Windows PowerShell Logs (Event IDs 4103, 4104 script block)
  - Registry auditing (HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy and
    HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\{Standard,Domain,Public}Profile)
  - Network telemetry (Zeek conn.log; Windows Firewall pfirewall.log)
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (WinEventLog:Sysmon EventCode IN (12,13,14), WinEventLog:Security EventCode=4657)\n\
      WHERE TargetObject MATCHES /WindowsFirewall\\\\(Standard|Domain|Public)Profile/i\n  OR TargetObject\
      \ MATCHES /SharedAccess\\\\Parameters\\\\FirewallPolicy/i\n| eval disable_fw = (Details=='DWORD\
      \ (0x00000000)' AND TargetObject MATCHES /EnableFirewall$/i)\n| eval disable_logging = TargetObject\
      \ MATCHES /(LogDroppedPackets|LogSuccessfulConnections)$/i AND Details=='DWORD (0x00000000)'\n|\
      \ eval action_change = TargetObject MATCHES /(DefaultInboundAction|DisableNotifications)$/i\n| where\
      \ disable_fw OR disable_logging OR action_change\n| eval weight = case(disable_logging, 3, disable_fw,\
      \ 3, action_change, 2)\n| table _time host user process_name TargetObject Details weight"
  - technology: SIEM/Rule pseudocode
    query: '// Correlate registry disable with mpssvc service state change within 10m

      source=WinEventLog:System EventCode IN (7036,7040) Service=''Windows Defender Firewall'' (State=''stopped''
      OR start_type=''disabled'')

      | join host [search registry_firewall_disable_events]

      | where abs(svc_time - reg_time) < 10m

      | table _time host user reg_TargetObject svc_State'
- question: '[Defense Impairment] Profile and registry change baseline: Can you establish per-host and
    per-role baselines for firewall event volume -- counts of native firewall audit events (4946 add /
    4947 modify / 4948 delete / 4950 setting-change), 4688 netsh executions, and 4657 / Sysmon 13 FirewallPolicy
    edits per 24h -- and alert when a host exceeds mean+3-sigma or shows rare parent-child pairings, using
    the ''Profile and Registry Change Baseline'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), a sudden burst of firewall
    changes (or rare actors performing them) can reveal tampering that individual signatures miss. This
    evidence focuses on statistical deviation in firewall-related event volume and provenance. The approach
    counts native firewall audit events (4946/4947/4948/4950), netsh executions (4688), and FirewallPolicy
    edits (4657 / Sysmon 13) per host per 24h, derives thresholds from 30 days of history, and alerts
    when a host exceeds mean+3-sigma or a percentile/z-score spike, or when a rare parent-child pairing
    performs the change (see [Detecting EDR Killers Using Statistical Deviations](https://www.cardinalops.com/blog/detecting-edr-killers-using-statistical-deviations/)
    and [Finding Anomalies in Windows Event Logs](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)).
    Validate spikes against maintenance windows. Track the failure state explicitly: a spike in denied
    service-control attempts (7045/access-denied) or access-denied registry writes preceding a successful
    disable is itself suspicious. A positive result -- a host whose firewall-change volume or actor provenance
    deviates sharply from baseline -- indicates probable tampering; pivot to the specific changes and
    the responsible process/user. A negative result helps rule out volumetric anomalies but should be
    corroborated with the signature-based and ML questions, since a single low-volume change can still
    disable the firewall.'
  answer_sources:
  - Windows Security Event Logs (Event IDs 4946, 4947, 4948, 4950 firewall rule add/modify/delete/setting-change;
    4688 process creation; 4657 registry value change; 4624/4625 logon; 5152/5156/5157 WFP filtering)
  - Windows System Event Logs (Event IDs 7036/7040 for mpssvc service state/start-type changes; 7045 service
    install)
  - Sysmon Event Logs (Event IDs 1 process, 3 network, 12/13/14 registry)
  - Windows PowerShell Logs (Event IDs 4103, 4104 script block)
  - Registry auditing (HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy and
    HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\{Standard,Domain,Public}Profile)
  - Network telemetry (Zeek conn.log; Windows Firewall pfirewall.log)
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days (baseline 30 days; evaluate per 24h window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source IN (WinEventLog:Security EventCode IN (4946,4947,4948,4950,4688), WinEventLog:Sysmon\
      \ EventCode=13)\n| filter firewall_related(EventCode, process_name, TargetObject)\n| bin _time span=24h\n\
      | stats count AS fw_events by host role _time\n| eventstats avg(fw_events) AS mu stdev(fw_events)\
      \ AS sigma by host\n  [over trailing 30d baseline]\n| eval z = (fw_events - mu) / (sigma + 0.0001)\n\
      | where z > 3 OR fw_events > p95_by_role(role)\n| table _time host role fw_events mu sigma z"
  - technology: SIEM/Stats pseudocode
    query: '// Rare parent-child + denied-control precursor scoring

      source=WinEventLog:Security EventCode IN (4688,4657) firewall_related

      | stats count by host parent_process process_name

      | eventstats sum(count) AS total by host

      | eval rarity = count/total | where rarity < 0.01

      | append [search EventCode IN (7045) Status=''access denied'' OR EventCode=4657 AccessDenied=true
      firewall_related]

      | table _time host parent_process process_name rarity precursor_denied'
- question: '[Defense Impairment] Correlate firewall changes with new exposure: Can you confirm that a
    firewall profile edit, rule addition, or service change actually exposed the host -- specifically
    by finding a (dst,port) tuple that previously logged blocked/REJ (Event ID 5152/5157) but now completes
    allowed (5156) within minutes of the change -- and then score the resulting outbound traffic for beaconing/long-connections,
    using the ''Correlate Firewall Changes With New Exposure'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the impact of firewall tampering
    is confirmed when previously blocked traffic begins to flow. This evidence focuses on the state-flip
    between blocked and allowed connectivity tied to a firewall change. The approach builds a per-flow
    baseline of Volume (byte counts/ratios), Frequency (conn/min), and State, then surfaces the key state-flip
    where a (dst,port) tuple previously denied (5152/5157) now completes (5156) within minutes of the
    change, following per-flow temporal profiling ([Single Flow Time Series Analysis](https://dl.acm.org/doi/abs/10.5555/3581644.3581681)).
    Resulting outbound periodicity/long-connections (beaconing) are scored with [RITA](https://github.com/activecm/rita)
    over Zeek conn.log, and allow rules originating from uncommon parent processes, temporary directories,
    or non-administrative sessions are flagged; combined host+network baselines can be validated on the
    [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518). A positive result -- a blocked->allowed
    state-flip followed by periodic outbound traffic shortly after a firewall change -- strongly indicates
    malicious host-firewall modification enabling C2; pivot to the destination, port, process, and rule.
    A negative result helps rule out exposure-confirmed tampering but should be corroborated with the
    signature, registry, and ML questions, since C2 may use already-allowed ports.'
  answer_sources:
  - Windows Security Event Logs (Event IDs 4946, 4947, 4948, 4950 firewall rule add/modify/delete/setting-change;
    4688 process creation; 4657 registry value change; 4624/4625 logon; 5152/5156/5157 WFP filtering)
  - Windows System Event Logs (Event IDs 7036/7040 for mpssvc service state/start-type changes; 7045 service
    install)
  - Sysmon Event Logs (Event IDs 1 process, 3 network, 12/13/14 registry)
  - Windows PowerShell Logs (Event IDs 4103, 4104 script block)
  - Registry auditing (HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy and
    HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\{Standard,Domain,Public}Profile)
  - Network telemetry (Zeek conn.log; Windows Firewall pfirewall.log)
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days (correlate within minutes of each firewall change event)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// State-flip: blocked (5152/5157) then allowed (5156) for same dst+port near a fw change\n\
      source=WinEventLog:Security EventCode IN (5152,5156,5157)\n| transaction host dest_ip dest_port\
      \ maxspan=60m\n| where like_state_sequence('blocked->allowed') \n| join host [search firewall_change_events]\n\
      | where (allowed_time - change_time) BETWEEN 0 AND 15m\n| table _time host process_name dest_ip\
      \ dest_port change_event"
  - technology: Zeek/pseudocode
    query: '// Beacon/long-connection scoring on post-change flows

      rita import conn.log

      rita show-beacons --threshold 0.7

      | filter src_host IN hosts_with_recent_firewall_change

      | eval long_conn = duration > 3600 OR conn_count_per_hour periodic

      | table src_host dst_ip dst_port beacon_score interval_consistency long_conn'
- question: '[Defense Impairment] Sequence and provenance anomaly detection: Can you distinguish routine
    administration from adversarial firewall impairment by scoring PowerShell/cmd command streams with
    a transformer (DistilBERT MLM), modeling out-of-sequence firewall-event keys (disable -> profile-change
    -> service-stop -> new connection) with an LSTM log model, and matching the multi-stage tamper chain
    (suspicious-proc -> firewall change -> outbound conn) as a provenance subgraph, using the ''Sequence
    and Provenance Anomaly Detection'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), sophisticated actors interleave
    firewall changes with logon, service, and connection events in sequences that look abnormal even when
    each step seems benign. This evidence focuses on sequence- and graph-based modeling of the tamper
    chain. The approach scores command-shell sessions with a DistilBERT masked-language model to surface
    anomalous tokens plus the nearest-normal session ([Anomaly Detection of Command Shell Sessions](https://arxiv.org/abs/2310.13247)),
    models out-of-sequence firewall-event keys with [DeepLog](https://acmccs.github.io/papers/p1285-duA.pdf)-style
    LSTM log modeling, and encodes the multi-stage chain (suspicious-proc -> firewall change -> outbound
    conn) as a provenance subgraph matched/scored with [POIROT](https://dl.acm.org/doi/10.1145/3319535.3363217),
    the [KAIROS](https://tfjmp.org/publications/2024-sp.pdf) temporal autoencoder, and node-level [ThreaTrace](https://arxiv.org/pdf/2111.04333).
    Scores increase when logon, service change, firewall disablement, and new external connectivity occur
    in a short, unusual sequence. A positive result -- a high-scoring anomalous command session or a matched
    tamper-chain subgraph -- indicates probable adversarial impairment; pivot to the full session, the
    involved processes, and the resulting connectivity. A negative result helps rule out anomalous sequencing
    but should be corroborated with the deterministic and statistical questions, and models require labeled/baseline
    data and tuning to limit false positives.'
  answer_sources:
  - Windows Security Event Logs (Event IDs 4946, 4947, 4948, 4950 firewall rule add/modify/delete/setting-change;
    4688 process creation; 4657 registry value change; 4624/4625 logon; 5152/5156/5157 WFP filtering)
  - Windows System Event Logs (Event IDs 7036/7040 for mpssvc service state/start-type changes; 7045 service
    install)
  - Sysmon Event Logs (Event IDs 1 process, 3 network, 12/13/14 registry)
  - Windows PowerShell Logs (Event IDs 4103, 4104 script block)
  - Registry auditing (HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy and
    HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\{Standard,Domain,Public}Profile)
  - Network telemetry (Zeek conn.log; Windows Firewall pfirewall.log)
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days (train on >=30 days of host sequences)
  queries:
  - technology: ML/pseudocode
    query: '// Command-stream scoring + log-key sequence modeling

      sessions = group(PowerShell 4104 + Security 4688 by host,user,logon_session)

      score = DistilBERT_MLM.anomaly(sessions.tokens)

      surface top_anomalous_tokens + nearest_normal_session

      log_keys = template(firewall_events: disable, profile_change, service_stop, new_conn)

      seq_score = DeepLog_LSTM.predict_next(log_keys)

      alert where score > thr OR observed_key NOT IN top_k_predicted'
  - technology: ML/pseudocode
    query: '// Provenance subgraph matching of tamper chain

      graph = build_provenance(proc, registry, service, network events per host)

      pattern = (suspicious_proc) -> (firewall_change) -> (outbound_conn)

      matches = POIROT.align(graph, pattern)

      anomaly = KAIROS.temporal_autoencoder(graph) + ThreaTrace.node_score(graph)

      alert where matches.alignment_score > thr OR anomaly > thr'
- question: '[Defense Impairment] Explainable outlier scoring of host/flow events: Can you flag anomalous
    host event-vectors (process metadata, registry path, parent rarity, time-delta to firewall change)
    and post-change flow features (new inbound-IP count, port entropy, time-to-connection) with an adversarially-robust
    Isolation Forest / One-Class SVM, while REQUIRING every alert to surface its top-3 contributing features
    via SHAP/LIME, using the ''Explainable Outlier Scoring of Host/Flow Events'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), a low-latency parallel detection
    layer can catch novel firewall-tamper variants that signatures miss, but only if its alerts are explainable
    enough to triage. This evidence focuses on explainable outlier detection over host and flow features.
    The approach flags host event-vectors (process metadata, registry path, parent rarity, time-delta
    to firewall change) and post-change flow features (new inbound-IP count, port entropy, time-to-connection)
    with an adversarially-robust Isolation Forest / One-Class SVM ([Robust IoT IF/OCSVM with LIME](https://www.nature.com/articles/s41598-025-20445-4))
    and requires every alert to surface its top-3 contributing features via SHAP/LIME attribution ([SHAP
    Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full))
    rather than a bare score. It is intended as a low-latency parallel layer beneath the deterministic
    signatures, never a replacement. A positive result -- a high outlier score with explanatory features
    such as high parent-process rarity, a spike in new inbound IPs, elevated port entropy, or a very short
    time-to-connection after a firewall change -- indicates a host warranting investigation; pivot to
    the implicated process, registry change, and flows. A negative result helps rule out feature-space
    outliers but should be corroborated with the signature, registry, statistical, and sequence questions.'
  answer_sources:
  - Windows Security Event Logs (Event IDs 4946, 4947, 4948, 4950 firewall rule add/modify/delete/setting-change;
    4688 process creation; 4657 registry value change; 4624/4625 logon; 5152/5156/5157 WFP filtering)
  - Windows System Event Logs (Event IDs 7036/7040 for mpssvc service state/start-type changes; 7045 service
    install)
  - Sysmon Event Logs (Event IDs 1 process, 3 network, 12/13/14 registry)
  - Windows PowerShell Logs (Event IDs 4103, 4104 script block)
  - Registry auditing (HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy and
    HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\{Standard,Domain,Public}Profile)
  - Network telemetry (Zeek conn.log; Windows Firewall pfirewall.log)
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = host_vector(process_meta, registry_path, parent_rarity, dt_to_fw_change)\n  + flow_vector(new_inbound_ip_count,\
      \ port_entropy, time_to_connection)\nmodel = IsolationForest(robust=True)  // or OneClassSVM\nscore\
      \ = model.decision_function(features)\nexplain = SHAP_or_LIME.top_features(model, features, k=3)\n\
      alert where score < anomaly_threshold\nemit {host, score, top3_features: explain}  // never bare\
      \ score\n// run as parallel layer beneath deterministic firewall signatures"
