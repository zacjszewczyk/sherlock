questions:
- question: '[Execution] Match image digests to TI and enforce signed-allowlist: Can you determine, using
    the ''Match image digests to TI and enforce signed-allowlist'' (Symbolic Logic) approach, whether
    a container or cloud instance is created using an image whose digest, tag, or AMI/Image ID matches
    a known-malicious image threat-intelligence feed, is unsigned, or is a never-before-seen digest. Failed/denied
    pulls (ImagePullBackOff, admission denial) are profiled as a distinct signal of attempted malicious-image
    deployment?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary relies on a user or automated
    pipeline running a malicious container or VM image to execute adversary-controlled code (e.g., cryptominers,
    reverse shells, or C2 implants) while bypassing initial-access controls. This evidence focuses on
    the condition that a container or cloud instance is created using an image whose digest, tag, or AMI/Image
    ID matches a known-malicious image threat-intelligence feed, is unsigned, or is a never-before-seen
    digest. Failed/denied pulls (ImagePullBackOff, admission denial) are profiled as a distinct signal
    of attempted malicious-image deployment. This Symbolic Logic approach pursues that signal as follows:
    Parse container-runtime/RunInstances events (Event ID 4688, containerd:events, kubernetes:audit, AWS:CloudTrail),
    extract image identifiers (name/tag/digest/AMI ID), and alert when (a) the digest/ID matches a known-malicious
    TI entry, (b) the image is unsigned or pulled from a registry not on the allowlist, or (c) the digest
    has never been seen in the 90-day baseline. Pin to immutable digests rather than mutable tags and
    treat ImagePullBackOff/admission-deny events as a distinct attempted-deployment signal, per [NIST
    SP 800-190](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-190.pdf), [Kubernetes
    Hardening Guidance](https://media.defense.gov/2022/Aug/29/2003066362/-1/-1/0/CTR_KUBERNETES_HARDENING_GUIDANCE_1.2_20220829.PDF),
    and [SigmaHQ](https://github.com/SigmaHQ/sigma). A positive result -- a rule match, statistical outlier,
    or model alert -- indicates a container or instance whose provenance, runtime behavior, permissions,
    or network egress deviates from your sanctioned baseline; pivot to the responsible image digest/tag/AMI
    ID, the deploying user/service account, the host or namespace, the running processes, and any outbound
    connections to confirm malicious execution and scope the blast radius. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, slow, or living-off-the-land malicious-image deployments.'
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=1
  - containerd:events
  - kubernetes:audit
  - AWS:CloudTrail RunInstances
  - 'NAI: Container host servers, Cloud container orchestration platforms (e.g., Kubernetes, EKS, AKS),
    Corporate image registries'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match image digests to TI and enforce signed-allowlist

      source IN [Windows Event ID 4688, WinEventLog:Sysmon EventCode=1, containerd:events, kubernetes:audit,
      AWS:CloudTrail RunInstances]

      | parse image identifiers, command lines, runtime flags, and destinations

      | where condition_matches_signature_or_TI_or_allowlist_violation

      | eval signal="Match image digests to TI and enforce signed-allowlist"

      | table _time, host, namespace, image, user, process, dest, signal

      # Also profile failed/denied attempts (ImagePullBackOff, admission-deny, blocked egress) as distinct
      signals'
- question: '[Execution] Deploy rarity scoring for new images: Can you determine, using the ''Deploy rarity
    scoring for new images'' (Statistical Method) approach, whether a container or cloud instance is created
    using an image whose digest, tag, or AMI/Image ID matches a known-malicious image threat-intelligence
    feed, is unsigned, or is a never-before-seen digest. Failed/denied pulls (ImagePullBackOff, admission
    denial) are profiled as a distinct signal of attempted malicious-image deployment?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary relies on a user or automated
    pipeline running a malicious container or VM image to execute adversary-controlled code (e.g., cryptominers,
    reverse shells, or C2 implants) while bypassing initial-access controls. This evidence focuses on
    the condition that a container or cloud instance is created using an image whose digest, tag, or AMI/Image
    ID matches a known-malicious image threat-intelligence feed, is unsigned, or is a never-before-seen
    digest. Failed/denied pulls (ImagePullBackOff, admission denial) are profiled as a distinct signal
    of attempted malicious-image deployment. This Statistical Method approach pursues that signal as follows:
    Compute 90-day deployment frequency (count/day) per image name and digest across hosts/clusters; alert
    when an image is below the 5th percentile of deployment frequency or absent from trusted registries.
    Do NOT use pull/star popularity as a trust input — [Vulnerability Analysis of 2500 Docker Hub Images](https://arxiv.org/abs/2006.02932)
    shows popularity does not correlate with safety. Derive percentile thresholds per namespace from your
    own baseline. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    a container or instance whose provenance, runtime behavior, permissions, or network egress deviates
    from your sanctioned baseline; pivot to the responsible image digest/tag/AMI ID, the deploying user/service
    account, the host or namespace, the running processes, and any outbound connections to confirm malicious
    execution and scope the blast radius. A negative result helps rule out this particular vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    slow, or living-off-the-land malicious-image deployments.'
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=1
  - containerd:events
  - kubernetes:audit
  - AWS:CloudTrail RunInstances
  - 'NAI: Container host servers, Cloud container orchestration platforms (e.g., Kubernetes, EKS, AKS),
    Corporate image registries'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Deploy rarity scoring for new images

      source IN [Windows Event ID 4688, WinEventLog:Sysmon EventCode=1, containerd:events, kubernetes:audit,
      AWS:CloudTrail RunInstances]

      | bucket _time span=1d

      | stats baseline metrics per image/namespace/replica over trailing window

      | eval score=deviation_from_baseline (percentile / sigma / edit-distance / entropy)

      | where score > tuned_threshold

      | table _time, image, namespace, score, contributing_metric'
