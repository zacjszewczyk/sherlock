name: 'T1204.003: Malicious Image'
id: f55810d1-fd51-45e4-9ecd-4a07f970480a
description: 'This playbook helps an analyst investigate whether an adversary has achieved execution by
  getting a user (or automation) to run a malicious container or virtual-machine image across Containers
  (Docker/Kubernetes/containerd) and IaaS (AWS AMIs, GCP Images, Azure Images). Adversaries backdoor or
  typosquat images, upload them to public or unapproved registries, and rely on operators pulling and
  deploying them — leading to in-guest execution of code such as cryptominers, reverse shells, or C2 implants
  while bypassing initial-access controls. It guides the hunt across five behavioral angles: (1) image
  provenance — matching image digests/tags/AMI IDs against threat intelligence, enforcing signed-image
  allowlists, scoring deployment rarity, and modeling image metadata to flag never-before-seen or untrusted
  images, including failed/denied pulls (ImagePullBackOff, admission denial); (2) anomalous in-container/in-instance
  runtime behavior — child processes such as network scanners, reverse shells, package managers, or miners
  detected via regex signatures, syscall-frequency deviation, and syscall-graph / peer-replica ML; (3)
  excessive runtime permissions — privileged mode, host PID/network namespace sharing, Docker-socket mounts,
  and dangerous capabilities, via flag detection, weighted risk scoring, and Isolation Forest over flag
  vectors; (4) malicious network activity — connections to TI-listed C2 or cryptomining pools, DGA/beaconing,
  and ML flow anomaly detection on Zeek/NSM telemetry; and (5) registry/name integrity — pulls from non-allowlisted
  registries and typosquatted image names via allowlist enforcement, edit-distance analysis, and registry
  trust scoring. Detection methods combine symbolic-logic rules, statistical baselining, and machine-learning
  models applied to container-runtime events (containerd:events, kubernetes:audit), cloud control-plane
  logs (AWS:CloudTrail, azure:activity), endpoint process telemetry (Windows Event ID 4688, Sysmon EventCode=1,
  auditd:SYSCALL, Falco), and network telemetry (Zeek conn/dns/http, NSM:Flow) so the analyst can corroborate
  suspected malicious-image execution against provenance, runtime behavior, permissions, and egress context.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
