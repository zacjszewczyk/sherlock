    pattern, because the resulting credentials outlive the temporary session and any rotation of the original
    keys. Create a high-severity alert when userIdentity.type is AssumedRole/FederatedUser (AWS) or the
    identity originates from an external IdP (Azure) and the action is a credential modification on a
    permanent, cloud-native IAM user or service principal. Also alert on sts:GetFederationToken usage,
    since federated tokens persist beyond deactivation of the original keys. A match indicates an actor
    converting transient access into durable, potentially higher-privileged access.
