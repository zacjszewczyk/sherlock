- question: After a high-risk modification (new foreign-region instance or public snapshot), does the
    first hour of outbound flow-log bytes for that resource exceed the 99th percentile of new-instance
    baselines, and is the destination first-seen for the org?
  context: 'Egress immediately following a risky modification is the strongest exfiltration signal. After
    any high-risk modification (new foreign-region instance, public snapshot), monitoring the first hour
    of outbound flow-log bytes for that resource and alerting above the 99th percentile of new-instance
    baselines catches abnormal data movement. Setting the percentile robustly with the median/MAD modified
    z-score and tracking per-identity rarity of the destination (Netflix cloudtrail-anomaly style) reduces
    noise. Measuring byte count and out/in ratio and flagging destinations that are first-seen for the
    org pinpoints likely exfiltration to attacker-controlled infrastructure. References: [modified z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [Netflix cloudtrail-anomaly](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).'
