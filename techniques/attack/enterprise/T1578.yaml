    conn.log shows >1GB outbound from the related resource to an untrusted IP correlates the enabling
    change with the actual data loss. Corroborating against Unit 42''s stolen-credential exfil patterns
    raises confidence that this is adversary data theft enabled by infrastructure modification. References:
    [Stratus Red Team](https://stratus-red-team.cloud/attack-techniques/AWS/aws.exfiltration.ec2-share-ebs-snapshot/);
    [Unit 42](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/).'
