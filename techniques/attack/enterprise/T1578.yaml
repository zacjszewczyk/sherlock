- question: Does a graph linking users, cloud resources, and external IPs reveal an anomalous attack path
    such as (User -> CreateSnapshot -> ModifySnapshotAttribute public -> CreateInstance -> large egress)?
  context: 'Multi-step exfiltration chains are best seen as paths in a graph. Building a graph linking
    users, cloud resources, and external IPs and flagging paths such as (User -> CreateSnapshot -> ModifySnapshotAttribute
