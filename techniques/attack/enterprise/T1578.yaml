- question: Does a SARIMA forecast of expected modification-call counts per user show actuals breaching
    the forecast confidence interval?
  context: 'Cloud activity has daily/weekly seasonality that naive baselines ignore. A SARIMA time-series
    model forecasts expected modification-call counts per user and alerts when actuals exceed the forecast
    confidence interval, consistent with volume-baselining in Elastic CloudTrail ML and CloudWatch ML.
    Including the observed vs. forecast count and the breaching API name in the alert lets an analyst
    quickly judge whether a spike in resource creation/deletion reflects scripted adversary activity rather
    than expected seasonal automation. References: [Elastic CloudTrail ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning);
    [CloudWatch ML](https://aws.amazon.com/blogs/mt/simplify-analysis-of-aws-cloudtrail-data-leveraging-amazon-cloudwatch-machine-learning-and-advanced-capabilities/).'
