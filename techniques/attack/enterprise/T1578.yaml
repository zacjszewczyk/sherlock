    relationships that flat correlation rules miss. Surfacing the top-3 anomalous edges/nodes contributing
    to the path score gives analysts an explainable view of how an identity weakened controls and moved
    data, directly addressing whether the adversary is evading defenses by modifying cloud compute infrastructure.
    References: [dynamic GNN](https://arxiv.org/abs/2409.12726); [GNN for cloud IAM logs](https://arxiv.org/abs/2512.10280).'
