name: 'T1606.002: SAML Tokens'
id: a1e52bda-1d8f-4656-870a-1805fc8acb17
description: 'This playbook helps an analyst investigate whether an adversary is forging SAML tokens to
  gain unauthorized credential access and authenticate across services that use SAML 2.0 as a single sign-on
  (SSO) mechanism (MITRE ATT&CK T1606.002, SAML Tokens). An actor who possesses a valid token-signing
  certificate -- stolen from AD FS, exported from an Identity Provider, or generated after establishing
  their own trusted federation -- can mint validly-signed assertions (the ''Golden SAML'' attack) bearing
  any permissions claims and lifetimes, bypassing MFA and impersonating highly privileged accounts. The
  hunt spans Identity Provider/AD FS servers, cloud sign-in and audit logs (Entra ID, Okta, AWS), Office
  365/M365 services, Windows endpoints, and TLS-inspected network telemetry, and pursues the behavior
  from several complementary angles: SAML assertions signed by certificates not on the approved allowlist
  or tied to newly created/modified federation trusts; assertions with abnormally long lifetimes or structural
  inconsistencies (XML Signature Wrapping, NameID/Subject mismatch, missing AudienceRestriction); successful
  Service Provider/cloud SAML logins with no corresponding IdP token-issuance (Event ID 1200/1202) or
  Kerberos (4769) precursor within a short window -- the canonical Golden SAML signature; federated logins
  that succeed without an expected MFA/AuthnContext challenge or from geographically impossible/rare sources;
  and SAML logons immediately followed by high-privilege activity such as special privilege assignment
  or service-principal credential additions. Detection methods combine deterministic symbolic-logic rules
  (certificate allowlist/TI matching, federation-trust change alerts, assertion-structure enforcement,
  SP-to-IdP log correlation, impossible travel, privilege-assignment correlation), statistical baselining
  (rare-certificate and change-point detection, lifetime/claim outliers, SP/IdP login ratios, causal path
  rarity scoring, login-attribute rarity, post-auth entropy/volume spikes), and machine learning (Extended
  Isolation Forest, DeepLog-style LSTM sequence modeling, node2vec/link-prediction graph anomaly detection),
  applied across Zeek http/files/x509/conn logs, Windows Event IDs (1200, 1202, 307, 4624, 4648, 4672,
  4673, 4688, 4769), AD FS token-issuance logs, and Azure AD/AWS CloudTrail/M365 cloud telemetry, so the
  analyst can corroborate suspected SAML token forgery against signing certificates, assertion structure,
  IdP/SP correlation, source attributes, and post-authentication privilege use.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
