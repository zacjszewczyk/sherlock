questions:
- question: '[Credential Access] Match signing cert to allowlist/TI: Can you determine whether SAML assertion
    is signed by a token-signing certificate whose thumbprint/issuer is not on the approved allowlist,
    matches a known-bad TI indicator, or corresponds to a newly created/modified federation trust (e.g.,
    changed IssuerUri or SigningCertificate via Set-MsolDomainAuthentication). Adversaries with the token-signing
    key, or who establish their own trusted certificate, can mint validly-signed assertions that pass
    signature verification. -- specifically, using the ''Match signing cert to allowlist/TI'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary who holds a valid
    SAML token-signing certificate can forge SAML 2.0 assertions to authenticate across federated/SSO
    services, impersonate privileged accounts, and bypass MFA (Golden SAML). This evidence focuses on
    the condition that SAML assertion is signed by a token-signing certificate whose thumbprint/issuer
    is not on the approved allowlist, matches a known-bad TI indicator, or corresponds to a newly created/modified
    federation trust (e.g., changed IssuerUri or SigningCertificate via Set-MsolDomainAuthentication).
    Adversaries with the token-signing key, or who establish their own trusted certificate, can mint validly-signed
    assertions that pass signature verification. This Symbolic Logic approach works as follows: Parse
    TLS-inspected SAML assertions to extract certificate thumbprints/issuers and alert on any cert NOT
    on the approved token-signing allowlist or matching a known-bad TI indicator; treat any new/unknown
    signing cert as high severity ([Golden SAML, CyberArk](https://www.cyberark.com/resources/threat-research-blog/golden-saml-newly-discovered-attack-technique-forges-authentication-to-cloud-apps),
    [Detecting M365/Azure AD Backdoors, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable SAML
    token forgery or abuse; pivot to the signing certificate and federation trust involved, the IdP token-issuance
    (Event ID 1200/1202) and Kerberos (4769) history for the user, the Service Provider/cloud sign-in
    that consumed the token, the source IP/ASN/geo and MFA state, and any post-authentication privilege
    escalation to scope the compromise. A negative result helps reduce the likelihood of this specific
    forgery vector but should be corroborated with the other questions in this playbook, since a determined
    actor may stay within baselined lifetimes, reuse allowlisted certificates, or mimic legitimate claim
    sets.'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek x509.log
  - Windows Event ID 1202
  - Windows Event ID 307
  - Azure AD Audit Logs
  - 'NAI: AD FS / Identity Provider servers, Cloud Identity Provider consoles (e.g., Entra ID, Okta),
    network gateways with TLS inspection, reverse proxies.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from x509.log, files.log

      extract cert_thumbprint = sha1(certificate), issuer = certificate.issuer

      let allowlist = approved_token_signing_thumbprints

      where cert_thumbprint not in allowlist OR cert_thumbprint in threat_intel_bad_certs OR issuer not
      in approved_issuers

      emit alert(severity=high, thumbprint, issuer, src=id.orig_h)'
  - technology: SIEM/Rule pseudocode
    query: 'index=azure_ad_audit OR index=adfs (token_signing_certificate=*)

      | eval thumb=cert_thumbprint

      | lookup approved_signing_certs thumb OUTPUT status

      | where isnull(status) OR thumb IN [threat_intel_certs]

      | alert "SAML assertion signed by non-allowlisted/known-bad certificate"'
