  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM win_4688, sysmon_1

      | WHERE CommandLine MATCHES /(aws\s+ec2\s+(create|copy)-snapshot|aws\s+ec2\s+modify-snapshot-attribute|az\s+snapshot\s+create|gcloud\s+compute\s+snapshots\s+create)/i

      | ALERT then CORRELATE to cloud_audit snapshot event for same identity within window'
