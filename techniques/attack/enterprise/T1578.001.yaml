questions:
- question: '[Defense Impairment] Threat-intel enriched snapshot API detection: Can you determine whether
    a cloud snapshot creation or copy event (e.g., EC2 CreateSnapshot, Azure Snapshots Create Or Update,
    compute.snapshots.insert) is recorded in cloud audit logs and the caller''s source IP, user agent,
    or IAM principal is associated with a known indicator of compromise or an unusual management-plane
    access path for that account. -- specifically, using the "Threat-intel enriched snapshot API detection"
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
    is: "Is the adversary creating cloud snapshots to evade defenses or prepare for data exfiltration?"
    An adversary creates a point-in-time snapshot or backup of a cloud compute component (a VM, virtual
    hard drive, or volume) to bypass access restrictions on existing infrastructure -- for example, mounting
    the copy to an attacker-controlled instance, sharing it externally, or copying it to another region
    -- thereby evading defenses and staging data for exfiltration. This evidence focuses on the condition
    that a cloud snapshot creation or copy event (e.g., EC2 CreateSnapshot, Azure Snapshots Create Or
    Update, compute.snapshots.insert) is recorded in cloud audit logs and the caller''s source IP, user
    agent, or IAM principal is associated with a known indicator of compromise or an unusual management-plane
    access path for that account. This Symbolic Logic approach works as follows: Join cloud audit logs
    (CloudTrail eventName in CreateSnapshot, CopySnapshot, CreateSnapshots, ModifySnapshotAttribute; Azure
    Snapshots Create-Or-Update; GCP compute.snapshots.insert) or Zeek proxy telemetry with threat intelligence
    for source IPs/ASNs, domains, and user agents, and alert when a known-bad or anomalous management-plane
    indicator executes a snapshot creation/copy call. Match eventSource+eventName+success in the Sigma
    EC2 management-event style [AWS EC2 Disable EBS Encryption (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/aws/cloudtrail/aws_ec2_disable_encryption.yml);
    enrich with documented compromised-credential source patterns [Compromised Cloud Compute Credentials,
    Unit 42](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/). Validate with
    emulated detonations [Stratus Red Team](https://github.com/DataDog/stratus-red-team) and the public
    [flaws.cloud CloudTrail dataset](https://summitroute.com/blog/2020/10/09/public_dataset_of_cloudtrail_logs_from_flaws_cloud/).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong signal that
    an unauthorized or compromised principal is creating, sharing, or copying snapshots; pivot to the
    responsible IAM principal and credential, the source IP/ASN/geo and user agent, the snapshot and source
    volume IDs, any downstream mount/share/copy operations, and correlated endpoint or network precursors.
    A negative result helps reduce the likelihood of this specific snapshot-abuse path but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, living-off-the-land,
    or API-only activity that blends with legitimate backup automation.'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Cloud Management Plane, Internet Gateway, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM cloud_audit WHERE eventName IN ("CreateSnapshot","CopySnapshot","CreateSnapshots","ModifySnapshotAttribute","Snapshots
      Create-Or-Update","compute.snapshots.insert")

      | JOIN threat_intel ON sourceIPAddress=ti.ip OR userAgent=ti.ua OR sourceASN=ti.asn OR requestDomain=ti.domain

      | WHERE responseElements.success=true OR errorCode IS NULL

      | ALERT "Snapshot API call from known-bad/anomalous management-plane indicator"'
  - technology: Zeek/pseudocode
    query: 'FROM http.log JOIN conn.log

      | WHERE host MATCHES cloud_management_api AND (id.resp_h IN ti_ip OR user_agent IN ti_ua)

      | EMIT enriched_event -> correlate with cloud_audit snapshot events'
- question: '[Defense Impairment] One-percentile user-agent rare event alert: Can you determine whether
    a cloud snapshot creation or copy event (e.g., EC2 CreateSnapshot, Azure Snapshots Create Or Update,
    compute.snapshots.insert) is recorded in cloud audit logs and the caller''s source IP, user agent,
    or IAM principal is associated with a known indicator of compromise or an unusual management-plane
    access path for that account. -- specifically, using the "One-percentile user-agent rare event alert"
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
    is: "Is the adversary creating cloud snapshots to evade defenses or prepare for data exfiltration?"
    An adversary creates a point-in-time snapshot or backup of a cloud compute component (a VM, virtual
    hard drive, or volume) to bypass access restrictions on existing infrastructure -- for example, mounting
    the copy to an attacker-controlled instance, sharing it externally, or copying it to another region
    -- thereby evading defenses and staging data for exfiltration. This evidence focuses on the condition
    that a cloud snapshot creation or copy event (e.g., EC2 CreateSnapshot, Azure Snapshots Create Or
    Update, compute.snapshots.insert) is recorded in cloud audit logs and the caller''s source IP, user
    agent, or IAM principal is associated with a known indicator of compromise or an unusual management-plane
    access path for that account. This Statistical Method approach works as follows: Profile snapshot-call
    user agents, source ASNs, and geos per principal over 30-90 days and flag any value below the 1st
    percentile or any (principal, eventName) pair never previously seen [Cloud API Calls From Previously
    Unseen User Roles, Splunk](https://research.splunk.com/cloud/2181ad1f-1e73-4d0c-9780-e8880482a08f/);
    [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly). Also
    track Volume (snapshot calls per principal/hour and total snapshot bytes copied cross-region) and
    apply the median-absolute-deviation modified Z-score with |score|>3.5 to resist batch-backup spikes
    [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong signal that
    an unauthorized or compromised principal is creating, sharing, or copying snapshots; pivot to the
    responsible IAM principal and credential, the source IP/ASN/geo and user agent, the snapshot and source
    volume IDs, any downstream mount/share/copy operations, and correlated endpoint or network precursors.
    A negative result helps reduce the likelihood of this specific snapshot-abuse path but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, living-off-the-land,
    or API-only activity that blends with legitimate backup automation.'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Cloud Management Plane, Internet Gateway, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM cloud_audit WHERE eventName LIKE "%Snapshot%"

      | STATS count BY principal, user_agent, sourceASN, geo OVER last_30_90d

      | baseline = percentile_dist(principal)

      | ALERT IF freq(value) < p1 OR (principal,eventName) never_seen_before

      | ALSO compute volume_per_hour and bytes_copied_cross_region; mod_zscore = 0.6745*(x-median)/MAD;
      ALERT IF abs(mod_zscore)>3.5'
