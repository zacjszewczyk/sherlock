- question: '[Defense Impairment] Regex detection of snapshot CLI usage: Can you determine whether a process
    is created on an endpoint where the command-line arguments contain strings for creating, modifying,
    sharing, or copying a cloud snapshot using a known CLI tool (aws.exe, az.cmd, gcloud.cmd), and the
    command is attributable to a user who also has a matching cloud audit event. -- specifically, using
    the "Regex detection of snapshot CLI usage" (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
