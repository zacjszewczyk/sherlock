- question: '[Defense Impairment] Resource ID sequence and external-share alert: Can you determine whether
    a snapshot creation event is followed within a 15-minute window by a subsequent cloud audit log entry
    that changes the snapshot''s permissions to public, shares it with an unknown external account, or
    copies it to an unapproved geographic region. -- specifically, using the "Resource ID sequence and
    external-share alert" (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
    is: "Is the adversary creating cloud snapshots to evade defenses or prepare for data exfiltration?"
    An adversary creates a point-in-time snapshot or backup of a cloud compute component (a VM, virtual
    hard drive, or volume) to bypass access restrictions on existing infrastructure -- for example, mounting
    the copy to an attacker-controlled instance, sharing it externally, or copying it to another region
    -- thereby evading defenses and staging data for exfiltration. This evidence focuses on the condition
    that a snapshot creation event is followed within a 15-minute window by a subsequent cloud audit log
    entry that changes the snapshot''s permissions to public, shares it with an unknown external account,
    or copies it to an unapproved geographic region. This Symbolic Logic approach works as follows: Trigger
    when a CreateSnapshot is followed within 15 minutes by ModifySnapshotAttribute on the same snapshotId
    where requestParameters.createVolumePermission.add.items[] grants an off-allow-list userId or {"groups":"all"}
    (public), or by a cross-region CopySnapshot; also alert on consumer-side SharedSnapshotCopyInitiated/SharedSnapshotVolumeCreated
    where recipientAccountId differs from userIdentity.accountId [Exfiltrate EBS Snapshot by Sharing It,
    Stratus Red Team](https://stratus-red-team.cloud/attack-techniques/AWS/aws.exfiltration.ec2-share-ebs-snapshot/).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong signal that
    an unauthorized or compromised principal is creating, sharing, or copying snapshots; pivot to the
    responsible IAM principal and credential, the source IP/ASN/geo and user agent, the snapshot and source
    volume IDs, any downstream mount/share/copy operations, and correlated endpoint or network precursors.
    A negative result helps reduce the likelihood of this specific snapshot-abuse path but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, living-off-the-land,
    or API-only activity that blends with legitimate backup automation.'
  answer_sources:
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Cloud Management Plane, Cloud IAM Service, Cloud Storage Services'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SEQUENCE within 15min BY snapshotId:\n  e1 = CreateSnapshot\n  e2 = ModifySnapshotAttribute\
      \ WHERE createVolumePermission.add.items[].userId NOT IN allow_list OR groups=\"all\"\n     OR e2\
      \ = CopySnapshot WHERE destRegion != srcRegion\n| ALSO ALERT IF SharedSnapshotCopyInitiated OR SharedSnapshotVolumeCreated\
      \ WHERE recipientAccountId != userIdentity.accountId\n| ALERT \"Snapshot externally shared/copied\
      \ after creation\""
- question: '[Defense Impairment] Time-delta percentile alert: Can you determine whether a snapshot creation
    event is followed within a 15-minute window by a subsequent cloud audit log entry that changes the
    snapshot''s permissions to public, shares it with an unknown external account, or copies it to an
    unapproved geographic region. -- specifically, using the "Time-delta percentile alert" (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
    is: "Is the adversary creating cloud snapshots to evade defenses or prepare for data exfiltration?"
    An adversary creates a point-in-time snapshot or backup of a cloud compute component (a VM, virtual
