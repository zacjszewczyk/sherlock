    orderings such as create-snapshot then public-share then cross-account-copy, using Bayesian credible
    intervals to judge plausibility [Protecting APIs Using Sequence Learning and Variable-Order Markov
    Chains, Cloudflare](https://blog.cloudflare.com/protecting-apis-from-abuse-using-sequence-learning-and-variable-order-markov/);
