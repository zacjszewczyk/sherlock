name: 'T1578.001: Modify Cloud Compute Infrastructure: Create Snapshot'
id: 8f3a3574-43e4-476a-8fcd-206d623a6c00
description: 'This playbook helps an analyst investigate whether an adversary is abusing cloud compute
  permissions to create, copy, modify, or share point-in-time snapshots of virtual machines, virtual hard
  drives, or volumes (e.g., EC2 CreateSnapshot/CopySnapshot, Azure Snapshots Create-Or-Update, GCP compute.snapshots.insert)
  in order to bypass access controls on existing infrastructure, evade defenses, and stage sensitive data
  for exfiltration -- as part of the Defense Impairment tactic. It guides the analyst across several behavioral
  angles: threat-intel- and anomaly-enriched detection of snapshot API calls from suspicious source IPs,
  ASNs, user agents, or first-seen IAM principals; endpoint detection of cloud-CLI snapshot commands (aws,
  az, gcloud) in Windows 4688 and Sysmon process telemetry correlated to matching cloud audit events;
  detection of snapshots being made public, shared with unknown external accounts, or copied to unapproved
  regions within a short window of creation; permission-enumeration failure-rate spikes from compromised
  credentials; and multi-stage correlation of snapshot creation with precursor compromise activity such
  as credential dumping, discovery, and untrusted tool downloads. Detection methods combine symbolic-logic
  rules, statistical baselining (percentile, modified Z-score, entropy, time-delta, and time-series band
  analysis), and machine-learning models (one-class SVM, Isolation Forest, BERT command-line embeddings,
  variable-order Markov/HMM sequence scoring, and graph/GNN-based cross-service anomaly detection) applied
  to AWS CloudTrail, Azure Activity Logs, Google Cloud Audit Logs, Windows Security and Sysmon events,
  and Zeek conn/http/files logs, so the analyst can corroborate suspected snapshot abuse against identity,
  source, sequence, and host/network precursor context.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
