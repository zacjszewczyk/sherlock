questions:
- question: Is a scripting engine, Office application, or remote-administration tool writing bursts of
    files into temp/public/appdata/share directories and then creating an archive (.zip/.rar/.7z/.tar.gz)
    under an unusual parent-child process lineage?
  context: Collection-stage data staging frequently shows a tight causal chain of read -> write -> rename
    -> archive concentrated in user-writable or shared directories, driven by interpreters or admin tooling
    rather than the user's normal apps. Correlate Sysmon Event ID 1 process starts with Sysmon Event ID
    11 file-creations and Windows Event ID 4663 object-access events to find write bursts into staging
    paths immediately followed by archive creation. Alert when the parent process is a scripting engine
    (powershell/wscript/cscript), an Office app, or a RAT, and the target path or archive name matches
    staging patterns. Score the rarity of the parent->child lineage using parent-child relationship features
    (ProblemChild) and reconstruct the read->write->rename->archive causal chain via provenance edges
    (KAIROS). A positive result is a rare lineage producing an archive in a staging directory shortly
    after touching many files; benign backup/sync agents produce a recognizable, allowlisted lineage and
    steadier pattern.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User home directories, shared network drives, common staging directories (e.g., C:\Windows\Temp,
    C:\Users\Public), application data folders, and cloud storage synchronization folders (e.g., OneDrive,
    Dropbox).'
  range: Last 90 days; correlate within a 10-minute event-centered window around archive creation
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let staging = (path matches \"\\\\Temp\\\\|\\\\Users\\\\Public\\\\|\\\\AppData\\\\|\\\\\\\\\
      *\\\\share\")\njoin (Sysmon EID=1 as proc) with (Sysmon EID=11 as fc) on ProcessGUID\njoin (WinEID=4663\
      \ as acc) on ProcessId within 10m\nwhere proc.ParentImage in (powershell,wscript,cscript,winword,excel,*rat*)\n\
      \  and count(distinct fc.TargetFilename where staging) >= 20\n  and exists(fc.TargetFilename matches\
      \ \"\\.(zip|rar|7z|tar\\.gz)$\")\nscore rarity(ParentImage->Image lineage)  // ProblemChild-style\n\
      emit causal_chain read->write->rename->archive"
- question: On a per-host basis, does the current session's file-write volume, file-creation rate, or
    archive production exceed the host's 30-day baseline (95th percentile or mean+3 sigma) while pulling
    files from multiple unrelated directories?
  context: Bulk staging produces an abnormal spike in I/O concentrated in a short window and spanning
    many source directories. Build a 30-day per-host baseline of file-creation counts, total bytes written
    (Volume), file-creation rate per minute (Frequency), archive sizes, and directory fan-out in staging
    locations using multi-time-scale per-process I/O profiling (ShieldFS). Flag sessions whose write volume
    or archive production exceeds the 95th percentile or mean+3 sigma, especially when files come from
    multiple unrelated directories within a short window. Track failed file-access attempts (4663 access-denied,
    4656 failures) as a distinct State signal of opportunistic collection/probing. Validate thresholds
    against the CERT Insider Threat Test Dataset. A positive result is a statistically rare burst with
    high directory fan-out; routine large software updates should be baselined out.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User home directories, shared network drives, common staging directories (e.g., C:\Windows\Temp,
    C:\Users\Public), application data folders, and cloud storage synchronization folders (e.g., OneDrive,
    Dropbox).'
  range: Last 90 days for detection; 30-day rolling baseline window
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per host over 30d: mean,std of {file_creates_per_min, bytes_written, archive_size,
      dir_fanout}

      for each session: vol=sum(bytes_written); rate=creates/min; fanout=distinct(parent_dir)

      flag if vol > p95(host) OR rate > mean+3*std OR fanout high within short window

      add signal: count(4663 access-denied)+count(4656 failures) per session

      alert sessions exceeding threshold drawing from multiple unrelated dirs'
- question: Does a machine-learning staging classifier distinguish this process tree from benign backup/sync
    activity based on path depth, filename entropy, extension mix, file-growth rate, and write->rename->archive
    timing?
  context: Adversary staging and benign backup/sync share surface features but differ in process-tree
    shape, entropy, extension mixing, and event timing. Train a classifier on process-tree features, path
    depth, filename entropy, extension mix, file-growth rate, and inter-event timing (write/rename/archive)
    to separate benign backup/sync from adversary staging, borrowing union-indicator ideas (CryptoDrop)
    and per-user autoencoder modeling (Tuor et al). Emit the top-3 contributing features (e.g., directory
    fan-out=22, high write-entropy, archive ext=.7z) via reconstruction-error decomposition or SHAP so
    analysts can triage. Cross-check high-probability sequences against downstream exfiltration or internal
    transfer. A positive result is a high staging probability with explanatory features inconsistent with
    the host's known backup agents.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User home directories, shared network drives, common staging directories (e.g., C:\Windows\Temp,
    C:\Users\Public), application data folders, and cloud storage synchronization folders (e.g., OneDrive,
    Dropbox).'
  range: Last 90 days scoring; model trained on >=90 days benign history
  queries:
  - technology: ML/pseudocode
    query: "features = [proc_tree_depth, path_depth, filename_entropy, ext_mix, file_growth_rate,\n  \
      \          t_write_to_rename, t_rename_to_archive, dir_fanout]\nmodel = classifier(benign=backup/sync,\
      \ malicious=staging)\np = model.predict_proba(session)\nif p > threshold: alert with top3 SHAP features;\
      \ correlate w/ exfil/internal-transfer"
- question: Was an archiving binary or LOLBin executed with compression plus password/silent flags and
    an output path inside a high-risk staging directory?
  context: A core staging signature is running a compression/encryption utility to bundle collected data.
    Match Sysmon Event ID 1 / Windows Event ID 4688 command lines that combine compression binaries (7z.exe,
    7za.exe, rar.exe, zip.exe, tar.exe, powershell Compress-Archive, certutil.exe) with password/silent
    flags (-p, -hp, -sp, Protect-Archive) and an output path in high-risk directories (C:\Users\Public,
    %TEMP%, C:\PerfLogs), per the SigmaHQ 7-Zip password-compression rule (match Image/OriginalFileName
    plus add/update action plus password flag). A positive result is a password-protected archive being
    written to a staging path; benign use rarely combines silent password flags with public/temp output
    locations.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Common staging directories (e.g., C:\Windows\Temp, C:\$Recycle.Bin), user profile directories
    (e.g., %APPDATA%), network-accessible temporary folders, and user-created folders at the root of a
    drive (e.g., C:\Intel).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from (Sysmon EID=1 OR WinEID=4688)\nwhere (Image|OriginalFileName) in (7z.exe,7za.exe,rar.exe,zip.exe,tar.exe,powershell.exe,certutil.exe)\n\
      \  and CommandLine matches add/update|Compress-Archive\n  and CommandLine matches \"(-p|-hp|-sp|Protect-Archive|-password)\"\
      \n  and CommandLine matches \"(Users\\\\Public|\\\\Temp|PerfLogs|C:\\\\Intel)\"\nalert"
- question: Is the (process_name, parent_process_name, output_directory) tuple for this archive/copy invocation
    in the bottom 1st-percentile frequency for the user and host over the last 30 days?
  context: Rare process lineage and output-location tuples expose staging that hides behind legitimate
    utilities. Track (process_name, parent_process_name, output_directory) tuples over 30 days and flag
    those in the bottom 1st percentile frequency (e.g., powershell.exe spawned by cmd.exe writing to C:\PerfLogs),
    applying the naive-Bayes truncated-command frequency-profile approach (Maxion & Townsend) to score
    how anomalous the archive/copy invocation is for that user and host. A positive result is a never-before-seen
    or extremely rare tuple producing an archive in a staging path; common admin patterns will have established
    frequency.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Common staging directories (e.g., C:\Windows\Temp, C:\$Recycle.Bin), user profile directories
    (e.g., %APPDATA%), network-accessible temporary folders, and user-created folders at the root of a
    drive (e.g., C:\Intel).'
  range: Last 90 days; 30-day frequency profile
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'build profile over 30d: freq[(process, parent, output_dir)] per (user,host)

      for new event: score = naive_bayes_rarity(tuple)

      flag if freq percentile < 1 (e.g., powershell<-cmd -> C:\PerfLogs)

      alert rare archive/copy invocations'
- question: Does a command-line language model assign high perplexity or anomalous tokens (compression
    flags, staging paths, password parameters) to this archive/copy command line?
  context: Obfuscated or unusual command lines for staging often score as high-perplexity sequences against
    a benign corpus. Fine-tune a Transformer (BERT variant) or sequence model on benign command-line corpora
    (Sysmon Event ID 1) and score new command lines for high perplexity or anomalous tokens, especially
    compression flags, file paths, and password parameters (DeepLog sequence-anomaly framing). Surface
    the top-3 anomalous tokens/flags in the alert so analysts see why it scored high, and triage rare
    lineages with supervised XGBoost (ProblemChild). A positive result is an anomalous command line whose
    surprising tokens are compression/encryption/staging-related.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Common staging directories (e.g., C:\Windows\Temp, C:\$Recycle.Bin), user profile directories
    (e.g., %APPDATA%), network-accessible temporary folders, and user-created folders at the root of a
    drive (e.g., C:\Intel).'
  range: Last 90 days scoring; trained on >=90 days benign command lines
  queries:
  - technology: ML/pseudocode
    query: 'model = finetune(BERT, corpus=benign Sysmon EID=1 command_lines)

      perplexity = model.score(new_cmdline)

      if perplexity > threshold: alert + top3 anomalous tokens (flags/paths/password)

      triage lineage with XGBoost(ProblemChild)'
- question: Did a single non-allowlisted process read more than 50 unique files across more than 5 directories
    within 5 minutes and then create a single archive file?
  context: Mass file-touch followed by a single archive is the canonical collection-then-stage pattern.
    Correlate Windows Event ID 4663 read events with Sysmon Event ID 1 ProcessGUID and alert when a non-allowed
    process reads >50 unique files across >5 directories within 5 minutes and then creates a single archive
    (Sysmon Event ID 11, extensions .zip/.rar/.7z/.tar.gz). This mass-file-touch threshold logic mirrors
    CryptoDrop union indicators (file-type funneling, per-process file counts). Also count access-denied
    4663 failures across the same files as a distinct State signal of probing during collection. A positive
    result is one process aggregating many files into one archive; allowlist legitimate indexers/AV/backup.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: File servers, document repositories (e.g., SharePoint mount points), user home directories,
    source code repositories, cloud-synced directories on endpoints, and databases accessible via workstations.'
  range: Last 90 days; correlate within 5-minute sliding windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join (WinEID=4663 read as r) with (Sysmon EID=1 as p) on ProcessGUID/ProcessId

      within 5m: u_files=distinct(r.ObjectName); u_dirs=distinct(parent_dir(r.ObjectName))

      and (Sysmon EID=11 archive create matches \.(zip|rar|7z|tar\.gz)$)

      where p not in allowlist and u_files>50 and u_dirs>5

      add signal: count(4663 access-denied for same files)

      alert'
- question: Over 1-minute sliding windows, does the Shannon entropy of the directory set accessed by a
    process, its total bytes read, or its read/write ratio exceed that process's mean+3 sigma baseline?
  context: Staging reads scatter across many directories, raising directory-set entropy beyond a process's
    norm. Over 1-minute sliding windows compute the Shannon entropy of the directory set accessed per
    process plus total bytes read (Volume) and read/write ratio (State); maintain per-process baselines
    using multi-scale I/O profiling (ShieldFS) and flag readings exceeding mean+3 sigma for that process
    name. A positive result is a process suddenly reading across many disparate directories with high
    entropy and high read volume; a normal application accesses a stable, low-entropy directory set.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: File servers, document repositories (e.g., SharePoint mount points), user home directories,
    source code repositories, cloud-synced directories on endpoints, and databases accessible via workstations.'
  range: Last 90 days detection; per-process baseline over 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per process per 1-min window:\n  dir_entropy = shannon(distinct dirs accessed)\n  bytes_read\
      \ = sum(read volume); rw_ratio = reads/writes\nbaseline mean,std per process_name over 30d\nflag\
      \ if dir_entropy or bytes_read or rw_ratio > mean+3*std"
- question: Does an unsupervised outlier detector flag a ProcessGUID session as anomalous based on unique
    files read, unique directories, read/write ratio, directory entropy, and bytes read/written?
  context: Staging sessions are statistical outliers across several I/O dimensions simultaneously. Apply
    Isolation Forest or DBSCAN to ProcessGUID sessions using features (unique files read, unique directories,
    read/write ratio, directory entropy, bytes read/written) to surface outlier sessions versus benign
    activity, and use node-level provenance localization (ThreaTrace) to pinpoint the specific staging
    files/process. Report the top-3 features driving the outlier score in the alert text. A positive result
    is an isolated session whose feature vector is far from the benign cluster and whose provenance localizes
    to staging files.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: File servers, document repositories (e.g., SharePoint mount points), user home directories,
    source code repositories, cloud-synced directories on endpoints, and databases accessible via workstations.'
  range: Last 90 days; session-level scoring
  queries:
  - technology: ML/pseudocode
    query: 'X = per-session [unique_files_read, unique_dirs, rw_ratio, dir_entropy, bytes_read, bytes_written]

      model = IsolationForest()  # or DBSCAN

      scores = model.fit_predict(X)

      for outliers: localize staging files via provenance (ThreaTrace); alert + top3 features'
- question: Did a single ProcessGUID generate more than 100 file-creation events within 5 minutes inside
    a key staging directory while not being on the installer/patch-manager allowlist?
  context: A deterministic count floor catches rapid mass file creation in staging directories. Trigger
    alerts when a single ProcessGUID generates >100 Sysmon Event ID 11 creations in 5 minutes within key
    staging directories (C:\Windows\Temp, %TEMP%, C:\Users\Public) and the process is not on an installer/patch-manager
    allowlist (CryptoDrop threshold logic). Tune the count against benign software-update baselines. A
    positive result is a non-allowlisted process flooding a staging directory with new files; installers
    and updaters that legitimately do this should be allowlisted.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: System-wide temporary directories (C:\Windows\Temp), user-specific temporary directories (%TEMP%),
    public folders (C:\Users\Public), and the Recycle Bin for all users.'
  range: Last 90 days; 5-minute windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from Sysmon EID=11\nwhere TargetFilename matches \"(Windows\\\\Temp|\\\\Temp|Users\\\\Public)\"\
      \n  and Image not in installer/patch-manager allowlist\ngroup by ProcessGUID, bin(5m)\nhaving count(*)\
      \ > 100 -> alert"
- question: Within a staging directory, does the current minute's file-creation count or bytes-written
    exceed a 60-minute moving average plus 4 sigma?
  context: Sudden bursts above a directory's recent moving average reveal staging spikes. Build per-directory
    minute-level time series for file-creation counts (Frequency) and bytes written (Volume), compute
    a 60-minute simple moving average and standard deviation, and alert when the current minute exceeds
    SMA+4 sigma (per-entity baselining, Yuan & Wu). Derive directory-specific thresholds from each host's
    30-day history and treat write-then-delete churn as a distinct failure/cleanup signal. A positive
    result is a sharp spike above the rolling baseline in a staging directory; routine periodic activity
    stays near the SMA.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: System-wide temporary directories (C:\Windows\Temp), user-specific temporary directories (%TEMP%),
    public folders (C:\Users\Public), and the Recycle Bin for all users.'
  range: Last 90 days; 60-minute moving average, 30-day thresholds
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per staging_dir per minute: creates, bytes_written

      sma60 = movavg(value,60); sd60 = movstd(value,60)

      alert if value(now) > sma60 + 4*sd60

      track write-then-delete churn separately as cleanup signal'
- question: After learning daily/weekly seasonality of bytes written into staging directories, does the
    current observation fall outside the 99% prediction interval?
  context: Staging often violates the normal daily/weekly rhythm of a directory's write volume. Train
    a time-series decomposition or forecasting model (Prophet/STL or the DeepLog parameter-value detector)
    on hourly bytes written (Sysmon Event ID 11) into staging directories, learn daily/weekly seasonality,
    and flag observations outside the 99% prediction interval. Emit the observed-vs-expected delta and
    the top staging directory/process contributors in the alert. A positive result is an off-schedule
    volume surge (e.g., midnight bulk writes) that the seasonal model did not predict.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: System-wide temporary directories (C:\Windows\Temp), user-specific temporary directories (%TEMP%),
    public folders (C:\Users\Public), and the Recycle Bin for all users.'
  range: Last 90 days scoring; >=8 weeks training to learn weekly seasonality
  queries:
  - technology: ML/pseudocode
    query: 'series = hourly bytes_written per staging_dir

      model = Prophet/STL(series)  # or DeepLog param-value detector

      yhat, lo, hi = model.predict(now)  # 99% interval

      if observed < lo or observed > hi: alert + delta + top dir/process contributors'
- question: Is a large internal transfer (resp_bytes > 1 GB) flowing from a server to a workstation over
    a non-backup/file-sharing protocol, indicating consolidation onto a non-repository host?
  context: Pre-exfiltration consolidation often moves bulk data from servers to a single workstation that
    is not a normal repository. Alert on Zeek conn.log when a single TCP session between internal hosts
    has resp_bytes > 1 GB, the destination is in the workstation range, the source is a server, and the
    service field is not a known backup/file-sharing protocol (e.g., smb, nfs, bacula); host-communication
    modeling justifies this server->workstation consolidation pattern (CyberGraph). Also count blocked/reset
    internal connections (Windows Event ID 5157, conn 'S0'/'REJ' states) as a distinct failure signal.
    A positive result is a server pushing >1 GB to a workstation outside sanctioned backup channels.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Internal network segments, especially east-west traffic between VLANs, traffic flowing from
    servers to workstations, and the network egress point.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from conn.log\nwhere resp_bytes > 1e9\n  and orig_h in server_range and resp_h in workstation_range\n\
      \  and service not in (smb,nfs,bacula,backup)\nalert; correlate WinEID=5157 blocks and conn_state\
      \ in (S0,REJ) as failure signal"
- question: Does a new internal source-destination session exceed the 30-day 95th-percentile baseline
    of bytes transferred or session count for that host pair?
  context: Per-pair baselining catches abnormal internal data movement that fixed thresholds miss. Maintain
    30-day 95th-percentile baselines of resp_bytes (Volume) and session counts (Frequency) per internal
    source-destination pair and alert when new sessions exceed that percentile (per-entity baselining,
    Yuan & Wu). Track per-pair connection-failure ratios separately to distinguish staging transfers from
    scanning. A positive result is a host pair suddenly moving far more data or opening far more sessions
    than its established norm; scanning shows high failure ratios instead of high bytes.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Internal network segments, especially east-west traffic between VLANs, traffic flowing from
    servers to workstations, and the network egress point.'
  range: Last 90 days; 30-day per-pair percentile baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per (src,dst) over 30d: p95(resp_bytes), p95(session_count)

      for new session: alert if resp_bytes > p95 or session_count > p95

      track failure_ratio = (S0+REJ+RST)/total per pair to separate scanning'
- question: Does a workstation's in-degree or graph centrality rise into server-like territory, and do
    the associated large flows score as anomalous in an online network autoencoder?
  context: Data consolidation reshapes the internal communication graph, pushing a workstation toward
    server-like centrality. Build a directed graph from Zeek conn.log with hosts as nodes and edges weighted
    by total_bytes per 24h, learn normal in-degree/centrality distributions for workstations vs servers
    with unsupervised graph learning (CyberGraph), and flag workstations whose centrality rises into server-like
    territory; score the anomalous large flows themselves with the online autoencoder ensemble (Kitsune)
    and report the top-3 contributing source hosts/byte volumes in the alert. A positive result is a workstation
    that becomes an aggregation hub with anomalous large inbound flows.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Internal network segments, especially east-west traffic between VLANs, traffic flowing from
    servers to workstations, and the network egress point.'
  range: Last 90 days; 24-hour graph windows
  queries:
  - technology: ML/pseudocode
    query: 'G = directed graph from conn.log; edge_weight = total_bytes per 24h

      learn baseline in-degree/centrality by host role (workstation vs server)

      flag workstation whose centrality -> server-like

      score large flows with Kitsune autoencoder; alert + top3 source hosts/bytes'
