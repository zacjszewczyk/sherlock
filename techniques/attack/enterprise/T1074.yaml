name: 'T1074: Data Staged'
id: 683dbb36-8fb3-4ae8-8768-86cad04619fb
description: 'Investigate whether an adversary is staging collected data in a central location prior to
  exfiltration. This playbook helps an analyst hunt for the data-staging workflow on endpoints, cloud,
  and ESXi/Linux/macOS hosts: bursts of file creation and write activity into temporary, user-writable,
  or shared directories (e.g., C:\Windows\Temp, C:\Users\Public, %TEMP%, /mnt, cloud-sync folders); execution
  of archiving utilities (7z.exe, rar.exe, tar, zip) or LOLBins (powershell Compress-Archive, certutil)
  with compression/encryption flags writing archives into staging paths; a single process reading large
  numbers of unique files from many directories then producing one archive; statistically significant
  spikes in file-creation volume/size within known staging directories; and large internal (east-west)
  network transfers that consolidate data onto a single non-repository host. It combines symbolic-logic
  rules, statistical baselining, and machine-learning approaches across Windows, Linux (auditd), macOS,
  cloud, and ESXi telemetry so a SOC analyst can detect, scope, and confirm data consolidation before
  it leaves the environment.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
