    entropy/fuzzy-hash similarity triage of unknown images from [Large-Scale Analysis of Embedded Firmwares](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indication of
