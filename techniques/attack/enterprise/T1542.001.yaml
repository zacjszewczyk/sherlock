name: 'T1542.001: Pre-OS Boot: System Firmware'
id: 377bcf9a-9f92-45ce-94ea-9a1b4edcc99e
description: 'This playbook helps an analyst investigate whether an adversary is modifying system firmware
  (BIOS/UEFI/EFI) or abusing the pre-OS boot path to gain stealthy, reinstall-surviving persistence on
  Windows endpoints and on network devices (routers, switches, firewalls). It guides the hunt across several
  behavioral angles: threat-intelligence hash matching of malicious firmware utilities, EFI/BIOS modules,
  and bootkits (LoJax, MoonBounce, BlackLotus) seen in process, file-write, and driver-load telemetry;
  execution of firmware management tools (AFUWIN, FWUpdLcl, flashrom, Intel fpt, CHIPSEC) with write/dump/modify
  flags outside maintenance windows or by unauthorized users; boot-time anomalies where processes or outbound
  connections appear immediately after boot or before the EDR/security service starts; unauthorized access
  to firmware-related memory (\Device\PhysicalMemory, raw physical drives) audited via SACLs; bcdedit
  boot-configuration tampering that disables integrity checks or enables test-signing; attempts to terminate
  or reconfigure host-based security sensors (including BYOVD); and unauthorized firmware image or boot-variable
  changes on network devices verified against vendor-signed golden measurements. Detection methods combine
  symbolic-logic rules, statistical baselining/change-point detection, and machine-learning models applied
  to Windows Security/Sysmon events, PowerShell script-block logs, Zeek conn.log, syslog, and network-device
  config/runtime telemetry, so the analyst can corroborate suspected firmware tampering against process
  lineage, boot timing, integrity attestation, and management-plane context.'
type: technique
