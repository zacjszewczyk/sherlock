questions:
- question: '[Stealth] Firmware-hash TI check: Can you determine whether a file hash matching a known
    malicious firmware utility or EFI/BIOS module is observed during process execution or file-write activity.
    -- specifically using the ''Firmware-hash TI check'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the mission question is "Is the adversary
    maintaining persistence through system firmware modification?" System firmware (BIOS/UEFI) tampering
    and pre-OS boot abuse give a sophisticated adversary persistence and concealment that survive reinstalls
    and evade OS-level defenses, so early, multi-angle detection is essential. This evidence focuses on
    the condition that a file hash matching a known malicious firmware utility or EFI/BIOS module is observed
    during process execution or file-write activity. This is a deterministic, rule-based (Symbolic Logic)
    detection: it fires when a specific, well-defined condition is met, giving high-confidence, explainable
    hits that map directly to known adversary tradecraft. Approach: Correlate process execution (EID 4688/Sysmon
    EID 1) and file writes (Sysmon EID 11) against threat-intelligence hashes for malicious firmware utilities
    and EFI/BIOS modules (e.g., LoJax, MoonBounce, BlackLotus boot binaries) per [BlackLotus UEFI bootkit](https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/),
    and verify firmware images/regions against signed-update transactions and authoritative golden measurements
    per [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf);
    alert on any direct hash match OR any firmware write not paired with a valid vendor signed-update
    event (State=unauthorized write). A positive result -- a rule match, statistical outlier, or model
    alert -- is a strong indication of firmware/boot-level tampering or its precursors and warrants immediate
    triage: pivot to the responsible process or device, its parent lineage, the user and host context,
    the firmware/boot artifacts touched, and any correlated boot-time or management-plane activity, ideally
    confirming with an out-of-band golden-image or integrity attestation. A negative result helps reduce
    suspicion for this specific vector but should be corroborated with the other questions in this playbook,
    since firmware implants are deliberately stealthy and any single method can be evaded.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - 'NAI: Critical system endpoints (e.g., domain controllers, database servers) and administrator workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Firmware-hash TI check\nFOR each event IN scope:\n  IF condition_matches('Firmware-hash\
      \ TI check') THEN  # Correlate process execution (EID 4688/Sysmon EID 1) and file writes (Sysmon\
      \ EID 11) against threat-intelligence hashes for malicious firmwar\n    raise_alert(severity=high,\
      \ host, user, process, evidence_fields)"
