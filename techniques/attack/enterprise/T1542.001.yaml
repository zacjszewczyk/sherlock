    process or device, its parent lineage, the user and host context, the firmware/boot artifacts touched,
    and any correlated boot-time or management-plane activity, ideally confirming with an out-of-band
    golden-image or integrity attestation. A negative result helps reduce suspicion for this specific
    vector but should be corroborated with the other questions in this playbook, since firmware implants
    are deliberately stealthy and any single method can be evaded.'
