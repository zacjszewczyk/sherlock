name: 'T1204.002: Malicious File'
id: d24a2e35-ed1e-4e59-97a1-1a4c899679ae
description: 'This playbook helps an analyst investigate whether an adversary achieved code execution
  by socially engineering a user into opening a malicious file (e.g., .doc, .xls, .pdf, .rtf, .scr, .exe,
  .lnk, .pif, .cpl, .reg, .iso) delivered via spearphishing attachment, web download, chat, removable
  media, or a shared directory, under the Execution tactic (T1204.002). It guides the hunt across Windows,
  Linux, and macOS along several behavioral angles: execution of files whose hashes match threat-intelligence
  indicators or that are rare across the fleet; network connections to known-malicious destinations occurring
  seconds after a user-initiated file runs; document handlers and archive utilities (WINWORD, EXCEL, POWERPNT,
  OUTLOOK, ACROBAT, AcroRd32, 7z, WinRAR) spawning interpreters and loaders (powershell, cmd, wscript,
  cscript, mshta, regsvr32, rundll32, msiexec, certutil, bitsadmin); interpreter command lines bearing
  obfuscation, encoding, or download-cradle patterns; document-spawned children that subsequently reach
  out to external infrastructure; and processes launched from temp/download directories shortly after
  a file is fetched, often carrying a Mark-of-the-Web / Zone.Identifier attribute. Each angle is pursued
  with three complementary methods -- deterministic symbolic-logic rules, statistical baselining/prevalence/rarity
  analysis, and machine-learning models (static PE classification, Isolation Forest, character-level command
  classifiers, and provenance-graph reconstruction) -- applied to Windows Event ID 4688/5156, Sysmon EID
  1/3/11/15, auditd SYSCALL, macOS EndpointSecurity/unified logs, and Zeek conn/dns/http/files logs, so
  the analyst can corroborate suspected user execution against process lineage, download provenance, command-line
  content, and network context.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
