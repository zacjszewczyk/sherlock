    execution rate (count/hour) and flag spikes >3σ. Surface the prevalence count and host count in the
    alert ([What''s the deal with prevalence?, F-Secure Labs](https://blog.f-secure.com/whats-the-deal-with-prevalence/);
    [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)).
