    and network telemetry. This evidence focuses on the condition that execution of a process where the
    executable''s file hash matches a known malicious indicator from threat intelligence sources. This
    Machine Learning approach looks for the following signal: Score unknown executables locally with a
    gradient-boosted model over static PE features (byte/entropy histograms, PE header, imports, section
    sizes, string statistics) such as the EMBER LightGBM baseline (>98% AUC), running first-party without
    external sandboxing. Emit the top-3 contributing features (e.g., high section entropy, anomalous imports,
    packer indicators) via TreeSHAP attribution in the alert text rather than a bare score ([EMBER: An
    Open Dataset for Training Static PE Malware ML Models, Anderson and Roth](https://arxiv.org/abs/1804.04637);
    [Rule Extraction and Interaction-Aware Explainability for AI-Driven Malware Detection, Anthony et
    al.](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9)). A positive result -- a rule
    match, statistical outlier, or model alert -- suggests a user-opened file led to adversary-controlled
    code running on the host; pivot to the responsible process, its parent document handler or archiver,
    the originating file and its download URL/Mark-of-the-Web attribute, the user/host context, and any
    subsequent network connections or follow-on execution. A negative result helps rule out this user-execution
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss obfuscated, living-off-the-land, or delayed-trigger malicious files.'
