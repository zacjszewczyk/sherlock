questions:
- question: '[Execution] Match executed hashes to CTI: Can you determine whether execution of a process
    where the executable''s file hash matches a known malicious indicator from threat intelligence sources.
    -- specifically, using the ''Match executed hashes to CTI'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary relies on a user opening
    a malicious file to gain execution, which typically follows spearphishing, an internal phish, or a
    planted file in a shared/desktop location and leaves traces in file-creation, process-execution, command-line,
    and network telemetry. This evidence focuses on the condition that execution of a process where the
    executable''s file hash matches a known malicious indicator from threat intelligence sources. This
    Symbolic Logic approach looks for the following signal: Compare each Windows Event ID 4688 / Sysmon
    EID 1 executable SHA256 to aggregated CTI hashes and alert on matches, prioritizing files that ran
    within 5 minutes of user interaction and that carry a Mark-of-the-Web / Zone.Identifier (downloaded)
    attribute; log the parent image, command line, and originating path for triage. Maintain CTI as a
    local lookup table so detection works first-party on internal logs ([Suspicious Microsoft Office Child
    Process, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_office_susp_child_processes/)).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a user-opened file
    led to adversary-controlled code running on the host; pivot to the responsible process, its parent
    document handler or archiver, the originating file and its download URL/Mark-of-the-Web attribute,
    the user/host context, and any subsequent network connections or follow-on execution. A negative result
    helps rule out this user-execution vector but should be corroborated with the other questions in this
    playbook, since a single method can miss obfuscated, living-off-the-land, or delayed-trigger malicious
    files.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User workstations, VDI instances, and critical application servers.'
  range: Last 90 days (correlate related events within a 5-minute window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match executed hashes to CTI (Symbolic Logic)

      source IN [Windows Event ID 4688]

      | WHERE matches_action_criteria("Match executed hashes to CTI")

      // Compare each Windows Event ID 4688 / Sysmon EID 1 executable SHA256 to aggregated CTI hashes
      and alert on matches, prioritizing files that ran within 5 minutes of user interaction and that
      carry a Mark-of-the-Web / Zone.Identifier (downloaded) attribute; lo...

      | ALERT enrich(host, user, process, parent_image, command_line, file_path, download_url, dest)'
- question: '[Execution] Prevalence-informed prioritization: Can you determine whether execution of a
