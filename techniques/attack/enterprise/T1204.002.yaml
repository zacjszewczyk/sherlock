- question: '[Execution] Static PE feature classification: Can you determine whether execution of a process
    where the executable''s file hash matches a known malicious indicator from threat intelligence sources.
    -- specifically, using the ''Static PE feature classification'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary relies on a user opening
