- question: '[Reconnaissance] Which connections from document-handler-spawned processes go to a destination
    FQDN in the bottom 1st percentile of request frequency (''long-tail'') over a 90-day baseline and,
    if TLS, present a JA3 hash that is rare for the connecting client -- additionally weighing bytes-out/bytes-in
    ratio, connection duration, and beacon-interval regularity (Statistical Method) approach?'
  context: 'Why this matters: Adversary command-and-control destinations are, by definition, rarely contacted
    by the enterprise and frequently use uncommon TLS client fingerprints, so long-tail FQDN analysis
    combined with rare-JA3 detection surfaces beaconing even when no blocklist entry exists. How it works:
    establish a 90-day enterprise baseline of FQDNs (dns.log) and JA3 hashes (ssl.log); flag conn.log
    connections where the destination FQDN is in the bottom 1st percentile of request frequency and, if
    TLS, the JA3 hash is rare for the connecting client, then correlate the rare connection back to a
    document-handler-spawned process. Include bytes-out/bytes-in ratio, connection duration, and beacon-interval
    regularity to distinguish automated beacons from incidental rare browsing. Use the unsupervised, poisoning-robust
    baselining recipe (Nature s41598-025-20445-4) and derive percentile thresholds from your own network
    baseline. A positive result -- a document-spawned process reaching a long-tail FQDN with a rare client
    JA3 and regular beacon cadence -- is a strong C2 indicator; benign rare destinations (one-off vendor
    sites) typically lack the document-handler parent and regular cadence. Source method: Statistical
    Method: long-tail FQDN and rare-JA3 baselining for document-spawned connections'
