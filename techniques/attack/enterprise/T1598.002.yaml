name: 'T1598.002: Spearphishing Attachment'
id: 293856ee-1360-4877-b6e2-08a7f398cbd9
description: 'This playbook helps an analyst investigate whether an adversary is conducting reconnaissance
  by sending spearphishing emails with malicious or information-eliciting attachments to enterprise users
  (MITRE ATT&CK T1598.002, Spearphishing Attachment, under the Reconnaissance tactic). In this technique
  the adversary attaches a file to a targeted email and uses social-engineering lures (impersonating a
  partner, citing urgency, or requesting that a form be filled-in and returned) to trick recipients into
  divulging sensitive information such as credentials, or to harvest credentials via attachment-borne
  fake login portals and HTML smuggling. The hunt pursues the behavior from several complementary angles:
  inbound emails whose attachment hash, sender IP, sender domain, or reply-to address matches threat intelligence,
  or that show display-name/domain impersonation and SPF/DKIM/DMARC failures; rare and newly-registered
  sender domains that arrive bearing attachments; document-handler processes (WINWORD.EXE, EXCEL.EXE,
  OUTLOOK.EXE, ACROBAT.EXE, etc.) spawning command interpreters, scripting engines, or reconnaissance
  utilities; bursts of similar attachments from a single new external domain to a small, homogeneous group
  of targeted recipients; and document-spawned processes making outbound network connections to low-reputation,
  blocklisted, or never-before-seen destinations. Detection methods combine deterministic symbolic-logic
  rules (hash/blocklist matching, impersonation logic, unusual-parent process allowlists, host+network
  correlation), statistical baselining (sender-domain rarity and WHOIS age scoring, Directed Anomaly Scoring,
  recipient-list entropy, rare parent-child pairs and command-line entropy, long-tail FQDN and rare-JA3
  analysis), and machine learning (explainable impersonation/intent classifiers, campaign clustering and
  random-forest targeting classifiers, Isolation Forest/One-Class SVM process-chain and encrypted-flow
  outlier scoring), applied across Zeek smtp/files/conn/dns/ssl logs, Windows Event ID 4688, and Sysmon
  Event IDs 1 and 3, so the analyst can corroborate suspected spearphishing-for-information against email
  authentication, sender reputation, process lineage, and network egress telemetry.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: '[Reconnaissance] Does any inbound email carry an attachment whose SHA256 hash matches a known-malicious
    signature, or originate from a sender IP, From-header domain, or Reply-To domain present on a threat-intelligence
    blocklist, or exhibit display-name/domain impersonation (a trusted internal or partner display name
    paired with a never-before-seen From address) -- using the SHA256-hash, IP/domain-blocklist, and authentication-failure
    impersonation-matching (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary sends spearphishing
    emails bearing attachments to elicit sensitive information, frequently impersonating a trusted source
    to make the lure believable. This deterministic approach catches the cleanest, highest-confidence
    cases. How it works: for each file seen in Zeek files.log sourced from SMTP, compute its SHA256 and
    query internal and external threat-intel feeds; concurrently extract the sender IP (id.orig_h), From-header
    domain, and Reply-To domain from smtp.log and check them against IP/domain blocklists. Apply impersonation
    logic (per Ho et al., USENIX Security 2017): flag when a known internal/partner display name is paired
    with a never-before-seen From address, or when the sender domain has never been observed. Parse auth_results
    and count SPF/DKIM/DMARC fail results as a distinct corroborating signal, but do NOT require an auth
    failure -- lateral/internal spoofing (Ho et al., USENIX Security 2019) often passes authentication.
    A positive result (hash/blocklist hit or display-name/domain impersonation with an attachment present)
    is a strong, actionable indicator warranting a high-severity alert and quarantine; a negative result
    reduces but does not eliminate suspicion, so pair it with the statistical and ML methods below. Source
    method: Symbolic Logic: SHA256 hash, IP/domain blocklist, and authentication-failure matching with
    impersonation logic'
  answer_sources:
  - Zeek files.log
  - Zeek smtp.log
  - 'NAI: Email Gateway, Mail Servers, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'files.log WHERE source=="SMTP"

      | compute sha256 = file_hash

      | lookup sha256 IN threat_intel_hashes -> hash_match

      | JOIN smtp.log ON files.conn_uids == smtp.uid

      | enrich sender_ip=id.orig_h, from_dom=domain(mailfrom/From), reply_dom=domain(reply_to)

      | lookup sender_ip,from_dom,reply_dom IN ip_domain_blocklist -> ioc_match

      | flag impersonation WHERE display_name IN known_display_names AND From NOT IN historical_from_for(display_name)

      | flag new_domain WHERE from_dom NOT IN domains_seen_last_60d

      | parse auth_results -> spf,dkim,dmarc (count ''fail'' as auth_fail_signal)

      WHERE hash_match OR ioc_match OR impersonation OR new_domain

      -> ALERT severity=high'
  - technology: SIEM/Rule pseudocode
    query: 'index=email sourcetype=mail_gateway has_attachment=true

      | eval ioc = (attachment_sha256 IN ti_hashes) OR (src_ip IN ti_ips) OR (from_domain IN ti_domains)
      OR (reply_to_domain IN ti_domains)

      | eval impersonation = (display_name IN trusted_display_names AND from_addr NOT IN seen_addrs_for_display_name)

      | eval auth_fail = (spf="fail" OR dkim="fail" OR dmarc="fail")

      | where ioc OR impersonation

      | table _time from_addr display_name attachment_sha256 ioc impersonation auth_fail recipients

      -> alert high'
- question: '[Reconnaissance] Which inbound emails arrive from a sender domain that is both rare (bottom
    5th percentile of sending frequency in your 30-day SMTP baseline) and newly registered (WHOIS creation
    date < 30 days), while carrying an attachment -- ranked by Directed Anomaly Scoring across sender-rarity,
    domain-age, and authentication-failure axes (Statistical Method) approach?'
  context: 'Why this matters: Reconnaissance-stage spearphishing frequently uses freshly stood-up infrastructure
    that has little or no sending history with your organization, so a domain that is simultaneously rare
    and newly registered and that delivers an attachment is disproportionately suspicious. How it works:
    from smtp.log build a 30-day rolling baseline of sender domains, identify domains in the bottom 5th
    percentile of sending frequency, and enrich each with WHOIS registration date, flagging those younger
    than 30 days. Rank candidates with Directed Anomaly Scoring (Ho et al., USENIX Security 2017), which
    flags events more suspicious than all benign events along the sender-rarity/domain-age/auth-fail axes
    to bound alert volume to roughly 10/day. Also track attachments-per-sender-domain per hour and the
    count of distinct recipients, weighting by recipient-role and campaign-burstiness risk factors (Google,
    Who is Targeted by Email-Based Phishing). A positive result -- a rare, new domain delivering an attachment
    that scores above your baseline-derived threshold -- merits review; derive percentile and age thresholds
    from your own 30-day SMTP baseline rather than fixed numbers. Source method: Statistical Method: rare
    + newly-registered sender domain with attachment, scored by Directed Anomaly Scoring'
  answer_sources:
  - Zeek files.log
  - Zeek smtp.log
  - 'NAI: Email Gateway, Mail Servers, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=email earliest=-30d has_attachment=true

      | stats count by from_domain  -> freq

      | eventstats perc5(freq) as p5

      | eval rare = (freq <= p5)

      | lookup whois from_domain OUTPUT creation_date

      | eval domain_age_days = now() - creation_date

      | eval newdom = (domain_age_days < 30)

      | eval auth_fail = (spf="fail" OR dkim="fail" OR dmarc="fail")

      | eval das_score = das(rare, newdom, auth_fail)   /* Directed Anomaly Scoring */

      | where rare AND newdom

      | sort - das_score | head 10

      -> review'
  - technology: Zeek/pseudocode
    query: 'smtp.log last 1h

      | JOIN files.log ON uid==conn_uids WHERE attachment present

      | stats attach_count, dcount(rcptto) as recipients BY from_domain

      | enrich domain_age=whois_age(from_domain), freq_pct=baseline_pct(from_domain,30d)

      WHERE freq_pct<=5 AND domain_age<30d

      | score = das(freq_pct, domain_age, auth_fail) weighted by recipient_role_risk

      -> rank, alert top-N'
- question: '[Reconnaissance] Can an explainable classifier identify spearphishing-for-information emails
    by scoring first-party features (sender IP reputation, domain age, TLD rarity, SPF/DKIM/DMARC booleans,
    attachment MIME type and size, attachment-to-body byte ratio, subject-line entropy, IOC-presence)
    augmented with NLP intent scoring of the body, and surface the top-3 contributing features per alert
    -- using the explainable impersonation/intent classifier with top-3 feature attribution (Machine Learning)
    approach?'
  context: 'Why this matters: Sophisticated spearphishing lures evade single-signal rules, so a model
    that fuses sender-reputation, attachment, and language-intent features generalizes better while remaining
    defensible. How it works: train an explainable classifier on first-party email features (sender IP
    reputation, sender domain age, TLD rarity score, SPF/DKIM/DMARC pass/fail booleans, attachment MIME
    type, attachment file size, attachment-to-body byte ratio, subject-line entropy, IOC-presence boolean).
    Augment with NLP intent scoring of the body for urgency/lure/attachment-request language (per the
    explainable transformer of Otieno et al., arXiv 2402.13871, and ChatSpamDetector, arXiv 2402.18093)
    and a reproducible LIME/SHAP-explained pipeline (arXiv 2405.11619). The alert MUST surface the top-3
    contributing features (e.g., ''domain age 4d, SPF fail, urgency-language score 0.92''), not just a
    probability, following LIME attribution (Nature s41598-025-20445-4). Emails scoring above a tuned
    threshold (e.g., > 0.90) are flagged for quarantine; the feature attribution lets the analyst confirm
    or dismiss quickly and tune the model. A positive, well-attributed score is strong evidence of a crafted
    lure; an opaque high score without attribution should be treated cautiously. Source method: Machine
    Learning: explainable impersonation/intent classifier with top-3 feature attribution'
  answer_sources:
  - Zeek files.log
  - Zeek smtp.log
  - 'NAI: Email Gateway, Mail Servers, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [src_ip_reputation, domain_age_days, tld_rarity, spf_fail, dkim_fail,\n       \
      \    dmarc_fail, attach_mime, attach_size, attach_to_body_ratio,\n           subject_entropy, ioc_present,\
      \ nlp_intent_score(body)]\nmodel = train_explainable_classifier(labeled_email_corpus)\nfor email\
      \ in inbound_with_attachment:\n    p = model.predict_proba(features(email))\n    top3 = LIME_or_SHAP_explain(model,\
      \ features(email)).top(3)\n    if p > 0.90: ALERT(email, prob=p, top_features=top3) -> quarantine"
  - technology: SIEM/pseudocode
    query: 'index=email has_attachment=true

      | apply phish_intent_model -> score, top3_features

      | where score > 0.90

      | table _time from_addr subject attachment_name score top3_features

      -> quarantine'
- question: '[Reconnaissance] Does a document-handler process (OUTLOOK.EXE, WINWORD.EXE, EXCEL.EXE, POWERPNT.EXE,
    ACROBAT.EXE, ACRORD32.EXE) spawn a child that is a command-line interpreter, scripting engine, or
    reconnaissance utility (powershell.exe, cmd.exe, wscript.exe, cscript.exe, mshta.exe, whoami.exe,
    systeminfo.exe, ipconfig.exe, net.exe, net1.exe, nltest.exe, dsquery.exe) -- using the document-handler-parent-spawning-recon/interpreter-child
    (Symbolic Logic) approach?'
  context: 'Why this matters: When a spearphishing attachment is opened, malicious macros or exploit code
    typically cause the document application to spawn an interpreter or reconnaissance tool -- a parent-child
    relationship that almost never occurs during legitimate document use. Catching it provides high-confidence
    evidence that an attachment executed code on the endpoint. How it works: monitor Windows Event ID
    4688 and Sysmon Event ID 1 for process creation and trigger when a ParentProcessName in the document-handler
    set spawns a NewProcessName in the interpreter/recon set, applying the deterministic parent-allowlist
    logic of the Sigma ''Unusual Parent Process For Cmd.EXE'' rule. A direct match is a high-severity
    alert; investigate the spawned command line, network activity, and the originating email/attachment.
    The chief tuning concern is benign automation (e.g., enterprise macros or add-ins) that legitimately
    launches a scripting engine -- baseline those parent-child pairs and allowlist them so the rule stays
    precise. Source method: Symbolic Logic: document-handler parent spawning recon/interpreter child (Sigma
    unusual-parent logic)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Virtual Desktop Infrastructure (VDI), Application Servers (e.g., Citrix)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=endpoint (EventCode=4688 OR (source=Sysmon EventCode=1))\n| eval parent=lower(ParentProcessName),\
      \ child=lower(NewProcessName)\n| where parent IN (\"outlook.exe\",\"winword.exe\",\"excel.exe\"\
      ,\"powerpnt.exe\",\"acrobat.exe\",\"acrord32.exe\")\n      AND child IN (\"powershell.exe\",\"cmd.exe\"\
      ,\"wscript.exe\",\"cscript.exe\",\"mshta.exe\",\n                    \"whoami.exe\",\"systeminfo.exe\"\
      ,\"ipconfig.exe\",\"net.exe\",\"net1.exe\",\n                    \"nltest.exe\",\"dsquery.exe\"\
      )\n| table _time host parent child CommandLine User\n-> alert high"
  - technology: Sigma/pseudocode
    query: "detection:\n  selection:\n    ParentImage|endswith: ['\\\\OUTLOOK.EXE','\\\\WINWORD.EXE','\\\
      \\EXCEL.EXE','\\\\POWERPNT.EXE','\\\\ACROBAT.EXE','\\\\ACRORD32.EXE']\n    Image|endswith: ['\\\\\
      powershell.exe','\\\\cmd.exe','\\\\wscript.exe','\\\\cscript.exe','\\\\mshta.exe','\\\\whoami.exe','\\\
      \\systeminfo.exe','\\\\ipconfig.exe','\\\\net.exe','\\\\net1.exe','\\\\nltest.exe','\\\\dsquery.exe']\n\
      \  condition: selection"
- question: '[Reconnaissance] Among process-creation events, which executions involve a parent-child process
    pair in the bottom 1st percentile of frequency (over a 90-day baseline) AND a command line whose argument
    entropy is more than 3 standard deviations above that child''s mean -- i.e., an uncommon process chain
    carrying obfuscated arguments (Statistical Method) approach?'
  context: 'Why this matters: Attachment-borne payloads often launch interpreters with heavily obfuscated
    (base64/encoded) command lines, and the resulting parent-child chains are statistically rare on a
    well-baselined host fleet. Combining rarity with high command-line entropy surfaces malicious execution
    even when the exact tools differ from a static allowlist. How it works: using a 90-day baseline of
    process creation (Event ID 4688 / Sysmon 1), compute the frequency of every unique parent-child pair
    and the per-child command-line entropy distribution; flag executions where the pair sits in the bottom
    1st percentile of frequency AND the command-line entropy is >3 standard deviations above that child''s
    mean. Track child-process exit/error codes and short-lived (<1s) reconnaissance processes as additional
    distinct signals. Derive percentile and entropy thresholds from your own host baseline (unsupervised
    baselining recipe, Nature s41598-025-20445-4). A positive result is a rare chain with obfuscated arguments
    warranting investigation of the parent document and the payload; tune by excluding known-rare-but-benign
    administrative tooling. Source method: Statistical Method: rare parent-child pair plus high command-line
    entropy baseline'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Virtual Desktop Infrastructure (VDI), Application Servers (e.g., Citrix)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint EventCode IN (4688,1) earliest=-90d

      | eval pair=ParentProcessName."->".NewProcessName

      | eval cl_entropy=shannon_entropy(CommandLine)

      | eventstats count as pair_freq by pair

      | eventstats perc1(pair_freq) as p1

      | eventstats mean(cl_entropy) as mu, stdev(cl_entropy) as sd by NewProcessName

      | eval rare_pair=(pair_freq<=p1), obfuscated=(cl_entropy > mu + 3*sd)

      | where rare_pair AND obfuscated

      | table _time host pair CommandLine cl_entropy ExitCode

      -> review'
  - technology: SIEM/Stats pseudocode
    query: '/* short-lived recon process corroboration */

      index=endpoint EventCode IN (4688,1)

      | transaction ProcessGuid startswith=create endswith=terminate

      | eval lifetime=duration

      | where lifetime < 1 AND NewProcessName IN ("whoami.exe","systeminfo.exe","ipconfig.exe","nltest.exe")

      -> corroborating signal'
- question: '[Reconnaissance] Can an unsupervised model (Isolation Forest, One-Class SVM, or DBSCAN) trained
    on benign process chains flag anomalous executions -- vectorizing each event as [hash(parent), hash(child),
    command-line length, command-line entropy, special-character count, child-process count under the
    parent] -- and surface the top-3 contributing features when the parent is a document handler (Machine
    Learning) approach?'
  context: 'Why this matters: Document-spawned malicious execution varies in tooling and arguments, so
    an outlier model trained on benign chains captures the abnormality more robustly than enumerated rules,
    while explanations keep alerts triageable. How it works: vectorize each process-creation event as
    [categorical-hash(parent), categorical-hash(child), command-line length, command-line entropy, special-character
    count, child-process count under the parent] and apply Isolation Forest / One-Class SVM (or DBSCAN)
    trained on benign chains (Nature s41598-025-20445-4); outliers or noise points where the parent is
    a document handler are highly anomalous. Emit the top-3 contributing features per alert (e.g., ''parent=WINWORD,
    cmdline entropy 5.8, base64 length 412'') via LIME attribution rather than an opaque score, so the
    analyst can confirm the chain quickly. A positive, well-attributed outlier with a document-handler
    parent strongly suggests attachment execution; periodically retrain on vetted benign data to control
    drift and avoid poisoning. Source method: Machine Learning: one-class/clustering outlier detection
    on process-chain features with top-3 attribution'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Virtual Desktop Infrastructure (VDI), Application Servers (e.g., Citrix)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = [hash(parent), hash(child), len(cmdline), entropy(cmdline),\n     special_char_count(cmdline),\
      \ child_count_under(parent)]\nmodel = IsolationForest().fit(benign_process_chains)   # or OneClassSVM\
      \ / DBSCAN\nfor evt in process_creation_stream:\n    score = model.decision_function(X(evt))\n \
      \   if is_outlier(score) and parent(evt) in DOCUMENT_HANDLERS:\n        top3 = LIME_explain(model,\
      \ X(evt)).top(3)\n        ALERT(evt, score, top_features=top3)"
  - technology: SIEM/pseudocode
    query: 'index=endpoint EventCode IN (4688,1)

      | apply process_chain_outlier_model -> anomaly_score, top3_features

      | where anomaly_score>threshold AND ParentProcessName IN document_handlers

      | table _time host ParentProcessName NewProcessName CommandLine anomaly_score top3_features'
- question: '[Reconnaissance] Does a sender domain not seen in the last 60 days send emails to more than
    2 but fewer than 20 unique internal recipients within a 1-hour window, where all associated emails
    carry an attachment of the same file type and similar naming convention (e.g., Invoice_####.pdf) --
    using the new-domain-burst-to-small-homogeneous-recipient-set-with-identical-attachments (Symbolic
    Logic) approach?'
  context: 'Why this matters: Reconnaissance spearphishing campaigns commonly fan out a near-identical
    attachment from freshly provisioned infrastructure to a small, deliberately chosen recipient set,
    producing a tell-tale low-volume burst that differs sharply from broad marketing mail. How it works:
    from smtp.log, trigger when a sender domain not seen in the last 60 days sends to more than 2 but
    fewer than 20 unique internal recipients within a 1-hour window, where all associated emails carry
    an attachment of the same file type (correlate smtp.log uid to files.log fuid) and a similar naming
    convention. This recipient-profile/targeting logic follows Ho et al. (USENIX Security 2019, lateral
    phishing at scale); weight the burst window using campaign-burstiness evidence (Google, Who is Targeted
    by Email-Based Phishing). A positive result -- a new domain, a tight recipient set, and homogeneous
    attachments in a short window -- is a strong campaign indicator warranting correlation with the per-email
    IOC and impersonation checks; tune recipient-count and window bounds to your environment to avoid
    catching legitimate small-vendor onboarding bursts. Source method: Symbolic Logic: new-domain burst
    to small homogeneous recipient set with identical attachments'
  answer_sources:
  - Zeek smtp.log
  - Zeek files.log
  - 'NAI: Email Gateway, Directory Services, Human Resources Information System (HRIS)'
  range: Last 90 days; correlate within 1-hour burst windows
  queries:
  - technology: Zeek/pseudocode
    query: "smtp.log window=1h\n| filter from_domain NOT IN domains_seen_last_60d\n| JOIN files.log ON\
      \ uid==conn_uids -> attachment file_type, name\n| stats dcount(rcptto) as recipients, set(file_type)\
      \ as types,\n        name_pattern_similarity(names) as name_sim BY from_domain, window\n| where\
      \ recipients > 2 AND recipients < 20\n      AND len(types)==1 AND name_sim > 0.8\n-> alert campaign"
  - technology: SIEM/Rule pseudocode
    query: "index=email earliest=-1h has_attachment=true\n| where from_domain NOT IN seen_domains_60d\n\
      | stats dc(recipient) as rcpts, values(attach_type) as types,\n        values(attach_name) as names\
      \ by from_domain\n| eval same_type=(mvcount(types)==1), homogeneous_name=name_regex_match(names)\n\
      | where rcpts>2 AND rcpts<20 AND same_type AND homogeneous_name\n-> alert campaign"
- question: '[Reconnaissance] For each attachment-bearing burst from a new sender domain (not seen in
    60 days), is the Shannon entropy of the recipient list low and do recipients share an attribute (e.g.,
    same department per directory services), and -- where the sender is internal/known -- does the email
    deviate from that sender''s historical X-Mailer/MIME/send-hour profile and stylometry -- ranked with
    Directed Anomaly Scoring (Statistical Method) approach?'
  context: 'Why this matters: Targeted campaigns concentrate on a coherent victim group (low recipient-list
    entropy plus a shared organizational attribute), which distinguishes them from broadly addressed legitimate
    mail; and when an adversary spoofs or compromises a known sender, the message often deviates from
    that sender''s established behavioral and writing fingerprint. How it works: for each burst from a
    new sender domain (not seen in 60 days), compute the Shannon entropy of the recipient list -- low
    entropy combined with a shared recipient attribute (same department from directory services) indicates
    a targeted campaign -- and rank with Directed Anomaly Scoring (Ho et al., USENIX Security 2017). Where
    the sender is internal/known, score deviation from that sender''s historical composition (X-Mailer,
    MIME structure, send-hour) and stylometry (Stringhini & Thonnard, DIMVA 2015; Duman et al., arXiv
    1406.3692). Track emails-per-minute and identical-attachment count in the window. A positive result
    -- new domain, low recipient entropy, shared attribute, and an attachment, or a marked stylometric/behavioral
    deviation for a known sender -- is a strong targeting signal; derive entropy and window thresholds
    from your own SMTP baseline. Source method: Statistical Method: recipient-list entropy, shared-attribute
    targeting, and per-sender behavioral deviation'
  answer_sources:
  - Zeek smtp.log
  - Zeek files.log
  - 'NAI: Email Gateway, Directory Services, Human Resources Information System (HRIS)'
  range: Last 90 days; correlate within 1-hour burst windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=email has_attachment=true window=1h\n| where from_domain NOT IN seen_domains_60d\n|\
      \ stats list(recipient) as rcpts, dc(recipient) as n,\n        count as msgs by from_domain, window\n\
      | eval rcpt_entropy = shannon_entropy(rcpts)\n| lookup directory recipient OUTPUT department\n|\
      \ eval shared_attr = (dc(department)==1)\n| eval das = das(low(rcpt_entropy), shared_attr, attachment_present)\n\
      | where rcpt_entropy < baseline_low AND shared_attr\n| sort - das -> review"
  - technology: SIEM/Stats pseudocode
    query: '/* known-sender behavioral + stylometric deviation */

      index=email from_addr IN known_internal_senders has_attachment=true

      | eval dev = profile_distance(x_mailer, mime_struct, send_hour, baseline_for(from_addr))

      | eval stylo = stylometry_distance(body, author_model(from_addr))

      | where dev > 3*sigma OR stylo > threshold

      -> review'
- question: '[Reconnaissance] Can clustering on [sender domain, attachment file type, recipient department,
    recipient-set size, send-hour] isolate small dense clusters distinct from large general-purpose ones
    (newsletters) that represent targeted campaigns (e.g., 10 PDFs from a new domain to only Finance),
    or can a random-forest targeting classifier flag campaign emails -- surfacing the top-3 contributing
    features per cluster/alert (Machine Learning) approach?'
  context: 'Why this matters: Targeted spearphishing campaigns form tight, coherent clusters in feature
    space that look nothing like broadly distributed legitimate bulk mail, so unsupervised clustering
    (or a supervised targeting classifier) can surface campaigns that per-email rules miss. How it works:
    cluster emails on [sender domain (encoded), attachment file type (encoded), recipient department (encoded),
    recipient-set size, send-hour]; small dense clusters distinct from large general-purpose ones (newsletters)
    represent targeted campaigns -- e.g., 10 PDFs from a new domain to only Finance. Alternatively train
    a random-forest targeting classifier on recipient-unlikelihood/URL/intent features (Ho et al., USENIX
    Security 2019). Surface the top-3 contributing features per cluster/alert via the LIME/SHAP approach
    (arXiv 2405.11619) so the analyst sees why a cluster was flagged. A positive result -- a compact,
    homogeneous cluster of attachment-bearing mail to a narrow recipient group from a new domain -- is
    a strong campaign signal; investigate the constituent emails together and pivot to the endpoint methods
    if any attachment executed. Source method: Machine Learning: campaign clustering / random-forest targeting
    classifier with feature attribution'
  answer_sources:
  - Zeek smtp.log
  - Zeek files.log
  - 'NAI: Email Gateway, Directory Services, Human Resources Information System (HRIS)'
  range: Last 90 days; correlate within 1-hour burst windows
  queries:
  - technology: ML/pseudocode
    query: "X = [enc(sender_domain), enc(attach_type), enc(recipient_dept),\n     recipient_set_size,\
      \ send_hour]\nclusters = DBSCAN(eps, min_samples).fit(X over recent_email)\nfor c in clusters:\n\
      \    if dense(c) and small(c) and distinct_from_bulk(c):\n        top3 = SHAP_explain_cluster(c).top(3)\n\
      \        ALERT(campaign=c, top_features=top3)"
