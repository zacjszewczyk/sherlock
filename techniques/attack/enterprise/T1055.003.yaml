    into them lets an adversary blend C2 into expected traffic. Trigger on EID10 when any watchlisted
    target receives memory-write, set-context, or suspend/resume rights from a non-allowlisted source.
    A positive result flags a high-value injection target being manipulated, supporting the stealth/defense-evasion
    hypothesis. Maintain the source allowlist to control false positives. In the context of the Privilege
    Escalation tactic (TA0004), this directly supports the mission question "Has the adversary elevated
    privileges using thread execution hijacking?" Source method (Symbolic Logic): Trigger on EID10 when
    watchlisted targets (explorer.exe, svchost.exe, chrome.exe, firefox.exe, outlook.exe) are accessed
    with 0x0020/0x0010/0x0800 by a non-allowlisted source; these are prime hijack hosts because of their
    network capability and trust ([Process Injection (Part 1), Elastic](https://www.elastic.co/security-labs/process-injection-part-1);
    [Process Injection T1055 Report, Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/)).'
  answer_sources:
