- question: Where written memory content is observable (EID10 plus memory sampling/ETW), is the Shannon
    entropy of the written region above ~7.2, consistent with packed/encrypted shellcode rather than the
    5.0-6.5 native-code baseline?
  context: 'Packed or encrypted shellcode written into a target has high entropy (>7.2), whereas normal
    native code measures roughly 5.0-6.5. Where you can sample the written region via ETW or memory inspection,
    compute Shannon entropy and flag high-entropy writes. This directly characterizes the injected payload,
    distinguishing malicious code from benign cross-process writes. A high-entropy write is strong evidence
    of injected shellcode; entropy alone cannot prove intent, so correlate with the access chain. In the
    context of the Privilege Escalation tactic (TA0004), this directly supports the mission question "Has
    the adversary elevated privileges using thread execution hijacking?" Source method (Statistical Method):
    Where memory content is available (EID10 + memory sampling/ETW), compute Shannon entropy of written
    regions and flag entropy >7.2 (packed/encrypted shellcode) vs the 5.0-6.5 native-code baseline ([Entropy
    Analysis for Packed Malware, IEEE](https://ieeexplore.ieee.org/document/4140989); [Detecting Injection
    via ETW Memory Analysis, Springer](https://link.springer.com/article/10.1007/s10207-024-00836-w)).'
  answer_sources:
  - Sysmon Event ID 10
  - 'NAI: User Workstations, Application Servers, any system with internet access.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=etw_memory OR eid10_with_membuf

      | eval H=shannon_entropy(written_bytes)

      | where H>7.2

      | alert'
