- question: Within 5 minutes of being targeted by an EID10 write/context access, does the target process
    spawn a shell (cmd.exe, powershell.exe, wscript.exe) that it normally never spawns (e.g., lsass.exe
    spawning a child)?
  context: 'A hijacked process executing the adversary''s code frequently spawns an interpreter to run
    follow-on commands. Correlate the EID10 injection event with subsequent child-process creation (4688/EID1)
    of cmd/powershell/wscript within 5 minutes, especially for processes like lsass.exe that never legitimately
    spawn children. A positive correlation is a near-definitive post-injection execution signal and warrants
    immediate response. In the context of the Privilege Escalation tactic (TA0004), this directly supports
    the mission question "Has the adversary elevated privileges using thread execution hijacking?" Source
    method (Symbolic Logic): Alert when a process targeted in EID10 (write/context mask) spawns a shell
    (cmd.exe/powershell.exe/wscript.exe) within 5 minutes; e.g., lsass.exe never spawns children and such
    a sequence indicates code executing post-hijack ([Process Injection T1055 Report, Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/)).'
