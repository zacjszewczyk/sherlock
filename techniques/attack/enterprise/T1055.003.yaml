- question: Is a target process producing child processes in the bottom 1% of historical frequency, DNS
    queries with entropy in the 99th percentile (DGA-like), or an elevated NXDOMAIN failure rate after
    a hijack access?
  context: 'Baseline child-process frequencies and DNS query entropy per process. After an injection,
    a hijacked process may launch rare children and resolve DGA-like high-entropy domains, with bursts
    of NXDOMAIN responses as it hunts for live C2. Flag bottom-1% children, 99th-percentile DNS entropy,
    and elevated failed-State resolutions as a distinct C2 signal. Positive results indicate post-hijack
    C2 setup; combine DNS and child signals to raise confidence. In the context of the Privilege Escalation
    tactic (TA0004), this directly supports the mission question "Has the adversary elevated privileges
    using thread execution hijacking?" Source method (Statistical Method): Baseline child-process frequencies
    and DNS query entropy; flag children in the bottom 1% and DNS queries with entropy in the 99th percentile
    (DGA-like), and treat elevated NXDOMAIN responses as a distinct failure-State C2-resolution signal
    ([Entropy Analysis for Packed Malware, IEEE](https://ieeexplore.ieee.org/document/4140989); [Novel
    Detection via Network Anomalies, Akamai](https://www.akamai.com/blog/security-research/novel-detection-methodology-process-injection-using-network-anomalies)).'
  answer_sources:
  - Windows Event ID 4688
