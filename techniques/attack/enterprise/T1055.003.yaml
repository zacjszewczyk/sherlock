    when a process targeted by EID10 connects outside its approved port set, weighting previously network-silent
    system processes most heavily. A positive result indicates anomalous egress consistent with injected
    C2; maintain accurate per-process allowlists to avoid false positives from app updates. In the context
    of the Privilege Escalation tactic (TA0004), this directly supports the mission question "Has the
    adversary elevated privileges using thread execution hijacking?" Source method (Symbolic Logic): Enforce
    per-process port allowlists and alert when a process targeted by EID10 (write/context mask) connects
    on a port outside its approved set, especially previously network-silent system processes ([Novel
    Detection via Network Anomalies, Akamai](https://www.akamai.com/blog/security-research/novel-detection-methodology-process-injection-using-network-anomalies)).'
