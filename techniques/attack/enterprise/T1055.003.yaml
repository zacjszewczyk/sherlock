name: 'T1055.003: Process Injection: Thread Execution Hijacking'
id: 859d946f-b524-43c3-9a9f-a85f1326b015
description: This playbook helps an analyst investigate Process Injection via Thread Execution Hijacking
  (T1055.003), where an adversary suspends a live process and overwrites/redirects an existing thread
  (the OpenThread->SuspendThread->VirtualAllocEx->WriteProcessMemory->SetThreadContext->ResumeThread chain)
  to run code under a trusted process for defense evasion and privilege escalation. It guides examination
  of Sysmon process-access (EID10), process-modification/CreateRemoteThread (EID8), and process-creation
  (EID1/4688) telemetry for hijack access masks and integrity bridging; correlation of injection events
  with credential-store access (SAM/LSA/LSASS), anomalous child-shell spawns, and first-in-lifetime behavior;
  and network analysis (Zeek conn/ssl/dns) for post-hijack C2, rare destinations, non-standard ports,
  DGA-like DNS, and zero-argument system processes making connections. It combines symbolic-logic rules,
  statistical baselining, and explainable/anomaly ML to determine whether an adversary has injected code
  into and elevated privileges through a hijacked thread.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0004
  tactic_name: Privilege Escalation
