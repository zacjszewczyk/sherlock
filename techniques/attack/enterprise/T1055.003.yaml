    the source process lineage to confirm. In the context of the Privilege Escalation tactic (TA0004),
    this directly supports the mission question "Has the adversary elevated privileges using thread execution
    hijacking?" Source method (Machine Learning): Model the process-access graph communities and flag
    edges bridging uncommon groups (e.g., winword.exe -> svchost.exe), reporting the anomalous edge and
    its rarity in the alert ([Can You Run My Code?, ACM](https://dl.acm.org/doi/10.1145/3708821.3736206)).'
