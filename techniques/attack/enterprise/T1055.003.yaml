questions:
- question: Is any process whose file hash matches a threat-intelligence indicator opening a handle to
    a higher-integrity target process with thread-hijack access rights (PROCESS_VM_WRITE 0x0020, PROCESS_VM_OPERATION
    0x0008, PROCESS_SUSPEND_RESUME 0x0800, PROCESS_SET_INFORMATION/SET_CONTEXT 0x0010, or full 0x1F0FFF)
    in Sysmon Event ID 10?
  context: 'Join Sysmon EID10 process-access records against your TI hash feeds (MD5/SHA1/SHA256 of SourceImage)
    and flag any hash-matched source that requests memory-write or thread-control rights against a higher-integrity
    target. These exact access masks correspond to the documented OpenThread->SuspendThread->WriteProcessMemory->SetThreadContext->ResumeThread
    hijack chain. Exclude verified EDR agents and debuggers, which legitimately request such rights. A
    positive match is a high-confidence indicator of code injection by a known-bad tool; a negative result
    does not clear the host because unknown/custom tooling will not match the feed. In the context of
    the Stealth tactic (TA0005), this directly supports the mission question "Has the adversary elevated
    privileges using thread execution hijacking?" Source method (Symbolic Logic): Join Sysmon Event ID
    10 process-access logs with TI hash feeds and alert when a hash-matched SourceImage requests a higher-integrity
    TargetImage with thread-hijack access masks (0x0020 VM_WRITE, 0x0008 VM_OPERATION, 0x0800 SUSPEND_RESUME,
    0x0010 SET_CONTEXT, or full 0x1F0FFF), excluding verified EDR/debuggers. These masks correspond to
    the documented OpenThread->SuspendThread->WriteProcessMemory->SetThreadContext->ResumeThread chain
    ([Process Injection (Part 1), Elastic](https://www.elastic.co/security-labs/process-injection-part-1);
    [Sysmon CreateRemoteThread Guide, TrustedSec](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md)).'
  answer_sources:
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=Sysmon EventCode=10\n| eval mask=lower(GrantedAccess)\n| join SourceImageHash [ inputlookup\
      \ ti_malicious_hashes ]\n| where match(mask,\"0x1f0fff|0x0020|0x0008|0x0800|0x0010\")\n  AND TargetIntegrity\
      \ > SourceIntegrity\n  AND NOT SourceImage IN (edr_allowlist, debugger_allowlist)\n| alert"
- question: Did a non-allowlisted or TI-matched source process make repeated ACCESS_DENIED OpenProcess/OpenThread
    attempts (status != 0) against high-integrity targets shortly before a successful write/thread-control
    handle was granted?
  context: 'Treat denied access attempts as a distinct probing State signal: an adversary often iterates
    over requested rights until the OS grants a usable handle. Alert when three or more denied attempts
    by the same source against high-integrity targets precede a successful write-mask grant inside a 60-second
    window. This pattern reveals handle-rights probing that single-event rules miss. A positive result
    indicates deliberate enumeration of injectable processes; benign software rarely retries access after
    denial. In the context of the Stealth tactic (TA0005), this directly supports the mission question
    "Has the adversary elevated privileges using thread execution hijacking?" Source method (Symbolic
    Logic): Treat ACCESS_DENIED (status!=0) OpenProcess/OpenThread attempts by a hash-matched or non-allowlisted
    SourceImage against high-integrity targets as a distinct State signal; alert when >=3 denied attempts
    precede a successful write-mask grant within 60s, indicating handle-rights probing ([Sysmon CreateRemoteThread
    Guide, TrustedSec](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md)).'
  answer_sources:
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=Sysmon EventCode=10\n| eval denied=if(GrantedStatus!=0,1,0)\n| streamstats time_window=60s\
      \ count(eval(denied=1)) as denies by SourceProcessGUID,TargetImage\n| where denies>=3 AND GrantedStatus=0\
      \ AND match(GrantedAccess,\"0x0020|0x0010|0x0800\")\n  AND NOT SourceImage IN (allowlist)\n| alert"
- question: Across the fleet, is a lower-integrity process opening a higher-integrity process with memory-write/thread-control
    rights using a (SourceImage, TargetImage, GrantedAccess) tuple that is below the 1st percentile of
    historical prevalence?
  context: 'Maintain a fleet-wide prevalence baseline of distinct (SourceImage, TargetImage, GrantedAccess)
    edges. Cross-process access with write/thread-control rights is rare in benign software, so a first-seen
    or very-low-frequency edge that also crosses an integrity boundary upward is suspicious. Score by
    frequency/volume of distinct source->target edges and alert below the 1st percentile. Positive results
    surface novel injection relationships even when no hash or signature matches; tune the baseline window
    per host role to limit noise. In the context of the Stealth tactic (TA0005), this directly supports
    the mission question "Has the adversary elevated privileges using thread execution hijacking?" Source
    method (Statistical Method): Maintain a fleet-wide prevalence baseline of (SourceImage, TargetImage,
    GrantedAccess) tuples; alert when a lower-integrity process opens a higher-integrity process with
    write/thread-control rights and the tuple is below the 1st percentile (Frequency/Volume of distinct
    source->target edges) ([Threat Hunting Process Injection with Sysmon, Active Countermeasures](https://www.activecountermeasures.com/threat-hunting-process-injection-with-jupyter-notebook-and-sysmon/)).'
  answer_sources:
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=Sysmon EventCode=10 earliest=-90d\n| stats count as edge_count by SourceImage,TargetImage,GrantedAccess\n\
      | eventstats perc1(edge_count) as p1\n| where edge_count<=p1 AND match(GrantedAccess,\"0x0020|0x0010|0x0800\"\
      )\n  AND TargetIntegrity>SourceIntegrity\n| alert"
- question: When a Gradient Boosting/Random Forest model scores a Sysmon EID10 access event as likely
    thread-injection, what are the top-3 SHAP-explained features (e.g., VirtualAllocEx/WriteProcessMemory/SetThreadContext
    presence, integrity delta, TI flag) driving the score?
  context: 'Train an explainable classifier (Gradient Boosting or Random Forest) on labeled EID10 features:
    source/target image, integrity levels, GrantedAccess bits, parent process lineage, TI flag, and call-stack/module
    backing. Emit the top-3 SHAP contributors in each alert so an analyst can immediately judge why the
    event scored high. This catches injection variants that evade static rules while keeping the verdict
    interpretable. A high score with hijack-API features and an integrity bridge is strong evidence; low-confidence
    scores should be triaged with the supporting symbolic-logic rules. In the context of the Stealth tactic
    (TA0005), this directly supports the mission question "Has the adversary elevated privileges using
    thread execution hijacking?" Source method (Machine Learning): Train Gradient Boosting/Random Forest
    on EID10 features (Source/Target image, integrity levels, GrantedAccess bits, parent process, TI flag,
    call-stack backing) and emit the top-3 SHAP features (e.g., VirtualAllocEx/WriteProcessMemory/SetThreadContext
    presence) in the alert text ([Hybrid CNN-GRU with LIME/SHAP, PeerJ](https://peerj.com/articles/cs-3258/);
    [Detecting Injection via ETW Memory Analysis, Springer](https://link.springer.com/article/10.1007/s10207-024-00836-w)).'
  answer_sources:
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = extract(EID10: source_img,target_img,src_IL,tgt_IL,granted_bits,parent,ti_flag,callstack_backed)

      score = gbm.predict_proba(features)

      if score>=0.85: alert(top3=shap(features), event=EID10)'
- question: Does a single SourceProcessGUID produce multiple Sysmon EID10 events against the same TargetProcessGUID
    within ~2 seconds requesting suspend (0x0800/0x0002), memory write (0x0020), and context set (0x0010)
    in the canonical suspend->write->setcontext->resume order?
  context: 'Rather than alerting on any single access mask (which is noisy), require the ordered burst
    that defines thread execution hijacking: a rapid sequence of suspend, write, set-context, and resume
    against one target by one source inside a 2-second window, excluding allowlisted debuggers/EDR. This
    unified-ordering requirement strongly suppresses benign single-API noise and isolates the actual hijack
    primitive. A positive match is a near-definitive behavioral signature of T1055.003. In the context
    of the Stealth tactic (TA0005), this directly supports the mission question "Has the adversary elevated
    privileges using thread execution hijacking?" Source method (Symbolic Logic): Alert when a SourceProcessGUID
    produces multiple EID10 entries for the same TargetProcessGUID within 2s requesting suspend (0x0800/0x0002),
    memory write (0x0020), and context set (0x0010), excluding allowlisted debuggers/EDR. Require the
    unified ordering (suspend->write->setcontext->resume) rather than any single mask to suppress benign
    single-API noise ([Can You Run My Code?, ACM](https://dl.acm.org/doi/10.1145/3708821.3736206); [Process
    Injection (Part 1), Elastic](https://www.elastic.co/security-labs/process-injection-part-1)).'
  answer_sources:
  - Sysmon Event ID 10
  - Sysmon Event ID 8
  - 'NAI: All Windows Endpoints and Servers, especially those running critical services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=Sysmon EventCode=10\n| transaction SourceProcessGUID,TargetProcessGUID maxspan=2s\n\
      | where like_seq(GrantedAccess,[suspend 0x0800,write 0x0020,setcontext 0x0010])\n  AND NOT SourceImage\
      \ IN (debugger_allowlist,edr_allowlist)\n| alert"
- question: Is a Sysmon EID8 (CreateRemoteThread) or resumed thread starting at an address in unbacked,
    private RWX memory that is not mapped to any module on disk, in conjunction with cross-process EID10
    access?
  context: 'Cross-reference EID8 CreateRemoteThread and EID10 access events and inspect the new/resumed
    thread''s StartAddress. A start address in private, executable, unbacked memory (not file-mapped)
    is a hallmark of injected shellcode, since legitimate threads start in module-backed code. Cross-process
    thread manipulation is itself rare in benign software. A positive result strongly indicates injected
    execution; pair it with the source-process lineage to scope the intrusion. In the context of the Stealth
    tactic (TA0005), this directly supports the mission question "Has the adversary elevated privileges
    using thread execution hijacking?" Source method (Symbolic Logic): Cross-reference EID8 (CreateRemoteThread)
    and EID10 where the new/resumed thread StartAddress lies in unbacked (private RWX) memory not mapped
    to a module on disk; cross-process thread manipulation is rare in benign software ([Sysmon CreateRemoteThread
    Guide, TrustedSec](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md);
    [Threat Hunting Process Injection with Sysmon, Active Countermeasures](https://www.activecountermeasures.com/threat-hunting-process-injection-with-jupyter-notebook-and-sysmon/)).'
  answer_sources:
  - Sysmon Event ID 10
  - Sysmon Event ID 8
  - 'NAI: All Windows Endpoints and Servers, especially those running critical services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=Sysmon (EventCode=8 OR EventCode=10)

      | eval unbacked=if(StartAddressModule="" AND MemProtect="RWX" AND MemType="private",1,0)

      | where unbacked=1 AND SourceProcessGUID!=TargetProcessGUID

      | alert'
- question: Is a non-administrative process exceeding mean+3*std in EID10 events-per-minute, or showing
    a >3-std jump in the 5-minute rolling Shannon entropy of its GrantedAccess codes, indicating a burst
    of varied access rights?
  context: 'Baseline per-process EID10 volume (events/min) and rolling entropy of GrantedAccess values.
    A hijack produces a short burst of distinct access rights (suspend, write, set-context, resume), which
    spikes both event rate and entropy for a process that is normally quiet. Alert on either signal exceeding
    3 standard deviations. This statistical view catches injection even when individual masks look benign;
    expect tuning against admin tools and backup agents. In the context of the Stealth tactic (TA0005),
    this directly supports the mission question "Has the adversary elevated privileges using thread execution
    hijacking?" Source method (Statistical Method): Baseline per-process EID10 Volume (events/min) and
    5-minute rolling entropy of GrantedAccess codes; alert when a non-admin tool exceeds mean+3*std event
    rate OR entropy jumps >3 std, capturing the burst of distinct access rights during a hijack ([Threat
    Hunting Process Injection with Sysmon, Active Countermeasures](https://www.activecountermeasures.com/threat-hunting-process-injection-with-jupyter-notebook-and-sysmon/)).'
  answer_sources:
  - Sysmon Event ID 10
  - Sysmon Event ID 8
  - 'NAI: All Windows Endpoints and Servers, especially those running critical services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=Sysmon EventCode=10

      | bin _time span=1m

      | stats count as vol dc(GrantedAccess) as variety by SourceImage,_time

      | eventstats avg(vol) as m stdev(vol) as s by SourceImage

      | where vol>m+3*s OR variety_entropy_jump>3*s

      | alert'
- question: When an LSTM/HMM trained on benign (EventID, GrantedAccess, TargetImage) sequences flags a
    high-reconstruction-error or low-likelihood sequence, what offending n-gram of API steps characterizes
    the anomalous hijack chain?
  context: 'Train a sequence model (LSTM autoencoder or HMM) on benign ordered tuples of (EventID, GrantedAccess,
    TargetImage). Hijack chains produce sequences that the model reconstructs poorly or assigns low likelihood.
    Surface the specific n-gram of API steps that drove the anomaly so analysts can confirm the suspend->write->setcontext->resume
    motif. This detects novel orderings and obfuscated variants; high reconstruction error warrants correlation
    with the symbolic-logic rules above. In the context of the Stealth tactic (TA0005), this directly
    supports the mission question "Has the adversary elevated privileges using thread execution hijacking?"
    Source method (Machine Learning): Train an LSTM/HMM on benign (EventID, GrantedAccess, TargetImage)
    sequences and flag high reconstruction error / low-likelihood sequences as anomalous hijack chains;
    surface the offending n-gram of API steps in the alert ([LSTM Sequential Model for Windows API Calls,
    PeerJ](https://peerj.com/articles/cs-285/); [Detecting Intrusions Using System Calls, IEEE](https://ieeexplore.ieee.org/document/766910)).'
  answer_sources:
  - Sysmon Event ID 10
  - Sysmon Event ID 8
  - 'NAI: All Windows Endpoints and Servers, especially those running critical services.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = order_by_time(EID10/EID8 tuples: (eventid,granted,target) per SourceProcessGUID)

      err = lstm_ae.reconstruction_error(seq)

      if err>threshold: alert(offending_ngram=argmax_window(err), source=SourceProcessGUID)'
- question: Does a Low or Medium integrity source process successfully obtain a handle to a High or System
    integrity target with memory-write (0x0020), thread-context (0x0010), or suspend/resume (0x0800) rights?
  context: 'These access masks are the privilege-bridging primitives of thread hijacking: writing into
    and steering a higher-privileged process is how the adversary gains its context. Trigger when the
    source integrity level is below the target and the granted rights include write/context/suspend. Positive
    results directly answer whether privilege escalation via injection is being attempted; exclude legitimate
    elevation brokers and EDR to reduce false positives. In the context of the Stealth tactic (TA0005),
    this directly supports the mission question "Has the adversary elevated privileges using thread execution
    hijacking?" Source method (Symbolic Logic): Trigger when EID10 shows Source IL Low/Medium targeting
    High/System with GrantedAccess for memory write (0x0020), thread context (0x0010), or suspend/resume
    (0x0800); these are the privilege-bridging primitives of thread hijacking ([Process Injection (Part
    1), Elastic](https://www.elastic.co/security-labs/process-injection-part-1); [Process Injection T1055
    Report, Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/)).'
  answer_sources:
  - Sysmon Event ID 10
  - 'NAI: All Windows Endpoints and Servers, with a focus on systems processing sensitive data.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=Sysmon EventCode=10\n| where SourceIntegrity IN (\"Low\",\"Medium\") AND TargetIntegrity\
      \ IN (\"High\",\"System\")\n  AND match(GrantedAccess,\"0x0020|0x0010|0x0800\")\n  AND NOT SourceImage\
      \ IN (allowlist)\n| alert"
- question: Per host role, is there a (SourceIL, TargetIL, GrantedAccess) integrity-transition combination
    involving write/execute permissions that has less than 0.01% historical probability, especially a
    first-seen source->target integrity edge?
  context: 'Baseline integrity-transition distributions per host role (workstation, app server, DC). Upward
    integrity transitions carrying write/execute rights are inherently rare; alert on combinations below
    0.01% probability and prioritize first-seen edges. This statistically isolates the privilege-escalation
    moment of a hijack without relying on signatures. A positive result is a strong escalation indicator;
    calibrate the baseline separately per role since admin tooling differs by host type. In the context
    of the Stealth tactic (TA0005), this directly supports the mission question "Has the adversary elevated
    privileges using thread execution hijacking?" Source method (Statistical Method): Baseline (SourceIL,
    TargetIL, GrantedAccess) distributions per host role and alert on combinations with <0.01% historical
    probability that involve write/execute permissions, prioritizing first-seen source->target integrity
    edges ([Threat Hunting Process Injection with Sysmon, Active Countermeasures](https://www.activecountermeasures.com/threat-hunting-process-injection-with-jupyter-notebook-and-sysmon/)).'
  answer_sources:
  - Sysmon Event ID 10
  - 'NAI: All Windows Endpoints and Servers, with a focus on systems processing sensitive data.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=Sysmon EventCode=10 earliest=-90d

      | stats count by host_role,SourceIntegrity,TargetIntegrity,GrantedAccess

      | eventstats sum(count) as tot by host_role

      | eval prob=count/tot

      | where prob<0.0001 AND match(GrantedAccess,"0x0020|0x0010")

      | alert'
- question: When an Isolation Forest / One-Class SVM trained only on benign EID10 access flags an outlier
    over (SourceIL, TargetIL, GrantedAccess, source-prevalence), which feature deltas explain the anomaly?
  context: 'Fit an unsupervised outlier model (Isolation Forest or One-Class SVM) on benign-only EID10
    access vectors and score new events; rare combinations of integrity levels, granted rights, and low
    source prevalence surface as outliers. Report the contributing feature deltas so the analyst can see,
    for example, an unusually low-prevalence source bridging an integrity gap. This catches escalation
    attempts that evade rule thresholds; outliers should be corroborated with the deterministic integrity-escalation
    rule. In the context of the Stealth tactic (TA0005), this directly supports the mission question "Has
    the adversary elevated privileges using thread execution hijacking?" Source method (Machine Learning):
    Apply Isolation Forest / One-Class SVM (trained only on benign EID10) over (SourceIL, TargetIL, GrantedAccess,
    source-prevalence) to surface rare outliers; report the contributing feature deltas in the alert ([Malware
    Detection Using One-Class Classification, PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/)).'
  answer_sources:
  - Sysmon Event ID 10
  - 'NAI: All Windows Endpoints and Servers, with a focus on systems processing sensitive data.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = vec(EID10: src_IL,tgt_IL,granted_bits,source_prevalence)

      model = IsolationForest(train=benign_only)

      if model.score(X)<thresh: alert(feature_deltas=explain(X))'
- question: Within minutes of a suspicious EID10 (write/context mask) against a process, does that target
    then access \SAM, HKLM\SECURITY\Policy\Secrets, obtain an lsass.exe handle/dump, or spawn a child
    shell it normally never spawns?
  context: 'Tie the injection event to its objective: a hijacked high-value process reaching for credential
    stores (SAM, LSA secrets, LSASS) or unexpectedly spawning a shell is the payload acting under stolen
    privileges. Correlate EID10 with 4663/4657 object-access and EID10 LSASS-handle events inside a few-minute
    window. A positive correlation elevates a possible injection to a confirmed credential-access/escalation
    incident; absence of follow-on activity may mean the payload is dormant or stealthy. In the context
    of the Stealth tactic (TA0005), this directly supports the mission question "Has the adversary elevated
    privileges using thread execution hijacking?" Source method (Symbolic Logic): Alert when a suspicious
    EID10 (write/context mask) is followed within minutes by access to \SAM, HKLM\SECURITY\Policy\Secrets,
    or an lsass.exe handle/dump (4663/4657/EID10), or by the target spawning a child shell which it normally
    never does ([Process Injection T1055 Report, Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/)).'
  answer_sources:
  - Sysmon Event ID 10
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Domain Controllers, Certificate Authorities, Servers hosting LSA secrets, File Servers with
    sensitive data.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=Sysmon EventCode=10 [write/context mask] as inj

      | join TargetProcessGUID [ search (EventCode=4663 OR EventCode=4657 ObjectName IN ("*\\SAM","*\\Secrets"))
      OR (EventCode=10 TargetImage=lsass.exe) maxspan=5m ]

      | alert'
- question: After a high-risk process-access event, does the targeted process exhibit a cumulative rarity
    score above the 99th percentile across child-process launches, registry accesses, and connection volume,
    weighting first-in-lifetime actions?
  context: 'Baseline each process''s normal child launches, registry touches, and network byte/connection
    volume. After a high-risk access event, compute a cumulative rarity score that heavily weights actions
    the process has never done before in its lifetime. Flag scores above the 99th percentile. This captures
    the behavioral pivot a hijacked process makes toward the adversary''s goal. Positive results indicate
    post-injection objective execution; tune weighting so routine first-runs (patch day) don''t dominate.
    In the context of the Stealth tactic (TA0005), this directly supports the mission question "Has the
    adversary elevated privileges using thread execution hijacking?" Source method (Statistical Method):
    Baseline child-process launches, registry accesses, and connection Volume (bytes, count/min) per process;
    flag processes whose cumulative rarity score exceeds the 99th percentile after a high-risk access
    event, weighting first-in-lifetime actions ([Threat Hunting Process Injection with Sysmon, Active
    Countermeasures](https://www.activecountermeasures.com/threat-hunting-process-injection-with-jupyter-notebook-and-sysmon/)).'
  answer_sources:
  - Sysmon Event ID 10
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Domain Controllers, Certificate Authorities, Servers hosting LSA secrets, File Servers with
    sensitive data.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=post_access_window

      | stats count(child) count(reg) sum(bytes) by TargetProcessGUID

      | eval rarity=score_first_seen(child,reg,dest)

      | eventstats perc99(rarity) as p99

      | where rarity>p99

      | alert'
- question: Do a critical process's runtime metrics (network bytes, CPU, I/O, handle counts) become anomalous
    per an Isolation Forest / One-Class SVM after a suspicious access event, and which metrics deviate
    most?
  context: 'Model the resource-usage profile of critical processes and score deviations after a suspicious
    EID10. A hijacked process running shellcode often shows abnormal network egress, CPU, I/O, or handle
    growth. Surface the top deviating metrics so the analyst knows whether to suspect exfiltration, mining,
    or C2. This is a behavioral safety net for processes too sensitive to allow injection; corroborate
    anomalies with the network/credential correlations. In the context of the Stealth tactic (TA0005),
    this directly supports the mission question "Has the adversary elevated privileges using thread execution
    hijacking?" Source method (Machine Learning): Model critical processes'' metrics (network bytes, CPU,
    I/O, handle counts) with Isolation Forest / One-Class SVM and flag anomalies after a suspicious access,
    surfacing the top deviating metrics ([Malware Detection Using One-Class Classification, PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/)).'
  answer_sources:
  - Sysmon Event ID 10
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Domain Controllers, Certificate Authorities, Servers hosting LSA secrets, File Servers with
    sensitive data.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'm = metrics(target_proc: net_bytes,cpu,io,handles) post-access

      if ocsvm.predict(m)==outlier: alert(top_dev=rank(deviation(m)))'
- question: Does a normally quiet trusted process (svchost.exe, dllhost.exe, explorer.exe) connect to
    a threat-intelligence-listed IP or domain within 5 minutes of being targeted by an EID10 write/context
    access?
  context: 'Trusted, network-capable system processes are prime injection hosts because their outbound
    traffic blends in. Correlate EID10 hijack accesses with subsequent Zeek conn/ssl connections to TI-listed
    destinations from those same processes inside a 5-minute window. A positive correlation links the
    injection to active C2 and strongly supports a stealth/evasion verdict, since the adversary is masquerading
    under a legitimate process. Combine with JA3/SNI to confirm. In the context of the Stealth tactic
    (TA0005), this directly supports the mission question "Has the adversary elevated privileges using
    thread execution hijacking?" Source method (Symbolic Logic): Alert when normally quiet trusted processes
