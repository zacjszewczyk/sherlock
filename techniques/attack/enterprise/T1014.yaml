      \  sub = anomalous_subtree(sketch)  # KAIROS localization\n  alert hidden_process_subtree=sub edges=sub.contributing\
      \ host=host"
- question: Are boot-configuration utilities (bootsect.exe, fdisk.exe) being executed, or is there raw
    write/read access to PhysicalDrive0 by a process that is not a known disk or backup utility?
  context: Bootkits (a rootkit subclass) modify boot components or raw disk to gain control before the
    OS. Raise a high-priority alert on any execution (Windows Event ID 4688 or Sysmon Event ID 1) of bootsect.exe
    or fdisk.exe, and on any FileCreate (Sysmon Event ID 11) or RawAccessRead (Sysmon Event ID 9) where
    TargetFilename/Device is \\.\PhysicalDrive0 and the Image is not a known disk-management or backup
    utility. Legitimate raw-disk access is rare and comes from a small set of tools. This is tactic-relevant
    for Stealth/persistence because boot-level changes survive reinstalls and hide below the OS. Positive
    hits demand offline forensic imaging of the boot region.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 9 (Sysmon)
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 13 (Sysmon)
  - 'NAI: System Partitions on all hosts, Boot sectors of physical disks on servers and workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "(EventCode in (4688,1) AND filename(Image) in (\"bootsect.exe\",\"fdisk.exe\"))\nOR ((Sysmon\
      \ EventCode=11 OR EventCode=9)\n    AND (TargetFilename==\"\\\\\\\\.\\\\PhysicalDrive0\" OR Device==\"\
      \\\\\\\\.\\\\PhysicalDrive0\")\n    AND Image NOT IN known_disk_backup_tools)\n| alert severity=high\
      \ host=Computer image=Image"
- question: Does a process with low enterprise prevalence, not in the baseline of legitimate disk tools,
    perform a raw disk read?
  context: From Sysmon Event ID 9 (RawAccessRead), build a baseline of legitimate processes that access
    raw disk (backup agents, forensics tools, disk utilities) and compute each process's prevalence. Alert
    when a process not in the baseline, or with low enterprise-wide prevalence, performs a raw disk read.
    Rootkits/bootkits read or write the raw device to manipulate boot sectors or hidden storage, and such
    access from an unusual binary is anomalous. For the Stealth tactic, this statistical baseline distinguishes
    routine maintenance tooling from covert disk manipulation. A low-prevalence hit is triaged by signing,
    path, and parent-process context.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 9 (Sysmon)
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 13 (Sysmon)
  - 'NAI: System Partitions on all hosts, Boot sectors of physical disks on servers and workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from sysmon where EventCode=9

      | stats dc(Computer) as hosts by Image

      | eval prevalence=hosts/total_hosts

      | where Image NOT IN raw_disk_baseline OR prevalence<0.01

      | alert raw_disk_read process=Image host=Computer'
- question: Does a one-class model flag any administrative-tool execution as a significant outlier from
    known-benign administrative behavior?
  context: Train a one-class SVM on Sysmon Event ID 1 process executions known to be benign administrative
    actions, using features such as User, ParentImage, command-line arguments, and execution hour. New
    executions flagged as significant outliers from the benign class are investigated as potential malicious
    use of admin tools (e.g., bcdedit/bootsect at odd hours by an unusual user/parent). This counters
    living-off-the-land abuse central to the Stealth tactic, where attackers reuse legitimate binaries
    so individual commands look benign; the model evaluates the whole context. Outliers are prioritized
    when they touch boot/disk configuration.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 9 (Sysmon)
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 13 (Sysmon)
  - 'NAI: System Partitions on all hosts, Boot sectors of physical disks on servers and workstations.'
