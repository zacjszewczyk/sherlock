    query: "from sysmon where EventCode=5\n| where filename(Image) in\n    (\"MsMpEng.exe\",\"csagent.exe\"\
      ,\"cb.exe\",\"taniumclient.exe\")\n| alert severity=critical host=Computer terminated=Image"
- question: Is there a statistically significant spike in application crashes/service failures, or an
    abrupt drop/cessation in security-tool telemetry, on any host?
  context: 'Ingest per-host application crashes (Event ID 1000), service failures (Event ID 7031, 7034),
    and per-host security-tool log volume into a time-series store. Establish hourly baselines (mean/stdev)
    and apply change-point detection (CUSUM or Bayesian online CPD) to flag BOTH spikes in failures AND
    abrupt drops/cessation in security-tool telemetry (a blinding signal), alerting at, e.g., 3 standard
    deviations above the 28-day rolling average for that host and hour-of-day. Rootkit installation often
    destabilizes the system (driver conflicts) or silences agents. For the Stealth tactic, both the instability
    spike and the telemetry drop betray covert activity; a detected change point is triaged alongside
    termination and integrity signals. Sources: [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Event ID 7031
  - Windows Event ID 7034
  - Windows Event ID 5 (Sysmon)
  - 'NAI: All Endpoints and Servers, especially hosts with critical security agents installed.'
  range: Last 90 days (28-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from winlog\n| bin _time span=1h\n| stats count(EID=1000) as crash, count(EID in (7031,7034))\
      \ as svcfail,\n        count(sec_tool_logs) as telem by host,_time\n| eventstats avg(crash+svcfail)\
      \ as mu, stdev(...) as sd by host,hour\n| where (crash+svcfail) > mu+3*sd OR changepoint(telem,\
      \ direction=drop)\n| alert host=host"
- question: Does an Isolation Forest flag an anomalous combination of crash, service-failure, and security-agent-termination
    counts for any host-hour, even when no single metric crosses a threshold?
  context: Build hourly per-host feature vectors [count(EID 1000), count(EID 7031), count(EID 7034), count(security_agent_terminations)]
    and score them with an Isolation Forest. This unsupervised model detects anomalous COMBINATIONS of
    failure events signifying rootkit-induced instability even when each individual count stays below
    static thresholds. It is robust to the noisy, multi-signal nature of defense impairment. For the Stealth
    tactic, it catches subtle multi-event blinding patterns that evade per-metric rules. A high anomaly
    score is a host-hour to triage by inspecting which events drove the score and correlating with driver
    loads and provenance.
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Event ID 7031
  - Windows Event ID 7034
  - Windows Event ID 5 (Sysmon)
  - 'NAI: All Endpoints and Servers, especially hosts with critical security agents installed.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = per_host_hourly([n_crash, n_7031, n_7034, n_agent_kill])

      iforest = IsolationForest().fit(history)

      if iforest.score(X) anomalous: alert host=host hour=hour features=X'
- question: Among identically-imaged hosts/VMs, does any single peer's distribution of security-agent
    and kernel events diverge from its replicas?
  context: 'For fleets of identically-imaged hosts/VMs, compare the live distribution of security-agent
    events and kernel-event frequencies across peers and flag the host whose distribution diverges from
    its replicas (ReplicaWatcher principle) -- no trained per-host model required. Because replicas should
    behave alike, a divergent peer is a strong, low-overhead indicator of tampering such as agent silencing
    or rootkit-induced kernel changes. This supports the Stealth tactic by exposing the one host where
    the defender''s view has been altered relative to its twins. The divergent host is triaged for security-agent
    health, driver loads, and cross-view discrepancies. Sources: [ReplicaWatcher](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf).'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Event ID 7031
  - Windows Event ID 7034
  - Windows Event ID 5 (Sysmon)
