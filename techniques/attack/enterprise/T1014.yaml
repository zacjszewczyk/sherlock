  queries:
  - technology: osquery/Volatility pseudocode
    query: "procs = all_processes()        # canonical list\nsocks = processes_with_sockets()\nsched =\
      \ scheduler_entries()\nfor pid in (socks | sched):\n  if pid not in procs: alert dkom_hidden_pid=pid\
      \ host=host"
- question: Does whole-system provenance reveal a structural shift such as a network-connecting process
    subtree with no normal ancestry, indicating a hidden or injected process?
  context: 'Beyond per-host community detection, summarize whole-system provenance as a subtree-kernel
    sketch (UNICORN / KAIROS) and flag when a host''s graph structure shifts outside its benign evolution
    envelope -- for example a network-connecting process subtree that has no normal ancestry. The method
    surfaces the contributing edges so the analyst sees how the suspect subtree attached to the system.
    This addresses the Stealth tactic by detecting injected/hidden processes as structural outliers even
    when their individual events are crafted to look benign. A positive result is a localized subgraph
    to investigate, ideally corroborated with the cross-view and DKOM tests above. Sources: [UNICORN](https://arxiv.org/abs/2001.01525),
    [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
