name: 'T1014: Rootkit'
id: 3c16c0f9-be46-45b9-8744-a44546ca1ad4
description: 'Hunt for rootkit activity (T1014) used by adversaries to hide the presence of programs,
  files, network connections, services, drivers, and other system components by hooking or modifying OS
  API calls at the user level, kernel level, hypervisor, or firmware across Windows, Linux, and macOS
  hosts. This playbook helps an analyst investigate the full chain of rootkit deployment and concealment:
  low-volume periodic beaconing and fallback C2 to non-categorized infrastructure; loading of unsigned,
  low-prevalence, revoked, or vulnerable (BYOVD) kernel drivers and modules; abuse of install utilities
  such as sc.exe, bcdedit.exe, and PnPUtil.exe by anomalous parents; cross-view discrepancies where network
  sensors observe connections the host hides (DKOM, hidden/injected processes); tampering with boot components
  and raw disk; and the blinding or crashing of security agents. It combines deterministic symbolic-logic
  rules, statistical baselining and change-point detection, and machine-learning / provenance-graph approaches
  so an analyst can confirm or refute whether an adversary has deployed a rootkit to evade defenses and
  persist stealthily.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any internal hosts making DNS queries or outbound connections to IP addresses or domains
    that match a current threat-intelligence feed of known rootkit command-and-control infrastructure?
  context: 'Rootkits frequently retain a hidden or fallback C2 channel for resilient remote control. The
    fastest, most deterministic detection is to match observed destinations (Zeek dns.log query names
    and Zeek conn.log destination IPs) against a continuously refreshed threat-intelligence feed of known
    rootkit C2 indicators. A positive hit is a high-confidence indicator of compromise that should trigger
    immediate host isolation and provenance review; a negative result does not clear the host because
    sophisticated actors rotate infrastructure, so pair this with the statistical and ML beaconing analytics
    below. Tie this to the Stealth tactic: the adversary is trying to blend hidden C2 into normal egress,
    so enrichment against known-bad infrastructure cuts through the concealment.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, Network Security Monitoring (NSM) Sensor Grid'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'zeek dns.log OR conn.log

      | join threat_intel_feed on (dns.query == ti.domain) OR (conn.id_resp_h == ti.ip)

      where ti.category == "rootkit_c2"

      | alert severity=high host=conn.id_orig_h dest=conn.id_resp_h'
- question: For each internal host, are there destinations exhibiting high connection counts but very
    low data volume with low timing jitter, consistent with automated periodic beaconing?
  context: Hidden rootkit beacons tend to be frequent, small, and regular. Group Zeek conn.log per internal
    source IP by destination IP within rolling 1-hour windows and compute the connection count, the sum
    of orig_bytes + resp_bytes, and the standard deviation of inter-connection intervals (jitter). Destinations
    where the connection count is in the 95th percentile, total bytes in the 5th percentile, and jitter
    below the 10th percentile strongly suggest machine-driven, low-and-slow beaconing rather than human
    or bulk-transfer activity. This statistical profile defeats the Stealth goal of blending in, because
    the regularity and small payloads stand out against noisy human traffic. Validate hits by pivoting
    to the originating process/module on the host.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, Network Security Monitoring (NSM) Sensor Grid'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from zeek_conn\n| bin _time span=1h\n| stats count as c, sum(orig_bytes+resp_bytes) as bytes,\n\
      \        stdev(inter_arrival) as jitter by src_ip, dst_ip, _time\n| eventstats perc95(c) as p95c,\
      \ perc5(bytes) as p5b, perc10(jitter) as p10j\n| where c>=p95c AND bytes<=p5b AND jitter<=p10j\n\
      | alert beaconing src=src_ip dst=dst_ip"
- question: Does any host's hourly network behavior significantly deviate from its own learned seasonal
    baseline of connection count, data volume, and unique destination count?
  context: A time-series anomaly model (e.g., Seasonal-ARIMA) trained on at least 30 days of per-host
    hourly features -- count(connections), sum(total_bytes), unique_count(destination_ips) -- learns each
    host's normal daily and weekly rhythm. Hours where the observed values fall well outside the forecast
    interval reveal the onset of hidden beaconing or data movement even when absolute volumes look small.
    This is tactic-relevant for Stealth because rootkit C2 is engineered to be quiet; modeling each host
    against itself surfaces subtle, statistically significant departures that static thresholds miss.
    A positive result is an hour/host pair to triage by correlating to processes and destinations.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, Network Security Monitoring (NSM) Sensor Grid'
  range: Last 90 days (train on >=30 days)
  queries:
  - technology: ML/pseudocode
    query: 'features = per_host_hourly(count_conn, sum_bytes, nunique_dst)

      model = SeasonalARIMA(seasonal_period=24).fit(train>=30d)

      forecast, ci = model.predict(current_hour)

      if observed outside ci: alert host=host hour=hour metric=metric'
- question: Is there an abrupt, sustained rise in a host's failed DNS resolutions or failed/reset outbound
    connections, consistent with rootkit fallback C2 cycling through dead or sinkholed infrastructure?
  context: 'When primary C2 dies, a rootkit''s fallback logic often cycles through stale or sinkholed
    domains/IPs, producing a burst of NXDOMAIN responses (Zeek dns.log) and failed/reset connections (Zeek
    conn.log conn_state in S0, REJ, RSTO, RSTR). Compute per-host hourly counts of these failure modes
    and apply change-point detection (CUSUM or Bayesian online change-point) to detect an abrupt, sustained
    increase. A detected change point is a strong signal of automated infrastructure cycling rather than
    ordinary user error. This explicitly profiles the failure mode of stealthy C2, complementing success-side
    beaconing detection, and is tactic-relevant because the adversary''s hidden channel betrays itself
    when its infrastructure is taken down. Sources: [A Survey of Methods for Time Series Change Point
    Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, Network Security Monitoring (NSM) Sensor Grid'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from zeek_dns,zeek_conn\n| bin _time span=1h\n| stats count(eval(dns.rcode==\"NXDOMAIN\"))\
      \ as nx,\n        count(eval(conn.conn_state in (\"S0\",\"REJ\",\"RSTO\",\"RSTR\"))) as fail by\
      \ host,_time\n| cusum(nx+fail) by host\n| where changepoint_detected: alert host=host"
- question: Can a beaconing network destination be traced back through whole-system provenance to a hidden
    or newly injected kernel module or process as its causal parent?
  context: 'Network-only signals confirm that beaconing exists but not whether it originates from concealed
    code. Build whole-system provenance graphs (KAIROS / UNICORN style) that link processes, modules,
    files, and network edges, then score the subgraph rooted at a suspect beaconing destination. A connection
    whose causal parent is a hidden, unsigned, or newly injected kernel module/process is highly suspicious
    and the alert should surface the contributing process/module/file edges for triage. This directly
    counters the Stealth tactic: even if the rootkit hides individual artifacts, the causal structure
    linking the hidden component to observed egress is anomalous. A positive result localizes the offending
    component for containment. Sources: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf), [UNICORN](https://arxiv.org/abs/2001.01525).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, DNS Resolvers, Network Security Monitoring (NSM) Sensor Grid'
  range: Last 90 days
  queries:
  - technology: ML/Provenance pseudocode
    query: 'G = build_provenance_graph(process,module,file,network edges)

      sub = subgraph(rooted_at=beacon_dst)

      score = anomaly_score(sub)  # KAIROS/UNICORN

      if parent(sub) in {hidden_module, injected_process}: alert edges=sub.contributing'
- question: Are any kernel drivers failing Code Integrity validation, or loading unsigned from non-system
    directories under a common system-driver filename?
  context: 'Kernel rootkits must get code into ring 0. Two deterministic signals expose this: Windows
    Code Integrity events (ID 3033, 3063, 3077) indicating a driver failed signature validation, and Sysmon
    Event ID 6 driver loads where Signed is false or the ImageLoaded path is outside \SystemRoot\system32\drivers
    yet the filename mimics a legitimate driver (e.g., svchost.sys in C:\Users\Public\). Either condition
    is strongly indicative of malicious driver loading. This is core to the Stealth tactic because a driver
    running in the kernel can hook APIs to hide files, processes, and connections. A positive result warrants
    immediate driver acquisition, hash lookup, and host isolation.'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 6 (Sysmon)
  - Windows Event ID 3033
  - 'NAI: Domain Controllers, Critical Application Servers, Privileged User Workstations, All Windows
    Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "(WinEventLog:System EventCode in (3033,3063,3077))\nOR (Sysmon EventCode=6 AND (Signed=\"\
      false\" OR\n    (NOT match(ImageLoaded,\"\\\\SystemRoot\\\\system32\\\\drivers\\\\\")\n     AND\
      \ filename(ImageLoaded) in known_driver_names)))\n| alert severity=high host=Computer driver=ImageLoaded"
- question: Which driver loads have low enterprise prevalence, untrusted/revoked signatures, user-writable
    paths, or filenames within a small edit-distance of legitimate driver names?
  context: 'Daily, aggregate Sysmon Event ID 6 to build prevalence tables of (Signature, SignatureStatus)
    and (Hash, ImageLoaded). Alert on driver loads whose Signature or Hash appears on <1% of hosts or
    only a single machine, especially when combined with a user-writable path or revoked/unsigned status
    -- a strong rootkit-driver indicator. Additionally compute Levenshtein distance between the loaded
    filename and a known-good Windows driver list; a distance of 1-2 flags typosquatting/masquerading.
    This statistical rarity analysis defeats Stealth because legitimate drivers are widely deployed and
    signed, while rootkit drivers are rare, oddly placed, or near-duplicates of trusted names. Low-prevalence
    hits are prioritized for hash reputation and provenance review. Sources: [An In-Depth Look at Windows
    Kernel Threats](https://documents.trendmicro.com/assets/white_papers/wp-an-in-depth-look-at-windows-kernel-threats.pdf).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 6 (Sysmon)
  - Windows Event ID 3033
  - 'NAI: Domain Controllers, Critical Application Servers, Privileged User Workstations, All Windows
    Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from sysmon where EventCode=6\n| stats dc(Computer) as hosts by Hashes, ImageLoaded, Signature,\
      \ SignatureStatus\n| eval prevalence=hosts/total_hosts\n| eval ldist=levenshtein(filename(ImageLoaded),\
      \ nearest(known_good_drivers))\n| where prevalence<0.01 OR hosts==1 OR ldist in (1,2)\n      OR\
      \ SignatureStatus in (\"Unsigned\",\"Revoked\") OR user_writable(ImageLoaded)\n| alert driver=ImageLoaded"
- question: Does a supervised classifier flag any Sysmon Event ID 6 driver-load event as likely malicious
    based on signing, prevalence, path entropy, and location features?
  context: Train a Random Forest or Gradient Boosting classifier on Sysmon Event ID 6 features -- Signed
    (boolean), Signature (one-hot encoded), hash prevalence, entropy of the ImageLoaded path, and whether
    the path is a standard system location -- labeling golden-image drivers benign and threat-intel samples
    malicious. The model captures non-linear combinations of weak signals that individually pass rule
    thresholds, raising precision on novel rootkit drivers. For the Stealth tactic this matters because
    adversaries deliberately tune one attribute (e.g., a stolen valid signature) to evade single-feature
    rules; a multi-feature model is harder to fool. A high malicious score is a triage lead to validate
    against LOLDrivers and provenance.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 6 (Sysmon)
  - Windows Event ID 3033
  - 'NAI: Domain Controllers, Critical Application Servers, Privileged User Workstations, All Windows
    Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = features(Signed, onehot(Signature), hash_prevalence,\n             path_entropy(ImageLoaded),\
      \ is_system_path)\nclf = RandomForest().fit(golden_benign + ti_malicious)\nif clf.predict_proba(X).malicious\
      \ > 0.8: alert driver=ImageLoaded host=Computer"
- question: Does any driver-load hash match the LOLDrivers catalog of known-vulnerable or malicious drivers
    (BYOVD), and is it accompanied by a user-writable path or a newly registered kernel service?
  context: 'Bring-Your-Own-Vulnerable-Driver (BYOVD) is a primary rootkit enabler: adversaries load a
    legitimately signed but exploitable driver to gain kernel access. Match every driver-load Hashes value
    (Sysmon Event ID 6 / Code Integrity) against the curated, daily-refreshed LOLDrivers vulnerable-and-malicious
    catalog and raise a high-priority alert on any hit -- this is the deterministic floor for BYOVD detection.
    Corroborate with loads from user-writable paths and newly registered kernel services (Event ID 7045).
    This is directly tied to Stealth because the loaded driver provides the hooking capability used to
    hide artifacts. Any hit is high-confidence and should drive immediate response. Sources: [LOLDrivers](https://www.loldrivers.io/),
    [Sigma: Vulnerable Driver Load](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/driver_load/driver_load_win_vuln_drivers.yml),
    [An In-Depth Look at Windows Kernel Threats](https://documents.trendmicro.com/assets/white_papers/wp-an-in-depth-look-at-windows-kernel-threats.pdf).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 6 (Sysmon)
  - Windows Event ID 3033
  - 'NAI: Domain Controllers, Critical Application Servers, Privileged User Workstations, All Windows
    Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'lookup loldrivers.csv Hashes OUTPUT verdict

      (Sysmon EventCode=6 OR CodeIntegrity) AND verdict in ("vulnerable","malicious")

      | alert severity=critical driver=ImageLoaded host=Computer

      | correlate with EventCode=7045 (new kernel service) within 5m'
- question: Do any loaded kernel drivers or modules fail to match the per-image-version known-good baseline
    (hash allowlist) of authorized kernel components?
  context: 'For immutable kernel components, the most robust detection is known-good integrity comparison:
    maintain a per-image-version allowlist of every authorized kernel driver/module hash from the golden
    image and alert on any load whose hash is not in the baseline. This principle (Copilot coprocessor-based
    integrity monitoring) remains valid even when in-host tooling is subverted, because it compares against
    an out-of-band expected set rather than trusting live enumeration. For the Stealth tactic this is
    powerful: a rootkit can hide itself from APIs, but its driver hash still does not appear in the authorized
    baseline. Any deviation is investigated as unauthorized kernel code. Sources: [Copilot - a Coprocessor-based
    Kernel Runtime Integrity Monitor](https://www.usenix.org/legacy/event/sec04/tech/full_papers/petroni/petroni.pdf).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 6 (Sysmon)
  - Windows Event ID 3033
  - 'NAI: Domain Controllers, Critical Application Servers, Privileged User Workstations, All Windows
    Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from sysmon where EventCode=6

      | lookup golden_driver_baseline[image_version] Hashes as known

      | where isnull(known)

      | alert unauthorized_kernel_module host=Computer driver=ImageLoaded hash=Hashes'
- question: Does a provenance graph-learning model flag a kernel module whose causal neighborhood does
    not match the benign role distribution for legitimate modules?
  context: 'Build a per-host provenance/module-load graph and use graph representation learning (ThreaTrace
    / UNICORN) to score each kernel module by how well its causal neighborhood -- the loading process,
    any preceding service/driver install, and subsequent network/file edges -- matches the learned benign
    role distribution. A module whose surrounding structure is anomalous (e.g., loaded by an unusual process
    and immediately followed by hidden network edges) is flagged, with node-level scoring localizing the
    offending module for triage. This addresses Stealth because rootkits embed in unusual causal contexts
    even when individual events look benign. A positive node-level alert points the analyst directly at
    the suspect module. Sources: [ThreaTrace](https://arxiv.org/pdf/2111.04333), [UNICORN](https://arxiv.org/abs/2001.01525).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 6 (Sysmon)
  - Windows Event ID 3033
  - 'NAI: Domain Controllers, Critical Application Servers, Privileged User Workstations, All Windows
    Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/Provenance pseudocode
    query: "G = module_load_graph(per_host)\nemb = inductive_gnn(G)  # ThreaTrace\nfor module_node in\
      \ G:\n  if role_score(emb[module_node]) deviates_from benign_dist:\n    alert module=module_node\
      \ host=host neighborhood=causal_edges"
- question: Are service/driver-install utilities (sc.exe, bcdedit.exe, PnPUtil.exe) being executed by
    parent processes that are not legitimate administrative or deployment tools?
  context: Rootkit installation often invokes built-in utilities to register a malicious service or driver.
    Write a regex SIEM rule over Sysmon Event ID 1 (or 4688) command lines for patterns like 'sc.exe create',
    'bcdedit /set', or 'PnPUtil /add-driver' where ParentImage is NOT in an allowlist such as svchost.exe,
    mmc.exe, or explorer.exe. Legitimate admin actions almost always originate from known management chains;
    execution spawned by a browser, Office app, or script interpreter is highly suspicious. This is tactic-relevant
    for Stealth because the adversary tries to make installation look like routine administration; constraining
    on parent process exposes the masquerade. Positive hits should be pivoted to the resulting service/driver
    and its subsequent behavior.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: All Endpoints and Servers, especially user workstations and publicly accessible servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from sysmon where EventCode=1\n| where match(CommandLine, \"(?i)(sc(\\\\.exe)? create|bcdedit\\\
      \\s+/set|pnputil\\\\s+/add-driver)\")\n      AND ParentImage NOT IN (\n        \"C:\\\\Windows\\\
      \\System32\\\\svchost.exe\",\n        \"C:\\\\Windows\\\\System32\\\\mmc.exe\",\n        \"C:\\\\\
      Windows\\\\explorer.exe\")\n| alert host=Computer parent=ParentImage cmd=CommandLine"
- question: Are there new or extremely rare parent-child process relationships in the enterprise, such
    as a browser or Office process leading to sc.exe via cmd.exe?
  context: 'Baseline parent-child relationships across the enterprise from Sysmon Event ID 1: for each
    ParentImage, build a frequency distribution of its child Image values. Alert when a never-before-seen
    relationship appears or when an existing relationship falls into a rare percentile (<0.1%), e.g.,
    iexplore.exe -> cmd.exe -> sc.exe. Rootkit installers frequently produce such anomalous lineage because
    the initial foothold (an exploited app) is not a normal launcher of admin tools. This statistical
    lineage analysis supports the Stealth tactic by catching the unusual execution chain even when each
    binary is legitimate. Rare chains are triaged by examining the full process tree and command lines.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: All Endpoints and Servers, especially user workstations and publicly accessible servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from sysmon where EventCode=1

      | stats count by ParentImage, Image

      | eventstats sum(count) as total by ParentImage

      | eval freq=count/total

      | where isnew(ParentImage,Image) OR freq<0.001

      | alert parent=ParentImage child=Image freq=freq'
- question: Do clustering of command-line arguments reveal rare outlier commands or newly emerging clusters
    indicative of a novel rootkit installation technique?
  context: Vectorize process-creation command lines (TF-IDF over argument tokens) and cluster with DBSCAN
    to group common administrative commands. Small/outlier clusters or new clusters that suddenly appear
    across the environment may represent a previously unseen rootkit installation method. Unlike static
    regex, this unsupervised approach surfaces variants and obfuscated forms of install commands without
    prior signatures. For the Stealth tactic, it counters adversaries who tweak syntax to evade exact-match
    rules. Analysts review the members of anomalous clusters, focusing on those touching service/driver/boot
    configuration, and pivot to host context.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: All Endpoints and Servers, especially user workstations and publicly accessible servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'V = tfidf(tokenize(CommandLine))

      labels = DBSCAN(eps, min_samples).fit_predict(V)

      outliers = where(labels == -1 OR cluster_size<min)

      new_clusters = clusters_first_seen(last_24h)

      alert review CommandLine in outliers + new_clusters'
- question: 'Does the rootkit install-and-conceal TTP chain match as an inexact subgraph against host
    provenance: anomalous parent -> install utility -> service/driver registration -> kernel module load
    -> hidden outbound connection?'
  context: 'Encode the full rootkit install-and-conceal chain once as a query graph (anomalous parent
    -> sc.exe/bcdedit/PnPUtil -> service/driver registration -> kernel module load -> hidden outbound
    connection) and perform inexact subgraph matching (POIROT) against kernel-audit/Sysmon provenance.
    Because it matches the multi-step causal pattern rather than any single event, it resists evasion
    that defeats point detections and yields an explainable, end-to-end match. This is strongly tied to
    the Stealth tactic: the adversary breaks the kill chain across benign-looking steps, but the connected
    causal pattern remains. A match provides the analyst a ready-made narrative of the intrusion for response.
    Sources: [POIROT](https://dl.acm.org/doi/10.1145/3319535.3363217).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: All Endpoints and Servers, especially user workstations and publicly accessible servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Provenance pseudocode
    query: "Q = query_graph(anomalous_parent -> install_util ->\n                service_or_driver_reg\
      \ -> kernel_module_load ->\n                hidden_outbound_conn)\nmatches = inexact_subgraph_match(Q,\
      \ host_provenance)  # POIROT\nif matches: alert chain=matches.path host=host"
- question: Does an inductive GNN score any process-creation node as having an anomalous causal role in
    the host provenance graph, indicating a stealthy installer?
  context: 'Beyond TF-IDF/DBSCAN on command lines, score each process-creation node in the host provenance
    graph with an inductive GNN (ThreaTrace) to flag installers whose causal role deviates from benign
    administrative patterns. Node-level scoring localizes the specific anomalous process even when its
    command line looks ordinary, because the model evaluates the surrounding graph structure (who spawned
    it, what it spawns, what it touches). This complements signature and clustering methods for the Stealth
    tactic by catching role anomalies that text features miss. A flagged node is the precise process to
    triage, with its causal neighborhood as supporting evidence. Sources: [ThreaTrace](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: All Endpoints and Servers, especially user workstations and publicly accessible servers.'
  range: Last 90 days
  queries:
  - technology: ML/Provenance pseudocode
    query: "G = host_provenance_graph()\nemb = inductive_gnn(G)  # ThreaTrace\nfor p in process_creation_nodes(G):\n\
      \  if role_score(emb[p]) deviates_from benign_admin_dist:\n    alert process=p host=host neighborhood=causal_edges"
- question: Does a newly created service initiate an external network connection to a non-allowlisted
    destination within seconds of its creation?
  context: 'Stateful correlation links service creation to immediate egress: trigger when a new service
    is created (Windows Event ID 7045) and the associated service process (Event ID 4688) initiates an
    external connection (Sysmon Event ID 3 or Zeek conn.log) within ~60 seconds to a destination not on
    the organizational allowlist. Rootkit/backdoor services often beacon out promptly after installation.
    This sequence is tactic-relevant for Stealth because the adversary establishes covert C2 disguised
    as a legitimate service; the tight temporal coupling between creation and outbound connection is the
    tell. A positive correlation is high-fidelity and should prompt service/driver acquisition and destination
    enrichment.'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4688
  - Windows Event ID 3 (Sysmon)
  - Zeek conn.log
  - 'NAI: All Endpoints and Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EventCode=7045 as svc\n| join host on (EventCode=3 OR zeek_conn) as net\n    where net._time\
      \ - svc._time <= 60s\n      AND net.process == svc.service_process\n      AND net.dst NOT IN allowlist\
      \ AND is_external(net.dst)\n| alert service=svc.name dst=net.dst host=host"
- question: Are there outbound connections observed by the network sensor (Zeek conn.log) that have no
    corresponding host-side connection record (Sysmon Event ID 3) within the same window?
  context: 'Join Zeek conn.log to Sysmon Event ID 3 on (source_ip, source_port, dest_ip, dest_port, timestamp)
    and, per host, count connections seen by Zeek but missing from Sysmon within a 5-minute window. Establish
    a per-host baseline of this mismatch count and alert when it exceeds a dynamic threshold (e.g., 3
    standard deviations above the mean), and apply change-point detection to the mismatch series to catch
    the onset of concealment. A rootkit that hooks host APIs can hide its own connections from endpoint
    telemetry while the network sensor still records the traffic. This cross-view mismatch is a hallmark
    of the Stealth tactic; a sustained rise in mismatches strongly suggests active concealment on that
    host. Sources: [VMwatcher](https://www.cs.purdue.edu/homes/dxu/pubs/CCS07.pdf), [A Survey of Methods
    for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4688
  - Windows Event ID 3 (Sysmon)
  - Zeek conn.log
  - 'NAI: All Endpoints and Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "zeek_conn LEFT JOIN sysmon(EventCode=3)\n  on (src_ip,src_port,dst_ip,dst_port) within 5m\n\
      | where isnull(sysmon.match)\n| bin _time span=1h | stats count as miss by host,_time\n| eventstats\
      \ mean(miss) as mu, stdev(miss) as sd by host\n| where miss > mu+3*sd OR changepoint(miss)\n| alert\
      \ host=host hidden_conns=miss"
- question: Is there a process that initiates a network connection yet does not belong to any normal activity
    community in the host's process/network graph?
  context: 'Model host activity as a graph: nodes are processes (Sysmon Event ID 1) and network destinations
    (Sysmon Event ID 3); edges are creations and connections. Run community detection (e.g., Louvain modularity)
    to learn normal clusters of related activity. A process that makes a network connection but is not
    part of any established community is an outlier consistent with a hidden or injected process. This
    supports the Stealth tactic because injected/orphaned rootkit components lack the normal relational
    context of legitimate software. The flagged outlier process and its connection are triaged against
    prevalence, signing, and provenance to confirm concealment.'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4688
  - Windows Event ID 3 (Sysmon)
  - Zeek conn.log
  - 'NAI: All Endpoints and Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = graph(nodes=processes+net_dsts, edges=create+connect)\ncomms = louvain(G)\nfor p in connecting_processes(G):\n\
      \  if community(p) is None or singleton:\n    alert outlier_process=p dst=p.connections host=host"
- question: Are there processes, connections, or modules present in an authoritative external view (network
    sensor / kernel-scheduler) but absent from the in-host listings, indicating concealment regardless
    of hiding mechanism?
  context: 'Apply cross-view differential detection: treat the network egress sensor (Zeek conn.log) and
    the kernel/scheduler views as the authoritative out-of-the-box enumeration and diff them against in-host
    listings (Sysmon Event ID 3 connections, running-process and loaded-module lists). Anything present
    in the authoritative view but missing from the in-host view is rootkit concealment, independent of
    the specific hiding technique (VMwatcher principle). This is the definitional test for the Stealth
    tactic: the rootkit''s whole purpose is to make the host''s own view lie. A nonempty difference set
    is high-confidence evidence of an active rootkit and should drive memory acquisition and isolation.
    Sources: [VMwatcher](https://www.cs.purdue.edu/homes/dxu/pubs/CCS07.pdf).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4688
  - Windows Event ID 3 (Sysmon)
  - Zeek conn.log
  - 'NAI: All Endpoints and Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'authoritative = set(zeek_conn.dst, kernel_scheduler.procs, kernel.modules)

      inhost = set(sysmon3.conns, host.proclist, host.modlist)

      hidden = authoritative - inhost

      if hidden: alert concealed=hidden host=host'
- question: Does live kernel inspection reveal a process that has an active socket or scheduler entry
    but is missing from the canonical all-processes list (DKOM hiding)?
  context: 'Where live kernel inspection is available (osquery, Volatility on memory captures, or EDR
    kernel telemetry), verify semantic invariants over kernel objects: every process with an active socket
    or a scheduler/run-queue entry MUST also appear in the canonical all-processes list. An entry that
    is runnable or holds a connection but is unlinked from the process list indicates Direct Kernel Object
    Manipulation (DKOM) hiding (Petroni semantic-integrity principle). This is a precise structural test
    for the Stealth tactic, catching the most advanced kernel rootkits that unlink their EPROCESS/task_struct
    from enumeration. Any invariant violation is high-confidence and warrants full forensic memory analysis.
    Sources: [Specification-Based Detection of Semantic Integrity Violations in Kernel Dynamic Data](https://www.usenix.org/legacy/event/sec06/tech/full_papers/petroni/petroni.pdf).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4688
  - Windows Event ID 3 (Sysmon)
  - Zeek conn.log
  - 'NAI: All Endpoints and Servers, Network Egress Points'
