  queries:
  - technology: ML/pseudocode
    query: 'X = features(User, ParentImage, cmdline_tokens, exec_hour)

      oc = OneClassSVM().fit(benign_admin_events)

      if oc.predict(X) == -1: alert outlier_admin_exec process=Image host=Computer'
- question: Do boot components or loaded drivers/modules deviate from their known-good baseline hashes,
    or are raw-disk writes performed by an unknown image consistent with BYOVD/driver abuse?
  context: 'Maintain known-good hashes of boot components and the authorized driver/module inventory and
    alert on any deviation or on loads not in the baseline. Out-of-band, known-good integrity comparison
    (Copilot principle) detects bootkit/rootkit modification of immutable boot and kernel components even
    when host tooling is compromised. Corroborate raw-disk writes (Sysmon Event ID 9) by an unknown Image
    with BYOVD/driver-abuse context. This is tactic-relevant for Stealth because boot/kernel components
    are exactly what advanced rootkits subvert to hide and persist; comparing against an out-of-band trusted
    baseline cannot be fooled by in-host hooks. Any deviation triggers forensic imaging. Sources: [Copilot
    - a Coprocessor-based Kernel Runtime Integrity Monitor](https://www.usenix.org/legacy/event/sec04/tech/full_papers/petroni/petroni.pdf),
    [An In-Depth Look at Windows Kernel Threats](https://documents.trendmicro.com/assets/white_papers/wp-an-in-depth-look-at-windows-kernel-threats.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 9 (Sysmon)
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 13 (Sysmon)
  - 'NAI: System Partitions on all hosts, Boot sectors of physical disks on servers and workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'current = hashes(boot_components, loaded_drivers_modules)

      baseline = known_good_baseline[image_version]

      deviation = current - baseline

      if deviation: alert boot_or_kernel_integrity host=Computer items=deviation

      | correlate Sysmon EventCode=9 raw_write by unknown Image -> byovd_context'
- question: Was a known security-agent process (e.g., MsMpEng.exe, csagent.exe, cb.exe, taniumclient.exe)
    terminated, as seen in Sysmon Event ID 5?
  context: Rootkits and their loaders frequently kill or unload security tooling to operate unobserved.
    Create a critical, immediate alert when a Process Terminated event (Sysmon Event ID 5) shows an Image
    matching a predefined list of essential security agents (e.g., MsMpEng.exe, csagent.exe, cb.exe, taniumclient.exe).
    Such terminations are rarely legitimate outside controlled maintenance and are a direct blinding signal.
    This is core to the Stealth tactic because disabling the defender's visibility is a prerequisite for
    stealthy operation. Any hit should trigger investigation of the terminating process and immediate
    containment, treating the host as potentially compromised.
  answer_sources:
