  queries:
  - technology: SIEM/Stats pseudocode
    query: 'group hosts by golden_image_id

      | per image: dist_i = distribution(sec_agent_events, kernel_events) per host

      | flag host where divergence(dist_host, peer_consensus) > threshold

      | alert divergent_replica host=host image=golden_image_id'
- question: Does whole-system provenance show a host abruptly losing its expected security-agent process/module
    subgraph while gaining attacker-driven process/driver edges?
  context: 'Model whole-system provenance and flag when a host''s graph sketch abruptly loses the expected
    security-agent process/module subgraph (agent terminated/unloaded) while simultaneously gaining attacker-driven
    process/driver edges (UNICORN / KAIROS). This structural anomaly is detected without per-event signatures,
    and the alert surfaces the contributing edges so the analyst sees both the disappearance of defenses
    and the new malicious activity. It is directly tied to the Stealth tactic: the adversary blinds the
    agent and then operates, and the provenance graph captures both halves of that transition. A positive
    result is a high-priority, well-localized lead for response. Sources: [UNICORN](https://arxiv.org/abs/2001.01525),
    [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Event ID 7031
  - Windows Event ID 7034
  - Windows Event ID 5 (Sysmon)
