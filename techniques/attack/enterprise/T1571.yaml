questions:
- question: '[Command and Control] Alert on TI-matched high ports: Can you determine whether a successful
    TCP connection (e.g., Zeek ''SF'' state) is established from an internal asset to an external, non-private
    IP address on a destination port outside the organization''s standard egress allow-list (e.g., not
    TCP/80, 443, 53, 25, 22), and the destination IP is present on a high-confidence threat intelligence
    feed of known C2 servers? -- specifically, using the ''Alert on TI-matched high ports'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary communicates
    with command-and-control infrastructure by pairing a protocol with a port that is not normally associated
    with it (e.g., HTTPS over TCP/8088 or TCP/587 instead of 443), in order to bypass egress filtering
    and muddle analysis of network data. This evidence focuses on the condition that a successful TCP
    connection (e.g., Zeek ''SF'' state) is established from an internal asset to an external, non-private
    IP address on a destination port outside the organization''s standard egress allow-list (e.g., not
    TCP/80, 443, 53, 25, 22), and the destination IP is present on a high-confidence threat intelligence
    feed of known C2 servers. This Symbolic Logic approach works as follows: Maintain a deterministic
    egress allow-list of {protocol->port} pairs ({80,443,53,25,22,8080}); filter Zeek conn.log for successful
    outbound SF connections to external IPs on ports outside it, join destination IPs to a high-confidence
    C2 threat-intel feed, and alert on any match. Keep the hard port/state thresholds as a floor and tune
    the allow-list per environment ([MITRE T1571](https://attack.mitre.org/techniques/T1571/)). What the
    analyst is looking for: deviations from the environment''s known-good protocol/port pairings and egress
    allow-list that correlate with C2 tradecraft -- non-standard destination ports, protocol-on-wrong-port
    mismatches, beacon-like periodicity, asymmetric byte flows, malicious TLS/certificate fingerprints,
    and unexpected processes or daemons originating the traffic. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable non-standard-port C2; pivot to the responsible host
    and process lineage, the destination IP/ASN/geo and any threat-intel association, the protocol actually
    carried on the port, the session timing and volume, and any related beaconing or data-transfer activity.
    A negative result helps rule out this particular non-standard-port C2 vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, jittered, or protocol-mimicking
    channels.'
