name: 'T1571: Non-Standard Port'
id: 1fdfb6dc-0aae-4eda-a219-19425d10e0ab
description: 'This playbook helps an analyst investigate whether an adversary is using a non-standard
  protocol-and-port pairing to communicate with command-and-control (C2) infrastructure as part of the
  Command and Control tactic -- for example HTTPS over TCP/8088 or TCP/587 instead of 443, or a service
  rebound to an unexpected port via Registry/config changes. The hunt spans network and endpoint telemetry
  across Windows, Linux, macOS, and ESXi: Zeek conn/ssl/x509/weird logs and DPI (nDPI) sensors for egress
  and East-West visibility, plus Sysmon Event ID 3, Windows Event IDs 5156/5157/4688, auditd, and process/listening-socket
  inventories on hosts. It guides the analyst across several complementary angles: matching successful
  outbound connections on ports outside the egress allow-list against high-confidence C2 threat intelligence;
  profiling failed/blocked high-port egress as a C2-setup signal; flagging rare destination IP/ASN/port
  tuples; matching malicious TLS JA3/JA3S fingerprints and self-signed or short-lived certificate metadata;
  detecting protocol-port mismatches via deep packet inspection; baselining and change-point/forecasting
  on per-host mismatch rates; spotting LOLBins and other unexpected processes initiating non-standard-port
  connections; and identifying beacon-like periodicity, asymmetric byte ratios, and low-and-slow heartbeats.
  Detection methods combine symbolic-logic rules, statistical baselining and change-point/forecasting,
  and machine-learning models (Random Forest, DBSCAN, One-Class SVM/Isolation Forest, CT-HMM, autoencoders)
  so the analyst can corroborate suspected non-standard-port C2 across network flows, TLS fingerprints,
  protocol identity, and host process behavior.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
