name: 'T1016: System Network Configuration Discovery'
id: 6530fcf2-1728-4f59-b5b2-e1df9c4f9ad7
description: Investigate adversary attempts to discover system and network configuration information (IP/MAC
  addresses, interfaces, routing tables, ARP/NetBIOS state) across Windows, Linux, macOS, ESXi, and network
  devices. This playbook helps an analyst hunt for execution of built-in discovery utilities (ipconfig/ifconfig,
  arp, route, nbtstat, netsh, Get-NetIPConfiguration, networksetup, system_profiler, esxcli network, and
  network-device CLI commands such as show ip route / show ip interface / show arp), including invocations
  with suspicious command-line arguments or output redirection matching known-malicious signatures, discovery
  utilities spawned by anomalous parent processes or out-of-profile users, rapid bursts of multiple unique
  discovery commands on a single host, remote/lateral discovery fan-out from one source to many destinations,
  and host-based network scanning that maps the local segment. It layers deterministic floor rules with
  statistical baselining and explainable machine-learning analytics so a SOC analyst can distinguish routine
  administration from reconnaissance preceding lateral movement and targeting of sensitive systems.
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any process-creation event show a network discovery command whose command-line arguments
    or output redirection match a known-malicious signature (for example, ipconfig /all redirected into
    a file under a public or temp path)?
  context: This is the deterministic floor rule for the Discovery tactic. Adversaries routinely run native
    discovery utilities and pipe the output to a staging file before exfiltrating or reviewing it. Build
    a SIEM rule using regular expressions that match high-confidence malicious command-line patterns drawn
    from threat intelligence (e.g., `ipconfig /all >> C:\Users\Public\net_info.tmp`) against process-creation
    logs across all platforms. Maintain a cross-platform watchlist of discovery binaries/cmdlets — ipconfig,
    arp, route, nbtstat, netsh, Get-NetIPConfiguration, ifconfig, `ip a`, networksetup, system_profiler,
    `esxcli network nic list`, `esxcli network ip interface ipv4 get`, and network-device `show ip route`/`show
    ip interface`/`show arp`. A positive match is a strong, low-false-positive lead; keep these deterministic
    rules in place even after layering statistical and ML analytics. Reference CAR-2021-02-002 and SigmaHQ.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - auditd:EXECVE
  - macos:unifiedlog
  - esxi:hostd
  - 'NAI: User Workstations, Domain Controllers, Critical Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "discovery_bins = [\"ipconfig\",\"arp\",\"route\",\"nbtstat\",\"netsh\",\"Get-NetIPConfiguration\"\
      ,\"ifconfig\",\"ip\",\"networksetup\",\"system_profiler\",\"esxcli\"]\nALERT WHERE proc.name IN\
      \ discovery_bins\n  AND (proc.cmdline MATCHES /(>>?|-Out-File|tee)\\s*\\S+\\.(tmp|txt|log|dat)/i\n\
      \       OR proc.cmdline MATCHES known_malicious_regex_from_TI)"
- question: Among observed network discovery executions, which command lines or output/redirection paths
    are statistically rare (e.g., in the bottom 1st percentile of historical usage) or exhibit high command-line
    entropy indicative of obfuscated one-liners?
  context: Reconnaissance often appears as a rarely-seen argument string or an unusual write path that
    does not match normal administrative habits. Rank discovery command lines and their output/redirection
    paths by environment-wide prevalence and alert on the rare tail (bottom 1st percentile). Add a Volume
    feature (bytes written/redirected) and a Shannon-entropy measure of the command line to catch obfuscated
    or encoded one-liners. Derive percentile and entropy cutoffs per dataset from a rolling 30-day baseline
    so thresholds reflect your environment. A hit in the rare tail with high entropy is a high-priority
    Discovery lead; a common command line to a routine path is likely benign administration. Reference
    CAR-2014-11-002, Red Canary LOLBins, and Elastic high-command-line-entropy guidance.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - auditd:EXECVE
  - macos:unifiedlog
  - esxi:hostd
  - 'NAI: User Workstations, Domain Controllers, Critical Application Servers'
  range: Last 90 days, baselined over a rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "events = FILTER proc_creation BY proc.name IN discovery_bins\nbaseline = PERCENTILE_RANK(events.cmdline,\
      \ events.output_path) OVER last_30d\nALERT WHERE baseline.pct <= 1\n  OR shannon_entropy(events.cmdline)\
      \ >= entropy_cutoff_30d\n  OR events.bytes_written >= volume_cutoff_30d"
- question: When a supervised classifier scores a network discovery execution, is it flagged as malicious
    based on features such as redirection operators, output-path entropy, rare parent process, and command-line
    entropy — and which top features drove the score?
  context: Train a logistic regression or gradient-boosted tree classifier on labeled command-line data
    from Windows Event ID 4688, Sysmon Event ID 1, or auditd EXECVE. Use features including command name,
    argument count, presence of redirection operators (>, >>), output file-path entropy, parent-process
    rarity, and command-line entropy. Score new executions and, critically, surface the top-3 contributing
    features in the alert text (e.g., redirection-to-temp, rare parent, high entropy) so analysts can
    triage on rationale rather than an opaque score. This complements the deterministic and statistical
    layers for the Discovery tactic by catching novel variants. A high score with intelligible contributing
    features warrants investigation; review the feature attribution to confirm or dismiss. Reference Elastic
    high-command-line-entropy and DeepLog (Du et al.).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - auditd:EXECVE
  - macos:unifiedlog
  - esxi:hostd
  - 'NAI: User Workstations, Domain Controllers, Critical Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = load_classifier("discovery_cmdline_clf")

      features = EXTRACT(proc.name, arg_count, has_redirection, path_entropy, parent_rarity, cmdline_entropy)

      score, attribution = model.predict_proba(features), model.explain(features)

      ALERT WHERE score >= threshold WITH top3 = attribution.top(3)'
- question: Was a network discovery utility (ipconfig.exe, arp.exe, route.exe, nbtstat.exe, ifconfig,
    networksetup) launched by a parent process that is NOT on the allowlist of expected parents — for
    example, by WINWORD.EXE, EXCEL.EXE, CHROME.EXE, AcroRd32.exe, services.exe, or a web-server process?
  context: Legitimate discovery commands are normally spawned by interactive shells, the explorer shell,
    or management agents. When a discovery utility is spawned by an office application, browser, PDF reader,
    or a server daemon, it strongly suggests code execution via a malicious document, exploit, or web
    shell performing automated reconnaissance. Create a SIEM rule that alerts when a discovery utility
    is executed by a parent not on an allowlist (cmd.exe, powershell.exe, explorer.exe, approved management
    agents). Specifically flag suspicious parents like WINWORD.EXE, EXCEL.EXE, CHROME.EXE, AcroRd32.exe,
    services.exe, or web-server processes; apply the equivalent allowlist logic on Linux/macOS (shells/management
    agents vs. server daemons). A non-allowlisted parent is a high-fidelity Discovery signal and should
    be triaged promptly. Reference CAR-2014-11-002 and Red Canary LOLBins.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - auditd:EXECVE
  - macos:unifiedlog
  - 'NAI: User Workstations, Member Servers, Human Resources Systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "allowed_parents = [\"cmd.exe\",\"powershell.exe\",\"explorer.exe\",\"<mgmt_agents>\",\"bash\"\
      ,\"zsh\",\"sh\"]\nsuspicious_parents = [\"WINWORD.EXE\",\"EXCEL.EXE\",\"CHROME.EXE\",\"AcroRd32.exe\"\
      ,\"services.exe\",\"w3wp.exe\",\"httpd\",\"nginx\"]\nALERT WHERE proc.name IN discovery_bins\n \
      \ AND (proc.parent NOT IN allowed_parents OR proc.parent IN suspicious_parents)"
- question: Did any user execute a specific discovery command at a frequency exceeding 3 standard deviations
    above the historical baseline for their role (Standard User, IT Admin, Server Admin) within a 24-hour
    window?
  context: Living-off-the-land reconnaissance hides among legitimate admin tooling, so the recommended
    countermeasure is behavioral baselining of admin-tool use per role. Establish a baseline of execution
    frequency (count/24h) for each discovery command per user role. Generate an alert when a user's count
    for a specific command exceeds 3 standard deviations above the historical baseline for their role
    within a 24-hour window, and re-derive the per-role mean and σ monthly. A standard user suddenly running
    discovery commands many times — or even an admin spiking far above their own norm — indicates possible
    reconnaissance or account misuse. A within-baseline count is expected administration. Reference CISA/NSA
    Identifying and Mitigating LOTL and CAR-2014-11-002.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - auditd:EXECVE
  - macos:unifiedlog
  - 'NAI: User Workstations, Member Servers, Human Resources Systems'
  range: Last 90 days, baseline re-derived monthly per role
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'counts = COUNT(proc_creation) BY user, role, proc.name, window=24h

      stats = MEAN_STDDEV(counts) BY role, proc.name OVER trailing_baseline

      ALERT WHERE counts.value > stats.mean + 3*stats.stddev'
- question: Do unsupervised clustering or host-provenance models flag a process that suddenly assumes
    an 'enumerator' role — e.g., discovery commands co-occurring with other suspicious behavior, run at
    anomalous times, or by an out-of-profile account?
  context: Run unsupervised clustering (e.g., DBSCAN) over process-execution events using features user,
    host, parent process, command, prevalence, and time-of-day; alternatively learn benign node roles
    over host provenance graphs so a process that suddenly behaves like an enumerator is flagged. Investigate
    clusters or nodes where discovery commands co-occur with other suspicious behavior or run at anomalous
    times, and emit the top-3 distinguishing features (rare parent, off-hours, command rarity) in the
    alert for explainable triage. This catches reconnaissance from accounts or processes operating outside
    their normal behavioral profile, supporting the Discovery tactic. A node assuming a new enumerator
    role with anomalous features merits investigation. Reference ThreaTrace (Wang et al.) and KAIROS (Cheng
    et al.).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - auditd:EXECVE
  - macos:unifiedlog
  - 'NAI: User Workstations, Member Servers, Human Resources Systems'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = cluster_or_provenance(features=[user,host,parent,command,prevalence,time_of_day])

      anomalies = model.flag(node_role == "enumerator" AND deviates_from_benign)

      ALERT FOR anomalies WITH top3 = anomalies.distinguishing_features(3)'
- question: Did a single host execute three or more UNIQUE network discovery commands from the cross-platform
    watchlist within a 5-minute window, indicating a reconnaissance burst?
  context: Adversaries performing automated discovery frequently run a sequence of different commands
    back-to-back to quickly map the host and network. Create a SIEM correlation rule that triggers when
    a single host executes 3 or more unique network discovery commands from the watchlist (ipconfig, arp,
    route, nbtstat, netsh, ifconfig, `ip a`, networksetup, system_profiler, `esxcli network nic list`,
    `esxcli network ip interface ipv4 get`, `show ip route`, `show ip interface`, `show arp`) within a
    5-minute window. Keep this deterministic burst rule as the floor for the Discovery tactic and tune
    the window/count per environment. Three distinct discovery tools in quick succession is unusual for
    routine use and is a strong recon indicator. Reference SigmaHQ and CISA/NSA LOTL guidance.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - auditd:EXECVE
  - macos:unifiedlog
  - esxi:hostd
  - networkdevice:cli
  - 'NAI: User Workstations, Domain Controllers, Development Environments'
  range: Last 90 days, 5-minute correlation window per host
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'burst = FILTER proc_creation BY proc.name IN discovery_watchlist

      GROUP burst BY host, window=5m

      ALERT WHERE distinct_count(burst.proc.name) >= 3'
- question: Did any host show a sudden spike in the Shannon entropy of executed command names within a
    10-minute sliding window — more than 2.5 standard deviations above its own baseline — indicating a
    burst of diverse commands characteristic of reconnaissance?
  context: A diverse flurry of distinct commands raises command-name entropy, which is a hallmark of interactive
    or scripted reconnaissance. For each host, compute the Shannon entropy of command names executed within
    a 10-minute sliding window from process-creation logs and alert when entropy deviates more than 2.5
    standard deviations from the host's own historical baseline. Pair this with a raw Frequency count
    of distinct discovery commands so a single noisy tool repeated many times does not mask (or falsely
    create) a burst. A genuine entropy spike accompanied by multiple distinct discovery commands supports
    the Discovery tactic hypothesis; steady-state entropy is normal. Reference Forrest et al. (A Sense
    of Self) and Elastic high-command-line-entropy.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - auditd:EXECVE
  - macos:unifiedlog
  - esxi:hostd
  - networkdevice:cli
  - 'NAI: User Workstations, Domain Controllers, Development Environments'
  range: Last 90 days, 10-minute sliding window with per-host baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per_host = SLIDING(proc_creation, window=10m) BY host\nentropy = SHANNON(per_host.proc.name)\n\
      base = MEAN_STDDEV(entropy) BY host OVER history\nALERT WHERE entropy > base.mean + 2.5*base.stddev\n\
      \  AND distinct_count(per_host.discovery_cmds) >= 2"
- question: Does a sequence model flag a command chain with very low occurrence probability for the user/host
    — especially one containing multiple discovery commands in rapid succession?
  context: Train a sequence model (Hidden Markov Model or LSTM next-event predictor) on normal per-user/host
    command sequences and flag chains whose occurrence probability is very low, particularly those containing
    multiple discovery commands in rapid succession. Surface the specific low-probability transition(s)
    and the top-3 contributing events in the alert so analysts can see exactly which step was anomalous.
    This catches reconnaissance chains that individually look benign but, in sequence, are highly improbable
    for that user/host — directly supporting the Discovery tactic. A flagged low-probability chain dominated
    by discovery commands warrants investigation; an ordinary, high-probability sequence does not. Reference
    DeepLog (Du et al.) and Forrest et al.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - auditd:EXECVE
  - macos:unifiedlog
  - esxi:hostd
  - networkdevice:cli
  - 'NAI: User Workstations, Domain Controllers, Development Environments'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = load_sequence_model(\"per_user_cmd_seq\")\nprob, transitions = model.score(recent_cmd_sequence)\n\
      ALERT WHERE prob <= low_prob_threshold\n  AND count_discovery_cmds(recent_cmd_sequence) >= 2\n \
      \ WITH explain = transitions.lowest(3)"
- question: Did successful remote logons (Event ID 4624, Logon Type 3) from a single source get followed
    within 5 minutes by network discovery command executions on the destination hosts, spanning more than
    5 distinct destinations from that source within an hour?
  context: Remote/lateral discovery fan-out is a strong indicator that an adversary with valid credentials
    is mapping the network from a beachhead. Create a SIEM correlation rule that triggers when successful
    remote logons (Windows Event ID 4624, Logon Type 3) from a single source are followed within 5 minutes
    by network discovery command executions (Event ID 4688, Sysmon Event ID 1) on the destination hosts,
    and alert if this pattern spans more than 5 distinct destinations from the same source within 1 hour.
    Keep this deterministic threshold and tune the destination count to your environment size. The combination
    of remote logon plus immediate discovery across many hosts is a high-fidelity lateral-discovery signal
    for the Discovery tactic. Reference CISA/NSA LOTL guidance.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Internal Network Segments, Internal Servers and Workstations, Domain Controllers'
  range: Last 90 days, 5-minute logon-to-discovery window and 1-hour fan-out window
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'logons = FILTER Event4624 BY logon_type=3

      disc = FILTER proc_creation BY proc.name IN discovery_bins

      joined = JOIN logons->disc ON dest_host WHERE disc.time - logons.time <= 5m

      ALERT WHERE distinct_count(joined.dest_host) BY source > 5 WITHIN 1h'
- question: From Zeek conn.log, did any source exceed the 99th percentile for unique remote-administration
    connections (ports 135/445/5985/5986) or distinct-destination count, and/or show a high ratio of failed
    logons (Event ID 4625) or rejected/half-open connections indicating fan-out even when few logons succeed?
  context: 'Baseline per source the number of unique remote-administration connections (ports 135, 445,
    5985, 5986) and the distinct-destination count in a sliding window, then alert when a source exceeds
    the 99th percentile and is temporally correlated with anomalous discovery executions on the targets.
    Explicitly profile the Failure mode: a high ratio of failed logons (Event ID 4625) or rejected/half-open
    connections per source is a distinct fan-out signal even when few logons succeed — useful for catching
    reconnaissance that probes broadly but lands rarely. This supports the Discovery tactic by detecting
    lateral-discovery fan-out behaviorally. A source above the 99th percentile with elevated failure ratio
    is a strong lead. Reference Splunk password-spraying detection and Jung et al. fast portscan detection.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Internal Network Segments, Internal Servers and Workstations, Domain Controllers'
  range: Last 90 days, baselined over rolling history
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'src = AGG Zeek_conn BY id.orig_h, window=1h

      remote_admin = COUNT(distinct dst) WHERE dst_port IN [135,445,5985,5986]

      fail_ratio = COUNT(Event4625)/COUNT(Event4624) BY src

      ALERT WHERE remote_admin >= P99(history) OR fail_ratio >= peer_group_norm'
- question: Does a login/authentication graph reveal an anomalous source-to-many-destination fan-out path,
    credential switching, or cross-community admin connections immediately followed by discovery — and
    what top features drive the rarity score?
  context: Build a login/authentication graph from first-party auth events and infer movement paths, rarity-scoring
    source-to-many-destination fan-out and credential switching that accompanies remote discovery. Alternatively,
    learn benign communication communities from Zeek conn.log and score cross-community admin connections
    that are immediately followed by discovery commands. Emit the top-3 contributing features (destination
    breadth, path rarity, failed-logon ratio) in the alert for explainable triage. This graph-based approach
    catches stealthy lateral discovery that threshold rules miss, supporting the Discovery tactic. A rare
    fan-out path with credential switching and subsequent discovery is high priority. Reference Hopper
    (Ho et al.) and KAIROS (Cheng et al.).
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Internal Network Segments, Internal Servers and Workstations, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'graph = build_login_graph(auth_events)

      paths = infer_movement_paths(graph)

      score, feats = rarity_score(paths, signals=[dest_breadth, cred_switch, followed_by_discovery])

      ALERT WHERE score >= threshold WITH top3 = feats.top(3)'
- question: Did Zeek emit a Scan::Address_Scan notice correlated with a spike of connection attempts from
    the same id.orig_h within 5 minutes, or did a Threshold Random Walk classifier flag a source after
    a short sequence of unanswered/rejected connections (conn_state S0/REJ/RSTOS0)?
  context: 'Host-based network scanning to map the local segment is a network-visible form of network
    configuration discovery. Alert when Zeek emits a `Scan::Address_Scan` notice in notice.log and correlate
    it with a spike in connection attempts in conn.log from the same `id.orig_h` within 5 minutes. Add
    a deterministic Threshold Random Walk (TRW) classifier: treat each connection as success/failure and
    flag a source after a short sequence dominated by unanswered/rejected attempts (conn_state S0/REJ/RSTOS0).
    The Failure mode is explicit — the unanswered-connection ratio is the core enumeration signal. This
    is a high-fidelity floor for detecting local mapping under the Discovery tactic. A scan notice plus
    a TRW trip is a strong lead. Reference Jung et al. fast portscan detection and SigmaHQ.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek weird.log
  - 'NAI: Internal Network Segments, VLANs containing sensitive systems, Data Center Networks'
  range: Last 90 days, 5-minute correlation window
  queries:
  - technology: Zeek/pseudocode
    query: "notice = FILTER Zeek_notice BY note == \"Scan::Address_Scan\"\nconn_spike = COUNT(Zeek_conn)\
      \ BY id.orig_h, window=5m\nfail_seq = SEQUENCE(conn.conn_state IN [\"S0\",\"REJ\",\"RSTOS0\"]) BY\
      \ id.orig_h\nALERT WHERE notice AND conn_spike high\n  OR TRW(fail_seq) crosses upper_threshold"
- question: From Zeek conn.log, did any host contact a number of unique destination IPs on its local subnet
    more than 3 standard deviations above its own history or peer group within an hour, or show a failure/unanswered-connection
    ratio above the peer-group norm?
  context: Baseline per host the number of unique destination IPs contacted on its local subnet within
    a 1-hour window (Volume) and the fraction of those connections that fail or go unanswered (State).
    Alert when the unique-destination count exceeds 3 standard deviations above the host's history or
    its peer group, or when the failure ratio jumps above the peer-group norm; derive both thresholds
    from a rolling 30-day baseline. A workstation that suddenly fans out to many local destinations —
    especially with many unanswered connections — is likely enumerating the segment, supporting the Discovery
    tactic. Steady, low unique-destination counts consistent with peers are benign. Reference Jung et
    al. and Forrest et al.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek weird.log
  - 'NAI: Internal Network Segments, VLANs containing sensitive systems, Data Center Networks'
  range: Last 90 days, 1-hour window with rolling 30-day baseline
  queries:
  - technology: Zeek/pseudocode
    query: 'per_host = AGG Zeek_conn BY id.orig_h, window=1h

      uniq_dst = COUNT(distinct id.resp_h) WHERE id.resp_h IN local_subnet

      fail_ratio = COUNT(conn_state IN ["S0","REJ"])/COUNT(*)

      base = MEAN_STDDEV(uniq_dst) BY host_or_peergroup OVER 30d

      ALERT WHERE uniq_dst > base.mean + 3*base.stddev OR fail_ratio > peer_norm'
- question: Does an LSTM-based autoencoder or temporal graph model flag a burst in a host's rate of new
    connection initiations that deviates from its forecast — with unique-destination count and failure
    ratio among the top contributing features?
  context: Apply an LSTM-based autoencoder (or temporal provenance/graph model) to the per-host rate of
    new connection initiations from Zeek conn.log; train on normal traffic and flag bursts that deviate
    from the forecast reconstruction. Include unique-destination count and failure ratio as input features
    and surface the top-3 contributors (burst magnitude, destination breadth, failure ratio) in the alert
    for explainable triage. This catches subtle or slow scans and bursty enumeration that fixed thresholds
    miss, supporting the Discovery tactic. A high reconstruction error driven by destination breadth and
    failed connections indicates probable local mapping. Reference KAIROS (Cheng et al.) and DeepLog (Du
    et al.).
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek weird.log
  - 'NAI: Internal Network Segments, VLANs containing sensitive systems, Data Center Networks'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'model = lstm_autoencoder(per_host_new_conn_rate)

      recon_err = model.error(current_window)

      feats = [burst_magnitude, unique_destinations, failure_ratio]

      ALERT WHERE recon_err >= threshold WITH top3 = explain(feats).top(3)'
