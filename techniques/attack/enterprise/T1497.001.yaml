name: 'T1497.001: Virtualization/Sandbox Evasion: System Checks'
id: 9e85cec3-abac-4a99-a4c5-0bda49e3f51e
description: 'This playbook helps an analyst investigate whether an adversary is using system checks to
  detect virtualization, sandbox, or analysis environments (T1497.001) in order to evade defenses (Stealth)
  and orient itself (Discovery) before deciding whether to run, hide, or abort malicious code. It guides
  a hunt across Windows, Linux, and macOS along several behavioral angles: command-line and PowerShell
  script-block content matching canonical anti-analysis tooling strings, registry paths, WMI classes,
  and MAC OUIs (Pafish, al-khaser, Seatbelt); a single process touching multiple VM-specific files, registry
  keys, or services in a short window; the defining ''check then quit'' failure mode of a short-lived,
  user-writable-directory process that performs checks, makes no outbound connection, and self-deletes;
  endpoint connections to VM host-guest backdoor ports (e.g., VMware 0x5658) and bursts of failed probes;
  unsigned processes from %TEMP%/%APPDATA% issuing many WMI/registry/system-info queries; file-access
  attempts against analysis-related names (''malware'',''sample'',''sandbox'',''procmon'',''wireshark'');
  Linux execve bursts of dmidecode/lscpu/lspci/systemd-detect-virt and reads of /sys/class/dmi/id and
  /proc paths; and macOS system_profiler/ioreg/kextstat/sysctl enumeration for hypervisor strings. For
  each behavior it pairs deterministic symbolic-logic watchlists with statistical baselining (entropy,
  frequency/volume, system-interaction-to-network ratios, rarity scoring) and machine-learning models
  (one-class SVM/Isolation Forest, provenance-graph subgraph matching, HMM/LSTM sequence models, clustering,
  autoencoders), applied to Windows Security/Sysmon events, PowerShell script-block logs, auditd, macOS
  unified logs, and Zeek network telemetry, so the analyst can corroborate suspected VM/sandbox evasion
  across process lineage, artifact access, check breadth, and the absence of expected follow-on activity.'
type: technique
