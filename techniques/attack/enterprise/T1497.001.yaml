questions:
- question: '[Stealth] Script detection rule: Can you determine whether a process executes a command-line
    string or PowerShell script containing specific arguments or string literals known to be used for
    sandbox detection, such as querying for VMware MAC address prefixes (''00:05:69'',''00:0C:29'',''08:00:27''
    for VirtualBox) or specific WMI classes (''SELECT * FROM Win32_Fan'', ''Win32_BIOS'', ''Win32_ComputerSystem'').
    -- specifically, using the ''Script detection rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary performs system checks to
    detect virtualization, sandbox, or analysis environments and then conceals, disengages, or aborts
    its malicious behavior so that it blends in with normal activity and evades automated and manual analysis.
    This evidence focuses on the condition that a process executes a command-line string or PowerShell
    script containing specific arguments or string literals known to be used for sandbox detection, such
    as querying for VMware MAC address prefixes (''00:05:69'',''00:0C:29'',''08:00:27'' for VirtualBox)
    or specific WMI classes (''SELECT * FROM Win32_Fan'', ''Win32_BIOS'', ''Win32_ComputerSystem''). This
    Symbolic Logic approach looks for the following signal: Continuously match Windows Event ID 4688 (Process
    Creation) command lines and 4104 (PowerShell Script Block) content against a watchlist of the exact
    strings/registry paths/WMI classes/MAC OUIs enumerated by the canonical anti-analysis tooling [Pafish](https://github.com/a0rtega/pafish)
    and [al-khaser](https://github.com/LordNoteworthy/al-khaser) (e.g., ''VBoxGuest'',''vmtoolsd'',''Win32_Fan'',''HARDWARE\\ACPI\\FADT\\VBOX'',
    CPUID hypervisor bit, MAC prefixes 00:05:69/00:0C:29/08:00:27). Keep these deterministic thresholds;
    tune the allowlist, do not delete. Emit a high-severity alert on any direct match. A positive result
    -- a deterministic rule match, a statistical outlier, or a model alert -- indicates a process is probing
    for virtualization/sandbox artifacts and may be keying its behavior to the environment (e.g., aborting
    or hiding payloads when analysis is detected); pivot to the responsible process, its parent lineage,
    the user/host context, the specific VM artifacts or checks touched, and whether expected follow-on
    (network/payload) activity is absent. A negative result helps reduce suspicion for this vector but
    should be corroborated with the other questions in this playbook, since a single method can miss obfuscated,
    renamed, or slow/low system-check activity.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All corporate endpoints, servers, and Virtual Desktop Infrastructure (VDI) instances.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Script detection rule

      source IN [Windows Event ID 4688, Windows Event ID 4104]

      | WHERE matches_action_criteria("Script detection rule")

      // Continuously match Windows Event ID 4688 (Process Creation) command lines and 4104 (PowerShell
      Script Block) content aga

      | ALERT enrich(host, user, process, parent, file, dest)'
