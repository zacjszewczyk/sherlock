name: 'T1037: Boot or Logon Initialization Scripts'
id: 0cd59be7-04ef-42e1-b967-db83ee32fca0
description: Investigate adversary abuse of boot or logon initialization scripts (MITRE ATT&CK T1037)
  for both persistence and privilege escalation. Adversaries plant or modify scripts that run automatically
  at boot or logon -- Windows logon scripts (NETLOGON/SYSVOL GPO scripts, registry Run keys, UserInitMprLogonScript,
  Startup folder items), Linux shell-init files (~/.bashrc, ~/.bash_profile, ~/.profile, /etc/profile.d),
  macOS Startup Items/LaunchAgents/login hooks, ESXi rc.local.d scripts, and network-device startup-config
  -- to maintain a foothold across reboots and credential changes, and often to run in an elevated context.
  This playbook helps an analyst hunt for the creation or modification of these initialization artifacts
  by unauthorized accounts or processes, for suspicious child processes spawned by logon/startup hosts
  (unsigned binaries from user-writable paths, credential-dumping or escalation tooling, LSASS/SAM access,
  token elevation), for obfuscated or persistence-laden command lines, and for outbound C2 originating
  from script interpreters. It combines symbolic-logic detections, statistical rarity/frequency/entropy
  scoring, and machine-learning (provenance-graph and outlier) models across Windows, Linux, macOS, ESXi,
  and network-device telemetry.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
