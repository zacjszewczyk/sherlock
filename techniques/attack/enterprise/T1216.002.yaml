questions:
- question: Did wscript.exe or cscript.exe launch SyncAppvPublishingServer.vbs with a command line containing
    a semicolon (`;`) or the `n;` breakout pattern, especially alongside PowerShell tokens such as IEX,
    DownloadString, New-Object Net.WebClient, or -enc/-EncodedCommand?
  context: 'This is the core, high-fidelity abuse primitive for T1216.002. Legitimate App-V publishing
    invocations of SyncAppvPublishingServer.vbs never pass an arbitrary scripted payload, so any semicolon
    argument is anomalous and the `n;` pattern is the documented breakout used to smuggle PowerShell through
    the signed VBScript interpreter. Parse process-creation command lines for wscript.exe/cscript.exe
    running the script with a `;` argument; treat the bare semicolon as the minimum trigger and raise
    confidence when PowerShell download-cradle or encoded-command tokens are present. Because this maps
    to the Stealth tactic, a positive result indicates the adversary is deliberately blending in by proxying
    execution through a trusted/signed binary to bypass PowerShell restrictions and evade defenses; a
    negative result helps rule out this specific LOLBAS abuse. Validate logging coverage and tune with
    reproducible Atomic Red Team emulation. Sources: [SyncAppvPublishingServer VBS Execute Arbitrary PowerShell
    Code (Sigma rule), frack113](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_lolbin_syncappvpublishingserver_vbs_execute_psh.yml)
    [LOLBAS Project: SyncAppvPublishingServer.vbs](https://lolbas-project.github.io/lolbas/Scripts/Syncappvpublishingserver/)
    [Atomic Red Team T1216 tests, Red Canary](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1216/T1216.md)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4103
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: process IN (Win4688, Sysmon1) WHERE parent_or_image IN (wscript.exe, cscript.exe) AND command_line
      CONTAINS 'SyncAppvPublishingServer.vbs' AND (command_line MATCHES /;/ OR command_line MATCHES /n;/)
      | eval susp = command_line MATCHES /(?i)(iex|downloadstring|net\.webclient|-enc|-encodedcommand|invoke-expression)/
      | alert severity = if(susp, 'high', 'medium')
- question: When SyncAppvPublishingServer.vbs was invoked, what PowerShell content was actually executed
    once deobfuscated, and does the recovered script-block or AMSI content match download-cradle or in-memory
    execution primitives?
  context: 'Detecting the breakout pattern tells you proxying occurred; recovering the payload tells you
    what it did. Join the process-creation event (4688 / Sysmon 1) to PowerShell script-block logging
    (4104) and AMSI content on the same host within a tight time window so you capture the post-deobfuscation
    content that the VBScript handed to PowerShell. Alert when the deobfuscated content invokes download
    cradles (DownloadString, DownloadFile, Invoke-WebRequest), reflective/in-memory loading, or other
    execution primitives. Full command-line plus script-block logging is required for this to work. Under
    the Stealth tactic this exposes the concealed objective behind the trusted-binary proxy; a benign
    result (e.g., empty or administrative content) reduces suspicion. Sources: [Identifying and Mitigating
    Living Off the Land Techniques, CISA/NSA/FBI](https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4103
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: join (process IN (Win4688, Sysmon1) WHERE command_line CONTAINS 'SyncAppvPublishingServer.vbs')
      with (psh IN (Win4104, AMSI) ) ON host AND time_window <= 5s WHERE psh.script_block MATCHES /(?i)(downloadstring|downloadfile|invoke-webrequest|iex|reflection\.assembly|frombase64string|virtualalloc)/
      | alert 'Proxied PowerShell payload recovered' severity=high
- question: Is the SyncAppvPublishingServer.vbs command line statistically rare, unusually long, or high-entropy
    compared to a per-environment baseline, and does the embedded PowerShell deviate from a normal-corpus
    character/token profile?
  context: 'Legitimate invocation of this script is rare or entirely absent in most environments and,
    when present, short and stereotyped. Baseline the command-line tokens, argument length, and Shannon
    entropy over a 30-day window and alert on first-seen command lines, argument length above mean + 3
    sigma, or entropy in the top prevalence band. Derive the sigma cutoff per environment rather than
    hard-coding it. Separately, score the embedded PowerShell against a normal-corpus character/token
    baseline so obfuscated payloads deviate measurably. For the Stealth tactic, obfuscation and rarity
    are the adversary''s attempt to evade signature detection while looking ordinary; a strong statistical
    deviation flags concealment even when no single keyword matches. Sources: [Finding Anomalies in Windows
    Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)
    [Revoke-Obfuscation: PowerShell Obfuscation Detection and Evasion Using Science, Bohannon and Holmes](https://www.blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4103
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: events = process WHERE command_line CONTAINS 'SyncAppvPublishingServer.vbs' EARLIEST=-30d |
      eval arg_len = len(command_line), ent = shannon_entropy(command_line) | eventstats mean(arg_len)
      as mu, stdev(arg_len) as sd, count by host | where isfirstseen(command_line) OR arg_len > mu + 3*sd
      OR ent >= entropy_top_band | table host, user, command_line, arg_len, ent
- question: When an unsupervised or supervised model scores the wscript/cscript command line and the proxied
    PowerShell payload, do they surface as outliers, and which tokens or features drive that score?
  context: 'Static rules miss mutating LOLBin syntax, so model the command line with contextual embeddings
    feeding unsupervised outlier detectors (COPOD, Isolation Forest, PCA, autoencoders) and surface the
    top-3 contributing tokens (e.g., semicolon breakout, DownloadString, encoded blob) directly in the
    alert text for explainability. Keep the model current against evolving syntax with analyst-in-the-loop
    active learning. Independently classify the AMSI/script-block payload using hybrid text/token/AST
    features with XGBoost feature-importance explanations, or contextual embeddings over AMSI-captured
    content. Within the Stealth tactic this catches deliberately obfuscated proxy abuse that evades keyword
    rules; the explanation features let an analyst quickly confirm whether the outlier is true LOTL activity.
    Sources: [BERT Embeddings: A New Approach for Command Line Anomaly Detection, CrowdStrike](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/)
    [Living-Off-The-Land Command Detection Using Active Learning, Ongun et al.](https://arxiv.org/abs/2111.15039)
    [Effective Method for Detecting Malicious PowerShell Scripts Based on Hybrid Features, Fang et al.](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099)
    [AMSI-Based Detection of Malicious PowerShell Code Using Contextual Embeddings, Hendler, Kels, and
    Rubin](https://arxiv.org/pdf/1905.09538)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4103
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: X = embed(command_line for events WHERE command_line CONTAINS 'SyncAppvPublishingServer.vbs')
      score = ensemble([COPOD, IsolationForest, PCA, Autoencoder]).decision_function(X) | where score
      >= outlier_threshold | explain top3_tokens(X) | THEN classify(script_block) with XGBoost(text+token+AST
      features) report top3_features
- question: Did SyncAppvPublishingServer.vbs (via wscript.exe/cscript.exe) spawn a child process such
    as powershell.exe, pwsh.exe, cmd.exe, bitsadmin.exe, certutil.exe, mshta.exe, or rundll32.exe?
  context: 'Legitimate App-V publishing through this script does not spawn command interpreters or download
    utilities, so any such child process is a strong indicator the signed VBScript is being used to hand
    off execution to a follow-on payload. Correlate process-creation parent-child records (4688 / Sysmon
    1) where the parent chain includes SyncAppvPublishingServer.vbs and the child is an interpreter or
    LOLBin. Under the Stealth tactic this reveals the pivot from a trusted-looking script into active
    execution; a positive result is high-confidence proxy abuse, while no suspicious children weakens
    the hypothesis. Sources: [LOLBins Abuse: How to Detect LOLBins Abuse in the Wild, Red Canary](https://redcanary.com/blog/threat-detection/lolbins-abuse/)
    [Identifying and Mitigating Living Off the Land Techniques, CISA/NSA/FBI](https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers'
