    Correlate process-creation records (4688 / Sysmon 1) for SyncAppvPublishingServer.vbs with Zeek conn.log
    and dns.log within a short time window and alert when the destination IP, domain, or DNS query appears
    on a threat-intelligence blocklist. Under the Stealth tactic this directly links the trusted-binary
    proxy execution to adversary-controlled infrastructure, giving the analyst a defensible, high-confidence
    detection; absence of a blocklist match does not clear the host but redirects effort to the statistical
    and ML methods. Sources: [Identifying and Mitigating Living Off the Land Techniques, CISA/NSA/FBI](https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques)
    [LOLBins Abuse: How to Detect LOLBins Abuse in the Wild, Red Canary](https://redcanary.com/blog/threat-detection/lolbins-abuse/)'
