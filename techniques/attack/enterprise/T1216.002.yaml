  - technology: SIEM/Rule pseudocode
    query: process IN (Win4688, Sysmon1) WHERE parent_command_line CONTAINS 'SyncAppvPublishingServer.vbs'
      AND parent_image IN (wscript.exe, cscript.exe) AND child_image IN (powershell.exe, pwsh.exe, cmd.exe,
      bitsadmin.exe, certutil.exe, mshta.exe, rundll32.exe) | alert 'App-V helper spawned interpreter/LOLBin'
      severity=high
- question: How prevalent is each parent-child pairing descending from SyncAppvPublishingServer.vbs across
    hosts, users, and roles, and is the observed child first-seen or seen on only a small fraction of
    hosts?
  context: 'Build host-, user-, and role-scoped prevalence baselines of SyncAppvPublishingServer.vbs child
    processes and flag first-seen or low-prevalence pairs, weighting children seen on only a small fraction
    of hosts most heavily. Use mean + k sigma over a 30-day count window to set the rare-child threshold
    per environment. Frequency analysis exposes the rarity that characterizes targeted LOTL abuse versus
    broad benign tooling. For the Stealth tactic, an adversary blending into a trusted process still produces
    statistically rare lineage; a rare child elevates concern even if the child binary itself is otherwise
    common. Sources: [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)
    [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: pairs = process WHERE parent_command_line CONTAINS 'SyncAppvPublishingServer.vbs' EARLIEST=-30d
      | stats dc(host) as host_count, count by parent_image, child_image, user, role | eval host_frac
      = host_count / total_hosts | where isfirstseen(parent_image+child_image) OR host_frac <= rare_band
      OR count > mean+k*sigma
- question: When process-execution event sequences are modeled, does the lineage following SyncAppvPublishingServer.vbs
    (rare child, unexpected ordering, or downstream network step) score as a low-probability sequence?
  context: 'Model process-execution event sequences with an LSTM so an anomalous lineage following SyncAppvPublishingServer.vbs
    scores as a low-probability sequence and the divergent step is surfaced for triage. For multi-stage
    chains, apply a temporal graph neural network over whole-system provenance to detect anomalous wscript
    -> vbs -> PowerShell -> network subgraphs and reconstruct the attack graph. Under the Stealth tactic,
    this captures the staged execution chain that the adversary tries to disguise as routine App-V activity;
    the reconstructed subgraph gives the analyst the full proxy-to-egress story. Sources: [DeepLog: Anomaly
    Detection and Diagnosis from System Logs through Deep Learning, Du et al.](https://doi.org/10.1145/3133956.3134015)
    [KAIROS: Practical Intrusion Detection and Investigation using Whole-system Provenance, Cheng et al.](https://arxiv.org/html/2308.05034)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: seq = order_by_time(process_events per host) p = DeepLog_LSTM.predict_next(seq) | where observed_next
      NOT IN topK(p) AND seq CONTAINS 'SyncAppvPublishingServer.vbs' | THEN graph = provenance_subgraph(host,
      time) ; score = KAIROS_TGNN(graph) | where score >= anomaly_threshold | emit reconstructed_attack_graph
- question: Was SyncAppvPublishingServer.vbs executed from a path other than C:\Windows\System32, or as
    a renamed VBScript whose content matches the App-V helper, located in a user-writable directory (Downloads,
    AppData, Temp, ProgramData)?
  context: 'The canonical legitimate path for this script is fixed at C:\Windows\System32, so execution
    from any other location, or a renamed copy of the same script content in a user-writable directory,
    is a strong relocation/staging indicator. Create a detection rule on process-creation events where
    the command line references SyncAppvPublishingServer.vbs outside System32, or references a renamed
    script whose content matches the helper, in Downloads/AppData/Temp/ProgramData. For the Stealth tactic,
    adversaries relocate or rename LOLBAS scripts to evade path-based allow-listing while preserving the
    trusted behavior; a hit here strongly suggests deliberate evasion, whereas only-System32 execution
    is consistent with benign use. Sources: [LOLBAS Project: SyncAppvPublishingServer.vbs](https://lolbas-project.github.io/lolbas/Scripts/Syncappvpublishingserver/)
    [LOLBins Abuse: How to Detect LOLBins Abuse in the Wild, Red Canary](https://redcanary.com/blog/threat-detection/lolbins-abuse/)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: process IN (Win4688, Sysmon1) WHERE (command_line CONTAINS 'SyncAppvPublishingServer.vbs' AND
      NOT command_line MATCHES /(?i)C:\\Windows\\System32/) OR (script_content_hash IN appv_helper_hashes
      AND file_path MATCHES /(?i)(Downloads|AppData|Temp|ProgramData)/) | alert 'SyncAppvPublishingServer.vbs
      from non-System32 or renamed copy' severity=high
- question: How rare is the execution path and per-user/per-role usage of SyncAppvPublishingServer.vbs
    across the enterprise, and is the current host's execution count anomalous against a 90-day baseline?
  context: 'Count script execution paths and per-user/per-role usage across the enterprise and alert on
    first-seen locations or paths in the lowest prevalence band. Compare per-host execution counts against
    a 90-day baseline using mean + k sigma to derive the cutoff. Frequency analysis and standard-deviation
    baselining surface the rare path/usage that indicates staging or abuse by an atypical user or role.
    Within the Stealth tactic, an adversary operating from a non-administrative account or unusual host
    produces low-prevalence usage even when the binary is trusted; rarity here is the tell. Sources: [Using
    Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)
    [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ev = process WHERE command_line CONTAINS 'SyncAppvPublishingServer.vbs' EARLIEST=-90d | stats
      count by file_path, user, role, host | eval path_frac = dc_hosts(file_path)/total_hosts | where
      isfirstseen(file_path) OR path_frac <= rare_band OR count > mean+k*sigma
- question: When a supervised model evaluates path depth, directory tokens, signer/hash mismatch, user-profile
    flags, and host role, does it classify the execution as a dropped or relocated copy rather than legitimate
    App-V administration?
  context: 'Train a classifier on path depth, directory tokens, signer/hash mismatch, user-profile flags,
    and host role to distinguish legitimate App-V administration from dropped or relocated copies, reporting
    the top-3 contributing features in the alert and keeping labels current with active learning. This
    generalizes beyond a fixed path rule to recognize the contextual fingerprint of staging. For the Stealth
    tactic, the model captures subtle evasions (renames, near-System32 lookalike paths, mismatched signers)
    that a single rule would miss, and the feature explanations let the analyst validate the verdict.
    Sources: [Living-Off-The-Land Command Detection Using Active Learning, Ongun et al.](https://arxiv.org/abs/2111.15039)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'feats = [path_depth, dir_tokens, signer_mismatch, hash_mismatch, user_profile_flags, host_role]
      label = classifier.predict(feats)  # legit_appv vs dropped/relocated | where label == ''dropped/relocated''
      AND proba >= threshold | report top3_feature_importance(feats) ; update_with(active_learning)'
- question: Within a short window after SyncAppvPublishingServer.vbs executed, did the host connect to
    or resolve a destination IP, domain, or name that matches threat intelligence or known-bad reputation?
  context: 'Correlating execution to network egress is core living-off-the-land detection guidance. Join
    the SyncAppvPublishingServer.vbs process events with Zeek conn.log and dns.log on the source host
    within a short window (e.g., 60 seconds), then alert when the destination IP, domain, or resolved
    name matches threat intelligence or known-bad reputation. Under the Stealth tactic, the value is in
    tying the concealed proxy execution to the actual payload-retrieval or C2 endpoint; a reputation match
    converts a suspicious execution into a confirmed malicious chain, while clean destinations argue for
    benign or internal activity. Sources: [Identifying and Mitigating Living Off the Land Techniques,
    CISA/NSA/FBI](https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points; DNS Servers; All Windows Endpoints and Servers'
  range: Last 90 days; correlate process events to network events within a 60-second window
  queries:
  - technology: SIEM/Rule pseudocode
    query: join (process WHERE command_line CONTAINS 'SyncAppvPublishingServer.vbs') as p with (zeek_conn,
      zeek_dns) as n ON p.host == n.src_host AND n.ts BETWEEN p.ts AND p.ts+60s WHERE n.dest_ip IN ti_blocklist
      OR n.query IN ti_domains OR reputation(n.dest) == 'bad' | alert 'Proxied execution -> known-bad
      destination' severity=high
- question: After SyncAppvPublishingServer.vbs runs, do destination port, country, domain age/entropy,
    outbound byte volume, connection rate, or resolution-failure counts (NXDOMAIN, RST/blocked, HTTP 4xx)
    exceed the host's baseline?
  context: 'Establish per-host baselines for destination port, country, domain age/entropy, outbound byte
    volume, connection count per minute, and explicitly profile failure rates (NXDOMAIN, RST/blocked connections,
    HTTP 4xx) after SyncAppvPublishingServer.vbs runs. Alert when the destination is rare for the host
    or when volume, frequency, domain entropy, or failed-resolution counts exceed mean + 3 sigma of the
    baseline. For the Stealth tactic, payload retrieval and C2 often differ statistically from normal
    traffic even when the destination is not yet on a blocklist; high domain entropy or bursts of failed
    resolutions are classic signs of algorithmically generated or dead-drop infrastructure. Elevated metrics
    support the abuse hypothesis; baseline-normal traffic weakens it. Sources: [Using Frequency Analysis
    to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)
    [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points; DNS Servers; All Windows Endpoints and Servers'
  range: Last 90 days; evaluate network metrics in the window following each execution
  queries:
  - technology: SIEM/Stats pseudocode
    query: post = network WHERE src_host IN (hosts running SyncAppvPublishingServer.vbs) AND ts AFTER
      exec_ts | stats sum(bytes_out) as vol, count as conns, dc(dest) by host, dest_port, dest_country
      | eval ent = domain_entropy(query), fail = count(nxdomain|rst|http_4xx) | where dest rare_for(host)
      OR vol > mu+3sd OR conns > mu+3sd OR ent > mu+3sd OR fail > mu+3sd
- question: Do sequence/time-series models of outbound bytes, connection counts, and DNS query/failure
    rates after SyncAppvPublishingServer.vbs execution show sustained spikes or irregular bursts indicative
    of follow-on activity?
  context: 'Apply time-series/sequence anomaly detection to outbound bytes, connection counts, and DNS
    query (and failure) rates after SyncAppvPublishingServer.vbs execution, treating sustained spikes
    or irregular bursts as low-probability follow-on activity and reporting the contributing metric. This
    captures beaconing, staged download bursts, or exfiltration patterns that simple thresholds miss.
    Within the Stealth tactic, adversaries pace traffic to blend in, so modeling the temporal shape of
    egress after the proxy event reveals the anomaly; the contributing-metric report focuses the analyst
    on what changed. Sources: [DeepLog: Anomaly Detection and Diagnosis from System Logs through Deep
    Learning, Du et al.](https://doi.org/10.1145/3133956.3134015)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points; DNS Servers; All Windows Endpoints and Servers'
  range: Last 90 days; window network time series around each execution event
  queries:
  - technology: ML/pseudocode
    query: ts = series(bytes_out, conn_count, dns_query_rate, dns_fail_rate) per host AFTER exec_ts p
      = DeepLog/seq_anomaly.score(ts) | where p <= low_prob_threshold | emit contributing_metric, window
      | alert 'Anomalous follow-on egress burst'
- question: Can you correlate SyncAppvPublishingServer.vbs process events with Zeek conn.log/dns.log within
