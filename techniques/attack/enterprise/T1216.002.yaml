- question: Against a 30-day baseline of destinations, ports, transfer volumes, and connection/resolution
    failures associated with SyncAppvPublishingServer.vbs, which connections are first-seen, on uncommon
    ports, in the lowest prevalence band, or show abnormal NXDOMAIN/blocked rates?
  context: 'Build a 30-day baseline of destinations, ports, transfer volumes, and connection/resolution
    failures associated with SyncAppvPublishingServer.vbs, then flag connections that are first-seen,
    use uncommon ports, sit in the lowest prevalence band, or show abnormal NXDOMAIN/blocked-connection
    rates. This catches malicious egress that is not yet in threat intel by leaning on rarity and failure
    patterns. For the Stealth tactic, novel or rarely-used infrastructure and abnormal failure rates betray
