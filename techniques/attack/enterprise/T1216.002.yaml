name: 'T1216.002: System Script Proxy Execution: SyncAppvPublishingServer'
id: df12770e-40ce-4dd5-bb9d-ec5d24337ec5
description: Investigate suspected abuse of the Microsoft-signed SyncAppvPublishingServer.vbs App-V helper
  script to proxy execution of malicious PowerShell and other follow-on payloads, a living-off-the-land
  (LOTL) defense-evasion technique. This playbook helps an analyst determine whether wscript.exe or cscript.exe
  launched SyncAppvPublishingServer.vbs with the semicolon / `n;` breakout pattern carrying embedded PowerShell,
  whether the script spawned interpreters or download/LOLBin utilities, whether it ran from an unexpected
  path or as a renamed copy, and whether the execution was followed by suspicious network egress (rare
  destinations, high domain entropy, anomalous transfer volume, or resolution failures) consistent with
  payload retrieval or command-and-control rather than legitimate App-V publishing. It combines high-fidelity
  symbolic-logic rules, per-environment statistical baselining, and machine-learning classification across
  process-creation, PowerShell script-block, and network telemetry so the analyst can confirm or refute
  proxied execution and reconstruct the full attack chain.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
