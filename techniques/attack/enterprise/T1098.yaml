- question: 'Using statistical baselining, can you determine whether the approach ''For each successful
    account modification event'' reveals Account Manipulation supporting Persistence (TA0003)? Specifically:
    For each successful account modification event, extract the source IP. Join with historical login
    data for the target user; flag modifications from IPs in the 99th percentile of rarity, scoring genuinely
    first-seen (subject,source-IP) pairs with the Bayesian new-edge model of [Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf).
    Separately, compute Shannon entropy of source countries over a 24-hour window and alert when it exceeds
    a dynamically calculated baseline by 3 standard deviations.'
