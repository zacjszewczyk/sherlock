questions:
- question: 'Using deterministic rule logic, can you determine whether the approach ''Create a rule to
    correlate the'' reveals Account Manipulation supporting Persistence (TA0003)? Specifically: Create
    a rule to correlate the ''Source Network Address'' from Windows Event IDs 4738 and 4724 against a
    threat intelligence feed of known malicious IPs, such as TOR exit nodes or known C2 servers. Trigger
    a high-priority alert on any match and use the source IP to pivot into Zeek conn.log to investigate
    the full scope of network activity. Use the deterministic field logic and thresholds modeled in [Splunk
    Security Content](https://research.splunk.com/).'
  context: 'Tactic context (Persistence / TA0003): adversaries manipulate accounts to maintain a persistent
    foothold on victim systems. Evidence under investigation: A successful account modification event,
    such as a password reset or property change, originates from a source IP address present on a threat
    intelligence feed of known malicious IPs or anonymizing services. Approach (Create a rule to correlate
    the): Create a rule to correlate the ''Source Network Address'' from Windows Event IDs 4738 and 4724
    against a threat intelligence feed of known malicious IPs, such as TOR exit nodes or known C2 servers.
    Trigger a high-priority alert on any match and use the source IP to pivot into Zeek conn.log to investigate
    the full scope of network activity. Use the deterministic field logic and thresholds modeled in [Splunk
    Security Content](https://research.splunk.com/). A positive result indicates an account modification
    consistent with adversary persistence or privilege escalation and should be triaged immediately by
    pivoting to the subject account, source host/IP, originating process, and any downstream authentication
    or access; a negative result means the activity matches the established baseline of authorized administrative
    behavior. Investigate the named area of interest (Domain Controllers, Authentication Servers, Internet
    Gateway).'
  answer_sources:
  - Windows Event ID 4738
  - Windows Event ID 4724
  - Zeek conn.log
  - 'NAI: Domain Controllers, Authentication Servers, Internet Gateway'
  range: Last 90 days
