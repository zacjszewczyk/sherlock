    query: "// Deterministic detection for: Create a rule to correlate the\n// Create a rule to correlate\
      \ the 'Source Network Address' from Windows Event IDs 4738 and 4724 against a threat intelligence\
      \ feed of known malicious IPs, such as TOR exit nodes or known C2 servers. Trigger a high-priority\
      \ alert on any match and use the source IP to pivot into Zeek conn.log to investigate the full scope\
      \ of network activity. Use the deterministic field logic and thresholds modeled in [Splunk Security\
