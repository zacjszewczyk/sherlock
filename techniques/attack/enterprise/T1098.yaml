name: 'T1098: Account Manipulation'
id: 4168fc6b-1ac5-465b-9c69-10dfba278308
description: 'This playbook helps an analyst investigate Account Manipulation (T1098): adversary actions
  that preserve or elevate access to a compromised account by modifying its credentials, attributes, permissions,
  or group memberships across Windows/Active Directory, Linux, macOS, cloud IaaS, Identity Providers,
  SaaS, Office Suite, ESXi, and containers. It supports two missions: confirming persistence (TA0003)
  where attackers keep a foothold by resetting passwords, setting ''DONT_EXPIRE_PASSWD''/''PASSWD_NOTREQD''
  flags, reviving dormant or former-employee accounts, removing or resetting MFA factors, and adding long-lived
  credentials (client secrets, certificates, access keys) to service principals and IAM users; and confirming
  privilege escalation (TA0004) where attackers add accounts to privileged groups, create-then-promote
  new accounts, tamper with critical AD object DACLs (nTSecurityDescriptor on AdminSDHolder or Domain
  Admins), and grant high-privilege cloud/IdP roles. Investigative angles span Windows Security events
  (4738, 4724, 4720, 4728/4732/4756, 4739, 4688, 5136, 4670, 4625, 4771), Sysmon/auditd process and file
  telemetry, Zeek conn.log network context, and cloud audit logs (Entra ID, AWS CloudTrail, Okta System
  Log, M365 Unified). Detection blends symbolic-logic correlation rules, statistical baselining (percentiles,
  entropy, change-point detection, first-seen/rare-edge scoring), and machine learning (Isolation Forest,
  K-Means, DBSCAN, HMM, gradient boosting, graph neural networks) to produce explainable, evasion-resistant
  alerts.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
