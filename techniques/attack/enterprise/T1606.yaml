- question: Graph and Markov navigation modeling — An authenticated session exhibits behavior that deviates
    from the user's or their peer group's established baseline, such as accessing a novel set of URLs,
    performing high-privilege actions for the first time, or showing non-human request timing.
  context: 'Evidence: An authenticated session exhibits behavior that deviates from the user''s or their
    peer group''s established baseline, such as accessing a novel set of URLs, performing high-privilege
    actions for the first time, or showing non-human request timing. This addresses the Credential Access
    tactic by detecting forged web credentials. Method (Machine Learning): Train per-user/role Markov
    models and flag low-probability transitions; in parallel score the authentication graph so a forged
    credential creating a novel/low-probability (principal, resource) edge is flagged via link prediction
    ([CyberGraph, Bowman et al.](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf);
    [Euler, King and Huang](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf)) or
    as a login path with no causal source ([Hopper, Ho et al.](https://www.usenix.org/system/files/sec21-ho.pdf)).
    Emit the top-3 contributing edges/transitions.'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Windows Event ID 4624
  - 'NAI: Internal Application Servers, SaaS Platforms, Database Servers, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'MODEL = per_user/role Markov(url transitions)

      ALERT low-prob transitions

      SCORE auth_graph link_prediction: novel (principal,resource) edge OR login path w/ no causal source

      EMIT top3 edges/transitions'
- question: Allow-list STS callers — Temporary IaaS credentials are minted via STS operations (AssumeRole,
    AssumeRoleWithSAML, GetFederationToken, GetSessionToken) by an unusual principal, from an unusual
    source IP/region, or at an abnormal rate, and the resulting temporary credentials are then used from
    a new ASN/region.
  context: 'Evidence: Temporary IaaS credentials are minted via STS operations (AssumeRole, AssumeRoleWithSAML,
    GetFederationToken, GetSessionToken) by an unusual principal, from an unusual source IP/region, or
    at an abnormal rate, and the resulting temporary credentials are then used from a new ASN/region.
    This addresses the Credential Access tactic by detecting forged web credentials. Method (Symbolic
    Logic): Maintain an allow-list of principals that normally call GetFederationToken/AssumeRole/AssumeRoleWithSAML
