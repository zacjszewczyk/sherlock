questions:
- question: Match sessions to credential abuse infrastructure — A web session is established from a source
    IP address present on a threat intelligence feed for credential abuse, or the session's HTTP cookie
    contains a value matching a known malicious signature.
  context: 'Evidence: A web session is established from a source IP address present on a threat intelligence
    feed for credential abuse, or the session''s HTTP cookie contains a value matching a known malicious
    signature. This addresses the Credential Access tactic by detecting forged web credentials. Method
    (Symbolic Logic): Compare Zeek conn.log source IPs and HTTP Cookie/Authorization header values against
    threat intelligence of credential-abuse/fake-cookie infrastructure and alert on exact matches; keep
    this deterministic allow/deny match. Profile the per-source-IP 401/403 failure rate as a distinct
    failure-mode signal—forged-cookie probing produces bursts of auth failures before a success ([Who
    Are You?, Freeman et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/who-are-you-statistical-approach-measuring-user-authenticity.pdf)).
    For Credential Access, a forged session reuses adversary infrastructure or known-bad cookie signatures,
    so a deterministic TI match is high-fidelity. Positive: a source IP or Cookie/Authorization value
    matches credential-abuse/fake-cookie intelligence, or a single source IP shows a burst of 401/403
    failures immediately before a success (forged-cookie probing). Negative: no TI hit and a normal failure
    rate — do not clear the session on this signal alone; corroborate with the entropy and ML checks.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Internet Gateway, Web Proxies, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT conn.id, http.cookie, http.authorization, conn.id_orig_h\n  FROM zeek_conn JOIN zeek_http\
      \ USING(uid)\n  WHERE id_orig_h IN (threat_intel.credential_abuse_ips)\n     OR http.cookie_value\
      \ IN (threat_intel.malicious_cookie_sigs)\n  | UNION per_src_ip: rate(status IN (401,403)) AS fail_rate\
      \ -> alert on burst-before-success"
- question: Identify cookie volume/entropy outliers — A web session is established from a source IP address
    present on a threat intelligence feed for credential abuse, or the session's HTTP cookie contains
    a value matching a known malicious signature.
  context: 'Evidence: A web session is established from a source IP address present on a threat intelligence
    feed for credential abuse, or the session''s HTTP cookie contains a value matching a known malicious
    signature. This addresses the Credential Access tactic by detecting forged web credentials. Method
    (Statistical Method): Baseline cookie length, byte-frequency distribution, and Shannon entropy per
    application and flag sessions exceeding 3 standard deviations or with a Mahalanobis distance above
    the learned per-app/per-length profile; oversized or high-entropy forged tokens deviate from the legitimate
    cookie baseline ([PAYL, Wang and Stolfo](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11)).
    Derive thresholds per application from 30 days of clean traffic. Forged tokens are crafted, not minted
    by the app, so they deviate from the legitimate cookie shape. Positive: a cookie whose length, byte-frequency
    distribution, or Shannon entropy exceeds 3 standard deviations (or a high Mahalanobis distance) from
    the per-application profile learned over 30 days of clean traffic — typically oversized or high-entropy.
    Negative: cookies that fall inside the per-app baseline. Re-baseline per application to avoid false
    positives from apps with naturally long tokens.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Internet Gateway, Web Proxies, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'BASELINE per app: mean/std(cookie_len), byte_freq, shannon_entropy over 30d clean

      FOR each session: flag IF cookie_len|entropy > mean+3*std OR mahalanobis(profile) > threshold'
- question: Score sessions with Random Forest — A web session is established from a source IP address
    present on a threat intelligence feed for credential abuse, or the session's HTTP cookie contains
    a value matching a known malicious signature.
  context: 'Evidence: A web session is established from a source IP address present on a threat intelligence
    feed for credential abuse, or the session''s HTTP cookie contains a value matching a known malicious
    signature. This addresses the Credential Access tactic by detecting forged web credentials. Method
    (Machine Learning): Train a Random Forest on http/conn features (TLS JA3/JA4 vs reported User-Agent
    consistency, header order, timing, ASN, geo) to flag forged sessions, since all self-reported browser
    attributes are forgeable and only cross-layer consistency is robust ([Gummy Browsers, Liu et al.](https://arxiv.org/abs/2110.10129)).
    Emit the top-3 contributing features (e.g., JA3/UA mismatch, rare ASN, abnormal cookie size) in the
    alert. Because every self-reported browser attribute is forgeable, only cross-layer consistency is
    robust. Positive: a high forged-probability score driven by features such as a TLS JA3/JA4-vs-User-Agent
    mismatch, a rare ASN, or an abnormal cookie size (emit the top-3 contributors). Negative: a clean,
    consistent feature set. A normal-looking User-Agent alone is NOT exculpatory — weight the cross-layer
    (TLS-vs-claimed-browser) features.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Internet Gateway, Web Proxies, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'FEATURES = [ja3, ja4, user_agent, header_order, timing, asn, geo, cookie_size]

      MODEL = RandomForest.predict(features)

      ALERT IF p(forged) > t WITH top3_feature_importance(ja3_ua_mismatch, rare_asn, cookie_size)'
- question: Watch for known credential forging tools — A process is created with command-line arguments
    or parent/child relationships indicative of credential forging or the theft of signing keys (e.g.,
    ADFS private key, Zimbra preauth key).
  context: 'Evidence: A process is created with command-line arguments or parent/child relationships indicative
    of credential forging or the theft of signing keys (e.g., ADFS private key, Zimbra preauth key). This
    addresses the Credential Access tactic by detecting forged web credentials. Method (Symbolic Logic):
    Alert on Event ID 4688 / Sysmon 1 command lines or process names matching known credential-forging/signing-key
    utilities (e.g., shimit, AADInternals, mimikatz, ADFSdump) on AD FS, DC, and web-app servers; also
    alert on any process other than the AD FS service account reading the token-signing certificate/private
    key store ([Golden SAML, Reiner](https://www.cyberark.com/resources/threat-research-blog/golden-saml-newly-discovered-attack-technique-forges-authentication-to-cloud-apps);
    [Mandiant M365 backdoors](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/)).
    Keep this allow-list deterministic. On AD FS, DCs, and web-app servers (e.g., Zimbra) the appearance
    of forging/signing-key tooling is near-zero-baseline and high-fidelity. Positive: Event ID 4688 /
    Sysmon 1 command lines or process names matching shimit, AADInternals, mimikatz, or ADFSdump, OR any
    process other than the AD FS service account reading the token-signing certificate/private-key store.
    Negative: only the AD FS service account touches the key store and no known tooling runs. Keep the
    allow-list deterministic; renamed binaries can evade name matching, so pair with the behavioral checks.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Active Directory Federation Services (ADFS) Servers, Domain Controllers, Application Servers
    with web-facing components (e.g., Zimbra)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM win_4688, sysmon_1\nWHERE host IN (adfs, dc, webapp) AND (proc_name|cmdline ~ /shimit|AADInternals|mimikatz|ADFSdump/)\n\
      \   OR (file_read = token_signing_cert AND account != adfs_service_account)\n=> alert deterministic"
- question: Entropy spikes for process arguments — A process is created with command-line arguments or
    parent/child relationships indicative of credential forging or the theft of signing keys (e.g., ADFS
    private key, Zimbra preauth key).
  context: 'Evidence: A process is created with command-line arguments or parent/child relationships indicative
    of credential forging or the theft of signing keys (e.g., ADFS private key, Zimbra preauth key). This
    addresses the Credential Access tactic by detecting forged web credentials. Method (Statistical Method):
    Track per-host command-line entropy and per-service-account process-spawn frequency (count/min); flag
    entropy increases >3sigma or spawn-rate spikes above the 99th percentile for service accounts that
    normally run a fixed, low-cardinality set of binaries. Service accounts on these servers normally
    run a fixed, low-cardinality set of binaries, so deviation is suspicious. Positive: per-host command-line
    entropy rising >3 sigma, or a service-account process-spawn rate above the 99th percentile. Negative:
    stable, low-entropy, low-cardinality activity. Establish the per-service-account baseline first; a
    noisy interactive admin session can raise false positives.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Active Directory Federation Services (ADFS) Servers, Domain Controllers, Application Servers
    with web-facing components (e.g., Zimbra)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'PER host: track shannon_entropy(cmdline); PER service_account: count(spawn)/min

      ALERT IF entropy > mean+3*std OR spawn_rate > p99 for low-cardinality service accounts'
- question: Graph anomalies with parent-child modeling — A process is created with command-line arguments
    or parent/child relationships indicative of credential forging or the theft of signing keys (e.g.,
    ADFS private key, Zimbra preauth key).
  context: 'Evidence: A process is created with command-line arguments or parent/child relationships indicative
    of credential forging or the theft of signing keys (e.g., ADFS private key, Zimbra preauth key). This
    addresses the Credential Access tactic by detecting forged web credentials. Method (Machine Learning):
    Model process trees and flag low-probability chains such as the AD FS service spawning PowerShell/cmd
    and making crypto/registry calls; an out-of-context event in the learned per-host process-sequence
    model is anomalous ([DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)). Surface
    the top-3 anomalous events (parent, child, API) in the alert. Forging activity produces out-of-context
    process chains the host has never legitimately produced. Positive: a low-probability chain in the
    learned per-host process-sequence model — e.g., the AD FS service spawning PowerShell/cmd and making
    crypto/registry calls (emit the top-3 anomalous parent/child/API events). Negative: chains that score
    as expected under the host''s process-sequence model. Requires a clean training period; first-seen-but-benign
    maintenance chains will surface and need triage.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Active Directory Federation Services (ADFS) Servers, Domain Controllers, Application Servers
    with web-facing components (e.g., Zimbra)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'MODEL = per_host_process_sequence(parent->child->api)

      SCORE process_trees; ALERT low-prob chain e.g. adfs_service -> powershell/cmd -> crypto/registry

      EMIT top3 anomalous (parent, child, api)'
- question: Validate SAML issuer, signature, and wrapping — A SAML assertion is observed with one or more
    invalid or suspicious attributes, such as a non-approved issuer, an abnormally long validity period,
    a weak signature algorithm, or a mismatch between the assertion's recipient URL and the actual destination.
  context: 'Evidence: A SAML assertion is observed with one or more invalid or suspicious attributes,
    such as a non-approved issuer, an abnormally long validity period, a weak signature algorithm, or
    a mismatch between the assertion''s recipient URL and the actual destination. This addresses the Credential
    Access tactic by detecting forged web credentials. Method (Symbolic Logic): Extract SAML assertions
    from Zeek http.log/files.log, verify the Issuer/IssuerUri against an allow-list and the signature
    algorithm against an approved list, and enforce XML Signature Wrapping checks—the signed element must
    be the consumed element; alert on multiple Assertion/Response nodes, mismatched references/IDs, recipient/audience
    mismatch, deprecated algorithms, or unknown signing certificates ([On Breaking SAML, Somorovsky et
    al.](https://www.usenix.org/system/files/conference/usenixsecurity12/sec12-final91.pdf); [Golden SAML,
    Reiner](https://www.cyberark.com/resources/threat-research-blog/golden-saml-newly-discovered-attack-technique-forges-authentication-to-cloud-apps)).
    A forged or wrapped SAML assertion is the core artifact of Golden-SAML-style forging. Positive: an
    assertion whose Issuer/IssuerUri is not on the allow-list, uses a deprecated/weak signature algorithm
    or unknown signing certificate, contains multiple Assertion/Response nodes, has mismatched references/IDs,
    or a recipient/audience mismatch (the signed element must equal the consumed element). Negative: a
    single, allow-listed-issuer, correctly-signed assertion with matching recipient/audience. Any wrapping
    or issuer/cert anomaly is high-fidelity.'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Federation Gateways, Reverse Proxies, Cloud Application Security Brokers (CASB), Web Application
    Firewalls (WAF)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EXTRACT saml from zeek_http/files

      VERIFY issuer IN allowlist AND sig_alg IN approved_algs AND signed_element == consumed_element

      ALERT IF multiple Assertion/Response nodes OR ref/ID mismatch OR recipient/audience mismatch OR
      deprecated alg OR unknown cert'
- question: Detect outlier assertion lifetimes and sizes — A SAML assertion is observed with one or more
    invalid or suspicious attributes, such as a non-approved issuer, an abnormally long validity period,
    a weak signature algorithm, or a mismatch between the assertion's recipient URL and the actual destination.
  context: 'Evidence: A SAML assertion is observed with one or more invalid or suspicious attributes,
    such as a non-approved issuer, an abnormally long validity period, a weak signature algorithm, or
    a mismatch between the assertion''s recipient URL and the actual destination. This addresses the Credential
    Access tactic by detecting forged web credentials. Method (Statistical Method): Baseline assertion
    lifetimes (NotOnOrAfter - IssueInstant) and POST byte sizes per SP and flag those above the 99th percentile
    or beyond the learned byte-frequency profile; forged assertions frequently set abnormally long validity
    windows or carry padded claims ([PAYL, Wang and Stolfo](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11)).
    Forgers often set long validity windows so a token outlives normal sessions, and pad claims. Positive:
    an assertion lifetime (NotOnOrAfter - IssueInstant) or POST byte size above the per-SP 99th percentile,
    or a body beyond the learned byte-frequency profile. Negative: lifetime and size inside the per-SP
    norm. Baseline per Service Provider since legitimate lifetimes differ by app.'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Federation Gateways, Reverse Proxies, Cloud Application Security Brokers (CASB), Web Application
    Firewalls (WAF)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'BASELINE per SP: lifetime = NotOnOrAfter - IssueInstant; post_bytes

      ALERT IF lifetime > p99 OR post_bytes beyond byte_freq_profile'
- question: Autoencode SAML feature vectors — A SAML assertion is observed with one or more invalid or
    suspicious attributes, such as a non-approved issuer, an abnormally long validity period, a weak signature
    algorithm, or a mismatch between the assertion's recipient URL and the actual destination.
  context: 'Evidence: A SAML assertion is observed with one or more invalid or suspicious attributes,
    such as a non-approved issuer, an abnormally long validity period, a weak signature algorithm, or
    a mismatch between the assertion''s recipient URL and the actual destination. This addresses the Credential
    Access tactic by detecting forged web credentials. Method (Machine Learning): Train an autoencoder
    on parsed assertion vectors (issuer, audience, lifetime, claim set, algorithm, size) and flag high
    reconstruction error; report the top-3 reconstructed attributes driving the error so an analyst can
    see which fields are anomalous. An autoencoder trained on legitimate assertions reconstructs normal
    tokens with low error and struggles on forged ones. Positive: high reconstruction error, with the
    top-3 reconstructed attributes (issuer, audience, lifetime, claim set, algorithm, size) pointing to
    the anomalous fields. Negative: low reconstruction error. Tune the error threshold on clean data;
    concept drift after a legitimate IdP change requires retraining.'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Federation Gateways, Reverse Proxies, Cloud Application Security Brokers (CASB), Web Application
    Firewalls (WAF)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'VEC = [issuer, audience, lifetime, claim_set, alg, size]

      AE = autoencoder.reconstruct(VEC)

      ALERT IF reconstruction_error > t EMIT top3 attributes driving error'
- question: Correlate SP logins with IdP events — A successful SAML-based authentication at a Service
    Provider (SP) is not preceded by a corresponding successful authentication event at the Identity Provider
    (IdP) for the same user within a defined time window.
  context: 'Evidence: A successful SAML-based authentication at a Service Provider (SP) is not preceded
    by a corresponding successful authentication event at the Identity Provider (IdP) for the same user
    within a defined time window. This addresses the Credential Access tactic by detecting forged web
    credentials. Method (Symbolic Logic): Alert when an SP/SaaS successful login (or token usage) lacks
    a corresponding successful IdP authentication and MFA challenge for the same user within the prior
    10 minutes—forged tokens authenticate without ever touching the IdP ([CISA AA21-008A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa21-008a);
    [CISA AA20-352A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-352a)). Tune the window
    per environment; treat sign-ins flagged as not requiring MFA as a distinct state signal. Forged tokens
    authenticate directly at the SP without ever touching the IdP, breaking the expected IdP->SP pairing.
    Positive: an SP/SaaS successful login or token use with no corresponding successful IdP authentication
    and MFA challenge for the same user in the prior ~10 minutes (tune the window), or a sign-in flagged
    as not requiring MFA. Negative: every SP login has a preceding IdP+MFA event. This missing-precursor
    pattern is a primary forged-SAML indicator.'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 4624
  - 'NAI: ADFS Servers, Service Provider (SP) application servers, SIEM/Log Aggregator, Cloud Identity
    Provider'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each SP/SaaS successful_login(user, t):\n  IF NOT EXISTS idp_auth(user) WITH mfa IN [t-10min,\
      \ t] THEN alert\nFLAG sign-ins marked not_requiring_mfa as state signal"
- question: Monitor SP/IdP login ratio and failure state — A successful SAML-based authentication at a
    Service Provider (SP) is not preceded by a corresponding successful authentication event at the Identity
    Provider (IdP) for the same user within a defined time window.
  context: 'Evidence: A successful SAML-based authentication at a Service Provider (SP) is not preceded
    by a corresponding successful authentication event at the Identity Provider (IdP) for the same user
    within a defined time window. This addresses the Credential Access tactic by detecting forged web
    credentials. Method (Statistical Method): Calculate each user''s SP:IdP login ratio and flag deviations
    above the 95th percentile (a healthy ratio is ~1:1); separately profile the failed-MFA / interrupted-auth
    rate per user as a failure-mode signal, since forging skips MFA entirely. In a healthy federation
    each SP login maps roughly 1:1 to an IdP authentication; forging inflates SP logins relative to IdP
    events and skips MFA. Positive: a user''s SP:IdP ratio above the 95th percentile, or an elevated failed-MFA
    / interrupted-auth rate. Negative: a ~1:1 ratio and normal MFA completion. Service accounts and SSO
    session reuse can skew the ratio — exclude or baseline them separately.'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 4624
  - 'NAI: ADFS Servers, Service Provider (SP) application servers, SIEM/Log Aggregator, Cloud Identity
    Provider'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'PER user: ratio = count(sp_login)/count(idp_login)  (healthy ~1:1)

      ALERT IF ratio > p95

      PROFILE failed_mfa/interrupted_auth rate per user as failure-mode signal'
- question: Time-series anomaly detection for login pairs — A successful SAML-based authentication at
    a Service Provider (SP) is not preceded by a corresponding successful authentication event at the
    Identity Provider (IdP) for the same user within a defined time window.
  context: 'Evidence: A successful SAML-based authentication at a Service Provider (SP) is not preceded
    by a corresponding successful authentication event at the Identity Provider (IdP) for the same user
    within a defined time window. This addresses the Credential Access tactic by detecting forged web
    credentials. Method (Machine Learning): Train an LSTM log-key model on the ordered IdP/SP event stream
    and flag SP/SaaS logon events that appear without the expected preceding IdP authentication log key
    ([DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)). Surface the missing
    precursor event and user/SP in the alert. An LSTM log-key model learns the normal ordered sequence
    of IdP/SP events; forged access breaks that order. Positive: an SP/SaaS logon log key that appears
    without the expected preceding IdP-authentication log key (surface the missing precursor and user/SP).
    Negative: the SP event follows its expected IdP precursor. Requires a representative training stream;
    new SSO flows will need the model retrained.'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 4624
  - 'NAI: ADFS Servers, Service Provider (SP) application servers, SIEM/Log Aggregator, Cloud Identity
    Provider'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'MODEL = LSTM_log_key(ordered idp/sp event stream)

      ALERT IF sp_logon appears without expected preceding idp_auth log key

      EMIT missing precursor + user/SP'
- question: Detect impossible travel — A session cookie is used with a combination of attributes (e.g.,
    IP address, User-Agent, geolocation) that is inconsistent with the established behavioral profile
    for that user's sessions.
  context: 'Evidence: A session cookie is used with a combination of attributes (e.g., IP address, User-Agent,
    geolocation) that is inconsistent with the established behavioral profile for that user''s sessions.
    This addresses the Credential Access tactic by detecting forged web credentials. Method (Symbolic
    Logic): Flag sessions where reuse of the same cookie/token implies travel speeds >600 mph between
    geolocated Zeek conn.log source IPs, or where the same session token is observed concurrently from
    two distinct ASNs—forged-cookie reuse commonly appears alongside the legitimate session. Forged-cookie
    reuse commonly appears alongside the user''s legitimate session, producing geographically impossible
    concurrency. Positive: the same cookie/token implying travel >600 mph between geolocated source IPs,
    or the same session token seen concurrently from two distinct ASNs. Negative: session movement consistent
    with plausible travel and a single ASN. VPNs/mobile carriers can cause benign ASN shifts — corroborate
    before escalating.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Internet Gateway, Web Application Firewalls (WAF), User Endpoint Devices, Reverse Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR same cookie/token across sessions:\n  speed = geo_dist(ip1,ip2)/time_delta\n  ALERT IF\
      \ speed > 600mph OR same_token concurrent FROM 2 distinct ASNs"
- question: Score attribute rarity per user — A session cookie is used with a combination of attributes
    (e.g., IP address, User-Agent, geolocation) that is inconsistent with the established behavioral profile
    for that user's sessions.
  context: 'Evidence: A session cookie is used with a combination of attributes (e.g., IP address, User-Agent,
    geolocation) that is inconsistent with the established behavioral profile for that user''s sessions.
    This addresses the Credential Access tactic by detecting forged web credentials. Method (Statistical
    Method): Compute a smoothed likelihood ratio over the session''s IP, ASN, geolocation, and User-Agent
    against the user''s historical distribution and flag cumulative scores above the 98th percentile,
    handling novel values with population priors ([Who Are You?, Freeman et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/who-are-you-statistical-approach-measuring-user-authenticity.pdf)).
    Add a TLS JA3/JA4-vs-User-Agent consistency check since self-reported fields are forgeable ([Gummy
    Browsers, Liu et al.](https://arxiv.org/abs/2110.10129)). A forged session typically arrives with
    attribute combinations the user has never used. Positive: a smoothed likelihood ratio over IP, ASN,
    geolocation, and User-Agent that is rare against the user''s history (cumulative score above the 98th
    percentile), especially with a TLS JA3/JA4-vs-User-Agent inconsistency. Negative: attributes consistent
    with the user''s historical distribution. Use population priors so first-seen-but-benign values do
    not auto-fire.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Internet Gateway, Web Application Firewalls (WAF), User Endpoint Devices, Reverse Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SCORE = smoothed_likelihood_ratio(ip, asn, geo, user_agent | user_history) WITH population_priors

      ALERT IF cumulative_score > p98

      ADD ja3/ja4 vs user_agent consistency check'
- question: Cluster sessions and surface noise points — A session cookie is used with a combination of
    attributes (e.g., IP address, User-Agent, geolocation) that is inconsistent with the established behavioral
    profile for that user's sessions.
  context: 'Evidence: A session cookie is used with a combination of attributes (e.g., IP address, User-Agent,
    geolocation) that is inconsistent with the established behavioral profile for that user''s sessions.
    This addresses the Credential Access tactic by detecting forged web credentials. Method (Machine Learning):
    Apply DBSCAN to session feature vectors and investigate noise points; for each alert emit the top-3
    attributes (e.g., rare ASN, JA3 mismatch, new geo) that placed the session outside its cluster. Legitimate
    user sessions form dense clusters; forged sessions fall outside them as noise. Positive: a DBSCAN
    noise point, with the top-3 attributes (e.g., rare ASN, JA3 mismatch, new geo) that placed it outside
    its cluster. Negative: the session lands inside an established cluster. Choose eps/min_samples per
    user/app; sparse users naturally produce more noise points needing triage.'
  answer_sources:
