name: 'T1606: Forge Web Credentials'
id: ab05cd85-bc6c-4a37-baaa-3dc43cd63c55
description: 'Investigate whether an adversary is forging web credential materials (SAML assertions, OAuth/OIDC
  tokens, session cookies, or temporary cloud STS credentials) to gain unauthorized access to web applications,
  SaaS platforms, and cloud control planes while bypassing MFA and other authentication controls. This
  playbook helps an analyst hunt across network telemetry, endpoint process activity, identity-provider
  and SaaS audit logs, and cloud (IaaS) control-plane logs for the full forging chain: theft or misuse
  of signing/secret material (ADFS token-signing keys, Zimbra preauth keys, private keys), configuration
  changes that enable token forging (new signing certificates, claim-rule edits, federation/domain settings),
  the issuance or use of tokens/cookies that lack a corresponding IdP authentication or MFA event, and
  the downstream abuse of those forged credentials (anomalous sessions, impossible travel, high-privilege
  pivots, and novel principal-to-resource access). It combines deterministic symbolic-logic matching,
  statistical baselining, and machine-learning anomaly detection to surface forged-credential activity
  that legitimate, self-reported session attributes would otherwise hide.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
