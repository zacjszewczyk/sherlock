    Emit the top-3 contributing edges/transitions. Forged credentials create navigation and authentication
    edges the user/role has never legitimately produced. Positive: low-probability per-user/role Markov
    URL transitions, OR a novel/low-probability (principal, resource) edge flagged by link prediction,
    OR a login path with no causal source (emit the top-3 edges/transitions). Negative: transitions and
    edges consistent with the learned graph. Needs a clean baseline; org changes (new role duties) cause
    benign novel edges.'
