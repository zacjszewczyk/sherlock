name: 'T1033: System Owner-User Discovery'
id: 620bd300-ec8c-4f31-8ac3-214f2b17eed3
description: Investigate adversary System Owner/User Discovery (T1033), in which an actor identifies the
  primary user, currently logged-in user, common users, or active usage of a system to shape follow-on
  actions. This playbook helps an analyst hunt for execution of built-in user-discovery utilities (whoami,
  query user/quser, net user/group/localgroup, id, w, who, dscl, and network-device 'show users'/'show
  ssh') and dropped recon tooling, spawned from atypical parent processes, in non-interactive/scripting
  contexts, or in rapid bursts. It also covers correlated discovery-then-exfil behavior, anomalous management-plane
  access to network devices, and large-scale LDAP/MSRPC enumeration of Active Directory user and group
  objects. Detection approaches span symbolic logic (allow-lists, known-argument and atypical-parent rules),
  statistical baselining (prevalence, frequency, Z-score, entropy, session-profile percentiles), and machine
  learning (gradient-boosted file classifiers, command-line embeddings/outlier detection, time-series
  anomaly detection, clustering, and UEBA peer-group analysis) across Windows, Linux, macOS, and network-device
  telemetry.
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has any process executed on an endpoint whose file hash matches a curated threat-intelligence
    feed of hashes associated with user-discovery tooling such as Seatbelt, SharpHound/BloodHound, or
    ADRecon?
  context: In the Discovery (TA0007) phase an adversary frequently drops and runs compiled reconnaissance
    binaries to enumerate the primary or logged-in user. Native T1033 commands (whoami.exe, net.exe, quser.exe)
    are signed OS binaries with stable hashes, so a pure hash match best covers dropped/compiled recon
    tools rather than built-ins. Continuously compare file hashes from new process-creation events against
    an intel feed of known discovery-tool hashes and raise a high-severity alert on any match (per CAR-2013-07-001).
    A positive match is a strong signal of hands-on-keyboard reconnaissance; pair it with the command-line
    analytics below to catch the equivalent built-in utilities that will not match by hash.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint Devices (Workstations, Servers), Centralized Log Repository (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from process_creation

      where event_id in (4688, 1)

      join threat_intel_hashes ti on process.sha256 = ti.hash

      where ti.category in ("discovery_tool", "recon", "malware")

      alert severity=high msg="Known user-discovery tool hash executed"'
- question: Across the enterprise over a rolling 30-day window, which executed file hashes are rare (present
    on under 1% of endpoints) and not signed by a trusted publisher, and could these be dropped user-discovery
    tools?
  context: Reconnaissance tooling is typically rare and unsigned compared to legitimate enterprise software.
    For all executed file hashes, calculate prevalence across the fleet over a 30-day window and flag
    any executable that is not signed by a trusted publisher and appears on fewer than 1% of endpoints
    (rare-binary baseline), following the prevalence/frequency approach from Red Canary's LOLBins research.
    Record first-seen timestamp and the count of distinct hosts/users that executed the binary as volume
    context. A rare, unsigned binary that subsequently spawns user-enumeration activity is highly suspicious
    for T1033 discovery; a common, signed binary is likely benign.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint Devices (Workstations, Servers), Centralized Log Repository (SIEM)'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from process_creation

      where event_id in (4688, 1)

      stats dc(host) as host_count, min(_time) as first_seen, dc(user) as user_count by sha256, signer

      eval host_pct = host_count / total_hosts

      where host_pct < 0.01 and signer not in trusted_publishers

      sort host_pct asc'
- question: Do any newly observed executables score as malicious under a gradient-boosted classifier trained
    on file features (entropy, import/export tables, embedded strings like 'whoami', 'net user', 'dscl',
    'LookupAccountSid'), and which features drive that score?
  context: Static features distinguish discovery tooling from benign software even for never-before-seen
    samples. Use an explainable gradient-boosted classifier on file/string features (entropy, import/export
    tables, embedded strings such as 'whoami', 'net user', 'dscl', 'LookupAccountSid') from newly observed
    executables, as described in Mandiant's obfuscated command-line ML work. Surface the top-3 contributing
    features in the alert text so an analyst can validate the verdict, and triage high-confidence detections
    for immediate response. This supports T1033 discovery detection by catching custom or modified recon
    binaries that evade hash and prevalence checks.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint Devices (Workstations, Servers), Centralized Log Repository (SIEM)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = extract(entropy, imports, exports, strings) from new_executables

      score = gbm_classifier.predict_proba(features)

      explain = shap_top_k(gbm_classifier, features, k=3)

      where score >= 0.9

      alert msg="Suspected discovery binary" detail=explain'
- question: Was a built-in user/owner discovery command (whoami, query user/quser, net user/group/localgroup,
    id, w, who, 'dscl . list /Users', or network-device 'show users'/'show ssh') spawned by an atypical
    parent such as an Office app, browser, script host, or service process?
  context: Legitimate users rarely run user-discovery commands; when they do, the parent is typically
    an interactive shell. An adversary operating through a malicious document, exploit, or implant will
    spawn these commands from atypical parents like winword.exe, excel.exe, chrome.exe, wscript/cscript/powershell,
    or services.exe. Trigger when a discovery command (including whoami /priv or /groups privilege queries)
    is spawned by such a parent, combining the known-argument list from CAR-2013-07-001 and privilege-query
    logic from CAR-2021-02-002 with the atypical-parent logic of the SigmaHQ 'unusual parent for cmd.exe'
    rule. A match in the Discovery (TA0007) context strongly indicates automated post-exploitation reconnaissance.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Endpoint Devices (Workstations, Servers), Domain Controllers, Centralized Log Repository (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from process_creation\nwhere event_id in (4688, 1, 4104)\nwhere process.name in (\"whoami.exe\"\
      ,\"quser.exe\",\"query.exe\",\"net.exe\",\"id\",\"w\",\"who\",\"dscl\")\n   or command_line matches\
      \ (\"net user\",\"net group\",\"net localgroup\",\"show users\",\"show ssh\",\"whoami /priv\",\"\
      whoami /groups\")\nwhere parent.name in (\"winword.exe\",\"excel.exe\",\"powerpnt.exe\",\"chrome.exe\"\
      ,\"firefox.exe\",\"wscript.exe\",\"cscript.exe\",\"powershell.exe\",\"services.exe\")\nalert severity=high\
      \ msg=\"Discovery command from atypical parent\""
- question: For each user-host pair, does the per-hour count of discovery-command executions exceed the
    99th percentile (or Z-score > 3) of its 30-day baseline, and how many failed/AccessDenied discovery
    attempts occurred?
  context: 'Behavioral baselining catches living-off-the-land discovery that uses fully legitimate binaries.
    For each user-host pair, baseline discovery-command execution frequency over a 30-day rolling window
    and alert when the per-hour count exceeds the 99th percentile or a Z-score of 3, per CISA/NSA LOTL
    guidance and Red Canary''s per-host LOLBin baselining. Track state explicitly: count failed/AccessDenied
    discovery attempts (e.g., ''net user'' against unknown accounts or denied ''who'') as a distinct probing
    signal. A burst well above baseline, especially with many failed attempts, indicates active enumeration
    during Discovery (TA0007) rather than routine administration.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Endpoint Devices (Workstations, Servers), Domain Controllers, Centralized Log Repository (SIEM)'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from process_creation

      where is_discovery_command(command_line)

      bin _time span=1h

      stats count as cmd_count, sum(access_denied) as failed by user, host, _time

      eventstats avg(cmd_count) as mu, stdev(cmd_count) as sd by user, host

      eval z = (cmd_count - mu) / sd

      where z > 3 or cmd_count > percentile99(cmd_count)'
- question: Do unsupervised command-line embeddings flag low-probability discovery command sequences (e.g.,
    a whoami/net/query command immediately following a document open or web download), or obfuscated variants
    of these commands?
  context: Adversaries chain and obfuscate discovery commands in ways that differ statistically from administrator
    behavior. Train unsupervised command-line embeddings on first-party process telemetry and score new
    commands with outlier detectors (Isolation Forest, COPOD, PCA, autoencoder), as in CrowdStrike's BERT
    command-line work, and detect obfuscated whoami/net/query variants with ELECTRA-style small language
    models (Tran et al). Flag low-probability sequences such as a discovery command directly following
    a document open or web download, and surface the top-3 contributing tokens/features in the alert.
    Such sequences are characteristic of T1033 reconnaissance immediately after initial access.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Endpoint Devices (Workstations, Servers), Domain Controllers, Centralized Log Repository (SIEM)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'emb = commandline_embedder.transform(recent_commands)

      score = isolation_forest.decision_function(emb)

      obf = electra_obfuscation_model.predict(recent_commands)

      where score < anomaly_threshold or obf == ''obfuscated''

      where preceding_event in (''document_open'',''web_download'')

      alert detail=top_k_tokens(emb, k=3)'
- question: Did a single host execute three or more unique user-discovery commands within a five-minute
    window, immediately followed (within one minute) by an outbound connection to a low-reputation IP
    or non-standard port (not 80/443/53)?
  context: A burst of distinct discovery commands followed by an outbound connection is a classic recon-then-beacon
    pattern. Trigger a correlated alert when a single host runs three or more unique user/owner discovery
    commands (e.g., whoami, query user, net user) within five minutes, followed within one minute by an
    outbound connection in Zeek conn.log to a low-reputation external IP or a non-standard port (not 80/443/53).
    The multi-command burst maps to the recon argument set in CAR-2013-07-001. In Discovery (TA0007) this
    indicates an implant gathering user context and reporting it to a C2 channel; a benign result is isolated
    admin activity with no suspicious egress.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - Zeek conn.log
  - 'NAI: Endpoint Devices (Workstations, Servers), Network Egress Points, Centralized Log Repository
    (SIEM)'
  range: Last 90 days; correlate within a 5-minute command window and 1-minute egress window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from process_creation\nwhere is_discovery_command(command_line)\nstats dc(command_line) as\
      \ unique_cmds, min(_time) as t0, max(_time) as t1 by host, window=5m\nwhere unique_cmds >= 3\njoin\
      \ conn on host where conn._time between t1 and t1+1m\n   and (conn.dest_ip in low_reputation or\
      \ conn.dest_port not in (80,443,53))\nalert severity=critical msg=\"Discovery burst followed by\
      \ suspicious egress\""
- question: For each host, is the daily Z-score of total discovery-command executions above 3 against
    its 90-day baseline while outbound destination-port entropy and command-string rarity are also anomalously
    high?
  context: Combining volume, rarity, and egress-entropy signals reduces false positives from busy admin
    hosts. For each host, compute a daily Z-score of total discovery-command executions against its 90-day
    mean/std (volume), compute command-string rarity via BM25/log-entropy weighting (SCADE) and Shannon
    entropy of command lines (Elastic), and measure destination-port entropy of outbound traffic. Alert
    when the command-count Z-score exceeds 3 and destination-port entropy is anomalously high, and profile
    the count of blocked/failed outbound connections as a distinct failure-mode signal. Concurrent spikes
    across these dimensions point to scripted T1033 discovery feeding data exfiltration or C2.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - Zeek conn.log
  - 'NAI: Endpoint Devices (Workstations, Servers), Network Egress Points, Centralized Log Repository
    (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from process_creation

      where is_discovery_command(command_line)

      bin _time span=1d

      stats count as cmd_count by host, _time

      eventstats avg(cmd_count) as mu, stdev(cmd_count) as sd by host

      eval z=(cmd_count-mu)/sd

      join conn_entropy on host, _time

      where z > 3 and dest_port_entropy > entropy_threshold'
- question: Does time-series anomaly detection (Seasonal-Hybrid ESD) on enterprise-wide discovery-commands-per-minute
    reveal significant positive spikes, and do per-host feature vectors score as outliers under Isolation
    Forest?
  context: Enterprise-wide spikes and per-host outliers expose coordinated or automated discovery campaigns.
    Apply time-series anomaly detection (Seasonal-Hybrid ESD) to the enterprise-wide count of discovery
    commands per minute and flag significant positive spikes; alternatively score per-host discovery feature
    vectors (command count, unique commands, parent rarity, fail rate, port entropy) with Isolation Forest
    (Liu et al). Enrich flagged windows with connection data to identify contributing hosts that also
    made suspicious outbound connections, and report the top-3 features driving the anomaly score. This
    catches T1033 discovery that is distributed across many hosts to stay below per-host thresholds.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - Zeek conn.log
  - 'NAI: Endpoint Devices (Workstations, Servers), Network Egress Points, Centralized Log Repository
    (SIEM)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'series = count(discovery_commands) per minute over enterprise

      spikes = s_h_esd(series, period=1440)

      host_vec = features(cmd_count, unique_cmds, parent_rarity, fail_rate, port_entropy) per host

      scores = isolation_forest.score(host_vec)

      where spikes.is_anomaly or scores < threshold

      enrich with conn.log; report top_3_features'
- question: Did any connection reach a network device's management interface on port 22 (SSH) or 23 (Telnet)
    from a source not on the administrative allow-list, or did 'show users'/'show ssh' execute from an
    unexpected session?
  context: Network devices are high-value targets, and management access should come only from known admin
    workstations/subnets. Maintain an explicit allow-list of authorized administrative sources and generate
    a critical alert for any connection to a network device on port 22/23 from a source not on the list,
    and for execution of 'show users'/'show ssh' from an unexpected session, consistent with CISA/NSA
    LOTL baselining. Track failed/denied AAA logons as a distinct probing signal. In Discovery (TA0007)
    an adversary uses these CLI commands to enumerate logged-in users on routers and switches; an off-allow-list
    source is a strong indicator of compromise.
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - 'NAI: Network Infrastructure (Switches, Routers, Firewalls), Management Network Segment, Network Security
    Monitoring (NSM) Sensor Grid'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from conn

      where dest_ip in network_devices and dest_port in (22, 23)

      where src_ip not in admin_allowlist

      alert severity=critical msg="Unauthorized network-device management access"

      # also: device syslog where command in (''show users'',''show ssh'') and session unexpected

      # track aaa_denied logons as probing signal'
- question: In Zeek ssh.log, which authenticated sessions to network devices fall in the bottom 5th percentile
    for both duration (<5s) and bytes transferred (<500B), indicating a scripted 'login-run command-logout'
    pattern?
  context: Automated discovery against network devices produces very short, low-byte sessions distinct
    from interactive administration. From Zeek ssh.log, profile session duration and total bytes transferred
    for authenticated sessions to network devices and flag sessions in the bottom 5th percentile for both
    duration (<5s) and bytes (<500B) — the signature of a scripted login, single command (e.g., 'show
    users'), and logout. Also baseline per-source-IP session frequency and the ratio of failed to successful
    authentications as state. Such micro-sessions, especially in bursts from one source, indicate automated
    T1033 enumeration of device users.
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - 'NAI: Network Infrastructure (Switches, Routers, Firewalls), Management Network Segment, Network Security
    Monitoring (NSM) Sensor Grid'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'from ssh

      where dest_ip in network_devices and auth_success=true

      eval dur=duration, bytes=orig_bytes+resp_bytes

      where dur < percentile5(dur) and bytes < percentile5(bytes)

      stats count by src_ip

      # also baseline failed/success auth ratio per src_ip'
- question: Do SSH session feature vectors (source IP/port, duration, bytes, auth method, success/fail)
    to network devices cluster as anomalous outliers under Isolation Forest or DBSCAN relative to normal
    administrative clusters?
  context: Clustering reveals administrative sessions that do not fit any normal pattern. Score SSH session
    feature vectors (source IP, source port, duration, bytes, auth method, success/fail) with Isolation
    Forest (Liu et al) or cluster with DBSCAN to identify normal administrative clusters, treating outliers
    or sparse-cluster members as anomalous. Contextualize anomalous device access against structural access
    baselines (Siadati and Memon) and surface the top-3 contributing features in the alert. In Discovery
    (TA0007) this exposes an adversary whose access to a network device deviates from the established
    admin behavior even when individual fields look plausible.
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - 'NAI: Network Infrastructure (Switches, Routers, Firewalls), Management Network Segment, Network Security
    Monitoring (NSM) Sensor Grid'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'vec = features(src_ip, src_port, duration, bytes, auth_method, success) from ssh sessions
      to devices

      clusters = dbscan(vec)

      scores = isolation_forest.score(vec)

      where cluster == noise or scores < threshold

      alert detail=top_3_features(vec)'
- question: Did a non-Domain-Controller host execute 'net user /domain' or 'net group /domain', or did
    a single account generate more than 100 Event ID 4662 'operation on an object' events for user/group
    objects on a DC within one minute?
  context: Bulk directory enumeration is a hallmark of AD reconnaissance. Generate an alert when a non-DC
    host executes 'net user /domain' or 'net group /domain', or when a single account generates more than
    100 Event ID 4662 events for user/group objects on a DC within one minute. These directory-enumeration
    arguments extend the recon set in CAR-2013-07-001. Track Event ID 4662 access-failures separately
    as a distinct probing/state signal. In Discovery (TA0007) this behavior indicates an actor mapping
    domain users and groups to plan privilege escalation and lateral movement; legitimate enumeration
    of this scale typically originates only from DCs or sanctioned tooling.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4662
  - Zeek conn.log
  - Zeek ldap.log
  - 'NAI: Domain Controllers, Member Servers, Centralized Log Repository (SIEM), Network Security Monitoring
    (NSM) Sensor Grid'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from process_creation

      where command_line matches ("net user /domain","net group /domain") and host not in domain_controllers

      alert msg="Domain enumeration from non-DC host"

      union

      from security where event_id=4662 and object_type in (user, group)

      stats count as c, sum(access_denied) as failed by account, window=1m

      where c > 100

      alert msg="Bulk 4662 object access"'
- question: Using Zeek ldap.log (or EID 4662), which source IPs query a number of unique AD user/group
    objects exceeding 4σ above the cross-source mean in a 10-minute sliding window, and what is their
    failed-vs-successful bind ratio?
  context: Statistical baselining of LDAP query diversity isolates accounts performing wholesale enumeration.
    Using Zeek ldap.log (or EID 4662), track unique user/group objects queried per source IP in a 10-minute
    sliding window (volume), compute a moving average and standard deviation across source IPs, and flag
    any IP whose query count exceeds 4σ above the mean. Baseline failed versus successful LDAP binds/queries
    as a state signal, consistent with CISA/NSA LOTL guidance. A source querying far more distinct objects
    than its peers, especially with elevated failures, indicates T1033/AD discovery rather than normal
    application LDAP traffic.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4662
  - Zeek conn.log
  - Zeek ldap.log
  - 'NAI: Domain Controllers, Member Servers, Centralized Log Repository (SIEM), Network Security Monitoring
    (NSM) Sensor Grid'
  range: Last 90 days; evaluate in 10-minute sliding windows
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'from ldap

      where object_type in (user, group)

      bin _time span=10m sliding

      stats dc(object) as unique_objs, sum(result_failed) as failed, sum(result_ok) as ok by src_ip, _time

      eventstats avg(unique_objs) as mu, stdev(unique_objs) as sd

      where unique_objs > mu + 4*sd'
- question: Through peer-group analysis clustering users by AD role attributes, which accounts deviate
    from their cohort's normal LDAP query volume/diversity, and how does the enumeration fit a known attack
    path?
  context: Peer-group (UEBA) analysis catches enumeration that is anomalous only relative to a user's
    role. Cluster users on AD role attributes and model normal LDAP query volume/diversity per cohort
    (Microsoft Sentinel UEBA), detect deviations with Isolation Forest (Liu et al) or one-class SVM, place
    enumeration in attack-path context using path inference (Hopper, Ho et al), and surface the top-3
    deviating features (query volume, attributes requested, object types) in the alert. In Discovery (TA0007)
    this identifies an account whose directory queries far exceed what its role requires — a strong indicator
    of compromised credentials being used to map the domain.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4662
  - Zeek conn.log
  - Zeek ldap.log
  - 'NAI: Domain Controllers, Member Servers, Centralized Log Repository (SIEM), Network Security Monitoring
    (NSM) Sensor Grid'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'cohorts = cluster(users, features=ad_role_attributes)

      model = per_cohort_baseline(ldap_query_volume, ldap_query_diversity)

      scores = isolation_forest.score(user_features) within cohort

      where scores < threshold

      enrich with attack_path_inference(account)

      alert detail=top_3_deviating_features'
