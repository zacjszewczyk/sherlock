- question: 'Using statistical baselining and frequency/anomaly analysis, can we identify when a process
    not typically associated with debugging or system management (e.g., a web browser, office application)
    creates a remote thread in another, unrelated process, and how would we do this on the User Workstations,
    Terminal Servers (NAI)? Detection approach: Create a frequency table of all SourceImage/TargetImage
    remote-thread pairs and compute a rarity score (1/frequency); alert on scores above a defined threshold.
    Prevalence-gate the source binary to suppress rare-but-benign software.'
