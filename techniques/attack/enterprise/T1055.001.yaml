- question: 'Using a trained machine-learning model, can we identify when a process not typically associated
    with debugging or system management (e.g., a web browser, office application) creates a remote thread
    in another, unrelated process, and how would we do this on the User Workstations, Terminal Servers
    (NAI)? Detection approach: Model processes as nodes and remote-thread creations as directed edges;
    use node/edge-level provenance-graph learning to find anomalous edges or subgraphs versus the enterprise''s
    normal process-interaction graph, and trace the specific malicious nodes for explainability.'
