- question: 'Using deterministic detection logic, can we identify when a process creates a remote thread
    in another process with a higher integrity level (e.g., ''Medium'' integrity source creating a thread
    in a ''High'' or ''System'' integrity target), and how would we do this on the User Workstations,
    Terminal Servers, Domain Controllers (NAI)? Detection approach: Create a rule to trigger on any Sysmon
    Event ID 8 (Create Remote Thread) where ''SourceProcessIntegrityLevel'' is ''Medium'' or ''Low'' and
    ''TargetProcessIntegrityLevel'' is ''High'' or ''System'', excluding known benign source/target pairs.
    Legitimate cross-process thread creation is rare, giving this event high detection value.'
  context: 'This question advances the information requirement ''Is the adversary attempting to escalate
    privileges using process injection? (PIR)'' within the Stealth (TA0005) tactic, where DLL injection
    is used to blend malicious code into a legitimate, trusted process and evade process-based defenses.
    Create a rule to trigger on any Sysmon Event ID 8 (Create Remote Thread) where ''SourceProcessIntegrityLevel''
    is ''Medium'' or ''Low'' and ''TargetProcessIntegrityLevel'' is ''High'' or ''System'', excluding
    known benign source/target pairs. Legitimate cross-process thread creation is rare, giving this event
    high detection value ([The Sysmon Community Guide: CreateRemoteThread (Event ID 8)](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md)).
    This is a deterministic, rule-based check: it fires when the specified field conditions are met, so
