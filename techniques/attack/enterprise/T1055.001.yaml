    privileges. Analyze the time delta between process memory access (EID 10) and remote thread creation
    (EID 8) for the same source/target pairs. The delta distribution has a long tail; events in the lowest
    percentile (< 1st percentile, typically sub-second) represent a tightly coupled, suspicious sequence.
    Derive the cutoff from your environment''s observed delta distribution ([A Novel Approach to Detect
    Malware Based on API Call Sequence Analysis](https://journals.sagepub.com/doi/full/10.1155/2015/659101)).
