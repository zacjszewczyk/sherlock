    applications (NAI)? Detection approach: Analyze the time delta between process memory access (EID
    10) and remote thread creation (EID 8) for the same source/target pairs. The delta distribution has
    a long tail; events in the lowest percentile (< 1st percentile, typically sub-second) represent a
    tightly coupled, suspicious sequence. Derive the cutoff from your environment''s observed delta distribution.'
