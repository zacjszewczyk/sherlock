- question: 'Using statistical baselining and frequency/anomaly analysis, can we identify when a source
    process obtains memory write access to a target process and, within a sub-second timeframe, creates
    a remote thread in the same target process (the canonical inject API chain linked by a single memory
    address), and how would we do this on the User Workstations, Domain Controllers, Servers hosting sensitive
    applications (NAI)? Detection approach: Analyze the time delta between process memory access (EID
    10) and remote thread creation (EID 8) for the same source/target pairs. The delta distribution has
    a long tail; events in the lowest percentile (< 1st percentile, typically sub-second) represent a
    tightly coupled, suspicious sequence. Derive the cutoff from your environment''s observed delta distribution.'
  context: 'This question advances the information requirement ''Is the adversary attempting to escalate
