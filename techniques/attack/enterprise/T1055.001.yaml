name: 'T1055.001: Process Injection: Dynamic-link Library Injection'
id: 619ae607-03ff-49ff-94e9-c72368dce0c7
description: 'This playbook helps an analyst investigate DLL (dynamic-link library) injection (T1055.001),
  in which an adversary executes arbitrary code inside the address space of a separate, live process to
  evade process-based defenses and potentially elevate privileges. It covers the full injection tradecraft
  chain on Windows hosts: malicious or rare/unsigned DLLs loaded into privileged and trusted processes
  (including module stomping/overloading where internal metadata mismatches the on-disk file), reflective/memory-only
  loads with null ImageLoaded paths, the canonical VirtualAllocEx -> WriteProcessMemory -> CreateRemoteThread
  API chain (correlating ProcessAccess and CreateRemoteThread events, including low-to-high integrity
  remote threads and failed/denied access bursts), DLL loads from user-writable or network paths, rundll32-based
  and anomalous parent-child process creation, and post-injection C2 network behavior observed in Zeek.
  For each behavior the playbook offers deterministic rule logic, statistical baselining, and machine-learning
  approaches so an analyst can confirm or rule out DLL injection used for stealth and privilege escalation.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0004
  tactic_name: Privilege Escalation
