- question: 'Using deterministic detection logic, can we identify when a source process obtains memory
    write access to a target process and, within a sub-second timeframe, creates a remote thread in the
    same target process (the canonical inject API chain linked by a single memory address), and how would
    we do this on the User Workstations, Domain Controllers, Servers hosting sensitive applications (NAI)?
    Detection approach: Correlate Sysmon Event ID 10 (Process Access) and Event ID 8 (Create Remote Thread):
    alert when the same ''SourceImage''/''TargetImage'' pair appears in both within a 1-second window
    and ''GrantedAccess'' contains memory-modification flags (0x20 PROCESS_VM_WRITE, 0x40 PROCESS_VM_OPERATION,
    0x1F0FFF/0x1F1FFF PROCESS_ALL_ACCESS). Requiring the allocation->write->execute chain linked by a
    unified memory address minimizes false positives.'
