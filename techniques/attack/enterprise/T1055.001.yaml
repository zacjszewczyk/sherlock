    query: 'index=sysmon EventCode=7

      | stats count AS total, sum(eval(Signed=="false")) AS unsigned by Image, Computer

      | eval ratio=unsigned/total

      | eventstats perc99(ratio) AS p99 by Image

      | where ratio > p99'
- question: 'Using a trained machine-learning model, can we identify when a high-integrity system process
