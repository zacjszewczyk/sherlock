- question: 'Using statistical baselining and frequency/anomaly analysis, can we identify when following
    the load of an anomalous DLL, the parent process initiates network connections to a destination with
    a low reputation score, uses a non-standard port, or exhibits periodic, ''heartbeat''-like traffic
    patterns consistent with C2 communication, and how would we do this on the Network Egress Points,
    DNS Servers, User Workstations (NAI)? Detection approach: Failure Mode Awareness — after a suspicious
    load, profile failed connections and DNS NXDOMAIN rates from the process. A spike in failed/refused
    connections or NXDOMAIN responses (e.g., > 3 standard deviations above the host baseline) indicates
    dead C2/DGA activity and is a distinct injection-followup signal.'
