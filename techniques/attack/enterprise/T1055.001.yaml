questions:
- question: 'Using deterministic detection logic, can we identify when a DLL loaded by a process has a
    file hash that matches a known malicious indicator from a threat intelligence source, or is rare/never-before-seen
    for a privileged process, and how would we do this on the Domain Controllers, Critical Application
    Servers, Standard User Endpoints (NAI)? Detection approach: Continuously monitor Sysmon Event ID 7
    (Image Load) events. Correlate the ''Hashes'' field (e.g., SHA256) of the loaded DLL (''ImageLoaded'')
    against a high-confidence threat intelligence feed. Generate a high-priority alert on any match. Module-load
    anomalies are a durable injection signal.'
  context: 'This question advances the information requirement ''Is the adversary attempting to escalate
    privileges using process injection? (PIR)'' within the Stealth (TA0005) tactic, where DLL injection
    is used to blend malicious code into a legitimate, trusted process and evade process-based defenses.
    Continuously monitor Sysmon Event ID 7 (Image Load) events. Correlate the ''Hashes'' field (e.g.,
    SHA256) of the loaded DLL (''ImageLoaded'') against a high-confidence threat intelligence feed. Generate
    a high-priority alert on any match. Module-load anomalies are a durable injection signal ([Process
    Injection (T1055) - Red Canary Threat Detection Report](https://redcanary.com/threat-detection-report/techniques/process-injection/)).
    This is a deterministic, rule-based check: it fires when the specified field conditions are met, so
    it is high-fidelity but only as good as its allow-lists and exclusions; tune carefully to avoid alert
    fatigue. Concentrate collection and triage on the Domain Controllers, Critical Application Servers,
    Standard User Endpoints (NAI). A positive result—a confirmed indicator match or a statistically/behaviorally
    significant deviation from the established baseline—is a strong sign of DLL injection and should be
    escalated and corroborated with the host''s surrounding process, module-load, and network activity;
    a negative result lowers but does not eliminate the hypothesis, since adversaries rotate injection
    techniques (reflective loading, module stomping, in-memory execution), so pair this with the other
    questions in the playbook.'
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=sysmon EventCode=7

      | lookup ti_feed sha256 AS Hashes OUTPUT verdict

      | where verdict="malicious" OR is_rare(ImageLoaded, Image)

      | table _time, Computer, Image, ImageLoaded, Hashes'
- question: 'Using statistical baselining and frequency/anomaly analysis, can we identify when a DLL loaded
    by a process has a file hash that matches a known malicious indicator from a threat intelligence source,
    or is rare/never-before-seen for a privileged process, and how would we do this on the Domain Controllers,
    Critical Application Servers, Standard User Endpoints (NAI)? Detection approach: For privileged processes
    (e.g., lsass.exe, winlogon.exe), build an enterprise-wide prevalence baseline of all normally loaded
    DLLs using fleet frequency analysis. Alert on the loading of a statistically rare or never-before-seen
    DLL (Volume: count of hosts loading the module; an event in the bottom 1st percentile / loaded on
    <0.1% of hosts warrants investigation). Derive the threshold from your fleet''s DLL prevalence distribution.'
  context: 'This question advances the information requirement ''Is the adversary attempting to escalate
    privileges using process injection? (PIR)'' within the Stealth (TA0005) tactic, where DLL injection
    is used to blend malicious code into a legitimate, trusted process and evade process-based defenses.
    For privileged processes (e.g., lsass.exe, winlogon.exe), build an enterprise-wide prevalence baseline
    of all normally loaded DLLs using fleet frequency analysis. Alert on the loading of a statistically
    rare or never-before-seen DLL (Volume: count of hosts loading the module; an event in the bottom 1st
    percentile / loaded on <0.1% of hosts warrants investigation). Derive the threshold from your fleet''s
    DLL prevalence distribution ([Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)).
    This is a statistical/baseline approach: it learns what is normal for the fleet, host, or process
    and flags rare or anomalous deviations, so thresholds must be derived from your own environment''s
    distribution. Concentrate collection and triage on the Domain Controllers, Critical Application Servers,
    Standard User Endpoints (NAI). A positive result—a confirmed indicator match or a statistically/behaviorally
    significant deviation from the established baseline—is a strong sign of DLL injection and should be
    escalated and corroborated with the host''s surrounding process, module-load, and network activity;
    a negative result lowers but does not eliminate the hypothesis, since adversaries rotate injection
    techniques (reflective loading, module stomping, in-memory execution), so pair this with the other
    questions in the playbook.'
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=sysmon EventCode=7 Image IN ("lsass.exe","winlogon.exe")

      | stats dc(Computer) AS hosts by ImageLoaded

      | eval pct=hosts/total_hosts

      | where pct < 0.001  // rare / never-before-seen DLL for privileged proc'
- question: 'Using a trained machine-learning model, can we identify when a DLL loaded by a process has
    a file hash that matches a known malicious indicator from a threat intelligence source, or is rare/never-before-seen
    for a privileged process, and how would we do this on the Domain Controllers, Critical Application
    Servers, Standard User Endpoints (NAI)? Detection approach: Train a classification model (e.g., Random
    Forest or CNN-GRU) on features from Sysmon Event ID 7 (parent/target process, DLL signature status,
    path entropy/length) and API-sequence context. Score each load and, per explainability requirement,
    surface the top-3 contributing features (e.g., ''unsigned'', ''user-writable path'', ''rare module'')
    in the alert text.'
  context: 'This question advances the information requirement ''Is the adversary attempting to escalate
    privileges using process injection? (PIR)'' within the Stealth (TA0005) tactic, where DLL injection
    is used to blend malicious code into a legitimate, trusted process and evade process-based defenses.
    Train a classification model (e.g., Random Forest or CNN-GRU) on features from Sysmon Event ID 7 (parent/target
    process, DLL signature status, path entropy/length) and API-sequence context. Score each load and,
    per explainability requirement, surface the top-3 contributing features (e.g., ''unsigned'', ''user-writable
    path'', ''rare module'') in the alert text ([A hybrid CNN-GRU model with XAI-Driven interpretability
    using LIME and SHAP for static analysis in malware detection](https://peerj.com/articles/cs-3258/)).
    This is a machine-learning approach: it scores events against a learned model of benign behavior and
    should surface the top contributing features so an analyst can validate the verdict and avoid opaque
    alerts. Concentrate collection and triage on the Domain Controllers, Critical Application Servers,
    Standard User Endpoints (NAI). A positive result—a confirmed indicator match or a statistically/behaviorally
    significant deviation from the established baseline—is a strong sign of DLL injection and should be
    escalated and corroborated with the host''s surrounding process, module-load, and network activity;
    a negative result lowers but does not eliminate the hypothesis, since adversaries rotate injection
    techniques (reflective loading, module stomping, in-memory execution), so pair this with the other
    questions in the playbook.'
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Classifier (RandomForest/CNN-GRU) on EID7 + API-sequence features

      feat := vec(ParentImage, TargetImage, Signed, path_entropy, path_len)

      p := clf.predict_proba(feat)

      alert if p > thr; surface top-3 SHAP features'
