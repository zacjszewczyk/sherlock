    query: "index=sysmon EventCode=8\n| where SourceProcessIntegrityLevel IN (\"Low\",\"Medium\")\n  \
      \     AND TargetProcessIntegrityLevel IN (\"High\",\"System\")\n| search NOT [ inputlookup benign_remotethread_pairs\
      \ ]\n| table _time, Computer, SourceImage, TargetImage, SourceProcessIntegrityLevel, TargetProcessIntegrityLevel"
- question: 'Using statistical baselining and frequency/anomaly analysis, can we identify when a process
    creates a remote thread in another process with a higher integrity level (e.g., ''Medium'' integrity
    source creating a thread in a ''High'' or ''System'' integrity target), and how would we do this on
    the User Workstations, Terminal Servers, Domain Controllers (NAI)? Detection approach: Build a frequency
    distribution of all source-target process pairs for remote thread creation. Alert on pairs that are
    statistically rare (Frequency: occur < 5 times in 30 days enterprise-wide) and involve an integrity-level
    increase. Gate by global file prevalence of the source to suppress benign rare software.'
