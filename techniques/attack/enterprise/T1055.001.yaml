- question: 'Using statistical baselining and frequency/anomaly analysis, can we identify when a privileged
    system process (e.g., svchost.exe, lsass.exe) loads a DLL from a non-standard or user-writable file
    path (e.g., ''C:\Users\*'', ''C:\Windows\Temp\*'', ''\\network\share\*''), and how would we do this
    on the File Servers, User Workstations, Application Servers (NAI)? Detection approach: For each system-critical
    process, build a baseline of legitimate DLL load paths and compute path/filename Shannon entropy per
    new load. Alert when entropy exceeds the per-process baseline (e.g., > 3 standard deviations above
    mean), indicating randomized paths. Combine with fleet prevalence so rare-path loads are prioritized.'
