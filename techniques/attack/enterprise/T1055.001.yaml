    from the process. A spike in failed/refused connections or NXDOMAIN responses (e.g., > 3 standard
    deviations above the host baseline) indicates dead C2/DGA activity and is a distinct injection-followup
    signal ([Novel Detection of Process Injection Using Network Anomalies](https://www.akamai.com/blog/security-research/novel-detection-methodology-process-injection-using-network-anomalies)).
