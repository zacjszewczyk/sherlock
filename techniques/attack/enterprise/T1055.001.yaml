- question: 'Using statistical baselining and frequency/anomaly analysis, can we identify when a commonly
    trusted process (e.g., explorer.exe, svchost.exe) loads a DLL whose file hash matches a known malicious
    indicator or whose file path is associated with adversarial tools, and how would we do this on the
