- question: 'Using deterministic detection logic, can we identify when following the load of an anomalous
    DLL, the parent process initiates network connections to a destination with a low reputation score,
    uses a non-standard port, or exhibits periodic, ''heartbeat''-like traffic patterns consistent with
    C2 communication, and how would we do this on the Network Egress Points, DNS Servers, User Workstations
