- question: 'Using statistical baselining and frequency/anomaly analysis, can we identify when a high-integrity
    system process loads a DLL that is not digitally signed, or a DLL where the internal ''OriginalFileName''
    metadata does not match its on-disk filename, and how would we do this on the Domain Controllers,
    Critical Application Servers, Standard User Endpoints (NAI)? Detection approach: Calculate the percentage
    (ratio) of unsigned DLLs loaded by each process across the enterprise. Establish a per-process baseline
    and use a Z-score or percentile threshold (> 99th percentile) to detect processes that suddenly load
    an anomalously high proportion of unsigned DLLs (Volume/State metric). Derive thresholds from each
    process''s own signed/unsigned ratio distribution.'
