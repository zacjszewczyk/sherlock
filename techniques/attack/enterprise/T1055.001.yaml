  queries:
  - technology: Zeek/pseudocode
    query: '// Profile failed connections + NXDOMAIN per source host after a suspicious DLL load

      conn := load conn.log; dns := load dns.log

      fails := count(conn where conn_state in {S0,REJ,RSTO}) by orig_h, 1h

      nx := count(dns where rcode_name=="NXDOMAIN") by orig_h, 1h

      baseline := mean+3*stddev(fails over last 30d) by orig_h

      alert if fails > baseline OR nx > mean+3*stddev(nx baseline)'
