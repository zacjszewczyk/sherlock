- question: Within 60 minutes of a temporary privilege escalation, does a logging/defense-tampering event
    occur for the same identity/host - Windows Event ID 1102 (audit log cleared), CloudTrail StopLogging/DeleteTrail/PutEventSelectors,
    or command lines like wevtutil cl Security or Set-MpPreference -DisableRealtimeMonitoring $true?
  context: Attackers who just escalated often disable logging or security tooling to evade detection.
    High-priority alert on Windows Event ID 1102 ('audit log cleared'), CloudTrail StopLogging/DeleteTrail/PutEventSelectors
    (logging disablement), or Windows Event ID 4688 command lines containing wevtutil cl Security or Set-MpPreference
    -DisableRealtimeMonitoring $true, especially within 60 minutes of an elevation event for the same
    identity/host. A positive result is logging/defense tampering tightly following elevation - a strong
    compound indicator. For Privilege Escalation, this links newly gained privileges to their immediate
    misuse to blind defenders.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1102
  - AWS CloudTrail (StopLogging, DeleteTrail, PutEventSelectors)
  - 'NAI: Cloud compute instances (VMs), container orchestration platforms, and centralized logging systems.'
  range: Last 90 days; correlate within 60 minutes of an elevation event
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'tamper = (win_1102) or (cloudtrail in (''StopLogging'',''DeleteTrail'',''PutEventSelectors''))
      or (win_4688.CommandLine matches /wevtutil cl Security|Set-MpPreference -DisableRealtimeMonitoring
      \$true/)

      join elevation_events on (identity or host) where tamper.time within [elev.time, elev.time+60m]

      | alert PRIORITY=high'
- question: Is the time delta between a temporary access grant and a subsequent defense-evasion event
    for the same identity/host below a threshold (e.g., 60 minutes), indicating a strong temporal link?
  context: 'Rapid post-elevation tampering is consistent with minutes-scale intrusion chains. Compute
    the time delta between a temporary access grant and a subsequent defense-evasion event for the same
    identity/host; alert when the delta is below a threshold (e.g., 60 minutes). A small delta indicates
    the two events are likely part of one operation; a positive result is escalation closely followed
    by evasion. For Privilege Escalation, a short delta strengthens the inference that the escalation
    was adversarial and is being actively exploited. References: [Sysdig''s 8-minute intrusion](https://www.sysdig.com/blog/ai-assisted-cloud-intrusion-achieves-admin-access-in-8-minutes).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1102
  - AWS CloudTrail (StopLogging, DeleteTrail, PutEventSelectors)
  - 'NAI: Cloud compute instances (VMs), container orchestration platforms, and centralized logging systems.'
