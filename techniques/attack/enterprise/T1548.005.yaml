    against emulated chains from Stratus Red Team and surface the top-3 contributing steps. A positive
    result is a learned-improbable action chain after elevation. For Privilege Escalation, this captures
    the escalation-then-defense-evasion playbook end to end. References: [Stratus Red Team](https://github.com/DataDog/stratus-red-team).'
