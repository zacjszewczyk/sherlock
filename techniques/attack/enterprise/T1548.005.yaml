    cloud resources that simpler rules miss. References: [Detecting Threats in AWS CloudTrail Logs Using
    Machine Learning](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources:
