- question: Do network connections from cloud resources violate per-VPC allow-lists (non-allow-listed
    internal destinations/ports), show protocol-port mismatches (port 53/UDP not DNS, 443/TCP without
    a valid TLS handshake), use anonymization protocols (TOR), or match a high-confidence C2 feed?
  context: After abusing a temporarily-accessed cloud resource, attackers may use it to reach internal
    assets or C2 while evading egress filtering. Per VPC/resource group maintain an allow-list of permitted
    internal destinations/ports and alert on out-of-list connections; also alert on protocol-port mismatches
    (port 53/UDP not DNS, port 443/TCP without a valid TLS handshake in Zeek ssl.log) and known anonymization
    protocols (TOR). Ingest a high-confidence C2 feed (updated hourly) and alert on matching destination
    IPs/domains from cloud IP ranges. A positive result is an off-profile or malicious connection from
    a cloud resource. For Privilege Escalation, this catches the lateral/C2 use of newly elevated cloud
    resources.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 4624
  - 'NAI: Cloud network egress points, VPC flow logs, cloud-to-on-premise gateways, and application servers
    within the cloud environment.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "conn from cloud_resource\n| where dest not in allowlist[vpc] or port not in allowlist_ports[vpc]\n\
      \   or (port==53/udp and proto!=dns) or (port==443/tcp and no ssl handshake)\n   or dest in tor_nodes\
      \ or dest in c2_feed\n| alert"
- question: Does per-resource outbound volume exceed a rolling 30-day mean by >3 standard deviations (or
    MAD modified Z-score), do inter-arrival times to a destination show very low variance (heartbeat beaconing),
    or do DNS lookups show DGA/newly-registered domain characteristics?
  context: 'Exfiltration and beaconing have statistical fingerprints. Model per-resource outbound volume
    with a rolling 30-day mean and alert above 3 standard deviations (or a modified Z-score threshold);
    compute the standard deviation of inter-arrival times to a destination, where a very low value indicates
    periodic machine ''heartbeat'' C2; track domain age/entropy on Zeek dns.log to flag DGA and newly-registered
    domains. A positive result is a volume spike, regular beacon, or suspicious domain from a cloud resource.
    For Privilege Escalation, these signals indicate the elevated resource is being used for C2 or exfiltration.
    References: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 4624
  - 'NAI: Cloud network egress points, VPC flow logs, cloud-to-on-premise gateways, and application servers
    within the cloud environment.'
  range: Last 90 days (rolling 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per resource: vol z = (bytes - mean30d)/std30d; if z>3 or mad_z>3.5: alert

      per (resource,dest): jitter = std(inter_arrival); if jitter < eps: alert beacon

      per dns: if domain_entropy high or domain_age < 30d: alert'
- question: Does an autoencoder trained on per-resource Zeek flow features (protocol, port, duration,
