    Model legitimate post-elevation action sequences with a Hidden Markov Model or variable-order Markov
    / sequence-learning (Cloudflare) and with the cloud graph approach (CS-GAD). Flag low-probability
    sequences and surface the top-3 improbable steps. A positive result is a post-escalation action chain
    unlike benign administration. For Privilege Escalation, this detects the broad shape of malicious
    behavior after elevation, beyond any single action. References: [Cloudflare''s API-abuse detection](https://blog.cloudflare.com/protecting-apis-from-abuse-using-sequence-learning-and-variable-order-markov/),
    [CS-GAD](https://arxiv.org/abs/2409.12726).'
