name: 'T1136.003: Cloud Account'
id: f9695979-536e-4d98-88ac-ad5c1349c0c8
description: 'Investigate whether an adversary has created new or unauthorized cloud accounts (user accounts,
  guest/external accounts, service principals, managed identities, IAM users, or service accounts) to
  establish persistent access across on-premises and cloud environments. This playbook helps an analyst
  hunt for and triage suspicious cloud account creation and the follow-on activity that signals abuse:
  inbound connections from cloud-provider IP space that match threat intelligence, interactive or network
  logons by cloud-synchronized or service-principal-style accounts to Tier 0/1 assets, first-time logons
  by accounts lacking an HR/ITSM provisioning ticket, privilege escalation and dormant-account reactivation,
  logon-correlated C2-like network beaconing, AWS IAM CreateUser/CreateAccessKey chains, Entra ID/Okta/Google
  Workspace user and role provisioning, and service-account/service-principal creation and impersonation
  used for non-interactive, MFA-less persistence. It combines symbolic-logic detection rules, statistical
  baselining/first-seen models, and machine-learning anomaly detection across endpoint, network, identity
  provider, and cloud control-plane logs.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there established inbound sessions from cloud-provider IP ranges that also match a high-confidence
    threat intelligence feed reaching internal assets that are not public-facing?
  context: An adversary who creates a cloud account often pivots from cloud-provider infrastructure back
    into the victim estate. This rule continuously filters Zeek conn.log for completed TCP sessions (conn_state
    = 'SF') whose originating host falls in known cloud-provider ranges and cross-references the source
    against a curated threat-intel feed. A hit on an internal host that is NOT on a public asset allowlist
    is strong evidence of unauthorized cloud-based access supporting persistence. A positive result (matched
    indicator + non-public destination) warrants immediate triage of the destination host and the account
    used; a negative result is expected for normal cloud-to-public traffic. Apply allowlist/expected-context
    logic as in Panther Analysis and Elastic AWS detection rules.
  answer_sources: &id001
  - Zeek conn.log
  - 'NAI: Internet Gateway, Perimeter Firewalls, Internal Network Segments'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: FROM zeek_conn WHERE conn_state='SF' AND id.orig_h IN cloud_provider_cidrs AND id.orig_h IN
      threat_intel_feed AND id.resp_h NOT IN public_asset_allowlist | EMIT alert WITH matched_indicator,
      id.orig_h, id.resp_h, id.resp_p
- question: Is a cloud-provider IP that has not been seen in the last 30 days now targeting a high-value
    internal port (RDP 3389, SSH 22, WinRM 5985) at a statistically rare rate?
  context: Adversaries using freshly created cloud accounts frequently originate from cloud IPs never
    previously observed against your perimeter. This method baselines inbound cloud-IP frequency (count/min)
    per destination port over 30 days and applies a first-seen approach. An alert fires when a previously
    unseen cloud IP touches a sensitive management port and the rarity exceeds the 99th percentile. This
    is tactic-specific for Persistence because remote management ports are the typical re-entry channels
    for credentialed access. A positive result indicates novel cloud infrastructure probing administrative
    services; benign cause could be a new but sanctioned cloud workload, which should be confirmed.
  answer_sources: *id001
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline = freq(cloud_ip, dst_port) over 30d; FOR each new_conn WHERE dst_port IN (3389,22,5985)
      AND cloud_ip first_seen=true AND rarity(cloud_ip,dst_port) > p99 -> alert
- question: Does an unsupervised model flag an inbound cloud-sourced network session as anomalous based
    on its connection characteristics?
  context: To catch novel cloud ingress that evades static rules, train an Isolation Forest or Random
    Forest on Zeek conn.log feature vectors (duration, orig_bytes, resp_bytes, resp/orig ratio, service,
    proto, conn_state, cloud_source flag). Real-time sessions are scored and those above a tuned threshold
    are alerted, with the top-3 contributing features surfaced for analyst explainability. In the Persistence
    context this catches subtle cloud-account-driven access that does not match known-bad indicators.
    A high anomaly score with cloud_source=true and an unusual byte ratio merits investigation of the
    originating cloud account and destination host.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model=IsolationForest(features=[duration,orig_bytes,resp_bytes,resp_orig_ratio,service,proto,conn_state,cloud_source]);
      score=model.decision(session); IF score>threshold -> alert WITH top3_features
- question: Did an interactive or network logon (Event ID 4624, Logon Type 2/3/10) to a Tier 0/1 asset
    use an account whose SID matches the cloud-synchronized pattern (S-1-12-1-...) or whose name matches
    cloud service-principal/temporary naming conventions?
  context: Cloud-synchronized identities and service-principal-style accounts logging into the most sensitive
    on-prem systems are a hallmark of cloud-account persistence reaching back into the domain. This rule
    alerts on 4624 events to Tier 0/1 assets where LogonType is 2, 3, or 10 AND the SID matches ^S-1-12-1-.*
    OR the username matches AAD_*, svc-*, tmp_*, or gcp-sa-*. A positive result on a domain controller,
    PAW, or CA server is high-fidelity and should trigger account containment review. Pattern-based identity
    rules follow Recorded Future cross-cloud mappings.
  answer_sources: &id002
  - Windows Event ID 4624
  - 'NAI: Domain Controllers, Member Servers hosting sensitive applications, Privileged Access Workstations
    (PAWs), Certificate Authority Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM win_4624 WHERE TargetServer IN tier0_tier1 AND LogonType IN (2,3,10) AND (TargetUserSid
      MATCHES '^S-1-12-1-.*' OR TargetUserName MATCHES 'AAD_*|svc-*|tmp_*|gcp-sa-*') -> alert WITH event_evidence
- question: Is a cloud-synchronized account's logon statistically rare relative to its own historical
    logon types and target assets (e.g., a first-ever interactive logon to a domain controller)?
  context: Even legitimate cloud-synced accounts develop predictable logon footprints. This method baselines
    logon types and target assets per account, then scores each cloud-synced logon by its rarity against
    that baseline, firing a high-severity alert when in the top 1%. It applies the Bayesian new-edge first-interaction
    model of Metelli and Heard. For Persistence, a first interactive logon by a cloud account onto a DC
    is exactly the kind of novel privileged access an adversary needs. A positive result is a never-before-seen
    account/asset/logon-type combination; benign explanations include a genuine role change that should
    be verifiable.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = profile(account, {logon_type, target_asset}); FOR logon WHERE account IS cloud_synced:
      score=rarity(logon|baseline); IF score IN top1pct -> high_sev_alert'
- question: Do cloud-centric account logons fall outside learned behavioral clusters when modeled across
    logon type, target, time-of-day, and source workstation?
  context: Apply an Isolation Forest over features (LogonType, TargetUserName pattern, TargetServer, time-of-day,
    workstation) to learn normal logon clusters and flag cloud-centric accounts that fall outside them.
    The anomaly score and top-3 contributing features are reported. In the Persistence context this surfaces
    cloud accounts being abused at unusual hours, from unusual workstations, or against unusual targets
    that signature rules miss. A high score warrants correlating the account back to its creation event
    and recent privilege changes.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=IsolationForest(features=[LogonType,name_pattern,TargetServer,hour,Workstation]); FOR
      logon WHERE account cloud_centric: IF model.score(logon)>thr -> alert WITH top3_features'
- question: Did an account log on (Event ID 4624) to an on-prem system for the first time without any
    matching account-creation or provisioning ticket in ITSM/HR within the preceding 72 hours?
  context: Unauthorized accounts created by an adversary will not have a legitimate provisioning paper
    trail. This rule joins 4624 logon records against an HR/ITSM-derived watchlist of newly provisioned
    accounts and alerts when a first logon occurs with no corresponding ticket in the past 72 hours, including
    the unmatched account details. It mirrors expected-context allowlisting from Panther Analysis. For
    Persistence this directly exposes out-of-band account creation. A positive result demands verification
    with HR/IT; a confirmed unmatched account is a strong indicator of compromise.
  answer_sources: &id003
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, VPN Concentrators, Identity and Access Management (IAM) systems, HR Information
    Systems (HRIS), IT Service Management (ITSM) platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM win_4624 first_logon=true LEFT JOIN itsm_hr_watchlist ON account WHERE itsm_hr.ticket
      IS NULL OR ticket_time NOT WITHIN 72h -> alert WITH account_details
- question: Is the hourly rate of first-time logons across the environment spiking beyond normal variation?
  context: A burst of brand-new accounts logging in can indicate scripted creation of persistence accounts.
    This method tracks the hourly count (count/min) of first-time logons with a 30-day moving average
    and standard deviation, alerting when the count exceeds three standard deviations, using time-series
    anomaly bands like AWS CloudWatch ML over CloudTrail. For Persistence, simultaneous appearance of
    multiple new identities is a red flag. A positive result should be correlated with creation events
    and the accounts involved; benign causes include onboarding waves that can be cross-checked with HR.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: series = hourly_count(first_time_logons); ma=movavg(series,30d); sd=stddev(series,30d); IF
      current > ma + 3*sd -> alert
- question: Does a supervised risk model score a first-logon event as high-risk based on source geolocation,
    timing, target system role, and HR-match status?
  context: Train a Logistic Regression on historical first-logon events with features (source IP geolocation
    from Zeek, time/day, target system role, HR match flag), comparable to Elastic CloudTrail ML rare-population
    scoring. High-risk scores trigger alerts that list the top-3 contributing features. For Persistence,
    a first logon from anomalous geography to a sensitive role with no HR match is precisely the adversary
    signature. A positive result is a high-probability first-logon risk score; analysts should validate
    the account's origin and provisioning legitimacy.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model=LogisticRegression(features=[geo(src_ip),time_day,target_role,hr_match]); p=model.predict(first_logon);
      IF p>risk_threshold -> alert WITH top3_features
- question: Did a cloud-native or service account perform a high-privilege change (Event ID 4728/4732/4756
    group additions) while not on the approved admin list, or clear a security log (Event ID 1102)?
  context: After establishing a foothold, adversaries escalate by adding their cloud account to privileged
    groups or modifying critical GPOs, and may clear logs to hide. This rule alerts on 4728/4732/4756
    when the SubjectUserName matches a cloud/service-account pattern (name or SID) and is not on an approved
    admin list, or when such an account is followed by a 1102 log-clear. Codify as portable SigmaHQ rules.
    For Persistence, this is the moment a benign-looking cloud account gains domain dominance. A positive
    result is high-severity and should trigger immediate response.
  answer_sources: &id004
  - Windows Event ID 4624
  - Windows Event ID 4728
  - Windows Event ID 4732
  - Windows Event ID 4738
  - Windows Event ID 4756
  - 'NAI: Domain Controllers, Active Directory Federation Services (ADFS) servers, Group Policy Management
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM win_4728,4732,4756 WHERE SubjectUserName MATCHES cloud_service_pattern AND SubjectUserName
      NOT IN approved_admins -> alert ; ALSO FROM win_1102 WHERE SubjectUserName MATCHES cloud_service_pattern
      -> alert
- question: Is a cloud-native account performing a privileged action that is statistically rare or first-seen
    for that principal over a 90-day window?
  context: Baseline each user's privileged-event rate and distribution over 90 days and alert when a cloud-native
    account performs a rare privileged action (first-seen for that principal), using the Netflix CloudTrail
    Anomaly Detector first-seen model. For Persistence, the first time a cloud account touches privileged
    group membership or GPOs is the key escalation moment. A positive result (a privileged action never
    before seen for that account) merits review against change tickets; a negative result means the action
    fits the account's established pattern.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline = priv_event_profile(principal,90d); FOR priv_action WHERE principal cloud_native
      AND action first_seen=true -> alert WITH principal, action
- question: Does a cloud-native account suddenly behave like a Domain Admin peer group without actually
    being a member?
  context: Cluster users by privileged-action vectors (K-Means) or apply Sentinel UEBA peer-group analytics,
    then flag cloud-native accounts that suddenly align with Domain Admin clusters without holding membership;
    report the anomaly score and top-3 features. For Persistence this catches an adversary's account behaving
    with admin-level actions before or without formal group membership, a subtle escalation signal. A
    positive result is behavioral drift toward a privileged cohort and warrants investigation of recent
    permission and credential changes.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'clusters=KMeans(priv_action_vectors); FOR account cloud_native: IF cluster(account)==domain_admin_cluster
      AND account NOT IN DomainAdmins -> alert WITH score, top3_features'
- question: Within 10 minutes of a cloud-native account logon, did the same source IP open a session to
    an internal host over a non-approved ingress port?
  context: Correlate Zeek conn.log with Event ID 4624 on timestamp/IP and alert when, within 10 minutes
    of a cloud-account logon, the same source IP sessions into an internal host via a non-approved ingress
    port, applying Elastic AWS cross-event correlation patterns. For Persistence, tight coupling of a
    cloud logon with immediate inbound access on an unusual port indicates the adversary is operationalizing
    the new account, possibly for C2 or lateral movement. A positive correlation should escalate to host
    and account investigation.
  answer_sources: &id005
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4624
  - 'NAI: Network Egress/Ingress Points, DNS Servers, Internal Server Segments, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: JOIN win_4624 (cloud_account) e, zeek_conn c ON e.src_ip=c.id.orig_h AND c.ts BETWEEN e.ts
      AND e.ts+10m WHERE c.id.resp_p NOT IN approved_ingress_ports -> alert
- question: Is an inbound cloud-sourced connection hitting a statistically rare port or showing an abnormal
    outbound/inbound byte ratio indicative of exfiltration?
  context: Baseline per-host inbound port distributions and resp_bytes/orig_bytes ratios from cloud IPs,
    then alert when a new connection hits a port below the 1st percentile or exhibits a ratio above the
    99th percentile, signaling potential exfiltration. For Persistence followed by collection, a cloud-account
    session moving large volumes outbound is a key signal. A positive result (rare port or extreme ratio)
    warrants packet/flow review and correlation with the responsible cloud account.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_host(inbound_port_dist, resp_orig_ratio) from cloud_ips; FOR conn: IF port_pctile<1
      OR ratio_pctile>99 -> alert'
- question: Do connection timestamps between a cloud source and an internal destination show strong periodicity
    consistent with C2 beaconing?
  context: Run FFT or autocorrelation on Zeek conn.log timestamps for each cloud source/internal destination
    pair and flag streams with strong periodic peaks as likely C2 beaconing, reporting period, jitter,
    and connection count. For Persistence, a created cloud account often anchors a beaconing implant;
    regular intervals reveal automated check-ins. A positive result (clear dominant frequency with low
    jitter) is high-confidence C2 evidence and should trigger network containment and host forensics.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'FOR pair(cloud_src,internal_dst): spectrum=FFT(timestamps); IF peak_power>thr AND jitter<j_thr
      -> alert WITH period, jitter, conn_count'
- question: Did a non-allowlisted principal call AWS CloudTrail CreateUser/CreateLoginProfile/CreateAccessKey,
    especially followed within 10 minutes by AttachUserPolicy/PutUserPolicy/AddUserToGroup?
  context: This is the core AWS IAM persistence chain. Alert on CloudTrail eventName in (CreateUser, CreateLoginProfile,
    CreateAccessKey) where userIdentity.arn is not on the provisioning/CI-CD allowlist, and escalate when
    followed by policy/group attachment within 10 minutes. Use Elastic, Panther, and SigmaHQ chain rules
    and add the S3Browser userAgent fingerprint for precision. For Persistence, creating an IAM user/key
    and immediately granting it permissions establishes durable credentialed access. A positive result
    is a high-fidelity indicator of unauthorized IAM provisioning.
  answer_sources: &id006
  - AWS:CloudTrail
  - 'NAI: AWS CloudTrail (management events), IAM control plane, Organizations management account'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM cloudtrail WHERE eventName IN ('CreateUser','CreateLoginProfile','CreateAccessKey') AND
      userIdentity.arn NOT IN provisioning_allowlist -> alert; IF followed_by eventName IN ('AttachUserPolicy','PutUserPolicy','AddUserToGroup')
      WITHIN 10m -> escalate
- question: Is this the first time a given principal has ever created an IAM user/access key, or is the
    account-creation rate spiking above normal?
  context: Maintain a per-principal first-seen ledger of account-creation APIs (Netflix CloudTrail Anomaly
    Detector) and alert on the first ever CreateUser/CreateAccessKey by a principal; in parallel baseline
    creations/min with anomaly bands (AWS CloudWatch ML) and alert above 3 sigma. For Persistence, an
    actor who never provisions accounts suddenly doing so, or a burst of creations, indicates abuse of
    stolen credentials. A positive first-seen result should be validated against the principal's role
    and recent activity.
  answer_sources: *id006
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: IF principal NOT IN first_seen_ledger[creation_api] -> alert AND record; baseline=creations_per_min;
      IF rate > mean+3*sd -> alert
- question: Did a burst of AccessDenied/UnauthorizedOperation errors by a principal precede a successful
    IAM CreateUser/CreateAccessKey?
  context: Permission-probing before success is a distinct precursor signal. Profile errorCode AccessDenied/UnauthorizedOperation
    counts per principal and alert when a burst (e.g., >=5 in 10 min) precedes a successful CreateUser/CreateAccessKey;
    seed thresholds from the flaws.cloud CloudTrail dataset. For Persistence, an adversary discovering
    they can create accounts often trips denied attempts first. A positive result (failure burst then
    success) strongly suggests reconnaissance-then-persistence by an unauthorized actor.
  answer_sources: *id006
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR principal: denies=count(errorCode IN (''AccessDenied'',''UnauthorizedOperation'')) in
      10m; IF denies>=5 AND followed_by successful CreateUser/CreateAccessKey -> alert'
- question: Does an anomaly model score an IAM creation event as coming from a rare principal/context
    combination?
  context: Score creation events with Elastic CloudTrail ML rare-function jobs or an Isolation Forest
    over features (principal, eventName, source ASN, userAgent, hour, prior-failure count); surface the
    top-3 contributing features in the alert. For Persistence this catches IAM provisioning that is contextually
    unusual even when no single rule fires. A high anomaly score with an unfamiliar ASN or userAgent merits
    review of the principal's credentials and the newly created identity.
  answer_sources: *id006
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model=IsolationForest(features=[principal,eventName,src_asn,userAgent,hour,prior_failures]);
      IF model.score(create_event)>thr -> alert WITH top3_features
- question: Did an actor outside the approved admin/provisioning set create an IdP/Office Suite account
    (Entra 'Add user'/invite external, Okta lifecycle.create, Google CREATE_USER) and shortly after assign
    it a role or group?
  context: Alert on IdP 'Add user'/lifecycle.create followed by 'Add member to role'/group within a short
    window when the initiating actor is outside the approved admin/provisioning set, using Recorded Future
    cross-provider mappings and SigmaHQ IdP rules. For Persistence, creating a cloud identity and immediately
    granting it privileges is the fastest path to durable access. A positive result (unauthorized creator
    + rapid role grant) is high-fidelity and should trigger account and actor review.
  answer_sources: &id007
  - azure:audit
  - azure:signinlogs
  - m365:unified
  - saas:okta
  - saas:google_workspace
  - 'NAI: Entra ID audit logs, Okta system log, Google Workspace admin audit, M365 unified audit log'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM idp_audit WHERE op IN ('Add user','lifecycle.create','CREATE_USER') AND actor NOT IN approved_admins
      -> candidate; IF followed_by op IN ('Add member to role','Add to group') WITHIN window -> alert
- question: Is the per-tenant or per-admin account-creation rate spiking, or is an actor performing account
    creation for the first time?
  context: Baseline account-creation count/min per tenant and per initiating admin; alert on volume spikes
    (>3 sigma) and on the first-seen of an actor performing creations, with tunable templates from the
    Microsoft Sentinel anomalies reference. For Persistence, mass or out-of-character account creation
    indicates automated adversary provisioning. A positive result (spike or first-seen creator) should
    be correlated with the accounts produced and the actor's normal duties.
  answer_sources: *id007
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline=creations_per_min(tenant,admin); IF rate>mean+3*sd -> alert; IF admin NOT IN first_seen_ledger[create_user]
      -> alert
- question: Does a newly created account's first-week behavior diverge from its assigned peer-group cohort?
  context: Apply Sentinel UEBA peer-group analytics to flag a newly created account whose first-week sign-in/resource-access
    behavior diverges from its peer cohort; report the top-3 contributing features. For Persistence, an
    adversary-created account rarely behaves like genuine peers in the same role/department. A positive
    result (early behavioral divergence) suggests the account was created for illegitimate purposes and
    warrants confirmation of its provisioning legitimacy.
  answer_sources: *id007
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: cohort=peer_group(new_account); behavior=first_week(signins,resource_access); IF divergence(behavior,cohort)>thr
      -> alert WITH top3_features
- question: Do graph-based models flag a contextually malicious creator-role-resource pattern in IdP/cloud
    audit activity?
  context: 'Model IdP/cloud audit logs as heterogeneous dynamic graphs (GNN-based adaptive IAM detection)
    or tripartite user-service-activity graphs (CS-GAD) to flag contextually malicious creator-role-resource
    patterns, surfacing the contributing edges. For Persistence, account creation abuse is best understood
    relationally: who created whom, what roles followed, and which resources were touched. A positive
    result (anomalous subgraph) points analysts directly at the suspicious creation chain and its edges.'
  answer_sources: *id007
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: G=build_graph(idp_cloud_audit); anomalies=GNN_score(G) OR CSGAD(G); IF subgraph_score>thr ->
      alert WITH contributing_edges
- question: Was a service principal/app registration created and immediately given credentials, a GCP
    service account/key created, or an AWS role created with a permissive AssumeRolePolicy, outside the
    approved automation pipeline?
  context: Service identities authenticate non-interactively and without MFA, making them prized persistence
    vehicles. Alert on service principal/app registration creation immediately followed by 'Add credentials'/'Add
    password' (Entra), GCP serviceAccounts.create or keys.create, or AWS CreateRole with a permissive
    AssumeRolePolicy when initiated outside the approved automation pipeline, per SigmaHQ and Panther
    rules. A positive result (service identity created with credentials by a non-pipeline actor) is high-fidelity
    persistence evidence requiring credential revocation review.
  answer_sources: &id008
  - azure:audit
  - AWS:CloudTrail
  - saas:gcp_audit
  - 'NAI: Entra ID audit (app/service principal), GCP admin activity audit, AWS CloudTrail IAM events'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM cloud_audit WHERE (op='servicePrincipal.create' FOLLOWED_BY op IN ('Add credentials','Add
      password')) OR op IN ('serviceAccounts.create','serviceAccountKeys.create') OR (op='CreateRole'
      AND assume_role_policy IS permissive) AND actor NOT IN automation_pipeline -> alert
- question: Is this the first time a given principal has created or impersonated a service account (generateAccessToken/serviceAccountKeys.create),
    or is the creation rate spiking?
  context: Baseline which principals create or impersonate service accounts; alert on the first-seen generateAccessToken/serviceAccountKeys.create
    by a given principal and on creation-rate spikes, following the Netflix CloudTrail Anomaly Detector
    first-seen approach. For Persistence, impersonation of service accounts enables stealthy, MFA-less
    access; a principal doing it for the first time is suspicious. A positive first-seen result should
    be validated against the principal's expected automation duties.
  answer_sources: *id008
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: IF principal NOT IN first_seen_ledger[impersonation] FOR op IN ('generateAccessToken','serviceAccountKeys.create')
      -> alert; baseline=creation_rate; IF rate>mean+3*sd -> alert
- question: Does an anomaly/graph model flag a service-account creation or impersonation chain as an outlier?
  context: Use an Isolation Forest over service-account creation/credential feature vectors and GNN IAM
    graph modeling to detect anomalous service-account creation and impersonation chains, reporting the
    top-3 contributing features. For Persistence, complex service-account abuse may not match any single
    rule but stands out as a structural outlier. A high anomaly score on a creation/impersonation chain
    points analysts to the principals, credentials, and resources involved for deeper investigation.
  answer_sources: *id008
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model=IsolationForest(features=service_account_vectors); g=GNN_score(iam_graph); IF model.score>thr
      OR g>thr -> alert WITH top3_features
