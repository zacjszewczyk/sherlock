name: 'T1542.005: Pre-OS Boot: TFTP Boot'
id: 64d8cfbd-72d7-42c2-adc8-cf1dec67cea9
description: 'This playbook helps an analyst investigate whether an adversary is abusing TFTP netboot
  (UDP/69) to load an unauthorized or modified operating-system image onto a network device (router/switch),
  a Pre-OS Boot technique used for both Stealth and Persistence. It guides a Zeek-centric hunt across
  complementary angles: hashing every TFTP-transferred file and comparing it to the per-device-family
  golden-image allowlist and to threat-intel of malicious firmware hashes and known-bad infrastructure;
  detecting suspicious or high-entropy filenames and non-image extensions (.sh/.py/.elf); enforcing allowlists
  of authorized TFTP servers and source hosts (alerting on external or non-management sources at perimeter
  and segmentation boundaries); baselining TFTP destinations, byte-volume, cadence, connection-state mix
  (REJ/S0 probing), and time-of-day with statistical, change-point, and fuzzy-hash (ssdeep) methods; and
  correlating the full persistence chain of TFTP transfer -> inferred reboot (monitoring-traffic drop/restore)
  -> post-boot behavioral drift or covert C2 (DNS tunneling, new protocols/ports). Detection methods combine
  symbolic-logic rules, statistical baselining/change-point detection, and machine-learning models (gradient-boosted
  firmware classifiers, isolation forest / one-class SVM, autoencoders, HMM sequence models) applied to
  Zeek conn.log, files.log, dns.log, http.log, and notice.log, plus network-device config and syslog context,
  so the analyst can corroborate a suspected malicious TFTP boot against image integrity, source/destination
  legitimacy, transfer anomalies, and post-reboot device behavior.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0003
  tactic_name: Persistence
