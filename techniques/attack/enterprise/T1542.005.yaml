questions:
- question: '[Stealth] TFTP-hash and golden-image correlation: Can you determine whether a file transfer
    over UDP port 69 (TFTP) is observed where the SHA256 hash matches threat intelligence for malicious
    firmware, where the file fails to match the golden-image allowlist, or where the source/destination
    pair is associated with known malicious infrastructure. -- specifically, using the ''TFTP-hash and
    golden-image correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses the legitimate TFTP
    netboot (UDP/69) workflow used by network administrators to quietly load an unauthorized or modified
    device operating-system image, blending malicious firmware delivery into routine, expected management
    traffic so the compromised router or switch keeps running while appearing normal. This evidence focuses
    on the condition that a file transfer over UDP port 69 (TFTP) is observed where the SHA256 hash matches
    threat intelligence for malicious firmware, where the file fails to match the golden-image allowlist,
    or where the source/destination pair is associated with known malicious infrastructure. This Symbolic
    Logic approach looks for the following signal: Hash every TFTP-transferred file (Zeek files.log) and
    compare to (a) the approved golden-image allowlist per device family and (b) threat-intel of malicious
    firmware hashes and known-bad infrastructure (Zeek conn.log src/dst), alerting on any image NOT on
    the golden allowlist or matching CTI. Modified vendor images delivered this way are the persistence
    outcome of SYNful Knock [SYNful Knock, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/);
    image-integrity verification is the core control [A Large-Scale Analysis of the Security of Embedded
    Firmwares, Costin et al](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
    a network device may be netbooting or receiving an unauthorized/modified image via TFTP; pivot to
    the device''s running-config and ''boot system'' statements, its syslog boot-information messages,
    the source/destination of the TFTP flow, the file hash against the golden-image allowlist, and any
    post-reboot behavioral change. A negative result helps rule out this TFTP-boot vector for the window
    examined but should be corroborated with the other questions in this playbook, since a single method
    can miss a stealthy, low-volume, or out-of-band image swap.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Core network switches and routers, Network management servers, Network management VLAN, Internet
    gateways and perimeter firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# TFTP-hash and golden-image correlation

      source IN [Zeek files.log, Zeek conn.log]

      | WHERE matches_action_criteria("TFTP-hash and golden-image correlation")

      // Hash every TFTP-transferred file (Zeek files.log) and compare to (a) the approved golden-image
      allowlist per device fami

      | ALERT enrich(device, src_ip, dst_ip, udp_port, filename, sha256, conn_state)'
  - technology: Zeek/pseudocode
    query: '# TFTP boot correlation (Zeek)

      conn.log (id.resp_p==69/udp), files.log, dns.log

      | FILTER device subnets / management VLAN

      | JOIN file hash+name to conn src/dst, conn_state (REJ/S0), bytes, hour

      | evaluate per action criteria and emit prioritized alert'
- question: '[Stealth] TFTP-file prevalence and volume baseline: Can you determine whether a file transfer
    over UDP port 69 (TFTP) is observed where the SHA256 hash matches threat intelligence for malicious
    firmware, where the file fails to match the golden-image allowlist, or where the source/destination
    pair is associated with known malicious infrastructure. -- specifically, using the ''TFTP-file prevalence
    and volume baseline'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses the legitimate TFTP
    netboot (UDP/69) workflow used by network administrators to quietly load an unauthorized or modified
    device operating-system image, blending malicious firmware delivery into routine, expected management
    traffic so the compromised router or switch keeps running while appearing normal. This evidence focuses
    on the condition that a file transfer over UDP port 69 (TFTP) is observed where the SHA256 hash matches
    threat intelligence for malicious firmware, where the file fails to match the golden-image allowlist,
    or where the source/destination pair is associated with known malicious infrastructure. This Statistical
    Method approach looks for the following signal: Baseline approved TFTP image hashes, transfer byte-volume
    (Zeek orig_bytes/resp_bytes), and per-day transfer frequency by device family; alert when a file is
    first-seen, when transfer size deviates >3 sigma from the family''s image size, or when frequency
    falls below the 5th percentile [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html). Explicitly
    count REJ/S0 (blocked/unanswered) TFTP connection states as a distinct probing signal. A positive
    result -- a rule match, statistical outlier, or model alert -- is a strong indicator that a network
    device may be netbooting or receiving an unauthorized/modified image via TFTP; pivot to the device''s
    running-config and ''boot system'' statements, its syslog boot-information messages, the source/destination
    of the TFTP flow, the file hash against the golden-image allowlist, and any post-reboot behavioral
    change. A negative result helps rule out this TFTP-boot vector for the window examined but should
    be corroborated with the other questions in this playbook, since a single method can miss a stealthy,
    low-volume, or out-of-band image swap.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Core network switches and routers, Network management servers, Network management VLAN, Internet
    gateways and perimeter firewalls'
  range: Last 90 days (baseline 30+ days; evaluate per-day windows by device/device-family)
  queries:
  - technology: SIEM/Stats pseudocode
