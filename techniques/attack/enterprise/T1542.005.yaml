  - 'NAI: Perimeter firewalls, Network device management VLAN, Network management servers, Internal network
    segmentation boundaries'
  range: Last 90 days (train on 30-90 day history; score rolling windows)
  queries:
  - technology: SIEM/ML pseudocode
    query: '# One-class SVM for TFTP sources

      source IN [Zeek conn.log]

      | FEATURIZE events (transfer/file/flow/timing features)

      | SCORE model.predict(features)

      // Train a One-Class SVM on authorized management-server IPs/behavior and flag attempts outside
      the learned boundary with L

      | WHERE score > threshold | ALERT with top-3 feature attribution'
  - technology: Zeek/pseudocode
    query: '# TFTP boot correlation (Zeek)

      conn.log (id.resp_p==69/udp), files.log, dns.log

      | FILTER device subnets / management VLAN

      | JOIN file hash+name to conn src/dst, conn_state (REJ/S0), bytes, hour

      | evaluate per action criteria and emit prioritized alert'
