  - 'NAI: Network perimeter firewalls, DMZ network segments, Cloud security group flow logs, Internet-facing
    web servers (e.g., IIS, Apache, Nginx), VPN concentrators, External-facing database servers'
  range: Last 90 days, with model scoring on the current remote-session window.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = NORMALIZE_REMOTE_SESSION_FEATURES(src_ip, dest_host, duration, bytes, hour, failure_history)

      score = unsupervised_remote_session_model.score(features)

      explain = TOP_FEATURE_DRIVERS(features)

      ALERT WHERE score >= anomaly_threshold

      '
