name: 'T1190: Exploit Public-Facing Application'
id: bf05238c-ddf3-42c4-9043-f1cf33faadcb
description: Investigate exploitation of internet-facing applications by correlating exploit signatures,
  malicious HTTP payloads, suspicious web-server child processes, post-exploit outbound traffic, error-rate
  shifts, webshell-oriented file changes, and follow-on authentication or database-access anomalies. This
  playbook is designed to help analysts move from an initial exploit attempt to evidence of successful
  code execution, staging, persistence, or data theft on exposed services.
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-02-18'
modified: '2026-05-31'
version: '1.2'
tags: none
questions:
- question: Did a high-severity exploit signature hit a public-facing service and correspond to a live
    inbound session from a malicious or suspicious source?
  context: 'Start with the strongest deterministic signal: high-severity IDS, Suricata, or Zeek signature
    hits against known exposed services. Validate that the traffic actually reached the target service,
    then enrich the source IP with threat intelligence so the analyst can distinguish confirmed exploit
    delivery from generic background noise. The source action uses Suricata xbits stateful tracking to
    correlate multi-stage chains (e.g., JNDI lookup followed by Java class download) and confirms exploit
    delivery when a high-severity signature targets ports 80/443/8080/8443 on a non-REJ flow. Reference:
    [Log4Shell Network Detection](https://www.nccgroup.com/research-blog/log4shell-reconnaissance-and-post-exploitation-network-detection/).'
  answer_sources:
  - Zeek conn.log
  - Zeek signatures.log
  - Suricata eve.json
  - 'NAI: Network perimeter firewalls, DMZ network segments, Cloud security group flow logs, Internet-facing
    web servers (e.g., IIS, Apache, Nginx), VPN concentrators, External-facing database servers'
  range: Last 90 days, prioritizing the most recent 5 minutes around the observed connection.
  queries:
  - technology: SIEM/IDS correlation pseudocode
    query: 'sig_hits = FROM signatures WHERE severity="high" AND dest_service IN public_facing_services

      live_flows = JOIN sig_hits WITH Zeek_conn ON uid OR 5-tuple

      intel = ENRICH live_flows.src_ip WITH threat_intel

      ALERT WHERE conn_state NOT IN ["REJ"] AND sig_hits.exists

      '
- question: Are repeated exploit signatures from the same source mapped to a CVE that matches the exposed
    application's technology stack?
  context: 'Repeated exploit matches against the same target become materially more important when the
    signature metadata aligns to a vulnerability the target application is likely to expose. This question
    helps the analyst separate untargeted scanning from plausible exploitation against a real weakness.
    Map the signature ID to a known vulnerable CVE for the exposed stack using Emerging Threats Open ruleset
    CVE metadata; elevate when the same source hits the same destination repeatedly within 5 minutes.
    Reference: [On the Detection Capabilities of Signature-Based IDS in the Context of Web Attacks](https://www.mdpi.com/2076-3417/12/2/852).'
  answer_sources:
  - Zeek conn.log
  - Zeek signatures.log
  - Suricata eve.json
  - 'NAI: Network perimeter firewalls, DMZ network segments, Cloud security group flow logs, Internet-facing
    web servers (e.g., IIS, Apache, Nginx), VPN concentrators, External-facing database servers'
  range: Last 90 days, emphasizing rolling 5-minute windows for repeat hits.
  queries:
  - technology: SIEM/CVE mapping pseudocode
    query: 'grouped = GROUP signatures BY src_ip, dest_ip, signature_id, 5m

      cve_map = LOOKUP signature_id TO cve_metadata

      app_stack = LOOKUP dest_ip TO exposed_application_inventory

      ALERT WHERE grouped.count >= 2 AND cve_map.cve IN app_stack.relevant_cves

      '
- question: Is a source producing a large number of blocked or failed exploit signatures that indicates
    active exploit reconnaissance against exposed services?
  context: 'Failed exploitation still matters operationally because adversaries usually produce more failed
    attempts than successes while probing a vulnerable service. Analysts should track sources that repeatedly
    trigger exploit signatures even when the flow is reset, rejected, or blocked, because that behavior
    often precedes a successful exploit path. Treat RST/REJ or blocked dispositions as a distinct failed-exploit
    class; the source threshold is >20 blocked signatures from a single source in 10 minutes, since failure
    volume often exceeds successful exploitation as a signal. Reference: [On the Detection Capabilities
    of Signature-Based IDS in the Context of Web Attacks](https://www.mdpi.com/2076-3417/12/2/852).'
  answer_sources:
  - Zeek conn.log
  - Zeek signatures.log
  - Suricata eve.json
  - 'NAI: Network perimeter firewalls, DMZ network segments, Cloud security group flow logs, Internet-facing
    web servers (e.g., IIS, Apache, Nginx), VPN concentrators, External-facing database servers'
  range: Last 90 days, with 10-minute burst windows.
  queries:
  - technology: SIEM/rule pseudocode
    query: 'failed = JOIN signatures WITH Zeek_conn ON uid OR 5-tuple

      burst = GROUP failed BY src_ip, 10m => count_if(conn_state IN ["RSTO","RSTR","REJ"])

      ALERT WHERE burst.count > 20

      '
- question: Which source IPs are statistical outliers for exploit-signature volume against multiple public-facing
    hosts?
  context: 'Build a robust hourly baseline instead of relying only on hard thresholds. Median and MAD
    help surface aggressive exploit campaigns without allowing a few noisy internet scanners to distort
    the environment baseline. Use median and MAD over a trailing 168 hourly bins; flag any hour where
    Modified Z = 0.6745 x (count - median) / MAD exceeds 3.5 and the source also targets three or more
    distinct public-facing hosts. Reference: [Anomalous Payload-Based Network Intrusion Detection, RAID
    2004](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).'
  answer_sources:
  - Zeek conn.log
  - Zeek signatures.log
  - Suricata eve.json
  - 'NAI: Network perimeter firewalls, DMZ network segments, Cloud security group flow logs, Internet-facing
    web servers (e.g., IIS, Apache, Nginx), VPN concentrators, External-facing database servers'
  range: Last 90 days, scored hourly against a trailing 7-day baseline.
  queries:
  - technology: Statistical analysis pseudocode
    query: 'hourly = GROUP signatures BY src_ip, signature_id, hour => hit_count, distinct_targets

      baseline = ROLLING_7D(hourly.hit_count)

      score = MODIFIED_Z(hourly.hit_count, baseline.median, baseline.mad)

      ALERT WHERE score > 3.5 AND distinct_targets >= 3

      '
- question: Which exposed services show an abnormal increase or shift in exploit-signature activity relative
    to their own history?
  context: 'Some applications are probed constantly, so analysts should compare each service against its
    own baseline rather than across the entire edge. A rate increase plus a change in attack-type mix
    suggests focused exploitation against that service rather than routine scanning. Flag a service whose
    daily rate exceeds 3 standard deviations above its 30-day mean, and run a chi-squared test on signature-category
    distribution (SQLi vs XSS vs RCE vs traversal); a significant shift (p < 0.01) implies targeted exploitation
    rather than spray-and-pray. Reference: [Bayesian Event Classification for Intrusion Detection, ACSAC
    2003](https://ieeexplore.ieee.org/document/1254306/).'
  answer_sources:
  - Zeek conn.log
  - Zeek signatures.log
  - Suricata eve.json
  - 'NAI: Network perimeter firewalls, DMZ network segments, Cloud security group flow logs, Internet-facing
    web servers (e.g., IIS, Apache, Nginx), VPN concentrators, External-facing database servers'
  range: Last 90 days, with daily rates and a 30-day service baseline.
  queries:
  - technology: Statistical analysis pseudocode
    query: 'daily = GROUP signatures BY dest_service, day => total_hits, category_distribution

      baseline = ROLLING_30D(daily.total_hits)

      shift = CHI_SQUARED_TEST(daily.category_distribution, baseline.category_distribution)

      ALERT WHERE daily.total_hits > baseline.mean + 3*baseline.stddev OR shift.p_value < 0.01

      '
- question: Can network-flow features distinguish benign scanning from likely exploit-delivery traffic
    against public-facing services?
  context: 'Use supervised classification when deterministic signatures do not fully separate noisy scanners
    from flows that look like real exploit attempts. Analysts should review both the model score and the
    highest-contributing flow features before escalating. Train a Random Forest or XGBoost on Zeek conn.log
    features (service/port, duration, orig_bytes, resp_bytes, conn_state, missed_bytes) plus signature-presence
    flags; use SHAP to surface the top 3 contributing features. Train on the CIC-IDS2017 web attack subset
    or site-specific labeled data. Reference: [ML-based Network Intrusion Detection](https://arxiv.org/html/2401.12262v1).'
  answer_sources:
  - Zeek conn.log
  - Zeek signatures.log
  - Suricata eve.json
  - 'NAI: Network perimeter firewalls, DMZ network segments, Cloud security group flow logs, Internet-facing
    web servers (e.g., IIS, Apache, Nginx), VPN concentrators, External-facing database servers'
  range: Last 90 days for feature extraction, with model scoring on the current event window.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = EXTRACT(conn_service, duration, orig_bytes, resp_bytes, conn_state, missed_bytes,
      signature_flags)

      score = exploit_classifier.predict_proba(features)

      explain = SHAP_TOP3(features)

      ALERT WHERE score >= 0.85

      '
- question: Do HTTP requests contain direct exploit payload markers, traversal strings, SQLi tokens, serialized-object
    headers, JNDI lookups, or known scanner user agents?
  context: 'This is the analyst''s primary content-inspection question for web exploit attempts. Match
    explicit payload artifacts in URIs, headers, request bodies, and user agents so obviously malicious
    requests can be triaged quickly and preserved for follow-on scoping. Match SQLi, traversal, Log4Shell/JNDI,
    Java deserialization, SSRF internal-IP, and scanner identifiers (sqlmap, nuclei, Nikto) regexes; deploy
    OWASP CRS at Paranoia Level 2+, where custom rules reached 97.46% precision (PL1 alone is insufficient).
    Reference: [An Empirical Study on OWASP CRS Enhancement](https://www.sciencedirect.com/science/article/pii/S0167404825004031).'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - ModSecurity audit log
  - 'NAI: Web Application Firewalls (WAFs), Public-facing web servers, Reverse proxies, Load balancers'
  range: Last 90 days, with immediate triage for the current request stream.
  queries:
  - technology: WAF/SIEM rule pseudocode
    query: "ALERT FROM http_logs\nWHERE uri OR user_agent OR request_body MATCHES exploit_regex_library\n\
      \  OR user_agent IN known_scanners\n"
- question: Did a suspicious HTTP request precede a file upload or transfer that looks like webshell staging?
  context: 'File transfer activity becomes higher confidence when it follows a clearly malicious request
    from the same source within a short window. Correlate the request and the uploaded artifact to identify
    likely webshell placement rather than ordinary content uploads. Correlate uploads with extensions
    .aspx/.php/.jsp/.jspx/.war/.cfm or executable MIME types against a preceding suspicious request from
    the same source within 10 minutes, and cross-reference uploaded hashes against published YARA webshell
    rules. References: [NSA Mitigating-Web-Shells](https://github.com/nsacyber/Mitigating-Web-Shells)
    and [Neo23x0/signature-base](https://github.com/Neo23x0/signature-base).'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - ModSecurity audit log
  - 'NAI: Web Application Firewalls (WAFs), Public-facing web servers, Reverse proxies, Load balancers'
  range: Last 90 days, focusing on 10-minute request-to-file windows.
  queries:
  - technology: SIEM/file correlation pseudocode
    query: 'suspicious_http = FILTER http_logs BY exploit_regex OR suspicious_user_agent

      uploads = FILTER files_log BY filename_ext IN [".aspx",".php",".jsp",".jspx",".war",".cfm"] OR executable_mime=true

      ALERT WHERE JOIN suspicious_http WITH uploads ON src_ip, dest_host, 10m

      '
- question: Is a client behaving like a web exploit discovery source by generating unusually diverse and
    error-prone requests to the same application?
  context: 'Exploit discovery often shows up as very high URI diversity, long or odd parameters, and elevated
    4xx/5xx rates against one target. This question helps analysts find clients whose request behavior
    departs sharply from normal application usage. Apply the Kruegel-Vigna multi-model approach: per-parameter
    string-length distribution (Chebyshev bound), character-distribution entropy (Shannon), and structural
    regularity; alert when URI diversity and length exceed the 99th percentile and error rates spike.
    Reference: [Anomaly Detection of Web-based Attacks, ACM CCS 2003](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - ModSecurity audit log
  - 'NAI: Web Application Firewalls (WAFs), Public-facing web servers, Reverse proxies, Load balancers'
  range: Last 90 days, using rolling 10-minute client windows.
  queries:
  - technology: Statistical analysis pseudocode
    query: 'per_client = GROUP http_logs BY src_ip, app, 10m => distinct_uri, avg_uri_len, error_rate

      baseline = LOOKUP app_request_baseline(app)

      ALERT WHERE distinct_uri > baseline.uri_diversity_p99 AND avg_uri_len > baseline.uri_len_p99 AND
      error_rate > baseline.error_rate_p99

      '
- question: Do raw HTTP payload bytes look anomalous even when application parsing or signature coverage
    misses the exploit?
  context: 'Byte-frequency anomaly detection gives analysts a parser-independent way to catch payloads
    that diverge sharply from normal web traffic. This is useful for shellcode, SQLi, or injection content
    that may not cleanly match a known regex or may appear in malformed requests. Use PAYL-style 1-gram
    byte-frequency profiling per destination host/port/length bucket and score with Mahalanobis distance
    from a 7-day normal distribution; alert above the 99th percentile. This requires no HTTP parsing and
    runs at wire speed. Reference: [Anomalous Payload-Based Network Intrusion Detection, RAID 2004](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - ModSecurity audit log
  - 'NAI: Web Application Firewalls (WAFs), Public-facing web servers, Reverse proxies, Load balancers'
  range: Last 90 days, scored against a trailing 7-day training baseline.
  queries:
  - technology: Statistical analysis pseudocode
    query: 'payload_profile = BYTE_FREQUENCY(payload, by=[dest_host, dest_port, length_bucket])

      distance = MAHALANOBIS(payload_profile, normal_profile)

      ALERT WHERE distance >= profile_threshold

      '
- question: Which HTTP sessions are isolation-forest outliers based on request mix, URI variance, status
    patterns, and request cadence?
  context: 'Session-level anomaly scoring can reveal suspicious exploit workflows that are only weakly
    malicious at the single-request level. Review the top anomalous features for each flagged session
    to understand what made the traffic unusual. Apply an isolation forest to session features (method
    mix ratio, status-code distribution, URI length variance, request rate, parameter count, parameter
    entropy); flag scores above the 95th percentile and output the top 3 anomalous features. Train on
    14 days of site-specific logs, retrained weekly. Reference: [Kitsune: An Ensemble of Autoencoders,
    NDSS 2018](https://arxiv.org/abs/1802.09089).'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - ModSecurity audit log
  - 'NAI: Web Application Firewalls (WAFs), Public-facing web servers, Reverse proxies, Load balancers'
  range: Last 90 days, with model training on the prior 14 days of site-specific traffic.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = BUILD_SESSION_FEATURES(method_mix, status_vector, uri_len_var, req_rate, param_count,
      param_entropy)

      score = isolation_forest.score(features)

      explain = TOP_ANOMALOUS_FEATURES(features)

      ALERT WHERE score >= session_threshold

      '
- question: Can an NLP classifier identify malicious web payloads that do not exactly match static exploit
    regexes?
  context: 'Use NLP classification as a second layer when payload structure looks suspicious but deterministic
    signatures are incomplete. Analysts should inspect the decisive token subsequence and confidence score
    before taking action. Use a cascaded pipeline: TF-IDF + logistic regression for clear cases and a
    BERT model only for uncertain cases (confidence 0.4-0.6), achieving 99.86% F1 at 20x faster inference;
    output label, confidence, and the triggering token subsequence. Reference: [Cascaded NLP for SQLi
    Detection](https://arxiv.org/abs/2312.13041).'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - ModSecurity audit log
  - 'NAI: Web Application Firewalls (WAFs), Public-facing web servers, Reverse proxies, Load balancers'
  range: Last 90 days, with near-real-time scoring of inbound requests.
  queries:
  - technology: ML pipeline pseudocode
    query: 'stage1 = tfidf_lr.predict(request_text)

      IF 0.4 <= stage1.confidence <= 0.6 THEN stage2 = bert.predict(request_text)

      ALERT WHERE final_label="malicious"

      '
- question: Did a web server process spawn a shell, scripting engine, LOLBin, or network utility that
    should not normally execute under the web service?
  context: 'Unexpected child processes under web server parents are one of the clearest host-level indicators
    of successful exploitation. The analyst should verify the parent image, child image, command line,
    user context, and whether the child belongs to a known administrative or deployment workflow. Parent
    web-server processes include w3wp.exe, httpd, apache2, nginx, tomcat/java catalina, php-fpm, php-cgi,
    node, and python gunicorn/uvicorn/django; suspicious children include shells (cmd, powershell, pwsh,
    bash, sh, dash, csh, zsh), LOLBins (certutil, bitsadmin, mshta, rundll32), and network tools (curl,
    wget, nc, ncat, socat, python -c). Maps to SigmaHQ rule proc_creation_win_webshell_susp_process_spawned_from_webserver.
    Reference: [SigmaHQ Sigma Rules](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd execve logs
  - macOS Unified Log
  - Falco alerts (containers)
  - 'NAI: Public-facing web servers, Application servers in the DMZ, Container hosts running public applications,
    Kubernetes pods with ingress exposure'
  range: Last 90 days, prioritizing the first child process created after a suspicious request.
  queries:
  - technology: EDR/process rule pseudocode
    query: "ALERT FROM process_create\nWHERE parent_image IN web_server_processes\n  AND child_image IN\
      \ suspicious_child_processes\n"
- question: Was the suspicious web-server child process preceded by an exploit-like HTTP request on the
    same host?
  context: 'Correlating inbound exploit telemetry to host execution converts a possible exploit into a
    much stronger probable-compromise narrative. Analysts should look for the closest exploit-pattern
    request before the child process and preserve the request details as the likely execution trigger.
    Join the suspicious child-process event to a recent inbound HTTP request with exploit-pattern indicators
    on the same host within 5 minutes (Sysmon EID 1 timestamp vs Zeek http.log status_code >= 500 or exploit-regex
    URI, Zeek dest IP = Sysmon host IP); this two-source correlation raises confidence from possible to
    probable. Reference: [Revolutionizing SIEM Security](https://pubmed.ncbi.nlm.nih.gov/39123948/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd execve logs
  - macOS Unified Log
  - Falco alerts (containers)
  - 'NAI: Public-facing web servers, Application servers in the DMZ, Container hosts running public applications,
    Kubernetes pods with ingress exposure'
  range: Last 90 days, using a 5-minute request-to-process correlation window.
  queries:
  - technology: Host/network correlation pseudocode
    query: 'proc = FILTER process_create BY parent_image IN web_server_processes AND child_image IN suspicious_child_processes

      req = FILTER http_logs BY exploit_regex OR status_code >= 500

      ALERT WHERE JOIN proc WITH req ON server_host, 5m

      '
- question: Did a containerized public-facing application start a shell inside the container or access
    cloud metadata in a way that suggests exploit-driven code execution?
  context: 'In container environments, shell execution and metadata access are especially important because
    they often show an attacker moving from the application layer into the container runtime or cloud
    credential space. This question is high priority for DMZ and ingress-exposed workloads. Use the Falco
    ''Terminal shell in container'' rule, Kubernetes audit kubectl exec/attach events, or Docker exec
    events spawning /bin/sh or /bin/bash; additionally flag any container process reaching the metadata
    endpoint 169.254.169.254 as SSRF-to-IMDS. Reference: [Falco Default Rules](https://falco.org/docs/reference/rules/default-rules/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd execve logs
  - macOS Unified Log
  - Falco alerts (containers)
  - 'NAI: Public-facing web servers, Application servers in the DMZ, Container hosts running public applications,
    Kubernetes pods with ingress exposure'
  range: Last 90 days, with immediate triage around the current container event.
  queries:
  - technology: Container security pseudocode
    query: 'shell_events = FILTER falco BY rule IN ["Terminal shell in container","Docker exec shell"]

      metadata = FILTER network_events BY dest IN ["169.254.169.254","fd00:ec2::254","metadata.google.internal"]

      ALERT WHERE shell_events.exists OR metadata.exists

      '
- question: Are there parent-child process pairs under public-facing server roles that are new or extremely
    rare for that role?
  context: 'Rare or first-seen parent-child pairs often expose exploit-driven execution even when the
    child process itself is not on a hardcoded suspicious list. Compare the pair against role-specific
    history so normal maintenance on one server class does not hide anomalous execution on another. Compute
    pair frequency as count(pair) / count(all children of parent) over a 30-day role baseline; alert on
    never-before-seen pairs or rare pairs (bottom 1%) occurring more than twice in an hour, following
    Forrest et al.''s compact-normal-profile principle. Reference: [A Sense of Self for Unix Processes,
    IEEE S&P 1996](https://asu.pure.elsevier.com/en/publications/sense-of-self-for-unix-processes).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd execve logs
  - macOS Unified Log
  - Falco alerts (containers)
  - 'NAI: Public-facing web servers, Application servers in the DMZ, Container hosts running public applications,
    Kubernetes pods with ingress exposure'
  range: Last 90 days, with a 30-day pair-frequency baseline.
  queries:
  - technology: Statistical analysis pseudocode
    query: 'pairs = GROUP process_create BY server_role, parent_image, child_image => count

      baseline = ROLLING_30D(pairs)

      ALERT WHERE pair_first_seen=true OR pair_frequency <= baseline.bottom_1pct

      '
- question: Is the hourly count of child processes spawned by web servers spiking above what is normal
    for that server role?
  context: 'A volume-based surge can reveal widespread exploitation or repeated failed execution attempts
    even when each individual child process is only mildly suspicious. Track both successful and failed
    executions because adversaries often test payloads before landing on a working command chain. Track
    hourly web-server-parented child counts per role and compute modified z-score (median/MAD) over 30
    days; alert when z > 3.5 for two consecutive hours, and keep a distinct counter for failed executions
    (exit code != 0). Reference: [Anomaly Detection of Web-based Attacks, ACM CCS 2003](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd execve logs
  - macOS Unified Log
  - Falco alerts (containers)
  - 'NAI: Public-facing web servers, Application servers in the DMZ, Container hosts running public applications,
    Kubernetes pods with ingress exposure'
  range: Last 90 days, with hourly scoring against a 30-day baseline.
  queries:
  - technology: Statistical analysis pseudocode
    query: 'hourly = GROUP process_create BY server_role, hour => child_count, failed_child_count

      score = MODIFIED_Z(hourly.child_count, role_baseline.median, role_baseline.mad)

      ALERT WHERE score > 3.5 FOR 2 consecutive_hours

      '
- question: Does a provenance-graph model identify a web-originated process chain as structurally anomalous
    for that server role?
  context: 'Graph-based anomaly detection is useful when the attacker chains several low-signal events
    into one malicious path, such as web server to shell to downloader to outbound socket. Analysts should
    review the full anomalous subgraph rather than only the final alert score. Build a provenance graph
    (Sysmon EID 1/3/7/11 or auditd syscalls) and apply a Temporal GNN encoder-decoder (KAIROS) to flag
    web-parented chains with high reconstruction error; output the anomalous subgraph (e.g., nginx ->
    sh -> curl -> IP:4444). graph2vec embeddings with one-class SVM are a lighter alternative. References:
    [KAIROS: Practical Intrusion Detection, IEEE S&P 2024](https://arxiv.org/html/2308.05034) and [PROGRAPHER,
    USENIX Security 2023](https://www.usenix.org/conference/usenixsecurity23/presentation/yang-fan).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd execve logs
  - macOS Unified Log
  - Falco alerts (containers)
  - 'NAI: Public-facing web servers, Application servers in the DMZ, Container hosts running public applications,
    Kubernetes pods with ingress exposure'
  range: Last 90 days, using a 30-day role baseline for graph learning.
  queries:
  - technology: ML pipeline pseudocode
    query: 'graph = BUILD_PROVENANCE_GRAPH(process_create, file_access, network_edges)

      error = temporal_gnn.reconstruction_error(graph_subchain_from_web_parent)

      ALERT WHERE error >= graph_threshold

      '
- question: Did a public-facing server query dynamic-DNS or newly seen domains and then open outbound
    sessions that suggest post-exploit staging or command and control?
  context: 'After exploitation, many servers reach out to new infrastructure for tooling, payload staging,
    or beaconing. Focus on first-seen destinations, dynamic DNS providers, newly registered domains, and
    follow-on non-standard ports to rapidly identify likely post-compromise communications. Correlate
    Zeek dns.log queries to dynamic-DNS providers (duckdns.org, no-ip.com, dynu.com, ngrok.io) or domains
    < 30 days old with subsequent outbound sessions on non-standard ports (not 80/443/53) within 15 minutes;
    >10 NXDOMAIN responses from a DMZ server in 5 minutes indicates beaconing to dead C2. Reference: [Log4Shell
    Network Detection](https://www.nccgroup.com/research-blog/log4shell-reconnaissance-and-post-exploitation-network-detection/).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - VPC Flow Logs
  - Sysmon Event ID 3
  - 'NAI: DMZ network segments, Egress points of the network, DNS resolvers serving the DMZ, Host-based
    firewalls on public-facing servers, Cloud VPC/NSG flow logs'
  range: Last 90 days, prioritizing 15-minute windows after suspected inbound exploitation.
  queries:
  - technology: Network correlation pseudocode
    query: 'dns = FILTER Zeek_dns BY qname IN dynamic_dns OR domain_age < 30d

      flows = FILTER outbound_conn BY dest_port NOT IN [80,443,53]

      ALERT WHERE JOIN dns WITH flows ON host, 15m

      '
- question: Is a public-facing server reaching out to a completely new destination on an uncommon port
    with session length or volume consistent with staging or C2?
  context: 'New outbound destinations matter most when they occur from an exposed server and do not look
    like standard update or CDN traffic. Analysts should review first-seen destination IPs, session duration,
    and outbound byte counts together rather than in isolation. Maintain a 30-day destination-IP whitelist
    per server; alert on connections to first-seen IPs on uncommon ports (>1024, excluding CDN/update)
    when the session lasts > 5 minutes or transfers > 1MB outbound, including full connection metadata.
    Reference: [SigmaHQ Sigma Rules](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - VPC Flow Logs
  - Sysmon Event ID 3
  - 'NAI: DMZ network segments, Egress points of the network, DNS resolvers serving the DMZ, Host-based
    firewalls on public-facing servers, Cloud VPC/NSG flow logs'
  range: Last 90 days, with priority on the first outbound connection after suspected exploitation.
  queries:
  - technology: SIEM/rule pseudocode
    query: 'first_seen = LOOKUP dest_ip NOT IN server_30d_whitelist

      ALERT FROM outbound_conn

      WHERE first_seen AND dest_port > 1024 AND (duration > 5m OR orig_bytes > 1MB)

      '
- question: Did the public-facing server or its web process access a cloud metadata endpoint, suggesting
    SSRF or post-exploit credential theft?
  context: 'Metadata-service access from an exposed application is a high-value signal because it often
    indicates SSRF exploitation or post-exploit credential harvesting. In most environments this should
    be investigated immediately unless there is a very explicit, approved workflow. Metadata access (169.254.169.254,
    fd00:ec2::254, metadata.google.internal) from a web process or container is a near-zero-false-positive
    SSRF/credential-theft indicator; enforcing IMDSv2 (PUT-based session tokens) blocks most SSRF metadata
    access. Reference: [IMDS Anomaly Hunting](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - VPC Flow Logs
  - Sysmon Event ID 3
  - 'NAI: DMZ network segments, Egress points of the network, DNS resolvers serving the DMZ, Host-based
    firewalls on public-facing servers, Cloud VPC/NSG flow logs'
  range: Last 90 days, with immediate focus on the current event.
  queries:
  - technology: SIEM/rule pseudocode
    query: "ALERT FROM network_events\nWHERE src_process IN web_server_processes\n  AND dest IN [\"169.254.169.254\"\
      ,\"fd00:ec2::254\",\"metadata.google.internal\"]\n"
- question: Are outbound connections from the exposed server abnormal for its usual destination ASN, country,
    port, duration, or byte profile?
  context: 'Multivariate destination baselining catches subtle egress anomalies that do not trip a single
    hard threshold. Analysts should treat never-before-seen ASNs, unusual ports, and large outbound transfers
    as stronger evidence when they appear together on a public-facing server. Build a 30-day baseline
    of destination ports and ASNs/countries per server and compute Mahalanobis distance across (dest_port,
    dest_ASN, orig_bytes, duration); alert on never-before-seen ASN/port exceeding the 99th percentile
    of orig_ip_bytes, catching slow-exfil evasion via the multivariate distance. Reference: [Anomalous
    Payload-Based Network Intrusion Detection, RAID 2004](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - VPC Flow Logs
  - Sysmon Event ID 3
  - 'NAI: DMZ network segments, Egress points of the network, DNS resolvers serving the DMZ, Host-based
    firewalls on public-facing servers, Cloud VPC/NSG flow logs'
  range: Last 90 days, scored against a 30-day server-specific baseline.
  queries:
  - technology: Statistical analysis pseudocode
    query: 'features = [dest_port, dest_asn, orig_bytes, duration]

      score = MAHALANOBIS(features, server_30d_baseline)

      ALERT WHERE new_asn=true OR score >= egress_threshold

      '
- question: Is outbound byte volume from the public-facing server spiking abnormally after inbound exploit
    activity?
  context: 'Large or sustained egress after a suspicious inbound sequence can indicate staging, follow-on
    payload retrieval, or early exfiltration. The analyst should inspect both absolute outbound bytes
    and the outbound-to-inbound ratio to catch slower but still abnormal flows. Compute rolling modified
    z-scores (median/MAD) for outbound bytes per 10-minute window; alert when z > 3.5 for two consecutive
    windows or when the outbound:inbound ratio exceeds 10:1 (web servers normally < 1:1), cross-referencing
    inbound exploit alerts in the preceding 30 minutes. Reference: [Bayesian Event Classification for
    Intrusion Detection, ACSAC 2003](https://ieeexplore.ieee.org/document/1254306/).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - VPC Flow Logs
  - Sysmon Event ID 3
  - 'NAI: DMZ network segments, Egress points of the network, DNS resolvers serving the DMZ, Host-based
    firewalls on public-facing servers, Cloud VPC/NSG flow logs'
  range: Last 90 days, using rolling 10-minute windows and the prior 30 minutes of inbound context.
  queries:
  - technology: Statistical analysis pseudocode
    query: 'windows = GROUP outbound_conn BY server, 10m => outbound_bytes, inbound_bytes

      score = MODIFIED_Z(outbound_bytes, baseline.median, baseline.mad)

      ALERT WHERE score > 3.5 FOR 2 consecutive_windows OR outbound_bytes/inbound_bytes > 10

      '
- question: Does an unsupervised egress model identify an exposed server interval as anomalous after suspected
    exploitation?
  context: 'Use incremental, unsupervised modeling to find egress intervals that do not resemble normal
    server behavior even when no single connection stands out. Analysts should preserve the feature contributions
    that explain why the interval was flagged. Use Kitsune''s AfterImage incremental statistics (mean,
    variance, covariance) on outbound features (count, bytes, duration, port diversity) per 10-minute
    interval, fed into the KitNET autoencoder ensemble; flag intervals with RMSE above the 95th percentile
    and output the top contributing features. No labeled data required. Reference: [Kitsune: An Ensemble
    of Autoencoders, NDSS 2018](https://arxiv.org/abs/1802.09089).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - VPC Flow Logs
  - Sysmon Event ID 3
  - 'NAI: DMZ network segments, Egress points of the network, DNS resolvers serving the DMZ, Host-based
    firewalls on public-facing servers, Cloud VPC/NSG flow logs'
  range: Last 90 days, scored in 10-minute intervals with online adaptation.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = AFTERIMAGE_STATS(count, bytes, duration, port_diversity, new_dest_count)

      rmse = kitnet.score(features)

      ALERT WHERE rmse >= p95_training_threshold

      '
- question: Did a single client or request pattern trigger a burst of HTTP 5xx responses or repeated application
    error signatures that suggest active exploitation?
  context: 'Sudden concentrations of 5xx responses often reveal exploit attempts that stress vulnerable
    code paths or crash server-side logic. Analysts should preserve the exact URI, error family, and client
    responsible so the issue can be reproduced or blocked quickly. Alert when a single client IP produces
    >= 50 HTTP 500-level responses in 5 minutes, or when error logs show >= 20 identical error signatures
    (same URI + error type) in 5 minutes; flag 500s whose body contains stack-trace indicators (java.lang.Exception,
    System.Exception, Traceback, segfault). Track 4xx (recon) and 5xx (exploitation) separately. Reference:
    [An Empirical Study on OWASP CRS Enhancement](https://www.sciencedirect.com/science/article/pii/S0167404825004031).'
  answer_sources:
  - Zeek http.log
  - Apache/Nginx error logs
  - IIS Failed Request Tracing
  - Application performance monitoring (APM) logs
  - 'NAI: Public-facing web servers, Web Application Firewalls (WAFs), Load balancers, Centralized log
    aggregation platforms'
  range: Last 90 days, with 5-minute burst windows.
  queries:
  - technology: SIEM/rule pseudocode
    query: 'per_client = GROUP http_logs BY src_ip, 5m => http_5xx

      per_error = GROUP app_errors BY uri_path, error_type, 5m => count

      ALERT WHERE per_client.http_5xx >= 50 OR per_error.count >= 20

      '
- question: Do high-entropy parameters or suspicious request payloads line up with the same sources that
    are causing server-side errors?
  context: 'Error bursts become far more useful when tied back to the request content that likely triggered
    them. This question is meant to surface the actual exploit payloads behind a crash or fault condition
    so containment and remediation can proceed faster. Correlate 5xx spikes with same-source requests
    whose parameter values have high Shannon entropy (> 4.5 bits/char) within 10 minutes, and surface
    the full URI and parameter values for triage. Reference: [Anomaly Detection of Web-based Attacks,
    ACM CCS 2003](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).'
  answer_sources:
  - Zeek http.log
  - Apache/Nginx error logs
  - IIS Failed Request Tracing
  - Application performance monitoring (APM) logs
  - 'NAI: Public-facing web servers, Web Application Firewalls (WAFs), Load balancers, Centralized log
    aggregation platforms'
  range: Last 90 days, using 10-minute request-to-error correlation.
  queries:
  - technology: Host/network correlation pseudocode
    query: 'suspicious_req = FILTER http_logs BY parameter_entropy > 4.5

      errors = FILTER app_errors BY status_code >= 500

      ALERT WHERE JOIN suspicious_req WITH errors ON src_ip, dest_host, 10m

      '
- question: Has the application's HTTP method distribution shifted significantly at the same time that
    its 5xx rate increased?
  context: 'Attack traffic often changes the mix of methods hitting an endpoint, such as sudden POST,
    PUT, or DELETE spikes against routes that normally receive mostly GET requests. Compare the current
    mix to the endpoint baseline so analysts can see whether the request pattern itself has become abnormal.
    Compute a rolling 14-day baseline of HTTP method distribution per endpoint and run an hourly chi-squared
    goodness-of-fit test; alert at p < 0.01 (critical value 13.28 with df=4 across 5 method categories)
    coinciding with a 5xx rate above the 95th percentile. Reference: [Bayesian Event Classification for
    Intrusion Detection, ACSAC 2003](https://ieeexplore.ieee.org/document/1254306/).'
  answer_sources:
  - Zeek http.log
  - Apache/Nginx error logs
  - IIS Failed Request Tracing
  - Application performance monitoring (APM) logs
  - 'NAI: Public-facing web servers, Web Application Firewalls (WAFs), Load balancers, Centralized log
    aggregation platforms'
  range: Last 90 days, scored hourly against a rolling 14-day baseline.
  queries:
  - technology: Statistical analysis pseudocode
    query: 'observed = METHOD_DISTRIBUTION(endpoint, current_hour)

      expected = METHOD_DISTRIBUTION(endpoint, rolling_14d)

      chi = CHI_SQUARED_TEST(observed, expected)

      ALERT WHERE chi.p_value < 0.01 AND endpoint_5xx_rate > endpoint_5xx_p95

      '
- question: Are endpoint-specific 5xx error rates exceeding their forecast or modified z-score bounds
    in a way consistent with exploitation?
  context: 'Endpoint-aware forecasting helps distinguish true application distress from ordinary traffic
    cycles. Analysts should inspect routes whose observed error rates exceed their forecast bands, especially
    if the route also saw novel parameters or exploit-like inputs. Fit a SARIMA model to per-endpoint
    hourly 5xx rates with daily seasonality (period=24) and flag hours above the 99% upper prediction
    interval; for endpoints with < 14 days of history, fall back to modified z-score > 3.5 against a global
    baseline. Retrain weekly. Reference: [Online Forecasting and Anomaly Detection Based on ARIMA](https://www.mdpi.com/2076-3417/11/7/3194).'
  answer_sources:
  - Zeek http.log
  - Apache/Nginx error logs
  - IIS Failed Request Tracing
  - Application performance monitoring (APM) logs
  - 'NAI: Public-facing web servers, Web Application Firewalls (WAFs), Load balancers, Centralized log
    aggregation platforms'
  range: Last 90 days, with hourly endpoint forecasting and weekly retraining.
  queries:
  - technology: Statistical analysis pseudocode
    query: 'forecast = SARIMA(endpoint_5xx_rate_hourly)

      ALERT WHERE observed_5xx > forecast.upper_99

      FALLBACK ALERT WHERE history < 14d AND MODIFIED_Z(observed_5xx) > 3.5

      '
- question: Do request-feature clusters reveal a set of outlier requests that aligns with application
    errors or exploit attempts?
  context: 'Density-based clustering can isolate small groups of malicious-looking requests from otherwise
    normal traffic. Analysts should review both the outlier cluster features and a few representative
    requests to understand whether they reflect exploit payload testing or a broken client. Apply HDBSCAN
    to per-request feature vectors (URI length, parameter count, parameter entropy, HTTP method one-hot,
    response code, response size, source request rate); noise/outlier requests are exploit candidates.
    Set min_cluster_size to ~50 for high-traffic or ~10 for low-traffic apps and correlate outliers with
    5xx spikes. Reference: [Anomaly Detection of Web-based Attacks, ACM CCS 2003](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).'
  answer_sources:
  - Zeek http.log
  - Apache/Nginx error logs
  - IIS Failed Request Tracing
  - Application performance monitoring (APM) logs
  - 'NAI: Public-facing web servers, Web Application Firewalls (WAFs), Load balancers, Centralized log
    aggregation platforms'
  range: Last 90 days, with clustering over the current incident window and recent history.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = [uri_len, param_count, param_entropy, method, response_code, response_size, src_req_rate]

      clusters = HDBSCAN(features)

      ALERT WHERE cluster_label="noise" OR cluster_is_outlier=true

      '
- question: Can an explainable classifier identify likely web attacks and show which request features
    drove the decision?
  context: 'Explainable classification is useful when analysts need fast, defensible prioritization without
    manually reconstructing every request. Review the model score together with the top contributing features
    and compare them to the raw request before escalation. Train XGBoost on labeled web-attack data (HTTP
    CSIC 2010 or site-specific) using URI length, parameter count, parameter entropy, method, attack-token
    presence, request rate, response code, and response time; apply SHAP to print the top 3 contributing
    features per alert for triage without raw log queries. Reference: [An Explainable ML-based Web Attack
    Detection System](https://www.tandfonline.com/doi/full/10.1080/19393555.2024.2362813).'
  answer_sources:
  - Zeek http.log
  - Apache/Nginx error logs
  - IIS Failed Request Tracing
  - Application performance monitoring (APM) logs
  - 'NAI: Public-facing web servers, Web Application Firewalls (WAFs), Load balancers, Centralized log
    aggregation platforms'
  range: Last 90 days for feature extraction, with current-window scoring.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = EXTRACT(uri_len, param_count, param_entropy, method, attack_tokens, req_rate, response_code,
      response_time)

      score = xgboost_web_attack.predict_proba(features)

      explain = SHAP_TOP3(features)

      ALERT WHERE score >= 0.85

      '
- question: Were new executable or script files created inside web-accessible directories in a way that
    suggests webshell placement?
  context: 'File creation in document roots and application content paths is a direct follow-on indicator
    for successful exploitation. Analysts should validate the file path, extension, actor, deployment
    context, and whether the file content matches known webshell or staging patterns. Alert on file creations
    in document roots (e.g., C:\inetpub\wwwroot, /var/www/html, /opt/tomcat/webapps) with extensions .aspx/.asp/.php/.jsp/.jspx/.war/.cfm/.py/.rb;
    whitelist known deployment paths and CI/CD service accounts and cross-reference NSA/ASD webshell YARA
    rules. Reference: [NSA Mitigating-Web-Shells](https://github.com/nsacyber/Mitigating-Web-Shells).'
  answer_sources:
  - Sysmon Event ID 11 (FileCreate)
  - Sysmon Event ID 2 (FileCreationTimeChange)
  - Linux auditd file watches
  - YARA scanning results
  - 'NAI: Public-facing web servers, Application server document roots, Container writable layers, Shared
    storage volumes serving web content'
  range: Last 90 days, with immediate focus on file events near suspected exploit activity.
  queries:
  - technology: EDR/file rule pseudocode
    query: "ALERT FROM file_create\nWHERE target_path IN web_document_roots\n  AND extension IN [\".aspx\"\
      ,\".asp\",\".php\",\".jsp\",\".jspx\",\".war\",\".cfm\",\".py\",\".rb\"]\n"
- question: Was a newly created file in a web directory timestomped to look older than it really is?
  context: 'Timestomping is a common attacker attempt to blend a webshell into an established application
    tree. Compare the file creation event and any file creation time change event so the analyst can spot
    backdating that hides the true deployment time. Alert on Sysmon EID 2 (FileCreationTimeChange) where
    a new file in a web directory is backdated by more than 24 hours, and compare against the actual EID
    11 creation time to detect the discrepancy. Reference: [SigmaHQ Sigma Rules](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Sysmon Event ID 11 (FileCreate)
  - Sysmon Event ID 2 (FileCreationTimeChange)
  - Linux auditd file watches
  - YARA scanning results
  - 'NAI: Public-facing web servers, Application server document roots, Container writable layers, Shared
    storage volumes serving web content'
  range: Last 90 days, prioritizing events within 24 hours of the file create.
  queries:
  - technology: EDR/file correlation pseudocode
    query: 'created = FILTER file_create BY target_path IN web_document_roots

      timestomp = FILTER file_time_change BY target_path IN web_document_roots

      ALERT WHERE JOIN created WITH timestomp ON file_path AND abs(new_time - create_time) > 24h

      '
- question: Is the rate of file creation or modification in web directories statistically abnormal outside
    approved deployment windows?
  context: 'Volume anomalies matter because mass staging, cleanup, or persistence changes may occur faster
    than a manual analyst can spot. Compare daily creation and modification counts to the document-root
    baseline while excluding known release windows and deployment accounts. Track daily file-creation
    counts per document root over 30 days and alert when the modified z-score exceeds 3.5 outside known
    deployment windows; maintain a separate baseline for modification events to catch both single drops
    and mass deployment. Reference: [A Sense of Self for Unix Processes, IEEE S&P 1996](https://asu.pure.elsevier.com/en/publications/sense-of-self-for-unix-processes).'
  answer_sources:
  - Sysmon Event ID 11 (FileCreate)
  - Sysmon Event ID 2 (FileCreationTimeChange)
  - Linux auditd file watches
  - YARA scanning results
  - 'NAI: Public-facing web servers, Application server document roots, Container writable layers, Shared
    storage volumes serving web content'
  range: Last 90 days, with daily scoring against a 30-day baseline.
  queries:
  - technology: Statistical analysis pseudocode
    query: 'daily = GROUP file_events BY doc_root, day => create_count, modify_count

      score = MODIFIED_Z(daily.create_count, baseline.median, baseline.mad)

      ALERT WHERE outside_deployment_window=true AND score > 3.5

      '
- question: Does an AST-based classifier judge a newly created server-side script in a web directory to
    be a webshell?
  context: 'AST-based analysis helps when attackers obfuscate or reformat code to evade signatures. Analysts
    should review the classifier result alongside file path, creator, upload origin, and any nearby exploit
    events before deciding whether the script is malicious. Parse new PHP/JSP/ASP files into simplified
    ASTs, encode via token embedding, and classify with recurrent networks (ASTSM), reaching 99.3% accuracy
    against obfuscated webshells that evade YARA; run asynchronously on file-creation events with results
    within 60 seconds. Reference: [PHP-based Malicious Webshell Detection via AST Simplification](https://www.sciencedirect.com/science/article/abs/pii/S0167404824003547).'
  answer_sources:
  - Sysmon Event ID 11 (FileCreate)
  - Sysmon Event ID 2 (FileCreationTimeChange)
  - Linux auditd file watches
  - YARA scanning results
  - 'NAI: Public-facing web servers, Application server document roots, Container writable layers, Shared
    storage volumes serving web content'
  range: Last 90 days, with asynchronous scoring within 60 seconds of file creation.
  queries:
  - technology: ML pipeline pseudocode
    query: 'ast = PARSE_TO_SIMPLIFIED_AST(new_script_file)

      score = ast_webshell_model.predict_proba(ast)

      ALERT WHERE score >= 0.85

      '
- question: Can semantic code modeling identify an obfuscated multi-language webshell even when static
    signatures fail?
  context: 'Multi-language semantic modeling is appropriate when the environment hosts mixed PHP, JSP,
    ASP, or ASPX content and attackers adapt their obfuscation to evade YARA or string rules. Analysts
    should use this as a deeper review step for suspicious new or modified application files. Deploy a
    CodeBERT classifier fine-tuned on webshell corpora for multi-language coverage (PHP, JSP, ASP, ASPX);
    its programming-language pre-training distinguishes legitimate scripts from heavily obfuscated webshells.
    Train on the Hannousse multi-language webshell dataset. References: [Webshell Detection Based on CodeBERT
    and Deep Learning](https://dl.acm.org/doi/10.1145/3638782.3638788) and [Multi-language Webshell Dataset](https://data.mendeley.com/datasets/wt8m6bcwbr/1).'
  answer_sources:
  - Sysmon Event ID 11 (FileCreate)
  - Sysmon Event ID 2 (FileCreationTimeChange)
  - Linux auditd file watches
  - YARA scanning results
  - 'NAI: Public-facing web servers, Application server document roots, Container writable layers, Shared
    storage volumes serving web content'
  range: Last 90 days, scored on newly created or newly modified server-side files.
  queries:
  - technology: ML pipeline pseudocode
    query: 'embedding = CodeBERT.embed(script_source)

      score = multilanguage_webshell_classifier.predict_proba(embedding)

      ALERT WHERE score >= 0.85

      '
- question: Did a web service account or application account perform an interactive login that is inconsistent
    with its normal non-interactive role?
  context: Service accounts tied to public-facing applications should rarely initiate human-like logons.
    When they do, analysts should assume either credential theft, misuse after exploitation, or misconfiguration
    until the activity is explained with a verified maintenance workflow.
