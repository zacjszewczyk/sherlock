name: 'T1668: Exclusive Control'
id: cdce7a52-fa02-4a48-850d-6ac76b951e3f
description: 'This playbook helps an analyst investigate whether an adversary who has already compromised
  a system is attempting to maintain exclusive control over it by ''closing the door'' behind them --
  preventing rival threat actors from gaining or keeping a foothold and reducing noise that could expose
  the intrusion to defenders (MITRE ATT&CK T1668, Exclusive Control). Such self-hardening behavior includes
  patching the very vulnerability the actor exploited, disabling or unloading vulnerable and competing
  services, killing or uninstalling competing malware and security tooling, stripping privileges from
  or deleting other accounts, and tampering with registry-based security policy. The hunt spans Windows,
  Linux, and macOS endpoints plus supporting network telemetry, and pursues the behavior from several
  complementary angles: execution of known control-disabling utilities and abused signed drivers identified
  by hash and name; command-line arguments that disable security services, alter firewall rules, or forcibly
  uninstall security software; unauthorized modification of security-related registry keys and policy
  values; anomalous parent/child process lineages where a network service or office application spawns
  a shell that degrades security controls; rapid account-manipulation sequences in which a freshly created
  privileged account disables or deletes legitimate accounts; and correlations between inbound exploitation
  indicators and a subsequent self-patch or service-disable on the same host. Detection methods combine
  deterministic symbolic-logic rules (hash/IOC and signed-driver watchlists, command-line and registry-key
  regex, parent-child and account-sequence correlation, network-to-service correlation windows), statistical
  baselining (hash and process-pair prevalence/rarity, command-token entropy and rarity, time-to-privilege
  percentiles, mean+k*sigma volume bursts, and seasonal-trend timing outliers), and machine learning (unsupervised
  outlier scoring of new executables, gradient-boosted and language-model command-line classification,
  UEBA risk scoring of new accounts, process-provenance graph anomaly detection, and whole-system provenance
  correlation of exploit-to-remediation chains), applied across Windows Security and Sysmon events, auditd
  and syslog, macOS unified logs and osquery, and Zeek conn/notice logs, so the analyst can corroborate
  suspected exclusive-control activity against process lineage, account changes, registry and service
  state, and preceding exploitation.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
