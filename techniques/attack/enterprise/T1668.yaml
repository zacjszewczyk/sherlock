- question: '[Persistence] Outlier detection for patch/service timing: Can you determine whether An unauthorized
    process installs a patch or disables a service on a target system immediately following suspicious
    inbound network activity indicative of exploitation -- specifically, using the ''Outlier detection
    for patch/service timing'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary who has compromised
    a system attempts to maintain exclusive control by ''closing the door'' behind them -- patching the
    vulnerability they exploited, disabling vulnerable or competing services, stripping privileges from
    accounts, or removing other malware -- so that rival threat actors cannot gain or keep a foothold
    and so the environment is quieter and less likely to draw defender attention (MITRE ATT&CK T1668,
    Exclusive Control). This evidence focuses on the condition that An unauthorized process installs a
    patch or disables a service on a target system immediately following suspicious inbound network activity
    indicative of exploitation. This Statistical Method approach works as follows: Baseline normal patch/service-management
    activity (processes, hours, days) and flag service changes (7036) or installer executions (4688) that
    are statistical outliers (e.g., 03:00 Sunday via powershell.exe) using seasonal-trend decomposition
    as in the [Sentinel TimeSeriesAnomaly analytic](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Windows%20Security%20Events/Analytic%20Rules/TimeSeriesAnomaly-ProcessExecutions.yaml)
    and mean + k*sigma volume checks from [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
    A positive result -- a deterministic rule match, a statistical outlier, or a model alert -- is a strong
    signal that an actor is hardening or sanitizing a system they already control; pivot to the responsible
    process and its full parent/child lineage, the acting user or service account, the targeted security
    control, service, account, or registry key, any preceding inbound exploitation or initial-access activity,
    and whether the action succeeded, failed, or was blocked, to scope the intrusion and distinguish legitimate
    administration from adversary lockout. A negative result helps rule out this particular self-hardening
    behavior on the in-scope hosts but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, signed-driver, or living-off-the-land variants and a patient
    actor may spread these actions across legitimate maintenance windows.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Windows Event ID 4688
  - Windows Event ID 7036
  - 'NAI: Internet-facing servers (e.g., web, VPN, RDP), network perimeter security devices, and patch
    management systems.'
  range: Last 90 days (with 30-day baseline; correlate event-centered windows of +/- 1 hour around the
    activity)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Outlier detection for patch/service timing (Statistical Method)

      source IN [Zeek conn.log, Zeek notice.log, Windows Event ID 4688, Windows Event ID 7036]

      | approach: Baseline normal patch/service-management activity (processes, hours, days) and flag
      service changes (7036) or installer executions (4688) that are statistical outliers (e.g., 03:00
      Sunday via powershell.exe) using season

      | correlate over NAI: Internet-facing servers (e.g., web, VPN, RDP), network perimeter security
      devices, and patch management systems.

      | emit alert with contributing fields and entity context (process, parent process, user/account,
      target service/key/account, host, exit/result code)'
  - technology: Zeek/pseudocode
    query: '# Outlier detection for patch/service timing (Zeek view)

      watch conn.log/notice.log for inbound exploitation or known-malicious source IPs

      | correlate to subsequent host service-stop / patch / installer execution within window

      | emit candidate exploit-to-remediation chains with src, dst, host, service, timing'
