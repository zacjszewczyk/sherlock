    failed/was blocked as a distinct signal. Derive the prevalence and k thresholds per environment. A
    positive result -- a deterministic rule match, a statistical outlier, or a model alert -- is a strong
    signal that an actor is hardening or sanitizing a system they already control; pivot to the responsible
    process and its full parent/child lineage, the acting user or service account, the targeted security
