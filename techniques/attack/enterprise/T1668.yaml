questions:
- question: '[Persistence] Hash and name IOC match for control-disable tooling: Can you determine whether
    A process is created (Windows Event ID 4688) where the new process''s SHA256 hash matches a known
    malware removal utility or a tool used to disable other security tools -- specifically, using the
    ''Hash and name IOC match for control-disable tooling'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary who has compromised
    a system attempts to maintain exclusive control by ''closing the door'' behind them -- patching the
    vulnerability they exploited, disabling vulnerable or competing services, stripping privileges from
    accounts, or removing other malware -- so that rival threat actors cannot gain or keep a foothold
    and so the environment is quieter and less likely to draw defender attention (MITRE ATT&CK T1668,
    Exclusive Control). This evidence focuses on the condition that A process is created (Windows Event
    ID 4688) where the new process''s SHA256 hash matches a known malware removal utility or a tool used
    to disable other security tools. This Symbolic Logic approach works as follows: For each process creation
    (Windows Event ID 4688/Sysmon EID 1) and loaded driver (Sysmon EID 6), compare SHA256 against feeds
    of utilities that disable controls or competing malware (PCHunter, GMER, Process Hacker, known EDR-killers)
    and vulnerable/abused signed drivers catalogued in [An In-Depth Look at Windows Kernel Threats](https://documents.trendmicro.com/assets/white_papers/wp-an-in-depth-look-at-windows-kernel-threats.pdf);
    maintain matching rules in [Sigma](https://github.com/SigmaHQ/sigma). Generate a high-priority alert
    on any match (do NOT delete this deterministic floor). A positive result -- a deterministic rule match,
    a statistical outlier, or a model alert -- is a strong signal that an actor is hardening or sanitizing
    a system they already control; pivot to the responsible process and its full parent/child lineage,
    the acting user or service account, the targeted security control, service, account, or registry key,
    any preceding inbound exploitation or initial-access activity, and whether the action succeeded, failed,
    or was blocked, to scope the intrusion and distinguish legitimate administration from adversary lockout.
    A negative result helps rule out this particular self-hardening behavior on the in-scope hosts but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    signed-driver, or living-off-the-land variants and a patient actor may spread these actions across
    legitimate maintenance windows.'
