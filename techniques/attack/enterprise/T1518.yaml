questions:
- question: '[Discovery] Hash IOC for discovery tools: Can you determine whether process execution telemetry
    identifies software-discovery tooling associated with hostile reconnaissance, where the binary hash
    and execution context indicate intentional environment inventorying prior to follow-on actions. --
    specifically, using the ''Hash IOC for discovery tools'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary enumerates installed software
    and software versions to fingerprint security controls, identify vulnerable or exploitable products,
    and shape follow-on actions such as privilege escalation, lateral movement, or exfiltration. This
    evidence focuses on the condition that process execution telemetry identifies software-discovery tooling
    associated with hostile reconnaissance, where the binary hash and execution context indicate intentional
    environment inventorying prior to follow-on actions. This Symbolic Logic approach looks for the following
    signal: Query process creation logs (Windows Event ID 4688, Sysmon Event ID 1) for events where the
    process hash or OriginalFileName matches a curated list of known discovery/host-survey tools (e.g.,
    Seatbelt, SharpHound, WinPEAS). Generate a high-priority alert upon any match, following the signature
    pattern in [PUA - Seatbelt Execution](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_pua_seatbelt/).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a process or account
    is inventorying software in a way that deviates from sanctioned configuration-management, patching,
    or inventory activity; pivot to the responsible process, its parent lineage, the user and host context,
    the command-line or registry/API targets queried, and any subsequent credential-access, lateral-movement,
    or outbound activity. A negative result helps rule out this software-discovery vector for the window
    examined but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land reconnaissance.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint devices (workstations and servers), Domain Controllers, and Critical Application Servers
    where process creation logging is enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Hash IOC for discovery tools

      source IN [Windows Event ID 4688, Sysmon Event ID 1]

      | WHERE matches_action_criteria("Hash IOC for discovery tools")

      // Query process creation logs (Windows Event ID 4688, Sysmon Event ID 1) for events where the process
      hash or OriginalFile

      | ALERT enrich(host, user, process, parent, cmdline, dest)'
