name: 'T1518: Software Discovery'
id: 31f5ac74-31aa-41db-958a-90f41446021b
description: 'This playbook helps an analyst investigate whether an adversary is performing Software Discovery
  (T1518) -- enumerating installed software and software versions on hosts or cloud workloads -- as part
  of the Discovery tactic, to fingerprint security controls and find vulnerable products before follow-on
  actions. It guides the hunt across several behavioral angles spanning Windows, Linux, macOS, ESXi, and
  IaaS: execution of known host-survey/discovery tooling matched by hash or OriginalFileName (e.g., Seatbelt,
  SharpHound, WinPEAS) with context gating on user role, parent process, and admin windows, plus blocked/failed
  execution profiling; built-in enumeration commands and scripts (wmic product get, Get-Package, Uninstall
  registry reads, dpkg -l, rpm -qa, system_profiler SPApplicationsDataType, esxcli software vib list)
  run by non-admin users or unusual parents; high-volume reads of software-related registry keys (HKLM\SOFTWARE\...\Uninstall)
  including denied-read bursts; and post-discovery pivots where a host begins internal scanning or contacts
  new, low-reputation external destinations. Detection methods combine symbolic-logic rules, statistical
  baselining (prevalence floors, MAD-based thresholds, percentile bursts), and machine-learning models
  (classifiers, sequence/LSTM, clustering, provenance/graph anomaly) applied to Windows Event IDs 4688/4104/4663/4656,
  Sysmon, PowerShell script-block logs, auditd, macOS unified logs, ESXi shell/hostd, AWS CloudTrail,
  and Zeek conn/dns/files telemetry, so the analyst can corroborate suspected software reconnaissance
  against process lineage, user role, query volume, and exfiltration context.'
type: technique
related:
