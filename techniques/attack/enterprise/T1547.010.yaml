- question: Does the process that modifies Print\Monitors have an anomalous parent (cmd.exe, powershell.exe,
    wscript/cscript, mshta, or an Office application) rather than a trusted installer (msiexec.exe, svchost.exe,
    setup)?
  context: Trusted monitor installs descend from installer processes; a shell or document-application
    parent points to hands-on-keyboard or macro-driven escalation. Alert when the process writing Print\Monitors
    has a parent such as cmd.exe, powershell.exe, wscript/cscript, mshta, or an Office app (winword.exe,
    excel.exe) rather than a trusted installer (msiexec.exe, svchost.exe, setup). reg.exe/regini.exe spawned
    by a shell to write the monitor key is a LOLBAS abuse pattern. A suspicious parent chain is high-fidelity
    for escalation; installer-parented writes are expected. Pivot to the full ancestry to confirm intent.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - 'NAI: All Windows Endpoints, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SOURCE EventID IN (Sysmon:13,4657) WHERE registry_path MATCHES \"...\\\\Print\\\\Monitors*\"\
      \n| join host,pid WITH (SOURCE EventID IN (Sysmon:1,4688)) AS p\nWHERE lower(p.parent_image) IN\
      \ (\"cmd.exe\",\"powershell.exe\",\"wscript.exe\",\"cscript.exe\",\n    \"mshta.exe\",\"winword.exe\"\
      ,\"excel.exe\",\"powerpnt.exe\")\n  AND lower(p.parent_image) NOT IN (\"msiexec.exe\",\"svchost.exe\"\
      )\n| eval severity=\"high\" | table _time, host, p.image, p.parent_image, p.user"
- question: Which Print\Monitors writers have parent processes outside the top 95% of the historical parent
    distribution (near-zero-rate parents firing as multi-sigma anomalies)?
  context: Frequency analysis of parent processes surfaces unusual writers without hard-coding a parent
    list. Track parent-process frequencies for Print\Monitors writers and flag writes whose parents fall
    outside the top 95% of the historical distribution; because most parents are a small set of installers,
    near-zero-rate parents fire as multi-sigma anomalies. A rarely-seen parent for a monitor write is
    a strong escalation lead and may catch novel LOLBin chains the static rule misses; common installer
    parents are expected. Combine with ancestry-graph analysis for confirmation.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - 'NAI: All Windows Endpoints, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SOURCE join(Print\Monitors writes, process_creation) BY host,pid

      | stats count AS c BY parent_image | eventstats sum(c) AS total

      | eval freq = c/total | sort - freq | streamstats sum(freq) AS cum

      | where cum > 0.95   /* tail parents = rare */

      | emit anomalous_parent_image, freq'
- question: Does provenance-graph anomaly detection flag rare process-ancestry chains (shell->reg.exe->Print\Monitors
    or Office->child) whose subgraph deviates from the benign envelope?
  context: Whole-chain provenance modeling captures escalation patterns that single parent-child checks
    miss. Apply provenance-graph anomaly detection (UNICORN/HOLMES-style) over process ancestry and flag
    rare chains such as shell->reg.exe->Print\Monitors or Office->child->monitor-write whose subgraph
    deviates from the benign envelope. A rare, anomalous ancestry subgraph terminating in a monitor-key
    write is a high-value escalation indicator and is robust to renamed tooling because it scores structure,
    not strings. Benign installer ancestry forms a tight, common envelope and scores low. Surface the
    deviating subgraph for analyst review.
  answer_sources:
