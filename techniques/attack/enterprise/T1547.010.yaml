- question: Is any Print\Monitors registry write performed by a process running at Medium/Low integrity
    or by a user who is not a member of Administrators/SYSTEM?
  context: Legitimate port-monitor installation requires elevation, so a write from an unprivileged context
    implies an escalation attempt is succeeding. Alert when Print\Monitors registry writes originate from
    a process at Medium or Low integrity, or from a user not in the Administrators group or SYSTEM. Resolve
    the writing process (Sysmon 1 / 4688) and its integrity level, and the user's group membership (via
    DC lookup). A non-elevated writer modifying the monitor key is high-fidelity for privilege escalation
    because the mechanism is designed to run the DLL as SYSTEM at boot; expected writers are High-integrity
    or SYSTEM installers.
  answer_sources:
  - Sysmon Event ID 13
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints, Domain Controllers (for user context lookup)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SOURCE EventID IN (Sysmon:13,4657)\nWHERE registry_path MATCHES \"...\\\\Print\\\\Monitors*\"\
      \n| join host, pid WITH (SOURCE EventID IN (Sysmon:1,4688)) AS p\nWHERE p.integrity_level IN (\"\
      Low\",\"Medium\")\n   OR p.user NOT IN privileged_users\n| eval severity=\"high\" | table _time,\
      \ host, p.user, p.integrity_level, p.image"
- question: Given that >99.9% of Print\Monitors writes come from System/High-integrity installers, which
    writes by Medium/Low-integrity processes are >2-sigma anomalies, and how many denied attempts occur
    per user?
  context: 'Baseline the writer-integrity distribution: in normal operations virtually all Print\Monitors
    writes are by System or High-integrity installers. Score the writer integrity of each write and flag
    Medium/Low-integrity writes as >2-sigma anomalies. Separately count denied write attempts (state=fail)
    per user as a distinct signal of an account repeatedly trying to modify the key without rights. A
    statistically anomalous low-integrity writer, especially one with a history of denied attempts, indicates
    an escalation attempt; high-integrity installer writes are the expected norm.'
