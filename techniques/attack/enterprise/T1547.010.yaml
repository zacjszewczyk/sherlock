- question: Did spoolsv.exe load an unsigned/low-prevalence DLL within 10 minutes of LSASS access from
    a non-EDR process or of host reconnaissance (whoami, net user, ipconfig) on the same host?
  context: Escalation often appears as recon/credential-access immediately followed by the spooler loading
    the adversary's SYSTEM DLL. Alert when spoolsv.exe loads an unsigned or low-prevalence DLL (Sysmon
    7) within 10 minutes of LSASS process access (Sysmon 10) from a non-EDR process, or of host recon
    commands such as whoami/net user/ipconfig (Sysmon 1 / 4688), correlating into an ATT&CK-tagged escalation
    chain. The temporal pairing of attacker situational awareness or credential theft with a fresh spooler
    DLL load is high-fidelity for privilege escalation; isolated recon or a routine signed DLL load is
    lower confidence.
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Sysmon Event ID 10
  - 'NAI: All Windows Endpoints, Domain Controllers'
  range: Last 90 days (correlate within a 10-minute window on the same host)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SOURCE Sysmon:7 WHERE image ENDSWITH \"spoolsv.exe\"\n  AND (signature_status IN (\"unsigned\"\
      ,\"invalid\") OR dll_prevalence < 0.01)\n| join host WITH (SOURCE Sysmon:10 WHERE target_image ENDSWITH\
      \ \"lsass.exe\"\n      AND source_image NOT IN edr_processes) AS l\n| join host WITH (SOURCE EventID\
      \ IN (Sysmon:1,4688)\n      WHERE process_name IN (\"whoami.exe\",\"net.exe\",\"ipconfig.exe\"))\
      \ AS r\nWHERE abs(_time - coalesce(l._time, r._time)) <= 600s\n| eval severity=\"high\""
- question: Which hosts exceed their baseline (>3-sigma) for recon-command and LSASS-access counts and
    then have spoolsv.exe load a new DLL, and how many failed LSASS-open attempts occur?
  context: Aggregating attacker activity at the host level prioritizes the riskiest machines. Score hosts
    by recon-command counts and LSASS-access counts over a sliding window and flag those >3-sigma above
    baseline whose spoolsv.exe subsequently loads a new DLL. Include failed LSASS-open attempts (state=fail)
    as a distinct feature, since blocked credential-access attempts still signal intent. A host showing
    a spike in recon/credential activity followed by a new spooler DLL load is a strong escalation candidate;
    quiet hosts with routine spooler behavior are low risk. Use the score to rank investigation order.
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Sysmon Event ID 10
  - 'NAI: All Windows Endpoints, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "SOURCE EventID IN (Sysmon:1,4688,Sysmon:10)\n| stats count(eval(process_name IN recon_cmds))\
      \ AS recon,\n        count(eval(target=\"lsass.exe\")) AS lsass,\n        count(eval(target=\"lsass.exe\"\
      \ AND state=\"fail\")) AS lsass_fail BY host, window\n| eventstats avg(recon) AS mr, stdev(recon)\
      \ AS sr, avg(lsass) AS ml, stdev(lsass) AS sl\n| where (recon > mr+3*sr OR lsass > ml+3*sl)\n| join\
      \ host WITH (SOURCE Sysmon:7 WHERE image ENDSWITH \"spoolsv.exe\" AND new_dll) AS d"
- question: When a gradient-boosting model scores recon counts, LSASS-access counts, anomalous-login features,
    and spoolsv DLL-load rarity, which hosts are predicted to be escalating before the DLL load completes?
  context: Predictive modeling can flag escalation earlier in the kill chain. Train a Gradient Boosting
    / Random Forest model on features including recon-command counts, LSASS-access counts, anomalous-login
    features, and spoolsv DLL-load rarity to predict escalation likelihood before the malicious DLL load,
    surfacing the top-3 contributing features. A high predicted escalation probability lets defenders
    intervene before the spooler runs the SYSTEM DLL; the feature attribution explains why a host scored
    high (e.g., recon spike + rare login + low-prevalence DLL). Use the model output to drive proactive
    containment, validated against the deterministic and statistical questions.
  answer_sources:
