name: 'T1547.010: Port Monitors'
id: e826a2ae-2bc4-48cb-a77d-76b390d91468
description: Investigate adversary use of Port Monitors (T1547.010) on Windows endpoints, print servers,
  and domain controllers, where an actor configures a malicious DLL to be loaded by the Print Spooler
  service (spoolsv.exe) under SYSTEM at boot for persistence and/or privilege escalation. The DLL is registered
  either via the AddMonitor API or by writing a fully-qualified DLL path to the 'Driver' value of a subkey
  under HKLM\SYSTEM\CurrentControlSet\Control\Print\Monitors. This playbook helps an analyst determine
  whether a Port Monitor 'Driver' value references a known-malicious or rare DLL, whether a new monitor
  subkey and its backing DLL were created together in a tight time window, whether spoolsv.exe is loading
  DLLs from non-System32/user-writable paths or unsigned modules, and whether spoolsv.exe is making anomalous
  outbound network connections suggestive of C2. For the privilege-escalation angle it correlates known
  escalation tooling (e.g., PrintSpoofer), low-integrity or non-privileged writers, suspicious parent
  processes (shells, Office, LOLBAS) writing the registry, and spoolsv DLL loads that follow host reconnaissance
  or LSASS access. Each question pairs deterministic symbolic-logic detection with statistical baselining
  and machine-learning methods so both commodity and sophisticated actors are surfaced while remaining
  defensible against legitimate printer-driver installations.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Does any registry write to a 'Driver' value under HKLM\SYSTEM\CurrentControlSet\Control\Print\Monitors\*
    reference a DLL whose hash or path matches a known-malicious indicator from threat intelligence, or
    a DLL located outside System32 or written by a non-installer process?
  context: For Persistence, an adversary registers a port monitor by setting the 'Driver' value of a Print\Monitors
    subkey to a DLL that spoolsv.exe will load as SYSTEM at every boot. Alert on any registry write to
    a 'Driver' value under Print\Monitors (Sysmon 13 / Windows 4657), hash the referenced DLL via Sysmon
    11 file-creation/IMPHASH context, and match the hash and path against threat-intelligence feeds. Legitimate
    monitor DLLs reside in C:\Windows\System32 and are placed there by signed printer-driver installers;
    treat any non-System32 path, unsigned DLL, or non-installer writing process as high-fidelity. A TI
    match or out-of-System32 path is a strong positive that warrants immediate containment; a clean, System32-resident,
    signed DLL installed by msiexec is likely benign but should still be confirmed against patch/installation
    records.
  answer_sources:
  - Sysmon Event ID 13
  - Windows Event ID 4657
  - Sysmon Event ID 11
  - 'NAI: All Windows Endpoints, Windows Print Servers, Windows Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SOURCE EventID IN (Sysmon:13, 4657)\nWHERE registry_path MATCHES \"HKLM\\\\SYSTEM\\\\CurrentControlSet\\\
      \\Control\\\\Print\\\\Monitors\\\\*\\\\Driver\"\n| join host, dll_path WITH (SOURCE Sysmon:11) AS\
      \ f\n| eval dll_hash = f.sha256\nWHERE dll_hash IN ti_malicious_hashes\n   OR NOT dll_path MATCHES\
      \ \"C:\\\\Windows\\\\System32\\\\*\"\n   OR writer_image NOT IN known_installers\n| eval severity\
      \ = \"high\"\n| table _time, host, registry_path, dll_path, dll_hash, writer_image, user"
- question: Among DLLs referenced by Print\Monitors 'Driver' values, which ones have very low fleet prevalence
    (present on under 1% of hosts or fewer than 10 hosts) after excluding signed known-good software?
  context: Because writes to Print\Monitors are extremely rare in normal operations, prevalence and rarity
    scoring is a powerful weak-signal detector for persistence. Score each referenced DLL path's fleet-wide
    prevalence over a rolling 30-day window and flag paths present on fewer than 1% of hosts (or fewer
    than 10 hosts) after removing signed, known-good vendor software, using IDF-style path-rarity weighting.
    Because Print\Monitors writes are near-zero-rate, also maintain a per-host mean+3-sigma baseline so
    a single write fires as a multi-sigma anomaly. A rare DLL path on a handful of hosts is suspicious
    and merits enrichment with signature and writer context; ubiquitous System32 DLLs from major vendors
    are expected.
  answer_sources:
  - Sysmon Event ID 13
  - Windows Event ID 4657
  - Sysmon Event ID 11
  - 'NAI: All Windows Endpoints, Windows Print Servers, Windows Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SOURCE EventID IN (Sysmon:13, 4657)

      WHERE registry_path MATCHES "...\\Print\\Monitors\\*\\Driver"

      | stats dc(host) AS host_count BY dll_path

      | eventstats dc(host) AS fleet_hosts

      | eval prevalence = host_count / fleet_hosts

      | where (prevalence < 0.01 OR host_count < 10) AND NOT signed_known_good

      | eval rarity_weight = log(fleet_hosts / host_count)

      | sort - rarity_weight'
- question: Are there bursts of failed or access-denied registry writes to Print\Monitors 'Driver' values,
    failed AddMonitor calls, or DLL loads failing signature checks that culminate in a successful write?
  context: Trial-and-error behavior is itself a signal. Track failed/denied registry writes (Windows 4657
    with access-denied results), AddMonitor API calls returning errors, and DLL loads that fail signature
    verification as a distinct telemetry stream. A burst of failed 'Driver' writes followed by a success
    indicates an actor probing permissions to land a persistent port monitor. Profile the rate of failures
    per host/user and alert when a failure burst is followed by a success within a short window. Repeated
    failures with no success may indicate a blocked attempt still worth investigating; a failure-then-success
    sequence is high-fidelity for active tampering.
  answer_sources:
  - Sysmon Event ID 13
  - Windows Event ID 4657
  - Sysmon Event ID 11
  - 'NAI: All Windows Endpoints, Windows Print Servers, Windows Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "SOURCE EventID IN (4657)\nWHERE registry_path MATCHES \"...\\\\Print\\\\Monitors\\\\*\\\\\
      Driver\"\n| eval failed = (result==\"access denied\")\n| stats count(eval(failed)) AS fails, count(eval(NOT\
      \ failed)) AS successes,\n        earliest(_time) AS t0, latest(_time) AS t1 BY host, user\n| where\
      \ fails >= 3 AND successes >= 1\n| eval window_min = (t1 - t0)/60\n| where window_min <= 30"
- question: When scored by a trained classifier on DLL features (entropy, signature status, fleet prevalence,
    System32 flag, writing-process integrity), which new Print\Monitors DLLs are predicted malicious?
  context: 'Supervised models capture interactions that single rules miss. Train a Random Forest/XGBoost
    classifier on labeled DLL features including Shannon entropy, signature/certificate validity, fleet
    prevalence, an is-in-System32 flag, and the writing process image and integrity level, then score
    each newly referenced monitor DLL. Emit the top-3 contributing features alongside the score so an
    analyst can triage the rationale (for example: unsigned + low-prevalence + non-System32). A high malicious
    probability with explainable features is a strong lead for persistence; the model complements the
    deterministic and statistical questions and should be retrained periodically on confirmed benign installs
    and emulation samples.'
  answer_sources:
  - Sysmon Event ID 13
  - Windows Event ID 4657
  - Sysmon Event ID 11
  - 'NAI: All Windows Endpoints, Windows Print Servers, Windows Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FEATURES per Print\\Monitors DLL:\n  shannon_entropy, signature_valid, cert_status, fleet_prevalence,\n\
      \  in_system32_flag, writer_image, writer_integrity\nMODEL RandomForest/XGBoost -> P(malicious)\n\
      WHERE P(malicious) >= threshold\nEMIT top_3_feature_contributions, host, dll_path, score"
- question: Was a new subkey created under HKLM\SYSTEM\CurrentControlSet\Control\Print\Monitors whose
    'Driver' value points to a DLL that was created on the same host within the preceding 5 minutes?
  context: A tight registry-to-file-to-load chain is a hallmark of freshly-deployed port-monitor persistence.
    Alert when a new subkey is created under Print\Monitors (Sysmon 12 registry key creation), its 'Driver'
    value is set (Sysmon 13 / 4657), and the referenced DLL was created on that host (Sysmon 11) within
    the preceding 5 minutes. Correlate the three events into a single ATT&CK-tagged registry->file->load
    chain on the same host. Benign monitor installs use signed installers that ship DLLs to System32,
    so a just-written DLL bound to a brand-new arbitrarily-named monitor subkey is highly suspicious and
    indicative of active persistence setup.
  answer_sources:
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - Sysmon Event ID 11
  - 'NAI: All Windows Endpoints, Windows Print Servers'
  range: Last 90 days (correlate events within a 5-minute window on the same host)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'SOURCE Sysmon:12 WHERE registry_path MATCHES "...\\Print\\Monitors\\*" AND event="CreateKey"

      | join host, monitor_key WITH (SOURCE Sysmon:13 WHERE value_name="Driver") AS d

      | join host, d.dll_path WITH (SOURCE Sysmon:11) AS f

      WHERE (d._time - f.file_create_time) <= 300s

      | eval severity = "high"

      | table _time, host, monitor_key, d.dll_path, f.file_create_time'
- question: Do any Print\Monitors subkey names fall outside the known-good list, exhibit high name entropy
    (>3.5), or appear on under 1% of hosts?
  context: Legitimate port monitors use a small, well-known set of subkey names. Maintain a known-good
    list (Local Port, Standard TCP/IP Port, USB Monitor, WSD Port, BJ Language Monitor, PJL Language Monitor)
    and flag any key name not on it. Add anomaly weight by scoring the key name's Shannon entropy (>3.5
    suggests randomized/auto-generated names) and its fleet prevalence (<1% of hosts). An out-of-list,
    high-entropy, rarely-seen monitor key is a strong indicator that an adversary created an arbitrary
    subkey to host a malicious 'Driver' DLL; common named monitors present broadly across the fleet are
    expected.
  answer_sources:
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - Sysmon Event ID 11
  - 'NAI: All Windows Endpoints, Windows Print Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "SOURCE Sysmon:12 WHERE registry_path MATCHES \"...\\\\Print\\\\Monitors\\\\*\"\n| eval keyname\
      \ = leaf(registry_path)\n| eval known_good = keyname IN (\"Local Port\",\"Standard TCP/IP Port\"\
      ,\"USB Monitor\",\n    \"WSD Port\",\"BJ Language Monitor\",\"PJL Language Monitor\")\n| eval entropy\
      \ = shannon(keyname)\n| stats dc(host) AS hc BY keyname, known_good, entropy | eventstats dc(host)\
      \ AS fleet\n| where NOT known_good AND (entropy > 3.5 OR (hc/fleet) < 0.01)"
- question: Does the observed sequence of boot/spooler registry-key operations contain a low-probability
    injected monitor-key creation when modeled as a normal log sequence?
  context: The order and composition of registry key operations during boot and spooler initialization
    is highly regular. Train an LSTM log-sequence model (DeepLog-style) on the normal ordered sequence
    of boot/spooler-related key events and flag the creation of an unexpected monitor key as a low-probability
    deviation, with per-workflow diagnosis indicating where in the sequence the anomaly occurred. A flagged
    injected key creation suggests an adversary inserted a port monitor outside the normal install workflow;
    the model surfaces deviations that static lists may miss when attackers reuse benign-looking names.
  answer_sources:
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - Sysmon Event ID 11
  - 'NAI: All Windows Endpoints, Windows Print Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'SEQUENCE per host = ordered registry key events around boot/spooler init

      MODEL DeepLog LSTM -> P(next_event | history)

      WHERE observed Print\Monitors key-create has P < epsilon

      EMIT host, anomalous_event, sequence_position, probability'
- question: Is spoolsv.exe loading any DLL module from a non-System32 or user-writable directory (e.g.,
    C:\Users\*, C:\ProgramData\*, C:\Windows\Temp\*) or loading an unsigned/invalid-signature module?
  context: The Print Spooler service should only load monitor DLLs from System32. Alert when Sysmon Event
    ID 7 (image/module load) shows spoolsv.exe loading a DLL from C:\Users\*, C:\ProgramData\*, C:\Windows\Temp\*,
    or any path outside System32, or loading a module whose signature is missing or invalid. This directly
    catches the execution stage of port-monitor persistence where spoolsv loads the adversary DLL as SYSTEM.
    A load from a user-writable or temp directory, or of an unsigned module, is high-fidelity and should
    be triaged immediately; expected behavior is signed System32 monitor DLLs.
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: All Windows Endpoints, Windows Print Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SOURCE Sysmon:7 WHERE lower(image)=\"c:\\\\windows\\\\system32\\\\spoolsv.exe\"\nWHERE NOT\
      \ loaded_dll MATCHES \"C:\\\\Windows\\\\System32\\\\*\"\n   OR signature_status IN (\"unsigned\"\
      ,\"invalid\",\"expired\")\n| eval severity = \"high\"\n| table _time, host, loaded_dll, signed,\
      \ signature_status, sha256"
- question: Which spoolsv.exe-loaded DLLs have fleet prevalence below 0.1% (or are present on fewer than
    10 hosts), and do any hosts show new-DLL-load counts exceeding their per-host mean+3-sigma baseline?
  context: Rarity scoring of modules loaded by spoolsv.exe surfaces novel malicious DLLs that signature
    checks may miss. Score spoolsv-loaded DLL hashes/paths by fleet prevalence and flag those below 0.1%
    or present on fewer than 10 hosts, weighting rarer paths higher with IDF path-rarity. Separately baseline
    each host's count of new spoolsv DLL loads and alert on mean+3-sigma deviations. A rare DLL loaded
    by the spooler on just a few hosts, especially paired with a spike in new loads, is a strong persistence
    indicator; broadly-deployed signed modules are normal.
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: All Windows Endpoints, Windows Print Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "SOURCE Sysmon:7 WHERE image ENDSWITH \"spoolsv.exe\"\n| stats dc(host) AS hc BY loaded_dll,\
      \ sha256 | eventstats dc(host) AS fleet\n| eval prevalence = hc/fleet, rarity = log(fleet/hc)\n\
      | where prevalence < 0.001 OR hc < 10\n| append [ SOURCE Sysmon:7 WHERE image ENDSWITH \"spoolsv.exe\"\
      \n          | stats dc(sha256) AS new_loads BY host, date\n          | eventstats avg(new_loads)\
      \ AS mu, stdev(new_loads) AS sd BY host\n          | where new_loads > mu + 3*sd ]"
- question: Does an anomaly/provenance model flag the spoolsv->new-DLL->registry subgraph as rare based
    on path entropy, signature validity, prevalence, and linked Print\Monitors modification?
  context: Graph- and density-based anomaly detection can identify the rare execution context around a
    malicious port monitor. Use an Isolation Forest or provenance-graph detector on features including
    DLL path entropy, signature validity, prevalence, the presence of a linked Print\Monitors registry
    modification, and parent/ancestry context to score each spoolsv load, detecting the rare spoolsv->new-DLL->registry
    subgraph in streaming audit data and surfacing the top-3 contributing features. A flagged rare subgraph
    that ties a spooler DLL load to a recent monitor-registry change is a high-value persistence lead;
    common, well-connected benign subgraphs score low.
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: All Windows Endpoints, Windows Print Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FEATURES per spoolsv module load:\n  path_entropy, signature_valid, prevalence, linked_print_monitors_reg_mod,\n\
      \  parent_ancestry\nMODEL IsolationForest / provenance-graph (ProvDetector/UNICORN)\nDETECT rare\
      \ spoolsv -> new_DLL -> registry subgraph\nEMIT host, subgraph, anomaly_score, top_3_features"
- question: Is spoolsv.exe initiating outbound connections to non-RFC1918 destinations that match threat-intelligence
    C2 indicators or fall outside the allowlist of legitimate print/update services?
  context: The Print Spooler service almost never needs to reach the public internet, so any external
    egress from spoolsv.exe is inherently suspicious and may indicate that an adversary's port-monitor
    DLL is beaconing to C2. Alert when spoolsv.exe initiates outbound connections (Sysmon 3 / Zeek conn.log
    / dns.log) that match TI C2 indicators or that go to non-RFC1918 destinations outside the curated
    print/update allowlist. A match to known C2 or an unexpected internet destination is high-fidelity;
    internal connections to print and update infrastructure are expected. Pivot on the destination, resolve
    the responsible DLL, and correlate with the registry/load questions above.
  answer_sources:
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints, Network Egress Points (Firewalls, Proxies), DNS Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SOURCE EventID IN (Sysmon:3) WHERE image ENDSWITH \"spoolsv.exe\"\nWHERE NOT dest_ip IN rfc1918\n\
      \  AND (dest_ip IN ti_c2 OR dest_domain IN ti_c2\n       OR NOT dest IN print_update_allowlist)\n\
      | eval severity = \"high\"\n| table _time, host, dest_ip, dest_domain, dest_port, bytes_out"
  - technology: Zeek/pseudocode
    query: 'conn.log/dns.log JOIN process_owner = spoolsv.exe

      WHERE id.resp_h NOT IN rfc1918 AND id.resp_h NOT IN allowlist

      OR query IN ti_c2_domains'
- question: Are spoolsv.exe network destinations in the bottom 1st percentile of fleet prevalence or showing
    failure-mode signals (NXDOMAIN, RST/blocked, repeated connect failures) indicative of dead or rotating
    C2?
  context: 'Rare destinations and connection-failure patterns betray adversary infrastructure. Flag spoolsv.exe
    destinations whose domain/TLD fall in the bottom 1st percentile of fleet prevalence and score query-name
    entropy with an Isolation Forest. Separately profile failure-mode signals: NXDOMAIN DNS responses,
    blocked or RST-terminated connections, and repeated connect failures, which are distinct indicators
    of dead or rotating C2 as an actor cycles through infrastructure. A rare, high-entropy destination
    or a cluster of resolution/connection failures from the spooler is a strong lead; stable, common print/update
    destinations are benign.'
  answer_sources:
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints, Network Egress Points (Firewalls, Proxies), DNS Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "SOURCE (Sysmon:3, Zeek conn.log, Zeek dns.log) WHERE proc=\"spoolsv.exe\"\n| stats dc(host)\
      \ AS hc, count(eval(dns_rcode==\"NXDOMAIN\")) AS nxd,\n        count(eval(conn_state IN (\"REJ\"\
      ,\"RSTO\",\"S0\"))) AS fails BY dest_domain\n| eventstats perc1(hc) AS p1\n| eval qname_entropy\
      \ = shannon(dest_domain)\n| where hc <= p1 OR nxd > 0 OR fails >= 3 OR qname_entropy > 3.5"
- question: Do spoolsv.exe outbound connections exhibit low-jitter periodic cadence consistent with C2
    beaconing?
  context: Automated beacons produce regular inter-arrival timing. Score the inter-arrival regularity
    of spoolsv.exe connections via FFT/autocorrelation (BAYWATCH-style) and flag low-jitter periodic cadence
    characteristic of beaconing. Because the spooler should not be making repeated, clockwork outbound
    connections at all, detecting a periodic signal here is especially meaningful. A strong periodic component
    with minimal jitter is a high-confidence beaconing indicator; bursty, irregular, or absent egress
    is consistent with benign behavior. Combine with the destination-rarity and TI questions to confirm.
  answer_sources:
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints, Network Egress Points (Firewalls, Proxies), DNS Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SOURCE (Sysmon:3, Zeek conn.log) WHERE proc="spoolsv.exe"

      | stats list(_time) AS times BY host, dest_ip

      | eval deltas = diff(times)

      | eval period = fft_dominant(deltas), jitter = stdev(deltas)/avg(deltas)

      | where period IS NOT NULL AND jitter < 0.15'
- question: When spoolsv.exe traffic volume, connection frequency, and duration are scored by an online
    autoencoder, which flows produce reconstruction-error spikes consistent with beaconing or large transfers?
  context: An unsupervised online model adapts to changing baselines and catches both beacon-like and
    bulk-transfer anomalies. Score orig_bytes (Volume), connections per minute (Frequency), and connection
    duration with an online autoencoder ensemble (Kitsune-style) and flag reconstruction-error spikes
    for beacon-like patterns or large data transfers, reporting the top contributing flow features. For
    spoolsv.exe, which has a very narrow normal network profile, any reconstruction-error spike is notable.
    A high reconstruction error tied to large orig_bytes suggests exfiltration via the spooler context;
    periodic small flows suggest beaconing. Use the feature attribution to prioritize triage.
  answer_sources:
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints, Network Egress Points (Firewalls, Proxies), DNS Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'FEATURES per spoolsv flow: orig_bytes, conns_per_min, duration

      MODEL online autoencoder ensemble (Kitsune)

      WHERE reconstruction_error > dynamic_threshold

      EMIT host, dest, recon_error, top_feature_contributions'
- question: Did a known privilege-escalation tool (e.g., PrintSpoofer) execute and, within 60 seconds
    on the same host, get followed by a registry write to a Print\Monitors 'Driver' value?
  context: For Privilege Escalation, adversaries chain a SYSTEM-abuse tool with a Print\Monitors write
    to load their DLL as SYSTEM via the spooler. Alert when a PrintSpoofer-like image/hash triggers process
    creation (Sysmon 1 / 4688) and is followed by a Print\Monitors 'Driver' registry write within 60 seconds
    on the same host, correlating the two into an ATT&CK-tagged escalation chain. Maintain and tune the
    escalation-tool list against emulation samples. A tool-execution-then-monitor-write sequence is high-fidelity
    for active escalation; isolated tool execution or isolated registry writes still warrant review but
    with lower confidence.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - 'NAI: All Windows Endpoints, Windows Servers (Non-Domain Controllers)'
  range: Last 90 days (correlate within a 60-second window on the same host)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SOURCE EventID IN (Sysmon:1, 4688)\nWHERE lower(process_name) IN escalation_tool_watchlist\
      \ OR sha256 IN escalation_tool_hashes\n| join host WITH (SOURCE EventID IN (Sysmon:13,4657)\n  \
      \    WHERE registry_path MATCHES \"...\\\\Print\\\\Monitors\\\\*\\\\Driver\") AS r\nWHERE (r._time\
      \ - _time) BETWEEN 0s AND 60s\n| eval severity=\"high\" | table _time, host, process_name, sha256,\
      \ r.registry_path"
- question: Are command lines that modify Print\Monitors anomalously long or high-entropy (>2-sigma above
    the admin baseline), or preceded by failed/access-denied registry writes indicating trial-and-error
    escalation?
  context: Obfuscated or scripted escalation commands differ statistically from routine admin activity.
    Score the length and Shannon entropy of command lines that modify Print\Monitors and alert when they
    exceed 2-sigma above the administrative baseline. Additionally profile failed/access-denied registry
    writes (4657) preceding a successful write as evidence of trial-and-error privilege probing. A long,
    high-entropy command line writing the monitor key, or a denied-then-succeeded sequence, indicates
    deliberate escalation rather than a routine installer; normal installer activity uses short, predictable
    command lines and succeeds on the first attempt.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - 'NAI: All Windows Endpoints, Windows Servers (Non-Domain Controllers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "SOURCE EventID IN (Sysmon:1,4688)\nWHERE command_line MATCHES \"*Print\\\\Monitors*\"\n| eval\
      \ cl_len=len(command_line), cl_entropy=shannon(command_line)\n| eventstats avg(cl_len) AS mu_l,\
      \ stdev(cl_len) AS sd_l,\n             avg(cl_entropy) AS mu_e, stdev(cl_entropy) AS sd_e\n| where\
      \ cl_len > mu_l+2*sd_l OR cl_entropy > mu_e+2*sd_e\n| join host,user WITH (SOURCE 4657 WHERE result=\"\
      access denied\"\n      AND registry_path MATCHES \"...\\\\Print\\\\Monitors*\") AS denied"
- question: Are there renamed or obfuscated reg.exe/installer command lines that semantically match a
    Print\Monitors-write but evade exact-string detection?
  context: Sophisticated actors rename LOLBins and obfuscate arguments to bypass signature rules. Apply
    an adaptive misuse detector (AMIDES-style) that flags renamed/obfuscated reg.exe or installer command
    lines which semantically match the Print\Monitors-write rule but evade exact string matches, reporting
    which rule was evaded for analyst explainability. A semantic match against the monitor-write rule
    despite evasion is a strong escalation indicator and demonstrates intent to hide; the explainability
    output tells the analyst exactly which deterministic rule the actor tried to dodge. This complements
    the exact-match symbolic rules.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - 'NAI: All Windows Endpoints, Windows Servers (Non-Domain Controllers)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'MODEL AMIDES adaptive misuse detector over process command lines

      TARGET RULE = Print\Monitors Driver-write signature

      WHERE semantic_match_score >= threshold AND exact_string_match == false

      EMIT host, command_line, evaded_rule, score'
- question: Do Sysmon event sequences (Event IDs 1,7,11,13) on a host produce high reconstruction error
    against an LSTM model trained on normal sequences, matching known exploit patterns?
  context: Escalation via port monitors unfolds as a distinctive event sequence. Train an LSTM sequence/anomaly
    model (DeepLog-style) on normal Sysmon sequences of process-create (1), module-load (7), file-create
    (11), and registry-set (13) events, then flag high-reconstruction-error chains that match exploit
    patterns, with per-workflow diagnosis pinpointing the anomalous step. A high-error sequence that resembles
    the create-DLL->write-monitor->spooler-load pattern is a strong escalation lead; routine sequences
    reconstruct well. Use the per-workflow diagnosis to focus triage on the specific deviating events.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Sysmon Event ID 13
