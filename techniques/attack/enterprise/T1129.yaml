- question: 'Using the symbolic logic approach ''allow-list of standard module directories'', can you
    determine whether a shared module load on this host represents adversary code execution (T1129)? Symbolic
    Logic: 1) Maintain an allow-list of standard module-load directories (`C:\Windows\System32\*`, `C:\Windows\SysWOW64\*`,
