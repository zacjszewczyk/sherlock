  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: TI hash/signer match on module load\nMATCH module_load_events\
      \  // Sysmon EID 7 / auditd SYSCALL / macOS dyld\nWHERE matches_high_risk_condition(module)  //\
      \ TI hash/signer, unsigned,\n      // UNC or user-writable path, off allow-list, sensitive loader,\
      \ etc.\nOPTIONAL correlate file_create (EID 11) -> image_load (EID 7) same path within 5m\nOPTIONAL\
      \ correlate image_load -> network_connect (EID 3) non-RFC1918 within 2m\nEMIT alert WITH host, loader_process,\
      \ parent, module_path, signer, sha256"
- question: 'Using the statistical method approach ''fleet signer/hash prevalence floor'', can you determine
    whether a shared module load on this host represents adversary code execution (T1129)? Statistical
    Method: 2) Maintain a fleet-wide prevalence baseline of each module (signer, SHA256, name) over 30
    days as in [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).
    Alert on any load whose signer/hash prevalence is in the bottom 1st percentile or is first-seen across
    the fleet. Use the robust modified Z-score (median/MAD, flag |M|>3.5) rather than mean-based thresholds
    to resist skew from a few noisy hosts, per [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).
    Frequency metric: count of distinct hosts loading the module per day.'
