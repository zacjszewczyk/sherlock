- question: 'Using the statistical method approach ''path-set entropy per process'', can you determine
    whether a shared module load on this host represents adversary code execution (T1129)? Statistical
    Method: 2) For each process compute the Shannon entropy $$H(X) = -\sum_{i=1}^{n} p(x_i)\log_2 p(x_i)$$
    of its module-load directory distribution over a rolling 24h window, and also the entropy of module
    FILENAMES (random/high-entropy dropped names) per [Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).
    Alert when a process''s entropy exceeds its own baseline by a modified-Z threshold (|M|>3.5, [Modified
    Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)), indicating
    loads from an unusually diverse path set.'
