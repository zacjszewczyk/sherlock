- question: 'Using the symbolic logic approach ''high-risk path + unsigned module load'', can you determine
    whether a shared module load on this host represents adversary code execution (T1129)? Symbolic Logic:
    1) Define high-risk path patterns: UNC (`\\*`), user-writable dirs (`C:\Users\*\AppData\*`, `C:\ProgramData\*`,
    `C:\Windows\Temp\*`, `C:\Perflogs\*`), web roots (`C:\inetpub\wwwroot\*`), and on Linux/macOS `/tmp`,
    `/dev/shm`, `~/Library`. Alert on any module load where `ImageLoaded` matches a high-risk pattern
    AND `Signed`=''false'' OR `SignatureStatus`!=''Valid''. This covers side-loading and phantom DLLs
    per [4 Ways Adversaries Hijack DLLs](https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/)
    and abnormal-path loads per [DLL Search Order Hijacking (T1574.001)](https://attack.mitre.org/techniques/T1574/001/).'
