name: 'T1129: Shared Modules'
id: 814a387f-7d99-469c-a3e9-a1109ec4e3de
description: 'This playbook helps an analyst determine whether an adversary executed malicious code by
  loading a shared module (T1129): a DLL on Windows, or a shared object (.so/.dylib) on Linux/macOS loaded
  into a process via LoadLibrary, dlopen/dlsym, LD_PRELOAD, or dyld. It correlates host module-load telemetry
  (Sysmon Event ID 7, Windows CodeIntegrity/Operational, auditd SYSCALL, macOS unified log and EndpointSecurity)
  with file-creation, process-creation, and network-connection events to surface side-loading, phantom/abnormal-path
  DLLs, and dropper-then-load chains. Investigative angles include: threat-intel hash/signer matches and
  signature-validation failures on loaded modules; modules loaded from UNC paths or user-writable/temporary
  directories (%APPDATA%, %TEMP%, ProgramData, /tmp, /dev/shm, ~/Library); statistically rare load paths
  or filenames per process and across the fleet; files written and then loaded within minutes (especially
  by browsers, Office apps, and script interpreters); sensitive system processes (lsass.exe, svchost.exe,
  csrss.exe, winlogon.exe) loading first-seen modules; and suspicious loads immediately followed by external
  network egress. Detection blends symbolic-logic rules (TI matches, high-risk-path allow/deny lists,
  write-then-load correlation), statistical baselining (fleet prevalence floors, modified Z-score on median/MAD,
  Shannon entropy, write-to-load time deltas, destination rarity), and machine learning (gradient-boosted
  classifiers, LSTM/HMM sequence models, provenance GNNs and graph autoencoders) to produce evasion-resistant,
  explainable alerts for the Execution tactic.'
type: technique
