questions:
- question: 'Using the symbolic logic approach ''TI hash/signer match on module load'', can you determine
    whether a shared module load on this host represents adversary code execution (T1129)? Symbolic Logic:
    1) Query Sysmon Event ID 7 (and the Linux/macOS module-load equivalents) where the loaded module''s
    SHA256 (`Hashes` field) matches a known-malicious indicator, OR the `Signature`/`SignatureStatus`
    is invalid/expired/revoked OR the signer is on an untrusted-signer list. Treat signer mismatch (a
    signed legitimate host binary loading a DLL signed by a different or no authority from an adjacent
    writable path) as side-loading per [4 Ways Adversaries Hijack DLLs](https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/).
    State signal (Principle 5): separately count `Microsoft-Windows-CodeIntegrity/Operational` signature-validation
    FAILURES per host as a distinct indicator of forced loads of unsigned modules.'
  context: 'Tactic context (Execution): adversaries load shared modules (DLLs, .so, .dylib) into processes
    to run arbitrary payloads -- modularizing C2, evasion, or on-objective actions -- because module loading
    reuses trusted, legitimate code paths and is easy to overlook. Evidence under investigation: A module
    load event is recorded where the loaded module''s hash (SHA256) matches a known malicious indicator,
    or its digital signature is associated with a known untrusted entity. Approach (TI hash/signer match
    on module load): Symbolic Logic: 1) Query Sysmon Event ID 7 (and the Linux/macOS module-load equivalents)
    where the loaded module''s SHA256 (`Hashes` field) matches a known-malicious indicator, OR the `Signature`/`SignatureStatus`
    is invalid/expired/revoked OR the signer is on an untrusted-signer list. Treat signer mismatch (a
    signed legitimate host binary loading a DLL signed by a different or no authority from an adjacent
    writable path) as side-loading per [4 Ways Adversaries Hijack DLLs](https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/).
    State signal (Principle 5): separately count `Microsoft-Windows-CodeIntegrity/Operational` signature-validation
    FAILURES per host as a distinct indicator of forced loads of unsigned modules. A positive result means
    a process loaded a module that is malicious, untrusted, abnormally located, freshly dropped, or otherwise
    anomalous for that process/host/fleet; a negative result means observed loads match expected, signed,
    well-known baselines. Investigate the named area of interest (All Enterprise Endpoints (Workstations
    and Servers), Domain Controllers) and pivot from any hit to the loading process, its parent, the module''s
    origin on disk, the writing process, and any follow-on execution or network egress.'
