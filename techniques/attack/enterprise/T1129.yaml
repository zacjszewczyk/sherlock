- question: 'Using the machine learning approach ''gradient-boosted module classifier with explainability'',
    can you determine whether a shared module load on this host represents adversary code execution (T1129)?
    Machine Learning: 3) Score each load with a gradient-boosted decision-tree classifier (e.g., LightGBM)
    over static module metadata (signature status, signer, name entropy, path features, import set) following
    the EMBER baseline in [EMBER: An Open Dataset for Training Static PE Malware ML Models](https://arxiv.org/pdf/1804.04637).
    Alert above a tuned probability threshold AND emit the top-3 contributing features (SHAP) in the alert
    text (Principle 4), e.g., ''unsigned=+0.4, path=AppData +0.3, name_entropy=4.8 +0.2''. Keep the deterministic
    rule in (1) live in parallel (Principle 1).'
