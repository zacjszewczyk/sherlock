- question: '[Credential Access] Flag weak cipher use: Can you determine whether a Kerberos TGS request
    (Event ID 4769) is logged with Ticket Encryption Type 0x17 (RC4-HMAC) and TicketOptions 0x40810000
    for a user-account SPN (Service Name not ending in $, excluding krbtgt) that is not on an approved
    legacy RC4 allowlist, indicating the target service is being roasted for offline cracking. In AES-capable
    domains, RC4 downgrade is the canonical Kerberoasting signature. -- specifically, using the ''Flag
    weak cipher use'' (Symbolic Logic) approach?'
