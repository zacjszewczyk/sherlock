questions:
- question: '[Credential Access] Detect TGS bursts: Can you determine whether a Domain Controller records
    a sharp burst of Kerberos TGS requests (Event ID 4769) for many distinct SPNs from a single user account
    or source IP, concentrated in a short time window consistent with offline-roasting preparation rather
    than normal application access. Burst enumeration is the strongest behavioral indicator because cracking
    happens offline and is invisible to the DC. -- specifically, using the ''Detect TGS bursts'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary performs Kerberoasting
    -- requesting Kerberos TGS service tickets for SPNs and cracking the RC4-encrypted hashes offline
    to recover service-account credentials that then enable persistence, privilege escalation, and lateral
    movement via valid accounts. Because the cracking is offline and silent, the detectable signal lives
    in the request-side behavior on domain controllers and the network. This evidence focuses on the condition
    that a Domain Controller records a sharp burst of Kerberos TGS requests (Event ID 4769) for many distinct
    SPNs from a single user account or source IP, concentrated in a short time window consistent with
    offline-roasting preparation rather than normal application access. Burst enumeration is the strongest
    behavioral indicator because cracking happens offline and is invisible to the DC. This Symbolic Logic
    approach works as follows: Alert when one Account Name or Client Address requests an unusually high
    count of distinct Service Names within a short interval (start at >= 15 distinct user-account SPNs
    in 5 minutes, then tune to environment) per the distinct-SPN burst pattern in [Suspicious Kerberos
    RC4 Ticket Encryption / Kerberoasting Activity, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_rc4_kerberos.yml)
    and [Cracking Kerberos TGS Tickets Using Kerberoast, Metcalf](https://adsecurity.org/?p=3458). Keep
    this concrete threshold as the deterministic floor and exclude known service accounts (SCCM, Exchange).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable Kerberoasting
    activity; pivot to the requesting account and source host, the set of targeted SPNs and the services/servers
    behind them, the encryption type and ticket options requested, any preceding TGT request or interactive
    logon, and whether the implicated service accounts should be rotated and moved to AES with long, random
    passwords (or gMSA). A negative result helps rule out this particular roasting vector but should be
    corroborated with the other questions in this playbook, since a single method can miss low-and-slow
    enumeration or activity that blends into legitimate service usage.'
