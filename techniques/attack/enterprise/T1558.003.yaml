    that a Domain Controller records a sharp burst of Kerberos TGS requests (Event ID 4769) for many distinct
    SPNs from a single user account or source IP, concentrated in a short time window consistent with
    offline-roasting preparation rather than normal application access. Burst enumeration is the strongest
    behavioral indicator because cracking happens offline and is invisible to the DC. This Statistical
    Method approach works as follows: Baseline each account''s distinct-SPN count over rolling 5-minute
    windows for several weeks and flag values exceeding the 99th percentile or 3 standard deviations /
    Median Absolute Deviation above its own history, as recommended in [Trimarc Research: Detecting Kerberoasting
    Activity](https://www.trimarcsecurity.com/post/trimarc-research-detecting-kerberoasting-activity)
    and [Detecting Kerberoasting Activity, Microsoft](https://techcommunity.microsoft.com/blog/microsoft-security-blog/detecting-kerberoasting-activity/258330);
    combine PCA/k-means/MAD ensemble scoring over volume, distinct-SPN, and timing features to cut false
    positives per [Bohara et al.](https://mnoureddine.com/files/17BOH01.pdf). A positive result -- a rule
    match, statistical outlier, or model alert -- indicates probable Kerberoasting activity; pivot to
    the requesting account and source host, the set of targeted SPNs and the services/servers behind them,
    the encryption type and ticket options requested, any preceding TGT request or interactive logon,
    and whether the implicated service accounts should be rotated and moved to AES with long, random passwords
    (or gMSA). A negative result helps rule out this particular roasting vector but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow enumeration
    or activity that blends into legitimate service usage.'
