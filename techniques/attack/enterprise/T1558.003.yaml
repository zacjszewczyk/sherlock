name: 'T1558.003: Kerberoasting'
id: dde2aa75-9c70-4519-b9d2-ae0805a27c83
description: 'This playbook helps an analyst investigate suspected Kerberoasting (T1558.003) under the
  Credential Access tactic, in which an adversary holding a valid Kerberos ticket-granting ticket (TGT)
  requests ticket-granting service (TGS) tickets for service principal names (SPNs) so the RC4-encrypted
  (etype 0x17) portions can be cracked offline to recover service-account plaintext credentials -- credentials
  that enable persistence, privilege escalation, and lateral movement via valid accounts. Because the
  cracking happens offline and is invisible to the domain controller, the hunt centers on the request-side
  behavior visible on DCs and on the network: sharp bursts of Kerberos TGS requests (Windows Event ID
  4769) for many distinct user-account SPNs from a single account or source host; RC4 cipher downgrade
  on TGS requests in otherwise AES-capable domains (including KDC Event ID 42 downgrade errors for CVE-2022-37966);
  anomalous unique-SPN request volume versus an account''s historical baseline; requests for high-value
  or tier-0 SPNs from unexpected hosts, times, or requesters that have never legitimately accessed them;
  and elevated rates of failed or malformed Kerberos operations (Events 4768/4769/4771) consistent with
  SPN enumeration probing. Detection methods combine deterministic symbolic-logic rules (distinct-SPN
  burst thresholds, RC4-allowlist violations, failed-operation bursts), statistical baselining (per-account
  SPN fan-out percentiles, encryption-type rarity, failure-ratio sequential hypothesis testing), and machine-learning
  models (LSTM log-sequence anomaly detection, imbalance-aware classifiers, authentication-graph link
  prediction) applied to Windows Security event logs and Zeek kerberos/conn telemetry, so the analyst
  can corroborate suspected roasting across request volume, cipher choice, target sensitivity, and failure
  patterns.'
type: technique
