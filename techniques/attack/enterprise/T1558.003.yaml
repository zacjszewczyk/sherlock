- question: '[Credential Access] Baseline SPN fan-out: Can you determine whether a Domain Controller records
    a sharp burst of Kerberos TGS requests (Event ID 4769) for many distinct SPNs from a single user account
    or source IP, concentrated in a short time window consistent with offline-roasting preparation rather
    than normal application access. Burst enumeration is the strongest behavioral indicator because cracking
    happens offline and is invisible to the DC. -- specifically, using the ''Baseline SPN fan-out'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary performs Kerberoasting
    -- requesting Kerberos TGS service tickets for SPNs and cracking the RC4-encrypted hashes offline
    to recover service-account credentials that then enable persistence, privilege escalation, and lateral
