name: 'T1566: Phishing'
id: c60f61b6-2880-4cfa-8149-5b8016333d5e
description: 'Investigate suspected phishing-based initial access (T1566). This playbook helps an analyst
  determine whether an adversary delivered malicious email, links, or attachments to gain a foothold,
  and whether a recipient acted on that delivery. It correlates inbound email metadata and authentication
  verdicts (SPF/DKIM/DMARC, reply-to and display-name mismatches, punycode and lookalike sender domains,
  risky attachment types) with downstream activity: threat-intelligence indicator matches in delivery
  and download paths, Office/browser/mail-client processes spawning script interpreters or LOLBins, short-window
  DNS-to-HTTP-POST chains to newly registered or low-reputation domains, anomalous new-sender volume and
  recipient distribution, and credential submission followed by anomalous logins to enterprise and cloud
  identity providers. Use it to confirm or rule out phishing as the entry vector and to scope the affected
  users, hosts, and accounts.'
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any inbound email, web connection, or file download contain a URL, domain, IP, or file
    hash that matches an active threat-intelligence indicator, and did that indicator appear in a delivery
    or download path tied to a specific recipient within minutes of the message arriving?
  context: 'This addresses phishing as an Initial Access vector by joining known-bad indicators to actual
    delivery context, not just passive sightings. Match Zeek smtp/dns/conn/files/http fields and Microsoft
    365 Message Trace sender/recipient metadata against CTI feeds, then alert only when the indicator
    lands in a delivery or download path attributable to a user within ~30 minutes of email receipt. Crucially,
    layer this above email-authentication verdicts: mail providers still inbox spoofed messages carrying
    known-bad URLs or hashes, so a clean SPF/DKIM/DMARC verdict does not clear an indicator hit. A positive
    result is strong evidence of an attempted or successful foothold; scope the recipient, the host, and
    any executed payload. A negative result lowers but does not eliminate suspicion, since novel indicators
    may not yet be in feeds. References: [End-to-End Measurements of Email Spoofing Attacks](https://www.usenix.org/conference/usenixsecurity18/presentation/hu).'
  answer_sources: &id001
  - Zeek files.log
  - Zeek smtp.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Microsoft 365 Message Trace
  - Microsoft 365 Unified Audit Log
  - 'NAI: Email Gateway, Web Proxy, DNS Resolvers, User Endpoints'
  range: Last 90 days (correlate within 30 minutes of message receipt)
  queries:
  - technology: Zeek/pseudocode
    query: "  cti = load_indicators(type in [domain, ip, url, md5, sha256])\n  hits = union(smtp.log,\
      \ dns.log, conn.log, files.log, http.log)\n         where (domain|host|resp_h|url|md5|sha256) in\
      \ cti\n  join M365_message_trace on recipient/sender within 30m of delivery\n  alert where indicator\
      \ in delivery_or_download_path(user)"
  - technology: SIEM/Rule pseudocode
    query: "  index=email OR index=proxy OR index=zeek\n  | lookup cti_indicators value AS (url,domain,src_ip,file_hash)\
      \ OUTPUT feed,confidence\n  | join user [search index=email message_trace]\n  | where indicator_seen_in_delivery\
      \ AND time_delta<=30m\n  | table _time,user,host,indicator,feed,delivery_path"
- question: Are we seeing an anomalous spike in hits against newly published, aged, or low-prevalence
    threat-intelligence indicators, or bursts of first-seen-domain DNS resolutions and NXDOMAINs to newly
    registered domains, relative to our environment's normal feed hit rates?
  context: 'Targeted phishing often uses freshly stood-up infrastructure, so the age and prevalence of
    an indicator carry signal. Track per-feed hit rates and indicator age and flag spikes where newly
    published or low-prevalence indicators suddenly exceed the 95th percentile for the environment. Treat
    first-seen-domain DNS resolutions and NXDOMAIN bursts toward newly registered domains as distinct
    failure-mode signals (campaign setup, fast-flux, or typo''d lures). Derive percentile thresholds from
    90 days of per-feed history. A breach of threshold suggests an active campaign against your users;
    pivot to the specific recipients and hosts driving the spike. References: [Detecting Credential Spearphishing
    Attacks in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
  answer_sources: *id001
  range: Last 90 days (per-feed baseline; alert on current-day spikes)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  base = stats by feed: hit_rate, indicator_age over 90d\n  p95 = percentile(hit_rate, 95)\
      \ by feed\n  alert where today.hit_rate > p95 AND indicator_age < 7d\n  alert where count(first_seen_domain_resolution)\
      \ OR nxdomain_burst(newly_registered) > baseline"
- question: When a threat-intelligence indicator matches, how should we prioritize it for triage using
    a calibrated risk score that weighs indicator age, feed reliability, file type, user role, and follow-on
    network activity?
  context: 'Raw CTI matches generate volume; a model focuses analyst attention. Score each match with
    a gradient-boosted classifier using features such as indicator age, feed reliability, observed file
    type, recipient role/value, and any follow-on network activity. Prioritize alerts above a calibrated
    threshold (e.g., > 0.9) and surface the top-3 contributing features in the alert text so the analyst
    can act immediately. A high score against a high-value user with corroborating network activity is
    an escalation; a low score on a stale, low-reliability indicator can be deprioritized but logged.
    References: [A Modular and Adaptive System for Business Email Compromise Detection](https://arxiv.org/abs/2308.10776).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  features = [indicator_age, feed_reliability, file_type, user_role, followon_net_activity]\n\
      \  score = gbm.predict(features)\n  if score > 0.9: alert(priority=high, explain=top3_features(score))"
- question: Do any inbound messages exhibit header or attachment spoofing hallmarks - SPF fail/softfail,
    DMARC misalignment between the visible From and the authenticated domain, reply-to or display-name
    mismatch, punycode/lookalike sender domains, risky attachment extensions (.iso, .lnk, .js, .vbs, .hta,
    double extensions), or multiple/ambiguous From headers?
  context: 'These are the deterministic hallmarks of phishing delivery. Flag SPF fail/softfail (RFC 7208)
    or DMARC identifier misalignment (RFC 7489) between the visible From and the SPF/DKIM-authenticated
    domain, reply-to mismatch, display-name impersonation, punycode/lookalike domains, and risky attachment
    types. Re-parse and normalize headers to catch multiple or ambiguous From headers and RFC5321-vs-RFC5322
    mismatches that slip past a single auth verdict (''Composition Kills'', ''Weak Links in Authentication
    Chains''). A hit identifies a candidate phishing message to pull from mailboxes and detonate; absence
    of these hallmarks does not clear well-crafted or compromised-account phishing. References: [RFC 7208](https://www.rfc-editor.org/rfc/rfc7208);
    [RFC 7489](https://www.rfc-editor.org/rfc/rfc7489); [Composition Kills](https://www.usenix.org/conference/usenixsecurity20/presentation/chen-jianjun);
    [Weak Links in Authentication Chains](https://www.usenix.org/conference/usenixsecurity21/presentation/shen-kaiwen).'
  answer_sources: &id002
  - Zeek smtp.log
  - Zeek files.log
  - Microsoft 365 Message Trace
  - Microsoft 365 Unified Audit Log
  - 'NAI: Email Gateway, Mail Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  index=email\n  | eval spf_fail=(spf in [fail,softfail]), dmarc_misalign=(from_domain !=\
      \ auth_domain)\n  | eval replyto_mismatch=(replyto_domain != from_domain), display_impersonation=lookalike(display_name)\n\
      \  | eval punycode=match(from_domain,\"xn--\"), risky_attach=attach_ext in [iso,lnk,js,vbs,hta]\
      \ OR double_ext\n  | eval multi_from=(count_from_headers>1)\n  | where spf_fail OR dmarc_misalign\
      \ OR replyto_mismatch OR display_impersonation OR punycode OR risky_attach OR multi_from"
  - technology: Zeek/pseudocode
    query: "  smtp.log: extract From, Reply-To, helo, auth results\n  files.log: extract attachment mime/extension\n\
      \  alert on auth_fail OR replyto_mismatch OR risky_extension"
- question: Are any inbound sender domains or embedded-URL domains close lookalikes of our protected brand
    or partner domains - within edit distance 1-2, or homophone/TLD-swap variants?
  context: 'Typosquatting and lookalike domains are a hallmark of brand-impersonation phishing. Flag inbound
    sender or embedded-URL domains within Levenshtein/Damerau distance 1-2 of a maintained protected-domain
    list, plus homophone and TLD-swap variants (e.g., .co for .com). This catches lures that pass authentication
    on attacker-owned but visually similar domains. A match warrants pulling the message and checking
    whether recipients interacted with embedded links; maintain the protected-domain list to keep false
    positives low. References: [The Landscape of Domain Name Typosquatting](https://arxiv.org/abs/1603.02767).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  protected = load_protected_domains()\n  index=email | eval cand=mvappend(from_domain, url_domains)\n\
      \  | where any(d in cand): min_edit_distance(d, protected) in [1,2]\n         OR homophone_variant(d,\
      \ protected) OR tld_swap(d, protected)\n  | table _time,recipient,from_domain,url_domains,matched_brand"
- question: Relative to a 90-day per-organization baseline, which sender domains show anomalous message
    volume, recipient entropy, subject entropy, never-before-seen attachment types, or elevated SPF/DKIM/DMARC
    failure rates?
  context: 'Statistical baselining catches campaigns that no single deterministic rule flags. Baseline
    sender-domain-to-recipient patterns, subject entropy, attachment-type frequency, and auth-failure
    rates, then alert on sender domains with volume or recipient entropy above the 98th percentile, attachment
    types unseen in the last 90 days, or auth-fail rates above baseline. Derive thresholds per organization
    from 90-day history. A flagged domain is a candidate campaign source; pivot to the recipient set and
    any downstream clicks or executions. References: [Detecting Credential Spearphishing Attacks in Enterprise
    Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
  answer_sources: *id002
  range: Last 90 days (baseline window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  base = stats by sender_domain over 90d: volume, recipient_entropy, subject_entropy,\n  \
      \       attach_types, authfail_rate\n  alert where volume > p98 OR recipient_entropy > p98\n   \
      \     OR attach_type not in base.attach_types\n        OR authfail_rate > base.authfail_rate"
- question: Does a trained email classifier flag any message as phishing based on header/body features,
    high-entropy or malicious-scored URLs, brand-impersonation language, and urgency lures - with an explanation
    naming the top contributing tokens?
  context: 'A supervised model generalizes beyond static rules. Train an email classifier on header/body
    features (auth results, URL entropy, brand-impersonation terms, attachment types), score raw URLs
    with a character/word-level CNN (URLNet), and apply transformer/LLM intent models with LIME or attention
    attribution so each alert names the top contributing tokens (urgency cues, lures, impersonation language).
    This gives the analyst an explainable verdict on social-engineering intent. High-confidence hits with
    clear lure tokens should be escalated and the messages pulled. References: [URLNet](https://arxiv.org/abs/1802.03162);
    [An Explainable Transformer-based Model for Phishing Email Detection](https://arxiv.org/abs/2402.13871);
    [ChatSpamDetector](https://arxiv.org/abs/2402.18093).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  feats = header_body_features(email) + urlnet_score(urls) + intent_model(body)\n  score =\
      \ phish_classifier.predict(feats)\n  if score > threshold: alert(label=phishing, explain=lime_top_tokens(body))"
- question: Did an Office application, browser, or email client spawn a script interpreter or LOLBin (cmd.exe,
    powershell.exe, wscript.exe, cscript.exe, mshta.exe, regsvr32.exe, rundll32.exe) with download or
    encoded command-line arguments, corroborated by outbound network activity within minutes?
  context: This is the classic post-phish execution chain on the endpoint and the deterministic floor
    for detecting payload execution. Alert when Outlook/Word/Excel/PowerPoint or a browser spawns a script
    host or LOLBin with download or encoded arguments, then corroborate with outbound Zeek conn.log activity
    within ~5 minutes. A match strongly indicates a user executed a malicious attachment or link; isolate
    the host, capture the script/command line, and identify the originating message. Keep these concrete
    parent-child and argument rules as a hard baseline regardless of model coverage.
  answer_sources: &id003
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - 'NAI: User Endpoints, Virtual Desktop Infrastructure (VDI) fleet, Application Servers'
  range: Last 90 days (correlate within 5 minutes of process spawn)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  index=endpoint (EventID=4688 OR Sysmon EventID=1)\n  | where parent in [outlook.exe,winword.exe,excel.exe,powerpnt.exe,chrome.exe,msedge.exe,firefox.exe]\n\
      \    AND child in [cmd.exe,powershell.exe,wscript.exe,cscript.exe,mshta.exe,regsvr32.exe,rundll32.exe]\n\
      \    AND cmdline matches (\"-enc\"|\"DownloadString\"|\"http\"|\"IEX\"|base64)\n  | join host [search\
      \ index=zeek conn.log within 5m] | table _time,host,user,parent,child,cmdline,dest"
  - technology: SIEM/Rule pseudocode (4104)
    query: "  index=endpoint EventID=4104 (ScriptBlockText matches encoded|download|IEX)\n  | correlate\
      \ with parent process = office/browser/mail client"
- question: Which parent-child process pairs or command-line tokens on a host fall below the 1st percentile
    of historical frequency, and are there bursts of child-process spawns per recipient in the minutes
    after an email delivery?
  context: 'Rare process relationships expose novel payloads that hardcoded rules miss. Maintain per-host
    baselines of parent-child process pairs and command-line token frequency, then alert on pairs or tokens
    below the 1st percentile of historical frequency. Additionally count post-delivery child-process spawns
    per recipient per 10 minutes as a volume/frequency signal of execution following phishing. A rare
    pair on a host shortly after an inbound message is a high-value lead; correlate with the delivering
    email and outbound connections. References: [Detecting and Characterizing Lateral Phishing at Scale](https://www.usenix.org/conference/usenixsecurity19/presentation/ho).'
  answer_sources: *id003
  range: Last 90 days (per-host baseline; 10-minute post-delivery window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  base = stats by host: freq(parent->child), freq(cmdline_token) over 90d\n  alert where freq(parent->child)\
      \ < p1 OR freq(token) < p1\n  also: count(child_spawn) by recipient per 10m after email_delivery\
      \ > baseline"
- question: Does a graph-based process-tree anomaly model or a one-class PowerShell script-block classifier
    flag any execution chain as anomalous, with the top contributing nodes/features reported?
  context: 'Modeling the whole process tree captures multi-stage execution that pairwise rules miss. Score
    process trees with a graph-based anomaly model and classify PowerShell script blocks with a one-class
    model trained on benign scripts, flagging high anomaly scores and reporting the top-3 contributing
    nodes/features in the alert. This surfaces obfuscated or living-off-the-land chains launched from
    Office/mail/browser parents. High anomaly scores warrant host isolation and review of the captured
    script content and network egress. References: [A Modular and Adaptive System for Business Email Compromise
    Detection](https://arxiv.org/abs/2308.10776).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  tree = build_process_graph(host, window)\n  a = graph_anomaly.score(tree)\n  s = oneclass_psh.score(scriptblocks)\n\
      \  if a > thr OR s > thr: alert(explain=top3_nodes_features(tree))"
- question: Did a host perform a DNS lookup to a newly registered (WHOIS age < 30 days) or low-reputation
    domain, immediately followed by an HTTP/S connection and an HTTP POST from the same host within minutes,
    including the URI and User-Agent context?
  context: 'This short-window chain is the network signature of credential submission or payload staging
    after a phishing click. Alert when a first-seen domain (WHOIS age < 30 days or low reputation) receives
    a DNS lookup followed by an HTTP/S connection and a POST from the same host within ~5 minutes, capturing
    URI and User-Agent. Treat preceding NXDOMAIN bursts and 404 responses to the same host as distinct
    failure-mode signals (probing or typo''d infrastructure). A complete chain is strong evidence of interaction
    with a phishing site; identify the user, the submitted data, and any follow-on logon. References:
    [End-to-End Measurements of Email Spoofing Attacks](https://www.usenix.org/conference/usenixsecurity18/presentation/hu).'
  answer_sources: &id004
  - Zeek smtp.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek files.log
  - 'NAI: DNS Resolvers, Web Proxy, User Endpoints'
  range: Last 90 days (correlate within 5 minutes per host)
  queries:
  - technology: Zeek/pseudocode
    query: "  q = dns.log where whois_age(query) < 30d OR low_reputation(query)\n  c = http.log/ssl.log\
      \ connection to same host within 5m\n  p = http.log method=POST same host within 5m\n  alert seq(q\
      \ -> c -> p) by orig_h with uri, user_agent\n  flag preceding nxdomain_burst OR http 404 to same\
      \ host"
- question: Which connections to rare destination domains show orig_bytes or POST body sizes above the
    99th percentile for the host, or rare JA3/JA3S fingerprints, especially to domains with low click
    reputation (few prior distinct internal visitors)?
  context: 'Volume and rarity features expose data submission to attacker infrastructure. Flag connections
    to rare domains where orig_bytes or POST body size exceeds the 99th percentile for that host and where
    JA3/JA3S TLS fingerprints are rare in the environment. Baseline click reputation as the count of prior
    distinct internal visitors to the destination domain - a domain visited by only one user is more suspicious.
    Large uploads to a rare, low-reputation domain suggest credential harvest or exfil; pivot to the user
    and any subsequent authentication events. References: [Detecting Credential Spearphishing Attacks
    in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
  answer_sources: *id004
  range: Last 90 days (per-host baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  base = stats by host: p99(orig_bytes), p99(post_size) over 90d\n  click_rep(domain) = distinct_count(internal_visitors,\
      \ domain)\n  alert where dest in rare_domains AND (orig_bytes>p99 OR post_size>p99)\n        AND\
      \ (ja3|ja3s rare) AND click_rep(domain) low"
- question: Does a sequence-anomaly model over per-host DNS->HTTP->POST chains, combined with URL CNN
    scoring and homoglyph visual-similarity detection, flag any destination as a likely phishing host
    where simple edit-distance checks fail?
  context: 'ML closes gaps left by deterministic and statistical checks. Model DNS->HTTP->POST sequences
    per host with sequence anomaly detection, score destination URLs with a character/word-level CNN (URLNet),
    and detect unicode/homoglyph lookalike hosts via a Siamese visual-similarity network where edit-distance
    fails. Surface the top-3 features driving each outlier. This catches visually deceptive credential-harvest
    domains and unusual interaction sequences. High-confidence outliers warrant pulling the full chain
    and checking for downstream logons. References: [URLNet](https://arxiv.org/abs/1802.03162); [Detecting
    Homoglyph Attacks with a Siamese Neural Network](https://arxiv.org/abs/1805.09738).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  seq_score = seq_anomaly.score(dns->http->post per host)\n  url_score = urlnet.score(dest_url)\n\
      \  homo = siamese_visual.match(dest_host, protected_domains)\n  if seq_score>thr OR url_score>thr\
      \ OR homo: alert(explain=top3_features)"
- question: Did the organization receive email from a first-seen external sender domain, and if so did
    it fail SPF/DKIM/DMARC or carry a reply-to that differs from the sender domain, with proper DMARC
    identifier alignment validated rather than a bare SPF/DKIM pass?
  context: 'New external senders that also fail authentication are a high-yield phishing filter. Alert
    on first-seen sender domains to the organization and escalate when SPF/DKIM/DMARC fail or reply-to
    differs from the sender domain. Validate DMARC identifier alignment (RFC 7489) rather than accepting
    a bare SPF/DKIM pass, since misaligned auth still permits spoofing (''Weak Links in Authentication
    Chains''). A first-seen domain with auth failure to multiple recipients is a candidate campaign; pull
    the messages and review links/attachments. References: [RFC 7489](https://www.rfc-editor.org/rfc/rfc7489);
    [Weak Links in Authentication Chains](https://www.usenix.org/conference/usenixsecurity21/presentation/shen-kaiwen).'
  answer_sources: &id005
  - Zeek smtp.log
  - Microsoft 365 Message Trace
  - Microsoft 365 Unified Audit Log
  - 'NAI: Email Gateway, Mail Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  index=email | eval first_seen=(sender_domain not in known_domains_90d)\n  | eval authfail=(spf=fail\
      \ OR dkim=fail OR dmarc=fail)\n  | eval misalign=(dmarc_aligned=false), replyto_diff=(replyto_domain!=sender_domain)\n\
      \  | where first_seen AND (authfail OR misalign OR replyto_diff)"
- question: Which external sender domains show message-volume spikes above 3 standard deviations from
    baseline, or sudden concentration of recipients into high-value targets, indicating a bursty targeted
    campaign?
  context: 'Targeted phishing campaigns are bursty and role-skewed, which baselining exposes. Monitor
    per-domain message volume and recipient entropy, then flag domains with volume spikes above 3 standard
    deviations or sudden concentration into high-value targets (executives, finance, IT admins). Derive
    per-org thresholds from 90-day history. A spike narrowly aimed at high-value recipients is a strong
    campaign indicator; prioritize those recipients for message review and account monitoring. References:
    [Detecting Credential Spearphishing Attacks in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
  answer_sources: *id005
  range: Last 90 days (baseline window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  base = stats by sender_domain over 90d: mean(volume), std(volume), recipient_set\n  alert\
      \ where today.volume > mean + 3*std\n        OR concentration(recipients) in high_value_targets"
- question: Does an autoencoder over sender-domain feature vectors flag high reconstruction error, or
    - for internally-originated lateral phishing that passes authentication - does a random forest over
    recipient-unlikelihood, URL-risk, and phishing-language features flag the message, with top features
    reported?
  context: 'Two model types cover external and internal phishing. Score sender-domain feature vectors
    (volume, recipient diversity, auth results, URL characteristics) with an autoencoder and alert on
    high reconstruction error for anomalous external senders. For internally-originated lateral phishing
    from compromised accounts that passes authentication, apply a random forest over recipient-unlikelihood,
    URL-risk, and phishing-language features and report the top-3 contributing features. Lateral phishing
    is especially dangerous because it carries trust; flagged internal senders may indicate an already-compromised
    account requiring containment. References: [Detecting and Characterizing Lateral Phishing at Scale](https://www.usenix.org/conference/usenixsecurity19/presentation/ho).'
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  ext = autoencoder.recon_error(sender_domain_features)\n  if ext > thr: alert(type=external_anomaly)\n\
      \  lat = rf.predict([recipient_unlikelihood, url_risk, phish_language]) for internal_sender\n  if\
      \ lat high: alert(type=lateral_phishing, explain=top3_features)"
- question: Did a user submit form-like data via HTTP POST to a first-seen or low-reputation domain, followed
    within 24 hours by a successful but anomalous login (new geo, device, or ASN) - with preceding failed/MFA-denied
    logons or conditional-access blocks noted?
  context: This chain links a credential-harvest click to actual account compromise. Detect HTTP POSTs
    to first-seen or low-reputation domains with form-like payloads and alert when the same user has a
    successful anomalous login (new geography/device/ASN) within 24 hours across Windows (4624), Azure
    AD, or Okta. Treat preceding failed or MFA-denied logons and conditional-access blocks as distinct
    failure-mode signals of attacker login attempts. A complete POST->anomalous-login chain is strong
    evidence the credentials were phished and used; reset credentials, revoke sessions, and investigate
    post-login activity.
  answer_sources: &id006
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4624
  - Azure AD Sign-In logs
  - Okta System Log
  - 'NAI: Web Proxy, DNS Resolvers, Domain Controllers, VPN Concentrators, Cloud identity providers'
  range: Last 90 days (correlate POST to login within 24 hours)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  posts = zeek http.log method=POST to (first_seen|low_rep domain) with form_payload\n  logins\
      \ = (WinEventID=4624 OR azure_signin OR okta_log) success\n           where new_geo OR new_device\
      \ OR new_asn\n  alert where same_user(posts, logins) AND login.time - post.time <= 24h\n  note preceding\
      \ mfa_denied OR conditional_access_block"
- question: Relative to each user's 90-day browsing baseline, which HTTP POSTs go to domains outside the
    baseline or exceed the 95th percentile in orig_bytes - especially when login anomalies follow and
    the destination has low click reputation?
  context: 'Per-user browsing baselines flag out-of-pattern credential submission. Baseline each user''s
    first-seen domains and POST byte sizes, then flag POSTs to domains outside the 90-day baseline or
    above the 95th percentile in orig_bytes, weighting by click reputation (prior distinct internal visitors).
    Give extra weight when login anomalies follow. A user posting sizable form data to a never-before-seen,
    low-reputation domain shortly before an anomalous login is a high-confidence credential-theft lead;
    contain the account and review the destination. References: [Detecting Credential Spearphishing Attacks
