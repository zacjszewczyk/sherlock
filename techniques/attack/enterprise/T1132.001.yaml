- question: 'Using deterministic rule logic, can you determine whether ''High ratio connection rule''
    indicates that an adversary is using standard data encoding to obfuscate command and control traffic?
    Specifically: Alert on Zeek conn.log when orig_bytes/resp_bytes is highly skewed (e.g., ratio >=8
    or orig_bytes above a per-environment volume floor) on external endpoints, excluding known backup
    or file-sharing services.'
  context: 'Tactic context (Command and Control): the adversary is trying to communicate with compromised
    systems while evading detection, and encoding C2 content in standard schemes (Base64/hex/MIME) lets
    it blend into otherwise normal-looking protocol traffic. Evidence under investigation: A network connection
    shows a sustained bytes-sent-to-bytes-received asymmetry, an abnormal total transfer volume, or an
    abnormal rate of failed/reset connections compared to established baselines for the host and protocol.
    Approach (High ratio connection rule): Alert on Zeek conn.log when orig_bytes/resp_bytes is highly
    skewed (e.g., ratio >=8 or orig_bytes above a per-environment volume floor) on external endpoints,
    excluding known backup or file-sharing services. A positive result means the observed traffic or process
    behavior carries encoded content consistent with a covert C2 channel (recurring encoded fragments,
