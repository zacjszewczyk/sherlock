questions:
- question: 'Using deterministic rule logic, can you determine whether ''Encoded payload IOC scanning''
    indicates that an adversary is using standard data encoding to obfuscate command and control traffic?
    Specifically: Regex-match Zeek http/files/ssl payloads against known malicious Base64/hex signatures
    and reused encoded fragments, and add Cobalt Strike Malleable C2 patterns (Base64/NetBIOS/mask transforms
    in URI, Cookie, and custom headers) per [Detecting Popular Cobalt Strike Malleable C2 Profile Techniques](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/);
    alert on any exact IOC hit or on a contiguous Base64 token >=100 chars (or hex >=64 chars) appearing
    in a field that is normally short.'
  context: 'Tactic context (Command and Control): the adversary is trying to communicate with compromised
    systems while evading detection, and encoding C2 content in standard schemes (Base64/hex/MIME) lets
    it blend into otherwise normal-looking protocol traffic. Evidence under investigation: Zeek HTTP bodies,
    headers/cookies, file transfers, or TLS application data contain Base64/hex/MIME fragments that recur
    across sessions and match known malicious encoded C2 signatures, Cobalt Strike Malleable C2 transforms,
    or payload fragments from threat intelligence. Approach (Encoded payload IOC scanning): Regex-match
    Zeek http/files/ssl payloads against known malicious Base64/hex signatures and reused encoded fragments,
    and add Cobalt Strike Malleable C2 patterns (Base64/NetBIOS/mask transforms in URI, Cookie, and custom
    headers) per [Detecting Popular Cobalt Strike Malleable C2 Profile Techniques](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/);
    alert on any exact IOC hit or on a contiguous Base64 token >=100 chars (or hex >=64 chars) appearing
    in a field that is normally short. A positive result means the observed traffic or process behavior
    carries encoded content consistent with a covert C2 channel (recurring encoded fragments, high-entropy/low-compressibility
    payloads, asymmetric volume, or an encoder process feeding an outbound connection); a negative result
    means the activity matches expected protocol and host baselines. Investigate the named area of interest
    (Network Egress Points (Firewall/Proxy Logs)) and pivot from any hit to the originating process, account,
    destination, and any related staging, collection, or exfiltration activity.'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - 'NAI: Network Egress Points (Firewall/Proxy Logs)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// SYMBOLIC detection for: Encoded payload IOC scanning\n// sources: Zeek http.log, Zeek files.log,\
      \ Zeek ssl.log\nMATCH events FROM [Zeek http.log, Zeek files.log, Zeek ssl.log]\nWHERE field MATCHES\
      \ encoded_pattern  // Base64>=100 / hex>=64 / long DNS label / known IOC\n  AND destination IN (external\
      \ OR low_reputation OR newly_seen)\nTHEN alert(severity='high', enrich=[matched_field, dst, process])"
