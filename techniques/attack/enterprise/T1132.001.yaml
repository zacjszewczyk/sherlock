    with low gzip/bzip2 compressibility (high information content) of recurring payloads per [Practical
    Comprehensive Bounds on Surreptitious Communication over DNS](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf).'
