    target external low-reputation or previously unseen domains; align field-location logic with encoded-blob
    patterns in [Suspicious Encoded PowerShell Command Line](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd/).'
