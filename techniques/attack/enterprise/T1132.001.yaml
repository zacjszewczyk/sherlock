name: 'T1132.001: Standard Encoding'
id: 96197c0a-bed6-4c0a-aa5a-17a3bb478baf
description: 'This playbook helps an analyst determine whether an adversary is using a standard data encoding
  scheme (Base64, Base32, hexadecimal, ASCII/Unicode, or MIME, optionally with gzip/deflate compression)
  to obfuscate command and control (C2) traffic (T1132.001). It correlates host-based process telemetry
  that invokes standard encoders/decoders (PowerShell -enc/-EncodedCommand, certutil -encode, base64,
  openssl enc -base64, xxd, od, python/perl base64 libraries) across Windows (Event ID 4688, Sysmon, PowerShell
  logging), Linux (auditd), macOS (Unified Logs/EndpointSecurity), and ESXi (shell/hostd) with network
  telemetry (Zeek conn/http/dns/ssl/files logs, NSM flow, NSX/PF flow logs). Investigative angles include:
  recurring Base64/hex/MIME fragments matching known malicious or Cobalt Strike Malleable C2 signatures;
  long encoded strings appearing in fields that should remain short (DNS subdomains, HTTP User-Agents,
  custom headers); high payload entropy and low compressibility; bytes-sent-to-bytes-received asymmetry
  and abnormal transfer volume; elevated NXDOMAIN/4xx/TLS-handshake failure rates; protocol-application
  mismatch on ports 53/80/443; and encoder processes immediately preceding outbound connections. Detection
  blends symbolic-logic rules (regex/IOC matching, ratio and protocol-mismatch rules), statistical baselining
  (Shannon entropy, character-frequency and Kullback-Leibler scoring, percentile and standard-deviation
  deviation, compressibility, failure-state and time-series profiling), and machine learning (Random Forest,
  Logistic Regression, DBSCAN, Isolation Forest, K-Means on JA3/JA3S, Seasonal ARIMA, KitNET online autoencoder,
  self-supervised and graph models) to produce evasion-resistant, explainable alerts for the Command and
  Control tactic.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
