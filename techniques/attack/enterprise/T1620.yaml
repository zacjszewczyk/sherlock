- question: '[Stealth] Detect unbacked execution via call stacks: Can you determine whether A thread or
    API call executes from private, committed, executable memory (RWX/RX, MEM_PRIVATE) that is NOT backed
    by an image file on disk, or a call stack does not terminate in a backed module (ntdll.dll/kernel32.dll)
    — the defining artifact of reflectively loaded shellcode and direct/manual syscalls executing inside
    the host process. -- specifically, using the ''Detect unbacked execution via call stacks'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary reflectively loads code
    into a process''s own memory to conceal execution of malicious payloads, blending the activity into
    a legitimate or benign process and often avoiding on-disk artifacts while keeping payloads encrypted
    until execution. This evidence focuses on the condition that A thread or API call executes from private,
    committed, executable memory (RWX/RX, MEM_PRIVATE) that is NOT backed by an image file on disk, or
    a call stack does not terminate in a backed module (ntdll.dll/kernel32.dll) — the defining artifact
    of reflectively loaded shellcode and direct/manual syscalls executing inside the host process. This
    Symbolic Logic approach works as follows: Using kernel ETW (Microsoft-Windows-Threat-Intelligence
    provider) walk call stacks on sensitive APIs/syscalls and alert when the return stack does not terminate
    in a backed module, or when VirtualAlloc/VirtualProtect makes a MEM_PRIVATE region executable (RWX/RX),
    per [Doubling Down: Detecting In-Memory Threats with Kernel ETW Call Stacks](https://www.elastic.co/security-labs/doubling-down-etw-callstacks).
    Periodically enumerate process memory and flag private executable regions with no backing file, per
    [Hunting In Memory](https://www.elastic.co/security-labs/hunting-memory). A positive result -- a rule
    match, statistical outlier, or model alert -- is a strong indicator of reflective code loading; pivot
    to the responsible process and its parent lineage, the user and host, the specific memory regions/modules/scripts
    involved, the on-disk backing (or lack thereof), and any subsequent network connections or named-pipe
    C2 to scope the intrusion. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy in-memory, fileless,
    or injection-assisted variants.'
