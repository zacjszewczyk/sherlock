name: 'T1620: Reflective Code Loading'
id: 95a41474-feee-4133-b2e3-e5c9ef903395
description: 'This playbook helps an analyst investigate whether an adversary is using Reflective Code
  Loading (MITRE ATT&CK T1620) to conceal the execution of malicious payloads by allocating and executing
  code directly within a process''s own memory, rather than from a file backed on disk. Unlike process
  injection, reflective loading runs entirely within the host process''s own PID context, so it evades
  many process-based detections and avoids dropping artifacts on disk. The hunt spans Windows, Linux,
  and macOS endpoints plus network egress telemetry and pursues the behavior from several complementary
  angles: a non-managed/native host process loading .NET CLR or PowerShell engine modules absent from
  its baseline (the on-host signature of a reflectively loaded assembly or unmanaged PowerShell); threads
  or API calls executing from private, committed, unbacked executable memory (RWX/RX, MEM_PRIVATE) with
  call stacks that do not terminate in a backed module; scripting interpreters and .NET hosts loading
  code from a memory buffer at runtime via [Reflection.Assembly]::Load, PSReflect, or DotNETRuntime AssemblyLoad
  of anonymous modules; on POSIX hosts, writable-to-executable (mmap/mprotect W->X) permission changes
  and anonymous/memory-backed execution (memfd_create, /dev/shm, in-process dlopen) with no ELF/Mach-O
  on disk; post-load C2 where a benign host process suddenly initiates outbound network activity or matches
  threat-intel IPs/domains/JA3; the injection-assisted variant where cross-process access (Sysmon EID
  10) is followed by remote thread creation (Sysmon EID 8) into a loader stub; and named-pipe C2 channels
  whose names match known patterns or exhibit high entropy. Detection methods combine deterministic symbolic-logic
  rules (module/loader allow-maps, unbacked call-stack and start-address checks, command-line and script-block
  keyword regex, eBPF/auditd W->X hooks, threat-intel joins, pipe-name IOC regex), statistical baselining
  (process-module rarity, memory-region volume/frequency/state and entropy, command entropy/length, syscall
  volume/frequency/state, process-network rarity, rare process-pair frequency, pipe-name entropy), and
  machine learning (autoencoders on module-load vectors, gradient-boosted thread/region classifiers, deobfuscated-script
  content models, LSTM syscall and Sysmon sequence models, provenance-graph anomaly detection, and random-forest
  pipe-event classification), applied across Sysmon (EID 1/3/7/8/10/17/18/25), Windows Security events
  (4104/4688), kernel and .NET/AMSI ETW, auditd, eBPF, macOS unified logs, and Zeek conn/dns/ssl logs,
  so the analyst can corroborate suspected reflective loading against process lineage, memory artifacts,
  script content, syscall sequences, and network behavior.'
