questions:
- question: '[Stealth] Match process/module watchlist: Can you determine whether A non-managed / non-PowerShell
    host process (e.g., notepad.exe, explorer.exe, svchost.exe, an Office app, or rundll32.exe) loads
    .NET Common Language Runtime or PowerShell engine modules (clr.dll, mscoree.dll, mscorwks.dll, System.Management.Automation.dll)
    that are absent from its established baseline — the on-host signature of a reflectively loaded .NET
    assembly or unmanaged PowerShell. -- specifically, using the ''Match process/module watchlist'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary reflectively loads code
    into a process''s own memory to conceal execution of malicious payloads, blending the activity into
    a legitimate or benign process and often avoiding on-disk artifacts while keeping payloads encrypted
    until execution. This evidence focuses on the condition that A non-managed / non-PowerShell host process
    (e.g., notepad.exe, explorer.exe, svchost.exe, an Office app, or rundll32.exe) loads .NET Common Language
    Runtime or PowerShell engine modules (clr.dll, mscoree.dll, mscorwks.dll, System.Management.Automation.dll)
    that are absent from its established baseline — the on-host signature of a reflectively loaded .NET
    assembly or unmanaged PowerShell. This Symbolic Logic approach works as follows: Maintain a {module
    -> expected-loader} allow-map and alert on Sysmon EID 7 when a non-.NET host (`notepad.exe`, `svchost.exe`,
    `rundll32.exe`, `lsass.exe`, Office apps) loads core CLR/PowerShell modules (`clr.dll`, `mscoree.dll`,
    `mscorwks.dll`, `System.Management.Automation.dll`), per [PowerShell Core DLL Loaded By Non PowerShell
    Process](https://detection.fyi/sigmahq/sigma/windows/image_load/image_load_dll_system_management_automation_susp_load/)
    and [Unusual PowerShell Host Process (ADS-004)](https://github.com/palantir/alerting-detection-strategy-framework/blob/master/ADS-Examples/004-Unusual-Powershell-Host-Process.md).
    High-fidelity, low-volume; allowlist legitimate managed hosts (powershell.exe, pwsh.exe, w3wp.exe,
    msbuild.exe). A positive result -- a rule match, statistical outlier, or model alert -- is a strong
    indicator of reflective code loading; pivot to the responsible process and its parent lineage, the
    user and host, the specific memory regions/modules/scripts involved, the on-disk backing (or lack
    thereof), and any subsequent network connections or named-pipe C2 to scope the intrusion. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy in-memory, fileless, or injection-assisted
    variants.'
  answer_sources:
  - Windows Event ID 7
  - 'NAI: Processes on user workstations and servers, especially non-.NET native Windows processes (e.g.,
    notepad.exe, svchost.exe, rundll32.exe), user-facing applications (browsers, Microsoft Office), and
    web server worker processes.'
  range: Last 90 days (correlate event-centered windows of +/- 1 minute around the suspected load)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match process/module watchlist (Symbolic Logic)

      source IN [Windows Event ID 7]

      | approach: Maintain a {module -> expected-loader} allow-map and alert on Sysmon EID 7 when a non-.NET
      host (`notepad.exe`, `svchost.exe`, `rundll32.exe`, `lsass.exe`, Office apps) loads core CLR/PowerShell
      modules (`clr.dll`, `mscoree.dll`, `mscorwks.dll`, `System.Management.Automation.dll`), per [PowerShell
      Core DLL Loaded By Non PowerShell Process](https://detection.fyi/sigmahq/sigma/windows/image_load/image_load_dll_system_management_automation_susp_load/)
      and [Unusual PowerShell Host Process (ADS-004)](https://github.com/palantir/alerting-detection-strategy-framework/blob/master/ADS-Examples/004-Unusual-Powershell-Host-Process.md).
      High-fidelity, low-volume; allowlist legitimate managed hosts (powershell.exe, pwsh.exe, w3wp.exe,
      msbuild.exe).

      | correlate over NAI: Processes on user workstations and servers, especially non-.NET native Windows
      processes (e.g., notepad.exe, svchost.exe, rundll32.exe), user-facing applications (browsers, Microsoft
      Office), and web server worker processes.

      | emit alert with contributing fields and entity context (host process, parent, user, host, memory
      region/module/script, backing-file status, dest/pipe)'
  - technology: EDR/Sysmon pseudocode
    query: '# Match process/module watchlist (endpoint view)

      watch Sysmon EID 1/7/8/10/17 and ETW (DotNETRuntime/Threat-Intelligence/AMSI)

      | check module-load baseline, unbacked start addresses, in-process alloc->protect->execute

      | emit candidate reflective loads with process, parent, module/region, backing status'
- question: '[Stealth] Score rarity of module loads: Can you determine whether A non-managed / non-PowerShell
    host process (e.g., notepad.exe, explorer.exe, svchost.exe, an Office app, or rundll32.exe) loads
    .NET Common Language Runtime or PowerShell engine modules (clr.dll, mscoree.dll, mscorwks.dll, System.Management.Automation.dll)
    that are absent from its established baseline — the on-host signature of a reflectively loaded .NET
    assembly or unmanaged PowerShell. -- specifically, using the ''Score rarity of module loads'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary reflectively loads code
    into a process''s own memory to conceal execution of malicious payloads, blending the activity into
    a legitimate or benign process and often avoiding on-disk artifacts while keeping payloads encrypted
    until execution. This evidence focuses on the condition that A non-managed / non-PowerShell host process
    (e.g., notepad.exe, explorer.exe, svchost.exe, an Office app, or rundll32.exe) loads .NET Common Language
    Runtime or PowerShell engine modules (clr.dll, mscoree.dll, mscorwks.dll, System.Management.Automation.dll)
    that are absent from its established baseline — the on-host signature of a reflectively loaded .NET
    assembly or unmanaged PowerShell. This Statistical Method approach works as follows: For every unique
    process name build a 30-day baseline of legitimately loaded modules from Sysmon EID 7 and compute
    the enterprise-wide rarity of each process-module pair. Alert when a process loads a module in the
    bottom 5th percentile of load frequency for that process. Track Frequency (loads/host/day) and State
    (load succeeded vs failed image load) so a single rare CLR load in a never-before-managed host scores
    highest, consistent with the rare-causal-path approach of [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24167-paper.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator of
    reflective code loading; pivot to the responsible process and its parent lineage, the user and host,
    the specific memory regions/modules/scripts involved, the on-disk backing (or lack thereof), and any
    subsequent network connections or named-pipe C2 to scope the intrusion. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy in-memory, fileless, or injection-assisted variants.'
