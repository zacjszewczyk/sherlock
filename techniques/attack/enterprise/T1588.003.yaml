    paths, new kernel services EID 7045) from Trend Micro''s kernel-threats analysis. A positive result
    -- an IOC/rule match, statistical outlier, or model alert -- is a strong indication that a stolen
    or deceptively-obtained code signing certificate is in use; pivot to the responsible binary (hash,
    path, signer), the certificate thumbprint/serial/issuer/subject and its validity and revocation status,
