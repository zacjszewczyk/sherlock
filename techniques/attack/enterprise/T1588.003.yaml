questions:
- question: '[Resource Development] Known-bad certificate IOC correlation: Can you determine whether a
    process is created or an image is loaded from an executable whose signing certificate matches a known-bad
    indicator (thumbprint, serial number, or issuer), OR whose Authenticode signature is Invalid (digest
    mismatch) or Revoked. Validly-issued certificates do not guarantee trust; adversaries reuse stolen/purchased
    certificates and copied signature blocks. -- specifically, using the ''Known-bad certificate IOC correlation''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary establishes
    capabilities to support later operations -- here, by purchasing certificates through a front organization,
    validating to a certificate provider with information stolen from a compromised entity, or stealing
    code-signing material directly from a third party -- so that signed malware appears authentic and
    is trusted more than unsigned code by users and security tools. This evidence focuses on the condition
    that a process is created or an image is loaded from an executable whose signing certificate matches
    a known-bad indicator (thumbprint, serial number, or issuer), OR whose Authenticode signature is Invalid
    (digest mismatch) or Revoked. Validly-issued certificates do not guarantee trust; adversaries reuse
    stolen/purchased certificates and copied signature blocks. This Symbolic Logic approach works as follows:
    For every signed process creation (Sysmon Event ID 1, Windows Event ID 4688), image load (Sysmon Event
    ID 7), and driver load (Sysmon Event ID 6), extract the certificate thumbprint, serial number, and
    issuer and match against deny-lists of abused code-signing certificates from LOLDrivers, the Microsoft
    Recommended Driver Block Rules, and threat-intel feeds; generate a high-severity alert on any match.
    A positive result -- an IOC/rule match, statistical outlier, or model alert -- is a strong indication
    that a stolen or deceptively-obtained code signing certificate is in use; pivot to the responsible
    binary (hash, path, signer), the certificate thumbprint/serial/issuer/subject and its validity and
    revocation status, the host and user, the parent process lineage, and any related driver loads, certificate-store
    changes, or revocation-check traffic to scope the activity. A negative result helps rule out this
    particular vector but should be corroborated with the other questions in this playbook, since validly-issued
    certificates do not guarantee trust and a single method can miss reused, copied, or behaviorally-stealthy
    signed code.'
