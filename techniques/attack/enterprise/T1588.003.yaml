name: 'T1588.003: Code Signing Certificates'
id: 0bb59c2e-ad31-4454-9b34-fe5021eaa165
description: 'This playbook helps an analyst investigate whether a sophisticated adversary has bought
  or stolen code signing certificates and is using them during targeting (MITRE ATT&CK T1588.003, Code
  Signing Certificates, under Resource Development TA0042). Because the acquisition itself happens outside
  the victim''s visibility, the hunt focuses on follow-on, on-host and on-network observables: signed
  processes, image loads, and driver loads whose certificate thumbprint/serial/issuer matches known-bad
  indicators (LOLDrivers, Microsoft driver block list, threat intel); binaries whose Authenticode signature
  is Invalid (digest mismatch) or Revoked; certificates with deceptive or typosquatted subjects, provenance
  mismatches, low-reputation/self-signed issuers, or statistically rare issuer/subject/validity attributes
  versus an environmental baseline; unauthorized installation of root/trusted-publisher certificates and
  export of signing private keys (the on-host ''steal'' path); and anomalous CRL/OCSP revocation-check
  traffic. Detection methods span deterministic symbolic-logic rules (IOC deny-lists, certutil add/exportPFX
  detection, JA4X certificate-structure fingerprints, typosquat regexes, CRL/OCSP allowlists), statistical
  baselining (issuer/subject/validity rarity, edit-distance scoring, rare user/process pairs, failed-vs-successful
  lookup ratios), and machine learning (gradient-boosted signed-PE classifiers, API-sequence behavioral
  models, deception-scoring NLP models, process-graph lineage analytics, and Seasonal-Hybrid ESD time-series
  anomaly detection). Telemetry spans Windows Security and Sysmon events, Code Integrity and CAPI2 logs,
  AppLocker, and Zeek ssl/x509/conn/dns network logs so the analyst can corroborate suspected abuse of
  code signing certificates across host, certificate, and network evidence.'
