name: 'T1059.011: Lua'
id: 015de4e3-af3a-49db-aad7-99607f4f024e
description: 'This playbook helps an analyst determine whether an adversary has abused the Lua scripting
  language for execution (T1059.011): running malicious code through the stand-alone lua interpreter,
  .lua scripts, or Lua-embedded programs and DLL modules (e.g., lua51.dll, luacom.dll, LuaSocket core.dll/mime.dll).
  Lua is a cross-platform, embeddable language that adversaries such as SunSeed (Asylum Ambuscade), PoetRAT,
  and EvilBunny have weaponized to load further stages at runtime, beacon over LuaSocket HTTP, and live
  off the land. The playbook correlates host process telemetry (Windows Event ID 4688, Sysmon EID 1/7/11,
  auditd execve/PATH, macOS unified log, network-device runtime logs) with network telemetry (Zeek conn.log/dns.log/http.log)
  to surface: interpreter-initiated egress to rare or malicious destinations and C2 retry/failure patterns;
  suspicious Lua command lines (high entropy, Base64/hex, -e, loadstring, dofile, os.execute, io.popen,
  require(''socket''/''http'')); anomalous parent-child lineage (Office/browser/wscript spawning Lua)
  and masqueraded interpreters or DLL loads; execution from user-writable directories and Startup-LNK
  persistence; and Lua interpreters spawning shells or discovery commands. Detection blends symbolic-logic
  rules, statistical baselining (percentiles, entropy, frequency/Jaccard scoring, MAD thresholding), and
  machine learning (Isolation Forest, Random Forest/XGBoost, GraphSAGE/temporal-GNN provenance scoring)
  to produce evasion-resistant, explainable alerts for the Execution tactic.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
