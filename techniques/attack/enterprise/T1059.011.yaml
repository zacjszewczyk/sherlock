questions:
- question: 'Using deterministic rule logic, can you determine whether ''Lua execution network IOC correlation''
    indicates malicious Lua interpreter or script execution? Specifically: Link each Lua interpreter execution
    (Event ID 4688 / Sysmon EID 1 / auditd execve / macOS unified log) to Zeek conn.log/dns.log/http.log
    within 5 minutes and alert when the destination IP/FQDN matches a CTI feed. SunSeed beacons over LuaSocket
    HTTP from the interpreter process, so prioritize interpreter-initiated egress [SunSeed/Asylum Ambuscade](https://www.proofpoint.com/us/blog/threat-insight/asylum-ambuscade-state-actor-uses-compromised-private-ukrainian-military-emails);
    align lineage and logging with LOTL behavioral-baselining guidance [CISA/NSA LOTL](https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques).'
  context: 'Tactic context (Execution): the adversary is trying to run malicious code, and Lua is an embeddable
    cross-platform interpreter that lets actors execute attacker-controlled code while blending in with
    legitimate applications. Evidence under investigation: A Lua interpreter process (e.g., lua.exe, lua5.1.exe,
    luajit, lua) executes and within 5 minutes the same host opens an outbound connection (often via LuaSocket
    http.lua/socket.lua) to a rare or known-malicious destination. Profile both successful C2 and failed
    retrieval attempts (NXDOMAIN, connection refused/blocked, HTTP 4xx/5xx), which are characteristic
    of SunSeed-style loaders fetching additional Lua at runtime. Approach (Lua execution network IOC correlation):
    Link each Lua interpreter execution (Event ID 4688 / Sysmon EID 1 / auditd execve / macOS unified
    log) to Zeek conn.log/dns.log/http.log within 5 minutes and alert when the destination IP/FQDN matches
    a CTI feed. SunSeed beacons over LuaSocket HTTP from the interpreter process, so prioritize interpreter-initiated
    egress [SunSeed/Asylum Ambuscade](https://www.proofpoint.com/us/blog/threat-insight/asylum-ambuscade-state-actor-uses-compromised-private-ukrainian-military-emails);
    align lineage and logging with LOTL behavioral-baselining guidance [CISA/NSA LOTL](https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques).
    A positive result indicates Lua being used for malicious execution (e.g., loader beaconing, obfuscated
    commands, anomalous lineage, staging from user-writable paths, or shell/discovery spawning); a negative
    result means the observed Lua activity matches expected, benign baselines for this environment. Pivot
    from any hit to the originating process, user, parent lineage, loaded DLLs, and any downstream network
    or follow-on execution. Investigate the named area of interest: Endpoint devices, application servers
    (e.g., web apps embedding Lua), and network egress points.'
