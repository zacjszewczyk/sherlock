questions:
- question: During the Persistence phase of print-processor abuse, can you confirm or rule out "Print
    processor IOC match"? Specifically, using a symbolic logic approach, Detect DLL FileCreate events
    in \spool\prtprocs\[arch]\ (Sysmon EID 11 / Event 4663), compute SHA256, and alert on threat-intel
    matches. This directory and registration path is the documented in-the-wild persistence mechanism
    abused by PipeMon [ESET PipeMon](https://www.welivesecurity.com/2020/05/21/no-game-over-winnti-group/)
    and the legitimate install path defined by [Microsoft AddPrintProcessor](https://learn.microsoft.com/en-us/windows/win32/printdocs/addprintprocessor).
  context: 'Mission requirement: "Is the adversary maintaining persistence by installing a malicious print
    processor?". Evidence under investigation: A DLL is created in a system''s print-processor directory
    (e.g., C:\Windows\System32\spool\prtprocs\[arch]\) by a process other than the spooler/driver-installation
    stack, or with a hash matching a known-malicious file or with anomalously high entropy. The legitimate
    population of print-processor DLLs is small and stable. Detection method (Symbolic Logic): Detect
    DLL FileCreate events in \spool\prtprocs\[arch]\ (Sysmon EID 11 / Event 4663), compute SHA256, and
    alert on threat-intel matches. This directory and registration path is the documented in-the-wild
    persistence mechanism abused by PipeMon [ESET PipeMon](https://www.welivesecurity.com/2020/05/21/no-game-over-winnti-group/)
    and the legitimate install path defined by [Microsoft AddPrintProcessor](https://learn.microsoft.com/en-us/windows/win32/printdocs/addprintprocessor).
    Why it matters for Persistence: print processors give an adversary a SYSTEM-level, boot-persistent
    execution primitive via the print spooler service, so confirming this evidence directly answers whether
    the technique is in play for persistence. A positive result (an IOC/signature match, a statistical
    outlier beyond the stated threshold, or a high-confidence model score) should be triaged by capturing
    the writing or loading process, its parent and command line, the user/integrity context, the exact
    DLL path and hash, any associated Print Processors registry value, spooler start/stop/crash events,
    and any subsequent child-process or network activity; a negative result lowers confidence in this
    specific vector but does not exclude the other questions in this playbook. Pivot across the listed
    answer sources and the named area of interest to corroborate findings.'
  answer_sources:
  - Sysmon Event ID 11 (File Create)
  - Windows Event ID 4663
  - File system metadata
  - 'NAI: File system audit logs on all Windows endpoints and servers, particularly Domain Controllers,
    print servers, and critical application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Print processor IOC match

      source IN [Sysmon Event ID 11 (File Create), Windows Event ID 4663, File system metadata]

      | where matches_condition("Print processor IOC match")

      | eval method="Print processor IOC match"

      | table _time, host, user, process_image, parent_image, command_line, target_path, registry_path,
      dll_hash, signature_status

      | alert'
- question: During the Persistence phase of print-processor abuse, can you confirm or rule out "Trusted-writer
    allowlist"? Specifically, using a symbolic logic approach, Legitimate prtprocs writes originate from
    spoolsv.exe or the driver-installation stack (msiexec.exe, trusted setup binaries) per [Microsoft
    AddPrintProcessor](https://learn.microsoft.com/en-us/windows/win32/printdocs/addprintprocessor); alert
    when the writer process is an interactive shell or scripting engine (powershell.exe, cmd.exe, rundll32.exe,
    wscript.exe, mshta.exe) — the same empty-Manufacturer/ad-hoc registration anti-pattern matched by
    [Sigma Suspicious Printer Driver](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_susp_printer_driver.yml).
