- question: During the Persistence phase of print-processor abuse, can you confirm or rule out "Anomalous
    file characteristics"? Specifically, using a statistical method approach, Profile legitimate print
    processor DLLs by size, compiler/linker metadata, section count, and entropy. Flag new DLLs that are
    multivariate outliers (e.g., Mahalanobis distance) across these dimensions (small size + high entropy
    + missing standard compiler stamps).
