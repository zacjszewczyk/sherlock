- question: During the Persistence phase of print-processor abuse, can you confirm or rule out "Unsigned
    load rule"? Specifically, using a symbolic logic approach, Alert when spoolsv.exe loads an unsigned
    or invalidly signed DLL from a spool path (\spool\prtprocs\ or \spool\drivers\), correlating to a
    recent non-installer write. This is the exact Sysmon EID 7 pattern in [Sigma Spooler Service Suspicious
    Binary Load](https://github.com/SigmaHQ/sigma/blob/master/rules-emerging-threats/2021/Exploits/CVE-2021-1675/image_load_exploit_cve_2021_1675_spoolsv_dll_load.yml).
  context: 'Mission requirement: "Is the adversary maintaining persistence by installing a malicious print
    processor?". Evidence under investigation: A process not associated with legitimate software installation
    writes a DLL to the print-processor directory, and shortly thereafter the print spooler service (spoolsv.exe)
    loads a DLL that is unsigned or has an invalid signature. Spooler load failures or service crashes
    after the write are a distinct corroborating signal. Detection method (Symbolic Logic): Alert when
    spoolsv.exe loads an unsigned or invalidly signed DLL from a spool path (\spool\prtprocs\ or \spool\drivers\),
    correlating to a recent non-installer write. This is the exact Sysmon EID 7 pattern in [Sigma Spooler
