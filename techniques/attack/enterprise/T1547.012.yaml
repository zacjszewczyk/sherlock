name: 'T1547.012: Print Processors'
id: bd4335a2-8a46-41e9-ac3e-d4b66b53027f
description: Investigate adversary abuse of Windows print processors (MITRE ATT&CK T1547.012) to gain
  persistence and/or privilege escalation by loading malicious DLLs through the print spooler service
  (spoolsv.exe), which runs as SYSTEM and starts at boot. This playbook helps an analyst determine whether
  an adversary has dropped a malicious DLL into the system print-processor directory (C:\Windows\System32\spool\prtprocs\[arch]\),
  registered it under HKLM\SYSTEM\...\Control\Print\Environments\...\Print Processors\<name>\Driver, and
  restarted the spooler so the DLL executes with SYSTEM privileges - the in-the-wild technique used by
  PipeMon and related to PrintNightmare-class spooler abuse. It covers detection of anomalous DLL creation
  by untrusted writers, unsigned/invalid module loads by spoolsv.exe, drop-then-register file-to-registry
  sequences, unauthorized Print Processors registry writes, anomalous spoolsv child processes indicating
  post-escalation activity, spooler restarts and crash-loops outside maintenance windows, and anomalous
  spoolsv outbound network connections indicative of command and control. The questions span deterministic
  IOC/allowlist/signature logic, statistical rarity, entropy, multivariate-outlier and timing baselines,
  and machine-learning sequence, clustering, classifier, provenance-graph, and beaconing methods to give
  a SOC analyst granular, defensible coverage across endpoint (Sysmon, Windows Event IDs) and network
  (Zeek) telemetry.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
