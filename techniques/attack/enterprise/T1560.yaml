name: 'T1560: Archive Collected Data'
id: db7f4505-558a-4661-ae3e-e06231eb6a7d
description: Investigate whether an adversary has compressed and/or encrypted data they collected on a
  host before exfiltrating it. Archiving collected data lets an actor shrink the volume sent over the
  network, obfuscate the contents from inspection, and stage a single object that is convenient to exfiltrate.
  This playbook helps an analyst hunt for that staging behavior across Windows, Linux, and macOS endpoints
  and at network egress points. It correlates the execution of compression and encryption utilities (e.g.,
  7z.exe, rar.exe, makecab.exe, tar, gzip, openssl, zip, ditto, hdiutil, PowerShell Compress-Archive)
  and the in-process loading of cryptographic libraries (crypt32.dll, bcrypt.dll, ncrypt.dll) with the
  creation of new archive files. It looks for archive files matching threat-intel hashes or suspicious
  filename/entropy patterns, archivers spawned by anomalous parent processes, archives written to high-risk
  or outlier directories and sizes, bursts of file reads across many directories that immediately precede
  an archive write, and outbound network flows whose byte volume matches a recently created archive. The
  methods span deterministic symbolic-logic rules, statistical baselining/anomaly scoring, and machine-learning
  models, giving the analyst layered, explainable signals to confirm data staging tied to the Collection
  tactic and to scope likely subsequent exfiltration.
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
