name: 'T1059.012: Hypervisor CLI'
id: 63227774-870f-47f9-b13b-f542eca34ccc
description: 'This playbook helps an analyst determine whether an adversary is abusing an ESXi hypervisor
  command-line interface (T1059.012) — native tools such as esxcli, vim-cmd, vmkfstools, and PowerCLI
  — to execute malicious commands against the hypervisor and its guest virtual machines. Hypervisor CLIs
  grant broad control: listing/starting/stopping VMs, removing snapshots, toggling the host firewall,
  redirecting or disabling syslog forwarding, enabling SSH/ESXi shell, and encrypting datastore files.
  Adversaries (notably ESXi-targeting ransomware crews such as BlackSuit/Royal) leverage these to perform
  discovery, defense evasion, persistence, and Data Encrypted for Impact. Investigative angles include:
  matching process hashes and command-line artifacts against threat-intel IOCs; watchlisting high-risk
  destructive/evasion commands not tied to a change ticket; detecting defense-degradation state changes
  (firewall disabled, syslog redirected, log-forwarding gaps); scoring rare or obfuscated command arguments
  via entropy and term-weighting; spotting ordered ransomware sequences (discovery → mass VM kill → encryption/persistence);
  validating that the executing principal is an authorized ESXi/VMware administrator from an expected
  source and time; and flagging anomalous outbound C2/exfil from the hypervisor management interface.
  Detection blends symbolic-logic rules, statistical baselining (percentiles, entropy, 3-sigma volume),
  and machine learning (Gradient Boosting, Isolation Forest/COPOD, BERT embeddings, RNN/LSTM sequence
  models, graph community detection) to produce explainable, evasion-resistant alerts for the Execution
  tactic.'
type: technique
related:
