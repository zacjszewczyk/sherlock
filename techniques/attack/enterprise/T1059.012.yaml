questions:
- question: 'Using deterministic rule logic, can you determine whether ''IOC matching on hypervisor CLI
    executions'' indicates abuse of an ESXi hypervisor CLI? Specifically: Correlate Windows Event ID 4688/Sysmon
    Event ID 1 (management workstations/PowerCLI) with ESXi shell.log/hostd.log for esxcli/vim-cmd/vmkfstools
    executions and match process file hashes and command-line artifacts against threat-intel IOC lists
    such as the [CISA/FBI BlackSuit (Royal) advisory](https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-061a),
    alerting critically on any match. Include the matched IOC and full command line in the alert.'
  context: 'Tactic context (Execution): the adversary is trying to run malicious code — here by abusing
    native ESXi hypervisor CLI tools (esxcli, vim-cmd, vmkfstools, PowerCLI) that grant sweeping control
    over the host and its guest VMs. Evidence under investigation: Execution of a process or command involving
    a hypervisor CLI tool (e.g., esxcli, vim-cmd, PowerCLI) where the process file hash or command-line
    arguments match a known Indicator of Compromise (IOC). Approach (IOC matching on hypervisor CLI executions):
    Correlate Windows Event ID 4688/Sysmon Event ID 1 (management workstations/PowerCLI) with ESXi shell.log/hostd.log
    for esxcli/vim-cmd/vmkfstools executions and match process file hashes and command-line artifacts
    against threat-intel IOC lists such as the [CISA/FBI BlackSuit (Royal) advisory](https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-061a),
    alerting critically on any match. Include the matched IOC and full command line in the alert. A positive
    result indicates hypervisor CLI activity that is malicious, unauthorized, obfuscated, anomalous, or
    matched to known-bad infrastructure — pivot immediately to the executing account, source host/IP,
    parent process, the affected ESXi host(s) and datastores, and any associated VM stop/snapshot-removal/encryption
    activity. A negative result means the observed activity aligns with sanctioned administrators, approved
    change tickets, and established baselines. Investigate the named area of interest (Hypervisor management
    servers (e.g., vCenter), ESXi hosts, designated administrator workstations, and jump boxes with hypervisor
    management tools installed.) and corroborate across endpoint process-creation logs, ESXi shell/audit/auth
    logs, and network telemetry.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - ESXi shell.log
  - ESXi audit.log
  - 'NAI: Hypervisor management servers (e.g., vCenter), ESXi hosts, designated administrator workstations,
    and jump boxes with hypervisor management tools installed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Symbolic Logic: IOC match on hypervisor CLI executions\nJOIN endpoint_proc(EventID IN [4688]\
      \ OR Sysmon=1, image IN ['powercli','esxcli','vim-cmd'])\n  WITH esxi_logs(source IN ['shell.log','hostd.log'],\
      \ cmd MATCHES /(esxcli|vim-cmd|vmkfstools)/)\n  ON host, time_window=5m\nWHERE sha256(process) IN\
      \ ioc_hashes  // CISA AA23-061a BlackSuit/Royal\n   OR command_line MATCHES ioc_cmdline_patterns\n\
      EMIT ALERT severity=critical, fields=[matched_ioc, full_command_line, user, host]"
