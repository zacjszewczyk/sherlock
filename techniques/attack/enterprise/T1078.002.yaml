questions:
- question: 'Stealth (TA0005) — Valid Accounts: Domain Accounts: Can you determine whether successful
    authentications for domain identities appear as domain or Kerberos logons from hosts and network paths
    that are unusual for the user, often preceded by a burst of failures or ticket requests. The concrete
    evidence is a legitimate account successfully establishing access to a domain resource, VPN, or federation
    service from an atypical source, new device, or suspicious travel pattern? Specifically, apply the
    ''Threat-intel source match'' approach (symbolic-logic / deterministic-rule) to surface and confirm
    it: Correlate successful and failed domain-authentication events (4624/4625/4768/4769) with Zeek conn.log
    source IPs and flag any source matching a high-confidence threat-intel or credential-breach list;
    reused valid credentials from breach corpora are a primary domain-account vector [Thomas et al](https://www.usenix.org/conference/usenixsecurity19/presentation/thomas).
    Prioritize external-facing services (VPN, ADFS, remote-access gateways) and include user, host, logon
    type, and the count of preceding failures (state) in the alert.'
  context: 'Information requirement: "Has the adversary gained initial access using compromised domain
    accounts?" This question supports the Stealth tactic (TA0005): The adversary is trying to hide and
    conceal their actions, appearing as normal behavior. Evidentiary basis: Successful authentications
    for domain identities appear as domain or Kerberos logons from hosts and network paths that are unusual
    for the user, often preceded by a burst of failures or ticket requests. The concrete evidence is a
    legitimate account successfully establishing access to a domain resource, VPN, or federation service
    from an atypical source, new device, or suspicious travel pattern. Method (symbolic-logic / deterministic-rule):
    Correlate successful and failed domain-authentication events (4624/4625/4768/4769) with Zeek conn.log
    source IPs and flag any source matching a high-confidence threat-intel or credential-breach list;
    reused valid credentials from breach corpora are a primary domain-account vector [Thomas et al](https://www.usenix.org/conference/usenixsecurity19/presentation/thomas).
    Prioritize external-facing services (VPN, ADFS, remote-access gateways) and include user, host, logon
    type, and the count of preceding failures (state) in the alert. This is a deterministic detection:
    a match is high-fidelity, but maintain tuned allow-lists (sanctioned admins, corporate VPN/proxy egress,
    jump hosts) to suppress benign hits. Absence of a match does not rule out a stealthier variant, so
    pair it with the statistical and ML approaches for this same evidence. In the context of Stealth via
    Valid Accounts: Domain Accounts, a confirmed positive should be pivoted on the involved account, source
    host/IP, and timeframe to scope the intrusion and adjacent activity.'
