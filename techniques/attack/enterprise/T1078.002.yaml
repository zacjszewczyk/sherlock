- question: 'Stealth (TA0005) — Valid Accounts: Domain Accounts: Can you determine whether a single external
    IP address generates a high volume of failed authentications against one or many domain accounts,
    indicative of a brute-force or password spraying attack? Specifically, apply the ''Brute-force/powder
    rule'' approach (symbolic-logic / deterministic-rule) to surface and confirm it: Trigger when one
    source IP generates >20 failed logons (4625) against a single account in 5 minutes (brute-force),
    and a second rule when one source generates failed logons against >20 distinct accounts in 5 minutes
    with low per-account volume (low-and-slow spray) [Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).
    Track the failed-then-success state so a success after the burst escalates severity. Tune the 20/5-min
    thresholds to each environment''s 99th-percentile baseline.'
