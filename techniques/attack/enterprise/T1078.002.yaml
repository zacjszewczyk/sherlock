  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Correlate successful and failed domain-authentication events (4624/4625/4768/4769) with\
      \ Zeek conn.log source IPs and flag any source matching a high-confidence threat-intel or credential-breach\
      \ list; reused valid credentials from breach corpora are a primary domain-account vector Thomas\
      \ et al\nindex=windows (EventCode=4624 OR EventCode=4625 OR EventCode=4768 OR EventCode=4769 OR\
      \ EventCode=4771)\n| eval rule_match = /* deterministic conditions from method */ true\n| where\
      \ rule_match\n| stats min(_time) as first, max(_time) as last, values(host) as hosts,\n        values(ParentProcessName)\
      \ as parents by Account_Name, src_ip\n| table first,last,Account_Name,src_ip,hosts,parents"
  - technology: Zeek/pseudocode
    query: '// Correlate successful and failed domain-authentication events (4624/4625/4768/4769) with
      Zeek conn.log source IPs and flag any source matching a high-confidence threat-intel or credential-breach
      list; reused valid credentials from breach corpora are a primary domain-account vector Thomas et
      al  (sources: Zeek conn.log)

      zeek conn.log | join id.resp_h with threat_intel_c2

      | where match

      | stats sum(orig_bytes+resp_bytes) as bytes, count by id.orig_h, id.resp_h, session_user'
- question: 'Stealth (TA0005) — Valid Accounts: Domain Accounts: Can you determine whether successful
    authentications for domain identities appear as domain or Kerberos logons from hosts and network paths
    that are unusual for the user, often preceded by a burst of failures or ticket requests. The concrete
    evidence is a legitimate account successfully establishing access to a domain resource, VPN, or federation
    service from an atypical source, new device, or suspicious travel pattern? Specifically, apply the
    ''Failure-to-success outlier'' approach (statistical / baseline-anomaly) to surface and confirm it:
    For each user+source-IP pair compute the failed-to-successful logon ratio (4625/4624) over rolling
    1-hour and 24-hour windows and the abrupt failed-then-success transition that marks a guessed password
    [Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).
    Rather than a fixed cutoff, apply change-point detection (CUSUM/Bayesian online) to each account''s
    failure-rate series and alert on a level shift exceeding the 99th percentile or 3-sigma, especially
    when the success is from a new ASN/device [Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).
    Surface failure count, prior-success baseline, and source novelty in the alert.'
