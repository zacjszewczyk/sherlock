    from an atypical source, new device, or suspicious travel pattern. Method (statistical / baseline-anomaly):
    For each user+source-IP pair compute the failed-to-successful logon ratio (4625/4624) over rolling
    1-hour and 24-hour windows and the abrupt failed-then-success transition that marks a guessed password
    [Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).
    Rather than a fixed cutoff, apply change-point detection (CUSUM/Bayesian online) to each account''s
    failure-rate series and alert on a level shift exceeding the 99th percentile or 3-sigma, especially
    when the success is from a new ASN/device [Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).
    Surface failure count, prior-success baseline, and source novelty in the alert. This is a baseline/anomaly
    approach: a positive result is a statistically significant deviation from the account''s, host''s,
