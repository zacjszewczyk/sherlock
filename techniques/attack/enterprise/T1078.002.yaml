name: 'T1078.002: Valid Accounts: Domain Accounts'
id: bb7f72b7-dea7-47b2-a78f-3e99665d8c21
description: Investigate suspected abuse of valid Active Directory domain accounts (T1078.002) across
  the full attack lifecycle. Adversaries obtain domain credentials via OS credential dumping, password
  reuse, or breach corpora and then authenticate as legitimate users to gain Initial Access, maintain
  Persistence, escalate Privilege, and evade defenses by blending in with normal activity. This playbook
  helps an analyst confirm or rule out malicious domain-account use by examining authentication telemetry
  (successful and failed logons, Kerberos TGT/TGS requests) for impossible travel, never-before-seen geolocations/ASNs,
  brute-force and password-spray bursts, and threat-intel/breach-list hits; account lifecycle and group-membership
  changes (account creation then privileged-group addition, first-time high-impact privileged actions);
  host execution evidence (service/scheduled-task creation, LOLBAS abuse, defense-evasion and AD-admin
  command lines, full-token logons, anomalous logon types); event-log clearing and collection gaps; and
  C2-style network behavior bound to an active domain session. Each question pairs a deterministic rule,
  a statistical baseline method, and a machine-learning approach so findings are corroborated and defensible.
type: technique
