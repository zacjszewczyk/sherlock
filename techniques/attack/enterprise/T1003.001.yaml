name: 'T1003.001: LSASS Memory'
id: 0dad06e2-1c1a-4879-bf4a-cf21c3e3c26c
description: 'Investigate whether an adversary has attempted to access, copy, or scrape credential material
  from the memory of the Local Security Authority Subsystem Service (lsass.exe) on Windows hosts. After
  a user authenticates, LSASS caches a variety of credential materials (NTLM hashes, Kerberos tickets,
  and sometimes plaintext secrets), making it a primary target for credential theft that enables lateral
  movement and the use of alternate authentication material. This playbook helps an analyst hunt the full
  LSASS-dumping kill chain: launch of known or renamed dumping tooling (procdump, comsvcs.dll MiniDump
  via rundll32, Task Manager, nanodump, dumpert, mimikatz); suspicious command-line arguments and their
  evasive variants; high-risk handle access to lsass.exe; creation of LSASS dump-file artifacts and their
  exfil/cleanup; abuse of Windows Error Reporting via SilentProcessExit/IFEO to coerce WerFault into dumping
  LSASS; unauthorized Security Support Provider (SSP) DLL registration in the LSA configuration; and repeated
  denied or failed LSASS access attempts that signal blocked or staging activity. Each question pairs
  deterministic symbolic-logic detection with statistical baselining and machine-learning approaches so
  that successful, evasive, and failed attempts are all surfaced. Focus collection on Tier 0/1 assets,
  Domain Controllers, AD CS servers, Privileged Access Workstations, and critical application servers.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a process associated with LSASS credential-dumping tooling launch on a sensitive host,
    for example procdump, rundll32.exe invoking comsvcs.dll MiniDump, Task Manager followed by a dump,
    WerFault.exe outside a normal crash context, nanodump, dumpert, or mimikatz?
  context: Credential Access via LSASS dumping almost always begins with execution of a tool capable of
    reading or dumping process memory. By matching process-creation telemetry on Image, OriginalFileName,
    and image-load combinations against the known dumping families, an analyst catches the staging step
    of the attack chain before secrets leave the host. Hash and threat-intel matches should enrich, not
    gate, the alert because adversaries rename binaries and recompile tooling. A positive result is an
    unexpected dump-capable process on a Tier 0/1 host (especially one that immediately precedes LSASS
    handle access or .dmp creation); a negative result narrows the hunt to in-memory-only or living-off-the-land
    techniques. Capture Image, OriginalFileName, ParentImage, CommandLine, User, and ProcessGuid to enable
    immediate pivoting.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (WinEventLog:Security EventCode=4688, WinEventLog:Sysmon EventCode=1)\n| eval img=lower(Image),\
      \ ofn=lower(OriginalFileName), cmd=lower(CommandLine)\n| where like(img,'%procdump%') OR ofn IN\
      \ ('procdump','nanodump','dumpert')\n    OR (like(img,'%rundll32.exe') AND like(cmd,'%comsvcs.dll%minidump%'))\n\
      \    OR (like(img,'%taskmgr.exe%'))\n    OR (like(img,'%werfault.exe') AND NOT crash_context)\n\
      \    OR like(cmd,'%sekurlsa%')\n| table _time host Image OriginalFileName ParentImage CommandLine\
      \ User ProcessGuid\n// hash/TI lookup is enrichment only, never a prerequisite"
- question: Is a dump-capable binary executing on a host where that binary is enterprise-rare for the
    host's asset class, and is its execution followed within minutes by LSASS handle access, dump-file
    creation, or a WerFault/registry chain?
  context: Legitimate administrative and security tooling exists, so prevalence baselining separates routine
    activity from anomalies. Baseline (Image, OriginalFileName, Company, SignatureStatus, ParentImage)
    per asset class for 30 days; a process appearing on under 0.1% of peer hosts (or a single host) that
    is then chained to LSASS access strongly indicates targeted credential theft. The prevalence floor
    should be raised on large, noisy workstation fleets and lowered on Tier 0 servers where almost nothing
    should be novel. A positive result is a rare binary plus a follow-on LSASS interaction within five
    minutes; this tactic-specific chaining is what elevates a benign-looking rarity into a Credential
    Access alert.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days (30-day baseline, 5-minute correlation window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (4688, Sysmon EID 1) earliest=-30d

      | stats dc(host) AS host_count by asset_class, lower(Image), OriginalFileName, Company, SignatureStatus,
      ParentImage

      | eventstats dc(host) AS class_hosts by asset_class

      | eval prevalence=host_count/class_hosts

      | where prevalence < 0.001 OR host_count<=1

      | join ProcessGuid [search (Sysmon EID 10 TargetImage=*lsass.exe) OR (Sysmon EID 11 TargetFilename=*.dmp)]

      | where followon_time - proc_time <= 300

      | table host Image prevalence followon_event ProcessGuid'
- question: Could a renamed, recompiled, or otherwise rule-evasive LSASS dumping tool have launched that
    string-based and prevalence rules missed?
  context: 'Sophisticated actors deliberately defeat signature and string rules by renaming binaries,
    padding command lines, and reordering arguments. Running an adaptive-misuse classifier over process-creation
    tokens in parallel with the deterministic rules catches variants that evade exact matches while preserving
    every deterministic hit. The model should be explainable: print the top three contributing tokens/features
    and the closest evaded-rule family so an analyst can validate the hit instead of trusting an opaque
    score. A positive result is a high model score on a process that did not trip a symbolic rule, especially
    on Tier 0/1 hosts; this is precisely the gap a careful credential-access operator tries to exploit.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode (AMIDES-style adaptive misuse)
    query: "model = load('amides_proc_creation_classifier')\nfor evt in process_creation_events(window='-90d'):\n\
      \    tokens = normalize_tokens(evt.Image, evt.OriginalFileName, evt.CommandLine)\n    score, feats\
      \ = model.score_explain(tokens)\n    if score >= threshold and not deterministic_hit(evt):\n   \
      \     alert(host=evt.host, image=evt.Image, score=score,\n              top3_tokens=feats[:3], closest_evaded_rule=feats.rule_family)\n\
      # parallel to symbolic rules; never suppress deterministic hits"
- question: Was a process created whose command line, after normalization, matches known LSASS memory-dumping
    argument patterns such as procdump -ma lsass, rundll32 comsvcs.dll MiniDump, sekurlsa::logonPasswords/minidump,
    nanodump, dumpert, or RtlReportSilentProcessExit?
  context: Command-line arguments expose intent even when the binary is renamed. Normalizing quotes, carets,
    slash-versus-hyphen flags, repeated spaces, and argument order before regex matching defeats common
    obfuscation and exposes the underlying dumping invocation. This deterministic check is the backbone
    of LSASS-dump detection in Credential Access. A positive result is a command line that resolves to
    a recognized dumping pattern targeting lsass or a PID; include both the normalized and raw command
    line in the alert so triage can confirm whether obfuscation was present. A negative result pushes
    the hunt toward API-only or fileless dumping that leaves no obvious arguments.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (4688, Sysmon EID 1)\n| eval norm=normalize(CommandLine)  // strip quotes,carets;\
      \ collapse spaces; unify -/ flags\n| where match(norm,'(?i)procdump(\\.exe)? .*(-ma|-mm|-mp) .*(lsass|[0-9]+)')\n\
      \    OR match(norm,'(?i)rundll32\\.exe .*comsvcs\\.dll.*minidump')\n    OR match(norm,'(?i)sekurlsa::(logonpasswords|minidump)')\n\
      \    OR match(norm,'(?i)(nanodump|dumpert|rtlreportsilentprocessexit|powerlsasssilentprocessexit)')\n\
      | table _time host Image ParentImage User CommandLine norm ProcessGuid"
- question: Does a command line for a given image diverge sharply from that image's normal argument vocabulary,
    or show unusually high entropy or escape-character counts, while also containing an LSASS-associated
    token?
  context: Attackers evade exact-string rules by inserting junk, escapes, and reordering, but those tactics
    make the command statistically abnormal for the binary in question. Baseline token sets per Image
    over 30 days; alert when Jaccard similarity to known-benign commands for that image is very low (e.g.
    < 0.2), or when command entropy or escape-character count exceeds the 99th percentile for that image
    AND an LSASS-associated token is present. Treating repeated near-miss variants as a single case avoids
    alert storms from one operator iterating. A positive result is an anomalous, high-entropy invocation
    tied to LSASS tokens on a sensitive host, a strong indicator of deliberate evasion during Credential
    Access.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days (30-day per-image baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = tokens_by_image(window=''-30d'')

      source IN (4688, Sysmon EID 1)

      | eval toks=tokenize(CommandLine), ent=entropy(CommandLine), esc=count_escapes(CommandLine)

      | eval jac=jaccard(toks, baseline[Image])

      | eval p99=percentile99(ent, by=Image)

      | where (jac < 0.2 OR ent > p99 OR esc > p99_esc) AND has_lsass_token(toks)

      | dedup Image, near_miss_cluster

      | table host Image jac ent esc CommandLine'
- question: Does a machine-learning command-line classifier score a Windows command as malicious credential-dumping
    intent even though no string or statistical rule fired?
  context: Natural-language-style classification of command lines captures malicious intent that brittle
    regexes miss, including novel phrasings and living-off-the-land combinations. Use a lightweight text
    classifier or active-learning ensemble (not an opaque end-to-end score) running in parallel with the
    deterministic rules, and surface the top three contributing tokens or n-grams so analysts can adjudicate.
    A positive result is a high-confidence malicious score on a command line that evaded the other layers,
    especially on Tier 0/1 hosts; this is the safety net for Credential Access commands engineered specifically
    to slip past pattern matching.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode (command-line NLP)
    query: "model = load('cmdline_nlp_classifier')  # active-learning ensemble\nfor evt in process_creation_events(window='-90d'):\n\
      \    score, ngrams = model.score_explain(evt.CommandLine)\n    if score >= threshold:\n        alert(host=evt.host,\
      \ image=evt.Image, score=score, top3_ngrams=ngrams[:3])\n# parallel to symbolic + statistical layers"
- question: Did a process that is not on the allow-list open a handle to lsass.exe with high-risk access
    rights (for example 0x1038, 0x1438, 0x143a, or 0x1FFFFF), particularly with a call trace pointing
    at dbghelp.dll or dbgcore.dll?
  context: Reading LSASS memory requires a handle with substantial access rights, so monitoring Sysmon
    Event ID 10 for TargetImage ending in lsass.exe is one of the most direct detections for this technique.
    Alert when a non-allowlisted SourceImage requests high-risk masks; raise severity when CallTrace references
    the debug-help libraries used by MiniDumpWriteDump. Tuning means allowlisting genuine AV/EDR and backup
    agents, never deleting the rule. A positive result is an unexpected process holding dump-grade access
    to LSASS on a sensitive host, the core signal of Credential Access from LSASS memory. Include SourceImage,
    ParentImage, GrantedAccess, CallTrace, SourceUser, ProcessGuid, and TargetProcessId for pivoting.
  answer_sources:
  - Sysmon Event ID 10
  - Windows Event ID 4656
  - Windows Event ID 4663
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Sysmon EventCode=10 TargetImage=*\\lsass.exe

      | where SourceImage NOT IN (edr_av_backup_allowlist)

      | eval ga=lower(GrantedAccess)

      | where ga IN (''0x1038'',''0x1438'',''0x143a'',''0x1fffff'') OR (ga&0x10)=0x10

      | eval sev=if(match(CallTrace,''(?i)(dbghelp|dbgcore)\.dll''),''high'',''medium'')

      | table _time host SourceImage ParentImage GrantedAccess CallTrace SourceUser ProcessGuid TargetProcessId
      sev'
- question: Is the combination of source process, parent, granted access, call trace, and user accessing
    LSASS a first-seen tuple for the host role, or is the volume of such access spiking far above baseline?
  context: Benign LSASS access is dominated by a small, stable set of security and platform processes,
    so first-seen or volumetric anomalies are meaningful. Baseline (SourceImage, ParentImage, GrantedAccess,
    CallTrace, SourceUser) tuples by host role for 30 days and alert on first-seen tuples or daily count
    spikes of >= 5x baseline. Where Windows handle-auditing is enabled, also profile denied-versus-success
    ratios and raise priority when repeated denials are followed by a single success or a dump artifact.
    A positive result is a novel access tuple or burst on a Tier 0/1 host, indicating that an unusual
    actor has begun interacting with LSASS during Credential Access.
  answer_sources:
  - Sysmon Event ID 10
  - Windows Event ID 4656
  - Windows Event ID 4663
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=Sysmon EID 10 TargetImage=*lsass.exe earliest=-30d

      | stats count AS daily by host_role, SourceImage, ParentImage, GrantedAccess, CallTrace, SourceUser,
      date

      | eventstats avg(daily) AS base, stdev(daily) AS sd by host_role, SourceImage

      | where firstseen_tuple=1 OR daily >= 5*base

      | append [search 4656/4663 LSASS | stats count(Failure) AS denied count(Success) AS ok by SourceImage
      | where denied>0 AND ok>0]

      | table host_role SourceImage GrantedAccess daily base firstseen_tuple'
- question: When direct LSASS read telemetry is available, does an ML model classifying read sessions
    by total bytes read and read attempts flag a session as anomalous relative to its OS-build cohort?
  context: Some endpoint telemetry exposes the volume of memory read from LSASS, which distinguishes a
    full credential scrape from incidental access. Classify read sessions using total bytes read and total
    read attempts, maintaining separate models per OS version or build cohort because legitimate read
    profiles differ across builds. Output the session bytes, read count, nearest benign cluster distance,
    and model class so analysts can reason about the result; run this in parallel with the symbolic handle-access
    rule, never as a replacement. A positive result is a high-volume or anomalous read session against
    LSASS, characteristic of a complete credential harvest during Credential Access.
  answer_sources:
  - Sysmon Event ID 10
  - Windows Event ID 4656
  - Windows Event ID 4663
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days
  queries:
  - technology: Endpoint/ML pseudocode (read-session model)
    query: "models = {build: load('lsass_read_model_'+build) for build in os_builds}\nfor sess in lsass_read_sessions(window='-90d'):\n\
      \    m = models[sess.os_build]\n    cls, dist = m.classify(features=[sess.total_bytes, sess.read_attempts])\n\
      \    if cls=='anomalous':\n        alert(host=sess.host, bytes=sess.total_bytes, reads=sess.read_attempts,\n\
      \              benign_dist=dist, class=cls)\n# parallel to Sysmon EID 10 symbolic rule"
- question: Was an LSASS dump-file artifact created, for example a file matching *\lsass*.dmp or a large
    .dmp written to %TEMP%, %ProgramData%, %Public%, or a user profile by taskmgr.exe, procdump.exe, rundll32.exe,
    or WerFault.exe?
  context: A written dump file is concrete proof that LSASS memory was captured for offline parsing. Alert
    on Sysmon Event ID 11 or Windows Event ID 4663 when TargetFilename matches lsass-style dump names
    or a large .dmp lands in common staging directories created by a dump-capable process. Correlating
    to prior LSASS handle access within two minutes via ProcessGuid confirms the dump came from LSASS
    rather than an unrelated crash. Start with a size floor above 5 MB and tune upward if legitimate crash
    dumps are common. A positive result is an LSASS dump artifact on a sensitive host, the highest-fidelity
    evidence of successful Credential Access from LSASS.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days (2-minute correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (Sysmon EID 11, 4663)\n| eval f=lower(TargetFilename)\n| where match(f,'\\\\lsass.*\\\
      .dmp$')\n    OR (like(f,'%.dmp') AND path_in(f,'%temp%','%programdata%','%public%','users\\\\')\
      \ AND FileSize>5242880\n        AND creator_image IN ('taskmgr.exe','procdump.exe','rundll32.exe','werfault.exe'))\n\
      | join ProcessGuid [search Sysmon EID 10 TargetImage=*lsass.exe | eval acc_time=_time]\n| where\
      \ _time - acc_time <= 120\n| table _time host TargetFilename FileSize creator_image ProcessGuid"
- question: Is a dump-file's creator, output directory, or size statistically anomalous, or is the dump
    deleted, archived, or compressed within minutes of creation?
  context: Attackers stage and then quickly remove or compress dumps to evade detection and prepare exfiltration.
    Baseline dump-file creator, output directory, and size distributions by host role; alert when the
    creator is unseen in 30 days, the path is outside the usual top locations, the size exceeds the creator-specific
    95th percentile, or the dump is deleted/archived/compressed within 10 minutes. A positive result is
    an anomalous dump artifact or rapid cleanup on a sensitive host, indicating deliberate handling of
    stolen credential material during Credential Access. This catches cases where the file name does not
    match the obvious lsass*.dmp pattern.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days (30-day baseline, 10-minute cleanup window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (Sysmon EID 11, 4663) (TargetFilename=*.dmp OR TargetFilename=*.zip)

      | stats earliest(_time) AS t by host_role, creator_image, dir, FileSize, TargetFilename

      | eval p95=percentile95(FileSize, by=creator_image)

      | where creator_unseen_30d=1 OR dir NOT IN top_dirs OR FileSize>p95

      | join TargetFilename [search action IN (delete,archive,compress) | eval ct=_time]

      | eval cleaned=if(ct-t<=600,1,0)

      | table host creator_image dir FileSize cleaned TargetFilename'
- question: Does a temporal or provenance sequence model detect an LSASS handle-access to dump-file-creation
    to archive/delete/outbound-write chain even when individual steps look benign?
  context: Individual events (a handle open, a file write, an archive) can each appear normal, but their
    causal sequence is highly diagnostic of credential theft and exfiltration. Use a temporal sequence
    or whole-system provenance model over ProcessAccess -> FileCreate -> Archive/Delete/OutboundWrite
    and emit the exact chain of events and entities that drove the score, so the analyst can pivot immediately
    rather than chase a bare anomaly number. A positive result is a coherent dump-and-stage chain on a
    sensitive host, capturing the end-to-end Credential Access workflow that disjointed rules might miss.
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 10
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days
  queries:
  - technology: Provenance/ML pseudocode (KAIROS/FLASH-style)
    query: "graph = build_provenance_graph(window='-90d')\nfor path in graph.match('ProcessAccess(target=lsass.exe)\
      \ -> FileCreate(.dmp) -> {Archive|Delete|OutboundWrite}'):\n    score = seq_model.score(path)\n\
      \    if score >= threshold:\n        alert(host=path.host, chain=path.events, entities=path.nodes,\
      \ score=score)\n# emit full causal chain, not just a score"
- question: Were registry writes made to the SilentProcessExit or Image File Execution Options keys for
    lsass.exe (MonitorProcess, ReportingMode, GlobalFlag, DumpType=2, LocalDumpFolder), or did WerFault.exe
    access lsass.exe with 0x1FFFFF or create an LSASS-like dump?
  context: Adversaries abuse Windows Error Reporting by configuring SilentProcessExit or IFEO so that
    WerFault.exe is coerced into dumping LSASS, a stealthy living-off-the-land path that avoids running
    an obvious dumper. Monitor writes to HKLM\...\SilentProcessExit\lsass.exe and the IFEO key for lsass.exe
    and alert on the tell-tale value changes, and also alert when WerFault.exe accesses lsass.exe with
    full access or writes an LSASS dump. On Tier 0 assets any such registry write should be treated as
    critical. A positive result is configuration of, or execution via, the WER coercion path, an advanced
    Credential Access technique that defeats naive dumper-name detection.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - Sysmon Event ID 10
  - Sysmon Event ID 11
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (4657, Sysmon EID 13)\n| eval k=lower(TargetObject)\n| where (like(k,'%silentprocessexit\\\
      \\lsass.exe%') OR like(k,'%image file execution options\\\\lsass.exe%'))\n    AND value_name IN\
      \ ('MonitorProcess','ReportingMode','GlobalFlag','DumpType','LocalDumpFolder')\n| append [search\
      \ Sysmon EID 10 SourceImage=*werfault.exe TargetImage=*lsass.exe GrantedAccess=0x1FFFFF]\n| append\
      \ [search Sysmon EID 11 Image=*werfault.exe TargetFilename=*lsass*.dmp]\n| eval sev=if(host_role\
      \ IN ('Tier0','DC','PAW'),'critical','high')\n| table _time host TargetObject value_name Details\
      \ sev"
- question: Given that the SilentProcessExit and IFEO keys for lsass.exe should virtually never be written,
    did any write occur on a server or PAW, or a first-seen write on a workstation followed by WerFault
    access or .dmp creation within 15 minutes?
  context: These registry locations have near-zero legitimate write frequency, so their write rate is
    itself the signal. On servers and PAWs, alert on any write; on workstations alert on first-seen writes
    plus any subsequent WerFault.exe LSASS access or .dmp creation within 15 minutes. Persist medium-severity
    alerts even when the follow-on chain fails, because a failed setup attempt is valuable reconnaissance/staging
    intelligence that should not be discarded. A positive result is an unexpected write to these keys,
    signaling that an actor is preparing the WER-based LSASS dump path during Credential Access.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - Sysmon Event ID 10
  - Sysmon Event ID 11
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days (15-minute chain window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (4657, Sysmon EID 13)

      | where like(lower(TargetObject),''%silentprocessexit\\lsass.exe%'') OR like(lower(TargetObject),''%image
      file execution options\\lsass.exe%'')

      | eval alert=case(host_role IN (''server'',''PAW''),1, firstseen_write=1,1, true(),0)

      | where alert=1

      | join host [search (Sysmon EID 10 werfault->lsass) OR (Sysmon EID 11 werfault *.dmp) | eval ft=_time]

      | eval chained=if(ft-_time<=900,1,0), sev=if(chained=1,''high'',''medium'')

      | table _time host TargetObject chained sev   // keep medium alerts even if chain fails'
- question: Does a lightweight provenance model detect the RegistrySet -> WerFault ProcessAccess -> Dump
    FileCreate coercion chain, and does it report the modified keys, the writer process, and the final
    dump path?
  context: 'The WER coercion technique is fundamentally a small causal chain: a registry set followed
    by WerFault accessing LSASS and producing a dump. A lightweight provenance/graph-anomaly model over
    RegistrySet -> WerFault ProcessAccess -> Dump FileCreate detects this even when the registry change
    alone seems innocuous, and it should print the causal path, the modified keys, the writer process,
    and the final dump path rather than only a score. A positive result is a reconstructed coercion chain
    on a sensitive host, giving the analyst the complete WER-abuse Credential Access story with immediate
    pivot points.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - Sysmon Event ID 10
  - Sysmon Event ID 11
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days
  queries:
  - technology: Provenance/ML pseudocode
    query: "graph = build_provenance_graph(window='-90d')\nfor path in graph.match('RegistrySet(lsass\
      \ IFEO|SilentProcessExit) -> ProcessAccess(werfault->lsass) -> FileCreate(.dmp)'):\n    if anomaly_model.score(path)\
      \ >= threshold:\n        alert(host=path.host, causal_path=path.events, modified_keys=path.reg_keys,\n\
      \              writer=path.process, dump_path=path.file)\n"
- question: Was a new or modified entry added to the LSA Security Packages list (HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Security
    Packages or the OSConfig variant) that is not on the enterprise allow-list, references a DLL outside
    System32, or later loads into lsass.exe?
  context: Registering a malicious Security Support Provider DLL gives an adversary persistent, in-LSASS
    access to plaintext passwords and PINs as they are processed, a powerful Credential Access and persistence
    mechanism. Monitor writes to both Security Packages registry values and alert when a new entry is
    not allow-listed, points to a DLL outside System32, or results in a DLL load into lsass.exe. Raise
    to critical on Domain Controllers and PAWs, where an unauthorized SSP is catastrophic. A positive
    result is an unexpected SSP registration; correlating the subsequent Sysmon Event ID 7 image load
    into LSASS confirms the package actually took effect.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, Active Directory Certificate Services (AD CS) Servers, Privileged Access
    Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (4657, Sysmon EID 13)\n| where like(lower(TargetObject),'%\\\\control\\\\lsa\\\\\
      security packages%')\n    OR like(lower(TargetObject),'%\\\\control\\\\lsa\\\\osconfig\\\\security\
      \ packages%')\n| eval added=diff(NewValue,OldValue)\n| where added NOT IN (ssp_allowlist) OR NOT\
      \ like(lower(added_dll),'%\\\\system32\\\\%')\n| join host [search Sysmon EID 7 Image=*lsass.exe\
      \ ImageLoaded=*added_dll*]\n| eval sev=if(host_role IN ('DC','PAW'),'critical','high')\n| table\
      \ _time host TargetObject added added_dll sev"
- question: Does the SSP package list differ from its established baseline for the host role, and is the
    added DLL outside System32 or present on fewer than 1% of comparable hosts?
  context: The SSP list is extremely stable, so any delta is suspicious. Baseline the full Security Packages
    list by host role and flag any change; on Tier 0 assets treat any change as high priority, while elsewhere
    alert when the added DLL path is outside System32 or the package appears on under 1% of comparable
    hosts. Keep the before-and-after list in the alert so an analyst can immediately see exactly what
    was added. A positive result is a deviation from the SSP baseline on a sensitive host, signaling unauthorized
    SSP persistence that yields ongoing Credential Access to authentication secrets.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, Active Directory Certificate Services (AD CS) Servers, Privileged Access
    Workstations'
  range: Last 90 days (baseline of stable SSP list)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = ssp_list_by_role(window=''-90d'')

      source IN (4657, Sysmon EID 13) TargetObject=*Lsa*Security Packages*

      | eval delta = set_diff(NewValue, baseline[host_role])

      | eval prevalence = host_prevalence(delta_dll)

      | where delta != '''' AND (host_role=''Tier0'' OR NOT in_system32(delta_dll) OR prevalence < 0.01)

      | table host host_role baseline[host_role] NewValue delta prevalence   // include before/after'
- question: Does a DLL risk model score an added SSP DLL as high-risk based on signer, path, compile age,
    prevalence, import usage, and its image-load context within lsass.exe?
  context: Not every SSP change is malicious, so a risk model over signer, path, compile-age, prevalence,
    import usage, and subsequent lsass.exe image-load context helps rank which additions warrant urgent
    response. The alert must print the top three contributing features, and the model must run alongside,
    never replace, the deterministic registry rule. A positive result is a high-risk SSP DLL (for example
    unsigned, newly compiled, rare, and loaded into LSASS) on a Domain Controller, AD CS server, or PAW,
    indicating a deliberate Credential Access persistence implant rather than a benign platform change.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, Active Directory Certificate Services (AD CS) Servers, Privileged Access
    Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode (DLL risk model)
    query: "model = load('dll_risk_model')\nfor dll in newly_registered_ssp_dlls(window='-90d'):\n   \
      \ feats = [dll.signer, dll.path, dll.compile_age, dll.prevalence, dll.imports, dll.lsass_load]\n\
      \    score, top = model.score_explain(feats)\n    if score >= threshold:\n        alert(host=dll.host,\
      \ dll=dll.path, score=score, top3_features=top[:3])\n# parallel to deterministic registry rule"
- question: Are there repeated failed or denied attempts to open LSASS with read or full-access semantics
    by a non-allowlisted process, for example three or more 4656 Failure events or 4673 sensitive-privilege
    uses from the same process or user within five minutes?
  context: Blocked attempts (by EDR, ASR rules, or Credential Guard) are not noise; they reveal an actor
    probing for a working credential-dump path. Enable handle-access auditing for LSASS where feasible
    and alert on Windows Event ID 4656 Failure or 4673 sensitive-privilege use by a non-allowlisted process
    requesting LSASS read/full access. Start with three or more failures from the same ProcessName or
    User in five minutes and include DesiredAccess, Status, ProcessName, ParentProcessName, and SubjectUserName.
    A positive result is persistent denied LSASS access on a sensitive host, an early Credential Access
    warning before the adversary finds a path that succeeds.
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4673
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days (5-minute window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (4656, 4673) ObjectName=*lsass.exe* (Keywords=Failure OR EventCode=4673)\n| where\
      \ ProcessName NOT IN (lsass_access_allowlist)\n    AND has_read_or_full_access(DesiredAccess)\n\
      | bin _time span=5m\n| stats count AS fails by _time, ProcessName, SubjectUserName, ParentProcessName,\
      \ DesiredAccess, Status\n| where fails >= 3\n| table _time ProcessName ParentProcessName SubjectUserName\
      \ DesiredAccess Status fails"
- question: Does a process family's denied-to-success ratio for LSASS access exceed 0.8 with at least
    five attempts in ten minutes, or does a process transition from repeated failures to a single success,
    dump creation, registry tampering, or WerFault fallback?
  context: Profiling failure-to-success transitions captures the moment an adversary's probing pays off.
    Profile denied-versus-success LSASS access ratios per process family and host role, and alert when
    the failure ratio exceeds 0.8 with at least five attempts in ten minutes, or when a process moves
    from repeated failures to one success, a dump file, registry tampering, or a WerFault fallback. This
    deliberately preserves the signal from unsuccessful attacks instead of filtering it away. A positive
    result is a high-failure process that eventually succeeds or pivots to an alternate dump method on
    a sensitive host, marking a determined Credential Access attempt.
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4673
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days (10-minute window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source IN (4656, 4663, Sysmon EID 10) ObjectName=*lsass.exe*\n| bin _time span=10m\n| stats\
      \ count(eval(Status='fail')) AS denied count(eval(Status='ok')) AS ok by _time, proc_family, host_role\n\
      | eval ratio=denied/(denied+ok), attempts=denied+ok\n| where (ratio>0.8 AND attempts>=5)\n    OR\
      \ transition(denied_then: success|dump_create|registry_tamper|werfault_fallback)\n| table _time\
      \ proc_family host_role denied ok ratio"
- question: Does a sequence model over Windows audit-log events detect the pattern of a failed LSASS open,
    followed by privilege use, a retry, and a fallback dumper or registry action?
  context: 'Determined adversaries iterate: a failed LSASS open, then privilege adjustment, a retry, and
    finally a fallback dumper or registry-based path. A sequence model (for example an LSTM over audit-log
    event streams) detects this multi-step adaptation that point-in-time rules miss, and it should emit
    the exact subsequence so the analyst can see the attacker''s progression. A positive result is a recognized
    failure-then-fallback sequence on a sensitive host, exposing a persistent Credential Access effort
    that adjusted its technique after being blocked; running it alongside provenance models adds resilience.'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4673
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Privileged Access Workstations, Critical Application Servers, Tier 0/1 Servers'
  range: Last 90 days
  queries:
  - technology: Audit-log/ML pseudocode (LSTM sequence model)
    query: "model = load('audit_seq_lstm')\nfor seq in event_sequences_by_process(window='-90d'):\n  \
      \  score, subseq = model.score_explain(seq)  # e.g. failopen->privuse->retry->fallback\n    if score\
      \ >= threshold:\n        alert(host=seq.host, process=seq.process, score=score, subsequence=subseq)\n"
