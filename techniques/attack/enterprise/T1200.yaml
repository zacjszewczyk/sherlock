- question: Has the hourly count of new unregistered MACs per subnet exceeded its 7-day moving-average
    baseline by more than 3 standard deviations, or shown an abrupt step-increase per CUSUM/PELT change-point
    detection?
  context: 'A sudden rise in unregistered devices on a subnet can indicate a mass introduction of rogue
    hardware. Track the hourly count of new unregistered MACs per subnet as a frequency/volume metric,
    baseline with a 7-day moving average, and alert when the count exceeds mean+3sd. Apply CUSUM/PELT
    change-point detection to catch abrupt step-increases robustly, distinguishing a genuine mass-device
    event from normal onboarding seasonality. For Initial Access this catches scenarios where multiple
    rogue devices are seeded at once, or a single device that rapidly cycles MACs. A clear change-point
    or 3-sigma spike on a sensitive subnet warrants investigation; gradual increases tracking scheduled
    onboarding are expected and benign. Sources: [Change-point survey, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek dhcp.log
  - Zeek conn.log
  - NAC/802.1X authentication logs
