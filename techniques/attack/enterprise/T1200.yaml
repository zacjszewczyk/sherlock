    Prophet/SARIMA accounting for onboarding seasonality, and alert when actuals exceed the upper prediction
    interval, reporting predicted-vs-observed counts. Then score anomalous new rogue-device-to-host connection
    edges with unsupervised graph methods (Bowman et al GNN link-prediction) and rare cross-host paths
    with Hopper, to see whether the new device is already pivoting through the environment. For Initial
    Access, an actual count beyond the forecast interval flags an unusual influx of unmanaged hardware;
    graph-anomalous edges from those devices indicate the foothold is being leveraged. Counts within the
    interval and expected connectivity argue benign. Sources: [Cloud Intrusion Detection Using Time Series
    Forecasting](https://link.springer.com/article/10.1186/s13677-023-00491-x); [ARIMA anomaly detection,
    Pena et al](https://www.mdpi.com/2076-3417/11/7/3194); [Unsupervised graph AI lateral movement, Bowman
    et al (RAID 2020)](https://www.usenix.org/system/files/raid20-bowman.pdf); [Hopper, Ho et al (USENIX
    2021)](https://www.usenix.org/system/files/sec21-ho.pdf).'
