    because injected payloads often produce unusual process ancestry. For Initial Access this provides
    a robust, generalizing detector layered on top of the symbolic and statistical checks. A high-confidence
    anomalous command with suspicious lineage right after an HID arrival is a strong BadUSB indicator;
    a confident-benign verdict de-prioritizes the event. Sources: [BERT command-line anomaly detection,
