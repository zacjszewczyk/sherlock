    to a non-corporate IP) when scored with Isolation Forest / Extended Isolation Forest?
  context: 'Per-process behavioral profiles let you score how unusual post-attach activity is across multiple
    dimensions at once. Maintain profiles of each process''s typical parent and network destinations,
    then after a device event score subsequent activity for deviation (an unusual parent for rundll32,
    a first-ever connection to a non-corporate IP) by combining rarity features via Isolation Forest /
    Extended Isolation Forest and surfacing the top-3 deviating features. Derive thresholds per environment
    and validate on the CERT Insider Threat dataset. For Initial Access this distinguishes a hardware
    implant''s anomalous execution from routine software behavior even when no single attribute is alarming.
    A high anomaly score with clear deviating features (e.g., ''rundll32 parent unseen'' + ''dest IP non-corporate
    first-seen'') after an attach warrants review; activity matching established profiles is benign. Sources:
    [Isolation Forest, Liu et al](https://doi.org/10.1145/2133360.2133363); [Extended Isolation Forest,
    Hariri et al](https://arxiv.org/abs/1811.02141); [CERT Insider Threat dataset, CMU SEI](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
