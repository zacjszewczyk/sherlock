name: 'T1200: Hardware Additions'
id: 0b89b840-efd6-4a54-a3e7-c9f9834204eb
description: 'Investigate possible adversary Initial Access via unauthorized Hardware Additions — the
  physical introduction of computer accessories, networking hardware, or rogue computing devices (USB/Thunderbolt/PCIe
  implants, keystroke-injection BadUSB/Rubber Ducky, Hak5 LAN Turtle/Bash Bunny, Flipper, Pwnie Express,
  DMA-capable devices, and rogue wireless access points) used as an entry vector into a host or network.
  This playbook helps an analyst correlate new-device-arrival events (Windows Security EID 6416, Kernel-PnP
  400/410, Sysmon driver/process events, Linux udev/auditd, macOS unified logs) with tightly-windowed
  follow-on activity: malicious or unsigned driver installs and BYOVD abuse, failed/blocked driver loads,
  keystroke-injection process creation at machine speed, anomalous outbound network traffic to threat-intel
  destinations, low-prevalence JA3/JA4 fingerprints, connection/DNS failure bursts from rogue devices,
  offensive-hardware DHCP signatures, unregistered MAC addresses absent from the CMDB/NAC allow-list,
  802.1X/NAC authentication failures, and anomalous process parent-child lineage. It combines symbolic-logic
  correlation rules, statistical baselining/rarity scoring, and explainable machine-learning classifiers
  so a SOC analyst can quickly distinguish a routine peripheral from a hardware-based intrusion.'
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: After a new external device was recognized (Windows EID 6416 / Kernel-PnP 400/410, Sysmon
    6 driver load), did the host install a driver or create a service (EID 7045) within 60 seconds whose
    binary SHA256 matches known-bad threat intelligence, whose signing certificate is revoked/expired/deny-listed,
    or that is entirely unsigned?
  context: 'A hardware addition that delivers a malicious driver or service is a classic Initial Access
    foothold: the implant arrives over USB/Thunderbolt/PCIe and immediately registers kernel code. Correlate
    the device-arrival event with a driver load (Sysmon 6) or service creation (EID 7045) inside a 60-second
    window, then extract the binary SHA256 and the signer subject/thumbprint. A positive result is a hash
    on a TI feed, a revoked/expired/deny-listed certificate, or an unsigned driver — all strong indicators
    of a hardware-delivered implant. Maintain a per-device-model allow-list of expected driver hashes/signers;
    any deviation on a sensitive-area host (data center, executive suite) is alertable. Also watch for
    BYOVD: a freshly loaded signed-but-vulnerable driver followed by DeviceIoControl calls. A negative
    result (known-good signed driver matching the device model) downgrades the event to routine peripheral
    use. Sources: [6416(S): A new external device was recognized by the System, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-6416);
    [SigmaHQ external-device rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_external_device.yml);
    [BYOVD driver abuse, CrowdStrike](https://www.crowdstrike.com/en-us/blog/the-anatomy-of-wiper-malware-part-3/).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 6416
  - Windows Event ID 219
  - Sysmon Event ID 6
  - Code Integrity 3004/3033
  - 'NAI: All corporate endpoint devices (laptops, desktops, servers), particularly those in sensitive
    areas like data centers or executive suites.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'device=EID(6416) | join (driverload=Sysmon(6) OR svc=EID(7045)) on host where svc.time - device.time
      <= 60s

      | eval sha=coalesce(driverload.Hashes.SHA256, svc.ImageHash), signer=coalesce(driverload.Signature,
      svc.Signer)

      | where sha IN ti_badhash_feed OR signer_status IN (revoked,expired,denylist) OR driverload.Signed==false
      OR sha NOT IN model_allowlist[device.model]

      | alert priority=high'
  - technology: SIEM/Rule pseudocode (BYOVD)
    query: 'driverload=Sysmon(6) where Signed==true AND sha IN vulnerable_driver_list

      | join deviceio=Sysmon(deviceiocontrol/handle) on host within 120s

      | alert label=BYOVD'
- question: Following a new device-arrival event, did the host record a driver-load FAILURE (Code Integrity
    3004/3033 or EID 219) within 60 seconds, and are such failures recurring on the same host?
  context: 'Driver-load failures are a primary signal, not noise: when a hardware implant tries to load
    an unsigned or improperly signed kernel driver, Code Integrity rejects it (events 3004/3033) or the
    load fails (EID 219). A device arrival immediately followed by a rejected driver load strongly suggests
    an attacker is attempting to seat an implant driver. Count failures per host per hour — repeated rejections
    on a single host indicate an active, persistent hardware-implant attempt rather than a one-off glitch.
    In the Initial Access context this is often the earliest observable evidence, occurring before any
    successful code execution. A single isolated failure may be a benign signing/compatibility issue;
    clustered failures right after a device attach warrant containment. Sources: [USB-based attacks, Nissim
    et al](https://www.sciencedirect.com/science/article/abs/pii/S0167404817301578).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 6416
  - Windows Event ID 219
  - Sysmon Event ID 6
  - Code Integrity 3004/3033
  - 'NAI: All corporate endpoint devices (laptops, desktops, servers), particularly those in sensitive
    areas like data centers or executive suites.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'device=EID(6416) | join fail=(CodeIntegrity(3004,3033) OR EID(219)) on host where fail.time
      - device.time <= 60s | alert

      | stats count by host, bin(1h) | where count >= 2 | alert priority=high label=repeated_driver_load_failure'
- question: Does any newly installed driver (Sysmon 6) seen after a device attach exhibit high file/section
    Shannon entropy (section entropy near or above 7.0, or > fleet mean+3sd) or an anomalous import-table
    composition versus baseline signed drivers?
  context: 'Packed or obfuscated implant drivers stand out statistically from the population of legitimate
    signed drivers in the fleet. For each new driver file, compute file- and section-level Shannon entropy
    and characterize the import table (networking/crypto API ratios). Baseline against known-good drivers
    and flag entropy beyond mean+3sd — operationally, section entropy near 7.0 indicates packing per the
    EMBER methodology — or anomalous import ratios suggesting hidden C2/crypto capability. Derive the
    per-environment threshold using write-content entropy methods (ShieldFS). The alert must list the
    top contributing features (entropy value, unsigned flag, import category) so an analyst can adjudicate
    quickly. A high-entropy unsigned driver tied to a hardware attach is a strong implant indicator; a
    low-entropy signed vendor driver is routine. Sources: [EMBER, Anderson and Roth](https://arxiv.org/abs/1804.04637);
    [ShieldFS, Continella et al](https://conand.me/publications/continella-shieldfs-2016.pdf).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 6416
  - Windows Event ID 219
  - Sysmon Event ID 6
  - Code Integrity 3004/3033
  - 'NAI: All corporate endpoint devices (laptops, desktops, servers), particularly those in sensitive
    areas like data centers or executive suites.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each new_driver in Sysmon(6) after device_attach:\n  ent = shannon_entropy(file_sections);\
      \ imp = import_category_ratios(pe)\n  if ent > max(7.0, fleet_mean_ent + 3*fleet_sd_ent) OR imp.network_crypto\
      \ > baseline_p99:\n    alert(top_features=[ent, signed_flag, imp_category])"
- question: 'When a driver is installed within the post-attach window, does a gradient-boosted static-PE
    classifier (EMBER features: size, byte-entropy histogram, imports, signer validity/reputation) score
    it as malicious, and what are the top-3 SHAP contributors?'
  context: 'A supervised classifier trained on static driver/PE features generalizes beyond hardcoded
    hash/signature rules to catch novel hardware-delivered implant drivers. Classify any driver installed
    inside the post-attach correlation window and emit the top-3 SHAP/feature-importance contributors
    (e.g., byte-entropy histogram, unsigned flag, suspicious imports, poor signer reputation) so the verdict
    is explainable and defensible. A ''suspicious'' verdict on a driver tied to a new-device event triggers
    analyst review and possible host isolation. This complements the symbolic and statistical checks:
    it can flag a driver that is signed and low-entropy yet structurally similar to known malware. Tune
    the decision threshold against your fleet to control false positives, and treat high-confidence verdicts
    on sensitive-area hosts as priority Initial Access leads. Sources: [EMBER, Anderson and Roth](https://arxiv.org/abs/1804.04637);
    [SHAP-in-IDS review, Frontiers in AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full);
    [Extended Isolation Forest, Hariri et al](https://arxiv.org/abs/1811.02141).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 6416
  - Windows Event ID 219
  - Sysmon Event ID 6
  - Code Integrity 3004/3033
  - 'NAI: All corporate endpoint devices (laptops, desktops, servers), particularly those in sensitive
    areas like data centers or executive suites.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = ember_gbdt.load()\nfor each new_driver after device_attach:\n  feats = ember_features(new_driver);\
      \ score = model.predict_proba(feats)\n  if score >= calibrated_threshold:\n    alert(verdict='suspicious',\
      \ top3=shap_top_k(model, feats, 3))"
- question: Within 5 minutes of a new device-arrival event, did the host connect to a threat-intel-listed
    destination IP/domain/server_name, or present a deny-listed JA3/JA4 TLS fingerprint in Zeek ssl.log?
  context: 'A rogue hardware device often calls home shortly after attach to bootstrap C2 or exfiltration.
    Correlate the device-arrival event with the host''s subsequent Zeek conn/dns/ssl records within a
    5-minute window and alert when id.resp_h, query, or server_name matches an active TI feed, or when
    the TLS client fingerprint (JA3/JA4, emitted natively by Zeek) is on a deny list. In the Initial Access
    context this confirms that the introduced hardware established outbound communication to attacker
    infrastructure. A positive match is high-fidelity; a clean window with only known corporate destinations
    argues for benign peripheral use. Pivot on the matched destination to find other hosts beaconing to
    the same infrastructure. Sources: [6416(S): A new external device was recognized by the System, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-6416);
    [JA3/JA4 fingerprinting](https://github.com/salesforce/ja3).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 6416
  - 'NAI: Network egress points, DNS resolvers, and endpoint devices.'
  range: 'Last 90 days (event-centered: 5 min after each device arrival)'
  queries:
  - technology: Zeek/pseudocode
    query: 'device=EID(6416) | join (conn.log,dns.log,ssl.log) on host where event.time - device.time
      <= 5m

      | where conn.id.resp_h IN ti_feed OR dns.query IN ti_feed OR ssl.server_name IN ti_feed OR ssl.ja3
      IN ja3_denylist OR ssl.ja4 IN ja4_denylist

      | alert priority=high'
- question: In the 5-minute window after a device attaches, did the host generate an abnormal burst of
    failed connections (Zeek conn_state S0/REJ/RSTO) or NXDOMAIN DNS responses exceeding its baseline?
  context: 'Connection and DNS failures betray a rogue device probing for absent or not-yet-live C2 infrastructure
    — a classic beacon-bootstrap signature. In the post-attach window, count failed connections (conn_state
    in S0, REJ, RSTO) and NXDOMAIN responses from the host, and alert when failures exceed a per-host
    baseline (e.g., > 10 NXDOMAIN/min or > 20 S0 attempts/min). For Initial Access this is valuable because
    the failures appear even when the C2 endpoint is offline, sinkholed, or mistyped, catching the implant
    before successful contact. A burst of failures right after a hardware attach is suspicious; sustained
    low-rate failures consistent with the host''s history are likely benign. Sources: [DNS exfiltration
    detection, Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 6416
  - 'NAI: Network egress points, DNS resolvers, and endpoint devices.'
  range: 'Last 90 days (event-centered: 5 min after each device arrival)'
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'device=EID(6416) | window 5m after device.time on host

      | stats fails=count(conn_state IN (S0,REJ,RSTO)), nx=count(dns.rcode==NXDOMAIN) by host, bin(1m)

      | where nx > 10 OR fails > 20 OR fails > host_baseline_mean + 3*host_baseline_sd

      | alert'
- question: After a device arrival, is the host's outbound byte volume anomalous versus its baseline,
    and is the destination IP/domain/JA3 rare across the enterprise (first-seen IP, domain used by <0.1%
    of hosts, JA3 in the bottom 1% prevalence)?
  context: 'Combining per-host volume deviation with enterprise-wide rarity catches rogue-device exfiltration
    and stealthy C2 that no single signal would surface. Score (a) outbound byte volume (sum orig_bytes
    per 1-minute bin) against the host''s own baseline and (b) the rarity of the destination (first-seen
    IP, low-prevalence domain, uncommon JA3) and combine these into a single risk score with Isolation
    Forest / Extended Isolation Forest. Surface the top-3 driving features so the analyst sees why it
    scored high (e.g., ''dest IP first-seen'', ''volume 8x baseline''). Derive thresholds per environment
    from a 7-30 day window. For Initial Access, a high score immediately after a hardware attach points
    to data staging or C2 over the new device; a low score with familiar destinations and normal volume
    is routine. Sources: [Isolation Forest, Liu et al](https://doi.org/10.1145/2133360.2133363); [Extended
    Isolation Forest, Hariri et al](https://arxiv.org/abs/1811.02141).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 6416
  - 'NAI: Network egress points, DNS resolvers, and endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode (Isolation Forest)
    query: 'feats = [orig_bytes_per_min_vs_baseline, dest_ip_first_seen, domain_prevalence, ja3_prevalence]

      for each post_attach_flow: score = iforest.decision_function(feats)

      if score < anomaly_threshold(env, 7-30d): alert(top3=feature_importance(feats))'
- question: Does the host's observed post-attach outbound volume breach the upper prediction interval
    of an ARIMA/SARIMA or Prophet forecast, and do new rogue-device-to-internal-host edges score high
    for lateral movement via GNN link-prediction?
  context: 'Time-series forecasting models the host''s expected outbound volume so genuine deviations
    stand out from normal diurnal/weekly patterns. Forecast expected volume with ARIMA/SARIMA or Prophet
    and alert when the post-attach observed volume breaches the upper prediction interval; report predicted-vs-observed
    bytes and breach magnitude in the alert. Additionally, model new rogue-device edges to internal hosts
    with GNN link-prediction to catch the device pivoting inward (lateral movement bootstrapped from Initial
    Access). A breach of the prediction interval right after a hardware attach indicates abnormal data
    egress; edges that the GNN deems unlikely (a never-before-seen device suddenly talking to many internal
    hosts) corroborate a malicious foothold. Normal volume within the interval and expected internal talk
    patterns argue benign. Sources: [ARIMA anomaly detection, Pena et al](https://www.mdpi.com/2076-3417/11/7/3194);
    [Cloud Intrusion Detection Using Time Series Forecasting](https://link.springer.com/article/10.1186/s13677-023-00491-x);
    [Unsupervised graph AI lateral movement, Bowman et al (RAID 2020)](https://www.usenix.org/system/files/raid20-bowman.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 6416
  - 'NAI: Network egress points, DNS resolvers, and endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode (forecast + GNN)
    query: "fc = prophet_or_sarima.fit(host_outbound_volume_history).predict(now)\nif observed_post_attach_volume\
      \ > fc.upper_interval:\n  alert(predicted=fc.yhat, observed=observed, breach=observed-fc.upper)\n\
      for edge in new_device_to_internal_host_edges:\n  if gnn_link_pred(edge) < link_threshold: alert(label='lateral_movement_edge')"
- question: Does any new DHCP request (Zeek dhcp.log / wineventlog:dhcp) have a client MAC OUI or hostname
    matching known offensive-security hardware (Hak5 LAN Turtle/Bash Bunny, Flipper, Pwnie Express, Rubber
    Ducky, LAN Turtle), and are there DHCP requests that are DECLINED/NAK'd or that bypass DHCP entirely?
  context: 'Offensive-security gadgets frequently broadcast tell-tale OUIs or default hostnames when they
    request a lease. Monitor dhcp.log mac/host_name and alert when the OUI (first three bytes) or hostname
    matches a curated list of pentest-hardware vendors/default names, refreshed from device documentation.
    This is a high-confidence Initial Access signal: such hardware has little legitimate reason to be
    on a corporate segment. Also track the failure-mode — DHCP DECLINE/NAK events and devices that use
    a static IP with a MAC never seen leasing — because sophisticated operators may avoid DHCP to stay
    quiet. A match against the offensive-hardware list, or a static-IP device that bypassed DHCP entirely
    on a sensitive segment, warrants immediate investigation. Sources: [USB-based attacks, Nissim et al](https://www.sciencedirect.com/science/article/abs/pii/S0167404817301578).'
  answer_sources:
  - Zeek dhcp.log
  - Zeek conn.log
  - wineventlog:dhcp
  - 'NAI: Core network switches, DHCP servers, and wireless network segments.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'dhcp.log | eval oui=substr(mac,0,8)

      | where oui IN pentest_oui_list OR host_name MATCHES pentest_hostname_regex

      | alert priority=high

      // failure-mode: dhcp DECLINE/NAK, or conn.log MAC with no prior LEASE_GRANTED -> alert'
- question: For each new DHCP request, is the OUI never-before-seen and the hostname syntax (length, charset,
    hyphenation) a statistical outlier versus the fleet, and has the per-subnet new-MAC rate shown an
    abrupt change-point or a spike in DHCP DECLINE/NAK counts?
  context: 'Even unknown offensive hardware that is not on a signature list can be caught statistically.
    Profile the fleet distribution of OUIs and hostname syntax, then compute a rarity score for each new
    request — a never-before-seen OUI combined with anomalous hostname syntax yields a high anomaly score.
    Track DHCP DECLINE/NAK and request counts per subnet per minute as state/frequency signals, and apply
    CUSUM/PELT change-point detection to the per-subnet new-MAC rate to catch abrupt step-increases (mass
    device introduction) while staying robust to legitimate onboarding seasonality. For Initial Access
    this surfaces a rogue device whose vendor and naming differ from the standardized corporate fleet.
    A high rarity score plus a change-point in new-MAC rate on a core/wireless segment is suspicious;
    gradual increases matching scheduled onboarding are benign. Sources: [Change-point survey, Aminikhanghahi
    and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek dhcp.log
  - Zeek conn.log
  - wineventlog:dhcp
  - 'NAI: Core network switches, DHCP servers, and wireless network segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode (change-point)
    query: "for new_req in dhcp.log:\n  rarity = oui_unseen_score + hostname_syntax_outlier_score\n  if\
      \ rarity > p99: alert(features=[oui_unseen, hostname_entropy])\nper subnet: rate = count(new_mac)/hour;\
      \ cp = pelt_or_cusum(rate_series)\nif cp.changepoint_detected OR decline_nak_count > baseline+3sd:\
      \ alert"
- question: Does an Isolation Forest / Extended Isolation Forest trained on legitimate DHCP features (OUI,
    hostname length, character distribution, lease-request inter-arrival) score a new request as anomalous,
    and what are the top-3 contributing features?
  context: 'An unsupervised outlier model learns the multivariate shape of normal DHCP behavior and flags
    requests that deviate across several features at once — catching rogue hardware that looks normal
    on any single attribute. Train Isolation Forest / Extended Isolation Forest on legitimate DHCP features
    (OUI, hostname length, character distribution, lease-request inter-arrival) and score new requests,
    surfacing the top-3 contributing features (e.g., ''OUI unseen'', ''hostname entropy high'') for explainability.
    Validate and tune on device telemetry such as the CERT Insider Threat dataset. In the Initial Access
    context a high anomaly score on a new lease request signals an unauthorized device joining the network;
    the explainable features let the analyst confirm whether it resembles offensive hardware or a misconfigured
    but legitimate asset. Sources: [Isolation Forest, Liu et al](https://doi.org/10.1145/2133360.2133363);
    [Extended Isolation Forest, Hariri et al](https://arxiv.org/abs/1811.02141); [SHAP-in-IDS review,
    Frontiers in AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full);
    [CERT Insider Threat dataset, CMU SEI](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - Zeek dhcp.log
  - Zeek conn.log
  - wineventlog:dhcp
  - 'NAI: Core network switches, DHCP servers, and wireless network segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode (Isolation Forest)
    query: "model = iforest.fit(legit_dhcp[oui, hostname_len, char_dist, inter_arrival])\nfor new_req\
      \ in dhcp.log:\n  s = model.score(features(new_req))\n  if s < anomaly_threshold: alert(top3=shap_top_k(model,\
      \ features(new_req), 3))"
- question: Within 10 seconds of a new HID-class device arrival (EID 6416 with HID class GUID), was a
    process created (EID 4688 / Sysmon 1) for powershell.exe, cmd.exe, cscript.exe, wscript.exe, or mshta.exe
    whose command line contains high-risk substrings (-enc, -e, -w hidden, IEX, DownloadString, FromBase64String,
    Invoke-WebRequest)?
  context: 'BadUSB / Rubber Ducky devices register as a keyboard and inject keystrokes at machine speed
    (tens of milliseconds apart) to launch a payload — the physics of that cadence justify a very tight
    10-second correlation window. Correlate a new HID-class device arrival with a process creation for
    a scripting/LOLBin interpreter within 10 seconds and alert when the command line contains encoding/obfuscation/in-memory-download
    indicators. For Initial Access this is one of the most direct hardware-addition attack patterns: plug
    in, type the payload, execute. A positive hit (e.g., powershell -enc <base64> seconds after a keyboard
    ''arrives'') is high fidelity. A legitimate newly-attached keyboard generates no such interpreter
    spawn, so the correlation is naturally low-noise. Sources: [6416(S): A new external device was recognized
    by the System, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-6416);
    [SigmaHQ external-device rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_external_device.yml);
    [USB-based attacks, Nissim et al](https://www.sciencedirect.com/science/article/abs/pii/S0167404817301578).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 6416
  - Sysmon Event ID 1
  - 'NAI: All corporate endpoint devices, especially workstations in common areas or those used by privileged
    users.'
  range: 'Last 90 days (event-centered: 10 s after each HID arrival)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "hid=EID(6416) where DeviceClass==HID_GUID\n| join proc=(EID(4688) OR Sysmon(1)) on host where\
      \ proc.time - hid.time <= 10s\n| where proc.Image IN (powershell.exe,cmd.exe,cscript.exe,wscript.exe,mshta.exe)\n\
      \  AND proc.CommandLine MATCHES (-enc| -e |-w hidden|IEX|DownloadString|FromBase64String|Invoke-WebRequest)\n\
      | alert priority=high"
- question: For any command line spawned within 10 seconds of an HID arrival, is the string Shannon entropy
    or length above the 99th percentile of normal usage (e.g., entropy > 4.5 for PowerShell or length
    > 1000 characters), indicating Base64/obfuscation?
  context: 'Keystroke-injection payloads are typically encoded or obfuscated to fit a single injected
    command, which inflates both string entropy and length far above interactive usage. Compute Shannon
    entropy and length for every command line spawned within 10 seconds of an HID attach, baseline against
    normal interactive/scripted usage, and flag the 99th percentile (e.g., entropy > 4.5 for PowerShell,
    or length > 1000 chars). Report the entropy value and a decoded preview in the alert so the analyst
    can read the payload. In the Initial Access context, a high-entropy, long, encoded command appearing
    milliseconds after a ''keyboard'' is plugged in is strong evidence of a BadUSB payload. Short, low-entropy,
    human-typed commands are benign even right after a legitimate keyboard attach. Sources: [DNS exfiltration
    detection, Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 6416
  - Sysmon Event ID 1
  - 'NAI: All corporate endpoint devices, especially workstations in common areas or those used by privileged
    users.'
  range: 'Last 90 days (event-centered: 10 s after each HID arrival)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'hid=EID(6416) | join proc on host within 10s

      | eval ent=shannon_entropy(proc.CommandLine), len=length(proc.CommandLine)

      | where (proc.Image~=''powershell'' AND ent > 4.5) OR len > 1000

      | alert(entropy=ent, decoded_preview=b64decode_try(proc.CommandLine))'
- question: Does a BERT-style command-line embedding model with COPOD/Isolation-Forest outlier scoring
    (or a fine-tuned classifier) flag a command line spawned after an HID attach above a calibrated confidence
    (>0.9), and is the parent-child lineage anomalous?
  context: 'Embedding-based models capture semantic structure that simple substring and entropy rules
