- question: Within 60 seconds of a new device-arrival event, was a process created (Sysmon 1 / EID 4688)
    with an anomalous parent (e.g., services.exe spawning cmd.exe, or rundll32 with no/odd parent), and
    did such a process make a first-time outbound connection (Sysmon 3 / EID 5156)?
  context: 'Hardware-delivered implants frequently execute through abnormal process ancestry that violates
    normal Windows process trees. Trigger when a device-arrival event is followed within 60 seconds by
    a Sysmon 1 process whose ParentImage is not a standard interactive shell/system process (e.g., services.exe
    spawning cmd.exe, rundll32 with no or an odd parent), and include first-time outbound connections
    (Sysmon 3 / EID 5156) by such processes. For Initial Access this catches the post-attach code execution
    stage even when the binary itself is not yet known-bad. A system service suddenly spawning a shell
    seconds after a device attach is highly suspicious; normal user-launched applications with expected
    parents are benign. Also surface blocked/failed executions and access-denied events in the same window
    as corroborating signals. Sources: [6416(S): A new external device was recognized by the System, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-6416);
    [SigmaHQ external-device rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_external_device.yml).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Windows Event ID 6416
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - 'NAI: All corporate endpoint devices, Security Information and Event Management (SIEM) system.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "device=EID(6416) | join proc=Sysmon(1) on host where proc.time - device.time <= 60s\n| where\
      \ proc.ParentImage NOT IN normal_parents[proc.Image]\n  OR (proc.Image~='rundll32' AND proc.ParentImage\
      \ IN (none, odd))\n| join net=(Sysmon(3) OR EID(5156)) on proc.pid where net.dest first_seen_for(host)\n\
      | alert priority=high"
