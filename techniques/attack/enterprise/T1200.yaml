      if c > ma + 3*sd OR pelt_cusum(c_series).changepoint: alert(subnet, c, ma)'
- question: Does a Prophet/SARIMA forecast (accounting for onboarding seasonality) of expected daily new/unregistered-device
    counts get breached by actuals, and do new rogue-device-to-host edges score high for lateral movement
    / rare cross-host paths?
  context: 'Seasonal forecasting separates a genuine rogue-device surge from predictable onboarding cycles
