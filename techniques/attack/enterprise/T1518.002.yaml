name: 'T1518.002: Software Discovery: Backup Software Discovery'
id: 5c30badf-be13-4404-853d-0f8521197c99
description: 'This playbook helps an analyst investigate whether an adversary has performed Backup Software
  Discovery (T1518.002) to inventory installed backup products, agents, services, and recovery configurations
  in order to shape destructive follow-on actions such as Inhibit System Recovery, Data Destruction, or
  Data Encrypted for Impact. It guides the hunt across three behavioral angles spanning Windows, Linux,
  and macOS: (1) execution of backup-discovery command lines and tools -- native utilities (tasklist,
  sc query, reg query, wmic, driverquery, findstr on Windows; dpkg/rpm/systemctl/grep/find on Linux; mdfind/system_profiler/launchctl
  on macOS) and purpose-built enumerators (e.g., the Grixba recon tool used by Play ransomware) matching
  vendor keywords like Veeam, Acronis, CrashPlan, Commvault, Veritas, Backblaze, and Time Machine; (2)
  file access to backup configuration files, job definitions, and agent directories (install dirs, ProgramData
  config trees, /etc/rsnapshot.conf, /opt/veeam, Time Machine/CCC plists) consistent with mapping backup
  architecture; and (3) post-discovery network targeting of backup management servers, storage repositories,
  and SMB-accessible backup shares. Detection methods combine symbolic-logic rules (keyword/argument matching,
  anomalous interpreter parents, file-access and network correlation), statistical baselining (modified
  Z-score rarity, first-seen tuples, peer-relative and asset-tier scoring, failed/denied-attempt profiling,
  seasonal time-series bands), and machine learning (command-line embeddings/obfuscation classifiers,
  Isolation Forest/One-Class SVM with LIME, provenance-graph and sequence anomaly detection) applied to
  Windows Security/Sysmon events, PowerShell script-block logs, auditd, macOS unified logs, and Zeek network
  telemetry, so the analyst can corroborate suspected backup-software reconnaissance against process lineage,
  file access, account and asset context, and downstream connections to backup infrastructure.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
