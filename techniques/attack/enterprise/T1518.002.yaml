questions:
- question: '[Discovery] Hunt for backup discovery command-line and tool patterns: Can you determine whether
    a user or process performs focused discovery of backup products, agents, services, and recovery configurations
    using native utilities (tasklist, sc query, reg query, wmic, driverquery, findstr on Windows; dpkg/rpm/systemctl/grep/find
    on Linux; mdfind/system_profiler/launchctl on macOS) or purpose-built tools, often matching vendor
    keywords (Veeam, Acronis, CrashPlan, Commvault, Veritas, Backblaze, Time Machine) and backup-specific
    paths. This reconnaissance commonly precedes Inhibit System Recovery, Data Destruction, or Data Encrypted
    for Impact. -- specifically, using the ''Hunt for backup discovery command-line and tool patterns''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary enumerates installed backup
    software, agents, services, and recovery configurations to shape destructive follow-on actions such
    as Inhibit System Recovery (T1490), Data Destruction (T1485), or Data Encrypted for Impact (T1486).
    Identifying this reconnaissance early lets defenders disrupt the intrusion before backups are tampered
    with or repositories are targeted. This evidence focuses on the condition that a user or process performs
    focused discovery of backup products, agents, services, and recovery configurations using native utilities
    (tasklist, sc query, reg query, wmic, driverquery, findstr on Windows; dpkg/rpm/systemctl/grep/find
    on Linux; mdfind/system_profiler/launchctl on macOS) or purpose-built tools, often matching vendor
    keywords (Veeam, Acronis, CrashPlan, Commvault, Veritas, Backblaze, Time Machine) and backup-specific
    paths. This reconnaissance commonly precedes Inhibit System Recovery, Data Destruction, or Data Encrypted
    for Impact. This Symbolic Logic approach looks for the following signal: On process-creation telemetry
    (4688/Sysmon 1, 4104, auditd execve, macOS unified logs) alert when a single process command line
    matches a backup vendor keyword set OR a native discovery binary (tasklist, sc query, reg query \"...\\Veeam\",
    wmic product/service, driverquery, findstr/grep over backup paths). Use SigmaHQ portable rules as
    the floor ([SigmaHQ](https://github.com/SigmaHQ/sigma); [Tasklist discovery rule](https://github.com/SigmaHQ/sigma/blob/master/rules-threat-hunting/windows/process_creation/proc_creation_win_tasklist_basic_execution.yml))
    and add tool-specific coverage such as the [Grixba reconnaissance rule](https://github.com/SigmaHQ/sigma/blob/master/rules-emerging-threats/2025/Malware/Grixba/proc_creation_win_malware_grixba_recon.yml)
    for the Play ransomware enumerator that inventories backup/security software ([Symantec](https://symantec-enterprise-blogs.security.com/threat-intelligence/play-ransomware-volume-shadow-copy)).
    Combine keyword/argument matching with parent-image context per [Elastic suspicious command-shell
    arguments](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/).
    Raise severity (Volume/Frequency/State) when >=3 distinct backup keywords or >=5 discovery commands
    execute within 5 minutes from one process tree, when the actor is a non-admin or interactive remote/script
    session, or when the parent is user-writable. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates an actor is profiling the host''s backup and recovery posture in a way
    that deviates from sanctioned administration; pivot to the responsible process, its parent lineage,
    the acting account and host criticality tier, the specific backup vendors/paths touched, and any subsequent
    connections to backup management servers or repository shares. A negative result helps rule out this
    discovery vector on the inspected telemetry but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Linux auditd logs
  - macOS Unified Logs (process execution)
