questions:
- question: '[Stealth] Match Regsvr32 URL indicators to threat intel: Can you determine whether the regsvr32.exe
    process is executed with command-line arguments that include a URL (e.g., using scrobj.dll and the
    /i switch), and the target URL, domain, or IP address matches a known malicious indicator. Use process
    creation telemetry for command-line, parent-process, and user context. Validate the behavior against
    Zeek connection and DNS telemetry for destination, timing, and reputation context. -- specifically,
    using the ''Match Regsvr32 URL indicators to threat intel'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses the signed Windows
    binary regsvr32.exe to proxy execution of malicious code, hiding among legitimate COM-registration
    activity and bypassing application allowlists. This evidence focuses on the condition that the regsvr32.exe
    process is executed with command-line arguments that include a URL (e.g., using scrobj.dll and the
    /i switch), and the target URL, domain, or IP address matches a known malicious indicator. Use process
    creation telemetry for command-line, parent-process, and user context. Validate the behavior against
    Zeek connection and DNS telemetry for destination, timing, and reputation context. This Symbolic Logic
    approach looks for the following signal: Correlate process, file, and DNS/HTTP telemetry before applying
    the rule. Detect regsvr32.exe executions (Image endswith \regsvr32.exe OR OriginalFileName REGSVR32.EXE)
    whose command line contains an install switch (`/i`,`/i:`,`-i`) together with `http`, `https`, or
    `ftp` and/or `scrobj.dll`; extract the domain/IP and alert when it matches threat intelligence — the
    remote COM scriptlet ''Squiblydoo'' pattern ([Potentially Suspicious Regsvr32 HTTP/FTP Pattern, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_regsvr32_network_pattern.yml);
    [Regsvr32, LOLBAS Project](https://lolbas-project.github.io/lolbas/Binaries/Regsvr32/)). A positive
    result -- a rule match, statistical outlier, or model alert -- indicates regsvr32 behaving in a way
    inconsistent with sanctioned administrative or system use and is a strong sign of proxy execution;
    pivot to the responsible regsvr32 command line, its parent and child processes, the DLL/scriptlet
    provenance, the user/host context, and any outbound network destination for reputation and timing
    analysis. A negative result helps rule out this regsvr32 vector but should be corroborated with the
    other questions in this playbook, since a single method can miss obfuscated, low-and-slow, or living-off-the-land
    variants.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers; Network Egress Points; DNS Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match Regsvr32 URL indicators to threat intel (Symbolic Logic)

      source IN [''Windows Event ID 4688'', ''Zeek http.log'', ''Zeek dns.log'']

      | WHERE process.name == ''regsvr32.exe'' OR OriginalFileName == ''REGSVR32.EXE''

      | APPLY Rule: Correlate process, file, and DNS/HTTP telemetry before applying the rule

      | ALERT enrich(host, user, process, parent, child, command_line, module, dest, domain)'
