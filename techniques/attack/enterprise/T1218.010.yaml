name: 'T1218.010: System Binary Proxy Execution: Regsvr32'
id: 0f9e05b1-0354-46f9-a273-7966a5e4400d
description: 'This playbook helps an analyst investigate whether an adversary is abusing the signed Microsoft
  binary regsvr32.exe to proxy execution of malicious code and evade defenses (the ''Squiblydoo'' technique)
  under the Stealth tactic. Regsvr32 is network- and proxy-aware and can load remote COM scriptlets (scrobj.dll)
  or DLLs without writing to the registry, letting attackers bypass application control and blend in with
  normal Windows operations. The playbook guides the hunt across several behavioral angles: regsvr32 invocations
  whose command line carries a URL/FTP reference and an install switch matching threat intelligence; regsvr32
  spawned by atypical parents such as Office applications, browsers, or scripting engines (winword.exe,
  excel.exe, mshta.exe, wscript.exe, powershell.exe); regsvr32 registering or loading DLLs/scriptlets
  from user-writable or temporary directories instead of System32/SysWOW64; regsvr32 spawning child processes
  (cmd.exe, powershell.exe, rundll32.exe) or initiating outbound network connections; and the canonical
  ''/n'' ''/i:'' (and ''/u scrobj.dll'') Squiblydoo switch combination that executes a COM scriptlet without
  registration. Detection methods combine symbolic-logic rules, statistical baselining and change-point/rarity
  scoring, and explainable machine-learning models (Random Forest, Isolation Forest, One-Class SVM, command-line
  embeddings) applied to Windows process creation (Event ID 4688), Sysmon module load (Event ID 7) and
  network connection (Event ID 3/22) events, Windows Filtering Platform connections (Event ID 5156), and
  Zeek conn/http/dns telemetry, so the analyst can corroborate suspected regsvr32 proxy execution against
  command-line content, process lineage, module/DLL provenance, and outbound network context.'
type: technique
