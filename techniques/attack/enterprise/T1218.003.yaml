- question: 'Using a machine-learning model (Classify CMSTP executions with an explainable supervised
    model), can you score and flag likely malicious CMSTP.exe activity that evades static signatures?
    Specifically: Train a gradient-boosted or Random Forest classifier on labeled benign vs malicious
    cmstp.exe events using features such as command-line length/Shannon entropy, presence of `/s`/`/ns`/`/au`
    switches, INF path location (System32 vs user-writable), parent process, destination reputation, and
    connection state. Alert when predicted ''malicious'' confidence > 0.9 AND surface the top-3 contributing
    features (e.g., ''remote INF path'', ''high command-line entropy'', ''rare parent'') in the alert
    text for triage. Feature-based command-line classification with feature-importance explainability
    is demonstrated in [Obfuscated Command Line Detection Using Machine Learning (Mandiant)](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/);
    pair with the entropy baseline in [High Command Line Entropy Detected (Elastic)](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).'
