- question: 'Using deterministic rule logic (Alert on CMSTP auto-elevated COM sequences), can you confirm
    with deterministic logic that an adversary has abused CMSTP.exe to proxy-execute code or bypass defenses
    on this host? Specifically: Trigger when a Sysmon Event ID 1 for cmstp.exe (with `/au` or auto-elevate
    behavior) is followed within 60 seconds by Sysmon Event ID 7/10 referencing `CMLUA.dll`/`CMSTPLUA.dll`
    OR Event ID 12/13 touching CLSIDs `3E5FC7F9-9A51-4367-9063-A120244FBEC7` or `3E000D72-A845-4CD9-BD83-80C07C3B881F`.
    Also flag any process OTHER than cmstp.exe loading CMSTPLUA.dll (integrity-level elevation to High).
    This COM auto-elevation tradecraft is documented in [Research on CMSTP.exe (Oddvar Moe)](https://oddvar.moe/2017/08/15/research-on-cmstp-exe/)
    and encoded in [CMLUA Or CMSTPLUA UAC Bypass (Splunk)](https://research.splunk.com/endpoint/f87b5062-b405-11eb-a889-acde48001122/).'
  context: 'Information requirement: Has an adversary abused the Microsoft Connection Manager Profile
    Installer (CMSTP.exe) for defense evasion on the enterprise network? Tactic context (Stealth): the
    adversary abuses the signed, Microsoft-provided CMSTP.exe to proxy-execute malicious code and blend
    in with legitimate Connection Manager activity, reducing the likelihood of detection while leaving
    security controls intact. Evidence under investigation: An execution of cmstp.exe with the auto-install/auto-elevate
    behavior (e.g., `/au` or RunPreSetupCommandsSection abuse) is observed, followed within 60 seconds
    by a process-access or image-load event referencing CMLUA.dll/CMSTPLUA.dll or a registry modification
    involving the CMSTPLUA/CMLUAUTIL COM CLSIDs. This is the auto-elevated COM UAC-bypass chain. Use process-creation
    telemetry for command line, parent, integrity level, and user context; use module-load/registry telemetry
    to confirm the loaded DLL, modified keys, and write timing. Approach (Alert on CMSTP auto-elevated
    COM sequences): Trigger when a Sysmon Event ID 1 for cmstp.exe (with `/au` or auto-elevate behavior)
    is followed within 60 seconds by Sysmon Event ID 7/10 referencing `CMLUA.dll`/`CMSTPLUA.dll` OR Event
    ID 12/13 touching CLSIDs `3E5FC7F9-9A51-4367-9063-A120244FBEC7` or `3E000D72-A845-4CD9-BD83-80C07C3B881F`.
    Also flag any process OTHER than cmstp.exe loading CMSTPLUA.dll (integrity-level elevation to High).
    This COM auto-elevation tradecraft is documented in [Research on CMSTP.exe (Oddvar Moe)](https://oddvar.moe/2017/08/15/research-on-cmstp-exe/)
    and encoded in [CMLUA Or CMSTPLUA UAC Bypass (Splunk)](https://research.splunk.com/endpoint/f87b5062-b405-11eb-a889-acde48001122/).
    A positive result means CMSTP.exe activity on this host is consistent with proxy execution, application-control
    bypass, or auto-elevated COM UAC bypass - pivot from the hit to the process command line, parent process,
    user, integrity level, the referenced INF/SCT/DLL, any loaded modules or modified registry CLSIDs,
    child processes, and outbound connections to low-reputation destinations. A negative result means
    the observed activity matches expected baselines for legitimate Connection Manager/VPN profile installation.
    Investigate the named area of interest (User Workstations, Privileged Access Workstations) and correlate
    the CMSTP step with preceding payload staging and following execution, elevation, or network activity
    to establish the full retrieve -> proxy-execute -> elevate/connect chain.'
