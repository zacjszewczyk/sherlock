questions:
- question: 'Using deterministic rule logic (Alert on CMSTP command lines hitting IOC lists), can you
    confirm with deterministic logic that an adversary has abused CMSTP.exe to proxy-execute code or bypass
    defenses on this host? Specifically: Correlate Sysmon Event ID 1/4688 process creations with network
    telemetry (Sysmon Event ID 3, Zeek conn.log). Alert when `process.name` == ''cmstp.exe'' AND ((command
    line contains an INF/SCT/DLL whose SHA256 is on a blocklist) OR (destination IP/`dns.question.name`
    matches a threat-intel indicator) OR (command line contains proxy-execution switches such as `/s`/`/ns`
    referencing a remote `\\` UNC or http(s) path)). The signed-binary + remote-INF pattern is the canonical
    abuse documented in [Cmstp (LOLBAS Project)](https://lolbas-project.github.io/lolbas/Binaries/Cmstp/),
    [System Binary Proxy Execution: CMSTP (MITRE ATT&CK T1218.003)](https://attack.mitre.org/techniques/T1218/003/),
    and the [CMSTP Execution Process Creation (Sigma) rule](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmstp_execution_by_creation/).'
  context: 'Information requirement: Has an adversary abused the Microsoft Connection Manager Profile
    Installer (CMSTP.exe) for defense evasion on the enterprise network? Tactic context (Stealth): the
    adversary abuses the signed, Microsoft-provided CMSTP.exe to proxy-execute malicious code and blend
    in with legitimate Connection Manager activity, reducing the likelihood of detection while leaving
    security controls intact. Evidence under investigation: An execution of cmstp.exe is observed (Sysmon
    Event ID 1 / Windows 4688) that either references an INF/SCT/DLL whose SHA256 is on a blocklist or
    carries proxy-execution switches (e.g., `/s`, `/ns`), and/or initiates an outbound network connection
    (Sysmon Event ID 3, Zeek conn.log) to an IP/domain on a threat-intelligence feed. Legitimate cmstp.exe
    runs are tied to Connection Manager/VPN profile installation and are rare per host, so any remote
    retrieval is high-signal. Use process-creation telemetry for command line, parent process, and user
    context; validate against Zeek conn/dns telemetry for destination, timing, reputation, and connection
    success/failure state; use module-load telemetry to confirm which DLLs/scriptlets were actually loaded.
    Approach (Alert on CMSTP command lines hitting IOC lists): Correlate Sysmon Event ID 1/4688 process
    creations with network telemetry (Sysmon Event ID 3, Zeek conn.log). Alert when `process.name` ==
    ''cmstp.exe'' AND ((command line contains an INF/SCT/DLL whose SHA256 is on a blocklist) OR (destination
    IP/`dns.question.name` matches a threat-intel indicator) OR (command line contains proxy-execution
    switches such as `/s`/`/ns` referencing a remote `\\` UNC or http(s) path)). The signed-binary + remote-INF
    pattern is the canonical abuse documented in [Cmstp (LOLBAS Project)](https://lolbas-project.github.io/lolbas/Binaries/Cmstp/),
    [System Binary Proxy Execution: CMSTP (MITRE ATT&CK T1218.003)](https://attack.mitre.org/techniques/T1218/003/),
    and the [CMSTP Execution Process Creation (Sigma) rule](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmstp_execution_by_creation/).
    A positive result means CMSTP.exe activity on this host is consistent with proxy execution, application-control
    bypass, or auto-elevated COM UAC bypass - pivot from the hit to the process command line, parent process,
    user, integrity level, the referenced INF/SCT/DLL, any loaded modules or modified registry CLSIDs,
    child processes, and outbound connections to low-reputation destinations. A negative result means
    the observed activity matches expected baselines for legitimate Connection Manager/VPN profile installation.
    Investigate the named area of interest (User Workstations, Network Egress Points/Gateways, Internal
    DNS Resolvers) and correlate the CMSTP step with preceding payload staging and following execution,
    elevation, or network activity to establish the full retrieve -> proxy-execute -> elevate/connect
    chain.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Creation)
  - Sysmon Event ID 3 (Network Connection)
  - Sysmon Event ID 7 (Image loaded)
  - Zeek conn.log
  - 'NAI: User Workstations, Network Egress Points/Gateways, Internal DNS Resolvers'
  range: 'Last 90 days (event-centered: correlate within 60s of the CMSTP execution)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic rule: Alert on CMSTP command lines hitting IOC lists\nMATCH events FROM answer_sources\n\
      WHERE cmstp_abuse_condition()   // see approach below\n  AND enrich(parent_process, user, host,\
      \ command_line, integrity_level, destination)\nALERT WITH context\n// Approach: Correlate Sysmon\
      \ Event ID 1/4688 process creations with network telemetry (Sysmon Event ID 3, Zeek conn.log). Alert\
      \ when `process.name` == 'cmstp.exe' AND ((command line contains an INF/SCT/DLL whose SHA256 is\
      \ on a blocklist) OR (destination IP/`dns.question.name` matches a threat-intel indicator) OR (command\
      \ line contains proxy-execution switches such as `/s`/`/ns` referencing a remote `\\\\` UNC or http(s)\
      \ path)). The signed-binary + remote-INF pattern is the canonical abuse documented in [Cmstp (LOLBAS\
      \ Project)](https://lolbas-project.github.io/lolbas/Binaries/Cmstp/), [System Binary Proxy Execution:\
      \ CMSTP (MITRE ATT&CK T1218.003)](https://attack.mitre.org/techniques/T1218/003/), and the [CMSTP\
      \ Execution Process Creation (Sigma) rule](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmstp_execution_by_creation/)."
- question: 'Using statistical baselining (Flag newly registered / rare domains queried by CMSTP and profile
    their failure rate), can you identify anomalous CMSTP.exe activity that deviates from established
    host, user, and enterprise baselines? Specifically: Establish rolling host, user, and enterprise 30-day
    baselines before scoring. Enrich Zeek dns.log resolutions initiated by cmstp.exe with metadata (domain
    age, registrar, TLD), compute enterprise-wide query frequency, and flag domains that are both under
    30 days old AND in the bottom 1st percentile of frequency. Separately profile FAILURE state as a distinct
    signal: a cmstp.exe process generating NXDOMAIN responses or repeated blocked/failed TCP connections
    (Zeek `conn_state` S0/REJ) indicates staging against dead or sinkholed C2. Frequency/baseline rarity
    of LOLBin behavior is the core method in [Misbehaving binaries: How to detect LOLBins abuse in the
    wild (Red Canary)](https://redcanary.com/blog/threat-detection/lolbins-abuse/) and the periodicity
    baselining in [BAYWATCH (Hu et al.)](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks).'
