name: 'T1218.003: System Binary Proxy Execution: CMSTP'
id: efb14b42-9958-444d-9008-41fefbff3626
description: 'This playbook helps an analyst determine whether an adversary has abused the Microsoft Connection
  Manager Profile Installer (CMSTP.exe) to proxy execution of malicious code, bypass application control
  (AppLocker), or perform an auto-elevated COM User Account Control bypass (T1218.003). CMSTP.exe is a
  signed Microsoft binary that normally installs Connection Manager/VPN service profiles from an INF file
  and is rare on most hosts, so almost any use that references a remote or user-writable INF/SCT/DLL,
  supplies proxy-execution switches (e.g., /s, /ns, /au), or reaches out to the network is high-signal.
  The playbook surfaces that abuse across several behaviors: CMSTP command lines that hit IOC/blocklists
  or contact threat-intelligence-flagged destinations; the auto-elevated COM UAC-bypass chain involving
  CMLUA.dll/CMSTPLUA.dll and the CMSTPLUA/CMLUAUTIL CLSIDs; CMSTP executing from non-System32 paths or
  under anomalous parent processes (masquerading/LOLBin lineage); CMSTP spawning scripting/LOLBin children
  (powershell, rundll32, mshta, regsvr32) or beaconing to C2; and the ephemeral INF/SCT create -> execute
  -> delete staging pattern. It correlates Windows process-creation telemetry (Sysmon Event ID 1, Windows
  4688), module-load (Sysmon 7), process-access (Sysmon 10), registry (Sysmon 12/13), file create/delete
  (Sysmon 11/23), and network telemetry (Sysmon 3, Zeek conn.log/dns.log) to reconstruct the full retrieve
  -> proxy-execute -> elevate/connect chain. Detection blends symbolic-logic IOC and sequence rules, statistical
  baselining (rarity, percentile thresholds, beacon periodicity, failure-state profiling), and machine
  learning (explainable command-line classifiers, Isolation Forest, and provenance-graph anomaly detection)
  to deliver defensible alerts supporting the Stealth tactic.'
