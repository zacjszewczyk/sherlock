    (e.g., Gradient Boosting) on labeled malicious/benign emails. Engineer features such as source ASN/country,
    sender domain age, TLD rarity, edit-distance to protected domains, authentication verdicts, and aggregated
    threat-intel scores. Score new emails in real-time and alert when predicted malicious probability
    exceeds 0.90. Surface the top-3 contributing features (e.g., SHAP) in the alert so analysts see why
    it fired, not just a score ([A Modular and Adaptive System for BEC Detection](https://arxiv.org/abs/2308.10776),
    [An Explainable Transformer-based Model for Phishing Email Detection](https://arxiv.org/abs/2402.13871)).
    A positive result (IOC/watchlist match, threshold breach, or anomalous score) indicates a likely spoofed
    sender and warrants escalation, message quarantine/recall, and recipient notification; a negative
    result helps rule out spoofing for that sender but must be weighed against the other signals in this
    playbook.'
  answer_sources:
  - Zeek smtp.log
  - Zeek conn.log
  - 'NAI: DMZ network segment hosting email gateways, Network perimeter firewalls, Threat Intelligence
    Platform API endpoint'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = GradientBoosting.load()  # trained on labeled malicious/benign\nfeat = features(src_asn,\
      \ src_country, domain_age, tld_rarity,\n                edit_distance_to_protected, spf, dkim, dmarc,\
      \ ti_score)\np = model.predict_proba(feat)\nif p > 0.90: alert(p, top3=shap_top_features(feat))"
- question: 'Alert on high-value domains with SPF/DKIM failures: have we observed this condition in inbound
    mail, and what does it indicate about email spoofing during the Stealth phase?'
  context: 'Evidence: Zeek smtp.log and dns.log show an inbound email purporting to be from a high-value
    domain while SPF or DKIM authentication fails, or while the domain publishes a weak DMARC policy.
    Why it matters (Stealth): email spoofing lets an adversary hide behind a trusted identity and blend
    in with legitimate mail flow, so detection depends on scrutinizing authentication state, header/envelope
    consistency, and sending infrastructure. Approach (Symbolic Logic): Trigger an alert when an inbound
    email meets both: 1) the ''From'' header domain is on a watchlist of internal or high-value partner
    domains; 2) the email''s SPF or DKIM result is ''fail'' or ''softfail''. Require DMARC identifier
    alignment (RFC5322.From aligned with the SPF or DKIM authenticated domain), not merely an SPF/DKIM
    pass, because pass-without-alignment still permits header spoofing ([RFC 7489 DMARC](https://www.rfc-editor.org/rfc/rfc7489),
    [RFC 7208 SPF](https://www.rfc-editor.org/rfc/rfc7208)). Create a separate lower-severity alert for
    any high-value domain whose published DMARC policy is `p=none`, the documented spoofing precondition
    ([End-to-End Measurements of Email Spoofing](https://www.usenix.org/conference/usenixsecurity18/presentation/hu)).
    A positive result (IOC/watchlist match, threshold breach, or anomalous score) indicates a likely spoofed
    sender and warrants escalation, message quarantine/recall, and recipient notification; a negative
    result helps rule out spoofing for that sender but must be weighed against the other signals in this
    playbook.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Email security gateway, Corporate DNS resolvers, Directory of trusted partner domains'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for tx in smtp.log:\n  if tx.from_domain in high_value_watchlist:\n    aligned = dmarc_alignment(tx.from_domain,\
      \ tx.spf_domain, tx.dkim_domain)\n    if tx.spf in (\"fail\",\"softfail\") or tx.dkim==\"fail\"\
      \ or not aligned:\n      alert(\"high\", tx)\n  if dmarc_policy(tx.from_domain)==\"p=none\":\n \
      \   alert(\"low\", \"weak DMARC precondition\", tx.from_domain)"
- question: 'Monitor SPF/DKIM failure percentiles per sender: have we observed this condition in inbound
    mail, and what does it indicate about email spoofing during the Stealth phase?'
  context: 'Evidence: Zeek smtp.log and dns.log show an inbound email purporting to be from a high-value
    domain while SPF or DKIM authentication fails, or while the domain publishes a weak DMARC policy.
    Why it matters (Stealth): email spoofing lets an adversary hide behind a trusted identity and blend
    in with legitimate mail flow, so detection depends on scrutinizing authentication state, header/envelope
    consistency, and sending infrastructure. Approach (Statistical Method): For each external sender domain,
    maintain a 30-day rolling baseline of the daily SPF/DKIM/DMARC failure rate (an explicit failure-mode
    signal, distinct from volume). Calculate the 95th percentile of the historical failure rate and alert
    when the current day''s failure rate for a domain exceeds it, indicating an abnormal burst of authentication
    failures consistent with a spoofing run ([Email Delivery Security](https://conferences.sigcomm.org/imc/2015/papers/p27.pdf)).
    A positive result (IOC/watchlist match, threshold breach, or anomalous score) indicates a likely spoofed
    sender and warrants escalation, message quarantine/recall, and recipient notification; a negative
    result helps rule out spoofing for that sender but must be weighed against the other signals in this
    playbook.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Email security gateway, Corporate DNS resolvers, Directory of trusted partner domains'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for domain in external_senders:\n  hist = daily_auth_fail_rate(domain, last_30d)   # SPF/DKIM/DMARC\
      \ fails\n  thr = percentile(hist, 95)\n  if today_fail_rate(domain) > thr:\n    alert(domain, today_fail_rate(domain),\
      \ thr)"
- question: 'Detect spoofing spikes with seasonal anomaly models: have we observed this condition in inbound
    mail, and what does it indicate about email spoofing during the Stealth phase?'
  context: 'Evidence: Zeek smtp.log and dns.log show an inbound email purporting to be from a high-value
    domain while SPF or DKIM authentication fails, or while the domain publishes a weak DMARC policy.
    Why it matters (Stealth): email spoofing lets an adversary hide behind a trusted identity and blend
    in with legitimate mail flow, so detection depends on scrutinizing authentication state, header/envelope
    consistency, and sending infrastructure. Approach (Machine Learning): For each high-value sender domain,
    apply Seasonal Hybrid ESD (STL decomposition + robust MAD/ESD) to the hourly count of emails failing
    SPF/DKIM/DMARC, accounting for daily and weekly seasonality. Alert when the observed failure count
    exceeds the model''s expected range. Include the expected vs observed counts and the contributing
    hour/domain in the alert for explainability ([Automatic Anomaly Detection in the Cloud (S-H-ESD)](https://arxiv.org/pdf/1704.07706)).
    A positive result (IOC/watchlist match, threshold breach, or anomalous score) indicates a likely spoofed
    sender and warrants escalation, message quarantine/recall, and recipient notification; a negative
    result helps rule out spoofing for that sender but must be weighed against the other signals in this
    playbook.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Email security gateway, Corporate DNS resolvers, Directory of trusted partner domains'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for domain in high_value_domains:\n  series = hourly_count(auth_fail(domain))        # SPF/DKIM/DMARC\
      \ fails\n  model = SeasonalHybridESD(series)               # STL + robust MAD/ESD\n  if observed\
      \ > model.expected_upper:\n    alert(domain, hour, expected=model.expected, observed=observed)"
- question: 'Compare RFC5322.From and RFC5321.MailFrom for trusted domains: have we observed this condition
    in inbound mail, and what does it indicate about email spoofing during the Stealth phase?'
  context: 'Evidence: Zeek smtp.log shows a mismatch between the friendly From header domain and the SMTP
    envelope MAIL FROM domain, especially when the claimed sender is an internal account or trusted partner.
    Why it matters (Stealth): email spoofing lets an adversary hide behind a trusted identity and blend
    in with legitimate mail flow, so detection depends on scrutinizing authentication state, header/envelope
    consistency, and sending infrastructure. Approach (Symbolic Logic): For every inbound email, re-parse
    and normalize the headers yourself, then compare the `from` (RFC5322.From) and `path` (RFC5321.MailFrom)
    fields from `smtp.log`. Trigger a high-severity alert if their TLD+1 domains do not match AND the
    `from` domain is on a watchlist of internal/high-value partner domains. Additionally flag messages
    presenting multiple or ambiguous From headers, which are used to evade upstream authentication ([Composition
    Kills](https://www.usenix.org/conference/usenixsecurity20/presentation/chen-jianjun), [Weak Links
    in Authentication Chains](https://www.usenix.org/conference/usenixsecurity21/presentation/shen-kaiwen)).
    A positive result (IOC/watchlist match, threshold breach, or anomalous score) indicates a likely spoofed
    sender and warrants escalation, message quarantine/recall, and recipient notification; a negative
    result helps rule out spoofing for that sender but must be weighed against the other signals in this
    playbook.'
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Mail Transfer Agent (MTA) logs, Email security gateway inspection point'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for tx in smtp.log:\n  f = tld_plus_one(normalize(tx.from))      # RFC5322.From\n  m = tld_plus_one(normalize(tx.path))\
      \      # RFC5321.MailFrom\n  if f != m and f in trusted_watchlist:\n    alert(\"high\", from=f,\
      \ mailfrom=m)\n  if count_from_headers(tx) > 1: alert(\"high\", \"ambiguous From\", tx)"
- question: 'Flag rare (from, mailfrom) pairs for watchlisted senders: have we observed this condition
    in inbound mail, and what does it indicate about email spoofing during the Stealth phase?'
  context: 'Evidence: Zeek smtp.log shows a mismatch between the friendly From header domain and the SMTP
    envelope MAIL FROM domain, especially when the claimed sender is an internal account or trusted partner.
    Why it matters (Stealth): email spoofing lets an adversary hide behind a trusted identity and blend
    in with legitimate mail flow, so detection depends on scrutinizing authentication state, header/envelope
    consistency, and sending infrastructure. Approach (Statistical Method): Maintain a 90-day historical
    frequency map of all (`from` domain, `mailfrom` domain) pairs. For any new email where the `from`
    domain is a trusted entity, check whether the (`from`, `mailfrom`) pair has been seen before; if it
    is new or in the bottom 5th percentile of pairs for that `from` domain, flag it. This captures the
    ''trusted name, anomalous sender'' axis using only internal mail logs ([Detecting Credential Spearphishing
    in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho)).
    A positive result (IOC/watchlist match, threshold breach, or anomalous score) indicates a likely spoofed
    sender and warrants escalation, message quarantine/recall, and recipient notification; a negative
    result helps rule out spoofing for that sender but must be weighed against the other signals in this
    playbook.'
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Mail Transfer Agent (MTA) logs, Email security gateway inspection point'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "freq = pair_frequency_map((from_domain, mailfrom_domain), last_90d)\nfor tx in inbound where\
      \ tx.from_domain in trusted:\n  pair = (tx.from_domain, tx.mailfrom_domain)\n  if pair not in freq\
      \ or freq[pair] <= p05(freq, tx.from_domain):\n    flag(tx, pair)"
- question: 'Detect anomalies with autoencoder reconstruction error: have we observed this condition in
    inbound mail, and what does it indicate about email spoofing during the Stealth phase?'
  context: 'Evidence: Zeek smtp.log shows a mismatch between the friendly From header domain and the SMTP
    envelope MAIL FROM domain, especially when the claimed sender is an internal account or trusted partner.
    Why it matters (Stealth): email spoofing lets an adversary hide behind a trusted identity and blend
    in with legitimate mail flow, so detection depends on scrutinizing authentication state, header/envelope
    consistency, and sending infrastructure. Approach (Machine Learning): For each high-value `from` domain,
    train an autoencoder on the historical set of legitimate `mailfrom` domains (as categorical embeddings).
    Score each new email''s `mailfrom` by reconstruction error; an error above the 99th percentile of
    a validation set indicates an anomalous, likely spoofed sender. Report the nearest legitimate `mailfrom`
    and the deviating feature in the alert ([That Ain''t You: Behavioral Modelling](https://seclab.bu.edu/people/gianluca/papers/spearphishing-dimva2015.pdf)).
    A positive result (IOC/watchlist match, threshold breach, or anomalous score) indicates a likely spoofed
    sender and warrants escalation, message quarantine/recall, and recipient notification; a negative
    result helps rule out spoofing for that sender but must be weighed against the other signals in this
    playbook.'
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Mail Transfer Agent (MTA) logs, Email security gateway inspection point'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for domain in high_value_from_domains:\n  ae = Autoencoder.train(embed(legit_mailfrom_domains[domain]))\n\
      \  err = ae.reconstruction_error(embed(tx.mailfrom_domain))\n  if err > p99(validation_errors):\n\
      \    alert(tx, nearest_legit=nearest(tx.mailfrom_domain), error=err)"
- question: 'Trigger once bulk sending threshold is exceeded per IP/domain: have we observed this condition
    in inbound mail, and what does it indicate about email spoofing during the Stealth phase?'
  context: 'Evidence: Zeek smtp.log and conn.log show a burst of inbound mail from one source IP while
    the From header claims to be a trusted domain, which can indicate a coordinated spoofing run. Why
    it matters (Stealth): email spoofing lets an adversary hide behind a trusted identity and blend in
    with legitimate mail flow, so detection depends on scrutinizing authentication state, header/envelope
    consistency, and sending infrastructure. Approach (Symbolic Logic): Count emails per source IP for
    each trusted From domain over a 5-minute sliding window. Trigger an alert if the count exceeds a static
    threshold such as 100 messages, indicating a potential bulk spoofing run. Pair this volume rule with
    the per-message authentication state so a high-volume run that also fails DMARC alignment escalates
    ([RFC 7489 DMARC](https://www.rfc-editor.org/rfc/rfc7489)). A positive result (IOC/watchlist match,
    threshold breach, or anomalous score) indicates a likely spoofed sender and warrants escalation, message
    quarantine/recall, and recipient notification; a negative result helps rule out spoofing for that
    sender but must be weighed against the other signals in this playbook.'
  answer_sources:
  - Zeek smtp.log
  - Zeek conn.log
  - 'NAI: Network flow data collectors at the internet gateway, Email gateway transaction logs'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "window = sliding(5m)\nfor (src_ip, from_domain) in trusted_from_domains:\n  c = count(emails,\
      \ src_ip, from_domain, window)\n  if c > 100:\n    sev = \"high\" if any(dmarc==\"fail\") else \"\
      medium\"\n    alert(sev, src_ip, from_domain, count=c)"
