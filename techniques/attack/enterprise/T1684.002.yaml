    by more than 3 standard deviations, and track the concurrent failed-delivery/bounce rate as a corroborating
    failure-mode signal ([Detecting and Characterizing Lateral Phishing at Scale](https://www.usenix.org/conference/usenixsecurity19/presentation/ho)).
    A positive result (IOC/watchlist match, threshold breach, or anomalous score) indicates a likely spoofed
    sender and warrants escalation, message quarantine/recall, and recipient notification; a negative
    result helps rule out spoofing for that sender but must be weighed against the other signals in this
    playbook.'
  answer_sources:
  - Zeek smtp.log
  - Zeek conn.log
  - 'NAI: Network flow data collectors at the internet gateway, Email gateway transaction logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for (src_ip, from_domain) in pairs:\n  mu, sd = mean_std(volume_per_10m(src_ip, from_domain),\
      \ last_30d)\n  v = current_10m_volume(src_ip, from_domain)\n  if v > mu + 3*sd:\n    alert(src_ip,\
      \ from_domain, v, bounce_rate=current_bounce_rate())"
