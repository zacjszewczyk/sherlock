name: 'T1684.002: Social Engineering: Email Spoofing'
id: abce6dc6-9b6a-48f8-96ad-2f7260b35ac5
description: Investigate potential email spoofing in which an adversary forges sender identity by manipulating
  email headers (From, Reply-To, Return-Path/MAIL FROM) to impersonate trusted internal users, partners,
  or brands and establish contact under false pretenses. This playbook helps an analyst hunt for spoofed
  inbound mail by correlating SMTP metadata with threat intelligence, evaluating SPF/DKIM/DMARC authentication
  failures and weak DMARC policies (p=none), detecting mismatches between the RFC5322.From and RFC5321.MailFrom
  domains, identifying look-alike/homoglyph domains, and spotting anomalous sending infrastructure (unexpected
  ASN/country/reputation), bulk-send bursts, and Microsoft 365 Direct Send abuse. It supplies symbolic-logic
  rules, statistical baselines, and machine-learning approaches across Zeek (smtp/conn/dns/http logs),
  mail server logs, and cloud mail audit logs to surface stealthy spoofing campaigns that blend in with
  legitimate email traffic.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
