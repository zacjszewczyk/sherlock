questions:
- question: 'Match inbound SMTP metadata to threat intel IOCs: have we observed this condition in inbound
    mail, and what does it indicate about email spoofing during the Stealth phase?'
  context: 'Evidence: Zeek smtp.log and conn.log show an inbound email whose source IP, sender domain,
    or header domains match a high-confidence threat intelligence indicator tied to spoofed delivery infrastructure.
    Why it matters (Stealth): email spoofing lets an adversary hide behind a trusted identity and blend
    in with legitimate mail flow, so detection depends on scrutinizing authentication state, header/envelope
    consistency, and sending infrastructure. Approach (Symbolic Logic): Query all inbound email transactions.
    For each, compare the source IP (`id.orig_h` in `conn.log`) and header domains (`from`, `reply_to`,
    `path` in `smtp.log`) against a curated list of high-confidence malicious indicators. Trigger a high-severity
    alert for any match. Treat the authentication state (SPF/DKIM/DMARC verdict) as a corroborating signal:
    an IOC match arriving with `dmarc=fail`/`spf=fail` is higher confidence ([RFC 7489 DMARC](https://www.rfc-editor.org/rfc/rfc7489)).
    Alert text must list the matched indicator, the matching field, and the authentication verdict ([End-to-End
    Measurements of Email Spoofing](https://www.usenix.org/conference/usenixsecurity18/presentation/hu)).
    A positive result (IOC/watchlist match, threshold breach, or anomalous score) indicates a likely spoofed
    sender and warrants escalation, message quarantine/recall, and recipient notification; a negative
    result helps rule out spoofing for that sender but must be weighed against the other signals in this
    playbook.'
  answer_sources:
  - Zeek smtp.log
  - Zeek conn.log
  - 'NAI: DMZ network segment hosting email gateways, Network perimeter firewalls, Threat Intelligence
    Platform API endpoint'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for tx in smtp.log joined conn.log on uid:\n  fields = [conn.id_orig_h, tx.from_domain, tx.reply_to_domain,\
      \ tx.path_domain]\n  if any(f in threat_intel_iocs for f in fields):\n    sev = \"high\"\n    if\
      \ tx.dmarc==\"fail\" or tx.spf==\"fail\": sev = \"critical\"  # corroborating\n    alert(sev, matched_ioc,\
      \ matched_field, auth_verdict=tx.dmarc)"
- question: 'Flag emails that exceed reputation percentiles: have we observed this condition in inbound
    mail, and what does it indicate about email spoofing during the Stealth phase?'
  context: 'Evidence: Zeek smtp.log and conn.log show an inbound email whose source IP, sender domain,
    or header domains match a high-confidence threat intelligence indicator tied to spoofed delivery infrastructure.
    Why it matters (Stealth): email spoofing lets an adversary hide behind a trusted identity and blend
    in with legitimate mail flow, so detection depends on scrutinizing authentication state, header/envelope
    consistency, and sending infrastructure. Approach (Statistical Method): For each inbound email, aggregate
    reputation scores for the source IP and sender domain from multiple feeds. Calculate a weighted average
    risk score. Establish a threshold at the 85th percentile of scores observed from known-bad indicators
    over the last 30 days, and re-derive the percentile per environment. Track the rate of reputation
    lookups returning unknown/error as a distinct failure-mode signal, since deliberately fresh infrastructure
    evades reputation ([Email Delivery Security](https://conferences.sigcomm.org/imc/2015/papers/p27.pdf)).
    Flag any email exceeding this threshold for review. A positive result (IOC/watchlist match, threshold
    breach, or anomalous score) indicates a likely spoofed sender and warrants escalation, message quarantine/recall,
    and recipient notification; a negative result helps rule out spoofing for that sender but must be
    weighed against the other signals in this playbook.'
  answer_sources:
  - Zeek smtp.log
  - Zeek conn.log
  - 'NAI: DMZ network segment hosting email gateways, Network perimeter firewalls, Threat Intelligence
    Platform API endpoint'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = scores_from_known_bad(last_30d)\nthr = percentile(baseline, 85)            # re-derive\
      \ per environment\nfor email in inbound:\n  reps = [feed.lookup(email.src_ip), feed.lookup(email.from_domain)\
      \ for feed in feeds]\n  unknown_rate = mean(1 for r in reps if r in (unknown,error))\n  risk = weighted_avg([r.score\
      \ for r in reps if r.score])\n  if risk > thr or unknown_rate high: flag(email, risk, unknown_rate)"
- question: 'Score inbound email with supervised gradient boosting: have we observed this condition in
