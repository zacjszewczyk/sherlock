    Building host-IP communication graphs and raising a host''s risk after archive creation (CyberGraph)
    flags connections to low-reputation communities or emerging consolidation hubs where multiple compromised
    hosts funnel data. Scoring the actual transfer flow with the Kitsune online autoencoder ensemble,
    and modeling per-user file-aggregation anomalies with the Tuor decomposable autoencoder, adds behavioral
    confirmation. Surfacing the top-3 contributing features makes the lead explainable. A high graph-risk
    host transferring an anomalous flow to a low-reputation community shortly after archiving is a strong,
    corroborated exfiltration finding. References: [CyberGraph, Bowman et al.](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf)
