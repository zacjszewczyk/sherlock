name: 'T1537: Transfer Data to Cloud Account'
id: 2b567387-8a67-4cca-9d84-ff5a14b9a3c9
description: >-
  This playbook helps an analyst investigate whether an adversary has exfiltrated data by transferring
  it to another cloud account they control on the same cloud service (MITRE ATT&CK T1537), under the Exfiltration
  tactic. Because such transfers ride existing cloud-provider APIs and the provider's internal address
  space, they often evade controls watching for large external file transfers or command-and-control egress.
  It guides the hunt across several behavioral angles: cloud control-plane sharing events that name an
  out-of-org target (AWS CloudTrail ModifySnapshotAttribute/ModifyDBSnapshotAttribute/PutBucketPolicy/PutBucketAcl,
  Azure storageAccounts/listkeys and SAS generation, M365 SharingSet/AnonymousLinkCreated, Google Drive
  permission.add, Box collaboration.invite) validated against partner allow-lists and known-malicious
  block-lists; cloud-CLI sharing commands on developer workstations, admin jump boxes, and CI/CD agents
  (aws.exe/az.cmd/gcloud.cmd with modify-snapshot-attribute, put-bucket-policy, generate-sas, gsutil iam
  ch) captured by Windows Event ID 4688 and Sysmon Event ID 1; high-volume or egress-dominant network
  flows to cloud-provider CIDR ranges in Zeek conn.log; sharing actions initiated by principals or hosts
  outside an authorized 'Cloud Data Sharers' group; and first-seen or rare external target account IDs
  across the organization. Detection methods combine symbolic-logic allow/block validation, statistical
  baselining (failure-rate profiling, z-scores, first-time/IDF rarity, frequency baselines), and machine
  learning (Random Forest scoring, NLP command classification, Prophet/ARIMA forecasting, peer-group UEBA,
  and link-prediction/edge-anomaly scoring on the sharing graph), applied to AWS CloudTrail, Azure Activity
  Logs, M365/SaaS audit logs, Windows/Sysmon process telemetry, and Zeek network logs, so the analyst
  can corroborate suspected cross-account data transfer against identity, command, volume, destination
  rarity, and failure-state context.
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
contributors:
- Zachary Szewczyk
