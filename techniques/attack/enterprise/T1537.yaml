questions:
- question: >-
    [Exfiltration] Target account allow/block validation: Can you determine whether an AWS CloudTrail
    event with `eventName: ModifySnapshotAttribute` or an Azure Activity Log event for `Microsoft.Storage/storageAccounts/listkeys/action`
    contains a target account ID or principal in the `requestParameters` that is not present on a pre-approved
    partner allow-list or matches an entry on a known-malicious account block-list. -- specifically, using
    the 'Target account allow/block validation' (Symbolic Logic) approach?
  context: >-
    Why this matters: Under the Exfiltration tactic (TA0010), an adversary exfiltrates data by transferring
    it to another cloud account they control on the same service -- using snapshot sharing, bucket policy/ACL
    changes, SAS URI or anonymous link generation, or built-in SaaS sharing -- so the data leaves over
    internal cloud-provider address space and APIs rather than obvious external egress, blending into
    normal traffic. This evidence focuses on the condition that an AWS CloudTrail event with `eventName:
    ModifySnapshotAttribute` or an Azure Activity Log event for `Microsoft.Storage/storageAccounts/listkeys/action`
    contains a target account ID or principal in the `requestParameters` that is not present on a pre-approved
    partner allow-list or matches an entry on a known-malicious account block-list. This Symbolic Logic
    approach looks for the following signal: Extract every cloud sharing event (AWS `ModifySnapshotAttribute`/`ModifyDBSnapshotAttribute`/`PutBucketPolicy`/`PutBucketAcl`,
    Azure `storageAccounts/listkeys/action` and SAS generation) and compare the target `awsAccountId`/principal
    in `requestParameters` (e.g., `createVolumePermission.add.items[].userId`) to the maintained partner
    allow-list and known-malicious block-list. Fire high-severity when the target is outside the organization,
    absent from the allow-list, or on the block-list — the exact procedure detonated by [Exfiltrate EBS
    Snapshot by Sharing It, Stratus Red Team](https://stratus-red-team.cloud/attack-techniques/AWS/aws.exfiltration.ec2-share-ebs-snapshot/)
    and [Pacu](https://github.com/RhinoSecurityLabs/pacu). Use portable predicates from the [SigmaHQ cloud
    rules](https://github.com/SigmaHQ/sigma). A positive result -- a rule match, statistical outlier,
    or model alert -- indicates a cloud resource (snapshot, storage bucket/object, or shared file) may
    have been shared with or transferred to an account or principal outside the organization's trust boundary;
    pivot to the responsible principal/identity, the source host or CLI session, the target account ID/domain,
    the resource shared, and the success/fail state, and confirm whether the target is authorized. A negative
    result helps rule out this cross-account transfer vector but should be corroborated with the other
    questions in this playbook, since a single method can miss low-and-slow sharing, authorized-but-abused
    identities, or novel SaaS sharing paths.
  answer_sources: &id001
  - AWS CloudTrail logs
  - Azure Activity Logs
  - 'NAI: Cloud IAM and resource management APIs, SIEM alert dashboards'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      # Target account allow/block validation

      source IN [AWS CloudTrail logs, Azure Activity Logs]

      | WHERE matches_action_criteria("Target account allow/block validation")

      // Extract every cloud sharing event (AWS `ModifySnapshotAttribute`/`ModifyDBSnapshotAttribute`/`PutBucketPolicy`/`PutBucketAcl`,
      Azu

      | ALERT enrich(principal, source_host, target_account, resource, success_fail)
