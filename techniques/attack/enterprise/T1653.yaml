name: 'T1653: Power Settings'
id: 6d5a93af-0e11-4bf7-a2c1-076031546bd0
description: 'Investigate adversary abuse of system power-management configuration to defeat hibernation,
  sleep, standby, lock, reboot, and shutdown so that malicious processes and access persist on infected
  hosts. This playbook helps an analyst hunt for: (1) Windows powercfg.exe invocations that disable hibernate,
  zero-out or grossly inflate sleep/display/disk timeouts, manipulate AC/DC value indexes, or register
  power-request overrides; (2) macOS pmset commands and power assertions that prevent system/display/disk
  sleep; (3) Linux systemctl masking of sleep/suspend/hibernate targets and systemd-inhibit lock abuse;
  (4) power-management utilities spawned by anomalous parents such as office applications, browsers, or
  script interpreters; and (5) power-setting changes that are quickly followed by long-lived, low-volume,
  or periodic egress consistent with C2 beaconing. It combines deterministic symbolic-logic detections,
  statistical baselining/outlier and beaconing analytics, and machine-learning models (command-line obfuscation
  scoring, parent-child classifiers, and provenance/temporal-graph anomaly detection) to give a SOC analyst
  granular, defensible leads tying power-setting tampering to persistence.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did powercfg.exe execute with arguments that disable hibernation or set sleep, display, or
    disk timeouts to zero or an implausibly large value, or manipulate AC/DC value indexes on standby/monitor/disk
    GUIDs?
  context: 'Persistence via T1653 on Windows most often manifests as powercfg.exe being driven to keep
    a host awake so malware keeps running. Look for deterministic tokens from Microsoft''s powercfg reference:
    ''/hibernate off'', ''/change'' with any ''*-timeout-*'' set to 0 (disabled) or an absurd value, and
    ''/setacvalueindex'' or ''/setdcvalueindex'' against standby/monitor/disk GUIDs. A match is a high-fidelity
    floor signal; tune by allowlisting known admin/SCCM hosts rather than deleting the rule. A negative
    result does not clear the host, since attackers may use obfuscated or string-built invocations covered
    by other questions. Reference: [Microsoft powercfg command-line options](https://learn.microsoft.com/en-us/windows-hardware/design/device-experiences/powercfg-command-line-options).'
  answer_sources: &id001
  - Sysmon Event ID 1 (ProcessCreate)
  - Windows Event ID 4688
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: process_name='powercfg.exe' AND (cmdline MATCHES /(?i)\/h(ibernate)?\s+off/ OR cmdline MATCHES
      /(?i)-timeout-\S+\s+(0|[0-9]{4,})/ OR cmdline MATCHES /(?i)\/set(ac|dc)valueindex/) AND host NOT
      IN admin_sccm_allowlist
- question: Was powercfg.exe /requestsoverride used to register a persistent power request that blocks
    sleep, or powercfg /requests run to enumerate active sleep-blocking assertions?
  context: 'powercfg /requestsoverride installs a durable override that prevents the system from sleeping
    for a named process; ''/requests'' enumerates existing assertions and is useful reconnaissance for
    an attacker confirming the host will stay awake. Treat overrides that name user-facing processes (browsers,
    scripts, scripting hosts) as high severity because legitimate admins rarely pin such processes awake.
    Confirm against Microsoft''s powercfg reference. Correlate the override target process with other
    malicious activity on the host. Reference: [Microsoft powercfg command-line options](https://learn.microsoft.com/en-us/windows-hardware/design/device-experiences/powercfg-command-line-options).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: process_name='powercfg.exe' AND (cmdline MATCHES /(?i)\/requestsoverride/ OR cmdline MATCHES
      /(?i)\/requests(\s|$)/) | annotate severity=HIGH IF cmdline MATCHES /(?i)(chrome|firefox|msedge|wscript|powershell|cmd)/
- question: Are there repeated powercfg invocations that fail with ERROR_ACCESS_DENIED or a non-zero exit
    code, especially from non-administrator accounts attempting to change power schemes?
  context: 'Recording the outcome of each powercfg invocation turns success vs failure into a distinct
    signal. A non-admin repeatedly failing to alter power schemes is more consistent with scripted, opportunistic
    abuse than deliberate administrative action. Track exit codes and Windows error text; clusters of
    failures followed by an eventual success (e.g., after privilege escalation) are a strong persistence
    lead. Tie failures to the invoking user SID and parent process. Reference: [MITRE ATT&CK T1653](https://attack.mitre.org/techniques/T1653/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: process_name='powercfg.exe' | stats count, values(exit_code) BY user_sid, host, success | where
      (success=false AND user_sid NOT IN admin_sids AND count>=2)
- question: Is the per-host daily frequency or combination of powercfg executions an outlier versus a
    30+ day baseline, or is this the first-ever powercfg execution by a non-admin SID?
  context: Baseline per-host/day powercfg counts and argument combinations from at least 30 days of 4688/Sysmon-1
    history, then flag activity beyond the 99.5th percentile, bursts of multiple timeout changes within
    minutes, or a first-ever execution by a non-administrative SID. This statistical floor catches abuse
    that uses individually 'legal' arguments but at abnormal volume or by abnormal principals. A positive
    result warrants pivoting to the parent process and the specific settings changed.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: process_name='powercfg.exe' | bin _time span=1d | stats count BY host, day, user_sid | eventstats
      perc99_5(count) AS thr BY host | where count>thr OR (first_seen(user_sid) AND user_sid NOT IN admin_sids)
- question: Does the powercfg command line or its parent shell exhibit high Shannon entropy or encoded-wrapper
    patterns indicative of obfuscated delivery?
  context: 'Compute Shannon entropy and count high-entropy tokens on the powercfg command line and its
    parent shell command line. Entropy above roughly 4.0 bits/char, base64-like blobs, or string-concatenation
    wrappers (e.g., powercfg invoked via encoded PowerShell) suggest the attacker is hiding the true arguments
    from regex detections. Per Elastic''s high-command-line-entropy guidance, treat privileged commands
    with high entropy as suspicious. A positive result should escalate even if the literal powercfg tokens
    are not visible. Reference: [Elastic high command-line entropy](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: (process_name='powercfg.exe' OR parent_cmdline MATCHES /(?i)powercfg/) | eval ent=shannon_entropy(cmdline),
      pent=shannon_entropy(parent_cmdline) | where ent>4.0 OR pent>4.0 OR cmdline MATCHES /(?i)-enc|frombase64string/
- question: Do hourly powercfg execution counts per host deviate from the expected time-series cadence
    learned by an ARIMA/S-H-ESD model?
  context: Use ARIMA or Seasonal-Hybrid ESD on hourly powercfg execution counts per host to learn normal
    cadence and flag statistically significant deviations (sudden spikes or activity during unusual hours).
    Unlike static thresholds, this adapts to each host's rhythm. The alert text must surface the top-3
    contributing features (host, parent process, changed setting) so an analyst can triage quickly. Use
    this as an enrichment/lead generator that feeds the symbolic-logic confirmations.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: series = hourly_count(process_name='powercfg.exe') BY host | model=SHESD(series) | alert WHERE
      residual_anomaly=true | emit top3_features(host, parent_process, changed_setting)
- question: Do powercfg invocations and their wrapping command lines score as obfuscated under an embedding
    / small-language-model command-line anomaly detector?
  context: 'Score powercfg invocations and their wrapping shell command lines with an embedding-based
    obfuscation detector (e.g., small-language-model or BERT command-line embeddings per Tran et al. and
    CrowdStrike). This catches encoded or programmatically string-built executions that evade static regex.
    The model should report the most anomalous tokens so analysts understand why an invocation scored
    high. Combine a high obfuscation score with persistence context (timeout changes, suspicious parent)
    to raise confidence. References: [Command-line obfuscation detection with small language models, Tran
    et al.](https://arxiv.org/html/2408.02637v1), [CrowdStrike BERT command-line embeddings](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model=cmdline_obfuscation_embedding(process_name='powercfg.exe', features=[cmdline, parent_cmdline])
      | where anomaly_score>threshold | emit most_anomalous_tokens
- question: Did pmset execute with arguments that disable power saving, such as '-a sleep 0', '-a displaysleep
    0', '-a disksleep 0', '-a hibernatemode 0', '-a powernap 0', or '-a standby 0', or was 'pmset -g assertions'
    run for reconnaissance?
  context: 'On macOS the pmset utility configures power management; setting any timer to 0 disables it,
    keeping the Mac awake so malware persists. Alert on the deterministic disabling arguments above per
    the pmset reference, and on ''pmset -g assertions'' which an attacker uses to confirm sleep-blocking
    state. A match is a strong persistence lead; allowlist legitimate MDM/management workflows that intentionally
    disable sleep on kiosks or servers. Reference: [pmset reference (ss64)](https://ss64.com/mac/pmset.html).'
  answer_sources: &id002
  - macOS Unified Logs (process execution)
  - osquery (file_events)
  - Bash history
  - 'NAI: All macOS endpoints'
  range: Last 90 days
  queries:
  - technology: EDR/Rule pseudocode
    query: process='pmset' AND (cmdline MATCHES /(?i)-a\s+(sleep|displaysleep|disksleep|hibernatemode|powernap|standby)\s+0/
      OR cmdline MATCHES /(?i)-g\s+assertions/) AND host NOT IN mdm_managed_kiosks
- question: Are there processes holding sleep-preventing power assertions (PreventUserIdleSystemSleep,
    PreventSystemSleep, PreventUserIdleDisplaySleep) that are not on the approved allowlist of media/conferencing
    applications?
  context: 'Periodically enumerate ''pmset -g assertions'' and compare assertion-holders against an allowlist
    of legitimate apps (media players, presentation and conferencing software). An unexpected process
    holding PreventSystemSleep or PreventUserIdleSystemSleep is a direct mechanism for T1653 persistence
    on macOS. Per the pmset reference and MITRE, treat an unknown or attacker-named process holding such
    an assertion as high priority and pivot to its binary path, signature, and parent. References: [pmset
    reference (ss64)](https://ss64.com/mac/pmset.html), [MITRE ATT&CK T1653](https://attack.mitre.org/techniques/T1653/).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: EDR/Rule pseudocode
    query: assertions = parse(pmset -g assertions) | where assertion_type IN ('PreventUserIdleSystemSleep','PreventSystemSleep','PreventUserIdleDisplaySleep')
      AND holding_process NOT IN approved_media_apps
- question: Is the parent process of a pmset execution something other than a shell, MDM/management agent,
    or approved application, based on rare or previously unseen parent-child relationships?
  context: 'Score parent-child conditional probability for pmset executions and flag pairs below ~0.001
    or never seen before (per the ProblemChild approach). pmset spawned by an office app, browser, or
    downloaded script is highly suspicious versus pmset run from Terminal or a management agent. A rare
    parent strongly suggests automated abuse. Pivot to the parent''s origin (download, email attachment)
    to scope the intrusion. Reference: [ProblemChild](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: process='pmset' | eval pcp=cond_prob(parent_image, child_image) | where pcp<0.001 OR is_new_pair(parent_image,'pmset')
- question: Is the per-user/host frequency or timing of pmset invocations an outlier, is this a first-time
    use, or are there failed/denied pmset write attempts?
  context: Baseline per-user/host pmset invocation counts and timing, flag bursts beyond the 99th percentile
    and first-time use, and explicitly track failed or denied pmset writes (non-zero exit, missing sudo)
    as a separate signal. Denied attempts indicate an actor probing for the ability to disable sleep before
    escalating. Correlate failures with subsequent privilege-escalation activity and a later successful
    pmset change.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: process='pmset' | stats count, values(exit_code) BY user, host | eventstats perc99(count) AS
      thr | where count>thr OR first_seen(user,host) OR exit_code!=0
- question: Does an unsupervised outlier model over pmset frequency, timing, and command text flag significant
    per-user/host deviations?
  context: Model the frequency, timing, and command-text of pmset per user/host with an unsupervised outlier
    detector and alert on significant deviations, surfacing the top-3 features (parent, argument set,
    time-of-day) in the alert. This catches abuse that hides in individually-legal commands but at abnormal
    patterns. Use as a lead generator that an analyst confirms against the deterministic pmset argument
    and assertion checks.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model=unsupervised_outlier(process='pmset', features=[freq, hour, cmd_text]) BY user,host |
      where outlier_score>threshold | emit top3_features(parent, arg_set, time_of_day)
- question: Does the causal chain of an application spawning pmset followed by a downstream action form
    an anomalous subgraph in macOS whole-system provenance?
  context: 'Use a temporal graph neural network over macOS provenance (per KAIROS) to detect the app ->
    pmset modification -> follow-on action chain as an anomalous subgraph with explainable reconstruction
    error. This links the power-setting change to what the attacker does next (e.g., persistence install
    or egress), giving multi-stage context rather than a single event. The reconstructed subgraph helps
    an analyst understand and validate the full kill chain. Reference: [KAIROS whole-system provenance](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: Provenance/ML pseudocode
    query: graph=build_provenance(macos_unifiedlog) | gnn=temporal_GNN(graph) | flag subgraphs WHERE pattern=(app
      -> pmset -> followon) AND reconstruction_error>threshold | emit explainable_subgraph
- question: Did systemctl mask sleep.target, suspend.target, hibernate.target, or hybrid-sleep.target
    (or create equivalent symlinks to /dev/null in /etc/systemd/system) to disable suspend/hibernate?
  context: 'Masking the sleep/suspend/hibernate systemd targets makes it impossible for the system to
    enter those states, a clean persistence primitive on Linux. Alert on ''systemctl mask'' against these
    targets and on the equivalent manual symlink to /dev/null in /etc/systemd/system. Per Elastic''s Linux
    persistence primer and MITRE, this is rarely legitimate on workstations. Confirm via auditd execve
    and file-modification events, and check who/what created the symlink. References: [Elastic Linux persistence
    primer](https://www.elastic.co/security-labs/primer-on-persistence-mechanisms), [MITRE ATT&CK T1653](https://attack.mitre.org/techniques/T1653/).'
  answer_sources: &id003
  - Linux auditd logs
  - Syslog
  - Bash history
  - 'NAI: All Linux endpoints and servers.'
  range: Last 90 days
  queries:
  - technology: auditd/Rule pseudocode
    query: (exe='/usr/bin/systemctl' AND cmdline MATCHES /(?i)mask\b.*(sleep|suspend|hibernate|hybrid-sleep)\.target/)
      OR (syscall=symlink AND target='/dev/null' AND path MATCHES /\/etc\/systemd\/system\/.*(sleep|suspend|hibernate).*\.target/)
- question: Is systemd-inhibit being used to take block-mode locks on sleep/idle/shutdown with long or
    indefinite delays, particularly when the inhibited command is a shell or suspicious script?
  context: 'systemd-inhibit can take a ''block'' lock that prevents sleep/idle/shutdown for the lifetime
    of the inhibited command. Attackers wrap a shell or persistence script in systemd-inhibit to keep
    the host awake indefinitely. Alert on block-mode locks on sleep/idle/shutdown, especially with a shell/script
    as the inhibited command, and enumerate active locks with ''systemd-inhibit --list''. A suspicious
    inhibited command plus a long delay is a strong persistence indicator. Reference: [systemd-inhibit
    man page](https://manpages.ubuntu.com/manpages/jammy/man1/systemd-inhibit.1.html).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: auditd/Rule pseudocode
    query: exe MATCHES /systemd-inhibit/ AND cmdline MATCHES /(?i)--mode=?block/ AND cmdline MATCHES /(?i)--what=?\S*(sleep|idle|shutdown)/
      AND cmdline MATCHES /(?i)(bash|sh|python|perl|nc|curl|wget)/
- question: Are there repeated permission-denied auditd execve results for systemctl mask or systemd-inhibit
    commands by non-root users?
  context: 'Record the outcomes of mask/inhibit attempts; repeated permission-denied execve results for
    these commands by non-root users are a distinct abuse signal (per Elastic). It indicates an actor
    probing the ability to disable sleep before having sufficient privilege. Correlate denied attempts
    with later privilege escalation and an eventual successful mask/inhibit. Track the user, working directory,
    and parent process for each failure. Reference: [Elastic Linux persistence primer](https://www.elastic.co/security-labs/primer-on-persistence-mechanisms).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: auditd/Stats pseudocode
    query: exe IN ('/usr/bin/systemctl','/usr/bin/systemd-inhibit') AND (cmdline MATCHES /(?i)mask/ OR
      exe MATCHES /inhibit/) AND success=no AND uid!=0 | stats count BY uid, exe | where count>=2
- question: Did a new or rare process acquire a block inhibitor lock, exceed the 99th-percentile invocation
    frequency, or supply a high-entropy '--why' string?
  context: 'Baseline the processes that legitimately acquire inhibitor locks, then alert when a new/rare
    process takes a ''block'' lock, when invocation frequency exceeds the 99th percentile, or when the
    attacker-controlled ''--why'' description has high Shannon entropy (suggesting randomized/obfuscated
    text). Legitimate inhibitors come from a small, stable set (desktop session managers, package managers);
    deviation is suspicious. Pivot to the process binary and its parent for confirmation. References:
    [systemd-inhibit man page](https://manpages.ubuntu.com/manpages/jammy/man1/systemd-inhibit.1.html),
    [Elastic high command-line entropy](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: auditd/Stats pseudocode
    query: exe MATCHES /systemd-inhibit/ AND mode=block | eval why_ent=shannon_entropy(why_string) | eventstats
      perc99(count) AS thr BY host | where is_rare(process) OR count>thr OR why_ent>4.0
- question: Are systemctl or systemd-inhibit invocations parented by unexpected processes such as web
    servers, office applications, or script interpreters (parent-child probability below ~0.001 or unseen)?
  context: 'Score systemctl/systemd-inhibit parent-child conditional probability and flag invocations
    from unexpected parents (web servers, office/script processes) below ~0.001 or never seen (per ProblemChild).
    systemd-inhibit launched by nginx/apache, a PHP worker, or a downloaded script is a strong sign of
    web-shell or malware-driven persistence rather than legitimate administration. Pivot to the parent''s
    lineage to scope initial access. Reference: [ProblemChild](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: auditd/Stats pseudocode
    query: exe IN ('/usr/bin/systemctl','/usr/bin/systemd-inhibit') | eval pcp=cond_prob(parent_exe, exe)
      | where pcp<0.001 OR is_new_pair(parent_exe, exe)
- question: Do systemctl or systemd-inhibit command lines and their wrapping scripts score as obfuscated
    under an embedding / small-language-model detector?
  context: 'Apply small-language-model or embedding-based obfuscation detectors to systemctl/systemd-inhibit
    command lines and the wrapping scripts to catch encoded or string-built invocations that evade regex
    (per Tran et al. and CrowdStrike). Report the top contributing tokens so analysts can validate. A
    high obfuscation score on a sleep-target mask or block inhibitor is a strong persistence lead even
    when the literal tokens are hidden. References: [Command-line obfuscation detection with small language
    models, Tran et al.](https://arxiv.org/html/2408.02637v1), [CrowdStrike BERT command-line embeddings](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model=cmdline_obfuscation_embedding(exe IN ('systemctl','systemd-inhibit'), features=[cmdline,
      parent_cmdline]) | where anomaly_score>threshold | emit most_anomalous_tokens
- question: Were power-management utilities (powercfg.exe, pmset, systemctl, systemd-inhibit) spawned
    by unexpected parents such as office applications, browsers, or script interpreters (winword.exe,
    acrord32.exe, wscript.exe, or a shell spawned by a web server)?
  context: 'A power utility legitimately runs from a shell, an administrative tool, or a configuration-management
    agent. When the parent is winword.exe, acrord32.exe, wscript.exe, powershell, or bash spawned by a
    web server, it strongly suggests document/macro or web-shell-driven persistence. Enforce an allowlist
    of acceptable parents and alert on everything else, per MITRE and Elastic. This single rule spans
    Windows, macOS, and Linux power utilities. References: [MITRE ATT&CK T1653](https://attack.mitre.org/techniques/T1653/),
    [Elastic Linux persistence primer](https://www.elastic.co/security-labs/primer-on-persistence-mechanisms).'
  answer_sources: &id004
  - Sysmon Event ID 1 (ProcessCreate)
  - Windows Event ID 4688
  - macOS Unified Log
  - 'NAI: User workstations, Application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: child_image IN ('powercfg.exe','pmset','systemctl','systemd-inhibit') AND parent_image NOT
      IN allowed_parents(shell, mgmt_agent, admin_tools) AND parent_image IN (winword.exe, excel.exe,
      acrord32.exe, wscript.exe, mshta.exe, *httpd*, *nginx*, *php*)
- question: Do power-management utility executions have parent-child conditional probability below 0.001
    or represent previously unseen parent-child pairs in the environment baseline?
  context: 'Compute per-environment parent-child conditional probabilities from 4688/Sysmon-1/auditd history
    and flag power-utility executions with probability under 0.001 or with a never-before-seen parent
    (per ProblemChild). This statistical generalization of the allowlist catches novel anomalous parents
    that a static list would miss. A very rare lineage for a power-setting change is a high-quality lead;
    pivot to the parent''s origin and the specific settings altered. Reference: [ProblemChild](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: child_image IN ('powercfg.exe','pmset','systemctl','systemd-inhibit') | eval pcp=cond_prob(parent_image,
      child_image) | where pcp<0.001 OR is_new_pair(parent_image, child_image)
- question: Does a gradient-boosted parent-child classifier score the parentage of a power-management
    utility as high-risk?
  context: 'Score power-management-utility parentage with a gradient-boosted parent-child classifier (per
    ProblemChild) and alert on high-risk predictions, surfacing the top-3 contributing features (parent
    image, command tokens, lineage depth) in the alert text. The model captures non-linear combinations
    of features that simple probability or allowlists miss, while the feature attributions keep alerts
    explainable and triageable. Reference: [ProblemChild](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model=gbm_parent_child_classifier(child_image IN powermgmt_utils, features=[parent_image, cmd_tokens,
      lineage_depth]) | where risk_score>threshold | emit top3_features
- question: Does the parent -> power-utility -> configuration-change chain appear as an anomalous subgraph
    over whole-system provenance?
  context: 'Flag the parent -> power-utility -> config-change chain as an anomalous subgraph over whole-system
    provenance using a temporal GNN (per KAIROS), providing an explainable reconstructed attack graph.
    This connects the anomalous parentage to the actual power-setting modification and any follow-on,
    giving an analyst a multi-stage narrative rather than an isolated process event. Use the reconstructed
    graph to validate causality and scope. Reference: [KAIROS whole-system provenance](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: Provenance/ML pseudocode
    query: graph=build_provenance(sysmon1, 4688, auditd) | gnn=temporal_GNN(graph) | flag subgraphs WHERE
      pattern=(parent -> power_utility -> config_change) AND reconstruction_error>threshold | emit explainable_attack_graph
- question: Was a power-setting change (powercfg/pmset/systemctl or a power-related registry write) on
    a host followed within 10 minutes by a network connection to a threat-intelligence blocklisted destination?
  context: 'Adversaries disable sleep so a host stays reachable for C2. Correlate any power-setting change
    (process execution or Sysmon registry write) with outbound connections in the next 10 minutes and
    alert when the destination is blocklisted. Primary correlation runs on first-party Sysmon/Zeek/auditd
    logs without mandatory external lookups; the blocklist is an enrichment. A hit ties persistence directly
    to command-and-control and should be treated as a confirmed incident lead. Reference: [MITRE ATT&CK
    T1653](https://attack.mitre.org/techniques/T1653/).'
  answer_sources: &id005
  - Sysmon Event ID 1 (ProcessCreate)
  - Sysmon Event ID 13 (RegistryValue Set)
  - Google Cloud Audit Logs
  - macOS Unified Log
  - Zeek conn.log
  - 'NAI: All Endpoints (Workstations, Servers), Network Egress/Ingress Points, DNS Servers'
  range: Last 90 days; correlate within a 10-minute window after each power-setting change
