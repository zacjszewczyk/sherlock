- question: '[Stealth] Score destination-domain rarity and remote-fetch failure rates from DNS/proxy logs
    -- using the ''Statistical Method'' approach: Can you determine whether an Office application process
    (e.g., winword.exe, excel.exe) initiates a network connection to download a remote template, and the
    destination URL/domain/IP is found on a threat intelligence feed, or the hash of the downloaded template
    file matches a known malicious signature.'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary uses Template Injection
    to conceal and remotely fetch malicious code (or force authentication) through references in user
    document templates, leaving traces in process-execution, network-connection, and file telemetry. This
    evidence focuses on the condition that an Office application process (e.g., winword.exe, excel.exe)
    initiates a network connection to download a remote template, and the destination URL/domain/IP is
    found on a threat intelligence feed, or the hash of the downloaded template file matches a known malicious
    signature. The ''Statistical Method'' method pursues this signal as follows: For Office-initiated
    connections, compute the 90-day rarity of the destination TLD+1 from DNS/proxy logs and alert on domains
    in the bottom 5th percentile of organizational frequency. In parallel, profile FAILURE state as a
    distinct signal: track per-host rates of NXDOMAIN, HTTP 404/403, and blocked/RST connections from
    Office processes; repeated failed remote-template fetches indicate sinkholed or stale C2. Also baseline
    download VOLUME (bytes per fetch) and alert on 3-sigma deviation from the 30-day per-host mean, applying
    stateless lexical entropy as in Nadler et al. A positive result -- a rule match, statistical outlier,
    or model alert -- suggests an Office document is fetching or executing remote content (or forcing
    authentication) in a way that deviates from sanctioned behavior; pivot to the responsible Office process,
    its parent/child lineage, the user and host context, the remote destination, and any payload or credential-prompting
    resource involved. A negative result helps rule out this template-injection vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, short-lived, or
    living-off-the-land activity.'
