questions:
- question: '[Stealth] Cross-reference Office-initiated network destinations and file hashes against threat
    intel and LOLBin lists -- using the ''Symbolic Logic'' approach: Can you determine whether an Office
    application process (e.g., winword.exe, excel.exe) initiates a network connection to download a remote
    template, and the destination URL/domain/IP is found on a threat intelligence feed, or the hash of
    the downloaded template file matches a known malicious signature.'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary uses Template Injection
    to conceal and remotely fetch malicious code (or force authentication) through references in user
    document templates, leaving traces in process-execution, network-connection, and file telemetry. This
    evidence focuses on the condition that an Office application process (e.g., winword.exe, excel.exe)
    initiates a network connection to download a remote template, and the destination URL/domain/IP is
    found on a threat intelligence feed, or the hash of the downloaded template file matches a known malicious
    signature. The ''Symbolic Logic'' method pursues this signal as follows: Create a SIEM rule that cross-references
    destination URLs, domains, and IPs from network-connection events (Sysmon Event ID 3, Zeek conn.log)
    and DNS queries (Sysmon Event ID 22, Zeek dns.log) against threat-intelligence feeds, and compares
    downloaded file hashes (Zeek files.log) against known-malicious hash databases. Scope strictly to
    parent processes winword.exe/excel.exe/powerpnt.exe/outlook.exe and to fetches occurring within seconds
    of document open, the canonical remote-template signal (Executing Macros From a DOCX With Remote Template
    Injection, redxorblue). Alert on any match and enrich with the LOLBin and CISA/NSA LOTL reference
    sets. A positive result -- a rule match, statistical outlier, or model alert -- suggests an Office
    document is fetching or executing remote content (or forcing authentication) in a way that deviates
    from sanctioned behavior; pivot to the responsible Office process, its parent/child lineage, the user
    and host context, the remote destination, and any payload or credential-prompting resource involved.
    A negative result helps rule out this template-injection vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy, short-lived, or living-off-the-land
    activity.'
