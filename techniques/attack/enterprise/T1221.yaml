name: 'T1221: Template Injection'
id: 401e0715-6d5a-42a4-8709-48fe15ae7ec0
description: 'This playbook helps an analyst investigate whether an adversary is abusing Template Injection
  (MITRE ATT&CK T1221) to conceal and fetch malicious code, or to force authentication, via references
  embedded in user document templates. Under the Stealth tactic, an attacker injects a remote template
  reference into an OOXML document (e.g., the external relationship Target in word/_rels/settings.xml.rels
  of a .docx/.dotm) or alters the ''*\template'' control word in an .rtf file so that, when the document
  is opened, the Office application silently downloads and executes a payload that carries no macro or
  script at delivery time -- evading static detection until the remote payload is fetched. The same mechanism
  can point a template at a UNC/SMB or HTTPS URL to trigger forced NTLM authentication and capture credentials.
  The playbook guides the hunt across several behavioral angles on Windows endpoints and the network:
  Office applications (winword.exe, excel.exe, powerpnt.exe, outlook.exe) initiating remote-template network
  connections to threat-intel-flagged or statistically rare destinations seconds after document open;
  download-cradle command lines and obfuscated/encoded interpreter invocations spawned as Office child
  processes; RTF ''*\template'' control words and OOXML external relationship Targets pointing to HTTP(S)/SMB
  resources observed in files traversing email gateways, network egress, or written to disk; Office processes
  spawning anomalous children (cmd.exe, powershell.exe, wscript.exe, mshta.exe, LOLBins); Office-initiated
  outbound SMB (TCP/445) to external addresses indicative of forced authentication; and correlated fetch-then-execute
  chains where an Office process reaches a rare domain and then launches an interpreter within seconds.
  Each angle is pursued with three complementary detection methods -- symbolic-logic rules, statistical
  baselining/anomaly scoring, and machine-learning models -- applied to Windows Security/Sysmon process,
  network, and file telemetry and Zeek conn/dns/http/files/smb logs, so the analyst can corroborate suspected
  template injection against process lineage, destination rarity, command-line entropy, fetch-failure
  state, and forced-authentication context.'
type: technique
