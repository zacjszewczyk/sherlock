name: 'T1484.002: Domain or Tenant Policy Modification: Trust Modification'
id: bc96524e-1610-4d9b-95f0-401624930011
description: 'This playbook helps an analyst investigate adversary modification of domain or tenant trust
  relationships (MITRE T1484.002, Trust Modification) for the purposes of defense evasion and privilege
  escalation. It guides the hunt across the full attack surface of AD FS and Entra/Azure AD federation,
  on-premises Active Directory domain trusts, and external identity tenants. Specific angles include:
  addition of new AD FS token-signing certificates (Windows Event ID 259/307) that do not chain to internal
  PKI or match known-bad threat intelligence, enabling Golden SAML forgery; modification of AD FS claim
  issuance / claim rules (Event ID 501) to inject high-privilege SIDs, spoof MFA-bypass claims, or assert
  arbitrary identity; on-premises domain trust changes (Event ID 4703) followed by anomalous cross-domain
  Type-3 logons (Event ID 4624/4625) lacking a causal source host; conversion of domains from Managed
  to Federated via PowerShell cmdlets (Convert-MsolDomainToFederated, Set-MsolDomainFederationSettings,
  Update-MSOLFederatedDomain) or ''Set domain authentication'' audit events; addition of rogue trusted
  realms / IssuerUri values that are newly registered, high-entropy, or TI-flagged; geographically or
  temporally anomalous privileged sessions performing trust changes; and anomalous AD FS server egress
  to unapproved external identity providers. Detection methods combine symbolic-logic allow-list/regex/correlation
  rules, statistical baselining and frequency/rarity scoring, and machine-learning anomaly models (Isolation
  Forest, One-Class SVM, time-series forecasting) with SHAP-based explainability, applied to Windows Security/AD
  FS/PowerShell logs, m365:unified and azure:signinlogs, and Zeek conn/ssl/dns/intel telemetry.'
type: technique
