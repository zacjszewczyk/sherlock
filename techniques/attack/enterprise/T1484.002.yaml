questions:
- question: '[Defense Impairment] New signing certificate allow-list and TI check: Can you determine whether
    a new AD FS token-signing certificate is added (Windows Event ID 259) where the certificate is not
    issued by internal PKI, the thumbprint matches a known-bad list, or its properties (subject/issuer
    entropy, validity period, key size) deviate from the baseline of legitimate certificates. Adding an
    attacker-controlled signing certificate enables Golden SAML token forgery. -- specifically using the
    ''New signing certificate allow-list and TI check'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), MITRE T1484.002 (Trust Modification)
    lets an adversary add or alter domain/tenant trust relationships -- adding attacker-controlled token-signing
    certificates, converting domains to federated, injecting rogue identity providers or claim rules,
    or forging cross-domain/cross-tenant trust -- to evade defenses and escalate privileges (e.g., Golden
    SAML, cross-tenant impersonation). This evidence focuses on the condition that a new AD FS token-signing
    certificate is added (Windows Event ID 259) where the certificate is not issued by internal PKI, the
    thumbprint matches a known-bad list, or its properties (subject/issuer entropy, validity period, key
    size) deviate from the baseline of legitimate certificates. Adding an attacker-controlled signing
    certificate enables Golden SAML token forgery. This Symbolic Logic approach works as follows: On Windows
    Event ID 259 (and AD FS config Event ID 307), extract the new token-signing certificate thumbprint/serial
    and (1) alert on ANY certificate not chaining to internal PKI, (2) alert on additions outside an approved
    maintenance window, and (3) match the thumbprint against a known-bad TI feed. Legitimate AD FS auto-rollover
    occurs ~yearly, so any unscheduled signing-certificate addition is high-fidelity per Golden SAML,
    CyberArk (https://www.cyberark.com/resources/threat-research-blog/golden-saml-newly-discovered-attack-technique-forges-authentication-to-cloud-apps)
    and Remediation and Hardening for M365 vs UNC2452, Mandiant (https://cloud.google.com/blog/topics/threat-intelligence/remediation-and-hardening-strategies-for-microsoft-365-to-defend-against-unc2452).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong signal that
    a trust or federation relationship has been tampered with to enable identity forgery or unauthorized
    cross-boundary access; pivot to the responsible account, source host, the exact object/setting changed,
    any associated change ticket, and the authentication that follows the change. A negative result helps
    reduce confidence in this specific vector but should be corroborated with the other questions in this
    playbook, since trust modification is low-frequency, high-impact, and can be staged across endpoint,
    identity-provider, and network telemetry.'
  answer_sources:
  - Windows Event ID 259
  - Windows Event ID 4104
  - Windows Event ID 307
  - 'NAI: Active Directory Federation Services (AD FS) servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# New signing certificate allow-list and TI check

      source IN [Windows Event ID 259, Windows Event ID 4104, Windows Event ID 307]

      | where matches_trust_modification_condition()  // see method below

      // On Windows Event ID 259 (and AD FS config Event ID 307), extract the new token-signing certificate
      thumbprint/serial and (1) alert on ANY certificate not chaining to internal PKI, (2) alert on additions
      outside an approved maintenance window, and (3) match the thumbprint against a known-bad TI feed.
      Legitimate AD FS auto-rollover occurs ~yearly, so any unscheduled signing-certificate addition is
      h

      | eval suspicious = rule_match

      | where suspicious == true

      | table _time, account, src_host, object_changed, cert_thumbprint, issuer_uri, claim_rule

      | alert'
- question: '[Defense Impairment] Certificate property and add-frequency scoring: Can you determine whether
