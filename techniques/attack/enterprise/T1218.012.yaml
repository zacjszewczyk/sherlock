questions:
- question: '[Stealth] Match verclsid CLSIDs and scriptlet URLs to intel: Can you determine whether the
    command line for a verclsid.exe process execution contains a Class ID (CLSID) that matches a known-malicious
    value from threat intelligence. Use process creation telemetry for command-line, parent-process, and
    user context. -- specifically, using the ''Match verclsid CLSIDs and scriptlet URLs to intel'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses the signed, native
    verclsid.exe verification host to proxy execution of COM objects and remote COM scriptlets, blending
    malicious activity into trusted Windows tooling to evade application control and detection. This evidence
    focuses on the condition that the command line for a verclsid.exe process execution contains a Class
    ID (CLSID) that matches a known-malicious value from threat intelligence. Use process creation telemetry
    for command-line, parent-process, and user context. This Symbolic Logic approach looks for the following
    signal: Parse the `/S /C {CLSID}` argument from verclsid.exe process creation (Sysmon EID 1 / 4688)
    and alert when the CLSID, or the `InprocServer32`/`ScriptletURL`/`.sct` URL it resolves to in the
    registry, matches a known-malicious indicator; also flag CLSIDs whose registered handler is a remote
    URL or user-writable path ([LOLBAS Verclsid](https://lolbas-project.github.io/lolbas/Binaries/Verclsid/),
    [bohops COM registry](https://bohops.com/2018/08/18/abusing-the-com-registry-structure-part-2-loading-techniques-for-evasion-and-persistence/),
    [Mandiant Hunting COM Objects](https://cloud.google.com/blog/topics/threat-intelligence/hunting-com-objects/)).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests verclsid.exe is
    being used to proxy execution of attacker-controlled COM/scriptlet code rather than to legitimately
    verify a shell extension; pivot to the invoking parent process and its command line, the supplied
    CLSID and how it resolves in the registry, the user and host context, any child processes, and any
    outbound connections that follow. A negative result helps rule out this verclsid proxy-execution vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, context-triggered, or carefully crafted living-off-the-land abuse.'
  answer_sources: &id001
  - Windows Event ID 4688
  - 'NAI: All Windows endpoints and servers; Threat intelligence platforms providing CLSID-based indicators
    of compromise.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match verclsid CLSIDs and scriptlet URLs to intel

      source IN [Windows Event ID 4688]

      | WHERE matches_action_criteria("Match verclsid CLSIDs and scriptlet URLs to intel")

      // Parse the `/S /C {CLSID}` argument from verclsid.exe process creation (Sysmon EID 1 / 4688) and
      alert when the CLSID, or

      | ALERT enrich(host, user, process, parent, clsid, registry, dest)'
