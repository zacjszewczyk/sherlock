name: 'T1218.012: System Binary Proxy Execution: Verclsid'
id: c2f4f09f-4ab1-48ca-b013-64c352fa149c
description: 'This playbook helps an analyst investigate whether an adversary is abusing the Extension
  CLSID Verification Host (verclsid.exe) to proxy execution of malicious code and evade application control
  as part of the Stealth tactic. verclsid.exe is a signed, native Windows binary normally spawned by explorer.exe
  (and occasionally svchost.exe) to verify shell extensions before use; adversaries abuse it via `verclsid.exe
  /S /C {CLSID}` to load and execute COM objects, including remote COM scriptlets (.sct/.hta) referenced
  through the registry, in a manner similar to Regsvr32. Because the binary is trusted, this living-off-the-land
  technique can bypass allow-listing solutions that do not account for its misuse. The playbook guides
  the hunt across several behavioral angles: matching invoked CLSIDs and their resolved InprocServer32/ScriptletURL
  handlers to malicious threat intelligence and flagging remote or user-writable handlers; baselining
  and scoring rare CLSIDs and rare parent->verclsid process relationships; detecting verclsid spawned
  by anomalous parents (Office apps, scripting engines, command shells) outside its tight allow-list;
  scanning parent command lines for obfuscation and download/execution constructs (.DownloadString, IEX,
  FromBase64String, -enc, .sct/.ps1/.hta URLs); alerting on any outbound network connection from verclsid
  (which never legitimately talks to the network) and profiling rare destinations, young domains, byte
  ratios, and connection-failure states; alerting on any child process verclsid spawns (it should never
  have children); and detecting CLSIDs that are missing, HKCU-shadowed, or first-seen in the host registry.
  Detection methods combine symbolic-logic rules, statistical baselining/forecasting, and machine-learning
  models (Random Forest, Isolation Forest, command-line SLMs, graph and time-series anomaly detection)
  applied to Windows Security 4688, Sysmon (EID 1, 3, 7, 12/13/14, 22) and Zeek conn/dns telemetry, so
  the analyst can corroborate suspected verclsid proxy execution against process lineage, CLSID/registry
  resolution, command-line content, and network context.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
