name: 'T1564.008: Hide Artifacts: Email Hiding Rules'
id: b06a5a49-8801-4cd8-a358-d13a2e16031b
description: Investigate whether an adversary is abusing email rules to conceal inbound or outbound messages
  in a compromised mailbox or organization-wide, in order to evade detection, hide C2 traffic, suppress
  security alerts, or support business-email-compromise and internal spearphishing. This playbook helps
  an analyst hunt for malicious inbox rules (New-InboxRule / Set-InboxRule), Exchange transport / mail-flow
  rules (New-TransportRule / Set-TransportRule), MAPI-hidden or blank-named rules, and local client filter
  changes (Windows .pst/.ost/.rwz Outlook rules, macOS Mail.app plists, and Linux sieve/Thunderbird/Evolution
  filters). It combines deterministic symbolic-logic detections (delete/move/forward actions paired with
  security or business keywords, low-visibility destination folders, anomalous actor/client context, and
  failed-logon precursors), statistical baselining (keyword IDF/Jaccard scoring, user and peer Z-scores,
  folder-name entropy, recipient-profile and egress-volume deviation), and machine-learning approaches
  (rule-creation classifiers, isolation forests, time-series and LSTM sequence anomaly detection) to surface
  concealment behavior and correlate it with subsequent anomalous network egress and mail activity.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Were any inbox rules created or modified (New-InboxRule, Set-InboxRule, or UpdateInboxRules)
    whose action deletes the message, moves it to a low-visibility folder (Deleted Items, Junk E-mail,
    RSS Feeds, Archive, Conversation History), or forwards/redirects it, AND whose conditions match security-related
    keywords or known-malicious senders/domains?
  context: 'This is the deterministic floor for message-concealment rules and the canonical malicious
    pattern: a delete/move/forward action combined with a condition that filters on security terms (phish,
    phishing, malware, suspicious, hack, incident, breach, spam, security, helpdesk) or a high-confidence
    threat-intel indicator. Adversaries use such rules to make security alerts, C2 replies, or internal
    spearphishing responses vanish before a user or defender ever sees them, directly supporting the Stealth
    goal of blending in while suppressing observable signals. Query EID 4104 PowerShell script blocks
    and the O365 unified audit with ResultStatus=Success. A positive match (action + keyword) is high-fidelity
    and warrants immediate mailbox review; absence does not rule out hidden rules created via other paths.'
  answer_sources:
  - Windows Event ID 4104
  - m365:unified (New-InboxRule/Set-InboxRule/UpdateInboxRules)
  - 'NAI: Mail Servers, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (WinEventLog:PowerShell EID=4104, m365:unified)

      | where Operation IN ("New-InboxRule","Set-InboxRule","UpdateInboxRules") AND ResultStatus="Success"

      | where action_DeleteMessage=true OR MoveToFolder IN ("Deleted Items","Junk E-mail","RSS Feeds","Archive","Conversation
      History") OR ForwardTo!=null OR RedirectTo!=null

      | where regex_match(SubjectContainsWords|BodyContainsWords|From, "(?i)phish|malware|suspicious|hack|incident|breach|spam|security|helpdesk")
      OR From IN threat_intel_senders

      | emit alert'
- question: Do any mailboxes contain functional inbox rules with a blank or missing rule name / provider
    string that are invisible to Outlook, OWA, and Get-InboxRule but visible only in raw MAPI properties?
  context: 'MAPI-hidden rules (blank PR_RULE_MSG_NAME / PR_RULE_MSG_PROVIDER) are a forensic-only indicator
    of deliberate concealment: an adversary creates a working rule that does not appear in any normal
    management interface, defeating routine review. Enumerate raw rule properties tenant-wide with Get-AllTenantRulesAndForms
    or MFCMAPI and flag any functional rule with an empty/missing name or provider. Before relying on
    this, confirm mailbox auditing captures rule create/modify and Hard/SoftDelete operations. A hidden
    rule is rarely benign and strongly indicates a stealthy actor maintaining covert mailbox manipulation.'
  answer_sources:
  - Windows Event ID 4104
  - m365:unified (New-InboxRule/Set-InboxRule/UpdateInboxRules)
  - 'NAI: Mail Servers, User Endpoints'
  range: Last 90 days
  queries:
  - technology: PowerShell/pseudocode
    query: 'Get-AllTenantRulesAndForms

      | where RuleIsFunctional=true

      | where (PR_RULE_MSG_NAME == "" OR PR_RULE_MSG_NAME == null OR PR_RULE_MSG_PROVIDER == "" OR PR_RULE_MSG_PROVIDER
      == null)

      | emit alert("hidden/blank-name inbox rule")'
- question: When ranked by keyword similarity to a curated security lexicon, which newly created inbox
    rules score above the 95th percentile of all rule creations over the trailing 90 days?
  context: Static keyword lists miss novel or paraphrased terms; a statistical similarity approach catches
    rare, specific concealment vocabulary. For each new rule, build the word set from its condition parameters
    and compute Jaccard similarity plus summed inverse-document-frequency (IDF) against a curated security-keyword
    lexicon, then flag rules whose similarity or cumulative IDF exceeds the 95th percentile. This non-parametric
    ranking surfaces rules using unusually targeted terms even when they evade an exact keyword match,
    supporting Stealth detection by highlighting the rare-term outliers rather than the common case.
  answer_sources:
  - Windows Event ID 4104
  - m365:unified (New-InboxRule/Set-InboxRule/UpdateInboxRules)
  - 'NAI: Mail Servers, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each new_rule in rule_creations(last_90d):\n  words = tokenize(rule.conditions)\n  jac\
      \ = jaccard(words, security_lexicon)\n  idf_sum = sum(idf(w) for w in words intersect security_lexicon)\n\
      \  score = max(scaled(jac), scaled(idf_sum))\n| flag where score > percentile(all_scores, 95)"
- question: Does a trained rule-creation classifier assign a high malicious probability to any new inbox
    rule based on its conditions, action type, destination-folder visibility, name length, IOC presence,
    and creation hour?
  context: A supervised classifier fuses many weak signals into one explainable score. Train a logistic-regression
    or naive-Bayes model on labeled rule-creation events using features such as bag-of-words of conditions,
    action type (DeleteMessage/MoveToFolder/Forward/MarkAsRead), a destination-folder-visibility flag,
    rule-name length, IOC-present flag, and creation hour. Emit a probability and surface the top-3 contributing
    features (e.g., 'DeleteMessage action', 'keyword phishing', 'blank rule name') so the analyst can
    quickly triage. This catches concealment rules that individually look borderline but collectively
    resemble known-malicious patterns, advancing detection of stealthy mailbox manipulation.
  answer_sources:
  - Windows Event ID 4104
  - m365:unified (New-InboxRule/Set-InboxRule/UpdateInboxRules)
  - 'NAI: Mail Servers, User Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [bow(conditions), action_type, dest_folder_visibility, name_len, ioc_present, creation_hour]\n\
      p = classifier.predict_proba(features)   # logistic regression / naive Bayes\nif p > threshold:\n\
      \   emit alert with top3_feature_contributions(features)"
- question: Was an inbox rule created or modified by an account, host, or client that is anomalous for
    Exchange management — for example a non-allow-listed service or admin account, or an unusual ClientIP/UserAgent
    such as a Ruler-style EWS/MAPI client string?
  context: Rather than profiling the rule text, this profiles the actor. Join EID 4688 (Process Creation)
    with EID 4104 on Process ID and alert when the command line contains New-InboxRule/Set-InboxRule AND
    the executing account is a service or admin account not allow-listed for Exchange management, or when
    the O365 rule event's ClientIP/UserAgent is not on the user's known list (Ruler and similar offensive
    tooling produce distinctive EWS/MAPI client strings). A match suggests the rule was planted via stolen
    credentials or tooling rather than the legitimate owner, a hallmark of stealthy access. This is tactic-relevant
    because the adversary is trying to appear normal while operating from an abnormal context.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - m365:unified
  - Azure AD SigninLogs
  - 'NAI: Domain Controllers, Mail Servers, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join (EID=4688) and (EID=4104) on ProcessId

      | where CommandLine matches "New-InboxRule|Set-InboxRule"

      | where Account NOT IN exchange_admin_allowlist OR ClientIP NOT IN user_known_ips[user] OR UserAgent
      matches "(?i)ruler|ews|mapi-anomalous"

      | emit alert'
- question: Was any inbox-rule creation preceded within 60 minutes by an authentication anomaly for the
    same principal — five or more failed logons, an impossible-travel or infrequent-country success, or
    a Tor/anonymous-IP sign-in?
  context: A failed-logon or sign-in anomaly immediately before rule creation is a distinct precursor
    signal that the mailbox was just compromised. Alert when a rule-creation event for a principal is
    preceded within 60 minutes by N>=5 failed logons (EID 4625 / Azure AD failures), an impossible-travel
    or infrequent-country success, or an anonymous/Tor sign-in. This temporal correlation strongly indicates
    an attacker establishing concealment immediately after gaining access — a common kill-chain step where
    the first action after login is to create a hiding rule. A positive result should trigger session
    revocation and rule review.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - m365:unified
  - Azure AD SigninLogs
  - 'NAI: Domain Controllers, Mail Servers, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rule_events = events(Operation IN (\"New-InboxRule\",\"Set-InboxRule\"))\nfor r in rule_events:\n\
      \  signin = signins[user=r.user, time in (r.time-60m, r.time)]\n  if count(signin.failed) >= 5 OR\
      \ signin.impossible_travel OR signin.country rare OR signin.ip in tor_anon_list:\n     emit alert(\"\
      failed-logon precursor to rule creation\")"
- question: Does an inbox-rule creation event deviate from the user's and peer group's baseline for hour-of-day,
    source host/IP, client, and rate, producing a combined multi-dimensional Z-score above 3?
  context: Per-user and peer-group baselining detects rule changes that are abnormal for that specific
    identity even if no single attribute is overtly malicious. Baseline each user's typical rule-creation
    hour-of-day, source host/IP, client type, and rate (count/min), then compute a multi-dimensional Z-score
    (time-of-day deviation, non-standard host flag, peer-group divergence) and flag when the combined
    score exceeds 3. This UEBA approach surfaces stealthy activity such as a user suddenly creating rules
    at 3am from a new host, which would otherwise blend into normal volume. It complements deterministic
    keyword detection by catching actor-behavior anomalies.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - m365:unified
  - Azure AD SigninLogs
  - 'NAI: Domain Controllers, Mail Servers, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline[user] = profile(hour, src_host, client, rate) over 90d\nfor e in rule_events:\n \
      \ z_time = zscore(e.hour, baseline[user].hour)\n  z_host = 1 if e.src_host not in baseline[user].hosts\
      \ else 0\n  z_peer = peer_divergence(e, peergroup[user])\n  score = combine(z_time, z_host, z_peer)\n\
      | flag where score > 3"
- question: Does an Isolation Forest trained on rule-creation features flag any event as an outlier, and
    which features (user role, hour, day-of-week, source-host role, client type, preceding failed-logon
    count) drive the anomaly?
  context: An unsupervised Isolation Forest provides a low-latency, low-overhead baseline that needs no
    labeled malicious data. Featurize rule-creation events with user role, sin/cos-transformed hour, day-of-week,
    one-hot source-host role, client type, and preceding failed-logon count; score outliers and surface
    the top-3 deviating features in the alert. This catches novel concealment behavior that doesn't match
    prior signatures, supporting Stealth detection by isolating the rare combinations of context that
    accompany attacker-planted rules. Analysts use the contributing features to decide whether the anomaly
    reflects benign administration or a compromise.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - m365:unified
  - Azure AD SigninLogs
  - 'NAI: Domain Controllers, Mail Servers, User Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = featurize(rule_events, [user_role, sin_hour, cos_hour, dow, onehot(src_host_role), client_type,
      prior_failed_logons])

      model = IsolationForest().fit(X_baseline)

      scores = model.decision_function(X)

      | flag outliers; emit top3_feature_contributions'
- question: Were any Exchange transport / mail-flow rules created or modified (New-TransportRule, Set-TransportRule)
    that match security keywords in subject or body AND delete, blind-copy, or redirect messages to an
    external domain — affecting every recipient in the organization?
  context: Transport (mail-flow) rules operate org-wide rather than on a single mailbox, so a malicious
    one can silently delete or exfiltrate all mail about a given topic (e.g., security incident notifications)
    for the whole tenant. Monitor EID 4104 and the unified audit for New-TransportRule/Set-TransportRule
    and alert when -SubjectOrBodyContainsWords includes security terms (phishing, incident, suspicious,
    breach, alert, quarantine, report) AND the action is DeleteMessage, BlindCopyTo, or RedirectMessageTo
    an external domain. This is a high-impact Stealth/defense-evasion event because it suppresses or siphons
    organization-wide communications; any positive match is critical and warrants immediate response.
  answer_sources:
  - Windows Event ID 4104
  - m365:unified (New-TransportRule/Set-TransportRule)
  - 'NAI: Mail Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (WinEventLog:PowerShell EID=4104, m365:unified)

      | where Operation IN ("New-TransportRule","Set-TransportRule")

      | where regex_match(SubjectOrBodyContainsWords, "(?i)phishing|incident|suspicious|breach|alert|quarantine|report")

      | where Action IN ("DeleteMessage","BlindCopyTo","RedirectMessageTo") AND target_domain is_external

      | emit alert'
- question: Which new transport rules use unusually rare/specific keyword terms (cumulative IDF above
    the 99th percentile), and are there day-over-day bursts in the count of transport-rule changes?
  context: Transport-rule changes are infrequent and high-privilege, so both rare vocabulary and change
    bursts are meaningful. Maintain the enterprise document-frequency distribution of words used in transport-rule
    conditions; for each new rule sum the IDF of its keywords and flag when the cumulative IDF exceeds
    the 99th percentile (unusually rare/specific terms). Also track the daily count of transport-rule
    changes and flag bursts. This non-parametric rare-term ranking surfaces targeted concealment rules
    that ordinary keyword lists miss, and the burst signal catches mass rule manipulation during an active
    intrusion.
  answer_sources:
  - Windows Event ID 4104
  - m365:unified (New-TransportRule/Set-TransportRule)
  - 'NAI: Mail Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "df = enterprise_word_doc_freq(transport_rule_conditions)\nfor r in new_transport_rules:\n\
      \  idf_sum = sum(idf(w, df) for w in tokenize(r.conditions))\n| flag where idf_sum > percentile(all_idf_sums,\
      \ 99)\ndaily = count(transport_rule_changes) by day\n| flag where daily > mean + 3*sd"
- question: Does a naive-Bayes classifier trained on labeled transport rules score any new transport rule
    as likely malicious, and which tokens or action types contribute most?
  context: A supervised classifier generalizes beyond fixed keyword lists by learning which condition
    vocabulary and action types correlate with malicious transport rules. Train a naive-Bayes model on
    labeled transport rules using condition bag-of-words and action type, score new rules, and surface
    the top contributing tokens/action in the alert for explainability. Because transport rules are org-wide,
    even a moderate-probability hit deserves attention; the explained features let the analyst quickly
    judge whether the rule is a legitimate mail-flow policy or a stealthy suppression/exfiltration mechanism.
  answer_sources:
  - Windows Event ID 4104
  - m365:unified (New-TransportRule/Set-TransportRule)
  - 'NAI: Mail Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [bow(conditions), action_type]\np = naive_bayes.predict_proba(features)\nif p >\
      \ threshold:\n   emit alert with top_contributing_tokens_and_action(features)"
- question: Were inbox rules created whose conditions contain phishing/business keywords (invoice, payment,
    password reset, wire, bank) AND whose action deletes the message or moves it to a low-visibility folder
    (RSS Feeds, Junk E-mail, Notes, Deleted Items, Conversation History, Archive)?
  context: Beyond security-team keywords, BEC and fraud actors hide messages about money and credentials
    so the victim never sees replies or alerts. Search rule-creation events and flag when -BodyContainsWords/-SubjectContainsWords
    includes high-risk business terms (invoice, payment, password reset, wire, bank) AND the action is
    -DeleteMessage $true or -MoveToFolder to a low-visibility folder. This action+condition combination
    is the documented concealment pattern for business-email-compromise; a match indicates the mailbox
    owner is being actively defrauded or impersonated, supporting both Stealth and impact investigations.
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: User Endpoints, Mail Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (EID=4104, m365:unified) | where Operation matches "InboxRule"

      | where regex_match(BodyContainsWords|SubjectContainsWords, "(?i)invoice|payment|password reset|wire|bank")

      | where action_DeleteMessage=true OR MoveToFolder IN ("RSS Feeds","Junk E-mail","Notes","Deleted
      Items","Conversation History","Archive")

      | emit alert'
- question: Among rules using -MoveToFolder, which destination folder names have unusually high Shannon
    entropy (top 5%) or are single-character/whitespace names, and is the fleet-wide daily count of new
    delete/move rules above mean + 3 SD?
  context: Attackers sometimes route hidden mail into randomized or obfuscated folder names to avoid casual
    discovery, and mass rule injection produces fleet-wide spikes. For rules using -MoveToFolder, compute
    the Shannon entropy of the destination folder name and flag names in the top 5% of observed entropy
    (randomized/obfuscated) or single-character/whitespace names. Combine with the daily fleet-wide count
    of new delete/move rules, flagged when it exceeds mean + 3 SD. High-entropy folder names and burst
    creation together indicate scripted, stealthy concealment rather than organic user housekeeping.
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: User Endpoints, Mail Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for r in rules where action==MoveToFolder:\n  H = shannon_entropy(r.dest_folder_name)\n| flag\
      \ where H > percentile(all_H, 95) OR len(dest_folder_name)<=1 OR is_whitespace(dest_folder_name)\n\
      daily = count(new delete/move rules) by day | flag where daily > mean + 3*sd"
- question: Does the enterprise daily count of inbox rules created with the DeleteMessage action show
    spikes outside the forecast confidence interval of a Seasonal-ARIMA or autoencoder model?
  context: Time-series anomaly detection catches coordinated or campaign-driven concealment that single-event
    rules miss. Apply Seasonal-ARIMA (or an autoencoder over daily counts) to the enterprise daily count
    of rules created with the DeleteMessage action and trigger investigation on spikes outside the forecast
    confidence interval. Reconstruction error from an autoencoder is an effective unsupervised novelty
    signal. A spike implies many mailboxes suddenly gaining delete rules — consistent with a tenant-wide
    compromise or automated injection — and provides early warning even before individual rules are triaged.
  answer_sources:
  - Windows Event ID 4104
  - m365:unified
  - 'NAI: User Endpoints, Mail Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'series = daily_count(rules where action==DeleteMessage)

      model = SARIMA(series)  # or autoencoder over daily counts

      forecast, ci = model.predict()

      | flag day where observed outside ci  # or reconstruction_error > threshold'
- question: After an inbox-rule creation, does the same source IP/principal resolve a domain unseen in
    the last 30 days and then transfer more than 10MB to it, or send mail to an anomalous recipient set,
    within the following 60 minutes?
  context: A mailbox that gains a hiding rule is often the same one being used for exfiltration or C2,
    so correlating rule creation with subsequent egress reveals the full attack sequence. For each rule-creation
    event, correlate by source IP/principal with the next 60 minutes of telemetry; alert if the host resolves
    a domain unseen in 30 days (Zeek dns.log) and then transfers >10MB (sum orig_bytes in Zeek conn.log)
    to the resolved IP, or if the mailbox sends to a recipient set deviating from history. Also profile
    failure signals — spikes in NXDOMAIN or blocked-connection counts can indicate beaconing/C2. This
    ties the Stealth concealment act to concrete data-movement evidence.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4104
  - m365:unified
  - Azure AD SigninLogs
  - 'NAI: Network Egress Points, User Endpoints, DNS Servers, Mail Servers'
  range: Last 90 days; pivot to a 60-minute window after each rule-creation event
  queries:
  - technology: SIEM/Zeek correlation pseudocode
    query: "for rc in rule_creations:\n  w = window(rc.time, +60m); host = rc.src_ip\n  new_dom = dns.log[host,\
      \ w] where domain not seen in 30d\n  egress = sum(conn.log.orig_bytes[host->resolved_ip, w])\n \
      \ if new_dom AND egress > 10MB: emit alert\n  if mailbox_send recipients[w] deviate from history:\
      \ emit alert\n  if count(dns.rcode==NXDOMAIN) or blocked_conns spike: emit alert(\"beaconing\")"
- question: After a rule-creation event, does the mailbox's outbound recipient set show low historical
    overlap, a first-seen destination country, or egress volume more than 3 SD above the user's daily
    average?
  context: Recipient-profile and volume baselining detects exfiltration and lateral phishing that follow
    concealment. Maintain per-user baselines of outbound mail recipients and 30-day egress volume per
    destination country; after a rule-creation event flag a recipient set with low historical overlap,
    a first-seen destination country, or volume >3 SD above the user's daily average. Recipient-profile
    anomaly is a primary lateral-phishing feature, and geo/volume baselining catches data theft. A positive
    result after a hiding rule strongly suggests the account is being used to send to new external parties
    while replies are suppressed — a classic BEC/exfiltration pattern.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4104
  - m365:unified
  - Azure AD SigninLogs
  - 'NAI: Network Egress Points, User Endpoints, DNS Servers, Mail Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline[user] = {recipients, egress_volume_by_country} over 30d\nfor e in post_rule_events[user]:\n\
      \  overlap = jaccard(e.recipients, baseline[user].recipients)\n  if overlap < low_thresh OR e.dest_country\
      \ not in baseline[user] OR e.volume > mean + 3*sd:\n     emit alert"
- question: Does an LSTM autoencoder over per-user event sequences flag a high-reconstruction-error path
    such as rule-creation -> rare-domain DNS -> large egress, and does a random-forest over mail features
    corroborate suspicious outbound messages?
  context: Sequence-based modeling captures the order and combination of events that define an attack
    chain, not just isolated anomalies. Train an LSTM autoencoder on normal per-user event sequences (sign-in,
    rule change, send, process, network), feed the post-rule-creation sequence, and flag high reconstruction
    error — e.g., rule-creation followed by rare-domain DNS and large egress. Pair it with a random-forest
    over mail features (recipient unlikelihood, URL reputation, stylometry) and surface the top contributing
    features. This fused approach detects stealthy multi-step intrusions where each step alone looks benign
    but the sequence is anomalous, directly addressing the Stealth tactic's blend-in behavior.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4104
  - m365:unified
  - Azure AD SigninLogs
  - 'NAI: Network Egress Points, User Endpoints, DNS Servers, Mail Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = per_user_event_sequence(post_rule_creation)\nerr = lstm_autoencoder.reconstruction_error(seq)\n\
      mail_score = random_forest.predict([recipient_unlikelihood, url_reputation, stylometry])\nif err\
      \ > threshold OR mail_score > threshold:\n   emit alert with top_feature_contributions"
- question: Were email rule definition files modified outside the cloud control plane — Windows Outlook
    rule files (.pst/.ost/.rwz), macOS Mail.app plists (RulesActiveState/SyncedRules/MessageRules), or
    Linux sieve/Thunderbird/Evolution filters — by a process that is not an approved mail client or backup
    utility?
  context: Adversaries can plant hiding rules locally to avoid cloud audit logs entirely. Monitor EID
    4663 writes to .pst/.ost/.rwz, macOS Mail rule plists, and Linux sieve/filter files; correlate the
    Process ID with EID 4688 / auditd execve and alert when the writing process is not on an allow list
    of mail clients/backup utilities (outlook.exe, scanpst.exe, Mail.app, dovecot/managesieve). Inspect
    added sieve actions (fileinto/discard) and plist rule entries for security-keyword conditions. A non-mail-client
    process writing rule files is a strong indicator of out-of-band, stealthy rule injection that would
    never surface in Exchange/O365 logs.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - macos:unifiedlog
  - auditd:SYSCALL
  - ApplicationLog:MailServer
  - 'NAI: User Endpoints, File Servers, Mail Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'writes = EID=4663 where ObjectName matches "\.pst$|\.ost$|\.rwz$|RulesActiveState\.plist|SyncedRules\.plist|MessageRules\.plist|/sieve/|\.msf"

      | join EID=4688 / auditd execve on ProcessId

      | where Image NOT IN (outlook.exe, scanpst.exe, Mail.app, dovecot, managesieve)

      | enrich: inspect sieve fileinto/discard or plist rule for security keywords

      | emit alert'
- question: Which processes (and parent processes) writing mail-rule files on a host are rare — seen in
    fewer than 1% of historical cases — and are there bursts in the per-host count/min of such writes?
  context: Process-rarity scoring catches novel or injected writers that an allow list might not enumerate.
    Per host, baseline the processes (and parent processes) that legitimately write mail-rule files, compute
    a rarity score, and flag writers/parents seen in <1% of historical cases. Also track the count/min
    of such writes per host to catch automated rule injection. A rarely-seen process suddenly editing
