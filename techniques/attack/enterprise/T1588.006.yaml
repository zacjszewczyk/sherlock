name: 'T1588.006: Vulnerabilities'
id: de67191d-2012-44bd-866d-040184dc634c
description: 'Investigate whether an internal host or user is acquiring information about software and
  hardware vulnerabilities to support adversary targeting (MITRE ATT&CK T1588.006, Resource Development).
  This playbook helps an analyst hunt for hosts that browse vulnerability databases, vendor advisories,
  public disclosure sites, and exploit write-ups; that repeatedly search for CVE identifiers, product
  names, and patch/exploitability analysis and then save advisories or attachments locally; that automatically
  refresh vulnerability feeds (RSS/XML) and fan out to many related CVE references in a short window;
  that access closed or authenticated vulnerability portals and mailing-list archives to download disclosure
  attachments and exploit notes; and that perform repeated search/browse/save/revisit cycles around vulnerability
  topics. Most of this activity occurs outside the target''s visibility, so detection focuses on the network
  and host evidence that is observable internally: Zeek dns/http/files/conn logs and Windows process and
  script telemetry (Event IDs 4688 and 4104). It combines deterministic symbolic-logic correlation, statistical
  baselining (modified Z-score, IQR, peer-group UEBA, passive-DNS rare-destination scoring), and explainable
  machine-learning URL/sequence models to separate routine web use from vulnerability-intelligence collection.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is a non-research internal host accessing multiple distinct vulnerability-intelligence destinations
    (vendor advisories, CVE portals, exploit write-up sites) in a short window?
  context: Adversaries and insiders preparing to target an organization often consult vulnerability databases
    and advisory sites to learn which weaknesses exist and how to exploit them. Using Zeek http.log and
    dns.log, match the host/uri/referrer against a curated, allowlist-aware list of vulnerability destinations
    seeded from NVD reference URLs and the CVE-ID regex CVE-\d{4}-\d{4,7}. Alert when a host that is not
    a sanctioned security-research system reaches three or more distinct such domains inside a 10-minute
    window (tune N to your environment). This deterministic floor is intentionally simple and explainable
    so it can run as a vendor-neutral Sigma rule; a positive result means a host is rapidly gathering
    vulnerability references, which is unusual for ordinary business use and warrants pivoting to what
    was downloaded and which CVEs were referenced. This supports the Resource Development investigative
    goal of determining whether the adversary is acquiring vulnerability information to support targeting.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: User workstations, security-research labs, web proxies, and DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from zeek.http, zeek.dns

      let vuln_dst = lookup(''vuln_intel_domains'')  // NVD refs, CVE portals, exploit writeups; allowlist
      research hosts

      filter (host in vuln_dst) or (uri matches /CVE-\d{4}-\d{4,7}/) or (referrer matches /CVE-\d{4}-\d{4,7}/)

      where src_ip not in research_host_allowlist

      bucket 10m by src_ip

      having count(distinct host) >= 3

      emit alert(src_ip, distinct_domains, cve_refs)'
- question: Is a host retrieving CVE or advisory pages using scripted or non-browser tooling rather than
    an interactive browser?
  context: Automated collection of vulnerability intelligence often uses curl, wget, or PowerShell Invoke-WebRequest
    rather than a human-driven browser. Join JA4+/JA4H HTTP header-order fingerprints and non-browser
    User-Agent strings with process lineage from Windows Event ID 4688 (process creation) and 4104 (PowerShell
    script block). Alert when a host fetches CVE/advisory pages but there is no corresponding interactive
    browser process. A positive result strongly suggests programmatic harvesting of vulnerability data,
    which is more consistent with automated targeting reconnaissance than casual reading; investigate
    the calling process, command line, and the breadth of CVE references retrieved. This supports the
    Resource Development investigative goal of determining whether the adversary is acquiring vulnerability
    information to support targeting.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: User workstations, security-research labs, web proxies, and DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join zeek.http H with winlog(4688|4104) P on H.src_ip = P.host within 5m\nwhere (H.ja4h in\
      \ scripted_fingerprints or H.user_agent matches /curl|wget|python|powershell|Invoke-WebRequest/)\n\
      \  and (H.uri matches /CVE-\\d{4}-\\d{4,7}/ or H.host in vuln_intel_domains)\n  and not exists(browser_process\
      \ on P.host within 5m)\nemit alert(P.host, P.process, P.cmdline, H.host)"
- question: Does a host's rate of visiting vulnerability databases and advisory sites deviate sharply
    from its own 30-day baseline?
  context: Routine users rarely touch vulnerability databases; security staff touch them regularly. Build
    a per-host 30-day baseline of visits to vulnerability databases and advisory sites and flag rare or
    first-time access using the robust modified Z-score (|Mi| > 3.5) and IQR rules instead of mean/sigma,
    which are skewed by bursty traffic. Escalate when a host queries multiple CVE pages in a short window.
    Calibrate thresholds on CERT Insider Threat HTTP logs. A positive result identifies a host that suddenly
    began consuming vulnerability intelligence it never accessed before, a meaningful signal of targeting
    preparation; a negative result means the access is within normal historical behavior. This supports
    the Resource Development investigative goal of determining whether the adversary is acquiring vulnerability
    information to support targeting.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: User workstations, security-research labs, web proxies, and DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per src_ip over 30d: daily_count(visits to vuln_intel_domains)

      compute median, MAD -> modified_z = 0.6745*(x - median)/MAD

      also compute IQR fences

      flag if modified_z > 3.5 or x > Q3+1.5*IQR or first_time_seen(src_ip)

      escalate if cve_pages_in_10m >= N

      emit alert(src_ip, x, modified_z)'
- question: Does a host's vulnerability-resource access and rare-destination behavior exceed that of its
    peer group?
  context: Individual baselining misses hosts that are quietly abnormal relative to their role. Apply
    peer-group baselining (Microsoft Sentinel UEBA style) and Directed Anomaly Scoring (Ho et al.) so
    that a host is judged against its cohort of similar systems rather than itself. Surface hosts whose
    vulnerability-resource access and rare-destination contact exceed all benign peers, while bounding
    output to roughly ten explainable alerts per day. Profile failure modes such as 4xx/403 and NXDOMAIN
    rates on newly published CVE pages as distinct signals, since aggressive scraping of fresh CVEs produces
    characteristic error patterns. A positive result is a host behaving unlike every comparable peer,
    which is a high-value lead for targeting reconnaissance. This supports the Resource Development investigative
    goal of determining whether the adversary is acquiring vulnerability information to support targeting.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: User workstations, security-research labs, web proxies, and DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'define peer_group by role/subnet/dept

      features per host: vuln_domain_visits, distinct_cve_refs, rare_dst_count, err4xx_rate, nxdomain_rate

      score = directed_anomaly_score(host_features vs peer_group)

      rank desc, cap to ~10 alerts/day

      emit alert(host, score, top_features)'
- question: Do a host's browsing and DNS sequences match a vulnerability-research workflow rather than
    normal web use?
  context: 'Vulnerability-intelligence gathering has a recognizable shape: many CVE-bearing URLs, advisory
    tokens, off-hours activity, and rare external domains visited in sequence. Score destination URLs
    with URLNet and the explainable transformer scorer of Li et al., model per-host browsing/DNS sequences
    with DeepLog, and co-score rare external domains with EXPOSURE passive-DNS features. Alert on high-probability
    sessions and surface the top-3 contributing features (e.g., distinct CVE refs, URL tokens, off-hours
    ratio) in the alert text so analysts can validate. A positive result flags a session that statistically
    resembles vulnerability research; the explainable features let the analyst confirm intent versus benign
    professional reading. This supports the Resource Development investigative goal of determining whether
    the adversary is acquiring vulnerability information to support targeting.'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: User workstations, security-research labs, web proxies, and DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'url_score = URLNet(uri) ; text_score = transformer_scorer(page_tokens)

      seq_score = DeepLog(per_host event sequence of dns/http)

      dst_rarity = EXPOSURE(passive_dns_features(domain))

      session_prob = ensemble(url_score, text_score, seq_score, dst_rarity)

      if session_prob > threshold: emit alert(host, session_prob, top3_features)'
- question: Is a host searching for CVE identifiers, product names, or patch/exploitability terms and
    then downloading the related advisory or attachment in the same session?
  context: 'A strong indicator of vulnerability targeting is the search-then-download pattern: a host
    requests pages containing CVE-ID patterns (CVE-\d{4}-\d{4,7}), vendor/product names, or patch/exploitability
    terms drawn from NVD references, and then downloads advisories or attachments (visible in Zeek files.log)
    from those same pages. Encode this as Sigma rules with a concrete floor of search plus download within
    one session. A positive result means a host did not just read about a vulnerability but pulled the
    underlying material locally, which is consistent with preparing to exploit it; pivot to the saved
    files, the CVEs involved, and the host''s role. This supports the Resource Development investigative
    goal of determining whether the adversary is acquiring vulnerability information to support targeting.'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Web proxies, DNS resolvers, and analyst or user workstations.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "join zeek.http S with zeek.files F on S.src_ip=F.src_ip within 1 session\nwhere (S.uri matches\
      \ /CVE-\\d{4}-\\d{4,7}/ or S.uri contains vendor_product_terms or patch_terms)\n  and F.mime in\
      \ {pdf,zip,txt,xml} and F.fuid present\nemit alert(S.src_ip, cve_refs, F.filename, F.bytes)"
- question: Has a host's volume or frequency of CVE-related searches and advisory visits spiked beyond
    its historical baseline, especially after a new disclosure?
  context: 'Baseline CVE-related searches and advisory page visits per host/user and alert when counts
    exceed the 95th percentile or the modified Z-score (|Mi| > 3.5), or show a sudden spike after a new
    disclosure. Track three dimensions separately: volume (download bytes), frequency (requests/min),
    and state by baselining 404/403 and NXDOMAIN rates that spike when a host scrapes freshly published
    CVEs. A positive result identifies anomalous interest in vulnerabilities, and the spike-after-disclosure
    pattern is especially telling because it aligns adversary collection with the public-disclosure window
    when patches may not yet be deployed. This supports the Resource Development investigative goal of
    determining whether the adversary is acquiring vulnerability information to support targeting.'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Web proxies, DNS resolvers, and analyst or user workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per host/user over 30d: cve_searches, advisory_visits, dl_bytes, req_per_min, err_rate,
      nxdomain_rate

      flag if x > p95 or modified_z(x) > 3.5

      flag spike if cve_searches today >> baseline shortly after new_disclosure_event

      emit alert(host, metric, value, baseline)'
- question: Do a host's CVE-search and rare-destination behaviors exceed those of all benign peers in
    its cohort?
  context: Use Sentinel UEBA peer grouping and Directed Anomaly Scoring (Ho et al.) to rank hosts whose
    CVE-search and rare-destination behavior exceed all benign peers, while bounding alert volume. This
    catches hosts that look normal against their own history but are clear outliers compared with similar
    systems. A positive result is a host that searches for vulnerabilities far more, or reaches far rarer
    destinations, than every comparable peer, a high-confidence indicator of targeting reconnaissance
    that justifies deeper review of the operator and the systems referenced. This supports the Resource
    Development investigative goal of determining whether the adversary is acquiring vulnerability information
    to support targeting.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Web proxies, DNS resolvers, and analyst or user workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'peer_group = cohort(host by role/subnet)

      features: cve_search_count, rare_dst_count

      score = directed_anomaly_score(features vs peer_group)

      keep hosts exceeding peer_max, cap alert volume

      emit alert(host, score, peers_compared)'
- question: Do a host's query strings, destination domains, and session timing classify as vulnerability-search
    behavior rather than routine browsing?
  context: Train an explainable URL/text classifier (URLNet; Li et al.) on query strings, destination
    domains, and session timing to distinguish routine browsing from vulnerability-search behavior, calibrated
    with CERT Insider Threat web logs. Emit the top-3 contributing features with each high-confidence
    match so analysts can validate the verdict. A positive result flags sessions whose linguistic and
    timing signatures match deliberate vulnerability searching; the explainability output (e.g., heavy
    CVE token density, exploit-site domains, off-hours timing) lets the analyst quickly judge whether
    the activity is sanctioned research or covert targeting preparation. This supports the Resource Development
    investigative goal of determining whether the adversary is acquiring vulnerability information to
    support targeting.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Web proxies, DNS resolvers, and analyst or user workstations.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [URLNet(query_strings), domain_embeddings, session_timing]

      model = classifier(features) calibrated on CERT_insider_web_logs

      if p(vuln_search) > threshold: emit alert(host, p, top3_features)'
- question: Is a host automatically refreshing vulnerability feeds or RSS/disclosure pages at a rate that
    indicates an automated collector?
  context: Correlate repeated fetches of advisories, RSS feeds, and disclosure pages in Zeek http.log
    with scripted access (Windows Event ID 4104) or browser launches (Event ID 4688), using JA4+/JA4H
    fingerprints and non-browser User-Agents to identify automated collectors. Alert via Sigma when refresh
    frequency exceeds a fixed rate, e.g., more than 12 feed fetches per hour from one host. A positive
    result distinguishes an automated vulnerability-intelligence collector from a human occasionally reading
    advisories; combined with scripted process evidence, it indicates systematic harvesting that warrants
    identifying the automation and its purpose. This supports the Resource Development investigative goal
    of determining whether the adversary is acquiring vulnerability information to support targeting.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: Analyst workstations, security operations workstations, and automation hosts.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from zeek.http where uri matches /(rss|atom|feed|advisor|disclosure)/ or host in vuln_feed_domains

      join winlog(4104|4688) on host within 5m

      flag if user_agent non_browser or ja4h in scripted_fingerprints

      bucket 1h by src_ip having count >= 12

      emit alert(src_ip, fetch_rate, process)'
- question: Does a host's rate of vulnerability-feed refreshes and disclosure-page visits exceed its own
    baseline or that of its peers?
  context: 'Baseline vulnerability-feed refreshes and disclosure-page visits per host and alert when a
    host exceeds its own modified Z-score (|Mi| > 3.5) / 3-sigma or materially differs from peers via
    Sentinel UEBA. Profile the failure-mode signal (304/404/403 ratios) that distinguishes polite caching
    from aggressive scraping: conditional GETs returning 304 indicate well-behaved feed readers, while
    high 404/403 rates indicate brute scraping of freshly published or restricted CVEs. A positive result
    identifies anomalous feed consumption; the error-ratio profile helps separate legitimate monitoring
    tools from aggressive collection. This supports the Resource Development investigative goal of determining
    whether the adversary is acquiring vulnerability information to support targeting.'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: Analyst workstations, security operations workstations, and automation hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per host: feed_refreshes, disclosure_visits, ratio_304, ratio_404_403

      flag if modified_z(refreshes) > 3.5 or peer_deviation(UEBA) high

      label scraping if ratio_404_403 high and ratio_304 low

      emit alert(host, refreshes, err_profile)'
- question: Is a host contacting newly-seen, low-prevalence advisory or exploit domains during feed-refresh
    activity?
  context: Score newly-seen advisory/exploit domains contacted during feed activity using EXPOSURE passive-DNS
    prevalence and dynamism features over internal DNS logs, prioritizing first-time and low-prevalence
    destinations. Adversary tooling frequently reaches niche or freshly registered vulnerability/exploit
    sites that ordinary users never visit. A positive result surfaces rare destinations that stand out
    from the organization's normal advisory traffic, providing a focused list of domains to investigate
    alongside the host's feed-refresh behavior; a low score implies the domains are common and well-established.
    This supports the Resource Development investigative goal of determining whether the adversary is
    acquiring vulnerability information to support targeting.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: Analyst workstations, security operations workstations, and automation hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each domain contacted during feed_activity:\n  feats = EXPOSURE(prevalence, age, dynamism,\
      \ ttl) from internal passive_dns\n  rarity = score(feats)\nrank domains by rarity desc, prioritize\
      \ first_time and low_prevalence\nemit alert(host, domain, rarity)"
- question: Does a host's feed-refresh cadence and request profile classify as automated vulnerability-intelligence
    collection rather than routine advisory reading?
  context: Use a time-series/sequence model (DeepLog) plus per-host outlier detection (Isolation Forest/LOF)
    on refresh cadence and request features to distinguish routine advisory reading from automated vulnerability-intelligence
    collection. Report the top-3 features (refresh rate, distinct CVE refs, off-hours fraction) for flagged
    hosts so analysts can validate. A positive result flags hosts whose temporal patterns match machine-driven
    collection; the feature output lets analysts confirm whether the cadence reflects a sanctioned monitoring
    tool or covert harvesting tied to targeting. This supports the Resource Development investigative
    goal of determining whether the adversary is acquiring vulnerability information to support targeting.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: Analyst workstations, security operations workstations, and automation hosts.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq_model = DeepLog(per_host feed-fetch sequence)

      features = [refresh_rate, distinct_cve_refs, offhours_fraction, req_size]

      outlier = IsolationForest/LOF(features)

      if seq_anomaly or outlier: emit alert(host, score, top3_features)'
- question: Is a host accessing authenticated vulnerability portals or mailing-list archives and downloading
    advisory attachments outside the normal research workflow?
  context: Correlate access to authenticated vulnerability portals or mailing-list archives in Zeek http.log
    with downloaded advisory attachments in Zeek files.log, matching CVE/advisory MIME and naming patterns
    from NVD references. Alert via Sigma when this pattern occurs on a host that is not part of the normal,
    sanctioned research workflow. Closed portals contain non-public, pre-disclosure vulnerability detail
    that is especially valuable to an adversary. A positive result on an unexpected host indicates someone
    is pulling restricted vulnerability material, which is a high-priority lead; pivot to the account
    used, the attachments retrieved, and whether the host should have portal access at all. This supports
    the Resource Development investigative goal of determining whether the adversary is acquiring vulnerability
    information to support targeting.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Research portals, security analyst workstations, and web proxies.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "join zeek.http H with zeek.files F on src_ip within session\nwhere H.host in authenticated_vuln_portals\
      \ or mailing_list_archives\n  and F.mime in advisory_mimes and F.filename matches /CVE|advisor|disclosure/\n\
      \  and src_ip not in research_workflow_hosts\nemit alert(src_ip, H.host, F.filename)"
- question: Is a user or host accessing authenticated vulnerability portals or downloading attachments
    for the first time, in unusual volume, or above peer norms?
  context: Baseline authenticated vulnerability-portal visits and attachment downloads per user/host and
    alert on first-time access, unusual volume (download bytes), or activity above the 95th percentile
    / modified Z-score |Mi| > 3.5 for the peer group. Separately track failed-auth (401/403) rates as
    a distinct signal, since repeated authentication failures can indicate credential testing or access
    to portals the user is not authorized for. A positive result identifies anomalous authenticated access
    to restricted vulnerability resources; first-time access combined with large downloads is a strong
    indicator of collection for targeting. This supports the Resource Development investigative goal of
    determining whether the adversary is acquiring vulnerability information to support targeting.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Research portals, security analyst workstations, and web proxies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per user/host: portal_visits, attachment_dls, dl_bytes, ratio_401_403

      flag if first_time(user,portal) or dl_bytes > p95 or modified_z > 3.5

      track failed_auth_rate separately

      emit alert(user, host, portal, metric)'
