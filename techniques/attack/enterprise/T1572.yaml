name: 'T1572: Protocol Tunneling'
id: e5b99256-ab38-40e3-9668-a8871a57ead4
description: 'This playbook helps an analyst investigate whether an adversary is using protocol tunneling
  (MITRE ATT&CK T1572) to conceal command-and-control (C2) traffic, evade network filtering, or reach
  otherwise unreachable internal systems by encapsulating one protocol inside another -- for example SSH
  port forwarding (-L/-R/-D), DNS tunneling (iodine, dnscat2), DNS-over-HTTPS, or relay tools such as
  chisel, ngrok, socat, and stunnel. Under the Command and Control tactic, the hunt spans Windows, Linux,
  macOS, and ESXi endpoints plus network sensors. It guides the analyst across several behavioral angles:
  matching outbound destinations, queried domains, and TLS JA3/JA3S fingerprints against threat-intelligence
  feeds of known tunneling C2; detecting process creation of known tunneling tools and legitimate utilities
  (ssh.exe, powershell.exe) carrying tunneling flags, then correlating them to their outbound flows; identifying
  DNS queries with tunneling characteristics (extreme subdomain entropy/length, high TXT/NULL/CNAME-to-A
  ratios, NXDOMAIN surges, and query-rate spikes); profiling network flows for anomalous outbound-to-inbound
  byte ratios, low-jitter periodic C2 heartbeats, protocol/port mismatches (encrypted traffic on cleartext
  ports), and connection-state failure ratios that distinguish tunnel setup from established channels;
  and flagging unexpected network-capable processes or relay/forward signatures on hosts. Detection methods
  combine symbolic-logic rules, statistical baselining/forecasting, and machine-learning models (supervised
  classifiers, clustering, one-class anomaly detection, autoencoders, and time-series forecasting) applied
  to Zeek conn/dns/ssl/ssh logs, Windows Event IDs 4688 and 5156, Sysmon, auditd, and host process telemetry,
  so the analyst can corroborate suspected tunneling against process lineage, command lines, DNS behavior,
  flow volume and timing, and TLS metadata.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
