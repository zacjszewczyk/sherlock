    connection from an internal host to an external IP address or domain that matches an entry on a threat
    intelligence feed of known C2 servers utilizing protocol tunneling. This Statistical Method approach
    works as follows: For each source host compute the hourly rate (count/min) of connections to never-before-seen
    destination domains (Frequency) and the count of distinct second-level domains contacted. Baseline
    across all hosts and flag any host whose new-domain rate exceeds the 95th percentile, indicating a
    spray toward dynamic C2 infrastructure. Track this alongside per-flow byte volume so high domain churn
    plus large outbound bytes escalates severity, consistent with stateless lexical/volume profiling in
    [Real-Time Detection of DNS Exfiltration and Tunneling](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).
