questions:
- question: '[Command and Control] Match destinations to threat feed: Can you determine whether evidence
    of a network connection from an internal host to an external IP address or domain that matches an
    entry on a threat intelligence feed of known C2 servers utilizing protocol tunneling. -- specifically,
    using the ''Match destinations to threat feed'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary tunnels network
    communications inside a separate protocol to avoid detection/network filtering, add a layer of encryption,
    or route otherwise-unreachable traffic (SMB, RDP) to and from a victim system, blending malicious
    C2 into legitimate-looking flows. This evidence focuses on the condition that evidence of a network
    connection from an internal host to an external IP address or domain that matches an entry on a threat
    intelligence feed of known C2 servers utilizing protocol tunneling. This Symbolic Logic approach works
    as follows: Continuously join the destination IP (''id.resp_h'') from Zeek conn.log and queried domain
    (''query'') from Zeek dns.log against high-confidence threat-intel feeds of known tunneling C2 indicators,
    and join Zeek ssl.log JA3/JA3S hashes against published implant fingerprint blocklists (e.g., Cobalt
    Strike) per [JA3 TLS Client Fingerprinting](https://github.com/salesforce/ja3). Also alert on self-signed
    certificates, validity < 90 days, or subject/issuer mismatch on long-lived outbound flows, which are
    deterministic tunneling/C2 indicators per [Deciphering Malware''s use of TLS](https://arxiv.org/abs/1607.01639).
    Generate a high-severity alert for any match. A positive result -- a rule match, a statistical outlier,
    or a model alert -- indicates probable protocol tunneling; pivot to the responsible host and process
    lineage, the command line and user/context, the destination infrastructure and queried domains, the
    encapsulating protocol and port, and the volume/timing of the channel to confirm an active tunnel
    and scope its duration and data movement. A negative result helps rule out this particular tunneling
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, encrypted, or low-throughput tunnels.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Egress firewalls and proxies, Recursive DNS servers, Network sensor grid'
  range: Last 90 days
  queries:
