    destination infrastructure and queried domains, the encapsulating protocol and port, and the volume/timing
    of the channel to confirm an active tunnel and scope its duration and data movement. A negative result
    helps rule out this particular tunneling vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, encrypted, or low-throughput tunnels.'
