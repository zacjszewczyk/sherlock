questions:
- question: '[Persistence] Match AppCertDLLs modifications to malicious hashes: Can you determine whether
    the HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session Manager\AppCertDLLs registry key is
    modified, and the new DLL path, filename, or file hash matches a known malicious indicator. -- specifically,
    using the ''Match AppCertDLLs modifications to malicious hashes'' (Symbolic Logic) approach to answer
    the mission question: Is the adversary maintaining persistence using AppCert DLLs??'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses the AppCertDLLs
    registry value (HKLM\System\CurrentControlSet\Control\Session Manager\AppCertDLLs) so that a malicious
    DLL is force-loaded into every process that calls the CreateProcess-family or WinExec APIs, granting
    both persistence and the opportunity to run code in the security context (often SYSTEM) of unrelated
    processes. This evidence focuses on the condition that the HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session
    Manager\AppCertDLLs registry key is modified, and the new DLL path, filename, or file hash matches
    a known malicious indicator. This Symbolic Logic approach works as follows: Trigger on ANY modification
    to `HKLM\System\CurrentControlSet\Control\Session Manager\AppCertDLLs` (Windows Event ID 4657 or Sysmon
    Event ID 13). Treat the write itself as inherently high-signal because legitimate use of this key
    is rare ([4 Ways Adversaries Hijack DLLs](https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/)).
    Extract the new DLL path, resolve its hash, and (1) compare DLL name and hash to a TI feed and alert
    high-severity on any match; (2) independently escalate when the DLL is unsigned or its Authenticode
    signature fails to validate, when the path is outside `C:\Windows\System32`, or when the writing process
    is NOT a known installer (`msiexec.exe`, `TrustedInstaller.exe`, `setup*.exe`). Confirm the DLL is
    subsequently force-loaded into multiple unrelated processes via Sysmon Event ID 7 (ImageLoad), a behavior
    characteristic of registry-forced injection ([The Sysmon Community Guide: CreateRemoteThread](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates likely AppCert
    DLL abuse on the host; pivot to the writing process and its full parent lineage, the DLL path/hash/signature,
    whether the DLL was subsequently force-loaded (Sysmon Event ID 7) into multiple unrelated processes,
    and any follow-on privilege changes, child shells, or outbound C2. A negative result helps rule out
    this specific AppCert DLL vector for the persistence objective, but should be corroborated with the
    other questions in this playbook, since legitimate use of this key is rare and a single method can
    miss a stealthy or slow-moving operator. Tie findings to the mission question: Is the adversary maintaining
    persistence using AppCert DLLs?'
