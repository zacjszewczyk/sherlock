name: 'T1546.009: AppCert DLLs'
id: b7a2efee-8b8f-48cb-81f0-24a660fa5bd8
description: 'This playbook helps an analyst investigate adversary abuse of AppCert DLLs (T1546.009) for
  both persistence and privilege escalation on Windows hosts. AppCert DLLs registered under HKLM\System\CurrentControlSet\Control\Session
  Manager\AppCertDLLs are force-loaded into every process that calls CreateProcess, CreateProcessAsUser,
  CreateProcessWithLoginW, CreateProcessWithTokenW, or WinExec, so a single malicious entry can run attacker
  code repeatedly and in the context of high-integrity processes. The playbook guides the hunt across
  several behavioral angles: any modification to the AppCertDLLs key (Event ID 4657 / Sysmon 13) matched
  against threat-intel hashes, signature status, path, and writer identity; DLLs dropped into world-writable
  directories (Public, ProgramData, %TEMP%) and then referenced by a fresh AppCertDLLs write; registry
  edits originating from user applications (Office, browsers, Acrobat) or medium/low-integrity processes
  indicating an exploit chain; SYSTEM-integrity processes (services.exe, lsass.exe, winlogon.exe) spawning
  shells; privileged group membership changes (Event IDs 4732/4728/4720) shortly after an AppCertDLLs
  write; and anomalous outbound network activity (Zeek conn/dns/notice) following the registry change.
  Detection methods combine symbolic-logic correlation rules, statistical baselining (entropy, fleet prevalence,
  mean+3-sigma volume, parent/actor rarity, conditional process probabilities), and machine-learning models
  (Random Forest, logistic regression, decision trees, HMM/sequence models, LSTM forecasting, and provenance-graph
  learning) applied to Windows Security/Sysmon events and Zeek network telemetry, so the analyst can corroborate
  suspected AppCert DLL abuse against registry writes, DLL provenance, process lineage, privilege changes,
  and egress context.'
type: technique
