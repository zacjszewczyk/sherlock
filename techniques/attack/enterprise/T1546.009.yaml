    a known malicious indicator. This Statistical Method approach works as follows: For each AppCertDLLs
    write, compute (a) Shannon string entropy of the DLL filename/path and (b) fleet-wide prevalence of
    the DLL hash. Alert when filename entropy exceeds the 95th percentile of known-good AppCert/installer
    DLLs (randomized names), aligning with packed/obfuscation entropy heuristics ([Using Entropy Analysis
    to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989)), OR when the
    DLL hash is seen on fewer than 0.1% of hosts in the fleet, since the overwhelming majority of real
    threats are low-prevalence ([Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365),
    [What''s the Deal with Prevalence?, F-Secure](https://blog.f-secure.com/whats-the-deal-with-prevalence/)).
    Maintain a per-environment baseline of AppCertDLLs write rate and writer identities and alert beyond
    mean + 3*sigma to catch volume/frequency spikes ([Finding Anomalies in Windows Event Logs Using Standard
    Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)). Failure-mode signal:
    separately track Event ID 4657 writes attempted by medium/low-integrity or non-admin tokens that nonetheless
    succeed, indicating a privilege anomaly. A positive result -- a rule match, statistical outlier, or
    model alert -- indicates likely AppCert DLL abuse on the host; pivot to the writing process and its
    full parent lineage, the DLL path/hash/signature, whether the DLL was subsequently force-loaded (Sysmon
    Event ID 7) into multiple unrelated processes, and any follow-on privilege changes, child shells,
    or outbound C2. A negative result helps rule out this specific AppCert DLL vector for the persistence
    objective, but should be corroborated with the other questions in this playbook, since legitimate
    use of this key is rare and a single method can miss a stealthy or slow-moving operator. Tie findings
    to the mission question: Is the adversary maintaining persistence using AppCert DLLs?'
