      \ high\nFOR EACH host:\n  cnt = count(discovery_util_exec) per hour\n  ALERT WHEN cnt > host_baseline_mean\
      \ + 3*sigma  // Volume/Frequency\n// derive percentile/sigma cutoffs from local 30-day data"
- question: 'Using a machine-learning model, can you determine whether ''Classify process executions and
    graph anomalous provenance'' indicates Permission Groups Discovery activity? Specifically: Train a
    random forest classifier on labeled historical process execution data (Sysmon Event ID 1). Use features
    such as parent process name (e.g., cmd.exe vs. explorer.exe), process path rarity score, command-line
    argument count, command-line entropy, and whether the process is signed. Surface the top-3 contributing
    features (e.g., ''rare parent w3wp.exe'', ''unsigned binary'', ''high arg entropy'') in the alert
    text for explainability. Layer a provenance-graph model — [KAIROS](https://tfjmp.org/publications/2024-sp.pdf)
    or node-level [ThreaTrace](https://arxiv.org/pdf/2111.04333) — to flag anomalous process/object-access
    edges (e.g., Office or web-server process spawning net/dsquery/SharpHound and reading AD/LSA objects)
    and reconstruct the surrounding subgraph for triage.'
