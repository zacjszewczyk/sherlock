questions:
- question: 'Using deterministic rule logic, can you determine whether ''Watchlist discovery tooling and
    group-audit events'' indicates Permission Groups Discovery activity? Specifically: Create and maintain
    a watchlist of discovery tool filenames (e.g., sharphound.exe, adfind.exe, dsquery.exe), file hashes,
    and code-signing certificates, anchored on the native utility/tool ground truth in [Permission Groups
    Discovery (T1069), MITRE ATT&CK](https://attack.mitre.org/techniques/T1069/). Query process creation
    logs (Windows Event ID 4688, Sysmon Event ID 1) for any matches in the ProcessName, OriginalFileName,
    or Hashes fields, and apply image+argument rules of the form shown in [Domain Trust Discovery Via
    Dsquery, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_dsquery_domain_trust_discovery.yml).
    In parallel, alert on Windows Event ID 4798/4799 where the calling Process Information is a discovery
    tool or a non-admin Subject, per [Windows Security Audit Events 4799/4798, Microsoft](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4799).'
  context: 'Tactic context (Discovery): adversaries enumerate group and permission settings to learn which
    accounts and groups hold elevated privileges, orienting themselves before lateral movement or privilege
    escalation. Evidence under investigation: A process is created with a file hash or name matching a
    known discovery tool (e.g., BloodHound, SharpHound, AdFind.exe, dsquery.exe), or a common system utility
    (e.g., net.exe, whoami.exe) is executed from a non-standard file path (e.g., C:\PerfLogs\, %APPDATA%).
    Windows group-membership audit events (4798/4799) may fire even when command-line logging is absent.
    Approach (Watchlist discovery tooling and group-audit events): Create and maintain a watchlist of
    discovery tool filenames (e.g., sharphound.exe, adfind.exe, dsquery.exe), file hashes, and code-signing
    certificates, anchored on the native utility/tool ground truth in [Permission Groups Discovery (T1069),
    MITRE ATT&CK](https://attack.mitre.org/techniques/T1069/). Query process creation logs (Windows Event
    ID 4688, Sysmon Event ID 1) for any matches in the ProcessName, OriginalFileName, or Hashes fields,
    and apply image+argument rules of the form shown in [Domain Trust Discovery Via Dsquery, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_dsquery_domain_trust_discovery.yml).
    In parallel, alert on Windows Event ID 4798/4799 where the calling Process Information is a discovery
    tool or a non-admin Subject, per [Windows Security Audit Events 4799/4798, Microsoft](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4799).
    A positive result means an account or process is enumerating group memberships, privileges, or access
    controls in a pattern inconsistent with its role and baseline (e.g., non-admin subject touching privileged
    groups, rare execution path, high command entropy, denial bursts, or discovery chaining into credential
    access or lateral movement); a negative result means the activity matches expected administrative
    behavior. Investigate the named area of interest (Domain Controllers, Member Servers, User Workstations,
    Endpoint Detection and Response (EDR) Platform) and pivot from any hit to the originating account,
    host, parent process, and any subsequent credential-access or lateral-movement activity.'
