  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection: discovery tooling + 4798/4799\nMATCH process_creation (EventCode=4688\
      \ OR Sysmon=1) WHERE\n  lower(ProcessName) IN tool_watchlist  // sharphound.exe, adfind.exe, dsquery.exe\n\
      \  OR OriginalFileName IN tool_watchlist\n  OR Hashes IN known_tool_hashes\n  OR (ProcessName IN\
      \ ['net.exe','whoami.exe','nltest.exe']\n      AND ProcessPath NOT IN approved_paths)  // e.g. C:\\\
      PerfLogs\\, %APPDATA%\nTHEN alert(severity='high', enrich=[user, host, parent_process])\n// Also\
      \ fire on native group-membership audit even without cmdline logging\nMATCH (EventCode=4798 OR EventCode=4799)\
      \ WHERE\n  CallerProcessName IN tool_watchlist OR Subject NOT IN authorized_admins\nTHEN alert(severity='medium')"
- question: 'Using statistical baselining, can you determine whether ''Baseline execution-path rarity
    and utility burst volume'' indicates Permission Groups Discovery activity? Specifically: For common
    system utilities (net.exe, whoami.exe, nltest.exe, dsquery.exe), calculate the frequency of execution
    paths across all endpoints over a 30-day baseline. Flag any execution where the path''s frequency
    falls below the 1st percentile, indicating an atypically rare location such as C:\Users\Public\Downloads\.
    Also score the rarity of the full command token string per [SCADE](https://arxiv.org/abs/2412.04259),
    and emit Volume/Frequency metrics (count of discovery-utility executions per host per hour; flag >3
    standard deviations above the host''s baseline). Derive percentile/sigma cutoffs per environment from
    your own 30-day data.'
