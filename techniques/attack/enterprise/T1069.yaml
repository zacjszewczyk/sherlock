name: 'T1069: Permission Groups Discovery'
id: 601d6dc4-2980-409b-928f-3063327254e9
description: 'This playbook helps an analyst determine whether an adversary is performing Permission Groups
  Discovery (T1069): enumerating local, domain, cloud, and container group memberships and access controls
  to learn which accounts and groups hold elevated privileges before lateral movement or privilege escalation.
  It correlates host process telemetry (Windows 4688/Sysmon 1, PowerShell script-block 4104, Linux auditd
  execve, macOS unified log) and the native group-enumeration audit events (Windows 4798/4799) with command-line
  content to surface use of discovery tooling (BloodHound/SharpHound, AdFind, dsquery) and abuse of native
  utilities (net.exe, whoami /groups, Get-ADGroupMember, Get-Acl, id, groups, getent group, dscl). It
  extends to containerized and cloud estates (kubectl auth can-i, get rolebindings, docker inspect; Kubernetes
  audit logs and CloudTrail), weighting authorization-failure bursts (403 Forbidden, AccessDenied) as
  a distinct reconnaissance signal. Investigative angles include: non-admin subjects enumerating privileged
  groups (Domain Admins, Enterprise Admins), off-hours or peer-group-anomalous enumeration, rare execution
  paths and high command-line entropy, and T1069 events that chain into credential access (T1003) or lateral
  movement (T1021.002/T1550.002, 4624 Type 10, 4648). Detection blends symbolic-logic watchlists and SIEM
  correlation, statistical baselining (percentiles, sigma thresholds, entropy, sequential hypothesis testing,
  technique-transition risk scoring), and machine learning (Random Forest, One-Class SVM, Isolation Forest,
  Seasonal-ARIMA, DeepLog/BERT sequence models, provenance- and link-prediction graphs) to produce evasion-resistant,
  explainable alerts for the Discovery tactic.'
type: technique
