- question: 'Using statistical baselining, can you determine whether ''Per-user command baseline, entropy,
    and denied-outcome rate'' indicates Permission Groups Discovery activity? Specifically: For each user,
    establish a baseline of distinct discovery commands executed per day over a 30-day period (Frequency/State
    metrics). Calculate the Shannon entropy of each command line and flag obfuscated/auto-generated invocations
    whose entropy exceeds the per-context threshold, per [High Command Line Entropy Detected for Privileged
    Commands, Elastic](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).
    Alert if a user''s raw count of discovery commands exceeds 3 standard deviations above their daily
    average, and separately track the failed/denied outcome rate (e.g., ''The specified group does not
    exist'', non-zero exit codes) as a distinct signal. Tune sigma cutoffs from local data; do not delete
    the deterministic count thresholds.'
