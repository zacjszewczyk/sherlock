    query: "// Statistical baselining: path rarity + per-host burst\nWINDOW = 30d baseline, evaluate hourly\n\
      FOR util IN ['net.exe','whoami.exe','nltest.exe','dsquery.exe']:\n  path_freq = frequency(ProcessPath\
      \ across all endpoints, util)\n  ALERT WHEN path_freq < p01  // atypically rare path e.g. C:\\Users\\\
