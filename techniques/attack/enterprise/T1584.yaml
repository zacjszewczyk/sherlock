name: 'T1584: Compromise Infrastructure'
id: ea840125-3d41-42d3-acd5-cba6e0e2abad
description: 'Investigate evidence that an adversary has compromised third-party infrastructure (physical
  or cloud servers, domains, network devices, DNS/web services, or botnet nodes) and is using it for command
  and control, staging, proxying, or other operational purposes against your environment. Because compromised
  infrastructure lets adversaries blend in with high-reputation, trusted destinations, detection focuses
  on the network and endpoint artifacts produced when internal hosts interact with that infrastructure.
  This playbook helps an analyst hunt for and triage: internal hosts contacting threat-intelligence (TI)-listed
  malicious IPs/domains/URLs and the failure-state patterns of dead or rotating compromised infrastructure;
  TLS connections using known-malicious or rare/anomalous certificates; outbound connections with anomalous
  protocol/fingerprint characteristics (non-standard ports, JA3/JA3S/JA4 C2 fingerprints, C2-tooling HTTP
  headers); resolution of DGA, newly registered, or otherwise suspicious domains; periodic C2 beaconing;
  high fan-out connection bursts indicative of scanning or command distribution; and suspicious file transfers
  to or from public file-sharing and code-repository services from sensitive hosts. Each question pairs
  symbolic-logic, statistical, and machine-learning detection approaches so the analyst can confirm or
  rule out adversary use of compromised external infrastructure.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is any internal host initiating outbound connections to an IP address, domain, or URL that
    a high-confidence threat-intelligence feed has flagged as malicious or compromised infrastructure?
  context: Adversaries who control compromised third-party infrastructure (Resource Development) use it
    for command and control, staging, and proxying. The most direct signal is an internal host reaching
    a destination already enriched on a TI watchlist. Correlate Zeek conn.log/dns.log/http.log and Windows
    Event ID 5156 (filtering platform connection allowed) against your TIP indicators, and pivot using
    JA3/JA4 client TLS fingerprints of known C2 implants so you catch the same tooling even when the IP/domain
    rotates. Critically, record the connection state (S0/REJ/RSTO) so blocked or failed callbacks to a
    TI destination are alerted as a distinct signal of an implant retrying against dead infrastructure
    rather than silently dropped. A positive match warrants immediate host isolation and deeper triage;
    a negative result lowers, but does not eliminate, the likelihood that known compromised infrastructure
    is in use.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Egress network gateways, proxy servers, internal DNS resolvers, and all endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source IN (zeek_conn, zeek_dns, zeek_http, win_5156)
      | eval dest = coalesce(resp_h, query, host, dest_ip)
      | lookup ti_watchlist indicator AS dest OUTPUT confidence, category
      | where confidence >= "high"
      | eval signal = if(conn_state IN ("S0","REJ","RSTO"), "failed_callback", "established")
      | stats count, values(conn_state), values(signal) by src_ip, dest, category
  - technology: Zeek/pseudocode
    query: |-
      ja3_or_ja4 = ssl.log.ja3 OR ssl.log.ja4
      | join ti_ja3_watchlist on ja3_or_ja4
      | emit alert{src=id.orig_h, dst=id.resp_h, fp=ja3_or_ja4, state=conn.conn_state}
- question: Does any internal host show a high ratio of failed or rejected outbound connections to threat-intelligence
    or rare destinations, consistent with an implant retrying against dead or rotating compromised infrastructure?
  context: When compromised infrastructure is taken down, sinkholed, or rotated, implants keep retrying,
    producing bursts of failed connections (Zeek conn_state S0/REJ/RSTO; Windows Event ID 5157 drops).
    Treating these failure states as a first-class indicator surfaces beaconing to infrastructure that
    is no longer live -- a strong tell of automated C2 that a pure 'successful connection' rule would
    miss. Compute, per host, the ratio of failed to total outbound attempts toward TI-listed or otherwise
    rare destinations, and alert when the ratio and volume are both elevated. A high failure ratio to
    a single or small set of destinations is suspicious; broad failures across many destinations may instead
    indicate scanning (see fan-out questions).
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Egress network gateways, proxy servers, internal DNS resolvers, and all endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source=zeek_conn
      | lookup ti_watchlist indicator AS resp_h OUTPUT confidence
      | eval failed = if(conn_state IN ("S0","REJ","RSTO"),1,0)
      | stats sum(failed) AS fails, count AS total by src_ip, resp_h
      | eval fail_ratio = fails/total
      | where fail_ratio > 0.6 AND fails >= 10
- question: For each source-destination pair, do connection frequency, byte volume, or out/in byte ratio
    toward a TI-flagged or rare destination deviate sharply (Z-score > 3) from a rolling 14-day baseline?
  context: Beyond static watchlists, statistical baselining catches compromised infrastructure that is
    newly used or low-reputation. Build a 14-day rolling baseline per source-destination pair for connections-per-minute,
    total byte volume, and the outbound/inbound byte ratio, then alert when a TI-flagged or rare destination
    exceeds a Z-score of 3 on any dimension. A high out/in ratio can indicate staging/exfil to compromised
    infrastructure, while elevated frequency suggests automated callbacks. Tune thresholds to local benign-traffic
    distributions to control false positives; backup/sync services and software updates are common benign
    outliers to allowlist.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Egress network gateways, proxy servers, internal DNS resolvers, and all endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source=zeek_conn earliest=-14d
      | bin _time span=1m
      | stats count AS freq, sum(orig_bytes) AS ob, sum(resp_bytes) AS rb by src_ip, resp_h, _time
      | eventstats avg(freq) AS mu_f, stdev(freq) AS sd_f,
                   avg(eval(ob/rb)) AS mu_r, stdev(eval(ob/rb)) AS sd_r by src_ip, resp_h
      | eval z_freq=(freq-mu_f)/sd_f, z_ratio=((ob/rb)-mu_r)/sd_r
      | where (z_freq>3 OR z_ratio>3)
- question: When a supervised Random Forest model scores a new outbound connection above 0.90 probability
    of being malicious, what are the top contributing features and does the connection correspond to compromised
    infrastructure?
  context: Symbolic and statistical rules miss novel or carefully blended C2. A Random Forest trained
    on connection/indicator/source features (frequency, byte volume and ratio, destination port, duration,
    connection state) generalizes from labeled history to score new events; alert when probability exceeds
    0.90. Surface the top-3 SHAP-contributing features in the alert so an analyst can triage why the model
    fired (e.g., long duration + high out/in ratio + rare port). Run a Kitsune autoencoder in parallel
    as an unsupervised baseline to flag novel callbacks the supervised model has never seen. Positive,
    explainable hits feed the watchlist and beaconing questions; unexplained high scores still merit a
    look at the host's process-to-network provenance.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Egress network gateways, proxy servers, internal DNS resolvers, and all endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      model = load("rf_c2_connections")
      features = [freq, orig_bytes, resp_bytes, out_in_ratio, dest_port, duration, conn_state_enc]
      | apply model -> p_malicious, shap_top3
      | where p_malicious > 0.90
      | table src_ip, resp_h, p_malicious, shap_top3
      # parallel: kitsune_autoencoder recon_error > anomaly_threshold
- question: Is any internal host completing a TLS handshake using an X.509 certificate whose SHA-1 hash,
    serial, subject, or issuer matches a threat-intelligence list of known-malicious certificates, or
    whose JA4X/JA3S fingerprint matches known C2?
  context: Adversaries frequently reuse code-signing or TLS certificates across compromised infrastructure.
    Matching Zeek ssl.log sha1/serial/subject/issuer fields against TI watchlists deterministically catches
    known-bad certificates. Because adversaries rotate serials, also fingerprint the certificate structure
    with JA4X (X.509) and the server hello with JA3S to catch reused implant certificates whose serial
    has changed but whose structure has not. A match is high-confidence evidence of compromised infrastructure
    and should trigger host containment and certificate-pinning review; absence of a match should be followed
    by the rarity-scoring and clustering questions below for unknown certificates.
  answer_sources:
  - Zeek ssl.log
  - 'NAI: Network egress points with TLS inspection capabilities, web proxies, and endpoint EDR sensors
    capable of inspecting TLS traffic.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      source=ssl.log
      | lookup ti_cert_watchlist (sha1 OR serial OR subject OR issuer)
      | OR lookup ti_ja4x_watchlist on ja4x
      | OR lookup ti_ja3s_watchlist on ja3s
      | emit alert{src=id.orig_h, dst=id.resp_h, sha1, serial, subject, issuer, ja4x, ja3s}
- question: Are any TLS certificates statistically rare (issuer/subject pair above the 99th percentile
    of inverse prevalence), or do specific hosts show elevated rates of self-signed certificates, very
    short validity periods, or TLS validation failures?
  context: Compromised and hastily staged infrastructure often presents certificates unlike the high-reputation
    CAs your environment normally sees. Score each certificate by the inverse prevalence of its issuer/subject
    pair and flag those above the 99th percentile (rarest 1%). Separately profile, per host, the rate
    of self-signed certificates, abnormally short validity windows, and TLS validation failures -- each
    is a distinct state signal of staged or compromised infrastructure. Many internal/dev systems legitimately
    use self-signed certs, so baseline per network segment and prioritize sensitive hosts and egress paths.
  answer_sources:
  - Zeek ssl.log
  - 'NAI: Network egress points with TLS inspection capabilities, web proxies, and endpoint EDR sensors
    capable of inspecting TLS traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source=ssl.log
      | stats count by issuer, subject
      | eventstats sum(count) AS tot
      | eval prevalence = count/tot, rarity = 1/prevalence
      | eval pctl = percentile_rank(rarity)
      | where pctl >= 99
      ;; per-host failure profile
      | stats sum(eval(self_signed=true)) AS ss, sum(eval(validation_status!="ok")) AS valfail,
              sum(eval(validity_days<7)) AS shortlived by src_ip
- question: When certificates are clustered on structural features, which fall into noise/outlier clusters,
    and what top features distinguish them from the bulk of legitimate certificates?
  context: Unsupervised clustering reveals certificate populations that neither TI nor simple rarity scoring
    name. Cluster certificates with DBSCAN on features such as validity period, key algorithm and length,
    subject/issuer entropy, and JA4X fingerprint; certificates that land in noise (un-clustered) points
    are the prime candidates for compromised/staged infrastructure. Emit the top-3 distinguishing features
    for each flagged certificate so the analyst can quickly judge whether it is a benign rarity (e.g.,
    an internal appliance) or an adversary artifact. Outliers should be pivoted back into the TI-matching
    and rarity questions and correlated with the connecting host's other behavior.
  answer_sources:
  - Zeek ssl.log
  - 'NAI: Network egress points with TLS inspection capabilities, web proxies, and endpoint EDR sensors
    capable of inspecting TLS traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      X = features(ssl.log): [validity_days, key_alg_enc, key_len, subj_entropy, issuer_entropy, ja4x_hash]
      | DBSCAN(eps, min_samples) -> cluster_label
      | where cluster_label == -1   # noise / outlier
      | annotate top3_distinguishing_features
      | table src_ip, resp_h, sha1, top3_distinguishing_features
- question: Is any outbound connection using an application protocol on a non-standard port, presenting
    a JA3/JA3S or JA4/JA4S fingerprint that matches known C2, or carrying HTTP headers characteristic
    of a C2 framework?
  context: Compromised infrastructure often hosts C2 frameworks whose network behavior diverges from the
    legitimate service it impersonates. Flag Zeek records where an SSL/TLS service runs on a non-standard
    port, where JA3/JA3S or JA4/JA4S matches known C2 fingerprints, or where HTTP headers (user agent,
    header order, URI patterns) match documented C2 tooling. Prefer JA4 fingerprints where browser TLS
    extension randomization has degraded JA3 stability. A signature hit is strong evidence and should
    be correlated with the TI and beaconing questions; tune for benign apps that use odd ports (e.g.,
    management consoles) by allowlisting per segment.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - 'NAI: Egress network gateways, internal network taps, and endpoint devices.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      (ssl.log OR conn.log OR http.log)
      | eval nonstd = (service=="ssl" AND resp_p NOT IN (443,8443,993,995,...))
      | eval c2_fp = ja3 IN c2_ja3 OR ja3s IN c2_ja3s OR ja4 IN c2_ja4 OR ja4s IN c2_ja4s
      | eval c2_hdr = http.user_agent IN c2_ua OR http.header_order IN c2_hdr_sigs
      | where nonstd OR c2_fp OR c2_hdr
      | emit alert{src=id.orig_h, dst=id.resp_h, resp_p, ja3, ja4, reason}
- question: Are any connections using destination ports outside the top 99% for that service, or moving
    byte volumes / out-in ratios above the 99th percentile of the host's baseline for that protocol?
  context: Statistical rarity catches anomalous protocol/port use without a prior signature. Per network
    segment, alert when a connection's destination port falls outside the top 99% of ports observed for
    that service, or when its byte volume or outbound/inbound ratio exceeds the 99th percentile of the
    host's baseline for that protocol. This surfaces protocol-on-wrong-port tunneling and bulk staging
    that blends with allowed services. Derive percentiles per segment because DMZ servers, workstations,
    and cloud VMs have very different normal port/volume profiles; pivot hits into the fingerprint and
    beaconing questions.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - 'NAI: Egress network gateways, internal network taps, and endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source=zeek_conn earliest=-14d
      | stats count by segment, service, resp_p
      | eventstats sum(count) AS svc_tot by segment, service
      | eval port_share = count/svc_tot
      ;; flag ports outside top 99% cumulative share, then volume:
      | join service,segment [ stats p99(orig_bytes) AS v99, p99(eval(orig_bytes/resp_bytes)) AS r99 by segment, service ]
      | where rare_port OR orig_bytes>v99 OR (orig_bytes/resp_bytes)>r99
- question: Does the hourly count of non-standard-port connections exceed the upper confidence interval
    of a seasonal forecast, or does an unsupervised flow-statistics model flag a novel encrypted-C2 fingerprint?
  context: Adversary tooling on compromised infrastructure introduces gradual or sudden changes in non-standard-port
    usage that point-in-time rules miss. Forecast hourly non-standard-port counts with a seasonal model
    (e.g., Prophet) and alert when observed counts breach the upper confidence interval. Run a Kitsune
    autoencoder ensemble over flow statistics in parallel to flag novel encrypted-C2 fingerprints the
    forecast cannot, and report top contributing features for explainability. Spikes coinciding with TI
    hits or beaconing strongly indicate active compromised-infrastructure C2; isolated forecast breaches
    may reflect new legitimate services and warrant baseline updates.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - 'NAI: Egress network gateways, internal network taps, and endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      ts = hourly_count(zeek_conn where nonstd_port) per segment
      | model = Prophet(ts, seasonality=daily+weekly)
      | forecast yhat, yhat_upper
      | where actual > yhat_upper
      # parallel unsupervised:
      | kitsune(flow_stats) -> recon_error
      | where recon_error > thr | annotate top3_features
- question: Is any internal host querying a known DGA or newly-registered domain and then making an outbound
    connection, or issuing DNS with rare record types (NULL/TXT), abnormal label counts/length, or unusually
    low TTLs?
  context: Adversaries operating compromised infrastructure frequently front it with algorithmically generated
    (DGA) or newly registered (NRD) domains, and use covert DNS channels for C2. Alert when Zeek dns.log
    queries a known DGA/NRD domain that is then followed by an outbound connection (resolution-to-connection
    correlation strengthens the signal). Add deterministic rules for rare resource-record types (NULL/TXT),
    abnormal label counts and lengths, and low TTLs characteristic of tunneling and fast-flux. Positive
    correlation between a suspicious resolution and a subsequent connection is a strong lead; pivot to
    entropy scoring and the classifier for unknown domains.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internal DNS resolvers, DNS forwarders to external resolvers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      source=dns.log
      | lookup dga_nrd_watchlist domain AS query OUTPUT list_type
      | eval rare_rr = qtype_name IN ("NULL","TXT")
      | eval odd_labels = label_count>5 OR max_label_len>40
      | eval low_ttl = TTL<60
      | where list_type!=null OR rare_rr OR odd_labels OR low_ttl
      | join conn.log on (id.orig_h, answers->resp_h) within 5m
      | emit alert{src=id.orig_h, query, reason}
- question: Do any DNS queries exceed the 99.5th percentile for domain entropy or bigram/Zipfian deviation,
    or do specific hosts show elevated NXDOMAIN response rates indicative of DGA resolution churn?
  context: 'DGA domains are statistically distinguishable from human-chosen names. Baseline domain Shannon
    entropy and bigram/Zipfian deviation across your environment and flag queries above the 99.5th percentile
    -- algorithmically generated labels score far higher than legitimate domains. Separately profile each
    host''s NXDOMAIN response rate (count per minute and ratio of NXDOMAIN to total): DGA malware cycles
    through many non-resolving candidate domains before finding the live one, producing a distinctive
    failure-mode spike. High entropy plus an NXDOMAIN spike on the same host is strong evidence of DGA-based
    contact with compromised infrastructure.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internal DNS resolvers, DNS forwarders to external resolvers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source=dns.log
      | eval ent = shannon_entropy(query), bg = bigram_deviation(query)
      | eventstats p99.5(ent) AS ent_thr, p99.5(bg) AS bg_thr
      | where ent>ent_thr OR bg>bg_thr
      ;; NXDOMAIN failure-mode profile
      | stats sum(eval(rcode_name="NXDOMAIN")) AS nx, count AS tot by src_ip, bin(_time,1m)
      | eval nx_ratio = nx/tot | where nx>=20 OR nx_ratio>0.4
- question: When a lexical DGA classifier predicts a queried domain is algorithmically generated with
    confidence above 0.95, which features drive the verdict and does the host show corroborating C2 behavior?
  context: A supervised classifier on lexical features -- length, Shannon entropy, n-grams, digit and
    vowel/consonant ratios, Levenshtein distance to dictionary words -- detects DGA families that static
    lists and single-metric scoring miss. Alert on high-confidence predictions (>0.95) and surface the
    top-3 features driving each verdict so analysts can distinguish true DGA from benign machine-generated
    names (CDNs, telemetry). Corroborate classifier hits with the NXDOMAIN/entropy signals and with subsequent
    outbound connections to confirm contact with compromised infrastructure. Feed confirmed DGA domains
    back to the watchlist.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internal DNS resolvers, DNS forwarders to external resolvers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      model = load("dga_lexical_classifier")
      feats = [len, entropy, ngram_score, digit_ratio, vc_ratio, levenshtein_dict]
      | apply model on dns.log.query -> p_dga, shap_top3
      | where p_dga > 0.95
      | table src_ip, query, p_dga, shap_top3
- question: Does any source-destination pair exhibit at least five consistent connection intervals (within
    tolerance) with small payloads (<2KB), consistent with low-jitter C2 beaconing?
  context: Beaconing to compromised infrastructure is the hallmark of established C2. Track each source-destination
    pair statefully and require at least five connection intervals that are consistent within a tolerance,
    with payloads under ~2KB, before alerting on a repeated periodic pattern. Combine this with long-connection
    detection (persistent sessions) and connection-count-consistency checks to cover both polling and
    keep-alive C2. Benign periodic traffic (NTP, update checks, monitoring) must be allowlisted; what
    distinguishes malicious beacons is periodicity to a rare/low-reputation destination, ideally one that
    also appears in the TI or DGA questions.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network egress points, core network switches monitoring server-to-internet traffic, and endpoint
    devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source=zeek_conn
      | sort by src_ip, resp_h, _time
      | streamstats delta(_time) AS gap by src_ip, resp_h
      | stats count AS n, list(gap) AS gaps, avg(orig_bytes) AS avg_b,
              stdev(gap) AS jitter, avg(gap) AS interval by src_ip, resp_h
      | where n>=5 AND jitter < (interval*0.10) AND avg_b < 2048
      | lookup allowlist dest AS resp_h | where allow!=true
- question: For each source-destination pair, is the dispersion of inter-arrival times (std dev / Median
    Absolute Deviation) below the 2nd percentile, or do Bowley skewness and data-size-consistency scores
    indicate a low-jitter beacon?
  context: Statistical timing analysis detects beacons even when no fixed interval rule fires. Per pair,
    compute the dispersion of inter-arrival deltas (standard deviation and Median Absolute Deviation)
    and alert when it falls below the 2nd percentile -- extremely regular timing is unnatural for human-driven
    traffic. Add Bowley skewness of the delta distribution and a data-size-consistency score to capture
    beacons whose payloads are uniformly small. Calibrate against benign periodic baselines so monitoring
    and sync traffic do not dominate alerts. Low dispersion to a rare destination is a strong beaconing
    signal; pair with the FFT/sequence-model question for variable-jitter beacons.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network egress points, core network switches monitoring server-to-internet traffic, and endpoint
    devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source=zeek_conn
      | sort by src_ip, resp_h, _time
      | streamstats delta(_time) AS d by src_ip, resp_h
      | stats stdev(d) AS sd, mad(d) AS mad, bowley_skew(d) AS skew,
              stdev(orig_bytes) AS size_sd, count AS n by src_ip, resp_h
      | where n>=8
      | eventstats p2(sd) AS sd_thr
      | where sd < sd_thr OR (abs(skew)<0.1 AND size_sd<64)
- question: Does frequency-domain analysis (FFT/autocorrelation) reveal a prominent periodic peak in a
    host's connection time series, or does a sequence model recover a high/variable-jitter beacon that
    defeats simple periodicity statistics?
  context: Sophisticated implants randomize beacon timing to defeat dispersion thresholds. Apply FFT/autocorrelation
    with layered false-positive filters to per-pair connection time series and flag hosts with a dominant
    periodic frequency peak. Add an LSTM/transformer sequence model to recover high- or variable-jitter
    beacons that pure periodicity statistics miss, and report contributing features for triage. This is
    the most robust beaconing detector and should be reserved for hosts already elevated by rarity/TI
    signals to manage compute and false positives. Confirmed periodic peaks to rare destinations are high-confidence
    C2 to compromised infrastructure.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network egress points, core network switches monitoring server-to-internet traffic, and endpoint
    devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      ts = per (src_ip,resp_h) connection_count time_series
      | fft(ts) -> power_spectrum | find_dominant_peak -> peak_power, peak_freq
      | filter benign_periodic (update, ntp, monitoring)
      | where peak_power > thr
      # variable-jitter recovery:
      | seq_model = LSTM/transformer over interarrival+size sequence -> p_beacon, feat_attr
      | where p_beacon > 0.9
- question: Is any internal host contacting more than ~200 unique destination IPs on the same port within
    10 minutes, or showing a high ratio of failed/rejected connections indicative of scanning or dead
    compromised-infrastructure command distribution?
  context: A host that fans out to many unique destinations in a short window is either scanning, distributing
    commands across a botnet of compromised nodes, or beaconing to rotating dead infrastructure. Alert
    when a host contacts more than ~200 unique IPs on the same port within 10 minutes (excluding common
    service ports), and additionally alert on a high ratio of failed/rejected connections (conn_state
    S0/REJ/RSTO) which indicates scanning or callbacks to compromised infrastructure that is no longer
    live. Allowlist legitimate scanners, vulnerability scanners, and load balancers; otherwise this pattern
    on a workstation or sensitive server is highly suspicious.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint devices, servers with direct outbound internet access (e.g., in a DMZ), and cloud virtual
    machines.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source=zeek_conn
      | where resp_p NOT IN (53,80,443,123)
      | bin _time span=10m
      | stats dc(resp_h) AS uniq_dst, count AS total,
              sum(eval(conn_state IN ("S0","REJ","RSTO"))) AS fails by src_ip, resp_p, _time
      | eval fail_ratio = fails/total
      | where uniq_dst > 200 OR fail_ratio > 0.7
- question: Against a 14-day rolling baseline, do a host's hourly unique-destination counts exceed the
    mean by more than 4 standard deviations, or do its NXDOMAIN and failed-connection counts spike equivalently?
  context: Static thresholds miss hosts whose normal fan-out is high and over-alert on hosts whose normal
    is low. Maintain a 14-day rolling baseline per host and alert when hourly unique-destination counts
    exceed the mean by more than 4 standard deviations. Separately baseline per-host NXDOMAIN and failed-connection
    counts and alert on equivalent spikes as distinct failure-mode signals -- DGA churn and dead-infrastructure
    callbacks both manifest as failure spikes without necessarily inflating successful unique-destination
    counts. Correlate spikes across all three metrics for the same host to strengthen confidence that
    compromised-infrastructure command distribution is occurring.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint devices, servers with direct outbound internet access (e.g., in a DMZ), and cloud virtual
    machines.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source=(zeek_conn, zeek_dns) earliest=-14d
      | bin _time span=1h
      | stats dc(resp_h) AS uniq, sum(eval(rcode_name="NXDOMAIN")) AS nx,
              sum(eval(conn_state IN ("S0","REJ","RSTO"))) AS fails by src_ip, _time
      | eventstats avg(uniq) AS mu_u, stdev(uniq) AS sd_u,
                   avg(nx) AS mu_n, stdev(nx) AS sd_n,
                   avg(fails) AS mu_f, stdev(fails) AS sd_f by src_ip
      | where (uniq-mu_u)>4*sd_u OR (nx-mu_n)>4*sd_n OR (fails-mu_f)>4*sd_f
- question: Does Bayesian change-point / PELT analysis of a host's per-minute unique-destination time
    series reveal a significant upward shift, and does an unsupervised model corroborate the anomaly?
  context: Change-point detection finds the moment a host's behavior shifts from baseline to scanning/command-distribution,
    which is more robust than fixed thresholds for gradual ramp-ups. Apply Bayesian change-point or PELT
    to the per-minute unique-destination time series and alert on significant upward shifts. Run Kitsune
    in parallel as an unsupervised baseline and surface the top-3 features driving each alert for explainability.
    A detected upward change point coinciding with TI hits, beaconing, or DGA activity strongly indicates
    the host has begun using compromised infrastructure for distribution; isolated change points may reflect
    new legitimate workloads and warrant baseline review.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint devices, servers with direct outbound internet access (e.g., in a DMZ), and cloud virtual
    machines.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      ts = per src_ip per-minute dc(resp_h)
      | PELT/bayesian_changepoint(ts) -> changepoints
      | where shift_direction=="up" AND magnitude>thr
      # parallel unsupervised:
      | kitsune(flow_stats) -> recon_error | where recon_error>thr | annotate top3_features
- question: Are hosts in critical subnets connecting to watched file-sharing or code-repository domains
    and transferring suspicious MIME types or filenames (.exe/.ps1/.zip), especially via non-browser automated
    clients?
  context: Adversaries stage tooling and exfiltrate data through public file-sharing and code-repository
    services (Pastebin, GitHub, paste sites) hosted on compromised or abused infrastructure. Alert when
    hosts in critical subnets (Domain Controllers, database servers, code repos, privileged-user endpoints)
    connect to watched file-sharing/code-repo domains and Zeek files.log records suspicious MIME types
    or filename extensions (.exe, .ps1, .zip). Enrich with JA4H HTTP client fingerprints to catch non-browser
    automated clients -- a scripted uploader from a server is far more suspicious than a developer's browser.
    Correlate with Windows Event ID 4688 to tie the transfer to a process on the endpoint.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Critical assets (Domain Controllers, database servers, code repositories), endpoints of privileged
    users, and network egress points with file inspection capabilities.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      source=(conn.log, http.log, files.log)
      | where id.orig_h IN critical_subnets
      | lookup filesharing_watchlist domain AS host
      | eval bad_file = mime_type IN ("application/x-dosexec","application/zip") OR filename matches "\.(exe|ps1|zip)$"
      | eval automated = ja4h IN nonbrowser_ja4h
      | where bad_file AND (watch_hit OR automated)
      | join win_4688 on host->process
- question: Is any file transfer's MIME type in the bottom 5% of its peer group's distribution, or does
    its out/in byte-volume ratio or transfer-size percentile indicate a large staging upload or download?
  context: Type-based rules miss novel staging; peer-group rarity scoring catches it. For each transfer,
    compare the MIME type against the peer group's distribution (same role/subnet) and flag those in the
    bottom 5% -- a host transferring a type its peers never use is anomalous. Add the outbound/inbound
    byte-volume ratio and transfer-size percentile so large staging uploads or bulk downloads are scored
    on volume, not just type; a high out/in ratio on a sensitive host suggests exfiltration to compromised
    infrastructure. Derive peer groups carefully so legitimate role-specific transfers (e.g., backup servers)
    are not flagged.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Critical assets (Domain Controllers, database servers, code repositories), endpoints of privileged
    users, and network egress points with file inspection capabilities.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source=files.log
      | join host_role lookup on src_ip -> peer_group
      | stats count by peer_group, mime_type
      | eventstats sum(count) AS grp_tot by peer_group
      | eval mime_share = count/grp_tot
      | where mime_share < 0.05
      ;; volume scoring
      | eval out_in = tx_bytes/rx_bytes
      | eventstats p95(tx_bytes) AS sz95 by peer_group
      | where out_in>5 OR tx_bytes>sz95
- question: Does a one-class SVM flag a file transfer as an outlier from normal behavior, and on endpoints
    does provenance scoring reveal a rare process->network causal path consistent with a stealthy callback?
  context: Compromised-infrastructure callbacks are often low-and-slow and evade volume rules. Train a
    one-class SVM on normal transfer feature vectors (subnet, user agent, time-of-day, volume, MIME type)
    and flag outliers. On endpoints, correlate flagged transfers with rare causal process->network provenance
    paths (ProvDetector-style) to catch stealthy callbacks where an unexpected process initiates the network
    activity -- e.g., a document handler or LOLBin spawning an outbound transfer. Surface the top contributing
    features for triage. Outliers with a rare provenance path are high-confidence indicators of compromised-infrastructure
    use; pivot to the host's process tree (Windows Event ID 4688) and the TI/beaconing questions.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Critical assets (Domain Controllers, database servers, code repositories), endpoints of privileged
    users, and network egress points with file inspection capabilities.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      X = features(files.log+http.log): [subnet, user_agent_enc, hour, tx_bytes, rx_bytes, mime_enc]
      | model = OneClassSVM(trained_on=normal) | predict -> outlier
      | where outlier == -1
      # endpoint provenance:
      | join win_4688 -> process_lineage
      | provdetector_score(process->network path) -> rarity
      | where rarity > thr | annotate top_features
