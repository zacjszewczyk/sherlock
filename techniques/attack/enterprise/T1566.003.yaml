name: 'T1566.003: Spearphishing via Service'
id: a6572d59-48cb-4932-8c4d-d1c4c0c0b009
description: 'Investigate suspected initial access achieved through spearphishing delivered via third-party
  services (e.g., LinkedIn messages, personal webmail such as Gmail/iCloud Mail, social media, and file-sharing
  platforms) rather than enterprise email channels. This playbook helps an analyst trace the full kill
  chain: a file or link downloaded from a non-corporate third-party service, a high-risk or deceptively
  named payload (double extensions, RLO override, lookalike brand names, macro-enabled Office documents,
  HTA files), an office/browser/webmail client spawning a command interpreter or scripting engine shortly
  after the download, and subsequent outbound callbacks to newly registered, high-entropy, or uncategorized
  domains. It covers Windows, macOS, and Linux endpoints plus network security monitoring, and combines
  deterministic correlation (threat-intel matching, parent/child process rules, deceptive-filename and
  high-risk MIME detection), statistical baselining (per-service TI-match and failure rates, MIME-type
  mix, command-line entropy, unique-source-IP fan-out), and machine-learning scoring (malicious-download
  classifiers, provenance/command-line anomaly detection, beaconing/periodicity detection, and density
  clustering of coordinated downloads) to surface both sophisticated targeted campaigns and commodity
  malware.'
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: When a file is downloaded from a recognized non-corporate third-party service (LinkedIn, personal
    webmail, file-sharing), does its file hash (MD5/SHA1) or the destination domain/IP match a high-confidence
    threat-intelligence indicator or a SigmaHQ-style hash/domain rule?
  context: This is the deterministic detection floor for Spearphishing via Service initial access. Adversaries
    use third-party services to bypass enterprise email controls, so any download from those services
    that matches known-bad intelligence is a strong, high-confidence signal of a delivered payload. Join
    Zeek files.log (fuid, md5, sha1) to Zeek http.log (uid, host, referrer) on 'uid', restrict to an enterprise-defined
    list of non-corporate services, and test the resulting hashes and host/IP values against curated threat-intel
    feeds and Sigma hash/domain rules. A positive match should be treated as a high-priority alert and
    pivoted to host containment; a negative match does not clear the download, since novel payloads will
    not yet be in any feed and should still flow into the statistical and ML detections.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Network Security Monitoring (NSM) sensors at internet egress points; Centralized log aggregator
    (SIEM); Threat intelligence platform.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'files.log JOIN http.log ON uid

      | WHERE http.host IN third_party_service_list

      | LOOKUP md5, sha1, http.host, resp_ip IN ti_feed OR sigma_hash_domain_rules

      | WHERE match == true

      | ALERT priority=high'
  - technology: SIEM/Rule pseudocode
    query: 'source=zeek_files JOIN source=zeek_http ON uid

      | where host in (third_party_services)

      | lookup threat_intel md5 sha1 host resp_ip OUTPUT verdict

      | where verdict="known_bad"

      | alert'
- question: For each monitored third-party service, has the rate of threat-intel matches per 1,000 downloads,
    the rate of blocked/forbidden (HTTP 403/404) or failed transfers, or the downloaded-byte volume deviated
    sharply from its own 30-day rolling baseline?
  context: 'Beyond exact known-bad matches, a rising TI-match rate or a co-occurring spike in failed/blocked
    downloads paired with new destinations is a behavioral signal of an active campaign or of churned,
    probing infrastructure typical of spearphishing-via-service operations. Build per-service baselines
    so a noisy site is not compared against a quiet one: track (a) TI matches per 1,000 downloads, (b)
    HTTP 403/404 and failed transfers per 1,000 requests, and (c) byte volume. Alert when the 1-hour TI-match
    rate exceeds the service''s own 99th percentile, or when failed/blocked downloads spike alongside
    never-before-seen destinations. A positive result indicates a service is being abused at scale; the
    failure-mode signal specifically catches dead/rotated payload hosting before any single hash is confirmed
    bad.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Network Security Monitoring (NSM) sensors at internet egress points; Centralized log aggregator
    (SIEM); Threat intelligence platform.'
  range: Last 90 days; compute per-service 30-day rolling baseline, evaluate in 1-hour windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=zeek_http host IN (third_party_services)

      | bin _time span=1h

      | stats count as reqs, count(eval(status>=400)) as failures, sum(resp_bytes) as bytes, count(eval(ti_match))
      as ti by host, _time

      | eval ti_rate=ti/(reqs/1000)

      | join host [ baseline p99(ti_rate), avg/stdev(failures), avg(bytes) over 30d ]

      | where ti_rate>p99_ti_rate OR (failures>spike AND new_dest)

      | alert'
  - technology: Zeek/pseudocode
    query: 'http.log per host: rolling_30d(p99 ti_match_rate, failure_rate, byte_vol)

      | current_1h > p99 -> alert

      | failure_spike AND dest NOT IN seen_30d -> alert'
- question: Does a supervised classifier scoring downloads from third-party services on Zeek-derived features
    (MIME type, file size, connection duration, ports, byte ratios, domain age/reputation, URL lexical
    features and entropy) flag a download as malicious with probability greater than 0.90?
  context: Novel payloads that evade signature and threat-intel matching can still be caught by their
    feature profile. Train a Random Forest or gradient-boosting model on labeled download telemetry using
    MIME type, file size, connection duration, source/destination ports, downloaded/uploaded byte ratio,
    domain age, domain prevalence/reputation, and URL lexical features (length, token counts, special-character
    ratio, Shannon entropy), and score third-party-service downloads in near real time. Complement file
    scoring with raw-URL CNN scoring (URLNet) for links. Alert above 0.90 probability and surface the
    top-3 SHAP-contributing features so an analyst can immediately understand why (e.g., very new domain
    plus high URL entropy). A high score warrants endpoint inspection of the saved file and the user's
    recent third-party-service activity.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Network Security Monitoring (NSM) sensors at internet egress points; Centralized log aggregator
    (SIEM); Threat intelligence platform.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = extract(zeek_files+http: mime, fsize, duration, ports, dl_ul_ratio, domain_age,
      domain_reputation, url_len, token_count, special_ratio, url_entropy)

      | score = rf_gbm.predict_proba(features)

      | url_score = urlnet_cnn(raw_url)

      | WHERE score>0.90 OR url_score>0.90

      | ALERT include top3 SHAP features'
  - technology: SIEM/Stats pseudocode
    query: 'source=zeek_files host IN (third_party_services)

      | eval p=ml_download_score(features)

      | where p>0.90

      | eval reasons=shap_top3(features)

      | alert'
- question: Within 5 minutes of a download from a third-party service, did a browser, webmail client,
    or office application (winword.exe, excel.exe, acrobat.exe, chrome.exe, msedge.exe, thunderbird, Safari,
    Mail) spawn a command interpreter or scripting engine (powershell.exe, cmd.exe, wscript.exe, mshta.exe,
    bash, zsh, osascript, python)?
  context: Payload execution is the inflection point where delivery becomes compromise. A productivity
    or browser application spawning a shell or scripting engine shortly after a third-party download strongly
    indicates a malicious attachment or script ran. Build a SIEM correlation rule joining a third-party
    download (Zeek http.log host) with a process-creation event (Windows Event ID 4688 / Sysmon 1, auditd
    execve, macOS ESF) on the same host within 5 minutes where a delivery app is the parent ('CreatorProcessName')
    and an interpreter is the child ('NewProcessName'). Layer in LOLBin command-line patterns (mshta with
    a URL argument, certutil -urlcache -split -f, regsvr32 scriptlet). A match is a high-fidelity execution
    alert; absence of a known-bad child does not clear the host, since execution may use a benign-looking
    but anomalous chain caught by the statistical/ML methods.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Endpoint Detection and Response (EDR) agents on user workstations; Virtual Desktop Infrastructure
    (VDI) environment; Centralized Security Information and Event Management (SIEM) system.'
  range: Last 90 days; correlate process events within 5 minutes of the download event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "download = zeek_http where host in (third_party_services)\n| join host, time+/-5m [ source=4688\
      \ OR sysmon1 OR auditd_execve OR macos_esf\n     where CreatorProcessName in (winword.exe,excel.exe,acrobat.exe,chrome.exe,msedge.exe,thunderbird,Safari,Mail)\n\
      \     AND NewProcessName in (powershell.exe,cmd.exe,wscript.exe,mshta.exe,bash,zsh,osascript,python)\
      \ ]\n| match LOLBin_cmdline_patterns(mshta_url, certutil_urlcache, regsvr32_scriptlet)\n| alert\
      \ priority=high"
  - technology: EDR/pseudocode
    query: 'ParentImage IN (browsers,webmail,office) AND ChildImage IN (interpreters)

      | WHERE preceded_by third_party_download within 5m

      | ALERT'
- question: For a given user and parent process, did that parent spawn a never-before-seen child process,
    spawn interpreter children at a rate exceeding 3 standard deviations above the user's norm, or launch
    a powershell.exe whose command-line argument entropy exceeds 3 sigma?
  context: Attackers often reuse the same delivery applications, so deviations from a user's established
    parent/child habits expose malicious execution that signature rules miss. Build a 90-day per-(user,
    parent process) baseline of normally spawned children, the count/day of each parent->child pair, and
    the entropy of child command-line arguments. Alert on a never-before-seen child, on interpreter-child
    counts per hour beyond 3 sigma of the user's norm, or on powershell command-line entropy beyond 3
    sigma (a marker of obfuscated/encoded payloads). Also track process exit status to separate successful
    execution from failed or blocked launches, which is a distinct state signal indicating either a partially
    working payload or an adversary troubleshooting their tooling. A positive result should pivot to the
    full process tree and the originating third-party download.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Endpoint Detection and Response (EDR) agents on user workstations; Virtual Desktop Infrastructure
    (VDI) environment; Centralized Security Information and Event Management (SIEM) system.'
  range: Last 90 days for baseline; evaluate per-hour and per-event
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=process_creation\n| stats baseline by user, parent: set(child), avg/stdev(child_count_per_hour),\
      \ avg/stdev(cmdline_entropy)\n| current event WHERE child NOT IN baseline_set\n   OR interpreter_count_1h\
      \ > avg+3*stdev\n   OR (NewProcessName=powershell.exe AND cmdline_entropy > avg+3*stdev)\n| eval\
      \ exec_state=exit_status\n| alert"
  - technology: EDR/pseudocode
    query: 'for (user,parent): rarity(child), zscore(child_per_hour), zscore(powershell_cmdline_entropy)

      | flag new_child OR z>3 | annotate success_vs_failed(exit_code)'
- question: After a third-party download, does the parent-child-grandchild process chain (with command-line
    tokens) score as a rare causal path via IDF-weighted provenance with Local-Outlier-Factor scoring,
    or does its interpreter command line score as LOLBin abuse?
  context: Sophisticated actors blend into normal activity, so modeling full execution provenance reveals
    stealthy chains that pairwise rules cannot. Model process execution chains (parent-child-grandchild
    plus command-line tokens) and rank the rarest causal paths using IDF-weighted provenance with Local-Outlier-Factor
    scoring (ProvDetector approach); in parallel score interpreter command lines with a LOLBin classifier
    trained via active learning to keep pace with obfuscation. After a third-party download, flag any
    chain rooted in a browser/webmail/office app that scores as a high outlier, and surface the top-3
    contributing path/command features for triage. A high outlier score with a download root is a strong
    execution-of-delivered-payload signal warranting host isolation and memory capture.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Endpoint Detection and Response (EDR) agents on user workstations; Virtual Desktop Infrastructure
    (VDI) environment; Centralized Security Information and Event Management (SIEM) system.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "graph = build_provenance(parent,child,grandchild,cmdline_tokens)\n| path_score = LOF(idf_weighted_paths(graph))\n\
      | lol_score = lolbin_classifier(cmdline)  # active-learning model\n| WHERE root IN (browser,webmail,office)\
      \ AND preceded_by third_party_download\n   AND (path_score high_outlier OR lol_score high)\n| ALERT\
      \ include top3 path/command features"
  - technology: SIEM/Stats pseudocode
    query: 'source=process_creation | provenance_chain by host

      | eval rarity=lof_idf(chain), lol=lolbin_score(cmdline)

      | where rarity>thr OR lol>thr | alert'
- question: Does a file downloaded from a third-party service use a deceptive filename (double extension
    such as invoice.pdf.exe, right-to-left-override U+202E, or a homoglyph/lookalike of an internal brand)
    or carry a high-risk MIME type (application/hta, application/x-msdownload, macro-enabled Office types)?
  context: Spearphishing-via-service lures rely on tricking the user into opening a payload, so deceptive
    naming and dangerous file types are direct evidence of intent. Monitor Zeek files.log for transfers
    whose corresponding http.log host is a third-party service and alert on filenames matching a double-extension/RLO
    regex (e.g., '\.(pdf|docx|xlsx|jpg|png)\.(exe|scr|msi|hta|js|vbs)$' or the U+202E override), on homoglyph/lookalike
    names of internal brands per the typosquatting taxonomy, or on a MIME type from a high-risk blocklist
    (application/hta, application/x-msdownload, macro-enabled Office). A match is a strong pre-execution
    warning that should trigger blocking and user outreach; it is most powerful when combined with the
    post-download interpreter-spawn correlation to confirm whether the lure succeeded.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network Security Monitoring (NSM) sensors at the network perimeter; Web content filters; Centralized
    log aggregator (SIEM).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "files.log JOIN http.log ON uid WHERE host IN third_party_service_list\n| WHERE filename =~\
      \ /\\.(pdf|docx|xlsx|jpg|png)\\.(exe|scr|msi|hta|js|vbs)$/i\n   OR contains(filename, U+202E)\n\
      \   OR homoglyph_lookalike(filename, internal_brands)\n   OR mime_type IN (application/hta, application/x-msdownload,\
      \ macro_office_types)\n| ALERT"
  - technology: SIEM/Rule pseudocode
    query: 'source=zeek_files host in (third_party_services)

      | regex filename double_ext OR rlo OR brand_homoglyph

      | OR mime in (high_risk_blocklist)

      | alert'
- question: For each third-party service, has the proportion of high-risk downloaded file types (.zip,
    .iso, .docm, .hta, .exe) in a 1-hour window exceeded the 98th percentile of its 30-day daily average,
    or has a never-before-seen MIME type appeared for that service?
  context: Each third-party service has a typical mix of file types; an abrupt shift toward dangerous
    types or the sudden appearance of a new type is a campaign indicator even when individual files look
    benign. Build a 30-day per-service baseline of downloaded MIME types and compute the daily proportion
    of high-risk versus benign types and byte volume per type. Alert when the high-risk proportion in
    a 1-hour window exceeds the service's 98th percentile, or when a never-before-seen MIME type appears
    for that service. Deriving thresholds per service avoids drowning the analyst in noise from naturally
    varied platforms. A positive result tells the analyst which service is being weaponized and over what
    window to scope affected hosts.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network Security Monitoring (NSM) sensors at the network perimeter; Web content filters; Centralized
    log aggregator (SIEM).'
  range: Last 90 days; per-service 30-day baseline, 1-hour evaluation windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=zeek_files host IN (third_party_services)

      | bin _time span=1h

      | stats count by host, mime_type, _time

      | eval high_risk = mime_type in (zip,iso,docm,hta,exe)

      | eval hr_prop = sum(high_risk)/count by host,_time

      | join host [ baseline p98(daily hr_prop), set(seen_mime) over 30d ]

      | where hr_prop>p98 OR mime_type NOT IN seen_mime

      | alert'
  - technology: Zeek/pseudocode
    query: 'files.log per service: 30d baseline mime mix + byte_vol

      | 1h high_risk_proportion > p98 -> alert

      | new mime_type for service -> alert'
- question: Does a classifier scoring files from third-party services on metadata (MIME type, declared-vs-true
    extension mismatch, filename length and character entropy, lure keywords like 'invoice'/'urgent'/'resume'/'salary',
    file size, and source-service reputation) flag a file as high-probability malicious?
  context: File metadata captures the social-engineering and obfuscation traits of phishing payloads that
    rigid blocklists miss. Train a classifier on Zeek files.log metadata including MIME type, declared-versus-true
    extension mismatch, filename length, filename character entropy, lure keywords, file size, and source-service
    reputation, then score files arriving from third-party services. Flag high-probability files for review
    and include the top-3 SHAP features (e.g., extension mismatch, high filename entropy) so the analyst
    can judge the verdict quickly. A high score should prompt retrieval and detonation of the file and
    review of the recipient's activity; the explainability output also helps tune which features are driving
    false positives.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Network Security Monitoring (NSM) sensors at the network perimeter; Web content filters; Centralized
    log aggregator (SIEM).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = extract(zeek_files: mime, declared_vs_true_ext_mismatch, filename_len, filename_entropy,
      lure_keyword_flags(invoice,urgent,resume,salary), fsize, service_reputation)

      | p = file_metadata_clf.predict_proba(features)

      | WHERE p>0.90 | ALERT include top3 SHAP features'
  - technology: SIEM/Stats pseudocode
    query: 'source=zeek_files host in (third_party_services)

      | eval p=ml_file_meta_score(features), why=shap_top3(features)

      | where p>0.90 | alert'
- question: Within 5 minutes of a file download from a third-party service, did the same host query DNS
    for a domain registered within the last 30 days, or for a domain within 1-2 edit-distance (Levenshtein/Damerau)
    or a homoglyph/Punycode lookalike of a protected brand?
  context: 'A fresh download followed quickly by a callback to a brand-new or lookalike domain is classic
    payload check-in behavior in initial access. Chain the events deterministically: (1) a host downloads
    from a third-party service (Zeek files.log/http.log); (2) within 5 minutes the same host issues a
    DNS query (Zeek dns.log) for a new domain; (3) enrich with WHOIS for domain age and compare against
    protected-brand lists using Levenshtein/Damerau distance and Punycode/homoglyph decoding; (4) alert
    if the domain is under 30 days old OR within 1-2 edits / a homoglyph of a protected brand. A match
    strongly suggests successful execution reaching attacker infrastructure and should escalate to containment
    and DNS sinkholing; the 5-minute window keeps the causal link tight.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: DNS logs from internal resolvers; Firewall logs from egress points; Network Security Monitoring
    (NSM) sensors; Threat intelligence feeds.'
  range: Last 90 days; correlate DNS within 5 minutes of the download
  queries:
  - technology: Zeek/pseudocode
    query: 'dl = files.log/http.log where host IN third_party_service_list

      | join src_host, time+5m [ dns.log query ]

      | enrich whois(domain_age) AND brand_distance(qname, protected_brands: levenshtein<=2 OR homoglyph
      OR punycode)

      | WHERE domain_age<30d OR brand_distance<=2

      | ALERT priority=high'
  - technology: SIEM/Rule pseudocode
    query: 'download_event THEN dns_query within 5m same host

      | lookup whois age, lookalike(qname, brands)

      | where age<30d OR lookalike

      | alert'
- question: After a third-party download, do subsequent DNS queries from the client show high qname Shannon
    entropy (>3.5) combined with rarity (not in the host/org top 95% of domains over 30 days), or a burst
    of NXDOMAIN responses / connection RST/timeouts to new domains?
  context: 'DGA-style or dead-drop callback domains exhibit high randomness and low prevalence, and probing
    for live infrastructure produces failure bursts. After a third-party download, score the client''s
    DNS queries: compute Shannon entropy and unique-character/label counts of the qname and alert when
    entropy is high (>3.5) and the domain is rare for that host/org. Separately profile failure state,
    since a burst of NXDOMAIN responses or RST/timeouts to new domains is a distinct DGA/dead-drop probing
    signal that merits its own alert. Use passive-DNS prevalence and TTL to gauge newness. A positive
    entropy+rarity hit suggests algorithmically generated C2; a failure burst suggests an adversary cycling
    through candidate domains. Both should pivot to the originating download and host.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: DNS logs from internal resolvers; Firewall logs from egress points; Network Security Monitoring
    (NSM) sensors; Threat intelligence feeds.'
  range: Last 90 days; evaluate DNS following download events
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=zeek_dns following third_party_download by host

      | eval entropy=shannon(qname), labels=unique_char_count(qname)

      | join host [ rare = qname NOT IN top95_domains_30d ]

      | where entropy>3.5 AND rare -> alert

      | timechart NXDOMAIN, RST, timeout to new_domains by host

      | where failure_burst -> alert'
  - technology: Zeek/pseudocode
    query: 'dns.log: entropy(qname)>3.5 AND prevalence_low(passive_dns) -> alert

      | count(NXDOMAIN) to new domains in window > thr -> alert'
- question: After a third-party download, do outbound connections (Zeek conn.log) per (host, destination)
    show C2 cadence -- jitter-robust FFT periodicity, low coefficient of variation of inter-arrival times,
    Bowley skewness, low MAD of payload sizes, or a significant positive byte-volume deviation?
  context: Established C2 channels beacon at regular intervals even when jittered, and modeling timing/volume
    regularity exposes them. After a third-party download, analyze subsequent outbound connections per
    (host, destination) for cadence using jitter-robust FFT periodicity and regularity scoring (coefficient
    of variation of inter-arrival times, Bowley skewness, MAD of payload sizes) plus byte-volume forecasting
    (BAYWATCH/RITA approach). Alert on regular low-jitter callbacks or significant positive volume deviations,
    and surface the top-3 contributing features (period, CV, byte ratio). A positive result strongly indicates
    an active implant reaching command-and-control following the spearphishing payload and should drive
    immediate isolation and network blocking; benign auto-update traffic is the main false-positive source
    and can be whitelisted by destination.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: DNS logs from internal resolvers; Firewall logs from egress points; Network Security Monitoring
    (NSM) sensors; Threat intelligence feeds.'
  range: Last 90 days; analyze connections following download events over multi-hour to multi-day windows
  queries:
  - technology: ML/pseudocode
    query: 'conns = conn.log per (host,dest) after third_party_download

      | period = fft_periodicity(inter_arrival_times)

      | cv = stdev/mean(inter_arrival), skew = bowley(inter_arrival), pmad = MAD(payload_size)

      | vol_dev = forecast_deviation(byte_volume)

      | WHERE (low_jitter_periodic) OR vol_dev significant_positive

      | ALERT include top3 (period, cv, byte_ratio)'
  - technology: SIEM/Stats pseudocode
    query: 'source=zeek_conn by host,dest after download

      | eval beacon_score=periodicity(times), cv=cov(intervals)

      | where beacon_score high AND cv low | alert'
- question: Within a 1-hour window, did more than 10 distinct internal IPs download the same file hash
    (MD5/SHA1) referred by a known third-party service, or did more than 10 distinct internal IPs connect
    to the same new/rare third-party service domain?
  context: A coordinated burst of many hosts pulling the same payload or reaching the same destination
    is a strong campaign indicator, analogous to an unusual shared recipient set in lateral phishing.
    Create a SIEM rule on Zeek files.log for a single file hash downloaded by more than 10 distinct internal
    IPs within 1 hour where the http.log referrer is a known third-party service, OR more than 10 distinct
    internal IPs connecting to the same new/rare service domain in that window. Keep the count threshold
    tunable per environment to balance noise against detection. A positive result indicates a broad spearphishing-via-service
    campaign rather than a single victim and should drive enterprise-wide scoping, blocking of the hash/domain,
    and prioritized triage of all involved hosts.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Centralized logging infrastructure (SIEM); Network traffic monitoring points at the network
    perimeter.'
  range: Last 90 days; 1-hour aggregation windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=zeek_files referrer in (third_party_services)

      | bin _time span=1h

      | stats dc(src_ip) as hosts by md5, _time

      | where hosts>10 -> alert

      | append [ source=zeek_conn dest in new_rare_service_domains | stats dc(src_ip) as hosts by dest,_time
      | where hosts>10 ] -> alert'
  - technology: Zeek/pseudocode
    query: 'files.log: same md5/sha1, distinct_src_ip>10 in 1h, referrer third_party -> alert

      | conn.log: same new/rare service domain, distinct_src_ip>10 in 1h -> alert'
- question: For each monitored third-party service, has the count of unique source IPs connecting per
    hour, or the downloaded-byte volume, exceeded its 30-day rolling baseline by more than 3 standard
    deviations (weighted higher when the destination is itself rare or newly seen)?
  context: Campaign-driven fan-out shows up as an abnormal surge in distinct hosts touching a service
    relative to that service's own history. Build a 30-day rolling baseline per service of unique source
    IPs per hour (moving average + standard deviation) and of downloaded-byte volume, and alert when the
    current-hour unique-source-IP count or volume exceeds the baseline by more than 3 sigma. Weight the
    alert higher when the destination is rare or newly seen, since a surge to a brand-new domain is far
    more suspicious than to an established platform. A positive result indicates coordinated activity
    and should be correlated with the deterministic fan-out rule and the file-hash detections to confirm
    a campaign and scope affected hosts.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Centralized logging infrastructure (SIEM); Network traffic monitoring points at the network
    perimeter.'
  range: Last 90 days; per-service 30-day rolling baseline, hourly evaluation
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=zeek_conn dest IN (third_party_services)

      | bin _time span=1h

      | stats dc(src_ip) as hosts, sum(resp_bytes) as bytes by dest, _time

      | join dest [ baseline avg/stdev(hosts), avg/stdev(bytes) over 30d ]

      | where hosts > avg+3*stdev OR bytes > avg+3*stdev

      | eval weight = if(dest_rare_or_new, high, normal)

      | alert'
  - technology: Zeek/pseudocode
    query: 'per service: rolling_30d(avg,stdev) unique_src_ip_per_hour, byte_vol

      | current_hour > avg+3*stdev -> alert (boost if dest new/rare)'
- question: Does density-based clustering (DBSCAN) over Zeek conn.log features (source IP, destination
    domain, destination port, timestamp, byte volume) reveal a dense cluster of many unique source IPs
    reaching the same new/rare third-party service domain within a short window?
  context: Unsupervised clustering surfaces coordinated campaigns that fixed thresholds miss by grouping
    connections that share destination, timing, and volume characteristics. Run DBSCAN on conn.log features
    (source IP, destination domain, destination port, timestamp, byte volume); a dense cluster of many
    unique source IPs reaching the same new/rare third-party service domain in a short window is flagged
    as a coordinated campaign. Complement with click-reputation and recipient-graph features borrowed
    from lateral-phishing detection, and surface the top-3 cluster-defining features for triage. A flagged
    cluster indicates many endpoints converging on the same attacker-controlled or abused destination
    and should be scoped enterprise-wide, with the shared destination blocked and the involved hosts prioritized
    for inspection.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Centralized logging infrastructure (SIEM); Network traffic monitoring points at the network
    perimeter.'
  range: Last 90 days; cluster over short (sub-day) windows
  queries:
  - technology: ML/pseudocode
    query: 'X = conn.log features [src_ip, dest_domain, dest_port, ts, byte_vol]

      | clusters = DBSCAN(X, eps, min_samples)

      | FOR cluster WHERE dc(src_ip) large AND dest new/rare AND time_span short

      | enrich click_reputation, recipient_graph_features

      | ALERT include top3 cluster-defining features'
  - technology: SIEM/Stats pseudocode
    query: 'source=zeek_conn | cluster=dbscan(src_ip,dest,port,ts,bytes)

      | where cluster_density high AND dest_new_rare | alert top3 features'
