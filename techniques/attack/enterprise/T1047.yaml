      \ priv, host_role, tod]\n  p = rf.predict_proba(feats)\n  if p>0.85: alert(event, shap_top3(feats))"
- question: When a transformer scores multi-step execution chains originating from non-allowlisted WMI
    parents (e.g., WINWORD -> wmic -> cmd -> mshta), do any match attack patterns (macro execution, exploit
    chain, lateral movement) with confidence above 0.85?
  context: 'Many WMI intrusions manifest as multi-step chains (parent -> child -> grandchild) rather than
    single events. Training a transformer on these chains from Sysmon EID 1 and scoring new chains that
    begin at non-allowlisted WMI parents lets the SOC classify them against attack patterns such as macro
    execution, exploit chains, and lateral movement, alerting above 0.85 confidence. Outputting the chain
    visualization and contributing tokens makes the verdict actionable. This captures the sequential semantics
    of execution that point detections miss. References: [LogBERT, IJCNN 2021](https://arxiv.org/abs/2103.04475)
    [DeepCASE, IEEE S&P 2022](https://vm-thijs.ewi.utwente.nl/static/papers/2022/vanede-sp22.pdf).'
