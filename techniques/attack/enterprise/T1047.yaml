questions:
- question: Do any wmic.exe process command lines (Event ID 4688) or PowerShell script blocks (Event ID
    4104) contain known-malicious WMI patterns such as 'wmic shadowcopy delete', 'wmic process call create',
    'wmic /node:', '/format:', 'Invoke-WmiMethod', 'Get-WmiObject -Class Win32_Process', or encoded PowerShell
    flags?
  context: 'Adversaries frequently invoke WMI through wmic.exe or PowerShell cmdlets to run recon, execute
    payloads remotely, establish persistence, or stage ransomware. Scanning command lines and script blocks
    against a curated list of known-bad WMI strings is the fastest, highest-fidelity way to catch this
    Execution activity. A positive match (e.g., ''wmic shadowcopy delete'' or ''wmic /node: process call
    create'') strongly indicates malicious use; benign administrative use rarely contains shadowcopy deletion,
    remote /node: execution, or encoded commands. Use SigmaHQ baselines proc_creation_win_wmic_recon.yml,
    proc_creation_win_wmic_uninstall_security_products.yml, and proc_creation_win_wmic_xsl_script_abuse.yml.
    Triage hits by user, host role, and parent process. References: [SigmaHQ Detection Rules](https://github.com/SigmaHQ/sigma)
    [Graeber - Abusing WMI Black Hat 2015](https://www.blackhat.com/docs/us-15/materials/us-15-Graeber-Abusing-Windows-Management-Instrumentation-WMI-To-Build-A-Persistent%20Asynchronous-And-Fileless-Backdoor-wp.pdf)
    [Mandiant - WMI vs WMI](https://www.mandiant.com/resources/blog/wmi-vs-wmi-monitoring-malicious-hacker-tools).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows PowerShell Event ID 4103
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (WinEventLog:Security EventCode=4688, WinEventLog:Microsoft-Windows-PowerShell/Operational\
      \ EventCode IN (4104,4103))\n  | eval cl=lower(CommandLine.ScriptBlockText)\n  | where match(cl,\
      \ \"wmic.*shadowcopy +delete|wmic +process +call +create|wmic +os +get|wmic +/node:|wmic.*/format:|invoke-wmimethod|get-wmiobject\
      \ +-class +win32_process|set-wmiinstance +-class +(__eventfilter|__filtertoconsumerbinding)|-e(n|nc|ncodedcommand)?\
      \ +|/format:.http\")\n  | table _time host user ParentImage Image cl"
- question: Is wmic.exe being invoked with /FORMAT pointing to a remote URL or local script file (XSL
    stylesheet abuse) or with -mof loading a custom MOF file to achieve fileless code execution?
  context: 'The wmic /FORMAT switch can load an XSL stylesheet that hosts JScript/VBScript, enabling fileless,
    script-host code execution that evades application allowlisting; loading a custom MOF (-mof) can register
    WMI providers or consumers. These are squarely Execution and defense-evasion behaviors. Any wmic /FORMAT
    pointing at http(s):// or a writable local script path, or a -mof flag, should be treated as suspicious
    because legitimate administration almost never uses these. Capture the URL/file path, the user, and
    the parent process for triage. References: [SigmaHQ/sigma](https://github.com/SigmaHQ/sigma) [Mandiant
    - WMI vs WMI](https://www.mandiant.com/resources/blog/wmi-vs-wmi-monitoring-malicious-hacker-tools).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows PowerShell Event ID 4103
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  WinEventLog:Security EventCode=4688 Image=*wmic.exe*\n  | eval cl=lower(CommandLine)\n\
      \  | where match(cl, \"/format:(\\\"|')?(http|https|ftp)://\") OR match(cl, \"/format:[a-z]:\\\\\
      \\\\.*\\\\.(xsl|xslt)\") OR match(cl, \" -mof \")\n  | table _time host user ParentImage CommandLine"
- question: Is wmic.exe invoked with /node:<remote_host> together with 'process call create', or with
    /node:@<filelist> for mass remote execution, indicating lateral-movement WMI execution?
  context: 'Remote WMI execution via wmic /node:<host> process call create is a classic lateral-movement
    and remote-execution pattern; /node:@filelist enables fan-out execution across many hosts at once.
    This is high signal for the Execution tactic when paired with lateral movement. Capture the invoking
    user, the source host, all target hosts (the /node: argument), and the exact command being launched.
    A non-admin account or an unexpected source host running this is highly suspicious. References: [Mandiant
    - WMI vs WMI](https://www.mandiant.com/resources/blog/wmi-vs-wmi-monitoring-malicious-hacker-tools)
    [SigmaHQ/sigma](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows PowerShell Event ID 4103
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  WinEventLog:Security EventCode=4688 Image=*wmic.exe*\n  | eval cl=lower(CommandLine)\n\
      \  | where match(cl, \"/node:\") AND (match(cl, \"process +call +create\") OR match(cl, \"/node:@\"\
      ))\n  | rex field=CommandLine \"/node:(?<targets>[^ ]+)\"\n  | table _time host user ParentImage\
      \ targets CommandLine"
- question: When measured against each host's own 30-day baseline, do any wmic.exe or PowerShell-WMI command
    lines exhibit anomalously high Shannon entropy, length, or non-alphanumeric character ratio indicative
    of obfuscation?
  context: 'Obfuscated or encoded WMI commands evade simple string matching, but obfuscation raises measurable
    command-line entropy, length, and the proportion of non-alphanumeric characters. By baselining per
    host over 30 days and alerting on commands above the 95th percentile or >3 sigma above the host mean
    (with a minimum of ~50 wmic events to establish baseline), the analyst catches novel obfuscation without
    prior signatures. A non-alphanumeric ratio above 0.4 is strongly indicative of obfuscation. A positive
    result warrants decoding the command and inspecting the resulting intent. References: [ProvDetector,
    NDSS 2020](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf) [Red Canary
    - WMI](https://redcanary.com/threat-detection-report/techniques/wmi/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows PowerShell Event ID 4103
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  WinEventLog:Security EventCode=4688 (Image=*wmic.exe* OR CommandLine=*WmiObject* OR\
      \ CommandLine=*WmiMethod*)\n  | eval ent=shannon_entropy(CommandLine), len=len(CommandLine), nonalnum=ratio_nonalnum(CommandLine)\n\
      \  | eventstats count as n, avg(ent) as mu, stdev(ent) as sd, perc95(ent) as p95 by host\n  | where\
      \ n>=50 AND (ent>p95 OR ent>mu+3*sd OR nonalnum>0.4)\n  | table _time host user ent len nonalnum\
      \ CommandLine"
- question: Has a user or host generated wmic.exe executions that are abnormal for them, such as a non-admin
    user running WMI for the first time, or a daily count exceeding 4 sigma above their 30-day mean?
  context: 'Account compromise often surfaces as a user suddenly using tooling they have never used before.
    Tracking per-user and per-host daily wmic.exe counts and alerting when a non-admin user runs WMI on
    a day with no prior history, or when daily volume spikes >4 sigma above their 30-day mean, surfaces
    both first-time abuse and burst activity (e.g., mass remote execution). A positive result is most
    concerning for standard users and for hosts that normally see no WMI usage. References: [Red Canary
    - WMI](https://redcanary.com/threat-detection-report/techniques/wmi/) [ProvDetector, NDSS 2020](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows PowerShell Event ID 4103
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  WinEventLog:Security EventCode=4688 Image=*wmic.exe*\n  | bin _time span=1d | stats\
      \ count as daily by user host _time\n  | eventstats avg(daily) as mu, stdev(daily) as sd, count\
      \ as days, sum(eval(daily>0)) as active_days by user\n  | where (days<=1) OR daily>mu+4*sd\n  |\
      \ table _time user host daily mu sd"
- question: When WMI-related command lines are scored by a logistic regression / XGBoost classifier on
    features like length, entropy, recon keywords, and known-bad strings, do any exceed a malicious-probability
    threshold of 0.85?
  context: 'A supervised classifier generalizes beyond static signatures by learning the statistical fingerprint
    of malicious WMI commands (length, character-class distribution, entropy, recon keywords such as process/os/service/qfe/useraccount,
    execution keywords Create/Invoke/call, and known-bad strings like shadowcopy or vssadmin disable).
    Alerting on probability >0.85 and presenting SHAP top-3 features gives the analyst an explainable
    verdict. Retrain monthly using Atomic Red Team T1047 atomics to keep pace with new tradecraft. A positive
    result should be triaged by inspecting the contributing features and decoding the command. References:
    [ShadeWatcher, USENIX Security 2022](https://www.usenix.org/conference/usenixsecurity22/presentation/zeng)
    [CADE, USENIX Security 2021](https://www.usenix.org/conference/usenixsecurity21/presentation/yang-limin).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows PowerShell Event ID 4103
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = extract(cmdline): [len, entropy, char_class_dist, recon_kw_count, exec_kw_count,\
      \ knownbad_flag]\n  p = model.predict_proba(features)\n  if p > 0.85: alert(host, user, cmdline,\
      \ shap_top3(features))"
- question: When a fine-tuned DistilBERT intent classifier scores new wmic/PowerShell-WMI commands, does
    any command receive a malicious-class probability above 0.85, and what intent category (recon, lateral
    movement, persistence, defense evasion, ransomware staging) does it predict?
  context: 'A transformer-based intent classifier trained on labeled benign-vs-malicious WMI commands
    captures token-level semantics that hand-written rules miss, and crucially outputs a predicted intent
    category plus the top contributing tokens — turning a raw alert into actionable triage. This directly
    supports the Execution tactic by distinguishing routine administrative WMI from recon, lateral movement,
    persistence, defense evasion, or ransomware staging. Alert on malicious-class probability >0.85 and
    route by predicted intent. References: [LogBERT, IJCNN 2021](https://arxiv.org/abs/2103.04475) [DeepCASE,
    IEEE S&P 2022](https://vm-thijs.ewi.utwente.nl/static/papers/2022/vanede-sp22.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows PowerShell Event ID 4103
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  tokens = tokenize(cmdline)\n  logits = distilbert_wmi.forward(tokens)\n  p_mal, intent\
      \ = softmax(logits).max_malicious()\n  if p_mal > 0.85: alert(host, user, cmdline, intent, top_tokens(tokens))"
- question: 'Does the host provenance graph (kernel audit + Sysmon EID 1/3) contain any subgraph matching
    a known WMI TTP chain, such as a non-admin parent spawning wmic.exe /node: followed by a remote process
    spawn and outbound connection?'
  context: 'POIROT-style graph-pattern hunting encodes known WMI attack chains as query graphs and performs
    inexact subgraph matching against the host''s provenance graph on a rolling 1-hour window. This catches
    multi-step Execution chains (e.g., powershell.exe -> Invoke-WmiMethod Win32_Process Create -> wmiprvse.exe
    -> cmd.exe) even when individual steps look benign. A match should output the full matched subgraph
    — processes, time deltas, and command lines — giving the analyst an immediate kill-chain view. References:
    [POIROT, ACM CCS 2019](https://dl.acm.org/doi/10.1145/3319535.3363217).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows PowerShell Event ID 4103
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days (1-hour rolling correlation windows)
  queries:
  - technology: Graph/pseudocode
    query: ">-\n  Q = querygraph(parent[non-admin] -> wmic.exe[/node:] -> remote_proc_spawn -> outbound_conn)\n\
      \  Q2 = querygraph(powershell.exe -> Invoke-WmiMethod Win32_Process Create -> wmiprvse.exe -> cmd.exe)\n\
      \  for window in rolling(1h, provenance_graph):\n    for m in inexact_match(window, [Q, Q2]):\n\
      \      alert(subgraph=m, processes=m.nodes, deltas=m.times, cmdlines=m.cmds)"
- question: When HOLMES-style TTP tagging is applied to Sysmon EID 1/3 streams, does any aggregate APT-stage
    score cross the alerting threshold, with WMI execution entities (e.g., non-admin wmic.exe /node:)
    contributing high T1047/T1021 weight?
  context: 'HOLMES maps each (parent, child, command) tuple to MITRE ATT&CK TTP probabilities and builds
    a scenario graph; a non-admin user spawning wmic.exe with /node: earns high T1047/T1021 weight, and
    downstream cmd.exe earns execution-stage weight. When the aggregate APT-stage score exceeds threshold,
    the alert fires. Per the explainability principle, the alert MUST list the contributing TTP-tagged
    entities and the time-ordered chain so the analyst can validate the verdict rather than trust a black
    box. This ties individual WMI events into a coherent intrusion narrative. References: [HOLMES, IEEE
    S&P 2019](https://arxiv.org/abs/1810.01594).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows PowerShell Event ID 4103
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  for tuple(parent, child, cmd) in sysmon_eid1_3:\n    ttp = ttp_tagger(tuple)   # e.g.,\
      \ T1047, T1021, execution-stage weights\n    scenario.add(tuple, ttp)\n  if scenario.apt_stage_score()\
      \ > threshold:\n    alert(entities=scenario.contributing_ttp_entities(), chain=scenario.time_ordered())"
- question: Does the WMI-Activity/Operational log (Event ID 5861, and 5859 for registrations) show creation
    of a __FilterToConsumerBinding linking an __EventFilter to ActiveScriptEventConsumer, CommandLineEventConsumer,
    or LogFileEventConsumer?
  context: 'Permanent WMI event subscriptions are a stealthy, fileless persistence mechanism: an __EventFilter
    (a WQL trigger) bound via __FilterToConsumerBinding to a script or command consumer runs adversary
    code automatically when the trigger fires. Event ID 5861 records binding creation and 5859 records
    permanent subscription registration. Capture the filter''s WQL Query (e.g., SELECT * FROM __InstanceModificationEvent
    WITHIN 60 WHERE ...), the consumer command/script, and the originating user. Permanent subscriptions
    are rare in normal operations, so any creation outside configuration-management windows warrants immediate
    review. Use SigmaHQ wmi_event_subscription_persistence.yml. References: [Mandiant WMI Persistence](https://www.mandiant.com/resources/blog/wmi-vs-wmi-monitoring-malicious-hacker-tools)
    [Graeber - Abusing WMI Black Hat 2015](https://www.blackhat.com/docs/us-15/materials/us-15-Graeber-Abusing-Windows-Management-Instrumentation-WMI-To-Build-A-Persistent%20Asynchronous-And-Fileless-Backdoor-wp.pdf)
    [Mandiant - WMI vs WMI](https://www.mandiant.com/resources/blog/wmi-vs-wmi-monitoring-malicious-hacker-tools).'
  answer_sources:
  - Windows Event ID 5861
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  WinEventLog:Microsoft-Windows-WMI-Activity/Operational EventCode IN (5859,5861)\n  |\
      \ search Consumer IN (\"ActiveScriptEventConsumer\",\"CommandLineEventConsumer\",\"LogFileEventConsumer\"\
      ) OR Operation=\"__FilterToConsumerBinding\"\n  | table _time host user FilterQuery Consumer ConsumerCommand"
- question: 'Is Win32_Process.Create being invoked via ''wmic process call create'' or PowerShell ''Invoke-WmiMethod
    -Class Win32_Process -Name Create'', especially with /node: indicating remote execution?'
  context: 'Win32_Process.Create is the primary WMI method for launching arbitrary processes locally or
    remotely — the core of WMI-based Execution and lateral movement. Detecting it via Event ID 4688/5857
    or Sysmon EID 1, particularly when paired with /node:<host>, surfaces both local payload execution
    and remote command execution. Capture the target host, user, full command, and parent process. Remote
    invocation by a non-admin or from an unexpected source is high signal. References: [Mandiant - WMI
    vs WMI](https://www.mandiant.com/resources/blog/wmi-vs-wmi-monitoring-malicious-hacker-tools) [SigmaHQ/sigma](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 5861
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (WinEventLog:Security EventCode=4688) OR (WinEventLog:Microsoft-Windows-WMI-Activity\
      \ EventCode=5857)\n  | eval cl=lower(CommandLine)\n  | where match(cl, \"process +call +create\"\
      ) OR match(cl, \"invoke-wmimethod.*-class +win32_process.*-name +create\")\n  | eval remote=if(match(cl,\"\
      /node:\"),\"yes\",\"no\")\n  | table _time host user remote ParentImage CommandLine"
- question: Is shadow copy deletion being performed via WMI, e.g. 'wmic shadowcopy delete', 'wmic.exe
    shadowcopy call delete', or 'Get-WmiObject Win32_ShadowCopy | %{ $_.Delete() }'?
  context: 'Deleting Volume Shadow Copies via WMI is a near-universal pre-encryption step in ransomware
    operations, removing the victim''s ability to recover files. Because legitimate administration almost
    never deletes shadow copies through WMI, any such command should be treated as critical severity,
    even on admin workstations. Use SigmaHQ proc_creation_win_wmic_delete_shadowcopy.yml. A positive result
    should trigger immediate containment investigation, as it often immediately precedes encryption. References:
    [SigmaHQ/sigma](https://github.com/SigmaHQ/sigma) [Mandiant - WMI vs WMI](https://www.mandiant.com/resources/blog/wmi-vs-wmi-monitoring-malicious-hacker-tools).'
  answer_sources:
  - Windows Event ID 5861
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (WinEventLog:Security EventCode=4688, WinEventLog:Microsoft-Windows-PowerShell/Operational\
      \ EventCode=4104)\n  | eval cl=lower(CommandLine.ScriptBlockText)\n  | where match(cl, \"shadowcopy\
      \ +(call +)?delete\") OR match(cl, \"win32_shadowcopy.*\\\\.delete\\\\(\\\\)\")\n  | table _time\
      \ host user ParentImage cl   | eval severity=\"critical\""
- question: Is there access to sensitive WMI namespaces such as root\subscription (persistence), root\directory\LDAP
    (AD enumeration), root\SecurityCenter2 (AV state), or root\default (system operations)?
  context: 'Different WMI namespaces serve different adversary goals: root\subscription hosts permanent
    event-subscription persistence, root\directory\LDAP enables Active Directory enumeration (Discovery),
    root\SecurityCenter/SecurityCenter2 reveals installed AV for defense-evasion planning, and root\default
    supports general system operations. Monitoring namespace access and capturing the connecting user,
    source host, and namespace surfaces reconnaissance and persistence setup that precede or accompany
    Execution. Access to root\subscription or root\SecurityCenter2 from non-admin or unexpected sources
    is especially notable. References: [Graeber - Abusing WMI Black Hat 2015](https://www.blackhat.com/docs/us-15/materials/us-15-Graeber-Abusing-Windows-Management-Instrumentation-WMI-To-Build-A-Persistent%20Asynchronous-And-Fileless-Backdoor-wp.pdf)
    [Mandiant - WMI vs WMI](https://www.mandiant.com/resources/blog/wmi-vs-wmi-monitoring-malicious-hacker-tools).'
  answer_sources:
  - Windows Event ID 5861
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  WinEventLog:Microsoft-Windows-WMI-Activity/Operational\n  | eval ns=lower(NamespaceName)\n\
      \  | where ns IN (\"root\\\\subscription\",\"root\\\\directory\\\\ldap\",\"root\\\\securitycenter\"\
      ,\"root\\\\securitycenter2\",\"root\\\\default\")\n  | table _time host user SourceHost ns"
- question: Against a 30-day per-host/user baseline of (WMI class, method) pairs, do any invocations fall
    in the bottom 1st percentile or appear on fewer than 0.5% of endpoints, especially write methods (Create,
    Delete, Set)?
  context: 'Most hosts use a small, stable set of WMI class/method pairs. Baselining (class, method) frequency
    per host/user from Event ID 5857/5858/5860/5861 over 30 days and flagging the rarest 1% — or pairs
    appearing on <0.5% of endpoints — surfaces unusual WMI activity without prior signatures. Write methods
    (Create, Delete, Set) are especially significant because they change system state (process creation,
    shadow-copy deletion, instance modification). Apply a minimum of ~100 WMI events per host to avoid
    noisy baselines. References: [ProvDetector, NDSS 2020](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf)
    [Red Canary - WMI](https://redcanary.com/threat-detection-report/techniques/wmi/).'
  answer_sources:
  - Windows Event ID 5861
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  WinEventLog:Microsoft-Windows-WMI-Activity EventCode IN (5857,5858,5860,5861)\n  | eval\
      \ cm=Class.\":\".Method\n  | eventstats count as host_n by host\n  | stats count as cnt, dc(host)\
      \ as hosts by cm host host_n\n  | where host_n>=100 AND (cnt<=perc1(cnt) OR hosts < 0.005*total_hosts)\
      \ AND match(Method,\"Create|Delete|Set\")\n  | table _time host user cm cnt hosts"
- question: Has the count of permanent WMI event subscriptions on any host grown (new subscriptions added)
    outside documented configuration-management push windows?
  context: 'Permanent WMI event subscriptions are rare and generally static in normal operations. Maintaining
    a per-host count over time and alerting on any non-zero growth outside approved configuration-management
    change windows provides a high-fidelity persistence detection. Because adversaries use these subscriptions
    for stealthy, reboot-surviving persistence, any unexplained increase warrants immediate review of
    the new filter/consumer binding and its originating user. References: [Red Canary - WMI](https://redcanary.com/threat-detection-report/techniques/wmi/)
    [ProvDetector, NDSS 2020](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
