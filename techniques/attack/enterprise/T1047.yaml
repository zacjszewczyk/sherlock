- question: Are wmic.exe, WMI-cmdlet PowerShell, or wmiprvse.exe child processes launched by a parent
    outside the approved allowlist — critically by document handlers (winword.exe, excel.exe, powerpnt.exe,
    outlook.exe, acrord32.exe) or browsers (chrome.exe, firefox.exe, msedge.exe, iexplore.exe)?
  context: 'Legitimate WMI invocation comes from a small set of parents: interactive cmd.exe, explorer.exe,
    the WinMgmt service host (svchost.exe), Computer Management (mmc.exe), gpupdate.exe, and config-management
    agents. When a document handler or browser spawns wmic.exe or WMI PowerShell, it almost always means
    a malicious document or exploit launched WMI — a classic initial-access-to-execution pivot. Alert
    on any non-allowlisted parent and rate document/browser parents critical. Use SigmaHQ proc_creation_win_office_spawn_wmic.yml.
    Capture the parent, child command line, and user. References: [SigmaHQ/sigma](https://github.com/SigmaHQ/sigma)
    [Mandiant - WMI vs WMI](https://www.mandiant.com/resources/blog/wmi-vs-wmi-monitoring-malicious-hacker-tools).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (WinEventLog:Security EventCode=4688, sysmon EID=1)\n  | where (Image=*wmic.exe*\
      \ OR Image=*wmiprvse.exe* OR (Image=*powershell.exe* AND match(CommandLine,\"wmi\")))\n  | where\
      \ ParentImage NOT IN allowlist(cmd.exe,explorer.exe,svchost.exe,services.exe,mmc.exe,gpupdate.exe,ccmexec.exe)\n\
      \  | eval sev=if(ParentImage IN (winword.exe,excel.exe,powerpnt.exe,outlook.exe,acrord32.exe,chrome.exe,firefox.exe,msedge.exe,iexplore.exe),\"\
      critical\",\"high\")\n  | table _time host user ParentImage Image CommandLine sev"
- question: Does an Office macro (Sysmon EID 1 child of WINWORD.EXE/EXCEL.EXE) directly spawn wmic.exe
    or WMI PowerShell, or does an EQNEDT32.EXE / msdt.exe child invoke WMI?
  context: 'Macro-borne malware and exploit chains (e.g., Equation Editor EQNEDT32.EXE, Follina msdt.exe)
    commonly pivot to WMI for execution. Detecting an Office application or these exploit binaries directly
    spawning wmic.exe or WMI PowerShell catches the initial-access-to-execution transition. Where possible,
    capture the source document filename (via osquery open file handles on the parent) and the WMI command
    for triage. A positive result strongly indicates a weaponized document and should trigger host isolation
    and user follow-up. References: [SigmaHQ/sigma](https://github.com/SigmaHQ/sigma) [Red Canary - WMI](https://redcanary.com/threat-detection-report/techniques/wmi/).'
