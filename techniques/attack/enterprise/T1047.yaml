- question: When a transformer/LSTM scores remote-WMI multi-event sequences (4624 Logon Type 3 -> wmiprvse.exe
    spawn -> child process -> network/file write), do any match lateral-movement patterns (Impacket wmiexec,
    Cobalt Strike WMI beacon) with confidence above 0.85?
  context: 'Remote WMI lateral movement unfolds as a recognizable event sequence: network logon, WMI Provider
    Host spawning a child, the child running a command, and a follow-on network connection or file write.
    Training a transformer or LSTM on these sequences lets the SOC classify new sequences against known
    tool signatures (Impacket wmiexec, Cobalt Strike WMI beacon spawn) and alert above 0.85 confidence.
    Sequence modeling captures order and timing that point-in-time rules miss, improving precision on
    the Execution/lateral-movement boundary. References: [DeepLog, ACM CCS 2017](https://acmccs.github.io/papers/p1285-duA.pdf)
    [ATLAS, USENIX Security 2021](https://www.usenix.org/conference/usenixsecurity21/presentation/alsaheel).'
