- question: When a deterministic rule in this evidence block fires, does ATLAS sequence-expansion from
    that seed recover a coherent attack story (processes, files, sockets, registry, accounts) for one-click
    kill-chain reconstruction?
  context: 'Deterministic rules give a precise seed but limited context. ATLAS uses an LSTM-based sequence-expansion
    model to grow forward and backward through the causal provenance graph from a seed alert (e.g., the
    remote-logon-to-WMI correlation), recovering ~91% of attack-related entities into a compact attack
    story roughly 200x smaller than the raw provenance. The recovered story becomes the alert payload,
    giving the analyst an immediate, readable kill chain instead of a single event. This dramatically
    accelerates triage and scoping of WMI-based intrusions. References: [ATLAS, USENIX Security 2021](https://www.usenix.org/conference/usenixsecurity21/presentation/alsaheel).'
