- question: Are there Zeek conn.log connections to TCP/135 (DCOM/RPC endpoint mapper), TCP/5985 (WinRM
    HTTP), TCP/5986 (WinRM HTTPS), or dynamic-RPC ports between host pairs not on the approved jump-host
    -> management-target allowlist (especially workstation-to-workstation)?
  context: 'WMI executes remotely over DCOM (TCP/135 plus a negotiated dynamic RPC port) or WinRM (TCP/5985/5986).
    In a well-managed environment, this traffic flows only from designated jump hosts to management targets.
    Connections outside that allowlist — particularly workstation-to-workstation — are strong indicators
    of lateral movement and should be rated critical. Cross-reference Zeek dce_rpc.log to confirm the
    IWbemServices interface (UUID 9556dc99-828c-11cf-a37e-00aa003240c7) is invoked, which distinguishes
    WMI from other RPC over the same ports. References: [Mandiant - WMI vs WMI](https://www.mandiant.com/resources/blog/wmi-vs-wmi-monitoring-malicious-hacker-tools)
    [Impacket - fortra](https://github.com/fortra/impacket).'
