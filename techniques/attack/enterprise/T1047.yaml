- question: Does a web server process (w3wp.exe, httpd.exe, php-cgi.exe, java/tomcat) spawn wmic.exe or
    a WMI PowerShell invocation, indicating a web shell pivoting to WMI execution?
  context: 'A web server process spawning WMI is a strong web-shell indicator: an attacker who has planted
    a web shell uses the server''s worker process to run WMI for execution or lateral movement. Detecting
    w3wp.exe/httpd.exe/php-cgi.exe/Tomcat as the parent of wmic.exe or WMI PowerShell, and cross-referencing
    Zeek http.log for the originating request, ties the host-side execution to the inbound HTTP exploitation.
    A positive result should trigger web-shell hunting on the affected server and review of the originating
    client. References: [SigmaHQ/sigma](https://github.com/SigmaHQ/sigma) [Red Canary - WMI](https://redcanary.com/threat-detection-report/techniques/wmi/).'
