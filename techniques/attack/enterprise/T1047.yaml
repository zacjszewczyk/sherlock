    for anomaly and, for flagged windows, emit a compact summary subgraph containing only the entities/edges
    relevant to the WMI lateral-movement stage. Flagging windows above the 99th percentile of a 30-day
    benign baseline and using the summary subgraph as the alert payload gives the analyst an analyst-readable
    kill-chain visualization rather than raw event noise. This unifies host and network telemetry into
    a single, explainable scenario for WMI execution and lateral movement. References: [KAIROS, IEEE S&P
    2024](https://arxiv.org/abs/2308.05034).'
