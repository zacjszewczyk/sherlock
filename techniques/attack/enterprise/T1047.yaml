  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (EventCode=4688, sysmon EID=1) Image=*wmic.exe*\n  | stats count as pc by\
      \ role ParentImage Image\n  | eventstats sum(pc) as parent_total by role ParentImage, sum(pc) as\
      \ role_total by role\n  | eval p = pc/role_total\n  | where role_total>=100 AND p<0.0001 AND not\
      \ seen_in_baseline(ParentImage,Image)\n  | table role ParentImage Image pc p"
- question: For each user, does a WMI session have a parent process not in their 30-day baseline, or has
    the entropy of their WMI parent-process distribution increased significantly (KL divergence >0.5 from
    baseline)?
  context: 'Profiling per-user the distribution of parent processes that launch wmic.exe over 30 days
    establishes each user''s normal WMI invocation surface. Alerting when a user''s WMI session has a
    never-before-seen parent, or when the Kullback-Leibler divergence of their parent distribution exceeds
    0.5 versus baseline, surfaces a broadening attack surface — an account being used to launch WMI from
    new and varied parents (a sign of compromise or tooling change). A positive result warrants reviewing
    what new parents appeared and why. References: [Red Canary - WMI](https://redcanary.com/threat-detection-report/techniques/wmi/)
    [ProvDetector, NDSS 2020](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (EventCode=4688, sysmon EID=1) Image=*wmic.exe*\n  | stats count by user ParentImage\n\
      \  | eval dist=normalize(count) by user\n  | eval kl=kl_divergence(dist_today, dist_baseline) by\
      \ user\n  | where ParentImage NOT IN baseline_parents(user) OR kl>0.5\n  | table user ParentImage\
      \ kl"
- question: 'When a Random Forest scores wmic.exe / WMI-PowerShell parent-child events (features: parent
    image, path rarity, signer, child command tokens, integrity level, privilege, host role, time-of-day),
    are any labeled malicious with confidence above 0.85?'
  context: 'A Random Forest trained on labeled parent-child process events learns multi-feature combinations
    distinguishing benign administrative WMI from malicious launches — including parent image, path rarity,
    code-signing status, child command-line tokens, integrity level, user privilege, host role, and time-of-day.
    Escalating events labeled malicious with >0.85 confidence, with SHAP top-3 features for explainability,
    gives the analyst a defensible, feature-grounded verdict. This generalizes beyond fixed parent allowlists
    and catches subtle anomalies. References: [ShadeWatcher, USENIX Security 2022](https://www.usenix.org/conference/usenixsecurity22/presentation/zeng)
    [CADE, USENIX Security 2021](https://www.usenix.org/conference/usenixsecurity21/presentation/yang-limin).'
