- question: When historical remote WMI sessions are clustered (DBSCAN/k-means on source geo/ASN, destination
    role, account role, time-of-day, command class), are any new sessions classified as noise or with
    low cluster-assignment confidence?
  context: 'Clustering remote WMI sessions on features like source geolocation/ASN, destination hostname/role,
    account role, time-of-day, and command class learns the natural groupings of legitimate activity.
    New sessions that DBSCAN labels as noise — or that have low cluster-assignment confidence — are high-confidence
    anomalies that don''t fit any normal behavior pattern. Outputting the closest cluster centroid and
    the feature deltas tells the analyst exactly how the session deviates. This catches novel lateral-movement
    tradecraft that signatures miss. References: [DeepCASE, IEEE S&P 2022](https://vm-thijs.ewi.utwente.nl/static/papers/2022/vanede-sp22.pdf)
    [ProvDetector, NDSS 2020](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
