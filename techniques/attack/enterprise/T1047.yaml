      \ chain)\n  label, conf = transformer.predict(chain)\n  if label in (\"macro_exec\",\"exploit_chain\"\
      ,\"lateral_movement\") and conf>0.85:\n    alert(chain_viz(chain), contributing_tokens(chain))"
- question: When ShadeWatcher's GNN scores (parent_image, child_image, child_command_class) interactions
    against a 30-day enterprise Knowledge Graph, do any (parent, child=wmic.exe) interactions score below
    the 5th percentile of expected interactions for that parent's neighborhood?
  context: 'ShadeWatcher frames detection as recommendation: it builds a Knowledge Graph of observed (parent,
    child, command-class) interactions enterprise-wide and trains a GNN to predict how ''expected'' each
    interaction is. A (parent, child=wmic.exe) interaction scoring below the 5th percentile of expected
    interactions for that parent''s typical neighborhood is a strong outlier — for example, (winword.exe,
    wmic.exe). Reported precision/recall on DARPA TC E3 (99.3%/95.7%) makes this directly applicable to
    flagging anomalous WMI parents. A positive result is a highly improbable parent-WMI interaction. References:
    [ShadeWatcher, USENIX Security 2022](https://www.usenix.org/conference/usenixsecurity22/presentation/zeng).'
  answer_sources:
