    query: ">-\n  KG = knowledge_graph(parent_image, child_image, child_cmd_class, window=30d)\n  score\
      \ = shadewatcher_gnn.recommend(parent, child=\"wmic.exe\")\n  if score < p5(expected_for_neighborhood(parent)):\
      \ alert(parent, child, score)"
- question: Does CADE's contrastive-embedding drift detector, wrapping the WMI ML classifiers, flag production
    WMI samples whose embedding distance from training-class centroids exceeds threshold — indicating
    concept drift requiring model retraining?
  context: 'ML detectors silently degrade when real-world WMI usage shifts — for example, when wmic.exe
    deprecation drives migration to PowerShell Get-CimInstance, or when new admin tooling appears. CADE
    wraps the Random Forest and sequence classifiers with a contrastive-embedding drift detector that
    learns per-class drift thresholds and flags samples whose embedding distance from training-class centroids
    exceeds threshold. These flags tell operators when to retrain, preventing blind spots. This is a model-health
    safeguard rather than a direct attack detection, but it preserves the reliability of every other ML
    detection in this playbook. References: [CADE, USENIX Security 2021](https://www.usenix.org/conference/usenixsecurity21/presentation/yang-limin).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  z = contrastive_encoder(sample)\n  d = min_dist(z, training_class_centroids)\n  if d\
      \ > class_drift_threshold: flag_for_retrain(sample, nearest_class, d)"
