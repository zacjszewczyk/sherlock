    of destinations a source contacts diverges (Jaccard distance >0.5) from its baseline — catches lateral
    fan-out even at normal volumes. Together these surface temporal and topological deviations characteristic
    of WMI-based lateral movement. References: [Red Canary - WMI](https://redcanary.com/threat-detection-report/techniques/wmi/)
    [ProvDetector, NDSS 2020](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
