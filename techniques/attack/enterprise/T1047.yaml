name: 'T1047: Windows Management Instrumentation'
id: c59035f0-8133-40e0-b877-94efb75c8528
description: 'Investigate adversary abuse of Windows Management Instrumentation (WMI) for the execution
  of commands and payloads on local and remote Windows systems. This playbook helps an analyst hunt across
  five complementary evidence surfaces: (1) malicious or obfuscated wmic.exe / PowerShell-WMI command
  lines (known-bad strings, XSL/MOF abuse, /node: remote execution, high entropy); (2) abuse of sensitive
  WMI class/method combinations such as Win32_Process.Create, Win32_ShadowCopy.Delete, and persistent
  __EventFilter/__FilterToConsumerBinding event subscriptions; (3) anomalous WMI-related network traffic
  over DCOM/RPC (TCP/135) and WinRM (TCP/5985-5986), including IWbemServices DCOM interface usage and
  Impacket-style wmiexec patterns; (4) remote logon (Event ID 4624 Logon Type 3) correlated within a short
  window to WMI-based process execution by wmiprvse.exe; and (5) WMI processes spawned by unexpected parents
  such as Office applications, browsers, or web server processes. For each surface it provides symbolic-logic
  detections, statistical baselines, and machine-learning approaches so a SOC analyst can confirm or rule
  out WMI-based execution, lateral movement, persistence, and defense evasion.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
