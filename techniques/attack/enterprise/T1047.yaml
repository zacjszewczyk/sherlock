  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  WinEventLog:Microsoft-Windows-WMI-Activity EventCode IN (5859,5861)\n  | bin _time span=1d\
      \ | stats count as subs by host _time\n  | streamstats current=f last(subs) as prev by host\n  |\
      \ where subs>prev AND NOT match(_time, change_window)\n  | table _time host subs prev"
- question: When an LSTM autoencoder trained on normal per-host WMI class/method call sequences scores
    new sequences, do any have reconstruction error above the 99th percentile, indicating a novel/abnormal
    WMI pattern?
  context: 'Sequence anomalies capture malicious WMI behavior that individual rare-pair checks miss —
    the order and combination of calls matters. An LSTM autoencoder trained on benign per-host sequences
    from Event ID 5857/5858/5860/5861 learns normal call patterns; sequences with reconstruction error
    above the 99th percentile are flagged as potentially novel and malicious. The contributing call sequence
    is output for triage. This supports Execution detection by surfacing unusual WMI orchestration (e.g.,
    enumerate -> create -> delete) without predefined signatures. References: [DeepLog, ACM CCS 2017](https://acmccs.github.io/papers/p1285-duA.pdf)
    [ATLAS, USENIX Security 2021](https://www.usenix.org/conference/usenixsecurity21/presentation/alsaheel).'
  answer_sources:
