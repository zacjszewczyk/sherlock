    query: ">-\n  conn.log | where id.resp_p IN (135,5985,5986) OR id.resp_p in dynamic_rpc_range\n  |\
      \ where not allowlist(id.orig_h, id.resp_h)\n  | join uid (dce_rpc.log where endpoint==\"IWbemServices\"\
      \ OR uuid==\"9556dc99-828c-11cf-a37e-00aa003240c7\")\n  | eval sev=if(is_workstation(id.orig_h)\
