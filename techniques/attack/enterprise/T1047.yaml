- question: From 90 days of process-creation data, do any (parent, child=wmic.exe) pairs have a per-host/role
    conditional probability below 0.01% and zero baseline host frequency?
  context: 'Conditional probability P(child=wmic.exe | parent) per host and per role quantifies how unusual
    a given parent launching WMI is for that environment. Flagging pairs with probability <0.01% and zero
    prior host frequency — with a minimum baseline of ~100 wmic events per role — surfaces statistically
    rare parent-child relationships that signature lists may not enumerate. This complements the allowlist
    approach by catching novel or environment-specific anomalous parents. A positive result is a parent-child
    pair essentially never seen before in that role. References: [Red Canary - WMI](https://redcanary.com/threat-detection-report/techniques/wmi/)
    [ProvDetector, NDSS 2020](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
