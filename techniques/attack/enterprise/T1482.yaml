questions:
- question: '[Discovery] Tool hash IOC correlation: Can you determine whether a process creation event
    (Sysmon EID 1 / Windows Event ID 4688) is logged where the process executable''s file hash matches
    a known indicator for a domain reconnaissance/attack-path tool (e.g., BloodHound/SharpHound), or the
    binary is rare across the enterprise. -- specifically, using the ''Tool hash IOC correlation'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary enumerates Windows domain/forest
    trust relationships to find lateral-movement and cross-domain credential-access opportunities (e.g.,
    SID-History Injection, Pass the Ticket, Kerberoasting), leaving traces in process-execution, PowerShell,
    directory-service, and network telemetry. This evidence focuses on the condition that a process creation
    event (Sysmon EID 1 / Windows Event ID 4688) is logged where the process executable''s file hash matches
    a known indicator for a domain reconnaissance/attack-path tool (e.g., BloodHound/SharpHound), or the
    binary is rare across the enterprise. This Symbolic Logic approach looks for the following signal:
    Monitor process creation (EID 4688 / Sysmon EID 1) and match the executable SHA256 against a curated
    feed of known SharpHound/BloodHound and AD enumeration tool hashes; trigger high-priority alerts on
    match. SharpHound is the dominant collector whose deployment precedes trust-map building ([BloodHound,
    SpecterOps](https://github.com/BloodHoundAD/BloodHound)). A positive result -- a rule match, statistical
    outlier, or model alert -- suggests that a host or account is mapping domain trusts in a way that
    deviates from sanctioned administration and normal user behavior; pivot to the responsible process
    and its parent lineage, the user/host context, the specific trust/LDAP objects touched, and any subsequent
    remote-system, account/group, or authentication activity across the trust. A negative result helps
    rule out this trust-discovery vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources: &id001
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=1
  - 'NAI: Domain Controllers, Member Servers, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Tool hash IOC correlation

      source IN [Windows Event ID 4688, WinEventLog:Sysmon EventCode=1]

      | WHERE matches_action_criteria("Tool hash IOC correlation")

      // Monitor process creation (EID 4688 / Sysmon EID 1) and match the executable SHA256 against a
      curated feed of known Sharp

      | ALERT enrich(host, user, process, parent, trust_object, dest)'
- question: '[Discovery] Hash prevalence alerting: Can you determine whether a process creation event
    (Sysmon EID 1 / Windows Event ID 4688) is logged where the process executable''s file hash matches
    a known indicator for a domain reconnaissance/attack-path tool (e.g., BloodHound/SharpHound), or the
    binary is rare across the enterprise. -- specifically, using the ''Hash prevalence alerting'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary enumerates Windows domain/forest
    trust relationships to find lateral-movement and cross-domain credential-access opportunities (e.g.,
    SID-History Injection, Pass the Ticket, Kerberoasting), leaving traces in process-execution, PowerShell,
    directory-service, and network telemetry. This evidence focuses on the condition that a process creation
    event (Sysmon EID 1 / Windows Event ID 4688) is logged where the process executable''s file hash matches
    a known indicator for a domain reconnaissance/attack-path tool (e.g., BloodHound/SharpHound), or the
    binary is rare across the enterprise. This Statistical Method approach looks for the following signal:
    Over a 30-day rolling window compute per-hash endpoint prevalence (Volume) and flag executables present
    on < the 1st percentile of hosts (e.g., a hash seen on 1-2 of thousands of endpoints). New-on-network
    binaries are a high-value first-party rarity signal; derive the percentile cutoff from your own fleet
    size ([LANL auth dataset](https://csr.lanl.gov/data/auth/)). A positive result -- a rule match, statistical
    outlier, or model alert -- suggests that a host or account is mapping domain trusts in a way that
    deviates from sanctioned administration and normal user behavior; pivot to the responsible process
    and its parent lineage, the user/host context, the specific trust/LDAP objects touched, and any subsequent
    remote-system, account/group, or authentication activity across the trust. A negative result helps
    rule out this trust-discovery vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources: *id001
  range: Last 90 days (baseline 30+ days; evaluate per-hour/day windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Hash prevalence alerting

      source IN [Windows Event ID 4688, WinEventLog:Sysmon EventCode=1]

      | STATS baseline over 30d per (host, user, process)

      | COMPUTE deviation (z-score / percentile / change-point)

      // Over a 30-day rolling window compute per-hash endpoint prevalence (Volume) and flag executables
      present on < the 1st per

      | WHERE deviation > threshold | ALERT enrich(host, user, process, trust_object)'
