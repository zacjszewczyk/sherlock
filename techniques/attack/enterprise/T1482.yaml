name: 'T1482: Domain Trust Discovery'
id: a1a8bf7d-6c6a-4e03-99bd-ff724570a25e
description: 'This playbook helps an analyst investigate whether an adversary is enumerating Windows domain
  and forest trust relationships to identify lateral-movement and cross-domain credential-access opportunities
  (such as SID-History Injection, Pass the Ticket, and Kerberoasting) as part of the Discovery tactic.
  It guides the hunt across several behavioral angles on Windows hosts and the network: execution of known
  AD attack-path tooling (e.g., BloodHound/SharpHound) matched by file hash or flagged by enterprise-wide
  rarity; native-utility and script invocations carrying trust-enumeration arguments (nltest /domain_trusts,
  dsquery trustedDomain, PowerShell Get-ADTrust/GetAllTrustRelationships, PowerView Get-DomainTrust/Get-ForestTrust),
  including OriginalFileName matching to survive renames; trust-discovery commands spawned by anomalous
  parents such as Office, Outlook, or web/application server processes; command-line-bypassing directory-service
  enumeration via LDAP (objectClass=trustedDomain) filters, DCE-RPC Netlogon DsrEnumerateDomainTrusts/NetrEnumerateTrustedDomains
  calls, and Security Event 4662 reads of trustedDomain objects from non-DC/non-admin hosts; and short-window
  reconnaissance chains that combine trust discovery with remote-system, network-share, and account/group
  discovery followed by authentication staging across a trust. Detection methods combine symbolic-logic
  rules, statistical baselining/anomaly profiling, and machine-learning models (supervised classifiers,
  LSTM log-key and sequence models, provenance/temporal graph analytics, and Mahalanobis/PAYL payload
  modeling) applied to Windows Security/Sysmon process and AD-audit events, PowerShell script-block logs,
  and Zeek ldap.log/dce_rpc.log/conn.log telemetry, so the analyst can corroborate suspected trust mapping
  against process lineage, command intent, directory-object access, and downstream lateral-movement context.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
