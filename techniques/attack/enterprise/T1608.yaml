name: 'T1608: Stage Capabilities'
id: 41550493-191b-47d0-aea6-7f18d5538ae6
description: 'Investigate whether an adversary is staging or operating pre-positioned capabilities (malware,
  tooling, SSL/TLS certificates, phishing pages, drive-by web resources, or ingress-tool-transfer payloads)
  against the network. Although much of the staging itself occurs on adversary-controlled infrastructure
  outside the organization''s visibility, this playbook focuses detection on the observable consequences:
  outbound connections to staged C2/malware/phishing infrastructure matched against threat intelligence,
  rare or anomalous destinations by prevalence and volume, malicious HTTP/TLS handshake artifacts (User-Agent,
  URI, JA3/JA3S/JA4 fingerprints), high-risk transport characteristics (non-standard ports, self-signed
  or short-lived certificates, dynamic DNS), suspicious domains (newly registered, high-entropy/DGA, typosquatted),
  and downloads from code/paste/file-sharing sites correlated with subsequent process creation. It combines
  deterministic signature matching, statistical rarity/anomaly scoring, and machine-learning classification
  across Zeek network logs and Windows endpoint telemetry to surface staged capabilities before or during
  their use.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any outbound connections from internal hosts resolve to or contact external IP addresses,
    domains, or URLs that exactly match high-confidence threat intelligence indicators for known C2 servers,
    malware distribution points, or phishing sites?
  context: 'Adversaries stage capabilities on infrastructure they control or have compromised, and that
    infrastructure frequently shows up on curated, high-confidence CTI feeds. Joining all outbound network
    telemetry (destination IPs from conn.log, Host headers from http.log, queried domains from dns.log)
    against these feeds is a Floor-of-Determinism control that should never be removed: any exact match
    is a high-severity event tied to Resource Development, indicating the adversary has pre-positioned
    tooling the victim is now reaching. Additionally profile connection state (conn_state S0/REJ/RSTO)
    to flagged destinations, because callbacks to recently staged-then-sinkholed infrastructure often
    fail. A positive result (a match) warrants immediate triage of the host, the matched indicator, the
    feed name, and the full 5-tuple; a clean result reduces but does not eliminate suspicion since not
    all staged infrastructure is known.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Egress points (e.g., firewalls, web proxies), DNS resolvers, Core network switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(zeek_conn.id.resp_h IN cti_ip_list) OR (zeek_http.host IN cti_domain_list) OR (zeek_dns.query
      IN cti_domain_list)

      | eval matched_indicator, feed_name, tuple=src_ip+":"+src_port+"->"+resp_h+":"+resp_port

      | alert severity=high'
  - technology: Zeek/pseudocode
    query: count conn by id.orig_h, id.resp_h where id.resp_h in cti_ip_list and conn_state in (S0,REJ,RSTO)
      -> failed_callback_signal
- question: For each external destination IP and domain, what fraction of internal hosts have connected
    to it over a rolling 30-day window, and do any rarely-contacted destinations (seen by two or fewer
    hosts) also appear on a CTI grey list?
  context: Staged malicious infrastructure is typically contacted by very few hosts, so prevalence is
    a strong rarity signal. Computing the percentage of internal hosts connecting to each destination
    over a 30-day rolling window and ranking rarity (per the directed/rarity-based anomaly scoring of
    [Detecting Credential Spearphishing Attacks in Enterprise Settings, Ho et al](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho))
    lets an analyst flag destinations in the bottom 5th percentile that also appear on lower-confidence
    grey lists. Enriching with volume features (bytes sent/received, bytes-out:bytes-in ratio) and frequency
    (connections/hour) sharpens the score, and per-environment percentile cutoffs avoid the false positives
    of fixed global thresholds. A rare destination on a grey list with asymmetric outbound volume is a
    strong candidate for staged C2; common destinations are deprioritized.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Egress points (e.g., firewalls, web proxies), DNS resolvers, Core network switches'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stats dc(src_ip) as host_count, sum(bytes_out) as bo, sum(bytes_in) as bi, count as conns
      by dest

      | eval prevalence=host_count/total_hosts, ratio=bo/bi

      | where percentile(prevalence) <= 5 AND host_count <= 2 AND dest IN cti_greylist

      | sort prevalence asc'
- question: When a supervised classifier scores outbound connections using flow metadata, which connections
    are predicted to be callbacks to staged C2/malware infrastructure even though the destination is not
    on any IOC list?
  context: IOC lists always lag adversary infrastructure, so a supervised model (e.g., Gradient Boosting)
    trained on labeled flows generalizes to staged infrastructure not yet on any feed. Features include
    destination port, protocol, total bytes sent/received and their ratio, connection duration, connection-state
    success/failure counts, CTI membership (binary), and destination rarity, consistent with metadata-based
    malware-traffic classification surveyed in [A Systematic Review on the Integration of Explainable
    AI in Intrusion Detection Systems, Frontiers in AI](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    Scoring new outbound connections in real time catches callbacks to fresh staged C2/malware infrastructure;
    using SHAP to surface the top-3 contributing features (e.g., bytes-out ratio, destination rarity,
    failed-connection count) makes each alert explainable and triageable. High-scoring connections to
    rare destinations are prioritized for investigation.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Egress points (e.g., firewalls, web proxies), DNS resolvers, Core network switches'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [dest_port, proto, bytes_out, bytes_in, ratio, duration, conn_state_fail_count,
      cti_member, dest_rarity]

      score = gbm.predict_proba(features)

      if score >= threshold: alert(top3=shap_explain(features))'
- question: Do any outbound HTTP or TLS connections carry User-Agent strings, URI path patterns, or JA3/JA3S
    hashes that match a maintained signature list of known adversary tooling and malware?
  context: 'Staged adversary tooling (e.g., Cobalt Strike with default Malleable C2 profiles) leaves recognizable
    fingerprints in HTTP headers and TLS handshakes. Maintaining and continuously matching signature lists
    of malicious User-Agents, URI path patterns, and JA3/JA3S hashes against Zeek http.log/ssl.log is
    a Floor-of-Determinism control. Seed JA3/JA3S from [JA3: TLS Client Fingerprinting, Salesforce](https://github.com/salesforce/ja3)
    and URI/header/UA signatures from [Detecting Popular Cobalt Strike Malleable C2 Profile Techniques,
    Unit 42](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/) (default Amazon/OCSP/jQuery
    profiles, fixed UAs, characteristic header ordering). Any match is a high-severity alert with the
    matched artifact recorded. This directly reveals an adversary''s staged C2 tooling in use against
    the network during Resource Development follow-on activity.'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Egress points (e.g., Firewalls, Web Proxies), Encrypted traffic inspection points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(zeek_http.user_agent IN bad_ua_list) OR (zeek_http.uri MATCHES bad_uri_regex) OR (zeek_ssl.ja3
      IN bad_ja3_list) OR (zeek_ssl.ja3s IN bad_ja3s_list)

      | alert severity=high field=matched_artifact'
- question: Across a 30-day rolling window, which User-Agent strings and JA3/JA3S (or JA4/JA4H/JA4X) fingerprints
    are organizationally rare (bottom 1st percentile), and do those rare clients correlate with rare destinations
    and high request volume?
  context: 'Rare client fingerprints can indicate non-browser tooling staged by an adversary. Computing
    organization-wide prevalence of User-Agents and TLS fingerprints over 30 days and flagging the bottom
    1st percentile surfaces unusual clients. However, browser ClientHello extension randomization and
    GREASE fragment JA3 and inflate rare-JA3 noise, so prefer the version-resilient JA4/JA4H/JA4X fingerprints
    of [JA4+: Network Fingerprinting Suite, FoxIO](https://github.com/FoxIO-LLC/ja4). To control false
    positives (Failure Mode Awareness), corroborate a rare fingerprint with destination rarity and volume
    (request count, bytes) before alerting. A rare JA4 fingerprint talking to a rarely-seen destination
    with steady request volume is a strong indicator of staged C2 tooling.'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Egress points (e.g., Firewalls, Web Proxies), Encrypted traffic inspection points'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stats dc(src_ip) as hosts, count as reqs, sum(bytes) as vol by ja4, user_agent, dest

      | eval prev=hosts/total_hosts

      | where percentile(prev) <= 1 AND dest_rarity_high AND reqs > vol_floor'
- question: When unsupervised clustering is applied to TLS/HTTP connection feature vectors, do any small
    distinct clusters emerge that do not match known legitimate applications?
  context: Staged C2 tooling tends to form small, tight clusters in metadata feature space that differ
    from legitimate application traffic. Applying unsupervised clustering (e.g., DBSCAN) to feature vectors
    of JA3/JA3S (or JA4/JA4X), TLS extension set, User-Agent, request volume, and inter-arrival regularity
    surfaces small distinct clusters not matching known-good applications, an approach to metadata-only
    C2 identification consistent with [A Systematic Review on the Integration of Explainable AI in Intrusion
    Detection Systems, Frontiers in AI](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    For each flagged cluster, reporting the top-3 distinguishing features (e.g., rare JA4X self-signed
    issuer, non-browser header order, low jitter) guides triage. This catches novel staged tooling without
    prior signatures; large clusters matching known apps are benign.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Egress points (e.g., Firewalls, Web Proxies), Encrypted traffic inspection points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = vectorize([ja4, ja4x, tls_ext_set, user_agent, req_volume, interarrival_jitter])

      labels = DBSCAN(eps, min_samples).fit(X)

      for c in small_clusters(labels) not in known_good: report(top3_features(c))'
- question: Are there outbound connections running known services on non-standard ports, presenting self-signed
    certificates (or default Cobalt Strike certificate fields), or resolving domains belonging to dynamic-DNS
    providers?
  context: 'Freshly staged adversary infrastructure commonly exhibits high-risk transport tells. Maintain
    concrete deterministic rules (Floor of Determinism): (1) alert when conn.log shows services like http/ssl
    on non-standard ports; (2) alert from x509.log when certificate issuer equals subject (self-signed)
    or matches default Cobalt Strike certificate fields documented by [Detecting Popular Cobalt Strike
    Malleable C2 Profile Techniques, Unit 42](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/);
    (3) maintain a list of dynamic-DNS providers and alert on dns.log queries to those domains. Use [JA4+:
    Network Fingerprinting Suite, FoxIO](https://github.com/FoxIO-LLC/ja4) JA4X to fingerprint the issuer/subject
    structure of staged C2 certificates. Any of these characteristics, especially in combination, indicates
    likely staged infrastructure; legitimate enterprise services rarely combine these traits.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - Zeek x509.log
  - 'NAI: Egress points (e.g., firewalls, web proxies), DNS resolvers, Core network switches'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn where service in (http,ssl) and resp_port not in standard_ports[service] -> alert

      x509 where issuer == subject OR issuer in cobaltstrike_default_fields -> alert

      dns where query domain_in dyndns_provider_list -> alert'
- question: What is the distribution of TLS certificate validity periods across external domains, and
    which certificates fall in the bottom 5th percentile (e.g., under 90 days) or correlate with elevated
    TLS/certificate-validation failures?
  context: Adversaries staging short-lived infrastructure often use certificates with unusually short
    validity periods and untrusted chains. From x509.log, compute the distribution of certificate validity
    periods across external domains and flag the bottom 5th percentile (e.g., under 90 days) for review;
    separately baseline destination ports per service in conn.log and alert on statistical port outliers.
    Track the state/failure dimension by counting TLS handshake failures and certificate-validation failures
    (ssl.log validation_status) per destination, because freshly staged infrastructure frequently presents
    invalid/untrusted chains. Derive percentile thresholds per environment. A short-validity, validation-failing
    certificate on a rare destination is a strong staging indicator.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - Zeek x509.log
  - 'NAI: Egress points (e.g., firewalls, web proxies), DNS resolvers, Core network switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stats by cert_serial: validity_days, dest

      | where percentile(validity_days) <= 5

      join ssl.log: count(validation_status != ok) as val_fail by dest

      | where val_fail > 0 -> review'
- question: Does the daily count of new, previously-unseen TLS certificate issuers and subjects show a
    statistically significant spike above forecast that could indicate an adversary registering or staging
    new infrastructure?
  context: When adversaries provision new staging infrastructure they introduce previously-unseen certificate
    issuers and subjects. Implementing time-series anomaly detection (e.g., Holt-Winters or change-point)
    on the daily count of new issuers and subjects in x509.log lets an analyst detect statistically significant
    spikes above the forecast, which can indicate bulk registration/staging. Combine with the metadata
    features that survive TLS 1.3 (record sizes, timing, JA4) per [A Systematic Review on the Integration
    of Explainable AI in Intrusion Detection Systems, Frontiers in AI](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)
    and surface the top-3 drivers (e.g., new issuer spike, short validity, dynamic-DNS host) in each alert.
    A forecast-exceeding spike, especially with corroborating short-validity or dynamic-DNS signals, warrants
    hunting for newly staged infrastructure.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - Zeek x509.log
  - 'NAI: Egress points (e.g., firewalls, web proxies), DNS resolvers, Core network switches'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'series = daily_count(new_unseen_issuer + new_unseen_subject from x509)

      forecast = HoltWinters(series)

      if observed > forecast + k*sigma: alert(top3=[issuer_spike, short_validity, dyndns])'
- question: For every unique domain resolved, was it registered within the last 60 days (per WHOIS), is
    it a typosquatted variant of a protected brand/internal domain (edit distance <=2), and are hosts
    generating bursts of NXDOMAIN responses?
  context: 'Newly registered domains (NRDs) commonly host staged phishing and C2, and typosquatted domains
    target users of high-value brands. For every unique domain in dns.log, enrich with WHOIS creation
    date and alert on connections to domains registered within the past 60 days. Check every resolved
    domain against a protected list of critical internal/external and partner brand domains using Levenshtein/Damerau
    distance <=2, per the typo-generation models catalogued in [The Landscape of Domain Name Typosquatting:
    Techniques and Countermeasures, Spaulding et al](https://arxiv.org/abs/1603.02767). Profile the failure
    dimension by counting NXDOMAIN responses per host (dns.log rcode), since DGA callbacks to not-yet-staged
    domains generate NXDOMAIN bursts. An NRD or close typosquat being resolved, or an NXDOMAIN burst,
    is a strong staged-capability signal.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: DNS resolvers, Egress points (e.g., Firewalls, Web Proxies)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for domain in unique(dns.query): age = today - whois_creation(domain)\n  if age <= 60d: alert(newly_registered)\n\
      \  if min(damerau(domain, b) for b in protected_brands) <= 2: alert(typosquat)\ncount dns where\
      \ rcode==NXDOMAIN by orig_h -> nxdomain_burst"
- question: Which resolved domains have character entropy (Shannon entropy / KL divergence vs. natural
    language) in the top 5th percentile compared to a known-good baseline, indicating likely algorithmic
    generation (DGA)?
  context: Algorithmically generated domains used to stage or rendezvous with C2 have distinctive character
    distributions. For every unique domain in dns.log, compute Shannon entropy and, preferably, Kullback-Leibler
    divergence against a natural-language character distribution, which better separates algorithmically
    generated strings per [Using Entropy in Threat Hunting, Red Canary](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).
    Compare against a known-good distribution (e.g., Tranco Top 1M) and flag the top 5th percentile as
    potential DGA. Add lexical features (n-grams, vowel/consonant ratio, length) validated by [NIOM-DGA,
    Computers & Security](https://www.sciencedirect.com/science/article/pii/S0167404825002500) and combine
    with frequency (queries/host) and NXDOMAIN counts. A high-entropy domain queried repeatedly by a host
    with NXDOMAIN bursts strongly suggests DGA-based staging; common low-entropy domains are deprioritized.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: DNS resolvers, Egress points (e.g., Firewalls, Web Proxies)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for domain in unique(dns.query): H = shannon(domain); KL = kl_div(domain, natural_lang)

      | where percentile(KL) >= 95

      enrich n_grams, vowel_consonant_ratio, length, queries_per_host, nxdomain_count

      | flag potential_dga'
- question: When a deep-learning domain/URL classifier scores resolved domains and staged URLs, which
    are classified malicious with confidence greater than 0.90?
  context: Deep-learning models capture DGA and malicious-URL structure that hand-crafted rules miss.
    Deploy a deep-learning domain classifier (e.g., LSTM/CNN over characters) trained on large labeled
    DGA vs. legitimate corpora, with feature selection consistent with [NIOM-DGA, Computers & Security](https://www.sciencedirect.com/science/article/pii/S0167404825002500);
    for raw staged URLs (drive-by landing pages, spearphishing link targets) score lexical maliciousness
    with a character+word CNN as in [URLNet, Le et al](https://arxiv.org/abs/1802.03162). Investigate
    domains/URLs classified malicious with confidence greater than 0.90 and report the top-3 contributing
    features/substrings in the alert. This catches novel staged domains/URLs without prior IOCs; high-confidence
    malicious classifications on rarely-seen domains are top triage priorities.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: DNS resolvers, Egress points (e.g., Firewalls, Web Proxies)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'p_dom = dga_lstm.predict(domain)

      p_url = urlnet.predict(url)

      if max(p_dom, p_url) > 0.90: investigate(top3_substrings)'
- question: Did a file download from a watchlisted code/file-sharing/paste site (GitHub, raw.githubusercontent,
    Pastebin, anonfiles, Discord CDN, gist, transfer.sh) occur, followed within 5 minutes by a process-creation
    event on the same host whose command line references the downloaded file name?
  context: 'Adversaries stage capabilities on legitimate web services and then pull them into the victim
    network (Ingress Tool Transfer). A stateful correlation rule (Floor of Determinism) links: (1) a file
    download in http.log/files.log from a watchlist of code/file-sharing/paste sites adversaries use to
    stage capabilities, per the staged-web-resource model in [All Your iFRAMEs Point to Us, Provos et
    al](https://www.usenix.org/legacy/event/sec08/tech/full_papers/provos/provos.pdf); (2) on the same
    internal IP, a Windows Event ID 4688 process-creation event within 5 minutes; (3) where the New Process
    Name/CommandLine contains the downloaded file name. A match produces a high-severity alert including
    the source URL, file hash, and process lineage. This directly evidences staged tooling being downloaded
    and executed; the tight time window and filename linkage keep false positives low.'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Egress points (e.g., Web Proxies)'
  range: 'Last 90 days (event-centered: pivot +/-5 min around each download)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'download = zeek_http/files where host IN staging_site_watchlist

      proc = win_4688 where src_ip == download.src_ip AND time within 5min of download AND (NewProcessName
      OR CommandLine contains download.filename)

      join download, proc -> alert severity=high fields=[url, file_hash, process_lineage]'
- question: Do any HTTP response bodies or files carved by Zeek match YARA/static signatures for staged
    drive-by or exploit-kit content (hidden iframes, obfuscated redirect chains, eval/unescape/document.write,
    shellcode-like strings)?
  context: Adversaries stage web resources to conduct drive-by compromise. Applying YARA/static signatures
    to HTTP response bodies and files carved by Zeek files.log detects staged drive-by/exploit-kit content
    using the structural HTML/JS indicators (hidden iframes, obfuscated redirect chains, eval/unescape/document.write,
    shellcode-like strings) characterized by [Detection and Analysis of Drive-by-Download Attacks and
    Malicious JavaScript Code, Cova et al](https://sites.cs.ucsb.edu/~vigna/publications/2010_cova_kruegel_vigna_Wepawet.pdf).
    Alert on any high-confidence signature match. A positive match indicates the host retrieved staged
    malicious web content and may be compromised via drive-by; this is a Floor-of-Determinism content-inspection
    control complementary to destination-based detection.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Egress points (e.g., Web Proxies)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for body in http_response_bodies + files.log_carved:\n  if yara_match(body, drive_by_exploit_kit_rules):\
      \ alert(high_confidence, matched_rule)"
- question: For each user or host, do the file types (MIME/extension) and source domains of recent downloads
    deviate from their established baseline (e.g., an HR user downloading a .ps1 or .exe from a code repository
    for the first time)?
  context: Role-based download baselines expose anomalous retrieval of staged capabilities. For each user/host,
    baseline downloaded file types (MIME types in files.log, extensions) and source domains, then flag
    statistical anomalies such as a non-technical user fetching a .ps1 or .exe from a code repository
    for the first time. Add volume (download byte size vs. the host's historical distribution) and frequency
    (downloads/hour from rare domains), and derive per-role thresholds rather than global ones. A strong
    deviation from a user's normal download profile toward executable/script content from staging-capable
    domains warrants investigation; expected downloads are deprioritized.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Egress points (e.g., Web Proxies)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per user/host: set(mime_type), set(source_domain), size_dist\nfor dl in downloads:\n\
      \  if dl.mime not in baseline.mime OR dl.domain not in baseline.domain OR dl.size > p95(size_dist):\n\
      \    flag anomaly (per-role threshold)"
- question: When an ML prefilter scores downloaded web pages and a sequence model evaluates endpoint event
    chains (browser -> download(.zip) -> archive utility -> process creation(.exe)), which downloads or
    execution chains from low-reputation/staging domains are flagged anomalous?
  context: Combining web-content ML scoring with endpoint sequence modeling catches staged drive-by and
    ingress-tool-transfer behavior. Score downloaded web pages with a fast static ML prefilter over HTML/JS/URL
    features (iframe/hidden-element counts, eval/unescape counts, string entropy, deobfuscation routines,
    domain age), as in [Prophiler, Canali et al](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf),
    or inline at the proxy with a static+dynamic q-gram SVM as in [Cujo, Rieck et al](https://www.mlsec.org/docs/2010-acsac.pdf).
    In parallel, apply a sequence model to endpoint event chains (browser -> download(.zip) -> archive
    utility -> process creation(.exe)) and alert on anomalous chains from low-reputation/staging domains,
    reporting the top-3 contributing features. An anomalous chain originating from a low-reputation domain
    is a high-priority indicator of staged tooling being delivered and executed.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Endpoint devices, Egress points (e.g., Web Proxies)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'page_score = prophiler.predict([iframe_cnt, eval_cnt, str_entropy, deobf, domain_age])

      chain = sequence_model([browser, download_zip, archive_util, proc_exe])

      if page_score malicious OR chain.anomaly and domain_low_rep: alert(top3_features)'
