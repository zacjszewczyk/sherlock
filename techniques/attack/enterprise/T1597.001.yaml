questions:
- question: '[Reconnaissance] Can you correlate inbound connection and authentication events (Zeek conn.log/dns.log
    and Windows Event IDs 4624/4625) against threat-intelligence feeds of malicious IPs and lists of breached
    credentials, and alert when a source IP that is first-seen within the last 24 hours or present on
    an active TI feed -- or a username present on a recent breach list -- appears, including external-source
    failed logons?'
  context: 'Under the Reconnaissance tactic (TA0043), an adversary leverages private threat-intelligence
    vendor data to plan targeting; because that purchase and search happens outside the victim''s visibility,
    the defensible signal is the inbound activity it enables. This question targets the condition that
    a connection or authentication event originates from an external IP that is either first-seen in the
    last 24 hours or on an active TI feed of malicious infrastructure, possibly using a username from
    a recent breach. The Symbolic Logic approach cross-references conn.log plus EID 4624/4625 with TI
    feeds and breached-credential lists and alerts on matches, deploying the Sigma ''Failed Logon From
    Public IP'' rule, while keeping the first-seen-IP logic working purely on internal logs so detection
    does not depend on external API lookups. A positive result -- a match against a malicious IP, a breached
    credential, or a brand-new external source authenticating -- suggests an actor is acting on acquired
    intelligence; pivot to the user, host, source geolocation/ASN, and surrounding logon history to scope
    intent. A negative result helps rule out this vector but should be corroborated with the other questions,
    since first-contact attackers may use clean infrastructure. References: [Sigma: Failed Logon From
    Public IP](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/account_management/win_security_susp_failed_logon_source.yml).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Internet Gateway, VPN Concentrators, External-facing Authentication Services (e.g., ADFS, OWA),
    Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (Zeek:conn.log, Win:EID(4624,4625))\n  | enrich src_ip WITH ti_malicious_ip, breached_credentials\n\
      \  | eval first_seen = (min_seen(src_ip) > now()-24h)\n  | where src_ip IN ti_malicious_ip OR username\
      \ IN breached_credentials OR first_seen\n  | where EID=4625 AND src_ip NOT IN internal_ranges  //\
      \ Sigma: Failed Logon From Public IP\n  | alert"
- question: '[Reconnaissance] Can you profile each source IP''s failed-to-successful logon ratio over
    a one-hour window and alert when it exceeds the 99th percentile of a local 30-day baseline, raising
    risk when the IP is tied to known breached usernames, and apply Wald''s Sequential Probability Ratio
    Test (SPRT) to first-contact attempts so high failed/refused ratios trip early with bounded error?'
  context: 'Under the Reconnaissance tactic (TA0043), an adversary leverages private threat-intelligence
    vendor data to plan targeting; because that purchase and search happens outside the victim''s visibility,
    the defensible signal is the inbound activity it enables. This Statistical Method explicitly profiles
    the failure mode: it tracks the failed-to-success login ratio (a state metric) per source IP and flags
    IPs above the 99th percentile within an hour, boosting risk when associated with breached usernames.
    SPRT (Threshold Random Walk, Jung et al.) is applied to first-contact attempts so that a sequence
    of failed/refused connections accumulates evidence and trips an alert early with mathematically bounded
    false-positive and false-negative rates. Percentile cutoffs are derived from 30 days of local baseline
    rather than fixed thresholds, reducing environment-specific false positives. A positive result indicates
    an external source behaving like an authentication attacker exploiting acquired credentials; a negative
    result lowers but does not eliminate suspicion. References: [Jung et al. Threshold Random Walk](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Internet Gateway, VPN Concentrators, External-facing Authentication Services (e.g., ADFS, OWA),
    Domain Controllers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source IN (Win:EID(4624,4625)) earliest=-1h\n  | stats count(eval(EID=4625)) AS fails, count(eval(EID=4624))\
      \ AS oks BY src_ip\n  | eval ratio = fails/(oks+1)\n  | eventstats perc99(ratio) AS p99 FROM baseline(-30d)\n\
      \  | where ratio > p99\n  | lookup breached_credentials username OUTPUT match | eval risk = if(match,\
      \ risk+2, risk)\n  | alert"
  - technology: SPRT/pseudocode
    query: "for each first_contact src_ip:\n    LLR += log(P(fail|malicious)/P(fail|benign))  per attempt\n\
      \    if LLR >= log((1-beta)/alpha): flag malicious\n    elif LLR <= log(beta/(1-alpha)): flag benign"
- question: '[Reconnaissance] Can you score each logon with a supervised model (logistic regression or
    gradient boosting) over features such as IP reputation, time-of-day, geolocation, user agent, inter-attempt
    delta, and breach-list membership, alert when the predicted probability exceeds 0.9, and emit the
    top-3 contributing features in the alert text for analyst explainability?'
  context: 'Under the Reconnaissance tactic (TA0043), an adversary leverages private threat-intelligence
    vendor data to plan targeting; because that purchase and search happens outside the victim''s visibility,
    the defensible signal is the inbound activity it enables. This Machine Learning approach scores logins
    using risk features empirically validated by Thomas et al. (stolen-credential risk), combining IP
    reputation, timing, geolocation, user agent, inter-attempt delta, and breach-list membership. Alerting
    at probability > 0.9 keeps precision high, and emitting the top-3 contributing features makes each
    alert explainable and triage-ready. This complements the deterministic and statistical methods by
    catching combinations of weak signals no single rule would flag. A positive, high-probability score
    with breach-list membership among the top features strongly suggests credential abuse driven by acquired
    intelligence; analysts should pivot to the account and host. A negative result is reassuring but model
    drift and novel infrastructure mean it should be read alongside the other questions. References: [Thomas
    et al. — Data breaches, phishing, or malware? Understanding the risks of stolen credentials](https://research.google/pubs/data-breaches-phishing-or-malware-understanding-the-risks-of-stolen-credentials/).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Internet Gateway, VPN Concentrators, External-facing Authentication Services (e.g., ADFS, OWA),
    Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "feats = [ip_reputation, hour, geo, user_agent, inter_attempt_delta, breach_list_member]\n\
      \  p = model.predict_proba(feats)   # logistic regression / gradient boosting\n  if p > 0.9:\n \
      \   alert(prob=p, top_features=explain(model, feats)[:3])"
- question: '[Reconnaissance] Can you detect HTTP requests to public-facing web servers whose User-Agent
    strings, URI paths, or header combinations match known reconnaissance/vulnerability-scanner signatures
    (Nmap, masscan, zgrab, nuclei, Metasploit), and correlate inbound exploit payloads with outbound callbacks
    (e.g., JNDI/LDAP/RMI) and unexpected-port probing, especially within 72 hours of a relevant TI report?'
  context: 'Under the Reconnaissance tactic (TA0043), an adversary leverages private threat-intelligence
    vendor data to plan targeting; because that purchase and search happens outside the victim''s visibility,
    the defensible signal is the inbound activity it enables. This Symbolic Logic approach applies regexes
    for malicious User-Agents and URI patterns in Zeek http.log and alerts on matches, then adds stateful
    inbound-payload-to-outbound-callback correlation (per NCC Group''s Log4Shell network detection, e.g.
    a JNDI string in a request followed by an outbound LDAP/RMI connection) and unexpected-port probing
    characterized by the LZR study. Tightening focus to the 72-hour window after a TI report concentrates
    attention when intelligence-driven scanning is most likely. A positive result -- a scanner signature,
    or an inbound exploit attempt followed by an outbound callback -- indicates active reconnaissance
    or exploitation against the perimeter; pivot to the targeted resource, source IP, and any successful
    response. A negative result reduces but does not eliminate concern, since attackers can randomize
    User-Agents. References: [Log4Shell Network Detection, NCC Group](https://www.nccgroup.com/research-blog/log4shell-reconnaissance-and-post-exploitation-network-detection/);
    [LZR, Izhikevich et al.](https://www.usenix.org/system/files/sec21fall-izhikevich.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Public-facing Web Servers, Application Gateways, Web Application Firewalls (WAFs)'
  range: Last 90 days (focus 72h after relevant TI report)
  queries:
  - technology: Zeek/pseudocode
    query: "http.log | where user_agent =~ /(nmap|masscan|zgrab|nuclei|metasploit|sqlmap)/i\n        \
      \    OR uri =~ /(\\.\\./|select.+from|jndi:|\\$\\{)/i\n  | join conn.log on uid\n  | alert\n  //\
      \ stateful: request with jndi:/ldap -> outbound conn to same host within 60s => callback"
- question: '[Reconnaissance] Can you build a per-resource statistical model of HTTP requests -- URI/parameter
    length (Chebyshev bound), character distribution (chi-square), and request frequency/inter-request
    time -- flag values beyond the 98th percentile, and surface per-source-IP 404/error-rate spikes as
    a distinct failure-mode signal?'
  context: 'Under the Reconnaissance tactic (TA0043), an adversary leverages private threat-intelligence
    vendor data to plan targeting; because that purchase and search happens outside the victim''s visibility,
    the defensible signal is the inbound activity it enables. This Statistical Method, following Kruegel
    and Vigna, models each public resource''s normal request structure: URI/parameter length via a Chebyshev
    bound, character distribution via chi-square, and request frequency/inter-request timing. Values beyond
    the 98th percentile are flagged as anomalous, and 404/error-rate (failure-mode) spikes per source
    IP are surfaced separately because a burst of errors often signals enumeration or fuzzing. Bounds
    are tuned from production traffic. A positive result -- unusually long parameters, abnormal character
    mixes, or a 404 storm from one IP -- indicates probable scanning or exploitation probing tied to acquired
    intelligence; pivot to the source and resource. A negative result is corroborating but not conclusive
    against low-and-slow recon. References: [Kruegel and Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Public-facing Web Servers, Application Gateways, Web Application Firewalls (WAFs)'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "http.log earliest=-24h\n  | stats by resource: uri_len, param_len, char_dist, req_rate\n \
      \ | eval chebyshev_anom = abs(uri_len-mean)/std > k\n  | eval chi2 = chisquare(char_dist, baseline_char_dist)\n\
      \  | where percentile(metric) > 98 OR chi2 > crit\n  | stats count(eval(status>=400)) AS errs BY\
      \ src_ip | where errs > baseline_p98\n  | alert"
- question: '[Reconnaissance] Can you run an online autoencoder ensemble over incrementally-computed flow
    statistics (Kitsune-style) from http.log/conn.log features such as method, status code, bytes, URI
    depth, and request rate, and alert on high reconstruction error while reporting the top-3 contributing
    features?'
  context: 'Under the Reconnaissance tactic (TA0043), an adversary leverages private threat-intelligence
    vendor data to plan targeting; because that purchase and search happens outside the victim''s visibility,
    the defensible signal is the inbound activity it enables. This Machine Learning approach uses the
    Kitsune online autoencoder ensemble over incrementally computed flow statistics, ingesting http.log/conn.log
    features (method, status code, bytes, URI depth, rate). High reconstruction error indicates traffic
    that does not match learned normal behavior, catching novel scanner or exploit patterns no signature
    covers; reporting the top-3 contributing features keeps alerts explainable. Because it learns online,
    it adapts to drift without manual retraining. A positive result -- a flow with high reconstruction
    error driven by, say, abnormal URI depth and request rate -- suggests intelligence-driven probing;
    pivot to the source and resource. A negative result complements but does not replace the signature
    and statistical methods. References: [Kitsune, Mirsky et al.](https://www.ndss-symposium.org/wp-content/uploads/2018/02/ndss2018_03A-3_Mirsky_paper.pdf);
    [code](https://github.com/ymirsky/Kitsune-py).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Public-facing Web Servers, Application Gateways, Web Application Firewalls (WAFs)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "feats = incremental_flow_stats(http.log, conn.log)  # method, status, bytes, uri_depth, rate\n\
      \  err = kitsune_ensemble.score(feats)\n  if err > rmse_threshold:\n    alert(error=err, top_features=top3(contrib(feats)))"
- question: '[Reconnaissance] Can you alert when an external IP exceeds 100 connections in five minutes
    against CTI-associated ports/services (volume + frequency), and dynamically lower that threshold for
    services whose technologies show a rising EPSS exploitation probability within 72 hours of a vulnerability
    disclosure?'
  context: 'Under the Reconnaissance tactic (TA0043), an adversary leverages private threat-intelligence
    vendor data to plan targeting; because that purchase and search happens outside the victim''s visibility,
    the defensible signal is the inbound activity it enables. This Symbolic Logic approach detects post-disclosure
    scanning spikes: it alerts on CTI-associated ports when a single external IP exceeds 100 connections
    in five minutes, combining volume and frequency. Sensitivity is raised and the threshold lowered for
    services whose technologies show rising exploitation probability per EPSS (Jacobs et al.) within 72
    hours of disclosure, focusing scrutiny where intelligence indicates imminent risk. The per-port count
    is tuned to local baseline. A positive result -- a connection surge from one source to a freshly disclosed-vulnerable
    service -- strongly suggests intelligence-driven mass scanning or exploitation; pivot to the destination
    service, patch state, and any successful sessions. A negative result is reassuring but slow or distributed
    scanning may evade the fixed count. References: [EPSS, Jacobs et al.](https://arxiv.org/pdf/1908.04856).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network Perimeter Firewalls, Demilitarized Zone (DMZ) services, Public IP address space'
  range: Last 90 days (focus 72h after disclosure)
  queries:
  - technology: Zeek/pseudocode
    query: "conn.log earliest=-5m\n  | stats count BY src_ip, dest_port\n  | eval thr = if(epss(service_for(dest_port))\
      \ rising within 72h of disclosure, 25, 100)\n  | where dest_port IN cti_associated_ports AND count\
      \ > thr\n  | alert"
- question: '[Reconnaissance] Can you track hourly unique source counts and connection volume per destination,
    alert when counts exceed three standard deviations above the 24-hour moving average, apply CUSUM/Bayesian
    online change-point detection to flag abrupt post-publication shifts, and profile blocked/refused-connection
    failure rates separately?'
  context: 'Under the Reconnaissance tactic (TA0043), an adversary leverages private threat-intelligence
    vendor data to plan targeting; because that purchase and search happens outside the victim''s visibility,
    the defensible signal is the inbound activity it enables. This Statistical Method watches hourly unique-source
    counts and connection volume per destination, alerting at 3 standard deviations above the 24-hour
    moving average, and applies CUSUM / Bayesian online change-point detection (Aminikhanghahi and Cook)
    to detect abrupt shifts that align with a vulnerability publication. Blocked/refused-connection (failure-mode)
    rates are profiled as a separate series, because a spike in refused connections often signals scanning
    of unavailable services. A positive result -- a sudden, statistically significant rise in unique sources
    or volume to a service right after a disclosure -- indicates coordinated, intelligence-driven targeting;
    pivot to the destination and sources. A negative result corroborates calm but should be read with
    the volume-spike and forecasting methods. References: [Aminikhanghahi and Cook](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5464762/).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network Perimeter Firewalls, Demilitarized Zone (DMZ) services, Public IP address space'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "conn.log | bin 1h | stats dc(src_ip) AS uniq, count AS vol BY dest, _time\n  | eventstats\
      \ avg(uniq) AS mu, stdev(uniq) AS sd OVER last 24h\n  | where uniq > mu + 3*sd\n  | append [ cusum(vol)\
      \ OR bayesian_cpd(vol) => change_point ]\n  | stats refused=count(eval(conn_state IN ('REJ','S0')))\
      \ BY dest\n  | alert"
- question: '[Reconnaissance] Can you forecast traffic volumes per service with Prophet or LSTM and flag
    anomalies exceeding prediction intervals after vulnerability disclosures, and use DeepLog-style sequence
    modeling of the recon-then-exploit chain to score improbable event transitions, returning the top-3
    deviating events?'
  context: 'Under the Reconnaissance tactic (TA0043), an adversary leverages private threat-intelligence
    vendor data to plan targeting; because that purchase and search happens outside the victim''s visibility,
    the defensible signal is the inbound activity it enables. This Machine Learning approach forecasts
    expected traffic volume with Prophet or an LSTM and flags observations outside the prediction interval
    following a disclosure, accounting for normal seasonality so a real post-disclosure surge stands out.
    DeepLog (Du et al.) sequence-models the recon-then-exploit chain, scoring how improbable an observed
    sequence of events is and returning the top-3 deviating events for explainability. A positive result
    -- volume beyond the forecast band plus an improbable recon-to-exploit event sequence -- is a strong
    signal of intelligence-driven attack progression; pivot to the service, sources, and subsequent host
    activity. A negative result complements the change-point and threshold methods. References: [DeepLog,
    Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network Perimeter Firewalls, Demilitarized Zone (DMZ) services, Public IP address space'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "yhat, lo, hi = prophet_or_lstm.forecast(volume[dest])\n  if observed > hi after disclosure:\
      \ flag volume_anomaly\n  seq_score = deeplog.score(event_sequence)   # recon->exploit transitions\n\
      \  if seq_score < p_threshold: alert(top3=deviating_events(seq))"
- question: '[Reconnaissance] Can you detect password spraying and credential-stuffing by alerting when
    a source IP records more than 10 failed logins against more than 5 distinct accounts within 10 minutes,
    and layer Sigma rules for NTLM brute force (EID 8004), Kerberos username enumeration (4768 result
    0x6), and Azure identity-protection password spray?'
  context: 'Under the Reconnaissance tactic (TA0043), an adversary leverages private threat-intelligence
    vendor data to plan targeting; because that purchase and search happens outside the victim''s visibility,
    the defensible signal is the inbound activity it enables. This Symbolic Logic approach detects high-volume
    credential attacks using breached credentials: it alerts when one source IP produces >10 failed logins
    against >5 accounts within 10 minutes (the classic spray pattern) and layers maintained Sigma rules
    -- NTLM Brute Force (EID 8004), Kerberos Manipulation (4768 with result 0x6 indicating username enumeration),
    and Azure Identity Protection Password Spray for cloud identity -- as a deterministic floor across
    on-prem and cloud. A positive result -- one IP hitting many accounts, or NTLM/Kerberos/cloud spray
    signatures firing -- indicates active credential abuse likely driven by a recent breach disclosure;
    pivot to the targeted accounts, any successful logons, and the source. A negative result reduces but
    does not remove concern about low-and-slow spraying. References: [Sigma: NTLM Brute Force](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/ntlm/win_susp_ntlm_brute_force.yml);
    [Sigma: Kerberos Manipulation](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_kerberos_manipulation.yml);
    [Sigma: Password Spray Activity](https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/azure/identity_protection/azure_identity_protection_password_spray.yml).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Domain Controllers, VPN servers, Single Sign-On (SSO) platforms, Externally accessible applications
    (e.g., Outlook Web Access)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "Win:EID(4625) earliest=-10m\n  | stats count AS fails, dc(target_user) AS accts BY src_ip\n\
      \  | where fails > 10 AND accts > 5\n  | alert\n  // layer Sigma: NTLM Brute Force (EID 8004); Kerberos\
      \ 4768 result=0x6; Azure password spray"
