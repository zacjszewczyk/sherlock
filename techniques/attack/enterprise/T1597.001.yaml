name: 'T1597.001: Threat Intel Vendors'
id: c42db2c6-fcd4-469c-a364-953890631c68
description: 'This playbook helps an analyst investigate whether an adversary has searched private threat
  intelligence vendor data (paid feeds or portals) for information usable in targeting the organization,
  and -- because that reconnaissance largely happens outside the victim''s visibility -- focuses on detecting
  the downstream activity that such intelligence enables (MITRE ATT&CK T1597.001, Threat Intel Vendors,
  under the Reconnaissance tactic). It hunts for inbound activity that suggests an actor is acting on
  freshly acquired intelligence: connection and authentication events from first-seen or threat-intel-listed
  external IPs and from credentials appearing on recent breach lists; HTTP requests carrying signatures
  of reconnaissance and vulnerability scanners (Nmap, masscan, zgrab, nuclei, Metasploit) against public-facing
  servers; statistically significant spikes in connection or scanning activity against a service or port
  within hours of a vulnerability disclosure; password-spraying and credential-stuffing against externally
  reachable authentication services using breached credentials; and targeted scanning or exploitation
  of specific assets shortly after those assets or their technologies are named in reports, press releases,
  or job postings. Detection methods combine deterministic symbolic-logic rules (threat-intel IP and credential
  correlation, scanner regexes, port-spike and watchlist alerts, password-spray/brute-force Sigma rules),
  statistical baselining (failure-ratio percentiles, SPRT/Threshold Random Walk, Chebyshev/chi-square
  HTTP modeling, CUSUM/Bayesian change-point detection, outlier and IQR thresholds), and machine learning
  (logistic-regression/gradient-boosting login risk scoring, autoencoder flow anomaly detection, traffic
  forecasting with Prophet/LSTM and DeepLog sequence modeling, and Random Forest credential-attack classification),
  applied across Zeek conn/dns/http/notice logs and Windows Security events (4624/4625), so the analyst
  can corroborate suspected intelligence-driven targeting against external IP reputation, breached credentials,
  scanner fingerprints, and disclosure timing.'
type: technique
