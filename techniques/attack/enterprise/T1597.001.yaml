- question: '[Reconnaissance] Can you alert when CTI-listed malicious IPs target watchlisted high-value
    assets (via Zeek conn.log), and prioritize assets whose underlying technologies show a rising EPSS
    exploitation probability after those assets appear in threat reports, press releases, or job postings?'
  context: 'Under the Reconnaissance tactic (TA0043), an adversary leverages private threat-intelligence
    vendor data to plan targeting; because that purchase and search happens outside the victim''s visibility,
    the defensible signal is the inbound activity it enables. This Symbolic Logic approach focuses on
