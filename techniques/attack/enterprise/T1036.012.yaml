name: 'T1036.012: Masquerading: Browser Fingerprint'
id: 2338747c-9b1d-4514-a89d-92a28961b66e
description: >-
  Investigate whether an adversary is masquerading browser-fingerprint data to blend malicious web traffic
  in with legitimate user browsing. This playbook helps an analyst detect spoofed User-Agent strings and
  other forged browser/system attributes (OS, platform, language, resolution, time zone, client hints)
  by testing cross-layer consistency rather than trusting any self-reported field. It guides the analyst
  to (1) compare the claimed User-Agent against the actual TLS client fingerprint (JA3/JA4), HTTP header
  order/case (JA4H), client hints, and endpoint asset inventory; (2) attribute outbound web requests to
  the initiating process so non-browser binaries (powershell.exe, wscript.exe, python, curl, wget) emitting
  browser User-Agents are surfaced; (3) detect tampering with browser profile/extension configuration
  tied to anti-detect or UA-override tooling; and (4) correlate fingerprint inconsistencies with connections
  to rare, newly registered, or anti-detect/fingerprinting service infrastructure. It combines deterministic
  signatures, statistical baselining of per-host identity physics, and machine-learning models that weight
  non-spoofable channels (TLS stack, process lineage, timing cadence) over forgeable strings.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: >-
    For each web session leaving the enterprise, does the browser claimed in the HTTP User-Agent string
    actually match the underlying TLS client fingerprint (JA3/JA4) and the HTTP header order/case (JA4H)
    for that browser family?
  context: >-
    Every self-reported browser field (User-Agent, client hints) is trivially forgeable, but the TLS ClientHello
    stack and HTTP header ordering produced by a real browser engine are much harder to fake. Compute
    JA3/JA4 from Zeek ssl.log and JA4H from http.log, then test whether a UA advertising, say, Chrome
    is presenting a non-Chrome TLS ClientHello or non-browser header ordering. A mismatch is the canonical
    robust signal that an adversary practicing Stealth is spoofing browser identity to blend C2 or exfiltration
    traffic with normal browsing. A positive result (UA family != TLS/JA4H family) is high-fidelity; a
    negative result means the advertised identity is internally consistent across layers, though it does
    not by itself prove benignity.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 1
  - 'NAI: User browser endpoints and DMZ web proxy sensors'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: >-
      join ssl.log (ja3, ja4) and http.log (user_agent, ja4h) on uid/community_id

      | derive ua_family = classify_browser(user_agent)

      | derive tls_family = classify_browser_from_ja4(ja4)

      | where ua_family != tls_family OR ja4h_header_order NOT IN expected_order[ua_family]

      | emit src_ip, user_agent, ja3, ja4, ja4h, dest
- question: >-
    Does any observed User-Agent conflict with the known operating system of the originating asset, contain
    known reconnaissance/tool substrings, or violate canonical browser version-token syntax?
  context: >-
    Maintain a deterministic rule set as the detection floor: (1) flag UA/OS combinations that conflict
    with endpoint inventory (a Windows asset presenting Safari/macOS or iOS signatures), (2) flag recon/tool
    UA substrings such as curl, wget, python-requests, nikto, sqlmap, masscan, and (3) flag malformed
    or implausible UA version tokens that do not match canonical browser strings. For a Stealth-focused
    adversary, these watchlists catch lazy or commodity spoofing where the attacker did not align the
    UA with the host OS or used an off-the-shelf tool default. Keep these concrete watchlists and tune
    thresholds; do not delete entries. A hit is a strong lead; absence does not rule out a more careful
    spoof, which the TLS-mismatch checks are designed to catch.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 1
  - 'NAI: User browser endpoints and DMZ web proxy sensors'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      enrich web_logs with asset_inventory.os by src_ip

      | where ua_os != asset.os
         OR user_agent MATCHES /(curl|wget|python-requests|nikto|sqlmap|masscan)/i
         OR NOT user_agent MATCHES canonical_ua_regex
      | emit src_ip, user_agent, asset.os, reason
- question: >-
    When a host emits a browser User-Agent or initiates HTTP/S traffic, is the initiating process actually
    a browser, or is it a non-browser binary (powershell.exe, wscript.exe, python.exe, curl.exe) with
    no GUI browser in its process ancestry?
  context: >-
    First-party process attribution defeats UA spoofing because the originating image cannot be forged
    in the local endpoint log. Correlate Sysmon Event ID 3 (network connection) records to Event ID 1
    (process create) lineage and alert when a non-browser binary emits a browser User-Agent or opens an
    HTTP/S connection with no msedge.exe/chrome.exe/firefox.exe in its parent chain. For an adversary
    pursuing Stealth, this exposes implants and scripts that hard-code legitimate-looking User-Agents
    but run outside any real browser. A positive result (browser UA from a script host with no browser
    ancestry) is high-confidence malicious or at least policy-violating; a negative means the traffic
    genuinely originated from a browser process.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 1
  - 'NAI: User browser endpoints and DMZ web proxy sensors'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      join sysmon_eid3 (Image, DestinationIp, dest_port) with sysmon_eid1 (ProcessGuid, Image, ParentImage
      chain)

      | where dest_port IN (80,443,8080) AND Image NOT IN browser_images

      | where ProcessGuid lineage has no ancestor IN browser_images

      | where network.user_agent IN browser_ua_set

      | emit host, Image, ParentImage, DestinationIp, user_agent
- question: >-
    Do outbound HTTP requests match known Cobalt Strike Malleable C2 header sets, header ordering, or
    URI patterns that hard-code legitimate-looking User-Agents?
  context: >-
    Apply regex signatures for spoofed-browser HTTP header sets, header ordering, and URI patterns characteristic
    of Cobalt Strike Malleable C2 profiles. These profiles deliberately present browser-like User-Agents
    alongside attacker-defined header arrangements and URIs to remain Stealthy. Matching curated Malleable
    C2 indicators gives a concrete, defensible signal against a common offensive toolkit. A match strongly
    suggests framework C2; tune the signature set to your environment to manage false positives from legitimate
    apps that mimic browser headers.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 1
  - 'NAI: User browser endpoints and DMZ web proxy sensors'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: >-
      from http.log

      | where header_set MATCHES malleable_c2_header_regex
         OR uri MATCHES malleable_c2_uri_regex
         OR header_order IN known_c2_orderings
      | emit src_ip, host, uri, user_agent, header_order
- question: >-
    Over a rolling 30-day baseline, does any host show abnormal variability in its web identity physics,
    such as an excessive count of distinct User-Agents, distinct JA4 (TLS) values, distinct JA4H header-orderings,
    or client-hint permutations per hour?
  context: >-
    Maintain per-host 30-day baselines of identity physics and flag hosts above the 98th percentile of
    variability or with abrupt shifts in a short window. Real browsers churn their JA3 due to GREASE/TLS
    extension randomization, so baseline on JA4 (which sorts extensions) to distinguish UA-stable/JA3-churning
    genuine browsers from UA-churning spoofing hosts. For Stealth, an adversary rotating fingerprints
    to dodge detection produces unnatural identity volatility. Derive thresholds per network segment from
    observed distributions. A host spiking above baseline warrants investigation; a stable host is consistent
    with normal browsing.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 1
  - 'NAI: User browser endpoints and DMZ web proxy sensors'
  range: Last 90 days (30-day rolling baseline; flag short-window deviations)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      from web_logs span=1h by src_ip

      | stats dcount(user_agent) as ua_n, dcount(ja4) as tls_n, dcount(ja4h) as hdr_n, dcount(client_hints)
      as ch_n

      | join baseline_p98 by src_ip, network_segment

      | where ua_n>p98_ua OR tls_n>p98_tls OR hdr_n>p98_hdr OR abrupt_shift(ua_n)

      | emit src_ip, ua_n, tls_n, hdr_n
- question: >-
    Are there User-Agent/attribute sets that are implausibly common across many hosts (mass-spoofed identical
    identities) or internally inconsistent, and do suspect hosts show elevated HTTP 4xx/403, blocked-connection,
    or TLS-handshake failure rates compared to human browsing?
  context: >-
    Score fingerprint plausibility using entropy/uniqueness so that identical User-Agents replicated across
    many hosts (mass spoofing) or internally inconsistent attribute sets stand out. As a distinct signal,
    profile per-host failure-mode rates: automation that spoofs UAs often produces elevated HTTP error
    ratios (4xx/403), blocked connections, and TLS handshake failures versus human browsing baselines.
    For a Stealth adversary, a fleet sharing one forged identity or an implant probing endpoints both
    deviate from the natural diversity and success rates of real users. High uniqueness anomalies or elevated
    failure ratios are leads for deeper triage.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 1
  - 'NAI: User browser endpoints and DMZ web proxy sensors'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      from web_logs

      | stats dcount(src_ip) as host_spread by user_agent

      | where host_spread > mass_spoof_threshold

      | append (from web_logs by src_ip | stats err_ratio=avg(status>=400), tls_fail_ratio=avg(tls_handshake_failed)
      | where err_ratio>p95 OR tls_fail_ratio>p95)

      | emit user_agent, host_spread, src_ip, err_ratio, tls_fail_ratio
- question: >-
    Using a supervised classifier on TLS handshake and flow features, can each client be statistically
    labeled as a genuine browser or a non-browser client regardless of the User-Agent it claims?
  context: >-
    Train a supervised classifier on TLS handshake and flow features (offered cipher suites, extension
    lists/counts, advertised versions, record sizes, flow metadata) that separate genuine browsers from
    non-browser clients independent of the UA claim. Because spoofing replicates UA/client-hint strings
    exactly but not the TLS stack, this model catches careful spoofers that pass simple checks. Surface
    the top-3 contributing features (e.g., cipher-list mismatch, extension count, JA4 value) in the alert
    text so an analyst can validate. For Stealth, a client claiming Chrome but classified as non-browser
    by its TLS features is a strong masquerading indicator.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 1
  - 'NAI: User browser endpoints and DMZ web proxy sensors'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      features = [cipher_suites, ext_list, ext_count, tls_versions, record_sizes, flow_meta]

      label = browser_classifier.predict(features)

      if label == 'non_browser' and user_agent in browser_ua_set:
          alert(src_ip, ua=user_agent, top3=browser_classifier.explain(features)[:3])
- question: >-
    Does a sequence anomaly model of each host's normal web identity pattern (UA, JA4, JA4H, client hints,
    destination class, timing) flag masquerading-like volatility on a non-lab host?
  context: >-
    Train a sequence anomaly model on normal per-host web identity patterns and alert when scores indicate
    masquerading-like volatility on a production (non-lab) host. Weight non-spoofable channels (TLS stack,
    process lineage, timing cadence) above self-reported strings, because spoofing replicates UA/client-hint
    fields exactly. Output the top-3 contributing features for triage. For a Stealth adversary cycling
    identities to evade detection, the temporal pattern of fingerprint change is itself anomalous even
    when each individual field looks plausible. High sequence-anomaly scores on real user endpoints are
    prioritized leads.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 1
  - 'NAI: User browser endpoints and DMZ web proxy sensors'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      seq = order_by_time(host_sessions[ua, ja4, ja4h, client_hints, dest_class, interarrival])

      score = seq_anomaly_model.score(seq, weights={tls:high, lineage:high, timing:high, ua:low})

      if score > threshold and host not in lab_assets:
          alert(host, score, top3=seq_anomaly_model.explain(seq)[:3])
- question: >-
    Are there writes to browser profile or extension artifacts containing anti-fingerprint, UA-override,
    or spoofing-related keys, and are those writes followed by a browser launch/load by the same user,
    especially when the writing parent process is a script host, remote shell, or unsigned executable?
  context: >-
    Anti-detect and UA-spoofing tooling forges all self-reported fields, so the configuration write plus
    the resulting cross-layer UA/TLS inconsistency is the durable signal. Detect writes (Sysmon Event
    ID 11 / Windows Event ID 4663) to browser profile and extension paths containing anti-fingerprint,
    UA-override, or spoofing-related keys, then correlate to a subsequent browser launch or extension
    load by the same user. Escalate when the parent process is a script host, remote shell, or unsigned
    executable rather than the legitimate browser updater. For a Stealth adversary, this captures the
    moment the browser identity is deliberately reconfigured before evasive browsing. Such a write originating
    from a non-updater process is high-suspicion.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - 'NAI: Endpoint AppData/Library directories and managed extension stores'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      from sysmon_eid11 OR win_eid4663

      | where TargetFilename MATCHES browser_profile_path AND content_or_name MATCHES /(anti.?detect|ua.?override|spoof|fingerprint)/i

      | join process_create on user/time where ParentImage IN (script_hosts, remote_shells, unsigned)

      | correlate forward 10m with browser_launch by same_user

      | emit host, user, TargetFilename, ParentImage
- question: >-
    Does any host show an abnormal spike, first-seen modification, or unusual burst of browser profile/extension
    writes shortly before suspicious outbound sessions, including denied (access-denied) write attempts?
  context: >-
    Baseline per-host write counts and file-change cadence for browser profile paths, then alert on three-sigma
    spikes, first-seen modified files, or unusual bursts occurring shortly before suspicious outbound
    sessions. Explicitly track failed/denied writes (Event ID 4663 access-denied) as a distinct signal
    of attempted tampering. For a Stealth adversary, a sudden change in how often the browser configuration
    is touched, particularly right before evasive traffic, indicates deliberate identity manipulation.
    Derive thresholds from each host's own observed update cadence so routine browser auto-updates do
    not dominate. Spikes, novel files, or denied writes are investigative leads.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - 'NAI: Endpoint AppData/Library directories and managed extension stores'
  range: Last 90 days (per-host baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      from file_writes where path MATCHES browser_profile_path by host span=1d

      | stats writes=count(), new_files=dcount_first_seen(TargetFilename), denied=count(status=='ACCESS_DENIED')

      | join host_baseline

      | where writes > mean+3*stddev OR new_files>0 OR denied>0

      | correlate with suspicious_outbound within 30m

      | emit host, writes, new_files, denied
- question: >-
    Can a classifier using file-path, process-ancestry, signer-trust, and temporal-proximity features
    distinguish malicious browser-fingerprint manipulation from routine browser updates?
  context: >-
    Train a classifier using file-path features, process ancestry, signer trust, and temporal proximity
    to web-traffic fingerprint anomalies, then surface the top-3 contributing features (e.g., unsigned
    parent, anti-detect extension key, proximity to a UA/JA3 mismatch) in the alert. This separates malicious
    fingerprint manipulation from benign browser-update activity that also writes profile files. For a
    Stealth adversary, configuration changes made by untrusted processes and timed close to fingerprint
    anomalies in network traffic are the discriminating pattern. A high-confidence classification with
    explanatory features is an actionable lead.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - 'NAI: Endpoint AppData/Library directories and managed extension stores'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      features = [file_path, parent_image, parent_signer_trust, time_to_ua_tls_mismatch, ext_key_class]

      label = config_change_model.predict(features)

      if label == 'malicious':
          alert(host, user, top3=config_change_model.explain(features)[:3])
- question: >-
    Does a host already flagged for a UA-vs-TLS/JA4 inconsistency also query known fingerprinting, bot-automation,
    or anti-detect service domains within a bounded time window?
  context: >-
    Alert when a host with a UA-vs-TLS/JA4 inconsistency detection also queries known fingerprinting,
    bot-automation, or anti-detect service domains within a bounded time window. This couples a robust
    local masquerade signal with destination intelligence, sharply reducing false positives. For a Stealth
    adversary, contacting infrastructure built to defeat fingerprinting alongside an actual fingerprint
    inconsistency on the same host is a strong, corroborated indicator of deliberate browser-identity
    spoofing. Pair the two signals on src_ip within a tight window for high-confidence alerting.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points, DNS resolvers, and authentication servers'
  range: Last 90 days (correlate within bounded window, e.g., +/- 1 hour)
  queries:
  - technology: Zeek/pseudocode
    query: >-
      let masq_hosts = hosts_with_ua_tls_mismatch(last=24h)

      from dns.log JOIN conn.log

      | where src_ip IN masq_hosts AND query IN (fingerprinting_domains, automation_domains, antidetect_domains)

      | where abs(dns.ts - mismatch.ts) <= 1h

      | emit src_ip, query, answers, dest
- question: >-
    Following fingerprint anomalies, is a host connecting to bottom-1-percentile rare destinations, first-seen
    domains, or newly registered domains, and does it show elevated NXDOMAIN or connection-failure rates?
  context: >-
    Maintain per-host destination frequency and domain-age baselines and flag bottom-1-percentile destinations,
    first-seen domains, or newly registered domains following fingerprint anomalies. Profile NXDOMAIN
    and connection-failure rates as a distinct failure-mode signal, since spoofing/automation infrastructure
    often produces elevated resolution and connection failures versus normal browsing. For a Stealth adversary,
    evasive browsing frequently reaches throwaway or freshly registered infrastructure, and tooling probing
    many endpoints generates failed lookups. Rare/new destinations or high failure ratios appearing after
    a fingerprint anomaly are corroborating leads.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points, DNS resolvers, and authentication servers'
  range: Last 90 days (per-host destination/domain-age baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      from dns.log,conn.log by src_ip

      | enrich domain_age, first_seen, host_dest_freq

      | where dest_freq_pctile < 1 OR first_seen==true OR domain_age_days < 30

      | stats nxdomain_ratio=avg(rcode=='NXDOMAIN'), conn_fail_ratio=avg(conn_state IN failed_states)

      | where (post_fingerprint_anomaly) OR nxdomain_ratio>p95 OR conn_fail_ratio>p95

      | emit src_ip, dest, domain_age_days, nxdomain_ratio, conn_fail_ratio
- question: >-
    Does an LSTM/transformer anomaly detector trained on combined DNS, HTTP, and TLS session sequences
    produce high reconstruction error that coincides with fingerprint-inconsistency indicators on a host?
  context: >-
    Train an LSTM/transformer anomaly detector on combined DNS, HTTP, and TLS session sequences for normal
    browsing, then alert when high reconstruction error coincides with fingerprint-inconsistency indicators,
    reporting the top-3 contributing features (e.g., rare destination, UA/JA3 mismatch, off-hours cadence)
    for triage. This multi-signal model catches evasive sessions that no single deterministic rule would
    flag. For a Stealth adversary blending traffic, the joint deviation across DNS, HTTP, and TLS sequences
    combined with a fingerprint inconsistency is a high-value, corroborated indicator. Prioritize alerts
    where reconstruction error and fingerprint mismatch co-occur.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points, DNS resolvers, and authentication servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      seq = combine_sessions(dns.log, http.log, ssl.log) by host ordered_by_time

      err = seq2seq_model.reconstruction_error(seq)

      if err > threshold and host in fingerprint_inconsistent_hosts:
          alert(host, err, top3=seq2seq_model.explain(seq)[:3])
