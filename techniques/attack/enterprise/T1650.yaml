name: 'T1650: Acquire Access'
id: 5f9e3bbc-16bb-4f6d-b721-772c616b789f
description: 'This playbook helps an analyst investigate whether an adversary has purchased or otherwise
  acquired existing access to the enterprise environment and is now exercising that foothold (MITRE ATT&CK
  T1650, Acquire Access, under the Resource Development tactic TA0042). Initial access brokers and online
  marketplaces sell footholds into previously compromised networks -- valid credentials harvested in breaches,
  planted web shells, or established External Remote Services sessions (VPN/RDP/Citrix) -- letting a buyer
  skip the work of gaining their own initial foothold and move straight to later-stage objectives. Because
  the acquisition itself happens outside the victim''s visibility, this playbook concentrates on the observable
  use of brokered access inside the enterprise. It pursues that behavior from several complementary angles:
  matching authentication events (Windows Event IDs 4624/4625) against CTI breached-credential exposure
  feeds; detecting credential-stuffing and password-spray bursts where one source IP fails against many
  accounts; flagging successful logins from high-risk or geographically implausible IP/ASN sources; correlating
  the first post-breach login with subsequent privilege-escalation events (4732/4728/4672) and DNS anomalies;
  and catching web-server processes that spawn command shells, indicating activation of a planted web
  shell. Detection methods combine deterministic symbolic-logic rules (CTI feed intersection, threshold-based
  stuffing detection, TOR/proxy reputation, impossible-travel geofeasibility, web-shell child-process
  rules), statistical baselining (per-user ASN/geo and login-frequency profiles, entropy and change-point
  analysis, weighted session risk scoring, rare child-process profiling), and machine learning (XGBoost
  login and child-process classifiers, Seasonal Hybrid ESD forecasting, Isolation Forest outlier detection,
  LSTM-autoencoder session sequence modeling) -- with explainability (SHAP/LIME) surfaced so analysts
  see why each alert fired. Telemetry spans Windows Security logs and Zeek conn/dns/http logs across externally-facing
  authentication services, domain controllers, VPN concentrators, and web servers, so suspected use of
  acquired access can be corroborated across identity, network, and host evidence.'
type: technique
