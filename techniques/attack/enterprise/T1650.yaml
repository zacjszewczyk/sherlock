    a single source IP targeting many user accounts within a short window, captured along with Zeek conn.log
    metadata, signals the adversary validating or abusing acquired credentials before committing to access.
    This Symbolic Logic approach works as follows: Alert whenever a single source IP triggers more than
    50 failed Windows Event ID 4625 (or 4771) logins against distinct usernames in any 5-minute window,
    tagging the event with Zeek conn.log metadata and the failed/locked-out state for triage. Derive the
    per-environment threshold from the 99.9th percentile of historical distinct-user failure counts; retain
    the hard floor and tune upward only ([Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html);
