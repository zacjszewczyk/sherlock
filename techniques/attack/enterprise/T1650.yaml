questions:
- question: '[Resource Development] Match CTI breached credentials: Can you determine whether a successful
    or failed authentication event (Windows Event ID 4624 or 4625) uses a username listed in broker-focused
    credential exposure feeds, providing direct evidence that previously acquired credentials are being
    exercised to gain entry to the enterprise. -- specifically, using the ''Match CTI breached credentials''
    (Symbolic Logic) approach to identify use of adversary-acquired access?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary leverages access
    they bought or otherwise acquired from an initial access broker rather than compromising the network
    themselves, then exercises that foothold to enter and operate inside the enterprise. This evidence
    focuses on the observation that A successful or failed authentication event (Windows Event ID 4624
    or 4625) uses a username listed in broker-focused credential exposure feeds, providing direct evidence
    that previously acquired credentials are being exercised to gain entry to the enterprise. This Symbolic
    Logic approach works as follows: Ingest CTI/breach credential exposure feeds via privacy-preserving
    set intersection ([Thomas et al.](https://www.usenix.org/conference/usenixsecurity19/presentation/thomas))
    and correlate matched usernames against BOTH successful (Windows Event ID 4624) and failed (Windows
    Event ID 4625) logins from domain controllers and VPN concentrators. Alert with username, source IP,
    success/fail state, and session metadata; treat a matched failed-then-success sequence on the same
    account within 24h as high severity, surfacing the broker-supplied access path ([Splunk Security Content
    T1078](https://github.com/splunk/security_content)). A positive result -- a rule match, a statistical
    outlier, or a model alert -- is strong evidence that previously acquired access is being used; pivot
    to the account, source IP/ASN, host, and session involved, confirm against the originating broker/breach
    context, and scope what the actor did next (privilege changes, lateral movement, data access). A negative
    result helps rule out this particular vector for the window examined but should be corroborated with
    the other questions in this playbook, since brokered access can also surface as low-and-slow validation,
    living-off-the-land use of valid accounts, or activation of a planted web shell that a single method
    may miss.'
  answer_sources:
  - Windows Event ID 4624
