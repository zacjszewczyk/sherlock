- question: '[Resource Development] Detect credential stuffing bursts: Can you determine whether a burst
    of failed authentication events (Windows Event ID 4625) from a single source IP targeting many user
    accounts within a short window, captured along with Zeek conn.log metadata, signals the adversary
    validating or abusing acquired credentials before committing to access. -- specifically, using the
    ''Detect credential stuffing bursts'' (Symbolic Logic) approach to identify use of adversary-acquired
    access?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary leverages access
    they bought or otherwise acquired from an initial access broker rather than compromising the network
    themselves, then exercises that foothold to enter and operate inside the enterprise. This evidence
