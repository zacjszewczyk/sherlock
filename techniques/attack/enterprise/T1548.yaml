questions:
- question: '[Privilege Escalation] Hash IOC correlation: Can you determine whether a Sysmon Event ID
    1 (Process Creation) event is logged for a process whose executable file hash, such as SHA256, matches
    a known malicious hash from a threat-intelligence feed specializing in privilege-escalation tools
    like UACMe, Watson, or Juicy Potato, and the parent or command-line context reinforces the suspicious
    use of the binary. -- specifically, using the ''Hash IOC correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Privilege Escalation tactic (TA0004), the core mission question
    is: "Has the adversary successfully escalated privileges using elevation control mechanisms?" Hash
    IOC correlation is a native elevation-control abuse (T1548) primitive an adversary uses to move from
    unprivileged to high-integrity, SYSTEM, root, or cloud-admin context without dropping obvious exploit
    artifacts. This evidence focuses on the condition that a Sysmon Event ID 1 (Process Creation) event
    is logged for a process whose executable file hash, such as SHA256, matches a known malicious hash
    from a threat-intelligence feed specializing in privilege-escalation tools like UACMe, Watson, or
    Juicy Potato, and the parent or command-line context reinforces the suspicious use of the binary.
    This Symbolic Logic approach works as follows: Query Sysmon Event ID 1 logs to match the ''Hashes''
    field (SHA256) against a threat-intelligence list of known privilege-escalation tool hashes (UACMe,
    Watson, Juicy/Rogue/Sweet Potato, PrintSpoofer). Generate a critical alert on match, including process
    details, parent process, command line, integrity level, and user context, per ATT&CK T1548 procedure
    guidance [MITRE ATT&CK T1548](https://attack.mitre.org/techniques/T1548/). An analyst is looking for
    the deviation this method surfaces, corroborating it against the surrounding process lineage, user/integrity
    context, registry or IAM changes, and any subsequent escalation-to-action behavior tied to this NAI
    (Domain Controllers, Privileged Access Workstations (PAWs), Critical Application Servers, Developer
    Workstations). A positive result -- a deterministic match, a statistical outlier, or a model alert
    -- is a strong indicator that an elevation-control mechanism was abused to gain higher privileges;
    pivot to the responsible process/identity, its parent and children, the integrity/token transition,
    and any follow-on network, file, or policy-change activity to scope the escalation. A negative result
    helps rule out this specific vector but should be corroborated with the other questions in this playbook,
    since a single method can miss low-and-slow, signed-binary, or living-off-the-land escalation.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Privileged Access Workstations (PAWs), Critical Application Servers, Developer
    Workstations'
  range: Last 90 days (correlate process/file/network within event-centered 10-minute windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Hash IOC correlation

      source IN [Windows Event ID 4688, Sysmon Event ID 1]

      | WHERE matches_action_criteria("Hash IOC correlation")

      | ALERT enrich(host, user, integrity_level, parent_image, image, command_line, target_object, dest)

      // Query Sysmon Event ID 1 logs to match the ''Hashes'' field (SHA256) against a threat-intelligence
      list of known privilege-escalation tool hashes (UACMe, Watson, J'
