name: 'T1548: Abuse Elevation Control Mechanism'
id: 642d920c-767e-41e6-a1d0-35504c421d54
description: 'This playbook helps an analyst investigate whether an adversary has abused a native elevation-control
  mechanism (T1548) to gain higher-level permissions as part of the Privilege Escalation tactic, spanning
  Windows, Linux, macOS, and cloud (AWS/IaaS and Identity Provider) environments. It guides the hunt across
  the full elevation-abuse surface: execution of known privilege-escalation tooling matched to threat
  intelligence (UACMe, Watson, Juicy/Rogue/Sweet Potato, PrintSpoofer) and rare/unsigned binary prevalence;
  Windows UAC-bypass auto-elevation chains (fodhelper.exe, eventvwr.exe, computerdefaults.exe, sdclt.exe)
  and UAC registry tampering (EnableLUA, ConsentPromptBehaviorAdmin); SYSTEM-integrity processes with
  anomalous parents, named-pipe/token impersonation, service ImagePath hijacks, high-to-low process injection,
  and unsigned DLL loads by critical system processes; escalation-to-network correlation where a freshly
  elevated shell beacons outbound; Linux setuid/sudo/pkexec abuse (including PwnKit CVE-2021-4034) observed
  in auditd; macOS AuthorizationExecuteWithPrivileges / security_authtrampoline elevation; and AWS CloudTrail
  / IdP permission-flow escalation (PassRole, AttachUserPolicy, CreatePolicyVersion, cross-account AssumeRole).
  Detection methods combine deterministic symbolic-logic rules, statistical baselining (prevalence/rarity,
  entropy, percentile and standard-deviation outliers, failure-rate and forecast anomalies), and machine-learning
  models (Random Forests, Isolation Forest/One-Class SVM, autoencoders, LSTM/DeepLog sequence models,
  and provenance-graph GNNs) applied to Windows Event ID 4688/4657/4672/4697/7045, Sysmon Event ID 1/3/7/8/10/13,
  Linux auditd SYSCALL/EXECVE and auth.log, macOS unified log and Endpoint Security events, AWS CloudTrail,
  and Zeek conn/dns/ssl/files logs, so the analyst can corroborate suspected privilege escalation across
  process lineage, integrity/token transitions, registry/IAM change, and egress context.'
type: technique
related:
- tactic_id: TA0004
  tactic_name: Privilege Escalation
