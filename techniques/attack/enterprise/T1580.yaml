name: 'T1580: Cloud Infrastructure Discovery'
id: e6b9ad59-fd4b-433f-8ee0-0e6a44547b52
description: >-
  This playbook helps an analyst investigate whether an adversary is performing Cloud Infrastructure Discovery
  (T1580) -- enumerating the compute, storage, and database resources of an IaaS environment to map available
  assets and identify high-value targets before acting. Adversaries use provider APIs and CLI tools (e.g.,
  AWS DescribeInstances/ListBuckets/HeadBucket/GetPublicAccessBlock/DescribeDBInstances, az vm list, gcloud
  compute instances list) and open-source tooling (Pacu, CloudMapper, ScoutSuite, CloudSploit) -- often
  with compromised access keys -- to learn what resources exist and how to reach them. The hunt spans
  five evidence angles: (1) network connections to cloud API endpoints from IPs on high-confidence threat-intelligence
  feeds, anonymizing proxies, or untrusted ASNs/geolocations; (2) endpoint process creation invoking known
  cloud-discovery tooling or unbranded CLI/SDK user agents; (3) discovery commands executed by identities
  or hosts outside the authorized cloud-admin allow-list; (4) single identities or source IPs exceeding
  rate or failure thresholds for Describe/List/Get calls (burst enumeration and AccessDenied/404 sweeps);
  and (5) identities enumerating an anomalously broad set of distinct service types or all regions/wildcard
  resources relative to their narrow baseline. Detection methods combine symbolic-logic rules (TI/IP-ASN
  floors, tool regex, role allow-lists, rate and failure-burst thresholds, wildcard-region rules), statistical
  baselining (median+MAD modified z-scores, entropy scoring, first-seen novelty, service×region rarity,
  time-series forecasting), and machine learning (connection classifiers, command-line language models,
  IAM graph/GNN embeddings, link-prediction, and provenance-graph learning) across Zeek network logs,
  Windows process-creation events, and cloud management-plane (CloudTrail-style) audit logs, so the analyst
  can corroborate suspected reconnaissance against source reputation, identity baselines, command context,
  and downstream activity.
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
