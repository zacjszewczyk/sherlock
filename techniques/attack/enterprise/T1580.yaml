questions:
- question: >-
    [Discovery] Cloud API TI correlation: Can you determine whether A TCP connection to a known cloud
    provider API endpoint (e.g., ec2.us-east-1.amazonaws.com) originates from a source IP address present
    on a high-confidence threat intelligence feed of known malicious actors, anonymizing proxies (e.g.,
    TOR exit nodes), or unusual hosting providers. -- specifically, using the 'Cloud API TI correlation'
    (Symbolic Logic) approach?
  context: >-
    Why this matters: Under the Discovery tactic (TA0007), the information requirement is "Is the adversary
    attempting to discover our cloud infrastructure to map available resources and identify high-value
    targets?" Cloud Infrastructure Discovery (T1580) is how an adversary maps an IaaS environment -- enumerating
    compute instances, snapshots, volumes, storage buckets, and database resources via provider APIs or
    CLI tools -- to find high-value targets and plan persistence, privilege escalation, or data theft.
    Because these Describe/List/Get calls are also legitimate administrative activity, they must be evaluated
    against baselines, identity context, and source reputation. This evidence focuses on the condition
    that A TCP connection to a known cloud provider API endpoint (e.g., ec2.us-east-1.amazonaws.com) originates
    from a source IP address present on a high-confidence threat intelligence feed of known malicious
    actors, anonymizing proxies (e.g., TOR exit nodes), or unusual hosting providers. This Symbolic Logic
    approach works as follows: Correlate Zeek ssl.log/conn.log for cloud API server_names (e.g., ec2.*.amazonaws.com,
    s3.amazonaws.com, management.azure.com, compute.googleapis.com) with source IPs on high-confidence
    TI feeds (TOR exits, anonymizing proxies, untrusted hosting ASNs) and alert on matches; keep this
    deterministic IP/ASN allow/deny floor and translate portable cloud rules from [SigmaHQ](https://github.com/SigmaHQ/sigma).
    A positive result -- a rule match, statistical outlier, or model alert -- is evidence that an identity,
    host, or source IP may be enumerating cloud infrastructure for reconnaissance; pivot to the implicated
    principal/identity and its IAM role, the source IP/ASN/region and any TI hits, the specific services
    and regions enumerated, the ratio of AccessDenied/NoSuchBucket errors to successes, and any downstream
    actions such as snapshot creation, instance modification, or making a bucket public. A negative result
    helps rule out this discovery vector on the inspected telemetry but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy, low-and-slow, or workflow-aligned
    enumeration.
  answer_sources: &id001
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - >-
    NAI: Internet Egress Points, DNS Resolvers, Network Security Monitoring (NSM) sensor locations
  range: Last 90 days (correlate related events within minutes-to-hours windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      # Cloud API TI correlation

      source IN [Zeek conn.log, Zeek ssl.log, Zeek dns.log]

      | WHERE matches_action_criteria("Cloud API TI correlation")

      // Correlate Zeek ssl.log/conn.log for cloud API server_names (e.g., ec2.*.amazonaws.com, s3.amazonaws.com,
      manag

      | ALERT enrich(principal, identity, src_ip, asn, region, api_action, service, resource, nai)
  - technology: Zeek/pseudocode
    query: >-
      # cloud API discovery network analysis

      conn.log, ssl.log, dns.log

      | FILTER server_name ~ cloud API endpoints (ec2.*.amazonaws.com, s3.amazonaws.com, management.azure.com,
      compute.googleapis.com)

      | AGG per (id.orig_h, ASN, country, server_name, JA3) novelty, rarity, volume, TI matches

      | flag matches/outliers per the action criteria
- question: >-
    [Discovery] Geolocation rarity scoring: Can you determine whether A TCP connection to a known cloud
    provider API endpoint (e.g., ec2.us-east-1.amazonaws.com) originates from a source IP address present
    on a high-confidence threat intelligence feed of known malicious actors, anonymizing proxies (e.g.,
    TOR exit nodes), or unusual hosting providers. -- specifically, using the 'Geolocation rarity scoring'
    (Statistical Method) approach?
  context: >-
    Why this matters: Under the Discovery tactic (TA0007), the information requirement is "Is the adversary
    attempting to discover our cloud infrastructure to map available resources and identify high-value
    targets?" Cloud Infrastructure Discovery (T1580) is how an adversary maps an IaaS environment -- enumerating
    compute instances, snapshots, volumes, storage buckets, and database resources via provider APIs or
    CLI tools -- to find high-value targets and plan persistence, privilege escalation, or data theft.
    Because these Describe/List/Get calls are also legitimate administrative activity, they must be evaluated
    against baselines, identity context, and source reputation. This evidence focuses on the condition
    that A TCP connection to a known cloud provider API endpoint (e.g., ec2.us-east-1.amazonaws.com) originates
    from a source IP address present on a high-confidence threat intelligence feed of known malicious
    actors, anonymizing proxies (e.g., TOR exit nodes), or unusual hosting providers. This Statistical
    Method approach works as follows: Score each source IP's country/ASN frequency per 24h against a 30-day
    per-principal baseline and flag new origins below the 5th percentile or with a median+MAD modified
    z-score >3.5 to resist seasonal/automation spikes, per [Automatic Anomaly Detection in the Cloud Via
    Statistical Learning](https://arxiv.org/abs/1704.07706); include Volume (bytes to API endpoint), Frequency
    (connections/min), and State (TLS handshake success vs reset) features. A positive result -- a rule
    match, statistical outlier, or model alert -- is evidence that an identity, host, or source IP may
    be enumerating cloud infrastructure for reconnaissance; pivot to the implicated principal/identity
    and its IAM role, the source IP/ASN/region and any TI hits, the specific services and regions enumerated,
    the ratio of AccessDenied/NoSuchBucket errors to successes, and any downstream actions such as snapshot
    creation, instance modification, or making a bucket public. A negative result helps rule out this
    discovery vector on the inspected telemetry but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or workflow-aligned enumeration.
  answer_sources: *id001
  range: Last 90 days (baseline 30-90 days; evaluate per-principal/short windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      # Geolocation rarity scoring

      source IN [Zeek conn.log, Zeek ssl.log, Zeek dns.log]

      | STATS baseline per (principal/identity/src_ip) over 30-90d

      | COMPUTE deviation (modified Z |Mz|>3.5 / first-seen / percentile / MAD)

      // Score each source IP's country/ASN frequency per 24h against a 30-day per-principal baseline
      and flag new orig

      | WHERE deviation > threshold | ALERT enrich(principal, src_ip, asn, api_action, service, resource)
