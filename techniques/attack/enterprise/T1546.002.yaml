- question: '[Persistence] Correlate ''.scr'' executions with network traffic: Can you determine whether
    a process creation log for an executable ending in ''.scr'' (Windows Event ID 4688) is temporally
    correlated within 60 seconds with a network connection log (Zeek conn.log) from the same host IP address
    to an external destination. -- specifically, using the ''Correlate ''.scr'' executions with network
    traffic'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Windows screensaver
    execution (.scr PE files triggered by user inactivity) and the HKCU\Control Panel\Desktop registry
    settings that control them to maintain a foothold that survives logoff, reboot, and credential changes.
    This evidence focuses on the condition that a process creation log for an executable ending in ''.scr''
    (Windows Event ID 4688) is temporally correlated within 60 seconds with a network connection log (Zeek
    conn.log) from the same host IP address to an external destination. The ''Correlate ''.scr'' executions
    with network traffic'' approach (Symbolic Logic) pursues this signal as follows: Join process creation
    (Windows Event ID 4688, ''NewProcessName'' ends in ''.scr'') with network connection logs (Zeek conn.log
    / Sysmon EID 3) on host IP with a timestamp delta < 60s. Generate a high-severity alert for any external
    connection because legitimate screensavers do not initiate network traffic ([Screensaver, MITRE ATT&CK](https://attack.mitre.org/techniques/T1546/002/)).
    Capture connection Volume (orig/resp bytes) and State, and treat blocked/refused connections (Failure
    Mode) as an equally strong signal of attempted C2. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates a .scr binary or its registry configuration is behaving in a
    way that legitimate, signed, System32-resident screensavers do not; pivot to the responsible process,
    its parent/child lineage, the modifying user and host, the on-disk .scr file (path, signer, hash),
    the associated registry values, and any subsequent network or sensitive-object activity. A negative
    result helps reduce confidence in this specific screensaver-abuse vector but should be corroborated
    against the other questions in this playbook, since any single method can miss stealthy, low-and-slow,
