    do not; pivot to the responsible process, its parent/child lineage, the modifying user and host, the
    on-disk .scr file (path, signer, hash), the associated registry values, and any subsequent network
    or sensitive-object activity. A negative result helps reduce confidence in this specific screensaver-abuse
    vector but should be corroborated against the other questions in this playbook, since any single method
    can miss stealthy, low-and-slow, or living-off-the-land tradecraft.'
  answer_sources:
  - Windows Event ID 4657
  - 'NAI: Endpoint registry monitoring logs on all Windows workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Score unusual registry writers (Statistical Method)

      writers = RegistryModify(last 90d, screensaver values)

      | summarize cnt=count() by writer_process

      # baseline normal writers: explorer.exe, rundll32.exe, systemsettings.exe

      | where percent_rank(cnt) < 0.05 OR writer_process not in (known_writers_95pct)

      # path randomness on SCRNSAVE.exe target

      | extend H = shannon_entropy(NewValue), kl = kl_divergence(NewValue, benign_path_dist)

      | where H > mean_H + 2*std_H

      # per-host write-count anomaly

      | extend mz = 0.6745*(x - median(x))/MAD(x) | where abs(mz) > 3.5

      | emit alert(host, writer_process, NewValue, H, mz)'
