    can miss stealthy, low-and-slow, or living-off-the-land tradecraft.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoint process execution logs on all Windows workstations and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "# Score '.scr' executions via XGBoost (Machine Learning)\nfeatures = featurize(ProcessCreation\
      \ where NewProcessName endswith '.scr',\n    [path_tokens, path_entropy, signer_status, parent_process,\
      \ command_line, user_context])\nmodel = load('xgboost_scr_classifier')        # trained on labeled\
      \ benign/malicious .scr\nscored = model.predict_proba(features)\n| where p_malicious > 0.9\n| extend\
      \ top3 = shap_top_features(model, features, 3)   # e.g. path=AppData, unsigned, rare-parent\n| emit\
      \ alert(host, NewProcessName, p_malicious, top3)"
- question: '[Persistence] Alert on non-system screensaver paths: Can you determine whether a registry
    modification log (Windows Event ID 4657) shows the value of ''HKCU\Control Panel\Desktop\SCRNSAVE.exe''
    being set to a path outside of ''%SystemRoot%\System32\'' or ''%SystemRoot%\SysWOW64\'', or shows
    ''HKCU\Control Panel\Desktop\ScreenSaverIsSecure'' being set to ''0''. -- specifically, using the
    ''Alert on non-system screensaver paths'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Windows screensaver
    execution (.scr PE files triggered by user inactivity) and the HKCU\Control Panel\Desktop registry
    settings that control them to maintain a foothold that survives logoff, reboot, and credential changes.
    This evidence focuses on the condition that a registry modification log (Windows Event ID 4657) shows
    the value of ''HKCU\Control Panel\Desktop\SCRNSAVE.exe'' being set to a path outside of ''%SystemRoot%\System32\''
    or ''%SystemRoot%\SysWOW64\'', or shows ''HKCU\Control Panel\Desktop\ScreenSaverIsSecure'' being set
    to ''0''. The ''Alert on non-system screensaver paths'' approach (Symbolic Logic) pursues this signal
    as follows: Monitor registry writes (Windows Event ID 4657 / Sysmon EID 13) to ''...\Control Panel\Desktop\SCRNSAVE.exe''
    and alert when the new Data value does not begin with ''C:\\Windows\\System32\\'' or ''C:\\Windows\\SysWOW64\\''.
    Add companion rules for ''...\ScreenSaverIsSecure'' set to ''0'' (disables lock), ''...\ScreenSaveActive''
    newly set to ''1'', and ''...\ScreenSaveTimeout'' lowered to a short interval (e.g., < 60s) — the
    full enable-and-weaken combination characteristic of this technique ([Screensaver, MITRE ATT&CK](https://attack.mitre.org/techniques/T1546/002/),
    [SigmaHQ](https://github.com/SigmaHQ/sigma)). A positive result -- a rule match, statistical outlier,
    or model alert -- indicates a .scr binary or its registry configuration is behaving in a way that
    legitimate, signed, System32-resident screensavers do not; pivot to the responsible process, its parent/child
    lineage, the modifying user and host, the on-disk .scr file (path, signer, hash), the associated registry
    values, and any subsequent network or sensitive-object activity. A negative result helps reduce confidence
    in this specific screensaver-abuse vector but should be corroborated against the other questions in
    this playbook, since any single method can miss stealthy, low-and-slow, or living-off-the-land tradecraft.'
  answer_sources:
  - Windows Event ID 4657
  - 'NAI: Endpoint registry monitoring logs on all Windows workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Alert on non-system screensaver paths (Symbolic Logic)\nreg = RegistryModify(EventID in\
      \ [4657, Sysmon 13])\n| where TargetObject endswith 'Control Panel\\\\Desktop\\\\SCRNSAVE.exe'\n\
      | where not (NewValue startswith 'C:\\\\Windows\\\\System32\\\\'\n          or NewValue startswith\
      \ 'C:\\\\Windows\\\\SysWOW64\\\\')\n# companion rules for the enable-and-weaken combination\n| union\
      \ (reg where TargetObject endswith 'ScreenSaverIsSecure' and NewValue == '0')\n| union (reg where\
      \ TargetObject endswith 'ScreenSaveActive'   and NewValue == '1')\n| union (reg where TargetObject\
      \ endswith 'ScreenSaveTimeout'  and toint(NewValue) < 60)\n| emit alert(host, user, process, TargetObject,\
      \ NewValue)"
- question: '[Persistence] Score unusual registry writers: Can you determine whether a registry modification
    log (Windows Event ID 4657) shows the value of ''HKCU\Control Panel\Desktop\SCRNSAVE.exe'' being set
    to a path outside of ''%SystemRoot%\System32\'' or ''%SystemRoot%\SysWOW64\'', or shows ''HKCU\Control
    Panel\Desktop\ScreenSaverIsSecure'' being set to ''0''. -- specifically, using the ''Score unusual
    registry writers'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Windows screensaver
