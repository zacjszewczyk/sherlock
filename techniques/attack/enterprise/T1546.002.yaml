questions:
- question: '[Persistence] Match known malicious .scr hashes: Can you determine whether a process creation
    log (Windows Event ID 4688) indicates a new process with an image path ending in ''.scr'' whose file
    hash matches a known malicious indicator from a threat intelligence source. -- specifically, using
    the ''Match known malicious .scr hashes'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Windows screensaver
    execution (.scr PE files triggered by user inactivity) and the HKCU\Control Panel\Desktop registry
    settings that control them to maintain a foothold that survives logoff, reboot, and credential changes.
    This evidence focuses on the condition that a process creation log (Windows Event ID 4688) indicates
    a new process with an image path ending in ''.scr'' whose file hash matches a known malicious indicator
    from a threat intelligence source. The ''Match known malicious .scr hashes'' approach (Symbolic Logic)
    pursues this signal as follows: Query process creation events (Windows Event ID 4688 / Sysmon EID
    1) where ''NewProcessName'' ends in ''.scr''. Retrieve the SHA256 and cross-reference a threat-intel
    feed of known-malicious screensaver hashes (e.g., Turla Gazer payload IOCs from [Gazer, ESET](https://web-assets.esetstatic.com/wls/2017/08/eset-gazer.pdf));
    generate a high-severity alert on a match. Because legitimate screensavers are signed and reside in
    System32/SysWOW64, also alert when a ''.scr'' image is unsigned or its signature fails verification,
    per [Screensaver, MITRE ATT&CK](https://attack.mitre.org/techniques/T1546/002/). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates a .scr binary or its registry configuration
    is behaving in a way that legitimate, signed, System32-resident screensavers do not; pivot to the
    responsible process, its parent/child lineage, the modifying user and host, the on-disk .scr file
    (path, signer, hash), the associated registry values, and any subsequent network or sensitive-object
    activity. A negative result helps reduce confidence in this specific screensaver-abuse vector but
    should be corroborated against the other questions in this playbook, since any single method can miss
    stealthy, low-and-slow, or living-off-the-land tradecraft.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoint process execution logs on all Windows workstations and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Match known malicious .scr hashes (Symbolic Logic)\nevents = ProcessCreation(EventID in\
      \ [4688, Sysmon 1])\n| where NewProcessName endswith '.scr'\n| lookup ti_screensaver_iocs on SHA256\
      \          # Gazer/Turla payloads, etc.\n| where ti_match == true OR signed == false OR signature_status\
      \ != 'Valid'\n| where not (NewProcessName startswith 'C:\\\\Windows\\\\System32\\\\'\n         \
      \ or NewProcessName startswith 'C:\\\\Windows\\\\SysWOW64\\\\')\n| emit alert(severity='High', host,\
      \ user, NewProcessName, SHA256, ti_source)"
- question: '[Persistence] Flag rare ''.scr'' hashes: Can you determine whether a process creation log
    (Windows Event ID 4688) indicates a new process with an image path ending in ''.scr'' whose file hash
    matches a known malicious indicator from a threat intelligence source. -- specifically, using the
    ''Flag rare ''.scr'' hashes'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Windows screensaver
    execution (.scr PE files triggered by user inactivity) and the HKCU\Control Panel\Desktop registry
    settings that control them to maintain a foothold that survives logoff, reboot, and credential changes.
    This evidence focuses on the condition that a process creation log (Windows Event ID 4688) indicates
    a new process with an image path ending in ''.scr'' whose file hash matches a known malicious indicator
    from a threat intelligence source. The ''Flag rare ''.scr'' hashes'' approach (Statistical Method)
    pursues this signal as follows: Aggregate ''.scr'' executions by SHA256 across the enterprise over
    a 30-day baseline and compute execution frequency (count and number of distinct hosts). Flag any hash
    below the 5th percentile of frequency or seen on a single host. To resist imaging/batch skew, also
    apply the robust modified Z-score to per-host daily ''.scr'' execution counts and alert when |0.6745*(x-median)/MAD|
    > 3.5 ([Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    This rare-relationship baselining mirrors [CAR-2014-11-002, MITRE CAR](https://car.mitre.org/analytics/CAR-2014-11-002/).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a .scr binary
    or its registry configuration is behaving in a way that legitimate, signed, System32-resident screensavers
    do not; pivot to the responsible process, its parent/child lineage, the modifying user and host, the
    on-disk .scr file (path, signer, hash), the associated registry values, and any subsequent network
    or sensitive-object activity. A negative result helps reduce confidence in this specific screensaver-abuse
    vector but should be corroborated against the other questions in this playbook, since any single method
    can miss stealthy, low-and-slow, or living-off-the-land tradecraft.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Endpoint process execution logs on all Windows workstations and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Flag rare ''.scr'' hashes (Statistical Method)

      base = ProcessCreation(last 30d) | where NewProcessName endswith ''.scr''

      | summarize cnt=count(), hosts=dcount(host) by SHA256

      | extend pctile = percent_rank(cnt)

      | where pctile < 0.05 OR hosts == 1            # rare across enterprise / single-host

      # robust per-host daily counts

      daily = base | summarize x=count() by host, bin(ts,1d)

      | extend mz = 0.6745*(x - median(x)) / MAD(x)

      | where abs(mz) > 3.5

      | emit alert(SHA256, cnt, hosts, mz)'
- question: '[Persistence] Score ''.scr'' executions via XGBoost: Can you determine whether a process
