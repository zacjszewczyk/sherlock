    Track per-host write counts with the modified Z-score ([Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a .scr binary
