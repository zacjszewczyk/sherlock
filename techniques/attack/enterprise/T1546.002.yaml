    and [Obfuscated Command Line Detection Using ML, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).
    Score new ''.scr'' executions; alert on high-confidence malicious predictions and include the top-3
