  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Endpoint process execution logs on all Windows hosts and network traffic logs from core network
    sensors or egress points.'
  range: Last 90 days; pivot to a +/- 60 second window around each .scr execution for event-centered correlation
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Correlate ''.scr'' executions with network traffic (Symbolic Logic)

      proc = ProcessCreation(4688) | where NewProcessName endswith ''.scr''

      net  = Zeek_conn  (or Sysmon 3)

      join proc, net on host_ip where abs(net.ts - proc.ts) < 60s and net.dest is external

      | extend volume = orig_bytes + resp_bytes, state = conn_state

      # refused/blocked (S0/REJ) treated as equally strong attempted-C2 signal

      | emit alert(severity=''High'', host, NewProcessName, dest_ip, dest_port, volume, state)'
