    screensavers do not; pivot to the responsible process, its parent/child lineage, the modifying user
    and host, the on-disk .scr file (path, signer, hash), the associated registry values, and any subsequent
    network or sensitive-object activity. A negative result helps reduce confidence in this specific screensaver-abuse
