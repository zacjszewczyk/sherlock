name: 'T1546.002: Screensaver'
id: 2823e8e3-6b39-4ac7-89d8-f67dcb8e1618
description: 'This playbook helps an analyst investigate whether an adversary is abusing Windows screensaver
  functionality (T1546.002) to gain persistence (TA0003) and/or escalate privileges (TA0004) by executing
  malicious content triggered by user inactivity. Screensavers are Portable Executable (PE) files with
  a .scr extension; legitimate ones are signed and ship under %SystemRoot%\System32 and %SystemRoot%\SysWOW64,
  while their behavior is governed by registry values under HKCU\Control Panel\Desktop (SCRNSAVE.exe,
  ScreenSaveActive, ScreenSaverIsSecure, ScreenSaveTimeout). The playbook guides the hunt across several
  behavioral angles: matching .scr executions against known-malicious screensaver hashes (e.g., Turla/Gazer
  payloads) and flagging unsigned binaries; detecting registry tampering that points SCRNSAVE.exe at non-system
  paths, enables the screensaver, disables the lock requirement, or shortens the inactivity timeout; correlating
  .scr executions with outbound network connections that legitimate screensavers never make; spotting
  .scr binaries running from user-writable directories (Users, AppData, Temp, Downloads, ProgramData);
  and, for privilege escalation, analyzing .scr process lineage for credential-theft tooling (Mimikatz,
  BadPotato, PrintSpoofer), anomalous command-line arguments, spawning of command shells/scripting engines
  or integrity-level jumps, and attempts to access sensitive objects such as LSASS memory, the SAM hive,
  ntds.dit, and HKLM\SECURITY. Each angle is pursued with symbolic-logic rules, statistical baselining/anomaly
  detection (rare-frequency, entropy/KL-divergence, modified Z-score, time-series decomposition), and
  machine-learning models (gradient-boosted classifiers, one-class/Isolation Forest outlier scoring, DBSCAN
  clustering, autoencoders, sequence/LSTM and provenance-graph learning) applied to Windows Security/Sysmon
  events, registry and object-access auditing, and Zeek network telemetry.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
