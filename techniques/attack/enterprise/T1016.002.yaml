name: 'T1016.002: Wi-Fi Discovery'
id: 2ac57c95-f0b5-4f76-bfb8-42e7c590d8bf
description: Investigate adversary attempts to discover Wi-Fi network information — saved profile names
  and especially cleartext passwords/PSKs — on compromised Windows, Linux, and macOS hosts. Adversaries
  harvest Wi-Fi credentials to support account discovery, remote system discovery, lateral movement, and
  follow-on credential access. This playbook helps an analyst hunt for the deterministic command patterns
  used to enumerate and dump Wi-Fi secrets (netsh wlan show profiles / netsh wlan show profile <name>
  key=clear and wlanAPI.dll calls on Windows, reads of /etc/NetworkManager/system-connections/* on Linux,
  and security find-generic-password / keychain extraction on macOS). It correlates these against known
  credential-theft tooling hashes, anomalous parent-child process lineage (office apps or browsers spawning
  netsh/powershell), rare per-user/per-host behavior, and downstream data staging or network egress that
  may indicate exfiltration of harvested Wi-Fi data. Symbolic, statistical, and machine-learning approaches
  are provided for each evidence stream so a SOC analyst can triage both sophisticated external actors
  and commodity malware such as Agent Tesla.
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is any process executing from a binary whose SHA256 hash matches a threat-intelligence feed
    of known Wi-Fi credential-theft tooling (e.g., Agent Tesla and its variants)?
  context: 'This is the fastest, highest-confidence path to confirming Wi-Fi Discovery during the Discovery
    tactic: commodity infostealers such as Agent Tesla bundle Wi-Fi credential harvesting. Continuously
    monitor process creation (Windows Event ID 4688 and Sysmon Event ID 1), compute the SHA256 of each
    newly executed image, and join it against a curated threat-intel feed of credential-theft tooling.
    A match is a high-severity, low-false-positive signal. Because hashes churn as malware is recompiled,
    anchor detection to the deterministic command strings these tools invoke (netsh wlan show profile
    * key=clear, documented in Atomic Red Team T1016.002) so coverage survives hash changes. A positive
    result warrants immediate host isolation and credential rotation; a negative result does not rule
    out living-off-the-land use of native tooling.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - 'NAI: All corporate endpoints, with a focus on mobile devices (laptops) and workstations of users
    with privileged network access.'
  range: Last 90 days, with continuous/real-time evaluation on new process creation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'proc = events(EventID IN [4688, "Sysmon:1"]); h = sha256(proc.image);

      ALERT severity=high WHERE h IN threatintel_feed("wifi_cred_theft")

      OR proc.command_line MATCHES /netsh\s+wlan\s+show\s+profile.*key=clear/i;

      OUTPUT host, user, proc.image, h, proc.command_line, parent_image.'
- question: Among executed binaries that are not on the organizational allowlist, which have unusually
    low prevalence (rare/first-seen) AND spawn netsh/security with Wi-Fi arguments?
  context: 'Novel or rare binaries are a classic Discovery-stage tell because targeted tooling is deployed
    to few hosts. Compute, over a 30-day rolling window, the prevalence (count of unique hosts that executed
    each non-allowlisted hash) and flag hashes in the bottom 1st percentile — derive the exact cutoff
    from your own host count. Rarity alone is noisy, so pair it with the rare-parent baseline of CAR-2014-11-002:
    a low-prevalence binary that also spawns netsh or security with Wi-Fi arguments is high priority.
    Also track state by counting execution failures/blocks per hash, which is itself a distinct signal
    of attempted-but-thwarted tooling. A positive result is a rare binary tied to Wi-Fi enumeration; investigate
    delivery vector and lateral spread.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - 'NAI: All corporate endpoints, with a focus on mobile devices (laptops) and workstations of users
    with privileged network access.'
  range: Last 90 days; prevalence computed over a 30-day rolling window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'win = last_30d(); prev = count_distinct(host) BY sha256 WHERE allowlisted=false;

      cutoff = percentile(prev, 1);

      rare = prev WHERE prev <= cutoff;

      ALERT WHERE sha256 IN rare AND child_or_self_cmd MATCHES

      /(netsh\s+wlan|security\s+find-generic-password)/i;

      ALSO count(exec_status IN [blocked,failed]) BY sha256 AS attempt_signal.'
- question: What reputation score does a supervised file-hash model assign to newly observed binaries,
    and which features (prevalence, signer, first/last-seen, association with Wi-Fi discovery command-lines)
    drive a suspicious/malicious verdict?
  context: When neither an exact threat-intel hash match nor a simple rarity rule fires, a supervised
    reputation model generalizes across the Discovery tactic. Train Logistic Regression or Gradient Boosting
    on features such as hash prevalence, first/last-seen timestamps, code-signing/signer status, and whether
    the binary is associated with Wi-Fi discovery command-lines, then classify each newly observed hash
    as benign/suspicious/malicious to prioritize analyst review. Surface the top-3 contributing features
    per alert via SHAP so triage is explainable. A high malicious probability on an unsigned, rare binary
    that issues netsh key=clear is strong corroboration; benign-but-suspicious scores feed a watchlist
    rather than an immediate page.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - 'NAI: All corporate endpoints, with a focus on mobile devices (laptops) and workstations of users
    with privileged network access.'
  range: Last 90 days for scoring; model trained on a longer historical corpus.
  queries:
  - technology: ML/pseudocode
    query: 'features = [prevalence, first_seen, last_seen, signer_status, signed,

      assoc_wifi_cmdline]; model = load("hash_reputation_gbm");

      score = model.predict_proba(features); label = bucket(score);

      ALERT WHERE label IN [suspicious, malicious]

      OUTPUT host, sha256, score, top3=shap_top_features(model, features).'
- question: Is any process command line or PowerShell script block executing native Wi-Fi enumeration
    or cleartext-key retrieval, such as 'netsh wlan show profiles' or 'netsh wlan show profile <name>
    key=clear'?
  context: 'Living-off-the-land Wi-Fi Discovery uses signed native tooling, so command-line content is
    the primary signal. Build a high-fidelity rule over process command lines (Event ID 4688) and PowerShell
    script blocks (Event ID 4104) matching Wi-Fi discovery, e.g. /(netsh|powershell).*wlan.*(show|get).*(profile|key=clear)/i.
    Mirror the abbreviation-tolerant logic of the SigmaHQ netsh Wi-Fi harvesting rule so you catch shortened
    forms like ''netsh wlan s p k=clear''. Elevate priority when the command originates from a non-IT
    account or an interactive logon. Set the frequency floor low: a single key=clear / show profile *
    retrieval should alert immediately because legitimate bulk cleartext dumps are rare. A positive on
    a standard-user workstation is far more suspicious than on a known IT admin host.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Corporate endpoints (laptops, desktops), Helpdesk and IT administrator workstations.'
  range: Last 90 days; alert immediately on any single match.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'evt = events(EventID IN [4688, 4104]);

      ALERT WHERE evt.command_line MATCHES

      /(netsh|powershell).*wlan.*(show|get).*(profile|key\s*=\s*clear)/i

      OR evt.script_block MATCHES /wlan.*(s(how)?\s+p(rofile)?).*(k(ey)?\s*=\s*clear)/i;

      RAISE priority WHERE user NOT IN it_admins OR logon_type=interactive.'
- question: For each user-host pair, does a Wi-Fi discovery command coincide with netsh/powershell execution
    above the user's 95th-percentile frequency, a first-ever 'wlan ... key=clear', or peer-group-anomalous
    behavior?
  context: A signature rule can miss novel phrasing, so baseline behavior per user-host to catch anomalies
    during the Discovery tactic. Over 30 days, establish per user-host the daily execution count of netsh.exe
    and powershell.exe (frequency) and the entropy/style of their command-line arguments. Alert when a
    Wi-Fi discovery command coincides with execution frequency above the user's 95th percentile, the first-ever
    use of 'wlan ... key=clear', or peer-group-anomalous behavior (Microsoft Sentinel UEBA). Use context-aware
    rare-tuple scoring of (user, host, command) per the Context-based irregular activity detection method,
    which surfaces the contributing attributes for triage. A first-ever cleartext-key retrieval by an
    account that has never touched wlan tooling is a strong, explainable lead.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Corporate endpoints (laptops, desktops), Helpdesk and IT administrator workstations.'
  range: Last 90 days; per user-host baseline over a 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = last_30d() GROUP BY user, host;\np95 = percentile(base.netsh_powershell_per_day, 95);\n\
      ALERT WHERE wifi_discovery_cmd AND (\n  today_count > p95\n  OR first_ever(user, host, /wlan.*key=clear/)\n\
      \  OR peer_group_anomaly(user, command)\n);\nSCORE rare_tuple(user, host, command) AND emit contributing_attributes."
- question: Does a sequence model (HMM or LSTM) show Wi-Fi discovery commands appearing in an anomalous
    behavioral context, such as immediately after a document was opened from email or just before a connection
    to a newly observed domain?
  context: Wi-Fi Discovery is rarely an isolated act; its surrounding command sequence reveals intent.
    Learn per-role command sequences with a Hidden Markov Model or an LSTM next-event model and flag Wi-Fi
    discovery that appears in an improbable context — for example, right after a macro-enabled document
    is opened from email, or immediately before a connection to a never-before-seen domain. This contextual
    anomaly distinguishes benign IT troubleshooting (where wlan commands sit among other admin tasks)
    from exploitation chains. Report the top-3 sequence features driving the score for explainability.
    A high-anomaly sequence linking document execution to Wi-Fi key dumping is a strong indicator of an
    external actor's post-exploitation discovery.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Corporate endpoints (laptops, desktops), Helpdesk and IT administrator workstations.'
  range: Last 90 days; sequences modeled per role over recent history.
  queries:
  - technology: ML/pseudocode
    query: 'seq = ordered_process_events(host, user, window=session);

      model = load("cmd_sequence_lstm_per_role");

      anom = model.surprisal(seq) WHERE event == wifi_discovery_cmd;

      ALERT WHERE anom > role_threshold AND preceding_context IN

      [doc_from_email, new_domain_connection];

      OUTPUT host, user, top3=feature_attribution(model, seq).'
- question: Is a Wi-Fi discovery command (netsh/powershell wlan) being spawned by an unusual parent process
    such as WINWORD.EXE, EXCEL.EXE, OUTLOOK.EXE, chrome.exe, or AcroRd32.exe?
  context: Office applications, browsers, and PDF readers do not normally launch network-configuration
    utilities, so an unusual parent->child lineage strongly suggests exploitation-driven Discovery. Trigger
    when a process creation event (Event ID 4688 / Sysmon 1) shows a non-standard parent (WINWORD.EXE,
    EXCEL.EXE, OUTLOOK.EXE, chrome.exe, AcroRd32.exe, etc.) spawning a child running netsh wlan or PowerShell
    with Wi-Fi discovery arguments, applying the parent-allowlist logic of the Sigma Unusual Parent Process
    for cmd rule. A positive result is a classic macro/exploit-to-LOLBIN chain and should be triaged as
    likely compromise; benign hits are rare and usually trace to packaged automation that can be allowlisted.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - 'NAI: Corporate endpoints (laptops, desktops), Servers running user-facing applications.'
  range: Last 90 days; alert in near real time.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'evt = events(EventID IN [4688, "Sysmon:1"]);

      bad_parents = [WINWORD.EXE, EXCEL.EXE, POWERPNT.EXE, OUTLOOK.EXE,

      chrome.exe, msedge.exe, AcroRd32.exe, firefox.exe];

      ALERT WHERE evt.parent_image IN bad_parents

      AND evt.command_line MATCHES /(netsh\s+wlan|powershell.*wlan)/i.'
- question: Over a 30-day baseline, does a Wi-Fi discovery execution occur under a parent->child process
    pair in the bottom 1st percentile of enterprise frequency (e.g., WINWORD.EXE -> cmd.exe -> netsh.exe)?
  context: Rather than relying on a static parent allowlist, quantify how rare a given process lineage
    is across the enterprise. Over a 30-day baseline, compute the frequency of all unique parent->child
    pairs and alert when a Wi-Fi discovery execution occurs under a pair in the bottom 1st percentile
    of observed frequency (e.g., WINWORD.EXE -> cmd.exe -> netsh.exe), following the rare-parent baseline
    of CAR-2014-11-002. Derive the percentile cutoff from your own process-tree corpus so the threshold
    reflects your environment. This catches novel exploitation chains that a hardcoded list would miss.
    A Wi-Fi key dump under an extremely rare lineage is high-priority Discovery evidence.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - 'NAI: Corporate endpoints (laptops, desktops), Servers running user-facing applications.'
  range: Last 90 days; parent->child frequency baselined over 30 days.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = last_30d(); freq = count(*) BY (parent_image, child_image);

      cutoff = percentile(freq, 1);

      ALERT WHERE wifi_discovery_cmd

      AND freq[(parent_image, child_image)] <= cutoff;

      OUTPUT host, user, parent_image, child_image, command_line, freq.'
- question: Does a process-lineage classifier (Random Forest/XGBoost) label a netsh/powershell Wi-Fi discovery
    event as suspicious-lineage rather than benign-admin, and which features drive that verdict?
  context: Frequency baselines treat all rare lineages equally; a learned classifier weighs many lineage
    signals together to separate benign administration from malicious Discovery. Train an XGBoost (or
    Random Forest) classifier on parent name, parent integrity level, child name, command-line, and parent->child
    probability/graph features (per ProblemChild) to label netsh/powershell discovery events as benign-admin
    vs suspicious-lineage. Emit the top-3 SHAP feature importances in the alert text so analysts understand
    the call. A suspicious-lineage verdict on a low-integrity parent spawning a Wi-Fi key dump is a strong,
    explainable lead; benign-admin verdicts can be deprioritized for IT hosts.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - 'NAI: Corporate endpoints (laptops, desktops), Servers running user-facing applications.'
  range: Last 90 days; model trained on longer historical lineage data.
  queries:
  - technology: ML/pseudocode
    query: 'features = [parent_name, parent_integrity, child_name, command_line,

      parent_child_prob, graph_features]; model = load("problemchild_xgb");

      label = model.predict(features);

      ALERT WHERE label == suspicious_lineage AND child_cmd MATCHES /wlan/i

      OUTPUT host, top3=shap_top_features(model, features).'
- question: Within a short window (under ~5 minutes) after a Wi-Fi discovery command, does the same host
    write command output to a file, connect outbound to a blocklisted IP, or resolve a malicious domain?
  context: Discovery often immediately precedes staging and exfiltration, so temporal correlation elevates
    a single command into a confirmed kill-chain segment. Correlate a Wi-Fi discovery command (Event ID
    4688) followed within 5 minutes on the same host by (a) a file-create from the same process (Sysmon
    Event ID 11), (b) an outbound connection (Zeek conn.log) to a blocklisted IP, or (c) a malicious-domain
    DNS query (Zeek dns.log). Corroborate with network-side ATT&CK Discovery notices from BZAR. A positive
    correlation indicates the harvested Wi-Fi data is being collected and likely sent out, warranting
    containment; absence of follow-on activity suggests reconnaissance without (yet) observed exfiltration.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 11 (FileCreate)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate endpoints (laptops, desktops), Network egress points (e.g., firewalls, proxies), DNS
    servers.'
  range: Last 90 days; correlation window of 5 minutes after each discovery command.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "d = events(EventID=4688) WHERE command_line MATCHES /wlan.*(profile|key=clear)/i;\nFOR each\
      \ d: WITHIN 5m SAME host AND (\n  filecreate(Sysmon:11, same_proc=d.proc)\n  OR conn(Zeek conn.log).dest_ip\
      \ IN blocklist\n  OR dns(Zeek dns.log).query IN malicious_domains\n) -> ALERT severity=high; enrich\
      \ with BZAR discovery notices."
- question: After a Wi-Fi discovery command, does the host exceed its 99th-percentile outbound volume
    to a single destination, resolve a bottom-1%-prevalence domain, or show regular beaconing within 10
    minutes?
  context: 'Statistical baselining of network behavior catches exfiltration that does not match any blocklist.
    Per host, baseline outbound volume (bytes per destination) and domain-request frequency over 30 days.
    After a Wi-Fi discovery command, alert if within 10 minutes the host (a) sends bytes to a single destination
    above its 99th percentile, (b) resolves a bottom-1%-prevalence domain, or (c) shows regular beacon
    timing (low coefficient-of-variation / Bowley skewness) per RITA-J. Track the failure mode too: spikes
    in NXDOMAIN or blocked-connection counts are a distinct exfil-attempt signal, using the entropy/volume
    plus failure features described by Nadler et al. A post-discovery volume spike to a rare destination
    is strong evidence of data theft following Discovery.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 11 (FileCreate)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate endpoints (laptops, desktops), Network egress points (e.g., firewalls, proxies), DNS
    servers.'
  range: Last 90 days; per-host network baseline over 30 days, 10-minute post-event correlation.
  queries:
  - technology: Zeek/pseudocode
    query: 'base = last_30d() BY host; vol99 = percentile(base.bytes_out_per_dest, 99);

      rare_dom = domains WHERE prevalence <= percentile(prevalence, 1);

      AFTER wifi_discovery_cmd WITHIN 10m:

      ALERT WHERE bytes_out_to_dest > vol99

      OR dns.query IN rare_dom

      OR beacon_score(conn) high (low CoV / Bowley skew)

      OR spike(NXDOMAIN_count) OR spike(blocked_conn_count).'
- question: Does a time-series anomaly model (ARIMAX/LSTM) flag a significant anomaly in per-host network
    telemetry after a Wi-Fi discovery command that is not explained by normal seasonality?
  context: Simple thresholds miss slow or seasonally-masked exfiltration, so model the host's network
    telemetry as a time series with the Wi-Fi discovery command as an exogenous event. Run an ARIMAX or
    LSTM model on per-host series (bytes_out, unique_destinations, connection_count, NXDOMAIN_count) and
    raise a high-priority alert on a significant post-event anomaly unexplained by seasonality. Report
    the top-3 contributing series for explainability via SHAP. This ties Discovery to downstream Exfiltration
    even when absolute volumes look normal for the time of day. A significant model anomaly immediately
    after a Wi-Fi key dump strongly corroborates malicious intent.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 11 (FileCreate)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate endpoints (laptops, desktops), Network egress points (e.g., firewalls, proxies), DNS
    servers.'
  range: Last 90 days; time-series models fit on longer per-host history.
  queries:
  - technology: ML/pseudocode
    query: 'series = per_host_timeseries([bytes_out, unique_dest, conn_count, nxdomain]);

      model = load("arimax_or_lstm"); exog = wifi_discovery_event;

      resid = model.forecast_residual(series, exog);

      ALERT WHERE resid > seasonal_threshold AND post_event

      OUTPUT host, top3=contributing_series(model).'
- question: On Linux, is any non-NetworkManager process reading /etc/NetworkManager/system-connections/*,
    or on macOS is the security/keychain tooling being used to extract Wi-Fi passwords?
  context: On Linux and macOS, Wi-Fi secrets live in known files and the keychain, so direct access to
    them is the core Discovery signal. On Linux (auditd PATH/EXECVE), alert on any non-NetworkManager
    process reading /etc/NetworkManager/system-connections/* — these files hold cleartext or hashed PSKs.
    On macOS, alert on /usr/bin/security Wi-Fi/keychain extraction (find-generic-password -w/-g, dump-keychain,
    find-certificate/export) per the Sigma keychain-credentials rule, especially when launched from a
    non-interactive shell or a non-admin user. A positive result is a direct attempt to read stored Wi-Fi
    credentials; correlate with the acting user and parent process to judge whether it is administrative
    or adversarial.
  answer_sources:
  - Linux auditd logs
  - macOS Endpoint Security Framework logs
  - 'NAI: Linux servers and workstations, macOS endpoints.'
  range: Last 90 days; alert in near real time.
  queries:
  - technology: auditd/pseudocode
    query: 'ALERT WHERE auditd(PATH).name STARTSWITH "/etc/NetworkManager/system-connections/"

      AND syscall IN [open, openat, read]

      AND exe NOT IN [NetworkManager, nm-applet, nmcli_admin_allowlist];

      OUTPUT host, uid, exe, comm, file.'
  - technology: macOS ESF/pseudocode
    query: 'ALERT WHERE esf.exec.path == "/usr/bin/security"

      AND argv MATCHES /(find-generic-password\s+-[wg]|dump-keychain|find-certificate)/i

      AND (shell_non_interactive OR user NOT IN admins);

      OUTPUT host, user, argv, parent_path.'
- question: Is a user or process accessing /etc/NetworkManager/ (Linux) or running the security command
    (macOS) for the first time ever, or above the user's 95th-percentile frequency?
  context: 'Baselining per-user access to Wi-Fi credential stores distinguishes routine administration
    from adversarial Discovery. Baseline per-user file-access to /etc/NetworkManager/ on Linux and security
    usage on macOS; alert on first-ever access by a user or process, or on usage above the user''s 95th-percentile
    frequency, scored as a rare (user, file/command) tuple per the Context-based irregular activity detection
    method and peer-group anomaly per Microsoft Sentinel UEBA. Profile state too: count denied/failed
    reads (EACCES) as a distinct enumeration-attempt signal that indicates probing under insufficient
    privilege. A first-ever read of the PSK store by a service account is a strong lead.'
  answer_sources:
  - Linux auditd logs
  - macOS Endpoint Security Framework logs
  - 'NAI: Linux servers and workstations, macOS endpoints.'
  range: Last 90 days; per-user baseline over a 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = last_30d() BY user; p95 = percentile(base.nm_or_security_access_per_day, 95);

      ALERT WHERE first_ever(user, target IN [/etc/NetworkManager/, security_cmd])

      OR today_count > p95

      OR peer_group_anomaly(user, target);

      ALSO count(result == EACCES) BY user AS attempt_signal.'
- question: Does an unsupervised anomaly model (One-Class SVM / Isolation Forest) trained on benign privileged-user
    behavior flag Wi-Fi config access or keychain extraction as anomalous?
  context: When labeled malicious data is scarce, model only benign behavior and flag deviations — ideal
    for privileged accounts on Linux/macOS during the Discovery tactic. Train a One-Class SVM or Isolation
    Forest on benign privileged-user command and file-access patterns and score new activity in near real
    time, flagging Wi-Fi config access or keychain extraction as anomalous. One-Class SVM offers robustness
    under adversarial/poisoned baselines, and LIME/SHAP attribution (per the isolation-forest/OCSVM IoT
    study) surfaces the top-3 features per alert. An anomalous score for a privileged user suddenly reading
    NetworkManager PSKs or dumping the keychain is a strong, explainable indicator worth immediate triage.
  answer_sources:
  - Linux auditd logs
  - macOS Endpoint Security Framework logs
  - 'NAI: Linux servers and workstations, macOS endpoints.'
  range: Last 90 days; model trained on longer benign privileged-user history.
  queries:
  - technology: ML/pseudocode
    query: 'model = load("ocsvm_or_isolation_forest_privileged");

      feat = activity_features(user, [command, file_access]);

      score = model.decision_function(feat);

      ALERT WHERE score < anomaly_threshold AND activity IN

      [networkmanager_psk_read, keychain_extract]

      OUTPUT host, user, score, top3=lime_shap_top_features(model, feat).'
