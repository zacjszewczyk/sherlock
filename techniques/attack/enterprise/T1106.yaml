- question: Does any newly created process have an image-path Shannon entropy in the 95th percentile AND
    connect to a domain seen on fewer than 5 hosts in the environment?
  context: Malware frequently runs from randomly named files (high-entropy paths) and contacts rare, attacker-controlled
    infrastructure. Combining a high-entropy image-path score (95th percentile) with a rare-destination
    filter (domain seen on < 5 hosts) produces a compound anomaly far more specific than either signal
    alone. The conjunction means a randomly named binary talking to obscure infrastructure - a classic
    dropped-payload-plus-C2 pattern under the Execution and Command-and-Control tactics. A match warrants
    investigation of the file's origin and the destination's reputation; common destinations or human-readable
    paths will not trigger. Tuning entropy and host-count thresholds to the environment keeps false positives
    manageable.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
