- question: Does a time-series model (e.g., LSTM) on per-process outbound connection counts or byte volume
    reveal sudden, sustained spikes indicating beaconing or massive data egress from a single process?
  context: 'Once native-API-executed malware establishes C2, its network behavior over time betrays it:
    regular beaconing produces a steady, periodic connection cadence, while exfiltration produces large
    sustained byte-count spikes. Training a time-series model (such as an LSTM) on per-process outbound
    connection counts and data volume, then alerting on sudden, sustained deviations, catches both beaconing
    and bulk egress that point-in-time rules miss. A sustained spike from a single process is a strong
    Command-and-Control / Exfiltration indicator following Execution and warrants packet-level review
    and host containment. Normal processes show stable, expected network rhythms. This temporal view adds
    depth to the connection-failure and correlation methods above.'
