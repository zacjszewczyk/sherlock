- question: Which newly created processes generate a high ratio of failed/rejected connections (Zeek conn.log
    states S0/REJ, e.g., >30%) or a high NXDOMAIN rate (Zeek dns.log, e.g., >10/min), exceeding the per-host
    99th percentile?
  context: 'C2 retry loops and DGA-based malware produce distinctive failure signatures: many half-open/rejected
    connections and bursts of NXDOMAIN responses as the malware cycles through dead infrastructure or
    algorithmically generated domains. Profiling per-process connection-state outcomes from Zeek conn.log
    (S0/REJ) and DNS NXDOMAIN rates from dns.log, then alerting on the per-host 99th percentile, isolates
    this behavior from normal egress. A newly created process with >30% failed connections or >10 NXDOMAIN/min
    is a strong Command-and-Control indicator stemming from native-API execution. Normal applications
    resolve and connect successfully most of the time. Baselining per host prevents noisy-but-legitimate
    apps from dominating alerts. Method reference(s): [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).'
  answer_sources:
  - Sysmon Event ID 1
