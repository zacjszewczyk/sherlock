- question: Did a process launched from a user-writable directory (%TEMP%, Downloads) connect to a domain
    on a threat-intel blocklist within 60 seconds of its creation, correlating Sysmon Event 1 with Zeek
    conn.log?
  context: Dropped malware that uses native APIs to execute often beacons to command-and-control almost
    immediately after launch. Correlating process creation (Sysmon Event 1) from user-writable paths with
    outbound connections (Zeek conn.log) to TI-blocklisted domains within a tight 60-second window yields
    a high-precision detection of staged payloads calling home. A match strongly indicates Execution followed
    by Command-and-Control and warrants immediate containment of the host and the destination. The short
    time window and user-writable-path filter keep precision high; legitimate software installed to system
    paths or contacting known-good infrastructure will not trigger. Pursue by examining the binary hash,
    parent process, and full connection details.
  answer_sources:
