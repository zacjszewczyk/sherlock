- question: When the ordered native API/syscall stream of a newly created process is scored by an LSTM
    or CNN-LSTM sequence classifier (trained on benign vs. malicious sequences such as Mal-API-2019),
    is it classified as malicious, and what top-3 SHAP/attention features explain the verdict?
  context: 'The temporal order of native API/syscall calls encodes malicious intent even when surface
    features are obfuscated. LSTM or CNN-LSTM models trained on labeled benign/malicious API sequences
    (e.g., Mal-API-2019) detect metamorphic execution at high accuracy and resist surface obfuscation
    that defeats signatures. Scoring the call stream of newly created processes and surfacing the top-3
    SHAP/attention features makes each verdict explainable and triage-ready. A malicious classification
    is a strong Execution indicator of native-API abuse; benign scores reflect normal behavior. Because
    the model learns from sequence structure rather than static strings, it generalizes to novel and packed
    samples, complementing the hash- and rule-based methods. Method reference(s): [Deep Learning Based
    Sequential Model for Malware Analysis Using Windows EXE API Calls](https://peerj.com/articles/cs-285/);
    [CNN-LSTM and Transfer Learning Models for Malware Classification Based on Opcodes and API Calls](https://www.sciencedirect.com/science/article/abs/pii/S0950705124001783);
    [Mal-API-2019](https://github.com/ocatak/malware_api_class); [Explainable Artificial Intelligence
    (XAI) for Malware Analysis: A Survey](https://arxiv.org/html/2409.13723v2).'
