- question: '[Reconnaissance / Horizontal scan threshold] A single external source IP address initiates
    connections to the same destination port on a number of distinct internal destination hosts that is
    statistically anomalous within a defined time window (horizontal scan), and Windows Event ID 5156
    confirms the flows. Using a symbolic logic approach (''Horizontal scan threshold''), can you confirm
    whether the implicated external source IP is scanning our public-facing IP blocks, and scope the activity?'
  context: 'Tactic relevance (Reconnaissance): an adversary scanning the organization''s public IP blocks
    is gathering target information to plan follow-on initial access. This question pursues the ''Horizontal
    scan threshold'' detection method. Count unique destination hosts per port per source IP over 1-minute
    windows using Zeek conn.log and Windows 5156, alerting when counts exceed a static threshold (e.g.,
    20 hosts). Implement with Suricata detection_filter/threshold (track by_src, count, seconds) and Snort
    sfPortscan portsweep classification, which counts negative responses (RST/ICMP-unreachable) and host
    fan-out per source per [Suricata Global Thresholds, OISF](https://docs.suricata.io/en/latest/configuration/global-thresholds.html)
    and [Snort sfPortscan](http://manual-snort-org.s3-website-us-east-1.amazonaws.com/node17.html). Derive
    the host threshold from your own conn.log fan-out distribution; do not delete the static floor when
    ML is added. A positive result (a feed/signature match, an above-threshold or anomalous score, or
    a fired sequential test) is evidence of active scanning from the implicated source IP and should be
    triaged and scoped against the named area of interest (Demilitarized Zone (DMZ) network segments and
    externally exposed server subnets); a negative result lowers but does not eliminate suspicion, especially
    for slow or distributed scans, so corroborate with the other methods in this playbook.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Demilitarized Zone (DMZ) network segments and externally exposed server subnets'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "per src_ip, dst_port over 1-min window (zeek_conn + win_5156):\n  uniq_hosts = count(distinct\
      \ dst_ip)\n  if uniq_hosts > 20: ALERT('horizontal scan', src_ip, dst_port, uniq_hosts)\n# derive\
      \ 20 from your conn.log fanout distribution; keep static floor"
  - technology: Suricata/pseudocode
    query: 'detection_filter: track by_src, count 20, seconds 60  # portsweep

      # Snort sfPortscan portsweep counts host fan-out + RST/ICMP-unreach per source'
