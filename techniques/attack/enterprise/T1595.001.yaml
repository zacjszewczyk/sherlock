      \ /nmap|masscan|zgrab|nse/i)\n   OR zeek_ssl.ja3 in scanner_ja3_set\n   OR zeek_ssl.ja3s in scanner_ja3s_set:\n\
      \     ALERT('scanner signature', src_ip, matched_value)"
  - technology: Suricata/pseudocode
