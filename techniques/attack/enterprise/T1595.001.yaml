  context: 'Tactic relevance (Reconnaissance): an adversary scanning the organization''s public IP blocks
    is gathering target information to plan follow-on initial access. This question pursues the ''Sequential
    failure-state test'' detection method. Apply Threshold Random Walk (Wald''s SPRT) over each source''s
    first-contact connections, scoring success (conn_state SF) vs failure (S0/REJ/RSTOS0) to declare a
    scanner after ~4-5 observations with tunable false-positive/negative bounds, catching slow horizontal
    scans that fixed-count windows miss, per [Fast Portscan Detection Using Sequential Hypothesis Testing,
    Jung et al.](https://www.icir.org/vern/papers/portscan-oak04.pdf). A positive result (a feed/signature
    match, an above-threshold or anomalous score, or a fired sequential test) is evidence of active scanning
    from the implicated source IP and should be triaged and scoped against the named area of interest
    (Demilitarized Zone (DMZ) network segments and externally exposed server subnets); a negative result
    lowers but does not eliminate suspicion, especially for slow or distributed scans, so corroborate
    with the other methods in this playbook.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Demilitarized Zone (DMZ) network segments and externally exposed server subnets'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "TRW / Wald SPRT per src_ip on first-contact outcomes:\n  success = conn_state==SF ; failure\
      \ = conn_state in [S0,REJ,RSTOS0]\n  update likelihood_ratio L *= (P1/P0 per outcome)\n  if L >=\
      \ eta1: DECLARE scanner (~4-5 obs)  # tunable FP/FN bounds"
