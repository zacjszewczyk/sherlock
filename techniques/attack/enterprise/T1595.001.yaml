name: 'T1595.001: Scanning IP Blocks'
id: 130c4370-bee6-4063-8a10-fde7231f74cd
description: 'This playbook helps an analyst investigate whether an external adversary is conducting active
  reconnaissance by scanning the organization''s public-facing IP blocks (MITRE ATT&CK T1595.001). It
  guides the investigation across several scan modalities: correlating inbound source IPs against threat-intelligence
  scanner feeds and mass-scanner fingerprints; matching protocol-level artifacts (User-Agent strings,
  TCP flag combinations, TLS JA3/JA3S hashes) to known reconnaissance tooling; detecting horizontal scans
  (one source touching the same port across many hosts), vertical scans (one source touching many ports
  on one host), and subnet sweeps (sequential or ICMP probing to find live hosts). For each modality the
  playbook supplies deterministic symbolic-logic thresholds, statistical baselining and sequential-hypothesis
  tests, and machine-learning anomaly detection. Evidence is drawn from network telemetry (Zeek conn.log,
  icmp.log, http.log, ssl.log, software.log) and Windows host telemetry (Event ID 5156 filtering-platform
  connections and Event ID 4688 process creation), observed at internet-facing firewalls, gateways, DMZ
  segments, web and application servers, VPN concentrators, and cloud network gateways, so an analyst
  can confirm scanning activity and scope the source.'
type: technique
