questions:
- question: '[Reconnaissance / CTI scanner correlation] An external source IP address, observed initiating
    inbound connections that Windows Event ID 5156 validates, is listed on a high-confidence threat intelligence
    feed as a known scanner or malicious actor. Using a symbolic logic approach (''CTI scanner correlation''),
    can you confirm whether the implicated external source IP is scanning our public-facing IP blocks,
    and scope the activity?'
  context: 'Tactic relevance (Reconnaissance): an adversary scanning the organization''s public IP blocks
    is gathering target information to plan follow-on initial access. This question pursues the ''CTI
    scanner correlation'' detection method. Continuously correlate inbound source IPs from Zeek conn.log,
    icmp.log, and Windows Event ID 5156 against high-confidence threat-intel scanner feeds, alerting on
    any direct match with session metadata. Match known mass-scanner fingerprints in parallel (SYN-only
    single packets with no retransmission, source-port reuse, address-space-wide fan-out) per [ZMap](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_durumeric.pdf)
    so detection survives a feed miss, and treat any inbound connection to allocated-but-unused (darknet)
    internal addresses as a deterministic scan indicator per [Characteristics of Internet Background Radiation,
    Pang et al.](https://www.icir.org/vern/papers/radiation-imc04.pdf). A positive result (a feed/signature
    match, an above-threshold or anomalous score, or a fired sequential test) is evidence of active scanning
    from the implicated source IP and should be triaged and scoped against the named area of interest
    (Internet-facing firewalls, network gateways, Cloud Security Groups, and Network ACLs); a negative
    result lowers but does not eliminate suspicion, especially for slow or distributed scans, so corroborate
    with the other methods in this playbook.'
  answer_sources:
  - Zeek conn.log
  - Zeek icmp.log
  - Windows Event ID 5156
  - 'NAI: Internet-facing firewalls, network gateways, Cloud Security Groups, and Network ACLs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "inbound = union(zeek_conn, zeek_icmp, win_5156 where direction=inbound)\nfor ip in inbound.src_ip:\n\
      \  if ip in TI_scanner_feed: ALERT('CTI match', ip, session_meta)\n  if ip matches mass_scanner_fp(SYN_only\
      \ & no_retransmit & src_port_reuse & wide_fanout): ALERT('scanner fingerprint', ip)\n  if dst_ip\
      \ in darknet_allocated_unused: ALERT('darknet contact = scan', ip)"
  - technology: Zeek/pseudocode
    query: "event connection_state_remove(c):\n  if c$id$orig_h in Intel::scanner_feed || dst in darknet_space:\n\
      \    NOTICE(Scanner_Hit, c$id$orig_h)"
- question: '[Reconnaissance / Reputation score escalation] An external source IP address, observed initiating
    inbound connections that Windows Event ID 5156 validates, is listed on a high-confidence threat intelligence
    feed as a known scanner or malicious actor. Using a statistical method approach (''Reputation score
    escalation''), can you confirm whether the implicated external source IP is scanning our public-facing
    IP blocks, and scope the activity?'
  context: 'Tactic relevance (Reconnaissance): an adversary scanning the organization''s public IP blocks
    is gathering target information to plan follow-on initial access. This question pursues the ''Reputation
    score escalation'' detection method. Compute a weighted reputation score per source IP combining TI
    memberships, Windows 5156 session counts, and the source''s failed-first-contact ratio (Zeek conn_state
    S0+REJ / total) per [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html), flagging scores
    above the 95th percentile of the prior day. Score the failure ratio explicitly as a distinct signal
    because scanners hit dead hosts/closed ports far more than benign clients per [Fast Portscan Detection,
    Jung et al.](https://www.icir.org/vern/papers/portscan-oak04.pdf). A positive result (a feed/signature
    match, an above-threshold or anomalous score, or a fired sequential test) is evidence of active scanning
    from the implicated source IP and should be triaged and scoped against the named area of interest
    (Internet-facing firewalls, network gateways, Cloud Security Groups, and Network ACLs); a negative
    result lowers but does not eliminate suspicion, especially for slow or distributed scans, so corroborate
    with the other methods in this playbook.'
  answer_sources:
  - Zeek conn.log
  - Zeek icmp.log
  - Windows Event ID 5156
  - 'NAI: Internet-facing firewalls, network gateways, Cloud Security Groups, and Network ACLs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per src_ip over 1d:\n  ti = count(distinct TI_feeds_with_ip)\n  sessions = count(win_5156)\n\
      \  fail_ratio = count(conn_state in [S0,REJ]) / count(*)\n  score = w1*ti + w2*sessions + w3*fail_ratio\n\
      alert where score > percentile(prev_day.score, 95)"
- question: '[Reconnaissance / Scanner probability scoring] An external source IP address, observed initiating
    inbound connections that Windows Event ID 5156 validates, is listed on a high-confidence threat intelligence
    feed as a known scanner or malicious actor. Using a machine learning approach (''Scanner probability
    scoring''), can you confirm whether the implicated external source IP is scanning our public-facing
    IP blocks, and scope the activity?'
  context: 'Tactic relevance (Reconnaissance): an adversary scanning the organization''s public IP blocks
    is gathering target information to plan follow-on initial access. This question pursues the ''Scanner
    probability scoring'' detection method. Train a one-class/anomaly classifier (Isolation Forest or
    One-Class SVM) on benign inbound-flow vectors (ASN, country, conn_state distribution, fan-out, byte
    volume, failed-connection ratio) and alert when the anomaly score exceeds the configured percentile;
    surface the top-3 contributing features in alert text using LIME per-prediction attribution per [Robust
    IoT security using isolation forest and one-class SVM](https://www.nature.com/articles/s41598-025-20445-4).
    Train/validate against the labeled Nmap PortScan day of [CICIDS2017, Sharafaldin et al.](https://www.scitepress.org/papers/2018/66398/66398.pdf).
    A positive result (a feed/signature match, an above-threshold or anomalous score, or a fired sequential
    test) is evidence of active scanning from the implicated source IP and should be triaged and scoped
    against the named area of interest (Internet-facing firewalls, network gateways, Cloud Security Groups,
    and Network ACLs); a negative result lowers but does not eliminate suspicion, especially for slow
    or distributed scans, so corroborate with the other methods in this playbook.'
  answer_sources:
  - Zeek conn.log
  - Zeek icmp.log
  - Windows Event ID 5156
  - 'NAI: Internet-facing firewalls, network gateways, Cloud Security Groups, and Network ACLs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [ASN, country, conn_state_dist, fanout, byte_volume, fail_ratio]\nmodel = IsolationForest|OneClassSVM.fit(benign_inbound_flows)\n\
      score = model.anomaly_score(features)\nif score > configured_percentile:\n  ALERT(src_ip, top3_features=LIME_explain(model,\
      \ features))\n# validate vs CICIDS2017 Nmap PortScan day"
- question: '[Reconnaissance / Scanner header signature match] Inbound network traffic exhibits protocol-level
    artifacts or patterns matching signatures of known reconnaissance tools, such as specific User-Agent
    strings, TCP flag combinations, or TLS JA3/JA3S hashes, while Windows Event ID 4688 identifies the
    spawning process. Using a symbolic logic approach (''Scanner header signature match''), can you confirm
    whether the implicated external source IP is scanning our public-facing IP blocks, and scope the activity?'
  context: 'Tactic relevance (Reconnaissance): an adversary scanning the organization''s public IP blocks
    is gathering target information to plan follow-on initial access. This question pursues the ''Scanner
    header signature match'' detection method. Apply regexes to Zeek http.log user_agent fields, Windows
    Event ID 4688 command lines, and Zeek ssl.log JA3/JA3S hashes against known scanner/banner-grabber
    signatures (e.g., zgrab, masscan, nmap NSE), alerting on any match. Banner/version-grab probing is
    a documented ZMap/zgrab capability for fingerprinting hosts after a live-host sweep per [ZMap, Durumeric
    et al.](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_durumeric.pdf);
    encode and rate-limit these as Suricata signatures per [Suricata Global Thresholds, OISF](https://docs.suricata.io/en/latest/configuration/global-thresholds.html).
    A positive result (a feed/signature match, an above-threshold or anomalous score, or a fired sequential
    test) is evidence of active scanning from the implicated source IP and should be triaged and scoped
    against the named area of interest (Web application servers, internet-facing firewalls, load balancers,
    and reverse proxies); a negative result lowers but does not eliminate suspicion, especially for slow
    or distributed scans, so corroborate with the other methods in this playbook.'
  answer_sources:
