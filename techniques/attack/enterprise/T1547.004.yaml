name: 'T1547.004: Winlogon Helper DLL'
id: 0ce3f059-c36f-459b-a570-2e25210d8a54
description: 'This playbook helps an analyst investigate whether an adversary is abusing Winlogon helper
  configurations on Windows to gain persistence (TA0003) and/or escalate privileges (TA0004) by causing
  winlogon.exe, userinit.exe, or explorer.exe to load malicious DLLs or run attacker commands at every
  interactive logon. It guides the hunt across several behavioral angles: modifications to the Winlogon
  Userinit, Shell, and Notify Registry keys that introduce new or unsigned executables/DLLs, that deviate
  from the baseline values (Userinit = C:\Windows\system32\userinit.exe,; Shell = explorer.exe), or that
  append launcher/credential/account-management commands; correlation of those registry writes (Windows
  Event ID 4657, Sysmon 13) with file-creation hashes (Sysmon 11) against threat-intelligence and credential-dumping/privilege-escalation
  tool feeds (Mimikatz, PowerSploit, LaZagne); anomalous post-logon process lineage where userinit/winlogon/explorer
  spawn cmd.exe, powershell.exe, or binaries outside System32/Program Files within seconds of a Type 2/10
  logon; SYSTEM-context spawn chains that create users or modify privileged groups (Windows Event IDs
  4720/4732/4728), and Winlogon-descended handle requests to LSASS memory (Sysmon 10); and outbound connections
  from userinit.exe/explorer.exe children to low-reputation, newly registered, or DGA/C2 destinations
  (Zeek conn/dns, Sysmon 3). Detection methods combine symbolic-logic rules (Sigma Winlogon Notify/Helper/Userinit-child/egress
  rules, Atomic Red Team T1547.004 validation), statistical baselining (path/command entropy, Userinit
  length/token Z-scores, child-process and LSASS-accessor rarity, network volume/failure profiling, Notify-creation
  forecasting), and machine-learning models (explainable Random Forest/XGBoost and one-class OCSVM/Isolation
  Forest classifiers, LSTM logon-sequence models, and whole-system provenance-graph detectors) applied
  to Windows Security/Sysmon events and Zeek network telemetry, so the analyst can corroborate suspected
  Winlogon helper abuse against registry, process lineage, credential-access, and exfiltration context.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
