questions:
- question: '[Persistence] Winlogon IOC and content correlation: Can you determine whether a modification
    to a Winlogon registry key (`Userinit`, `Shell`, or a `Notify` subkey) references a new executable
    or DLL file whose SHA256 hash is present on a known-malicious threat intelligence feed. -- specifically,
    using the ''Winlogon IOC and content correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Winlogon helper
    configurations -- the Userinit, Shell, and Notify Registry values under HKLM/HKCU\...\Microsoft\Windows
    NT\CurrentVersion\Winlogon\ -- so that winlogon.exe, userinit.exe, or explorer.exe load attacker-controlled
    DLLs or run attacker commands every time a user logs on, frequently executing in a SYSTEM or otherwise
    privileged context. This evidence focuses on the condition that a modification to a Winlogon registry
    key (`Userinit`, `Shell`, or a `Notify` subkey) references a new executable or DLL file whose SHA256
    hash is present on a known-malicious threat intelligence feed. This Symbolic Logic approach looks
    for the following signal: Correlate Winlogon registry writes (Sysmon 13 / Win 4657) to Userinit/Shell/Notify
    with Sysmon 11 file creations; alert deterministically when a `...\Winlogon\Notify\<pkg>` value is
    set to a `.dll` ([Sigma Winlogon Notify](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_winlogon_notify_key.yml)),
    when Userinit deviates from `C:\Windows\system32\userinit.exe,` or Shell from `explorer.exe`, or when
    the value is written via a PowerShell ScriptBlock combining `CurrentVersion\Winlogon` with Set-ItemProperty/New-Item
    ([Sigma Winlogon Helper](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_winlogon_helper_dll.yml)).
    Extract created-file SHA256 and query TI for exact matches. Validate rules with [Atomic Red Team T1547.004](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1547.004/T1547.004.md)
    and inventory all Winlogon ASEPs per [Hexacorn](https://www.hexacorn.com/blog/2017/01/13/beyond-good-ol-run-key-part-55/).
    A positive result -- a deterministic rule match, a statistical outlier, or a model alert -- indicates
    that a Winlogon helper value, post-logon process lineage, or related network/credential activity deviates
    from the established corporate baseline and may represent adversary persistence or privilege escalation;
    pivot to the responsible writing process and its parent, the exact registry value and any referenced
    binary (hash, signer, path, entropy), the spawning lineage rooted at winlogon/userinit/explorer, and
    any follow-on account changes, LSASS access, or outbound connections. A negative result helps reduce
    the likelihood of this specific Winlogon abuse vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, slow, or living-off-the-land variants.'
  answer_sources: &id001
  - Windows Event ID 4657
  - Sysmon Event ID 13
