questions:
- question: '[Resource Development] AI service IOC correlation: Can you determine whether an internal
    host reaches public generative AI service domains or API endpoints, and the browser or local client
    process tied to that session is consistent with prompt submission, response retrieval, or code-generation
    use. -- specifically, using the ''AI service IOC correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary obtains or
    uses generative AI tools (such as LLMs) to inform, bolster, and automate malicious tasks — reconnaissance,
    social engineering and phishing content, vulnerability research, and the generation, refinement, or
    obfuscation of scripts and payloads — effectively outsourcing capability development. This evidence
    focuses on the condition that an internal host reaches public generative AI service domains or API
    endpoints, and the browser or local client process tied to that session is consistent with prompt
    submission, response retrieval, or code-generation use. This Symbolic Logic approach works as follows:
    Match Zeek dns.log, http.log, ssl.log (SNI), and conn.log plus Windows Event ID 4688 process lineage
    against an allowlist and threat-intel of public generative-AI service domains/API hosts (e.g., api.openai.com,
    *.anthropic.com, generativelanguage.googleapis.com, *.openai.azure.com), and alert when a non-allowlisted
    host or non-browser process repeatedly reaches those endpoints; use cadence context from [RITA](https://github.com/activecm/rita)
    to distinguish interactive from scripted access. A positive result — a rule match, statistical outlier,
    or model alert — is a signal of probable AI-assisted activity; pivot to the responsible process and
    its parent lineage, the user and host, the destination AI-service domain and TLS/SNI, the retrieved
    or generated artifacts, and the timing of the session to scope what was produced and how it may feed
    downstream phishing, scripting, or payload development. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since much AI use occurs
    off-network and a single method can miss sanctioned-tool abuse, locally hosted models, or low-volume
    access.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Internet gateway, DNS resolvers, web proxies, and user workstations.'
  range: Last 90 days
