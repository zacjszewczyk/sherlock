name: 'T1588.007: Artificial Intelligence'
id: fab0ba90-ec64-4db9-8415-89287131c628
description: 'This playbook helps an analyst investigate whether an adversary is obtaining or using generative
  artificial intelligence (AI) tools — such as large language models (LLMs) — to develop resources and
  support targeting (MITRE ATT&CK T1588.007, Artificial Intelligence, under Resource Development TA0042).
  Most of this activity occurs outside the target organization''s visibility, so detection focuses on
  the observable byproducts of AI use inside the enterprise: internal hosts reaching public generative-AI
  service domains and API endpoints (e.g., api.openai.com, *.anthropic.com, generativelanguage.googleapis.com,
  *.openai.azure.com) from browser or non-browser processes; scripts, documents, and helper files that
  carry AI-generation markers, model-style commentary, or sudden stylometric shifts inconsistent with
  the author''s normal content; repeated visits to AI domains followed by retrieval of generated text,
  code, or exported chats; obfuscated or heavily prompt-engineered script execution (encoded commands,
  nested quoting, format-operator tricks) consistent with AI-assisted refinement of malicious logic; bursts
  of generated-looking file creation from a single process; and automated prompt-refine-download loops
  indicating scripted or large-scale AI use. The hunt spans network egress telemetry (Zeek conn/dns/http/ssl/files
  logs) and endpoint logs (Windows Event ID 4688 process creation, 4104 PowerShell script blocks, Sysmon
  Event ID 1 and 11), and pursues each behavior from three complementary angles: deterministic symbolic-logic
  rules (AI-service IOC/allowlist correlation, YARA/content marker rules, LLM watermark z-tests, obfuscation-keyword
  and burst-creation detection), statistical baselining (rare-access and directed anomaly scoring, stylometry
  and log-probability-curvature outliers, entropy/compression and creation-rate deviation, cadence and
  request success/failure profiling), and machine learning (AI-session and AI-generated-code/prose classifiers,
  prompt-response and machine-pattern timing models, sequence/anomaly detectors, and obfuscation classifiers),
  so an analyst can corroborate suspected AI-assisted resource development across network traffic, process
  lineage, file artifacts, and content style.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
