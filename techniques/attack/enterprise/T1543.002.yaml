questions:
- question: '[Persistence] Systemd unit IOC match (Symbolic Logic): Can you determine whether a new file
    with a `.service` extension is created in a systemd unit directory (`/etc/systemd/system/`, `/usr/lib/systemd/system/`,
    or `~/.config/systemd/user/`) and the command specified in the `ExecStart` directive matches a known
    malicious file hash, path, or command-line argument. -- specifically, applying the ''Systemd unit
    IOC match'' approach using Symbolic Logic?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Linux systemd
    services to keep access across restarts and credential changes, leaving traces in unit-file content,
    auditd/FIM file and process telemetry, the systemd journal, and network logs. This evidence focuses
    on the condition that a new file with a `.service` extension is created in a systemd unit directory
    (`/etc/systemd/system/`, `/usr/lib/systemd/system/`, or `~/.config/systemd/user/`) and the command
    specified in the `ExecStart` directive matches a known malicious file hash, path, or command-line
    argument. This Symbolic Logic approach looks for the following signal: Use auditd file watches on
    `/etc/systemd/system/`, `/usr/lib/systemd/system/`, and `~/.config/systemd/user/` to catch `.service`
    create/rename, then parse `ExecStart`/`ExecStartPre`/`ExecStartPost`/`ExecReload` and compare command
    hashes, paths, and arguments against IOC feeds; alert on any match Linux detection engineering with
    Auditd, Elastic Security Labs. A positive result -- a rule match, statistical outlier, or model alert
    -- indicates a systemd unit, generator, timer, or service-spawned process is behaving in a way that
    deviates from sanctioned, package-manager-installed services and normal administrative activity; pivot
    to the responsible unit file and its ExecStart, the user/UID and parent process that created or enabled
    it, the spawned binary and its network connections, and the source attribution (package manager vs.
    ad-hoc creation). A negative result helps rule out this systemd vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land abuse.'
  answer_sources:
  - Linux auditd file events
  - File Integrity Monitoring (FIM) logs
  - systemd journal logs
  - Service unit file content
  - 'NAI: Linux servers (e.g., web servers, application servers, database servers), Linux developer workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Systemd unit IOC match (Symbolic Logic)

      source IN [Linux auditd file events, File Integrity Monitoring (FIM) logs, systemd journal logs,
      Service unit file content]

      | WHERE matches_action_criteria("Systemd unit IOC match")

      // Use auditd file watches on `/etc/systemd/system/`, `/usr/lib/systemd/system/`, and `~/.config/systemd/user/`
      to catch `.service` create/rename, then parse `ExecStart`/`ExecStartPre ...

      | ALERT enrich(host, user, uid, unit_file, ExecStart, parent_process, dest)'
