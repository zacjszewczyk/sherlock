name: 'T1543.002: Systemd Service'
id: 1a468b44-684e-4197-9938-2b985ef902a6
description: 'This playbook helps an analyst investigate whether an adversary is abusing Linux systemd
  services to maintain persistence (TA0003) and/or escalate privileges (TA0004) on Linux hosts. Systemd
  `.service` unit files in system directories (`/etc/systemd/system/`, `/usr/lib/systemd/system/`) and
  user directories (`~/.config/systemd/user/`), as well as systemd generators and `.timer`/`.service`
  pairs, can be created or modified so that malicious payloads execute repeatedly at boot, on reload,
  or on a schedule. It guides the hunt across several behavioral angles: creation or modification of `.service`
  unit files whose `ExecStart`/`ExecStartPre`/`ExecStartPost`/`ExecReload` directives match IOCs, invoke
  scripting interpreters with obfuscation (`base64 -d`, `eval`) or network primitives (`/dev/tcp`, `curl|sh`,
  `nc`), or point at world-writable paths (`/tmp`, `/var/tmp`, `/dev/shm`); privilege-relevant changes
  such as `User=root`, raised capabilities, or `NoNewPrivileges=false`; non-package-manager / non-config-management
  `systemctl enable/start` activity; service-spawned (PPID=1) outbound network beaconing to rare or low-reputation
  destinations; suspicious systemd generator executables and CVE signatures; staging of unit files by
  non-root users and their subsequent privileged move into system directories; and lingering user-level
  timer/service pairs that abuse sudo or SUID binaries. Detection methods combine symbolic-logic rules,
  statistical baselining, and machine-learning models applied to Linux auditd, systemd journal logs, FIM/osquery,
  package-manager and configuration-management logs, and Zeek conn/dns telemetry, so the analyst can corroborate
  suspected systemd abuse against file changes, process lineage, source attribution, and network context.'
type: technique
