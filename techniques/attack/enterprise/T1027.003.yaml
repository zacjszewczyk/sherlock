name: 'T1027.003: Obfuscated Files or Information: Steganography'
id: f0bc748d-571d-446f-9dc1-b3db1dfc6879
description: 'Investigate whether an adversary is concealing data or executable content inside digital
  media such as images, audio, video, or text files using steganography to evade detection. This playbook
  helps an analyst hunt for the full steganographic lifecycle: presence and execution of known stego tooling
  (steghide, OpenStego, Invoke-PSImage, OutGuess, S-Tools) identified by file hashes, YARA signatures,
  low prevalence, and metadata classifiers; suspicious command-line invocations combining embed/extract
  flags with media extensions; anomalous process lineage where scripting engines (powershell.exe, wscript.exe,
  python.exe, osascript) read or write media files and then spawn network-connecting children; carrier
  files whose entropy, structural format violations (data after PNG IEND or JPEG EOI), or size are statistical
  outliers and that fail chi-square/StegExpose or CNN/SRM steganalysis; and network exfiltration of media
  to rare or intelligence-flagged destinations over standard or covert channels. It supports Windows (Event
  ID 4688, Sysmon), Linux (auditd), macOS (osquery, unified log), and network telemetry (Zeek conn/http/dns/files
  logs).'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any file hashes seen during process execution on endpoints or in network file transfers
    match known steganography tools, encoded payloads, or campaign artifacts, or trip YARA signatures
    for stego tooling?
  context: 'In service of the Stealth tactic, deterministic hash and YARA matching gives the fastest,
    most defensible answer that a known steganography utility (steghide, OpenStego, Invoke-PSImage, OutGuess,
    S-Tools) or a verified campaign carrier is present. Pull MD5/SHA1/SHA256 values from Windows Event
    ID 4688, Sysmon Event ID 1, and Zeek files.log and correlate them against curated threat-intelligence
    feeds and YARA rules that target tool binaries and their PNG/JPEG LSB-embedding artifacts. A positive
    match is high-severity and effectively confirms tooling presence; a negative result only means the
    exact artifact is unknown, so chain to prevalence and metadata methods for renamed or custom variants.
    References: [Invoke-PSImage](https://github.com/peewpw/Invoke-PSImage); [Stegomalware survey](https://arxiv.org/abs/2110.02504).'
  answer_sources: &id001
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek files.log
  - 'NAI: Endpoints (workstations, servers), Network egress/ingress points, Internal file shares'
  range: Last 90 days
  queries:
  - technology: SIEM/Correlation pseudocode
    query: hashes = UNION(WinEventID=4688.Hashes, Sysmon1.Hashes, Zeek_files.md5/sha1/sha256); MATCH hashes
      AGAINST ti_feed.stego_tools OR yara_scan(file) IN {steghide,OpenStego,Invoke-PSImage,OutGuess,S-Tools};
      ALERT severity=high WITH host, file_path, hash, rule_name.
- question: When a filename matches a known steganography tool but its hash is unknown, how rare is that
    binary across the enterprise, and is it seen on fewer than 5 hosts or under 1% of endpoints?
  context: 'Stego stagers are rare by design, so prevalence analysis surfaces renamed or custom variants
    that evade hash matching while supporting the adversary''s Stealth goal. Compute enterprise-wide prevalence
    for binaries whose filenames resemble stego tools and flag any executing on <5 hosts or <1% of endpoints
    as candidate custom or renamed variants. A low-prevalence hit on a named tool is a strong outlier
    worth escalation; wide prevalence usually indicates a sanctioned or commodity tool to allowlist. References:
    [Stegomalware survey](https://arxiv.org/abs/2110.02504).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: candidates = events WHERE filename ~ stego_tool_names AND hash NOT IN ti_feed; host_count =
      COUNT(DISTINCT host) BY hash; total = COUNT(DISTINCT host all); FLAG WHERE host_count < 5 OR host_count/total
      < 0.01.
- question: Do file metadata features (size, byte entropy, PE/PNG header validity, MIME type, filename
    tokens) score a file as steganography-related under a trained classifier, and which features drive
    that score?
  context: 'When neither hash nor filename gives certainty, a supervised classifier extends Stealth detection
    to unknown carriers. Train a Gradient Boosting or Random Forest model on file metadata and score files
    as stego-related, surfacing the top-3 SHAP contributing features (e.g., entropy, trailing bytes after
    PNG IEND, size residual) so the analyst understands and can triage the alert. A high score with intuitive
    feature attributions warrants pulling the file for structural and steganalysis testing; explainability
    guards against opaque false positives. References: [SHAP in IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full);
    [Stegomalware survey](https://arxiv.org/abs/2110.02504).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = features(size, byte_entropy, header_valid, mime, filename_tokens, trailing_bytes_after_IEND);
      score = GBM_or_RF.predict_proba(X); IF score > tau: ALERT WITH top3 = SHAP(X).'
- question: Do any process command lines combine steganography keywords or flags (embed, extract, -cf,
    -ef, steghide, Invoke-PSImage, -encode) with media file extensions (.png, .jpg, .bmp, .wav, .gif)?
  context: 'Stego tool flag syntax is documented and stable, so regex matching on command lines from Event
    ID 4688 and Sysmon Event ID 1 reliably catches tool execution that the adversary intends to hide.
    Look for embed/extract verbs and characteristic flags co-occurring with media extensions. A match
    is a concrete execution indicator; review the full command line, parent process, and operating user.
    Negative results do not rule out renamed tools, so pair with entropy and NLP methods. References:
    [Invoke-PSImage](https://github.com/peewpw/Invoke-PSImage); [Stegomalware survey](https://arxiv.org/abs/2110.02504).'
  answer_sources: &id002
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoints (workstations, servers), Application servers, Developer workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: cmd = EventID4688.CommandLine OR Sysmon1.CommandLine; MATCH cmd =~ /(embed|extract|-cf|-ef|steghide|Invoke-PSImage|-encode)/i
      AND cmd =~ /\.(png|jpg|bmp|wav|gif)/i; ALERT WITH host, user, parent, cmd.
- question: Are any process command lines that reference media file extensions exceeding the 99th-percentile
    Shannon entropy baseline (typically >5.0 for shell command lines), suggesting an encoded loader string?
  context: 'Encoded loaders that embed extracted payloads inline produce abnormally high-entropy command
    lines, a covert behavior aligned with Stealth. Maintain per-process command-line Shannon-entropy baselines
    and flag executions above the 99th percentile when media extensions are present. A high-entropy command
    line referencing an image or audio file suggests an obfuscated one-liner extracting hidden content;
    decode and review it. Normal commands stay well below the threshold, keeping false positives low.
    References: [Westfeld and Pfitzmann chi-square](https://link.springer.com/chapter/10.1007/10719724_5).'
  answer_sources: *id002
  range: Last 90 days, with rolling per-process entropy baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: entropy = shannon(cmd); baseline = p99(entropy BY process_name); FLAG WHERE entropy > baseline
      AND cmd =~ /\.(png|jpg|bmp|wav|gif)/i WITH host, cmd, entropy.
- question: Are there repeated failed steganography extraction attempts (non-zero exit codes, 'wrong passphrase'
    or 'could not extract' stderr, missing-file errors) on a host, especially followed by a success?
  context: 'An operator iterating on a hidden payload leaves a distinctive failure-then-success pattern
    that is high-confidence evidence of deliberate concealment under Stealth. Profile failed versus successful
    stego-tool invocations per host using exit codes and stderr signatures. A burst of failed extractions
    followed by a clean success strongly indicates someone tuning a passphrase or payload; isolated single
    successes are weaker. Capture the timeline so analysts can reconstruct the operator''s attempts. References:
    [Provos OutGuess](https://www.usenix.org/legacy/event/sec01/full_papers/provos/provos.pdf).'
  answer_sources: *id002
  range: Last 90 days, correlating failure-then-success sequences per host.
  queries:
  - technology: SIEM/Stats pseudocode
    query: invocations = stego_cmds WITH exit_code, stderr; fails = WHERE exit_code!=0 OR stderr =~ /(wrong
      passphrase|could not extract|no such file)/i; FLAG host WHERE COUNT(fails) >= N AND EXISTS success
      AFTER fails WITHIN window.
- question: Do any media-referencing command lines produce high reconstruction error under a model trained
    on benign command sequences, and which tokens make them anomalous?
  context: 'To catch novel or obfuscated stego invocations that signatures miss, train a one-class SVM
    or autoencoder on benign command sequences and flag high reconstruction-error commands that reference
    media file paths, reporting the top contributing tokens. This extends Stealth detection to never-before-seen
    command structures. A high anomaly score with media-path tokens warrants decoding and lineage review;
    token-level explanations let analysts judge whether the anomaly is benign automation or covert tooling.
    References: [Bao text steganalysis](https://arxiv.org/abs/1912.12871); [SHAP in IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: model = OneClassSVM_or_AE.fit(benign_cmd_tokens); err = model.recon_error(cmd_tokens); FLAG
      WHERE err > tau AND cmd references media_path WITH top_tokens(err).
- question: Is there an explicit chain where a scripting engine (powershell.exe, wscript.exe, python.exe)
    reads or writes a media file and then spawns a process that opens an external network connection within
    60 seconds?
  context: 'This deterministic parent-child-grandchild chain matches the Invoke-PSImage loader and documented
    stegomalware stagers, directly serving the adversary''s Stealth objective of hiding code in carriers.
    Correlate Event ID 4688 / Sysmon 1 and 11 with Sysmon 3 and Zeek conn.log inside a 60-second window.
    A complete chain (script engine touches media, then child egresses) is high-fidelity and should escalate
    immediately; partial chains still merit review. Scripting engines rarely handle media and then connect
    out legitimately. References: [Invoke-PSImage](https://github.com/peewpw/Invoke-PSImage); [Stegomalware
    survey](https://arxiv.org/abs/2110.02504).'
  answer_sources: &id003
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User workstations, Internal web servers hosting user-generated content, Developer environments'
  range: Last 90 days, using 60-second parent-child-grandchild correlation windows.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN proc(EventID4688/Sysmon1 WHERE parent IN {powershell,wscript,python}) WITH file(Sysmon11
      WHERE target ~ media_ext) WITH net(Sysmon3/Zeek_conn WHERE dst external) ON host WITHIN 60s ORDER
      BY time; ALERT severity=high.
- question: Which parent-child process chains involving media-file access have a transition probability
    below the 1st percentile of the enterprise baseline?
  context: 'Legitimate script engines rarely touch media and then immediately egress, so a frequency or
    Markov model of process relationships exposes rare chains that the adversary relies on for Stealth.
    Build a transition table of parent-child process relationships and flag media-access chains whose
    probability falls below the 1st percentile. Rare transitions concentrate attention on anomalous lineage;
    common transitions can be baselined out. Combine with network context to confirm staging. References:
    [Stegomalware survey](https://arxiv.org/abs/2110.02504).'
  answer_sources: *id003
  range: Last 90 days, with a 30-day rolling baseline for transition probabilities.
  queries:
  - technology: SIEM/Stats pseudocode
    query: model = markov(parent->child transitions over 30d); FLAG chains WHERE child accesses media
      AND P(transition) < p01 WITH host, chain, prob.
- question: After a scripting engine reads a media file, is there a burst of failed outbound connections
    (blocked conns, RST, proxy 403/407, NXDOMAIN) indicating staging even when exfil is blocked?
  context: 'Failed egress following carrier decoding is a distinct staging signal under Stealth, visible
    even when the final exfiltration is blocked. Track connection state after media reads by script engines
    and flag bursts of RSTs, proxy denials, or NXDOMAIN. A cluster of failures right after a media read
    suggests the malware decoded a payload and is probing for an open path; this is actionable before
    data leaves. Few or no failures weakens the hypothesis but does not exclude a successful first attempt.
    References: [Wendzel network steganography](https://arxiv.org/abs/1407.2029).'
  answer_sources: *id003
  range: Last 90 days, correlating egress failures within minutes of each media read.
  queries:
  - technology: SIEM/Stats pseudocode
    query: reads = media_file_reads BY script_engines; fails = conn WHERE state IN {S0,REJ,RSTO} OR proxy
      IN {403,407} OR dns=NXDOMAIN; FLAG host WHERE COUNT(fails AFTER read WITHIN window) > threshold.
- question: Does a graph anomaly detector over hosts, processes, and files surface anomalous subgraphs
    where scripting engines link to media files that then connect to new external IPs?
  context: 'Steganographic staging forms unusual host-process-file-network subgraphs that a graph anomaly
    model can isolate, advancing Stealth detection beyond linear correlation. Train the detector and flag
    subgraphs linking script engines to media files to new external IPs, surfacing the top-3 driving edges/features
    for triage. A flagged subgraph with media and novel egress edges is a strong lead; edge-level explanations
    let analysts validate the path. Use alongside deterministic chains to reduce false positives. References:
    [SHAP in IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full);
    [Stegomalware survey](https://arxiv.org/abs/2110.02504).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: G = build_graph(hosts, processes, files, conns); scores = graph_anomaly(G); FLAG subgraph WHERE
      script_engine--media--new_external_ip AND score > tau WITH top3_edges.
- question: Do any media files trip YARA rules for structural steganography artifacts such as data appended
    after PNG IEND, extra bytes after JPEG EOI/FFD9, invalid LSB patterns, or embedded tool magic bytes?
  context: 'Structural format violations are deterministic stego signatures, giving high-confidence evidence
    of hidden data under Stealth. Deploy YARA across Zeek files.log and EDR/Sysmon-captured files to detect
    post-IEND data, trailing bytes after JPEG EOI, invalid LSB patterns, and tool magic bytes. A match
    means the file''s format is violated in a way consistent with embedding; quarantine and analyze. Clean
    matches are rare, so this is a low-false-positive control to run continuously on carriers. References:
    [Stegomalware survey](https://arxiv.org/abs/2110.02504); [StegExpose](https://arxiv.org/abs/1410.6656).'
  answer_sources: &id004
  - Zeek files.log
  - Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, Critical file shares (e.g., SharePoint, network drives), Web
    application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: yara_scan(file IN {Zeek_files, Sysmon11}) RULES {data_after_PNG_IEND, bytes_after_JPEG_FFD9,
      invalid_LSB, stego_tool_magic}; ALERT ON match WITH file, rule.
- question: Do intercepted images exceed the ROC-calibrated embedding-probability threshold when run through
    chi-square Pairs-of-Values plus Sample Pairs, RS, and Primary Sets estimators (as fused by StegExpose)?
  context: 'Statistical LSB tests detect sequential and pseudo-random embedding that signatures miss,
    exposing covert payloads aligned with Stealth. Run chi-square plus Sample Pairs, RS, and Primary Sets
    estimators (StegExpose fusion) on intercepted images and alert when the combined embedding-probability
    score exceeds your baseline-derived threshold (StegExpose default ~0.2). A score above threshold flags
    likely LSB steganography from tools like EzStego/JSteg/S-Tools; calibrate the threshold from a clean-image
    corpus to control false positives. References: [Westfeld and Pfitzmann chi-square](https://link.springer.com/chapter/10.1007/10719724_5);
    [StegExpose](https://arxiv.org/abs/1410.6656).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: Steganalysis/pseudocode
    query: score = stegexpose(chi_square + sample_pairs + RS + primary_sets)(image); tau = calibrate_ROC(clean_image_baseline);
      ALERT WHERE score > tau WITH file, score.
- question: Which media files exceed per-MIME-type byte/LSB-plane entropy baselines (mean + 3 standard
    deviations or 99th percentile, approaching >7.0-7.2), or are size outliers for their dimensions or
    bitrate?
  context: 'High-entropy payload regions and size anomalies reveal carriers padded with encrypted or compressed
    hidden data, a hallmark of Stealth. Track byte and LSB-plane entropy by MIME type from Zeek files.log
    and Sysmon 11 and flag files above mean+3sd or the 99th percentile, plus size outliers for given image
    dimensions or audio bitrate. High entropy near encrypted-data levels is suspicious; note that adaptive
    embedders like OutGuess correct histograms and defeat first-order entropy alone, so layer structural
    and ML tests on negatives. References: [StegExpose](https://arxiv.org/abs/1410.6656); [Provos OutGuess](https://www.usenix.org/legacy/event/sec01/full_papers/provos/provos.pdf).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: e = byte_entropy(file), lsb_e = lsb_plane_entropy(file); base = stats(BY mime); FLAG WHERE
      e > base.mean+3*base.sd OR e > base.p99 OR size outlier(dimensions/bitrate).
- question: Do carrier images score positive under a CNN steganalyzer (Yedrouj-Net/SRNet) or a Spatial-Rich-Models
    + Ensemble-Classifier model for content-adaptive embedding (WOW, S-UNIWARD), and which regions/features
    drive the score?
  context: 'Content-adaptive embedders defeat simple statistics, so deep steganalysis is needed to catch
    the most evasive Stealth carriers. Score images with a CNN steganalyzer and an SRM+Ensemble-Classifier
    model, fusing them per the selection criterion for robustness, and report the top contributing features
    or regions. A positive fused score on a WOW/S-UNIWARD-style carrier is strong evidence of embedding;
    the region attributions help analysts confirm and locate hidden content. Use as the deepest tier after
    entropy and structural tests. References: [Yedrouj-Net](https://arxiv.org/abs/1803.00407); [Couchot
    CNN vs SRM](https://arxiv.org/abs/1612.08882); [Chaumont DL steganalysis survey](https://arxiv.org/abs/1904.01444);
    [SHAP in IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: p_cnn = SRNet_or_Yedrouj(image); p_srm = SRM_features(image) -> EnsembleClassifier; p = fuse(p_cnn,
      p_srm); ALERT WHERE p > tau WITH top_regions/features.
- question: Do documents, source files, or chat logs show statistically perturbed token distributions
    consistent with generation-based text steganography under an attentional LSTM-CNN steganalyzer?
  context: 'Steganography is not limited to images; text carriers hide data in token choices, a subtle
    Stealth channel. Apply an attentional LSTM-CNN text steganalyzer to documents, source files, and chat
    logs to detect perturbed token distributions characteristic of generation-based text steganography.
    A positive score flags text whose word choices deviate from natural language models in stego-typical
    ways; review the document''s origin and destination. This complements media-focused tests where the
    carrier is text. References: [Bao text steganalysis](https://arxiv.org/abs/1912.12871).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: score = attn_LSTM_CNN_text_steganalyzer(tokens(doc)); ALERT WHERE score > tau WITH doc_path,
      src, dst.
- question: Are any media files being transferred to or from threat-intelligence-listed IPs, domains,
    or ASNs, or to newly registered domains?
  context: 'Network steganography commonly tunnels carriers over web and DNS to evade inspection, so matching
    media transfers against intelligence supports the Stealth-to-exfiltration pivot. Monitor Zeek http.log
    and conn.log for media transfers involving TI-listed infrastructure or newly registered domains and
    elevate on any match. A media POST or download to known-bad or freshly registered infrastructure is
    a strong exfil indicator; review payload size and frequency. Clean destinations still warrant volume
    baselining. References: [Wendzel network steganography](https://arxiv.org/abs/1407.2029).'
  answer_sources: &id005
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: Network egress/ingress points (firewalls, proxies), VPN concentrators, DNS servers, User subnets'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: transfers = http.log/conn.log WHERE mime ~ media; MATCH dst IN {ti_ips, ti_domains, ti_asns,
      newly_registered}; ALERT WITH src, dst, mime, bytes.
- question: Does a user's media-transfer volume (bytes/hour, mean carrier size), frequency (files/hour),
    or destination set exceed their 30-day 95th-percentile baseline or include never-before-seen countries/ASNs?
  context: 'Carrier files inflate in size to hold payloads and exfil often targets new destinations, so
    per-user baselining exposes the volume and frequency anomalies behind steganographic exfiltration.
    Build 30-day baselines for media bytes/hour, mean carrier size, files/hour, and destination countries/ASNs,
    flagging activity above the 95th percentile or to never-before-seen destinations. Size-versus-dimensions
    outliers are a strong volume signal. A spike to a new ASN with oversized images warrants exfil investigation;
    steady within-baseline traffic is lower priority. References: [StegExpose](https://arxiv.org/abs/1410.6656);
    [Wendzel network steganography](https://arxiv.org/abs/1407.2029).'
  answer_sources: *id005
  range: Last 90 days, with 30-day per-user rolling baselines.
  queries:
  - technology: Zeek/pseudocode
    query: base = per_user_30d(p95(media_bytes/hr), mean_carrier_size, media_files/hr, dest_set); FLAG
      WHERE volume > base.p95 OR dest NOT IN base.dest_set OR size_outlier(dimensions).
- question: Are there spikes in failed media transfers per user or host (HTTP 4xx/5xx, blocked egress,
    NXDOMAIN, proxy denials), especially preceding a successful large media transfer?
  context: 'Exfil attempts probing for an open path leave a failure-rate signature that precedes success,
    a detectable precursor to steganographic data theft. Profile failed-transfer state per user/host on
    media requests and watch for spikes in failed media POSTs or DNS failures before a successful large
    transfer. A burst of denials then a large media upload is high-suspicion and may be caught before
    completion; sporadic failures are normal. Correlate with the volume baseline to confirm the eventual
    success. References: [Wendzel network steganography](https://arxiv.org/abs/1407.2029).'
  answer_sources: *id005
  range: Last 90 days, correlating failure spikes preceding successful transfers.
  queries:
  - technology: Zeek/pseudocode
    query: fails = media_requests WHERE http IN {4xx,5xx} OR blocked OR dns=NXDOMAIN OR proxy_denied;
      FLAG WHERE spike(fails) BY user AND EXISTS large_success_transfer AFTER WITHIN window.
- question: Does observed per-user media-transfer volume (bytes/hour) exceed the confidence interval predicted
    by an ARIMA or LSTM-autoencoder model, and which time windows drive the deviation?
  context: 'Time-series forecasting catches gradual or bursty exfiltration that fixed thresholds miss,
    strengthening Stealth-aware exfil detection. Train ARIMA or LSTM-autoencoder models per user on media
    bytes/hour and alert when observed volume exceeds the predicted confidence interval, including the
    predicted-vs-observed delta and top contributing time windows. A breach of the forecast band with
    a large positive delta indicates abnormal media egress; the time-window attribution focuses the analyst
    on when the anomaly occurred. Within-band traffic is expected and deprioritized. References: [SHAP
    in IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full);
    [Stegomalware survey](https://arxiv.org/abs/2110.02504).'
  answer_sources: *id005
  range: Last 90 days, training on at least 30 days of per-user history.
  queries:
  - technology: ML/pseudocode
    query: model = ARIMA_or_LSTM_AE.fit(user.media_bytes_per_hr history); pred, ci = model.forecast();
      ALERT WHERE observed > ci.upper WITH delta=observed-pred, top_windows.
