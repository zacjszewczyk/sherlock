questions:
- question: '[Stealth] Attrib hidden detection: Using the ''Attrib hidden detection'' (Symbolic Logic)
    approach, can you determine whether the following evidence is present -- A process creation event
    is recorded where ''attrib.exe'' is executed with command-line arguments containing ''+h'' to set
    the hidden file attribute, with file-audit evidence showing the target path was intentionally hidden
    on disk.'
  context: 'Why this matters: Under the Stealth tactic, an adversary marks files and directories as hidden
    so routine user browsing and standard tooling will not reveal them, letting implants, staged data,
    and persistence artifacts remain in plain sight yet unseen. This evidence focuses on the condition
    that a process creation event is recorded where ''attrib.exe'' is executed with command-line arguments
    containing ''+h'' to set the hidden file attribute, with file-audit evidence showing the target path
    was intentionally hidden on disk. This Symbolic Logic approach works as follows: Detect process-creation
    events (Windows Event ID 4688 / Sysmon EID 1) where Image ends with ''\attrib.exe'' (or OriginalFileName=''ATTRIB.EXE'')
    and CommandLine contains '' +h '', confirming on disk via 4663 that the target gained the hidden attribute,
    per [Hiding Files with Attrib.exe, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_attrib_hiding_files.yml)
    and procedures in [MITRE ATT&CK T1564.001](https://attack.mitre.org/techniques/T1564/001/). Maintain
    the floor of deterministic exclusions for documented benign cases (desktop.ini via msiexec; IgfxCUIService
    ''.cui'' via cmd.exe/.bat) and allow-list known software-deployment parents (e.g., ''ccmexec.exe'');
    validate coverage with [Atomic Red Team T1564.001](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1564.001/T1564.001.md).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable artifact-hiding
    activity; pivot to the responsible process and its parent lineage, the user and host context, the
    exact target path and attribute change, and any subsequent execution or network egress from the hidden
    location. A negative result helps rule out this particular hiding vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, living-off-the-land
    activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT host, user, ParentImage, Image, CommandLine, TargetFilename\nFROM process_creation\
      \  /* WinEventLog 4688 or Sysmon EID 1 */\nWHERE (Image LIKE '%\\attrib.exe' OR OriginalFileName\
      \ = 'ATTRIB.EXE')\n  AND CommandLine LIKE '% +h %'\n  /* deterministic benign exclusions */\n  AND\
      \ NOT (CommandLine LIKE '%desktop.ini%' AND ParentImage LIKE '%\\msiexec.exe')\n  AND NOT (CommandLine\
      \ LIKE '%.cui%' AND ParentImage LIKE '%\\cmd.exe')\n  AND ParentImage NOT LIKE '%\\ccmexec.exe'\n\
      /* confirm on disk: join Event 4663 where the same TargetFilename gained FILE_ATTRIBUTE_HIDDEN */\n\
      JOIN file_access fa ON fa.host=host AND fa.ObjectName=TargetFilename\n  AND fa.AccessMask CONTAINS\
      \ 'WriteAttributes' WITHIN 5 minutes"
- question: '[Stealth] Attrib execution frequency and failure scoring: Using the ''Attrib execution frequency
    and failure scoring'' (Statistical Method) approach, can you determine whether the following evidence
    is present -- A process creation event is recorded where ''attrib.exe'' is executed with command-line
    arguments containing ''+h'' to set the hidden file attribute, with file-audit evidence showing the
    target path was intentionally hidden on disk.'
  context: 'Why this matters: Under the Stealth tactic, an adversary marks files and directories as hidden
    so routine user browsing and standard tooling will not reveal them, letting implants, staged data,
    and persistence artifacts remain in plain sight yet unseen. This evidence focuses on the condition
    that a process creation event is recorded where ''attrib.exe'' is executed with command-line arguments
    containing ''+h'' to set the hidden file attribute, with file-audit evidence showing the target path
    was intentionally hidden on disk. This Statistical Method approach works as follows: Per host and
    per user, aggregate count/min and daily counts of ''attrib.exe +h'' (Volume) and the ratio of successful
    vs. access-denied 4663 file-attribute writes (State/Failure). Alert when a host exceeds its 99th-percentile
    daily count over a 30-day rolling baseline or when failed-then-succeeded hide attempts spike, using
    peer-group rarity from [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)
    and enterprise host baselines as in [Unified Host and Network Data Set, Turcotte et al.](https://arxiv.org/abs/1708.07518).
    Derive thresholds from your own 30-day distribution; report the top-3 drivers (host, user, parent
    process) in the alert. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable artifact-hiding activity; pivot to the responsible process and its parent lineage, the user
    and host context, the exact target path and attribute change, and any subsequent execution or network
    egress from the hidden location. A negative result helps rule out this particular hiding vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    living-off-the-land activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 30 days (rolling baseline); pivot to event-centered windows around alerts
  queries:
  - technology: SIEM/Stats pseudocode
    query: "/* 30-day rolling baseline per host and per user */\nevents = process_creation WHERE Image\
      \ LIKE '%\\attrib.exe' AND CommandLine LIKE '% +h %'\ndaily = COUNT(events) BY host, user, day\n\
      p99 = PERCENTILE(daily.count, 99) BY host OVER last 30 days\n/* failure ratio from 4663 attribute\
      \ writes */\nfail_ratio = SUM(4663 access-denied) / SUM(4663 attribute-write attempts) BY host,\
      \ day\nALERT WHEN daily.count > p99\n   OR (fail_ratio spikes AND failed-then-succeeded hide attempts\
      \ observed)\nOUTPUT top-3 drivers: host, user, ParentImage"
- question: '[Stealth] Attrib execution classifier: Using the ''Attrib execution classifier'' (Machine
    Learning) approach, can you determine whether the following evidence is present -- A process creation
    event is recorded where ''attrib.exe'' is executed with command-line arguments containing ''+h'' to
    set the hidden file attribute, with file-audit evidence showing the target path was intentionally
    hidden on disk.'
  context: 'Why this matters: Under the Stealth tactic, an adversary marks files and directories as hidden
    so routine user browsing and standard tooling will not reveal them, letting implants, staged data,
    and persistence artifacts remain in plain sight yet unseen. This evidence focuses on the condition
    that a process creation event is recorded where ''attrib.exe'' is executed with command-line arguments
    containing ''+h'' to set the hidden file attribute, with file-audit evidence showing the target path
    was intentionally hidden on disk. This Machine Learning approach works as follows: Train a supervised
    classifier (e.g., Random Forest) on 4688/Sysmon-1 features for ''attrib.exe +h'' events: parent process,
    user, time-of-day bucket, target directory depth and parent folder (Temp/ProgramData), and bytes/count
    of files hidden in the window. Label from IR findings; for unlabeled fleets, score multivariate rarity
    with [Extended Isolation Forest, Hariri et al.](https://arxiv.org/abs/1811.02141). Surface the top-3
    SHAP/feature contributions (e.g., rare parent, after-hours, ProgramData target) in alert text. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable artifact-hiding
    activity; pivot to the responsible process and its parent lineage, the user and host context, the
    exact target path and attribute change, and any subsequent execution or network egress from the hidden
    location. A negative result helps rule out this particular hiding vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, living-off-the-land
    activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = extract(4688|Sysmon-1 for 'attrib.exe +h'):\n  [parent_process, user, hour_of_day_bucket,\
      \ target_dir_depth,\n   parent_folder_flag(Temp/ProgramData), files_hidden_count, bytes_hidden]\n\
      model = RandomForestClassifier().fit(features, labels_from_IR)\n/* unlabeled fleets: multivariate\
      \ rarity */\nanomaly = ExtendedIsolationForest().fit(features)\nscore = model.predict_proba(x) OR\
      \ anomaly.score(x)\nALERT WHEN score > threshold\nOUTPUT top-3 SHAP contributions (rare parent,\
      \ after-hours, ProgramData target)"
- question: '[Stealth] PowerShell hidden attribute detection: Using the ''PowerShell hidden attribute
    detection'' (Symbolic Logic) approach, can you determine whether the following evidence is present
    -- A PowerShell script block log (Windows Event ID 4104) contains commands that set an item''s ''IsHidden''/''Hidden''
    attribute to true, or create/execute payloads from an Alternate Data Stream (e.g., ''Set-Content -Stream'',
    ''Add-Content ... :stream'', or content.txt:hidden execution).'
  context: 'Why this matters: Under the Stealth tactic, an adversary marks files and directories as hidden
    so routine user browsing and standard tooling will not reveal them, letting implants, staged data,
    and persistence artifacts remain in plain sight yet unseen. This evidence focuses on the condition
    that a PowerShell script block log (Windows Event ID 4104) contains commands that set an item''s ''IsHidden''/''Hidden''
    attribute to true, or create/execute payloads from an Alternate Data Stream (e.g., ''Set-Content -Stream'',
    ''Add-Content ... :stream'', or content.txt:hidden execution). This Symbolic Logic approach works
    as follows: Scan PowerShell script-block logs (Windows Event ID 4104) for the regex ''(?i)(\.Attributes.*\+|Set-ItemProperty.*-Name\s+IsHidden\s+-Value\s+\$true|attrib(\.exe)?\s+\+h)''
    and for ADS write/exec patterns (''-Stream'', '':Zone.Identifier'' manipulation), per attribute mechanisms
    in [MITRE ATT&CK T1564.001](https://attack.mitre.org/techniques/T1564/001/) and command corpus in
    [Atomic Red Team T1564.001](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1564.001/T1564.001.md).
    Keep a suppression list of script hashes used by legitimate administration. A positive result -- a
    rule match, statistical outlier, or model alert -- indicates probable artifact-hiding activity; pivot
    to the responsible process and its parent lineage, the user and host context, the exact target path
    and attribute change, and any subsequent execution or network egress from the hidden location. A negative
    result helps rule out this particular hiding vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, living-off-the-land activity.'
  answer_sources:
  - Windows Event ID 4104
  - 'NAI: User workstations, Exchange Servers, Web Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT host, user, ScriptBlockText\nFROM powershell_scriptblock  /* WinEventLog 4104 */\n\
      WHERE ScriptBlockText MATCHES '(?i)(\\.Attributes.*\\+|Set-ItemProperty.*-Name\\s+IsHidden\\s+-Value\\\
      s+\\$true|attrib(\\.exe)?\\s+\\+h)'\n   OR ScriptBlockText MATCHES '(?i)(-Stream|Add-Content.*:|Set-Content.*-Stream|:Zone\\\
      .Identifier)'\n  AND ScriptHash NOT IN (admin_script_suppression_list)\nOUTPUT host, user, matched\
      \ pattern, ScriptBlockText"
- question: '[Stealth] ADS Mark-of-the-Web tampering detection: Using the ''ADS Mark-of-the-Web tampering
    detection'' (Symbolic Logic) approach, can you determine whether the following evidence is present
    -- A PowerShell script block log (Windows Event ID 4104) contains commands that set an item''s ''IsHidden''/''Hidden''
    attribute to true, or create/execute payloads from an Alternate Data Stream (e.g., ''Set-Content -Stream'',
    ''Add-Content ... :stream'', or content.txt:hidden execution).'
  context: 'Why this matters: Under the Stealth tactic, an adversary marks files and directories as hidden
    so routine user browsing and standard tooling will not reveal them, letting implants, staged data,
    and persistence artifacts remain in plain sight yet unseen. This evidence focuses on the condition
    that a PowerShell script block log (Windows Event ID 4104) contains commands that set an item''s ''IsHidden''/''Hidden''
    attribute to true, or create/execute payloads from an Alternate Data Stream (e.g., ''Set-Content -Stream'',
    ''Add-Content ... :stream'', or content.txt:hidden execution). This Symbolic Logic approach works
    as follows: Detect deletion or modification of the '':Zone.Identifier'' ADS by processes outside an
    allow-list of browsers, Explorer, and PowerShell, per [ADS Zone.Identifier Deleted By Uncommon Application,
    SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_delete/file_delete_win_zone_identifier_ads_uncommon.yml);
    also alert on execution of code whose image path contains a '':'' ADS suffix from non-developer parents.
    Tune the allow-list to your environment''s installed browsers. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable artifact-hiding activity; pivot to the responsible
    process and its parent lineage, the user and host context, the exact target path and attribute change,
    and any subsequent execution or network egress from the hidden location. A negative result helps rule
    out this particular hiding vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, living-off-the-land activity.'
  answer_sources:
  - Windows Event ID 4104
  - 'NAI: User workstations, Exchange Servers, Web Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "/* deletion/modification of :Zone.Identifier ADS by uncommon apps */\nSELECT host, user, Image,\
      \ TargetFilename\nFROM file_delete OR file_change\nWHERE TargetFilename LIKE '%:Zone.Identifier'\n\
      \  AND Image NOT IN (allowlist_browsers, '%\\explorer.exe', '%\\powershell.exe')\nUNION\n/* execution\
      \ of code whose image path contains an ADS ':' suffix from non-developer parents */\nSELECT host,\
      \ user, ParentImage, Image\nFROM process_creation\nWHERE Image MATCHES '.+:[^\\]+' AND ParentImage\
      \ NOT IN (developer_tools_allowlist)"
- question: '[Stealth] Script entropy and obfuscation scoring: Using the ''Script entropy and obfuscation
    scoring'' (Statistical Method) approach, can you determine whether the following evidence is present
    -- A PowerShell script block log (Windows Event ID 4104) contains commands that set an item''s ''IsHidden''/''Hidden''
    attribute to true, or create/execute payloads from an Alternate Data Stream (e.g., ''Set-Content -Stream'',
    ''Add-Content ... :stream'', or content.txt:hidden execution).'
  context: 'Why this matters: Under the Stealth tactic, an adversary marks files and directories as hidden
    so routine user browsing and standard tooling will not reveal them, letting implants, staged data,
    and persistence artifacts remain in plain sight yet unseen. This evidence focuses on the condition
    that a PowerShell script block log (Windows Event ID 4104) contains commands that set an item''s ''IsHidden''/''Hidden''
    attribute to true, or create/execute payloads from an Alternate Data Stream (e.g., ''Set-Content -Stream'',
    ''Add-Content ... :stream'', or content.txt:hidden execution). This Statistical Method approach works
    as follows: For each 4104 script block that sets hidden attributes, compute Shannon entropy and Kullback-Leibler
    divergence against an English/cmdlet baseline (KL outperforms raw entropy for obfuscation) per [Using
    Entropy in Threat Hunting, Red Canary](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).
    Baseline per user over 7 days; flag scripts >3 standard deviations above the user mean or with high
    Base64/char-array density. Include count of encoding functions (Volume) as an explicit feature in
    the alert. A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    artifact-hiding activity; pivot to the responsible process and its parent lineage, the user and host
    context, the exact target path and attribute change, and any subsequent execution or network egress
    from the hidden location. A negative result helps rule out this particular hiding vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    living-off-the-land activity.'
  answer_sources:
  - Windows Event ID 4104
  - 'NAI: User workstations, Exchange Servers, Web Servers'
  range: Last 90 days; build per-user 7-day baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each 4104 script block that sets hidden attributes:\n  H = shannon_entropy(text)\n  KL\
      \ = kl_divergence(text_token_dist, english_cmdlet_baseline)\n  enc_count = count(FromBase64String,\
      \ char[], -enc, concatenation)\nbaseline = mean,std(KL) BY user OVER last 7 days\nALERT WHEN KL\
      \ > user_mean + 3*user_std\n   OR high Base64/char-array density\nOUTPUT host, user, KL, entropy,\
      \ enc_count(Volume)"
- question: '[Stealth] PowerShell clustering anomaly: Using the ''PowerShell clustering anomaly'' (Machine
    Learning) approach, can you determine whether the following evidence is present -- A PowerShell script
    block log (Windows Event ID 4104) contains commands that set an item''s ''IsHidden''/''Hidden'' attribute
    to true, or create/execute payloads from an Alternate Data Stream (e.g., ''Set-Content -Stream'',
    ''Add-Content ... :stream'', or content.txt:hidden execution).'
  context: 'Why this matters: Under the Stealth tactic, an adversary marks files and directories as hidden
    so routine user browsing and standard tooling will not reveal them, letting implants, staged data,
    and persistence artifacts remain in plain sight yet unseen. This evidence focuses on the condition
    that a PowerShell script block log (Windows Event ID 4104) contains commands that set an item''s ''IsHidden''/''Hidden''
    attribute to true, or create/execute payloads from an Alternate Data Stream (e.g., ''Set-Content -Stream'',
    ''Add-Content ... :stream'', or content.txt:hidden execution). This Machine Learning approach works
    as follows: Vectorize hidden-file-setting scripts with TF-IDF over tokens plus metadata (length, FromBase64String
    presence, stream operators) and cluster with DBSCAN/K-Means; treat small/distinct clusters not matching
    known admin toolsets as anomalous. Alternatively model 4104/Sysmon event sequences with a log-sequence
    LSTM to flag anomalous hide-then-execute orderings, per [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015).
    Emit nearest-known-good script and top-3 distinguishing tokens in the alert. A positive result --
    a rule match, statistical outlier, or model alert -- indicates probable artifact-hiding activity;
    pivot to the responsible process and its parent lineage, the user and host context, the exact target
    path and attribute change, and any subsequent execution or network egress from the hidden location.
    A negative result helps rule out this particular hiding vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy, living-off-the-land activity.'
  answer_sources:
  - Windows Event ID 4104
  - 'NAI: User workstations, Exchange Servers, Web Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = TFIDF(tokens of hidden-file-setting scripts)\n   + metadata[length, FromBase64String_present,\
      \ stream_operator_count]\nclusters = DBSCAN(X)  /* or KMeans */\nALERT small/distinct clusters NOT\
      \ matching known admin toolsets\n/* alternative: log-sequence model */\nseq_model = LSTM(DeepLog)\
      \ over 4104/Sysmon event sequences\nALERT anomalous hide-then-execute orderings\nOUTPUT nearest-known-good\
      \ script + top-3 distinguishing tokens"
- question: '[Stealth] Dot-file and hidden-flag path detection: Using the ''Dot-file and hidden-flag path
    detection'' (Symbolic Logic) approach, can you determine whether the following evidence is present
    -- A file or directory is created or renamed with a name beginning with a period (''.''), a space,
    or set with a hidden/UF_HIDDEN flag, captured by file/process auditing on Windows (4663/4688), Linux
    (auditd FILE/EXECVE), or macOS (unified log / file metadata), correlated with the creating process.'
  context: 'Why this matters: Under the Stealth tactic, an adversary marks files and directories as hidden
    so routine user browsing and standard tooling will not reveal them, letting implants, staged data,
    and persistence artifacts remain in plain sight yet unseen. This evidence focuses on the condition
    that a file or directory is created or renamed with a name beginning with a period (''.''), a space,
    or set with a hidden/UF_HIDDEN flag, captured by file/process auditing on Windows (4663/4688), Linux
    (auditd FILE/EXECVE), or macOS (unified log / file metadata), correlated with the creating process.
    This Symbolic Logic approach works as follows: On Windows search 4663 Object Name and 4688 command
    lines for path segments matching ''\\\\.[^\\\\\s]+'' or space-only names; on Linux audit creation/rename
    of names starting with ''.'' in /etc, /usr/bin, /var, and web roots via auditd FILE/EXECVE (mv/cp
    to dotfile); on macOS detect ''chflags hidden'', ''SetFile -a V'', ''.hidden'', and UF_HIDDEN metadata
    changes per [How Malware Persists on macOS, SentinelOne](https://www.sentinelone.com/blog/how-malware-persists-on-macos/)
    and mechanisms in [MITRE ATT&CK T1564.001](https://attack.mitre.org/techniques/T1564/001/). Alert
    when the creating parent is not an allow-listed developer/OS tool (git.exe, code.exe, ssh, package
    managers); validate with [Atomic Red Team T1564.001](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1564.001/T1564.001.md).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable artifact-hiding
    activity; pivot to the responsible process and its parent lineage, the user and host context, the
    exact target path and attribute change, and any subsequent execution or network egress from the hidden
    location. A negative result helps rule out this particular hiding vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, living-off-the-land
    activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - auditd:FILE
  - auditd:EXECVE
  - macos:unifiedlog
  - 'NAI: User profile directories (e.g., ''C:\Users\<username>\''), temporary directories (''%TEMP%''),
    web server root directories, and privileged paths (/etc, /usr/bin, /var, ~/Library)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode (Windows)
    query: "SELECT host, user, Image, ObjectName, CommandLine\nFROM file_access(4663) OR process_creation(4688)\n\
      WHERE ObjectName MATCHES '\\\\\\.[^\\\\\\s]+'  /* dot-prefixed name segment */\n   OR ObjectName\
      \ MATCHES space-only filename\n  AND ParentImage NOT IN (git.exe, code.exe, package_managers)"
  - technology: auditd/pseudocode (Linux)
    query: "ausearch -k file_create -ts recent |\n  match name starting with '.' in (/etc, /usr/bin, /var,\
      \ web_roots)\n  OR EXECVE of mv|cp where target basename starts with '.'\nALERT WHEN creating process\
      \ NOT IN (ssh, dpkg, rpm, yum, apt)"
  - technology: macOS/unifiedlog pseudocode
    query: "MATCH process exec of 'chflags hidden' OR 'SetFile -a V'\n   OR creation of '.hidden' OR file\
      \ metadata change setting UF_HIDDEN\nALERT WHEN parent NOT IN (developer/OS tool allowlist)"
