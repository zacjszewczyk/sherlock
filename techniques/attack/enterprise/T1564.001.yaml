name: 'T1564.001: Hide Artifacts: Hidden Files and Directories'
id: a90c7b8c-348d-4d28-aed4-d52f07dee745
description: 'This playbook helps an analyst investigate whether an adversary is hiding files and directories
  to evade detection as part of the Stealth tactic. Across Windows, Linux, and macOS endpoints, it guides
  the analyst through the many mechanisms used to conceal artifacts: use of attrib.exe with the ''+h''
  flag and corresponding file-attribute writes confirmed on disk; PowerShell script-block activity that
  sets an item''s IsHidden/Hidden attribute or writes and executes payloads from NTFS Alternate Data Streams
  (ADS), including tampering with the '':Zone.Identifier'' Mark-of-the-Web; creation or renaming of files
  and directories whose names begin with a period (''.'') or a single space, and macOS-specific hiding
  via ''chflags hidden'', ''SetFile -a V'', ''.hidden'', and the UF_HIDDEN metadata flag; and the downstream
  behavior where a process running from a known-hidden path initiates outbound network connections to
  external infrastructure. Detection methods combine deterministic symbolic-logic rules, statistical baselining
  (volume, frequency, failure-rate, entropy and rarity scoring), and machine-learning models (supervised
  classifiers, isolation forests, clustering, log-sequence models, and provenance-graph analysis) applied
  to Windows Security/Sysmon events (4688/EID 1, 4663, 5156, 4104), Linux auditd FILE/EXECVE records,
  macOS unified logs and file metadata, and Zeek conn/dns logs, so the analyst can corroborate suspected
  artifact-hiding against process lineage, file and attribute changes, command-line content, and subsequent
  network egress.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
