name: 'T1596.002: WHOIS'
id: 8216939c-1452-45f2-ab31-87801a9913ae
description: 'This playbook helps an analyst investigate whether an adversary is performing WHOIS reconnaissance
  against the organization''s domains, IP ranges, or related infrastructure (MITRE ATT&CK T1596.002, WHOIS).
  Adversaries query regional Internet registry (RIR) WHOIS servers -- over TCP port 43 or via web-based
  registrar lookup services -- to harvest assigned IP blocks, registrant and contact details, DNS nameservers,
  and registration/expiry data they can use to plan active scanning, phishing-for-information, infrastructure
  acquisition, or initial access. Because much of this activity may occur off-network and has a high benign-occurrence
  rate, the hunt pursues the behavior from several complementary angles: connections to TCP/43 or known
  WHOIS/registrar lookup destinations flagged on threat intelligence; outbound HTTP/S requests carrying
  reconnaissance-tool fingerprints (python-whois, recon-ng, theHarvester) or automated query cadence;
  per-host volume/frequency/state outliers versus seasonal and peer-group baselines; unauthorized hosts
  querying the organization''s own assets or typosquatted variants; and temporally correlated recon-to-action
  chains where a WHOIS lookup is followed by scanning or connection attempts to the looked-up infrastructure.
  Detection methods combine deterministic symbolic-logic rules (curated WHOIS watchlists, recon-tool string
  matching, allowlist violations, burst thresholds, and WHOIS-to-scan correlation in the style of SigmaHQ
  and CAR-2016-03-001), statistical baselining (Wald''s SPRT/threshold random walk for failed-contact
  enumeration, Holt-Winters seasonal volume deviation, Kruegel & Vigna HTTP attribute profiling, Shannon-entropy
  of queried domains, and new-destination connection ratios), and machine learning (EXPOSURE/Notos-style
  domain reputation scoring, Kitsune autoencoder ensembles for flow and volume anomalies, Hopper rare-access
  scoring, and HMM sequence-transition modeling), applied across Zeek conn/dns/http/ssl logs and Windows
  Event ID 5156 so the analyst can corroborate suspected WHOIS reconnaissance against source identity,
  authorization, query targets, and subsequent adversary actions.'
