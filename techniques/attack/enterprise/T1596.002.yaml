questions:
- question: '[Reconnaissance] Malicious WHOIS destination match: Can you determine whether an internal
    host establishes a connection over TCP port 43 (WHOIS) or to a known web-based WHOIS/registrar lookup
    service (matched by HTTP Host/TLS SNI), where the destination is flagged on threat intelligence or
    scored as attacker-staged. Profile both successful and failed (RST/404/429/NXDOMAIN) outcomes as distinct
    signals. -- specifically, using the ''Malicious WHOIS destination match'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), adversaries search public WHOIS
    data held by regional Internet registries to learn assigned IP blocks, registrant and contact information,
    DNS nameservers, and domain registration details about the organization, then leverage that intelligence
    to plan active scanning, phishing-for-information, infrastructure acquisition, or initial access.
    This evidence focuses on the condition that an internal host establishes a connection over TCP port
    43 (WHOIS) or to a known web-based WHOIS/registrar lookup service (matched by HTTP Host/TLS SNI),
    where the destination is flagged on threat intelligence or scored as attacker-staged. Profile both
    successful and failed (RST/404/429/NXDOMAIN) outcomes as distinct signals. This Symbolic Logic approach
    works as follows: Maintain a curated watchlist of WHOIS service IPs/domains and alert when Zeek conn.log
    id.resp_p==43 or http.log/ssl.log destinations (Host/SNI) match the list or known-malicious TI entries,
    using the deterministic destination/port + command-line signature pattern from [SigmaHQ](https://github.com/SigmaHQ/sigma).
    A positive result -- a deterministic rule match, a statistical outlier above the established baseline,
    or a model alert -- indicates probable WHOIS reconnaissance; pivot to the originating host and identity,
    confirm whether the source is in an authorized group (Security Operations, Network Engineering), enumerate
    which of the organization''s domains/IP ranges or typosquatted variants were queried, and correlate
    with any subsequent scanning, connection attempts, or phishing to confirm a recon-to-action chain.
    A negative result helps rule out this particular reconnaissance vector but should be corroborated
    with the other questions in this playbook, since WHOIS lookups are often performed off-network and
    a single method can miss low-volume, distributed, or web-fronted enumeration.'
