    query: "join files.log + ftp.log + conn.log\nwhere filename ~ /\\.(bin|img|tar|SPA)/ or mime in image_mimes\
      \ or path in image_paths\nif service in {tftp,ftp} or orig_h not in approved_mgmt_hosts\n   or not\
      \ in_maintenance_window(ts):\n  alert('unauthorized firmware transfer', src=orig_h, dst=resp_h)"
  - technology: SIEM/Rule pseudocode
