questions:
- question: Do any retrieved network device OS image files match known-bad firmware signatures (SHA-256/ssdeep
    hash lists, YARA rules) or appear in versions not approved in the CMDB?
  context: 'This is the deterministic floor for detecting a patched system image. Acquire OS image files
    from approved repositories and from any observed transfer destination, then compute SHA-256 and an
    ssdeep fuzzy hash and run YARA/binary signatures aligned to firmware implants. Alert on matches to
    threat-intel hash lists, YARA hits, or allow-list violations where the image name/version is not in
    the CMDB-approved set. CRITICAL for the Defense Impairment tactic: compare by hash, not file size,
    because real implants (e.g., SYNful Knock) keep the image size constant to defeat naive size checks.
    Use magic-byte unpacking and entropy/section profiling to triage unknown images and similarity-match
    against a known-good/known-bad corpus. A positive result (hash/YARA/allow-list hit) is high-confidence
    evidence of a tampered image; a clean result does not rule out in-memory-only patching. Preserve the
    sample and extract metadata (size, timestamp, origin host) for triage. Sources: [Cisco IOS Software
    Integrity Assurance](https://sec.cloudapps.cisco.com/security/center/resources/integrity_assurance.html);
    [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf); [Costin
    et al](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf); [SYNful
    Knock, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/).'
  answer_sources:
  - Network device OS image files
  - Zeek files.log
  - Zeek ftp.log
  - Web Server Access Logs
  - 'NAI: Configuration management servers, Core network switches and routers, Perimeter firewalls, TFTP/FTP/SCP
    servers, Centralized file analysis sandbox, Golden image repository'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for image in retrieved_os_images:\n  sha256 = hash_sha256(image); fuzzy = ssdeep(image)\n\
      \  if sha256 in ti_badhash_list or yara_scan(image).hits\n     or (image.name, image.version) not\
      \ in cmdb_approved_set:\n    alert('Known-bad/unapproved OS image', device=image.origin, sha256=sha256)"
  - technology: Zeek/pseudocode
    query: '# correlate files.log image extractions for offline hashing

      files.log where mime_type in image_mimes or filename ~ /\.(bin|img|tar|SPA)/

      | extract sha256, source_host, dest_host -> push to YARA/hash pipeline'
- question: Are any retrieved OS images or their transfers statistical outliers in size, byte-frequency
    fileprint, transfer frequency, protocol, or origin host versus a per-model baseline?
  context: 'After the deterministic check, score residual risk on retrieved images and the transfers that
    delivered them. Build a baseline per device model for image byte counts (Volume), transfers/day (Frequency),
    protocol mix, and filename/version patterns. Flag images/transfers that are size outliers (>99th percentile),
    first-seen in 180 days, originate from novel management hosts, or use atypical protocols such as TFTP
    outside maintenance windows. Validate the retrieved image''s byte-frequency ''fileprint'' against
    the expected vendor model using Mahalanobis distance. Separately track failed/blocked image fetches
    and signature-verification failures as their own distribution (a state/failure signal). Emit one combined
    risk score from protocol rarity + origin novelty + size z-score + fileprint distance. For Defense
    Impairment this catches implant staging that evades exact signatures but deviates from the legitimate
    firmware-management envelope. Sources: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [Mitchell and Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf); [PAYL](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).'
  answer_sources:
  - Network device OS image files
  - Zeek files.log
  - Zeek ftp.log
  - Web Server Access Logs
  - 'NAI: Configuration management servers, Core network switches and routers, Perimeter firewalls, TFTP/FTP/SCP
    servers, Centralized file analysis sandbox, Golden image repository'
  range: Last 180 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per device_model: bytes, transfers_per_day, protocol_mix, fileprint_vector\nfor img\
      \ in retrieved_images:\n  z_size = zscore(img.bytes, model_baseline.bytes)\n  fp_dist = mahalanobis(img.bytefreq,\
      \ model_baseline.fileprint)\n  novelty = (img.origin_host not seen in 180d) + (img.proto==TFTP)\n\
      \  risk = w1*z_size + w2*fp_dist + w3*novelty + w4*proto_rarity\n  if risk > threshold or z_size>p99:\
      \ alert('image transfer/artifact outlier')"
  - technology: SIEM/Stats pseudocode
    query: '# failure-signal distribution

      count failed_image_fetch, sigverify_fail by device,day | alert on bursts > p95'
- question: Does a supervised firmware-implant classifier rate any retrieved image as a likely implant
    based on entropy, section structure, strings, imports, and golden-image similarity?
  context: 'As an explainable triage layer, extract defensible features from each image (entropy profile,
    section count, string n-grams, imported symbols, ssdeep similarity to the golden image, compression
    markers) and train a supervised classifier (Gradient Boosting/Random Forest) on known-good vendor
    images versus known/synthetic implants. Surface the top-3 contributing features (e.g., entropy delta,
    novel section, low golden-similarity) in the alert for explainability. Route high-probability implants
    to reverse engineering and containment (block transfer source, quarantine the repository entry). Validate
    on unseen/synthetic implants and never rely on the score alone — the deterministic hash floor remains
    authoritative. In a Defense Impairment context this prioritizes which images get scarce RE resources
    when no exact signature exists yet. Sources: [Costin et al](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf);
    [Anton et al](https://arxiv.org/abs/1907.10374); [Explainable AD for ICS](https://arxiv.org/abs/2205.01930);
    [Kus et al](https://arxiv.org/abs/2205.09199).'
  answer_sources:
  - Network device OS image files
  - Zeek files.log
  - Zeek ftp.log
  - Web Server Access Logs
  - 'NAI: Configuration management servers, Core network switches and routers, Perimeter firewalls, TFTP/FTP/SCP
    servers, Centralized file analysis sandbox, Golden image repository'
  range: Last 180 days
  queries:
  - technology: ML/pseudocode
    query: "features = [entropy_profile, n_sections, string_ngrams, imports,\n            ssdeep_sim_to_golden,\
      \ compression_markers]\nmodel = GradientBoosting.fit(known_good_images, known_and_synthetic_implants)\n\
      p = model.predict_proba(features)\nif p_implant > 0.8:\n  alert('likely firmware implant', top3=model.top_features(features))\n\
      \  route_to(reverse_engineering); contain(transfer_source)"
- question: Does the cryptographic hash of any device's running or stored OS image fail to match the vendor
    golden hash / CMDB-approved version, or did the device emit an image-integrity-validation failure?
  context: 'This directly answers whether a stored or running image was modified. On a schedule and on-demand
    after sensitive events (image transfer, boot change, reload), collect running and stored image hashes
    on-box (e.g., ''verify /md5'', ''show software authenticity'') and compare them to vendor golden hashes
    and CMDB-approved versions. Alert immediately on any mismatch, unsigned image, or unknown version
    string, and ingest Cisco %PLATFORM-1-IMAGE_INTEGRITY_FAIL and equivalent syslog. Compare by hash because
    implants preserve size. Attach device identity, image path, and the last change actor from AAA/TACACS+
    logs. For Defense Impairment, a hash mismatch or integrity-fail is among the strongest indicators
    that defenses on the device may already be weakened, demanding immediate forensic image retrieval
    and isolation. Sources: [Cisco IOS Software Integrity Assurance](https://sec.cloudapps.cisco.com/security/center/resources/integrity_assurance.html);
    [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf); [SYNful
    Knock, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/).'
  answer_sources:
  - Network device OS image files
  - Vendor Firmware Hash Repository
  - Cisco Syslog Message ID %PLATFORM-1-IMAGE_INTEGRITY_FAIL
  - Network device syslog
  - TACACS+ command authorization logs
  - 'NAI: Configuration Management Database (CMDB), Golden Image Repository server, Critical network infrastructure
    (core routers, edge firewalls), Automated configuration management platforms, Centralized syslog server,
    AAA servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for dev in devices:\n  running = onbox(dev,'verify /md5 system:running-image')\n  stored \
      \ = onbox(dev,'show software authenticity / verify flash')\n  if running != golden_hash(dev.version)\
      \ or stored != golden_hash(dev.version)\n     or dev.version not in cmdb_approved or image_unsigned(dev):\n\
      \    alert('golden hash mismatch', dev=dev, actor=aaa_last_change(dev))"
  - technology: SIEM/Rule pseudocode
    query: 'syslog where msg_id in (''%PLATFORM-1-IMAGE_INTEGRITY_FAIL'', authenticity_fail)

      | alert immediately, enrich with device, image_path, last_change_actor'
- question: Are image-integrity / boot-validation failures or hash drift events clustering above baseline
    or occurring outside approved change windows, especially within hours of a transfer, boot edit, or
    reload?
  context: 'Baseline per device the frequency of integrity-failure and image/boot-validation syslog (a
    state/failure signal). Flag clusters above the 95th percentile per 7-day window and any occurrence
    outside approved change windows. Treat tight coupling of (integrity failure OR hash drift) within
    0-2 hours of (image transfer OR boot-variable edit OR reload) as a high-confidence patch pattern and
    prioritize for incident response. This statistical view exposes slow or distributed tampering campaigns
    against the device fleet that single-event rules might under-prioritize, supporting the Defense Impairment
    question of whether OS images were modified to evade defenses. Sources: [Cisco IOS Software Integrity
    Assurance](https://sec.cloudapps.cisco.com/security/center/resources/integrity_assurance.html); [Mitchell
    and Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf).'
  answer_sources:
  - Network device OS image files
  - Vendor Firmware Hash Repository
  - Cisco Syslog Message ID %PLATFORM-1-IMAGE_INTEGRITY_FAIL
  - Network device syslog
  - TACACS+ command authorization logs
