- question: Do firmware-transfer counts/bytes or host pairs exceed the per-device-type and per-subnet
    baseline, and are bursts of failed/blocked transfers preceding a success?
  context: 'Baseline per device type and management subnet the normal hourly frequency and volume (bytes)
    of image transfers and the typical host pairs. Flag events exceeding the 99th percentile for count
    or bytes, or host pairs unseen in 90-180 days. As a failure-mode signal, separately baseline failed/blocked/aborted
    transfers (Zeek conn_state REJ/RSTO/S0) and alert on bursts of failed attempts preceding a success,
    which can indicate brute-forcing or protocol fallback. Validate the transferred content''s byte fileprint
    against the expected model. Promote the alert when novelty co-occurs with off-hours execution or process
    anomalies on Windows hosts. This statistical layer surfaces image staging that is policy-permitted
    but behaviorally abnormal. Sources: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [Mitchell and Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf); [PAYL](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).'
