- question: Does an Isolation-Forest residual model flag firmware-transfer time series as anomalous after
    removing trend and seasonality, given protocol, origin role, and ticket context?
  context: 'Build a time series of firmware-transfer events and bytes per device group, decompose into
    trend/seasonality, and run an anomaly detector (Isolation Forest) on the residual features plus context
    (protocol, origin role, ticket presence). Display contributing factors (protocol rarity, host novelty,
    off-hours, byte volume) as the top-3 in the alert for triage. By modeling expected seasonal maintenance
    rhythms, this isolates the unexpected transfer spikes that simple thresholds miss, helping the analyst
    determine whether a patched image is being staged outside the normal Defense Impairment-relevant maintenance
    cadence. Sources: [Anton et al](https://arxiv.org/abs/1907.10374); [Explainable AD for ICS](https://arxiv.org/abs/2205.01930).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek ftp.log
  - Windows Event ID 4688
  - Web Server Access Logs
  - 'NAI: Network taps/SPAN ports feeding Zeek sensors, Management network segments, File transfer servers
    (TFTP, FTP, SCP/SFTP), Windows management workstations, Network management jump hosts'
  range: Last 180 days
  queries:
  - technology: ML/pseudocode
    query: "ts = series(firmware_transfer_count, bytes per device_group)\nresid = ts - decompose(ts).trend\
      \ - decompose(ts).seasonal\nfeat = [resid, protocol, origin_role, has_ticket]\niforest = IsolationForest.fit(history)\n\
      if iforest.score(feat) anomalous:\n  alert('residual transfer anomaly', top3=contrib_factors(feat))"
- question: Were privileged memory-modifying or debug commands (debug, poke, TCL/GDB, memory-write primitives)
    executed on a device by a non-approved role/jump host or without a matching change ticket?
  context: 'Maintain an allow-list of sanctioned debug/memory-modifying commands by device model and role;
    in-memory patching via debug/TCL/GDB primitives is a documented attack path and such maintenance actions
    must be restricted. Alert when these commands run from non-approved roles/jump hosts or without a
    matching change ticket. Capture context (the previous 20 commands, login source IP, session start/stop).
    Crucially, corroborate suspected runtime patching with a core dump / runtime memory integrity check,
    because in-memory patching leaves stored-image hashes looking clean. This addresses the hardest Defense
    Impairment variant: live OS modification that survives only until reboot and evades on-disk integrity
    checks. Sources: [Cisco IOS Software Integrity Assurance](https://sec.cloudapps.cisco.com/security/center/resources/integrity_assurance.html);
    [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - TACACS+ command authorization logs
  - Network device syslog
  - IT Service Management (ITSM) change records
  - Privileged Access Management session logs
  - 'NAI: Centralized syslog server, AAA servers (TACACS+/RADIUS), ITSM platform (e.g., ServiceNow), Privileged
    Access Management (PAM) systems, Network management jump hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for cmd in aaa_command_log where cmd in {debug, poke, gdb, tclsh, memory_write}:\n  if cmd.role\
      \ not in allowlist(cmd.device_model)\n     or cmd.jump_host not approved or no_change_ticket(cmd):\n\
      \    alert('unauthorized memory/debug command',\n          ctx=last20_cmds(session), src_ip=cmd.login_ip)\n\
      \    request(runtime_memory_integrity_check, core_dump)"
- question: Is any privileged admin's use of debug/memory commands deviating sharply from their own baseline,
    or is it a first-time use on a critical device or of a new memory-command family?
  context: 'Baseline each privileged admin''s frequency of debug/memory command usage per 24h and the
    typical devices targeted. Flag deviations greater than 3 standard deviations or above the 99th percentile,
    and especially first-time use on a critical device or first-time use of a specific memory-command
    family for that admin. Track denied/authorization-failed command attempts from TACACS+ as a state
    signal. This per-actor profiling catches a compromised or insider account suddenly reaching for the
    live-patching toolset, even within an otherwise authorized session, supporting the Defense Impairment
    question of in-memory OS modification. Sources: [Mitchell and Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf).'
  answer_sources:
  - TACACS+ command authorization logs
  - Network device syslog
  - IT Service Management (ITSM) change records
  - Privileged Access Management session logs
  - 'NAI: Centralized syslog server, AAA servers (TACACS+/RADIUS), ITSM platform (e.g., ServiceNow), Privileged
    Access Management (PAM) systems, Network management jump hosts'
  range: Last 180 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per admin: debug_mem_cmd_count/24h, devices_targeted\nfor use in debug_mem_uses:\n\
      \  if use.rate > mean+3sd or > p99\n     or first_time_on(critical_device)\n     or first_time_family(admin,\
      \ use.cmd_family):\n    alert('per-admin debug/memory deviation')\ncount tacacs denied_cmd as state_signal"
- question: Does a one-class boundary model flag a maintenance session as outside the learned envelope
    of authorized sessions (device criticality, command tokens, duration, source host, time, ticket)?
  context: 'Train a one-class boundary model (One-Class SVM) on features from authorized maintenance sessions:
    device criticality, command tokens, session duration, source host, time-of-day, and ticket metadata.
    Alert on sessions outside the learned boundary and provide a nearest-neighbor comparison to the most
    similar authorized session, with the top-3 deviating features. Evaluate against unseen tradecraft
    and keep the symbolic allow-list as the floor. This models the holistic shape of legitimate privileged
    sessions so that novel in-memory-patching workflows — which may use only individually permitted commands
    — still fall outside the boundary, aiding the Defense Impairment investigation. Sources: [Anton et
    al](https://arxiv.org/abs/1907.10374); [Explainable AD for ICS](https://arxiv.org/abs/2205.01930);
    [Kus et al](https://arxiv.org/abs/2205.09199).'
  answer_sources:
  - TACACS+ command authorization logs
  - Network device syslog
  - IT Service Management (ITSM) change records
  - Privileged Access Management session logs
  - 'NAI: Centralized syslog server, AAA servers (TACACS+/RADIUS), ITSM platform (e.g., ServiceNow), Privileged
    Access Management (PAM) systems, Network management jump hosts'
  range: Last 180 days
  queries:
  - technology: ML/pseudocode
    query: "feat = [device_criticality, command_tokens, duration, src_host, tod, ticket_meta]\nocsvm =\
      \ OneClassSVM.fit(authorized_sessions)\nif ocsvm.predict(session) == outlier:\n  alert('session\
      \ outside authorized boundary',\n        nearest=ocsvm.nn(session), top3=dev_features(session))\n\
      # allow-list remains the floor"
- question: Were boot variables ('boot system', config-register, boot loader parameters) edited on a device
    without a matching approved change ticket, and does the new boot config break any policy/reachability
    invariant versus the golden baseline?
  context: 'Alert on configuration-change events that include boot-variable edits (''boot system'', ''config-register'',
    boot loader parameters). Diff each device''s boot-related config against the last known-good golden
    baseline and verify no policy/reachability invariant is broken (e.g., with Batfish / Header Space
    Analysis). Enforce maintenance-window and authorized-account rules, correlate to ITSM change records,
    and suppress only when an approved ticket exists for that device/time/role/jump host. Enrich with
    AAA logs to attribute the actor. Because changing the boot image is how a patched image gets loaded
    on reboot, an unticketed boot edit is a leading indicator of staged Defense Impairment and warrants
    immediate image-hash validation. Sources: [Batfish](https://www.usenix.org/system/files/conference/nsdi15/nsdi15-paper-fogel.pdf);
    [Header Space Analysis](https://www.usenix.org/system/files/conference/nsdi12/nsdi12-final8.pdf);
    [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Network device configuration audit logs
  - Network device syslog (e.g., Cisco %SYS-5-CONFIG_I)
  - TACACS+ command authorization logs
  - ITSM change records
  - 'NAI: Network configuration management servers (e.g., SolarWinds NCM), Centralized syslog server,
    AAA servers, ITSM platform, Git repositories for version-controlled configurations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for chg in config_change_events where chg ~ /boot system|config-register|boot loader/:\n \
      \ diff = boot_config(device) vs golden_baseline(device)\n  if breaks_invariant(diff) or not approved_ticket(device,chg.time,chg.role,chg.jump_host):\n\
      \    alert('boot edit without ticket', actor=aaa(chg), diff=diff)"
- question: Does daily boot-config drift exceed the 95th percentile of ticket-approved maintenance drift
    for the device class, or does unauthorized boot drift recur on consecutive days?
  context: 'Perform a daily diff of each device''s boot-related configuration against the last known-good
    backup. Compute a drift score weighted by sensitivity (boot system / config-register > logging tweaks
    > banner). Alert when the score exceeds the 95th percentile of historical ticket-approved maintenance
    drift for that device class, or when drift recurs on consecutive days (suggesting persistent unauthorized
    modification). Track failed config commits/rollbacks as a distinct state signal. This quantifies how
    far a device''s boot posture has moved from approved baselines, catching slow or repeated tampering
    aimed at ensuring a patched image persists across reboots under the Defense Impairment tactic. Sources:
    [Batfish](https://www.usenix.org/system/files/conference/nsdi15/nsdi15-paper-fogel.pdf).'
  answer_sources:
  - Network device configuration audit logs
  - Network device syslog (e.g., Cisco %SYS-5-CONFIG_I)
  - TACACS+ command authorization logs
  - ITSM change records
  - 'NAI: Network configuration management servers (e.g., SolarWinds NCM), Centralized syslog server,
    AAA servers, ITSM platform, Git repositories for version-controlled configurations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "daily: diff = boot_config(device) vs last_known_good\nscore = w_bootsys*Δbootsys + w_reg*Δconfigreg\
      \ + w_log*Δlogging + w_banner*Δbanner\nif score > p95(ticket_approved_drift[device_class])\n   or\
      \ drift_recurs_consecutive_days(device):\n  alert('boot drift risk')\ntrack failed_commit/rollback\
      \ as state_signal"
- question: When a boot-config change occurs, does the linked change ticket's classified intent (Firmware
    Upgrade vs ACL/Interface/Emergency) match the change — or is there no ticket at all?
  context: 'Train a text classifier on historical change tickets to categorize intent (Firmware Upgrade,
    ACL Change, Interface Config, Emergency Break/Fix). When boot-config changes are detected, retrieve
    the linked ticket and flag as high-risk when the ticket category is inconsistent with boot changes
    (e.g., an ''ACL Change'' ticket accompanying a boot-system edit) or when no ticket exists, surfacing
    the top contributing tokens for explainability. Prioritize flagged devices for immediate image-hash
    validation and isolation checks. This catches adversaries who hide a malicious boot edit behind an
    unrelated or absent change record, a key concealment vector for the Defense Impairment objective.
    Sources: [Anton et al](https://arxiv.org/abs/1907.10374); [Explainable AD for ICS](https://arxiv.org/abs/2205.01930).'
  answer_sources:
  - Network device configuration audit logs
  - Network device syslog (e.g., Cisco %SYS-5-CONFIG_I)
  - TACACS+ command authorization logs
  - ITSM change records
  - 'NAI: Network configuration management servers (e.g., SolarWinds NCM), Centralized syslog server,
    AAA servers, ITSM platform, Git repositories for version-controlled configurations'
  range: Last 180 days
  queries:
  - technology: ML/pseudocode
    query: "clf = TextClassifier.fit(historical_tickets -> intent_labels)\non boot_config_change:\n  ticket\
      \ = linked_ticket(change)\n  intent = clf.predict(ticket.text) if ticket else NONE\n  if intent\
      \ != 'Firmware Upgrade' or ticket is None:\n    alert('ticket-intent mismatch for boot change',\n\
      \          top_tokens=clf.explain(ticket))\n    prioritize(image_hash_validation, isolation_check)"
