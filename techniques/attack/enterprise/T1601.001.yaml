      if exists transfer|boot_edit|reload within 2h of event:\n  escalate('coupled patch pattern')"
- question: Does a risk-ranking model elevate any image-change event based on actor role, jump host, time-of-day,
    protocol, missing change ticket, proximity to privileged commands, and integrity-check triggers?
  context: 'Train a Random Forest over validated historical change events using features such as actor
    role, jump host, time-of-day, protocol, presence/absence of a change ticket, proximity to privileged
    commands, and whether integrity checks triggered. Expose per-feature importance and the top-3 drivers
    per alert. Use it to prioritize which devices need immediate forensic image retrieval and isolation,
    but never substitute the model for the deterministic golden-hash check. This helps the analyst triage
    a noisy stream of legitimate-looking change events down to the few most consistent with malicious
    image patching under the Defense Impairment tactic. Sources: [Anton et al](https://arxiv.org/abs/1907.10374);
    [Explainable AD for ICS](https://arxiv.org/abs/2205.01930); [Kus et al](https://arxiv.org/abs/2205.09199).'
  answer_sources:
