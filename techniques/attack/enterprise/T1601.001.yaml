name: 'T1601.001: Modify System Image: Patch System Image'
id: 980aa21a-809e-4114-85fe-9ad4eae3bda2
description: Investigate whether an adversary has patched or implanted a network device operating system
  image to weaken defenses or add covert capabilities (e.g., SYNful Knock-style implants). This playbook
  helps an analyst (1) triage retrieved OS images for known-bad hashes, YARA hits, and implant-like artifacts;
  (2) confirm integrity by comparing running and stored image hashes against vendor golden hashes and
  CMDB-approved versions; (3) reconstruct the canonical patch kill chain of image transfer -> boot-variable
  change -> reload, including concealment such as log clearing; (4) detect anomalous firmware transfers
  over insecure protocols, from untrusted hosts, or outside maintenance windows; (5) catch in-memory patching
  via privileged debug/memory-modifying commands; and (6) flag boot configuration edits that lack an authorized
  change ticket. Because implants commonly preserve file size, comparisons rely on cryptographic hashes
  rather than size, and deterministic hash/allow-list checks remain authoritative over statistical and
  ML scoring.
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
