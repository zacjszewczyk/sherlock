      if score high: alert('high-risk image change', top3=rf.importances(event))\n# golden-hash check\
      \ still authoritative"
- question: Within a 15-minute window, did a device experience an image transfer, then a boot-system/config-register
    change, then a reload — the canonical patch sequence — especially with log manipulation in the same
    session?
  context: 'This reconstructs the canonical patch kill chain. In the SIEM, correlate within a 15-minute
    window: (a) an image transfer (TFTP/FTP/SCP) to the device, (b) a ''boot system'' / config-register
    modification from AAA logs, and (c) a reload/reboot from syslog. Each step alone may be routine, but
    their tight sequence is a restricted maintenance action and, when unscheduled, a strong patch indicator.
    Escalate severity if the same session also includes log manipulation (clear logging, disable logging,
    remove AAA accounting), a known concealment step in implant tradecraft. For Defense Impairment this
    directly answers whether an adversary staged and activated a modified OS image while hiding their
    tracks. Sources: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [SYNful Knock, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/).'
  answer_sources:
  - TACACS+ command authorization logs
  - Network device syslog
  - Network device configuration audit logs
  - Zeek conn.log
  - 'NAI: Centralized syslog server, Authentication Authorization and Accounting (AAA) servers, Network
    management jump hosts, SIEM platform, Management network segments monitored by Zeek'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "correlate within 15m by device:\n  A = transfer(proto in {TFTP,FTP,SCP}) to device\n  B =\
      \ aaa_cmd ~ /boot system|config-register|boot loader/\n  C = syslog reload|reboot\nif A and B and\
      \ C: alert('patch kill chain', device, session)\nif session has /clear logging|no logging|no aaa\
      \ accounting/:\n  escalate('concealment in patch session')"
- question: Is the ordering or inter-event timing of transfer -> boot edit -> reload anomalous for the
    device/admin, or initiated by an actor with no firmware change in 180 days?
  context: 'Per admin account and device, baseline the typical ordering and inter-event timing of transfer
    -> boot edit -> reload during legitimate maintenance. Flag sequences whose transfer-to-reload latency
    is in the top or bottom 1% for that device type, or that are initiated by an actor with no firmware
    change in 180 days (a first-time firmware actor on critical infrastructure). Track failed/aborted
    reloads as a distinct state signal. This catches both rushed scripted patching (abnormally short latency)
    and stealthy, drawn-out staging that does not match how real maintenance unfolds, supporting the Defense
    Impairment investigation. Sources: [Mitchell and Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf).'
  answer_sources:
  - TACACS+ command authorization logs
  - Network device syslog
  - Network device configuration audit logs
  - Zeek conn.log
  - 'NAI: Centralized syslog server, Authentication Authorization and Accounting (AAA) servers, Network
    management jump hosts, SIEM platform, Management network segments monitored by Zeek'
  range: Last 180 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per (admin,device_type): seq_order, transfer_to_reload_latency\nfor seq in patch_sequences:\n\
      \  if seq.latency in top1pct or bottom1pct(device_type)\n     or seq.actor has no firmware_change\
      \ in 180d:\n    alert('rare-sequence/timing or novel firmware actor')\ntrack aborted_reload as state_signal"
- question: Does an LSTM/DeepLog-style model score any AAA command session as a low-likelihood sequence,
    particularly those mixing debug/memory commands, boot edits, and log clearing near a transfer and
    reload?
  context: 'Train an LSTM (DeepLog-style) on tokenized AAA command streams from approved maintenance periods
    and score new sessions, alerting on low-likelihood sequences — especially those containing debug/memory
    commands, boot edits, or log clearing near an image transfer and reload. Present analysts the ranked
    deviating command tokens and the nearest historical ''normal'' sequence for explainability. Unlike
    fixed correlation rules, this learns the grammar of legitimate maintenance and flags sessions that
    violate it even when individual commands are permitted, helping reveal novel patch tradecraft under
    the Defense Impairment tactic. Sources: [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf);
    [Explainable AD for ICS](https://arxiv.org/abs/2205.01930).'
  answer_sources:
  - TACACS+ command authorization logs
  - Network device syslog
  - Network device configuration audit logs
  - Zeek conn.log
  - 'NAI: Centralized syslog server, Authentication Authorization and Accounting (AAA) servers, Network
    management jump hosts, SIEM platform, Management network segments monitored by Zeek'
  range: Last 180 days
  queries:
  - technology: ML/pseudocode
    query: "model = DeepLog_LSTM.fit(tokenized_aaa_cmds from approved_maintenance)\nfor session in new_sessions:\n\
      \  ll = model.sequence_loglik(session.tokens)\n  if ll < threshold:\n    alert('anomalous command\
      \ sequence',\n          deviating_tokens=model.rank_dev(session),\n          nearest_normal=model.nn(session))"
- question: Are there OS-image-like file transfers to/from network devices that use disallowed protocols
    (TFTP/FTP), originate from non-approved management hosts, or fall outside an approved maintenance
    window?
  context: 'Detect OS-image-like transfers (by filename extension, MIME type, or known image paths) to/from
    network devices, then alert when the transfer uses a disallowed protocol (TFTP/FTP), originates from
    a non-approved management host, or targets a device outside an approved maintenance window. Firmware-transfer
    restriction and protocol/account/window allow-listing are mandated controls. Enrich with Windows Event
    ID 4688 process lineage to identify who ran scp/tftp/ftp and from where. This is the network-side
    detection of patched-image staging: a positive hit means an OS image moved in a way policy forbids,
    which under Defense Impairment may be the precursor to weakening the device''s defenses on next boot.
    Sources: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek ftp.log
  - Windows Event ID 4688
  - Web Server Access Logs
  - 'NAI: Network taps/SPAN ports feeding Zeek sensors, Management network segments, File transfer servers
    (TFTP, FTP, SCP/SFTP), Windows management workstations, Network management jump hosts'
