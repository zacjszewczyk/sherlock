- question: '[Exfiltration] Using the Statistical Method approach, can you determine whether an outbound
    network connection''s destination IP address, FQDN, or URL is present on a threat intelligence feed
    of known malicious indicators related to data exfiltration. Specifically: For newly observed domains
    not present in CTI feeds, calculate a prevalence score by dividing the number of distinct internal
    hosts connecting to the domain by the total number of active internal hosts within a 24-hour window?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary uses an existing, legitimate
    external web service to exfiltrate stolen data instead of their primary C2 channel, because hosts
    are already communicating with these popular, TLS-encrypted services and firewall rules already permit
    them -- giving the exfiltration significant cover. This evidence focuses on the condition that an
    outbound network connection''s destination IP address, FQDN, or URL is present on a threat intelligence
    feed of known malicious indicators related to data exfiltration. This Statistical Method approach
    works as follows: For newly observed domains not present in CTI feeds, calculate a prevalence score
    by dividing the number of distinct internal hosts connecting to the domain by the total number of
    active internal hosts within a 24-hour window, following fleet-wide frequency/prevalence analysis
    [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).
    Flag any domain with a prevalence below a low threshold (e.g., <1%) for analyst review. Failure-Mode
    signal: separately track the rate of NXDOMAIN responses (dns.log `rcode_name`) and firewall-denied/RST
    connections per destination; a rare destination reached only after many failed resolutions/blocks
    is a distinct, higher-priority signal than a clean low-prevalence connection. A positive result --
    a rule match, statistical outlier, or model alert -- is consistent with data leaving the environment
    over a sanctioned web service; pivot to the responsible host and process lineage, the user and device
    context, the destination service and its reputation, the volume, direction, cadence, and entropy of
    the transfer, and what sensitive data was staged or accessed beforehand. A negative result helps rule
    out this particular exfiltration vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, low-and-slow, or TLS-encrypted exfiltration.'
