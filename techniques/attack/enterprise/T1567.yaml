- question: '[Exfiltration] Using the Symbolic Logic approach, can you determine whether an outbound web
    connection shows a data transfer volume where sent bytes significantly exceed received bytes, or where
    the total volume of an HTTP POST/PUT request is statistically anomalous for the specific host, user,
    or destination. Specifically: Create a rule to alert when a single connection''s outbound bytes (`orig_bytes`
    in Zeek conn.log) is greater than 20 times the inbound bytes (`resp_bytes`) AND the total outbound
    bytes exceeds a static threshold (e.g., 50 MB)?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary uses an existing, legitimate
    external web service to exfiltrate stolen data instead of their primary C2 channel, because hosts
    are already communicating with these popular, TLS-encrypted services and firewall rules already permit
