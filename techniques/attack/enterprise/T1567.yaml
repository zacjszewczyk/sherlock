- question: '[Exfiltration] Using the Symbolic Logic approach, can you determine whether an outbound HTTP/S
    request is observed with a User-Agent string or URI pattern associated with non-interactive data transfer
    tools (e.g., curl, wget, python-requests), and this network activity is correlated to a script or
    command-line process on the source host. Specifically: Apply regular expressions to the `user_agent`
    field in Zeek http.log to detect non-browser tools (e.g., `^curl/`, `^Wget/`, `^python-requests`)?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary uses an existing, legitimate
    external web service to exfiltrate stolen data instead of their primary C2 channel, because hosts
    are already communicating with these popular, TLS-encrypted services and firewall rules already permit
    them -- giving the exfiltration significant cover. This evidence focuses on the condition that an
    outbound HTTP/S request is observed with a User-Agent string or URI pattern associated with non-interactive
    data transfer tools (e.g., curl, wget, python-requests), and this network activity is correlated to
    a script or command-line process on the source host. This Symbolic Logic approach works as follows:
    Apply regular expressions to the `user_agent` field in Zeek http.log to detect non-browser tools (e.g.,
    `^curl/`, `^Wget/`, `^python-requests`, `^Go-http-client`, `^PowerShell`) using community signatures
    [SigmaHQ Generic Signature Format for SIEM Systems](https://github.com/SigmaHQ/sigma). Upon a match,
    pivot to host logs by correlating source IP and timestamp with Windows Event ID 4688 to identify the
    responsible process; alert if the parent process is non-interactive (e.g., `cmd.exe`, `powershell.exe`).
    Because User-Agent is invisible inside HTTPS, additionally flag TLS uploads whose JA3 client fingerprint
    maps to a scripting/runtime stack rather than an approved browser [Salesforce JA3 TLS Fingerprinting](https://github.com/salesforce/ja3).
    A positive result -- a rule match, statistical outlier, or model alert -- is consistent with data
    leaving the environment over a sanctioned web service; pivot to the responsible host and process lineage,
    the user and device context, the destination service and its reputation, the volume, direction, cadence,
    and entropy of the transfer, and what sensitive data was staged or accessed beforehand. A negative
    result helps rule out this particular exfiltration vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, low-and-slow, or TLS-encrypted
    exfiltration.'
