name: 'T1567: Exfiltration Over Web Service'
id: bb9f63e6-c14f-4c6a-b7ed-216193fb4e12
description: 'This playbook helps an analyst investigate whether an adversary has exfiltrated data over
  a legitimate external web service (e.g., Dropbox, Google Drive, OneDrive, Box, paste sites, or Cloudflare
  Workers) rather than a dedicated command-and-control channel, abusing the cover that trusted, already-permitted,
  SSL/TLS-encrypted destinations provide. It spans Exfiltration (TA0010) across Windows, Linux, macOS,
  ESXi, Office Suite, and SaaS telemetry, guiding the hunt across several complementary angles: outbound
  connections to destinations matching threat-intelligence feeds or personal cloud-storage/paste domains;
  non-browser HTTP clients and scripting User-Agents (curl, wget, python-requests, PowerShell) correlated
  to the responsible host process; highly asymmetric flows where outbound bytes greatly exceed inbound
  and large HTTP POST/PUT uploads; non-allowlisted or unsigned processes initiating port 80/443 egress;
  machine-like periodic beaconing to single destinations and off-hours bursts; high-entropy (compressed/encrypted)
  payloads and archive uploads to uncategorized destinations; and account-driven bulk file upload/download/copy
  activity against sanctioned SaaS and Office Suite tenants that exceeds a user''s behavioral baseline
  or originates from anomalous locations. Detection methods combine symbolic-logic rules, statistical
  baselining/change-point/prevalence analysis, and machine-learning models (DGA scoring, time-series forecasting,
  clustering, classification, LSTM/CT-HMM beaconing detection) applied to Zeek conn/http/ssl/dns/files
  logs, Windows Event IDs 4688 and 5156, auditd, macOS unified logs, ESXi logs, and M365/Box/Google Workspace
  unified audit logs, so the analyst can corroborate suspected web-service exfiltration against destination
  reputation, host process lineage, transfer volume and asymmetry, payload entropy, connection cadence,
  and cloud account behavior.'
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
