    when a single connection''s outbound bytes (`orig_bytes` in Zeek conn.log) is greater than 20 times
    the inbound bytes (`resp_bytes`) AND the total outbound bytes exceeds a static threshold (e.g., 50
    MB). This rule (Volume + ratio) targets highly asymmetric flows. Layer a compressibility check on
    captured POST bodies/uploaded files: payloads that gzip-compress poorly (<~10% size reduction) are
    already encrypted/compressed and consistent with staged exfiltration [Practical Comprehensive Bounds
    on Surreptitious Communication over DNS, Born Gustafson Paxson](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf).
