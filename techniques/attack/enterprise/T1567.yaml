questions:
- question: '[Exfiltration] Using the Symbolic Logic approach, can you determine whether an outbound network
    connection''s destination IP address, FQDN, or URL is present on a threat intelligence feed of known
    malicious indicators related to data exfiltration. Specifically: Continuously correlate destination
    IPs from Zeek conn.log (`id.resp_h`), requested domains from Zeek dns.log (`query`), and host headers/SNI
    from Zeek http.log (`host`) and ssl.log (`server_name`) against a cyber threat intelligence feed?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary uses an existing, legitimate
    external web service to exfiltrate stolen data instead of their primary C2 channel, because hosts
    are already communicating with these popular, TLS-encrypted services and firewall rules already permit
    them -- giving the exfiltration significant cover. This evidence focuses on the condition that an
    outbound network connection''s destination IP address, FQDN, or URL is present on a threat intelligence
    feed of known malicious indicators related to data exfiltration. This Symbolic Logic approach works
    as follows: Continuously correlate destination IPs from Zeek conn.log (`id.resp_h`), requested domains
    from Zeek dns.log (`query`), and host headers/SNI from Zeek http.log (`host`) and ssl.log (`server_name`)
    against a cyber threat intelligence feed. Generate a high-priority alert for any match. Layer deterministic
    allow/deny rules for personal cloud-storage and paste domains (e.g., dropbox.com, drive.google.com,
    pastebin.com, *.workers.dev, mega.nz) maintained as Sigma-style lists [SigmaHQ Generic Signature Format
    for SIEM Systems](https://github.com/SigmaHQ/sigma), and flag TLS sessions to these destinations whose
    JA3 client fingerprint is NOT an approved browser stack [Salesforce JA3 TLS Fingerprinting](https://github.com/salesforce/ja3).
    A positive result -- a rule match, statistical outlier, or model alert -- is consistent with data
    leaving the environment over a sanctioned web service; pivot to the responsible host and process lineage,
    the user and device context, the destination service and its reputation, the volume, direction, cadence,
    and entropy of the transfer, and what sensitive data was staged or accessed beforehand. A negative
    result helps rule out this particular exfiltration vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, low-and-slow, or TLS-encrypted
    exfiltration.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Internet Gateway Firewalls, DNS Resolvers, Web Proxies, Network Security Monitoring Sensors'
  range: Last 90 days
