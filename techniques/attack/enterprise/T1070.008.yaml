questions:
- question: Did any process, PowerShell script block, or Exchange/M365 audit entry exactly match a known
    signature for mailbox-clearing tooling, mailbox export cleanup, or transport-rule manipulation?
  context: 'Tied to the Stealth tactic, an adversary clears mailbox data to remove forensic traces of
    phishing, collection, or exfiltration. Matching command-line (Event ID 4688), script-block text/hash
    (Event ID 4104), and Exchange Management log entries against a maintained signature list (floor signature:
    Remove-MailboxExportRequest with -Identity and -Confirm "False") yields a high-confidence alert on
    exact match. Validate against the legitimate RBAC/parameter baseline; a positive match on a mail server
    or by an admin is strong evidence of anti-forensic activity. (Method: Symbolic Logic.) Source guidance:
    Match the command-line field in Windows Event ID 4688, the script block text/hash in PowerShell Event
    ID 4104, and Exchange Management log entries against a maintained list of exact signatures for mailbox-clearing
    tooling. Floor signature: `Remove-MailboxExportRequest` with `-Identity` and `-Confirm "False"` per
    [Sigma: Remove Exported Mailbox from Exchange Webserver](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/msexchange/win_exchange_proxyshell_remove_mailbox_export.yml);
    validate the legitimate parameter/RBAC baseline using [Remove-MailboxExportRequest (Microsoft Learn)](https://learn.microsoft.com/en-us/powershell/module/exchange/remove-mailboxexportrequest?view=exchange-ps)
    and the real-world Dark Halo tradecraft in [Volexity: Dark Halo SolarWinds](https://www.volexity.com/blog/2020/12/14/dark-halo-leverages-solarwinds-compromise-to-breach-organizations/).
    Trigger a high-confidence alert on exact match.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Microsoft 365 Unified Audit Log
  - Exchange Admin Audit Log
  - 'NAI: Microsoft Exchange Servers, Mail Gateway Servers, Administrator Workstations, Microsoft 365
    / Exchange Online tenancy'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source IN (WinEventLog:Security EventCode=4688, WinEventLog:PowerShell EventCode=4104,\n\
      \  m365:exchange, ExchangeAdminAuditLog)\n  | eval sig = coalesce(CommandLine, ScriptBlockText,\
      \ CmdletName)\n  | where match(sig, \"(?i)Remove-MailboxExportRequest.*-Identity.*-Confirm\\\\s+\\\
      \"?False\\\"?\")\n  OR sha256(ScriptBlockText) IN (known_malicious_hashes)\n  | stats values(sig)\
      \ by host, user, _time\n  | alert severity=high"
- question: Are there mailbox-clearing command-lines or script blocks whose SHA256 is rare across the
    fleet, or the first-ever use of a clearing cmdlet by a given principal?
  context: 'Rarity is a high-signal heuristic for malicious activity. Aggregate command-line/script-block
    executions by SHA256 over a 30-day rolling window, compute prevalence, and flag executions on mail
    servers or by admins whose hash is seen on fewer than a tuned number of hosts (e.g., <5), plus the
    first-seen of any clearing cmdlet per principal. Derive thresholds from your own fleet baseline; a
    rare or first-seen clearing execution warrants investigation. (Method: Statistical Method.) Source
    guidance: Aggregate all command-line/script-block executions by SHA256 across the enterprise over
    a 30-day rolling window and compute prevalence. Flag any execution on a mail server or by an admin
    whose hash prevalence is below a tuned threshold (e.g., seen on <5 hosts), and separately flag the
    first time a given principal ever runs a clearing cmdlet (first-seen). Rarity is a validated high-signal
    heuristic per [F-Secure: What''s the deal with prevalence?](https://blog.f-secure.com/whats-the-deal-with-prevalence/);
    the per-principal first-seen pattern follows the [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).
    Derive thresholds from your own 30-day fleet baseline.'
  answer_sources: *id001
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  index=endpoint earliest=-30d\n  | stats dc(host) AS host_prevalence, min(_time) AS first_seen\
      \ by sha256, user\n  | where (host_prevalence < 5 AND host_role==\"mail_server\")\n     OR first_seen\
      \ > relative_time(now(), \"-1d\")\n  | where match(CommandLine, \"(?i)(Remove-MailboxExportRequest|Search-Mailbox|Purge)\"\
      )\n  | alert"
- question: Do new command-line or PowerShell executions on mail servers score as outliers against a one-class
    SVM trained on benign administration?
  context: 'Train a one-class SVM on features from benign mail-server command-lines/PowerShell (command
    length, argument count, character entropy, cmdlet verb-noun tokens). Score new executions and alert
    on outliers, surfacing the top-3 contributing features for explainability. This catches novel or obfuscated
    clearing activity that does not match exact signatures while reducing analyst burden in confirming
    anti-forensic intent. (Method: Machine Learning.) Source guidance: Train a one-class Support Vector
    Machine on features from benign command-lines/PowerShell on mail servers (command length, argument
    count, character entropy, cmdlet verb-noun tokens). Score new executions and alert on outliers; surface
    the top-3 contributing features in alert text for explainability.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  model = OneClassSVM(nu=0.01).fit(benign_mailserver_cmd_features)\n  features = [cmd_length,\
      \ arg_count, char_entropy, verb_noun_tokens]\n  score = model.decision_function(new_exec_features)\n\
      \  if score < 0: alert(top3=feature_contributions(new_exec_features))"
- question: Are there obfuscated or rule-evasive Remove-MailboxExportRequest / Search-Mailbox invocations
    that bypass exact signatures but still resemble known malicious rules?
  context: 'Run an adaptive misuse-detection layer (AMIDES) in parallel with exact signatures to catch
    obfuscated clearing cmdlets while naming the most likely evaded rule. The named evaded rule and top
    weighted tokens provide the alert explanation. This closes the gap where attackers tweak syntax to
    dodge static signatures during Stealth-focused mailbox cleanup. (Method: Machine Learning.) Source
    guidance: Run an adaptive misuse-detection layer in parallel with the exact signatures to catch obfuscated/rule-evasive
    `Remove-MailboxExportRequest`/`Search-Mailbox` invocations while naming the most likely evaded rule,
    per [AMIDES, Uetz et al. (USENIX Security 2023)](https://www.usenix.org/system/files/sec23winter-prepub-112-uetz.pdf).
    The named evaded rule and top weighted tokens provide the explanation in the alert.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  amides = AMIDES(rule_set=exchange_clearing_sigma_rules)\n  pred = amides.score(ScriptBlockText)\n\
      \  if pred.misuse_prob > threshold:\n    alert(evaded_rule=pred.most_likely_rule, top_tokens=pred.weighted_tokens)"
- question: Do process command-lines, PowerShell logs, or the M365 Unified Audit Log contain mailbox clearing/concealment
    cmdlets, and were they run by unexpected or non-administrative accounts?
  context: 'Regex-search 4688 command-lines, 4104 script logs, and the M365 Unified Audit Log for clearing/concealment
    operations: Remove-MailboxExportRequest, Search-Mailbox -DeleteContent, New-ComplianceSearchAction
    -Purge, Set-InboxRule/New-InboxRule with DeleteMessage/MoveToFolder, Set-MailboxAuditBypassAssociation,
    and Set-TransportRule/New-TransportRule. Prioritize matches from non-administrative or unexpected
    accounts, attributable to who normally administers the platform. These map to production Sigma/Elastic
    detections and indicate active evidence removal. (Method: Symbolic Logic.) Source guidance: Regex-search
    process command-lines (4688), PowerShell script logs (4104), and the M365 Unified Audit Log for clearing/concealment
    operations: `Remove-MailboxExportRequest`, `Search-Mailbox -DeleteContent`, `New-ComplianceSearchAction
    -Purge`, `Set-InboxRule`/`New-InboxRule` with DeleteMessage/MoveToFolder, `Set-MailboxAuditBypassAssociation`,
    and `Set-TransportRule`/`New-TransportRule`. Anchor on production logic: [Sigma: PST Export via eDiscovery](https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/m365/threat_management/microsoft365_pst_export_alert.yml),
    [Elastic: Mailbox Audit Bypass](https://github.com/elastic/detection-rules/blob/main/rules/integrations/o365/defense_evasion_exchange_mailbox_audit_bypass_association.toml),
    [Elastic: Inbox Rule Delete or Move](https://github.com/elastic/detection-rules/blob/main/rules/integrations/o365/defense_evasion_exchange_new_inbox_rule_delete_or_move.toml),
    [Elastic: MFA Email Deleted](https://github.com/elastic/detection-rules/blob/main/rules/integrations/o365/defense_evasion_mfa_notification_email_deleted.toml),
    and [Elastic: Transport Rule Modification](https://github.com/elastic/detection-rules/blob/main/rules/integrations/o365/exfiltration_exchange_transport_rule_modification.toml).
    Prioritize matches from non-administrative or unexpected accounts.'
  answer_sources: &id002
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Microsoft 365 Unified Audit Log
  - Exchange Admin Audit Log
  - 'NAI: Microsoft Exchange Servers, Microsoft 365 / Exchange Online tenancy, Domain Controllers (for
    PowerShell remoting logs), Administrator Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source IN (WinEventLog:Security EventCode=4688, WinEventLog:PowerShell EventCode=4104, m365:UnifiedAuditLog)\n\
      \  | eval c = coalesce(CommandLine, ScriptBlockText, Operation)\n  | where match(c, \"(?i)(Remove-MailboxExportRequest|Search-Mailbox\\\
      \\s+-DeleteContent|New-ComplianceSearchAction\\\\s+-Purge|(New|Set)-InboxRule.*(DeleteMessage|MoveToFolder)|Set-MailboxAuditBypassAssociation|(New|Set)-TransportRule)\"\
      )\n  | where NOT user IN (approved_exchange_admins)\n  | alert severity=high"
- question: Has a user exceeded their baseline frequency of deletion/concealment Exchange cmdlets, used
    a clearing cmdlet for the first time, or shown a drop in cmdlet-name entropy indicating scripted bursts?
  context: 'For each user, baseline daily frequency/variety of Exchange management cmdlets; compute the
    per-user 95th percentile for deletion/concealment cmdlet counts and alert via k-sigma anomaly detection
    when exceeded. Flag a principal''s first-ever clearing cmdlet, track the failure/state dimension (failed
    export removals, audit-bypass success), and watch for a sudden drop in session cmdlet-name entropy
    signaling repetitive scripted activity. These deviations distinguish anti-forensic cleanup from routine
    administration. (Method: Statistical Method.) Source guidance: For each user establish a baseline
    of daily frequency/variety of Exchange management cmdlets; compute the per-user 95th percentile for
    deletion/concealment cmdlet counts and alert when exceeded, applying k-sigma anomaly detection over
    aggregated event counts per [Dwyer & Truta (CollaborateCom 2013)](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
    Also flag a principal''s first-ever use of a clearing cmdlet ([Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly))
    and explicitly track the failure/state dimension (failed export removals, audit-bypass outcome=success).
    Monitor cmdlet-name entropy within a session; a sudden drop indicates repetitive scripted activity.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  index=exchange_mgmt earliest=-30d\n  | bin _time span=1d | stats count AS daily by user,\
      \ cmdlet, _time\n  | eventstats p95(daily) AS p95, mean(daily) AS mu, stdev(daily) AS sd by user,\
      \ cmdlet\n  | where is_clearing_cmdlet(cmdlet) AND (daily > p95 OR daily > mu+3*sd OR first_seen(user,cmdlet))\n\
      \  | append [ search session entropy(cmdlet_names) AS ent by session | where ent < low_thresh ]\n\
      \  | alert"
- question: Do Exchange admin cmdlet sequences fall outside the expected next-key predictions of an LSTM
    trained on normal admin sessions?
  context: 'Train an LSTM language model on log-key sequences from normal admin sessions and flag executions
    outside the top-g predicted next keys (DeepLog). A low-probability sequence, such as New-MailboxExportRequest
    immediately followed by Remove-MailboxExportRequest, or a delete preceded by Set-MailboxAuditBypassAssociation,
    triggers an alert; report predicted-vs-observed keys as the top-3 explanation. This catches the order-of-operations
    signature of an adversary creating then erasing evidence. (Method: Machine Learning.) Source guidance:
    Train an LSTM language model on log-key sequences from normal admin sessions and flag executions falling
    outside the top-g predicted next keys, as in [DeepLog, Du et al. (CCS 2017)](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)
    and [Malware detection on Windows audit logs using LSTMs](https://www.sciencedirect.com/science/article/abs/pii/S0167404821002133).
    A low-probability sequence (e.g., `New-MailboxExportRequest` immediately followed by `Remove-MailboxExportRequest`,
    or a delete preceded by `Set-MailboxAuditBypassAssociation`) triggers an alert; report the predicted-vs-observed
    keys as the top-3 explanation.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  model = LSTM_logkey.train(normal_admin_sequences)\n  for session in sessions:\n    for i,key\
      \ in enumerate(session.keys):\n      if key NOT IN model.topg(session.keys[:i]):\n        alert(predicted=model.topg(...),\
      \ observed=key, session=session)"
- question: Were mail server databases, transaction logs, user PST/OST archives, or Exchange cmdlet history
    logs deleted at the filesystem layer by a non-standard process?
  context: 'Enable file-system auditing and alert on Event ID 4663 (Accesses contains DELETE) or Sysmon
    Event ID 23 (FileDelete) where the target path matches mail data (...\Mailbox\*.edb, transaction *.log/*.jrs,
    ...\Users\*\*.pst, *.ost) or Exchange cmdlet history under \Logging\CmdletInfra\LocalPowerShell\Cmdlet\.
    Escalate if the initiating process is not a standard mail client or backup service (not outlook.exe/veeam.exe).
    Filesystem-layer deletion shows evidence was removed below the application interface. (Method: Symbolic
    Logic.) Source guidance: Enable file-system auditing and alert on Windows Event ID 4663 (Accesses
    contains DELETE) or Sysmon Event ID 23 (FileDelete) where the target path matches mail data (`...\Mailbox\*.edb`,
    transaction `*.log`/`*.jrs`, `...\Users\*\*.pst`, `*.ost`) or Exchange cmdlet history logs under `\Logging\CmdletInfra\LocalPowerShell\Cmdlet\`
    per [Sigma: Exchange PowerShell Cmdlet History Deleted](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_delete/file_delete_win_delete_exchange_powershell_logs.yml).
    Escalate if the initiating process is not a standard mail client or backup service (e.g., not `outlook.exe`/`veeam.exe`).'
  answer_sources: &id003
  - Windows Event ID 4663
  - Sysmon Event ID 23
  - 'NAI: Microsoft Exchange Server database and log directories, User profile directories containing
    PST/OST files on endpoints and file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source IN (WinEventLog:Security EventCode=4663, WinEventLog:Sysmon EventCode=23)\n  | where\
      \ (Accesses LIKE \"%DELETE%\" OR EventCode==23)\n  | where match(TargetFilename, \"(?i)(\\\\\\\\\
      Mailbox\\\\\\\\.*\\\\.edb|\\\\.jrs|\\\\\\\\Users\\\\\\\\.*\\\\.pst|\\\\.ost|\\\\\\\\Logging\\\\\\\
      \\CmdletInfra\\\\\\\\LocalPowerShell\\\\\\\\Cmdlet\\\\\\\\)\")\n  | where ProcessName NOT IN (\"\
      outlook.exe\",\"veeam.exe\",approved_backup)\n  | alert severity=high"
- question: Is a non-standard process deleting files in monitored mail directories at a rate far above
    its historical baseline or with unusual fleet-wide rarity?
  context: 'For monitored mail directories, aggregate hourly deletions by initiating process; compute
    a 30-day mean and standard deviation per process and alert when a non-standard process (powershell.exe,
    cmd.exe, rundll32.exe) exceeds three standard deviations above its mean (k-sigma). Also score the
    rarity/prevalence of the deleting process fleet-wide. An unusual process deleting mail stores in volume
    is a strong anti-forensic indicator. (Method: Statistical Method.) Source guidance: For monitored
    mail directories aggregate hourly deletions by initiating process; compute a 30-day mean and standard
    deviation per process and alert when a non-standard process (`powershell.exe`, `cmd.exe`, `rundll32.exe`)
    exceeds three standard deviations above its historical mean, following [Dwyer & Truta k-sigma anomaly
    detection](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf). Also score the rarity/prevalence
    of the deleting process fleet-wide ([F-Secure prevalence](https://blog.f-secure.com/whats-the-deal-with-prevalence/)).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  index=filemon path IN (mail_dirs) earliest=-30d\n  | bin _time span=1h | stats count AS\
      \ del by process, _time\n  | eventstats mean(del) AS mu, stdev(del) AS sd by process\n  | join process\
      \ [ search prevalence_by_process ]\n  | where process IN (\"powershell.exe\",\"cmd.exe\",\"rundll32.exe\"\
      ) AND (del > mu+3*sd OR host_prevalence<5)\n  | alert"
- question: Do deletion events form anomalous clusters, such as off-hours deletions of mail data by an
    unusual process?
  context: 'Apply DBSCAN to deletion events using features (process, parent process, user, file extension,
    hour-of-day) to isolate anomalous clusters such as off-hours deletions by an unusual process; list
    the distinguishing features in the alert. Clustering surfaces coordinated cleanup that individual
    thresholds may miss and helps separate batch maintenance from targeted evidence removal. (Method:
    Machine Learning.) Source guidance: Apply DBSCAN to deletion events using features (process, parent
    process, user, file extension, hour-of-day) to isolate anomalous clusters such as off-hours deletions
    by an unusual process; list the distinguishing features in the alert.'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  X = features(deletion_events, [process, parent_process, user, file_ext, hour_of_day])\n\
      \  labels = DBSCAN(eps, min_samples).fit_predict(X)\n  for e in deletion_events where labels[e]==-1:\n\
      \    alert(distinguishing_features=explain(e))"
- question: Do whole-system provenance graphs contain anomalous edges where a process deletes mail stores
    or Exchange logs?
  context: 'Build whole-system provenance graphs and score anomalous edges/nodes where a process deletes
    mail stores or Exchange logs using a GNN temporal autoencoder with explainable attack-graph reconstruction
    (KAIROS). The reconstructed subgraph (process -> file/service) is the explanation surfaced to the
    analyst, connecting the deletion to the broader process lineage that performed it. (Method: Machine
    Learning.) Source guidance: Build whole-system provenance graphs and score anomalous edges/nodes where
    a process deletes mail stores or Exchange logs, using the GNN temporal autoencoder and explainable
    attack-graph reconstruction of [KAIROS, Cheng et al. (IEEE S&P 2024)](https://tfjmp.org/publications/2024-sp.pdf).
    The reconstructed subgraph (process → file/service) is the explanation surfaced to the analyst.'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  G = build_provenance_graph(events)\n  scores = KAIROS_temporal_gnn.score_edges(G)\n  for\
      \ edge in scores where edge.anomaly > thr AND edge.action==\"delete\" AND edge.dst IN (mail_stores,\
      \ exchange_logs):\n    alert(subgraph=reconstruct(edge))"
- question: Did a single user or host generate a burst of more than a tuned count of mailbox/file deletion
    events within a short (e.g., 10-minute) window?
  context: 'Trigger when a single user or source host generates more than a fixed count (e.g., >50) of
    deletion-related events (Search-Mailbox -DeleteContent, Remove-InboxRule, New-ComplianceSearchAction
    -Purge, file deletes on *.pst) within a 10-minute window. Tune the count to your busiest legitimate
    admin/backup baseline. A rapid burst spanning application-level and filesystem-level cleanup signals
    deliberate mass evidence removal. (Method: Symbolic Logic.) Source guidance: Trigger when a single
    user or source host generates more than a fixed count (e.g., >50) of deletion-related events (`Search-Mailbox
    -DeleteContent`, `Remove-InboxRule`, `New-ComplianceSearchAction -Purge`, file deletes on `*.pst`)
    within a 10-minute window. Tune the count to your environment''s busiest legitimate admin/backup baseline.'
  answer_sources: &id004
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4104
  - Microsoft 365 Unified Audit Log
  - 'NAI: Microsoft Exchange Servers, User endpoints, Microsoft 365 / Exchange Online tenancy audit logs'
  range: Last 90 days (correlate within 10-minute windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source IN (WinEventLog:Security EventCode IN(4688,4663), WinEventLog:PowerShell EventCode=4104,\
      \ m365:UnifiedAuditLog)\n  | where is_deletion_event(event)\n  | bin _time span=10m | stats count\
      \ AS n by user, src_host, _time\n  | where n > 50\n  | alert severity=high"
- question: Has a user's mail-deletion count spiked above their personal 99th percentile or shown an abrupt
    change point, or have expected mailbox-audit events suddenly ceased?
  context: 'Profile each user''s hourly mail-deletion count over 30 days and alert above their personal
    99th percentile, applying change-point detection (CUSUM/PELT/BOCPD) to flag abrupt bursts, and consume
    the M365 unusual-volume-of-file-deletion signal. Treat a sudden cessation of expected mailbox-audit
    events as a distinct suppression signal. Both spikes and suppression indicate Stealth-driven manipulation
    of mailbox evidence. (Method: Statistical Method.) Source guidance: Profile each user''s hourly mail-deletion
    count over 30 days and alert above their personal 99th percentile, applying change-point detection
    (CUSUM/PELT/BOCPD) from [Aminikhanghahi & Cook, change-point survey (KAIS 2017)](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)
    to flag abrupt bursts, and consume the per-user volume anomaly from [M365 Unusual Volume of File Deletion](https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/m365/threat_management/microsoft365_unusual_volume_of_file_deletion.yml).
    Treat a sudden cessation of expected mailbox-audit events as a distinct suppression signal.'
  answer_sources: *id004
  range: Last 90 days (per-user 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  index=mail_audit earliest=-30d\n  | bin _time span=1h | stats count AS del by user, _time\n\
      \  | eventstats p99(del) AS p99 by user\n  | where del > p99 OR changepoint_CUSUM(del) == True\n\
      \  | append [ search expected_audit_events | where observed_count==0 ]\n  | alert"
- question: Does the org-wide mail-deletion stream show automated bursts deviating from learned business-hour
    seasonality, or gaps where expected audit keys are missing?
  context: 'Deploy a seasonal time-series anomaly detector (Seasonal-Hybrid ESD) on the org-wide per-minute
    mail-deletion stream to learn normal business-hour rhythm and flag automated bursts; complement with
    DeepLog gap detection for missing expected audit keys. Report expected vs. observed rate and contributing
    accounts/hosts as the top-3 explanation. Automated, off-rhythm bursts indicate scripted mass clearing.
    (Method: Machine Learning.) Source guidance: Deploy a seasonal time-series anomaly detector (e.g.,
    Seasonal-Hybrid ESD) on the org-wide per-minute mail-deletion stream to learn normal business-hour
    rhythm and flag automated bursts; complement with [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)
    gap detection for missing expected audit keys. Report the expected vs. observed rate and contributing
    accounts/hosts as the top-3 explanation.'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "  series = per_minute_count(mail_deletions, org_wide)\n  anomalies = SeasonalHybridESD(series,\
      \ period=\"1d\")\n  gaps = DeepLog.missing_keys(expected_audit_keys, observed)\n  for a in anomalies\
      \ + gaps:\n    alert(expected=a.expected, observed=a.observed, top3=a.contributors)"
- question: Did a confirmed mailbox-clearing alert occur within 30 minutes of another high-confidence
    alert (credential access, anomalous remote login, lateral movement, audit bypass) for the same user
    or host?
  context: 'A SIEM correlation rule fires when a confirmed mailbox-clearing alert is preceded or followed
    within 30 minutes by another high-confidence alert for the same user/host (e.g., lsass.exe memory
    access, successful remote login Event ID 4624 Logon Type 3/10 from an unusual IP, net use to a new
    server, or Set-MailboxAuditBypassAssociation). Temporal proximity to other intrusion steps shows the
    cleanup is part of a broader attack rather than routine housekeeping. (Method: Symbolic Logic.) Source
    guidance: SIEM correlation rule that fires when a confirmed mailbox-clearing alert is preceded or
    followed within 30 minutes by another high-confidence alert for the same user/host (e.g., lsass.exe
    memory access, successful remote login Event ID 4624 Logon Type 3/10 from an unusual IP, `net use`
    to a new server, or `Set-MailboxAuditBypassAssociation` per [Elastic: Mailbox Audit Bypass](https://github.com/elastic/detection-rules/blob/main/rules/integrations/o365/defense_evasion_exchange_mailbox_audit_bypass_association.toml)).'
  answer_sources: &id005
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4624
  - Windows Event ID 4104
