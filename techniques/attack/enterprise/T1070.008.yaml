name: 'T1070.008: Indicator Removal: Clear Mailbox Data'
id: f381e93c-c371-4fa8-b206-682c19929cbe
description: Investigate whether an adversary cleared, deleted, or manipulated mailbox data, mail application
  artifacts, or mail server logs to remove evidence of prior activity such as phishing, internal spearphishing,
  email collection, mail-based command and control, or email exfiltration. This playbook helps an analyst
  hunt for mailbox-clearing tooling and cmdlets (e.g., Remove-MailboxExportRequest, Search-Mailbox -DeleteContent,
  New-ComplianceSearchAction -Purge, inbox/transport rule manipulation, and mailbox audit bypass) across
  Windows, Exchange on-prem, Microsoft 365 / Exchange Online, Linux, and macOS. It covers signature matching,
  statistical baselining of cmdlet and deletion rates, filesystem-level deletion of mail stores (*.edb,
  *.log, *.jrs, *.pst, *.ost) and Exchange cmdlet history logs, bulk-deletion bursts, correlation of mailbox
  cleanup with other intrusion activity (credential access, anomalous logins, large transfers), and machine-learning
  approaches (one-class SVM, LSTM sequence modeling, DBSCAN clustering, provenance graph scoring, seasonal
  time-series, and transformer session scoring) to surface anti-forensic mailbox clearing.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
