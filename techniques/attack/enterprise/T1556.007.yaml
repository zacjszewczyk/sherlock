name: 'T1556.007: Modify Authentication Process: Hybrid Identity'
id: 5e3a00dd-f37f-403b-8a65-00aec72cf2d5
description: This playbook helps an analyst investigate adversary modification of cloud authentication
  processes tied to on-premises (hybrid) identities - MITRE ATT&CK T1556.007. It covers backdooring of
  AD FS (Microsoft.IdentityServer.Servicehost) and Pass-Through Authentication (AzureADConnectAuthenticationAgentService)
  via malicious or unsigned DLL loads, tampering with AD FS/PTA configuration files and registry keys,
  theft or export of AD FS token-signing/DKM key material (Golden SAML precursor), MFA-bypass token issuance,
  suspicious service/scheduled-task and child-process creation, credential dumping and memory reads of
  the identity processes, defense-evasion commands and log clearing, anomalous authentication metrics
  and outbound C2, and cloud-side abuse such as rogue PTA agent registration, federation-trust/domain-authentication
  changes, and new service-principal credentials in Entra ID, M365, AWS, or other IdPs. For each evidence
  type it provides deterministic (symbolic-logic), statistical-baseline, and machine-learning detection
  approaches across Windows, network (Zeek), and cloud/identity-provider telemetry so an analyst can answer
  whether an adversary is impairing defenses, maintaining persistence, or accessing credentials through
  manipulation of hybrid identities.
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
