  - Windows Event ID 4657
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - 'NAI: AD FS Servers, Azure AD Connect Servers (PTA)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(EventCode IN (4663,4657)) OR (index=sysmon EventCode IN (11,13))

      ObjectName IN ("*\\ADFS\\Microsoft.IdentityServer.Servicehost.exe.config","HKLM\\SOFTWARE\\Microsoft\\ADFederationServices*")

      | where NOT SubjectUserName IN admin_allowlist AND NOT in_maintenance_window(_time)

