- question: In support of the Defense Impairment question "Is the adversary maintaining persistence through
    manipulation of hybrid identities?", how can an analyst monitor critical configuration changes? Specifically,
    investigate the scenario where a write, file creation, or permission change occurs on a critical AD
    FS/PTA configuration file (e.g., Microsoft.IdentityServer.Servicehost.exe.config), executable, or
    associated registry key (e.g., HKLM\SOFTWARE\Microsoft\ADFederationServices) by an unauthorized user
    or process.
  context: 'Symbolic Logic: Apply SACLs to critical files (''%windir%\ADFS\Microsoft.IdentityServer.Servicehost.exe.config'')
    and registry keys (''HKLM\SOFTWARE\Microsoft\ADFederationServices''); alert on any write/modify (Event
    ID 4663/4657; Sysmon 11/13) not from an allowlisted admin or NT AUTHORITY\SYSTEM during an approved
    maintenance window. Editing the AD FS service-host config to load a malicious DLL is a documented
    persistence path ([Detecting Abuse of Authentication Mechanisms, NSA](https://media.defense.gov/2020/Dec/17/2002554125/-1/-1/0/AUTHENTICATION_MECHANISMS_CSA_U_OO_198854_20.PDF)).
    Under Defense Impairment, the adversary''s aim is to blind or mislead defenders by tampering with
