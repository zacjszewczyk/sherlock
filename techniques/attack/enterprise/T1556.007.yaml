- question: In support of the Defense Impairment question "Is the adversary maintaining persistence through
    manipulation of hybrid identities?", how can an analyst detect token-signing key access/export? Specifically,
    investigate the scenario where on an AD FS server, the token-signing certificate / Distributed Key
    Manager (DKM) key material is exported or read, or a new token-signing certificate is added — the
    precursor to Golden SAML token forgery.
  context: 'Symbolic Logic: Alert on (a) process access or directory reads of the AD FS DKM container
    in AD and the token-signing private key store, (b) PowerShell/cmdline containing ''Get-AdfsCertificate'',
    ''Export-PfxCertificate'', ''Update-AdfsCertificate'', or AADInternals cmdlets (''Export-AADIntADFSSigningCertificate''),
    and (c) AD FS events showing a new/extra token-signing certificate. Stolen signing keys allow forging
    SAML tokens for any user/claims, bypassing MFA ([Golden SAML, CyberArk](https://www.cyberark.com/resources/threat-research-blog/golden-saml-newly-discovered-attack-technique-forges-authentication-to-cloud-apps);
