questions:
- question: In support of the Defense Impairment question "Is the adversary maintaining persistence through
    manipulation of hybrid identities?", how can an analyst alert on malicious DLL hashes? Specifically,
    investigate the scenario where the file hash (SHA256, MD5) of a DLL loaded by the AD FS service process
    (Microsoft.IdentityServer.Servicehost.exe) or PTA service process (AzureADConnectAuthenticationAgentService.exe)
    matches a known-malicious hash associated with authentication backdoors like MagicWeb or PTASpy.
  context: 'Symbolic Logic: Query Sysmon Event ID 7 where ''Image'' is the AD FS or PTA service binary;
    extract the loaded module hash (''Hashes'' for ''ImageLoaded'') and compare against a threat-intel
    feed of known backdoor DLLs. Generate a critical alert on match. The PTA backdoor injects a rogue
    DLL (PTASpy) into AzureADConnectAuthenticationAgentService to accept any password and harvest cleartext
    credentials, and AD FS backdoors load a DLL that forges tokens, so module-load hashing of these two
    processes is the deterministic floor ([Unnoticed Sidekick, AADInternals](https://aadinternals.com/post/on-prem_admin/);
    [Detecting M365/Azure AD Backdoors, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/)).
    Under Defense Impairment, the adversary''s aim is to blind or mislead defenders by tampering with
    the hybrid-identity authentication pipeline (AD FS, PTA, Entra/cloud federation) and its logging;
    a positive finding here means the trustworthiness of authentication telemetry itself may be compromised,
    so corroborate across independent log sources and treat affected controls as untrusted until validated.
    Because this is deterministic symbolic logic, a match is high-confidence and warrants immediate triage;
    the absence of a match lowers but does not eliminate suspicion, so pair it with the statistical and
    machine-learning methods on the same evidence.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 7
  - 'NAI: AD FS Servers, Azure AD Connect Servers (PTA), SIEM Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=sysmon EventCode=7 Image IN ("*Microsoft.IdentityServer.Servicehost.exe","*AzureADConnectAuthenticationAgentService.exe")

      | lookup ti_backdoor_dll sha256 AS Hashes OUTPUT verdict

      | where verdict=="malicious"

      | alert severity=critical'
- question: In support of the Defense Impairment question "Is the adversary maintaining persistence through
    manipulation of hybrid identities?", how can an analyst flag rarely loaded DLLs? Specifically, investigate
    the scenario where the file hash (SHA256, MD5) of a DLL loaded by the AD FS service process (Microsoft.IdentityServer.Servicehost.exe)
    or PTA service process (AzureADConnectAuthenticationAgentService.exe) matches a known-malicious hash
    associated with authentication backdoors like MagicWeb or PTASpy.
  context: 'Statistical Method: Build a 30-day baseline of every DLL path/name loaded by the AD FS and
    PTA processes across the server fleet and its load frequency (count/day). Alert on any module never
    seen before or whose fleet-wide load frequency is in the bottom 1st percentile. Surface in the alert
    the top-3 contributors (module path, signer, first-seen timestamp). Rare module loads on these hardened
    single-purpose hosts are a strong signal because their legitimate module set is small and stable ([Experience
    Report: System Log Analysis, He et al.](https://jiemingzhu.github.io/pub/slhe_issre2016.pdf)). Under
    Defense Impairment, the adversary''s aim is to blind or mislead defenders by tampering with the hybrid-identity
    authentication pipeline (AD FS, PTA, Entra/cloud federation) and its logging; a positive finding here
    means the trustworthiness of authentication telemetry itself may be compromised, so corroborate across
    independent log sources and treat affected controls as untrusted until validated. Because this is
    a statistical baseline-and-deviation method, tune the threshold to your environment to balance false
    positives against missed detections; a deviation is an investigative lead rather than proof, so corroborate
    it with the deterministic rule and surrounding host/identity context.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 7
  - 'NAI: AD FS Servers, Azure AD Connect Servers (PTA), SIEM Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=sysmon EventCode=7 Image IN (adfs_pta_binaries) earliest=-30d

      | stats count AS loads dc(host) AS hosts min(_time) AS first_seen by ImageLoaded Signed

      | eventstats perc1(loads) AS p1

      | where loads<=p1 OR first_seen>relative_time(now(),"-30d")

      | table ImageLoaded Signed loads first_seen'
- question: In support of the Defense Impairment question "Is the adversary maintaining persistence through
    manipulation of hybrid identities?", how can an analyst classify DLLs with ML? Specifically, investigate
    the scenario where the file hash (SHA256, MD5) of a DLL loaded by the AD FS service process (Microsoft.IdentityServer.Servicehost.exe)
    or PTA service process (AzureADConnectAuthenticationAgentService.exe) matches a known-malicious hash
    associated with authentication backdoors like MagicWeb or PTASpy.
  context: 'Machine Learning: Train a supervised classifier (XGBoost/Random Forest) on labeled benign/malicious
    DLLs using features from Sysmon Event ID 7 (file entropy, ''Signed''/''SignatureStatus'', imphash,
    path depth/entropy). Score each new module loaded by AD FS/PTA and emit the top-3 SHAP feature contributions
    in the alert text for explainability. Validate/threshold on reproducible log corpora ([Loghub datasets,
    Zhu et al.](https://arxiv.org/pdf/2008.06448)). Under Defense Impairment, the adversary''s aim is
    to blind or mislead defenders by tampering with the hybrid-identity authentication pipeline (AD FS,
    PTA, Entra/cloud federation) and its logging; a positive finding here means the trustworthiness of
    authentication telemetry itself may be compromised, so corroborate across independent log sources
    and treat affected controls as untrusted until validated. Because this is a machine-learning method,
    use the surfaced feature attributions to explain and validate every alert; treat model scores as prioritization
    signals and confirm them against deterministic evidence before taking eviction or rotation action.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 7
  - 'NAI: AD FS Servers, Azure AD Connect Servers (PTA), SIEM Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'feat = extract(file_entropy, Signed, SignatureStatus, imphash, path_depth, path_entropy) from
      sysmon EID7 (adfs/pta)

      score = xgboost_model.predict_proba(feat)

      if score>=threshold: alert(top3=shap_values(feat))'
- question: In support of the Defense Impairment question "Is the adversary maintaining persistence through
    manipulation of hybrid identities?", how can an analyst alert on unsigned or odd paths? Specifically,
    investigate the scenario where the AD FS or PTA service process loads a DLL that is unsigned, has
    an invalid signature, or originates from a non-standard directory (e.g., C:\ProgramData\, C:\Perflogs\,
    C:\Users\Public\).
  context: 'Symbolic Logic: Monitor Sysmon Event ID 7 for the AD FS/PTA service processes and alert when
    ''Signed''==''false'', ''SignatureStatus'' != ''Valid'', or ''ImageLoaded'' is outside an allowlist
    (C:\Windows\System32\, C:\Windows\ADFS\, C:\Program Files\Microsoft Azure AD Connect Authentication
    Agent\). An unsigned/side-loaded module in these processes is the canonical hybrid-identity backdoor
    delivery method ([Unnoticed Sidekick, AADInternals](https://aadinternals.com/post/on-prem_admin/)).
    Under Defense Impairment, the adversary''s aim is to blind or mislead defenders by tampering with
    the hybrid-identity authentication pipeline (AD FS, PTA, Entra/cloud federation) and its logging;
    a positive finding here means the trustworthiness of authentication telemetry itself may be compromised,
    so corroborate across independent log sources and treat affected controls as untrusted until validated.
    Because this is deterministic symbolic logic, a match is high-confidence and warrants immediate triage;
    the absence of a match lowers but does not eliminate suspicion, so pair it with the statistical and
    machine-learning methods on the same evidence.'
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: AD FS Servers, Azure AD Connect Servers (PTA)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=sysmon EventCode=7 Image IN (adfs_pta_binaries)

      | where Signed=="false" OR SignatureStatus!="Valid" OR NOT cidrmatch_path(ImageLoaded, allowlist=["C:\\Windows\\System32\\","C:\\Windows\\ADFS\\","C:\\Program
      Files\\Microsoft Azure AD Connect Authentication Agent\\"])

      | alert'
- question: In support of the Defense Impairment question "Is the adversary maintaining persistence through
    manipulation of hybrid identities?", how can an analyst score path entropy anomalies? Specifically,
    investigate the scenario where the AD FS or PTA service process loads a DLL that is unsigned, has
    an invalid signature, or originates from a non-standard directory (e.g., C:\ProgramData\, C:\Perflogs\,
    C:\Users\Public\).
  context: 'Statistical Method: Compute Shannon entropy and length of each loaded module''s parent directory
    path; baseline normal values and alert on entropy in the top 98th percentile or path length beyond
    p99, indicating randomized/obfuscated drop locations. Report the offending path and its percentile
    rank in the alert. Baseline-and-deviation on path features is a standard statistical anomaly approach
    ([Experience Report: System Log Analysis, He et al.](https://jiemingzhu.github.io/pub/slhe_issre2016.pdf)).
    Under Defense Impairment, the adversary''s aim is to blind or mislead defenders by tampering with
    the hybrid-identity authentication pipeline (AD FS, PTA, Entra/cloud federation) and its logging;
    a positive finding here means the trustworthiness of authentication telemetry itself may be compromised,
    so corroborate across independent log sources and treat affected controls as untrusted until validated.
    Because this is a statistical baseline-and-deviation method, tune the threshold to your environment
    to balance false positives against missed detections; a deviation is an investigative lead rather
    than proof, so corroborate it with the deterministic rule and surrounding host/identity context.'
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: AD FS Servers, Azure AD Connect Servers (PTA)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=sysmon EventCode=7 Image IN (adfs_pta_binaries)

      | eval pdir=parent_dir(ImageLoaded), ent=shannon_entropy(pdir), plen=len(pdir)

      | eventstats perc98(ent) AS p98 perc99(plen) AS p99

      | where ent>=p98 OR plen>=p99

      | table ImageLoaded ent plen'
