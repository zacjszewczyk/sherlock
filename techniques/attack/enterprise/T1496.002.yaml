    rate (count of first-ever host-pair destinations per hour) as a fan-out signal, since proxy/scan traffic
    generates many novel source-destination edges [On Bayesian New Edge Prediction and Anomaly Detection](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf).
