name: 'T1496.002: Bandwidth Hijacking'
id: 3f668c8f-12c5-4ec6-bbeb-0ac69cc62620
description: 'This playbook helps an analyst investigate whether an adversary is hijacking the network
  bandwidth of co-opted systems for resource-intensive abuse — botnet participation, proxyjacking (selling
  victim bandwidth/IP to proxyware services), cryptomining pool traffic, internet-wide scanning, and Network
  Denial of Service flooding — under the Impact tactic. It guides the hunt across endpoint, network, and
  cloud telemetry spanning Windows, Linux, macOS, containers, and IaaS. Investigative angles include:
  outbound connections to threat-intel-listed proxyware, TOR, mining-pool, and botnet C2/scanner infrastructure;
  process executions matching proxyware/miner/botnet names, command-line arguments, or hashes (with masquerade-aware
  corroboration of name, hash, and parent lineage); anomalous DNS query volume, NXDOMAIN/failure spikes,
  and low-entropy repetitive queries to small C2/pool domain sets; outbound byte volumes exceeding host
  or peer-group baselines (including sustained low-variance proxyjacking egress); high-rate SYN-only (S0)
  and one-way packet floods consistent with DDoS participation; and destination/port fan-out consistent
  with scanning or P2P botnet communication. Each angle is pursued with three complementary detection
  methods — symbolic-logic rules, statistical baselining/sequential testing, and machine-learning models
  — applied to Zeek conn.log/dns.log, Windows Event IDs 4688/5156, auditd, NSM/NetFlow, macOS unified
  logs, container/Docker stats, and AWS CloudTrail/VPC Flow Logs, so the analyst can corroborate suspected
  bandwidth hijacking against process attribution, destination reputation, traffic volume, connection
  state, and fan-out.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
