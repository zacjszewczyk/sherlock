    focuses on the condition that an internal host exhibits unusual DNS query activity, such as an abnormally
    high volume of requests, requests for known malicious domains, or repetitive requests to a small set
    of non-standard domains, suggesting C2 or mining pool communication. This Statistical Method approach
    looks for the following signal: Per client, baseline DNS request volume and the NXDOMAIN/failed-resolution
    ratio over 5-minute windows. Failure-rate awareness: a spike in NXDOMAIN responses indicates DGA/botnet
    beaconing or proxy-rendezvous attempts, while a query-volume burst beyond the rolling-mean upper bound
    indicates automated C2/P2P activity. Also compute Shannon entropy of requested second-level domains
    per host; a sustained drop >2 standard deviations below baseline indicates repetitive querying of
    a small C2/pool domain set. SPRT-style sequential testing bounds false positives on the failure-ratio
    signal [Fast Portscan Detection Using Sequential Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf).
