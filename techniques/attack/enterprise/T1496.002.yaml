- question: '[Impact] Track per-host DNS query volume and NXDOMAIN/failure rate against baseline: Can
    you determine whether an internal host exhibits unusual DNS query activity, such as an abnormally
    high volume of requests, requests for known malicious domains, or repetitive requests to a small set
