- question: '[Impact] Profile each host''s share of outbound connections to low-reputation destinations
    against its own and peer-group baseline: Can you determine whether observed network connections from
    an internal host to an external IP address, domain, or URL that is present on a threat intelligence
    feed for known botnet C2s, proxyware services, TOR nodes, or malicious scanners. -- specifically,
    using the ''Profile each host''s share of outbound connections to low-reputation destinations against
