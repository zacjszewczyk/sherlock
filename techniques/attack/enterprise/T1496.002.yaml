    address, domain, or URL that is present on a threat intelligence feed for known botnet C2s, proxyware
    services, TOR nodes, or malicious scanners. This Statistical Method approach looks for the following
    signal: For each internal host, compute the percentage of outbound connections directed to lower-confidence/poor-reputation
