questions:
- question: '[Impact] Join Zeek conn.log destination IPs and dns.log domains against curated threat-intel
    for proxyware, TOR, botnet C2, and malicious scanners: Can you determine whether observed network
    connections from an internal host to an external IP address, domain, or URL that is present on a threat
    intelligence feed for known botnet C2s, proxyware services, TOR nodes, or malicious scanners. -- specifically,
    using the ''Join Zeek conn.log destination IPs and dns.log domains against curated threat-intel for
    proxyware, TOR, botnet C2, and malicious scanners'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary co-opts the network bandwidth
    of compromised hosts for botnet activity, proxyjacking, cryptomining, internet-wide scanning, or DDoS
    flooding, leaving traces in network-flow, DNS, process-execution, and cloud telemetry. This evidence
    focuses on the condition that observed network connections from an internal host to an external IP
    address, domain, or URL that is present on a threat intelligence feed for known botnet C2s, proxyware
    services, TOR nodes, or malicious scanners. This Symbolic Logic approach looks for the following signal:
    Continuously join destination IP addresses from Zeek conn.log and queried domains from dns.log against
    high-confidence, regularly updated feeds for public proxyware services (Honeygain, Pawns.app, IPRoyal,
    ProxyLite), TOR exit nodes, mining pools, and known botnet C2/scanning infrastructure; alert on any
    match. Seed the proxyware/mining-pool list with concrete IOCs from incident reporting (e.g., IPRoyal/ProxyLite
    binaries and pool endpoints such as 23.94.204.157:44445) [LABRAT: Stealthy Cryptojacking and Proxyjacking
    Campaign](https://sysdig.com/blog/labrat-cryptojacking-proxyjacking-campaign/). State signal: also
    flag repeated outbound connections to TOR/VPN/anonymizer infrastructure used to relay scan and exfil
    traffic [Leaked Environment Variables Allow Large-Scale Extortion](https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a host is consuming
    or relaying network bandwidth for adversary-controlled, non-business purposes; pivot to the responsible
    process and its parent lineage, the destination reputation and geolocation, the user/IAM context,
    the sustained traffic volume and connection-state distribution, and any related DNS or scanning fan-out.
    A negative result helps rule out this bandwidth-hijacking vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land
    abuse.'
