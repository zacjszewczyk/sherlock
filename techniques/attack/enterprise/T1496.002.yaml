    the sustained traffic volume and connection-state distribution, and any related DNS or scanning fan-out.
    A negative result helps rule out this bandwidth-hijacking vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land
    abuse.'
