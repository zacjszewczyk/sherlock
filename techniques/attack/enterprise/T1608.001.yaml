- question: When a package classifier trained on metadata and install-behavior features scores a retrieved
    package as malicious, what top features explain the verdict?
  context: 'Train a classifier on package metadata and behavioral features (name lexical similarity to
    popular packages, install-script presence, install-time network/file/process activity, maintainer
    and version age) using labeled malicious packages from the Backstabber''s Knife Collection and Datadog
    Malicious Software Packages Dataset. Flag high-probability packages and surface the top-3 contributing
    features in the alert. Explainability lets an analyst confirm whether the model fired on genuine supply-chain
    risk (e.g., postinstall network egress plus a near-duplicate name) before blocking the package or
    quarantining the developer/CI host. References: [Backstabber''s Knife Collection, Ohm et al](https://arxiv.org/abs/2005.09535)
    [Malicious Software Packages Dataset, Datadog Security Labs](https://securitylabs.datadoghq.com/articles/malicious-software-packages-dataset/)
