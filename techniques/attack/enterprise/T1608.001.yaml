name: 'T1608.001: Upload Malware'
id: 61b055e3-35d7-4925-8680-f67f34359623
description: 'This playbook helps an analyst investigate whether an internal system is downloading or
  executing a malicious payload that an adversary has staged on external infrastructure (MITRE ATT&CK
  T1608.001, Upload Malware). While uploading the malware happens outside the victim''s visibility, the
  downstream retrieval and execution is observable. It guides hunting across network egress telemetry
  and endpoint process telemetry to find: connections or file transfers to known malware-hosting/C2 indicators;
  downloads of high-risk file types from newly registered, non-sanctioned, or low-prevalence domains (including
  paste sites and IPFS gateways); downloads over weak or suspicious TLS sessions; downloaded executables
  that spawn processes and beacon outbound; and malicious or typosquatted software packages pulled through
  internal mirrors and registries. It combines symbolic-logic IOC and watchlist matching, statistical
  rarity, recency, entropy, and change-point analysis, and machine-learning classification, clustering,
  and beacon-cadence scoring.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any internal host make a network connection to, or transfer a file from, an external IP,
    domain, URL, or file hash that appears on a curated threat-intelligence feed of known malware-hosting
    or command-and-control infrastructure?
  context: 'Adversaries who upload malware (T1608.001) under Resource Development depend on the victim
    later retrieving it, so a match between enterprise egress telemetry and curated IOC feeds is one of
    the highest-confidence signals of payload retrieval from adversary-controlled infrastructure. Continuously
    evaluate Zeek conn.log, http.log, and dns.log plus downloaded-file hashes (files.log) against curated,
    deduplicated IOC feeds (malicious IPs, domains, URLs, hashes) expressed as SIEM-agnostic SigmaHQ rules.
    A positive match should fire a high-severity alert capturing source host, destination indicator, matched
    feed, and timestamp so the analyst can pivot to the host for follow-on execution; a clean result lowers
    but does not eliminate suspicion because feeds lag fresh infrastructure. References: [SigmaHQ](https://github.com/SigmaHQ/sigma)'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Internet gateways, network egress points, forward and reverse web proxies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each event IN (conn.log, http.log, dns.log, files.log)\n  IF event.dest_ip IN ioc_ips\
      \ OR event.host IN ioc_domains\n     OR event.uri IN ioc_urls OR event.sha256 IN ioc_hashes\n  THEN\
      \ ALERT severity=HIGH fields={src_host, indicator, matched_feed, ts}"
- question: For each externally contacted domain or destination that matched a threat-intelligence feed,
    how rare and how recently-first-seen is it across the enterprise, and is it contacted by only a small
    number of hosts?
  context: 'Not every IOC hit is equal: malicious staging domains are typically contacted by very few
    hosts and appear recently, whereas false positives often involve widely-used infrastructure. For every
    feed-matched destination, compute its historical prevalence (count of distinct internal hosts contacting
    it in the last 90 days) and its first-seen recency. Prioritize matches that are statistically rare
    (e.g., fewer than ~3 hosts) or short-lived/recently active, which EXPOSURE shows are strong malicious-domain
    signals. Derive the rarity threshold from the per-environment distribution of unique-host counts (bottom
    1 percent) rather than a fixed constant so the signal stays tuned to your network. References: [EXPOSURE,
    Bilge et al](https://sites.cs.ucsb.edu/~chris/research/doc/ndss11_exposure.pdf)'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Internet gateways, network egress points, forward and reverse web proxies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'matches = egress WHERE dest IN ioc_feed

      stats count(distinct src_host) AS hosts, min(ts) AS first_seen BY dest

      thr = percentile(hosts, 1)   // bottom 1%

      WHERE hosts <= max(3, thr) OR first_seen > now-7d

      ALERT rank BY (hosts asc, first_seen desc)'
- question: Are internal hosts generating bursts of failed retrievals (HTTP 404/410, DNS NXDOMAIN, or
    blocked proxy verdicts) toward rare external destinations, indicating attempts to fetch from taken-down
    or rotating staging infrastructure?
  context: 'Error and failure telemetry is a distinct, often-overlooked signal. Adversary staging infrastructure
    is frequently taken down or rotated, so retrieval attempts produce HTTP 404/410 on staging URLs, NXDOMAIN
    on contacted domains (Zeek dns.log rcode), and blocked/denied proxy verdicts. Count these per source
    host per hour; a burst of 404/NXDOMAIN to rare external hosts indicates retries against dead or rotating
    staging. Alert when failures to rare destinations exceed a host''s own 7-day baseline mean plus 3
    sigma, which adapts to each host''s normal error rate and reduces noise from ordinary broken links.
    References: [Malicious URL Detection Survey, Sahoo et al](https://arxiv.org/abs/1701.07179)'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Internet gateways, network egress points, forward and reverse web proxies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "fails = events WHERE http.status IN (404,410) OR dns.rcode=NXDOMAIN OR proxy.action=blocked\n\
      \          AND dest_prevalence(dest) IN bottom_1pct\nstats count AS f BY src_host, bin(ts,1h)\n\
      baseline = mean_7d(f) + 3*stddev_7d(f) BY src_host\nWHERE f > baseline THEN ALERT"
- question: When a pre-trained maliciousness classifier scores an enriched network connection above a
    high-confidence threshold, what are the top contributing features that explain why the connection
    looks like malware retrieval?
  context: 'Signature and rarity logic miss novel infrastructure, so apply a pre-trained gradient-boosted
    or random-forest classifier that predicts connection maliciousness from enriched Zeek conn.log/ssl.log
    features (ASN, geolocation, IP/domain reputation, WHOIS age, DNS TTL, lexical URL features, TLS certificate
    details) per the Sahoo et al feature taxonomy. Flag predictions above a high-confidence threshold
    (e.g., >0.90) and include the top-3 SHAP-ranked contributing features in the alert so analysts immediately
    understand why it fired and can validate against the staging hypothesis instead of treating the model
    as a black box. References: [Malicious URL Detection Survey, Sahoo et al](https://arxiv.org/abs/1701.07179)
    [SHAP Integration in IDS, Frontiers in AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Internet gateways, network egress points, forward and reverse web proxies.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feat = enrich(conn.log+ssl.log): {asn, geo, reputation, whois_age, dns_ttl, url_lexical, tls_cert}\n\
      score = model.predict_proba(feat)\nWHERE score > 0.90\n  ALERT severity=HIGH, top3 = shap_top_features(model,\
      \ feat, 3)"
- question: Did an internal host download a high-risk file type (.exe, .dll, .ps1, .vbs, application/x-msdownload,
    portable-executable MIME) from a non-sanctioned public file-sharing/paste/IPFS-gateway domain, or
    from any domain registered within the last 60 days?
  context: 'Adversaries stage payloads on web services, paste sites, and IPFS gateways, and frequently
    use newly registered domains (NRDs) for short-lived staging. Maintain watchlists of high-risk MIME
    types/extensions and non-sanctioned file-sharing/paste/IPFS-gateway domains as SigmaHQ rules, and
    alert when a file download (Zeek files.log) matches both a high-risk type and a watchlist domain.
    Separately, enrich Zeek dns.log with WHOIS creation dates and alert on any high-risk download from
    a domain younger than 60 days. Together these catch both known-bad hosting categories and the freshly-stood-up
    infrastructure characteristic of upload-malware operations. References: [SigmaHQ](https://github.com/SigmaHQ/sigma)
    [EXPOSURE, Bilge et al](https://sites.cs.ucsb.edu/~chris/research/doc/ndss11_exposure.pdf)'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: Internal DNS servers, network egress points, web proxies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'dl = files.log WHERE mime IN highrisk_mimes OR ext IN (.exe,.dll,.ps1,.vbs)

      IF dl.host IN watchlist_domains THEN ALERT

      ELSE IF whois_age(dl.host) < 60d THEN ALERT severity=HIGH'
- question: For high-risk downloads, how anomalous are the HTTP URI path and host string when scored with
    KL divergence against a natural-language baseline, indicating algorithmically generated or CDN-style
    staging links?
  context: 'Algorithmically generated staging URLs and DGA-style hostnames have character distributions
    that diverge from natural language. Score the HTTP URI path and host label of high-risk downloads
    using Kullback-Leibler divergence against a natural-language baseline, which Red Canary shows outperforms
    raw Shannon entropy for flagging algorithmically generated strings. Flag downloads whose KL/entropy
    score sits at or above the 98th percentile of the per-environment baseline; such high-divergence links
    are characteristic of CDN/algorithmically generated staging and warrant correlation with the file
    type and destination reputation. References: [Using Entropy in Threat Hunting, Red Canary](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/)'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: Internal DNS servers, network egress points, web proxies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR dl IN highrisk_downloads\n  s = KL_divergence(chars(dl.uri_path + dl.host), natural_language_model)\n\
      thr = percentile(all_scores, 98)\nWHERE s >= thr THEN ALERT"
- question: Does a sudden change-point spike in per-domain DNS query volume or per-destination download
    counts coincide with high-risk file downloads, signaling newly activated staging infrastructure?
  context: 'Newly activated staging infrastructure shows up as an abrupt jump in traffic to a previously
    quiet domain. Apply change-point detection (CUSUM/PELT) or SARIMA-residual analysis to daily query
    volume per requested domain (Zeek dns.log) and to download counts per destination, excluding known
    high-traffic domains to avoid noise. When an anomalous spike (a change point exceeding ~3x the prior
    segment mean) coincides in the same window with high-risk file downloads (files.log), generate an
    alert: the joint condition is a strong signature of an adversary turning on staging infrastructure
    and victims beginning to retrieve from it. References: [A Survey of Methods for Time Series Change
    Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: Internal DNS servers, network egress points, web proxies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "series = daily_count(dns.log) BY domain  // and downloads BY dest\ncp = changepoint_PELT(series)\
      \ EXCLUDING top_traffic_domains\nIF cp.segment_mean > 3 * prior_segment_mean\n   AND highrisk_download(domain)\
      \ IN cp.window THEN ALERT"
- question: When a URL/domain classifier trained on lexical and host-based features scores a high-risk
    download's domain as malicious, what top features explain the score?
  context: 'Train a supervised classifier on lexical features (length, token counts, n-grams, entropy)
    and host-based features (WHOIS age, ASN, geo, DNS TTL, IP reputation) to score the maliciousness of
    a download URL/domain, per Sahoo et al; EXPOSURE''s 15-feature DNS-only decision tree is a sound first-party
    baseline. Flag high-risk-file downloads from high-scoring domains and list the top-3 contributing
    features in the alert so analysts can confirm whether the model fired on genuine staging indicators
    (e.g., very young domain, suspicious ASN, high-entropy host) rather than benign anomalies. References:
    [Malicious URL Detection Survey, Sahoo et al](https://arxiv.org/abs/1701.07179) [EXPOSURE, Bilge et
    al](https://sites.cs.ucsb.edu/~chris/research/doc/ndss11_exposure.pdf) [SHAP Integration in IDS, Frontiers
    in AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: Internal DNS servers, network egress points, web proxies.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feat = {url_lexical, whois_age, asn, geo, dns_ttl, ip_reputation}\nscore = url_model.predict_proba(feat)\n\
      WHERE highrisk_download AND score > threshold\n  ALERT top3 = shap_top_features(url_model, feat,\
      \ 3)"
- question: Did an internal host download a high-risk file over a TLS session using a self-signed certificate,
    a short-lived certificate (validity < 90 days), a certificate from a non-trusted CA, or a known-bad
    TLS client fingerprint (JA3/JA4+)?
  context: 'Malware staging servers frequently use self-signed, short-lived, or non-standard-CA certificates,
    and downloader/implant TLS stacks produce recognizable client fingerprints. Join file download events
    (Zeek files.log fuid) with TLS session logs (ssl.log uid) and alert when a high-risk file type is
    downloaded and validation_status is ''self-signed certificate'', certificate validity is under 90
    days, or the issuer is absent from your trusted-CA allow-list. Additionally deny-list known downloader/implant
    TLS stacks via JA3 and version-resilient JA4+ fingerprints emitted in ssl.log. A match strongly suggests
    retrieval from purpose-built or compromised staging rather than legitimate CDN distribution. References:
    [Zeek SSL/TLS Analyzer ssl.log](https://docs.zeek.org/en/master/scripts/base/protocols/ssl/main.zeek.html)
    [JA3](https://github.com/salesforce/ja3) [JA4+](https://github.com/FoxIO-LLC/ja4)'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Network egress points, certificate transparency logs, external threat intelligence platforms.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "join files.log(fuid) WITH ssl.log(uid) ON conn uid\nWHERE file.mime IN highrisk_mimes AND\
      \ (\n   ssl.validation_status='self-signed certificate'\n   OR cert.validity_days < 90\n   OR ssl.issuer\
      \ NOT IN trusted_ca_allowlist\n   OR ssl.ja3 IN bad_ja3 OR ssl.ja4 IN bad_ja4)\nTHEN ALERT"
- question: What is the weighted composite risk score of each high-risk file download (combining self-signed
    cert, low IP reputation, anomalous User-Agent, short cert validity, and rare destination), and which
    downloads exceed the 99th-percentile threshold?
  context: 'Single indicators are noisy, but a weighted combination separates staging retrieval from benign
    downloads. Compute a composite download-risk score: +3 self-signed cert, +2 IP on a low-reputation
    list, +1 anomalous HTTP User-Agent, +2 certificate validity under 90 days, +2 rare destination (bottom
    1 percent enterprise prevalence). Flag any event whose total exceeds the 99th percentile of all download
    scores over a rolling 24-hour window, and tune weights and threshold to the per-environment score
    distribution. Track TLS validation-failure rate per destination as a distinct corroborating signal
    so persistently failing destinations rise to attention. References: [EXPOSURE, Bilge et al](https://sites.cs.ucsb.edu/~chris/research/doc/ndss11_exposure.pdf)'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Network egress points, certificate transparency logs, external threat intelligence platforms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "score = 3*self_signed + 2*low_rep_ip + 1*anomalous_ua\n        + 2*(cert_validity<90d) + 2*rare_dest_bottom1pct\n\
      thr = percentile(score over rolling_24h, 99)\nWHERE score > thr THEN ALERT; track tls_fail_rate\
      \ BY dest"
- question: Do unsupervised clustering and graph modeling of download events reveal small, dense clusters
    or shared-infrastructure fan-out patterns that represent novel staging not matched by signatures?
  context: 'Novel staging that evades IOC and rule logic still clusters by behavior and shares infrastructure
    across victims. Apply DBSCAN over download-event features (MIME type, TLS issuer/subject, destination
    ASN/country, JA3/JA4) and investigate small dense clusters separated from the benign mass as candidate
    novel staging patterns. Complement this with a graph neural network over session graphs to capture
    shared-infrastructure and fan-out structure linking multiple internal hosts to the same staging server.
    Surface the top-3 contributing features per flagged cluster or connection so analysts can triage whether
    a cluster reflects a single staging campaign touching several hosts. References: [GNN-MTC: Graph Neural
    Networks for Malware Traffic Classification](https://onlinelibrary.wiley.com/doi/10.1111/1556-4029.70189)
    [SHAP Integration in IDS, Frontiers in AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Network egress points, certificate transparency logs, external threat intelligence platforms.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'feat = {mime, tls_issuer, tls_subject, dest_asn, dest_country, ja3, ja4}

      clusters = DBSCAN(feat)

      INVESTIGATE small dense clusters far from benign mass

      graph = GNN(session_graph hosts->staging_servers)

      ALERT fan-out/shared-infra; top3 = shap_top_features(...)'
- question: Was a process created on an endpoint whose executable matches a file recently downloaded from
    an external source, and did that new process then initiate outbound connections to an external IP
    within a short time window?
  context: 'The clearest sign that staged malware was successfully retrieved and run is a freshly downloaded
    file becoming a running process that immediately talks to the internet. Correlate file downloads (Zeek
    files.log) with process creation (Windows Event ID 4688, Sysmon Event ID 1) by joining on host IP
    and filename within a 10-minute window; on a match, join network connection logs (Sysmon Event ID
    3, Zeek conn.log) on Process ID/GUID and alert if the new process initiates any external connection.
    Use maintained download-cradle and suspicious-process signatures from SigmaHQ. This download-execute-callout
    chain is high-confidence evidence of Ingress Tool Transfer following T1608.001 staging. References:
    [SigmaHQ](https://github.com/SigmaHQ/sigma)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Endpoint devices (workstations, servers), domain controllers, network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'dl = files.log; proc = (4688 OR sysmon1)

      JOIN dl,proc ON host_ip AND filename WITHIN 10m

      JOIN net=(sysmon3 OR conn.log) ON pid/guid

      WHERE net.dest is external THEN ALERT severity=HIGH'
- question: Does the name of the downloaded executable or new process closely resemble (edit distance
    1-2) a common Windows system process name, indicating masquerading?
  context: 'Adversaries disguise staged payloads by naming them to look like trusted system binaries (e.g.,
    svch0st.exe, lsasss.exe). Compute Levenshtein/Damerau edit distance between each new process or downloaded
    file name and a reference list of common Windows system processes (svchost.exe, lsass.exe, services.exe,
    etc.). Flag names at distance 1-2 as likely masquerading, while distance 0 in an unexpected path is
    a separate path-anomaly check. A near-miss name on a recently downloaded file is a strong corroborating
    signal that the file is a staged payload trying to blend in. References: [The Landscape of Domain
    Name Typosquatting: Techniques and Countermeasures](https://arxiv.org/abs/1603.02767)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Endpoint devices (workstations, servers), domain controllers, network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR p IN new_processes (downloaded files)\n  d = min(damerau_levenshtein(p.name, sys) for\
      \ sys in system_proc_list)\nWHERE d BETWEEN 1 AND 2 THEN ALERT (likely masquerade)"
- question: Does a process spawned from a downloaded file exhibit periodic, regular outbound connections
    (low jitter, consistent inter-arrival/payload size) consistent with automated C2 beaconing?
  context: 'Once staged malware executes it typically beacons to C2 on a regular cadence. For a process
    spawned from a downloaded file, analyze the time series of its outbound connections (Zeek conn.log
    / Sysmon Event ID 3) for periodicity and regularity using FFT plus inter-arrival and payload-size
    coefficient of variation, MAD, and Bowley skewness (RITA-style), and apply BAYWATCH-style multi-stage
    filtering with whitelist suppression to survive jitter and enterprise noise. A strong regular signal
    indicates automated beaconing and warrants a high-severity alert. Corroborate with reused TLS client
    fingerprints (JA3/JA4+) to tie the beacon to a known implant family. References: [RITA, Active Countermeasures](https://github.com/activecm/rita)
    [BAYWATCH, Hu et al](https://dsail.kaist.ac.kr/files/WWW17.pdf) [JA3](https://github.com/salesforce/ja3)
    [JA4+](https://github.com/FoxIO-LLC/ja4)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Endpoint devices (workstations, servers), domain controllers, network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "conns = outbound BY process_from_download\nscore = FFT_periodicity(intervals) + low_CV(interarrival,payload)\n\
      \         + MAD + bowley_skew, with BAYWATCH whitelist suppression\nWHERE strong_regularity THEN\
      \ ALERT severity=HIGH; corroborate ja3/ja4"
- question: Did a developer endpoint, CI/CD host, or internal package mirror retrieve a software package
    whose name or artifact hash matches a known-malicious package feed, or whose name typosquats (edit
    distance 1-2) one of the most-installed packages?
  context: 'Adversaries upload backdoored packages to public registries (PyPI, npm, etc.) and rely on
    typosquatting and chance installs. Match package names and artifact hashes pulled through internal
    mirrors/proxies (Zeek http.log/files.log) against open malicious-package feeds (Datadog Malicious
    Software Packages Dataset, Backstabber''s Knife Collection). Additionally flag package names within
    Levenshtein/Damerau distance 1-2 of the top-N most-installed packages as typosquats. Alert on any
    match with package name, version, requesting host, and feed so the supply-chain exposure can be scoped
    across developer and CI/CD systems. References: [Malicious Software Packages Dataset, Datadog Security
    Labs](https://securitylabs.datadoghq.com/articles/malicious-software-packages-dataset/) [Backstabber''s
    Knife Collection, Ohm et al](https://arxiv.org/abs/2005.09535) [The Landscape of Domain Name Typosquatting:
    Techniques and Countermeasures](https://arxiv.org/abs/1603.02767)'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - 'NAI: Internal PyPI/npm/registry mirrors and proxies, package-manager egress points, developer and
    CI/CD endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'pkg = registry_pull (http.log/files.log)

      IF pkg.name IN bad_pkg_feed OR pkg.hash IN bad_pkg_hashes THEN ALERT

      ELSE IF min(damerau(pkg.name, top_pkg)) BETWEEN 1 AND 2 THEN ALERT (typosquat)'
- question: During package installation, did a package-manager child process (from setup.py, package.json
    preinstall/postinstall) initiate outbound network egress or spawn an interpreter/shell, indicating
    a malicious install hook?
  context: 'A primary behavior of malicious packages and multi-stage downloaders is executing network
    or shell activity at install time. Correlate package-manager process trees (pip/npm via Sysmon Event
    ID 1 / Windows Event ID 4688) with outbound connections (Sysmon Event ID 3) during installation, and
    alert when a setup.py or postinstall child process initiates an external connection or downloads a
    second-stage payload. Legitimate installs rarely need to reach arbitrary internet hosts or spawn shells,
    so this behavior on a developer or CI/CD endpoint is strong evidence of a backdoored package fetching
    staged malware. References: [Backstabber''s Knife Collection, Ohm et al](https://arxiv.org/abs/2005.09535)'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - 'NAI: Internal PyPI/npm/registry mirrors and proxies, package-manager egress points, developer and
    CI/CD endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "tree = proc_tree WHERE parent IN (pip,npm) (sysmon1/4688)\nWHERE child IN (setup.py, postinstall,\
      \ sh, powershell, cmd)\n  AND child HAS outbound_conn (sysmon3) OR downloads_payload\nTHEN ALERT\
      \ severity=HIGH"
- question: Among packages installed across the enterprise, which are newly published (version < 14 days
    old), installed by fewer than 3 hosts, or associated with failed/aborted installs and 404s for typosquatted
    names?
  context: 'Malicious or typosquatted packages tend to be newly published and rarely installed, mirroring
    the rarity/recency logic that flags newly staged infrastructure. Compute enterprise install prevalence
    and package-version age and prioritize installs of versions published within the last 14 days or installed
    by fewer than 3 hosts. Track failed/aborted installs and 404s for typosquatted names as distinct signals
    of probing or pulled malicious packages. Derive thresholds from the per-environment install-prevalence
    distribution so the rarity cut-off reflects how your developers actually consume packages. References:
    [EXPOSURE, Bilge et al](https://sites.cs.ucsb.edu/~chris/research/doc/ndss11_exposure.pdf)'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - 'NAI: Internal PyPI/npm/registry mirrors and proxies, package-manager egress points, developer and
    CI/CD endpoints.'
  range: Last 90 days
