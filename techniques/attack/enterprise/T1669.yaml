questions:
- question: '[Initial Access] Using the ''Threat-intel MAC watch'' (Symbolic Logic) approach, can you
    determine whether a successful (802.1X EAP-Success) or failed (EAP-Failure) Wi-Fi authentication event
    where the client''s source MAC address or the access point''s BSSID matches an entry on a threat intelligence
    watchlist of known malicious or unauthorized devices? In particular, Join wireless authentication
    logs (RADIUS / Zeek radius.log, WLAN-AutoConfig EventCodes 8001/8002/8003) with an internal watchlist
    of unauthorized/known-malicious client MAC OUIs and AP BSSIDs. Generate a high-severity alert on ANY
    successful or failed association involving a watchlisted identifier, and record success/fail state
    separately so a watchlisted MAC seen in repeated EAP-Failure (failed handshake/credential guessing)
    is triaged distinctly from a watchlisted MAC reaching EAP-Success (live foothold). Impersonation is
    a labeled attack class in the AWID dataset.'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary establishes a foothold
    by connecting to a corporate or nearby Wi-Fi network — open or secured with stolen valid accounts
    — to launch follow-on sniffing, adversary-in-the-middle, discovery, or lateral movement against the
    victim environment. This evidence focuses on the condition that a successful (802.1X EAP-Success)
    or failed (EAP-Failure) Wi-Fi authentication event where the client''s source MAC address or the access
    point''s BSSID matches an entry on a threat intelligence watchlist of known malicious or unauthorized
    devices. This Symbolic Logic approach works as follows: Join wireless authentication logs (RADIUS
    / Zeek radius.log, WLAN-AutoConfig EventCodes 8001/8002/8003) with an internal watchlist of unauthorized/known-malicious
    client MAC OUIs and AP BSSIDs. Generate a high-severity alert on ANY successful or failed association
    involving a watchlisted identifier, and record success/fail state separately so a watchlisted MAC
    seen in repeated EAP-Failure (failed handshake/credential guessing) is triaged distinctly from a watchlisted
    MAC reaching EAP-Success (live foothold). Impersonation is a labeled attack class in the AWID dataset.
    A positive result — a rule match, a statistical outlier, or a model alert — is a strong signal of
    unauthorized wireless access or attack tradecraft; pivot to the client MAC/OUI and its asset-inventory
    record, the associated AP BSSID/SSID and its authorized-inventory status, the user account and EAP
    method used, the physical location and RSSI/RF profile, the success/fail state of the handshake, and
    any process, host, or subsequent network activity tied to the device, to scope whether an adversary
    obtained a live wireless foothold. A negative result helps rule out this particular vector but should
    be corroborated with the other questions in this playbook, since a single method can miss MAC-spoofed,
    physical-layer-forged, low-and-slow, or remotely-bridged wireless intrusions.'
