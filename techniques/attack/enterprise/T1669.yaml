- question: '[Initial Access] Using the ''MAC fingerprint anomaly'' (Machine Learning) approach, can you
    determine whether a successful wireless authentication from a) a client MAC address not registered
    in the asset inventory or b) a registered MAC address exhibiting behavior inconsistent with its known
    device profile, such as presenting a new DHCP fingerprint or connecting from two physically distant
    access points simultaneously (''impossible travel'')? In particular, Build a per-MAC device fingerprint
    from DHCP request parameters (Zeek dhcp.log) and TCP/IP-stack traits (Zeek conn.log) and train a one-class
    model (One-Class SVM / Isolation Forest); alert when a known MAC presents a fingerprint the model
    rejects. Where SDR/WIPS IQ capture exists, add physical-layer radio fingerprinting (ORACLE) so a forged
    MAC on different hardware is caught regardless of stack mimicry. List the top-3 deviating features
    in the alert.'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary establishes a foothold
    by connecting to a corporate or nearby Wi-Fi network — open or secured with stolen valid accounts
    — to launch follow-on sniffing, adversary-in-the-middle, discovery, or lateral movement against the
    victim environment. This evidence focuses on the condition that a successful wireless authentication
    from a) a client MAC address not registered in the asset inventory or b) a registered MAC address
    exhibiting behavior inconsistent with its known device profile, such as presenting a new DHCP fingerprint
    or connecting from two physically distant access points simultaneously (''impossible travel''). This
    Machine Learning approach works as follows: Build a per-MAC device fingerprint from DHCP request parameters
    (Zeek dhcp.log) and TCP/IP-stack traits (Zeek conn.log) and train a one-class model (One-Class SVM
    / Isolation Forest); alert when a known MAC presents a fingerprint the model rejects. Where SDR/WIPS
    IQ capture exists, add physical-layer radio fingerprinting (ORACLE) so a forged MAC on different hardware
    is caught regardless of stack mimicry. List the top-3 deviating features in the alert. A positive
    result — a rule match, a statistical outlier, or a model alert — is a strong signal of unauthorized
    wireless access or attack tradecraft; pivot to the client MAC/OUI and its asset-inventory record,
    the associated AP BSSID/SSID and its authorized-inventory status, the user account and EAP method
    used, the physical location and RSSI/RF profile, the success/fail state of the handshake, and any
    process, host, or subsequent network activity tied to the device, to scope whether an adversary obtained
    a live wireless foothold. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss MAC-spoofed, physical-layer-forged,
    low-and-slow, or remotely-bridged wireless intrusions.'
