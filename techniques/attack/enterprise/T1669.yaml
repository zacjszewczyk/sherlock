- question: '[Initial Access] Using the ''Cross-network comms outlier'' (Statistical Method) approach,
    can you determine whether a single host, identified by its hostname or MAC address, holding active
    IP addresses on both a wired and a wireless subnet simultaneously and actively routing or forwarding
    traffic between these two network interfaces? In particular, From Zeek conn.log, for each host with
    IPs on both wired and wireless subnets count the unique cross-subnet peers it talks to from each interface
    (Volume/fan-out). A non-bridging host is near zero; flag hosts whose cross-network unique-peer count
    exceeds a low threshold (e.g., >5), per the host-communication-graph anomaly reasoning of Bohara et
    al.. Tune the threshold to exclude legitimate routers/jump hosts.'
