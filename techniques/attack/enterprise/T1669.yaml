- question: '[Initial Access] Using the ''Wi-Fi risk classifier'' (Machine Learning) approach, can you
    determine whether a successful (802.1X EAP-Success) or failed (EAP-Failure) Wi-Fi authentication event
    where the client''s source MAC address or the access point''s BSSID matches an entry on a threat intelligence
    watchlist of known malicious or unauthorized devices? In particular, Train a tree-ensemble (Random
    Forest / gradient boosting) on labeled 802.11 association records, following the CFS-BA feature-selection
    + ensemble approach validated on AWID by Zhou et al.. Features: OUI, time-of-day, AP/location, EAP
    method, association duration, prior failure count, and success/fail ratio. Alert when malicious confidence
    >0.9, and surface the top-3 SHAP-ranked contributing features in the alert text (e.g., ''rare OUI,
    off-hours, 14 prior EAP-Failures'') per the Frontiers IDS explainability review.'
