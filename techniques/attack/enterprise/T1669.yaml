name: 'T1669: Wi-Fi Networks'
id: b61771a7-81b8-4857-8543-3d9d4c4d1d66
description: 'This playbook helps an analyst investigate whether an adversary has gained initial access
  to the network by connecting to a wireless (Wi-Fi) network — either by exploiting open Wi-Fi or by using
  valid accounts/credentials against a secured corporate SSID (MITRE ATT&CK T1669, Wi-Fi Networks). Such
  access can be achieved through close-access operations (an operator physically near the building) or
  remotely via a compromised dual-homed third-party device that bridges a wired connection into the target''s
  Wi-Fi. The hunt spans Windows, Linux, macOS, and network-device telemetry plus wireless controller,
  RADIUS, and WIDS/WIPS sources, and pursues the behavior from several complementary angles: wireless
  authentication and association events (802.1X EAP-Success / EAP-Failure) involving threat-intel-listed
  or rare-OUI client MACs and AP BSSIDs; endpoint process creation matching 802.11 reconnaissance and
  attack tooling (aircrack-ng, kismet, reaver, ettercap, `netsh wlan show profiles key=clear`); detection
  of rogue and evil-twin access points by configuration mismatch, RSSI change-point analysis, and RF clustering/physical-layer
  fingerprinting; authentication floods and deauthentication/disassociation storms indicating brute-force,
  password spraying, or forced handshake capture; unauthorized or spoofed client MACs identified via asset
  inventory joins, impossible-roam geovelocity, and DHCP/stack/radio fingerprinting; and dual-homed bridge
  hosts that route between wired and wireless subnets. Detection methods combine deterministic symbolic-logic
  rules (threat-intel watchlists, authorized-AP inventory comparison, tool signatures, dual-homed DHCP/WFP
  correlation), statistical baselining (rare-OUI frequency, command entropy, RSSI and failure-rate change-point
  detection, geovelocity, cross-subnet fan-out), and machine learning (tree-ensemble association classifiers,
  time-series/ARIMA forecasting, DBSCAN RF clustering, one-class DHCP/radio fingerprint models, and graph
  betweenness-centrality bridge detection), applied across Zeek conn/radius/dhcp/notice/software logs,
  Windows WLAN-AutoConfig and Security events, Linux auditd/syslog, macOS unified logs, and WIDS/WIPS/firewall
  telemetry, so the analyst can corroborate suspected wireless initial access against device identity,
  AP legitimacy, RF physical layer, and host network position.'
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
