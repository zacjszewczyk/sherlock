- question: '[Initial Access] Using the ''Tool command frequency/entropy anomaly'' (Statistical Method)
    approach, can you determine whether a process creation event on an endpoint (e.g., Windows Event ID
    4688) where the process name, hash, or command-line arguments match a known Wi-Fi reconnaissance or
    attack tool (e.g., ''aircrack-ng'', ''kismet'', ''netsh wlan show profiles key=clear'')? In particular,
    Track both Volume and Frequency of native Wi-Fi utilities: alert on >5 `netsh wlan show profile`/`show
    profiles key=clear` (credential harvesting) invocations from one host in 10 minutes, and compute Shannon
    entropy of command-line arguments per process, alerting above the 95th percentile of that process''s
    historical baseline (obfuscation). The `netsh ... key=clear` profile dump is the Windows analogue
    of the WPA-key extraction performed by the Aircrack-ng suite; derive thresholds from per-host baselines.'
