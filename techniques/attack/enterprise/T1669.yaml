- question: '[Initial Access] Using the ''Rogue AP config mismatch'' (Symbolic Logic) approach, can you
    determine whether detection of a wireless access point that is either a) a Rogue AP broadcasting a
    non-corporate SSID from within the corporate network, or b) an Evil Twin AP broadcasting a corporate
    SSID (or a visually similar variant) from a BSSID not on the authorized list, or with a security configuration
    (e.g., Open, WEP) weaker than the corporate standard (e.g., WPA2/3-Enterprise)? In particular, Maintain
    an authorized-AP inventory (BSSID, SSID, security mode, location). Continuously parse WIDS/WIPS beacon
    and probe-response frames and alert critically when a corporate SSID is broadcast from an unlisted
    BSSID or with a security mode weaker than the corporate standard (Open/WEP/WPA2-PSK vs WPA2/3-Enterprise
    or an unexpected 802.1X certificate). This is the deterministic core because 802.1X alone provides
    no practical user-side certificate check, leaving clients exposed to evil twins per Daldoul; beacon/probe-response
    and provisioning attributes that distinguish the twin are detailed in iTieProbe.'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary establishes a foothold
    by connecting to a corporate or nearby Wi-Fi network — open or secured with stolen valid accounts
