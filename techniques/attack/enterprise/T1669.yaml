- question: '[Initial Access] Using the ''Rare OUI alert'' (Statistical Method) approach, can you determine
    whether a successful (802.1X EAP-Success) or failed (EAP-Failure) Wi-Fi authentication event where
    the client''s source MAC address or the access point''s BSSID matches an entry on a threat intelligence
    watchlist of known malicious or unauthorized devices? In particular, For all connecting client MACs
    extract the OUI and compute the 30-day frequency distribution; alert on a successful association from
    an OUI in the bottom 5th percentile (rare hardware). Treat each never-before-seen (MAC, BSSID/SSID)
    pair as a low-probability new edge and score it with the Bayesian new-edge model of Metelli & Heard;
    derive the percentile/posterior cutoff per site from your own baseline (busy guest networks need a
    looser floor than a controlled corporate SSID).'
