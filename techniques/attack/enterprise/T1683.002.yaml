questions:
- question: Do inbound images, videos, and audio carry valid cryptographic content provenance, and are
    their container, codec, camera-fingerprint, and EXIF/document metadata internally consistent with
    the device they claim to come from?
  context: 'Method: Symbolic Logic. Verify cryptographic content provenance by validating [C2PA](https://c2pa.org/specifications/specifications/1.3/specs/C2PA_Specification.html)
    manifests/Content Credentials on inbound media and flag assets with missing, broken, untrusted-certificate,
    or explicit AI-generated provenance assertions (treat like a DMARC alignment failure). Apply classic
    media-forensics rules from [Media Forensics and DeepFakes: an overview](https://arxiv.org/abs/2001.06564):
    PRNU camera-fingerprint absence/mismatch, container/codec metadata inconsistent with the claimed capture
    device, and double-compression / quantization-table inconsistencies. Enforce EXIF/document single-pipeline
    consistency using the learned [self-consistency](https://arxiv.org/abs/1805.04096) principle, flagging
    identity documents and profile photos whose metadata or pipeline signature is internally inconsistent
    or shows a generator/editor export tag rather than a camera. Deterministic thresholds: any provenance-validation
    failure, any camera-model/codec/EXIF field conflicting with the purported source, or any synthesis-tool
    export tag is a hard flag. This supports the Resource Development (TA0042) objective by exposing fabricated
    or manipulated audio-visual content the adversary prepares to enable phishing, impersonation, social
    engineering, financial theft, or account establishment. A positive result (failed provenance, detected
    blend/spectral/physiological anomaly, classifier hit, cross-modal divergence, or anomalous transfer/lineage)
    indicates likely synthetic or altered media and warrants escalation; a clean result lowers but does
    not eliminate suspicion, so combine this signal with the other checks in this playbook rather than
    relying on it alone.'
  answer_sources:
  - Email gateway logs (media attachments and headers)
  - Chat/collaboration logs
  - Web proxy logs (deepfake or image synthesis services)
  - Endpoint file creation and metadata
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Cloud storage audit logs
  - Unified communications logs (voice/video call metadata)
  - Host process monitoring
  - 'NAI: Email gateways and collaboration/UC platforms where media is delivered; web proxy egress to
    image/voice/video synthesis services; endpoints that create or export media; cloud storage where identity
    assets and profile photos are stored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each inbound media asset:\n  if C2PA_manifest is MISSING or BROKEN or cert_UNTRUSTED or\
      \ asserts_AI_generated: FLAG('provenance_fail')\n  if PRNU_camera_fingerprint absent OR mismatch_claimed_device:\
      \ FLAG('prnu')\n  if container_codec_metadata != claimed_capture_device: FLAG('codec_mismatch')\n\
      \  if double_compression OR quantization_table_inconsistent: FLAG('recompress')\n  if EXIF_or_document_pipeline\
      \ shows editor/generator_export_tag (not camera): FLAG('export_tag')\n  if any FLAG set: raise alert(sender,\
      \ recipient, asset_hash, reasons)"
- question: Do faces in profile photos, identity documents, or video show a detectable compositing/blend
    boundary or physiologically implausible eye-blink behavior indicating a face-swap or synthetic face?
  context: 'Method: Symbolic Logic. Run a blending-boundary check using the [face X-ray](https://arxiv.org/abs/1912.13458)
    representation, which reveals the composite boundary present in nearly all face-swap/blend pipelines;
    a detectable boundary is a hard tell for a manipulated face while its absence indicates a single-source
    image. Add the physiological rule from [In Ictu Oculi](https://arxiv.org/abs/1806.02877): flag faces
    with eye-blink frequency far from the human baseline (~17 blinks/min) or with absent eye-closure over
    the clip. Surface the localized blend region or blink statistic in the alert for triage. This supports
    the Resource Development (TA0042) objective by exposing fabricated or manipulated audio-visual content
    the adversary prepares to enable phishing, impersonation, social engineering, financial theft, or
    account establishment. A positive result (failed provenance, detected blend/spectral/physiological
    anomaly, classifier hit, cross-modal divergence, or anomalous transfer/lineage) indicates likely synthetic
    or altered media and warrants escalation; a clean result lowers but does not eliminate suspicion,
    so combine this signal with the other checks in this playbook rather than relying on it alone.'
