      \  if score < spoof_threshold (t-DCF/EER): FLAG('vocoder', score)\n  if any FLAG: alert(asset_hash,\
      \ flagged_features)"
- question: Is there a spike in provenance-validation failures, anti-spoof rejects, or forensic-check
    errors from a particular sender, sender domain, or channel that signals coordinated delivery of fabricated
    media?
  context: 'Method: Statistical Method. Treat failure modes as distinct signals. Track and baseline the
    rate of [C2PA](https://c2pa.org/specifications/specifications/1.3/specs/C2PA_Specification.html) provenance-validation
    failures, anti-spoof rejects (min t-DCF/EER excursions per [ASVspoof 2019](https://arxiv.org/abs/1911.01601)),
    and forensic-check errors per sender, sender domain, and channel. A spike in failed/unverifiable media
    from a single sender or a newly seen external domain is a high-priority indicator even when individual
    classifiers are uncertain. This supports the Resource Development (TA0042) objective by exposing fabricated
    or manipulated audio-visual content the adversary prepares to enable phishing, impersonation, social
    engineering, financial theft, or account establishment. A positive result (failed provenance, detected
    blend/spectral/physiological anomaly, classifier hit, cross-modal divergence, or anomalous transfer/lineage)
    indicates likely synthetic or altered media and warrants escalation; a clean result lowers but does
    not eliminate suspicion, so combine this signal with the other checks in this playbook rather than
    relying on it alone.'
