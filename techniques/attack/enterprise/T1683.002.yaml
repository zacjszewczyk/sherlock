      \ deviates_from natural_image_prior: FLAG('spectral', band=azimuthal_spectrum.dev_band)\n  ppg =\
      \ rppg_coherence(face_region)   # FakeCatcher\n  if ppg.coherence low: FLAG('ppg', score=ppg.coherence)\n\
