      \ score\n  if blend.boundary_detected: FLAG('blend_region', region=blend.bbox)\n  if is_video:\n\
      \    blink_rate = measure_blinks_per_min(asset)\n    if blink_rate far_from 17/min OR no_eye_closure_over_clip:\
      \ FLAG('blink', stat=blink_rate)\n  if any FLAG: alert(asset_hash, blend.bbox, blink_rate)"
- question: Are media transfers or live voice/video sessions unusually large, unusually frequent, or technically
    inconsistent (jitter, latency, packet loss, duration) compared with the user's and business unit's
    normal communication baseline?
  context: 'Method: Statistical Method. Build per-business-unit and per-channel baselines for media Volume
    (byte counts and attachment-size distribution), Frequency (media transfers per user per hour/day),
    and call State/quality (duration, jitter, latency, packet loss). Use percentile or standard-deviation
    thresholds (e.g., >3 sigma or >99th percentile) to flag transfers and live sessions that are unusually
    large, unusually frequent, or technically inconsistent with the user''s normal communication pattern,
    consistent with the operational baselining recommended in the media-forensics literature [Media Forensics
    and DeepFakes: an overview](https://arxiv.org/abs/2001.06564). Derive dataset-specific thresholds
    from 30-90 days of history per cohort. This supports the Resource Development (TA0042) objective by
    exposing fabricated or manipulated audio-visual content the adversary prepares to enable phishing,
    impersonation, social engineering, financial theft, or account establishment. A positive result (failed
    provenance, detected blend/spectral/physiological anomaly, classifier hit, cross-modal divergence,
    or anomalous transfer/lineage) indicates likely synthetic or altered media and warrants escalation;
    a clean result lowers but does not eliminate suspicion, so combine this signal with the other checks
    in this playbook rather than relying on it alone.'
