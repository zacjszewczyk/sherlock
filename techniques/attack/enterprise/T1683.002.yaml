name: 'T1683.002: Audio-Visual Content'
id: 55ce7202-08f6-4a1e-a0b7-800e434b3079
description: Investigate adversary creation or manipulation of audio, image, and video content used to
  support targeting and malicious operations (deepfakes, synthetic voice, fabricated profile photos and
  identity documents, and real-time altered audio/video during live interactions). This playbook helps
  an analyst examine synthetic media and altered identity assets exchanged through email, collaboration
  platforms, cloud storage, and live voice/video sessions. It guides validation of cryptographic content
  provenance (C2PA/Content Credentials), classic media-forensics checks (PRNU camera fingerprints, container/codec
  consistency, double-compression and EXIF/document self-consistency), compositing and physiological tests
  (face X-ray blend boundaries, eye-blink rate, heartbeat/rPPG), spectral and vocoder fingerprint scoring,
  supervised deepfake and anti-spoofing classifiers, cross-modal audio-visual consistency, statistical
  baselining of media transfer and call quality, tracking of provenance/forensic-check failure rates,
  and correlation of media exports with host process lineage. Provenance-validation failures, anti-spoof
  rejects, and forensic-check errors are themselves treated as indicators.
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
