- question: In live or recorded clips, do the voice and face modalities disagree in perceived emotion
    or identity cues, indicating a cross-modally inconsistent deepfake?
  context: 'Method: Machine Learning. For live or recorded audio-visual content, score cross-modal consistency
    with a multimodal detector such as [Emotions Don''t Lie](https://arxiv.org/abs/2003.06711), which
    compares voice and face modalities and their perceived-emotion/identity cues within the same video
    using a Siamese/triplet network; mismatch between the audio and visual streams flags fakes and resists
    single-modality evasion. Report which modality pair diverged in the alert. This supports the Resource
    Development (TA0042) objective by exposing fabricated or manipulated audio-visual content the adversary
    prepares to enable phishing, impersonation, social engineering, financial theft, or account establishment.
    A positive result (failed provenance, detected blend/spectral/physiological anomaly, classifier hit,
    cross-modal divergence, or anomalous transfer/lineage) indicates likely synthetic or altered media
    and warrants escalation; a clean result lowers but does not eliminate suspicion, so combine this signal
    with the other checks in this playbook rather than relying on it alone.'
