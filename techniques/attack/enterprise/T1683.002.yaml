- question: Do images/video exhibit high-frequency Fourier-spectrum discrepancies typical of GAN/VAE generators,
    and does audio show vocoder fingerprints or do faces lack coherent heartbeat/rPPG blood-flow signals?
  context: 'Method: Statistical Method. For images/video, score high-frequency [Fourier-spectrum discrepancies](https://arxiv.org/abs/1911.06465)
    (azimuthal power-spectrum decay) that GAN/VAE generators systematically fail to reproduce; the spectral
    statistics generalize across generators and are explainable. For audio, extract LFCC/mel and vocoder-fingerprint
    features and score against GMM/RawNet2 baselines from [WaveFake](https://arxiv.org/abs/2111.02813)
    and the standardized countermeasures and t-DCF metric of [ASVspoof 2019](https://arxiv.org/abs/1911.01601).
    Add the heartbeat/rPPG biological-signal coherence test from [FakeCatcher](https://arxiv.org/abs/1901.02212):
    authentic faces carry spatially/temporally coherent blood-flow signals that synthetic faces lack.
    Report the deviating spectral band or PPG-coherence score in the alert. This supports the Resource
    Development (TA0042) objective by exposing fabricated or manipulated audio-visual content the adversary
    prepares to enable phishing, impersonation, social engineering, financial theft, or account establishment.
    A positive result (failed provenance, detected blend/spectral/physiological anomaly, classifier hit,
    cross-modal divergence, or anomalous transfer/lineage) indicates likely synthetic or altered media
    and warrants escalation; a clean result lowers but does not eliminate suspicion, so combine this signal
    with the other checks in this playbook rather than relying on it alone.'
