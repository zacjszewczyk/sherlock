      \ failure_type, count)"
- question: When supervised deepfake image/video classifiers and raw-waveform voice anti-spoofing models
    are applied, does the content score as DeepFake/Face2Face/FaceSwap/NeuralTextures or as synthetic
    voice?
  context: 'Method: Machine Learning. Apply supervised face-manipulation classifiers - the XceptionNet
    benchmark from [FaceForensics++](https://arxiv.org/abs/1901.08971) and the compact [MesoNet](https://arxiv.org/abs/1809.00888)
    for compression-robust screening - to images and video to detect DeepFakes/Face2Face/FaceSwap/NeuralTextures,
    and apply the end-to-end raw-waveform anti-spoofing model [AASIST](https://arxiv.org/abs/2110.01200)
    to voice. Validate and tune generalization against high-quality/unseen fakes using [Celeb-DF](https://arxiv.org/abs/1909.12962)
    and the consented [DFDC](https://arxiv.org/abs/2006.07397) datasets, and ensemble model scores with
    the deterministic provenance and spectral checks rather than relying on a single score. Alerts must
    surface the top-3 contributing features (e.g., spectral band, blend region, mouth/eye artifact, voice
    spectral cue) plus sender, recipient, and delivery path. This supports the Resource Development (TA0042)
    objective by exposing fabricated or manipulated audio-visual content the adversary prepares to enable
    phishing, impersonation, social engineering, financial theft, or account establishment. A positive
    result (failed provenance, detected blend/spectral/physiological anomaly, classifier hit, cross-modal
    divergence, or anomalous transfer/lineage) indicates likely synthetic or altered media and warrants
    escalation; a clean result lowers but does not eliminate suspicion, so combine this signal with the
    other checks in this playbook rather than relying on it alone.'
