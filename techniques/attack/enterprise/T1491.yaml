questions:
- question: '[Impact] Malicious destination IOC match: Can you determine whether network traffic to or
    from a web server matches a known-bad indicator of compromise (IOC) associated with defacement campaigns,
    such as a malicious IP address, domain, or URL string. -- specifically, using the ''Malicious destination
    IOC match'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary defaces internal or external
    web content to manipulate integrity, deliver messaging or intimidation, claim (possibly false) credit
    for an intrusion, or mask a confidentiality breach. This evidence focuses on the condition that network
    traffic to or from a web server matches a known-bad indicator of compromise (IOC) associated with
    defacement campaigns, such as a malicious IP address, domain, or URL string. This Symbolic Logic approach
    looks for the following signal: Correlate Zeek conn.log/http.log/dns.log destinations with TI/defacement-marker
    lists (hacktivist domains/IPs, Zone-H mirror infrastructure, known defacement signature strings),
    capture the matching request context (URI, user-agent, referer), tag the impacted host, and escalate
    when the target is a monitored or high-value web server. Front-end this with fast signature matching
    to cut ML load per Detecting Website Defacements Based on Machine Learning Techniques and Attack Signatures
    and reuse curated YARA/IOC defacement markers from Neo23x0/signature-base. A positive result -- a
    rule match, statistical outlier, or model alert -- is a strong indicator that web content has been
    (or is being) tampered with; pivot to the responsible host/process/principal, the modifying account
    and its authorization, the changed file(s) and their known-good baseline, the source IP/geo of the
    change, and any related web-shell, network IOC, or cloud-API activity. A negative result helps rule
    out this defacement vector but should be corroborated with the other questions in this playbook, since
    a single method can miss injection, DNS-hijack, or living-off-the-land defacements that bypass any
    one sensor.'
