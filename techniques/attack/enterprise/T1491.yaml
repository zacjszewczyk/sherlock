name: 'T1491: Defacement'
id: 3939733e-9fc6-4c51-b061-ef0982086b70
description: 'This playbook helps an analyst investigate whether an adversary has impacted the integrity
  of internal or external web assets through Defacement (T1491) under the Impact tactic -- modifying visual
  or hosted web content to deliver messaging, intimidate, claim (possibly false) credit for an intrusion,
  or provide cover for a confidentiality breach. It guides the hunt across the full defacement kill-chain
  and across platforms (Windows/IIS, Linux/Apache/Nginx, macOS, ESXi-hosted portals, and cloud object
  storage used for static website hosting). Investigative angles include: network traffic to or from web
  servers matching known-bad defacement IOCs (hacktivist domains/IPs, Zone-H mirror infrastructure, defacement
  signature strings) and reputation/DNS-hijack corroboration in Zeek conn/http/dns logs; web server processes
  (w3wp.exe, httpd, nginx, php-fpm) spawning suspicious child shells or file-transfer utilities as a post-exploitation
  precursor to content modification; modification of designated critical web files (index.html, web.config)
  by unauthorized accounts or outside maintenance windows, validated against known-good SHA-256 baselines;
  deviations in served-page content features (text-to-HTML ratio, script-block entropy, external image
  counts) and rendered-page visual classification that catch injection and DNS-hijack defacements which
  never touch monitored server files; files written into content directories via FTP/SMB from unauthorized
  source ranges or with anomalous mime-types (webshell planting); and unauthorized PutObject/CopyObject
  writes to website-enabled S3/Azure Blob/GCS buckets by principals, IPs, or geographies inconsistent
  with the deployment pipeline. Detection methods combine symbolic-logic rules, statistical baselining/anomaly
  detection, and machine-learning models (content/NLP classifiers, Random Forest, DBSCAN, Isolation Forest,
  autoencoders, image-based object recognition, webshell source-code detectors, and CloudTrail anomaly
  jobs) so the analyst can corroborate suspected defacement across network, endpoint, file-integrity,
  content, and cloud telemetry.'
