  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary defaces internal or external
    web content to manipulate integrity, deliver messaging or intimidation, claim (possibly false) credit
    for an intrusion, or mask a confidentiality breach. This evidence focuses on the condition that network
    traffic to or from a web server matches a known-bad indicator of compromise (IOC) associated with
    defacement campaigns, such as a malicious IP address, domain, or URL string. This Statistical Method
    approach looks for the following signal: Compute 5-minute average threat scores per source IP (Zeek
    conn.log) against a reputation feed and alert when the background percentile exceeds 95; in parallel
    profile the FAILURE state explicitly — spikes in NXDOMAIN (dns.log) and blocked/reset connections
    (conn.log conn_state S0/REJ) around the same window are distinct corroborating signals of DNS-hijack
    defacement vectors noted in Meerkat. Derive the percentile cutoff per environment from 30 days of
    conn.log history. A positive result -- a rule match, statistical outlier, or model alert -- is a strong
    indicator that web content has been (or is being) tampered with; pivot to the responsible host/process/principal,
    the modifying account and its authorization, the changed file(s) and their known-good baseline, the
    source IP/geo of the change, and any related web-shell, network IOC, or cloud-API activity. A negative
    result helps rule out this defacement vector but should be corroborated with the other questions in
    this playbook, since a single method can miss injection, DNS-hijack, or living-off-the-land defacements
    that bypass any one sensor.'
