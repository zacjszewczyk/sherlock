questions:
- question: Has any Active Directory user account been modified (Windows Event ID 4738) so that the 'Password
    stored using reversible encryption' flag (ADS_UF_ENCRYPTED_TEXT_PASSWORD_ALLOWED / 0x80) transitioned
    from disabled to enabled?
  context: '[Defense Impairment] From a Defense Impairment perspective, enabling reversible password encryption
    silently degrades the trustworthiness of the credential store and weakens the one-way-hash protection
    defenders rely on, so detecting the change restores visibility into a covert weakening of authentication
    controls. This addresses the information requirement: "Is the adversary establishing persistence by
    modifying account properties for reversible encryption?" Evidence: An Active Directory user account
    modification event (Windows Event ID 4738) is observed where the ''User Account Control'' field indicates
    the ''Password stored using reversible encryption'' flag (ADS_UF_ENCRYPTED_TEXT_PASSWORD_ALLOWED /
    0x80) was enabled for a user account. On every 4738 (''A user account was changed'') event, compute
    the bitwise difference of the old versus new ''User Account Control'' value and alert when (old &
    0x80)==0 and (new & 0x80)==0x80, i.e. the reversible-encryption bit was newly set. This policy is
    Disabled by default and is only legitimately required for legacy CHAP/IAS/Digest applications, so
    any enable on an account that is not on a documented allow-list should be treated as actionable. Capture
    the Subject actor, TargetUserName, and the old/new UAC values from the event to attribute who made
    the change and which account was staged. A positive result means an account is now storing a recoverable
    password; a negative result across the range raises confidence that no accounts were weakened.'
  answer_sources:
  - Windows Event ID 4738
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Security EventCode=4738

      | eval old_uac=tonumber(OldUACValue,16), new_uac=tonumber(NewUACValue,16)

      | where (old_uac%256<128) AND (new_uac%256>=128) AND ((old_uac & 0x80)=0) AND ((new_uac & 0x80)=0x80)

      | where NOT TargetUserName IN (reversible_allowlist)

      | table _time, SubjectUserName, TargetUserName, OldUACValue, NewUACValue, ComputerName'
- question: For accounts that now have reversible encryption enabled, does any account authenticate (Windows
    Event ID 4624) after a dormancy period exceeding the environment's 95th-percentile login-inactivity
    baseline, accompanied by a spike in failed logons or refused network connections?
  context: '[Defense Impairment] From a Defense Impairment perspective, enabling reversible password encryption
    silently degrades the trustworthiness of the credential store and weakens the one-way-hash protection
    defenders rely on, so detecting the change restores visibility into a covert weakening of authentication
    controls. This addresses the information requirement: "Is the adversary establishing persistence by
    modifying account properties for reversible encryption?" Evidence: An Active Directory user account
    modification event (Windows Event ID 4738) is observed where the ''User Account Control'' field indicates
    the ''Password stored using reversible encryption'' flag (ADS_UF_ENCRYPTED_TEXT_PASSWORD_ALLOWED /
    0x80) was enabled for a user account. Baseline login activity from 4624 for all flagged accounts and
    compute the 95th-percentile login dormancy (days since last logon) across active accounts; alert when
    a flagged account suddenly authenticates after exceeding it. In parallel, profile failed logons (Event
    4625) and blocked/refused Zeek conn.log connections (conn_state S0/REJ) for the account in the 24-hour
    window around the change. A burst of failures followed by a success indicates credential probing or
    replay against a deliberately staged account, which is exactly what you expect when an adversary enables
    reversible encryption to recover and reuse a credential.'
  answer_sources:
  - Windows Event ID 4738
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4624 account IN (reversible_accounts)

      | stats max(_time) as last_logon by TargetUserName

      | eval dormancy_days=(now()-last_logon)/86400

      | eventstats perc95(dormancy_days) as p95

      | where dormancy_days>p95

      | join TargetUserName [search EventCode=4625 OR (source=zeek_conn conn_state IN ("S0","REJ")) |
      stats count as fails by TargetUserName | where fails>baseline_mean+3*baseline_std]'
- question: Does the per-user Windows event stream contain a rare, tightly-timed ordering such as [4738
    enable reversible] -> [4624 logon] within a few minutes that an LSTM log-key sequence model predicts
    as a low-probability next event?
  context: '[Defense Impairment] From a Defense Impairment perspective, enabling reversible password encryption
    silently degrades the trustworthiness of the credential store and weakens the one-way-hash protection
    defenders rely on, so detecting the change restores visibility into a covert weakening of authentication
    controls. This addresses the information requirement: "Is the adversary establishing persistence by
    modifying account properties for reversible encryption?" Evidence: An Active Directory user account
    modification event (Windows Event ID 4738) is observed where the ''User Account Control'' field indicates
    the ''Password stored using reversible encryption'' flag (ADS_UF_ENCRYPTED_TEXT_PASSWORD_ALLOWED /
    0x80) was enabled for a user account. Apply an LSTM log-key sequence model (DeepLog-style) over per-user
    Windows event streams to flag orderings that fall outside the top-g predicted next events, such as
    a reversible-encryption enable immediately followed by a logon within five minutes. Cross-score the
    logon source as a low-probability authentication edge or rare ASN/geo via graph or UEBA models. The
    alert text must surface the top-3 contributing features (e.g., sequence rarity, new source ASN, dormancy)
    so the analyst can quickly judge the finding. A flagged sequence suggests an automated takeover where
    the same actor that weakened the account immediately uses it.'
  answer_sources:
  - Windows Event ID 4738
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=deeplog_logkey input=per_user_event_sequence(window=5m)

      | predict next_event given prior_keys

      | flag where observed_seq=[4738_enable_reversible,4624_logon] AND prob(observed) NOT IN top_g

      | enrich logon_source via graph_edge_score, asn_geo_rarity

      | output top3_features(seq_rarity,new_asn,dormancy)'
- question: Has a Fine-Grained Password Policy (FGPP) object been created (Event ID 5137) or modified
    (Event ID 5136) so that the 'msDS-PasswordReversibleEncryptionEnabled' attribute is set to TRUE?
  context: '[Defense Impairment] From a Defense Impairment perspective, enabling reversible password encryption
    silently degrades the trustworthiness of the credential store and weakens the one-way-hash protection
    defenders rely on, so detecting the change restores visibility into a covert weakening of authentication
    controls. This addresses the information requirement: "Is the adversary establishing persistence by
    modifying account properties for reversible encryption?" Evidence: A Fine-Grained Password Policy
    (FGPP) object is created (Event ID 5137) or modified (Event ID 5136) where the ''msDS-PasswordReversibleEncryptionEnabled''
    attribute is set to ''TRUE''. Monitor directory service object creation (Event ID 5137) where the
    Object Class is ''msDS-PasswordSettings'' and modification (Event ID 5136) on existing FGPP objects,
    alerting whenever ''msDS-PasswordReversibleEncryptionEnabled'' is set to TRUE. FGPPs let an adversary
    scope reversible encryption to specific users or groups without touching the default domain policy,
    making them a stealthier vector. Because this setting is needed only for legacy CHAP/IAS/Digest scenarios,
    any enable off an approved baseline is high-signal. Record the policy name, the actor, and the target
    users/groups the PSO applies to.'
  answer_sources:
  - Windows Event ID 5136
  - Windows Event ID 5137
  - 'NAI: Domain Controllers, SYSVOL Share'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Security (EventCode=5137 ObjectClass="msDS-PasswordSettings") OR (EventCode=5136
      ObjectClass="msDS-PasswordSettings")

      | where AttributeLDAPDisplayName="msDS-PasswordReversibleEncryptionEnabled" AND AttributeValue="TRUE"

      | table _time, SubjectUserName, ObjectDN, AttributeValue, ComputerName'
- question: Does an FGPP modification that enables reversible encryption occur outside an administrator's
    normal hours, exceed their normal edit frequency, or come from an account with no prior FGPP-management
    history?
  context: '[Defense Impairment] From a Defense Impairment perspective, enabling reversible password encryption
    silently degrades the trustworthiness of the credential store and weakens the one-way-hash protection
    defenders rely on, so detecting the change restores visibility into a covert weakening of authentication
    controls. This addresses the information requirement: "Is the adversary establishing persistence by
    modifying account properties for reversible encryption?" Evidence: A Fine-Grained Password Policy
    (FGPP) object is created (Event ID 5137) or modified (Event ID 5136) where the ''msDS-PasswordReversibleEncryptionEnabled''
    attribute is set to ''TRUE''. Maintain a per-administrator profile of FGPP modification frequency
    and time-of-day. Alert when the per-day count of FGPP edits enabling reversible encryption exceeds
    the moving mean + 3 standard deviations, when the edit occurs more than 2 sigma from the admin''s
    mean modification time, or when the modifying account is a first-seen actor with no FGPP-management
    history. These deviations distinguish a legitimate, routine policy change from opportunistic abuse
    of a powerful but rarely-used setting.'
  answer_sources:
  - Windows Event ID 5136
  - Windows Event ID 5137
  - 'NAI: Domain Controllers, SYSVOL Share'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=5136 ObjectClass="msDS-PasswordSettings" AttributeValue="TRUE"

      | eval hour=strftime(_time,"%H")

      | stats count as edits, values(hour) as hrs by SubjectUserName, date_mday

      | append [| inputlookup admin_fgpp_baseline]

      | where edits>mean_edits+3*std_edits OR abs(hour-mean_hour)>2*std_hour OR first_seen_actor=1'
- question: Does a supervised classifier score an FGPP modification (Event 5136) that sets 'msDS-PasswordReversibleEncryptionEnabled'=TRUE
    as high-risk based on actor, source workstation, timing, and changed attributes?
  context: '[Defense Impairment] From a Defense Impairment perspective, enabling reversible password encryption
    silently degrades the trustworthiness of the credential store and weakens the one-way-hash protection
    defenders rely on, so detecting the change restores visibility into a covert weakening of authentication
    controls. This addresses the information requirement: "Is the adversary establishing persistence by
    modifying account properties for reversible encryption?" Evidence: A Fine-Grained Password Policy
    (FGPP) object is created (Event ID 5137) or modified (Event ID 5136) where the ''msDS-PasswordReversibleEncryptionEnabled''
    attribute is set to ''TRUE''. Score each FGPP modification with a supervised classifier (e.g., Random
    Forest or Gradient Boosting) using features such as SubjectUserName, source workstation, time-of-day,
    day-of-week, and the set of changed attributes. A high-risk score for a change enabling reversible
    encryption indicates a likely malicious modification. The model captures combinations of weak signals
    (rare actor + off-hours + unusual host) that individual rules miss; emit the top-3 contributing features
    in the alert so an analyst can validate quickly.'
  answer_sources:
  - Windows Event ID 5136
  - Windows Event ID 5137
  - 'NAI: Domain Controllers, SYSVOL Share'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=rf_fgpp_classifier

      features=[SubjectUserName, src_workstation, hour, weekday, changed_attrs]

      | score events where EventCode=5136 AND changed_attrs CONTAINS "msDS-PasswordReversibleEncryptionEnabled=TRUE"

      | where risk_score>=threshold

      | output top3_features'
- question: For an account with reversible encryption enabled, is a password change (Event ID 4723) followed
    within five minutes by a successful interactive logon (Event ID 4624, Logon Type 2 or 10) from an
    external (non-RFC1918) IP address?
  context: '[Defense Impairment] From a Defense Impairment perspective, enabling reversible password encryption
    silently degrades the trustworthiness of the credential store and weakens the one-way-hash protection
    defenders rely on, so detecting the change restores visibility into a covert weakening of authentication
    controls. This addresses the information requirement: "Is the adversary establishing persistence by
    modifying account properties for reversible encryption?" Evidence: A successful authentication event
    (Windows Event ID 4624) occurs for an account with reversible encryption enabled, immediately following
    a password change (Windows Event ID 4723) or after a statistically significant period of account inactivity.
    Create a stateful rule that, for accounts already flagged with reversible encryption, alerts when
    a password change (4723) is followed within five minutes by a successful interactive logon (4624,
    Logon Type 2 or 10) from a non-RFC1918 source. The adversary objective once the flag is set is to
    recover the post-change plaintext, so a reset immediately followed by an external interactive logon
    is the tell-tale takeover sequence. Capture the source IP, logon type, and timing so the analyst can
    confirm whether the logon is consistent with legitimate user behavior.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4723
  - Zeek conn.log
  - 'NAI: Domain Controllers, Authentication Servers, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Security EventCode=4723 TargetUserName IN (reversible_accounts)

      | join type=inner TargetUserName [search EventCode=4624 LogonType IN (2,10) | where NOT cidrmatch("10.0.0.0/8",IpAddress)
      AND NOT cidrmatch("172.16.0.0/12",IpAddress) AND NOT cidrmatch("192.168.0.0/16",IpAddress)]

      | where logon_time-pwchange_time<=300

      | table _time, TargetUserName, IpAddress, LogonType'
- question: Does a reversible-encryption-flagged account authenticate (Event 4624) after an inactivity
    gap in the 99th percentile of its own time-between-logons baseline, especially preceded by a burst
    of failed logons?
  context: '[Defense Impairment] From a Defense Impairment perspective, enabling reversible password encryption
    silently degrades the trustworthiness of the credential store and weakens the one-way-hash protection
    defenders rely on, so detecting the change restores visibility into a covert weakening of authentication
    controls. This addresses the information requirement: "Is the adversary establishing persistence by
    modifying account properties for reversible encryption?" Evidence: A successful authentication event
    (Windows Event ID 4624) occurs for an account with reversible encryption enabled, immediately following
    a password change (Windows Event ID 4723) or after a statistically significant period of account inactivity.
    Model per-account time-between-logons from 4624 and alert when a flagged account authenticates after
    inactivity in the 99th percentile of its baseline. Jointly profile failed logons (4625) and Zeek conn.log
    S0/REJ rates; a burst of failures preceding the success strengthens the dormant-account-abuse hypothesis.
    Long-dormant accounts suddenly waking up are a classic sign of an attacker activating a staged credential,
    and the failure burst distinguishes brute-force/replay from a benign return-to-work logon.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4723
  - Zeek conn.log
  - 'NAI: Domain Controllers, Authentication Servers, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4624 TargetUserName IN (reversible_accounts)

      | streamstats current=f last(_time) as prev by TargetUserName

      | eval gap=_time-prev

      | eventstats perc99(gap) as p99 by TargetUserName

      | where gap>p99

      | join TargetUserName [search EventCode=4625 OR (source=zeek_conn conn_state IN ("S0","REJ")) |
      stats count as fails by TargetUserName | where fails>baseline+3*std]'
- question: Does a sequence model recognize the takeover chain [4738 enable reversible on User A] -> [4724/4723
    password reset on A] -> [4624 logon by A from a new host] within roughly 30 minutes?
  context: '[Defense Impairment] From a Defense Impairment perspective, enabling reversible password encryption
    silently degrades the trustworthiness of the credential store and weakens the one-way-hash protection
    defenders rely on, so detecting the change restores visibility into a covert weakening of authentication
    controls. This addresses the information requirement: "Is the adversary establishing persistence by
    modifying account properties for reversible encryption?" Evidence: A successful authentication event
    (Windows Event ID 4624) occurs for an account with reversible encryption enabled, immediately following
    a password change (Windows Event ID 4723) or after a statistically significant period of account inactivity.
    Use a sequence model (HMM or LSTM) over per-user event logs to recognize the causal chain of enabling
    reversible encryption, resetting the password, and then logging on from a new host within about 30
    minutes. Rank the resulting logon as an anomalous causal login path or low-probability edge using
    graph models (Hopper/CyberGraph). Output the top-3 features (sequence membership, new host, timing).
    A matched chain is high-confidence evidence of an end-to-end credential takeover rather than incidental
    administrative activity.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4723
  - Zeek conn.log
  - 'NAI: Domain Controllers, Authentication Servers, Internet Gateway'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=lstm_sequence input=per_user_event_logs(window=30m)

      | detect chain [4738_enable_reversible -> 4723|4724_pwreset -> 4624_logon_new_host] same TargetUserName

      | score logon as causal_path_anomaly via graph_edge_model

      | output top3_features(seq_membership,new_host,timing)'
- question: Has the 'Default Domain Policy' or 'Default Domain Controllers Policy' GPO been modified (Event
    5136 / domain-policy change Event 4739) to enable 'Store passwords using reversible encryption' (ClearTextPassword
    = 1 in GptTmpl.inf)?
  context: '[Defense Impairment] From a Defense Impairment perspective, enabling reversible password encryption
    silently degrades the trustworthiness of the credential store and weakens the one-way-hash protection
    defenders rely on, so detecting the change restores visibility into a covert weakening of authentication
    controls. This addresses the information requirement: "Is the adversary establishing persistence by
    modifying account properties for reversible encryption?" Evidence: The Group Policy Object (GPO) for
    ''Default Domain Policy'' or ''Default Domain Controllers Policy'' is modified to set ''Store passwords
    using reversible encryption'' to ''Enabled'', with the change originating from a source host or user
    account that does not typically perform GPO modifications. Monitor modification events (Event 5136
    and domain-policy change Event 4739) on the well-known GUIDs for the Default Domain Policy ({31B2F340-016D-11D2-945F-00C04FB984F9})
    and Default Domain Controllers Policy ({6AC1786C-016F-11D2-945F-00C04FB984F9}). On change, inspect
    the SYSVOL GptTmpl.inf for ''ClearTextPassword = 1'' and alert if reversible encryption is enabled.
    Enabling this at the domain level affects all accounts and is only legitimately required for legacy
    protocols, so it is a high-impact, high-signal event. Capture the actor and source host that performed
    the GPO edit.'
  answer_sources:
  - Windows Event ID 5136
  - Windows Event ID 4739
  - Zeek conn.log
  - 'NAI: Domain Controllers, SYSVOL Share, Administrative Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Security (EventCode=5136 OR EventCode=4739) ObjectDN IN ("*31B2F340-016D-11D2-945F-00C04FB984F9*","*6AC1786C-016F-11D2-945F-00C04FB984F9*")

      | union [| inputlookup sysvol_gpttmpl WHERE setting="ClearTextPassword" value=1]

      | table _time, SubjectUserName, ComputerName, ObjectDN, setting, value'
  - technology: Zeek/pseudocode
    query: '# correlate SYSVOL SMB write to GptTmpl.inf with the policy GUID path

      source=zeek_smb_files path="*\\Policies\\{31B2F340*}*GptTmpl.inf" action=write

      | table ts, id.orig_h, id.resp_h, name, path'
- question: Is a GPO modification enabling reversible encryption performed by a first-seen host or account,
    or does the daily count/entropy of source hosts modifying GPOs spike beyond the historical baseline?
  context: '[Defense Impairment] From a Defense Impairment perspective, enabling reversible password encryption
    silently degrades the trustworthiness of the credential store and weakens the one-way-hash protection
    defenders rely on, so detecting the change restores visibility into a covert weakening of authentication
    controls. This addresses the information requirement: "Is the adversary establishing persistence by
    modifying account properties for reversible encryption?" Evidence: The Group Policy Object (GPO) for
    ''Default Domain Policy'' or ''Default Domain Controllers Policy'' is modified to set ''Store passwords
    using reversible encryption'' to ''Enabled'', with the change originating from a source host or user
    account that does not typically perform GPO modifications. Profile the set of hosts and accounts that
    historically modify GPOs (5136) and alert on a first-seen host or user enabling reversible encryption.
    Additionally monitor the daily count and Shannon entropy of source hostnames modifying GPOs; a sharp
    entropy increase or count spike beyond mean + 3 sigma indicates anomalous activity. GPO editing is
    normally performed by a small, stable set of admins from a few hosts, so novelty and dispersion in
    that population are strong indicators of compromise.'
  answer_sources:
  - Windows Event ID 5136
  - Windows Event ID 4739
  - Zeek conn.log
  - 'NAI: Domain Controllers, SYSVOL Share, Administrative Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=5136 (GPO modification)

      | stats count as edits dc(SubjectUserName) as users by ComputerName, date_mday

      | eval entropy=shannon(ComputerName_distribution)

      | where first_seen(ComputerName)=1 OR first_seen(SubjectUserName)=1 OR edits>mean+3*std OR entropy>baseline_entropy+3*std'
