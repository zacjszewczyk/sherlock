name: 'T1556.005: Modify Authentication Process: Reversible Encryption'
id: 6fe5301a-8a6d-4cfd-9539-1bbe83e68e24
description: 'Investigate suspected abuse of Active Directory reversible password encryption (T1556.005),
  where an adversary enables the AllowReversiblePasswordEncryption / ADS_UF_ENCRYPTED_TEXT_PASSWORD_ALLOWED
  (0x80) property so that passwords created or changed afterward can be recovered in plaintext. This playbook
  helps an analyst hunt for the enabling action across every scope an adversary might use: per-user changes
  (Event ID 4738), Fine-Grained Password Policy objects (Events 5136/5137 with msDS-PasswordReversibleEncryptionEnabled),
  domain-level Group Policy edits (ClearTextPassword=1 in GptTmpl.inf), and PowerShell (Set-ADUser/Set-ADAccountControl
  -AllowReversiblePasswordEncryption). It then follows the attack chain to its payoff: forced password
  changes (4723), suspicious logons by staged or dormant accounts (4624/4625, Zeek conn.log), access to
  the G$MSRADIUSCHAPKEY LSA secret (4656/4663), directory replication / DCSync (4662), and credential-dumping
  tooling on Domain Controllers (4688/4104/Defender 1116). Detection methods span symbolic-logic rules,
  statistical baselining (dormancy, off-hours, rate and entropy anomalies), and machine learning (sequence
  models, classifiers, clustering, peer-group and graph-based provenance matching) so the activity can
  be caught as Defense Impairment, Persistence, and Credential Access.'
type: technique
