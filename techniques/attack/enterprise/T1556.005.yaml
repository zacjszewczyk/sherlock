    encryption?" Evidence: A directory service audit event (Windows Event ID 4738) shows that the ''UF_ENCRYPTED_TEXT_PASSWORD_ALLOWED''
    flag (0x80) has been added to a user''s ''User Account Control'' attribute, particularly for a high-privilege
    account. On Event 4738, bitwise-AND the old and new ''User Account Control'' values with 0x80 and
    alert when the old result is 0 and the new result is 128 (0x80). Escalate priority when the target
    account is a member of a privileged group, because weakening a high-value account dramatically raises
    impact. Given the Disabled-by-default policy, this transition is presumptively suspicious; capture
    the target''s group memberships to drive triage severity.'
  answer_sources:
