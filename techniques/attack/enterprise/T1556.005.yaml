- question: Does any PowerShell script block (Event ID 4104) set the reversible-encryption property, matching
    patterns like 'Set-ADUser ... -AllowReversiblePasswordEncryption $true' or 'Set-ADAccountControl ...
    -PasswordReversibleEncryption'?
  context: '[Defense Impairment] From a Defense Impairment perspective, enabling reversible password encryption
    silently degrades the trustworthiness of the credential store and weakens the one-way-hash protection
    defenders rely on, so detecting the change restores visibility into a covert weakening of authentication
    controls. This addresses the information requirement: "Is the adversary establishing persistence by
    modifying account properties for reversible encryption?" Evidence: A PowerShell script block log (Windows
    Event ID 4104) is observed containing script content that sets the ''AllowReversiblePasswordEncryption''
    property on an AD user object, especially if the script exhibits signs of obfuscation. Detect PowerShell
    script blocks (Event 4104) matching the regex /(Set-ADUser|Set-ADAccountControl).*-AllowReversiblePasswordEncryption\s+\$true/i
    and the Set-ADAccountControl -PasswordReversibleEncryption variant. Alert on any match, especially
    on Domain Controllers, because this scripted enable is the action that makes post-change plaintext
    recovery possible. Capture the full script block, the executing user, and the host so the analyst
    can assess intent and scope (single account vs. bulk enable).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Administrative Workstations, PowerShell Transcript Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:PowerShell EventCode=4104

      | regex ScriptBlockText="(?i)(Set-ADUser|Set-ADAccountControl).*-AllowReversiblePasswordEncryption\s+\$true"

      | append [search EventCode=4104 | regex ScriptBlockText="(?i)Set-ADAccountControl.*-PasswordReversibleEncryption"]

      | table _time, UserID, Computer, ScriptBlockText'
- question: Does a 4104 script block on a Domain Controller that references 'AllowReversiblePasswordEncryption'
    also exhibit high character entropy or a letter-frequency profile far from normal PowerShell, indicating
