    query: "// Statistical baselining for: Rare source-country/ASN IAM use\nFOR each principal, source_ip\
      \ OVER last 30-60d:\n  baseline = profile(api_call_counts, unique_paths, source_country, source_asn,\n\
      \                     accessdenied_rate, seen_api_actions, cli_entropy)\nEVALUATE current_window\
      \ AGAINST baseline:\n  alert IF first_seen_api_action(principal)\n     OR source_country/asn < 1st_percentile(historical)\n\
      \     OR modified_zscore(metric, MAD) > 3.5\n     OR unique_paths > 99th_percentile\n     OR accessdenied_ratio_high\
      \ DURING high_volume_burst\n  ESCALATE when concurrent audit logs show IAM/directory list calls\n\
      EMIT principal, source_ip, metric, score"
- question: 'Using statistical baselining, can you determine whether ''First-seen API action per principal''
    indicates cloud-account enumeration? Specifically: Maintain a per-principal lookback (e.g., 30-60
    days) of previously observed API actions over cloud audit logs and alert when an identity issues IAM/directory
