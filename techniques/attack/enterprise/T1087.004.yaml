questions:
- question: 'Using deterministic rule logic, can you determine whether ''IAM endpoint and audit IOC match''
    indicates cloud-account enumeration? Specifically: Encode provider-portable signatures matching cloud
    audit fields (CloudTrail eventSource=iam.amazonaws.com with eventName in ListUsers/ListRoles/GetAccountAuthorizationDetails/ListGroups;
    Azure operationName Microsoft.Graph/users/read and RoleManagement.Read.Directory; GCP iam.serviceAccounts.list
    and getIamPolicy; Okta user.read/group.read) using [SigmaHQ cloud rules](https://detection.fyi/sigmahq/sigma/cloud/aws/cloudtrail/aws_cloudtrail_ssm_malicious_usage/),
    [Elastic AWS detection rules](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws),
    and [Recorded Future cloud Sigma](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security).
    Correlate the source IP from Zeek conn.log/dns.log against threat-intel feeds of malicious/anonymizing
    infrastructure and alert on matches, emitting principal, tenant, API name, sourceIPAddress, and host
    context. Map identity-provider directory reads to concrete audit events per [Mandiant M365/Entra guidance](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/).'
  context: 'Tactic context (Discovery / TA0007): adversaries enumerate cloud accounts to map identities,
    roles, and privilege relationships before deciding how to act, pivot, or escalate. Evidence under
    investigation: Cloud-account discovery is visible when a principal enumerates users, roles, service
    principals, groups, or tenants through cloud control-plane APIs or CLI tools. The evidence usually
    consists of bursts of IAM or directory-listing calls from a source host or automation identity that
    normally does not inventory cloud principals. Approach (IAM endpoint and audit IOC match - Symbolic
    Logic): Encode provider-portable signatures matching cloud audit fields (CloudTrail eventSource=iam.amazonaws.com
    with eventName in ListUsers/ListRoles/GetAccountAuthorizationDetails/ListGroups; Azure operationName
    Microsoft.Graph/users/read and RoleManagement.Read.Directory; GCP iam.serviceAccounts.list and getIamPolicy;
    Okta user.read/group.read) using [SigmaHQ cloud rules](https://detection.fyi/sigmahq/sigma/cloud/aws/cloudtrail/aws_cloudtrail_ssm_malicious_usage/),
    [Elastic AWS detection rules](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws),
    and [Recorded Future cloud Sigma](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security).
    Correlate the source IP from Zeek conn.log/dns.log against threat-intel feeds of malicious/anonymizing
    infrastructure and alert on matches, emitting principal, tenant, API name, sourceIPAddress, and host
    context. Map identity-provider directory reads to concrete audit events per [Mandiant M365/Entra guidance](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/).
    A positive result means a principal, host, or source IP is listing cloud users/roles/service-accounts/groups
    in a pattern inconsistent with that entity''s normal behavior (e.g., never-before-seen enumeration
    API calls, rare source country/ASN, failure bursts, abnormal volume, or non-admin CLI usage); a negative
    result means the activity matches expected administrative or automation baselines. Investigate the
    named area of interest (Internet egress points, forward and reverse proxy servers, and enterprise
    DNS resolvers.) and pivot from any hit to the originating principal, tenant, source host, source IP,
    API names invoked, and any subsequent privilege-escalation, persistence, or collection activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - AWS CloudTrail logs
  - Azure AD Sign-In logs
  - Google Cloud Audit Logs
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Internet egress points, forward and reverse proxy servers, and enterprise DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: IAM endpoint and audit IOC match\nMATCH cloud_audit, host_proc,\
      \ net_conn WHERE\n  audit.eventName IN ['ListUsers','ListRoles','GetAccountAuthorizationDetails',\n\
      \                      'ListGroups','users.read','RoleManagement.Read.Directory',\n            \
      \          'iam.serviceAccounts.list','getIamPolicy','user.read','group.read']\n  OR cmdline MATCHES\
      \ /(aws iam list-users|list-roles|get-account-authorization-details|az ad user list|gcloud iam service-accounts\
      \ list|gcloud projects get-iam-policy|Get-MsolRoleMember|Get-Recipient|Get-Mailbox|Get-User)/\n\
      CORRELATE host_proc -> net_conn -> cloud_audit WITHIN 5m ON same host/principal\nENRICH source_ip\
      \ WITH geoip, threat_intel; ENRICH principal WITH directory_role/group\nWHERE principal NOT IN approved_cloud_admins\
      \ OR source_ip IN malicious_infra\nEMIT principal, tenant, apiName, sourceIPAddress, host"
- question: 'Using deterministic rule logic, can you determine whether ''Impossible-travel enumeration''
    indicates cloud-account enumeration? Specifically: Pair the sign-in that established the enumerating
    session with the prior sign-in for that principal and compute implied travel velocity from source-IP
    geodata and timestamps; alert when velocity is physically impossible per [Microsoft impossible-travel
    logic (WO2018085161A1)](https://patents.google.com/patent/WO2018085161A1/en), enriching with the IAM/directory
    list calls issued in the session.'
