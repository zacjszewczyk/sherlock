name: 'T1087.004: Cloud Account'
id: 14dafccf-2ad1-4934-8129-f8b564590324
description: 'This playbook helps an analyst investigate adversary enumeration of cloud accounts (T1087.004):
  attempts to list users, roles, service principals, groups, mailboxes, or tenant directory objects across
  IaaS, Identity Provider, Office Suite, and SaaS platforms. Cloud-account discovery becomes visible when
  a principal enumerates identities through control-plane APIs or CLI tools (e.g., aws iam list-users
  / list-roles / get-account-authorization-details, az ad user list, gcloud iam service-accounts list,
  gcloud projects get-iam-policy, Get-MsolRoleMember, Get-Recipient/Get-Mailbox/Get-User, and Microsoft
  Graph / Google Workspace / Okta SCIM directory reads). The playbook correlates cloud audit logs (AWS
  CloudTrail, Azure AD Sign-In / Activity, Google Cloud Audit, Microsoft Graph, Okta) with host process
  telemetry (Windows Event ID 4688, Sysmon Event ID 1, PowerShell 4104, Linux auditd, macOS Unified Log)
  and network telemetry (Zeek conn.log/dns.log/http.log) to surface bursts of IAM or directory-listing
  calls from sources or identities that do not normally inventory cloud principals. Investigative angles
  include provider-portable IOC matching of audit event names, impossible-travel session analysis, rare
  source-country/ASN and first-seen-API baselining, AccessDenied/403 failure-burst reconnaissance signals,
  IAM API volume thresholds and forecasting, CLI command-line regex and entropy, enumeration command-sequence
  (Markov) modeling, and correlation of cloud-CLI execution with IAM API connections by non-administrator
  users. Detection blends symbolic logic, statistical baselining, and machine learning (Isolation Forest,
  DBSCAN clustering, LSTM autoencoders, gradient boosting, and graph neural networks) to produce evasion-resistant,
  explainable alerts for the Discovery tactic.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
