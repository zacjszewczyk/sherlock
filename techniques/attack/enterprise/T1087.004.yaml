- question: 'Using statistical baselining, can you determine whether ''Rare source-country/ASN IAM use''
    indicates cloud-account enumeration? Specifically: Geolocate source IPs for cloud-account discovery
    and build a 30-day baseline of allowed source countries and ASNs per organization/business unit. Alert
    when a call originates from a country/ASN below the 1st percentile of historical frequency, or when
    a new principal/host suddenly issues large numbers of IAM/directory list calls; peer-group and infrequent-country
    baselines follow [Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)
    and [Defender for Cloud Apps anomaly policies](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy).'
