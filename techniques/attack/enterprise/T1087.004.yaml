- question: 'Using statistical baselining, can you determine whether ''AccessDenied enumeration failure
    burst'' indicates cloud-account enumeration? Specifically: Profile per-principal/per-source AccessDenied
    and 403 rates for IAM/directory calls as a distinct reconnaissance signal; baseline with the robust
    [modified Z-score (MAD, |Z|>3.5)](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    and alert on failure-rate spikes (e.g., a principal generating many AccessDenied list attempts while
    probing permissions), since enumeration by under-privileged credentials produces characteristic error
    bursts noted in [Splunk cloud content](https://research.splunk.com/cloud/).'
