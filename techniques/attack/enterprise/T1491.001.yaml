name: 'T1491.001: Internal Defacement'
id: 7c8d387a-66ed-4bd5-b460-6a334ddfb5c9
description: 'Investigate possible Internal Defacement (T1491.001), where an adversary alters internal-facing
  systems and content -- intranet/SharePoint/Confluence web pages, server login banners and message-of-the-day
  files, legal-notice text, or user desktop wallpapers -- to intimidate, mislead, or discredit the organization.
  Because internal defacement exposes adversary presence, it typically occurs after other intrusion goals
  are met, frequently following privilege escalation or web-shell deployment. This playbook helps an analyst
  hunt for: files written to web roots or endpoints whose hash/filename/content matches known defacement
  or web-shell signatures; structural DOM changes and anomalous payload entropy on published internal
  pages; command-line and PowerShell activity that edits wallpaper/legal-notice registry keys or overwrites
  web content (index.html, login.aspx) and Linux/ESXi banner files (/etc/motd, /etc/issue, /etc/vmware/welcome);
  anomalous volume, timing, source, and failure rates of file modifications and HTTP upload methods on
  internal web servers; and multi-stage behavioral sequences in which a process writes an image or web-shell
  file that is subsequently used to alter the visual interface or web content. Coverage spans Windows,
  Linux, macOS, and ESXi hosts using endpoint logs (Windows Event IDs, Sysmon, auditd, unified log, hostd)
  and network logs (Zeek http.log/files.log).'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Have any files (HTML, ASPX, PHP, JS, JPG, PNG) been written to internal web roots or endpoints
    whose SHA256 hash, filename, or inline HTML/JS body matches known defacement-tool, web-shell, or defacement-imagery
    signatures from threat-intelligence feeds, or whose hash deviates from the approved deployment manifest?
  context: 'Internal defacement is an Impact technique used to discredit systems and intimidate users,
    and it commonly relies on dropping known defacement pages, images, or web shells onto intranet, SharePoint/Confluence,
    file servers, or endpoints. Match the SHA256 of files captured by Windows Event ID 4663 and Zeek files.log,
    and inline page bodies from Zeek http.log, against curated YARA/IOC corpora ([signature-base (YARA
    and IOC rules)](https://github.com/Neo23x0/signature-base), [Mitigating Web Shells](https://github.com/nsacyber/Mitigating-Web-Shells)).
    Critically, enforce a known-good baseline diff of every web-root file using NSA Known-good/Get-FileHash
    against the approved deployment manifest and alert on ANY deviation. A positive match -- a known-bad
    hash or an off-manifest file -- is high-confidence evidence of defacement or web-shell staging; a
    clean comparison against an authoritative manifest provides strong assurance content is unaltered.
    (Detection method: Symbolic Logic. Tactic: Impact.)'
  answer_sources:
  - Windows Event ID 4663
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Internal Web Servers (e.g., SharePoint, Confluence, Intranet), File Servers, Endpoint Desktops'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=win EventCode=4663 ObjectName IN ("*\\inetpub\\wwwroot\\*","*\\wwwroot\\*","*Desktop*.jpg","*Desktop*.png")

      | eval sha256=file_hash

      | lookup defacement_ioc_sha256 sha256 OUTPUT verdict

      | lookup deployment_manifest path AS ObjectName OUTPUT approved_sha256

      | where verdict="malicious" OR (isnotnull(approved_sha256) AND sha256!=approved_sha256)'
  - technology: Zeek/pseudocode
    query: "files.log: where mime_type in (text/html, image/*, application/x-php)\n| compute sha256\n\
      | join http.log on fuid\n| where sha256 in known_defacement_hashes\n   OR regex_match(http.body,\
      \ yara_webshell_patterns)\n| emit src=id.orig_h, host=http.host, uri=http.uri, sha256"
- question: Does the live DOM of any published internal web page differ structurally from its maintained
    baseline signature beyond a tuned threshold (e.g., >10% weighted node change outside known dynamic
    regions), and was the change accompanied by writes to index.html/login.aspx by non-deployment processes?
  context: 'Defacement often rewrites the visible structure of an internal page rather than simply swapping
    a single asset. Maintaining a weighted DOM signature per published page and recomputing it on change
    ([HDNA: A graph-based change detection in HTML pages](https://arxiv.org/abs/2310.03891)) lets you
    quantify structural disparity and alert when it exceeds a tuned threshold outside expected dynamic
    regions. Pair this with [Sigma](https://github.com/SigmaHQ/sigma) file-event rules that fire
    on writes to index.html or login.aspx by processes outside the deployment pipeline. A large structural
    disparity score combined with an unauthorized writer strongly indicates defacement; small, dynamic-region-only
    changes are expected churn and should be tuned out. (Detection method: Symbolic Logic. Tactic: Impact.)'
  answer_sources:
  - Windows Event ID 4663
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Internal Web Servers (e.g., SharePoint, Confluence, Intranet), File Servers, Endpoint Desktops'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each published_page p:\n  current_sig = weighted_dom_signature(fetch(p))\n  disparity\
      \ = graph_diff(current_sig, baseline_sig[p], ignore=dynamic_regions[p])\n  if disparity > 0.10:\n\
      \     join file_events where path=p.localpath AND process NOT IN deployment_allowlist\n     alert(page=p,\
      \ disparity=disparity, writer=process)"
- question: Does the byte entropy of any file or HTTP payload written to an internal web endpoint fall
    outside the service-specific normal band -- above ~7.0 (indicating an obfuscated/packed payload or
    web shell) or below ~4.0 (indicating a crude text-only banner/page replacement)?
  context: 'Entropy is a fast, model-light triage signal for defacement and web-shell content. Establish
    per-endpoint baseline entropy bands from historical traffic/files, then flag readings >7.0 (packed/encrypted/obfuscated
    payloads typical of malicious uploads) or <4.0 (plain-text-only replacements typical of crude defacement
    banners). Report the measured entropy, the endpoint baseline, and the file size as the top-3 triage
    features. High entropy on a normally low-entropy HTML endpoint, or anomalously low entropy where rich
    content is expected, both warrant investigation; readings inside the learned band are normal. Method
    and service-specific bands per [Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989)
    and [Baseline Payload Entropy Values for Common Internet Services](https://www.mdpi.com/1999-5903/16/12/470).
    (Detection method: Statistical Method. Tactic: Impact.)'
  answer_sources:
  - Windows Event ID 4663
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Internal Web Servers (e.g., SharePoint, Confluence, Intranet), File Servers, Endpoint Desktops'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each write/upload to web_endpoint e (Zeek files.log, WinEventCode=4663):\n  H = shannon_entropy(file_bytes)\n\
      \  base = entropy_baseline[e]   // service-specific band\n  if H > 7.0 OR H < 4.0:\n     alert(endpoint=e,\
      \ entropy=H, baseline=base, file_size=size)\n  // top-3 triage features: entropy, baseline, file_size"
- question: When new files or Zeek http.log response bodies are scored by a multi-language web-shell/defacement
    source-code classifier (e.g., CodeBERT / deep-learner model), do any exceed the malicious-content
    threshold, and what top-3 tokens or features drive the score?
  context: 'Signature and entropy checks miss novel or lightly obfuscated web shells and defacement pages.
    A multi-language source-code classifier (CodeBERT or deep-learner models) scores new files and HTTP
    response bodies for web-shell/defacement characteristics, generalizing beyond exact IOCs while acknowledging
    documented obfuscation-generalization limits. Surface the top-3 contributing tokens/features so an
    analyst can validate the verdict. A high classifier score on a file freshly written to a web root
    is strong evidence of malicious content supporting defacement; treat results as a prioritization aid
    alongside hash, DOM, and entropy signals rather than a sole arbiter. Models and obfuscation-generalization
    limits per [A deep learner model for multi-language webshell detection](https://link.springer.com/article/10.1007/s10207-022-00615-5),
    [Webshell Detection Based on CodeBERT and Deep Learning](https://dl.acm.org/doi/10.1145/3638782.3638788),
    and [Research and application of artificial intelligence based webshell detection model: A literature
    review](https://arxiv.org/abs/2405.00066). (Detection method: Machine Learning. Tactic: Impact.)'
  answer_sources:
  - Windows Event ID 4663
  - Zeek files.log
  - Zeek http.log
  - 'NAI: Internal Web Servers (e.g., SharePoint, Confluence, Intranet), File Servers, Endpoint Desktops'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = load(\"codebert_webshell_defacement_classifier\")\nfor each new_file f and http.log\
      \ response_body b:\n  score, feats = model.predict_proba(tokenize(f|b))\n  if score > webshell_threshold:\n\
      \     alert(path=f.path, score=score, top_tokens=top3(feats))"
- question: Did any command-line or PowerShell activity directly modify UI elements (desktop wallpaper,
    legal-notice/login banner registry keys) or overwrite web content files, e.g. reg.exe/Set-ItemProperty
    editing HKCU\Control Panel\Desktop\Wallpaper or HKLM...LegalNoticeText/LegalNoticeCaption, or cmd/powershell/reg/curl/certutil
    copying/echoing into C:\inetpub\wwwroot\index.html, /var/www/html/index.html, /etc/motd, /etc/issue,
    or /etc/vmware/welcome from non-deployment processes?
  context: 'This is the most direct behavioral evidence of internal defacement on Windows, Linux, and
    ESXi. Watch Windows Event ID 4688 process-creation and Event ID 4104 PowerShell script-block logs
    for commands that edit the wallpaper or legal-notice registry values, or that copy/move/echo/Invoke-WebRequest
    content into web roots, executed by processes outside the approved deployment/services list. On Linux
    and ESXi, watch auditd and hostd for writes to banner files (/etc/motd, /etc/issue, /etc/vmware/welcome)
    per [Mitigating Web Shells](https://github.com/nsacyber/Mitigating-Web-Shells). Translate and codify
    rules with [Sigma](https://github.com/SigmaHQ/sigma). A wallpaper/legal-notice edit or web-root overwrite
    by an interactive shell or unexpected tool is high-fidelity; legitimate deployment tooling and GPO-driven
    changes should be allow-listed. (Detection method: Symbolic Logic. Tactic: Impact.)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers (for login messages), All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "(EventCode=4688 OR EventCode=4104)\n| where (CommandLine matches \"reg(.exe)? .*HKCU\\\\\\\
      \\Control Panel\\\\\\\\Desktop.*Wallpaper\"\n     OR CommandLine matches \"Set-ItemProperty .*(Wallpaper|LegalNoticeText|LegalNoticeCaption)\"\
      \n     OR CommandLine matches \"HKLM\\\\\\\\.*Policies\\\\\\\\System\\\\\\\\LegalNotice(Text|Caption)\"\
      \n     OR CommandLine matches \"(copy|move|echo|Invoke-WebRequest|curl|certutil).*(inetpub\\\\\\\
      \\wwwroot\\\\\\\\index\\\\.html|/var/www/html/index\\\\.html)\")\n| where ParentImage NOT IN deployment_allowlist"
  - technology: auditd/pseudocode
    query: "auditd SYSCALL (open/write/unlink, execve)\n| where path in (\"/etc/motd\",\"/etc/issue\"\
      ,\"/var/www/html/index.html\",\"/etc/vmware/welcome\")\n  AND exe NOT IN deployment_allowlist\n\
      | correlate with prior sudo/su (linux:syslog)\n| alert(host, path, exe, uid)"
- question: Across per-host baselines of Windows Event ID 4688 parent-child process pairs and their counts/minute,
    has a new or statistically anomalous chain (>+3 sigma, or count baseline ~0) appeared in which a user
    application spawns a shell that immediately issues registry edits or file copies to UI/web paths?
  context: 'Defacement commands rarely appear in isolation -- they usually descend from an anomalous process
    lineage (e.g., a browser, Office app, or web service spawning cmd/powershell that then writes to web/UI
    paths). Build per-host baselines of 4688 parent-child pair frequencies and counts/min using the explainable
    mean+k*sigma method in [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf),
    then alert when a chain is brand new (count baseline ~0) or exceeds +3 sigma.
    Include the count, k-sigma value, and the parent-child pair as the top-3 explanation fields. Novel
    high-deviation chains targeting UI/web modification are suspicious; well-established deployment lineages
    will sit inside baseline. (Detection method: Statistical Method. Tactic: Impact.)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers (for login messages), All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from EventCode=4688

      | stats count by host, ParentImage, Image, bin(_time,1m)

      | eventstats mean(count) AS mu, stdev(count) AS sd by host, ParentImage, Image

      | where (mu==0) OR count > mu + 3*sd

      | where Image in (cmd.exe,powershell.exe,reg.exe) AND child writes UI/web path

      | table host, ParentImage, Image, count, ksigma=(count-mu)/sd'
- question: Were there blocked or denied modification attempts -- Windows Event ID 4663 access-denied
    / 4656 failure audits on web-root or UI paths, web-server 403/500 responses in Zeek http.log, or failed
    reg/icacls permission errors -- that preceded a successful overwrite of web content or UI configuration?
  context: 'Defacement frequently follows repeated denied attempts as the adversary probes permissions
    before succeeding. Treat blocked/denied modifications as a distinct, valuable signal: correlate 4663
    access-denied and 4656 failure audits, HTTP 403/500 on web-root paths from Zeek http.log, and failed
    reg/icacls permission errors. Raise priority when a cluster of failed writes is followed by a successful
    change to the same path or key. A failure-then-success pattern is a strong indicator of an actor escalating
    toward a defacement objective; isolated, unrelated failures are common and lower priority. (Detection
    method: Symbolic Logic. Tactic: Impact.)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers (for login messages), All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "denied = search (EventCode=4663 AccessMask=denied) OR (EventCode=4656 Keywords=AuditFailure)\n\
      \           OR (Zeek http.log status_code IN (403,500) AND uri in web_root_paths)\n           OR\
      \ (reg/icacls error)\nsuccess = search write_success on same path/key\n| transaction host, target\
      \ maxspan=10m\n| where denied_count>0 AND success AFTER denied\n| raise_priority(host, target, denied_count)"
- question: 'When each Windows Event ID 4688 and PowerShell Event ID 4104 command line is scored by a
    trained classifier (features: command length, keywords like copy/reg add/Set-ItemProperty/Invoke-WebRequest,
    target paths such as C:\inetpub\wwwroot or /var/www/html and wallpaper/legal-notice keys, and encoding/entropy),
    do any exceed the defacement threshold?'
  context: 'Rule-based detection of defacement commands can be evaded with obfuscation or unusual syntax.
    A trained command-line classifier generalizes by learning from features -- command length, defacement-relevant
    keywords, target paths (web roots, wallpaper/legal-notice registry keys), and encoding/entropy of
    the argument string ([Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989))
    -- to score each 4688/4104 event. Surface the top-3 driving features for analyst
    validation. A high score on a command touching web roots or UI keys complements the symbolic rule
    and catches obfuscated variants; treat as prioritization alongside lineage and failure-state context.
    (Detection method: Machine Learning. Tactic: Impact.)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers (for login messages), All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = load(\"cmdline_defacement_classifier\")\nfor each evt in (4688, 4104):\n  feats =\
      \ features(len(cmd), keywords[copy,reg add,Set-ItemProperty,Invoke-WebRequest],\n              \
      \     target_paths[inetpub\\\\wwwroot,/var/www/html,Wallpaper,LegalNotice],\n                  \
      \ encoding_entropy(cmd))\n  score = model.predict(feats)\n  if score > defacement_threshold: alert(cmd,\
      \ score, top3(feats))"
- question: Were any watchlisted critical files -- index.html, login.aspx, web.config, desktop-image paths,
    /etc/motd, /etc/issue -- created or modified (Windows Event ID 4663 / Sysmon Event ID 11 FileCreate)
    by a process or account outside the approved deployment/services list and inconsistent with the NSA
    known-good baseline?
  context: 'A focused watchlist of the specific files defacement targets gives high signal-to-noise. Monitor
    4663 and Sysmon Event ID 11 (FileCreate, configured per [Sysmon Community Guide: File Create](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/file-create.md))
    for writes to index.html, login.aspx, web.config, desktop-image paths, and Linux banner files, and
    alert when the writing process or account is not on the approved deployment/services allow-list, validated
    against the NSA known-good baseline in [Mitigating Web Shells](https://github.com/nsacyber/Mitigating-Web-Shells).
    An off-list writer touching a critical web/UI file is strong evidence of tampering; approved CI/CD
    or service accounts
    performing expected updates are normal and should be excluded. (Detection method: Symbolic Logic.
    Tactic: Impact.)'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4663
  - 'NAI: Internal Web Server file systems (e.g., C:\inetpub\wwwroot), Network traffic segments leading
    to internal web servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "(EventCode=4663 OR (EventCode=11 source=Sysmon))\n| where TargetFilename in watchlist(index.html,\
      \ login.aspx, web.config,\n        desktop_image_paths, /etc/motd, /etc/issue)\n| where (Process\
      \ NOT IN deployment_allowlist OR SubjectUser NOT IN service_accounts)\n| validate_against known_good_baseline\n\
      | alert(host, TargetFilename, Process, SubjectUser)"
- question: Does the per-server volume of file modifications (Windows Event ID 4663) and Zeek http.log
    POST/PUT activity (byte counts and request counts/hour) exceed +3 sigma of its day/hour moving-average
    baseline derived from 30+ days of history?
  context: 'Mass or off-hours defacement produces a burst of file modifications and content-upload requests
    that stands out against a server''s normal rhythm. Aggregate 4663 modifications and Zeek http.log
    POST/PUT byte/request counts per server, compute per day/hour moving averages and standard deviations
    over 30+ days, and alert when counts exceed +3 sigma per [Finding Anomalies in Windows Event Logs Using
    Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf). Name the
    time bucket, the count, and the sigma
    value in the alert. A sudden spike -- especially outside business hours -- on an internal web server
    is a hallmark of bulk defacement; steady within-baseline activity is routine. (Detection method: Statistical
    Method. Tactic: Impact.)'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4663
  - 'NAI: Internal Web Server file systems (e.g., C:\inetpub\wwwroot), Network traffic segments leading
    to internal web servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from (EventCode=4663 modifications) + (Zeek http.log method IN (POST,PUT))

      | stats count AS c, sum(bytes) AS b by server, bin(_time,1h)

      | eventstats avg(c) AS mu, stdev(c) AS sd by server, hour_of_day, day_of_week

      | where c > mu + 3*sd     // baseline from 30+ days

      | table server, bucket=_time, count=c, sigma=(c-mu)/sd'
- question: Are file/content modifications on internal web servers coming from rare source IPs or user
    accounts (outside the top 95% of historical modifiers, or below the 1st-percentile rate), and is there
    a spike in failed/denied writes (4663 access-denied, HTTP 403/500) preceding a successful change?
  context: 'The identity and reliability of who modifies content matters as much as how much. Track modifier
    distributions by source IP and user account and the success/fail ratio of writes; flag actors outside
    the historical top 95% of modifiers, those whose rate falls below the 1st percentile, and spikes in
    failed/denied writes that precede a successful change, using the k-sigma baselining in [Finding Anomalies
    in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
    A previously-unseen
    account or IP modifying web content -- particularly after a burst of permission denials -- is a strong
    defacement indicator; established deployment identities operating normally are expected. (Detection
    method: Statistical Method. Tactic: Impact.)'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4663
  - 'NAI: Internal Web Server file systems (e.g., C:\inetpub\wwwroot), Network traffic segments leading
    to internal web servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from modifications by src_ip, user

      | eventstats perc95(modifier_rank), perc1(rate)

      | where modifier outside top95% OR rate < p1

      | join failed_writes (4663 denied, http 403/500) preceding success

      | where fail_spike AND success_after

      | alert(src_ip, user, fails, success)'
- question: When an Isolation Forest or autoencoder is trained on Zeek http.log, Zeek files.log, and Windows
    Event ID 4663 features (source IP, user agent, account, file extension, file size, process name, HTTP
    method, hour-of-day), do any content-modification events score as anomalous, and what top-3 features
    explain the score?
  context: 'Multivariate anomalies in how internal web content is modified -- unusual combinations of
    source IP, user agent, account, file type/size, process, HTTP method, and time of day -- can reveal
    defacement that no single rule catches. Train an [Isolation Forest](https://doi.org/10.1145/2133360.2133363)
    or autoencoder on these features and alert when anomaly/reconstruction scores exceed thresholds, choosing
    the model per the latency/complexity trade-off in [Isolation Forest vs. Autoencoders for Zero-Day Network
    Attack Detection](https://ieeexplore.ieee.org/document/10143005/), and surface the top-3 contributing
    features. A high anomaly score on a content-write event
    points the analyst to investigate; tune thresholds against normal deployment behavior to control false
    positives. (Detection method: Machine Learning. Tactic: Impact.)'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4663
  - 'NAI: Internal Web Server file systems (e.g., C:\inetpub\wwwroot), Network traffic segments leading
    to internal web servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = features(Zeek http.log + files.log + 4663:\n      src_ip, user_agent, account, file_ext,\
      \ file_size, process, http_method, hour)\nmodel = IsolationForest() | Autoencoder()   // pick per\
      \ latency/complexity\nscore = model.anomaly_score(X)\nif score > threshold: alert(event, score,\
      \ top3_features(X))"
- question: Within a 60-second window on the same host, did Windows Event ID 4663 / Sysmon Event ID 11
    record creation of an image or web file (.jpg, .png, .aspx, .php) by an unapproved process, followed
    by Windows Event ID 4688 logging a subsequent process that references that file path to modify UI
    registry keys or overwrite web content?
  context: 'Defacement is often a two-step act: first stage the asset (image or web shell), then apply
    it to the visible interface or web content. Correlate, within a 60-second window on one host, a file-create
    of an image/web file by an unapproved process (4663 / Sysmon 11) with a subsequent 4688 process that
    references that exact file path to edit UI registry keys or overwrite web content. Codify the chain
    with [Sigma](https://github.com/SigmaHQ/sigma) and validate the written content against [signature-base
    (YARA and IOC rules)](https://github.com/Neo23x0/signature-base). The linked write-then-apply
    sequence is high-fidelity evidence of defacement; independent, unrelated file events are not. (Detection
    method: Symbolic Logic. Tactic: Impact.)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek files.log
  - 'NAI: User workstations, Terminal servers (e.g., Citrix), Internal web and application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "create = (EventCode=4663 OR Sysmon 11) where ext in (.jpg,.png,.aspx,.php)\n         AND Process\
      \ NOT IN deployment_allowlist\napply  = EventCode=4688 where CommandLine references create.TargetFilename\n\
      \         AND (modifies UI registry key OR overwrites web content)\n| transaction host maxspan=60s\
      \ [create -> apply]\n| validate create.file against signature-base YARA\n| alert(host, file, create.Process,\
      \ apply.CommandLine)"
- question: Across the estate, do any three-event sequences (e.g., download -> file write -> registry/UI
    edit) occur with anomalously high Pointwise Mutual Information or exceed per-host k-sigma frequency
    baselines, indicating a rare but tightly-coupled defacement workflow?
  context: 'Defacement workflows form characteristic event triples (download, write, UI/registry edit)
    that, while individually common, are rare and strongly associated when chained. Measure prevalences
    of three-event sequences and compute Pointwise Mutual Information across the estate, alerting when
    a rare sequence exceeds normal PMI thresholds, and combine with per-host k-sigma frequency baselines
    from [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
    Report the offending sequence and its rarity. A high-PMI, low-frequency defacement triple on a host
    is suspicious; common, expected sequences score low and are filtered out. (Detection method: Statistical
    Method. Tactic: Impact.)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek files.log
  - 'NAI: User workstations, Terminal servers (e.g., Citrix), Internal web and application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'build triples (e1->e2->e3) e.g. download->write->reg/UI edit

      | compute PMI(triple) = log( p(e1,e2,e3) / (p(e1)p(e2)p(e3)) )

      | eventstats k-sigma freq baseline per host

      | where PMI > pmi_threshold AND freq rare

      | report(host, sequence, pmi, rarity)'
