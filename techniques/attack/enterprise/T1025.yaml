questions:
- question: Did any process execute directly from a removable-media path (a USB/optical volume) whose
    image hash or filename matches known-malicious threat-intelligence indicators or otherwise appears
    to be unsigned, suspicious tooling staged on detachable storage?
  context: In the Collection phase, adversaries frequently stage and run tooling directly from USB or
    optical media to avoid touching monitored disk locations. Detect drive-arrival events (Windows 6416/2003,
    macOS USBMSC mounts, auditd/journald mount events) and then look for process execution whose Image
    path begins with the removable volume (Sysmon 1 / Event 4688; auditd execve from /media or /mnt; macOS
    process_events from /Volumes). Match the image hash and name against threat-intelligence indicators,
    and correlate the execution to a device insertion within a tight window (<=10 min). A positive result
    is an unsigned binary or non-admin execution from removable media on a sensitive host shortly after
    insertion; this is high-confidence malicious staging. Negative results are common for benign portable
    apps, so weight signer trust and host role. Copy/collection command templates can be derived from
    labeled USB scenarios in the CERT Insider Threat Test Dataset.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 6416
  - 'NAI: Endpoints (desktops, laptops) with USB ports, physical servers with USB access, and virtual
    machine hosts with USB passthrough enabled.'
  range: Last 90 days; correlate device-insertion and execution within a <=10 minute window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: drive = events WHERE EventCode IN (6416,2003) OR mount_event(/media,/mnt) OR usb_mount(USBMSC);
      proc = process_creation WHERE Image MATCHES '^(removable_volume|/media/|/mnt/|/Volumes/)'; JOIN
      drive, proc ON host AND |proc.time - drive.time| <= 10m; ALERT WHERE proc.hash IN ti_indicators
      OR (proc.signed = false AND host.role = 'sensitive')
- question: Among executables that ran from removable media, which ones are rare across the fleet (low
    host prevalence) or first-seen on a critical asset, marking them as anomalous binaries worth prioritizing?
  context: During Collection, novel or rarely seen executables running from removable media are disproportionately
    likely to be adversary tooling. Compute each removable-origin binary's prevalence across the fleet
    and per host, plus its signer trust, and prioritize low-prevalence (e.g., <0.5% of hosts) or first-seen-on-a-critical-asset
    binaries. This frequency/prevalence baselining mirrors the round-robin approach used to defend Office
    365 and the prevalence concept from F-Secure. A positive result is a binary seen on only one or two
    hosts, freshly introduced via USB; a negative result is a widely deployed, signed utility. Tune the
    percentile cutoff from your own rolling 30-day distribution rather than a fixed global value.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 6416
  - 'NAI: Endpoints (desktops, laptops) with USB ports, physical servers with USB access, and virtual
    machine hosts with USB passthrough enabled.'
  range: Last 90 days; build prevalence from a rolling 30-day baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: FROM removable_proc COMPUTE host_prevalence = count(distinct host) / total_hosts, first_seen
      = min(time) GROUP BY image_hash; ALERT WHERE host_prevalence < 0.005 OR (first_seen within 30d AND
      host.role='critical'); cutoff = percentile(prevalence_dist_30d, 1)
- question: When removable-origin process events are scored by an unsupervised outlier model using lineage,
    command tokens, signer metadata, and host role, which executions are flagged as high-risk outliers
    — and what are the top contributing features?
  context: For Collection, manually enumerating every removable execution is impractical, so an unsupervised
    outlier model (e.g., Isolation Forest) can score events using process lineage, command-line tokens,
    signer metadata, and host role. The model surfaces the most anomalous executions and should report
    the top-3 contributing features (low prevalence, unsigned, removable path) so an analyst can judge
    the alert quickly. Prioritize high-risk predictions that coincide with sensitive file access. A positive
    result is a high anomaly score driven by interpretable features on a sensitive host; treat low-score,
    well-explained-as-benign events as noise. The model complements, not replaces, the symbolic and statistical
    detections.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 6416
  - 'NAI: Endpoints (desktops, laptops) with USB ports, physical servers with USB access, and virtual
    machine hosts with USB passthrough enabled.'
  range: Last 90 days; train/score over a rolling 30-day window.
  queries:
  - technology: ML/pseudocode
    query: features = [host_prevalence, signer_trust, removable_path_flag, cmd_tokens, parent_image, host_role];
      model = IsolationForest(features over 30d); score = model.predict(removable_proc); ALERT WHERE score
      in top outliers; EMIT top_3_features(score); boost WHERE coincides_with(sensitive_file_access)
- question: Was a removable-media executable launch followed shortly afterward by credential-access activity
    (LSASS targeting, browser credential-store reads, or token manipulation) on the same host, suggesting
    an intrusion chain rather than benign USB use?
  context: Collection from removable media is often a precursor to deeper intrusion. Correlating a removable-media
    executable launch with follow-on credential-access behavior on the same host — LSASS handle/access
    attempts, reads of browser credential stores, or token manipulation — using path-based causal linking
    (as in Hopper) helps distinguish a real intrusion chain from benign USB activity. A positive result
    is a removable launch causally connected to credential theft within a short window, which should escalate
    immediately. A negative result (no credential-access follow-on) lowers priority but the removable
    execution may still warrant review.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 6416
  - 'NAI: Endpoints (desktops, laptops) with USB ports, physical servers with USB access, and virtual
    machine hosts with USB passthrough enabled.'
  range: Last 90 days; correlate credential-access follow-on within ~30 minutes of removable execution.
  queries:
  - technology: SIEM/Rule pseudocode
    query: rm_exec = removable_proc; cred = events WHERE lsass_access(4656/Sysmon10) OR browser_credstore_read
      OR token_manipulation; JOIN rm_exec, cred ON host AND user AND cred.time BETWEEN rm_exec.time AND
      rm_exec.time+30m; ALERT path_causal_link(rm_exec -> cred)
- question: Were there blocked or access-denied execution attempts from a newly mounted removable device
    (AppLocker/WDAC denials, Event 4656/4663 access-denied, auditd EACCES on execve), especially a burst
    of failed-then-successful launches indicating probing?
  context: In the Collection phase, attackers probing a newly inserted device often trigger denials before
    succeeding. Treat blocked/denied launches from removable media (AppLocker/WDAC denials, Event 4656/4663
    access-denied, auditd EACCES on execve) as a distinct signal independent of any hash match. A burst
    of failed-then-successful execution attempts from a freshly mounted device indicates active probing
    and should escalate on its own. A positive result is a tight cluster of denials immediately followed
    by a successful launch; isolated single denials are usually benign policy enforcement.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 6416
  - 'NAI: Endpoints (desktops, laptops) with USB ports, physical servers with USB access, and virtual
    machine hosts with USB passthrough enabled.'
  range: Last 90 days; cluster failed-then-successful attempts within a tight window (<=10 min) of device
    mount.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'deny = events WHERE applocker_wdac_denial OR EventCode IN (4656,4663) AND access=''denied''
      OR auditd_execve_EACCES; mount = recent_removable_mount(host); WITHIN 10m OF mount: ALERT WHERE
      count(deny) >= N AND exists(success_exec AFTER deny burst)'
- question: Did a copy, archive, or transfer utility (copy, robocopy, xcopy, cp, rsync, tar, Copy-Item,
    Compress-Archive) move content FROM a removable-media path TO a local staging folder or network share,
    particularly with recursion flags, wildcard sweeps, or sensitive-extension targeting?
  context: During Collection, the core action is moving files off removable media into staging. Detect
    copy/transfer command patterns that reference a removable source and a local or network destination
    (copy, robocopy, xcopy, cp, rsync, tar, Copy-Item, Compress-Archive), adapting public Sigma/Elastic
    rules for suspicious command-shell and PowerShell patterns. Escalate on recursion flags (/s, /e, -r,
    -Recurse), wildcard sweeps, and sensitive file-extension targeting. A positive result is a recursive,
    wildcard copy from a USB drive into a temp/staging directory or share; a negative result is a single
    deliberate file copy. Tie matches back to process lineage and user session.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - Windows Event ID 4663
  - 'NAI: Endpoints (desktops, laptops) with USB ports, and command-line/scripting log collection infrastructure.'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: proc = process_creation OR ps_scriptblock(4104) WHERE CommandLine MATCHES /(copy|robocopy|xcopy|cp|rsync|tar|Copy-Item|Compress-Archive)/
      AND src MATCHES removable_path AND dst MATCHES (local_staging|network_share); ALERT WHERE CommandLine
      MATCHES /(\/s|\/e|-r|-Recurse|\*)/ OR dst_ext IN sensitive_exts
- question: Does any user's removable-media copy activity — measured by bytes copied, file-count velocity,
    and destination diversity — exceed their normal 95th/99th-percentile baseline, or occur during off-hours,
    consistent with a data-theft burst?
  context: Collection by an insider or intruder shows up as abnormal copy volume from removable media.
    Baseline per-user removable copy volume (bytes), file-count velocity (files/min), and destination
    diversity, then flag 95th/99th-percentile deviations and off-hours spikes; insider data theft manifests
    as exactly these removable-copy bursts and off-hours device activity. Derive thresholds from rolling
    30-day per-user distributions, not fixed global values. A positive result is a user copying far more
    (or far faster, or to far more destinations) than their own history during odd hours; a negative result
    tracks their normal pattern.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - Windows Event ID 4663
  - 'NAI: Endpoints (desktops, laptops) with USB ports, and command-line/scripting log collection infrastructure.'
  range: Last 90 days; thresholds from rolling 30-day per-user distributions.
  queries:
  - technology: SIEM/Stats pseudocode
    query: FROM removable_copy GROUP BY user, day COMPUTE bytes, files_per_min, dest_diversity; base =
      rolling_30d_distribution(user); ALERT WHERE bytes > p99(base) OR files_per_min > p95(base) OR offhours(time)
- question: When copy-command lines from removable media are embedded and scored by an unsupervised anomaly
    model, which commands are atypical — and which tokens (drive letter, recursion flag, archive target)
    make them stand out?
  context: For Collection, attacker copy commands often differ subtly from a user's habitual command lines.
    Embed copy-command lines (e.g., BERT-style command-line embeddings) and apply unsupervised outlier
    scoring (COPOD/Isolation Forest/autoencoder) to flag atypical commands, reporting the top-3 atypical
    tokens (removable drive letter, recursion flag, archive target). A positive result is a high outlier
    score whose explanatory tokens point to bulk removable copying; a negative result is a command that
    matches the user's established style. This catches obfuscated or unusual copy syntax that static regex
    may miss.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - Windows Event ID 4663
  - 'NAI: Endpoints (desktops, laptops) with USB ports, and command-line/scripting log collection infrastructure.'
  range: Last 90 days; score against a rolling 30-day command baseline.
  queries:
  - technology: ML/pseudocode
    query: vec = bert_embed(copy_command_line); model = COPOD_or_IsolationForest(vec over 30d); score
      = model.score(vec); ALERT WHERE score > threshold; EMIT top_3_atypical_tokens(drive_letter, recursion_flag,
      archive_target)
- question: Is the ratio of denied-to-allowed file copy/read operations during removable access unusually
    high for a user or session, indicating broad scripted enumeration hitting permission boundaries even
    when successful copies are modest?
  context: In Collection, scripted enumeration sweeping a removable device commonly hits files the user
    cannot access, producing denials. Profile copy/read failure rates (Event 4656/4663 access-denied,
    ERROR_ACCESS_DENIED, auditd EACCES) per user/session as a distinct feature. A high denied-to-allowed
    ratio during removable access suggests broad scripted enumeration hitting permission boundaries and
    should raise the score even when total successful copies are modest. A positive result is a session
    with many denials relative to successes; a negative result is normal targeted access with few denials.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - Windows Event ID 4663
  - 'NAI: Endpoints (desktops, laptops) with USB ports, and command-line/scripting log collection infrastructure.'
  range: Last 90 days; profile failure ratio per user/session.
  queries:
  - technology: SIEM/Stats pseudocode
    query: FROM file_ops GROUP BY user, session COMPUTE denied = count(4656/4663 access=denied OR EACCES
      OR ERROR_ACCESS_DENIED), allowed = count(success); ratio = denied/allowed; ALERT WHERE ratio > p95(user_baseline)
      AND removable_access(session)
- question: Did a single process read an unusually large number of distinct files (e.g., >100 files or
    >500 read ops/min) from a removable volume in a short window, with a concentration in sensitive document
    or credential extensions, indicating scripted/automated bulk collection?
  context: Collection via automation reads many files quickly. Alert on high-rate removable-drive read
    bursts (e.g., >100 distinct files or >500 read ops/min from a removable volume) using Event 4663 with
    SACLs configured or auditd read events, with focus on sensitive extensions, and correlate to the responsible
    process lineage and user session. A positive result is a single process sweeping a removable volume
    far faster than a human would; a negative result is sporadic interactive file opening. Tune the rate
    floor from per-host baselines so quiet hosts do not over-alert.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: Endpoints and file servers where sensitive data is stored and where object access auditing (SACL)
    for removable media file reads is enabled.'
  range: Last 90 days; evaluate read bursts in 1-minute windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM file_access WHERE volume = removable AND (EventCode=4663 read OR auditd read) BUCKET 1m
      BY process, user COMPUTE distinct_files, read_ops; ALERT WHERE distinct_files > 100 OR read_ops
      > 500; ENRICH process_lineage, sensitive_ext_ratio
- question: Relative to each user's baseline, are the read rate, extension-distribution entropy, directory
    fan-out, and bytes read from removable media anomalous (99th-percentile bursts or atypical extension
    mixes) when scored by an unsupervised model?
  context: During Collection, both the volume and the selectivity of file access matter. Baseline per-user
    read rate, extension-distribution entropy, directory fan-out, and bytes read from removable media,
    then flag 99th-percentile bursts and atypical extension mixes via an unsupervised scorer such as Isolation
    Forest over these features. Low entropy concentrated on sensitive extensions, or unusually high fan-out,
    both indicate collection. A positive result is a statistically extreme combination of these features
    for the user; a negative result sits within their normal envelope.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: Endpoints and file servers where sensitive data is stored and where object access auditing (SACL)
    for removable media file reads is enabled.'
  range: Last 90 days; baseline per-user over a rolling 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: FROM removable_read GROUP BY user COMPUTE read_rate, ext_entropy, dir_fanout, bytes; model
      = IsolationForest([read_rate,ext_entropy,dir_fanout,bytes] over 30d); ALERT WHERE score > p99 OR
      atypical_ext_mix
- question: Does the sequence of removable-media file-access events (mount -> open/read -> copy) deviate
    from learned benign patterns when modeled with a sequence/autoencoder anomaly detector, flagging anomalous
    high-speed traversal?
  context: 'For Collection, the temporal order of access events betrays automation. Train a sequence model
    on benign removable-media access patterns and flag anomalous high-speed traversal: model mount ->
    open/read -> copy event-key sequences with DeepLog (deviation from top-k next-key predictions), or
    score streaming file-access feature vectors with an online autoencoder ensemble such as Kitsune/KitNET
    whose per-feature reconstruction error names the top-3 contributing features. A positive result is
    a sequence the model finds improbable (rapid, uniform traversal); a negative result matches learned
    human-paced behavior.'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: Endpoints and file servers where sensitive data is stored and where object access auditing (SACL)
    for removable media file reads is enabled.'
  range: Last 90 days; train on benign sequences, score streaming.
  queries:
  - technology: ML/pseudocode
    query: seq = event_keys(mount->open/read->copy) per process/session; deeplog = train(benign_seq);
      ALERT WHERE next_key NOT IN top_k(deeplog.predict(seq)); OR kitnet = autoencoder(stream feature_vectors);
      ALERT WHERE recon_error > threshold; EMIT top_3_features(recon_error)
- question: Did a normally well-behaved process (explorer, finder, a shell, or a signed utility) suddenly
    issue bulk sequential reads across a removable volume that fall outside its established short-sequence
    syscall envelope?
  context: In Collection, a normally benign process can be abused to read a removable volume in bulk.
    Profile each process's normal mount/open/read/copy syscall envelope (per 'A Sense of Self for Unix
    Processes') and flag when a process such as explorer, finder, a shell, or a signed utility suddenly
    issues bulk sequential reads across a removable volume outside its established short-sequence profile.
    A positive result is a known process exhibiting an out-of-character read burst; a negative result
    is behavior consistent with its learned envelope.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - 'NAI: Endpoints and file servers where sensitive data is stored and where object access auditing (SACL)
    for removable media file reads is enabled.'
  range: Last 90 days; compare against each process's learned short-sequence envelope.
  queries:
  - technology: SIEM/Rule pseudocode
    query: envelope = learn_short_sequences(process.syscalls mount/open/read/copy); ALERT WHERE process
      IN (explorer,finder,shell,signed_util) AND current_sequence NOT IN envelope AND bulk_sequential_reads(removable_volume)
- question: After removable-media collection, did an archive utility (tar, zip, 7z, rar, Compress-Archive)
    run and then outbound traffic go to a first-seen/suspicious destination within ~30 minutes on the
    same host/user, forming a collect-stage-exfil chain?
  context: Collection commonly precedes staging and exfiltration. Correlate removable-media collection
    with archive-utility execution (tar, zip, 7z, Compress-Archive, rar) and outbound traffic to first-seen/suspicious
    destinations within 30 minutes on the same host/user context, linking the chain via path-based causal
    inference as in Hopper. A positive result is a removable read burst followed by archive creation and
    a connection to a novel external destination — a strong collect-stage-exfil signal. A negative result
    breaks the chain (no archive or no outbound novelty) and lowers priority.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Network egress points (e.g., firewalls, proxies), DNS servers, and endpoints with direct internet
    access. Correlation must occur across data from these NAIs.'
  range: Last 90 days; correlate archive + outbound within 30 minutes of removable collection.
  queries:
  - technology: SIEM/Rule pseudocode
    query: collect = removable_read_burst(host,user); archive = process_creation WHERE Image IN (tar,zip,7z,rar,Compress-Archive);
      net = conn.log WHERE dest IN first_seen_or_suspicious; JOIN collect, archive, net ON host,user WITHIN
      30m; ALERT path_causal_link(collect -> archive -> net)
- question: Immediately after removable access, did outbound byte volume spike (three-sigma) or did the
    host begin contacting unusually rare/novel or dynamic destinations — and were there failed connection
    attempts indicating egress probing?
  context: After Collection, exfiltration shows up as abnormal egress. Baseline post-copy outbound bytes
    and destination novelty by host, flagging three-standard-deviation byte spikes and unusual destination
    expansion immediately after removable access; score destination rarity/dynamism using prevalence features
    (as in EXPOSURE), and treat connection failures (blocked egress, repeated SYN without establishment)
    as a distinct probing signal. A positive result is a byte spike or sudden contact with rare/dynamic
    destinations right after removable access; a negative result is egress consistent with the host's
    baseline.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Network egress points (e.g., firewalls, proxies), DNS servers, and endpoints with direct internet
    access. Correlation must occur across data from these NAIs.'
  range: Last 90 days; evaluate egress in the window immediately following removable access.
  queries:
  - technology: SIEM/Stats pseudocode
    query: base = host_baseline(outbound_bytes, dest_set); window = after(removable_access); ALERT WHERE
      sum(bytes in window) > mean+3*std(base) OR new_dest_count > expected; SCORE dest_rarity(prevalence)
      ; FLAG conn_failures(blocked_egress, repeated_SYN_no_establish) AS probing
- question: When host-process-destination subgraphs of post-removable activity are scored with a provenance-graph
    anomaly model, which collection-to-staging-to-exfiltration chains are flagged — and what are the top
    anomalous nodes/edges?
  context: For Collection, the full kill-chain is best seen as a graph. Build host-process-destination
    subgraphs for post-removable activity and apply provenance-graph anomaly scoring with KAIROS or the
    masked-graph autoencoder MAGIC to identify collection-to-staging-to-exfiltration chains, surfacing
    the top-3 anomalous nodes/edges in the alert. A positive result is an anomalous subgraph connecting
    removable reads, an archiver, and an external destination; a negative result is a graph that matches
    benign provenance. This unifies the per-step signals into one prioritized chain.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Network egress points (e.g., firewalls, proxies), DNS servers, and endpoints with direct internet
    access. Correlation must occur across data from these NAIs.'
  range: Last 90 days; build subgraphs over post-removable activity windows.
  queries:
  - technology: ML/pseudocode
    query: G = subgraph(host->process->destination) over post_removable_window; score = KAIROS_or_MAGIC(G);
      ALERT WHERE anomaly_score(node/edge) high AND chain(removable_read -> archiver -> external_dest);
      EMIT top_3_anomalous_nodes_edges
