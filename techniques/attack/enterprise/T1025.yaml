name: 'T1025: Data from Removable Media'
id: 4a6d8fa2-2861-40dd-adaf-1cbf488ea856
description: 'Investigate adversary collection of data from removable media (USB drives, optical disks,
  and other detachable storage) on compromised Windows, Linux, and macOS hosts. This playbook helps an
  analyst detect and triage: (1) processes that execute directly from removable-media paths and match
  malicious or suspicious unsigned tooling; (2) copy/transfer utilities and script cmdlets moving content
  from removable sources to local staging folders or network shares; (3) processes that rapidly read large
  numbers of files from removable media with concentration in sensitive document or credential extensions,
  indicating scripted or automated bulk collection; and (4) removable-media collection followed by near-term
  archive creation and outbound communication to rare destinations, consistent with staging and possible
  exfiltration. Detection methods span symbolic-logic correlation rules, statistical baselining/anomaly
  scoring, and machine-learning models across endpoint (Windows Event IDs, Sysmon, auditd, macOS unified
  log/osquery) and network (Zeek) telemetry.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
