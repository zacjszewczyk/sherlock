  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses the macOS Event
    Monitor Daemon (emond) -- a root-privileged Launch Daemon that executes commands from rule plists
    in /etc/emond.d/rules/ when events such as system startup or user authentication fire -- to silently
    maintain a foothold and/or escalate to root. This evidence focuses on the condition that a new file
    created in `/etc/emond.d/rules/` has a SHA256 hash that matches a known-malicious hash from threat
    intelligence, or a process spawned by `/sbin/emond` has a command line that matches a known-malicious
    signature. This Statistical Method approach looks for the following signal: For every command executed
    by a `/sbin/emond` child and every string in a rule''s `RunCommand`/`RunExecutable` value, measure
    (Volume) byte length, (style) Shannon entropy, and (Failure mode) the ratio of non-printable/non-ASCII
    bytes and any base64-decode failures. Per Using Entropy Analysis to Find Encrypted and Packed Malware,
    encoded/packed payloads run hot (>7.2 bits/byte) versus normal text (5.0-6.5); for short command strings
    derive a dataset-specific cutoff at the 99th percentile of a 30-day benign baseline (High Command
    Line Entropy Detected for Privileged Commands). Alert when entropy exceeds the threshold, the string
    is >500 bytes, or it base64-decodes to an executable header. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates likely emond abuse; pivot to the responsible rule file and its
    contents, the parent process that wrote it (user/UID and path), any child process /sbin/emond spawned,
    the executed command line, and subsequent privileged actions or outbound network connections. A negative
    result helps rule out this emond vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, context-triggered, or living-off-the-land abuse.
    Authoritative references for this method: [Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989);
    [High Command Line Entropy Detected for Privileged Commands](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).'
