- question: '[Persistence] Flag high-entropy / obfuscated emond command lines: Can you determine whether
    a new file created in `/etc/emond.d/rules/` has a SHA256 hash that matches a known-malicious hash
    from threat intelligence, or a process spawned by `/sbin/emond` has a command line that matches a
