questions:
- question: '[Persistence] Alert on any write to emond rule/queue paths (first-party): Can you determine
    whether a new file created in `/etc/emond.d/rules/` has a SHA256 hash that matches a known-malicious
    hash from threat intelligence, or a process spawned by `/sbin/emond` has a command line that matches
    a known-malicious signature. -- specifically, using the ''Alert on any write to emond rule/queue paths
    (first-party)'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses the macOS Event
    Monitor Daemon (emond) -- a root-privileged Launch Daemon that executes commands from rule plists
    in /etc/emond.d/rules/ when events such as system startup or user authentication fire -- to silently
    maintain a foothold and/or escalate to root. This evidence focuses on the condition that a new file
    created in `/etc/emond.d/rules/` has a SHA256 hash that matches a known-malicious hash from threat
    intelligence, or a process spawned by `/sbin/emond` has a command line that matches a known-malicious
    signature. This Symbolic Logic approach looks for the following signal: Writes to `/etc/emond.d/rules/`
    or `/private/var/db/emondClients` are intrinsically rare on production endpoints; emond ships with
    effectively no active rules and the QueueDirectories file gates whether the daemon even launches (MITRE
    ATT&CK T1546.014 Emond, How Malware Persists on macOS). Using only first-party macOS Endpoint Security
    telemetry (Apple Endpoint Security), generate a high-severity alert on ANY file create/modify in those
    paths, and emit the creating process path, UID, and full target path in the alert text. This is the
    deterministic floor and must run regardless of TI availability. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates likely emond abuse; pivot to the responsible rule
    file and its contents, the parent process that wrote it (user/UID and path), any child process /sbin/emond
    spawned, the executed command line, and subsequent privileged actions or outbound network connections.
    A negative result helps rule out this emond vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, context-triggered, or living-off-the-land
    abuse. Authoritative references for this method: [MITRE ATT&CK T1546.014 Emond](https://attack.mitre.org/techniques/T1546/014/);
    [How Malware Persists on macOS](https://www.sentinelone.com/blog/how-malware-persists-on-macos/);
    [Apple Endpoint Security](https://developer.apple.com/documentation/endpointsecurity).'
