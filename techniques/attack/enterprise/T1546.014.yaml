name: 'T1546.014: Emond'
id: c1d1b3ee-60ba-46f3-9f4a-901c446816c7
description: 'This playbook helps an analyst investigate adversary abuse of the macOS Event Monitor Daemon
  (emond) for persistence and privilege escalation (MITRE ATT&CK T1546.014). emond is a Launch Daemon
  (/sbin/emond, configured via /System/Library/LaunchDaemons/com.apple.emond.plist) that reads rule plists
  from /etc/emond.d/rules/ and runs commands when defined events fire (e.g., system startup or user authentication);
  it only launches when a file is present in the QueueDirectories path /private/var/db/emondClients. Because
  emond ships with effectively no active rules and runs as root, any rule write or any child process it
  spawns is highly suspicious. The playbook guides the hunt across several behavioral angles: file create/modify
  activity in /etc/emond.d/rules/ and /private/var/db/emondClients (with TI hash/signature enrichment);
  inspection of rule plist RunCommand/RunExecutable values for script interpreters, world-writable paths,
  or privilege-escalation primitives (dscl user/group creation, writes to /etc/sudoers.d/, chmod/chown
  setuid, plists dropped into /Library/LaunchDaemons); detection of unauthorized parent processes writing
  rules and of any child process spawned by /sbin/emond; and stateful correlation of the full kill chain
  (rule write -> emond spawns child -> privileged action such as admin-user creation or LaunchDaemon drop).
  Detection methods combine symbolic-logic rules, statistical baselining (entropy, rarity scoring, EWMA/3-sigma
  anomalies), and machine-learning models (gradient boosting, embedding outlier detection, provenance
  graph/GNN and sequence models) applied to macOS Endpoint Security (ESF) / unified-log file, process,
  and command telemetry plus Zeek conn.log network context, so the analyst can corroborate suspected emond
  abuse against rule content, process lineage, command anomaly, and network/escalation context.'
type: technique
