name: 'T1036.009: Masquerading: Break Process Trees'
id: d8a6b145-1e5b-4e35-8f85-c196c33449c2
description: 'Investigate whether an adversary is evading defenses by breaking process-tree ancestry on
  Linux and macOS hosts (MITRE ATT&CK T1036.009, Masquerading: Break Process Trees). Malware can sever
  its parent-child lineage by double-forking (fork -> fork -> setsid -> parent exit), calling daemon(),
  or using nohup/disown/shell backgrounding, so the payload is re-parented to init (PID 1) or launchd
  and is no longer associated with the activity that launched it. This playbook helps an analyst hunt
  for: processes re-parented to PID 1/launchd within seconds of creation whose original parent exited
  cleanly (exit code 0) rather than crashing; detachment primitives (daemon(), setsid(), nohup, disown,
  ''&'') paired with immediate parent exit; quick parent-termination time deltas that separate deliberate
  orphaning from genuine faults; detached processes that go on to spawn shells, write to startup/persistence
  locations (~/.bashrc, /etc/cron*, systemd units, LaunchAgents/LaunchDaemons), or beacon outbound; and
  detached payloads reconstructed by correlating auditd/eBPF kernel provenance with Zeek conn/dns/ssl
  telemetry, including raw-socket/BPF magic-packet C2 and rare-JA3 beaconing. Each evidence area pairs
  symbolic-logic, statistical, and machine-learning approaches so the analyst can recover true lineage
  even after the live PPID has been destroyed and can detect both commodity Linux implants (e.g., BPFDoor,
  XorDdos) and sophisticated, signature-evading actors.'
type: technique
