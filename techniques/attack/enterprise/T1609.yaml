name: 'T1609: Container Administration Command'
id: bf7fd71b-37f4-4f91-8be5-6d45c0297622
description: 'Investigate container administration activity that may provide adversaries with remote command
  execution in Docker or Kubernetes environments. This playbook covers successful and failed exec or attach
  operations, suspicious `docker exec` and `kubectl exec` arguments, runtime shell spawning, privileged
  container creation, first-time or off-hours admin-tool usage, bursts of control-plane requests, interactive
  exploration behavior, and anomalous container network or configuration changes associated with command
  execution through administration interfaces.

  '
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-02-18'
modified: '2026-05-31'
version: '1.2'
tags: none
questions:
- question: 'Did a successful Kubernetes or Docker exec, attach, or run request occur, and can it be tied
    back to host-side admin tooling?

    '
  context: 'Start by confirming that a control-plane exec-like request actually succeeded and then correlating
    it to `kubectl`, `docker`, or `ctr` execution on an endpoint or jump server. This distinguishes true
    container command execution from generic API browsing and gives analysts the operator identity, target
    workload, and local tooling context needed for triage. References: [Kubernetes User Exec into Pod](https://www.elastic.co/guide/en/security/8.18/kubernetes-user-exec-into-pod.html),
    [Atomic Red Team T1609](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1609/T1609.md).'
  answer_sources:
  - Kubernetes audit logs
  - Docker daemon logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Linux auditd logs
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Container orchestration control plane nodes (e.g., Kubernetes masters), container hosts, administration
    jump servers'
  range: Last 90 days, with event-centered host-to-control-plane correlation.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'exec_api = control_plane_logs where exec_attach_run succeeded=true; host_tool = process_events
      where image in [''kubectl'',''docker'',''ctr''] and ts near exec_api.ts; alert when identity_or_source
      aligns; output user, source_host, target_pod_or_container, verb, status, host_tool_command.

      '
- question: 'Did an identity successfully execute into a pod or container even though its RBAC or policy
    membership should not allow that action?

    '
  context: 'Successful exec under a mismatched role is a strong sign of misconfiguration, privilege abuse,
    or compromised credentials. Compare the initiating user or service account against approved RBAC bindings
    for the namespace or cluster, and retain any prior `403` attempts because repeated failures before
    success can reveal probing or escalation behavior. References: [Kubernetes Unauthorized Access](https://research.splunk.com/cloud/9b5f1832-e8b9-453f-93df-07a3d6a72a45/).'
  answer_sources:
  - Kubernetes audit logs
  - Docker daemon logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Linux auditd logs
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Container orchestration control plane nodes (e.g., Kubernetes masters), container hosts, administration
    jump servers'
  range: Last 90 days, with immediate review of 403-to-success sequences.
  queries:
  - technology: SIEM policy-correlation pseudocode
    query: 'exec_api = control_plane_logs where exec_attach_run=true and status in [200,201,202]; rbac
      = lookup approved_exec_bindings(namespace,cluster); failures = count control_plane_logs where status=403
      by identity,1h; alert when identity not_in rbac or failures_before_success high; output identity,
      namespace, target, failure_count, success_event.

      '
- question: 'Are Kubernetes audit logs showing the canonical `pods/exec` subresource pattern that should
    always trigger container exec review?

    '
  context: 'A direct `verb=create` against `pods/exec` is the vendor-neutral floor for detecting Kubernetes
    exec activity. Even if richer analytics are unavailable, this pattern should be monitored and triaged
    because it identifies the control-plane action that enables remote command execution. Analysts should
    capture the source identity, namespace, pod, response code, and source IP. References: [SigmaHQ Rules
    Release r2024-03-26](https://blog.sigmahq.io/sigmahq-rules-release-highlights-r2024-03-26-50b086b2f540).'
  answer_sources:
  - Kubernetes audit logs
  - Docker daemon logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Linux auditd logs
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Container orchestration control plane nodes (e.g., Kubernetes masters), container hosts, administration
    jump servers'
  range: Last 90 days.
  queries:
  - technology: SIEM rule pseudocode
    query: 'alert from kubernetes_audit where verb=''create'' and objectRef.resource=''pods'' and objectRef.subresource=''exec'';
      output user, source_ip, namespace, pod, response_status, user_agent.

      '
- question: 'Is the identity''s current hourly exec or attach rate above its established baseline?

    '
  context: 'Frequent container exec activity can indicate widespread hands-on-keyboard access or a script
    driving remote commands across the cluster. Build a 45-day baseline per identity and namespace, then
    review current sessions that exceed the 99th percentile while still active. This helps identify both
    compromised admin accounts and service accounts suddenly being used interactively. References: [Key
    Kubernetes audit logs for monitoring cluster security](https://www.datadoghq.com/blog/key-kubernetes-audit-logs-for-monitoring-cluster-security/).'
  answer_sources:
  - Kubernetes audit logs
  - Docker daemon logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Linux auditd logs
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Container orchestration control plane nodes (e.g., Kubernetes masters), container hosts, administration
    jump servers'
  range: Last 90 days, with a 45-day identity baseline and hourly scoring.
  queries:
  - technology: SIEM baseline pseudocode
    query: 'exec_counts = count exec_attach_run by identity,namespace,hour; alert when current_count >
      percentile(identity_namespace,99); output identity, namespace, current_count, baseline_p99, session_context.

      '
- question: 'Is the identity executing into a namespace it has not touched before, especially at an unusual
    hour?

    '
  context: 'Namespace novelty is often a clearer signal than raw volume. Track the namespaces historically
    accessed by each user or service account and flag first-time exec activity into new namespaces, weighting
    production or other sensitive namespaces more heavily. Pair this with time-of-day context because
    off-hours novelty is more suspicious than ordinary daytime expansion.

    '
  answer_sources:
  - Kubernetes audit logs
  - Docker daemon logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Linux auditd logs
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Container orchestration control plane nodes (e.g., Kubernetes masters), container hosts, administration
    jump servers'
  range: Last 90 days, with 90-day namespace history.
  queries:
  - technology: SIEM novelty pseudocode
    query: 'history = namespaces_accessed_by_identity over 90d; alert when exec_namespace new_for_identity=true
      and time outside typical_hours; output identity, namespace, namespace_sensitivity, timestamp.

      '
- question: 'Do replicas in the same workload show one pod diverging sharply after exec activity?

    '
  context: 'Exec-injected commands can create runtime behavior that differs from sibling replicas even
    when the control-plane event is subtle. Compare syscall or process distributions across pods in the
    same Deployment or ReplicaSet and flag the replica whose behavior deviates most after an exec operation.
    This is especially useful for production workloads where peer similarity is normally high. References:
    [ReplicaWatcher: Training-less Anomaly Detection in Containerized Microservices (NDSS 2024)](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf),
    [ReplicaWatcher code](https://github.com/Asbatel/ReplicaWatcher).'
  answer_sources:
  - Kubernetes audit logs
  - Docker daemon logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Linux auditd logs
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Container orchestration control plane nodes (e.g., Kubernetes masters), container hosts, administration
    jump servers'
  range: Last 90 days, with post-exec runtime comparison across replicas.
  queries:
  - technology: Runtime statistics pseudocode
    query: 'peer_metrics = collect_runtime_vectors(replicaset_or_deployment); divergence = compare_each_replica_to_group(peer_metrics);
      alert when divergence_score > group_mean + 2*stddev and recent_exec=true; output workload, divergent_pod,
      divergence_score, recent_exec_event.

      '
- question: 'Does the ordered sequence of admin operations for this identity look abnormal, especially
    when exec appears without normal precursor steps?

    '
  context: 'Legitimate administrators often follow repeatable paths such as `get`, `describe`, or `logs`
    before `exec`. Sequence modeling helps identify sessions where `exec` or `attach` appears abruptly
    or in a rare position. Analysts should inspect the top contributing operations and confirm whether
    the session resembles ordinary debugging or a suspicious shortcut into live workloads. References:
    [AI-Driven Container Security Approaches for 5G and Beyond: A Survey](https://arxiv.org/pdf/2302.13865).'
  answer_sources:
  - Kubernetes audit logs
  - Docker daemon logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Linux auditd logs
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Container orchestration control plane nodes (e.g., Kubernetes masters), container hosts, administration
    jump servers'
  range: Last 90 days for sequence training and scoring.
  queries:
  - technology: ML sequence pseudocode
    query: 'seq = ordered_admin_ops_by_identity; score = lstm_sequence_model(seq); explain = top_sequence_contributors(seq);
      alert when score >= anomaly_threshold and exec_without_expected_precursors=true; output identity,
      sequence, explain, target_objects.

      '
- question: 'Is this exec or attach activity anomalous for the identity when compared with peer administrators
    and service accounts?

    '
  context: 'Peer-group analysis helps reduce false positives for busy admin accounts while still surfacing
    outliers. Score features such as identity, source host, namespace, time-of-day, and exec count against
    similar operators and service accounts. The analyst should use the resulting top feature drivers to
    decide whether the event is unusual because of who performed it, where it came from, or which workloads
    it touched. References: [Self-Supervised Machine Learning Framework for Online Container Security
    Attack Detection (ACM TAAS 2024)](https://dl.acm.org/doi/10.1145/3665795).'
  answer_sources:
  - Kubernetes audit logs
  - Docker daemon logs
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - Linux auditd logs
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Container orchestration control plane nodes (e.g., Kubernetes masters), container hosts, administration
    jump servers'
  range: Last 90 days for peer comparison and model scoring.
  queries:
  - technology: ML anomaly pseudocode
    query: 'features = [identity,source_host,namespace,time_of_day,exec_count]; score = peer_group_isolation_forest(features);
      explain = top_contributors(features); alert when score >= threshold; output identity, score, explain,
      namespace, source_host.

      '
- question: 'Are `docker exec` or `kubectl exec` arguments invoking interactive shells, exfiltration tools,
    or sensitive file reads inside containers?

    '
  context: 'The most direct content clue is often in the exec arguments themselves. Look for `/bin/bash
    -i`, `sh -c` chains that include `curl` or `wget`, `nc -e`, and file access patterns such as reading
    `/etc/shadow`. Analysts should pair argument review with container metadata and target pod details
    so they can judge whether the exec resembles routine debugging or hostile post-exploitation. References:
    [Atomic Red Team T1609](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1609/T1609.md).'
  answer_sources:
  - Sysmon Event ID 1
  - Linux auditd logs
  - Kubernetes audit logs
  - Container runtime logs
  - Falco alerts
  - Tracee alerts
  - 'NAI: Container hosts, CI/CD runners, jump servers with container tooling installed'
  range: Last 90 days.
  queries:
  - technology: SIEM regex pseudocode
    query: 'exec_cmd = process_events where image in [''docker'',''kubectl''] and args contain ''exec'';
      alert when args match [''/bin/bash -i'',''sh -c .*curl'',''sh -c .*wget'',''nc -e'',''cat /etc/shadow''];
      output user, host, full_args, target_container_or_pod.

      '
- question: 'Are kernel-level Falco alerts reporting a terminal shell spawned inside a container after
    exec activity?

    '
  context: 'Runtime shell spawning is a concrete byproduct of interactive container access and should
    be treated as a deterministic floor beneath higher-level analytics. Correlate Falco shell alerts with
    container metadata and nearby exec operations to determine which user or workload triggered the shell
    and whether the shell appeared in an unexpected pod or namespace. References: [Falco Rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml),
    [Splunk Kubernetes Falco Shell Spawned](https://research.splunk.com/cloud/d2feef92-d54a-4a19-8306-b47c6ceba5b2/).'
  answer_sources:
  - Sysmon Event ID 1
  - Linux auditd logs
  - Kubernetes audit logs
  - Container runtime logs
  - Falco alerts
  - Tracee alerts
  - 'NAI: Container hosts, CI/CD runners, jump servers with container tooling installed'
  range: Last 90 days, with near-real-time runtime correlation.
  queries:
  - technology: Runtime alert correlation pseudocode
    query: 'falco = falco_alerts where rule=''Terminal Shell in Container''; execs = control_plane_or_process_exec_events
      near falco.ts; alert when correlated=true; output container_id, pod, namespace, parent_process,
      exec_identity, falco_fields.

      '
- question: 'Do Tracee eBPF signatures show shell spawn, API callback, or runtime payload staging consistent
    with admin-command abuse?

    '
  context: 'Tracee signatures can reveal immediate side effects of container exec abuse even when audit
    coverage is incomplete. Review alerts for illegitimate shell spawning by server processes, Kubernetes
    API server communication from containers, and new executables dropped at runtime. These findings can
    help confirm that an admin command translated into hands-on action inside the container. References:
    [Tracee](https://github.com/aquasecurity/tracee).'
  answer_sources:
  - Sysmon Event ID 1
  - Linux auditd logs
  - Kubernetes audit logs
  - Container runtime logs
  - Falco alerts
  - Tracee alerts
  - 'NAI: Container hosts, CI/CD runners, jump servers with container tooling installed'
  range: Last 90 days.
  queries:
  - technology: Runtime signature pseudocode
    query: 'alert from tracee where signature_id in [''TRC-12'',''TRC-13'',''TRC-9'']; output signature_id,
      container_id, pod, namespace, process_lineage, file_or_network_context.

      '
- question: 'Did the exec target a privileged container or one with host mounts or elevated capabilities?

    '
  context: 'The same exec command carries much more risk when the target container has privileged access,
    host namespaces, or mounts like `/var/run/docker.sock`. Join exec events to container or pod security
    context so analysts can prioritize shells that could more easily pivot into the node or orchestrator.
    This is a triage multiplier, not merely metadata enrichment. References: [NIST SP 800-190](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-190.pdf).'
  answer_sources:
  - Sysmon Event ID 1
  - Linux auditd logs
  - Kubernetes audit logs
  - Container runtime logs
  - Falco alerts
  - Tracee alerts
  - 'NAI: Container hosts, CI/CD runners, jump servers with container tooling installed'
  range: Last 90 days.
  queries:
  - technology: SIEM enrichment pseudocode
    query: 'execs = exec_activity; meta = container_security_context(capabilities,privileged,host_mounts);
      alert when recent_exec=true and meta.high_risk=true; output target_container, namespace, privileged,
      host_mounts, capabilities.

      '
- question: 'Has the user''s ratio of shell- or credential-related exec commands risen above its normal
    level?

    '
  context: 'Even active administrators rarely spend all day spawning interactive shells or credential-oriented
    commands inside containers. Compute the ratio of shell, credential, or sensitive-read execs to total
    execs per user and compare it to a 60-day baseline. A sudden jump suggests a shift from ordinary administration
    into deeper interactive access or collection.

    '
  answer_sources:
  - Sysmon Event ID 1
  - Linux auditd logs
  - Kubernetes audit logs
  - Container runtime logs
  - Falco alerts
  - Tracee alerts
  - 'NAI: Container hosts, CI/CD runners, jump servers with container tooling installed'
  range: Last 90 days, with 60-day per-user ratios.
  queries:
  - technology: SIEM ratio-baseline pseudocode
    query: 'shellish = exec_commands matching shell_or_credential_patterns; ratio = count(shellish) /
      count(all_execs) by user,day; alert when ratio > percentile(user,97); output user, ratio, baseline_ratio,
      examples.

      '
- question: 'Are exec command lines statistically rare when compared with the previous month of container
    admin command history?

    '
  context: 'Rarity scoring helps highlight unfamiliar or highly specific commands without requiring a
    fixed signature. Tokenize exec arguments, compute BM25 or log-entropy rarity against the last 30 days,
    and flag commands above the 99th percentile. This is useful for spotting novel tradecraft or unusual
    one-off data access commands in otherwise busy admin environments. References: [SCADE: Scalable Framework
    for Anomaly Detection in High-Performance System (arXiv 2024)](https://arxiv.org/abs/2412.04259).'
  answer_sources:
  - Sysmon Event ID 1
  - Linux auditd logs
  - Kubernetes audit logs
  - Container runtime logs
  - Falco alerts
  - Tracee alerts
  - 'NAI: Container hosts, CI/CD runners, jump servers with container tooling installed'
  range: Last 90 days, with 30-day rarity windows.
  queries:
  - technology: Statistical text-scoring pseudocode
    query: 'corpus = exec_command_history(30d); score = bm25_or_log_entropy(current_exec_args, corpus);
      alert when score > percentile(corpus,99); output exec_args, score, user, target.

      '
- question: 'Do syscall frequency windows inside the container diverge from the normal baseline after
    an exec event?

    '
  context: 'Injected commands alter the syscall mix of a container, sometimes more clearly than the exec
    record itself. Build Bag-of-System-Calls vectors over sliding windows and compare them to the container''s
    normal behavior. This lets analysts detect exec- driven runtime changes even if the command text is
    partially hidden or later deleted from the system. References: [Applying Bag of System Calls for Anomalous
    Behavior Detection of Applications in Linux Containers (arXiv 2016)](https://arxiv.org/abs/1611.03053).'
  answer_sources:
  - Sysmon Event ID 1
  - Linux auditd logs
  - Kubernetes audit logs
  - Container runtime logs
  - Falco alerts
  - Tracee alerts
  - 'NAI: Container hosts, CI/CD runners, jump servers with container tooling installed'
  range: Last 90 days, with sliding runtime windows around exec activity.
  queries:
  - technology: Runtime anomaly pseudocode
    query: 'bosc = build_syscall_frequency_vectors(container,window); alert when current_vector not_in
      normal_bosc_database and recent_exec=true; output container, pod, window, similarity_score, recent_exec_event.

      '
- question: 'Does a command-line classifier score this exec command as suspicious based on text and runtime
    context?

    '
  context: 'A classifier can combine suspicious argument strings with runtime information to identify
    hostile exec use that is not covered by simple regex. Score the command against benign CI/CD and admin
    patterns, then include the top contributing features for explainability. The analyst should be able
    to see whether the risk came from the command text, the target workload, or the surrounding syscall
    context. References: [CDL: Classified Distributed Learning for Detecting Security Attacks in Containerized
    Applications (ACSAC 2020)](https://dl.acm.org/doi/10.1145/3427228.3427236), [CDL code/dataset](https://github.com/NCSU-DANCE-Research-Group/CDL).'
  answer_sources:
  - Sysmon Event ID 1
  - Linux auditd logs
  - Kubernetes audit logs
  - Container runtime logs
  - Falco alerts
  - Tracee alerts
  - 'NAI: Container hosts, CI/CD runners, jump servers with container tooling installed'
  range: Last 90 days for scoring and retraining.
  queries:
  - technology: ML classification pseudocode
    query: 'features = featurize_exec(text_features,syscall_features,target_metadata); score = exec_classifier.predict_proba(features);
      explain = shap_top3(features); alert when score > 0.8; output score, explain, exec_args, target_container.

      '
- question: 'Does an autoencoder score the exec command and its syscall context as anomalous for the container?

    '
  context: 'Context-rich anomaly detection is useful when the command string looks mundane but the resulting
    runtime behavior is not. Embed exec arguments together with syscall sequence or file-path context
    and flag high reconstruction error relative to the container''s normal operation. Analysts should
    use this to find unusual use of otherwise common shells or tools inside sensitive workloads. References:
    [Contextualizing System Calls in Containers for Anomaly-Based Intrusion Detection (CCSW 2022)](https://dl.acm.org/doi/10.1145/3560810.3564266).'
  answer_sources:
  - Sysmon Event ID 1
  - Linux auditd logs
  - Kubernetes audit logs
  - Container runtime logs
  - Falco alerts
  - Tracee alerts
  - 'NAI: Container hosts, CI/CD runners, jump servers with container tooling installed'
  range: Last 90 days for training and anomaly scoring.
  queries:
  - technology: ML autoencoder pseudocode
    query: 'context = build_exec_syscall_graph(exec_args,syscalls,file_paths); error = autoencoder.reconstruction_error(context);
      alert when error > mean + 2*stddev; output target_container, error, exec_args, context_features.

      '
- question: 'Are container creation requests specifying privileged or host-namespace options that would
    weaken isolation?

    '
  context: 'Privileged creation is a direct setup for later command execution with greater impact. Parse
    `docker run/create` arguments and Kubernetes manifests for `--privileged`, `hostPID`, `hostNetwork`,
    dangerous `hostPath` mounts, or similar flags. Analysts should treat any such creation as high priority
    because it expands what a later exec session can reach. References: [NIST SP 800-190](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-190.pdf).'
  answer_sources:
  - Linux auditd logs
  - Kubernetes audit logs
  - Docker daemon logs
  - Sysmon Event ID 1
  - Falco alerts
  - OPA/Gatekeeper audit logs
  - 'NAI: Kubernetes API servers, container hosts, CI/CD pipeline servers'
  range: Last 90 days.
  queries:
  - technology: SIEM manifest-parsing pseudocode
    query: 'create = container_create_events; alert when security_context has_any [''--privileged'',''hostPID=true'',''hostNetwork=true'',''hostPath:/'',''hostPath:/var/run/docker.sock''];
      output user, image, namespace, host_flags, mounts.

      '
- question: 'Are interactive exec sessions being blocked or audited through admission controls, and do
    any attempts indicate policy abuse?

    '
  context: 'Admission and policy telemetry can reveal both successful control and attempted abuse. Review
    OPA, Gatekeeper, or Kyverno events around `pods/exec` and confirm whether interactive sessions were
    denied, audited, or unexpectedly allowed. A high volume of denied interactive exec attempts can be
    as informative as a successful session because it shows the actor is actively probing administrative
    controls. References: [Secure your Kubernetes environment with OPA and Gatekeeper](https://www.cncf.io/blog/2023/10/09/secure-your-kubernetes-environment-with-opa-and-gatekeeper/),
    [Kyverno Audit Event on Pod Exec](https://kyverno.io/policies/other/audit-event-on-exec/audit-event-on-exec/).'
  answer_sources:
  - Linux auditd logs
  - Kubernetes audit logs
  - Docker daemon logs
  - Sysmon Event ID 1
  - Falco alerts
  - OPA/Gatekeeper audit logs
  - 'NAI: Kubernetes API servers, container hosts, CI/CD pipeline servers'
  range: Last 90 days.
  queries:
  - technology: Policy audit pseudocode
    query: 'policy = opa_gatekeeper_or_kyverno_logs where operation in [''CONNECT'',''pods/exec'']; alert
      when interactive_exec denied_or_unexpectedly_allowed=true; output user, namespace, pod, decision,
      policy_name, command_details.

      '
- question: 'Is a privileged or host-namespace container being created from an unapproved or unsigned
    image?

    '
  context: 'Privileged execution becomes more dangerous when the image itself is not trusted. Join high-risk
    security context flags with registry allow-lists, image-signing policy, and runtime detections to
    determine whether the workload combines dangerous privileges with unknown provenance. Analysts should
    preserve the image name, tag, registry, signature state, and the requesting identity. References:
    [Tracee](https://github.com/aquasecurity/tracee).'
  answer_sources:
  - Linux auditd logs
  - Kubernetes audit logs
  - Docker daemon logs
  - Sysmon Event ID 1
  - Falco alerts
  - OPA/Gatekeeper audit logs
  - 'NAI: Kubernetes API servers, container hosts, CI/CD pipeline servers'
  range: Last 90 days.
  queries:
  - technology: SIEM enrichment pseudocode
    query: 'risky_create = container_create where privileged_or_host_namespace=true; image_meta = lookup_image_provenance(risky_create.image);
      alert when image_meta.approved=false or image_meta.signature_valid=false; output image, tag, registry,
      identity, privilege_flags.

      '
- question: 'Has a user or service account begun creating privileged containers for the first time or
    at rates above its normal baseline?

    '
  context: 'Privileged container creation is often rare enough that the first occurrence is itself meaningful.
    Build 90-day per-identity baselines, then highlight first-time privileged creations or daily counts
    that exceed the identity''s normal range. Keep denied admission events in view because repeated failures
    before success may indicate policy bypass attempts.

    '
  answer_sources:
  - Linux auditd logs
  - Kubernetes audit logs
  - Docker daemon logs
  - Sysmon Event ID 1
  - Falco alerts
  - OPA/Gatekeeper audit logs
  - 'NAI: Kubernetes API servers, container hosts, CI/CD pipeline servers'
  range: Last 90 days, with 90-day identity baselines.
  queries:
  - technology: SIEM baseline pseudocode
    query: 'privileged_create = container_create where privileged_or_host_namespace=true; daily = count
      privileged_create by identity,day; denied = count policy_denials by identity,day; alert when first_time_identity=true
      or daily_count > mean + 3*stddev or denied_before_success=true.

      '
- question: 'Is one namespace showing an unusual concentration or sudden spike of privileged container
    creation?

    '
  context: 'Namespace-level concentration helps identify blast radius and local policy drift. Track the
    proportion and count of privileged creations per namespace over time and flag namespaces that exceed
    their normal percentile or jump after long inactivity. This gives analysts a way to tell whether the
    problem is a single operator or a broader workload change in a sensitive environment.

    '
  answer_sources:
