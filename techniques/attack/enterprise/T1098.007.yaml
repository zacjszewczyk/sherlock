questions:
- question: 'Using deterministic rule logic, can you confirm this group-modification activity is malicious?
    Specifically: Join a group-modification event (Windows Event ID 4732/4728/4756, whose SubjectUserName/MemberName/TargetUserName
    fields are defined in the [Microsoft 4732 reference](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4732))
    with the modifying user''s logon session (Event ID 4624) on SubjectUserLogonId. Enrich the logon IpAddress
    from [Zeek conn.log](https://docs.zeek.org/en/master/) and alert when the source is external/VPN and
    the target group enables remote access (Remote Desktop Users, VPN groups, Server Operators, Distributed
    COM Users). Reproduce/validate with [Atomic Red Team T1098.007](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1098.007/T1098.007.md).'
  context: 'Tactic context (Persistence): the adversary adds an account to a privileged local or domain
    group, which under Persistence lets them keep or elevate access across restarts and credential changes.
    Evidence under investigation: A user account is added to a group that enables persistence (e.g., ''Remote
    Desktop Users'', ''Server Operators'', ''Distributed COM Users'') where the modifying user''s session
    originates from an IP address associated with a high-risk ASN or a known malicious source. Approach:
    Join a group-modification event (Windows Event ID 4732/4728/4756, whose SubjectUserName/MemberName/TargetUserName
    fields are defined in the [Microsoft 4732 reference](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4732))
    with the modifying user''s logon session (Event ID 4624) on SubjectUserLogonId. Enrich the logon IpAddress
    from [Zeek conn.log](https://docs.zeek.org/en/master/) and alert when the source is external/VPN and
    the target group enables remote access (Remote Desktop Users, VPN groups, Server Operators, Distributed
    COM Users). Reproduce/validate with [Atomic Red Team T1098.007](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1098.007/T1098.007.md).
    This deterministic approach encodes known-bad conditions into a rule; a positive match is high-confidence
    but evadable, so a negative result does not rule out the behavior. Pivot from any hit to the modifying
    account and session, the source host/IP, the target group, and any follow-on persistence, credential-access,
    or lateral-movement activity.'
  answer_sources:
  - Windows Event ID 4732
  - Windows Event ID 4728
  - Windows Event ID 4756
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, Internet Gateway/Firewall, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Deterministic detection for group modification (T1098.007)

      MATCH group_mod_events  // WinEventID 4728/4732/4756, auditd usermod/gpasswd, macOS dseditgroup

      WHERE <conditions from action>

      // Action: Join a group-modification event (Windows Event ID 4732/4728/4756, whose SubjectUserName/MemberName/TargetUserName
      fields are defined in the [Microsoft 4732 reference](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4732))
      with the modifying user''s logon session (Event ID 4624) on SubjectUserLogonId. Enrich the logon
      IpAddress from [Zeek conn.log](https://docs.zeek.org/en/master/) and alert when the source is external/VPN
      and the target group enables remote access (Remote Desktop Users, VPN groups, Server Operators,
      Distributed COM Users). Reproduce/validate with [Atomic Red Team T1098.007](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1098.007/T1098.007.md).

      THEN alert'
- question: 'Using statistical baselining, can you detect anomalous group-modification behavior here?
    Specifically: For each modifying account build a 90-day historical profile of source IP, ASN, and
    country from Event ID 4624 logons; flag any group-modification whose source ASN/country pair is in
    the bottom 5th percentile of frequency for that account, following the enterprise authentication-graph
    edge-rarity approach in [Kent et al. Authentication graphs](https://doi.org/10.1016/j.cose.2014.09.001)
    and [Siadati and Memon](https://doi.org/10.1145/3133956.3134003). Track State explicitly: also count
    failed logons (4625) and failed/denied modifications from the same source in the prior hour as a corroborating
    signal.'
  context: 'Tactic context (Persistence): the adversary adds an account to a privileged local or domain
    group, which under Persistence lets them keep or elevate access across restarts and credential changes.
    Evidence under investigation: A user account is added to a group that enables persistence (e.g., ''Remote
    Desktop Users'', ''Server Operators'', ''Distributed COM Users'') where the modifying user''s session
    originates from an IP address associated with a high-risk ASN or a known malicious source. Approach:
    For each modifying account build a 90-day historical profile of source IP, ASN, and country from Event
    ID 4624 logons; flag any group-modification whose source ASN/country pair is in the bottom 5th percentile
    of frequency for that account, following the enterprise authentication-graph edge-rarity approach
    in [Kent et al. Authentication graphs](https://doi.org/10.1016/j.cose.2014.09.001) and [Siadati and
    Memon](https://doi.org/10.1145/3133956.3134003). Track State explicitly: also count failed logons
    (4625) and failed/denied modifications from the same source in the prior hour as a corroborating signal.
    This statistical approach baselines normal behavior and flags deviations; a positive result means
    the observation is rare relative to the learned baseline, while a negative result means it fits historical
    norms (tune thresholds to manage false positives). Pivot from any hit to the modifying account and
    session, the source host/IP, the target group, and any follow-on persistence, credential-access, or
    lateral-movement activity.'
