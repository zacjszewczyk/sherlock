- question: 'Using deterministic rule logic, can you confirm this group-modification activity is malicious?
    Specifically: Maintain a centrally managed allowlist of accounts authorized to modify each sensitive
    group; on Event ID 4732/4728/4756 alert when SubjectUserName is not authorized for the TargetUserName
    (group), or when the actor is a service/non-interactive account ([Microsoft 4732 reference](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4732)).'
  context: 'Tactic context (Persistence): the adversary adds an account to a privileged local or domain
    group, which under Persistence lets them keep or elevate access across restarts and credential changes.
    Evidence under investigation: A non-administrative account or a service account adds a member to a
    sensitive group, or such a change occurs at a statistically unusual time outside of standard change
    windows. Approach: Maintain a centrally managed allowlist of accounts authorized to modify each sensitive
    group; on Event ID 4732/4728/4756 alert when SubjectUserName is not authorized for the TargetUserName
    (group), or when the actor is a service/non-interactive account ([Microsoft 4732 reference](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4732)).
