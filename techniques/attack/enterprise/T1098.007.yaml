name: 'T1098.007: Additional Local or Domain Groups'
id: 8a420d7f-25d9-4b68-8ea2-075ce6cc5d8e
description: This playbook helps an analyst investigate adversary abuse of MITRE ATT&CK T1098.007 (Additional
  Local or Domain Groups), in which an actor adds a controlled user or machine account to privileged local
  or domain groups to maintain persistence (TA0003) or to escalate privileges (TA0004). On Windows the
  adversary uses net.exe/net1.exe or PowerShell cmdlets (Add-LocalGroupMember, Add-ADGroupMember) and
  the change is recorded by Security events 4728, 4732, and 4756; on Linux the actor abuses usermod, gpasswd,
  or direct /etc/group edits (auditd), and on macOS dseditgroup/dscl. The playbook correlates group-modification
  events with the modifying logon session and its source IP/ASN (Event ID 4624, Zeek conn.log), suspicious
  parent processes spawning the modification (Event ID 4688), unauthorized or off-hours actors changing
  sensitive groups (Administrators, Domain Admins, Enterprise Admins, Remote Desktop Users, Server Operators,
  Distributed COM Users), machine accounts (names ending in '$') added to domain groups and then logging
  on interactively or requesting unusual Kerberos tickets (Event ID 4769, Zeek kerberos.log), and rapid
  follow-on activity such as scheduled-task/service/registry persistence (4698, 7045, 4657) or credential
  access (LSASS/ntdsutil/SAM) and lateral movement after the add. Detection blends symbolic-logic correlation
  rules, statistical baselining (source/ASN edge-rarity, Shannon entropy, time-delta percentiles, change-point
  detection), and machine learning (Random Forest/Isolation Forest, NLP username classifiers, peer-group
  UEBA, graph and LSTM/transformer sequence models) to produce explainable, evasion-resistant alerts for
  SOC analysts.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
