- question: 'Using a machine-learning model, can you score this group-modification activity as anomalous?
    Specifically: Train a classifier (e.g., Random Forest) or an unsupervised [Isolation Forest](https://doi.org/10.1145/2133360.2133363)
    on features [IP geolocation/ASN, hour-of-day, day-of-week, target group, new-source-for-user flag,
    prior failed-logon count, accounts-added count]. Emit a probability and, per the explainability requirement,
    surface the top-3 contributing features in the alert text (e.g., ''new ASN, off-hours, Remote Desktop
    Users target''). Alert above a tuned threshold (start ~0.90). Baseline data: [LANL auth dataset](https://csr.lanl.gov/data/auth/),
    [CERT insider dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
