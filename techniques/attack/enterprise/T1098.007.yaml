      failed logons (4625) and failed/denied modifications from the same source in the prior hour as a
      corroborating signal.

      ALERT WHERE metric EXCEEDS learned_threshold'
- question: 'Using statistical baselining, can you detect anomalous group-modification behavior here?
    Specifically: For the modifying session, compute Volume and Frequency metrics — number of distinct
    accounts added to privileged groups per session and group-add events per minute — and alert when either
    exceeds the per-actor 99th percentile, consistent with change-point monitoring of per-user/per-group
    rate series in [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
