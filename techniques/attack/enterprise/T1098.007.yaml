  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Statistical baseline for group modification (T1098.007)

      AGGREGATE group_mod_events BY actor, target_group OVER baseline_window

      COMPUTE metric (rarity / entropy / rate / time-delta percentile)

      // Action: For each modifying account build a 90-day historical profile of source IP, ASN, and country
      from Event ID 4624 logons; flag any group-modification whose source ASN/country pair is in the bottom
