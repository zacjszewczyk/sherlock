- question: 'Using statistical baselining, can you detect anomalous group-modification behavior here?
    Specifically: Per host, profile 30-day parent-child relationships for net.exe/powershell.exe and compute
    the Shannon entropy of the parent-process distribution; alert on entropy spikes or any parent with
    frequency below a floor (seen <5 times). Track the State signal: include failed/exit-code-nonzero
    process terminations to distinguish probing from successful modification.'
