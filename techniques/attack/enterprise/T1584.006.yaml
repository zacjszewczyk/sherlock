    corroborated with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    living-off-the-land, or CDN-fronted abuse of common web services.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - Zeek pe.log
  - 'NAI: Endpoints receiving file downloads, network egress points where file transfers can be monitored,
    and sandboxing environments.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = per_host_download_rate_and_size_timeseries

      model = OnlineAutoencoderEnsemble(Kitsune) OR LSTM

      err = model.reconstruction_error(seq)

      EMIT alert WITH top_features = SHAP(model) IF err > dynamic_threshold'
