    TLS handshakes, HTTP 4xx/5xx, and reset connections to web-service domains; a burst of failures preceding
    success can indicate token brute-forcing or infrastructure rotation, consistent with the fast-flux
    agility features in [FluxBuster](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable abuse
    of a third-party web service; pivot to the responsible host, user, and process lineage, the destination
    web-service domain/IP and its TLS fingerprint, and the volume, cadence, and content of the transfer
    to scope intent and impact. A negative result helps rule out this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    living-off-the-land, or CDN-fronted abuse of common web services.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Egress points of the network (e.g., firewalls, proxies), DNS resolvers, and web gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each host, window=1h:\n  fail = count(tls_handshake_fail) + count(http_status IN 4xx,5xx)\
      \ + count(conn_state RST)\n  rate = fail / total_conn_to_webservice\n  FLAG IF burst_of_failures\
      \ THEN success  # token brute-force / infra rotation (FluxBuster)\n  COMPARE rate TO baseline_30d[host]"
- question: '[Resource Development] Encrypted-traffic classification with explanation: Can you identify
    evidence that a network connection event where the destination IP address, DNS query, HTTP Host header,
    or SSL/TLS Server Name Indication (SNI) matches a known malicious indicator from a threat intelligence
    feed of infrastructure associated with abused web services. -- specifically, using the ''Encrypted-traffic
    classification with explanation'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary compromises
    access to legitimate third-party web services and repurposes them as infrastructure to support targeting,
    later abusing them for command and control, exfiltration, or phishing while hiding in the noise of
    trusted, encrypted services. This evidence focuses on the condition that a network connection event
    where the destination IP address, DNS query, HTTP Host header, or SSL/TLS Server Name Indication (SNI)
    matches a known malicious indicator from a threat intelligence feed of infrastructure associated with
    abused web services. This Machine Learning approach works as follows: Score connection metadata (duration,
    bytes, ratio, packet sizes/timings, JA3/JA4) with Random Forest/Gradient Boosting; adopt the version-agnostic
    flow features of [Novo et al.](https://github.com/CarlosANovo/extending12to13) to retain efficacy
    under TLS 1.3, and surface the top-3 [SHAP](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)
    contributing features in the alert text rather than only a score. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable abuse of a third-party web service; pivot
    to the responsible host, user, and process lineage, the destination web-service domain/IP and its
    TLS fingerprint, and the volume, cadence, and content of the transfer to scope intent and impact.
    A negative result helps rule out this particular vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, low-and-slow, living-off-the-land,
    or CDN-fronted abuse of common web services.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Egress points of the network (e.g., firewalls, proxies), DNS resolvers, and web gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [duration, bytes_sent, bytes_recv, ratio, pkt_sizes, iat, ja3, ja4]

      model = RandomForest/GradientBoosting(version_agnostic_flow_features)  # Novo et al., TLS1.3

      score = model.predict_proba(features)

      EMIT alert WITH top3_features = SHAP(model, features) IF score > threshold'
- question: '[Resource Development] Hash/signature and MIME-mismatch matching for downloads: Can you identify
    evidence that a file is downloaded from a web service where its MIME type mismatches the file extension,
    its hash matches a known malicious signature, or its content has an entropy level statistically indicative
    of packing or encryption. -- specifically, using the ''Hash/signature and MIME-mismatch matching for
    downloads'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary compromises
