    access to legitimate third-party web services and repurposes them as infrastructure to support targeting,
    later abusing them for command and control, exfiltration, or phishing while hiding in the noise of
    trusted, encrypted services. This evidence focuses on the condition that a network connection from
    a host not associated with development or IT administration to a raw content URL of a code repository
    (e.g., raw.githubusercontent.com, pastebin.com/raw) using a non-standard browser User-Agent. This
    Symbolic Logic approach works as follows: Alert when raw-content hosts (raw.githubusercontent.com,
    pastebin.com/raw, gist) are accessed with PowerShell/curl/wget/certutil user agents by non-developer
    hosts, or by a client whose [JA4H HTTP fingerprint](https://github.com/FoxIO-LLC/ja4) is non-browser,
    per [SigmaHQ download-cradle rules](https://github.com/SigmaHQ/sigma). A positive result -- a rule
    match, statistical outlier, or model alert -- indicates probable abuse of a third-party web service;
    pivot to the responsible host, user, and process lineage, the destination web-service domain/IP and
    its TLS fingerprint, and the volume, cadence, and content of the transfer to scope intent and impact.
    A negative result helps rule out this particular vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, low-and-slow, living-off-the-land,
    or CDN-fronted abuse of common web services.'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - 'NAI: Non-developer user workstations, production server subnets, and network proxy logs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "alert = http WHERE host IN [raw.githubusercontent.com, pastebin.com/raw, gist.*]\n       \
      \    AND (user_agent MATCHES /powershell|curl|wget|certutil/i\n                OR ja4h_fingerprint\
      \ NOT IN browsers)\n           AND src_host NOT IN developer_hosts   # SigmaHQ download-cradle\n\
      EMIT alert"
