- question: '[Resource Development] Self-supervised clustering for anomalous transfers: Can you identify
    evidence that a network connection to a cloud storage service where the total data volume (bytes sent
    or received) for a single session or aggregated over a 24-hour period significantly exceeds the established
    baseline for the source host or user account. -- specifically, using the ''Self-supervised clustering
    for anomalous transfers'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary compromises
    access to legitimate third-party web services and repurposes them as infrastructure to support targeting,
    later abusing them for command and control, exfiltration, or phishing while hiding in the noise of
    trusted, encrypted services. This evidence focuses on the condition that a network connection to a
    cloud storage service where the total data volume (bytes sent or received) for a single session or
    aggregated over a 24-hour period significantly exceeds the established baseline for the source host
    or user account. This Machine Learning approach works as follows: Cluster connection metadata (duration,
    bytes, ratio, periodicity) with DBSCAN and/or self-supervised encrypted-flow representations ([ET-SSL](https://www.nature.com/articles/s41598-025-08568-0));
    flag anomalous clusters and surface the top-3 contributing features via [SHAP](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable abuse
    of a third-party web service; pivot to the responsible host, user, and process lineage, the destination
    web-service domain/IP and its TLS fingerprint, and the volume, cadence, and content of the transfer
    to scope intent and impact. A negative result helps rule out this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    living-off-the-land, or CDN-fronted abuse of common web services.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 4624
  - 'NAI: Network egress points, user endpoint devices, and Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [duration, bytes, ratio, periodicity]

      clusters = DBSCAN(features) OR ET_SSL_encrypted_flow_representation

      EMIT anomalous_clusters WITH top3_features = SHAP() '
- question: '[Resource Development] URI/User-Agent allowlist enforcement for raw content: Can you identify
