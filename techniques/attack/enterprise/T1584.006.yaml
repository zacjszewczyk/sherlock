name: 'T1584.006: Web Services'
id: b533f669-f826-400e-a1c3-8acb9ef2725b
description: 'This playbook helps an analyst investigate whether an adversary is leveraging compromised
  or malicious third-party web services as infrastructure against the network, an indicator of prior adversary
  resource development (MITRE ATT&CK T1584.006, Web Services, under Resource Development TA0042). Adversaries
  take ownership of legitimate users'' access to popular web services such as GitHub, Twitter, Dropbox,
  Google, SendGrid, and pastebin, then abuse them during later stages of the lifecycle for command and
  control (T1102), exfiltration over web service (T1567), or phishing (T1566). Because these services
  blend into expected enterprise noise and are encrypted by default, much of the adversary''s activity
  occurs outside the target''s visibility, so detection focuses on the observable network and endpoint
  traces. The hunt pursues the behavior from several complementary angles: outbound connections (conn/http/ssl/dns)
  that match threat-intelligence indicators or non-sanctioned TLS JA3/JA4 fingerprints for popular web
  services; beaconing periodicity and volume scoring; failed-handshake and HTTP-error burst profiling
  that can reveal token brute-forcing or infrastructure rotation; suspicious file downloads from web services
  (hash/YARA matches, MIME/extension mismatch, non-browser user agents, high Shannon entropy indicative
  of packing); anomalous data volume and inverted upload:download ratios to cloud-storage services; and
  access to raw code-repository content (raw.githubusercontent.com, pastebin.com/raw, gist) by scripting
  clients (PowerShell, curl, wget, certutil) from non-developer hosts. Detection methods combine deterministic
  symbolic-logic rules (TI watchlists, JA3/JA4/JA4H fingerprint allowlists, SigmaHQ download-cradle rules),
  statistical baselining (beaconing CV/FFT, 95th/99th-percentile volume thresholds, failure-rate and 404/NXDOMAIN
  burst profiling, entropy anomalies), and machine learning (Random Forest/Gradient Boosting encrypted-traffic
  classification, online autoencoder ensembles such as Kitsune, and self-supervised clustering), with
  SHAP-based feature explanations, applied across Zeek conn/http/ssl/dns/files/pe logs, Windows Event
  IDs 4624/4688, and CASB telemetry, so the analyst can corroborate suspected abuse of third-party web
  services across network fingerprints, download content, transfer volume, and host role.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
