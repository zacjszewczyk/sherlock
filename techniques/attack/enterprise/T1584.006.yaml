questions:
- question: '[Resource Development] TI and TLS-fingerprint correlation for abused web services: Can you
    identify evidence that a network connection event where the destination IP address, DNS query, HTTP
    Host header, or SSL/TLS Server Name Indication (SNI) matches a known malicious indicator from a threat
    intelligence feed of infrastructure associated with abused web services. -- specifically, using the
    ''TI and TLS-fingerprint correlation for abused web services'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary compromises
    access to legitimate third-party web services and repurposes them as infrastructure to support targeting,
    later abusing them for command and control, exfiltration, or phishing while hiding in the noise of
    trusted, encrypted services. This evidence focuses on the condition that a network connection event
    where the destination IP address, DNS query, HTTP Host header, or SSL/TLS Server Name Indication (SNI)
    matches a known malicious indicator from a threat intelligence feed of infrastructure associated with
    abused web services. This Symbolic Logic approach works as follows: Alert when Zeek conn/http/ssl/dns
    entries match TI-listed malicious web-service indicators (IP, domain, HTTP Host, SNI, URI), or when
    the client''s TLS [JA3/JA3S fingerprint](https://github.com/salesforce/ja3) or [JA4+ fingerprint](https://github.com/FoxIO-LLC/ja4)
    connecting to a popular web service matches a known implant fingerprint or is absent from the sanctioned-browser
    allowlist. Enrich with passive-DNS reputation (short-lived domains, high IP fan-out) per [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)
    and ship the matched rule/indicator name in the alert. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable abuse of a third-party web service; pivot to the responsible
    host, user, and process lineage, the destination web-service domain/IP and its TLS fingerprint, and
    the volume, cadence, and content of the transfer to scope intent and impact. A negative result helps
    rule out this particular vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, low-and-slow, living-off-the-land, or CDN-fronted abuse of
    common web services.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Egress points of the network (e.g., firewalls, proxies), DNS resolvers, and web gateways.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "conn = LOAD zeek.conn, http, ssl, dns\nti = LOAD threat_intel(indicator_type IN [ip,domain,host,sni,uri])\n\
      alert = conn WHERE id.resp_h IN ti.ip OR query IN ti.domain OR http.host IN ti.host\n          \
      \   OR ssl.server_name IN ti.sni OR http.uri IN ti.uri\n             OR (ssl.ja3 IN known_implant_ja3\
      \ OR ssl.ja3 NOT IN sanctioned_browser_allowlist)\nENRICH alert WITH passive_dns(reputation, domain_age<7d,\
      \ ip_fanout_high)  # EXPOSURE\nEMIT alert WITH matched_rule_name, matched_indicator"
- question: '[Resource Development] Beaconing periodicity and volume scoring: Can you identify evidence
    that a network connection event where the destination IP address, DNS query, HTTP Host header, or
    SSL/TLS Server Name Indication (SNI) matches a known malicious indicator from a threat intelligence
    feed of infrastructure associated with abused web services. -- specifically, using the ''Beaconing
    periodicity and volume scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary compromises
    access to legitimate third-party web services and repurposes them as infrastructure to support targeting,
    later abusing them for command and control, exfiltration, or phishing while hiding in the noise of
    trusted, encrypted services. This evidence focuses on the condition that a network connection event
    where the destination IP address, DNS query, HTTP Host header, or SSL/TLS Server Name Indication (SNI)
    matches a known malicious indicator from a threat intelligence feed of infrastructure associated with
    abused web services. This Statistical Method approach works as follows: Per (host,destination) baseline
    connection inter-arrival times and bytes; flag periodic beacons via FFT/coefficient-of-variation as
    in [RITA](https://github.com/activecm/rita) (e.g., CV < 0.1 over >=24 connections in 24h) using the
    jitter-robust ranking of [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks),
    and flag per-host connection counts to a single web-service domain above the 95th percentile of the
    30-day baseline. Compute Volume (bytes sent/received and upload:download ratio), Frequency (connections/min),
    and State (handshake success vs failure). Derive thresholds per host-role cohort. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable abuse of a third-party
    web service; pivot to the responsible host, user, and process lineage, the destination web-service
    domain/IP and its TLS fingerprint, and the volume, cadence, and content of the transfer to scope intent
    and impact. A negative result helps rule out this particular vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy, low-and-slow, living-off-the-land,
    or CDN-fronted abuse of common web services.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Egress points of the network (e.g., firewalls, proxies), DNS resolvers, and web gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each (host, dest_domain):\n  intervals = diff(sort(conn.ts))\n  cv = stddev(intervals)/mean(intervals)\n\
      \  beacon = (cv < 0.1 AND count(conn) >= 24 within 24h)   # RITA / BAYWATCH FFT+jitter\n  conn_count\
      \ = count(conn)\n  vol_out = sum(bytes_sent); ratio = bytes_sent/bytes_recv\n  freq = count/min;\
      \ state = handshake_success_vs_fail\n  FLAG IF beacon OR conn_count > p95(baseline_30d[host_role])"
- question: '[Resource Development] Failure-rate profiling for web-service connections: Can you identify
    evidence that a network connection event where the destination IP address, DNS query, HTTP Host header,
    or SSL/TLS Server Name Indication (SNI) matches a known malicious indicator from a threat intelligence
    feed of infrastructure associated with abused web services. -- specifically, using the ''Failure-rate
