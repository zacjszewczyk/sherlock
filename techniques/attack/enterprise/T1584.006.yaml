    to a raw content URL of a code repository (e.g., raw.githubusercontent.com, pastebin.com/raw) using
    a non-standard browser User-Agent. -- specifically, using the ''URI/User-Agent allowlist enforcement
    for raw content'' (Symbolic Logic) approach?'
