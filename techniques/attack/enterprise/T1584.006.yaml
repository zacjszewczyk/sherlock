    trusted, encrypted services. This evidence focuses on the condition that a file is downloaded from
    a web service where its MIME type mismatches the file extension, its hash matches a known malicious
    signature, or its content has an entropy level statistically indicative of packing or encryption.
    This Symbolic Logic approach works as follows: Alert when Zeek files/pe logs match known malicious
    hashes or [Cobalt Strike/C2 YARA signatures](https://github.com/Neo23x0/signature-base/blob/master/yara/apt_cobaltstrike.yar),
    when a download''s MIME type mismatches its file extension, or when an executable/script is fetched
    from a web service by a non-browser user agent, per [SigmaHQ rules](https://github.com/SigmaHQ/sigma).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable abuse
    of a third-party web service; pivot to the responsible host, user, and process lineage, the destination
    web-service domain/IP and its TLS fingerprint, and the volume, cadence, and content of the transfer
    to scope intent and impact. A negative result helps rule out this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    living-off-the-land, or CDN-fronted abuse of common web services.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - Zeek pe.log
  - 'NAI: Endpoints receiving file downloads, network egress points where file transfers can be monitored,
    and sandboxing environments.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "files = LOAD zeek.files, pe, http\nalert = files WHERE sha256 IN malicious_hashes\n      \
      \       OR yara_match(cobaltstrike_c2_rules)        # signature-base\n             OR mime_type\
      \ NOT consistent_with file_extension\n             OR (is_executable_or_script AND http.user_agent\
      \ NOT IN browsers)  # SigmaHQ\nEMIT alert"
- question: '[Resource Development] Entropy and volume anomaly scoring for downloads: Can you identify
    evidence that a file is downloaded from a web service where its MIME type mismatches the file extension,
    its hash matches a known malicious signature, or its content has an entropy level statistically indicative
    of packing or encryption. -- specifically, using the ''Entropy and volume anomaly scoring for downloads''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary compromises
    access to legitimate third-party web services and repurposes them as infrastructure to support targeting,
    later abusing them for command and control, exfiltration, or phishing while hiding in the noise of
    trusted, encrypted services. This evidence focuses on the condition that a file is downloaded from
    a web service where its MIME type mismatches the file extension, its hash matches a known malicious
    signature, or its content has an entropy level statistically indicative of packing or encryption.
    This Statistical Method approach works as follows: Flag downloads whose byte-level Shannon entropy
    exceeds ~7.0 (indicative of packing/encryption) or is >3 std dev above the per-MIME baseline, applying
    the Shannon-entropy anomaly-feature approach of [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf),
    especially when a child process spawns within 5 minutes (State: execution). Also baseline download
    count/bytes per host (Volume/Frequency). A positive result -- a rule match, statistical outlier, or
    model alert -- indicates probable abuse of a third-party web service; pivot to the responsible host,
    user, and process lineage, the destination web-service domain/IP and its TLS fingerprint, and the
    volume, cadence, and content of the transfer to scope intent and impact. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, living-off-the-land, or CDN-fronted abuse of common
    web services.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4688
  - Zeek pe.log
  - 'NAI: Endpoints receiving file downloads, network egress points where file transfers can be monitored,
    and sandboxing environments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each download:\n  H = shannon_entropy(bytes)\n  FLAG IF H > 7.0 OR H > mean(mime_baseline)+3*std\
      \   # Nadler et al.\n  ESCALATE IF child_process_spawned within 5min (Event 4688)  # State: execution\n\
      BASELINE download_count, bytes per host (Volume/Frequency)"
