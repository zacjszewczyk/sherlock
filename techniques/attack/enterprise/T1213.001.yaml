questions:
- question: '[Collection] Threat feed login correlation (Symbolic Logic): Can you determine whether a
    login to Confluence originates from a known-malicious IP/ASN or a previously flagged/compromised account,
    or is preceded by a burst of failed logons (credential stuffing/brute force) before a success. --
    specifically using the ''Threat feed login correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary leverages Confluence
    repositories to mine valuable information such as credentials, network and system diagrams, and internal
    documentation, leaving traces across Confluence audit logs, identity events, and network telemetry.
    This evidence focuses on the condition that a login to Confluence originates from a known-malicious
    IP/ASN or a previously flagged/compromised account, or is preceded by a burst of failed logons (credential
    stuffing/brute force) before a success. This Symbolic Logic approach pursues the following signal:
    Join Confluence audit-log login events (Auditing in Confluence (https://confluence.atlassian.com/doc/auditing-in-confluence-829076528.html))
    and Zeek conn.log with malicious-IP/ASN and compromised-credential feeds; alert on any source IP or
    username match. A rule match indicates the specific condition was met and warrants immediate triage
    of the responsible identity, source IP/ASN, session, and the pages/spaces or hosts involved. A negative
    result helps reduce suspicion for this particular vector but should be corroborated with the other
    questions in this playbook, since any single method can miss stealthy, low-and-slow, or living-off-the-land
    Confluence data collection.'
  answer_sources:
  - Confluence audit log (login/security events)
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Confluence web server / SaaS tenant, Network gateway/firewall, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Threat feed login correlation

      source IN [Confluence audit log (login/security events), Zeek conn.log, Windows Event ID 4624, Windows
      Event ID 4625]

      | apply rule: Join Confluence audit-log login events (Auditing in Confluence (https://confluence.atlassian.com/doc/auditing-in-confluence-829076528.html))
      and Zeek conn.log with malicious-IP/ASN and compromised-credential feeds; alert on any source IP
      or username match.

      | emit alert with identity, source_ip, asn, session_id, pages_or_hosts'
