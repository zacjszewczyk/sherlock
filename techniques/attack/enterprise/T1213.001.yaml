- question: '[Collection] Failed-logon burst (state) (Statistical Method): Can you determine whether a
    login to Confluence originates from a known-malicious IP/ASN or a previously flagged/compromised account,
    or is preceded by a burst of failed logons (credential stuffing/brute force) before a success. --
    specifically using the ''Failed-logon burst (state)'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary leverages Confluence
    repositories to mine valuable information such as credentials, network and system diagrams, and internal
    documentation, leaving traces across Confluence audit logs, identity events, and network telemetry.
    This evidence focuses on the condition that a login to Confluence originates from a known-malicious
    IP/ASN or a previously flagged/compromised account, or is preceded by a burst of failed logons (credential
    stuffing/brute force) before a success. This Statistical Method approach pursues the following signal:
    Profile per-account failed-logon (EID 4625 / audit security-fail) rate and alert when a success (EID
    4624) is preceded by >=10 failures in 5 min or a 3.5 modified-Z-score (MAD) spike over the 30-day
    baseline (DEW #145: Modified Z-Score for Anomaly Detection (https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly));
    a high failure-to-success ratio is a distinct brute-force/stuffing signal. A statistical outlier flags
    behavior that deviates sharply from the user''s own and/or peer-group baseline and should be reviewed
    against role, time-of-day, and the data accessed. A negative result helps reduce suspicion for this
    particular vector but should be corroborated with the other questions in this playbook, since any
    single method can miss stealthy, low-and-slow, or living-off-the-land Confluence data collection.'
