name: 'T1213.001: Confluence'
id: 9627ab49-c642-4ea5-9084-3fb4274b377c
description: 'This playbook helps an analyst investigate whether an adversary is mining sensitive information
  from Atlassian Confluence repositories as part of the Collection tactic (TA0009). Confluence often stores
  policies and procedures, network and system architecture diagrams, technical documentation, testing/development
  credentials, project schedules, source-code snippets, and links to internal network shares, making it
  a high-value target for both external intruders using harvested credentials and malicious insiders.
  The playbook guides the hunt across several behavioral angles: suspicious or compromised logins (threat-feed/IOC
  matches, impossible-travel, failed-logon bursts preceding a success, rare-ASN, and ML login-risk scoring);
  anomalous search behavior (watchlisted sensitive-keyword searches, robust search-volume baselining,
  masquerade/breadth scoring, topic entropy, and high zero-result/denied rates indicating enumeration);
  programmatic/scraping access (deny-listed non-browser User-Agents, robot traffic-pattern scoring, and
  session-sequence anomaly detection); bulk collection (rule-based and statistically baselined unique-page
  views, exports, and byte volume against individual and peer-group norms, plus Isolation Forest and clustering
  outliers); privileged or dormant account access and uncommon-for-role actions; indiscriminate browsing
  of historically unpopular or unauthorized spaces (cold-page spikes and graph-community anomalies); and
  post-collection lateral movement where a flagged account first authenticates to other internal systems.
  Detection methods combine symbolic-logic rules, statistical baselining, and machine-learning models
  applied to Confluence audit logs, Zeek conn/http/files logs, and Windows Security events (4624/4625/4648),
  so the analyst can corroborate suspected Confluence data mining against identity, search, access-volume,
  role, and lateral-movement context.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
