name: 'T1574.014: Hijack Execution Flow: AppDomainManager'
id: e71367de-c883-4f46-9fe4-2b83c1695a2f
description: 'This playbook helps an analyst investigate whether an adversary is hijacking the .NET AppDomainManager
  (T1574.014, "AppDomainManager injection") to execute malicious payloads inside trusted, signed .NET
  applications and to establish stealthy persistence and execution. Attackers redirect assembly loading
  by tampering with .config files (adding <appDomainManagerAssembly>/<appDomainManagerType> inside a <runtime>
  block, often a <binary>.exe.config dropped beside a signed executable), by setting COMPLUS_AppDomainManager_Assembly/Type,
  APPDOMAIN_MANAGER_ASM/TYPE, or DOTNET_ environment variables, or by creating custom application domains
  in a target process. The hunt spans Windows endpoint telemetry (Sysmon process creation, module load,
  file/registry events, process access; Security 4688/4698/4720/7045) and network telemetry (Zeek conn/dns/ssl
  logs). It guides the analyst across several behavioral angles: .NET processes (those loading clr.dll/coreclr.dll)
  loading unsigned, rare, or known-malicious modules or reaching C2; AppDomainManager environment-variable
  and .config tampering; rapid follow-on persistence (Scheduled Tasks, Services, Run keys) and robotic
  beaconing; high-integrity .NET processes loading rare modules; low-privilege modification of high-privilege
  .NET configs for escalation; SYSTEM .NET services spawning odd shells or creating admin accounts; trusted
  .NET binaries (MSBuild.exe, InstallUtil.exe) making anomalous connections with rare ASNs/JA3 or DGA-like
  DNS; scripting interpreters injecting COMPLUS before launching a .NET child; and .NET LOLbins writing
  executables to odd paths or touching credential stores and lsass. Detection methods combine symbolic-logic
  rules, statistical baselining/rarity/entropy scoring, and machine-learning models (Isolation Forest,
  sequence/LSTM, provenance graph, time-series forecasting) so the analyst can corroborate suspected AppDomainManager
  hijacking across config/environment indicators, module loads, process lineage, and network behavior.'
type: technique
