questions:
- question: '[Stealth] Correlate module hashes and connections with threat intelligence: Can you determine
    whether a .NET process (i.e., a process that has loaded clr.dll or coreclr.dll) loads an unsigned
    DLL module, a DLL with low enterprise-wide prevalence, or initiates a network connection to a destination
    matching known command-and-control (C2) indicators, especially after AppDomainManager configuration
    tampering. -- specifically, using the ''Correlate module hashes and connections with threat intelligence''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), this evidence relates to the information
    requirement "Is the adversary establishing persistence by hijacking the .NET AppDomainManager?" Adversaries
    abuse the .NET AppDomainManager to hijack how trusted .NET applications load assemblies -- via tampered
    .config files, COMPLUS_/DOTNET_/APPDOMAIN_MANAGER environment variables, or custom application domains
    -- so an otherwise benign, signed process executes attacker-controlled code, blending malicious activity
    into legitimate runtime behavior. This evidence focuses on the condition that a .NET process (i.e.,
    a process that has loaded clr.dll or coreclr.dll) loads an unsigned DLL module, a DLL with low enterprise-wide
    prevalence, or initiates a network connection to a destination matching known command-and-control
    (C2) indicators, especially after AppDomainManager configuration tampering. This Symbolic Logic approach
    works as follows: Correlate the hashes of modules loaded by .NET processes (those that loaded clr.dll/coreclr.dll)
    (Windows Event ID 7) and destination IPs/domains from their connections (Windows Event ID 3, Zeek
    conn.log, Zeek dns.log) against a threat-intelligence feed; alert on any match. Because an assembly
    loaded as a custom AppDomain manager may NOT raise a Sysmon ImageLoad (EID 7) event [AppDomainManager
    Injection and Detection, Pentest Laboratories](https://pentestlaboratories.com/2020/05/26/appdomainmanager-injection-and-detection/),
    ALSO alert when a .NET process resolves an assembly whose name appears in an <appDomainManagerAssembly>
    config element or a COMPLUS_/DOTNET_/APPDOMAIN_MANAGER_ASM variable for that process [Application
    Domains, Microsoft](https://learn.microsoft.com/en-us/dotnet/framework/app-domains/application-domains).
    Alert text must name the matching IOC, the loading process, and its integrity level. A positive result
    -- a rule match, statistical outlier, or model alert -- is a strong signal of AppDomainManager hijacking;
    pivot to the responsible process and its parent lineage, the user and integrity level, any config/environment-variable
    indicator, the loaded assembly or module, and any downstream persistence, child process, or external
    connection. A negative result helps rule out this particular vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy, living-off-the-land
    AppDomainManager abuse.'
