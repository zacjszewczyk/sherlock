    (C2) indicators, especially after AppDomainManager configuration tampering. This Statistical Method
    approach works as follows: For each .NET process compute enterprise-wide prevalence (host count) of
    every loaded module hash [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365);
    flag modules that are unsigned AND present on <1% of endpoints (derive a concrete floor from fleet
    size, e.g. <5 of 10,000 hosts). Baseline destination ASNs per process and alert on connections to
    ASNs in the 99th rarity percentile. Failure-mode signal: count failed/blocked outbound connections
    (Zeek conn.log conn_state S0/REJ/RSTO, EID 3 denied) per process per hour — a spike of failed connects
    from a normally quiet .NET host is itself suspicious. Surface the top-3 contributing features (module
    name+prevalence, ASN, failed-conn count) in the alert. A positive result -- a rule match, statistical
    outlier, or model alert -- is a strong signal of AppDomainManager hijacking; pivot to the responsible
    process and its parent lineage, the user and integrity level, any config/environment-variable indicator,
    the loaded assembly or module, and any downstream persistence, child process, or external connection.
