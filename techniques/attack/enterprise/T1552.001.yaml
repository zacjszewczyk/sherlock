name: 'T1552.001: Credentials In Files'
id: 3c42a67f-edcd-40d1-aeec-5df923498e2f
description: 'This playbook helps an analyst investigate whether an adversary has searched local file
  systems and remote file shares for, and accessed, insecurely stored credentials -- a Credential Access
  technique (T1552.001). Targets include user-authored password files, shared credential stores, configuration
  files containing passwords (web.config, *.env, *.xml, *.tfvars, Group Policy Preferences cpassword in
  SYSVOL), source/binary files with embedded secrets, private keys (id_rsa, *.pem, *.ppk, *.p12), password
  databases (*.kdbx), and cloud/container credential files (~/.aws/credentials, plist files, mounted secrets
  in /run/secrets and /mnt/config). The hunt spans Windows, Linux, macOS, IaaS/cloud, and container telemetry.
  It guides the analyst across several behavioral angles: execution of known credential-harvesting tooling
  matched by hash; content/filename scanning of read or created files for secret formats and high-entropy
  strings; command lines that combine file-search utilities with credential keywords or credential file
  patterns; anomalous bulk access to many sensitive files across directories in short windows; suspicious
  process lineages where network-facing services spawn shells that read credential paths; and user/peer-group
  deviations in sensitive-file access. Detection methods combine symbolic-logic rules, statistical baselining,
  and machine-learning models (entropy/KL scoring, BERT command-line embeddings, Isolation Forest/COPOD,
  DBSCAN clustering, LSTM/DeepLog sequence anomaly detection, and provenance-graph GNNs such as ThreaTrace
  and KAIROS) applied to Windows Security/Sysmon events, auditd, macOS unified logs, Kubernetes/eBPF telemetry,
  CloudTrail, and Zeek conn.log, so the analyst can corroborate suspected credential-file access against
  process execution, file access, lineage, and downstream authentication or role assumption.'
type: technique
