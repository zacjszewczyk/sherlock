questions:
- question: '[Credential Access] Match credential harvesters to TI: Can you determine whether a process
    creation event where the Process File Hash matches a known credential harvesting tool or script from
    a threat intelligence feed. -- specifically, using the ''Match credential harvesters to TI'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary searches local
    file systems, remote file shares, and cloud/container configuration stores for insecurely stored credentials
    (passwords, API keys, private keys, tokens) so they can authenticate as a legitimate principal without
    triggering password-dumping defenses, leaving traces across process-execution, file-access, process-lineage,
    and authentication telemetry. This evidence focuses on the condition that a process creation event
    where the Process File Hash matches a known credential harvesting tool or script from a threat intelligence
    feed. This Symbolic Logic approach works as follows: Ingest hashes of known credential harvesting
    tools (e.g., LaZagne, Mimikatz). Match these against real-time Process Creation events (Sysmon 1,
    Event 4688). Alert on any positive match. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable discovery or theft of credentials stored in files; pivot to the
    responsible process and its parent lineage, the user and host/container context, the specific credential
    files or paths touched, and any subsequent authentication, SSH/Keychain access, role assumption, or
    outbound connection that would confirm the stolen credentials were used. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, living-off-the-land, or low-and-slow credential harvesting.'
