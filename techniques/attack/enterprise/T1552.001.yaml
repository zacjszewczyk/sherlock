    entropy >4.5 bits/char, hex >3.0 bits/char), filtering placeholders/example values, per [How Bad Can
    It Git?](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_04B-3_Meli_paper.pdf)
    and the scanner/file-pattern inventory in [Committed by Accident](https://arxiv.org/abs/2211.06213).
    Alert text must include the matched key type, file path, and entropy value. A positive result -- a
    rule match, statistical outlier, or model alert -- indicates probable discovery or theft of credentials
    stored in files; pivot to the responsible process and its parent lineage, the user and host/container
    context, the specific credential files or paths touched, and any subsequent authentication, SSH/Keychain
    access, role assumption, or outbound connection that would confirm the stolen credentials were used.
    A negative result helps rule out this particular vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, living-off-the-land, or low-and-slow
    credential harvesting.'
