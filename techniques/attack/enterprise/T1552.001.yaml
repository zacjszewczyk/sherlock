    where the command line includes file-searching utilities combined with keywords indicative of credential
    hunting. This Symbolic Logic approach works as follows: Alert when command lines invoke search utilities
    (`findstr`, `grep`, `Select-String`, `dir /s`, `awk`, `cat`) AND contain credential keywords (password,
    pwd, secret, api[_-]?key, token) OR target credential file patterns (`.env`, `*.pem`, `id_rsa`, `*.kdbx`,
    `*.tfvars`, `*.ppk`, `~/.aws/credentials`, web.config), using the credential file corpus catalogued
    in [Committed by Accident](https://arxiv.org/abs/2211.06213). Layer a Failure Mode signal: a burst
    of access-denied (4663 FailureAudit / EACCES) results during such searches indicates blind enumeration
    and should raise severity. A positive result -- a rule match, statistical outlier, or model alert
    -- indicates probable discovery or theft of credentials stored in files; pivot to the responsible
    process and its parent lineage, the user and host/container context, the specific credential files
    or paths touched, and any subsequent authentication, SSH/Keychain access, role assumption, or outbound
    connection that would confirm the stolen credentials were used. A negative result helps rule out this
    particular vector but should be corroborated with the other questions in this playbook, since a single
    method can miss stealthy, living-off-the-land, or low-and-slow credential harvesting.'
