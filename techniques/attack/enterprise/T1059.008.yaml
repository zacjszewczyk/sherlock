name: 'T1059.008: Network Device CLI'
id: bd27aadb-e409-43ec-8661-5b2c7031493b
description: >-
  Investigate potential adversary abuse of the command-line interface (CLI) and scripting interpreters
  on network infrastructure devices (routers, switches, firewalls, load balancers, VPN concentrators).
  This playbook helps an analyst determine whether an actor has gained or is exercising execution on a
  network device by: correlating remote CLI session sources (SSH/Telnet) against threat intelligence and
  authorized-access baselines; detecting malicious command strings and high-risk command sequences (disabling
  logging, weakening AAA, editing ACLs, creating privileged accounts, altering boot/firmware images);
  tracking failed-then-successful and privilege-escalation authentication patterns; spotting anomalous
  administrative logins by geography, hour, ASN, and session duration; verifying that configuration changes
  map to approved change-management tickets; and identifying suspicious device-originated egress that
  may indicate covert command-and-control. It blends symbolic-logic rules, robust statistical baselining,
  and machine-learning models to surface CLI abuse consistent with firmware implants and appliance compromise
  (e.g., SYNful Knock, CISA AA23-201A) while remaining usable against routine actors and insiders.
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: >-
    Are any remote CLI sessions (SSH or Telnet) to network devices originating from source IP addresses
    that appear on active threat-intelligence feeds, or do captured commands match known malicious signatures?
  context: >-
    Network devices are rarely administered from arbitrary external addresses, so a CLI session that initiates
    from a flagged IP is a high-fidelity lead. Extract source IPs from SSH/Telnet session-initiation events
    in device audit/AAA logs (ensure login logging and command accounting are enabled per the NSA Network
    Infrastructure Security Guide), then enrich each source against current TI feeds and escalate by feed
    confidence. The TI lookup is enrichment only; the first-party device login record is the authoritative
    signal, so absence of a TI match does not clear the session. A positive match warrants immediate review
    of all commands run in that session and the account used. This supports the Execution tactic by revealing
    adversary-controlled code execution on network devices.
  answer_sources:
  - 'Network device audit logs (Cisco: syslog with configuration change events)'
  - TACACS+ server audit logs
  - RADIUS server access logs
  - SSH server logs from network devices (where available)
  - Syslog (RFC 3164/5424 format from network devices)
  - 'NAI: Edge firewalls, core routers, distribution/access layer switches, VPN concentrators, RADIUS/TACACS+
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=netdev_aaa event IN ("SSH login","Telnet login","session_start")
      | rex field=_raw "from (?<src_ip>\d+\.\d+\.\d+\.\d+)"
      | lookup ti_feed_ip ip AS src_ip OUTPUT feed, confidence
      | where isnotnull(feed)
      | table _time device user src_ip feed confidence session_id
- question: >-
    Do executed CLI commands on network devices match a curated database of malicious or high-risk commands
    such as 'config-register' boot bypass, 'reload in', 'no logging', 'no service password-encryption',
    ACL edits, or firmware/image load commands?
  context: >-
    Adversaries manipulate network device behavior through specific high-risk commands: altering the configuration
    register to bypass startup config, scheduling a delayed 'reload in' for persistence, disabling logging
    or password encryption, editing ACLs to permit traffic, or loading altered firmware images. Parse
    executed commands from device audit logs/syslog and match against a curated malicious-command list
    that also includes implant indicators (e.g., module loading over HTTP rather than HTTPS as in SYNful
    Knock, and webshell-spawned discovery commands per CISA AA23-201A). Any match should alert. False
    positives can arise from legitimate maintenance, so correlate with change tickets and the operator
    identity. This supports the Execution tactic by revealing adversary-controlled code execution on network
    devices.
  answer_sources:
  - 'Network device audit logs (Cisco: syslog with configuration change events)'
  - TACACS+ server audit logs
  - RADIUS server access logs
  - SSH server logs from network devices (where available)
  - Syslog (RFC 3164/5424 format from network devices)
  - 'NAI: Edge firewalls, core routers, distribution/access layer switches, VPN concentrators, RADIUS/TACACS+
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=netdev_cmd channel=command_exec
      | eval cmd=lower(command)
      | where match(cmd,"config-register|reload in|no logging|no service password-encryption|access-list|boot system|copy .* flash|tclsh")
      | table _time device user session_id command
- question: >-
    Is there a source IP or user that generated five or more failed CLI logins within five minutes immediately
    followed by a successful login to a network device?
  context: >-
    A burst of authentication failures resolving into a success is a classic brute-force or credential-spray
    precursor to CLI access. Profile per-source/per-user authentication state from AAA logs (the NSA guide
    recommends logging both successful and unsuccessful logins), and alert when >=5 failures occur within
    5 minutes and are followed by a success. Tune the failure threshold per device using observed benign
    typo rates so noisy maintenance hosts do not generate excessive alerts. A positive result indicates
    likely credential compromise on a network device and should trigger session and command review. This
    supports the Execution tactic by revealing adversary-controlled code execution on network devices.
  answer_sources:
  - 'Network device audit logs (Cisco: syslog with configuration change events)'
  - TACACS+ server audit logs
  - RADIUS server access logs
  - SSH server logs from network devices (where available)
  - Syslog (RFC 3164/5424 format from network devices)
  - 'NAI: Edge firewalls, core routers, distribution/access layer switches, VPN concentrators, RADIUS/TACACS+
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      index=netdev_aaa
      | transaction src_ip maxspan=5m
      | eval fails=mvcount(mvfilter(match(status,"fail")))
      | search fails>=5 status="success"
      | table _time device user src_ip fails
- question: >-
    When scored against a 60-day baseline of authorized administrative source IPs, countries, and ASNs,
    do any new CLI sessions accumulate an anomaly score at or above the alert threshold?
  context: >-
    Authorized CLI administration originates from a stable set of source IPs, geolocations, and ASNs.
    Build a 60-day baseline using robust median/MAD thresholds (modified Z-score) rather than mean/std
    so batch maintenance windows do not skew it. Score each new session: +3 unknown IP, +2 unexpected
    country, +1 unusual ASN, +2 if the source's failed-login count is a robust outlier (|modified Z|>3.5).
    Alert when the cumulative score is >=4 and enumerate the contributing factors so the analyst sees
    why the session was flagged. This catches access from novel infrastructure even when no single feature
    is definitively malicious. This supports the Execution tactic by revealing adversary-controlled code
    execution on network devices.
  answer_sources:
  - 'Network device audit logs (Cisco: syslog with configuration change events)'
  - TACACS+ server audit logs
  - RADIUS server access logs
  - SSH server logs from network devices (where available)
  - Syslog (RFC 3164/5424 format from network devices)
  - 'NAI: Edge firewalls, core routers, distribution/access layer switches, VPN concentrators, RADIUS/TACACS+
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = baseline_60d(authorized_admin: src_ip, country, asn)
      score = 3*[ip not in base.ips] + 2*[country not in base.countries] + 1*[asn not in base.asns] + 2*[modZ(failed_logins) > 3.5]
      alert if score >= 4 with contributing_factors
- question: >-
    Within a single administrative session, did an operator run a stateful sequence of concern such as
    disabling logging, then creating a user, then configuring an ACL, within 15 minutes?
  context: >-
    Individual commands can be benign, but ordered combinations reveal intent. Monitor command-accounting
    logs for stateful sequences such as [disable_logging, create_user, configure_acl] occurring within
    15 minutes and trigger a high-severity alert on any match. Maintaining TACACS+ command accounting
    ensures every privileged command is recorded. A positive result strongly indicates an actor establishing
    persistence and reducing visibility, and should be treated as an active compromise pending verification
    against change management. This supports the Execution tactic by revealing adversary-controlled code
    execution on network devices.
  answer_sources:
  - Device syslog with command logging enabled (audit-trail records)
  - TACACS+ server command accounting logs
  - Network device configuration change audit trails
  - Device command history logs (if accessible via out-of-band management)
  - Syslog events for configuration changes (RFC format)
  - 'NAI: Centralized syslog servers, TACACS+/RADIUS authentication servers, core network infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=netdev_cmd channel=command_exec
      | transaction session_id maxspan=15m
      | eval s=mvjoin(command,";")
      | where match(s,"no logging") AND match(s,"username .* priv") AND match(s,"access-list|ip access")
      | table _time device user session_id command
- question: >-
    Did a session escalate privilege (e.g., 'enable') and then immediately perform sensitive configuration
    changes to ACLs, boot parameters, or user accounts, and were there repeated failed 'enable' attempts
    before success?
  context: >-
    Correlate commands within a session to detect privilege escalation followed by sensitive changes.
    Track the success/fail state of 'enable' attempts and flag repeated failed enable attempts preceding
    a success (Frequency + State), as well as the immediate follow-on of ACL/boot/user edits after escalation.
    This pattern distinguishes a routine privileged session from an actor who gained elevation and rapidly
    weaponized it. Positive matches should escalate for review of the operator credential and the specific
    changes made. This supports the Execution tactic by revealing adversary-controlled code execution
    on network devices.
  answer_sources:
  - Device syslog with command logging enabled (audit-trail records)
  - TACACS+ server command accounting logs
  - Network device configuration change audit trails
  - Device command history logs (if accessible via out-of-band management)
  - Syslog events for configuration changes (RFC format)
  - 'NAI: Centralized syslog servers, TACACS+/RADIUS authentication servers, core network infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=netdev_cmd
      | transaction session_id maxspan=20m
      | eval enable_fail=mvcount(mvfilter(match(command,"enable") AND match(status,"fail")))
      | eval s=mvjoin(command,";")
      | where match(s,"enable") AND match(s,"access-list|boot system|username")
      | table _time device user session_id enable_fail command
- question: >-
    When per-user command sequences are modeled as a Markov chain over 90 days, do any sessions contain
    command transitions below 0.01 probability or an overall sequence probability that is a robust outlier?
  context: >-
    Each administrator has habitual command patterns. Model 90-day per-user command sequences as Markov
    chains, estimating transition probabilities between command types (higher-order models separate anomalies
    better). Flag sessions with transitions below 0.01 probability or whose joint sequence probability
    is a robust outlier, and report the specific low-probability transition(s) in the alert. Sequence-based
    anomaly modeling is well established for command/syscall streams. This surfaces unusual operational
    behavior that signature rules miss, such as an attacker improvising on an unfamiliar device. This
    supports the Execution tactic by revealing adversary-controlled code execution on network devices.
  answer_sources:
  - Device syslog with command logging enabled (audit-trail records)
  - TACACS+ server command accounting logs
  - Network device configuration change audit trails
  - Device command history logs (if accessible via out-of-band management)
  - Syslog events for configuration changes (RFC format)
  - 'NAI: Centralized syslog servers, TACACS+/RADIUS authentication servers, core network infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      M = markov_transitions(per_user_cmd_seq, window=90d, order=2)
      for session in sessions:
        probs = [M[prev][cur] for (prev,cur) in pairs(session.cmds)]
        if min(probs) < 0.01 or modZ(joint_prob(session)) is outlier:
          alert(user, session, lowest_prob_transition=argmin(probs))
- question: >-
    Does any session's commands-per-minute or distinct-config-commands-per-session exceed the robust baseline
    (|modified Z|>3.5), indicating automated or scripted CLI abuse?
  context: >-
    Interactive human typing produces a characteristic command rate; scripted abuse produces bursts far
    above it. Compute commands-per-minute and distinct-config-commands-per-session per user, maintain
    robust median/MAD baselines, and alert when a session's command frequency exceeds |modified Z|>3.5.
    A positive result suggests automation pushing configuration en masse, consistent with rapid attacker
    reconfiguration, and merits review of what was changed in that high-rate burst. This supports the
    Execution tactic by revealing adversary-controlled code execution on network devices.
  answer_sources:
  - Device syslog with command logging enabled (audit-trail records)
  - TACACS+ server command accounting logs
  - Network device configuration change audit trails
  - Device command history logs (if accessible via out-of-band management)
  - Syslog events for configuration changes (RFC format)
  - 'NAI: Centralized syslog servers, TACACS+/RADIUS authentication servers, core network infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      per_session: cpm = count(commands)/duration_minutes
      base = robust_baseline(per_user cpm, distinct_config_cmds)
      alert if modZ(cpm) > 3.5 OR modZ(distinct_config_cmds) > 3.5
      | table user session_id cpm distinct_config_cmds
- question: >-
    Using an LSTM next-command predictor trained on benign command-accounting sequences, do any sessions
    execute commands that fall outside the model's top-g predictions, and which specific commands drove
    the anomaly?
  context: >-
    Train an LSTM next-command predictor on benign 90-day command-accounting sequences and flag sessions
    where executed commands fall outside the top-g predictions (DeepLog approach). Use an attention-augmented
    variant to surface the top-3 contributing commands/events driving the anomaly score in the alert text,
    rather than just a reconstruction-error number, so analysts get interpretable leads. This catches
    novel command usage and ordering that statistical baselines may not, while keeping alerts explainable
    and actionable. This supports the Execution tactic by revealing adversary-controlled code execution
    on network devices.
  answer_sources:
  - Device syslog with command logging enabled (audit-trail records)
  - TACACS+ server command accounting logs
  - Network device configuration change audit trails
  - Device command history logs (if accessible via out-of-band management)
  - Syslog events for configuration changes (RFC format)
  - 'NAI: Centralized syslog servers, TACACS+/RADIUS authentication servers, core network infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      model = LSTM_next_cmd.train(benign_cmd_seq_90d)
      for session in sessions:
        for i,cmd in enumerate(session.cmds):
          if cmd not in model.topg(session.cmds[:i]):
            anomalies.append(cmd)
        if anomalies: alert(user, session, top3=attention_rank(anomalies))
- question: >-
    Did any administrative login to a network device originate from a country or region that is not on
    the per-user allowed-geography list?
  context: >-
    Administrators typically connect from a known set of countries. Maintain an allowed-countries/regions
    list per administrative user, extract source-IP geolocation from authentication events, and block/alert
    on any administrative login from a country not on the allow-list. Remote administration should be
    restricted to SSH from approved source ranges per the NSA guide. A login from an unexpected geography
    is a strong anomaly that should trigger immediate verification with the named operator. This supports
    the Execution tactic by revealing adversary-controlled code execution on network devices.
  answer_sources:
  - Device authentication logs (syslog TACACS+/RADIUS events)
  - TACACS+ server authentication audit logs
  - RADIUS server access logs
  - Device login attempt records (syslog)
  - SSH/Telnet session initiation events from device logs
  - 'NAI: VPN concentrators, jump boxes/bastion hosts, network management subnets, Domain Controllers,
    RADIUS/TACACS+ servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=netdev_aaa event="login_success" priv=admin
      | iplocation src_ip
      | lookup admin_geo_allow user OUTPUT allowed_countries
      | where NOT match(allowed_countries, Country)
      | table _time device user src_ip Country
- question: >-
    Is there a user or device with ten or more failed admin logons in ten minutes, or any successful login
    immediately preceded by a robust-outlier spike in failures?
  context: >-
    Profile failed-logon state/frequency per user and per device from AAA logs (log both successful and
    unsuccessful logins). Alert on >=10 failed admin logons within 10 minutes (spray/brute force) or any
    success immediately preceded by a robust-outlier spike in failures. Derive the count threshold from
    each device's benign failed-logon distribution to control noise. This identifies credential-guessing
    campaigns against device management planes before or at the moment they succeed. This supports the
    Execution tactic by revealing adversary-controlled code execution on network devices.
  answer_sources:
  - Device authentication logs (syslog TACACS+/RADIUS events)
  - TACACS+ server authentication audit logs
  - RADIUS server access logs
  - Device login attempt records (syslog)
  - SSH/Telnet session initiation events from device logs
  - 'NAI: VPN concentrators, jump boxes/bastion hosts, network management subnets, Domain Controllers,
    RADIUS/TACACS+ servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      index=netdev_aaa priv=admin
      | bin _time span=10m
      | stats count(eval(status="fail")) AS fails, count(eval(status="success")) AS succ BY user device _time
      | where fails>=10 OR (succ>0 AND modZ(fails) > 3.5)
- question: >-
    When scored against 90-day per-user baselines of login hours, countries, ASNs, and session durations,
    do any administrative logins reach a cumulative risk score of five or more?
  context: >-
    Build per-user 90-day baselines of login hours, source countries, source ASNs, and session durations
    using robust median/MAD. Assign risk points: +3 rare country, +2 unusual ASN, +2 off-hours (outside
    06:00-22:00), +1 session duration |modified Z|>3.5, +2 anomalous prior failed-logon count. Alert when
    the cumulative score is >=5 and enumerate the triggering factors. This multi-factor approach catches
    compromised-but-valid credentials whose usage deviates from the legitimate owner's pattern. This supports
    the Execution tactic by revealing adversary-controlled code execution on network devices.
  answer_sources:
  - Device authentication logs (syslog TACACS+/RADIUS events)
  - TACACS+ server authentication audit logs
  - RADIUS server access logs
  - Device login attempt records (syslog)
  - SSH/Telnet session initiation events from device logs
  - 'NAI: VPN concentrators, jump boxes/bastion hosts, network management subnets, Domain Controllers,
    RADIUS/TACACS+ servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = baseline_90d(user: hours, countries, asns, durations)
      score = 3*[rare_country] + 2*[unusual_asn] + 2*[hour<6 or hour>22] + 1*[modZ(duration)>3.5] + 2*[anomalous_prior_failed_logons]
      alert if score >= 5 with factors
- question: >-
    Does an Isolation Forest (or DBSCAN) over administrative session feature vectors flag any sessions
    as outliers, and which top features explain each flag?
  context: >-
    Run Isolation Forest (or DBSCAN) on session feature vectors [user_id, source_country_code, source_asn,
    hour_of_day, log(session_duration_seconds), login_success_rate, failed_login_count]. Treat noise/short-path
    points as anomalies and attach the top-3 contributing features via SHAP to each alert so analysts
    understand why a session was flagged. Unsupervised clustering surfaces multivariate anomalies that
    single-factor rules miss, and the SHAP attribution keeps the alert triage-ready. This supports the
    Execution tactic by revealing adversary-controlled code execution on network devices.
  answer_sources:
  - Device authentication logs (syslog TACACS+/RADIUS events)
  - TACACS+ server authentication audit logs
  - RADIUS server access logs
  - Device login attempt records (syslog)
  - SSH/Telnet session initiation events from device logs
  - 'NAI: VPN concentrators, jump boxes/bastion hosts, network management subnets, Domain Controllers,
    RADIUS/TACACS+ servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      X = features[user_id, country, asn, hour, log(duration), success_rate, failed_logins]
      model = IsolationForest().fit(X_benign)
      scores = model.decision_function(X)
      for s in where(scores < threshold):
        alert(session=s, top3=shap_top_features(model, s))
- question: >-
    For each configuration-change event on a network device, does an approved change-management ticket
    exist for that device within +/-30 minutes of the change timestamp?
  context: >-
    Legitimate configuration changes should map to approved change requests. For each config-change event
    from device syslog/command-accounting, query the change-management API for an approved ticket on that
    device within +/-30 minutes of the change timestamp, and alert with critical severity if none is found.
    This requires command accounting and centralized logging. An unticketed change, especially outside
    the approved window, is a primary indicator of unauthorized device modification and should be investigated
    against the operator and session that made it. This supports the Execution tactic by revealing adversary-controlled
    code execution on network devices.
  answer_sources:
  - Device configuration change logs (syslog with 'config' events)
  - Configuration backup repositories (timestamped snapshots)
  - TACACS+ accounting logs (command execution records)
  - Device audit trails (if equipped with persistent logging)
  - Change management system (ServiceNow, Jira, or custom systems)
  - 'NAI: Configuration backup repositories, change management system (e.g., ServiceNow, Jira), centralized
    syslog servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=netdev_cmd OR index=netdev_syslog event="config_change"
      | map search="| cmdb_lookup device=$device$ window=+/-30m status=approved"
      | where ticket_count=0
      | table _time device user change session_id
