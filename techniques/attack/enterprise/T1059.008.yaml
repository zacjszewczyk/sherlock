    the anomaly via attention weights rather than reporting only a residual magnitude. This detects abnormal
    bursts or unusual patterns of change activity over time, for example an attacker making clusters of
    edits, while keeping the resulting alert explainable for triage. This supports the Execution tactic
    by revealing adversary-controlled code execution on network devices.
  answer_sources:
  - Device configuration change logs (syslog with 'config' events)
  - Configuration backup repositories (timestamped snapshots)
  - TACACS+ accounting logs (command execution records)
  - Device audit trails (if equipped with persistent logging)
  - Change management system (ServiceNow, Jira, or custom systems)
  - 'NAI: Configuration backup repositories, change management system (e.g., ServiceNow, Jira), centralized
    syslog servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      seq = daily_config_change_counts(per_device)
      model = DeepLog.train(seq_benign)
      for day in seq:
        if day not in model.predict_set(history):
          alert(device, day, drivers=attention_top_events(day))
- question: >-
    Did any network device initiate an outbound connection to a destination IP and port that is not on
    the allow-list of approved operational endpoints (NTP, syslog, TACACS+/RADIUS, SNMP, DNS, repos)?
  context: >-
    Network infrastructure devices should rarely initiate egress, and when they do it should be to a small
    set of operational services. Extract device-originated outbound connections (source in management
    VLAN, destination_ip:port) from NetFlow/sFlow and compare against a curated allow-list. Generate critical
    alerts for any connection off the allow-list. Covert C2 over non-standard channels (e.g., HTTP module
    loading) is a known implant behavior per SYNful Knock and CISA AA23-201A, so unexpected egress is
    a strong compromise indicator demanding immediate investigation. This supports the Execution tactic
    by revealing adversary-controlled code execution on network devices.
  answer_sources:
  - Network flow data from core routers (NetFlow, sFlow, or IPFIX)
  - Firewall rule logs (source=management-VLAN, destination=external)
