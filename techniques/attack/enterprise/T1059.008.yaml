  - Configuration backup repositories (timestamped snapshots)
  - TACACS+ accounting logs (command execution records)
  - Device audit trails (if equipped with persistent logging)
  - Change management system (ServiceNow, Jira, or custom systems)
  - 'NAI: Configuration backup repositories, change management system (e.g., ServiceNow, Jira), centralized
    syslog servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=netdev_cmd
      | eval c=lower(command)
      | where match(c,"no logging|no aaa|no accounting|logging host|boot system|copy .* flash|license boot")
