- question: >-
    When each device's running configuration is diffed daily against its prior backup, is the normalized
    change distance a robust outlier for that device model?
  context: >-
    Daily-diff each device's running-config against the prior backup and compute normalized Levenshtein
    distance to quantify the volume of change. Maintain robust per-device-model baselines and alert when
    the diff distance is a robust outlier (|modified Z|>3.5) for that model. A sudden large configuration
    delta, beyond what that model typically sees day to day, can indicate bulk attacker reconfiguration
    or implant installation, warranting a line-by-line review of the diff. This supports the Execution
    tactic by revealing adversary-controlled code execution on network devices.
  answer_sources:
  - Device configuration change logs (syslog with 'config' events)
  - Configuration backup repositories (timestamped snapshots)
  - TACACS+ accounting logs (command execution records)
  - Device audit trails (if equipped with persistent logging)
  - Change management system (ServiceNow, Jira, or custom systems)
  - 'NAI: Configuration backup repositories, change management system (e.g., ServiceNow, Jira), centralized
    syslog servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      d = norm_levenshtein(running_config_today, backup_yesterday)
      base = robust_baseline(d by device_model)
      alert if modZ(d) > 3.5 with diff_summary(device)
