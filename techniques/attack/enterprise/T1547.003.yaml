name: 'T1547.003: Time Providers'
id: 011eac35-f605-4cf4-90ae-fea5c788fdcd
description: 'Investigate potential abuse of the Windows Time service (W32Time) Time Providers mechanism,
  where adversaries register a malicious DLL under HKLM\System\CurrentControlSet\Services\W32Time\TimeProviders\
  so it is loaded by the time provider manager (svchost hosting W32Time) at boot or on configuration change,
  executing in the Local Service context. This playbook helps an analyst hunt for both persistence and
  privilege-escalation use of this technique: registry writes to a Time Provider ''DllName'' that point
  to non-legitimate, unsigned, world-writable, or low-prevalence DLLs; w32tm.exe /register or /config
  invocations correlated with W32Time service restarts; unauthorized or unusual accounts/processes modifying
  the TimeProviders keys; create->register->load chains spanning integrity levels; and anomalous network
  behavior from the W32Time svchost beyond normal NTP (UDP/123) to the approved server list. Detection
  guidance spans symbolic-logic allowlist/correlation rules, statistical prevalence/frequency/standard-deviation
  baselining, and machine-learning models (DLL/PE classifiers, isolation forests, sequence/provenance
  models).'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
