questions:
- question: '[Defense Impairment] Security Process Termination and Driver Unload Detection (Symbolic Logic):
    Can you determine whether, on Windows assets, Exploitation for defense impairment on Windows is evidenced
    by security products crashing, hanging, unloading drivers, or losing telemetry immediately after suspicious
    local or network activity. Investigators should look for memory corruption artifacts, in-process tampering
    (AMSI/ETW patching, unbacked RWX execution in security processes), Bring-Your-Own-Vulnerable-Driver
    (BYOVD) loads, unexpected service creation or termination, driver unloads, and gaps in agent heartbeats
    that line up with exploit-like process lineage. Strong evidence is a reproducible sequence where probing
    or exploit traffic is followed by a measurable drop in defensive visibility or control on the same
    host. -- specifically using the ''Security Process Termination and Driver Unload Detection'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary exploits vulnerabilities
    in security tooling and defensive infrastructure to terminate, disable, bypass, or blind the controls
    defenders rely on, so detection and response degrade exactly when they are needed most. This evidence
    focuses on the condition that Exploitation for defense impairment on Windows is evidenced by security
    products crashing, hanging, unloading drivers, or losing telemetry immediately after suspicious local
    or network activity. Investigators should look for memory corruption artifacts, in-process tampering
    (AMSI/ETW patching, unbacked RWX execution in security processes), Bring-Your-Own-Vulnerable-Driver
    (BYOVD) loads, unexpected service creation or termination, driver unloads, and gaps in agent heartbeats
    that line up with exploit-like process lineage. Strong evidence is a reproducible sequence where probing
    or exploit traffic is followed by a measurable drop in defensive visibility or control on the same
    host. This Symbolic Logic approach works as follows: Detect termination of known security processes
    by non-standard parents or utilities such as taskkill, sc.exe stop, and Stop-Process, then look for
    driver unloads, service disablement, or new services whose binaries live in temp/user-writable directories.
    Filter the generic Stop Windows Service Via Sc.EXE signal to security-service names (e.g., WinDefend,
    Sense, MsMpSvc, CSFalconService, SentinelAgent) with an unexpected parent, and corroborate with System
    Event IDs 7035/7036. Flag these events when they follow recent scanning, probing, or exploit-like
    traffic against the same host. A positive result -- a rule match, statistical outlier, or model alert
    -- is strong evidence of exploitation for defense impairment when it lines up in time with exploit-like
    input on the same host or account; pivot to the responsible process lineage or identity, the affected
    security control (EDR/AV/audit/logging/agent/policy), the exact change (termination, driver unload,
    log suspension, policy or role edit), and the preceding network or local activity to scope what visibility
    was lost and for how long. A negative result helps rule out this particular impairment vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy
    or low-and-slow tampering. References: [Stop Windows Service Via Sc.EXE](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_sc_stop_service.yml).'
  answer_sources:
  - Windows Security Event Logs (Event IDs 4688, 4672, 4697)
  - Windows Error Reporting (WER) logs (process crashes)
  - Windows System Event Logs (Event IDs 7031, 7034, 7035, 7036, 1000)
  - Sysmon Event Logs (Event IDs 1, 6, 7, 8, 10, 12, 13, 25)
  - ETW Threat-Intelligence provider (callstacks, unbacked/RWX memory)
  - EDR/Antivirus health logs (telemetry heartbeat, tamper-state, status changes)
  - 'NAI: Windows endpoints running EDR/AV agents and kernel drivers; collection points are the host event
    pipeline (Sysmon/Security/System), WER, ETW-TI, and the EDR control plane reporting agent health.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Security Process Termination and Driver Unload Detection

      SEARCH events matching the logic described above

      // Detect termination of known security processes by non-standard parents or utilities such as taskkill,
      sc.exe stop, and Stop-Process, then look for driver unload

      | CORRELATE security-control state change with preceding exploit-like activity (same host/account,
      short window)

      | ALERT and preserve evidence for analyst review'
  - technology: Sysmon/pseudocode
    query: '// Sysmon view for: Security Process Termination and Driver Unload Detection

      FROM Sysmon (EID 1/6/7/8/10/12/13/25) and System (7035/7036/7031/7034) + WER

      APPLY the Symbolic Logic logic over driver loads, process injection, and service/telemetry state

      | OUTPUT host, process lineage, driver/service, and telemetry-gap records'
