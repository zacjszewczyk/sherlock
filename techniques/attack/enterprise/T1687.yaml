name: 'T1687: Exploitation for Defense Impairment'
id: f963f656-2578-413b-93dc-bed2ec433d8f
description: This playbook helps an analyst investigate whether an adversary has exploited vulnerabilities
  in security software, infrastructure, or defensive components to degrade, disable, or otherwise impair
  the organization's ability to prevent, detect, or respond to malicious activity (MITRE ATT&CK T1687,
  Exploitation for Defense Impairment). Under the Defense Impairment tactic, exploitation for defense
  impairment shows up as security products and pipelines abruptly losing effectiveness right after suspicious
  local or network activity. On Windows, look for security processes crashing, hanging, unloading drivers,
  or losing telemetry, with memory-corruption artifacts, in-process tampering (AMSI/ETW patching, unbacked
  RWX execution in security processes), Bring-Your-Own-Vulnerable-Driver (BYOVD) loads, unexpected service
  creation or termination, and heartbeat gaps that line up with exploit-like process lineage. On Linux
  and macOS, look for security daemons (auditd, EDR/falcon-sensor, osquery, Endpoint Security system extensions)
  being terminated, ptrace-attached, or crashing, kernel modules being unloaded or failing to start, and
  audit configuration being suspended or altered after local execution or network input. In IaaS and SaaS,
  look for disabled logging, detached or uninstalled agents, changed security groups, bypassed enforcement,
  role escalation, reduced retention, or tokenized persistence that weakens monitoring. The strongest
  evidence is a reproducible sequence where probing or exploit traffic is followed by a measurable, same-target
  drop in defensive visibility or control. Detection methods combine deterministic symbolic-logic rules
  (security-process termination and driver unloads, BYOVD block-list matches, AMSI/ETW tamper detection,
  cloud logging-suspension and SaaS workflow-bypass rules), statistical baselining (CUSUM/PELT/Bayesian
  change-point detection, Poisson/control-chart crash bursts, stateful CUSUM residuals that treat a frozen
  feed as a positive signal, and explicit failure-mode profiling), and machine learning (ETW-based memory-anomaly
  classification, provenance-graph learning with KAIROS/ThreaTrace/MAGIC, and DeepLog log-sequence modeling),
  applied across Windows Event Logs/Sysmon/WER/ETW-TI, Linux auditd/journald, macOS unified logging, and
  AWS CloudTrail/Okta/M365 cloud audit pipelines.
type: technique
