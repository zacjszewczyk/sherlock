name: 'T1083: File and Directory Discovery'
id: a88bd77a-c252-4192-90ed-5e96300503b2
description: Investigate adversary File and Directory Discovery (T1083) across enterprise endpoints, servers,
  network devices, and file shares. This playbook helps an analyst determine whether an actor is enumerating
  files and directories to shape follow-on actions such as collection, lateral movement, or exfiltration.
  It guides hunting for known discovery tooling (e.g., Seatbelt, SharpHound), suspicious use of native
  CLI utilities (dir, tree, find, where, findstr, ls, locate) with recursive or sensitive-path arguments,
  bursty spikes in file-access and discovery-command volume, rapid sweeps of watchlisted sensitive directories,
  anomalous SMB share fan-out across the network, and correlated recon-to-staging sequences that culminate
  in archive creation. Each question pairs deterministic detection logic with statistical baselining and
  machine-learning methods to surface both commodity and sophisticated actors while remaining defensible
  against benign indexers and routine administrative activity.
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any process execute whose name or file hash matches a known malicious discovery tool (for
    example Seatbelt.exe or SharpHound.exe) from your threat-intelligence watchlist?
  context: During Discovery, sophisticated actors frequently drop purpose-built enumeration tools to map
    a host and its data quickly. Maintain a curated watchlist of known discovery-tool process names and
    SHA256 hashes sourced from threat intelligence, and trigger a high-severity alert on any direct match
    in Windows Event ID 4688 (process creation) or Sysmon Event ID 1. Seed and prune the list using attacker-favored
    command/tool rankings in [Windows Commands Abused by Attackers, JPCERT/CC](https://blogs.jpcert.or.jp/en/2016/01/windows-commands-abused-by-attackers.html)
    and validate detection coverage with [Atomic Red Team T1083](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1083/T1083.md).
    A positive match is high-fidelity and warrants immediate triage; a clean result reduces but does not
    eliminate risk, since renamed or custom tooling will evade name/hash matching and must be caught by
    the behavioral questions below.
  answer_sources: &id001
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Log aggregation platform (SIEM) containing process execution logs from all enterprise endpoints
    and servers, with a focus on high-value assets like Domain Controllers, file servers, and developer
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SOURCE EventID IN (4688, Sysmon:1)\nWHERE lower(process_name) IN discovery_tool_watchlist\n\
      \   OR sha256 IN discovery_tool_hash_watchlist\n| eval severity = \"high\"\n| table _time, host,\
      \ user, process_name, sha256, parent_process, command_line"
- question: Are there rarely-seen process hashes (executed on only a handful of hosts) launching from
    an interactive shell and producing large file listings or access-denied follow-ons?
  context: Rare binaries launched interactively are a strong weak signal for novel or renamed discovery
    tooling that name/hash watchlists miss. Compute enterprise prevalence (count of distinct hosts) for
    every process hash and elevate executions seen on fewer than five hosts where the parent is an interactive
    shell (powershell.exe, cmd.exe). Enrich with Volume (bytes written to redirected output), Frequency
    (executions per minute by that hash), and State (exit code / access-denied follow-on) so a rare hash
    that emits a large directory listing scores highest. Derive the prevalence cutoff per environment
    from realistic host baselines in the [Unified Host and Network Data Set, Turcotte et al.](https://arxiv.org/abs/1708.07518).
    A low-prevalence, high-volume hash from an interactive parent is suspicious; common hashes or service-account
    parents are likely benign.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SOURCE EventID IN (4688, Sysmon:1)

      | stats dc(host) AS host_prev, count AS execs, sum(bytes_written) AS vol BY sha256

      | where host_prev < 5 AND parent_process IN ("powershell.exe","cmd.exe")

      | eval score = (1.0/host_prev) * vol

      | sort -score'
- question: When scored by a trained model on process-creation features, which process launches exceed
    0.9 malicious confidence for discovery behavior, and what features drive the score?
  context: A supervised model captures combinations of weak signals that no single rule expresses. Run
    a pre-trained Random Forest per process-creation event using features such as process-name entropy,
    parent process name, command-line length and entropy, and hash prevalence; flag events above 0.9 malicious
    confidence and emit the top-3 contributing features (e.g., 'rare hash, interactive parent, high command-line
    entropy') for analyst explainability. Train command-line features per [Detecting Malicious Windows
    Commands Using NLP, Anh et al.](https://doi.org/10.1007/978-3-030-12942-2_13) and run an unsupervised
    [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363) in parallel to catch drift
    the supervised model misses. High-confidence flags with coherent feature explanations merit triage;
    isolated low-confidence scores are deprioritized.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'SOURCE EventID IN (4688, Sysmon:1)

      | eval features = [name_entropy, parent_name, cmdline_len, cmdline_entropy, hash_prevalence]

      | apply model random_forest_t1083 -> conf, top_features

      | apply model isolation_forest_t1083 -> anomaly_score

      | where conf > 0.9 OR anomaly_score > threshold

      | table _time, host, user, process_name, conf, top_features'
- question: Did a native command-line utility (dir, tree, find, where, findstr) run with recursive flags,
    output redirection, or filters for sensitive extensions/keywords indicative of broad or targeted enumeration?
  context: Native utilities are the most common Discovery method and leave deterministic fingerprints
    in command lines. Apply regex-driven detection rules to process-creation logs to match discovery utilities
    (dir, tree, find, where, findstr) combined with recursive flags (/s, -r), output redirection (>, >>),
    or filtering for sensitive extensions/keywords (e.g., *.pem, *.key, password, *.config). Base these
    on [CAR-2013-07-001 Suspicious Arguments, MITRE CAR](https://car.mitre.org/analytics/CAR-2013-07-001/),
    [Private Keys Reconnaissance, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_private_keys_recon.yml),
    [Findstr Recon, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_findstr_recon_everyone.yml),
    and [Suspicious Windows Command Shell Arguments, Elastic](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/).
    Keep these deterministic rules as the detection floor under the statistical and ML layers. A match
    on a server where interactive CLI is rare (web/db/app servers) is especially significant; admin scripting
    may generate benign matches that require baselining.
  answer_sources: &id002
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Log aggregation platform (SIEM) containing process execution logs from all endpoints and servers,
    particularly those where interactive command-line use is rare or should be highly scrutinized (e.g.,
    web servers, database servers, application servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'SOURCE EventID IN (4688, Sysmon:1)

      WHERE process_name IN ("dir","tree.com","find.exe","where.exe","findstr.exe","cmd.exe")

      AND command_line MATCHES /(\/s|\-r|\>|\>\>|\*\.(pem|key|pfx|config)|password|secret)/i

      | table _time, host, user, process_name, command_line'
- question: For each user-host pair, are new discovery-utility arguments highly anomalous (above the 98th
    percentile of rarity) or unusually long/high-entropy versus a 30-day baseline?
  context: Adversaries reuse common binaries with uncommon arguments; rarity scoring exposes this even
    when the binary itself is whitelisted. For each user-host pair, compute the Jaccard distance of new
    discovery-utility arguments against a 30-day historical baseline and flag executions above the 98th
    percentile of rarity. Jointly score command-line Shannon entropy (per [High Command Line Entropy,
    Elastic](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html))
    and argument length so obfuscated or abnormally long discovery commands surface even when the executable
    is ubiquitous. Highly rare, long, or high-entropy argument strings for an otherwise normal user point
    to hands-on-keyboard discovery; results near baseline are routine.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SOURCE EventID IN (4688, Sysmon:1) WHERE process_name IN discovery_utils

      | eval arg_set = tokenize(command_line)

      | lookup baseline_args BY user, host -> hist_args

      | eval jaccard = 1 - overlap(arg_set, hist_args)/union(arg_set, hist_args)

      | eval ent = shannon_entropy(command_line), len = length(command_line)

      | where jaccard > pct98 OR ent > ent_thresh OR len > len_thresh

      | sort -jaccard'
- question: Within a user session, do low-probability command sequences from an LSTM language model show
    discovery commands followed by compression or network activity?
  context: Individual commands may look benign, but their ordering reveals intent. Train an LSTM language
    model on benign per-session command sequences and flag sessions whose low-probability outputs contain
    discovery commands followed by compression or network activity, per [DeepLog, Du et al.](https://acmccs.github.io/papers/p1285-duA.pdf)
    ([code](https://github.com/Thijsvanede/DeepLog)) and the kill-chain reconstruction of [ATLAS, Alsaheel
    et al.](https://www.usenix.org/conference/usenixsecurity21/presentation/alsaheel) ([code](https://github.com/purseclab/ATLAS)).
    Surface the top-3 lowest-probability command transitions in the alert for analyst review. A session
    that the model deems improbable AND that chains recon to staging/exfil behavior is a strong indicator
    of an active operation; sessions matching learned benign patterns are deprioritized.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "SOURCE EventID IN (4688, Sysmon:1)\n| transaction session_id BY user, host\n| eval cmd_seq\
      \ = list(process_name + command_line)\n| apply model lstm_cmd_seq -> seq_prob, low_prob_transitions\n\
      | where seq_prob < threshold\n   AND seq_contains(discovery_cmd -> (compression|network))\n| table\
      \ _time, host, user, session_id, low_prob_transitions"
- question: Did a single user or process issue more than 100 discovery commands or generate more than
    1,000 file-access events within five minutes, and were many of them ACCESS_DENIED?
  context: 'Automated discovery generates volume that hands-on work rarely matches. Trigger when a single
    user/process issues more than 100 discovery commands (dir, tree, find) or more than 1,000 file-access
    events (Event ID 4663 with Object Type: File) within five minutes. In parallel, track the State/failure
    signal of ACCESS_DENIED bursts (4663 failures / 4656 with failure), which distinguishes a probing
    adversary hitting protected paths from a benign indexer that has read access everywhere it touches.
    Tune the counts to environment baselines and validate with [Atomic Red Team T1083](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1083/T1083.md).
    A burst dominated by access-denied results is high-suspicion; high-volume reads by an authorized indexing
    service are likely benign.'
  answer_sources: &id003
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Log aggregation platform (SIEM) containing process creation and file audit logs from critical
    assets like file servers, SharePoint servers, source code repositories, and Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'SOURCE EventID IN (4688, 4663) WHERE object_type="File" OR process_name IN discovery_utils

      | bin _time span=5m

      | stats count AS events, sum(eval(status="ACCESS_DENIED")) AS denied BY _time, user, process

      | where events > 100 OR (object_events > 1000)

      | eval denied_ratio = denied/events

      | where events>100 OR denied_ratio>0.3'
- question: Does the current hour's file-access and discovery-command count for a user-host exceed three
    standard deviations above its 30-day rolling mean?
  context: Per-entity baselining catches volume anomalies that fixed thresholds miss for low-activity
    accounts. Maintain a 30-day rolling baseline of hourly file-access and discovery-command counts per
    user-host and alert whenever the current hour exceeds three standard deviations above that mean. Represent
    activity as a per-window frequency vector of file syscalls/access events ([Bag of System Calls, Abed
    et al.](https://arxiv.org/abs/1611.03053)) and decompose the volume series with the [Time Series Anomaly
    for Process Executions, Microsoft Sentinel](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Windows%20Security%20Events/Analytic%20Rules/TimeSeriesAnomaly-ProcessExecutions.yaml)
    approach. A sharp deviation from an entity's own history indicates a behavioral break worth investigating;
    activity within the normal band is routine. Account for legitimate periodic jobs (backups, indexers)
    when tuning.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SOURCE EventID IN (4688,4663,Sysmon:1,Sysmon:11)

      | bin _time span=1h

      | stats count AS cnt BY _time, user, host

      | eventstats avg(cnt) AS mu, stdev(cnt) AS sd BY user, host (window=30d)

      | eval z = (cnt - mu)/sd

      | where z > 3'
- question: Do forecasting models (SARIMA/Prophet) flag file-access counts for a user or process that
    exceed the predicted confidence interval after accounting for seasonality?
  context: Simple z-scores misfire on seasonal workloads; time-series models that learn daily/weekly rhythms
    reduce false positives. Fit SARIMA/Prophet (or online [ARIMA, Pena et al.](https://www.mdpi.com/2076-3417/11/7/3194))
    models to each user/process time series of file-access counts and flag windows where observed counts
    exceed the model confidence interval, accounting for seasonality. Include the forecast value, observed
    value, and residual magnitude in the alert for explainability. A breach of the predicted interval
    that is not explained by known seasonality suggests anomalous enumeration; values inside the band
    confirm normal cyclical behavior.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'SOURCE EventID IN (4688,4663,Sysmon:11)

      | bin _time span=1h | stats count AS cnt BY _time, user

      | apply model sarima_prophet BY user -> yhat, yhat_upper, residual

      | where cnt > yhat_upper

      | table _time, user, cnt, yhat, residual'
- question: Did a single process access more than three watchlisted sensitive directories within one minute,
    and was there a high ratio of ACCESS_DENIED results?
  context: Targeted actors sweep known sensitive locations (Finance, HR, Legal, SYSVOL, NTDS.dit, source
    repos) early. Trigger when a single process accesses more than three watchlisted sensitive directories
    within one minute as recorded in Event ID 4663, and raise severity when the access State includes
    a high ratio of ACCESS_DENIED results, indicating probing into directories the principal cannot read.
    Seed the directory watchlist from sensitive-file recon patterns in [Private Keys Reconnaissance, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_private_keys_recon.yml).
    Rapid multi-directory access, especially with denials, signals deliberate reconnaissance; a single
    authorized access to one directory is normal.
  answer_sources: &id004
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - 'NAI: File audit logs (Event ID 4663) from servers hosting sensitive departmental data (Finance, HR,
    Legal), Domain Controllers (SYSVOL, NTDS.dit location), and source code repositories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'SOURCE EventID=4663 WHERE object_path IN sensitive_dir_watchlist

      | bin _time span=1m

      | stats dc(object_path) AS dirs, sum(eval(status="ACCESS_DENIED")) AS denied, count AS tot BY _time,
      process, user

      | where dirs > 3

      | eval denied_ratio = denied/tot'
- question: Over 10-minute windows, does the Shannon entropy and distinct-directory count of paths accessed
    by a process exceed the 99th percentile of its own baseline?
  context: Breadth of traversal distinguishes a sweep from focused work. Over 10-minute windows, compute
    the Shannon entropy and distinct-directory count of paths accessed per process and alert when the
    score exceeds a percentile-based threshold (e.g., 99th) relative to that process/user baseline. Combine
    breadth (distinct directories) with Volume (entries/bytes returned) to separate broad sweeps from
    concentrated, legitimate access. High path entropy plus many distinct directories indicates dispersed
    enumeration; low-entropy access to a few related paths is typical of normal application behavior.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SOURCE EventID IN (4663, Sysmon:11)

      | bin _time span=10m

      | stats dc(object_path) AS distinct_dirs, values(object_path) AS paths, sum(bytes) AS vol BY _time,
      process, user

      | eval path_entropy = shannon_entropy(paths)

      | eventstats pct99(path_entropy) AS thr BY process, user

      | where path_entropy > thr'
- question: Which users are outliers when their directory-access patterns (distinct dirs, sensitive-dir
    ratio, denied ratio, depth) are clustered or scored for anomaly?
  context: Unsupervised clustering exposes accounts whose access shape differs from peers without predefined
    thresholds. Vectorize per-user directory-access patterns (distinct directories, sensitive-directory
    ratio, denied ratio, depth) and apply DBSCAN or score with [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363)
    to surface outliers. For relationship-aware detection, model entities as a heterogeneous graph ([Log2vec,
    Liu et al.](https://doi.org/10.1145/3319535.3363749)) and report the top-3 features driving the outlier
    score. Users falling outside dense clusters or with high anomaly scores merit review, particularly
    when the sensitive-dir or denied ratio drives the score; users inside peer clusters are normal.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'SOURCE EventID IN (4663,4688,Sysmon:11)

      | stats dc(dir) AS distinct_dirs, ratio(sensitive) AS sens_ratio, ratio(denied) AS denied_ratio,
      max(depth) AS depth BY user

      | apply model dbscan|isolation_forest -> cluster, anomaly_score, top_features

      | where cluster = -1 OR anomaly_score > threshold

      | table user, distinct_dirs, sens_ratio, denied_ratio, anomaly_score, top_features'
- question: Did a single source IP touch more than 10 distinct host/share combinations within five minutes
    via SMB, especially administrative shares like C$ or ADMIN$?
  context: Network share enumeration is a hallmark of Discovery preceding lateral movement and collection.
    Alert when a single source IP touches more than 10 distinct host/share combinations in five minutes
    via SMB mapping logs (Zeek smb_mapping.log) or Event ID 5145, with elevated severity for administrative
    shares (C$, ADMIN$). Track failed tree-connects / STATUS_ACCESS_DENIED as a distinct probing signal,
    since blind enumeration produces many failures a legitimate client does not. Broad fan-out with admin-share
    targeting and frequent denials strongly suggests share reconnaissance; a small number of repeat connections
    to a user's usual shares is benign.
  answer_sources: &id005
  - Zeek smb_files.log
  - Zeek conn.log
  - Zeek smb_mapping.log
  - Windows Event ID 5145
  - 'NAI: Network traffic data from network taps monitoring East-West traffic between subnets. Zeek sensors
    deployed at key network chokepoints (e.g., data center core, user access layer). Windows Security
    logs from all file servers and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SOURCE Zeek:smb_mapping OR EventID=5145\n| bin _time span=5m\n| stats dc(host.share) AS combos,\
      \ sum(eval(status=\"ACCESS_DENIED\")) AS denied,\n        sum(eval(share IN (\"C$\",\"ADMIN$\")))\
      \ AS admin_hits BY _time, src_ip\n| where combos > 10\n| eval severity = if(admin_hits>0, \"high\"\
      , \"medium\")"
  - technology: Zeek/pseudocode
    query: 'LOAD smb_mapping.log

      | group_by src_ip, 5min_window

      | count distinct(path) AS shares

      | where shares > 10 OR path =~ /(C\$|ADMIN\$)/'
- question: Does a host's unique destination count on port 445 per hour exceed the 95th percentile of
    its peer-group baseline?
  context: Peer-group baselining tells a normally chatty file server apart from a workstation suddenly
    scanning the network. Track each host's unique destination count on port 445 per hour, compare against
    a peer-group baseline, and flag hosts exceeding the 95th-percentile fan-out. Derive realistic peer
    baselines and new-edge expectations from enterprise telemetry such as the [Unified Host and Network
    Data Set, Turcotte et al.](https://arxiv.org/abs/1708.07518). A workstation whose SMB fan-out leaps
    above its peer group is anomalous and worth investigating for share enumeration; servers whose role
    explains high fan-out should be grouped accordingly to avoid false positives.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'LOAD conn.log WHERE id.resp_p = 445

      | bin _time span=1h

      | stats dc(id.resp_h) AS dst_count BY _time, id.orig_h

      | join peer_group BY id.orig_h

      | eventstats pct95(dst_count) AS p95 BY peer_group

      | where dst_count > p95'
- question: From the SMB communication graph, which hosts bridge previously disconnected communities or
    sharply increase their degree centrality?
  context: Graph analytics reveal hosts that suddenly behave like a hub, a structural signature of enumeration.
    Build a graph from Zeek conn.log SMB flows, run Louvain community detection to learn normal communities,
    and flag hosts that bridge disconnected communities or sharply increase degree centrality, following
    the unsupervised graph-AI approach of [CyberGraph, Bowman et al.](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf).
    Include the newly-contacted shares/hosts as the top contributing evidence. A host that newly connects
    many previously unrelated communities is a strong indicator of network-wide discovery; stable membership
    within an established community is normal.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'LOAD conn.log WHERE service="smb" OR id.resp_p=445

      | build_graph nodes=hosts edges=smb_flows

      | run louvain -> communities

      | compute degree_centrality, community_bridges BY host

      | where bridges_new_communities OR delta_degree_centrality > threshold

      | table host, new_communities, new_hosts_contacted'
- question: Did a host show a recursive directory listing followed within one hour by SMB enumeration
    of more than five servers and then creation of a compressed archive (.zip/.rar/.7z)?
  context: The recon-to-staging chain is a high-confidence indicator that discovery has escalated toward
    collection/exfiltration. Track host sequences and alert when a recursive dir execution (Event ID 4688)
    is followed within one hour by SMB enumeration (more than five servers) and archive creation (.zip/.rar/.7z)
    via Sysmon Event ID 11 or 4688. This codifies the recon-staging chain documented in [Atomic Red Team
    T1083](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1083/T1083.md). Observing
    all three stages on one host in order is strong evidence of an active collection operation; isolated
    stages are weaker and handled by the per-stage questions.
  answer_sources: &id006
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - Zeek smb_mapping.log
  - Zeek conn.log
  - 'NAI: Centralized log management platform (e.g., SIEM, data lake) capable of correlating events from
    disparate sources, including endpoint process logs (Windows, Sysmon) and network traffic logs (Zeek).'
  range: 'Last 90 days (event-centered: pivot +/- 1 hour around the recursive dir execution)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SOURCE EventID IN (4688,4663,Sysmon:11) JOIN Zeek:smb_mapping\n| where stage1 = recursive_dir(4688)\n\
      \  THEN within 1h stage2 = dc(smb_server) > 5\n  THEN within 1h stage3 = file_create MATCHES /\\\
      .(zip|rar|7z)$/\n| sequence_match(stage1 -> stage2 -> stage3) BY host\n| table host, stage1_time,\
      \ servers_enum, archive_file"
- question: When atomic discovery events are point-weighted and summed over 30-minute windows, which hosts
    spike more than four standard deviations above peer means?
  context: Risk aggregation surfaces actors whose individual actions stay under per-rule thresholds but
    collectively indicate an operation. Assign point values to atomic discoveries (recursive dir=5, sensitive-directory
    access=10, SMB enumeration=15, archive creation=20), sum over 30-minute rolling windows, and alert
    on spikes above four standard deviations from peer means. Weight events that also raised failure-rate
    signals (access-denied / failed tree-connect) higher, and list the contributing scored events in the
    alert. A host whose cumulative risk score spikes far above its peers is a prioritized lead; low aggregate
    scores indicate routine activity.
  answer_sources: *id006
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SOURCE correlated_discovery_events

      | eval points = case(type="recursive_dir",5, type="sensitive_access",10, type="smb_enum",15, type="archive",20)

      | eval points = if(had_failures, points*1.5, points)

      | bin _time span=30m

      | stats sum(points) AS risk, values(type) AS events BY _time, host

      | eventstats avg(risk) AS mu, stdev(risk) AS sd BY peer_group

      | where risk > mu + 4*sd'
- question: Does a Hidden Markov Model over categorized host events show a high-probability transition
    into Reconnaissance or Staging states?
  context: An HMM expresses the latent progression of an intrusion that discrete rules cannot. Implement
    a Hidden Markov Model whose hidden states represent attack stages, feed categorized events (recursive_dir,
    smb_scan, archive_creation), and alert when a host transitions into Reconnaissance/Staging states
    with high probability, per the system-call HMM modeling of [Warrender et al.](https://ieeexplore.ieee.org/document/766910)
    and [Forrest et al.](https://asu.pure.elsevier.com/en/publications/sense-of-self-for-unix-processes).
    For whole-system causal context, fuse with the provenance-graph reconstruction of [KAIROS, Cheng et
    al.](https://arxiv.org/abs/2308.05034) ([code](https://github.com/ProvenanceAnalytics/kairos)). A
    confident transition into recon/staging states indicates the host is progressing through an attack
    lifecycle; remaining in benign states is reassuring.
  answer_sources: *id006
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'SOURCE correlated_discovery_events

      | categorize event -> {recursive_dir, smb_scan, archive_creation, benign}

      | sequence BY host ORDER BY _time

      | apply model hmm_attack_stages -> state, state_prob

      | where state IN ("Reconnaissance","Staging") AND state_prob > 0.8

      | table host, _time, state, state_prob'
