name: 'T1546.003: Windows Management Instrumentation Event Subscription'
id: 022c9d0a-d860-45bc-868c-4b81afbde066
description: 'This playbook helps an analyst investigate whether an adversary is abusing Windows Management
  Instrumentation (WMI) event subscriptions to establish persistence (TA0003) and/or elevate privileges
  to SYSTEM (TA0004) on Windows hosts. WMI permanent event subscriptions consist of an __EventFilter (the
  trigger/WQL query), an EventConsumer (the payload — CommandLineEventConsumer or ActiveScriptEventConsumer),
  and a __FilterToConsumerBinding that links them; when the subscribed event fires (logon, wall-clock
  time, uptime), the WMI Provider Host (WmiPrvSE.exe) executes the consumer''s payload, frequently with
  SYSTEM privileges. The playbook guides the hunt across several behavioral angles: creation of permanent
  subscription objects observed via WMI-Activity Operational Event IDs 5859/5860/5861 and Sysmon WmiEvent
  Event IDs 19/20/21 (filter/consumer/binding), including allowlisting of vetted enterprise subscriptions,
  threat-intel IOC matching of consumer/filter properties, entropy and rare-token scoring of consumer
  content, and ML classification of subscription events; command-line and PowerShell script-block creation
  of subscriptions via Register-WmiEvent, Set-WmiInstance/New-CimInstance against root\subscription, and
  wmic.exe eventfilter/eventconsumer/filtertobinding (Event IDs 4688, 4104, Sysmon 1); consumers that
  reference payloads in user-writable or world-writable directories (%TEMP%, %APPDATA%, C:\Users\Public);
  MOF compilation via mofcomp.exe as a stealth install vector, including anomalous user contexts and user-writable
  MOF paths; unexpected SYSTEM-integrity children spawned by WmiPrvSE.exe (cmd.exe, powershell.exe, net.exe);
  transient run-and-clean subscriptions that are created and quickly deleted; and WmiPrvSE-child processes
  initiating suspicious outbound network connections suggestive of C2 beaconing. Detection methods combine
  symbolic-logic rules, statistical baselining/rarity/entropy scoring, and machine-learning models (gradient-boosted
  classifiers, DBSCAN/one-class anomaly detection, sequence/provenance models) applied to Windows Security,
  Sysmon, PowerShell, and WMI-Activity logs plus Zeek network telemetry, so the analyst can corroborate
  suspected WMI subscription abuse against object creation, process lineage, payload location, privilege
  context, and egress behavior.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
