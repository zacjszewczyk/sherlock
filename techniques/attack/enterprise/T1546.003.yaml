questions:
- question: '[Persistence] Alert on any permanent subscription creation: Can you determine whether a WMI
    permanent event subscription object is created, evidenced by WMI-Activity Operational log Event ID
    5861 (or 5859/5860) and Sysmon WmiEvent Event IDs 19 (filter), 20 (consumer), 21 (binding), where
    the consumer properties (Name, CommandLineTemplate, ScriptText, ExecutablePath) or filter properties
    (Name, Query, QueryLanguage) match known-malicious IOCs or contain suspicious keywords. Any permanent
    subscription registration is a high-signal event because legitimate ones are rare and should be enumerable/allowlisted.
    -- specifically, using the ''Alert on any permanent subscription creation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses WMI event subscriptions
    to run attacker-controlled code automatically — for persistence that survives reboots and credential
    changes, and/or to obtain SYSTEM-level execution via the WmiPrvSE.exe proxy. This evidence focuses
    on the condition that a WMI permanent event subscription object is created, evidenced by WMI-Activity
    Operational log Event ID 5861 (or 5859/5860) and Sysmon WmiEvent Event IDs 19 (filter), 20 (consumer),
    21 (binding), where the consumer properties (Name, CommandLineTemplate, ScriptText, ExecutablePath)
    or filter properties (Name, Query, QueryLanguage) match known-malicious IOCs or contain suspicious
    keywords. Any permanent subscription registration is a high-signal event because legitimate ones are
    rare and should be enumerable/allowlisted. This Symbolic Logic approach looks for the following signal:
    Per [SigmaHQ WMI Event Subscription rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/wmi_event/sysmon_wmi_event_subscription.yml)
    and the WMI-Activity event mapping in [FireEye WMI Offense, Defense, and Forensics](https://www.fireeye.com/content/dam/fireeye-www/global/en/current-threats/pdfs/wp-windows-management-instrumentation.pdf),
    alert on every Sysmon EventID 19/20/21 or WMI-Activity EventID 5861 in root\subscription. Maintain
    an explicit allowlist of vetted enterprise subscriptions (SCCM/SCOM/BginfoConsumer names + creating
    account); treat any subscription not on the allowlist as suspicious. This is the deterministic floor
    — tune the allowlist, never disable the rule. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates likely WMI subscription abuse aligned with Persistence; pivot to the subscription
    objects (filter/consumer/binding) and their properties, the creating process and user/integrity context,
    the referenced payload path or script content, the WmiPrvSE.exe process lineage, and any follow-on
    execution or outbound network activity. A negative result helps reduce confidence in this specific
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, obfuscated, or living-off-the-land subscription abuse.'
  answer_sources:
  - WinEventLog:Microsoft-Windows-WMI-Activity/Operational EventCode=5859,5860,5861
  - WinEventLog:Sysmon EventCode=19,20,21
  - 'NAI: All Windows endpoints and servers, especially Domain Controllers, Tier 0/1 administrative servers,
    and workstations of privileged users.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Alert on any permanent subscription creation (Symbolic Logic)

      source IN [WinEventLog:Microsoft-Windows-WMI-Activity/Operational EventCode=5859,5860,5861, WinEventLog:Sysmon
      EventCode=19,20,21]

      | WHERE matches_action_criteria("Alert on any permanent subscription creation")

      // Per [SigmaHQ WMI Event Subscription rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/wmi_event/sysmon_wmi_event_subscription.yml)
      and the WMI-Activity event mapping in [FireEye WMI Offense, Defense, an...

      | ALERT enrich(host, user, subscription_objects, consumer_payload, parent_process, dest)'
