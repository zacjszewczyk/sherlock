name: 'T1574.004: Hijack Execution Flow: Dylib Hijacking'
id: 057771d2-a380-4ecf-a363-b9f02ffeedb0
description: 'This playbook helps an analyst investigate whether an adversary is hijacking dynamic library
  (dylib) loads on macOS endpoints to execute attacker-controlled code inside trusted, signed, or auto-starting
  applications -- a technique that yields execution, persistence, privilege escalation, and stealthy command-and-control
  because the malicious dylib inherits the host process''s identity, privilege level, and code-signing
  trust. It supports both the Execution (TA0002) and Stealth (TA0005) tactics tied to the mission question:
  is an adversary achieving persistence on macOS endpoints by hijacking dylib loads in auto-starting applications?
  Dylib hijacking abuses the dynamic loader''s sequential search of @rpath/@loader_path paths and weak
  imports (LC_LOAD_WEAK_DYLIB): an attacker plants a malicious .dylib with the expected name earlier in
  the search order, or relocates a vulnerable app into a writable directory and stages a dylib alongside
  it. The hunt therefore spans file-system telemetry (dylib creation/modification in application bundles,
  LaunchAgent/LaunchDaemon paths, user-writable and SIP-protected directories), process and module-load
  telemetry (launchd PID 1 children loading rare or user-writable dylibs, trusted apps executing from
  odd paths, non-network apps spawning shells, write-then-privileged-exec chains against SUID/vulnerable
  binaries), and network telemetry (trusted or auto-start processes beaconing to unexpected or threat-intel-listed
  destinations with anomalous JA3/volume/failure profiles). Across these angles the playbook applies three
  complementary detection families: symbolic-logic rules (hash/signature and @rpath-resolution checks,
  allowlist violations, write-then-exec correlation), statistical baselining (Jaccard set similarity,
  fleet prevalence/rarity, path entropy, Mahalanobis distance, load- and connection-failure bursts), and
  machine learning (Random Forest, one-class SVM/Isolation Forest, LSTM sequence models, autoencoders,
  and provenance/graph-learning over process-dylib-path relationships) -- all favoring explainable output
  so an analyst can pivot from an alert to the responsible writer process, the vulnerable application,
  the load path and signing state, and any resulting privileged execution or egress. Source telemetry
  includes macOS Endpoint Security Framework (ESF) events, osquery tables (file, signature, process_events,
  process_open_files, processes, suid_bin, file_events), macOS unified logs, and Zeek conn.log/dns.log.'
type: technique
