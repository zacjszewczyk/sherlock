  context: 'Why this matters: Under the Stealth tactic (TA0005), dylib hijacking lets an adversary run
    code inside a trusted macOS process by exploiting the dynamic loader''s @rpath/@loader_path search
    order and weak imports, inheriting that process''s privileges and code-signing trust. This evidence
    focuses on the condition that a .dylib is written into an application''s runtime search path or bundle
    location and is later mapped by an auto-starting process or signed application. The load path, signing
    state, or parent lineage differs from the host baseline. This Statistical Method approach works as
    follows: For each auto-starting application, baseline the set of dylibs loaded at startup (osquery
    process_open_files over 30 days, including resolved @rpath locations) and alert when the Jaccard similarity
    of the current set vs baseline drops below ~0.95. Also compute fleet prevalence of each (app, dylib-path)
    pair and alert on the bottom 1% (rare/first-seen) per first-seen analytics ([CAR-2014-11-002, MITRE](https://car.mitre.org/analytics/CAR-2014-11-002/);
    prevalence model [KnockKnock, Objective-See](https://github.com/objective-see/KnockKnock)). Failure-mode
    signal: count dyld ''Library not loaded''/''image not found'' errors for that app in the prior 24h
    — a burst of failed loads immediately preceding the new dylib indicates an exploited weak/@rpath import
    ([Dylib Hijacking on OS X, Wardle](https://www.virusbulletin.com/uploads/pdf/magazine/2015/vb201503-dylib-hijacking.pdf)).
    Derive thresholds per environment from observed Jaccard and failure-count distributions. A positive
    result -- a rule match, a statistical outlier, or a model alert -- is evidence of a probable dylib
    hijack: pivot to the writer or loading process and its parent lineage, the targeted/vulnerable application,
    the dylib path and code-signing state, the @rpath/weak-import resolution that was abused, and any
    resulting privileged execution or outbound network activity. A negative result helps rule out this
    specific vector but should be corroborated with the other questions here, since any single method
    can miss stealthy or living-off-the-land activity.'
