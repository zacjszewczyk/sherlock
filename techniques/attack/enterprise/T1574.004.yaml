questions:
- question: '[Stealth] Hash new dylibs and validate against dyld-expected path/signature (Symbolic Logic):
    Can you determine whether a .dylib is written into an application''s runtime search path or bundle
    location and is later mapped by an auto-starting process or signed application. The load path, signing
    state, or parent lineage differs from the host baseline. -- and specifically apply the ''Hash new
    dylibs and validate against dyld-expected path/signature'' approach to surface it?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), dylib hijacking lets an adversary run
    code inside a trusted macOS process by exploiting the dynamic loader''s @rpath/@loader_path search
    order and weak imports, inheriting that process''s privileges and code-signing trust. This evidence
    focuses on the condition that a .dylib is written into an application''s runtime search path or bundle
    location and is later mapped by an auto-starting process or signed application. The load path, signing
    state, or parent lineage differs from the host baseline. This Symbolic Logic approach works as follows:
    On a dylib create/close event (ES_EVENT_TYPE_NOTIFY_CREATE / NOTIFY_CLOSE on *.dylib), compute its
    SHA256 and check a TI feed of known-malicious dylibs, and inspect the code signature via osquery''s
    signature table. Alert if (a) the hash matches TI, OR (b) the dylib is unsigned, ad-hoc signed, or
    signed by a non-Apple/non-allowlisted Team ID AND its filename matches a weak import (LC_LOAD_WEAK_DYLIB)
    or an @rpath/LC_LOAD_DYLIB import of any locally installed application whose dyld-expected resolution
    path differs from this write location. Compute the expected @rpath/@loader_path resolution from the
    app''s LC_RPATH order ([Run-Path Dependent Libraries, Apple](https://developer.apple.com/library/archive/documentation/DeveloperTools/Conceptual/DynamicLibraries/100-Articles/RunpathDependentLibraries.html));
    this weak-import/@rpath plant is the canonical hijack primitive ([Dylib Hijacking on OS X, Wardle](https://www.virusbulletin.com/uploads/pdf/magazine/2015/vb201503-dylib-hijacking.pdf);
    scanner logic [Dylib Hijack Scanner, Objective-See](https://objective-see.org/products/dhs.html)).
    Treat unsigned/user-writable load targets as suspicious ([How Malware Persists on macOS, SentinelOne](https://www.sentinelone.com/blog/how-malware-persists-on-macos/);
    [The Art of Mac Malware, Wardle](https://taomm.org/)). Alert text must include dylib path, writer
    process, signing status, and matched vulnerable app. A positive result -- a rule match, a statistical
    outlier, or a model alert -- is evidence of a probable dylib hijack: pivot to the writer or loading
    process and its parent lineage, the targeted/vulnerable application, the dylib path and code-signing
    state, the @rpath/weak-import resolution that was abused, and any resulting privileged execution or
    outbound network activity. A negative result helps rule out this specific vector but should be corroborated
    with the other questions here, since any single method can miss stealthy or living-off-the-land activity.'
  answer_sources:
  - macOS Endpoint Security Framework (ESF) ES_EVENT_TYPE_NOTIFY_CREATE
  - macOS Endpoint Security Framework (ESF) ES_EVENT_TYPE_NOTIFY_MMAP
  - osquery file table (path, sha256)
  - osquery signature table
  - osquery process_open_files table
  - osquery process_events table
  - 'NAI: macOS endpoints, specifically LaunchAgent/LaunchDaemon plists in /Library/LaunchDaemons, /Library/LaunchAgents,
    ~/Library/LaunchAgents, and application bundles in /Applications/, ~/Applications/, and user-writable
    library paths like ~/Library/.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Hash new dylibs and validate against dyld-expected path/signature\n// A .dylib is written\
      \ into an application's runtime search path or bundle location and is later mapped by an auto-starting\
      \ process or signed application. The load path, signing state, or parent lineage differs from the\
      \ host baseline.\nFROM macos_esf, osquery, zeek\nWHERE event matches the condition above\n  AND\
      \ (path is user-writable OR signature is unsigned/ad-hoc/non-allowlisted\n       OR hash IN threat_intel\
      \ OR loaded_path != dyld_expected_rpath_resolution)\n  AND NOT allowlisted(process, dylib_path)\n\
      EMIT alert WITH dylib_path, writer_process, signing_status, vulnerable_app, host, user"
- question: '[Stealth] Score baseline similarity via Jaccard, prevalence, and preceding load failures
    (Statistical Method): Can you determine whether a .dylib is written into an application''s runtime
    search path or bundle location and is later mapped by an auto-starting process or signed application.
    The load path, signing state, or parent lineage differs from the host baseline. -- and specifically
