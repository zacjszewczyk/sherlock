name: 'T1059.005: Visual Basic'
id: bd9d1966-1071-427a-b064-4c1975797026
description: Investigate adversary abuse of Visual Basic (VBScript, VBE, and VBA macros) for code execution
  on Windows, macOS, and Linux. This playbook helps an analyst hunt for Windows Script Host activity (wscript.exe/cscript.exe)
  and mshta.exe that beacons to known or anomalous command-and-control infrastructure, script-host command
  lines carrying obfuscation, encoded payloads, or download/COM cradles (CreateObject, WScript.Shell,
  MSXML2.XMLHTTP, ADODB.Stream), Office applications spawning script hosts, .vbs/.vbe files dropped into
  writable directories and rapidly executed, vbscript.dll loaded by non-interpreter processes (in-memory
  hosting), malicious VBA macros with auto-execution triggers and download/execute primitives, and anomalous
  execution physics such as bursts of failed DNS/HTTP/connection operations indicative of staging or beaconing.
  It combines symbolic-logic correlation rules, statistical baselining, and machine-learning models across
  endpoint, network, and email/sandbox telemetry.
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did a Windows Script Host process (wscript.exe, cscript.exe, or mshta.exe) make an outbound
    connection to an IP address, domain, or URL that matches a high-confidence command-and-control or
    malicious-site threat-intelligence feed?
  context: 'Visual Basic payloads commonly use script hosts to reach attacker infrastructure for staging,
    beaconing, or download. Correlate Sysmon process (EID 1) and network (EID 3) events for wscript.exe/cscript.exe/mshta.exe
    and alert when the destination matches curated C2/malicious intelligence. Treat any first-party-observed
    script-host-to-internet connection as suspicious when the parent is an Office application or the script
    resides in a writable directory. A positive result is strong evidence of active execution against
    known-bad infrastructure rather than dormant script text; a negative result still leaves the rare/anomalous-destination
    questions to pursue. References: [LOLBAS](https://lolbas-project.github.io/); [Red Canary Threat Detection
    Report](https://redcanary.com/threat-detection-report/techniques/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User Workstations, Application Servers, Network Egress Points'
  range: Last 90 days, correlating process and network events within a 1-minute window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc = FROM [Sysmon1, Event4688] WHERE image IN [\"wscript.exe\",\"cscript.exe\",\"mshta.exe\"\
      ]\nnet = FROM [Sysmon3, Event5156, Zeek_conn] WHERE proc_image IN script_hosts\nALERT WHERE JOIN\
      \ proc WITH net ON host, pid, 1m AND net.dest IN threat_intel_c2\n  OR (proc.parent_image IN office_apps\
      \ OR proc.script_path IN writable_dirs)"
- question: Among destinations contacted by script-host processes, which domains are statistically rare
    or high-entropy (likely DGA), and which processes are generating bursts of failed resolutions or connections
    that signal beaconing or staging failure?
  context: 'Adversary VB tooling often reaches algorithmically generated or never-before-seen domains,
    and early-stage beacons frequently fail before succeeding. Score Zeek dns/conn destinations of script-host
    processes by 30-day prevalence and Shannon entropy, flagging domains below the 5th percentile prevalence
    and above the 95th percentile entropy. Separately profile failure state by counting NXDOMAIN, HTTP
    404, and blocked/RST connections per process per minute as a distinct beaconing/staging-failure signal.
    Rare+high-entropy destinations and failure bursts both indicate execution-phase C2 activity even when
    no intel match exists. References: [Real-Time Detection of DNS Exfiltration and Tunneling, Nadler
    et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User Workstations, Application Servers, Network Egress Points'
  range: Last 90 days, using a 30-day prevalence baseline and per-minute failure aggregation.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'dns = FROM Zeek_dns WHERE proc IN script_hosts

      prev = GROUP dns BY domain => distinct_hosts OVER 30d

      ALERT WHERE prevalence_pctile(domain) < 5 AND shannon_entropy(domain) > p95

      fails = GROUP [Zeek_dns, Zeek_conn] BY proc, minute => count(NXDOMAIN), count(rst_blocked), count(http_404)

      ALERT WHERE fails.NXDOMAIN > thr OR fails.rst_blocked > thr'
- question: Does an unsupervised anomaly model flag a script-host network session as an outlier across
    port, protocol, byte ratio, duration, destination prevalence, name entropy, and failed-resolution
    features?
  context: 'When neither intel nor simple thresholds catch the activity, model the full behavior of script-host
    egress. Apply Isolation Forest to Zeek conn/dns features (port, protocol, bytes-out/bytes-in ratio,
    duration, destination prevalence, name entropy, NXDOMAIN count) for wscript/cscript/mshta egress and
    flag anomalies, emitting the top-3 contributing features (for example low destination prevalence,
    high name entropy, high outbound-byte ratio) so the analyst can validate the alert quickly. This catches
    novel C2 patterns supporting the Execution tactic. References: [Real-Time Detection of DNS Exfiltration
    and Tunneling, Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User Workstations, Application Servers, Network Egress Points'
  range: Last 90 days, scoring sessions as they are observed against a 30-day feature baseline.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = EXTRACT(port, proto, bytes_out/bytes_in, duration, dest_prevalence, name_entropy,
      nxdomain_count) FROM script_host_egress

      score = IsolationForest.decision_function(features)

      explain = TOP3_FEATURES(features)

      ALERT WHERE score < anomaly_threshold'
- question: Was wscript.exe or cscript.exe launched with command-line arguments containing fileless-execution
    flags, remote-fetch URLs, or COM/download-cradle keywords such as //B, //E, CreateObject, WScript.Shell,
    MSXML2.XMLHTTP, or ADODB.Stream?
  context: 'Malicious VBScript invocations frequently expose their intent on the command line through
    silent/batch flags, inline HTTP(S) fetch arguments, and COM object instantiation used to download
    and run additional stages. Regex-scan Sysmon EID 1 / Windows EID 4688 command lines for these LOLBAS-catalogued
    abuse patterns. A match indicates a likely download cradle or fileless execution; preserve the full
    command line and any extracted URL for scoping and blocking. References: [LOLBAS](https://lolbas-project.github.io/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Domain Controllers, Web Servers'
  range: Last 90 days, prioritizing the current process tree.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT FROM [Sysmon1, Event4688]\nWHERE image IN [\"wscript.exe\",\"cscript.exe\"]\n  AND command_line\
      \ MATCHES regex(\"//B|//E|https?://|CreateObject|WScript.Shell|MSXML2.XMLHTTP|ADODB.Stream\")"
- question: Is a script-host command line statistically anomalous in entropy, length, or character-frequency
    distribution compared to the host's benign command-line baseline?
  context: 'Obfuscated VB commands deviate distributionally from normal scripting even when they avoid
    known keywords. Score command-line entropy, length, and character-frequency distribution per host
    baseline, flagging executions with entropy above the 95th percentile, length beyond 3 sigma, or low
    cosine similarity to the benign command-line corpus. This obfuscation-as-distributional-deviation
    approach surfaces packed or encoded arguments that signature rules miss, supporting Execution detection.
    References: [Revoke-Obfuscation, Bohannon & Holmes](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Domain Controllers, Web Servers'
  range: Last 90 days, compared against a 30-day per-host command-line baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'cmds = FROM [Sysmon1, Event4688] WHERE image IN script_hosts

      metrics = CALCULATE(entropy, length, char_freq_cosine_sim) PER host_baseline

      ALERT WHERE entropy > p95 OR length > mean + 3*stddev OR cosine_sim < 0.8'
- question: Does a supervised command-line classifier score a wscript/cscript invocation as malicious,
    and which tokens drove the decision?
  context: 'To catch novel obfuscation that evades both regex and simple statistics, use TF-IDF over command-line
    n-grams and keyword tokens with Logistic Regression or XGBoost to score wscript/cscript command lines,
    alerting on scores above 0.85 and surfacing the top-3 contributing tokens. The token explanation keeps
    the alert interpretable so analysts can confirm whether the flagged terms reflect genuine malicious
    execution. References: [Comprehensive evaluation of Mal-API-2019 dataset, ML in malware detection](https://arxiv.org/abs/2403.02232).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Domain Controllers, Web Servers'
  range: Last 90 days, scoring command lines at execution time.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = TFIDF_NGRAMS(command_line tokens)

      score = classifier.predict_proba(features)  # LogReg or XGBoost

      explain = TOP3_TOKENS(features)

      ALERT WHERE score > 0.85'
- question: Did a Microsoft Office application (winword.exe, excel.exe, powerpnt.exe, outlook.exe, msaccess.exe,
    mspub.exe, visio.exe) spawn a Windows Script Host or mshta.exe child process?
  context: 'An Office parent spawning a script host is a hallmark of macro-enabled spearphishing attachments
    that drop and run VBScript stages. Alert on Sysmon EID 1 / Windows EID 4688 when these Office parents
    spawn wscript.exe, cscript.exe, or mshta.exe, per the SigmaHQ suspicious-Office-child-process rule.
    This parent-child relationship is rare in benign workflows and strongly indicates malicious VB execution
    following document delivery. References: [Suspicious Microsoft Office Child Process, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_office_susp_child_processes/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Email Gateways, File Servers'
  range: Last 90 days, prioritizing the first occurrence per user/host.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT FROM [Sysmon1, Event4688]\nWHERE parent_image IN [\"winword.exe\",\"excel.exe\",\"powerpnt.exe\"\
      ,\"outlook.exe\",\"msaccess.exe\",\"mspub.exe\",\"visio.exe\"]\n  AND child_image IN [\"wscript.exe\"\
      ,\"cscript.exe\",\"mshta.exe\"]"
- question: Is an Office-to-ScriptHost parent-child pairing a first occurrence or above the historical
    norm for a given user or host?
  context: 'Even where some automation legitimately bridges Office and scripting, novelty and volume are
    informative. Baseline Office to ScriptHost parent-child pairs per user/host over 30 days and flag
    first occurrences or counts exceeding the historical norm, using rare-parent prevalence ranking (MITRE
    CAR-2014-11-002 outlier-parents approach). A first-seen or surging pairing elevates triage priority
    for Execution. References: [MITRE CAR-2014-11-002: Outlier Parents of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Email Gateways, File Servers'
  range: Last 90 days, using a 30-day per-user/host baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "pairs = GROUP [Sysmon1, Event4688] BY user, host, parent_image, child_image OVER 30d => count\n\
      ALERT WHERE parent_image IN office_apps AND child_image IN script_hosts\n  AND (first_seen(pair)=true\
      \ OR count > historical_norm)"
- question: Does a process-tree anomaly model assign low probability to an Office-to-ScriptHost execution
    sequence based on its surrounding provenance subgraph?
  context: 'Model process-tree/provenance subgraphs (parent-image, child-image, user, command line, subsequent
    network/child nodes) with a graph temporal autoencoder and flag low-probability Office to ScriptHost
    sequences, emitting the implicated nodes and edges as the explanation. This captures malicious document-driven
    execution chains whose individual steps look ordinary but whose overall structure is improbable, reinforcing
    the Execution tactic. References: [KAIROS, IEEE S&P 2024](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Email Gateways, File Servers'
  range: Last 90 days, with graph learning over the prior 30 days.
  queries:
  - technology: ML pipeline pseudocode
    query: 'graph = BUILD_PROVENANCE_SUBGRAPH(parent_image, child_image, user, command_line, child_net_nodes)

      score = graph_temporal_autoencoder.probability(office_to_scripthost_sequence)

      explain = IMPLICATED_NODES_EDGES(graph)

      ALERT WHERE score <= low_probability_threshold'
- question: Was a .vbs or .vbe file written to a writable directory such as %APPDATA%, %TEMP%, or C:\Users\Public
    and then executed by wscript.exe or cscript.exe within five minutes?
  context: 'Dropping a script into a user-writable directory and immediately invoking it is a classic
    VB staging pattern. Correlate Sysmon EID 11 file-create events for .vbs/.vbe in writable directories
    with EID 1 executions of the same path within five minutes. Validate coverage with the dropped-and-invoked
    scenarios in Atomic Red Team T1059.005. A matched write-then-execute pair is high-confidence evidence
    of malicious VB execution. References: [Atomic Red Team T1059.005](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.005/T1059.005.md).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Temporary File Directories, User Profile Directories'
  range: Last 90 days, correlating file-create and execution within a 5-minute window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'writes = FROM [Sysmon11, Event4663] WHERE file_ext IN [".vbs",".vbe"] AND path IN [%APPDATA%,%TEMP%,C:\\Users\\Public]

      execs = FROM [Sysmon1, Event4688] WHERE image IN ["wscript.exe","cscript.exe"]

      ALERT WHERE JOIN writes WITH execs ON host, file_path, 5m'
- question: Are script executions running from rare parent directories or arriving in volume bursts that
    deviate from the host baseline?
  context: 'Track parent directories and per-host counts of script executions, flagging paths in the bottom
    1st percentile (for example Downloads/Temp) and bursts (count per minute above baseline) using prevalence
    ranking from MITRE CAR-2014-11-002. Rare execution directories and sudden volume spikes both indicate
    staged or automated VB execution that warrants investigation under the Execution tactic. References:
    [MITRE CAR-2014-11-002: Outlier Parents of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Temporary File Directories, User Profile Directories'
  range: Last 90 days, with a 30-day directory-prevalence and per-minute volume baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'execs = FROM [Sysmon1, Event4688] WHERE image IN script_hosts

      dirstats = GROUP execs BY parent_dir => prevalence OVER 30d

      vol = GROUP execs BY host, minute => count

      ALERT WHERE prevalence_pctile(parent_dir) < 1 OR vol.count > host_baseline'
- question: Does an event-sequence anomaly model assign low probability to an (Office/browser) to FileCreate
    to wscript/cscript execution chain?
  context: 'Model the (Office/browser) to FileCreate to wscript/cscript execution sequence with a provenance-graph
    temporal autoencoder or HMM and flag low-probability sequences, surfacing the contributing nodes in
    the alert. This detects drop-and-execute chains that are individually mundane but collectively improbable,
    catching novel VB delivery-to-execution flows. References: [KAIROS, IEEE S&P 2024](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Temporary File Directories, User Profile Directories'
  range: Last 90 days, with sequence modeling over the prior 30 days.
  queries:
  - technology: ML pipeline pseudocode
    query: 'seq = BUILD_SEQUENCE((office|browser) -> FileCreate -> wscript|cscript)

      score = provenance_autoencoder.probability(seq)  # or HMM

      explain = CONTRIBUTING_NODES(seq)

      ALERT WHERE score <= low_probability_threshold'
- question: Was vbscript.dll or vbe7.dll loaded by a process that is not an allow-listed script interpreter
    (wscript.exe, cscript.exe, mshta.exe, iexplore.exe)?
  context: 'Loading the VBScript engine into a non-interpreter process indicates in-memory VBScript hosting
    in a custom or injected process, a stealthy execution path that avoids spawning a recognizable script
    host. Alert when Sysmon EID 7 reports vbscript.dll/vbe7.dll loads from images not on the allow-list.
    This is a strong indicator of advanced VB execution and merits immediate inspection of the loading
    image, parent, and signature state. References: [LOLBAS](https://lolbas-project.github.io/).'
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: User Workstations, Application Servers, System32 Directory'
  range: Last 90 days, with immediate triage around the module-load event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT FROM Sysmon7\nWHERE image_loaded IN [\"vbscript.dll\",\"vbe7.dll\"]\n  AND process_image\
      \ NOT IN [\"wscript.exe\",\"cscript.exe\",\"mshta.exe\",\"iexplore.exe\"]"
- question: Which processes loading vbscript.dll are rare across the fleet, appearing on fewer than 1%
    of endpoints or never seen before?
  context: 'Compute fleet-wide prevalence of processes loading vbscript.dll over 30 days and flag loaders
    seen on under 1% of endpoints or never before, using rare-artifact frequency ranking. A rarely seen
    loader of the VBScript engine is far more likely to be a custom malicious host than a routine application,
    helping prioritize Execution-stage hunts. References: [Using Frequency Analysis to Defend Office 365,
    Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).'
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: User Workstations, Application Servers, System32 Directory'
  range: Last 90 days, using a 30-day fleet-wide prevalence baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'loaders = GROUP Sysmon7 BY process_image WHERE image_loaded="vbscript.dll" => distinct_hosts
      OVER 30d

      ALERT WHERE distinct_hosts/total_hosts < 0.01 OR never_seen_before(process_image)'
- question: Does an anomaly model flag a vbscript.dll module-load event as an outlier based on loader
    image, parent, user, module path, and signature status?
  context: 'Apply Isolation Forest to Sysmon EID 7 features (loader image, parent, user, module path,
    signature status) and flag vbscript.dll loads scored as outliers, emitting the top-3 contributing
    features. This surfaces unusual in-memory VBScript hosting that neither the allow-list nor simple
    prevalence captures, supporting detection of stealthy VB execution. References: [Real-Time Detection
    of DNS Exfiltration and Tunneling, Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: User Workstations, Application Servers, System32 Directory'
  range: Last 90 days, scoring module-load events against a 30-day feature baseline.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = EXTRACT(loader_image, parent, user, module_path, signature_status) FROM Sysmon7
      WHERE image_loaded="vbscript.dll"

      score = IsolationForest.decision_function(features)

      explain = TOP3_FEATURES(features)

      ALERT WHERE score < anomaly_threshold'
- question: Does a delivered or opened Office document contain a VBA macro with an auto-execution trigger
    (AutoOpen, Document_Open, Workbook_Open) combined with file-write and process/download primitives
    (Shell, WScript.Shell, CreateObject, ADODB.Stream, MSXML2.XMLHTTP) or heavy obfuscation?
  context: 'Statically extract VBA macro source with olevba and alert on the AutoExec+Write+Execute triad,
    that is an auto-exec trigger co-occurring with Shell/WScript.Shell/CreateObject and a download cradle
    such as MSXML2.XMLHTTP or ADODB.Stream, or Win32 API declarations together with hex/Base64 obfuscation.
    This signature catches weaponized macro documents at the email gateway or sandbox before or as they
    execute, directly addressing VB-based Execution via spearphishing attachments. References: [oletools/olevba,
    Lagadec](https://www.decalage.info/python/oletools).'
  answer_sources:
  - Email Gateway / Attachment Sandbox
  - Sysmon Event ID 11
  - Microsoft AMSI (Event ID 1116/AMSI provider)
  - Windows Event ID 4688
  - 'NAI: Email Gateways, User Workstations, File Servers, Document Sandboxes'
  range: Last 90 days, evaluated at document delivery/open time.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "macro = OLEVBA_EXTRACT(document)\nALERT WHERE has_autoexec(macro) AND has_any(macro, [\"Shell\"\
      ,\"WScript.Shell\",\"CreateObject\"])\n  AND has_any(macro, [\"MSXML2.XMLHTTP\",\"ADODB.Stream\"\
      ])\n  OR (win32_api_declares(macro) AND obfuscation(macro))"
- question: Is an extracted VBA macro statistically obfuscated based on character-frequency deviation,
    entropy, and the ratio of obfuscation constructs versus a benign macro corpus?
  context: 'Score extracted macro source for character-frequency deviation, entropy above the 95th percentile,
    and ratio of obfuscation constructs (Chr(), string concatenation, array decode) versus the benign
    macro corpus, flagging distributional outliers. Heavy obfuscation in a macro is a reliable proxy for
    malicious intent even when specific keywords are hidden, enabling detection of evasive macro-based
    VB execution. References: [Revoke-Obfuscation, Bohannon & Holmes](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).'
  answer_sources:
  - Email Gateway / Attachment Sandbox
  - Sysmon Event ID 11
  - Microsoft AMSI (Event ID 1116/AMSI provider)
  - Windows Event ID 4688
  - 'NAI: Email Gateways, User Workstations, File Servers, Document Sandboxes'
  range: Last 90 days, compared against a benign macro corpus.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'macro = OLEVBA_EXTRACT(document)

      metrics = CALCULATE(char_freq_deviation, entropy, obfuscation_ratio(Chr,concat,array_decode)) VS
      benign_corpus

      ALERT WHERE entropy > p95 OR char_freq_deviation > threshold OR obfuscation_ratio > threshold'
- question: Does a supervised content classifier judge an extracted or AMSI-deobfuscated VBA macro to
    be malicious, and which tokens or topics drove the score?
  context: 'Tokenize extracted (and AMSI-deobfuscated) macro source, build TF-IDF/Doc2Vec+LSI feature
    vectors, and classify with a supervised model to detect unknown or obfuscated malicious macros, surfacing
    the top-3 contributing tokens/topics in the alert. AMSI provides post-deobfuscation visibility that
    static extraction may miss, and the classifier generalizes beyond known signatures to catch novel
    weaponized documents driving VB execution. References: [Using LSI to Detect Unknown Malicious VBA
    Macros, Mimura & Ohminami](https://www.jstage.jst.go.jp/article/ipsjjip/28/0/28_493/_article/-char/en);
    [AMSI-Based Detection Using Contextual Embeddings, Hendler et al.](https://arxiv.org/pdf/1905.09538).'
  answer_sources:
  - Email Gateway / Attachment Sandbox
  - Sysmon Event ID 11
  - Microsoft AMSI (Event ID 1116/AMSI provider)
  - Windows Event ID 4688
  - 'NAI: Email Gateways, User Workstations, File Servers, Document Sandboxes'
  range: Last 90 days, scoring macros at extraction and at AMSI capture time.
  queries:
  - technology: ML pipeline pseudocode
    query: 'macro = AMSI_DEOBFUSCATE(OLEVBA_EXTRACT(document))

      features = TFIDF_DOC2VEC_LSI(tokenize(macro))

      score = supervised_model.predict_proba(features)

      explain = TOP3_TOKENS_TOPICS(features)

      ALERT WHERE score > 0.85'
- question: Is a script-host process generating more than a tuned threshold of failed operations in a
    short window, such as more than 10 NXDOMAIN or more than 10 blocked/RST connections per minute or
    repeated HTTP 404s?
  context: 'Automated VB staging and beaconing often produce bursts of failed operations before succeeding.
    Alert when a script-host process exceeds a per-environment failure threshold in a short window, deriving
    the threshold from a benign baseline. A burst of failures from wscript/cscript is a distinctive signal
    of attacker trial-and-error or dead C2, complementing success-based detection of VB Execution. References:
    [Red Canary Threat Detection Report](https://redcanary.com/threat-detection-report/techniques/).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: User Workstations, Network Egress Points'
  range: Last 90 days, evaluated over per-minute windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'fails = GROUP [Zeek_dns, Zeek_conn, http] BY script_host_proc, minute => count(NXDOMAIN),
      count(rst_blocked), count(http_404)

      ALERT WHERE count(NXDOMAIN) > 10 OR count(rst_blocked) > 10 OR count(http_404) > tuned_threshold'
- question: Does a host's script-host spawn frequency or outbound byte volume/ratio exceed 3 sigma or
    the 99th percentile of its baseline, with success and failure states profiled separately?
  context: 'Baseline per-host script-host spawn frequency (count per minute) and outbound byte volume/ratio,
    flagging values beyond 3 sigma or the 99th percentile, and profile success versus failure state separately
    so failed-beacon bursts are scored independently. Anomalous execution physics, whether high spawn
