questions:
- question: '[Discovery] Correlate log enumeration hashes with network IOCs: Can you determine whether
    A process execution event (Windows Event ID 4688) with a file hash matching a known log enumeration
    tool is observed on a host. Within 5 minutes, the same host initiates an outbound network connection
    (Zeek conn.log) to an IP address or resolves a domain (Zeek dns.log) present on a threat intelligence
    feed of known command-and-control servers. -- specifically, using the ''Correlate log enumeration
    hashes with network IOCs'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary enumerates system and
    service logs to harvest valuable intelligence about the environment -- authentication records, installed
    or vulnerable software, and other hosts on the network -- and may also monitor logs in real time to
    track the defender''s incident response and adjust their tradecraft. Native utilities (wevtutil.exe,
    PowerShell Get-WinEvent/Get-EventLog, cat/grep/journalctl, ''log show'', cloud log-collection APIs)
    make this activity blend into routine administration, and a log clear (Event ID 1102/104) may follow
    to cover tracks. This evidence focuses on the condition that A process execution event (Windows Event
    ID 4688) with a file hash matching a known log enumeration tool is observed on a host. Within 5 minutes,
    the same host initiates an outbound network connection (Zeek conn.log) to an IP address or resolves
    a domain (Zeek dns.log) present on a threat intelligence feed of known command-and-control servers.
    This Symbolic Logic approach works as follows: Create a SIEM correlation rule that triggers when a
    Process Creation event (Windows Event ID 4688/Sysmon EID 1) has a ''ProcessHash'' matching a curated
    list of log-enumeration tool hashes OR matches the log-query utility patterns in [SigmaHQ EventLog
    Recon](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_eventlog_content_recon.yml).
    On match, query network logs (Zeek conn.log/dns.log) from the same ''HostName'' within 5 minutes where
    ''destination_ip'' or ''query'' matches a C2 threat-intel feed. Generate a high-severity alert and
    list the matched hash, utility command line, and destination as the contributing fields. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable log enumeration;
    pivot to the responsible process and its parent lineage, the user and logon session, the specific
    log channels or files touched, and any subsequent export, network transfer, or log-clearing activity
    to scope intent and impact. A negative result helps rule out this particular enumeration vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers; Network Egress Points; DNS Resolvers'
  range: Last 90 days (correlate event-centered windows of +/- 5 minutes around the log access)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Correlate log enumeration hashes with network IOCs (Symbolic Logic)

      source IN [Windows Event ID 4688, Zeek conn.log, Zeek dns.log]

      | approach: Create a SIEM correlation rule that triggers when a Process Creation event (Windows
      Event ID 4688/Sysmon EID 1) has a ''ProcessHash'' matching a curated list of log-enumeration tool
      hashes OR matches the log-query utility patterns in [SigmaHQ EventLog Recon](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_eventlog_content_recon.yml).

      | correlate over NAI: All Windows Endpoints and Servers; Network Egress Points; DNS Resolvers

      | emit alert with contributing fields and entity context (process, parent, user, logon_id, log channel/file,
      dest, bytes_out)'
