name: 'T1654: Log Enumeration'
id: c7f52b7b-c208-4d81-90cd-51ffd2135f2b
description: 'This playbook helps an analyst investigate whether an adversary is enumerating system and
  service logs to find useful data -- user authentication records, installed or vulnerable software, and
  other hosts on a compromised network -- or monitoring logs in real time to watch incident response and
  evade defenses (MITRE ATT&CK T1654, Log Enumeration). It spans Windows, Linux, macOS, ESXi, and cloud
  (IaaS) telemetry and pursues the behavior from complementary angles: native log-query utilities (wevtutil.exe,
  PowerShell Get-WinEvent/Get-EventLog, wmic ntevent, cat/less/grep/tail/journalctl, macOS ''log show''/fs_usage,
  ESXi shell reads of /var/log) executed with enumerative command lines; bursts of file-access events
  against .evtx files in C:\Windows\System32\Winevt\Logs\ or sensitive /var/log files; log access immediately
  followed by large or anomalous outbound transfers to rare or threat-intel destinations; clearing of
  the Security/System audit log (Event ID 1102/104) correlated with preceding recon; and bulk or rare
  cloud log-collection/export API calls (CloudWatch GetLogEvents/FilterLogEvents, GetObject on logging
  buckets, Azure VM Agent CollectGuestLogs). Detection methods combine deterministic symbolic-logic rules
  (Sigma EventLog Recon regex, SACL-audited 4663 access counting, stateful read-to-egress correlation,
  immediate alerting on log clears), statistical baselining (k-sigma and z-score on access counts and
  byte volume, command-line entropy/KL-divergence, rare-tuple scoring, per-principal API-rate baselines),
  and machine learning (ProvDetector and POIROT provenance-path scoring, DeepLog/ThreaTrace sequence and
  node anomalies, BERT/DistilBERT command-line and shell-session intent classification, Bayesian inference
  on log-clear sequences, and rare-function CloudTrail models), applied across Windows Security/Sysmon
  events, auditd, macOS unified logs, ESXi logs, Zeek conn/dns logs, and cloud control-plane logs.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
