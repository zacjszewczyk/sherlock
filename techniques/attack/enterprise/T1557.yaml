- question: Are HTTP response bodies being modified to inject malicious content, or are responses delivered
    over sessions whose certificate is absent from Certificate Transparency or whose JA3S is anomalous?
  context: An AiTM proxy can alter HTTP responses to inject malicious scripts or payloads. Apply signatures
    to Zeek http.log response bodies (with Windows Event ID 4688/5156 context for the proxying host) for
    known malicious injection patterns and alert on matches. Additionally flag responses delivered over
    a session whose TLS certificate is not in Certificate Transparency or whose JA3S server fingerprint
    is anomalous, since content modification implies TLS termination. Detecting injected content confirms
    the adversary is manipulating traffic at the AiTM point, supporting both collection and follow-on
    compromise. Verify the injecting host is the suspected proxy.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Web Proxies, Client Workstation Segments'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  http.log response_body =~ injection_signatures\n  OR (cert_fp not in ct_logs) OR (ja3s\
      \ in anomalous_set)\n  | join Win4688/5156 on proxy_host\n  | alert \"HTTP content injection / interception\""
- question: Has the rate of file-hash mismatches against known-good vendor hashes exceeded 1% for a given
    source or file class, indicating altered downloads in transit?
  context: An AiTM node modifying downloaded files changes their hashes. Compare Zeek files.log computed
    hashes against authoritative vendor hashes (combined with Windows session context), track the mismatch
    rate as a distinct failure-state signal, and alert when it exceeds 1% for a given source or file class.
    A cluster of hash mismatches for software downloads is a strong sign that files are being tampered
    with in transit at an interception point. This supports the collection/manipulation aspect of AiTM.
    Rule out legitimate version changes/CDN variance before escalation.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Web Proxies, Client Workstation Segments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=files\n  | lookup vendor_hashes file_name OUTPUT good_hash\n  | eval mismatch\
      \ = (sha256 != good_hash)\n  | stats avg(mismatch) as rate by src, file_class\n  | where rate >\
      \ 0.01\n  | alert"
- question: Does an autoencoder trained on legitimate HTTP response structures flag any responses with
    high reconstruction error (e.g., injected script tags, unusual body size, unexpected content-type)?
  context: Signature-based injection detection misses novel modifications. Train an autoencoder on legitimate
    HTTP response structures using Zeek and Windows metadata and flag responses with high reconstruction
    error, surfacing the top-3 deviating features (body size, injected script tags, content-type). This
    generalizes to unknown injection/manipulation techniques at an AiTM node. A high-error response whose
    explanation includes injected script tags on a normally-static resource strongly indicates content
    manipulation in transit.
  answer_sources:
