- question: Are there TLS sessions for a critical service whose validation_status reports self-signed
    or hostname mismatch, or whose certificate is absent from Certificate Transparency, corroborated by
    Windows TLS alert Events 36888/36887?
  context: An interception certificate frequently fails validation (self-signed, hostname mismatch) and
    is absent from Certificate Transparency. Alert on Zeek ssl.log sessions (cross-referenced with Windows
    Event 36888/36887 Schannel TLS alerts) where validation_status reports self-signed or hostname mismatch
    for a critical service SNI, or where the certificate is missing from CT logs. A burst of such failures
    for one shared service points to interception of that service's traffic for collection. A single failure
    may be benign (expired cert), but clustered failures for a sensitive SNI warrant investigation.
  answer_sources:
