    query: ">-\n  index=conn\n  | stats dc(peer) as peers, sum(in_bytes) as bin, sum(out_bytes) as bout\
      \ by host\n  | eval ratio = bin/bout\n  | eventstats p99(peers) as thr by role\n  | where peers\
      \ > thr AND ratio between (0.7,1.3)\n  | alert"
- question: Does graph betweenness-centrality analysis of network flows show any host whose centrality
    score spikes above its historical baseline, revealing newly-bridged host pairs?
  context: An AiTM relay mathematically sits on many shortest paths, raising its betweenness centrality.
    Build a graph of Zeek conn.log flows enriched with Windows session data, compute betweenness centrality
    per host, and highlight hosts whose scores spike above historical baseline. Report the suddenly-bridged
    host pairs as the explanation and validate thresholds on benchmark traffic (CIC-IDS2017). A host whose
    centrality jumps because it now bridges previously-unconnected segment pairs is a strong AiTM choke-point
    indicator for data collection.
