- question: Has the rate of certificate validation errors for any segment or shared service exceeded its
    dynamic rolling-history threshold, indicating a sudden cluster of failures?
  context: Interception of a shared service causes a synchronized spike in validation errors across affected
    clients. Measure certificate validation errors per segment via Zeek/Windows data, treating the failure
    state as a distinct signal, set dynamic thresholds from rolling history, and alert when exceeded.
    A sudden cluster of validation failures for one service across a segment is a hallmark of interception
    affecting many users at once. This statistical view catches mass interception that single-session
    rules might under-prioritize.
