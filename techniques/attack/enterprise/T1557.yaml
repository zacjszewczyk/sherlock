name: 'T1557: Adversary-in-the-Middle'
id: 6f8c1801-5e46-4d8e-ab95-defb68b9c602
description: 'Investigate whether an adversary has positioned themselves between two or more networked
  devices using Adversary-in-the-Middle (AiTM) techniques to steal credentials (TA0006) or to collect/manipulate
  sensitive data in transit (TA0009). This playbook helps an analyst hunt for the network and host artifacts
  of AiTM: forged or non-Certificate-Transparency TLS certificates, User-Agent versus JA3 fingerprint
  mismatches indicating TLS interception, rare certificate issuers and server fingerprints for sensitive
  services, ARP/LLMNR/NBT-NS poisoning notices and tool executions (Responder, Inveigh, ettercap, bettercap),
  gateway MAC rebindings, TLS downgrade and weak-cipher negotiation, poisoned DNS resolutions and entropy
  collapse on critical resolvers, credential POSTs to typosquatted or newly-registered domains, sensitive
  data patterns and altered files at suspected interception nodes, injected HTTP content and hash mismatches,
  unexpected relay and choke-point hosts revealed by betweenness centrality, certificate validation-error
  spikes, and many-to-one collection topologies. Each question pairs symbolic-logic, statistical, and
  machine-learning detection methods across Zeek/NSM network logs and Windows event telemetry so the analyst
  can confirm or rule out an active AiTM affecting credential access or data collection.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any TLS certificates presented to clients for corporate or sensitive services matching
    known-malicious AiTM certificate hashes, or missing the trust markers (Certificate Transparency presence,
    valid SCTs, expected CA) that legitimate certificates should have?
  context: An adversary establishing a TLS-terminating AiTM position must present a certificate to the
    victim. That certificate is frequently self-issued, signed by an unexpected/internal CA, or forged
    and therefore absent from public Certificate Transparency logs and lacking valid Signed Certificate
    Timestamps. Compare the x509 fingerprints observed on the path to sensitive services (SSO/VPN/email)
    against AiTM threat-intelligence hash lists for an immediate high-severity hit, and flag any certificate
    for a corporate domain that is missing from CT logs, has no valid SCTs, or chains to an unexpected
    issuer. Fingerprinting issuer/subject chain structure with JA4X surfaces anomalous chains that automation
    reuses. Windows Event ID 5156 confirms the outbound session actually occurred so a network observation
    can be tied to a specific host. A positive result is a strong indicator of forged-certificate interception
    for credential theft; a negative result reduces (but does not eliminate) interception risk.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Servers hosting SSO/VPN/email, Web Proxies, Client Workstation Segments'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  x509.log JOIN ssl.log on cert_chain_fps\n  | where server_name in (sensitive_services)\n\
      \  | eval malicious = cert_fp in (aitm_ti_hashes)\n  | eval no_ct = (cert_fp not in ct_log_lookup)\
      \ OR (scts_valid == false) OR (issuer not in approved_cas)\n  | where malicious OR no_ct\n  | join\
      \ Win5156 on (dest_ip, dest_port) within 5m\n  | alert severity=high"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=ssl server_name IN sensitive_services\n  | lookup aitm_ti cert_fp OUTPUT match\n\
      \  | lookup ct_logs cert_fp OUTPUT seen_in_ct\n  | where match=\"true\" OR seen_in_ct!=\"true\"\
      \ OR issuer NOT IN approved_cas\n  | join dest_ip [search EventCode=5156]\n  | eval severity=\"\
      high\""
- question: Is the declared HTTP User-Agent of a session inconsistent with the TLS client fingerprint
    (JA3) of that same session, indicating that a TLS-terminating proxy re-originated the connection?
  context: 'When an AiTM proxy terminates and re-establishes TLS, the TLS Client Hello (cipher suites,
    extensions, curves) it generates is produced by the proxy''s TLS stack, not the real browser. The
    HTTP User-Agent string, however, is usually copied verbatim from the victim. This produces a deterministic
    mismatch: a User-Agent claiming Chrome on Windows paired with a JA3 fingerprint that does not correspond
    to that browser/platform. Cross-reference Zeek http.log User-Agent with the JA3 of the same connection
    and alert on disagreement. This is a high-fidelity signal of HTTPS interception. A match between declared
    client and TLS fingerprint is expected for legitimate traffic; a mismatch warrants investigation of
    an interception proxy harvesting credentials.'
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Servers hosting SSO/VPN/email, Web Proxies, Client Workstation Segments'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  ssl.log JOIN http.log on uid\n  | lookup ja3_to_client_map ja3 -> expected_ua_family\n\
      \  | eval declared = ua_family(user_agent)\n  | where declared != expected_ua_family\n  | alert\
      \ \"UA/JA3 mismatch - possible TLS interception\""
- question: For each sensitive service, has a new or rare TLS certificate issuer or JA3/JA3S fingerprint
    appeared that is statistically anomalous against 30+ days of historical baseline?
  context: Legitimate sensitive services use a stable, small set of certificate issuers and present consistent
    JA3S server fingerprints; clients also exhibit a stable JA3 distribution. An AiTM interceptor introduces
    a new issuer or server fingerprint. Build per-SNI baselines of certificate issuers and JA3/JA3S fingerprints
    from Zeek ssl.log and 5156-confirmed connections, derive a per-SNI rarity threshold from at least
    30 days of history, and alert when an issuer/fingerprint appears in fewer than 0.1% of historical
    connections. A positive result indicates an emerging interception infrastructure not previously seen;
    rare-but-benign causes (legitimate CA rotation, new load balancer) must be ruled out before escalation.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Servers hosting SSO/VPN/email, Web Proxies, Client Workstation Segments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=ssl earliest=-30d\n  | stats count by server_name, issuer, ja3s\n  | eventstats\
      \ sum(count) as total by server_name\n  | eval pct = count/total\n  | where pct < 0.001\n  | alert\
      \ \"rare issuer/fingerprint for sensitive service\""
- question: Does an unsupervised/trained model score any observed certificate-and-connection record as
    highly anomalous (confidence > 0.9) based on x509 features and Windows connection metadata?
  context: Symbolic and statistical checks can miss novel interception infrastructure. Train a classifier
    or unsupervised model (Isolation Forest / One-Class SVM) on x509 features (issuer rarity, key size,
    validity period, SCT presence) joined with Windows connection metadata (destination IP/port, 5156
    events). Alert when model confidence exceeds 0.9 and surface the top-3 contributing features via LIME
    so the analyst understands why the record is anomalous (e.g., SCT absence + small key + rare issuer).
    This catches forged or interception certificates that evade exact-match and percentile rules. A high-confidence
    hit with explainable rare features is a strong AiTM credential-access indicator.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Servers hosting SSO/VPN/email, Web Proxies, Client Workstation Segments'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = extract(x509: issuer_rarity, key_size, validity_days, scts_present;\n   \
      \                  win5156: dest_ip, dest_port, drops)\n  | score = IsolationForest.predict(features)\n\
      \  | where score > 0.9\n  | explain = LIME.top3(features)\n  | alert with explain"
- question: Are there Zeek ARP/DNS spoofing notices, a gateway IP rebinding to a new MAC, a single MAC
    claiming many IP addresses, or executions of known AiTM tools (Responder, Inveigh, ettercap, bettercap)
    on endpoints?
  context: Layer-2 AiTM relies on ARP poisoning (one MAC answering for many IPs, or the gateway IP suddenly
    mapping to an attacker MAC) and on LLMNR/NBT-NS poisoning tools. Trigger high-severity alerts on Zeek
    notices such as ARP_Spoofing/DNS_Spoofing_Attack, gateway-IP-to-new-MAC rebindings, and one-MAC-many-IPs
    patterns. In parallel, watch Windows Event ID 4688 process creation for known poisoner binaries/command
    lines (Responder, Inveigh, ettercap, bettercap) and Event ID 4776 for the credential-validation traffic
    these tools coerce. Co-occurrence of a spoofing notice and a tool execution on the same segment is
    a high-confidence credential-access AiTM finding.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Windows Event ID 4688
  - Windows Event ID 4776
  - 'NAI: Core Network Switches, Client Workstation Segments, Domain Controllers, Wireless Access Points'
  range: Last 90 days; pivot +/- 1 hour around any spoof notice for tool execution
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  notice.log where note in (ARP_Spoofing, DNS_Spoofing_Attack)\n  OR (arp: gateway_ip\
      \ -> new_mac) OR (one mac maps to >K ips)\n  | alert severity=high"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  EventCode=4688 (NewProcessName IN (*Responder*,*Inveigh*,ettercap,bettercap)\n  OR CommandLine\
      \ matches poisoner_patterns)\n  | join host [search EventCode=4776]\n  | alert \"AiTM poisoning\
      \ tool execution\""
- question: Has the MAC address associated with a subnet's default gateway changed, or has any MAC issued
    ARP replies for more unique IPs than the 99th percentile within a 5-minute window?
  context: The default gateway MAC for a subnet is normally stable. An ARP-poisoning AiTM forces clients
    to use the attacker's MAC for the gateway, and the attacker often replies to ARP for many IPs to insert
    itself into multiple flows. Baseline gateway MAC per subnet and alert on any deviation. Additionally
    measure ARP-reply volume/frequency per MAC and flag any MAC mapping to more unique IPs than the 99th
    percentile in 5 minutes. A gateway MAC change is a direct interception indicator; a high fan-out of
    ARP replies indicates active poisoning. Legitimate causes (HA failover, NIC replacement) should be
    confirmed via change records.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Windows Event ID 4688
  - Windows Event ID 4776
  - 'NAI: Core Network Switches, Client Workstation Segments, Domain Controllers, Wireless Access Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=arp\n  | stats dc(ip) as ip_count values(mac) as mac by subnet, bin(_time,5m)\n\
      \  | eventstats p99(ip_count) as thr by subnet\n  | where ip_count > thr OR mac != lookup(gateway_baseline,\
      \ subnet)\n  | alert"
- question: Are there bursts of failed/unanswered LLMNR/NBT-NS resolution attempts, NXDOMAIN spikes, or
    ICMP port-unreachable bursts that exceed the rolling 95th percentile and accompany off-path poisoning?
  context: Successful poisoning often leaves a footprint in the failure channel rather than the success
    channel. Off-path attacks (e.g., SAD DNS) and name-resolution poisoning produce bursts of unanswered
    LLMNR/NBT-NS queries, NXDOMAIN spikes, and ICMP port-unreachable floods used to probe ephemeral ports.
    Track this failure-mode telemetry as a distinct signal from successful resolutions and alert when
    rates exceed the rolling 95th percentile. This profiling catches the noisy reconnaissance/poisoning
    phase before or during credential interception. A spike correlated with subsequent unusual authentications
    strengthens the case.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Windows Event ID 4688
  - Windows Event ID 4776
  - 'NAI: Core Network Switches, Client Workstation Segments, Domain Controllers, Wireless Access Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=dns OR proto=llmnr OR icmp\n  | stats count(eval(rcode=NXDOMAIN)) as nx, count(eval(unanswered))\
      \ as ua,\n          count(eval(icmp_type=port_unreach)) as pu by bin(_time,5m), src\n  | eventstats\
      \ p95(nx) p95(ua) p95(pu)\n  | where nx>p95_nx OR ua>p95_ua OR pu>p95_pu\n  | alert"
- question: Do per-host LLMNR/NBT-NS and ARP volumes deviate significantly from a learned time-series/autoencoder
    forecast, indicating anomalous name-resolution or layer-2 activity?
  context: Manual thresholds miss subtle or slow poisoning. Apply Kitsune-style incremental autoencoders
    (AfterImage features) or ARIMA/Prophet forecasting to per-host LLMNR/NBT-NS and ARP volumes and alert
    when observations deviate significantly from the forecast. The Kitsune public dataset contains ARP
    MitM and Active Wiretap AiTM traffic for tuning, and per-feature reconstruction error names the top
    contributing channels (e.g., ARP reply rate). This is well-suited to detecting an endpoint that begins
    running a poisoner. A flagged host whose top error channel is ARP-reply volume strongly suggests layer-2
    AiTM for credential access.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Windows Event ID 4688
  - Windows Event ID 4776
  - 'NAI: Core Network Switches, Client Workstation Segments, Domain Controllers, Wireless Access Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  per_host series = volume(llmnr, nbtns, arp) by host, 1m\n  | model = Kitsune_autoencoder\
      \ OR Prophet.fit(history)\n  | err = recon_error(series)\n  | where err > anomaly_threshold\n  |\
      \ report top_feature(err)\n  | alert"
- question: Are sessions to critical services negotiating deprecated TLS versions (SSLv2/SSLv3/TLSv1/TLSv1.1),
    known weak/export-grade cipher suites, or weak Diffie-Hellman groups (DHE_EXPORT, 512-bit or 1024-bit
    DH)?
  context: A downgrade AiTM forces client and server to negotiate the weakest mutually acceptable parameters
    so the attacker can decrypt or manipulate traffic. Alert on Zeek ssl.log and Windows Event ID 5156
    records for critical services where the TLS version is SSLv2/SSLv3/TLSv1/TLSv1.1, the cipher suite
    matches a weak/export-grade list, or a DHE_EXPORT / 512-bit / 1024-bit DH group is negotiated. These
    are hard indicators of an active downgrade (DROWN, Logjam). For modern environments these parameters
    should essentially never appear on sensitive services, so any hit is high-value and should be investigated
    as interception enabling credential theft.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Internal Application Servers, Web Proxies, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  ssl.log where server_name in (critical_services)\n  AND (version in (SSLv2,SSLv3,TLSv1,TLSv1.1)\n\
      \       OR cipher in (weak_export_ciphers)\n       OR dh_group in (DHE_EXPORT,512,1024))\n  | join\
      \ Win5156 on (dest_ip,dest_port)\n  | alert severity=high \"TLS downgrade indicator\""
- question: Has the proportion of weak/deprecated TLS sessions to any sensitive service risen above its
    95th-percentile baseline, and are downgrade handshakes completing (vs aborting)?
  context: 'A single weak session may be a misconfigured client, but a measurable increase in the share
    of weak sessions to one service signals systematic downgrade interception. Maintain per-SNI baselines
    of TLS version/cipher usage combining Zeek and Windows metadata, compute moving averages of weak-session
    percentage, and escalate when the current value exceeds the 95th percentile. Track downgrade State
    separately: a handshake that completed with weak parameters (attacker succeeded) is more serious than
    one that aborted (defense held). A rising completed-weak ratio for a sensitive service is a strong
    AiTM downgrade indicator.'
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Internal Application Servers, Web Proxies, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=ssl server_name IN sensitive\n  | eval weak = version_is_weak OR cipher_is_weak\n\
      \  | timechart span=1h avg(weak) as weak_ratio, count(eval(weak AND completed)) as weak_done by\
      \ server_name\n  | eventstats p95(weak_ratio) as thr by server_name\n  | where weak_ratio > thr\n\
      \  | alert"
- question: Does a downgrade-probability model score any session above the chosen threshold based on TLS
    metadata, user-agent, JA3, SNI, time-of-day, and source subnet features?
  context: To catch downgrade interception that is robust to TLS 1.3 encryption, train a logistic-regression
    or flow-feature classifier on Zeek ssl/http and Windows 5156 features (user-agent, JA3, SNI, time
    of day, source subnet) and score each connection's downgrade likelihood. Flag connections above the
    probability threshold and list the top-3 driving features so the analyst can validate (e.g., weak
    cipher + off-hours + unusual subnet). This complements rules by generalizing to novel downgrade patterns.
    A high-probability flag concentrated on a sensitive service indicates likely AiTM downgrade for credential
    access.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Internal Application Servers, Web Proxies, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = (tls_version, cipher, ja3, sni, hour, src_subnet, user_agent)\n  | p = LogisticRegression.predict_proba(features)\n\
      \  | where p > threshold\n  | report top3_features\n  | alert"
- question: Are high-value domains resolving to IP addresses outside their legitimate ranges, into RFC1918
    blocks (excluding approved proxies), or to answers that disagree with the authoritative server?
  context: DNS-based AiTM redirects victims to an attacker endpoint by poisoning resolution. Monitor Zeek
    dns.log and Windows Event IDs 4688/5156 for critical domains resolving to IPs outside their published/legitimate
    ranges, or into internal RFC1918 space where no approved proxy exists, and compare answers to the
    authoritative server's response. Raise an alert on any disagreement. The 4688/5156 context links the
    resolving clients to the host they then connect to. A high-value domain pointing at an internal non-proxy
    IP is a direct interception indicator; verify against legitimate split-horizon DNS before escalating.
  answer_sources:
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Internal DNS Resolvers, Client Workstation Segments, Network Egress Points, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  dns.log where query in (high_value_domains)\n  AND (answer not in legit_ranges[query]\n\
      \       OR (answer in RFC1918 AND answer not in approved_proxies)\n       OR answer != authoritative_lookup(query))\n\
      \  | join Win4688/5156 on client_ip\n  | alert"
- question: Has the entropy of resolved IP addresses for any high-value domain dropped sharply (mass convergence
    onto one IP), and are off-path poisoning failure signals (ICMP port-unreachable bursts, duplicate/conflicting
    transaction IDs) present?
  context: 'When many clients are poisoned to resolve a domain to a single attacker IP, the diversity
    (entropy) of resolved IPs for that domain collapses. Track hourly entropy of resolved IPs per high-value
    domain using Zeek/Windows data and alert on a sudden drop, which indicates mass poisoning toward one
    collection point. Concurrently profile failure-mode signals that precede successful off-path poisoning:
    ICMP port-unreachable bursts and duplicate/conflicting DNS transaction IDs (SAD DNS). The combination
    of an entropy collapse and these precursors is a strong AiTM-via-DNS indicator supporting credential
    interception.'
  answer_sources:
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Internal DNS Resolvers, Client Workstation Segments, Network Egress Points, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=dns query IN high_value\n  | bin _time span=1h\n  | stats dc(answer) as uniq,\
      \ entropy(answer) as H by query, _time\n  | delta H as dH\n  | where dH < -drop_threshold\n  | append\
      \ [search icmp port_unreach OR dup_txid]\n  | alert"
- question: Does clustering of (client IP, queried domain, resolved IP) tuples reveal a cluster where
    multiple clients suddenly share a new, non-legitimate resolved IP?
  context: Mass DNS poisoning manifests as many distinct clients converging on the same new, illegitimate
    IP for a sensitive domain. Apply DBSCAN to (client IP, queried domain, resolved IP) tuples enriched
    with Windows process/context to detect dense clusters where multiple clients share a new IP that is
    not in the domain's legitimate range. Report the shared resolved IP and member count as the explanation.
    This unsupervised approach finds coordinated redirection without predefined thresholds. A large cluster
    pointing at a non-corporate IP is a high-confidence AiTM redirection indicator.
  answer_sources:
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Internal DNS Resolvers, Client Workstation Segments, Network Egress Points, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  tuples = (client_ip, query, answer) enriched with win_process\n  | clusters = DBSCAN(tuples,\
      \ eps, min_samples)\n  | where cluster.shared_answer not in legit_ranges AND cluster.size >= N\n\
      \  | report shared_answer, member_count\n  | alert"
- question: Are users sending HTTP POST requests (potentially carrying credentials) to suspicious/typosquatted
    domains following AiTM indicators on the same host, including over sessions whose certificate is absent
    from Certificate Transparency?
  context: After establishing an AiTM position, an adversary harvests credentials submitted by the victim,
    often via POST to an attacker-controlled or typosquatted domain. Link Zeek http.log POST requests
    with prior AiTM alerts for the same host and Windows Event IDs 4688/4624 (process and logon context),
    match destination hosts against phishing/typosquat feeds, and flag any session whose TLS certificate
    is not present in Certificate Transparency. Raising an alert on this combination ties a credential
    submission to interception infrastructure. A POST to a typosquatted, recently registered domain over
    a non-CT certificate immediately after an AiTM notice is a high-confidence credential-theft finding.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Network Egress Points, Web Proxies, Client Workstation Segments'
  range: Last 90 days; pivot to AiTM alerts within prior 24h on same host
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  http.log where method==POST\n  | lookup phishing_typosquat_feed host\n  | eval no_ct\
      \ = cert_fp not in ct_logs\n  | where (host in feed OR no_ct)\n  | join prior_aitm_alert on src_host\
      \ within 24h\n  | join Win4688/4624 on host\n  | alert"
- question: Are users posting credentials to domains that are newly registered (<30 days old) or seen
    by fewer than 0.1% of users, deviating from each user's baseline POST destinations?
  context: Phishing/AiTM collection endpoints are typically new and rarely visited. Baseline each user's
    normal POST destinations from Zeek http.log and Windows logon data, enrich candidate domains with
    WHOIS registration age and reputation, and alert when a user submits POST data to a domain younger
    than 30 days or observed by fewer than 0.1% of users in the environment. This catches first-time credential
    submissions to attacker infrastructure even without a prior AiTM notice. A credential POST to a brand-new,
    near-unique domain is a strong indicator of AiTM-enabled credential capture.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Network Egress Points, Web Proxies, Client Workstation Segments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=http method=POST\n  | lookup whois domain OUTPUT reg_age\n  | eventstats dc(user)\
      \ as users_seen by domain\n  | eval total_users = <env_user_count>\n  | where (reg_age < 30) OR\
      \ (users_seen/total_users < 0.001)\n  | where domain not in user_baseline[user]\n  | alert"
- question: Does a classifier flag any POST request as having high credential-submission probability based
    on URI patterns, form fields, domain features, JA3 fingerprint, and AiTM/Windows correlation?
  context: To detect credential capture that evades simple feeds and percentiles, train a classifier on
    URI patterns, form field names, domain features (age/reputation), JA3 fingerprint rarity, and AiTM/Windows
    correlation signals. Flag POSTs with high credential-submission probability and surface the top-3
    contributing features (e.g., domain age, fingerprint rarity, prior AiTM alert) in the alert text for
    analyst triage. This generalizes beyond known-bad lists to novel collection sites. A high-probability
    flag whose explanation includes a prior AiTM alert and a rare JA3 is a strong AiTM credential-theft
    indicator.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Network Egress Points, Web Proxies, Client Workstation Segments'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = (uri_tokens, form_fields, domain_age, domain_rep, ja3_rarity, prior_aitm,\
      \ logon_ctx)\n  | p = Classifier.predict_proba(features)\n  | where p > threshold\n  | report top3_features\n\
      \  | alert"
- question: Does traffic or file transfer to/from a suspected AiTM node contain sensitive data patterns
    (SSNs, credit card numbers, sensitive strings) in unencrypted flows resulting from downgrade or interception?
  context: Once positioned, an AiTM node sees plaintext that interception or downgrade exposed. Apply
    IDS/DLP regexes to Zeek conn.log/files.log payloads and Windows Event ID 5156 sessions on suspected
    AiTM nodes to detect SSNs, credit card numbers (PAN), and other sensitive strings appearing in cleartext
    flows that should be encrypted. A hit confirms that sensitive data is being collected at the interception
    point. This directly supports the Collection question of whether the adversary is gathering data via
    AiTM. Validate that the flow is genuinely unexpected (not a sanctioned cleartext service) before escalation.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Windows Event ID 5156
  - 'NAI: Core Network Switches, File Servers, Database Servers, Client Workstation Segments'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
