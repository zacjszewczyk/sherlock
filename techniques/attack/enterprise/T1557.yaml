  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  series = validation_error_count by sni, error_type, 1h\n  | fc = ARIMA.forecast(series)\n\
      \  | where observed > fc.upper\n  | report sni, error_type\n  | alert"
- question: Is a non-allowlisted host receiving connections from more than N unique hosts (e.g., 20) within
    a 10-minute window, acting as an unexpected aggregation point?
  context: A collection node aggregating intercepted traffic shows a sudden many-to-one connection pattern.
    Alert when Zeek conn.log and Windows Event ID 5156 show a non-allowlisted host receiving connections
    from more than N unique hosts (e.g., N=20) in 10 minutes. Windows Event ID 4688 provides the process
    context on the aggregating host. This identifies an endpoint that abruptly becomes a hub for many
    clients, consistent with AiTM data collection. Confirm the host is not a legitimate, recently-deployed
    service before escalating.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Core Network Switches, Datacenter Network Fabric, Client Workstation Segments'
  range: Last 90 days
