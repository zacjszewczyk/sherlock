  - technology: Zeek/pseudocode
    query: ">-\n  conn.log\n  | bin _time span=10m\n  | stats dc(orig_h) as fan_in by resp_h, _time\n\
      \  | where resp_h not in allowlist AND fan_in > 20\n  | join Win4688/5156 on resp_h\n  | alert"
- question: Does any host not designated as a collector exhibit a bytes-received-vs-sent ratio and inbound
    peer count beyond the role-based 99th percentile?
  context: An AiTM collection point ingests far more than it sends and draws connections from many peers.
    Compute, per host, the ratio of bytes received versus sent and the inbound peer count using Zeek and
    Windows data (volume/frequency), and flag outliers not designated as collectors beyond the role-based
    99th percentile. This statistical profile catches a quiet aggregation node even without an explicit
    threshold breach. A non-collector host with high inbound-byte dominance and many inbound peers is
    a candidate AiTM collection point.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Core Network Switches, Datacenter Network Fabric, Client Workstation Segments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=conn\n  | stats sum(in_bytes) as bin, sum(out_bytes) as bout, dc(orig_h) as in_peers\
      \ by resp_h\n  | eval rx_ratio = bin/(bout+1)\n  | eventstats p99(rx_ratio) p99(in_peers) by role\n\
      \  | where resp_h not in collectors AND rx_ratio>p99_rx AND in_peers>p99_peers\n  | alert"
- question: Does community/topology detection on the network graph reveal a host forming a star topology
    (high fan-in), identifying the spoke hosts and fan-in count?
  context: Collection topologies appear as star/hub structures in the network graph. Run Louvain/community
    detection (or Kitsune anomaly scoring) on the network graph enriched by Windows metadata and highlight
    hosts forming star topologies, reporting the spoke hosts and fan-in count as the explanation. This
    unsupervised view surfaces aggregation hubs that ratio-based rules might miss and provides the member
    list for triage. A newly-formed hub with many spoke clients converging on one non-collector host is
    a strong AiTM data-collection indicator.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Core Network Switches, Datacenter Network Fabric, Client Workstation Segments'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  G = graph(conn.log) enriched win_meta\n  | communities = Louvain(G)\n  | hubs = nodes\
      \ where in_degree >> median AND star_shape\n  | report hub, spoke_hosts, fan_in\n  | alert"
