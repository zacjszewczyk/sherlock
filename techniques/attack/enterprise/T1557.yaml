      \  | err = recon_error(features)\n  | where err > thr\n  | report top3_deviating_features\n  | alert"
- question: Is a non-allowlisted, non-gateway host routing or relaying traffic between two other hosts,
    or claiming the gateway role via ARP?
  context: An AiTM choke point appears as an unexpected host bridging traffic between others. Trigger
    when Zeek conn.log and Windows 5156 show a non-allowlisted host routing/relaying traffic between two
    other hosts, or claiming the gateway role via ARP. This identifies an internal endpoint inserted into
    the traffic path for collection. Unlike sanctioned proxies/routers, this host is not on the allowlist
    for that role. A non-gateway workstation relaying flows between server pairs is a direct AiTM interception
    indicator supporting data collection.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Core Network Switches, Internal Network Segments, Datacenter Network Fabric'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log where relay_pattern(A -> X -> B) AND X not in allowlisted_routers\n  OR (arp:\
      \ X claims gateway_ip)\n  | join Win5156 on X\n  | alert \"unauthorized relay/gateway\""
- question: Has any host's peer count or bytes-in/bytes-out ratio suddenly risen beyond its role-based
    percentile baseline, indicating it became a traffic intermediary?
  context: A host that becomes an AiTM intermediary suddenly talks to many peers and shows a balanced
    bytes-in/bytes-out (relay) ratio. Baseline each host's peer count and byte ratios from Zeek and Windows
    data (volume/frequency) and flag hosts suddenly communicating with many peers beyond their role-based
    percentiles. This statistical view catches a quietly inserted relay before signatures fire. A workstation
    whose peer count and relay ratio jump well above baseline is a candidate AiTM collection point; confirm
    with flow-path analysis.
  answer_sources:
