- question: Does a forecasting/anomaly model flag certificate validation-error counts exceeding predicted
    intervals, naming the SNI and error type driving the anomaly?
  context: Use ARIMA (or Isolation Forest on validation-error features) on combined validation-error volumes
    and flag counts that exceed forecast intervals, naming the SNI and error type that drove the anomaly.
    This anticipates expected error baselines (including normal noise) and isolates true spikes that indicate
    interception of a shared service. The model output names the offending service and error type so the
    analyst can immediately pivot. An out-of-forecast spike on a sensitive SNI with hostname-mismatch
    errors is a strong AiTM collection indicator.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Windows Event ID 36888
  - Windows Event ID 36887
  - 'NAI: Network Egress Points, Client Workstation Segments, Authentication Servers'
