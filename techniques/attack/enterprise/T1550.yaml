- question: '[Lateral Movement] Cross-check TGS requests with TGT issuance: can you confirm or rule out
    that a Kerberos Service Ticket (TGS-REQ) is requested for a user account from an IP address, where
    no corresponding Kerberos Ticket-Granting Ticket (TGT-REQ) was recently issued to that same user from
    the same IP, indicating a stolen ticket is being used. Using the symbolic logic approach, what does
    the available telemetry show?'
  context: 'Tactic: Lateral Movement (TA0008). Information requirement: Is the adversary leveraging stolen
    authentication material to bypass access controls and evade defenses? Observable under investigation:
    A Kerberos Service Ticket (TGS-REQ) is requested for a user account from an IP address, where no corresponding
    Kerberos Ticket-Granting Ticket (TGT-REQ) was recently issued to that same user from the same IP,
    indicating a stolen ticket is being used. Approach (Symbolic Logic): For each Event 4769, extract
    Account Name, Client Address, and Ticket Encryption Type. Perform a stateful lookup for a matching
    Event 4768 (TGT) for the same account+address within 10 hours; if absent, raise a high-severity Pass/Overpass-the-Ticket
    alert. Also flag Encryption Type ''0x17'' (RC4-HMAC) in an AES domain, ticket lifetimes exceeding
    domain Maximum-Ticket-Lifetime, and SIDs/account names that do not resolve - the forged-ticket invariants
    from [Detecting Forged Kerberos Tickets, Grippo and Kholidy](https://arxiv.org/abs/2301.00044) and
    [JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf). A positive result
    (a signature match, a statistically significant deviation, or a high-confidence model score) is evidence
    that stolen authentication material is being used to bypass access controls and move laterally; a
    negative result helps rule out this technique for the examined principals and hosts. Corroborate any
    hit against the named area of interest and pivot to surrounding authentication, process-creation,
    and network telemetry to reconstruct the full attack chain.'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 7 days; event-centered correlation within minutes of the triggering authentication
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Security EventCode=4769

      | lookup recent 4768 (TGT) where Account=Account AND ClientAddress=ClientAddress within 10h

      | where NOT tgt_found OR TicketEncryptionType=''0x17''(RC4 in AES domain) OR ticket_lifetime>domain_max
      OR sid_unresolved

      | alert severity=''high'' label=''Pass/Overpass-the-Ticket'''
  - technology: Zeek/pseudocode
    query: 'kerberos.log

      | join request_type=''TGS'' with prior request_type=''AS''(TGT) on client, host within 10h

      | where missing(AS) OR cipher=''rc4-hmac'' | alert'
