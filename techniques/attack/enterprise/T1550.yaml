name: 'T1550: Use Alternate Authentication Material'
id: 82a86056-109d-4ae0-a338-42bd7dc609c4
description: 'Investigate adversary use of alternate authentication material - password hashes, Kerberos
  tickets, NTLM hashes, OAuth/SAML access and refresh tokens, SSH keys, and cloud instance-metadata or
  STS tokens - to bypass normal access controls and move laterally without knowing plaintext credentials.
  This playbook helps an analyst hunt for: execution of credential-theft tooling (Mimikatz, Rubeus) and
  named-pipe abuse; Kerberos forgery and replay (Pass/Overpass-the-Ticket, Silver/Golden tickets) via
  TGS/TGT correlation, failure-code shifts, and rare SPN requests; Pass-the-Hash and overpass-the-hash
  chains (Logon Type 9 NewCredentials, NTLM Type-3 logons followed by process/service creation); rapid
  logon fan-out, host-to-host hop chains, and anomalous privileged authentication; and stolen web-credential/token
  reuse against SaaS, Office Suite, Identity Provider, and IaaS APIs without interactive context or MFA.
  It combines symbolic-logic detections, statistical baselining, and machine-learning models across Windows
  event logs, Linux auditd, Zeek network telemetry, and cloud/identity audit logs to determine whether
  stolen authentication material is being used to bypass access controls and evade defenses.'
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
