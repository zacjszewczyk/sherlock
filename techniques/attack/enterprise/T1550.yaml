    credential-theft tooling. Derive per-parent thresholds from local data, not global constants. A positive
    result (a signature match, a statistically significant deviation, or a high-confidence model score)
    is evidence that stolen authentication material is being used to bypass access controls and move laterally;
    a negative result helps rule out this technique for the examined principals and hosts. Corroborate
    any hit against the named area of interest and pivot to surrounding authentication, process-creation,
    and network telemetry to reconstruct the full attack chain.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 17 (Sysmon)
  - Windows Event ID 18 (Sysmon)
  - Zeek smb.log
  - Zeek dce_rpc.log
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, File Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (4688, Sysmon EventCode=1) earliest=-30d

      | where lower(ParentProcessName) IN (''powershell.exe'',''services.exe'',''rundll32.exe'')

      | eval len=len(CommandLine), ent=shannon_entropy(CommandLine)

      | eventstats avg(len) as mlen, stdev(len) as slen, avg(ent) as ment, stdev(ent) as sent by ParentProcessName

      | where len > mlen+3*slen OR ent > ment+3*sent | alert'
