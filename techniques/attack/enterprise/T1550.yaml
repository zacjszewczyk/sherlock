questions:
- question: '[Lateral Movement] Alert on credential-theft signatures: can you confirm or rule out that
    the execution of a process, or network access to a named pipe, that matches signatures of known credential
    theft tools (e.g., Mimikatz, Rubeus) is observed on a host. Using the symbolic logic approach, what
    does the available telemetry show?'
  context: 'Tactic: Lateral Movement (TA0008). Information requirement: Is the adversary leveraging stolen
    authentication material to bypass access controls and evade defenses? Observable under investigation:
    The execution of a process, or network access to a named pipe, that matches signatures of known credential
    theft tools (e.g., Mimikatz, Rubeus) is observed on a host. Approach (Symbolic Logic): Maintain a
    watchlist of credential-theft tool indicators and apply it to first-party telemetry. Query Windows
    Event ID 4688 for process names (''mimikatz.exe'',''rubeus.exe'') or command-line tokens (''sekurlsa::logonpasswords'',''sekurlsa::pth'',''asktgt'',''ptt'',''kerberos::'').
    Query Sysmon Event 17/18 for named-pipe create/connect matching ''\\.\pipe\mimi*'',''\\.\pipe\psexesvc'',''\\.\pipe\paexec*'',''\\.\pipe\csexec*''.
    Query Zeek smb.log/dce_rpc.log for those pipes and ''svcctl''/''atsvc''/''winreg'' endpoints. The
    tool-to-event mappings in [Detecting Lateral Movement through Tracking Event Logs, JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf)
    and the Rubeus/Mimikatz indicators in [Detecting Forged Kerberos Tickets, Grippo and Kholidy](https://arxiv.org/abs/2301.00044)
    define the signatures. Generate a critical alert on any match. A positive result (a signature match,
    a statistically significant deviation, or a high-confidence model score) is evidence that stolen authentication
    material is being used to bypass access controls and move laterally; a negative result helps rule
    out this technique for the examined principals and hosts. Corroborate any hit against the named area
    of interest and pivot to surrounding authentication, process-creation, and network telemetry to reconstruct
    the full attack chain.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 17 (Sysmon)
  - Windows Event ID 18 (Sysmon)
  - Zeek smb.log
  - Zeek dce_rpc.log
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, File Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (WinEventLog:Security EventCode=4688, WinEventLog:Sysmon EventCode=1)\n| where lower(NewProcessName)\
      \ IN ('mimikatz.exe','rubeus.exe')\n   OR CommandLine MATCHES '(?i)(sekurlsa::logonpasswords|sekurlsa::pth|kerberos::|asktgt|\\\
      bptt\\b)'\n| eval severity='critical' | alert"
  - technology: SIEM/Sysmon pipe pseudocode
    query: 'source=WinEventLog:Sysmon EventCode IN (17,18)

      | where PipeName MATCHES ''(?i)\\\\\.\\pipe\\(mimi.*|psexesvc|paexec.*|csexec.*)''

      | alert severity=''critical'''
  - technology: Zeek/pseudocode
    query: '(smb.log OR dce_rpc.log)

      | where named_pipe IN (''psexesvc'',''paexec'',''csexec'') OR endpoint IN (''svcctl'',''atsvc'',''winreg'')

      | count by id.orig_h, id.resp_h | alert'
- question: '[Lateral Movement] Profile named-pipe access volume and failures: can you confirm or rule
    out that the execution of a process, or network access to a named pipe, that matches signatures of
    known credential theft tools (e.g., Mimikatz, Rubeus) is observed on a host. Using the statistical
    method approach, what does the available telemetry show?'
  context: 'Tactic: Lateral Movement (TA0008). Information requirement: Is the adversary leveraging stolen
    authentication material to bypass access controls and evade defenses? Observable under investigation:
    The execution of a process, or network access to a named pipe, that matches signatures of known credential
    theft tools (e.g., Mimikatz, Rubeus) is observed on a host. Approach (Statistical Method): Treat named-pipe
    access as Volume/Frequency/State signals. Per host, baseline (30-day) the count of distinct named
    pipes accessed per source and the rate of ACCESS_DENIED/STATUS_BAD_NETWORK_NAME responses (Zeek smb.log
    status, Sysmon 18). Alert when a single source opens admin-execution pipes (psexesvc/svcctl) it has
    never used, or when failed pipe-access attempts exceed the per-host median absolute deviation by >3
    (robust MAD thresholding), a sign of tool probing as described in [An Unsupervised Multi-Detector
    Approach, Bohara et al](https://mnoureddine.com/files/17BOH01.pdf) and [JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).
    A positive result (a signature match, a statistically significant deviation, or a high-confidence
    model score) is evidence that stolen authentication material is being used to bypass access controls
    and move laterally; a negative result helps rule out this technique for the examined principals and
    hosts. Corroborate any hit against the named area of interest and pivot to surrounding authentication,
    process-creation, and network telemetry to reconstruct the full attack chain.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 17 (Sysmon)
  - Windows Event ID 18 (Sysmon)
  - Zeek smb.log
  - Zeek dce_rpc.log
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, File Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Sysmon EventCode=18 earliest=-30d

      | stats dcount(PipeName) as pipes, count(eval(status=''ACCESS_DENIED'' OR status=''STATUS_BAD_NETWORK_NAME''))
      as fails by host, src

      | eventstats median(fails) as med, mad(fails) as mad by host

      | where (fails > med + 3*mad) OR (pipe_in(''psexesvc'',''svcctl'') AND first_seen_for_src) | alert'
  - technology: Zeek/pseudocode
    query: 'smb.log earliest=-30d

      | where status IN (''ACCESS_DENIED'',''STATUS_BAD_NETWORK_NAME'')

      | stats count as fails, dcount(named_pipe) as pipes by id.orig_h

      | robust_mad(fails) > 3 -> alert'
- question: '[Lateral Movement] Entropy-based command anomaly detection: can you confirm or rule out that
