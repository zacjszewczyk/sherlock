questions:
- question: Does any outbound SSL/TLS connection match a high-confidence command-and-control threat-intelligence
    indicator (destination IP, SNI/server_name, certificate SHA1 fingerprint, JA3, JA3S, or JA4/JA4S)?
  context: 'An adversary concealing C2 inside TLS still exposes connection metadata that survives encryption.
    By joining Zeek conn.log and ssl.log fields (destination IP, SNI, certificate fingerprint, JA3/JA3S)
    against a curated high-confidence C2 feed you can catch known infrastructure regardless of payload
    secrecy. Because Chrome/GREASE extension randomization destabilizes JA3, also compute and match JA4/JA4S,
    which sort extension lists and are resilient. A match strongly implicates Command and Control; alert
    with the source host, destination service, matched feed name, matched indicator type, and connection
    metadata for triage. A negative result does not clear the host but lets you pivot to behavioral analytics
    below. References: [JA3 TLS Client Fingerprinting](https://github.com/salesforce/ja3); [JA4+ Network
    Fingerprinting Suite](https://github.com/FoxIO-LLC/ja4).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Network egress points (e.g., firewalls, proxies), Threat intelligence platform'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  ssl = load(ssl.log); conn = load(conn.log)\n  joined = join(conn, ssl, on=uid)\n  ti\
      \ = load_feed(c2_indicators)  # ip, domain, sha1, ja3, ja3s\n  alert = joined where dst_ip in ti.ip\
      \ or server_name in ti.domain\n          or cert_sha1 in ti.sha1 or ja3 in ti.ja3 or ja3s in ti.ja3s\n\
      \          or ja4 in ti.ja4 or ja4s in ti.ja4s\n  emit alert[src_host, dst_service, feed_name, indicator_type,\
      \ uid, ja3, ja4]"
- question: Do outbound TLS sessions exhibit default or known-bad tooling artifacts, such as Cobalt Strike
    Malleable C2 default certificate serials/subjects or signature URI/header patterns?
  context: 'Offensive tools like Cobalt Strike ship with durable default artifacts (certificate serial
    numbers, subject strings) and recognizable Malleable C2 profile URI/header patterns. Matching Zeek
    x509.log/ssl.log fields and HTTP request URIs/headers against these known default and customized-profile
    regexes catches operators who failed to fully customize their profiles, even when the C2 payload itself
    is encrypted. A hit indicates likely use of a commodity offensive framework for Command and Control.
    This is a high-fidelity symbolic-logic signal; tune regexes as profiles evolve. References: [Detecting
    Popular Cobalt Strike Malleable C2 Profile Techniques, Unit 42](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Network egress points (e.g., firewalls, proxies), Threat intelligence platform'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  x509 = load(x509.log); ssl = load(ssl.log); http = load(http.log)\n  cs = load(cobaltstrike_default_artifacts)\
      \  # serials, subjects, uri/header regex\n  alert = (x509 where serial in cs.serials or subject\
      \ ~ cs.subject_re)\n        + (http where uri ~ cs.uri_re or header ~ cs.header_re)\n  emit alert[src_host,\
      \ dst, artifact_type, matched_value, uid]"
- question: Which external destination domains have an anomalously low host-to-connection ratio or repeated
    TLS handshake failures, indicating rare or dead/rotating C2 infrastructure?
  context: 'Legitimate popular services are contacted by many hosts; covert C2 domains are typically contacted
    by very few internal hosts but generate many connections. From Zeek conn.log and ssl.log, compute
    the public-suffix+1 per destination, count unique internal hosts, and divide by total connections;
    flag domains with a host-to-connection ratio < 0.1 registered within the last 60 days and elevate
    when below the 1st percentile. Separately profile TLS handshake FAILURES (conn_state S0/REJ/RSTO,
    aborts) per destination — repeated failed TLS to a rare host signals dead or rotating C2. A low ratio
    plus failures is a strong Command and Control lead. References: [Characterization of Encrypted and
    VPN Traffic, Draper-Gil et al](https://www.scitepress.org/Papers/2016/57407/57407.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Network egress points (e.g., firewalls, proxies), Threat intelligence platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  conn = load(conn.log) join ssl.log on uid\n  per_dom = group_by(public_suffix_plus1(server_name)):\n\
      \    hosts = distinct_count(src_host)\n    conns = count()\n    ratio = hosts / conns\n    fails\
      \ = count(conn_state in [S0, REJ, RSTO])\n  flag = per_dom where ratio < 0.1 and domain_age_days\
      \ < 60\n  elevate = flag where ratio < percentile(ratio, 1) or fails high\n  emit flag, elevate"
- question: Do live SSL/TLS sessions score as malicious under a behavioral classifier trained on TLS-1.3-resilient
    flow features (duration, byte ratios, packet-size sequences, SNI entropy, certificate attributes)?
  context: 'Because TLS 1.3 encrypts much of the handshake, classic content inspection fails; however,
    flow-level features survive. Train a Random Forest on labeled SSL/TLS sessions using duration, orig_bytes,
    resp_bytes, client/server byte ratio, packet-size sequences, SNI length/entropy, certificate validity,
    and self-signed/public-key attributes. Score live connections and alert when P(malicious) > 0.90,
    emitting the top-3 contributing features (e.g., byte-ratio, duration, SNI-entropy) so analysts can
    validate. High scores indicate covert encrypted Command and Control; treat low-confidence scores as
    hunting leads, not verdicts. References: [Extending C2 Traffic Detection from TLS 1.2 to TLS 1.3,
    Novo et al](https://dl.acm.org/doi/10.1145/3678890.3678921).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Network egress points (e.g., firewalls, proxies), Threat intelligence platform'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  feats = extract(ssl+conn): duration, orig_bytes, resp_bytes, byte_ratio,\n         \
      \ pkt_size_seq, sni_len, sni_entropy, cert_validity, is_self_signed, pubkey_bits\n  model = RandomForest.load(tls_c2_model)\n\
      \  for s in sessions:\n    p = model.predict_proba(feats(s))\n    if p > 0.90: alert(s, top3_features(model,\
      \ s))"
- question: Does any TLS session present a JA3 client fingerprint or JA3S server fingerprint that matches
    a curated malware/tool C2 fingerprint feed?
  context: 'JA3 (client) and JA3S (server) hashes summarize TLS handshake parameters and are frequently
    associated with specific malware families and tools. Extract ja3/ja3s from Zeek ssl.log and compare
    to curated C2 threat-intelligence feeds; alert with host, timestamp, destination, and matched hash
    on any hit. This is a fast, high-fidelity symbolic-logic check for Command and Control infrastructure
    reuse. Note its limitation (GREASE/extension randomization) and pair with JA4 matching below. References:
    [JA3 TLS Client Fingerprinting](https://github.com/salesforce/ja3).'
  answer_sources:
  - Zeek ssl.log
  - 'NAI: Network sensors capturing TLS handshakes (e.g., Zeek sensors at network chokepoints)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  ssl = load(ssl.log)\n  feed = load(c2_ja3_feed)  # ja3, ja3s\n  alert = ssl where ja3\
      \ in feed.ja3 or ja3s in feed.ja3s\n  emit alert[src_host, ts, dst, matched_hash]"
- question: Do TLS sessions match known-bad JA4/JA4S/JA4H fingerprints, which remain stable despite GREASE
    extension randomization that decays JA3?
  context: 'Modern browsers shuffle TLS extensions per ClientHello, eroding JA3 stability and causing
    both false negatives and noise. JA4/JA4S/JA4H sort cipher/extension lists and resist this randomization,
    making them a more durable fingerprint for matching against C2 fingerprint lists. Compute JA4 family
    fingerprints from Zeek telemetry and match known-bad lists; critically, do not rely on JA3 alone.
    A JA4 match is a strong Command and Control indicator and complements the JA3 check by catching adversaries
    whose JA3 has destabilized. References: [JA4+ Network Fingerprinting Suite](https://github.com/FoxIO-LLC/ja4);
    [JA3 Fingerprints Fade, Stamus Networks](https://www.stamus-networks.com/blog/ja3-fingerprints-fade-browsers-embrace-tls-extension-randomization).'
  answer_sources:
  - Zeek ssl.log
  - 'NAI: Network sensors capturing TLS handshakes (e.g., Zeek sensors at network chokepoints)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  ssl = load(ssl.log)\n  ja4_feed = load(c2_ja4_lists)  # ja4, ja4s, ja4h\n  alert = ssl\
      \ where ja4 in ja4_feed.ja4 or ja4s in ja4_feed.ja4s\n          or ja4h in ja4_feed.ja4h\n  emit\
      \ alert[src_host, ts, dst, ja4, ja4s]"
- question: Which JA3/JA4 fingerprints are statistically rare across the environment (seen on few hosts
    or in a tiny fraction of TLS sessions) or show high handshake failure rates?
  context: 'Rare TLS fingerprints often correspond to non-standard or custom clients used by malware.
    For each 24-hour window, compute the frequency of each JA3/JA4 hash across Zeek sensors and flag hashes
    seen on fewer than three hosts or representing <0.01% of TLS sessions; escalate if a rare hash rapidly
    reoccurs on additional hosts (lateral spread of an implant). Also track per-fingerprint TLS handshake
    FAILURE rate — a rare fingerprint with high abort or cert-validation failures is a distinct C2 signal.
    This statistical approach finds novel implants without prior indicators. References: [Characterization
    of Encrypted and VPN Traffic, Draper-Gil et al](https://www.scitepress.org/Papers/2016/57407/57407.pdf).'
  answer_sources:
  - Zeek ssl.log
  - 'NAI: Network sensors capturing TLS handshakes (e.g., Zeek sensors at network chokepoints)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  win = bucket(ssl.log, 24h)\n  per_fp = group_by(ja3 or ja4):\n    hosts = distinct_count(src_host)\n\
      \    share = count() / total_tls\n    fail_rate = count(handshake_abort or cert_fail)/count()\n\
      \  flag = per_fp where hosts < 3 or share < 0.0001 or fail_rate high\n  escalate = flag where reappears_on_new_hosts(rapid)\n\
      \  emit flag, escalate"
- question: Do enriched JA3/JA4 fingerprints cluster into small outlier groups indicative of coordinated
    non-standard TLS clients?
  context: 'Coordinated implants tend to share unusual combinations of fingerprint, destination, and flow
    characteristics. Enrich JA3/JA4 hashes with destination port, ASN, SNI TLD, and flow byte ratios,
    then apply DBSCAN to identify small clusters or outliers indicative of coordinated non-standard clients.
    Surface alerts for clusters absent from historical benign profiles and list the top-3 distinguishing
    features for analyst validation. This unsupervised method finds previously unseen Command and Control
    tooling that evades indicator matching. References: [Extending C2 Traffic Detection from TLS 1.2 to
    TLS 1.3, Novo et al](https://dl.acm.org/doi/10.1145/3678890.3678921).'
  answer_sources:
  - Zeek ssl.log
  - 'NAI: Network sensors capturing TLS handshakes (e.g., Zeek sensors at network chokepoints)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = enrich(ssl): [ja3/ja4, dst_port, asn, sni_tld, byte_ratio]\n  clusters = DBSCAN(eps,\
      \ min_samples).fit(X)\n  outliers = points labeled noise or small clusters not in benign_baseline\n\
      \  for c in outliers: alert(c, top3_distinguishing_features(c))"
- question: Do outbound TLS connections present anomalous certificates — self-signed, generic/empty subject
    fields, SNI mismatched against the certificate CN, abnormal validity ranges, or known-bad JA4X fingerprints?
  context: 'Adversary C2 frequently relies on hastily generated certificates. Use Zeek x509.log and ssl.log
    to detect self-signed certificates, generic/empty subject fields, mismatched SNI vs. certificate CN,
    or abnormal validity ranges on outbound TLS to external IPs, and raise alerts with host, destination,
    and certificate metadata. Additionally match JA4X certificate fingerprints against known-bad lists
    and default-tool certificate artifacts (e.g., Cobalt Strike). These structural anomalies are strong
    symbolic-logic indicators of covert encrypted Command and Control. References: [JA4+ Network Fingerprinting
    Suite](https://github.com/FoxIO-LLC/ja4); [Cobalt Strike Malleable C2, Unit 42](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/).'
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - 'NAI: Network egress points with SSL/TLS inspection capabilities, Certificate Transparency logs'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  x509 = load(x509.log); ssl = load(ssl.log) join on uid\n  alert = sessions where is_self_signed\n\
      \        or subject empty/generic\n        or server_name != cert_cn\n        or validity_days <\
      \ 30 or validity_days > 825\n        or ja4x in bad_ja4x\n  emit alert[src_host, dst, cert_subject,\
      \ issuer, validity, ja4x]"
- question: Which certificates fall into statistical extremes of validity period or subject-CN entropy,
    characteristic of throwaway C2 certificates?
  context: 'Throwaway C2 certificates often have unusual validity windows and auto-generated random or
    very low-entropy common names. Compute the distribution of validity periods and subject-CN Shannon
    entropy from Zeek x509.log and flag certificates below the 5th percentile of validity, above the 95th
    percentile, or in the bottom 5th percentile of CN entropy. Very low entropy or random-looking CNs
    are characteristic of disposable C2 certs. This percentile-based scoring adapts to your environment''s
    baseline and surfaces suspicious certificates without prior indicators. References: [Using Entropy
    Analysis to Find Encrypted and Packed Malware, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - 'NAI: Network egress points with SSL/TLS inspection capabilities, Certificate Transparency logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  certs = load(x509.log)\n  dist_validity = distribution(certs.validity_days)\n  dist_entropy\
      \ = distribution(shannon(certs.subject_cn))\n  flag = certs where validity_days < pct(dist_validity,5)\n\
      \        or validity_days > pct(dist_validity,95)\n        or shannon(subject_cn) < pct(dist_entropy,5)\n\
      \  emit flag[src_host, dst, subject_cn, validity_days]"
- question: Do newly observed certificates score above a high-risk threshold under a certificate classifier
    using self-signed status, validity, CN entropy, key length, SAN count, and issuer rarity?
  context: 'A supervised model can combine many weak certificate signals into a reliable verdict. Train
    a Decision Tree or Random Forest on features such as is_self_signed, validity_period, subject_CN_entropy,
    key_length, SAN count, and issuer rarity; alert when new certificates score above a high-risk threshold
    and surface the top-3 contributing features in the alert. High-risk scores point to certificates likely
    backing covert encrypted Command and Control channels, allowing analysts to prioritize among many
    anomalous certs. References: [Extending C2 Traffic Detection from TLS 1.2 to TLS 1.3, Novo et al](https://dl.acm.org/doi/10.1145/3678890.3678921).'
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - 'NAI: Network egress points with SSL/TLS inspection capabilities, Certificate Transparency logs'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  feats = [is_self_signed, validity_period, subject_cn_entropy, key_length,\n        \
      \   san_count, issuer_rarity]\n  model = RandomForest.load(cert_risk_model)\n  for c in new_certs:\n\
      \    score = model.predict_proba(feats(c))\n    if score > high_risk: alert(c, top3_features(model,\
      \ c))"
- question: Does an internal host repeatedly connect over port 443 to the same non-CDN/non-cloud external
    destination at a volume exceeding a benign-derived threshold (beaconing)?
  context: Beaconing implants check in to their C2 on a schedule, producing many similar connections to
    one destination. Alert when a host connects over port 443 more than 100 times in 24 hours to the same
    destination whose SNI is outside the set of known major CDNs/cloud providers (Akamai, Cloudflare,
    AWS, Google), flagging potential C2. Derive the per-environment threshold from the 99th percentile
    of benign same-destination 443 connection counts to suppress noisy legitimate services. Persistent
    high-volume contact to a rare destination is a hallmark of Command and Control.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Client subnets, servers with direct internet access, Network flow collectors at key network
    boundaries'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  conn = load(conn.log) where dst_port == 443\n  per_pair = group_by(src_host, dst, server_name)\
      \ over 24h: count()\n  cdn = {akamai, cloudflare, aws, google}\n  thresh = max(100, percentile(benign_443_counts,\
      \ 99))\n  alert = per_pair where count > thresh and server_name not in cdn\n  emit alert[src_host,\
      \ dst, server_name, count]"
- question: Which source-destination pairs show low-jitter, low-payload-variance periodicity in TLS connections
    after FFT/autocorrelation analysis and benign-service suppression?
  context: 'Statistically regular timing — even with jitter — reveals automated check-ins. For each source-destination
    pair in Zeek conn.log, compute inter-arrival delta and orig_bytes/resp_bytes standard deviations,
    then apply FFT periodicity extraction with autocorrelation refinement plus a benign-service whitelist
    (updates, NTP, ad networks) to control false positives. Flag pairs with delta stddev < 1s and low
    payload variance, and treat repeated small near-constant request sizes as corroboration. Detected
    periodicity to an external host strongly suggests beaconing Command and Control. References: [BAYWATCH,
    Hu et al](https://ieeexplore.ieee.org/abstract/document/7579771).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Client subnets, servers with direct internet access, Network flow collectors at key network
    boundaries'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for (src,dst) in conn.log:\n    deltas = diff(sorted(ts))\n    if stddev(deltas) < 1s\
      \ and low_var(orig_bytes, resp_bytes):\n      spectrum = FFT(deltas); refine = autocorrelation(deltas)\n\
      \      if periodic(spectrum, refine) and (src,dst) not in benign_whitelist:\n        alert[src,\
      \ dst, period, jitter]"
- question: For high-jitter beacons that defeat FFT, do connection inter-arrival sequences model as periodic
    under an LSTM/transformer or continuous-time HMM?
  context: 'Sophisticated implants add large jitter to defeat spectral analysis. For high-jitter beacons,
    model per-pair connection inter-arrival sequences with an LSTM or transformer, or a Continuous-Time
    HMM over timing states, to capture latent periodicity that FFT misses. Alert when periodicity/state
    confidence exceeds a tuned threshold and report the dominant period and jitter in the alert text.
    This ML approach extends beaconing detection to evasive Command and Control that randomizes timing.
    References: [C2 Beaconing Detection via AI-Based Time-Series Analysis, Gupta et al](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20);
    [NetSpectra Sentinel, JNCA 2025](https://www.sciencedirect.com/science/article/pii/S1084804525000244).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Client subnets, servers with direct internet access, Network flow collectors at key network
    boundaries'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  for (src,dst) in conn.log:\n    seq = inter_arrival_sequence(ts)\n    conf = LSTM_or_CTHMM.predict_periodicity(seq)\n\
      \    if conf > threshold:\n      alert[src, dst, dominant_period, jitter, conf]"
- question: Is an outbound encrypted connection initiated by a process that is not an allowlisted SSL/TLS
    client (browser, mail, update agent) or that runs from a temporary/user-writable path such as C:\Users\Public\
    or %TEMP%?
  context: 'Legitimate TLS originates from a small set of known clients; malware often runs from user-writable
    locations. Correlate Windows Event ID 4688 process creation with Event ID 5156 network allows; maintain
    an allowlist of benign SSL/TLS clients and alert when an allowlist-excluded process from a temporary/user-writable
    path initiates an external TLS connection. Cross-check the process''s observed JA3/JA4 against the
    expected stack for that binary. An unexpected process opening encrypted egress is a strong endpoint-level
    Command and Control signal. References: [JA4+ Network Fingerprinting Suite](https://github.com/FoxIO-LLC/ja4).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: User workstations and critical servers (e.g., Domain Controllers, Application Servers), EDR
    agent logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  proc = EventID 4688; net = EventID 5156\n  joined = join(proc, net, on=pid/host)\n \
      \ allow = {browsers, mail, update_agents}\n  alert = joined where image not in allow\n        and\
      \ (image_path ~ \"\\\\Users\\\\Public\\\\\" or path ~ \"%TEMP%\")\n        and dst_external and\
      \ encrypted(443/tls)\n  emit alert[host, image, path, dst, ja3, ja4]"
- question: Which network-connected processes have parent or path rarity above the 99th percentile, or
    repeated outbound connection failures, when tied to encrypted egress?
  context: Rare process lineage combined with encrypted egress flags novel implants. Baseline per-host
    parent-child relationships and process-path frequencies using Windows Event ID 4688; score new network-connected
    processes whose parent or path rarity exceeds the 99th percentile and flag when tied to outbound encrypted
    connections. Include outbound connection FAILURE counts (5157 blocks, repeated SYN without handshake)
    per process as a distinct C2-retry signal. This statistical baselining catches Command and Control
    launched from unusual process contexts even without a known-bad indicator.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: User workstations and critical servers (e.g., Domain Controllers, Application Servers), EDR
    agent logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = baseline(EventID 4688): parent_child_freq, path_freq per host\n  for p in network_connected_procs:\n\
      \    if rarity(parent(p)) > pct99 or rarity(path(p)) > pct99:\n      fails = count(EventID 5157\
      \ blocks or syn_no_handshake by p)\n      if p has outbound_encrypted: alert[host, p, parent, path,\
      \ fails]"
- question: Do combined process and flow features score as anomalous under an Isolation Forest trained
    on process attributes and Zeek conn.log flow characteristics?
  context: 'Joining endpoint and network context exposes implants that look benign in either view alone.
    Train an Isolation Forest on combined process (name, parent, command-line entropy, signature) and
    Zeek conn.log flow features (byte ratio, duration, destination rarity); alert on high anomaly scores
    and surface the top-3 contributing features in the alert text. High anomaly scores indicate a process-network
    combination unlike normal activity, a strong lead for encrypted Command and Control originating on
    the endpoint. References: [Anomaly Detection in Encrypted Network Traffic Using Self-Supervised Learning,
    ET-SSL](https://www.nature.com/articles/s41598-025-08568-0).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: User workstations and critical servers (e.g., Domain Controllers, Application Servers), EDR
    agent logs'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = join(proc_feats[name,parent,cmdline_entropy,signed],\n           flow_feats[byte_ratio,duration,dst_rarity])\n\
      \  model = IsolationForest.fit(normal_X)\n  for r in records:\n    if model.anomaly_score(r) high:\
      \ alert(r, top3_features(model, r))"
- question: Is SSL/TLS protocol traffic occurring on a destination port outside the standard set {443,465,587,993,995,8443},
    and does Zeek weird.log report protocol violations for the same connection?
  context: Tunneling TLS over unusual ports is a common evasion. Alert whenever Zeek conn.log reports
    service 'ssl'/'tls' or a TLS handshake on ports outside {443,465,587,993,995,8443}, and escalate severity
    when Zeek weird.log reports SSL/TLS protocol violations for the same UID — a distinct failure-mode
    signal of misimplemented tunnels. TLS on non-standard ports, especially with handshake weirdness,
    is a strong indicator of covert Command and Control channels attempting to blend with other traffic.
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: Network egress points and internal network segment gateways'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  conn = load(conn.log); weird = load(weird.log)\n  std = {443,465,587,993,995,8443}\n\
      \  alert = conn where service in [ssl, tls] and dst_port not in std\n  escalate = alert join weird\
