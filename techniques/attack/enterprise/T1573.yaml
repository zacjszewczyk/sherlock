name: 'T1573: Encrypted Channel'
id: b0d22921-e3db-4cc5-8ce5-655edd066fa7
description: Investigate adversary use of encrypted (typically SSL/TLS) channels to conceal command and
  control traffic. This playbook helps an analyst hunt for malicious encrypted sessions even when payloads
  cannot be decrypted, by correlating threat-intelligence indicators (IPs, domains, certificate hashes,
  JA3/JA3S/JA4 fingerprints) against network telemetry; identifying anomalous certificates (self-signed,
  low-entropy or generic subjects, abnormal validity); detecting beaconing and jittered-beaconing patterns
  to single external destinations; surfacing encrypted connections initiated by unexpected processes or
  from user-writable paths; and finding TLS on non-standard ports or protocol violations. It spans symbolic-logic
  detections, statistical baselining/rarity scoring, and machine-learning classifiers across Zeek network
  logs and Windows endpoint events to identify covert encrypted C2 against sophisticated external actors,
  commodity malware, and insiders.
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
