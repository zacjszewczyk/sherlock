- question: '[Collection] Single-session volume threshold: Can you determine whether the total volume
    of data uploaded (`orig_bytes` in Zeek) or the file-transfer count generated by a messaging application
    from one user or host exceeds that entity''s normal behavior by a wide margin. -- specifically using
    the ''Single-session volume threshold'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), adversaries mine chat and messaging
    platforms (Microsoft Teams, Slack, Google Chat) for credentials, source code, internal links, proprietary
    data, and even live incident-response discussions, and they may collect this data either from the
    endpoint client or directly through SaaS/Office APIs. This evidence focuses on the condition that
    the total volume of data uploaded (`orig_bytes` in Zeek) or the file-transfer count generated by a
    messaging application from one user or host exceeds that entity''s normal behavior by a wide margin.
    The ''Single-session volume threshold'' approach is a Symbolic Logic technique that works as follows:
    Alert when Zeek conn.log orig_bytes > 500 MB for messaging-app flows, or file-transfer count exceeds
    a tenant-derived ceiling, paralleling the Detect mass download (data exfiltration) policy. A positive
    result -- a rule match, a statistical outlier, or a model alert -- suggests messaging data is being
    accessed, exported, or exfiltrated in a way that deviates from normal user, app, or token behavior;
    pivot to the responsible principal/process, its parent lineage or sign-in session, the destination,
    the volume of messages/files touched, and any preceding account-takeover or OAuth-consent activity.
    A negative result helps reduce suspicion for this particular vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-API
    collection. Source citations for this method: [Detect mass download (data exfiltration)](https://learn.microsoft.com/en-us/defender-cloud-apps/policies-threat-protection).'
