    Learning) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), adversaries mine chat and messaging
    platforms (Microsoft Teams, Slack, Google Chat) for credentials, source code, internal links, proprietary
    data, and even live incident-response discussions, and they may collect this data either from the
    endpoint client or directly through SaaS/Office APIs. This evidence focuses on the condition that
    an anomalous or compromised sign-in (impossible travel, anonymous/Tor IP, infrequent country, or rare
    device) is followed within the same session by access to or export of chat/message content, indicating
    account-takeover-driven collection from messaging applications. The ''Peer-group UEBA deviation''
    approach is a Machine Learning technique that works as follows: Apply UEBA peer-group anomaly scoring
    (0-1) to surface a user whose sign-in and data-access behavior diverges from peers per Sentinel UEBA
    and the Sentinel anomalies reference, and model cross-service behavior with CS-GAD. A positive result
    -- a rule match, a statistical outlier, or a model alert -- suggests messaging data is being accessed,
    exported, or exfiltrated in a way that deviates from normal user, app, or token behavior; pivot to
    the responsible principal/process, its parent lineage or sign-in session, the destination, the volume
    of messages/files touched, and any preceding account-takeover or OAuth-consent activity. A negative
    result helps reduce suspicion for this particular vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-API
    collection. Source citations for this method: [Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
