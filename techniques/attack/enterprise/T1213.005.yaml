questions:
- question: '[Collection] Correlate messaging egress to TI: Can you determine whether a managed endpoint
    runs a known messaging application and that process establishes an outbound connection to an external
    IP or domain that is either on a threat-intelligence feed or belongs to an unapproved cloud storage
    or file-transfer service. -- specifically using the ''Correlate messaging egress to TI'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), adversaries mine chat and messaging
    platforms (Microsoft Teams, Slack, Google Chat) for credentials, source code, internal links, proprietary
    data, and even live incident-response discussions, and they may collect this data either from the
    endpoint client or directly through SaaS/Office APIs. This evidence focuses on the condition that
    a managed endpoint runs a known messaging application and that process establishes an outbound connection
    to an external IP or domain that is either on a threat-intelligence feed or belongs to an unapproved
    cloud storage or file-transfer service. The ''Correlate messaging egress to TI'' approach is a Symbolic
    Logic technique that works as follows: Cross-reference Sysmon 3/Windows 5156 messaging-app connections
    against Zeek conn/dns/ssl threat feeds and alert on matches; also count blocked/failed egress attempts
    (proxy 403/denied conns) per host as a distinct state signal per Common threat protection policies.
    A positive result -- a rule match, a statistical outlier, or a model alert -- suggests messaging data
    is being accessed, exported, or exfiltrated in a way that deviates from normal user, app, or token
    behavior; pivot to the responsible principal/process, its parent lineage or sign-in session, the destination,
    the volume of messages/files touched, and any preceding account-takeover or OAuth-consent activity.
    A negative result helps reduce suspicion for this particular vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-API
    collection. Source citations for this method: [Common threat protection policies](https://learn.microsoft.com/en-us/defender-cloud-apps/policies-threat-protection).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - Sysmon Event ID 3
  - Windows Event ID 5156
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '# Correlate messaging egress to TI (Symbolic Logic)

      source IN [Zeek conn.log, Zeek ssl.log, Zeek dns.log, Sysmon Event ID 3, Windows Event ID 5156]

      # logic: Cross-reference Sysmon 3/Windows 5156 messaging-app connections against Zeek conn/dns/ssl
      threat feeds and alert on matches; also count blocked/failed egress attempts (proxy 403/denied conns)
      per host as a distinct state signal per Common threat protection policies.

      | filter messaging_app OR messaging_audit_operation

      | apply Symbolic Logic as described

      | emit alert with entity, evidence_fields, and top contributing signals'
- question: '[Collection] Score rare ASN and country pairs: Can you determine whether a managed endpoint
    runs a known messaging application and that process establishes an outbound connection to an external
    IP or domain that is either on a threat-intelligence feed or belongs to an unapproved cloud storage
    or file-transfer service. -- specifically using the ''Score rare ASN and country pairs'' (Statistical
