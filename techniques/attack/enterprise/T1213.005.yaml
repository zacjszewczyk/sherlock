    operations cataloged in Audit log activities. A positive result -- a rule match, a statistical outlier,
    or a model alert -- suggests messaging data is being accessed, exported, or exfiltrated in a way that
    deviates from normal user, app, or token behavior; pivot to the responsible principal/process, its
