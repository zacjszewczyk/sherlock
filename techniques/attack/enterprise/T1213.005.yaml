name: 'T1213.005: Messaging Applications'
id: 852d6e4e-2533-4b69-bed9-b94491f1d9df
description: 'This playbook helps an analyst investigate whether an adversary is collecting sensitive
  information from chat and messaging applications such as Microsoft Teams, Slack, and Google Chat as
  part of the Collection tactic. Adversaries mine these platforms for testing/development credentials,
  source code snippets, links to internal shares and resources, proprietary data, and ongoing incident-response
  discussions, both to exfiltrate it and to improve their targeting and evade defenders. The playbook
  covers two complementary surfaces: endpoint behavior of messaging clients (outbound connections from
  slack.exe/msteams.exe to threat-intel or unapproved cloud destinations, scripted/automation command-line
  invocations, anomalous parent processes or high-privilege contexts, large upload volumes, and connections
  to sensitive internal services), and first-party SaaS/Office signals (bulk reads/exports of chat messages
  and attachments via conversations.history, Graph API, eDiscovery, or MailItemsAccessed; risky or compromised
  sign-ins followed by message access; and newly consented or rarely used OAuth apps and bot tokens that
  gain broad message-read scopes). Detection methods combine symbolic-logic rules, statistical baselining
  with robust median/MAD and percentile thresholds, and machine-learning models (one-class SVM, Isolation
  Forest, Random Forest, DeepLog audit-sequence learning, graph and UEBA peer-group anomaly detection)
  applied to Zeek conn/dns/ssl/files logs, Sysmon/Windows process and network events, and Slack/M365 audit,
  sign-in, and eDiscovery logs, so the analyst can corroborate suspected messaging-application collection
  across egress, process lineage, upload volume, identity, and OAuth-consent context.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
