    that indicate automation or non-interactive use, including scripting-engine wrappers, API tokens,
    or file-upload parameters. The ''Scripted command regex'' approach is a Symbolic Logic technique that
    works as follows: Alert when slack.exe/msteams.exe/discord.exe run with regex-indicated automation
