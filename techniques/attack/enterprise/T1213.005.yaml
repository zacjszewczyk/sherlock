    use, including scripting-engine wrappers, API tokens, or file-upload parameters. -- specifically using
    the ''Scripted command regex'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), adversaries mine chat and messaging
