    far above the entity''s norm). This is the primary first-party signal for collection from messaging
    applications. The ''Bulk message/export rule'' approach is a Symbolic Logic technique that works as
    follows: Alert when message-read/export operations (conversations.history, MailItemsAccessed, MessagesExported,
