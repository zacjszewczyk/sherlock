name: 'T1027.007: Obfuscated Files or Information: Dynamic API Resolution'
id: d93f896e-ab11-40b4-ae7a-c2db6e23c017
description: Investigate adversary use of dynamic API resolution to conceal malicious functionality and
  defeat static analysis. This playbook helps an analyst hunt malware that hides its capabilities by resolving
  Windows API functions at runtime (for example via GetProcAddress/LoadLibrary, hashed function names,
  PEB walks, or ordinal imports) instead of declaring them in a normal Import Address Table. It correlates
  static signals (small/empty IAT, high section entropy, capa capability matches, low-prevalence hashes)
  with behavioral signals (rundll32 ordinal invocations, rapid write-then-execute chains in user-writable
  directories, processes performing network or child-process activity their on-disk imports cannot explain,
  and trusted system processes deviating from baseline). It blends symbolic-logic rules, statistical rarity/outlier
  scoring, and machine-learning models so the analyst can move from a suspicious binary or process to
  defensible evidence of obfuscated runtime API resolution.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: When a new executable runs on a Windows host, does its SHA256 hash match threat-intelligence
    lists of API-obfuscated or packed binaries, do static capability scans (capa) flag 'resolve function
    by hash', 'resolve function by ordinal', or PEB-walk module enumeration, or does the file present
    a near-empty Import Address Table despite being a full-sized PE?
  context: This is the foundational deterministic check for dynamic API resolution. Malware that resolves
    APIs at runtime deliberately strips its imports, so the on-disk PE shows few or no imported functions
    even though it is a complete program. Query process-creation telemetry for newly executed images,
    hash them, and compare against curated TI of obfuscated/packed samples; in parallel run capa against
    the on-disk image and alert on rules describing hash-based or ordinal-based function resolution or
    PEB-walk enumeration of loaded modules. Also flag any PE larger than ~20KB whose IAT lists fewer than
    five imported functions, which is the classic empty-IAT fingerprint of runtime API resolution. A TI
    hit or a capa capability match is strong corroboration; an empty IAT alone warrants triage because
    legitimate software almost always imports many functions. Under the Stealth tactic this directly answers
    whether an adversary is concealing malicious functionality from static analysis.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, particularly domain controllers, application servers, and
    developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      events = FROM proc_creation WHERE event_id IN [4688, "Sysmon:1"]
      new_exe = ENRICH events WITH sha256(Image), pe_static(Image)
      ALERT WHERE sha256 IN ti_obfuscated_packed_hashes
            OR capa_rules(Image) INTERSECTS ["resolve function by hash","resolve function by ordinal","enumerate PEB modules"]
            OR (pe.size > 20KB AND pe.iat_import_count < 5)
- question: Does any section of a newly observed executable exceed a packed/encrypted entropy threshold
    (>7.2 bits/byte) consistent with a compressed or encrypted payload that hides hashed API resolution
    code?
  context: 'Dynamic API resolution is frequently paired with packing or in-place encryption of the payload,
    which drives Shannon entropy toward the theoretical maximum of 8 bits/byte. Compute per-section entropy
    for each executable and alert when any section exceeds 7.2 bits/byte. This is a tunable deterministic
    signal: legitimate installers, compressors, and resource-heavy binaries can reach ~7.0, so calibrate
    the floor to your fleet to limit false positives. High entropy by itself is not malicious but, combined
    with a small IAT or a capa hash-resolution hit, strongly supports the hypothesis that the binary defers
    its real API calls to runtime. Under Stealth, abnormally high entropy is evidence the adversary is
    obscuring code and strings to evade static inspection.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, particularly domain controllers, application servers, and
    developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Static analysis pseudocode
    query: |-
      FOR exe IN new_executables:
        FOR section IN pe_sections(exe):
          ent = shannon_entropy(section.raw_bytes)
          IF ent > 7.2: ALERT(exe, section.name, ent)
      // tune floor (~7.0) per environment to suppress legit packers/installers
- question: Is a rarely seen executable (present on under ~1% of hosts) being launched by a high-risk
    parent process such as outlook.exe, winword.exe, or chrome.exe?
  context: 'Prevalence is a powerful corroborator: obfuscated loaders are typically unique or near-unique
    across an enterprise, and when such a rare binary is spawned by a document handler, browser, or mail
    client it strongly suggests delivery via phishing or drive-by followed by execution of an evasive
    payload. Track the fleet-wide prevalence of each executable hash and score those below a derived rarity
    floor (start near 1% but set it from your own fleet size). Weight the score upward when the parent
    process is a common initial-access vector. A low-prevalence binary with a risky parent is a high-value
    lead; a low-prevalence binary launched by routine software management may be benign first-seen activity.
    Under Stealth, this surfaces adversaries blending evasive payloads into normal application usage.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, particularly domain controllers, application servers, and
    developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      prev = STATS dcount(host) AS hosts BY sha256 OVER fleet
      score = events WHERE (hosts / total_hosts) < 0.01
                   AND ParentImage IN ["outlook.exe","winword.exe","excel.exe","chrome.exe","msedge.exe"]
      ALERT WHERE score.exists  // derive 1% floor from fleet size
- question: Does a machine-learning model scored on static PE features classify a newly seen executable
    as packed/obfuscated with high confidence (>0.85), and which features (low import count, high entropy,
    suspicious section names) drive that score?
  context: Where rules miss novel variants, a supervised model generalizes. Train a LightGBM or Random
    Forest on EMBER-style static features — IAT size, imported-function count, per-section entropy, byte/entropy
    histograms, and header fields — to estimate the probability a binary is packed/obfuscated. Alert when
    that probability exceeds 0.85 and surface the top-3 SHAP-contributing features so the analyst can
    validate the verdict rather than trust a black box. Because dynamic API resolution manifests as low
    import counts and high entropy, those features typically dominate true positives. A high score with
    sensible SHAP explanations (e.g., empty IAT + high entropy) is actionable; a high score driven only
    by a benign section layout deserves scrutiny. Under Stealth, this catches obfuscated payloads that
    evade static signatures.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, particularly domain controllers, application servers, and
    developer workstations.'
  range: Last 90 days
  queries:
  - technology: ML/Model scoring pseudocode
    query: |-
      feats = EMBER_features(exe)  // iat_size, import_count, section_entropy, byte/entropy hist, header
      p = lightgbm_model.predict_proba(feats)["packed_obfuscated"]
      IF p > 0.85:
        top3 = treeshap_top_features(model, feats, k=3)
        ALERT(exe, p, top3)
- question: Is rundll32.exe (or regsvr32.exe / control.exe) executing a DLL function by ordinal number
    (e.g., name.dll,#123) rather than by exported name?
  context: Invoking an exported function by ordinal instead of by name hides which routine is being called
    and is a deferred-resolution pattern aligned with dynamic API resolution. Parse process-creation command
    lines and alert when these trusted LOLBins call a DLL function whose argument matches an ordinal syntax
    such as '\.dll,\s*#\d+'. Legitimate software occasionally uses ordinals, so pair this with prevalence
    and parent-process context, but the pattern is uncommon enough on most endpoints to warrant review.
    A match indicates the adversary is masking the intended function and possibly proxying execution through
    a signed binary. Under Stealth, ordinal invocation conceals capability from analysts reviewing command
    lines.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, focusing on command line logging from user workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM proc_creation WHERE event_id IN [4688,"Sysmon:1"]
        AND Image IN ["rundll32.exe","regsvr32.exe","control.exe"]
        AND CommandLine MATCHES /\.dll\s*,\s*#\d+/i
      ALERT(host, ParentImage, CommandLine)
- question: Among all rundll32 command lines over the last 30 days, which ordinal invocations are rare
    (seen on fewer than five hosts or first-seen), and do rundll32 launches fail to produce a subsequent
    module load?
  context: 'Rarity sharpens the ordinal-invocation signal: aggregate unique rundll32 command lines over
    a rolling 30-day window and flag ordinal calls observed on fewer than five hosts or appearing for
    the first time. Additionally profile failed or aborted module loads — rundll32 invocations not followed
    by a corresponding Sysmon Event ID 7 ImageLoad — because brittle ordinal resolution frequently fails
    when the targeted export index shifts between DLL versions. A rare ordinal call that also fails to
    load is a strong indicator of an adversary''s fragile, hand-rolled resolution attempt rather than
    legitimate vendor tooling. Under Stealth, both rarity and resolution failure betray non-standard execution
    that the adversary intended to look routine.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, focusing on command line logging from user workstations.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      cmds = STATS dcount(host) AS hosts, min(_time) AS first_seen BY CommandLine
             WHERE Image="rundll32.exe" AND CommandLine MATCHES /#\d+/
      rare = cmds WHERE hosts < 5 OR first_seen WITHIN window
      failed = rundll32_exec WHERE NOT EXISTS(matching Sysmon7 ImageLoad WITHIN 60s)
      ALERT rare OR failed
- question: Does an Isolation Forest trained on rundll32 command-line features (length, character-class
    distribution, ordinal-syntax flag, parent process) flag a command line as a significant outlier?
  context: Unsupervised outlier detection catches obfuscated command lines that don't match a fixed regex.
    Featurize each rundll32 command line by length, counts of character classes (digits, symbols, uppercase),
    an ordinal-syntax flag, and the parent process, then train an Isolation Forest on the population of
    normal invocations. Alert on significant outliers and report the top-3 contributing features so the
    analyst understands why a command looked anomalous. Adversaries constructing unusual or encoded arguments
    to drive runtime resolution will deviate from the dense cluster of routine, vendor-generated rundll32
    usage. A flagged outlier with an ordinal flag and an unusual parent is high priority; outliers explained
    purely by benign long paths can be downranked. Under Stealth, this finds masked execution syntax that
    evades exact-match rules.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers, focusing on command line logging from user workstations.'
  range: Last 90 days
  queries:
  - technology: ML/Anomaly pseudocode
    query: |-
      X = features(rundll32_cmds)  // len, char_class_counts, ordinal_flag, parent
      iforest = IsolationForest().fit(X_baseline)
      scores = iforest.decision_function(X)
      ALERT WHERE score < threshold WITH top3=feature_attribution(row)
- question: Was a PE file (MZ header) written to a user-writable or temporary directory and then loaded
    as a module or executed by the same parent process within ~60 seconds?
  context: Obfuscated loaders commonly drop a payload and immediately load or run it, producing a rapid
    write-then-execute chain. Correlate Sysmon Event ID 11 file-create events for PE files (MZ signature)
    in user-writable/temp locations with a subsequent Sysmon Event ID 7 ImageLoad or Event ID 4688 execution
    of that same file by the same parent within 60 seconds, and alert. This staged runtime-loading behavior
    is the on-host footprint of malware that resolves APIs at runtime after deploying its payload. Tight
    latency between drop and execution from the same lineage is suspicious; longer gaps or unrelated parents
    are more likely benign software updates. Under Stealth, the chain reveals an adversary staging and
    activating concealed code on disk.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - 'NAI: User profile directories (%APPDATA%, %LOCALAPPDATA%, Downloads), temporary directories (%TEMP%,
    C:\Windows\Temp), and public-writable shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Correlation pseudocode
    query: |-
      writes = FROM Sysmon11 WHERE TargetFilename MATCHES temp_or_userwritable AND file_magic="MZ"
      exec  = FROM (Sysmon7 ImageLoaded OR 4688 Image)
      JOIN writes WITH exec ON same_file AND same_parent
        WHERE exec._time - writes._time <= 60s
      ALERT(host, parent, file)
- question: Are write-then-execute time deltas in the bottom 1st percentile, is the parent process spawning
    at more than 2 standard deviations above its baseline rate, or are dropped files repeatedly failing
    to execute (blocked by AV/WDAC)?
  context: Statistical scoring refines the write-then-execute hunt. Measure the latency between file write
    and execution and flag chains in the bottom 1st percentile (near-instant activation), and alert when
    a parent process's spawn frequency exceeds two standard deviations from its established baseline,
    indicating burst staging. Separately profile failure states — write events with no successful subsequent
    load, or AV/WDAC-blocked execution attempts — as a distinct corroborating signal, since evasive loaders
    often trip controls before succeeding. Together these distinguish automated malicious staging from
    sporadic legitimate file creation. Under Stealth, abnormal latency, volume, and failure patterns expose
    covert payload activation.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - 'NAI: User profile directories (%APPDATA%, %LOCALAPPDATA%, Downloads), temporary directories (%TEMP%,
    C:\Windows\Temp), and public-writable shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      deltas = exec._time - write._time PER chain
      p1 = percentile(deltas, 1)
      base = STATS avg(spawn_rate), stdev(spawn_rate) BY ParentImage
      ALERT WHERE delta <= p1
            OR spawn_rate > base.avg + 2*base.stdev
            OR (write EXISTS AND no_successful_load OR blocked_by_AV_WDAC)
- question: Does a sequence or provenance-graph model (HMM/LSTM or masked-graph autoencoder) score a per-process
    event chain (NetworkInbound -> FileCreate -> ImageLoad/ProcessCreate) as a malicious load sequence?
  context: The order and composition of events carries signal that point rules miss. Train an HMM or LSTM
    on event chains keyed by ProcessGuid — for example inbound network, then file create, then image load
    or process create — or use a masked provenance-graph autoencoder to learn normal execution provenance
    and score reconstruction error. Alert above the chosen threshold and surface the top-3 anomalous edges
    or events so the analyst can trace the suspect chain. This captures staged loaders whose individual
    steps look benign but whose sequence reflects download-drop-execute behavior tied to runtime API resolution.
    A high malicious-state probability over a coherent chain is actionable; isolated anomalous edges may
    be noise. Under Stealth, sequence modeling reconstructs the hidden execution flow of obfuscated loaders.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - 'NAI: User profile directories (%APPDATA%, %LOCALAPPDATA%, Downloads), temporary directories (%TEMP%,
    C:\Windows\Temp), and public-writable shares.'
  range: Last 90 days
  queries:
  - technology: ML/Sequence pseudocode
    query: |-
      chains = GROUP events BY ProcessGuid ORDER BY _time
      // states e.g. NetworkInbound -> FileCreate -> ImageLoad/ProcessCreate
      p = seq_model.score(chains)   // HMM/LSTM or graph-autoencoder recon error
      IF p > threshold: ALERT WITH top3_anomalous_edges(chain)
- question: Is a process opening a network connection (Sysmon 3) or resolving DNS (Sysmon 22) when its
    on-disk image lacks the corresponding networking imports (ws2_32.dll, wininet.dll, winhttp.dll)?
  context: A process cannot legitimately use network APIs it never imported unless it resolved them at
    runtime. Extract the IAT for new processes and alert when a process performs network activity — a
    Sysmon Event ID 3 connection or Sysmon Event ID 22 DNS query — yet its on-disk PE imports no networking
    libraries. Compare expected versus present imports using EMBER-style import features. This behavior-vs-static-import
    mismatch is a direct hallmark of APIs resolved by hash at runtime. A networking process with zero
    networking imports is highly suspicious; a process importing the relevant DLLs is consistent with
    normal linkage. Under Stealth, the mismatch exposes capabilities the adversary deliberately hid from
    the import table.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 22
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, network egress points (for Zeek logs), and malware analysis
    sandboxes/threat intelligence feeds (for IAT data).'
  range: Last 90 days
  queries:
  - technology: SIEM/Correlation pseudocode
    query: |-
      iat = pe_imports(process.Image)
      net = FROM (Sysmon3 conn OR Sysmon22 dns) BY ProcessGuid
      ALERT WHERE net.exists
            AND iat NOT INTERSECTS ["ws2_32.dll","wininet.dll","winhttp.dll","dnsapi.dll"]
  - technology: Zeek/pseudocode
    query: |-
      // corroborate egress from host/process lacking net imports
      conn = FROM conn.log WHERE orig_h = suspect_host
      JOIN conn WITH endpoint_proc ON 5-tuple/time TO confirm process attribution
- question: What is each process's Behavior-IAT Mismatch Score — points assigned for every observed capability
    (network connect, child-process create, registry write, DNS query) that lacks a matching static import
    — and which processes fall in the 99th percentile?
  context: Generalize the single-capability check into a cumulative score. For each running process, award
    points whenever an observed behavior has no corresponding import in its on-disk PE — network connections
    without networking imports, child-process creation without process-API imports, registry writes without
    advapi32 imports, DNS without dnsapi imports. Investigate processes in the 99th percentile of this
    Behavior-IAT Mismatch Score. Profile failure-state signals from low-import processes separately (blocked
    connections, NXDOMAIN, failed CreateProcess) as additional corroboration. The more capabilities a
    process exercises that its imports cannot explain, the more confident the verdict of runtime API resolution.
    Under Stealth, a high mismatch score quantifies how much the adversary concealed from static linkage.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 22
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, network egress points (for Zeek logs), and malware analysis
    sandboxes/threat intelligence feeds (for IAT data).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR proc IN running_processes:
        score = 0
        IF net_conn AND "ws2_32/wininet/winhttp" NOT IN iat: score += 1
        IF child_proc AND "CreateProcess imports" NOT IN iat: score += 1
        IF reg_write AND "advapi32" NOT IN iat: score += 1
        IF dns AND "dnsapi" NOT IN iat: score += 1
      ALERT WHERE score >= percentile(all_scores, 99)
            ENRICH WITH failures(blocked_conn, NXDOMAIN, failed_CreateProcess)
- question: Does an XGBoost model combining static PE features with runtime API-sequence and behavior
    metrics (resolved API n-grams, child processes, connections, DNS) classify a process as performing
    dynamic API resolution, and what are the top contributing features?
  context: Static-only models are biased by packing, so fuse static and runtime evidence. Train an XGBoost
    classifier on EMBER-style static PE features together with runtime behavior metrics — resolved API
    n-grams, child-process counts, network connections, and DNS queries — and alert on high malicious
    probability, emitting the top-3 contributing features for analyst validation. Because dynamic API
    resolution is defined by a gap between static imports and runtime behavior, the model learns that
    combination directly rather than relying on either view alone. A high score explained by behavior-import
    divergence is strong; a score driven only by static features should be cross-checked against runtime
    telemetry. Under Stealth, this model captures evasive payloads that defeat static-only detection.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 22
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, network egress points (for Zeek logs), and malware analysis
    sandboxes/threat intelligence feeds (for IAT data).'
  range: Last 90 days
  queries:
  - technology: ML/Model scoring pseudocode
    query: |-
      feats = CONCAT(EMBER_static(Image), runtime_metrics(ProcessGuid))
              // runtime: resolved_api_ngrams, child_count, conn_count, dns_count
      p = xgboost_model.predict_proba(feats)["dynamic_api_resolution"]
      IF p > threshold:
        ALERT WITH top3=treeshap(model, feats)
- question: Did a core system process (svchost.exe, explorer.exe, lsass.exe) spawn a command-line interpreter
    (cmd.exe, powershell.exe, wscript.exe)?
  context: Trusted system processes have well-defined behavior and almost never parent interactive shells.
    Generate high-priority alerts when svchost.exe, explorer.exe, or lsass.exe spawn cmd.exe, powershell.exe,
    or wscript.exe via process-creation telemetry. Such anomalous lineage strongly suggests injected or
    obfuscated code running inside a trusted process and resolving its APIs at runtime to operate under
    cover of a legitimate parent. lsass.exe spawning a shell in particular is almost always malicious.
    A true positive here is high confidence; rare administrative tooling should be allow-listed explicitly
    rather than ignored. Under Stealth, this catches an adversary masquerading malicious execution behind
    a trusted process identity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Critical system processes on all Windows hosts, network traffic logs from perimeter firewalls
    and DNS servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM proc_creation WHERE event_id IN [4688,"Sysmon:1"]
        AND ParentImage IN ["svchost.exe","explorer.exe","lsass.exe"]
        AND Image IN ["cmd.exe","powershell.exe","wscript.exe","cscript.exe"]
      ALERT priority=high (host, ParentImage, Image, CommandLine)
- question: For each critical system process, are its child processes, network destinations, byte/connection
    volumes, or DNS lookups new and beyond the 99th-percentile rarity, or are there abnormal failure spikes
    (blocked egress, NXDOMAIN) from a normally quiet process?
  context: 'Baseline each critical process''s normal behavior — its typical child processes, network destinations,
    connection and byte volumes, and DNS lookups — then flag behaviors beyond the 99th-percentile rarity,
    such as a first-ever connection to a rare external host. Separately profile abnormal failure rates:
    spikes in blocked egress or NXDOMAIN responses from a process that is usually silent are a distinct
    anomaly signal. Deviations from a tight historical baseline indicate code injected into the trusted
    process is exercising hidden, runtime-resolved capabilities. New rare destinations from svchost.exe
    or lsass.exe are high value; gradual drift from normal updates is less concerning. Under Stealth,
    rarity scoring reveals concealed activity hiding inside trusted processes.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Critical system processes on all Windows hosts, network traffic logs from perimeter firewalls
    and DNS servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = baseline(critical_proc) BY child_proc, dest_ip, bytes, conns_per_min, dns
      ALERT WHERE new_behavior_rarity > p99
            OR blocked_egress_rate >> base
            OR nxdomain_rate >> base   // from normally-quiet process
- question: Do time-series models (Prophet/SARIMA) or an unsupervised provenance-graph / one-class model
    flag a critical system process's metrics (network volume, child count, DNS lookups) as significantly
    deviating from prediction?
  context: Model the expected behavior of each critical process and alert on significant deviation. Fit
    time-series models such as Prophet or SARIMA per process on metrics like network volume, child-process
    count, and DNS lookups to forecast normal ranges, and/or apply an unsupervised provenance-graph model
    or one-class detector (Isolation Forest/autoencoder) to learn normal execution structure. Alert when
    observations deviate sharply from predictions and report the top-3 contributing features or graph
    edges. This catches subtle, slow, or novel anomalies in trusted processes that fixed thresholds and
    rules miss, including injected code resolving APIs at runtime. A coherent deviation across multiple
    metrics is strong; single-metric spikes from known maintenance windows can be downranked. Under Stealth,
    behavioral modeling exposes adversaries operating quietly within legitimate processes.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Critical system processes on all Windows hosts, network traffic logs from perimeter firewalls
    and DNS servers.'
  range: Last 90 days
  queries:
  - technology: ML/Time-series pseudocode
    query: |-
      FOR proc IN [svchost, explorer, lsass, ...]:
        fc = prophet_or_sarima.fit(proc.metrics).predict()
        resid = observed - fc
        graph_score = oneclass_or_graph_model.score(proc.provenance)
        IF |resid| > k*sigma OR graph_score < threshold:
          ALERT WITH top3_contributors
