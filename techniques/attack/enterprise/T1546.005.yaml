questions:
- question: '[Persistence] Correlate writes with known malware: Can you determine whether a process writes
    a `trap` registration to a user''s shell startup file (e.g., ~/.bashrc, ~/.profile, ~/.zshrc, ~/.bash_profile)
    on Linux/macOS (or the WSL filesystem on Windows), and the writing process is correlated with a known-malicious
    file hash. -- specifically, using the ''Correlate writes with known malware'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses the shell `trap`
    builtin to execute attacker-controlled code when an interrupt signal fires, leaving traces in shell-startup-file
    writes, process lineage, and follow-on execution or network activity. This evidence focuses on the
    condition that a process writes a `trap` registration to a user''s shell startup file (e.g., ~/.bashrc,
    ~/.profile, ~/.zshrc, ~/.bash_profile) on Linux/macOS (or the WSL filesystem on Windows), and the
    writing process is correlated with a known-malicious file hash. This Symbolic Logic approach looks
    for the following signal: Correlate file-write events on the canonical shell startup file set (`~/.bashrc`,
    `~/.bash_profile`, `~/.profile`, `~/.zshrc`, `~/.zprofile`, `~/.bash_login`, `~/.bash_logout`; on
    WSL via Windows Event ID 4663) with the initiating process from the corresponding process-creation
    event (auditd execve / Sysmon-for-Linux EID 1 / Windows Event ID 4688). Use the exact target-file
    list from the Sigma rule [Unix Shell Configuration Modification](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/path/lnx_auditd_unix_shell_configuration_modification.yml).
    Alert if the initiating process file hash matches a known-malicious hash from a threat-intelligence
    feed. A positive result -- a rule match, statistical outlier, or model alert -- suggests a `trap`
    has been planted or has fired in a way that deviates from sanctioned administration and normal user
    behavior; pivot to the responsible process, its hash and parent lineage, the user/uid context, the
    exact modified startup file and the trap body, and any child process, privilege change, or outbound
    connection that follows. A negative result helps rule out this trap vector for the inspected scope
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, obfuscated, or living-off-the-land trap abuse.'
  answer_sources: &id001
  - auditd:SYSCALL (execve, openat write)
  - macOS Endpoint Security (ES_EVENT_TYPE_NOTIFY_WRITE)
  - Sysmon for Linux Event ID 11 (FileCreate) / Event ID 1 (ProcessCreate)
  - Windows Event ID 4663 / 4688 (WSL)
  - 'NAI: User home directories on Linux/macOS endpoints and servers, and WSL home directories on Windows
    endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Correlate writes with known malware

      source IN [auditd:SYSCALL (execve, openat write), macOS Endpoint Security (ES_EVENT_TYPE_NOTIFY_WRITE),
      Sysmon for Linux Event ID 11 (FileCreate) / Event ID 1 (ProcessCreate), Windows Event ID 4663 /
      4688 (WSL)]

      | WHERE matches_action_criteria("Correlate writes with known malware")

      // Correlate file-write events on the canonical shell startup file set (`~/.bashrc`, `~/.bash_profile`,
      `~/.profile`, `~/.z

      | ALERT enrich(host, user, uid, process, parent, hash, target_file, trap_body, child, dest)'
