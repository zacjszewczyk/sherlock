name: 'T1546.005: Trap'
id: 97f2d0db-80fb-410e-b7eb-2b23957db1ed
description: 'This playbook helps an analyst investigate adversary abuse of the shell `trap` builtin to
  register code that executes when a shell receives an interrupt signal (e.g., SIGINT/Ctrl+C, SIGHUP,
  or EXIT), used both to maintain persistence and to escalate privilege on Linux, macOS, and WSL-on-Windows
  hosts. It guides the hunt across several complementary angles: writes of `trap` registrations into per-user
  shell startup files (~/.bashrc, ~/.bash_profile, ~/.profile, ~/.zshrc, ~/.zprofile, ~/.bash_login, ~/.bash_logout)
  and into system-wide privileged scripts (/etc/profile, /etc/bash.bashrc, /etc/profile.d/*); correlation
  of those file modifications with the initiating process, its hash, user/uid context, and parent lineage;
  inspection of trap argument bodies for remote-payload (curl/wget), obfuscation (base64/eval), reverse-shell
  (bash -i, nc, python -c, /dev/tcp/), and privilege-altering primitives (usermod, chmod u+s, setcap,
  chown root, visudo, >> /etc/sudoers); detection of unexpected or non-allowlisted writers (browsers,
  office, downloaders, or non-root users touching root-owned scripts); and the runtime execution signature
  of a trap firing — a shell spawning a child immediately before terminating that then makes an outbound
  connection or sets a setuid bit, or a privileged service (cron, systemd, launchd) spawning an out-of-allowlist
  child. Detection methods combine symbolic-logic rules, statistical baselining (rarity scoring, Shannon
  entropy, syscall-frequency and n-gram/sequence anomaly), and machine-learning models (gradient-boosted/Random
  Forest classifiers, NLP/embedding command classifiers, LSTM log-sequence models, isolation forests,
  and provenance-graph learning) applied to auditd SYSCALL, Sysmon for Linux, macOS Unified Log / Endpoint
  Security, EDR/FIM content diffs, Zeek conn.log, and Windows WSL telemetry, so the analyst can corroborate
  suspected trap abuse against file content, process lineage, user context, and follow-on network or privilege
  activity.'
type: technique
