    windows compute coefficient of variation of inter-arrival times and `orig_bytes`, MAD dispersion,
    Bowley skewness, and a DFFT periodicity score. Flag pairs with CV below the 5th percentile for both
    timing and size; also profile the failed/rejected connection ratio (`S0`/`REJ`) since retry beacons
    to dead C2 produce regular failed attempts. Suppress known telemetry via allowlists ([RITA, Active
