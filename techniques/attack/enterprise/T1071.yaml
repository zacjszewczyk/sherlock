questions:
- question: 'Using deterministic rule logic, can you determine whether ''CTI session matching rule'' indicates
    command and control over an application layer protocol? Specifically: Continuously join destination
    IPs from Zeek conn.log (`id.resp_h`), queried domains from dns.log (`query`), and TLS server names
    from ssl.log (`server_name`) against a high-confidence CTI feed of known C2 infrastructure. Generate
    a high-severity alert for any match. Layer this beside first-party external-destination rarity scoring
    so novel C2 not yet on a feed is still surfaced ([RITA, Active Countermeasures](https://github.com/activecm/rita)).'
  context: 'Tactic context (Command and Control / TA0011): adversaries communicate with compromised systems
    by embedding commands and results inside common application layer protocols so their traffic mimics
    normal, expected activity and evades network filtering. Evidence under investigation: A network connection
    to a destination IP, domain, or TLS Server Name Indication (SNI) that is present on a Cyber Threat
    Intelligence (CTI) feed of known C2 indicators. Approach (CTI session matching rule): Continuously
    join destination IPs from Zeek conn.log (`id.resp_h`), queried domains from dns.log (`query`), and
    TLS server names from ssl.log (`server_name`) against a high-confidence CTI feed of known C2 infrastructure.
    Generate a high-severity alert for any match. Layer this beside first-party external-destination rarity
    scoring so novel C2 not yet on a feed is still surfaced ([RITA, Active Countermeasures](https://github.com/activecm/rita)).
    A positive result indicates a host is communicating with adversary infrastructure or running a covert
    channel disguised as ordinary application-layer traffic (matching CTI, C2 fingerprints, beacon cadence,
    tunneling, inverted byte ratios, or protocol/port anomalies); a negative result means the observed
    traffic is consistent with legitimate, baselined application behavior. Investigate the named area
    of interest (Egress points (e.g., firewalls, web proxies), DNS resolvers, Core network switches) and
    pivot from any hit to the originating process, account, user, and destination - then hunt for related
    staging, lateral movement, and data exfiltration.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Egress points (e.g., firewalls, web proxies), DNS resolvers, Core network switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic CTI session matching\nJOIN conn.log(id.resp_h) , dns.log(query) , ssl.log(server_name)\n\
      \  AGAINST cti_feed.high_confidence_c2  // IPs, domains, SNIs\nWHEN match THEN alert(severity='high',\
      \ enrich=[src_host, indicator, feed_source])\n// layer rarity scoring so novel C2 not on a feed\
      \ is still surfaced (RITA-style)\nALSO flag first-seen external dst not in 90d baseline"
