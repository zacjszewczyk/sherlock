- question: 'Using statistical baselining, can you determine whether ''Low variance timing and size scoring''
    indicates command and control over an application layer protocol? Specifically: Per source-destination
    pair over 1h windows compute coefficient of variation of inter-arrival times and `orig_bytes`, MAD
    dispersion, Bowley skewness, and a DFFT periodicity score. Flag pairs with CV below the 5th percentile
    for both timing and size; also profile the failed/rejected connection ratio (`S0`/`REJ`) since retry
    beacons to dead C2 produce regular failed attempts. Suppress known telemetry via allowlists ([RITA,
    Active Countermeasures](https://github.com/activecm/rita)).'
