  answer_sources:
  - Zeek conn.log
  - 'NAI: Egress points (e.g., firewalls), Network taps monitoring internal subnets, Core network switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Low-variance timing & size scoring per (src,dst) over 1h

      cv_time = stdev(inter_arrival)/mean(inter_arrival)

      cv_size = stdev(orig_bytes)/mean(orig_bytes)

      mad = MAD(inter_arrival) ; skew = bowley_skew(inter_arrival) ; fft = dfft_periodicity_score

      fail_ratio = count(conn_state IN [''S0'',''REJ'']) / count(*)

      FLAG when cv_time < p5 AND cv_size < p5 ; ALSO flag high fail_ratio (retry beacon)

      SUPPRESS known telemetry via allowlist'
