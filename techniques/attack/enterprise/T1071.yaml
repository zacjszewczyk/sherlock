name: 'T1071: Application Layer Protocol'
id: 271dae92-7672-4e94-b255-35679f328395
description: 'This playbook helps an analyst determine whether an adversary has established command and
  control (C2) using a common OSI application layer protocol (T1071) - such as HTTP/S, DNS, TLS, SMB,
  SSH, or RDP - to blend malicious traffic in with normal, expected network communications. It correlates
  network telemetry (Zeek conn.log, dns.log, http.log, ssl.log, notice.log) with host process and network-connection
  telemetry (Windows Event ID 4688/5156/5157, Sysmon Event ID 1/3, auditd execve, macOS osquery/unifiedlog)
  to surface covert channels. Investigative angles include: connections to destination IPs, domains, or
  TLS SNIs on CTI feeds of known C2 infrastructure; outbound HTTP/S whose User-Agent, URI, or JA3/JA3S/JA4
  fingerprints match known C2 frameworks (e.g., Cobalt Strike Malleable C2); regular, low-jitter, fixed-size
  beaconing; connections on common ports from processes or file paths that should not generate that traffic;
  DNS tunneling indicators (high subdomain entropy, excessive query length, TXT/NULL spikes, elevated
  NXDOMAIN); inverted byte ratios indicating upload/exfil; and protocol-port mismatches or protocol-violation
  notices. Detection blends symbolic-logic rules (CTI matching, signature regex, deterministic thresholds),
  statistical baselining (prevalence/rarity percentiles, coefficient of variation, entropy, Z-score/IQR,
  failed-connection ratios), and machine learning (Isolation Forest, DBSCAN, GCN, LSTM/transformer and
  CT-HMM sequence models) to produce evasion-resistant, explainable alerts for the Command and Control
  tactic.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command And Control
