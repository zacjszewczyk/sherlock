questions:
- question: '[Stealth] Rule on new shared library creations matching TI: Can you determine whether a shared
    object file (.so, .dylib) is created in a user-writable directory (e.g., /tmp, /home/*) or a standard
    library path, and its hash matches a known-bad hash from a threat intelligence feed. -- specifically,
    using the ''Rule on new shared library creations matching TI'' (Symbolic Logic) detection approach
    for the technique Hijack Execution Flow: Dynamic Linker Hijacking?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the information requirement is "Is the
    adversary establishing persistence using dynamic linker hijacking?" Hijack Execution Flow: Dynamic
    Linker Hijacking lets an adversary load an attacker-controlled shared library ahead of legitimate
    ones (via LD_PRELOAD / DYLD_INSERT_LIBRARIES, /etc/ld.so.preload, /etc/ld.so.conf.d, or shell startup
    files) so their code runs inside a trusted process -- granting execution, persistence, privilege escalation,
    and stealthy hooking of libc/syscall functions to hide artifacts. This evidence focuses on the condition
    that a shared object file (.so, .dylib) is created in a user-writable directory (e.g., /tmp, /home/*)
    or a standard library path, and its hash matches a known-bad hash from a threat intelligence feed.
    How to pursue it (Symbolic Logic): Query file-creation events (Sysmon for Linux EID 11 / auditd PATH)
    where the name ends in ''.so'' or ''.dylib'' in user-writable or library paths and the hash matches
    known-bad indicators. Collect at the syscall layer (eBPF) per [Tracee](https://github.com/aquasecurity/tracee)
    and [Falco default rules](https://falco.org/docs/reference/rules/default-rules/) so userland hooking
    cannot suppress the event; enrich with Symbiote/PUMAKIT IOCs from [Intezer](https://intezer.com/blog/research/new-linux-threat-symbiote/)
    and [Elastic](https://www.elastic.co/security-labs/declawing-pumakit). A positive result -- a rule
    match, statistical outlier, or model alert -- is a strong signal of dynamic linker hijacking; pivot
    to the responsible process and parent lineage, the user and host context, the implicated shared object
    or linker-config/shell file, and any downstream network egress, child shells, or lost telemetry. Capturing
    this at the syscall/eBPF layer matters because userland rootkits (e.g., Symbiote, PUMAKIT, Ebury)
    hook standard functions to suppress exactly these artifacts. A negative result helps rule out this
    specific vector but should be corroborated with the other questions in this playbook, since hooking
    can mask any single source.'
  answer_sources:
  - Sysmon for Linux Event ID 11
  - 'NAI: User home directories, /tmp, /var/tmp, /dev/shm, and standard library paths (/lib, /usr/lib,
    /lib64) on critical Linux/macOS servers and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Rule on new shared library creations matching TI

      search file_events OR process_events OR network_events

      | where matches_condition_from_action

      | eval reason = "see action logic"

      | table _time, host, user, process, image, parent, cmdline, file_path, hash, dest_ip, env

      | where rule_logic_true

      | alert'
