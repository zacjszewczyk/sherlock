    linker hijacking; pivot to the responsible process and parent lineage, the user and host context,
    the implicated shared object or linker-config/shell file, and any downstream network egress, child
    shells, or lost telemetry. Capturing this at the syscall/eBPF layer matters because userland rootkits
    (e.g., Symbiote, PUMAKIT, Ebury) hook standard functions to suppress exactly these artifacts. A negative
    result helps rule out this specific vector but should be corroborated with the other questions in
    this playbook, since hooking can mask any single source.'
  answer_sources:
  - Sysmon for Linux Event ID 11
  - 'NAI: User home directories, /tmp, /var/tmp, /dev/shm, and standard library paths (/lib, /usr/lib,
    /lib64) on critical Linux/macOS servers and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Alert when shared library creation count spikes

      search relevant_events earliest=-90d

      | bin _time span=1d

      | stats count as metric by host, entity, _time

      | eventstats median(metric) as med, median(abs(metric-med)) as mad by host, entity

      | eval mod_z = 0.6745*(metric-med)/mad

      | where mod_z > 3.5

      | alert'
