- question: '[Execution] Flag rare LD_PRELOAD usage per process name: Can you determine whether the `LD_PRELOAD`
    environment variable is detected in the process context of a SUID/SGID executable, indicating an attempt
    to bypass linker sanitization on vulnerable systems. -- specifically, using the ''Flag rare LD_PRELOAD
    usage per process name'' (Statistical Method) detection approach for the technique Hijack Execution
    Flow: Dynamic Linker Hijacking?'
  context: 'Why this matters: Under the Execution tactic (TA0002), the information requirement is "Is
    the adversary establishing persistence using dynamic linker hijacking?" Hijack Execution Flow: Dynamic
    Linker Hijacking lets an adversary load an attacker-controlled shared library ahead of legitimate
    ones (via LD_PRELOAD / DYLD_INSERT_LIBRARIES, /etc/ld.so.preload, /etc/ld.so.conf.d, or shell startup
    files) so their code runs inside a trusted process -- granting execution, persistence, privilege escalation,
    and stealthy hooking of libc/syscall functions to hide artifacts. This evidence focuses on the condition
    that the `LD_PRELOAD` environment variable is detected in the process context of a SUID/SGID executable,
    indicating an attempt to bypass linker sanitization on vulnerable systems. How to pursue it (Statistical
    Method): Compute the per-process-name rarity of `LD_PRELOAD` being set across the enterprise; alert
    when it appears for a process where it is statistically rare (e.g., <0.01% of historical executions),
    using robust frequency estimation ([Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    Treat any occurrence on SUID binaries as effectively zero-baseline. A positive result -- a rule match,
    statistical outlier, or model alert -- is a strong signal of dynamic linker hijacking; pivot to the
    responsible process and parent lineage, the user and host context, the implicated shared object or
    linker-config/shell file, and any downstream network egress, child shells, or lost telemetry. Capturing
    this at the syscall/eBPF layer matters because userland rootkits (e.g., Symbiote, PUMAKIT, Ebury)
    hook standard functions to suppress exactly these artifacts. A negative result helps rule out this
    specific vector but should be corroborated with the other questions in this playbook, since hooking
    can mask any single source.'
