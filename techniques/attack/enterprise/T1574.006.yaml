name: 'T1574.006: Hijack Execution Flow: Dynamic Linker Hijacking'
id: 2e119cb7-7f65-4b69-8232-a1c2d4ab7ffe
description: 'This playbook helps an analyst investigate whether an adversary is abusing dynamic linker
  hijacking (T1574.006) -- setting LD_PRELOAD/LD_LIBRARY_PATH on Linux or DYLD_INSERT_LIBRARIES/DYLD_LIBRARY_PATH
  on macOS, planting malicious shared objects (.so/.dylib), or editing linker configuration files (/etc/ld.so.preload,
  /etc/ld.so.conf.d/) and shell startup files (~/.bashrc, ~/.profile, ~/.zshrc) -- to force a trusted
  process to load attacker-controlled code before legitimate libraries. It spans both the Execution and
  Stealth angles of this technique: detecting malicious library creation matched to threat intel, linker-config
  and shell-rc tampering, LD_PRELOAD set on SUID/SGID binaries and security agents, core daemons making
  unexpected network egress, SUID binaries spawning shells, userland rootkit libraries that export hooks
  for libc functions (readdir/execve/connect), enumeration tools run with LD_PRELOAD to filter output,
  and sudden drops in security/telemetry volume that signal a blinded agent. Detection combines symbolic-logic
  rules, robust statistical baselining (MAD/modified Z-score), and machine-learning models (file classifiers,
  autoencoders, LSTM sequence and provenance-graph models) applied to Sysmon for Linux events, auditd,
  macOS unified logs, and Zeek conn.log -- with collection emphasized at the syscall/eBPF layer (Tracee,
  Falco) so userland hooking cannot suppress the evidence.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0002
  tactic_name: Execution
