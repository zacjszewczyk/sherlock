    writes to an unusual file path, indicating its execution flow has been hijacked. -- specifically,
    using the ''Flag rare children or network connections'' (Statistical Method) detection approach for
    the technique Hijack Execution Flow: Dynamic Linker Hijacking?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the information requirement is "Is the
    adversary establishing persistence using dynamic linker hijacking?" Hijack Execution Flow: Dynamic
    Linker Hijacking lets an adversary load an attacker-controlled shared library ahead of legitimate
    ones (via LD_PRELOAD / DYLD_INSERT_LIBRARIES, /etc/ld.so.preload, /etc/ld.so.conf.d, or shell startup
    files) so their code runs inside a trusted process -- granting execution, persistence, privilege escalation,
    and stealthy hooking of libc/syscall functions to hide artifacts. This evidence focuses on the condition
    that a SUID/SGID executable spawns an unexpected child process (e.g., /bin/sh), initiates a network
    connection, or writes to an unusual file path, indicating its execution flow has been hijacked. How
    to pursue it (Statistical Method): Baseline each SUID/SGID binary''s child processes and network destinations;
    alert on children outside its 99% frequent set or destination IPs that are statistical outliers, and
    weight failed/blocked connection spikes (State/failure signal) per [BoSC syscall-frequency anomaly
    detection](https://arxiv.org/abs/1611.03053). A positive result -- a rule match, statistical outlier,
    or model alert -- is a strong signal of dynamic linker hijacking; pivot to the responsible process
    and parent lineage, the user and host context, the implicated shared object or linker-config/shell
    file, and any downstream network egress, child shells, or lost telemetry. Capturing this at the syscall/eBPF
    layer matters because userland rootkits (e.g., Symbiote, PUMAKIT, Ebury) hook standard functions to
    suppress exactly these artifacts. A negative result helps rule out this specific vector but should
    be corroborated with the other questions in this playbook, since hooking can mask any single source.'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - Sysmon for Linux Event ID 3
  - Sysmon for Linux Event ID 11
  - Zeek conn.log
  - 'NAI: Process, network, and file system logs from all Linux hosts, especially critical application
    and database servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Flag rare children or network connections

      search relevant_events earliest=-90d

      | bin _time span=1d

      | stats count as metric by host, entity, _time

      | eventstats median(metric) as med, median(abs(metric-med)) as mad by host, entity

      | eval mod_z = 0.6745*(metric-med)/mad

      | where mod_z > 3.5

      | alert'
