    Evidence under investigation: A domain account creation event (Windows Event ID 4720) is linked to
    a parent process (via Windows Event ID 4688) whose file hash is present in a threat intelligence database
    or that originates from a host with an anomalously high risk score. Approach (Parent hash intelligence
    check): Extract the parent executable hash from the joined 4688 and match against an internal/threat-intel
    hash feed; raise an alert when flagged, including the feed name and the associated domain account
    ([T1136.002](https://attack.mitre.org/techniques/T1136/002/)). A positive result indicates a domain
    account was created or behaves in a way that deviates from sanctioned IAM provisioning (unexpected
