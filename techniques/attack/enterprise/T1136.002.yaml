questions:
- question: 'Using deterministic rule logic, can you determine whether ''Creation-command lineage rule''
    indicates malicious domain account creation activity? Specifically: Join each Windows Event ID 4720
    to its parent Event ID 4688/Sysmon EID 1 via Process GUID/ID and alert when the creating process is
    `net.exe`/`net1.exe` with `user`+`/add`+`/domain`, `powershell.exe` running `New-ADUser`, or an LDAP/`samba-tool`
    provisioning tool, especially when the parent is not a sanctioned IAM service ([CAR-2013-07-001](https://car.mitre.org/analytics/CAR-2013-07-001/),
    [T1136.002](https://attack.mitre.org/techniques/T1136/002/)). Report parent path, command line, creator
    SID, and new account.'
  context: 'Tactic context (Persistence): the adversary is trying to maintain their foothold by creating
    a domain account that yields secondary, credentialed access surviving reboots and credential resets.
    Evidence under investigation: A domain account creation event (Windows Event ID 4720) is linked to
    a parent process (via Windows Event ID 4688) whose file hash is present in a threat intelligence database
    or that originates from a host with an anomalously high risk score. Approach (Creation-command lineage
    rule): Join each Windows Event ID 4720 to its parent Event ID 4688/Sysmon EID 1 via Process GUID/ID
    and alert when the creating process is `net.exe`/`net1.exe` with `user`+`/add`+`/domain`, `powershell.exe`
    running `New-ADUser`, or an LDAP/`samba-tool` provisioning tool, especially when the parent is not
    a sanctioned IAM service ([CAR-2013-07-001](https://car.mitre.org/analytics/CAR-2013-07-001/), [T1136.002](https://attack.mitre.org/techniques/T1136/002/)).
    Report parent path, command line, creator SID, and new account. A positive result indicates a domain
    account was created or behaves in a way that deviates from sanctioned IAM provisioning (unexpected
    creator, host, timing, parent process, privilege escalation, or post-creation behavior) and warrants
    pivoting to the creating process, creator identity, source workstation, and the new account''s downstream
    authentications and group memberships. A negative result means the creation matches the established
    legitimate-provisioning baseline. Investigate the named area of interest and correlate around the
    creation timestamp.'
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Log Aggregation Platform (SIEM), Endpoint Detection and Response (EDR) Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Creation-command lineage rule\nMATCH events WHERE event_id\
      \ == 4720  // domain account created\nJOIN process_creation pc ON pc.process_guid == evt.creator_process_guid\
      \  // EID 4688 / Sysmon 1\nWHERE pc.cmdline MATCHES /(net1?\\s+user.*\\/add.*\\/domain|New-ADUser|samba-tool\
      \ user create|realmd|ldapmodify|dsconfigad|dscl.*-create)/i\n   OR pc.image_hash IN threat_intel_hash_feed\n\
      \   OR subject_sid NOT IN authorized_iam_admins\n   OR source_ip NOT IN approved_admin_workstations\n\
      EMIT parent_path, cmdline, creator_sid, new_account, target_group"
- question: 'Using deterministic rule logic, can you determine whether ''Parent hash intelligence check''
    indicates malicious domain account creation activity? Specifically: Extract the parent executable
    hash from the joined 4688 and match against an internal/threat-intel hash feed; raise an alert when
    flagged, including the feed name and the associated domain account ([T1136.002](https://attack.mitre.org/techniques/T1136/002/)).'
  context: 'Tactic context (Persistence): the adversary is trying to maintain their foothold by creating
