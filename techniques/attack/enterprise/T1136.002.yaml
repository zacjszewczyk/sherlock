- question: 'Using statistical baselining, can you determine whether ''Host risk percentile trigger''
    indicates malicious domain account creation activity? Specifically: Maintain a 14-day rolling per-host
    risk score derived from internal AV, IDS, and EDR alerts (no external lookup required). Compute the
    estate-wide 95th percentile daily and alert when a new domain creation originates from a host exceeding
    it, highlighting the contributing risk sources ([Isolation Forest](https://ieeexplore.ieee.org/document/4781136)).'
