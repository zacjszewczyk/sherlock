name: 'T1136.002: Domain Account'
id: ffc5f197-d908-401a-a397-48a687123747
description: 'This playbook helps an analyst investigate whether an adversary is establishing or maintaining
  persistence by creating a new Active Directory domain account (T1136.002). Domain accounts provide durable,
  credentialed access across systems and services without requiring persistent remote-access tooling,
  making rogue account creation a high-value persistence and privilege-staging behavior. The playbook
  correlates account-creation telemetry (Windows Event ID 4720, auditd/macOS unified-log command execution)
  with the creating process lineage (Event ID 4688 / Sysmon EID 1), the creator''s identity and source
  workstation, and the new account''s subsequent behavior. Investigative angles include: creation-command
  lineage and keyword matching (net user /add /domain, New-ADUser, samba-tool, realmd, ldapmodify, dsconfigad/dscl);
  parent-process threat-intel hash matching; host-risk percentile scoring; statistical baselining of creation
  frequency, command entropy, and temporal rarity; administrator/workstation allowlisting; rapid privileged-group
  additions (EID 4728/4732/4756) and typosquatted privileged usernames; and anomalous first-48-hour behavior
  of the new account such as logons to crown-jewel hosts, excessive destination breadth, abnormal outbound
  volume/failure rates, and novel authentication-graph edges. Detection blends symbolic-logic rules, statistical
  methods (Seasonal-Hybrid ESD, percentile and entropy baselines, string distance), and machine learning
  (Isolation Forest/One-Class SVM, XGBoost/Random Forest classifiers, DeepLog LSTM sequence models, and
  graph anomaly detection) to produce explainable, evasion-resistant alerts for the Persistence tactic.'
