  - technology: SIEM/Rule pseudocode
    query: '// Symbolic Logic: Parent hash intelligence check

      MATCH a IN events WHERE event_id == 4720

      JOIN p IN process_creation ON p.process_guid == a.creator_process_guid   // EID 4688

      SET h = p.parent_hash

      WHERE h IN internal_or_threatintel_hash_feed

      EMIT feed_name, parent_hash, domain_account

      // Ref: T1136.002'
- question: 'Using statistical baselining, can you determine whether ''Host risk percentile trigger''
