  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Log Aggregation Platform (SIEM), Endpoint Detection and Response (EDR) Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Statistical Method: Host risk percentile trigger

      DEFINE host_risk(host) = rolling_14d_sum(internal_av_alerts, ids_alerts, edr_alerts)   // no external
      lookup

      COMPUTE p95 = estate_wide_percentile(host_risk over all hosts, 95)   // recompute daily

      MATCH a IN events WHERE event_id == 4720                 // domain account created

      WHERE host_risk(a.source_host) > p95

      EMIT source_host, host_risk, contributing_risk_sources, new_account

      // Ref: Isolation Forest'
