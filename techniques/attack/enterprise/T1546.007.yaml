name: 'T1546.007: Netsh Helper DLL'
id: 42b70a01-f50c-45dc-af73-dd22cc30f263
description: 'This playbook helps an analyst investigate whether an adversary is abusing the Windows Netsh
  Helper DLL mechanism (T1546.007) to establish persistence and/or to execute code with elevated privileges.
  Netsh.exe loads any helper DLL registered under HKLM\SOFTWARE\Microsoft\Netsh, so a single registry
  write can cause attacker code to run every time netsh.exe is invoked - automatically, via another persistence
  trigger, or by legitimate software (e.g., VPN clients) that calls netsh as part of normal operation.
  It guides the hunt across the full attack chain: registry writes that point a new helper at a suspicious
  or IOC-matched DLL; netsh.exe executions carrying ''add helper'' command lines; helper DLLs with anomalous
  properties (unsigned, in user-writable paths outside System32, high entropy, or low enterprise prevalence);
  just-in-time DLL drops by medium-integrity processes followed by high/SYSTEM-integrity registration;
  netsh.exe spawning suspicious children (powershell, cmd, rundll32, regsvr32) or beaconing to rare network
  destinations; and weak ACLs on helper DLL files or the Netsh registry key that allow unprivileged hijack
  of an auto-loaded, elevated helper. Detection methods combine symbolic-logic rules, statistical baselining/stack-counting/change-point
  analysis, and machine-learning classifiers/anomaly detectors applied to Windows Security event logs
  (4657, 4688), Sysmon (EID 1, 7, 11, 13, 3), Zeek conn/dns telemetry, and host configuration/ACL audit
  data, so the analyst can corroborate suspected Netsh Helper DLL abuse against registry state, process
  lineage, file provenance, integrity levels, permissions, and network context.'
type: technique
