questions:
- question: '[Persistence] Detect registry writes with TI IOCs: Can you determine whether a new value
    is written to the Windows Registry key `HKLM\SOFTWARE\Microsoft\Netsh` that points to a DLL whose
    file hash or name is a known indicator of compromise (IOC). -- specifically, using the ''Detect registry
    writes with TI IOCs'' (Symbolic Logic) approach?'
  context: 'Why this matters: This investigation addresses the mission question "Is an adversary establishing
    persistence through the registration and execution of a malicious Netsh Helper DLL?" Under the Persistence
    tactic (TA0003), an adversary abuses the Netsh Helper DLL extension point so that attacker-controlled
    code executes whenever netsh.exe runs, leaving traces in registry, process-creation, file-create,
    permission, and network telemetry. This evidence focuses on the condition that a new value is written
    to the Windows Registry key `HKLM\SOFTWARE\Microsoft\Netsh` that points to a DLL whose file hash or
    name is a known indicator of compromise (IOC). This Symbolic Logic approach works as follows: Alert
    on any Sysmon Event ID 13 or Windows Event ID 4657 where the TargetObject/key contains `HKLM\SOFTWARE\Microsoft\Netsh`
    and the written value is a DLL path; this registry write is the deterministic core indicator of T1546.007
    ([SigmaHQ Netsh Helper DLL rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_persistence_netsh_helper_dll.yml),
    [LOLBAS Netsh](https://lolbas-project.github.io/lolbas/Binaries/Netsh/)). Extract the DLL path, retrieve
    its SHA256, and cross-reference hash and filename against threat-intel IOCs. Generate a high-severity
    alert on any match. A positive result -- a deterministic rule match, a statistical outlier, or a model
    alert -- indicates a Netsh helper registration or netsh.exe behavior that deviates from the tiny,
    stable population of legitimate Microsoft-signed System32 helpers and normal administrative activity;
    pivot to the responsible registry value, the DLL on disk (path, signer, hash, prevalence), the process
    lineage and integrity level, the acting user, and any subsequent child processes or outbound connections.
    A negative result helps rule out this Netsh Helper DLL vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land
    abuse of this persistence/escalation mechanism.'
