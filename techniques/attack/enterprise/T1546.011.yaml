name: 'T1546.011: Application Shimming'
id: 0beeb661-9b4d-4cf0-b59d-a67931ab74ca
description: Investigate potential abuse of the Microsoft Windows Application Compatibility Infrastructure
  (application shimming, T1546.011) for persistence and privilege escalation. Adversaries register custom
  shim databases (.sdb) — typically via sdbinst.exe — to hook and redirect the execution of legitimate
  programs, injecting DLLs (InjectDLL), bypassing User Account Control through auto-elevating executables
  (eventvwr.exe, fodhelper.exe, computerdefaults.exe, msconfig.exe), disabling defenses, and re-running
  malicious code whenever a shimmed program launches. This playbook helps an analyst hunt for malicious
  .sdb files dropped to user-writable or AppPatch\Custom directories, suspicious sdbinst.exe executions,
  modifications of the AppCompatFlags Custom/InstalledSDB registry keys, and the post-installation behavior
  of shim-target and auto-elevating processes (anomalous child processes, integrity-level jumps, unsigned
  DLL loads, and outbound C2 connections). It combines symbolic-logic detections, statistical baselining
  (frequency, volume, entropy, and failure-mode anomalies), and machine-learning approaches (classification,
  sequence modeling, and provenance-graph analysis), drawing on documented FIN7 shim tradecraft.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has any newly created custom shim database (.sdb) in %WINDIR%\AppPatch\Custom\ (or Custom64)
    matched known-malicious threat intelligence by hash or triggered a YARA rule for malicious shim content?
  context: 'Persistence via application shimming begins with the creation of a custom shim database. Trigger
    on file creation events (Sysmon Event ID 11 / Windows Event ID 4663) where the TargetFilename ends
    in ''.sdb'' under %WINDIR%\AppPatch\Custom\ or \Custom\Custom64\, compute the SHA256 and query CTI,
    and scan the content with YARA. Also surface documented FIN7 tells: random-GUID .sdb filenames, an
    .sdb staged first as a .tmp in C:\Windows\Temp, and a fake ''Microsoft KB#######'' uninstall description
    in the Add/Remove Programs registry. A hash/CTI or YARA hit on a fresh custom .sdb is strong evidence
    of an attempt to persist by hooking legitimate programs; a clean result lowers but does not eliminate
    suspicion since novel shims may evade signatures.'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "file_create where (Sysmon.EventID==11 OR Security.EventID==4663)\n  and TargetFilename matches\
      \ (?i)\\\\AppPatch\\\\Custom(64)?\\\\.*\\.sdb$\n| eval sha256=hash(TargetFilename)\n| lookup CTI\
      \ sha256 OR yara_scan(TargetFilename, rules='malicious_shim')\n| eval fin7=(filename matches GUID)\
      \ OR staged_as_tmp_in('C:\\\\Windows\\\\Temp')\n       OR uninstall_desc matches '(?i)Microsoft\
      \ KB[0-9]+'\n| where cti_hit OR yara_hit OR fin7\n| alert"
- question: Do any newly created custom .sdb files exhibit abnormally high Shannon entropy relative to
    the known-good baseline, indicating a packed or encrypted payload concealed inside the shim database?
  context: Beyond signature matching, malicious shims often carry packed/encrypted payloads that raise
    file entropy. For every new .sdb in the custom-shim directory, compute Shannon entropy and file size,
    build a baseline distribution from known-good .sdb files, and alert when entropy exceeds the 95th
    percentile (derive the exact per-environment cutoff). High entropy on a custom shim is a statistical
    anomaly consistent with malware staging and warrants escalation; entropy within the benign band is
    reassuring but should still be correlated with the writer process and install context for this persistence
    technique.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = entropy distribution of known-good *.sdb\nfor new_sdb in AppPatch\\Custom:\n  e\
      \ = shannon_entropy(new_sdb); sz = filesize(new_sdb)\n  if e > percentile(baseline.entropy, 95):\
      \ alert(new_sdb, e, sz)"
- question: When a new .sdb is scored by the gradient-boosting / Random Forest classifier trained on benign
    vs. malicious shim features, does it exceed the 0.90 malicious-confidence threshold?
  context: To catch novel shims that evade hash and YARA detection, train a gradient-boosting / Random
    Forest classifier on byte/section n-gram and Shannon-entropy features from labeled benign vs. malicious
    .sdb files, then classify each new .sdb in real time. Alert above confidence 0.90 and ALWAYS surface
    the top-3 contributing features (e.g., section entropy, suspicious string n-grams, writer process)
    so the analyst can triage. A high-confidence malicious classification on a freshly written custom
    shim strongly indicates an attempt to persist via application shimming; the explainable features point
    at exactly what made the file suspicious.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML pipeline/pseudocode
    query: 'model = GradientBoosting/RandomForest.fit(features=[byte_ngrams, section_entropy, strings],
      labels)

      for new_sdb: p = model.predict_proba(features(new_sdb))

      if p_malicious > 0.90: alert(new_sdb, top3=model.explain(new_sdb))'
- question: Is there an anomalous spike in access-denied writes to %WINDIR%\AppPatch\Custom\ or in failed/aborted
    sdbinst.exe executions on any host, suggesting an under-privileged adversary attempting shim installation?
  context: 'Adversaries lacking administrator rights will generate failure signals when they attempt to
    install shims. Explicitly baseline these as a distinct count/min series per host: access-denied writes
    to %WINDIR%\AppPatch\Custom\ (Event ID 4663 with a failed access mask) and failed/aborted sdbinst.exe
    runs. Compute per-host z-scores and alert on spikes. A burst of blocked shim writes is high-signal
    for an attacker probing for persistence without the needed privileges; the absence of such failures
    does not rule out a successful privileged install, which the other detections cover.'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "series = count_per_min(EventID==4663 and path~AppPatch\\Custom and access_result=='DENIED'\n\
      \                       OR sdbinst.exe exit_status!=0) by host\nz = (series - mean_host)/std_host\n\
      if z > 3: alert(host, window)"
- question: Was sdbinst.exe executed with a command line referencing a .sdb (or .tmp) file located in
    a user-writable directory such as C:\Users\, C:\Temp\, C:\Windows\Temp\, %APPDATA%, or C:\ProgramData\?
  context: Legitimate shim installs are normally driven by trusted installers writing to controlled locations;
    an attacker stages the .sdb in a user-writable path. Trigger on process creation (Sysmon Event ID
    1 / Windows Event ID 4688) where Image is sdbinst.exe and the CommandLine references a .sdb or .tmp
    in a user-writable path. The .tmp-staged shim in C:\Windows\Temp is a documented FIN7 pattern. A match
    indicates a likely malicious shim registration for persistence; investigate the parent process, the
    user context, and the referenced .sdb file.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Staging Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc_create where Image endswith 'sdbinst.exe'\n  and CommandLine matches (?i)(c:\\\\users\\\
      \\|c:\\\\temp\\\\|c:\\\\windows\\\\temp\\\\|\\\\appdata\\\\|c:\\\\programdata\\\\).*\\.(sdb|tmp)\n\
      | alert(host, user, parent=ParentImage, CommandLine)"
- question: Does any sdbinst.exe execution reference a .sdb parent directory that is first-seen or observed
    fewer than five times across the last 90 days?
  context: Malicious shim installs often originate from directories never used for legitimate patching.
    Parse the .sdb parent directory from every sdbinst.exe command line and keep a 90-day frequency table;
    alert when the parent directory is first-seen or seen fewer than 5 times, applying the rare-value
    baseline pattern of MITRE CAR-2014-11-002. A rare or novel install directory is a statistical outlier
    worth investigating for persistence; common, frequently used directories are more likely legitimate
    but should still be checked against the allowlist of trusted installers.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Staging Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'freq = count(sdb_parent_dir) over 90d from sdbinst.exe cmdlines

      for each sdbinst event: d = parent_dir(sdb_path)

      if freq[d] < 5 or first_seen(d): alert(host, d)'
- question: Is sdbinst.exe being launched by a rare or non-standard parent process — for example powershell.exe
    or cmd.exe rather than msiexec.exe or an approved patch agent?
  context: 'The lineage of sdbinst.exe is a strong discriminator: legitimate installs flow from installer/patch
    processes, while attacker installs are frequently spawned by interactive shells or scripting engines.
    Maintain a per-environment frequency baseline of sdbinst.exe parent processes and its invocation rate
    (count/min), and alert when the parent is rare (bottom 1st percentile) or non-standard. A shell- or
    script-spawned sdbinst.exe is a high-signal persistence indicator under the outlier-parent pattern
    of MITRE CAR-2014-11-002.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Staging Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "parent_freq = count(ParentImage) where Image=='sdbinst.exe' over baseline\nfor each sdbinst\
      \ event:\n  if percentile_rank(parent_freq[ParentImage]) < 1\n     or ParentImage in (powershell.exe,\
      \ cmd.exe, wscript.exe): alert"
- question: When unsupervised novelty detection is applied to sdbinst.exe events (user context, parent
    process, .sdb directory, time-of-day), do any executions fall into small/sparse clusters or land outside
    the learned boundary?
  context: Multi-feature anomalies in shim installs can be surfaced without labels. Apply Isolation Forest
    / DBSCAN / One-Class SVM over sdbinst.exe event features — user context, parent process, full .sdb
    directory, time-of-day — and investigate small/sparse clusters or out-of-boundary points, using LIME-style
    attribution to surface the top-3 deviating features. Outlier sdbinst.exe executions that combine an
    unusual user, parent, directory, and time are prime persistence candidates; the attribution explains
    which feature combination triggered the alert.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Staging Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: ML pipeline/pseudocode
    query: 'X = features(sdbinst events: user, parent, sdb_dir, hour)

      model = IsolationForest/DBSCAN/OneClassSVM.fit(X)

      for e in new events: if model.is_outlier(e): alert(e, top3=LIME(e))'
- question: Did a known shim-target process (services.exe, spoolsv.exe, explorer.exe, svchost.exe) spawn
    a C2-associated child (powershell.exe, rundll32.exe, cmd.exe) or load an unsigned/unusual DLL, and
    then make an outbound connection to a CTI-blocklisted IP?
  context: 'This correlation captures the payoff of a shim: injected code executing inside a trusted process.
    Correlate (1) a shim-target process starting; (2) within 60s it spawns a C2-associated child OR loads
    an unsigned/unusual DLL (Sysmon Event ID 7, the InjectDLL shim effect); (3) the child makes an outbound
    connection (Sysmon Event ID 3 / Zeek conn.log) to a CTI-blocklisted IP. The FIN7 case patched services.exe
    to inject a backdoor. A full chain match is high-confidence evidence of active shim-based persistence
    with C2; partial matches still merit investigation.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: User Workstations, Application Servers, Network Egress Points'
  range: 'Last 90 days (event-centered: 60s correlation window after shim-target launch)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "seq within 60s:\n  A: proc_create Image in (services.exe, spoolsv.exe, explorer.exe, svchost.exe)\n\
      \  B: child of A in (powershell.exe, rundll32.exe, cmd.exe)\n     OR module_load(EventID==7) unsigned/unusual\
      \ DLL into A\n  C: netconn (Sysmon EID3/Zeek conn) from B to dest in CTI_blocklist\n| join on ProcessGuid\
      \ | alert"
- question: For each shim-target process, are there bottom-1st-percentile rare child names or destination
    ASNs, anomalous bytes-out volume, or a burst of NXDOMAIN/failed connections coinciding with a shim
    event?
  context: Statistical baselining of a shim-target process's behavior reveals injected activity. Build
    a 30-day baseline of each shim-target process's child names, destination ASNs, and bytes-out from
    Zeek conn.log; alert on bottom-1st-percentile child/ASN. Separately track NXDOMAIN/failed-connection
    rates per process as a distinct series — a burst of NXDOMAIN or blocked egress alongside a shim event
    is high-signal — using per-host z-scores. Rare children/ASNs or failure spikes around shim activity
    strongly suggest a hijacked trusted process beaconing or resolving C2.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: User Workstations, Application Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline 30d per shim_target_proc: child_names, dest_ASN, bytes_out, nxdomain_rate\nfor events:\
      \ if pct_rank(child)<1 or pct_rank(ASN)<1\n            or zscore(bytes_out)>3 or zscore(nxdomain_rate)>3:\
      \ alert"
- question: When an LSTM autoencoder scores the event sequence immediately following the launch of a shim-target
    process, does the reconstruction error exceed the anomaly threshold?
  context: Sequence modeling captures abnormal behavior chains that simple rules miss. Train an LSTM autoencoder
    on event sequences (process creations, module loads, network, registry) immediately following the
    launch of shim-target processes, and flag high reconstruction error, outputting the top-3 reconstruction-error
    contributors in the alert. A high-error sequence after a trusted process starts indicates the process
    is behaving unlike its learned norm — consistent with shim-injected code executing for persistence;
    low error reflects normal post-launch behavior.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: User Workstations, Application Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: ML pipeline/pseudocode
    query: 'seqs = event_sequences after launch of shim_target_procs

      ae = LSTM_autoencoder.fit(normal seqs)

      for s in new seqs: err = ae.reconstruction_error(s)

      if err > threshold: alert(s, top3=err_contributors(s))'
- question: Does graph representation learning over the host provenance graph flag the shim-install plus
    post-shim-injection subgraph as anomalous?
  context: Provenance-graph analysis ties the entire shim-persistence chain together for root-cause triage.
    Construct a host provenance graph (process/file/registry/network nodes) and score the shim-install
    + post-shim-injection subgraph with graph representation learning — node-level GNN tracing (ThreaTrace),
    masked-graph self-supervised detection (MAGIC), or temporal-GNN with auto-reconstructed analyst-readable
    attack graphs (KAIROS) — surfacing the implicated nodes/edges. An anomalous subgraph linking the .sdb
    write, sdbinst.exe, registry change, and injected behavior is strong, explainable evidence of shim-based
    persistence.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: User Workstations, Application Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: ML pipeline/pseudocode
    query: 'G = provenance_graph(processes, files, registry, network)

      model = ThreaTrace/MAGIC/KAIROS.fit(G_benign)

      score = model.score_subgraph(shim_install + post_injection nodes)

      if score > threshold: alert(subgraph=implicated_nodes_edges)'
- question: Was the AppCompatFlags Custom or InstalledSDB registry key modified, or a file created in
    %WINDIR%\AppPatch\Custom*, by a process that is NOT on the allowlist of trusted installers/patch tools?
  context: These are the canonical shim registration artifacts. Alert on any modification to HKLM\SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\AppCompatFlags\Custom\ or ...\InstalledSDB\ (Sysmon Event ID 13 / Windows Event
    ID 4657) or file creation in %WINDIR%\AppPatch\Custom* (Sysmon Event ID 11) by a process not on an
    allowlist (sdbinst.exe launched by a trusted patch agent). An off-allowlist writer touching these
    keys/paths is a direct indicator of unauthorized shim persistence and should be triaged immediately.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'reg_set (EID13/4657) on ...\AppCompatFlags\Custom\* OR ...\InstalledSDB\*

      OR file_create (EID11) in %WINDIR%\AppPatch\Custom*

      | where WriterProcess not in allowlist(trusted_installers)

      | alert(host, WriterProcess, target)'
- question: Are shim registry/file modifications occurring outside normal patch/maintenance windows —
    more than 3 standard deviations from the host's baseline by hour-of-day and day-of-week?
  context: Timing is a strong discriminator between legitimate patching and covert shim installs. Baseline
    shim registry/file modification counts by hour-of-day and day-of-week per host, and alert on events
    exceeding 3 standard deviations from legitimate patch/install windows. A shim change at an unusual
    time (e.g., off-hours, outside change windows) is anomalous and consistent with an attacker establishing
    persistence; changes inside known maintenance windows are more likely benign but should be cross-checked
    with the allowlist.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = count(shim_mod) by host, hour_of_day, day_of_week

      for event: z = (count - mean[host,hod,dow]) / std[host,hod,dow]

      if z > 3: alert(host, event_time)'
- question: Does the Random Forest classifier score a shim file/registry modification as high-confidence
    'suspicious' based on parent process, user context, time-of-day, signing status, and correlated recent
    events?
  context: An explainable ensemble can weigh multiple weak signals into a confident verdict. Train a Random
    Forest to score shim file/registry modifications using parent process, user context, time-of-day,
    signing status, and correlated recent events; alert on high-confidence 'suspicious' and surface the
    top-3 feature importances. A high-confidence suspicious score on a shim modification — for example
    an unsigned shell parent at an odd hour alongside other recent anomalies — is strong evidence of unauthorized
    shim persistence, with the feature importances guiding triage.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML pipeline/pseudocode
    query: 'model = RandomForest.fit(features=[parent, user, hour, signed, recent_corr], labels)

      for mod in shim_modifications: p = model.predict_proba(features(mod))

      if p_suspicious > threshold: alert(mod, top3=model.feature_importances(mod))'
- question: Was a custom .sdb file created in a user-writable directory (%TEMP%, %APPDATA%, C:\Users\*,
    C:\Windows\Temp) that matches a YARA rule for shims targeting auto-elevating executables such as eventvwr.exe,
    fodhelper.exe, or msconfig.exe?
  context: UAC-bypass shims are dropped to user-writable locations and tuned to hook auto-elevating Microsoft
    binaries. Watch for .sdb (and .tmp-staged) file creation (Sysmon Event ID 11) in user-writable dirs
    and scan with YARA rules tuned for shims that target eventvwr.exe, fodhelper.exe, and msconfig.exe;
    the .tmp staging path is a FIN7 IOC. A YARA hit on such a file indicates an attempt to escalate privileges
    by abusing application shimming for UAC bypass — a Medium-integrity user preparing to gain High integrity.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'file_create (EID11) where TargetFilename matches (?i)(c:\\users\\|\\temp\\|\\appdata\\|windows\\temp).*\.(sdb|tmp)

      | yara_scan(TargetFilename, rules=''uac_bypass_shim: eventvwr|fodhelper|msconfig'')

      | where yara_hit | alert'
- question: Does any .sdb in a user-writable directory have a file size and entropy within 2 standard
    deviations of a known UAC-bypass shim profile, or above the 95th-percentile benign entropy?
  context: Known UAC-bypass shims have characteristic size/entropy signatures. Profile file size and Shannon
    entropy of .sdb files in user-writable dirs and flag any within 2 standard deviations of a known UAC-bypass
    shim profile or above the 95th-percentile benign entropy. A file matching the bypass-shim profile
    or exhibiting packed-payload entropy is a statistical indicator of a privilege-escalation shim staged
    for execution; benign temp files should fall well within the normal entropy band.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for sdb in user_writable_dirs:\n  sz=filesize(sdb); ent=shannon_entropy(sdb)\n  if within_2std(sz,ent,\
      \ known_uac_shim_profile) or ent>percentile(benign,95): alert(sdb)"
- question: When the classifier scores .sdb files in user-writable directories using path, size, entropy,
    n-grams, and writer-process features, does it flag any as high-confidence malicious?
  context: A supervised classifier separates benign temp files from malicious UAC-bypass shims. Train
    a gradient-boosting / Random Forest model on file-path patterns, size, entropy, n-grams, and writer-process
    features; alert on high-confidence malicious and surface the top-3 contributing features. A high-confidence
    malicious verdict on a .sdb in %TEMP%/%APPDATA% indicates a probable privilege-escalation shim; the
    contributing features (e.g., entropy, writer process, suspicious n-grams) accelerate triage.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: ML pipeline/pseudocode
    query: 'model = GradientBoosting/RandomForest.fit(features=[path, size, entropy, ngrams, writer],
      labels)

      for sdb in user_writable_dirs: p=model.predict_proba(features(sdb))

      if p_malicious>0.90: alert(sdb, top3=model.explain(sdb))'
- question: Is there an anomalous spike in access-denied .sdb writes or failed sdbinst.exe elevations
    on a host, indicating a Medium-integrity adversary attempting a UAC-bypass shim?
  context: Failed elevation attempts leave detectable traces. Baseline access-denied .sdb writes (Event
    ID 4663 failed access) and failed sdbinst.exe elevations as a distinct count/min series, scoring spikes
    with per-host z-scores. A spike in blocked .sdb writes or failed elevations is high-signal for a Medium-integrity
    attacker trying to install a UAC-bypass shim; the absence of failures does not exclude a successful
    bypass, which the sequence and integrity detections cover.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = count_per_min(EID4663 denied .sdb write OR sdbinst.exe failed) by host

      z = (series - mean_host)/std_host

      if z > 3: alert(host, window)'
- question: Did sdbinst.exe execute and, within 10 seconds and under the same user/LogonId, an auto-elevating
    executable on the UAC-bypass watchlist (eventvwr.exe, msconfig.exe, fodhelper.exe, computerdefaults.exe)
    launch?
  context: The defining sequence of a shim-based UAC bypass is installing the shim then immediately triggering
    an auto-elevating binary. Trigger when sdbinst.exe is followed within 10s by a watchlisted auto-elevating
    executable sharing the same User and LogonId. This tight, same-session pairing strongly indicates
    an active privilege-escalation attempt via application shimming; investigate the .sdb installed and
    the subsequent High-integrity child processes.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Administrator Jump Boxes'
  range: 'Last 90 days (event-centered: 10s window after sdbinst.exe)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "seq within 10s same (User, LogonId):\n  A: proc_create Image endswith 'sdbinst.exe'\n  B:\
      \ proc_create Image in (eventvwr.exe, msconfig.exe, fodhelper.exe, computerdefaults.exe)\n| alert(host,\
      \ user, A, B)"
- question: Does the process transition sdbinst.exe -> auto-elevating-executable within a 10-second window
    fall in the bottom 0.1% of observed sequential process pairs over the last 30 days?
  context: Rare process transitions expose attack sequences statistically. Maintain transition probabilities
    for sequential process pairs within a 10s window over 30 days and alert when sdbinst.exe -> auto-elevating-exe
    falls in the bottom 0.1%, combining rare-pair baselining (MITRE CAR-2014-11-002) with multi-order
    Markov transition modeling. An ultra-rare transition into an auto-elevating binary right after a shim
    install is a high-signal privilege-escalation indicator; common transitions reflect normal usage.
