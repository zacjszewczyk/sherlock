name: 'T1218.015: System Binary Proxy Execution: Electron Applications'
id: 12cd4f2c-f8fd-46f5-a9ba-50259becd363
description: 'Investigate potential abuse of the Electron application framework for System Binary Proxy
  Execution (T1218.015). Adversaries leverage trusted, signed Electron apps such as Microsoft Teams, Slack,
  Discord, Visual Studio Code, Signal, and Chrome to execute malicious code while blending in with legitimate
  activity. This playbook helps an analyst hunt for: (1) Electron processes establishing network connections
  to threat-intel-flagged or rare/never-before-seen destinations; (2) Electron apps launched with high-risk
  command-line switches that disable security features, enable remote debugging, redirect traffic, or
  launch arbitrary executables (e.g., --no-sandbox, --inspect, --remote-debugging-port, --gpu-launcher,
  --disable-gpu-sandbox, --host-rules); (3) Electron apps spawning command-line interpreters or scripting
  engines (cmd, powershell, bash, sh, python, osascript, curl) as children; (4) anomalous Electron network
  traffic (non-standard ports, large outbound volume, rare domains, elevated failure/NXDOMAIN rates);
  and (5) modification of packaged app resources (app.asar, packaged JS/HTML) or child commands referencing
  those resources. It correlates process-creation telemetry (Windows Event ID 4688, Sysmon 1, auditd execve,
  macOS unified log) with network telemetry (Sysmon 3, Zeek conn.log/dns.log) and file-integrity telemetry
  (Sysmon 11, osquery) across Windows, Linux, and macOS, supporting the information requirement: is the
  adversary using Electron applications to evade defenses?'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any Electron application process (e.g., teams.exe, slack.exe, code.exe) establish a network
    connection to a destination IP or domain that appears on a high-confidence threat intelligence feed?
  context: Supports the Stealth tactic (TA0005) by detecting C2/exfil hidden behind a trusted, signed
    Electron binary. Attribute network flows to the responsible Electron process by correlating Windows
    Event ID 4688 process-creation records (command line, parent process, user) with Sysmon Event ID 3
    network-connection events, then join to Zeek conn.log/dns.log for destination, timing, volume, and
    reputation. Alert whenever the resolved destination IP or domain matches a high-confidence threat-intel
    feed. Per CISA/NSA Living-off-the-Land guidance, require contextual correlation (process+file+network)
    so a signed Electron binary is never implicitly trusted. A positive match against curated indicators
    is high fidelity; a negative result still warrants the rarity and ML checks below.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint devices, Domain Name System (DNS) resolvers, Network egress points/firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join (EventCode=4688 OR Sysmon EventID=1 image IN electron_apps) AS p\n  with (Sysmon EventID=3)\
      \ AS n on p.process_guid = n.process_guid\n| join Zeek conn.log/dns.log on n.dest_ip/n.query\n|\
      \ where dest_ip in threatintel_high_confidence OR dest_domain in threatintel_high_confidence\n|\
      \ emit alert(host, user, electron_image, cmdline, dest, ti_source)"
- question: Did an Electron application contact a destination that is statistically rare or never-before-seen
    across the enterprise, including domains with high lexical entropy or elevated NXDOMAIN/blocked-connection
    rates?
  context: Supports Stealth (TA0005) by surfacing low-prevalence C2/exfil destinations even when no threat-intel
    match exists. Build rolling 30-day host, user, and enterprise baselines of destinations contacted
    by each Electron app, then alert on destinations whose enterprise prevalence falls below ~0.1% (derive
    the exact cutoff per environment from the destination-prevalence distribution). Add DNS lexical entropy
    / character-count scoring and explicitly track NXDOMAIN and blocked-connection rates (per Nadler et
    al.) so failed resolutions and blocked attempts surface as distinct exfil/C2 indicators. A rare destination
    with high entropy and failed lookups is a strong lead; common destinations are expected noise.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint devices, Domain Name System (DNS) resolvers, Network egress points/firewalls'
  range: Last 90 days (rolling 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = stats count by electron_app, dest over last 30d\n| eval enterprise_prevalence =\
      \ endpoints_seen(dest)/total_endpoints\n| eval entropy = shannon(dest_domain)\n| where enterprise_prevalence\
      \ < 0.001 OR entropy > threshold\n       OR nxdomain_rate high OR blocked_rate high\n| emit alert(host,\
      \ electron_app, dest, prevalence, entropy, nxdomain_rate)"
- question: Do machine-learning models classify any Electron application network connection as malicious
    with high confidence based on Zeek flow and domain features?
  context: Supports Stealth (TA0005) by catching novel C2/exfil that evades static rules. Train an XGBoost/logistic-regression
    classifier on benign and known-malicious Zeek features (destination port, protocol, duration, orig_bytes,
    resp_bytes, byte ratio, domain entropy, domain age) and alert on Electron-app connections classified
    malicious with confidence >0.9; run an Isolation Forest as an unsupervised parallel baseline. Surface
    the top-3 contributing features (e.g., rare destination, high resp_bytes, high domain entropy) in
    the alert for explainability and triage. High-confidence classifications warrant immediate review;
    low scores reduce but do not eliminate suspicion.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint devices, Domain Name System (DNS) resolvers, Network egress points/firewalls'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = zeek_flow_features(electron_conns)  # port,proto,duration,orig_bytes,resp_bytes,ratio,domain_entropy,domain_age

      score = xgboost_model.predict_proba(features)

      iso = isolation_forest.score(features)

      | where score.malicious > 0.9 OR iso anomalous

      | emit alert(host, electron_app, dest, score, top3_features)'
- question: Was any Electron application launched with high-risk command-line switches that disable security
    sandboxing, enable remote debugging, redirect traffic, or launch arbitrary executables (e.g., --no-sandbox,
    --inspect, --inspect-brk, --remote-debugging-port, --gpu-launcher, --disable-gpu-sandbox, --host-rules)?
  context: Supports Stealth (TA0005) by detecting proxy execution and sandbox-evasion through legitimate
    Electron switches. Parse Windows Event ID 4688 / Sysmon Event ID 1 / auditd execve command lines for
    known Electron image names and alert on high-risk switches enumerated in the authoritative Electron
    Command Line Switches reference. These deviate from the secure baseline in the Electron Security Guidelines
    and overlap with SigmaHQ proxy-execution rules. The --gpu-launcher and --disable-gpu-sandbox combination
    is especially dangerous because it can launch an arbitrary executable as a child of the trusted app.
    Any of these switches on a production or user workstation (versus a developer machine) is a strong
    lead.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd execve
  - 'NAI: Endpoint devices, Developer workstations, Production servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search (EventCode=4688 OR Sysmon EventID=1 OR auditd execve)

      | where image in electron_apps

      | where cmdline matches /(--inspect(-brk)?|--remote-debugging-port|--gpu-launcher|--disable-gpu-sandbox|--no-sandbox|--host-rules)/

      | emit alert(host, user, image, cmdline, parent_image)'
- question: Did an Electron application run with a rare or anomalous combination of command-line arguments
    compared to its historical usage, or exhibit bursts of debug/sandbox-disabling launches?
  context: Supports Stealth (TA0005) by flagging unusual invocations even when individual switches are
    not on the blocklist. Maintain a 30-day frequency distribution of full argument vectors per Electron
    application and alert when a new combination falls in the bottom 1st percentile of historical usage;
    rank rarity with BM25/log-entropy IR scoring (per SCADE). Track the frequency (count/min) of switch
    usage per host so bursts of debug/sandbox-disable launches are flagged, and record launches that immediately
    crash/exit as a distinct failure signal. Rare argument vectors plus high launch frequency suggest
    scripted abuse rather than normal user behavior.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd execve
  - 'NAI: Endpoint devices, Developer workstations, Production servers'
  range: Last 90 days (rolling 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = freq_dist(arg_vector) by electron_app over 30d

      | eval rarity = bm25_logentropy(arg_vector)

      | where percentile(arg_vector) < 1 OR rarity high

      | eval launch_rate = count/min by host, electron_app

      | where launch_rate burst OR immediate_exit

      | emit alert(host, electron_app, arg_vector, rarity, launch_rate)'
- question: Do anomaly-detection models flag any Electron command line as an outlier based on token/embedding
    representations of the full argument string?
  context: Supports Stealth (TA0005) by detecting obfuscated or atypical Electron invocations that static
    regex misses. Vectorize full Electron command lines (TF-IDF or BERT-style embeddings per CrowdStrike)
    and score with an Isolation Forest / One-Class SVM trained on benign launches; complement with an
    ELECTRA-style obfuscation detector (Tran et al.). Alert on outliers and list the top-3 tokens/switches
    driving the score in the alert text for analyst triage. Outliers with obfuscation indicators are high-value
    leads; the explainability output helps distinguish benign rare usage from malicious abuse.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd execve
  - 'NAI: Endpoint devices, Developer workstations, Production servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'vec = tfidf_or_bert(electron_cmdline)

      score = isolation_forest_or_ocsvm.score(vec)

      obf = electra_obfuscation_detector(electron_cmdline)

      | where score outlier OR obf high

      | emit alert(host, electron_app, cmdline, score, top3_tokens)'
- question: Did a known Electron application (e.g., slack.exe, teams.exe, discord.exe, code.exe) spawn
    a direct child that is a command-line interpreter or scripting engine (cmd.exe, powershell.exe, pwsh.exe,
    wscript.exe, cscript.exe, bash, sh, python, osascript, curl)?
  context: 'Supports Stealth (TA0005) by detecting proxy execution where a trusted Electron parent launches
    a shell or interpreter. Alert when known Electron parents spawn interpreter children across Windows
    Event ID 4688 / Sysmon 1 / auditd execve / macOS unified log — the Electron-parent generalization
    of SigmaHQ ''Unusual Parent Process For Cmd.EXE''. This deviates from the no-shell-spawn baseline
    of the Electron Security Guidelines. Most Electron apps have no legitimate reason to spawn interpreters
    at runtime (notable exceptions: VS Code integrated terminal), so tune for context. A Teams/Slack/Discord
    parent spawning powershell or cmd is a strong indicator of abuse.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd execve
  - macos:unifiedlog
  - 'NAI: Endpoint devices, Application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search (EventCode=4688 OR Sysmon EventID=1 OR auditd execve OR macos:unifiedlog)

      | where parent_image in (teams.exe, slack.exe, discord.exe, code.exe, ...electron_apps)

      | where child_image in (cmd.exe, powershell.exe, pwsh.exe, wscript.exe, cscript.exe, bash, sh, python,
      osascript, curl)

      | emit alert(host, user, parent_image, child_image, child_cmdline)'
- question: Did an Electron application spawn a newly observed or rarely seen child process image, or
    a parent-child pair whose frequency has dropped sharply, including bursts of spawns?
  context: Supports Stealth (TA0005) by catching novel lineage even when the child is not a classic interpreter.
    Track 30-day frequencies of Electron parent->child image pairs (per host and enterprise) and alert
    on newly observed pairs or pairs whose frequency drops below the 1st percentile; record count/min
    spawn rate so bursts are flagged. Derive cutoffs from the per-app pair-frequency distribution, and
    treat child processes that exit non-zero (failed execution) as a separate indicator. A never-before-seen
    Electron->child pair on a single host, especially in a burst, suggests scripted post-exploitation.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd execve
  - macos:unifiedlog
  - 'NAI: Endpoint devices, Application servers'
  range: Last 90 days (rolling 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = freq(parent_image -> child_image) by host, enterprise over 30d

      | where pair is new OR pair_percentile < 1

      | eval spawn_rate = count/min

      | where spawn_rate burst OR child_exit_code != 0

      | emit alert(host, parent_image, child_image, freq, spawn_rate)'
- question: Do graph-based anomaly models flag an anomalous Electron->shell->network process lineage indicative
    of proxy execution and follow-on C2?
  context: Supports Stealth (TA0005) by reconstructing multi-stage abuse chains. Represent process lineage
    as a provenance graph and detect anomalous Electron->shell->network chains with a graph temporal autoencoder
    (per KAIROS), which also reconstructs the attack path for triage; community/centrality scoring can
    flag low-weight edges linking Electron apps to interpreter nodes. Surface the top-3 anomalous nodes/edges
    (parent, child image, destination) in the alert. High anomaly scores on a connected Electron->interpreter->external-destination
    chain are strong, triage-ready leads.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd execve
  - macos:unifiedlog
  - 'NAI: Endpoint devices, Application servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "graph = build_provenance_graph(process_events)\nscore = graph_temporal_autoencoder.reconstruct_error(graph)\n\
      | where chain electron_app -> shell -> network_node has high error\n       OR low_weight_edge(electron_app,\
      \ interpreter)\n| emit alert(host, path=electron->child->dest, top3_nodes_edges, score)"
- question: Did an Electron application connect to a non-standard port outside its expected allowlist
    (typically not 80/443), and were there blocked/reset connections associated with it?
  context: Supports Stealth (TA0005) by detecting C2 over unusual ports behind a trusted app. Attribute
    ports/protocols to Electron apps by correlating Event ID 4688 with Sysmon Event ID 3 / Zeek conn.log
    and alert when a connection targets a port outside the app's allowlist. Maintain the allowlist explicitly
    and treat blocked/reset connections as a distinct signal, consistent with SigmaHQ egress rules. Legitimate
    Electron apps almost exclusively use 443 (and some 80); connections to arbitrary high ports, especially
    blocked at the egress firewall, are strong C2 indicators.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, Domain Name System (DNS) resolvers, Endpoint devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join (EventCode=4688) with (Sysmon EventID=3 OR Zeek conn.log) on process_guid

      | where image in electron_apps

      | where dest_port not in app_allowlist(image)  # typically not 80/443

      | eval blocked = conn_state in (REJ, RSTO, S0)

      | emit alert(host, image, dest_ip, dest_port, blocked)'
- question: Did an Electron application transfer an unusually large outbound volume, exhibit burst connection
    frequency, or query rare/high-entropy domains with elevated NXDOMAIN/SERVFAIL/blocked rates?
  context: Supports Stealth (TA0005) by detecting exfiltration and beaconing via statistical baselining.
    Baseline per-Electron-app orig_bytes, resp_bytes, byte ratio, and duration over 30 days and alert
    above the 99th percentile (Volume); baseline connection frequency (count/min) and flag bursts (Frequency);
    flag DNS lookups for domains queried by <1% of endpoints with high lexical entropy, and profile NXDOMAIN/SERVFAIL
    and blocked-connection rates (State/failure) per Nadler et al. Derive percentiles per environment.
    Large off-baseline outbound volume from a chat/IDE app, or beacon-like periodic bursts to a rare domain,
    are strong exfil/C2 leads.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, Domain Name System (DNS) resolvers, Endpoint devices'
  range: Last 90 days (rolling 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = stats p99(orig_bytes,resp_bytes,byte_ratio,duration) by electron_app over 30d

      | where orig_bytes > p99 OR resp_bytes > p99

      | eval conn_rate = count/min ; where conn_rate burst

      | where dns_domain prevalence < 1% AND entropy high

      | eval failure = nxdomain_rate|servfail_rate|blocked_rate high

      | emit alert(host, electron_app, dest, bytes, conn_rate, failure)'
- question: Does a time-series forecast of an Electron application's outbound byte volume indicate an
    anomalous spike exceeding the predicted interval, consistent with data exfiltration?
  context: Supports Stealth (TA0005) by detecting exfil that exceeds learned normal volume. Model per-host/per-app
    outbound bytes time series (Zeek orig_bytes) with SARIMA/Prophet and alert when observed volume exceeds
    the prediction interval; complement with online autoencoder-ensemble flow anomaly scoring (per Kitsune)
    and an Isolation Forest baseline. Report the top-3 drivers (e.g., observed-vs-expected bytes, rare
    destination, off-hours timing) in the alert. A sustained or large deviation above the forecast interval,
    especially off-hours to a rare destination, is a high-value exfil lead.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, Domain Name System (DNS) resolvers, Endpoint devices'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'ts = outbound_bytes_series(host, electron_app)  # Zeek orig_bytes

      pred = sarima_or_prophet.forecast(ts)

      | where observed > pred.upper_interval

      | union kitsune_autoencoder_anomaly, isolation_forest_baseline

      | emit alert(host, electron_app, observed_vs_expected, top3_drivers)'
- question: Did a child process (or the Electron app itself) execute with command-line arguments referencing
    the app's core resource files (app.asar, packaged .js/.html), or was the app.asar bundle / config
    JS modified on disk?
  context: Supports Stealth (TA0005) by detecting tampering with packaged Electron resources to plant
    malicious JavaScript. Inspect Event ID 4688 / auditd execve child command lines for paths containing
    the parent Electron name and sensitive resources (app.asar, .js, .html) via regex, and alert on writes/modifications
    to app.asar or packaged JS via Sysmon Event ID 11 / osquery file events. Any modification of packaged
    resources violates the ASAR-integrity baseline in the Electron Security Guidelines. Unexpected writes
    to app.asar outside of a known installer/update event are a strong persistence/code-injection indicator.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - macos:osquery
  - auditd execve
  - 'NAI: Endpoint devices with installed Electron applications'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "search (EventCode=4688 OR auditd execve) | where cmdline matches /(app\\.asar|\\.js|\\.html)/\
      \ AND path contains electron_app_dir\nOR search (Sysmon EventID=11 OR macos:osquery file_events)\n\
      \  | where target_file matches /app\\.asar$/ OR packaged_js AND action in (write, modify)\n| emit\
      \ alert(host, electron_app, file, action, actor_process)"
- question: Do child-process command-line arguments associated with Electron apps show abnormally high
    Shannon entropy or rare tokens indicative of obfuscation or injection?
  context: Supports Stealth (TA0005) by detecting obfuscated payloads delivered via Electron resource
    references. Compute Shannon entropy of child-process arguments, baseline legitimate values per app,
    and alert above the 98th percentile (indicating obfuscation/injection) as in Elastic High Command
    Line Entropy; rank rare tokens with BM25/log-entropy IR scoring (per SCADE). Track frequency of resource-referencing
    commands and flag execution failures as a separate signal. High-entropy argument strings referencing
    app resources, especially rare and failing, point to injected or obfuscated code.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - macos:osquery
  - auditd execve
  - 'NAI: Endpoint devices with installed Electron applications'
  range: Last 90 days (rolling 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = entropy(child_args) by electron_app over 30d

      | eval ent = shannon(child_args)

      | where ent > p98 OR bm25_logentropy(tokens) high

      | eval res_ref_rate = freq(resource_referencing_cmds)

      | where res_ref_rate anomalous OR exec_failed

      | emit alert(host, electron_app, child_args, ent, rare_tokens)'
- question: Do sequence-anomaly models flag an unusual sequence of Electron command-line arguments or
    command/file combinations consistent with resource modification or injection?
  context: Supports Stealth (TA0005) by detecting atypical command/resource sequences that point to app.asar
    tampering or JS injection. Train an LSTM autoencoder on benign sequences of Electron command-line
    arguments and alert on high reconstruction error for odd command/file combinations; complement with
    an obfuscation classifier (Tran et al.) and feature-importance-based detection (Mandiant). Surface
    the top-3 contributing tokens/sequence steps in the alert. High reconstruction error on a command
    sequence touching packaged resources is a strong, explainable lead for analyst triage.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - macos:osquery
  - auditd execve
  - 'NAI: Endpoint devices with installed Electron applications'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = tokenize(electron_cmdline_sequence)

      err = lstm_autoencoder.reconstruction_error(seq)

      obf = obfuscation_classifier(electron_cmdline)

      | where err high (odd command/file combo) OR obf high

      | emit alert(host, electron_app, seq, err, top3_tokens_steps)'
