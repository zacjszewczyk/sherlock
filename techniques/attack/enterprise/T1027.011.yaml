name: 'T1027.011: Obfuscated Files or Information: Fileless Storage'
id: a2e6096d-2480-41c8-bc2e-9a2fb24a8ce1
description: 'Hunt for adversary use of fileless storage to conceal payloads, scripts, collected data,
  and persistence artifacts in non-file formats. On Windows this covers oversized or high-entropy blobs
  written to the Registry, WMI class properties, PowerShell script blocks, and custom event-log entries,
  as well as creation of permanent WMI event consumers and direct tampering with the on-disk Registry
  hive and WMI repository backing files. On Linux it covers payloads written to or executed from shared-memory
  directories (/dev/shm, /run/shm, /var/run, /var/lock) and memfd-backed execution, plus the network behavior
  that follows such staging: rare-domain script downloads, low-jitter C2 beaconing, and outbound data-transfer
  spikes. The playbook combines signature/symbolic-logic floor rules, statistical baselining (entropy,
  length, volume, frequency, and failure-mode signals), and machine-learning models so an analyst can
  detect, scope, and confirm fileless storage abuse across endpoint and network telemetry.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
