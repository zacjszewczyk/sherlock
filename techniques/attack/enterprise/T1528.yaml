name: 'T1528: Steal Application Access Token'
id: 8cd24dd8-5178-40ca-bf44-22776375b8ea
description: 'Investigate the potential theft and abuse of application access tokens (OAuth tokens, refresh
  tokens, cloud instance-metadata tokens, Kubernetes service-account tokens, and stored API credentials)
  used to make authorized API requests to cloud, SaaS, IaaS, and containerized resources. This playbook
  helps an analyst hunt for: bearer tokens replayed from anomalous source IPs, ASNs, geolocations, or
  device contexts inconsistent with their historical use; hosts or processes that query the instance metadata
  service (169.254.169.254) or read local token stores such as ~/.aws/credentials, ~/.kube/config, browser
  profile storage, or container service-account paths; consent-phishing campaigns evidenced by bursts
  of OAuth consent grants to new or unverified applications requesting high-risk permissions; tokens tied
  to automation that are suddenly reused interactively with new infrastructure followed by atypical enumeration
  or data access; and IMDS access immediately followed by outbound connections suggesting credential theft
  and exfiltration. Detection combines symbolic-logic correlation rules, statistical baselining (modified
  Z-score, percentile, and time-series forecasting), and machine-learning anomaly detection to surface
  stolen-token use leading to privilege escalation and further compromise.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: 'Are any valid ''Authorization: Bearer'' tokens being presented from a source IP, ASN, or
    device context (User-Agent / TLS fingerprint) that the token has never used before, from a known anonymizing
    service (TOR/VPN/proxy), or without any preceding interactive authentication event?'
  context: In the Credential Access tactic, an adversary who has stolen an application access token will
    replay it from their own infrastructure. By joining Zeek HTTP requests with their source IPs from
    conn.log and comparing each bearer-token request origin against threat intelligence for malicious
    IPs, TOR exit nodes, VPN exits, and anonymous proxies, the analyst can detect tokens that appear from
    a new ASN/infrastructure source or device context never previously associated with that token, or
    that are presented without a preceding interactive sign-in. A positive result strongly indicates token
    theft and replay (a documented stolen-token signal in the Microsoft Token Theft Playbook); a negative
    result means the token use is consistent with its established baseline.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Internet gateways, API Gateways, Cloud Access Security Brokers (CASB), Web Application Firewalls
    (WAF), Cloud Provider Control Planes'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  http.log WHERE header CONTAINS \"Authorization: Bearer\"\n  | join conn.log ON uid TO\
      \ GET id.orig_h, id.orig_p\n  | enrich id.orig_h WITH threat_intel(tor_exit, vpn_exit, anon_proxy,\
      \ malicious_ip), asn, geo\n  | lookup token_baseline BY token_id\n  | WHERE asn NOT IN token_baseline.asn\
      \ OR user_agent NOT IN token_baseline.ua\n        OR threat_intel.match = true OR preceding_interactive_auth\
      \ = false\n  | ALERT"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=cloudtrail OR index=azureactivity bearer_token=*\n  | lookup token_history token_id\
      \ OUTPUT known_asns known_uas\n  | where NOT match(src_asn, known_asns) OR NOT match(user_agent,\
      \ known_uas)\n        OR anon_service(src_ip)=true OR interactive_auth_seen=false\n  | table _time\
      \ token_id src_ip src_asn user_agent endpoint"
- question: Does the source geolocation, ASN, or User-Agent for a token/application session deviate sharply
    from its 30-day baseline, fall in the bottom 5th percentile of historical source frequency, or imply
    impossible travel (velocity > 900 km/h) between consecutive uses?
  context: This statistical approach builds a 30-day baseline of source geolocation, ASN, and User-Agent
    per token or application session and applies a robust modified Z-score (|0.6745*(x-median)/MAD| >
    3.5) so that batch automation traffic does not distort thresholds. Flagging requests in the bottom
    5th percentile of historical source frequency, plus impossible travel between consecutive uses and
    activity from infrequent-country or anonymous IPs, surfaces stolen tokens being used from adversary
    infrastructure. For Credential Access, a large deviation indicates the token is no longer being used
    by its legitimate owner; a result within baseline indicates normal operation.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Internet gateways, API Gateways, Cloud Access Security Brokers (CASB), Web Application Firewalls
    (WAF), Cloud Provider Control Planes'
  range: Last 90 days; baseline 30 days, event-centered comparison of consecutive token uses
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  stats over 30d: median(src_freq), MAD(src_freq) BY token_id, source_context(geo,asn,ua)\n\
      \  | eval mz = abs(0.6745*(src_freq - median)/MAD)\n  | eval pct = percentile_rank(src_freq within\
      \ token_id)\n  | eval velocity = geo_distance(prev_geo,cur_geo)/hours_between(prev_t,cur_t)\n  |\
      \ WHERE mz > 3.5 OR pct < 5 OR velocity > 900 OR anon_ip(src_ip)=true\n  | ALERT"
- question: Is any single token generating a burst of HTTP 401/403 authorization-failure responses at
    the API gateway or WAF (e.g., >10/min or 3x its baseline), consistent with a stolen token probing
    endpoints it lacks scope for?
  context: A stolen token used to probe endpoints it lacks scope for produces authorization-failure bursts
    that are distinct from normal automation patterns. This symbolic-logic rule tracks per-token state
    by counting HTTP 401/403 responses per minute at the API gateway or WAF and alerts when the count
    exceeds a tuned floor (for example >10/min or 3x the token's baseline). In the Credential Access context,
    this reveals an adversary enumerating their access with a token whose true permission set they do
    not yet know. A positive result indicates active scope-probing with a possibly stolen token; a negative
    result indicates the token is operating within its expected authorization envelope.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Internet gateways, API Gateways, Cloud Access Security Brokers (CASB), Web Application Firewalls
    (WAF), Cloud Provider Control Planes'
  range: Last 90 days; sliding 1-minute windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=apigw status IN (401,403)\n  | bin _time span=1m\n  | stats count AS failures\
      \ BY token_id, _time\n  | lookup token_baseline token_id OUTPUT base_fail_rate\n  | where failures\
      \ > 10 OR failures > 3*base_fail_rate\n  | ALERT token_id failures _time"
- question: When token-use feature vectors (source ASN, User-Agent, endpoint set, request volume/bytes,
    hour-of-day, 4xx ratio) are scored with an Isolation Forest or UEBA model, which requests are statistical
    outliers indicative of stolen-token replay, and what are the top-3 contributing features?
  context: This machine-learning method trains an Isolation Forest (or uses built-in UEBA anomalies) on
    token-use feature vectors comprising source ASN, User-Agent, endpoint set, request volume/bytes, hour-of-day,
    and 4xx ratio. High-scoring requests are escalated, and the alert surfaces the top-3 contributing
    features such as a new ASN, an elevated 403 ratio, or off-hours access. For Credential Access, this
    catches subtle stolen-token replay that does not trip any single static rule by combining many weak
    signals into a single anomaly score. A high anomaly score with explanatory features warrants investigation
    of token theft; a low score indicates benign use.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: Internet gateways, API Gateways, Cloud Access Security Brokers (CASB), Web Application Firewalls
    (WAF), Cloud Provider Control Planes'
  range: Last 90 days; retrain monthly
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [src_asn, user_agent, endpoint_set, req_volume, bytes, hour_of_day, ratio_4xx]\n\
      \  model = IsolationForest(n_estimators=200, contamination='auto').fit(history)\n  score = model.decision_function(live_token_events)\n\
      \  WHERE score in top anomalies:\n      explain = top3_shap(features)\n      ALERT(token_id, score,\
      \ explain)"
- question: Has any non-allowlisted process executed a command line or read a file referencing 169.254.169.254,
    ~/.aws/credentials, ~/.kube/config, browser token stores, or /var/run/secrets/kubernetes.io/serviceaccount?
  context: This symbolic-logic detection monitors process creation (Windows Event ID 4688 / Sysmon Event
    ID 1) and file access (Sysmon Event ID 11) for command lines or reads referencing the instance metadata
    endpoint (169.254.169.254), cloud credential files (~/.aws/credentials), Kubernetes config (~/.kube/config),
    browser token stores, or container service-account token paths. It alerts when a process not on the
    allowlist touches those locations or contacts IMDS, using runtime rules equivalent to Falco defaults.
    In the Credential Access tactic, this directly catches the act of harvesting tokens from local stores
    or the metadata service. A positive result indicates a process attempting to steal cloud/container
    credentials; a negative result means only known agents accessed those sensitive paths.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek conn.log
  - 'NAI: IaaS virtual machines (e.g., Azure VMs, EC2 instances), container hosts, CI/CD pipeline runners,
    developer workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (EventID=4688 OR Sysmon=1 OR Sysmon=11)\n  | eval target = coalesce(CommandLine, TargetFilename)\n\
      \  | where match(target, \"169\\.254\\.169\\.254|\\.aws/credentials|\\.kube/config|serviceaccount|browser_token_store\"\
      )\n  | lookup process_allowlist Image OUTPUT allowed\n  | where allowed != true\n  | ALERT host\
      \ Image target User"
- question: On each host, which processes are reading token stores or accessing IMDS for the FIRST time,
    deviating from the established per-process daily-frequency profile?
  context: This statistical method profiles which processes normally read token stores or access IMDS
    on each host (frequency per process per day) and alerts on first-seen readers using robust modified
    Z-score thresholds. Behavioral IMDS baselining of this kind has surfaced zero-day SSRF token theft.
    First-seen token access is treated as high risk unless it matches a known managed cloud agent. For
    Credential Access, a brand-new process touching credential material is a strong theft signal because
    legitimate access typically comes from a stable, small set of agents. A first-seen reader warrants
    investigation; a recurring known reader is expected behavior.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek conn.log
  - 'NAI: IaaS virtual machines (e.g., Azure VMs, EC2 instances), container hosts, CI/CD pipeline runners,
    developer workstations'
  range: Last 90 days; baseline 30 days per host/process
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  stats earliest(_time) AS first_seen count BY host, Image, access_type(imds|token_store)\n\
      \  | eval is_first_seen = (first_seen >= now()-24h)\n  | join managed_agent_list ON Image\n  | where\
      \ is_first_seen=true AND managed_agent != true\n  | ALERT host Image access_type"
- question: Within token-access sequences, are there chains where a process reads a token store or accesses
    IMDS and is immediately followed by an outbound connection (high reconstruction-error sequences),
    indicating theft and use?
  context: This machine-learning approach uses an Isolation Forest or autoencoder over sequence features
    (process name, file-access path, time-delta to first outbound connection, bytes sent) to identify
    token access immediately followed by cloud or external activity. Chains with high reconstruction error
    are scored as likely theft, and the alert lists the top-3 features driving the score; detections can
    be validated with emulated token theft from Stratus Red Team. In the Credential Access context, the
    tight coupling of token harvesting and subsequent network use is the hallmark of an active theft-and-abuse
    chain. A high-error chain indicates probable token theft; a low-error chain reflects routine local
    credential use.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek conn.log
  - 'NAI: IaaS virtual machines (e.g., Azure VMs, EC2 instances), container hosts, CI/CD pipeline runners,
    developer workstations'
  range: Last 90 days; retrain monthly
  queries:
  - technology: ML/pseudocode
    query: ">-\n  seq_features = [process_name, file_access_path, time_delta_to_first_outbound, bytes_sent]\n\
      \  model = IsolationForest().fit(history)  # or autoencoder reconstruction error\n  score = model.score(token_access_sequences)\n\
      \  WHERE high_reconstruction_error(score):\n      ALERT(host, process, top3_features(score))"
- question: Has consent been granted to any OAuth application requesting high-risk delegated or application
    permissions (e.g., Mail.ReadWrite, Directory.ReadWrite.All, full_access_as_user, files.read.all),
    especially apps from unverified publishers or with unusual reply URLs?
  context: This symbolic-logic detection maintains a watchlist of OAuth apps requesting high-risk delegated/application
    permissions and alerts whenever consent is granted, with heightened scrutiny for apps from unverified
    publishers or with unusual reply URLs. For Credential Access via consent phishing, an adversary registers
    a malicious app and entices users to grant it powerful, long-lived access to mail, files, and directory
    data. A positive result indicates a potentially malicious consent grant requiring review and possible
    revocation; a negative result indicates no high-risk consents were issued.
  answer_sources:
  - Azure Activity Logs
  - Google Workspace audit logs
  - AWS CloudTrail logs
  - 'NAI: Identity and Access Management (IAM) systems (e.g., Azure AD, Okta), SaaS application administration
    portals, network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=azureactivity OR index=gworkspace OR index=cloudtrail operation=\"Consent to application\"\
      \ OR operation=\"oauth_grant\"\n  | where any_in(scopes, [\"Mail.ReadWrite\",\"Directory.ReadWrite.All\"\
      ,\"full_access_as_user\",\"files.read.all\"])\n  | eval risky = (publisher_verified=false OR unusual_reply_url=true)\n\
      \  | ALERT app_id app_name user scopes risky"
- question: For each newly registered OAuth app, do consent grants per hour in the first 24 hours exceed
    the 99th percentile of comparable new apps, or does the publisher domain show high name entropy suggesting
    auto-generation?
  context: This statistical method computes, for each new OAuth app, consent grants per hour during the
    first 24 hours and flags values above the 99th percentile of comparable new apps using a robust modified
    Z-score so that a few legitimate rollouts do not skew the bound. It also flags publisher domains whose
    name entropy suggests auto-generation. In the Credential Access tactic, a rapid burst of consents
    to a brand-new app is the signature of a consent-phishing campaign spreading across users. An above-threshold
    burst or high-entropy publisher warrants investigation; normal slow-ramp adoption does not.
  answer_sources:
  - Azure Activity Logs
  - Google Workspace audit logs
  - AWS CloudTrail logs
  - 'NAI: Identity and Access Management (IAM) systems (e.g., Azure AD, Okta), SaaS application administration
    portals, network egress points'
  range: Last 90 days; first 24 hours per new app
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  newapps = apps WHERE first_consent >= now()-24h\n  | stats count AS grants_per_hour\
      \ BY app_id, bin(_time,1h)\n  | eventstats p99(grants_per_hour) AS thr median MAD over comparable_new_apps\n\
      \  | eval mz = abs(0.6745*(grants_per_hour-median)/MAD)\n  | eval pub_entropy = shannon_entropy(publisher_domain)\n\
      \  | where grants_per_hour > thr OR mz > 3.5 OR pub_entropy > high\n  | ALERT app_id grants_per_hour\
      \ pub_entropy"
- question: Do observed OAuth consent-grant volumes per tenant/hour exceed the upper confidence interval
    of a time-series forecast, and do the involved apps score high on risk factors (permission level,
    community prevalence, publisher verification)?
  context: This machine-learning method forecasts expected consent-grant volume per tenant/hour with a
    Prophet-style time-series model and alerts when observed grants exceed the upper confidence interval,
    combining this with risky-OAuth-app scoring (permission level, community prevalence, publisher verification)
    that yields explainable risk factors. For Credential Access, this detects consent-phishing surges
    that deviate from the tenant's normal rhythm even when no single app crosses a static threshold. Observed
    volume above the forecast CI together with a high app-risk score indicates a probable campaign; volume
    within the forecast band reflects normal consent activity.
  answer_sources:
  - Azure Activity Logs
  - Google Workspace audit logs
  - AWS CloudTrail logs
  - 'NAI: Identity and Access Management (IAM) systems (e.g., Azure AD, Okta), SaaS application administration
    portals, network egress points'
  range: Last 90 days; hourly forecast horizon
  queries:
  - technology: ML/pseudocode
    query: ">-\n  model = Prophet().fit(consent_grants_per_tenant_hour_history)\n  fc = model.predict(next_hours)\n\
      \  WHERE observed > fc.yhat_upper:\n      app_risk = score(permission_level, community_prevalence,\
      \ publisher_verified)\n      ALERT(tenant, observed, fc.yhat_upper, app_risk_factors)"
- question: Is a token's implied travel velocity between consecutive uses physically impossible, or does
    its infrastructure (geo/ASN/User-Agent) change mid-session, indicating the token is being used from
    two locations at once?
  context: This symbolic-logic rule caches each token's last use (geo, ASN, User-Agent, timestamp) and
    computes implied travel velocity against the prior event, alerting when velocity is physically impossible
    or the infrastructure changes mid-session. For Credential Access, a token associated with a service
    or automation workflow that suddenly appears from a second, distant infrastructure means it is being
    shared between the legitimate workflow and an adversary. A positive result (impossible travel or mid-session
    infrastructure swap) is strong evidence of token theft; a negative result indicates consistent single-origin
    use.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: API Gateways, Cloud Service Provider (CSP) control planes, SaaS application backends, web application
    firewalls (WAF)'
  range: Last 90 days; consecutive-event correlation per token
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=cloudtrail OR index=zeek_http token_id=*\n  | sort token_id _time\n  | streamstats\
      \ current=f last(geo) AS prev_geo last(_time) AS prev_t last(asn) AS prev_asn BY token_id\n  | eval\
      \ velocity = geo_distance(prev_geo,geo)/hours_between(prev_t,_time)\n  | where velocity > 900 OR\
      \ (asn != prev_asn AND same_session=true)\n  | ALERT token_id velocity prev_geo geo"
- question: Compared to a 30-day baseline of API actions, source subnets, and User-Agents per token, are
    there first-seen API actions or source contexts, an implausible ordered API-call sequence, or a sudden
    shift from automated to interactive use?
  context: This statistical method establishes a 30-day baseline of API actions, source subnets, and User-Agents
    per token and reports API actions or source contexts not seen in the lookback window using first-seen
    baselining. It also scores whether the ordered API-call sequence is plausible for that client via
    variable-order Markov chains with Bayesian credible intervals, and flags a sudden shift from automation
    to interactive use. For Credential Access, an automation token that begins performing novel, human-like
    enumeration is a clear sign of misuse. First-seen actions, low-probability call sequences, or an automation-to-interactive
    shift warrant investigation; behavior matching the baseline does not.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: API Gateways, Cloud Service Provider (CSP) control planes, SaaS application backends, web application
    firewalls (WAF)'
  range: Last 90 days; baseline 30 days per token
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = stats values(api_action) values(src_subnet) values(user_agent) BY token_id\
      \ over 30d\n  | eval new_action = NOT in(api_action, baseline.api_action)\n  | eval new_ctx = NOT\
      \ in(src_subnet, baseline.src_subnet) OR NOT in(user_agent, baseline.user_agent)\n  | eval seq_prob\
      \ = vomm_markov_prob(api_call_sequence)\n  | eval mode_shift = (prior_mode=\"automation\" AND cur_mode=\"\
      interactive\")\n  | where new_action OR new_ctx OR seq_prob < credible_lower OR mode_shift\n  |\
      \ ALERT token_id"
- question: When principal-to-resource access is modeled as a graph (or token-use features are clustered),
    which anomalous edges or outliers correspond to a stolen token, and what are the top-3 contributing
    features (new subnet, new resource class, off-hours)?
  context: 'This machine-learning approach models principal-to-resource access as a heterogeneous/tripartite
    graph and scores anomalous edges created by a stolen token, or alternatively clusters token-use features
    with an Isolation Forest and investigates outliers, surfacing the top-3 contributing features such
    as a new subnet, new resource class, or off-hours access. For Credential Access, graph-based scoring
    captures relationships a flat rule misses: a token reaching resources its principal never normally
    touches. A high anomaly score on a newly created edge or an outlier cluster indicates probable interactive
    replay of a stolen token; an in-distribution edge reflects normal access.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - AWS CloudTrail logs
  - Azure Activity Logs
  - Google Cloud Audit Logs
  - 'NAI: API Gateways, Cloud Service Provider (CSP) control planes, SaaS application backends, web application
    firewalls (WAF)'
  range: Last 90 days; retrain monthly
  queries:
  - technology: ML/pseudocode
    query: ">-\n  G = build_graph(principal -> token -> resource)  # heterogeneous/tripartite\n  edge_scores\
      \ = gnn_anomaly(G)  # or IsolationForest on token_use_features\n  WHERE edge_scores in top anomalies:\n\
      \      ALERT(token_id, principal, resource, top3_features=[new_subnet,new_resource_class,off_hours])"
- question: Did a non-allowlisted process contact 169.254.169.254 and then, within 60 seconds, the same
    ProcessGUID (or a child process) initiate an outbound connection to a public IP over a non-standard
    port or protocol?
  context: 'This symbolic-logic rule is stateful: it triggers when a non-allowlisted process contacts
    the IMDS endpoint (169.254.169.254) and the same ProcessGUID makes an outbound connection to a public
    IP within 60 seconds, alerting when the follow-on connection is non-standard or not attributable to
    a managed cloud agent. For Credential Access, this captures the full theft-and-exfiltration chain:
    stealing a metadata token and immediately sending it (or stolen data) outbound. A positive result
    strongly indicates IMDS token theft followed by exfiltration; a negative result means IMDS access
    was not followed by suspicious egress.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Cloud virtual machines (IaaS), container runtime environments, network traffic logs at the virtual
    network (VNet/VPC) level'
  range: Last 90 days; 60-second correlation window
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (EventID=4688 OR Sysmon=1 OR Sysmon=3)\n  | where DestinationIp=\"169.254.169.254\"\n\
      \  | join ProcessGuid [ search Sysmon=3 DestinationIp=public\n        | eval delta = egress_time\
      \ - imds_time | where delta <= 60 ]\n  | lookup process_allowlist Image OUTPUT allowed\n  | where\
      \ allowed != true AND (nonstandard_port=true OR managed_agent != true)\n  | ALERT host Image DestinationIp\
      \ DestinationPort"
- question: For processes that recently contacted IMDS, does the next outbound connection use a destination
    port or byte volume outside the 95th percentile of common ports/bytes for that host or workload?
  context: This statistical method baselines destination ports and byte volume for processes that recently
    contacted IMDS and alerts when the next outbound connection falls outside the 95th percentile of common
    ports/bytes for that host or workload, using robust modified Z-score thresholds resistant to batch
    traffic. For Credential Access, a post-IMDS connection to an unusual port or carrying an unusual data
    volume suggests the freshly obtained token or data is being exfiltrated through a non-standard channel.
    An out-of-baseline port/volume warrants investigation; a connection on common ports with typical volume
    is likely benign.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Cloud virtual machines (IaaS), container runtime environments, network traffic logs at the virtual
    network (VNet/VPC) level'
  range: Last 90 days; baseline 30 days per host/workload
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  imds_procs = events WHERE DestinationIp=\"169.254.169.254\"\n  | join ProcessGuid next_outbound\n\
      \  | eventstats p95(dest_port) p95(bytes) median MAD BY host, workload\n  | eval mz_bytes = abs(0.6745*(bytes-median)/MAD)\n\
      \  | where dest_port > p95_port OR bytes > p95_bytes OR mz_bytes > 3.5\n  | ALERT host Image dest_port\
      \ bytes"
- question: When post-IMDS network behavior (process name, IMDS-to-egress time-delta, destination reputation,
    bytes sent) is scored with an Isolation Forest, which connections are high-confidence anomalies indicating
    token theft followed by exfiltration?
  context: This machine-learning method trains an Isolation Forest on process name, time-delta between
    IMDS access and the next external connection, destination reputation, and bytes sent; high-confidence
    anomalies indicate token theft followed by exfiltration. The alert surfaces the top-3 features (short
    IMDS-to-egress delta, rare destination ASN, high bytes-out), and IMDS credential theft can be emulated
    for tuning with Stratus Red Team. For Credential Access, this catches stealthy exfiltration chains
    that combine several weak signals no single rule would flag. A high anomaly score with these features
    indicates probable token theft and exfiltration; a low score reflects normal post-IMDS activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Cloud virtual machines (IaaS), container runtime environments, network traffic logs at the virtual
    network (VNet/VPC) level'
  range: Last 90 days; retrain monthly
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [process_name, imds_to_egress_delta, dest_reputation, bytes_sent]\n  model\
      \ = IsolationForest().fit(history)\n  score = model.decision_function(post_imds_connections)\n \
