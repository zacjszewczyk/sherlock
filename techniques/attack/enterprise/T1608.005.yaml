name: 'T1608.005: Link Target'
id: e716038e-05d4-4e43-b6b4-a602f68e472c
description: 'This playbook helps an analyst investigate whether an adversary has staged the web resources
  referenced by a malicious link to be used against the organization during spearphishing for information
  (T1598.003) or to gain initial access (T1566.002), as described by MITRE ATT&CK T1608.005, Link Target.
  Because most of this staging happens on attacker-controlled or compromised infrastructure outside the
  organization''s visibility, the hunt focuses on the earliest observable signals and on victim interaction
  as it begins. It pursues the behavior from several complementary angles: internal DNS queries or network
  connections to destinations on high-confidence threat-intelligence feeds (phishing, malware, or C2),
  including failed/sinkholed reach attempts; DNS and HTTP contact with newly registered look-alike domains
  that typosquat or homoglyph corporate brands, corroborated by Certificate Transparency monitoring; HTTP
  response bodies carrying HTML/CSS/JavaScript signatures of known phishing kits; newly registered domains
  contacted with short, low-byte connections suggestive of disposable staging or C2 check-ins; and abuse
  of widely trusted PaaS/SaaS/CDN domains and link shorteners to host link targets behind high-entropy
  or one-time URIs. Detection methods combine deterministic symbolic-logic rules (Zeek intel.log feed
  matches, dnstwist watchlists, CT-log monitoring, phishing-kit YARA, PaaS abuse watchlists, DNS/conn
  correlation), statistical baselining (per-feed hit-count z-scores, Levenshtein-distance and entropy/KL-divergence
  profiling, form-legitimacy scoring, connection-duration/byte percentiles), and machine learning (logistic
  regression and URLNet URL scoring, ARIMA/Prophet time-series and Siamese visual-similarity models, BERT
  HTML classification with Phishpedia visual detection, DBSCAN/Isolation Forest anomaly detection), applied
  mainly across Zeek dns/conn/http/files/intel logs and web-proxy, CT-log, and passive-DNS telemetry so
  the analyst can corroborate suspected link-target staging across feed hits, domain lexical similarity,
  page content, connection behavior, and URL structure.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
