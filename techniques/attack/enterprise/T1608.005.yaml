questions:
- question: '[Resource Development] Create a SIEM rule that triggers an alert when Zeek''s intel.log shows
    a ''policy'' notice type for an indicator match from a high-confidence feed: Can you determine whether
    an internal system initiates a DNS query or a network connection to an external destination (domain,
    URL, or IP address) that is listed on a high-confidence threat intelligence feed with a category of
    ''phishing'', ''malware'', or ''command and control''. -- specifically, using the ''Create a SIEM
    rule that triggers an alert when Zeek''s intel.log shows a ''policy'' notice type for an indicator
    match from a high-confidence feed'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary stages the
    resources behind a malicious link so that a later spearphishing link can divulge credentials/information
    or gain execution; detecting the staged infrastructure or the first victim contact lets defenders
    disrupt the campaign before or as users click. This evidence focuses on the condition that an internal
    system initiates a DNS query or a network connection to an external destination (domain, URL, or IP
    address) that is listed on a high-confidence threat intelligence feed with a category of ''phishing'',
    ''malware'', or ''command and control''. This Symbolic Logic approach works as follows: Create a SIEM
    rule that triggers an alert when Zeek''s intel.log shows a ''policy'' notice type for an indicator
    match from a high-confidence feed. Correlate the source IP with internal asset/identity systems to
    enrich the alert with hostname, user, and department. Because external feeds and blocklists lag adversary
    staging by hours, treat a feed hit as confirmatory rather than primary and pair it with the lower-latency
    analytics below ([Sunrise to Sunset: phishing attacks evade blocklists for hours](https://www.usenix.org/conference/usenixsecurity20/presentation/oest-sunrise)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable contact
    with or staging of a malicious link target; pivot to the responsible internal host and user, the destination
    domain/URL/IP and its registration and feed context, the served page content, and the timing and volume
    of the traffic to scope who interacted and what may have been disclosed. A negative result helps rule
    out this particular angle but should be corroborated with the other questions in this playbook, since
    staging is largely external and individual methods can miss cloaked, newly-issued, or low-prevalence
    infrastructure.'
  answer_sources:
  - Zeek intel.log
  - Zeek dns.log
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Internal DNS Resolvers, Network Egress Points, Web Proxies, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: Zeek/SIEM Rule pseudocode
    query: "alert WHEN intel.log.note == \"Intel::Notice\" AND intel.log.meta.source IN high_confidence_feeds\n\
      \  AND intel.log.meta.category IN {\"phishing\",\"malware\",\"c2\"}\n| enrich src_ip -> hostname,user,dept\
      \ FROM asset_db\n| set priority = (host_critical ? HIGH : MEDIUM)"
- question: '[Resource Development] Profile DNS/connection failure rates against feed-listed link targets
    as a distinct signal: Can you determine whether an internal system initiates a DNS query or a network
    connection to an external destination (domain, URL, or IP address) that is listed on a high-confidence
    threat intelligence feed with a category of ''phishing'', ''malware'', or ''command and control''.
    -- specifically, using the ''Profile DNS/connection failure rates against feed-listed link targets
    as a distinct signal'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary stages the
    resources behind a malicious link so that a later spearphishing link can divulge credentials/information
    or gain execution; detecting the staged infrastructure or the first victim contact lets defenders
    disrupt the campaign before or as users click. This evidence focuses on the condition that an internal
    system initiates a DNS query or a network connection to an external destination (domain, URL, or IP
    address) that is listed on a high-confidence threat intelligence feed with a category of ''phishing'',
    ''malware'', or ''command and control''. This Symbolic Logic approach works as follows: Failure Mode
    Awareness - alert when a host generates >=3 NXDOMAIN responses (Zeek dns.log rcode 3) or REJ/S0 connection
    states (Zeek conn.log) to indicators on the phishing/malware feed within 10 minutes, since staged
    link targets are frequently taken down or sinkholed mid-campaign, and failed reach attempts to known-bad
    infrastructure are themselves high-signal. Enrich each match with feed prevalence/dynamism scoring
    as in passive-DNS risk models ([EXPOSURE: Finding Malicious Domains Using Passive DNS Analysis](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable contact
    with or staging of a malicious link target; pivot to the responsible internal host and user, the destination
    domain/URL/IP and its registration and feed context, the served page content, and the timing and volume
    of the traffic to scope who interacted and what may have been disclosed. A negative result helps rule
    out this particular angle but should be corroborated with the other questions in this playbook, since
    staging is largely external and individual methods can miss cloaked, newly-issued, or low-prevalence
    infrastructure.'
  answer_sources:
  - Zeek intel.log
  - Zeek dns.log
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Internal DNS Resolvers, Network Egress Points, Web Proxies, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: Zeek/SIEM Rule pseudocode
    query: 'from dns.log WHERE rcode==3 (NXDOMAIN) OR from conn.log WHERE conn_state IN {"REJ","S0"}

      JOIN intel.log ON answer/dest IN feed{phishing,malware}

      | count BY src_ip OVER 10min

      alert WHEN count >= 3 | enrich feed_prevalence,feed_dynamism'
- question: '[Resource Development] For each threat intelligence feed, establish a baseline of the daily
    hit count over the last 90 days: Can you determine whether an internal system initiates a DNS query
    or a network connection to an external destination (domain, URL, or IP address) that is listed on
    a high-confidence threat intelligence feed with a category of ''phishing'', ''malware'', or ''command
    and control''. -- specifically, using the ''For each threat intelligence feed, establish a baseline
    of the daily hit count over the last 90 days'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary stages the
    resources behind a malicious link so that a later spearphishing link can divulge credentials/information
    or gain execution; detecting the staged infrastructure or the first victim contact lets defenders
    disrupt the campaign before or as users click. This evidence focuses on the condition that an internal
    system initiates a DNS query or a network connection to an external destination (domain, URL, or IP
    address) that is listed on a high-confidence threat intelligence feed with a category of ''phishing'',
    ''malware'', or ''command and control''. This Statistical Method approach works as follows: For each
    threat intelligence feed, establish a baseline of the daily hit count over the last 90 days. Calculate
    the daily moving average and standard deviation. Generate a high-priority alert if the daily hit count
    for a single feed exceeds three standard deviations above the moving average, signaling a potential
    targeted campaign whose victim clicks cluster in short bursts ([Sunrise to Sunset](https://www.usenix.org/conference/usenixsecurity20/presentation/oest-sunrise)).
    Derive the multiplier per-feed; noisy feeds may warrant a higher z (e.g., 4). A positive result --
    a rule match, statistical outlier, or model alert -- indicates probable contact with or staging of
    a malicious link target; pivot to the responsible internal host and user, the destination domain/URL/IP
    and its registration and feed context, the served page content, and the timing and volume of the traffic
    to scope who interacted and what may have been disclosed. A negative result helps rule out this particular
    angle but should be corroborated with the other questions in this playbook, since staging is largely
    external and individual methods can miss cloaked, newly-issued, or low-prevalence infrastructure.'
  answer_sources:
  - Zeek intel.log
  - Zeek dns.log
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Internal DNS Resolvers, Network Egress Points, Web Proxies, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per feed: series = daily_hit_count OVER last_90d

      mu = moving_avg(series); sigma = stddev(series)

      z = (today_count - mu) / sigma

      alert WHEN z > 3   # noisy feeds: z > 4'
