questions:
- question: '[Initial Access] Golden-measurement mismatch: Can you determine whether a firmware integrity
    measurement (UEFI/BIOS, BMC, or device firmware) fails verification against the authorized golden
    measurement for that device model, or an unsigned/unauthorized firmware update or rollback is applied.
    This is the deterministic integrity floor for hardware/firmware supply-chain tampering and should
    be evaluated via an independent root of trust (TPM measured boot / BMC attestation), not host-only
    telemetry. -- specifically, using the ''Golden-measurement mismatch'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Initial Access tactic (TA0001), an adversary who has tampered
    with hardware or firmware somewhere in the supply chain can land a stealthy, pre-OS or firmware-resident
    implant inside trusted devices (servers, workstations, network gear, or peripherals), giving them
    durable, high-privilege control that survives reimaging and evades host-only defenses. This evidence
    focuses on the condition that a firmware integrity measurement (UEFI/BIOS, BMC, or device firmware)
    fails verification against the authorized golden measurement for that device model, or an unsigned/unauthorized
    firmware update or rollback is applied. This is the deterministic integrity floor for hardware/firmware
    supply-chain tampering and should be evaluated via an independent root of trust (TPM measured boot
    / BMC attestation), not host-only telemetry. This Symbolic Logic approach looks for the following
    signal: Verify firmware/boot measurements against authorized known-good golden values per device model
    via a hardware root of trust and alert on any mismatch, unsigned update, or rollback, per [NIST SP
    800-193: Platform Firmware Resiliency Guidelines](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a device may carry
    a hardware/firmware implant or otherwise compromised component; pivot to the device''s asset/procurement
    history, its boot-integrity and firmware-attestation state, the responsible process or driver and
    its signer, and any pre-logon or beaconing network activity to corroborate the finding. A negative
    result helps rule out this supply-chain vector on the inspected device but should be corroborated
    with the other questions in this playbook, since a single method can miss a well-resourced implant
    that mimics legitimate firmware, hardware, or traffic.'
  answer_sources: &id001
  - TPM PCR / Measured Boot logs
  - fwupd:logs
  - auditd:SYSCALL (firmware_update, kexec_load)
  - Microsoft-Windows-CodeIntegrity/Operational
  - 'NAI: Endpoint Device Firmware/BMC, Physical Asset Management Database'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Golden-measurement mismatch

      source IN [TPM PCR / Measured Boot logs, fwupd:logs, auditd:SYSCALL (firmware_update, kexec_load),
      Microsoft-Windows-CodeIntegrity/Operational]

      | WHERE matches_action_criteria("Golden-measurement mismatch")

      // Verify firmware/boot measurements against authorized known-good golden values per device model
      via a hardware root of trust and al

      | ALERT enrich(host, device, firmware_version, process, driver, signer, dest)'
