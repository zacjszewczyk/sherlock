name: 'T1195.003: Compromise Hardware Supply Chain'
id: 6801acbd-780a-4d1b-89c8-64a7b3fd9732
description: 'This playbook helps an analyst investigate whether an adversary gained initial access by
  compromising the hardware supply chain -- manipulating hardware components or firmware (UEFI/BIOS, BMC,
  device firmware, or boot binaries) before a device reached the enterprise, thereby planting a stealthy,
  high-privilege implant. It guides the hunt across several complementary angles on Windows, Linux, and
  macOS: verifying firmware and measured-boot integrity against authorized golden measurements through
  a hardware root of trust (TPM PCR/measured boot, BMC attestation, fwupd, auditd, Code Integrity), with
  firmware hash allowlisting/fuzzy-hash triage, region entropy analysis, and update failure-rate profiling;
  detecting malicious or vulnerable drivers and supply-chain hash IOCs in process-creation, driver-load,
  and file-transfer telemetry; identifying suspicious egress from newly provisioned assets via threat-intel
  IOC matches, rare ASN/country scoring, and ML C2 classifiers; finding low-jitter (and jittered) C2 beaconing
  and anomalous TLS/JA3 fingerprints; catching pre-logon external connections that fire between system
  boot and first interactive logon (a hallmark of firmware-resident implants); flagging boot-integrity
  failures (Secure Boot/CodeIntegrity, BitLocker recovery, TPM errors, ESP writes, boot-binary drift)
  correlated with recent hardware changes; and correlating time-bound chains of boot error -> unsigned
  process -> rare-destination egress using composite scoring, provenance-graph/GNN, and HMM models. Detection
  methods combine symbolic-logic rules, statistical baselining/change-point analysis, and machine-learning
  models applied to endpoint logs (Windows Security/Sysmon/CodeIntegrity/BitLocker/TPM events, auditd,
  macOS unified/EndpointSecurity logs), firmware/attestation sources, and network telemetry (Zeek conn/dns/ssl/files),
  so the analyst can corroborate suspected hardware/firmware tampering against device provenance, boot
  integrity, firmware attestation, and C2 context.'
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
