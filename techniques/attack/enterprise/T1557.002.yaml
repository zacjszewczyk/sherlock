  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  WinEventLog EventCode=4199\n  | lookup asset_group on host -> group\n  | where group\
      \ in ('high_value','privileged')\n  | join arp.log on conflict_ip\n  | where src_mac NOT IN inventory_mac(conflict_ip)\n\
      \  | emit alert(host, conflict_ip, src_mac)"
