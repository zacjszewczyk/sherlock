- question: When endpoints are clustered by their inbound service mix, which nodes start behaving like
    a server without inventory backing, and what top-3 features distinguish them?
  context: Clustering endpoints by inbound service mix separates true servers from clients. A client-class
    node that drifts into the 'server-like' cluster — fielding inbound service connections it never used
    to — without any inventory record of being a server is a likely interception relay. Reporting the
    top-3 distinguishing features per node makes the finding explainable. For Collection, this surfaces
    stealthy server-impersonation nodes set up to harvest intercepted data.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Windows Event ID 5156
  - 'NAI: All non-gateway endpoints on internal network segments, with traffic monitored by network sensors.'
  range: Last 90 days
  queries:
