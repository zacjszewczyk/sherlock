- question: After an ARP reply altered a high-value server's MAC, did subsequent client connections to
    that server IP land on a MAC that is not the approved server binding (cross-checked against inventory/DHCP
    leases)?
  context: 'This focuses on the post-poisoning effect: clients connecting to a server IP that now resolves
    to an unauthorized MAC. Alert when a server IP changes MAC ownership and subsequent connections (conn.log
    / Event ID 5156) land on a MAC not in inventory/DHCP. A positive result is client traffic to a high-value
    data server being delivered to a rogue MAC — direct evidence of data interception for Collection.
    A negative result is connections continuing to the approved server MAC.'
  answer_sources:
  - Zeek arp.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network traffic flows to and from high-value data assets, monitored at network chokepoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  arp.log mac_change(server_ip -> new_mac)\n  | join (conn.log OR EID=5156) on server_ip\
      \ after change\n  | where dest_mac == new_mac AND new_mac NOT IN approved_mac(server_ip)\n  | emit\
      \ alert(server_ip, new_mac)"
- question: Is the proportion of connections redirected to non-approved MACs rising abruptly above the
    95th percentile over short windows, relative to the service's normal MAC-destination distribution?
  context: The reroute ratio — share of connections going to non-approved MACs — is a direct State metric
    for how much of a service's traffic is being intercepted. Monitor it per service and flag abrupt rises
    above the 95th percentile over short windows, with the cutoff derived from the service's normal MAC-destination
    distribution. For Collection, a sharp climb in this ratio for a high-value data asset signals that
    interception is actively underway, even before absolute volumes look unusual.
  answer_sources:
  - Zeek arp.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network traffic flows to and from high-value data assets, monitored at network chokepoints.'
  range: Last 90 days; short windows, 30-day baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  conn.log | stats sum(dest_mac NOT IN approved)/count as reroute_ratio by service, bin=5m\n\
      \  | join service_mac_dist_p95 on service\n  | where reroute_ratio > p95"
- question: Do time-series models of connection destinations and MAC mappings show residuals indicating
    emerging rerouting before it dominates traffic, and which features contribute?
  context: Forecasting connection destinations and MAC mappings per service lets you detect rerouting
    as it emerges, alerting on residuals beyond the prediction band before the intercepted share grows
    large. This early-warning approach reduces dwell time for Collection interception. Listing the contributing
    features (e.g., new-MAC share, destination shift) keeps the alert actionable so analysts can intervene
    while only a fraction of traffic is compromised.
  answer_sources:
  - Zeek arp.log
