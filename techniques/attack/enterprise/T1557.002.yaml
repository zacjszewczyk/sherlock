- question: Did a Windows system in a privileged or high-value asset group raise Event ID 4199 (IP conflict)
    on a sensitive segment where the ARP source MAC is not the inventory-recognized owner?
  context: On sensitive segments, an address conflict can mean an adversary is poisoning the cache to
    intercept data immediately. Escalate Event ID 4199 events when the affected endpoint belongs to a
    privileged/high-value group (high-value data servers or privileged-user workstations) and the ARP
    source MAC is not the inventory-recognized owner. This prioritizes conflicts with the greatest Collection
    impact. A positive result is a conflict on a file/database server or a privileged user's workstation
    involving an unknown MAC; a benign result involves a recognized MAC.
  answer_sources:
  - Windows Event ID 4199
  - Zeek arp.log
  - Zeek conn.log
  - 'NAI: Designated high-value data servers (file servers, databases) and workstations of privileged
    users.'
