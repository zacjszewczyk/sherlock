    query: ">-\n  conn.log + files.log | where dest_mac IN non_gateway_macs\n  | where dest_port IN reserved_ports_for(other_host)\n\
      \  | where dest_mac != inventory_mac(reserved_ports.host)\n  | emit alert(dest_mac, dest_port, bytes)"
- question: Which non-gateway MACs show inbound bytes or file counts exceeding their 95th-percentile baseline
    over short windows, with per-host thresholds derived from 30-day history?
  context: A relay node fielding intercepted traffic shows abnormally high inbound bytes or file counts.
