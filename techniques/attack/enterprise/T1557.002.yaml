  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  arp.log | where reply==true\n  | stats collect(claimed_ip) as ips by src_mac, bin=10s\n\
      \  | where count(ips)>=2 AND is_client_server_pair(ips)\n     AND none(ips in approved_gateway_cluster_macs)\n\
      \  | emit alert(src_mac, ips)"
