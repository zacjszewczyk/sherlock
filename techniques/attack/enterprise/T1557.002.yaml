  context: A MITM node bridging a client and server alternates its claimed IPs rapidly to keep both caches
    poisoned, producing high flip-flop frequency. Baseline this volatility per subnet using ARP histograms
    and flag MACs above the 99th percentile. This statistical pair-volatility measure catches bidirectional
    poisoning even when the exact two-reply timing rule is evaded. For Collection, an abnormally volatile
