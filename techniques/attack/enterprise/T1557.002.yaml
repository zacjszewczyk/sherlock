    query: ">-\n  for service in high_value_services:\n    pred, band = forecast(service.dest_mac_series)\n\
      \    resid = actual - pred\n    if abs(resid) > band:\n      alert(service, resid, features=[new_mac_share,\
      \ dest_shift])"
- question: Did a non-gateway MAC begin receiving server-style traffic or file-transfer flows on ports
    reserved (per service inventory) for another host, indicating it is relaying intercepted traffic?
  context: An endpoint that suddenly starts receiving traffic on ports that inventory assigns to a different
    server is acting as a rogue relay for intercepted data. Alert when a non-gateway MAC receives server-style
    traffic or file-transfer flows (conn.log/files.log/Event ID 5156) for ports reserved for another host.
    A positive result is a workstation-class device fielding SMB/database/file-transfer flows meant for
    a real server — a clear Collection interception indicator. A negative result is the legitimate server
    continuing to serve those ports.
