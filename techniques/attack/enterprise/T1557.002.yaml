- question: Within a few seconds, did a single attacker MAC issue two targeted ARP replies claiming both
    a client IP and a server IP, where neither address belongs to an approved gateway or cluster MAC?
  context: Bidirectional poisoning — claiming both ends of a client/server pair — is the canonical way
    to force a full man-in-the-middle position so all traffic between the two passes through the attacker.
    Alert when the same MAC claims both sides of a pair within seconds and neither address is an approved
    gateway/cluster MAC. This two-sided signature is highly specific to deliberate MITM for Collection;
    legitimate devices do not impersonate both a workstation and its data server simultaneously. A positive
    result strongly indicates active interception of the session.
  answer_sources:
  - Zeek arp.log
  - Zeek conn.log
  - 'NAI: Network traffic collection points monitoring communication paths between user workstations and
    sensitive data servers.'
