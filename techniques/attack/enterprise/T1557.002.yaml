name: 'T1557.002: ARP Cache Poisoning'
id: cf4756fc-efc6-411b-ba5a-2fddea7ca66d
description: Investigate suspected ARP cache poisoning (MITRE ATT&CK T1557.002), in which an adversary
  sends unsolicited or gratuitous ARP replies to bind a critical IP (gateway, DNS, domain controller,
  RADIUS, file/database server) to a MAC they control, positioning themselves as a man-in-the-middle.
  This playbook helps an analyst confirm poisoning by validating observed IP-to-MAC bindings against an
  authoritative inventory/DHCP source of truth, correlating Zeek arp.log/conn.log/files.log with Windows
  address-conflict (Event ID 4199) and flow (Event ID 5156) events, and applying active verification probes.
  It supports both the Credential Access goal (intercepting authentication traffic on insecure protocols)
  and the Collection goal (intercepting and relaying data to and from high-value assets). Detection methods
  span deterministic symbolic logic (binding mismatch, scan-then-poison, bidirectional claims, multi-IP
  claims, rogue-server flows), statistical baselining (per-MAC reply/fan-out/flip-flop outliers, conflict-rate
  spikes, reroute ratios), and machine learning (classification, sequence and graph anomaly detection,
  clustering, and time-series forecasting) for prioritization and early warning.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
- tactic_id: TA0009
  tactic_name: Collection
