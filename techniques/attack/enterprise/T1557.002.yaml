- question: Does graph anomaly detection on claimed-IP relationships identify an attacker node that bridges
    otherwise unrelated peers, and which top-3 edges/features explain it?
  context: Representing claimed-IP relationships as a graph exposes nodes that connect peers which normally
    have no relationship — exactly what a MITM bridge does. Graph anomaly detection scores nodes by how
    unusually they bridge the topology. Reporting the top-3 contributing edges/features lets an analyst
    see which client/server relationships the node is bridging. For Collection, a node bridging a workstation
