name: 'T1202: Indirect Command Execution'
id: d958a7f3-3882-4575-9b89-8a6885769660
description: 'This playbook helps an analyst investigate whether an adversary has abused trusted Windows
  utilities to perform Indirect Command Execution (T1202) under the Stealth tactic -- running arbitrary
  commands while subverting controls (e.g., Group Policy) that limit cmd.exe or block risky file extensions.
  It guides the hunt across several behavioral angles centered on execute-capable LOLBins such as forfiles.exe,
  pcalua.exe, scriptrunner.exe, wsl.exe, and ssh.exe (including ProxyCommand/LocalCommand abuse via -o
  flags or %USERPROFILE%\.ssh\config tampering). The questions cover: matching the hashes of children
  spawned by these utilities against threat-intel/AV feeds and correlating with Defender malware verdicts;
  detecting suspicious command-line patterns (forfiles /c, pcalua -a, scriptrunner -appvscript, ssh -o
  LocalCommand, hex-escape encodings) and SSH config tamper precursors; baselining parent-child image-pair
  rarity, command-line length/entropy, and argument-feature outliers; spotting outbound network connections
  initiated by indirection utilities or their children to novel, blocked, or non-business destinations;
  and reconstructing forbidden process lineages where office or non-interactive parents bridge to T1202
  utilities and then to command interpreters or post-exploitation children. Detection methods combine
  symbolic-logic rules, statistical baselining/outlier scoring, and machine-learning models (classifiers,
  command-line embeddings, graph/provenance anomaly detection, LSTM traffic models, and contextual event
  triage) applied to Windows Security/Sysmon process-creation, file-creation, network-connection events,
  Windows Defender detections, and Zeek conn/ssl/notice logs, so the analyst can corroborate suspected
  indirect command execution against process lineage, command content, prevalence, and egress context.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
