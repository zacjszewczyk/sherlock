questions:
- question: '[Stealth] Hash IOC match for indirect utilities: Can you determine whether a trusted utility
    associated with indirect command execution launches a child process that matches malicious hash intelligence
    or malware-alert telemetry, indicating proxy execution abuse to evade defenses. -- specifically, using
    the ''Hash IOC match for indirect utilities'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses trusted Windows utilities
    (forfiles.exe, pcalua.exe, scriptrunner.exe, wsl.exe, ssh.exe) to execute commands indirectly and
    evade controls that restrict cmd.exe or risky file types, leaving traces in process-creation, command-line,
    file-creation, and network telemetry. This evidence focuses on the condition that a trusted utility
    associated with indirect command execution launches a child process that matches malicious hash intelligence
    or malware-alert telemetry, indicating proxy execution abuse to evade defenses. This Symbolic Logic
    approach looks for the following signal: Match child-process SHA256 hashes spawned by T1202 parents
    (forfiles.exe, pcalua.exe, scriptrunner.exe, wsl.exe, ssh.exe) against threat-intel/AV content feeds
    and alert on hits; build the parent inventory from the documented execute-capable binaries in the
    [LOLBAS Project](https://lolbas-project.github.io/). A positive result -- a rule match, statistical
    outlier, or model alert -- suggests a trusted utility on the host is being used to launder execution
    of attacker-controlled commands or payloads in a way that deviates from sanctioned administration
    and normal user behavior; pivot to the responsible utility, its full command line, its parent lineage,
    the spawned child process, the user/host context, any SSH config changes, and subsequent outbound
    connections. A negative result helps rule out this indirect-execution vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land abuse.'
