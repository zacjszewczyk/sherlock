questions:
- question: '[Impact] Wiper hash IOC: Can you determine whether execution of a process where the file
    hash matches a known disk-wiping malware signature from threat intelligence sources, showing direct
    destructive tooling execution before data loss begins -- specifically, using the ''Wiper hash IOC''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary wipes or corrupts disk data,
    boot structures, files, or device configurations to interrupt availability and destroy or render systems
    and data unrecoverable, often as a final objective or to cover a confidentiality breach. This evidence
    focuses on the condition that execution of a process where the file hash matches a known disk-wiping
    malware signature from threat intelligence sources, showing direct destructive tooling execution before
    data loss begins. This Symbolic Logic approach works as follows: Match process hashes from Sysmon
    Event ID 1 / Windows Event ID 4688 against curated wiper-family CTI lists (e.g., WhisperGate, HermeticWiper,
    NotPetya, CaddyWiper) and raise high-severity alerts with full parent-process and command-line context.
    Wiper case analyses confirm these families execute a distinct dropper/binary before destruction begins
    ([AA22-057A, CISA/FBI](https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-057a), [Industroyer2,
    ESET](https://www.welivesecurity.com/2022/04/12/industroyer2-industroyer-reloaded/)). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable destructive disk-wipe activity;
    pivot to the responsible process and its parent lineage, the user and host context, the targeted drive/file/device,
    any installed kernel drivers, and downstream lateral movement, and move quickly to isolate and preserve
    the host before destruction completes. A negative result helps rule out this particular wiping vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-and-slow, living-off-the-land, or worm-driven destruction.'
