name: 'T1561: Disk Wipe'
id: c89bf448-6c2b-425c-8859-a571f9375b39
description: 'This playbook helps an analyst investigate whether an adversary is wiping or corrupting
  raw disk data, boot structures, files, or network-device configurations to interrupt availability and
  destroy systems and data as part of the Impact tactic. Disk-wipe operations leave traces across process
  execution, direct raw-disk access, kernel-driver loads, mass file deletion/overwrite, SMB-based worm
  propagation, and destructive CLI commands on network infrastructure, so the hunt spans Windows, Linux,
  macOS, and network devices. It guides the analyst across several behavioral angles: execution of known
  wiper-family binaries matched by hash and abused/first-seen code-signing certificates (WhisperGate,
  HermeticWiper, NotPetya, CaddyWiper); destructive built-in utility command lines (vssadmin delete shadows,
  cipher /w, format, dd, shred, wmic shadowcopy delete); unauthorized raw disk access via \\.\PhysicalDrive
  handles correlated with BYOVD disk-access kernel-driver installs and disk IOCTLs; abnormal file deletion/overwrite
  volume and entropy on critical paths and file servers; anomalous SMB fan-out to administrative shares
  signaling worm-like propagation; and destructive network-device CLI commands (erase startup-config,
  write erase, format flash:) issued at privilege level 15. Detection methods combine symbolic-logic rules,
  statistical baselining/forecasting, and machine-learning models applied to Windows Security/Sysmon events,
  auditd, macOS unified logs, Zeek conn/ssh/smb logs, and network-device AAA/syslog, so the analyst can
  corroborate suspected destruction against process lineage, raw-disk and driver activity, file operations,
  lateral movement, and device-management telemetry.'
type: technique
