    optionally preceded by installation of a known-abused (BYOVD) disk-access kernel driver -- specifically,
    using the ''Rare raw access prevalence scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary wipes or corrupts disk data,
    boot structures, files, or device configurations to interrupt availability and destroy or render systems
    and data unrecoverable, often as a final objective or to cover a confidentiality breach. This evidence
    focuses on the condition that an unauthorized process, not on an established allow-list, performs
    raw disk access by opening a physical-drive/volume handle, optionally preceded by installation of
    a known-abused (BYOVD) disk-access kernel driver. This Statistical Method approach works as follows:
    For a non-allowlisted RawAccessRead event, compute its image prevalence across the enterprise via
    stack count and alert on low prevalence (e.g., process seen on <5 hosts / <1% of endpoints). Weight
    higher when the same image also loaded a rare driver in the prior 10 minutes ([ShieldFS, Continella
    et al.](https://conand.me/publications/continella-shieldfs-2016.pdf)). A positive result -- a rule
    match, statistical outlier, or model alert -- indicates probable destructive disk-wipe activity; pivot
    to the responsible process and its parent lineage, the user and host context, the targeted drive/file/device,
    any installed kernel drivers, and downstream lateral movement, and move quickly to isolate and preserve
    the host before destruction completes. A negative result helps rule out this particular wiping vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-and-slow, living-off-the-land, or worm-driven destruction.'
