name: 'T1558.002: Silver Ticket'
id: c0e0d07b-5bd5-47a7-a4a9-22bc200cf664
description: >-
  This playbook helps an analyst investigate whether an adversary has forged a Kerberos ticket-granting
  service (TGS) ticket -- a Silver Ticket -- using a stolen service account password hash to access a
  specific resource (such as SharePoint, MSSQL, CIFS file shares, or LDAP) and the system hosting it,
  as part of the Credential Access tactic. Unlike Golden Tickets, Silver Tickets are forged offline and
  presented directly to the member server without ever contacting the Key Distribution Center, so the
  defining signature is a successful service logon on a member server (Windows Event 4624 Type 3, often
  with 4672 special-privilege assignment) that has no matching DC-side TGS issuance (Event 4769) for the
  same user and SPN within the ticket lifetime, frequently combined with RC4-HMAC (0x17) encryption used
  against an AES-capable account and an RC4 downgrade on the KDC. It guides the analyst across several
  complementary angles: matching encryption-type mismatches and missing DC ticket trails; flagging domain
  RC4 downgrades; chaining unmatched logons to follow-on remote-execution and admin-share artifacts; spotting
  service access from unmanaged source hosts; profiling Kerberos failure rates; baselining service ciphers,
  source hosts, timing, and TGS-to-logon ratios; applying change-point detection to abuse onset; and scoring
  authentication edges and event sequences with explainable machine-learning models. Detection methods
  combine symbolic-logic rules, statistical baselining/outlier scoring, and machine-learning models applied
  to Windows Security and Kerberos events (4624, 4672, 4634, 4768, 4769, 4771, 4776, 5140, 5145, 7045,
  4688) and Sysmon process-access (Event 10), corroborated with Zeek kerberos.log, smb.log, and conn.log,
  so the analyst can confirm suspected Silver Ticket activity against ticket trails, encryption types,
  source-host behavior, and downstream resource access.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
