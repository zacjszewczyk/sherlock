questions:
- question: >-
    [Credential Access] Match encryption mismatches (Symbolic Logic): Can you determine whether a successful
    Kerberos network logon (Logon Type 3, Event 4624, often paired with 4672 special-privilege assignment)
    is recorded on a member server with Ticket Encryption Type 0x17 (RC4-HMAC), but the target service
    account is configured for AES-only encryption AND the Domain Controller shows no matching TGS issuance
    (Event 4769) for that user/SPN within ticket lifetime. Because Silver Tickets are forged offline with
    the service account hash, the expected DC ticket trail is absent and RC4 is used when the attacker
    only holds the NTLM hash. -- specifically, using the 'Match encryption mismatches' approach that applies
    Symbolic Logic?
  context: >-
    Why this matters: Under the Credential Access tactic (TA0006), an adversary who holds the password
    hash of a target service account forges a Kerberos service ticket (a Silver Ticket) to access a specific
    resource (e.g., SharePoint, MSSQL, CIFS, LDAP) and the host serving it. Because the ticket is forged
    offline with the service account's hash, it is presented directly to the member server and never reaches
    the Key Distribution Center, so the expected DC-side ticket trail is absent and weaker (RC4) encryption
    is often used. This evidence focuses on the condition that a successful Kerberos network logon (Logon
    Type 3, Event 4624, often paired with 4672 special-privilege assignment) is recorded on a member server
    with Ticket Encryption Type 0x17 (RC4-HMAC), but the target service account is configured for AES-only
    encryption AND the Domain Controller shows no matching TGS issuance (Event 4769) for that user/SPN
    within ticket lifetime. Because Silver Tickets are forged offline with the service account hash, the
    expected DC ticket trail is absent and RC4 is used when the attacker only holds the NTLM hash. The
    'Match encryption mismatches' method applies Symbolic Logic as follows: Alert when a member-server
    service logon (4624/4672) succeeds with RC4-HMAC (0x17) even though the service account permits AES
    (0x12), and no matching DC 4769 exists for the (user, SPN) pair within ticket lifetime, per [Detecting
    Forged Kerberos Tickets, Grippo and Kholidy](https://arxiv.org/abs/2301.00044) and [Suspicious Kerberos
    RC4 Ticket Encryption, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_rc4_kerberos.yml).
    Use Event 4769 field semantics (Ticket Encryption Type, Ticket Options 0x40810000) from [4769, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769).
    A positive result -- a rule match, statistical outlier, or model alert -- is consistent with a forged
    Silver Ticket: pivot to the source host, the service account and SPN, the logon ID, the ticket encryption
    type, the absence of a matching DC 4769, and any follow-on lateral movement or resource access from
    that session. A negative result helps rule out this particular detection angle but should be corroborated
    with the other questions in this playbook, since forged-ticket activity can be stealthy and a single
    method may miss it.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4769
  - Windows Event ID 4776
  - Zeek kerberos.log
  - Zeek conn.log
  - >-
    NAI: Domain Controllers, Critical Application and File Servers (e.g., SharePoint, MSSQL, CIFS shares),
    LDAP services
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      // Symbolic-logic correlation for forged Silver Ticket

      logon = WinEventLog:Security WHERE EventCode IN (4624,4672) AND LogonType=3

      tgs   = WinEventLog:Security WHERE EventCode=4769  // DC-side TGS issuance

      ALERT WHEN logon ON member_server
        AND NOT EXISTS tgs WITH same (TargetUserName, ServiceName/SPN) WITHIN TicketLifetime
        AND (TicketEncryptionType=0x17 /*RC4-HMAC*/ WHILE account supports AES 0x12)
        OUTPUT src_host, user, spn, logon_id, enc_type
      // Corroborate with Zeek kerberos.log/conn.log/smb.log for ticket+session context
