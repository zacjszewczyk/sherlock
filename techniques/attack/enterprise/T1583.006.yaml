name: 'T1583.006: Web Services'
id: 43ae930c-2b32-47c1-9880-84cabdf5fa4b
description: 'This playbook helps an analyst investigate whether an adversary is developing or leveraging
  legitimate external web services (e.g., GitHub, raw.githubusercontent.com, GitHub Pages, Pastebin, Discord/cdn.discordapp.com,
  Google, Twitter) as malicious infrastructure for later stages of the intrusion -- command and control
  via a web service, exfiltration over a web service, or phishing (MITRE ATT&CK T1583.006, Web Services).
  Using common, trusted services lets adversaries hide in expected web noise and frustrates attribution;
  the registration itself occurs outside victim visibility, so the hunt targets the observable victim-side
  artifacts. It spans network egress telemetry (Zeek conn/http/dns/ssl/files logs at firewalls and proxies)
  and endpoint telemetry (Windows Event ID 4688 process creation and Event ID 5156 allowed connections),
  and pursues the behavior from several complementary angles: internal hosts connecting to web-service
  URLs/domains/IPs present on malicious-indicator CTI feeds; outbound HTTP/S requests whose URIs structurally
  match malware-staging, tool-retrieval, or C2 patterns initiated by unexpected processes; user browsing
  that shifts toward account-creation, API-key-management, and repository-setup pages inconsistent with
  job role; anomalous upload/download size, frequency, or entropy to web services relative to host or
  peer baselines; and first-seen, low-prevalence resource access to high-risk service paths. Detection
  methods combine deterministic symbolic-logic rules (CTI/IOC matching, regex staging-path and Malleable
  C2 signatures, JA3/JA3S/JA4 TLS fingerprinting, SigmaHQ rules, watchlists of resource-creation URIs,
  newly-seen-URL and threshold-based upload rules), statistical baselining (Shannon entropy and KL-divergence
  of URIs/subdomains, MIME type/file-size profiling, per-user resource-creation volume and rarity weighting,
  transfer size/entropy/ratio baselines, low-prevalence and FFT/CV beaconing tests), and machine learning
  (ARIMA/LSTM/Prophet volume forecasting, supervised Random Forest/Gradient Boosting and self-supervised
  encrypted-traffic classifiers, peer-group clustering/Isolation Forest, DBSCAN upload clustering, and
  CT-HMM/LSTM beacon models), with SHAP-style top-feature attribution surfaced for analyst triage, so
  the analyst can corroborate suspected web-service abuse against process lineage, user role, network
  fingerprints, and transfer behavior.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
