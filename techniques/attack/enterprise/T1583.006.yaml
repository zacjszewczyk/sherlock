- question: '[Resource Development] Forecast subdomain/resource discovery: Can you determine whether An
    internal host connects to a resource (e.g., a specific GitHub repository, Pastebin URL) on a legitimate
    web service that has never been accessed before by any host in the organization and is subsequently
    accessed by a very small number of other internal hosts, with Windows Event ID 4688 showing the initiating
    process. -- specifically, using the ''Forecast subdomain/resource discovery'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary registers
    for or leverages legitimate external web services (e.g., GitHub, Pastebin, Discord, Google) so that
    later malicious use -- command and control, exfiltration over web service, or phishing -- blends into
    expected, trusted web noise and is hard to attribute. Because the registration itself happens outside
    the victim''s visibility, detection focuses on the observable victim-side artifacts of this evidence:
    An internal host connects to a resource (e.g., a specific GitHub repository, Pastebin URL) on a legitimate
    web service that has never been accessed before by any host in the organization and is subsequently
    accessed by a very small number of other internal hosts, with Windows Event ID 4688 showing the initiating
    process. This Machine Learning approach works as follows: Forecast the arrival rate of new subdomains/paths
    per parent service domain (Prophet/ARIMA) enriched with Event ID 4688, alerting when observed counts
    exceed the prediction interval, signaling mass provisioning of malicious resources ([Intrusion detection
    in cloud computing based on time series anomalies](https://link.springer.com/article/10.1186/s13677-023-00491-x)).
    For jitter-resistant cadence detection on the new resource, apply CT-HMM/LSTM beacon models ([NetSpectra
    Sentinel: CT-HMM](https://www.sciencedirect.com/science/article/pii/S1084804525000244), [C2 Beaconing
    Detection via AI-Based Time-Series Analysis](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20))
    and surface top-3 features ([SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    use of an external web service as malicious infrastructure; pivot to the initiating process and its
    parent lineage, the user and host, the destination service domain/URI and TLS fingerprint, and the
    byte volume, timing, and cadence of the transfers to scope what the resource is being used for and
    what data may be moving. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since any single method can miss stealthy, living-off-the-land,
    low-and-slow, or fingerprint-randomized activity over trusted web services.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: DNS Resolvers, Network Egress Points'
  range: Last 90 days (with 30-90 day baseline; correlate event-centered windows of +/- 5 minutes around
    the connection)
  queries:
  - technology: SIEM/ML pseudocode
    query: '# Forecast subdomain/resource discovery (Machine Learning)

      source IN [Zeek conn.log, Zeek dns.log, Zeek http.log, Windows Event ID 4688]

      | approach: Forecast the arrival rate of new subdomains/paths per parent service domain (Prophet/ARIMA)
      enriched with Event ID 4688, alerting when observed counts exceed the prediction interval, signaling
      mass provisioning of malicious resources ([Intrusion detection in cloud computing based on time
      series

      | correlate over NAI: DNS Resolvers, Network Egress Points

      | emit alert with contributing fields and entity context (process, user, host, dest service/URI,
      JA3/JA4, bytes_out, cadence)'
  - technology: Zeek/pseudocode
    query: '# Forecast subdomain/resource discovery (Zeek view)

      watch conn.log/http.log/dns.log/ssl.log/files.log for traffic to legitimate web services (github,
      pastebin, discord, etc.)

      | evaluate URI/host, MIME/file type, orig_bytes:resp_bytes ratio, entropy, and inter-arrival cadence

      | join Windows Event ID 4688/5156 process+session context

      | emit candidates with host, process, dest service, bytes, JA3/JA4'
