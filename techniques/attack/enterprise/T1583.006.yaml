questions:
- question: '[Resource Development] Match web-service traffic to malicious CTI: Can you determine whether
    An internal host initiates a network connection to a URL, domain, or IP address hosted on a legitimate
    web service (e.g., GitHub, Pastebin, Discord) that is present on a threat intelligence feed of known
    malicious indicators, with Windows Event ID 5156 verifying the session. -- specifically, using the
    ''Match web-service traffic to malicious CTI'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary registers
    for or leverages legitimate external web services (e.g., GitHub, Pastebin, Discord, Google) so that
    later malicious use -- command and control, exfiltration over web service, or phishing -- blends into
    expected, trusted web noise and is hard to attribute. Because the registration itself happens outside
    the victim''s visibility, detection focuses on the observable victim-side artifacts of this evidence:
    An internal host initiates a network connection to a URL, domain, or IP address hosted on a legitimate
    web service (e.g., GitHub, Pastebin, Discord) that is present on a threat intelligence feed of known
    malicious indicators, with Windows Event ID 5156 verifying the session. This Symbolic Logic approach
    works as follows: Correlate Zeek conn.log destinations, Zeek dns.log queries, Zeek http.log URIs/Host
    headers, and Windows Event ID 5156 sessions against continuously updated malicious-indicator feeds
    (URLhaus, abuse.ch, internal CTI) for shared web services and raise a high-severity alert on any match.
    Layer JA3/JA3S ([JA3 TLS Client Fingerprinting Standard](https://github.com/salesforce/ja3)) and JA4
    ([JA4+ Network Fingerprinting Suite](https://github.com/FoxIO-LLC/ja4)) hashes from Zeek ssl.log against
    curated C2 fingerprints, and apply [SigmaHQ](https://github.com/SigmaHQ/sigma) web-protocol C2 rules.
    Treat fingerprint-only matches as supporting, not sole, signals because ClientHello randomization
    degrades JA3 reliability ([JA3 Fingerprints Fade](https://www.stamus-networks.com/blog/ja3-fingerprints-fade-browsers-embrace-tls-extension-randomization)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    use of an external web service as malicious infrastructure; pivot to the initiating process and its
    parent lineage, the user and host, the destination service domain/URI and TLS fingerprint, and the
    byte volume, timing, and cadence of the transfers to scope what the resource is being used for and
    what data may be moving. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since any single method can miss stealthy, living-off-the-land,
    low-and-slow, or fingerprint-randomized activity over trusted web services.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies)'
  range: Last 90 days (correlate event-centered windows of +/- 5 minutes around the connection)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match web-service traffic to malicious CTI (Symbolic Logic)

      source IN [Zeek conn.log, Zeek http.log, Zeek dns.log, Windows Event ID 5156]

      | approach: Correlate Zeek conn.log destinations, Zeek dns.log queries, Zeek http.log URIs/Host
      headers, and Windows Event ID 5156 sessions against continuously updated malicious-indicator feeds
      (URLhaus, abuse.ch, internal CTI) for shared web services and raise a high-severity alert on any
      match. Layer JA3/JA3S ([JA3 TLS Client

      | correlate over NAI: Network Egress Points (e.g., Firewalls, Proxies)

      | emit alert with contributing fields and entity context (process, user, host, dest service/URI,
      JA3/JA4, bytes_out, cadence)'
  - technology: Zeek/pseudocode
    query: '# Match web-service traffic to malicious CTI (Zeek view)

      watch conn.log/http.log/dns.log/ssl.log/files.log for traffic to legitimate web services (github,
      pastebin, discord, etc.)

      | evaluate URI/host, MIME/file type, orig_bytes:resp_bytes ratio, entropy, and inter-arrival cadence

      | join Windows Event ID 4688/5156 process+session context

      | emit candidates with host, process, dest service, bytes, JA3/JA4'
- question: '[Resource Development] Flag high-entropy web-service URIs: Can you determine whether An internal
    host initiates a network connection to a URL, domain, or IP address hosted on a legitimate web service
    (e.g., GitHub, Pastebin, Discord) that is present on a threat intelligence feed of known malicious
    indicators, with Windows Event ID 5156 verifying the session. -- specifically, using the ''Flag high-entropy
    web-service URIs'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary registers
    for or leverages legitimate external web services (e.g., GitHub, Pastebin, Discord, Google) so that
    later malicious use -- command and control, exfiltration over web service, or phishing -- blends into
    expected, trusted web noise and is hard to attribute. Because the registration itself happens outside
    the victim''s visibility, detection focuses on the observable victim-side artifacts of this evidence:
    An internal host initiates a network connection to a URL, domain, or IP address hosted on a legitimate
    web service (e.g., GitHub, Pastebin, Discord) that is present on a threat intelligence feed of known
    malicious indicators, with Windows Event ID 5156 verifying the session. This Statistical Method approach
    works as follows: For each connection to common services (raw.githubusercontent.com, *.github.io,
    pastebin.com, cdn.discordapp.com, etc.), compute Shannon entropy and KL-divergence-from-English for
    URI path/query and subdomain labels using Zeek http.log/dns.log, comparing to a 90-day per-service
