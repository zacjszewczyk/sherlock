- question: '[Resource Development] Detect staging URIs via regex and JA3: Can you determine whether An
    outbound HTTP/S request is made to a URL on a legitimate web service that structurally matches a known
    pattern for malware staging, tool retrieval, or command and control, and is initiated by an unexpected
    process. -- specifically, using the ''Detect staging URIs via regex and JA3'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary registers
