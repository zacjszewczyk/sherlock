    [NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500)). Correlate flagged
    hosts with Windows Event ID 5156. Derive the threshold per dataset from the empirical entropy distribution
    of legitimate paths. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable adversary use of an external web service as malicious infrastructure; pivot to the initiating
    process and its parent lineage, the user and host, the destination service domain/URI and TLS fingerprint,
    and the byte volume, timing, and cadence of the transfers to scope what the resource is being used
    for and what data may be moving. A negative result helps rule out this particular vector but should
    be corroborated with the other questions in this playbook, since any single method can miss stealthy,
