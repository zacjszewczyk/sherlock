name: 'T1591.001: Determine Physical Locations'
id: e765803d-a2cb-4793-84a7-8f8123074f56
description: 'This playbook helps an analyst investigate whether an external adversary is conducting reconnaissance
  to determine the victim organization''s physical location(s) ahead of targeting (MITRE ATT&CK T1591.001,
  Determine Physical Locations). Knowing where key resources, facilities, and infrastructure are housed
  -- and what legal jurisdiction the victim operates within -- lets an adversary plan phishing-for-information,
  social-engineering, hardware-addition, or physical-access operations. Because much of this activity
  occurs off the target''s network (open-source data sets, victim-owned websites, social media, public
  records), this hunt focuses on the observable signals that do reach enterprise telemetry: threat-intel-listed
  external IPs connecting to public-facing web servers; automated scraping/scanning of location-specific
  pages (e.g., /about-us, /contact, /locations) by reconnaissance tools; internal hosts issuing anomalous
  DNS queries and connections to geolocation, mapping, whois, and public-records services; user accounts
  bulk-accessing internal Facilities/Security/HR files, floor plans, and site lists; and suspicious process-to-network/file
  sequences where an Office app or script interpreter reaches location-related sites or tagged files.
  Detection methods span deterministic symbolic-logic rules (CTI watchlists, Threshold Random Walk scan
  detection, reconnaissance user-agent/tool signatures, honeytoken/canary URLs, domains, and decoy documents,
  tagged-file bulk-access correlation, process-network correlation), statistical baselining (CTI ratio
  and failed-connection-state percentiles, URI entropy and request-rate outliers, 404/4xx and NXDOMAIN
  failure profiling, DNS/data Z-scores, peer-group access-count and denied-access anomalies, rare process-parent-destination
  combinations), and machine learning (Isolation Forest / Extended Isolation Forest recon scoring, SARIMA/Prophet
  seasonal request forecasting, DNS lexical and host-clustering outlier detection, One-Class SVM / Isolation
  Forest UEBA on file access, and HMM/graph sequence anomaly detection), applied across Zeek conn/http/dns
  logs and Windows Event IDs 4688/4663/4656 so the analyst can corroborate suspected physical-location
  reconnaissance against network, DNS, file-access, and process-lineage evidence.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
