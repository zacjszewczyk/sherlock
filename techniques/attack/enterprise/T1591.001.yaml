questions:
- question: '[Reconnaissance] TI-based web connection detection: Can you determine whether An external
    IP address, present on a threat intelligence feed for reconnaissance or malicious activity, establishes
    one or more connections to a public-facing web server on ports 80 or 443. -- specifically, using the
    ''TI-based web connection detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers the organization''s
    physical location(s) to support targeting -- identifying where key facilities and infrastructure are
    housed, what jurisdiction applies, and what opportunities exist for phishing-for-information, social
    engineering, or physical access. This evidence focuses on the condition that An external IP address,
    present on a threat intelligence feed for reconnaissance or malicious activity, establishes one or
    more connections to a public-facing web server on ports 80 or 443. This Symbolic Logic approach works
    as follows: Continuously join Zeek conn.log id.orig_h to CTI feeds and alert when id.resp_h is a public-facing
    web asset on port 80/443. Layer a deterministic scan floor: apply Threshold Random Walk (sequential
    hypothesis test over each source''s connection success vs failed/refused state) and flag a source
    after ~4-5 failed/refused attempts to distinct assets [Fast Portscan Detection Using Sequential Hypothesis
    Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf). A positive result -- a rule match,
    statistical outlier, or model alert -- is a strong indicator of physical-location reconnaissance;
    pivot to the responsible source IP/host, ASN and geolocation, the user or process involved, the specific
    location-related domains, URIs, or internal files touched, and the timing and volume of the activity
    to scope the adversary''s interest and corroborate intent. A negative result helps rule out this particular
    reconnaissance vector but should be corroborated with the other questions in this playbook, since
    much of this activity occurs off-network (open-source data, social media, public records) and a single
    method can miss low-and-slow, distributed, or out-of-band enumeration.'
