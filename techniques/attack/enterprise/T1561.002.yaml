questions:
- question: '[Impact] Wiper hash/service correlation: Can you determine whether a process is created or
    a service is installed where the executable''s file hash or name is present on a threat intelligence
    feed of known disk-wiping malware, indicating an initial execution or persistence mechanism for destructive
    activity. -- specifically, using the ''Wiper hash/service correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary corrupts or wipes the disk
    structures needed to boot a system -- the MBR, partition table/GPT, boot configuration data, or boot-critical
    files -- to interrupt availability of systems and network resources, often as a destructive finale
    or to mask a confidentiality breach. This evidence focuses on the condition that a process is created
    or a service is installed where the executable''s file hash or name is present on a threat intelligence
    feed of known disk-wiping malware, indicating an initial execution or persistence mechanism for destructive
    activity. This Symbolic Logic approach works as follows: Create a SIEM rule to alert on process creation
    (Windows Event ID 4688 / Sysmon Event ID 1) or service installation (Windows Event ID 7045) where
    the process name or SHA256 hash matches a threat-intelligence feed of known disk-structure wipers
    (Shamoon/DistTrack, StoneDrill, NotPetya, WhisperGate, HermeticWiper). Corroborate with the wiper
    deployment chain documented in [The Anatomy of Wiper Malware Part 1, CrowdStrike](https://www.crowdstrike.com/en-us/blog/the-anatomy-of-wiper-malware-part-1/)
    and the IOCs in [Destructive Malware Targeting Organizations in Ukraine (AA22-057A), CISA](https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-057a);
    treat a forced reboot (Event ID 1074/6006) immediately after the matched execution as a state escalation.
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator of
    impending or in-progress disk-structure destruction; pivot immediately to the responsible process/command
    and its parent lineage, the user and host context, the targeted disk object or boot structure, any
    associated driver load, and lateral movement to other hosts, and consider isolating the asset before
    the wipe completes. A negative result helps reduce suspicion for this particular vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    living-off-the-land, or BYOVD-based wiping.'
