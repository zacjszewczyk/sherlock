name: 'T1561.002: Disk Structure Wipe'
id: 52377205-cb9c-43a8-a4b2-a2e514333923
description: 'This playbook helps an analyst investigate whether an adversary is attempting to impact
  system availability by wiping or corrupting the disk data structures (master boot record, partition
  table, GPT, boot configuration data, and boot-critical files) required to start a system, as part of
  the Impact tactic. Disk Structure Wipe renders hosts unbootable by overwriting sector 0, the partition
  table, or boot files on Windows, Linux, and macOS endpoints and by issuing destructive format/erase
  commands on network devices. Wiper families (Shamoon/DistTrack, StoneDrill, NotPetya, WhisperGate, HermeticWiper)
  often combine an initial malicious executable or service, Bring-Your-Own-Vulnerable-Driver (BYOVD) raw-disk
  access, recovery sabotage, and worm-like SMB/RPC propagation to maximize damage. This playbook guides
  the analyst across multiple behavioral angles: matching wiper hashes/services against threat intelligence;
  detecting unauthorized raw physical-disk write access (\\.\PhysicalDrive*, Sysmon RawAccessRead); spotting
  destructive CLI sessions (format/erase/write erase) on routers, switches, and firewalls; flagging new
  unsigned kernel-mode driver services; auditing modification or deletion of boot-critical files; and
  correlating anomalous SMB/RPC fan-out following remote logons that signals worm-like spread. Detection
  methods combine symbolic-logic rules, statistical baselining (rarity scoring, robust modified Z-score/MAD,
  entropy analysis), and machine learning (Random Forest classifiers, Isolation Forest, provenance-graph
  models, LSTM/HMM sequence models) applied to Windows Security/Sysmon events, auditd, macOS unified logs,
  network-device syslog/AAA, and Zeek conn/smb logs, so the analyst can corroborate suspected disk-structure
  destruction across process, driver, raw-disk, file, and network telemetry.'
type: technique
