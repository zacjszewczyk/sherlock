  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary corrupts or wipes the disk
    structures needed to boot a system -- the MBR, partition table/GPT, boot configuration data, or boot-critical
    files -- to interrupt availability of systems and network resources, often as a destructive finale
    or to mask a confidentiality breach. This evidence focuses on the condition that a command containing
    keywords indicative of formatting or erasing a file system (e.g., ''format'', ''erase'') is executed
    on a network device, typically captured in device syslog or CLI audit output rather than Windows telemetry.
    This Symbolic Logic approach works as follows: Parse network-device AAA accounting / syslog (and Zeek
    ssh.log/conn.log metadata for admin sessions) for destructive privileged commands — `format flash:`,
    `format disk0:`, `erase startup-config`, `write erase`, `delete /force` — and alert when issued from
    enable/privileged mode by an operator not on a ''Senior Network Administrators'' allow-list. These
    are the irreversible native primitives documented in the [Cisco IOS format/erase command reference](https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/fundamentals/command/cf_command_ref/D_through_E.html);
    the keyword-on-AAA detection pattern follows [Sigma: Cisco Clear Logs, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/network/cisco/aaa/cisco_cli_clear_logs.yml).
