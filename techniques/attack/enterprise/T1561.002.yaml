- question: '[Impact] Raw disk write allow-list rule: Can you determine whether a process not on a predefined
    allowlist attempts to acquire write access to a raw physical disk object, such as `\\.\PhysicalDrive0`,
    which is consistent with structure-destruction behavior rather than ordinary file access. -- specifically,
    using the ''Raw disk write allow-list rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary corrupts or wipes the disk
    structures needed to boot a system -- the MBR, partition table/GPT, boot configuration data, or boot-critical
    files -- to interrupt availability of systems and network resources, often as a destructive finale
    or to mask a confidentiality breach. This evidence focuses on the condition that a process not on
    a predefined allowlist attempts to acquire write access to a raw physical disk object, such as `\\.\PhysicalDrive0`,
    which is consistent with structure-destruction behavior rather than ordinary file access. This Symbolic
    Logic approach works as follows: Enable SACLs on physical disk objects and alert when any process
    not on a strict allow-list (chkdsk.exe, defrag.exe, specific backup/imaging agents) requests WRITE
    access (Access Mask containing WRITE_DAC, WRITE_OWNER, GenericWrite, or GenericAll) to `\\.\PhysicalDrive*`
    or volume objects in Windows Event ID 4656/4663, OR generates a Sysmon Event ID 9 (RawAccessRead)
    against `\\.\PhysicalDrive0`/`\\.\C:`. Raw `\\.\` device access bypasses the filesystem and is the
    exact primitive wipers use to reach the MBR/partition table, per [Sysmon Event Reference, Microsoft](https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon)
    and [The Anatomy of Wiper Malware Part 3, CrowdStrike](https://www.crowdstrike.com/en-us/blog/the-anatomy-of-wiper-malware-part-3/).
