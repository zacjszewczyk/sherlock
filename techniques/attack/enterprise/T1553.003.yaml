name: 'T1553.003: Subvert Trust Controls: SIP and Trust Provider Hijacking'
id: efb2230b-897b-4c95-900f-21eeddf4f219
description: 'This playbook helps an analyst investigate whether an adversary has tampered with Subject
  Interface Package (SIP) or trust provider components to subvert Windows Authenticode signature validation,
  causing the operating system and application-control tooling to treat malicious or unsigned code as
  legitimately signed. The core abuse modifies the Dll/FuncName (or DLL/Function) registry values under
  HKLM\SOFTWARE\[WOW6432Node\]Microsoft\Cryptography\OID\EncodingType 0\CryptSIPDllGetSignedDataMsg\{GUID},...\CryptSIPDllVerifyIndirectData\{GUID},
  or HKLM\SOFTWARE\[WOW6432Node\]Microsoft\Cryptography\Providers\Trust\FinalPolicy\{GUID} so that a malicious
  DLL returns a known-good signature or always reports a successful validation; the same outcome can be
  achieved without registry edits via DLL search-order hijacking against trust-validating processes. Because
  hijacked SIP/trust components are invoked by any application that performs code signing or signature
  validation, this technique also enables persistent code execution. The playbook guides the analyst across
  several behavioral angles on Windows endpoints: registry modifications to Cryptography OID/Trust keys
  that point to malicious, rare, or user-writable DLL paths; registry-editing or scripting tools (reg.exe,
  regedit.exe, regsvr32.exe, powershell.exe) touching SIP/Trust keys; non-allowlisted, unsigned, or unusual
  processes modifying these keys; the canonical DLL-drop -> registry-change -> forged-validation sequence
  correlated on a single host; CodeIntegrity/CAPI2 validation-failure surges that betray hash mismatches
  from forged signatures; and validated-but-anomalous processes executing from atypical directories that
  subsequently beacon to low-reputation infrastructure. Detection methods combine symbolic-logic rules,
  statistical baselining/forecasting, and machine-learning models (Isolation Forest, SARIMA/Prophet forecasting,
  provenance-graph learning, and Answer Set Programming) applied to Sysmon (Event IDs 1, 3, 11, 13), Windows
  Security (4657, 4688), CodeIntegrity (3033), CAPI2 Operational (Event ID 11), and Zeek conn/dns/files
  logs, so the analyst can corroborate suspected SIP/trust hijacking against registry state, process lineage,
  file provenance, validation outcomes, and downstream network behavior.'
