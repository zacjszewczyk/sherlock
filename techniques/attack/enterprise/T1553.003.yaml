questions:
- question: '[Defense Impairment] Registry change to SIP/Trust DLL: Can you determine whether a SIP or
    Trust Provider registry value is modified to point to a DLL whose file hash matches a known malicious
    indicator, or the DLL path itself is associated with known adversary tooling. -- specifically, using
    the ''Registry change to SIP/Trust DLL'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary subverts trust
    controls by hijacking SIP or trust provider components so that malicious or unsigned code passes Windows
    Authenticode signature validation, degrading the trustworthiness of code-signing-based defenses and
    application control. The information requirement driving this hunt is: Has an adversary hijacked a
    SIP or Trust Provider to evade defenses? (TA0005 - Defense Evasion) This evidence focuses on the condition
    that a SIP or Trust Provider registry value is modified to point to a DLL whose file hash matches
    a known malicious indicator, or the DLL path itself is associated with known adversary tooling. This
    Symbolic Logic approach works as follows: Alert on Sysmon Event ID 13 or Windows Event ID 4657 where
    TargetObject matches SIP/Trust provider paths (`...\Microsoft\Cryptography\OID\EncodingType 0\CryptSIPDllGetSignedDataMsg`,
    `...\CryptSIPDllVerifyIndirectData`, `...\Cryptography\Providers\Trust\FinalPolicy`, incl. WOW6432Node)
    and the value name is `Dll`/`$DLL`/`Function`. Extract the DLL path, correlate with Sysmon Event ID
    11 or Zeek files.log to obtain hashes, and alert on threat-intel hash matches. Match the production
    rule and allowlist of legitimate SIP DLLs (WINTRUST.DLL, mso.dll, PsfSip.dll via poqexec.exe) in [Persistence
    Via New SIP Provider (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_sip_persistence.yml);
    key/value targets per [Subverting Trust in Windows](https://specterops.io/assets/resources/SpecterOps_Subverting_Trust_in_Windows.pdf)
    and [Code Signing DLL](https://persistence-info.github.io/Data/codesigning.html). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable SIP/trust provider hijacking
    (forged or always-successful signature validation); pivot to the responsible process and its parent
    lineage, the user and host context, the targeted Cryptography registry key and the DLL it now points
    to, the file provenance and hash of that DLL, any subsequent successful validation of previously-unsigned
    images, and downstream execution or network activity. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss registry-free (DLL search-order) hijacks or stealthy living-off-the-land activity.'
