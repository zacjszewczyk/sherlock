name: 'T1036.007: Masquerading: Double File Extension'
id: e1f807d3-e5f5-46d7-b0d1-4f72da8f066e
description: 'This playbook helps an analyst investigate adversaries who abuse double file extensions
  to masquerade the true type of an executable payload (MITRE ATT&CK T1036.007, Masquerading: Double File
  Extension). A file such as Evil.txt.exe can render to a user as Evil.txt because Windows hides the real,
  second extension, tricking the victim into executing malware they believe is a benign document or image.
  Adversaries commonly deliver these files as spearphishing attachments or web downloads and rely on User
  Execution to gain initial access, then blend in to evade defenses (Stealth). The playbook guides hunting
  across the full delivery-and-execution chain: threat-intel hash/filename matching against the double-extension
  corpus; deterministic content-type-versus-declared-extension inference (Magika) and entropy screening;
  regex detection of double-extension file drops in user directories and removable media; profiling of
  rare delivery origins and AV/EDR failure-mode spikes; robust creation-rate and byte-distribution anomaly
  detection; process execution from high-risk directories with anomalous parent/child lineage; network-metadata
  inspection of double-extension transfers over HTTP/SMTP/FTP; and follow-on behavioral chaining (child
  processes, C2, autorun persistence). Each line of inquiry pairs a deterministic symbolic-logic floor
  with statistical baselining and machine-learning models so detection is granular, explainable, and defensible
  across endpoint (Windows Event IDs, Sysmon) and network (Zeek, PCAP) telemetry.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: '[Symbolic Logic] Does any transferred, created, or executed file''s hash match a known-malicious
    IOC, or does its filename match the double-extension threat-intel corpus (e.g., a name ending in .exe/.iso/.rar/.svg/.zip
    while still containing a .doc./.docx./.gif./.jpeg. token)?'
  context: 'Under the Stealth tactic, adversaries disguise dangerous payloads behind a benign-looking
    first extension to slip past users and analysts. This is the deterministic floor of the playbook:
    continuously compare file hashes from Zeek files.log and Sysmon Event ID 1 `Hashes` against your threat-intelligence
    feeds, and match filenames against the known double-extension corpus encoded in the SigmaHQ file_event_win_susp_double_extension
    rule (TargetFilename ends with a dangerous extension while embedding a benign-type token). A positive
    hit on a known-bad hash is high-confidence and warrants immediate containment; a filename-only hit
    is strong corroboration that should be triaged with the other questions here. A negative result does
    not clear the file — novel payloads will not have IOCs, so proceed to content-type inference and ML
    scoring.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 11 (Sysmon)
  - 'NAI: Network perimeter firewalls and web proxies, mail servers, and all enterprise workstations and
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (WinEventLog:Sysmon EventCode=1, WinEventLog:Sysmon EventCode=11, zeek:files)\n\
      | eval h=lower(coalesce(Hashes, sha256))\n| eval fn=lower(coalesce(TargetFilename, filename))\n\
      | where h IN (ti_malicious_hashes)\n  OR (match(fn, \"\\\\.(doc|docx|gif|jpeg|jpg|pdf)\\\\.(exe|iso|rar|svg|zip|scr)$\"\
      ))\n| stats values(fn) values(h) by host, _time\n| alert"
  - technology: Zeek/pseudocode
    query: "files.log: where sha256 in ti_malicious_hashes\n  or filename matches /\\.(doc|docx|gif|jpeg|jpg|pdf)\\\
      .(exe|iso|rar|svg|zip|scr)$/i\n-> raise notice DoubleExtension::TI_Hit"
- question: '[Symbolic Logic] For each file flagged on a benign first extension, does the TRUE content
    type inferred from the file bytes (via Magika) disagree with the declared extension class, and/or
    does Shannon entropy exceed the range expected for the claimed type?'
  context: 'Filenames lie, but bytes do not. Under the Stealth tactic this check defeats the entire double-extension
    trick by ignoring how the name renders and instead inferring the real content type from the file''s
    magic bytes using Magika (deploy google/magika on the sensor/EDR). Alert deterministically when the
    declared extension class (text/image/document) disagrees with the inferred class (PE/script/archive).
    Corroborate with a Shannon-entropy screen: flag bytes with entropy >7.0 when the claimed type (plaintext/document)
    should sit around 4.5-6.5, indicating packing or encryption. A positive result means the file is masquerading
    regardless of any rendering trick; a negative result means the bytes are consistent with the claimed
    type, lowering suspicion.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 11 (Sysmon)
  - 'NAI: Network perimeter firewalls and web proxies, mail servers, and all enterprise workstations and
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each flagged_file:\n  declared_class = class_of_first_extension(filename)   # text|image|document\n\
      \  true_class     = magika_infer(file_bytes)             # PE|script|archive|...\n  ent        \
      \    = shannon_entropy(file_bytes)\n  if true_class != declared_class: alert(\"content/extension\
      \ mismatch\")\n  if declared_class in (text,document) and ent > 7.0: alert(\"entropy anomaly\")"
  - technology: EDR/pseudocode
    query: "on file_event(target):\n  if magika(target).group != extension_group(target.name) -> escalate\n\
      \  if entropy(target) > 7.0 and claimed_group(target) in {text,doc} -> escalate"
- question: '[Statistical Method] When a double-extension match occurs, how rare is the source IP, sending
    domain, or parent process over the last 90 days, and does its modified Z-score indicate a never-before-seen
    origin?'
  context: Stealthy delivery often arrives from infrastructure your environment has never communicated
    with. When a symbolic match fires, compute the 90-day prevalence of the source IP, sending domain,
    or parent process and score its rarity with the robust modified Z-score (median/MAD) on per-origin
    counts. Elevate when |M|>3.5 (roughly the bottom 5th percentile), which marks a rare or first-seen
    origin. The median/MAD formulation resists distortion from a few high-volume legitimate senders that
    would skew a mean/stddev threshold. A high score plus a double-extension file is a strong delivery
    signal tied to the adversary's evasion attempt; a common, well-established origin lowers (but does
    not eliminate) the priority.
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 11 (Sysmon)
  - 'NAI: Network perimeter firewalls and web proxies, mail servers, and all enterprise workstations and
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = stats count by origin over 90d   # origin = src_ip|sender_domain|parent_image

      med = median(base.count); mad = median(abs(base.count - med))

      M = 0.6745 * (this_origin.count - med) / mad

      where abs(M) > 3.5 and double_extension_match -> alert("rare origin")'
- question: '[Statistical Method] Is there a host-level spike in AV/EDR block or quarantine events, blocked
    SmartScreen/Mark-of-the-Web prompts, or failed download attempts (404/blocked proxy) immediately before
    or alongside a double-extension drop?'
  context: An in-progress delivery often leaves a trail of failures as defensive controls react. Under
    the Stealth tactic, track per-host counts of AV/EDR block/quarantine events, blocked SmartScreen or
    Mark-of-the-Web prompts, and failed download attempts that precede or accompany a double-extension
    drop. Apply the modified Z-score (median/MAD) per host and flag |M|>3.5 spikes. A failure-mode spike
    concurrent with a double-extension file is a distinct indicator that an attacker is actively probing
    for a path that works. A flat baseline of failures argues against active delivery, though a single
    clean success can still be malicious — pair with content-type inference.
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 11 (Sysmon)
  - 'NAI: Network perimeter firewalls and web proxies, mail servers, and all enterprise workstations and
    servers.'
  range: Last 90 days (correlate failures within a short window, e.g. +/-10 minutes, around each drop)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fails = count(av_block, edr_quarantine, smartscreen_block, motw_block, http_404, proxy_block)
      by host, hour

      med=median(fails); mad=median(abs(fails-med))

      M = 0.6745*(fails_now - med)/mad

      where abs(M) > 3.5 and exists(double_extension_drop within +/-10m) -> alert'
- question: '[Machine Learning] For double-extension files with no IOC hit, does a static PE malware classifier
    (EMBER-style features) score the file above 0.85, and what are the top-3 SHAP features driving that
    score?'
  context: Novel payloads evade signatures, so under the Stealth tactic score every double-extension file
    that lacks an IOC hit with a static classifier trained on EMBER PE features (byte and byte-entropy
    histograms, imports, header/section metadata, string statistics; a LightGBM model reaches >98% AUC).
    Auto-escalate items scoring >0.85 and attach the top-3 SHAP-attributed features (e.g., content-type=PE,
    byte-entropy=7.4, parent=outlook.exe) so analysts get an explainable verdict. A high score on a file
    masquerading as a document is decisive; a low score plus a clean content-type check can deprioritize.
    Retrain periodically and keep the symbolic floor regardless of model output.
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 11 (Sysmon)
  - 'NAI: Network perimeter firewalls and web proxies, mail servers, and all enterprise workstations and
    servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for f in double_extension_files where f.hash not in ti_hashes:\n  x = ember_features(f)  \
      \             # byte/entropy hist, imports, header, strings\n  p = lgbm_pe_malware.predict_proba(x)\n\
      \  if p > 0.85:\n    top3 = shap_top_features(lgbm_pe_malware, x, k=3)\n    escalate(f, score=p,\
      \ drivers=top3)"
- question: '[Symbolic Logic] Are any files being created whose name matches a double-extension regex
    (a benign first extension followed by an executable second extension, including whitespace/underscore
    cloaking), especially when the parent is a browser, email client, or archive utility?'
  context: This is the core detection for the drop stage under the Stealth tactic. Scan Windows Event
    ID 11 and Sysmon Event ID 1 for filenames matching `.*\.(txt|doc|docx|pdf|xls|xlsx|ppt|pptx|jpg|jpeg|gif|png)\.(exe|scr|bat|hta|lnk|vbs|ps1|msi|js)$`,
    plus whitespace/underscore cloaking variants (e.g., `name.txt      .exe`, `name.txt______.exe`) as
    encoded in the SigmaHQ process_creation and file_event double-extension rules. The signal is much
    stronger when the creating parent process is a browser, mail client, or archive tool — these are the
    typical delivery vectors for spearphishing attachments and drive-by downloads. A match in a user profile
    or removable-media path is high-fidelity; confirm with content-type inference before escalating to
    avoid benignly-named files.
  answer_sources:
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User profile directories (e.g., Downloads, Temp, AppData), application cache folders, and removable
    media drives.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (WinEventLog:Sysmon EventCode=11, WinEventLog:Sysmon EventCode=1)

      | eval fn=lower(TargetFilename)

      | where match(fn, "\\.(txt|doc|docx|pdf|xls|xlsx|ppt|pptx|jpg|jpeg|gif|png)[\\s_]*\\.(exe|scr|bat|hta|lnk|vbs|ps1|msi|js)$")

      | where lower(ParentImage) IN ("*chrome.exe","*msedge.exe","*firefox.exe","*outlook.exe","*7z*.exe","*winrar.exe","*explorer.exe")

      | alert'
- question: '[Symbolic Logic] On each flagged file creation, does Magika byte-based content inference
    disagree with the declared first extension, and does entropy exceed 7.0 suggesting a packed payload?'
  context: A filename-only match can produce false positives, so confirm masquerade at drop time under
    the Stealth tactic by running Magika content inference on each flagged file and comparing the inferred
    type to the declared first extension. Deterministically confirm the masquerade when content type !=
    declared class. Add an entropy gate (>7.0) to catch packed or encrypted payloads disguised as plaintext/documents.
    A confirmed mismatch turns a regex hit into a high-confidence detection; a match where bytes agree
    with the claimed type can be triaged down. This pairs directly with the regex question to drive down
    noise.
  answer_sources:
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User profile directories (e.g., Downloads, Temp, AppData), application cache folders, and removable
    media drives.'
  range: Last 90 days
  queries:
  - technology: EDR/pseudocode
    query: "on flagged_file_creation(f):\n  if magika(f.bytes).group != extension_group(first_ext(f.name))\
      \ -> alert(\"masquerade confirmed\")\n  if entropy(f.bytes) > 7.0 and claimed_group(f) in {text,document}\
      \ -> alert(\"packed payload\")"
- question: '[Statistical Method] Relative to each parent process''s baseline, is there a burst in the
    hourly count of double-extension file creations (modified Z-score |M|>3.5)?'
  context: Mass drops — for example an archive extracting many disguised files — stand out as creation-rate
    bursts. Maintain per-parent baselines of double-extension creation counts in hourly windows and apply
    the modified Z-score (median/MAD); flag bursts with |M|>3.5 above the parent's baseline. The robust
    median/MAD method resists legitimate batch jobs that would defeat a mean/stddev threshold. Under the
    Stealth tactic a sudden burst tied to a browser, mail client, or archive utility suggests an automated
    delivery or unpacking of a malicious bundle; a rate consistent with the parent's history is less concerning.
  answer_sources:
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User profile directories (e.g., Downloads, Temp, AppData), application cache folders, and removable
    media drives.'
  range: Last 90 days (hourly windows; baseline per parent process)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = count(double_ext_creates) by parent_image, hour over 30d

      med=median(base); mad=median(abs(base-med))

      M = 0.6745*(this_hour_count - med)/mad

      where abs(M) > 3.5 -> alert("creation-rate burst", parent_image)'
- question: '[Statistical Method] Does a dropped file''s 1-gram byte-frequency distribution deviate sharply
    (high Mahalanobis distance) from the PAYL profile of its claimed benign type, matching instead a PE/script
    distribution?'
  context: Byte statistics expose masquerade independent of the filename. Build PAYL-style 1-gram byte-frequency
    profiles for benign types (.txt/.jpg/.pdf) and score each dropped file by Mahalanobis distance to
    its claimed type's profile. A file claiming a benign type whose byte distribution actually matches
    a PE or script will deviate sharply. Under the Stealth tactic this catches payloads that defeat both
    name-based and signature-based checks. A large Mahalanobis distance from the claimed-type profile
    is a strong masquerade indicator; a small distance supports the claimed type. Combine with Magika
    for definitive type confirmation.
  answer_sources:
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User profile directories (e.g., Downloads, Temp, AppData), application cache folders, and removable
    media drives.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "profile[type] = mean_vector, cov of 1-gram byte freq over benign corpus  # text/jpg/pdf\n\
      for f in dropped_files:\n  v = byte_freq_1gram(f.bytes)\n  d = mahalanobis(v, profile[claimed_type(f)])\n\
      \  if d > threshold -> alert(\"byte-distribution mismatch\", f)"
- question: '[Machine Learning] For drops with no IOC hit, does the EMBER static-PE classifier score the
    real payload above 0.85 with Magika confirming a non-declared type, and what top-3 SHAP features explain
    it?'
  context: 'Closing the loop on novel drops under the Stealth tactic: for double-extension files without
    IOC hits, classify the real payload with EMBER static PE features and confirm the true type with Magika.
    Auto-escalate scores >0.85 and list the top-3 SHAP-attributed features in the alert for analyst explainability.
    A high malware score with a confirmed type mismatch is decisive evidence of a disguised executable
    dropped to a user directory; a low score with consistent type can be deprioritized. This is the ML
    counterpart to the symbolic drop detection.'
  answer_sources:
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User profile directories (e.g., Downloads, Temp, AppData), application cache folders, and removable
    media drives.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for f in double_ext_drops where f.hash not in ti_hashes:\n  p = lgbm_pe_malware.predict_proba(ember_features(f))\n\
      \  t = magika(f.bytes).group\n  if p > 0.85 and t != declared_group(f):\n    escalate(f, score=p,\
      \ true_type=t, drivers=shap_top_features(f, k=3))"
- question: '[Symbolic Logic] Did a process whose image path contains a double extension execute from
    a high-risk directory (Downloads, Temp, AppData, removable media) with an untrusted or anomalous parent
    (e.g., a document, archive, or mail client spawning an executable)?'
  context: Execution is where masquerading turns into compromise. Under the Stealth tactic, alert when
    a process creation event (Sysmon Event ID 1 or Windows Event ID 4688) shows a double-extension Image
    running from a high-risk directory (Downloads, Temp, AppData, removable media) and the parent is not
    a trusted shell. Cross-check parent lineage against the Elastic Unusual Parent-Child Relationship
    logic — a document, archive, or mail process spawning an executable is high-fidelity evidence of User
    Execution following a double-extension lure. A positive result is an active execution requiring rapid
    triage and likely containment; a negative result (trusted parent, standard path) reduces concern.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User workstations, terminal servers, and Virtual Desktop Infrastructure (VDI) instances.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (WinEventLog:Security EventCode=4688, WinEventLog:Sysmon EventCode=1)

      | eval img=lower(coalesce(NewProcessName, Image))

      | where match(img, "\\.(txt|doc|docx|pdf|jpg|jpeg|gif|png)\\.(exe|scr|bat|hta|com|pif)$")

      | where match(img, "\\\\(downloads|temp|appdata|users\\\\public)\\\\") OR img LIKE "[a-z]:\\\\%"  #
      removable

      | where lower(ParentImage) IN ("*winword.exe","*excel.exe","*outlook.exe","*7z*.exe","*winrar.exe","*acrord32.exe")

      | alert'
- question: '[Statistical Method] Is a new double-extension execution running from a directory outside
    the user''s top-20 execution directories over the last 30 days, or one whose rarity yields a modified
    Z-score |M|>3.5?'
  context: Users have habitual execution locations. Under the Stealth tactic, track each user's top-20
    execution directories over 30 days and score new double-extension executions with the modified Z-score
    (median/MAD); flag paths outside the baseline or with |M|>3.5 rarity for that user. An execution from
    a directory the user has rarely or never run code from — particularly Temp/Downloads/removable media
    — is anomalous and consistent with running a freshly delivered lure. A path inside the user's normal
    baseline is less suspicious. Combine with the symbolic parent-lineage check for high fidelity.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User workstations, terminal servers, and Virtual Desktop Infrastructure (VDI) instances.'
  range: Last 90 days (per-user directory baseline over 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'top20[user] = top 20 exec_dir by count over 30d

      counts = count(exec) by user, exec_dir

      med=median(counts); mad=median(abs(counts-med))

      M = 0.6745*(this_dir.count - med)/mad

      where double_ext_exec and (exec_dir not in top20[user] or abs(M) > 3.5) -> alert'
- question: '[Machine Learning] Does an Isolation Forest flag a double-extension execution as a high anomaly
    given features like parent process, path depth, argument count, user context, temp-directory flag,
    file size, and content-vs-extension mismatch — and what top-3 SHAP features explain it?'
  context: Multivariate outliers reveal suspicious executions that no single rule catches. Train an Isolation
    Forest on features such as parent process, path depth, argument count, user context, temp-directory
    flag, file size, and the content-vs-extension-mismatch flag. Score new double-extension executions,
    prioritize high anomaly scores, and surface the top-3 contributing features via SHAP. Under the Stealth
    tactic this catches disguised executions whose feature combination is unlike normal program behavior.
    A high anomaly score with a mismatch flag set is a strong escalation signal; a low score in line with
    normal executions deprioritizes. Use as a ranking layer above the symbolic detection.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User workstations, terminal servers, and Virtual Desktop Infrastructure (VDI) instances.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "feats = [parent_image, path_depth, arg_count, user_ctx, is_temp_dir, file_size, content_ext_mismatch]\n\
      model = IsolationForest(contamination='auto').fit(historical_execs)\nfor e in new_double_ext_execs:\n\
      \  s = -model.score_samples([features(e)])\n  if s high: escalate(e, score=s, drivers=shap_top_features(model,\
      \ e, k=3))"
- question: '[Symbolic Logic] Does network metadata show a file transfer whose filename contains a double-extension
    pattern (benign first extension, executable second) over HTTP, SMTP, or FTP — and where bytes are
    extracted, does Magika reveal a declared-vs-true type mismatch?'
  context: Catching the lure on the wire enables blocking before it ever lands. Under the Stealth tactic,
    apply regex matching on Zeek files.log filenames for double-extension patterns; for HTTP/S correlate
    with http.log (User-Agent, Referer, host) and for email correlate SMTP headers (From, Subject, attachment
    name). Where Zeek extracts file bytes, run Magika content inference and alert on declared-vs-true
    type mismatch. A double-extension transfer from a rare host or with a suspicious User-Agent, especially
    when the inferred type is a PE, is strong evidence of delivery in progress. Use the surrounding metadata
    to scope the campaign (sender, URL, recipients) and to block at the proxy/MTA.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek ftp.log
  - Zeek smtp.log
  - 'NAI: Network egress points, web proxy servers, Mail Transfer Agents (MTAs), and internal network
    sensors monitoring lateral movement.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "files.log: where filename matches /\\.(txt|doc|docx|pdf|jpg|jpeg|gif|png)\\.(exe|scr|bat|hta|lnk|vbs|ps1|msi|js)$/i\n\
      \  join http.log on fuid  -> capture user_agent, referrer, host\n  join smtp.log on fuid  -> capture\
      \ mailfrom, rcptto, subject\n  if extracted_bytes and magika(bytes).group != declared_group(filename):\
      \ notice TrueTypeMismatch\n  -> raise notice DoubleExtension::Transfer"
- question: '[Statistical Method] Is the frequency of any double-extension pair anomalously high over
    a rolling window (modified Z-score |M|>3.5), and are there spikes in per-pair failure states (HTTP
    404/403, blocked-proxy, SMTP rejects) signaling a delivery campaign?'
  context: Campaigns reveal themselves as trend anomalies. Under the Stealth tactic, track the frequency
    of each double-extension pair (e.g., .pdf.exe, .jpg.scr) over rolling windows and apply the modified
    Z-score (median/MAD); alert when a pair's count yields |M|>3.5, signaling a new delivery campaign.
    Separately profile failure states (HTTP 404/403, blocked-proxy, SMTP rejects) per pair as a distinct
    delivery-attempt signal. A surge in a particular extension pair, or in failed attempts to deliver
    it, indicates an active campaign worth proactive blocking; steady low-volume counts are likely background
    noise. Use the pair identity to write a targeted block rule.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek ftp.log
  - Zeek smtp.log
  - 'NAI: Network egress points, web proxy servers, Mail Transfer Agents (MTAs), and internal network
    sensors monitoring lateral movement.'
  range: Last 90 days (rolling windows; per extension-pair baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'pair = first_ext + ''.'' + second_ext

      counts = count(transfers) by pair, window

      med=median(counts); mad=median(abs(counts-med))

      M = 0.6745*(this_window - med)/mad

      where abs(M) > 3.5 -> alert("campaign", pair)

      fails = count(http_404, http_403, proxy_block, smtp_reject) by pair, window

      where modified_z(fails) > 3.5 -> alert("delivery-attempt spike", pair)'
- question: '[Machine Learning] Does hourly DBSCAN clustering of per-transfer features (source/dest IPs,
    ports, User-Agent, MIME type, file size, PAYL byte-frequency vectors) isolate outlier clusters of
    anomalous double-extension traffic, and what top-3 features distinguish them?'
  context: Unsupervised clustering surfaces coordinated anomalous transfers. Engineer per-transfer features
    (source/dest IPs, ports, User-Agent, MIME type, file size, and PAYL-style byte-frequency vectors)
    and run DBSCAN hourly to isolate clusters of anomalous double-extension traffic. Investigate outlier
    clusters and report the top-3 distinguishing features via SHAP. Under the Stealth tactic a tight outlier
    cluster of double-extension transfers sharing infrastructure or a User-Agent often corresponds to
    a single campaign or tool. Outlier clusters warrant investigation and blocking; dense, well-populated
    clusters of normal traffic can be dismissed. Use as a discovery layer to find campaigns the rules
    miss.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek ftp.log
  - Zeek smtp.log
  - 'NAI: Network egress points, web proxy servers, Mail Transfer Agents (MTAs), and internal network
    sensors monitoring lateral movement.'
  range: Last 90 days (cluster hourly)
  queries:
