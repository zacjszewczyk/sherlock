name: 'T1056.003: Web Portal Capture'
id: 1e06b1a8-52a8-448c-95a7-3f9c98fc4b70
description: 'This playbook helps an analyst investigate Web Portal Capture (T1056.003), in which an adversary
  installs code on externally facing portals such as a VPN, OWA, SSO, or SharePoint login page to capture
  and exfiltrate the credentials of users who authenticate to the service. It supports two missions: determining
  whether the adversary has accessed credentials via web portal capture (Credential Access) and whether
  the adversary is collecting data via web portal capture (Collection). Investigative threads include
  detecting unauthorized modifications to login-facing files (login.aspx, index.html, login.js, .php)
  against a known-good hash manifest, spotting injected <script src> / <form action> tags pointing to
  non-allowlisted external domains, identifying credential-like outbound HTTP/S requests and rare-destination/beaconing
  exfil from DMZ portal servers, correlating unauthorized file-writing processes with rare outbound callbacks,
  catching web-server parents spawning shells or recon tools, finding credential-staging writes to non-log
  file extensions or hidden files, and correlating sensitive config/SAM reads with temp/staging writes.
  Each thread layers deterministic symbolic-logic rules, robust statistical baselining (median/MAD modified
  Z-score, beaconing/FFT analysis), and explainable machine-learning detectors (One-Class SVM, Isolation
  Forest, autoencoders, sequence and graph models) so a SOC analyst can move from a high-fidelity floor
  to anomaly-driven hunting.'
type: technique
