    on the condition that an outbound network connection from an internal asset communicates with a destination
    IP address, domain, or involves a TLS certificate associated with known malicious VPS infrastructure.
    This Machine Learning approach works as follows: Score outbound connections to VPS ranges with a supervised
    classifier (XGBoost/Random Forest) over Volume (orig/resp bytes, byte ratio), Frequency (connections/min),
    State (conn_state success/fail), duration, protocol, DNS and TLS features; alert on probability >0.85.
    Per Explainability, emit the top-3 SHAP feature contributions (e.g., byte ratio, JA3 rarity, interval
    CV) in the alert text per [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    Unsupervised fallback via [Isolation Forest](https://dl.acm.org/doi/10.1145/2133360.2133363). A positive
    result -- a rule match, statistical outlier, or model alert -- is a strong indicator that an internal
    host is communicating with adversary-controlled VPS infrastructure; pivot to the responsible process
    and its parent lineage, the user and host involved, the destination IP/domain/ASN and its provider,
    the TLS/JA3 fingerprint and certificate, and the byte volume, cadence, and duration of the session
    to scope the activity and decide whether it is C2, staging, or exfiltration. A negative result helps
    reduce suspicion for this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss jittered beacons, TLS 1.3-encrypted sessions, low-and-slow
    channels, or domain-fronted traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall Logs
  - Proxy Logs
  - Threat Intelligence feeds on malicious infrastructure
  - 'NAI: Network egress points, proxy server logs, enterprise DNS resolver logs, and network security
    monitoring (NSM) sensor placements.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [orig_bytes, resp_bytes, byte_ratio, conns_per_min, conn_state, duration, proto,
      dns_feat, tls_feat]

      model = XGBoost.load(''vps_conn_clf'')

      score = model.predict_proba(features)

      if score > 0.85: alert(top3=SHAP(features))  # fallback IsolationForest'
- question: '[Resource Development] Signature scanning for VPS C2 indicators: Can you determine whether
