    from [SigmaHQ](https://github.com/SigmaHQ/sigma), and fingerprints from [JA3](https://github.com/salesforce/ja3)/[JA4+](https://github.com/FoxIO-LLC/ja4).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
