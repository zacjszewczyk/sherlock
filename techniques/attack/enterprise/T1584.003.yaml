    on the condition that an outbound network connection from an internal asset communicates with a destination
    IP address, domain, or involves a TLS certificate associated with known malicious VPS infrastructure.
    This Statistical Method approach works as follows: Per Failure Mode Awareness, profile the rate of
    failed/blocked/reset outbound connections (Zeek conn_state S0/REJ/RSTO, firewall deny) per internal
    host to VPS ranges. A host generating a burst of failed connections to many distinct VPS IPs (fallback/rotating
    C2) is a distinct signal; alert when failed-connection count to VPS ranges exceeds 5x the host''s
    30-day baseline within 10 minutes. A positive result -- a rule match, statistical outlier, or model
    alert -- is a strong indicator that an internal host is communicating with adversary-controlled VPS
    infrastructure; pivot to the responsible process and its parent lineage, the user and host involved,
    the destination IP/domain/ASN and its provider, the TLS/JA3 fingerprint and certificate, and the byte
    volume, cadence, and duration of the session to scope the activity and decide whether it is C2, staging,
    or exfiltration. A negative result helps reduce suspicion for this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss jittered beacons,
    TLS 1.3-encrypted sessions, low-and-slow channels, or domain-fronted traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall Logs
  - Proxy Logs
  - Threat Intelligence feeds on malicious infrastructure
  - 'NAI: Network egress points, proxy server logs, enterprise DNS resolver logs, and network security
    monitoring (NSM) sensor placements.'
  range: Last 90 days (baseline over a rolling 30-day window; correlate suspect events within 10-minute
    bursts)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search zeek_conn where id.resp_h in vps_provider_ranges

      | where conn_state in (''S0'',''REJ'',''RSTO'') OR fw_action=''deny''

      | bin _time span=10m | stats count as fails, dc(id.resp_h) as dst by src_ip,_time

      | join src_ip [baseline avg_fails_30d]

      | where fails > 5*avg_fails_30d | alert msg="Burst of failed VPS connections (rotating C2)"'
  - technology: Zeek/pseudocode
    query: '# rolling 10m window per src to vps ranges

      if count(conn_state in {S0,REJ,RSTO}) > 5*baseline[src] and distinct_dst>many: emit_alert(src)'
- question: '[Resource Development] ML classification of VPS connections: Can you determine whether an
    outbound network connection from an internal asset communicates with a destination IP address, domain,
    or involves a TLS certificate associated with known malicious VPS infrastructure. -- specifically,
    using the ''ML classification of VPS connections'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    a third-party Virtual Private Server and provisions it as operational infrastructure (typically command-and-control)
    so that their activity rides on the reputation and ubiquity of a trusted cloud provider and is hard
