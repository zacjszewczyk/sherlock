    on the condition that an outbound HTTP/S connection to a VPS provider IP address contains a URI, User-Agent
    string, or exhibits a JA3/JA3S hash that matches a known signature for a Command and Control (C2)
    framework. This Statistical Method approach works as follows: Flag requests to VPS ranges whose User-Agent
    or URI Shannon entropy deviates >3 std dev from the per-site baseline, or whose UA string is seen
    on <1% of endpoints. Entropy effectively isolates machine-generated strings, as validated in [NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500)
    and [Real-Time Detection of DNS Exfiltration and Tunneling](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
    an internal host is communicating with adversary-controlled VPS infrastructure; pivot to the responsible
    process and its parent lineage, the user and host involved, the destination IP/domain/ASN and its
    provider, the TLS/JA3 fingerprint and certificate, and the byte volume, cadence, and duration of the
    session to scope the activity and decide whether it is C2, staging, or exfiltration. A negative result
    helps reduce suspicion for this particular vector but should be corroborated with the other questions
    in this playbook, since a single method can miss jittered beacons, TLS 1.3-encrypted sessions, low-and-slow
    channels, or domain-fronted traffic.'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Suricata/Snort alerts
  - Proxy Logs
  - 'NAI: SSL/TLS inspection appliances, web proxy servers, and network taps at egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search zeek_http where id.resp_h in vps_provider_ranges

      | eval ua_entropy=shannon(user_agent), uri_entropy=shannon(uri)

      | eventstats mean(ua_entropy) as m, stdev(ua_entropy) as sd by host

      | where ua_entropy > m+3*sd OR ua_seen_on_pct<1

      | alert msg="Anomalous UA/URI entropy to VPS"'
