- question: '[Resource Development] Entropy deviation detection for UA/URI: Can you determine whether
    an outbound HTTP/S connection to a VPS provider IP address contains a URI, User-Agent string, or exhibits
    a JA3/JA3S hash that matches a known signature for a Command and Control (C2) framework. -- specifically,
    using the ''Entropy deviation detection for UA/URI'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    a third-party Virtual Private Server and provisions it as operational infrastructure (typically command-and-control)
    so that their activity rides on the reputation and ubiquity of a trusted cloud provider and is hard
