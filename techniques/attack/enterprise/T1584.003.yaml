questions:
- question: '[Resource Development] TI matching for VPS infrastructure: Can you determine whether an outbound
    network connection from an internal asset communicates with a destination IP address, domain, or involves
    a TLS certificate associated with known malicious VPS infrastructure. -- specifically, using the ''TI
    matching for VPS infrastructure'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    a third-party Virtual Private Server and provisions it as operational infrastructure (typically command-and-control)
    so that their activity rides on the reputation and ubiquity of a trusted cloud provider and is hard
    to attribute back to them. Because the compromise itself is invisible to the victim, the analyst hunts
    the victim-side telemetry produced when internal hosts touch that infrastructure. This evidence focuses
    on the condition that an outbound network connection from an internal asset communicates with a destination
    IP address, domain, or involves a TLS certificate associated with known malicious VPS infrastructure.
    This Symbolic Logic approach works as follows: Alert when Zeek conn/dns/ssl entries match curated
    threat-intel indicators for malicious VPS hosts (IP, domain, or TLS cert SHA1/JA3S). Per First-Party
    Data Priority, run this as enrichment over internal logs, not as a mandatory live API lookup; cache
    the feed locally and refresh hourly. See deterministic indicator matching in [SigmaHQ Generic Signature
    Format for SIEM Systems](https://github.com/SigmaHQ/sigma) and external-infrastructure discovery in
    [SCANdalous: External Detection Using Network Scan Data and Automation](https://www.mandiant.com/resources/blog/scandalous-external-detection-using-network-scan-data-and-automation).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
    an internal host is communicating with adversary-controlled VPS infrastructure; pivot to the responsible
    process and its parent lineage, the user and host involved, the destination IP/domain/ASN and its
    provider, the TLS/JA3 fingerprint and certificate, and the byte volume, cadence, and duration of the
    session to scope the activity and decide whether it is C2, staging, or exfiltration. A negative result
    helps reduce suspicion for this particular vector but should be corroborated with the other questions
    in this playbook, since a single method can miss jittered beacons, TLS 1.3-encrypted sessions, low-and-slow
    channels, or domain-fronted traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall Logs
  - Proxy Logs
  - Threat Intelligence feeds on malicious infrastructure
  - 'NAI: Network egress points, proxy server logs, enterprise DNS resolver logs, and network security
    monitoring (NSM) sensor placements.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'load ti_vps = cache(feed=''malicious_vps_indicators'', refresh=''1h'')

      search zeek_conn OR zeek_dns OR zeek_ssl

      | where id.resp_h in ti_vps.ip OR query in ti_vps.domain OR ssl.cert_sha1 in ti_vps.cert OR ssl.ja3s
      in ti_vps.ja3s

      | eval match_field=coalesce(...)

      | alert severity=high msg="Internal host contacted known-malicious VPS indicator"'
  - technology: Zeek/pseudocode
    query: "# enrichment over local logs, not live API\nfor rec in conn.log, dns.log, ssl.log:\n  if rec.id.resp_h\
      \ in ti.ip or rec.query in ti.domain or rec.cert_sha1 in ti.cert: emit_alert(rec)"
- question: '[Resource Development] Suspicious Certificate Issuer for VPS Connection: Can you determine
    whether an outbound network connection from an internal asset communicates with a destination IP address,
    domain, or involves a TLS certificate associated with known malicious VPS infrastructure. -- specifically,
    using the ''Suspicious Certificate Issuer for VPS Connection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    a third-party Virtual Private Server and provisions it as operational infrastructure (typically command-and-control)
    so that their activity rides on the reputation and ubiquity of a trusted cloud provider and is hard
    to attribute back to them. Because the compromise itself is invisible to the victim, the analyst hunts
    the victim-side telemetry produced when internal hosts touch that infrastructure. This evidence focuses
    on the condition that an outbound network connection from an internal asset communicates with a destination
    IP address, domain, or involves a TLS certificate associated with known malicious VPS infrastructure.
    This Symbolic Logic approach works as follows: Alert when an outbound TLS connection to a known VPS
    provider IP range presents a certificate from a free/automated CA (e.g., Let''s Encrypt) issued within
    the last 7 days, OR a self-signed/short-chain cert, OR a cert whose subject/SAN is a bare IP. These
    response artifacts are the same ones used to fingerprint adversary C2 servers in [SCANdalous](https://www.mandiant.com/resources/blog/scandalous-external-detection-using-network-scan-data-and-automation).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
    an internal host is communicating with adversary-controlled VPS infrastructure; pivot to the responsible
    process and its parent lineage, the user and host involved, the destination IP/domain/ASN and its
    provider, the TLS/JA3 fingerprint and certificate, and the byte volume, cadence, and duration of the
    session to scope the activity and decide whether it is C2, staging, or exfiltration. A negative result
    helps reduce suspicion for this particular vector but should be corroborated with the other questions
    in this playbook, since a single method can miss jittered beacons, TLS 1.3-encrypted sessions, low-and-slow
    channels, or domain-fronted traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall Logs
  - Proxy Logs
  - Threat Intelligence feeds on malicious infrastructure
  - 'NAI: Network egress points, proxy server logs, enterprise DNS resolver logs, and network security
    monitoring (NSM) sensor placements.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "search zeek_ssl\n| where id.resp_h in vps_provider_ranges\n| where (cert.issuer matches \"\
      Let's Encrypt|ZeroSSL|free CA\" AND cert.not_before > now-7d)\n     OR cert.self_signed=true OR\
      \ cert.chain_len<=1 OR cert.subject matches IP_REGEX\n| alert msg=\"Outbound TLS to VPS with suspicious\
      \ cert issuer/age\""
- question: '[Resource Development] JA3/JA4 implant fingerprint match: Can you determine whether an outbound
    network connection from an internal asset communicates with a destination IP address, domain, or involves
    a TLS certificate associated with known malicious VPS infrastructure. -- specifically, using the ''JA3/JA4
    implant fingerprint match'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
