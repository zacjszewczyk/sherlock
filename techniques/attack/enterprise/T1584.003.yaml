  - technology: SIEM/Rule pseudocode
    query: "search zeek_http OR zeek_ssl OR suricata where id.resp_h in vps_provider_ranges\n| where uri\
      \ matches c2_uri_regex OR user_agent in c2_ua_list OR header matches malleable_c2_regex\n     OR\
      \ ja3 in implant_fp OR ja3s in implant_fp OR ja4 in implant_fp\n| alert severity=high msg=\"C2 signature/fingerprint\
      \ to VPS\""
  - technology: Zeek/pseudocode
    query: 'for r in http.log: if regex(r.uri,c2) or r.user_agent in c2_ua: emit_alert(r)

