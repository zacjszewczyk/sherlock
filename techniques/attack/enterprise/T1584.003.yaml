      search zeek_ssl

      | where id.resp_h in vps_provider_ranges

      | where ja3 in c2_fp.ja3 OR ja3s in c2_fp.ja3s OR ja4 in c2_fp.ja4 OR ja4s in c2_fp.ja4s

      | alert severity=high msg="C2 implant TLS fingerprint to VPS range"'
- question: '[Resource Development] Prevalence percentile scoring: Can you determine whether an outbound
    network connection from an internal asset communicates with a destination IP address, domain, or involves
    a TLS certificate associated with known malicious VPS infrastructure. -- specifically, using the ''Prevalence
    percentile scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    a third-party Virtual Private Server and provisions it as operational infrastructure (typically command-and-control)
    so that their activity rides on the reputation and ubiquity of a trusted cloud provider and is hard
    to attribute back to them. Because the compromise itself is invisible to the victim, the analyst hunts
    the victim-side telemetry produced when internal hosts touch that infrastructure. This evidence focuses
    on the condition that an outbound network connection from an internal asset communicates with a destination
    IP address, domain, or involves a TLS certificate associated with known malicious VPS infrastructure.
    This Statistical Method approach works as follows: Compute enterprise-wide prevalence (distinct internal
    hosts and total connection count over a 30-day window) for each destination IP/domain/cert and JA3
    hash. Flag connections to VPS ranges whose destination prevalence is below the 1st percentile or seen
    by only a single host. Derive the percentile cutoff from your own egress baseline; lone-talker destinations
    to VPS providers are the high-value triage set. A positive result -- a rule match, statistical outlier,
    or model alert -- is a strong indicator that an internal host is communicating with adversary-controlled
    VPS infrastructure; pivot to the responsible process and its parent lineage, the user and host involved,
    the destination IP/domain/ASN and its provider, the TLS/JA3 fingerprint and certificate, and the byte
    volume, cadence, and duration of the session to scope the activity and decide whether it is C2, staging,
    or exfiltration. A negative result helps reduce suspicion for this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss jittered beacons,
    TLS 1.3-encrypted sessions, low-and-slow channels, or domain-fronted traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall Logs
  - Proxy Logs
  - Threat Intelligence feeds on malicious infrastructure
  - 'NAI: Network egress points, proxy server logs, enterprise DNS resolver logs, and network security
    monitoring (NSM) sensor placements.'
  range: Last 90 days (baseline over a rolling 30-day window; correlate suspect events within 10-minute
    bursts)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search zeek_conn where id.resp_h in vps_provider_ranges earliest=-30d

      | stats dc(src_ip) as hosts, count as conns by id.resp_h, ssl.ja3

      | eventstats perc1(hosts) as p1

      | where hosts<=p1 OR hosts==1

      | sort hosts | alert msg="Lone-talker / rare VPS destination"'
- question: '[Resource Development] Connection failure-rate profiling: Can you determine whether an outbound
    network connection from an internal asset communicates with a destination IP address, domain, or involves
    a TLS certificate associated with known malicious VPS infrastructure. -- specifically, using the ''Connection
    failure-rate profiling'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    a third-party Virtual Private Server and provisions it as operational infrastructure (typically command-and-control)
    so that their activity rides on the reputation and ubiquity of a trusted cloud provider and is hard
