name: 'T1584.003: Virtual Private Server'
id: 86236553-4cdd-4f60-a82b-6165c8f3fc8a
description: 'This playbook helps an analyst investigate whether a sophisticated external adversary has
  compromised a third-party Virtual Private Server (VPS) and stood it up as operational infrastructure
  -- most often as command-and-control (C2) -- to target the organization (MITRE ATT&CK T1584.003, Virtual
  Private Server, under Resource Development TA0042). Because the compromise and provisioning of the VPS
  happen outside the victim''s visibility, detection is anchored on the victim-side telemetry generated
  when internal hosts interact with that infrastructure during later adversary-lifecycle stages. The hunt
  pursues the behavior from several complementary angles: outbound connections from internal assets to
  destination IPs, domains, or TLS certificates tied to known-malicious VPS infrastructure; HTTP/S and
  TLS sessions to VPS provider ranges whose URI, User-Agent, or JA3/JA3S/JA4 fingerprints match known
  C2 frameworks (Cobalt Strike, Metasploit, Sliver, Mythic); cloud-administration CLI tools (aws.exe,
  az.exe, gcloud, terraform) executing on non-administrative endpoints and then reaching out to cloud/VPS
  ranges; DNS queries for newly-registered, algorithmically-generated, or rarely-seen domains that resolve
  into VPS provider space; and flow-level beaconing, heartbeat, and data-exfiltration patterns toward
  VPS ranges. Detection methods combine deterministic symbolic-logic rules (threat-intel indicator matching,
  suspicious certificate-issuer logic, JA3/JA4 implant fingerprinting, CLI-to-network correlation, low-volume
  long-connection thresholds), statistical baselining (prevalence/percentile rarity, failure-rate and
  NXDOMAIN profiling, entropy and lexical scoring, HTTP error-ratio profiling, beaconing dispersion/FFT
  analysis, SARIMA forecasting), and machine learning (XGBoost/Random Forest classifiers, Isolation Forest
  outlier scoring, version-agnostic encrypted-flow models, autoencoder ensembles, DGA classifiers, time-series
  beacon models, and DBSCAN/HDBSCAN session clustering), applied across Zeek conn/dns/http/ssl logs, firewall/proxy
  and NetFlow data, Suricata/Snort alerts, Sysmon/Windows process telemetry, Active Directory group membership,
  and passive DNS, so the analyst can corroborate suspected adversary VPS infrastructure across network
  fingerprints, process lineage, DNS behavior, and traffic volume and cadence.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
