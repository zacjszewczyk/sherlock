questions:
- question: '[Persistence] LaunchAgent process feed match: For technique T1543.001 (Launch Agent) under
    the Persistence tactic (TA0003), can you determine whether a process with parent PID 1 (''launchd'')
    executes from a path defined in a newly created or modified `.plist` file located in `/Library/LaunchAgents/`
    or `~/Library/LaunchAgents/`. The referenced executable then makes an outbound connection, or the
    destination IP/domain associated with that launch agent matches a known malicious indicator from threat
    intelligence. -- specifically, using the ''LaunchAgent process feed match'' (Symbolic Logic) approach?'
  context: 'Why this matters: This playbook addresses the information requirement "Is the adversary maintaining
    persistence using Launch Agents?" Adversaries abuse macOS Launch Agents by dropping or modifying a
    property-list (.plist) in /System/Library/LaunchAgents/, /Library/LaunchAgents/, or ~/Library/LaunchAgents/
    with RunAtLoad/KeepAlive set to true so a per-user launchd (PPID 1) re-launches a malicious payload
    at every login -- granting durable persistence and, when targeting root-owned system directories,
    privilege escalation. This evidence focuses on the condition that a process with parent PID 1 (''launchd'')
    executes from a path defined in a newly created or modified `.plist` file located in `/Library/LaunchAgents/`
    or `~/Library/LaunchAgents/`. The referenced executable then makes an outbound connection, or the
    destination IP/domain associated with that launch agent matches a known malicious indicator from threat
    intelligence. This Symbolic Logic approach looks for the following signal: Using Apple Endpoint Security
    exec + file events, correlate launchd-backed (PPID 1) Launch Agent executions whose controlling `.plist`
    in `/Library/LaunchAgents/` or `~/Library/LaunchAgents/` was created or modified, with Zeek conn.log/dns.log
    activity; resolve the destination host and alert when the IP, domain, or TLS certificate metadata
    matches known malware/C2 intelligence, or the controlling plist sets `RunAtLoad`/`KeepAlive=true`
    with an unsigned/user-writable `ProgramArguments` target. [Endpoint Security Framework, Apple](https://developer.apple.com/documentation/endpointsecurity)
    [Methods of Mac Malware Persistence, Wardle](https://www.virusbulletin.com/uploads/pdf/conference/vb2014/VB2014-Wardle.pdf)
    Tie-in to the Persistence tactic (TA0003): a confirmed Launch Agent backing a suspicious binary means
    the adversary has established a relaunch-on-login foothold (persistence) and, where the agent or its
    writer touches root-owned LaunchAgents directories or elevates to EUID 0, an escalation of privilege.
    A positive result -- a rule match, a statistical outlier, or a model alert -- indicates a Launch Agent
    or its creator/child deviates from sanctioned installer and developer behavior; pivot to the controlling
    .plist (Label, ProgramArguments, RunAtLoad/KeepAlive), the creating process and its lineage, the executable''s
    code signature/Team ID, the user/host, and any outbound Zeek conn.log/dns.log activity. A negative
    result helps rule out this specific Launch Agent vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, disguised (benign-named), or
    low-and-slow persistence.'
  answer_sources:
  - macOS EndpointSecurity file events
  - macOS Unified Logs
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence feeds
  - 'NAI: All macOS endpoints, Network egress points/gateways, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# LaunchAgent process feed match

      source IN [macOS EndpointSecurity file events, macOS Unified Logs, Zeek conn.log, Zeek dns.log,
      Threat intelligence feeds]

      | WHERE matches_action_criteria("LaunchAgent process feed match")

      // Using Apple Endpoint Security exec + file events, correlate launchd-backed (PPID 1) Launch Agent
      executions whose controlling `.plist` in `/

      | ALERT enrich(host, user, process, parent, plist_path, signature, dest)'
  - technology: Zeek/pseudocode
    query: '# Launch Agent network correlation

      conn.log, dns.log

      | JOIN launchd-backed process host/exec to outbound flows on (id.orig_h, time-window)

      | AGG orig_bytes, dest rarity, DNS entropy, NXDOMAIN/RST per (id.orig_h)

      | flag rare/blocked/C2-matching transfers from new Launch Agent executables'
