name: 'T1543.001: Launch Agent'
id: dfbb0e7c-ee3e-463b-8690-d44aaa21c398
description: 'This playbook helps an analyst investigate whether an adversary is abusing macOS Launch
  Agents (T1543.001) to maintain persistence and/or escalate privileges by creating or modifying property-list
  (.plist) files in /System/Library/LaunchAgents/, /Library/LaunchAgents/, or ~/Library/LaunchAgents/
  with RunAtLoad/KeepAlive set so launchd (PPID 1) re-executes a payload at login. It guides the hunt
  across multiple behavioral angles: launchd-backed executions whose controlling plist was recently created/modified
  and that beacon to known-bad or high-entropy/DGA-like destinations; plist creations by shells/interpreters/network
  tools (bash, python, curl, osascript) or pointing ProgramArguments at world-writable/temp locations;
  tight install->persistence->beacon chains within short windows; new-agent executables spawning shells
  or showing network spikes; permission-denied write failures against root-owned agent directories by
  non-root processes; launchctl load/bootstrap of plists from /tmp or /Users/Shared; privilege-elevation
  immediately followed by agent-directory writes; and writes from processes with invalid/ad-hoc/unallowlisted
  code signatures or rare Team IDs. Detection methods combine symbolic-logic correlation rules, robust
  statistical baselining (median/MAD modified Z-score, prevalence/rarity, entropy, change-point detection),
  and machine learning (Random/Isolation Forest, One-Class SVM, HMM, temporal graph autoencoders) applied
  to macOS EndpointSecurity file/process/code-signing events, macOS Unified Logs, osquery, and Zeek conn.log/dns.log,
  so the analyst can corroborate suspected Launch Agent abuse against process lineage, plist content,
  signing state, privilege transitions, and egress context.'
type: technique
