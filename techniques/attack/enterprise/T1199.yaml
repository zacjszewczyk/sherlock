- question: Is a third-party or cross-account cloud principal performing first-seen privileged API actions
    or connecting from first-seen source networks relative to its baseline?
  context: New behavior from a standing cloud principal often marks the moment of compromise. Baseline
    each third-party/cross-account principal's CloudTrail/audit API actions over a lookback window and
    alert on first-seen privileged actions or first-seen source networks for that principal (first-seen
    Athena approach from the [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)),
    and profile AccessDenied/authorization-failure rate as a distinct reconnaissance signal. A burst of
    authorization failures or a never-before-seen privileged call from a partner principal indicates probing
    or escalation.
  answer_sources:
  - AWS:CloudTrail
  - azure:audit
  - azure:signinlogs
  - m365:unified
  - gcp:audit
  - 'NAI: Cloud IAM roles delegated to partners, Partner/reseller tenants, Delegated admin (DAP/GDAP)
    relationships, Cross-account trust policies'
  range: Last 90 days; baseline over a 90-day lookback per principal.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline = set(actions, src_networks) per principal over 90d; ALERT where action.privileged
      AND action NOT IN baseline OR src_net NOT IN baseline; ALSO track AccessDenied_rate > baseline;
      output principal, action, src_net.
- question: Are third-party or cross-account cloud principals invoking rare API functions, calling from
    unusual geographies/ASNs, or producing anomalous user-command pairs?
  context: Population-based ML surfaces principals that behave unlike their peers. Run rare-function/population
    ML jobs over CloudTrail/audit to flag unusual API calls, geographies/ASNs, and user-command pairs
    for the principal, surfacing the influencer (top contributing fields) in the alert (per [Elastic CloudTrail
    ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning)).
    Rare API functions from a partner principal, especially paired with unfamiliar geos, indicate the
    credential is being used in ways its legitimate owner never does.
  answer_sources:
  - AWS:CloudTrail
  - azure:audit
  - azure:signinlogs
  - m365:unified
  - gcp:audit
  - 'NAI: Cloud IAM roles delegated to partners, Partner/reseller tenants, Delegated admin (DAP/GDAP)
    relationships, Cross-account trust policies'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: job = rare_function_population(cloudtrail|audit, by=principal, fields=[api,geo,asn,user_command]);
      ALERT on rare_score high; explain = top_influencers; output principal, rare_api, geo.
- question: Is a third-party OAuth application or marketplace integration being granted high-privilege
    scopes, or is mailbox impersonation/an unverified publisher app being enabled in a SaaS/Office tenant?
  context: OAuth consent abuse grants persistent, token-based access that bypasses MFA. Alert when admin/user
    consent grants high-risk scopes (full mailbox, files.readwrite.all, directory.readwrite) to a third-party
    app, or when a new/unverified-publisher app or mailbox impersonation is enabled (consent/app-grant
    rule patterns from [SigmaHQ rules](https://github.com/SigmaHQ/sigma)). High-privilege scope grants
    to third-party apps are a leading vector for tenant compromise via trusted integrations; verify the
    app publisher, requester, and scope against expectation.
  answer_sources:
  - saas:googleworkspace
  - azure:audit
  - m365:unified
  - saas:salesforce
  - 'NAI: OAuth/marketplace app consents, Connected apps, Mailbox delegation/impersonation, Tenant admin
    consent endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: events = consent_grants(saas.googleworkspace, azure.audit, m365.unified, saas.salesforce);
      ALERT where scope in [Mail.ReadWrite,full_access_as_app,Files.ReadWrite.All,Directory.ReadWrite.All]
      OR publisher unverified OR mailbox_impersonation_enabled; output app, publisher, scope, grantor.
- question: Is a newly consented third-party app generating an abnormal volume of read/export activity,
    or is a first-seen app appearing in the tenant?
  context: Post-consent behavior reveals whether an integration is benign or weaponized. Baseline per-app
    activity and alert on first-seen apps and on post-consent action volume (objects read/exported per
    hour) above the 99th percentile or mean + 3 sigma, with peer-group context (per [Microsoft Sentinel
    anomalies/UEBA](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference)). A newly consented
    app immediately performing mass reads/exports indicates data harvesting via the trusted integration.
  answer_sources:
  - saas:googleworkspace
  - azure:audit
  - m365:unified
  - saas:salesforce
  - 'NAI: OAuth/marketplace app consents, Connected apps, Mailbox delegation/impersonation, Tenant admin
    consent endpoints'
  range: Last 90 days, event-centered on the consent grant timestamp.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per app_principal: vol=objects_read_or_exported/hour post-consent; base=app_activity_dist;
      ALERT where app first_seen OR vol > 99th_percentile OR vol > mean+3*std; output app, vol, baseline.'
- question: Does a third-party app principal's post-consent behavior deviate from a learned model of its
    normal activity?
  context: Anomaly modeling catches subtle misuse of an app's granted permissions over time. Train a one-class/anomaly
    model on normal app-principal behavior and flag deviating post-consent activity, surfacing the top-3
    contributing features for triage (per [Robust IoT security using Isolation Forest and One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4)).
    Deviations such as new API endpoints, off-hours activity, or unusual object types signal that a previously
    benign integration may be compromised or abused.
  answer_sources:
  - saas:googleworkspace
  - azure:audit
  - m365:unified
  - saas:salesforce
  - 'NAI: OAuth/marketplace app consents, Connected apps, Mailbox delegation/impersonation, Tenant admin
    consent endpoints'
  range: Last 90 days for scoring; train on the app's established history.
  queries:
  - technology: ML/pseudocode
    query: X = features(app_principal:[api,endpoint,hour,object_type,volume,geo]); model = OneClassSVM().fit(normal_X);
      ALERT where decision_function(x) < threshold; explain = top3_features(x).
