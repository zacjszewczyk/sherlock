name: 'T1199: Trusted Relationship'
id: c4e6290c-afe8-4bb2-9531-a9e7cd04b080
description: Investigate whether an adversary is abusing a trusted third-party relationship for initial
  access into the enterprise. Trusted relationships cover IT services contractors, managed service/security
  providers, infrastructure vendors, partner/reseller tenants, delegated administrators (DAP/GDAP), cross-account
  cloud trust, and third-party OAuth/marketplace integrations. This playbook helps an analyst hunt for
  partner authentications that match threat intelligence or fall outside the contractually agreed scope,
  impossible-travel and rare ASN/geo logins, password-spray/brute bursts that precede a success, reconnaissance
  and scripting launched inside partner remote sessions, anomalous post-authentication resource access
  and data egress, lateral-movement sequences combining discovery with alternate credentials, privileged/delegated-admin
  grants to external principals across IaaS/IdP/Office/SaaS control planes, and high-privilege OAuth consent
  grants followed by mass reads, exports, or administrative changes. Detection methods span symbolic logic,
  statistical baselining, and machine learning across endpoint, network, and cloud telemetry.
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any authentications or network connections from trusted third-party accounts or partner
    IP space matching threat-intelligence indicators, or originating from a source CIDR/ASN or time of
    day outside the partner's contractually agreed scope?
  context: Trusted partners are granted standing access that often receives less scrutiny than internal
    users, making a compromised partner credential or partner infrastructure a high-value initial-access
    vector. Collect partner-source logins/connections and compare source IPs, domains, and hashes against
    threat-intelligence feeds for known-malicious IPs, C2 domains, or leaked credentials, and additionally
    alert whenever a partner authenticates from a CIDR/ASN or at an hour outside the agreed engagement
    window (per [CISA AA22-131A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-131a)).
    A positive hit is a strong, deterministic indicator that the trusted relationship is being abused;
    a clean result narrows scope and should be paired with the anomaly methods below.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4771
  - 'NAI: VPN concentrators, Partner-facing web portals, Jump servers/bastion hosts, Cloud IAM roles delegated
    to partners'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: auths = partner_logins(4624,4625,4771) UNION partner_conns(zeek.conn,zeek.dns); enrich auths.src_ip,
      auths.domain WITH ti_feeds; ALERT where ti_match=true OR src_asn NOT IN agreed_asns OR src_cidr
      NOT IN agreed_cidrs OR hour NOT IN agreed_window; output partner_id, src_ip, asn, reason.
- question: Does any single trusted-partner identity authenticate from two locations whose distance cannot
    be physically traversed in the elapsed time (impossible travel)?
  context: A compromised partner credential is frequently used concurrently by the legitimate operator
    and the adversary from different geographies. For successive authentications of the same partner identity,
    compute great-circle distance and the time delta between events and alert when the implied travel
    speed exceeds roughly 900 km/h, allowing margin for VPN/proxy egress (per [Microsoft WO2018085161A1](https://patents.google.com/patent/WO2018085161A1/en)).
    A positive result indicates the credential is shared or stolen and warrants immediate session review;
    account for known partner VPN egress points to limit false positives.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4771
  - 'NAI: VPN concentrators, Partner-facing web portals, Jump servers/bastion hosts, Cloud IAM roles delegated
    to partners'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for id in partner_ids: order logins by time; for each consecutive pair compute km=great_circle(geo1,geo2),
      hrs=delta_hours; ALERT where km/hrs > 900; output id, geo1, geo2, implied_speed.'
- question: Is a trusted-partner login originating from an ASN or country that is rare relative to that
    specific partner's historical baseline?
  context: Each partner typically operates from a stable set of networks and countries. Baseline each
    partner's ASNs and countries from Zeek geo-enriched data and alert when a login originates from a
    value below the 5th percentile of that partner's history, surfacing the rare ASN/geo and its historical
    frequency in the alert (peer-group anomaly scoring as in [Microsoft Sentinel anomalies/UEBA](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference)).
    A rare ASN/geo is not conclusive alone but is a strong corroborating signal when combined with TI
    hits, impossible travel, or post-auth anomalies.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4771
  - 'NAI: VPN concentrators, Partner-facing web portals, Jump servers/bastion hosts, Cloud IAM roles delegated
    to partners'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = freq(partner_id, asn, country) over 90d; for new login: p = historical_freq(partner_id,
      login.asn, login.country); ALERT where p < 5th_percentile; output partner_id, asn, country, p.'
- question: Is a trusted-partner account exhibiting a spike in failed authentications or an abnormal failed-to-successful
    ratio, suggesting a password-spray or brute-force burst that precedes a successful compromise?
  context: Failure-state telemetry is a distinct and often earlier signal than successful logins. Track
    per-partner failed-logon volume and the failed:successful ratio (Event ID 4625/4771 vs 4624) per hour
    and alert when the ratio or count exceeds the partner's mean + 3 sigma baseline (per [CISA AA22-131A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-131a)).
    A burst of failures followed quickly by a success strongly suggests credential guessing culminating
    in access; correlate the success event for immediate triage.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4771
  - 'NAI: VPN concentrators, Partner-facing web portals, Jump servers/bastion hosts, Cloud IAM roles delegated
    to partners'
  range: Last 90 days, with event-centered correlation of any success within 1 hour of a failure burst.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per partner_id, hour: fails=count(4625,4771); succ=count(4624); ratio=fails/max(succ,1); ALERT
      where fails > mean+3*std OR ratio > mean_ratio+3*std; flag if 4624 follows burst within 60m.'
- question: Do trusted-partner login sessions deviate from a learned model of normal partner authentication
    behavior across source, user-agent, ASN, geo, time, and session features?
  context: Multivariate anomalies that no single rule captures can reveal subtle credential abuse. Train
    a one-class SVM or Isolation Forest on normal partner login features (source IP, user agent, ASN,
    country, hour_of_day, day_of_week, bytes, session duration) and flag anomalies, using LIME/feature
    attribution to surface the top-3 contributing features in each alert (per [Robust IoT security using
    Isolation Forest and One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4)). The explained
    top features let an analyst quickly judge whether the deviation is benign (e.g., a new partner laptop)
    or malicious.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4771
  - 'NAI: VPN concentrators, Partner-facing web portals, Jump servers/bastion hosts, Cloud IAM roles delegated
    to partners'
  range: Last 90 days for scoring; train on a 6-12 month history.
  queries:
  - technology: ML/pseudocode
    query: X = features(partner_logins:[src_ip,user_agent,asn,country,hour,dow,bytes,duration]); model
      = OneClassSVM().fit(normal_X); score = model.decision_function(X); ALERT where score < threshold;
      explain = LIME_top3(model, x).
- question: Are processes spawned inside a trusted-partner remote session running host or domain reconnaissance
    commands or remote-execution tooling?
  context: Once inside, adversaries enumerate the environment before moving. Alert when partner sessions
    (parent process such as sshd, mstsc, wsmprovhost) run commands matching known reconnaissance patterns
    (whoami /all, nltest, net group, AdFind) or remote-exec tooling tied to Event IDs 4688/7045/5145 (per
    [JPCERT/CC Detecting Lateral Movement through Tracking Event Logs](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf)).
    Discovery activity from a maintenance partner that should be performing scoped tasks is highly suspicious
    and is an early lateral-movement precursor.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Jump servers, Managed servers, Domain controllers, Developer workstations accessed by partners'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: proc = process_create(4688,sysmon1,4104) where parent in [sshd,mstsc.exe,wsmprovhost.exe,winrshost.exe]
      AND session.user in partner_accounts; ALERT where cmdline ~ /(whoami /all|nltest|net group|net localgroup|AdFind|quser)/
      OR 7045/5145 remote-exec observed.
- question: Is the command rate or command-line entropy inside a trusted-partner session abnormally high,
    indicating scripted or obfuscated activity?
  context: Automated tooling and obfuscated payloads change the statistical shape of session activity.
    Baseline per-partner command rate (commands/min) and Shannon entropy per command line, then flag sessions
    whose command frequency exceeds mean + 3 sigma or whose entropy exceeds the 95th percentile (MAD/percentile
    detectors as in [Bohara et al.](https://mnoureddine.com/files/17BOH01.pdf)). High command frequency
    suggests scripting, while high entropy suggests encoded/obfuscated commands; either deviates from
    the deliberate, low-volume work expected of a maintenance partner.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Jump servers, Managed servers, Domain controllers, Developer workstations accessed by partners'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per partner_session: rate=cmds/min; ent=shannon(cmdline); base=stats(partner_id); ALERT where
      rate > mean+3*std OR ent > 95th_percentile; output session, rate, ent.'
- question: Do command lines executed in trusted-partner sessions classify as malicious when scored by
    an NLP model?
  context: Reconnaissance and exploitation commands have learnable linguistic structure. Embed partner
    command lines with an NLP model, classify with Logistic Regression, and alert on malicious predictions,
    including the top-3 token/feature contributions for explainability (feature attribution as in [Robust
    IoT security using Isolation Forest and One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4)).
    This catches novel or lightly modified malicious commands that signature rules miss, while the contributing
    tokens let an analyst validate the verdict quickly.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Jump servers, Managed servers, Domain controllers, Developer workstations accessed by partners'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: emb = nlp_embed(partner_cmdlines); pred = LogReg.predict_proba(emb); ALERT where pred_malicious
      > threshold; explain = top3_token_contributions(model, cmdline).
- question: Do trusted-partner logins imply impossible travel when comparing successive geo-located authentication
    events at the identity-provider and VPN layers?
  context: This restates impossible-travel feasibility specifically against IdP and VPN gateway telemetry
    where partner identities federate in. Alert when partner logins imply travel speeds greater than ~900
    km/h by comparing successive geo-located logins using deterministic distance/time feasibility logic
    (per [Microsoft WO2018085161A1](https://patents.google.com/patent/WO2018085161A1/en)). Cross-source
    correlation (Windows 4624, Zeek conn, azure signinlogs) reduces blind spots where a partner authenticates
    to multiple front ends.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - azure:signinlogs
  - 'NAI: VPN gateways, External-facing authentication portals (e.g., ADFS), Cloud identity providers
    (e.g., Azure AD, Okta)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'logins = union(win4624, zeek_conn_geo, azure_signin) for partner_ids; consecutive pair: speed=great_circle(g1,g2)/delta_hours;
      ALERT where speed > 900 km/h; output identity, sources, speed.'
- question: Is a trusted-partner login occurring at an improbable hour or from a first-seen device, ASN,
    or geo relative to that partner's peer group?
  context: Adversaries operate on their own schedule and from their own devices. Model each partner's
    login-hour distribution and flag logins at <1% probability or >3 sigma from the mean, and additionally
    flag first-seen device/ASN/geo relative to the partner's peer group, naming the contributing factor
    in the alert (per [Microsoft Sentinel anomalies/UEBA](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference)).
    A first-seen device combined with an odd-hour login is a classic compromise pattern; the named contributing
    factor speeds triage.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - azure:signinlogs
  - 'NAI: VPN gateways, External-facing authentication portals (e.g., ADFS), Cloud identity providers
    (e.g., Azure AD, Okta)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: model = hour_distribution(partner_id); ALERT where p(login.hour) < 0.01 OR hour > mean+3*std;
      ALSO ALERT where device|asn|geo first_seen vs peer_group; output partner_id, factor.
- question: Is the volume of trusted-partner logins spiking beyond the forecast upper bound for that partner?
  context: A surge of partner logins can indicate automated credential abuse or parallel adversary sessions.
    Train a SARIMA model per partner on hourly login counts and alert when observed volumes exceed the
    upper prediction bound. Forecast-based detection captures abnormal aggregate behavior even when each
    individual login looks plausible; investigate which sources and accounts drive the spike.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - azure:signinlogs
  - 'NAI: VPN gateways, External-facing authentication portals (e.g., ADFS), Cloud identity providers
    (e.g., Azure AD, Okta)'
  range: Last 90 days for scoring; train on >=6 months of hourly counts.
  queries:
  - technology: ML/pseudocode
    query: series = hourly_login_counts(partner_id); fit = SARIMA(series); pred,ub = forecast(fit); ALERT
      where observed > ub; output partner_id, observed, ub, drivers.
- question: Does a trusted-partner login violate the learned structural patterns of normal (source, destination,
    account, time) tuples for that account?
  context: Beyond simple feature anomalies, the relational structure of logins reveals abuse. Score each
    partner login against a structural model of normal (source, destination, account, time) tuples and
    flag logins to host classes the account has never used (per [Siadati and Memon, Detecting Structurally
    Anomalous Logins](https://doi.org/10.1145/3133956.3134003)), reporting the violated structural pattern
    as the explanation. This is effective for spotting a partner account suddenly authenticating to a
    class of hosts well outside its maintenance remit.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - azure:signinlogs
  - 'NAI: VPN gateways, External-facing authentication portals (e.g., ADFS), Cloud identity providers
    (e.g., Azure AD, Okta)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = structural_login_model(src,dst,account,time) over history; for login: p = model.score(login);
      ALERT where login.dst_class never_seen OR p < threshold; explain = violated_pattern.'
- question: Is a trusted-partner account connecting to internal hosts or resources outside its allow-listed
    scope after authenticating?
  context: Partner access should be least-privilege and scoped to specific systems. Alert when partner
    connections target internal hosts outside their allow-listed resources, enforcing the scoping recommended
    in [CISA AA22-131A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-131a). Any connection
    to an out-of-scope file share, database, repository, or management interface from a partner session
    is a deterministic policy violation and a likely lateral-movement attempt; maintain an accurate per-partner
    allowlist for this to be effective.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Internal file shares, Database servers, Code repositories, Critical infrastructure management
    interfaces'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: conns = partner_sessions(zeek.conn, win4624/4688); ALERT where dst_host NOT IN allowlist[partner_id];
      output partner_id, dst_host, service, bytes.
- question: Is a trusted-partner session transferring outbound data volumes far above that partner's normal
    per-session baseline?
  context: Trusted access is a convenient exfiltration channel. Baseline each partner's per-session outbound
    volume (Zeek resp_bytes / files total_bytes) and flag sessions exceeding the 99th percentile, reporting
    observed bytes versus baseline in the alert. A maintenance session that suddenly moves gigabytes from
    internal file shares or databases is a strong data-theft indicator; correlate with the destination
    and file telemetry to confirm what was accessed.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Internal file shares, Database servers, Code repositories, Critical infrastructure management
    interfaces'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per partner_session: out=sum(resp_bytes)+sum(files.total_bytes); base=session_volume_dist(partner_id);
      ALERT where out > 99th_percentile; output partner_id, out, baseline.'
- question: Is a trusted-partner session contacting an unusually large number of distinct internal hosts,
    or rapidly contacting many first-time hosts (fan-out)?
  context: Lateral movement and discovery produce wide host fan-out. Track the number of distinct internal
    hosts a partner session contacts and the rate of first-time hosts, alerting when either exceeds mean
    + 3 sigma of the partner baseline (edge-rarity/graph statistics as in [Kent et al.](https://doi.org/10.1016/j.cose.2014.09.001)).
    A scoped maintenance partner should touch a small, stable set of hosts; sudden fan-out indicates sweeping
    or pivoting across the environment.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Internal file shares, Database servers, Code repositories, Critical infrastructure management
    interfaces'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per partner_session: n_distinct=count_distinct(dst_host); n_new=count(first_seen_host); base=stats(partner_id);
      ALERT where n_distinct > mean+3*std OR n_new > mean+3*std.'
- question: Is a trusted-partner user creating new access edges to internal assets outside the community
    of resources it normally interacts with?
  context: Graph community structure captures normal access relationships. Build a partner-user vs internal-asset
    graph, apply Louvain clustering, and flag new edges outside the user's community. An edge from a partner
    account to an asset cluster it has never belonged to (e.g., a contractor reaching domain controllers
    or code repos) signals scope violation or lateral movement; review the new edge's endpoints and timing.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Internal file shares, Database servers, Code repositories, Critical infrastructure management
    interfaces'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: G = bipartite(partner_users, internal_assets, edges=auth/conn); comm = louvain(G); ALERT where
      new_edge(u,a) AND community(a) != community(u); output u, a, communities.
- question: Do new trusted-partner-to-internal-host authentication edges have low link-prediction probability,
    indicating access that does not fit the established authentication graph?
  context: Link prediction quantifies how expected a new access relationship is. Score new partner->internal-host
    authentication edges with a graph link-prediction model and surface the lowest-probability edges and
    their contributing nodes (per [CyberGraph (Bowman et al.)](https://www.usenix.org/system/files/raid20-bowman.pdf)
    and [LMTracker (Fang et al.)](https://www.sciencedirect.com/science/article/abs/pii/S0925231221018646)).
    Low-probability edges represent access that the historical graph would not predict, a hallmark of
    credential abuse and lateral movement; the contributing nodes guide the analyst to the relevant accounts
    and hosts.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Internal file shares, Database servers, Code repositories, Critical infrastructure management
    interfaces'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'G = auth_graph(partner_users, internal_hosts); model = link_predict(G); for new_edge e: p=model.score(e);
      ALERT where p < threshold; rank ascending; explain = contributing_nodes(e).'
- question: Does a trusted-partner session show a discovery command followed by an alternate-credential
    logon and a remote-admin port connection within a short time window?
  context: This is the canonical lateral-movement sequence. Alert when a discovery command, an alternate-credential
    logon (Event ID 4648), and a remote admin port connection occur within 15 minutes from one partner
    source/Logon ID, using the tool-to-EventID mappings in [JPCERT/CC Detecting Lateral Movement through
    Tracking Event Logs](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf). The tight
    temporal chaining of recon, credential switch, and remote access is far more specific than any single
    event and strongly indicates hands-on movement from a partner foothold.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Zeek conn.log
  - Zeek dce_rpc.log
  - 'NAI: All authenticated endpoints and servers, particularly jump boxes and domain controllers'
  range: Last 90 days, correlated within a 15-minute sliding window per Logon ID.
  queries:
  - technology: SIEM/Rule pseudocode
    query: window=15m per (partner_src, logon_id); SEQUENCE recon_cmd(4688) -> 4648(altcred) -> conn(zeek.conn|dce_rpc
      to 445/3389/5985/135); ALERT on full sequence; output logon_id, target_host.
- question: Is a trusted-partner account exceeding its baseline of first-time internal host connections
    within a session?
  context: First-time host access concentrated in a session indicates exploration. Track per-user first-time
    host connections and alert when a session exceeds mean + 3 sigma, using authentication-graph edge-rarity
    statistics from [Kent et al.](https://doi.org/10.1016/j.cose.2014.09.001) Unlike the broad fan-out
    metric, this focuses on the novelty of destinations within a single partner session, capturing methodical
    pivoting even at modest volumes.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Zeek conn.log
  - Zeek dce_rpc.log
  - 'NAI: All authenticated endpoints and servers, particularly jump boxes and domain controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per partner_session: n_first=count(host NOT IN seen_hosts[user]); base=stats(user); ALERT
      where n_first > mean+3*std; update seen_hosts.'
- question: Do causal login paths within a trusted-partner session combine a credential switch with first-time
    host access along a low-probability path?
  context: Stitching events into causal paths exposes movement that isolated alerts miss. Build causal
    login paths across the session and flag paths that combine a credential switch with first-time host
    access (low-probability paths), per [Hopper (Ho et al.)](https://www.usenix.org/system/files/sec21-ho.pdf)
    and temporal link prediction in [Euler (King and Huang)](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf),
    reporting the switched credential and new host as the explanation. A path where a partner changes
    credentials and immediately reaches a never-before-accessed host is a high-fidelity lateral-movement
    signal.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Zeek conn.log
  - Zeek dce_rpc.log
  - 'NAI: All authenticated endpoints and servers, particularly jump boxes and domain controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'paths = causal_login_paths(partner_session_events); for path: p=path_prob(path); ALERT where
      path has cred_switch(4648) AND first_time_host AND p < threshold; explain = switched_cred, new_host.'
- question: Do trusted-partner session action sequences have low likelihood under a Markov model of benign
    behavior?
  context: Sequential behavior modeling generalizes beyond fixed rules. Train a Markov model on benign
    action sequences and flag sessions with low likelihood, and classify movement using engineered authentication-sequence
    features (per [Bian et al., Uncovering Lateral Movement Using Authentication Logs](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf)).
    Low-likelihood action sequences capture unusual orderings of logons, executions, and connections that
    signal hands-on adversary activity rather than routine maintenance scripts.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Zeek conn.log
  - Zeek dce_rpc.log
  - 'NAI: All authenticated endpoints and servers, particularly jump boxes and domain controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = markov_train(benign_action_sequences); for partner_session: L = sequence_loglik(model,
      actions); ALERT where L < threshold; features = auth_sequence_features; classify_movement(features).'
- question: Is an external or cross-account principal being granted a high-privilege directory role, a
    delegated-admin relationship, or assuming a cross-account role, then issuing privileged control-plane
    API calls in short succession?
  context: Cloud trust abuse lets a partner or reseller pivot directly into control-plane administration.
    Alert when an external/partner principal is granted a high-privilege directory role (Company Administrator/Global
    Admin), a delegated-admin relationship is created (Add delegated admin, Set-PartnerOfRecord, New-DelegatedAdminRelationship),
    a PIM role is activated, or a cross-account AssumeRole/UpdateAssumeRolePolicy occurs (control-plane
    rule patterns from [SigmaHQ rules](https://github.com/SigmaHQ/sigma)). Privileged grants to external
    principals followed by rapid privileged API calls are a primary indicator of trusted-relationship
    abuse in IaaS/IdP/Office/SaaS tenants.
  answer_sources:
