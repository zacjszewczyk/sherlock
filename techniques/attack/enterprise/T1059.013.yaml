- question: 'Using deterministic rule logic, can you determine whether ''Failed/blocked control-plane
    attempts profiling'' indicates abuse of container CLI/API tooling for adversary execution (T1059.013)?
    Specifically: Treat denied container control-plane operations as a distinct signal. Alert on Kubernetes
    apiserver audit `responseStatus.code` 401/403 (Unauthorized/Forbidden) on exec, create, or secret-read
    verbs, Docker daemon API auth failures, and `AccessDenied` on EKS/CloudTrail container actions. A
    burst of 403s from one principal/source IP indicates RBAC enumeration or stolen-credential probing
    preceding successful abuse ([Kubernetes Unauthorized Access, Splunk](https://research.splunk.com/cloud/9b5f1832-e8b9-453f-93df-07a3d6a72a45/);
    [Key Kubernetes audit logs, Datadog](https://www.datadoghq.com/blog/key-kubernetes-audit-logs-for-monitoring-cluster-security/)).'
