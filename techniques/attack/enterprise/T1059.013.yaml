- question: 'Using statistical baselining, can you determine whether ''Execution context rarity scoring''
    indicates abuse of container CLI/API tooling for adversary execution (T1059.013)? Specifically: Maintain
    a rolling 30-day baseline of container CLI/API usage keyed by (host, user, namespace, parent process,
    verb, image, argument class). Flag first-seen tuples, usage in the bottom 1st percentile of expected
    frequency, and Frequency anomalies — exec/create counts/min above the per-identity 99th percentile
    (e.g., >5 `exec` calls/min where the identity normally issues <1). Use median-absolute-deviation /
    modified Z-score (|score|>3.5) so batch automation does not inflate thresholds, and score 401/403
    failure-rate spikes (State metric) separately ([Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    Derive dataset-specific cutoffs from each cluster''s own history. Surface the top-3 deviating features
    (e.g., first-seen image, off-hours, failure burst) in the alert.'
