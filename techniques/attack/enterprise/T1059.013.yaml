name: 'T1059.013: Container CLI/API'
id: c53b084c-7d83-4f42-8063-8b32e9ace88b
description: 'This playbook helps an analyst determine whether an adversary has abused container platform
  command-line tools or API/SDK calls (Docker CLI/daemon API, Docker Compose, podman, crictl, kubectl,
  oc, and client libraries such as the Docker SDK for Python or Kubernetes Go/Python clients) to execute
  malicious commands in containerized environments (T1059.013). It supports two investigative threads.
  First, host- and control-plane-centric abuse: container management execution that originates from an
  atypical host or user context or a suspicious parent process and performs privileged actions (exec,
  run --privileged, --pid=host, hostPath/hostNetwork mounts, apply/create of privileged pods, service-account
  token or secret access). It correlates process-creation telemetry (Windows 4688, Sysmon EID 1, auditd
  execve) with Docker/containerd daemon events and Kubernetes apiserver/audit logs and EKS CloudTrail,
  confirms runtime shells spawned inside containers (Falco/Tetragon), profiles denied 401/403 control-plane
  attempts, baselines execution-context rarity, models in-container syscall behavior, and applies sequence/cluster-level
  ML for explainable detection. Second, network-centric follow-on: container CLI/API actions (pull, run,
  exec, image push) followed by outbound connections to rare or suspicious registry/C2 destinations, profiled
  via Zeek/PCAP correlation, connection-rarity and egress-failure baselining, and anomaly scoring on post-execution
  flows. Detection blends symbolic-logic rules, statistical baselining (percentiles, modified Z-score/MAD,
  entropy, syscall-frequency vectors), and machine learning (sequence classifiers, Markov/autoencoder
  models) to produce evasion-resistant, explainable alerts for the Execution tactic in container and cloud
  environments.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
