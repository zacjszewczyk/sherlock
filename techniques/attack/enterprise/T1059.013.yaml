  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: Execution context rarity scoring\nWINDOW = sliding(1m..30d\
      \ baseline)\nFOR EACH tuple(host,user,namespace,parent,verb,image,arg_class):\n  freq      = count(exec/create\
      \ per min)\n  fail_rate = count(responseStatus IN [401,403]) / count(*)\n  score     = modified_zscore(freq)\
      \   // MAD-based, |score|>3.5\nBASELINE per-cluster from its own 30d history\nALERT WHEN first_seen(tuple)\
      \ OR freq_pctile > p99 OR |score| > 3.5\n  OR fail_rate spike (state metric)\n  REPORT top-3 deviating\
      \ features (first-seen image, off-hours, failure burst)"
- question: 'Using statistical baselining, can you determine whether ''Syscall-frequency baseline of in-container
    commands'' indicates abuse of container CLI/API tooling for adversary execution (T1059.013)? Specifically:
    Build per-image/per-service baselines of in-container behavior as syscall-frequency (Bag of System
    Calls) vectors over short sliding windows, or as syscall n-gram sequence probabilities, and flag windows
    whose distribution diverges from the service norm after a CLI/API exec. Training-less variants compare
    kernel-event distributions across identical replicas to flag the diverging replica without a learned
    model ([Applying Bag of System Calls](https://arxiv.org/abs/1611.03053); [Probabilistic Real-Time
    Intrusion Detection System for Docker Containers](https://www.semanticscholar.org/paper/Probabilistic-Real-Time-Intrusion-Detection-System-Srinivasan-Kumar/0dcb0f6625e1b7059cdb58bef3fba32c95c6a4ce);
    [ReplicaWatcher](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf)).'
