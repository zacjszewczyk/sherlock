- question: 'Using a machine-learning model, can you determine whether ''Sequence classifier for suspicious
    invocations'' indicates abuse of container CLI/API tooling for adversary execution (T1059.013)? Specifically:
    Train a sequence/anomaly model on ordered container-management events (parent process -> CLI/API call
    -> runtime action -> follow-on process/network activity) using syscall-sequence graphs or self-supervised
    hybrid learning to tolerate drift and reduce false positives. Alert when the model assigns high malicious
    probability AND the sequence includes rare privilege-bearing operations; require the alert to list
    the top-3 contributing features (e.g., exec subresource, privileged flag, off-baseline image) for
    triage. Run in parallel with deterministic rules — never as a replacement ([CHIDS](https://dl.acm.org/doi/10.1145/3560810.3564266);
    [SHIL](https://dl.acm.org/doi/10.1145/3665795); [CDL](https://dl.acm.org/doi/10.1145/3427228.3427236);
    [AI-Driven Container Security: A Survey](https://arxiv.org/pdf/2302.13865)). Validate with emulated
    abuse from [Stratus Red Team](https://github.com/DataDog/stratus-red-team) and labeled data such as
    [A Kubernetes Dataset for Misuse Detection](https://www.itu.int/dms_pub/itu-s/opb/jnl/S-JNL-VOL4.ISSUE2-2023-A26-PDF-E.pdf).'
