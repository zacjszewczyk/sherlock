questions:
- question: 'Using deterministic rule logic, can you determine whether ''Unauthorized container CLI execution
    tracking'' indicates abuse of container CLI/API tooling for adversary execution (T1059.013)? Specifically:
    Correlate process-creation logs (Sysmon EID 1 / Windows 4688 / auditd execve) with Docker/containerd
    daemon events and Kubernetes apiserver audit logs to detect docker/podman/crictl/kubectl/oc commands
    run by hosts or users outside designated admin groups. Alert when parent-process lineage is outside
    approved management/CI tooling AND arguments request privileged actions (`exec`, `run --privileged`,
    `--pid=host`, hostPath/hostNetwork mounts, `apply`/`create` of privileged pods, or service-account
    token access). On Kubernetes, key on apiserver audit `objectRef.subresource=exec`/`attach` and privileged
    `pods` create verbs, distinguishing controller/service-account automation from interactive principals
    via `user.username`, `sourceIPs`, and `userAgent` ([Key Kubernetes audit logs, Datadog](https://www.datadoghq.com/blog/key-kubernetes-audit-logs-for-monitoring-cluster-security/);
    [Kubernetes User Exec into Pod, Elastic](https://www.elastic.co/guide/en/security/8.18/kubernetes-user-exec-into-pod.html);
    [SigmaHQ Rules Release r2024-03-26](https://blog.sigmahq.io/sigmahq-rules-release-highlights-r2024-03-26-50b086b2f540)).
    Allow-list authorized admin tooling and identities per [NIST SP 800-190](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-190.pdf)
    and [Kubernetes Hardening Guidance, NSA CISA](https://media.defense.gov/2022/Aug/29/2003066362/-1/-1/0/CTR_KUBERNETES_HARDENING_GUIDANCE_1.2_20220829.PDF).'
  context: 'Tactic context (TA0002 / Execution): the adversary is trying to run malicious code, here by
    abusing built-in container CLIs (docker, podman, crictl, kubectl, oc) or the Docker/Kubernetes API
    and SDKs to pull/build images, deploy containers, exec into running containers, or enumerate the environment.
    Evidence under investigation: Container management execution (docker, podman, kubectl, oc, or equivalent
    API client) occurs from an atypical host/user context or suspicious parent process and performs privileged
    actions (for example exec, run, apply, or create), indicating likely abuse of legitimate container
    administration interfaces for adversary execution. Approach (Unauthorized container CLI execution
    tracking): Correlate process-creation logs (Sysmon EID 1 / Windows 4688 / auditd execve) with Docker/containerd
    daemon events and Kubernetes apiserver audit logs to detect docker/podman/crictl/kubectl/oc commands
    run by hosts or users outside designated admin groups. Alert when parent-process lineage is outside
    approved management/CI tooling AND arguments request privileged actions (`exec`, `run --privileged`,
    `--pid=host`, hostPath/hostNetwork mounts, `apply`/`create` of privileged pods, or service-account
    token access). On Kubernetes, key on apiserver audit `objectRef.subresource=exec`/`attach` and privileged
    `pods` create verbs, distinguishing controller/service-account automation from interactive principals
    via `user.username`, `sourceIPs`, and `userAgent` ([Key Kubernetes audit logs, Datadog](https://www.datadoghq.com/blog/key-kubernetes-audit-logs-for-monitoring-cluster-security/);
    [Kubernetes User Exec into Pod, Elastic](https://www.elastic.co/guide/en/security/8.18/kubernetes-user-exec-into-pod.html);
    [SigmaHQ Rules Release r2024-03-26](https://blog.sigmahq.io/sigmahq-rules-release-highlights-r2024-03-26-50b086b2f540)).
    Allow-list authorized admin tooling and identities per [NIST SP 800-190](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-190.pdf)
    and [Kubernetes Hardening Guidance, NSA CISA](https://media.defense.gov/2022/Aug/29/2003066362/-1/-1/0/CTR_KUBERNETES_HARDENING_GUIDANCE_1.2_20220829.PDF).
    A positive result means container management was driven from an unauthorized host/user/parent context,
    performed privilege-bearing or anomalous operations, or chained into suspicious runtime/network behavior;
    a negative result means the activity matches approved admin/CI-CD tooling and baselined cluster behavior.
    Investigate the named area of interest (Container orchestration control plane hosts, administrator
    jump boxes, Linux hosts with container runtimes, privileged user workstations on the management VLAN.)
    and pivot from any hit to the initiating identity, service-account token, source IP/userAgent, image
    provenance, and downstream discovery, secret access, lateral movement, or egress.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - Docker daemon events
  - containerd events
  - Kubernetes audit logs
  - CloudTrail EKS API logs
  - 'NAI: Container orchestration control plane hosts, administrator jump boxes, Linux hosts with container
    runtimes, privileged user workstations on the management VLAN.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Unauthorized container CLI execution tracking\nMATCH proc_creation\
      \ (4688 / sysmon:1 / auditd:execve) AS p\n  JOIN docker:events / kubernetes:apiserver / kubernetes:audit\
      \ / CloudTrail AS api\n  ON p.host = api.host WITHIN 5m\nWHERE p.image IN ['docker','podman','crictl','kubectl','oc']\n\
      \  AND ( p.parent NOT IN approved_ci_admin_tooling\n        OR p.user NOT IN admin_groups\n    \
      \    OR api.verb IN ['exec','attach','create']\n        OR p.cmdline MATCHES /(--privileged|--pid=host|hostPath|hostNetwork|kube-system|serviceaccount|token)/\
      \ )\n  AND distinguish(api.userAgent, api.user.username, api.sourceIPs) = interactive_principal\n\
      THEN alert(severity='high', enrich=[parent_lineage, verb, image, sa_token])"
- question: 'Using deterministic rule logic, can you determine whether ''Runtime shell-in-container confirmation''
    indicates abuse of container CLI/API tooling for adversary execution (T1059.013)? Specifically: Use
    Falco/Tetragon syscall telemetry to confirm that a container CLI/API exec actually spawned an interactive
    shell or interpreter (`/bin/sh`, `/bin/bash`, `python`) inside a running container, or that a freshly
    run image immediately executed package managers, `curl`/`wget`, or miner binaries. Alert when a shell
    is spawned in a container with no interactive TTY attached (automation anomaly) or when execution
    diverges from the container image''s expected entrypoint ([Falco Default Rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml);
    [Detecting cryptojacking with Falco, Sysdig](https://sysdig.com/blog/detecting-cryptojacking-with-falco/)).'
