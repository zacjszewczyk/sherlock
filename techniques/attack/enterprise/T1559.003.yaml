name: 'T1559.003: XPC Services'
id: d4a12f76-2d18-4882-8339-ba31168d62d0
description: 'Investigate potential abuse of macOS XPC (cross-process communication) services for local
  code execution and privilege escalation. Adversaries can pass malicious content to a privileged XPC
  service daemon (which often runs as root) via the low-level XPC C API or the NSXPCConnection API, abusing
  improper client validation (e.g. PID-based checks) or poor input sanitization to coerce privileged actions.
  This playbook helps an analyst hunt for: XPC service/helper executions matching threat-intelligence
  indicators or carrying high-entropy paths and signing failures; write-then-execute sequences that drop
  and run .xpc/.appex bundles from user-writable directories; suspicious IPC client-server pairs where
  script interpreters or network utilities invoke high-privilege system services; XPC binaries executing
  from non-standard paths, unsigned/invalidly signed, or carrying novel/untrusted signers; and system
  XPC services spawned by unexpected (non-launchd, non-application) parents. It combines deterministic
  symbolic-logic floors, statistical baselining of frequency, entropy, and rarity, and machine-learning
  anomaly/sequence/graph models to surface XPC execution abuse on macOS endpoints.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any executed XPC service or privileged helper tool match a known-bad threat-intelligence
    indicator by SHA256 hash, signing-certificate thumbprint, or file path?
  context: 'Execution: This is the deterministic floor for catching known-malicious XPC abuse. Using the
    macOS Endpoint Security framework, capture every exec of an XPC service or helper tool along with
    its parent lineage and code-signing fields, then join those events against code-signature metadata
    and your threat-intelligence feeds. Any match on process SHA256, signer certificate thumbprint, or
    file path is a high-confidence hit indicating an adversary is running previously-attributed malicious
    code through XPC. A positive result warrants immediate triage and host isolation; a negative result
    does not clear the host because novel tooling will not be in TI. Keep this match enabled permanently
    and independent of any ML score so it acts as a reliable safety net.'
  answer_sources:
  - 'Endpoint: Process Creation Events'
  - 'Endpoint: Code Signature Information'
  - 'NAI: macOS endpoints, particularly developer workstations, critical servers, and systems running
    custom macOS applications.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=edr sourcetype=macos:esf event IN (exec) (process=*xpc* OR is_xpc_service=true OR is_helper_tool=true)

      | join type=left process_sha256 signer_cert_thumbprint process_path [ inputlookup ti_indicators
      ]

      | where ti_match IN ("sha256","cert_thumbprint","path")

      | table _time host process_path process_sha256 signer_cert_thumbprint parent_process ti_source'
- question: Are any XPC services executing from file paths with abnormally high Shannon entropy relative
    to the host's own baseline, suggesting randomized malware paths?
  context: 'Execution: Malware frequently drops payloads to randomized or UUID-style paths, which exhibit
    high Shannon entropy. Compute the entropy of the file path for every executed XPC service and maintain
    a rolling 30-day per-host baseline, alerting when a path''s entropy exceeds the 95th percentile derived
    from your own fleet (recompute weekly). Because legitimate cache/UUID paths also have high entropy,
    treat this as corroborating evidence to be combined with signing status, parent lineage, or TI rather
    than as a standalone verdict. A positive result flags a path worth inspecting; correlate with the
    other XPC checks before escalating.'
  answer_sources:
  - 'Endpoint: Process Creation Events'
  - 'Endpoint: Code Signature Information'
  - 'NAI: macOS endpoints, particularly developer workstations, critical servers, and systems running
    custom macOS applications.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr sourcetype=macos:esf event=exec is_xpc_service=true

      | eval path_entropy=shannon_entropy(process_path)

      | eventstats p95(path_entropy) as p95_entropy by host

      | where path_entropy > p95_entropy

      | table _time host process_path path_entropy p95_entropy signer code_signature_status'
- question: Is the per-host rate or ratio of unsigned, invalid, or revoked-signature XPC/helper executions
    abnormally elevated compared to validly signed executions?
  context: 'Execution: Managed Macs almost never run unsigned or invalidly-signed XPC services, so the
    signing-failure rate is a distinct and powerful signal. Using Endpoint Security signing fields, track
    per-host the count/hour and the ratio of XPC/helper execs that are unsigned or carry an INVALID/revoked
    signature versus validly signed ones. Baseline the failure ratio (typically near zero) and alert when
    unsigned/invalid execs exceed mean+3 sigma, or on any single invalid-signature XPC exec. A spike implies
    an adversary is running tampered or self-signed code through XPC, possibly to escalate privileges;
    a near-zero ratio is reassuring but should still be re-baselined over time.'
  answer_sources:
  - 'Endpoint: Process Creation Events'
  - 'Endpoint: Code Signature Information'
  - 'NAI: macOS endpoints, particularly developer workstations, critical servers, and systems running
    custom macOS applications.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr sourcetype=macos:esf event=exec is_xpc_service=true

      | eval bad_sig=if(code_signature_status IN ("unsigned","invalid","revoked"),1,0)

      | bucket _time span=1h | stats sum(bad_sig) as bad, count as total by host _time

      | eval ratio=bad/total

      | eventstats avg(bad) as mu stdev(bad) as sd by host

      | where bad > mu+3*sd OR bad_sig_invalid>0'
- question: Does the observed hourly volume of XPC-service executions on any endpoint exceed the forecasted
    upper bound, indicating an anomalous execution burst?
  context: 'Execution: A sudden burst of XPC executions can indicate automated abuse, mass payload launching,
    or a privilege-escalation loop. Fit a per-endpoint time-series model (ARIMA or Prophet) on hourly
    XPC-service exec volume and alert when the observed count exceeds the 99% forecast upper bound. Run
    this in parallel with the deterministic TI and signing rules so it never replaces them. To make the
    alert actionable, include the top-3 contributing factors such as the forecast-vs-observed delta, the
    contributing service name, and the contributing parent process, so analysts can triage the burst rather
    than seeing only a bare anomaly score.'
  answer_sources:
  - 'Endpoint: Process Creation Events'
  - 'Endpoint: Code Signature Information'
  - 'NAI: macOS endpoints, particularly developer workstations, critical servers, and systems running
    custom macOS applications.'
  range: Last 90 days; model on >=30 days history, evaluate hourly
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = Prophet().fit(hourly_xpc_exec_counts[host])\nforecast = model.predict(next_hour)\n\
      if observed_count > forecast.yhat_upper:\n    alert(host, observed_count, forecast.yhat_upper,\n\
      \          top3=[forecast_delta, top_service_name, top_parent_process])"
- question: Did a process create a .xpc or .appex file in a user-writable directory and then have one
    of its child processes execute that same file within roughly 60 seconds?
  context: 'Execution: This write-then-execute sequence is a classic local code-execution pattern: an
    adversary drops an XPC bundle to a writable location (e.g. /tmp, /Users/Shared, ~/Library/Caches)
    and immediately runs it. Correlate file-creation and exec events from the Endpoint Security framework
    and alert when process A creates a file ending in .xpc or .appex in a monitored user-writable directory
    and a child of A executes that same file within 60 seconds. Keep this concrete sequence as a deterministic
    floor. A positive match strongly indicates staged execution; investigate the writer process, its origin,
    and the dropped bundle''s signature.'
  answer_sources:
  - 'Endpoint: File Creation Events'
  - 'Endpoint: Process Creation Events'
  - 'NAI: User-writable directories on macOS endpoints, such as /tmp, /Users/Shared, ~/Library/Caches,
    and ~/Library/Application Support.'
  range: Last 90 days; 60-second correlation window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=edr sourcetype=macos:esf event=file_create file_path IN (\"/tmp/*\",\"/Users/Shared/*\"\
      ,\"*/Library/Caches/*\")\n  (file_path=*.xpc OR file_path=*.appex)\n| join file_path [ search event=exec\
      \ ] \n| where exec_parent_pid=create_pid AND (exec_time - create_time) <= 60\n| table _time host\
      \ create_process file_path exec_process exec_parent_pid"
- question: Which writer processes show an abnormal daily spike in write-then-execute XPC-bundle pairs
    compared to their 30-day baseline?
  context: 'Execution: Beyond individual sequences, a surge in write-then-execute pairs for a given writer
    process (e.g. Installer, bash, curl) can reveal scripted or automated staging activity. For each unique
    writer process name, count daily write-then-execute XPC-bundle pairs, compute the 30-day mean and
    standard deviation, and alert when a process exceeds mean+3 sigma. Derive thresholds per-environment
    and review monthly. A positive result points at a writer that is suddenly dropping and running many
    bundles, which is unusual for legitimate tooling and merits investigation of what is being staged
    and why.'
  answer_sources:
  - 'Endpoint: File Creation Events'
  - 'Endpoint: Process Creation Events'
  - 'NAI: User-writable directories on macOS endpoints, such as /tmp, /Users/Shared, ~/Library/Caches,
    and ~/Library/Application Support.'
  range: Last 90 days; daily aggregation over 30-day baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr sourcetype=macos:esf write_exec_xpc_pair=true

      | bin _time span=1d | stats count as pairs by writer_process _time

      | eventstats avg(pairs) as mu stdev(pairs) as sd by writer_process

      | where pairs > mu+3*sd

      | table _time writer_process pairs mu sd'
- question: Do any write-then-execute XPC sequences score as malicious (probability > 0.9) under a supervised
    classifier trained on labeled examples?
  context: 'Execution: A supervised model can capture subtle combinations that fixed rules miss. Train
    a gradient-boosting or logistic-regression classifier on labeled write-then-execute sequences using
    features such as parent process name/path, file-path entropy, the time delta between write and execute,
    the code-signature status of the new service, and whether the parent is a script interpreter. Alert
    when the predicted probability exceeds 0.9 and surface the top-3 contributing features in the alert
    text for explainability. Periodically measure the false-negative rate against held-out and unseen
    samples to ensure the model still catches novel staging. A high-probability hit means the sequence
    resembles known malicious staging and should be triaged with the contributing features in mind.'
  answer_sources:
  - 'Endpoint: File Creation Events'
  - 'Endpoint: Process Creation Events'
  - 'NAI: User-writable directories on macOS endpoints, such as /tmp, /Users/Shared, ~/Library/Caches,
    and ~/Library/Application Support.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [parent_name, parent_path, path_entropy, write_exec_delta, new_svc_sig_status,\
      \ parent_is_interpreter]\np = gbm.predict_proba(features)\nif p > 0.9:\n    alert(host, sequence_id,\
      \ prob=p, top3=explain(features))"
- question: Did a watchlisted script interpreter or network utility (bash, sh, zsh, python, osascript,
    curl, wget) issue an IPC/XPC connection to a high-privilege system service such as com.apple.securityd
    or com.apple.opendirectoryd?
  context: 'Execution: Coerced privileged XPC calls frequently originate from generic scripting or networking
    tools rather than legitimate first-party applications. Maintain watchlists of suspicious client process
    names and of high-privilege XPC service names, then alert on any IPC/connection event where a watchlisted
    client invokes a watchlisted privileged service. This deterministic pairing rule directly targets
    the abuse pattern where an attacker scripts requests to securityd/opendirectoryd and similar daemons.
    A positive hit indicates a tool that should not normally talk to a root daemon is doing so; investigate
    the command line, parentage, and what privileged action was requested.'
  answer_sources:
  - 'Endpoint: IPC Connection Events'
  - 'Endpoint: Process Creation Events'
  - 'NAI: System-level XPC services on all macOS endpoints; IPC communication channels and process relationship
    graphs monitored by endpoint security tools.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=edr sourcetype=macos:esf event=ipc_connect\n| where client_process IN (\"bash\",\"sh\"\
      ,\"zsh\",\"python\",\"osascript\",\"curl\",\"wget\")\n  AND xpc_service IN (\"com.apple.securityd\"\
      ,\"com.apple.opendirectoryd\")\n| table _time host client_process client_pid xpc_service requested_action"
- question: Did a privileged XPC helper accept a connection from a client whose audit-token-verified code
    signature or team ID is untrusted, absent, or invalid?
  context: 'Execution: PID-based client validation is the canonical XPC vulnerability class because PIDs
    are reused and spoofable; secure validation uses the audit token to derive the caller''s real code
    identity. Using the Endpoint Security audit-token-derived identity, alert when a privileged XPC helper
    accepts a connection from a client whose verified code signature or team ID is untrusted or absent.
    An untrusted/abnormal client identity reaching a privileged service is a strong indicator of an exploitation
    attempt against improper XPC validation. A positive result means a service trusted a caller it should
    have rejected; review the helper, the client binary, and whether privilege escalation occurred.'
  answer_sources:
  - 'Endpoint: IPC Connection Events'
  - 'Endpoint: Process Creation Events'
  - 'NAI: System-level XPC services on all macOS endpoints; IPC communication channels and process relationship
    graphs monitored by endpoint security tools.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=edr sourcetype=macos:esf event=xpc_accept is_privileged_service=true\n| where client_team_id=\"\
      \" OR client_sig_status IN (\"untrusted\",\"invalid\",\"absent\")\n    OR NOT match(client_team_id,\
      \ trusted_team_ids)\n| table _time host xpc_service client_process client_team_id client_sig_status\
      \ audit_token"
- question: Is any connection to a privileged XPC service coming from a client process that is statistically
    rare for that service, or showing an abnormal rate of failed/denied XPC connections?
  context: 'Execution: Each privileged XPC service has a characteristic set of legitimate client processes.
    Build a historical frequency distribution of connecting client process names per service and alert
    when a connection comes from a client in the bottom 5th percentile (a rare client-server pair). Separately,
    track the rate of FAILED or denied XPC connections per client as a distinct failure-mode signal, since
    exploitation attempts often probe and get rejected before succeeding. A rare client or a burst of
    denied connections suggests reconnaissance or an exploitation attempt against the service; correlate
    with audit-token identity and parentage to confirm.'
  answer_sources:
  - 'Endpoint: IPC Connection Events'
  - 'Endpoint: Process Creation Events'
  - 'NAI: System-level XPC services on all macOS endpoints; IPC communication channels and process relationship
    graphs monitored by endpoint security tools.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr sourcetype=macos:esf event IN (xpc_connect, xpc_denied) is_privileged_service=true

      | stats count as c by xpc_service client_process status

      | eventstats sum(c) as total perc5(c) as p5 by xpc_service

      | where (status="connect" AND c <= p5) OR status="denied"

      | table xpc_service client_process status c p5'
- question: Do graph-based embeddings of the process/XPC-connection provenance graph reveal outlier client
    or service nodes indicating anomalous IPC relationships?
  context: 'Execution: Some XPC abuse is only visible in the structure of process relationships rather
    than in any single event. Build a provenance graph with process nodes and directed XPC-connection
    edges, learn node embeddings (e.g. GraphSAGE), and score outlier client/service nodes. Rather than
    emitting a bare anomaly score, surface the offending node and its causal subgraph so an analyst can
    follow the chain of how an unusual client came to talk to a privileged service. Run this in parallel
    with the deterministic watchlist and audit-token rules. An outlier node with a suspicious subgraph
    is a lead for deeper investigation of lateral or privilege-escalation activity.'
  answer_sources:
  - 'Endpoint: IPC Connection Events'
  - 'Endpoint: Process Creation Events'
  - 'NAI: System-level XPC services on all macOS endpoints; IPC communication channels and process relationship
    graphs monitored by endpoint security tools.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_provenance_graph(process_nodes, xpc_connection_edges)\nemb = GraphSAGE(G).node_embeddings()\n\
      outliers = anomaly_score(emb)\nfor n in outliers:\n    alert(node=n, subgraph=causal_subgraph(G,\
      \ n))"
- question: Did any XPC service execute from a path outside /System, /Library, or /Applications, or with
    an unsigned/invalid signature, or signed by a certificate issuer not on the enterprise-approved CA
    list?
  context: 'Execution: Legitimate XPC services live in known system/application locations and are validly
    signed by trusted authorities. Alert on XPC-service execs where the path is not under /System/, /Library/,
    or /Applications/, OR the code-signature status is unsigned/invalid, OR the signing certificate issuer
    is not on the enterprise-approved CA list, using Endpoint Security signing fields. Retain this as
    a deterministic floor. Any of these conditions points to an XPC binary that does not belong, such
    as a dropped payload or a tampered helper. A positive result should trigger inspection of the binary''s
    origin, signer, and whether it attempted privileged actions.'
  answer_sources:
  - 'Endpoint: Process Creation Events'
  - 'Endpoint: Code Signature Information'
  - 'NAI: File systems of macOS endpoints, particularly non-standard locations like /private/tmp/, /Users/Shared/,
    and user home directories; Enterprise certificate trust stores.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=edr sourcetype=macos:esf event=exec is_xpc_service=true\n| where NOT (process_path LIKE\
      \ \"/System/%\" OR process_path LIKE \"/Library/%\" OR process_path LIKE \"/Applications/%\")\n\
      \    OR code_signature_status IN (\"unsigned\",\"invalid\")\n    OR NOT match(signer_cert_issuer,\
      \ approved_ca_list)\n| table _time host process_path code_signature_status signer_cert_issuer"
- question: Has an XPC service executed under a signer certificate subject or team ID never previously
    seen in the environment, or one closely resembling a known signer (possible typosquat)?
  context: 'Execution: First-seen or look-alike signers are a useful novelty signal for malicious or impersonating
    XPC binaries. Maintain the historical set of signer certificate subjects/team IDs observed for XPC
    services; when a new service executes, alert if its signer has never been seen, or if its Levenshtein
    distance to the closest known subject exceeds the 95th percentile (indicating a possible typosquat
    of a trusted signer). Also track the daily rate of first-seen signers as a corroborating frequency
    metric. A novel or near-duplicate signer warrants verifying the binary''s authenticity before trusting
    it, especially when combined with non-standard paths or privileged IPC.'
  answer_sources:
  - 'Endpoint: Process Creation Events'
  - 'Endpoint: Code Signature Information'
  - 'NAI: File systems of macOS endpoints, particularly non-standard locations like /private/tmp/, /Users/Shared/,
    and user home directories; Enterprise certificate trust stores.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr sourcetype=macos:esf event=exec is_xpc_service=true

      | lookup known_signers signer_subject OUTPUT seen_before

      | eval lev=levenshtein(signer_subject, nearest_known_subject)

      | where isnull(seen_before) OR lev > p95_lev

      | table _time host process_path signer_subject team_id lev'
- question: Do any XPC executions score as outliers under a one-class anomaly model trained on known-good
    executions across path entropy, parent, signature status, signer, and certificate age?
  context: 'Execution: A one-class model learns the shape of normal XPC execution and flags deviations
    without needing labeled malware. Train a One-Class SVM (or isolation forest) on known-good XPC execs
    using features including file-path entropy, parent process name, code-signature status (categorical),
    signer team ID, and signing-certificate age; score new execs and alert on outliers, listing the top-3
    contributing features for explainability. Validate false-negative behavior on unseen samples so the
    model keeps catching novel binaries. An outlier indicates an XPC exec that does not resemble your
    environment''s normal activity and should be reviewed against the deterministic path/signature checks.'
  answer_sources:
  - 'Endpoint: Process Creation Events'
  - 'Endpoint: Code Signature Information'
  - 'NAI: File systems of macOS endpoints, particularly non-standard locations like /private/tmp/, /Users/Shared/,
    and user home directories; Enterprise certificate trust stores.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = OneClassSVM().fit(known_good_xpc_features)\nfeatures = [path_entropy, parent_name,\
      \ sig_status, signer_team_id, cert_age_days]\nif model.predict(features) == -1:\n    alert(host,\
      \ process_path, top3=explain(features))"
- question: Was a known system XPC service (e.g. com.apple.airportd) launched by a parent process that
    is not launchd (PID 1) or its expected parent application?
  context: 'Execution: Legitimate system XPC services are launchd-managed and started on demand, so a
    system XPC service launched by anything other than launchd or its known application parent is anomalous
    and may indicate injection or coercion. Maintain an allow-list mapping each legitimate system XPC
    service to its expected parent(s) (e.g. com.apple.airportd -> launchd) and alert on any exec where
    an XPC service is launched by a parent not on its allow-list. A positive result reveals an unexpected
    parent (such as a browser, terminal, or document editor) spawning a privileged service, which is a
    strong lead for execution or privilege-escalation abuse.'
  answer_sources:
  - 'Endpoint: Process Creation Events'
  - 'NAI: Process trees on all macOS endpoints, focusing on children of common user-facing applications
    like browsers, terminal emulators, and document editors.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=edr sourcetype=macos:esf event=exec is_xpc_service=true

      | lookup xpc_parent_allowlist xpc_service OUTPUT allowed_parents

      | where NOT match(parent_process, allowed_parents)

      | table _time host xpc_service parent_process parent_pid parent_path'
- question: For each XPC service, which parent process names are statistically rare (appearing in under
    0.1% of that service's launches) over the trailing 30 days?
  context: 'Execution: Even without a curated allow-list, rare parent-child pairings expose anomalous
    launches. For each XPC service name, build a 30-day frequency table of parent process names and alert
    when a parent appears in fewer than 0.1% of that service''s launches. Derive the rarity cut from your
    own fleet and refresh weekly. A rare parent for a given service suggests an atypical launch path that
    could reflect process injection or coercion of the service; correlate the flagged event with the allow-list
    rule and signature checks to confirm whether it is benign drift or genuine abuse.'
  answer_sources:
  - 'Endpoint: Process Creation Events'
  - 'NAI: Process trees on all macOS endpoints, focusing on children of common user-facing applications
    like browsers, terminal emulators, and document editors.'
  range: Last 90 days; 30-day frequency baseline refreshed weekly
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr sourcetype=macos:esf event=exec is_xpc_service=true earliest=-30d

      | stats count as c by xpc_service parent_process

      | eventstats sum(c) as total by xpc_service

      | eval frac=c/total

      | where frac < 0.001

      | table xpc_service parent_process c frac'
- question: Does a sequence model of per-host exec/IPC events flag any XPC-service spawn whose parent->child
    relationship falls outside the predicted top-k next events?
  context: 'Execution: Modeling the ordered stream of events per host captures behavioral context that
    point rules miss. Model the ordered sequence of exec/IPC events per host with an LSTM (DeepLog-style);
    when an XPC service is spawned, flag it if the parent->child(XPC) event is outside the predicted top-k
    next events, surfacing the unexpected predicted-vs-actual event for explainability. Optionally add
    a Random Forest over parent name/path/args, child name, and user context, reporting the top-3 feature
    contributions and measuring false negatives against unseen attacks. A flagged out-of-sequence spawn
    indicates the XPC launch did not follow the host''s learned normal behavior and is a candidate for
    investigation of injected or coerced execution.'
  answer_sources:
  - 'Endpoint: Process Creation Events'
  - 'NAI: Process trees on all macOS endpoints, focusing on children of common user-facing applications
    like browsers, terminal emulators, and document editors.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = ordered_exec_ipc_events[host]\npred = lstm_deeplog.predict_next(seq[:-1], k=top_k)\n\
      if xpc_spawn_event(parent->child) not in pred:\n    alert(host, event=xpc_spawn, predicted=pred,\
      \ actual=parent_child)\n# optional: rf.predict_proba([parent_name,parent_path,parent_args,child_name,user])"
