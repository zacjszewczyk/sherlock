name: 'T1598.003: Spearphishing Link'
id: 0162782f-b008-4596-8ffe-2640ea608003
description: 'Investigate evidence that an adversary used a spearphishing link to elicit sensitive information
  (commonly credentials) from targeted users as part of reconnaissance. This playbook helps an analyst
  hunt for: endpoints resolving or connecting to phishing/credential-harvest infrastructure on threat
  intelligence; DNS/HTTP requests for URLs with phishing characteristics such as typosquatting, schema
  obfuscation (e.g., ''google.com@1.2.3.4''), URL shorteners, and credential keywords (''login'',''verify'',''sso'',''mfa'');
  coordinated campaign fan-out where many distinct hosts connect to a single newly observed or low-reputation
  domain; outbound HTTP POSTs (credential/form submission) to non-allow-listed or known-bad destinations;
  short-lived low-byte ''tracking pixel''/web-bug pingbacks that validate email receipt; mobile QR-code
  phishing (''quishing'') connections; and anomalous browser child processes consistent with Browser-in-the-Browser
  (BitB) frameworks. Each question pairs symbolic-logic rules, statistical baselines, and machine-learning
  methods against network (Zeek dns/conn/http) and endpoint (Windows Event ID 4688) telemetry so the analyst
  can confirm or rule out an active spearphishing-for-information campaign.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
