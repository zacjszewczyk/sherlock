    to the resolved mobile destination. A positive result is corroborating evidence that a user received
    a spearphishing link and interacted with adversary-controlled infrastructure to divulge information;
    a negative result helps rule out this evidence path. Pivot on the source host, destination, and timestamp
    to correlate with mail-gateway delivery, browser activity, and any credential submission.
  answer_sources: &id006
  - Zeek dns.log
  - Zeek conn.log
  - Zeek http.log
