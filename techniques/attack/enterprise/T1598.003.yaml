    HTML/JS classifier to flag external credential `<form action>` targets, per [Prophiler](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf).
    A positive result is corroborating evidence that a user received a spearphishing link and interacted
    with adversary-controlled infrastructure to divulge information; a negative result helps rule out
    this evidence path. Pivot on the source host, destination, and timestamp to correlate with mail-gateway
    delivery, browser activity, and any credential submission.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [uri_path_structure, content_type, dest_reputation, dest_age, data_volume]
      DBSCAN.fit(post_events)
      investigate clusters around low-reputation/new domains; report top3 defining features
      if landing page retrievable: static_html_js_classifier(form action target)
- question: '[Symbolic Logic] Short-lived low-byte pingback rule: how can we determine whether following
    an email being accessed, an endpoint makes an immediate, short-lived network connection with minimal
    data transfer to a suspicious domain, consistent with a tracking pixel or web bug used to validate
    email receipt?'
  context: Relevant to the Reconnaissance tactic for Spearphishing Link (T1598.003). Trigger when a DNS
    query (Zeek dns.log) for a domain is immediately followed (within 2 seconds) by a TCP connection (Zeek
    conn.log) from the same source IP where total bytes (orig_bytes+resp_bytes) < 500 and duration < 1
    second; alert if the domain is newly observed or low-reputation. Such single-pixel beacons validate
    email receipt and profile victim IP, per the tracking-pixel/web-bug tradecraft described for this
    technique and the URL-obfuscation reporting ([Mandiant URL Obfuscation](https://cloud.google.com/blog/topics/threat-intelligence/url-obfuscation-schema-abuse/)).
    A positive result is corroborating evidence that a user received a spearphishing link and interacted
    with adversary-controlled infrastructure to divulge information; a negative result helps rule out
    this evidence path. Pivot on the source host, destination, and timestamp to correlate with mail-gateway
    delivery, browser activity, and any credential submission.
  answer_sources: &id005
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: User Workstations (specifically email client processes), Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      if dns_query(domain) at t0
         AND tcp_conn from same src within 2s
         AND (orig_bytes+resp_bytes) < 500
         AND duration < 1s
         AND domain newly_observed OR low_reputation:
            alert (tracking-pixel/web-bug pingback)
- question: '[Statistical Method] Connection volume/duration percentile baseline: how can we determine
    whether following an email being accessed, an endpoint makes an immediate, short-lived network connection
