    interacted with adversary-controlled infrastructure to divulge information; a negative result helps
    rule out this evidence path. Pivot on the source host, destination, and timestamp to correlate with
    mail-gateway delivery, browser activity, and any credential submission.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for completed conns (zeek_conn):
        compute duration, total_bytes stats
        candidates = conns in lowest p1 for BOTH duration AND bytes
        cross-ref dest with newly_registered OR high_entropy domains -> alert
- question: '[Machine Learning] Pingback vs benign-API classifier: how can we determine whether following
    an email being accessed, an endpoint makes an immediate, short-lived network connection with minimal
    data transfer to a suspicious domain, consistent with a tracking pixel or web bug used to validate
    email receipt?'
  context: Relevant to the Reconnaissance tactic for Spearphishing Link (T1598.003). Train a logistic-regression
    (or gradient-boosted) classifier to distinguish legitimate API 'ping' traffic from malicious 'pingbacks'
    using connection duration, byte count, destination domain age, domain entropy, and user agent; alert
    on high-probability pingbacks and surface the top-3 contributing features. A positive result is corroborating
    evidence that a user received a spearphishing link and interacted with adversary-controlled infrastructure
    to divulge information; a negative result helps rule out this evidence path. Pivot on the source host,
    destination, and timestamp to correlate with mail-gateway delivery, browser activity, and any credential
    submission.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [duration, byte_count, domain_age, domain_entropy, user_agent]
      clf = LogisticRegression_or_GBM.fit(labeled)
      if clf.predict_proba(conn) high: alert; surface top3 features
- question: '[Symbolic Logic] Mobile UA + QR-phishing TI correlation: how can we determine whether a mobile
    device on the corporate network makes a direct connection to a suspicious or newly observed domain,
