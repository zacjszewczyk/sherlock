- question: 'Using symbolic logic (deterministic rule), can you determine whether ''Detect horizontal
    SMB scans'' indicates Network Share Discovery activity? Specifically: Alert when a source IP connects
    to >20 unique destination IPs on port 445/139 within 5 minutes; tune the count/window per subnet from
    your own baseline [Fast Portscan Detection Using Sequential Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  context: 'Tactic context (Discovery / TA0007): adversaries enumerate network shares to orient themselves,
    locate data to collect, and identify systems of interest for lateral movement before acting. Evidence
    under investigation: A single source host establishes SMB connections (TCP/139/445) to an anomalously
    high number of unique destination hosts or shares within a short time window, indicative of scanning.
    Scanning sources also exhibit an elevated ratio of failed/refused/no-response connections (Volume
    + Frequency + State). Approach (Detect horizontal SMB scans): Alert when a source IP connects to >20
    unique destination IPs on port 445/139 within 5 minutes; tune the count/window per subnet from your
    own baseline [Fast Portscan Detection Using Sequential Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf).
    A positive result indicates share-enumeration or anomalous share-access behavior inconsistent with
    the established baseline for that user, host, or process; a negative result means the observed activity
    matches expected, authorized usage. Investigate the named area of interest (Network TAPs and SPAN
    ports on core switches, Network Egress/Ingress points, File Servers, Domain Controllers) and pivot
    from any hit to the originating process, account, parent process, and any follow-on file listing,
    copy, or lateral-movement attempts.'
