name: 'T1135: Network Share Discovery'
id: 2a55664b-c3ec-4167-8668-362bbf5a2183
description: 'This playbook helps an analyst determine whether an adversary is performing Network Share
  Discovery (T1135): enumerating folders and drives shared on remote systems to identify data to collect
  or hosts to move to laterally. It correlates host-based process and script telemetry (net view, net
  share, PowerShell Get-SmbShare/Get-SmbMapping, smbclient -L, smbmap, rpcclient, nmblookup, crackmapexec,
  and macOS sharing -l / smbutil view / mount_smbfs) with network telemetry (Zeek conn.log/smb_mapping.log,
  NetFlow, firewall logs) and SMB access auditing (Windows Event ID 5140/5145). Investigative angles include:
  known discovery-tool hashes and command-line patterns (PowerView, SharpView, BloodHound, ShareFinder),
  discovery commands spawned from anomalous parents (winword.exe, excel.exe, w3wp.exe, outlook.exe), horizontal
  SMB scanning (one source touching many unique destinations on 139/445 with elevated failure ratios),
  anomalous user-share access patterns crossing business-unit or privilege boundaries, and non-administrative
  access to administrative shares (C$, ADMIN$, IPC$). Detection blends symbolic-logic rules, statistical
  baselining (host-prevalence, percentiles, entropy, sequential hypothesis testing, change-point detection),
  and machine learning (gradient boosting, random forest, LSTM sequence models, graph embeddings) to produce
  evasion-resistant, explainable alerts for the Discovery tactic.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
