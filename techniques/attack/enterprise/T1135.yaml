questions:
- question: 'Using symbolic logic (deterministic rule), can you determine whether ''Detect known discovery
    tool hashes'' indicates Network Share Discovery activity? Specifically: Monitor Windows Event ID 4688
    and 4104 for new processes or scripts, hash them (SHA256), and alert when the hash matches a CTI list
    of share/AD discovery tools (PowerView, SharpView, BloodHound, ShareFinder). Also match by image/original-filename
    and characteristic arguments (Find-DomainShare, Invoke-ShareFinder, Get-NetShare) so renamed binaries
    are still caught [Sigma: HackTool SharpView](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hktl_sharpview.yml).'
  context: 'Tactic context (Discovery / TA0007): adversaries enumerate network shares to orient themselves,
    locate data to collect, and identify systems of interest for lateral movement before acting. Evidence
    under investigation: A process or script executes where the file hash (e.g., SHA256) matches a known
    indicator of compromise (IOC) for network discovery tools like PowerView or BloodHound. Approach (Detect
    known discovery tool hashes): Monitor Windows Event ID 4688 and 4104 for new processes or scripts,
    hash them (SHA256), and alert when the hash matches a CTI list of share/AD discovery tools (PowerView,
    SharpView, BloodHound, ShareFinder). Also match by image/original-filename and characteristic arguments
    (Find-DomainShare, Invoke-ShareFinder, Get-NetShare) so renamed binaries are still caught [Sigma:
    HackTool SharpView](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hktl_sharpview.yml).
    A positive result indicates share-enumeration or anomalous share-access behavior inconsistent with
    the established baseline for that user, host, or process; a negative result means the observed activity
    matches expected, authorized usage. Investigate the named area of interest (Endpoint Workstation Subnets,
    Server Subnets, Domain Controllers) and pivot from any hit to the originating process, account, parent
    process, and any follow-on file listing, copy, or lateral-movement attempts.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Endpoint Workstation Subnets, Server Subnets, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Symbolic rule\nMATCH proc_create(EID 4688) OR script_block(EID 4104)\n  WHERE sha256 IN\
      \ cti_discovery_tool_hashes\n     OR original_filename IN ['PowerView','SharpView','BloodHound','ShareFinder']\n\
      \     OR cmdline MATCHES /(Find-DomainShare|Invoke-ShareFinder|Get-NetShare)/i\nTHEN alert(severity='high',\
      \ enrich=[host,user,parent])"
- question: 'Using statistical baselining, can you determine whether ''Flag rare hashes'' indicates Network
