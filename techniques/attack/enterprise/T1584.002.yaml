- question: '[Resource Development] AXFR/IXFR allowlist enforcement: Can you determine whether a DNS zone
    transfer request (AXFR or IXFR) is initiated from a source IP not on a pre-approved allowlist of secondary
    DNS servers or administrative hosts. -- specifically, using the ''AXFR/IXFR allowlist enforcement''
