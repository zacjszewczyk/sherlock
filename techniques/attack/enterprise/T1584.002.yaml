    occurs outside the victim''s direct visibility and any single method can miss stealthy record manipulation,
    domain shadowing, or low-and-slow abuse. Citations (from the source analytic plan): [Woodbridge et
    al.](https://arxiv.org/abs/1611.00791); [FANCI](https://www.usenix.org/system/files/conference/usenixsecurity18/sec18-schuppen.pdf).'
