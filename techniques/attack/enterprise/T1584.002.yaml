- question: '[Resource Development] Entropy, NXDOMAIN-rate, and new-ASN scoring: Can you determine whether
    an internal client queries a domain that is either algorithmically generated (DGA) or newly registered
    (NRD), and which resolves to an IP address with a poor reputation. -- specifically, using the ''Entropy,
    NXDOMAIN-rate, and new-ASN scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    third-party DNS servers to support later operations -- altering DNS records to redirect traffic, enabling
    collection and credential access, pairing hijacked records with attacker-issued certificates, asserting
    control of SaaS services, or quietly shadowing subdomains. This evidence focuses on the condition
    that an internal client queries a domain that is either algorithmically generated (DGA) or newly registered
    (NRD), and which resolves to an IP address with a poor reputation. This Statistical Method approach
    works as follows: Flag high-entropy domains (>99.7th percentile) and apply compression/information-content
    bounds to encoded labels (Born, Gustafson, Paxson, Nadler et al.); explicitly profile NXDOMAIN/SERVFAIL
    rates per client and alert on spikes (failure-mode signal of DGA probing/shadowing) especially when
    the eventual resolved ASN is new to the org (FANCI). A positive result -- a rule match, statistical
    outlier, or model alert -- indicates possible compromise or abuse of DNS infrastructure; pivot to
    the DNS server and account involved, the source IP/ASN/geo and its reputation, the affected zones
    and records, any newly issued certificates for the hostname in CT logs, the resolving answers seen
    across internal clients, and the process lineage on the DNS host to scope the activity. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since DNS-server compromise largely occurs outside the victim''s direct visibility
    and any single method can miss stealthy record manipulation, domain shadowing, or low-and-slow abuse.
    Citations (from the source analytic plan): [Born, Gustafson, Paxson](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf);
    [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf); [FANCI](https://www.usenix.org/system/files/conference/usenixsecurity18/sec18-schuppen.pdf).'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Network egress points, Endpoint devices, Internal recursive DNS servers'
  range: Last 90 days (correlate event-centered windows of +/- 1 hour around the anomalous DNS or login
    event)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Entropy, NXDOMAIN-rate, and new-ASN scoring (Statistical Method)

      source IN [Zeek dns.log]

      | approach: Flag high-entropy domains (>99.7th percentile) and apply compression/information-content
      bounds to encoded labels (Born, Gustafson, Paxson, Nadler et al.); explicitly profile NXDOMAIN/SERVFAIL
      rates per client and alert on spikes (failure-mode signal of DGA probing/shadowing) especially when
      the eventual resolved ASN is new to the org (FANCI).

      | correlate over NAI: Network egress points, Endpoint devices, Internal recursive DNS servers

      | emit alert with contributing fields and entity context (DNS server, account, src_ip/ASN/geo, zone,
      record, answer_ip, top-3 features)


      | citations: [Born, Gustafson, Paxson](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf);
      [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf); [FANCI](https://www.usenix.org/system/files/conference/usenixsecurity18/sec18-schuppen.pdf)'
  - technology: Zeek/pseudocode
    query: '# Entropy, NXDOMAIN-rate, and new-ASN scoring (Zeek view)

      watch dns.log/conn.log for DNS-server activity relevant to this technique

      | inspect answers (rdata/answer IPs/ASN), query types (AXFR/IXFR), TTLs, and admin connections

      | compare against TI feeds, allowlists, and per-domain baselines

      | emit candidates with client, dns_server, qname, answer_ip/ASN, rcode'
- question: '[Resource Development] LSTM/RandomForest DGA classification: Can you determine whether an
    internal client queries a domain that is either algorithmically generated (DGA) or newly registered
    (NRD), and which resolves to an IP address with a poor reputation. -- specifically, using the ''LSTM/RandomForest
    DGA classification'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    third-party DNS servers to support later operations -- altering DNS records to redirect traffic, enabling
    collection and credential access, pairing hijacked records with attacker-issued certificates, asserting
    control of SaaS services, or quietly shadowing subdomains. This evidence focuses on the condition
    that an internal client queries a domain that is either algorithmically generated (DGA) or newly registered
    (NRD), and which resolves to an IP address with a poor reputation. This Machine Learning approach
    works as follows: Score domains in-line with a character-level LSTM for DGA and classify NXDOMAIN
    responses with Random Forest/SVM over lexical features, alerting when high-confidence DGA domains
    map to IPs shared by many DGA domains and surfacing the top-3 contributing n-grams/features (Woodbridge
    et al., FANCI). A positive result -- a rule match, statistical outlier, or model alert -- indicates
    possible compromise or abuse of DNS infrastructure; pivot to the DNS server and account involved,
