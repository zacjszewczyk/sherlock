name: 'T1584.002: DNS Server'
id: c163fe54-44cc-440a-8ada-08fff6261071
description: 'This playbook helps an analyst investigate whether an adversary is developing resources
  by compromising third-party DNS servers for use in their operations (MITRE ATT&CK T1584.002, DNS Server,
  under Resource Development TA0042). By taking control of authoritative or recursive DNS infrastructure,
  an adversary can alter DNS records to redirect an organization''s traffic, enable credential-access
  and collection (often paired with attacker-issued digital certificates to mimic trusted services), prove
  domain ownership to hijack SaaS services, and silently create malicious subdomains via domain shadowing
  without alerting the legitimate owner. Much of this activity occurs outside the victim''s direct visibility,
  so the hunt focuses on observable side effects across DNS telemetry and the DNS servers themselves:
  DNS answers or administrative connections that match threat-intelligence feeds; unauthorized AXFR/IXFR
  zone transfers and SOA/RR tampering; anomalous child processes spawned by DNS service binaries (dns.exe,
  named, unbound); geographically or behaviorally anomalous administrative logins to DNS servers; resolution
  of critical external domains to IP space or ASNs outside their historical baseline across multiple clients;
  and queries to newly-registered or DGA domains resolving to poor-reputation infrastructure. Detection
  methods combine deterministic symbolic-logic rules (threat-intel matching, AXFR allowlists, shell-child
  detection, geo/ASN deny-lists, critical-domain answer allowlists, NRD/DGA plus reputation), statistical
  baselining (IP-domain-ASN rarity scoring, transfer frequency/failure percentiles, parent-child rarity,
  user-specific geo/ASN and failed-logon profiling, answer-set diversity and entropy-drop detection, entropy/NXDOMAIN-rate/new-ASN
  scoring), and machine learning (Isolation Forest reputation outliers, Random Forest/Gradient Boosting
  zone-transfer classification, Isolation Forest process-event scoring, UEBA login clustering, flux clustering/forecasting,
  and LSTM/Random Forest DGA classification), applied across Zeek dns.log and conn.log, Windows Event
  IDs 4624/4625/4688, and Sysmon Event ID 1, so the analyst can corroborate suspected DNS-server compromise
  against threat intelligence, zone integrity, host process activity, administrative access, and resolution
  anomalies.'
type: technique
