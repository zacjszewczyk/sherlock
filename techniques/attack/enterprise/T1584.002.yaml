questions:
- question: '[Resource Development] TI-based DNS answer and admin-connection matching: Can you determine
    whether a DNS query resolves to an IP address on a threat intelligence feed, or an administrative
    connection is made to a DNS server from an IP address on a threat intelligence feed. -- specifically,
    using the ''TI-based DNS answer and admin-connection matching'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    third-party DNS servers to support later operations -- altering DNS records to redirect traffic, enabling
    collection and credential access, pairing hijacked records with attacker-issued certificates, asserting
    control of SaaS services, or quietly shadowing subdomains. This evidence focuses on the condition
    that a DNS query resolves to an IP address on a threat intelligence feed, or an administrative connection
    is made to a DNS server from an IP address on a threat intelligence feed. This Symbolic Logic approach
    works as follows: Alert when Zeek dns.log answer IPs or rdata match a curated threat-intel feed of
    attacker DNS/redirector infrastructure, or when Zeek conn.log shows administrative connections (TCP/53
    AXFR, 953 RNDC, 22/443/3389 to DNS hosts) from TI-listed source IPs. Keep this deterministic floor
    regardless of ML; the same campaign pairs hijacked records with attacker IPs and freshly issued certificates
    for the legitimate hostname (Mandiant DNS Hijacking). Correlate with newly observed certificates in
    CT logs for monitored hostnames to confirm. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates possible compromise or abuse of DNS infrastructure; pivot to the DNS server
    and account involved, the source IP/ASN/geo and its reputation, the affected zones and records, any
    newly issued certificates for the hostname in CT logs, the resolving answers seen across internal
    clients, and the process lineage on the DNS host to scope the activity. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    DNS-server compromise largely occurs outside the victim''s direct visibility and any single method
    can miss stealthy record manipulation, domain shadowing, or low-and-slow abuse. Citations (from the
    source analytic plan): [Mandiant DNS Hijacking](https://cloud.google.com/blog/topics/threat-intelligence/global-dns-hijacking-campaign-dns-record-manipulation-at-scale/).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Internal recursive DNS servers, External-facing authoritative DNS servers, Network egress points,
    DNS server management consoles'
  range: Last 90 days (correlate event-centered windows of +/- 1 hour around the anomalous DNS or login
    event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# TI-based DNS answer and admin-connection matching (Symbolic Logic)

      source IN [Zeek dns.log, Zeek conn.log, Windows Event ID 4624, Windows Event ID 4625]

      | approach: Alert when Zeek dns.log answer IPs or rdata match a curated threat-intel feed of attacker
      DNS/redirector infrastructure, or when Zeek conn.log shows administrative connections (TCP/53 AXFR,
      953 RNDC, 22/443/3389 to DNS hosts) from TI-listed source IPs

      | correlate over NAI: Internal recursive DNS servers, External-facing authoritative DNS servers,
      Network egress points, DNS server management consoles

      | emit alert with contributing fields and entity context (DNS server, account, src_ip/ASN/geo, zone,
      record, answer_ip, top-3 features)


      | citations: [Mandiant DNS Hijacking](https://cloud.google.com/blog/topics/threat-intelligence/global-dns-hijacking-campaign-dns-record-manipulation-at-scale/)'
  - technology: Zeek/pseudocode
    query: '# TI-based DNS answer and admin-connection matching (Zeek view)

      watch dns.log/conn.log for DNS-server activity relevant to this technique

      | inspect answers (rdata/answer IPs/ASN), query types (AXFR/IXFR), TTLs, and admin connections

      | compare against TI feeds, allowlists, and per-domain baselines

      | emit candidates with client, dns_server, qname, answer_ip/ASN, rcode'
- question: '[Resource Development] IP-domain-ASN rarity scoring for DNS answers: Can you determine whether
    a DNS query resolves to an IP address on a threat intelligence feed, or an administrative connection
    is made to a DNS server from an IP address on a threat intelligence feed. -- specifically, using the
    ''IP-domain-ASN rarity scoring for DNS answers'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    third-party DNS servers to support later operations -- altering DNS records to redirect traffic, enabling
    collection and credential access, pairing hijacked records with attacker-issued certificates, asserting
    control of SaaS services, or quietly shadowing subdomains. This evidence focuses on the condition
    that a DNS query resolves to an IP address on a threat intelligence feed, or an administrative connection
    is made to a DNS server from an IP address on a threat intelligence feed. This Statistical Method
    approach works as follows: Score each IP-domain-ASN tuple by historical rarity (<1st percentile over
    a 90-day baseline) and aggregate per client; reputation/diversity features (distinct IPs, ASNs, countries,
    TTL change rate) for newly resolved answers indicate hijacked/shadowed records (EXPOSURE, Notos).
    Derive per-org percentile thresholds from your own passive DNS. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates possible compromise or abuse of DNS infrastructure;
    pivot to the DNS server and account involved, the source IP/ASN/geo and its reputation, the affected
    zones and records, any newly issued certificates for the hostname in CT logs, the resolving answers
    seen across internal clients, and the process lineage on the DNS host to scope the activity. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since DNS-server compromise largely occurs outside the victim''s direct visibility
    and any single method can miss stealthy record manipulation, domain shadowing, or low-and-slow abuse.
    Citations (from the source analytic plan): [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf);
    [Notos](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf).'
