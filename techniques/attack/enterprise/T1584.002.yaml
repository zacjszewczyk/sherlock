- question: '[Resource Development] AXFR/IXFR frequency and failure percentile detection: Can you determine
    whether a DNS zone transfer request (AXFR or IXFR) is initiated from a source IP not on a pre-approved
    allowlist of secondary DNS servers or administrative hosts. -- specifically, using the ''AXFR/IXFR
    frequency and failure percentile detection'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary compromises
    third-party DNS servers to support later operations -- altering DNS records to redirect traffic, enabling
    collection and credential access, pairing hijacked records with attacker-issued certificates, asserting
    control of SaaS services, or quietly shadowing subdomains. This evidence focuses on the condition
    that a DNS zone transfer request (AXFR or IXFR) is initiated from a source IP not on a pre-approved
