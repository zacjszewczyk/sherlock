name: 'T1583.007: Serverless'
id: 8f0bdd07-e83a-40cd-9b2c-315566eaea64
description: 'Investigate whether an adversary is acquiring or configuring serverless cloud infrastructure
  (e.g., Cloudflare Workers *.workers.dev, AWS Lambda function URLs *.lambda-url.*.on.aws, Google Cloud
  Run *.run.app, Google Apps Scripts) for operational use against the organization. Because serverless
  traffic blends into ordinary requests to common cloud providers and is hard to attribute, this playbook
  helps an analyst hunt the observable side effects: internal hosts connecting to known-malicious or newly
  observed serverless domains/IPs, suspicious cloud CLI deployments of serverless functions, anomalous
  management-console logins followed by rapid function deployment, low-volume periodic beaconing to serverless
  endpoints, and abnormal data uploads to serverless URLs that may indicate command-and-control or exfiltration.
  It combines symbolic-logic detections, statistical baselining, and machine-learning models across Zeek
  network logs, DNS, and Windows endpoint, authentication, and filtering-platform events.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any internal host establish a network connection to a serverless domain or IP (e.g., *.workers.dev,
    *.lambda-url.*.on.aws, *.run.app) that matches a high-confidence threat-intelligence feed of known-malicious
    infrastructure, or exhibit a TLS SNI / HTTP-Host mismatch behind a common cloud front?
  context: Adversaries hide C2 behind serverless providers because the traffic resembles ordinary cloud
    usage. Join Zeek conn.log responder IPs, dns.log queries/answers, and Windows Event ID 5156 flows
    against curated feeds of malicious serverless FQDNs/IPs and alert on any exact match. Separately,
    a mismatch between the TLS SNI (or HTTP Host header) and the real destination on a flow fronted by
    a major cloud CDN is the canonical domain-fronting signal and warrants immediate triage (see [Blocking-resistant communication through domain fronting](https://www.scitepress.org/Papers/2016/57407/57407.pdf)). A positive
    match is high-fidelity and should be treated as confirmed adversary-infrastructure contact; a negative
    result does not rule out unknown infrastructure, which the prevalence and lexical analytics below
    address. This supports the Resource Development mission of identifying adversary-acquired serverless
    infrastructure.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Internet Gateway, DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "JOIN zeek_conn(id.resp_h), zeek_dns(query,answers), winlog(EventID=5156)\n  WHERE resp_domain\
      \ MATCHES('*.workers.dev','*.lambda-url.*.on.aws','*.run.app')\n  AND (resp_ip IN ti_feed_malicious\
      \ OR resp_domain IN ti_feed_malicious)\n  | ALERT severity=high"
  - technology: Zeek/pseudocode
    query: "for flow in ssl.log|http.log:\n    if cloud_front(flow.server_name) and flow.http_host !=\
      \ flow.server_name:\n      emit domain_fronting_alert(flow)"
- question: Are internal hosts resolving serverless FQDNs that are rare, newly observed (first seen in
    the last 7 days), short-TTL, or backed by a rapidly rotating/diverse set of IP addresses?
  context: Newly registered or rarely used serverless subdomains with short TTLs and high IP fan-out are
    indicative of agile, throwaway adversary infrastructure. Using passive-DNS prevalence and TTL features
    ([EXPOSURE Passive DNS Analysis](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)),
    flag serverless FQDNs that are first-seen within 7 days, exhibit unusually short TTLs, or resolve
    across many disjoint IP networks; add IP-set clustering to catch rotating/fast-flux backends
    ([FluxBuster](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf)). Escalate
    when the domain's prevalence (the number of distinct internal hosts that have resolved it) falls in
    the bottom 1st percentile, because adversary infrastructure is typically contacted by very few hosts.
    This statistical triage finds malicious serverless endpoints not yet on any threat feed, directly
    serving the Resource Development hunt.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Internet Gateway, DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "agg dns by fqdn: first_seen, min_ttl, distinct_ip_nets=dcount(answer_net),\n      prevalence=dcount(src_host)\n\
      \  WHERE fqdn LIKE serverless_suffixes\n  FLAG WHERE first_seen > now-7d OR min_ttl < 60 OR distinct_ip_nets\
      \ > 10\n        OR prevalence <= percentile(prevalence,1)"
- question: Which internal hosts show abnormally high DNS NXDOMAIN or SERVFAIL rates when resolving serverless
    suffixes, relative to a 30-day baseline?
  context: DGA-style or rapidly rotating serverless C2 produces bursts of failed DNS lookups as the malware
    cycles through candidate names. From Zeek dns.log, compute per-host NXDOMAIN and SERVFAIL rates restricted
    to serverless suffixes, then escalate any host whose failure rate exceeds a modified Z-score of 3.5
    against its own 30-day baseline. A sustained spike of resolution failures to *.workers.dev / *.run.app
    / *.lambda-url style names is a distinct signal of algorithmically generated or rotating serverless
    endpoints and complements prevalence scoring ([EXPOSURE Passive DNS Analysis](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)).
    This statistical method supports the Resource Development
    objective by surfacing hosts attempting to reach transient adversary infrastructure.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Internet Gateway, DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per host, per day: nx=count(rcode=NXDOMAIN & serverless), sf=count(rcode=SERVFAIL & serverless)\n\
      \  base = 30d_median+MAD per host\n  modz = 0.6745*(rate-median)/MAD\n  ALERT WHERE modz > 3.5"
- question: Do any queried serverless subdomain labels score as high-risk under a lexical machine-learning
    model (entropy, length, n-grams, character distribution), indicating algorithmically generated names?
  context: Randomized or machine-generated subdomain labels are a hallmark of disposable adversary serverless
    infrastructure. Apply a pretrained Random Forest over domain lexical features (Shannon entropy, length,
    n-grams, Levenshtein distance to known-good names, character distribution) enriched with Windows Event
    ID 5156 host context to score each queried serverless label, escalating scores above 0.85 ([NIOM-DGA
    Nature-Inspired Feature Selection](https://www.sciencedirect.com/science/article/pii/S0167404825002500)).
    The alert should surface the top-3 contributing lexical features and feature attributions so the analyst
    can validate the model's reasoning, per the explainability guidance in [XAI in IDS systematic review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full). A high score combined with low prevalence or beaconing behavior strongly
    indicates adversary C2 over serverless, advancing the Resource Development investigation.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Internet Gateway, DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = lexical(label){entropy,len,ngram,levenshtein,char_dist}\n  ctx = winlog5156(src_host)\n\
      \  score = rf_model.predict_proba(feats+ctx)\n  ALERT WHERE score > 0.85 WITH top3_feature_attributions"
- question: Was a cloud CLI tool (aws.exe, gcloud.cmd, wrangler.exe, az.cmd) executed with deploy/update
    parameters for a serverless function — especially with risky flags like --allow-unauthenticated —
    by a user outside authorized deployment groups?
  context: Adversaries (or insiders) provisioning serverless C2 often invoke cloud CLIs to create or update
    functions. Monitor Windows Event ID 4688 for executions of aws.exe, gcloud.cmd, wrangler.exe, or az.cmd
    whose command lines contain deployment keywords (lambda create-function, run deploy, wrangler publish/deploy)
    and risky flags (e.g., --allow-unauthenticated which exposes a public endpoint). Cross-reference Event
    ID 4624 to determine the logged-on user and alert when the actor is not a member of an authorized
    AD deployment group, or runs from a non-standard host. A positive hit on a non-privileged or unexpected
    account is strong evidence of unauthorized serverless infrastructure setup under Resource Development.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Developer Workstations, CI/CD Pipeline Servers, Administrator Endpoints, Endpoint Process and
    Authentication Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "winlog(EventID=4688) WHERE proc IN (aws.exe,gcloud.cmd,wrangler.exe,az.cmd)\n  AND cmdline\
      \ MATCHES('lambda create-function','run deploy','wrangler publish','wrangler deploy')\n  AND (cmdline\
      \ CONTAINS '--allow-unauthenticated' OR user NOT IN authorized_deploy_group)\n  JOIN winlog(EventID=4624)\
      \ ON logon_id | ALERT"
- question: Do any cloud CLI command-line strings exhibit abnormally high Shannon entropy compared to
    legitimate deployment activity, suggesting obfuscated or encoded payloads?
  context: Attackers frequently obfuscate or base64-encode parameters passed to cloud CLIs to smuggle
    payloads or evade keyword rules. Baseline the Shannon entropy of command-line strings for known-good
    serverless deployment activity, then flag Event ID 4688 executions whose entropy deviates more than
    3 standard deviations above that baseline ([NIOM-DGA Nature-Inspired Feature Selection](https://www.sciencedirect.com/science/article/pii/S0167404825002500)). High-entropy command lines warrant decoding and review
    even when they do not match explicit deployment keywords. This statistical method catches evasive
    variants of the CLI deployment behavior central to the Resource Development phase.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Developer Workstations, CI/CD Pipeline Servers, Administrator Endpoints, Endpoint Process and
    Authentication Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = mean,std of shannon_entropy(cmdline) for legit cloud-cli deploys\n  per event: e =\
      \ shannon_entropy(cmdline)\n  ALERT WHERE proc IN cloud_clis AND e > base.mean + 3*base.std"
- question: Are there unusual spikes in cloud-CLI execution volume per user or per host, particularly
    outside business hours, relative to that entity's normal cadence?
  context: A sudden burst of cloud-CLI activity can indicate scripted mass-deployment of serverless functions
    or automated infrastructure setup by an adversary. Fit a Seasonal-ARIMA model to per-user and per-host
    cloud-CLI execution counts to capture normal daily/weekly cadence, then notify when observed counts
    exceed the model's prediction interval — weighting off-hours spikes more heavily. The alert should
    surface the contributing time window and the expected baseline so analysts can judge whether the spike
    reflects a legitimate release or anomalous provisioning. This time-series method supports the Resource
    Development hunt for serverless infrastructure stand-up.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Developer Workstations, CI/CD Pipeline Servers, Administrator Endpoints, Endpoint Process and
    Authentication Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = hourly count(EventID=4688 & proc IN cloud_clis) per user,host\n  model = SARIMA.fit(series)\n\
      \  pred,pi = model.forecast()\n  ALERT WHERE observed > pi.upper (boost if hour NOT IN business_hours)\n\
      \  REPORT window, baseline"
- question: Do obfuscated or evaded variants of the deterministic serverless deployment rules appear when
    a misuse classifier is layered over the Event ID 4688 base rules?
  context: Sophisticated actors deliberately morph command lines to slip past static SIEM rules. Layer
    a supervised misuse classifier (e.g., AMIDES-style, [Detecting Evasions of SIEM Rules (AMIDES)](https://www.usenix.org/system/files/sec23winter-prepub-112-uetz.pdf))
    over the deterministic Event ID 4688 deployment
    rules so that command lines semantically similar to known-malicious deployments are flagged even when
    they do not match the literal rule, while preserving the analyst-readable hypothesis of which base
    rule was likely evaded. Crucially, the base deterministic rules are kept intact, not replaced. A classifier
    hit pointing at an evaded deployment rule is a strong lead for serverless infrastructure provisioning
    under Resource Development.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Developer Workstations, CI/CD Pipeline Servers, Administrator Endpoints, Endpoint Process and
    Authentication Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for evt in winlog(4688):\n    if base_deploy_rules.match(evt): emit rule_alert\n    else if\
      \ amides_classifier.score(evt.cmdline) > thr:\n      emit evaded_rule_alert(evt, likely_base_rule=amides.nearest_rule)"
- question: Was a Windows logon (Event ID 4624) from a non-corporate IP followed within 15 minutes by
    access to a serverless management console domain and a cloud-CLI deployment (Event ID 4688)?
  context: 'A compromised or misused account often follows a tight sequence: log in from an unusual source,
    reach the serverless provider''s console, then deploy a function. Detect chains where an Event ID
    4624 logon from a non-corporate IP is followed within 15 minutes by serverless-console-domain access
    in Zeek dns.log and a cloud-CLI deployment in Event ID 4688, and flag the entire chain as a single
    suspicious sequence. Correlating the chain (rather than each event alone) dramatically reduces false
    positives and pinpoints account takeover used to stand up serverless infrastructure, directly addressing
    the Resource Development question.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Authentication Servers, VPN Concentrators, Endpoint Process Logs, Network Egress Points, DNS
    Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SEQUENCE within 15m by user:\n    A: winlog(4624) WHERE src_ip NOT IN corporate_ranges\n \
      \   B: zeek_dns(query LIKE serverless_console_domains)\n    C: winlog(4688) WHERE proc IN cloud_clis\
      \ AND cmdline LIKE deploy_kw\n  ALERT chain(A,B,C)"
- question: Did any user authenticate to a serverless management console from a statistically rare geolocation
    (country/ASN) or at an anomalous time of day relative to their personal baseline?
  context: Account compromise frequently surfaces as a login from a never-before-seen country, ISP/ASN,
    or at an odd hour. Build a modified Z-score baseline of geolocation (country, ASN) and time-of-day
    per user for console access and escalate logins scoring above 3.5. Pair this with the deploy-sequence
    correlation so that a rare-geolocation login that precedes function creation is prioritized. A high
    anomaly score indicates a potentially compromised account being used to acquire serverless infrastructure,
    supporting the Resource Development mission.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Authentication Servers, VPN Concentrators, Endpoint Process Logs, Network Egress Points, DNS
    Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per user: baseline freq(country,ASN,hour) over 30-90d\n  modz = 0.6745*(x-median)/MAD on geo/time\
      \ features\n  ALERT WHERE console_login AND modz > 3.5"
- question: Are there accounts where a burst of failed authentications (Event ID 4625) to serverless management
    endpoints precedes a successful logon (Event ID 4624) from an out-of-baseline source or time?
  context: Credential stuffing, password spraying, or guessing against a serverless console typically
    shows as a spike of failures followed by a success. Track per-account failed-vs-successful auth ratios
    to serverless management endpoints and escalate when a failure burst immediately precedes a success
    that originates from a source or time outside the account's baseline. This failed-then-successful
    pattern is a distinct credential-abuse signal that often feeds the subsequent deploy sequence, making
    it a key early indicator in the Resource Development investigation.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Authentication Servers, VPN Concentrators, Endpoint Process Logs, Network Egress Points, DNS
    Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per account window=1h: fails=count(4625 to serverless_mgmt), succ=count(4624)\n  ALERT WHERE\
      \ fails >= burst_thr AND succ>=1\n        AND success.src/time NOT IN account_baseline"
- question: Do administrative workflows deviate from normal login->console->CLI->logout sequences, such
    as immediate deployment from an unexpected source followed by outbound connections to new serverless
    URLs?
  context: Legitimate admin work follows predictable state transitions; adversary misuse breaks them.
    Train a Hidden Markov / sequence model on normal admin workflows (login -> console -> CLI -> logout)
    and alert when observed sequences exhibit anomalous transitions — for example, an immediate deployment
    from an unexpected source followed by outbound connections to brand-new serverless URLs. The alert
    should report the top-3 anomalous transitions for explainability ([XAI in IDS systematic review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)). Anomalous sequence structure is
    a powerful complement to point-anomaly detection and helps confirm adversary acquisition and use of
    serverless infrastructure under Resource Development.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Authentication Servers, VPN Concentrators, Endpoint Process Logs, Network Egress Points, DNS
    Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "states = [login,console,cli_deploy,outbound_serverless,logout]\n  hmm = train(normal_admin_sequences)\n\
      \  ll = hmm.score(user_session_sequence)\n  ALERT WHERE ll < thr REPORT top3_anomalous_transitions"
- question: Is an internal host connecting to an unseen serverless endpoint (e.g., *.workers.dev, *.run.app)
    on a non-standard port (not 80/443), or is a non-browser JA4 client fingerprint contacting a serverless
    endpoint?
  context: Beaconing malware often reaches serverless C2 over odd ports or with a non-browser TLS client
    stack. Trigger an alert when Zeek conn.log, dns.log, and Windows Event ID 5156 together show a host
    contacting a previously unseen serverless endpoint on a port other than 80/443, or when a non-browser
    JA4 client fingerprint contacts a serverless endpoint that browsers normally reach. JA4+ fingerprinting
    distinguishes scripted/malware clients from legitimate browsers even over TLS ([JA4+ Network Fingerprinting](https://github.com/FoxIO-LLC/ja4)). A hit indicates likely
    automated C2 over serverless infrastructure, central to the Resource Development hunt.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Workstation Subnets, Server Subnets, Internet Gateway, Critical Asset Subnets, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "JOIN zeek_conn, zeek_dns, winlog(5156)\n  WHERE resp_domain LIKE serverless_suffixes AND first_seen(resp)\n\
      \  AND (resp_port NOT IN (80,443) OR ja4_client NOT IN browser_ja4_set)\n  | ALERT"
- question: Are there low-jitter, regular, low-volume connections to a serverless endpoint whose inter-arrival
    time and byte-volume coefficients of variation fall in the bottom 5th percentile, indicating machine-generated
    beaconing?
  context: Human traffic is irregular; beacons are metronomic. For each serverless source-destination
    pair, compute the 24-hour coefficient of variation (CV) of inter-arrival time and of orig_bytes using
    Zeek and Windows Event ID 5156 data, then flag pairs where both CVs fall in the bottom 5th percentile
    (highly regular, machine-generated) [RITA](https://github.com/activecm/rita). Confirm periodicity with
    an FFT and apply whitelist suppression (legitimate update/telemetry services) to cut noise [BAYWATCH](https://dsail.kaist.ac.kr/files/WWW17.pdf). Low CV plus a confirmed dominant period strongly indicates C2 beaconing over
    serverless infrastructure, directly supporting the Resource Development objective.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Workstation Subnets, Server Subnets, Internet Gateway, Critical Asset Subnets, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per (src,serverless_dst) 24h:\n    cv_iat = std(iat)/mean(iat); cv_bytes = std(orig_bytes)/mean(orig_bytes)\n\
      \  FLAG WHERE cv_iat<=p5 AND cv_bytes<=p5\n  CONFIRM fft_peak(iat) significant AND dst NOT IN whitelist"
- question: Do any serverless destinations show periodic failed, RST, or zero-byte-response connections,
    indicating beaconing to an offline or unresponsive backend?
  context: Beacons keep calling home even when the backend is down, producing a telltale cadence of failed
    callbacks. Measure rates of failed/RST/empty (zero-byte response) connections per serverless destination
    from Zeek conn_state; regular, periodic retries to a destination that returns no data are a distinct
    beaconing signal that volume-based methods miss entirely [BAYWATCH](https://dsail.kaist.ac.kr/files/WWW17.pdf).
    Combine with periodicity testing to separate genuine beacons from transient network errors. Detecting failed-callback cadence to serverless endpoints
    reveals dormant or partially deployed C2 under Resource Development.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Workstation Subnets, Server Subnets, Internet Gateway, Critical Asset Subnets, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per serverless_dst: fail_rate = count(conn_state IN (S0,REJ,RSTO,RSTR) OR resp_bytes=0)/total\n\
      \  FLAG WHERE fail_rate high AND inter-attempt interval periodic"
- question: Are there high-jitter beacons to serverless endpoints that evade fixed coefficient-of-variation
    thresholds but are revealed by a continuous-time sequence model or frequency-domain clustering?
  context: Advanced malware randomizes its callback interval (jitter) to defeat simple CV thresholds.
    Apply a Continuous-Time Hidden Markov Model — or FFT plus DBSCAN clustering over features like frequency
    strength, volume variance, and domain prevalence — to per-host serverless connection time series to
    expose jittered beaconing ([NetSpectra Sentinel CT-HMM](https://www.sciencedirect.com/science/article/pii/S1084804525000244)). The alert should report the dominant period and the contributing features
    so analysts can validate it. Catching jittered beacons closes the gap left by threshold methods and
    strengthens the Resource Development detection of resilient serverless C2.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Workstation Subnets, Server Subnets, Internet Gateway, Critical Asset Subnets, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "ts = per-host serverless conn timestamps,bytes\n  model = CT-HMM(ts)  # or DBSCAN on [fft_strength,vol_var,prevalence]\n\
      \  ALERT WHERE beacon_state_prob high REPORT dominant_period, top_features"
- question: Did a host not approved for large uploads send a single HTTP POST/PUT to a serverless endpoint
    transferring more than 100MB?
  context: Serverless functions make convenient exfiltration sinks. Alert when Zeek conn.log/http.log
    and Windows Event ID 5156 show a single HTTP POST or PUT to a serverless endpoint moving more than
    100MB from a host that is not on the approved large-upload list. A large one-shot upload to a *.workers.dev/*.run.app/lambda-url
    endpoint from a workstation or sensitive-data server is a strong exfiltration indicator. Tune the
    threshold and approved-host list to your environment to balance fidelity. This rule directly addresses
    data theft via adversary serverless infrastructure under Resource Development.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 5156
  - 'NAI: Data Center Egress Points, Servers Hosting Sensitive Data, Internet Gateway, User Workstation
    Subnets'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "JOIN zeek_http, zeek_conn, winlog(5156)\n  WHERE method IN (POST,PUT) AND resp_domain LIKE\
      \ serverless_suffixes\n  AND orig_bytes > 100MB AND src_host NOT IN approved_large_upload\n  | ALERT"
- question: Does any host's daily upload volume or upload/download byte ratio to serverless endpoints
    deviate sharply (>3 sigma or above the 99th percentile) from its 30-day baseline?
  context: Gradual or bursty exfiltration shows up as a deviation from a host's normal upload profile.
    Track a 30-day rolling mean and standard deviation of daily orig_bytes per host to serverless endpoints,
    plus the orig/resp byte ratio, using Zeek and Windows Event ID 5156 data. Flag days exceeding 3 sigma,
    single connections surpassing the host's 99th-percentile size, or upload/download ratios inverted
    from the host's norm (e.g., a normally download-heavy host suddenly uploading). Per-host baselining
    catches stealthy exfil that fixed thresholds miss, advancing the Resource Development investigation
    into serverless misuse.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 5156
  - 'NAI: Data Center Egress Points, Servers Hosting Sensitive Data, Internet Gateway, User Workstation
    Subnets'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per host 30d: mean,sd daily orig_bytes->serverless; ratio=orig/resp\n  ALERT WHERE day_bytes\
      \ > mean+3*sd OR conn_bytes > p99(host)\n        OR ratio inverted_vs_baseline"
- question: Is there a rise in incomplete, RST, or 4xx/5xx-terminated transfers to serverless endpoints,
    or in strongly upload-heavy (unidirectional) sessions, for any host?
  context: Exfiltration and C2 often produce unidirectional or failed transfers distinct from balanced
    legitimate usage. Profile per-host rates of incomplete, RST, or 4xx/5xx-terminated serverless transfers
    and the degree of unidirectionality (upload-heavy sessions). A rise in failed or strongly upload-biased
    sessions to serverless endpoints is a distinct exfil/C2 signal independent of raw volume, catching
    cases where data is chunked or transfers are interrupted. This complements volume baselining in pursuing
    the Resource Development question of serverless data movement.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 5156
  - 'NAI: Data Center Egress Points, Servers Hosting Sensitive Data, Internet Gateway, User Workstation
    Subnets'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per host,serverless_dst: fail_rate=count(incomplete|RST|4xx|5xx)/total\n      unidir = orig_bytes/(orig_bytes+resp_bytes)\n\
      \  ALERT WHERE fail_rate rising OR unidir > 0.9 (upload-heavy)"
