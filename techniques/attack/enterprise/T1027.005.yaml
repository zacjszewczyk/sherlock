name: 'T1027.005: Obfuscated Files or Information: Indicator Removal from Tools'
id: f1a988cb-2fa5-4f8a-a790-e727ff6ec203
description: 'Investigate whether an adversary is modifying malicious tooling after it was detected, quarantined,
  or blocked in order to evade signature-based defenses and resume operations. This playbook helps an
  analyst hunt for the behaviors associated with Indicator Removal from Tools (T1027.005): execution of
  binary packing, obfuscation, or hex-editing utilities (e.g., UPX, MPRESS, HxD) on non-developer hosts;
  network transfer of newly hashed executables that are fuzzy-/structurally similar to known malware;
  AV/EDR block events that are quickly followed by a new-but-behaviorally-similar process or C2 connection
  from the same host; on-host compilation or rebuilding of binaries into temporary/user-writable directories
  on production systems; and processes that write to their own on-disk executable image (self-scrubbing)
  outside of known software-updater activity. It pairs symbolic-logic rules, statistical baselining/outlier
  scoring, and machine-learning approaches so the analyst can confirm or refute that a previously flagged
  tool was edited and reused to defeat detection.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are known binary-packing, obfuscation, or hex-editing utilities (for example UPX, MPRESS,
    or HxD) being executed on hosts that are NOT classified as developer or security-research workstations?
  context: 'Indicator removal frequently begins with a tool that can rewrite or repack a binary to strip
    the bytes that triggered a signature. By watchlisting the NewProcessName field of process-creation
    events for these editing/packing utilities and alerting only when they run outside approved Developer/Security-Research
    asset groups, you surface scrubbing activity that has no legitimate business reason on a standard
    workstation, production server, or domain controller. A positive result (e.g., upx.exe or hxd.exe
    launching on a finance workstation) is a strong indicator of tool rewriting; a negative result narrows
    the hunt. This supports the Stealth tactic (TA0005): the adversary edits a previously detected tool
    to blend back in with legitimate activity and avoid re-detection.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Standard User Workstations, Production Servers, Domain Controllers, Critical System File Directories'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: EventCode=4688 NewProcessName IN ("*\\upx.exe","*\\mpress.exe","*\\hxd.exe","*\\packer*.exe")
      AND host NOT IN asset_group(Developer,SecurityResearch) | table _time,host,User,NewProcessName,ParentProcessName,CommandLine
- question: On a per-host and per-user basis, which executions of packing/editing tools are statistically
    rare or unprecedented compared to that host's normal 30-day process behavior?
  context: 'Even where a tool is occasionally legitimate, its appearance on a host where it has never
    run before, or in the extreme tail of that host''s execution distribution, is suspicious. Track execution
    frequency for each tool per host/user and alert when a tool has never been seen on the host or sits
    in the 99.9th percentile of executions over 30 days. Because per-host process counts are skewed and
    easily contaminated, prefer a robust median/MAD modified z-score (flag |Mz|>3.5) over a raw percentile,
    and use an Isolation Forest over high-dimensional execution vectors to isolate rare combinations.
    A positive result flags first-seen or anomalous editor/packer use that warrants triage. This supports
    the Stealth tactic (TA0005): the adversary edits a previously detected tool to blend back in with
    legitimate activity and avoid re-detection.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Standard User Workstations, Production Servers, Domain Controllers, Critical System File Directories'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: EventCode=4688 NewProcessName IN (modifier_tool_list) | stats count by host,User,NewProcessName
      | eventstats median(count) as med, mad(count) as mad by host | eval mz=0.6745*(count-med)/mad |
      where isnull(prior_seen) OR abs(mz)>3.5
  - technology: Python/IsolationForest pseudocode
    query: features=[proc,parent,user,hour,path]; model=IsolationForest(contamination=0.001).fit(baseline);
      alert where model.predict(today)==-1
- question: Can a supervised classifier distinguish legitimate developer/build activity from indicator-removal
    (evasion) tool use based on process, parent, user, and command-line features?
  context: 'Symbolic and statistical methods miss novel or disguised tooling. Train a Random Forest (or
    gradient-boosted tree) on Event ID 4688 features — process name, parent process, user, and command-line
    patterns — labeling known-good development versus evasion behavior, and alert on high-confidence evasion
    predictions. Use static and command-line features in the spirit of EMBER, and harden the model against
    functionality-preserving evasion via adversarial training/ensembling. A high-confidence evasion prediction
    is a lead for an analyst to validate against the host''s role and the binary''s provenance. This supports
    the Stealth tactic (TA0005): the adversary edits a previously detected tool to blend back in with
    legitimate activity and avoid re-detection.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Standard User Workstations, Production Servers, Domain Controllers, Critical System File Directories'
  range: Last 90 days
  queries:
  - technology: Python/ML pseudocode
    query: 'X=features(EventID_4688: process,parent,user,cmdline_ngrams); clf=RandomForest().fit(train);
      proba=clf.predict_proba(X)[:,evasion]; alert where proba>0.85'
- question: Do executables transferred over the network — with previously unseen SHA256 hashes — fuzzy-match
    known malware via SSDEEP (similarity above 85) or via TLSH/imphash structural matching?
  context: 'When an adversary edits a malware sample to defeat a signature, the cryptographic hash changes
    but the bulk of the file stays similar. Compute SSDEEP (context-triggered piecewise) hashes for new
    executables seen in Zeek files.log and alert when they exceed an 85/100 similarity to threat-intel
    entries of known-bad fuzzy hashes. Add the more modification-resistant TLSH locality-sensitive hash
    and import-hash (imphash) matching so edits that defeat ssdeep still link the file to its known-bad
    lineage. A positive match strongly indicates a re-skinned variant of previously detected malware.
    This supports the Stealth tactic (TA0005): the adversary edits a previously detected tool to blend
    back in with legitimate activity and avoid re-detection.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, DMZ Network Segment, Internal Server-to-Server Traffic'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: from files.log where mime_type="application/x-dosexec" and sha256 not in seen | compute ssdeep,tlsh,imphash
      | where ssdeep_compare(ssdeep, TI_malware)>85 OR tlsh_distance(tlsh,TI_malware)<50 OR imphash in
      TI_imphash
- question: Which transferred executables combine high byte entropy with high fuzzy-hash similarity to
    known malware, indicating a packed/obfuscated variant of a known-bad tool?
  context: 'Packing and obfuscation raise a file''s entropy while leaving structural similarity to the
    original. Combine each executable''s Shannon entropy with its SSDEEP similarity to known malware and
    flag files with entropy >7.5 AND SSDEEP similarity >85. Complement the raw entropy threshold with
    byte-entropy histogram features (per EMBER) and TLSH distance scoring for robustness. A file that
    is both highly entropic and structurally close to a known sample is a likely indicator-removal variant
    rather than a benign new binary. This supports the Stealth tactic (TA0005): the adversary edits a
    previously detected tool to blend back in with legitimate activity and avoid re-detection.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, DMZ Network Segment, Internal Server-to-Server Traffic'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: from files.log (executables) | eval entropy=byte_entropy(file), sim=ssdeep_compare(ssdeep,TI_malware),
      tlsh_d=tlsh_distance(tlsh,TI_malware) | where entropy>7.5 AND (sim>85 OR tlsh_d<50)
- question: When clustering observed file fuzzy hashes over a rolling 7-day window, do any clusters contain
    known malicious hashes — implying a wave of indicator-removal variants?
  context: 'Adversaries often iterate a tool, producing several near-identical variants over a short period.
    Apply DBSCAN to SSDEEP (and, for robustness, TLSH and imphash) digests observed over 7 days and investigate
    any cluster that contains a known-bad hash, treating its other members as likely indicator-removal
    variants of the same toolchain. This catches variants individually below the per-file similarity threshold
    but collectively linked to known malware. This supports the Stealth tactic (TA0005): the adversary
    edits a previously detected tool to blend back in with legitimate activity and avoid re-detection.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, DMZ Network Segment, Internal Server-to-Server Traffic'
  range: Last 7 days
  queries:
  - technology: Python/ML pseudocode
    query: digests=collect(ssdeep|tlsh over 7d); D=pairwise_distance(tlsh); labels=DBSCAN(eps,min_samples,metric='precomputed').fit(D);
      investigate clusters where any(member in TI_malware)
- question: Within 60 minutes after an AV/EDR alert blocked a file, does the same host execute a new process
    or open a network connection to a known C2 destination, using a new file hash but similar behavior?
  context: 'The defining behavior of T1027.005 is redeploying a modified, no-longer-detected tool after
    it was blocked. After any AV/EDR file-block alert, watch the same host for 60 minutes and alert if
    new processes (Event ID 4688) appear or Zeek connections reach threat-intel-listed C2 destinations.
    A new hash exhibiting the same C2 endpoint or similar command-line as the blocked tool is high-confidence
    evidence the adversary scrubbed and reused the tool. This supports the Stealth tactic (TA0005): the
    adversary edits a previously detected tool to blend back in with legitimate activity and avoid re-detection.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Infected Host Endpoint, Domain Controllers, Network Gateway'
  range: Last 90 days; pivot on a 60-minute window after each AV/EDR block event
  queries:
  - technology: SIEM/Rule pseudocode
    query: join host on [AV/EDR block alert as t0] with [EventCode=4688 OR zeek_conn where _time between
      t0 and t0+60m] | where dest_ip in TI_C2 OR new_hash!=blocked_hash with similar_cmdline | alert
- question: After a tool is blocked, do subsequent processes on that host run with command lines that
    are textually nearly identical to the blocked command (small edit distance) but carry a different
    file hash?
  context: 'Adversaries often change only enough to defeat a hash/signature while reusing the same operational
    command line. Measure Levenshtein (edit) distance between the blocked process''s command-line arguments
    and subsequent processes'' commands within an hour, flagging executions with different hashes but
    less than 20% edit distance. Pair this with fuzzy-hash similarity on the binaries and apply a robust
    modified z-score to the distance distribution to set a defensible threshold. Near-duplicate command
    lines with new hashes indicate a relabeled/rebuilt tool. This supports the Stealth tactic (TA0005):
    the adversary edits a previously detected tool to blend back in with legitimate activity and avoid
    re-detection.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Infected Host Endpoint, Domain Controllers, Network Gateway'
  range: Last 90 days; pivot on a 60-minute window after each AV/EDR block event
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each blocked_cmd: subsequent=4688 where _time in [t0,t0+60m] and hash!=blocked_hash |
      eval pct=levenshtein(cmd,blocked_cmd)/len(blocked_cmd) | where pct<0.20'
- question: Following an AV/EDR block, is there a statistically significant spike in related alert volume
    on the same host compared to its time-series baseline?
  context: 'A successful re-deployment of a scrubbed tool often produces a burst of follow-on alerts.
    Baseline per-host alert volume with an ARIMA time-series model and flag cases where an AV/EDR block
    is followed by a significant spike in related alerts; alternatively, treat post-block alert-volume
    features as anomalies via Isolation Forest and threshold residuals with a robust modified z-score.
    A significant post-block spike suggests the adversary regained execution despite the block. This supports
    the Stealth tactic (TA0005): the adversary edits a previously detected tool to blend back in with
    legitimate activity and avoid re-detection.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Infected Host Endpoint, Domain Controllers, Network Gateway'
  range: Last 90 days; compare post-block window against per-host time-series baseline
  queries:
  - technology: Python/ML pseudocode
    query: series=alert_count_per_host_per_interval; model=ARIMA(series).fit(); resid=observed-forecast;
      mz=0.6745*(resid-median(resid))/mad(resid); flag where block_event precedes interval and mz>3.5
- question: Is a compiler or build utility (for example csc.exe, gcc.exe, or pyinstaller.exe) running
    on a non-developer host and quickly followed by a newly created executable in a temporary or user-writable
    directory?
  context: 'Rather than transferring a packer, an adversary may recompile or rebuild a tool on-host to
    strip indicators. Trigger on Event ID 4688 for compiler/build processes on non-developer hosts and
    correlate to another Event ID 4688 within 5 minutes for a process launched from a world-writable directory
    (e.g., %TEMP%, %APPDATA%). Compilation followed immediately by execution from a temp path on a production
    or finance system is consistent with rebuilding/relabeling a tool after indicator removal. This supports
    the Stealth tactic (TA0005): the adversary edits a previously detected tool to blend back in with
    legitimate activity and avoid re-detection.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: Production Application Servers, Financial Department Workstations, Temporary File Directories
    (%TEMP%, %APPDATA%)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: EventCode=4688 NewProcessName IN ("*csc.exe","*gcc.exe","*pyinstaller.exe","*clang*") AND host
      NOT IN Developer | join host [EventCode=4688 within 5m where NewProcessName IN ("*\\Temp\\*","*\\AppData\\*")]
      | alert
- question: On non-developer machines, is the time delta between a file write (Event ID 4663) and that
    file's execution (Event ID 4688) abnormally small for compiler-produced binaries?
  context: 'Legitimately built software is usually not executed instantly from the build directory on
    production hosts. Baseline, per host and per path, the delta between file writes (4663) and executions
    (4688), and alert when compilers on non-developer machines produce essentially-zero deltas. Detect
    the near-zero write-to-exec interval as an outlier using a robust median/MAD modified z-score. A binary
    written and immediately executed by a compiler on a server is a strong indicator of just-in-time tool
    rebuilding. This supports the Stealth tactic (TA0005): the adversary edits a previously detected tool
    to blend back in with legitimate activity and avoid re-detection.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: Production Application Servers, Financial Department Workstations, Temporary File Directories
    (%TEMP%, %APPDATA%)'
  range: Last 90 days; baseline per-host write-to-exec deltas over 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: pair 4663(write,path) with 4688(exec,path) | eval delta=exec_time-write_time | eventstats median(delta)
      med, mad(delta) mad by host,path | eval mz=0.6745*(delta-med)/mad | where compiler_parent AND host
      NOT IN Developer AND mz<-3.5
- question: Do process-execution sequences on production servers follow an improbable chain such as cmd.exe
    -> compiler -> temp write -> temp execution?
  context: 'Indicator-removal-by-rebuild produces a characteristic, low-probability sequence of events.
    Run a pre-trained Hidden Markov Model over process sequences and alert when transitions like ''cmd.exe
    -> compiler -> temp write -> temp execution'' occur on production servers; complement it with an LSTM
    (DeepLog-style) that learns normal process/event sequences and flags improbable compiler/temp-write/exec
    chains. A sequence that the model rates as highly improbable on a server is a strong lead for tool
    rebuilding. This supports the Stealth tactic (TA0005): the adversary edits a previously detected tool
    to blend back in with legitimate activity and avoid re-detection.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: Production Application Servers, Financial Department Workstations, Temporary File Directories
    (%TEMP%, %APPDATA%)'
  range: Last 90 days
  queries:
  - technology: Python/ML pseudocode
    query: seq=ordered_process_events_per_host; logprob=HMM.score(seq); deeplog=LSTM.predict_next(seq);
      alert where logprob<thresh OR observed_next not in deeplog.topk and host in ProductionServers
- question: Is any process writing to a file path identical to its own executable image (self-modification),
    where the process is not an allowlisted legitimate software updater?
  context: 'Some tools scrub their own on-disk bytes in place to remove the indicators that got them flagged.
    Alert when, in Event ID 4663, ProcessName equals ObjectName and AccessList includes write permission
    (%%4417), excluding known updater allowlist entries; corroborate with Sysmon Event ID 11 file-create/overwrite
    on the same image path. A process rewriting its own executable — outside of legitimate updaters —
    is the file-modification observable of indicator removal. This supports the Stealth tactic (TA0005):
    the adversary edits a previously detected tool to blend back in with legitimate activity and avoid
    re-detection.'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: Application Directories (e.g., C:\Program Files), User Profile Directories, System Directories
    (e.g., C:\Windows\System32)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: EventCode=4663 where ProcessName==ObjectName AND AccessList contains "%%4417" AND ProcessName
      NOT IN updater_allowlist | join Sysmon EventCode=11 same TargetFilename | alert
- question: Which self-writing processes deviate from the baseline of known legitimate self-updating software
    (e.g., GoogleUpdate, msedge_updater), especially when launched by scripting engines?
  context: 'A small set of updaters legitimately rewrite their own binaries. Profile these legitimate
    self-writers and flag any other process that performs a self-write, raising the risk score when the
    parent is a scripting engine (powershell.exe, wscript.exe, cmd.exe). Score deviations from the legitimate-updater
    baseline with a robust modified z-score. A self-write by an unknown process with a script-engine parent
    is far more likely to be indicator removal than benign maintenance. This supports the Stealth tactic
    (TA0005): the adversary edits a previously detected tool to blend back in with legitimate activity
    and avoid re-detection.'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: Application Directories (e.g., C:\Program Files), User Profile Directories, System Directories
    (e.g., C:\Windows\System32)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: self_writes=4663 where ProcessName==ObjectName | eval known=ProcessName in (GoogleUpdate,msedge_updater,...)
      | where not known | eval risk=base + (parent in script_engines ? boost:0) | mz score risk vs baseline
      | alert where mz>3.5
- question: Can a one-class model trained on legitimate updater behavior detect anomalous self-writing
    processes by their parent, user, path, and signature features?
  context: 'To catch novel self-scrubbing tools, train a one-class SVM (and an unsupervised Isolation
    Forest) on features of legitimate self-updating software — parent process, user, file path, and code
    signature — and use it to flag self-writing processes that fall outside the learned normal region;
    optionally incorporate static PE features (per EMBER) of the written artifact. Anything that writes
    to its own image but does not resemble a known-good updater is a candidate for indicator removal and
    should be triaged. This supports the Stealth tactic (TA0005): the adversary edits a previously detected
    tool to blend back in with legitimate activity and avoid re-detection.'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: Application Directories (e.g., C:\Program Files), User Profile Directories, System Directories
    (e.g., C:\Windows\System32)'
  range: Last 90 days
  queries:
  - technology: Python/ML pseudocode
    query: feat=[parent,user,path,signed,signer]; ocsvm=OneClassSVM().fit(updater_baseline); iforest=IsolationForest().fit(updater_baseline);
      alert where ocsvm.predict(x)==-1 OR iforest.predict(x)==-1
