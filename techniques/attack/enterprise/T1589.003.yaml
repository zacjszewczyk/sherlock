    (e.g., ''About Us'', ''Team'' pages), characterized by a high request rate, a user-agent associated
    with scanning tools, or an origin IP on a threat intelligence list. This Symbolic Logic approach works
    as follows: Treat 4xx/404 ratio as a distinct signal — flag a source whose 404/403 ratio to crawled
    paths exceeds 30% over >=50 requests, indicating brute directory/path discovery rather than normal
