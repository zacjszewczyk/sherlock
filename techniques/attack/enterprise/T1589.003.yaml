questions:
- question: '[Reconnaissance] Match TI or scraper UAs on employee pages: Can you determine whether A single
    external source IP address exhibits web crawling or scraping behavior against public web pages known
    to contain employee names (e.g., ''About Us'', ''Team'' pages), characterized by a high request rate,
    a user-agent associated with scanning tools, or an origin IP on a threat intelligence list. -- specifically,
    using the ''Match TI or scraper UAs on employee pages'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers employee
    names to derive email addresses, guide further reconnaissance, and craft more-believable phishing
    lures, and may follow harvesting with username enumeration, password spraying, or bulk access to internal
    employee records. This evidence focuses on the condition that A single external source IP address
    exhibits web crawling or scraping behavior against public web pages known to contain employee names
    (e.g., ''About Us'', ''Team'' pages), characterized by a high request rate, a user-agent associated
    with scanning tools, or an origin IP on a threat intelligence list. This Symbolic Logic approach works
    as follows: Alert when about/team/staff/leadership/contact/directory URIs are requested by TI-listed
    IPs or known scanner/scraper user-agents, per OWASP Automated Threats (OAT-011 Scraping/OAT-018 Footprinting)
    symptoms and OWASP Core Rule Set scanner-UA rules; concrete floor: >100 requests to these paths from
    one source in 10 minutes. A positive result -- a rule match, statistical outlier, or model alert --
    indicates probable employee-name reconnaissance or downstream enumeration; pivot to the source IP
    and its threat-intel/geolocation reputation, the targeted pages/applications/accounts, the user-agents
    and session identifiers involved, the volume and timing of requests or authentication attempts, and
    any subsequent successful logon or bulk record access to scope what was collected and whether it led
    to access. A negative result helps rule out this particular reconnaissance vector but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, distributed,
    or off-network collection. Citations: [OWASP Automated Threats (OAT-011 Scraping/OAT-018 Footprinting)](https://owasp.org/www-project-automated-threats-to-web-applications/);
    [OWASP Core Rule Set](https://github.com/coreruleset/coreruleset).'
