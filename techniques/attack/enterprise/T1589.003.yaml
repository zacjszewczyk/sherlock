  range: Last 90 days (correlate event-centered windows of +/- 10 minutes around the activity)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match TI or scraper UAs on employee pages (Symbolic Logic)

      source IN [Zeek conn.log, Zeek http.log, Zeek notice.log]

      | approach: Alert when about/team/staff/leadership/contact/directory URIs are requested by TI-listed
      IPs or known scanner/scraper user-agents, per OWASP Automated Threats (OAT-011 Scraping/OAT-018
      Footprinting) symptoms and OWASP Core Rule Set scanner-UA rules; concrete floor: >100 requests to
      these paths from one source in 10 minutes.

      | correlate over NAI: Internet-facing web servers, Network perimeter firewalls/gateways, Web Application
      Firewalls (WAFs)

      | emit alert with contributing fields and entity context (source IP, user-agent, session/UID, targeted
      page/app/account, request/auth volume, top contributing features)'
  - technology: Zeek/pseudocode
    query: '# Match TI or scraper UAs on employee pages (Zeek view)

      watch http.log/conn.log/notice.log for employee-page and scraping activity

      | filter URI in (about|team|staff|leadership|contact|directory|profile) paths or scanner/scraper
      UAs

      | evaluate request rate, 4xx/404 ratio, resp_body_len, URI diversity, UA consistency per source/UID

      | emit candidate scraping/enumeration sessions with src, UA, counts, bytes'
- question: '[Reconnaissance] Failure-mode ratio on employee pages: Can you determine whether A single
