name: 'T1589.003: Employee Names'
id: acc6faf5-c8ad-465d-a3f0-4e861b5c8a78
description: 'This playbook helps an analyst investigate whether an adversary is gathering employee names
  to support targeting (MITRE ATT&CK T1589.003, Employee Names), part of the Reconnaissance tactic. Employee
  names are frequently exposed on public ''About Us'', ''Team'', ''Leadership'', ''Staff'', and directory
  pages, and adversaries harvest them to derive email addresses, guide further reconnaissance, craft believable
  phishing lures, and seed credential-spraying and account-takeover campaigns. Because much of this collection
  happens off the victim''s network and blends with normal web traffic, this playbook pursues the activity
  from several complementary angles where it does leave telemetry: external sources web-crawling or scraping
  employee-bearing public pages (Zeek conn/http/notice logs); high-rate failed authentication against
  public-facing applications (ADFS/OWA) using lexically similar usernames that follow naming conventions,
  indicating enumeration (Windows Event ID 4625); spray-then-access patterns where many failures across
  distinct valid accounts precede a single success (Event IDs 4625/4624); systematic single-session directory
  traversal and high data-to-request ratios against employee directories or profile pages (Zeek http/conn
  logs by UID); and internal users accessing an unusually high number of distinct employee records from
  intranet, HR, and file-share repositories in a manner inconsistent with their baseline (Windows Event
  IDs 4663/4624). Detection methods combine deterministic symbolic-logic rules (threat-intel and scraper
  user-agent matching, employee-page URI watchlists, multi-username failure and invalid-user sub-status
  rules, watchlisted-repository access alerts), statistical baselining (per-server request percentiles,
  Holt-Winters seasonal forecasting, Levenshtein/entropy username analysis, 99th-percentile distinct-username
  counts, Bayesian new-edge scoring, 3-sigma outlier access counts), and machine learning (Isolation Forest
  source/session scoring, Random Forest session classification, LogonTracer graph analytics, attention-RNN
  sequence anomaly detection, and autoencoder user-behavior modeling), applied across Zeek conn/http/notice
  logs and Windows Security events so the analyst can corroborate suspected employee-name harvesting and
  downstream enumeration against source behavior, authentication patterns, and internal access.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
