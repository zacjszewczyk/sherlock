    access to scope what was collected and whether it led to access. A negative result helps rule out
    this particular reconnaissance vector but should be corroborated with the other questions in this
    playbook, since a single method can miss low-and-slow, distributed, or off-network collection. Citations:
    [OWASP Automated Threats (OAT-011 Scraping/OAT-018 Footprinting)](https://owasp.org/www-project-automated-threats-to-web-applications/).'
