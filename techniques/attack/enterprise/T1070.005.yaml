name: 'T1070.005: Indicator Removal: Network Share Connection Removal'
id: 8dbe64f7-30cd-4d9e-9c42-b4c42292b15a
description: >-
  This playbook helps an analyst determine whether an adversary is removing network share connections
  to clean up traces of their operation (T1070.005), under the Stealth tactic. Adversaries who have used
  SMB/Windows Admin Shares for lateral movement, remote file access, or data staging frequently tear down
  those mapped drives and share connections afterward to minimize forensic artifacts. The playbook focuses
  on detecting the execution of built-in Windows utilities and cmdlets used to delete share connections
  -- `net use \\host\share /delete`, `net share <name> /delete`, `Remove-SmbMapping`, `Remove-SmbShare`,
  `Remove-PSDrive` -- as well as registry changes that disable administrative shares (AutoShareWks/AutoShareServer).
  It correlates host process telemetry (Windows Event ID 4688, Sysmon Event ID 1), PowerShell script-block
  logs (Event ID 4104), SMB share/file access events (Windows Event ID 5140/5145), logon/logoff events
  (Event ID 4624/4634/4647), and network telemetry (Zeek conn.log, smb_files.log, smb_mapping.log) to
  surface suspicious cleanup. Investigative angles include: matching known malicious or disallowed share-removal
  tooling; baselining rare execution context (parent process, signer, account, host role) with robust
  outlier scoring (MAD/percentiles); profiling failed share access that precedes a teardown (probing then
  cleanup); correlating the full SMB-connect -> file-access -> share-delete sequence within a short window;
  detecting anomalously short SMB sessions and abrupt drops in SMB traffic without a corresponding logoff
  (silent teardown); and machine-learning classifiers/sequence models (supervised LOLBin classification,
  HMM/transformer sequence likelihood, time-series forecasting, graph anomaly ranking). Detection blends
  symbolic-logic rules, statistical baselining, and ML to produce explainable, evasion-resistant alerts
  for the Stealth tactic.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
