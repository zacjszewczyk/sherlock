  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 5140
  - Windows Event ID 4634
  - Zeek conn.log
  - 'NAI: End-user Workstations, Domain Controllers, File Servers, Application Servers'
  range: Last 90 days (escalate when remote-share access occurred within the prior 15 minutes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Symbolic logic: Match suspicious share-removal tooling\nMATCH share_removal = process_create(4688\
      \ / Sysmon 1) OR powershell(4104) WHERE\n    (image IN ['net.exe','net1.exe'] AND cmdline MATCHES\
      \ /\\buse\\b.*\\/delete|\\/delete\\s+\\*|\\bshare\\b.*\\/delete/i)\n    OR cmdline MATCHES /Remove-SmbMapping|Remove-SmbShare|Remove-PSDrive/i\n\
      \    OR (registry_set path MATCHES /AutoShareWks|AutoShareServer/ AND value = 0)\nWHERE binary_hash\
      \ OR signer OR image_path IN known_malicious_tooling\n    OR disallowed_utility_for(host_role)\n\
      // escalate: same session accessed a remote share in the prior 15m\nJOIN remote_share_access(Windows\
      \ 5140/5145) AS prior\n    ON prior.host = share_removal.host AND prior.user = share_removal.user\n\
      \    WHERE prior.time BETWEEN share_removal.time-15m AND share_removal.time\nRAISE severity = high\
      \ WHEN prior EXISTS"
