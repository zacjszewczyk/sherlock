- question: 'Using deterministic rule logic, can you determine whether ''Correlate SMB access with share
    deletion'' indicates network share connection removal used to evade defenses? Specifically: Trigger
    when events from the same source host and user occur within a 15-minute window in order: 1) SMB connection
    to a file/admin share (Zeek conn.log port 445 or Windows 5140), 2) file transfer/access (Zeek smb_files.log
