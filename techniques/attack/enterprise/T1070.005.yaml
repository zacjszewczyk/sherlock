    al.](https://doi.org/10.1109/SRDS.2017.31). Add a Volume feature (count of remote files/bytes the
    session touched before teardown) and a Frequency feature (share-removal commands per host per hour);
    both >3 MAD above baseline raises severity. A positive result indicates a share-removal action whose
    context (tooling, parent lineage, timing, prior SMB volume, missing logoff, or anomalous session)
    is consistent with deliberate adversary cleanup rather than a benign logoff/remap script; a negative
