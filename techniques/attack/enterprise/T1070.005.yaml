  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 5140
  - Windows Event ID 4634
  - Zeek conn.log
  - >-
    NAI: End-user Workstations, Domain Controllers, File Servers, Application Servers
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      // Statistical baselining for: Score rare share-removal execution context
      BASELINE per (parent, signer, user, host_role) over 90d of share-removal events
      FOR each new share-removal event:
        score = MAD_outlier(prevalence) // robust to outliers, not mean/sigma
        feat_volume = remote_files_or_bytes_touched_before_teardown
        feat_freq   = share_removal_cmds_per_host_per_hour
        feat_failed = count(5145 access-denied / SMB tree-connect failures) in prior 15m
      FLAG WHEN combo first-seen OR < 1st percentile
        OR feat_volume > baseline + 3*MAD OR feat_freq > baseline + 3*MAD
        OR teardown immediately follows spike in feat_failed (probing then cleanup)
