    such as the [LANL dataset](https://csr.lanl.gov/data/auth/)). Flag executions whose (parent, signer,
    user, host-role) combination is first-seen or below the 1st percentile of benign share-management
    activity, using Median Absolute Deviation rather than mean/σ for outlier scoring as in [Bohara et
    al.](https://doi.org/10.1109/SRDS.2017.31). Add a Volume feature (count of remote files/bytes the
    session touched before teardown) and a Frequency feature (share-removal commands per host per hour);
    both >3 MAD above baseline raises severity.'
