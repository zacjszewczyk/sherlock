questions:
- question: >-
    Using deterministic rule logic, can you determine whether 'Match suspicious share-removal tooling'
    indicates network share connection removal used to evade defenses? Specifically: Alert when a process
    executes `net use \\<host>\<share> /delete` or `/delete *`, `net share <name> /delete`, `Remove-SmbMapping`,
    `Remove-SmbShare`, `Remove-PSDrive`, or sets AutoShareWks/AutoShareServer=0, and the binary hash,
    signer, or path matches known malicious tooling or a disallowed utility for that host role (see emulation
    surface in [Atomic Red Team T1070.005](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1070.005/T1070.005.md);
    command syntax in [Net use, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/gg651155(v=ws.11))
    and [Remove-SmbMapping, Microsoft](https://learn.microsoft.com/en-us/powershell/module/smbshare/remove-smbmapping)).
    Escalate to high when the same session accessed a remote share (Windows 5140/5145) within the prior
    15 minutes per the tool-to-event mappings in [JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).
  context: >-
    Tactic context (Stealth): the adversary is trying to hide and conceal their actions by removing network
    share connections that are no longer useful, cleaning up traces left during lateral movement, remote
    file access, or data staging over SMB/Windows Admin Shares. Evidence under investigation: A process
    removes an SMB or mapped-drive connection, and the responsible binary, signer, or command context
    aligns with known malicious tooling or with a suspicious cleanup pattern that follows remote file
    access, staging activity, and SMB session teardown. Approach (Match suspicious share-removal tooling):
    Alert when a process executes `net use \\<host>\<share> /delete` or `/delete *`, `net share <name>
    /delete`, `Remove-SmbMapping`, `Remove-SmbShare`, `Remove-PSDrive`, or sets AutoShareWks/AutoShareServer=0,
    and the binary hash, signer, or path matches known malicious tooling or a disallowed utility for that
    host role (see emulation surface in [Atomic Red Team T1070.005](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1070.005/T1070.005.md);
    command syntax in [Net use, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/gg651155(v=ws.11))
    and [Remove-SmbMapping, Microsoft](https://learn.microsoft.com/en-us/powershell/module/smbshare/remove-smbmapping)).
    Escalate to high when the same session accessed a remote share (Windows 5140/5145) within the prior
    15 minutes per the tool-to-event mappings in [JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).
    A positive result indicates a share-removal action whose context (tooling, parent lineage, timing,
    prior SMB volume, missing logoff, or anomalous session) is consistent with deliberate adversary cleanup
    rather than a benign logoff/remap script; a negative result means the activity fits established baselines
    for legitimate share management. Investigate the named area of interest (End-user Workstations, Domain
    Controllers, File Servers, Application Servers) and pivot from any hit to the originating process,
    account, source host, the shares and files that were accessed beforehand, and any related lateral-movement
    or exfiltration activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 5140
  - Windows Event ID 4634
  - Zeek conn.log
  - >-
    NAI: End-user Workstations, Domain Controllers, File Servers, Application Servers
  range: >-
    Last 90 days (escalate when remote-share access occurred within the prior 15 minutes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      // Deterministic detection for: Match suspicious share-removal tooling
      MATCH process_create (4688 / Sysmon 1) OR powershell (4104) WHERE
        (image IN ['net.exe','net1.exe'] AND cmdline MATCHES /(use|share).*\/delete/)
        OR cmdline MATCHES /Remove-SmbMapping|Remove-SmbShare|Remove-PSDrive/i
        OR registry_set MATCHES /AutoShareWks|AutoShareServer/ AND value=0
      // enrich + correlate within 15m on same host+user:
      JOIN smb_access (5140/5145 OR Zeek smb_files.log/conn.log:445) AS prior
        WHERE prior.time BETWEEN delete.time-15m AND delete.time
      RAISE high WHEN binary_hash/signer/path IN known_bad OR disallowed_for(host_role)
        OR prior remote share write (ADMIN$/C$) observed
- question: >-
    Using statistical baselining, can you determine whether 'Score rare share-removal execution context'
    indicates network share connection removal used to evade defenses? Specifically: Measure the baseline
    prevalence of binaries, signer identities, parent processes, accounts, and host roles involved in
    share-removal commands (derive baselines from internal logs or an authentication corpus such as the
    [LANL dataset](https://csr.lanl.gov/data/auth/)). Flag executions whose (parent, signer, user, host-role)
    combination is first-seen or below the 1st percentile of benign share-management activity, using Median
    Absolute Deviation rather than mean/σ for outlier scoring as in [Bohara et al.](https://doi.org/10.1109/SRDS.2017.31).
    Add a Volume feature (count of remote files/bytes the session touched before teardown) and a Frequency
    feature (share-removal commands per host per hour); both >3 MAD above baseline raises severity.
