name: 'T1039: Data from Network Shared Drive'
id: 02c59c53-d3cb-446d-acb3-ec43214402de
description: 'This playbook helps an analyst investigate whether an adversary has collected sensitive
  data from network shared drives (host shared directories, network file servers, SMB/CIFS, NFS) on systems
  they have compromised, prior to exfiltration. It guides the hunt across several behavioral angles: execution
  of known data-collection or file-transfer tooling (e.g., robocopy, smbclient, rclone, secretsdump) identified
  by hash/name/command-line IOCs; command-line and PowerShell script blocks that enumerate and copy files
  using UNC or mapped-drive paths; abnormally large reads of bytes or unique files from shares relative
  to a user/host baseline; access to an anomalously high number of distinct shares or file types inconsistent
  with role-based access; and ''fan-in'' staging where a single host reads from multiple shares and writes
  a large volume of data to one local directory. Detection methods span symbolic-logic rules, statistical
  baselining/forecasting, and machine-learning models applied to Windows Security/Sysmon events, auditd,
  macOS unified logs, and Zeek SMB/file telemetry, so the analyst can corroborate suspicious share access
  against authorization, volume, and sequencing context.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
