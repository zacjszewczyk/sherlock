questions:
- question: '[Collection] Process hash IOC check: Did any process execution (Windows Event ID 4688 / Sysmon
    Event ID 1) have a hash, name, or command line matching a known data-collection or file-transfer tool
    IOC (e.g., secretsdump, smbclient, robocopy, rclone, ncp)?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary searching network shares
    for files of interest leaves traces in share-access, process-execution, and file telemetry. This Symbolic
    Logic approach looks for the following signal: Match Windows Event ID 4688/Sysmon 1 process hashes/names
    against TI feeds for share-collection tools (e.g., secretsdump, smbclient, robocopy, rclone, ncp)
    and alert; extend with known malicious API/command sequences as in [A Novel Approach to Detect Malware
    Based on API Call Sequence Analysis](https://journals.sagepub.com/doi/full/10.1155/2015/659101). A
    positive result -- a match, statistical outlier, or model alert -- suggests a host or user is reading/copying
    data from shares in a way that deviates from normal role-based behavior and may indicate staging for
    exfiltration; investigate the associated account, source host, target shares, and any subsequent local
    file creation or outbound transfer. A negative result helps rule out this collection vector but should
    be corroborated with the other questions in this playbook, since a single method can miss low-and-slow
    or living-off-the-land activity.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Windows Event ID 1
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Process hash IOC check\nsource IN [Windows Event ID 4688, Windows Event ID 1]\n| WHERE matches_action_criteria(\"\
      Process hash IOC check\")\n// Match Windows Event ID 4688/Sysmon 1 process hashes/names against\
      \ TI feeds for share-collection tools (e.g., secretsdump, smbclient, robocopy, rclone, ncp) and\
      \ \n| ALERT enrich(user, host, share, process, command_line)"
- question: '[Collection] Command rarity scoring: Are there rare command-line executions (bottom 1% over
    a 30-day per-host/role corpus) that were followed by network share access (Event 5145) within 5 minutes?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary searching network shares
    for files of interest leaves traces in share-access, process-execution, and file telemetry. This Statistical
    Method approach looks for the following signal: Score command-line rarity per host/role over a 30-day
    corpus and flag bottom 1% events followed by network share access (Event 5145) within 5 minutes; corpus-deviation
    scoring follows [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).
    A positive result -- a match, statistical outlier, or model alert -- suggests a host or user is reading/copying
    data from shares in a way that deviates from normal role-based behavior and may indicate staging for
    exfiltration; investigate the associated account, source host, target shares, and any subsequent local
    file creation or outbound transfer. A negative result helps rule out this collection vector but should
    be corroborated with the other questions in this playbook, since a single method can miss low-and-slow
    or living-off-the-land activity.'
  answer_sources: *id001
  range: Last 90 days (30-day rarity corpus; 5-minute correlation to Event 5145)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Command rarity scoring

      source IN [Windows Event ID 4688, Windows Event ID 1]

      | STATS baseline over 30d per (user, host)

      | COMPUTE deviation (z-score / percentile / change-point)

      // Score command-line rarity per host/role over a 30-day corpus and flag bottom 1% events followed
      by network share access (Event 5145) within 5 minutes; corpus-de

      | WHERE deviation > threshold | ALERT enrich(user, host, share)'
