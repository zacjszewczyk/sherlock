questions:
- question: Has any executable dropped into a Windows startup folder, or any new autorun registry value
    (Run/RunOnce, Winlogon Shell/Userinit/Notify, Image File Execution Options), referenced a file whose
    hash, path, or value data matches a high-confidence threat-intelligence indicator?
  context: Persistence via boot/logon autostart frequently begins with a file written to a startup directory
    or an autorun registry value being created. By watching Sysmon 11 (file create) and 13/14 plus Windows
    4657 (registry value writes) in known ASEP locations, resolving the referenced executable to its hash
    through the linked Sysmon 1/4688 process-create event, and matching that hash/path/value against curated
    TI feeds, an analyst can confirm a malicious autostart entry. A positive match in an autostart location
    is high-signal because legitimate software rarely uses these exact paths with known-bad artifacts.
    Portable Sigma rules cover Run/RunOnce, Winlogon, IFEO, and startup-folder variants.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - Windows Event ID 4657
  - 'NAI: Windows workstations and servers; specifically, user profile startup directories (e.g., %APPDATA%\Microsoft\Windows\Start
    Menu\Programs\Startup), system-wide startup folders, and the HKLM/HKCU hives of the Windows Registry.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (Sysmon EventID in (11,13,14) OR WinEventLog EventID=4657)\n  AND TargetObject IN startup_paths_or_autorun_keys\n\
      \  | join process_hash from (Sysmon EventID=1 OR WinEventLog EventID=4688)\n  | where file_hash\
      \ IN ti_feed OR image_path IN ti_feed OR value_data IN ti_feed\n  | alert"
- question: Compared with the prior scheduled snapshot of all Auto-Start Extensibility Points (ASEPs)
    on each host, has any new or changed autostart entry appeared that was not present before?
  context: 'Persistence in Persistence: because the set of legitimate autostart entries on a managed host
    is small and stable, any addition or change is high-signal. Collecting every ASEP entry on a schedule
    (e.g., autorunsc) and diffing against the previous snapshot lets the analyst treat new/changed entries
    as candidate persistence. A positive result (a delta with no corresponding software install) warrants
    investigation of the referenced binary and the process that created it; a negative (no delta) helps
    establish a clean baseline.'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - Windows Event ID 4657
  - 'NAI: Windows workstations and servers; specifically, user profile startup directories (e.g., %APPDATA%\Microsoft\Windows\Start
    Menu\Programs\Startup), system-wide startup folders, and the HKLM/HKCU hives of the Windows Registry.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  current_asep = collect_autoruns(host)\n  delta = current_asep - prior_snapshot(host)\n\
      \  | where delta is not empty\n  | alert on each new/changed entry with referenced_image and creating_process"
- question: Which autostart binaries, hashes, or registry value-data are statistically rare across the
    fleet (present on fewer than 1% of hosts or below the 5th percentile of frequency) or show a per-host
    modification rate beyond mean+3 sigma?
  context: Rarity and volume scoring complements IOC matching by catching novel persistence with no prior
    reputation. Build a 90-day baseline of executable names, hashes, and registry value data in autostart
    locations, then flag cross-host rarity (<1% prevalence / below 5th percentile) and report host-prevalence,
    new-binary byte size (Volume), and ASEP additions/host/day (Frequency). Apply mean+3 sigma control
    limits to per-host modification rates. Rare-and-new autostart entries are strong persistence candidates
    even absent a TI hit.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - Windows Event ID 4657
  - 'NAI: Windows workstations and servers; specifically, user profile startup directories (e.g., %APPDATA%\Microsoft\Windows\Start
    Menu\Programs\Startup), system-wide startup folders, and the HKLM/HKCU hives of the Windows Registry.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = autostart_entries last 90d grouped by name,hash,value_data\n  | compute host_prevalence,\
      \ frequency_percentile, bytes\n  | where host_prevalence < 1% OR frequency < p5\n  | also flag per_host_mod_rate\
      \ > mean+3*stddev\n  | report prevalence, volume, freq_per_host_per_day"
- question: When each autostart entry is scored by an anomaly model on path depth, filename/value-data
    entropy, PE signer status, parent process, creation hour, and cross-host prevalence, which entries
    exceed the tuned anomaly threshold?
  context: An Isolation Forest or gradient-boosted classifier can combine many weak signals into a single
    risk score for each autostart entry, catching persistence that evades single-feature rules. Train
    on benign autostart features, tune the contamination/decision threshold, alert above it, and surface
    the top-3 contributing features so an analyst understands why an entry scored high (e.g., high-entropy
    name, unsigned PE, written at an odd hour, seen on one host). This is a triage accelerator for the
    Persistence tactic.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - Windows Event ID 4657
  - 'NAI: Windows workstations and servers; specifically, user profile startup directories (e.g., %APPDATA%\Microsoft\Windows\Start
    Menu\Programs\Startup), system-wide startup folders, and the HKLM/HKCU hives of the Windows Registry.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [path_depth, name_entropy, value_entropy, signer_status, parent_proc, creation_hour,\
      \ host_prevalence]\n  score = IsolationForest.predict(features)\n  | where score > contamination_threshold\n\
      \  | alert with top_3_contributing_features"
- question: Does any autostart entry launch a scripting engine (powershell.exe, cscript.exe, wscript.exe)
    with obfuscation indicators such as '-enc', '-w hidden', '-nop', or long Base64 strings in its command
    line?
  context: Adversaries commonly point an autorun key or startup item at a scripting engine carrying an
    encoded or hidden payload, so the persistence survives reboot and evades casual inspection. Regex-scan
    process-create events (4688/Sysmon 1) for these engines with suspicious flags or long Base64 blobs,
    and correlate the parent back to a registry modification (Sysmon 13/14) to confirm the launch originates
    from an autostart mechanism. A match strongly indicates obfuscated persistence; a clean result reduces
    concern for that host.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 13
  - 'NAI: All Windows endpoints and servers, especially those with advanced PowerShell logging enabled;
    Windows Registry HKLM/HKCU hives.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (WinEventLog EventID=4688 OR Sysmon EventID=1)\n  AND Image IN (powershell.exe,cscript.exe,wscript.exe)\n\
      \  AND CommandLine MATCHES /(-enc|-encodedcommand|-w hidden|-nop|[A-Za-z0-9+/]{120,}={0,2})/\n \
      \ | correlate parent with Sysmon EventID in (13,14) on autorun key\n  | alert"
- question: Do command lines of autostart-launched scripts exceed the 95th-percentile Shannon entropy
    of known-good autostart scripts, suggesting obfuscation or encoding?
  context: Obfuscated or encoded command lines have markedly higher character entropy than normal scripts.
    Baseline the Shannon entropy of command lines for legitimate autostart scripts, then flag executions
    above the 95th percentile (especially privileged commands) as potential obfuscation. This statistical
    approach catches novel encoders that regex misses. A high-entropy autostart command line is a strong
    persistence indicator warranting decode-and-review.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 13
  - 'NAI: All Windows endpoints and servers, especially those with advanced PowerShell logging enabled;
    Windows Registry HKLM/HKCU hives.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = shannon_entropy(cmdline) for known autostart scripts\n  | for each autostart-launched\
      \ cmdline compute entropy\n  | where entropy > p95(baseline)\n  | alert"
- question: When autostart-launched command lines are scored by an obfuscation/anomaly model (gradient-boosted
    character/keyword features or BERT-embedding outlier detector), which exceed the high-risk threshold?
  context: Machine-learning models trained on obfuscated vs. benign command lines, or unsupervised BERT-embedding
    outlier detectors, generalize beyond fixed regex and entropy thresholds to flag novel obfuscation.
    Score autostart-launched command lines, alert on high-risk scores, and surface the top contributing
    tokens/features so the analyst can see which fragments drove the decision. This supports the Persistence
    hunt by catching evasive script-based autostarts.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 13
  - 'NAI: All Windows endpoints and servers, especially those with advanced PowerShell logging enabled;
    Windows Registry HKLM/HKCU hives.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = char_ngram + keyword_features(cmdline)  # or BERT embeddings\n  score = obfuscation_model.predict(features)\n\
      \  | where score > high_risk_threshold\n  | alert with top_contributing_tokens"
- question: Did any modification to a known autostart location (Run keys, Startup folders, Scheduled Tasks,
    services, WMI subscriptions) occur without a matching approved change ticket or known software-installation/patching
    event?
  context: Legitimate autostart changes almost always coincide with an approved change, deployment, or
    patch. Correlate registry/file/service/task events (Sysmon 11/13, Windows 4657/4698/4702/7045) against
    the change-management database and deployment logs, and alert on autostart or service modifications
    lacking an approved change. Prioritize service installs (7045/4697) which leave durable artifacts,
    and require abnormal parent-child lineage at boot/logon per detection strategy DET0274. An unapproved
    autostart change is a high-confidence persistence signal.
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4698
  - Windows Event ID 4702
  - Windows Event ID 7045
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - 'NAI: Change management database, software deployment servers, all Windows endpoints and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  autostart_changes = (Sysmon 11,13 OR WinEventLog 4657,4698,4702,7045)\n  | left join\
      \ change_tickets, deployment_logs on host,time_window\n  | where no_approved_change\n  | enrich\
      \ parent_child_lineage at boot/logon\n  | alert (prioritize 7045/4697 service installs)"
- question: Is any host experiencing a spike in autostart or service modification rate (count/min and
    per-day frequency) beyond its mean+3 sigma baseline?
  context: A burst of autostart/service modifications on a host can indicate scripted persistence deployment.
    Baseline per-host modification rates and flag spikes beyond mean+3 sigma, and report the cross-host
    rarity of the modified path to distinguish broad rollouts from targeted tampering. A spike on a normally
    quiet host, especially on a rare path, is a strong Persistence indicator.
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4698
  - Windows Event ID 4702
  - Windows Event ID 7045
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - 'NAI: Change management database, software deployment servers, all Windows endpoints and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  rate = count(autostart_mods) per host per minute and per day\n  | where rate > mean+3*stddev(host_baseline)\n\
      \  | annotate cross_host_rarity(modified_path)\n  | alert"
- question: Does the ordered boot/logon event stream on a host (registry-write to process-create to network-connect)
    contain out-of-order or low-probability sequences relative to the learned normal sequence?
  context: Persistence often produces a characteristic but anomalous event ordering at boot/logon. Train
    an LSTM next-event predictor (DeepLog-style) on the normal sequence of boot/logon events and flag
    out-of-order or low-probability sequences. Escalate matches with provenance node/subgraph anomalies
    and present an analyst-readable causal graph. This catches multi-step persistence that no single event
    reveals.
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4698
  - Windows Event ID 4702
  - Windows Event ID 7045
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - 'NAI: Change management database, software deployment servers, all Windows endpoints and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  seq = ordered_events(host, boot_logon_window)  # reg_write -> proc_create -> net_conn\n\
      \  p = LSTM_next_event.predict(seq)\n  | where observed not in top_k_predicted OR seq_prob < threshold\n\
      \  | escalate provenance_subgraph_anomaly\n  | alert with causal_graph"
- question: Does any autostarted process establish outbound connections to a known-C2 or newly registered/rare
    destination when Sysmon network events are joined with Zeek conn/dns logs and enriched with threat
    intelligence?
  context: A persistence foothold typically calls home. Join Sysmon 1/3 (process and network) with Zeek
    conn/dns logs, enrich destinations with TI and domain-age data, and alert when an autostarted process
    reaches known C2 or newly registered destinations. This ties the autostart artifact to actual command-and-control,
    confirming an active foothold under the Persistence tactic. A hit on a known-bad or freshly registered
    domain from an autostart process is high-confidence.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days; pivot +/- 24h around autostart execution
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  join (Sysmon EventID in (1,3)) with conn.log,dns.log on host,connuid/time\n  | where\
      \ process_is_autostart\n  | enrich dest with ti_feed, domain_age\n  | where dest IN c2_feed OR domain_age\
      \ < 30d\n  | alert"
- question: Do any autostart process-to-destination pairs exhibit low-variance connection inter-arrival
    times (regular beaconing) to a rare destination IP (99th-percentile rarity)?
  context: Beaconing malware connects at highly regular intervals. Measure the standard deviation of connection
    inter-arrival times per process-destination pair and flag low-variance (metronomic) intervals tied
    to rare destinations (99th-percentile rarity across the enterprise). Regular beaconing from an autostarted
    process to a rare destination is a classic C2 persistence pattern; jittered traffic to common destinations
    is less suspicious.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: ">-\n  per (process,dest): intervals = diff(conn_timestamps)\n  | compute stddev(intervals),\
      \ dest_rarity\n  | where stddev(intervals) < beacon_threshold AND dest_rarity > p99\n  | alert"
- question: Is any autostart process generating failed connections or NXDOMAIN responses at a rate exceeding
    its mean+3 sigma baseline (indicating dead/rotating C2 or DGA)?
  context: Dead, rotating, or algorithmically generated C2 produces elevated connection failures and NXDOMAIN
    responses. Baseline each autostart process's failed-connection and NXDOMAIN rate and alert when failures
    exceed mean+3 sigma, treating the failure rate as a distinct State signal. A persistence binary repeatedly
    failing to reach its controller is a strong indicator of an active but degraded C2 channel.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: ">-\n  baseline = failed_conn_rate + nxdomain_rate per autostart_process\n  | where current_rate\
      \ > mean+3*stddev\n  | annotate state=fail\n  | alert"
- question: Does a temporal provenance model flag an autostart-to-execution-to-C2 chain as a high-reconstruction-error
    subgraph for a host?
  context: Modeling the full causal chain catches persistence-plus-C2 that individual detectors miss.
    Model autostart process connections with a temporal provenance learner (KAIROS-style) and flag the
    autostart -> execution -> C2 chain as a high-reconstruction-error subgraph, emitting the causal graph
    and top contributing nodes for triage. This gives the analyst an end-to-end story linking the persistence
    mechanism to its network activity.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  graph = provenance(autostart_proc -> exec -> net_conn)\n  err = temporal_model.reconstruction_error(graph)\n\
      \  | where err > threshold\n  | alert with causal_subgraph, top_nodes"
- question: Did a newly installed Windows service (7045) subsequently emit start-failure, timeout, or
    crash events (7000/7009/7034) for a binary located in a user-writable or non-standard path?
  context: Hastily planted persistence services often crash-loop because they are unstable, unlike vetted
    installers. Alert when a recently installed service later emits start-failure/timeout/crash events
    for a binary in a user-writable or non-standard path, and correlate to the process that created the
    service. A new service from an odd path that immediately fails is a strong indicator of clumsy persistence
    and warrants binary triage.
  answer_sources:
  - Windows Event ID 7000
  - Windows Event ID 7009
  - Windows Event ID 7034
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers; System event log (Service Control Manager).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  new_svc = WinEventLog EventID=7045 where ImagePath IN user_writable_or_nonstandard\n\
      \  | join WinEventLog EventID in (7000,7009,7034) on service_name within window\n  | correlate creating_process\
      \ (Sysmon 1)\n  | alert"
- question: Is any single service crash-looping at a rate beyond the per-host mean+3 sigma baseline (e.g.,
    more than 3 failures per minute)?
  context: Crash loops are statistically distinguishable from occasional service failures. Baseline per-host
    service start-failure counts and flag crash-loops exceeding mean+3 sigma (e.g., >3 failures/min for
    one service), reporting the failure count and success/fail State. A persistent crash loop on a newly
    seen service indicates an unstable, recently planted persistence mechanism under the Persistence tactic.
  answer_sources:
  - Windows Event ID 7000
  - Windows Event ID 7009
  - Windows Event ID 7034
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers; System event log (Service Control Manager).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  fail_count = count(7000,7009,7034) per service per minute per host\n  | where fail_count\
      \ > mean+3*stddev(host_baseline)\n  | report failure_count, state\n  | alert"
- question: Does the service start ordering and outcome sequence on a host deviate from the learned normal
    boot sequence when scored by an LSTM next-event predictor?
  context: The normal sequence and outcome of service starts at boot is learnable per host. Train an LSTM
    (DeepLog-style) on normal service-start ordering and outcomes and flag anomalous start/failure sequences.
    A boot sequence with unexpected new services, abnormal ordering, or unusual failure patterns suggests
    injected persistence and merits investigation.
  answer_sources:
  - Windows Event ID 7000
  - Windows Event ID 7009
  - Windows Event ID 7034
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers; System event log (Service Control Manager).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  seq = service_start_events(host, boot_window)\n  | LSTM_next_event.predict(seq)\n  |\
      \ where observed not in top_k OR seq_prob < threshold\n  | alert"
- question: On Linux, was a systemd unit, SysV init script, cron entry, or XDG autostart desktop file
    created or written where the ExecStart/command path is unsigned, user-writable, or newly observed
    across the fleet?
  context: Linux persistence relies on autostart files in well-known paths. Use auditd watches on creat/write
    to systemd unit, init.d, cron, and ~/.config/autostart paths, correlate the writing process, and confirm
    subsequent boot execution of the referenced binary. A new or modified unit whose ExecStart points
    to an unsigned or user-writable binary is a strong Linux persistence indicator. Tie matches back to
    the writing process for attribution.
  answer_sources:
  - auditd:SYSCALL (creat/write)
  - auditd:PATH
  - Sysmon for Linux (ProcessCreate)
  - 'NAI: Linux servers and workstations; /etc/systemd/system, /usr/lib/systemd/system, /etc/init.d, /etc/cron.*,
    crontab files, ~/.config/autostart.'
  range: Last 90 days
  queries:
  - technology: auditd/pseudocode
    query: ">-\n  -w /etc/systemd/system -p wa; -w /etc/init.d -p wa; -w /etc/cron.* -p wa; -w ~/.config/autostart\
      \ -p wa\n  | on creat/write capture writing_process (auditd SYSCALL/PATH)\n  | join later ProcessCreate\
      \ of referenced ExecStart binary\n  | alert"
- question: Which Linux units or cron entries reference ExecStart paths that are rare across the fleet
    (<1% prevalence) or appear as new units, or show a write-rate spike beyond mean+3 sigma?
  context: Baselining the count and ExecStart paths of units/cron entries per host lets the analyst flag
    new units, rare ExecStart paths (<1% prevalence), and rate spikes beyond mean+3 sigma. Rare-and-new
    autostart definitions on Linux are strong persistence candidates even without a signature match, complementing
    the rule-based watch above.
  answer_sources:
  - auditd:SYSCALL (creat/write)
  - auditd:PATH
  - Sysmon for Linux (ProcessCreate)
  - 'NAI: Linux servers and workstations; /etc/systemd/system, /usr/lib/systemd/system, /etc/init.d, /etc/cron.*,
    crontab files, ~/.config/autostart.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = units+cron ExecStart paths per host\n  | where path_prevalence < 1% OR unit_is_new\
      \ OR write_rate > mean+3*stddev\n  | alert"
- question: Does node-level provenance graph learning flag a newly persisted Linux process whose file/network
    neighbors deviate from benign boot behavior?
  context: Provenance graph models (ThreaTrace/MAGIC) learn benign boot behavior at the node level and
    flag a newly persisted process whose file and network neighbors deviate, with causal-subgraph explainability.
    This catches Linux persistence that mimics legitimate file paths but behaves anomalously after boot,
    and gives the analyst an explainable subgraph for triage.
  answer_sources:
  - auditd:SYSCALL (creat/write)
  - auditd:PATH
  - Sysmon for Linux (ProcessCreate)
  - 'NAI: Linux servers and workstations; /etc/systemd/system, /usr/lib/systemd/system, /etc/init.d, /etc/cron.*,
    crontab files, ~/.config/autostart.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  graph = provenance(new_persisted_process)\n  score = node_provenance_model(graph)\n\
      \  | where node_anomaly > threshold\n  | alert with causal_subgraph"
- question: On macOS, was a LaunchAgent or LaunchDaemon property-list file created or modified, and did
    the listed ProgramArguments binary subsequently execute after logon?
  context: macOS persistence centers on LaunchAgent/LaunchDaemon plists. Alert on creation/modification
    of these plists correlated with anomalous execution of the listed ProgramArguments binary after logon.
    A new plist pointing to an unsigned/ad-hoc binary in a user-writable path that then runs at logon
    is a strong macOS persistence indicator. Correlate plist write to subsequent execution to confirm.
  answer_sources:
  - macos:unifiedlog
  - auditd (OpenBSM)
  - ESF file/exec events
  - 'NAI: macOS endpoints; /Library/LaunchAgents, /Library/LaunchDaemons, ~/Library/LaunchAgents, /System/Library/Launch*.'
  range: Last 90 days
  queries:
  - technology: macOS/ESF pseudocode
    query: ">-\n  ESF/unifiedlog file_create OR file_modify in (/Library/LaunchAgents,/Library/LaunchDaemons,~/Library/LaunchAgents,/System/Library/Launch*)\n\
      \  | extract ProgramArguments binary\n  | join ESF exec of that binary after logon\n  | alert"
- question: Which macOS plist ProgramArguments binaries are rare across the fleet (<1% prevalence) or
    unsigned?
  context: Baselining ProgramArguments binary paths/signatures across the macOS fleet lets the analyst
    flag rare (<1% prevalence) or unsigned payloads. A LaunchAgent/LaunchDaemon pointing to a rare or
