- question: Did a privileged boot process (winlogon.exe, services.exe) load a DLL from a user-writable/non-standard
    path or load an unsigned module that deviates from its historical loaded-module baseline?
  context: DLL search-order hijacking and module injection into privileged boot processes grant SYSTEM-level
    execution. Alert when privileged processes load DLLs outside their allowlist or unsigned modules per
    Sysmon 7. A privileged process loading a DLL from C:\Users or C:\ProgramData, or an unsigned module
    not seen before, is a strong privilege-escalation indicator. Maintain per-process module allowlists
    from a clean baseline.
