      \  AND CommandLine targets (Run key OR SYSTEM exec flags)\n  AND ParentImage IN (outlook.exe,winword.exe,excel.exe,\
      \ other_unexpected)\n  | alert"
- question: Which sc/schtasks/reg executions have parent processes that are rare compared with the normal
