- question: Does the per-process DLL load sequence for a privileged process show high reconstruction error
    or low probability when scored by an LSTM trained on normal load sequences?
  context: The order in which a privileged process loads its modules is consistent. Train an LSTM (DeepLog-style)
    on normal per-process DLL load sequences and flag high reconstruction-error / low-probability sequences,
    escalating with provenance subgraph anomalies. An anomalous module-load sequence in winlogon/services
    suggests injection for privilege escalation and merits investigation.
  answer_sources:
