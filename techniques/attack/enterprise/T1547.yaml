- question: Did sc.exe, schtasks.exe, or reg.exe create or modify an autostart mechanism for SYSTEM execution
    while spawned from an unexpected parent such as outlook.exe or winword.exe?
  context: LOLBins like sc/schtasks/reg are used to plant elevated autostart entries. Alert when Sysmon
    1/4688 show these utilities targeting Run keys or SYSTEM execution flags with unexpected parents (e.g.,
    Office apps), which suggests macro- or exploit-driven escalation rather than legitimate administration.
    A reg/sc/schtasks invocation parented by outlook.exe or winword.exe configuring SYSTEM autostart is
    a high-confidence privilege-escalation indicator.
