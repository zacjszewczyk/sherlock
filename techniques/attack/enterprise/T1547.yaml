name: 'T1547: Boot or Logon Autostart Execution'
id: 3f150a32-117e-440d-af4b-1afe1ebf482c
description: Investigate adversary use of boot or logon autostart execution (T1547) to persist across
  restarts and to elevate privileges. This playbook helps an analyst hunt for newly created or modified
  autostart mechanisms across Windows (Run/RunOnce keys, Winlogon Shell/Userinit/Notify, Image File Execution
  Options, startup folders, Windows services, scheduled tasks, WMI event subscriptions, and DLLs loaded
  by privileged boot processes), Linux (systemd units, SysV init scripts, cron entries, XDG autostart
  files), and macOS (LaunchAgent/LaunchDaemon property lists). It correlates autostart creation and modification
  with threat-intelligence IOC matches, fleet-wide rarity baselines, change-management records, obfuscated
  scripting-engine command lines, anomalous parent-child lineage at boot/logon, service start failures
  and crash loops, outbound beaconing from autostarted processes, and machine-learning anomaly scoring.
  The goal is to surface persistence and privilege-escalation footholds that run automatically and often
  with elevated (SYSTEM/root) rights.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
