name: 'T1003.004: LSA Secrets'
id: 417cbb0f-8fb4-4ac5-8487-e0259c63c680
description: Investigate adversary attempts to access Local Security Authority (LSA) secrets on Windows
  hosts, where an actor with SYSTEM-level access harvests service-account credentials, machine secrets,
  and other sensitive material either by reading the registry key HKEY_LOCAL_MACHINE\SECURITY\Policy\Secrets
  or by scraping LSASS process memory. This playbook helps an analyst hunt for the execution of known
  LSA-dumping utilities (Mimikatz, Impacket secretsdump, LaZagne, pypykatz), suspicious command lines
  and PowerShell script blocks containing LSA-dump keywords or obfuscation, unsanctioned reads of the
  LSA Secrets registry key, non-allowlisted read access to LSASS memory, and multi-stage registry-hive
  backup, access, and exfiltration sequences. Each question pairs deterministic detections with statistical
  baselining and machine-learning approaches so that renamed, obfuscated, or novel variants are still
  surfaced for triage, supporting the Credential Access tactic.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Was a process created whose image name, OriginalFileName, or file hash matches a known LSA-secrets
    dumping utility such as Mimikatz, Impacket secretsdump, LaZagne, or pypykatz?
  context: 'Adversaries who reach SYSTEM privileges frequently run purpose-built tools to extract LSA
    secrets from the registry or LSASS memory. Match process creation evidence (Event ID 4688 and Sysmon
    Event ID 1) against a curated list of LSA-dumping tools by Image, OriginalFileName, and, crucially,
    file hash so simple renaming does not evade detection. A hit is a high-confidence Credential Access
    indicator and should trigger immediate host isolation and credential rotation for any service accounts
    on the box; a clean result narrows the hunt to renamed or in-memory variants covered by the other
    methods here. References: [Atomic Red Team T1003.004](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.004/T1003.004.md);
    [Dumping LSA Secrets](https://www.ired.team/offensive-security/credential-access-and-credential-dumping/dumping-lsa-secrets).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "tools = [\"mimikatz\",\"secretsdump\",\"secretsdump.py\",\"lazagne\",\"pypykatz\"]\nALERT\
      \ FROM [Event4688, Sysmon1]\nWHERE lower(Image) IN tools\n   OR lower(OriginalFileName) IN tools\n\
      \   OR sha256(Image) IN known_lsa_tool_hashes"
- question: Is a process running as SYSTEM from a non-standard directory using a process name that is
    statistically rare across the environment, suggesting a renamed credential-dumping tool?
  context: 'Attackers rename dumping utilities to defeat name-based signatures, but a renamed binary still
    tends to be rare and to execute from unusual locations. Baseline per-host and per-role process-name
    frequency over at least 30 days and flag names below the 1st percentile (fewer than ~5 lifetime executions)
    that run as SYSTEM/S-1-5-18 from outside C:\Windows and C:\Program Files. A statistically novel SYSTEM-context
    binary in a temp or user path is a strong lead even when the exact tool is unknown; derive the percentile
    cutoff from your own estate to control false positives. References: [Finding Anomalies in Windows
    Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, User Endpoints'
  range: Last 90 days, with a >=30-day frequency baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "freq = GROUP [Event4688, Sysmon1] BY process_name, host_role => lifetime_count\nrare = FILTER\
      \ freq BY percentile(lifetime_count) < 1 OR lifetime_count < 5\nALERT WHERE rare AND user_sid ==\
      \ \"S-1-5-18\"\n  AND image_path NOT STARTSWITH (\"C:\\\\Windows\",\"C:\\\\Program Files\")"
- question: Can a supervised classifier flag a process creation as a likely LSA-dumping tool based on
    parent process, user/integrity context, image path, and name characteristics?
  context: 'When neither hashes nor frequency cleanly resolve a case, a Random Forest trained on parent
    process, user and integrity level, image path, and name features (entropy, length) can score suspicious
    creations. The model complements, not replaces, hash matching, which must keep running in parallel.
    To stay actionable, the alert must surface the top-3 contributing features (for example ''SYSTEM context,
    parent=cmd.exe, name entropy=4.6'') so an analyst can quickly judge whether the flagged execution
    is a credential-access attempt or benign administrative tooling. References: [Sometimes Simpler is
    Better](https://www.usenix.org/system/files/usenixsecurity25-bilot.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, User Endpoints'
  range: Last 90 days, scored at process-creation time
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = EXTRACT(parent_image, user_sid, integrity_level, image_path, name_entropy, name_length)

      score = random_forest_lsa_tool.predict_proba(features)

      explain = TOP3_FEATURES(features)

      ALERT WHERE score >= 0.85   # hash-match rule remains active in parallel'
- question: Does a process command line or PowerShell script block contain LSA-dumping strings such as
    lsadump::secrets, sekurlsa::lsa, Invoke-Mimikatz, LsaRetrievePrivateData, secretsdump, or reg.exe
    saving HKLM\SECURITY/HKLM\SYSTEM?
  context: 'Even when binaries are renamed, the command syntax used to dump LSA secrets is distinctive.
    Regex-match Event ID 4688 command lines and Event ID 4104 script blocks for Mimikatz modules (lsadump::secrets,
    lsadump::sam, sekurlsa::lsa), Invoke-Mimikatz, the LsaRetrievePrivateData API, secretsdump, and reg.exe
    with save/export targeting hklm\security or hklm\system. Alert on any match and allowlist sanctioned
    backup jobs by full command line and parent process so legitimate maintenance does not drown the signal.
    A match here is a direct Credential Access indicator tied to LSA secrets. References: [Sigma: Credential
    Acquisition via Registry Hive Dumping](https://github.com/SigmaHQ/sigma/blob/master/deprecated/windows/proc_creation_win_credential_acquisition_registry_hive_dumping.yml).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Critical Application Servers, Endpoint devices of administrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "patterns = /lsadump::(secrets|sam)|sekurlsa::lsa|Invoke-Mimikatz|LsaRetrievePrivateData|secretsdump/i\n\
      reg_dump = /reg(\\.exe)?\\s+(save|export).*hklm\\\\(security|system)/i\nALERT FROM [Event4688, Event4104]\n\
      WHERE command_line MATCHES patterns OR command_line MATCHES reg_dump\n  AND NOT allowlisted_backup(full_command_line,\
      \ parent_image)"
- question: Are PowerShell script blocks unusually long or high-entropy in a way consistent with obfuscated
    credential-dumping code, especially when paired with a credential keyword?
  context: Attackers obfuscate PowerShell to hide LSA-dump logic from string matching. Baseline script-block
    (Event ID 4104) length and Shannon entropy per host and role, then flag blocks above the 98th percentile
    (malicious obfuscation often exceeds 4.5 bits/char). To curb false positives, require a co-occurring
    credential-related keyword before alerting. A long, high-entropy block that also references LSA or
    secrets is a strong sign of concealed dumping tradecraft; derive the percentile cutoff from local
    data so legitimate large scripts do not dominate.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Critical Application Servers, Endpoint devices of administrators'
  range: Last 90 days, with per-host/role entropy baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats = GROUP Event4104 BY host, role => len, shannon_entropy(script_block)\nbaseline = PERCENTILE(stats,\
      \ 98)\nALERT WHERE (len > baseline.len OR entropy > baseline.entropy AND entropy > 4.5)\n  AND script_block\
      \ MATCHES /secret|lsadump|credential|sekurlsa/i"
- question: Can an NLP token model classify a command line or script block as malicious LSA-dumping activity,
    including renamed or obfuscated variants?
  context: 'Static regex misses novel and living-off-the-land variants. Classify command lines and script
    blocks with an NLP token model kept current through active learning, and run an evasion-aware misuse
    layer (such as AMIDES) in parallel to catch renamed or obfuscated dumping commands. The alert should
    surface the top-3 tokens that drove the score so an analyst can verify the model latched onto genuinely
    suspicious syntax rather than benign administrative phrasing. This provides resilient coverage for
    the Credential Access tactic when signatures lag attacker tradecraft. References: [Detecting Malicious
    Windows Commands Using NLP](https://doi.org/10.1007/978-3-030-12942-2_13); [Living-Off-The-Land Command
    Detection Using Active Learning](https://arxiv.org/abs/2111.15039); [AMIDES](https://github.com/fkie-cad/amides).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Critical Application Servers, Endpoint devices of administrators'
  range: Last 90 days, scored at execution time
  queries:
  - technology: ML pipeline pseudocode
    query: 'tokens = TOKENIZE(command_line OR script_block)

      score = nlp_command_classifier.predict_proba(tokens)   # active-learning refreshed

      misuse = amides_evasion_model.score(tokens)            # parallel misuse layer

      explain = TOP3_TOKENS(tokens)

      ALERT WHERE score >= 0.85 OR misuse >= misuse_threshold'
- question: Did a process outside the established system allowlist read or export the LSA Secrets registry
    key HKLM\SECURITY\Policy\Secrets, and were any access attempts denied?
  context: 'Legitimate access to HKLM\SECURITY\Policy\Secrets is essentially limited to lsass.exe and
    services.exe. With a SACL configured on that key, monitor Event ID 4656/4663 (and Sysmon Event ID
    13) for read/export operations and alert whenever the requesting process or user is outside the allowlist.
    Also catch reg.exe save/export of HKLM\SECURITY at process-creation time. Log both granted (S) and
    failed/denied (F) 4656 access, because repeated denials are a strong sign of a privilege-shy dumper
    probing the key. Any unsanctioned access is a direct Credential Access indicator against LSA secrets.
    References: [Sigma: Credential Acquisition via Registry Hive Dumping](https://github.com/SigmaHQ/sigma/blob/master/deprecated/windows/proc_creation_win_credential_acquisition_registry_hive_dumping.yml).'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 13 (Sysmon)
  - 'NAI: Domain Controllers, Tier 0 Servers, Servers with sensitive service accounts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "allowlist = [\"lsass.exe\",\"services.exe\"]\nALERT FROM [Event4656, Event4663, Sysmon13]\n\
      WHERE object_name CONTAINS \"SECURITY\\\\Policy\\\\Secrets\"\n  AND process_name NOT IN allowlist\n\
      // also: reg.exe save/export of HKLM\\SECURITY at process creation\n// record access_result in (Success,\
      \ Failure) -- repeated Failure = privilege-shy dumper"
- question: Is access to the LSA Secrets registry key occurring at an unusual frequency or time of day,
    or from a process with no prior history of touching that key?
  context: 'Beyond a static allowlist, behavioral rarity exposes stealthy access. Baseline the frequency
    and time-of-day at which each source process touches the Secrets key, then flag occurrences more than
    3 standard deviations above norm or outside the 95% time window. Treat any access by a process with
    zero prior history as rare by definition. A first-ever or off-hours touch of the LSA Secrets key,
    even by a process not on a blocklist, is a meaningful Credential Access lead worth correlating with
    nearby process-creation and logon events. References: [Finding Anomalies in Windows Event Logs Using
    Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf); [Context-based
    irregular activity detection](https://www.sciencedirect.com/science/article/pii/S0957417423014938).'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 13 (Sysmon)
  - 'NAI: Domain Controllers, Tier 0 Servers, Servers with sensitive service accounts'
  range: Last 90 days, with per-process frequency and time-of-day baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = GROUP [Event4656,Event4663,Sysmon13] BY process_name\n   WHERE object CONTAINS \"SECURITY\\\
      \\Policy\\\\Secrets\" => count, hour_distribution\nALERT WHERE current.count > base.mean + 3*base.stddev\n\
      \   OR current.hour OUTSIDE base.p95_time_window\n   OR base.prior_history == 0"
- question: Does an Isolation Forest model score a registry access to the LSA Secrets key as anomalous
    based on process, parent, user, integrity, hour, and prior-access history?
  context: An Isolation Forest trained on registry-access features (process, parent, user, integrity level,
    hour, prior-access count) can isolate rare access combinations that neither the allowlist nor simple
    thresholds catch. Keep the deterministic SACL + allowlist rule as the detection floor, and use the
    model to surface subtler anomalies. The alert should list the top-3 anomalous features so an analyst
    understands why the access stood out and can decide whether it represents LSA-secret theft or a rare-but-benign
    administrative action.
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 13 (Sysmon)
  - 'NAI: Domain Controllers, Tier 0 Servers, Servers with sensitive service accounts'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = EXTRACT(process, parent, user, integrity, hour, prior_access_count)

      score = isolation_forest_registry.decision_function(features)

      explain = TOP3_FEATURES(features)

      ALERT WHERE score <= anomaly_threshold   # SACL+allowlist rule remains the floor'
- question: Did a process outside the allowlist request read access to LSASS memory, particularly with
    GrantedAccess masks containing PROCESS_VM_READ (0x10), 0x1010, or 0x1410, or with call traces through
    dbghelp.dll/dbgcore.dll?
  context: 'In-memory LSA-secret dumping (for example Mimikatz lsadump::secrets) reads LSASS process memory.
    Alert when Sysmon Event ID 10 (or SACL-based Event ID 4656) records LSASS access from a source outside
    the whitelist, especially with GrantedAccess masks of 0x10 (PROCESS_VM_READ), 0x1010, or 0x1410, or
    when the call trace passes through dbghelp.dll or dbgcore.dll (classic minidump behavior). This is
    one of the highest-fidelity Credential Access detections; a hit should drive immediate containment
    and credential rotation, since attacker access to LSASS exposes secrets and cached credentials. References:
    [Sigma LSASS access rules](https://github.com/SigmaHQ/sigma); [CAR-2019-08-001](https://car.mitre.org/analytics/CAR-2019-08-001/);
    [Dumping LSA Secrets](https://www.ired.team/offensive-security/credential-access-and-credential-dumping/dumping-lsa-secrets).'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 10 (Sysmon)
  - 'NAI: All Windows Endpoints, All Windows Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT FROM [Sysmon10, Event4656]\nWHERE TargetImage CONTAINS \"lsass.exe\"\n  AND SourceImage\
      \ NOT IN lsass_access_allowlist\n  AND (GrantedAccess IN [\"0x10\",\"0x1010\",\"0x1410\"] OR GrantedAccess\
      \ HAS 0x10)\n  OR CallTrace CONTAINS (\"dbghelp.dll\",\"dbgcore.dll\")"
- question: Is a non-whitelisted process reading more LSASS memory than the benign envelope, or repeatedly
    failing OpenProcess attempts against LSASS?
  context: 'Model LSASS access sessions by total bytes read and number of read attempts, and alert when
    a non-whitelisted process exceeds the benign envelope, which is characteristic of bulk credential
    extraction. Separately, track failed or denied OpenProcess attempts against LSASS as a distinct high-signal
    indicator: a blocked dumper (for example one stopped by Credential Guard or PPL) still reveals intent
    through its denied access attempts. Both the volume anomaly and the failure pattern are strong Credential
    Access signals tied to LSA-secret theft from memory. References: [Effective Detection of Credential
    Thefts from Windows LSASS Memory](https://www.usenix.org/system/files/raid20-ah-fat.pdf).'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 10 (Sysmon)
  - 'NAI: All Windows Endpoints, All Windows Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "sessions = GROUP lsass_access BY source_process => total_bytes_read, read_attempts\nALERT\
      \ WHERE source_process NOT IN allowlist\n  AND (total_bytes_read > benign_envelope.p99 OR read_attempts\
      \ > benign_envelope.p99)\n// separately:\nALERT WHERE lsass_openprocess.result == \"Failure\"  #\
      \ blocked dumper"
- question: Does a time-series model show an anomalous spike in non-system LSASS access counts for a given
    hour or process?
  context: Apply ARIMA or STL decomposition to hourly counts of non-system LSASS accesses and alert when
    counts exceed the prediction interval. This catches bursts of access activity that a static threshold
    would miss while adapting to normal diurnal patterns. Retain the deterministic GrantedAccess rule
    as the detection floor. The alert should report the contributing hour and process so an analyst can
    pivot directly to the responsible binary and determine whether the spike reflects a credential-dumping
    campaign against LSASS memory.
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 10 (Sysmon)
  - 'NAI: All Windows Endpoints, All Windows Servers, Domain Controllers'
  range: Last 90 days, with hourly time-series modeling
  queries:
  - technology: ML pipeline pseudocode
    query: 'series = HOURLY_COUNT(lsass_access WHERE source NOT system)

      model = ARIMA_or_STL(series)

      ALERT WHERE observed > model.prediction_interval_upper

      report(contributing_hour, contributing_process)  # GrantedAccess rule remains floor'
- question: Was a SECURITY or SYSTEM registry hive saved (via reg.exe save/export, vssadmin, or wmic shadow
    copy) and then opened within five minutes by a different, non-backup process?
  context: 'Decrypting LSA secrets offline requires both the SECURITY and SYSTEM hives, so co-occurring
    saves of both are high-fidelity. Alert when reg.exe save/export of HKLM\SECURITY or HKLM\SYSTEM, or
    vssadmin/wmic shadow-copy creation, is followed within five minutes by a non-backup process opening
    the resulting .hiv/.sav/.save file. This sequence captures the classic ''dump hives to disk, then
    read them'' workflow. A matched chain, especially one involving both hives, is a strong Credential
    Access indicator and should prompt review of where the hive files were taken next. References: [Sigma
    file access to reg hives](https://github.com/SigmaHQ/sigma/blob/master/hunting/windows/file/file_access/file_access_win_susp_reg_and_hive.yml);
    [Atomic Red Team T1003.004](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.004/T1003.004.md).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 11 (Sysmon)
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Domain Controllers, File Servers hosting backups, Network Egress Points'
  range: Last 90 days, with a 5-minute save-to-access correlation window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "save = FILTER Event4688 BY command_line MATCHES\n   /reg.*(save|export).*hklm\\\\(security|system)|vssadmin.*create\
      \ shadow|wmic.*shadowcopy/i\naccess = FILTER [Event4663, Sysmon11] BY target_file MATCHES /\\.(hiv|sav|save)$/\n\
      \   AND process_name NOT IN backup_allowlist\nALERT WHERE JOIN save WITH access ON host, 5m\n//\
      \ both SECURITY and SYSTEM saved together = highest fidelity"
- question: After a registry hive backup, did a host send anomalously large .sav/.hiv/.save files or byte
    volumes to a low-reputation or newly seen external IP, or generate blocked egress attempts?
  context: Stolen hives are often exfiltrated for offline cracking. Baseline outbound transfer volume
    per host using Zeek conn.log and files.log, and flag large .sav/.hiv/.save files or byte counts more
    than 3 standard deviations above norm sent to low-reputation or newly observed external IPs shortly
    after a registry backup. Also profile failed or blocked egress connections as a separate signal of
    attempted exfiltration. Pairing the host-side hive backup with an unusual outbound transfer ties the
    Credential Access activity to likely data theft and helps scope what may already have left the environment.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 11 (Sysmon)
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Domain Controllers, File Servers hosting backups, Network Egress Points'
  range: Last 90 days, prioritizing the window shortly after a registry backup
  queries:
  - technology: Zeek/pseudocode
    query: "base = GROUP conn.log BY host => bytes_out baseline\nALERT FROM [conn.log, files.log]\nWHERE\
      \ (filename MATCHES /\\.(sav|hiv|save)$/ OR bytes_out > base.mean + 3*base.stddev)\n  AND dest_ip\
      \ IN (low_reputation OR newly_seen_external)\n  AND occurs_shortly_after(registry_backup_event)\n\
      // separately flag conn_state in (S0,REJ,RSTO) blocked egress"
- question: Can a sequence model link a hive-backup command, hive-file access, and outbound transfer into
    a single LSA-secret theft chain?
  context: 'The full kill chain for offline LSA-secret theft is backup command -> hive file access ->
    outbound transfer. Model this event sequence with an LSTM or log-sequence detector (such as DeepLog),
    or correlate it via an ATT&CK-tagged provenance graph (such as HOLMES). A sequence model captures
    the relationship between steps that individually may look benign, and it can detect timing-spread
    or partially obfuscated variants of the chain. Surface the matched step sequence in the alert so an
    analyst can rapidly confirm the hive-theft narrative and respond across host and network evidence
    for this Credential Access technique. References: [Malware detection on Windows audit logs using LSTMs](https://www.sciencedirect.com/science/article/abs/pii/S0167404821002133);
    [DeepLog](https://acmccs.github.io/papers/p1285-duA.pdf); [HOLMES](https://arxiv.org/abs/1810.01594).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 11 (Sysmon)
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Domain Controllers, File Servers hosting backups, Network Egress Points'
  range: Last 90 days, modeling multi-stage event sequences
  queries:
  - technology: ML pipeline pseudocode
    query: 'events = ORDER [Event4688, Event4663, Sysmon11, conn.log, files.log] BY time PER host

      seq_score = lstm_log_sequence.predict(events)   # or DeepLog / HOLMES provenance graph

      ALERT WHERE seq_score MATCHES pattern(backup_cmd -> hive_access -> outbound_transfer)

      surface(matched_step_sequence)'
