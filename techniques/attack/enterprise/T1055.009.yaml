    also produce contemporaneous map->mem access on the host (auditd PATH matching). The actor/target/credential
    correlation mirrors the proven approach for the sibling ptrace primitive. A positive result is a non-root
    user running an overwrite utility against another process''s memory map; a negative result is an isolated,
    well-understood diagnostic by an admin during a maintenance window. In the context of the Stealth
