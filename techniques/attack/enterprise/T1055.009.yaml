  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'auditd (syscall in [openat,write,pwrite64,lseek]) where path matches "/proc/*/maps" as READ

      | join same host, same actor_pid, within 120s, auditd write-capable access to "/proc/*/mem" (flags
      O_WRONLY|O_RDWR) as WRITE

      | where actor_euid != 0 AND (target_uid == 0 OR target_exe in [sshd,systemd,cron,mysqld,postgres])

      | join sysmon_linux (EID==1 child in [/bin/sh,/bin/bash,python,perl] OR EID==3 new_outbound) where
      pid==target_pid OR ppid==target_pid within 120s

      | emit alert(actor_pid,actor_uid,target_pid,target_uid,target_exe,proc_paths,bytes_written)'
- question: Is the observed /proc/*/maps or /proc/*/mem access statistically anomalous for this executable,
    user, and host role compared to learned daily/weekly baselines (write frequency, bytes written, map->mem
    sequence rate, distinct target PIDs touched)?
  context: 'Benign programs emit a compact, stable set of file/syscall sequences, so cross-process /proc
    memory access stands out as extreme rarity. Build per-executable/per-user/per-host-role baselines
    from auditd/osquery and compute: (a) frequency of /proc/*/mem writes per executable per minute, (b)
    bytes written to /proc/*/mem (volume), (c) map->mem sequence rate, and (d) distinct target PIDs touched
    per hour (fan-out). Flag events above the 99.9th percentile for the host role and boost severity when
    the target is a root-owned daemon or when the map->mem transition occurs in under 30 seconds (automation).
    Also profile failure-mode signals as distinct features: EPERM/EACCES on /proc/*/mem open/write and
    blocked ptrace attempts, which reveal an adversary probing for an injectable target before succeeding.
    In the context of the Stealth tactic (TA0005), this directly supports the mission question: "Has an
    adversary escalated privileges by injecting code into a higher-privilege process using the /proc filesystem?"
    Source citations: [Detecting Intrusions Using System Calls, IEEE S&P](https://ieeexplore.ieee.org/document/766910).'
  answer_sources:
  - Linux Auditd
  - linux:osquery (process events; /proc/*/maps access)
  - Sysmon for Linux Event ID 1
