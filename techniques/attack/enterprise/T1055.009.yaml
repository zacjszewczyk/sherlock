- question: 'In the 10 minutes after a suspected map->mem sequence, does the targeted process show a behavioral
    delta: new child-process types, new outbound destinations/ports with abnormal byte ratios, or reads
    of sensitive files like /etc/shadow or private keys?'
  context: 'After any suspected map->mem sequence, compute a behavioral delta for the target over the
