name: 'T1055.009: Process Injection: Proc Memory'
id: 845a32b6-bc43-449f-baab-bc8a078e2f4e
description: 'Investigate suspected Linux proc-memory process injection (T1055.009), in which an adversary
  enumerates a target process''s memory layout via /proc/[pid]/maps and then overwrites its address space
  via /proc/[pid]/mem (commonly with dd) to execute arbitrary code inside a live, often higher-privileged
  process. This playbook helps an analyst answer whether an actor used the /proc filesystem to inject
  code in order to evade process-based defenses (Stealth) and/or escalate privileges (Privilege Escalation).
  It guides hunting for the high-fidelity read-then-write invariant (maps read followed by a write-capable
  mem access where the actor is unprivileged and the target is a root-owned daemon), execve of overwrite
  utilities (dd, sed, perl, python, gdb, strace) whose command line references /proc/*/mem or /proc/*/maps,
  and the post-injection behavioral drift of the targeted process: unexpected shell/interpreter children,
  first-ever outbound connections from normally network-silent daemons, suspicious DNS lookups, and sensitive-file
  access. It combines symbolic-logic correlation rules, statistical rarity/baseline scoring, and machine-learning
  sequence, outlier, and provenance-graph models across auditd, osquery, Sysmon for Linux, and Zeek telemetry.'
