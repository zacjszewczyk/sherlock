    auditd. Network-silent daemons that suddenly connect are strong outliers. Score the delta with weighted
    per-target-process rarity and alert when multiple features exceed the 99th percentile. Include success/fail
    state (failed connects, 404/timeout) as distinct signals, since both successful and failed follow-on
    activity corroborate injected-code execution and help an analyst reconstruct intent. In the context
