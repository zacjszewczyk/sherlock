questions:
- question: Did an unprivileged process read /proc/[pid]/maps and then perform a write-capable access
    to /proc/[pid]/mem of a root-owned or allowlisted daemon, with the targeted PID (or its children)
    spawning a shell/interpreter or opening a new outbound connection within ~120 seconds?
  context: 'This correlation captures the highest-fidelity signature of proc-memory injection: the adversary
    enumerates offsets and ROP gadgets by reading /proc/[pid]/maps, then overwrites the same region through
    /proc/[pid]/mem (openat O_WRONLY/O_RDWR followed by write/pwrite64/lseek). Legitimate cross-process
    /proc/*/mem writes are extremely rare, and the address-linked read-then-write invariant (enumerate,
    then overwrite) sharply reduces false positives. Key conditions: actor euid != 0 while target uid
    == 0 or target binary in a privileged allowlist (sshd, systemd, cron, database daemons). Confirm by
    detecting, within 120 seconds, the target PID or immediate children executing /bin/sh, /bin/bash,
    python, or perl (Sysmon for Linux EID 1) OR a new outbound connection (EID 3). The alert payload should
    include actor PID/UID, target PID/UID, target executable, exact /proc paths, and byte-count written
    so the analyst can gauge how much memory was overwritten. In the context of the Stealth tactic (TA0005),
    this directly supports the mission question: "Has an adversary escalated privileges by injecting code
    into a higher-privilege process using the /proc filesystem?" Source citations: [Can You Run My Code?,
    ACM](https://dl.acm.org/doi/10.1145/3708821.3736206); [The Definitive Guide to Linux Process Injection,
    Akamai](https://www.akamai.com/blog/security-research/the-definitive-guide-to-linux-process-injection).'
