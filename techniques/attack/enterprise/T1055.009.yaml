  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = percentiles_by(exe,user,host_role) of\n  [mem_writes_per_min, bytes_written, map_then_mem_rate,\
      \ distinct_target_pids_per_hour]\nscore event where any_metric > p99.9(host_role)\nboost if target_is_root_daemon\
      \ OR map_to_mem_delta < 30s\nfeature failed_access = count(EPERM|EACCES on /proc/*/mem) , blocked_ptrace\n\
      alert if score high"
- question: Does a sequence/anomaly model over per-process-family syscall and file-access streams flag
    the ordered pattern open(/proc/[pid]/maps) -> open(/proc/[pid]/mem,write) -> write/pwrite64/lseek
    as an outlier above a tuned threshold?
  context: 'Train an anomaly model (HMM or sequence model) over syscall/file-access sequences per Linux
    process family, separating admin tools from service daemons. HMM syscall models achieve 76-99% detection
    of behavioral anomalies, and adding call-stack return-address context further disambiguates hijacked
    control flow. Score live events and alert when a process exhibits the maps-read -> mem-write -> write/pwrite64/lseek
    sequence above the outlier threshold. Make the alert explainable by attaching the top-3 contributing
    features (unusual syscall tokens, abnormal inter-event time deltas, the actor/target-UID pairing)
    so an analyst can quickly judge whether this is benign debugging or genuine injection. In the context
    of the Stealth tactic (TA0005), this directly supports the mission question: "Has an adversary escalated
    privileges by injecting code into a higher-privilege process using the /proc filesystem?" Source citations:
    [Detecting Intrusions Using System Calls, IEEE S&P](https://ieeexplore.ieee.org/document/766910);
    [Anomaly Detection Method Based on HMMs Using System Call and Call Stack Information, Springer](https://link.springer.com/chapter/10.1007/11596981_47);
    [CNN-GRU XAI (LIME/SHAP), PeerJ CS](https://peerj.com/articles/cs-3258/).'
