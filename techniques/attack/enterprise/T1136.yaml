name: 'T1136: Create Account'
id: ecdaed6c-4c1a-473a-81b8-03595a56713f
description: This playbook helps an analyst investigate whether an adversary has established persistence
  by creating unauthorized user accounts across enterprise and cloud environments (MITRE ATT&CK T1136,
  Create Account). It guides the investigation of suspicious Windows account-creation events (Event ID
  4720) including matches against threat-intel watchlists and suspicious naming conventions, abnormal
  account-creation volume/frequency, anomalous parent-child process chains spawning account management
  utilities (net.exe, net1.exe, wmic.exe, powershell.exe), correlation of new accounts with rapid privileged-group
  additions (Event ID 4728/4732/4756), statistical username anomalies (high Shannon entropy or typosquatting
  via Levenshtein distance), and immediate post-creation activity such as interactive logons (Event ID
  4624) or anomalous network/DNS behavior (Zeek conn.log/dns.log). It also covers identity creation in
  cloud and identity-provider control planes (AWS CloudTrail CreateUser/CreateAccessKey/AttachUserPolicy,
  Azure AD/Entra Add user, Okta), including first-seen principals, unusual source IP/geo/user-agent, AccessDenied
  enumeration bursts, and rapid privilege attachment. Each question pairs symbolic-logic, statistical,
  and machine-learning detection approaches so an analyst can confirm or refute unauthorized account creation
  and scope the persistence mechanism.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has any Windows account-creation event (Event ID 4720) produced a TargetUserName that matches
    a threat-intelligence watchlist of known-bad account names or a regular expression for suspicious
    naming conventions (e.g., names mimicking system/service accounts, default tool names, or names with
    excessive digits)?
  context: Adversaries frequently reuse predictable or tooling-default account names (e.g., 'support_<hex>',
    'svc-*', backup/admin lookalikes) when establishing persistence. By correlating every Event ID 4720
    TargetUserName against a maintained watchlist of known-malicious usernames and suspicious-pattern
    regexes, an analyst can rapidly surface high-confidence persistence attempts. A match should embed
    the threat-feed reference and the firing rule for triage; a positive result strongly indicates unauthorized
    account creation tied to a known TTP, while a negative result does not rule out novel names (covered
    by other questions). This is tactic-specific to Persistence because the new account is the foothold
    the adversary intends to retain across reboots and credential changes.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Member Servers, Administrator Workstations, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "watchlist = load_threat_intel_usernames() + suspicious_regexes(['.*admin.*','.*backup.*','test','support_[a-f0-9]{8}','svc-.*'])\n\
      on EventCode=4720:\n  if TargetUserName in watchlist OR any(regex.match(TargetUserName)):\n    alert(severity=high,\
      \ fields=[TargetUserName, SubjectUserName, feed_ref, rule_id])"
- question: Is the enterprise-wide rate of account creation (accounts per hour) or the per-creator frequency
    (accounts per creator-account per 10 minutes) abnormally elevated or exhibiting an abrupt regime shift
    compared to a 30-day baseline?
  context: A sudden spike in account creation volume or a single creator account churning out many accounts
    in a short window is a strong physics-of-the-attack signal of automated or bulk persistence provisioning.
    By maintaining a 30-day moving average and standard deviation per metric and applying an online change-point
    test (CUSUM or PELT), the analyst detects both gradual drift and abrupt jumps. Alerting when the hourly
    count exceeds three standard deviations above baseline OR a change point is detected, and surfacing
    the top-3 contributors (initiating SubjectUserName, source host, delta vs baseline), focuses triage
    on the responsible identity. Positive results warrant scoping which accounts were created in the burst;
    this is Persistence-relevant because bulk creation often seeds multiple fallback footholds.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Member Servers, Administrator Workstations, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "metrics: volume = count(EventCode=4720) per hour; freq = count per SubjectUserName per 10min\n\
      baseline = moving_avg_30d(metric), sd = moving_std_30d(metric)\ncp = changepoint_CUSUM_or_PELT(metric_series)\n\
      if metric > baseline + 3*sd OR cp.detected:\n  alert(top3=[SubjectUserName, src_host, metric-baseline])"
- question: When scored by a trained risk classifier, do any account-creation events (Event ID 4720) exceed
    the tuned risk threshold based on creator role, timing, username string characteristics, and whether
    creation originated from a privileged host?
  context: Not all suspicious account creations match a fixed rule; a supervised model can learn subtle
    combinations of risk. Train a gradient-boosted classifier (e.g., XGBoost) on labeled historical Event
    ID 4720 events using features such as creator account role, time of day, day of week, username characteristics
    (length, character set, digit ratio), and whether creation initiated from a privileged host. Score
    new events in real time and alert above a tuned threshold (>0.8), emitting the top-3 contributing
    SHAP features so analysts get an explainable rationale rather than a bare score. Validate against
    the CERT Insider Threat Test Dataset to bound false positives. High scores indicate creations that
    resemble historical malicious provisioning; this supports Persistence detection by catching account
    creations that evade static watchlists.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Member Servers, Administrator Workstations, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = xgboost.load('acct_create_risk')\nfeatures = [creator_role, hour, dow, uname_len,\
      \ uname_charset, digit_ratio, from_priv_host]\non EventCode=4720:\n  score = model.predict_proba(features)\n\
      \  if score > 0.80:\n    alert(score=score, top3=shap_top_features(model, features))"
- question: Was any account created (Event ID 4720) from a host that is NOT an approved administrative
    workstation/automation host, or by a subject account that is NOT on the authorized automation account
    list?
  context: Legitimate account provisioning typically occurs from a small set of approved admin workstations
    or automation hosts, by a known set of service/automation identities. By correlating Event ID 4720
    with its SubjectLogonId and SubjectServerName and comparing the initiating host against an approved-host
    inventory and the subject username against an authorized-automation list, the analyst flags creations
    that originate from unexpected consoles or via lateral movement. Including the creator identity, host
    tag, and logon session in the alert enables quick scoping. A positive result strongly suggests an
    unauthorized console or hands-on-keyboard lateral creation; this is core to Persistence because adversaries
    often create accounts from compromised endpoints rather than sanctioned tooling.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Member Servers, Administrator Workstations, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on EventCode=4720:\n  join SubjectLogonId, SubjectServerName\n  if SubjectServerName not in\
      \ approved_admin_hosts OR SubjectUserName not in authorized_automation_accounts:\n    alert(creator=SubjectUserName,\
      \ host=SubjectServerName, logon=SubjectLogonId)"
- question: Did an account-management utility (net.exe, net1.exe, wmic.exe, powershell.exe) execute an
    account-creation command (Event ID 4688 / Sysmon 1) with a suspicious parent process such as a web
    server (w3wp.exe) or productivity app (WINWORD.EXE, EXCEL.EXE)?
  context: Account creation initiated by an interactive admin tool is expected, but the same commands
    spawned by a web server worker, Office application, or an oddly-parented svchost indicate code execution
    following exploitation (e.g., web shell or macro) leading to persistence. Trigger on Event ID 4688
    or Sysmon Event ID 1 when ProcessName is net.exe/net1.exe/wmic.exe/powershell.exe AND CommandLine
    contains '/add', 'New-LocalUser', 'New-ADUser', 'Enable-LocalUser', or 'useraccount create'. Escalate
    when ParentProcessName is on a suspicious-parent list and include filtered command-line arguments.
    A positive result links account creation to an exploitation chain, a strong Persistence indicator
    following initial access.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4720
  - Windows Event ID 4722
  - 'NAI: Domain Controllers, Web Servers, User Endpoints, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "creators = ['net.exe','net1.exe','wmic.exe','powershell.exe']\ncmd_re = /(\\/add|New-LocalUser|New-ADUser|Enable-LocalUser|useraccount\
      \ create)/i\nsusp_parents = ['w3wp.exe','WINWORD.EXE','EXCEL.EXE','svchost.exe(non-system)']\non\
      \ (EventCode=4688 OR Sysmon=1) where ProcessName in creators AND CommandLine ~ cmd_re:\n  sev =\
      \ high if ParentProcessName in susp_parents else medium\n  alert(sev, parent=ParentProcessName,\
      \ child=ProcessName, cmd=CommandLine)"
- question: For account-provisioning helpers (net.exe, dsadd, etc.), is the observed parent process rare
    or never-before-seen across the environment, falling below the 1st percentile of observed parent frequency?
  context: Maintaining a frequency table of parent processes per account-provisioning helper lets the
    analyst quantify how unusual a given parent-child pairing is, distinguishing first-ever from recurring
    parents (a State metric). Raise an alert when a parent-child pair falls below the 1st percentile of
    observed frequency or when a never-before-seen parent is observed for a critical asset group, listing
    the parent, child, and observed count. This statistical approach catches novel exploitation chains
    that a static suspicious-parent list would miss. A positive result indicates an unusual provisioning
    origin worth investigating; it is Persistence-relevant because adversaries' tooling chains differ
    from routine IT automation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4720
  - Windows Event ID 4722
  - 'NAI: Domain Controllers, Web Servers, User Endpoints, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "freq[parent][child] = historical_count\non account_helper_exec(child in ['net.exe','dsadd',...]):\n\
      \  p = percentile_rank(freq[ParentProcessName][child])\n  if p < 1 OR freq[ParentProcessName][child]==0\
      \ (esp. critical_assets):\n    alert(parent=ParentProcessName, child=child, count=freq[ParentProcessName][child])"
- question: Does a trained parent-child process anomaly model flag any account-creation process sequence
    (e.g., w3wp -> powershell -> net /add) as anomalous?
  context: Following the ProblemChild approach, train an XGBoost classifier over parent-child process
    features plus a rare-process detector on legitimate provisioning sequences drawn from Event ID 4688/Sysmon
    1. The model flags multi-step chains such as 'w3wp -> powershell -> net /add' that individually may
    look benign but collectively indicate exploitation-driven account creation. Surface the model probability
    and the top-3 contributing features (parent image, command tokens, integrity level). A high anomaly
    probability indicates a process lineage inconsistent with sanctioned provisioning; this supports Persistence
    detection by catching obfuscated or living-off-the-land creation chains.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4720
  - Windows Event ID 4722
  - 'NAI: Domain Controllers, Web Servers, User Endpoints, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = problemchild_xgboost.load()\non process_tree where leaf creates account:\n  feats\
      \ = [parent_image, cmd_tokens, integrity_level, ancestry]\n  score = model.predict_proba(feats)\n\
      \  if score > threshold:\n    alert(score=score, top3=shap_top_features(model, feats))"
- question: Was a newly created account (Event ID 4720) added to a high-privilege group (Event ID 4728/4732/4756)
    within ~10 minutes, by a creator not on the authorized account-creation allow-list, or outside an
    approved change window?
  context: Rapid escalation of a brand-new account into Domain Admins, Administrators, or other privileged
    groups is a hallmark of adversary persistence and privilege consolidation. Maintain an explicit allow-list
    of accounts authorized to create accounts and a list of privileged groups; trigger a correlation rule
    when a 4720 occurs outside the allow-list, or when a subsequent 4728/4732/4756 adds the new account
    to a privileged group within 10 minutes, especially outside approved change windows. Include creator
    identity, target group, and timing. A positive result is a high-fidelity Persistence-plus-privilege
    signal warranting immediate containment.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4728
  - Windows Event ID 4732
  - Windows Event ID 4756
  - 'NAI: Domain Controllers, Active Directory Federation Services (ADFS), IT Service Management (ITSM)
    Platform, Human Resources Systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "priv_groups = ['Domain Admins','Administrators','Enterprise Admins',...]\non EventCode=4720\
      \ as C:\n  flag1 = C.SubjectUserName not in authorized_creators\n  join EventCode in (4728,4732,4756)\
      \ as G where G.MemberName==C.TargetUserName AND G.time-C.time <= 10min AND G.GroupName in priv_groups\n\
      \  if flag1 OR G exists (esp. outside change_window):\n    alert(creator=C.SubjectUserName, group=G.GroupName,\
      \ dt=G.time-C.time)"
- question: Does the timing of a 4720-then-privileged-add sequence deviate (z-score > 3) from the responsible
    administrator's historical creation/privilege-modification schedule, or trigger a cadence change-point?
  context: Administrators tend to provision and modify privileges on predictable schedules. Profile each
    administrator's historical account-creation and privilege-modification times (day of week/time) and
    compute the z-score of each 4720-then-privileged-add event time against that baseline, complemented
    by a change-point test to catch cadence shifts. Raise a medium-high alert when the z-score exceeds
    3 or a change point fires, reporting the observed time, baseline window, and deviation. Off-hours
    or out-of-pattern privileged provisioning is a strong indicator of compromised admin credentials being
    used for Persistence; a positive result should be corroborated with session and source-host context.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4728
  - Windows Event ID 4732
  - Windows Event ID 4756
  - 'NAI: Domain Controllers, Active Directory Federation Services (ADFS), IT Service Management (ITSM)
    Platform, Human Resources Systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline[admin] = hist_distribution(creation_times, priv_mod_times)\non sequence(4720 -> priv_add)\
      \ by admin:\n  z = (event_time - mean(baseline[admin]))/sd(baseline[admin])\n  cp = changepoint(baseline[admin].series)\n\
      \  if z > 3 OR cp.detected:\n    alert(time=event_time, baseline=baseline[admin].window, deviation=z)"
- question: Does a learned provisioning-sequence model flag an account-creation chain that lacks the expected
    preceding authorization steps (HR ticket -> ITSM approval -> 4720 -> group add)?
  context: 'Legitimate account provisioning usually follows a traceable chain: an HR ticket, an ITSM approval,
    the Event ID 4720 creation, then a group membership change. Model these chains as a heterogeneous
    graph and learn embeddings as in Log2vec, ingesting HR/ITSM and AD logs. Score new sequences and flag
    those lacking preceding authorization steps or deviating from learned normal sequences, surfacing
    the probability score and the top-3 contributing nodes/edges (missing approval, unusual creator, unusual
    group). A positive result indicates an account created without legitimate business workflow, a strong
    Persistence indicator that an adversary bypassed sanctioned provisioning.'
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4728
  - Windows Event ID 4732
  - Windows Event ID 4756
  - 'NAI: Domain Controllers, Active Directory Federation Services (ADFS), IT Service Management (ITSM)
    Platform, Human Resources Systems'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "graph = build_hetero_graph(HR_tickets, ITSM_approvals, AD_4720, group_events)\nemb = log2vec.embed(graph)\n\
      on new provisioning sequence:\n  score = anomaly(emb(sequence))\n  if missing(approval_steps) OR\
      \ score > threshold:\n    alert(score=score, top3=[missing_approval, unusual_creator, unusual_group])"
- question: Does any new account's TargetUserName (Event ID 4720) deviate from the corporate canonical
    username format enforced by regex (e.g., '^[a-z]+\.[a-z]+[0-9]*$')?
  context: Organizations typically follow a strict username convention (e.g., firstname.lastname). Codify
    this as a regex and match each Event ID 4720 TargetUserName, alerting when a new username deviates
    from the pattern and including the failed pattern and offending substring in the alert for triage.
    Names that break the convention often indicate manually-created adversary accounts or tooling-generated
    identities. A positive result is a low-cost, high-signal indicator for further review; this supports
    Persistence detection because off-standard account names frequently belong to unsanctioned footholds
    rather than HR-provisioned users.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Member Servers, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "canon = /^[a-z]+\\.[a-z]+[0-9]*$/\non EventCode=4720:\n  if not canon.match(TargetUserName):\n\
      \    alert(name=TargetUserName, pattern=canon, offending=substr_not_matching)"
- question: Does a new username (Event ID 4720) have Shannon entropy above the 99th percentile of existing
    usernames, or a Levenshtein distance of 1-2 to an existing privileged account name (typosquatting)?
  context: Adversary or tool-generated usernames often appear random (high entropy) or deliberately mimic
    a privileged account with a one- or two-character change (typosquatting) to blend in. Pre-compute
    the Shannon-entropy and length distributions for all existing usernames; for each new 4720 TargetUserName,
    alert when entropy exceeds the 99th percentile OR when the Levenshtein distance to an existing privileged
    username is 1 or 2. Report the entropy value, percentile, and nearest privileged name. A positive
    entropy result suggests automated creation, while a small Levenshtein distance suggests intentional
    impersonation of a privileged identity, both strong Persistence indicators.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Member Servers, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "ent_dist = entropy_distribution(existing_usernames); priv_names = privileged_usernames\non\
      \ EventCode=4720:\n  e = shannon_entropy(TargetUserName)\n  nearest = min(priv_names, key=lambda\
      \ p: levenshtein(TargetUserName,p))\n  if e > percentile99(ent_dist) OR levenshtein(TargetUserName,\
      \ nearest) in (1,2):\n    alert(entropy=e, pct=rank(e,ent_dist), nearest_priv=nearest)"
- question: Does a character-level outlier model (one-class SVM or autoencoder trained on legitimate username
    n-grams) flag a new username (Event ID 4720) as anomalous beyond the tuned threshold?
  context: Beyond entropy and edit distance, a character-level model can capture the subtle structure
    of legitimate usernames. Train a one-class SVM or character-level autoencoder on n-grams of legitimate
    usernames and evaluate each new username from Event ID 4720; alert when the reconstruction error or
    outlier score crosses a tuned threshold. Output the anomaly score and the top-3 most anomalous character
    n-grams driving the score, and validate against benign username corpora to bound false positives.
    A high outlier score indicates a username structurally unlike the organization's population, supporting
    Persistence detection of adversary-created identities.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Member Servers, SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = oneclass_svm_or_char_autoencoder.train(legit_username_ngrams)\non EventCode=4720:\n\
      \  score = model.outlier_score(ngrams(TargetUserName))\n  if score > threshold:\n    alert(score=score,\
      \ top3_ngrams=most_anomalous_ngrams(model, TargetUserName))"
- question: Was a new account creation (Event ID 4720) followed within 15 minutes by an interactive/remote
    logon (Event ID 4624, type 2 or 10) for the same account, exhibiting impossible-travel or accompanied
    by failed logons (Event ID 4625)?
  context: An account that is created and immediately used interactively is a strong sign of hands-on-keyboard
    adversary activity rather than routine provisioning (where new accounts often sit unused until the
    user's start date). Alert when a 4720 is followed within 15 minutes by a 4624 (logon type 2 or 10)
    for the same TargetUserName; apply impossible-travel/geo-velocity logic to the source IP and track
    failed logons (Event ID 4625) for the new account as a distinct State signal of credential testing.
    Include source IP, geo, workstation, and target host. A positive result indicates the adversary is
    actively exercising the persistence account.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Domain Controllers, User Endpoints, Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on EventCode=4720 as C:\n  join EventCode=4624 as L where L.TargetUserName==C.TargetUserName\
      \ AND L.LogonType in (2,10) AND L.time-C.time <= 15min\n  impossible = geo_velocity(prev_login_geo,\
      \ L.src_geo) infeasible\n  failed = count(4625 where TargetUserName==C.TargetUserName)\n  if L exists:\n\
      \    alert(src_ip=L.IpAddress, geo=L.src_geo, wks=L.WorkstationName, target=L.host, impossible_travel=impossible,\
      \ failed_logons=failed)"
- question: After an account is created on a host, does that host's outbound network volume or port usage
    (Zeek conn.log) spike beyond 3 standard deviations from baseline, or do DNS failure/entropy metrics
    (Zeek dns.log) indicate DGA/C2?
  context: A newly created account that triggers anomalous network behavior on its host may signal C2
    establishment or data movement following persistence. Baseline each host's outbound Volume (bytes/connections)
    and port distribution from Zeek conn.log; after an account is created on a host, monitor the next
    hour and alert when outbound volume exceeds 3 standard deviations above baseline or connections target
    ports outside the host's top 95th percentile. Also track NXDOMAIN/failed-resolution rate and DNS name
    entropy spikes in Zeek dns.log as a distinct failure-mode signal for DGA/C2. Report the metric, baseline,
    and deviation. A positive result links the new account to active malicious network operations.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Domain Controllers, User Endpoints, Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline[host] = {bytes, conns, port_dist} from conn.log\non account_created(host):\n  window\
      \ = next 1h\n  if out_bytes(window) > baseline[host].mean + 3*sd OR ports(window) outside top95(port_dist):\n\
      \    alert(metric, baseline, deviation)\n  nx = NXDOMAIN_rate(dns.log, window); ent = mean_qname_entropy(window)\n\
      \  if nx > baseline_nx OR ent > baseline_ent: alert(dga_c2=true)"
- question: Does a temporal authentication/communication graph model flag the newly created account's
    first edges (e.g., connecting to rare destinations/ports or new external IPs) as anomalous?
  context: Modeling the environment as a temporal authentication/communication graph (users, hosts, destinations)
    lets the analyst score the brand-new edges a freshly created account introduces. Using scalable temporal
    link prediction as in Euler (validated on the LANL User-Computer Authentication Dataset), flag subgraphs
    where a new user node connects to rare destinations/ports and output the anomaly score with the top-3
    contributing edges (rare host, rare port, new external IP). A high anomaly score indicates the new
    account is immediately reaching atypical resources, consistent with adversary use of a persistence
    account for lateral movement or C2.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Domain Controllers, User Endpoints, Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = temporal_graph(users, hosts, destinations)\nmodel = euler_link_predictor.train(G_history)\n\
      on new_account_edges(account):\n  score = model.anomaly(new_edges)\n  if score > threshold:\n  \
      \  alert(score=score, top3_edges=[rare_host, rare_port, new_external_ip])"
- question: Was a cloud/IdP identity created (AWS CloudTrail CreateUser/CreateAccessKey, Azure AD 'Add
    user', Okta create) by a principal, userAgent, or source IP outside the approved provisioning baseline,
    or quickly followed by AttachUserPolicy to a privileged policy?
  context: In cloud environments adversaries create IAM users or access keys to establish credentialed
    persistence that needs no malware on hosts. Alert on CloudTrail CreateUser/CreateAccessKey (and equivalent
    Azure AD 'Add user'/Okta create) when the userAgent, source IP, or principal is outside the approved
    provisioning baseline. Apply the high-specificity S3 Browser (GUI-vil/LUCR-1) rule, and correlate
    a CreateUser followed by AttachUserPolicy to a privileged policy within 10 minutes. A positive result
    indicates unauthorized cloud identity provisioning, a direct Persistence mechanism in the control
    plane; include principal, source IP, userAgent, and the attached policy in the alert.
  answer_sources:
  - AWS CloudTrail CreateUser
  - AWS CloudTrail CreateAccessKey
  - AWS CloudTrail AttachUserPolicy
  - Azure AD Audit Add user
  - Okta System Log
  - 'NAI: Cloud Control Plane (CloudTrail/Azure Activity), Identity Provider Audit Logs, SaaS Admin Logs,
    SIEM/Data Lake'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on CloudTrail eventName in ('CreateUser','CreateAccessKey') (or AzureAD 'Add user'/Okta create):\n\
      \  if userAgent not in approved_agents OR sourceIPAddress not in approved_ranges OR principal not\
      \ in approved_provisioners OR userAgent~='S3 Browser':\n    alert(severity=high)\n  join eventName='AttachUserPolicy'\
      \ within 10min to privileged_policy:\n    alert(escalate, principal=userIdentity, policy=policyArn,\
      \ src=sourceIPAddress)"
- question: For a given principal, is a CreateUser/CreateAccessKey call a first-seen account-management
    action in the lookback window, or is it preceded by a burst of distinct AccessDenied errors indicating
    permission enumeration?
  context: Adversaries who compromise a cloud principal often probe their permissions (generating AccessDenied
    errors) before performing account-management actions they have never used before. Per principal, baseline
    CloudTrail API usage and flag account-management calls (CreateUser/CreateAccessKey) not seen in the
    lookback window using a first-seen approach. Separately profile each principal's AccessDenied error
    rate as a distinct State/failure-mode signal, alerting on bursts of distinct denied actions preceding
    a successful creation. Report the first-seen action, denied-action count, and source IP. A positive
    result indicates a principal stepping outside its normal behavior to create persistence identities.
  answer_sources:
  - AWS CloudTrail CreateUser
  - AWS CloudTrail CreateAccessKey
