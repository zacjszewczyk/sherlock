- question: Across all service ImagePath parent directories enterprise-wide, is a service installed in
    a directory that falls in the bottom 5% of frequency, has never been previously observed, or has a
    modified Z-score > 3.5?
  context: A statistical frequency baseline of service directories surfaces uncommon install locations
    even when they are not on a static blocklist. Enumerate all service ImagePath parent directories across
    the enterprise and maintain a frequency count; flag any service installed in a directory in the bottom
    5% of frequency, never previously observed, or with a modified Z-score above 3.5. Report the directory,
    its enterprise host/install count, and rank in the alert. Under the Execution tactic, a service registered
    in a directory that essentially no other service in the environment uses is a strong anomaly indicating
    attacker-staged execution rather than vetted software.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - 'NAI: All Windows Endpoints and Servers, particularly multi-user systems like Remote Desktop Session
    Hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=windows (EventCode=7045 OR EventCode=4697)

      | eval pdir=parent_dir(coalesce(ImagePath, Service_File_Name))

      | eventstats dc(host) as dir_hosts count as dir_installs by pdir

      | eventstats p5(dir_installs) as p5 median(dir_installs) as med mad(dir_installs) as mad

      | eval mz=0.6745*(dir_installs-med)/mad

      | where dir_installs<=p5 OR mz>3.5 OR dir_installs=1

      | table _time host ServiceName pdir dir_hosts dir_installs mz'
