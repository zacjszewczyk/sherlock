name: 'T1569.002: Service Execution'
id: 77385abc-31db-4a59-af2f-5dc875bc013a
description: 'This playbook helps an analyst investigate whether an adversary executed code by abusing
  the Windows service control manager (services.exe) via tools such as sc.exe, net.exe, PowerShell (New-Service/Set-Service),
  reg.exe, or PsExec. It guides hunting across multiple, complementary lines of evidence: new service
  installations matching known-bad indicators or exhibiting suspicious image paths and command interpreters
  (Event ID 7045/4697); service-management command-line execution that creates or modifies services to
  run payloads from user-writable or remote (UNC) locations (Event ID 4688); the characteristic ephemeral
  service lifecycle of remote administration tools (create -> start -> stop/delete within minutes, correlated
  with Type 3 logons and ADMIN$ access); abnormal child processes spawned under the Service Control Manager
  or service hosts (e.g., services.exe or svchost.exe spawning cmd.exe/powershell.exe/recon LOLBins);
  and services whose binaries reside in user-writable directories rather than protected system paths.
  For each line of evidence the playbook provides symbolic-logic rules, statistical-anomaly methods, and
  machine-learning approaches to surface malicious service execution while distinguishing it from legitimate
  administrative activity.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
