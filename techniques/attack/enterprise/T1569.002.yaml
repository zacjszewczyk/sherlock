    digital-signature status, historical parent-directory prevalence), do they receive a suspicious classification
    or an anomaly score above 0.65, and which top features drive the risk?
  context: Combining path and signature features in a model captures risky installs that individual heuristics
    underweight. Train a decision-tree/XGBoost classifier or an unsupervised Isolation Forest on path
    features (depth, presence of 'Users'/'Temp'/'AppData', user-writable flag, digital-signature status,
    historical parent-directory prevalence) and score new installs; alert on a suspicious classification
    or anomaly score above 0.65. Surface the top-3 features driving the risk score (e.g., 'path user-writable',
    'unsigned binary', 'directory prevalence in bottom 5%'). A high-risk score from an unsigned binary
    in a user-writable, low-prevalence path is a compelling indicator of malicious service execution;
    signed binaries in common system paths score low and are routine.
