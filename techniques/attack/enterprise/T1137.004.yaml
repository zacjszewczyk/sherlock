questions:
- question: 'For Persistence via Outlook Home Page (Outlook Home Page), does the telemetry support ''Monitor
    for Set-MailboxFolder with WebViewURL''? In other words, can you confirm whether alert whenever a
    ''Set-MailboxFolder''/''UpdateFolder'' operation in the M365 unified audit log sets the ''WebViewURL''
    property to a non-null value, and treat any external/IP/file-share URL as high severity because the
    Home Page feature is legacy and rarely used legitimately (Outlook Home Page T1137.004, Sigma: Persistence
    Via Outlook Home Page)?'
  context: 'An Outlook folder''s properties are modified to set a ''WebViewURL'' (mailbox folder Home
    Page) via Exchange/M365 mailbox operations, especially when the URL points to an external domain,
    file-sharing site, or raw IP. Capture Volume (count of folder-config changes per mailbox/day), Frequency
    (changes/min during a session), and State (succeeded vs failed Set operations). This question supports
    the Persistence mission question: "Is the adversary maintaining persistence using Outlook Home Pages?
    (PIR)" The Outlook Home Page feature (WebViewURL) is a legacy, rarely-used customization that loads
    an internal or external URL whenever a folder is opened; adversaries abuse it to silently execute
    attacker-controlled HTML/script every time Outlook starts, giving them durable persistence that survives
    credential resets and reboots. Approach (Symbolic Logic): Alert whenever a ''Set-MailboxFolder''/''UpdateFolder''
    operation in the M365 unified audit log sets the ''WebViewURL'' property to a non-null value, and
    treat any external/IP/file-share URL as high severity because the Home Page feature is legacy and
    rarely used legitimately (Outlook Home Page T1137.004, Sigma: Persistence Via Outlook Home Page).
    This is a deterministic, rule-based check: it fires only when explicit, corroborated conditions are
    met, so a positive result is high-confidence and should be triaged immediately, while a negative result
    narrows the field but does not rule out stealthier behavior. Citations: [Outlook Home Page T1137.004](https://attack.mitre.org/techniques/T1137/004/),
    [Sigma: Persistence Via Outlook Home Page](https://detection.fyi/sigmahq/sigma/windows/registry/registry_set/registry_set_persistence_outlook_homepage/).'
  answer_sources:
  - Microsoft 365 Unified Audit Log (Exchange mailbox activities)
  - Exchange Set-MailboxFolderConfiguration / UpdateFolder records
  - 'NAI: Microsoft 365 Tenant'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Monitor for Set-MailboxFolder with WebViewURL (Symbolic Logic)


      INPUT: Microsoft 365 Unified Audit Log (Exchange mailbox activities), Exchange Set-MailboxFolderConfiguration
