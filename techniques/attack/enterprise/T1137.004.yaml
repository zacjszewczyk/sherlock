name: 'T1137.004: Outlook Home Page'
id: 90e55733-0fee-4142-9187-751a21f9bad4
description: 'Investigate whether an adversary is establishing or maintaining persistence by abusing Microsoft
  Outlook''s legacy Home Page (WebViewURL) feature, in which a folder is configured to load an internal
  or external URL that renders attacker-controlled HTML/script each time the folder is opened. This playbook
  helps an analyst hunt for: Set-MailboxFolder/UpdateFolder operations that set a WebViewURL in the Microsoft
  365 unified audit log (especially to external, file-share, raw-IP, or newly registered/low-reputation
  domains); registry writes to HKCU\...\Outlook\WebView\<folder>\URL by processes other than outlook.exe
  (e.g., powershell.exe, cscript.exe, wscript.exe, or MAPI tools like Ruler); outlook.exe spawning script
  interpreters, shells, or COM/DDE LOLBins with download/execution command lines; anomalous outlook.exe
  network connections (new domains, dynamic DNS, raw IPs, non-Office user-agents, beaconing, and payload-retrieval
  failures); and Outlook child processes outside an expected allowlist. It correlates Office Suite/M365
  audit telemetry with Windows endpoint logs (Sysmon, Security/PowerShell event logs) and network logs
  (Zeek, proxy, passive DNS) to answer whether the Outlook Home Page feature is being weaponized for persistence
  and execution.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
