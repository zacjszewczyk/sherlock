questions:
- question: '[Stealth] Discovery-to-C2 correlation rule (Symbolic Logic): Can you determine whether a
    process executes a series of host-based discovery commands within a short time window (e.g., under
    60 seconds) and subsequently initiates a network connection to a destination matching a known malicious
    Command and Control (C2) threat intelligence feed. -- specifically, applying the ''Discovery-to-C2
    correlation rule'' (Symbolic Logic) approach to surface this behavior?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary uses environmental keying
    to constrain malware execution to the intended target and to defeat sandboxing and reverse engineering,
    decrypting its payload only after collecting target-specific environmental values. This evidence focuses
    on the condition that a process executes a series of host-based discovery commands within a short
    time window (e.g., under 60 seconds) and subsequently initiates a network connection to a destination
    matching a known malicious Command and Control (C2) threat intelligence feed. The ''Discovery-to-C2
    correlation rule'' approach (Symbolic Logic) pursues that signal as follows: Correlate Event ID 4688/Sysmon
    EID 1 processes executing discovery commands (whoami, systeminfo, ipconfig, netsh, nltest /domain_trusts,
    wmic csproduct) with Zeek conn.log connections within five minutes and alert when the destination
    matches a high-confidence C2 feed; build the discovery match list from vetted patterns in [Recon Information
    for Export, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_recon.yml),
    [Recon Activity Via Nltest.EXE, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_nltest_recon.yml)
    and [CAR-2021-02-002 Get System Elevation, MITRE CAR](https://car.mitre.org/analytics/CAR-2021-02-002/).
    A positive result -- a rule match, a statistical outlier, or a model alert -- indicates the host may
    be performing the environmental discovery and validation that precedes keyed payload decryption and
    execution; pivot to the responsible process and its parent lineage, the user and host context, any
    cryptographic module loads or file decryption, and subsequent network or execution activity to confirm
    the discovery-to-decryption chain. A negative result helps reduce the likelihood of this keying vector
    but should be corroborated with the other questions in this playbook, since environmental keying is
    deliberately stealthy and any single method can be evaded.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Endpoint devices, Domain Controllers, Network egress points (Firewall/Proxy), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Discovery-to-C2 correlation rule

      source IN [Windows Event ID 4688, Zeek conn.log]

      | where matches_known_discovery_or_keying_pattern(process, command_line, dns_query, conn)

      | correlate by (host, pid_or_parent_pid) within short_window

      | where condition_met  // see method detail

      | emit alert with process, parent, command_line, dest, signature_status, timestamps'
- question: '[Stealth] Rarity scoring for discovery-driven connections (Statistical Method): Can you determine
    whether a process executes a series of host-based discovery commands within a short time window (e.g.,
    under 60 seconds) and subsequently initiates a network connection to a destination matching a known
    malicious Command and Control (C2) threat intelligence feed. -- specifically, applying the ''Rarity
    scoring for discovery-driven connections'' (Statistical Method) approach to surface this behavior?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary uses environmental keying
    to constrain malware execution to the intended target and to defeat sandboxing and reverse engineering,
    decrypting its payload only after collecting target-specific environmental values. This evidence focuses
    on the condition that a process executes a series of host-based discovery commands within a short
    time window (e.g., under 60 seconds) and subsequently initiates a network connection to a destination
    matching a known malicious Command and Control (C2) threat intelligence feed. The ''Rarity scoring
    for discovery-driven connections'' approach (Statistical Method) pursues that signal as follows: Baseline
    each host''s discovery-bearing process-to-destination pairs over 30 days and flag combinations in
    the top 1% of rarity (first-seen tuples), applying the per-(host,user,command_line) new_terms approach
    of [Unusual Discovery Signal, Elastic](https://github.com/elastic/detection-rules/blob/main/rules/windows/discovery_signal_unusual_discovery_signal_proc_cmdline.toml);
    treat connection failure state as a distinct signal by separately counting blocked egress, NXDOMAIN,
    and 4xx/5xx responses per [NgViz, Born and Gustafson](https://arxiv.org/pdf/1004.4359) so a low-volume
    keyed beacon is not masked by successful-traffic baselines. A positive result -- a rule match, a statistical
    outlier, or a model alert -- indicates the host may be performing the environmental discovery and
    validation that precedes keyed payload decryption and execution; pivot to the responsible process
    and its parent lineage, the user and host context, any cryptographic module loads or file decryption,
    and subsequent network or execution activity to confirm the discovery-to-decryption chain. A negative
    result helps reduce the likelihood of this keying vector but should be corroborated with the other
    questions in this playbook, since environmental keying is deliberately stealthy and any single method
    can be evaded.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Endpoint devices, Domain Controllers, Network egress points (Firewall/Proxy), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Rarity scoring for discovery-driven connections

      source IN [Windows Event ID 4688, Zeek conn.log]

      | build_baseline per (host, user) over 30d  // rarity / n-gram prob / entropy / duration / failure-rate

      | compute_score(current_window)

      | where score in top_1pct OR exceeds mean+3sigma OR below_percentile_threshold

      | also_track failure_state (blocked_egress, NXDOMAIN, SERVFAIL, 4xx/5xx) as distinct signal

      | emit alert with score, contributing_metric, host, user'
