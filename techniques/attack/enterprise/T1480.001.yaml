name: 'T1480.001: Execution Guardrails: Environmental Keying'
id: a493c582-723a-435f-b6cc-323bef9cfd63
description: 'This playbook helps an analyst investigate whether a sophisticated adversary is using Environmental
  Keying (a form of Execution Guardrails) to evade defenses, hide their TTPs, and constrain malware execution
  to a specific target environment under the Stealth tactic. With environmental keying, a payload derives
  its decryption key from target-specific values (network shares, joined AD domain, hostname, installed
  software/versions, MAC/IP addresses, system time, or physical devices), so the malware only decrypts
  and runs where the adversary intends and resists sandbox detonation and reverse engineering. Because
  the keying values must first be collected from the host, the most reliable observable is a discovery-to-decryption-to-execution
  behavioral chain. This playbook guides the hunt across Windows, Linux, and macOS for: tight bursts of
  host- and network-discovery commands (whoami, systeminfo, ipconfig, netsh, nltest /domain_trusts, wmic
  csproduct, getmac, hostname, quser; uname, id, ifconfig/ip, route, mount, ps; system_profiler, sw_vers,
  dscl, networksetup, scutil); ordered guardrail command chains and abnormally high discovery counts within
  short windows; correlation of discovery with outbound C2 connections, cryptographic library/module loads,
  and payload execution; self-termination of unsigned short-lived binaries indicating an environmental-key
  mismatch; and external-IP/self-hostname reconnaissance via DNS and ''what-is-my-IP'' services. Detection
  methods combine symbolic-logic correlation rules, statistical baselining (rarity, n-gram probability,
  entropy, duration and failure-rate scoring), and machine learning (LSTM next-command prediction, autoencoder
  reconstruction-error, one-class host profiling, DBSCAN clustering, and provenance-graph chain detection)
  applied to Windows Security/Sysmon/WMI/PowerShell logs, auditd/osquery/syslog, macOS unified logs and
  FSEvents, and Zeek conn.log/dns.log, so the analyst can corroborate suspected environmental keying against
  process lineage, command sequencing, cryptographic activity, and network reconnaissance context.'
type: technique
