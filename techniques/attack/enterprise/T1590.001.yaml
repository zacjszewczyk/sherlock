name: 'T1590.001: Domain Properties'
id: e4b3c7f7-d346-4bd8-a351-4635e3934ae3
description: Investigate evidence that an adversary is gathering information about your organization's
  network domain properties (owned domains, registrar/administrative data, contacts, business addresses,
  and name servers) to support targeting. This playbook helps an analyst hunt for reconnaissance signals
  across network and endpoint telemetry, including threat-intel-listed or mass-scanner source IPs querying
  corporate DNS or connecting to public-facing services, HTTP/S requests to web servers and cloud API
  endpoints (e.g., autodiscover, GetUserRealm) carrying scanner User-Agent/URI signatures, anomalous executions
  of DNS/WHOIS utilities (nslookup.exe, whois.exe, Resolve-DnsName) from unusual user or parent-process
  contexts, high-volume DNS queries producing NXDOMAIN bursts with high-entropy labels, and external IPs
  sweeping many distinct internal hosts or service ports. Each question pairs deterministic symbolic-logic
  rules, statistical baselines, and machine-learning approaches so detections remain defensible even when
  threat-intel enrichment is unavailable.
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Is any external source IP that appears on a high-confidence threat-intelligence scanner/C2
    feed, or that matches known mass-scanner tool fingerprints (ZMap/Masscan packet and timing traits),
    performing DNS queries for our corporate domains or initiating connections to our public-facing services?
  context: 'This question surfaces reconnaissance against domain properties by joining Zeek dns.log and
    conn.log on source IP and alerting when that IP either matches a high-confidence threat-intel listing
    or exhibits documented mass-scanner fingerprints. Critically, the rule fires on first-party logs alone:
    threat-intel is an enrichment layer only, so detection does not depend on feed availability or coverage.
    In the Reconnaissance tactic, a known scanner touching corporate DNS or perimeter services is an early
    indicator that an adversary is mapping owned domains and live services prior to phishing or initial
    access. A positive result is an IP with both recon-style activity in your logs and an external reputation
    or fingerprint hit; a negative result still leaves the statistical and ML detections to catch novel
    sources. The ZMap/Masscan packet and timing fingerprints used here are documented in [An Internet-Wide
    View of Internet-Wide Scanning](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf).'
  answer_sources: &id001
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: External-facing DNS Resolvers, Network Perimeter Firewalls, Web Application Firewalls'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "  join dns.log, conn.log on id.orig_h\n  let ip = id.orig_h\n  where dst in corporate_domains(dns.query)\
      \ OR id.resp_h in public_facing_services\n  enrich ip with threat_intel(scanner_c2) and scanner_fingerprint(zmap|masscan\
      \ timing/packet traits)\n  alert if ti_match==true OR fingerprint_match==true\n  // fires on first-party\
      \ activity; TI/fingerprint is enrichment"
- question: Are source IPs from rare or newly observed ASNs generating DNS query or connection volumes
    that exceed the 95th percentile of a 30-day per-ASN baseline against our domains and services?
  context: This statistical detection profiles per-ASN behavior to catch reconnaissance from infrastructure
    your environment rarely sees. For each ASN it tracks Volume (queries+bytes/hour), Frequency (queries/min),
    and State (success vs NXDOMAIN/failed-connection ratio), and flags hourly counts above the 95th percentile
    of a trailing 30-day baseline derived per environment from historical Zeek volume. Rare or newly seen
    ASNs that suddenly spike are a hallmark of cloud-hosted scanners and recon infrastructure used during
    the Reconnaissance phase. A positive result is an unfamiliar ASN driving anomalous volume/frequency
    with poor success state; a negative result indicates traffic consistent with established baselines.
    Because thresholds are learned per environment, the method adapts to your normal traffic mix. The
    Volume/Frequency/State profiling and percentile approach follow [Fast Portscan Detection Using Sequential
    Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf) and the empirical scan distributions
    in [An Internet-Wide View of Internet-Wide Scanning](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf).
  answer_sources: *id001
  range: Last 90 days (compute baselines over a trailing 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  baseline = per_ASN percentile(hourly_count, 95, window=30d)\n  profile per ASN: volume=queries+bytes/hr,\
      \ freq=queries/min, state=success vs nxdomain/failed ratio\n  for asn in current_hour:\n    if rare_or_new(asn)\
      \ and hourly_count(asn) > baseline[asn]:\n      alert(asn, volume, freq, state)"
- question: Which source IPs does a trained Random Forest classifier score as high-suspicion reconnaissance
    based on ASN reputation, geolocation, host/port fan-out, query bursts, byte volume, and failed/NXDOMAIN
    ratio?
  context: This machine-learning detection trains a Random Forest on per-IP features (ASN reputation,
    geolocation, distinct-host/port fan-out, query bursts, byte volume, failed/NXDOMAIN ratio) to score
    how likely an IP is conducting reconnaissance, and surfaces the top-3 contributing features in the
    alert text using feature-importance output so analysts can validate the verdict. It runs in parallel
    with the deterministic threat-intel and percentile rules so coverage degrades gracefully. In the Reconnaissance
    tactic, ML catches blended or low-and-slow recon that evades single-signal thresholds. A positive
    result is a high model score with interpretable drivers (e.g., high fan-out + high NXDOMAIN ratio
    + rare ASN); a negative result is a low score, though analysts should still consult the parallel deterministic
    rules. The feature-importance method used to surface the top-3 contributing features follows [Anomaly-based
    Intrusion Detection in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374).
  answer_sources: *id001
  range: Last 90 days (train on a 30-90 day labeled/representative window)
  queries:
  - technology: SIEM/ML pseudocode
    query: "  features = [asn_reputation, geo, distinct_hosts, distinct_ports, query_burst_rate, bytes,\
      \ failed_nxdomain_ratio]\n  model = RandomForest.train(historical_labeled_ips)\n  score = model.predict_proba(features(ip))\n\
      \  if score > threshold:\n    alert(ip, score, top3_features=model.feature_importance(ip))\n  //\
      \ keep TI + percentile rules running in parallel"
- question: Do any HTTP/S requests to our public-facing web servers or cloud API endpoints (e.g., autodiscover,
    GetUserRealm) carry User-Agent strings or URI parameters matching known domain-reconnaissance or scanner
    tool signatures?
  context: This symbolic-logic detection matches Zeek http.log User-Agent and URI fields against reconnaissance/scanner
    tool regexes plus documented ZMap/Masscan/scanner fingerprints, and alerts on matches against public-facing
    web servers and cloud API endpoints. Office 365-style endpoints such as autodiscover and GetUserRealm
    are commonly probed to enumerate domains and validate tenants during Reconnaissance, so explicit coverage
    of these paths is important. A positive result is a recognizable scanner signature hitting an exposed
    endpoint, indicating active probing of domain properties; a negative result means no signature hit,
    leaving the entropy/error-rate and CNN detections to catch obfuscated tools. Keep regexes updated
    as tool fingerprints evolve. The ZMap/Masscan/scanner fingerprints matched here are documented in
    [An Internet-Wide View of Internet-Wide Scanning](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf).
  answer_sources: &id002
  - Zeek http.log
  - 'NAI: Public-facing Web Servers, Cloud API Gateways, Reverse Proxies'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "  for req in http.log where host in public_web_servers OR uri matches (autodiscover|GetUserRealm|cloud_api):\n\
      \    if regex_match(user_agent, scanner_signatures) OR regex_match(uri, recon_tool_signatures)\n\
      \       OR fingerprint_match(zmap|masscan|scanner):\n      alert(req.id.orig_h, host, uri, user_agent)"
- question: Is any source IP exhibiting abnormally high mean URI Shannon entropy or an elevated HTTP 4xx/404
    error ratio against our web and API endpoints, indicating automated path/endpoint enumeration?
  context: 'This statistical detection alerts when a source IP''s 5-minute mean URI Shannon entropy exceeds
    the 99th percentile of baseline, and/or when its HTTP 4xx (especially 404) error ratio exceeds the
    95th percentile, both signaling automated path/endpoint enumeration. The 404/error rate is profiled
    as a distinct failure-mode signal because scanners blindly request many non-existent paths. During
    Reconnaissance, attackers fuzz directories and API routes to discover domain assets and exposed services.
    A positive result is a single IP generating high-entropy URIs and a burst of 404s in a short window;
    a negative result is browsing that resembles legitimate user patterns. Entropy and n-gram thresholds
    follow the DGA-style statistics in [NIOM-DGA: Nature-Inspired Feature Selection for DGA Detection](https://www.sciencedirect.com/science/article/pii/S0167404825002500)
    adapted to URIs.'
  answer_sources: *id002
  range: Last 90 days (compute baselines over a trailing 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  window = 5m per src_ip\n  uri_entropy = mean(shannon_entropy(uri))\n  err_ratio = count(status\
      \ in 4xx, esp 404)/count(all)\n  if uri_entropy > p99(baseline_entropy) OR err_ratio > p95(baseline_err):\n\
      \    alert(src_ip, uri_entropy, err_ratio)"
- question: Which HTTP requests does a character/word-level CNN (URLNet-style) classify as malicious or
    randomized URI/User-Agent strings that bypass simple signature matching?
  context: 'This machine-learning detection uses a character- and word-level convolutional neural network
    (URLNet-style) trained on URI and User-Agent strings to flag malicious or randomized requests that
    evade simple regex signatures, and includes the top contributing n-gram/token features in the alert
    for analyst validation. In the Reconnaissance tactic, sophisticated actors randomize or obfuscate
    tooling to avoid signature detection while probing domain assets and cloud endpoints. A positive result
    is a high CNN malicious-probability with interpretable token drivers; a negative result is a benign-looking
    request, with deterministic signature and entropy rules running in parallel for resilience. The model
    should be periodically retrained on representative traffic. The character/word-level CNN approach
    follows [URLNet: Learning a URL Representation with Deep Learning for Malicious URL Detection](https://arxiv.org/abs/1802.03162).'
  answer_sources: *id002
  range: Last 90 days (train on a 30-90 day labeled/representative window)
  queries:
  - technology: SIEM/ML pseudocode
    query: "  model = URLNet_CNN.train(uri_and_user_agent_corpus)\n  p = model.predict([uri, user_agent])\n\
      \  if p > threshold:\n    alert(request, p, top_ngrams=model.explain(uri,user_agent))\n  // complements\
      \ regex + entropy rules"
- question: Are nslookup.exe, whois.exe, or Resolve-DnsName executing from anomalous parent processes
    (e.g., Office apps, scripts) or under service/unusual accounts with external-domain arguments?
  context: 'This symbolic-logic detection alerts when DNS/WHOIS utilities (nslookup.exe, whois.exe, Resolve-DnsName)
    launch from anomalous parent processes such as Office applications or script interpreters, or run
    under service or otherwise unusual accounts, with command-line arguments targeting external domains.
    A baseline of normal process-launch sequences (log-sequence modeling) helps distinguish legitimate
    admin use from suspicious context. While this technique is reconnaissance-focused, on-host execution
    of recon utilities in an unusual context can indicate insider-led domain enumeration or post-compromise
    recon supporting targeting. A positive result is, e.g., winword.exe spawning nslookup.exe querying
    an external domain; a negative result is expected admin usage from a console under an admin account.
    Use Windows Event ID 4688 with command-line auditing enabled. The baseline of normal process-launch
    sequences follows the log-sequence modeling of [DeepLog: Anomaly Detection and Diagnosis from System
    Logs through Deep Learning](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources: &id003
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Endpoint Workstations, Member Servers, Privileged Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  from EventID 4688\n  where NewProcessName in (nslookup.exe, whois.exe, powershell:Resolve-DnsName)\n\
      \    and (ParentProcessName in (winword.exe, excel.exe, outlook.exe, wscript.exe, cmd.exe via macro)\n\
      \         OR Account in (service_accounts, unusual_users))\n    and CommandLine contains external_domain\n\
      \  alert(host, user, parent, CommandLine)"
- question: Which hosts or users show network-utility execution counts exceeding 3-sigma over a 30-day
    baseline, or an anomalously high count of distinct external-domain arguments per hour?
  context: This statistical detection flags hosts or users whose daily network-utility executions exceed
    3 standard deviations over a 30-day baseline (Volume), or whose count of distinct external-domain
    arguments per hour is anomalously high (Frequency/diversity). A near-parameter-free Matrix-Profile
    discord detector over each host's time series surfaces unlabeled spikes without manual thresholds.
    In support of Reconnaissance, a sudden burst of DNS/WHOIS lookups against many distinct external domains
    suggests scripted enumeration of domain properties. A positive result is a host far outside its historical
    usage or resolving an unusual breadth of external domains; a negative result is activity within normal
    variance. This complements the symbolic context rule by catching high-volume but contextually-normal
    abuse. The near-parameter-free Matrix-Profile discord detection follows [Anomaly-based Intrusion Detection
    in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374).
  answer_sources: *id003
  range: Last 90 days (compute baselines over a trailing 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  baseline = per_host mean,std(daily_netutil_exec, window=30d)\n  if daily_exec(host) > mean\
      \ + 3*std: alert(host, volume)\n  if distinct_external_domains_per_hour(host) anomalous(matrix_profile_discord):\
      \ alert(host, diversity)"
- question: Which recon-utility executions fall into outlier clusters or out-of-sequence launches when
    clustering process features and scoring launch sequences?
  context: 'This machine-learning detection applies DBSCAN/clustering on process features (image name,
    command-line entropy, parent process, session type, external-domain-argument count) to isolate outlier
    clusters of reconnaissance-utility usage, and uses sequence anomaly scoring to flag out-of-sequence
    launches; the cluster-defining features are reported in the alert. For Reconnaissance, this isolates
    abnormal execution patterns of nslookup/whois/Resolve-DnsName that simple rules miss, such as unusual
    parent/session combinations or atypical launch order. A positive result is a small outlier cluster
    or a low-probability launch sequence; a negative result is membership in dense, normal clusters. Running
    alongside the symbolic and statistical detections provides defense-in-depth on the endpoint. The sequence
    anomaly scoring for out-of-sequence launches follows [DeepLog: Anomaly Detection and Diagnosis from
    System Logs through Deep Learning](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf) (reference
    implementation: https://github.com/wuyifan18/DeepLog).'
  answer_sources: *id003
  range: Last 90 days (train on a 30-90 day labeled/representative window)
  queries:
  - technology: SIEM/ML pseudocode
    query: "  features = [image_name, cmdline_entropy, parent, session_type, domain_arg_count]\n  clusters\
      \ = DBSCAN(features over EventID 4688 recon utils)\n  seq_score = DeepLog.score(process_launch_sequence(host))\n\
      \  if cluster==outlier OR seq_score < threshold:\n    alert(host, defining_features, seq_score)"
- question: Is any external IP causing more than 50 NXDOMAIN responses for our domain(s) within one minute,
    or querying NULL/TXT records with high-entropy labels?
  context: 'This symbolic-logic detection alerts when an external IP causes more than 50 NXDOMAIN responses
    for the organization''s domain(s) within one minute, or queries NULL/TXT record types with high-entropy
    labels; RR-type and label-structure filters identify scanning and tunnel-style probing. The count
    is tuned per resolver volume, and NXDOMAIN is treated as the explicit failure-mode signal. During
    Reconnaissance, high NXDOMAIN bursts indicate brute-force subdomain enumeration to map an organization''s
    domain assets and name servers. A positive result is a single external IP rapidly producing failed
    lookups or odd RR types with random labels; a negative result is normal resolution traffic. Requires
    DNS query logging on external-facing or recursive resolvers. The RR-type and label-structure filters
    follow [Below the Radar: Spotting DNS Tunnels in Newly Observed Hostnames in the Wild](https://docs.apwg.org/ecrimeresearch/2019/Nov13_DennisTatang.pdf).'
  answer_sources: &id004
  - Zeek dns.log
  - 'NAI: External-facing DNS Resolvers, Internal Recursive DNS Servers that log queries'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "  window = 60s per src_ip on org_domains\n  nx = count(dns.log where rcode==NXDOMAIN)\n  if\
      \ nx > 50: alert(src_ip, nx)\n  if qtype in (NULL,TXT) and shannon_entropy(query_label) high: alert(src_ip,\
      \ qtype)"
- question: Which IPs show a 5-minute NXDOMAIN-to-total ratio above the 98th percentile combined with
    anomalously high queried-subdomain entropy or subdomain diversity?
  context: 'This statistical detection flags IPs whose 5-minute NXDOMAIN-to-total ratio exceeds the 98th
    percentile and whose queried-subdomain Shannon entropy or per-domain subdomain-diversity count is
    anomalously high, combining DGA-style entropy/n-gram statistics with subdomain-diversity and query-frequency
    statistics. In the Reconnaissance phase, automated subdomain brute-forcing produces both a high failure
    ratio and many random, diverse subdomain labels. A positive result is an IP with a high failed-lookup
    ratio plus high-entropy, high-diversity subdomain queries; a negative result is normal resolution
    with low NXDOMAIN ratio. Combining ratio and entropy reduces false positives from benign misconfigurations
    that produce NXDOMAIN without random labels. This combines the entropy/n-gram statistics of [NIOM-DGA:
    Nature-Inspired Feature Selection for DGA Detection](https://www.sciencedirect.com/science/article/pii/S0167404825002500)
    with the subdomain-diversity and query-frequency statistics of [Below the Radar: Spotting DNS Tunnels
    in Newly Observed Hostnames in the Wild](https://docs.apwg.org/ecrimeresearch/2019/Nov13_DennisTatang.pdf).'
  answer_sources: *id004
  range: Last 90 days (compute baselines over a trailing 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  window=5m per src_ip\n  nx_ratio = count(NXDOMAIN)/count(all)\n  ent = mean(shannon_entropy(subdomain_label))\n\
      \  diversity = distinct_subdomains_per_domain\n  if nx_ratio > p98(baseline) and (ent anomalous\
      \ OR diversity anomalous):\n    alert(src_ip, nx_ratio, ent, diversity)"
- question: Do per-resolver NXDOMAIN and query volumes show sustained residual spikes against a Seasonal-ARIMA
    or LSTM/transformer forecast of expected traffic?
  context: This machine-learning detection models expected per-resolver NXDOMAIN and query volume using
    Seasonal-ARIMA or an LSTM/transformer forecaster and alerts on sustained residual spikes, including
    the magnitude and duration of the residual in the alert. By learning each resolver's daily/weekly
    seasonality, it distinguishes genuine recon bursts from normal periodic variation. During Reconnaissance,
    sustained elevated NXDOMAIN beyond forecast indicates ongoing subdomain enumeration rather than a
    transient blip. A positive result is a large, persistent residual above the prediction interval; a
    negative result is volume tracking the forecast. This complements the threshold and ratio detections
    by adapting to time-of-day and seasonal patterns instead of fixed cutoffs. The time-series forecasting
    approach follows [C2 Beaconing Detection via AI-Based Time-Series Analysis](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20).
  answer_sources: *id004
  range: Last 90 days (train on a 30-90 day labeled/representative window)
  queries:
  - technology: SIEM/ML pseudocode
    query: "  model = SARIMA_or_LSTM.fit(per_resolver nxdomain_and_query_volume, seasonality=daily/weekly)\n\
      \  forecast, interval = model.predict(now)\n  residual = actual - forecast\n  if residual sustained_above\
      \ interval:\n    alert(resolver, residual_magnitude, duration)"
- question: Is Zeek raising scan/portscan notices (Threshold Random Walk) tied to external IPs sweeping
    our hosts or services?
  context: This symbolic-logic detection raises alerts for Zeek scan notices (Threshold Random Walk) tied
    to external IPs as an immediate signal of host/service sweeps. TRW declares a source a scanner once
    its per-source success/failure connection-likelihood walk crosses a threshold, providing fast, well-grounded
    detection. In the Reconnaissance tactic, an external IP sweeping the perimeter or DMZ is enumerating
    live hosts and exposed services as a precursor to targeting. A positive result is a Zeek scan/portscan
    notice attributed to an external source; a negative result is the absence of such notices, with the
    statistical and clustering detections still covering slower or distributed scans. Ensure Zeek's scan-detection
    scripts are enabled and tuned for perimeter sensors. The Threshold Random Walk approach follows [Fast
    Portscan Detection Using Sequential Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf).
  answer_sources: &id005
  - Zeek conn.log
  - 'NAI: Network Perimeter Firewalls, Demilitarized Zone (DMZ) segments, Public-facing Application Servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "  subscribe notice.log where note in (Scan::Address_Scan, Scan::Port_Scan)\n  where src in\
      \ external_ips\n  alert(src, note, target_hosts, target_ports)  // TRW success/failure likelihood\
      \ walk"
- question: Which external IPs exceed the 99.5th percentile in distinct destination hosts or ports per
    5 minutes, or cross the sequential-hypothesis failed-connection threshold?
  context: This statistical detection flags external IPs exceeding the 99.5th percentile in distinct destination
    hosts or distinct ports per 5 minutes (Volume/Frequency), or whose failed/rejected connection ratio
    crosses a sequential-hypothesis-testing threshold (State/failure-mode); percentiles are derived from
    empirical scan-rate distributions. High fan-out across hosts/ports combined with many rejected connections
    is the classic signature of network sweeps and service scans in the Reconnaissance phase. A positive
    result is an IP touching an unusually large number of distinct hosts/ports with a high failed-connection
    ratio; a negative result is normal client behavior contacting few endpoints with successful connections.
    Tuning percentiles to your environment limits false positives from busy legitimate sources like proxies.
    The failed-connection ratio uses the sequential-hypothesis threshold of [Fast Portscan Detection Using
    Sequential Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf) and the percentiles
    derive from the empirical scan-rate distributions in [An Internet-Wide View of Internet-Wide Scanning](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf).
  answer_sources: *id005
  range: Last 90 days (compute baselines over a trailing 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  window=5m per src_ip\n  d_hosts=distinct(id.resp_h); d_ports=distinct(id.resp_p)\n  failed_ratio\
      \ = count(conn_state in S0,REJ,RSTO)/count(all)\n  if d_hosts>p99.5(baseline) OR d_ports>p99.5(baseline)\
      \ OR failed_ratio>SHT_threshold:\n    alert(src_ip, d_hosts, d_ports, failed_ratio)"
- question: Which external IPs fall into scanning clusters when clustering connection features such as
    distinct hosts/ports, SYN-without-ACK ratio, bytes, and duration?
  context: This machine-learning detection uses K-Means/GMM/DBSCAN on per-IP connection features (distinct
    hosts, distinct ports, SYN-without-ACK ratio, bytes, duration) to isolate scanning clusters, supplemented
    by unsupervised Matrix-Profile discords; the cluster-defining features are surfaced in the alert.
    Unsupervised clustering catches distributed or low-rate scans that fixed thresholds miss by grouping
    IPs with scan-like behavioral profiles. In the Reconnaissance tactic, this reveals coordinated or
    stealthy sweeps mapping internal hosts and services. A positive result is membership in a tight scanning
    cluster or a strong Matrix-Profile discord with high fan-out and SYN-without-ACK behavior; a negative
    result is membership in normal traffic clusters. It runs alongside the Zeek notice and percentile
    detections for layered coverage. The unsupervised Matrix-Profile discord method follows [Anomaly-based
    Intrusion Detection in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374).
  answer_sources: *id005
  range: Last 90 days (train on a 30-90 day labeled/representative window)
  queries:
  - technology: SIEM/ML pseudocode
    query: "  features = [distinct_hosts, distinct_ports, syn_no_ack_ratio, bytes, duration]\n  clusters\
      \ = DBSCAN_or_KMeans_GMM(features per src_ip)\n  discord = matrix_profile(per_ip_conn_series)\n\
      \  if cluster in scanning_clusters OR discord_high:\n    alert(src_ip, cluster_defining_features)"
