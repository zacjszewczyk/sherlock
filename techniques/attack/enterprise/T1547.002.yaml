questions:
- question: >-
    [Persistence] Authentication package registry diff + IOC match (Symbolic Logic): Can you determine
    whether a new DLL name is appended to the multi-string value at HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Authentication
    Packages, and this new DLL name or its on-disk file hash matches a known malicious indicator. -- specifically
    using the 'Authentication package registry diff + IOC match' (Symbolic Logic) approach?
  context: >-
    Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Windows LSA authentication
    packages so that lsass.exe loads an attacker-controlled DLL at boot, yielding durable, SYSTEM-level
    code execution. This evidence focuses on the condition that a new DLL name is appended to the multi-string
    value at HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Authentication Packages, and this new DLL name
    or its on-disk file hash matches a known malicious indicator. This Symbolic Logic approach works as
    follows: On every Sysmon Event ID 13 / Windows Event ID 4657 write to HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Authentication
    Packages (and Security Packages), diff the new REG_MULTI_SZ against the curated baseline (msv1_0,
    kerberos, schannel, wdigest, tspkg, pku2u, cloudAP, negoexts); alert on ANY added entry, attribute
    the writing process (Sysmon 1), exclude only signed installers (e.g., msiexec.exe/TrustedInstaller),
    and cross-reference the new DLL path/hash against TI feeds for confirmation but not as a gate (Atomic
    Red Team T1547.002 (https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1547.002/T1547.002.md);
    Elastic SSP rule (https://github.com/elastic/detection-rules)). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates the LSA Authentication Packages configuration or
    lsass.exe runtime behavior is deviating from the known-good baseline of signed System32 packages and
    normal boot activity; pivot to the writing process and its lineage, the new DLL's path/hash/signature,
    the affected host's role, and any subsequent lateral movement or egress. A negative result helps rule
    out this authentication-package vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, signed, or living-off-the-land abuse.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      # Authentication package registry diff + IOC match
      source IN [Windows Event ID 4657, Sysmon Event ID 13, Sysmon Event ID 1, Sysmon Event ID 11]
      | WHERE matches_action_criteria("Authentication package registry diff + IOC match")
      // On every Sysmon Event ID 13 / Windows Event ID 4657 write to HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Authentication Packages (and Security
      | ALERT enrich(host, user, process, parent_process, registry_value, dll_path, dll_signer, dest)
