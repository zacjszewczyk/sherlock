name: 'T1547.002: Authentication Package'
id: 2d6da98a-0532-46ef-92b3-ca99a57c904f
description: >-
  This playbook helps an analyst investigate whether an adversary is abusing Windows LSA authentication
  packages (T1547.002) to autostart malicious DLLs at boot for persistence (TA0003) and/or privilege escalation
  (TA0004). Authentication package DLLs referenced under HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Authentication
  Packages (and Security Packages) are loaded by the Local Security Authority (lsass.exe) at system start,
  giving an attacker code execution in a SYSTEM, high-integrity context that survives reboots. The playbook
  guides the hunt across several behavioral angles: registry writes that append a new DLL to the multi-string
  Authentication Packages value (diffed against a curated baseline of legitimate packages and cross-referenced
  to threat intelligence); the identity and lineage of the writing process (non-SYSTEM/non-TrustedInstaller
  writers, known offensive tooling such as reg.exe, Mimikatz, or Empire, and rare parent-child chains);
  DLL paths that point outside System32 into user-writable or temporary directories; lsass.exe loading
  modules that are unsigned, off-allowlist, or outside System32; and highly anomalous lsass.exe behavior
  such as spawning child processes or initiating outbound network connections, along with post-modification
  lateral movement (mass SMB/RPC) or C2 beaconing. Detection methods combine symbolic-logic rules, statistical
  baselining/prevalence/entropy scoring, and machine-learning models (process-context classifiers, sequence/provenance
  anomaly detection) applied to Windows Security events (4657, 4688, 4697, 6005), Sysmon (1, 3, 7, 11,
  13), and Zeek conn.log/dce_rpc.log, so the analyst can corroborate suspected authentication-package
  abuse against registry change, process provenance, DLL signature/path, and network context.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
