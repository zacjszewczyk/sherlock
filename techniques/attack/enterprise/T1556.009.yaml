- question: For any user, do two successful logins from geographically distant locations occur within
    a time frame requiring an impossible travel speed (e.g., > 1000 km/h)?
  context: For each successful login, cache user, timestamp, and geolocated source IP; on the next login
    for the same user compute distance/time to derive required travel speed and flag 'impossible travel'
    when it exceeds a physically impossible threshold (e.g., 1000 km/h) using deterministic required-velocity
    logic. Impossible travel betrays bypassed or absent location-based CA controls (TA0112/TA0006).
  answer_sources:
