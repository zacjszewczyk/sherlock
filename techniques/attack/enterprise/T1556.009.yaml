name: 'T1556.009: Modify Authentication Process: Conditional Access Policies'
id: fa11978b-6490-4e4e-beaf-ffc324b91646
description: 'This playbook helps an analyst determine whether an adversary is weakening or bypassing
  conditional access (CA) and IAM authentication controls to maintain persistent, unauthorized access
  (MITRE ATT&CK T1556.009). It addresses three tactics simultaneously - Defense Impairment (TA0112), Persistence
  (TA0003), and Credential Access (TA0006) - because the same control-plane edits and login anomalies
  serve all three goals. It covers two complementary evidence classes: (1) direct policy-modification
  evidence in identity providers (Entra ID, Okta, JumpCloud) and cloud IAM (AWS CloudTrail, GCP Cloud
  Audit Logs) - MFA grant controls removed, trusted/named locations or IP/CIDR ranges added, exclusion
  groups added, region restrictions dropped, aws:SourceIp widened, aws:MultiFactorAuthPresent removed,
  or policies flipped to disabled/report-only; and (2) downstream login evidence that betrays a weakened
  policy - successful logins from high-risk/Tor/anon-proxy/known-C2 IPs, unapproved or rare ASNs, deny-listed
  countries, unsanctioned cloud IP ranges, non-compliant device fingerprints (JA3/User-Agent), impossible
  travel, legacy authentication protocols, drops in MFA enforcement ratios, successful password-spray/credential-stuffing
  across many accounts, and failure-to-success bursts. Each question pairs a symbolic-logic, statistical,
  or machine-learning method with concrete pseudocode so a SOC analyst can confirm or refute conditional-access
  tampering and persistent access.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has any identity-provider audit event modified or relaxed a conditional access / MFA-enforcement
    policy - for example removing an MFA or strong-auth grant control, adding a new trusted/named location
    or IP/CIDR, adding a user/group exclusion, or flipping a policy to disabled or report-only?
  context: This is the core action of T1556.009. Capture every CA/MFA policy write (Entra 'Update conditionalAccessPolicy',
    Okta policy/rule modified or MFA requirement disabled, JumpCloud equivalents) and diff the prior vs.
    new policy state. A relaxation - MFA/strong-auth grant control removed, a new trusted/named location
    or IP/CIDR added, a new exclusion added, or state set to disabled/report-only - directly impairs defenses
    (TA0112), establishes persistence (TA0003), and enables credential abuse (TA0006). A positive result
    is a relaxing diff; a benign tightening diff is a negative. Correlate the editing principal, source
    IP/ASN, and time with later logins.
  answer_sources:
  - Azure Activity (Update conditionalAccessPolicy)
  - Okta System Log
  - Windows Event ID 4624
  - 'NAI: Cloud Identity Provider Portals (e.g., Entra ID, Okta, JumpCloud), Cloud IAM configuration portals'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=identity (operationName="Update conditionalAccessPolicy" OR eventType IN ("policy.rule.update","policy.lifecycle.deactivate","system.mfa.factor.deactivate"))

      | diff old_policy new_policy

      | where removed_grant="mfa" OR added_named_location=true OR added_exclusion=true OR new_state IN
      ("disabled","reportOnly") OR added_trusted_ip=true

      | eval severity="high"

      | table _time, actor, src_ip, policy_id, change_summary'
- question: Is any administrator editing conditional access policies far more often than their 90-day
    baseline, editing CA policy for the first time ever, or is the org-wide CA-edit rate showing an abrupt
    change-point?
  context: Most admins touch CA policy rarely, so volume and novelty are strong signals. Baseline CA policy-modification
    events per administrator over 90 days and alert when a principal's 24h edit count exceeds mean+3-sigma,
    on the first-ever CA edit by an account, or when the org-wide CA-edit rate shows a CUSUM/Bayesian
    change-point - reporting the change time as the top factor. A spike or first-time edit by a normally-passive
    account supports defense-impairment/persistence; steady expected admin activity is benign.
  answer_sources:
  - Azure Activity (Update conditionalAccessPolicy)
  - Okta System Log
  - Windows Event ID 4624
  - 'NAI: Cloud Identity Provider Portals (e.g., Entra ID, Okta, JumpCloud), Cloud IAM configuration portals'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=identity operationName="Update conditionalAccessPolicy"

      | bin _time span=24h | stats count as edits by actor, _time

      | eventstats avg(edits) as mu, stdev(edits) as sd by actor

      | where edits > mu+3*sd OR actor_first_ever_edit=true

      | append [ search org_ca_edit_rate | cusum threshold=5 ]

      | table _time, actor, edits, change_point_time'
- question: Does an unsupervised/UEBA model flag a CA policy-change event as anomalous based on admin
    rarity, source IP/ASN novelty, time-of-day, operation type, target-policy criticality, and whether
    the edit removed MFA?
  context: A UEBA/anomaly model learns normal admin policy-change behavior and surfaces outliers that
    simple thresholds miss. Train on policy-change events with features for admin-account rarity, source
    IP/ASN novelty, time-of-day, operation type, target-policy criticality, and an 'MFA grant removed'
    flag, then surface the top-3 contributing features (e.g., 'MFA grant removed', 'first edit by this
    admin', 'new source ASN') in the alert. High anomaly scores on critical policies indicate likely tampering
    (TA0112/TA0003); routine edits score low.
  answer_sources:
  - Azure Activity (Update conditionalAccessPolicy)
  - Okta System Log
  - Windows Event ID 4624
  - 'NAI: Cloud Identity Provider Portals (e.g., Entra ID, Okta, JumpCloud), Cloud IAM configuration portals'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=ueba_policy_change

      features=[admin_rarity, src_asn_novelty, hour_of_day, op_type, policy_criticality, mfa_grant_removed]

      score = model.anomaly_score(event)

      if score > threshold: alert(top3=model.explain(event))'
- question: Has an AWS or GCP IAM policy condition been removed or broadened - aws:SourceIp widened toward
    0.0.0.0/0, a region restriction dropped, or aws:MultiFactorAuthPresent removed from a privileged policy
    - via CloudTrail PutUserPolicy/PutRolePolicy/CreatePolicyVersion or GCP SetIamPolicy?
  context: Cloud IAM condition attributes are the cloud equivalent of conditional access. Parse the policyDocument
    in CloudTrail PutUserPolicy/PutRolePolicy/CreatePolicyVersion (and GCP SetIamPolicy) and alert when
    a condition block is removed, aws:SourceIp is broadened to public/0.0.0.0/0, a region restriction
    is dropped, or aws:MultiFactorAuthPresent is removed from a privileged policy. Such relaxations impair
    defenses and enable persistent credential reuse. A removed/widened condition is positive; a tightening
    edit is negative.
  answer_sources:
  - AWS CloudTrail
  - GCP Cloud Audit Logs
  - 'NAI: Cloud IAM configuration portals, Public Cloud Tenant (AWS, Azure, GCP)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=cloudtrail eventName IN ("PutUserPolicy","PutRolePolicy","CreatePolicyVersion","SetIamPolicy")

      | spath policyDocument

      | diff old_doc new_doc

      | where condition_removed=true OR sourceip_widened_to_public=true OR region_restriction_dropped=true
      OR mfa_condition_removed=true

      | table _time, userIdentity, eventName, target_policy, condition_delta'
- question: Is any cloud principal writing IAM policies far above the org's daily 99th percentile, writing
    an IAM policy for the first time, or is the tenant-wide IAM-write rate showing an abrupt change-point?
  context: Baseline IAM policy-write volume per principal per day and flag principals whose write count
    exceeds the org 99th percentile, the first IAM policy write by a principal, or an abrupt change-point
    in tenant-wide IAM-write rate (CUSUM/Bayesian online CPD). Sudden write bursts or novel writers around
    the time of suspicious logins indicate control-plane tampering for persistence; steady automation
    activity is benign noise to baseline out.
  answer_sources:
  - AWS CloudTrail
  - GCP Cloud Audit Logs
  - 'NAI: Cloud IAM configuration portals, Public Cloud Tenant (AWS, Azure, GCP)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=cloudtrail eventName IN ("PutUserPolicy","PutRolePolicy","CreatePolicyVersion","SetIamPolicy")

      | bin _time span=1d | stats count as writes by userIdentity, _time

      | eventstats perc99(writes) as p99

      | where writes > p99 OR first_write_by_principal=true

      | append [ search tenant_iam_write_rate | bayes_cpd ]

      | table _time, userIdentity, writes'
- question: Does a classifier/anomaly model flag an IAM change as scope-expanding based on principal rarity,
    magnitude of permission/scope expansion, and the condition delta (keys added vs. removed)?
  context: Train a classifier/anomaly model on IAM change events with features for principal rarity, magnitude
    of permission/scope expansion, and condition-key delta (added vs. removed), and emit the top-3 drivers
    (e.g., 'SourceIp widened to /0', 'MFA condition removed', 'rare principal'). Edits that expand scope
    while removing guardrails are high-confidence T1556.009; routine least-privilege tightening scores
    low.
  answer_sources:
  - AWS CloudTrail
  - GCP Cloud Audit Logs
  - 'NAI: Cloud IAM configuration portals, Public Cloud Tenant (AWS, Azure, GCP)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=iam_change_classifier

      features=[principal_rarity, scope_expansion_magnitude, condition_keys_added, condition_keys_removed]

      if model.predict_proba(event) > 0.8: alert(top3=model.explain(event))'
- question: Was a new MFA method registered or a user added to a CA exclusion group, then followed within
    an hour by a successful login by that same user from a first-seen device or location?
  context: Adversaries enroll their own MFA factor or add the victim to an exclusion group, then log in.
    Build a stateful rule that links an MFA-method-registration or CA-exclusion-add audit event to a subsequent
    successful login (Event 4624 / Entra success) by the same user from a first-seen device or location
    within 1 hour, and raise a high-severity persistence alert. The registration-then-new-device-login
    chain is the persistence (TA0003) signature; an enrollment with no anomalous follow-on login is benign.
  answer_sources:
  - Azure Activity (Update conditionalAccessPolicy)
  - Okta System Log
  - Windows Event ID 4624
  - 'NAI: Cloud Identity Provider Portals (e.g., Entra ID, Okta), Authentication Servers (e.g., Domain
    Controllers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=identity (eventType="user.mfa.factor.activate" OR change="ca_exclusion_add")

      | join user [ search index=auth (EventCode=4624 OR signin_status=success) first_seen_device_or_location=true
      ]

      | where login_time - reg_time <= 3600

      | eval severity="high" | table _time, user, factor, src_ip, device'
- question: Did an MFA registration originate from an ASN never previously seen for that user, or did
    org-wide registration volume spike above the 95th percentile?
  context: Baseline each user's MFA-registration rate (normally near zero) and the source IP/ASN used;
    alert when registration originates from an ASN never previously seen for that user, when org-wide
    registration volume spikes above the 95th percentile, or score the first-seen registration-source
    edge with a Bayesian new-edge surprise statistic. A novel registration source is a strong sign an
    attacker, not the user, enrolled the factor.
  answer_sources:
  - Azure Activity (Update conditionalAccessPolicy)
  - Okta System Log
  - Windows Event ID 4624
  - 'NAI: Cloud Identity Provider Portals (e.g., Entra ID, Okta), Authentication Servers (e.g., Domain
    Controllers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=identity eventType="user.mfa.factor.activate"

      | iplocation src_ip | stats values(asn) as hist_asn by user

      | where NOT match(current_asn, hist_asn)

      | append [ search reg_volume | where count > perc95(count) ]

      | table _time, user, src_ip, current_asn, bayes_surprise'
- question: Does a sequence/temporal model flag a low-probability chain of per-user identity events (registration
    -> exclusion-add -> login)?
  context: Apply a sequence/temporal model over per-user identity events (registration -> exclusion-add
    -> login) and flag low-probability transitions, reporting the contributing events as the explanation.
    The model learns benign identity-event orderings; an improbable registration->exclusion->login sequence
    indicates orchestrated persistence (TA0003) rather than normal self-service.
  answer_sources:
  - Azure Activity (Update conditionalAccessPolicy)
  - Okta System Log
  - Windows Event ID 4624
  - 'NAI: Cloud Identity Provider Portals (e.g., Entra ID, Okta), Authentication Servers (e.g., Domain
    Controllers)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=identity_seq_model

      seq = order_by_time(user_identity_events)

      p = model.transition_prob(seq)

      if p < epsilon: alert(explanation=low_prob_subsequence(seq))'
- question: Did any account successfully authenticate from a source IP with a high-risk reputation (Tor
    exit node, known C2, anonymizing proxy) that a risk-based conditional access policy should have blocked?
  context: 'Join successful authentication events (Windows Event ID 4624, Entra Sign-in logs) with a threat-intelligence
    feed and alert when the source IP (id.orig_h in Zeek conn.log, IpAddress in event logs) has a high-risk
    reputation. Track success/fail explicitly: a SUCCESSFUL login from a Tor/anon-proxy/known-C2 IP that
    should have been risk-blocked is the trigger, not a blocked attempt. A success here proves the risk-based
    CA control is disabled or evaded (TA0112/TA0006).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Edge Firewalls, VPN Concentrators, Cloud Identity Provider Portals (e.g., Entra ID, Okta), Threat
    Intelligence Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=auth (EventCode=4624 OR signin_status=success)

      | lookup ti_feed ip AS src_ip OUTPUT reputation, category

      | where reputation="high" OR category IN ("tor","c2","anon_proxy")

      | table _time, user, src_ip, category, signin_status'
- question: Among successful external authentications, does any login's source-IP threat-intel risk score
    exceed the rolling 24-hour 99th percentile across the organization?
  context: Enrich source IPs of all successful external authentications with a numerical risk score and
    compute a rolling 24-hour org-wide 99th percentile; flag any login whose score exceeds this dynamic
    threshold. This catches policy bypasses for unusually risky logins without a static blocklist. A login
    above the dynamic threshold warrants investigation; scores within normal distribution are benign.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Edge Firewalls, VPN Concentrators, Cloud Identity Provider Portals (e.g., Entra ID, Okta), Threat
    Intelligence Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=auth signin_status=success external=true

      | lookup ti_feed ip AS src_ip OUTPUT risk_score

      | eventstats perc99(risk_score) as p99 by date_hour_window

      | where risk_score > p99

      | table _time, user, src_ip, risk_score, p99'
- question: Does a trained classifier (e.g., Random Forest) predict a successfully-authenticated login
    as malicious using geolocation, ASN, time of day, user history, device info, and threat-intel risk
    score?
  context: Train a classification model to predict malicious logins using source IP geolocation, ASN,
    time of day, the user's historical behavior, device information, and the threat-intel risk score;
    baseline per-user behavior with UEBA session profiling. A high-probability score for a login that
    nonetheless succeeded indicates a CA policy failure. Emit the top-3 contributing features (e.g., IP
    reputation score, new ASN, off-hours) for triage.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Edge Firewalls, VPN Concentrators, Cloud Identity Provider Portals (e.g., Entra ID, Okta), Threat
    Intelligence Platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model=login_risk_rf\nfeatures=[geo, asn, hour, user_hist_dev, ti_risk_score]\nif event.status==success\
      \ and model.predict_proba(event) > 0.8:\n    alert(top3=model.explain(event))"
- question: Did any successful external login originate from an Autonomous System (ASN) that is not on
    the approved corporate/partner/VPN allow-list, suggesting a new overly-permissive trusted location?
  context: Maintain an allow-list of approved corporate, partner, and VPN provider ASNs and correlate
    the source ASN of all successful external logins against it; alert on logins from ASNs not on the
    list. Cross-check against structurally novel user->source->destination patterns to suppress benign
    new VPN ranges. A sustained stream of successes from an unapproved ASN suggests a new 'trusted location'
    was added to a CA policy (TA0112/TA0003).
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: VPN Concentrators, Cloud Identity Provider Portals (e.g., Entra ID, Okta), Network Gateway,
    Cloud IAM configuration portals'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=auth signin_status=success external=true

      | iplocation src_ip

      | lookup approved_asns asn OUTPUT approved

      | where isnull(approved)

      | table _time, user, src_ip, asn, dest'
- question: Has any user's source-ASN distribution shown a sharp drop in Shannon entropy in a rolling
    24-hour window, coupled with a new org-wide-rare ASN - signaling consolidation onto a new permissive
    location?
  context: For each user, baseline historically-used source ASNs over 90 days and compute the Shannon
    entropy of the source-ASN distribution within a rolling 24h window; a sharp entropy decrease coupled
    with the new ASN being org-wide rare signals suspicious consolidation onto a new location. Equivalently,
    score the first-seen user->ASN edge with a Bayesian new-edge surprise statistic - a high-surprise
    edge sustained over many logins indicates a new permissive trusted location.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: VPN Concentrators, Cloud Identity Provider Portals (e.g., Entra ID, Okta), Network Gateway,
    Cloud IAM configuration portals'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=auth signin_status=success

      | bin _time span=24h | stats count by user, asn, _time

      | eval entropy=shannon(asn_dist)

      | where entropy_drop > 0.5 AND asn_org_rarity > 0.99

      | table _time, user, asn, entropy, bayes_surprise'
- question: For each source ASN, does the observed successful-login count significantly exceed a time-series
    forecast (which would be ~zero for a brand-new ASN), and does change-point detection flag its abrupt
    persistent appearance?
  context: Model the time series of successful login counts per source ASN with a forecasting model (e.g.,
    ARIMA); an observed count far above the near-zero forecast flags a potential new trusted location.
    Use change-point detection (CUSUM/Bayesian online CPD) to flag the abrupt, persistent appearance of
    a new ASN and report the change timestamp as the top contributing factor so analysts can align it
    with a CA policy edit.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: VPN Concentrators, Cloud Identity Provider Portals (e.g., Entra ID, Okta), Network Gateway,
    Cloud IAM configuration portals'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for asn in source_asns:\n  forecast = arima(history[asn]).predict(now)\n  if observed[asn]\
      \ - forecast > k*sigma: flag(asn)\n  cp = bayesian_online_cpd(series[asn])\n  if cp.detected: alert(asn,\
      \ change_time=cp.time)"
- question: Did a successful login for a user in an MFA-required group lack a corresponding MFA completion
    (mfaDetail in Entra, ADFS Event ID 1201) within a 5-minute window?
  context: Design a correlation search that triggers when a successful login (Entra Sign-in success) for
    a user in an MFA-required group lacks a matching MFA completion status (mfaDetail) or event (ADFS
    Event ID 1201) within a 5-minute window. The MFA grant control is the policy object removed by this
    technique; diff the CA policy and correlate to the drop in mfaDetail/step-up events. A success without
    an MFA completion is positive evidence the grant control was removed (TA0112/TA0006).
  answer_sources:
  - Windows Event ID 4624
  - 'NAI: Cloud Identity Provider Portals (e.g., Entra ID, Okta), Active Directory Federation Services
    (ADFS) Servers, RADIUS Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=auth signin_status=success user_in_mfa_group=true

      | join type=left user,_time [ search mfa_completion (mfaDetail=* OR EventCode=1201) ]

      | where isnull(mfaDetail) AND isnull(adfs_mfa_event)

      | table _time, user, app, src_ip'
- question: Has a critical user group's daily MFA success ratio (MFA-enforced logins / total successful
    logins) dropped more than 3 standard deviations below its rolling 7-day baseline, with both enforcement
    and step-up failure rates collapsing together?
  context: 'For each critical user group compute a rolling 7-day mean and standard deviation of the MFA
    success ratio and alert if the current day''s ratio drops more than 3 sigma below it. Also profile
    the MFA step-up FAILURE rate as a distinct signal: a simultaneous collapse of both enforcement and
    failure rates indicates the challenge is no longer being issued (not merely passed), which is the
    policy-removal fingerprint rather than benign behavior.'
  answer_sources:
  - Windows Event ID 4624
  - 'NAI: Cloud Identity Provider Portals (e.g., Entra ID, Okta), Active Directory Federation Services
    (ADFS) Servers, RADIUS Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=auth signin_status=success

      | bin _time span=1d | stats count(eval(mfa_enforced)) as enf, count as total, count(eval(mfa_failed))
      as fail by group,_time

      | eval ratio=enf/total

      | eventstats avg(ratio) as mu, stdev(ratio) as sd by group

      | where ratio < mu-3*sd AND fail_rate_drop=true

      | table _time, group, ratio, mu'
- question: Does a time-series anomaly/change-point model flag a sudden shift in a critical group's MFA
    enforcement ratio, pinpointing the exact change time as the likely policy-edit moment?
  context: Train a time-series anomaly model (e.g., Isolation Forest) on the MFA enforcement ratio for
    critical user groups so it learns normal fluctuation; an anomalous point signals a sudden unexpected
    change consistent with policy modification. Prefer change-point detection on the enforcement ratio
    so the alert pinpoints the exact shift time (the likely policy-edit moment) and reports it as the
    top feature for correlation with CA audit logs.
  answer_sources:
  - Windows Event ID 4624
  - 'NAI: Cloud Identity Provider Portals (e.g., Entra ID, Okta), Active Directory Federation Services
    (ADFS) Servers, RADIUS Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = mfa_enforcement_ratio[group]

      cp = change_point_detect(series)  # CUSUM/Bayesian

      if cp.detected: alert(group, change_time=cp.time, pre=cp.pre_mean, post=cp.post_mean)'
- question: Did any successful login correlate with network traffic from a client whose JA3 hash or User-Agent
    is not on the corporate-managed allow-list, where policy should block unmanaged devices?
  context: Maintain an allow-list of known-good JA3 hashes and User-Agent strings from corporate-managed
    devices and alert on any successful login correlated with client traffic whose fingerprint is not
    on the list (Zeek http.log/ssl.log joined to auth). If CA policy is meant to block unmanaged devices,
    a success from an unknown fingerprint indicates the device-compliance control was weakened (TA0112/TA0006).
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 4624
  - 'NAI: Cloud Application Frontends, VPN Portals, Endpoint Devices, Web Proxies'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'ssl.log/http.log: extract ja3, user_agent, id.orig_h

      | join auth (signin_status=success) on src_ip,time_window

      | lookup managed_fingerprints ja3 user_agent

      | where isnull(match)

      | table ts, user, src_ip, ja3, user_agent'
- question: Did any successful login use a User-Agent or JA3 fingerprint that is rarer than a set threshold
    (e.g., seen in less than 0.1% of authentications over 30 days)?
  context: Profile the rarity of User-Agent strings and JA3 hashes across all successful logins over the
    last 30 days; a successful login using a fingerprint below the rarity threshold (e.g., <0.1% of authentications)
    is anomalous and warrants investigation. Rare fingerprints often indicate non-corporate tooling slipping
    past a weakened device-compliance condition.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 4624
  - 'NAI: Cloud Application Frontends, VPN Portals, Endpoint Devices, Web Proxies'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=auth signin_status=success

      | stats count by ja3 | eventstats sum(count) as total

      | eval freq=count/total | where freq < 0.001

      | join ja3 [ search index=auth signin_status=success ]

      | table _time, user, src_ip, ja3, freq'
- question: Does clustering (e.g., DBSCAN) on login features (User-Agent, JA3, IP geolocation, time of
    day) reveal a small dense cluster of successful logins with unusual attributes suggesting newly-permitted
    non-compliant devices?
  context: Use clustering (e.g., DBSCAN) on login features including User-Agent, JA3, IP geolocation,
    and time of day; a small dense cluster of successful logins with unusual features may represent non-compliant
    devices now permitted by a policy change. Treat unmanaged-device logins as structurally anomalous
    user/source combinations and surface the deviating attributes (JA3, UA, geo) in the alert.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Windows Event ID 4624
  - 'NAI: Cloud Application Frontends, VPN Portals, Endpoint Devices, Web Proxies'
  range: Last 30 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = features(user_agent, ja3, geo, hour) over successful_logins\nlabels = DBSCAN(eps, min_samples).fit(X)\n\
      for c in small_dense_clusters(labels):\n  alert(members=c, deviating_attrs=[ja3, ua, geo])"
