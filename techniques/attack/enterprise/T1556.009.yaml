  - Zeek conn.log
  - 'NAI: Cloud Identity Provider Portals (e.g., Entra ID, Okta), VPN Concentrators, Authentication Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=auth signin_status=success

      | iplocation src_ip | sort 0 user,_time

      | streamstats current=f last(lat) as plat last(lon) as plon last(_time) as pt by user

      | eval km=haversine(plat,plon,lat,lon), hrs=(_time-pt)/3600, speed=km/hrs

      | where speed > 1000

      | table _time, user, prev_loc, cur_loc, speed'
