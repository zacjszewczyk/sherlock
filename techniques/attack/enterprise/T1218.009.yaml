name: 'T1218.009: System Binary Proxy Execution: Regsvcs/Regasm'
id: cbda2cd7-dac8-475d-94e1-afe4a940af99
description: 'This playbook helps an analyst investigate whether an adversary is abusing the trusted,
  Microsoft-signed .NET utilities Regsvcs.exe and Regasm.exe to proxy execution of arbitrary code (T1218.009)
  and thereby bypass application control while hiding within the Stealth tactic. It guides the hunt across
  several behavioral angles on Windows: execution of Regsvcs/Regasm that registers an assembly whose hash
  matches a threat-intel feed or whose image runs from a non-canonical .NET Framework path; registration
  targets that live in user-writable directories (Temp, Public, PerfLogs, Startup, $Recycle.Bin) or carry
  non-code extensions; suspicious parent-process lineage (Office apps, script interpreters, browsers,
  cmd, explorer, and the csc.exe compile-then-register chain); external network connections initiated
  shortly after a Regsvcs/Regasm execution to rare, high-entropy, or known-bad destinations; and the full
  file-drop -> register -> callback chain within a short window. Detection methods combine symbolic-logic
  rules, statistical baselining/rarity/failure scoring, and machine-learning models (PE reputation classification,
  invocation clustering, process-sequence autoencoders, time-series egress forecasting, and provenance-graph
  modeling) applied to Windows Security (EID 4688), Sysmon (EID 1/3/11), PowerShell, and Zeek conn/dns
  telemetry, so the analyst can corroborate suspected Regsvcs/Regasm proxy execution against command line,
  assembly hash/path, process lineage, COM registry writes, and exfiltration context.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
