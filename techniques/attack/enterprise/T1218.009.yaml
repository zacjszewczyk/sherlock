questions:
- question: '[Stealth] Match registered libraries to intel: For technique T1218.009 (System Binary Proxy
    Execution: Regsvcs/Regasm), can you determine whether the following condition is present -- execution
    of Regsvcs.exe or Regasm.exe where the command-line argument specifies a DLL or EXE file whose SHA256
    hash matches an entry on a threat intelligence feed of known malicious indicators. Use process creation
    telemetry for command-line, parent-process, and user context. -- using the ''Match registered libraries
    to intel'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses the trusted, Microsoft-signed
    .NET utilities Regsvcs.exe and Regasm.exe to proxy execution of arbitrary code embedded in COM registration/unregistration
    attributes ([ComRegisterFunction]/[ComUnregisterFunction]), bypassing application control while blending
    in with legitimate developer and installer activity. This evidence focuses on the condition that execution
    of Regsvcs.exe or Regasm.exe where the command-line argument specifies a DLL or EXE file whose SHA256
    hash matches an entry on a threat intelligence feed of known malicious indicators. Use process creation
    telemetry for command-line, parent-process, and user context. This Symbolic Logic approach pursues
    the following: Extract the target assembly path from Regsvcs/Regasm command lines (`regsvcs.exe {PATH}`,
    `regasm.exe [/U] {PATH}`) per [LOLBAS Regsvcs](https://lolbas-project.github.io/lolbas/Binaries/Regsvcs/)
    and [LOLBAS Regasm](https://lolbas-project.github.io/lolbas/Binaries/Regasm/), compute its SHA256,
    and alert on hits against an internal/threat-intel malicious-hash feed. Also alert when the Regsvcs.exe/Regasm.exe
    image itself runs from outside its canonical Framework paths (C:\Windows\Microsoft.NET\Framework[64]\v2.0.50727
    or v4.0.30319) or when the image SHA256 appears under a different file name, per [CAR-2013-05-009](https://car.mitre.org/analytics/CAR-2013-05-009/).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests Regsvcs/Regasm
    is being used to proxy malicious code rather than perform sanctioned .NET assembly registration; pivot
    to the invoking command line, the target assembly path and hash, the parent-process lineage, the user/host
    context, any COM registry writes (HKCR\CLSID/ProgID), and subsequent child processes or outbound connections.
    A negative result helps reduce the likelihood of this proxy-execution vector for the window examined
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-and-slow, or living-off-the-land abuse.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All managed Windows hosts (endpoints and servers); Threat Intelligence Platform (TIP) data feeds.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Regsvcs/Regasm registering a known-bad assembly or running from a non-canonical path\nsource\
      \ IN [WinEventLog:Security EID=4688, WinEventLog:Sysmon EID=1]\n| where lower(Image) endswith \"\
      \\regsvcs.exe\" OR lower(Image) endswith \"\\regasm.exe\"\n| extract target_path = regex(CommandLine,\
      \ /(?:/U\\s+)?(\"?[A-Za-z]:\\\\[^\"]+\\.(?:dll|exe))/i)\n| compute sha256(target_path) as asm_hash\n\
      | alert IF asm_hash IN threatintel_malicious_hashes\n   OR Image NOT startswith \"C:\\Windows\\\
      Microsoft.NET\\Framework\"   // canonical v2.0.50727 / v4.0.30319 only\n   OR (sha256(Image) IN\
      \ known_regsvcs_regasm_hashes AND basename(Image) NOT IN [\"regsvcs.exe\",\"regasm.exe\"])\n| output\
      \ host, user, ParentImage, Image, CommandLine, target_path, asm_hash"
