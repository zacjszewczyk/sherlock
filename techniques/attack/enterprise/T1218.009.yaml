    context, any COM registry writes (HKCR\CLSID/ProgID), and subsequent child processes or outbound connections.
    A negative result helps reduce the likelihood of this proxy-execution vector for the window examined
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-and-slow, or living-off-the-land abuse.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All managed Windows hosts (endpoints and servers); Threat Intelligence Platform (TIP) data feeds.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Rarity + signature scoring of the registered assembly

      source IN [WinEventLog:Security EID=4688, WinEventLog:Sysmon EID=1]

      | where Image matches /\\reg(svcs|asm)\.exe$/i

      | extract asm = registered_assembly_path(CommandLine) | compute asm_hash=sha256(asm), sig=signature_state(asm)

      | baseline hash_hosts = distinct_count(host) BY asm_hash OVER last 90d

      | stats volume = count(distinct asm_hash) BY host

      | score = (hash_hosts < 5) + percentile_rank(hash_hosts) < 1 + (sig IN ["unsigned","invalid"])

      | alert IF score >= 2

      | output host, user, asm, asm_hash, sig, hash_hosts, volume'
