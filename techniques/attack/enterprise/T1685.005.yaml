name: 'T1685.005: Disable or Modify Tools: Clear Windows Event Logs'
id: cdbac73f-e217-4ad5-9254-0055835c453e
description: Investigate whether an adversary is clearing or tampering with Windows Event Logs to hide
  intrusion activity (MITRE ATT&CK T1685.005). This playbook helps an analyst hunt for the execution of
  log-clearing utilities and scripts (wevtutil, PowerShell Clear-EventLog/Remove-EventLog, wmic ClearEventLog,
  logman) from unusual parents or paths; the generation of Windows Security Event ID 1102 (audit log cleared)
  and System Event ID 104; direct deletion of '.evtx' files in C:\Windows\System32\winevt\Logs\; stoppage
  of the Windows Event Log service and abrupt drops in forwarded telemetry while the host remains active
  on the network; and the temporal correlation of log clearing with privilege escalation, persistence,
  and other suspicious activity. It pairs zero-tolerance symbolic-logic rules with statistical baselining
  (rarity scoring, change-point detection, volume forecasting) and machine-learning methods (Isolation
  Forest, obfuscated-command classifiers, provenance-graph analytics) so a SOC analyst can distinguish
  deliberate defense impairment from benign administration or a host going offline.
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are log-clearing utilities or scripts (wevtutil.exe, powershell.exe, wmic.exe, logman.exe)
    executing with clearing arguments that match known tool hashes and command-line selectors?
  context: Clearing Windows Event Logs is an inherently low-base-rate administrative action, so any matching
    command line warrants scrutiny. The analyst looks across Sysmon Event ID 1 and Windows Event ID 4688
    process-creation telemetry (and PowerShell 4104 script blocks) for case-insensitive matches of wevtutil
    with cl/clear-log/set-log, PowerShell Clear-EventLog/Remove-EventLog/Limit-EventLog, wmic ClearEventLog,
    and logman stop/delete on EventLog targets, using the maintained [SigmaHQ Clear Windows Event Logs
    rules](https://github.com/SigmaHQ/sigma/tree/master/rules/windows) selectors and [MITRE CAR-2016-04-002](https://car.mitre.org/analytics/CAR-2016-04-002/).
    Where telemetry records file hashes, match known log-clearing tool hashes too. A positive result is
    a strong defense-impairment signal under TA0112 because it directly degrades the records defenders
    rely on; a negative result narrows the hunt toward API-based or file-deletion clearing that emits
    no LOLBin.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Critical Application Servers, User Workstations, Endpoints of privileged
    users'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  SELECT host, user, process, parent, command_line, hashes FROM (sysmon_event_id=1 OR\n\
      \  windows_event_id=4688 OR windows_event_id=4104)\n  WHERE lower(command_line) MATCHES 'wevtutil.*(cl|clear-log|set-log)'\n\
      \     OR lower(command_line) MATCHES '(clear-eventlog|remove-eventlog|limit-eventlog)'\n     OR\
      \ lower(command_line) MATCHES 'wmic.*cleareventlog'\n     OR lower(command_line) MATCHES 'logman.*(stop|delete).*eventlog'\n\
      \     OR hashes IN known_logclear_tool_hashes\n  -> raise alert (low base-rate event)"
- question: On a per-host basis, are log-clearing binaries being executed from low-prevalence directories
    or by atypical parent processes that deviate from this host's normal administrative activity?
  context: Even legitimate log clearing follows predictable parent-child and path patterns on a given
    host. The analyst profiles parent-child relationships and execution paths from Sysmon Event ID 1 and
    Windows Event ID 4688, then scores executions of clearing binaries from rare directories or unusual
    parents (for example Office or a browser spawning wevtutil) higher than routine admin activity, following
    [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf)-style rare-causal-path
    rarity scoring. Tracking Frequency (clear-command executions per host per day) and State (process
    success/exit) means a normally-zero count turning non-zero is itself the signal. Surfacing the top-3
    rarity contributors (parent, path, account) gives tactic-specific triage context for defense impairment.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Critical Application Servers, User Workstations, Endpoints of privileged
    users'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = profile(host, parent_process, exe_path, account) over 90d for clearing_binaries\n\
      \  for each clear_exec:\n    rarity = score_rare_path(parent_process, exe_path, account, baseline)\n\
      \    daily_count = count(clear_exec by host, day)\n  alert if rarity high OR daily_count transitions\
      \ 0 -> nonzero\n  output top-3 rarity contributors"
- question: Do process-execution features indicate an obfuscated or anomalous log-clearing command that
    an unsupervised outlier model or supervised classifier flags as suspicious?
  context: Adversaries often disguise clear commands (for example caret-spliced 'w^e^v^tutil cl' or encoded
    PowerShell) to bypass literal string rules. The analyst scores process-execution features (command-line
    length, argument entropy, special-character ratio, suspicious substrings, parent-process reputation,
    path rarity) with an [Isolation Forest](https://doi.org/10.1145/2133360.2133363) for unsupervised
    outliers and a supervised classifier where labels exist, drawing on [Mandiant's obfuscated command-line
    ML](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/)
    token/entropy features. Emitting the top-3 contributing features (per-feature path-length / SHAP)
    in the alert makes the score actionable. This catches functionally-equivalent but syntactically unusual
    clears that defeat symbolic rules, supporting the TA0112 goal of detecting attempts to undermine monitoring.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Critical Application Servers, User Workstations, Endpoints of privileged
    users'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [cmd_len, arg_entropy, special_char_ratio, suspicious_substrings,\n     \
      \        parent_reputation, path_rarity]\n  score_unsup = IsolationForest(features)\n  score_sup\
      \   = classifier(features)  # where labels exist\n  alert if score_unsup > threshold OR score_sup\
      \ = malicious\n  emit top-3 contributing features (SHAP)"
- question: Has Windows Security Event ID 1102 (audit log cleared) or System Event ID 104 been generated,
    or has a wevtutil cl/clear-log, Clear-EventLog, or wmic ClearEventLog command executed?
  context: Event ID 1102 and 104 fire whenever the audit/security or a non-security log is cleared, including
    API-based clearing that uses no LOLBin, so these deserve a zero-tolerance alert as in the [Elastic
    'Windows Event Logs Cleared' rule](https://www.elastic.co/guide/en/security/current/windows-event-logs-cleared.html).
    A second rule over Windows Event ID 4688 and PowerShell 4104 catches the command-line route via case-insensitive
    wevtutil cl/clear-log, Clear-EventLog, and wmic ClearEventLog, per the [SigmaHQ rules](https://github.com/SigmaHQ/sigma/tree/master/rules/windows)
    and [CAR-2016-04-002](https://car.mitre.org/analytics/CAR-2016-04-002/). A positive result is a high-confidence
    indicator of deliberate defense impairment under TA0112; the literal thresholds must stay intact because
    clearing is essentially never legitimate background activity.
  answer_sources:
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Windows Servers with security logging enabled, SIEM/Log Aggregator, Privileged
    Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  rule1: windows_event_id IN (1102, 104) -> raise alert (API or LOLBin clearing)\n  rule2:\
      \ (windows_event_id=4688 OR windows_event_id=4104)\n         AND (lower(command_line) MATCHES 'wevtutil.*(cl|clear-log)'\n\
      \              OR lower(command_line) MATCHES 'clear-eventlog'\n              OR lower(command_line)\
      \ MATCHES 'wmic.*cleareventlog')\n         -> raise alert"
- question: Is an account outside the small set that legitimately manages logs clearing logs, or is the
    clearing happening at an anomalous off-hours time relative to that user's baseline?
  context: 'Only a handful of service or admin accounts normally clear logs, and they tend to do so on
    predictable schedules. The analyst baselines that legitimate group and the Frequency of wevtutil/Clear-EventLog
    per user, then alerts when an account outside the group clears logs or when timing falls more than
    2 standard deviations from the user''s mean activity hour; [change-point detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)
    is a principled alternative to fixed-sigma off-hour rules. Recording State (clear succeeded versus
    access-denied / 4663 DELETE failure) distinguishes a successful tamper from a low-privilege actor
    probing — repeated failed clears are themselves suspicious. This ties directly to TA0112: an unexpected
    actor degrading logs is a defense-impairment hallmark.'
  answer_sources:
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Windows Servers with security logging enabled, SIEM/Log Aggregator, Privileged
    Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  authorized = baseline_log_managers(accounts, hosts) over 90d\n  for each clear_event:\n\
      \    if account NOT IN authorized -> alert\n    if hour deviates > 2*stdev from user_mean_hour ->\
      \ alert (or change-point)\n    record State = succeeded | access_denied(4663 DELETE fail)\n  flag\
      \ repeated failed clears as low-priv probing"
- question: Do log-clearing command lines in 4688/4104 content appear syntactically unusual or obfuscated
    when scored by an NLP / gradient-boosted classifier or sequence model?
  context: Functionally-equivalent clears can be hidden behind obfuscation that literal rules miss. The
    analyst applies an NLP or gradient-boosted classifier to 4688/4104 content using character n-grams,
    token sequences, entropy, and special-character ratios (per [Mandiant's obfuscated command-line ML](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/))
    to flag syntactically unusual clears, and optionally models the administrative command stream with
    [DeepLog](https://acmccs.github.io/papers/p1285-duA.pdf) to flag out-of-distribution sequences. Reporting
    the top-3 driving features per score supports triage. This complements the zero-tolerance rules by
    catching evasive variants, advancing the TA0112 objective of detecting attempts to undermine monitoring
    trustworthiness.
  answer_sources:
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Domain Controllers, Windows Servers with security logging enabled, SIEM/Log Aggregator, Privileged
    Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = char_ngrams(cmd) + token_seq(cmd) + [entropy, special_char_ratio]\n  score\
      \ = gbm_or_nlp_classifier(features)\n  optional: DeepLog(admin_command_stream) -> out_of_distribution\
      \ flag\n  alert if score > threshold; emit top-3 features"
- question: Has a DELETE access request been recorded against an '.evtx' file in C:\Windows\System32\winevt\Logs\,
    indicating direct deletion of stored event logs?
  context: Adversaries can bypass clear events entirely by directly deleting the .evtx files on disk,
    which emits no 1102/104. With a SACL auditing DELETE applied to the winevt\Logs directory, the analyst
    alerts on Windows Event ID 4663/4656 where Object Name contains \winevt\Logs\ and ends in .evtx and
    Accesses includes DELETE, plus Sysmon Event ID 23 file-delete of .evtx. This complements the event-driven
    1102/104 rules from the [SigmaHQ rules](https://github.com/SigmaHQ/sigma/tree/master/rules/windows)
    / [Elastic 'Windows Event Logs Cleared' rule](https://www.elastic.co/guide/en/security/current/windows-event-logs-cleared.html)
    by catching file-level destruction. A positive result strongly indicates defense impairment under
    TA0112 because the underlying log artifacts are being destroyed, not merely cleared via API.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Sysmon Event ID 23
  - 'NAI: File systems of critical Windows hosts (Domain Controllers, member servers), especially those
    with object access auditing enabled on the winevt directory'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  # prerequisite: SACL DELETE audit on C:\\Windows\\System32\\winevt\\Logs\\\n  (windows_event_id\
      \ IN (4663,4656)\n     AND object_name CONTAINS '\\\\winevt\\\\Logs\\\\'\n     AND object_name ENDSWITH\
      \ '.evtx'\n     AND accesses CONTAINS 'DELETE')\n  OR (sysmon_event_id=23 AND target_filename ENDSWITH\
      \ '.evtx')\n  -> raise alert"
- question: Is a host experiencing a burst of .evtx DELETE events against winevt\Logs that exceeds its
    rolling baseline, suggesting bulk destruction of stored logs?
  context: 'A single deletion may be noise, but a sudden burst of .evtx deletions signals bulk log destruction.
    The analyst tracks the rate of 4663 DELETE events against winevt\Logs per host (Volume: count/hour;
    State: granted versus denied), maintains a 30-day rolling mean/stdev, and alerts above mean+3-sigma,
    or uses [change-point detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/) to catch the abrupt
    regime shift of bulk deletion. Because servers and workstations differ, thresholds should be host-specific.
    A positive result indicates a defense-impairment event (TA0112) in progress; denied-but-repeated attempts
    point to a constrained actor still trying.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Sysmon Event ID 23
  - 'NAI: File systems of critical Windows hosts (Domain Controllers, member servers), especially those
    with object access auditing enabled on the winevt directory'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  series = count(4663 DELETE on winevt\\Logs) per host per hour\n  mean,std = rolling_30d(series)\
      \   # host-specific\n  alert if current > mean + 3*std OR change_point_detected(series)\n  break\
      \ out State = granted | denied"
- question: When scored by an Isolation Forest or provenance-graph model, does a non-system process requesting
    DELETE on an '.evtx' file appear as a high-scoring outlier?
  context: Legitimate .evtx maintenance is performed by a narrow set of system processes; a non-system
    process deleting logs is anomalous. The analyst runs an [Isolation Forest](https://doi.org/10.1145/2133360.2133363)
    over 4663 features (acting process name, target path, file extension, access mask, account) to flag
    a non-system process requesting DELETE on a .evtx as a high outlier, and for causal context uses provenance-graph
    node scoring ([ThreaTrace](https://arxiv.org/pdf/2111.04333)) to flag the deleting process and affected
    .evtx nodes as deviating from learned benign roles. Surfacing the top-3 contributing features makes
    the alert actionable. This supports TA0112 by catching stealthy file-level log destruction that evades
    signatures.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Sysmon Event ID 23
  - 'NAI: File systems of critical Windows hosts (Domain Controllers, member servers), especially those
    with object access auditing enabled on the winevt directory'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [process_name, target_path, file_ext, access_mask, account]\n  score = IsolationForest(features)\
      \ for 4663 DELETE on .evtx\n  alert if score high AND process NOT IN system_process_set\n  optional:\
      \ ThreaTrace node-score deleting process + .evtx nodes\n  emit top-3 features"
- question: Has the Windows Event Log service been stopped (Event ID 7036 / 1100) or stopped via 'sc stop
    eventlog' or 'logman stop EventLog-*' commands?
  context: Rather than clearing logs, an adversary can simply stop the logging service to blind defenders.
    The analyst alerts on Windows Event ID 7036 when the Event Log service transitions to stopped and
    on Event ID 1100 (logging service shutting down), plus command lines like logman stop EventLog-* and
    sc stop eventlog per the [SigmaHQ rules](https://github.com/SigmaHQ/sigma/tree/master/rules/windows).
    Correlating with missing ingestion from the same host confirms the impact, and Zeek conn.log is used
    only to corroborate the host is still alive on the network. A positive result is a direct defense-impairment
    action under TA0112 because monitoring is being disabled at the source.
  answer_sources:
  - Windows Event ID 7036
  - Windows Event ID 1100
  - SIEM log ingestion metrics
  - Zeek conn.log
  - 'NAI: SIEM/Log Aggregation Platform, Network Flow Collectors, Domain Controllers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  alert if windows_event_id=7036 AND service='Windows Event Log' AND state='stopped'\n\
      \  OR windows_event_id=1100\n  OR lower(command_line) MATCHES '(logman.*stop.*eventlog|sc.*stop.*eventlog)'\n\
      \  correlate with absent ingestion from same host; Zeek conn.log = host still alive"
- question: Has a host's emitted event volume dropped below its normal low-percentile range for several
    consecutive minutes without a matching shutdown or maintenance event?
  context: 'When logging is suppressed, the most reliable signal is the absence of expected events. The
    analyst computes a rolling 30-day distribution of events/minute (Volume) per host and alerts when
    the rate falls below a low percentile (e.g., 5th) for several consecutive minutes with no matching
    shutdown/maintenance event; [change-point detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)
    pinpoints the drop. Profiling the Failure mode explicitly is key: ''host offline'' shows no Zeek traffic,
    while ''host online but silent'' shows active Zeek with zero logs — the latter is the high-confidence
    tamper signal. This realizes the TA0112 goal of detecting degraded monitoring even when no clear event
    is emitted.'
  answer_sources:
  - Windows Event ID 7036
  - Windows Event ID 1100
  - SIEM log ingestion metrics
  - Zeek conn.log
  - 'NAI: SIEM/Log Aggregation Platform, Network Flow Collectors, Domain Controllers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  dist = rolling_30d(events_per_minute by host)\n  alert if rate < p5(dist) for N consecutive\
      \ minutes\n     AND no shutdown/maintenance event\n  classify: Zeek silent -> offline ; Zeek active\
      \ + logs=0 -> online-but-silent (high conf)"
- question: Does a per-host forecast of expected event volume show a sustained drop below the predicted
    lower bound, indicating abnormal logging silence?
  context: Normal log volume follows daily and weekly seasonality that a forecast model can capture. The
    analyst fits a per-host SARIMA model of expected event volume with prediction intervals ([Hyndman
    & Athanasopoulos](https://otexts.com/fpp3/arima.html)) and flags sustained drops below the lower bound;
    sequence models such as [DeepLog](https://acmccs.github.io/papers/p1285-duA.pdf) detect abnormal cadence
    and missing expected log keys. Reporting observed-vs-expected volume and the duration of silence makes
    the alert actionable. This catches stealthy logging suppression that a fixed threshold would miss,
    supporting TA0112 detection of impaired monitoring while distinguishing it from expected quiet periods.
  answer_sources:
  - Windows Event ID 7036
  - Windows Event ID 1100
  - SIEM log ingestion metrics
  - Zeek conn.log
  - 'NAI: SIEM/Log Aggregation Platform, Network Flow Collectors, Domain Controllers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = SARIMA(events_per_host) with prediction_interval\n  alert if observed < lower_bound\
      \ for sustained window\n  optional: DeepLog flags missing expected log keys / abnormal cadence\n\
      \  report observed-vs-expected and silence duration"
- question: Did a log-clearing indicator (Event ID 1102/104 or a clear command) occur on a host within
    30 minutes of privilege escalation, new-account creation, or service installation?
  context: Log clearing rarely happens in isolation; adversaries clear logs around privilege escalation,
    persistence, and account manipulation. The analyst builds a SIEM correlation rule that raises a high-severity
    incident when a clear indicator (Event ID 1102/104 or a 4688/4104 clear command) occurs on a host
    within 30 minutes of special-privilege assignment (4672), new user (4720), a privileged-group change,
    or service install (7045). This codifies the attacker TTP chain that graph-matching hunters like [POIROT](https://dl.acm.org/doi/10.1145/3319535.3363217)
    align against provenance, and a match strongly indicates an active intrusion impairing defenses (TA0112)
    rather than benign maintenance.
  answer_sources:
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 4672
  - Windows Event ID 4720
  - Windows Event ID 7045
  - 'NAI: SIEM/Correlation Engine, Domain Controllers, Critical Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  clear = event_id IN (1102,104) OR clear_command(4688/4104)\n  suspicious = event_id\
      \ IN (4672,4720,7045) OR privileged_group_change\n  if clear AND suspicious on same host within\
      \ 30 minutes -> high-severity incident"
- question: Does a host's accumulated, weighted risk score from defense-evasion and persistence events
    over a sliding window exceed the 99th percentile of active hosts?
  context: Individual events may be benign, but their accumulation tells a story. The analyst assigns
    weighted points to host events by ATT&CK category and sums over a sliding 60-minute window, investigating
    when the score exceeds the 99th percentile of active hosts (Frequency/Volume of defense-evasion plus
    persistence events). [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf)-style
    rare-path rarity weighting prioritizes uncommon chains over routine admin maintenance, and including
    State (which correlated steps succeeded) sharpens confidence. A host that suddenly accumulates log
    clearing alongside persistence and escalation points to a coordinated intrusion under TA0112.
  answer_sources:
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 4672
  - Windows Event ID 4720
  - Windows Event ID 7045
  - 'NAI: SIEM/Correlation Engine, Domain Controllers, Critical Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for each host: score = sum(weight(event_attack_category)) over sliding 60-min window\n\
      \  weight rare chains higher (ProvDetector rarity)\n  investigate if score > p99(active_hosts)\n\
      \  include State of correlated steps"
- question: When events are modeled as a provenance graph, do subgraphs place log clearing near credential
    access, persistence, or lateral movement in a coherent attack narrative?
  context: Coordinated attacks form recognizable structures across many events that point alerts cannot
    see. The analyst models events as a provenance graph and scores subgraphs where log clearing sits
    near credential access, persistence, or lateral movement; streaming graph-sketch ([UNICORN](https://arxiv.org/abs/2001.01525))
    and temporal-GNN approaches ([KAIROS](https://tfjmp.org/publications/2024-sp.pdf)) detect such coordinated
    narratives, and KAIROS reconstructs the contributing attack-footprint subgraph to surface the top
    contributing nodes/edges instead of a bare score. This gives analysts an explainable narrative tying
    log clearing to the broader intrusion, directly serving the TA0112 goal of exposing activity an adversary
    tried to hide.
  answer_sources:
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 4672
  - Windows Event ID 4720
  - Windows Event ID 7045
  - 'NAI: SIEM/Correlation Engine, Domain Controllers, Critical Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  G = provenance_graph(events)\n  score subgraphs where log_clearing adjacent to cred_access/persistence/lateral_movement\n\
      \  model: UNICORN(graph_sketch) or KAIROS(temporal_GNN)\n  output reconstructed attack-footprint\
      \ subgraph (top nodes/edges)"
- question: Did a log-clearing event or command on a host precede a sustained drop in 4688/4104 telemetry
    while Zeek conn.log still shows the host actively communicating?
  context: 'The combination of a clear indicator followed by telemetry silence, while the host is still
    on the network, is a high-confidence sign of intentional suppression rather than an offline host.
    The analyst alerts when Event ID 1102/104 or a matching wevtutil/Clear-EventLog command ([SigmaHQ](https://github.com/SigmaHQ/sigma/tree/master/rules/windows)/[Elastic](https://www.elastic.co/guide/en/security/current/windows-event-logs-cleared.html))
    is followed by a sustained drop in 4688/4104 telemetry from the same host while Zeek conn.log still
    shows active traffic. This distinguishes deliberate defense impairment (TA0112) from a benign shutdown:
    an online-but-silent host that just cleared its logs is behaving exactly as an adversary covering
    tracks would.'
  answer_sources:
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Windows endpoints with Security log forwarding enabled, privileged user workstations, and SIEM/log
    aggregation collectors'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  if (event_id IN (1102,104) OR clear_command(wevtutil/Clear-EventLog)) on host\n    \
      \ AND 4688/4104 telemetry from host drops sustained afterwards\n     AND Zeek conn.log shows host\
      \ still active\n  -> alert (intentional suppression, not offline)"
- question: After a clear indicator, does a host's ratio of Zeek network activity to emitted Windows events
    fall below its 1st-percentile baseline, indicating online-but-silent behavior?
  context: 'Each host has a normal relationship between its network chatter and the volume of Windows
    events it emits. The analyst learns the normal ratio of Zeek conn.log activity to emitted Windows
    events over 30 days and alerts when that ratio drops below the 1st percentile immediately after a
    clear indicator; [change-point detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/) marks
    the regime shift. Explicitly profiling the Failure mode is essential: online-but-silent (Zeek active,
    logs zero) is the high-confidence signal versus a benign shutdown (no Zeek). This statistically confirms
    post-clear suppression, reinforcing TA0112 detection.'
  answer_sources:
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Windows endpoints with Security log forwarding enabled, privileged user workstations, and SIEM/log
    aggregation collectors'
  range: Last 90 days
  queries:
