name: 'T1056: Input Capture'
id: 98afd7df-6e03-44f7-9614-56c2826b9c75
description: Hunt for adversary capture of user input used either to steal credentials (Credential Access)
  or to collect information for follow-on objectives (Collection). This playbook helps an analyst investigate
  keylogging and input-capture activity across Windows, Linux, and macOS endpoints and the network. It
  covers process- and network-level matching of known keylogger indicators; detection of keystroke-capture
  primitives such as SetWindowsHookEx, GetAsyncKeyState/GetKeyState polling, raw input-device access (/dev/input,
  evdev EVIOCGRAB, macOS IOHIDSystem/Quartz), and Credential API hooking; registry/named-pipe/mutex artifact
  creation and high-entropy naming; UI-DLL loads by non-interactive or non-GUI processes; input-capture
  keywords and obfuscation in PowerShell script blocks; credential-like HTTP POSTs and fake login portals
  (web portal capture); suspicious file staging in temp/user directories; rapid small writes consistent
  with keystroke buffering; and beaconing/DNS-tunnel exfiltration of captured data. Each question pairs
  deterministic symbolic-logic rules with statistical baselining and explainable machine-learning approaches
  so an analyst can confirm, scope, and triage input-capture activity defensibly.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any process creation events or outbound network connections on monitored endpoints match
    known keylogger indicators (process hashes, destination IPs, or resolved domains) from a pre-staged
    threat-intelligence feed?
  context: For Credential Access, the fastest, highest-confidence win is matching first-party telemetry
    against curated keylogger intelligence. Continuously join Sysmon EID 1 / Windows 4688 process hashes
    and Zeek conn.log/dns.log destinations against a locally staged indicator list so the hunt does not
    depend on a live external lookup. A hash match on a workstation, or a beacon to flagged C2 from a
    domain controller or financial system, is strong evidence an adversary deployed a keylogger to harvest
    credentials. A positive match should be high severity; a negative result narrows the threat to unknown/custom
    tooling that the later behavioral and statistical questions are designed to catch.
  answer_sources: &id001
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User Workstations, Critical Servers (e.g., Domain Controllers, Financial Systems), Remote Access
    Gateways, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ti = load_local_indicators(type in [hash,ip,domain]); proc = process_events(EID in [1,4688]);
      net = conn_log JOIN dns_log; alert HIGH when proc.sha256 in ti.hashes OR net.dest_ip in ti.ips OR
      net.query in ti.domains; output host, process, hash, dest, matched_indicator.
- question: Is any unsigned or non-allowlisted process installing keyboard hooks (SetWindowsHookEx with
    WH_KEYBOARD/WH_KEYBOARD_LL), running tight GetAsyncKeyState/GetKeyState polling loops, or accessing
    raw input devices (Linux /dev/input/* and evdev EVIOCGRAB ioctl; macOS IOHIDSystem)?
  context: These API and device-access primitives are the deterministic floor for user-space keylogging
    across platforms, so detecting them gives strong, low-ambiguity evidence of credential capture. Use
    Sysmon process access (EID 10) and Security 4663/4656 on Windows, auditd open/read/ioctl/ptrace on
    Linux, and macOS unified log/osquery on macOS to observe hook installation or input polling, then
    gate the alert on the calling process being unsigned or absent from the GUI-application allowlist.
    A positive result on a backend server or service account is especially suspicious because such hosts
    have no legitimate interactive-input reason; benign GUI apps explain most matches and should be allowlisted.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'win: process_access(EID=10) OR api_calls where api in [''SetWindowsHookEx(WH_KEYBOARD*)'',''GetAsyncKeyState'',''GetKeyState''];
      alert when caller.signed=false OR caller not in gui_allowlist.'
  - technology: auditd/pseudocode
    query: syscall in [open,read,ioctl] where path matches '/dev/input/*' OR ioctl_cmd=EVIOCGRAB OR syscall=ptrace;
      alert when proc not in gui_allowlist.
- question: Which low-prevalence process hashes (seen on <0.1% of hosts) are initiating connections to
    newly registered or low-reputation domains, or generating elevated failed-connection/NXDOMAIN counts?
  context: 'Statistical rarity combines two weak signals into a strong one for Credential Access: a process
    almost no other host runs, talking to infrastructure that itself is new or poorly rated. Compute per-hash
    prevalence across the fleet, then filter to processes contacting domains under 30 days old or in the
    bottom 5th percentile of reputation. Separately profiling per-host blocked-connection and NXDOMAIN
    counts surfaces a distinct exfiltration-failure signal where a keylogger repeatedly fails to reach
    its drop site. A positive combination warrants escalation and hash hunting; a high-prevalence signed
    process is almost always benign.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: prev[h] = count_distinct(host where hash=h)/total_hosts; rare = hash where prev<0.001 and not
      allowlisted; alert when rare connects to (domain_age<30d OR reputation_pctile<5) ; also alert when
      per_host failed_conn or NXDOMAIN count > baseline+3*stdev.
- question: When each process-network pair is scored by a supervised ensemble model for keylogger likelihood,
    which pairs exceed the tuned threshold and what features (per SHAP/LIME) drive the score?
  context: Where rules and single statistics miss custom credential-stealing tooling, a supervised ensemble
    (Random Forest/XGBoost or stacking/voting) trained on process name, parent, command line, destination
    IP/port, connection duration, bytes sent/received (Volume), connections-per-minute (Frequency), success/fail
    ratio (State), and destination ASN can learn the composite shape of keylogger exfiltration. Emit the
    top-3 SHAP/LIME features in every alert so the analyst can judge whether the model latched onto meaningful
    behavior (e.g., tiny periodic POSTs from an unsigned binary) rather than noise. Tune the threshold
    against a false-positive budget; high-confidence hits feed the IOC and rule questions above.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: feat = features(proc[name,parent,cmdline], net[dest_ip,port,duration,bytes_out,bytes_in,conn_per_min,fail_ratio,asn]);
      score = ensemble.predict_proba(feat); alert when score>threshold_fp_tuned; attach shap_top3(feat).
- question: Is an unsigned or anomalously named process creating registry keys, named pipes, or mutexes
    whose names match known keylogger artifact patterns (e.g., HKCU\Software\.*(key|hook|log).*, \pipe\winkeylog)?
  context: Keyloggers and capture frameworks (including Cobalt Strike default modules) frequently establish
    persistence or inter-process communication through registry values and named pipes with recognizable
    naming, so regex matching of Sysmon EID 12-14 (registry) and 17-18 (named pipe) is a reliable detector
    for Credential Access tooling. Gate on the creating process being unsigned to cut noise. A positive
    match, particularly from a temp directory or unsigned binary, indicates capture infrastructure being
    stood up; legitimate software that happens to match should be allowlisted by full path and signer.
  answer_sources: &id002
  - Windows Event ID 12 (Sysmon)
  - Windows Event ID 13 (Sysmon)
  - Windows Event ID 14 (Sysmon)
  - Windows Event ID 17 (Sysmon)
  - Windows Event ID 18 (Sysmon)
  - 'NAI: User Workstations, Terminal Servers, Virtual Desktop Infrastructure (VDI) instances, Registry
    Hives'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ev = sysmon(EID in [12,13,14,17,18]); alert when TargetObject ~= 'HKCU\\Software\\.*(key|hook|log).*'
      OR PipeName ~= '\\pipe\\(winkeylog|.*key.*)' and creator.signed=false; output host, process, TargetObject.
- question: Which registry-key or named-pipe creation events have artifact names whose Shannon entropy
    exceeds the 98th percentile of names created by legitimate signed processes, especially when the creator
    runs from a temporary directory?
  context: Adversaries often auto-generate artifact names, producing high-entropy strings unlike the predictable
    names used by signed system processes (svchost.exe, lsass.exe). Baseline entropy of artifact names
    from known-good signed creators, then flag creations above the 98th percentile. Combined with execution
    from %TEMP%/%APPDATA%, high entropy is a strong indicator of hidden keylogger IPC/persistence supporting
    credential theft. A positive result is a hunting lead to pull the creating binary; legitimate randomized
    names (some installers, GUIDs) are the main false-positive source and can be baselined per process.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: base = entropy(name) for artifacts where creator.signed=true; thr = pctile(base,98); alert
      when entropy(new_artifact.name)>thr and creator.path ~= '(Temp|AppData)'.
- question: When artifact-creation events are clustered on creator process, parent, artifact path, name
    entropy, and signature status, which small clusters or outliers fail to group with benign system activity?
  context: Unsupervised clustering (DBSCAN/Isolation Forest) finds keylogger artifact creation that does
    not match any known pattern by isolating events that sit apart from the dense mass of benign system
    behavior. Features include creating process and parent names, artifact path, name entropy, and signing
    status. Surfacing the features most responsible for an outlier's distance lets the analyst see why
    an event is anomalous (e.g., unsigned process from temp creating a high-entropy pipe). Outliers are
    triage leads, not verdicts; correlate with the symbolic and entropy questions to confirm Credential
    Access intent.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: X = features(creator,parent,artifact_path,name_entropy,signed); model = IsolationForest()/DBSCAN();
      outliers = model.fit_flag(X); report top_distance_features(outlier).
- question: Is any non-interactive (Session 0) or interpreter-spawned process (parent services.exe or
    powershell.exe) loading UI DLLs such as user32.dll or gdi32.dll while not being an allowlisted GUI/service
    application?
  context: 'User-input capture requires UI/input plumbing, so a process with no legitimate GUI purpose
    loading user32.dll/gdi32.dll is a deterministic keylogging tell relevant to Credential Access. Use
    Sysmon EID 7 image loads correlated to EID 1 process context: flag loads of these DLLs when the parent
    is services.exe or powershell.exe, or the process runs in Session 0, and the image is not allowlisted.
    A positive result on a server or service account is highly suspicious because those hosts rarely need
    interactive-input APIs; allowlist genuine GUI/service apps to control noise.'
  answer_sources: &id003
  - Windows Event ID 7 (Sysmon)
  - Windows Event ID 1 (Sysmon)
  - 'NAI: Backend Servers (Web, Database), Domain Controllers, User Workstations, Administrator Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: il = sysmon(EID=7) where ImageLoaded in ['user32.dll','gdi32.dll']; ctx = join sysmon(EID=1)
      on ProcessGUID; alert when (ParentImage in ['services.exe','powershell.exe'] OR Session=0) and Image
      not in gui_allowlist.
- question: For each process name, which DLL loads are statistically rare for that process enterprise-wide
    (e.g., loaded by <0.5% of its instances), particularly UI-related DLLs loaded by typically non-GUI
    processes?
  context: 'Building a per-process baseline of normally loaded DLLs lets you score deviations: a process
    that almost never loads user32.dll suddenly doing so is anomalous and may indicate injected keylogging
    code stealing credentials. Compute the frequency of each process-DLL pair across the fleet and assign
    a high risk score to pairs below ~0.5% prevalence, weighting UI DLLs in non-GUI processes. A positive
    result is a strong lead to inspect for code injection; expected module loads after legitimate updates
    are the main benign explanation and are absorbed by the baseline.'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: freq[proc][dll] = count(instances loading dll)/count(instances of proc); alert when freq<0.005
      and dll in ui_dlls and proc in nongui_set; score by rarity.
- question: Do critical system processes (lsass.exe, winlogon.exe) deviate from their learned DLL-load
    sequence and inter-arrival timing at startup, consistent with an injected hook chain or unexpected
    UI DLL?
  context: Some credential-capture techniques inject into trusted processes, so modeling the normal ordered
    sequence and timing of DLL loads (or API-call sequence) for lsass.exe/winlogon.exe during startup
    with an LSTM autoencoder can detect injected hook chains that signature rules miss. Alert on significant
    deviation, such as the load of an unexpected UI DLL out of normal order, and report the deviating
    step so the analyst can pinpoint the injected module. This is high-value but tuning-sensitive; pair
    positives with the rare-DLL and UI-load questions to confirm Credential Access.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: seq = ordered_dll_loads(proc in [lsass.exe,winlogon.exe], phase=startup); model = LSTM_autoencoder(seq+interarrival);
      alert when recon_error>thr; report deviating_step.
- question: Do PowerShell script-block logs (EID 4104) or process command lines (4688/Sysmon 1) reference
    input-capture APIs (Set-WindowsHookEx, GetAsyncKeyState), clipboard access (Get-Clipboard, [System.Windows.Forms.Clipboard]::GetText()),
    DllImport of user32.dll, or PSReflect patterns?
  context: Fileless and script-based keyloggers implement capture through PowerShell calling Win32 input
    APIs, so scanning 4104 script blocks and command lines for these tokens directly surfaces credential-capture
    logic. Match the listed keywords and weight matches that co-occur with obfuscation flags (Base64/encoded
    command). A positive hit, especially on a workstation or remoting-enabled server, is strong evidence
    of input capture; administrative scripting can legitimately use the clipboard, so review surrounding
    context and obfuscation before escalating.
  answer_sources: &id004
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 4104
  - 'NAI: User Workstations, Administrative Workstations, Servers with PowerShell Remoting enabled'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: logs = eventlog(4104) UNION cmdline(4688,sysmon1); alert when text ~contains any ['Set-WindowsHookEx','GetAsyncKeyState','Get-Clipboard','Clipboard]::GetText','DllImport("user32.dll")','PSReflect'];
      boost severity when obfuscation_flag.
- question: Which EID 4104 script blocks have character-frequency/entropy profiles >3 standard deviations
    above the non-obfuscated baseline or matching Base64/ASCII-hex distributions, suggesting obfuscation
    that hides input-capture logic?
  context: Attackers obfuscate keylogging scripts to defeat keyword rules, but obfuscation changes the
    statistical character distribution of the script. Compute per-script entropy and character-frequency
    and baseline normal (non-obfuscated) scripts, then flag scripts far above the mean or matching encoded
    distributions. A positive result indicates concealment worth deobfuscating and reviewing for credential-capture
    intent; legitimate encoded automation exists, so combine with the keyword and NLP questions rather
    than alerting on entropy alone.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for sb in eventlog(4104): e = shannon_entropy(sb); flag when e > mean+3*stdev OR charfreq(sb)
      ~ base64/hex_profile.'
- question: When a transformer/contextual-embedding model classifies AMSI-deobfuscated script content,
    which scripts are flagged as input-capture intent even with obfuscated keywords, and which tokens/AST
    subtrees drive the classification?
  context: Because obfuscation defeats literal matching, an NLP model fine-tuned on AMSI-collected deobfuscated
    content can recognize input-capture intent from semantics rather than exact strings. Run on post-AMSI
    deobfuscated script bodies and alert on high-confidence malicious classifications, listing the contributing
    tokens or AST subtrees so the analyst can validate the verdict. This catches novel credential-capture
    scripts that evade the keyword and entropy questions; confirm positives by reviewing the deobfuscated
    source.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: content = amsi_deobfuscated(4104); pred = transformer.classify(content); alert when pred.label='input_capture'
      and conf>thr; report top_tokens/ast_subtrees.
- question: Are there outbound HTTP POSTs whose URI/body contain credential-like parameter names (user,
    pass, login, token, keydata, keystroke) to FQDNs that are newly registered (<30 days) or low-reputation,
    and are those hosts returning repeated 401/403/404 responses?
  context: 'Web portal capture and keystroke exfiltration both send credential-like data outbound, so
    monitoring Zeek http.log for these parameter names and correlating the destination against dns.log
    and threat intel for young or low-reputation domains is a direct detector for Credential Access. Tracking
    response codes adds a distinct failure signal: repeated 401/403/404 to the same low-reputation host
    suggests failed credential-capture attempts. A positive match is high-confidence; ensure legitimate
    authentication endpoints are allowlisted to avoid flagging normal logins.'
  answer_sources: &id005
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Network Egress Points (Internet Gateway), DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: http where method=POST and (uri|body) ~i= '(user|pass|login|token|keydata|keystroke)'; join
      dns.log + ti where domain_age<30d OR reputation=low; alert; also flag host with repeated status
      in [401,403,404].
- question: When a user submits credentials to a page, does the page's displayed brand (logo/layout) fail
    to match the legitimate domain for that brand, indicating a fake login portal?
  context: Web portal capture deceives users with pages that imitate trusted brands. By identifying the
    displayed brand from logo/layout and comparing it to the page's actual domain, a brand-domain mismatch
    becomes a deterministic, interpretable indicator of a phishing/fake login portal harvesting credentials.
    The mismatch itself is the evidence and explanation. A positive result means a user may have submitted
    credentials to an attacker page (initiate credential reset and incident response); legitimate brand-owned
    alternate domains should be allowlisted.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'for page with credential_submission: brand = visual_brand(logo,layout); legit = brand_domain_map[brand];
      alert when page.domain not in legit; evidence = brand,page.domain.'
- question: Which outbound POST body sizes are statistical outliers (>3 standard deviations from the per-source/destination
    moving average), especially small (<512 byte) periodic POSTs to low-prevalence domains?
  context: Batched keystroke exfiltration tends to produce small, consistent, periodic POSTs that differ
    from a host's normal POST volume. Model typical POST body size per source IP to each destination with
    a moving average and standard deviation, then flag deviations beyond 3 sigma, weighting small periodic
    POSTs to rare domains. A positive result points to automated credential/keystroke exfiltration even
    without payload inspection; bursty legitimate uploads are the main benign case and are distinguished
    by prevalence and periodicity.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'stats per (src,dest): mu,sigma = moving_avg_std(post_body_len); alert when |len-mu|>3*sigma
      OR (len<512 and periodic and dest_prevalence<low).'
- question: Do any hosts show low-variance periodic 'heartbeat' connections in Zeek conn.log (consistent
    inter-arrival, bytes, frequency, success/fail ratio) indicative of automated keystroke exfiltration
    even when encrypted?
  context: Encrypted exfiltration hides payloads but not timing, so time-series/clustering anomaly detection
    over per-host conn.log features (inter-arrival time, bytes sent (Volume), connections per minute (Frequency),
    destination port/prevalence, success/fail ratio (State)) can reveal regular beaconing characteristic
    of credential-stealing implants. Report the top contributing features per alert so the analyst sees
    why a flow looks like a beacon. A positive result is a strong C2/exfil lead; allowlist known periodic
    services (updates, telemetry) that produce benign regularity.
  answer_sources: *id005
  range: Last 90 days, with per-host correlation across multiple beacon intervals
  queries:
  - technology: SIEM/ML pseudocode
    query: feat = per_host(conn[interarrival,bytes_out,conn_per_min,dport,dest_prev,fail_ratio]); model
      = beacon_anomaly(timeseries/cluster); alert on low-variance periodicity; report top_features.
- question: Is a non-standard or unsigned process creating .log/.txt/.dat or hidden files in staging directories
    (%TEMP%, %APPDATA%, C:\Users\Public\Documents), a common keystroke-staging pattern?
  context: For Collection, captured keystrokes are typically buffered to disk before exfiltration, so
    Sysmon EID 11 file creations matching staging-directory and extension patterns from non-allowlisted
    processes are an early indicator of input capture. Match the path/extension regex and require the
    creating process be outside the approved allowlist. A positive result, especially a hidden file or
    unsigned creator, is a lead to examine the file contents and process; legitimate apps that log to
    these paths should be allowlisted to manage noise.
  answer_sources: &id006
  - Windows Event ID 11 (Sysmon)
  - 'NAI: User Workstations, Terminal Servers, Shared File Systems, Endpoint File Systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ev = sysmon(EID=11); alert when TargetFilename ~= '.*\\(AppData|Temp|Users\\Public).*\\.*\.(log|txt|dat)$'
      OR hidden_attr and creator not in allowlist.
- question: Which filenames created in staging directories appear on only one host or are produced by
    unsigned/rare processes?
  context: Keylogger output filenames are often unique per infection, so computing prevalence of filenames
    created in staging directories and flagging those seen on a single host (or made by unsigned/rare
    processes) isolates likely capture artifacts for Collection. A positive result is a hunting lead to
    pivot on the filename and creator across the fleet; common app-generated temp filenames are high-prevalence
    and naturally filtered out.
  answer_sources: *id006
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: prev[fname] = count_distinct(host where created fname); alert when prev==1 OR creator.signed=false
      and creator_prevalence<low.
- question: When file-creation events are scored by an explainable classifier (process name/path, file
    path/extension, hidden flag, signature, time of day), which events score as likely keystroke-staging
    and what features drive them?
  context: A logistic-regression/Random Forest model over file-creation context can combine weak signals
    (unsigned creator, temp path, hidden flag, odd hour) into a single keylogger-staging score for Collection,
    surfacing the top contributing features per alert for analyst validation. This catches staging that
    single rules miss; positives should be corroborated with the prevalence and symbolic questions, and
    the feature attributions help separate genuine capture from benign logging.
  answer_sources: *id006
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: X = features(proc_name,proc_path,file_path,ext,hidden,signed,hour); score = clf.predict_proba(X);
      alert when score>thr; report top_features.
- question: Does a process write to a staging directory and then (itself or a child) make an external
    network connection within 60 seconds, matching the keylog->stage->exfiltrate pattern?
  context: Linking a file write to a near-immediate outbound connection by ProcessGUID captures the full
    Collection-to-exfiltration sequence of an input-capture tool. Alert when a Sysmon EID 11 staging-directory
    write is followed within 60 seconds by a Sysmon EID 3 external connection from the same ProcessGUID
    (or child). A positive result is a high-confidence exfiltration lead; backup/sync tools can resemble
    this and should be allowlisted by process and destination.
  answer_sources: &id007
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 3 (Sysmon)
  - Zeek conn.log
  - 'NAI: User Workstations, Application Servers, Network Egress Points'
  range: Last 90 days, correlating EID 11 and EID 3 within a 60-second window
  queries:
  - technology: SIEM/Rule pseudocode
    query: w = sysmon(EID=11, staging_dir); c = sysmon(EID=3, external) where ProcessGUID in {w.ProcessGUID,
      children(w.ProcessGUID)} and c.ts-w.ts<=60s; alert; output proc, file, dest.
- question: Which processes have a conditional probability P(network connection | file write) above 90%
    or far above their peers, indicating exfiltration tooling?
  context: A process that almost always sends data shortly after writing a file behaves like staging-and-exfil
    malware. Compute P(network connection | file write) per process and alert when it exceeds 90% or significantly
    exceeds peer processes, isolating input-capture tooling within Collection. A positive result is a
    behavioral lead to inspect the process and destinations; chatty sync clients can score high and should
    be baselined or allowlisted.
  answer_sources: *id007
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for proc: p = count(write_then_conn within window)/count(writes); alert when p>0.90 OR p >
      peer_mean+3*stdev.'
- question: Does any process's file-write byte volume track the observed user input rate (or an injected
    synthetic keystroke probe) over short windows, per Pearson correlation?
  context: 'The bait/correlation technique detects keyloggers independent of signatures: a true keystroke
    logger''s write volume rises and falls with actual keystroke volume. Measure Pearson correlation between
    user input rate (or a synthetic keystroke probe) and each process''s file-write byte volume over short
    windows; a strong positive correlation is a signature-agnostic keylogger signal for Collection. A
    high correlation is strong evidence to isolate and analyze the process; processes unrelated to input
    will show near-zero correlation.'
  answer_sources: *id007
  range: Last 90 days, with short (per-minute) correlation windows during probing
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for proc: r = pearson(input_rate_series, proc.write_bytes_series, window=1m); alert when r
      > 0.8.'
- question: When system-event sequences are modeled with an RNN/sequence model, which hosts show rare
    'keylog -> stage -> exfiltrate' sub-sequences with high anomaly scores?
  context: Modeling normal program behavior as event/call sequences lets an RNN flag the rare ordered
    pipeline of capture, staging, and exfiltration even when individual steps look benign. Train on normal
    system-event sequences and alert on high-anomaly 'keylog->stage->exfiltrate' patterns, reporting the
    anomalous sub-sequence so the analyst can trace the Collection chain. Positives are leads to investigate
    the full process lineage; rare-but-legitimate workflows are the main false-positive source and are
    reduced by retraining.
  answer_sources: *id007
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: seq = system_event_sequences(host); score = rnn.anomaly(seq); alert when score>thr and pattern
      ~ capture->write->conn; report anomalous_subsequence.
- question: Is any process making more than 30 write events (EID 4663) to the same file within one minute
    while not being a known logging service, consistent with keystroke buffering?
  context: Keyloggers append keystrokes continuously, producing many small writes to one file at a rate
