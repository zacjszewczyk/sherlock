    query: 'index=zeek sourcetype=zeek_conn

      | bin _time span=5m

      | stats sum(orig_bytes) AS bytes, count AS conns by id.orig_h, _time

      | apply shesd_anomaly bytes, conns AS anomaly_score

      | where anomaly_score>threshold

      | apply shap_explain OUTPUT top_features

      | table _time, id.orig_h, bytes, conns, anomaly_score, top_features'
- question: Did more than 10 unique hosts from the same /24 subnet or department request the same newly
    observed domain within one hour?
  context: Strategic web compromise / watering-hole attacks target a specific community, so a hallmark
    pattern is many logically related hosts suddenly contacting the same brand-new domain. Track Newly
    Observed Domains (NODs) over the past 24 hours and alert when more than 10 unique hosts from the same
    /24 subnet or department request the same NOD within one hour. A positive result strongly suggests
    a watering-hole or malvertising campaign aimed at a defined population and warrants pivoting to the
    served content and any follow-on execution on those hosts; a negative result means no coordinated
    NOD access pattern was detected. In the Initial Access context this catches the targeting fingerprint
    of a watering-hole campaign before individual exploitation may even be visible.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internal DNS Resolvers, Enterprise Web Proxy, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=zeek sourcetype=zeek_dns

      | lookup newly_observed_domains domain AS query OUTPUT first_seen

      | where (now()-first_seen)<86400

      | eval subnet=cidr_24(id.orig_h)

      | bin _time span=1h

      | stats dc(id.orig_h) AS hosts by query, subnet, _time

      | where hosts>10'
- question: Which domains show an unusually high locality ratio (many internal hosts relative to their
    global popularity) or a sudden change-point burst in request volume from a related host group, and
    do they also exhibit high HTTP/NXDOMAIN failure rates?
  context: Watering-hole gates are disproportionately popular inside a targeted enterprise relative to
    the broader internet and tend to be adopted abruptly by a related group of hosts. Compute a 'locality
    ratio' per domain (unique internal hosts requesting it / its global popularity) and alert when it
    exceeds the top 5%; pair this with a change-point/burst test on the per-domain request-count time
    series to flag sudden adoption by a related host group. Track the per-domain HTTP failure (4xx/5xx)
    and NXDOMAIN rate as a distinct signal of fast-churning watering-hole gates. A positive result surfaces
    an internally-overrepresented, suddenly-adopted, possibly-churning domain for content inspection;
    a negative result means access patterns are diffuse and consistent with general browsing. For Initial
    Access this statistically isolates the watering-hole infrastructure targeting your population.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internal DNS Resolvers, Enterprise Web Proxy, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=zeek sourcetype=zeek_http

      | stats dc(id.orig_h) AS internal_hosts by host

      | lookup global_popularity domain AS host OUTPUT global_rank

      | eval locality=internal_hosts/global_rank

      | eventstats perc95(locality) AS p95

      | where locality>=p95'
  - technology: SIEM/Stats pseudocode
    query: 'index=zeek sourcetype=zeek_http

      | timechart span=1h count by host

      | apply changepoint_detection OUTPUT cp_flag

      | where cp_flag=1'
- question: Does community detection on a bipartite host-domain graph reveal newly formed dense host-domain
    communities indicative of targeted watering-hole access, and which shared edges defined the community?
  context: Watering-hole campaigns create tight clusters in which a set of related hosts connect to a
    set of related attacker domains. Build a bipartite graph of internal hosts and external domains and
    run community detection (e.g., Louvain); flag newly formed dense host-domain communities as targeted
    watering-hole indicators, and pivot from any confirmed malicious node to related infrastructure via
    guided search of shared content/redirect/DNS gadgets (EVILSEED-style). Surface the top-3 shared edges
    or features that defined the community in the alert. A positive result reveals a coordinated host-domain
    cluster that warrants investigation of the shared domains and the affected hosts; a negative result
    means no dense novel community formed. In the Initial Access context this exposes the structure of
    a watering-hole campaign and enables expansion to its broader infrastructure.
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internal DNS Resolvers, Enterprise Web Proxy, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'index=zeek sourcetype=zeek_http

      | eval edge=id.orig_h."->".host

      | apply louvain_community edge OUTPUT community_id, community_density, community_age

      | where community_density>threshold AND community_age<86400

      | apply shap_explain OUTPUT top_edges

      | table community_id, community_density, top_edges'
