      \ AND new=\"RX\")\n   OR (event=\"SETTHREADCONTEXT\" AND target_thread_suspended AND target_pid!=source_pid)\n\
      | eval flag=callstack_flags()  // direct_syscall, shellcode, hollow_image\n| append [search sysmon\
      \ EventCode=25 Type=\"Image is replaced\"]\n| table _time, host, event, source_pid, target_pid,\
