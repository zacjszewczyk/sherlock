- question: Does a created or connected named pipe (Sysmon Event ID 17/18) match a known malicious/C2-framework
    pipe pattern (e.g. \msagent_[0-9a-f]{4}, \MSSE-[0-9]+-server, \postex_*, \status_*), or is a pipe
    created by a process that should never create pipes (notepad.exe, mspaint.exe)?
  context: 'Injected modules use named pipes for covert IPC; known C2 frameworks have signature pipe names.
    Monitor EID 17 (Pipe Created) and 18 (Pipe Connected) and match PipeName against a regularly updated
    list of exact strings and regexes; Cobalt Strike defaults are detectable (WithSecure, SigmaHQ 85adeb13).
    Also alert on pipe creation by processes that should not create pipes. For remote pipe access flag
    EID 18 where Image is ''System'' with ProcessId 4 (SMB-based lateral movement). Alerts must include
    PipeName, SourceImage, TargetImage, timestamps, and host ID. Source citations: [WithSecure Labs](https://labs.withsecure.com/publications/detecting-cobalt-strike-default-modules-via-named-pipe-analysis);
    [SigmaHQ rule ID 85adeb13](https://github.com/SigmaHQ/sigma).'
