questions:
- question: Did a process whose SourceImage file hash matches a known-malicious threat-intelligence indicator
    create a remote thread in, or open memory access to, a critical higher-privileged system process such
    as lsass.exe, services.exe, or wininit.exe?
  context: 'This is the deterministic floor for injection-based privilege escalation. Join Sysmon Event
    ID 1 (Process Creation) to recover the SourceImage hash, then join to Event ID 8 (CreateRemoteThread)
    or Event ID 10 (ProcessAccess) by ProcessGUID. A hash matching a TI feed AND a target that is a high-integrity
    system process is high-confidence malicious. Reinforce with GrantedAccess masks 0x1FFFFF (full) or
    0x147A and a CallTrace containing ''UNKNOWN'' (memory not backed by a loaded module), and run ETW
    Threat-Intelligence ALLOCVM_REMOTE/WRITEVM as a parallel path. A positive result means an attacker
    is running code inside a privileged process; a negative result does not clear the host because unknown-hash
    injectors and stealth tooling will not match TI. Source citations: [Active Countermeasures Sysmon
    analysis](https://www.activecountermeasures.com/threat-hunting-process-injection-with-jupyter-notebook-and-sysmon/);
    [Elastic Security Labs ETW call stack detections](https://www.elastic.co/security-labs/doubling-down-etw-callstacks).'
  answer_sources:
  - Windows Event ID 1
  - Windows Event ID 8
  - Windows Event ID 10
  - etw:Microsoft-Windows-Threat-Intelligence
  - 'NAI: Domain Controllers, Critical Application Servers, Privileged Access Workstations, Standard User
    Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=sysmon (EventCode=8 OR EventCode=10)\n| join ProcessGuid [search source=sysmon EventCode=1\
      \ | fields ProcessGuid, Hashes]\n| where Hashes IN threat_intel_hashes\n  AND TargetImage IN (\"\
      lsass.exe\",\"services.exe\",\"wininit.exe\",\"csrss.exe\")\n  AND (GrantedAccess IN (\"0x1FFFFF\"\
      ,\"0x147A\") OR like(CallTrace,\"%UNKNOWN%\"))\n| eval severity=\"critical\"\n| table _time, host,\
      \ SourceImage, Hashes, TargetImage, GrantedAccess, CallTrace"
- question: Is a source-target process injection pair (SourceImage to TargetImage) statistically anomalous
    relative to the enterprise's 30-day rolling baseline of observed injection pairs, especially when
    the SourceImage binary is globally rare?
  context: 'Sophisticated actors use unknown binaries, so prevalence and rarity beat signatures. For every
    Event ID 8/10, form the (SourceImage, TargetImage) pair and maintain a 30-day rolling baseline of
    pair frequencies. Apply the modified Z-score (0.6745*(x-median)/MAD) and alert on |Z| > 3.5 (Iglewicz
    & Hoaglin), prioritizing high-integrity targets. Enrich with fleet-wide prevalence of the SourceImage
    binary and alert when GlobalPrevalence < 200 (FalconForce T1055-WIN-001). Also track GrantedAccess-denied
    (failed) attempts as a distinct probing signal. A spike on a rare source binary touching a privileged
    target is a strong escalation indicator. Source citations: [FalconForce T1055-WIN-001](https://github.com/FalconForceTeam/FalconFriday/blob/master/Privilege%20Escalation/T1055-WIN-001.md).'
  answer_sources:
  - Windows Event ID 1
  - Windows Event ID 8
  - Windows Event ID 10
  - etw:Microsoft-Windows-Threat-Intelligence
  - 'NAI: Domain Controllers, Critical Application Servers, Privileged Access Workstations, Standard User
    Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=sysmon (EventCode=8 OR EventCode=10)

      | eval pair=SourceImage."->".TargetImage

      | eventstats median(count) as med, <MAD> as mad by pair  // 30d rolling

      | eval mz = 0.6745*(count-med)/mad

      | lookup prevalence SourceImage OUTPUT GlobalPrevalence

      | where abs(mz) > 3.5 OR GlobalPrevalence < 200

      | table _time, host, SourceImage, TargetImage, mz, GlobalPrevalence, GrantedAccess'
- question: Does a supervised gradient-boosted classifier, scoring Sysmon Event ID 8/10 injection events
    on access masks, call-trace integrity, binary prevalence, pair rarity, and process-chain features,
    flag an event as malicious injection?
  context: 'Where deterministic and statistical methods miss novel tradecraft, a trained ensemble (XGBoost/LightGBM)
    generalizes. Features: SourceImage and TargetImage names, GrantedAccess code, CallTrace contains UNKNOWN
    (boolean), enterprise prevalence of SourceImage, source-target pair rarity, time-of-day, parent-chain
    depth, and TF-IDF over API-call sequences (Catak et al. 2024). Deploy with SHAP explainability (Basheer
    et al. 2024): the alert must list the top-3 contributing features (e.g. ''GrantedAccess=0x1FFFFF,
    CallTrace=UNKNOWN, SourceImage prevalence=3''). The deterministic hash-match and GrantedAccess-threshold
    rules remain the floor beneath the model. Source citations: [Catak et al. (2024)](https://arxiv.org/abs/2403.02232);
    [Basheer et al. (2024, Springer AIAI)](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9).'
  answer_sources:
  - Windows Event ID 1
  - Windows Event ID 8
  - Windows Event ID 10
  - etw:Microsoft-Windows-Threat-Intelligence
  - 'NAI: Domain Controllers, Critical Application Servers, Privileged Access Workstations, Standard User
    Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [source_img, target_img, granted_access, calltrace_unknown,\n            src_prevalence,\
      \ pair_rarity, hour_of_day, parent_chain_depth,\n            tfidf(api_call_sequence)]\nscore =\
      \ xgboost_model.predict_proba(features)\nif score > threshold: alert(top3=shap_values(features))\n\
      # deterministic hash/GrantedAccess rule remains the floor"
- question: Did a single source process obtain memory-write access to a target process (Event ID 10) and
    then create a remote thread in that SAME target (Event ID 8) within a sub-second (1-second) window,
    completing the allocate-write-execute injection chain?
  context: 'The classic injection chain is write-then-execute against one target, linked by identical
    SourceProcessGUID and TargetProcessGUID and separated by milliseconds. Build a stateful correlation
    rule that fires when EID 10 with write rights (GrantedAccess includes 0x1400, 0x0020, or 0x0010) is
    followed within 1 second by EID 8 against the same target. Requiring only 2-of-3 fundamental steps
    linked by address/GUID identity (Di Pietro et al. 2025) reduces false negatives against variants that
    skip a step. Layer ETW TI ALLOCVM_REMOTE -> WRITEVM -> QUEUEUSERAPC/SETTHREADCONTEXT as a parallel
    path. Source citations: [Di Pietro et al. (2025, ACM Asia CCS)](https://dl.acm.org/doi/10.1145/3708821.3736206);
    [TiEtwAgent](https://github.com/xuanxuan0/TiEtwAgent).'
  answer_sources:
  - Windows Event ID 8
  - Windows Event ID 10
  - etw:Microsoft-Windows-Threat-Intelligence
  - 'NAI: Domain Controllers, Critical Application Servers, Privileged Access Workstations, Standard User
    Endpoints'
  range: Last 90 days; event-centered 1-second correlation window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=sysmon EventCode=10 AND (GrantedAccess bitand 0x1400 OR 0x0020 OR 0x0010)\n| transaction\
      \ SourceProcessGuid TargetProcessGuid maxspan=1s\n  startswith=EventCode=10 endswith=EventCode=8\n\
      | where SourceProcessGuid==SourceProcessGuid AND TargetProcessGuid==TargetProcessGuid\n| eval severity=\"\
      high\" | table _time, host, SourceImage, TargetImage, GrantedAccess"
- question: Is the time delta between memory-write access (Event ID 10) and remote-thread creation (Event
    ID 8) for the same process pair below the 1st percentile of the baseline (indicating sub-100ms programmatic
    automation), or are there bursts of failed (ACCESS_DENIED) injection attempts?
  context: 'Human/benign interactions produce wider, irregular timing; automated injectors fire write-then-execute
    in tight, repeatable deltas. Compute the distribution of EID10->EID8 deltas (same ProcessGUIDs) over
    30 days using EWMA control charts (Ye, Chen & Borror 2004) and flag deltas below the 1st percentile
    (typically <100ms). Combine with live memory-region analysis (RWX pages on the target) for high accuracy
    (Nasereddin & Al-Qassas 2024). Separately count EID 10 events returning STATUS_ACCESS_DENIED per source;
    >3 failures in 60s indicates injection tooling probing protected processes. Source citations: [Nasereddin
    and Al-Qassas (2024)](https://link.springer.com/article/10.1007/s10207-024-00836-w).'
  answer_sources:
  - Windows Event ID 8
  - Windows Event ID 10
  - etw:Microsoft-Windows-Threat-Intelligence
  - 'NAI: Domain Controllers, Critical Application Servers, Privileged Access Workstations, Standard User
    Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=sysmon (EventCode=10 OR EventCode=8)\n| transaction SourceProcessGuid TargetProcessGuid\
      \ startswith=EventCode=10 endswith=EventCode=8\n| eval delta_ms = duration*1000\n| eventstats perc1(delta_ms)\
      \ as p1 by SourceImage\n| where delta_ms < p1 OR delta_ms < 100\n| append [search EventCode=10 GrantedAccess_status=\"\
      STATUS_ACCESS_DENIED\"\n          | bin _time span=60s | stats count by SourceImage,_time | where\
      \ count>3]"
- question: Does a sequence-aware LSTM model trained on ordered per-endpoint process-interaction events
    (ProcessAccess, CreateRemoteThread, ImageLoad) assign a below-threshold probability to an observed
    event chain, indicating an abnormal injection sequence?
  context: 'Attackers jitter timing and interleave benign API calls to defeat fixed-window rules. An LSTM
    (128-dim embedding -> 128-unit LSTM, 0.3 dropout -> dense+softmax) learns normal event ordering per
    endpoint (Catak et al. 2020) and flags sequences below a learned threshold calibrated for <1% FPR
    on validation. Train on Mal-API-2019 plus site-specific Sysmon logs. The deterministic 1-second correlation
    rule remains the floor; the LSTM adds coverage for jittered or interleaved chains. Emit SHAP-derived
    top-3 sequence features in the alert. Source citations: [Catak et al. (2020, PeerJ Computer Science)](https://peerj.com/articles/cs-285/);
    [Mal-API-2019 dataset](https://github.com/ocatak/malware_api_class); [PeerJ CS (2025)](https://peerj.com/articles/cs-3258/).'
  answer_sources:
  - Windows Event ID 8
  - Windows Event ID 10
  - etw:Microsoft-Windows-Threat-Intelligence
  - 'NAI: Domain Controllers, Critical Application Servers, Privileged Access Workstations, Standard User
    Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = ordered_events(host, window) # [ProcessAccess, CreateRemoteThread, ImageLoad...]

      p = lstm_model.predict(embed(seq))

      if p < learned_threshold: alert(top3=shap_sequence_features(seq))

      # 1-second deterministic correlation remains the floor'
- question: Did a lower-integrity process (Medium) access or create a remote thread in a higher-integrity
    process (High or System), or did a High-integrity process target a System-integrity process, violating
    the Windows mandatory integrity model?
  context: 'Cross-integrity injection is a direct privilege-escalation signal. Alert on any EID 8/10 where
    SourceProcessIntegrityLevel is Medium and TargetProcessIntegrityLevel is High/System, or Source High
    -> Target System. Escalate to critical when the source process''s parent is an Office app (winword.exe,
    excel.exe) or scripting engine (wscript.exe, cscript.exe, powershell.exe). Maintain a tuned allowlist
    of legitimate cross-integrity tools (consent.exe, msiexec.exe). Also track svchost.exe spawned by
    a non-services.exe parent as a high-fidelity injection/escalation indicator (Red Canary). Source citations:
    [SigmaHQ rule repository](https://github.com/SigmaHQ/sigma); [Red Canary''s Threat Detection Report](https://redcanary.com/threat-detection-report/techniques/process-injection/).'
  answer_sources:
  - Windows Event ID 8
  - Windows Event ID 10
  - 'NAI: Standard User Endpoints, Virtual Desktop Infrastructure (VDI) fleet, Multi-user Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=sysmon (EventCode=8 OR EventCode=10)\n| where (SourceProcessIntegrityLevel=\"Medium\"\
      \ AND TargetProcessIntegrityLevel IN (\"High\",\"System\"))\n     OR (SourceProcessIntegrityLevel=\"\
      High\" AND TargetProcessIntegrityLevel=\"System\")\n| where NOT SourceImage IN allowlist_cross_integrity\n\
      | eval severity=if(ParentImage IN (\"winword.exe\",\"excel.exe\",\"wscript.exe\",\"cscript.exe\"\
      ,\"powershell.exe\"),\"critical\",\"high\")\n| table _time, host, SourceImage, ParentImage, TargetImage,\
      \ SourceProcessIntegrityLevel, TargetProcessIntegrityLevel"
- question: Has a given SourceImage's distribution of TargetProcessIntegrityLevel access deviated significantly
    (chi-squared p < 0.01) from its 30-day historical pattern, for example a process that only ever touched
    Medium-integrity targets now reaching System-integrity ones?
  context: 'Behavioral drift in integrity-level access betrays newly weaponized binaries. For each SourceImage,
    build a 30-day rolling baseline of target integrity-level distributions from EID 8/10 and apply a
    chi-squared goodness-of-fit test; p < 0.01 means a statistically significant change (Microsoft frequency-analysis
    methodology). A process historically confined to Medium targets that suddenly accesses System integrity
    is suspect. Also track the ratio of failed-to-successful cross-integrity accesses per source; a failure
    rate >50% indicates probing. Source citations: [Microsoft''s frequency analysis methodology](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).'
  answer_sources:
  - Windows Event ID 8
  - Windows Event ID 10
  - 'NAI: Standard User Endpoints, Virtual Desktop Infrastructure (VDI) fleet, Multi-user Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=sysmon (EventCode=8 OR EventCode=10)

      | stats count by SourceImage, TargetProcessIntegrityLevel  // current vs 30d baseline

      | chisquare observed=current expected=baseline by SourceImage

      | where p_value < 0.01

      | eval fail_ratio = failed_access/(failed_access+success_access)

      | where p_value<0.01 OR fail_ratio>0.5'
- question: Does an Isolation Forest trained on integrity-level transition features flag an injection
    event as anomalous, catching edge cases such as High->System escalation by an unusual process?
  context: 'Unsupervised anomaly detection needs no labeled attacks and catches rare escalation patterns.
    Train an Isolation Forest (contamination=0.01, n_estimators=200) on: SourceProcessIntegrityLevel (ordinal),
    TargetProcessIntegrityLevel (ordinal), SourceImage hash, TargetImage category (system/user/service),
    time-of-day, and source process age. IF achieves high recall with good precision (PMC 2024). The deterministic
    Medium->High/System rule remains the floor; IF adds coverage for unusual High->System escalations.
    Apply LIME (Nature Sci Reports 2025) to explain each anomaly score''s top contributing features. Source
    citations: [PMC (2024)](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/); [Nature Scientific Reports
    (2025)](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Windows Event ID 8
  - Windows Event ID 10
  - 'NAI: Standard User Endpoints, Virtual Desktop Infrastructure (VDI) fleet, Multi-user Terminal Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = [src_integrity_ord, tgt_integrity_ord, src_hash, tgt_category,\n     hour_of_day, src_process_age_sec]\n\
      model = IsolationForest(contamination=0.01, n_estimators=200)\nif model.decision_function(X) < 0:\
      \ alert(explain=lime(X))\n# Medium->High/System deterministic rule remains the floor"
- question: After an injection event targeted a critical process (lsass.exe, svchost.exe, services.exe,
    csrss.exe), did that target process within 300 seconds spawn a child (cmd.exe/powershell.exe/conhost.exe)
    or initiate an outbound connection to a non-RFC1918 address?
  context: 'Post-injection, the hijacked privileged process reveals itself through abnormal children or
    C2 egress. On detecting EID 8/10 against a critical process, enter a monitoring state for that TargetProcessGUID.
    Alert if within 300s that GUID appears as ParentProcessGUID for a shell spawn (EID 1) or as the source
    of an outbound connection to a non-RFC1918 IP (EID 3 correlated with Zeek conn.log). lsass.exe should
    never have child processes (Red Canary); svchost.exe must be spawned by services.exe (Splunk) - violations
    are critical-severity injection/hijack indicators. Source citations: [Red Canary''s Threat Detection
    Report](https://redcanary.com/threat-detection-report/techniques/process-injection/); [Splunk detection
    research](https://research.splunk.com/endpoint/1d38e5e9-2ff8-4c47-872c-bf1657cefab5/).'
  answer_sources:
  - Windows Event ID 1
  - Windows Event ID 3
  - Windows Event ID 8
  - Windows Event ID 10
  - Zeek conn.log
  - 'NAI: Domain Controllers, Internet Gateway/Egress Points, Core Network Switches, DNS Servers'
  range: Last 90 days; 300-second post-injection monitoring window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=sysmon (EventCode=8 OR EventCode=10) TargetImage IN (\"lsass.exe\",\"svchost.exe\"\
      ,\"services.exe\",\"csrss.exe\")\n| eval watch=TargetProcessGuid\n| join watch [search (EventCode=1\
      \ ParentProcessGuid=watch Image IN (\"cmd.exe\",\"powershell.exe\",\"conhost.exe\"))\n  OR (EventCode=3\
      \ ProcessGuid=watch NOT dest_ip IN RFC1918)]\n| where _time_child - _time_inject < 300\n| eval severity=\"\
      critical\" | table _time, host, TargetImage, child_image, dest_ip"
- question: Did a critical system process exhibit a new child process, a new destination IP/port, an out-of-baseline
    byte volume, a command-line entropy spike (>4.5 bits), or a burst of failed connections (>5 in 60s)
    relative to its 30-day baseline?
  context: 'Injection into a service produces network/process signatures absent from benign baselines
    (Ki et al. 2015). For each critical process name build 30-day baselines of: child process name frequency
    (EID 1), destination IP/port frequency (Zeek conn.log), and bytes sent/received. Alert when a new
    child or destination exceeds the 99.5th percentile. Compute Shannon entropy of child command-lines
    (Red Canary); a spike >4.5 bits indicates obfuscation. Track connection failure rates (NXDOMAIN, RST,
    timeout) - >5 failures in 60s from lsass.exe is highly anomalous (Failure Mode Awareness). Source
    citations: [Ki, Kim, and Kim (2015, IJDSN)](https://journals.sagepub.com/doi/full/10.1155/2015/659101);
    [Red Canary entropy methodology](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).'
  answer_sources:
  - Windows Event ID 1
  - Windows Event ID 3
  - Windows Event ID 8
  - Windows Event ID 10
  - Zeek conn.log
  - 'NAI: Domain Controllers, Internet Gateway/Egress Points, Core Network Switches, DNS Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// baseline per critical process over 30d

      source=sysmon EventCode=1 | stats count by Image, child_image  // child freq

      | append [search zeek conn.log | stats count by proc, dest_ip, dest_port]

      | where new_child OR dest outside perc99_5

      | eval cmd_entropy=shannon(CommandLine)

      | where cmd_entropy>4.5 OR fail_conn_60s>5'
- question: Does a time-series / provenance-graph anomaly model flag post-injection network behavior (byte
    volume, connection frequency, port diversity, inter-connection interval) of a critical system process
    as an anomalous injection->C2 subgraph?
  context: 'APT-scale detection benefits from whole-system provenance graphs. Monitor bytes sent/received,
    connection frequency, destination-port diversity, and inter-connection intervals from Zeek conn.log
    per critical process. Apply temporal graph neural networks with graph autoencoders (KAIROS, IEEE S&P
    2024) over provenance graphs to surface injection->C2 chains as anomalous subgraphs (validated on
    DARPA TC and OpTC). Reduce false positives by marking benign any anomalous port where >20% of fleet
    hosts contact the same destination IP (Akamai). The stateful post-injection rule remains the floor.
    Source citations: [KAIROS (Cheng et al., IEEE S&P 2024)](https://tfjmp.org/publications/2024-sp.pdf);
    [DARPA TC](https://github.com/darpa-i2o/Transparent-Computing/blob/master/README-E3.md); [OpTC](https://github.com/FiveDirections/OpTC-data);
    [Akamai''s network anomaly methodology](https://www.akamai.com/blog/security-research/novel-detection-methodology-process-injection-using-network-anomalies).'
  answer_sources:
  - Windows Event ID 1
  - Windows Event ID 3
  - Windows Event ID 8
  - Windows Event ID 10
  - Zeek conn.log
  - 'NAI: Domain Controllers, Internet Gateway/Egress Points, Core Network Switches, DNS Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = build_provenance_graph(processes, files, sockets, edges=syscalls/conns)\nscore = temporal_gnn_autoencoder.reconstruction_error(G_subgraph(critical_proc))\n\
      if score > threshold and fleet_dest_contact_ratio < 0.20:\n    alert(suspicious_edges=attention_weights(G))\n\
      # stateful post-injection rule remains the floor"
- question: On Linux/macOS, did a non-privileged process invoke ptrace (PTRACE_POKETEXT/POKEDATA), process_vm_writev,
    or open /proc/[pid]/mem against a different higher-privileged PID, or set DYLD_INSERT_LIBRARIES without
    the allow-dyld-environment-variables entitlement?
  context: 'Unix injection abuses ptrace, procfs, and Mach APIs to write into privileged processes. Deploy
    auditd rules (''-a always,exit -F arch=b64 -S ptrace -k process_injection'' and the same for process_vm_writev)
    and alert on PTRACE_POKETEXT/POKEDATA to a different PID and on any open() of /proc/[pid]/mem where
    caller UID != target UID. ptrace and procfs can bypass memory write permissions, writing executable
    regions directly (Akamai). Add eBPF probes (SANS, Barnhart & Lee 2024) for kernel visibility. On macOS
    monitor task_for_pid/mach_vm_write via Endpoint Security and flag DYLD_INSERT_LIBRARIES on processes
    lacking the entitlement. Reference: Aqua Tracee PtraceCodeInjection. Source citations: [Akamai''s
    Definitive Guide to Linux Process Injection](https://www.akamai.com/blog/security-research/the-definitive-guide-to-linux-process-injection);
    [SANS whitepaper (Barnhart & Lee, 2024)](https://www.sans.org/white-papers/run-cannot-hide-process-memory-observing-process-injection-ebpf-linux);
    [Aqua Security Tracee](https://aquasecurity.github.io/tracee/v0.19/docs/events/builtin/signatures/ptrace_code_injection/).'
  answer_sources:
  - auditd:SYSCALL (ptrace, mmap, process_vm_writev)
  - linux:procfs (/proc/[pid]/maps, /proc/[pid]/mem)
  - macos:endpointsecurity (ES_EVENT_TYPE_NOTIFY_EXEC, ES_EVENT_TYPE_NOTIFY_MMAP)
  - 'NAI: Linux Servers, Container Hosts, macOS Developer Workstations, CI/CD Build Nodes'
  range: Last 90 days
  queries:
  - technology: auditd/eBPF pseudocode
    query: '# auditd

      -a always,exit -F arch=b64 -S ptrace -k process_injection

      -a always,exit -F arch=b64 -S process_vm_writev -k process_injection

      # alert: ptrace(PTRACE_POKETEXT|POKEDATA, target_pid!=caller_pid)

      # alert: open(/proc/<pid>/mem) where caller_uid != target_uid

      # macOS: ES_EVENT task_for_pid/mach_vm_write; DYLD_INSERT_LIBRARIES w/o entitlement'
- question: Is a host's daily ptrace, process_vm_writev, task_for_pid, or memfd_create syscall rate a
    statistical outlier (|modified Z| > 3.5) versus its 30-day baseline, given most production servers
    should show zero such cross-process calls outside debuggers?
  context: 'Cross-process memory syscalls are rare on production hosts, so volume outliers are meaningful.
    Build per-host 30-day baselines of ptrace and process_vm_writev rates and apply the modified Z-score,
    alerting on |Z| > 3.5. On macOS baseline task_for_pid per application. Track memfd_create: anonymous
    memory-backed file descriptors are common in fileless injection, so any memfd_create followed by writing
    executable content is anomalous (Akamai). Profile failure rates: EPERM/ESRCH on ptrace indicate probing
    against protected processes. Source citations: [Akamai''s Definitive Guide to Linux Process Injection](https://www.akamai.com/blog/security-research/the-definitive-guide-to-linux-process-injection).'
  answer_sources:
  - auditd:SYSCALL (ptrace, mmap, process_vm_writev)
  - linux:procfs (/proc/[pid]/maps, /proc/[pid]/mem)
  - macos:endpointsecurity (ES_EVENT_TYPE_NOTIFY_EXEC, ES_EVENT_TYPE_NOTIFY_MMAP)
  - 'NAI: Linux Servers, Container Hosts, macOS Developer Workstations, CI/CD Build Nodes'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=auditd syscall IN (ptrace, process_vm_writev, memfd_create)

      | bin _time span=1d | stats count by host, syscall, _time

      | eventstats median(count) as med, <MAD> as mad by host, syscall

      | eval mz=0.6745*(count-med)/mad

      | where abs(mz)>3.5 OR (syscall="memfd_create" AND wrote_exec_content)

      | append [search exit IN (EPERM,ESRCH) syscall=ptrace | stats count by host]'
- question: Does a provenance-graph GNN (GraphSAGE node-level anomaly detection) identify an anomalous
    process->process memory-write edge that is rare in benign host provenance, indicating cross-process
    injection?
  context: 'Injection appears as a process->process memory-write edge that is rare in benign provenance
    graphs. Construct host-level provenance graphs (nodes: processes/files/sockets; edges: syscalls) and
    apply GraphSAGE with neighborhood sampling for node-level anomaly detection (ThreaTrace, Wang et al.
    2022). Train on DARPA TC E3, which contains explicit ptrace-based injection scenarios. The deterministic
    auditd/eBPF rules remain the floor. Emit graph-attention weights identifying the specific suspicious
    edges in the alert output. Source citations: [ThreaTrace (Wang et al., 2022, IEEE TIFS)](https://arxiv.org/pdf/2111.04333);
    [DARPA TC E3 dataset](https://github.com/darpa-i2o/Transparent-Computing/blob/master/README-E3.md).'
