    query: 'source=sysmon EventCode=7

      | where Signed="false" AND (like(ImageLoaded,"C:\\Users\\%") OR like(ImageLoaded,"C:\\ProgramData\\%")
      OR like(ImageLoaded,"C:\\Windows\\Temp\\%"))

      | append [search EventCode=7 Signed="false" Image IN microsoft_signed_binaries]

      | table _time, host, Image, ImageLoaded, Signed, SignatureStatus'
- question: Is a loaded DLL statistically rare across the enterprise fleet (prevalence < 5 hosts or <
    0.1% of fleet over 30 days), and is it also high-entropy (>7.0, indicating packing/encryption)?
  context: 'Real threats are rarely seen; prevalence plus entropy is a powerful stealth-injection signal.
    For each unique DLL hash in EID 7 maintain a 30-day running count of distinct hosts loading it and
    alert below a configured prevalence threshold (<5 hosts or <0.1% of fleet) (F-Secure; Microsoft frequency
    analysis with 16-bucket round-robin). Combine with file entropy: packed/encrypted DLLs with entropy
    >7.2 are predominantly malicious (Lyda & Hamrock 2007). A DLL that is both rare (<5) and high-entropy
    (>7.0) warrants critical-severity alerting. Source citations: [F-Secure prevalence research](https://blog.f-secure.com/whats-the-deal-with-prevalence/);
    [Microsoft''s frequency analysis system](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365);
    [Lyda and Hamrock (2007, IEEE S&P)](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Windows Event ID 7
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=sysmon EventCode=7

      | stats dc(host) as prevalence by ImageLoaded_hash  // 30d window

      | eval entropy=file_entropy(ImageLoaded_hash)

      | where prevalence < 5 OR prevalence < 0.001*fleet_size

      | eval severity=if(prevalence<5 AND entropy>7.0,"critical","high")

      | table _time, host, Image, ImageLoaded, prevalence, entropy'
- question: Does DBSCAN clustering on DLL-load feature vectors mark an EID 7 event as an outlier (cluster
    label = -1), indicating an anomalous DLL load?
  context: 'Density-based clustering isolates rare DLL-load behavior without labels. Apply DBSCAN (eps
    via k-distance plot, min_samples=5) to EID 7 events with feature vector: DLL hash prevalence (log-scaled),
    signed status (binary), file entropy, path depth, path entropy, parent process category (system/user/service),
    and parent integrity level. Outliers (label -1) are anomalous loads to investigate (unsupervised methods
    give high recall - PMC 2024). The unsigned-DLL-from-writable-directory rule remains the floor. Apply
    LIME (Nature Sci Reports 2025) to explain why each outlier was flagged. Source citations: [Isolation
    Forest approaches in PMC (2024)](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/); [Nature Scientific
    Reports (2025)](https://www.nature.com/articles/s41598-025-20445-4).'
