    and memory-address range. Baseline cross-process ALLOCVM_REMOTE per source over 30 days; legitimate
    remote allocations (debuggers) are rare and predictable - alert on any source exceeding 3 remote allocations
    in 60s. A PROTECTVM RW->RX transition without an intermediate file mapping is a strong injection indicator.
    Source citations: [Nasereddin and Al-Qassas (2024, IJIS)](https://link.springer.com/article/10.1007/s10207-024-00836-w).'
