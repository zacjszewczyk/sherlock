- question: Do ETW Threat-Intelligence kernel events show ALLOCVM_REMOTE with PAGE_EXECUTE_READWRITE targeting
    a different process, a PROTECTVM change from RW to RX (write-then-execute), or SETTHREADCONTEXT against
    a suspended thread in another process (process hollowing), including Sysmon EID 25 image-replacement?
  context: 'Advanced injection (direct syscalls, hollowing, manual mapping) bypasses Sysmon and is only
    visible at the kernel via ETW TI. Subscribe to Microsoft-Windows-Threat-Intelligence events: ALLOCVM_REMOTE,
    PROTECTVM, WRITEVM, QUEUEUSERAPC, SETTHREADCONTEXT. Alert on (a) ALLOCVM_REMOTE with PAGE_EXECUTE_READWRITE
    to a different process, (b) PROTECTVM RW->RX, (c) SETTHREADCONTEXT targeting a suspended thread in
    another process (hollowing). Enrich with call-stack analysis flags: direct_syscall (syscall outside
    ntdll.dll), shellcode (execution from non-image-backed memory), hollow_image (Elastic). Sysmon EID
    25 (Process Tampering, Image is replaced) gives complementary hollowing detection (Wazuh). Reference:
    SealighterTI. Source citations: [Elastic Security Labs (2024)](https://www.elastic.co/security-labs/doubling-down-etw-callstacks);
    [SealighterTI](https://github.com/pathtofile/SealighterTI); [Wazuh integration](https://wazuh.com/blog/detecting-process-injection-attacks-with-wazuh/).'
  answer_sources:
