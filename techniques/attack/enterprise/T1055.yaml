- question: After an injection event (EID 10/8) targeted a normally-silent process, does an autoencoder
    baselined on its zero/minimal activity produce a high reconstruction error when that process subsequently
    makes network connections or spawns children?
  context: 'A state change from ''no activity'' to ''any activity'' for a normally-silent process is itself
    the signal. After EID 10/8 targets a process, activate a monitoring state for that TargetProcessGUID
    and feed subsequent EID 3 (network) and EID 1 (child) events into a pre-trained autoencoder baselined
    on zero/minimal activity for that process type; any new activity yields high reconstruction error
    (KAIROS temporal graph autoencoders, IEEE S&P 2024). The static blocklist rule remains the floor.
    Alert output must include injector process name, injection timestamp, network destination IP/port,
    bytes transferred, and time elapsed between injection and first network activity. Source citations:
    [KAIROS (Cheng et al., IEEE S&P 2024)](https://tfjmp.org/publications/2024-sp.pdf).'
