    normally make. Maintain a static blocklist of process names that should never initiate connections
    and alert on any matching EID 3 outbound connection (Akamai network-anomaly methodology). Also flag
    processes with zero-length or absent command-line arguments making connections, since shellcode-injected
    processes often lack their original arguments (Splunk). A positive result strongly indicates code
    injected into a benign host process is beaconing. Source citations: [Akamai''s network anomaly detection
    methodology](https://www.akamai.com/blog/security-research/novel-detection-methodology-process-injection-using-network-anomalies);
    [Splunk detection](https://research.splunk.com/endpoint/54fa06c5-96a2-4406-a4a7-44d93ddbd173/).'
