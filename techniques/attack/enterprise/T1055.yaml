- question: Did a process load an unsigned DLL (Sysmon EID 7 Signed=false) from a user-writable directory
    (C:\Users\*, C:\ProgramData\*, C:\Windows\Temp\*), or did a signed Microsoft binary load an unsigned
    DLL (sideloading)?
  context: 'DLL search-order abuse and sideloading hide malicious code inside trusted processes. Monitor
    EID 7 (Image Loaded) and alert when Signed=false AND ImageLoaded path is user-writable (CrowdStrike).
    Additionally alert when Signed=false and the loading Image is a signed Microsoft binary - a strong
    sideloading indicator. Scan flagged DLLs in memory for injection-API import chains (YARA Unprotect).
    A positive result is suspicious masking; benign software occasionally ships unsigned DLLs, so corroborate
    with prevalence and path context. Source citations: [CrowdStrike''s DLL hijacking research](https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/);
    [YARA Unprotect Project](https://github.com/fr0gger/Yara-Unprotect/blob/master/Detect_InjectCode_Unprotect.yar).'
