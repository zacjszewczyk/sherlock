    mean zero connections/hour makes >=1 outbound connection. For processes with existing baselines apply
    EWMA (lambda=0.2) and alert above 3-sigma. Reduce false positives by exempting anomalous port/destination
    pairs where >20% of fleet hosts contact the same IP (Akamai). Any C2 callback must move packets -
    monitor bytes_out and flag connections >1KB from normally-silent processes (Physics of the Attack).
    Source citations: [Akamai](https://www.akamai.com/blog/security-research/novel-detection-methodology-process-injection-using-network-anomalies).'
