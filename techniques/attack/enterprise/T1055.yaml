      \ labels[e]==-1: alert(explain=lime(X[e]))\n# unsigned-DLL-from-writable-dir rule remains the floor"
- question: Did a critical system process (e.g. svchost.exe, explorer.exe) load a DLL from a path NOT
    on its per-process allowlist of standard load directories, or load a DLL with an Expired/Revoked signature?
  context: 'Trusted processes loading DLLs from non-standard paths is a hallmark of stealthy injection/sideloading.
    Maintain explicit per-process allowlists of standard DLL directories (svchost.exe -> System32, SysWOW64;
    explorer.exe -> Windows, System32) and alert via EID 7 when a critical process loads a DLL from a
    path off its allowlist. Validate parent chains too (svchost.exe must be spawned by services.exe -
    Elastic). Combine with SignatureStatus: DLLs with Expired or Revoked signatures loaded into system
    processes are high-severity (TrustedSec). Source citations: [Elastic''s Unusual Parent-Child Relationship
    rule](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/);
    [TrustedSec Sysmon Guide](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md).'
