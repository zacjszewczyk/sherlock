- question: Is a DLL being loaded from a directory outside the top-99% baseline of load directories for
    that parent process, with special attention to svchost.exe and explorer.exe?
  context: 'Path-deviation analysis targets the most-injected processes. For each parent process Image
    in EID 7, build a 30-day frequency distribution of ImageLoaded directories and identify the top 99%.
    Alert when a DLL loads from a directory outside this baseline. svchost.exe and explorer.exe are the
    most targeted (48.3% and 33.2% - Di Pietro et al. 2025), so path deviation is especially high-value
    there. Compute the ratio of new-path loads to total loads per process per day; a ratio >1% warrants
    investigation. Source citations: [Di Pietro et al. (2025, ACM Asia CCS)](https://dl.acm.org/doi/10.1145/3708821.3736206).'
