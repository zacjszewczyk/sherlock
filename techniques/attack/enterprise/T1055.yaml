- question: Does a per-process One-Class SVM trained on normal DLL-load path features flag a load as falling
    outside the learned boundary of normal load paths?
  context: 'OC-SVM learns the manifold of normal load paths per process type and flags deviations. Train
    an OC-SVM (nu=0.01, RBF kernel) per critical process on features from the DLL load path: directory
    depth, directory-name character 2/3-grams, path entropy, presence of user-profile path components,
    and file extension (Nature Sci Reports 2025, OC-SVM + Isolation Forest). New loads outside the boundary
    are flagged. The allowlist rule remains the floor. Emit feature importance in the alert showing which
    path components drove the anomaly score (Basheer et al. 2024). Source citations: [Nature Scientific
    Reports (2025)](https://www.nature.com/articles/s41598-025-20445-4); [Basheer et al. (2024, Springer
    AIAI)](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9).'
