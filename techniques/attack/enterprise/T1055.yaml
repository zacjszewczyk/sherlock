name: 'T1055: Process Injection'
id: 07a30ed1-9cab-4317-833a-c05398982453
description: 'Investigate suspected process injection (MITRE ATT&CK T1055), in which an adversary executes
  arbitrary code inside the address space of a separate live process to evade process-based defenses and/or
  elevate privileges. This playbook supports two mission questions: whether an adversary is ELEVATING
  PRIVILEGES via injection (a lower-integrity or anomalous-provenance process writing memory into and
  creating remote threads in a higher-privileged target such as lsass.exe, services.exe, or svchost.exe;
  ptrace/process_vm_writev/task_for_pid abuse on Linux/macOS), and whether an adversary is MAINTAINING
  STEALTH via injection (named-pipe IPC between injected modules, unsigned or rare DLL loads, trusted
  processes loading DLLs from non-standard paths, normally-silent processes suddenly making network connections,
  and kernel-level allocate-write-execute chains visible only through ETW Threat-Intelligence). For each
  behavior the playbook pairs a deterministic symbolic-logic detection (the floor), a statistical baseline
  method, and a machine-learning approach, spanning Windows (Sysmon/ETW), Linux (auditd/eBPF/procfs),
  and macOS (Endpoint Security) endpoints plus Zeek network telemetry.'
type: technique
