- question: Does a named pipe's name exhibit anomalous Shannon entropy (>4.5, above the 99th percentile)
    or high KL divergence from known-good pipe-name character distributions, or is a process creating
    >5 unique pipes in 60 seconds?
  context: 'Algorithmically generated pipe names look statistically different from human-readable ones.
    For all PipeName values from EID 17/18 compute Shannon entropy H(X) = -sum p(x) log2 p(x); legitimate
    human-readable names are typically 2.5-3.5. Apply KL divergence of observed character distribution
    vs a known-good baseline for cleaner separation than raw entropy (Red Canary). Alert above the 99th-percentile
    entropy threshold (~>4.5). Also track creation volume: >5 unique pipes by one process in 60s is anomalous
    regardless of name (Physics of the Attack). Track failed pipe connections (STATUS_PIPE_NOT_AVAILABLE)
    as a probing signal. Source citations: [Red Canary entropy research](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).'
  answer_sources:
