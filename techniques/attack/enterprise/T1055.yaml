  - technology: SIEM/Stats pseudocode
    query: 'source=sysmon (EventCode=17 OR EventCode=18)

      | eval entropy=shannon(PipeName), kl=kldiv(charfreq(PipeName), baseline_charfreq)

      | where entropy>4.5 OR kl>kl_threshold

      | append [search EventCode=17 | bin _time span=60s | stats dc(PipeName) as p by Image,_time | where
      p>5]

      | append [search EventCode=18 status="STATUS_PIPE_NOT_AVAILABLE" | stats count by Image]'
- question: Does a character-level CNN classifier label a pipe name as malicious based on its character
