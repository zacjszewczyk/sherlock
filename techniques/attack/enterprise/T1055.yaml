    CNN (embedding -> Conv1D filters [3,4,5] -> max-pool -> dense -> sigmoid) on legitimate enterprise
    pipe names plus known malicious names from C2 framework docs (EarlyMalDetect 2024). Features: character
    embeddings of PipeName, length, alpha/numeric/hex character-class ratios, and Shannon entropy. The
    deterministic pattern-matching rule remains the floor. Apply SHAP text explanations (PeerJ CS 2025)
    to highlight which character subsequences drove classification. Source citations: [EarlyMalDetect
    (2024, arXiv:2407.13355)](https://arxiv.org/html/2407.13355v1); [PeerJ CS (2025)](https://peerj.com/articles/cs-3258/).'
