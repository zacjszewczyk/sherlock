- question: '[Defense Impairment] Flag rare parent processes: Can you determine whether a suspicious process
    or account executes permission-management utilities to weaken file or directory access controls on
    sensitive assets, consistent with adversary efforts to evade protections or prepare follow-on malicious
    actions. -- specifically, using the ''Flag rare parent processes'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary modifies file
    or directory permissions, attributes, or ACLs to evade access controls and reach protected resources,
    often as a precursor to persistence, tampering with security tooling, or follow-on file modification/execution.
