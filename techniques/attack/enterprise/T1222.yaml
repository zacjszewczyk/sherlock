    efforts to evade protections or prepare follow-on malicious actions. This Statistical Method approach
    looks for the following signal: For utilities like icacls, cacls, takeown, chmod, chattr, and fsutil,
    track parent process frequency over a 30-day window and alert when a launch falls into the bottom
    5th percentile, signaling an atypical parent; score the joint (parent, user, hour, target-dir) rarity
