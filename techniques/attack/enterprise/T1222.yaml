questions:
- question: '[Defense Impairment] Correlate permission utility execution with ACL changes: Can you determine
    whether a suspicious process or account executes permission-management utilities to weaken file or
    directory access controls on sensitive assets, consistent with adversary efforts to evade protections
    or prepare follow-on malicious actions. -- specifically, using the ''Correlate permission utility
    execution with ACL changes'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary modifies file
    or directory permissions, attributes, or ACLs to evade access controls and reach protected resources,
    often as a precursor to persistence, tampering with security tooling, or follow-on file modification/execution.
    This evidence focuses on the condition that a suspicious process or account executes permission-management
    utilities to weaken file or directory access controls on sensitive assets, consistent with adversary
    efforts to evade protections or prepare follow-on malicious actions. This Symbolic Logic approach
    looks for the following signal: Join Windows Event ID 4688 entries for permission utilities (icacls,
    cacls, takeown, attrib, fsutil; Linux chmod/chown/setfacl/chattr) with Windows Event ID 4670 ACL changes
    and Windows Event ID 4663 object access on protected paths within five minutes, alerting when the
    same user or process lineage weakens access controls on sensitive assets. Confirm the actual mode/ownership/attribute
    change with file-integrity who-data ([File Integrity Monitoring, Wazuh](https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html)).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a user or process
    is weakening or abusing permissions on sensitive objects in a way that deviates from sanctioned administration;
    pivot to the responsible account, the process lineage, the targeted object/path, the before/after
    ACL or mode state, and any follow-on file write or execution. A negative result helps rule out this
    permission-modification vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, living-off-the-land, or slow-and-low permission abuse. The
    relevant information requirement: Has the adversary modified file or directory permissions to evade
    defenses and access protected resources? (PIR)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4670
  - Windows Event ID 4663
  - 'NAI: Domain Controllers, Critical Application Servers (e.g., SharePoint, SAP), Endpoint devices of
    privileged users (e.g., Domain Admins, Developers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Correlate permission utility execution with ACL changes

      source IN [Windows Event ID 4688, Windows Event ID 4670, Windows Event ID 4663]

      | WHERE matches_action_criteria("Correlate permission utility execution with ACL changes")

      // Join Windows Event ID 4688 entries for permission utilities (icacls, cacls, takeown, attrib,
      fsutil; Linux chmod/chown/setfacl/chattr) with Windows Event ID 4670 ACL changes and Windows Event
      ID 4663 object access on protected paths within five minutes, alerting when the same user or process
      lineage weakens access controls on sensitive assets. Confirm the actual mode/ownership/attribute
      change with file-integrity who-data .

      | CORRELATE by (user, process_lineage, target_object) within window

      | ALERT enrich(host, user, process, parent, object, acl_before_after)'
