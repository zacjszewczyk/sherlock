- question: '[Defense Impairment] Regex high-risk permission command lines: Can you determine whether
    a command-line execution of a permission utility (icacls.exe, cacls.exe, chmod, chown, fsutil.exe)
    includes arguments that grant broad permissions, such as Full Control (:F) to ''Everyone'' or ''Authenticated
    Users'', or read/write/execute for all (777) on a sensitive file or directory. -- specifically, using
    the ''Regex high-risk permission command lines'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary modifies file
    or directory permissions, attributes, or ACLs to evade access controls and reach protected resources,
    often as a precursor to persistence, tampering with security tooling, or follow-on file modification/execution.
    This evidence focuses on the condition that a command-line execution of a permission utility (icacls.exe,
    cacls.exe, chmod, chown, fsutil.exe) includes arguments that grant broad permissions, such as Full
    Control (:F) to ''Everyone'' or ''Authenticated Users'', or read/write/execute for all (777) on a
    sensitive file or directory. This Symbolic Logic approach looks for the following signal: Apply regex
    rules on Windows Event ID 4688 and PowerShell script block logs (Windows Event ID 4104) to detect
    permission commands granting Everyone/Authenticated Users (`/grant *S-1-1-0:F`), deny/hide (`/deny
    *S-1-1-0:`), or mode 777, raising severity for critical directories ([Use Icacls to Hide File to Everyone,
    SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_icacls_deny/));
    on Linux include `chmod 777/+s`, `chown`, `setfacl -m`, and `chattr -i` ([Remove Immutable File Attribute,
    SigmaHQ](https://detection.fyi/sigmahq/sigma/linux/process_creation/proc_creation_lnx_chattr_immutable_removal/)).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a user or process
