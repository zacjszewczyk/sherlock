name: 'T1222: File and Directory Permissions Modification'
id: 4aab95ae-9fb6-41cd-bb22-edddb7ca0ce5
description: 'This playbook helps an analyst investigate whether an adversary has modified file or directory
  permissions, attributes, ACLs, or symbolic links to evade access controls and reach protected resources
  as part of the Defense Impairment tactic, across Windows, Linux, macOS, and ESXi. It guides the hunt
  across several behavioral angles: execution of permission-management utilities (icacls, cacls, takeown,
  attrib, fsutil on Windows; chmod, chown, setfacl, chattr on Linux; chmod/chown/chflags/xattr on macOS)
  correlated with the resulting ACL/mode/ownership changes and follow-on object access; command lines
  that grant broad rights (Full Control to Everyone/Authenticated Users, mode 777, +s, immutable-flag
  removal) or hide/deny access on sensitive paths; DACL modification events (Windows Event ID 4670) on
  critical files, registry keys, GPOs, and security-tool binaries initiated by non-standard accounts or
  processes; and rapid permission-relax then write-or-execute chains indicating successful privilege bypass.
  Detection methods combine symbolic-logic correlation rules, statistical baselining/forecasting (rarity
  scoring, entropy, velocity, failed-attempt profiling, isolation forests, seasonal forecasts), and machine-learning
  models (supervised classifiers, sequence/log models such as DeepLog, embeddings, and provenance-graph
  learning) applied to Windows Security/Sysmon/PowerShell events, Linux auditd, macOS unified/fsevents
  logs, ESXi shell/hostd/vpxd logs, and Zeek SMB telemetry, so the analyst can corroborate suspected permission
  abuse against process lineage, account context, object sensitivity, and follow-on activity.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
