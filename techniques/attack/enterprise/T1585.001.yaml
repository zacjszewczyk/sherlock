name: 'T1585.001: Social Media Accounts'
id: 5f7f82c3-dc7a-4422-a245-020ef4c0ad4a
description: 'This playbook helps an analyst investigate whether an adversary is developing social media
  resources -- fictitious or impersonating personas across platforms such as LinkedIn, Twitter/X, and
  Facebook -- to support targeting of the organization or its personnel (MITRE ATT&CK T1585.001, Social
  Media Accounts, under Resource Development). Adversaries cultivate these accounts to build credibility,
  connect to employees, and later enable initial access such as Spearphishing via Service. The hunt pursues
  the behavior from several complementary angles: matching impersonating profile artifacts (URLs, handles,
  emails) against cyber threat intelligence; scoring typosquatting, homoglyph, and lookalike handles against
  protected brand and employee strings; detecting clusters of inauthentic profiles that share biography
  text, profile images, or programmatic naming conventions; classifying suspect profiles and behavioral
  fingerprints with machine learning; identifying endpoint browser-automation and scripting tools that
  drive social-media domains; profiling internal network egress for high-frequency, low-jitter automated
  connections to social-media API endpoints; flagging newly created external accounts that fan out connection
  requests across many employees or high-value targets; and detecting synchronized, coordinated behavior
  across a cluster of accounts. Detection methods combine deterministic symbolic-logic rules (CTI exact-match,
  perceptual-hash and homoglyph matching, watchlisted API endpoints, shared-artifact coordination floors),
  statistical baselining (edit-distance scoring, textual similarity and entropy, inter-arrival jitter,
  fan-out frequency, synchronized-posting cross-correlation), and machine learning (Random Forest profile
  classifiers, Digital-DNA behavioral fingerprinting, LDA topic modeling, process-chain decision trees,
  ARIMA/Prophet byte forecasting, SybilRank-style graph ranking, and Node2Vec/DBSCAN cluster detection).
  It draws on external social-media and brand-monitoring data, threat-intelligence feeds, Zeek conn/dns/http
  logs, Windows Event ID 4688 and Sysmon Event ID 1 process telemetry, API gateway logs, and employee-reported
  contact attempts so the analyst can corroborate suspected persona development from multiple independent
  vantage points.'
type: technique
