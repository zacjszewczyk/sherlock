questions:
- question: '[Resource Development] Match impersonators to CTI: Can you determine whether A social media
    profile impersonating the organization or an employee contains a URL, email address, or username that
    is an exact match for an indicator in a Cyber Threat Intelligence (CTI) feed of known-malicious infrastructure.
    -- specifically, using the ''Match impersonators to CTI'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary creates and
    cultivates social media accounts -- fictitious or impersonating real people -- to build personas,
    connect to targets of interest, and stage later phases such as Initial Access via Spearphishing. This
    evidence focuses on the condition that A social media profile impersonating the organization or an
    employee contains a URL, email address, or username that is an exact match for an indicator in a Cyber
    Threat Intelligence (CTI) feed of known-malicious infrastructure. This Symbolic Logic approach works
    as follows: Ingest threat-intelligence feeds of malicious URLs/handles/emails and correlate (exact
    match) against discovered social-media profile metadata from brand monitoring or first-party web/proxy
    logs. Alert on any exact match; this is the deterministic floor that catches known infrastructure
    ([The Rise of Social Bots](https://arxiv.org/abs/1407.5225)). A positive result -- an exact match,
    a statistical outlier, or a model alert -- indicates a likely adversary-controlled persona or automated
    social-media tradecraft targeting the organization; pivot to the suspect profile''s metadata, linked
    domains and infrastructure, the internal host or user involved, the set of employees or high-value
    targets contacted, and any related profiles in the same cluster to scope the campaign and warn affected
    personnel. A negative result helps reduce suspicion for this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss well-aged, hand-curated,
    or low-and-slow personas.'
