questions:
- question: '[Credential Access] Match spoofed name replies: Can you determine whether a host generates
    LLMNR or NBT-NS poisoning traffic on UDP 5355/137, and the same source subsequently receives NTLM
    challenge traffic or failed authentication attempts from multiple clients, indicating name-resolution
    spoofing rather than a normal broadcast response. -- specifically, using the ''Match spoofed name
    replies'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic, this is part of LLMNR/NBT-NS/mDNS poisoning
    and NTLM/SMB relay (T1557.001), an adversary-in-the-middle technique used to spoof local name resolution,
    capture NTLM authentication material, and relay it to internal services. This evidence focuses on
    the condition that a host generates LLMNR or NBT-NS poisoning traffic on UDP 5355/137, and the same
    source subsequently receives NTLM challenge traffic or failed authentication attempts from multiple
    clients, indicating name-resolution spoofing rather than a normal broadcast response. The Symbolic
    Logic approach works as follows: Alert when a host that is not an approved resolver or domain controller
    sends an affirmative unicast LLMNR (UDP 5355), NBT-NS (UDP 137), or mDNS (UDP 5353) answer for a name
    it does not own, which violates the owner-only response model of [RFC 4795](https://www.rfc-editor.org/rfc/rfc4795.txt)
    and [RFC 6762](https://www.rfc-editor.org/rfc/rfc6762.txt) and matches the poisoning behavior described
    in [MITRE ATT&CK T1557.001](https://attack.mitre.org/techniques/T1557/001/). A positive result --
    a rule match, statistical outlier, or model alert -- indicates probable name-resolution poisoning
    or relay activity; pivot to the responsible source host and its process lineage, the spoofed names
    and victim clients, the captured or relayed user accounts, the destination services authenticated
    to, and any subsequent SMB/file-share collection. A negative result helps rule out this particular
    detection angle but should be corroborated with the other questions in this playbook, since a single
    method can miss stealthy or low-and-slow poisoning and relay activity.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ntlm.log
  - Windows Event ID 4625
  - Windows Event ID 4776
  - 'NAI: User workstations, member servers, IT administrator jump boxes, and any endpoint on a local
    network segment where LLMNR/NBT-NS traffic is present.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from dns.log, conn.log where dst_port in (5355,137,5353) and is_response=true

      and src_ip not in approved_resolvers and answered_name not owned_by(src_ip)

      -> alert ''spoofed name reply / poisoning'''
  - technology: SIEM/Rule pseudocode
    query: 'index=nsm (port=5355 OR port=137 OR port=5353) response=affirmative

      | where NOT src_ip IN approved_resolvers AND name_owner!=src_ip

      | table _time src_ip name client_ip'
- question: '[Credential Access] Active name-resolution probe: Can you determine whether a host generates
    LLMNR or NBT-NS poisoning traffic on UDP 5355/137, and the same source subsequently receives NTLM
    challenge traffic or failed authentication attempts from multiple clients, indicating name-resolution
    spoofing rather than a normal broadcast response. -- specifically, using the ''Active name-resolution
    probe'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic, this is part of LLMNR/NBT-NS/mDNS poisoning
    and NTLM/SMB relay (T1557.001), an adversary-in-the-middle technique used to spoof local name resolution,
    capture NTLM authentication material, and relay it to internal services. This evidence focuses on
    the condition that a host generates LLMNR or NBT-NS poisoning traffic on UDP 5355/137, and the same
    source subsequently receives NTLM challenge traffic or failed authentication attempts from multiple
    clients, indicating name-resolution spoofing rather than a normal broadcast response. The Symbolic
    Logic approach works as follows: Periodically inject an LLMNR/NBT-NS/mDNS query for a guaranteed-nonexistent
    random hostname and treat ANY authoritative reply as a poisoner, applying the near-zero-false-positive
    active-verification handshake of [Barbhuiya et al. active host-based ARP IDS](https://arxiv.org/abs/1306.1332)
    to local name resolution. A positive result -- a rule match, statistical outlier, or model alert --
    indicates probable name-resolution poisoning or relay activity; pivot to the responsible source host
    and its process lineage, the spoofed names and victim clients, the captured or relayed user accounts,
    the destination services authenticated to, and any subsequent SMB/file-share collection. A negative
    result helps rule out this particular detection angle but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy or low-and-slow poisoning and relay activity.'
