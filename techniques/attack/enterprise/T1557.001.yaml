name: 'T1557.001: LLMNR-NBT-NS Poisoning and SMB Relay'
id: 453f87ef-0ded-42d9-99a8-2c82b93348c4
description: 'This playbook helps an analyst investigate LLMNR, NBT-NS, and mDNS name-resolution poisoning
  combined with NTLM/SMB relay (MITRE ATT&CK T1557.001) -- an adversary-in-the-middle technique an attacker
  uses to spoof an authoritative name resolver on a local network segment, coerce victims into authenticating
  to an attacker-controlled host, and capture or relay NTLMv1/v2 authentication material. It spans two
  adversary objectives. Under Credential Access (TA0006) it guides the analyst to detect a host that answers
  LLMNR (UDP 5355), NBT-NS (UDP 137), or mDNS (UDP 5353) queries for names it does not own, floods many
  distinct subnet hosts with spoofed replies, and triggers bursts of failed NTLM network logons (Windows
  Event 4625/4776 status 0xC000006A) consistent with captured or sprayed credentials. Under Collection
  (TA0009) it follows the attack downstream: poisoning hosts that spawn relay tooling (ntlmrelayx, Responder,
  Inveigh) and relay NTLM into SMB/LDAP/MSSQL/HTTP, suspicious Windows service installs (Event 7045) and
  registry re-enabling of EnableMulticast, anomalous successful NTLM logons (Event 4624 Type 3) from unexpected
  source workstations, and post-relay SMB collection marked by unusually broad file-share reads or large
  data transfers. Each question pairs symbolic-logic rules, statistical baselining, and machine-learning
  approaches across Zeek network telemetry (dns, conn, ntlm, smb, files logs), Windows Security events,
  and Sysmon process/registry logs so the analyst can corroborate spoofing, relay, and collection from
  complementary angles.'
type: technique
