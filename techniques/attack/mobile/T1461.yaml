questions:
- question: Is there a single source IP, confirmed to belong to a mobile device, that produced five or
    more failed corporate authentications (Event ID 4625) for one account and then succeeded (Event ID
    4624) for that same account within five minutes?
  context: 'Under the Initial Access tactic, this is the clearest deterministic signal that an adversary
    brute-forced or shoulder-surfed a lockscreen passcode and is now using the unlocked device against
    corporate logon. Build a correlation rule that fires when, for one source IpAddress and TargetUserName,
    the count of 4625 events exceeds 4 within a 10-minute window and is followed by a 4624 from the same
    IpAddress and TargetUserName within 5 minutes of the last failure, then enrich with MDM/VPN logs to
    confirm the IP was assigned to a mobile device at event time. OS unlock throttling bounds on-device
    guessing to roughly 10/30/100 attempts, so a high-volume failed-then-success burst strongly suggests
    brute-force or observed-passcode bypass ([This PIN Can Be Easily Guessed, Markert et al.](https://arxiv.org/abs/2003.04868));
    recovering Android pattern unlocks from screen residue similarly motivates limited attempt budgets
    ([Smudge Attacks, Aviv et al.](https://www.usenix.org/legacy/event/woot10/tech/full_papers/Aviv.pdf)).
    A positive result (burst plus success plus mobile attribution) should produce a medium-severity alert
    that surfaces the top-3 contributors: failed-attempt count, time-to-success, and source ASN/geolocation.
    A negative result means no such failure-to-success chain tied to a mobile device exists in the window.'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - MDM/UEM logs
  - VPN logs
  - IdP logs
  - 'NAI: Authentication Servers (e.g., Active Directory Domain Controllers), VPN Concentrators, Cloud
    Identity Providers (e.g., Azure AD, Okta), Internet Gateway, MDM/UEM solution logs.'
  range: Last 90 days, with 10-minute failure windows and a 5-minute failure-to-success correlation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: GROUP auth BY source_ip,target_user,10m; ALERT when count(EventID=4625)>4 AND a succeeding
      EventID=4624 from same source_ip+target_user occurs within 5m of last failure; ENRICH source_ip
      WITH mdm/vpn session => confirm device_type='mobile'; OUTPUT failed_count, time_to_success, source_asn,
      geo.
- question: For each correlated mobile failure-to-success login, is the login hour outside the user's
    normal range AND is the source country or ASN new for that user over the last 90 days?
  context: This statistical enrichment escalates the symbolic alert by testing whether the successful
    login deviates from the user's established Initial Access baseline. Enrich the source IpAddress using
    Zeek conn.log for geolocation and ASN, then profile the TargetUserName over 90 days for login hour-of-day,
    source country, and source ASN. Compute whether the new login's hour falls outside the user's 5th-95th
    percentile range and whether the country or ASN is first-seen for that user. If the login time is
    anomalous AND either the country or ASN is new, escalate severity to High. A positive result indicates
    the access does not fit the user's normal pattern and strengthens the case for compromise; a negative
    result suggests the login, while preceded by failures, may be a legitimate user struggling with their
    passcode.
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - MDM/UEM logs
  - VPN logs
  - IdP logs
  - 'NAI: Authentication Servers (e.g., Active Directory Domain Controllers), VPN Concentrators, Cloud
    Identity Providers (e.g., Azure AD, Okta), Internet Gateway, MDM/UEM solution logs.'
  range: Last 90 days, with rolling 90-day per-user baselines centered on the correlated login event.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline user over 90d for login_hour (p5-p95), source_country set, source_asn set; FOR each
      correlated success: hour_anomalous = hour NOT IN [p5,p95]; new_geo = country NOT IN seen OR asn
      NOT IN seen; ALERT severity=High when hour_anomalous AND new_geo; OUTPUT hour, country, asn, baseline.'
- question: Does a per-user anomaly-detection model score any mobile failure-to-success login in the top
    1% of that user's historical login patterns?
  context: 'This machine-learning step catches compromise where no single field is decisive but the combination
    is improbable for the specific account, supporting the Initial Access investigation. Feed successful
    login events that triggered the symbolic alert into a user-centric anomaly model (Isolation Forest
    or One-Class SVM) with features: hour of day, day of week, source ASN, source country, and device
    OS from MDM. If the model assigns an anomaly score in the top 1% for that user, classify the event
    as Highly Suspicious and initiate an automated response such as MFA re-authentication or session termination.
    A positive result means the login is a strong outlier for that user and warrants containment; a negative
    result means it fits the learned profile despite the preceding failures.'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - MDM/UEM logs
  - VPN logs
  - IdP logs
  - 'NAI: Authentication Servers (e.g., Active Directory Domain Controllers), VPN Concentrators, Cloud
    Identity Providers (e.g., Azure AD, Okta), Internet Gateway, MDM/UEM solution logs.'
  range: Last 90 days for per-user model training, with live scoring of new correlated logins.
  queries:
  - technology: ML pipeline pseudocode
    query: features=[hour_of_day, day_of_week, source_asn, source_country, device_os]; score=user_anomaly_model.predict(features);
      IF score in top_1pct for user THEN classify='Highly Suspicious' AND trigger mfa_reauth or session_terminate;
      OUTPUT anomaly_score, contributing_features.
- question: Is any IP confirmed to belong to a mobile device connecting to internal assets on a restricted-assets
    watchlist, or communicating with self-signed or otherwise invalid TLS certificates?
  context: After a lockscreen bypass grants Initial Access, an adversary often pivots from the device
    toward sensitive internal systems or attacker-controlled infrastructure. Create a SIEM rule that joins
    VPN/MDM logs with Zeek logs and alerts when a mobile-assigned IP connects to an internal IP on the
    Restricted Assets watchlist OR uses a TLS certificate whose Zeek ssl.log validation_status is 'self_signed'
    or 'unable_to_get_local_issuer'. Suppress only if the associated user is in a pre-authorized access
    group for that specific asset. A positive result indicates the compromised device is reaching data
    it should not, or talking to suspicious endpoints; a negative result means no restricted-asset or
    bad-cert contact occurred from mobile devices in the window.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - MDM/UEM logs
  - VPN logs
  - 'NAI: Internal network segments (especially those housing sensitive data like developer environments
    or financial systems), Corporate Wi-Fi access points, VPN termination points, DNS resolvers, Egress
    points to the internet.'
  range: Last 90 days, prioritizing connections from mobile-attributed IPs to restricted assets.
  queries:
  - technology: SIEM/Rule pseudocode
    query: JOIN vpn/mdm (device_type='mobile') TO zeek_conn/ssl ON ip; ALERT when dst_ip IN restricted_assets_watchlist
      OR ssl.validation_status IN ['self_signed', 'unable_to_get_local_issuer']; SUPPRESS if user IN preauthorized_group(asset);
      OUTPUT user, ip, dst, cert_status.
- question: Do mobile-device IPs show DNS entropy spikes, outbound byte volumes, or HTTP User-Agent strings
    that deviate sharply from their own 30-day baseline?
  context: 'Statistical baselining per device surfaces the network side-effects of post-bypass tooling,
    exfiltration staging, or C2 during the Initial Access phase. For each mobile device IP, build a 30-day
    rolling baseline and alert when: (a) the Shannon entropy of requested DNS domains in a 5-minute window
    exceeds 3 standard deviations above the device''s mean (DGA-like behavior); (b) total orig_bytes in
    a single external connection exceeds the device''s 99th percentile of historical outbound sizes; or
    (c) the HTTP User-Agent is not among the device''s 20 most common over 30 days. A positive result
    on any condition flags abnormal device behavior worth correlating with a suspected bypass; a negative
    result indicates the device''s traffic remains within its normal envelope.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - MDM/UEM logs
  - VPN logs
  - 'NAI: Internal network segments (especially those housing sensitive data like developer environments
    or financial systems), Corporate Wi-Fi access points, VPN termination points, DNS resolvers, Egress
    points to the internet.'
  range: Last 90 days, with 30-day rolling per-device baselines and 5-minute DNS windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline per mobile_ip over 30d for dns_entropy_mean/sd, outbound_bytes_p99, top20_user_agents;
      ALERT when dns_entropy_5m>mean+3sd OR conn.orig_bytes>p99 OR http.user_agent NOT IN top20; OUTPUT
      ip, metric, value, baseline.
- question: Does a graph model of device-to-server communication flag any new connection edge from a mobile
    device as highly improbable given learned normal patterns?
  context: A graph neural network captures structural relationships that simple thresholds miss, helping
    detect lateral movement from a bypassed device during Initial Access. Model devices and internal servers
    as nodes and connections as edges, feed Zeek conn.log in near real-time, and generate an anomaly score
    for each new edge; connections highly improbable against the learned graph structure trigger an alert.
    A positive result means a mobile device is talking to a server it (and similar devices) never normally
    contact, consistent with pivoting; a negative result means the connection fits established communication
    structure.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - MDM/UEM logs
  - VPN logs
  - 'NAI: Internal network segments (especially those housing sensitive data like developer environments
    or financial systems), Corporate Wi-Fi access points, VPN termination points, DNS resolvers, Egress
    points to the internet.'
  range: Last 90 days for graph training, with near-real-time scoring of new connection edges.
  queries:
  - technology: ML pipeline pseudocode
    query: 'build graph(nodes=devices+servers, edges=conn.log); train GNN on normal edges; FOR each new
      edge: score=gnn.anomaly(edge); ALERT when score>threshold (improbable); OUTPUT src_device, dst_server,
      score.'
- question: Does a SARIMA forecast of per-device outbound data volume show the actual hourly volume exceeding
    the 99% prediction interval, especially after suspicious mobile access?
  context: Time-series forecasting detects exfiltration-scale transfers that follow a lockscreen-bypass
    Initial Access event. Use a Seasonal-ARIMA model to forecast expected outbound data volume per device
    per hour and trigger an alert when actual volume exceeds the model's 99% prediction interval, weighting
    alerts that follow suspicious mobile-device access. A positive result indicates an unexpected volume
    spike consistent with data staging or exfiltration from the device; a negative result means outbound
    volume stayed within the expected seasonal range.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - MDM/UEM logs
  - VPN logs
  - 'NAI: Internal network segments (especially those housing sensitive data like developer environments
    or financial systems), Corporate Wi-Fi access points, VPN termination points, DNS resolvers, Egress
    points to the internet.'
  range: Last 90 days for SARIMA training, with hourly forecasting and event-centered review after suspicious
    access.
  queries:
  - technology: ML pipeline pseudocode
    query: model=SARIMA(per_device hourly outbound_bytes); forecast next_hour with 99% PI; ALERT when
      actual>PI_upper, boost priority if within 1h of suspicious mobile access; OUTPUT device, actual,
      forecast, interval.
- question: Did an MDM/UEM critical compliance failure (jailbreak, root, integrity/attestation failure)
    occur, followed within 60 minutes by a successful corporate login from that device's last known IP?
  context: A compromised device used to bypass the lockscreen frequently shows tampering indicators before
    being used for Initial Access. Implement a stateful correlation rule that triggers on any MDM/UEM
    critical compliance failure, using deterministic root/jailbreak indicators (su/busybox binaries, root-manager
    packages, writable system mounts, abnormal build tags, failed Play Integrity/DeviceCheck attestation)
    as the trigger set ([On Root Detection Strategies for Android Devices, Mueller et al.](https://arxiv.org/abs/2012.01812)).
    On trigger, cache the device ID and last known IP and monitor authentication logs for 60 minutes;
    if a successful login (Event ID 4624 or successful IdP event) from that cached IP occurs, generate
    a Critical incident with the failed integrity check name surfaced. A positive result is a strong compromise
    signal tying device tampering to corporate access; a negative result means no login followed the failure
    within the window.
  answer_sources:
  - MDM/UEM logs
  - Windows Event ID 4624
  - Zeek conn.log
  - VPN logs
  - IdP logs
  - 'NAI: MDM/UEM Management Servers, Authentication Servers, VPN Concentrators, Cloud Identity Providers.'
  range: Last 90 days, with a 60-minute compliance-failure-to-login correlation window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'ON mdm_event IN [jailbreak,root,integrity_fail,attestation_fail]: cache device_id, last_ip;
      WATCH auth logs 60m; IF EventID=4624 or idp_success from cached_ip THEN raise Critical incident
      WITH failed_check_name; OUTPUT device, ip, check, login_time.'
- question: Are there devices that have remained non-compliant longer than the fleet's 95th-percentile
    time-to-remediation AND transmitted more than 1MB of data in the past hour?
  context: Long-lived non-compliance combined with active egress suggests an adversary keeping a bypassed
    device usable while moving data, relevant to Initial Access and follow-on theft. For each MDM compliance
    alert type, compute the fleet 95th percentile of time-to-remediation, then run an hourly query to
    find devices non-compliant longer than that threshold; for each, check Zeek conn.log for >1MB transmitted
    by its IP in the past hour and flag matches for automated network quarantine. A positive result identifies
    a tampered device that is both unremediated and actively transferring data; a negative result means
    non-compliant devices are either promptly remediated or quiet on the network.
  answer_sources:
  - MDM/UEM logs
  - Windows Event ID 4624
  - Zeek conn.log
  - VPN logs
  - IdP logs
  - 'NAI: MDM/UEM Management Servers, Authentication Servers, VPN Concentrators, Cloud Identity Providers.'
  range: Last 90 days for remediation baselines, with hourly scheduled evaluation and 1-hour egress windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each compliance_alert_type: thr=p95(time_to_remediation across fleet); HOURLY find devices
      noncompliant_duration>thr; FOR each: bytes_1h=sum(conn.log orig+resp_bytes for ip); FLAG when bytes_1h>1MB
      => quarantine; OUTPUT device, duration, bytes.'
- question: Does an XGBoost model score any critical compliance alert above 0.9 risk, with a successful
    authentication from the device's IP within the following hour?
  context: Supervised classification prioritizes the compliance alerts most likely tied to malicious Initial
    Access among routine noise. Train an XGBoost classifier on historical MDM alerts with features such
    as alert type (one-hot), user department, device OS version, time of day, and a labeled malicious/benign
    outcome. In production, score each new critical compliance alert; if the risk score exceeds 0.9 and
    a successful authentication from the device's IP is observed within one hour, automatically escalate
    to a Tier-3 analyst with all correlated data. A positive result is a high-confidence, model-backed
    malicious-compliance event; a negative result deprioritizes likely-benign compliance alerts.
  answer_sources:
  - MDM/UEM logs
  - Windows Event ID 4624
  - Zeek conn.log
  - VPN logs
  - IdP logs
  - 'NAI: MDM/UEM Management Servers, Authentication Servers, VPN Concentrators, Cloud Identity Providers.'
  range: Last 90 days for scoring, with 180-day historical labels for training and a 1-hour login correlation.
  queries:
  - technology: ML pipeline pseudocode
    query: 'model=XGBoost(features=[alert_type_onehot, department, os_version, time_of_day], label=malicious);
      FOR each critical compliance alert: risk=model.predict_proba; IF risk>0.9 AND auth_success from
      device_ip within 1h THEN escalate Tier-3; OUTPUT risk, correlated_login.'
- question: Does on-device telemetry show a per-device burst of failed unlock attempts approaching the
    wipe threshold (>=5 or >=80% of configured threshold) within 15 minutes, followed within 5 minutes
    by a successful unlock?
  context: This is the primary on-device failure-mode for the unlock-code brute-force/shoulder-surfing
    variant of lockscreen bypass during Initial Access. Alert when the per-device count of failed unlock
    attempts in a rolling 15-minute window exceeds a deterministic floor (default >=5, or >=80% of the
    configured wipe threshold) and is followed within 5 minutes by a successful unlock or locked->interactive
    transition. Under OS throttling legitimate users rarely accumulate this many failures, so a near-wipe-threshold
    burst preceding success indicates guessing or observation-based bypass ([This PIN Can Be Easily Guessed,
    Markert et al.](https://arxiv.org/abs/2003.04868)). Maintain an enforced blocklist of known-weak PINs
    (iOS 274/2910 lists) and raise severity if the successful code is on that list. A positive result
    strongly indicates passcode guessing; surface failed-count, backoff-timer state, and time-to-success.
  answer_sources:
  - android:MDMLog
  - iOS:MDMLog
  - MobileEDR:telemetry
  - DC0123 Application State
  - MDM/UEM logs
  - 'NAI: MDM/UEM management servers, MobileEDR agents on managed devices, device lock-screen/keyguard
    subsystem telemetry.'
  range: Last 90 days, with rolling 15-minute failed-unlock windows and 5-minute success correlation.
  queries:
  - technology: MobileEDR/Rule pseudocode
    query: GROUP unlock_events BY device,15m; floor = max(5, 0.8*wipe_threshold); ALERT when failed_unlock_count>=floor
      AND success_unlock or locked->interactive within 5m; IF success_code IN weak_pin_blocklist THEN
      raise_severity; OUTPUT failed_count, backoff_state, time_to_success.
- question: Does any device's failed-unlock count for a window exceed its own 30-day 99th percentile or
    3 standard deviations above its mean, with a sudden inversion toward high-failure-then-success?
  context: 'Per-device baselining accounts for the fact that unlock-attempt frequency varies by user,
    reducing false positives while still catching bypass attempts in the Initial Access phase. Build a
    30-day per-device baseline of failed-unlock counts per hour and per unlock session, then flag any
    window exceeding the device''s historical 99th percentile or mean+3sigma. Track the State dimension
    explicitly (failed vs successful unlock ratio): a sudden inversion toward high-failure-then-success
    is anomalous. Calibrate thresholds per device because attempt frequency varies by user ([Sensor-based
    Continuous Authentication Survey, Stylios et al.](https://arxiv.org/abs/2001.08578)). A positive result
    indicates the device is experiencing an unusual failure spike relative to itself; a negative result
    means current failures fit its normal behavior.'
  answer_sources:
  - android:MDMLog
  - iOS:MDMLog
  - MobileEDR:telemetry
  - DC0123 Application State
  - MDM/UEM logs
  - 'NAI: MDM/UEM management servers, MobileEDR agents on managed devices, device lock-screen/keyguard
    subsystem telemetry.'
  range: Last 90 days, with 30-day per-device baselines computed per hour and per unlock session.
  queries:
  - technology: MobileEDR/Stats pseudocode
    query: baseline per device over 30d for failed_unlock_count (p99, mean, sd) and fail/success ratio;
      FLAG window when count>p99 OR count>mean+3sd OR ratio inverts to high-fail-then-success; OUTPUT
      device, count, baseline, ratio.
- question: Does an LSTM next-event model flag any lock-state transition sequence (lock, fail, backoff,
    success, app-foreground) as falling outside the top-g predicted next events for that device?
  context: Sequence modeling captures the temporal grammar of normal unlock behavior, catching subtle
    bypass chains during Initial Access that thresholds miss. Train a DeepLog-style LSTM on normal per-device
    lock-state transition sequences and flag sequences where the observed event falls outside the top-g
    predicted next events (for example many failures followed immediately by privileged-app foreground),
    emitting the predicted-vs-observed events as explanation ([DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)).
    A positive result indicates an unusual unlock progression consistent with bypass plus immediate sensitive
    activity; a negative result means the sequence matches learned normal behavior.
  answer_sources:
  - android:MDMLog
  - iOS:MDMLog
  - MobileEDR:telemetry
  - DC0123 Application State
  - MDM/UEM logs
  - 'NAI: MDM/UEM management servers, MobileEDR agents on managed devices, device lock-screen/keyguard
    subsystem telemetry.'
  range: Last 90 days for LSTM training, with current sequences scored as they occur.
  queries:
  - technology: ML pipeline pseudocode
    query: 'seq=lock_state_transitions(lock,fail,backoff,success,app_foreground) per device; model=DeepLog_LSTM;
      FOR each event: IF observed NOT IN top_g(predicted) THEN ALERT; OUTPUT predicted_vs_observed, device.'
- question: Did a protected-configuration change that weakens authentication (new biometric enrollment,
    passcode/biometric requirement disabled, trust-agent/Smart Lock enabled, attention-aware Face ID disabled,
    lock-policy downgrade) occur within 30 minutes of a locked-to-interactive transition?
  context: This targets the biometric-spoofing and trust-agent-abuse paths to lockscreen bypass during
    Initial Access. Generate an alert when a Protected Configuration change weakening authentication occurs
    within 30 minutes of a locked->interactive transition. Because both iOS and Android require the passcode
    (not biometric) after restart/timeout, a biometric re-enrollment without a corresponding passcode
    entry is suspicious ([Spoofing Fingerprints, SRLabs](https://srlabs.de/bites/spoofing-fingerprints/)).
    Surface the specific policy field changed, the prior value, and the actor (user vs MDM). A positive
    result indicates the authentication boundary was altered close to an unlock, consistent with an adversary
    lowering defenses on a physically held device; a negative result means no boundary-weakening change
    coincided with an unlock.
  answer_sources:
  - android:MDMLog
  - iOS:MDMLog
  - DC0115 Protected Configuration
  - DC0114 Application Permission
  - MDM/UEM logs
  - 'NAI: MDM/UEM Protected Configuration and policy stores, biometric/keyguard/trust-agent subsystems,
    device-admin and Smart Lock configuration.'
  range: Last 90 days, with a 30-minute config-change-to-unlock correlation window.
  queries:
  - technology: MDM/Rule pseudocode
    query: ALERT when protected_config_change IN [biometric_enroll, passcode/biometric_req disabled, trust_agent/smart_lock
      enabled, face_id_attention disabled, lock_policy_downgrade] within 30m of locked->interactive; OUTPUT
      field, prior_value, actor(user|mdm), device.
- question: Where biometric match/liveness metadata is available, does a presentation-attack-detection
    model flag any unlock event as low-liveness or showing print/replay/3D-mask indicators?
  context: 'Biometric spoofing is a recognized lockscreen-bypass path; PAD scoring detects it where the
    platform exposes the necessary metadata, supporting the Initial Access investigation. Score unlock
    events with a presentation-attack-detection model (depth/rPPG/texture for face; spoof-material cues
    for fingerprint) and flag low-liveness or print/replay/3D-mask indicators, emitting the top-3 PAD
    features such as low depth variance, missing pulse signal, or abnormal match-score distribution ([Deep
    Learning for Face Anti-Spoofing: A Survey, Yu et al.](https://arxiv.org/abs/2106.14948)). A positive
    result indicates a likely spoofed biometric unlock; a negative result indicates the biometric presentation
    appears genuine. Coverage is limited to platforms exposing biometric liveness telemetry.'
  answer_sources:
  - android:MDMLog
  - iOS:MDMLog
  - DC0115 Protected Configuration
  - DC0114 Application Permission
  - MDM/UEM logs
  - 'NAI: MDM/UEM Protected Configuration and policy stores, biometric/keyguard/trust-agent subsystems,
    device-admin and Smart Lock configuration.'
  range: Last 90 days, scoring biometric unlock events where liveness metadata is exposed.
  queries:
  - technology: ML pipeline pseudocode
    query: 'FOR each unlock with biometric_metadata: pad_score=PAD_model(depth, rPPG, texture | spoof_material);
      FLAG when liveness_low OR print/replay/mask_indicator; OUTPUT top3_pad_features (depth_variance,
      pulse_signal, match_score_dist).'
- question: Does any device's protected-configuration change rate exceed the 99th percentile, or does
    a biometric re-enrollment occur outside that user's normal business hours?
  context: Frequency baselining of policy changes flags authentication-boundary tampering tied to lockscreen
    bypass during Initial Access. Establish fleet- and per-device baselines for the frequency of biometric/passcode
    policy changes, then flag devices whose protected-configuration change rate exceeds the 99th percentile,
    or any biometric re-enrollment occurring outside the user's normal business hours, as candidate tampering.
    A positive result indicates abnormally frequent or off-hours boundary changes consistent with an adversary
    preparing a held device; a negative result means configuration-change behavior is unremarkable.
  answer_sources:
  - android:MDMLog
  - iOS:MDMLog
  - DC0115 Protected Configuration
  - DC0114 Application Permission
  - MDM/UEM logs
  - 'NAI: MDM/UEM Protected Configuration and policy stores, biometric/keyguard/trust-agent subsystems,
    device-admin and Smart Lock configuration.'
  range: Last 90 days, with fleet and per-device baselines of protected-config change frequency.
  queries:
  - technology: MDM/Stats pseudocode
    query: baseline protected_config_change_rate per device and fleet; FLAG device when rate>p99 OR biometric_reenroll
      outside user_business_hours; OUTPUT device, rate, baseline, change_time.
- question: Do continuous touch-dynamics and motion-sensor (grasp/orientation) features after unlock diverge
    sharply from the enrolled owner's learned profile, indicating a different operator?
  context: When the bypass mechanic itself is invisible (notably on iOS), post-unlock behavioral biometrics
    are the most reliable observable for Initial Access by an unauthorized operator. Run continuous/implicit
    authentication on post-unlock touch features (pressure, area, velocity, swipe geometry, inter-stroke
    timing) ([Touchalytics, Frank et al.](https://arxiv.org/abs/1207.6231)) fused with hand-movement/orientation/grasp
    motion-sensor features ([HMOG, Sitova et al.](https://arxiv.org/abs/1501.01199)). Prefer a one-class
    model trained only on owner data, since impostor behavior is unknown, and alert on high reconstruction/anomaly
    score ([One-Class Adversarial Autoencoder, Li et al.](https://arxiv.org/abs/2210.16819)), surfacing
    the top-3 diverging features (swipe-velocity z-score, grasp-orientation deviation, tap-latency). A
    positive result indicates the person operating the device is likely not the owner; a negative result
    means behavior matches the owner's profile.
