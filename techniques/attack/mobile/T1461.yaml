name: 'T1461: Lockscreen Bypass'
id: c1426192-c3a8-4ddf-8c3d-a1a1050cb4ea
description: 'Investigate adversary attempts to bypass a mobile device''s lockscreen and then leverage
  that physical-access foothold to reach corporate resources. This playbook helps an analyst hunt for
  the observable failure-modes of lockscreen bypass across Android and iOS: bursts of failed authentication
  or failed unlock attempts that approach OS backoff/wipe thresholds and are immediately followed by success,
  successful corporate logins originating from IPs confirmed to belong to managed mobile devices, anomalous
  network behavior from those devices (restricted-asset access, DGA-like DNS, large outbound transfers,
  bad TLS certificates), MDM/UEM compliance failures (jailbreak, root, attestation/integrity failure)
  correlated with subsequent logins, authentication-boundary-weakening configuration changes (biometric
  re-enrollment, trust-agent/Smart Lock changes, attention-aware Face ID disabled), and post-unlock behavioral
  signals (touch/motion biometrics, app-usage sequences) that indicate the operator is not the enrolled
  owner. It covers symbolic correlation rules, statistical baselining, and machine-learning approaches
  so an analyst can confirm whether an adversary with physical access gained initial access to the network
  through a compromised mobile device.'
type: technique
related:
- tactic_id: TA0027
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
