- question: Does a Hidden Markov Model of the owner's typical application launch/foreground sequences
    flag a low-likelihood post-unlock app sequence?
  context: App-usage sequence modeling provides an additional different-operator signal after a possible
    lockscreen bypass during Initial Access. Model the owner's typical application launch/foreground sequences
    with a Hidden Markov Model and flag low-likelihood post-unlock app sequences as a different-operator
    signal ([Continuous Authentication Based on Application Usage, Mahbub et al.](https://arxiv.org/abs/1808.03319)).
    A positive result means the apps opened after unlock follow an order the owner rarely or never uses,
    consistent with an intruder navigating the device; a negative result means the app-usage flow matches
    the owner's habits.
  answer_sources:
  - MobileEDR:telemetry
  - DC0123 Application State
  - android:MDMLog
  - iOS:MDMLog
  - 'NAI: MobileEDR behavioral-telemetry agents, motion/touch sensor streams, application foreground/usage
    logs on managed devices.'
  range: Last 90 days for HMM training on owner app-usage sequences, scored per post-unlock session.
  queries:
  - technology: ML pipeline pseudocode
    query: 'model=HMM(owner app_launch/foreground sequences); FOR each post_unlock sequence: ll=model.score(seq);
      ALERT when ll<owner_threshold (low likelihood); OUTPUT sequence, log_likelihood.'
- question: Are behavioral-anomaly decision thresholds conditioned on device context (sitting vs walking,
    reading vs navigation) and calibrated per-user to a target EER to suppress false positives?
  context: Context conditioning materially reduces false positives versus context-agnostic behavioral
    models, making the Initial Access different-operator detections operationally trustworthy. Condition
    behavioral-anomaly decision thresholds on device context because context-specific models materially
    reduce false positives ([Effect of context in swipe authentication, Ackerson et al.](https://arxiv.org/abs/1905.11780)),
    and calibrate per-user accept/reject thresholds to a target equal-error-rate from behavioral-biometric
    benchmarks ([Sensor-based Continuous Authentication Survey, Stylios et al.](https://arxiv.org/abs/2001.08578)).
    A positive outcome is that an anomaly persists even after context-appropriate thresholds are applied
    (raising confidence in a genuine impostor); a negative outcome is that the apparent anomaly resolves
    once the correct context model is applied, indicating benign variation.
  answer_sources:
  - MobileEDR:telemetry
  - DC0123 Application State
  - android:MDMLog
  - iOS:MDMLog
  - 'NAI: MobileEDR behavioral-telemetry agents, motion/touch sensor streams, application foreground/usage
    logs on managed devices.'
  range: Last 90 days, with per-context and per-user threshold calibration.
  queries:
  - technology: Analytics pseudocode
    query: classify context IN [sitting, walking, reading, navigation]; select context_model(context);
      threshold=calibrate_per_user(target_EER); DECIDE anomaly when score>context_threshold; OUTPUT context,
      score, threshold.
- question: Does a security-sensitive application/framework foreground, or a special-access capability
    (accessibility, overlay, device-admin, notification access) get exercised, within 60 seconds of a
    locked-to-interactive transition while user-interaction context is weak?
  context: Immediate sensitive activity after unlock with weak interaction context is a deterministic
    indicator that a bypassed device is being driven toward valuable resources during Initial Access.
    Alert when a security-sensitive application or framework foregrounds, or special-access capability
    is exercised, within 60 seconds of a locked->interactive transition while recent user-interaction
    context is weak or inconsistent. Combine deterministically with any concurrent behavioral-anomaly
    score above threshold to raise severity. A positive result indicates rapid post-unlock access to sensitive
    capability without strong evidence of legitimate user interaction; a negative result means sensitive
    activity is backed by normal interaction context.
  answer_sources:
  - MobileEDR:telemetry
  - DC0123 Application State
  - android:MDMLog
  - iOS:MDMLog
  - 'NAI: MobileEDR behavioral-telemetry agents, motion/touch sensor streams, application foreground/usage
    logs on managed devices.'
  range: Last 90 days, with a 60-second post-unlock window.
  queries:
  - technology: MobileEDR/Rule pseudocode
    query: ALERT when sensitive_app/framework foregrounds OR special_access [accessibility, overlay, device_admin,
      notification_access] exercised within 60s of locked->interactive AND interaction_context weak; IF
