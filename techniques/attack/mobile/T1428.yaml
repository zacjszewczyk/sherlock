      A match on both conditions generates a high-priority alert.

      emit: high-priority alert with supporting fields (mobile device IP -> user/device, target host,
      service/port, contributing features/timeline) for analyst triage.'
- question: '[Lateral Movement] Alert on scan-like destination counts: Can you determine, using the ''Alert
    on scan-like destination counts'' (Statistical Method) approach, whether an adversary is exploiting
    remote services from a compromised mobile device against internal hosts? This evidence centers on
    the condition that: A successful remote logon (Windows Event ID 4624 with Logon Type 3 or 10) occurs
    to an internal host from a mobile-associated IP address within 60 minutes after the same source IP
    address generated a network scan notice in Zeek (e.g., Scan::Address_Scan) or connected to a number
    of unique internal hosts or ports that exceeds the 98th percentile of the established baseline for
    mobile devices within a 5-minute window.'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0033), an adversary who has gained
    a foothold on a mobile device with access to the internal enterprise network (via VPN or internal
    Wi-Fi) may exploit vulnerable remote services to move laterally and gain unauthorized access to internal
    systems (MITRE ATT&CK T1428, Exploitation of Remote Services). This evidence focuses on the condition
    that: A successful remote logon (Windows Event ID 4624 with Logon Type 3 or 10) occurs to an internal
    host from a mobile-associated IP address within 60 minutes after the same source IP address generated
    a network scan notice in Zeek (e.g., Scan::Address_Scan) or connected to a number of unique internal
    hosts or ports that exceeds the 98th percentile of the established baseline for mobile devices within
    a 5-minute window. The ''Alert on scan-like destination counts'' approach (Statistical Method) works
    as follows: Using Zeek conn.log, continuously calculate a 5-minute rolling count of unique destination
    IPs (id.resp_h) and unique destination ports (id.resp_p) for each source IP (id.orig_h) identified
    as a mobile device. Establish a dynamic baseline distribution for these counts per user or device
    (derive the threshold from each environment''s own 30-day history). Generate an alert when a device''s
    count for either metric exceeds the 98th percentile. Enhance the alert by calculating the Shannon
    entropy of the destination port set; a high entropy score combined with a low average of orig_bytes
    per connection strongly indicates a port scan. Explicitly profile failure modes as a distinct signal:
    a rejected/reset connection ratio (Zeek conn_state REJ/RSTO/S0 vs SF) far above the device baseline
    indicates probing. These per-host communication-graph features mirror the unsupervised baselining
    of Bohara et al (https://mnoureddine.com/files/17BOH01.pdf), and the incremental damped-window statistics
    of Kitsune, Mirsky et al (https://arxiv.org/pdf/1802.09089). A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable exploitation of remote services originating from a mobile
    device; pivot to the responsible mobile device IP (resolve it through VPN/DHCP/RADIUS leases to a
    user and device), the targeted internal host and service/port, the preceding scan or connection burst,
    any service crash or anomalous child-process execution, and the surrounding authentication timeline
    to scope intent and impact. A negative result helps rule out this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land lateral-movement activity.'
