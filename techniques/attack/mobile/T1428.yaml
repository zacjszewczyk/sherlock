    host from a mobile-associated IP address within 60 minutes after the same source IP address generated
    a network scan notice in Zeek (e.g., Scan::Address_Scan) or connected to a number of unique internal
    hosts or ports that exceeds the 98th percentile of the established baseline for mobile devices within
    a 5-minute window. The ''Detect anomalous mobile scan profiles'' approach (Machine Learning) works
    as follows: For each mobile device IP, create 5-minute session windows and train an isolation forest
    (or the autoencoder ensemble of Kitsune, Mirsky et al (https://arxiv.org/pdf/1802.09089)) for unsupervised
    anomaly detection. Engineer features from Zeek conn.log including: count of unique destination IPs,
    count of unique destination ports, Shannon entropy of destination ports, ratio of connection states
    (e.g., S1, SF vs. REJ, RSTO), total originated bytes, and a binary flag for connections to known high-value
    assets. An anomaly score exceeding a predefined threshold indicates behavior deviating from its normal
    activity profile, such as scanning, and should be correlated with subsequent logon activity. For explainability,
    the alert MUST list the top-3 features driving the score (e.g., per-feature reconstruction error or
    isolation depth) so analysts can triage without re-deriving the cause. A positive result -- a rule
    match, statistical outlier, or model alert -- indicates probable exploitation of remote services originating
    from a mobile device; pivot to the responsible mobile device IP (resolve it through VPN/DHCP/RADIUS
    leases to a user and device), the targeted internal host and service/port, the preceding scan or connection
    burst, any service crash or anomalous child-process execution, and the surrounding authentication
    timeline to scope intent and impact. A negative result helps rule out this particular vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-and-slow, or living-off-the-land lateral-movement activity.'
