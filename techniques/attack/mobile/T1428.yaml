    a network scan notice in Zeek (e.g., Scan::Address_Scan) or connected to a number of unique internal
    hosts or ports that exceeds the 98th percentile of the established baseline for mobile devices within
    a 5-minute window. The ''Rank improbable new internal connections'' approach (Machine Learning) works
    as follows: Build an authentication/connection graph from internal logs (Zeek conn.log, Windows 4624)
    and use unsupervised link prediction to score connections initiated by a mobile device IP, flagging
    low-probability new edges to internal servers as lateral movement, per CyberGraph, Bowman et al (https://www.usenix.org/system/files/raid20-bowman.pdf)
