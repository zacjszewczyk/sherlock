- question: '[Lateral Movement] Alert on service crashes after mobile connections: Can you determine,
    using the ''Alert on service crashes after mobile connections'' (Symbolic Logic) approach, whether
    an adversary is exploiting remote services from a compromised mobile device against internal hosts?
    This evidence centers on the condition that: A critical network-facing service process (e.g., svchost.exe
    hosting TermService, w3wp.exe for IIS, smbd for Samba) crashes (Windows Event ID 1000, Application
    Error) or terminates unexpectedly (Windows Event ID 7034, Service Control Manager). This event is
    temporally correlated, occurring within 60 seconds of an inbound network connection from a mobile
    device IP address, as recorded in Zeek conn.log.'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0033), an adversary who has gained
