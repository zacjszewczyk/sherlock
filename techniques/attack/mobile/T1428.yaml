questions:
- question: '[Lateral Movement] Correlate scans with remote logons: Can you determine, using the ''Correlate
    scans with remote logons'' (Symbolic Logic) approach, whether an adversary is exploiting remote services
    from a compromised mobile device against internal hosts? This evidence centers on the condition that:
    A successful remote logon (Windows Event ID 4624 with Logon Type 3 or 10) occurs to an internal host
    from a mobile-associated IP address within 60 minutes after the same source IP address generated a
    network scan notice in Zeek (e.g., Scan::Address_Scan) or connected to a number of unique internal
    hosts or ports that exceeds the 98th percentile of the established baseline for mobile devices within
    a 5-minute window.'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0033), an adversary who has gained
    a foothold on a mobile device with access to the internal enterprise network (via VPN or internal
    Wi-Fi) may exploit vulnerable remote services to move laterally and gain unauthorized access to internal
    systems (MITRE ATT&CK T1428, Exploitation of Remote Services). This evidence focuses on the condition
    that: A successful remote logon (Windows Event ID 4624 with Logon Type 3 or 10) occurs to an internal
    host from a mobile-associated IP address within 60 minutes after the same source IP address generated
    a network scan notice in Zeek (e.g., Scan::Address_Scan) or connected to a number of unique internal
    hosts or ports that exceeds the 98th percentile of the established baseline for mobile devices within
    a 5-minute window. The ''Correlate scans with remote logons'' approach (Symbolic Logic) works as follows:
    Define a dynamic list of mobile device IP ranges by correlating VPN and internal Wi-Fi DHCP/RADIUS
    logs. Create a SIEM rule that triggers when Zeek''s notice.log generates a Scan::Port_Scan or Scan::Address_Scan
    from an IP in this range, or when a network IDS signature for a known scan/exploit fires from that
    IP (Suricata Rules Introduction, OISF (https://docs.suricata.io/en/latest/rules/intro.html); BZAR,
    MITRE (https://github.com/mitre-attack/bzar) for SMB/DCE-RPC remote-service activity). The rule''s
    logic must then query for a successful Windows Event ID 4624 (Logon Type 3 or 10) from the same source
    IP to one of the scanned destinations within the subsequent 60 minutes, using the Event-ID artifact
    mapping in Detecting Lateral Movement through Tracking Event Logs, JPCERT/CC (https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).
    Escalate further when the logon constitutes first-time access by that user/device to the target server
    or involves a credential switch, the causal lateral-movement rule from Hopper, Ho et al (https://www.usenix.org/system/files/sec21-ho.pdf).
    A match on both conditions generates a high-priority alert. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable exploitation of remote services originating from a mobile
    device; pivot to the responsible mobile device IP (resolve it through VPN/DHCP/RADIUS leases to a
    user and device), the targeted internal host and service/port, the preceding scan or connection burst,
    any service crash or anomalous child-process execution, and the surrounding authentication timeline
    to scope intent and impact. A negative result helps rule out this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land lateral-movement activity.'
