    that: A critical network-facing service process (e.g., svchost.exe hosting TermService, w3wp.exe for
    IIS, smbd for Samba) crashes (Windows Event ID 1000, Application Error) or terminates unexpectedly
    (Windows Event ID 7034, Service Control Manager). This event is temporally correlated, occurring within
    60 seconds of an inbound network connection from a mobile device IP address, as recorded in Zeek conn.log.
    The ''Alert on service crashes after mobile connections'' approach (Symbolic Logic) works as follows:
    Create a SIEM alert that triggers on Windows Event ID 1000 (Application Error) or 7034/7031 (Service
    Control Manager) where the Faulting application name or service name matches a predefined list of
    critical remote services (e.g., svchost.exe, w3wp.exe, lsass.exe, smbd, sqlservr.exe). The rule''s
    response action must automatically query Zeek conn.log for connections to the affected host in the
    60 seconds preceding the event; the relevant logon/service Event-ID artifacts are enumerated in Detecting
    Lateral Movement through Tracking Event Logs, JPCERT/CC (https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).
    If a source IP from the identified mobile device range is found connecting to the service port, escalate
    to a high-priority alert; cross-reference any concurrent network IDS exploit signature for that service
    (Suricata Rules Introduction, OISF (https://docs.suricata.io/en/latest/rules/intro.html)). A positive
