name: 'T1428: Exploitation of Remote Services'
id: e86cabba-eaa4-4dd6-aa11-4ba0769941e3
description: 'This playbook helps an analyst investigate whether an adversary is using a compromised mobile
  device to move laterally within the internal enterprise network by exploiting vulnerable remote services
  (MITRE ATT&CK T1428, Exploitation of Remote Services). Once a mobile device reaches the internal network
  through a VPN or internal Wi-Fi, an adversary can probe and exploit enterprise servers, workstations,
  and other resources to gain unauthorized access and escalate privileges. The hunt pursues this behavior
  from several complementary angles across network and endpoint telemetry: correlating Zeek-observed network
  scans and scan-like destination/port counts from mobile IP ranges with subsequent successful remote
  logons (Windows Event ID 4624, Logon Type 3/10); detecting critical network-facing service crashes (Windows
  Event IDs 1000, 7034, 7031) temporally tied to inbound mobile-device connections; and flagging network-service
  processes that spawn suspicious child processes or living-off-the-land binaries (Windows Event ID 4688)
  immediately after a mobile-device connection. Detection methods combine deterministic symbolic-logic
  correlation rules, statistical baselining and rarity scoring (rolling percentile thresholds, Shannon
  entropy of destination ports, Poisson rare-event modeling, process parent-child frequency and command-line
  entropy), and machine learning (isolation forests/autoencoder ensembles such as Kitsune, graph link-prediction
  such as CyberGraph/Euler, supervised crash classifiers, NLP command-line classifiers, and LSTM event-sequence
  models such as DeepLog), so the analyst can corroborate suspected exploitation of remote services against
  mobile-device, host, service, and authentication context. Source platforms: Android, iOS.'
type: technique
related:
- tactic_id: TA0033
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
