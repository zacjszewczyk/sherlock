- question: '[Lateral Movement] Detect anomalous mobile scan profiles: Can you determine, using the ''Detect
    anomalous mobile scan profiles'' (Machine Learning) approach, whether an adversary is exploiting remote
    services from a compromised mobile device against internal hosts? This evidence centers on the condition
    that: A successful remote logon (Windows Event ID 4624 with Logon Type 3 or 10) occurs to an internal
    host from a mobile-associated IP address within 60 minutes after the same source IP address generated
