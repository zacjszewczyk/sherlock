questions:
- question: Are any DNS queries originating from mobile device IP ranges resolving to domains that match
    known, reverse-engineered DGA feeds, or that satisfy DGA lexical rules such as Shannon entropy greater
    than 3.5, low n-gram rankness against a benign corpus, fewer than one dictionary word, and a vowel-to-consonant
    ratio below 0.25?
  context: 'For the Command and Control tactic, this is the deterministic floor: most DGAs are algorithmically
    deterministic and can be precomputed, so matching mobile DNS query strings against precomputed DGA
    feeds such as DGArchive (Plohmann et al.) catches known families with near-zero false positives. In
    parallel, per-domain lexical rules (Shannon entropy > 3.5, low bigram/n-gram rankness, < 1 dictionary
    word, vowel-to-consonant ratio < 0.25; see Data Driven Security DGA features and NgViz bigram scoring
    by Dusi) catch unknown families that share the random, non-linguistic structure of generated names.
    The analyst is looking for a mobile device whose DNS stream contains domains that are either on the
    feed or that look machine-generated. A positive feed match is high-confidence C2; a lexical-only match
    is a lead requiring corroboration. Allowlist known CDN and algorithmic-but-benign domains, which can
    trigger lexical rules due to their naming format. Keep this rule as the floor and never replace it
    with probabilistic scoring.'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event ID 260
  - Application Vetting Network Communication
  - MDM/CASB DNS logs
  - 'NAI: Network traffic from mobile device subnets, specifically DNS queries captured at internal DNS
    resolvers, egress firewalls, or via Network Security Monitoring (NSM) sensors. Logs from Mobile Device
    Management (MDM) or Cloud Access Security Broker (CASB) platforms can also provide DNS context.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from dns where src_ip in MOBILE_SUBNETS\n| eval feed_hit = lookup(query, dga_feed_dgarchive)\n\
      | eval ent = shannon_entropy(query), ngram = ngram_rank(query, benign_corpus),\n       dict_words\
      \ = count_dictionary_words(query), vc = vowels(query)/consonants(query)\n| where feed_hit==true\n\
      \   OR (ent > 3.5 AND ngram == low AND dict_words < 1 AND vc < 0.25)\n| where NOT lookup(domain,\
      \ cdn_benign_allowlist)\n| eval severity = if(feed_hit, \"critical\", \"high\")\n| emit alert(src_ip,\
      \ query, ent, vc, feed_hit)"
  - technology: Zeek/pseudocode
    query: "# read dns.log, filter mobile ranges, score lexical features\ndns.log | id.orig_h in MOBILE_SUBNETS\n\
      \  | add entropy=shannon(query), vc_ratio=vc(query)\n  | match query against dga_feed OR (entropy>3.5\
      \ && dict_words<1 && vc_ratio<0.25)\n  | suppress if query in cdn_allowlist | -> notice DGA::Lexical_Match"
- question: Does any single mobile device IP generate a burst of failed DNS resolutions (NXDOMAIN) that
    exceeds the 99th percentile of its own baseline within a 5-minute window, where the queried domains
    also show high average Shannon entropy (> 3.5) and statistically diverge from an English-language
    baseline?
  context: 'DGA malware iterates through many candidate domains, most of which are not registered, producing
    a telltale flood of NXDOMAIN responses before it finds the live C2 rendezvous domain. For Command
    and Control, aggregating Zeek dns.log by source IP in 5-minute windows and counting unique NXDOMAIN
    responses as a first-class signal (per FANCI NXDOMAIN classification, Schueppen et al.) surfaces this
    behavior. Alert when the NXDOMAIN count exceeds the per-device 99th-percentile baseline AND average
    entropy > 3.5. Strengthen confidence with distribution-divergence tests: KL divergence and Jaccard
    bigram overlap of the windowed domain set versus an English baseline (high KL / low Jaccard indicates
    machine generation, per Yadav et al.), and cluster correlated NXDOMAIN bursts by lexical similarity
    across hosts to spot a shared family (Pleiades, Antonakakis et al.). Derive percentile thresholds
    from 30 days of site-specific DNS. A positive result means the device is likely probing for a DGA
    C2 domain; benign causes include misconfigured apps and captive-portal churn, which the entropy and
    divergence gates help exclude.'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event ID 260
  - Application Vetting Network Communication
  - MDM/CASB DNS logs
  - 'NAI: Network traffic from mobile device subnets, specifically DNS queries captured at internal DNS
    resolvers, egress firewalls, or via Network Security Monitoring (NSM) sensors. Logs from Mobile Device
    Management (MDM) or Cloud Access Security Broker (CASB) platforms can also provide DNS context.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from dns where src_ip in MOBILE_SUBNETS AND rcode==NXDOMAIN\n| bin span=5m _time\n| stats\
      \ dc(query) as nx_unique, avg(shannon_entropy(query)) as avg_ent,\n        kl_divergence(bigrams(query),\
      \ english_bigrams) as kl,\n        jaccard(bigrams(query), english_bigrams) as jac by src_ip, _time\n\
      | join src_ip [ baseline p99 nx_unique over last 30d as nx_p99 ]\n| where nx_unique > nx_p99 AND\
      \ avg_ent > 3.5 AND kl > KL_THRESH AND jac < JAC_THRESH\n| emit alert(src_ip, nx_unique, avg_ent,\
      \ kl, jac)"
  - technology: Zeek/pseudocode
    query: "dns.log | id.orig_h in MOBILE_SUBNETS && rcode_name==\"NXDOMAIN\"\n  | window 5min by id.orig_h:\
      \ count distinct query, mean entropy\n  | flag if count > per_device_p99(30d) && mean_entropy >\
      \ 3.5\n  | cluster bursts across hosts by bigram-similarity -> notice DGA::NXDOMAIN_Burst"
- question: When non-allowlisted domains queried by mobile devices are scored by a character-level LSTM
    and a parallel feature-based Random Forest, do any exceed a DGA probability of 0.90, and does the
    alert surface the top-3 contributing features (e.g., entropy, dictionary-word count, NXDOMAIN burst
    rate) to justify the verdict?
  context: 'Lexical rules miss families designed to look benign, so this Command and Control detection
    layers a supervised classifier: a character-level LSTM (Woodbridge et al.) plus a feature-based Random
    Forest over length, entropy, n-gram frequency, numeric ratio, and vowel/consonant ratio (FANCI, Schueppen
    et al.). Escalate domains with DGA probability > 0.90 and prioritize source IPs that already show
    high NXDOMAIN rates. Critically for analyst trust and triage, the alert must surface the top-3 contributing
    features (e.g., entropy=4.1, dictionary-words=0, NXDOMAIN-burst=120), not just a bare score, so the
    verdict is explainable and defensible. Train on DGArchive (positive) versus Alexa/benign and adversarially
    augment the training set, because GAN-generated Alexa-like domains (DeepDGA, Anderson et al.) evade
    pure lexical/LSTM detectors. A high score on a mobile device that is also bursting NXDOMAIN is strong
    evidence of DGA-based C2; isolated high scores on CDN-like domains are likely false positives.'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event ID 260
  - Application Vetting Network Communication
  - MDM/CASB DNS logs
  - 'NAI: Network traffic from mobile device subnets, specifically DNS queries captured at internal DNS
    resolvers, egress firewalls, or via Network Security Monitoring (NSM) sensors. Logs from Mobile Device
    Management (MDM) or Cloud Access Security Broker (CASB) platforms can also provide DNS context.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "candidates = dns.query where src_ip in MOBILE_SUBNETS AND domain NOT in allowlist\nfeat =\
      \ features(domain): [length, entropy, ngram_freq, numeric_ratio, vc_ratio]\np_lstm = char_lstm.predict_proba(domain)\
      \   # Woodbridge et al.\np_rf   = random_forest.predict_proba(feat) # FANCI\nscore  = max(p_lstm,\
      \ p_rf)\nif score > 0.90:\n   top3 = explain(feat)  # SHAP/feature-importance top 3\n   priority\
      \ = boost_if(src_ip in high_nxdomain_hosts)\n   emit alert(domain, src_ip, score, top3, priority)\n\
      # train: DGArchive(+) vs Alexa(-), augment with DeepDGA GAN samples"
- question: Did any mobile device successfully resolve a domain whose WHOIS creation date is within the
    last 3 days, or a domain with low historical passive-DNS prevalence and high IP/answer dynamism?
  context: DGA operators register the rendezvous domain only shortly before it is needed, so newly created
    domains are a high-value Command and Control indicator. Enrich successful DNS resolutions from mobile
    IPs with WHOIS create_date and alert at medium severity when the domain was created within the last
    3 days (Strategically Aged Domain Detection, Unit 42). Layer a passive-DNS prevalence rule that flags
    domains with low historical resolution prevalence and high IP/answer dynamism, which is characteristic
    of fast-flux and disposable C2 infrastructure (EXPOSURE, Bilge et al.). The analyst is looking for
    a mobile device that just connected to infrastructure no one else uses and that barely existed before
    today. A positive result warrants connection review and possible device quarantine; legitimate causes
    include newly launched services and marketing domains, so corroborate with the lexical/classifier
    signals and connection prevalence.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - External WHOIS Data
  - 'NAI: Egress network traffic captured at internet gateways or proxies, correlated with DNS resolution
    logs from internal resolvers. Enrichment data from external WHOIS services is required. Logs from
    MDM or CASB solutions can provide device context for connections.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from dns where src_ip in MOBILE_SUBNETS AND rcode==NOERROR\n| lookup whois(domain) -> create_date,\
      \ answer_ip_count, historical_prevalence\n| eval age_days = now() - create_date\n| where age_days\
      \ <= 3\n   OR (historical_prevalence == low AND answer_ip_dynamism == high)\n| eval severity=\"\
      medium\"\n| emit alert(src_ip, domain, age_days, historical_prevalence)"
  - technology: Zeek/pseudocode
    query: "dns.log + whois_enrichment | id.orig_h in MOBILE_SUBNETS && rcode_name==\"NOERROR\"\n  | newly_created\
      \ = (whois.create_date within 3d)\n  | low_prev = passive_dns.prevalence(domain) < THRESH && answer_dynamism\
      \ high\n  | if newly_created || low_prev -> notice DGA::New_Or_Rare_Domain"
- question: For domains created within the last 30 days that mobile devices connect to, are fewer than
    5 unique internal devices resolving them, or do any domains show a long registration-to-first-traffic
    gap (> 60 days) followed by a sudden activity spike above their own near-zero baseline (strategic
    aging)?
  context: 'This Command and Control detection joins Zeek dns.log resolutions with Zeek conn.log connections
    for mobile IPs to measure organizational prevalence. For domains created within 30 days, count unique
    internal source IPs per domain and escalate when prevalence is fewer than 5 devices, since DGA C2
    domains are contacted by very few hosts (EXPOSURE, Bilge et al.). Separately detect strategically
    aged domains: the WHOIS age is large but the domain''s first significant traffic is recent and spikes
    after long dormancy, so alert on (registration-to-first-traffic gap > 60 days) AND (sudden activation
    above the 99th percentile of its own near-zero baseline) per Unit 42. Also profile resolution success/failure:
    a host that flips from sustained NXDOMAIN failures to a successful rare-domain resolution is high
    priority because that is exactly the DGA find-the-live-domain pattern. A positive result is strong
    C2 evidence; widely used new domains are likely benign.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - External WHOIS Data
  - 'NAI: Egress network traffic captured at internet gateways or proxies, correlated with DNS resolution
    logs from internal resolvers. Enrichment data from external WHOIS services is required. Logs from
    MDM or CASB solutions can provide device context for connections.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from dns where src_ip in MOBILE_SUBNETS AND rcode==NOERROR\n| join domain [ conn where dst\
      \ resolved_from domain ]\n| lookup whois(domain) -> create_date, first_seen_traffic\n| stats dc(src_ip)\
      \ as org_prevalence by domain\n| eval reg_gap_days = first_seen_traffic - create_date\n| eval recent\
      \ = (now()-create_date <= 30d)\n| where (recent AND org_prevalence < 5)\n   OR (reg_gap_days > 60\
      \ AND current_activity > p99_of_own_baseline)\n| emit alert(domain, org_prevalence, reg_gap_days)"
  - technology: Zeek/pseudocode
    query: "join(dns.log, conn.log) by resolved_ip | id.orig_h in MOBILE_SUBNETS\n  | per domain: unique_internal_hosts,\
      \ whois_age, dormancy_gap, activation_spike\n  | flag if (recent_reg && unique_internal_hosts<5)\n\
      \          || (dormancy_gap>60d && activation_spike>own_p99)\n  | escalate hosts flipping NXDOMAIN->NOERROR\
      \ rare-domain -> notice DGA::LowPrev_Aged"
- question: Does a daily per-device time series of connections to newly registered or low-prevalence domains
    exceed the 99th-percentile confidence interval of a SARIMA or Prophet forecast, and does the alert
    report the top-3 drivers and cross-reference the DGA classifier score?
  context: DGA-based C2 often manifests as an unusual surge in connections to new/rare domains on a single
    device. For Command and Control, build a daily per-device time series of connections to newly registered
    or low-prevalence domains, fit SARIMA or Prophet to learn each device's seasonal normal, and alert
    when observed counts exceed the 99th-percentile forecast confidence interval (Unit 42 traffic-trend
    modeling). To support triage, the alert must report the top-3 drivers (e.g., new-domain count, dormancy-gap
    days, prior NXDOMAIN rate) and cross-reference the DGA classifier score from the lexical/ML evidence
    (Woodbridge et al.). The analyst is looking for a device whose new-domain contact rate breaks from
    its own history. A positive result combined with a high classifier score is strong C2 evidence; benign
    spikes (travel, app updates) usually lack the high entropy and NXDOMAIN context.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - External WHOIS Data
  - 'NAI: Egress network traffic captured at internet gateways or proxies, correlated with DNS resolution
    logs from internal resolvers. Enrichment data from external WHOIS services is required. Logs from
    MDM or CASB solutions can provide device context for connections.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "ts = daily_count(connections to new_or_lowprev_domains) per device, last 90d\nmodel = SARIMA(ts)\
      \ or Prophet(ts)\nforecast, ci99 = model.predict(today)\nif observed_today > ci99.upper:\n   drivers\
      \ = top3([new_domain_count, dormancy_gap_days, prior_nxdomain_rate])\n   dga_score = join(classifier_score_from_evidence1,\
      \ device)\n   emit alert(device, observed_today, ci99.upper, drivers, dga_score)"
- question: Are mobile devices issuing DNS queries with a single label longer than 63 characters, a total
    query length over 255 bytes, or labels matching Base64/hex encoding patterns, and do these correlate
    with high-entropy NXDOMAIN activity from the same source IP within the last hour?
  context: Beyond domain rendezvous, DGA-adjacent malware abuses DNS as a covert C2 channel by encoding
    data into subdomain labels. For Command and Control, inspect Zeek dns.log for mobile IPs and alert
    when a query label exceeds 63 characters, total query length exceeds 255 bytes, or labels match Base64/hex
    patterns (NgViz n-gram/encoding analysis, Dusi). Add lexical-feature rules from the NXDOMAIN classifier
    (high entropy, low dictionary-word ratio, high digit ratio) and correlate with high-entropy NXDOMAIN
    activity from the same source IP within the last hour (FANCI, Schueppen et al.) to distinguish tunneling
    from benign long FQDNs. The analyst is looking for DNS that is carrying data rather than just resolving
    names. A positive result strongly suggests DNS tunneling/exfiltration over the C2 channel; benign
    long labels (some CDNs, DKIM, antivirus lookups) should be allowlisted.
  answer_sources:
  - Zeek dns.log
  - Application Vetting Network Communication
  - 'NAI: DNS traffic logs from internal DNS resolvers and forwarders. Network Security Monitoring (NSM)
    sensors at key network chokepoints (e.g., data center core, internet egress) can provide the necessary
    granularity from full packet capture if needed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from dns where src_ip in MOBILE_SUBNETS\n| eval maxlabel = max_label_len(query), qlen = byte_len(query)\n\
      | eval encoded = match(query, /(base64|hex)_pattern/),\n       ent = shannon_entropy(query), digit_ratio\
      \ = digits(query)/len(query)\n| where maxlabel > 63 OR qlen > 255 OR encoded==true\n         OR\
      \ (ent > 3.5 AND digit_ratio > 0.3)\n| correlate src_ip with nxdomain_high_entropy(src_ip, window=1h)\n\
      | emit alert(src_ip, query, maxlabel, qlen, encoded)"
  - technology: Zeek/pseudocode
    query: "dns.log | id.orig_h in MOBILE_SUBNETS\n  | label_len>63 || query_bytes>255 || query=~/^[A-Za-z0-9+/=]{20,}/\n\
      \  | enrich entropy, digit_ratio | join nxdomain_burst(src_ip,1h)\n  | -> notice DGA::DNS_Tunnel_Labels"
- question: Within 10-minute windows, does any mobile source IP and parent-domain pair exceed the 99.5th
    percentile of baseline for query frequency, unique-subdomain count, average query length, or NXDOMAIN-to-total
    ratio, especially for recently registered parent domains?
  context: DNS tunneling and subdomain-based DGA C2 generate many unique subdomains under one parent domain
    in a short time. For Command and Control, group Zeek dns.log by source IP and parent domain in 10-minute
    windows and compute query frequency (count/min), unique-subdomain count, average query length in bytes,
    and the NXDOMAIN-to-total ratio. Alert when volume/frequency metrics exceed the 99.5th percentile
    of baseline, especially for recently registered parent domains (Nadler et al. stateless lexical+volume
    features; Yadav et al. distribution divergence). Treat a rising failed-lookup ratio as an independent
    escalation signal because it reflects the DGA probing pattern. The analyst is looking for a device
    hammering one parent domain with many distinct, often-failing subdomain queries. A positive result
    indicates likely tunneling/C2; benign high-volume parents (CDNs, telemetry, antivirus) should be baselined
    or allowlisted.
  answer_sources:
  - Zeek dns.log
  - Application Vetting Network Communication
  - 'NAI: DNS traffic logs from internal DNS resolvers and forwarders. Network Security Monitoring (NSM)
    sensors at key network chokepoints (e.g., data center core, internet egress) can provide the necessary
    granularity from full packet capture if needed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from dns where src_ip in MOBILE_SUBNETS\n| eval parent = registered_domain(query), sub = subdomain(query)\n\
      | bin span=10m _time\n| stats count as q, dc(sub) as uniq_sub, avg(byte_len(query)) as avg_len,\n\
      \        sum(rcode==NXDOMAIN)/count as nx_ratio,\n        eval freq=q/10 by src_ip, parent, _time\n\
      | join parent [ baseline p99_5 over freq,uniq_sub,avg_len,nx_ratio ]\n| where freq>p99_5_freq OR\
      \ uniq_sub>p99_5_sub OR avg_len>p99_5_len OR nx_ratio>p99_5_nx\n| boost if whois_age(parent) < 30d\n\
      | emit alert(src_ip, parent, freq, uniq_sub, avg_len, nx_ratio)"
  - technology: Zeek/pseudocode
    query: "dns.log | id.orig_h in MOBILE_SUBNETS\n  | window 10min by (id.orig_h, registered_domain):\n\
      \      query_freq, unique_subdomains, mean_query_bytes, nxdomain_ratio\n  | flag if any metric >\
      \ baseline_p99.5 (esp. recently-registered parent)\n  | escalate on rising nxdomain_ratio -> notice\
      \ DGA::Subdomain_Burst"
- question: When per-source DNS features (query frequency, query/response size distributions, subdomain
    entropy, unique subdomains per parent, NXDOMAIN ratio) are clustered with DBSCAN or Isolation Forest,
    do any mobile sources fall into high-frequency, large-payload, high-subdomain-count clusters indicative
    of DNS tunneling, with the top-3 anomalous features reported per alert?
  context: Rule and percentile methods can miss novel tunneling patterns, so this Command and Control
    detection extracts per-source features (query frequency, query/response size distributions, subdomain
    entropy, unique subdomains per parent, NXDOMAIN ratio) and applies DBSCAN or Isolation Forest to surface
    high-frequency, large-payload, high-subdomain-count clusters as probable DNS tunneling (Nadler et
    al.). Complement with a byte/character-level CNN robust to encoding variants (FECC, Xu et al.; Lambion
    et al.) to catch obfuscated payloads. Each alert must list the top-3 anomalous features driving the
    cluster/anomaly assignment so the analyst can triage and defend the finding. The analyst is looking
    for mobile devices whose aggregate DNS behavior is statistically unlike the fleet. A positive result,
    especially corroborated by the lexical, classifier, and NXDOMAIN-burst signals, is strong evidence
    of DGA/tunneling C2; tight clusters of known telemetry/CDN behavior are benign and should be excluded
    after review.
  answer_sources:
  - Zeek dns.log
  - Application Vetting Network Communication
  - 'NAI: DNS traffic logs from internal DNS resolvers and forwarders. Network Security Monitoring (NSM)
    sensors at key network chokepoints (e.g., data center core, internet egress) can provide the necessary
    granularity from full packet capture if needed.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = per_source_features(dns over last 90d) where src_ip in MOBILE_SUBNETS:\n    [query_freq,\
      \ qsize_dist, rsize_dist, subdomain_entropy,\n     unique_subs_per_parent, nxdomain_ratio]\nlabels\
      \ = DBSCAN(X)  # or scores = IsolationForest(X)\ntunnel_clusters = clusters with high freq & large\
      \ payload & high subdomain count\ncnn_score = byte_cnn.predict(raw_query)   # FECC / Lambion, encoding-robust\n\
      for src in anomalous(tunnel_clusters) or cnn_score>thr:\n   top3 = explain_features(src)\n   emit\
      \ alert(src, cluster_id, cnn_score, top3)"
