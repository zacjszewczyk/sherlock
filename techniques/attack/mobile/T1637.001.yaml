name: 'T1637.001: Domain Generation Algorithms'
id: ea817ed3-cd2f-41ec-873f-ece30141269e
description: 'Hunt for adversary command-and-control (C2) on mobile devices (Android and iOS) that relies
  on Domain Generation Algorithms (DGAs) to procedurally create large numbers of rendezvous domains for
  C2 communication or malicious application distribution. Because malware can cycle through thousands
  of algorithmically generated domains, static blocklists and takedowns are ineffective, so this playbook
  helps an analyst detect the behavioral fingerprints of DGA activity: bursts of failed DNS lookups (NXDOMAIN)
  for high-entropy, non-linguistic domains from a single mobile device; successful resolutions of very
  recently registered or strategically aged, low-prevalence domains; and high-volume subdomain queries
  with oversized or encoded labels indicative of DNS tunneling. It combines a deterministic symbolic-logic
  floor (precomputed DGA feeds and lexical rules), statistical baselining (per-device percentile thresholds,
  distribution divergence, prevalence and dormancy profiling), and explainable machine learning (character-level
  LSTM/CNN classifiers, feature-based Random Forests, and DBSCAN/Isolation Forest clustering) so the analyst
  can confirm DGA-based C2, prioritize triage with top contributing features, and scope affected mobile
  fleets.'
type: technique
