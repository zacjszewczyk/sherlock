- question: Did a non-system mobile application spawn a shell child process (sh, bash, toybox, toolbox)
    where the parent package is on a curated deny-list of apps forbidden from spawning shells?
  context: 'Some apps should never spawn a shell under any circumstance, so a deny-list violation is a
    high-confidence Execution-tactic detection. Search MTD.ProcessEvents for events where child_process_name
    is sh, bash, toybox, or toolbox and trigger a critical alert if parent_process_package_name is on
    a curated deny-list. On Android, corroborate with kernel-audit `avc: denied` records for the parent''s
    app domain, and enrich with device-owner details and threat-intel for any IPs/domains found in command-line
    arguments. A deny-listed parent spawning a shell is almost certainly malicious or policy-violating
    and should be escalated; corroboration with SELinux denials further hardens the verdict. References:
    [Execute This!](https://sites.cs.ucsb.edu/~vigna/publications/2014_NDSS_ExecuteThis.pdf); [Security
    Enhanced (SE) Android](https://www.ndss-symposium.org/wp-content/uploads/2017/09/02_4.pdf).'
