    query: "from MTD.ProcessEvents\nstats dc(device) as devs by parent_pkg, child_process_name over 90d\n\
      eval prevalence = devs / devices_running(parent_pkg)\nwhere prevalence < 0.01 or len(command_args)\
      \ > p98(len|parent_pkg)\n  or has_novel_tokens(command_args, baseline[parent_pkg])\nscore markov_transition(abstracted_api_seq);\
      \ apply changepoint()\nemit alert(parent_pkg, child_process_name, prevalence)"
