- question: Is an observed parent-child process pair statistically rare across the fleet (seen on fewer
    than 1% of devices running the parent app), with command-line length above the parent's 98th percentile
    or novel argument tokens relative to its baseline?
  context: 'Rare parent-child process relationships and unusually long or novel command lines reveal exec
    abuse that deny-lists miss. For the Execution tactic, establish a 90-day fleet baseline of parent-child
    process relationships and alert when a pair is observed on fewer than 1% of devices running the parent
    app, when command-line length exceeds the parent''s 98th percentile, or when argument tokens are novel
    for the parent''s baseline. Score rare transitions into exec/Process APIs with package-abstracted
    Markov chains and apply change-point tests for abrupt shifts. A rare pair plus anomalous arguments
    points to an app being abused or trojanized; common pairs reflect expected behavior. References: [A
    Sense of Self for Unix Processes](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf);
    [MaMaDroid](https://arxiv.org/pdf/1612.04433); [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - MTD.ProcessEvents
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Managed mobile device fleet; Centralized log aggregator/SIEM; Corporate DNS resolvers; Network
