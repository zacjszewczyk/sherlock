questions:
- question: Did any mobile application spawn a Unix shell or superuser process (sh, bash, zsh, toybox,
    toolbox, su) when that application's bundle/package ID is NOT on the pre-approved allowlist of apps
    authorized to launch shells?
  context: 'Under the Execution tactic, a legitimate business app launching a Unix shell is rarely expected,
    so an allowlist-violating shell spawn is a high-fidelity deterministic signal of adversary code execution
    on a mobile device. Maintain an allowlist of application bundle IDs from the UEM application catalog
    that are genuinely authorized to spawn shell processes, ingest MTD process logs into the SIEM, and
    fire a high-severity alert whenever a canonical shell/superuser process name is created by a parent
    app bundle ID absent from the allowlist. A positive hit means an app whose declared role is inconsistent
    with shell capability ran one of the canonical Android command-execution primitives and warrants triage;
    a clean result across the fleet narrows the hunt but does not rule out allowlisted-app abuse. Keep
    this rule deterministic and never replace it with probabilistic scoring. References: [Execute This!
    Analyzing Unsafe and Malicious Dynamic Code Loading in Android Applications](https://sites.cs.ucsb.edu/~vigna/publications/2014_NDSS_ExecuteThis.pdf);
    [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - MTD.ProcessEvents
  - UEM.AppInventoryLogs
  - 'NAI: Corporate Mobile Device Management (MDM) Platform; Mobile Threat Defense (MTD) Cloud Console;
    SIEM Log Aggregator.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from MTD.ProcessEvents

      where process_name in (''sh'',''bash'',''zsh'',''toybox'',''toolbox'',''su'')

      join UEM.AppInventoryLogs on parent_app_bundle_id

      where parent_app_bundle_id not in (shell_allowlist)

      emit alert(severity=''high'', app=parent_app_bundle_id, proc=process_name, device=device_id)'
- question: 'When an unapproved app spawned a shell or `su` process on Android, was there a co-occurring
    kernel-audit `avc: denied` SELinux record for that same app domain?'
  context: 'On Android, SE Android type enforcement produces an explicit `avc: denied` record when an
    app domain attempts shell/`su` actions it is not permitted, giving a deterministic first-party on-device
    confirmation of unauthorized superuser/shell behavior even on a non-rooted device. For the Execution
    tactic, correlating a shell/`su` spawn event with an SELinux denial for the same domain within a tight
    time window sharply raises confidence that the activity is malicious rather than a benign privileged
    operation. A shell/`su` spawn co-occurring with an `avc: denied` should be treated as critical; the
    absence of a denial does not clear the event because rooted devices may have permissive policy. References:
    [Security Enhanced (SE) Android: Bringing Flexible MAC to Android](https://www.ndss-symposium.org/wp-content/uploads/2017/09/02_4.pdf).'
  answer_sources:
  - MTD.ProcessEvents
  - UEM.AppInventoryLogs
  - 'NAI: Corporate Mobile Device Management (MDM) Platform; Mobile Threat Defense (MTD) Cloud Console;
    SIEM Log Aggregator.'
  range: Last 90 days; correlate within +/- 5 seconds of the shell/su spawn event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from MTD.ProcessEvents as p\nwhere p.process_name in ('sh','su','toybox','toolbox')\njoin\
      \ kernel_audit as k on k.app_domain = p.app_domain\n  and abs(k.timestamp - p.timestamp) <= 5s and\
      \ k.msg matches 'avc: *denied'\nemit alert(severity='critical', app=p.parent_app_bundle_id, denial=k.scontext)"
- question: For each application, does the daily shell-execution count for a user exceed 3 standard deviations
    above its 30-day historical mean, or does post-execution outbound data volume (bytes_out) exceed the
    per-app 99th percentile?
  context: 'Adversary shell abuse often manifests as an abrupt jump in execution frequency or data egress
    relative to an app''s normal behavior. For the Execution tactic, statistically baselining per-app,
    per-user shell frequency (count/min and count/day) and post-exec bytes_out over 30 days lets the analyst
    flag deviations that static rules miss. Alert when daily shell-execution count exceeds mean+3sigma
    or when post-exec bytes_out exceeds the per-app 99th percentile, and add CUSUM/PELT change-point tests
    to catch abrupt onset rather than only static thresholds. A breach indicates anomalous device state
    worth investigating; normal counters suggest the app is behaving within its established envelope.
    References: ["Andromaly": a behavioral malware detection framework for Android devices](https://link.springer.com/article/10.1007/s10844-010-0148-x);
    [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - MTD.ProcessEvents
  - UEM.AppInventoryLogs
  - 'NAI: Corporate Mobile Device Management (MDM) Platform; Mobile Threat Defense (MTD) Cloud Console;
    SIEM Log Aggregator.'
  range: Last 90 days; 30-day rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from MTD.ProcessEvents where process_name in (''sh'',''bash'',''su'',''toybox'',''toolbox'')

      stats count() as daily_execs, sum(bytes_out) as post_exec_bytes by app, user, day

      compute mean(daily_execs), stdev(daily_execs), p99(post_exec_bytes) per app over 30d

      where daily_execs > mean + 3*stdev or post_exec_bytes > p99

      apply changepoint(daily_execs, method=''CUSUM|PELT'')

      emit alert(app, user, daily_execs, post_exec_bytes)'
- question: Does a supervised classifier scoring shell-execution events (using parent process/package,
    app signature/source, is-system-app, command entropy, parent-child prevalence, user role) label any
    event as malicious with probability greater than 0.9?
  context: 'Symbolic rules and thresholds miss novel or subtle shell abuse, so a supervised model trained
    on labeled benign and malicious historical MTD shell-execution events can generalize across the feature
    space. For the Execution tactic, engineer features (parent process/package, app signature/source,
    is-system-app boolean, command entropy, parent-child prevalence, user role), train a Random Forest,
    and alert on predicted probability above 0.9. Critically, emit the top-3 contributing features (e.g.,
    exec-API present, command entropy, parent-child rarity) in the alert text for explainability so the
    analyst can validate the verdict rather than trusting a bare score. Retrain periodically on analyst
    dispositions to limit drift. References: [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf);
    [Deep Learning for Android Malware Defenses](https://arxiv.org/pdf/2103.05292); [XAI and Android Malware
    Models](https://arxiv.org/pdf/2411.16817).'
  answer_sources:
  - MTD.ProcessEvents
  - UEM.AppInventoryLogs
  - 'NAI: Corporate Mobile Device Management (MDM) Platform; Mobile Threat Defense (MTD) Cloud Console;
    SIEM Log Aggregator.'
  range: Last 90 days; model trained on >=6 months historical labeled data
  queries:
  - technology: ML/pseudocode
    query: "features = extract(MTD.ProcessEvents, [parent_pkg, app_signature, is_system_app,\n  command_entropy,\
      \ parent_child_prevalence, user_role])\nmodel = RandomForest.load('shell_exec_clf')\np = model.predict_proba(features)\n\
      where p.malicious > 0.9\nemit alert(score=p.malicious, top_features=explain(model, features, k=3))"
- question: Did any shell command line match high-risk download-cradle or decode patterns (curl ...|sh,
    wget ...|sh, nc -e, base64 -d, chmod ...+x) AND did the device make a concurrent network connection
    to a destination present in threat-intelligence feeds?
  context: 'Download-cradle and decode primitives chained into a shell are documented Android execution
    abuses; pairing a regex match against MTD command-line arguments with a concurrent network connection
    to a known-bad destination produces a high-confidence Execution detection. Deploy a SIEM rule using
    regular expressions for patterns such as `curl .*\|.*sh`, `wget .*\|.*sh`, `nc -e`, `base64 -d`, and
    `chmod .*\+x`, then on a match correlate the event timestamp and device IP with Zeek conn.log/dns.log
    to resolve the destination and alert when it appears in threat-intel feeds. A match with an intel
    hit strongly implies active payload retrieval or C2; a pattern match without an intel hit still merits
    review as obfuscated/risky execution. References: [Execute This!](https://sites.cs.ucsb.edu/~vigna/publications/2014_NDSS_ExecuteThis.pdf);
    [Obfuscated Command Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - MTD.ProcessEvents
  - Zeek conn.log
  - Zeek dns.log
  - ThreatIntel.Feed
  - 'NAI: Network Egress/Ingress points instrumented with Zeek sensors; Corporate DNS infrastructure;
    Mobile Threat Defense (MTD) Cloud Console; SIEM Log Aggregator.'
  range: Last 90 days; correlate network logs within +/- 60 seconds of the command event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from MTD.ProcessEvents\nwhere command_args matches '(curl|wget).*\\|.*sh' or command_args\
      \ matches 'nc -e'\n  or command_args matches 'base64 -d' or command_args matches 'chmod .*\\+x'\n\
      join Zeek_conn on device_ip, time +/-60s ; lookup dst in ThreatIntel.Feed\nwhere dst in ThreatIntel.Feed\n\
      emit alert(severity='high', cmd=command_args, dst=dst, intel=feed_name)"
- question: Do any shell command-line strings exceed the 99th percentile of Shannon entropy (or a static
    ~4.5 bits/char threshold) or show anomalous special-character/digit ratios indicative of obfuscation?
  context: 'Adversaries obfuscate shell commands to evade keyword rules, so measuring the statistical
    structure of command lines exposes encoded or packed payloads that regexes miss. For the Execution
    tactic, compute Shannon entropy, special-character/digit ratios, and token-reuse statistics for all
    MTD shell command strings over a 30-day baseline and alert when a command exceeds the 99th percentile
    of entropy (or ~4.5 bits/char) or shows anomalous character ratios. Layer change-point monitoring
    to catch a sudden fleet-wide shift toward obfuscated commands. High entropy suggests base64/hex/packed
    content worth decoding and review; the explainable features let the analyst justify the alert. References:
    [Obfuscated Command Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/);
    [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - MTD.ProcessEvents
  - Zeek conn.log
  - Zeek dns.log
  - ThreatIntel.Feed
  - 'NAI: Network Egress/Ingress points instrumented with Zeek sensors; Corporate DNS infrastructure;
    Mobile Threat Defense (MTD) Cloud Console; SIEM Log Aggregator.'
  range: Last 90 days; 30-day rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from MTD.ProcessEvents

      eval entropy = shannon(command_args), spc = special_char_ratio(command_args)

      compute p99(entropy) over 30d

      where entropy > p99 or entropy > 4.5 or spc > anomalous_threshold

      apply changepoint(entropy, method=''CUSUM'')

      emit alert(cmd=command_args, entropy=entropy, special_char_ratio=spc)'
- question: After a shell-execution event, is the ratio of failed to successful first-contact outbound
    connections/DNS resolutions (blocked connections, NXDOMAIN, 404/timeouts) statistically high under
    a sequential hypothesis test?
  context: 'Dead or blocked download-cradle and C2 infrastructure produces a burst of failed first-contact
    attempts after execution. For the Execution tactic, treat each first-contact outbound connection/DNS
    resolution following a shell-execution event as a Bernoulli trial and apply Wald''s Sequential Probability
    Ratio Test (SPRT) to the failed-to-successful ratio. SPRT reaches a decision with bounded false-positive/false-negative
    error, so a high failure ratio raises confidence that the device is reaching for unavailable malicious
    infrastructure. Surface the failure ratio and the destinations in the alert so the analyst can pivot
    to the specific dead-drop or C2 candidates. References: [Fast Portscan Detection Using Sequential
    Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  answer_sources:
  - MTD.ProcessEvents
  - Zeek conn.log
  - Zeek dns.log
  - ThreatIntel.Feed
  - 'NAI: Network Egress/Ingress points instrumented with Zeek sensors; Corporate DNS infrastructure;
    Mobile Threat Defense (MTD) Cloud Console; SIEM Log Aggregator.'
  range: Last 90 days; evaluate the window immediately following each shell-exec event
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each shell_exec_event in MTD.ProcessEvents:\n  trials = first_contact_conns(Zeek_conn,\
      \ Zeek_dns, device, after=event.ts)\n  outcome = blocked|NXDOMAIN|404|timeout -> fail else success\n\
      \  SPRT(trials, p0=baseline_fail_rate, p1=elevated_fail_rate, alpha, beta)\n  if decision == 'H1':\
      \ emit alert(fail_ratio, destinations)"
- question: Does a sequence model (LSTM/Transformer) trained on normal command-line strings and execution
    log-key sequences (background app -> ProcessBuilder -> shell -> network) flag any observed sequence
    or argument syntax as improbable/malicious with high confidence?
  context: 'Multi-step shell abuse follows characteristic sequences (e.g., a backgrounded app invoking
    ProcessBuilder, spawning a shell, then reaching the network) that deviate from learned-normal patterns.
    For the Execution tactic, train a sequence model on labeled command-line strings and on log-key sequences
    leading to execution (DeepLog-style, trained on normal logs only) and additionally score obfuscated
    argument syntax with a gradient-boosted classifier. Alert on high-confidence malicious classifications
    and surface the deviating log key / top contributing tokens so the analyst can see which step broke
    from normal. This catches novel execution chains that static rules and single-event scoring miss.
    References: [DeepLog: Anomaly Detection and Diagnosis from System Logs](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf);
    [Obfuscated Command Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - MTD.ProcessEvents
  - Zeek conn.log
  - Zeek dns.log
  - ThreatIntel.Feed
  - 'NAI: Network Egress/Ingress points instrumented with Zeek sensors; Corporate DNS infrastructure;
    Mobile Threat Defense (MTD) Cloud Console; SIEM Log Aggregator.'
  range: Last 90 days; model trained on learned-normal log sequences
  queries:
  - technology: ML/pseudocode
    query: "seq_model = DeepLog.load('exec_logkey_lstm')  # trained on normal only\nfor window in execution_logkey_sequences(MTD.ProcessEvents):\n\
      \  if observed_key not in seq_model.topk(window, k): flag(window)\narg_clf = GradBoost.load('obfusc_cmd_clf')\n\
      where arg_clf.predict_proba(command_args).malicious > 0.9\nemit alert(deviating_logkey, top_tokens=explain())"
- question: Was a superuser binary (`su`) execution logged by MTD for a device that the UEM/MDM platform
    concurrently reports as 'non-rooted' and 'compliant'?
  context: 'A `su` execution on a device that the management plane believes is non-rooted and compliant
    is a direct contradiction that strongly indicates covert rooting or privilege escalation. For the
    Execution tactic, create a critical-severity SIEM rule on any MTD process event where the process
    name is `su`, then trigger a SOAR playbook that queries the UEM/MDM API for real-time compliance/root
    status; if the device is reported compliant and non-rooted, escalate and quarantine. Corroborate with
    the SELinux `avc: denied` audit signal and treat low-privilege app domains driving privileged deputies
    to reach `su` as confused-deputy escalation. A confirmed mismatch is critical; the management plane''s
    clean status is the very thing being subverted, so do not let it suppress the alert. References: [Security
    Enhanced (SE) Android](https://www.ndss-symposium.org/wp-content/uploads/2017/09/02_4.pdf); [Permission
    Re-Delegation: Attacks and Defenses](https://www.usenix.org/legacy/event/sec11/tech/full_papers/Felt.pdf).'
  answer_sources:
  - MTD.ProcessEvents
  - UEM.ComplianceStatusLogs
  - Zeek conn.log
  - 'NAI: Corporate Mobile Device Management (MDM) Platform; Mobile Threat Defense (MTD) Cloud Console;
    SIEM Log Aggregator; SOAR Platform.'
  range: Last 90 days; real-time SOAR enrichment at detection time
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from MTD.ProcessEvents where process_name == ''su''

      trigger SOAR: status = UEM_API.get_compliance(device_id)

      where status.rooted == false and status.compliant == true

      corroborate kernel_audit ''avc: denied'' for app_domain

      emit alert(severity=''critical'', device=device_id); action=quarantine(device_id)'
- question: Across the fleet, does the hourly count of unique devices executing `su` exceed 3 standard
    deviations above the 7-day rolling mean, or show an abrupt change-point onset consistent with a rooting
    campaign?
  context: 'A coordinated rooting or compromise campaign appears as a fleet-wide surge in `su` usage rather
    than a single-device anomaly. For the Execution tactic, aggregate hourly the count of unique devices
    executing `su`, maintain a 7-day rolling mean/standard deviation, and alert when the current count
    exceeds mean+3sigma; layer CUSUM/Bayesian change-point detection to catch abrupt onset faster than
    fixed thresholds. A spike indicates a possible mass-rooting event or supply-chain/app-update compromise
    and should drive fleet-wide scoping; a flat trend suggests `su` usage is at expected background levels.
    References: [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - MTD.ProcessEvents
  - UEM.ComplianceStatusLogs
  - Zeek conn.log
  - 'NAI: Corporate Mobile Device Management (MDM) Platform; Mobile Threat Defense (MTD) Cloud Console;
    SIEM Log Aggregator; SOAR Platform.'
  range: Last 90 days; 7-day rolling baseline, hourly aggregation
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from MTD.ProcessEvents where process_name == ''su''

      stats dc(device_id) as su_devices by hour

      compute mean(su_devices), stdev(su_devices) over trailing 7d

      where su_devices > mean + 3*stdev

      apply changepoint(su_devices, method=''CUSUM|Bayesian'')

      emit alert(hour, su_devices, baseline_mean=mean)'
- question: After a confirmed malicious `su` execution, do other devices cluster together (via DBSCAN
    on post-event telemetry such as child processes, Zeek connections, subsequent MTD alerts, and on-device
    behavioral counters) showing similar post-compromise behavior?
  context: 'Once one malicious `su` execution is confirmed, the priority shifts to scoping how many other
    devices share the same post-compromise fingerprint. For the Execution tactic, collect post-event telemetry
    (child processes from MTD logs, connections from Zeek conn.log, subsequent MTD alerts, on-device behavioral
    counters) and run DBSCAN over a behavioral-feature representation to surface clusters of devices exhibiting
    similar patterns. Report the shared features defining each cluster so the analyst can rapidly identify
    the affected population and the campaign''s signature. Tight clusters indicate common tooling/infrastructure;
    outliers may be unrelated noise. References: ["Andromaly"](https://link.springer.com/article/10.1007/s10844-010-0148-x);
    [Deep Learning for Android Malware Defenses](https://arxiv.org/pdf/2103.05292).'
  answer_sources:
  - MTD.ProcessEvents
  - UEM.ComplianceStatusLogs
  - Zeek conn.log
  - 'NAI: Corporate Mobile Device Management (MDM) Platform; Mobile Threat Defense (MTD) Cloud Console;
    SIEM Log Aggregator; SOAR Platform.'
  range: Last 90 days; window anchored on the confirmed su event and following hours
  queries:
  - technology: ML/pseudocode
    query: "seed = confirmed_malicious_su_event\nfeats = behavioral_features(device, sources=[MTD.child_procs,\
      \ Zeek_conn,\n  MTD.subsequent_alerts, on_device_counters], window=post_event)\nclusters = DBSCAN(eps,\
      \ min_samples).fit(feats)\nemit report(cluster_id, member_devices, shared_features=cluster_signature)"
- question: Did a non-system application invoke a shell-execution API method (java.lang.Runtime.exec(),
    java.lang.ProcessBuilder, or a JNI-backed command launcher) where the calling package is not on the
    allowlist OR the command arguments contain suspicious keywords (su, pm install, wget, curl, base64,
    nc -l -p)?
  context: 'The Java/JNI exec APIs are the precise primitives an Android app uses to launch commands,
    so a non-system app calling them is a direct Execution-tactic indicator. Search MTD.APICallLogs for
    events where method_name is java.lang.Runtime.exec() or java.lang.ProcessBuilder (and JNI-backed launchers)
    and trigger a high-severity alert if source_app_package_name is not allowlisted or if command_arguments
    contains keywords such as su, pm install, wget, curl, base64, or nc -l -p. A non-system app invoking
    these APIs is a suspicious API-call feature; keyword/regex matching follows established obfuscation
    feature sets. A hit indicates likely command execution or payload retrieval and should be triaged
    with the calling app''s provenance. References: [Execute This!](https://sites.cs.ucsb.edu/~vigna/publications/2014_NDSS_ExecuteThis.pdf);
    [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf); [Obfuscated Command
    Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - MTD.APICallLogs
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Managed mobile device fleet; Centralized log aggregator/SIEM; Network egress gateways; VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from MTD.APICallLogs\nwhere method_name in ('java.lang.Runtime.exec()','java.lang.ProcessBuilder')\n\
      \  or method_name matches 'JNI.*exec'\nwhere source_app_package_name not in (allowlist)\n  or command_arguments\
      \ matches '(su|pm install|wget|curl|base64|nc -l -p)'\nemit alert(severity='high', app=source_app_package_name,\
      \ method=method_name, args=command_arguments)"
- question: For each application package, is a shell-execution event statistically rare or obfuscated
    relative to its 30-day baseline (24h count above fleet 99th percentile, argument entropy above mean+3sigma
    or 4.5 bits/char, or a novel command with Jaccard similarity <0.2 versus prior commands)?
  context: 'Even allowlisted exec-API usage can be subverted, so baselining each app''s command behavior
    catches volume, obfuscation, and novelty anomalies. For the Execution tactic, baseline shell command
    execution per app over 30 days and alert if (a) the 24-hour execution count for a device exceeds the
    fleet 99th percentile for that app, (b) command-argument entropy exceeds mean+3sigma or 4.5 bits/char,
    or (c) the command is novel (Jaccard similarity <0.2 versus prior commands or an unseen process-event
    n-gram). Treating unseen short sequences as anomalies is well grounded; a breach in any dimension
    flags the event for review while normal behavior confirms the app is within its envelope. References:
    [Obfuscated Command Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/);
    [A Sense of Self for Unix Processes](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources:
  - MTD.APICallLogs
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Managed mobile device fleet; Centralized log aggregator/SIEM; Network egress gateways; VPN concentrators.'
  range: Last 90 days; 30-day rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from MTD.APICallLogs\nstats count() as c24 by app, device, 24h ; eval entropy=shannon(command_arguments)\n\
      compute p99(c24), mean(entropy), stdev(entropy) per app over 30d\nwhere c24 > p99 or entropy > mean+3*stdev\
      \ or entropy > 4.5\n  or jaccard(command_arguments, prior_commands[app]) < 0.2\nemit alert(app,\
      \ device, c24, entropy)"
- question: In the 5 minutes after a shell-execution API call, is the failed-to-successful ratio of first-contact
    outbound connections/DNS lookups (blocked connections, NXDOMAIN, 404) statistically high under a sequential
    hypothesis test?
  context: 'A shell-execution API call followed by many failed first-contact connections suggests the
    device is reaching dead or blocked cradle/C2 infrastructure. For the Execution tactic, model each
    first-contact connection/DNS lookup in the 5 minutes after the API call as a Bernoulli trial and apply
    Wald''s SPRT to the failed-to-successful ratio (blocked conns, NXDOMAIN, 404). SPRT bounds error rates,
    so a high failure ratio raises confidence that the execution attempted to contact unavailable malicious
    infrastructure. Include the ratio and top destinations in the alert so the analyst can pivot to the
    candidate C2/download hosts. References: [Fast Portscan Detection Using Sequential Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  answer_sources:
  - MTD.APICallLogs
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Managed mobile device fleet; Centralized log aggregator/SIEM; Network egress gateways; VPN concentrators.'
  range: Last 90 days; 5-minute window after each shell-execution API call
