name: 'T1623.001: Unix Shell'
id: a6814e70-b064-4667-bd3c-8b6e22d23fa7
description: 'Investigate adversary abuse of Unix shells on managed mobile endpoints (Android and iOS)
  to run unauthorized commands, scripts, or payloads. Adversaries invoke shell-execution primitives (java.lang.Runtime.exec(),
  java.lang.ProcessBuilder, JNI-backed launchers) or spawn shell/superuser binaries (sh, bash, zsh, toybox,
  toolbox, su) from applications whose declared role is inconsistent with shell capability, often from
  background state and without recent user interaction. This playbook helps an analyst detect shell spawns
  from applications absent from an approved allowlist or present on a deny-list, correlate spawns with
  SELinux/kernel-audit `avc: denied` records and confused-deputy privilege escalation, hunt high-risk
  and obfuscated command lines (curl|sh, wget|sh, nc -e, base64 -d, chmod +x) with regex and Shannon-entropy
  analysis, corroborate concurrent network connections against threat intelligence and post-execution
  egress failure ratios, flag superuser (`su`) execution on devices reported compliant/non-rooted by the
  UEM/MDM platform, and model fleet-wide rooting campaigns. It combines deterministic symbolic-logic rules,
  statistical baselining and change-point detection, and explainable machine-learning models (Random Forest,
  gradient boosting, LSTM/Transformer sequence models, DBSCAN clustering) so the analyst can confirm malicious
  shell execution, quarantine affected devices, and scope the incident across the fleet.'
type: technique
related:
- tactic_id: TA0041
  tactic_name: Execution
