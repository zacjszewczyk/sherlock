name: 'T1481.003: One-Way Communication'
id: 51f3f93d-223c-4d02-aa18-437f7e5c579f
description: 'This playbook helps an analyst investigate whether an adversary is using a legitimate external
  web service as a one-way command-and-control channel against corporate mobile devices (MITRE ATT&CK
  T1481.003, One-Way Communication). In this tradecraft a compromised Android or iOS device retrieves
  commands hosted on popular websites and social media (social, paste, code-hosting, cloud-storage, or
  messaging platforms) without sending return output to that same service, hiding inside the SSL/TLS-encrypted
  noise of normally trusted destinations. The hunt pursues this behavior from several complementary angles
  across network and mobile telemetry: matching app-attributed beaconing to known one-way C2 domains and
  TLS client fingerprints (JA3/JA4/JA4H); detecting low-jitter, inbound-dominant beacon cadences to a
  single service with small outbound payloads; flagging raw-content/dead-drop URL access (/raw/, /blob/,
  gists, high-entropy paths) by non-browser user agents, including SNI/Host mismatch indicative of domain
  fronting; and asserting one-way retrieval with no corresponding writeback while the device is backgrounded,
  locked, or without recent user interaction. Detection methods combine deterministic symbolic-logic correlation
  rules, statistical baselining and periodicity analysis (FFT/autocorrelation, Lomb-Scargle, coefficient-of-variation/MAD
  scoring, URI Shannon entropy, rare-feature percentile bands, and failed-fetch profiling for rotated
  dead-drops), and machine learning (LSTM/transformer sequence models for randomized cadences, per-device/per-app
  autoencoders such as Kitsune, and supervised HTTP/flow classifiers such as CorrNetDroid with SHAP feature
  attribution), so the analyst can corroborate suspected one-way C2 against app-identity, device-state,
  and network-directionality context. Source platforms: Android, iOS.'
type: technique
