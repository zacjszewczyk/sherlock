questions:
- question: '[Command and Control] Match beaconing to known one-way C2 domains and fingerprints: Can you
    determine, using the ''Match beaconing to known one-way C2 domains and fingerprints'' (Symbolic Logic)
    approach, whether an adversary is using a legitimate external web service as a one-way command-and-control
    channel against a corporate mobile device (T1481.003, One-Way Communication)? This evidence centers
    on the following condition: A corporate mobile device exhibits C2-like network beaconing from a non-browser
    application. Network traffic shows connections to a single web-service domain with extremely low timing
    jitter (e.g., inter-arrival stddev < 5 seconds or coefficient of variation < 0.1), consistently small
    outbound payloads (e.g., 95th percentile orig_bytes < 1KB), and a high inbound-to-outbound byte ratio
    (e.g., inbound:outbound > 10:1) consistent with one-way retrieval. This automated, non-interactive
    cadence is distinct from user browsing and correlates with background app activity (AppState=background,
    DeviceLockState=locked, large LastUserInteractionDelta) for an app identified in MDM/EDR logs. Derive
    per-environment thresholds from a 30-day baseline of benign per-(device,app,destination) flow tuples;
    also count failed/blocked connections and HTTP 4xx separately as distinct failed-poll signals.'
  context: 'Why this matters: Under the Command and Control tactic (TA0037), an adversary may abuse an
    existing, legitimate external web service (social media, paste sites, code repositories, cloud storage,
    or messaging platforms) to send commands to a compromised mobile device without receiving return output
    -- the defining one-way pattern of T1481.003 (One-Way Communication). Because hosts routinely communicate
    with these popular services and the traffic is wrapped in SSL/TLS, malicious retrieval blends into
    expected noise, so detection must lean on directionality, cadence, app attribution, and device-runtime
    context rather than payload alone. This evidence focuses on the following condition: A corporate mobile
    device exhibits C2-like network beaconing from a non-browser application. Network traffic shows connections
    to a single web-service domain with extremely low timing jitter (e.g., inter-arrival stddev < 5 seconds
    or coefficient of variation < 0.1), consistently small outbound payloads (e.g., 95th percentile orig_bytes
    < 1KB), and a high inbound-to-outbound byte ratio (e.g., inbound:outbound > 10:1) consistent with
    one-way retrieval. This automated, non-interactive cadence is distinct from user browsing and correlates
    with background app activity (AppState=background, DeviceLockState=locked, large LastUserInteractionDelta)
    for an app identified in MDM/EDR logs. Derive per-environment thresholds from a 30-day baseline of
    benign per-(device,app,destination) flow tuples; also count failed/blocked connections and HTTP 4xx
    separately as distinct failed-poll signals. The ''Match beaconing to known one-way C2 domains and
    fingerprints'' approach (Symbolic Logic) works as follows: Correlate Zeek dns.log/ssl.log SNI and
    proxy logs with MDM app attribution to identify the source app. Alert when the destination matches
    known one-way C2 indicators OR the TLS client stack is a non-mobile-browser/known-implant fingerprint
    via [JA3](https://github.com/salesforce/ja3) and version-resilient [JA4/JA4H](https://github.com/FoxIO-LLC/ja4),
    and the app is not an allowlisted browser. Treat unmanaged or out-of-MDM-baseline apps performing
    background retrieval as high severity. A positive result -- a rule match, statistical outlier, or
    model alert -- indicates probable one-way C2 over a legitimate web service from a corporate mobile
    device; pivot to the responsible app identity (resolve it through MDM/EDR attribution to a managed-app
    bundle and device/user), the destination service class and endpoint, the observed cadence and inbound/outbound
    byte ratio, the device runtime state (background/locked/last-user-interaction) at the time of retrieval,
    and any downstream local effects to scope intent and impact. A negative result helps rule out this
    particular vector but should be corroborated with the other questions in this playbook, since a single
    method can miss stealthy, low-and-slow, randomized-cadence, or TLS-opaque one-way channels.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - MDM/VPN mobile proxy app network logs
  - MobileEDR application-state telemetry
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi access points, VPN concentrators, network egress points (Internet gateways),
    and the corporate Mobile Device Management (MDM) platform.'
  range: Last 90 days (correlate event-centered windows around the activity, e.g. 1-hour beacon-aggregation
    windows, 5-minute flow aggregates, and 30-day baselines for per-(device,app,destination) profiling)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match beaconing to known one-way C2 domains and fingerprints (Symbolic Logic)

      inputs: Zeek conn.log, Zeek ssl.log, Zeek dns.log, MDM/VPN mobile proxy app network logs, MobileEDR
      application-state telemetry, Threat intelligence indicators

      scope/NAI: Corporate Wi-Fi access points, VPN concentrators, network egress points (Internet gateways),
      and the corporate Mobile Device Management (MDM) platform.

      logic: Correlate Zeek dns.log/ssl.log SNI and proxy logs with MDM app attribution to identify the
      source app. Alert when the destination matches known one-way C2 indicators OR the TLS client stack
      is a non-mobile-browser/known-implant fingerprint via [JA3](https://github.com/salesforce/ja3) and
      version-resilient [JA4/JA4H](https://github.com/FoxIO-LLC/ja4), and the app is not an allowlisted
      browser. Treat unmanaged or out-of-MDM-baseline apps performing background retrieval as high severity.

      emit: high-priority alert with supporting fields (app identity -> managed-app/device/user, destination
      service class/endpoint, cadence, inbound:outbound byte ratio, device runtime state, contributing
      features/timeline) for analyst triage.'
