- question: '[Command and Control] Flag raw-content / dead-drop access with non-browser agents: Can you
    determine, using the ''Flag raw-content / dead-drop access with non-browser agents'' (Symbolic Logic)
    approach, whether an adversary is using a legitimate external web service as a one-way command-and-control
    channel against a corporate mobile device (T1481.003, One-Way Communication)? This evidence centers
    on the following condition: A mobile device sends an HTTP/S request to a legitimate web service (paste
    site, code repository, social/cloud platform) with multiple one-way-C2 / dead-drop characteristics:
    a URI path with high Shannon entropy (> 3.5) or raw-content keywords (''/raw/'', ''/blob/'', gist),
    an unusual HTTP method for that site, an absent Referer, a non-mobile-browser User-Agent, a TLS client
    signature (JA3/JA4) inconsistent with standard mobile browsers, and a server response Content-Type
    (e.g., ''text/plain'') mismatched with the site''s typical interactive content. Inbound-heavy retrieval
    with no corresponding writeback (POST/PUT/upload/message-send) to the same service class strengthens
    the one-way assessment.'
