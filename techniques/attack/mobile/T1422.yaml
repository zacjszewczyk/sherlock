name: 'T1422: System Network Configuration Discovery'
id: 82c31852-4d91-4ded-b719-0889ddae1421
description: Investigate whether an adversary is performing System Network Configuration Discovery on
  corporate-managed Android and iOS mobile devices to enumerate network configuration and settings (local
  IP/MAC addresses, interface names, link properties, proxy/DNS settings, and telephony identifiers such
  as IMSI, IMEI, and phone number) in order to shape follow-on behaviors during automated discovery. This
  playbook helps a SOC analyst hunt for non-system, non-carrier, or non-default-SMS apps that request
  or are granted the privileged READ_PRIVILEGED_PHONE_STATE permission on Android 10+, SELinux/SEAndroid
  denials for network/telephony state reads, taint source-to-sink flows where identifiers reach a network
  sink, high-frequency bursts of java.net.NetworkInterface (and TelephonyManager/ConnectivityManager)
  API calls relative to per-app baselines, anomalous API call sequences and state transitions modeled
  as Markov chains or LSTM sequences, and suspicious post-install egress to rare or high-entropy destinations.
  Detection methods span symbolic logic, statistical baselining, and machine learning across MDM/MTD logs,
  mobile EDR API-call telemetry, and Zeek network logs so analysts can determine whether discovery activity
  is automated reconnaissance preceding exfiltration or command-and-control rather than routine connectivity
  checks.
type: technique
related:
- tactic_id: TA0032
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: On an MDM-managed Android 10+ device, did a non-system, non-carrier, non-default-SMS, or non-device/profile-owner
    application request and receive the READ_PRIVILEGED_PHONE_STATE permission that is not on the approved
    allow list?
  context: 'Discovery on mobile frequently starts with an app reaching for privileged telephony identifiers
    (IMSI, IMEI, phone number). Android 10+ restricts READ_PRIVILEGED_PHONE_STATE to preloaded, carrier,
    default-SMS, or device/profile-owner apps, so any other grantee is anomalous. Build an explicit allow
    list of authorized package names and run a SIEM rule over MDM/MTD permission-grant events; trigger
    a high-severity alert when the grantee is not on the list. Permissions are strong discriminative features
    for malicious apps (Drebin); revalidate the allow list and permission semantics on each Android release
    because permission meaning drifts over time. A positive hit means an unauthorized app can read network/telephony
    configuration and is a prime candidate for sandboxing and removal; a negative result lowers but does
    not eliminate suspicion. This maps to Discovery: the adversary is orienting to the device''s network/telephony
    configuration to plan follow-on actions.'
  answer_sources:
  - Mobile Threat Defense (MTD) application scan logs
  - Mobile Device Management (MDM) policy compliance logs
  - SELinux/SEAndroid avc audit (denial) logs
  - Zeek conn.log
  - 'NAI: Corporate-managed Android mobile device fleet; MDM/MTD management servers; Network egress points
    and VPN concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'grants = mdm_mtd_logs(event=permission_grant, permission=''READ_PRIVILEGED_PHONE_STATE'');

      allow = feed[''priv_phone_state_allowlist''];  // preloaded/carrier/default-SMS/device-owner pkgs

      alert HIGH when grants.package not in allow;

      output device_id, package, signer, grant_time, android_version'
- question: Did SEAndroid mandatory access control deny an untrusted_app domain read access to network
    or telephony resources (system property, netlink, or telephony service)?
  context: 'Where SEAndroid MAC confines untrusted app domains, a kernel `avc: denied` record is an explicit,
    deterministic detection signal that an app attempted to read network/telephony state it was not authorized
    to access. Ship these audit records to the SIEM and alert when an untrusted_app domain is denied read
    on a network/telephony-related resource. A denial means an app actively probed for configuration it
    should not touch, indicating discovery intent even when the read was blocked; clusters of denials
    from one package strengthen the case. This supports Discovery by exposing reconnaissance attempts
    at the MAC policy boundary.'
  answer_sources:
  - Mobile Threat Defense (MTD) application scan logs
  - Mobile Device Management (MDM) policy compliance logs
  - SELinux/SEAndroid avc audit (denial) logs
  - Zeek conn.log
  - 'NAI: Corporate-managed Android mobile device fleet; MDM/MTD management servers; Network egress points
    and VPN concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "avc = selinux_avc_logs(result='denied');\nalert when avc.scontext like 'untrusted_app%'\n\
      \      and avc.operation in ('read')\n      and avc.tclass in ('property_service','netlink_socket','service_manager','file')\n\
      \      and avc.target matches network|telephony|net|radio;\noutput device_id, scontext, tclass,\
      \ target, count by package"
- question: On instrumented or managed devices, did network/telephony identifiers (MAC, local IP, IMEI,
    IMSI, phone number) read via privileged APIs subsequently reach a network sink?
  context: The canonical discover-then-exfiltrate pattern is reading a device/network identifier and sending
    it off-device. Apply taint source-to-sink rules (TaintDroid-style) that deterministically flag when
    an identifier obtained from a privileged API flows into a network sink (socket, HTTP request). A positive
    flow is high-confidence evidence that discovery is being weaponized for exfiltration or C2 staging
    rather than benign local use; the source API and destination sink give immediate triage leads. This
    ties directly to Discovery feeding later collection/exfiltration in the adversary's workflow.
  answer_sources:
  - Mobile Threat Defense (MTD) application scan logs
  - Mobile Device Management (MDM) policy compliance logs
  - SELinux/SEAndroid avc audit (denial) logs
  - Zeek conn.log
  - 'NAI: Corporate-managed Android mobile device fleet; MDM/MTD management servers; Network egress points
    and VPN concentrators'
  range: Last 90 days
  queries:
  - technology: TaintTracker/pseudocode
    query: "sources = {getDeviceId, getSubscriberId, getLine1Number, NetworkInterface.getHardwareAddress,\n\
      \           NetworkInterface.getInetAddresses};\nsinks = {Socket.write, URLConnection, HttpClient,\
      \ DatagramSocket};\nalert when taint_flow(source in sources -> sink in sinks) within same app process;\n\
      output device_id, package, source_api, sink, dest_host"
- question: After a READ_PRIVILEGED_PHONE_STATE grant alert, did the device connect to a rare or never-before-seen
    destination, or show a spike in failed/blocked/reset connections?
  context: Privilege grant followed by anomalous egress is a strong discover-then-act signal. For each
    grant alert, correlate the device IP (id.orig_h) with Zeek conn.log within a +/-15-minute window.
    Compute 30-day historical prevalence of each destination IP/port pair across the mobile subnet and
    flag connections to destinations seen by <1% of devices or never seen before. Track total volume (orig_bytes+resp_bytes)
    and, as a distinct failure-mode signal, profile the rate of failed/blocked/reset connections (conn_state
    S0/REJ/RSTO), which often spikes during C2 setup, against benign-trained one-class baselines. A rare
    destination or failure spike shortly after a privilege grant indicates the app may be reporting discovery
    results to attacker infrastructure. This advances Discovery into the C2/exfiltration phase.
  answer_sources:
  - Mobile Threat Defense (MTD) application scan logs
  - Mobile Device Management (MDM) policy compliance logs
  - SELinux/SEAndroid avc audit (denial) logs
  - Zeek conn.log
  - 'NAI: Corporate-managed Android mobile device fleet; MDM/MTD management servers; Network egress points
    and VPN concentrators'
  range: Last 90 days; center correlation on grant event +/-15 minutes
  queries:
  - technology: Zeek/Stats pseudocode
    query: "for grant in grant_alerts:\n  flows = conn.log where id.orig_h == grant.device_ip\n      \
      \    and ts in [grant.time-15m, grant.time+15m];\n  prev = prevalence_30d(id.resp_h, id.resp_p)\
      \ over mobile_subnet;\n  alert when prev < 0.01 or never_seen(id.resp_h,id.resp_p);\n  fail_rate\
      \ = count(conn_state in S0,REJ,RSTO)/count(*);\n  alert when fail_rate > oneclass_baseline;\n  output\
      \ device_ip, resp_h, resp_p, orig_bytes+resp_bytes, conn_state"
- question: Which apps requesting privileged network/telephony access score as high-risk under an explainable
    classifier trained on MDM/MTD metadata and static features?
  context: 'Beyond single-rule allow-listing, an explainable ML model can risk-rank apps that request
    privileged access. Train a linear SVM or gradient-boosting classifier on MDM/MTD metadata and static
    features: app category, developer reputation, install source, one-hot permission set, and restricted/suspicious
    API usage. Surface the top-3 contributing features (e.g., READ_PRIVILEGED_PHONE_STATE, getDeviceId,
    network endpoint) in the alert via model weights or SHAP/LIME, and escalate apps above a calibrated
    threshold (e.g., >0.85) for sandboxing. Validate time-aware with realistic malware base rates and
    retrain periodically to counter concept drift (TESSERACT). A high score with telltale features focuses
    analyst attention on the riskiest discovery-capable apps. This supports Discovery by proactively identifying
    tools built to enumerate configuration.'
  answer_sources:
  - Mobile Threat Defense (MTD) application scan logs
  - Mobile Device Management (MDM) policy compliance logs
  - SELinux/SEAndroid avc audit (denial) logs
  - Zeek conn.log
  - 'NAI: Corporate-managed Android mobile device fleet; MDM/MTD management servers; Network egress points
    and VPN concentrators'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "feat = features(app): [category, dev_reputation, install_source,\n                       onehot(permissions),\
      \ restricted_api_usage];\nmodel = train(LinearSVM|GBM, labels=known_benign/malicious, time_aware=True);\n\
      score = model.predict_proba(feat);\nexplain = top3(SHAP|LIME, feat);\nescalate to sandbox when score\
      \ > 0.85;\noutput package, score, explain"
- question: Did a call to java.net.NetworkInterface (or TelephonyManager/ConnectivityManager network-state
    APIs) originate from an app whose package name or signing-certificate hash matches a threat-intelligence
    feed of known malware?
  context: 'Network-state API calls from known-bad apps are first-class malicious-app indicators (Drebin).
    Generate an immediate alert when a NetworkInterface/TelephonyManager/ConnectivityManager call comes
    from an app whose package name or signing-cert hash matches a malware threat-intel feed. A match is
    high-confidence malicious discovery activity and warrants immediate containment of the device and
    app; absence does not clear novel/unknown malware. This maps to Discovery: known malware enumerating
    network interfaces to orient itself on the device.'
  answer_sources:
  - Mobile EDR/MTD API call monitoring logs
  - Zeek conn.log
  - 'NAI: Mobile devices with EDR/MTD agents installed, especially those used by high-value targets; EDR/MTD
    management servers; Network traffic monitoring points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "calls = edr_api_logs(api in ['java.net.NetworkInterface','TelephonyManager.*',\n         \
      \                     'ConnectivityManager.*']);\nbad = feed['known_malware_pkgs_and_signer_hashes'];\n\
      alert when calls.package in bad or calls.signer_hash in bad;\noutput device_id, package, signer_hash,\
      \ api, ts"
- question: Did an app generate a high-frequency burst of java.net.NetworkInterface calls that exceeds
    its own historical baseline (e.g., 99th percentile or mean+3 sigma per one-minute interval)?
  context: Automated discovery shows up as abnormal call frequency. Ingest java.net.NetworkInterface call
    counts from MTD logs into a time-series store aggregated per app per device per one-minute interval,
    establish a 30-day rolling baseline (mean, std) per app-version (versioning absorbs post-update behavior
    change), and alert at medium severity when interval frequency exceeds the 99th percentile or mean+3
    sigma. Behavioral package-level abstraction is drift-resilient and stable for baselining (MaMaDroid).
    A burst far above an app's normal rate suggests scripted enumeration of interfaces rather than occasional
    connectivity checks. This supports Discovery by catching the rapid, repeated reads characteristic
    of automated reconnaissance.
  answer_sources:
  - Mobile EDR/MTD API call monitoring logs
  - Zeek conn.log
  - 'NAI: Mobile devices with EDR/MTD agents installed, especially those used by high-value targets; EDR/MTD
    management servers; Network traffic monitoring points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "counts = bucket(edr_api_logs[api='java.net.NetworkInterface'],\n                by=[app_version,device],\
      \ window=1m);\nbase = rolling_30d(mean,std) per app_version;\nalert MED when counts.freq > max(p99(base),\
      \ base.mean + 3*base.std);\noutput device_id, package, app_version, interval, freq"
- question: Do an app's API call-sequence transition probabilities into network-discovery states (NetworkInterface,
    TelephonyManager, ConnectivityManager) deviate sharply from the population or historical model?
  context: Frequency alone misses ordering; modeling sequence captures intent. Build per-app Markov chains
    over package/family-abstracted API call sequences and compute the transition probability into network-discovery
    calls. Flag apps whose probability of transitioning into these discovery states deviates sharply from
    the population or the app's own historical model, capturing state as well as frequency (MaMaDroid).
    An app that suddenly funnels its execution into network-discovery calls is behaving anomalously and
    may have been compromised or be malicious. This supports Discovery by detecting shifts in behavior
    toward configuration enumeration.
  answer_sources:
  - Mobile EDR/MTD API call monitoring logs
  - Zeek conn.log
  - 'NAI: Mobile devices with EDR/MTD agents installed, especially those used by high-value targets; EDR/MTD
    management servers; Network traffic monitoring points'
  range: Last 90 days
  queries:
  - technology: Stats/Markov pseudocode
    query: 'seq = abstract_to_family(edr_api_logs.call_sequence per app);

      M = markov_transition_matrix(seq);

      p_disc = M[*][{NetworkInterface,TelephonyManager,ConnectivityManager}];

      alert when p_disc deviates >k*sigma from population/historical baseline;

      output package, p_disc, baseline, delta'
- question: For high-value users/devices, do API-call event streams contain sequences whose predicted
    probability or reconstruction error deviate from an LSTM model of normal temporal behavior?
  context: For high-value targets, train an LSTM sequence model on 60-90 days of historical API-call event
    streams (including java.net.NetworkInterface) so it learns normal temporal patterns; flag events whose
    predicted probability falls outside the top-g candidates or whose reconstruction error exceeds a tuned
    threshold (DeepLog). Surface the top-3 deviating call types in the alert and support online incremental
    updates from analyst feedback; validate time-aware to avoid temporal bias (TESSERACT). Anomalous sequences
    involving network-discovery APIs indicate the app is doing something it normally would not, a hallmark
    of injected discovery behavior. This supports Discovery by catching subtle, sequence-level reconnaissance
    on the most sensitive devices.
  answer_sources:
  - Mobile EDR/MTD API call monitoring logs
  - Zeek conn.log
  - 'NAI: Mobile devices with EDR/MTD agents installed, especially those used by high-value targets; EDR/MTD
    management servers; Network traffic monitoring points'
  range: Last 90 days; train on 60-90 day baseline
  queries:
  - technology: ML/LSTM pseudocode
    query: "model = LSTM.train(api_event_streams[high_value_devices], window=60-90d);\nfor ev in stream:\n\
      \  p = model.predict_next(context);\n  alert when ev not in top_g(p) or reconstruction_error(ev)\
      \ > thr;\n  explain = top3_deviating_call_types(ev);\nonline_update(model, analyst_feedback);\n\
      output device_id, package, ev, explain"
- question: Within five minutes of a new app installation, did the device connect to a destination domain
    or IP that matches a threat-intelligence feed of known malicious infrastructure?
  context: Freshly installed apps that immediately phone home to known-bad infrastructure are a strong
    compromise signal. Correlate MDM/MTD app-installation logs with Zeek dns.log and conn.log on device
    identifier and timestamp; for any connection within five minutes of an install, check the destination
    domain (query) and IP (id.resp_h) against a malicious-infrastructure feed and trigger a critical alert
    on any match. Pair with taint source-to-sink confirmation that device/network identifiers reached
    the destination. A match means a newly installed app is communicating with attacker infrastructure
    right after enumerating the device, indicating discovery feeding exfiltration/C2. This maps Discovery
    into the broader intrusion lifecycle.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - MDM/MTD application install logs
  - 'NAI: Organization''s network egress points (e.g., internet gateway, VPN concentrators); DNS resolvers;
    MDM management servers'
  range: Last 90 days; correlate within 5 minutes of install event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "installs = mdm_mtd_logs(event=app_install);\nfor i in installs:\n  flows = join(dns.log, conn.log)\
      \ where device==i.device\n          and ts in [i.time, i.time+5m];\n  bad = feed['malicious_infra'];\n\
      \  alert CRIT when flows.query in bad or flows.id.resp_h in bad;\n  confirm via taint_flow(identifier\
      \ -> dest);\n  output device, package, query, resp_h, ts"
- question: Within five minutes of a new app installation, did the device connect to a high-entropy domain
    (Shannon entropy > 3.5) combined with a low-prevalence destination IP (seen by <1% of the fleet),
    or show a rising NXDOMAIN/failed-resolution ratio?
  context: DGA and tunneling-based C2 produce algorithmically random domains and rare IPs. For DNS queries
    from the mobile subnet, compute Shannon entropy of the second-level domain (query) and maintain a
    30-day prevalence baseline of destination IPs (id.resp_h). Within 5 minutes of a new install, alert
    when a connection involves both a high-entropy domain (>3.5) and a low-prevalence IP (<1% of fleet).
    As a distinct failure-mode signal, profile the per-device NXDOMAIN/failed-resolution ratio, which
    rises during DGA/tunneling-based C2; use stateless lexical features with Isolation Forest for real-time
    scoring. A high-entropy, rare-IP connection right after install suggests automated C2 following discovery;
    an NXDOMAIN spike suggests DGA beaconing. This supports Discovery transitioning to covert C2.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - MDM/MTD application install logs
  - 'NAI: Organization''s network egress points (e.g., internet gateway, VPN concentrators); DNS resolvers;
    MDM management servers'
  range: Last 90 days; correlate within 5 minutes of install event
  queries:
  - technology: Zeek/Stats pseudocode
    query: "for q in dns.log[mobile_subnet]:\n  ent = shannon_entropy(sld(q.query));\n  prev = prevalence_30d(id.resp_h);\n\
      \  if install_within_5m(q.device) and ent > 3.5 and prev < 0.01:\n     alert(device, query, resp_h,\
      \ ent, prev);\n  nx_ratio = nxdomain(device)/total_queries(device);\n  iforest_score = isoforest(lexical_features(query));\n\
      \  alert when nx_ratio rising or iforest_score outlier"
- question: Do normalized post-install Zeek conn.log feature vectors for the fleet contain outlier/noise
    flows under density-based clustering or a benign-trained one-class model?
  context: 'Unsupervised modeling catches novel C2 that signatures miss. Apply density-based clustering
    (DBSCAN) or a benign-trained one-class model (Isolation Forest / OCSVM) to normalized Zeek conn.log
    feature vectors for the fleet: destination port (id.resp_p), protocol (proto), duration, volume (orig_bytes,
    resp_bytes and their ratio), and connection state (conn_state). Treat noise/outlier flows as suspect
    C2 following discovery, training on known-good traffic to handle scarce malware labels, and use LIME/feature
    attributions to surface the top-3 contributing features (e.g., rare destination, byte volume, port)
    in each alert. An outlier flow shortly after install indicates an app communicating abnormally after
    enumerating the device. This supports Discovery by exposing the network footprint of post-reconnaissance
    C2.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - MDM/MTD application install logs
  - 'NAI: Organization''s network egress points (e.g., internet gateway, VPN concentrators); DNS resolvers;
    MDM management servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = normalize(conn.log features: [id.resp_p, proto, duration,\n    orig_bytes, resp_bytes,\
      \ byte_ratio, conn_state]);\nmodel = DBSCAN(X) | IsolationForest/OCSVM.train(known_good);\noutliers\
      \ = noise_points(model) | model.predict(X)==anomaly;\nexplain = top3(LIME, outlier);\noutput device,\
      \ resp_h, resp_p, bytes, conn_state, explain"
