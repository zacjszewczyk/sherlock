questions:
- question: Are there any successful EMM/MDM or cloud device-management console administrative logins
    that originate from a source IP listed on a threat-intelligence feed, or whose HTTP user-agent matches
    known offensive/admin tooling?
  context: 'Tied to the Discovery tactic: an adversary who has obtained admin credentials will authenticate
    to the device-management control plane before issuing location queries. This deterministic rule fires
    on the highest-confidence indicators - a source IP that already appears on a curated threat-intel
    indicator list, or a user-agent string in Zeek http.log/console logs matching known offensive tooling.
    A positive result is a near-certain compromise signal and should be treated as critical regardless
    of any ML anomaly score; a negative result does not clear the account but shifts attention to the
    behavioral and statistical checks. Maintain this rule continuously and independently of model scoring
    so it cannot be silenced by model drift or poisoning. This deterministic rule follows the rare-API/identity
    rule patterns described in [Detecting Threats in AWS CloudTrail Logs Using Machine Learning, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources:
  - EMM/MDM admin audit logs
  - Identity provider sign-in logs
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - Zeek notice.log
  - Windows Security Event Logs
  - Threat intelligence indicators
  - 'NAI: EMM/MDM web application servers, Authentication servers (e.g., Domain Controllers), Network
    egress points and web proxies, Administrative workstations and VDI environments, Cloud Identity Provider
    (IdP) consoles and logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "alert if event=ConsoleAdminLogin AND result=success\n  AND (src_ip IN threat_intel_indicators\
      \ OR http.user_agent IN offensive_tool_signatures)\n  => severity=critical  // deterministic; runs\
      \ independent of ML\n"
  - technology: Zeek/pseudocode
    query: "ssl.log JOIN http.log ON uid\n  WHERE service=mdm_console\n  AND (ja3 IN rare_ja3 OR http.user_agent\
      \ IN offensive_tool_signatures)\n  => raise notice\n"
- question: Do any pair of successive successful admin logins imply physically impossible travel, or does
    any login originate from a country/ASN that is infrequent or never-before-seen for that administrator?
  context: 'Tied to the Discovery tactic: credential theft frequently surfaces as a login from a geography
    the legitimate admin cannot have reached in the elapsed time. For each administrator, order successful
    logins by timestamp, geolocate each source IP, and compute the implied travel velocity between consecutive
    logins; flag any velocity that is physically impossible while excluding known VPN and trusted corporate
    egress IPs to suppress false positives. Separately, flag logins from a country or ASN that falls outside
    the user''s historical set. A positive result indicates the credentials are likely being used from
    two locations, one of them adversarial; a negative result is consistent with normal, geographically
    stable admin behavior. The implied-travel-velocity computation follows [Impossible Travel Detection
    (WO2018085161A1), Microsoft](https://patents.google.com/patent/WO2018085161A1/en), and the infrequent-country/ASN
    logic follows [Anomaly Detection Policies, Microsoft Defender for Cloud Apps](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy).'
  answer_sources:
  - EMM/MDM admin audit logs
  - Identity provider sign-in logs
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - Zeek notice.log
  - Windows Security Event Logs
  - Threat intelligence indicators
  - 'NAI: EMM/MDM web application servers, Authentication servers (e.g., Domain Controllers), Network
    egress points and web proxies, Administrative workstations and VDI environments, Cloud Identity Provider
    (IdP) consoles and logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each admin: order successful_logins by time\n  for consecutive (a,b):\n    v = geo_distance(geoip(a.src_ip),\
      \ geoip(b.src_ip)) / (b.time - a.time)\n    if v > MAX_HUMAN_VELOCITY AND a.src_ip NOT IN trusted_egress\
      \ AND b.src_ip NOT IN trusted_egress: alert\n  if login.country NOT IN admin.historical_countries\
      \ OR rare_asn(login.asn, admin): alert\n"
- question: Is this the first time an administrator has authenticated from a given ASN, or the first time
    they have accessed a particular device or a high-value device group, and is that new relationship
    suspicious?
  context: 'Tied to the Discovery tactic: adversaries reaching the management console typically establish
    connections (admin->ASN, admin->device, admin->high-value-group) never seen in the legitimate user''s
    history. Treat each first-observed edge as an anomaly candidate and score it with a Bayesian new-edge
    model that distinguishes benign new connections (e.g., a new but plausible office network) from suspicious
    ones (e.g., an admin who never touches the Executives group suddenly enumerating it). A high-scoring
    new edge, especially toward a high-value population, is a strong precursor signal to location collection;
    routine new edges with low scores can be deprioritized. Score each first-observed edge with the Bayesian
    new-edge model of [On Bayesian New Edge Prediction and Anomaly Detection in Computer Networks, Metelli
    and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.full).'
  answer_sources:
  - EMM/MDM admin audit logs
  - Identity provider sign-in logs
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - Zeek notice.log
  - Windows Security Event Logs
  - Threat intelligence indicators
  - 'NAI: EMM/MDM web application servers, Authentication servers (e.g., Domain Controllers), Network
    egress points and web proxies, Administrative workstations and VDI environments, Cloud Identity Provider
    (IdP) consoles and logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each login/operation: edge in {admin->asn, admin->device, admin->hv_group}\n  if edge\
      \ NOT IN admin.history:\n    score = bayesian_new_edge(edge)\n    if score > threshold: alert(new_relationship,\
      \ edge, score)\n"
- question: When scored against a 90-day per-admin baseline of source country/ASN, login-hour distribution,
    user-agent set, JA3/JA3S fingerprints, and failed-auth context, does an admin login accumulate enough
    deviation points to exceed the alerting threshold?
  context: 'Tied to the Discovery tactic: rather than rely on a single indicator, build a per-administrator
    90-day baseline capturing source country/ASN, the 5th-95th percentile login-hour window, the set of
    observed user-agents, and the set of JA3/JA3S TLS fingerprints, plus a distinct profile of failed-logon
    ratio (Windows Event ID 4625), MFA denials, and 401/403 console responses. Assign risk points for
    each deviation (novel ASN, off-hours login, unseen user-agent, rare TLS fingerprint, elevated failure
    ratio) and alert when the cumulative score crosses a tenant-tuned threshold (e.g., >= 2). This catches
    stealthy compromises where no single feature is damning but the combination is. A high cumulative
    score warrants investigation; a near-zero score reflects routine admin activity. Derive percentile
    cutoffs from realistic enterprise baselines such as the [Unified Host and Network Data Set, Turcotte
    et al.](https://arxiv.org/abs/1708.07518) and validate against privileged-abuse ground truth in the
    [CERT Insider Threat Test Dataset, CMU SEI](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - EMM/MDM admin audit logs
  - Identity provider sign-in logs
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - Zeek notice.log
  - Windows Security Event Logs
  - Threat intelligence indicators
  - 'NAI: EMM/MDM web application servers, Authentication servers (e.g., Domain Controllers), Network
    egress points and web proxies, Administrative workstations and VDI environments, Cloud Identity Provider
    (IdP) consoles and logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline[admin] = {asn_set, login_hour p5-p95, user_agents, ja3/ja3s set, fail_ratio, mfa_denials,\
      \ 4xx_console}\nscore = 0\n  score += (login.asn NOT IN baseline.asn_set)\n  score += (login.hour\
      \ OUTSIDE p5..p95)\n  score += (login.user_agent NOT IN baseline.user_agents)\n  score += (login.ja3\
      \ NOT IN baseline.ja3_set)\n  score += (recent_fail_ratio > baseline.fail_ratio)\nif score >= 2:\
      \ alert\n"
- question: Does an unsupervised anomaly model (Isolation Forest / LOF / One-Class SVM) trained on historical
    admin login events flag the current login in the top 1% of anomaly scores, and which features drive
    that score?
  context: 'Tied to the Discovery tactic: complement rules and baselines with an unsupervised model trained
    on historical admin login events using features such as source ASN/country, time-of-day, user-agent
    hash, JA3/JA3S hash, and failed-attempt counts. Flag events scoring in the top 1% as anomalies. Prefer
    a One-Class SVM where training-data poisoning is a concern, and attach per-alert LIME attributions
    surfacing the top-3 contributing features so analysts can triage quickly. A top-1% anomaly whose drivers
    align with credential abuse (novel ASN + off-hours + unseen TLS) is a strong lead; a borderline score
    with mundane drivers can be set aside. Use the Isolation Forest method of [Isolation-Based Anomaly
    Detection, Liu, Ting and Zhou](https://doi.org/10.1145/2133360.2133363); prefer OCSVM with per-alert
    LIME attribution where poisoning is a concern, per [Robust IoT Security Using Isolation Forest and
    One-Class SVM, Mohy-eddine et al.](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - EMM/MDM admin audit logs
  - Identity provider sign-in logs
