name: 'T1430.001: Remote Device Management Services'
id: 77ea0619-95db-4866-8006-d3ddcf7c4c50
description: Investigate potential adversary abuse of remote device management services (EMM/MDM consoles,
  Apple iCloud Find My, Google Android Device Manager) to discover and collect the physical location of
  managed mobile devices. This playbook helps an analyst (1) detect anomalous administrative authentication
  to device-management control planes - logins from threat-intel or novel geo/ASN sources, impossible
  travel, off-hours access, rare TLS (JA3/JA3S) or user-agent fingerprints, and first-time admin-to-device/group
  relationships; and (2) detect the follow-on collection activity - bursts of device-location API queries,
  scripted low-entropy request cadence, enumeration sweeps across high-value device populations (e.g.,
  executives, R&D), and coordinated platform-wide spikes in location-tracking calls. It combines deterministic
  symbolic-logic rules, statistical baselining, and unsupervised/sequence machine-learning approaches
  so a SOC analyst can confirm whether an adversary is locating the organization's mobile fleet through
  its own management tooling.
type: technique
