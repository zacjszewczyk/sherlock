  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = IsolationForest(features=[asn,country,tod,ua_hash,ja3_hash,ja3s_hash,failed_count])\n\
      \  // prefer OneClassSVM if poisoning risk\nscore = model.anomaly_score(login)\nif score in top_1_percent:\
      \ alert(login, lime_top3_features(login))\n"
- question: Is an anomalous admin login (from the Discovery analysis) followed within 10 minutes by a
    burst of more than five device-location API calls (e.g., /api/v*/devices/locate) from the same account
    or session?
  context: 'Tied to the Collection tactic: the decisive behavior is location collection that immediately
    follows a suspicious login. This deterministic sequence rule correlates a previously flagged anomalous
    admin session with a rapid burst of location-tracking API calls (more than five within 10 minutes)
    from the same account or session. The login->locate chain in a tight time window is highly indicative
    of an adversary pivoting from access to active device tracking. Keep this rule alongside statistical
    scoring - rare-operation-per-principal logic reinforces it. A match is a high-confidence collection
    alert; absence of the burst suggests the login, even if anomalous, has not yet produced location harvesting.
    Keep this deterministic sequence rule alongside statistical scoring; rare-operation-per-principal
    logic reinforces it, per [Detecting Threats in AWS CloudTrail Logs Using Machine Learning, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources:
  - EMM/MDM admin audit logs
  - Identity provider sign-in logs
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - 'NAI: EMM/MDM web application servers, Network egress points and web proxies, Cloud service access
    points (for iCloud/Google Find My), DNS resolvers and forwarders'
  range: 'Last 90 days; event-centered: correlate within a 10-minute window after each flagged login'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "flagged = logins WHERE anomalous=true   // from Discovery analysis\nlocate = api_calls WHERE\
      \ path MATCHES '/api/v*/devices/locate'\nfor f in flagged:\n  n = count(locate WHERE same_account_or_session(f)\
      \ AND time within 10m after f.time)\n  if n > 5: alert(severity=critical, login_to_locate_burst,\
      \ f.account, n)\n"
- question: Do the parameters and structure of location queries (device-ID format/enumeration, requested
    fields, query cadence) deviate from the learned per-endpoint model of normal requests?
  context: 'Tied to the Collection tactic: automated enumeration tends to produce structurally abnormal
    requests - sequential or wildcard device-ID patterns, unusual requested-field sets, or machine-like
    cadence. Build multi-model per-endpoint profiles of location-query parameters (token/attribute lengths,
    character distributions, enumeration order, requested fields, inter-request cadence) and alert on
    structural deviations. A positive result indicates scripted harvesting rather than ad-hoc human lookups;
    a negative result is consistent with normal, parameter-stable console use. This approach catches enumeration
    even when request volume alone stays under volumetric thresholds. Apply the multi-model request-profiling
    approach of [Anomaly Detection of Web-based Attacks, Kruegel and Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).'
  answer_sources:
  - EMM/MDM admin audit logs
  - Identity provider sign-in logs
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - 'NAI: EMM/MDM web application servers, Network egress points and web proxies, Cloud service access
    points (for iCloud/Google Find My), DNS resolvers and forwarders'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "model[endpoint] = profile(param_length, char_dist, device_id_pattern, requested_fields, cadence)\n\
      for req in location_queries:\n  if deviation(req, model[req.endpoint]) > threshold: alert(structural_anomaly,\
      \ req)\n"
- question: Against 30-day per-admin baselines, do location calls/hour exceed the 99th percentile across
    admins, do unique devices queried exceed the user's 98th percentile, does inter-request entropy fall
    below 2.0 bits, are over 75% of queried devices in high-value groups, or does the failed/empty-response
    ratio spike?
  context: 'Tied to the Collection tactic: location harvesting manifests as volume, breadth, regularity,
    and targeting anomalies. Build 30-day baselines per administrator for location calls/hour, unique
    devices queried, and inter-request interval entropy, then alert when calls exceed the 99th percentile
    across admins, unique devices exceed the user''s own 98th percentile, inter-request Shannon entropy
    drops below 2.0 bits (indicating scripted automation), more than 75% of queried devices belong to
    high-value groups (Executives, R&D), or the failed/empty-response ratio (404/403/device-offline) spikes
    - a hallmark of enumeration sweeps. Tune percentiles per tenant. Multiple simultaneous triggers strongly
    indicate a deliberate location-collection campaign. Validate against insider-abuse ground truth in
    the [CERT Insider Threat Test Dataset, CMU SEI](https://www.sei.cmu.edu/library/insider-threat-test-dataset/);
    attribute/length anomaly models follow [Kruegel and Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).'
  answer_sources:
  - EMM/MDM admin audit logs
  - Identity provider sign-in logs
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - 'NAI: EMM/MDM web application servers, Network egress points and web proxies, Cloud service access
    points (for iCloud/Google Find My), DNS resolvers and forwarders'
  range: Last 90 days; baseline rolling 30 days, evaluate over 1-hour windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline[admin] (30d) = {calls_per_hour, unique_devices, inter_req_entropy}\nalert if calls_per_hour\
      \ > p99_across_admins\n  OR unique_devices > admin.p98\n  OR shannon_entropy(inter_request_intervals)\
      \ < 2.0\n  OR pct_devices_in_hv_groups > 0.75\n  OR failed_empty_response_ratio > baseline_spike_threshold\n"
- question: Do an administrator's console operation sequences (login -> enumerate -> locate) and their
    inter-event timing fall outside the events predicted by a sequence model trained on normal per-admin
    behavior?
  context: 'Tied to the Collection tactic: legitimate admins follow predictable operation sequences and
    timing, whereas an adversary''s locate-heavy workflow breaks those patterns. Train an LSTM next-event
    predictor (DeepLog-style) on per-admin console operation sequences and inter-event timing, and flag
    operations that fall outside the top-g predicted next events as anomalies. Augment with an attention
    mechanism so the prior events/fields driving each anomaly score are surfaced for triage. A flagged
    sequence - for example, login directly into mass locate calls without the usual intervening operations
    - indicates abnormal, likely automated collection; sequences matching the model reflect normal administration.
    Train the LSTM next-event predictor per [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015),
    and use an attention-augmented RNN to surface the prior events/fields driving each anomaly score for
    triage, per [Recurrent Neural Network Attention Mechanisms for Interpretable System Log Anomaly Detection,
    Brown et al.](https://arxiv.org/abs/1803.04967).'
  answer_sources:
  - EMM/MDM admin audit logs
  - Identity provider sign-in logs
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - 'NAI: EMM/MDM web application servers, Network egress points and web proxies, Cloud service access
    points (for iCloud/Google Find My), DNS resolvers and forwarders'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = per_admin_operation_sequence(login, enumerate, locate) + inter_event_timing

      model = LSTM_next_event(seq)   // DeepLog

      if observed_op NOT IN model.top_g_predicted: alert(seq_anomaly, attention_top_events(seq))

      '
- question: Does a multivariate time-series model of minute-by-minute platform metrics (location calls,
    unique users, unique devices, average requests/user, failed-response ratio) show a reconstruction
    error above the 99.5th-percentile threshold, indicating a coordinated spike in location collection?
  context: 'Tied to the Collection tactic: a large-scale or multi-account campaign appears as a coordinated
    platform-wide spike rather than a single-account anomaly. Train a multivariate time-series anomaly
    model (e.g., an LSTM autoencoder) on minute-by-minute platform metrics - total location calls, unique
    users, unique devices, average requests per user, and the failed-response ratio - and alert when reconstruction
    error exceeds the 99.5th-percentile threshold. Where poisoning is a risk, prefer robust unsupervised
    detectors (Isolation Forest / One-Class SVM) with per-alert feature attribution. A reconstruction-error
    spike concentrated in location metrics signals fleet-wide tracking activity; normal error levels indicate
    routine aggregate usage. Where poisoning is a risk, prefer robust unsupervised detectors (Isolation
    Forest / One-Class SVM) with per-alert feature attribution, per [Robust IoT Security Using Isolation
    Forest and One-Class SVM, Mohy-eddine et al.](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - EMM/MDM admin audit logs
  - Identity provider sign-in logs
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - 'NAI: EMM/MDM web application servers, Network egress points and web proxies, Cloud service access
    points (for iCloud/Google Find My), DNS resolvers and forwarders'
  range: Last 90 days; evaluate on minute-level aggregates
  queries:
  - technology: ML/pseudocode
    query: 'X = minute_metrics[location_calls, unique_users, unique_devices, avg_req_per_user, failed_ratio]

      model = LSTM_autoencoder(X)

      err = reconstruction_error(X_t)

      if err > p99_5_threshold: alert(coordinated_spike)   // or IsolationForest/OCSVM + attribution

      '
