name: 'T1625: Hijack Execution Flow'
id: e865fa99-c82d-44cd-9cd1-ca2f413fabd1
description: 'Investigate whether an adversary has hijacked the execution flow of a managed Android device
  to run attacker-controlled code under a trusted application''s identity, most often for persistence.
  This playbook helps an analyst pursue four overlapping evidence trails: (1) failed device or application
  integrity/attestation verdicts in MDM, MTD, or Play Integrity logs (root, custom ROM, hooking, or repackaged/tampered
  binaries that provide the substrate for hijack); (2) anomalous network traffic from mobile devices (threat-intel
  matches, rare JA3 fingerprints, high-entropy DNS, outbound volume/frequency outliers, and beaconing-like
  connection failures consistent with externally loaded payloads calling out to C2); (3) runtime dynamic
  code loading where an app loads DEX/JAR, native .so, or spawns a binary from world-writable or external
  storage, or from a path/signer that does not match the app package; and (4) inter-component messaging
  and multitasking abuse such as intent redirection to unprotected exported components and task hijacking
  / StrandHogg via colliding taskAffinity or activity reparenting. Each evidence trail provides symbolic-logic,
  statistical, and machine-learning detection approaches so analysts can confirm whether execution was
  redirected from an expected code path to an untrusted payload running under a trusted context.'
type: technique
related:
- tactic_id: TA0028
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any MDM, MTD, or Play Integrity verdicts explicitly report device or app integrity failure
    (attestation_result=FAIL, root_status=detected, integrity_status=failed, bootloader_hash_match=false,
    a device verdict omitting MEETS_DEVICE_INTEGRITY, or an app verdict of UNRECOGNIZED_VERSION) for any
    managed device or installed package?
  context: Root, custom ROMs, and runtime hooking frameworks are the substrate that makes execution-flow
    hijack possible on Android, and an UNRECOGNIZED_VERSION app verdict indicates the running binary was
    repackaged or tampered with. For Persistence, a hijacked flow that reoccurs across reboots almost
    always rests on a compromised-integrity device. Trigger a high-severity alert on explicit failure
    verdicts and verify Play Integrity verdicts server-side with nonce binding to resist replay. Include
    device ID, user, package, OS version, and the specific failure reason so the analyst can scope whether
    one device or a fleet segment is affected. A positive result is direct evidence the trusted-execution
    assumptions of the platform no longer hold; a negative result does not clear the device because attestation
    can be defeated and must be corroborated with the other evidence trails.
  answer_sources:
  - MDM attestation logs
  - MTD integrity scan logs
  - Play Integrity API verdict logs
  - Device integrity baseline hashes
  - 'NAI: MDM/MTD management console, Play Integrity verification backend, managed Android endpoints,
    and centralized log aggregator (SIEM) ingesting events from the MDM/MTD cloud infrastructure.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mdm_mtd_integrity, play_integrity_verdicts\nWHERE attestation_result == 'FAIL' OR root_status\
      \ == 'detected'\n   OR integrity_status == 'failed' OR bootloader_hash_match == false\n   OR NOT\
      \ verdict.deviceIntegrity CONTAINS 'MEETS_DEVICE_INTEGRITY'\n   OR verdict.appIntegrity == 'UNRECOGNIZED_VERSION'\n\
      \   AND nonce_validated_server_side == true\nEMIT severity=high WITH device_id, user, package, os_version,\
      \ failure_reason"
- question: For each device model and OS version, does any device's 24-hour attestation/integrity failure
    rate exceed the 99th percentile of its 30-day baseline, or show a distinct spike in UNRECOGNIZED_VERSION
    verdicts per app version?
  context: Some integrity failures are benign noise (transient attestation errors, beta OS builds). Building
    30-day baselines of failure rates per device model and OS version lets you separate that noise from
    a genuine compromise. A device whose 24-hour failure rate jumps above the 99th percentile for its
    profile is anomalous relative to identical hardware/software. Because legitimate Play-distributed
    binaries are recognized, any count of UNRECOGNIZED_VERSION verdicts for a given app version is a strong
    repackaging/tampering indicator supporting Persistence via a modified binary. Derive thresholds from
    your own fleet's per-model baseline rather than absolute counts.
  answer_sources:
  - MDM attestation logs
  - MTD integrity scan logs
  - Play Integrity API verdict logs
  - Device integrity baseline hashes
  - 'NAI: MDM/MTD management console, Play Integrity verification backend, managed Android endpoints,
    and centralized log aggregator (SIEM) ingesting events from the MDM/MTD cloud infrastructure.'
  range: Last 90 days; baseline window 30 days, evaluate over rolling 24h
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM mdm_mtd_integrity

      STATS count(failures) AS f BY device_id, device_model, os_version, window=24h

      JOIN baseline_p99(device_model, os_version, lookback=30d) AS p99

      WHERE f > p99

      UNION

      FROM play_integrity_verdicts WHERE appIntegrity==''UNRECOGNIZED_VERSION''

      STATS count() BY package, app_version WHERE count() > 0

      EMIT alert'
- question: Does a time-series anomaly model over hourly fleet-wide integrity-failure counts show observed
    values exceeding the upper confidence bound for three consecutive intervals, and which device models,
    OS versions, or packages are driving the spike?
  context: A coordinated rooting or repackaging campaign manifests as a fleet-wide surge in integrity
    failures that no single-device rule will surface. Train a Prophet or LSTM model on hourly fleet-wide
    failure counts and alert when observed values exceed the upper confidence bound for three consecutive
    intervals to avoid single-spike false positives. Surface the top-3 contributing dimensions (device
    model, OS version, app/package) so the analyst can localize the campaign rather than chase an opaque
    anomaly score. This supports Persistence detection by catching mass compromise that establishes hijackable
    execution flows across many devices at once.
  answer_sources:
  - MDM attestation logs
  - MTD integrity scan logs
  - Play Integrity API verdict logs
  - Device integrity baseline hashes
  - 'NAI: MDM/MTD management console, Play Integrity verification backend, managed Android endpoints,
    and centralized log aggregator (SIEM) ingesting events from the MDM/MTD cloud infrastructure.'
  range: Last 90 days, hourly buckets
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = TimeSeries(Prophet|LSTM).fit(hourly_fleet_failure_counts, lookback=90d)\nyhat_upper\
      \ = model.predict_upper(ci=0.99)\nWHEN observed > yhat_upper FOR 3 consecutive hours:\n  contributors\
      \ = top3_dimensions(device_model, os_version, package)\n  EMIT alert WITH observed, yhat_upper,\
      \ contributors"
- question: Does Zeek intel.log show any connection or DNS query originating from a mobile device IP that
    matches a known-malicious indicator (intel.seen.where)?
  context: 'Externally loaded payloads dropped by a hijacked execution flow typically reach out to attacker
    infrastructure. Monitoring Zeek intel.log for mobile-device source IPs and alerting when intel.seen.where
    indicates a malicious connection or DNS query catches these network sinks deterministically. This
    is a high-confidence, low-false-positive floor: a match means a managed mobile device contacted known-bad
    infrastructure, consistent with a payload loaded by a hijacked app beaconing for Persistence. Pivot
    from the matched connection to the device, user, and the process/app responsible.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek intel.log
  - Zeek ja3.log
  - Threat intelligence indicators
  - 'NAI: Network sensors (e.g., Zeek) deployed at key egress points, including corporate Wi-Fi gateways,
    VPN concentrators serving mobile devices, and DNS resolvers used by mobile clients.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM intel.log\nWHERE id.orig_h IN mobile_device_subnets\n  AND seen.where IN ('Conn::IN_DST','DNS::IN_REQUEST','SSL::IN_SERVER_NAME')\n\
      EMIT alert WITH id.orig_h, seen.indicator, sources, device_id"
- question: For each mobile device, is there an unseen JA3 fingerprint, DNS query entropy above the 98th
    percentile, hourly outbound bytes or connection frequency above baseline, or a failed-connection (S0/REJ)
    and NXDOMAIN ratio above the 98th percentile versus its 30-day baseline?
  context: Code loaded at runtime by a hijacked app establishes new network behavior that deviates from
    the device's normal pattern. Per-device baselines let you flag a JA3 client fingerprint never seen
    in 30 days (new TLS stack/library), high Shannon-entropy DNS (DGA-like C2 lookups), outbound volume
    and connection-frequency spikes (Volume/Frequency), and elevated S0/REJ plus NXDOMAIN ratios (Failure-state,
    classic beaconing where C2 is intermittently unreachable). Runtime data-flow baselining of sensitive-data-to-network
    sinks refines per-app expectations. Multiple concurrent outliers strongly indicate a hijacked flow
    exfiltrating or beaconing; derive all thresholds from per-device baselines.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek intel.log
  - Zeek ja3.log
  - Threat intelligence indicators
  - 'NAI: Network sensors (e.g., Zeek) deployed at key egress points, including corporate Wi-Fi gateways,
    VPN concentrators serving mobile devices, and DNS resolvers used by mobile clients.'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "FOR each device_ip:\n  baseline = profile(conn.log,dns.log,ssl.log, lookback=30d)\n  ALERT\
      \ IF ja3 NOT IN baseline.ja3_set\n       OR shannon_entropy(dns.query) > p98(baseline.dns_entropy)\n\
      \       OR sum(orig_bytes)/hour > p98(baseline.hourly_bytes)\n       OR conn_per_min > baseline.conn_freq\n\
      \       OR ratio(conn_state IN ('S0','REJ')) > p98(baseline.fail_ratio)\n       OR ratio(dns.rcode=='NXDOMAIN')\
      \ > p98(baseline.nxdomain_ratio)"
- question: Does a Random Forest classifier over Zeek conn/dns/ssl features assign a malicious probability
    above 0.90 to any mobile-device connection, and which top-3 features drive that score?
  context: Statistical rules catch single-dimension outliers; a supervised model captures combinations
    that individually look benign. Train a Random Forest on conn/dns/ssl features (duration, bytes, proto,
    conn_state, history, qtype, DNS entropy, TLS issuer/subject, certificate validation status) and alert
    when malicious probability exceeds 0.90, surfacing the top-3 contributing features (e.g., 'rare JA3
    + high DNS entropy + S0 failures') for explainability. Keep the deterministic intel-match and percentile
    rules running in parallel as the floor. Because models drift and adversaries evade, retrain periodically.
    A high-probability classification on a mobile device's traffic corroborates a hijacked execution flow
    reaching C2 for Persistence.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek intel.log
  - Zeek ja3.log
  - Threat intelligence indicators
  - 'NAI: Network sensors (e.g., Zeek) deployed at key egress points, including corporate Wi-Fi gateways,
    VPN concentrators serving mobile devices, and DNS resolvers used by mobile clients.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = extract(conn.log,dns.log,ssl.log:\n  duration,bytes,proto,conn_state,history,qtype,dns_entropy,\n\
      \  ssl_issuer,ssl_subject,cert_validation_status)\np = RandomForest.predict_proba(features)\nWHEN\
      \ p > 0.90: EMIT alert WITH device_ip, top3_features(p)\n# run in parallel with intel-match + percentile\
      \ floor; retrain periodically"
- question: Did any application invoke DexClassLoader, PathClassLoader, System.load, System.loadLibrary,
    or Runtime.exec to load code from /sdcard/, external/removable storage, or app cache, or load a module
    whose path/signature does not match the app package, and then execute it shortly after?
  context: 'This is the canonical mobile execution-flow hijack: a vetted app fetches and runs an attacker-controlled
    payload at runtime. Alert when a class-loader or native-load API resolves a source path under world-writable/external
    storage or app cache, or when the loaded module''s path or signing context does not match the app
    package, followed by execution within a short window. The strongest confirmation is correlating a
    file write to external storage with a subsequent load of that same path -- a plant-then-load sequence.
    Such dynamic loading is rare among benign apps, so a hit is high-confidence evidence of a hijacked
    flow used for Persistence.'
  answer_sources:
  - MobileEDR:telemetry (DC0021 OS API Execution)
  - MobileEDR:telemetry (DC0055 File Access)
  - MobileEDR:telemetry (DC0032 Process Creation)
  - 'NAI: Managed Android endpoints with an MTD/EDR agent capable of observing class-loader/native-load
    API calls, file reads from external storage, and process creation, reporting to a centralized SIEM.'
  range: Last 90 days; correlate plant-then-load within minutes
  queries:
  - technology: MobileEDR/Rule pseudocode
    query: "FROM os_api_execution\nWHERE api IN ('DexClassLoader','PathClassLoader','System.load',\n \
      \             'System.loadLibrary','Runtime.exec')\n  AND (source_path MATCHES '/sdcard/|/external|/cache/|/Download'\n\
      \       OR loaded_module.signer != app.package.signer)\nCORRELATE WITH file_access(write path==source_path)\
      \ WITHIN 10m\nFOLLOWED BY process_creation FROM loaded_module WITHIN 5m\nEMIT alert WITH package,\
      \ source_path, api"
- question: Across the fleet, is any dynamically-loaded DEX/.so hash or load-path seen on fewer than 1%
    of devices running that app version, and are there never-before-seen module loads or blocked load
    attempts on a device?
  context: 'Rarity is a powerful prior: legitimate dynamic modules shipped with an app appear broadly
    across the fleet, while an attacker''s payload is unique to compromised devices. Compute fleet-wide
    prevalence of each dynamically-loaded module hash and load-path per app version and alert when a module
    appears on under 1% of devices running that app. Track never-before-seen module loads per device/hour
    (Volume) and blocked/denied load attempts (Failure-state) as distinct signals. Because insecure external
    loading is uncommon among benign apps, low-prevalence loads are strong evidence of a runtime hijack;
    derive the percentile from a 30-day per-app baseline.'
  answer_sources:
  - MobileEDR:telemetry (DC0021 OS API Execution)
  - MobileEDR:telemetry (DC0055 File Access)
  - MobileEDR:telemetry (DC0032 Process Creation)
  - 'NAI: Managed Android endpoints with an MTD/EDR agent capable of observing class-loader/native-load
    API calls, file reads from external storage, and process creation, reporting to a centralized SIEM.'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM os_api_execution WHERE api IN loader_apis

      STATS dcount(device_id) AS devs BY module_hash, load_path, package, app_version

      JOIN total_devices(package, app_version) AS total

      WHERE devs/total < 0.01

      UNION never_before_seen_module(device_id, window=1h)

      UNION blocked_load_attempts

      EMIT alert'
- question: Does an explainable classifier over static app features (reflective/loader API usage, requested
    permissions, components, intent filters, external-storage writes) flag any installed app, and which
    top-3 features drive the verdict?
  context: Static analysis catches risky loader behavior before or alongside runtime detection. Score
    apps and events with an explainable classifier (Drebin-style) over static features such as reflective/loader
    API usage, requested permissions, declared components, intent filters, and external-storage writes,
    surfacing the top-3 contributing features (e.g., 'DexClassLoader + external-storage read + INTERNET').
    Keep deterministic path/signature rules running in parallel as the floor. A flagged app whose features
    combine dynamic code loading with external storage and network permissions is a prime candidate for
    execution-flow hijack and warrants vetting/removal to deny Persistence.
  answer_sources:
  - MobileEDR:telemetry (DC0021 OS API Execution)
  - MobileEDR:telemetry (DC0055 File Access)
  - MobileEDR:telemetry (DC0032 Process Creation)
  - 'NAI: Managed Android endpoints with an MTD/EDR agent capable of observing class-loader/native-load
    API calls, file reads from external storage, and process creation, reporting to a centralized SIEM.'
  range: Last 90 days; re-run on each app install/update
  queries:
  - technology: App-vetting/ML pseudocode
    query: "features = static_extract(apk:\n  loader_api_usage, requested_permissions, components,\n \
      \ intent_filters, external_storage_writes)\nlabel = Drebin_classifier.predict(features)\nWHEN label=='malicious':\
      \ EMIT alert WITH package, top3_features\n# run alongside deterministic path/signature rules"
- question: Are there installed apps or runtime events with exported components lacking permission/signature
    protection, implicit Intents carrying data to sensitive sinks, unprotected dynamically-registered
    receivers, or a taskAffinity colliding with another installed package / allowTaskReparenting on sensitive
    activities / back-stack-Recents reparenting anomalies?
  context: 'Android inter-component messaging and the multitasking model are abusable to redirect execution
    under a trusted app''s context. Flag ComDroid-style invariants -- exported components without permission/signature,
    implicit Intents to sensitive sinks, and unprotected dynamically-registered receivers -- which permit
    forged/implicit Intent injection. Independently flag task-hijack (StrandHogg) invariants: a taskAffinity
    that collides with another installed package, allowTaskReparenting on sensitive activities, and back-stack/Recents
    reparenting anomalies. These let a malicious activity insert itself into another app''s back stack
    and render/execute as that app, a durable Persistence and credential-phishing primitive. App vetting
    surfaces the manifest conditions; EDR telemetry surfaces the runtime events.'
  answer_sources:
  - MobileEDR:telemetry (DC0032 Process Creation)
  - MobileEDR:telemetry (DC0021 OS API Execution)
  - App manifest / component inventory (MDM app vetting)
  - 'NAI: Managed Android endpoints with an MTD/EDR agent observing activity/task lifecycle and Intent
    routing, plus an MDM app-vetting pipeline that statically inspects installed APK manifests.'
  range: Last 90 days; re-run on each app install/update
  queries:
  - technology: App-vetting/Rule pseudocode
    query: 'FROM app_manifest_inventory

      FLAG exported_component AND NOT (permission OR signature_protection)

      FLAG implicit_intent TO sensitive_sink

      FLAG dynamic_receiver AND NOT protected

      FLAG taskAffinity COLLIDES_WITH other_installed_package

      FLAG allowTaskReparenting ON sensitive_activity

      JOIN os_api_execution: back_stack/Recents reparenting anomaly

      EMIT alert WITH package, condition'
- question: For each app, are activity launches into another package's task, or reparenting/Recents-swap
    events, exceeding the 99th percentile of that app's 30-day baseline?
  context: Task hijacking shows up as abnormal activity-launch and back-stack transition behavior. Build
    per-app baselines of activity launch sources and task/back-stack transitions and alert when an activity
    is launched into another package's task, or when reparenting/Recents-swap events exceed the 99th percentile
    of that app's 30-day baseline (Frequency + State). Because task-hijack risk is widespread, prioritize
    cross-package taskAffinity collisions discovered during app vetting. A cross-package launch or a reparenting
    spike indicates an app is being inserted into another's task -- the StrandHogg mechanism enabling
    persistent UI hijack and phishing.
  answer_sources:
  - MobileEDR:telemetry (DC0032 Process Creation)
  - MobileEDR:telemetry (DC0021 OS API Execution)
  - App manifest / component inventory (MDM app vetting)
  - 'NAI: Managed Android endpoints with an MTD/EDR agent observing activity/task lifecycle and Intent
    routing, plus an MDM app-vetting pipeline that statically inspects installed APK manifests.'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: MobileEDR/Stats pseudocode
    query: "FOR each package:\n  baseline = profile(activity_launch_source, task_transition, lookback=30d)\n\
      \  ALERT IF activity launched INTO task.owner != package\n       OR count(reparenting|recents_swap)\
      \ > p99(baseline)\nPRIORITIZE cross-package taskAffinity collisions from app vetting"
- question: Does a per-app API call-transition model (Markov features classified with Random Forest/kNN)
    flag deviations from the package/family baseline, and which top-3 anomalous transitions (e.g., unexpected
    ActivityManager/Intent routing) drive the alert?
  context: Hijack chains alter the sequence of API calls an app makes. Model per-app package/family-level
    API call-transition matrices (MaMaDroid-style) and classify deviations with Random Forest or kNN over
    Markov features, surfacing the top-3 anomalous transitions such as unexpected ActivityManager or Intent
    routing. Graph/sequence deep models extend this approach. Retrain to counter concept drift. An app
    whose runtime API transitions diverge from its learned behavior -- especially around activity/intent
    routing -- signals that its execution flow has been redirected, corroborating intent-redirection or
    task-hijack Persistence.
  answer_sources:
  - MobileEDR:telemetry (DC0032 Process Creation)
  - MobileEDR:telemetry (DC0021 OS API Execution)
  - App manifest / component inventory (MDM app vetting)
  - 'NAI: Managed Android endpoints with an MTD/EDR agent observing activity/task lifecycle and Intent
    routing, plus an MDM app-vetting pipeline that statically inspects installed APK manifests.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = MarkovTransition(package|family).fit(api_call_sequences, lookback=90d)\nclf = RandomForest|kNN\
      \ over transition_features\nWHEN clf.flags_deviation(observed_transitions):\n  EMIT alert WITH package,\
      \ top3_anomalous_transitions\n# retrain periodically to counter concept drift"
