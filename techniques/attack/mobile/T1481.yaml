- question: Do combined supervised and unsupervised models score a managed app's behavior — background
    activation, scheduled network jobs, IPC/provider access adjacent to egress — as anomalous relative
    to its baseline?
  context: C2 leaves app-behavior artifacts even when the network looks clean. This ML method combines
    supervised and unsupervised anomaly scoring over app-behavior features (background activation, scheduled
    network jobs, IPC/provider access adjacent to egress) and surfaces the top-3 contributing features
    in the alert, following [ProblemChild, Elastic](https://arxiv.org/abs/2008.04676). A high anomaly
    score where the top features tie background scheduling or IPC access directly to web-service egress
    is a strong C2 indicator; explainability and a learned per-app baseline keep false positives manageable.
    This supports Command and Control by detecting the on-device orchestration that precedes and accompanies
    web-service C2.
  answer_sources:
  - VPN:MobileProxy network flows
  - MobileEDR:telemetry Application State
  - MDM Application Permission
  - Zeek conn.log
  - 'NAI: MDM/UEM telemetry, MobileEDR app-state, CASB/SASE flow logs correlated to managed-app identity,
    Corporate Wi-Fi/VPN egress sensors'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = app_behavior(app, [background_activation, scheduled_net_jobs, ipc_provider_access, egress_adjacency]);

      s_sup = sup_model.predict_proba(X);

      s_uns = anomaly_score(X, baseline=per_app);

      score = combine(s_sup, s_uns);

      alert when score high;

      emit top3 = explain(score, X);

      output device, app, score, top3'
