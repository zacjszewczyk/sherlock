name: 'T1481: Web Service'
id: 624a7e5c-c691-47b6-8dd5-92b0e1cbb544
description: 'Investigate whether an adversary is abusing legitimate external web services (cloud storage,
  social media, messaging, paste sites, code-hosting, CDN-backed APIs, or generic HTTPS endpoints) as
  command-and-control channels to/from managed Android and iOS mobile devices. Because hosts routinely
  talk to popular services like Google, GitHub, Pastebin, or Telegram over SSL/TLS, adversaries blend
  C2 traffic into expected noise and protect back-end infrastructure from discovery. This playbook helps
  an analyst hunt for that abuse by correlating network egress with mobile runtime context: periodic low-variance
  beaconing with small, uniform responses; non-browser/script-based User-Agents and automation-style URIs
  (e.g., /raw/, /api/v1/data/); rare non-browser TLS/HTTP client fingerprints (JA3/JA3S, JA4/JA4H) surviving
  TLS 1.3; high DNS-to-connection ratios and resolution-failure bursts indicative of canary or dead-drop
  check-ins; and managed apps communicating with web services while backgrounded, recently awakened, or
  with the device locked and no user interaction. It blends symbolic-logic alerting, statistical baselining
  (coefficient of variation, FFT/periodogram period extraction, entropy, seasonality residuals), and machine
  learning (DBSCAN clustering, flow-feature classification, graph neural networks for many-devices-to-one-service
  dead drops, and explainable anomaly scoring) so a SOC analyst can distinguish covert C2 from benign
  mobile web traffic.'
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command and Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any mobile devices repeatedly contacting web services commonly abused for command and
    control (cloud storage, paste, code-hosting, social, messaging, or generic HTTPS APIs) at a volume
    and response profile that looks automated rather than human?
  context: Adversaries hide C2 in services hosts already use, so a deterministic threshold catches the
    noisy end of that abuse. This symbolic-logic rule queries Zeek conn/http logs for mobile devices touching
    a curated list of abused services and alerts when a device exceeds roughly 50 connections in one hour
    with an average response payload under 1 KB — a hallmark of small, frequent check-ins rather than
    browsing. Seed the abused-service and dead-drop-URI lists from [Dead Drop Resolver (T1102.001), MITRE
    ATT&CK](https://attack.mitre.org/techniques/T1102/001/) and [SigmaHQ web-service C2 rules](https://github.com/SigmaHQ/sigma).
    A positive hit identifies a candidate beaconing device and destination for triage; a negative result
    does not clear low-and-slow beacons, which the statistical and ML methods below are meant to recover.
    This directly supports the Command and Control tactic by exposing the relay channel the adversary
    uses to control the device.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network segments for mobile devices, VPN Concentrators, Mobile Device Management
    (MDM) platform logs, Cloud Access Security Broker (CASB) traffic logs, Secure Access Service Edge
    (SASE) platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "conn = zeek_conn_http(filter=device.subnet in mobile_ranges);\nabused = feed['T1102_001_services']\
      \ + feed['sigma_webservice_c2'];\nagg = group conn by (device, dest_service) over 1h\n      compute\
      \ conns=count(), avg_resp=avg(resp_bytes)\n      where dest_service in abused;\nalert when agg.conns\
      \ > 50 and agg.avg_resp < 1024;\noutput device, dest_service, conns, avg_resp"
- question: For each mobile device-to-web-service pair, is the connection timing and response size unusually
    regular and uniform compared with the variance expected from human-driven web browsing?
  context: Automated beacons fire on a clock and receive near-identical responses, while human browsing
    has high timing and size variance. This statistical method computes, per device-service pair, the
    inter-arrival coefficient of variation (CV) and the entropy/dispersion of response bytes, then flags
    pairs where CV < 0.1 (stddev under ~2s) and where response size and entropy sit in the bottom 5th
    percentile for that service — mirroring the CV plus FFT/autocorrelation beaconing scoring of [RITA,
    Active Countermeasures](https://github.com/activecm/rita). A positive result strongly suggests machine-generated
    traffic; benign automated pollers (update checks, ad refresh) can also score low, so corroborate with
    device state and destination reputation. This supports Command and Control by isolating the mechanical
    signature of a beacon hiding inside legitimate web-service traffic.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network segments for mobile devices, VPN Concentrators, Mobile Device Management
    (MDM) platform logs, Cloud Access Security Broker (CASB) traffic logs, Secure Access Service Edge
    (SASE) platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "pairs = group flows by (device, service) over 90d;\nfor p in pairs:\n  cv = stddev(p.interarrival)\
      \ / mean(p.interarrival);\n  resp_pct = percentile_rank(p.resp_bytes, within=service);\n  ent_pct\
      \ = percentile_rank(entropy(p.resp_payload), within=service);\nalert when cv < 0.1 and resp_pct\
      \ <= 5 and ent_pct <= 5;\noutput device, service, cv, mean_interarrival, resp_pct"
- question: After removing known benign periodic web traffic, does any mobile device-to-service channel
    reveal a stable hidden beacon period, especially while the device is locked or unattended?
  context: Low-and-slow beacons can be buried under benign periodic traffic such as app update checks
    and ad refresh. This method applies FFT/periodogram dominant-period extraction with a relevance-ranking
    stage that suppresses benign periodicity to recover the true beacon, following [BAYWATCH, Hu et al.](https://doi.org/10.1109/DSN.2016.50).
    Alert on a stable dominant period in the ~30–3600s band, weighting cases where the device is locked
    or shows no user interaction. A positive result means the channel has a persistent automated cadence
    consistent with C2; a negative result is expected for jittered or aperiodic beacons. This supports
    Command and Control by surfacing the slow, deliberate check-in rhythm adversaries use to evade volume
    thresholds.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network segments for mobile devices, VPN Concentrators, Mobile Device Management
    (MDM) platform logs, Cloud Access Security Broker (CASB) traffic logs, Secure Access Service Edge
    (SASE) platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = timeseries(connections, key=(device,service), bucket=1s, range=90d);

      spec = periodogram(series);

      spec = suppress_benign(spec, allowlist=update_checks+ad_refresh);

      dom = argmax_period(spec);

      locked = join(device_state where locked or no_interaction);

      alert when dom.period in [30s,3600s] and dom.stability_high and locked;

      output device, service, dom.period, dom.power'
- question: Is a mobile device showing a high ratio of failed-to-successful connections — TLS handshake
    failures, HTTP 403/404, blocked egress — with periodic retries to rotating web-service endpoints?
  context: Dead-drop and canary C2 often retries against resources that are intermittently empty or against
    rapidly rotating infrastructure, producing a distinctive failure series. This method tracks TLS handshake
    failures, HTTP 403/404, and blocked-egress counts per device-service as a standalone signal; a high
    failed-to-successful ratio with periodic retries to rotating endpoints indicates dead-drop check-ins
    and fast IP rotation, consistent with the ORB proxy-network behavior described in [Defending Against
    ORB Proxy Networks, Google/Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/orb-proxy-networks-defense-strategies).
    A positive result points to resilient, rotating C2 infrastructure; benign causes (expired links, flaky
    networks) exist, so weigh the periodicity and rotation breadth. This supports Command and Control
    by exposing the operational-resilience pattern of web-service dead drops.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network segments for mobile devices, VPN Concentrators, Mobile Device Management
    (MDM) platform logs, Cloud Access Security Broker (CASB) traffic logs, Secure Access Service Edge
    (SASE) platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'evt = group conn/ssl/http by (device, service) over 90d;

      fail = count(tls_fail) + count(http in [403,404]) + count(egress_blocked);

      ok = count(success);

      ratio = fail / max(ok,1);

      rot = distinct_count(resolved_ip) per window;

      alert when ratio > threshold and periodic_retries(evt) and rot high;

      output device, service, ratio, rot, retry_period'
- question: When device-service traffic is grouped by its statistical features, do small tight clusters
    of low-variance, low-entropy behavior emerge that indicate coordinated C2?
  context: Coordinated C2 channels cluster together in feature space even when individual thresholds are
    not tripped. This ML method runs DBSCAN over per-pair features (inter-arrival CV, orig/resp byte statistics,
    response entropy) to find small low-variance/low-entropy clusters indicative of coordinated beaconing,
    and surfaces the top-3 contributing features (beacon period, response-byte CV, UA/fingerprint rarity)
    in each alert for explainability. Features are built from version-agnostic packet size/direction/timing
    sequences shown to survive TLS 1.3 ([Extending C2 Traffic Detection to TLS 1.3, Novo & Morla](https://github.com/CarlosANovo/extending12to13)),
    so it works on encrypted traffic. A small dense cluster of mobile devices sharing a destination and
    rhythm is high-value; large diffuse clusters are usually benign. This supports Command and Control
    by revealing fleets of devices funneled to a shared web-service relay.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network segments for mobile devices, VPN Concentrators, Mobile Device Management
    (MDM) platform logs, Cloud Access Security Broker (CASB) traffic logs, Secure Access Service Edge
    (SASE) platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = features(pair, [interarrival_cv, orig_bytes_stats, resp_bytes_stats, resp_entropy],\n\
      \             encoding=size_dir_timing_seq);  // TLS1.3-resilient\nclusters = DBSCAN(X, eps, min_samples);\n\
      for c in clusters where c.size small and c.variance low and c.entropy low:\n  alert(devices=c.members,\
      \ top3=shap_top3(c));\noutput cluster_id, members, top3_features"
- question: Did a mobile device present a scripting or SDK User-Agent (curl, python-requests, Go-http-client,
    default okhttp) when contacting a web-service domain that is not a legitimate developer/API endpoint?
  context: Human web use comes from full browser stacks; script-based clients on a phone contacting consumer
    web services suggest programmatic C2. This symbolic-logic rule matches User-Agent strings against
    scripting/SDK regexes and alerts on requests to non-developer/non-API web-service domains, using the
    non-browser UA, URI-path, and header-ordering signatures documented in [SigmaHQ](https://github.com/SigmaHQ/sigma)
    and [Cobalt Strike Malleable C2 profiles, Unit 42](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/).
    A positive hit is a strong lead because legitimate mobile apps rarely expose raw scripting UAs to
    social/storage/paste sites; attackers can spoof UAs, so pair with fingerprinting below. This supports
    Command and Control by catching the automation client driving the web-service channel.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points with TLS inspection capabilities (e.g., via proxies or MDM profiles),
    Web Application Firewall (WAF) logs, and Cloud Access Security Broker (CASB) logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "http = zeek_http(filter=device.subnet in mobile_ranges);\nscript_ua = regex(curl|python-requests|Go-http-client|okhttp_default);\n\
      api_domains = feed['legit_dev_api_domains'];\nalert when http.user_agent matches script_ua\n   \
      \       and http.host not in api_domains;\noutput device, host, user_agent, uri"
- question: On encrypted mobile egress, do any TLS/HTTP client fingerprints (JA3/JA3S, JA4/JA4H) identify
    rare non-browser stacks contacting web services that fall outside the allow list of known browser/app
    clients?
  context: User-Agents can be forged but the TLS/HTTP client stack itself leaves a fingerprint. This method
    computes [JA3/JA3S, Salesforce](https://github.com/salesforce/ja3) and the randomization-resistant
    [JA4/JA4H, FoxIO](https://github.com/FoxIO-LLC/ja4) fingerprints on mobile egress, maintains allow
    lists of known browser/app stacks, and alerts on rare non-browser fingerprints contacting web services
    — working independently of IP/SNI on TLS 1.3. A rare fingerprint hitting a consumer web service is
    a strong, spoof-resistant indicator of a custom C2 client; expect occasional false positives from
    new app versions, so manage the allow list. This supports Command and Control by identifying the underlying
    client behind otherwise opaque encrypted web-service traffic.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points with TLS inspection capabilities (e.g., via proxies or MDM profiles),
    Web Application Firewall (WAF) logs, and Cloud Access Security Broker (CASB) logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'tls = zeek_ssl(filter=device.subnet in mobile_ranges);

      fp = compute(ja3, ja3s, ja4, ja4h);

      known = allowlist[''browser_app_stacks''];

      rare = fp where rarity_score(fp) high and fp not in known;

      alert when rare and dest in web_services;

      output device, dest, ja3, ja4, rarity_score'
- question: For a given web-service host, is a mobile device issuing unusually repetitive (low-entropy)
    URIs indicating automation, or conversely high-entropy encoded URI segments consistent with dead-drop
    content?
  context: Automation tends to hammer the same few URIs (low entropy), while dead-drop payloads ride in
    high-entropy encoded path/query segments. This method computes URI entropy per device-host pair and
    flags devices in the bottom 10th percentile for that host (repetitive automation), and separately
    flags high-entropy encoded URI segments or payloads using the Shannon-entropy and lexical bands validated
    in [NIOM-DGA, Computers & Security](https://www.sciencedirect.com/science/article/pii/S0167404825002500).
    Both ends of the entropy distribution are suspicious for different reasons; mid-range, varied URIs
    are typically benign browsing. This supports Command and Control by catching both the polling cadence
    and the encoded data exchange of a web-service dead drop.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points with TLS inspection capabilities (e.g., via proxies or MDM profiles),
    Web Application Firewall (WAF) logs, and Cloud Access Security Broker (CASB) logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'uri = group http by (device, host) over 90d;

      low = devices where percentile_rank(uri_entropy, within=host) <= 10;

      high = uri_segments where shannon_entropy(segment) in dga_band;

      alert when device in low or segment in high;

      output device, host, uri_entropy_pctile, high_entropy_segments'
- question: Does a supervised model score any mobile HTTP/S request to a web service as high-confidence
    malicious based on its User-Agent, URI characteristics, method mix, and client fingerprint rarity?
  context: Single heuristics miss combinations; a model learns the joint signature of malicious requests.
    This ML method trains on User-Agent, URI length/entropy, keyword flags, HTTP method distribution,
    and JA3/JA4 rarity, then alerts on high-confidence malicious scores (>0.9) and surfaces the top-3
    contributing features in the alert text, following the explainable supervised+unsupervised approach
    of [ProblemChild, Elastic](https://arxiv.org/abs/2008.04676). A high score with intuitive top features
    (e.g., scripting UA + rare JA4 + automation URI) is a strong, triage-ready lead; explainability lets
    the analyst validate quickly and tune for false positives. This supports Command and Control by flagging
    the individual web-service requests most likely to be C2.
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points with TLS inspection capabilities (e.g., via proxies or MDM profiles),
    Web Application Firewall (WAF) logs, and Cloud Access Security Broker (CASB) logs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = features(http, [ua, uri_len, uri_entropy, keyword_flags, method_dist, ja3_ja4_rarity]);

      score = model.predict_proba(X);

      alert when score > 0.9;

      emit top3 = explain(model, X);

      output device, host, uri, score, top3'
- question: Did any mobile device successfully resolve a DNS name that matches threat-intelligence C2
    domains or known web-service dead-drop hosts?
  context: Resolution of a known-bad name is one of the cleanest early signals of C2. This symbolic-logic
    rule matches dns.log queries from mobile devices against threat-intelligence C2 domains and known
    dead-drop hosts (per [Dead Drop Resolver (T1102.001), MITRE ATT&CK](https://attack.mitre.org/techniques/T1102/001/))
    and alerts on successful resolutions. A positive hit is high-fidelity but only as current as the intel
    feed, so it is a floor, not a ceiling — pair with the behavioral DNS methods below for unknown infrastructure.
    This supports Command and Control by catching the device's attempt to locate adversary infrastructure
    before or during a check-in.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Threat intelligence indicators
  - 'NAI: Internal DNS resolvers, Protective DNS (PDNS) logs, MDM-enforced DNS services, Firewall logs
    that capture both DNS requests and connection attempts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'dns = zeek_dns(filter=device.subnet in mobile_ranges);

      c2 = feed[''ti_c2_domains''] + feed[''T1102_001_deaddrops''];

      alert when dns.query in c2 and dns.rcode == NOERROR;

      output device, query, answers, ts'
- question: Is a mobile device resolving a web-service domain far more often than it actually connects
    to the resolved IPs, beyond the normal seasonal baseline for that service?
  context: A canary/check-in beacon resolves a domain to poll for instructions but only connects when
    there is work, producing a high DNS-to-connection ratio. This method computes that ratio per device/service
    in 1-hour windows and alerts when it exceeds the 99th percentile of service baselines, baselining
    expected request volume with hour-of-day/day-of-week seasonality and flagging residual departures
    per the time-series web-service IDS of [Lahmadi et al.](https://ieeexplore.ieee.org/document/7129383/)
    A positive result indicates poll-without-connect behavior typical of dead-drop checks; some apps prefetch
    DNS benignly, so seasonality-aware baselining reduces noise. This supports Command and Control by
    exposing the resolve-to-check pattern of a web-service canary.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Threat intelligence indicators
  - 'NAI: Internal DNS resolvers, Protective DNS (PDNS) logs, MDM-enforced DNS services, Firewall logs
    that capture both DNS requests and connection attempts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'win = group by (device, service) over 1h, range=90d;

      ratio = dns_count / max(connection_count,1);

      base = seasonal_baseline(ratio, by=[hour_of_day, day_of_week]);

      resid = ratio - base.expected;

      alert when ratio > percentile(base, 99) and resid large;

      output device, service, ratio, expected, resid'
- question: Is a mobile device generating bursts of NXDOMAIN/SERVFAIL responses for rotating web-service
    or CDN hostnames followed by only sparse successful connections?
  context: Fast hostname/IP rotation produces a failure-heavy DNS signature that precedes occasional successful
    check-ins. This method tracks NXDOMAIN and SERVFAIL rates per device as a distinct signal; bursts
    of failed resolutions for rotating web-service/CDN hostnames followed by only sparse successful connections
    indicate canary check-ins and fast rotation, as described in [Defending Against ORB Proxy Networks,
    Google/Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/orb-proxy-networks-defense-strategies)
    for ORB proxy networks. A positive result suggests resilient rotating C2; misconfigured apps and captive
    portals also fail to resolve, so weight the rotation breadth and the sparse-connect follow-on. This
    supports Command and Control by revealing the rotation/evasion behavior behind web-service dead drops.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Threat intelligence indicators
  - 'NAI: Internal DNS resolvers, Protective DNS (PDNS) logs, MDM-enforced DNS services, Firewall logs
    that capture both DNS requests and connection attempts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'dns = group by device over 90d;

      fail = count(rcode in [NXDOMAIN, SERVFAIL]);

      rot = distinct_count(failed_hostnames) per window;

      sparse = connection_count after failures;

      alert when burst(fail) and rot high and sparse low;

      output device, fail, rot_hostnames, subsequent_connections'
- question: Does a regression model predicting expected connections from DNS behavior show large positive
    residuals — far more connections than the device's history and domain popularity would predict?
  context: Modeling expected behavior lets unusual activity stand out as residual. This ML method trains
    a regression model using DNS query counts, time-of-day, domain popularity, and historical connections,
    then alerts on large positive residuals and surfaces the top-3 contributing features for triage, consistent
    with the explainable scoring of [ProblemChild, Elastic](https://arxiv.org/abs/2008.04676). A large
    positive residual means the device connected far more than its pattern predicts — a candidate for
    automated C2; explainability helps confirm whether DNS-to-connection ratio, time-of-day, or domain
    rarity drove the score. This supports Command and Control by quantifying deviations from a device's
    learned web-service connection norm.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Threat intelligence indicators
  - 'NAI: Internal DNS resolvers, Protective DNS (PDNS) logs, MDM-enforced DNS services, Firewall logs
    that capture both DNS requests and connection attempts'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = features(device, [dns_query_count, time_of_day, domain_popularity, hist_connections]);

      pred = reg.predict(X);

      resid = actual_connections - pred;

      alert when resid > residual_threshold;

      emit top3 = explain(reg, X);

      output device, service, actual, pred, resid, top3'
- question: Does web-service egress from a managed mobile app coincide with the device being backgrounded,
    locked, or showing no user interaction — or with the app being newly installed/updated or outside
    the approved list?
  context: 'On mobile, runtime context is the strongest disambiguator: legitimate web-service use is usually
    foreground and user-driven. This symbolic-logic rule alerts when web-service egress from a managed
    app coincides with backgrounded/locked/no-interaction device state, recent install/update, or out-of-approved-list
    status, joining MDM application-permission (DC0114) and EDR application-state (DC0123) telemetry to
    network flows — anchoring low-visibility mobile detection to managed-app context per [Dead Drop Resolver
    (T1102.001), MITRE ATT&CK](https://attack.mitre.org/techniques/T1102/001/). A positive correlation
    (app talks to a web service while the phone is locked and the app was just sideloaded) is a high-confidence
    C2 indicator; legitimate background sync exists, so weight the install recency and approval status.
    This supports Command and Control by tying covert egress to the anomalous app behavior driving it.'
  answer_sources:
  - VPN:MobileProxy network flows
  - MobileEDR:telemetry Application State
  - MDM Application Permission
  - Zeek conn.log
  - 'NAI: MDM/UEM telemetry, MobileEDR app-state, CASB/SASE flow logs correlated to managed-app identity,
    Corporate Wi-Fi/VPN egress sensors'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "egress = vpn_proxy_flows where dest in web_services and app=managed;\nstate = mobileedr_appstate(DC0123);\n\
      perm  = mdm_apppermission(DC0114);\nalert when egress joined state on (device, app, ts)\n      \
      \    and (state.backgrounded or state.locked or state.no_interaction)\n          and (perm.recently_installed\
      \ or perm.recently_updated or perm.out_of_approved_list);\noutput device, app, dest, state_flags,\
      \ perm_flags"
- question: Do per-flow/per-session network features for a managed app's web-service traffic match known-malicious
    mobile traffic when scored by a supervised classifier?
  context: Encrypted mobile flows still carry discriminative shape features. This ML method scores per-flow/per-session
    features (durations, forward/backward packet and byte counts and ratios, inter-arrival and idle/active
    statistics) with Random Forest/KNN/Decision Tree models trained on labeled mobile traffic such as
    the 80-feature [CICAndMal2017 dataset, Lashkari et al.](https://www.unb.ca/cic/datasets/andmal2017.html),
    and surfaces the top-3 contributing features in each alert. A flow resembling labeled malicious mobile
    traffic is a strong lead, and the top features (e.g., backward-byte ratio, idle-time pattern) help
    analysts validate; periodic retraining keeps it current. This supports Command and Control by classifying
    the shape of web-service flows that carry C2.
  answer_sources:
  - VPN:MobileProxy network flows
  - MobileEDR:telemetry Application State
  - MDM Application Permission
  - Zeek conn.log
  - 'NAI: MDM/UEM telemetry, MobileEDR app-state, CASB/SASE flow logs correlated to managed-app identity,
    Corporate Wi-Fi/VPN egress sensors'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = flow_features(session, CICAndMal2017_80);

      score = rf_knn_dt.predict_proba(X);

      alert when score >= malicious_threshold;

      emit top3 = feature_importance(model, X);

      output device, app, dest, score, top3'
- question: When mobile egress is modeled as a graph, do multiple devices converge on a single web-service
    destination in a hub-and-spoke pattern characteristic of a shared dead drop?
  context: 'Shared web-service dead drops create a tell-tale topology: many devices to one service. This
    ML method builds a device-to-destination flow graph and applies graph neural networks to flag hub-and-spoke
    / many-hosts-to-one-service structures characteristic of shared web-service dead drops contacted by
    multiple devices, per [GNN-MTC](https://onlinelibrary.wiley.com/doi/10.1111/1556-4029.70189). A dense
    convergence of unrelated devices on one uncommon destination is high-value; popular legitimate services
    will naturally be hubs, so weight destination rarity and device relatedness. This supports Command
    and Control by revealing the shared-infrastructure pattern of a fleet-wide web-service dead drop.'
  answer_sources:
  - VPN:MobileProxy network flows
  - MobileEDR:telemetry Application State
