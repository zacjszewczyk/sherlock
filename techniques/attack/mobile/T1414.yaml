name: 'T1414: Clipboard Data'
id: 7e5a1998-369b-4259-9eca-71b266e0aee9
description: 'This playbook helps an analyst investigate adversary abuse of mobile clipboard manager APIs
  (MITRE ATT&CK T1414, Clipboard Data) to steal sensitive information copied to the device clipboard,
  such as passwords pasted from a password manager. It covers both Android (ClipboardManager.addPrimaryClipChangedListener
  / getPrimaryClip abuse by non-IME apps, including foreground/IME confirmation) and iOS (UIPasteboard
  general access, including rapid or background polling and the iOS 14+ ''pasted from <app>'' cross-app
  notification). It supports two missions: detecting active clipboard collection (Collection, TA0035)
  and detecting capture of credentials copied from password managers or other sensitive apps (Credential
  Access, TA0031). The questions span static APK analysis, dynamic/instrumented behavioral telemetry,
  MTD/MDM event correlation (password-manager backgrounding followed by foreign-app clipboard reads),
  and the clipboard-read-then-network-egress information flow that confirms theft. Each evidence item
  is addressed with deterministic symbolic-logic rules, statistical baselining, and explainable machine-learning
  approaches.'
type: technique
related:
- tactic_id: TA0035
  tactic_name: Collection
- tactic_id: TA0031
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Which managed or vetted Android applications call ClipboardManager.addPrimaryClipChangedListener
    (or getPrimaryClip / getPrimaryClipDescription) in disassembled code while their AndroidManifest.xml
    does NOT declare the IME service intent-filter (android.view.inputmethod.InputMethod) and BIND_INPUT_METHOD
    permission?
  context: 'On Android the clipboard is globally readable by any app without a special permission, so
    a non-IME application has no legitimate reason to register a clipboard-change listener or repeatedly
    read the primary clip. By parsing the manifest for the IME intent-filter and BIND_INPUT_METHOD permission
    and confirming their absence, then statically scanning DEX for the clipboard APIs, you isolate apps
    that monitor the clipboard with no defensible purpose. Escalate severity when the same APK also declares
    egress capabilities (INTERNET, SEND_SMS), mirroring the high-weight explainable feature combinations
    seen in DREBIN. A positive result is a high-confidence indicator of clipboard-harvesting capability
    against the Collection tactic; a negative (legitimate IME app) reduces concern. This is a capability/intent
    check on the app, not proof of live theft, so pair it with runtime correlation. References: [Hey,
    You, Get Off of My Clipboard, Fahl et al.](https://link.springer.com/chapter/10.1007/978-3-642-39884-1_12)
    [DREBIN, Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - APK static analysis reports
  - AndroidManifest.xml
  - Disassembled DEX files
  - 'NAI: Managed Android devices, Corporate application vetting pipeline, Mobile Device Management (MDM)
    server, Source code repositories, Mobile Application Management (MAM) sandbox'
  range: Last 90 days (re-run on every new app submission or app-update event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM apk_static_analysis\nWHERE clipboard_api IN (\"addPrimaryClipChangedListener\",\"getPrimaryClip\"\
      ,\"getPrimaryClipDescription\")\n  AND manifest_intent_filter != \"android.view.inputmethod.InputMethod\"\
      \n  AND \"BIND_INPUT_METHOD\" NOT IN manifest_permissions\nTHEN severity = HIGH\nIF manifest_permissions\
      \ CONTAINS_ANY (\"INTERNET\",\"SEND_SMS\") THEN severity = CRITICAL"
- question: Do any analyzed Android APKs exhibit an abnormally high ratio of clipboard-listener/getPrimaryClip
    calls relative to total UI API calls (above the 99th percentile of a benign corpus), or contain DEX
    strings/asset blobs with Shannon entropy greater than 7.0 indicating packed or encrypted staging code?
  context: 'Malicious clipboard-harvesting logic is often either disproportionately clipboard-centric
    or deliberately hidden inside packed/encrypted payloads. Building a baseline of clipboard-API call
    frequency normalized by total UI API calls across a benign-APK corpus lets you flag statistical outliers
    (apps above the 99th percentile ratio) that focus unusually heavily on clipboard access. Separately,
    computing Shannon entropy of embedded DEX strings and asset blobs surfaces packing/encryption (entropy
    > 7.0) commonly used to conceal exfiltration logic. Derive both cutoffs per corpus (mean + 3 sigma)
    so thresholds adapt to your app population. A positive on either dimension warrants deeper static/dynamic
    review for clipboard collection capability. References: [Entropy Analysis, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - APK static analysis reports
  - AndroidManifest.xml
  - Disassembled DEX files
  - 'NAI: Managed Android devices, Corporate application vetting pipeline, Mobile Device Management (MDM)
    server, Source code repositories, Mobile Application Management (MAM) sandbox'
  range: Last 90 days (baseline rebuilt periodically over benign corpus)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// ratio outlier

      ratio = count(clipboard_api_calls) / count(total_ui_api_calls)

      baseline_p99 = percentile(corpus.ratio, 99)

      FLAG IF ratio > baseline_p99

      // entropy outlier

      FLAG IF shannon_entropy(dex_strings|asset_blobs) > 7.0

      // adaptive cutoff

      cutoff = mean(corpus.metric) + 3*stddev(corpus.metric)'
- question: When an explainable classifier scores an Android APK on static features (clipboard API presence,
    requested permissions, restricted/suspicious API calls, network endpoints, string entropy, reflection/dynamic-code-loading
    flags), which apps are flagged as clipboard-monitoring malware and what are the top-3 highest-weight
    features driving each verdict?
  context: 'A single rule can miss obfuscated variants, so an explainable linear SVM (DREBIN-style) trained
    on static features generalizes detection of clipboard-monitoring malware while preserving analyst
    trust by surfacing the top-3 highest-weight contributing features (e.g., ''clipboard listener + INTERNET
    + reflection''). In parallel, modeling abstracted API-call transitions as a Markov chain (MaMaDroid)
    flags apps whose behavioral transition profile matches automated clipboard-harvest patterns even when
    individual features look benign. Keep the deterministic non-IME clipboard-listener rule as the detection
    floor so ML never lowers the baseline. A flagged app with intuitive top features is a strong Collection-capability
    lead; review the explanation to rule out false positives before takedown. References: [DREBIN, Arp
    et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf) [MaMaDroid, Mariconti
    et al.](https://arxiv.org/pdf/1612.04433).'
  answer_sources:
  - APK static analysis reports
  - AndroidManifest.xml
  - Disassembled DEX files
  - 'NAI: Managed Android devices, Corporate application vetting pipeline, Mobile Device Management (MDM)
    server, Source code repositories, Mobile Application Management (MAM) sandbox'
  range: Last 90 days (score each new/updated APK)
  queries:
  - technology: ML/Pseudocode
    query: "features = [clipboard_api, permissions, restricted_api_calls, net_endpoints, string_entropy,\
      \ reflection_flag]\nscore = linear_svm.predict(features)\nIF score == MALICIOUS:\n  alert.top3 =\
      \ top_weighted_features(features, n=3)\n// parallel behavioral model\nmarkov = mamadroid_transition_profile(api_call_sequence)\n\
      FLAG IF cosine_sim(markov, clipboard_harvest_profile) > threshold\n// floor\nRETAIN deterministic\
      \ non-IME clipboard rule"
- question: Which iOS applications read UIPasteboard.general (general.string / general.items) more than
    twice per second, read the clipboard while in the background, or read on every applicationDidBecomeActive/willEnterForeground
    event without a corresponding user paste gesture?
  context: 'Legitimate clipboard use is user-driven (the person taps Paste). Automated harvesting instead
    polls UIPasteboard rapidly, reads in the background, or silently snoops on every foreground transition
    - the pattern Mysk documented across popular iOS apps. Instrumenting UIPasteboard.general in a sandbox/MTD
    agent and alerting on these frequency/background/no-gesture conditions catches non-user-driven access.
    Cross-reference the iOS 14+ ''pasted from <app>'' notification: a clipboard read with no user-visible
    paste action is automated harvesting. A positive is high-confidence clipboard collection behavior;
    absence of a paste gesture is the key discriminator from benign paste operations. References: [Apps
    Snooping on the Pasteboard, Mysk](https://www.mysk.blog/2020/03/10/popular-iphone-and-ipad-apps-snooping-on-the-pasteboard/).'
  answer_sources:
  - Instrumented API call logs (e.g., Frida trace)
  - MTD/MDM behavioral event logs (e.g., api_call, app_state_change)
  - 'NAI: Managed iOS devices, Corporate application vetting pipeline, Dynamic Application Security Testing
    (DAST) environment, Sandboxed analysis environment'
  range: Last 90 days (continuous during dynamic analysis sessions)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM api_trace WHERE api LIKE \"UIPasteboard.general%\"\nrate = count(read) over 1s window\
      \ by bundle_id\nALERT IF rate > 2\n   OR app_state == \"background\"\n   OR (read_on event IN (\"\
      applicationDidBecomeActive\",\"willEnterForeground\") AND user_paste_gesture == FALSE)\nCORROBORATE\
      \ WITH unifiedlog \"has pasted from\" notification absence"
- question: From MTD/MDM logs, which iOS apps access the clipboard within the lowest 5th percentile of
    time-after-applicationWillEnterForeground (sub-100ms), show low-entropy near-constant inter-access
    intervals, or produce a high rate of empty/unchanged clipboard reads?
  context: 'Human-driven pastes have variable, comparatively slow timing; machine polling does not. Computing
    the time-to-access after applicationWillEnterForeground and flagging apps in the lowest 5th percentile
    (sub-100ms is non-human) catches reflexive on-foreground snooping. Measuring the entropy/variance
    of inter-access intervals exposes machine polling (low-entropy, near-constant cadence) versus user-driven
    copy/paste (Warrender-style behavioral modeling). Profiling the State dimension - counting reads returning
    empty/unchanged clip (failed harvests) versus reads returning new content - reveals persistent polling,
    which generates many empty reads while waiting for sensitive content. Multiple positive dimensions
    strengthen the case for automated Collection. References: [System Calls Data Models, Warrender et
    al.](https://ieeexplore.ieee.org/document/766910).'
  answer_sources:
  - Instrumented API call logs (e.g., Frida trace)
  - MTD/MDM behavioral event logs (e.g., api_call, app_state_change)
  - 'NAI: Managed iOS devices, Corporate application vetting pipeline, Dynamic Application Security Testing
    (DAST) environment, Sandboxed analysis environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'delay = t(clipboard_read) - t(applicationWillEnterForeground)

      FLAG IF delay < percentile(corpus.delay, 5)   // sub-100ms

      intervals = diff(read_timestamps by bundle_id)

      FLAG IF entropy(intervals) low AND variance(intervals) ~ 0   // periodic polling

      empty_ratio = count(reads empty|unchanged) / count(reads)

      FLAG IF empty_ratio high   // continuous polling'
- question: When an anomaly model (LSTM autoencoder, or one-class SVM/Isolation Forest with LIME attribution)
    is run over benign iOS API-call and pasteboard-access sequences, which apps produce high reconstruction
    error or bursty/periodic background polling, and what top-3 features (access rate, foreground delay,
    post-read bytes) explain each anomaly?
  context: 'Sequence- and time-series-aware models capture clipboard-harvest behavior that static thresholds
    miss. An LSTM autoencoder (or Isolation Forest/one-class SVM with LIME) trained on benign API-call
    and pasteboard-access sequences flags high reconstruction error during dynamic analysis and surfaces
    the top-3 contributing features (access rate, foreground delay, post-read bytes) for analyst review.
    Treating each app''s access-count time series with C2-beaconing temporal modeling (Gupta et al.) catches
    bursty or periodic background polling. Retain the deterministic >2/sec rule as the non-ML floor so
    coverage never regresses. A high-error, intuitively-explained app is a strong Collection lead worth
    manual confirmation. References: [Isolation Forest and OCSVM with XAI, Sci Rep 2025](https://www.nature.com/articles/s41598-025-20445-4)
    [C2 Beaconing Time-Series Analysis, Gupta et al.](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20).'
  answer_sources:
  - Instrumented API call logs (e.g., Frida trace)
  - MTD/MDM behavioral event logs (e.g., api_call, app_state_change)
  - 'NAI: Managed iOS devices, Corporate application vetting pipeline, Dynamic Application Security Testing
    (DAST) environment, Sandboxed analysis environment'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: 'seq = pasteboard_access_and_api_sequence(bundle_id)

      err = lstm_autoencoder.reconstruction_error(seq)

      ALERT IF err > threshold

      alert.top3 = lime_attribution(err, [access_rate, foreground_delay, post_read_bytes])

      // temporal beaconing on access-count series

      FLAG IF beaconing_score(access_count_timeseries) high

      RETAIN rule: reads_per_sec > 2'
- question: Is there a clipboard_accessed event from a non-allowlisted app (not an approved browser or
    password manager) within 5 seconds after an app_backgrounded event for an approved password manager
    on the same device?
  context: 'This is the canonical credential-capture race: a user copies a password from their password
    manager, backgrounds it to switch apps, and a malicious app silently reads the copied credential from
    the global clipboard. Alerting when an approved password manager''s app_backgrounded event is followed
    within 5 seconds by a clipboard_accessed event from a non-allowlisted app on the same device catches
    this theft directly against the Credential Access tactic. On iOS, corroborate with the ''pasted from
    <pwmgr>'' cross-app notification - a read by an app the user never pasted into is high-confidence
    credential theft. A positive is an immediate, actionable incident; tune the allowlist to legitimate
    browsers/managers to control false positives. References: [Hey, You, Get Off of My Clipboard, Fahl
    et al.](https://link.springer.com/chapter/10.1007/978-3-642-39884-1_12) [Apps Snooping on the Pasteboard,
    Mysk](https://www.mysk.blog/2020/03/10/popular-iphone-and-ipad-apps-snooping-on-the-pasteboard/).'
  answer_sources:
  - MTD/MDM behavioral event logs (e.g., app_backgrounded, clipboard_accessed, device_id, app_name)
  - 'NAI: Managed mobile devices with corporate-approved password managers installed, MDM/MTD log aggregation
    platform (e.g., SIEM)'
  range: 'Last 90 days (correlation window: 5 seconds around password-manager backgrounding)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM mtd_events

      EVENT A: app_backgrounded WHERE app IN approved_password_managers

      EVENT B: clipboard_accessed WHERE app NOT IN allowlist(browsers,password_managers)

      ALERT IF B.device_id == A.device_id AND (B.time - A.time) <= 5s

      IF platform == iOS: corroborate "pasted from <pwmgr>" notification'
- question: Across devices, which apps show median clipboard-access latency after password-manager backgrounding
    in the lowest 10th percentile (sub-second), high clipboard reads per minute, or a high ratio of credential-shaped
    reads versus empty/unchanged reads?
  context: 'Automated credential theft is faster and more persistent than human behavior. Computing time
    deltas between password-manager backgrounding and clipboard access per app across the fleet and reporting
    apps with median deltas in the lowest 10th percentile (sub-second = automated) surfaces non-human
    grabbers. Profiling the Frequency dimension (clipboard reads per app per minute) and the State dimension
    (ratio of reads returning credential-shaped content versus empty/unchanged reads) reveals continuous
    polling for a credential window - a high empty-read rate means the app is waiting, watching for a
    password to appear. These statistical signals identify Credential Access offenders that any single
    event might miss. References: [System Calls Data Models, Warrender et al.](https://ieeexplore.ieee.org/document/766910).'
  answer_sources:
  - MTD/MDM behavioral event logs (e.g., app_backgrounded, clipboard_accessed, device_id, app_name)
  - 'NAI: Managed mobile devices with corporate-approved password managers installed, MDM/MTD log aggregation
    platform (e.g., SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'delta = t(clipboard_accessed) - t(pwmgr_backgrounded) by app, device

      REPORT apps WHERE median(delta) < percentile(fleet.delta, 10)   // sub-second

      reads_per_min = count(clipboard_read) per app per minute

      cred_ratio = count(reads credential_shaped) / count(reads empty|unchanged)

      FLAG high reads_per_min OR high empty-read rate'
- question: When a sequence classifier (RNN/LSTM) scores MTD event sequences (foreground/background transitions,
    clipboard reads, file writes, socket opens), which sequences are classified malicious, and does the
    rare transition password-manager_background -> foreign_app_clip_read -> network appear?
  context: 'Credential theft manifests as a characteristic event sequence rather than a single event.
    Training an RNN/LSTM sequence classifier on labeled MTD event sequences (foreground/background transitions,
    clipboard reads, file writes, socket opens) flags malicious sequences and surfaces the top-3 sequence
    features driving the score for analyst review. Equivalently, modeling abstracted API-call transitions
    as a Markov chain (MaMaDroid) makes the rare, telling transition pwmgr_background -> foreign_app_clip_read
    -> network stand out. Keep the 5-second deterministic correlation as the floor so detection never
    regresses. A malicious-classified sequence containing the read-then-egress pattern is strong evidence
    of clipboard-based Credential Access. References: [MaMaDroid, Mariconti et al.](https://arxiv.org/pdf/1612.04433).'
  answer_sources:
  - MTD/MDM behavioral event logs (e.g., app_backgrounded, clipboard_accessed, device_id, app_name)
  - 'NAI: Managed mobile devices with corporate-approved password managers installed, MDM/MTD log aggregation
    platform (e.g., SIEM)'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: 'seq = mtd_event_sequence(device_id)  // fg/bg, clip_read, file_write, socket_open

      label = lstm_classifier.predict(seq)

      IF label == MALICIOUS: alert.top3 = top_sequence_features(seq)

      markov = mamadroid_transitions(seq)

      FLAG IF transition(pwmgr_background -> foreign_app_clip_read -> network) present

      RETAIN 5s deterministic correlation floor'
- question: Does an app initiate an outbound network connection within 2 minutes of accessing the clipboard,
    where the destination matches a high-confidence C2 / threat-intelligence indicator?
  context: 'The read-then-egress information flow is what confirms clipboard theft turned into exfiltration.
    Correlating MTD clipboard_accessed events with Zeek conn.log/dns.log within a 2-minute window and
    alerting when the destination appears in a high-confidence C2/threat-intel feed (mirrored locally
    so no mandatory external lookup is needed) directly evidences credential exfiltration (TaintDroid-style
    taint-to-sink reasoning). A positive is a high-severity Credential Access incident: sensitive clipboard
    content was captured and sent to known-malicious infrastructure. Validate the clipboard-to-connection
    attribution on the same device and tighten the window if benign background traffic creates noise.
    References: [TaintDroid, Enck et al.](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf).'
  answer_sources:
  - MTD/MDM behavioral event logs
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Managed mobile device endpoints, Corporate VPN concentrators, DNS resolvers, Network egress
    points, Threat Intelligence Platform'
  range: 'Last 90 days (event-centered: 2-minute window after each clipboard access)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "JOIN mtd.clipboard_accessed C, zeek.conn/dns N\n  ON C.device_id == N.src_id AND (N.ts - C.ts)\
      \ BETWEEN 0 AND 120s\nALERT IF N.dest IN local_c2_threatintel_feed\nseverity = HIGH"
  - technology: Zeek/pseudocode
    query: "// enrich conn.log with TI\nconn.log | where ts within 120s of clipboard_access\n        \
      \ | lookup dest in intel.dat (C2 indicators)\n         | emit matches"
- question: Among connections within 2 minutes of clipboard access, which destinations are newly registered
    domains, have domain Shannon entropy greater than 3.5 (DGA-like), or use self-signed/invalid TLS certificates
    - and are there spikes in NXDOMAIN, connection RST/timeouts, repeated TLS handshake failures, or an
    outsized upload following a small clip read?
  context: 'Adversary exfil infrastructure is often freshly registered, algorithmically generated, or
    poorly certificated, and failed exfil attempts leave distinctive network failure patterns. For connections
    within 2 minutes of clipboard access, flag destinations with domain Shannon entropy > 3.5 (DGA-like),
    newly registered domains, or self-signed/invalid TLS certificates - alert on any condition. Profile
    failure modes as distinct signals: spikes in NXDOMAIN, connection RST/timeouts, or repeated TLS handshake
    failures after clipboard access indicate exfil to dead or blocked infrastructure. Track Volume: a
    small clipboard read followed by an outsized upload (orig_bytes) is anomalous and consistent with
    bundled credential exfiltration. Together these statistically corroborate Credential Access even without
    a TI hit. References: [Entropy Analysis, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - MTD/MDM behavioral event logs
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Managed mobile device endpoints, Corporate VPN concentrators, DNS resolvers, Network egress
    points, Threat Intelligence Platform'
  range: 'Last 90 days (event-centered: 2-minute window after clipboard access)'
  queries:
  - technology: Zeek/pseudocode
    query: "FOR conn within 120s of clipboard_access:\n  FLAG IF shannon_entropy(dns.query) > 3.5    \
      \        // DGA-like\n  FLAG IF domain_age(dns.query) < NRD_threshold        // newly registered\n\
      \  FLAG IF x509.cert self_signed OR invalid             // ssl.log/x509.log\n// failure-mode signals\n\
      ALERT ON spike(dns NXDOMAIN), conn RST|timeout, repeated ssl handshake failures\n// volume anomaly\n\
      FLAG IF conn.orig_bytes >> clip_read_size"
- question: When post-clipboard network flows (within 5 minutes) are clustered on features such as destination
    port, protocol, orig_bytes, resp_bytes, JA3/JA3S, domain entropy, and time-since-clip, which rare
    flows or high-jitter beaconing patterns isolate, and does provenance-graph learning link the clipboard-access
    process to atypical staging files or rare destinations?
  context: 'Unsupervised and graph-based methods catch novel exfil channels that signatures miss. Building
    flow feature vectors for connections within 5 minutes of clipboard access and clustering them (DBSCAN/TF-IDF)
    isolates rare flows for investigation. Modeling each app''s egress time series for high-jitter beaconing
    (Gupta et al.) catches periodic callbacks, and whole-system provenance-graph learning (KAIROS, ThreaTrace)
    flags a clipboard-access process node that links to atypical staging files or rare destinations, surfacing
    the contributing node/edge features. Retain the deterministic C2-feed and entropy/NRD/TLS rules as
    the floor. A rare isolated cluster or anomalous provenance subgraph is a strong lead for clipboard-based
    credential exfiltration warranting full timeline reconstruction. References: [Mal-API-2019 ML Evaluation](https://arxiv.org/abs/2403.02232)
    [C2 Beaconing Time-Series Analysis, Gupta et al.](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20)
    [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf) [ThreaTrace, Wang et al.](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - MTD/MDM behavioral event logs
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Managed mobile device endpoints, Corporate VPN concentrators, DNS resolvers, Network egress
    points, Threat Intelligence Platform'
  range: 'Last 90 days (event-centered: 5-minute window after clipboard access)'
  queries:
  - technology: ML/Pseudocode
    query: 'vec = [dest_port, proto, orig_bytes, resp_bytes, ja3, ja3s, domain_entropy, time_since_clip]

      clusters = DBSCAN(vec for conns within 300s of clipboard_access)

      SURFACE small/rare clusters for review

      FLAG high-jitter beaconing in per_app_egress_timeseries

      graph = provenance_graph(clipboard_proc -> files,sockets)

      ALERT IF graph links to atypical staging_file OR rare_destination

      RETAIN C2-feed + entropy/NRD/TLS rules as floor'
