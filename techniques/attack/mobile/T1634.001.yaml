name: 'T1634.001: Keychain'
id: 95f7b594-a628-4283-9f3d-18faf40b55e8
description: 'Investigate whether an adversary is attempting to steal credentials from an iOS device keychain
  (T1634.001) by escalating privilege or abusing existing root/jailbreak access to read the raw, encrypted
  keychain database that sits outside the per-app sandbox. The keychain holds Wi-Fi passwords, website
  and app credentials, secure notes, certificates, private keys, and VPN secrets, so its theft yields
  broad downstream access. Because the on-device attack is largely invisible to enterprise sensors, this
  playbook pivots an analyst across four corroborating evidence vantage points: (1) network telemetry
  (Zeek dns.log/ssl.log/conn.log) for signs of a jailbroken device contacting jailbreak tool repositories,
  TLS interception/MitM, and low-throughput DNS covert channels; (2) network egress for the actual exfiltration
  of a large, high-entropy encrypted keychain blob to low-reputation infrastructure; (3) MDM/UEM and Mobile
  Threat Defense telemetry for explicit jailbreak/attestation failures, rare or sideloaded app installations,
  and out-of-sandbox files/processes; and (4) application vetting (static and dynamic) for embedded exploits,
  raw keychain-path/Security-framework references, and taint flows from keystore sources to network sinks.
  For each vantage point it supplies deterministic symbolic-logic watchlist/signature rules, statistical
  baselines (percentiles, Shannon entropy, issuer-diversity and failure-rate tracking), and explainable
  machine-learning models (Isolation Forest, autoencoders, Random Forest/Gradient Boosting, Markov-chain
  API sequencing, taint analysis) so that defensible deterministic rules always run in parallel with anomaly
  detection.'
type: technique
related:
- tactic_id: TA0031
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any mobile device on the corporate network issue a DNS query (Zeek dns.log) for a known
    jailbreak tool or package-repository domain such as cydia.saurik.com, unc0ver.dev, checkra.in, getsileo.app,
    sileo.app, or odysseynext.com?
  context: Raw keychain extraction requires a jailbroken device, and devices are usually jailbroken by
    fetching tools or packages from a small, well-known set of repositories. Matching the dns.log query
    field against a maintained watchlist of jailbreak tool/repository domains and subdomains is the cheapest,
    highest-confidence deterministic signal that a managed device has entered (or is about to enter) the
    jailbroken state that precedes keychain theft under the Credential Access tactic. A positive match
    should raise a high-severity alert carrying the source IP, queried domain, timestamp, and matched
    watchlist category; a negative result does not clear the device (resolvers can be bypassed) but removes
    the most obvious precursor. Keep the watchlist current and include package-mirror wildcards (repo.*).
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network segments, VPN termination points, DNS resolvers, and web proxies handling
    mobile device traffic.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'for each q in dns.log: if lower(q.query) in jailbreak_repo_watchlist or matches(q.query, ''repo.*mirror''):
      alert(severity=high, src=q.id.orig_h, domain=q.query, ts=q.ts, category=watchlist_category[q.query])'
- question: For domains resolved by a mobile device shortly before or after a jailbreak/keychain alert,
    do their passive-DNS reputation features (domain age, TTL, lexical/n-gram rarity) indicate a newly
    registered or algorithmically generated domain?
  context: Beyond a static watchlist, adversary infrastructure is often brand-new or DGA-generated and
    therefore lexically rare with low TTLs. Scoring each device-resolved domain on first-party reputation
    features (domain age, TTL, n-gram lexical rarity) per the EXPOSURE passive-DNS methodology surfaces
    suspicious resolutions that no watchlist would catch. In the Credential Access context, a newly observed
    (<7-day-old) or low-TTL high-entropy domain contacted within an hour of any jailbreak/keychain indicator
    strongly suggests staging or exfiltration infrastructure. The alert should surface domain age, TTL,
    and entropy as the contributing reasons so an analyst can triage quickly; a benign, aged, popular
    domain lowers concern.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network segments, VPN termination points, DNS resolvers, and web proxies handling
    mobile device traffic.'
  range: Last 90 days; correlate within 1h of any jailbreak/keychain alert
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each resolved_domain by device: age=lookup_age(domain); ttl=min_ttl(domain); ent=ngram_entropy(domain);
      if (age<7d or (ttl<60 and ent>threshold)) and within(1h, jailbreak_alert[device]): alert(reasons=[age,ttl,ent])'
- question: Over a rolling baseline, has a single mobile device shown an elevated rate of TLS certificate-validation
    failures, a collapse in certificate-issuer entropy (single-issuer MitM), or an abnormal NXDOMAIN/SERVFAIL
    fraction?
  context: 'Jailbreaking and on-device interception tooling frequently introduce TLS MitM (re-signed certificates)
    and covert DNS channels. Establishing a 14-day per-device baseline from Zeek ssl.log and dns.log and
    tracking three metrics — (A) the ratio of sessions where validation_status != ok, (B) the Shannon
    entropy of the certificate issuer field, and (C) the NXDOMAIN/SERVFAIL fraction — lets you alert on
    statistically significant deviations: (A) above the 95th percentile signals interception, (B) below
    the 5th percentile signals a single re-signing proxy, and (C) above the 99th percentile of benign
    DNS failure rates signals low-throughput DNS exfiltration. The alert text must name which of A/B/C
    fired and its value versus baseline so the rationale is explicit and tactic-specific to credential
    theft staging.'
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network segments, VPN termination points, DNS resolvers, and web proxies handling
    mobile device traffic.'
  range: Last 90 days; per-device 14-day rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per device_ip over 14d baseline: A=ratio(ssl.validation_status!=''ok''); B=shannon(ssl.issuer);
      C=frac(dns.rcode in {NXDOMAIN,SERVFAIL}); if A>p95(A) or B<p05(B) or C>p99(benign_C): alert(metric_fired,
      value, baseline)'
- question: Does an unsupervised anomaly model over combined TLS/DNS/connection session features flag
    a cluster of anomalous sessions from a single mobile device, with explainable top contributing features?
  context: Sophisticated actors evade single-metric rules, so an Isolation Forest trained on legitimate
    session features from Zeek ssl.log/dns.log/conn.log (certificate validity period, SNI rarity via 24h
    TF-IDF, validation_status, orig_bytes, resp_bytes, duration, subdomain entropy, query length) captures
    multivariate deviations characteristic of jailbreak/interception activity. Using a stateless lexical/volume
    feature design and surfacing the top-3 contributing features per alert via LIME-style attribution
    keeps the model explainable and defensible. Prioritize clusters of anomalies originating from a single
    device — consistent with one compromised handset — and never suppress the deterministic watchlist
    and baseline rules above; the ML layer augments, not replaces, them.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network segments, VPN termination points, DNS resolvers, and web proxies handling
    mobile device traffic.'
  range: Last 90 days; train on 30+ days of benign sessions
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=IsolationForest.fit(benign[ssl,dns,conn] features); score=model.decision_function(session);
      if score<anomaly_threshold: alert(top3=lime_attribution(session)); rank by per-device anomaly cluster
      size; keep watchlist+baseline rules as floor'
- question: Does any outbound connection from a mobile device IP (Zeek conn.log/ssl.log) terminate at
    an IP or TLS server_name that matches threat intelligence for known C2, anonymization services, or
    suspicious hosting providers?
  context: The end goal of keychain theft is to move the stolen, encrypted database off the device. Matching
    the destination id.resp_h and TLS server_name of connections from mobile-device subnets against curated
    threat intelligence (C2, VPN/Tor anonymizers, abuse-prone hosting) is a deterministic, high-confidence
    way to catch the exfiltration leg under Credential Access. Any match should alert with full connection
    context — bytes, duration, port, and ASN — so analysts can immediately judge whether a sizable upload
    occurred. A negative result is not exculpatory because novel infrastructure won't be in TI, which
    is why the statistical and ML methods below run alongside.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Network egress points, firewalls, and cloud access security brokers (CASBs) monitoring traffic
    from mobile device subnets.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'for each conn from mobile_subnet: if conn.id_resp_h in TI or ssl.server_name in TI: alert(dst=conn.id_resp_h,
      sni=ssl.server_name, bytes=conn.orig_bytes, dur=conn.duration, port=conn.id_resp_p, asn=lookup_asn(conn.id_resp_h))'
- question: Has a single outbound connection from a mobile device exceeded that device's 99.5th-percentile
    outbound byte volume, shown an anomalous orig/resp byte ratio, gone to a rarely-seen destination or
    non-standard port, or coincided with a spike in blocked/reset egress attempts?
  context: Exfiltrating a keychain database is a volumetric anomaly against the chatty-but-small profile
    of normal mobile apps. Maintaining a 30-day per-device baseline of outbound bytes per connection (orig_bytes),
    the orig/resp byte ratio, and flow inter-arrival timing — the flow-only Volume/Frequency/State features
    shown discriminative in CorrNetDroid and CICAndMal2017 — lets you alert when a single connection exceeds
    the device's 99.5th percentile orig_bytes. Escalate when the destination is seen fewer than three
    times in 30 days, the port is not 80/443, or blocked/reset egress attempts (conn_state S0/REJ/RSTO)
    spike above the 99th percentile, since a failed-then-retried upload is itself a strong signal. Derive
    percentiles per-fleet from your own conn.log so thresholds reflect your environment.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Network egress points, firewalls, and cloud access security brokers (CASBs) monitoring traffic
    from mobile device subnets.'
  range: Last 90 days; per-device 30-day baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per device_ip over 30d: if conn.orig_bytes>p99_5(orig_bytes): alert; escalate if seen_count(dst,30d)<3
      or conn.id_resp_p not in {80,443} or count(conn_state in {S0,REJ,RSTO})>p99(blocked_rate)'
- question: Does an outbound session or extracted file from a mobile device carry a sustained high-entropy
    payload (above ~7.2 bits/byte) consistent with an encrypted/compressed keychain blob, especially when
    correlated with a jailbreak or MDM alert on the same device?
  context: The iOS keychain is an encrypted SQLite store, so its exfiltration appears as a sustained high-entropy
    payload. Computing Shannon entropy over sessions or extracted files and flagging sustained values
    above ~7.2 bits/byte (the encrypted/compressed range per Lyda & Hamrock) identifies likely keychain
    blobs leaving the network. This signal is most decisive when it correlates in time with a jailbreak/MDM
    compromise alert on the same device, tying the Credential Access objective to an observed upload.
    Report the measured entropy and byte volume in the alert so an analyst can corroborate; legitimate
    TLS already looks high-entropy, so weight the correlation and volume context heavily to control false
    positives.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Network egress points, firewalls, and cloud access security brokers (CASBs) monitoring traffic
    from mobile device subnets.'
  range: Last 90 days; correlate with same-device jailbreak/MDM alerts
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for session/file from mobile device: H=shannon_entropy(payload); if H>7.2 and sustained and
      correlated(jailbreak_or_mdm_alert[device]): alert(entropy=H, bytes=volume)'
- question: Does an explainable anomaly model over connection-flow features flag an outbound connection
    from a mobile device as a strong outlier, prioritizing large orig_bytes and temporal proximity to
    other compromise alerts?
  context: To catch exfiltration to never-before-seen infrastructure, train an autoencoder or Isolation
    Forest on legitimate conn.log patterns (orig_bytes, resp_bytes, ratio, duration, destination port,
    protocol, destination ASN, and flow inter-arrival-time statistics) using the network-flow feature
    methodology of CorrNetDroid. Flag high reconstruction/anomaly error, prioritizing connections with
    large orig_bytes and temporal proximity to other compromise alerts on the same device, and surface
    the top-3 contributing features per alert so the decision is explainable. Keep the deterministic byte/ratio
    thresholds above as a parallel floor so that obvious volumetric exfiltration is never missed if the
    model under-scores it. This directly supports the Credential Access tactic by isolating the data-egress
    moment of keychain theft.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Network egress points, firewalls, and cloud access security brokers (CASBs) monitoring traffic
    from mobile device subnets.'
  range: Last 90 days; train on 30+ days of benign conn.log
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=IsolationForest|Autoencoder.fit(benign conn features); err=model.score(conn); if err>threshold:
      alert(top3=attribution(conn)); rank by orig_bytes and proximity to compromise alerts; retain deterministic
      byte/ratio floor'
- question: Has the MDM/UEM platform reported an explicit integrity/attestation failure (isJailbroken=true,
    failed attestation, complianceState=Non-Compliant) or the presence of jailbreak artifacts such as
    Cydia.app, /bin/bash, sshd, /etc/apt, or MobileSubstrate on a managed device?
  context: An MDM/UEM compliance or attestation failure is the most direct enterprise-visible indicator
    that a device has reached the jailbroken state required for raw keychain extraction. Generate a critical
    alert when MDM logs indicate compromised integrity (isJailbroken=true, failed attestation, complianceState=Non-Compliant)
    or report jailbreak artifacts (Cydia.app, /bin/bash, sshd, /etc/apt, MobileSubstrate). Because app-side
    and OS-side checks are bypassable, corroborate with independent network/MTD telemetry per NIST SP
    800-124r2 before and after triggering SOAR quarantine and conditional-access revocation. Include the
    device identifier, user, and the specific artifact or flag that fired so response is unambiguous.
    This is the highest-priority deterministic rule for the Credential Access tactic on iOS.
  answer_sources:
  - MDM Platform Logs (e.g., Compliance Status, Application Inventory)
  - 'NAI: Mobile Device Management (MDM) and Unified Endpoint Management (UEM) platforms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'for each mdm_event: if isJailbroken==true or attestation==''failed'' or complianceState==''Non-Compliant''
      or artifact in {Cydia.app,/bin/bash,sshd,/etc/apt,MobileSubstrate}: alert(severity=critical, device,
      user, artifact); corroborate(network/MTD); soar_quarantine + revoke_conditional_access'
- question: Has a managed device installed an application whose prevalence across the fleet is below 1%
    (excluding approved deployments) or an unsigned/sideloaded helper consistent with a keychain extraction-agent
    workflow?
  context: Jailbreak and keychain-extraction toolchains involve rare or sideloaded apps that stand out
    against a managed fleet's app distribution. Computing app prevalence daily across MDM application
    inventory and alerting when a device installs an app with prevalence <1% (excluding approved deployments),
    or an unsigned/sideloaded helper consistent with the ElcomSoft low-level extraction-agent workflow,
    surfaces these outliers. Rank alerts by the number of rare apps per device and name the rare app(s)
    in the alert so analysts can immediately assess intent. In the Credential Access context, a rare extraction
    helper appearing alongside a jailbreak indicator is a strong corroborator; a single rare-but-benign
    enterprise app is low concern.
  answer_sources:
  - MDM Platform Logs (e.g., Compliance Status, Application Inventory)
  - 'NAI: Mobile Device Management (MDM) and Unified Endpoint Management (UEM) platforms.'
  range: Last 90 days; daily fleet-prevalence computation
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'daily: prevalence[app]=installs(app)/fleet_size; for each device install: if prevalence[app]<0.01
      and app not in approved_deployments or app.unsigned: alert(rank=count_rare_apps[device], apps=rare_app_names)'
- question: Does a supervised classifier over MDM telemetry predict a sustained high probability (>0.90)
    that a device is compromised/jailbroken, with the top contributing features surfaced for the analyst?
  context: Some compromises evade single deterministic checks but manifest as a pattern across device
    telemetry. Training a classifier (Random Forest / Gradient Boosting) on historical MDM data — with
    confirmed jailbroken devices as positives — over features such as OS version, time since last update,
    installed app count, policy-violation count, device-model age, and attestation history can predict
    compromise before an explicit attestation failure. Trigger a high-severity alert for sustained probability
    >0.90 and, following the explainable-detection approach of DREBIN, surface the top-3 contributing
    features in the alert text so the analyst understands why. Never override the deterministic attestation
    rule; the model adds early/probabilistic coverage to the Credential Access detection stack without
    replacing ground-truth signals.
  answer_sources:
  - MDM Platform Logs (e.g., Compliance Status, Application Inventory)
  - 'NAI: Mobile Device Management (MDM) and Unified Endpoint Management (UEM) platforms.'
  range: Last 90 days; train on historical MDM data with confirmed positives
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=RandomForest|GBM.fit(mdm_history, label=confirmed_jailbroken); p=model.predict_proba(device);
      if sustained(p>0.90): alert(severity=high, top3=feature_importance(device)); never override deterministic
      attestation rule'
- question: Does a vetted or deployed application contain strings/paths indicative of keychain extraction
    or jailbreak — e.g., keychain-2.db, /private/var/Keychains, class-key APIs, /bin/bash, MobileSubstrate,
    fork/system, or cydia:// schemes — outside the documented per-app keychain access path?
  context: An app that reads the keychain outside its sandbox must reference raw keychain storage or carry
    jailbreak/privilege-escalation primitives. Statically scanning app packages for strings/paths indicative
    of keychain extraction or jailbreak (keychain-2.db, /private/var/Keychains, class-key APIs, /bin/bash,
    MobileSubstrate, fork/system, cydia:// schemes) using the Kellner et al. and Liu et al. indicator
    catalogs flags the on-device capability required for credential theft. Flag any non-IME/non-system
    app referencing raw keychain storage outside the documented per-app access path described by Apple's
    Keychain Services and Keychain Data Protection guidance. A legitimate app should only use the per-app
    keychain API; references to the raw DB path or system-modification primitives are strong evidence
    of malicious intent under the Credential Access tactic.
  answer_sources:
  - 'Application Vetting (Static Analysis: strings, entitlements, embedded binaries)'
  - 'Application Vetting (Dynamic Analysis: API calls, information-flow)'
  - 'NAI: Enterprise application-vetting pipeline and Mobile Threat Defense sandbox (cf. NIST SP 800-163
    / SP 800-124r2).'
  range: Last 90 days; run per app submission/update
  queries:
  - technology: App-Vetting/Static pseudocode
    query: 'for each app package: strings=extract(app); if any(s in strings for s in {keychain-2.db,/private/var/Keychains,class-key
      APIs,/bin/bash,MobileSubstrate,fork/system,cydia://}) and app not in {system,IME}: flag(app, matched_indicator)'
- question: Does an app bundle contain embedded resources or segments with Shannon entropy above ~7.2
    bits/byte, consistent with an encrypted or packed exploit payload?
  context: Bundled privilege-escalation/jailbreak exploits are typically encrypted or packed to evade
    signature scanning, which raises their entropy. Computing the Shannon entropy of embedded resources/segments
    and flagging bundles containing blobs >7.2 bits/byte (the encrypted/packed range per Lyda & Hamrock)
    identifies hidden exploit payloads that strings/signatures would miss. Report the segment offset and
    measured entropy for triage so an analyst can pull and analyze the specific blob. In the Credential
    Access context, a high-entropy embedded payload in an app that has no legitimate need for one — especially
    combined with keychain-path references — indicates a weaponized app intended to jailbreak the device
    and read the keychain.
  answer_sources:
  - 'Application Vetting (Static Analysis: strings, entitlements, embedded binaries)'
  - 'Application Vetting (Dynamic Analysis: API calls, information-flow)'
  - 'NAI: Enterprise application-vetting pipeline and Mobile Threat Defense sandbox (cf. NIST SP 800-163
    / SP 800-124r2).'
  range: Last 90 days; run per app submission/update
  queries:
  - technology: App-Vetting/Static pseudocode
    query: 'for each segment/resource in app: H=shannon_entropy(segment); if H>7.2: flag(app, offset=segment.offset,
      entropy=H)'
- question: Does a static classifier over an app's manifest, entitlements, API, and string features classify
    it as malicious, with human-readable top contributing features (e.g., privilege-escalation API plus
    keychain-path string)?
  context: Individual signatures miss novel or obfuscated malicious apps, so apply a static classifier
    over manifest/entitlements/API/string features following the DREBIN approach, which ships an interpretable
    model that surfaces the top contributing features per decision. Rather than emitting only a score,
    the alert should name the human-readable contributing features (for example, a privilege-escalation
    API combined with a keychain-path string) so a vetting analyst can immediately judge whether the combination
    is consistent with keychain theft. This explainable static classification broadens coverage of the
    on-device capability for Credential Access while keeping decisions defensible and auditable; it complements,
    and does not replace, the deterministic signature scan above.
  answer_sources:
  - 'Application Vetting (Static Analysis: strings, entitlements, embedded binaries)'
  - 'Application Vetting (Dynamic Analysis: API calls, information-flow)'
  - 'NAI: Enterprise application-vetting pipeline and Mobile Threat Defense sandbox (cf. NIST SP 800-163
    / SP 800-124r2).'
  range: Last 90 days; run per app submission/update
  queries:
  - technology: App-Vetting/ML pseudocode
    query: 'model=DREBIN_static.fit(labeled_apps); decision=model.predict(app[manifest,entitlements,api,strings]);
      if decision==malicious: alert(top_features=interpretable_contributors(app))'
- question: Does dynamic analysis show a low-probability runtime API-call sequence (privilege escalation
    -> bulk keystore read -> socket) or a taint flow from a keystore source to a network sink confirming
    keychain exfiltration?
  context: 'The decisive proof of keychain theft is behavioral: an app that escalates privilege, performs
    a bulk keystore read, and then sends data over a socket. Modeling the app''s runtime API-call sequence
    as Markov-chain transitions per MaMaDroid and flagging low-probability transitions (privilege escalation
    -> bulk keystore read -> socket) catches this anomalous control flow even for previously unseen apps.
    Confirm actual exfiltration with dynamic taint tracking from keystore sources to network sinks as
    in TaintDroid: a tainted keychain value reaching a socket is high-confidence theft evidence. This
    is the strongest single confirmation for the Credential Access tactic, since it observes credentials
    actually leaving the device rather than merely the capability to do so.'
  answer_sources:
  - 'Application Vetting (Static Analysis: strings, entitlements, embedded binaries)'
  - 'Application Vetting (Dynamic Analysis: API calls, information-flow)'
  - 'NAI: Enterprise application-vetting pipeline and Mobile Threat Defense sandbox (cf. NIST SP 800-163
    / SP 800-124r2).'
  range: Last 90 days; run in MTD dynamic sandbox per submission/update
  queries:
  - technology: App-Vetting/Dynamic pseudocode
    query: 'seq=runtime_api_calls(app); if markov_prob(seq, model=MaMaDroid) < low_threshold for pattern[priv_esc->bulk_keystore_read->socket]:
      flag; taint=taintdroid(source=keystore, sink=network); if taint.reaches_sink: alert(high_confidence=''keychain
      value reached socket'')'
