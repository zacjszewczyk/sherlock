questions:
- question: Did an application activate the microphone while the device was backgrounded, screen-locked,
    or on an active call, and then connect within ~60 seconds to a destination that matches a threat-intelligence
    indicator?
  context: 'This question targets the deterministic source-to-sink correlation at the heart of the Collection
    tactic: tainted microphone audio reaching a network sink. Join MDM microphone access logs with MDM
    application-state logs and Zeek conn.log/dns.log by device ID, then alert when a background/locked/in-call
    microphone activation is followed within 60 seconds by communication to a known C2 destination from
    a threat-intel feed. A positive result strongly indicates a context-aware audio trojan exfiltrating
    captured audio to attacker infrastructure; a negative result reduces suspicion but does not rule out
    exfiltration to never-before-seen destinations (covered by other questions). This mirrors the TaintDroid
    approach of recording the responsible app and destination when tainted mic data reaches the network.'
  answer_sources:
  - MDM microphone access logs
  - MDM application state logs
  - OS API execution logs (android:logcat, iOS:unifiedlog)
  - Runtime permission grant/deny logs (RECORD_AUDIO prompts)
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Managed mobile device fleet (both corporate-owned and BYOD), Mobile Device Management (MDM)
    and Mobile Threat Defense (MTD) servers, Network egress points capturing traffic from mobile device
    subnets (e.g., VPN concentrators, corporate Wi-Fi access points, proxies)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'JOIN mdm_mic_access, mdm_app_state, zeek_conn, zeek_dns ON device_id

      WHERE mdm_app_state.state IN (''background'',''locked'',''in_call'')

      AND mic_access.event = ''mic_on''

      AND zeek_conn.ts BETWEEN mic_on.ts AND mic_on.ts + 60s

      AND (zeek_conn.dest_ip IN threat_intel.c2 OR zeek_dns.query IN threat_intel.c2_domains)

      | ALERT severity=critical fields=app,device_id,dest_ip,dest_domain'
  - technology: Zeek/pseudocode
    query: '# enrich conn.log with TI, then correlate to MDM mic events by device subnet/IP

      conn.log | dest_ip in intel_seen | join mic_events on device_ip within 60s'
- question: Is any application holding an active microphone session while the screen is locked, the app
    is backgrounded, or a call is in progress without a foreground recording UI or a declared call-recording
    capability?
  context: This implements an Audio-Sensor-Manager-style context-aware reference monitor (per Soundcomber)
    appropriate to the Collection tactic, where adversaries record audio out of the user's view. Alert
    (or block via MDM) when an app maintains microphone access during locked/background/in-call states
    yet exposes no foreground recording UI and has not declared a legitimate call-recording capability.
    Treat any third-party use of MediaRecorder.AudioSource.VOICE_CALL — which requires the privileged
    CAPTURE_AUDIO_OUTPUT permission — as a critical finding, because it enables capture of both call uplink
    and downlink. A positive result indicates stealthy capture; benign matches are typically transcription/dictation
    or approved call-recording apps that should be allowlisted.
  answer_sources:
  - MDM microphone access logs
  - MDM application state logs
  - OS API execution logs (android:logcat, iOS:unifiedlog)
  - Runtime permission grant/deny logs (RECORD_AUDIO prompts)
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Managed mobile device fleet (both corporate-owned and BYOD), Mobile Device Management (MDM)
    and Mobile Threat Defense (MTD) servers, Network egress points capturing traffic from mobile device
    subnets (e.g., VPN concentrators, corporate Wi-Fi access points, proxies)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM mdm_mic_access JOIN mdm_app_state ON device_id, session_id

      WHERE mic_session.active = true

      AND app_state IN (''locked'',''background'',''in_call'')

      AND app.foreground_recording_ui = false

      AND app NOT IN allowlist.call_recorders

      | ALERT severity=high

      # escalate to CRITICAL when audio_source = VOICE_CALL or perm = CAPTURE_AUDIO_OUTPUT'
  - technology: MDM/Policy pseudocode
    query: 'IF active_mic_session AND state in {locked,background,in_call}

      AND NOT declared_call_recording THEN block_and_alert(app)'
- question: Does an application's microphone-session duration, activation frequency, or post-activation
    outbound data volume exceed its established 30-day baseline, or is audio being sent to destination
    countries outside its normal pattern?
  context: This statistical baseline question (modeled on Andromaly's Volume/Frequency/State features)
    supports the Collection tactic by detecting abnormal recording and transfer behavior even when the
    destination is not yet known-bad. Build a 30-day per-app baseline of microphone activation frequency
    (sessions/day), session duration, post-activation data volume (Zeek orig_bytes), and typical destination
    countries. Alert when duration or bytes-sent exceed the 95th percentile, or use a robust median/MAD
    Modified Z-Score (flag |M|>3.5) to resist bursty skew when deriving dataset-specific thresholds; also
    alert on destinations outside baseline countries. A positive result suggests unusually long/voluminous
    capture-and-exfiltration; analysts should confirm against app function and recent user activity.
  answer_sources:
  - MDM microphone access logs
  - MDM application state logs
  - OS API execution logs (android:logcat, iOS:unifiedlog)
  - Runtime permission grant/deny logs (RECORD_AUDIO prompts)
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Managed mobile device fleet (both corporate-owned and BYOD), Mobile Device Management (MDM)
    and Mobile Threat Defense (MTD) servers, Network egress points capturing traffic from mobile device
    subnets (e.g., VPN concentrators, corporate Wi-Fi access points, proxies)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_app stats(mic_sessions_per_day, session_duration, post_activation_orig_bytes,\
      \ dest_country) over 30d\nFOR each session:\n  IF duration > p95(baseline.duration) OR orig_bytes\
      \ > p95(baseline.bytes)\n     OR modified_zscore(duration|bytes) > 3.5\n     OR dest_country NOT\
      \ IN baseline.countries\n  THEN ALERT app, device_id, metric, value"
- question: Is an application generating repeated RECORD_AUDIO permission denials or OS-level microphone-access
    failures — especially denials immediately preceding a grant, or recording attempts that fail then
    retry?
  context: Permission-denial and failure state is a distinct probing signal complementary to behavioral
    baselines, relevant to the Collection tactic because adversaries often repeatedly attempt to obtain
    microphone access. Count denied RECORD_AUDIO runtime-permission prompts and OS-level microphone-access
    denials per app over a rolling window. Repeated denials followed by an eventual grant, or recording
    attempts that fail and then retry, indicate probing rather than benign use. A positive result warrants
    reviewing whether the app coerced the user into granting access or is attempting access without consent;
    a clean result lowers the likelihood of forced-permission abuse.
  answer_sources:
  - MDM microphone access logs
  - MDM application state logs
  - OS API execution logs (android:logcat, iOS:unifiedlog)
  - Runtime permission grant/deny logs (RECORD_AUDIO prompts)
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Managed mobile device fleet (both corporate-owned and BYOD), Mobile Device Management (MDM)
    and Mobile Threat Defense (MTD) servers, Network egress points capturing traffic from mobile device
    subnets (e.g., VPN concentrators, corporate Wi-Fi access points, proxies)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM perm_logs WHERE permission = ''RECORD_AUDIO''

      STATS count(deny) as denies, count(grant) as grants BY app, device_id OVER rolling_window

      DETECT pattern: deny...deny -> grant  OR  record_fail -> retry

      | ALERT when denies >= threshold OR deny_then_grant_seen'
- question: Do the ordered event sequences of microphone activation, app backgrounding/locking, network
    connection, destination, and bytes form a rare or improbable pattern compared with learned normal
    behavior?
  context: This machine-learning question models the temporal mic-to-network kill chain for the Collection
    tactic. Train an LSTM/autoencoder over ordered event sequences (mic_on, app_background/locked, net_connect,
    destination_ip, bytes) following DeepLog's next-event and parameter-anomaly design, or score API-family
    transition rarity with Markov models per MaMaDroid. Alert when reconstruction error or sequence improbability
    exceeds a dynamic threshold (e.g., >3 standard deviations) and surface the top-3 contributing features
    (e.g., locked-state recording, anomalous bytes, new destination) in the alert text. A positive result
    flags novel exfiltration behaviors that rule-based logic misses; analysts must triage with the surfaced
    features and corroborating evidence.
  answer_sources:
  - MDM microphone access logs
  - MDM application state logs
  - OS API execution logs (android:logcat, iOS:unifiedlog)
  - Runtime permission grant/deny logs (RECORD_AUDIO prompts)
  - Zeek conn.log
  - Zeek dns.log
