name: 'T1429: Audio Capture'
id: 498b71cb-03f7-48ef-bd5d-493815ed0ad5
description: 'Investigate potential abuse of mobile device audio-capture capabilities (MITRE ATT&CK T1429)
  on managed Android and iOS devices, where an adversary leverages standard OS audio APIs to covertly
  record user conversations, surroundings, phone calls, or other sensitive audio. This playbook helps
  an analyst hunt for two complementary signal sets: (1) runtime behavior in which an application activates
  the microphone (Android MediaRecorder/AudioRecord or the privileged VOICE_CALL audio source; iOS AVAudioRecorder/AVCaptureSession)
  while backgrounded, screen-locked, or during a call, then follows the activation with anomalous or C2-bound
  network egress suggestive of audio exfiltration or streaming; and (2) static indicators in vetted application
  packages (APK/IPA) that reveal microphone-capture capability wired to an exfiltration sink, privileged
  CAPTURE_AUDIO_OUTPUT usage outside an OEM/system allowlist, or high-risk attribute scores. It combines
  symbolic-logic correlation and reference-monitor policy, statistical baselining of microphone usage
  and permission denials, and machine-learning sequence and classification models to surface stealthy,
  context-aware audio-trojan behavior consistent with both sophisticated external actors and commodity
  spyware.'
