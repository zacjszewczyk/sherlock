  - 'NAI: Managed mobile device fleet (both corporate-owned and BYOD), Mobile Device Management (MDM)
    and Mobile Threat Defense (MTD) servers, Network egress points capturing traffic from mobile device
    subnets (e.g., VPN concentrators, corporate Wi-Fi access points, proxies)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = order_events(mic_on, app_state, net_connect, dest_ip, bytes) per app/device

      model = LSTM_autoencoder.train(normal_sequences)   # or Markov(API_families) per MaMaDroid

      score = reconstruction_error(seq)  # or sequence_improbability

      IF score > mean + 3*std THEN ALERT with top3_contributing_features'
- question: Does a vetted application request the privileged android.permission.CAPTURE_AUDIO_OUTPUT (or
    use MediaRecorder.AudioSource.VOICE_CALL) while its signing certificate is not on the OEM/system vendor
    allowlist?
  context: In the application-vetting pipeline this symbolic-logic check supports the Collection tactic
    by catching apps that claim privileged audio-output capture they should not legitimately hold. Alert
    when CAPTURE_AUDIO_OUTPUT or VOICE_CALL audio-source usage appears and the signer certificate CN is
    not on an OEM/system allowlist; escalate to critical. Combine permission + suspicious-API + embedded-URL
    co-occurrence as discriminative static indicators per Drebin. A positive result is high-fidelity because
    third-party apps are not granted CAPTURE_AUDIO_OUTPUT by default — its presence implies privilege
    abuse or repackaging; a negative result still leaves RECORD_AUDIO-based capture (covered elsewhere).
  answer_sources:
  - Mobile application vetting static analysis reports
  - Static taint-analysis (source/sink) reports
  - MDM application inventory logs
  - 'NAI: Mobile Application Management (MAM) repositories, Mobile application vetting and sandboxing
    platforms, MDM/MTD servers storing application inventory data for all managed devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM vetting_reports\nWHERE ('android.permission.CAPTURE_AUDIO_OUTPUT' IN permissions\n  \
      \     OR 'MediaRecorder.AudioSource.VOICE_CALL' IN api_calls)\nAND signer_cert_cn NOT IN oem_system_allowlist\n\
      | ALERT severity=critical\n# boost if suspicious_api AND embedded_url co-occur (Drebin)"
- question: Does static taint analysis of an application reveal a code path that routes microphone/audio
    API output (AudioRecord/MediaRecorder) to a network, file, or SMS exfiltration sink?
  context: This is the static analogue of runtime taint tracking and directly evidences Collection intent
    before deployment. Run lifecycle-aware static taint analysis (FlowDroid) with microphone/audio APIs
    declared as sources and network/file/SMS APIs as sinks; block apps whose code paths route AudioRecord/MediaRecorder
    output to an exfiltration sink — the static analogue of the runtime flow detected by TaintDroid. Validate
    the analyzer against the public DroidBench suite. A positive result is strong evidence of designed
    audio exfiltration; analysts should confirm the flow is reachable and not dead/test code before blocking.
  answer_sources:
  - Mobile application vetting static analysis reports
  - Static taint-analysis (source/sink) reports
  - MDM application inventory logs
  - 'NAI: Mobile Application Management (MAM) repositories, Mobile application vetting and sandboxing
    platforms, MDM/MTD servers storing application inventory data for all managed devices'
  range: Last 90 days
  queries:
  - technology: Static-analysis/pseudocode
    query: 'sources = {AudioRecord.read, MediaRecorder.start, mic_apis}

      sinks   = {network_send, file_write, sms_send}

      flows = FlowDroid.taint(app, sources, sinks)   # lifecycle-aware

      IF any(source -> sink) reachable THEN block_and_alert(app, flow_path)

      # validate detector against DroidBench'
- question: Does an application requesting microphone access score in the high-risk tail when ranked by
    category risk, developer reputation, permission entropy, market presence, and frequency of sensitive
    audio API calls?
  context: This statistical attribute-scoring question (DroidAPIMiner-style) prioritizes vetting effort
    for the Collection tactic by ranking microphone-requesting apps. Compute a weighted risk score using
    category risk, developer reputation, permission entropy, market presence, and the frequency of sensitive
    audio API calls (MediaRecorder.start, AudioRecord.read). Flag apps above the 95th percentile (or robust
    |M|>3.5 via Modified Z-Score) for manual review. A high score does not prove malice but concentrates
    analyst attention on the riskiest microphone-capable apps; legitimate-but-unusual apps (e.g., niche
    recorders) may surface and can be allowlisted.
  answer_sources:
  - Mobile application vetting static analysis reports
  - Static taint-analysis (source/sink) reports
  - MDM application inventory logs
  - 'NAI: Mobile Application Management (MAM) repositories, Mobile application vetting and sandboxing
    platforms, MDM/MTD servers storing application inventory data for all managed devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "score = w1*category_risk + w2*(1-developer_reputation) + w3*permission_entropy\n        +\
      \ w4*(1-market_presence) + w5*freq(sensitive_audio_apis)\nFOR apps requesting mic access:\n  IF\
      \ score > p95(all_app_scores) OR modified_zscore(score) > 3.5\n  THEN flag_for_manual_review(app,\
      \ score)"
- question: Does a supervised classifier trained on static features (permissions, suspicious API calls,
    API-family Markov transitions, obfuscation indicators, embedded URLs/IPs) label an application as
    a malicious audio-capture app with high confidence?
  context: This ML question generalizes detection of audio-capture malware for the Collection tactic beyond
    hand-written rules. Train a supervised classifier on labeled APK/IPA samples using permissions, suspicious
    API calls (e.g., MediaRecorder.setAudioOutput), API-family Markov transitions (MaMaDroid), obfuscation
    indicators, and embedded URL/IP strings, following the feature/model guidance and concept-drift caveats
    in the DL survey. Prefer an explainable model (Drebin) so alerts surface the top-3 contributing features;
    block and alert on classifications with confidence >0.9. A high-confidence positive should be triaged
    with the surfaced features; monitor for concept drift so the model stays current against evolving
    samples.
  answer_sources:
  - Mobile application vetting static analysis reports
  - Static taint-analysis (source/sink) reports
  - MDM application inventory logs
  - 'NAI: Mobile Application Management (MAM) repositories, Mobile application vetting and sandboxing
    platforms, MDM/MTD servers storing application inventory data for all managed devices'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [permissions, suspicious_api_calls, api_family_markov, obfuscation, embedded_urls_ips]

      model = supervised_classifier.train(labeled_apk_ipa)  # explainable (Drebin-style)

      pred = model.predict(app)

      IF pred.label == ''malicious_audio_capture'' AND pred.confidence > 0.9

      THEN block_and_alert(app, top3_features)

      # watch for concept drift per DL survey'
