questions:
- question: Did any managed mobile device execute a destructive command or API - `pm uninstall`, `pm uninstall
    --user 0`, `rm`/`rm -rf`, `recovery --wipe_data`, or DevicePolicyManager.wipeData() - particularly
    when the parent process is a shell spawned by a non-interactive application or by a process that has
    just acquired root through a commercial rooting tool?
  context: 'This is the deterministic floor for detecting T1662 data destruction under the Impact tactic.
    Adversaries achieve destruction on Android with native Linux tools and package-manager calls: the
    Rootnik chain escalates to root and then issues native `pm`/`rm` package and file operations, while
    mobile ransomware (HelDroid) overwrites/encrypts then locks the device. The analyst is looking for
    exact or regex matches on these command strings and API calls in command/API execution logs, with
    special weight when the parent is a non-interactive app shell or a freshly-rooted process - legitimate
    users rarely mass-uninstall packages or recursively delete files from an app-spawned shell. A positive
    match is high-confidence evidence of in-progress or completed destruction and should trigger immediate
    containment; a negative result does not clear the device because destruction may use other primitives,
    so corroborate with the statistical and network trails. References: [Rootnik Android Trojan, Unit
    42](https://unit42.paloaltonetworks.com/rootnik-android-trojan-abuses-commercial-rooting-tool/); [HelDroid](https://link.springer.com/chapter/10.1007/978-3-319-26362-5_18).'
  answer_sources:
  - MDM/EDR agent logs detailing command-line arguments
  - Android Logcat process execution events
  - SELinux/audit (avc) denial events
  - iOS Endpoint Security Framework process events
  - 'NAI: Managed mobile devices (corporate-owned or BYOD), Mobile Device Management (MDM) servers, and
    SIEM systems where logs are aggregated.'
  range: Last 90 days
  queries:
  - technology: MDM/EDR/Rule pseudocode
    query: "FROM command_execution, os_api_calls\nWHERE cmd MATCHES 'pm uninstall( --user 0)?|rm( -[rf]+)?|recovery\
      \ --wipe_data'\n   OR api == 'DevicePolicyManager.wipeData'\n  AND (parent_process == 'non_interactive_app_shell'\n\
      \       OR root_acquired_within == '5m')\nEMIT severity=high WITH device_id, package, cmd, parent_process,\
      \ root_status"
- question: Was any non-system app granted device-administrator authority and then, within roughly 10
    minutes, issue a wipe or mass-delete primitive (DevicePolicyManager.wipeData(), bulk content deletes,
    or a recovery wipe), and did the device's app inventory drop sharply around that time?
  context: 'Legitimate apps almost never chain a device-admin grant directly into destruction, so this
    escalate-then-wipe sequence is a strong Impact signal. The analyst correlates two events from MDM/MTD
    telemetry: a device-administrator authority grant to a non-system package, followed closely by invocation
    of a wipe/mass-delete primitive and/or a sudden drop in installed-app inventory. Per NIST SP 800-124r2,
    device-admin grants and inventory changes are observable management-layer telemetry. The 10-minute
    window is a starting heuristic and must be tuned per fleet to balance detection against benign provisioning
    flows. A positive correlation indicates a malicious app weaponized device-admin to wipe data; a negative
    result means no tight grant-to-destruction chain was seen, though slower-moving attacks may still
    warrant baseline review. References: [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf).'
  answer_sources:
  - MDM/EDR agent logs detailing command-line arguments
  - Android Logcat process execution events
  - SELinux/audit (avc) denial events
  - iOS Endpoint Security Framework process events
  - 'NAI: Managed mobile devices (corporate-owned or BYOD), Mobile Device Management (MDM) servers, and
    SIEM systems where logs are aggregated.'
  range: Last 90 days
  queries:
  - technology: MDM/MTD/Rule pseudocode
    query: "FROM mdm_events\nLET grant = device_admin_granted(package) WHERE package NOT IN system_packages\n\
      JOIN destructive = (wipeData OR mass_delete OR recovery_wipe) BY device_id\nWHERE destructive.time\
      \ - grant.time <= 10m   # tune per fleet\n  OR app_inventory_drop(device_id) WITHIN 10m OF grant\n\
      EMIT severity=high WITH device_id, package, grant.time, destructive.primitive"
- question: For any managed device, did the per-hour count of `pm uninstall`/`rm` commands, the volume
    of files and bytes deleted, or the deletion frequency (deletes/min) exceed that device's 99th percentile
    or its peer-group baseline?
  context: 'Destructive activity has a characteristic physics: read-then-overwrite/delete bursts and elevated
    file-touch rates (UNVEIL, ShieldFS, Andromaly). For each device, baseline over 30 days the per-hour
    count of `pm uninstall`/`rm` commands plus the Volume (files and bytes deleted) and Frequency (deletes/min),
    then alert when any hour exceeds the device''s own 99th percentile or a peer-group baseline. This
    catches mass destruction that individual-command rules might miss when each command is individually
    unremarkable. Thresholds must be derived from each fleet''s own command history rather than absolute
    numbers, since deletion volume varies by device role. A spike above baseline supports an Impact data-destruction
    hypothesis and should be enriched with the parent process and root status; normal hourly counts argue
    against bulk destruction during the window. References: [UNVEIL](https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_kharraz.pdf);
    [ShieldFS](https://conand.me/publications/continella-shieldfs-2016.pdf); [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x).'
  answer_sources:
  - MDM/EDR agent logs detailing command-line arguments
  - Android Logcat process execution events
  - SELinux/audit (avc) denial events
  - iOS Endpoint Security Framework process events
  - 'NAI: Managed mobile devices (corporate-owned or BYOD), Mobile Device Management (MDM) servers, and
    SIEM systems where logs are aggregated.'
  range: Last 90 days; baseline window 30 days, evaluate over rolling 1h
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each device_id:\n  baseline = profile(command_execution, lookback=30d:\n    uninstall_rm_per_hour,\
      \ files_deleted, bytes_deleted, deletes_per_min)\n  ALERT IF count(pm uninstall|rm)/hour > p99(baseline)\n\
      \       OR files_deleted/hour > p99(baseline)\n       OR deletes_per_min > peer_group_baseline\n\
      EMIT WITH device_id, metric, observed, threshold"
- question: Did any device show a surge of FAILED destruction attempts - permission-denied/EACCES or 'Operation
    not permitted' on `rm`/`pm uninstall`, SELinux avc denials on unlink/delete, or failed device-admin
    grants - above its normal per-hour denial baseline?
  context: 'Blocked-but-attempted destruction is a distinct and valuable signal: an adversary trying to
    wipe data while lacking sufficient privilege generates a burst of permission-denied results and SELinux
    avc denials before (or instead of) any successful delete. The analyst separately counts EACCES/''Operation
    not permitted'' failures on `rm`/`pm uninstall`, avc denials on unlink/delete operations, and failed
    device-admin grants per device per hour. Abnormal failure-key sequences are visible in audit logs
    (DeepLog), and management telemetry exposes failed grants (NIST SP 800-124r2). Because this captures
    a T1662 attempt rather than a completed wipe, it is alert-worthy independently of successful-delete
    rules - it may be the only on-host evidence when destruction is thwarted. Baseline normal denial rates
    first so routine SELinux noise does not drown the signal. References: [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf);
    [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf).'
  answer_sources:
  - MDM/EDR agent logs detailing command-line arguments
  - Android Logcat process execution events
  - SELinux/audit (avc) denial events
  - iOS Endpoint Security Framework process events
  - 'NAI: Managed mobile devices (corporate-owned or BYOD), Mobile Device Management (MDM) servers, and
    SIEM systems where logs are aggregated.'
  range: Last 90 days; baseline normal per-hour denial rates
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each device_id:\n  fail_baseline = profile(lookback=30d:\n    eacces_on(rm|pm uninstall),\
      \ avc_denials(unlink|delete), failed_device_admin_grants)\n  ALERT IF count(EACCES|'Operation not\
      \ permitted')/hour > p99(fail_baseline)\n       OR count(selinux_avc unlink|delete)/hour > p99(fail_baseline)\n\
      \       OR failed_device_admin_grants/hour > p99(fail_baseline)\nEMIT WITH device_id, failure_type,\
      \ observed   # blocked-but-attempted = T1662 attempt"
- question: Does an unsupervised model trained on benign command-execution telemetry flag any device's
    recent destructive-command behavior as anomalous, and which top-3 features (e.g., deletes/min, bytes-deleted,
    parent=non-interactive-shell) drive that score?
  context: 'Some destructive bursts evade single-dimension thresholds but emerge as outliers in a multi-feature
    model. Train a one-class SVM or Isolation Forest on known-good command-execution telemetry only, using
    features modeled on ransomware/data-destruction research (ShieldFS, UNVEIL, Andromaly, IoT one-class
    classification): deletion-command frequency (`rm`, `pm uninstall`), files/bytes deleted per window,
    write-entropy of overwritten files, file-touch rate, parent-process type, root-status, and time-of-day.
    Training on benign-only data lets the model flag never-before-seen destructive patterns without labeled
    malware. For explainability and analyst trust, every alert must surface the top-3 contributing features
    in the alert text. This supplements - never replaces - the deterministic command rules; retrain periodically
    to track fleet behavior drift. A high anomaly score corroborates an Impact data-destruction event.
    References: [ShieldFS](https://conand.me/publications/continella-shieldfs-2016.pdf); [UNVEIL](https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_kharraz.pdf);
    [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x); [Malware Detection for IoT
    via One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/).'
  answer_sources:
  - MDM/EDR agent logs detailing command-line arguments
  - Android Logcat process execution events
  - SELinux/audit (avc) denial events
  - iOS Endpoint Security Framework process events
  - 'NAI: Managed mobile devices (corporate-owned or BYOD), Mobile Device Management (MDM) servers, and
    SIEM systems where logs are aggregated.'
  range: Last 90 days; train on benign-only telemetry
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = extract(command_execution:\n  rm_freq, pm_uninstall_freq, files_deleted, bytes_deleted,\n\
      \  write_entropy, file_touch_rate, parent_process_type, root_status, time_of_day)\nmodel = OneClassSVM\
      \ | IsolationForest.fit(benign_only_telemetry)\nWHEN model.anomaly(features):\n  EMIT alert WITH\
      \ device_id, top3_features(features)\n# supplements, does not replace, deterministic command rules;\
      \ retrain periodically"
- question: Does a DeepLog-style sequence model over logcat/SELinux/framework log keys flag an improbable
    ordering of package-removal and file-unlink events on any device, with the deviating log key surfaced
    for explainability?
  context: 'A destruction chain manifests as an abnormal ordering of log events - for example, package-removal
    interleaved with bulk file-unlink and wipe events in a sequence that never appears in normal operation.
    Train a DeepLog-style LSTM on normal logcat/SELinux/framework log-key sequences and flag any next-key
    that falls outside the top-g predicted keys, surfacing the specific deviating key so an analyst can
    see why the sequence is improbable. This catches destruction whose individual commands look benign
    but whose ordering is anomalous. It must be combined with the deterministic command rules as a complement,
    not a substitute, because sequence models drift and can be evaded. An improbable destruction sequence
    strengthens the Impact hypothesis and points the analyst directly at the offending event. References:
    [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - MDM/EDR agent logs detailing command-line arguments
  - Android Logcat process execution events
  - SELinux/audit (avc) denial events
  - iOS Endpoint Security Framework process events
  - 'NAI: Managed mobile devices (corporate-owned or BYOD), Mobile Device Management (MDM) servers, and
    SIEM systems where logs are aggregated.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = DeepLog_LSTM.fit(normal_logkey_sequences(logcat, selinux, framework), lookback=90d)\n\
      FOR each device log stream:\n  next_key = observed\n  IF next_key NOT IN model.topg_predicted(history):\n\
      \    EMIT alert WITH device_id, deviating_log_key, sequence_context\n# combine with deterministic\
      \ rules; do not replace them"
- question: When a host-based T1662 alert fires, do Zeek conn.log/dns.log show any connection from the
    affected device within a 5-minute window whose destination matches a known-C2 threat-intel feed?
  context: 'Destruction is often the payload of a C2-driven intrusion, so tying an on-host destruction
    alert to attacker infrastructure raises confidence and aids attribution. On any host-based T1662 alert,
    automatically query Zeek conn.log/dns.log for connections from the affected device within a 5-minute
    window and alert if the destination matches a known-C2 threat-intel indicator. Flow-only Volume/Frequency/State
    features reliably characterize malicious mobile sessions for this correlation (CorrNetDroid), and
    per-app VPN/SWG telemetry provides the egress vantage point in managed fleets (NIST SP 800-124r2).
    A match links the destruction to known adversary infrastructure under the Impact tactic and should
    escalate severity; no match does not exonerate the device, since C2 may be unknown or the device may
    already be offline. References: [CorrNetDroid](https://arxiv.org/abs/2503.01396); [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Firewall/secure-web-gateway egress logs
  - 'NAI: Network egress points monitoring mobile device traffic (e.g., corporate Wi-Fi, VPN gateway,
    per-app VPN/SWG), DNS resolvers, and network sensor grids.'
  range: Last 90 days; correlate within 5 minutes of host alert
  queries:
  - technology: Zeek/Rule pseudocode
    query: "ON host_alert(T1662, device_id):\n  FROM conn.log, dns.log\n  WHERE id.orig_h == device_ip(device_id)\n\
      \    AND ts BETWEEN host_alert.ts AND host_alert.ts + 5m\n    AND (id.resp_h IN threatintel.c2 OR\
      \ query IN threatintel.c2_domains)\n  EMIT severity=high WITH device_id, id.resp_h, query, intel_source"
- question: For any device, did the moving average of DNS query Shannon entropy over 1-hour windows exceed
    3 standard deviations above its 30-day baseline near the time of a destruction event, suggesting DGA/C2
    activity?
  context: 'Malware that orchestrates destruction frequently relies on algorithmically-generated domains
    for C2, which inflates the entropy of a device''s DNS queries before or after the attack. Per device,
    compute a moving average of DNS query Shannon entropy over 1-hour windows from Zeek dns.log and alert
    when entropy exceeds 3 standard deviations above the device''s 30-day baseline. Thresholds should
    be validated against labeled benign/malicious mobile traffic (CICAndMal2017, Andromaly). A spike near
    a destruction event suggests DGA-based C2 coordinating the Impact action and warrants pivoting to
    the resolved domains and downstream connections; normal entropy reduces, but does not eliminate, the
    likelihood of network-coordinated destruction. References: [CICAndMal2017](https://www.unb.ca/cic/datasets/andmal2017.html);
    [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Firewall/secure-web-gateway egress logs
  - 'NAI: Network egress points monitoring mobile device traffic (e.g., corporate Wi-Fi, VPN gateway,
    per-app VPN/SWG), DNS resolvers, and network sensor grids.'
  range: Last 90 days; baseline window 30 days, 1h windows
  queries:
  - technology: Zeek/Stats pseudocode
    query: "FOR each device_ip:\n  baseline = profile(dns.log, lookback=30d: shannon_entropy per 1h window)\n\
      \  ma = moving_avg(shannon_entropy(dns.query), window=1h)\n  ALERT IF ma > mean(baseline) + 3*stddev(baseline)\n\
      EMIT WITH device_ip, observed_entropy, baseline_mean   # possible DGA/C2"
- question: Within minutes of a host destruction alert, did a device show a sudden burst of NXDOMAIN responses,
    firewall-blocked egress, or TCP RST/timeout failures, or conversely a drop to zero of ALL traffic
    (heartbeat loss) - both consistent with a wiped/offline device or severed C2?
  context: 'The network aftermath of destruction takes two telltale forms: a flurry of failed/blocked
    connections (malware thrashing as components are removed or C2 is severed) or the complete cessation
    of traffic when the device is wiped and taken offline. Baseline per device the rate of NXDOMAIN responses,
    firewall-blocked egress, and TCP RST/timeout connection failures, then alert on a sudden burst of
    failures OR a drop to zero of all traffic within minutes of a host destruction alert (CICAndMal2017,
    CorrNetDroid). Per-device failure baselines are essential so that a normally-chatty device''s silence
    is recognized as anomalous. Either pattern corroborates an Impact data-destruction event and helps
    the analyst confirm whether the device is still reachable for response. References: [CICAndMal2017](https://www.unb.ca/cic/datasets/andmal2017.html);
    [CorrNetDroid](https://arxiv.org/abs/2503.01396).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Firewall/secure-web-gateway egress logs
  - 'NAI: Network egress points monitoring mobile device traffic (e.g., corporate Wi-Fi, VPN gateway,
    per-app VPN/SWG), DNS resolvers, and network sensor grids.'
  range: Last 90 days; baseline window 30 days, correlate within minutes of host alert
  queries:
  - technology: Zeek/Stats pseudocode
    query: "FOR each device_ip:\n  baseline = profile(lookback=30d:\n    nxdomain_rate, fw_blocked_rate,\
      \ tcp_rst_timeout_rate, total_traffic)\n  ON host_alert(T1662) WITHIN minutes:\n    ALERT IF burst(nxdomain|fw_blocked|rst_timeout)\
      \ > p99(baseline)\n         OR total_traffic -> 0 (heartbeat loss vs baseline)\nEMIT WITH device_ip,\
      \ pattern, observed"
- question: Does a per-device time-series model of bytes sent/received per 5-minute interval show traffic
    dropping to near-zero and staying there versus forecast - especially right after a host destruction
    alert - indicating the device was wiped and taken offline?
  context: 'A wiped device goes dark, and that silence is itself evidence under the Impact tactic. Fit
    a per-device time-series model (ARIMA/Prophet or a one-class autoencoder) on bytes sent/received per
    5-minute interval from Zeek conn.log and alert when actual traffic drops to near-zero and remains
    there versus the forecast, particularly following a host destruction alert (CorrNetDroid, IoT one-class
    classification). Forecasting separates expected idle periods (overnight, weekends) from anomalous
    prolonged silence. For explainability, surface the top-3 contributing features - e.g., observed-bytes
    vs forecast, duration-of-silence, and preceding-host-alert - in the alert. Sustained heartbeat loss
    after a destruction signal strongly suggests a successful wipe; the analyst should confirm via MDM
    last-check-in and attempt remote location/lock before the device is fully unrecoverable. References:
    [CorrNetDroid](https://arxiv.org/abs/2503.01396); [Malware Detection for IoT via One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Firewall/secure-web-gateway egress logs
  - 'NAI: Network egress points monitoring mobile device traffic (e.g., corporate Wi-Fi, VPN gateway,
    per-app VPN/SWG), DNS resolvers, and network sensor grids.'
  range: Last 90 days; 5-minute intervals, correlate with host alert
  queries:
  - technology: Zeek/ML pseudocode
    query: "FOR each device_ip:\n  model = ARIMA|Prophet|Autoencoder.fit(conn.log bytes_per_5min, lookback=90d)\n\
      \  forecast = model.predict()\n  WHEN observed_bytes ~= 0 AND stays_low VS forecast\n       (especially\
      \ after host_alert(T1662)):\n    EMIT alert WITH device_ip, top3_features(observed_vs_forecast,\n\
      \                     duration_of_silence, preceding_host_alert)"
- question: During static/dynamic app vetting, does any non-system app declare or use BIND_DEVICE_ADMIN
    with wipeData(), DELETE_PACKAGES, or bulk content-provider/MediaStore delete APIs that are inconsistent
    with the app's stated category and function?
  context: 'Capability is a leading indicator: an app cannot wipe the fleet''s data unless it first holds
    the destructive primitives, so vetting is the earliest place to deny T1662. Deterministically flag
    and (per policy) block any non-system app that declares/uses BIND_DEVICE_ADMIN with wipeData(), DELETE_PACKAGES,
    or bulk content-provider/MediaStore delete APIs inconsistent with its category. The encryption/overwrite
    + device-admin-lock combination is the canonical destructive signature in mobile ransomware (HelDroid,
    NIST SP 800-124r2). A flashlight or wallpaper app requesting device-admin wipe authority is a glaring
    mismatch. A positive finding lets defenders block the app before installation and supports proactive
    Impact prevention; a clean verdict means the static/dynamic surface showed no destructive capability,
    though runtime behavior should still be monitored. References: [HelDroid](https://link.springer.com/chapter/10.1007/978-3-319-26362-5_18);
    [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf).'
  answer_sources:
  - Application Vetting API call analysis
  - Application Vetting permission analysis
  - Permissions Request (user interface) events
  - MDM/EMM app inventory and configuration
  - 'NAI: Application vetting pipeline and MDM/EMM servers managing the mobile fleet.'
  range: Last 90 days; re-run on each app install/update
  queries:
  - technology: App-vetting/Rule pseudocode
    query: "FROM app_vetting(static+dynamic)\nWHERE package NOT IN system_packages\n  AND (declares/uses(BIND_DEVICE_ADMIN\
      \ AND wipeData)\n       OR uses(DELETE_PACKAGES)\n       OR uses(bulk_content_provider_delete |\
      \ MediaStore_bulk_delete))\n  AND capability INCONSISTENT_WITH app.category\nEMIT verdict=flag/block\
      \ WITH package, capability, category"
- question: Across the installed app fleet, which apps request high-privilege deletion permissions (device-admin
    wipe, DELETE_PACKAGES, MANAGE_EXTERNAL_STORAGE) that are held by fewer than 1% of installed apps?
  context: 'Rarity is a compact, defensible prior for malware: high-privilege deletion permissions are
    legitimately needed by very few apps, so an app requesting capabilities held by under 1% of the fleet
    stands out (SigPID). Compute per-permission prevalence across all installed apps and flag those requesting
    rare high-privilege deletion permissions. The 1% cutoff should be tuned to fleet size so the list
    stays actionable. This complements deterministic vetting by surfacing apps whose individual permissions
    are allowed but collectively unusual for the environment. A rare-permission app warrants deeper review
    for Impact data-destruction potential; broadly-held permissions are less suspicious but still subject
    to capability vetting. References: [Identification of Significant Permissions, SigPID](https://arxiv.org/abs/2103.00643).'
  answer_sources:
  - Application Vetting API call analysis
  - Application Vetting permission analysis
  - Permissions Request (user interface) events
  - MDM/EMM app inventory and configuration
  - 'NAI: Application vetting pipeline and MDM/EMM servers managing the mobile fleet.'
  range: Last 90 days; re-run on each app install/update
  queries:
  - technology: SIEM/Stats pseudocode
    query: "prevalence = count(apps requesting permission) / total_apps\nFOR each app:\n  FOR perm IN\
      \ (DEVICE_ADMIN_wipe, DELETE_PACKAGES, MANAGE_EXTERNAL_STORAGE):\n    IF app.requests(perm) AND\
      \ prevalence(perm) < 0.01:   # tune to fleet size\n      EMIT alert WITH package, perm, prevalence"
- question: Does a supervised classifier over the significant Android permissions plus destructive-API
    usage score any installed/vetted app as likely destructive, and which top-3 permissions/APIs (e.g.,
    DEVICE_ADMIN wipeData, DELETE_PACKAGES, MANAGE_EXTERNAL_STORAGE) drive the verdict?
  context: 'Combinations of permissions and APIs that look individually benign can jointly indicate destructive
    intent, which a supervised model captures better than single rules. Train a Random Forest/SVM classifier
    on the ~22 significant Android permissions (SigPID) plus destructive-API usage to score apps at vetting,
    and surface the top-3 contributing permissions/APIs - for example DEVICE_ADMIN wipeData, DELETE_PACKAGES,
    MANAGE_EXTERNAL_STORAGE - in the verdict for analyst explainability (HelDroid). Keep deterministic
    capability flags running in parallel as the floor and retrain as new apps and destructive patterns
    appear. A high malicious score on an app holding destructive capabilities is strong grounds to block
    or remove it, denying the Impact data-destruction objective before it executes. References: [Identification
    of Significant Permissions, SigPID](https://arxiv.org/abs/2103.00643); [HelDroid](https://link.springer.com/chapter/10.1007/978-3-319-26362-5_18).'
  answer_sources:
