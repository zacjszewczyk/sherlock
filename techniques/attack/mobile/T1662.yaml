name: 'T1662: Data Destruction'
id: 48b3f725-233a-48cf-8992-a8d2d8b645e5
description: 'Investigate whether an adversary is destroying data and files on managed mobile (Android)
  devices to interrupt availability of systems, services, and network resources, often as the final, destructive
  stage of an intrusion or mobile-ransomware campaign. Data destruction on Android is typically achieved
  with native Linux tools (`rm`/`rm -rf`), package removal (`pm uninstall`, `pm uninstall --user 0`),
  recovery-mode wipes (`recovery --wipe_data`), or the DevicePolicyManager.wipeData() device-administrator
  primitive, frequently after a non-system app obtains root via a commercial rooting tool. This playbook
  helps an analyst pursue three overlapping evidence trails: (1) on-device command/API execution telemetry
  showing high-volume deletion or uninstall bursts, privilege-escalation-then-wipe chains, surges of FAILED
  (permission-denied/SELinux-avc) destruction attempts, and anomalous destructive log-key sequences; (2)
  network egress behavior around a destruction event - correlation with known-C2 infrastructure, DNS entropy
  spikes, bursts of blocked/failed connections, and the sudden cessation of all traffic (heartbeat loss)
  that indicates a wiped/offline device; and (3) application-vetting and MDM/EMM signals showing non-system
  apps that request or obtain mass-destruction capabilities (BIND_DEVICE_ADMIN + wipeData(), DELETE_PACKAGES,
  MANAGE_EXTERNAL_STORAGE, bulk MediaStore/content-provider deletes) inconsistent with their stated function.
  Each trail provides deterministic symbolic-logic rules, statistical baselines, and machine-learning
  approaches so an analyst can confirm whether data destruction was attempted or carried out, and scope
  its blast radius across the fleet.'
type: technique
related:
- tactic_id: TA0034
  tactic_name: Impact
contributors:
- Zachary Szewczyk
