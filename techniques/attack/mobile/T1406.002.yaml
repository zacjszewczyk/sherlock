questions:
- question: Are packed APK or IPA application packages being downloaded onto our mobile fleet from infrastructure
    that matches high-confidence malware-distribution or command-and-control threat intelligence?
  context: Supports the Defense Evasion goal of catching packed payloads at the point of delivery. Adversaries
    who pack mobile apps to defeat signature detection still have to deliver the file over the network,
    so the source of the download is itself a strong signal. Watch Zeek http.log and files.log for APK/IPA
    transfers (for example MIME type application/vnd.android.package-archive or iOS .ipa content types),
    then enrich the source IP and domain from conn.log and dns.log and alert when that source matches
    known malware-distribution or C2 intelligence. A positive result links a concrete file (with hash),
    a delivery source, and a target device, giving the analyst an immediate pivot for containment; a negative
    result simply means the transfer came from a non-flagged source and should be evaluated by the entropy
    and signature checks below.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - MDM application inventory
  - 'NAI: Network Security Monitoring (NSM) sensor locations monitoring traffic to/from corporate Wi-Fi
    and VPNs; Mobile Device Management (MDM) / Enterprise Mobility Management (EMM) platform application
    inventories; Developer workstations and CI/CD build servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'downloads = files.log JOIN http.log where mime_type in [''application/vnd.android.package-archive'',''application/octet-stream'']
      or uri matches ''.(apk|ipa)$'';

      enrich src_ip,domain from conn.log,dns.log;

      alert when src_ip in ti_malware_c2 or domain in ti_malware_c2;

      output file_hash, src_ip, domain, dst_device, uri.'
- question: Does any newly observed APK or IPA package, or any of its embedded classes.dex, Mach-O, or
    native .so components, have a byte-level Shannon entropy at or above the fixed packing threshold of
    7.5?
  context: 'Directly answers whether an app is packed or encrypted to evade signature detection. Packed
    or encrypted content has near-random byte distributions and entropy around 7.0-7.2 or higher, while
    normal native code sits around 5.0-6.5. Compute whole-file and per-embedded-segment Shannon entropy
    for each new package seen in Zeek files.log or device install logs and deterministically alert at
    >= 7.5. This is a high-precision, low-cost floor: a positive result strongly implies compression/encryption
    consistent with packing and should be attached to the file hash, source, and target device for triage;
    a low score does not rule out lightweight obfuscation, so combine with the baseline and structural
    methods.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - MDM application inventory
  - 'NAI: Network Security Monitoring (NSM) sensor locations monitoring traffic to/from corporate Wi-Fi
    and VPNs; Mobile Device Management (MDM) / Enterprise Mobility Management (EMM) platform application
    inventories; Developer workstations and CI/CD build servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for pkg in new_packages(files.log, install_logs):\n  e_whole = shannon_entropy(pkg.bytes);\n\
      \  e_segs = [shannon_entropy(s.bytes) for s in pkg.embedded(['classes.dex','Mach-O','*.so'])];\n\
      \  if e_whole >= 7.5 or max(e_segs) >= 7.5:\n    alert(file_hash=pkg.hash, source=pkg.src, device=pkg.dst,\
      \ entropy=max(e_whole,*e_segs))."
- question: Does a newly observed package's entropy exceed the 95th percentile of the entropy distribution
    of approved fleet applications, especially if it was installed outside an approved change window?
  context: Adds a fleet-relative statistical view to the fixed threshold so that genuinely unusual packaging
    stands out even when the global cut-off is borderline. Build an entropy baseline from the MDM application
    inventory of approved packages, then compute Shannon entropy for each new APK/IPA from Zeek files.log
    or device install logs and alert when the score exceeds the approved 95th percentile or the hard 7.5
    threshold. Packing is comparatively rare among benign fleet apps, so an outlier here is a high-precision
    signal. Prioritize packages installed outside change windows, since legitimate app updates normally
    arrive through managed deployment; an off-window high-entropy install is a strong Defense Evasion
    indicator.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - MDM application inventory
  - 'NAI: Network Security Monitoring (NSM) sensor locations monitoring traffic to/from corporate Wi-Fi
    and VPNs; Mobile Device Management (MDM) / Enterprise Mobility Management (EMM) platform application
    inventories; Developer workstations and CI/CD build servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = entropy_distribution(MDM_approved_apps);\np95 = percentile(baseline, 95);\nfor\
      \ pkg in new_packages(files.log, install_logs):\n  e = shannon_entropy(pkg.bytes);\n  if e > p95\
      \ or e >= 7.5:\n    score = (e > p95 and outside_change_window(pkg)) ? 'high' : 'review';\n    alert(pkg.hash,\
      \ e, p95, pkg.install_context, score)."
- question: Do a package's per-section entropy values and structural fields (raw vs. virtual size, import
    and symbol counts, high-entropy section count) deviate from the approved-app baseline by more than
    three standard deviations?
  context: Refines blunt global-entropy checks with the structural model used to discriminate packed from
    unpacked binaries. Instead of a single global cut-off, extract per-section/segment entropy and structural
    fields (raw vs. virtual size, import/symbol counts) from each package and score deviations against
    the approved-app baseline. Flag when the count of high-entropy sections or structural anomalies exceeds
    mean + 3 standard deviations. This catches packers that compress only part of a file (so whole-file
    entropy looks normal) and exposes telltale packer artifacts like mismatched raw/virtual sizes and
    stripped imports. A positive result indicates structural packing characteristics consistent with Defense
    Evasion even when the overall file entropy is unremarkable.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - MDM application inventory
  - 'NAI: Network Security Monitoring (NSM) sensor locations monitoring traffic to/from corporate Wi-Fi
    and VPNs; Mobile Device Management (MDM) / Enterprise Mobility Management (EMM) platform application
    inventories; Developer workstations and CI/CD build servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = structural_baseline(MDM_approved_apps); # per-section entropy, raw/virtual size, import/symbol\
      \ counts\nfor pkg in new_packages():\n  feats = extract_structural(pkg);\n  hi_sections = count(s\
      \ for s in pkg.sections if entropy(s) >= 7.2);\n  anomalies = count(f for f in feats if f > base[f].mean\
      \ + 3*base[f].std);\n  if hi_sections > base.hi_sections.mean+3*base.hi_sections.std or anomalies\
      \ > 0:\n    alert(pkg.hash, hi_sections, anomalies, feats)."
- question: When each package is vectorized across whole-file and section entropy, file size, permission
    count, manifest-anomaly count, native-library presence, and install context, does an unsupervised
    outlier model flag it as a fleet anomaly?
  context: Detects packed or obfuscated apps without any labeled malware by treating the fleet as the
    baseline. Vectorize each package (whole-file and section entropy, file size, permission count, manifest
    anomaly count, native-lib presence, install context) and score it with an Extended Isolation Forest
    to surface multivariate outliers. Packed apps tend to be jointly unusual across several features even
    when no single feature is extreme, which is exactly what isolation-based scoring captures. Surface
    the top-3 contributing features (SHAP-style attribution) in the alert so the analyst can see whether
    entropy, permissions, or install context drove the anomaly, supporting fast triage of likely Defense
    Evasion behavior.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - MDM application inventory
  - 'NAI: Network Security Monitoring (NSM) sensor locations monitoring traffic to/from corporate Wi-Fi
    and VPNs; Mobile Device Management (MDM) / Enterprise Mobility Management (EMM) platform application
    inventories; Developer workstations and CI/CD build servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "X = vectorize(packages, [whole_entropy,section_entropy,file_size,perm_count,manifest_anomalies,native_lib,install_context]);\n\
      model = ExtendedIsolationForest().fit(fleet_baseline);\nfor pkg in new_packages():\n  s = model.anomaly_score(vector(pkg));\n\
      \  if s > outlier_threshold:\n    alert(pkg.hash, s, top3_shap(model, vector(pkg)))."
- question: Are there spikes in failed or blocked installs, signature-verification failures, or runtime
    decode and exec errors (SELinux denials, dlopen failures) that correlate to a specific package?
  context: Uses error telemetry as an independent signal of packing, since packed payloads frequently
    fail at install time or during the decrypt-and-load step. Baseline normal failure rates and alert
    on spikes in MDM/PackageManager/MobileInstallation failed or blocked installs, signature-verification
    failures, and runtime decode/exec errors (SELinux denials, dlopen failures) tied to a package. A packer
    that unpacks code in memory and reloads it often trips code-signing, execmem, or loader protections,
    leaving error trails even when the file itself evades static checks. A correlated spike is a behavioral
    indicator of in-memory unpacking consistent with Defense Evasion; a clean error profile argues for
    benign packaging.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - MDM application inventory
  - 'NAI: Network Security Monitoring (NSM) sensor locations monitoring traffic to/from corporate Wi-Fi
    and VPNs; Mobile Device Management (MDM) / Enterprise Mobility Management (EMM) platform application
    inventories; Developer workstations and CI/CD build servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'errs = events where type in [''install_failed'',''install_blocked'',''sig_verify_fail'',''selinux_denial'',''dlopen_fail''];

      rate = count(errs) by package, hour;

      baseline = historical_rate(package);

      alert when rate > baseline.mean + 3*baseline.std;

      output package, error_types, rate, correlated_device.'
- question: Does a supervised classifier trained on benign vs. packed packages, using packing-resilient
    static and network features, score a package above the calibrated confidence threshold for being packed?
  context: Provides a learned decision boundary for packing that holds up where fragile string/opcode
    features collapse. Train a binary classifier on labeled benign vs. packed packages using packing-resilient
    features (whole/section entropy, file size, permission count, manifest anomalies, native-lib presence,
    and download context such as source ASN, domain age, TLS fingerprint). Prefer structural and API features
    over string or opcode features, which lose meaning once code is packed. Alert when confidence exceeds
    a calibrated threshold (for example > 0.9), emit the top-3 contributing features for explainability,
    and submit the sample to sandbox analysis. A high-confidence hit indicates likely Defense Evasion
    packing and warrants dynamic confirmation.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - MDM application inventory
  - 'NAI: Network Security Monitoring (NSM) sensor locations monitoring traffic to/from corporate Wi-Fi
    and VPNs; Mobile Device Management (MDM) / Enterprise Mobility Management (EMM) platform application
    inventories; Developer workstations and CI/CD build servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = [whole_entropy,section_entropy,file_size,perm_count,manifest_anomalies,native_lib,src_asn,domain_age,tls_fp];\n\
      p = packed_classifier.predict_proba(feats(pkg));\nif p > 0.9:\n  alert(pkg.hash, p, top3_features(pkg));\n\
      \  submit_to_sandbox(pkg)."
- question: When a package's classes.dex or Mach-O bytes are rendered as an image, does a CNN classify
    the visual texture as packed or encrypted code above the calibrated probability?
  context: Detects packing from the visual texture of bytecode without disassembling it, which is valuable
    when packers defeat parsers and string analysis. Convert each package's classes.dex (or Mach-O) bytes
    into a grayscale/RGB image and score it with a CNN; packed or encrypted code produces distinctive
    high-entropy visual patterns that differ from normal compiled code. Alert above a calibrated probability
    and route the sample to sandbox analysis. This complements entropy and structural methods by learning
    texture patterns specific to particular packer families, strengthening confidence that an app is using
    Defense Evasion packing.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - MDM application inventory
  - 'NAI: Network Security Monitoring (NSM) sensor locations monitoring traffic to/from corporate Wi-Fi
    and VPNs; Mobile Device Management (MDM) / Enterprise Mobility Management (EMM) platform application
    inventories; Developer workstations and CI/CD build servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "img = bytes_to_image(pkg.classes_dex or pkg.macho);\np = cnn_packed_model.predict(img);\n\
      if p > calibrated_threshold:\n  alert(pkg.hash, p);\n  route_to_sandbox(pkg)."
- question: Does a newly observed APK or IPA match a YARA rule for known mobile packers and obfuscators
    such as UPX, DexProtector, Bangcle/SecShell, or ijiami?
  context: Provides deterministic identification of known packer families, the cheapest and most explainable
    detection layer. Scan new packages from Zeek files.log or device install logs with a YARA ruleset
    targeting mobile packers and obfuscators, keying on packer stub libraries, characteristic strings,
    and native .so names (UPX, DexProtector, Bangcle/SecShell, ijiami). Alert on any match and include
    the file hash, source, install device, and matching rule name. A YARA match is high-confidence evidence
    of intentional packing for Defense Evasion; a non-match does not clear the file, since custom packers
    leave no known signatures and must be caught by the entropy, structural, and behavioral methods.
  answer_sources:
  - Zeek files.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - Application vetting static analysis reports
  - YARA scan results
  - 'NAI: File systems on developer and user endpoints; Corporate application repositories and stores;
    Network file transfer inspection points (e.g., inline sandboxing); Automated malware analysis sandboxes.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for pkg in new_packages(files.log, install_logs):\n  m = yara_scan(pkg, ruleset='mobile_packers');\
      \ # UPX, DexProtector, Bangcle/SecShell, ijiami\n  if m:\n    alert(file_hash=pkg.hash, source=pkg.src,\
      \ device=pkg.dst, rule=m.rule_name)."
- question: Within a tight window, is there an ordered runtime chain of (1) a high-entropy blob written
    to an app-writable path, (2) a memory-protection change to executable, and (3) a dynamic load or exec
    of that freshly written artifact?
  context: 'Catches packers at runtime by correlating the canonical decrypt-then-load sequence, which
    works even for custom packers with no static signature. Look for: (1) write of a high-entropy/opaque
    blob (.dex/.so/.bin) in app-writable paths (/data/data/<pkg>/(files|cache) on Android or tmp/Caches
    on iOS), (2) a memory-protection change to executable (SELinux AVC execmem/execute_no_trans or mprotect
    RW->RX/RWX), then (3) DexClassLoader/InMemoryDexClassLoader, reflective defineClass(byte[]), or dlopen
    of the freshly written artifact, all within a tight window (e.g., <= 5s). Anti-Frida/anti-debug syscalls
    often accompany this chain. Alert with the ordered event tuple; observing the full sequence is strong
    behavioral proof of in-memory unpacking for Defense Evasion.'
  answer_sources:
  - Zeek files.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - Application vetting static analysis reports
  - YARA scan results
  - 'NAI: File systems on developer and user endpoints; Corporate application repositories and stores;
    Network file transfer inspection points (e.g., inline sandboxing); Automated malware analysis sandboxes.'
  range: Last 90 days, with event-centered correlation over a <=5 second window per package UID.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'blob = file_create where path in app_writable and entropy(file) >= 7.2 and ext in [''.dex'',''.so'',''.bin''];

      prot = mem_event where (selinux_avc in [''execmem'',''execute_no_trans''] or mprotect RW->RX|RWX)
      and uid==blob.uid;

      load = load_event where (DexClassLoader|InMemoryDexClassLoader|defineClass(byte[])|dlopen) on blob.path;

      alert when blob -> prot -> load within 5s and same uid;

      output ordered_tuple(blob, prot, load), pkg, uid.'
- question: Is a newly observed package unknown to the approved exact-hash allowlist, or is it a near-duplicate-but-modified
    match against approved packages by fuzzy hashing?
  context: Establishes a deterministic provenance check that flags both wholly unknown packages and tampered
    variants of approved ones. Maintain per-app/version exact-hash and fuzzy-hash (ssdeep) allowlists
    from the approved MDM inventory and flag packages that are unknown or near-duplicate-but-modified.
    Repackaging and packing a legitimate app produces a high ssdeep similarity but a different exact hash,
    which this check surfaces directly. An unknown exact hash with high fuzzy similarity to an approved
    app is a strong indicator of repackaging/packing for Defense Evasion, while a fully unknown package
    warrants the entropy and YARA checks above.
  answer_sources:
  - Zeek files.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - Application vetting static analysis reports
  - YARA scan results
  - 'NAI: File systems on developer and user endpoints; Corporate application repositories and stores;
    Network file transfer inspection points (e.g., inline sandboxing); Automated malware analysis sandboxes.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "exact = approved_exact_hashes(MDM);\nfuzzy = approved_ssdeep(MDM);\nfor pkg in new_packages():\n\
      \  if pkg.sha256 in exact: continue;\n  sim = max(ssdeep_compare(pkg, a) for a in fuzzy);\n  if\
      \ sim >= 60:  alert(pkg.hash, 'repackaged?', nearest_app, sim);\n  else:          alert(pkg.hash,\
      \ 'unknown_package')."
- question: Does a package contain more non-baseline or randomized executable section/segment names than
    three standard deviations above the approved-app baseline mean?
  context: 'Targets a structural artifact of packing: packers frequently introduce nonstandard or randomized
    section/segment names (for example .UPX0, .aspack, .pdata-style or random strings). Extract executable
    section/segment names from each new package and compare them to a baseline derived from approved MDM
    inventory, flagging packages where the count of non-baseline or randomized names exceeds mean + 3
    standard deviations. Benign apps reuse a small, stable set of section names, so an excess of unfamiliar
    names is a reliable structural indicator of packing-based Defense Evasion. A clean section-name profile
    argues against well-known packers but does not exclude custom ones.'
  answer_sources:
  - Zeek files.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - Application vetting static analysis reports
  - YARA scan results
  - 'NAI: File systems on developer and user endpoints; Corporate application repositories and stores;
    Network file transfer inspection points (e.g., inline sandboxing); Automated malware analysis sandboxes.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = section_name_baseline(MDM_approved_apps);\nfor pkg in new_packages():\n  names = exec_section_names(pkg);\n\
      \  nonbase = count(n for n in names if n not in base.known or looks_random(n));\n  if nonbase >\
      \ base.count.mean + 3*base.count.std:\n    alert(pkg.hash, nonbase, names)."
- question: Are daily counts of YARA packer matches spiking beyond the 99th-percentile forecast interval,
    suggesting a packing-based campaign against the fleet?
  context: Shifts from per-file detection to fleet-level campaign detection. Apply time-series anomaly
    detection (Seasonal-ARIMA or Prophet) to daily counts of YARA packer matches and alert when the count
    exceeds the 99th-percentile forecast interval. A coordinated push of packed apps - for example a phishing
    or sideloading campaign - shows up as a statistically significant spike above normal background packer
    hits even if each individual file would be triaged routinely. A positive result should trigger a proactive
    campaign investigation pivoting on common source and target, strengthening detection of organized
    Defense Evasion activity.
  answer_sources:
  - Zeek files.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - Application vetting static analysis reports
  - YARA scan results
  - 'NAI: File systems on developer and user endpoints; Corporate application repositories and stores;
    Network file transfer inspection points (e.g., inline sandboxing); Automated malware analysis sandboxes.'
  range: Last 90 days, with daily aggregation for forecasting.
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = count(yara_packer_matches) by day;\nforecast = seasonal_arima_or_prophet(series);\n\
      if today_count > forecast.p99_upper:\n  alert(today_count, forecast.expected, top_sources, top_targets)."
- question: For packers without a known YARA signature, does behavioral modeling of API-call sequences
    (Markov chains) or bytecode-as-image CNN scoring flag the package as packed above a calibrated probability?
  context: Covers the gap left by signature- and string-based detection when adversaries roll custom packers.
    Rather than matching strings, model the package's API-call sequences as Markov chains for obfuscation-resilient
    detection, and/or score bytecode-as-image with a CNN. These approaches learn behavioral and texture
    patterns that survive packing, which fragile opcode and string features do not. Alert above a calibrated
    probability and surface the top contributing features for triage. A behavioral hit on an unsignatured
    sample is meaningful evidence of Defense Evasion packing and should be confirmed with the runtime
    decrypt-then-load correlation and sandboxing.
  answer_sources:
  - Zeek files.log
  - Android PackageManager install logs
  - iOS MobileInstallation logs
  - Application vetting static analysis reports
  - YARA scan results
  - 'NAI: File systems on developer and user endpoints; Corporate application repositories and stores;
    Network file transfer inspection points (e.g., inline sandboxing); Automated malware analysis sandboxes.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = api_call_sequence(pkg);\np_markov = mamadroid_markov_model.score(seq);\np_cnn = cnn_image_model.predict(bytes_to_image(pkg.classes_dex));\n\
      p = combine(p_markov, p_cnn);\nif p > calibrated_threshold:\n  alert(pkg.hash, p, top_features(seq))."
