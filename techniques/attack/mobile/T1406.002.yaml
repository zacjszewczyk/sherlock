name: 'T1406.002: Software Packing'
id: d1848aad-237b-45a0-a0eb-236a4e724cfe
description: Investigate whether an adversary is using packed or obfuscated mobile applications (APK/IPA)
  to conceal code and evade signature-based detection on Android and iOS devices. This playbook helps
  an analyst hunt for packed payloads at delivery (downloads from known-malicious sources), at rest (high
  byte-level Shannon entropy of whole files and embedded classes.dex/Mach-O/native .so, per-section entropy
  and structural anomalies, anomalous or randomized section names, fleet-relative entropy outliers, and
  fuzzy-hash repackaging of approved apps), and at runtime (the canonical decrypt-then-load chain of a
  high-entropy blob write, a memory-protection change to executable, and a dynamic load/exec via DexClassLoader/defineClass/dlopen,
  plus install-time and load-time error spikes). It combines deterministic methods (threat-intel matching,
  YARA packer signatures, hash allowlisting, entropy thresholds) with statistical baselining and machine-learning
  approaches (isolation-forest outlier scoring, supervised classifiers, image-based CNNs, Markov-chain
  behavioral models, and time-series campaign detection) so packed apps are caught even when they use
  custom packers with no known signature.
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
