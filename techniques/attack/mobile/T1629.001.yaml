questions:
- question: Has any user-installed package been granted active Device Administrator (BIND_DEVICE_ADMIN),
    device-owner/profile-owner posture, or Accessibility Service (BIND_ACCESSIBILITY_SERVICE) privileges
    while NOT appearing on the maintained corporate allow-list of applications permitted to hold these
    elevated management roles?
  context: 'These privilege classes are the documented prerequisites for resisting application removal:
    device-admin/owner posture enables setUninstallBlocked and the DISALLOW_UNINSTALL_APPS restriction,
    while an accessibility service enables on-screen monitoring plus performGlobalAction injection to
    dismiss the uninstall modal. In the Defense Evasion tactic an adversary grants itself these roles
    early to entrench. Query MDM/EMM permission audit logs for grant events of these three privilege classes
    and cross-reference each package name against a version-controlled corporate allow-list. Any package
    not on the list should produce a high-severity alert. A positive result identifies a candidate removal-resistant
    app for immediate quarantine; a clean result means no unauthorized elevated grants were observed in
    the window, though it does not rule out grants outside MDM visibility. Sources: [Prevent Application
    Removal T1629.001, MITRE ATT&CK](https://attack.mitre.org/techniques/T1629/001/); [DevicePolicyManager,
    Android Developers](https://developer.android.com/reference/android/app/admin/DevicePolicyManager);
    [AccessibilityService, Android Developers](https://developer.android.com/guide/topics/ui/accessibility/service).'
  answer_sources:
  - MDM/EMM application inventory logs
  - MDM/EMM permission audit logs
  - 'NAI: MDM/EMM Management Server, Managed Mobile Device Fleet, Centralized Log Aggregator (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert when mdm.permission_grant in [''BIND_DEVICE_ADMIN'',''DEVICE_OWNER'',''PROFILE_OWNER'',''BIND_ACCESSIBILITY_SERVICE'']

      and package_name not in corporate_allowlist;

      severity=high; output device_id, package_name, granted_role, timestamp.'
- question: Among applications granted high-risk admin/accessibility privileges, do any have a package
    name whose Shannon entropy exceeds the 95th percentile of allow-listed packages, a Levenshtein distance
    <=2 to a commonly impersonated high-value app name, or a per-app permission count that is a robust
    statistical outlier (modified Z-score |z|>3.5)?
  context: 'Malicious apps frequently disguise themselves with randomized (high-entropy) package names
    or with names that typo-squat trusted apps (e.g., ''com.android.chrome'', ''com.microsoft.office.outlook'',
    ''com.company.vpn'') to blend into the fleet while holding removal-resisting privileges. For each
    app granted high-risk permissions, compute the package-name Shannon entropy and compare against the
    entropy distribution of allow-listed packages, flagging anything above the 95th percentile; separately
    compute Levenshtein distance to a curated impersonation list and alert when <=2; and apply a robust
    median/MAD modified Z-score to per-app permission counts so a few heavily-permissioned apps do not
    skew the threshold. These static string features are core explainable discriminators in Android malware
    research (Drebin). For Defense Evasion a hit indicates an app deliberately styled to evade casual
    review while entrenching; a clean result lowers but does not eliminate suspicion. Sources: [Modified
    Z-Score for Anomaly Detection, Detection Engineering Weekly](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [Drebin, Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - MDM/EMM application inventory logs
  - MDM/EMM permission audit logs
  - 'NAI: MDM/EMM Management Server, Managed Mobile Device Fleet, Centralized Log Aggregator (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for app in apps_with_highrisk_perms:\n  H = shannon_entropy(app.package_name);\n  lev = min(levenshtein(app.package_name,\
      \ n) for n in impersonation_list);\n  zperm = modified_zscore(app.permission_count, fleet_perm_counts);\n\
      alert when H > p95(allowlist_entropy) or lev <= 2 or abs(zperm) > 3.5;\noutput package_name, H,\
      \ lev, zperm."
- question: When newly-permissioned apps are scored by an explainable classifier over static metadata
    (package-name entropy, requested restricted permissions/API families like BIND_DEVICE_ADMIN, BIND_ACCESSIBILITY_SERVICE,
    performGlobalAction, Levenshtein scores, and app-store source), do any exceed a malicious probability
    of 0.90, and what top-3 features drove the verdict?
  context: 'Rule and statistical layers can miss novel malware, so feed static app metadata for newly-permissioned
    apps into an explainable classifier (linear SVM / Random Forest / gradient boosting) trained on labeled
    benign and malicious corpora (Drebin; Naway & Li). The model must list the top-3 contributing features
    (e.g., ''requests BIND_ACCESSIBILITY_SERVICE'', ''high package-name entropy'', ''off-store source'')
    so the analyst can validate the call, and a probability above 0.90 should trigger a critical alert
    and MDM quarantine. Retrain time-aware to counter concept drift (TESSERACT) and keep the deterministic
    allow-list rule as the floor rather than letting the model replace it. For Defense Evasion this catches
    removal-resistant apps that evade static signatures; the explainable features make a positive result
    actionable and a low score supportive of a benign conclusion. Sources: [Drebin, Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf);
    [A Review on The Use of Deep Learning in Android Malware Detection, Naway & Li](https://arxiv.org/abs/1812.10360);
    [TESSERACT, Pendlebury et al.](https://www.usenix.org/system/files/sec19-pendlebury.pdf).'
  answer_sources:
  - MDM/EMM application inventory logs
  - MDM/EMM permission audit logs
  - 'NAI: MDM/EMM Management Server, Managed Mobile Device Fleet, Centralized Log Aggregator (SIEM)'
  range: Last 90 days, with periodic time-aware retraining.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = static_metadata([pkg_name_entropy, restricted_perms, api_families, levenshtein,
      store_source]);

      prob = classifier.predict_proba(features);  # SVM/RF/GBM, trained benign+malicious

      if prob > 0.90: critical_alert + mdm_quarantine;

      output package_name, prob, top3_features(SHAP).'
- question: Is any app holding device-admin/accessibility posture still present after a user-initiated
    uninstall, or did an MDM-issued uninstall command return a failed/blocked status without the package
    being removed within the expected window?
  context: 'The failure state itself is a first-class signal of active removal resistance: if a privileged
    app survives a user uninstall attempt, or an MDM-issued uninstall command returns failed/blocked while
    the package remains in inventory, the app is fighting removal exactly as Prevent Application Removal
    describes. From MDM/EMM inventory, correlate uninstall attempts (user-initiated or command-issued)
    against subsequent package presence and alert when removal does not complete within the expected window.
    For Defense Evasion this is high-confidence because legitimate apps uninstall cleanly; a persistent
    package after a confirmed removal attempt warrants escalation and possibly device re-imaging, while
    successful removals confirm no active resistance for that event. Sources: [Prevent Application Removal
    T1629.001, MITRE ATT&CK](https://attack.mitre.org/techniques/T1629/001/); [DevicePolicyManager, Android
    Developers](https://developer.android.com/reference/android/app/admin/DevicePolicyManager).'
  answer_sources:
  - MDM/EMM application inventory logs
  - MDM/EMM permission audit logs
  - 'NAI: MDM/EMM Management Server, Managed Mobile Device Fleet, Centralized Log Aggregator (SIEM)'
  range: Last 90 days, correlated around each uninstall attempt.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each uninstall_attempt (user_initiated or mdm_command) on package P, device D:\n  if P\
      \ in inventory(D) after expected_window or mdm_command.status in ['failed','blocked']:\n    alert(severity=high,\
      \ 'removal resisted', D, P);\nescalate critical if P holds device_admin or accessibility."
- question: On a single managed device, is a foreground change to the package-installer or Settings uninstall
    confirmation screen (AccessibilityEvent TYPE_WINDOW_STATE_CHANGED) followed within ~2 seconds by a
    performGlobalAction(GLOBAL_ACTION_BACK=1 or GLOBAL_ACTION_HOME=2) call from a non-system accessibility
    service, after which the target app remains installed?
  context: 'This is the exact documented accessibility-abuse mechanism for dismissing the uninstall modal:
    the malware watches for the installer/Settings uninstall window and immediately injects a global back
    or home action to navigate the user away before they can confirm removal (Diao et al.). Build an MTD/EDR-fed
    SIEM correlation rule keyed on device ID that fires when TYPE_WINDOW_STATE_CHANGED for the package
    installer or Settings uninstall screen is followed within a 2-second window by a performGlobalAction(1
    or 2) from a non-system, user-installed accessibility service. For Defense Evasion this catches the
    active disruption in the act; escalate to critical if the same package then remains installed (the
    failed-uninstall state). A match is strong evidence of removal resistance; absence does not clear
    a device that may use a device-admin path instead. Sources: [AccessibilityService, Android Developers](https://developer.android.com/guide/topics/ui/accessibility/service);
    [Kindness is a Risky Business, Diao et al.](https://www.usenix.org/system/files/raid2019-diao.pdf);
    [Prevent Application Removal T1629.001, MITRE ATT&CK](https://attack.mitre.org/techniques/T1629/001/).'
  answer_sources:
  - Mobile Threat Defense (MTD) API call logs
  - Endpoint Detection and Response (EDR) for Mobile logs
  - 'NAI: Managed Mobile Device Fleet, Mobile Threat Defense (MTD) Console, SIEM'
  range: Last 90 days, with a 2-second event correlation window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert when event A (accessibility.window_state_changed where package in [installer,settings_uninstall])

      is followed on same device_id within 2s by event B (performGlobalAction arg in [1,2] from non_system_accessibility_service);

      escalate critical if target_package still installed;

      output device_id, package, action_arg, delta_seconds.'
- question: For each app on each device, does the hourly frequency of performGlobalAction calls exceed
    a robust 14-day rolling baseline (>3 standard deviations or modified Z-score |z|>3.5), and do its
    accessibility API transitions include rare sequences such as 'uninstall/settings-window -> global-action-back/home'?
  context: 'Removal-resistant malware tends to invoke performGlobalAction far more, and in different patterns,
    than benign accessibility tools. Maintain a 14-day rolling per-app, per-device baseline of hourly
    performGlobalAction frequency and alert (medium) when an app exceeds 3 standard deviations above its
    own baseline, preferring a modified Z-score (|z|>3.5) to resist automation-driven skew. Complement
    the volume test by modeling normal API-call transition probabilities as a Markov chain (MaMaDroid)
    and flagging rare, high-signal transitions like ''uninstall/settings-window -> global-action-back/home''
    that are characteristic of modal dismissal. For Defense Evasion this finds disruption activity that
    stays under any single-event threshold; a sustained spike or a rare evasive transition warrants correlation
    with the deterministic rule, while baseline-consistent behavior supports a benign read. Sources: [Modified
    Z-Score for Anomaly Detection, Detection Engineering Weekly](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [MaMaDroid, Mariconti et al.](https://arxiv.org/abs/1612.04433).'
  answer_sources:
  - Mobile Threat Defense (MTD) API call logs
  - Endpoint Detection and Response (EDR) for Mobile logs
  - 'NAI: Managed Mobile Device Fleet, Mobile Threat Defense (MTD) Console, SIEM'
  range: Last 90 days, over a 14-day rolling per-app/per-device baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per app per device per hour: f = count(performGlobalAction);

      baseline = rolling_14d(app, device); z = modified_zscore(f, baseline);

      alert when f > mean+3*std or abs(z) > 3.5;

      markov = transition_prob_model(api_sequence);

      flag rare transition ''settings/uninstall_window -> global_action_back/home'';

      output device_id, app, f, z, rare_transition.'
- question: Does a sequence model trained on normal per-device UI/accessibility event streams flag a real-time
    sequence as highly anomalous, specifically an 'app settings'/'uninstall' event immediately followed
    by an injected GLOBAL_ACTION_BACK/HOME, and which top-3 events drove the anomaly score?
  context: 'Train an LSTM/Transformer sequence model (DeepLog) on normal per-device UI/accessibility event
    streams from MTD/EDR logs and score live sequences, alerting on high-anomaly patterns and surfacing
    the top-3 anomalous events in the alert text. The canonical malicious sequence to catch is an app-settings
    or uninstall event immediately followed by an injected GLOBAL_ACTION_BACK or GLOBAL_ACTION_HOME. Combine
    the sequence model with a Markov-feature classifier (MaMaDroid) for resilience to malware-family churn
    and retrain time-aware to counter drift (TESSERACT). For Defense Evasion this learns each device''s
    normal interaction rhythm and detects the abnormal injection pattern even when individual events look
    benign; an explained high-anomaly sequence merits investigation, while normal scoring supports clearing
    the device for that interval. Sources: [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015);
    [MaMaDroid, Mariconti et al.](https://arxiv.org/abs/1612.04433); [TESSERACT, Pendlebury et al.](https://www.usenix.org/system/files/sec19-pendlebury.pdf).'
  answer_sources:
  - Mobile Threat Defense (MTD) API call logs
  - Endpoint Detection and Response (EDR) for Mobile logs
  - 'NAI: Managed Mobile Device Fleet, Mobile Threat Defense (MTD) Console, SIEM'
  range: Last 90 days, scored in real time with time-aware retraining.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = LSTM_or_Transformer(train=normal_per_device_ui_event_streams);

      score = model.anomaly_score(live_sequence);

      alert when score high and sequence ~ [''settings/uninstall'', ''global_action_back/home''];

      ensemble with markov_feature_classifier;

      output device_id, score, top3_anomalous_events.'
- question: Within 60 minutes of a high-risk permission grant (device-admin/device-owner/accessibility),
    did the device connect to a domain registered within the last 30 days or to a known-bad destination,
    and how many NXDOMAIN responses or firewall-blocked/rejected connections (conn_state S0/REJ) followed?
  context: 'Removal-resistant malware commonly calls home shortly after entrenching. On an MDM alert for
    a high-risk grant, pivot to Zeek dns.log and conn.log for that device''s connections over the next
    60 minutes, enrich destinations against threat intel and WHOIS, and alert (high) on known-bad destinations
    or newly registered (<=30 days) domains. Explicitly profile the failure state: count NXDOMAIN responses
    (dns.log rcode) and blocked/rejected connections (conn.log conn_state S0/REJ) as a distinct beaconing-to-dead-C2
    signal, since malware often beacons to sinkholed or not-yet-live infrastructure. For Defense Evasion
    this links the on-device entrenchment to network command-and-control; a hit on a fresh or bad domain
    right after a grant is a strong corroborating indicator, while clean DNS/conn activity weakens the
    C2 hypothesis for that window. Sources: [JA3, Salesforce](https://github.com/salesforce/ja3); [Prevent
    Application Removal T1629.001, MITRE ATT&CK](https://attack.mitre.org/techniques/T1629/001/).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - MDM/EMM permission audit logs
  - 'NAI: Network Gateway Firewalls, Internal DNS Servers, Network Security Monitoring (NSM) Sensor Grid
    at egress points, MDM/EMM Management Server'
  range: Last 90 days, with a 60-minute window after each high-risk grant.
  queries:
  - technology: Zeek/pseudocode
    query: "on mdm_highrisk_grant(device D, time T):\n  conns = conn.log[D, T..T+60min]; dns = dns.log[D,\
      \ T..T+60min];\n  enrich dst with threat_intel + whois;\n  alert high when dst in known_bad or domain_age\
      \ <= 30d;\n  count nxdomain = dns.rcode==NXDOMAIN; dead = conn_state in ['S0','REJ'];\n  output\
      \ D, dst, domain_age, nxdomain_count, dead_count."
- question: For a device with a recent high-risk grant, do inter-connection time deltas and per-connection
    byte totals to any destination show near-zero variance (periodic, fixed-size beaconing), or does its
    TLS JA3/JA3S fingerprint appear in fewer than 1% of org sessions (a non-browser TLS client)?
  context: 'Beaconing and unusual TLS clients are robust network signatures of mobile C2. For a device
    with a recent high-risk grant, analyze Zeek conn.log per destination IP: compute the standard deviation
    and coefficient of variation of inter-connection time deltas and of total bytes (orig_bytes+resp_bytes);
    near-zero values indicate periodic, fixed-size beaconing, and a jitter-robust temporal-regularity
    score (BAYWATCH) survives enterprise noise and intentional jitter. Separately compute JA3/JA3S hashes
    from ssl.log and alert on hashes with <1% prevalence in the org baseline, which often flag non-browser
    TLS stacks used by malware. For Defense Evasion these corroborate that the entrenched app maintains
    covert communications; a regular beacon or rare JA3 from a freshly permissioned device strengthens
    the case, while diverse, irregular traffic is more consistent with normal app behavior. Sources: [BAYWATCH,
    Hassan et al.](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks);
    [JA3, Salesforce](https://github.com/salesforce/ja3).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - MDM/EMM permission audit logs
  - 'NAI: Network Gateway Firewalls, Internal DNS Servers, Network Security Monitoring (NSM) Sensor Grid
    at egress points, MDM/EMM Management Server'
  range: Last 90 days, focused on devices with a recent high-risk grant.
  queries:
  - technology: Zeek/pseudocode
    query: "per device with recent_highrisk_grant, per dst_ip in conn.log:\n  dt = stdev/cv(inter_connection_deltas);\
      \ bv = stdev/cv(orig_bytes+resp_bytes);\n  beacon = baywatch_regularity_score(deltas);\n  alert\
      \ when dt~0 and bv~0 or beacon high;\nfrom ssl.log: ja3=hash(client_hello); alert when prevalence(ja3)\
      \ < 1%;\noutput device_id, dst_ip, cv_delta, cv_bytes, ja3, ja3_prevalence."
- question: After a high-risk grant, does an LSTM autoencoder trained on the device's network history
    produce a reconstruction error above the 99th percentile, or does an Isolation Forest flag the per-device
    feature vector as an outlier, and which features (bytes-out/min, connections/min, protocol mix, failed-connection
    ratio) contributed most?
  context: 'Model per-device network telemetry to catch C2 patterns that fixed rules miss. Feed per-device
    time-series features (bytes-out/min, connections/min, protocol mix, failed-connection ratio) from
    Zeek conn.log into a trained LSTM autoencoder and, after a high-risk grant, alert (high) when reconstruction
    error exceeds the 99th percentile of the device''s own historical error distribution (DeepLog). Run
    an Isolation Forest over the same feature vector as an explainable unsupervised baseline that surfaces
    the top contributing features (Liu, Ting & Zhou). For Defense Evasion this detects post-entrenchment
    network behavior that departs from the device''s norm without depending on known indicators; agreement
    between the two models and high failed-connection or bytes-out features warrants investigation, while
    errors inside the normal band support a benign interpretation. Sources: [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015);
    [Isolation Forest, Liu, Ting & Zhou](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - MDM/EMM permission audit logs
  - 'NAI: Network Gateway Firewalls, Internal DNS Servers, Network Security Monitoring (NSM) Sensor Grid
    at egress points, MDM/EMM Management Server'
  range: Last 90 days, with per-device historical training and post-grant scoring.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = per_device_timeseries([bytes_out_min, conns_min, proto_mix, failed_conn_ratio]);

      ae_err = LSTM_autoencoder.reconstruction_error(features);

      iso = IsolationForest(features);

      alert high when (post_grant and ae_err > p99(device_history)) or iso==outlier;

      output device_id, ae_err, iso_score, top_contributing_features.'
- question: Did a non-system, non-allowlisted package holding active device-admin/owner posture call DevicePolicyManager.setUninstallBlocked(self,
    true) for its own package or set the DISALLOW_UNINSTALL_APPS user restriction?
  context: 'These DevicePolicyManager controls are the documented device-admin mechanism for preventing
    removal: an app that blocks uninstall of itself, or sets a user restriction disallowing uninstalls,
    is explicitly entrenching. From MDM/EMM and MTD telemetry, alert (critical) when a non-system, non-allowlisted
    package with active device-admin/owner posture invokes setUninstallBlocked(self, true) or sets DISALLOW_UNINSTALL_APPS.
    For Defense Evasion this is among the highest-confidence indicators because legitimate enterprise
    tooling that needs this protection should already be allow-listed; an off-list app self-blocking removal
    should trigger immediate quarantine and forensic review, while no such call means the device-admin
    removal-block path was not exercised in the window. Sources: [DevicePolicyManager, Android Developers](https://developer.android.com/reference/android/app/admin/DevicePolicyManager);
    [Prevent Application Removal T1629.001, MITRE ATT&CK](https://attack.mitre.org/techniques/T1629/001/).'
  answer_sources:
  - MDM/EMM permission audit logs
  - MDM/EMM application inventory logs
  - Mobile Threat Defense (MTD) API call logs
  - 'NAI: MDM/EMM Management Server, Mobile Threat Defense (MTD) Console, Managed Mobile Device Fleet,
    Centralized Log Aggregator (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert critical when api_call in [''setUninstallBlocked(self,true)'',''setUserRestriction(DISALLOW_UNINSTALL_APPS)'']

      and package holds active device_admin/owner posture

      and package not in corporate_allowlist and package not system;

      output device_id, package, api_call, timestamp.'
- question: Is any app generating repeated device-admin deactivation prompts (DeviceAdminReceiver.onDisableRequested)
    or failed removeActiveAdmin/uninstall events beyond a robust threshold (e.g., >2 in 10 minutes or
    modified Z-score |z|>3.5 vs the fleet baseline), indicating it is actively fighting deactivation?
  context: 'An app that repeatedly re-prompts or intercepts deactivation requests is resisting the removeActiveAdmin
    / uninstall flow. Baseline per-app frequency of admin-deactivation prompts (onDisableRequested) and
    failed removeActiveAdmin/uninstall events, then alert when an app exceeds a robust threshold such
    as >2 prompts/failures in 10 minutes or a fleet-relative modified Z-score |z|>3.5. The modified Z-score
    resists skew from a few noisy apps and from automation. For Defense Evasion this captures the behavioral
    tell-tale of an app that will not let go of its administrator role; a cluster of repeated deactivation
    interceptions or failed removals is strong evidence of removal resistance and should be correlated
    with the setUninstallBlocked rule, while isolated single prompts are expected during normal app management.
    Sources: [Modified Z-Score for Anomaly Detection, Detection Engineering Weekly](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [DevicePolicyManager, Android Developers](https://developer.android.com/reference/android/app/admin/DevicePolicyManager).'
  answer_sources:
  - MDM/EMM permission audit logs
  - MDM/EMM application inventory logs
  - Mobile Threat Defense (MTD) API call logs
  - 'NAI: MDM/EMM Management Server, Mobile Threat Defense (MTD) Console, Managed Mobile Device Fleet,
    Centralized Log Aggregator (SIEM)'
  range: Last 90 days, against a fleet baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per app: prompts = count(onDisableRequested); fails = count(failed removeActiveAdmin/uninstall);

      z = modified_zscore(prompts+fails, fleet_baseline);

      alert when (prompts+fails) > 2 within 10min or abs(z) > 3.5;

      output device_id, package, prompt_count, fail_count, z.'
- question: When apps requesting device-admin/owner posture are scored by an explainable classifier over
    static features (declared admin policies, requested restricted APIs, package-name entropy, off-store
    source), which are flagged as malicious and what top-3 features explain each verdict?
  context: 'Augment the deterministic setUninstallBlocked rule with a learned detector for risky device-admin
    apps. Score apps requesting device-admin/owner posture with an explainable classifier over static
    features (declared admin policies, requested restricted APIs, package-name entropy, off-store source)
    and output the top-3 contributing features per alert (Drebin; Naway & Li). Retrain time-aware to counter
    drift (TESSERACT) and keep the deterministic setUninstallBlocked rule as the floor so the model never
    silently replaces it. For Defense Evasion this generalizes beyond known indicators to catch new device-admin
    malware that entrenches against removal; an explained high-confidence verdict warrants quarantine
    and review, while a low score combined with allow-listed status supports a benign conclusion. Sources:
    [Drebin, Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf); [A Review
    on The Use of Deep Learning in Android Malware Detection, Naway & Li](https://arxiv.org/abs/1812.10360);
    [TESSERACT, Pendlebury et al.](https://www.usenix.org/system/files/sec19-pendlebury.pdf).'
  answer_sources:
  - MDM/EMM permission audit logs
  - MDM/EMM application inventory logs
  - Mobile Threat Defense (MTD) API call logs
  - 'NAI: MDM/EMM Management Server, Mobile Threat Defense (MTD) Console, Managed Mobile Device Fleet,
    Centralized Log Aggregator (SIEM)'
  range: Last 90 days, with time-aware retraining.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = static([declared_admin_policies, requested_restricted_apis, pkg_name_entropy, store_source]);

      prob = explainable_classifier.predict_proba(features);  # SVM/RF/GBM

      alert when prob high; keep setUninstallBlocked rule as floor;

      output device_id, package, prob, top3_features(SHAP).'
