name: 'T1629.001: Prevent Application Removal'
id: d98cedbb-9940-4677-9a4a-0899519a6d2c
description: 'Investigate whether an adversary is abusing Android device-administration or accessibility
  APIs to prevent the user or MDM/EMM from uninstalling a malicious application on managed mobile devices.
  This playbook helps an analyst hunt the causal chain MITRE ATT&CK associates with Prevent Application
  Removal: (1) a user-installed package obtaining or holding elevated, removal-resisting control mechanisms
  (active Device Administrator/BIND_DEVICE_ADMIN, device-owner/profile-owner posture, or Accessibility
  Service/BIND_ACCESSIBILITY_SERVICE) that is not on the corporate allow-list; (2) the user navigating
  into uninstall or application-management flows (TYPE_WINDOW_STATE_CHANGED on the package installer or
  Settings uninstall screen); and (3) immediate UI disruption such as injected performGlobalAction(GLOBAL_ACTION_BACK=1)
  or GLOBAL_ACTION_HOME=2) calls, modal dismissal, self-targeted setUninstallBlocked / DISALLOW_UNINSTALL_APPS
  calls, repeated interception of deactivation prompts (onDisableRequested), or failed/blocked uninstall
  outcomes after which the target application remains installed. It also correlates post-grant network
  behavior (newly registered domains, fixed-size beaconing, rare JA3 fingerprints) that often accompanies
  such malware. The playbook layers deterministic allow-list and correlation rules, statistical baselining
  (modified Z-score, Markov transition modeling, beacon-regularity scoring), and explainable machine learning
  so detection never depends on a single method and every alert surfaces its top contributing features
  for fast SOC triage.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
