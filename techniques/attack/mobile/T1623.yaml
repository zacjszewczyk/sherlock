name: 'T1623.001: Unix Shell'
id: 45c2537c-d122-4319-9943-0c47b561d162
description: Investigate whether an adversary is abusing Unix shell commands and scripts (T1623.001) to
  execute malicious code on managed Android and iOS mobile endpoints. Unix shells underlie both platforms
  and, on rooted or jailbroken devices, can control every aspect of the system through superuser binaries.
  This playbook helps an analyst hunt for non-system applications that invoke shell-execution methods
  such as java.lang.Runtime.exec(), java.lang.ProcessBuilder, or JNI-backed command launchers, and for
  shell child processes (sh, bash, toybox, toolbox, su) spawned by untrusted parent apps. It covers allowlist/watchlist
  and deny-list symbolic-logic rules keyed on suspicious command tokens (su, pm install, wget, curl, busybox,
  toybox, base64, chmod 777, nc -l -p, dd if=) and canonical superuser paths (/system/xbin/su, /system/bin/su,
  /sbin/su, Magisk/BusyBox artifacts); statistical baselining of per-app shell-execution volume, command-argument
  entropy and novelty, parent-child process prevalence rarity, and change-point detection over failed-execution
  and post-event egress-failure rates; and machine-learning models including autoencoder ensembles over
  post-execution network flows, LSTM log-sequence modeling, and supervised/Markov-chain classifiers over
  process and API behavior. Detection spans symbolic logic, statistical methods, and machine learning
  so an analyst can determine whether shell execution on a mobile device reflects benign app behavior
  or adversary code execution, with attention to background context, absence of user interaction, and
  follow-on file-system, privilege-escalation, or network effects.
type: technique
related:
