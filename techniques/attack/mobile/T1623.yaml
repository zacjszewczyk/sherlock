questions:
- question: Did a non-system mobile application invoke a Unix shell-execution method such as java.lang.Runtime.exec(),
    java.lang.ProcessBuilder, or a JNI-backed command launcher, where the calling package is not on a
    pre-approved allowlist or the command arguments contain suspicious shell or root tokens?
  context: 'Execution via Unix Shell on mobile begins when an app reaches out of its normal sandbox to
    run shell commands. This symbolic-logic check searches MDM/MTD API Call Logs for events whose method_name
    is java.lang.Runtime.exec(), java.lang.ProcessBuilder, or a JNI-backed command launcher, and raises
    a high-severity alert when source_app_package_name is NOT on a curated allowlist OR command_arguments
    contain watchlist tokens such as su, pm install, wget, curl, busybox, toybox, base64, chmod 777, nc
    -l -p, or dd if=. A deterministic superuser sub-rule fires when arguments invoke or reference su via
    the canonical paths /system/xbin/su, /system/bin/su, /sbin/su, or Magisk/BusyBox/toybox artifacts,
    which OWASP MASTG treats as definitive root/shell-abuse indicators. The Drebin model treats restricted
    API calls like Runtime.exec/getRuntime as explicit suspicious features and uses a linear model to
    list the contributing features behind each detection, the template for an explainable allowlist/watchlist
    rule. Where runtime instrumentation exists, additionally fire a source-to-sink policy rule when execution
    side effects move sensitive data to a network sink, per the TaintDroid taint-policy model. A positive
    hit means an untrusted app is running shell code or escalating to root; a negative result lowers but
    does not eliminate suspicion because obfuscated arguments can defeat fixed token lists. This maps
    to the Execution tactic: the adversary is running adversary-controlled code on the device, often as
    a launch point for privilege escalation, persistence, or exfiltration. Sources: [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf);
    [OWASP MASTG](https://mas.owasp.org/MASTG/0x05j-Testing-Resiliency-Against-Reverse-Engineering/);
    [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf).'
  answer_sources: &id001
  - MDM/MTD API Call Log
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Managed mobile device fleet; Centralized log aggregator/SIEM; Network egress gateways; VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "events = mdm_mtd_api_call_logs;\nexec_methods = ['java.lang.Runtime.exec()', 'java.lang.ProcessBuilder',\
      \ 'JNI_command_launcher'];\nwatch_tokens = ['su','pm install','wget','curl','busybox','toybox','base64','chmod\
      \ 777','nc -l -p','dd if='];\nsu_paths = ['/system/xbin/su','/system/bin/su','/sbin/su','magisk','busybox','toybox'];\n\
      alert HIGH when e.method_name in exec_methods\n  and (e.source_app_package_name not in allowlist\n\
      \       or any(t in e.command_arguments for t in watch_tokens));\nalert CRITICAL when any(p in lower(e.command_arguments)\
      \ for p in su_paths);  // superuser sub-rule\noutput device, source_app_package_name, method_name,\
      \ command_arguments, matched_token"
- question: For each application package, does a shell-execution event deviate from its 30-day fleet baseline
    in volume, command-argument entropy, command novelty, or argument length, or is there a change-point
    spike in failed executions and post-event egress failures?
  context: 'Adversary shell execution often stands out statistically from an app''s normal behavior even
    when no single token matches a watchlist. Build a 30-day per-app baseline of shell-execution behavior
    across the fleet and raise a medium-severity alert when a new event meets any of: (a) execution count
    from a single device in 24h exceeds the 99th percentile for that app across the fleet (volume/frequency);
    (b) Shannon entropy of command_arguments exceeds the app mean by more than 3 standard deviations or
    a static floor of 4.5 (obfuscation); (c) the command is novel with Jaccard similarity below 0.2 versus
    the app''s prior command set; (d) argument length exceeds the 98th percentile. Derive per-app network-flow
    thresholds for the post-execution window from a labeled corpus such as CICAndMal2017. Treat the count
    of FAILED executions (non-zero exit, permission denied, blocked su) and post-event egress failures
    (NXDOMAIN, 404, blocked connections) as a distinct State signal and alert on a change-point spike
    using CUSUM or Bayesian online change-point detection. The syscall-sequence baselining principle from
    A Sense of Self for Unix Processes (normal behavior is recurring short sequences; intrusions appear
    as bursts of novel sequences) grounds these per-app profiles. A positive result indicates an app behaving
    abnormally for itself, a strong Execution indicator; a negative result suggests the activity is consistent
    with that app''s established behavior. Sources: [CICAndMal2017](https://www.unb.ca/cic/datasets/andmal2017.html);
    [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/);
    [A Sense of Self for Unix Processes](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources: *id001
  range: Last 90 days, with a rolling 30-day per-app baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_app_30d(mdm_mtd_api_call_logs);\nfor e in new_shell_exec_events:\n  app = e.source_app_package_name;\n\
      \  vol_24h = count(app, device=e.device, window=24h);\n  ent = shannon_entropy(e.command_arguments);\n\
      \  jac = jaccard(e.command, baseline[app].command_set);\n  alert MED when vol_24h > p99(baseline[app].exec_count)\n\
      \    or ent > baseline[app].mean_entropy + 3*std or ent > 4.5\n    or jac < 0.2\n    or len(e.command_arguments)\
      \ > p98(baseline[app].arg_len);\n// State signal: change-point on failures\nfail_rate = rate(failed_exec\
      \ + egress_failures by app);\nalert when CUSUM_or_BOCPD(fail_rate) flags change_point"
- question: After a shell-execution alert on a device, do the post-execution network flows in the following
    five minutes show anomalous egress (beaconing, large uploads, new destinations) per an unsupervised
    autoencoder ensemble, or does the per-app process/API event sequence fall outside an LSTM model's
    predicted log-keys?
  context: 'Adversaries frequently follow shell execution with command-and-control or exfiltration, so
    modeling the post-execution network and event sequence catches activity that static rules miss. For
    devices with a shell-execution alert, apply a pre-trained autoencoder/time-series model to Zeek conn.log
    flows in the 5 minutes after the event using features bytes_out, bytes_in, connection_count, distinct_destination_ip_count,
    inter-arrival jitter, and blocked-connection count. Use an online autoencoder ensemble scored by reconstruction
    error (Kitsune) to flag novel post-execution egress without labels, and escalate to critical when
    reconstruction error exceeds the 98th percentile of the normal error distribution. In parallel, model
    the normal SEQUENCE of per-app process/API events with an LSTM (DeepLog) and flag events whose log-key
    is outside the top-g predictions, retraining online from analyst dispositions. Alerts MUST surface
    the top-3 contributing features (for example a bytes_out spike, a new destination ASN, a novel API
    key) rather than a bare score; account for concept drift with time-aware evaluation and periodic retraining
    as the Android deep-learning literature warns. Enrich escalated alerts with destination IP reputation
    and ASN. A high reconstruction error or out-of-prediction sequence after shell execution strongly
    suggests adversary-controlled code is communicating outbound; a low score supports a benign disposition.
    Sources: [Kitsune](https://arxiv.org/pdf/1802.09089) ([code](https://github.com/ymirsky/Kitsune-py));
    [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf); [Deep Learning for Android Malware
    Defenses](https://arxiv.org/pdf/2103.05292).'
  answer_sources: *id001
  range: 'Event-centered: 5-minute window after each shell-execution alert; models trained on Last 90
    days of normal flows'
  queries:
  - technology: SIEM/ML pseudocode
    query: "for dev in devices_with_shell_alert:\n  flows = zeek_conn[dev, window=event_time .. event_time+5m];\n\
      \  X = features(flows): bytes_out, bytes_in, connection_count,\n      distinct_destination_ip_count,\
      \ inter_arrival_jitter, blocked_conn_count;\n  err = autoencoder_ensemble.reconstruction_error(X);\
      \   // Kitsune\n  alert CRITICAL when err > p98(normal_error_dist)\n    with top3 = feature_attribution(X);\n\
      \  seq = per_app_event_sequence(dev);\n  alert when log_key(seq) not in lstm.topg_predictions(seq);\
      \  // DeepLog\n  enrich(dest_ip_reputation, dest_asn); feedback_loop -> retrain"
- question: Was a shell child process (sh, bash, toybox, toolbox, or su) created with a parent process
    that is a non-system mobile application on a curated deny-list of apps forbidden from spawning shells?
  context: 'Observing the parent-child process relationship directly catches shell execution even when
    the invoking API call is not logged. Deploy a SIEM rule over MDM/MTD Process Event Logs for events
    where child_process_name is sh, bash, toybox, toolbox, or su, and trigger a critical alert when parent_process_package_name
    is on a curated deny-list of apps that should never spawn shells, such as social media apps, games,
    and untrusted-developer productivity apps. Match su/BusyBox/toybox child processes and references
    to /system/xbin/su, /system/bin/su, /sbin/su, or Magisk artifacts as definitive root/shell-abuse indicators
    per OWASP MASTG, and enforce these as MDM/MTD compliance and policy rules on the managed fleet per
    NIST SP 800-124r2. Treat the restricted exec/shell capability itself as a suspicious feature whose
    contributors are listed in the alert, per the explainable-feature model of Drebin. Auto-enrich with
    device-owner details and reputation for any IPs or domains in the command line. A positive hit means
    a forbidden app is launching a shell or root binary, a high-fidelity Execution signal; a negative
    result does not clear apps that are not on the deny-list, which the statistical and ML methods cover.
    This directly supports the Execution tactic by catching adversary-controlled shell processes at the
    point of creation. Sources: [OWASP MASTG](https://mas.owasp.org/MASTG/0x05j-Testing-Resiliency-Against-Reverse-Engineering/);
    [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf);
    [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources: &id002
  - MDM/MTD Process Event Log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Managed mobile device fleet; Centralized log aggregator/SIEM; Corporate DNS resolvers; Network
    egress gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "events = mdm_mtd_process_event_logs;\nshell_children = ['sh','bash','toybox','toolbox','su'];\n\
      su_artifacts = ['/system/xbin/su','/system/bin/su','/sbin/su','magisk','busybox'];\nalert CRITICAL\
      \ when e.child_process_name in shell_children\n  and e.parent_process_package_name in shell_spawn_denylist;\n\
      alert CRITICAL when any(a in lower(e.command_line) for a in su_artifacts);\nenrich(device_owner,\
      \ ip_domain_reputation(e.command_line));\noutput device, parent_process_package_name, child_process_name,\
      \ command_line"
- question: Is a parent-child process relationship preceding a shell spawn statistically rare across the
    fleet (observed on fewer than 1% of devices running the parent app), and does its argument length,
    token set, or failed-spawn rate deviate from the parent's baseline?
  context: 'Rare parent-child process pairs are a strong sign that an app is doing something outside its
    design, such as spawning a shell. Establish a 90-day baseline of all parent-child process relationships
    across the fleet and trigger a medium-severity alert when a process-creation event involves a parent-child
    pair observed on fewer than 1% of devices running the parent application (prevalence rarity). Escalate
    to high severity if argument length for this rare pair exceeds the 98th percentile or arguments contain
    tokens absent from the parent''s baseline. Add State/Failure-Mode signals: count failed shell spawns,
    non-zero exit codes, and denied su attempts per parent app, and fire when their rate jumps via change-point
    detection (CUSUM/PELT/Bayesian online CPD). Profile the normal short syscall/event sequences each
    parent emits and flag concentrated bursts of novel sequences after a shell spawn, per A Sense of Self
    for Unix Processes. Derive realistic post-spawn network-flow thresholds (byte volume, flow count)
    from CICAndMal2017. A positive result highlights an app spawning shells in a way that is abnormal
    for the fleet, an Execution indicator worth triage; a common, well-established pair is more likely
    benign. This supports Execution by surfacing unusual code-launch behavior that deny-lists may not
    yet cover. Sources: [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/);
    [A Sense of Self for Unix Processes](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf);
    [CICAndMal2017](https://www.unb.ca/cic/datasets/andmal2017.html).'
  answer_sources: *id002
  range: Last 90 days, with a 90-day fleet prevalence baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = parent_child_prevalence_90d(mdm_mtd_process_event_logs);\nfor e in process_creation_events:\n\
      \  pair = (e.parent_process_package_name, e.child_process_name);\n  prev = devices_with(pair) /\
      \ devices_running(e.parent_process_package_name);\n  alert MED when prev < 0.01;\n  alert HIGH when\
      \ prev < 0.01 and\n    (len(e.arguments) > p98(baseline[parent].arg_len)\n     or any(tok not in\
      \ baseline[parent].tokens for tok in e.arguments));\n// State signal\nfail_rate = rate(failed_spawn\
      \ + nonzero_exit + denied_su by parent);\nalert when CUSUM_PELT_BOCPD(fail_rate) flags change_point"
- question: Does a supervised classifier (Random Forest/Gradient Boosting) or a Markov-chain API-sequence
    model score a process-creation event as likely-malicious shell execution (p > 0.9 or an unexpected
    transition into a command-execution package family)?
  context: 'Supervised and sequence models generalize beyond fixed deny-lists and resist API churn and
    obfuscation. Apply a pre-trained supervised classifier (for example Random Forest or Gradient Boosting)
    to score each process-creation event using features: parent package (one-hot), parent-is-system (boolean),
    child process name (one-hot), command-line argument entropy and length, and the statistical parent-child
    prevalence score. Random Forest over method-call/ICC behavioral features is shown to exceed 97% F1
    and stay stable across years and obfuscation (DroidCat), supporting this design. Generate a high-severity
    alert when p > 0.9. To resist API churn and obfuscation, add a parallel model that scores Markov-chain
    transition probabilities over abstracted API/call sequences (MaMaDroid), flagging unexpected transitions
    into command-execution package families. Every alert MUST list the top-3 contributing features (for
    example parent package, argument entropy, prevalence score via feature importances/SHAP), not just
    a probability. Implement an analyst-disposition feedback loop for periodic, time-aware retraining
    to counter concept drift. A high model probability or anomalous API transition indicates adversary
    shell execution that evaded simpler rules; a low score supports a benign disposition. This supports
    the Execution tactic by scoring the likelihood that a process-creation event represents adversary-controlled
    code. Sources: [DroidCat](https://chapering.github.io/pubs/tifs18.pdf); [MaMaDroid](https://arxiv.org/pdf/1612.04433);
    [Deep Learning for Android Malware Defenses](https://arxiv.org/pdf/2103.05292).'
  answer_sources: *id002
  range: Last 90 days; models retrained periodically with time-aware evaluation
  queries:
  - technology: SIEM/ML pseudocode
    query: "for e in process_creation_events:\n  X = [onehot(parent_package), parent_is_system, onehot(child_process_name),\n\
      \       arg_entropy, arg_length, parent_child_prevalence_score];\n  p = supervised_clf.predict_proba(X);\
      \   // RandomForest/GBM, DroidCat-style\n  alert HIGH when p > 0.9 with top3 = feature_importances_or_shap(X);\n\
      \  // parallel sequence model\n  t = markov.transition_prob(abstracted_api_sequence(e));  // MaMaDroid\n\
      \  alert when t flags unexpected transition into command_exec family;\n  feedback_loop(analyst_disposition)\
      \ -> time_aware_retrain"
