- question: >-
    Detect non-sanctioned VPN tunnel destinations: how can an analyst detect non-sanctioned VPN tunnel
    destinations for the Collection context of Adversary-in-the-Middle, given the evidence that A network
    connection from a managed mobile device uses a common VPN protocol/port (e.g., IPsec on UDP 500/4500,
    OpenVPN on TCP 1194, WireGuard on UDP 51820) to an external destination IP/ASN not on the corporate-sanctioned
    VPN gateway list. This is often correlated with a non-standard VPN profile installation logged by
    an MDM/UEM.
  context: >-
    This Symbolic Logic approach supports the Collection information requirement: Is an adversary performing
    an Adversary-in-the-Middle (AitM) attack to intercept or manipulate traffic from corporate mobile
