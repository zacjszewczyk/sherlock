    protocol/port (e.g., IPsec on UDP 500/4500, OpenVPN on TCP 1194, WireGuard on UDP 51820) to an external
    destination IP/ASN not on the corporate-sanctioned VPN gateway list. This is often correlated with
    a non-standard VPN profile installation logged by an MDM/UEM. Approach: Maintain an allowlist of corporate
    VPN gateway IPs/ASNs and alert on any managed-mobile connection to a non-listed destination using
    common VPN ports (IPsec UDP 500/4500, OpenVPN TCP/UDP 1194, WireGuard UDP 51820). Because malicious
    VPN apps move off standard ports, also match protocol fingerprints port-independently: OpenVPN opcode/byte-pattern
    in the first handshake packets and the ACK-based packet-length pattern [OpenVPN is Open to VPN Fingerprinting](https://www.usenix.org/system/files/sec22-xue-diwen.pdf).
    Enrich with passive DNS, WHOIS, GeoIP and correlate with recent VPN-profile installs in MDM/UEM logs.
    A positive result corroborates an AitM interception/manipulation channel and should be triaged against
    device, user, and location context; a negative or clean result lowers but does not eliminate suspicion,
    since properly encrypted traffic can hide interception depending on capture point.
