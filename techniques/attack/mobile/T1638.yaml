  - Zeek x509.log
  - >-
    NAI: Corporate Wi-Fi network segments, network egress points, DNS resolvers, network sensor collectors
    (e.g., Zeek cluster), and Certificate Authority infrastructure.
  range: Last 90 days
  queries:
