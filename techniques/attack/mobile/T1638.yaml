questions:
- question: >-
    Alert on non-ok TLS validation for mobile traffic: how can an analyst alert on non-ok TLS validation
    for mobile traffic for the Collection context of Adversary-in-the-Middle, given the evidence that
    A TLS session initiated by a managed mobile device, captured in Zeek logs, shows a 'validation_status'
    other than 'ok' (e.g., 'self signed certificate in certificate chain', 'unable to get local issuer
    certificate'). This indicates a potential TLS interception attempt using a non-trusted certificate.
  context: >-
    This Symbolic Logic approach supports the Collection information requirement: Is an adversary performing
    an Adversary-in-the-Middle (AitM) attack to intercept or manipulate traffic from corporate mobile
    devices? Evidence to look for: A TLS session initiated by a managed mobile device, captured in Zeek
    logs, shows a 'validation_status' other than 'ok' (e.g., 'self signed certificate in certificate chain',
    'unable to get local issuer certificate'). This indicates a potential TLS interception attempt using
    a non-trusted certificate. Approach: Join Zeek ssl.log and x509.log on uid; trigger a high-priority
    alert when a connection from a managed mobile IP range has validation_status != ok (e.g., 'self signed
    certificate in certificate chain', 'unable to get local issuer certificate'). Additionally flag a
    TLS-handshake-fingerprint mismatch: when the JA3/client-hello fingerprint (cipher-suite order, extensions,
    version) does not match the fingerprint expected for that device/app, the session was re-originated
    by an interceptor presenting its own certificate [The Security Impact of HTTPS Interception](https://jhalderm.com/pub/papers/interception-ndss17.pdf).
    Enrich with cert issuer/subject, check issuer against the trusted-CA allowlist, and verify serials
    against CT logs. A positive result corroborates an AitM interception/manipulation channel and should
    be triaged against device, user, and location context; a negative or clean result lowers but does
    not eliminate suspicion, since properly encrypted traffic can hide interception depending on capture
    point.
  answer_sources: &id001
