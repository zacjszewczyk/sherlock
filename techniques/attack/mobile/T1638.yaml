      its own certificate [The Security Impact of HTTPS Interception](https://jhalderm.com/pub/papers/interception-ndss17.pdf).
      Enrich with cert issuer/subject, check issuer against the trusted-CA allowlist, and verify serials
      against CT logs.
- question: >-
    Profile and baseline TLS validation FAILURE rates: how can an analyst profile and baseline TLS validation
    FAILURE rates for the Collection context of Adversary-in-the-Middle, given the evidence that A TLS
    session initiated by a managed mobile device, captured in Zeek logs, shows a 'validation_status' other
    than 'ok' (e.g., 'self signed certificate in certificate chain', 'unable to get local issuer certificate').
    This indicates a potential TLS interception attempt using a non-trusted certificate.
  context: >-
    This Statistical Method approach supports the Collection information requirement: Is an adversary
    performing an Adversary-in-the-Middle (AitM) attack to intercept or manipulate traffic from corporate
    mobile devices? Evidence to look for: A TLS session initiated by a managed mobile device, captured
    in Zeek logs, shows a 'validation_status' other than 'ok' (e.g., 'self signed certificate in certificate
    chain', 'unable to get local issuer certificate'). This indicates a potential TLS interception attempt
    using a non-trusted certificate. Approach: Treat the untrusted-cert handshake as an explicit failure-state
    signal. For each mobile device IP and SNI maintain a 30-day baseline of error-status TLS connections
    / total TLS connections (Volume) and the non-ok count per minute (Frequency); alert when the ratio
    exceeds the 99th percentile of its history or when the hourly count for the mobile subnet exceeds
    3 standard deviations from the seasonal baseline. Interception is empirically common, so derive subnet-specific
    thresholds rather than a fixed global cutoff [The Security Impact of HTTPS Interception](https://jhalderm.com/pub/papers/interception-ndss17.pdf).
    A positive result corroborates an AitM interception/manipulation channel and should be triaged against
    device, user, and location context; a negative or clean result lowers but does not eliminate suspicion,
    since properly encrypted traffic can hide interception depending on capture point.
