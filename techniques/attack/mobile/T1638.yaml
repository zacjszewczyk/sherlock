- question: >-
    Detect anomalous validation error spikes with explainable ML: how can an analyst detect anomalous
    validation error spikes with explainable ML for the Collection context of Adversary-in-the-Middle,
    given the evidence that A TLS session initiated by a managed mobile device, captured in Zeek logs,
