name: 'T1638: Adversary-in-the-Middle'
id: 8e02e86d-aa1b-4d5f-b4f1-2ed1320e8968
description: >-
  This playbook helps an analyst investigate Adversary-in-the-Middle (AitM) activity targeting corporate
  mobile devices (Android and iOS), where an adversary positions themselves between networked devices
  to intercept or manipulate traffic in support of follow-on data collection, transmitted-data manipulation,
  or denial of service. It guides hunting across several AitM mechanisms: TLS interception using untrusted
  or self-signed certificates (Zeek ssl/x509), rogue VPN tunnels to non-sanctioned destinations (Zeek
  conn and MDM/UEM VPN profile installs), DNS-to-large-upload exfiltration sequences to young or rare
  domains, sideloaded APK installs followed by anomalous uploads, rogue/evil-twin Wi-Fi access points
  and ARP/gateway spoofing reported by MDM/UEM and NAC, and rogue cellular base stations / IMSI catchers
  detected via control-plane anomalies. For each vector it pairs deterministic symbolic-logic detections
  with statistical baselining and explainable machine-learning approaches so a SOC analyst can confirm
  interception, scope affected devices, and respond.
type: technique
related:
- tactic_id: TA0035
  tactic_name: Collection
