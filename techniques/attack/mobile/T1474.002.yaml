- question: '[Initial Access] Validate batch devices against golden manifest: Can you determine, using
    the ''Validate batch devices against golden manifest'' (Symbolic Logic) approach, whether an adversary
    has compromised the hardware supply chain to gain initial access to enrolled mobile devices? This
    evidence centers on the condition that: A device, identified by its MDM record as part of a specific
    procurement batch, reports one or more hardware or firmware identifiers (e.g., baseband version, build
    number, kernel version, IMEI/MEID) that do not match the values in a pre-approved ''golden manifest''
    for that batch or are statistical outliers when compared to the population of other devices in the
    same batch.'
  context: 'Why this matters: Under the Initial Access tactic (TA0027), an adversary who manipulates hardware
    or firmware before a device reaches the enterprise can implant a stealthy backdoor that yields a high
    degree of control over the fielded Android or iOS device (MITRE ATT&CK T1474.002, Compromise Hardware
    Supply Chain). This evidence focuses on the condition that: A device, identified by its MDM record
    as part of a specific procurement batch, reports one or more hardware or firmware identifiers (e.g.,
    baseband version, build number, kernel version, IMEI/MEID) that do not match the values in a pre-approved
    ''golden manifest'' for that batch or are statistical outliers when compared to the population of
    other devices in the same batch. The ''Validate batch devices against golden manifest'' approach (Symbolic
    Logic) works as follows: Upon receipt of a new procurement batch, create a ''golden manifest'' of
    all expected firmware/hardware identifiers per NIST C-SCRM acquisition controls (authoritative baselines,
    receipt verification against procurement records) ([Cybersecurity Supply Chain Risk Management Practices,
    NIST SP 800-161r1](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-161r1.pdf)).
    Execute a script that queries the MDM API for all devices with the new `procurement_batch_id`, and
    for each device compare reported identifiers (`baseband_version`, `build_number`, `kernel_version`,
    `bootloader_version`) against the manifest and against per-model golden firmware hashes/measurements
    ([Platform Firmware Resiliency Guidelines, NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf)).
    Flag any mismatch for automated quarantine and physical inspection. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable supply-chain tampering on a fielded device;
    pivot to the affected device''s unique identifier and MDM record, resolve it to its procurement batch,
    owner, and asset entry, quarantine the device for physical and firmware inspection, and reconstruct
    the enrollment, attestation, and early-network timeline to scope intent and blast radius. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss a carefully crafted implant that mimics a legitimate
    device posture.'
