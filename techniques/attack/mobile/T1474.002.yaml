    or firmware before a device reaches the enterprise can implant a stealthy backdoor that yields a high
    degree of control over the fielded Android or iOS device (MITRE ATT&CK T1474.002, Compromise Hardware
    Supply Chain). This evidence focuses on the condition that: A mobile device''s attestation report
    indicates a bootloader status of ''unlocked'' or a secure boot integrity check result of ''failed'',
    and the device''s unique identifier does not have a corresponding, authorized entry in the change
    management database for a ticket opened within the last 24 hours or in the registered developer device
    list. The ''Classify malicious attestation failures'' approach (Machine Learning) works as follows:
    Develop and train a supervised classification model, such as a Gradient Boosting Classifier (XGBoost)
    using historical, labeled attestation data; gradient-boosted trees give strong accuracy with ranked
    feature importances suitable for triage ([Comprehensive evaluation of Mal-API-2019 dataset by machine
    learning](https://arxiv.org/abs/2403.02232)). The feature set must include device model, OS version,
    user role, device age, time of day, patch level, number of installed applications, and the boot/attestation
    failure rate. Deploy the model to score new attestation failures in real-time, generating a high-priority
    alert when predicted ''malicious'' probability exceeds 0.90. Every alert must surface the top-3 contributing
    features (e.g., via SHAP attribution) in the alert text rather than a bare score ([Explainable Anomaly
    Detection for Industrial Control System Cybersecurity, Ha et al.](https://arxiv.org/abs/2205.01930)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable supply-chain
    tampering on a fielded device; pivot to the affected device''s unique identifier and MDM record, resolve
