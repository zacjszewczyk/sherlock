- question: '[Initial Access] Enforce hardware-backed attestation field rules: Can you determine, using
    the ''Enforce hardware-backed attestation field rules'' (Symbolic Logic) approach, whether an adversary
    has compromised the hardware supply chain to gain initial access to enrolled mobile devices? This
    evidence centers on the condition that: A mobile device''s attestation report indicates a bootloader
    status of ''unlocked'' or a secure boot integrity check result of ''failed'', and the device''s unique
    identifier does not have a corresponding, authorized entry in the change management database for a
    ticket opened within the last 24 hours or in the registered developer device list.'
  context: 'Why this matters: Under the Initial Access tactic (TA0027), an adversary who manipulates hardware
    or firmware before a device reaches the enterprise can implant a stealthy backdoor that yields a high
    degree of control over the fielded Android or iOS device (MITRE ATT&CK T1474.002, Compromise Hardware
    Supply Chain). This evidence focuses on the condition that: A mobile device''s attestation report
    indicates a bootloader status of ''unlocked'' or a secure boot integrity check result of ''failed'',
    and the device''s unique identifier does not have a corresponding, authorized entry in the change
    management database for a ticket opened within the last 24 hours or in the registered developer device
    list. The ''Enforce hardware-backed attestation field rules'' approach (Symbolic Logic) works as follows:
    At enrollment, require an Android hardware Key Attestation chain ([Verify hardware-backed key pairs
    with key attestation, Android Developers](https://developer.android.com/privacy-and-security/security-key-attestation))
    and reject any device whose `KeyDescription` reports `verifiedBootState != Verified`, `deviceLocked
    == false`, or `attestationSecurityLevel`/`keymasterSecurityLevel` below TrustedEnvironment/StrongBox;
    corroborate with Android Verified Boot state (any ORANGE/RED state, rollback-index violation, or vbmeta
    hash mismatch versus the golden per-model measurement) ([Verified Boot, AOSP](https://source.android.com/docs/security/features/verifiedboot/verified-boot))
    and a server-validated Google Play Integrity verdict below MEETS_DEVICE_INTEGRITY/MEETS_STRONG_INTEGRITY
    ([Overview of the Play Integrity API](https://developer.android.com/google/play/integrity/overview)).
    On iOS, require supervised enrollment with Secure Enclave attestation and fail any device that cannot
    present a signed-boot/attestation posture consistent with its procurement record ([Apple Platform
    Security: Boot process](https://support.apple.com/guide/security/boot-process-secac71d5623/web)).
    Validate the chain against the vendor root and the certificate revocation list before trusting the
    device. A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    supply-chain tampering on a fielded device; pivot to the affected device''s unique identifier and
    MDM record, resolve it to its procurement batch, owner, and asset entry, quarantine the device for
    physical and firmware inspection, and reconstruct the enrollment, attestation, and early-network timeline
    to scope intent and blast radius. A negative result helps rule out this particular vector but should
    be corroborated with the other questions in this playbook, since a single method can miss a carefully
    crafted implant that mimics a legitimate device posture.'
