  context: 'Why this matters: Under the Initial Access tactic (TA0027), an adversary who manipulates hardware
    or firmware before a device reaches the enterprise can implant a stealthy backdoor that yields a high
    degree of control over the fielded Android or iOS device (MITRE ATT&CK T1474.002, Compromise Hardware
    Supply Chain). This evidence focuses on the condition that: A device, identified by its MDM record
    as part of a specific procurement batch, reports one or more hardware or firmware identifiers (e.g.,
    baseband version, build number, kernel version, IMEI/MEID) that do not match the values in a pre-approved
    ''golden manifest'' for that batch or are statistical outliers when compared to the population of
    other devices in the same batch. The ''Flag rare identifier values per batch'' approach (Statistical
    Method) works as follows: For each `procurement_batch_id`, ingest the complete device inventory from
    the MDM and compute the frequency distribution for each key identifier field (`baseband_version`,
    `kernel_version`, `build_number`). Flag any identifier value with prevalence < 1% within the batch
    as a rare, potentially unauthorized configuration requiring investigation; rare/outlier identifiers
    against an otherwise homogeneous batch are the supply-chain analog of recurring/anomalous firmware
    artifacts ([Costin et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf)).
    Derive the prevalence threshold from batch size — for small batches, treat any singleton value (count==1)
    as an outlier ([NIST SP 800-161r1](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-161r1.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable supply-chain
