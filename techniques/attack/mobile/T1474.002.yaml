questions:
- question: '[Initial Access] Alert on attestation failures outside change control: Can you determine,
    using the ''Alert on attestation failures outside change control'' (Symbolic Logic) approach, whether
    an adversary has compromised the hardware supply chain to gain initial access to enrolled mobile devices?
    This evidence centers on the condition that: A mobile device''s attestation report indicates a bootloader
    status of ''unlocked'' or a secure boot integrity check result of ''failed'', and the device''s unique
    identifier does not have a corresponding, authorized entry in the change management database for a
    ticket opened within the last 24 hours or in the registered developer device list.'
  context: 'Why this matters: Under the Initial Access tactic (TA0027), an adversary who manipulates hardware
    or firmware before a device reaches the enterprise can implant a stealthy backdoor that yields a high
    degree of control over the fielded Android or iOS device (MITRE ATT&CK T1474.002, Compromise Hardware
    Supply Chain). This evidence focuses on the condition that: A mobile device''s attestation report
    indicates a bootloader status of ''unlocked'' or a secure boot integrity check result of ''failed'',
    and the device''s unique identifier does not have a corresponding, authorized entry in the change
    management database for a ticket opened within the last 24 hours or in the registered developer device
    list. The ''Alert on attestation failures outside change control'' approach (Symbolic Logic) works
    as follows: Create and enable a SIEM correlation rule that joins MDM device attestation logs in real-time
    with a dynamically updated watchlist of device IDs from the change management database and developer
    device list. The rule must trigger an alert if a log contains `attestation_status: ''failed''` or
    `bootloader_status: ''unlocked''` AND the `device_id` from the log is NOT IN the watchlist. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable supply-chain tampering
    on a fielded device; pivot to the affected device''s unique identifier and MDM record, resolve it
    to its procurement batch, owner, and asset entry, quarantine the device for physical and firmware
    inspection, and reconstruct the enrollment, attestation, and early-network timeline to scope intent
    and blast radius. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss a carefully crafted implant
    that mimics a legitimate device posture.'
