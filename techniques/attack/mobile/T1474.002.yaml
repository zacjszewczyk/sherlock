    for initial device provisioning and operating system updates. The ''Detect high-entropy domains during
    enrollment'' approach (Statistical Method) works as follows: For all DNS queries (`dns.log`) from
    a newly enrolled device within the first 60 minutes, compute the Shannon entropy $$ H(X) = -\sum_{i=1}^{n}
