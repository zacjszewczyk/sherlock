name: 'T1474.002: Compromise Hardware Supply Chain'
id: 1deaf179-5d10-440c-917d-e82c65723efc
description: 'This playbook helps an analyst investigate whether a sophisticated adversary has gained
  initial access to the mobile device fleet by compromising the hardware supply chain (MITRE ATT&CK T1474.002,
  Compromise Hardware Supply Chain). By manipulating hardware components or firmware in products before
  they reach the enterprise, an adversary can implant a difficult-to-detect backdoor that grants a high
  degree of control over Android and iOS devices the moment they are fielded. The hunt pursues this behavior
  from several complementary angles across MDM/management-plane, asset, procurement, and network telemetry:
  detecting devices that present failed verified-boot or unlocked-bootloader attestation outside of authorized
  change control; validating hardware and firmware identifiers (baseband, build, kernel, bootloader, IMEI/MEID)
  of each procurement batch against a pre-approved golden manifest and flagging statistical outliers within
  the batch; and catching newly enrolled devices that beacon to non-allowlisted destinations during the
  initial provisioning window. Detection methods combine deterministic symbolic-logic correlation and
  policy-enforcement rules (attestation/change-control joins, hardware-backed key attestation, golden-manifest
  validation, provisioning egress allow-listing), statistical baselining and rarity scoring (per-cohort
  Z-score outliers, rare-identifier prevalence thresholds, Shannon-entropy DGA screening, volume/frequency
  anomalies), and machine learning (supervised attestation-failure classifiers, density-based and isolation-forest
  outlier clustering of hardware identifiers, and time-series autoencoders for anomalous enrollment traffic),
  so the analyst can corroborate suspected supply-chain compromise against device-integrity, inventory,
  and network context. Source platforms: Android, iOS.'
type: technique
