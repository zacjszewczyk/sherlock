- question: '[Initial Access] Detect spikes in cohort attestation failures: Can you determine, using the
    ''Detect spikes in cohort attestation failures'' (Statistical Method) approach, whether an adversary
    has compromised the hardware supply chain to gain initial access to enrolled mobile devices? This
    evidence centers on the condition that: A mobile device''s attestation report indicates a bootloader
    status of ''unlocked'' or a secure boot integrity check result of ''failed'', and the device''s unique
    identifier does not have a corresponding, authorized entry in the change management database for a
    ticket opened within the last 24 hours or in the registered developer device list.'
  context: 'Why this matters: Under the Initial Access tactic (TA0027), an adversary who manipulates hardware
    or firmware before a device reaches the enterprise can implant a stealthy backdoor that yields a high
    degree of control over the fielded Android or iOS device (MITRE ATT&CK T1474.002, Compromise Hardware
    Supply Chain). This evidence focuses on the condition that: A mobile device''s attestation report
    indicates a bootloader status of ''unlocked'' or a secure boot integrity check result of ''failed'',
    and the device''s unique identifier does not have a corresponding, authorized entry in the change
    management database for a ticket opened within the last 24 hours or in the registered developer device
    list. The ''Detect spikes in cohort attestation failures'' approach (Statistical Method) works as
    follows: Establish a 30-day rolling baseline for each device cohort, defined by `device_model` and
    `os_version`, to determine the mean ($$ \mu $$) and standard deviation ($$ \sigma $$) of daily attestation
    failures, and separately profile the failure RATE (failures per enrollment attempt) as a distinct
    state signal. For each cohort, calculate the current day''s failure count $$ x $$ and trigger an alert
    if the Z-score $$ Z = (x - \mu) / \sigma $$ is greater than 3. This per-cohort outlier screening against
    a clean reference population mirrors multiple-parameter side-channel hardware-Trojan detection, where
    statistical deviation from a golden baseline reveals tampering under process variation ([A Survey
    Report on Hardware Trojan Detection by Multiple-Parameter Side-Channel Analysis, Katte and Fernandez](https://arxiv.org/abs/2307.02012)).
    Derive cohort-specific thresholds from your own MDM history; tune toward Z>3 to start and lower for
    high-value cohorts. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable supply-chain tampering on a fielded device; pivot to the affected device''s unique identifier
    and MDM record, resolve it to its procurement batch, owner, and asset entry, quarantine the device
    for physical and firmware inspection, and reconstruct the enrollment, attestation, and early-network
    timeline to scope intent and blast radius. A negative result helps rule out this particular vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    a carefully crafted implant that mimics a legitimate device posture.'
