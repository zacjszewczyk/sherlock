questions:
- question: Did a corporate mobile device report a jailbreak or root compliance failure in MDM/UEM, and
    within a short window did the same user experience a burst of more than 10 failed logons (Windows
    Event ID 4625) or connect to an IP on a malicious-infrastructure threat feed?
  context: On iOS, reading another application's keychain normally requires a jailbroken device, so an
    MDM/UEM compliance_status of 'non-compliant' with reason 'jailbreak_detected' or 'root_detected' is
    the precondition for Credential Access via Credentials from Password Store (per [Credentials from
    Password Store, T1634, MITRE ATT&CK](https://attack.mitre.org/techniques/T1634/) and [Keychain Data
    Protection, Apple](https://support.apple.com/guide/security/keychain-data-protection-secb0694df1a/web)).
    This symbolic-logic correlation triggers on that compliance event, then queries the affected user's
    authentication activity and alerts if more than 10 failed logons (Event ID 4625) occur within a 5-minute
    window; it also cross-references the device IP from Zeek conn.log against a threat-intelligence feed
    of known-malicious infrastructure. A positive result ties a compromised mobile device directly to
    credential-validation activity; a negative result still warrants review of the jailbreak event alone.
    Treat the >10/5-minute count as a tunable floor.
  answer_sources: &id001
  - MDM/UEM device compliance logs
  - Application Vetting reports
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Windows Event ID 4768
  - Windows Event ID 4769
  - 'NAI: Corporate MDM/UEM management server; Network egress points instrumented with Zeek sensors; VPN
    concentrators; Corporate Wi-Fi Access Point Controllers; Domain Controllers and Authentication Servers;
    Cloud identity provider logs (e.g., Azure AD, Okta).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "jb = mdm_uem(compliance_status='non-compliant' AND reason in ['jailbreak_detected','root_detected']);\n\
      for d in jb:\n  fails = count(win_4625 where user=d.user) over sliding 5m;\n  ti_hit = d.device_ip\
      \ in threat_intel.malicious_ips (join zeek_conn by ip);\n  if fails > 10 or ti_hit: alert(user=d.user,\
      \ device=d.id, fails, ti_hit)\n// tune count/window per environment"
- question: Is a user's or device's current rate of failed logons (Event ID 4625) or Kerberos pre-authentication
    failures (4768/4769 failure codes) statistically anomalous versus its 30-day baseline, especially
    a failure burst that resolves into a single success from a new host or credential?
  context: Credential-store theft is typically followed by credential validation or password spray, which
    shows up first as elevated authentication failures rather than successes. This statistical method
    baselines, per user/device, the 30-day mean and standard deviation of failed logons (4625) and Kerberos
    pre-auth failures (4768/4769 failure codes) per hour, and alerts when the current rate exceeds mean
    + 3 sigma. Following the failure-mode-awareness pattern in [Hopper, Ho et al.](https://www.usenix.org/system/files/sec21-ho.pdf),
    a failed-logon burst that resolves into a single success from a new host or credential is treated
    as high-signal. A positive result indicates active credential testing tied to Credential Access; tune
    sigma per dataset.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline mu,sigma = mean,std of per-hour count(win_4625 + krb_4768/4769 failures) per user
      over 30d;

      rate = current per-hour failure count;

      if rate > mu + 3*sigma: alert(user, rate, mu, sigma);

      // high-signal: burst of 4625 then single 4624 success from new host/credential

      flag if fail_burst followed_by success(new_host or new_cred)'
- question: For a device flagged as jailbroken, did its daily outbound data volume (Zeek conn.log orig_bytes)
    exceed the 95th percentile of its 30-day baseline, or did the affected user log in successfully (Event
    ID 4624) from a country or ASN not seen in the past 90 days?
  context: Credential exfiltration has a measurable volume/physics, and stolen credentials are often first
    used from new origins. This statistical method maintains a 30-day rolling baseline of each flagged
    device's daily outbound bytes (orig_bytes) and alerts when the daily volume exceeds the 95th percentile
    (or mean + 3 sigma). Separately, it baselines the set of source countries and ASNs for the user's
    successful logins (4624) and alerts on any login from a country or ASN unseen in 90 days, consistent
    with new-origin login baselining ([Detecting Structurally Anomalous Logins, Siadati and Memon](https://doi.org/10.1145/3133956.3134003)).
    Positive results indicate exfiltration or anomalous use of stolen credentials under Credential Access;
    derive thresholds per dataset.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'vol_baseline = rolling30d(sum(zeek_conn.orig_bytes) per device per day);

      if today_volume(device) > p95(vol_baseline) or > mu+3*sigma: alert(device, today_volume);

      origins = distinct(country,ASN) of win_4624 per user over 90d;

      if new_login.(country,ASN) not in origins: alert(user, new_login.country, new_login.ASN)'
- question: Within 24 hours of a jailbreak event, did a device exhibit a forecast-breaking spike in per-hour
    outbound bytes or distinct destination counts (Zeek conn.log), or score as anomalous against a one-class
    model trained only on compliant-device traffic?
  context: This machine-learning method deploys time-series anomaly detection (e.g., ARIMA) on per-device,
    per-hour outbound byte counts and distinct destination connection counts from Zeek conn.log, flagging
    significant spikes within 24 hours of a jailbreak as high-risk. As a label-free alternative, an Isolation
    Forest or autoencoder is trained only on compliant-device traffic (per [Malware Detection for IoT
    Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/)) to score egress,
    surfacing the top-3 contributing features (e.g., orig_bytes z-score, new-destination count) in the
    alert. A positive result indicates post-compromise data movement consistent with credential exfiltration
    following Credential Access; explainable feature output speeds analyst triage.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'ts = per_device_per_hour(orig_bytes, distinct_dest_count) from zeek_conn;

      model = ARIMA.fit(ts[compliant_history]);

      if observed > forecast + k*resid_std within 24h of jailbreak: alert(high_risk);

      alt: oc = IsolationForest/autoencoder.fit(compliant_device_traffic);

      if oc.score(device_traffic) anomalous: alert(top3_features)'
- question: What is the per-user credential-compromise risk score produced by a supervised classifier
    combining jailbreak status, outbound-volume anomaly, failed-login count, new-country login, and connection
    entropy, and which features drove the highest scores?
  context: This machine-learning method trains a classifier (e.g., Random Forest/XGBoost) to emit a per-user
    credential-compromise risk score from features such as is_jailbroken (binary), outbound_bytes_zscore_vs_30d_baseline,
    failed_login_count_1hr, is_new_country_login, and connection_entropy_score. Following the [Hopper,
    Ho et al.](https://www.usenix.org/system/files/sec21-ho.pdf) rare-path ranking and tight alert-budget
    approach of Hopper (Ho et al.), the output must include a probability and the top-3 contributing features
    for analyst review. A high score concentrates limited analyst attention on the users most likely subject
    to mobile credential theft under Credential Access, while explainability lets the analyst validate
    or dismiss quickly.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [is_jailbroken, outbound_bytes_zscore_30d, failed_login_count_1hr,\n          \
      \  is_new_country_login, connection_entropy_score];\nmodel = XGBoost/RandomForest.fit(labeled_history);\n\
      score, top3 = model.predict_proba(user_features);\nif score > budgeted_threshold: alert(user, score,\
      \ top3)"
- question: Was an application installed that is absent from the corporate MDM/UEM allowlist (by package
    name and signing-certificate hash), and did the hosting device then connect to a destination IP that
    had no preceding successful DNS resolution within a 5-minute lookback?
  context: 'Credential-harvesting malware often arrives as a non-allowlisted app and then talks directly
    to hardcoded C2 IPs. This symbolic-logic method compares each new app''s package name and signing-certificate
    hash against the corporate allowlist and a threat-intelligence feed of malicious app indicators (allowlisting
    per [Vetting the Security of Mobile Applications, NIST SP 800-163r1](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-163r1.pdf);
    static indicators per [Drebin, Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf):
    suspicious API calls, hardcoded credential/C2 URLs, references to known password-store paths), alerting
    on any non-allowlisted app. For those devices it also alerts when the device IP initiates a Zeek conn.log
    connection to a destination IP with no corresponding successful Zeek dns.log query in the prior 5
    minutes - a strong direct-to-IP C2 signal. A positive result indicates an unsanctioned credential-theft
    tool operating under Credential Access.'
  answer_sources: &id002
  - MDM/UEM application inventory logs
  - Application Vetting reports
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Corporate MDM/UEM management server; Corporate DNS resolvers logging to Zeek; Network egress
    points instrumented with Zeek sensors; Cloud Access Security Broker (CASB) logs; Mobile Application
    Management (MAM) servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for app in mdm_uem.app_inventory:\n  if (app.pkg, app.cert_hash) not in allowlist or in threat_intel.malicious_apps:\n\
      \    alert(unauthorized_app, device=app.device);\nfor c in zeek_conn where device in unauthorized_app_devices:\n\
      \  if not exists(zeek_dns success for c.dest_ip within 5m before c.ts):\n    alert(direct_to_ip_c2,\
      \ device=c.device, dest=c.dest_ip)"
- question: Do devices running unauthorized apps generate DNS queries whose average second-level-domain
    Shannon entropy exceeds 3.5 (DGA-like), or direct-to-IP connection series with inter-arrival time
    standard deviation below 10 seconds over more than 10 events (beaconing)?
  context: DGA-based C2 produces high-entropy domains and beaconing produces highly regular connection
    timing. This statistical method computes the Shannon entropy of requested second-level domains in
    Zeek dns.log over a 1-hour sliding window (stateless lexical features per [Real-Time Detection of
    DNS Exfiltration and Tunneling, Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf))
    and alerts when the average exceeds 3.5. For direct-to-IP connections it computes the standard deviation
    of inter-arrival times to the same destination in Zeek conn.log over 24 hours and alerts when sigma
    < 10 seconds for a series of more than 10 events, applying FFT/periodicity beacon logic ([BAYWATCH,
    Hu et al.](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks)).
    Positive results indicate automated C2 from a credential-harvesting app under Credential Access; keep
    both thresholds as tunable floors.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "ent = avg(shannon_entropy(sld)) over 1h sliding from zeek_dns per device;\nif ent > 3.5: alert(possible_DGA,\
      \ device);\nfor (device,dest) series in zeek_conn direct-to-ip:\n  if count(series) > 10 and std(inter_arrival_time)\
      \ < 10s: alert(beaconing, device, dest)"
- question: Are devices running unauthorized apps producing DNS resolution failures (NXDOMAIN/SERVFAIL)
    or rejected/failed connections (conn_state S0/REJ/RSTO) at a rate exceeding their 7-day baseline mean
    + 3 sigma?
  context: DGA resolution attempts and C2 reconnection produce characteristic failure bursts distinct
    from successful traffic, so failure modes deserve their own baseline. This statistical method profiles,
    per device, the rate of NXDOMAIN/SERVFAIL responses in Zeek dns.log and of failed/rejected connections
    (conn_state S0/REJ/RSTO) in Zeek conn.log, and alerts when either rate exceeds mean + 3 sigma over
    a 7-day baseline ([Real-Time Detection of DNS Exfiltration and Tunneling, Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)).
    A positive result reveals a malicious app cycling through dead C2 domains or unreachable endpoints,
    a behavior of credential-harvesting malware under Credential Access that may precede successful exfiltration.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'dns_fail = rate(zeek_dns.rcode in [NXDOMAIN,SERVFAIL]) per device;

      conn_fail = rate(zeek_conn.conn_state in [S0,REJ,RSTO]) per device;

      baseline mu,sigma over 7d per metric per device;

      if dns_fail > mu+3*sigma or conn_fail > mu+3*sigma: alert(device, metric, rate)'
- question: When a non-allowlisted app is analyzed by a behavior-based classifier (MaMaDroid Markov-chain
    API abstraction or an explainable Drebin linear SVM), is it scored as credential-harvesting or privilege-escalation
    malware?
  context: Static allowlisting misses novel or obfuscated malware, so unvetted apps should be classified
    by behavior. This machine-learning method vets non-allowlisted apps with [MaMaDroid, Onwuzurike et
    al.](https://arxiv.org/abs/1612.04433), which abstracts API call sequences into package/family Markov-chain
    transition probabilities (obfuscation-resilient, F-measure up to 0.99), or the explainable linear
    SVM of [Drebin, Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)
    that surfaces the top contributing features per app. Apps scored as credential-harvesting or privilege-escalation
    malware are routed to immediate response. A positive result confirms the unauthorized app is a credential-theft
    tool operating under Credential Access; explainability lets the analyst justify containment.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for app in non_allowlisted_apps:\n  feats = api_call_sequences(app) -> markov_family_transitions;\
      \ // MaMaDroid\n  verdict = classifier.predict(feats); // or Drebin linear SVM w/ top features\n\
      \  if verdict in [credential_harvesting, privilege_escalation]:\n    route_to_response(app, top_features)"
- question: Does network traffic from devices with unauthorized apps fall into small, distant DBSCAN clusters,
    or produce high reconstruction error against a Kitsune-style autoencoder trained only on compliant-device
    traffic?
  context: Malicious app traffic differs in shape from sanctioned traffic and benefits from unsupervised
    separation. This machine-learning method runs DBSCAN over Zeek conn.log features (protocol, destination_port,
    connection_duration, total_bytes_sent, periodicity_score from inter-arrival variance, dns_query_entropy_score)
    and flags traffic from unauthorized-app devices that lands in small, distant clusters as high-confidence
    anomalies. Alternatively, an online autoencoder ensemble ([Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089),
    [code](https://github.com/ymirsky/Kitsune-py)) is trained on compliant-device traffic only; high reconstruction
    error for an unauthorized-app device indicates anomalous behavior, with per-subspace error decomposition
    surfacing the top-3 driving features. Positive results indicate C2 or exfiltration from a credential-harvesting
    app under Credential Access.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = [protocol, dest_port, conn_duration, total_bytes_sent,\n         periodicity_score,\
      \ dns_query_entropy_score] from zeek_conn;\nclusters = DBSCAN.fit(feats);\nif device in unauthorized\
      \ and cluster is small_and_distant: alert(device, cluster);\nalt: ae = Kitsune.fit(compliant_traffic);\n\
      if ae.recon_error(device_traffic) high: alert(device, top3_subspace_features)"
- question: Did a successful login (Event ID 4624) originate from a source IP that is an anonymizing proxy/TOR
    exit node or commercial VPN for a user whose role does not require such tools, or from two successive
    geolocations implying physically impossible travel?
  context: 'Stolen mobile credentials are frequently reused from anonymizing infrastructure or from improbable
    locations. This symbolic-logic method enriches every successful authentication (Event ID 4624) with
    the source IP''s threat-intelligence reputation from Zeek logs and raises a high-priority alert when
    the IP is on an anonymizer/TOR/commercial-VPN blocklist and the user''s role does not require such
    tools. It layers the velocity-feasibility check ([Detecting Impossible Travel in Login Events, Microsoft
    WO2018085161A1](https://patents.google.com/patent/WO2018085161A1/en)): alert when two successive geolocated
    logins imply a physically impossible travel speed. A positive result strongly suggests the user''s
    credentials were stolen (e.g., from a mobile password store) and are being abused under Credential
    Access.'
  answer_sources: &id003
  - Windows Event ID 4624
  - Zeek conn.log
  - Cloud/SaaS application access logs
  - VPN Logs
  - 'NAI: Domain Controllers; VPN Concentrators; Cloud Identity Providers (e.g., Azure AD, Okta); SaaS
    application platforms (e.g., O365, Salesforce); Network egress points instrumented with Zeek sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for ev in win_4624:\n  ip_rep = enrich(ev.src_ip, threat_intel via zeek);\n  if ip_rep in\
      \ [tor_exit, anonymizer, commercial_vpn] and user.role not in vpn_required:\n    alert(anonymizer_login,\
      \ ev.user, ev.src_ip);\n  if impossible_travel(prev_login(ev.user), ev): alert(impossible_travel,\
      \ ev.user)"
- question: Did a user log in successfully (Event ID 4624) from an ASN or country never before seen in
    their 90-day history (scored by org-wide rarity), or did a 4625 failure burst resolve into a 4624
    success from a new origin?
  context: New-origin logins are a structural signal of compromised credentials. This statistical method
    maintains a 90-day rolling baseline of source ASNs and countries for each user's successful logins
    (correlating 4624 with IP geolocation from Zeek conn.log) and alerts on any login from a never-before-seen
    ASN or country, scoring by how rare that ASN/country is across the organization ([Detecting Structurally
    Anomalous Logins, Siadati and Memon](https://doi.org/10.1145/3133956.3134003)). It pairs this with
    a failed-then-succeeded check (a 4625 burst resolving into a 4624 from a new origin) as a distinct
    failure-mode signal. A positive result indicates likely use of stolen credentials under Credential
    Access; rarity scoring prioritizes the most unusual origins.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = distinct(ASN,country) of win_4624 per user over 90d (join geoip via zeek_conn);\n\
      if login.(ASN,country) not in baseline:\n  alert(user, login.ASN, login.country, rarity=org_freq(login.ASN));\n\
      if fail_burst(4625) resolves_to success(4624 from new origin): alert(failover_to_new_origin, user)"
- question: When login events are modeled as a (source, destination, credential) graph and ranked by rarity,
    which paths switch both the user and the credential - the rare-path pattern of credential theft -
    within the daily alert budget?
  context: 'Credential theft frequently manifests as unusual combinations of source, destination, and
    credential rather than a single bad field. This machine-learning method applies the login-causality
    and rare-path ranking approach of [Hopper, Ho et al.](https://www.usenix.org/system/files/sec21-ho.pdf):
    it builds a graph of (source, destination, credential) login events and scores paths by how unusual
    the combination is, flagging logins that switch both user and credential. It operates within a fixed
    daily alert budget and emits the top-3 contributing path features per alert. A high-ranked path indicates
    probable lateral movement with stolen credentials under Credential Access; the bounded budget keeps
    the analyst queue actionable.'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'graph = build_login_graph(src, dst, credential) from win_4624;

      score = rarity_of_combination(path) per Hopper login-causality;

      rank paths desc by score; take top within daily_alert_budget;

      flag paths where user_switch and credential_switch;

      emit(path, score, top3_features)'
- question: Does a user's login shift their k-means peer-group cluster to a new, distant cluster, or does
    a supervised XGBoost/one-class model score the login as anomalous credential reuse - and what features
    drove the score?
  context: Peer-group and supervised models capture deviations from a user's normal login behavior. This
    machine-learning method trains k-means peer-group clustering on typical login behaviors (source ASNs,
    time-of-day, day-of-week, systems accessed) and flags a login that shifts the user to a new, distant
    cluster. It augments this with a supervised XGBoost classifier trained on labeled history to predict
    credential reuse using features like is_new_ASN_for_user, is_new_country_for_user, time_of_day_zscore,
    failed_login_count_1hr, and is_anonymizer_IP, surfacing the top-3 contributing features in the alert;
    where labels are unavailable, a one-class [Isolation Forest/autoencoder](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/)
    scores logins. A positive result indicates anomalous login behavior consistent with use of stolen
    credentials under Credential Access.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "peer = KMeans.fit(user_login_features[ASN,tod,dow,systems]);\nif login moves user to new_distant_cluster:\
      \ alert(user, cluster_shift);\nfeats = [is_new_ASN_for_user, is_new_country_for_user, time_of_day_zscore,\n\
      \         failed_login_count_1hr, is_anonymizer_IP];\nscore, top3 = XGBoost.predict_proba(feats);\
      \ // or IsolationForest if unlabeled\nif score > threshold: alert(user, score, top3)"
