name: 'T1634: Credentials from Password Store'
id: 67a0f71e-caae-496e-85ff-aed1b4166f85
description: 'Investigate whether an adversary is harvesting credentials from password stores on corporate
  mobile devices (iOS keychain and credential-manager apps) and then leveraging those credentials for
  follow-on access, lateral movement, and data theft. Because reading another application''s keychain
  on iOS generally requires a jailbroken or rooted device, this playbook helps an analyst pivot from MDM/UEM
  compliance and application-vetting telemetry to authentication and network evidence: it correlates jailbreak/root
  non-compliance events with bursts of failed logons (Windows Event ID 4625), Kerberos pre-auth failures
  (4768/4769), and subsequent successful logons (4624) from atypical geolocations, ASNs, or anonymizing
  infrastructure. It also hunts for unauthorized, non-allowlisted applications that exhibit credential-harvesting
  or C2 behavior, including high-entropy/DGA DNS queries, direct-to-IP beaconing with low inter-arrival
  variance, DNS/connection failure bursts, and anomalous outbound data spikes indicative of credential
  exfiltration. Detection methods span symbolic-logic correlation rules, statistical baselining (percentile
  and mean+3-sigma thresholds, new-origin login baselining), and machine learning (time-series forecasting,
  one-class/autoencoder anomaly detection, behavior-based app classification, login-causality rare-path
  ranking, and explainable risk scoring) so an analyst can determine whether mobile-sourced credential
  theft is occurring and is being used to access sensitive resources.'
type: technique
related:
- tactic_id: TA0031
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
