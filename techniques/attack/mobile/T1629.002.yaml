name: 'T1629.002: Device Lockout'
id: c259e155-c32d-4657-a0d1-a1403c6b2a4a
description: Investigate adversary attempts to evade defenses on managed Android mobile devices by locking
  the legitimate user out of the device (MITRE ATT&CK T1629.002, Device Lockout). Attackers typically
  request Device Administrator / Device Owner privileges and then call DevicePolicyManager.lockNow(),
  reset the passcode (only possible for non-owners before Android 7), or simulate a lockout via persistent
  SYSTEM_ALERT_WINDOW overlays, abusive accessibility services, fake call notifications, or foreground-locked
  HTML pages -- behavior characteristic of mobile ransomware and screen-lockers. This playbook helps an
  analyst correlate (1) the acquisition of elevated control paths (device-admin/owner or accessibility
  grants) by suspicious, sideloaded, rare, or blocklisted apps, (2) the invocation of lock-related or
  UI-denial framework operations, and (3) the device transitioning into an unavailable, repeatedly re-locked
  state while the responsible app stays installed. It combines deterministic symbolic-logic rules (blocklist/allowlist
  matching, the post-Android-7 forbidden-passcode-reset floor), statistical baselining (prevalence and
  risk scoring, DNS entropy, anomalous outbound volume, foreground-session duration and input-rate change
  points), and explainable machine-learning models (manifest/System-API classifiers, time-series volume
  anomaly detection, Extended Isolation Forest on session vectors) so the analyst can confirm a lockout,
  identify the offending application, quarantine the device, and scope fleet-wide campaigns.
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Across MDM and Mobile EDR telemetry, did any application that was enabled as Device Administrator,
    Device Owner, or Profile Owner have a package name or signing-certificate hash that matches a threat-intelligence
    blocklist, or is it a non-allowlisted app holding device-admin rights?
  context: For the Defense Evasion tactic, gaining device-admin/owner control is the elevated control
    path that lets malware force a lock state via DevicePolicyManager and lock the user out. Query MDM
    and Mobile EDR for every 'Device Administrator/Owner Enabled' event and join the package name and
    signing-certificate hash against threat-intelligence blocklists and the corporate allowlist; raise
    a high-severity alert for any blocklist match or any non-allowlisted app that holds device-admin.
    System-API package usage (DevicePolicyManager, KeyguardManager) is an obfuscation-resilient, explainable
    indicator of locker behavior ([R-PackDroid](https://arxiv.org/abs/1805.09563)), and admin/permission
    manifest features are core [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)
    flags. A positive match means an untrusted app already holds the privilege required to lock the device
    and should be quarantined; a clean result across the fleet reduces, but does not eliminate, suspicion
    because admin grants alone are not benign on unmanaged apps.
  answer_sources:
  - MDM application inventory and event logs
  - Mobile EDR process and permission grant logs
  - Android Logcat
  - Mobile Application Vetting Scans
  - 'NAI: Corporate-managed mobile devices; Mobile Device Management (MDM) servers; Application Vetting
    and Sandboxing Environments; Enterprise Application Stores'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'mdm_edr_events

      | where event == "DeviceAdminOwnerEnabled"

      | lookup ti_blocklist on package_name, signing_cert_hash

      | lookup corp_allowlist on package_name

      | where ti_blocklist.match == true or corp_allowlist.match == false

      | set severity = "high"

      | action alert(device_id, package_name), quarantine(device_id)'
- question: Did any non-owner application invoke DevicePolicyManager.resetPassword / resetPasswordToken,
    or call lockNow() immediately after being granted admin rights -- behavior that is forbidden or highly
    suspicious under the post-Android-7 passcode-reset restriction?
  context: This is the deterministic floor for the Defense Evasion tactic. Since Android 7 only device
    or profile owners (e.g., MDMs) may reset the device passcode ([NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf)),
    so ANY non-owner app calling resetPassword/resetPasswordToken is malicious by definition. Likewise,
    an app that calls lockNow() in the same session it gains admin rights is exhibiting the classic screen-locker
    kill chain. Alert on these regardless of any ML score -- they are a hard rule that must never be suppressed
    by probabilistic models. A positive result is near-certain evidence of a lockout attempt and should
    trigger immediate device isolation and safe-mode remediation guidance; absence of these calls does
    not clear the device, only this particular technique.
  answer_sources:
  - MDM application inventory and event logs
  - Mobile EDR process and permission grant logs
  - Android Logcat
  - Mobile Application Vetting Scans
  - 'NAI: Corporate-managed mobile devices; Mobile Device Management (MDM) servers; Application Vetting
    and Sandboxing Environments; Enterprise Application Stores'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "os_api_telemetry\n| where api in (\"DevicePolicyManager.resetPassword\",\n               \
      \ \"DevicePolicyManager.resetPasswordToken\")\n    and caller.is_device_or_profile_owner == false\n\
      | OR (api == \"DevicePolicyManager.lockNow\"\n      and time_since(caller.admin_grant_ts) < 60s)\n\
      | set severity = \"critical\", verdict = \"malicious\"\n| action isolate(device_id), advise_safe_mode_uninstall(package_name)"
- question: For each Device Administrator/Owner enable event, does an additive risk score (non-allowlisted
    app, unknown/sideloaded install source, rare fleet prevalence below the 5th percentile, self-signed
    certificate, accessibility service enabled in the same session) exceed the fleet-tuned threshold,
    and are there repeated failed admin-enable prompts?
  context: 'For the Defense Evasion tactic, rare and sideloaded apps that suddenly acquire device-admin
    are far more likely to be lockers than common store-vetted apps. For every ''Device Administrator/Owner
    Enabled'' event, compute an additive risk score: +1 if the package is not on the approved allowlist;
    +1 if the install source is unknown/sideloaded; +1 if the fleet-wide install count is below the 5th
    percentile ([AndroZoo](https://orbilu.uni.lu/bitstream/10993/27396/1/androzoo.pdf)-style prevalence);
    +1 if the signing cert is self-signed; +1 if an accessibility service was enabled in the same session.
    Alert when the cumulative score exceeds a fleet-tuned threshold (start at >1). Separately profile
    the FAILURE signal: count failed admin-enable prompts and repeated permission re-requests as a distinct
    escalation indicator, since lockers often nag the user repeatedly. A high score prioritizes the app
    for triage; a low score with common prevalence lowers urgency.'
  answer_sources:
  - MDM application inventory and event logs
  - Mobile EDR process and permission grant logs
  - Android Logcat
  - Mobile Application Vetting Scans
  - 'NAI: Corporate-managed mobile devices; Mobile Device Management (MDM) servers; Application Vetting
    and Sandboxing Environments; Enterprise Application Stores'
  range: Last 90 days, prevalence computed over the full managed fleet inventory.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for e in admin_enable_events:\n  score  = 0\n  score += 1 if e.package not in allowlist\n\
      \  score += 1 if e.install_source in (\"unknown\",\"sideloaded\")\n  score += 1 if fleet_install_count(e.package)\
      \ < pct(5, fleet_inventory)\n  score += 1 if e.signing_cert.self_signed\n  score += 1 if accessibility_enabled_same_session(e)\n\
      \  if score > threshold(fleet_tuned, start=1): alert(\"high\", e, score)\n# failure-mode signal\n\
      if count(failed_admin_prompts | repeated_permission_requests) by package > N:\n  alert(\"escalation:\
      \ repeated admin/permission nagging\", package)"
- question: Does an explainable supervised classifier (linear SVM / logistic regression / gradient boosting)
    over manifest and System-API features score an app requesting Device Administrator rights as malicious
    above 0.85, and what are the top-3 contributing features?
  context: To catch lockers that evade simple blocklists during Defense Evasion, apply an explainable
    supervised classifier over manifest + System-API features to score apps requesting device-admin. Features
    include install source (one-hot), the time delta from install to admin-grant, the count of other dangerous
    permissions, presence of SYSTEM_ALERT_WINDOW/accessibility, app age on public stores, self-signed
    cert, and System-API package usage (e.g., DevicePolicyManager, KeyguardManager). Flag predicted malice
    probability above 0.85 and ALWAYS surface the top-3 contributing features (e.g., device-admin grant,
    lock-API package usage, sideload source) via SHAP/LIME ([XAI and Android Malware Models](https://arxiv.org/abs/2411.16817))
    -- [R-PackDroid](https://arxiv.org/abs/1805.09563) and [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)
    provide explainable System-API and linear-weight attribution. Use time-aware train/test splits to
    avoid drift-inflated metrics ([Deep Learning for Android Malware Defenses SLR](https://arxiv.org/abs/2103.05292)).
    A high-confidence prediction with explanatory features gives the analyst a defensible lead; a low
    score reduces but does not eliminate concern, and the deterministic floor rules still apply.
  answer_sources:
  - MDM application inventory and event logs
  - Mobile EDR process and permission grant logs
  - Android Logcat
  - Mobile Application Vetting Scans
  - 'NAI: Corporate-managed mobile devices; Mobile Device Management (MDM) servers; Application Vetting
    and Sandboxing Environments; Enterprise Application Stores'
  range: Last 90 days; model trained with time-aware splits on labeled corpora.
  queries:
  - technology: SIEM/ML pseudocode
    query: "for app in apps_requesting_device_admin:\n  f = features(install_source_onehot, install_to_admin_delta,\n\
      \               dangerous_perm_count, has_system_alert_window,\n               has_accessibility,\
      \ public_store_age, self_signed,\n               system_api_package_usage)\n  p = classifier.predict_proba(f)\
      \   # linear SVM / logreg / GBT\n  if p_malicious > 0.85:\n    alert(\"high\", app, top3=shap_top3(f))"
- question: Did any app holding Device Administrator or SYSTEM_ALERT_WINDOW permissions communicate with
    a destination IP or domain that appears on an active threat-intelligence blocklist?
  context: Lockers used for Defense Evasion frequently beacon to command-and-control or exfiltrate before/after
    locking the device. Correlate MDM logs (devices with privileged apps) with network logs (Zeek conn.log)
    on source IP and timestamp, and raise a high-severity alert when an app holding Device Administrator
    or SYSTEM_ALERT_WINDOW contacts a destination IP/domain on an active threat-intelligence blocklist.
    Relating the flagged app to its API and infrastructure neighbors improves robustness ([AiDroid](https://arxiv.org/abs/1811.01027)
    heterogeneous graph), and runtime data-flow instrumentation ([TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf))
    can tie a lock event to its exfiltration. A positive correlation links a privileged, lock-capable
    app to known-malicious infrastructure and strongly supports quarantine; a clean network footprint
    lowers but does not eliminate suspicion.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile EDR Network Flow Logs
  - MDM Application Inventory Logs
  - 'NAI: Our organization''s internet gateway; Corporate DNS resolvers; Network proxies; VPN Concentrators'
  range: Last 90 days, correlate network events within +/- the device's privileged-app activity window.
  queries:
  - technology: Zeek/pseudocode
    query: "privileged = mdm_devices where app.perm in (\"DEVICE_ADMIN\",\"SYSTEM_ALERT_WINDOW\")\njoin\
      \ conn.log on (privileged.device_ip == conn.id.orig_h)\n  within privileged.activity_window\n| lookup\
      \ ti_blocklist on conn.id.resp_h, dns_name\n| where ti_blocklist.match == true\n| set severity =\
      \ \"high\"\n| action alert(device_id, app, conn.id.resp_h)"
- question: From DNS logs, did a privileged app query a domain whose character-level Shannon entropy exceeds
    the 98th percentile of fleet lookups (possible DGA), or generate a spike of NXDOMAIN / refused-TCP
    (S0/REJ) connections concurrent with a lock event?
  context: 'High-entropy domain names suggest domain-generation-algorithm C2, and a burst of failed connections
    concurrent with a lock event is a distinct failure-mode signal of a locker attempting to reach its
    infrastructure during Defense Evasion. From Zeek dns.log, compute Shannon entropy for queried domains,
    baseline per privileged app over 30 days, and alert when a new domain exceeds the 98th-percentile
    entropy. Separately profile the FAILURE signal: a spike in NXDOMAIN responses or refused/blocked TCP
    connections (conn.log history ''S0''/''REJ'') from a privileged app concurrent with a lock event.
    Tune percentiles per fleet from history. A high-entropy domain or a failed-connection burst tied to
    a lockout strengthens the case for active C2; normal entropy and connection success reduce concern.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile EDR Network Flow Logs
  - MDM Application Inventory Logs
  - 'NAI: Our organization''s internet gateway; Corporate DNS resolvers; Network proxies; VPN Concentrators'
  range: Last 90 days with a 30-day per-app baseline; correlate failures within the lock-event window.
  queries:
  - technology: Zeek/pseudocode
    query: "baseline = pct(98, shannon_entropy(dns.log.query) by app over 30d)\nfor q in dns.log where\
      \ app in privileged_apps:\n  if shannon_entropy(q.query) > baseline: alert(\"possible DGA\", app,\
      \ q.query)\n# failure-mode signal\nfails = count(dns.log.rcode==NXDOMAIN)\n      + count(conn.log.conn_state\
      \ in (\"S0\",\"REJ\"))\n        by app, 1h_window\nif fails spikes concurrent_with lock_event: alert(\"\
      failed-conn burst at lockout\", app)"
- question: For each app/user pair, does a seasonal time-series anomaly detector flag the hourly outbound
    byte volume as more than three standard deviations above the app's 30-day baseline?
  context: A surge in outbound data from a privileged app can indicate exfiltration accompanying a lockout
    during Defense Evasion. For each app/user pair, model hourly outbound orig_bytes (Zeek conn.log) with
    a seasonal time-series anomaly detector (Seasonal-ARIMA or change-point detection, [A Survey of Methods
    for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)) trained
    on >=30 days, and flag hourly volumes scored anomalous (e.g., >3 sigma above baseline), reporting
    the deviation magnitude and baseline in the alert. Combine flow features with behavioral models robust
    to obfuscation, such as Markov-chain API abstraction ([MaMaDroid](https://arxiv.org/abs/1612.04433)).
    A flagged volume anomaly that coincides with a lock event points to data theft tied to the lockout;
    volumes within baseline lower the priority of that app.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile EDR Network Flow Logs
  - MDM Application Inventory Logs
  - 'NAI: Our organization''s internet gateway; Corporate DNS resolvers; Network proxies; VPN Concentrators'
  range: Last 90 days; hourly volume modeled against a rolling >=30-day baseline.
  queries:
  - technology: SIEM/ML pseudocode
    query: "for (app,user) in privileged_pairs:\n  ts = hourly_sum(conn.log.orig_bytes) by (app,user)\
      \ over >=30d\n  model = SeasonalARIMA().fit(ts)          # or change-point detector\n  for h in\
      \ recent_hours:\n    if anomaly_score(model, ts[h]) high or ts[h] > mean+3*sd:\n      alert(\"anomalous\
      \ egress\", app, user, deviation=ts[h]-baseline)"
- question: Did any app installed from an unknown source have a manifest requesting SYSTEM_ALERT_WINDOW
    together with BIND_DEVICE_ADMIN or BIND_ACCESSIBILITY_SERVICE -- the privilege combination required
    for overlay/accessibility-driven lockout?
  context: For the Defense Evasion tactic, the combination of overlay (SYSTEM_ALERT_WINDOW) plus device-admin
    or accessibility binding is exactly what malware needs to draw a persistent lock screen or hijack
    UI navigation. Join application-vetting sandbox results with MDM logs and trigger a high-priority
    alert when an app installed from an unknown source (MDM) has a manifest (vetting scan) requesting
    SYSTEM_ALERT_WINDOW AND either BIND_DEVICE_ADMIN or BIND_ACCESSIBILITY_SERVICE -- consistent with
    the manifest/permission indicators in [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)
    and the enterprise app-vetting guidance in [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf).
    A positive match flags an unvetted app with full lockout capability and should be blocked/quarantined
    before it is used; store-vetted apps with a single benign overlay use are lower risk.
  answer_sources:
  - Mobile Application Vetting Scans
  - Mobile EDR Process and Activity Logs
  - Android Logcat
  - MDM Application Installation Logs
  - 'NAI: Application sandboxing environments; Corporate-managed mobile devices; Enterprise app stores
    and repositories; Mobile Endpoint Detection and Response (EDR) platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "vetting_scan\n| join mdm_inventory on package_name\n| where mdm_inventory.install_source ==\
      \ \"unknown\"\n  and manifest.has(\"SYSTEM_ALERT_WINDOW\")\n  and (manifest.has(\"BIND_DEVICE_ADMIN\"\
      )\n       or manifest.has(\"BIND_ACCESSIBILITY_SERVICE\"))\n| set severity = \"high\"\n| action\
      \ alert(package_name, device_id), block_app(package_name)"
- question: Did an app with SYSTEM_ALERT_WINDOW or an accessibility service stay the active foreground
    process for longer than the 98th percentile of its historical sessions with zero user-input events,
    and did the successful-unlock / input rate drop abruptly (change point)?
  context: A lockout manifests as a single app holding the foreground continuously with no taps/swipes
    while the user can no longer unlock the device -- a clear Defense Evasion signature. From Mobile EDR
    activity logs, build a rolling 30-day per-app, per-user baseline of foreground session duration and
    resource use ([Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x) behavioral
    framework). Alert when a session for an app with SYSTEM_ALERT_WINDOW/accessibility exceeds the 98th-percentile
    duration AND has zero user-input events. Apply change-point detection ([Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/))
    to flag the abrupt, sustained drop in successful-unlock and input rate that marks lockout onset, and
    count repeated re-lock events as the failure-mode signal. A long, input-free foreground session combined
    with a collapse in unlock rate is strong evidence of an active lockout; normal session lengths with
    steady input indicate the user retains control.
  answer_sources:
  - Mobile Application Vetting Scans
  - Mobile EDR Process and Activity Logs
  - Android Logcat
  - MDM Application Installation Logs
  - 'NAI: Application sandboxing environments; Corporate-managed mobile devices; Enterprise app stores
    and repositories; Mobile Endpoint Detection and Response (EDR) platform'
  range: Last 90 days with a rolling 30-day per-app/per-user baseline; change-point at suspected lockout
    onset.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = pct(98, foreground_session_duration) by (app,user) over 30d\nfor s in foreground_sessions\
      \ where app.perm in (\"SYSTEM_ALERT_WINDOW\",\"ACCESSIBILITY\"):\n  if s.duration > baseline and\
      \ s.user_input_events == 0:\n    alert(\"anomalous input-free foreground session\", app, user)\n\
      # onset + failure-mode signals\ncp = change_point(unlock_rate, input_rate) by device\nif cp shows\
      \ abrupt sustained drop or count(re_lock_events) high:\n  alert(\"lockout onset / repeated re-lock\"\
      , device)"
- question: Does an unsupervised Extended Isolation Forest trained on benign per-session feature vectors
    (duration, CPU, memory, wakelock, network bytes, user-input count) score a foreground session in the
    top 1% of anomaly scores, and what features drive it?
  context: 'To catch lockout sessions that evade fixed thresholds during Defense Evasion, train an unsupervised
    [Extended Isolation Forest](https://arxiv.org/abs/1811.02141) on benign per-session feature vectors
    from Mobile EDR: session duration, CPU usage, memory, wakelock held, network bytes sent/received,
    and user-input count. Score each session and flag the top 1% anomaly scores as potential device lockout,
    surfacing the top-3 contributing features (e.g., long duration + high wakelock + zero input) for explainability
    ([XAI and Android Malware Models](https://arxiv.org/abs/2411.16817); [eif](https://github.com/sahandha/eif)
    implementation). Validate with realistic base rates and time-aware splits ([Deep Learning for Android
    Malware Defenses SLR](https://arxiv.org/abs/2103.05292)). A top-1% session whose drivers are long
    duration, sustained wakelock, and zero input is a high-confidence lockout candidate for Tier-2 review;
    sessions near the benign cluster are deprioritized.'
  answer_sources:
  - Mobile Application Vetting Scans
  - Mobile EDR Process and Activity Logs
  - Android Logcat
  - MDM Application Installation Logs
  - 'NAI: Application sandboxing environments; Corporate-managed mobile devices; Enterprise app stores
    and repositories; Mobile Endpoint Detection and Response (EDR) platform'
  range: Last 90 days; model trained on benign sessions with time-aware splits, scored against current
    fleet.
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = per_session_vectors(duration, cpu, memory, wakelock_held,\n                        net_bytes_sent,\
      \ net_bytes_recv, user_input_count)\nmodel = ExtendedIsolationForest().fit(benign_sessions)\nscores\
      \ = model.anomaly_score(X)\nfor s in sessions where scores[s] in top_1_percent:\n  alert(\"potential\
      \ device lockout\", s, top3=feature_contributions(s))"
