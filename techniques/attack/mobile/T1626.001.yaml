questions:
- question: '[Privilege Escalation] Alert on non-allowlisted device admin requests: have you determined
    whether "alert on non-allowlisted device admin requests" is warranted on managed Android mobile devices,
    using the Symbolic Logic approach described, to answer the intelligence requirement — Has an adversary
    illegitimately gained Device Administrator permissions on a corporate mobile device? (PIR)'
  context: 'Tactic relevance (Privilege Escalation): Has an adversary illegitimately gained Device Administrator
    permissions on a corporate mobile device? (PIR) This question operationalizes a Symbolic Logic detection
    for MITRE ATT&CK T1626.001 (Device Administrator Permissions) on Android. Parse AndroidManifest.xml
    for the `android.permission.BIND_DEVICE_ADMIN` permission plus a `DeviceAdminReceiver` and device-admin
    policy XML, then alert when package_name or signing_certificate SHA-256 is not in the approved device-admin
    allow-list. These are the exact strings/components that gate the API ([Device Administration Overview](https://developer.android.com/guide/topics/admin/device-admin);
    [MITRE T1626.001](https://attack.mitre.org/techniques/T1626/001/)). A positive result indicates an
    application has illegitimately acquired or is exercising Device Administrator privileges — e.g., a
    non-allowlisted admin grant, a privileged DevicePolicyManager action without genuine user consent,
    or an automated input sequence that bypasses the approval prompt — which is a strong privilege-escalation
    signal that can precede device wipe, password reset, camera disablement, or uninstall prevention;
    a negative result reduces but does not eliminate suspicion, so corroborate with the other questions
    in this playbook (admin capability declared -> grant/activation -> privileged action / network callback).'
  answer_sources:
  - Static APK Analysis Result (AndroidManifest.xml)
  - MAM Application Inventory Record
  - Device admin application allow-list
  - Static taint-analysis result (sink reachability)
  - AV multi-engine verdict / prevalence (e.g., AndroZoo-style)
  - 'NAI: Corporate application repository and vetting sandbox; Mobile Application Management (MAM) and
    Mobile Threat Defense (MTD) platforms; Security data lake or SIEM platform hosting the allow-list
    and correlation engine.'
  range: Last 90 days
  queries:
  - technology: StaticAnalysis/pseudocode
    query: "parse AndroidManifest.xml for app in vetting_pipeline\n| flag if uses-permission == \"android.permission.BIND_DEVICE_ADMIN\"\
      \n        AND has(DeviceAdminReceiver) AND has(device_admin_policy_xml)\n| lookup DeviceAdminAllowlist\
      \ package_name, signing_cert_sha256 OUTPUT approved\n| where isnull(approved)\n| eval severity=\"\
      high\"\n| table package_name, signing_cert_sha256, source"
