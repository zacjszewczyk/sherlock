name: 'T1626.001: Device Administrator Permissions'
id: 901c7326-0af6-409c-99df-213e8836720f
description: 'This playbook helps an analyst investigate MITRE ATT&CK T1626.001 (Device Administrator
  Permissions) on managed Android mobile devices, where an adversary abuses Android''s device administration
  API to obtain elevated control over a device. By becoming a Device Administrator an app can reset the
  device password (Endpoint Denial of Service), factory-reset the device (File Deletion to wipe forensic
  traces), disable cameras, enforce policy, or make itself difficult to uninstall. Normally a user must
  approve the admin request through a system prompt, but in conjunction with Input Injection an app can
  programmatically grant itself administrator rights without genuine user consent. This playbook supports
  the Privilege Escalation mission question by chaining static and dynamic evidence: applications that
  declare android.permission.BIND_DEVICE_ADMIN and a DeviceAdminReceiver while absent from the approved
  admin allow-list, privileged DevicePolicyManager sinks (resetPassword, wipeData, lockNow, setCameraDisabled)
  reachable without user interaction, anomalous package entropy and low permission-set similarity, rare
  app/certificate prevalence and AV consensus, DeviceAdminEnabled events correlated with first-seen or
  threat-intel network destinations, and bursts of automated synthetic touch events immediately preceding
  an admin-activation event. The questions combine deterministic allow-list / threat-intel symbolic logic,
  statistical baselining (prevalence, entropy, Jaccard/Markov similarity, modified Z-scores, touch-frequency
  and coordinate-variance percentiles), and machine-learning detectors (explainable APK classifiers, autoencoders,
  HIN DNNs, LSTM/GRU/Transformer sequence models) across MobileEDR, MDM/MTD audit logs, Android logcat,
  and Zeek network telemetry.'
type: technique
