name: 'T1458: Replication Through Removable Media'
id: 96491754-fd7b-4645-8cba-527cf802bd1f
description: Investigate adversary replication through removable media on mobile devices via physical
  USB connections, covering both initial access (exploiting or extracting data from a device connected
  to a malicious charging station or PC) and lateral movement (using a compromised mobile device or host
  PC as a pivot to install malware, scan, or move onto corporate workstations). This playbook helps an
  analyst correlate concrete USB device-attach events on Windows hosts with the execution of mobile-interaction
  tooling (adb.exe, fastboot.exe, ideviceinstaller.exe, AppleMobileDeviceService.exe), anomalous command-line
  entropy and arguments, low-reputation network connections, and bursts of suspicious DNS activity. It
  also covers USB-linked file creation and execution of unsigned or rare binaries, internal network scanning
  bursts that follow a connection, and mobile-side telemetry from MDM/UEM and Mobile EDR where Android
  enables USB debugging or changes USB mode, or iOS establishes a new trusted-computer pairing or Developer
  Mode, followed by non-store app installs, adb file replication, sideloads, or privileged device-service/backup
  interaction. Detection methods span deterministic symbolic-logic correlations, statistical baselining/change-point
  detection, and machine-learning models (Isolation Forest, EMBER/LightGBM, Drebin, MaMaDroid, DeepLog,
  Hopper).
type: technique
related:
- tactic_id: TA0027
  tactic_name: Initial Access
- tactic_id: TA0033
  tactic_name: Lateral Movement
