questions:
- question: After a USB device attaches to a Windows host, did a known mobile-interaction tool (adb.exe,
    fastboot.exe, ideviceinstaller.exe, AppleMobileDeviceService.exe) run unsigned, from a non-standard
    path, or immediately reach out to a threat-intel destination within five minutes of the attach?
  context: 'Adversaries performing juice-jacking or USB-borne initial access need a host-side tool to
    talk to the phone. Anchor on a concrete device-attach event (Windows Plug-and-Play Event ID 6416,
    the phone entering MTP/accessory mode) and allow-list known devices by VID/PID/serial, then correlate
    the attach with process creation (Event ID 4688 / Sysmon 1) within a 5-minute window. A positive result
    is a watchlist tool that is unsigned, launched from a user-writable or unusual directory, or that
    initiates a connection to a known-bad destination shortly after an unexpected device attaches - a
    strong signal of malicious USB tooling rather than benign device management. Tie this to Initial Access:
    it identifies the very first foothold attempt over the physical port.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Windows-DriverFrameworks-UserMode/Operational Event ID 2003
  - 'NAI: Endpoints with USB ports (corporate workstations, employee laptops, IT helpdesk workstations),
    public charging kiosks within corporate facilities, DNS servers, network gateways, VPN concentrators,
    and Mobile Device Management (MDM) servers.'
  range: Last 90 days, correlated to USB attach events within a 5-minute window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: attach = events(EventID=6416 OR usb_mode IN ['MTP','accessory']); proc = events(EventID=4688
      OR Sysmon=1) WHERE image IN watchlist(adb.exe,fastboot.exe,ideviceinstaller.exe,AppleMobileDeviceService.exe);
      JOIN attach,proc ON host WHERE proc.time - attach.time <= 5min AND device NOT IN allowlist(vid/pid/serial);
      ALERT where proc.signed=false OR proc.path NOT IN standard_paths OR proc.dest IN threat_intel.
- question: After a USB attach, does the command line of a watchlist mobile-interaction process show entropy
    above the 98th percentile or an argument count more than three standard deviations from its 30-day
    baseline, or an abrupt change-point in per-host connect/process rate?
  context: Malicious USB tooling is frequently driven with obfuscated or heavily-parameterized command
    lines that differ from routine device management. Maintain a 30-day baseline of command-line Shannon
    entropy and argument counts for each watchlist process, and after each USB connect compare observed
    values against the 98th-percentile entropy band and a 3-sigma argument-count band. Complement fixed
    bands with CUSUM or Bayesian online change-point detection to catch abrupt step-changes in the host's
    connect rate or post-connect process volume. A positive result flags a host whose USB-tool usage suddenly
    deviates from its own history, helping detect a freshly weaponized workstation used for Initial Access
    over the physical port.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Windows-DriverFrameworks-UserMode/Operational Event ID 2003
  - 'NAI: Endpoints with USB ports (corporate workstations, employee laptops, IT helpdesk workstations),
    public charging kiosks within corporate facilities, DNS servers, network gateways, VPN concentrators,
    and Mobile Device Management (MDM) servers.'
  range: Last 90 days with a rolling 30-day baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = rolling_30d(entropy(cmdline), argcount) PER process IN watchlist; after attach:
      ALERT where entropy(cmdline) > p98(baseline.entropy) OR abs(argcount - mean) > 3*std(baseline.argcount);
      ALSO cusum/bayesian_changepoint(per_host_connect_rate, post_connect_process_volume) -> ALERT on
      step-change.'
- question: Do network connections originating from watchlist mobile-interaction processes within five
    minutes of a USB attach appear anomalous when scored by an unsupervised model over destination, protocol,
    volume, geo, and timing features?
  context: Beyond simple reputation matching, the shape of a connection (rare destination port, unusual
    ASN/geolocation, atypical bytes/duration, and short time-since-USB-connect) can reveal C2 or exfiltration
    even to never-before-seen infrastructure. Train an Extended Isolation Forest on historical network
    connections from watchlist processes and score new post-attach connections, alerting within the 5-minute
    USB window. Surface the top-3 contributing features (per-feature attribution) in the alert so an analyst
    can quickly understand why a connection was flagged. A positive result is an outlier connection tightly
    coupled to a USB event - a likely indicator of adversary callout during Initial Access.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Windows-DriverFrameworks-UserMode/Operational Event ID 2003
  - 'NAI: Endpoints with USB ports (corporate workstations, employee laptops, IT helpdesk workstations),
    public charging kiosks within corporate facilities, DNS servers, network gateways, VPN concentrators,
    and Mobile Device Management (MDM) servers.'
  range: Last 90 days, scored within a 5-minute window of USB attach events.
  queries:
  - technology: SIEM/ML pseudocode
    query: model = ExtendedIsolationForest.fit(conn_from_watchlist_procs[dest_port,proto,bytes,duration,asn,geo,time_since_usb]);
      score = model.anomaly(new_conn) WHERE new_conn.time - attach.time <= 5min; ALERT where score > threshold;
      OUTPUT top3_feature_attribution.
- question: Within five minutes of a mobile device USB attach, did the host issue DNS queries that match
    known malicious C2, DGA, or phishing feeds - especially from a watchlist process?
  context: A compromised charging station or implant often triggers name resolution to attacker infrastructure
    immediately after connecting. Correlate the USB attach (Event ID 6416 / Sigma external-device rule)
    with DNS queries from the same host inside a 5-minute window, then match queried domains against curated
    malicious C2/DGA/phishing threat feeds. Give extra weight to queries originating from watchlist mobile-interaction
    processes. A positive result deterministically ties name resolution of known-bad domains to a physical-connection
    event, a clear Initial Access indicator that the device or host is reaching out to adversary-controlled
    infrastructure.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Sysmon Event ID 22
  - Windows-DriverFrameworks-UserMode/Operational Event ID 2003
  - 'NAI: Corporate workstations, guest network segments, internet gateway, recursive DNS resolvers, corporate
    DNS servers, and Endpoint Detection and Response (EDR) logs.'
  range: Last 90 days, correlated within a 5-minute window of USB attach events.
  queries:
  - technology: SIEM/Rule pseudocode
    query: attach = events(EventID=6416); dns = events(Sysmon=22 OR zeek.dns) WHERE host=attach.host AND
      dns.time-attach.time<=5min; ALERT where dns.query IN feeds(c2,dga,phishing); ESCALATE where dns.proc
      IN watchlist.
- question: After a USB attach, does the host's DNS activity exceed three standard deviations (or the
    99th percentile) for unique unseen-domain count, domain-label entropy, or rare-TLD ratio, and is the
    NXDOMAIN failure rate spiking?
  context: DGA-based malware delivered over USB generates bursts of algorithmically-named domains, many
    of which fail to resolve. Maintain a 30-day per-host baseline of unique domain counts, average Shannon
    entropy of domain labels, and the ratio of rare TLDs (.xyz, .club) to common TLDs, using stateless
    lexical/behavioral features (entropy, length, unique-subdomain and request-rate per registered domain).
    After a USB connect, alert when post-attach DNS exceeds a 3-sigma or 99th-percentile threshold for
    entropy/TLD ratios, and profile the NXDOMAIN failure rate as an independent signal - a spike in failed
    resolutions strongly indicates DGA beaconing. A positive result marks a host that began algorithmic
    name generation right after a physical connection, consistent with Initial Access malware.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Sysmon Event ID 22
  - Windows-DriverFrameworks-UserMode/Operational Event ID 2003
  - 'NAI: Corporate workstations, guest network segments, internet gateway, recursive DNS resolvers, corporate
    DNS servers, and Endpoint Detection and Response (EDR) logs.'
  range: Last 90 days with a rolling 30-day per-host baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = rolling_30d(unique_domains, label_entropy, rare_tld_ratio, nxdomain_rate) PER host;
      after attach: ALERT where unique_unseen_domains > mean+3*std OR label_entropy > p99 OR rare_tld_ratio
      > p99 OR nxdomain_rate > baseline_spike.'
- question: When an Isolation Forest is trained on legitimate DNS traffic, do post-USB-attach queries
    surface as outliers, and do those outliers cluster together within five minutes of the connection?
  context: Subtle DGA or covert-channel DNS may not trip fixed thresholds but still deviate from learned-normal
    behavior. Train an Isolation Forest on legitimate DNS traffic using features such as query length,
    subdomain count, TLD, label entropy, query type, request rate, and initiating process. Score new queries
    within five minutes of USB events and prioritize clustered anomalies (many outliers from one host
    in a short window), surfacing the top-3 contributing features in the alert. A positive result is a
    tight cluster of anomalous resolutions immediately following a USB attach - evidence of Initial Access
    malware establishing communications.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Sysmon Event ID 22
  - Windows-DriverFrameworks-UserMode/Operational Event ID 2003
  - 'NAI: Corporate workstations, guest network segments, internet gateway, recursive DNS resolvers, corporate
    DNS servers, and Endpoint Detection and Response (EDR) logs.'
  range: Last 90 days, scored within a 5-minute window of USB attach events.
  queries:
  - technology: SIEM/ML pseudocode
    query: model = IsolationForest.fit(dns[query_len,subdomain_count,tld,entropy,qtype,request_rate,proc]);
      score = model.anomaly(post_usb_dns) WHERE time-attach.time<=5min; ALERT where score>threshold AND
      cluster_density high; OUTPUT top3_features.
- question: Did a managed mobile device enable USB debugging or change USB mode (Android), or establish
    a new trusted-computer pairing or enable Developer Mode (iOS), and then within ten minutes perform
    an adb install/push/pull, shell-spawn, or device-service/backup activity not originating from the
    app store?
  context: USB debugging on Android requires Developer Options plus an RSA host-key authorization that
    creates a trusted-host pairing; on iOS, host trust or Developer Mode unlocks privileged device-service
    and backup access. Alert when ADB_DEBUGGING_ENABLED or a USB mode change (charging to file-transfer/debugging/accessory)
    is followed within 10 minutes by an install-from-adb, adb push/pull, or shell-spawned process, and
    when an iOS trusted-computer pairing or Developer Mode enablement is followed by device-service/backup
    activity (the exact host-trust abuse demonstrated by Mactans). Treat unexpected device-class transitions
    as suspicious. A positive result is a device that transitioned into an attacker-useful state and was
    immediately exercised over USB - a hallmark of physical-port Initial Access.
  answer_sources:
  - android:MDMLog (USB mode change; ADB_DEBUGGING_ENABLED)
  - iOS:MDMLog (Developer Mode; trusted-computer pairing)
  - MobileEDR:telemetry (install source; file write; OS API execution)
  - 'NAI: MDM/UEM servers, Mobile EDR/telemetry pipelines, enrolled Android and iOS devices, and corporate
    charging kiosks where devices are physically connected.'
  range: Last 90 days, correlated within a 10-minute window of the state transition.
  queries:
  - technology: SIEM/Rule pseudocode
    query: state = mdm(ADB_DEBUGGING_ENABLED OR usb_mode_change OR ios_trusted_pairing OR ios_developer_mode);
      act = edr(install_from_adb OR adb_push_pull OR shell_spawn OR ios_device_service_backup); JOIN state,act
      ON device WHERE act.time-state.time<=10min AND act.source != managed_store; ALERT.
- question: For each enrolled device, is this the first-ever trusted-host pairing, debug-enable, or sideload
    install in 90 days, or is there an abrupt step-change in the connect-then-install rate or a large
    (>50 MB) external-storage file write shortly after a connect?
  context: Most enrolled fleet devices never pair with a developer host, enable debugging, or sideload
    an app, so a per-device 90-day baseline typically sits at zero. Alert on any first-seen pairing/debug
    transition using a prevalence floor, and apply change-point methods to flag abrupt step-changes in
    the connect-then-install rate. Also flag large file writes (>50 MB) from external mounted storage
    shortly after a connect, which suggests bulk replication or extraction. A positive result is a rare-to-unprecedented
    state change on a managed device - precisely what physical-port Initial Access looks like against
    a normally-locked-down fleet.
  answer_sources:
  - android:MDMLog (USB mode change; ADB_DEBUGGING_ENABLED)
  - iOS:MDMLog (Developer Mode; trusted-computer pairing)
  - MobileEDR:telemetry (install source; file write; OS API execution)
  - 'NAI: MDM/UEM servers, Mobile EDR/telemetry pipelines, enrolled Android and iOS devices, and corporate
    charging kiosks where devices are physically connected.'
  range: Last 90 days per-device baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline = per_device_90d(trusted_pairings, debug_enables, sideloads); ALERT where event.count_prior
      == 0 (prevalence_floor); ALSO changepoint(connect_then_install_rate) -> ALERT on step-change; ALSO
      ALERT where ext_storage_file_write > 50MB within minutes_of(connect).
- question: When the ordered USB session events (connect -> debug/pairing-enable -> install/push -> file
    read/write -> OS-API/backup call) are modeled as a workflow, do any sessions deviate from the learned-normal
    sequence?
  context: The connect-to-extract workflow follows a predictable ordering on benign devices, and adversarial
    sessions tend to break that order or insert unexpected steps. Treat the ordered event keys as a sequence
    and apply a DeepLog-style LSTM that predicts the next key; flag sessions whose actual next key falls
    outside the top-g predicted keys. Present the deviating step plus its top-3 contributing parameters
    for triage. A positive result is a USB session whose event sequence is improbable under the learned
    model - evidence that the physical connection was used for malicious replication/extraction during
    Initial Access.
  answer_sources:
  - android:MDMLog (USB mode change; ADB_DEBUGGING_ENABLED)
  - iOS:MDMLog (Developer Mode; trusted-computer pairing)
  - MobileEDR:telemetry (install source; file write; OS API execution)
  - 'NAI: MDM/UEM servers, Mobile EDR/telemetry pipelines, enrolled Android and iOS devices, and corporate
    charging kiosks where devices are physically connected.'
  range: Last 90 days, evaluated per USB session.
  queries:
  - technology: SIEM/ML pseudocode
    query: seq = order(usb_connect, debug_pairing_enable, install_push, file_rw, os_api_backup) PER session;
      model = DeepLog_LSTM.fit(benign_sequences); ALERT where actual_next_key NOT IN top_g(model.predict(prefix));
      OUTPUT deviating_step + top3_params.
- question: After a mobile device USB connection, did a connection-associated process (e.g., adb.exe)
    write a new executable (.exe/.dll/.ps1/.bat) to a user-writable directory that was then executed within
    ten minutes, with child processes spawning command interpreters or network utilities?
  context: In lateral movement, a paired device or charging station can be used to drop and run tooling
    on the host PC. Anchor on the device attach (Event ID 6416 / Sigma external-device rule) and correlate
    with file creation (Sysmon 11) and execution (Sysmon 1) within 10 minutes. Alert critically when the
    created file hash matches malware intelligence, and high when execution spawns powershell.exe with
    suspicious arguments (-enc, -e, -encoded, -w hidden) or invokes bitsadmin/certutil. A positive result
    is a USB-linked write-then-execute of a binary that then launches interpreters or download utilities
    - a strong lateral-movement payload-staging indicator.
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows-DriverFrameworks-UserMode/Operational Event ID 2003
  - 'NAI: Corporate workstations, IT administrator workstations, software development environments, user
    profile directories (Downloads, Temp, AppData), and shared network drives.'
  range: Last 90 days, correlated within a 10-minute window of USB attach events.
  queries:
  - technology: SIEM/Rule pseudocode
    query: attach=events(EventID=6416); filew=events(Sysmon=11) WHERE ext IN(.exe,.dll,.ps1,.bat) AND
      path IN(%APPDATA%,%TEMP%,Downloads); exec=events(Sysmon=1 OR EventID=4688) WHERE image=filew.file
      AND exec.time-filew.time<=10min; JOIN ON host WHERE filew.time-attach.time<=10min; ALERT CRIT where
      hash IN malware_intel; ALERT HIGH where child IN(cmd.exe,powershell.exe -enc/-w hidden,bitsadmin.exe,certutil.exe).
- question: After a USB connection, is the created file's enterprise hash prevalence under five hosts,
    is its section/byte entropy above 7.0 (implying packing), and is the parent-child process pair in
    the bottom 5th percentile of observed relationships?
  context: Rare files and unusual lineage are reliable lateral-movement signals when tied to USB activity.
    After a USB connection, compute the enterprise-wide prevalence of created file hashes and alert when
    fewer than five hosts have seen the file. Apply EMBER-style static content features (section/byte-entropy
    histograms) - section entropy above 7.0 implies packing - as an additional content-state signal. Also
    alert when the parent-child process relationship falls in the bottom 5th percentile of observed pairs
    (e.g., adb.exe parenting an interpreter). A positive result is a rare, likely-packed binary with anomalous
    lineage staged over USB - consistent with adversary tooling for lateral movement.
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows-DriverFrameworks-UserMode/Operational Event ID 2003
  - 'NAI: Corporate workstations, IT administrator workstations, software development environments, user
    profile directories (Downloads, Temp, AppData), and shared network drives.'
  range: Last 90 days with enterprise-wide prevalence statistics.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'after attach: prevalence = count_hosts(file.hash); ALERT where prevalence < 5; ALSO ALERT
      where section_entropy(file) > 7.0; ALSO ALERT where rank(parent_child_pair) < p5(observed_relationships).'
- question: When a gradient-boosted/Random Forest classifier scores USB-linked executions on static and
    contextual features, do any exceed a 0.9 malware probability, and does lineage analysis flag anomalous
    USB-tool ancestry?
  context: Supervised classification adds discriminating power over prevalence alone for lateral-movement
    payloads. Train a LightGBM or Random Forest on EMBER static features (header/section metadata, imports,
    byte-entropy histograms, signer) plus path entropy, parent process, enterprise prevalence, and USB
    timing; flag executions with probability above 0.9 for containment and surface the top-3 feature importances.
    Complement with ProblemChild to prioritize anomalous USB-tool lineage (e.g., adb.exe -> powershell.exe/certutil.exe)
    with explainable output. A positive result is a high-confidence malicious execution staged via USB
    with suspicious ancestry - a candidate lateral-movement payload warranting containment.
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows-DriverFrameworks-UserMode/Operational Event ID 2003
  - 'NAI: Corporate workstations, IT administrator workstations, software development environments, user
    profile directories (Downloads, Temp, AppData), and shared network drives.'
  range: Last 90 days, scored on USB-linked executions.
  queries:
  - technology: SIEM/ML pseudocode
    query: model = LightGBM.fit(EMBER_static + [path_entropy,parent_proc,prevalence,usb_timing]); p =
      model.predict(usb_linked_exec); ALERT where p>0.9; OUTPUT top3_importances; ALSO ProblemChild.score(process_lineage)
      -> ALERT on anomalous adb.exe->powershell.exe/certutil.exe chain.
- question: Within fifteen minutes of a USB device connection, did Zeek report an Address_Scan or Port_Scan
    notice from the same host?
  context: A freshly-compromised host pivoting laterally often begins reconnaissance scanning soon after
    the malicious device connects. Monitor Zeek notice.log for Scan::Address_Scan or Scan::Port_Scan and
    correlate those notices with USB attach events (Event ID 6416) within a 15-minute window, escalating
    to high severity when correlated. A positive result deterministically links internal scanning to a
    recent physical connection, a strong indication that the host has been weaponized and is enumerating
    the network for lateral movement.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Sysmon Event ID 3
  - Windows-DriverFrameworks-UserMode/Operational Event ID 2003
  - 'NAI: Corporate workstations, network segments containing high-value assets (Domain Controllers, Database
    Servers), internal network traffic choke points, East-West traffic monitoring points (e.g., network
    TAPs, virtual switch monitoring), and VLANs with sensitive servers.'
  range: Last 90 days, correlated within a 15-minute window of USB attach events.
  queries:
  - technology: SIEM/Rule pseudocode
    query: attach=events(EventID=6416); scan=zeek.notice WHERE note IN(Scan::Address_Scan,Scan::Port_Scan);
      JOIN ON host WHERE scan.time-attach.time<=15min; ALERT HIGH.
- question: After a USB event, does the host contact more than 20 unique internal IPs on ports 135/139/445/3389,
    or show a failed-to-successful connection ratio above three standard deviations from baseline, or
    an abrupt change-point in scan fan-out?
  context: Internal scanning manifests as a fan-out of connections to reconnaissance ports with many failures.
    After USB events, compute unique internal IP counts on ports 135/139/445/3389 and failed-to-successful
    connection ratios in 5-minute windows. Alert when unique IPs exceed 20 or failure ratios exceed 3
    standard deviations above baseline (an explicit connection-failure-rate signal), and apply change-point
    detection to flag abrupt step-changes in scan fan-out. A positive result is a measurable burst of
    internal probing immediately following a USB connection - a quantitative lateral-movement reconnaissance
    signal.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Sysmon Event ID 3
  - Windows-DriverFrameworks-UserMode/Operational Event ID 2003
  - 'NAI: Corporate workstations, network segments containing high-value assets (Domain Controllers, Database
    Servers), internal network traffic choke points, East-West traffic monitoring points (e.g., network
    TAPs, virtual switch monitoring), and VLANs with sensitive servers.'
  range: Last 90 days with rolling per-host hourly baselines, evaluated in 5-minute windows after USB
    events.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'after attach: in 5min_windows compute unique_internal_ips(port IN 135,139,445,3389), fail_success_ratio;
      ALERT where unique_ips>20 OR fail_success_ratio > mean+3*std; ALSO changepoint(scan_fanout) -> ALERT
      on step-change.'
- question: Does a host transition from a normal network-behavior cluster into a scanner cluster within
    fifteen minutes of a USB event, and do graph models flag improbable new authentication/transfer edges
    from the paired device?
  context: Clustering host network profiles separates routine behavior from scanner behavior, and graph
    models catch cross-host pivots. Use K-Means or DBSCAN on host profiles (unique destination IPs/ports,
    failure ratio, outbound volume) and alert when a host moves from a normal cluster to a scanner cluster
    within 15 minutes of a USB event. For cross-host pivot from a paired device, score rare access paths
    with Hopper and improbable new authentication/transfer edges with the Bowman et al. unsupervised graph
    model, surfacing the contributing edge for triage. A positive result is a behavioral shift into scanning
    plus an anomalous lateral edge - strong evidence of lateral movement seeded by the USB connection.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Sysmon Event ID 3
  - Windows-DriverFrameworks-UserMode/Operational Event ID 2003
  - 'NAI: Corporate workstations, network segments containing high-value assets (Domain Controllers, Database
    Servers), internal network traffic choke points, East-West traffic monitoring points (e.g., network
    TAPs, virtual switch monitoring), and VLANs with sensitive servers.'
  range: Last 90 days, evaluated within a 15-minute window of USB events.
  queries:
  - technology: SIEM/ML pseudocode
    query: clusters = KMeans/DBSCAN.fit(host_profiles[unique_dest_ips,ports,fail_ratio,outbound_vol]);
      ALERT where host moves normal_cluster->scanner_cluster within 15min_of(attach); ALSO Hopper.score(access_path)
      + Bowman_graph.score(new_auth_transfer_edge) -> ALERT on improbable edge; OUTPUT contributing_edge.
- question: Was an app installed onto a mobile device from adb/sideload/unknown USB source (bypassing
    the managed store), especially within fifteen minutes of ADB_DEBUGGING_ENABLED or a new trusted-host
    pairing?
  context: adb install and developer-provisioning installs bypass app-store vetting, making non-store
    install provenance a direct lateral-movement-onto-device signal. Alert when an install event's source
    is adb/sideload/unknown rather than the managed store, especially within 15 minutes of ADB_DEBUGGING_ENABLED
    or a new trusted-host pairing, and treat unexpected device-state transitions as malicious (the charger-install
    attack of Mactans, and USB-based attack research). A positive result is an off-store app install closely
    following a debug/pairing state change - a clear indicator that an attacker is pushing malware onto
    the device over the physical connection.
  answer_sources:
  - android:MDMLog (ADB_DEBUGGING_ENABLED; install source)
  - MobileEDR:telemetry (application installed from adb/sideload/unknown USB source)
  - iOS:MDMLog (developer/provisioning-profile install; trusted-computer pairing)
  - 'NAI: MDM/UEM servers, Mobile EDR/telemetry pipelines, enrolled Android and iOS devices, and the application
    inventory/permission stream.'
  range: Last 90 days, correlated within a 15-minute window of debug/pairing events.
  queries:
  - technology: SIEM/Rule pseudocode
    query: install = edr(install_event) WHERE source IN(adb,sideload,unknown); state = mdm(ADB_DEBUGGING_ENABLED
      OR new_trusted_host_pairing); ALERT where install.source != managed_store; ESCALATE where install.time-state.time<=15min.
- question: Against a fleet baseline of install provenance and per-category permission/API distributions,
    does a newly installed app appear as a sideload (prevalence floor) or deviate from the benign API-transition
    (Markov) profile for its category?
  context: Managed fleets almost never sideload, so install provenance is a powerful prevalence-floor
    signal, and behavioral profiling catches malicious apps that masquerade by category. Maintain a fleet
    baseline of install provenance (store vs. sideload) and per-category permission/API distributions;
    alert on any sideloaded install and when a new app's package-level API transition profile deviates
    from the benign Markov baseline of MaMaDroid. A positive result is a sideloaded or behaviorally-anomalous
    app on a normally store-only fleet - consistent with adversary-installed malware delivered during
    lateral movement over USB.
  answer_sources:
  - android:MDMLog (ADB_DEBUGGING_ENABLED; install source)
  - MobileEDR:telemetry (application installed from adb/sideload/unknown USB source)
  - iOS:MDMLog (developer/provisioning-profile install; trusted-computer pairing)
  - 'NAI: MDM/UEM servers, Mobile EDR/telemetry pipelines, enrolled Android and iOS devices, and the application
    inventory/permission stream.'
  range: Last 90 days with a fleet-wide baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline = fleet(install_provenance, per_category_perm_api_dist); ALERT where install.source==sideload
      (prevalence_floor); ALSO ALERT where markov_distance(app.api_transitions, MaMaDroid_benign_baseline[category])
      > threshold.
- question: When a sideloaded app is scored with Drebin and MaMaDroid, does it return a high malware probability,
    and what are the top contributing features?
  context: Explainable ML classifiers give analysts both a verdict and a rationale for sideloaded apps.
    Score the sideloaded app with Drebin (a linear SVM over manifest/code features that surfaces the highest-weighted
    explanatory features) and MaMaDroid (a Markov-chain behavioral classifier); alert on high malware
    probability and present the top-3 contributing features (e.g., SEND_SMS plus a premium-number API)
    in the alert text. A positive result is a high-confidence malicious sideloaded app with interpretable
    evidence - confirming that a non-store install over USB delivered malware as part of lateral movement.
  answer_sources:
  - android:MDMLog (ADB_DEBUGGING_ENABLED; install source)
  - MobileEDR:telemetry (application installed from adb/sideload/unknown USB source)
  - iOS:MDMLog (developer/provisioning-profile install; trusted-computer pairing)
  - 'NAI: MDM/UEM servers, Mobile EDR/telemetry pipelines, enrolled Android and iOS devices, and the application
    inventory/permission stream.'
  range: Last 90 days, scored on sideloaded app installs.
  queries:
  - technology: SIEM/ML pseudocode
    query: p_drebin = Drebin_SVM.score(app[manifest,code_features]); p_mama = MaMaDroid.score(app.api_call_graph);
      ALERT where max(p_drebin,p_mama) > threshold; OUTPUT top3_features (e.g., SEND_SMS + premium_number_api).
