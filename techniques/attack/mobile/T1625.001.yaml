name: 'T1625.001: System Runtime API Hijacking'
id: ffca0880-2082-4884-8845-3d554fe19c67
description: Investigate whether an adversary is maintaining persistence on corporate-managed Android
  devices by hijacking the operating system's runtime APIs. On Android this is typically done by overwriting
  or hooking core OS runtime libraries (e.g. /system/lib*/libart.so, /vendor/lib*, or app-bundled .so/DEX)
  so the attacker's code executes every time a hijacked API is called by any app, surviving reboots and
  even some resets. This playbook helps an analyst (1) detect runtime-library integrity and attestation
  failures reported by MDM/MTD/MobileEDR and Play Integrity; (2) hunt the network behavior of a hijacked
  runtime cycling C2 endpoints (IOC hits, beaconing, high-entropy DNS, rare JA3, connection-failure bursts);
  (3) assert on ART method-hooking artifacts and core APIs resolving to unexpected callees with cross-app
  inconsistent return values; and (4) baseline device behavioral telemetry and classify newly installed/updated
  packages with statistical and ML methods. Together these questions establish a causal chain from altered
  system-level API behavior to multiple apps exhibiting consistent anomalies, supporting a defensible
  persistence determination.
type: technique
related:
- tactic_id: TA0028
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any managed Android devices reporting a runtime-library integrity failure where a measured
    file hash or signing certificate does not match the organization's signed golden-image manifest?
  context: 'A hijacked runtime is implemented by replacing or patching a core OS library (libart.so, /system/lib*,
    /vendor/lib*) or an app-bundled .so/DEX. MDM/MTD/MobileEDR platforms emit compliance/integrity events
    that carry the offending file path plus its measured hash and signing certificate. By deterministically
    comparing those measured values against the signed golden manifest for that exact device model and
    OS version, the analyst can confirm tampering without heuristics: any non-matching DEX/code checksum,
    certificate, or native-library hash is a hard floor for tampering, mirroring on-device self-protection
    checks. A positive result (compliance_status=failed with a runtime path mismatch) is strong evidence
    of System Runtime API Hijacking for persistence; enrich with device inventory and hash reputation
    and escalate immediately when the measured hash matches known malware. A negative result reduces but
    does not eliminate suspicion, since some hooking frameworks operate purely in memory.'
  answer_sources:
  - MDM event logs
  - MTD alert logs
  - MobileEDR runtime-integrity telemetry
  - Play Integrity API verdicts
  - Device asset inventory
  - Device integrity baseline hashes
  - Threat intelligence indicators
  - 'NAI: Centralized log aggregator (SIEM) containing ingested MDM/MTD platform logs. The organization''s
    master device asset inventory database. The population of corporate-managed Android devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mdm_mtd_edr_events\nWHERE compliance_status = 'failed'\n  AND failure_reason IN ('os_integrity_mismatch','file_hash_mismatch','signature_mismatch')\n\
      \  AND file_path MATCHES ('/system/lib*','/vendor/lib*','*libart.so','*.so','*.dex')\n  AND (measured_hash\
      \ != golden_manifest_hash[device_model, os_version, file_path]\n       OR signing_cert != golden_manifest_cert[device_model,\
      \ os_version, file_path])\nENRICH device_inventory, hash_reputation\nSET severity = (hash_reputation\
      \ = 'known_malware') ? 'critical' : 'high'\nALERT"
- question: Has any device returned a degraded Play Integrity / attestation verdict (deviceIntegrity lacking
    MEETS_DEVICE_INTEGRITY, or appRecognitionVerdict not PLAY_RECOGNIZED)?
  context: 'Play Integrity verdicts are server-verified and cryptographically signed by Google, so a failing
    verdict is a deterministic integrity failure rather than a heuristic signal. A deviceIntegrity result
    missing MEETS_DEVICE_INTEGRITY indicates a rooted/modified system, custom ROM, or a system-wide hooking
    framework (Xposed/LSPosed/Magisk) — exactly the conditions that enable runtime API hijacking for persistence.
    An appRecognitionVerdict other than PLAY_RECOGNIZED indicates a repackaged or tampered binary that
    could host the hijacking payload. Because the verdict is trustworthy by design, this should be wired
    as a hard rule: any degraded verdict on a corporate-managed device warrants triage. A clean verdict
    is reassuring but does not by itself rule out memory-only hooks not visible to attestation.'
  answer_sources:
  - MDM event logs
  - MTD alert logs
  - MobileEDR runtime-integrity telemetry
  - Play Integrity API verdicts
  - Device asset inventory
  - Device integrity baseline hashes
  - Threat intelligence indicators
  - 'NAI: Centralized log aggregator (SIEM) containing ingested MDM/MTD platform logs. The organization''s
    master device asset inventory database. The population of corporate-managed Android devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM play_integrity_verdicts\nWHERE 'MEETS_DEVICE_INTEGRITY' NOT IN deviceIntegrity.deviceRecognitionVerdict\n\
      \   OR appRecognitionVerdict != 'PLAY_RECOGNIZED'\nENRICH device_inventory\nSET severity = 'high'\n\
      ALERT"
- question: When a native runtime library hash is unknown (neither benign-allowlisted nor known-malicious),
    does its control-flow / semantic signature match a known hooked or replaced libart.so or /system/lib*
    implementation?
  context: Attackers frequently ship modified runtime libraries whose exact hash has not been seen before,
    defeating pure hash matching. For any runtime/native library hash that is unknown, submit the binary
    to a control-flow-graph / semantic signature matcher (DroidNative-style) that fingerprints behavior
    rather than bytes. This catches recompiled or lightly mutated variants of known hooked/replaced libart.so
    or /system/lib* implementations. A semantic match is high-confidence evidence that the device's runtime
    has been replaced to hijack API execution flow for persistence. A non-match means the unknown library
    should be triaged manually and, if benign, added to the allowlist to reduce future noise.
  answer_sources:
  - MDM event logs
  - MTD alert logs
  - MobileEDR runtime-integrity telemetry
  - Play Integrity API verdicts
  - Device asset inventory
  - Device integrity baseline hashes
  - Threat intelligence indicators
  - 'NAI: Centralized log aggregator (SIEM) containing ingested MDM/MTD platform logs. The organization''s
    master device asset inventory database. The population of corporate-managed Android devices.'
  range: Last 90 days
  queries:
  - technology: Pipeline/pseudocode
    query: "FOR each lib WHERE lib.hash NOT IN benign_allowlist AND lib.hash NOT IN known_malicious\n\
      \  cfg = extract_control_flow_semantic_signature(lib.binary)\n  match = droidnative_match(cfg, known_hooked_runtime_signatures)\n\
      \  IF match.score >= threshold:\n     ALERT severity='high', detail=match.family"
- question: Is the per-model/per-OS rate of integrity or attestation failures statistically anomalous
    compared to its own 30-day baseline?
  context: Even when a single failure is ambiguous, a surge of integrity or attestation failures concentrated
    in a device model / OS version can reveal a fleet-wide compromise or a rolling hijacking campaign.
    Build 30-day baselines of hourly integrity/attestation failures per device model/OS and alert when
    the count exceeds mean + 3 standard deviations. Crucially, profile attestation_failed separately from
    file_hash_mismatch, because failed-attestation rates are a distinct failure mode (often indicating
    systemic root/hooking) versus a specific file tamper. A positive excursion focuses the hunt on the
    implicated model/OS cohort; a flat baseline argues against a coordinated campaign.
  answer_sources:
  - MDM event logs
  - MTD alert logs
  - MobileEDR runtime-integrity telemetry
  - Play Integrity API verdicts
  - Device asset inventory
  - Device integrity baseline hashes
  - Threat intelligence indicators
  - 'NAI: Centralized log aggregator (SIEM) containing ingested MDM/MTD platform logs. The organization''s
    master device asset inventory database. The population of corporate-managed Android devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM mdm_mtd_edr_events WHERE compliance_status=''failed''

      BIN hourly BY device_model, os_version, failure_class IN (''attestation_failed'',''file_hash_mismatch'')

      COMPUTE mean, stddev OVER trailing 30d PER (device_model, os_version, failure_class)

      ALERT WHEN count > mean + 3*stddev'
- question: Is fleet-wide integrity-failure volume forecast to spike beyond expected bounds, indicating
    an emerging hijacking campaign?
  context: A coordinated runtime-hijacking campaign can manifest as a fleet-wide rise in integrity failures
    before any single device is conclusively triaged. Fit a time-series forecast (Prophet or SARIMA) on
    hourly fleet integrity failures and alert when observed values exceed the 99% confidence bound for
    two consecutive hours, which suppresses single-hour noise. To make the alert actionable, surface the
    top-3 contributing device models / OS versions / file paths so responders can immediately scope the
    affected cohort. A sustained breach of the forecast bound is an early warning of mass compromise;
    staying within bounds indicates normal background failure rates.
  answer_sources:
  - MDM event logs
  - MTD alert logs
  - MobileEDR runtime-integrity telemetry
  - Play Integrity API verdicts
  - Device asset inventory
  - Device integrity baseline hashes
  - Threat intelligence indicators
  - 'NAI: Centralized log aggregator (SIEM) containing ingested MDM/MTD platform logs. The organization''s
    master device asset inventory database. The population of corporate-managed Android devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = hourly_count(integrity_failures, fleet_wide)\nmodel = Prophet_or_SARIMA.fit(series[trailing])\n\
      forecast = model.predict(next_hours, interval=0.99)\nIF observed > forecast.upper FOR 2 consecutive\
      \ hours:\n   ALERT detail=top3(device_model, os_version, file_path)"
- question: Are any mobile-device IP addresses communicating with destinations (IPs or domains) that match
    threat-intelligence indicators?
  context: A hijacked runtime commonly reaches out to attacker command-and-control infrastructure. By
    matching Zeek conn.log responder IPs and dns.log query names against curated threat-intelligence indicators
    — scoped to known mobile IP ranges and enriched with DHCP/VPN lease mappings to attribute traffic
    to a specific device — the analyst can quickly surface devices talking to known-bad infrastructure.
    A high-severity hit ties a specific managed device to known C2 and corroborates on-device integrity
    findings; absence of IOC hits does not clear the device because novel infrastructure is common.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Network traffic sensor grids (e.g., Zeek clusters) monitoring all corporate Wi-Fi and guest
    Wi-Fi access points, VPN termination points, and internet egress gateways.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM conn.log, dns.log WHERE orig_h IN mobile_ip_ranges

      WHERE id.resp_h IN ti_indicators.ips OR query IN ti_indicators.domains

      ENRICH dhcp_vpn_mappings -> device_id

      ALERT severity=''high'''
- question: Within short 15-minute windows, is any mobile device exhibiting beaconing combined with high-entropy
    DNS queries indicative of automated C2?
  context: Hijacked-runtime payloads often beacon to C2 on a fixed interval and resolve algorithmically
    generated (DGA) or tunneling domains. Over 15-minute windows, compute the Shannon entropy of DNS subdomains
    and the standard deviation of inter-arrival times to each destination. Alert when DNS entropy exceeds
    the 98th percentile (suggesting DGA/tunneling) AND inter-arrival stddev falls below the 2nd percentile
    (suggesting machine-regular beaconing). The conjunction of these two independent signals strongly
    indicates automated C2 from a compromised device, whereas either signal alone is more easily explained
    by benign apps.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Network traffic sensor grids (e.g., Zeek clusters) monitoring all corporate Wi-Fi and guest
    Wi-Fi access points, VPN termination points, and internet egress gateways.'
  range: Last 90 days; evaluate in rolling 15-minute windows
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'WINDOW 15m PER device

      dns_entropy = shannon(dns.log.query subdomains)

      beacon_stddev = stddev(inter_arrival_time(conn.log) PER dst)

      ALERT WHEN dns_entropy > p98(fleet) AND beacon_stddev < p2(fleet)'
- question: Which devices show anomalous egress connection vectors (rare JA3, unusual proto/port/duration/bytes)
    when scored by an unsupervised model?
  context: Not all C2 matches a known IOC or perfect beacon. Train an Isolation Forest on 30-day per-connection
    feature vectors (protocol, port, duration, bytes, JA3) and alert when a device's count of anomalous
    connections exceeds the 99th percentile within a 5-minute window. A rare JA3 hash (present on <1%
    of fleet devices) is a particularly strong indicator of a non-standard TLS stack used by malware.
    Corroborate with on-device static indicators — hardcoded network addresses are high-weight malicious
    features in the Drebin model — and surface the top-3 contributing features (rare JA3, beacon period,
    low-reputation endpoint) so the analyst understands why the device was flagged. Anomalous scoring
    plus on-device tampering is compelling; a clean score lowers but does not eliminate suspicion.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Network traffic sensor grids (e.g., Zeek clusters) monitoring all corporate Wi-Fi and guest
    Wi-Fi access points, VPN termination points, and internet egress gateways.'
  range: Last 90 days; score in 5-minute windows
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = vector(proto, port, duration, bytes, ja3) FROM conn.log,ssl.log over 30d

      model = IsolationForest.fit(features)

      score = model.anomaly_score(per_connection)

      WINDOW 5m PER device: anom_count = count(score in top anomalies)

      ALERT WHEN anom_count > p99(fleet) detail=top3_features(ja3, beacon_period, endpoint_reputation)'
- question: Is any mobile device experiencing a burst of connection failures (NXDOMAIN, connection-refused/blocked,
    TLS-handshake failures) above its own baseline, suggesting a hijacked runtime cycling dead C2 endpoints?
  context: 'A hijacked runtime frequently rotates through C2 endpoints, many of which are sinkholed, taken
    down, or blocked — producing characteristic bursts of failed resolutions and refused/blocked connections.
    Per device, track NXDOMAIN, connection-refused/blocked, and TLS-handshake-failure rates over 15-minute
    windows and alert when failure rates exceed the 99th percentile of that device''s 30-day baseline.
    This failure-mode signal is distinct from and complementary to volume/beaconing metrics: a device
    can fail loudly even when its successful traffic looks normal. A failure burst on a device with integrity
    findings strongly supports active C2; a quiet baseline argues against endpoint cycling.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Network traffic sensor grids (e.g., Zeek clusters) monitoring all corporate Wi-Fi and guest
    Wi-Fi access points, VPN termination points, and internet egress gateways.'
  range: Last 90 days; evaluate in rolling 15-minute windows
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'WINDOW 15m PER device

      fail_rate = count(NXDOMAIN + conn_refused + conn_blocked + tls_handshake_fail)

      baseline = p99(device_30d_failrate)

      ALERT WHEN fail_rate > baseline'
- question: Does MobileEDR runtime telemetry report ART method-hooking artifacts — modified ArtMethod
    structures, entry points outside the expected DEX/oat mapping, instruction overwriting, runtime class
    modification, or loaded hooking frameworks?
  context: 'Method hooking in Android''s ART runtime leaves concrete artifacts: patched/relocated ArtMethod
    structures, rewritten method entry points that point outside the expected DEX/oat mapping, in-place
    instruction overwriting, and dynamic class modification — the exact runtime-based obfuscation/hooking
    artifacts characterized by TIRO. Alert when MobileEDR telemetry reports any of these, and also alert
    on the presence of known system-wide hooking frameworks (Xposed/LSPosed/Magisk/Substrate) in loaded
    modules or system properties. Because these artifacts are direct evidence of the hijacking mechanism
    itself, a positive result is high-confidence proof of System Runtime API Hijacking for persistence.
    Absence is reassuring for that telemetry channel but should be combined with integrity and network
    findings.'
  answer_sources:
  - MobileEDR runtime-integrity telemetry
  - OS API Execution (DC0021)
  - Process/library load events
  - Device integrity baseline hashes
  - 'NAI: On-device MobileEDR/MTD agents reporting ART runtime integrity and per-app OS API invocation
    telemetry to the SIEM, across the corporate-managed Android fleet.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mobileedr_runtime_telemetry\nWHERE artmethod_modified = true\n   OR method_entry_point\
      \ NOT IN expected_dex_oat_mapping\n   OR instruction_overwrite = true\n   OR runtime_class_modified\
      \ = true\n   OR loaded_module IN ('Xposed','LSPosed','Magisk','Substrate')\n   OR system_property\
      \ INDICATES hooking_framework\nALERT severity='high'"
- question: At runtime, does any sensitive core system API resolve to an implementation outside the OS-provided
    runtime region (an unexpected callee)?
  context: Under a reference-monitor model, each sensitive system API should resolve to a known, OS-provided
    implementation. Maintain an expected-vs-observed callee policy for sensitive APIs (sensor, permission,
    telephony) and alert when a core API at runtime resolves to code outside the OS-provided runtime region
    — the hallmark of a hooked/replaced function (per the SecComp component-hijacking model). This catches
    hijacking even when the on-disk library hash looks clean but the in-memory dispatch has been redirected.
    A policy violation is strong evidence the runtime has been subverted; consistent expected resolution
    across APIs argues the runtime is intact.
  answer_sources:
  - MobileEDR runtime-integrity telemetry
  - OS API Execution (DC0021)
  - Process/library load events
  - Device integrity baseline hashes
  - 'NAI: On-device MobileEDR/MTD agents reporting ART runtime integrity and per-app OS API invocation
    telemetry to the SIEM, across the corporate-managed Android fleet.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM os_api_execution (DC0021)\nFOR api IN sensitive_apis(sensor, permission, telephony)\n\
      WHERE observed_callee_region NOT IN os_provided_runtime_region\n   OR observed_callee != expected_callee_policy[api]\n\
      ALERT severity='high', detail=api, observed_callee"
- question: Within a 5-minute window, are three or more unrelated applications invoking the SAME core
    API and receiving return values that deviate from the OS-enforced expected value?
  context: A shared hooked implementation affects every app that calls the hijacked API, so the population-level
    tell is multiple unrelated apps getting the same anomalous return from the same core API. Within a
    5-minute window, count distinct applications invoking a given core API whose return values deviate
    from the OS-enforced expected value, and alert when >= 3 unrelated apps exhibit the identical anomaly
    — tuning the threshold to the device's app population. Report the affected API and the contributing
    app package names. This cross-app correlation is what distinguishes a system-wide runtime hijack (persistence)
    from a single misbehaving app, and is a core element of the AN1800 causal chain.
  answer_sources:
  - MobileEDR runtime-integrity telemetry
  - OS API Execution (DC0021)
  - Process/library load events
  - Device integrity baseline hashes
  - 'NAI: On-device MobileEDR/MTD agents reporting ART runtime integrity and per-app OS API invocation
    telemetry to the SIEM, across the corporate-managed Android fleet.'
  range: Last 90 days; correlate in 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'WINDOW 5m PER device, PER core_api

      anom_apps = distinct(app_package WHERE return_value != os_expected_value[core_api])

      ALERT WHEN count(anom_apps) >= 3 detail=core_api, list(anom_apps)'
- question: Is a device's behavioral telemetry (CPU, memory, process count, system-call/API rate) excursing
    above its own 30-day baseline in a way consistent with a runtime that intercepts every app's calls?
  context: A hooking runtime that intercepts every application's API calls inflates system-call/API volume
    and CPU usage above the device's normal baseline. Following the Andromaly 88-feature behavioral framework,
    baseline 30-day per-device distributions of CPU, memory, process count, and system-call/API rates,
    and alert when the API/syscall rate or CPU exceeds mean + 3 standard deviations sustained over two
    consecutive sampling windows (to avoid transient spikes). Surface the top-3 deviating metrics so the
    analyst can reason about the cause. A sustained excursion concentrated in API/syscall volume is consistent
    with a global hook; isolated CPU spikes are more likely benign workload.
  answer_sources:
  - MobileEDR behavioral telemetry
  - On-device static app scan results
  - OS API Execution (DC0021)
  - 'NAI: On-device behavioral sampling agent plus a static app-scanning pipeline (at install/update)
    feeding feature vectors to a SIEM/ML service across the managed Android fleet.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM mobileedr_behavioral_telemetry PER device

      metrics = {cpu, memory, process_count, syscall_api_rate}

      COMPUTE mean, stddev OVER trailing 30d PER metric

      ALERT WHEN any metric > mean + 3*stddev FOR 2 consecutive sampling windows

      detail = top3_deviating_metrics'
- question: Has an installed app's API call-transition distribution diverged significantly from its benign
    baseline or its peer population, as measured by a Markov model?
  context: Hijacking changes which APIs an app effectively calls and in what order. Build per-app Markov-chain
    API call-transition matrices (MaMaDroid-style) and compare each installed app's transition distribution
    to its own benign baseline or its peer-population baseline using a divergence measure such as Jensen-Shannon
    distance; alert when the divergence exceeds the 99th percentile. A large distribution shift indicates
    the app's runtime behavior has changed — consistent with its calls being routed through a hooked implementation
    — even when static signatures are clean. A stable distribution argues the app's behavior is unchanged.
  answer_sources:
  - MobileEDR behavioral telemetry
  - On-device static app scan results
  - OS API Execution (DC0021)
  - 'NAI: On-device behavioral sampling agent plus a static app-scanning pipeline (at install/update)
    feeding feature vectors to a SIEM/ML service across the managed Android fleet.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each app: M_obs = markov_transition_matrix(api_calls)

      div = jensen_shannon(M_obs, benign_baseline[app] OR peer_population)

      ALERT WHEN div > p99(population)'
- question: Does an explainable linear-SVM static classifier flag any newly installed or updated package
    as malicious, and what are its top contributing features?
  context: 'Newly installed or updated packages are a prime delivery vehicle for hijacking payloads. Scan
    each install/update with a linear SVM over manifest and dexcode features (Drebin-style): permissions,
    components, suspicious/restricted API calls, reflection, System.loadLibrary, and the API-call transition
    graph. Because the model is linear, it MUST surface the top-3 highest-weight contributing features
    (e.g., reflection, System.loadLibrary, restricted runtime APIs) in the alert text rather than a bare
    score — giving the analyst explainable, actionable evidence. A high score driven by runtime-manipulation
    features (reflection + native library loading + restricted APIs) is a strong indicator of a hijacking
    payload; a low score lowers risk for that package.'
  answer_sources:
  - MobileEDR behavioral telemetry
  - On-device static app scan results
  - OS API Execution (DC0021)
  - 'NAI: On-device behavioral sampling agent plus a static app-scanning pipeline (at install/update)
    feeding feature vectors to a SIEM/ML service across the managed Android fleet.'
  range: Last 90 days; evaluate at each install/update event
  queries:
  - technology: SIEM/ML pseudocode
    query: "ON package_install OR package_update:\n  features = drebin_static_features(manifest, dexcode)\n\
      \  score, weights = linear_svm.predict(features)\n  IF score > threshold:\n     ALERT detail=top3(weights)\
      \  # e.g. reflection, System.loadLibrary, restricted_runtime_api"
- question: Do parallel relational-graph and native-code ML classifiers flag a package or replaced native
    runtime library that bytecode-only scanners would miss?
  context: 'Static bytecode scanners miss two important cases: payloads whose maliciousness lies in API
    relationships, and replaced native runtime libraries. Run two classifiers in parallel — a Heterogeneous
    Information Network + DNN over API calls and their relations (AiDroid-style, reporting the contributing
    meta-paths) and a control-flow/semantic native-code classifier (DroidNative-style). The first catches
    relational hijacking patterns invisible to flat feature models; the second catches hooked/replaced
    libart.so or /system/lib* native binaries. Reporting the contributing meta-paths and the native-code
    match makes findings explainable. A hit from either classifier — especially the native-code one —
    is strong evidence of runtime hijacking that complements the static SVM.'
  answer_sources:
  - MobileEDR behavioral telemetry
  - On-device static app scan results
  - OS API Execution (DC0021)
  - 'NAI: On-device behavioral sampling agent plus a static app-scanning pipeline (at install/update)
    feeding feature vectors to a SIEM/ML service across the managed Android fleet.'
  range: Last 90 days; evaluate at each install/update event
  queries:
  - technology: SIEM/ML pseudocode
    query: "ON package_install OR package_update:\n  hin_score, meta_paths = aidroid_hin_dnn.predict(api_calls,\
      \ relations)\n  native_score, match = droidnative_cfg_classifier.predict(native_libs)\n  IF hin_score\
      \ > thr OR native_score > thr:\n     ALERT detail={meta_paths, native_match}"
