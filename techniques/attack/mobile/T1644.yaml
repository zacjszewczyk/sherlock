name: 'T1644: Out of Band Data'
id: be2cc6e7-b6fb-463f-9363-dc460908d400
description: 'Investigate whether an adversary is using out-of-band data channels on managed Android and
  iOS mobile devices for command and control, as a backup C2 path, or for data exfiltration when the device
  is off Internet-providing networks. Out-of-band streams such as SMS/MMS, push notifications, NFC, and
  Bluetooth let an adversary evade conventional network monitoring. This playbook helps an analyst pursue
  three overlapping evidence trails: (1) Android applications that are granted Notification Access (BIND_NOTIFICATION_LISTENER_SERVICE)
  outside the approved whitelist -- especially those that also request READ_SMS/RECEIVE_SMS or start background
  services -- and then exhibit suspicious network behavior (malicious or high-entropy domains, anomalous
  outbound volume, beaconing-like failed connections and NXDOMAIN surges); (2) inbound SMS/MMS messages
  that carry malicious or newly registered URLs, shorteners, punycode/homoglyph or IP-literal links, high-entropy/obfuscated
  bodies, or arrive in anomalous bursts from first-seen senders, consistent with smishing-delivered C2;
  and (3) Bluetooth/NFC pairings to unauthorized peripherals inside sensitive geofenced spaces, weak-key
  (KNOB-style) link negotiation, discoverable-device policy violations, anomalous pairing frequency or
  transfer volume, and failed-pairing brute force. Each trail provides symbolic-logic, statistical, and
  machine-learning detection approaches so an analyst can confirm whether a compromised device is communicating
  over a covert out-of-band channel.'
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command and Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has any Android application package that is NOT on the approved corporate whitelist been granted
    Notification Access (BIND_NOTIFICATION_LISTENER_SERVICE), and within 24 hours of that grant did the
    device connect to domains matching threat intelligence or to the app's own embedded/install-source
    infrastructure?
  context: 'Notification Access lets an Android app read the content of every push notification, including
    the text of inbound SMS, OTP codes, and messenger previews -- a textbook out-of-band capture channel
    for command and control. Because this permission must be granted manually through the settings menu
    (often after the app launches an Intent that drops the user directly there), any grant to a package
    outside the approved whitelist is inherently suspicious. Trigger when MDM logs show the listener service
    bound for a non-whitelisted package, then immediately enrich: query the app''s signer and install
    source and check the domains the device contacted in Zeek conn.log over the following 24 hours against
    threat intelligence. The deterministic permission/API/embedded-URL feature families enumerated by
    Drebin define the risk set. A positive result (whitelist miss plus a malicious or attacker-controlled
    domain hit) is high-confidence evidence of an out-of-band C2 listener; a clean network trail still
    warrants review because capture can occur without immediate egress.'
  answer_sources: &id001
  - MDM application inventory logs
  - Android OS security logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate-managed and BYOD Android devices, Mobile Device Management (MDM) servers, Network
    egress points, DNS resolvers, VPN concentrators'
  range: Last 90 days; correlate grant-to-connection within 24 hours
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mdm_app_inventory, android_security_logs\nWHERE permission == 'BIND_NOTIFICATION_LISTENER_SERVICE'\n\
      \  AND package NOT IN approved_whitelist\nJOIN zeek_conn (orig_h == device_ip) WITHIN 24h\nWHERE\
      \ conn.dst IN threat_intel OR conn.dst == app.install_source_domain\nEMIT alert WITH device_id,\
      \ package, signer, install_source, matched_domain"
- question: Among apps granted Notification Access, which also request high-risk SMS permissions (READ_SMS,
    RECEIVE_SMS) or start background services immediately after the permission grant, and what are their
    install source and signer?
  context: An app that combines Notification Access with READ_SMS/RECEIVE_SMS, or that spins up a background
    service the instant the grant lands, is assembling exactly the capability needed to silently harvest
    and relay out-of-band data. These co-occurring SMS-and-notification API requests are the static signals
    Drebin shows are strongly malware-indicative. Flag any package whose granted/requested permission
    set intersects this risky combination, then enrich with MDM app inventory to confirm install source
    (sideloaded vs. managed store) and signer reputation. A side-loaded, unknown-signer app with both
    notification and SMS reach is a prime out-of-band C2 candidate; a well-known store app with a legitimate
    notification use case (e.g., a sanctioned messaging client) is a likely benign explanation to document
    and whitelist.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mdm_app_inventory, android_security_logs\nWHERE has_permission('BIND_NOTIFICATION_LISTENER_SERVICE')\n\
      \  AND (requests_permission('READ_SMS') OR requests_permission('RECEIVE_SMS')\n       OR background_service_start\
      \ WITHIN 60s OF notification_access_grant)\nENRICH install_source, signer, store_reputation\nEMIT\
      \ alert WITH device_id, package, permission_set, install_source, signer"
- question: For devices where a non-whitelisted app holds Notification Access, do the Shannon entropy
    and unique-query/distinct-subdomain ratio of DNS lookups exceed the 98th percentile of the last 7
    days, or does outbound byte volume / in-out byte ratio exceed the 95th percentile of the device's
    30-day baseline?
  context: Once a notification-listening app starts exfiltrating captured content or beaconing for instructions,
    its DNS and flow behavior diverges from the device's norm. Compute per-domain Shannon entropy and
    the unique-query/distinct-subdomain ratio from Zeek dns.log (the stateless lexical DNS features of
    Nadler et al.) and alert above the 98th percentile of the last 7 days -- high entropy and many distinct
    subdomains point to DGA or DNS-tunneled C2. Separately baseline outbound volume from Zeek conn.log
    (orig_bytes and the inbound/outbound byte ratio) per device over 30 days and alert above the 95th
    percentile; these flow-volume features are the discriminators validated in CorrNetDroid. Derive percentiles
    per tenant because baselines vary by device role. Concurrent DNS-entropy and volume outliers on a
    device carrying an unapproved notification listener strongly corroborate active out-of-band data movement.
  answer_sources: *id001
  range: Last 90 days; DNS baseline 7 days, volume baseline 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each device_ip WHERE non_whitelisted_app_has_notification_access:\n  dns_p98 = p98(shannon_entropy(dns.query),\
      \ unique_query_ratio, lookback=7d)\n  vol_p95 = p95(sum(orig_bytes), in_out_byte_ratio, lookback=30d)\n\
      \  ALERT IF shannon_entropy(dns.query) > dns_p98\n        OR unique_query_ratio > dns_p98\n    \
      \    OR sum(orig_bytes) > vol_p95\n        OR in_out_byte_ratio > vol_p95\n  # derive percentiles\
      \ per tenant"
- question: After a Notification Access grant, does any device show a surge in blocked/failed outbound
    connections (Zeek conn.log conn_state S0/REJ) or NXDOMAIN responses per hour exceeding mean + 3 standard
    deviations of its 14-day baseline?
  context: 'Beaconing malware repeatedly tries to reach C2 infrastructure that is dead, rate-limited,
    or algorithmically generated, producing a tell-tale rise in failed connections and NXDOMAIN responses.
    Track per-device hourly counts of S0/REJ connection states from Zeek conn.log and NXDOMAIN rcodes
    from dns.log, and alert when either exceeds mean + 3 standard deviations of the device''s 14-day baseline.
    A surge that begins shortly after a Notification Access grant is especially significant: it suggests
    the newly empowered app is attempting covert-channel callbacks to ephemeral or DGA infrastructure,
    a signal noted in the covert-channel survey by Wendzel et al. A positive result warrants pivoting
    to the specific destinations and the responsible app; a flat failure profile reduces (but does not
    eliminate) the likelihood of active beaconing.'
  answer_sources: *id001
  range: Last 90 days; baseline window 14 days, hourly buckets
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each device_id (post notification_access_grant):\n  base = mean_std(count(conn_state IN\
      \ ('S0','REJ')) per hour,\n                  count(dns.rcode=='NXDOMAIN') per hour, lookback=14d)\n\
      \  ALERT IF failed_conn_per_hour > base.mean + 3*base.std\n        OR nxdomain_per_hour  > base.mean\
      \ + 3*base.std\n  EMIT WITH device_id, top_destinations, responsible_app"
- question: Does a linear SVM scored over each installed app's static features (requested permissions,
    restricted/suspicious API calls, app components, embedded URLs/IPs) flag any app as malicious, and
    what are the top-3 contributing features driving the verdict?
  context: A supervised static classifier catches risky apps that no single rule would, while remaining
    explainable enough for an analyst to action. Score installed apps with a linear SVM over Drebin-style
    static features -- requested permissions, restricted and suspicious API calls, declared components,
    and embedded URLs/IPs -- which detects 94% of malware at a 1% false-positive rate on the public Drebin
    dataset and, crucially, exposes per-detection feature weights. Emit the top-3 contributing features
    (for example 'requests READ_SMS', 'embedded URL <x>', 'binds NotificationListenerService') in the
    alert text so the analyst can immediately judge whether the flagged app plausibly implements an out-of-band
    capture/relay capability. Keep the deterministic permission rules running in parallel as a floor,
    and re-score on each app install/update.
  answer_sources: *id001
  range: Last 90 days; re-run on each app install/update
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = static_extract(apk:\n  requested_permissions, restricted_api_calls, suspicious_api_calls,\n\
      \  components, embedded_urls_ips)\nlabel, weights = LinearSVM.predict(features)  # Drebin-style\n\
      WHEN label == 'malicious':\n  EMIT alert WITH package, top3_features(weights)\n# run alongside deterministic\
      \ permission rules"
- question: After a Notification Access grant for a non-whitelisted app, does the observed hourly count
    of new outbound connections exceed the time-series model's 99% upper confidence bound for two consecutive
    hours, and does an Isolation Forest over flow features flag the device as anomalous (with top-3 contributing
    features)?
  context: Out-of-band C2 often produces a sustained, statistically unexpected rise in new outbound connections
    rather than a single spike. Train a time-series forecasting model (Prophet or ARIMA) on the hourly
    count of new outbound connections per device from Zeek conn.log; after a non-whitelisted app gains
    Notification Access, raise a high-priority alert if observed counts exceed the 99% upper confidence
    bound for two consecutive hours -- the two-hour persistence requirement suppresses single-spike noise.
    In parallel, run an Isolation Forest over flow features (bytes, packet counts, connection frequency,
    in/out ratio) per CorrNetDroid and Nadler et al., surfacing the top-3 contributing features per alert
    for explainability. Concurrent forecast breach and flow-anomaly flags on a device with an unapproved
    notification listener are strong corroboration of active covert egress.
  answer_sources: *id001
  range: Last 90 days; hourly buckets, alert on 2 consecutive breaches
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = TimeSeries(Prophet|ARIMA).fit(hourly_new_outbound_conn[device], lookback=90d)\nyhat_upper\
      \ = model.predict_upper(ci=0.99)\nWHEN observed > yhat_upper FOR 2 consecutive hours\n     AND device\
      \ has post-grant non_whitelisted notification_access:\n  iso = IsolationForest(bytes, pkt_counts,\
      \ conn_freq, in_out_ratio)\n  EMIT high_priority WITH device_id, observed, yhat_upper, iso.top3_features"
- question: Do any inbound SMS/MMS messages on managed devices contain URLs whose domains match threat
    intelligence feeds or were registered in the last 30 days, and did the recipient device connect to
    that flagged domain within 10 minutes of receipt?
  context: 'Smishing is a primary delivery vector for out-of-band C2: an SMS lures the user to a malicious
    or freshly stood-up domain that drops a payload or harvests credentials. Parse inbound SMS/MMS logs
    from the MDM platform, extract URLs, and compare their domains against threat intelligence feeds and
    a list of domains registered within the last 30 days (newly registered domains are disproportionately
    malicious). The URL/number/currency/urgency textual markers formalized by Hosseinpour & Das provide
    robust deterministic cues for which messages to scrutinize. Alert on any match and -- critically --
    correlate with Zeek conn.log/dns.log to confirm whether the recipient device actually connected to
    the flagged domain within 10 minutes of receipt, which converts a suspicious message into a confirmed
    click-through and likely compromise.'
  answer_sources: &id002
  - MDM security event logs
  - Carrier SMS/MMS detail records
  - Threat Intelligence Feeds
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Telecommunication provider gateways for corporate mobile accounts, Corporate mobile devices,
    SIEM/Log aggregator, Threat Intelligence Platform'
  range: Last 90 days; correlate receipt-to-connection within 10 minutes
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mdm_sms_mms_logs\nLET urls = extract_urls(message_body)\nWHERE domain(urls) IN threat_intel\n\
      \   OR domain_registered_within(urls, 30d)\nJOIN zeek_conn/dns (orig_h == device_ip, dst == domain(urls))\
      \ WITHIN 10m\nEMIT alert WITH device_id, sender, url, domain_age, connected=true/false"
- question: Are there inbound SMS/MMS messages containing URL shorteners, punycode/homoglyph domains,
    or IP-literal URLs, particularly when the sender number is external to the organization or first-seen
    in carrier SMS detail records?
  context: Attackers obscure malicious destinations in smishing messages using URL shorteners (bit.ly
    and similar), punycode/homoglyph lookalike domains, and raw IP-literal URLs to bypass naive blocklists.
    Alert on messages containing any of these obfuscation patterns -- the character-manipulation cues
    highlighted by the multi-signal smishing model -- and weight the alert higher when the sender number
    is outside the organization or appears for the first time in carrier SMS detail records, since legitimate
    corporate senders rarely use such links. A hit identifies a probable out-of-band lure before the user
    clicks; pivot to whether the device subsequently resolved/connected to the de-obfuscated destination.
    Benign bulk-marketing senders also use shorteners, so combine with sender reputation to manage false
    positives.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mdm_sms_mms_logs, carrier_sms_detail\nLET urls = extract_urls(message_body)\nWHERE is_url_shortener(urls)\
      \ OR is_punycode_or_homoglyph(domain(urls))\n   OR is_ip_literal_url(urls)\nAND (sender NOT IN org_numbers\
      \ OR first_seen_sender(sender))\nEMIT alert WITH device_id, sender, url_pattern, sender_first_seen"
- question: Does any inbound SMS/MMS body have a character-level Shannon entropy exceeding its 30-day
    rolling baseline (mean) by more than 3 standard deviations, indicating obfuscated or machine-generated
    content?
  context: Encoded command strings, base64/hex payloads, and machine-generated obfuscation compress poorly
    and exhibit abnormally high character-level entropy compared with ordinary human-written texts. Calculate
    character-level Shannon entropy for each inbound SMS/MMS body, maintain a rolling 30-day baseline
    (mean and standard deviation), and alert when a message exceeds the mean by more than 3 standard deviations
    -- a statistical fingerprint of obfuscation or covert payloads noted by Wendzel et al. Calibrate the
    alerting threshold against the ~13% spam prevalence of the SMS Spam Collection so the volume of alerts
    stays actionable. A high-entropy body, especially paired with an unknown sender or a suspicious URL,
    suggests the message itself is carrying out-of-band data or commands rather than human communication.
  answer_sources: *id002
  range: Last 90 days; rolling 30-day baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each inbound_sms_mms:\n  e = char_shannon_entropy(message_body)\n  base = mean_std(entropy_history,\
      \ lookback=30d)\n  ALERT IF e > base.mean + 3*base.std\n  # calibrate rate to ~13% spam prevalence\
      \ (SMS Spam Collection)\n  EMIT WITH device_id, sender, entropy=e, threshold=base.mean+3*base.std"
- question: Does any device receive an anomalous burst (above the 99th percentile) of inbound messages
    from never-before-seen sender numbers within a short window, relative to its per-recipient baseline?
  context: Coordinated smishing campaigns and SMS-based C2 setup often manifest as a sudden burst of messages
    from sender numbers the recipient has never communicated with before. Baseline per-recipient inbound
    message frequency and the rate of first-seen sender numbers from carrier SMS detail records, then
    alert when a device receives a burst above the 99th percentile of its own baseline from never-before-seen
    senders within a short window. Use the SMS Spam Collection for class-balance calibration so thresholds
    reflect realistic spam-to-ham ratios. A first-seen-sender burst is a strong smishing-campaign indicator
    and can reveal targeting of specific high-value users (executives, admins); pivot to the message contents
    and any embedded URLs to determine whether out-of-band C2 delivery is underway.
  answer_sources: *id002
  range: Last 90 days; per-recipient baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each recipient_device:\n  base = profile(inbound_msg_freq, first_seen_sender_rate, lookback=30d)\n\
      \  burst = count(messages FROM first_seen_senders WITHIN short_window)\n  ALERT IF burst > p99(base.msg_freq)\n\
      \  # class-balance calibration via SMS Spam Collection\n  EMIT WITH device_id, burst_count, distinct_first_seen_senders"
- question: After aggressive text normalization (expanding abbreviations, slang, and leetspeak), does
    a Naive Bayes content classifier label any inbound SMS/MMS as malicious with probability above 0.95?
  context: Attackers deliberately mangle smishing text (l33tspeak, abbreviations, slang) to slip past
    keyword filters. Implement a content-based classifier that first applies aggressive SMS text normalization
    -- expanding abbreviations, slang, and leetspeak -- before feeding a Naive Bayes model, the approach
    of Goel et al. that reaches 96.2% accuracy at a 3.87% false-positive rate. Features include message
    length, URL presence, special-character count, and entropy. Alert only for messages classified malicious
    with probability above 0.95 to keep precision high. Normalization is what makes evasive variants recognizable,
    so this catches smishing that the deterministic URL/pattern rules miss. A high-probability malicious
    classification on a managed device's inbound message indicates a likely out-of-band C2 lure; corroborate
    with sender reputation and any post-receipt network connection.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "norm = normalize_text(message_body)  # expand abbrev/slang/leetspeak\nfeatures = [length,\
      \ url_present, special_char_count, entropy] + bow(norm)\np = NaiveBayes.predict_proba(features)\
      \  # Goel et al.\nWHEN p['malicious'] > 0.95:\n  EMIT alert WITH device_id, sender, probability=p"
- question: Does a four-family multi-signal model (country/region tags, textual-pattern tags, character-level
    features, contextual phrase embeddings) classify any inbound message as smishing, and which signal
    family fired as the top-3 alert rationale?
  context: Sophisticated smishing evades single-feature detectors through region-specific phrasing and
    reuse of benign phrases. Deploy the four-family multi-signal model -- country/region tags, textual-pattern
    tags, character-level features, and contextual phrase embeddings -- trained on the relabeled 84,000+
    message corpus together with the SMS Spam Collection. Surface which signal family fired as the top-3
    alert rationale to satisfy explainability and to resist region-specific and benign-phrase-reuse evasion.
    This model is the most robust of the SMS-content detectors and serves as a catch-all behind the deterministic
    rules and the Naive Bayes classifier. A positive classification with a clear contributing family (e.g.,
    'urgency textual pattern + shortener character feature + finance phrase embedding') gives the analyst
    both confidence and a starting point to assess out-of-band C2 delivery.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "signals = {country_region_tags, textual_pattern_tags,\n           char_level_features, contextual_phrase_embeddings}\n\
      label, family_scores = MultiSignalModel.predict(signals)  # 84k+ corpus + SMS Spam Collection\n\
      WHEN label == 'smishing':\n  EMIT alert WITH device_id, sender, top3_signal_families(family_scores)"
- question: Has any managed device paired over Bluetooth/NFC with a MAC address not on the approved peripheral
    allow-list while its GPS coordinates were inside a defined sensitive geofence, or has Bluetooth/NFC
    been enabled at all on a policy-restricted device?
  context: Bluetooth and NFC are short-range out-of-band channels that an adversary can use to exfiltrate
    data or relay commands inside a physically controlled space, bypassing all network monitoring. Define
    geofences for sensitive locations (executive suites, R&D labs) in the MDM platform and maintain a
    MAC allow-list of approved peripherals, consistent with the device-inventory controls of NIST SP 800-121r2.
    Generate a high-priority alert when MDM logs show a device pairing with a non-whitelisted MAC while
    inside a geofence, or when Bluetooth/NFC is enabled at all on a device where policy forbids it. A
    pairing to an unknown peripheral in a secure area is a strong indicator of attempted out-of-band data
    movement; correlate with the transfer-volume signal to gauge whether data actually moved.
  answer_sources: &id003
  - MDM security logs
  - Mobile OS Bluetooth/NFC logs
  - 'NAI: Physically controlled spaces (e.g., executive suites, R&D labs), Corporate-managed mobile devices
    with Bluetooth/NFC enabled'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mdm_bt_nfc_logs\nWHERE (paired_mac NOT IN approved_peripheral_allowlist\n        AND\
      \ gps_coords INSIDE sensitive_geofence)\n   OR (bt_or_nfc_enabled == true AND device IN policy_restricted_devices)\n\
      EMIT high_priority WITH device_id, user, paired_mac, geofence, gps_coords"
- question: Did any Bluetooth link negotiate an encryption key shorter than 7 bytes, or is any managed
    device left in discoverable mode in violation of policy?
  context: The KNOB attack forces Bluetooth peers to negotiate an encryption key as short as one byte,
    making the link trivially brute-forceable and enabling covert interception or injection over the out-of-band
    channel. Alert whenever a Bluetooth link negotiates a key shorter than 7 bytes (the minimum-key-length
    default mandated by NIST SP 800-121r2) or when a managed device is left discoverable, which advertises
    it for opportunistic pairing. Sub-byte key negotiation is the basis of the KNOB attack and should
    never occur on a properly configured managed device, so a hit is high-confidence evidence of either
    an attack-in-progress or a dangerously misconfigured device. Pivot to the peer MAC and the device's
    recent pairing history.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mdm_bt_nfc_logs, mobile_os_bluetooth_logs\nWHERE negotiated_key_length_bytes < 7   #\
      \ KNOB attack\n   OR discoverable_mode == true          # NIST SP 800-121r2 violation\nEMIT alert\
      \ WITH device_id, peer_mac, key_length, discoverable"
- question: After a pairing event with a non-whitelisted device, does the data-transfer volume exceed
    the user's 99th-percentile baseline, or does pairing frequency exceed the user's 95th-percentile baseline
    within 24 hours?
  context: Out-of-band exfiltration over Bluetooth/NFC shows up as transfer volumes and pairing rates
    that are abnormal for that specific user. Establish a 30-day per-user baseline of Bluetooth/NFC pairing
    frequency and data-transfer volume, then after a pairing with a non-whitelisted device, alert if the
    transfer volume exceeds the user's 99th percentile or pairing frequency exceeds the user's 95th percentile
    within 24 hours. Per-user percentiles are essential because usage varies widely -- a field engineer
    who pairs with many devices daily differs from a desk worker. A large transfer to an unknown peripheral,
    or a sudden flurry of pairings, is a behavioral signature of data being pushed off-device through
    a covert short-range channel; corroborate with geofence and key-length signals.
  answer_sources: *id003
  range: Last 90 days; per-user baseline 30 days, evaluate over 24h
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each user:\n  base = profile(pairing_freq, transfer_volume, lookback=30d)\n  ON pairing_event\
      \ WITH paired_mac NOT IN allowlist:\n    ALERT IF transfer_volume > p99(base.volume)\n         \
      \ OR pairing_freq(24h) > p95(base.freq)\n  EMIT WITH user, device_id, paired_mac, transfer_volume"
- question: Does the rate of failed or aborted Bluetooth/NFC pairing attempts on any device exceed mean
    + 3 standard deviations of its 14-day baseline, especially immediately preceding a successful unauthorized
    pairing?
  context: Brute-force and downgrade attacks against Bluetooth pairing (consistent with the KNOB attack)
    generate repeated failed or aborted pairing attempts before a successful, often weakened, connection.
    Track the rate of failed/aborted pairing attempts (a State metric) per device and alert when it exceeds
    mean + 3 standard deviations of the device's 14-day baseline. A burst of failed pairings that culminates
    in a successful unauthorized pair is a tell-tale sequence of forced pairing or key downgrade -- the
    precursor to an out-of-band interception channel. Correlate the timing of the failure surge with any
    subsequent successful pairing to a non-whitelisted MAC, and pivot to the persistent peer MAC for attribution.
  answer_sources: *id003
  range: Last 90 days; baseline window 14 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each device_id:\n  base = mean_std(failed_or_aborted_pairing_attempts per hour, lookback=14d)\n\
      \  ALERT IF failed_pairings_per_hour > base.mean + 3*base.std\n  CORRELATE WITH subsequent successful_pair\
      \ TO non_whitelisted_mac\n  EMIT WITH device_id, peer_mac, failed_count"
- question: Does DBSCAN over pairing-event features (pairing frequency per user, unique devices paired
    per hour, location) isolate any outliers -- such as rapid pairing with multiple unknown devices in
    a secure area -- and what top-3 features drive the outlier?
  context: Some out-of-band abuse only becomes visible as a pattern across many pairing events rather
    than in any single event. Aggregate pairing event logs (user, device MAC, paired MAC, location, timestamp,
    transfer size) and apply DBSCAN over features such as pairing frequency per user, unique devices paired
    per hour, and location. Density-based clustering naturally labels as outliers the behaviors that do
    not fit any normal cluster -- for example, a device rapidly pairing with multiple unknown peripherals
    inside a secure area, which is the signature of reconnaissance or staged exfiltration. Surface the
    top-3 contributing features in the alert so the analyst understands why the event clustered as anomalous.
    Outliers warrant investigation and correlation with the geofence and volume signals.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "events = aggregate(user, device_mac, paired_mac, location, timestamp, transfer_size)\nfeatures\
      \ = [pairing_freq_per_user, unique_devices_per_hour, location]\nlabels = DBSCAN(features).fit_predict()\n\
      WHEN label == -1 (outlier):\n  EMIT alert WITH user, device_id, top3_features, cluster=outlier"
- question: In geofenced sensitive spaces where host/MDM Bluetooth logs are unavailable, does a protocol-independent
    RF sensor running one-class/autoencoder anomaly detection over spectrum and RSSI features detect unauthorized
    Bluetooth/NFC/BLE radio activity that does not correlate with known MDM device presence?
  context: 'An adversary can use a rogue or unmanaged radio that never appears in host or MDM Bluetooth
    logs, defeating log-based detection entirely. Where such logs are unavailable in geofenced sensitive
    spaces, deploy a protocol-independent RF sensor running one-class or autoencoder anomaly detection
    over spectrum and RSSI features, as in RadIoT, to detect unauthorized Bluetooth/NFC/BLE radio activity
    from physical-layer signals alone. Correlate detected RF anomalies with MDM device-presence logs:
    radio activity that has no corresponding authorized managed device is a strong indicator of a covert
    out-of-band channel or rogue peripheral operating in the protected area. This is the last-resort sensor
    that catches what host telemetry cannot, and a confirmed uncorrelated emission should trigger a physical
    sweep of the space.'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = OneClass|Autoencoder.fit(rf_spectrum_features, rssi_features)  # RadIoT\nWHEN model.anomaly_score(observed_rf)\
      \ > threshold:\n  CORRELATE WITH mdm_device_presence(geofence, timestamp)\n  IF no_matching_authorized_device:\n\
      \    EMIT alert WITH geofence, rf_band, rssi, anomaly_score"
