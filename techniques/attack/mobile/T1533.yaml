questions:
- question: Did a process whose name and cryptographic signer hash are NOT on the approved-application
    allowlist read from sensitive directories on a managed mobile device (for example DCIM/photos, Contacts,
    Documents, app-private databases, or external storage)?
  context: Collection via Data from Local System frequently begins with an app touching files outside
    its legitimate role. This symbolic-logic check alerts when a non-allowlisted process (identified by
    process name plus signer hash) reads from sensitive paths such as Android /data/data/, /storage/emulated/0/DCIM/,
    /storage/emulated/0/Documents/, or iOS container/media/document directories. Maintain and continuously
    update an allowlist of legitimate business apps and their signer hashes; this mirrors the explainable
    sensitive-API-plus-role intuition of Drebin, where a non-role app touching a sensitive source is the
    discriminative signal. Escalate to HIGH when the same app also holds INTERNET/SEND egress capability,
    because read-plus-egress is the precursor to exfiltration. A positive hit identifies an app reading
    data it has no business reason to access; a negative result lowers but does not eliminate suspicion
    since allowlisted apps can still be abused.
  answer_sources:
  - MDM file access logs
  - EDR file system monitoring logs
  - Android logcat
  - iOS Unified Logs
  - Zeek conn.log
  - 'NAI: User data partitions, application sandboxes, and shared storage on managed mobile devices (e.g.,
    Android: /data/data/, /storage/emulated/0/DCIM/, /storage/emulated/0/Documents/; iOS: /var/mobile/Containers/Data/Application/,
    /var/mobile/Media/DCIM/, /var/mobile/Library/Mobile Documents/)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      reads = file_access(android_logcat|ios_unified|edr|mdm)
              where path in sensitive_dirs(DCIM, Contacts, Documents, app_private_db, external_storage);
      allow = allowlist[(process_name, signer_hash)];
      alert when (reads.process_name, reads.signer_hash) not in allow;
      severity = HIGH if app_has_capability(reads.app, INTERNET|SEND) else MEDIUM;
      output device, app, signer_hash, path, severity
- question: Did the same application that read data from a sensitive local source (files, contacts, media,
    or keystore-adjacent stores) subsequently send data to a network socket within the collection window,
    completing a read-then-exfiltrate chain?
  context: 'This symbolic-logic rule operationalizes dynamic taint tracking (TaintDroid): it alerts when
    data read from a sensitive local source is followed, by the same app and within a short collection
    window, by an outbound network write. The exact read->sink chain is the strongest on-device signal
    that local data is being harvested for exfiltration under the Collection tactic. Treat reads that
    end in permission-denied/IO errors with no sink as a separate, lower-severity ''attempted harvest''
    branch worth tracking for repeated probing. A positive correlation strongly indicates active collection-and-exfil;
    the absence of a sink may simply mean staging is occurring or the sensor lacks visibility into the
    egress path.'
  answer_sources:
  - MDM file access logs
  - EDR file system monitoring logs
  - Android logcat
  - iOS Unified Logs
  - Zeek conn.log
  - 'NAI: User data partitions, application sandboxes, and shared storage on managed mobile devices (e.g.,
    Android: /data/data/, /storage/emulated/0/DCIM/, /storage/emulated/0/Documents/; iOS: /var/mobile/Containers/Data/Application/,
    /var/mobile/Media/DCIM/, /var/mobile/Library/Mobile Documents/)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      src = sensitive_read(app, source in {files, contacts, media, keystore_adjacent});
      sink = network_write(app, dst_socket) within collection_window(src);
      alert HIGH when src.app == sink.app and same_session(src, sink);
      attempted = sensitive_read where result in {EACCES, IO_ERROR} and no sink;
      output app, source, dst_socket, branch={confirmed|attempted}
- question: Does an application process exceed its own historical baseline for file-read rate (files per
    minute) or unique sensitive paths touched per minute, or read more than 50 unique sensitive paths
    within a single one-minute window?
  context: 'This statistical method maintains 30-day per-process baselines for Frequency (file reads per
    minute) and Volume (unique sensitive paths per minute and bytes read). Alert when a process exceeds
    its 95th percentile (medium) or 99th percentile (high), or reads more than 50 unique sensitive paths
    in a one-minute window. Fleet-specific cutoffs can be derived from dynamic-behavior corpora such as
    CICMalDroid2020 and CICAndMal2017. Separately profile State: a spike in permission-denied/EACCES reads
    is a distinct attempted-collection signal even when no read succeeds. Burst, broad enumeration of
    sensitive paths is characteristic of Collection where an adversary sweeps local storage; a positive
    result flags an app behaving unlike its own norm, while normal variance keeps it below threshold.'
  answer_sources:
  - MDM file access logs
  - EDR file system monitoring logs
  - Android logcat
  - iOS Unified Logs
  - Zeek conn.log
  - 'NAI: User data partitions, application sandboxes, and shared storage on managed mobile devices (e.g.,
    Android: /data/data/, /storage/emulated/0/DCIM/, /storage/emulated/0/Documents/; iOS: /var/mobile/Containers/Data/Application/,
    /var/mobile/Media/DCIM/, /var/mobile/Library/Mobile Documents/)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = per_process_30d(reads_per_min, unique_sensitive_paths_per_min, bytes_read);
      cur = window(process, 1min);
      alert MEDIUM when cur.reads_per_min > p95(baseline) or cur.unique_paths > p95(baseline);
      alert HIGH   when cur.reads_per_min > p99(baseline) or cur.unique_paths > 50;
      track eacces_spike = count(reads where result==EACCES) as attempted_collection;
      output process, metric, value, threshold
- question: Do the time-ordered OS-API/file-access sequences of an app match a harvest pattern, as flagged
    by an explainable sequence model or surfaced as an outlier by an unsupervised detector?
  context: This machine-learning method runs an LSTM/transformer sequence model with attention over the
    app's OS-API/file-access sequence (read frequency, unique-path entropy, time-of-day, sink presence)
    to flag harvest sequences early, surfacing the top-3 attention-weighted contributing calls in the
    alert (EarlyMalDetect; architectures per the deep-learning Android review). In parallel, score the
    same feature vector with Extended Isolation Forest for label-free outlier detection and emit the top-3
    contributing features. Keep the deterministic allowlist and percentile rules as the floor so the ML
    augments rather than replaces explainable detection. Under Collection this catches harvest behavior
    that evades static thresholds; analysts should weigh the surfaced contributing features when triaging,
    and treat a high anomaly score plus a sensitive-read sequence as actionable.
  answer_sources:
  - MDM file access logs
  - EDR file system monitoring logs
  - Android logcat
  - iOS Unified Logs
  - Zeek conn.log
  - 'NAI: User data partitions, application sandboxes, and shared storage on managed mobile devices (e.g.,
    Android: /data/data/, /storage/emulated/0/DCIM/, /storage/emulated/0/Documents/; iOS: /var/mobile/Containers/Data/Application/,
    /var/mobile/Media/DCIM/, /var/mobile/Library/Mobile Documents/)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      seq = api_file_sequence(app, features=[read_freq, path_entropy, time_of_day, sink_present]);
      p = lstm_attention.predict(seq); top = attention_top3(seq);
      iso = ext_isolation_forest.score(feature_vector(seq)); iso_top = shap_top3(iso);
      alert when p > 0.8 or iso.is_outlier;
      floor: keep allowlist + percentile rules;
      output app, p, iso_score, contributing_features=top|iso_top
- question: Where node-level provenance/lineage is available, do file and process nodes participate in
    a read->stage->exfil chain that a provenance-graph model flags as deviating from learned benign node
    roles?
  context: This machine-learning method applies a provenance-graph model (ThreaTrace) where node-level
    lineage is available from MobileEDR/MDM telemetry. It learns benign node roles, then flags and traces
    the file and process nodes participating in the read->stage->exfil chain, surfacing the anomalous
    nodes and their lineage for explainable triage. Reconstructing the chain of which process read which
    files, where they were staged, and how they left the device directly supports the Collection-to-exfiltration
    narrative. A positive result gives the analyst a concrete subgraph to investigate; absence of provenance
    data means this method is unavailable and reliance falls to the flow and baseline rules.
  answer_sources:
  - MDM file access logs
  - EDR file system monitoring logs
  - Android logcat
  - iOS Unified Logs
  - Zeek conn.log
  - 'NAI: User data partitions, application sandboxes, and shared storage on managed mobile devices (e.g.,
    Android: /data/data/, /storage/emulated/0/DCIM/, /storage/emulated/0/Documents/; iOS: /var/mobile/Containers/Data/Application/,
    /var/mobile/Media/DCIM/, /var/mobile/Library/Mobile Documents/)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      G = provenance_graph(mobileedr|mdm_lineage, nodes=[process, file, socket]);
      model = train_benign_node_roles(G);
      anomalous = model.flag(G.nodes where role_deviation);
      chain = trace(anomalous, pattern = read -> stage -> exfil);
      output anomalous_nodes, lineage(chain)
- question: Did a process that is NOT on the trusted allowlist (by process name and signer hash) make
    an API call to access the Android Keystore or iOS Keychain credential store?
  context: Credential stores hold authentication tokens and secrets that adversaries target during Collection.
    This symbolic-logic check maintains an allowlist of process names and signer hashes permitted to access
    Android Keystore or iOS Keychain, and alerts critically when a non-allowlisted process attempts access.
    The app-identity-plus-sensitive-API combination is the high-weight explainable feature in static Android
    classifiers such as Drebin. A positive hit means an untrusted app is reaching for the device's secret
    store, which is rarely legitimate; a negative result means access came from an expected process, though
    allowlisted apps can still be compromised.
  answer_sources:
  - MDM API monitoring logs
  - EDR API call monitoring logs
  - Android logcat
  - iOS Unified Logs
  - 'NAI: Device credential management services and API gateways on mobile endpoints, specifically the
    Android Keystore and iOS Keychain services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      api = api_calls(android_keystore|ios_keychain) from (mdm|edr|logcat|ios_unified);
      allow = credstore_allowlist[(process_name, signer_hash)];
      alert CRITICAL when (api.process_name, api.signer_hash) not in allow;
      output device, process, signer_hash, api_function, result
- question: Does an app's hourly count of credential-store API calls deviate by more than 3 standard deviations
    from its baseline, or is there a burst of Keystore/Keychain access-denied or authentication-failure
    results?
  context: 'This statistical method builds per-app hourly baselines for credential-store API calls and
    alerts when counts deviate by more than 3 standard deviations (Frequency). It independently profiles
    State: a burst of KeyStore/Keychain access-denied or authentication-failure results is a distinct
    brute/enumeration signal even when no read succeeds. Baselines can be derived from dynamic-behavior
    corpora such as CICMalDroid2020. Under Collection, an app suddenly hammering the credential store,
    or repeatedly failing against it, suggests systematic secret harvesting or enumeration; normal apps
    show stable, low-volume access. A positive result flags either a volume anomaly or a failure-burst
    worth correlating with other harvest signals.'
  answer_sources:
  - MDM API monitoring logs
  - EDR API call monitoring logs
  - Android logcat
  - iOS Unified Logs
  - 'NAI: Device credential management services and API gateways on mobile endpoints, specifically the
    Android Keystore and iOS Keychain services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = per_app_hourly_mean_std(credstore_api_calls);
      cur = hourly_count(app, credstore_api_calls);
      alert when cur > base.mean + 3*base.std;
      state = count(credstore_api where result in {ACCESS_DENIED, AUTH_FAILURE});
      alert when state > burst_threshold;
      output app, count, zscore, failure_burst
- question: Does a credential-store access event fall outside the learned distribution of legitimate access,
    as flagged by a one-class SVM or Isolation Forest trained on benign process/parent/API/time/result
    patterns?
  context: This machine-learning method trains a one-class SVM (and an Isolation Forest in parallel) on
    legitimate credential-access patterns (process, parent, API function, time, success/fail) and flags
    outliers with a tunable contamination threshold, surfacing the top-3 contributing features per alert.
    Because legitimate credential access is relatively narrow and well-defined, outlier modeling is effective
    for catching novel or evasive harvesting under the Collection tactic without labeled malware. A positive
    flag with explanatory features lets the analyst quickly judge whether the access context (unusual
    parent, odd time, repeated failures) is benign or hostile.
  answer_sources:
  - MDM API monitoring logs
  - EDR API call monitoring logs
  - Android logcat
  - iOS Unified Logs
  - 'NAI: Device credential management services and API gateways on mobile endpoints, specifically the
    Android Keystore and iOS Keychain services.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      X = features(credstore_access, [process, parent, api_function, hour, success_fail]);
      ocsvm = OneClassSVM.fit(benign); iso = IsolationForest.fit(benign);
      alert when ocsvm.predict(x) == outlier or iso.score(x) > contamination_threshold;
      output event, model, anomaly_score, top3_features
- question: Did a non-allowlisted process create an archive larger than 10MB (.zip/.tar/.gz/.7z) in a
    user-writable directory, and was that creation followed within 5 minutes by an outbound transfer larger
    than 10MB?
  context: 'This symbolic-logic rule detects the on-device realization of the sensitive-source-to-network-sink
    flow captured by taint tracking (TaintDroid): a non-allowlisted process creates a large archive in
    a user-writable location (e.g., Android /storage/emulated/0/Download/, iOS document containers), and
    an outbound transfer of comparable size follows within 5 minutes. Staging collected data into an archive
    and then shipping it is a classic Collection-to-exfiltration sequence. Escalate to HIGH when the create-then-send
    correlation holds. A positive hit is a strong exfiltration indicator; archive creation alone (without
    egress) is still worth noting as staging.'
  answer_sources:
  - MDM file creation logs
  - EDR file system monitoring logs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: User-writable storage locations on mobile devices (e.g., Android: /storage/emulated/0/Download/;
    iOS: /var/mobile/Library/Mobile Documents/) and corporate network egress points monitored by network
    sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      arc = file_create(ext in {.zip,.tar,.gz,.7z} and size > 10MB and path in user_writable
                        and process not in allowlist);
      egress = outbound_transfer(bytes > 10MB) within 5min after arc;
      alert when arc present; severity = HIGH if egress correlated else MEDIUM;
      output device, process, archive_path, size, egress_dst, severity
- question: For large archives, is the ratio of bytes read locally to bytes staged/uploaded near 1:1,
    is the filename entropy above 3.5, and are there spikes of blocked/RST connections, TLS handshake
    failures, or NXDOMAIN to staging hosts?
  context: 'This statistical method tracks Volume as the ratio of bytes read locally to bytes staged/uploaded
    and flags near-1:1 stage-then-send patterns; it computes filename entropy for large archives and raises
    risk when entropy exceeds 3.5, confirming archive MIME type in Zeek files.log during transfers. It
    explicitly profiles failure State: spikes of blocked/RST outbound connections, TLS handshake failures,
    or NXDOMAIN to staging hosts indicate attempted-but-failed exfil. The combined feature event is scored
    with unsupervised anomaly detection (Extended Isolation Forest) with thresholds derived per dataset.
    Under Collection this distinguishes deliberate staging-and-exfil (and failed attempts) from ordinary
    file activity; high-entropy randomized archive names and near-1:1 read-to-send ratios are strong tells.'
  answer_sources:
  - MDM file creation logs
  - EDR file system monitoring logs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: User-writable storage locations on mobile devices (e.g., Android: /storage/emulated/0/Download/;
    iOS: /var/mobile/Library/Mobile Documents/) and corporate network egress points monitored by network
    sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      vol_ratio = bytes_read_local / bytes_staged_or_uploaded;
      ent = filename_entropy(archive); mime = zeek_files_log.mime(transfer);
      fail = count(blocked|RST outbound) + count(tls_handshake_fail) + count(NXDOMAIN to staging_host);
      feat = [vol_ratio, ent, mime, fail];
      score = ext_isolation_forest.score(feat);
      alert when (vol_ratio ~ 1.0 and ent > 3.5) or fail > threshold or score.is_outlier;
      output archive, vol_ratio, entropy, fail_count, score
- question: Does a Random Forest (and, for packed payloads, a bytecode-image CNN) classify an archive-creation
    event as malicious with probability above 0.8 based on its process, signer, size, byte-volume ratio,
    path depth, filename entropy, and timing?
  context: This machine-learning method trains a Random Forest on file-creation features (process, signer,
    file size, byte-volume ratio, path depth, filename entropy, time) and alerts when malicious probability
    exceeds 0.8, surfacing the top-3 feature importances in the alert. For packed/obfuscated staging payloads,
    a bytecode-image CNN classifier (DexRay) is added. Under Collection this catches staging behavior
    that simple thresholds miss by jointly weighing many weak signals. A positive classification with
    feature importances gives the analyst an explainable basis to triage whether the archive is benign
    user activity or adversary staging.
  answer_sources:
  - MDM file creation logs
  - EDR file system monitoring logs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: User-writable storage locations on mobile devices (e.g., Android: /storage/emulated/0/Download/;
    iOS: /var/mobile/Library/Mobile Documents/) and corporate network egress points monitored by network
    sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      feat = [process, signer, file_size, byte_volume_ratio, path_depth, filename_entropy, hour];
      p = random_forest.predict_proba(feat);
      alert when p > 0.8 with top3 = feature_importances(feat);
      if packed_or_obfuscated(payload): p_cnn = dexray_cnn.predict(bytecode_image(payload));
      output archive, p, top3_features, p_cnn
- question: Does any installed app in MDM inventory hold a toxic permission combination (for example READ_CONTACTS
    + INTERNET + INSTALL_PACKAGES, or READ_SMS + MANAGE_EXTERNAL_STORAGE + INTERNET)?
  context: This symbolic-logic check maintains a list of toxic permission combinations and alerts on any
    app in MDM inventory that matches. Combination selection follows the most-discriminative permissions
    identified in Significant Permissions ID and the high-weight permission features in Drebin. Apps holding
    both broad data-read permissions and egress/install capability are positioned to collect and exfiltrate
    local data, which is the heart of this Collection technique. A positive match flags an app whose permission
    footprint enables harvest-and-send regardless of current behavior; it should be reviewed against the
    app's documented function.
  answer_sources:
  - MDM application inventory logs
  - Mobile Threat Defense (MTD) scan results
  - App store manifest data
  - Android logcat permission grant logs
  - 'NAI: Application manifests, permission grant logs, and application inventory databases stored on
    managed mobile devices and aggregated by the MDM/UEM platform.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      toxic = [ {READ_CONTACTS, INTERNET, INSTALL_PACKAGES},
                {READ_SMS, MANAGE_EXTERNAL_STORAGE, INTERNET} ];
      for app in mdm_inventory:
        if any(combo subset_of app.granted_permissions for combo in toxic):
          alert app, matched_combo;
      output device, app, granted_permissions, matched_combo
- question: Within an app's declared app-store category, does its permission set rank in the top 5% by
    rarity (summed inverse prevalence weighted by discriminative power)?
  context: This statistical method computes permission prevalence per app-store category and assigns risk
    by summing inverse prevalence (rarity), flagging the top 5% per category for review; permissions are
    weighted by their discriminative power (Feature Ranking of Permissions, Significant Permissions ID).
    An app requesting permissions that are statistically rare for its category, and unjustified by its
    function, is a candidate for local-data collection abuse. A high rarity score directs analyst attention
    to apps whose permission footprint is anomalous relative to peers; common, category-typical permission
    sets stay below the threshold.
  answer_sources:
  - MDM application inventory logs
  - Mobile Threat Defense (MTD) scan results
  - App store manifest data
  - Android logcat permission grant logs
  - 'NAI: Application manifests, permission grant logs, and application inventory databases stored on
    managed mobile devices and aggregated by the MDM/UEM platform.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      prevalence = perm_prevalence_by_category(app_store_category);
      weight = discriminative_power(permission);
      risk(app) = sum( weight[p] * (1/prevalence[category][p]) for p in app.permissions );
      flag top 5% per category by risk(app);
      output app, category, risk_score, rare_permissions
- question: Does an app fall out as a DBSCAN noise point with an unusual permission/behavior vector, and
    which permission features does an explainable linear SVM surface as driving the flag?
  context: This machine-learning method applies DBSCAN to ranked permission/behavior vectors and investigates
    noise-point apps with unusual permission sets; in parallel it runs an explainable linear SVM that
    surfaces the top-3 permission features behind each flag (Drebin, Feature Ranking of Permissions).
    Clustering reveals apps whose permission profile does not belong to any dense group of normal peers,
    an indicator of potential local-data collection capability under this Collection technique. A noise-point
    app with high-weight sensitive permissions is a strong review candidate; the SVM's surfaced features
    give the analyst an explainable rationale for the flag.
  answer_sources:
  - MDM application inventory logs
  - Mobile Threat Defense (MTD) scan results
  - App store manifest data
  - Android logcat permission grant logs
  - 'NAI: Application manifests, permission grant logs, and application inventory databases stored on
    managed mobile devices and aggregated by the MDM/UEM platform.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      V = ranked_permission_behavior_vectors(apps);
      labels = DBSCAN(V, eps, min_samples);
      noise = apps where labels == -1;
      svm = LinearSVM.fit(V, known_labels);
      for app in noise: top3 = svm.top_features(app);
      output app, cluster_label, top3_permission_features
