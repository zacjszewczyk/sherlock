name: 'T1533: Data from Local System'
id: 80773c46-e502-4fae-814b-5d244820c7d4
description: Investigate whether an adversary is searching local storage on managed mobile devices to
  collect sensitive data prior to exfiltration (MITRE ATT&CK T1533, Data from Local System). This playbook
  helps an analyst hunt across Android and iOS endpoints for applications that read files of interest
  and sensitive records, then stage or transmit them. It covers anomalous file-read behavior against sensitive
  directories (DCIM, Contacts, Documents, app-private databases, external storage), non-allowlisted access
  to credential stores (Android Keystore, iOS Keychain), creation of large archives in user-writable locations
  followed by suspicious egress, and installed apps holding statistically rare or toxic permission combinations.
  Detection guidance spans symbolic logic (allowlists, sensitive-source-to-network-sink flow rules, toxic-permission
  matching), statistical baselining (per-process read-rate and unique-path baselines, credential-API frequency,
  volume ratios and filename entropy, rare-permission scoring), and machine learning (sequence models,
  isolation forests, one-class SVM, provenance-graph tracing, archive classification, permission clustering)
  so an analyst can determine whether sensitive local data is being harvested from a mobile device.
type: technique
related:
- tactic_id: TA0035
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
