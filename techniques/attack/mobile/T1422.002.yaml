name: 'T1422.002: Wi-Fi Discovery'
id: cf3a8983-6917-476e-aefc-12174e8340cc
description: This playbook helps an analyst determine whether an adversary is attempting to discover Wi-Fi
  network information - network names (SSIDs), stored credentials, and nearby-network details - on managed
  mobile devices (Android, iOS) as reconnaissance to support ongoing or future Discovery (TA0032) and
  Credential Access campaigns (MITRE ATT&CK T1422.002). It addresses three complementary evidence classes.
  First, host/application telemetry showing a non-system, non-MDM app making anomalous calls to Wi-Fi
  configuration APIs (`WifiManager.getConfiguredNetworks()` on Android, `NEHotspotConfigurationManager.fetchConfigurations`
  on iOS) or requesting privileged permissions (`READ_PRIVILEGED_PHONE_STATE`, `ACCESS_FINE_LOCATION`),
  detected via allow-listing, statistical baselining of API call frequency, and ML classification of permission/API
  sequences. Second, network telemetry showing a device that, immediately after joining a new Wi-Fi network,
  scans the local subnet (many unique internal IPs/ports in a short window) - detected with Zeek scan
  notices, statistical burst detection, and density-based/one-class anomaly clustering. Third, correlated
  EDR-and-network telemetry showing a non-system process reading a Wi-Fi credential store (`/data/misc/wifi/wpa_supplicant.conf`
  on Android; iOS Keychain `com.apple.wifid` items) and then egressing to a suspicious (young, low-prevalence,
  high-entropy) domain - detected via source-to-sink correlation, domain scoring, and sequence-aware ML.
  Each question pairs a symbolic-logic, statistical, or machine-learning method with concrete pseudocode
  so a SOC analyst can confirm or refute Wi-Fi discovery and the transition from reconnaissance toward
  credential theft and exfiltration.
type: technique
related:
- tactic_id: TA0032
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
