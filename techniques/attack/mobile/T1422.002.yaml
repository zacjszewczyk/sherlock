questions:
- question: Has any non-system, non-MDM application on a managed mobile device called sensitive Wi-Fi
    configuration APIs - `WifiManager.getConfiguredNetworks()` on Android or `NEHotspotConfigurationManager.fetchConfigurations`
    on iOS - or requested/used privileged Wi-Fi permissions (`READ_PRIVILEGED_PHONE_STATE`, `ACCESS_FINE_LOCATION`)
    while not appearing on the approved allow-list of package names and code-signing certificates?
  context: This is the deterministic floor for T1422.002 on the device itself. Maintain an allow-list
    of application package names and their associated code-signing certificates that are authorized to
    query Wi-Fi configuration (typically the OS, the MDM agent, and a small set of approved connectivity
    apps). Any app outside this list that calls `getConfiguredNetworks` (Android) or `fetchConfigurations`
    (iOS) should raise a high-severity SIEM alert. In parallel, use application vetting/MDM to flag any
    non-system or non-MDM app that requests or uses privileged Wi-Fi permissions, per ATT&CK detection
    strategy DET0709. Requested permissions plus restricted/suspicious API calls are strong static discriminators
    of malicious Android apps (Drebin). Because this maps to Discovery, the rationale is that an adversary
    is enumerating stored SSIDs and network configuration to orient within the environment and to seed
    future Credential Access. A positive result is an unauthorized app touching Wi-Fi config APIs or holding
    privileged Wi-Fi permissions; a negative result is only allow-listed system/MDM apps doing so. Use
    emulation (Atomic Red Team) to generate labeled telemetry for tuning the allow-list and reducing false
    positives.
  answer_sources:
  - Mobile Device Management (MDM) API call logs
  - Mobile Endpoint Detection and Response (EDR) process activity logs
  - 'NAI: Corporate-managed mobile devices (iOS, Android), Mobile Device Management (MDM) Platform, Mobile
    EDR Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      ALLOW = set of (package_name, signing_cert) authorized for Wi-Fi config
      FOR each api_event WHERE api IN {getConfiguredNetworks(Android), fetchConfigurations(iOS)}:
        IF (api_event.package, api_event.cert) NOT IN ALLOW: ALERT(severity=HIGH, 'unauthorized Wi-Fi API query')
      FOR each app FROM app_vetting/MDM:
        IF app NOT system AND app NOT mdm AND app.permissions INTERSECT {READ_PRIVILEGED_PHONE_STATE, ACCESS_FINE_LOCATION}:
          FLAG(app, 'privileged Wi-Fi permission, per DET0709')
- question: For each application across the mobile fleet, does the number of Wi-Fi configuration API calls
    in any 5-minute window exceed that app's statistical baseline (mean + 3 sigma, the 99th percentile,
    or a robust modified Z-score > 3.5), or are there bursts of permission-denied/`SecurityException`
    responses to Wi-Fi API calls indicating an app probing APIs it lacks rights to use?
  context: 'Allow-listing catches unauthorized apps, but an authorized or trusted app that is abused,
    or a newly granted app, can still query Wi-Fi config at an anomalous rate. Ingest at least 30 days
    of MDM/EDR API call logs and, per application, baseline call frequency per 5-minute window: compute
    the mean (mu) and standard deviation (sigma) and alert at medium severity when a window exceeds mu
    + 3sigma or the 99th percentile. Prefer the robust modified Z-score (median/MAD, flag |score| > 3.5)
    because automation skews mu/sigma. Baseline both per-app and against the app''s peer group (UEBA),
    since network/process volume and rate are discriminative behavioral features on mobile (Andromaly).
    Separately count permission-denied / `SecurityException` responses to Wi-Fi API calls per app per
    window and alert on bursts - this failure-mode signal reveals an app probing Wi-Fi APIs it does not
    have rights to use. In Discovery terms, a sudden spike in Wi-Fi config enumeration is exactly the
    orientation behavior an adversary exhibits. A positive result is a window far above baseline or a
    burst of denials; a negative result is steady, baseline-consistent call rates.'
  answer_sources:
  - Mobile Device Management (MDM) API call logs
  - Mobile Endpoint Detection and Response (EDR) process activity logs
  - 'NAI: Corporate-managed mobile devices (iOS, Android), Mobile Device Management (MDM) Platform, Mobile
    EDR Platform'
  range: Last 90 days (require >=30 days of history to establish the per-app baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each app, window=5min over >=30d history:
        counts = calls_to_wifi_config_api per window
        median, mad = robust_stats(counts); mod_z = 0.6745*(x-median)/mad
        IF mod_z > 3.5 OR x > mu+3*sigma OR x > p99: ALERT(severity=MEDIUM, app, window)
        denials = count(SecurityException/permission_denied for wifi_api) per window
        IF denials > baseline_burst: ALERT(severity=MEDIUM, 'app probing Wi-Fi APIs it lacks rights to')
        ALSO compare counts vs app peer-group baseline (UEBA)
- question: Can a classifier trained on per-event features - rolling-window call frequency, the ordered
    sequence of Wi-Fi/API calls a process makes, granted permissions, install source (App Store vs sideloaded),
    and time-of-day - distinguish benign apps from apps performing Wi-Fi discovery, and does it flag any
    current app with high confidence?
  context: 'Symbolic and statistical rules miss obfuscated or slow-and-low discovery. From MDM/EDR logs,
    engineer features per API event: call frequency in rolling windows, the ordered sequence of API calls
    made by the process, permissions granted, install source (App Store vs sideloaded), and time-of-day.
    Train an explainable static classifier over permission/API features - a linear SVM surfaces the contributing
    features per verdict (Drebin) - alongside a behavioral sequence model that abstracts API calls to
    package/family and models Markov transitions for robustness to obfuscation and OS-version churn (MaMaDroid);
    low-probability call sequences can equivalently be flagged with an HMM (Warrender et al.). Score new
    activity in near real-time and require each alert to report its top-3 contributing features (SHAP)
    so analysts can triage. Tied to Discovery, this catches the adversary''s enumeration patterns even
    when individual calls look benign. A positive result is a high-confidence malicious verdict with explanatory
    features (e.g., sideloaded install + privileged permission + tight call sequence); a negative result
    is a confidently benign score.'
  answer_sources:
  - Mobile Device Management (MDM) API call logs
  - Mobile Endpoint Detection and Response (EDR) process activity logs
  - 'NAI: Corporate-managed mobile devices (iOS, Android), Mobile Device Management (MDM) Platform, Mobile
    EDR Platform'
  range: Last 90 days (train on a longer labeled corpus; score in near real-time)
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features per api_event = {rolling_call_freq, ordered_api_sequence(abstracted to package/family),
        granted_permissions, install_source(appstore|sideload), time_of_day}
      model_static = LinearSVM(permission/API features)   # explainable
      model_seq    = MarkovChain/HMM over abstracted call families  # MaMaDroid, robust to obfuscation
      score = combine(model_static, model_seq)
      IF score > threshold: ALERT(app, verdict, top3_features=SHAP(score))
- question: After a mobile device joins a new Wi-Fi network, has Zeek's built-in scan detection raised
    a `Scan::Address_Scan` or `Scan::Port_Scan` notice originating from an IP within the mobile DHCP scope,
    and can it be enriched with DHCP logs to resolve the offending device's hostname/MAC?
  context: 'Once an adversary has Wi-Fi access, a common next step is to map the local subnet. Enable
    and tune Zeek''s built-in scan detection (`scan.zeek`) and ingest `notice.log`; raise a high-severity
    alert on `Scan::Address_Scan` or `Scan::Port_Scan` notices originating from an IP in the mobile DHCP
    scope, enriching with DHCP logs to resolve hostname/MAC so the alert points to a specific device.
    Augment with ATT&CK-aligned Zeek analytics (BZAR) that emit Discovery-stage notices to corroborate
    host/MDM evidence. This is the network-side deterministic floor for Discovery from a mobile endpoint:
    a device should normally talk to the gateway, DNS, and a few services - not sweep dozens of internal
    hosts. A positive result is a scan notice tied to a mobile-scope IP shortly after a new-network association;
    a negative result is the absence of such notices. Resolving MAC/hostname via DHCP makes the finding
    actionable for response.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek icmp.log
  - DHCP Server Logs
  - Zeek weird.log
  - 'NAI: Corporate and guest Wi-Fi network segments, Network sensors (e.g., Zeek), DHCP servers'
  range: Last 90 days (pivot tightly around each new-Wi-Fi association event)
  queries:
  - technology: Zeek/pseudocode
    query: |-
      # scan.zeek enabled; read notice.log
      FOR each notice IN notice.log:
        IF notice.note IN {Scan::Address_Scan, Scan::Port_Scan} AND notice.src IN MOBILE_DHCP_SCOPE:
          dev = lookup_DHCP(notice.src) -> {hostname, mac}
          ALERT(severity=HIGH, dev, notice.note)
      # corroborate with BZAR Discovery-stage notices
- question: 'Within any 60-second window, does a mobile-scope source IP exceed the 30-day 95th-percentile
    baseline on two or more of: distinct destination IPs on the local subnet, distinct ICMP echo requests,
    Shannon entropy of destination ports, and total bytes/packets - or does its failed-to-successful first-contact
    connection ratio trip a Threshold Random Walk scanner verdict?'
  context: 'Zeek''s prebuilt scan thresholds can miss slow or low-volume sweeps. Using `conn.log` and
    `icmp.log`, group connections by source IP (`id.orig_h`) into 60-second tumbling windows and per window
    compute: (1) distinct destination IPs (`id.resp_h`) on the local subnet (frequency), (2) distinct
    ICMP echo requests, (3) Shannon entropy of destination ports (`id.resp_p`), and (4) total bytes/packets
    (volume). Establish a 30-day 95th-percentile baseline across the mobile IP range and alert at medium
    severity when a device exceeds two of these thresholds in one window. As a state/failure-mode signal,
    compute the failed-to-successful first-contact connection ratio (no-response/RST conn states) and
    apply Threshold Random Walk, which declares a scanner after only ~4-5 attempts because scanners generate
    a far higher failed ratio than benign clients (Jung et al.). This supports Discovery by catching deliberate
    enumeration that hides under per-rule thresholds. A positive result is a window breaching two baselines
    or a TRW scanner verdict; a negative result is normal, low-fanout connectivity.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek icmp.log
  - DHCP Server Logs
  - Zeek weird.log
  - 'NAI: Corporate and guest Wi-Fi network segments, Network sensors (e.g., Zeek), DHCP servers'
  range: Last 90 days (require >=30 days to set the 95th-percentile baseline)
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      FOR each src_ip IN MOBILE_RANGE, window=60s tumbling over conn.log+icmp.log:
        f1 = distinct(id.resp_h on local subnet); f2 = distinct(icmp_echo)
        f3 = shannon_entropy(id.resp_p); f4 = sum(bytes+packets)
        base = p95 over 30d per metric
        IF count(metric > base for metric in {f1,f2,f3,f4}) >= 2: ALERT(severity=MEDIUM, src_ip, window)
        # state signal: TRW on failed:successful first-contact (S0/REJ/RSTO) -> scanner after ~4-5 attempts
- question: When per-source-IP feature vectors are built from `conn.log` over 1-minute intervals (total
    bytes sent/received, packet count, SYN-to-FIN/RST ratio, unique destination IPs, unique destination
    ports, destination-port entropy), does density-based clustering (DBSCAN/HDBSCAN) or a one-class detector
    (Isolation Forest / One-Class SVM) isolate a mobile device's traffic as anomalous, and what are its
    top-3 contributing features?
  context: 'Threshold-based methods require hand-tuned cutoffs; unsupervised models adapt to the fleet''s
    normal behavior. From `conn.log`, build feature vectors per source IP in 1-minute intervals: total
    bytes sent/received, packet count, ratio of SYN to FIN/RST packets, unique destination IPs, unique
    destination ports, and destination-port entropy. Apply density-based clustering (DBSCAN/HDBSCAN) to
    isolate sparse anomalous clusters distinct from the dense normal-traffic cluster, or train a one-class
    detector (Isolation Forest / One-Class SVM) on benign behavior only - OCSVM is the more adversarially
    robust choice and supports LIME/SHAP attribution. Alert when a device''s activity is anomalous and
    report its top-3 contributing features so analysts can confirm scanning. This serves Discovery detection
    by surfacing fan-out/entropy patterns characteristic of subnet enumeration without fixed thresholds.
    A positive result is a device landing in a sparse anomalous cluster or scored as an outlier with scan-like
    contributing features; a negative result is membership in the dense benign cluster.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek icmp.log
  - DHCP Server Logs
  - Zeek weird.log
  - 'NAI: Corporate and guest Wi-Fi network segments, Network sensors (e.g., Zeek), DHCP servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      FOR each src_ip, interval=1min over conn.log:
        v = [bytes_sent, bytes_recv, packets, syn/(fin+rst), uniq_dst_ip, uniq_dst_port, port_entropy]
      model = DBSCAN/HDBSCAN(all v)  OR  OneClassSVM/IsolationForest(train on benign only)
      IF v is sparse_cluster OR outlier_score > threshold:
        ALERT(src_ip, top3_features=SHAP/LIME(v))
- question: Has a non-system/non-MDM process on a managed mobile device read a known Wi-Fi credential
    store - `/data/misc/wifi/wpa_supplicant.conf` on Android or an iOS Keychain item whose `kSecAttrService`
    contains `com.apple.wifid` - and then, within 5 minutes, connected from the same device to a domain/IP
    that matches a threat-intel indicator?
  context: This is the canonical source-to-sink (TaintDroid) pattern that elevates Wi-Fi discovery into
    Credential Access and likely exfiltration. Deploy a Mobile EDR rule that generates a critical alert
    on any read of known Wi-Fi credential stores (`/data/misc/wifi/wpa_supplicant.conf` on Android; iOS
    Keychain items with `kSecAttrService` containing `com.apple.wifid`) by a non-system/non-MDM process.
    Correlate that EDR alert in the SIEM with `dns.log`/`conn.log` from the same device within a 5-minute
    window, and escalate if the device then connects to an indicator on a threat-intel feed. Wi-Fi credential
    stores are explicit Credential-Access targets for T1422.002. A positive result is the credential-store
    read followed by egress to a known-bad destination; a negative result is the read alone with no suspicious
    follow-on connection (or no read at all). The temporal correlation makes this high-fidelity and directly
    actionable for containment.
  answer_sources:
  - Mobile EDR file integrity monitoring logs
  - Mobile EDR process or keychain access logs
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence platform data
  - 'NAI: Corporate-managed mobile devices, Network Egress Points (Firewall/Proxy), Internal DNS Resolvers,
    Mobile EDR Platform, Threat Intelligence Platform'
  range: Last 90 days (correlate EDR read with network egress within a 5-minute window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      EDR rule: ALERT(CRITICAL) WHEN process reads {/data/misc/wifi/wpa_supplicant.conf (Android)
        OR iOS keychain item kSecAttrService CONTAINS 'com.apple.wifid'} AND process NOT system/mdm
      SIEM correlate: for same device, JOIN edr_read WITH dns.log/conn.log WHERE t IN [read, read+5min]
        IF connected_dst IN threat_intel_feed: ESCALATE(severity=CRITICAL, source->sink confirmed)
- question: Following a Wi-Fi credential-store-access EDR alert, do any domains the device resolves/connects
    to in the next 5 minutes have organizational prevalence < 1%, age < 30 days, or domain-label Shannon
    entropy > 3.5 - and is the device's NXDOMAIN/failed-resolution rate elevated, suggesting an algorithmic
    or staged exfiltration channel?
  context: 'Threat-intel matching only catches known-bad infrastructure; adversaries use fresh, rarely-seen
    domains. On a credential-store-access EDR alert, query `dns.log`/`conn.log` for outbound connections
    in the next 5 minutes. For each resolved domain compute: (1) organizational prevalence S_p = (unique
    devices querying the domain in last 30 days) / (total unique devices), (2) domain age, and (3) Shannon
    entropy of the domain label. Alert at high severity when S_p < 0.01, age < 30 days, or entropy > 3.5.
    As a failure-mode signal, profile the device''s NXDOMAIN/failed-resolution rate, a distinct indicator
    of algorithmic/staged exfiltration channels (Nadler et al.). This pairs with the Credential Access
    focus: an app that just read Wi-Fi credentials and then beacons to a young, low-prevalence, high-entropy
    domain is likely exfiltrating. A positive result is a post-access connection to a domain breaching
    any threshold or a NXDOMAIN spike; a negative result is egress only to well-known, high-prevalence,
    established domains.'
  answer_sources:
  - Mobile EDR file integrity monitoring logs
  - Mobile EDR process or keychain access logs
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence platform data
  - 'NAI: Corporate-managed mobile devices, Network Egress Points (Firewall/Proxy), Internal DNS Resolvers,
    Mobile EDR Platform, Threat Intelligence Platform'
  range: Last 90 days (score domains seen within 5 minutes after a credential-store-access alert)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      ON credential_store_access_alert(device, t0):
        FOR each domain D resolved/connected in [t0, t0+5min] (dns.log/conn.log):
          S_p = uniq_devices_querying(D, 30d) / total_uniq_devices
          age = now - first_registration(D); H = shannon_entropy(label(D))
          IF S_p < 0.01 OR age < 30d OR H > 3.5: ALERT(severity=HIGH, device, D)
        IF nxdomain_rate(device) >> baseline: ALERT('algorithmic/staged exfil channel')
- question: Can a sequence-aware model classify correlated EDR+Zeek event chains - [process P starts ->
    P reads credential store -> P resolves domain D -> P connects to IP I] - as benign versus credential-theft-and-exfiltration,
    using features like process-name hash, file path, DNS query type, domain entropy/age, destination
    ASN reputation, and bytes transferred, and does it flag any current chain?
  context: 'Single-event rules miss the multi-step nature of credential theft followed by exfiltration.
    Correlate EDR and Zeek logs into event sequences [process ''P'' starts -> ''P'' reads credential store
    -> ''P'' resolves domain ''D'' -> ''P'' connects to IP ''I'']. Engineer features (process name hash,
    file path, DNS query type, domain entropy/age, destination ASN reputation, bytes transferred) for
    a sequence-aware model (LSTM/Transformer, or a package/family Markov model robust to obfuscation -
    MaMaDroid) trained to classify sequences as benign vs credential-theft-and-exfiltration, grounded
    in source-to-sink taint semantics (TaintDroid). Deploy on real-time sequences and surface the top-3
    contributing features per alert (SHAP). This directly targets the Credential Access objective behind
    Wi-Fi Discovery: stealing stored Wi-Fi credentials and moving them off-device. A positive result is
    a high-confidence malicious sequence with explanatory features (e.g., non-system process, Wi-Fi credential
    path, young high-entropy domain, large outbound bytes); a negative result is a confidently benign
    chain.'
  answer_sources:
  - Mobile EDR file integrity monitoring logs
  - Mobile EDR process or keychain access logs
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence platform data
  - 'NAI: Corporate-managed mobile devices, Network Egress Points (Firewall/Proxy), Internal DNS Resolvers,
    Mobile EDR Platform, Threat Intelligence Platform'
  range: Last 90 days (train on a longer labeled corpus; score correlated sequences in near real-time)
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      seq = [P.start -> P.read(cred_store) -> P.resolve(D) -> P.connect(I)] from EDR+Zeek
      features = {proc_name_hash, file_path, dns_qtype, domain_entropy, domain_age, dst_asn_reputation, bytes}
      model = LSTM/Transformer OR package/family MarkovChain (MaMaDroid)  # source->sink, TaintDroid
      score = model(seq)
      IF score == 'credential-theft-and-exfil': ALERT(device, top3_features=SHAP(score))
