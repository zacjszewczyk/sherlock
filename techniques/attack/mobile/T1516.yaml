name: 'T1516: Input Injection'
id: 9ed16ac4-af9c-466c-a297-8023aff0f58c
description: Investigate whether a malicious Android application is abusing accessibility or UI-automation
  APIs to inject input and act on behalf of the user (Input Injection). This playbook helps an analyst
  hunt for accessibility-enabled apps that dispatch programmatic clicks (performAction/dispatchGesture),
  global actions (GLOBAL_ACTION_BACK/HOME/RECENTS), or text insertion (ACTION_SET_TEXT) into the foreground
  UI of a different app without matching human touch, especially when the injecting app is backgrounded
  or foreground-service-only and the target is a sensitive-category app (banking, payments, identity,
  communications, enterprise access). It correlates on-device MobileEDR/MTD telemetry (OS API execution
  and application state) with MDM permission grants and app inventory, and with network egress observed
  in Zeek (conn, dns, ssl, x509, http, notice) to tie injected UI sequences and accessibility-captured
  content to C2 infrastructure and exfiltration. The playbook supports both Defense Evasion (abusing accessibility
  to perform actions on behalf of the user) and Impact (programmatically driving financial, messaging,
  or SSO apps to steal data or funds), and combines deterministic symbolic-logic checks (allowlists, trusted-I/O-path
  violations, threat-intel matching, taint/flow correlation) with statistical baselining (post-grant anomaly,
  periodicity, volume, failure-rate, and cadence profiling) and machine-learning classifiers (isolation
  forest, API-sequence Markov models, and supervised behavioral profiles) so accessibility abuse is caught
  even when each indicator alone is ambiguous.
type: technique
