questions:
- question: After an MDM or MobileEDR event grants an app the BIND_ACCESSIBILITY_SERVICE permission, does
    that same device, within the following 15 minutes, make any network connection whose destination FQDN,
    IP address, or JA3/JA3S TLS fingerprint matches known mobile-malware command-and-control threat intelligence?
  context: 'Supports the Defense Evasion goal of catching accessibility abuse at the moment privilege
    is obtained. The accessibility-grant-then-C2 sequence is the documented install pattern of banking
    trojans such as Gustuff: once granted, the app reaches back to its operator. Pivot on the grant event,
    then query Zeek dns.log, ssl.log, and conn.log for the next 15 minutes and match destination FQDNs,
    IPs, and JA3/JA3S hashes against mobile-malware C2 indicators, enriching with x509.log issuer/subject
    anomalies. TLS client/server-hello parameters reliably fingerprint and attribute malware C2 even on
    a single encrypted flow, so a match is high-confidence; a clean window does not clear the device and
    should be passed to the statistical and ML checks below.'
  answer_sources:
  - MDM permission grant logs
  - Zeek conn.log
  - Zeek notice.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network gateways, VPN terminators, Mobile Device Management (MDM) platform,
    and DNS resolvers used by mobile devices.'
  range: Last 90 days, with event-centered correlation in a 15-minute window after each accessibility-permission
    grant.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "grants = mdm_logs where permission == 'BIND_ACCESSIBILITY_SERVICE';\nfor g in grants:\n  flows\
      \ = zeek(dns.log,ssl.log,conn.log) where device==g.device and ts in [g.ts, g.ts+15min];\n  if flows.dst_fqdn\
      \ in ti_c2 or flows.dst_ip in ti_c2 or flows.ja3 in ti_c2 or flows.ja3s in ti_c2:\n    enrich with\
      \ x509.log issuer/subject anomalies;\n    alert(g.app, g.device, flow.dst, matched_indicator)."
- question: In the 15 minutes after an accessibility-service grant, do the device's network connections
    show statistical outliers versus its own 30-day baseline, such as destination-port entropy above the
    98th percentile, inter-arrival-time standard deviation under one second (machine periodicity), or
    DNS TXT query length/ratio above the 99th percentile (tunneling)?
  context: Adds an anomaly view for Defense Evasion when no threat-intel match exists, since custom or
    rotating C2 leaves no signature but still behaves unlike human-driven app traffic. Encrypted-flow
    byte/packet-sequence and inter-arrival statistics separate malware from benign apps without decryption.
    Derive per-device thresholds from each device's own history and recompute weekly, then in the post-grant
    window alert when destination-port entropy exceeds the device 98th percentile, inter-arrival stddev
    to any destination is under one second, or DNS TXT length/ratio exceeds the device 99th percentile.
    A positive result indicates automated, machine-cadence connectivity consistent with accessibility-abusing
    malware beaconing; a negative result means traffic stayed within the device's normal envelope.
  answer_sources:
  - MDM permission grant logs
  - Zeek conn.log
  - Zeek notice.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network gateways, VPN terminators, Mobile Device Management (MDM) platform,
    and DNS resolvers used by mobile devices.'
  range: Last 90 days, with event-centered correlation in a 15-minute window after each accessibility-permission
    grant; baselines recomputed weekly.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = per_device_baseline(conn.log,dns.log, last_30d);\nfor g in accessibility_grants:\n\
      \  win = flows(device=g.device, [g.ts, g.ts+15min]);\n  if port_entropy(win) > base.port_entropy.p98\n\
      \     or min(interarrival_stddev(win, dst)) < 1s\n     or dns_txt_len_ratio(win) > base.txt_len.p99:\n\
      \    alert(g.device, g.app, feature_violated, value)."
- question: In the post-grant window, do connection-failure signals for the device, such as NXDOMAIN rate,
    TLS handshake failures, HTTP 404/403 responses, and blocked-connection counts, exceed the device's
    99th-percentile baseline?
  context: 'Profiles a distinct failure-mode signature for Defense Evasion: accessibility-abusing trojans
    churn C2 domains and rotate dead-drops, so the moment after a grant frequently shows elevated failed
    lookups and failed connections as the malware tries stale or fast-fluxing infrastructure. Track NXDOMAIN
    rate, TLS handshake failures, HTTP 404/403, and blocked-connection counts in the post-grant window
    and alert when any exceeds the device 99th-percentile baseline. A spike of failures clustered right
    after the grant is corroborating evidence of malware reaching for C2; a flat failure profile argues
    the grant was benign.'
  answer_sources:
  - MDM permission grant logs
  - Zeek conn.log
  - Zeek notice.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network gateways, VPN terminators, Mobile Device Management (MDM) platform,
    and DNS resolvers used by mobile devices.'
  range: Last 90 days, with event-centered correlation in a 15-minute window after each accessibility-permission
    grant.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = per_device_failure_baseline(last_30d);\nfor g in accessibility_grants:\n  win = events(device=g.device,\
      \ [g.ts, g.ts+15min]);\n  nx = count(dns.log rcode==NXDOMAIN); tlsf = count(ssl.log handshake_fail);\n\
      \  httpf = count(http.log status in [403,404]); blk = count(conn.log blocked);\n  if nx>base.nx.p99\
      \ or tlsf>base.tlsf.p99 or httpf>base.httpf.p99 or blk>base.blk.p99:\n    alert(g.device, g.app,\
      \ {nx,tlsf,httpf,blk})."
- question: When post-grant network sessions are scored by a one-class anomaly model (Isolation Forest)
    trained on the device's 30-day baseline using duration, bytes, protocol, JA3/JA3S, certificate issuer,
    destination port, DNS query length, and time-of-day, are any sessions flagged as anomalous?
  context: Provides a multivariate, unsupervised view for Defense Evasion that catches accessibility-abuse
    C2 even when no single feature crosses a threshold. Train an Isolation Forest on 30-day per-device
    network baselines and score sessions in the 15-minute post-grant window across duration, bytes, protocol,
    JA3/JA3S, certificate issuer, destination port, DNS query length, and time-of-day, retraining on a
    time split to resist concept drift. Surface the top-3 contributing features (for example rare JA3,
    port entropy, byte volume) in the alert so the analyst can triage quickly. A high anomaly score on
    a post-grant session is meaningful evidence of automated malware traffic; a low score indicates the
    session resembled the device's normal behavior.
  answer_sources:
  - MDM permission grant logs
  - Zeek conn.log
  - Zeek notice.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network gateways, VPN terminators, Mobile Device Management (MDM) platform,
    and DNS resolvers used by mobile devices.'
  range: Last 90 days, with event-centered correlation in a 15-minute window after each accessibility-permission
    grant; model retrained on a time split.
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = IsolationForest().fit(per_device_baseline(last_30d,\n  feats=[duration,bytes,proto,ja3,ja3s,cert_issuer,dst_port,dns_qlen,tod]));\n\
      for s in sessions(device, [grant.ts, grant.ts+15min]):\n  score = model.anomaly_score(vector(s));\n\
      \  if score > threshold:\n    alert(device, grant.app, score, top3_features(model, vector(s)))."
- question: Did an accessibility or UI-automation app invoke performAction, dispatchGesture, performGlobalAction,
    or ACTION_SET_TEXT against another app's foreground UI while no human touch (MotionEvent) occurred
    within the touch-correlation threshold (for example no MotionEvent within 500 ms)?
  context: 'Directly answers the core Defense Evasion question of whether input is synthetic rather than
    human-driven. The defining property of injected input is that it violates the trusted I/O path: a
    programmatic action arrives with no corresponding physical touch on the screen. Alert when an accessibility/UI-automation
    app dispatches performAction, dispatchGesture, performGlobalAction, or ACTION_SET_TEXT at another
    app''s foreground UI while LastUserInteractionDelta exceeds the touch-correlation threshold (no MotionEvent
    within ~500 ms). A positive result is strong evidence the app is acting on behalf of the user without
    consent; a matched human touch within the window explains the action as legitimate interaction.'
  answer_sources:
  - MobileEDR OS API Execution telemetry (accessibility events)
  - MobileEDR Application State telemetry (foreground/background, last user interaction)
  - MDM permission grant logs
  - MDM application inventory logs
  - 'NAI: Mobile EDR/MTD agent telemetry on managed Android devices, MDM permission and app-inventory
    platform.'
  range: Last 90 days, with sub-second correlation between injected action and MotionEvent.
  queries:
  - technology: MobileEDR/Rule pseudocode
    query: "inj = osapi_events where api in ['performAction','dispatchGesture','performGlobalAction','ACTION_SET_TEXT']\n\
      \  and target_app != source_app and target_app == foreground_app;\nfor e in inj:\n  if last_motionevent_delta(e.device,\
      \ e.ts) > 500ms:\n    alert(e.source_app, e.target_app, e.api, e.device, delta)."
- question: Does any app that is NOT on the per-org approved accessibility/autofill allowlist hold BIND_ACCESSIBILITY_SERVICE
    and inject input into a sensitive-category foreground app?
  context: 'Enforces a deterministic allowlist for Defense Evasion: only a small set of apps (password
    managers, screen readers, OEM assistants) have a legitimate reason to use accessibility/autofill.
    Maintain a per-org allowlist, built and refreshed via app-store static analysis of which apps actually
    require accessibility privileges, and alert when any non-allowlisted app holds BIND_ACCESSIBILITY_SERVICE
    and injects input into a sensitive-category foreground app (banking, payments, identity, communications,
    enterprise access). A non-allowlisted injector targeting a sensitive app is a high-precision indicator
    of abuse; allowlisted apps acting in expected relationships are filtered out, keeping noise low.'
  answer_sources:
  - MobileEDR OS API Execution telemetry (accessibility events)
  - MobileEDR Application State telemetry (foreground/background, last user interaction)
  - MDM permission grant logs
  - MDM application inventory logs
  - 'NAI: Mobile EDR/MTD agent telemetry on managed Android devices, MDM permission and app-inventory
    platform.'
  range: Last 90 days
  queries:
  - technology: MobileEDR/Rule pseudocode
    query: "allow = org_accessibility_autofill_allowlist;  # from app-store static analysis\nfor e in\
      \ injection_events:\n  if e.source_app not in allow\n     and app_holds(e.source_app,'BIND_ACCESSIBILITY_SERVICE')\n\
      \     and category(e.target_app) in sensitive_categories:\n    alert(e.source_app, e.target_app,\
      \ e.api, e.device)."
- question: Using on-device taint/flow tracking, does content captured via accessibility (screen text
    or input fields) reach a network sink?
  context: Links accessibility-based input injection and screen-scraping to exfiltration, the payoff that
    turns Defense Evasion abuse into data loss. On-device taint tracking marks data read through accessibility
    APIs and follows it through the app until it reaches a network sink; when tainted screen text or field
    content is written to a socket, the app is demonstrably harvesting and exfiltrating what it observes.
    Alert on any such taint-to-sink flow originating from accessibility-captured content. A positive result
    is direct evidence of data theft via accessibility; absence of a flow means captured content has not
    yet been observed leaving the device.
  answer_sources:
  - MobileEDR OS API Execution telemetry (accessibility events)
  - MobileEDR Application State telemetry (foreground/background, last user interaction)
  - MDM permission grant logs
  - MDM application inventory logs
  - 'NAI: Mobile EDR/MTD agent telemetry on managed Android devices, MDM permission and app-inventory
    platform.'
  range: Last 90 days
  queries:
  - technology: MobileEDR/Rule pseudocode
    query: "tainted = data_read_via_accessibility(screen_text, input_fields);\nfor f in flows:\n  if reaches_network_sink(tainted,\
      \ f):\n    alert(f.source_app, f.dst, taint_label, e.device)."
- question: Per app and device, does the injected-action rate exceed the 99th-percentile baseline, or
    is the inter-action interval variance near zero (scripted automation), or do ACTION_SET_TEXT events
    show keystroke-interval variance far below human typing?
  context: Baselines injected-action cadence so scripted automation stands out for Defense Evasion. Humans
    produce variable, comparatively slow input; injected sequences fire at machine speed with near-constant
    intervals. Per app+device, baseline injected-action count per minute and inter-action interval, and
    alert when the injected-action rate exceeds the 99th-percentile baseline, when inter-action interval
    variance is near zero, or when ACTION_SET_TEXT keystroke-interval variance is far below human typing.
    Also profile the ratio of rejected/denied accessibility actions as a distinct failure-mode signal.
    A high-rate, low-variance burst is strong evidence of automation; human-like cadence argues against
    injection.
  answer_sources:
  - MobileEDR OS API Execution telemetry (accessibility events)
  - MobileEDR Application State telemetry (foreground/background, last user interaction)
  - MDM permission grant logs
  - MDM application inventory logs
  - 'NAI: Mobile EDR/MTD agent telemetry on managed Android devices, MDM permission and app-inventory
    platform.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = baseline(injected_action_rate, interval_variance) by app,device;\nfor (app,device)\
      \ in pairs:\n  rate = injected_actions_per_min(app,device,window);\n  iv = variance(inter_action_intervals);\n\
      \  kv = variance(keystroke_intervals for ACTION_SET_TEXT);\n  denied = rejected_actions/total_actions;\n\
      \  if rate>base.rate.p99 or iv~0 or kv << human_typing_var or denied>base.denied.p99:\n    alert(app,device,\
      \ {rate,iv,kv,denied})."
- question: When accessibility/UI-automation API-call transition sequences are modeled as Markov chains
    and classified (RF/SVM/KNN), or scored by a static feature classifier over permissions/APIs, is the
    app classified as malicious accessibility abuse?
  context: Provides a learned, obfuscation-resilient classifier for Defense Evasion that survives API
    churn. Model abstracted API-call transition sequences (Markov chains over accessibility/UI-automation
    calls) and classify apps with Random Forest/SVM/KNN, emitting the top-3 contributing call transitions
    in the alert. Complement with a static feature classifier that exposes the top contributing permissions/APIs
    (for example BIND_ACCESSIBILITY_SERVICE, SEND_SMS) for explainable triage. A high-confidence classification
    on a fleet app is meaningful evidence of accessibility abuse and should be confirmed with the synthetic-input
    and taint-flow checks above; a low score indicates benign behavioral structure.
  answer_sources:
  - MobileEDR OS API Execution telemetry (accessibility events)
  - MobileEDR Application State telemetry (foreground/background, last user interaction)
  - MDM permission grant logs
  - MDM application inventory logs
  - 'NAI: Mobile EDR/MTD agent telemetry on managed Android devices, MDM permission and app-inventory
    platform.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = accessibility_api_transition_sequence(app);\np_dyn = mamadroid_markov_classifier.score(seq);\
      \   # RF/SVM/KNN\np_static = drebin_static_classifier.score(app.permissions, app.apis);\nif p_dyn\
      \ > thr or p_static > thr:\n  alert(app, device, max(p_dyn,p_static), top3_transitions(seq), top_perms_apis(app))."
- question: Do connections from a mobile device to a known financial, enterprise SSO, or sensitive cloud
    service FQDN present TLS/HTTP parameters (JA3/JA3S hash, User-Agent) that are NOT on the allowlist
    for that service's legitimate mobile app?
  context: Supports the Impact goal of detecting automation impersonating a legitimate app to move funds
    or data. The TLS client-hello fingerprints the originating client/library, so a connection to a banking,
    SSO, or cloud FQDN that carries a JA3/JA3S or User-Agent not used by the real mobile app indicates
    a different, likely automated client. Maintain per-service allowlists of expected JA3/JA3S hashes
    and User-Agent strings and alert on connections to sensitive FQDNs that present non-allowlisted fingerprints.
    A mismatch is strong evidence of automation or a repackaged client abusing the service; an allowlisted
    fingerprint indicates the genuine app.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - Zeek http.log
  - MDM application inventory logs
  - 'NAI: Network segments for corporate and guest Wi-Fi, cloud service provider network ranges, known
    financial service IP blocks, and internet gateways.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "allow = per_service_fingerprint_allowlist;  # JA3/JA3S + User-Agent per legit app\nfor c in\
      \ ssl.log JOIN http.log where dst_fqdn in sensitive_services:\n  if c.ja3 not in allow[c.service]\
      \ or c.user_agent not in allow[c.service]:\n    alert(c.device, c.service, c.ja3, c.ja3s, c.user_agent)."
- question: Against per-user/service 30-day baselines, do connections to sensitive services show orig_bytes
    above the 99.5th percentile (volume), autocorrelation above 0.8 or inter-arrival stddev under one
    second (machine periodicity), or DNS TXT query lengths more than three standard deviations above the
    device daily average (tunneling)?
  context: 'Detects Impact-stage automation by its statistical fingerprint when content is encrypted.
    Automated transfer systems generate volume and timing patterns unlike human-driven app use: oversized
    single-session uploads, highly periodic beacons, and long DNS TXT queries used for tunneling. Build
    30-day baselines per user/service for orig_bytes, connection timing, and DNS TXT length, then alert
    on orig_bytes above the 99.5th percentile, autocorrelation above 0.8 or inter-arrival stddev under
    one second, or TXT lengths beyond three standard deviations of the device daily average. A positive
    result indicates machine-driven interaction with a sensitive service consistent with fraud automation;
    a negative result means traffic matched human-driven norms.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - Zeek http.log
  - MDM application inventory logs
  - 'NAI: Network segments for corporate and guest Wi-Fi, cloud service provider network ranges, known
    financial service IP blocks, and internet gateways.'
  range: Last 90 days, with per-user/service baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = baseline(orig_bytes, timing, dns_txt_len) by user,service, last_30d;\nfor c in conn.log\
      \ JOIN ssl.log JOIN dns.log where service in sensitive_services:\n  if c.orig_bytes > base.orig_bytes.p995\n\
      \     or autocorr(c.timing) > 0.8 or interarrival_stddev(c) < 1s\n     or dns_txt_len(c) > base.txt.mean\
      \ + 3*base.txt.std:\n    alert(c.user, c.service, feature_violated, value)."
- question: Do transaction-failure and authentication-failure signals to financial/SSO endpoints, such
    as failed-login bursts, repeated transaction-retry HTTP status codes, and blocked-connection counts,
    exceed the user's 99th-percentile baseline?
  context: Profiles the brute-force/retry footprint of Impact-stage automation. Automated transfer systems
    hammer login and transaction forms and retry failed actions, producing failure bursts that humans
    rarely generate. Track failed-login bursts, repeated transaction-retry HTTP status codes, and blocked-connection
    counts to financial/SSO endpoints and alert when rates exceed the user's 99th-percentile baseline.
    A burst of authentication or transaction failures to a sensitive endpoint is corroborating evidence
    of automated fraud activity; a normal failure profile argues against it.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - Zeek http.log
  - MDM application inventory logs
  - 'NAI: Network segments for corporate and guest Wi-Fi, cloud service provider network ranges, known
    financial service IP blocks, and internet gateways.'
  range: Last 90 days, with per-user baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = per_user_failure_baseline(last_30d);\nfor u in users:\n  lf = failed_login_burst(u,\
      \ financial_sso_endpoints);\n  rt = retry_status_codes(u);  blk = blocked_connections(u);\n  if\
      \ lf>base.lf.p99 or rt>base.rt.p99 or blk>base.blk.p99:\n    alert(u, endpoint, {lf,rt,blk})."
- question: Does a supervised model over session features (duration, bytes, protocol, JA3/JA3S, HTTP method,
    URI length, time-of-day) score a session to a sensitive service above 0.9 malicious probability, and
    does an on-device behavioral profile classifier confirm app-side automation?
  context: Provides a learned decision boundary for Impact-stage automation and pairs the network verdict
    with on-device confirmation. Train a supervised model on session features (duration, bytes, protocol,
    JA3/JA3S, HTTP method, URI length, time-of-day) and alert when malicious probability exceeds 0.9,
    surfacing the top-3 contributing features. Pair it with an on-device behavioral profile classifier
    (method-call/ICC/callback distributions) to confirm that the app itself is automating interaction.
    Agreement between the network and on-device classifiers is strong evidence of automated abuse of a
    sensitive service; disagreement warrants manual review.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - Zeek http.log
  - MDM application inventory logs
  - 'NAI: Network segments for corporate and guest Wi-Fi, cloud service provider network ranges, known
    financial service IP blocks, and internet gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = [duration,bytes,proto,ja3,ja3s,http_method,uri_len,tod];\np_net = session_classifier.predict_proba(feats(session));\n\
      p_dev = droidcat_profile_classifier.score(app_method_icc_callback_dist);\nif p_net > 0.9 and p_dev\
      \ > thr:\n  alert(session.device, session.service, p_net, p_dev, top3_features(session))."
- question: Did an accessibility app inject an ordered click/text/confirm sequence into a financial, payments,
    or crypto foreground app with no matching MotionEvent, especially with an injected GLOBAL_ACTION_BACK/HOME
    that dismisses a security or permission prompt?
  context: Targets the automated-transfer-system (ATS) behavior of accessibility banking trojans, the
    heart of the Impact tactic. The malicious app drives a full transaction workflow (login -> payee/amount
    entry -> confirm) programmatically while suppressing security prompts with injected global actions,
    all without human touch. Alert when an accessibility app injects an ordered click/text/confirm sequence
    into a financial/payments/crypto foreground app with no matching MotionEvent, especially when an injected
    GLOBAL_ACTION_BACK/HOME dismisses a security or permission prompt. Observing the ordered, touchless
    sequence into a money-moving app is high-confidence evidence of fraud automation; a sequence accompanied
    by genuine touches indicates legitimate user activity.
  answer_sources:
  - MobileEDR OS API Execution telemetry (accessibility events)
  - MobileEDR Application State telemetry
  - Zeek conn.log
  - Zeek ssl.log
  - MDM application inventory logs
  - 'NAI: Mobile EDR/MTD agent telemetry on managed Android devices and network egress for financial/SSO/cloud
    endpoints.'
  range: Last 90 days, with sub-second correlation between injected actions and MotionEvents over the
    transaction sequence.
  queries:
  - technology: MobileEDR/Rule pseudocode
    query: "txn_apps = category in ['banking','payments','crypto'];\nfor seq in ordered_injection_sequences(target\
      \ in txn_apps):\n  if seq matches [click..., set_text..., confirm] and no_motionevent(seq.window)\n\
      \     and any(a.api=='GLOBAL_ACTION_BACK' and dismisses_prompt(a) for a in seq):\n    alert(seq.source_app,\
      \ seq.target_app, seq.steps, seq.device)."
- question: Does accessibility-captured field content (credentials, OTP) from a sensitive app flow to
    a network sink?
  context: Links screen-scraping/input injection to fraud-enabling exfiltration, completing the Impact
    chain. When an accessibility app reads credentials or one-time passwords from a sensitive app's UI
    and that content then leaves the device, the operator gains what they need to authorize fraudulent
    transactions. Flag when accessibility-captured field content (credentials, OTP) from a sensitive app
    reaches a network sink, correlating on-device taint/flow tracking with Zeek egress to the destination.
    A positive result is direct evidence of credential/OTP theft enabling fraud; no observed flow means
    captured secrets have not yet been seen leaving the device.
  answer_sources:
  - MobileEDR OS API Execution telemetry (accessibility events)
  - MobileEDR Application State telemetry
  - Zeek conn.log
  - Zeek ssl.log
  - MDM application inventory logs
  - 'NAI: Mobile EDR/MTD agent telemetry on managed Android devices and network egress for financial/SSO/cloud
    endpoints.'
  range: Last 90 days, with event-centered correlation between accessibility capture and outbound flow.
  queries:
  - technology: MobileEDR/Rule pseudocode
