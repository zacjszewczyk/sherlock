questions:
- question: '[Symbolic Logic] Is any documented network-discovery API (WifiManager.getScanResults/startScan,
    BluetoothAdapter.startDiscovery/getBondedDevices, or TelephonyManager.getAllCellInfo/getNeighboringCellInfo)
    being invoked by an application whose package name, signing-certificate hash, or developer ID matches
    a mobile threat-intelligence feed or an MDM/UEM denylist?'
  context: Under the Discovery tactic, adversaries use known-malicious or risky apps to enumerate Wi-Fi,
    Bluetooth, and cellular context. This deterministic rule keys on ground-truth associations between
    a discovery API call and a flagged app identity. A positive result -- a denylisted package/cert/developer
    invoking a discovery API -- is a high-confidence detection warranting immediate isolation and app
    removal. A negative result does not exonerate the device, since novel or repackaged apps may not yet
    be in feeds; pair this with the behavioral and statistical checks. The deterministic API+permission
    ground truth is enumerated in MITRE ATT&CK T1421 and the Android WifiManager/TelephonyManager docs.
  answer_sources:
  - Mobile EDR API call telemetry
  - Android Logcat
  - UEM application state logs
  - MDM application inventory
  - MDM permission grant logs
  - Android AppOps permission-usage records
  - 'NAI: MDM/UEM platform, mobile EDR/MTD platform, SIEM/data lake, and managed mobile endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM mobile_api_telemetry

      WHERE api IN ("WifiManager.getScanResults","WifiManager.startScan","BluetoothAdapter.startDiscovery","BluetoothAdapter.getBondedDevices","TelephonyManager.getAllCellInfo","TelephonyManager.getNeighboringCellInfo")

      JOIN threat_intel ti ON app.package=ti.package OR app.cert_sha256=ti.cert OR app.developer_id=ti.dev

      OR app.package IN mdm_denylist

      ALERT severity=high, device, app.package, api'
- question: '[Symbolic Logic] Does an application hold the dangerous runtime permissions required for
    network discovery (ACCESS_FINE_LOCATION and, on Android 13+, NEARBY_WIFI_DEVICES for Wi-Fi scans;
    ACCESS_FINE_LOCATION for cell enumeration; NEARBY_DEVICES/BLUETOOTH_SCAN for Bluetooth discovery)
    in a way inconsistent with its declared category, and does an AppOps permission-USE event correlate
    with the discovery API call within seconds?'
  context: Discovery results are unobtainable without dangerous permissions, so permission grant plus
    near-simultaneous use is a strong precondition signal under the Discovery tactic. Correlating the
    AppOps USE event with the API call within seconds separates automated, background discovery from a
    user opening the Settings app. A positive result -- e.g., a flashlight or wallpaper app holding fine
    location and enumerating cells -- indicates category/permission mismatch and likely abuse. A negative
    (grant present but category-appropriate, or no tight correlation) lowers suspicion. See Android Permissions
    overview and MITRE ATT&CK T1421.
  answer_sources:
  - Mobile EDR API call telemetry
  - Android Logcat
  - UEM application state logs
  - MDM application inventory
  - MDM permission grant logs
  - Android AppOps permission-usage records
  - 'NAI: MDM/UEM platform, mobile EDR/MTD platform, SIEM/data lake, and managed mobile endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM appops_usage a JOIN api_telemetry b ON a.package=b.package AND a.device=b.device

      WHERE a.permission IN ("ACCESS_FINE_LOCATION","NEARBY_WIFI_DEVICES","NEARBY_DEVICES","BLUETOOTH_SCAN")

      AND abs(a.ts - b.ts) <= 5s

      AND b.api LIKE discovery_apis

      AND app.category NOT IN ("Networking","Navigation","System Tools")

      ALERT device, package, permission'
- question: '[Symbolic Logic] Is any app''s Wi-Fi scan-result retrieval exceeding the platform''s documented
    throttle of roughly 4 startScan calls per 2-minute window, or recurring while the app is backgrounded,
    indicating throttle evasion or abuse rather than normal foreground UX?'
  context: 'Android throttles foreground apps to ~4 startScan calls per 2-minute window; legitimate apps
    stay under this ceiling. Under the Discovery tactic, an app exceeding the ceiling or scanning while
    backgrounded is performing automated enumeration. This deterministic rule counts scans per app per
    rolling window and flags background state. A positive result is a defensible indicator of abuse; a
    negative means the app is within normal platform limits. Reference: Android WifiManager documentation.'
  answer_sources:
  - Mobile EDR API call telemetry
  - Android Logcat
  - UEM application state logs
  - MDM application inventory
  - MDM permission grant logs
  - Android AppOps permission-usage records
  - 'NAI: MDM/UEM platform, mobile EDR/MTD platform, SIEM/data lake, and managed mobile endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM api_telemetry WHERE api IN ("WifiManager.startScan","WifiManager.getScanResults")

      STATS count() AS scans BY package, device, window(2m)

      WHERE scans > 4 OR foreground=false

      ALERT device, package, scans'
- question: '[Symbolic Logic] Does the output of a discovery API (Wi-Fi scan results, cell-info, or bonded-device
    lists) propagate from the app to a network sink, and can the responsible app be attributed via information-flow
    tracking?'
  context: Treating discovery APIs as taint sources and network egress as sinks reveals exfiltration of
    enumerated network context -- the purpose of Discovery in service of later collection/exfiltration.
    Using dynamic information-flow instrumentation (TaintDroid pattern), a positive result is tainted
    discovery data reaching a socket/HTTP sink, strongly implying malicious harvesting. A negative result
    means discovery output stays local. Attribute the flow to the package and the destination.
  answer_sources:
  - Mobile EDR API call telemetry
  - Android Logcat
  - UEM application state logs
  - MDM application inventory
  - MDM permission grant logs
  - Android AppOps permission-usage records
  - 'NAI: MDM/UEM platform, mobile EDR/MTD platform, SIEM/data lake, and managed mobile endpoints.'
  range: Last 90 days
  queries:
  - technology: Mobile-DFA/pseudocode
    query: 'DEFINE sources = {getScanResults, getAllCellInfo, getBondedDevices}

      DEFINE sinks = {socket.write, HttpURLConnection, OkHttp}

      TRACK taint FROM sources TO sinks PER package

      IF tainted_flow EXISTS: ALERT package, source_api, sink, destination'
- question: '[Statistical Method] For each app, does the hourly count of discovery-API calls exceed its
    30-day 98th percentile or produce a MAD-based modified z-score above 3.5, and does the activity originate
    from a non-Networking/Navigation/System-Tools app or a long-running background process?'
  context: A robust statistical baseline detects discovery bursts and automation that fixed rules miss.
    Using a 30-day rolling baseline of hourly per-app call counts, alert when counts exceed the 98th percentile
    or when the modified z-score M=0.6745*(x-median)/MAD exceeds 3.5 -- MAD-based scoring resists skew
    from bursty automation. Escalate when the app category is not Networking/Navigation/System Tools or
    the call comes from a background process running >5 minutes. Derive cutoffs from your own fleet median/MAD.
    A positive result flags anomalous volume for analyst review; tune per app/category to control false
    alarms. See Modified Z-Score for anomaly detection.
  answer_sources:
  - Mobile EDR API call telemetry
  - Android Logcat
  - UEM application state logs
  - MDM application inventory
  - MDM permission grant logs
  - Android AppOps permission-usage records
  - 'NAI: MDM/UEM platform, mobile EDR/MTD platform, SIEM/data lake, and managed mobile endpoints.'
  range: Last 90 days (with a rolling 30-day per-app baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM api_telemetry WHERE api IN discovery_apis

      STATS count() AS c BY package, hour

      JOIN baseline b ON package (median, MAD, p98 over 30d)

      EVAL M = 0.6745*(c-b.median)/b.MAD

      WHERE c > b.p98 OR M > 3.5

      ESCALATE IF category NOT IN (Networking,Navigation,SystemTools) OR (background AND uptime>5m)

      ALERT package, c, M'
- question: '[Statistical Method] Do per-app Markov transition statistics over abstracted API-call sequences
    show transition mass into discovery packages (android.net.wifi, android.telephony, android.bluetooth)
    exceeding the per-category baseline?'
  context: Modeling API-call sequences as Markov transitions at package-level abstraction (MaMaDroid pattern)
    captures behavioral structure rather than a single call. Under the Discovery tactic, an app whose
    transition probabilities into discovery packages exceed its category baseline is behaving abnormally.
    Transition probabilities are interpretable, so the alert can name the abnormal transitions. A positive
    result indicates an unusual code path toward enumeration; a negative means call sequencing is typical.
  answer_sources:
  - Mobile EDR API call telemetry
  - Android Logcat
  - UEM application state logs
  - MDM application inventory
  - MDM permission grant logs
  - Android AppOps permission-usage records
  - 'NAI: MDM/UEM platform, mobile EDR/MTD platform, SIEM/data lake, and managed mobile endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'BUILD markov_transitions PER package OVER abstracted_api_seq(package-level)

      COMPUTE mass_into({android.net.wifi, android.telephony, android.bluetooth})

      COMPARE TO category_baseline

      WHERE mass > baseline_threshold

      ALERT package, abnormal_transitions'
- question: '[Statistical Method] Do continuously sampled on-device features (active network-connection
    count, packets sent/received, CPU, IPC/binder activity, process state) reveal backgrounded apps whose
    network-connection counts deviate from their baseline?'
  context: On-device behavioral monitoring (Andromaly pattern) samples system features over time to flag
    anomalies indicative of background discovery. Under the Discovery tactic, a backgrounded app whose
    active network-connection count departs from baseline is a candidate enumerator. A positive result
    is a deviating background app meriting investigation; a negative indicates resource/network behavior
    is within normal range. This complements API-level rules with system-level evidence.
  answer_sources:
  - Mobile EDR API call telemetry
  - Android Logcat
  - UEM application state logs
  - MDM application inventory
  - MDM permission grant logs
  - Android AppOps permission-usage records
  - 'NAI: MDM/UEM platform, mobile EDR/MTD platform, SIEM/data lake, and managed mobile endpoints.'
  range: Last 90 days
  queries:
  - technology: Mobile-EDR/Stats pseudocode
    query: 'SAMPLE features(active_conns, pkts_tx, pkts_rx, cpu, binder_ipc, proc_state) PER app interval=1m

      BASELINE per app

      WHERE proc_state=background AND zscore(active_conns) > threshold

      ALERT app, active_conns, deviation'
- question: '[Machine Learning] Does an explainable anomaly model (Local Outlier Factor / one-class) over
    features such as hour of day, app category, time since install, permission count, specific API called,
    call rate, and background flag rank an app''s discovery-API usage in the top 1% of anomaly scores,
    and which top-3 features and high-weight static indicators (e.g., ACCESS_FINE_LOCATION + getAllCellInfo
    + background service) drive that score?'
  context: Machine learning surfaces anomalous discovery usage that rules and simple baselines miss while
    remaining explainable for triage. Apply LOF or a one-class model over behavioral features and investigate
    the top 1% scores, surfacing the top-3 contributing features. Complement with an explainable linear-SVM
    static model over permissions + restricted/suspicious APIs (Drebin pattern) whose highest-weight features
    populate the alert. Prefer package-level abstraction, time-aware evaluation, and rolling re-baselining
    to resist drift. A positive result is a high-ranked, feature-explained anomaly for analyst review;
    a negative lowers but does not eliminate suspicion.
  answer_sources:
  - Mobile EDR API call telemetry
  - Android Logcat
  - UEM application state logs
  - MDM application inventory
  - MDM permission grant logs
  - Android AppOps permission-usage records
  - 'NAI: MDM/UEM platform, mobile EDR/MTD platform, SIEM/data lake, and managed mobile endpoints.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'FEATURES = [hour, category, days_since_install, perm_count, api, call_rate, background]

      model = LOF().fit(fleet_features)

      score = model.decision_function(app_features)

      IF score in top 1%: ALERT app, top3_features(score)

      static = linearSVM(permissions + suspicious_api_calls)

      INCLUDE highest_weight_features IN alert'
- question: '[Symbolic Logic] Within 5 minutes of a mobile discovery API event, does the device connect
    (per Zeek conn.log/dns.log joined by device IP) to a destination matching C2 threat intelligence,
    a domain registered within the last 30 days (WHOIS), or a direct-to-IP endpoint?'
  context: Joining discovery API events to network logs by device IP within a tight 5-minute window links
    enumeration to command-and-control or staging, bridging the Discovery tactic to adversary egress.
    A positive result -- discovery followed by a C2-matched, newly registered, or direct-to-IP connection
    -- is a high-confidence detection; escalate on WHOIS age <30 days or direct-to-IP. A negative means
    no suspicious destination correlated. API+permission ground truth from MITRE ATT&CK T1421.
  answer_sources:
  - Mobile EDR API call telemetry
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek notice.log
  - Firewall connection logs
  - Threat intelligence indicators
  - Passive DNS datasets
  - WHOIS records
  - 'NAI: Network gateways such as wireless access points and firewalls, DNS servers, SIEM/data lake infrastructure,
    and the threat intelligence platform.'
  range: 'Last 90 days (event-centered: +/- 5 minutes around each discovery call)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM discovery_events d JOIN zeek_conn c ON d.device_ip=c.src_ip AND c.ts BETWEEN d.ts AND
      d.ts+5m

      LEFT JOIN zeek_dns dn ON c.dst=dn.answer

      WHERE c.dst IN ti_c2 OR whois(domain).age_days < 30 OR is_direct_ip(c.dst)

      ALERT device, d.api, c.dst, severity=high'
- question: '[Symbolic Logic] After a discovery call, does the device issue a burst of connection attempts
    or ARP/DNS lookups to RFC1918 ranges or the local gateway (for example more than 20 distinct internal
    destinations within 2 minutes), matching the classic enumerate-then-probe sequence?'
  context: The enumerate-then-probe pattern -- discovery API followed by rapid internal scanning -- is
    a hallmark of Discovery preceding lateral movement. Alert when an app issues a burst of internal connection
    attempts/ARP/DNS to RFC1918 or the gateway (e.g., >20 distinct internal destinations in 2 minutes).
    Per-flow temporal features (Koumar et al. SFTS) separate this automated cadence from interactive traffic.
    A positive result is a strong lateral-discovery indicator; a negative means no internal probing burst
    followed.
  answer_sources:
  - Mobile EDR API call telemetry
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek notice.log
  - Firewall connection logs
  - Threat intelligence indicators
  - Passive DNS datasets
  - WHOIS records
  - 'NAI: Network gateways such as wireless access points and firewalls, DNS servers, SIEM/data lake infrastructure,
    and the threat intelligence platform.'
  range: 'Last 90 days (event-centered: 2-minute window after each discovery call)'
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM discovery_events d

      WINDOW [d.ts, d.ts+2m]

      COUNT DISTINCT dst WHERE dst IN RFC1918 OR dst=gateway AS internal_targets

      WHERE internal_targets > 20

      ALERT device, internal_targets'
- question: '[Statistical Method] In the 10 minutes after a discovery call, does DNS subdomain entropy
    exceed 4.2, is the destination seen by fewer than five devices in 30 days, does the failed-connection
    or blocked-egress ratio to a single destination exceed 90%, or do DNS NXDOMAIN responses spike above
    the device baseline?'
  context: 'Post-discovery failure-mode and rarity signals reveal C2 beaconing, DGA, and reconnaissance
    that succeed or fail noisily. Monitor the 10 minutes after each discovery call for high subdomain
    entropy (>4.2), rare destinations (<5 devices/30d), high failed/blocked-egress ratio (>90%), and NXDOMAIN
    spikes. Use adaptive, false-alarm-bounded thresholds derived per fleet rather than fixed limits. A
    positive result indicates risky post-discovery traffic worth deeper inspection; a negative means egress
    looks benign. Reference: Robust Anomaly Detection in Dynamic Networks.'
  answer_sources:
  - Mobile EDR API call telemetry
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek notice.log
  - Firewall connection logs
  - Threat intelligence indicators
  - Passive DNS datasets
  - WHOIS records
  - 'NAI: Network gateways such as wireless access points and firewalls, DNS servers, SIEM/data lake infrastructure,
    and the threat intelligence platform.'
  range: 'Last 90 days (event-centered: 10-minute window after each discovery call)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM discovery_events d

      WINDOW [d.ts, d.ts+10m]

      EVAL ent=subdomain_entropy(dns), rare=device_count(dst,30d), failratio=failed/total, nx=nxdomain_rate

      WHERE ent>4.2 OR rare<5 OR failratio>0.9 OR nx > baseline(device)

      ALERT device, dst, ent, failratio, nx'
- question: '[Statistical Method] Do post-discovery flows exhibit per-device egress volume (bytes), frequency
    (connections/min), and state (success/fail), and ~69 temporal flow features (packet-size/inter-arrival
    series, burstiness, periodicity) that deviate from interactive human traffic, indicating automation?'
  context: Automated post-discovery traffic differs measurably from human-driven flows. Baseline per-device
    egress volume, connection frequency, and success/fail state, then flag flows whose ~69 temporal features
    (Koumar et al. SFTS) indicate machine cadence -- regular inter-arrivals, periodicity, burstiness.
    Under the Discovery tactic, automated cadence after enumeration suggests scripted tooling/C2. A positive
    result is a flow profile inconsistent with interactive use; a negative means traffic resembles normal
    human behavior.
  answer_sources:
  - Mobile EDR API call telemetry
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek notice.log
  - Firewall connection logs
  - Threat intelligence indicators
  - Passive DNS datasets
  - WHOIS records
  - 'NAI: Network gateways such as wireless access points and firewalls, DNS servers, SIEM/data lake infrastructure,
    and the threat intelligence platform.'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'FROM zeek_conn POST discovery

      EXTRACT temporal_features(pkt_size_series, iat_series, burstiness, periodicity)

      BASELINE per device (bytes, conns_per_min, success_fail)

      WHERE feature_vector DEVIATES FROM interactive_profile

      ALERT device, flow, deviating_features'
- question: '[Machine Learning] Does a one-class SVM over outbound connections within 10 minutes of discovery
    (features: destination port, protocol, bytes, duration, JA3/JA3S) flag outliers, and for opaque TLS
    egress does a contrastive self-supervised flow model score flows as out-of-distribution from packet-size/timing/byte-ratio
    metadata without decryption?'
  context: Machine learning classifies anomalous post-discovery egress even when payloads are encrypted.
    A one-class SVM over connection metadata (port, protocol, bytes, duration, JA3/JA3S) flags outliers
    with the top-3 contributing features surfaced for triage. For TLS where payload is opaque, add a contrastive
    self-supervised model (ET-SSL pattern) that scores flows OOD from metadata without decryption or labels.
    A positive result is an outlier connection following discovery; a negative means the egress fits learned
    normal distribution. This anchors the Discovery-to-egress pivot in explainable ML.
  answer_sources:
  - Mobile EDR API call telemetry
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek notice.log
  - Firewall connection logs
  - Threat intelligence indicators
  - Passive DNS datasets
  - WHOIS records
  - 'NAI: Network gateways such as wireless access points and firewalls, DNS servers, SIEM/data lake infrastructure,
    and the threat intelligence platform.'
  range: 'Last 90 days (event-centered: 10-minute window after each discovery call)'
  queries:
  - technology: ML/pseudocode
    query: 'FEATURES = [dst_port, proto, bytes, duration, ja3, ja3s]

      ocsvm = OneClassSVM().fit(normal_post_discovery_flows)

      IF ocsvm.predict(flow) == outlier: ALERT flow, top3_features

      ssl_model = ContrastiveSSL(pkt_size, timing, byte_ratio)

      IF ssl_model.score(tls_flow) OOD: ALERT tls_flow'
