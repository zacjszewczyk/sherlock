name: 'T1421: System Network Connections Discovery'
id: 98988cf4-0c95-4fd8-8b5d-a34109e03472
description: 'Investigate potential System Network Connections Discovery on managed Android mobile devices,
  where an adversary or malicious application enumerates local or adjacent networks to orient within a
  compromised environment. This playbook helps an analyst detect applications that abuse device networking-context
  APIs (WifiManager scan results / current SSID-BSSID, BluetoothAdapter device discovery, and TelephonyManager
  cell-info enumeration) in a manner inconsistent with their normal UX: calls at anomalous frequency,
  from a backgrounded process, beyond the documented Wi-Fi scan throttle, or from an app whose category
  does not warrant network scanning. Detection fuses API execution telemetry (logcat/EDR) with permission
  grant and use (MDM/UEM, AppOps fine-location, nearby-devices/Bluetooth) and treats call rate, sequence,
  and background state as primary signals rather than the specific method name. The playbook further correlates
  discovery activity with subsequent network behavior (bursts of local RFC1918/gateway probing, connections
  to C2 or newly registered domains, direct-to-IP egress, high failed-connection ratios, and DNS NXDOMAIN
  spikes) to distinguish automated enumeration-then-probe tradecraft from benign user-initiated settings
  checks. It combines deterministic symbolic-logic rules, robust statistical baselining, and explainable
  machine-learning models so a SOC analyst can confirm, scope, and attribute the responsible app.'
type: technique
related:
- tactic_id: TA0032
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
