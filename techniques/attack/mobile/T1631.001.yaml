- question: After a ptrace POKETEXT/POKEDATA or SETREGS write/execute event, does a normally-quiet app/process
    initiate outbound connections it has never made before?
  context: 'Defense Evasion: the strongest network signal of masked execution is a previously-silent process
    suddenly egressing, because injected code inherits the host process''s identity and reputation. After
    a ptrace write/execute primitive (POKETEXT/POKEDATA or SETREGS), alert when an app/process that historically
    makes no (or few) outbound connections initiates connections to destinations it has never contacted
    — the network-deviation pattern characterized in Akamai''s network-anomaly injection research. A positive
    result is a quiet-process-turned-talker right after injection; correlate destination reputation and
    volume. A benign result is a process whose new connection matches its normal update/telemetry behavior.'
