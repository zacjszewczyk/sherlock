    query: "for each ptrace event e:\n  app = e.initiator\n  if app.sha256 in ti_hashes OR app.cert in\
      \ ti_certs OR app.bundle_id in blocklist:\n    alert 'ptrace from known-bad app' severity=high"
- question: In application vetting, do any APKs/IPAs import ptrace or process_vm_writev, or embed injection
    frameworks such as Frida gadgets, in their code or native libraries — and is that confirmed by dynamic
    syscall/binder reconstruction at runtime?
  context: 'Privilege Escalation: catching injection capability before deployment prevents the escalation
    entirely. During app vetting, statically flag apps whose DEX/native code imports ptrace or process_vm_writev
    or embeds known injection frameworks (e.g., Frida gadgets) using explainable static feature rules
    (Drebin-style), then confirm actual runtime use via dynamic syscall and binder-call reconstruction
    (CopperDroid-style). A positive result is an app with both the import and observed runtime ptrace
    behavior — block or quarantine it from the fleet; static-only hits warrant deeper sandbox review since
    legitimate debugging tools may also import these symbols.'
  answer_sources:
  - Android auditd log
  - iOS Unified Logs
  - MDM/EDR process telemetry
  - MDM application inventory log
  - 'NAI: Central SIEM aggregating Android auditd log streams from managed mobile endpoints; Mobile Device
    Management (MDM) platform containing application inventories.'
  range: Last 90 days
  queries:
  - technology: App-vetting/Static+Dynamic pseudocode
    query: "static: imports = parse_symbols(apk_or_ipa, native_libs)\n  if {'ptrace','process_vm_writev'}\
      \ & imports OR frida_gadget_signature in app:\n    flag_static\ndynamic: syscalls = reconstruct_syscalls_and_binder(sandbox_run(app))\n\
      \  if 'ptrace' in syscalls: confirm_runtime\n=> alert 'app embeds injection primitive' if flag_static\
      \ and confirm_runtime"
- question: Has any non-allowlisted app exceeded the 99th percentile of its own 30-day historical hourly
    ptrace call rate, particularly while targeting privileged processes?
  context: 'Privilege Escalation: a sudden surge in ptrace activity from an app that rarely uses it suggests
    injection probing or active exploitation. Build a 30-day per-app, per-device baseline of ptrace call
    counts and alert when a non-allowlisted app exceeds the 99th percentile of its historical hourly ptrace
    rate, weighting events that target privileged processes. Thresholds should be derived from your own
    fleet telemetry, following established short syscall-sequence and frequency-threshold baselining work.
    A positive result is an app spiking far above its normal ptrace cadence; correlate with target privilege
    and success/failure state to confirm escalation intent.'
  answer_sources:
  - Android auditd log
  - iOS Unified Logs
  - MDM/EDR process telemetry
  - MDM application inventory log
  - 'NAI: Central SIEM aggregating Android auditd log streams from managed mobile endpoints; Mobile Device
    Management (MDM) platform containing application inventories.'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for app,device: base = p99(hourly_ptrace_count over 30d)\nfor current hour h:\n  if app not\
      \ in allowlist and count(ptrace[app,device,h]) > base\n     and any(target.privileged):\n    alert\
      \ 'anomalous ptrace frequency spike'"
- question: Is any app generating a burst of FAILED ptrace attempts — EPERM returns (Yama ptrace_scope/CAP_SYS_PTRACE
    blocks) or avc:denied events — such as more than 5 failed attaches in 5 minutes, indicating injection
    probing?
  context: 'Privilege Escalation: failed ptrace is a distinct and valuable signal — repeated denials mean
    an app is trying to attach but being blocked by policy, which is exactly what early injection probing
    looks like. Count EPERM returns and avc:denied events per app per hour and alert on bursts (e.g.,
    >5 failed attaches in 5 minutes). Treating failures separately from successes (state anomaly modeling)
    catches attackers before a successful injection. A positive result is a probing burst — investigate
    the app and whether any attempt eventually succeeded; a single isolated EPERM is likely benign.'
  answer_sources:
