    shows up as low-probability transitions (MaMaDroid), and run a CNN over raw DEX API-method sequences
    (MalDozer) to flag apps likely to perform ptrace injection. A positive result is an app whose API-transition
    profile resembles known injectors — block or sandbox it before fleet deployment. These models generalize
    across obfuscation better than string signatures, but confirmed hits should still be validated dynamically.'
  answer_sources:
