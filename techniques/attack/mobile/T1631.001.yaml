name: 'T1631.001: Ptrace System Calls'
id: 50de7873-d600-4afa-b969-535bdc3195c9
description: 'Investigate whether an adversary is abusing ptrace (process trace) system calls on managed
  mobile devices (Android/iOS) to inject code into a live process — either to elevate privileges by attaching
  to a higher-privileged target or to evade process-based defenses by masking execution inside a legitimate
  application''s context. This playbook helps an analyst hunt for the ptrace injection primitive itself
  (PTRACE_ATTACH/SEIZE, PTRACE_POKETEXT/POKEDATA, PTRACE_SETREGS) in Android auditd and iOS unified-log/EDR
  telemetry, distinguish allowlisted debuggers from injection, weight SELinux process:ptrace denials and
  EPERM failures as high-fidelity escalation signals, and vet apps for ptrace/process_vm_writev imports
  and embedded injection frameworks. It then correlates ptrace events with downstream behavior: anomalous
  egress from a normally-quiet process (new ports/domains, high-entropy DNS, volume spikes, connections
  to known-bad infrastructure), failed/blocked connection bursts, and out-of-sequence audit/unified-log
  entries. Guidance spans symbolic-logic rules, statistical baselining (per-app ptrace frequency, n-gram/HMM
  syscall sequences, per-device network profiles), and machine-learning models (Isolation Forest, Random
  Forest, autoencoder ensembles, LSTM/DeepLog sequence models, and app-vetting API-sequence classifiers)
  — each surfacing explainable drivers so a SOC analyst can triage, confirm injection, and trace its privilege-escalation
  or defense-evasion intent.'
