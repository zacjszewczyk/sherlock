    as source/target UID/EUID, parent process, time of day, app signer, and allowlist status; alert when
    the predicted malicious probability exceeds 0.90 and include the top-3 contributing features for explainability.
    A positive result is a high-confidence malicious classification with interpretable drivers — escalate
    and contain. Periodically retrain with analyst-confirmed labels to keep precision high and adapt to
    new injection tooling.'
