  context: 'Defense Evasion: code injected via ptrace runs under a legitimate process and then often reaches
    out to attacker infrastructure, so a ptrace event tightly followed by a known-bad connection from
    the same device strongly implies injected code is operating covertly. Alert when a ptrace event occurs
    and the same device connects to a threat-intel domain/IP within a 5-minute window, joining ptrace
    telemetry with Zeek conn.log and dns.log on device/source attribution. A positive result links injection
    to C2 — isolate the device and capture the process context; the short window keeps the correlation
    high-fidelity.'
