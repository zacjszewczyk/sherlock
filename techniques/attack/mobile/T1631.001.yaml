questions:
- question: Does Android auditd or iOS/EDR telemetry show a ptrace system call (request in PTRACE_ATTACH/SEIZE,
    PTRACE_POKETEXT/POKEDATA, or PTRACE_SETREGS) targeting a process running as root/system (Android)
    or a privileged service (iOS), where the initiating process is NOT on the approved debugger/developer-tool
    allowlist?
  context: 'Privilege Escalation: ptrace attach combined with a write/execute primitive (POKETEXT/POKEDATA
    copy bytes into the target''s address space; SETREGS redirects the next instruction) against a higher-privileged
    target is the core ptrace code-injection chain for gaining elevated permissions. Trigger when auditd
    SYSCALL records show syscall=ptrace with the request argument (a0) in the attach/poke/setregs set,
    the target has euid root/system or is a privileged iOS service, and the initiator is not an allowlisted
    debugger. Record success vs. failure (return code, EPERM, SELinux avc:denied) and bytes written to
    the target. A positive result — a non-debugger writing into a privileged process — is a high-severity
    escalation signal warranting device isolation; a benign result is an allowlisted IDE/debugger attaching
    to its own child.'
  answer_sources:
  - Android auditd log
  - iOS Unified Logs
  - MDM/EDR process telemetry
  - MDM application inventory log
  - 'NAI: Central SIEM aggregating Android auditd log streams from managed mobile endpoints; Mobile Device
    Management (MDM) platform containing application inventories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "filter auditd SYSCALL where syscall==ptrace\n  and request(a0) in {PTRACE_ATTACH,PTRACE_SEIZE,PTRACE_POKETEXT,PTRACE_POKEDATA,PTRACE_SETREGS}\n\
      \  and target.euid in {root,system} OR target in privileged_ios_services\n  and initiator.app not\
      \ in debugger_allowlist\nrecord(return_code, EPERM, avc_denied, bytes_written)\n=> alert 'ptrace\
      \ inject into privileged target'"
- question: Are there Android kernel SELinux avc:denied records for the process:ptrace permission — for
    example an untrusted_app or isolated_app domain attempting to ptrace another SELinux domain — indicating
    a blocked cross-domain injection attempt?
  context: 'Privilege Escalation: on stock Android, cross-domain ptrace is blocked by SEAndroid policy
    and audited, so a process:ptrace denial is a high-fidelity privilege-escalation/injection signal rather
    than ordinary noise. Alert on kernel avc:denied records for process:ptrace where scontext is untrusted_app/isolated_app
    and tcontext is a different domain. Because policy normally forbids this, a denial means an app actively
    tried to attach across a security boundary. A positive result identifies the offending app/domain
    pair and should trigger app-reputation and on-device review; absence of denials does not rule out
    injection that succeeded within an allowed domain.'
  answer_sources:
  - Android auditd log
  - iOS Unified Logs
  - MDM/EDR process telemetry
  - MDM application inventory log
  - 'NAI: Central SIEM aggregating Android auditd log streams from managed mobile endpoints; Mobile Device
    Management (MDM) platform containing application inventories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "filter kernel audit where type==avc and result==denied\n  and permission=='ptrace' and class=='process'\n\
      \  and scontext in {untrusted_app,isolated_app}\n  and tcontext != scontext\n=> alert 'SELinux cross-domain\
      \ ptrace denial'"
- question: Do any ptrace events originate from an application whose hash, signing certificate, or bundle/package
    ID matches a malicious indicator from threat intelligence or an internal blocklist?
  context: 'Privilege Escalation: attributing a ptrace event to a known-bad app removes ambiguity and
    immediately raises severity. Flag ptrace events where the initiating app''s SHA-256 hash, code-signing
    certificate, or bundle/package identifier matches a malicious entry from threat-intel feeds or internal
    blocklists. This is a direct enrichment join on the initiator identity captured in the audit/EDR record.
    A positive result is a confirmed-bad app performing process injection — escalate and contain; a negative
    result simply means the app is not yet known-bad and other behavioral checks still apply.'
  answer_sources:
  - Android auditd log
  - iOS Unified Logs
  - MDM/EDR process telemetry
  - MDM application inventory log
