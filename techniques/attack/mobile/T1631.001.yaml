    query: "features = [src_uid,tgt_uid,src_euid,tgt_euid,tgt_privilege,parent_proc,\n            hour,app_signer,allowlist_status,ptrace_rate,success_ratio]\n\
      model = IsolationForest(train=benign ptrace events)\nscore = model.decision_function(event)\nif\
      \ score in top1pct(anomalies):\n  alert with top3_contributing_features(event)"
