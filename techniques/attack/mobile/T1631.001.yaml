- question: Do per-process system-call n-gram sequences contain a ptrace call introduced from an unusual
    call site, scoring as a low-probability sequence under an HMM model enriched with call-stack context?
  context: 'Privilege Escalation: legitimate debuggers issue ptrace from predictable code paths, whereas
    injected/exploit code introduces ptrace from anomalous call sites. Model per-process syscall n-gram
    sequences and score them with an HMM likelihood, flagging low-probability sequences that introduce
    ptrace unexpectedly; enriching HMM states with call-stack context separates benign debuggers from
    injection. A positive result is a statistically improbable syscall sequence containing ptrace from
    an unusual site — pivot to the process, its parent, and the target. Because this is sequence-based,
    it can catch novel injection that signature rules miss.'
  answer_sources:
  - Android auditd log
  - iOS Unified Logs
  - MDM/EDR process telemetry
  - MDM application inventory log
  - 'NAI: Central SIEM aggregating Android auditd log streams from managed mobile endpoints; Mobile Device
