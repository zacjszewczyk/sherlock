  queries:
  - technology: SIEM/ML pseudocode
    query: "model = HMM(train=benign per-process syscall n-grams + call_stack states)\nfor each process\
      \ seq containing ptrace:\n  ll = model.log_likelihood(seq)\n  if ll < low_prob_threshold and ptrace_from_unusual_callsite(seq):\n\
      \    alert 'anomalous syscall sequence with ptrace'"
- question: Does an Isolation Forest scoring per-event ptrace feature vectors (source/target uid/euid,
    target privilege, parent process, time of day, app signer, allowlist status, ptrace rate, success
    ratio) flag an event above the 99th-percentile anomaly score, and what are its top-3 contributing
    features?
  context: 'Privilege Escalation: ptrace abuse is multivariate — no single field is decisive, but the
    combination of caller identity, target privilege, timing, and rate is. Score per-event/per-device
    tabular feature vectors with an Isolation Forest and alert above the 99th-percentile anomaly score,
    surfacing the top-3 contributing features in the alert for explainability. A positive result is a
    high-scoring event with interpretable drivers (e.g., non-allowlisted signer + root target + off-hours
    + high success ratio) — triage immediately. The unsupervised approach needs no labels and adapts to
    your fleet''s normal ptrace behavior.'
  answer_sources:
  - Android auditd log
  - iOS Unified Logs
  - MDM/EDR process telemetry
  - MDM application inventory log
