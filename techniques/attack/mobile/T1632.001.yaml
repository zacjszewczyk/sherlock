name: 'T1632.001: Code Signing Policy Modification'
id: 670f4a1b-6f28-496a-8752-9ffd2437b10c
description: Investigate whether an adversary has modified code-signing or trust policies on managed mobile
  devices (Android and iOS) to permit execution or installation of applications signed with unofficial
  or unknown keys, thereby evading the platform's signed-code enforcement. Adversaries achieve this by
  granting the REQUEST_INSTALL_PACKAGES permission to non-store installers, abusing overlay + accessibility
  primitives (Input Injection / T1516) to silently flip 'install unknown apps' settings, planting rogue
  user-added CA certificates to enable TLS interception, or pushing unapproved iOS Configuration Profiles
  (including certificate/root payloads). This playbook helps an analyst correlate MDM permission-state
  changes, application inventory, certificate inventory, and configuration-profile inventory with network
  evidence (Zeek ssl/x509/http/files logs) to surface unauthorized installers, rogue trust anchors, and
  rogue profiles. It combines deterministic allowlist checks, statistical prevalence/long-tail and failure-mode
  baselining, and machine-learning classification/anomaly-detection to distinguish legitimate, highly-prevalent
  organizational policy objects from rare, attacker-introduced changes that weaken code-signing enforcement.
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has the REQUEST_INSTALL_PACKAGES permission been granted to any Android application package
    name that is not on the organizational allowlist of trusted installers (such as the Google Play Store,
    com.android.vending, or an approved enterprise app store)?
  context: 'Defense Evasion: The REQUEST_INSTALL_PACKAGES permission is the gate that lets an app act
    as an installer and sideload other APKs, bypassing store-level signing enforcement. Maintain an explicit
    allowlist of package names authorized to hold this permission, then query MDM logs for ''ApplicationPermissionStateChange''
    events where the permission is REQUEST_INSTALL_PACKAGES and the state is ''granted''. Any granted
    package not on the allowlist is a high-severity lead indicating an unauthorized installer that can
    deploy unsigned or unknown-key apps. Pre-screen candidate apps offline using the installer-API feature
    vocabulary (REQUEST_INSTALL_PACKAGES, INSTALL_PACKAGES, DexClassLoader, Runtime.exec) from Drebin
    and FlowDroid static taint flows reaching the PackageInstaller sink. A positive result is a non-allowlisted
    package holding the permission; a negative result is only the expected store installer.'
  answer_sources:
  - 'MDM Log: ApplicationPermissionStateChange'
  - 'MDM Asset Inventory: ApplicationList'
  - 'MDM Log: ApplicationInstallEvent'
  - 'NAI: Corporate-managed Android device fleet; MDM Management Server; Organizational App Store Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from MDM_logs where event=='ApplicationPermissionStateChange'\n  and permission=='REQUEST_INSTALL_PACKAGES'\
      \ and state=='granted'\n  and package_name not in installer_allowlist  // e.g. com.android.vending\n\
      => alert HIGH 'unapproved REQUEST_INSTALL_PACKAGES grant', enrich(package_name, device_id)"
- question: Does any managed Android app simultaneously hold both the overlay permission (SYSTEM_ALERT_WINDOW)
    and an active accessibility service (BIND_ACCESSIBILITY_SERVICE), and did that app appear within five
    minutes of a REQUEST_INSTALL_PACKAGES grant or an 'install_non_market_apps' setting change on the
    same device?
  context: 'Defense Evasion: The combination of overlay drawing plus an accessibility service is the Cloak
    & Dagger primitive that lets an app silently drive the Settings UI to enable unknown installers and
    grant install permissions without the user knowingly consenting — an Input Injection (T1516) path
    to code-signing-policy modification. From the MDM application inventory, deterministically flag any
    app holding both permissions. Raise severity when such an app is present in the same 5-minute window
    as an ApplicationPermissionStateChange granting REQUEST_INSTALL_PACKAGES or a Settings.Secure ''install_non_market_apps''
    state change on the same device, since that temporal correlation strongly suggests automated UI manipulation
    rather than a deliberate administrator action.'
  answer_sources:
  - 'MDM Log: ApplicationPermissionStateChange'
  - 'MDM Asset Inventory: ApplicationList'
  - 'MDM Log: ApplicationInstallEvent'
  - 'NAI: Corporate-managed Android device fleet; MDM Management Server; Organizational App Store Servers'
  range: Last 90 days; correlate within a 5-minute window around each permission/setting change event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from MDM_app_inventory as a\nwhere a.permissions superset {SYSTEM_ALERT_WINDOW, BIND_ACCESSIBILITY_SERVICE}\n\
      join MDM_logs e on e.device_id==a.device_id\nwhere (e.event=='ApplicationPermissionStateChange'\
      \ and e.permission=='REQUEST_INSTALL_PACKAGES')\n   or (e.setting=='install_non_market_apps' and\
      \ e.state=='changed')\nand abs(e.time - a.observed_time) <= 5min\n=> alert HIGH 'silent input-injection\
      \ setting flip (Cloak & Dagger)'"
- question: Among applications granted the REQUEST_INSTALL_PACKAGES permission, which ones are rare across
    the fleet — falling below the 5th percentile of installation prevalence (or installed on fewer than
    ~1% of devices / ≤5 devices in small fleets)?
  context: 'Defense Evasion: Legitimate installers (the store client) are highly prevalent, while attacker-introduced
    installers are rare. For each app holding REQUEST_INSTALL_PACKAGES, compute its fleet-wide prevalence
    as a percentage of devices on which it is installed, using a 90-day rolling baseline. Flag any such
    app whose prevalence is below the 5th percentile, applying an absolute floor (<1% of devices or ≤5
    devices) in small fleets. This long-tail prevalence-stacking approach (per the Office 365 frequency-analysis
    methodology) surfaces unusually rare and potentially unauthorized installers for review. A positive
    result is a low-prevalence installer; a negative result is a ubiquitous, expected installer.'
  answer_sources:
  - 'MDM Log: ApplicationPermissionStateChange'
  - 'MDM Asset Inventory: ApplicationList'
  - 'MDM Log: ApplicationInstallEvent'
  - 'NAI: Corporate-managed Android device fleet; MDM Management Server; Organizational App Store Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "installers = apps where permission_granted=='REQUEST_INSTALL_PACKAGES'\nfor each app in installers:\n\
      \  prevalence[app] = count(distinct devices with app) / total_devices\ncutoff = percentile(prevalence\
      \ over 90d, 5)\nflag app where prevalence[app] < max(cutoff, 0.01) or device_count <= 5\n=> review\
      \ 'rare installer holding REQUEST_INSTALL_PACKAGES'"
- question: Which devices or packages show an abnormal rate of BLOCKED, FAILED-verification, or granted-then-immediately-used
    non-allowlisted APK installs, indicating active attempts to defeat the code-signing policy even when
    no install ultimately succeeded?
  context: 'Defense Evasion: The failure mode is itself a strong signal of an adversary iterating to bypass
    signed-code enforcement. From MDM/PackageInstaller logs, count per-device and per-package install
    attempts that were blocked by policy, failed signature/verification, or involved a grant followed
    by an immediate sideload of a non-allowlisted APK. Establish a 30-day baseline of blocked-install
    counts per device; escalate any device exceeding mean + 3σ, or any device with ≥3 blocked sideload
    attempts within one hour. A positive result is a burst of blocked/failed installs concentrated on
    one device — evidence of repeated attempts to subvert the policy regardless of eventual success.'
  answer_sources:
  - 'MDM Log: ApplicationPermissionStateChange'
  - 'MDM Asset Inventory: ApplicationList'
  - 'MDM Log: ApplicationInstallEvent'
  - 'NAI: Corporate-managed Android device fleet; MDM Management Server; Organizational App Store Servers'
  range: Last 30 days for the baseline; alert on a 1-hour rolling window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from PackageInstaller_logs where result in {BLOCKED, FAILED_VERIFICATION}\n   or (granted_then_install\
      \ and apk not in apk_allowlist)\nbaseline mu,sigma = mean,std of daily blocked_count per device\
      \ over 30d\nalert when device.blocked_count > mu + 3*sigma\n   or count(blocked sideload, device,\
      \ window=1h) >= 3\n=> escalate 'active attempts to defeat code-signing policy'"
- question: When the model scores REQUEST_INSTALL_PACKAGES permission grants, which grants exceed a 0.8
    probability of being malicious, and what top-3 features (e.g., sideloaded source, very low prevalence,
    co-held accessibility permission) drive that score?
  context: 'Defense Evasion: A supervised classifier can rank permission grants by maliciousness more
    sensitively than a single rule. Train and deploy a logistic regression or linear-SVM model (as in
    Drebin) using features such as normalized application prevalence, one-hot application category, installation
    source (Google Play vs sideloaded), the count of other high-risk permissions, abstracted API-call
    transition features (per MaMaDroid), and a binary MDM-managed flag. A probability > 0.8 generates
    an investigation ticket. Every alert must list the top-3 contributing features via SHAP/LIME so an
    analyst can triage quickly. Evaluate and retrain time-ordered using the AUT(F1) metric from TESSERACT
    to counter concept drift. A positive result is a high-probability grant with intuitive contributing
    features pointing to an unauthorized installer.'
  answer_sources:
  - 'MDM Log: ApplicationPermissionStateChange'
  - 'MDM Asset Inventory: ApplicationList'
  - 'MDM Log: ApplicationInstallEvent'
  - 'NAI: Corporate-managed Android device fleet; MDM Management Server; Organizational App Store Servers'
  range: Last 90 days; retrain on time-ordered windows to control concept drift
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [prevalence_norm, onehot(category), source(play|sideload),\n            high_risk_perm_count,\
      \ mamadroid_api_transitions, mdm_managed_flag]\np = logistic_regression.predict_proba(features)\
      \  // or linear-SVM\nif p > 0.8: ticket('likely malicious REQUEST_INSTALL_PACKAGES grant',\n   \
      \                 top3=shap_explain(features))\nvalidate model with AUT(F1) time-ordered (TESSERACT)"
- question: Has any user-added CA certificate appeared on an Android device whose SHA-256 thumbprint is
    not on the organizational allowlist of approved, user-installable CA certificates — and is that certificate
    self-signed or absent from public Certificate Transparency logs?
  context: 'Defense Evasion: A rogue user-added root CA lets an adversary intercept TLS and can underpin
    trust modifications that weaken code-signing assurances. Maintain an allowlist of SHA-256 thumbprints
    for approved user-installable CA certificates, query the MDM inventory on a recurring basis, and raise
    a high-severity alert for any thumbprint not on the allowlist. Enrich each finding with two deterministic
    checks: (1) is the certificate self-signed (issuer == subject), and (2) is it absent from public Certificate
    Transparency logs (no valid SCT per RFC 6962) — either condition strongly indicates a locally injected
    interception root. Pivot to Zeek ssl.log/x509.log to find TLS sessions in the last 24 hours where
    the device validated against the suspect CA''s issuer/subject string. A positive result is a non-allowlisted,
    self-signed or non-public root in active use.'
  answer_sources:
  - 'MDM Asset Inventory: DeviceCertificateList'
  - 'MDM Compliance Log: CertificateInstallEvent'
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Corporate-managed Android device fleet; MDM Management Server; Public Key Infrastructure (PKI)
    Servers; Network Egress/Inspection Points'
  range: Last 90 days; pivot to TLS sessions in the last 24 hours after a hit
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from MDM_inventory.user_added_CAs

      where sha256_thumbprint not in approved_CA_allowlist

      enrich self_signed = (issuer == subject)

      enrich no_ct = absent_from_certificate_transparency(cert)  // no valid SCT, RFC 6962

      alert HIGH when self_signed or no_ct

      pivot Zeek ssl.log/x509.log on issuer/subject within last 24h'
  - technology: Zeek/pseudocode
    query: 'from x509.log where certificate.issuer == suspect_issuer

      join ssl.log on cert_chain_fuids

      => list device sessions validating against rogue CA'
- question: Do any newly detected, non-allowlisted CA certificates exhibit high distinguished-name Shannon
    entropy (>4.0), an anomalous validity period (e.g., >3650 days or oddly short), and low fleet-wide
    prevalence (<1% of devices)?
  context: 'Defense Evasion: Attacker-generated interception roots often carry randomized DN strings,
    unusual validity windows, and exist on very few devices, unlike legitimate organizational roots. For
    each newly detected, non-allowlisted CA certificate, compute the Shannon entropy of its Subject and
    Issuer DN fields, its validity-period length in days, and its fleet-wide installation prevalence.
    Escalate certificates that combine high DN entropy (>4.0, indicating randomized strings), an anomalous
    validity period (>3650 days or unusually short), and low prevalence (<1% of devices). This rests on
    the long-tail prevalence approach and the public-log auditability model of Certificate Transparency.
    A positive result is a rare, high-entropy, oddly-dated certificate warranting review as a likely injected
    root.'
  answer_sources:
  - 'MDM Asset Inventory: DeviceCertificateList'
  - 'MDM Compliance Log: CertificateInstallEvent'
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Corporate-managed Android device fleet; MDM Management Server; Public Key Infrastructure (PKI)
    Servers; Network Egress/Inspection Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each cert in new_non_allowlisted_CAs:\n  dn_entropy = shannon(cert.subject_dn) , shannon(cert.issuer_dn)\n\
      \  validity_days = cert.notAfter - cert.notBefore\n  prevalence = devices_with(cert) / total_devices\n\
      flag when dn_entropy > 4.0 and (validity_days > 3650 or validity_days < min_norm)\n         and\
      \ prevalence < 0.01\n=> escalate 'high-entropy low-prevalence CA certificate'"
- question: Has any single device shown a spike in successful TLS validations against a newly-installed,
    non-public CA (or a sudden drop in expected CA-pinning failures), exceeding its 30-day mean + 3σ baseline?
  context: 'Defense Evasion: Once a rogue root is installed, active interception manifests as a surge
    of TLS sessions successfully validating against a non-standard issuer, or as the disappearance of
    normal pinning failures. From Zeek ssl.log, baseline each device''s rate of sessions with validation_status
    != ''ok'' and the count of distinct server_name values validated against a non-standard issuer. Alert
    when a device''s deviation exceeds its 30-day mean + 3σ — particularly a spike in successful validations
    against a newly-installed, non-public CA. A positive result is a device whose TLS-validation behavior
    changes sharply in a way consistent with interception enabled by a rogue root.'
  answer_sources:
  - 'MDM Asset Inventory: DeviceCertificateList'
  - 'MDM Compliance Log: CertificateInstallEvent'
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Corporate-managed Android device fleet; MDM Management Server; Public Key Infrastructure (PKI)
    Servers; Network Egress/Inspection Points'
  range: Last 90 days; per-device baseline over 30 days
  queries:
  - technology: Zeek/pseudocode
    query: "from ssl.log group by device_ip\nmetric_a = rate(validation_status != 'ok')\nmetric_b = count(distinct\
      \ server_name validated vs non_standard_issuer)\nbaseline mu,sigma over 30d per device\nalert when\
      \ today.metric_b > mu + 3*sigma\n      or sudden_increase(successful validations vs new_nonpublic_CA)\n\
      => 'TLS validation-failure/interception spike'"
- question: When the anomaly model scores user-added CA certificates against a profile of known-good organizational
    certificates, which certificates land in the top 1% anomaly band, and what top-3 features (e.g., self-signed,
    7300-day validity, zero SANs) explain the score?
  context: 'Defense Evasion: An unsupervised model can flag rogue roots that differ structurally from
    the approved certificate population. Train an Isolation Forest (or the more adversarially robust One-Class
    SVM) on attributes of known-good, organizationally approved certificates: validity period in days,
    public-key algorithm and size, Subject and Issuer string lengths, number of Subject Alternative Names,
    and a self-signed flag. Certificates scoring in the top 1% anomaly require manual review, and each
    alert must surface the top-3 contributing features via LIME/SHAP. A positive result is a certificate
    whose structural features (self-signed, extreme validity, no SANs) place it far outside the trusted
    baseline — a likely injected interception root.'
  answer_sources:
  - 'MDM Asset Inventory: DeviceCertificateList'
  - 'MDM Compliance Log: CertificateInstallEvent'
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Corporate-managed Android device fleet; MDM Management Server; Public Key Infrastructure (PKI)
    Servers; Network Egress/Inspection Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "train IsolationForest (or OneClassSVM) on approved_certs:\n  features = [validity_days, pubkey_alg,\
      \ pubkey_size,\n              len(subject), len(issuer), san_count, self_signed]\nscore = model.anomaly_score(cert)\n\
      if score in top 1%: review(cert, top3=shap_explain(features))"
- question: Has any iOS device installed a Configuration Profile whose PayloadIdentifier (or PayloadUUID)
    is not on the approved allowlist for the device's management group — especially one that was user-installed
    rather than MDM-pushed, or that contains a certificate/root payload?
  context: 'Defense Evasion: An unapproved iOS Configuration Profile can install root certificates, alter
    trust, or relax security settings, directly modifying code-signing/trust posture. For each device
    management group, maintain an allowlist of approved Configuration Profile PayloadIdentifier (and PayloadUUID)
    values, run a periodic query against the MDM ProfileList inventory, and alert on any installed profile
    identifier not on the group''s allowlist. Using the Apple Configuration Profiles payload vocabulary,
    raise severity when (a) the profile was user-installed rather than MDM-pushed (no managed flag) or
    (b) it contains a certificate payload (PayloadType com.apple.security.root / .pem / SCEP) — a direct
    code-signing-trust modification. Correlate the device IP with Zeek http.log/files.log to identify
    the .mobileconfig download origin. A positive result is a non-allowlisted, user-installed, or certificate-bearing
    profile.'
  answer_sources:
  - 'MDM Asset Inventory: DeviceProfileList'
  - 'MDM Compliance Log: ProfileInstallEvent'
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Corporate-managed iOS device fleet; MDM Management Server; Apple Push Notification service (APNs)
    infrastructure; Network Egress/Inspection Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from MDM.ProfileList\nwhere PayloadIdentifier not in group_allowlist[device.group]\nalert;\
      \ raise_severity when (not managed_flag)  // user-installed\n  or PayloadType in {com.apple.security.root,\
      \ .pem, com.apple.security.scep}\npivot Zeek http.log/files.log on device_ip for .mobileconfig download\
      \ origin"
- question: Were any iOS Configuration Profiles installed at anomalous times (e.g., off-hours such as
    3 AM on a weekend, modified Z-score |Mz| > 3.5) or with long-tail PayloadIdentifiers present on fewer
    than 1% of devices?
  context: 'Defense Evasion: Legitimate organizational profiles are pushed during business hours and are
    highly prevalent, whereas adversary profiles tend to be installed off-hours and are rare. From MDM
    logs, extract the installation timestamp for every configuration profile across the fleet and build
    a baseline distribution of installs per hour for each day-of-week over 90 days; apply a modified Z-score
    test and flag installs with |Mz| > 3.5. Independently compute fleet-wide prevalence of each PayloadIdentifier
    and flag long-tail identifiers (<1% of devices), per the Office 365 frequency-analysis approach. A
    positive result is an off-hours and/or rare profile install that deviates from normal IT deployment
    patterns.'
  answer_sources:
  - 'MDM Asset Inventory: DeviceProfileList'
  - 'MDM Compliance Log: ProfileInstallEvent'
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Corporate-managed iOS device fleet; MDM Management Server; Apple Push Notification service (APNs)
    infrastructure; Network Egress/Inspection Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline installs_per_hour by day_of_week over 90d

      Mz = 0.6745*(x - median)/MAD

      flag install where abs(Mz) > 3.5  // e.g., 3AM weekend

      prevalence[pid] = devices_with(pid)/total_devices

      flag pid where prevalence[pid] < 0.01  // long-tail identifier

      => review ''off-hours or rare profile install'''
- question: Which devices show repeated profile install FAILURES, signature/trust validation errors, or
    rapid install-then-remove sequences, followed by a successful unsigned or user-installed profile —
    exceeding the per-device mean + 3σ baseline?
  context: 'Defense Evasion: An adversary iterating to defeat profile-signing policy leaves a trail of
    failed installs and trust-validation errors before a successful unsigned profile lands. From MDM ProfileInstallEvent
    logs, track per-device counts of profile install failures, signature/trust validation errors, and
    rapid install-then-remove sequences. Baseline per device and alert above mean + 3σ. The decisive pattern
    is repeated failures culminating in a successful unsigned or user-installed profile on the same device.
    A positive result is a device with a burst of failed/removed profile installs preceding an unsigned
    success — evidence of active policy circumvention.'
  answer_sources:
  - 'MDM Asset Inventory: DeviceProfileList'
  - 'MDM Compliance Log: ProfileInstallEvent'
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Corporate-managed iOS device fleet; MDM Management Server; Apple Push Notification service (APNs)
    infrastructure; Network Egress/Inspection Points'
  range: Last 90 days; per-device baseline mean + 3σ
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from MDM.ProfileInstallEvent group by device_id\nfail_count = count(result in {FAILED, TRUST_VALIDATION_ERROR})\n\
      churn = count(install followed by remove within short window)\nbaseline mu,sigma per device\nalert\
      \ when fail_count > mu + 3*sigma\n  and exists(subsequent unsigned/user-installed profile success)\n\
      => 'iterating to defeat profile policy'"
- question: Does the fleet-wide hourly count of new Configuration Profile installations show an anomalous
    spike (Seasonal-ARIMA/Prophet) that does not match a scheduled IT change request, and do any individual
    profiles score as Isolation Forest anomalies on their metadata?
  context: 'Defense Evasion: A coordinated push of rogue profiles, or a single anomalous profile, can
    be caught by combining time-series forecasting with per-profile anomaly scoring. Implement a time-series
    anomaly model (Seasonal-ARIMA or Prophet) on the aggregate count of new profile installations per
    hour across the fleet; a flagged spike that does not correlate with a scheduled IT change request
    triggers a high-severity, fleet-wide alert. In parallel, score individual profiles with an Isolation
    Forest over metadata (payload count, presence of cert/VPN/restriction payloads, signing status, organization-string
    length), surfacing the top-3 contributing features via SHAP. Validate detection thresholds time-ordered
    using the AUT(F1) discipline of TESSERACT. A positive result is an unexplained install spike and/or
    a structurally anomalous profile.'
  answer_sources:
  - 'MDM Asset Inventory: DeviceProfileList'
  - 'MDM Compliance Log: ProfileInstallEvent'
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Corporate-managed iOS device fleet; MDM Management Server; Apple Push Notification service (APNs)
    infrastructure; Network Egress/Inspection Points'
  range: Last 90 days; hourly aggregation for the time-series model
  queries:
  - technology: SIEM/ML pseudocode
    query: "ts = hourly_count(new_profile_installs, fleet)\nmodel = SeasonalARIMA(ts)  // or Prophet\n\
      if observed > forecast_upper and not matches(scheduled_change_request):\n    alert HIGH 'anomalous\
      \ fleet-wide profile install spike'\niforest over [payload_count, has_cert, has_vpn, has_restriction,\n\
      \              signing_status, len(org_string)]\nif score top 1%: review(profile, top3=shap_explain())\n\
      validate thresholds AUT(F1) time-ordered (TESSERACT)"
