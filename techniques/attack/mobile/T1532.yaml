name: 'T1532: Archive Collected Data'
id: 2eea67bd-e3db-40cd-8c55-9251e613a1ff
description: 'This playbook helps an analyst investigate whether an adversary is compressing and/or encrypting
  data collected on corporate mobile devices (Android and iOS) prior to exfiltration, consistent with
  MITRE ATT&CK T1532 (Archive Collected Data) under the Collection tactic. Archiving and encryption are
  performed before exfiltration to obfuscate contents, minimize network footprint, and evade defender
  inspection. The investigation focuses on three observable behaviors: (1) non-allowlisted applications
  that hold sensitive-data permissions creating archive-like or high-entropy files (by content, not just
  extension), optionally followed by large outbound transfers; (2) processes consuming anomalous CPU,
  memory, and disk I/O while the device screen is off, inconsistent with the app''s declared role; and
  (3) ordered API-call chains that read sensitive data, then compress/encrypt it, then open a network
  socket while backgrounded. The playbook combines deterministic symbolic-logic rules, statistical baselining,
  and machine-learning models to surface staging-to-exfiltration behavior on managed mobile endpoints,
  using MTD/MDM telemetry and Zeek network correlation.'
type: technique
related:
- tactic_id: TA0035
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did an application that is NOT on the backup/file-management utility allowlist create an archive
    or encrypted file (.zip/.rar/.7z/.tar.gz or a high-entropy blob) while holding permissions to sensitive
    data such as Contacts, Photos, or Microphone, or while declaring no backup/sync/export role?
  context: Adversaries archive collected data prior to exfiltration to obfuscate contents and reduce network
    footprint (Collection, TA0035). A deterministic on-device rule should fire when a newly created file
    is archive-like or high-entropy AND the creating app is not on an approved backup/utility allowlist
    AND the app either holds sensitive-data permissions or declares no legitimate backup/sync/export role.
    Enrich with threat-intelligence denylists. Drebin-style static predicates (suspicious zip/crypto API
    use, requested permissions, app role) should be surfaced in the alert so the analyst can see which
    predicates matched. A positive result is an app with no legitimate reason to package data doing so;
    a benign result is typically a known backup, cloud-sync, or media-editing app.
  answer_sources:
  - MTD file_creation.log
  - MDM application_inventory.log
  - Zeek files.log
  - Zeek conn.log
  - Threat intelligence indicators
  - 'NAI: File systems on managed mobile endpoints, focusing on user-accessible storage (e.g., Android
    /sdcard/, iOS ''On My iPhone/iPad'') and application-private storage directories. Network egress points
    instrumented with Zeek for traffic correlation.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from MTD file_creation.log\nwhere (file_ext in ['.zip','.rar','.7z','.tar.gz'] OR file_entropy\
      \ > 7.2)\njoin MDM application_inventory.log on app_id\nwhere app_id NOT in backup_utility_allowlist\n\
      \  and (has_sensitive_perm(app_id, ['Contacts','Photos','Microphone'])\n       OR app_role NOT in\
      \ ['backup','sync','export'])\nenrich threat_intel_denylist(app_id, file_hash)\nemit alert with\
      \ matched_static_predicates"
- question: Are newly created files exhibiting Shannon byte entropy above ~7.2 (indicating compression
    or encryption) regardless of their file extension, suggesting an attacker is masking staged archives
    by spoofing extensions?
  context: Extension-based detection is trivially evaded by renaming output files. Computing the Shannon
    byte entropy of newly created files lets the analyst flag compressed/encrypted content by what it
    actually is, not what it claims to be. Entropy above roughly 7.2 strongly indicates packed/encrypted
    data. This defeats extension spoofing and catches staged blobs written with innocuous names (e.g.,
    .dat, .tmp, .log). Within the Collection tactic this identifies data that has already been packaged
    for exfiltration. A positive result is a high-entropy file written by a non-utility app; legitimate
    media files (already-compressed JPEG/MP4) must be tuned out via app-role and path context.
  answer_sources:
  - MTD file_creation.log
  - MDM application_inventory.log
  - Zeek files.log
  - Zeek conn.log
  - Threat intelligence indicators
  - 'NAI: File systems on managed mobile endpoints, focusing on user-accessible storage (e.g., Android
    /sdcard/, iOS ''On My iPhone/iPad'') and application-private storage directories. Network egress points
    instrumented with Zeek for traffic correlation.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from MTD file_creation.log\ncompute H = shannon_byte_entropy(file_bytes)\nwhere H > 7.2\n\
      \  and app_id NOT in backup_utility_allowlist\n  and file_ext NOT in known_compressed_media_exts\n\
      emit alert(file_path, app_id, H)"
- question: Does a newly created archive exceed the device's 95th-percentile file size or sit in a directory
    whose path entropy exceeds 3.0, and is it correlated with an outbound transfer of more than 1MB (including
    blocked/failed uploads) within five minutes of creation?
  context: Statistical baselining isolates anomalous output volume. Derive per-device size cutoffs from
    a rolling 30-day baseline and alert when an archive exceeds the 95th percentile (Volume) or the parent
    path entropy exceeds 3.0, tuning to keep the benign rate under 1%. Critically, correlate the creation
    event with outbound transfer (Frequency/Volume) greater than 1MB within five minutes, and explicitly
    count blocked or failed uploads as a distinct exfil-attempt signal — a blocked upload still reveals
    intent. This ties archive staging (Collection, TA0035) directly to imminent exfiltration. A positive
    result is a large/anomalous archive immediately followed by (attempted) bulk egress.
  answer_sources:
  - MTD file_creation.log
  - MDM application_inventory.log
  - Zeek files.log
  - Zeek conn.log
  - Threat intelligence indicators
  - 'NAI: File systems on managed mobile endpoints, focusing on user-accessible storage (e.g., Android
    /sdcard/, iOS ''On My iPhone/iPad'') and application-private storage directories. Network egress points
    instrumented with Zeek for traffic correlation.'
  range: Last 90 days; pivot to a +/- 5 minute window around each file-creation event for egress correlation
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'p95 = rolling_percentile(MTD file_creation.log.file_size, device_id, days=30, pct=95)

      from MTD file_creation.log as f

      where f.file_size > p95 OR path_entropy(f.dir) > 3.0

      join Zeek conn.log as c on device_ip

      where c.ts between f.ts and f.ts+300s and c.orig_bytes > 1MB

      left join Zeek files.log for blocked/failed transfers

      emit alert(device_id, f.file_path, c.orig_bytes, upload_status)'
- question: When the archive-staging features are scored by a trained classifier, which file-creation
    events exceed a 0.90 malicious probability, and what are the top-3 contributing features for each?
  context: A Gradient Boosting / Random Forest model trained on file-size percentile, byte entropy, path
    entropy, requested permissions, app role, allowlist flag, time-of-day, post-creation bytes sent, and
    failed-upload count can rank archive-staging events that no single rule catches. Trigger an incident
    when probability exceeds 0.90 and surface the top-3 contributing features for explainability (Drebin-style).
    A novelty/anomaly layer catches previously unseen patterns. Within Collection this prioritizes the
    highest-confidence staging events for analyst review. A positive result is a high-probability event
    whose contributing features (e.g., high entropy + sensitive permissions + post-creation egress) tell
    a coherent staging story.
  answer_sources:
  - MTD file_creation.log
  - MDM application_inventory.log
  - Zeek files.log
  - Zeek conn.log
  - Threat intelligence indicators
  - 'NAI: File systems on managed mobile endpoints, focusing on user-accessible storage (e.g., Android
    /sdcard/, iOS ''On My iPhone/iPad'') and application-private storage directories. Network egress points
    instrumented with Zeek for traffic correlation.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [size_pctile, byte_entropy, path_entropy, permissions,\n            app_role, allowlist_flag,\
      \ hour_of_day, post_create_bytes_sent,\n            failed_upload_count]\np = GBM_or_RF.predict_proba(features)\n\
      if p > 0.90:\n    emit incident(event_id, p, top3_feature_importance(features))"
- question: Is a process running with the screen off (screen_state=off) that matches a threat-intelligence
    denylist or exceeds static resource thresholds while NOT being on the approved background-service
    allowlist?
  context: 'A non-export-role app performing bulk processing while the device screen is off is a deterministic
    contradiction worth alerting on. Flag processes with screen_state=off that either match TI denylists
    or exceed static CPU/memory/disk thresholds when they are not on a sanctioned background-service allowlist.
    Background bulk-processing is a hallmark of covert collection and archiving (Collection, TA0035):
    the user is not interacting, yet the app is consuming resources to read and package data. A positive
    result is an unsanctioned app working hard while the user is away; benign results are known sync/backup
    services on the allowlist.'
  answer_sources:
  - MTD process_performance.log
  - MDM device_health.log
  - MDM application_inventory.log
  - 'NAI: Mobile device OS kernel, specifically process, CPU, memory, and disk I/O schedulers, with metrics
    collected by MDM/MTD agents.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from MTD process_performance.log\nwhere screen_state == 'off'\n  and proc_name NOT in background_service_allowlist\n\
      \  and (proc_name in threat_intel_denylist\n       OR cpu_pct > CPU_T OR mem_mb > MEM_T OR disk_write_kbps\
      \ > IO_T)\nemit alert(device_id, proc_name, cpu_pct, mem_mb, disk_write_kbps)"
- question: Within any 60-second screen-off window, does a process simultaneously exceed mean + 3 standard
    deviations (or the 95th percentile) of its own 30-day baseline for CPU, memory, AND disk-write I/O
    at the same time?
  context: Resource-consumption baselining is an established dynamic mobile signal. Baseline CPU, memory,
    and disk-write I/O per app for the screen-off state over 30 days, then alert when all three metrics
    simultaneously breach mean + 3 sigma (or the 95th percentile) within a 60-second window. Requiring
    all three to spike together sharply reduces false positives from ordinary background tasks and points
    at sustained bulk packaging/encryption activity (Collection, TA0035). Profile failure signals — throttled
    or killed background jobs and denied writes — separately, since the OS may interrupt the staging attempt.
    A positive result is a coordinated tri-metric spike by a non-allowlisted app while the screen is off.
  answer_sources:
  - MTD process_performance.log
  - MDM device_health.log
  - MDM application_inventory.log
  - 'NAI: Mobile device OS kernel, specifically process, CPU, memory, and disk I/O schedulers, with metrics
    collected by MDM/MTD agents.'
  range: Last 90 days; evaluate in rolling 60-second windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for app in apps:\n  base = baseline(MTD process_performance.log, app, screen_state='off',\
      \ days=30)\n  for w in rolling_windows(60s):\n    if avg(cpu,w) > base.cpu.mean+3*base.cpu.std\n\
      \       and avg(mem,w) > base.mem.mean+3*base.mem.std\n       and avg(disk_write,w) > base.disk.mean+3*base.disk.std:\n\
      \       emit alert(app, w)\n  separately profile throttled/killed/denied_write events"
- question: When per-app background performance vectors are scored by an online autoencoder ensemble,
    which processes produce high reconstruction error, and which features and surrounding event sequence
    drove the anomaly?
  context: An online, unsupervised autoencoder ensemble trained on per-app performance vectors (cpu, memory,
    disk, network, screen_state, battery) can detect anomalous background behavior without labeled data
    and is low-power enough for on-device deployment (Kitsune-style). Alert on high reconstruction error
    and report the top per-feature error contributions for explainability. Correlate the offending process
    name with the rare event sequence around the spike (DeepLog-style) to confirm staging context. Within
    Collection this catches novel or polymorphic archiving behavior that fixed thresholds miss. A positive
    result is a process whose live performance vector cannot be reconstructed from learned-normal behavior.
  answer_sources:
  - MTD process_performance.log
  - MDM device_health.log
  - MDM application_inventory.log
  - 'NAI: Mobile device OS kernel, specifically process, CPU, memory, and disk I/O schedulers, with metrics
    collected by MDM/MTD agents.'
  range: Last 90 days; score continuously/online
  queries:
  - technology: SIEM/ML pseudocode
    query: "vec = [cpu, mem, disk, network, screen_state, battery]\nerr = autoencoder_ensemble.reconstruction_error(vec)\n\
      if err > anomaly_threshold:\n    emit alert(proc_name, err, top_feature_error_contributions(vec),\n\
      \               surrounding_event_sequence(proc_name))"
- question: Did a backgrounded application execute the ordered API sequence read-sensitive-data -> compress/encrypt
    -> open-network-socket within a 60-second window, while NOT being categorized as a known backup or
    cloud-storage utility?
  context: 'This ordered chain is the canonical mobile collection-to-exfiltration information flow (TaintDroid-style
    read-stage-exfil). Alert when the same process, while backgrounded, reads a sensitive data store (e.g.,
    Contacts provider, Photo Library), then calls a compression or cryptography library (e.g., java.util.zip,
    CommonCrypto), then initiates a network connection (e.g., java.net.Socket) — all inside 60 seconds
    — and the app category is not on the backup/cloud allowlist. The deterministic ordering is what makes
    this high-confidence: data is read, packaged, and shipped in one tight chain. A positive result is
    this exact sequence from a non-utility app; benign cloud-sync apps must be allowlisted to avoid noise.'
  answer_sources:
  - MTD api_call.log
  - Application Sandboxing Logs
  - MDM application_inventory.log
  - 'NAI: Instrumentation points within the mobile OS or a sandboxed environment that hook into API calls
    made by user-installed applications. This includes monitoring system library calls for file system
    access, data access (contacts, photos), compression, cryptography, and networking.'
  range: Last 90 days; correlate per process within 60-second windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from MTD api_call.log\nsequence by process_id within 60s where app_state == 'background':\n\
      \  step1 api in read_sensitive_apis (Contacts/PhotoLibrary)\n  step2 api in compress_or_crypto_apis\
      \ (java.util.zip/CommonCrypto)\n  step3 api in network_apis (java.net.Socket)\nwhere app_category\
      \ NOT in backup_cloud_allowlist\nemit alert(process_id, app_id, sequence_timestamps)"
- question: Are there API call transitions or n-grams that fall in the bottom 1st percentile of an app's
    learned Markov-chain/baseline (rare), or whose API-call entropy exceeds mean + 3 standard deviations,
    including blocked or failed socket connections?
  context: Statistical sequence modeling catches staging behavior that does not match a fixed signature.
    Build per-app Markov-chain transition probabilities over abstracted API calls and baseline API n-gram
    frequencies; alert when an observed transition or sequence falls in the bottom 1st percentile (rare)
    or when API entropy exceeds mean + 3 sigma. Abstracting calls to package/family (MaMaDroid-style)
    keeps the baseline resilient to OS-update drift. Count failed or blocked socket connects as a distinct
    exfil-attempt signal, since a blocked egress still evidences intent. Within Collection this flags
    unusual read-stage-exfil patterns. A positive result is a rare/high-entropy API transition by an app,
    especially paired with attempted network egress.
  answer_sources:
  - MTD api_call.log
  - Application Sandboxing Logs
  - MDM application_inventory.log
  - 'NAI: Instrumentation points within the mobile OS or a sandboxed environment that hook into API calls
    made by user-installed applications. This includes monitoring system library calls for file system
    access, data access (contacts, photos), compression, cryptography, and networking.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "model = markov_chain(MTD api_call.log, by=app_id, abstract=package_family)\nfrom MTD api_call.log\n\
      where transition_prob(prev_api, api) < pctile(1)\n   OR ngram_freq(api_window) < pctile(1)\n   OR\
      \ api_entropy(app_id) > mean + 3*std\nalso flag socket_connect where status in ['blocked','failed']\n\
      emit alert(app_id, rare_transition, status)"
- question: When ordered API sequences (with app state and inter-call time deltas) are scored by a trained
    sequence model, which sequences exceed 0.95 malicious confidence, and which API tokens contributed
    most?
  context: A sequence model (LSTM/GRU or transformer) trained on ordered API sequences with app state
    and inter-call time deltas can recognize malicious read-stage-exfil chains that evade rules and simple
    statistics. Alert on malicious confidence above 0.95 and surface the top-3 contributing API tokens
    for analyst explainability. Use established malware-API corpora (e.g., Mal-API-2019) as a training
    template and DeepLog-style next-event anomaly scoring to catch unseen chains. Within Collection this
    provides the highest-confidence detection of the collection-to-exfiltration API flow. A positive result
    is a high-confidence sequence whose contributing tokens align with read -> compress/encrypt -> network
    behavior.
  answer_sources:
  - MTD api_call.log
  - Application Sandboxing Logs
  - MDM application_inventory.log
  - 'NAI: Instrumentation points within the mobile OS or a sandboxed environment that hook into API calls
    made by user-installed applications. This includes monitoring system library calls for file system
    access, data access (contacts, photos), compression, cryptography, and networking.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = ordered_api_tokens(process_id) with [app_state, inter_call_dt]\np = seq_model.predict(seq)\
      \   # LSTM/GRU or transformer\nif p > 0.95:\n    emit incident(process_id, p, top3_contributing_api_tokens(seq))\n\
      anomaly = deeplog_next_event_score(seq)   # unseen-chain backstop\nif anomaly > thr: emit alert(process_id,\
      \ anomaly)"
