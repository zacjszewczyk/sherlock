questions:
- question: Do any TLS sessions egressing from mobile device IP ranges present X.509 certificates whose
    issuer or subject fields match threat-intelligence indicators or known offensive-tooling certificate
    artifacts (for example, Cobalt Strike default beacon certificate serials/issuers)?
  context: Adversaries that wrap C2 in asymmetric crypto frequently reuse certificate material from offensive
    frameworks or stand up infrastructure already catalogued in threat intel. Match the issuer and subject
    fields in Zeek ssl.log/x509.log against curated TI feeds and against published signatures such as
    [Florian Roth's Cobalt Strike YARA base](https://github.com/Neo23x0/signature-base/blob/master/yara/apt_cobaltstrike.yar)
    (default beacon certificate serials/issuers), restricting to
    flows sourced from mobile IP ranges. A positive match is a high-confidence indicator of known malicious
    C2 infrastructure and warrants immediate triage and containment; a negative result simply shifts effort
    to behavior-based methods. This is tactic-specific to TA0037 Command and Control because mobile devices
    roam onto cellular and public Wi-Fi where certificate provenance is one of the few persistent observables
    of the encrypted channel.
  answer_sources: &id001
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek x509.log
  - Zeek ja3.log
  - Zeek ja3s.log
  - Certificate Transparency logs
  - Threat intelligence indicators
  - 'NAI: Network egress points, Corporate Wi-Fi access points, VPN concentrators, MDM (Mobile Device
    Management) proxy servers, Cloud Access Security Brokers (CASB), Cellular network gateways (for corporate-liable
    devices backhauling traffic)'
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: "ssl = ssl.log JOIN x509.log ON cert_chain_fuid\nALERT where src_ip IN mobile_ip_ranges AND\
      \ (\n  cert.issuer IN ti_malicious_issuers OR cert.subject IN ti_malicious_subjects\n  OR cert.serial\
      \ IN cobaltstrike_default_serials)\nOUTPUT src_ip, dst_ip, sni, cert.issuer, cert.subject, cert.serial"
- question: For TLS sessions from mobile devices, which presented certificates are self-signed or appear
    CA-issued yet have no Signed Certificate Timestamp and cannot be found in public Certificate Transparency
    logs?
  context: Legitimate publicly-trusted certificates are logged in [Certificate Transparency (RFC 6962)](https://www.rfc-editor.org/rfc/rfc6962)
    and carry SCTs; covert C2 endpoints often use self-signed certificates or privately-minted certs that
    never appear in CT. For each mobile TLS session verify the presented certificate against public CT
    logs, and flag validation_status='self-signed' or CA-issued-looking certificates lacking any SCT /
    CT-log presence. A hit indicates infrastructure deliberately kept out of public transparency systems,
    a common trait of asymmetric-crypto C2 channels. False positives include internal/enterprise PKI and
    pinned app certs, so maintain an allowlist of sanctioned internal CAs. Ties to TA0037 because CT-absence
    is a durable tell for adversary-controlled TLS endpoints reached from roaming mobile devices.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: "FOR each ssl.log session WHERE src_ip IN mobile_ip_ranges:\n  ct_present = lookup_certificate_transparency(cert.fingerprint)\n\
      \  ALERT where cert.validation_status == 'self-signed'\n    OR (looks_ca_issued(cert) AND (no_sct(cert)\
      \ OR NOT ct_present))\n  EXCLUDE cert.issuer IN sanctioned_internal_CAs\nOUTPUT src_ip, dst_ip,\
      \ sni, cert.fingerprint, validation_status"
- question: Do any mobile egress flows present JA3/JA3S or JA4/JA4X TLS fingerprints that match known
    implant stacks, or a JA4X certificate structure inconsistent with the app/OS the device claims to
    be running?
  context: The TLS ClientHello/ServerHello and certificate structure betray the implementation behind
    a connection even when payloads are encrypted. Maintain allow/deny lists of [JA3/JA3S](https://github.com/salesforce/ja3)
    and GREASE-robust [JA4/JA4X](https://github.com/FoxIO-LLC/ja4) fingerprints; alert when a mobile flow presents a known-implant fingerprint or a JA4X certificate
    structure that does not match the legitimate Android/iOS app or OS TLS stack it purports to be. This
    catches custom or repackaged C2 clients that blend in by destination but not by handshake. Tune by
    building a per-platform baseline of expected fingerprints. Tied to TA0037 because asymmetric-crypto
    C2 is implemented by non-standard TLS stacks whose handshakes diverge from genuine mobile apps.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: "flows = ssl.log JOIN ja3.log JOIN ja3s.log JOIN x509.log\nALERT where src_ip IN mobile_ip_ranges\
      \ AND (\n  ja3 IN implant_ja3_denylist OR ja4 IN implant_ja4_denylist\n  OR ja4x_structure NOT IN\
      \ expected_for(claimed_app_or_os))\nOUTPUT src_ip, dst_ip, ja3, ja3s, ja4, ja4x, sni"
- question: Which mobile TLS sessions use self-signed certificates or certificates whose validity duration
    (not_valid_after minus not_valid_before) falls below the 5th percentile of a 30-day mobile-egress
    baseline?
  context: 'Short-lived and self-signed certificates are cheap to mint and rotate, making them attractive
    for disposable C2 endpoints. Compute certificate validity duration from x509.log timestamps, derive
    the 5th-percentile cutoff per deployment from a rolling 30-day mobile-egress baseline, and alert on
    self-signed certs or durations below that cut. Statistical baselining adapts the threshold to each
    environment so legitimately short-lived ACME/Let''s Encrypt certs (typically ~90 days) do not dominate
    the tail. A positive result flags atypically ephemeral crypto material consistent with adversary infrastructure
    churn. Tied to TA0037: rapid certificate rotation is how adversaries keep asymmetric-crypto C2 reachable
    while evading static blocklists.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = rolling_30d(validity_days = not_valid_after - not_valid_before, where src_ip IN
      mobile_ip_ranges)

      cut = percentile(baseline.validity_days, 5)

      ALERT where cert.validation_status==''self-signed'' OR cert.validity_days < cut

      OUTPUT src_ip, dst_ip, cert.fingerprint, validity_days, cut'
- question: Are any mobile source devices generating sustained elevated rates of TLS fatal alerts, handshake
    failures, or certificate-validation errors directed at a small set of destinations?
  context: C2 negotiation against an unstable or rotating controller produces a churn of failed handshakes
    that looks different from steady successful sessions. Per source device, track the hourly rate of
    TLS fatal alerts / handshake failures / certificate-validation errors and correlate with destination
    cardinality; sustained high failure rates concentrated on a small destination set indicate C2 negotiation
    churn (failure-mode awareness) rather than ordinary browsing. This complements success-based detection
    by catching the controller-unavailable state. A positive result is a device repeatedly retrying TLS
    to the same few endpoints. Tied to TA0037 because resilient asymmetric-crypto C2 retries persistently
    against its controllers.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "GROUP BY src_ip, 1h: fail_count = count(tls_fatal_alert OR handshake_fail OR cert_validation_err),\n\
      \  dst_cardinality = distinct(dst_ip)\nbaseline = per_device_hourly_fail_baseline(30d)\nALERT where\
      \ fail_count > baseline.p99 AND dst_cardinality <= small_set_threshold\nOUTPUT src_ip, dst_set,\
      \ fail_count, baseline.p99"
- question: Does a supervised classifier trained on payload-agnostic TLS features score any mobile sessions
    as high-risk C2, and can the analyst see the top-3 features that drove each score?
  context: Many C2 channels are individually subtle but separable in a multi-feature space. Train a Random
    Forest on payload-agnostic TLS features (certificate validity duration, public key length/type, TLS
    version, cipher suite, JA3/JA4/JA4X, byte counts, flow duration) using locally labeled benign/malicious
    mobile sessions, and alert on high-risk scores while surfacing the top-3 contributing features per
    the explainability requirement. Choosing payload-agnostic features keeps the model effective against
    TLS 1.3 and Encrypted Client Hello (per [Novo et al. (RAID 2024)](https://dl.acm.org/doi/10.1145/3678890.3678921),
    [code](https://github.com/CarlosANovo/extending12to13)) where SNI and certificate fields are hidden. A high score with interpretable drivers gives defensible, triage-ready alerts. Tied to TA0037
    because it generalizes detection of asymmetric-crypto C2 beyond static signatures.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = [validity_days, pubkey_len, pubkey_type, tls_version, cipher, ja3, ja4, ja4x, bytes,
      duration]

      model = train_or_load_random_forest(labeled_mobile_tls)

      score = model.predict_proba(features)

      explain = top3_feature_importance(model, features)

      ALERT where score >= risk_threshold

      OUTPUT src_ip, dst_ip, score, explain'
- question: Are any mobile devices establishing connections whose responder IP (id.resp_h) matches a curated
    C2 threat-intelligence destination list?
  context: The simplest high-confidence beaconing signal is a direct match to known C2 infrastructure.
    Trigger high-priority alerts when mobile connections in Zeek conn.log resolve to id.resp_h values
    present on C2 threat-intelligence destination lists. A positive hit is a strong indicator of an established
    or attempted C2 channel and should drive immediate device isolation and forensic review; a negative
    result moves the hunt to behavioral beaconing analytics. Keep TI fresh and enriched (first/last seen,
    confidence, campaign) to prioritize. Tied to TA0037 because matching destination infrastructure is
    the most direct evidence of command and control regardless of the crypto used on the wire.
  answer_sources: &id002
  - Zeek conn.log
  - Threat intelligence indicators
  - 'NAI: Network egress points, VPN concentrators, MDM (Mobile Device Management) proxy servers, Corporate
    Wi-Fi gateways, Cellular network gateways (for corporate-liable devices backhauling traffic)'
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: 'ALERT FROM conn.log WHERE src_ip IN mobile_ip_ranges AND id.resp_h IN c2_ti_destinations

      PRIORITY high

      OUTPUT src_ip, id.resp_h, id.resp_p, proto, bytes, ts, ti_context'
- question: On any single mobile connection, does the TLS SNI name a high-reputation CDN front while the
    inner HTTP Host header or destination context points to a different or rare backend, indicating domain
    fronting?
  context: Domain fronting ([Fifield et al. (PETS 2015)](https://www.petsymposium.org/2015/papers/03_Fifield.pdf))
    hides C2 by presenting a benign high-reputation
    CDN name in the TLS SNI while routing to a different backend inside the encrypted channel. Alert when
    the SNI names a popular CDN front but the observable inner HTTP Host header (where TLS is terminated/inspected)
    or destination context names a different or rare backend on the same connection. A mismatch is a strong
    covert-channel indicator because legitimate clients align SNI and Host. Where the inner Host is not
    observable, corroborate with destination rarity and JA3/JA4. Tied to TA0037 because fronting is a
    defense-evasion technique adversaries layer onto asymmetric-crypto C2 to blend with CDN traffic.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: "conns = ssl.log JOIN http.log ON uid WHERE src_ip IN mobile_ip_ranges\nALERT where sni IN\
      \ high_reputation_cdn_fronts AND http.host IS NOT NULL\n  AND registered_domain(http.host) != registered_domain(sni)\n\
      \  AND (http.host rare OR backend_reputation low)\nOUTPUT src_ip, sni, http.host, dst_ip, uid"
- question: Within 1-hour windows, which mobile flows with more than 10 connections to a single destination
    show coefficients of variation for inter-arrival time and bytes below the 1st percentile, and do FFT/autocorrelation
    periodicity scores confirm beaconing?
  context: 'Automated C2 produces highly regular heartbeats: near-constant inter-arrival times and near-constant
    per-connection byte volumes. In 1-hour windows, compute the coefficient of variation of inter-arrival
    times and of bytes for each source-destination flow with >10 connections, and alert when both CoVs
    fall below the 1st percentile of benign mobile baselines. Complement with FFT/autocorrelation periodicity
    scoring as implemented in [RITA](https://github.com/activecm/rita) and [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks) to confirm a dominant period and catch jittered beacons.
    Low variance plus a strong periodic peak is a hallmark of machine-driven C2 distinct from human-driven
    traffic. Tied to TA0037 because beaconing is the core temporal signature of command and control over
    an encrypted channel.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each src_ip,dst_ip,dst_port in 1h windows WHERE conn_count > 10:\n  cov_iat = stddev(inter_arrival)/mean(inter_arrival)\n\
      \  cov_bytes = stddev(bytes)/mean(bytes)\n  periodicity = fft_autocorr_score(inter_arrival)\nbaseline\
      \ = benign_mobile_flow_baseline(30d)\nALERT where cov_iat < baseline.p1 AND cov_bytes < baseline.p1\
      \ AND periodicity high\nOUTPUT src_ip, dst_ip, cov_iat, cov_bytes, periodicity"
- question: For each mobile destination, what is the hourly ratio of established versus failed/reset connections,
    and which stable IP/port pairs show repeated failed-then-retry patterns indicating an unavailable
    C2 controller?
  context: A C2 controller that is offline or rotating produces repeated failed/reset connection attempts
    followed by retries to a stable endpoint, a failure-mode signal distinct from steady successful heartbeats.
    Per destination, track the ratio of established vs. failed/reset connections using conn.log conn_state
    per hour; flag stable IP/port pairs with repeated failed-then-retry sequences. This catches dormant
    or churning C2 that beaconing-on-success detectors miss. A positive result is a device persistently
    retrying a fixed unreachable endpoint. Tied to TA0037 because resilient command and control keeps
    attempting its controller even when the controller is temporarily down.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "GROUP BY src_ip, id.resp_h, id.resp_p, 1h:\n  established = count(conn_state IN [SF, S1, RSTO])\n\
      \  failed = count(conn_state IN [S0, REJ, RSTR, RSTOS0])\n  ratio = failed / max(established,1)\n\
      ALERT where ratio high AND stable_endpoint AND failed_then_retry_pattern\nOUTPUT src_ip, id.resp_h,\
      \ id.resp_p, established, failed, ratio"
- question: Does an LSTM autoencoder (with an Isolation Forest baseline) flag mobile flow time series
    as anomalous via high reconstruction error, including high-jitter beacons, with the top-3 contributing
    features shown?
  context: High-jitter or adaptive beacons defeat fixed-threshold periodicity rules but remain recoverable
    with sequence models. Train an LSTM autoencoder on benign mobile flow time series (inter-arrival,
    duration, bytes) and alert on high reconstruction error, using LSTM/sequence models (per [Gupta et al. (ARES 2025)](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20))
    to recover high-jitter beacons and a low-latency [Isolation Forest](https://ieeexplore.ieee.org/document/10143005/) on flow/volume features
    as a baseline. Surface the top-3 contributing features per alert for explainability. High reconstruction
    error indicates the flow's temporal/volume structure departs from learned-benign behavior. Tied to
    TA0037 because it generalizes heartbeat detection to evasive C2 cadences over encrypted channels.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'series = flow_timeseries(src_ip,dst_ip,[inter_arrival,duration,bytes])

      ae = train_or_load_lstm_autoencoder(benign_mobile_flows)

      err = ae.reconstruction_error(series)

      iso = isolation_forest(flow_volume_features)

      explain = top3_features(err)

      ALERT where err > threshold OR iso.anomaly

      OUTPUT src_ip, dst_ip, err, explain'
- question: Can a self-supervised representation model over packet size/timing/directionality sequences
    flag anomalous encrypted mobile flows without any decryption, trained on labeled mobile and VPN/tunnel
    datasets?
  context: When decryption is impossible, the sequence of packet sizes, timings, and directions still
    carries a behavioral fingerprint. Apply self-supervised representation learning over packet size/timing/directionality
    sequences (per [ET-SSL (Scientific Reports 2025)](https://www.nature.com/articles/s41598-025-08568-0)),
    training baselines on labeled mobile flows from [CICAndMal2017](https://www.unb.ca/cic/datasets/andmal2017.html)
    and time-related VPN/tunnel features from [Draper-Gil et al. (ISCXVPN2016)](https://www.scitepress.org/papers/2016/57407/57407.pdf). Alert on flows whose learned
    representation is anomalous relative to benign mobile traffic. This is decryption-agnostic and effective
    against TLS 1.3/ECH and tunneled C2. A positive result is an encrypted flow whose shape resembles
    tunneling/C2 rather than normal app traffic. Tied to TA0037 because it detects covert asymmetric-crypto
    C2 purely from observable flow dynamics.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'seq = packet_sequence(src_ip,dst_ip,[size,timing,direction])

      model = self_supervised_repr(train=[CICAndMal2017, ISCXVPN2016_features])

      repr = model.encode(seq)

      score = anomaly_score(repr, benign_mobile_manifold)

      ALERT where score > threshold

      OUTPUT src_ip, dst_ip, score, nearest_tunnel_class'
- question: Do any DNS query names or HTTP User-Agent strings from mobile devices match known DGA patterns
    or malicious indicators of compromise?
  context: Adversaries tunnel keys or small payloads inside DNS query names and HTTP User-Agent strings,
    and many reuse recognizable DGA templates or IOC strings. Scan Zeek dns.log queries and http.log user_agent
    fields for known DGA patterns and malicious indicators and alert on matches. A positive hit is a direct
    overlap with known covert-channel tradecraft and should drive immediate triage of the source device;
    a negative result shifts effort to entropy- and volume-based analytics. Keep the IOC/DGA pattern set
    current and scoped to mobile egress to limit noise. Tied to TA0037 because encoding C2 in DNS/HTTP
    fields is a common way to smuggle asymmetric key material or commands past inspection.
  answer_sources: &id003
  - Zeek dns.log
  - Zeek http.log
  - Threat intelligence indicators
  - 'NAI: Internal DNS resolvers, Forward web proxies, Reverse proxies, Cloud Access Security Brokers
    (CASB)'
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: 'ALERT FROM dns.log WHERE src_ip IN mobile_ip_ranges AND query MATCH known_dga_or_ioc_patterns

      UNION

      ALERT FROM http.log WHERE src_ip IN mobile_ip_ranges AND user_agent MATCH malicious_ua_iocs

      OUTPUT src_ip, query_or_ua, matched_pattern, dst_ip'
- question: Which DNS query labels and User-Agent/URI strings from mobile devices have Shannon entropy
    above the 99th percentile (e.g., >7.0-7.2 bits/byte) with chi-squared tests confirming an anomalous
    character distribution?
  context: Encrypted or ciphertext payloads encoded into DNS labels or HTTP strings exhibit near-random
    character distributions and high Shannon entropy, unlike legitimate human-readable values. Compute
    Shannon entropy of DNS query labels and User-Agent/URI strings and flag values above the 99th percentile
    (encrypted/ciphertext typically exceeds 7.0-7.2 bits/byte per [Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989));
    confirm with chi-squared tests for distributional anomaly and use stateless lexical features per [Nadler
    et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf) A high-entropy
    string failing the chi-squared uniformity test strongly suggests encoded covert data rather than a
    normal name. Tied to TA0037 because high entropy in protocol fields is a key indicator of asymmetric-crypto
    material or commands tunneled through DNS/HTTP.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each dns.log label AND http.log [user_agent, uri] WHERE src_ip IN mobile_ip_ranges:\n\
      \  H = shannon_entropy(string)\n  chi = chi_squared_uniformity(string)\nbaseline = mobile_entropy_baseline(30d)\n\
      ALERT where H >= baseline.p99 (>~7.0 bits/byte) AND chi indicates non-natural distribution\nOUTPUT\
      \ src_ip, string, H, chi"
- question: Per mobile device and second-level domain, what are the NXDOMAIN/SERVFAIL ratio and unique-subdomain
    count, and where do high NXDOMAIN bursts coincide with high-entropy labels?
  context: DGA-based and DNS-tunneled key exchange generate bursts of failed resolutions (NXDOMAIN/SERVFAIL)
    against many unique subdomains, a failure-mode signal distinct from successful lookups. Track the
    NXDOMAIN/SERVFAIL ratio and unique-subdomain count per second-level domain per device, and escalate
    when high NXDOMAIN bursts coincide with high-entropy labels. This pairing is far more reliable than
    either signal alone and points to tunneled/algorithmic C2 rather than ordinary mistyped or stale domains.
    A positive result is a device generating many failing, high-entropy subdomain lookups under one parent
    domain. Tied to TA0037 because tunneled key exchange and DGA C2 produce exactly this failure pattern.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "GROUP BY src_ip, sld, 1h:\n  nx_ratio = count(rcode IN [NXDOMAIN,SERVFAIL]) / count(*)\n \
      \ unique_subs = distinct(subdomain)\n  high_entropy_subs = count(entropy(subdomain) > 7.0)\nALERT\
      \ where nx_ratio high AND unique_subs high AND high_entropy_subs high\nOUTPUT src_ip, sld, nx_ratio,\
      \ unique_subs, high_entropy_subs"
- question: For each second-level domain queried by mobile devices, do both the upstream bytes encoded
    in query names and the query frequency (queries/min) exceed the 99th percentile of the mobile baseline?
  context: 'DNS tunneling reveals itself through the combination of volume and frequency: large cumulative
    bytes smuggled in query names plus a high query rate to one parent domain. Sum upstream bytes encoded
    in query names and count queries/min per second-level domain, and alert when both volume and frequency
    exceed the 99th percentile of the mobile baseline. Requiring both dimensions (a physics-style volume+frequency
    constraint) suppresses benign chatty domains that are high in only one axis. A positive result is
    a domain receiving sustained, high-throughput encoded queries from a device. Tied to TA0037 because
    moving keys or commands over DNS necessarily inflates per-domain query volume and cadence.'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "GROUP BY src_ip, sld, window:\n  up_bytes = sum(len(qname))\n  freq = queries_per_minute\n\
      baseline = mobile_dns_baseline(30d)\nALERT where up_bytes >= baseline.p99 AND freq >= baseline.p99\n\
      OUTPUT src_ip, sld, up_bytes, freq"
- question: Does DBSCAN over DNS query length/subdomain-count/entropy and User-Agent length/entropy features
    (corroborated by an Isolation Forest on lexical features) isolate anomalous mobile requests as noise
    points, with top-3 features shown?
  context: Tunneling traffic forms a sparse, distinctive region of feature space separate from the dense
    cluster of normal lookups. Run DBSCAN on DNS query length, subdomain count, and entropy plus User-Agent
    length and entropy features and investigate the noise points it isolates; corroborate with an Isolation
    Forest trained on lexical features (per [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf))
    and surface the top-3 contributing features
    per alert. Unsupervised clustering catches novel encoding schemes that signatures miss, while the
    Isolation Forest cross-check reduces false positives. Noise points that both detectors agree on are
    strong covert-channel candidates. Tied to TA0037 because encoded C2 in DNS/HTTP is an outlier relative
    to legitimate mobile name/UA traffic.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'X = features(dns:[qlen, subdomain_count, entropy], http:[ua_len, ua_entropy]) where src_ip
      IN mobile_ip_ranges

      labels = dbscan(X)

      noise = points where labels == -1

      iso = isolation_forest(lexical_features)

      explain = top3_features(noise)

      ALERT where point IN noise AND iso.anomaly

      OUTPUT src_ip, request, explain'
