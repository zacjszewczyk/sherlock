name: 'T1521.002: Asymmetric Cryptography'
id: 44775d79-3110-4325-82e0-a2466d5bec4f
description: Investigate adversary use of asymmetric (public-key) cryptography to conceal command-and-control
  traffic from compromised Android and iOS mobile devices (T1521.002) under TA0037 Command and Control.
  This playbook helps an analyst hunt for non-standard or suspicious TLS sessions (self-signed, threat-intel-matched,
  short-lived, or Certificate-Transparency-absent certificates and anomalous JA3/JA3S/JA4/JA4X fingerprints)
  originating from mobile egress; for regular, low-variance encrypted 'heartbeat' beaconing and connection
  success/failure patterns to external destinations; and for covert tunneling of keys or small payloads
  inside DNS query names and HTTP User-Agent strings using IOC matching, Shannon-entropy analysis, volume/frequency
  profiling, and clustering. It blends symbolic-logic rules, statistical baselining, and machine-learning
  models that survive TLS 1.3/ECH and payload encryption, supporting a threat model centered on a sophisticated
  external actor seeking C2 over mobile networks while remaining useful against commodity malware and
  insiders. Telemetry spans Zeek network logs (ssl, x509, conn, dns, http, ja3/ja3s), Certificate Transparency
  logs, threat-intelligence feeds, and mobile egress collection at Wi-Fi access points, VPN concentrators,
  MDM proxies, CASB, and cellular gateways.
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command And Control
contributors:
- Zachary Szewczyk
