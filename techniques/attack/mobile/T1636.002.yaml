- question: '[Collection] Baseline call log access frequency: have you determined whether "baseline call
    log access frequency" is warranted on managed mobile devices, using the Statistical Method approach
    described, to answer the intelligence requirement — Is an adversary collecting call log data from
    our managed mobile devices? (TA0035 - Collection) (PIR)'
  context: 'Tactic relevance (Collection): Is an adversary collecting call log data from our managed mobile
    devices? (TA0035 - Collection) (PIR) This question operationalizes a Statistical Method detection
    for MITRE ATT&CK T1636.002 (Call Log) on mobile (primarily Android; iOS call-log access implies a
    jailbroken/rooted device). Evidence under investigation: A process running on a managed Android endpoint,
    whose SHA256 hash is not on an approved application allowlist (and is not the default dialer), makes
    a runtime API call to the call-log content provider URI ''content://call_log/calls'' or CallLog.Calls.getLastOutgoingCall().
    Maintain a 14-day per-app, per-hour baseline of CallLog query counts from EDR/MTD API logs and alert
    when an app exceeds its baseline by more than 3 standard deviations OR exhibits a bulk-read burst
    (e.g., a single app issuing > N queries/min where N is derived from your fleet''s benign 99th percentile).
    Use seasonal-robust [Seasonal Hybrid ESD](https://arxiv.org/pdf/1704.07706) (STL + median/MAD) to
    remove daily/weekly seasonality and reduce false positives versus naive thresholds. Track read volume
    (rows/bytes returned) as a distinct Volume metric. A positive result indicates an application or process
    is illegitimately collecting call-log data — e.g., a non-allowlisted, non-default-dialer app declaring
    or invoking CallLog APIs, anomalous read frequency/volume, or an access->exfil chain to a rare or
    threat-intel-listed network destination shortly after a READ_CALL_LOG install/grant. A negative result
    lowers but does not eliminate suspicion (side channels can leak the data without the permission),
    so corroborate with the other questions in this playbook (capability/permission declared -> runtime
    CallLog read -> volume/frequency anomaly -> malicious egress).'
  answer_sources:
  - Mobile EDR/MTD Process and API monitoring logs
  - Android Logcat
  - UEM Application Inventory Log
  - 'NAI: Managed Android endpoints, Unified Endpoint Management (UEM) console, SIEM platform'
  range: Last 90 days (use >=14-30 days of history to establish per-app/fleet baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from edr_api_log where calllog_query

      | bin _time span=1h | stats count as q, sum(rows_returned) as vol by package_name, _time

      | STL_decompose(q) ; resid = SH-ESD(q)   # remove daily/weekly seasonality

      | eventstats mean(q) as mu stdev(q) as sd by package_name, hour

      | eval burst = if(q_per_min > fleet_p99, 1, 0)

      | where q > mu + 3*sd OR burst==1'
