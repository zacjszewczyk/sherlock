questions:
- question: '[Collection] Alert on non-allowlisted call log permission requests: have you determined whether
    "alert on non-allowlisted call log permission requests" is warranted on managed mobile devices, using
    the Symbolic Logic approach described, to answer the intelligence requirement — Is an adversary collecting
    call log data from our managed mobile devices? (TA0035 - Collection) (PIR)'
  context: 'Tactic relevance (Collection): Is an adversary collecting call log data from our managed mobile
    devices? (TA0035 - Collection) (PIR) This question operationalizes a Symbolic Logic detection for
    MITRE ATT&CK T1636.002 (Call Log) on mobile (primarily Android; iOS call-log access implies a jailbroken/rooted
    device). Evidence under investigation: An Android application, not present on the corporate application
    allowlist and not the device''s default Phone/dialer handler, is identified in the UEM/app-vetting
    inventory declaring or holding the ''android.permission.READ_CALL_LOG'' (dangerous/restricted) permission
    in its manifest, and/or referencing CallLog content-provider APIs. Query UEM/app-vetting inventory
    for apps declaring or holding android.permission.READ_CALL_LOG. Because Play policy restricts this
    dangerous/restricted permission to the default Phone/dialer handler, any other app is anomalous: cross-reference
    package name AND signing certificate against the corporate allowlist and alert at high severity for
    any non-allowlisted, non-default-dialer app, per [android.provider.CallLog](https://developer.android.com/reference/android/provider/CallLog)
    and [Request Runtime Permissions](https://developer.android.com/training/permissions/requesting).
    A positive result indicates an application or process is illegitimately collecting call-log data —
    e.g., a non-allowlisted, non-default-dialer app declaring or invoking CallLog APIs, anomalous read
    frequency/volume, or an access->exfil chain to a rare or threat-intel-listed network destination shortly
    after a READ_CALL_LOG install/grant. A negative result lowers but does not eliminate suspicion (side
    channels can leak the data without the permission), so corroborate with the other questions in this
    playbook (capability/permission declared -> runtime CallLog read -> volume/frequency anomaly -> malicious
    egress).'
  answer_sources:
  - MDM/UEM Application Inventory Log
  - AndroidManifest.xml
  - Application Allowlist
  - Application Vetting Report (static analysis)
  - 'NAI: Unified Endpoint Management (UEM) console, Cloud-based application sandbox, Corporate application
    store'
  range: Last 90 days
  queries:
  - technology: UEM/App-vetting pseudocode
    query: 'from uem_app_inventory, app_vetting

      | where declares("android.permission.READ_CALL_LOG") OR references(CallLog_provider_api)

      | lookup CorporateAllowlist package_name, signing_cert_sha256 OUTPUT approved

      | where isnull(approved) AND package_name != default_dialer

      | eval severity="high"

      | table package_name, signing_cert_sha256, source'
