name: 'T1636.002: Call Log'
id: 551af112-13b9-446c-8bdd-2d81cbfb5616
description: 'This playbook helps an analyst investigate MITRE ATT&CK T1636.002 (Call Log) on managed
  mobile devices, where an adversary uses standard operating-system APIs to harvest call-log data. On
  Android this is reachable via the CallLog Content Provider (content://call_log/calls, CallLog.Calls.getLastOutgoingCall())
  and the android.permission.READ_CALL_LOG dangerous/restricted permission; iOS exposes no standard call-log
  API, so access there typically implies a jailbroken or rooted device. The playbook supports the Collection
  mission question — Is an adversary collecting call log data from our managed mobile devices? — by chaining
  static, runtime, and network evidence: non-allowlisted apps that declare or hold READ_CALL_LOG or reference
  CallLog APIs in UEM/app-vetting inventory; over-privileged or permission-inconsistent apps (declare-but-never-use,
  use-but-never-declare side channels); statistically rare permission grants across the fleet; runtime
  CallLog content-provider reads by unapproved processes (matched on SHA256); anomalous read frequency/volume
  bursts versus a per-app baseline; access->exfil API sequences flagged by taint/Markov/LSTM models; and
  outbound network spikes, rare/young/high-entropy destinations, DNS tunneling, and threat-intel C2 contact
  correlated within 24 hours of a READ_CALL_LOG install or grant. Questions combine deterministic allow-list
  and threat-intel symbolic logic, statistical baselining (prevalence, seasonal-robust frequency/volume
  anomalies, lexical DNS features), and machine-learning detectors (explainable APK classifiers, taint
  ground truth, Markov/LSTM API-sequence models, forecasting plus clustering) across MDM/UEM, mobile EDR/MTD,
  Android logcat, and Zeek network telemetry.'
