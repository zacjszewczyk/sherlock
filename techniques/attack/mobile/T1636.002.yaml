    declared -> runtime CallLog read -> volume/frequency anomaly -> malicious egress).'
  answer_sources:
  - MDM/UEM Application Inventory Log
  - AndroidManifest.xml
  - Application Allowlist
  - Application Vetting Report (static analysis)
  - 'NAI: Unified Endpoint Management (UEM) console, Cloud-based application sandbox, Corporate application
    store'
  range: Last 90 days
  queries:
  - technology: StaticAnalysis/pseudocode
    query: 'map = api_to_permission_map(); sinks = SUSI_calllog_sources()

      declared = uses_permission(app, READ_CALL_LOG)

      used = invokes_any(app, sinks)

      | if declared AND NOT used: flag("declare-but-never-use")

      | if used AND NOT declared: flag("use-but-never-declare / side-channel")

      | eval severity="medium" | route_manual_review(package_name)'
