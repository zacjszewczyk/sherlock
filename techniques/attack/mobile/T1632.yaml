name: 'T1632: Subvert Trust Controls'
id: f59ef1ed-a017-4d56-a9dc-7fb2050cd823
description: 'Hunt for adversaries subverting trust controls on corporate-managed mobile devices (Android
  and iOS) in order to execute untrusted code or intercept communications. This playbook helps an analyst
  investigate three primary abuse paths: (1) rogue Certificate Authorities and TLS interception, where
  an attacker installs an unapproved, self-signed, or invalid CA certificate (visible in MDM logs and
  Zeek x509/ssl telemetry) or stands up a re-signing middlebox that breaks certificate validation, fails
  Certificate Transparency checks, or produces TLS handshake (JA4/JA4X) versus User-Agent mismatches;
  (2) unauthorized Android application sideloading, where the ''Install unknown apps'' permission is enabled
  without an approved change ticket, developer mode/ADB is enabled out of baseline, or a sideloaded APK
  is classified malicious by static or behavioral models; and (3) malicious iOS configuration profiles,
  where an unsigned or unapproved ''.mobileconfig'' is installed, delivered from newly observed or high-entropy
  source domains, or distributed en masse. It combines deterministic symbolic-logic rules, statistical
  baselining (rare-issuer detection, standard-deviation spikes, Shannon entropy, time-series forecasting),
  and explainable machine-learning models (Random Forest, Drebin/MaMaDroid, Isolation Forest, SARIMA/Prophet
  with SHAP attribution) so the analyst can confirm trust subversion, quarantine affected devices, and
  scope fleet-wide campaigns.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any certificate installed on, or presented to, a managed mobile device use an issuer SHA-256
    that is not on the per-device-model organizational CA allowlist, fail chain validation (ssl.log validation_status
    != 'ok'), or appear self-signed?
  context: For the Defense Evasion tactic this is the foundational deterministic check against rogue CA
    / TLS interception. The analyst correlates MDM logs of installed CA certificates with Zeek x509.log/ssl.log
    certificates presented to mobile IP ranges, comparing issuer hashes against an allowlist maintained
    per device model because Android OEM root stores are bloated and inconsistent. Any issuer hash off
    the allowlist, any certificate where validation_status is not 'ok', or any self-signed certificate
    is the root weakness adversaries abuse to present forged certs and silently decrypt traffic. Cross-reference
    newly user-added root CAs against apps holding the VPN/network permission, the canonical mobile interception
    vector. A positive result means likely interception or trust subversion and the device should be quarantined;
    a clean result reduces but does not eliminate risk because validation can be disabled client-side.
  answer_sources:
  - MDM logs
  - Zeek x509.log
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek http.log
  - Certificate Transparency logs
  - 'NAI: Corporate-managed mobile devices, Mobile Device Management (MDM) server, Network egress points/Internet
    Gateway, DNS Resolvers, SIEM'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let allow = lookup('ca_allowlist_by_model', device_model).issuer_sha256\nfrom mdm_logs, zeek_x509,\
      \ zeek_ssl where src_ip in MOBILE_RANGES\nalert if issuer_sha256 not in allow\n   or ssl.validation_status\
      \ != 'ok'\n   or x509.self_signed == true\nenrich with vpn_permission_apps(device_id); severity\
      \ = high"
- question: For certificates presented for public-facing domains over mobile egress, was there a valid
    embedded or stapled Signed Certificate Timestamp and a matching entry in public Certificate Transparency
    logs, or did a cert chaining to a locally-added root lack any CT presence?
  context: Within Defense Evasion, a publicly-trusted domain certificate that has no valid SCT and no
    matching CT log entry yet chains to a locally-installed root is a strong indicator of a rogue or private
    CA used to subvert trust. The analyst validates SCTs per RFC 6962 against public CT logs for mobile-egress
    TLS to public domains; legitimate public CAs log their certificates, so absence is anomalous. Track
    the count of SCT-validation failures per device per day as a distinct failure-mode signal so a single
    device repeatedly failing CT stands out. A positive result (no SCT/no CT entry but chains to a local
    root) strongly implies interception; legitimate internal-only domains should be excluded from this
    check.
  answer_sources:
  - MDM logs
  - Zeek x509.log
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek http.log
  - Certificate Transparency logs
  - 'NAI: Corporate-managed mobile devices, Mobile Device Management (MDM) server, Network egress points/Internet
    Gateway, DNS Resolvers, SIEM'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from zeek_ssl where src_ip in MOBILE_RANGES and is_public_domain(server_name)

      for each cert: sct_valid = check_sct(cert); ct_entry = lookup_ct_logs(cert)

      alert if (not sct_valid or not ct_entry) and chains_to_local_root(cert)

      stats count by device_id, day as sct_fail_count'
- question: Over a 30-day rolling window, did any mobile-device TLS session use a certificate whose issuer
    falls in the bottom 1st percentile of issuer prevalence across the fleet, suggesting a rare interception
    CA?
  context: This statistical approach for Defense Evasion surfaces rare interception issuers against the
    long tail of legitimate CAs. The analyst aggregates every certificate issuer observed from mobile
    IP ranges in zeek_x509.log over 30 days, computes per-issuer observation frequency, and derives the
    1st-percentile threshold from the organization's own fleet rather than a fixed list. A TLS session
    (ssl.log/conn.log) using an issuer below that threshold is flagged and confirmed against MDM logs
    to see whether the issuing CA was installed on the device. A positive result points to a low-prevalence
    CA characteristic of targeted interception; benign rare issuers (e.g., a new but legitimate corporate
    CA rollout) should be whitelisted to suppress noise.
  answer_sources:
  - MDM logs
  - Zeek x509.log
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek http.log
  - Certificate Transparency logs
  - 'NAI: Corporate-managed mobile devices, Mobile Device Management (MDM) server, Network egress points/Internet
    Gateway, DNS Resolvers, SIEM'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = from zeek_x509 where src_ip in MOBILE_RANGES, last 30d

      freq = count(*) by issuer; p1 = percentile(freq, 1)

      from zeek_ssl join zeek_conn where src_ip in MOBILE_RANGES

      alert if freq[issuer] <= p1

      enrich with mdm_installed_cas(device_id)'
- question: Did any mobile device exhibit an elevated rate of mismatches between its TLS ClientHello fingerprint
    (JA4) and its declared HTTP User-Agent, exceeding three standard deviations from its 30-day baseline,
    indicating a re-signing interception proxy?
  context: Re-signing middleboxes terminate and re-originate TLS, so the stack that produces the ClientHello
    (JA4) no longer matches the User-Agent the client claims. For Defense Evasion the analyst computes
    a per-device rate of JA4-vs-User-Agent mismatches and alerts when it exceeds three standard deviations
    above the device's 30-day baseline. JA4X certificate fingerprints additionally let the analyst deny-list
    known interception-proxy issuer structures robustly against GREASE and extension randomization. A
    positive result indicates a HTTPS-interception proxy in path; benign causes (legitimate corporate
    TLS-inspection appliances) must be baselined and excluded, otherwise they generate the same signal.
  answer_sources:
  - MDM logs
  - Zeek x509.log
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek http.log
  - Certificate Transparency logs
  - 'NAI: Corporate-managed mobile devices, Mobile Device Management (MDM) server, Network egress points/Internet
    Gateway, DNS Resolvers, SIEM'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from zeek_ssl join zeek_http on uid where src_ip in MOBILE_RANGES

      mismatch = ja4_implies_ua(ja4) != normalize(user_agent)

      rate = sum(mismatch)/count(*) by device_id, day

      baseline mean,std per device over 30d

      alert if rate > mean + 3*std or ja4x in INTERCEPTION_PROXY_FPS'
- question: Does a supervised classifier (Random Forest) or self-supervised anomaly model score any mobile
    TLS session's certificate as malicious above the tuned threshold (e.g. > 0.90), with MDM confirming
    the certificate is installed on the device?
  context: 'This machine-learning layer for Defense Evasion catches interception/re-signed sessions that
    evade deterministic rules. The analyst extracts features from zeek_ssl/x509 for mobile-range TLS sessions:
    certificate validity period, public-key algorithm, key length, SAN count, self-signed status, issuer
    statistical rarity, validation_status, and JA4X fingerprint, then trains a Random Forest on labeled
    benign/malicious certificate traffic. Sessions scoring above the threshold and confirmed installed
    via MDM are alerted. A self-supervised anomaly model over encrypted-flow/handshake metadata can flag
    re-signed sessions without decryption. Every alert MUST surface the top-3 contributing features via
    SHAP (e.g. ''self_signed=true, issuer_prevalence=0.2%, validity=3650d'') so the analyst can triage.
    A positive result warrants device isolation and certificate forensics; explainability prevents blind
    trust in the model.'
  answer_sources:
  - MDM logs
  - Zeek x509.log
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek http.log
  - Certificate Transparency logs
  - 'NAI: Corporate-managed mobile devices, Mobile Device Management (MDM) server, Network egress points/Internet
    Gateway, DNS Resolvers, SIEM'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = extract(zeek_ssl,zeek_x509: validity, pubkey_alg, key_len, san_count,\n  self_signed,\
      \ issuer_rarity, validation_status, ja4x)\np = random_forest.predict_proba(feats)\nalert if p >\
      \ 0.90 and mdm_cert_installed(device_id, cert)\ninclude shap_top3(feats)"
- question: Was the 'Install unknown apps' permission enabled on a managed Android device for a non-system,
    user-installed application that is not on the exception allowlist and has no approved change ticket
    within the prior 24 hours?
  context: Enabling 'Install unknown apps' is the gate that permits sideloading untrusted code, a core
    Defense Evasion / trust-subversion behavior. The analyst continuously monitors MDM device-configuration
    logs for any enablement of this permission, compares the associated package name against an exception
    allowlist, and if absent queries the change management system for an approved ticket for that device/user
    in the last 24 hours. No matching ticket fires a high-severity alert. Track the count of approval-less
    enablements per day as a State/failure-mode signal. A positive result indicates an unauthorized, policy-violating
    change that may precede malware installation; a legitimate enablement will have a corresponding CMDB
    ticket.
  answer_sources:
  - MDM logs
  - Mobile endpoint security agent logs
  - Change management system logs
  - 'NAI: Corporate-managed Android devices, Mobile Device Management (MDM) server, SIEM, Change Management
    Database (CMDB)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from mdm_config where setting=='install_unknown_apps' and value==enabled\nif package not in\
      \ EXCEPTION_ALLOWLIST:\n  ticket = lookup(cmdb_changes, device_id, user, window=24h)\n  alert if\
      \ ticket is null; severity=high\nstats count by day as approvalless_enablements"
- question: For any application package across the Android fleet, did the daily count of devices enabling
    'Install unknown apps' for it exceed three standard deviations above its 90-day baseline mean, suggesting
    a coordinated sideloading campaign?
  context: A single unauthorized enablement is a point event; a synchronized spike across many devices
    for the same package signals a campaign, which matters for Defense Evasion scoping. The analyst calculates,
    per application package name, the daily count of devices with 'Install unknown apps' enabled for it,
    establishes a 90-day per-application baseline mean and standard deviation, and alerts when the daily
    count exceeds mean + 3*std. A positive result implies many users were simultaneously socially-engineered
    or pushed to sideload the same app; baseline shifts from sanctioned rollouts should be re-baselined
    to avoid recurring false positives.
  answer_sources:
  - MDM logs
  - Mobile endpoint security agent logs
  - Change management system logs
  - 'NAI: Corporate-managed Android devices, Mobile Device Management (MDM) server, SIEM, Change Management
    Database (CMDB)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "daily = count(distinct device_id) by package, day\n  where setting=='install_unknown_apps'\
      \ and value==enabled\nbaseline mean,std per package over 90d\nalert if daily > mean + 3*std"
- question: Did an explainable static classifier (Drebin-style SVM over permissions, API calls, intents,
    components) or a behavioral Markov-chain model (MaMaDroid over API call families) score any sideloaded
    or unknown-source APK as malicious?
  context: Sideloaded APKs bypass store vetting, so for Defense Evasion the analyst scores them directly.
    A Drebin-style linear SVM using permissions, API calls, intents, and component features achieves ~94%
    detection on-device and names the driving features, while a MaMaDroid Markov-chain model over API
    call families resists obfuscation and API drift; running both reduces evasion. An alert fires when
    either model scores an app malicious, and the top-3 contributing features are surfaced in the alert
    text for triage. A positive result justifies blocking/removing the app and hunting for the same package
    across the fleet; explainability lets the analyst validate the verdict instead of trusting a black
    box.
  answer_sources:
  - MDM logs
  - Mobile endpoint security agent logs
  - Change management system logs
  - 'NAI: Corporate-managed Android devices, Mobile Device Management (MDM) server, SIEM, Change Management
    Database (CMDB)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for each sideloaded_apk:\n  s = drebin_svm.score(perms, api_calls, intents, components)\n\
      \  m = mamadroid.score(api_family_markov_chain)\n  alert if s==malicious or m==malicious\n  include\
      \ shap_top3(features)"
- question: Did an Isolation Forest model over MDM configuration features flag any device as an outlier
    with 'Install unknown apps' (or developer_mode/adb_enabled/is_rooted) identified as a top contributor
    relative to the fleet?
  context: Beyond single settings, the combination of risky MDM configuration values describes an at-risk
    device, relevant to Defense Evasion. The analyst trains an Isolation Forest over features such as
    install_unknown_apps, developer_mode_enabled, OS version, time since last patch, is_rooted, and adb_enabled,
    then flags devices whose configuration is an outlier against the fleet. An alert fires when a device
    is an outlier and the model attributes the anomaly substantially to 'Install unknown apps', with the
    top-3 anomaly drivers included for triage. A positive result indicates a device configured to permit
    untrusted code execution and warrants compliance review; SHAP attribution prevents acting on opaque
    outlier scores.
  answer_sources:
  - MDM logs
  - Mobile endpoint security agent logs
  - Change management system logs
  - 'NAI: Corporate-managed Android devices, Mobile Device Management (MDM) server, SIEM, Change Management
    Database (CMDB)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = mdm_config(install_unknown_apps, developer_mode_enabled, os_version,\n  days_since_patch,\
      \ is_rooted, adb_enabled)\nscore = isolation_forest.decision(feats)\nalert if outlier(score) and\
      \ shap_top(feats)=='install_unknown_apps'\ninclude shap_top3(feats)"
- question: Was any installed iOS configuration profile unsigned, or did its identifier fail to match
    the organizational allowlist of approved profiles?
  context: Unsigned or unapproved iOS configuration profiles are a primary mechanism for installing rogue
    CAs and proxy settings that subvert trust controls, squarely a Defense Evasion concern. The analyst
    queries MDM logs for all installed configuration profiles, compares each profile identifier against
    a maintained allowlist, and alerts on any identifier off the allowlist or any profile flagged 'unsigned',
    enriching with device and user details. A positive result indicates a potentially malicious profile
    that may redirect traffic or trust a rogue CA and should be removed; legitimate profiles are signed
    and allowlisted, so deviations are inherently suspicious.
  answer_sources:
  - MDM logs
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Corporate-managed iOS devices, Mobile Device Management (MDM) server, Network egress points/Internet
    Gateway, DNS servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from mdm_logs where profile_type==''ios_config_profile''

      alert if profile_id not in PROFILE_ALLOWLIST or signed==false

      enrich with device_id, user; severity=high'
- question: Were any '.mobileconfig' profiles downloaded from a source hostname whose Shannon entropy
    exceeds 3.5, from a first-seen (< 24h) domain, or from hosts with elevated NXDOMAIN/404 failure rates?
  context: Malicious iOS profiles are often delivered from disposable or algorithmically-generated infrastructure,
    a Defense Evasion delivery signal. From zeek_dns/http the analyst monitors '.mobileconfig' downloads,
    computes Shannon entropy per source hostname and alerts above 3.5, maintains a 30-day baseline of
    domains serving these files and alerts on any first-seen (< 24h) source, and tracks NXDOMAIN/404 failure
    rates as a distinct signal. An Isolation Forest over lexical DNS/HTTP features further flags rare
    delivery infrastructure. A positive result points to suspicious, newly-stood-up distribution; established,
    low-entropy, known-good domains are expected for legitimate profile delivery.
  answer_sources:
  - MDM logs
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Corporate-managed iOS devices, Mobile Device Management (MDM) server, Network egress points/Internet
    Gateway, DNS servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from zeek_dns, zeek_http where uri ends_with ''.mobileconfig''

      ent = shannon_entropy(hostname)

      first_seen = hostname not in domains_30d

      alert if ent > 3.5 or first_seen or nxdomain_404_rate(host) high

      score = isolation_forest(lexical_features(hostname))'
- question: Did the hourly count of '.mobileconfig' downloads across the network exceed the upper bound
    of a seasonally-aware 99% prediction interval (SARIMA/Prophet), indicating a mass profile-distribution
    campaign?
  context: A surge of profile downloads suggests a coordinated push of malicious profiles, relevant to
    Defense Evasion scoping. The analyst aggregates zeek_files.log hourly to count '.mobileconfig' downloads
    network-wide, trains a time-series forecaster (SARIMA or Prophet) that accounts for daily/weekly seasonality,
    and alerts when the observed hourly count exceeds the upper bound of the 99% prediction interval.
    The alert includes observed-vs-expected counts and the contributing source domains for triage. A positive
    result implies a mass-distribution event worth immediate investigation; normal seasonal peaks stay
    within the prediction interval and do not fire.
  answer_sources:
  - MDM logs
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Corporate-managed iOS devices, Mobile Device Management (MDM) server, Network egress points/Internet
    Gateway, DNS servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'hourly = count(*) by hour where file_name ends_with ''.mobileconfig''

      model = sarima_or_prophet.fit(hourly, seasonality=[daily,weekly])

      pi = model.forecast(ci=0.99)

      alert if observed > pi.upper

      include observed, expected, top_source_domains'
