questions:
- question: Does any single mobile device fail (or downgrade) server-side hardware-backed remote attestation
    while still being trusted, and have we configured conditional access to require the hardware-anchored
    verdict rather than the device's self-report?
  context: 'On-device root/jailbreak concealment can spoof what the OS and apps report about themselves,
    but it cannot forge a verdict that is computed in hardware and validated server-side. In the Defense
    Evasion tactic this is the deterministic floor: do not trust the device''s self-reported compliance.
    On Android, verify the [Play Integrity API](https://developer.android.com/google/play/integrity/overview)
    verdict server-side and require MEETS_STRONG_INTEGRITY (hardware-backed) plus appRecognitionVerdict
    == PLAY_RECOGNIZED; raise a high-severity alert whenever a device that previously met STRONG_INTEGRITY
    downgrades to BASIC/DEVICE-only or returns UNRECOGNIZED_VERSION. Independently validate the [hardware
    Key Attestation](https://developer.android.com/privacy-and-security/security-key-attestation) X.509
    chain to the Google root and alert if verifiedBootState != Verified, deviceLocked == false, or securityLevel
    is not TrustedEnvironment/StrongBox. On iOS, require a valid App Attest/DeviceCheck assertion rooted
    in the [Secure Enclave](https://support.apple.com/guide/security/secure-enclave-sec59b0b31ff/web)
    and alert on assertion failure. Per [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf),
    wire these failures into conditional access so a failing or downgraded device is blocked from enterprise
    resources. A positive result (failure or downgrade) is a high-confidence sign of a disguised, compromised
    device; a clean strong-integrity verdict is the only trustworthy ''healthy'' state.'
  answer_sources:
  - MDM Remote Attestation Logs
  - MTD Compliance Status Logs
  - Hardware Key Attestation / Play Integrity Verdicts
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Centralized SIEM or data lake containing Mobile Device Management (MDM) and Mobile Threat Defense
    (MTD) logs and server-side attestation verdicts; Cloud Identity Provider (IdP) conditional access
    policy logs; Network sensors at internet egress points and VPN concentrators.'
  range: Last 90 days, with real-time alerting on any attestation failure or downgrade.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each device attestation event (server-side):\n  android_fail = (integrityVerdict != 'MEETS_STRONG_INTEGRITY')\
      \ or (appRecognitionVerdict != 'PLAY_RECOGNIZED')\n                 or keyattest.verifiedBootState\
      \ != 'Verified' or keyattest.deviceLocked == false\n                 or keyattest.securityLevel\
      \ not in ['TrustedEnvironment','StrongBox'];\n  ios_fail = (appattest.assertion_valid == false);\n\
      \  downgrade = prev_verdict(device_id)=='MEETS_STRONG_INTEGRITY' and current in ['BASIC','DEVICE','UNRECOGNIZED_VERSION'];\n\
      \  alert(high) when android_fail or ios_fail or downgrade;\n  enforce conditional_access.block(device_id);\
      \ output device_id, failed_field, prev_verdict, current_verdict."
- question: Within any 5-minute window, does a single device produce a hardware-anchored attestation failure
    at the same time that its Mobile Threat Defense agent reports it as compliant?
  context: 'This is the core defense-in-depth signal for T1630.003: a divergence between an untrusted
    on-device self-report (MTD says ''compliant'') and a hardware-anchored verdict (server-side attestation
    says ''failure'') is exactly what disguised root/jailbreak produces, because the concealment can fool
    the MTD agent but not the Secure Enclave / TrustZone-anchored attestation. Build a real-time SIEM
    correlation rule that joins MDM/server attestation logs with MTD compliance logs on a common device
    identifier (device_id, serial_number) and fires a high-severity alert when attestation.result == ''failure''
    AND mtd.compliance.status == ''compliant'' with timestamps within 300 seconds of each other, as recommended
    by [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf).
    Enrich every alert with the device''s network activity (source/destination IPs, ports, protocols,
    DNS queries) from Zeek conn.log and dns.log for the 60-minute window around the event, and surface
    the specific attestation field that failed (e.g., verifiedBootState) in the alert text. A match is
    a high-fidelity indicator of disguised compromise; absence of conflict means the two controls agree,
    which is the expected healthy state.'
  answer_sources:
  - MDM Remote Attestation Logs
  - MTD Compliance Status Logs
  - Hardware Key Attestation / Play Integrity Verdicts
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Centralized SIEM or data lake containing Mobile Device Management (MDM) and Mobile Threat Defense
    (MTD) logs and server-side attestation verdicts; Cloud Identity Provider (IdP) conditional access
    policy logs; Network sensors at internet egress points and VPN concentrators.'
  range: Last 90 days, correlated in real time with a 300-second join window (enrich +/-60 minutes).
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join attestation_log A and mtd_compliance_log M on A.device_id == M.device_id\n  where A.result\
      \ == 'failure' and M.status == 'compliant'\n  and abs(A.timestamp - M.timestamp) <= 300s;\nalert(high);\
      \ enrich with zeek_conn(device_id, window=+/-60min)[src_ip,dst_ip,dst_port,proto]\n  and zeek_dns(device_id,\
      \ window=+/-60min)[query];\noutput device_id, A.failed_field, A.timestamp, M.timestamp, network_summary."
- question: For each device, does any hourly network metric (volume, connection frequency, unique destination
    ports, destination-IP entropy, or blocked/rejected connection count) exceed its own 95th-percentile
    baseline, especially within 24 hours of a failed attestation?
  context: Root-tool deployment and the command-and-control that follows disguised compromise leave statistical
    footprints in network behavior even when on-device indicators are hidden. For each unique device identifier,
    establish a 30-day rolling baseline of hourly behavior from Zeek conn.log, profiling Volume (total
    bytes in/out), Frequency (connections/min), unique destination-port count, destination-IP entropy
    H(IP_dst), and Failure state (count of rejected/reset/blocked connections). Compute the 95th percentile
    per metric per device. Raise a medium-severity alert when an hourly value exceeds its 95th-percentile
    threshold, escalating to high if it occurs within 24 hours of a failed attestation event. Derive thresholds
    per fleet from your own data, and explicitly treat blocked-connection bursts as a distinct signal
    rather than discarding them. Environment/behavior divergences cataloged by [Vidas & Christin](https://users.ece.cmu.edu/~tvidas/papers/ASIACCS14.pdf)
    (sensor, build-prop, timing differences) add corroborating features. In Defense Evasion this catches
    the behavioral spillover of concealment; a spike tightly coupled to an attestation failure is strong
    corroboration, while in-baseline behavior supports a benign read.
  answer_sources:
  - MDM Remote Attestation Logs
  - MTD Compliance Status Logs
  - Hardware Key Attestation / Play Integrity Verdicts
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Centralized SIEM or data lake containing Mobile Device Management (MDM) and Mobile Threat Defense
    (MTD) logs and server-side attestation verdicts; Cloud Identity Provider (IdP) conditional access
    policy logs; Network sensors at internet egress points and VPN concentrators.'
  range: Last 90 days, with hourly scoring over a 30-day rolling per-device baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per device_id per hour from zeek_conn:\n  volume=sum(orig_bytes+resp_bytes); freq=count(conn)/60;\n\
      \  u_dst_port=distinct(dst_port); ip_entropy=shannon_entropy(dst_ip distribution);\n  fail=count(conn_state\
      \ in ['REJ','RSTO','RSTR','S0'] or blocked);\nbaseline=rolling_30d_p95(device_id, each_metric);\n\
      alert(medium) when any_metric > baseline_p95;\nescalate(high) when attestation_failure(device_id)\
      \ within 24h;\noutput device_id, metric, value, p95, recent_attestation_status."
- question: Does a per-device time-series model of DNS behavior (query count, unique domains, query-type
    mix, NXDOMAIN/failure ratio) flag a statistically significant anomaly, and does it coincide with an
    MDM attestation failure?
  context: DNS is a durable, hard-to-hide channel for the staging downloads and C2 that accompany disguised
    root compromise. Ingest per-device, per-hour aggregates of Zeek dns.log (query count, unique domains,
    query-type distribution, and the NXDOMAIN/failure ratio as a distinct feature) into a time-series
    store. For each device, apply Seasonal Hybrid ESD (S-H-ESD) per [Hochenbaum, Vallis & Kejariwal](https://arxiv.org/pdf/1704.07706)
    to learn daily/weekly seasonality and flag statistically significant anomalies while controlling false
    positives, escalating priority when the anomaly coincides with an MDM attestation failure. Surface
    the top-3 contributing features (e.g., unique-domain spike, NXDOMAIN ratio, off-hours query volume)
    in the alert for triage. Per [TESSERACT](https://www.usenix.org/system/files/sec19-pendlebury.pdf),
    monitor for concept drift and retrain on a rolling schedule, and keep this model strictly parallel
    to the deterministic attestation rules so it never becomes a single point of failure. In Defense Evasion
    this catches concealment-related DNS behavior that respects absolute thresholds but departs from a
    device's own seasonal norm; an anomaly aligned with an attestation failure warrants investigation.
  answer_sources:
  - MDM Remote Attestation Logs
  - MTD Compliance Status Logs
  - Hardware Key Attestation / Play Integrity Verdicts
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Centralized SIEM or data lake containing Mobile Device Management (MDM) and Mobile Threat Defense
    (MTD) logs and server-side attestation verdicts; Cloud Identity Provider (IdP) conditional access
    policy logs; Network sensors at internet egress points and VPN concentrators.'
  range: Last 90 days, with per-hour series and rolling retraining for seasonality.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = per_device per_hour from zeek_dns:[query_count, unique_domains, qtype_dist, nxdomain_ratio];

      model = SeasonalHybridESD(series, learn_daily_weekly_seasonality);

      anomalies = model.flag_significant(series);

      alert when anomaly; escalate when mdm_attestation_failure(device_id) same_window;

      monitor concept_drift; retrain on rolling schedule;

      output device_id, anomaly_window, top3_features.'
- question: For every process executing as root (UID 0) on a managed mobile device, is the binary's SHA256
    hash absent from both the internal allowlist of known-good system binaries and external threat-intelligence
    blocklists?
  context: 'Adversaries who disguise root indicators commonly rename the su binary and polymorphically
    repackage tools, but a process still has to run as root (UID 0) to do its work, and its binary still
    has a hash. For every process-execution event from MTD logs where the user context is root (user.id
    == 0), query both an internal allowlist of known-good process.file.sha256 values and an external threat-intelligence
    blocklist, and trigger a high-severity alert when the hash is unknown to both. Treat this strictly
    as a deterministic floor: [DroidChameleon](https://pages.cs.wisc.edu/~vrastogi/static/papers/rcj13b.pdf)
    shows trivial renaming/transformation defeats signature matching, so always correlate an unknown-root-process
    event with the behavioral analytics in this playbook (rare parent-child transitions, supervised classification)
    rather than relying on the hash verdict alone. In Defense Evasion an unknown-hash root process is
    a strong lead because legitimate system binaries should all be allowlisted; a known-good hash does
    not clear a device, since the danger is in the renamed or repacked binary your allowlist has not yet
    seen.'
  answer_sources:
  - MTD Process Execution Logs
  - Threat Intelligence Hash Feeds
  - Zeek conn.log
  - Zeek software.log
  - 'NAI: MTD agent log repositories on mobile endpoints; Centralized SIEM or data lake; Threat Intelligence
    Platform for hash lookups; Network sensors monitoring traffic from mobile subnets.'
  range: Last 90 days, with real-time evaluation on every root-context process execution.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each mtd_process_exec where user.id == 0:\n  h = process.file.sha256;\n  known_good =\
      \ h in internal_allowlist;\n  known_bad = h in ti_blocklist;\n  alert(high) when not known_good\
      \ and not known_bad;  # unknown to both\n  always correlate with rare-transition and classifier\
      \ analytics;\n  output device_id, process.name, process.path, h, parent.process.name."
- question: Across the fleet, does a root-privileged process arise from a parent-child spawn relationship
    that falls in the rarest 1% of observed transitions, and does that child then make an outbound connection?
  context: Renaming and repackaging defeat names and hashes, but the structural relationship of which
    process spawns which is far harder to disguise and is a durable signal. Continuously ingest MTD process-execution
    logs and, for each parent-child relationship across the fleet (parent.process.name -> process.name),
    compute frequency over a 30-day rolling window and a rarity score (1/frequency). Trigger a medium-severity
    alert when a root-privileged child's relationship falls in the least-frequent 1% of all observed transitions.
    Modeling spawn behavior as transition probabilities and flagging rare transitions is the rename-resilient
    approach demonstrated by [MaMaDroid](https://arxiv.org/pdf/1612.04433). Escalate to high severity
    if the child initiates any outbound connection (Zeek conn.log) within five minutes, and record the
    connection success/failure state as a distinct feature. In Defense Evasion this catches the moment
    a disguised root tool is spawned by an unexpected parent; a rare transition that immediately reaches
    out to the network is highly suspicious, while common, well-known transitions are consistent with
    normal device operation.
  answer_sources:
  - MTD Process Execution Logs
  - Threat Intelligence Hash Feeds
  - Zeek conn.log
  - Zeek software.log
  - 'NAI: MTD agent log repositories on mobile endpoints; Centralized SIEM or data lake; Threat Intelligence
    Platform for hash lookups; Network sensors monitoring traffic from mobile subnets.'
  range: Last 90 days, scored continuously over a 30-day rolling fleet baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per (parent.process.name -> process.name) over rolling_30d:\n  freq = count(transition) /\
      \ total_transitions;\n  rarity = 1/freq;\nfor root-privileged child (user.id==0):\n  alert(medium)\
      \ when transition in bottom_1pct(freq);\n  escalate(high) when zeek_conn(child) outbound within\
      \ 5min;\n  feature conn_state(success/failure);\n  output device_id, parent, child, rarity, conn_state."
- question: Does a supervised classifier label a privileged-process event as malicious with confidence
    above 0.80, based on process and correlated network features, and what top features drove the verdict?
  context: Root-exploit behavior is learnable independent of naming, so a supervised model generalizes
    past the rename/repack evasions that defeat signatures. Build a feature set for privileged-process
    events from MTD logs (process-name entropy, command-line argument count, parent process) and correlated
    network data (destination port, bytes sent, connection state/failures). Train a supervised classifier
    (Random Forest or Gradient Boosting) on labeled benign/malicious privileged-process events; [RootExplorer](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-gasparis.pdf)
    shows root-exploit behavior models can be derived from root providers, and following [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf),
    prefer models that expose per-feature contributions and surface the top-3 contributing features in
    every alert. Alert on 'malicious' predictions with confidence > 0.80. Per [TESSERACT](https://www.usenix.org/system/files/sec19-pendlebury.pdf),
    use time-aware validation, monitor drift, and retrain on a schedule. In Defense Evasion this gives
    a learned detector that complements the deterministic hash floor and the rare-transition statistic;
    agreement among the three layers raises confidence that a device is running disguised root tooling,
    while explainable features let analysts validate against legitimate privileged activity.
  answer_sources:
  - MTD Process Execution Logs
  - Threat Intelligence Hash Feeds
  - Zeek conn.log
  - Zeek software.log
  - 'NAI: MTD agent log repositories on mobile endpoints; Centralized SIEM or data lake; Threat Intelligence
    Platform for hash lookups; Network sensors monitoring traffic from mobile subnets.'
  range: Last 90 days for scoring, with periodic time-aware retraining on labeled data.
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [proc_name_entropy, cmdline_arg_count, parent_process,\n            dst_port, bytes_sent,\
      \ conn_state, conn_failures];\nmodel = RandomForest_or_GBM.train(labeled benign/malicious privileged\
      \ events, time_aware_split);\npred, prob, contribs = model.predict(features);\nalert when pred=='malicious'\
      \ and prob > 0.80;\nmonitor concept_drift; retrain on schedule;\noutput device_id, process.name,\
      \ prob, top3_contributing_features."
- question: Do any MTD process command-line logs match patterns that remount a filesystem read-write or
    change permissions on sensitive system files (e.g., mount -o rw,remount /system or chmod 777 /system/bin/su)?
  context: 'Gaining and persisting root requires making the normally read-only system partition writable
    or loosening permissions on sensitive binaries, and these actions leave tell-tale command lines even
    when the tools themselves are renamed. Deploy a SIEM rule that applies a regex to the process.command_line
    field in MTD logs to catch filesystem remount and permission changes, e.g. /(mount\s+-o\s+.*rw|chmod\s+(u\+s|g\+s|777|666))/i,
    generating a high-severity alert on match and enriching with Zeek conn.log/files.log for preceding
    downloads or subsequent C2. Treat regex matching as a floor only: [DroidChameleon](https://pages.cs.wisc.edu/~vrastogi/static/papers/rcj13b.pdf)
    shows string/signature checks are evadable, so pair it with runtime information-flow policy as in
    [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf), which deterministically
    flags a sensitive-data read -> process -> egress chain regardless of how the command is named. In
    Defense Evasion a remount or setuid/chmod against /system is a high-signal indicator of active root
    tampering; a match warrants immediate device review, while absence does not clear a device because
    the command may be obfuscated or executed through another vector.'
  answer_sources:
  - MTD File System Integrity Logs
  - MTD Process Command-line Logs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Log storage for MTD agents on mobile endpoints; Centralized SIEM for log correlation; Network
    sensors capable of file extraction (e.g., Zeek); Application sandboxing analysis platforms.'
  range: Last 90 days, with real-time alerting on command-line matches.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each mtd_process where process.command_line matches\n  /(mount\\s+-o\\s+.*rw|chmod\\s+(u\\\
      +s|g\\+s|777|666))/i :\n  alert(high);\n  enrich with zeek_conn/zeek_files(device_id, window=+/-30min)\
      \ for downloads / C2;\n  pair with taint/info-flow policy: flag sensitive_read -> process -> egress;\n\
      \  output device_id, process.command_line, parent.process.name, related_files, related_conns."
- question: For each application package, does the daily Shannon entropy of unique modified directory
    paths (plus write volume and permission-denied counts) deviate more than 3 standard deviations from
    that app's historical baseline?
  context: Polymorphic disguise that accompanies root-tool deployment produces erratic, unusual filesystem
    footprints for an app that normally touches a stable set of paths. For each application package name,
    establish a 30-day baseline of filesystem interaction from MTD file-integrity logs. Per 24-hour window,
    compute the Shannon entropy of unique parent directory paths modified H(paths) plus Volume (count
    of writes) and Failure state (count of permission-denied/failed writes). Alert when daily path entropy
    deviates more than 3 standard deviations from the app's historical mean. Combine with obfuscation
    features quantified by [Dong et al.](https://arxiv.org/pdf/1801.01633) (encrypted-string ratio, reflection
    density, packer/high-entropy segments) to flag the polymorphic disguise that accompanies root-tool
    deployment, and derive deviation thresholds per fleet. In Defense Evasion this catches an app suddenly
    writing across many unusual directories or hitting permission walls as it tries to tamper with protected
    paths; a >3-sigma entropy spike, especially with elevated permission-denied counts, is a strong corroborating
    signal, while behavior within baseline is consistent with the app's normal operation.
  answer_sources:
  - MTD File System Integrity Logs
  - MTD Process Command-line Logs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Log storage for MTD agents on mobile endpoints; Centralized SIEM for log correlation; Network
    sensors capable of file extraction (e.g., Zeek); Application sandboxing analysis platforms.'
  range: Last 90 days, with 24-hour scoring over a 30-day per-app baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per app_package per 24h from mtd_file_integrity:\n  path_entropy = shannon_entropy(distinct\
      \ parent_dir of modified paths);\n  volume = count(writes); fails = count(permission_denied or failed_write);\n\
      baseline = rolling_30d_mean_std(app_package, path_entropy);\nalert when path_entropy > mean + 3*std;\n\
      augment features: encrypted_string_ratio, reflection_density, packer_high_entropy_segments;\noutput\
      \ app_package, device_id, path_entropy, volume, fails, deviation_sigma."
- question: Does an LSTM seq2seq autoencoder trained on benign behavior sequences flag a device's API/network/file/process
    event sequence with a reconstruction error above the 99th percentile, and which events drove it?
  context: Disguised root activity manifests as unusual orderings of low-level events even when each individual
    event looks ordinary, so modeling sequences captures evasion that point checks miss. Represent app
    behavior as sequences of discrete events from MTD and Zeek logs, e.g. [api_call:get_accounts, net_conn:port_443,
    file_mod:/data/data/app/config.xml, proc_exec:/system/bin/sh]. Train an LSTM seq2seq autoencoder on
    benign sequences and flag sequences whose reconstruction error exceeds the 99th percentile of a validation
    set; abstracting and modeling API/call sequences for anomaly detection is the approach validated by
    [MaMaDroid](https://arxiv.org/pdf/1612.04433). Surface the top contributing events driving the reconstruction
    error in the alert for explainability. Per [TESSERACT](https://www.usenix.org/system/files/sec19-pendlebury.pdf),
    evaluate time-aware, monitor concept drift, and retrain regularly, and keep this model parallel to
    the deterministic regex and attestation rules so it is never the sole detector. In Defense Evasion
    a high-reconstruction-error sequence indicates a behavior pattern the model has never seen in benign
    data, such as a remount followed by a shell spawn and an outbound connection; a spike warrants investigation,
    while low reconstruction error supports a benign interpretation.
  answer_sources:
  - MTD File System Integrity Logs
  - MTD Process Command-line Logs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Log storage for MTD agents on mobile endpoints; Centralized SIEM for log correlation; Network
    sensors capable of file extraction (e.g., Zeek); Application sandboxing analysis platforms.'
  range: Last 90 days for scoring, with regular time-aware retraining on benign sequences.
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = ordered events per device from mtd+zeek:\n  e.g. [api_call:*, net_conn:port_*, file_mod:/path,\
      \ proc_exec:/system/bin/*];\nmodel = LSTM_seq2seq_autoencoder.train(benign_sequences);\nerr = reconstruction_error(seq);\n\
      alert when err > p99(validation_set);\nmonitor concept_drift; retrain regularly;\noutput device_id,\
      \ seq_window, err, top_contributing_events."
