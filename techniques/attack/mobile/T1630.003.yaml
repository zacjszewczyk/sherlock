name: 'T1630.003: Disguise Root-Jailbreak Indicators'
id: 8d0f91b6-f6f5-470b-bc04-881155a265cd
description: 'Investigate whether an adversary on a compromised Android or iOS device is actively disguising
  root/jailbreak indicators to defeat enterprise mobile security controls (MITRE ATT&CK T1630.003, Defense
  Evasion). Adversaries rename the su binary, polymorphically repackage root tools, and tamper with on-device
  compliance reporting so that signature- and name-based checks pass while the device is actually compromised.
  This playbook helps an analyst surface that concealment by pivoting off signals that on-device evasion
  cannot forge: hardware-anchored remote attestation (Android Play Integrity / Key Attestation, iOS App
  Attest/DeviceCheck rooted in the Secure Enclave) that conflicts with a self-reported ''compliant'' Mobile
  Threat Defense (MTD) status; unknown-hash processes running as root (UID 0); rare root parent-child
  process spawns; suspicious command lines that remount /system read-write or chmod sensitive binaries;
  and the network, DNS, and filesystem-behavior anomalies that accompany root-tool deployment and command-and-control.
  It layers deterministic symbolic-logic rules (attestation-downgrade alerts, conflict correlation, unknown-root-hash,
  remount/chmod regex) with statistical baselining (port/IP entropy, DNS anomalies, rare process transitions,
  path entropy) and machine-learning detectors (supervised privileged-process classification, S-H-ESD
  time-series, seq2seq autoencoders) so that detection never depends on a single evadable method, and
  surfaces explainable feature drivers for fast SOC triage.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
