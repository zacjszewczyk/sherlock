name: 'T1453: Abuse Accessibility Features'
id: 447fac04-10bb-4e7f-8629-cbd5c7ecb8cc
description: This playbook helps an analyst investigate suspected abuse of Android accessibility features
  (BIND_ACCESSIBILITY_SERVICE) by non-system applications to steal credentials, one-time passcodes, and
  other sensitive data, or to drive automated on-device interaction. It guides the analyst through correlating
  an app being granted accessibility-service control with subsequent high-volume accessibility events,
  traversal of sensitive UI elements (password, OTP, and account-entry fields), reading node text via
  getText()/getSource(), invoking performAction, presentation of overlay windows over other apps' foreground
  activities (the canonical overlay + accessibility 'Cloak and Dagger' pairing), and near-term local buffering
  or outbound transmission of captured text. Detection approaches span deterministic symbolic-logic rules
  (permission-pair watchlists, taint source-to-sink flow tracing to exfiltration sinks, interpretable
  risk-indicator scoring), statistical baselining of per-package event volume/frequency/state, Markov/HMM
  sequence modeling, autoencoder reconstruction-error anomaly detection, failure-state profiling, and
  supervised/explainable machine-learning classification of malicious accessibility tooling versus legitimate
  screen readers and automation aids.
type: technique
related:
- tactic_id: TA0031
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Which non-system Android applications were granted accessibility-service control (BIND_ACCESSIBILITY_SERVICE)
    and then subscribed to text-change or window-content events on other apps and read or acted on login,
    payment, or OTP fields without a documented assistive-function justification?
  context: 'An app that legitimately needs accessibility (a screen reader) traverses the UI broadly and
    in a user-driven way; a credential thief instead targets credential and OTP fields specifically. The
    analyst should look for non-system packages that receive BIND_ACCESSIBILITY_SERVICE and then subscribe
    to TYPE_VIEW_TEXT_CHANGED / window-content events on other apps, traverse the view hierarchy, read
    node text via getText()/getSource(), or invoke performAction on sensitive fields. Use the high-risk
    a11y capability and event taxonomy from the RAID19 ''Kindness is a Risky Business'' study to distinguish
    broad legitimate traversal from targeted harvesting. A positive result is an app with no assistive
    purpose repeatedly reading credential/OTP nodes; a negative result is documented assistive software
    with broad, user-initiated traversal. This is a Credential Access investigation, so weight reads of
    password/OTP/account-entry fields most heavily. Reference: [Kindness is a Risky Business: On the Usage
    of the Accessibility APIs in Android](https://web.cse.ohio-state.edu/~lin.3021/file/RAID19.pdf).'
  answer_sources: &id001
  - Android Logcat
  - Android accessibility service telemetry
  - Mobile EDR telemetry
  - Android permission and overlay usage logs
  - Android clipboard access logs
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Enterprise-managed Android devices, mobile application management (MAM) consoles, and mobile
    device management (MDM) logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "INDEX=mobile_edr (event=accessibility_grant permission=BIND_ACCESSIBILITY_SERVICE app_type!=system)\n\
      | join package [search INDEX=mobile_edr event IN (a11y_event_subscribe, getText, getSource, performAction)\n\
      \    target_field IN (password, otp, account, payment)]\n| where NOT package IN (vetted_assistive_allowlist)\n\
      | stats count by package, target_field"
  - technology: MobileEDR/pseudocode
    query: "for each non-system package p with BIND_ACCESSIBILITY_SERVICE:\n  if p subscribes(text_change|window_content)\
      \ on other_app\n     AND p reads node.getText() on field in {login,payment,otp}\n     AND p has\
      \ no documented assistive justification:\n       alert('targeted a11y field harvesting', p)"
- question: Are there any non-system packages that simultaneously hold SYSTEM_ALERT_WINDOW (draw-on-top/overlay)
    and BIND_ACCESSIBILITY_SERVICE, and is an active accessibility service presenting an overlay over
    another app's foreground activity concurrent with TYPE_WINDOW_STATE_CHANGED events?
  context: 'The combination of overlay (SYSTEM_ALERT_WINDOW) plus accessibility (BIND_ACCESSIBILITY_SERVICE)
    is the canonical ''Cloak and Dagger'' pairing that gives an app complete, stealthy control of the
    UI feedback loop, enabling overlay-based phishing and click-hijacking. The analyst should deterministically
    alert on any non-system package holding both permissions, then raise severity when that service draws
    an overlay window over another app''s foreground activity at the same time as TYPE_WINDOW_STATE_CHANGED
    events (i.e., overlay state = present during a screen transition). This rule should never be removed;
    instead tune an allowlist of vetted assistive/automation packages. A positive result is an unknown
    app holding both permissions and overlaying a foreground login activity. For Credential Access this
    is high-fidelity because it directly enables stealthy capture of typed credentials. Reference: [Cloak
    and Dagger: From Two Permissions to Complete Control of the UI Feedback Loop](http://cloak-and-dagger.org/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'INDEX=mobile_edr permission IN (SYSTEM_ALERT_WINDOW, BIND_ACCESSIBILITY_SERVICE) app_type!=system

      | stats values(permission) as perms by package

      | where perms holds both SYSTEM_ALERT_WINDOW AND BIND_ACCESSIBILITY_SERVICE

      | where NOT package IN (vetted_assistive_allowlist)

      | eval severity=if(overlay_state==''present'' AND event==''TYPE_WINDOW_STATE_CHANGED'',''high'',''medium'')'
  - technology: MobileEDR/pseudocode
    query: "if package has {SYSTEM_ALERT_WINDOW AND BIND_ACCESSIBILITY_SERVICE} and not allowlisted:\n\
      \  alert('cloak-and-dagger permission pair', package)\n  if overlay_present_over_foreground(other_app)\
      \ AND TYPE_WINDOW_STATE_CHANGED:\n    escalate('overlay phishing / click-hijack')"
- question: Does captured text from AccessibilityEvent.getText()/getSource() or clipboard reads flow to
    an exfiltration sink (SMS, file-write, network), and is it correlated with near-term clipboard access,
    local buffering, or connections to newly observed domains or rare IP/ASN pairs?
  context: 'Model AccessibilityEvent.getText()/getSource() and clipboard reads as taint SOURCES and SMS,
    file-write, and network APIs as SINKS, then flag any data flow from a11y-captured text or clipboard
    to a sink, following the FlowDroid source-to-sink taint model (validate rules against DroidBench).
    Correlate the capture event with near-term clipboard access, local buffering, or outbound connections
    to newly observed domains and rare IP/ASN pairs using Zeek dns.log and conn.log. Also check whether
    harvested fields are forwarded between components or to other apps via intents (Intent Space Analysis
    policy-conformance checks). Prioritize apps that harvest field contents and immediately transmit or
    stage the data right after the user submits credentials or one-time passcodes. A positive result is
    a clear capture-then-exfil flow to a rare destination; this is the strongest Credential Access evidence
    because it ties theft to actual data egress. References: [FlowDroid](https://www.bodden.de/pubs/far+14flowdroid.pdf),
    validate against [DroidBench](https://github.com/secure-software-engineering/DroidBench), and [Checking
    Intent-based Communication in Android with Intent Space Analysis](https://dl.acm.org/doi/10.1145/2897845.2897904).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=mobile_edr event IN (getText, getSource, clipboard_read) as source_event

      | transaction package maxspan=120s with (event IN (send_sms, file_write, network_send))

      | join package [search source=zeek:dns.log NOT domain IN (known_good) ] [search source=zeek:conn.log
      rare(resp_h, asn)]

      | table package, source_event, sink_event, dest_domain, resp_asn'
  - technology: Zeek/pseudocode
    query: "# correlate device egress after a11y capture\nfor conn in conn.log where ts within 120s of\
      \ a11y_capture(package):\n  if dns.log query first_seen < 7d OR rare(resp_h, asn):\n    flag(package,\
      \ query, resp_h, asn, 'capture-to-exfil')"
- question: How many high-risk boolean indicators (accessibility + overlay permissions, SEND_SMS/RECEIVE_SMS,
    READ_CONTACTS, request-install-packages, restricted/suspicious API calls, hardcoded network endpoints)
    does each accessibility-using package exhibit, and does any cross a fixed threshold for review?
  context: 'Maintain a deterministic watchlist of interpretable high-risk indicators per package, derived
    from the Drebin static feature families: accessibility+overlay permissions, SEND_SMS/RECEIVE_SMS,
    READ_CONTACTS, REQUEST_INSTALL_PACKAGES, restricted/suspicious API calls, and hardcoded network endpoints.
    Score each package by indicator count and escalate any accessibility service crossing a fixed threshold
    (e.g., >=3 high-risk indicators) for analyst review. This gives a transparent, explainable triage
    signal that does not depend on a trained model. A positive result is an accessibility app stacking
    several risky capabilities (e.g., a11y + overlay + SMS + hardcoded C2). Tied to Credential Access,
    the SMS/contacts/overlay capabilities are exactly those that enable OTP interception and credential
    phishing. Reference: [Drebin: Effective and Explainable Detection of Android Malware in Your Pocket](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=mobile_edr app_type!=system

      | eval ind=0

      | eval ind=ind+if(has(BIND_ACCESSIBILITY_SERVICE) AND has(SYSTEM_ALERT_WINDOW),1,0)

      | eval ind=ind+if(has(SEND_SMS) OR has(RECEIVE_SMS),1,0)

      | eval ind=ind+if(has(READ_CONTACTS),1,0)

      | eval ind=ind+if(has(REQUEST_INSTALL_PACKAGES),1,0)

      | eval ind=ind+if(suspicious_api_call,1,0)

      | eval ind=ind+if(hardcoded_endpoint,1,0)

      | where ind>=3 | sort -ind'
- question: For each package, does accessibility callback volume (events/min), overlay presentation frequency
    (overlays/hour), node-read rate, or foreground/background transition count exceed the 95th percentile
    or 3 standard deviations above its normal baseline?
  context: 'Build per-package baselines for accessibility callback volume (events/min), overlay presentation
    frequency (overlays/hour), node-read rate, and foreground/background transition counts. Alert when
    a service produces sustained bursts of TYPE_VIEW_TEXT_CHANGED, TYPE_WINDOW_STATE_CHANGED, or overlay-window
    activity exceeding the 95th percentile or 3 standard deviations above the legitimate range; derive
    thresholds from your own fleet''s per-package distributions (robustness per MaMaDroid). Capture Volume
    (bytes buffered/transmitted after capture), Frequency (events/min), and State (submit-success vs cancelled)
    explicitly. A positive result is a sustained spike of text-change/overlay events for a package whose
    baseline is low. For Credential Access, an event spike around login/OTP submission is the behavioral
    fingerprint of input capture. Reference: [MaMaDroid](https://arxiv.org/abs/1612.04433).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=mobile_edr event IN (TYPE_VIEW_TEXT_CHANGED, TYPE_WINDOW_STATE_CHANGED, overlay_present)

      | bin _time span=1m

      | stats count as events by package, _time

      | eventstats avg(events) as mu, stdev(events) as sd, p95(events) as p95 by package

      | where events > p95 OR events > mu + 3*sd'
- question: When each app's accessibility-event/API stream is modeled as a Markov chain or HMM, do any
    packages exhibit low-likelihood transition sequences (subscribe -> traverse -> read-text -> clipboard/network)
    relative to the benign-app transition model?
  context: 'Represent each app''s abstracted API/accessibility-event stream as a Markov chain and use
    transition probabilities (subscribe -> traverse -> read-text -> clipboard/network) as deviation features,
    per MaMaDroid; package/family abstraction keeps the model stable across Android API churn. For ordered
    runtime traces, fit Hidden Markov Models whose hidden states map to attack phases and support incremental
    updates as new variants appear (IMCDCF). Flag low-likelihood sequences relative to the benign transition
    model. A positive result is an app whose event-ordering closely matches a capture-then-exfil chain
    but is improbable under benign behavior. Tied to Credential Access, the ordered chain from subscribing
    to events through reading text to network egress is the operational signature of accessibility-based
    credential theft. References: [MaMaDroid](https://arxiv.org/abs/1612.04433) (code: [bitbucket](https://bitbucket.org/gianluca_students/mamadroid_code)),
    and [IMCDCF: An Incremental Malware Detection Approach Using Hidden Markov Models](https://arxiv.org/abs/2304.07989).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "build benign_markov from abstracted_event_stream(vetted_apps)\nfor each package p:\n  seq\
      \ = abstract(event_stream(p))  # subscribe,traverse,read_text,clipboard,network\n  loglik = score(benign_markov,\
      \ seq)\n  if loglik < threshold_pXX: alert('improbable a11y sequence', p)"
  - technology: MobileEDR/pseudocode
    query: 'fit HMM with hidden states {subscribe, traverse, capture, stage, exfil}

      on ordered runtime traces; incrementally update per IMCDCF

      flag traces whose Viterbi path traverses capture->exfil with low emission likelihood under benign
      model'
- question: Which packages produce autoencoder reconstruction error above the tuned percentile threshold
    when their feature vectors (permissions, API/accessibility-event profiles, overlay state) are scored
    against a model trained on vetted benign assistive apps?
  context: 'Train a deep autoencoder on feature vectors (permissions, API/accessibility-event profiles,
    overlay state) of vetted benign assistive apps, and flag packages whose reconstruction error exceeds
    a tuned percentile threshold as anomalous (per ''Android Malware Detection Using Autoencoder''). This
    unsupervised path catches zero-day accessibility abusers without labeled samples of every family;
    set the error cutoff from the benign validation-set error distribution. A positive result is a high-reconstruction-error
    package that does not resemble any vetted assistive app. For Credential Access, this surfaces novel
    a11y-abusing harvesters and overlay phishers that signature/rule approaches miss. Reference: [Android
    Malware Detection Using Autoencoder](https://arxiv.org/abs/1901.07315).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "train autoencoder AE on feature_vectors(vetted_benign_assistive_apps)\nthreshold = p99(reconstruction_error(AE,\
      \ benign_validation_set))\nfor each package p:\n  err = reconstruction_error(AE, feature_vector(p))\n\
      \  if err > threshold: alert('a11y anomaly outlier', p, err)"
- question: Are there spikes in accessibility failure-mode signals (denied/repeated BIND_ACCESSIBILITY_SERVICE
    prompts, user-dismissed overlays, OTP/credential fields read but submit cancelled, NXDOMAIN/blocked
    C2 lookups, failed exfil POSTs) co-occurring with capture activity?
  context: 'Track failure-mode rates as distinct signals: denied/repeated BIND_ACCESSIBILITY_SERVICE prompts,
    overlay windows dismissed by the user, OTP/credential fields read but submit cancelled, NXDOMAIN/blocked
    C2 lookups, and failed exfil POSTs (4xx/timeouts). Model these as additional states in the per-app
    sequence baselines (cf. MaMaDroid). A spike in capture events paired with elevated failed-network
    or repeated-permission-prompt rates is a strong abuse indicator and reduces false positives from well-behaved
    assistive tools. A positive result is high capture activity alongside repeated permission nags and
    failed C2 lookups/POSTs. For Credential Access, these error states reveal coercive permission-grant
    attempts and exfil retries characteristic of malware rather than legitimate assistive software. Reference:
    [MaMaDroid](https://arxiv.org/abs/1612.04433).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=mobile_edr event IN (a11y_prompt_denied, overlay_dismissed, submit_cancelled)

      | append [search source=zeek:dns.log rcode=NXDOMAIN OR action=blocked]

      | append [search proxy:http status>=400 OR action=timeout]

      | bin _time span=10m | stats count as fails by package,_time

      | eventstats avg(fails) as mu, stdev(fails) as sd by package

      | where fails > mu + 3*sd AND capture_events(package,_time) high'
- question: Does a supervised classifier (Random Forest over Markov features, linear-SVM over Drebin static
    features, CNN over opcode sequences, plus an HIN model linking unknown apps to known-malicious peers)
    separate the package from legitimate screen readers/automation aids and label it a keylogger-style
    harvester or overlay phisher?
  context: 'Train a supervised model on telemetry features such as accessibility API call order, target
    field types, overlay state, foreground/background transitions, package reputation, and follow-on network
    timing to separate legitimate screen readers/automation aids from keylogger-style harvesters and overlay
    phishing apps. Use resilient, explainable baselines: Random Forest over MaMaDroid Markov-chain features
    and linear-SVM over Drebin static features, augmented by a CNN over opcode sequences for code-level
    overlay/keylogger patterns (Deep Android Malware Detection) and a heterogeneous-information-network
    model (AiDroid) that links unknown apps to known-malicious peers via shared APIs/signatures for real-time
    detection. A positive result is a confident malicious classification corroborated across models. For
    Credential Access, this consolidates the behavioral and static evidence into an actionable verdict.
    References: [MaMaDroid](https://arxiv.org/abs/1612.04433), [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf),
    [Deep Android Malware Detection](https://adamdoupe.com/publications/deep-android-malware-detection-codaspy2017.pdf),
    and [AiDroid](https://arxiv.org/abs/1811.01027).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [a11y_api_order, target_field_types, overlay_state, fg_bg_transitions, pkg_reputation,
      followon_net_timing]

      verdict_rf  = RandomForest(markov_features).predict(package)

      verdict_svm = LinearSVM(drebin_static_features).predict(package)

      verdict_cnn = CNN(opcode_sequences).predict(package)

      verdict_hin = AiDroid_HIN(shared_apis_signatures).predict(package)

      if majority(verdict_*) == malicious: alert(''malicious a11y tooling'', package)'
- question: For each model alert, what are the top-3 contributing features (e.g., BIND_ACCESSIBILITY_SERVICE+SYSTEM_ALERT_WINDOW,
    SMS APIs, OTP-field reads, outbound-to-new-domain timing) driving the malicious verdict?
  context: 'For every model alert, surface the top-3 contributing features in the alert text using gradient/relevance
    attribution (per ''Explaining Black-box Android Malware Detection''). Typical contributors include
    the BIND_ACCESSIBILITY_SERVICE+SYSTEM_ALERT_WINDOW pairing, SMS APIs, OTP-field reads, and outbound-to-new-domain
    timing. This gives analysts an explainable, source-grounded rationale and lets them confirm the verdict
    rests on genuine accessibility-abuse indicators rather than dataset artifacts before escalation. A
    positive, trustworthy result is one where the top features are clearly abuse-relevant; if the top
    features are spurious, the analyst can downgrade. For Credential Access, explainability ensures escalations
    are defensible and analyst-actionable. Reference: [Explaining Black-box Android Malware Detection](https://arxiv.org/abs/1803.03544).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for each model_alert a on package p:\n  attributions = relevance_attribution(model, feature_vector(p))\
      \  # gradient/LRP\n  top3 = sort_desc(attributions)[:3]\n  annotate(a, top_features=top3)  # e.g.,\
      \ {a11y+overlay, SMS_api, otp_read}\n  if top3 are abuse_relevant: escalate else downgrade"
