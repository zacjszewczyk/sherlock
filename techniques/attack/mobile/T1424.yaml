name: 'T1424: Process Discovery'
id: 626b8544-fc3b-40a7-89d9-f84e4873af3a
description: >-
  Investigate whether an adversary is attempting to discover running processes on managed mobile devices
  (Android and iOS) and across the supporting enterprise. Process Discovery (T1424) lets an adversary
  learn what software and services run on a device so they can shape follow-on actions such as deciding
  whether to fully infect a target or trigger specific payloads. Because modern Android (7+) uses kernel
  hidepid and enforcing SELinux, and modern iOS sandboxes block broad enumeration, on-device discovery
  usually requires elevated privileges (root/jailbreak) or generates a burst of failed/denied accesses.
  This playbook helps an analyst hunt for: outbound exfiltration of a process list (anomalous HTTP POSTs,
  high-entropy or Base64 bodies, DNS tunneling, C2 indicators); USB-attached enumeration where adb.exe
  spawns process-listing utilities on a workstation; MDM-reported root/jailbreak state corroborated by
  connections to rooting/jailbreaking toolkit infrastructure; on-device Android ActivityManager/ps/proc
  traversal and SELinux AVC denials; and iOS sandbox-denial and restricted-interface access attempts gated
  on integrity posture. It pairs symbolic-logic rules, statistical baselining, and machine-learning models
  so a SOC analyst can detect and triage process-discovery activity end to end.
type: technique
related:
- tactic_id: TA0032
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: >-
    Are any managed mobile devices sending HTTP/S POST requests to known command-and-control infrastructure
    (matching a C2 IP, domain, or JA3/JA3S hash on a threat-intel list) that could be exfiltrating a collected
    process list?
  context: >-
    Under the Discovery tactic, an adversary who has enumerated running processes on a mobile device will
    frequently ship that list back to C2. This question hunts for the deterministic pairing of an outbound
    connection from the mobile device IP range to known-bad infrastructure combined with an HTTP POST
    that carries data outward. A match on a curated C2 threat-intel feed plus an egress POST is strong,
    source->sink (sensitive-read to network-egress) evidence of exfiltration in the spirit of TaintDroid
    taint tracking. A positive result means a device is talking to known adversary infrastructure and
    pushing data; a negative result narrows exfiltration to unknown infrastructure that the statistical
    and ML questions will cover.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi access points, network egress points, DNS servers, VPN concentrators, web proxies,
    Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM zeek_conn JOIN zeek_http ON uid
      WHERE src_ip IN mobile_device_ranges
        AND (dst_ip IN ti_c2_ips OR query IN ti_c2_domains OR ssl.ja3 IN ti_c2_ja3 OR ssl.ja3s IN ti_c2_ja3s)
        AND http.method == 'POST'
      THEN alert(severity='high', reason='process-list exfil to known C2 via POST')
- question: >-
    Are there outbound HTTP POSTs from the mobile VLAN with abnormally high body entropy or Base64-like
    content, or DNS queries with abnormally long/high-entropy labels, indicating an encoded or tunneled
    process list leaving the network?
  context: >-
    Adversaries often encrypt or encode an exfiltrated process list, or smuggle it out via DNS tunneling,
    so it evades simple signature matching. This question computes Shannon entropy of POST bodies and
    URI length, and query-name length/entropy for DNS, then compares against 30-day rolling per-user/per-device
    baselines, alerting above the 99.5th percentile, especially for newly observed domains. Critically,
    profile the failure state: a spike in NXDOMAIN/SERVFAIL responses or oversized labels is a distinct
    DNS-tunneling signal of low-throughput exfiltration. High entropy (>4.5) suggests encryption; moderate
    entropy (3.5-4.5) with a Base64 charset suggests encoding. Positive results flag candidate covert
    channels for the Discovery->exfiltration sequence.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi access points, network egress points, DNS servers, VPN concentrators, web proxies,
    Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days (with 30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      # HTTP POST bodies
      FOR each http POST WHERE src_ip IN mobile_vlan:
        e = shannon_entropy(body); ulen = len(uri)
        baseline = rolling_30d_percentile(device, [e, ulen])
        IF e > p99_5(entropy) OR ulen > p99_5(uri_len): flag(device, newly_observed_domain?)
      # DNS
      FOR each dns query:
        qlen=len(qname); qe=char_entropy(qname)
        IF qlen > p99_5 OR qe > p99_5 OR nxdomain_rate spike: flag('DNS tunneling')
- question: >-
    Can a Random Forest classifier, trained on Zeek-derived session features, identify command-and-control
    exfiltration sessions carrying a process list, and which features drove each alert?
  context: >-
    This supervised model captures multivariate patterns that single thresholds miss. Train a Random Forest
    on features such as request-body entropy, URI length, DNS query-name length and entropy, connection
    duration, bytes sent, destination port, domain age, ASN rarity, TLS cipher popularity, and per-device
    NXDOMAIN rate. For triage, emit the top-3 contributing features (e.g., body entropy, bytes sent, newly-observed-domain
    age) following Drebin's explainable-feature-ranking approach. In the Discovery context a high-confidence
    classification indicates a device session that statistically resembles known C2 exfil, warranting
    investigation of the device's recent process-enumeration activity.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi access points, network egress points, DNS servers, VPN concentrators, web proxies,
    Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [body_entropy, uri_len, qname_len, qname_entropy, duration,
                  bytes_sent, dst_port, domain_age, asn_rarity, tls_cipher_pop, nxdomain_rate]
      model = RandomForest.load('c2_exfil.rf')
      score = model.predict_proba(features)
      IF score > threshold:
        alert(top3 = model.feature_importances(features))
- question: >-
    Does an LSTM autoencoder over per-device hourly bytes-sent reveal anomalous outbound volume spikes
    that coincide with recent process-discovery indicators on the same device?
  context: >-
    Even encoded exfiltration changes a device's outbound volume profile. Train an LSTM autoencoder on
    bytes-sent-per-device-per-hour and alert when reconstruction error exceeds a tuned threshold AND the
    device has recent process-discovery indicators, using sequence anomaly modeling analogous to DeepLog.
    Surface the contributing time window and feature in the alert. A positive result ties a quantitative
    volume anomaly to discovery behavior, raising confidence that a process list (or more) is being exfiltrated;
    correlating the two reduces false positives from benign bandwidth bursts.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi access points, network egress points, DNS servers, VPN concentrators, web proxies,
    Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days (hourly sequences)
  queries:
  - technology: ML/pseudocode
    query: |-
      seq = bytes_sent_per_hour[device][-N:]
      recon = lstm_autoencoder.reconstruct(seq)
      err = mse(seq, recon)
      IF err > tuned_threshold AND device has recent process_discovery_indicator:
        alert(window=argmax_error_window(seq), feature='bytes_sent')
- question: >-
    On any workstation, does adb.exe spawn a process-enumeration utility such as tasklist.exe, ps.exe,
    wmic.exe, cmd.exe, or powershell.exe running Get-Process, indicating process discovery against a USB-connected
    mobile device?
  context: >-
    When a mobile device is physically connected via USB, the Android Debug Bridge can drive host-side
    commands. This question alerts on Windows Event ID 4688 where ParentProcessName ends with adb.exe
    and NewProcessName is a known enumeration utility; for PowerShell, inspect Event ID 4104 / command
    line for Get-Process, gps, or ps. The enumeration-utility ground truth comes from Process Discovery
    T1057, and rapid bursts of multiple discovery commands on one host follow CAR-2016-03-001. Severity
    is higher on non-developer workstations (finance, sales, executive) where adb activity is unexpected.
    A positive result indicates host-mediated process discovery against a mobile device under the Discovery
    tactic.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Employee workstations, developer machines, privileged user workstations, Jump servers, Virtual
    Desktop Infrastructure (VDI) instances.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM win_event WHERE EventID==4688
      WHERE ParentProcessName ENDSWITH 'adb.exe'
        AND NewProcessName IN ['tasklist.exe','ps.exe','wmic.exe','cmd.exe','powershell.exe']
        AND (NewProcessName!='powershell.exe' OR CommandLine ~ /Get-Process|gps|\bps\b/)
        -- also correlate EventID 4104 ScriptBlockText ~ /Get-Process/
      THEN alert(severity = host_role=='developer' ? 'med' : 'high')
- question: >-
    For hosts where adb.exe is present, which parent-child process relationships are rare or never-before-seen
    for the user's role (Developer, IT, Sales), suggesting unauthorized enumeration?
  context: >-
    Not all adb usage is malicious, so this question baselines parent-child process relationships on hosts
    running adb.exe, segmented by user role. Compute an environmental prevalence score per parent-child-role
    tuple and alert when prevalence is below a threshold (e.g., <1%) or never previously observed for
    that role, consistent with behavioral-baselining guidance from CISA/NSA on living-off-the-land. A
    developer spawning tasklist via adb may be normal; the same lineage on a sales laptop is anomalous.
    Positive results highlight role-inappropriate process discovery for analyst review under the Discovery
    tactic.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Employee workstations, developer machines, privileged user workstations, Jump servers, Virtual
    Desktop Infrastructure (VDI) instances.'
  range: Last 90 days (with historical baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each 4688 event WHERE 'adb.exe' present on host:
        tuple = (ParentProcessName, NewProcessName, user_role)
        prevalence = count(tuple) / count(events for user_role)
        IF prevalence < 0.01 OR tuple never seen for user_role:
          alert('rare adb parent-child for role', tuple)
- question: >-
    Does an Isolation Forest over Event ID 4688 process-lineage features flag anomalous adb process trees
    (e.g., adb.exe spawning tasklist.exe on a finance machine) as outliers?
  context: >-
    This unsupervised model finds rare combinations without needing labeled attacks. Apply an Isolation
    Forest to Event ID 4688 data using features ParentProcessName, NewProcessName, AD-group user context,
    host security group, and command-line length/entropy. It flags, for example, adb.exe spawning tasklist.exe
    on a finance machine as a high-scoring outlier. Surface the top-3 contributing features in the alert.
    A high anomaly score under the Discovery tactic indicates a process-enumeration lineage that does
    not fit the host's normal behavior and merits triage.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Employee workstations, developer machines, privileged user workstations, Jump servers, Virtual
    Desktop Infrastructure (VDI) instances.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [ParentProcessName, NewProcessName, user_ad_group,
                  host_security_group, cmdline_len, cmdline_entropy]
      model = IsolationForest.load('adb_lineage.if')
      score = model.anomaly_score(encode(features))
      IF score > threshold:
        alert(top3 = explain(model, features))
- question: >-
    Has any MDM-managed device changed status to 'rooted' or 'jailbroken' while also contacting DNS/HTTP/TLS/IP
    infrastructure associated with known rooting or jailbreaking toolkits?
  context: >-
    Root/jailbreak is the feasibility precondition for broad on-device process enumeration, so this question
    fires a high-severity real-time alert on any MDM device-status change to 'rooted' or 'jailbroken'
    and matches the device's DNS (dns.log), HTTP host (http.log), TLS SNI (ssl.log), and destination IP/JA3
    (conn.log) against a threat-intel feed of compromise-tool infrastructure. Corroborate with deterministic
    jailbreak checks (jailbreak files/paths, sandbox-escape writes, cydia:// scheme, fork()/system() availability)
    per OWASP MASTG and, on Android, with SELinux AVC denials indicating policy bypass. A positive result
    means a device has both lost its integrity guarantees and is talking to compromise infrastructure,
    enabling the Discovery tactic.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Mobile Device Management (MDM) platforms, corporate network egress points, guest Wi-Fi networks,
    DNS resolvers, Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      ON mdm_event WHERE status_change IN ['rooted','jailbroken']:
        device_ip = resolve(mdm.device_id)
        IF EXISTS zeek WHERE src_ip==device_ip AND (
             dns.query IN ti_tool_domains OR http.host IN ti_tool_hosts OR
             ssl.server_name IN ti_tool_sni OR conn.dst_ip IN ti_tool_ips OR conn.ja3 IN ti_tool_ja3):
          alert(severity='high', corroborate=[jailbreak_files, cydia_scheme, selinux_avc_denied])
- question: >-
    Which devices accumulate a high composite risk score from DNS queries to newly observed domains, connections
    to non-standard ports, rare/self-signed TLS issuers, and elevated NXDOMAIN/blocked-connection rates?
  context: >-
    Rather than a single indicator, maintain a per-device composite risk score incremented by statistical
    anomalies: (1) DNS queries to newly observed domains above the 95th percentile of the device's peer
    group; (2) connections to non-standard ports above the 98th percentile; (3) rare/self-signed TLS issuers
    versus a 30-day baseline; and (4) elevated NXDOMAIN/blocked-connection rates as a distinct failure-state
    signal. Alert when the aggregate score crosses threshold. This catches rooting/jailbreaking and subsequent
    discovery activity that uses unknown infrastructure not yet on threat feeds, supporting the Discovery
    tactic.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Mobile Device Management (MDM) platforms, corporate network egress points, guest Wi-Fi networks,
    DNS resolvers, Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each device per window:
        score = 0
        IF nod_query_count > p95(peer_group): score += w1
        IF nonstd_port_conn > p98(peer_group): score += w2
        IF tls_issuer rare_or_selfsigned vs 30d_baseline: score += w3
        IF nxdomain_rate OR blocked_conn_rate spike: score += w4   # failure state
        IF score > threshold: alert(device, contributing_factors)
- question: >-
    Does an XGBoost domain-reputation classifier feeding a SARIMA time-series model reveal devices whose
    average destination reputation drops sharply, correlated with MDM 'rooted'/'jailbroken' alerts?
  context: >-
    This two-stage model quantifies a device's drift toward bad infrastructure. Score each destination
    domain in real time with an XGBoost classifier using domain age, query-to-answer ratio, TTL, threat-feed
    presence, TLS issuer, and lexical features; feed the scores into a SARIMA time-series model to flag
    devices whose average destination reputation drops sharply, and auto-correlate with MDM 'rooted'/'jailbroken'
    alerts. Emit the top-3 contributing features per alert for explainability as in Drebin. A sharp reputation
    decline coinciding with a root/jailbreak event strongly suggests an actively compromised device pursuing
    the Discovery tactic.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Mobile Device Management (MDM) platforms, corporate network egress points, guest Wi-Fi networks,
    DNS resolvers, Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days (time-series)
  queries:
  - technology: ML/pseudocode
    query: |-
      FOR each domain: rep = xgboost.predict([domain_age, q2a_ratio, ttl,
              threat_feed_presence, tls_issuer, lexical_feats])
      device_rep_series = avg(rep) per device per interval
      forecast = sarima.fit_predict(device_rep_series)
      IF actual_rep << forecast (sharp drop) AND mdm.status IN ['rooted','jailbroken']:
        alert(device, top3=xgboost.explain())
- question: >-
    On managed Android 7+ devices, is a non-privileged app performing broad /proc or ps enumeration or
    ActivityManager running-task/service queries, and are SELinux AVC 'denied' messages appearing for
    /proc traversal?
  context: >-
    On Android 7+, kernel hidepid plus enforcing SELinux mean any successful broad /proc or ps enumeration
    by a non-root, non-privileged app violates platform policy. Alert on SELinux AVC 'denied' messages
    for proc traversal and on Runtime.exec('ps'/toybox) or ActivityManager running-task/service queries
    from an app whose declared function does not require them, using the enumeration API/utility ground
    truth in Process Discovery T1057 and platform invariants from SELinux for Android. A burst of multiple
    distinct discovery calls in a short window follows CAR-2016-03-001. Positive results indicate an app
    probing the process table under the Discovery tactic; AVC denials alone reveal blocked-but-attempted
    enumeration.
  answer_sources:
  - android:logcat (OS API Execution)
  - auditd:SYSCALL
  - Linux kernel SELinux audit (AVC) log
  - android:logcat (Process Creation)
  - Mobile Device Management (MDM) logs
  - 'NAI: MDM/MTD agents on managed Android devices, on-device EDR/auditd collection, SELinux audit (AVC)
    logs, logcat forwarders.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM android_logs WHERE\n  selinux_avc == 'denied' AND target ~ /proc/ \n  OR logcat.api IN\
      \ ['getRunningAppProcesses','getRunningServices','getRunningTasks']\n  OR proc_creation.cmd ~ /\\\
      b(ps|toybox|toolbox)\\b/\n  OR auditd.syscall IN ['openat','getdents64','readlink'] AND path ~ /^\\\
      /proc\\//\nGROUP BY uid WINDOW 1m\nIF distinct_discovery_calls >= N AND app_declared_function NOT\
      \ requires_process_list:\n  alert(uid, severity='high' if background AND no_ui_workflow)"
- question: >-
    For each Android app/UID, does the rate of getRunningAppProcesses calls, the number of distinct PIDs/proc
    entries read, or the rate of EACCES/AVC-denied /proc accesses exceed its 30-day per-app baseline?
  context: >-
    Some apps legitimately query limited process state, so baseline each app/UID over 30 days for the
    count/min of getRunningAppProcesses calls, the volume of distinct PIDs and /proc entries read, and
    CPU/memory/process-count features as in Andromaly. Alert when enumeration frequency or distinct-PID
    coverage exceeds the 99.5th per-app percentile. Treat the rate of EACCES/AVC-denied /proc accesses
    as a distinct failure-state signal whose spike indicates active probing. This catches both successful
    over-enumeration and blocked-but-persistent attempts under the Discovery tactic.
  answer_sources:
  - android:logcat (OS API Execution)
  - auditd:SYSCALL
  - Linux kernel SELinux audit (AVC) log
  - android:logcat (Process Creation)
  - Mobile Device Management (MDM) logs
  - 'NAI: MDM/MTD agents on managed Android devices, on-device EDR/auditd collection, SELinux audit (AVC)
    logs, logcat forwarders.'
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each app/uid:
        rate = getRunningAppProcesses_calls_per_min
        coverage = distinct_pids_or_proc_entries_read
        fail = eacces_or_avc_denied_proc_per_min   # failure-state signal
        IF rate > p99_5(app) OR coverage > p99_5(app) OR fail spikes:
          alert(app, [rate, coverage, fail])
- question: >-
    Do Markov API-transition modeling and an LSTM over the device's syscall/log-key stream flag anomalous
    enumeration sequences (rare transitions into ActivityManager/Process/Runtime.exec)?
  context: >-
    Enumeration behavior shows up as unusual sequences of API calls and syscalls. Detect it with (1) Markov
    API-transition modeling that scores rare transitions into ActivityManager/Process/Runtime.exec packages
    as in MaMaDroid, and (2) LSTM sequence anomaly detection over the device's syscall/log-key stream
    as in DeepLog, with syscall-sequence baselining per 'A Sense of Self for Unix Processes'. Emit the
    top-3 contributing features/transitions in the alert for explainability per Drebin. Under the Discovery
    tactic, anomalous transition or syscall sequences identify apps whose runtime behavior deviates toward
    process enumeration even when individual calls look benign.
  answer_sources:
  - android:logcat (OS API Execution)
  - auditd:SYSCALL
  - Linux kernel SELinux audit (AVC) log
  - android:logcat (Process Creation)
  - Mobile Device Management (MDM) logs
  - 'NAI: MDM/MTD agents on managed Android devices, on-device EDR/auditd collection, SELinux audit (AVC)
    logs, logcat forwarders.'
  range: Last 90 days (sequence windows)
  queries:
  - technology: ML/pseudocode
    query: |-
      # Markov API transitions
      p = markov_model.transition_prob(prev_api -> curr_api)
      IF curr_api IN [ActivityManager.*, Process.*, Runtime.exec] AND p < eps: flag
      # LSTM over syscall/log-key stream
      err = lstm.reconstruct(syscall_seq[device])
      IF err > threshold: alert(top3 = explain(transitions, seq))
- question: >-
    On managed iOS devices, after confirming jailbreak/attestation-failure feasibility, is any app attempting
    to query the process table or restricted system interfaces (e.g., sysctl-like calls)?
  context: >-
    Modern iOS sandboxing normally blocks broad process enumeration for App Store apps, so feasibility
    gating comes first: establish compromise with deterministic jailbreak checks (jailbreak files/paths,
    sandbox-escape writes, cydia:// scheme, fork()/system() availability, dylib injection) per OWASP MASTG
    plus MDM integrity-attestation failure. Then alert when a jailbroken/failed-attestation device shows
    app attempts to query the process table or restricted interfaces (sysctl-like calls), as catalogued
    for process enumeration in Process Discovery T1057. This ordering avoids noise from sandbox denials
    on healthy devices while catching real Discovery activity on compromised ones.
  answer_sources:
  - MDM:DeviceIntegrity (Host Status)
  - iOS:unifiedlog (Application Log Content)
  - Mobile Threat Defense (MTD) logs
  - 'NAI: MDM/MTD attestation services, iOS unified log collection via MDM/MTD agents, app sandbox denial
    telemetry.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      feasible = mdm.attestation_failed OR jailbreak_check(files, sandbox_escape,
                   cydia_scheme, fork_system_available, dylib_injection)
      IF feasible AND unifiedlog shows app_attempt(process_table_query OR sysctl_like OR private_framework):
        alert(device, app, severity='high')
- question: >-
    For each iOS app/device, does the rate of sandbox denials and restricted-interface access errors exceed
    its 30-day baseline, indicating repeated probing regardless of any successful read?
  context: >-
    On iOS, even failed enumeration attempts leave a trail of sandbox denials. Per app/device, baseline
    the rate of iOS sandbox denials and restricted-interface access errors over 30 days; alert when the
    denied-access count/min exceeds the 99th percentile, treating repeated denials as a distinct failure-state
    probing signal independent of any successful read, per OWASP MASTG. A spike means an app is persistently
    attempting restricted access (such as process-table querying) even though the sandbox blocks it, which
    is meaningful evidence of the Discovery tactic on a device whose integrity may be eroding.
  answer_sources:
  - MDM:DeviceIntegrity (Host Status)
  - iOS:unifiedlog (Application Log Content)
  - Mobile Threat Defense (MTD) logs
  - 'NAI: MDM/MTD attestation services, iOS unified log collection via MDM/MTD agents, app sandbox denial
    telemetry.'
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each app/device:
        denials = sandbox_denial_or_restricted_iface_errors_per_min
        baseline = rolling_30d_percentile(app_device)
        IF denials > p99(baseline):
          alert('repeated restricted-access probing', app, device)
- question: >-
    Does an explainable classifier over iOS app behavioral features (restricted-API/private-framework
    usage, sandbox-denial counts, post-access network beacons) flag apps performing process discovery,
    correlated with MDM jailbreak/attestation status?
  context: >-
    This model combines multiple weak signals into a confident verdict. Train an explainable classifier
    over app behavioral features such as restricted-API/private-framework usage, sandbox-denial counts,
    and post-access network beacons, and emit the top-3 contributing features per alert following Drebin's
    explainable-feature approach. Correlate the output with MDM jailbreak/attestation status before escalation
    so alerts focus on devices where enumeration is actually feasible. Under the Discovery tactic, a high
    score plus a compromised integrity posture indicates an app likely performing process discovery and
    possibly beaconing results out.
  answer_sources:
  - MDM:DeviceIntegrity (Host Status)
  - iOS:unifiedlog (Application Log Content)
  - Mobile Threat Defense (MTD) logs
  - 'NAI: MDM/MTD attestation services, iOS unified log collection via MDM/MTD agents, app sandbox denial
    telemetry.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [restricted_api_usage, private_framework_usage,
                  sandbox_denial_count, post_access_beacon_count]
      score = classifier.predict_proba(features)
      IF score > threshold AND mdm.status IN ['jailbroken','attestation_failed']:
        alert(app, top3 = classifier.explain(features))
