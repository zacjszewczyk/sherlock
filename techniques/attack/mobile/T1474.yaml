name: 'T1474: Supply Chain Compromise'
id: 2497fe5b-093c-4c94-8f20-1826acb67628
description: 'This playbook helps an analyst investigate whether a corporate mobile application has been
  compromised through its supply chain (MITRE ATT&CK T1474, Supply Chain Compromise) on Android and iOS.
  Adversaries can manipulate development tools, source-code repositories, open-source or advertising dependencies,
  software update/distribution mechanisms, or signed builds so that a legitimately-identified app delivered
  through the expected MDM/distribution path silently gains malicious capability after install or update.
  The hunt pursues this from several complementary angles: correlating MDM-pushed update events with post-update
  network behavior (Zeek dns.log, ssl.log, conn.log) to catch C2 callbacks, rare JA3/JA3S fingerprints,
  untrusted certificates, DGA-like domains, and failed-connection beacon-failure signals; watching build-side
  telemetry on developer workstations and CI/CD servers (Windows Event IDs 4688, 5156, 4104) for build
  tools spawning network utilities, rare parent-child process chains, high-entropy command lines, and
  dependency/maintainer changes plus tainted source->sink dataflows; profiling aggregate post-update traffic
  for volume/frequency/distribution shifts, change points, and periodic beaconing; and detecting on-device
  behavioral drift via MDM permission/entitlement inventories and MobileEDR OS API execution and application-state
  telemetry. Detection methods combine deterministic symbolic-logic correlation (IOC/JA3 matching, build-tool-to-LOLBin
  rules, permission/dataflow diffs), statistical baselining and rarity scoring (90/30-day rolling baselines,
  Modified Z-Score/MAD, domain entropy, Poisson/Chi-squared/K-S tests, CUSUM/PELT change-point detection,
  DFT beacon scoring, Markov API-transition distances), and machine learning (autoencoder ensembles, isolation
  forests, XGBoost build-chain classifiers, Prophet/ARIMA forecasting, and explainable Drebin/MaMaDroid/ReCon
  app classifiers with SHAP/LIME top-feature explanations). Source platforms: Android, iOS.'
type: technique
