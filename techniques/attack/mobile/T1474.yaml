    newly used restricted API, new embedded URL, new permission) in the alert via SHAP/LIME ([XAI for
    Malware Survey](https://arxiv.org/html/2409.13723v2)). Pair with the deterministic permission/dataflow
    rules above so detection never depends on the model alone. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable supply-chain tampering of the managed application; pivot
    to the specific app package/bundle identity and version, the MDM update record and its timing, the
