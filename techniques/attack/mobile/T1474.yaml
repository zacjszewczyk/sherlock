- question: '[Initial Access] Match post-update traffic to malicious infra: Can you determine, using the
    ''Match post-update traffic to malicious infra'' (Symbolic Logic) approach, whether a corporate mobile
    application has been compromised through its supply chain (T1474, Supply Chain Compromise)? This evidence
    centers on the condition that: In the 24 hours following an MDM-pushed update, the aggregate network
    traffic profile for the updated application version deviates significantly from its historical baseline.
    Specific, measurable deviations include: (1) a sustained increase in total data egress (sum of orig_bytes
    in Zeek conn.log) that exceeds the 99th percentile of the pre-update 30-day hourly baseline for more
    than two consecutive hours; (2) a sharp increase in the rate of new, unique destination IP addresses
    contacted per hour, exceeding the 99th percentile of the baseline; or (3) a statistically significant
    change (p < 0.01) in the distribution of connection protocols or destination ports as determined by
    a Chi-squared test.'
