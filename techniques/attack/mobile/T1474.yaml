      scope/NAI: MDM platform logs, network flow data from internet gateways, traffic mirrored from corporate
      Wi-Fi controllers, and logs from cloud access security brokers (CASBs) or secure web gateways (SWGs)
      that proxy mobile traffic.


      logic: For each app, train a time-series forecasting model (Prophet/ARIMA) on aggregate metrics
      (total data volume, DNS query rate, unique-IP count, failed-connection ratio). After an update,
      feed observed metrics; if values fall outside the 99% confidence interval for >=3 consecutive intervals,
      alert for potential low-and-slow exfiltration or periodic C2. EXPLAINABILITY: report which metric(s)
      and by what magnitude they breached the interval in the alert text.


      emit: prioritized alert with supporting fields (app package/bundle + version, MDM update record/time,
      affected devices, changed permissions/entitlements or APIs, new network destinations/fingerprints,
      build host/CI job/dependency diff, top contributing features) for analyst triage.'
- question: '[Initial Access] Alert on new permissions, entitlements, or sensitive dataflows after update:
    Can you determine, using the ''Alert on new permissions, entitlements, or sensitive dataflows after
    update'' (Symbolic Logic) approach, whether a corporate mobile application has been compromised through
    its supply chain (T1474, Supply Chain Compromise)? This evidence centers on the condition that: Within
    24-72 hours of an MDM-pushed update or new install, a known managed application''s on-device behavior
    drifts from its established baseline in ways that do not require external network lookups: (1) the
    app version declares or activates new permissions/entitlements (Android runtime permissions, iOS privacy
    entitlements) inconsistent with its prior baseline or business role; (2) it begins first-seen or expanded
    use of sensitive frameworks/OS APIs (content providers, account/accessibility services, dynamic code
    loading, crypto routines, background-task/network APIs); or (3) its static artifact profile (requested
    permissions, components, embedded URLs/IPs) or behavioral API call-transition profile diverges from
    the prior signed version. These are the strongest mobile-native supply-chain signals because the app
    retains a legitimate identity and arrives via the expected path.'
  context: 'Why this matters: Under the Initial Access tactic (TA0027), an adversary may manipulate a
    mobile product or its delivery/update mechanism before it reaches the device so that a legitimately-identified,
    expected-path app silently gains malicious capability (T1474, Supply Chain Compromise). Because the
    app keeps a trusted identity and arrives through the sanctioned MDM/build/distribution channel, the
    strongest signals are post-install/post-update behavioral drift rather than overt sideloading. This
    evidence focuses on the condition that: Within 24-72 hours of an MDM-pushed update or new install,
    a known managed application''s on-device behavior drifts from its established baseline in ways that
    do not require external network lookups: (1) the app version declares or activates new permissions/entitlements
    (Android runtime permissions, iOS privacy entitlements) inconsistent with its prior baseline or business
    role; (2) it begins first-seen or expanded use of sensitive frameworks/OS APIs (content providers,
    account/accessibility services, dynamic code loading, crypto routines, background-task/network APIs);
    or (3) its static artifact profile (requested permissions, components, embedded URLs/IPs) or behavioral
    API call-transition profile diverges from the prior signed version. These are the strongest mobile-native
    supply-chain signals because the app retains a legitimate identity and arrives via the expected path.
    The ''Alert on new permissions, entitlements, or sensitive dataflows after update'' approach (Symbolic
    Logic) works as follows: Diff the post-update permission/entitlement set (MDM Application Permission
    inventory) against the prior signed version''s baseline; alert on any newly granted high-risk capability
    (storage, sensors, SMS, accessibility, device-admin on Android; privacy/background entitlements on
    iOS) inconsistent with the app''s role. In CI, run taint analysis on the build ([FlowDroid, Arzt et
    al.](https://www.bodden.de/pubs/far+14flowdroid.pdf); [DroidBench](https://github.com/secure-software-engineering/FlowDroid))
    and block on any new sensitive source→sink dataflow versus the prior version. Static feature diffs
    (permissions, components, embedded URLs/IPs) follow the explainable feature-set approach of [Drebin,
    Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable supply-chain tampering
    of the managed application; pivot to the specific app package/bundle identity and version, the MDM
    update record and its timing, the affected device fleet, the changed permissions/entitlements or API
    behavior, the new network destinations and their fingerprints, and (for build-side evidence) the developer
    host, CI/CD job, and dependency manifest diff to scope the blast radius. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or dependency-level supply-chain tampering.'
