    C2 channel (medium severity). EXPLAINABILITY: emit the top-3 contributing features (e.g., new JA3S,
    bytes_out surge, rare port) in the alert via SHAP/LIME ([XAI for Malware Survey](https://arxiv.org/html/2409.13723v2)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable supply-chain
    tampering of the managed application; pivot to the specific app package/bundle identity and version,
