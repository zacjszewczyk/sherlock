    rarity below 1%; (3) Direct-to-IP connections (Zeek conn.log) where the destination is not part of
    the established application infrastructure allowlist. The ''Detect anomalous connections with autoencoder''
    approach (Machine Learning) works as follows: Train an autoencoder ensemble on per-app normal-connection
    feature vectors (destination port, protocol, JA3S hash, duration, bytes_in, bytes_out, TLS version,
