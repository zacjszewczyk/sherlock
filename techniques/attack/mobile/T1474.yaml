    rarity below 1%; (3) Direct-to-IP connections (Zeek conn.log) where the destination is not part of
    the established application infrastructure allowlist. The ''Alert on new domains, rare JA3, and failed
    connections after update'' approach (Statistical Method) works as follows: For each managed application,
