    the ''Classify the app build with an explainable model'' (Machine Learning) approach, whether a corporate
    mobile application has been compromised through its supply chain (T1474, Supply Chain Compromise)?
    This evidence centers on the condition that: Within 24-72 hours of an MDM-pushed update or new install,
