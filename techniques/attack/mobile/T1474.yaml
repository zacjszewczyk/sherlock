questions:
- question: '[Initial Access] Match post-update traffic to C2 IOCs: Can you determine, using the ''Match
    post-update traffic to C2 IOCs'' (Symbolic Logic) approach, whether a corporate mobile application
    has been compromised through its supply chain (T1474, Supply Chain Compromise)? This evidence centers
    on the condition that: A managed mobile application, within 24 hours of an MDM-pushed update, initiates
    network connections exhibiting one or more of the following verifiable characteristics: (1) DNS queries
    (Zeek dns.log) for domains not present in the application''s 90-day baseline or domains with a calculated
    entropy score above 3.5; (2) TLS connections (Zeek ssl.log) with a self-signed certificate, an expired
    certificate, a certificate issuer not on an approved list, or a JA3/JA3S hash with an organizational
    rarity below 1%; (3) Direct-to-IP connections (Zeek conn.log) where the destination is not part of
    the established application infrastructure allowlist.'
  context: 'Why this matters: Under the Initial Access tactic (TA0027), an adversary may manipulate a
    mobile product or its delivery/update mechanism before it reaches the device so that a legitimately-identified,
    expected-path app silently gains malicious capability (T1474, Supply Chain Compromise). Because the
    app keeps a trusted identity and arrives through the sanctioned MDM/build/distribution channel, the
    strongest signals are post-install/post-update behavioral drift rather than overt sideloading. This
    evidence focuses on the condition that: A managed mobile application, within 24 hours of an MDM-pushed
    update, initiates network connections exhibiting one or more of the following verifiable characteristics:
    (1) DNS queries (Zeek dns.log) for domains not present in the application''s 90-day baseline or domains
    with a calculated entropy score above 3.5; (2) TLS connections (Zeek ssl.log) with a self-signed certificate,
    an expired certificate, a certificate issuer not on an approved list, or a JA3/JA3S hash with an organizational
    rarity below 1%; (3) Direct-to-IP connections (Zeek conn.log) where the destination is not part of
    the established application infrastructure allowlist. The ''Match post-update traffic to C2 IOCs''
    approach (Symbolic Logic) works as follows: Correlate MDM logs identifying an application update with
    network logs from the affected devices for the subsequent 24-hour period. Compare destination domains
    (Zeek dns.log) and destination IPs (Zeek conn.log) against a mobile-specific threat-intelligence feed
    of known command-and-control (C2) servers, and match TLS client/server fingerprints in Zeek ssl.log
    against known-bad JA3/JA3S hashes ([JA3](https://github.com/salesforce/ja3)). Generate a high-severity
    alert on any match. Supply-chain payloads commonly contact install-time/runtime exfil endpoints catalogued
    in real attacks ([Backstabber''s Knife Collection, Ohm et al.](https://arxiv.org/pdf/2005.09535)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable supply-chain
    tampering of the managed application; pivot to the specific app package/bundle identity and version,
    the MDM update record and its timing, the affected device fleet, the changed permissions/entitlements
    or API behavior, the new network destinations and their fingerprints, and (for build-side evidence)
    the developer host, CI/CD job, and dependency manifest diff to scope the blast radius. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or dependency-level supply-chain
    tampering.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - MDM Logs
  - 'NAI: Network egress points, corporate Wi-Fi segments for mobile devices, VPN concentrators, and forward/recursive
    DNS resolvers.'
  range: Last 90 days (correlate event-centered windows around the MDM update/install, e.g. +/- 24-72
    hours for post-update behavioral and traffic drift, with a 30-day pre-update baseline)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match post-update traffic to C2 IOCs (Symbolic Logic)


      inputs: Zeek conn.log, Zeek dns.log, Zeek ssl.log, MDM Logs


      scope/NAI: Network egress points, corporate Wi-Fi segments for mobile devices, VPN concentrators,
      and forward/recursive DNS resolvers.


      logic: Correlate MDM logs identifying an application update with network logs from the affected
      devices for the subsequent 24-hour period. Compare destination domains (Zeek dns.log) and destination
      IPs (Zeek conn.log) against a mobile-specific threat-intelligence feed of known command-and-control
      (C2) servers, and match TLS client/server fingerprints in Zeek ssl.log against known-bad JA3/JA3S
      hashes ([JA3](https://github.com/salesforce/ja3)). Generate a high-severity alert on any match.
      Supply-chain payloads commonly contact install-time/runtime exfil endpoints catalogued in real attacks
      ([Backstabber''s Knife Collection, Ohm et al.](https://arxiv.org/pdf/2005.09535)).


      emit: prioritized alert with supporting fields (app package/bundle + version, MDM update record/time,
      affected devices, changed permissions/entitlements or APIs, new network destinations/fingerprints,
      build host/CI job/dependency diff, top contributing features) for analyst triage.'
- question: '[Initial Access] Alert on new domains, rare JA3, and failed connections after update: Can
