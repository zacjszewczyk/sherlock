- question: '[Initial Access] Alert on build tools spawning network utilities: Can you determine, using
    the ''Alert on build tools spawning network utilities'' (Symbolic Logic) approach, whether a corporate
    mobile application has been compromised through its supply chain (T1474, Supply Chain Compromise)?
    This evidence centers on the condition that: During a mobile app build cycle, a trusted build process
    (e.g., MSBuild.exe, gradle.bat, xcodebuild) on a developer workstation or CI/CD server spawns an anomalous
    child process (Windows Event ID 4688) that subsequently initiates a network connection (Windows Event
    ID 5156 and Zeek conn.log) to an external IP address not on a pre-approved allowlist for development
    resources. The child process may exhibit high-entropy command-line arguments (e.g., obfuscated PowerShell)
    or represent a statistically rare child for its parent process (e.g., MSBuild.exe spawning bitsadmin.exe).'
  context: 'Why this matters: Under the Initial Access tactic (TA0027), an adversary may manipulate a
    mobile product or its delivery/update mechanism before it reaches the device so that a legitimately-identified,
    expected-path app silently gains malicious capability (T1474, Supply Chain Compromise). Because the
    app keeps a trusted identity and arrives through the sanctioned MDM/build/distribution channel, the
    strongest signals are post-install/post-update behavioral drift rather than overt sideloading. This
    evidence focuses on the condition that: During a mobile app build cycle, a trusted build process (e.g.,
    MSBuild.exe, gradle.bat, xcodebuild) on a developer workstation or CI/CD server spawns an anomalous
    child process (Windows Event ID 4688) that subsequently initiates a network connection (Windows Event
    ID 5156 and Zeek conn.log) to an external IP address not on a pre-approved allowlist for development
    resources. The child process may exhibit high-entropy command-line arguments (e.g., obfuscated PowerShell)
    or represent a statistically rare child for its parent process (e.g., MSBuild.exe spawning bitsadmin.exe).
    The ''Alert on build tools spawning network utilities'' approach (Symbolic Logic) works as follows:
    On build systems, monitor process-creation events (Windows Event ID 4688) where a build tool (xcodebuild,
    gradle, MSBuild.exe) spawns a networking utility (curl.exe, powershell.exe, bitsadmin.exe). Correlate
    the PID with network-connection events (Event ID 5156 or Zeek conn.log). If the destination is on
    a C2 threat-intel list or not on the corporate development allowlist, generate a critical alert and
    quarantine the host. Build-stage injection and unexpected install-time network egress are canonical
    supply-chain vectors ([SoK Taxonomy of OSS Supply-Chain Attacks, Ladisa et al.](https://arxiv.org/pdf/2204.04008);
    [Backstabber''s Knife Collection, Ohm et al.](https://arxiv.org/pdf/2005.09535)). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable supply-chain tampering
    of the managed application; pivot to the specific app package/bundle identity and version, the MDM
    update record and its timing, the affected device fleet, the changed permissions/entitlements or API
    behavior, the new network destinations and their fingerprints, and (for build-side evidence) the developer
    host, CI/CD job, and dependency manifest diff to scope the blast radius. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or dependency-level supply-chain tampering.'
