    signal. A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    supply-chain tampering of the managed application; pivot to the specific app package/bundle identity
    and version, the MDM update record and its timing, the affected device fleet, the changed permissions/entitlements
