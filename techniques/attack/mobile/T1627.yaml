questions:
- question: Does any managed or vetted mobile application's manifest declare a high-risk permission combination
    AND does its decompiled code contain hard-coded target-specific constants (corporate domains, Wi-Fi
    SSIDs, a specific MCC/MNC operator code, or a target device locale) that could serve as an execution
    guardrail?
  context: 'Under Defense Evasion, an adversary embeds a target-specific constant so the payload stays
    dormant on every device except the intended victim, defeating broad sandbox analysis. The analyst
    should parse manifests for risky permission sets (e.g., ACCESS_FINE_LOCATION + READ_PHONE_STATE +
    QUERY_ALL_PACKAGES) and scan decompiled bytecode for hard-coded comparison constants (corporate domains,
    SSIDs, target MCC/MNC, locale strings). This is a deterministic symbolic-logic match: alert on any
    hit and surface the matched permission set and the literal constant in the alert so a triager can
    immediately judge intent. A positive result strongly suggests the app is built to fire only against
    a specific environment; a clean result lowers suspicion but does not eliminate it, since constants
    may be obfuscated or computed at runtime.'
  answer_sources: &id001
  - Mobile application manifest files
  - MTD permission analysis logs
  - Static analysis reports from decompiled application source code
  - 'NAI: Corporate-managed mobile devices, Mobile Device Management (MDM) platform, internal application
    vetting/sandbox environments, and public/private mobile application marketplaces.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      for app in managed_apps:
        perms = parse_manifest(app)
        if perms superset_of {ACCESS_FINE_LOCATION, READ_PHONE_STATE, QUERY_ALL_PACKAGES}
           AND decompiled(app) contains_any {corp_domains, target_ssids, target_mcc_mnc, target_locales}:
          alert("guardrail constant in app", app, matched_perms=perms, matched_constant)
- question: Can a lifecycle-aware static taint analysis confirm that an environment or identity source
    (getDeviceId, getLastKnownLocation, getSimOperator, getNetworkOperatorName, WifiInfo.getSSID) flows
    into a conditional branch that guards a sensitive sink (network, SMS, contacts) and is NOT control-dependent
    on user input?
  context: The canonical execution-guardrail (logic-bomb) pattern is a source-to-sink data flow in which
    a target-specific environment value gates a sensitive operation without any user interaction driving
    the decision. Under Defense Evasion, this is exactly how an adversary ensures the malicious behavior
    never runs during vetting yet fires on the victim device. The analyst runs FlowDroid-style, lifecycle-aware
    taint analysis to establish the source -> environment-check -> sink path and verifies the guarding
    predicate is not control-dependent on user input (which would indicate a benign feature). Report the
    full source->check->sink path in the alert. A confirmed path is high-fidelity evidence of a guardrail;
    absence of such a path argues the sensitive API is reachable through normal user-driven flows.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      sources = {getDeviceId, getLastKnownLocation, getSimOperator, getNetworkOperatorName, WifiInfo.getSSID}
      sinks   = {network_send, sendSMS, read_contacts}
      for path in flowdroid_taint(app, sources, sinks):
        if path passes_through(conditional_branch) AND NOT control_dependent_on(user_input):
          alert("trigger->sink taint", app, path.source, path.check, path.sink)
- question: Do any 'suspicious checks' exist in the application where a recovered path predicate compares
    an environment value (time, location, SMS content, system property) against a hard-coded constant
    and then gates a sensitive operation?
  context: Trigger analysis (symbolic value analysis + path-predicate recovery + predicate minimization,
    as in TriggerScope) isolates the precise condition under which dormant code activates. Under Defense
    Evasion, surfacing these predicates exposes the adversary's target selector even before the app is
    run. The analyst recovers and minimizes path predicates, then flags those that compare an environmental
    value to a hard-coded constant immediately preceding a sensitive operation. Report the recovered predicate
    (e.g., locale == 'fa_IR' or operator == '<MCC/MNC>') in the alert. A recovered suspicious predicate
    pinpoints the guardrail and often the intended victim region/org; no such predicate suggests the branch
    is benign or input-driven.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      for pred in recover_path_predicates(app):  # symbolic value analysis + minimization
        if pred.compares(env_value in {time, location, sms_content, system_property}, hardcoded_constant)
           AND pred guards sensitive_op:
          alert("suspicious trigger predicate", app, pred.expression, pred.guarded_op)
- question: Does the application declare a statistically rare permission set for its app-store category
    (Jaccard distance below the 10th percentile of your vetted corpus) or exhibit permission entropy in
    the top 95th percentile across managed devices?
  context: 'Guardrail-capable spyware often over-requests environment/identity permissions relative to
    peers in its category, making rarity a useful statistical signal under Defense Evasion. The analyst
    computes Jaccard distance from each app''s permission set to the category-median set, derives the
    percentile cutoff from a first-party vetted-app corpus per store category, and flags apps below the
    10th percentile; separately, flag apps whose permission entropy lands in the top 95th percentile across
    the managed fleet. A flagged app warrants the deeper static taint and trigger analyses above. This
    is a prioritization filter, not a verdict: rare permissions raise the priority of an app for guardrail
    hunting but are not by themselves malicious.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for app in managed_apps:
        jd = jaccard(app.perms, category_median_perms[app.category])
        if jd <= percentile(category_corpus_jaccard[app.category], 10):
          flag(app, reason="rare permission set", jaccard=jd)
        if permission_entropy(app) >= percentile(fleet_entropy, 95):
          flag(app, reason="high permission entropy")
- question: When trigger-specific features are extracted at each conditional entry-point (use of time/location/SMS
    APIs, constant comparisons, background execution, guarded sensitive operations), does any trigger
    fall outside the benign distribution learned by an unsupervised One-Class SVM trained on benign apps?
  context: Difuzer-style detection scores each conditional entry-point for the hallmarks of a hidden sensitive
    operation and uses a One-Class SVM trained only on benign apps to flag outliers (reported 99.02% precision).
    Under Defense Evasion, a guardrail's gated sensitive op is exactly such an anomaly. The analyst extracts
    per-trigger features and scores them, alerting when a trigger is outside the benign distribution.
    Emitting the contributing features (e.g., location API + constant compare + guarded SMS send) makes
    the alert explainable. An outlier trigger is a strong candidate for a logic bomb; in-distribution
    triggers reflect ordinary conditional code.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      model = OneClassSVM.fit(features(benign_app_triggers))
      for trig in conditional_entry_points(app):
        f = trigger_features(trig)  # time/location/SMS APIs, constant cmp, bg exec, guarded sink
        if model.predict(f) == outlier:
          alert("hidden sensitive operation", app, trig, top_features(f))
- question: Does an explainable linear classifier trained on permissions, exported services/receivers,
    intent filters, network endpoints, and guardrail-related API calls (TelephonyManager, LocationManager,
    WifiManager) assign the application a malicious probability greater than 0.90?
  context: A Drebin-style explainable linear model captures the joint signature of guardrail-capable apps
    while remaining auditable. Under Defense Evasion, such apps cluster on features like reading getSimOperator,
    holding location permissions, exporting receivers for environment events, and contacting specific
    endpoints. The analyst classifies each app and quarantines those above 0.90 malicious probability,
    emitting the top-3 contributing features (e.g., reads getSimOperator, sends SMS, contacts <domain>)
    so the decision is reviewable. A high-probability classification with damning top features justifies
    quarantine and deeper analysis; a low score deprioritizes the app. Re-train and recalibrate the threshold
    against your own labeled corpus to control false positives.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      p = drebin_linear_model.predict_proba(features(app))  # perms, exported comps, intents, endpoints, guardrail APIs
      if p > 0.90:
        quarantine(app)
        alert("guardrail-capable app", app, prob=p, top3=explain(app)[:3])
- question: When abstracted (package/family) API-call sequences are modeled as a Markov chain over the
    app's call graph, does the learned classifier flag environment-check -> sensitive-API transition behavior
    consistent with execution guardrails?
  context: MaMaDroid builds a Markov chain over abstracted API-call sequences and classifies behavior
    (RF/KNN/SVM), capturing the transition from an environment check directly into a sensitive API that
    characterizes a guardrail under Defense Evasion. The analyst constructs the chain from the call graph,
    classifies the app, and must validate with time-aware splits (AUT(F1), realistic benign:malware ratios)
    and monitor for concept drift before trusting precision, per TESSERACT. A positive classification
    driven by environment-check->sensitive-API transitions corroborates the static and statistical findings;
    because mobile malware evolves quickly, treat the score as decaying over time and recompute against
    current data rather than relying on stale precision estimates.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      chain = markov_chain(abstract_api_sequences(call_graph(app)))  # package/family abstraction
      label = classifier(chain)  # RF/KNN/SVM, validated with time-aware split + AUT(F1)
      if label == malicious AND high_transition_prob(env_check -> sensitive_api):
        alert("guardrail API-sequence", app, transitions=top_transitions(chain))
- question: Can the sandbox statically extract the path constraints required to reach suspicious API calls,
    solve them, and inject the precise inputs in the correct order at the device-framework interface so
    that the guardrailed behavior executes under instrumentation - and which environment values (location/SMS/time/operator)
    was the sample waiting for?
  context: IntelliDroid-style targeted input generation defeats guardrails by computing and supplying
    exactly the inputs needed to reach the gated code, forcing dormant behavior to run where it can be
    observed. Under Defense Evasion, this directly counters the adversary's intent to stay dormant during
    analysis. The analyst extracts the path constraints leading to suspicious sinks, solves them, and
    injects the solved values in the required order at the device-framework interface, then logs which
    environment values the sample awaited (e.g., a particular GPS region, SIM operator, or SMS trigger).
    Successfully forcing activation both proves the guardrail exists and reveals the intended target condition;
    failure to force it may mean the constraints are unsatisfiable in-sandbox or obfuscated, warranting
    manual review.
  answer_sources: &id002
  - Zeek conn.log
  - Zeek dns.log
  - Dynamic analysis sandbox logs
  - 'NAI: Network egress points for corporate mobile devices (via VPN or proxy), guest Wi-Fi network segments,
    and dedicated mobile security analysis sandboxes.'
  range: Last 90 days; event-centered on each constraint-injection in the sandbox run
  queries:
  - technology: Sandbox/pseudocode
    query: |-
      constraints = extract_path_constraints(app, target=suspicious_api_calls)
      inputs = solver.solve(constraints)
      inject_ordered(device_framework_interface, inputs)
      record(awaited_env_values = inputs.filter(location|sms|time|operator))
      observe_and_log(behavior_after_injection)
- question: After each environmental trigger is applied in the sandbox, does network activity to low-reputation
    IPs/domains (on threat-intelligence lists) follow within 60 seconds, and can that destination be correlated
    with the specific trigger that was applied?
  context: The defining guardrail signal is a dormant-until-target-match transition; under Defense Evasion,
    the clearest observable is a sudden network callout that begins only after the correct environment
    is presented. The analyst applies each trigger (GPS to a target city, SSID to a corporate name, SIM
    MCC/MNC to a target country, language change) one at a time and alerts when egress to a low-reputation
    or threat-intel-listed destination occurs within 60 seconds, correlating the exact trigger with the
    destination in the alert. A trigger-correlated callout to a bad destination is high-fidelity confirmation
    of a guardrail and exposes the C2; no callout after exhaustive triggering suggests either the right
    trigger was not applied or the activation depends on additional conditions.
  answer_sources: *id002
  range: Last 90 days; 60-second correlation window after each applied trigger
  queries:
  - technology: Zeek/pseudocode
    query: |-
      for trigger in applied_triggers:
        win = conn.log + dns.log where ts in [trigger.ts, trigger.ts+60s]
        if win.dest in threat_intel_low_reputation:
          alert("trigger-activated callout", trigger.type, win.dest, delay=win.ts-trigger.ts)
- question: After an environmental trigger is applied, does any post-trigger window's outbound bytes,
    sensitive-API call rate, or connection success/fail count exceed the app's own pre-trigger baseline
    by more than mu + 3 sigma, or show a significant jump in destination-port or DNS-domain entropy?
  context: This statistical Volume/Frequency/State test quantifies the abrupt behavior change that betrays
    a guardrail under Defense Evasion. The analyst builds a 5-minute pre-trigger baseline of outbound
    bytes per 10-second window (Volume), sensitive-API calls per minute (Frequency), and connection success/fail
    counts (State), derives sigma per-app from that quiescent baseline, and alerts when any post-trigger
    window exceeds mu + 3 sigma; a significant rise in destination-port or DNS-domain entropy is an additional
    flag. Because the baseline is the app's own quiescent behavior, a breach is strong evidence the trigger
    awakened dormant functionality. A post-trigger window within baseline indicates the trigger did not
    activate hidden behavior.
  answer_sources: *id002
  range: Last 90 days; 5-minute pre-trigger baseline vs. post-trigger windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = window_stats(pre_trigger, 5m, bin=10s)  # bytes_out, sensitive_api/min, conn_ok/fail
      mu, sigma = mean(base), std(base)  # per-app, from quiescent baseline
      for w in post_trigger_windows:
        if w.bytes_out > mu+3*sigma OR w.api_rate > mu+3*sigma OR w.conn_state > mu+3*sigma
           OR entropy(dst_port) up OR entropy(dns_domain) up:
          alert("post-trigger behavior spike", app, w)
- question: Is there a per-app burst of failed/NXDOMAIN DNS lookups, blocked or reset egress connections,
    and permission-denied API attempts that precedes an abrupt switch to successful activity - the signature
    of an app probing for and then matching its target condition?
  context: 'Before a guardrailed app finds its target environment it often probes repeatedly and fails,
    then succeeds the moment the condition is met; under Defense Evasion this failure-then-success arc
    is itself an indicator. The analyst tracks per-app rates of failed/NXDOMAIN DNS lookups, blocked/reset
    egress connections, and permission-denied API attempts, and flags a burst of failures immediately
    followed by abrupt success. The TESSERACT caution applies: evaluate over realistic time windows so
    the pattern is not an artifact of sampling. A clear probe-then-activate arc strongly indicates guardrail
    behavior and the moment of target match; steady success or steady failure without the transition does
    not.'
  answer_sources: *id002
  range: Last 90 days; align failure burst window immediately preceding first success
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for app in apps:
        fails = rate(nxdomain_dns + blocked_or_reset_egress + permission_denied_api)
        if burst(fails) immediately_followed_by abrupt_success(network_or_api):
          alert("guardrail probing then activation", app, fail_burst=fails, activation_ts)
- question: When an LSTM autoencoder trained on the app's baseline sandbox network/behavior features evaluates
    the post-trigger period, does reconstruction error exceed the 99th percentile - and which features
    (egress bytes, new destination domain, contacts-API rate) drive that error?
  context: A sequence-aware LSTM autoencoder learns normal baseline behavior and surfaces the trigger-induced
    shift as high reconstruction error, capturing temporal patterns that simple thresholds miss. Under
    Defense Evasion, the post-trigger awakening of a dormant payload manifests as a reconstruction anomaly.
    The analyst trains on baseline features, alerts when post-trigger error exceeds the 99th percentile,
    and emits the top-3 driving features (e.g., egress bytes, a new destination domain, contacts-API rate)
    for explainability. Per TESSERACT, use time-aware validation and drift monitoring so evasive samples
    do not silently degrade the model. A high-error, well-explained post-trigger window corroborates guardrail
    activation; low error indicates behavior consistent with the learned baseline.
  answer_sources: *id002
  range: Last 90 days; baseline vs. post-trigger sequences in the sandbox run
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      ae = LSTM_autoencoder.fit(baseline_behavior_sequences)
      err = ae.reconstruction_error(post_trigger_sequences)
      if err > percentile(baseline_err, 99):
        alert("trigger-induced behavior shift", app, err, top3=feature_attribution(err)[:3])
      # validate with time-aware split + drift monitoring (TESSERACT)
