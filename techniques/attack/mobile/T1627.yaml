name: 'T1627: Execution Guardrails'
id: 41586f7d-762f-48b7-9772-5356a5acacc6
description: 'Investigate whether an adversary is using execution guardrails on mobile (Android/iOS) applications
  to constrain payload execution to an intended target and evade analysis. Unlike generic sandbox or system
  checks, guardrails compare an environment- or target-specific value (device locale, network operator
  MCC/MNC, GPS location, Wi-Fi SSID, SIM/operator, or device state) against a hard-coded expected value
  and only continue execution when there is a match, keeping the payload dormant everywhere else. This
  playbook helps an analyst hunt for that dormant-until-target-match pattern from two complementary vantage
  points. First, statically: parse application manifests for statistically rare, high-risk permission
  combinations and decompile code to recover trigger predicates and confirm taint flow from an environment
  or identity source, through a guarding conditional, into a sensitive sink (network send, SMS, contacts)
  that is not control-dependent on user input. Second, dynamically: in an instrumented sandbox, force
  the guarded branches by solving and injecting the precise path-constraint inputs, then watch for the
  abrupt transition from minimal baseline activity to a spike in egress traffic to low-reputation destinations
  plus newly observed sensitive API calls once the target condition is satisfied, including the tell-tale
  burst of failed probes (NXDOMAIN, blocked egress, permission-denied API attempts) that precede activation.
  It layers deterministic symbolic-logic rules, statistical volume/frequency/state and rare-permission
  baselines, and explainable machine-learning classifiers and sequence/anomaly models over mobile manifest,
  MTD and static-analysis, MDM/EDR, and network (Zeek conn/dns, sandbox) telemetry.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
