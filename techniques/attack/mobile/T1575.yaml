  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for c in zeek_conn join zeek_ssl, zeek_dns on uid:\n  if (c.dest_ip in ti.c2_ips or c.query\
      \ in ti.c2_domains or c.ja3 in ti.c2_ja3\n      or c.ja4s in ti.c2_ja4s):\n    edr = correlate(edr_network,\
      \ device_ip=c.src_ip, ts=c.ts)\n    alert(HIGH, device=c.src_ip, dest=c.dest_ip, fp=c.ja3,\n   \
      \       app=edr.pkg, process=edr.process, reason='C2 blocklist match')"
- question: For each 4-tuple flow from a native-code app over 24 hours, is the standard deviation of inter-connection
    time deltas below 2 seconds and payload-size deviation below 100 bytes (or a strong dominant FFT period),
    with a destination not on a commercial-service allowlist — indicating C2 beaconing?
  context: C2 beacons are periodic and uniform, which betrays them even when payloads are encrypted. This
    statistical method computes, for each 4-tuple (src IP, dest IP, dest port, protocol) in Zeek conn.log
    over a 24-hour window, the standard deviation of inter-connection time deltas and of orig_bytes, and
    confirms periodicity with the FFT/power-spectral-density and autocorrelation pipeline of BAYWATCH
