name: 'T1575: Native API'
id: e489748b-6f04-4171-b08f-17d40e75b632
description: 'Investigate adversary use of Android''s Native Development Kit (NDK) and the Java Native
  Interface (JNI) to hide and execute malicious code on enrolled mobile devices. Because native C/C++
  code compiled to machine code executes at a lower level than standard Android SDK calls and is far harder
  to analyze than managed (Java/Kotlin) behavior, adversaries lean on it for both Defense Evasion and
  Execution. This playbook helps an analyst hunt for: packed or obfuscated native libraries (.so) identified
  via high Shannon entropy, sparse JNI exports, and threat-intel hash matches; native libraries loaded
  from non-standard, world-writable directories shortly after a low-reputation download; Java Reflection
  chained to dynamically loaded native code with obfuscated class/method names; native libraries that
  import command-execution C functions (system, execve, popen) or embed shell-command strings (/system/bin/sh,
  su, pm install, am start, reboot, setprop); command-and-control beaconing from native-code apps detected
  through low-jitter periodic flows, TLS fingerprints, and failure-mode signals; and anomalous child-process
  creation (sh, su, pm, Runtime.exec) inconsistent with an app''s behavioral baseline. Detection methods
  span symbolic logic, statistical baselining/outlier scoring, and machine learning so an analyst can
  determine whether an adversary is using native code to obscure activity (Defense Evasion) or to run
  malicious commands and binaries (Execution) on the mobile fleet.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
- tactic_id: TA0041
  tactic_name: Execution
