      \  if p > 0.90:\n    alert(app, p, top3=model.explain(x)[:3])\n    escalate_to_dynamic_sandbox(app)"
- question: Did any mobile device connect to a destination IP, domain, or JA3/JA4S TLS fingerprint that
    appears on a command-and-control blocklist, and can the connection be tied back to a native-code application
    via Mobile EDR?
  context: Native-code apps frequently establish command-and-control channels to receive instructions
    or exfiltrate data — an Execution/C2 behavior. This symbolic-logic check ingests Zeek conn.log, ssl.log,
    and dns.log, enriches with threat intelligence, and raises a high-severity alert for any connection
    from a mobile device IP to a destination IP, domain, or JA3/JA4S hash on a C2 blocklist. It then uses
    Mobile EDR logs to correlate the device IP and timestamp to the responsible process and application,
    confirming whether a native-code app is the source. A positive result is a strong compromise indicator;
    tying it to the specific app/process gives the analyst an immediate containment and remediation target.
  answer_sources: &id005
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - MDM.AppInventoryLogs
  - MobileEDR.NetworkEvents
