questions:
- question: Does any native library (.so) bundled in an enrolled application match the hash of a known
    malicious or packed library in threat intelligence, or match a native control-flow obfuscation pattern
    (junk-code insertion, control-flow flattening) that betrays a repacked variant?
  context: In a Defense Evasion context, adversaries ship malicious logic inside native libraries because
    machine code is much harder to analyze than managed Java. This symbolic-logic check pulls every .so
    hash from each application's static-analysis report (keyed off the MDM inventory) and matches it against
    a threat-intel feed of known-bad or packed libraries; a hit yields a critical alert with device, user,
    and application details. Because attackers repack to change hashes, pair hash matching with native
    control-flow obfuscation pattern matching (DroidNative-style detection of junk insertion and control-flow
    flattening) on the disassembled .so so you also catch variants whose hashes differ from intel. A positive
    result is a high-confidence indicator of evasive native code; a negative result does not clear the
    app since novel/unknown libraries will not be in the feed.
  answer_sources: &id001
  - APK.StaticAnalysisReports
  - MDM.AppInventoryLogs
  - StaticAnalysis.ToolOutput
  - 'NAI: Corporate application vetting system (static analysis sandbox), MDM server application inventory
    database, and file systems of enrolled mobile devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for app in mdm_inventory:\n  report = static_analysis_report(app)\n  for lib in report.native_libs:\
      \   // .so files\n    if lib.sha256 in ti_feed['malicious_or_packed_libs']:\n      alert(CRITICAL,\
      \ device=app.device, user=app.user, app=app.pkg, lib=lib.name, reason='TI hash match')\n    if cfg_obfuscation(lib.disasm)\
      \ in ['junk_insertion','control_flow_flattening']:\n      alert(HIGH, app=app.pkg, lib=lib.name,\
      \ reason='DroidNative obfuscation pattern (repack)')"
- question: Which native libraries have an executable-section Shannon entropy in the top 1% of the fleet
    (a hard floor near 7.5) and/or export three or fewer JNI functions where JNI_OnLoad is one of them,
    indicating packing/encryption and hidden dynamically registered functions?
  context: Packed or encrypted native code raises the Shannon entropy of its executable section well above
    the ~5.0-6.5 typical of normal native code, and adversaries hide their real functions by dynamically
    registering them in JNI_OnLoad so only a tiny export table is visible to static analysis. This statistical
    method parses each library's static report to extract executable-section entropy and the JNI export
    list, computes the 99th entropy percentile across all scanned libraries (expect a floor near 7.5),
    and alerts when a library exceeds it. Separately it alerts when a library exports <=3 functions and
    JNI_OnLoad is one of them. When BOTH conditions hold for the same library, raise a high-confidence
    alert. Deriving the percentile per-fleet keeps the threshold aligned with your actual app population,
    reducing false positives from legitimately compressed libraries while still surfacing evasive packing.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "libs = parse_static_reports().native_libs\nentropy_p99 = max(percentile([l.exec_entropy for\
      \ l in libs], 99), 7.5)\nfor l in libs:\n  high_entropy = l.exec_entropy > entropy_p99\n  sparse_jni\
      \ = (count(l.jni_exports) <= 3) and ('JNI_OnLoad' in l.jni_exports)\n  if high_entropy and sparse_jni:\
      \ alert(HIGH, l, reason='packed + hidden JNI registration')\n  elif high_entropy: alert(MED, l,\
      \ entropy=l.exec_entropy)\n  elif sparse_jni: alert(MED, l, exports=l.jni_exports)"
- question: When scored by a supervised classifier on static features (file size, executable-section size,
    Shannon entropy, imported/exported function counts, presence of JNI_OnLoad, dynamic-symbol-resolution
    strings like dlsym), does any new or updated native library exceed a predicted-malicious probability
    of 0.85 and warrant manual reverse engineering?
  context: A single static feature rarely proves malice, but the combination is discriminative. This ML
    method scores every new or updated .so with a gradient-boosting classifier using file size, exec-section
    size, entropy, import/export counts, presence of JNI_OnLoad, and counts of dynamic-resolution strings
    (e.g., dlsym). Following Drebin's explainable linear-feature design, each alert MUST list the top-3
    contributing features (e.g., entropy=7.8, exports=2, dlsym_strings=14) alongside the score so an analyst
    can judge the verdict quickly. Any library with predicted malicious probability >0.85 is escalated
    for manual reverse engineering. This supports Defense Evasion hunting by catching obfuscated native
    payloads that evade simple keyword/hash rules while keeping the decision transparent.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = load('native_lib_gbdt')\nfor lib in new_or_updated_native_libs():\n  x = features(file_size,\
      \ exec_size, shannon_entropy, n_imports, n_exports,\n               has_JNI_OnLoad, dlsym_string_count)\n\
      \  p = model.predict_proba(x)\n  if p > 0.85:\n    alert(p, lib, top3=model.explain(x)[:3])  # e.g.\
      \ entropy=7.8, exports=2, dlsym=14\n    escalate_to_reverse_engineering(lib)"
- question: Does any application show an anomalous spike in native-load failures (dlopen/System.loadLibrary
    failures, UnsatisfiedLinkError, aborted JNI registrations) — exceeding 3 standard deviations above
    its 30-day baseline, or failing on most devices yet succeeding on a small subset?
  context: Failure rates are themselves a signal. Anti-analysis and targeted native code often loads successfully
    only on specific device/OS/CPU profiles and fails elsewhere, producing telltale dlopen/System.loadLibrary
    failures, UnsatisfiedLinkError, and aborted JNI registrations. This statistical method profiles those
    failures per app from static/dynamic reports and Logcat. A library that repeatedly fails on most devices
    but succeeds on a small subset, or whose load errors spike after an update, suggests environment-gated
    or anti-analysis native code consistent with unsafe dynamic-loading patterns. Alert when an app's
    native-load failure ratio exceeds 3 standard deviations above its 30-day baseline. In Defense Evasion
    terms, selective loading is how adversaries dodge sandboxes while still executing on real targets.
  answer_sources: *id001
  range: Last 90 days, with a 30-day per-app baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for app in apps:\n  fails = count(logcat|reports where event in ['dlopen_fail','System.loadLibrary_fail',\n\
      \                'UnsatisfiedLinkError','jni_register_abort'] and pkg==app)\n  ratio = fails / max(loads(app),1)\n\
      \  base = mean_30d(app.fail_ratio); sd = stddev_30d(app.fail_ratio)\n  if ratio > base + 3*sd: alert(app,\
      \ ratio, reason='native-load failure spike')\n  if devices_succeeded(app) < 0.1*devices_attempted(app):\n\
      \    alert(app, reason='loads only on small device subset (targeted/anti-analysis)')"
- question: Did a device resolve a threat-intel blocklisted domain, download a .so/.dex/.jar file, and
    then within 120 seconds load that code via System.load/System.loadLibrary from a path outside /data/app/
    (e.g., /sdcard or /data/data/<pkg>/files)?
  context: 'Loading code that was not present at install, from world-writable storage, is the canonical
    unsafe dynamic-loading pattern and a strong Defense Evasion indicator: the payload never appears in
    the vetted APK. This symbolic-logic correlation joins Zeek dns.log, Zeek files.log, and Android Logcat
    by device IP within a 120-second window and fires a high-severity alert when a DNS query to a blocklisted
    domain is followed by a download ending in .so/.dex/.jar and a subsequent Logcat System.load/System.loadLibrary
    from a non-standard path. A positive result strongly suggests staged native code fetched from attacker
    infrastructure; correlate to the responsible app/process for triage. Tune by allowlisting legitimate
    update mechanisms that load from app-private dirs.'
  answer_sources: &id002
  - Android.Logcat
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - MobileEDR.FileEvents
  - 'NAI: Enterprise wireless and VPN network traffic inspection points, DNS resolvers, and real-time
    log streams from enrolled mobile endpoints.'
  range: Last 90 days, event-centered with a 120-second correlation window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join dns=zeek_dns, files=zeek_files, lc=android_logcat on device_ip within 120s:\n  cond1\
      \ = dns.query in ti_blocklist\n  cond2 = files.filename ~ /\\.(so|dex|jar)$/ and files.src_domain.reputation\
      \ low\n  cond3 = lc.msg ~ /System\\.(load|loadLibrary)/ and lc.path not startswith '/data/app/'\n\
      \          and lc.path matches ('/sdcard','/data/data/.*/files')\n  if cond1 and cond2 and cond3:\n\
      \    alert(HIGH, device_ip, app=lc.pkg, domain=dns.query, file=files.filename, path=lc.path)"
- question: Has an application's rate of loading native libraries from non-standard, world-writable directories
    exceeded 3 standard deviations above its 30-day moving average, or is it a first-of-its-kind load
    from such a directory for that app?
  context: Most legitimate apps only ever load native libraries from /data/app/ (their installed APK).
    Loading from world-writable directories like /sdcard or /data/data/<pkg>/files is a recognized dangerous
    pattern. This statistical method builds a per-package baseline of library load paths from Logcat and
    Mobile EDR, computes the daily frequency of loads from non-standard directories, and alerts when that
    rate exceeds 3 standard deviations above the app's 30-day moving average OR is a first-of-its-kind
    event for that app. First-time off-path loading is especially significant because it often marks the
    moment a benign app begins executing fetched native code. This supports Defense Evasion detection
    by flagging the shift from vetted to unvetted code paths.
  answer_sources: *id002
  range: Last 90 days, with a 30-day per-app moving average
  queries:
  - technology: SIEM/Stats pseudocode
    query: "nonstd = ['/sdcard','/data/data/.*/files','/data/local/tmp']\nfor app in apps:\n  rate = count_today(loads\
      \ where pkg==app and path matches nonstd)\n  base = mean_30d(app.nonstd_load_rate); sd = stddev_30d(app.nonstd_load_rate)\n\
      \  if rate > base + 3*sd: alert(app, rate, reason='off-path load rate spike')\n  if base == 0 and\
      \ rate > 0: alert(app, reason='first-ever off-path native load')"
- question: Is any single application generating bursts of NXDOMAIN responses, 404/blocked downloads,
    or SELinux-denied/failed off-path loads that exceed the 99th fleet percentile over a rolling 24-hour
    window, indicating resilient staging before a successful low-reputation .so download?
  context: 'Adversaries build resilience into their staging: domain rotation, dead drops, and retries
    produce a tell-tale burst of failures before a successful fetch. This statistical method profiles
    failure-mode rates per device/app as a separate signal — NXDOMAIN responses in Zeek dns.log, 404/blocked
    downloads in Zeek files.log, and SELinux-denied or failed off-path loads. A burst of failed resolutions/downloads
    from one app followed by an eventual successful low-reputation .so download is a hallmark of resilient
    native-code staging. Alert when per-app NXDOMAIN or blocked-fetch counts exceed the 99th percentile
    of the fleet over a rolling 24-hour window. This Defense Evasion signal can fire even when the eventual
    successful channel is otherwise stealthy.'
  answer_sources: *id002
  range: Last 90 days, with a rolling 24-hour window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "window = 24h\nfor app in apps:\n  nx = count(zeek_dns where pkg==app and rcode=='NXDOMAIN',\
      \ window)\n  blk = count(zeek_files where pkg==app and status in [404,'blocked'], window)\n  denied\
      \ = count(selinux_denied_or_failed_load where pkg==app, window)\n  p99 = percentile(fleet_failure_counts,\
      \ 99)\n  if nx > p99 or blk > p99 or denied > p99:\n    alert(app, nx=nx, blk=blk, denied=denied,\
      \ reason='resilient staging failures')"
- question: Does a device's observed event chain (e.g., DNS query to a new TLD -> file download of a .so
    -> library load from /data/data/.../files) fall outside a sequence model's top-g predicted next events,
    indicating an anomalous malicious load sequence?
  context: Individual events can look benign; the ORDER and combination is what betrays staged native
    execution. This ML method trains a DeepLog-style LSTM next-event predictor (or an HMM/RNN) on normal
    per-device event chains and flags any sequence whose observed transition falls outside the model's
    top-g predictions. A canonical malicious chain is [DNS to new/low-rep TLD -> file download (.so) ->
    library load from world-writable dir]. The alert surfaces the offending event and its predecessors
    for explainable triage. This directly supports Defense Evasion hunting because adversaries can vary
    individual indicators but find it harder to disguise the overall fetch-then-load sequence; a flagged
    sequence with low benign probability is a strong lead.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = load('deeplog_lstm_per_device')\nfor dev in devices:\n  seq = event_chain(dev)   #\
      \ e.g. [dns_new_tld, download_so, lib_load_offpath]\n  for i, ev in enumerate(seq):\n    pred =\
      \ model.predict_next(seq[:i])\n    if ev not in pred.top_g:\n      alert(dev, event=ev, predecessors=seq[:i],\
      \ reason='anomalous load sequence')"
- question: Did an application call java.lang.reflect.Method.invoke immediately after java.lang.System.loadLibrary
    within the same thread inside a 100 ms window, where the invoked method name does not exist as a plaintext
    string in the original APK?
  context: 'Adversaries combine dynamic native loading with Java Reflection to hide their real entry points:
    the class/method names are deobfuscated at runtime and never appear as plaintext in the shipped APK.
    This symbolic-logic correlation fires when Mobile EDR shows Method.invoke immediately preceded by
    System.loadLibrary in the same thread within 100 ms, and escalates priority when the method-name argument
    to invoke is absent as a plaintext string in the original APK — the signature of dynamic resolution/deobfuscation.
    A positive result strongly indicates reflection-based hiding of a dynamically loaded native entry
    point (Defense Evasion). Tune against legitimate frameworks that use reflection plus native code,
    using the plaintext-string check to keep precision high.'
  answer_sources: &id003
  - MobileEDR.APIMonitoringLogs
  - Android.Logcat
  - DynamicAnalysis.SandboxTraces
  - 'NAI: Mobile EDR/MTP agent data feeds and real-time log streams from enrolled mobile endpoints.'
  range: Last 90 days, event-centered with a 100 ms thread-scoped window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for t in edr_threads:\n  events = t.api_calls\n  for i, e in enumerate(events):\n    if e.api=='Method.invoke'\
      \ and exists prev=events[i-1]\n       and prev.api=='System.loadLibrary' and (e.ts - prev.ts) <=\
      \ 100ms:\n      method_name = e.args.method\n      if method_name not in apk_plaintext_strings(t.pkg):\n\
      \        alert(HIGH, t.pkg, method=method_name, reason='reflection deobfuscation after native load')\n\
      \      else:\n        alert(MED, t.pkg, reason='reflect-after-loadLibrary')"
- question: Do the Shannon entropy values of string arguments passed to reflection methods (Class.forName,
    Method.invoke) exceed the 98th percentile of reflection calls for that application, suggesting runtime
    deobfuscation of class/method names?
  context: Obfuscated class/method names that are base64-encoded, encrypted, or algorithmically generated
    carry higher Shannon entropy than normal identifiers. This statistical method profiles each app's
    reflection usage from Mobile EDR or dynamic-analysis logs, computes the entropy of string arguments
    to Class.forName and Method.invoke, and alerts when entropy exceeds the 98th percentile of reflection
    calls for that app (a derivable per-app threshold). High-entropy reflection arguments suggest names
    are being deobfuscated at runtime — a Defense Evasion behavior that defeats static string analysis.
    Deriving the threshold per-app keeps it aligned with each app's normal naming conventions, so obfuscation
    stands out even in apps that legitimately use reflection.
  answer_sources: *id003
  range: Last 90 days, with a per-app entropy baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for app in apps:\n  calls = reflection_calls(app)  # Class.forName, Method.invoke\n  ent =\
      \ [shannon_entropy(c.string_arg) for c in calls]\n  thr = percentile(ent, 98)\n  for c in calls:\n\
      \    if shannon_entropy(c.string_arg) > thr:\n      alert(app, api=c.api, arg=c.string_arg, entropy=shannon_entropy(c.string_arg),\n\
      \            reason='high-entropy reflection arg (runtime deobfuscation)')"
- question: When API call traces from the dynamic-analysis sandbox are modeled with a Markov-chain call-transition
    abstraction plus reflection and dynamic-code-loading features, does any trace classify as suspicious
    — particularly chains that combine reflection with native code?
  context: The behavioral fingerprint of evasive native code is a sequence of API calls, not a single
    call. This ML method represents sandbox traces with MaMaDroid's Markov-chain call-transition abstraction,
    augmented with features for presence of reflection APIs, entropy of their arguments, and presence
    of dynamic code-loading APIs, then classifies each trace as benign or suspicious. Following Drebin,
    each alert surfaces the top-3 contributing features so analysts understand the verdict. The highest-priority
    output is any suspicious trace that chains reflection with native code loading/execution — the exact
    Defense Evasion pattern this technique enables. Because it operates on transition probabilities rather
    than fixed strings, the model resists simple renaming/obfuscation.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = load('mamadroid_markov_clf')\nfor trace in sandbox_traces():\n  x = markov_transition_matrix(trace)\n\
      \       + [has_reflection(trace), reflect_arg_entropy(trace), has_dynamic_loading(trace)]\n  label,\
      \ score = model.predict(x)\n  if label=='suspicious':\n    alert(trace.app, score, top3=model.explain(x)[:3],\n\
      \          chained=(has_reflection(trace) and has_native_exec(trace)))"
- question: Does any non-allowlisted application contain native libraries that import command-execution
    C functions (system, execve, popen) or embed shell-command strings (/system/bin/sh, su, pm install,
    am start, reboot, setprop)?
  context: Native libraries that can spawn shells or run system commands give an app the ability to execute
    arbitrary binaries — the core of the Execution tactic via native code. This symbolic-logic check,
    run during static analysis, scans every native library for a blocklist of execution-capable imports
    (system, execve, popen) and embedded shell strings (/system/bin/sh, su, pm install, am start, reboot,
    setprop), the same execution-capable static feature family used by Drebin. It compares the parent
    package name against an allowlist of approved tools that legitimately use these functions and alerts
    on any non-allowlisted app containing the indicators. A positive result means the app is capable of
    native command execution and should be reviewed; the allowlist suppresses sanctioned admin/dev tooling
    to keep precision high.
  answer_sources: &id004
  - APK.StaticAnalysisReports
  - MDM.AppInventoryLogs
  - 'NAI: Corporate application vetting system (static analysis sandbox) and MDM application inventory
    database.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "exec_imports = ['system','execve','popen']\nexec_strings = ['/system/bin/sh','su','pm install','am\
      \ start','reboot','setprop']\nfor app in mdm_inventory:\n  for lib in static_report(app).native_libs:\n\
      \    if (any(i in lib.imports for i in exec_imports) or\n        any(s in lib.strings for s in exec_strings)):\n\
      \      if app.pkg not in approved_tools_allowlist:\n        alert(app.pkg, lib=lib.name,\n     \
      \         hits=matched(exec_imports+exec_strings), reason='native execution capability')"
- question: Which applications' native libraries accumulate a rarity-weighted risk score above the 98th
    percentile, where each suspicious indicator (e.g., system import, su string) is weighted inversely
    to its fleet-wide prevalence?
  context: Common indicators across many apps are usually benign library behavior; rare ones are discriminative.
    This statistical method computes the fleet-wide prevalence of each suspicious indicator (e.g., the
    system import, the su string), assigns a risk score inversely proportional to frequency, and sums
    scores per library — mirroring Drebin's discriminative weighting. Applications whose libraries exceed
    the 98th percentile of total risk score are flagged, and the alert reports which rare indicators drove
    the score. This sharpens Execution-tactic hunting by elevating apps whose native code carries unusual,
    rarely-seen execution capabilities rather than ubiquitous ones, focusing analyst attention on the
    statistical outliers most likely to be malicious.
  answer_sources: *id004
  range: Last 90 days, with a fleet-wide prevalence baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "prev = {ind: fleet_prevalence(ind) for ind in suspicious_indicators}\nfor app in apps:\n \
      \ score = 0; drivers = []\n  for lib in static_report(app).native_libs:\n    for ind in lib.indicators:\n\
      \      w = 1.0 / max(prev[ind], epsilon)   # rarer => higher weight\n      score += w; drivers.append((ind,\
      \ w))\n  if score > percentile(all_app_scores, 98):\n    alert(app, score, top_indicators=sorted(drivers,\
      \ key=w, desc)[:5])"
