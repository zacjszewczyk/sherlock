name: 'T1078: Valid Accounts'
id: 1d9e6189-71de-4731-8946-43a878702889
description: Investigate suspected SIM Card Swap activity (MITRE Mobile T1451) and the corporate-account
  compromise it enables. After an adversary convinces a mobile carrier to port a victim's number to an
  attacker-controlled SIM, they can intercept SMS one-time passcodes and account-recovery messages, then
  authenticate to corporate services as the victim. This playbook helps an analyst answer whether such
  a compromise has occurred by correlating Mobile Device Management (MDM) SIM-change indicators (new IMSI/ICCID,
  'SIM Not Present', device unenrollment) with anomalous authentication to corporate services (VPN, Azure
  AD, Windows, IdP) within a short window, and by hunting the phishing/smishing that frequently precedes
  a SIM swap (lure domains, credential/PII harvesting POSTs, spoofed inbound messages). It combines deterministic
  SIEM correlation, impossible-travel and failure-mode signals, per-user statistical baselining, structural
  login-graph analysis, and machine-learning models (Isolation Forest, supervised URL classifiers, homoglyph
  detection, smishing NLP) so the analyst can confirm or rule out account takeover and trigger containment.
type: technique
related:
- tactic_id: TA0027
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
