questions:
- question: Within 4 hours of an MDM event indicating a SIM change for a user (IMSI changed, ICCID changed,
    'SIM removed/Not Present', or device unenrolled), did that same user successfully authenticate to
    a corporate service (VPN, Azure AD, Windows) from a source IP belonging to an anonymizing proxy or
    Tor exit node?
  context: 'This is the core SIM-swap kill-chain detection for Initial Access via valid accounts. A carrier-side
    SIM swap surfaces on the device as an MDM SIM/identity change; the adversary then intercepts SMS OTPs
    and logs in as the victim. Joining MDM SIM-change events to authentication logs on user identity and
    requiring a successful login within 4 hours from a known-anonymizing IP (threat-intel feed of proxies/Tor)
    yields a high-fidelity, deterministic signal. The 4-hour window reflects the documented SIM-swap-to-OTP-interception
    interval. A positive result is strong evidence of account takeover and should trigger session invalidation;
    a negative result does not clear the user if the login IP simply was not on the anonymizer feed, so
    pair with the baseline and impossible-travel checks. The 4-hour window and SIM-change-to-OTP-interception
    chain are grounded in the documented SIM-swap kill chain: [An Empirical Study of Wireless Carrier
    Authentication for SIM Swaps, Lee et al](https://www.usenix.org/conference/soups2020/presentation/lee).'
  answer_sources:
  - MDM logs (IMSI/ICCID changes, SIM status, device compliance/enrollment status)
  - Windows Event ID 4624 (success) and 4625 (failure)
  - Azure AD SignInLogs (interactive + non-interactive, MFA/SMS-OTP result)
  - VPN authentication logs
  - IdP self-service password reset / account recovery logs
  - Zeek conn.log
  - 'NAI: Mobile Device Management (MDM) Platform, Corporate Authentication Servers (e.g., Active Directory),
    Cloud Identity Providers (e.g., Azure AD, Okta), VPN Concentrators, and Network Egress Points/Internet
    Gateways'
  range: Last 90 days (correlate MDM SIM-change events to authentications within a 4-hour window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'JOIN mdm_logs AS m, auth_logs AS a ON m.user == a.user

      WHERE m.event IN (''IMSI_changed'',''ICCID_changed'',''SIM_removed'',''SIM_not_present'',''device_unenrolled'')

      AND a.result == ''success''

      AND a.time BETWEEN m.time AND m.time + 4h

      AND a.src_ip IN threat_intel(''tor_exit'',''anonymizing_proxy'')

      => ALERT severity=high ''Possible SIM-swap account takeover'''
- question: For each successful authentication within 24 hours of an MDM SIM-change event, does the required
    travel speed between the user's prior login location and this login exceed ~900 km/h, or does the
    login originate from a country never seen in the user's 90-day baseline (impossible travel)?
  context: Impossible-travel geofeasibility catches an attacker authenticating from a geographically implausible
    location relative to the legitimate user immediately after a SIM swap. Compute distance between consecutive
    login geolocations divided by the time delta; speeds above the commercial-flight threshold (tune per
    org) or a brand-new country indicate two different people using one identity. This complements the
    anonymizer rule because attackers may use residential/clean IPs. A positive result, especially within
    the SIM-change window, is high-severity and warrants containment; benign causes include VPN egress
    shifts and corporate travel, so verify against expected itineraries. Pair this with production impossible-travel/anonymizing-IP
    logic per [WO2018085161A1 Impossible Travel Detection, Microsoft](https://patents.google.com/patent/WO2018085161A1/en)
    and [Anomaly Detection Policies, Microsoft Defender for Cloud Apps](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy).
  answer_sources:
  - MDM logs (IMSI/ICCID changes, SIM status, device compliance/enrollment status)
  - Windows Event ID 4624 (success) and 4625 (failure)
  - Azure AD SignInLogs (interactive + non-interactive, MFA/SMS-OTP result)
  - VPN authentication logs
  - IdP self-service password reset / account recovery logs
  - Zeek conn.log
  - 'NAI: Mobile Device Management (MDM) Platform, Corporate Authentication Servers (e.g., Active Directory),
    Cloud Identity Providers (e.g., Azure AD, Okta), VPN Concentrators, and Network Egress Points/Internet
    Gateways'
  range: Last 90 days (evaluate logins within 24 hours of each MDM SIM-change event)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each success_login a WHERE exists mdm_sim_change(a.user) within 24h:\n  prev = previous_login(a.user)\n\
      \  speed = geo_distance(prev.geo, a.geo) / (a.time - prev.time)\n  IF speed > 900 km/h OR a.country\
      \ NOT IN baseline_countries(a.user, 90d):\n     ALERT severity=high 'Impossible travel after SIM\
      \ change'"
- question: Within 4 hours of an MDM SIM-change event, did the user account show a spike in failed logons
    above its per-user daily 95th-percentile baseline, self-service password-reset or account-recovery
    events, or repeated SMS-OTP challenge sends followed by a single success from a new device/IP?
  context: 'Failure state is itself a diagnostic signal. An adversary performing a SIM swap typically
    drives the SMS-recovery flow: triggering OTP resends, attempting password resets, and generating failed
    logons before the takeover succeeds. Profiling failure/success transitions for the account and alerting
    on (a) Windows 4625 / Azure AD failure spikes above the user''s 95th-percentile, (b) self-service
    password-reset or recovery events, or (c) bursts of SMS-OTP sends ending in a single new-device success
    makes these bursts high-value indicators within the SIM-change window. A positive result suggests
    active recovery-flow abuse; correlate with the originating device/IP for confirmation. The SMS-recovery
    dependency that makes these failure bursts diagnostic is documented in [An Empirical Study of Wireless
    Carrier Authentication for SIM Swaps, Lee et al](https://www.usenix.org/conference/soups2020/presentation/lee).'
  answer_sources:
  - MDM logs (IMSI/ICCID changes, SIM status, device compliance/enrollment status)
  - Windows Event ID 4624 (success) and 4625 (failure)
  - Azure AD SignInLogs (interactive + non-interactive, MFA/SMS-OTP result)
  - VPN authentication logs
  - IdP self-service password reset / account recovery logs
  - Zeek conn.log
  - 'NAI: Mobile Device Management (MDM) Platform, Corporate Authentication Servers (e.g., Active Directory),
    Cloud Identity Providers (e.g., Azure AD, Okta), VPN Concentrators, and Network Egress Points/Internet
    Gateways'
  range: Last 90 days (focus on the 4-hour window after each MDM SIM-change event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR user u WITH mdm_sim_change(u) AS t0:\n  failed = count(auth_failure(u) BETWEEN t0 AND\
      \ t0+4h)\n  IF failed > p95(daily_failed_logons(u, 90d))\n     OR exists(self_service_pw_reset(u)\
      \ OR account_recovery(u) IN [t0, t0+4h])\n     OR (count(sms_otp_send(u)) >= 3 AND success_from_new_device_ip(u)):\n\
      \     ALERT severity=high 'Recovery-flow abuse after SIM change'"
- question: Using a 90-day rolling per-user authentication baseline (source countries/ASNs, login hour-of-day
    distribution, user-agent set, daily failed-logon distribution), does a new login produce an additive
    risk score above threshold (+3 new country, +2 new ASN, +2 rare-hour login, +1 unseen user-agent,
    +2 failed-logons above 95th percentile)?
  context: Statistical baselining establishes what 'normal' looks like for each user so deviations are
    measurable rather than guessed. For every new login, accumulate the additive score across geography,
    timing, user-agent, and failure features; a score above 4 is a medium-severity anomaly, escalating
    to critical when it occurs within 4 hours of a confirmed MDM SIM-change event. This catches account
    misuse even when individual signals are subtle. Tune cutoffs from your own login history; a high score
    with a SIM change is strong takeover evidence, while isolated medium scores warrant correlation before
    action. Behavioral profiling thresholds follow [Anomaly Detection Policies, Microsoft Defender for
    Cloud Apps](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy); derive
    site-specific cutoffs from your own login history.
  answer_sources:
  - MDM logs (IMSI/ICCID changes, SIM status, device compliance/enrollment status)
  - Windows Event ID 4624 (success) and 4625 (failure)
  - Azure AD SignInLogs (interactive + non-interactive, MFA/SMS-OTP result)
  - VPN authentication logs
  - IdP self-service password reset / account recovery logs
  - Zeek conn.log
  - 'NAI: Mobile Device Management (MDM) Platform, Corporate Authentication Servers (e.g., Active Directory),
    Cloud Identity Providers (e.g., Azure AD, Okta), VPN Concentrators, and Network Egress Points/Internet
    Gateways'
  range: Last 90 days (rolling baseline; score new logins in real time)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = profile(user, 90d): {countries, asns, hour_hist, user_agents, failed_p95}\nFOR\
      \ new_login x:\n  s = 0\n  s += 3 if x.country NOT IN baseline.countries\n  s += 2 if x.asn NOT\
      \ IN baseline.asns\n  s += 2 if x.hour IN bottom5pct(baseline.hour_hist)\n  s += 1 if x.user_agent\
      \ NOT IN baseline.user_agents\n  s += 2 if x.daily_failed > baseline.failed_p95\n  IF s > 4: ALERT\
      \ severity=medium\n  IF s > 4 AND mdm_sim_change(x.user) within 4h: ALERT severity=critical"
- question: Does a post-SIM-change login form a structurally anomalous (user, source-host/IP, target-service)
    relationship whose support falls below a tuned minimum in the user's 90-day login graph?
  context: Beyond geography and timing, the structure of who-logs-into-what is itself informative. By
    learning normal user->host->service relationships with market-basket association rules and flagging
    tuples with support below a tuned minimum, you catch credential misuse that lands on services the
    legitimate user never touches - a common giveaway when an attacker pivots after a SIM-swap-enabled
    takeover. This complements geo/time scoring. A positive result (a rare or never-seen service for that
    user/host) deserves investigation; expect some noise from legitimate first-time service access, so
    correlate with the SIM-change timeline. Method per [Detecting Structurally Anomalous Logins Within
    Enterprise Networks, Siadati and Memon](https://doi.org/10.1145/3133956.3134003).
  answer_sources:
  - MDM logs (IMSI/ICCID changes, SIM status, device compliance/enrollment status)
  - Windows Event ID 4624 (success) and 4625 (failure)
  - Azure AD SignInLogs (interactive + non-interactive, MFA/SMS-OTP result)
  - VPN authentication logs
  - IdP self-service password reset / account recovery logs
  - Zeek conn.log
  - 'NAI: Mobile Device Management (MDM) Platform, Corporate Authentication Servers (e.g., Active Directory),
    Cloud Identity Providers (e.g., Azure AD, Okta), VPN Concentrators, and Network Egress Points/Internet
    Gateways'
  range: Last 90 days (build login graph; evaluate post-SIM-change logins)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "graph = assoc_rules(logins(90d), itemset=(user, src_host_ip, target_service))\nFOR login l\
      \ AFTER mdm_sim_change(l.user):\n  sup = support(graph, (l.user, l.src_host_ip, l.target_service))\n\
      \  IF sup < min_support_threshold:\n     ALERT severity=medium 'Structurally anomalous login after\
      \ SIM change'"
- question: When an Isolation Forest trained per-user on 90 days of authentication features scores a new
    login in the user's top 1st percentile of anomaly, and this occurs within 4 hours of an MDM SIM-change
    event, what are the top-3 contributing features driving the account-takeover determination?
  context: Machine learning generalizes across the combined feature space (cyclical encodings of login
    hour/day, one-hot top-10 countries/ASNs, TF-IDF user-agent, recent failed-logon ratio) to find anomalies
    that rule thresholds miss. Score each new login in real time; a top-1-percentile anomaly within the
    4-hour SIM-change window is a high-confidence takeover signal that can trigger automated session invalidation/account
    suspension. Crucially, the alert must surface the top-3 contributing features (e.g., new ASN, rare-hour
    login, unseen user-agent) so the analyst can triage and explain the verdict. Retrain regularly and
    validate against confirmed incidents to control false positives. Algorithm per [Isolation Forest,
    Liu et al](https://doi.org/10.1145/2133360.2133363).
  answer_sources:
  - MDM logs (IMSI/ICCID changes, SIM status, device compliance/enrollment status)
  - Windows Event ID 4624 (success) and 4625 (failure)
  - Azure AD SignInLogs (interactive + non-interactive, MFA/SMS-OTP result)
  - VPN authentication logs
  - IdP self-service password reset / account recovery logs
  - Zeek conn.log
  - 'NAI: Mobile Device Management (MDM) Platform, Corporate Authentication Servers (e.g., Active Directory),
    Cloud Identity Providers (e.g., Azure AD, Okta), VPN Concentrators, and Network Egress Points/Internet
    Gateways'
  range: Last 90 days (training window); score logins in real time
  queries:
  - technology: ML/pseudocode
    query: "model[u] = IsolationForest(features(auth_logs(u, 90d)))\nfeatures = [sin/cos(hour), sin/cos(dow),\
      \ onehot(country,asn top10),\n            tfidf(user_agent), recent_failed_ratio]\nFOR new_login\
      \ x:\n  score = model[x.user].anomaly(x)\n  IF score IN top1pct(x.user) AND mdm_sim_change(x.user)\
      \ within 4h:\n     ALERT severity=high contributing=top3_features(x)\n     SOAR.invalidate_sessions(x.user)"
- question: Did a user make an HTTP POST to a domain first resolved in DNS from that same IP within the
    last 5 minutes, where the domain is newly registered (WHOIS age < 30 days) or matches a brand-typosquat
    watchlist, AND the POST body contains PII/credential keywords (ssn, dob, pin, mmn, securityPin)?
  context: 'SIM swaps are frequently preceded by phishing/smishing that harvests the PII and credentials
    needed to pass carrier verification. This deterministic SIEM rule chains a fresh DNS resolution to
    an HTTP POST and gates on domain youth/typosquatting plus PII keywords in the body, yielding high-fidelity
    detection of credential/PII harvesting. The 5-minute DNS-to-POST window captures the click-then-submit
    flow. A positive result is high-severity (data likely submitted to an attacker site) and should trigger
    credential reset; tune the PII keyword list and brand watchlist to your environment. Newly-registered/short-TTL
    domain features follow [EXPOSURE: Finding Malicious Domains Using Passive DNS Analysis, Bilge et al](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf).'
  answer_sources:
  - Zeek dns.log (incl. NXDOMAIN / response codes)
  - Zeek http.log (incl. response status codes)
  - Email/SMS gateway logs (SPF/DKIM/DMARC verdicts, sender domain)
  - Web proxy logs
  - WHOIS / passive-DNS data feeds
  - 'NAI: Corporate Email Security Gateway, Internal DNS Resolvers, Web Proxies and Internet Gateways,
    and user Endpoint Devices'
  range: Last 90 days (correlate DNS resolution to HTTP POST within a 5-minute window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR http_post p (zeek http.log / proxy):\n  d = p.host\n  IF dns_resolved(d, p.src_ip) within\
      \ last 5m\n     AND (whois_age(d) < 30d OR d IN brand_typosquat_watchlist)\n     AND body_contains(p,\
      \ ['ssn','dob','pin','mmn','securityPin']):\n     ALERT severity=high 'PII/credential harvesting\
      \ POST'"
- question: At the email/SMS gateway, did an inbound message fail SPF/DKIM/DMARC authentication or spoof
    a trusted/brand domain while also containing a URL?
  context: Inbound message authentication is the anti-spoofing floor for phishing/smishing detection.
    Deterministically evaluate SPF/DKIM/DMARC verdicts plus sender-domain trust and flag messages that
    fail authentication or impersonate a trusted/brand domain while carrying a URL - the classic credential-lure
    pattern that seeds SIM-swap groundwork. Brand impersonation is the dominant smishing lure. A positive
    result identifies likely phishing delivery; correlate with subsequent click/POST activity to assess
    whether the user engaged. Legitimate bulk senders with misconfigured SPF can cause false positives,
    so weight sender reputation. Authentication verdict plus sender-domain reputation as the primary anti-spoofing
    floor is established by [End-to-End Measurements of Email Spoofing Attacks, Hu and Wang](https://www.usenix.org/conference/usenixsecurity18/presentation/hu);
    brand impersonation is the dominant smishing lure per [Preliminary Results from a U.S. Demographic
    Analysis of SMiSh Susceptibility, Faklaris et al](https://arxiv.org/abs/2309.06322).
  answer_sources:
  - Zeek dns.log (incl. NXDOMAIN / response codes)
  - Zeek http.log (incl. response status codes)
  - Email/SMS gateway logs (SPF/DKIM/DMARC verdicts, sender domain)
  - Web proxy logs
  - WHOIS / passive-DNS data feeds
  - 'NAI: Corporate Email Security Gateway, Internal DNS Resolvers, Web Proxies and Internet Gateways,
    and user Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR inbound_message m (email/SMS gateway):\n  IF (m.spf=='fail' OR m.dkim=='fail' OR m.dmarc=='fail'\n\
      \      OR spoofs_trusted_or_brand(m.sender_domain))\n     AND contains_url(m):\n     ALERT severity=medium\
      \ 'Failed-auth/spoofed message with URL'"
- question: Did a user generate a burst of NXDOMAIN responses (Zeek dns.log rcode=3) or HTTP 404/410/connection-refused
    responses to newly-registered or typosquat domains within a short window, indicating clicks to fast-rotating,
    taken-down phishing infrastructure?
  context: 'Failure-mode telemetry is a distinct signal: phishing infrastructure churns rapidly and is
    frequently taken down, so a user clicking links to lure domains often produces bursts of NXDOMAIN
    or HTTP 404/410/connection-refused to short-lived, newly-registered or typosquat domains. Profiling
    these failures catches victims interacting with dead/rotating phishing infrastructure even when the
    live POST is missed. A positive result indicates the user is clicking phishing links; pivot to gateway
    logs to find the originating message and to proxy logs for any successful submissions. Short-lived
    domain churn is characterized in [EXPOSURE, Bilge et al](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf);
    link liveness as a smishing signal is used in [POSTER: A Multi-Signal Model for Detecting Evasive
    Smishing, Hosseinpour and Das](https://arxiv.org/abs/2505.18233).'
  answer_sources:
  - Zeek dns.log (incl. NXDOMAIN / response codes)
  - Zeek http.log (incl. response status codes)
  - Email/SMS gateway logs (SPF/DKIM/DMARC verdicts, sender domain)
  - Web proxy logs
  - WHOIS / passive-DNS data feeds
  - 'NAI: Corporate Email Security Gateway, Internal DNS Resolvers, Web Proxies and Internet Gateways,
    and user Endpoint Devices'
  range: Last 90 days (evaluate bursts within short rolling windows)
  queries:
  - technology: Zeek/pseudocode
    query: "FOR user u WITHIN 10m window:\n  fails = events WHERE (dns.log rcode==3) OR (http.log status\
      \ IN [404,410] OR conn_refused)\n                AND dest_domain (whois_age<30d OR in typosquat_watchlist)\n\
      \  IF count(fails) > burst_threshold:\n     ALERT severity=medium 'Clicks to fast-rotating phishing\
      \ infra'"
- question: For an outbound HTTP POST to a non-allowlisted domain, is the request-body size anomalous
    (z-score > 3.0 vs the user's historical POST sizes per destination domain), and does the destination
    have high lexical entropy (>4.0) or low Levenshtein distance (<=2) to a known brand?
  context: 'Statistical baselining of upload volume detects abnormal data submission to suspicious destinations.
    Baseline POST body sizes per user and per second-level domain; a z-score above 3.0 to a non-allowlisted
    domain signals an unusual upload, and combining it with domain lexical features (high Shannon entropy
    suggesting DGA-like names, or near-brand typosquats) raises a medium-severity PII/credential-exfil
    alert. This catches harvesting that keyword rules miss. A positive result warrants inspecting the
    POST destination and body; tune the z-threshold and maintain an allowlist of legitimate high-volume
    upload domains. Lexical/entropy domain features per [Malicious URL Detection using Machine Learning:
    A Survey, Sahoo et al](https://arxiv.org/abs/1701.07179) and [EXPOSURE, Bilge et al](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf).'
  answer_sources:
  - Zeek dns.log (incl. NXDOMAIN / response codes)
  - Zeek http.log (incl. response status codes)
  - Email/SMS gateway logs (SPF/DKIM/DMARC verdicts, sender domain)
  - Web proxy logs
  - WHOIS / passive-DNS data feeds
  - 'NAI: Corporate Email Security Gateway, Internal DNS Resolvers, Web Proxies and Internet Gateways,
    and user Endpoint Devices'
  range: Last 90 days (rolling per-user/per-domain POST-size baseline)
  queries:
  - technology: Zeek/pseudocode
    query: "baseline = post_body_sizes(user, sld, 90d)\nFOR post p TO non_allowlisted_domain d:\n  z =\
      \ (p.body_len - mean(baseline)) / std(baseline)\n  IF z > 3.0 AND (shannon_entropy(d) > 4.0 OR\n\
      \     min_levenshtein(d, ['verizon','att','bankofamerica']) <= 2):\n     ALERT severity=medium 'Anomalous\
      \ upload to suspicious domain'"
- question: Does an inbound SMS/message plus embedded URL score above the tuned threshold of an additive
    multi-signal smishing model that fuses content keywords (urgency/brand), URL features (shortener use,
    subdomain/path tokens, domain age), sender frequency (first-contact, bulk-send), and dead/short-lived
    link checks?
  context: 'Single signals are easily evaded, so fuse multiple weak indicators into one additive smishing
    score: urgency/brand content terms, URL structure and domain age, sender novelty/bulk rate, and a
    failure-mode weight for dead or short-lived links. Susceptibility skews toward impersonated brands,
    so weight those lures. Alerting above a tuned threshold catches evasive smishing that any one feature
    would miss - the same lures that set up SIM swaps. A positive result identifies a likely smishing
    message; review whether the recipient clicked or replied with PII, and tune weights against labeled
    samples. Multi-signal fusion to defeat evasion is from [POSTER: A Multi-Signal Model for Detecting
    Evasive Smishing, Hosseinpour and Das](https://arxiv.org/abs/2505.18233); susceptibility weighting
    toward impersonated brands from [Faklaris et al](https://arxiv.org/abs/2309.06322).'
  answer_sources:
  - Zeek dns.log (incl. NXDOMAIN / response codes)
  - Zeek http.log (incl. response status codes)
  - Email/SMS gateway logs (SPF/DKIM/DMARC verdicts, sender domain)
  - Web proxy logs
  - WHOIS / passive-DNS data feeds
  - 'NAI: Corporate Email Security Gateway, Internal DNS Resolvers, Web Proxies and Internet Gateways,
    and user Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "score = w1*content_keywords(msg) + w2*url_features(url)\n      + w3*sender_frequency(sender)\
      \ + w4*dead_link_check(url)\nurl_features = [shortener, subdomain_count, path_tokens, 30 - whois_age]\n\
      IF score > smishing_threshold:\n   ALERT severity=medium 'Evasive smishing likely'"
- question: When a supervised URL classifier (e.g., XGBoost using lexical, host/WHOIS, and certificate
    features) scores a clicked external email/SMS URL with phishing probability > 0.95 and an HTTP POST
    to that URL follows within 5 minutes, what are the top-3 contributing features?
  context: 'A trained URL classifier scores every clicked external URL in real time, combining lexical
    features (length, subdomain count, path depth, special chars), host-based features (WHOIS domain age,
    TLD reputation, ASN), and certificate features (issuer, validity). A probability above 0.95 followed
    within 5 minutes by an HTTP POST to that URL is a critical signal of active credential/PII submission
    and should trigger a SOAR isolate+credential-reset playbook. The alert must list the top-3 contributing
    features for analyst triage and explainability. Retrain on fresh phishing corpora and validate precision
    before enabling automated response. Feature taxonomy per [Malicious URL Detection using Machine Learning:
    A Survey, Sahoo et al](https://arxiv.org/abs/1701.07179).'
  answer_sources:
  - Zeek dns.log (incl. NXDOMAIN / response codes)
  - Zeek http.log (incl. response status codes)
  - Email/SMS gateway logs (SPF/DKIM/DMARC verdicts, sender domain)
  - Web proxy logs
  - WHOIS / passive-DNS data feeds
  - 'NAI: Corporate Email Security Gateway, Internal DNS Resolvers, Web Proxies and Internet Gateways,
    and user Endpoint Devices'
  range: Last 90 days (real-time scoring of clicked URLs)
  queries:
  - technology: ML/pseudocode
    query: "clf = XGBoost(lexical + host_whois + cert_features)\nFOR url clicked_in external_email_or_sms:\n\
      \  p = clf.prob_malicious(url)\n  IF p > 0.95 AND http_post_to(url) within 5m:\n     ALERT severity=critical\
      \ contributing=top3_features(url)\n     SOAR.isolate_and_reset(user)"
- question: Do any candidate lure domains have a low Siamese visual-similarity (rendered-image) embedding
    distance to a protected brand/carrier domain AND a recent registration date, indicating unicode-homoglyph
    or lookalike spoofs (e.g., 'paypa1.com') that edit-distance and entropy checks miss?
  context: Homoglyph and lookalike domains visually impersonate brands while evading lexical metrics.
    A Siamese CNN renders domain strings to images and scores visual resemblance to protected brand/carrier
    domains, catching unicode-homoglyph and character-substitution spoofs. Flag domains whose embedding
