- question: '[Defense Evasion] Alert on APK/IPA mime-type mismatches: Can you determine whether A file
    is transferred to a mobile device where the filename extension (e.g., .pdf, .jpg) is inconsistent
    with the true file type identified by Zeek''s file analysis, which reports a mobile application package
    mime_type (''application/vnd.android.package-archive'' or ''application/x-itunes-ipa''); or an installed/transferred
    APK is signed with a certificate that does not match the official publisher certificate for that package
    name, indicating a repackaged masquerade. -- specifically, using the ''Alert on APK/IPA mime-type
    mismatches'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Evasion tactic (TA0030), an adversary manipulates the
    name, location, metadata, signing identity, or appearance of mobile artifacts so malicious objects
    appear legitimate to users and security tooling, defeating detection and observation. This evidence
    focuses on the condition that A file is transferred to a mobile device where the filename extension
    (e.g., .pdf, .jpg) is inconsistent with the true file type identified by Zeek''s file analysis, which
    reports a mobile application package mime_type (''application/vnd.android.package-archive'' or ''application/x-itunes-ipa'');
    or an installed/transferred APK is signed with a certificate that does not match the official publisher
    certificate for that package name, indicating a repackaged masquerade. The ''Alert on APK/IPA mime-type
    mismatches'' approach (Symbolic Logic) works as follows: Join Zeek files.log with conn.log on UID
    and alert when mime_type is application/vnd.android.package-archive or application/x-itunes-ipa but
    filename does not end in .apk or .ipa for mobile-originating connections (magic-byte vs extension
    mismatch). A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    masquerading; pivot to the responsible mobile device, user/identity, application package and signer,
    source/destination IPs and domains, the file or app involved, and the surrounding timeline of network,
    authentication, and installation activity to scope intent and impact. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or novel masquerading.'
