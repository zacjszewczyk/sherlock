      | output ts, id.orig_h, id.resp_h, id.resp_p, query, mime_type, filename, user_agent, service'
- question: '[Defense Evasion] Baseline data volume, frequency, ports, and DNS entropy: Can you determine
    whether A mobile device, identified by its OS in the HTTP User-Agent string, generates an outbound
    network connection where: (1) the destination IP or domain is present on a C2 threat intelligence
    list; (2) the requested domain in the corresponding DNS query has a Shannon entropy score greater
    than 3.5 (tune 3.5-4.0 per environment) with abnormal lexical structure (long single labels, high
    distinct-character count), suggesting DGA/tunneling; or (3) the connection''s outbound data volume,
    frequency, and destination port are statistical outliers versus a 30-day per-device baseline (e.g.,
    >3 standard deviations from the mean). -- specifically, using the ''Baseline data volume, frequency,
    ports, and DNS entropy'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Evasion tactic (TA0030), an adversary manipulates the
    name, location, metadata, signing identity, or appearance of mobile artifacts so malicious objects
    appear legitimate to users and security tooling, defeating detection and observation. This evidence
    focuses on the condition that A mobile device, identified by its OS in the HTTP User-Agent string,
    generates an outbound network connection where: (1) the destination IP or domain is present on a C2
    threat intelligence list; (2) the requested domain in the corresponding DNS query has a Shannon entropy
    score greater than 3.5 (tune 3.5-4.0 per environment) with abnormal lexical structure (long single
    labels, high distinct-character count), suggesting DGA/tunneling; or (3) the connection''s outbound
    data volume, frequency, and destination port are statistical outliers versus a 30-day per-device baseline
    (e.g., >3 standard deviations from the mean). The ''Baseline data volume, frequency, ports, and DNS
    entropy'' approach (Statistical Method) works as follows: For each mobile device, maintain a baseline
    of outbound data volume (95th percentile of orig_bytes), connection frequency (conns/min), and common
    destination ports. Compute per-query Shannon entropy plus lexical features (character counts, longest
    label length, label count) and alert when a device exceeds its volume/frequency baseline, uses ports
    outside its common set, or issues DNS queries with entropy over 3.5, following the stateless feature
    set of [Ahmed et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf). Profile NXDOMAIN/failed-resolution
    rates as a distinct beaconing signal. A positive result -- a rule match, statistical outlier, or model
    alert -- indicates probable masquerading; pivot to the responsible mobile device, user/identity, application
    package and signer, source/destination IPs and domains, the file or app involved, and the surrounding
    timeline of network, authentication, and installation activity to scope intent and impact. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or novel masquerading.'
