name: 'T1655: Masquerading'
id: 96b65631-65c0-41ea-85a5-70ec9a7941d3
description: 'This playbook helps an analyst investigate whether an adversary is using masqueraded applications,
  files, or network artifacts on mobile devices (Android, iOS) to evade defenses and avoid detection (MITRE
  ATT&CK T1655, Masquerading). Masquerading occurs when the name, location, metadata, signing identity,
  or appearance of an object is manipulated so a malicious artifact looks legitimate or benign to users
  and security tooling. The hunt pursues this behavior across complementary telemetry: (1) mobile-originated
  network egress that matches C2 threat intelligence, exhibits high-entropy/DGA-like DNS, or deviates
  from per-device volume/frequency/port baselines; (2) files delivered to mobile devices whose extension
  contradicts their true mobile application-package mime type, or whose APK signing certificate does not
  match the official publisher (repackaging); (3) authentication abuse from the mobile VPN address range,
  including brute-force/password-spray bursts, follow-on successful logons, and geo-temporally impossible
  travel; and (4) installed or vetted applications that spoof trusted brand names/icons, are repackaged
  with a mismatched certificate, or request high-risk permissions inconsistent with their declared category.
  Detection methods combine deterministic symbolic-logic rules, statistical baselining (Shannon entropy
  and lexical DNS features, per-device volume/frequency/port profiles, percentile and sigma thresholds),
  and machine learning (ARIMA forecasting, Isolation Forest, DBSCAN, Random Forest, UEBA, Drebin/MaMaDroid
  static and API-sequence classifiers, Siamese homoglyph detection), applied to Zeek conn/dns/http/files
  logs, Windows Event IDs 4624/4625, and mobile application vetting, MDM inventory, and APK manifest/signing
  telemetry, so the analyst can corroborate suspected masquerading against device, app, user, network,
  and authentication context.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
