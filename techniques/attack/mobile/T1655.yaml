questions:
- question: '[Defense Evasion] Match mobile traffic to C2 indicators: Can you determine whether A mobile
    device, identified by its OS in the HTTP User-Agent string, generates an outbound network connection
    where: (1) the destination IP or domain is present on a C2 threat intelligence list; (2) the requested
    domain in the corresponding DNS query has a Shannon entropy score greater than 3.5 (tune 3.5-4.0 per
    environment) with abnormal lexical structure (long single labels, high distinct-character count),
    suggesting DGA/tunneling; or (3) the connection''s outbound data volume, frequency, and destination
    port are statistical outliers versus a 30-day per-device baseline (e.g., >3 standard deviations from
    the mean). -- specifically, using the ''Match mobile traffic to C2 indicators'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Evasion tactic (TA0030), an adversary manipulates the
    name, location, metadata, signing identity, or appearance of mobile artifacts so malicious objects
    appear legitimate to users and security tooling, defeating detection and observation. This evidence
    focuses on the condition that A mobile device, identified by its OS in the HTTP User-Agent string,
    generates an outbound network connection where: (1) the destination IP or domain is present on a C2
    threat intelligence list; (2) the requested domain in the corresponding DNS query has a Shannon entropy
    score greater than 3.5 (tune 3.5-4.0 per environment) with abnormal lexical structure (long single
    labels, high distinct-character count), suggesting DGA/tunneling; or (3) the connection''s outbound
    data volume, frequency, and destination port are statistical outliers versus a 30-day per-device baseline
    (e.g., >3 standard deviations from the mean). The ''Match mobile traffic to C2 indicators'' approach
    (Symbolic Logic) works as follows: Query Zeek dns.log and conn.log for connections from mobile IP
    ranges to domains or IPs on C2 threat intel feeds. Join with http.log on UID to retrieve User-Agent
    and alert on matches. Embedded C2 URLs are also recoverable as a static app feature per [Drebin](https://www.ndss-symposium.org/ndss2014/drebin-effective-and-explainable-detection-android-malware-your-pocket);
    cross-reference vetted-app URL inventories. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable masquerading; pivot to the responsible mobile device, user/identity,
    application package and signer, source/destination IPs and domains, the file or app involved, and
    the surrounding timeline of network, authentication, and installation activity to scope intent and
    impact. A negative result helps rule out this particular vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy, low-and-slow, or novel
    masquerading.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Corporate Wi-Fi Network Egress Points, VPN Concentrators, DNS Resolvers, Cloud Access Security
    Brokers (CASBs), Mobile Device Management (MDM) Platforms'
  range: Last 90 days (correlate event-centered windows of +/- 5 minutes around the activity)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match mobile traffic to C2 indicators (Symbolic Logic)

      source IN [Zeek conn.log, Zeek dns.log, Zeek http.log]

      | filter scope IN NAI: Corporate Wi-Fi Network Egress Points, VPN Concentrators, DNS Resolvers,
      Cloud Access Security Brokers (CASBs), Mobile Device Management (MDM) Platforms

      | approach: Query Zeek dns.log and conn.log for connections from mobile IP ranges to domains or
      IPs on C2 threat intel feeds. Join with http.log on UID to retrieve User-Agent and alert on matches.
      Embedded C2 URLs are also recoverable as a static app feature per [Drebin](https://www.ndss-symposium.org/ndss2014/drebin-effective-and-explainable-detection-android-malware-your-pocket);
      cross-reference vetted-app URL inventories.

      | emit alert with contributing fields and entity context (device, os/user_agent, user, package_name,
      signer_cert, src_ip, dst_ip, domain, file_name, mime_type, permissions)'
  - technology: Zeek/pseudocode
    query: '# Match mobile traffic to C2 indicators -- Zeek implementation

      event zeek.conn / zeek.dns / zeek.http

      | where mobile device/asset in scope

      | apply symbolic logic logic: Query Zeek dns.log and conn.log for connections from mobile IP ranges
      to domains or IPs on C2 threat intel feeds. Join with http.log on UID to retrieve User-Agent and
      alert on matches. Embedded C2 URLs are also recoverable as a static app feature per [Drebin](https://www.ndss-symposium.org/ndss2014/drebin-effective-and-explainable-detection-android-malware-your-pocket);
