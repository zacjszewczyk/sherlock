name: 'T1636.005: Accounts'
id: 3f817b3d-c3a6-4af7-871c-960c0be728d7
description: This playbook helps an analyst investigate MITRE ATT&CK T1636.005 (Accounts) on managed Android
  and iOS devices, where an adversary abuses standard operating-system identity APIs to enumerate the
  accounts configured on a device as a precursor to data collection and exfiltration. On Android this
  is typically the AccountManager API (getAccounts(), getAccountsByType(), getAccountsByTypeForPackage(),
  getAuthenticatorTypes()); on iOS it is Keychain Services queries (SecItemCopyMatching). It supports
  the Collection mission question by chaining capability/permission context (GET_ACCOUNTS, MANAGE_ACCOUNTS,
  AUTHENTICATE_ACCOUNTS in the manifest/entitlements) to runtime account enumeration, device-posture signals
  (root/jailbreak, failed integrity attestation), and the small post-discovery network egress that often
  follows. The questions combine deterministic symbolic-logic detections (account-API vocabulary matching,
  app-vetting against declared function, read-to-egress taint tracking, rooted/jailbroken correlation),
  statistical baselining (query-frequency baselines, post-discovery flow anomalies, permission-rarity
  and failure-mode profiling), and machine-learning detectors (supervised intent-mismatch classification,
  unsupervised/one-class egress anomaly detection) across Android Logcat, iOS Unified Log, Mobile EDR/MTD
  API monitoring, app-vetting, MDM device-posture, and Zeek/NetFlow network telemetry.
type: technique
related:
- tactic_id: TA0035
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
