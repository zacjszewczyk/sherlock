questions:
- question: '[Collection] Flag unauthorized account enumeration APIs: have you determined whether flag
    unauthorized account enumeration APIs is warranted on managed mobile devices, using the Symbolic Logic
    approach described, to answer the intelligence requirement — Is an adversary gathering account information
    from the mobile device to support data collection or exfiltration? (TA0035 - Collection)'
  context: 'Tactic relevance (Collection): Is an adversary gathering account information from the mobile
    device to support data collection or exfiltration? (TA0035 - Collection) This question operationalizes
    a Symbolic Logic detection for MITRE ATT&CK T1636.005 (Accounts) on Android/iOS. Match the deterministic
    account-enumeration vocabulary in OS-API telemetry: on Android alert on AccountManager.getAccounts(),
    getAccountsByType(), getAccountsByTypeForPackage(), and getAuthenticatorTypes(); on iOS alert on SecItemCopyMatching/Keychain
    account-store queries. Fire when the calling package declares GET_ACCOUNTS/MANAGE_ACCOUNTS/AUTHENTICATE_ACCOUNTS
    but exposes no user-facing sign-in, sync, or profile-management feature, or when the static manifest/API
    profile already flags it as malicious ([Android AccountManager](https://developer.android.com/reference/android/accounts/AccountManager);
    [DREBIN](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)). Keep this as a deterministic
    floor even after ML detectors are layered on ([Android HIV](https://arxiv.org/abs/1808.04218)). A
    positive result indicates an app or process is enumerating device accounts in a manner inconsistent
    with its legitimate function and/or staging the results for exfiltration; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (permission/manifest
    context -> account enumeration -> root/jailbreak posture -> small post-discovery egress).'
  answer_sources: &id001
  - 'Android Logcat (OS API execution: AccountManager.getAccounts/getAccountsByType)'
  - iOS Unified Log
  - Mobile EDR/MTD API monitoring
  - Application manifest and entitlement / app-vetting analysis
  - MDM device posture logs (root/jailbreak, integrity attestation)
  - Network flow logs (Zeek conn.log / NetFlow) for post-discovery egress
  - 'NAI: Enterprise-managed mobile devices, corporate authentication logs, and MDM/MTD dashboards, plus
    egress collected at the per-app VPN / secure web gateway.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=mobile (source=\"android:logcat\" OR source=\"ios:unifiedlog\" OR source=MobileEDR.APIMonitoringLogs)\n\
      | where api IN (\"AccountManager.getAccounts\",\"AccountManager.getAccountsByType\",\n    \"AccountManager.getAccountsByTypeForPackage\"\
      ,\"AccountManager.getAuthenticatorTypes\",\n    \"SecItemCopyMatching\")\n| lookup AppFunctionCatalog\
      \ package_name OUTPUT has_signin_sync_profile\n| where has_signin_sync_profile!=\"true\" OR vetting_verdict=\"\
      malicious\"\n| eval severity=\"high\"\n| table device_id, package_name, api, declared_perms, _time"
- question: '[Collection] Vet apps requesting account access against declared function: have you determined
    whether vet apps requesting account access against declared function is warranted on managed mobile
    devices, using the Symbolic Logic approach described, to answer the intelligence requirement — Is
    an adversary gathering account information from the mobile device to support data collection or exfiltration?
    (TA0035 - Collection)'
  context: 'Tactic relevance (Collection): Is an adversary gathering account information from the mobile
    device to support data collection or exfiltration? (TA0035 - Collection) This question operationalizes
    a Symbolic Logic detection for MITRE ATT&CK T1636.005 (Accounts) on Android/iOS. During app vetting,
    block or quarantine packages whose requested permissions/APIs include account or keychain access inconsistent
    with their stated function, per organizational policy enforced through EMM/MDM/MTD ([NIST SP 800-163r1](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-163r1.pdf);
    [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf)).
    Maintain an allowlist of packages legitimately needing GET_ACCOUNTS (mail/calendar/SSO/sync clients)
    and treat any other requester of account/keychain access as high scrutiny. A positive result indicates
    an app or process is enumerating device accounts in a manner inconsistent with its legitimate function
    and/or staging the results for exfiltration; a negative result reduces but does not eliminate suspicion,
    so corroborate with the other questions in this playbook (permission/manifest context -> account enumeration
    -> root/jailbreak posture -> small post-discovery egress).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=mobile source=\"Application Vetting\"\n| where (\"android.permission.GET_ACCOUNTS\"\
      \ in requested_perms\n    OR \"android.permission.MANAGE_ACCOUNTS\" in requested_perms\n    OR \"\
      android.permission.AUTHENTICATE_ACCOUNTS\" in requested_perms\n    OR keychain_access=true)\n| lookup\
      \ AccountAccessAllowlist package_name OUTPUT approved\n| where isnull(approved)\n| eval action=\"\
      quarantine\", severity=\"high\"\n| table device_id, package_name, requested_perms, stated_function"
- question: '[Collection] Alert on account-read to egress taint flow: have you determined whether alert
    on account-read to egress taint flow is warranted on managed mobile devices, using the Symbolic Logic
    approach described, to answer the intelligence requirement — Is an adversary gathering account information
    from the mobile device to support data collection or exfiltration? (TA0035 - Collection)'
  context: 'Tactic relevance (Collection): Is an adversary gathering account information from the mobile
    device to support data collection or exfiltration? (TA0035 - Collection) This question operationalizes
    a Symbolic Logic detection for MITRE ATT&CK T1636.005 (Accounts) on Android/iOS. Tag account-store
    reads (AccountManager results, auth tokens, Keychain items) as a taint source and raise a deterministic
    alert when tainted data reaches a network-send sink within the same app session, catching read-then-exfiltrate
    behavior regardless of obfuscation ([TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf)).
    A positive result indicates an app or process is enumerating device accounts in a manner inconsistent
    with its legitimate function and/or staging the results for exfiltration; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (permission/manifest
    context -> account enumeration -> root/jailbreak posture -> small post-discovery egress).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=mobile source=MobileEDR.APIMonitoringLogs\n| eval is_source=if(api IN (\"AccountManager.getAccounts\"\
      ,\"AccountManager.getAccountsByType\",\n    \"SecItemCopyMatching\"),1,0)\n| eval is_sink=if(api\
      \ IN (\"Socket.connect\",\"HttpURLConnection.getOutputStream\",\"NSURLSession\"),1,0)\n| transaction\
      \ package_name, session_id maxspan=10m\n| where is_source>0 AND is_sink>0 AND source_time<sink_time\n\
      | eval severity=\"critical\" | table device_id, package_name, session_id, dest_ip"
- question: '[Collection] Detect rooted or jailbroken account scraping: have you determined whether detect
    rooted or jailbroken account scraping is warranted on managed mobile devices, using the Symbolic Logic
    approach described, to answer the intelligence requirement — Is an adversary gathering account information
    from the mobile device to support data collection or exfiltration? (TA0035 - Collection)'
  context: 'Tactic relevance (Collection): Is an adversary gathering account information from the mobile
    device to support data collection or exfiltration? (TA0035 - Collection) This question operationalizes
    a Symbolic Logic detection for MITRE ATT&CK T1636.005 (Accounts) on Android/iOS. Correlate account
    enumeration with jailbreak/root indicators, failed integrity attestation, suspicious process privileges,
    and direct identity-store access from apps lacking elevated entitlements ([NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf)).
    Prioritize devices where a non-privileged app reads account data after a compromise signal such as
    su access, code injection, or an MDM tamper alert. A positive result indicates an app or process is
    enumerating device accounts in a manner inconsistent with its legitimate function and/or staging the
    results for exfiltration; a negative result reduces but does not eliminate suspicion, so corroborate
    with the other questions in this playbook (permission/manifest context -> account enumeration -> root/jailbreak
    posture -> small post-discovery egress).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=mdm source=\"MDM device posture\"\n| where attestation=\"failed\" OR root_detected=true\
      \ OR jailbreak_detected=true OR tamper_alert=true\n| join device_id [ search index=mobile api IN\
      \ (\"AccountManager.getAccounts\",\"SecItemCopyMatching\")\n    | where app_has_elevated_entitlement!=\"\
      true\" ]\n| eval severity=\"critical\"\n| table device_id, package_name, attestation, root_detected,\
      \ _time"
- question: '[Collection] Baseline account-store query frequency: have you determined whether baseline
    account-store query frequency is warranted on managed mobile devices, using the Statistical Method
    approach described, to answer the intelligence requirement — Is an adversary gathering account information
    from the mobile device to support data collection or exfiltration? (TA0035 - Collection)'
  context: 'Tactic relevance (Collection): Is an adversary gathering account information from the mobile
    device to support data collection or exfiltration? (TA0035 - Collection) This question operationalizes
    a Statistical Method detection for MITRE ATT&CK T1636.005 (Accounts) on Android/iOS. Establish per-application
    and per-device baselines for how often account APIs are queried during normal use and the device-feature
    footprint (CPU, syscalls, network bytes/packets) that accompanies them ([Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x)).
    Flag background or repeated polling that exceeds the 95th percentile or >3 standard deviations (or
    robust modified-Z |score|>3.5) for the app family, especially when multiple account types are queried
    in rapid succession. Derive thresholds per dataset from a 2-4 week clean baseline. A positive result
    indicates an app or process is enumerating device accounts in a manner inconsistent with its legitimate
    function and/or staging the results for exfiltration; a negative result reduces but does not eliminate
    suspicion, so corroborate with the other questions in this playbook (permission/manifest context ->
    account enumeration -> root/jailbreak posture -> small post-discovery egress).'
  answer_sources: *id001
  range: Last 90 days (use a 2-4 week clean baseline to derive per-app/per-device thresholds)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=mobile source=MobileEDR.APIMonitoringLogs api IN (\"AccountManager.getAccounts\",\n\
      \    \"AccountManager.getAccountsByType\",\"SecItemCopyMatching\")\n| bin _time span=1h\n| stats\
      \ count as qcount dc(account_type) as types by package_name, device_id, _time\n| eventstats avg(qcount)\
      \ as mu stdev(qcount) as sd perc95(qcount) as p95 by package_name\n| eval mz=0.6745*(qcount-mu)/sd\n\
      | where qcount>p95 OR abs(mz)>3.5 OR types>=3\n| eval severity=if(foreground=\"false\",\"high\"\
      ,\"medium\")"
- question: '[Collection] Detect post-discovery exfiltration in flow telemetry: have you determined whether
    detect post-discovery exfiltration in flow telemetry is warranted on managed mobile devices, using
    the Statistical Method approach described, to answer the intelligence requirement — Is an adversary
    gathering account information from the mobile device to support data collection or exfiltration? (TA0035
    - Collection)'
  context: 'Tactic relevance (Collection): Is an adversary gathering account information from the mobile
    device to support data collection or exfiltration? (TA0035 - Collection) This question operationalizes
    a Statistical Method detection for MITRE ATT&CK T1636.005 (Accounts) on Android/iOS. On first-party
    flow logs (Zeek conn.log / NetFlow) profile per-app egress Volume (bytes out), Frequency (connections/min),
    and State (success/fail) and alert on small, anomalous outbound bursts shortly after account enumeration,
    using flow-only features (byte/packet counts, durations, inter-arrival, directional ratios) shown
    to discriminate exfiltrating mobile spyware ([CorrNetDroid](https://arxiv.org/abs/2503.01396)). Derive
    dataset-specific thresholds from labeled mobile flow ground truth ([CICAndMal2017](https://www.unb.ca/cic/datasets/andmal2017.html)).
    A positive result indicates an app or process is enumerating device accounts in a manner inconsistent
    with its legitimate function and/or staging the results for exfiltration; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (permission/manifest
    context -> account enumeration -> root/jailbreak posture -> small post-discovery egress).'
  answer_sources: *id001
  range: Last 90 days (use a 2-4 week clean baseline to derive per-app/per-device thresholds)
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'read conn.log where src_ip IN MOBILE_CIDR

      | bin _time span=5m | stats sum(orig_bytes) as vol count as conns by src_ip, app, _time

      | eventstats perc95(vol) as p95v perc95(conns) as p95c by app

      | join src_ip,_time [ account_enum_events within 15m ]

      | where enum_seen=true AND (vol<2048 AND conns>p95c) OR vol>p95v

      | eval severity="high" | table src_ip, app, vol, conns, dest_ip'
- question: '[Collection] Score permission rarity and profile failure modes: have you determined whether
    score permission rarity and profile failure modes is warranted on managed mobile devices, using the
    Statistical Method approach described, to answer the intelligence requirement — Is an adversary gathering
    account information from the mobile device to support data collection or exfiltration? (TA0035 - Collection)'
  context: 'Tactic relevance (Collection): Is an adversary gathering account information from the mobile
    device to support data collection or exfiltration? (TA0035 - Collection) This question operationalizes
    a Statistical Method detection for MITRE ATT&CK T1636.005 (Accounts) on Android/iOS. Compute permission-prevalence/rarity
    scores across the fleet and elevate apps requesting rarely-needed high-privilege account permissions
    such as GET_ACCOUNTS/MANAGE_ACCOUNTS ([SigPID](https://arxiv.org/pdf/2103.00643)). Explicitly profile
    failure modes as distinct signals: denied account reads (SecurityException / missing GET_ACCOUNTS
    grant), empty or partial account lists, and failed/aborted egress connections indicate probing on
    locked-down or non-rooted devices. A positive result indicates an app or process is enumerating device
    accounts in a manner inconsistent with its legitimate function and/or staging the results for exfiltration;
    a negative result reduces but does not eliminate suspicion, so corroborate with the other questions
    in this playbook (permission/manifest context -> account enumeration -> root/jailbreak posture ->
    small post-discovery egress).'
  answer_sources: *id001
  range: Last 90 days (use a 2-4 week clean baseline to derive per-app/per-device thresholds)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=mobile source=UEM.AppInventoryLogs\n| stats dc(device_id) as installs by package_name,\
      \ permission\n| eventstats dc(device_id) as fleet\n| eval rarity=1-(installs/fleet)\n| where permission\
      \ IN (\"android.permission.GET_ACCOUNTS\",\"android.permission.MANAGE_ACCOUNTS\")\n    AND rarity>0.95\n\
      | append [ search index=mobile (result=\"SecurityException\" OR account_list=\"empty\"\n    OR conn_state\
      \ IN (\"S0\",\"REJ\",\"RSTO\")) ]\n| eval severity=\"medium\" | table package_name, permission,\
      \ rarity, result, conn_state"
- question: '[Collection] Classify suspicious account discovery behavior: have you determined whether
    classify suspicious account discovery behavior is warranted on managed mobile devices, using the Machine
    Learning approach described, to answer the intelligence requirement — Is an adversary gathering account
    information from the mobile device to support data collection or exfiltration? (TA0035 - Collection)'
  context: 'Tactic relevance (Collection): Is an adversary gathering account information from the mobile
    device to support data collection or exfiltration? (TA0035 - Collection) This question operationalizes
    a Machine Learning detection for MITRE ATT&CK T1636.005 (Accounts) on Android/iOS. Train a supervised
    classifier over static permission/API/component features (including account-enumeration APIs) and
    runtime context (app category, foreground state, execution time, account types queried, subsequent
    network behavior) to distinguish routine account discovery from intent-mismatch scenarios ([DREBIN](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf);
    [SigPID](https://arxiv.org/pdf/2103.00643)). Surface the top-3 contributing features (e.g., the specific
    permission/API and destination) in alert text via gradient-based explanation ([Explaining Black-box](https://arxiv.org/pdf/1803.03544)).
    Validate with time-ordered splits and retrain on drift ([TESSERACT](https://www.usenix.org/system/files/sec19-pendlebury.pdf)).
    A positive result indicates an app or process is enumerating device accounts in a manner inconsistent
    with its legitimate function and/or staging the results for exfiltration; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (permission/manifest
    context -> account enumeration -> root/jailbreak posture -> small post-discovery egress).'
  answer_sources: *id001
  range: Last 90 days (use a 2-4 week clean baseline to derive per-app/per-device thresholds)
  queries:
  - technology: ML/pseudocode
    query: "features = [account_enum_apis, declared_perms, components, app_category,\n            foreground_state,\
      \ exec_time, account_types_queried, post_net_behavior]\np = SupervisedClassifier.predict_proba(features)[malicious]\n\
      if p > 0.90:\n    raise_incident(severity=\"high\",\n        top3=gradient_attribution(features)[:3])\
      \  # time-ordered split; retrain on drift"
- question: '[Collection] Flag anomalous post-enumeration egress with unsupervised models: have you determined
    whether flag anomalous post-enumeration egress with unsupervised models is warranted on managed mobile
    devices, using the Machine Learning approach described, to answer the intelligence requirement — Is
    an adversary gathering account information from the mobile device to support data collection or exfiltration?
    (TA0035 - Collection)'
  context: 'Tactic relevance (Collection): Is an adversary gathering account information from the mobile
    device to support data collection or exfiltration? (TA0035 - Collection) This question operationalizes
    a Machine Learning detection for MITRE ATT&CK T1636.005 (Accounts) on Android/iOS. Train one-class/unsupervised
    models (Isolation Forest, autoencoder, OC-SVM) only on benign per-app flow to flag novel post-discovery
    exfiltration as outliers without labeled mobile malware ([IoT One-Class](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/)),
    and use semi-supervised encrypted-traffic fingerprinting to flag egress matching no known app fingerprint
    ([FlowPrint](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24412-paper.pdf)). Report the
    top contributing flow features (bytes out, destination novelty, connection count) with each alert.
    A positive result indicates an app or process is enumerating device accounts in a manner inconsistent
    with its legitimate function and/or staging the results for exfiltration; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (permission/manifest
    context -> account enumeration -> root/jailbreak posture -> small post-discovery egress).'
  answer_sources: *id001
  range: Last 90 days (use a 2-4 week clean baseline to derive per-app/per-device thresholds)
  queries:
  - technology: ML/pseudocode
    query: "X = per_app_flow_features(orig_bytes, resp_bytes, duration,\n        conn_count, dest_novelty,\
      \ byte_ratio)  # benign-only training\nscore = IsolationForest.score(X)\nfp = FlowPrint.match(encrypted_flow)\n\
      if score in top_1_percent or fp is None:\n    raise_alert(top3=feature_contributions(X)[:3])"
