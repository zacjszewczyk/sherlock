name: 'T1616: Call Control'
id: be5463d4-679e-4bf2-bedb-fd241f869b3a
description: Investigate potential unauthorized Call Control on managed Android devices, where an application
  makes, answers, forwards, blocks, redirects, or conceals phone calls without user authorization. This
  playbook helps an analyst determine whether an adversary is (1) disrupting communications by programmatically
  blocking or redirecting legitimate outgoing calls (Impact), (2) performing audio surveillance by answering,
  initiating, recording, and hiding calls (Collection), or (3) abusing automated phone calls as a covert
  command-and-control channel. It correlates high-risk call-control manifest permissions and telecom role
  changes from UEM/MDM app inventories, Android Logcat telephony broadcasts (NEW_OUTGOING_CALL / abortBroadcast),
  Mobile EDR OS-API and call-log file-modification telemetry, carrier Call Detail Records (CDRs), on-device
  call logs, and network logs (Zeek conn.log/dns.log) to surface call-control abuse via deterministic
  rules, statistical baselining, and machine-learning behavioral models.
type: technique
related:
- tactic_id: TA0034
  tactic_name: Impact
- tactic_id: TA0035
  tactic_name: Collection
- tactic_id: TA0037
  tactic_name: Command And Control
