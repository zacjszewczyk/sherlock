questions:
- question: Does any installed application that is NOT on the approved-communications allowlist hold high-risk
    call-control permissions such as PROCESS_OUTGOING_CALLS, ANSWER_PHONE_CALLS, CALL_PHONE, MANAGE_OWN_CALLS,
    or WRITE_CALL_LOG?
  context: In the Impact context, an adversary can disrupt communications by silently blocking or redirecting
    outgoing calls; the prerequisite is an app holding dangerous call-control permissions. Query the UEM
    platform for installed package names and granted permissions and LEFT JOIN against an allowlist of
    vetted communication apps (native dialer, approved VoIP/UC clients). Any non-allowlisted app holding
    these permissions is suspect. These manifest permissions plus the android.intent.action.NEW_OUTGOING_CALL
    filtered intent are the exact discriminative features from DREBIN; treat the permission set as a deterministic
    hard floor and tune only the allowlist. A positive result means an unvetted app can control calls
    and warrants immediate app review/quarantine.
  answer_sources:
  - UEM.AppInventoryLogs
  - Android.ManifestFiles
  - 'NAI: Unified Endpoint Management (UEM) platform; Mobile Application Management (MAM) server; Application
    vetting and sandboxing environment.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "apps = uem_app_inventory | join manifest_permissions on package_name;\nalert apps where package_name\
      \ NOT IN approved_comms_allowlist\n  AND permission IN ['PROCESS_OUTGOING_CALLS','ANSWER_PHONE_CALLS','CALL_PHONE','MANAGE_OWN_CALLS','WRITE_CALL_LOG'];\n\
      output device_id, package_name, granted_permissions"
- question: When call-control permissions are weighted and summed per app, which applications exceed the
    98th percentile of permission-risk for their store category?
  context: 'Rather than a binary allowlist check, score the severity of an app''s call-control capability
    so analysts can prioritize the riskiest outliers that could be used to block or hijack calls. Assign
    weights to high-risk call-control permissions (PROCESS_OUTGOING_CALLS: 10, ANSWER_PHONE_CALLS: 10,
    MANAGE_OWN_CALLS: 8, WRITE_CALL_LOG: 5), sum per app, group by store category, and flag apps above
    the 98th percentile for their category. Restrict scoring to the small high-signal permission subset
    shown to retain accuracy in ''Identification of Significant Permissions for Efficient Android Malware
    Detection'' to reduce noise, and derive category thresholds from your own fleet inventory rather than
    fixed cutoffs.'
  answer_sources:
  - UEM.AppInventoryLogs
  - Android.ManifestFiles
  - 'NAI: Unified Endpoint Management (UEM) platform; Mobile Application Management (MAM) server; Application
    vetting and sandboxing environment.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'weights = {PROCESS_OUTGOING_CALLS:10, ANSWER_PHONE_CALLS:10, MANAGE_OWN_CALLS:8, WRITE_CALL_LOG:5};

      per app: score = sum(weights[p] for p in granted_permissions);

      per store_category: thr = percentile(score, 98);

      alert apps where score > thr; output package_name, category, score'
- question: Does a supervised classifier flag any newly installed application's manifest as malicious
    (score > 0.85), and which permissions/components drove that decision?
  context: Static allowlists miss novel or repackaged malware; a supervised model generalizes from labeled
    benign/malicious manifests to catch new call-control abuse. Train a Random Forest on multi-hot permissions,
    total/call-permission counts, and categorical declared services and broadcast receivers (per DREBIN
    and the significant-permissions work). Flag newly installed apps scoring above 0.85 and, per SHAP,
    attach the top-3 contributing features (e.g., PROCESS_OUTGOING_CALLS, declared ConnectionService,
    WRITE_CALL_LOG) so analysts see why it fired, not just the score. A high score on a new install in
    the Impact context signals a likely call-blocking/redirecting capability.
  answer_sources:
  - UEM.AppInventoryLogs
  - Android.ManifestFiles
  - 'NAI: Unified Endpoint Management (UEM) platform; Mobile Application Management (MAM) server; Application
    vetting and sandboxing environment.'
  range: Last 90 days
  queries:
  - technology: Python/ML pseudocode
    query: 'X = features(manifest: multihot_permissions, call_perm_count, total_perm_count, services,
      receivers);

      score = random_forest.predict_proba(X)[malicious];

      alert where install_is_new AND score > 0.85;

      explain = shap_top_k(model, X, k=3); output package_name, score, explain'
- question: Do an app's runtime telephony API call sequences deviate from a benign behavioral baseline,
    indicating call-control abuse that static permissions miss?
  context: Adversaries can hide call-control behavior behind reflection or dynamic feature injection that
    no manifest permission reveals; behavioral modeling catches the runtime effect. Build per-app Markov
    chains over API calls abstracted to package/family states (MaMaDroid) and flag apps whose transition
    probabilities into android.telephony / android.telecom / ConnectionService states deviate from a benign
    baseline. In the Impact context this surfaces apps programmatically driving call placement/blocking.
    A statistically deviant transition profile is a strong behavioral indicator warranting deeper review.
  answer_sources:
  - UEM.AppInventoryLogs
  - Android.ManifestFiles
  - 'NAI: Unified Endpoint Management (UEM) platform; Mobile Application Management (MAM) server; Application
    vetting and sandboxing environment.'
  range: Last 90 days
  queries:
  - technology: Mobile EDR/ML pseudocode
    query: 'states = abstract_api_calls_to_packages(edr_api_telemetry per app);

      M = markov_transition_matrix(states);

      score = divergence(M, benign_baseline_M) on telephony/telecom/ConnectionService states;

      alert where score > threshold; output package_name, deviant_transitions'
- question: On any device, is a NEW_OUTGOING_CALL broadcast intent followed within 1 second by an abortBroadcast()
    call from a non-allowlisted third-party package, indicating a programmatically blocked outgoing call?
  context: This is the direct fingerprint of an app silently cancelling a user's outgoing call (Impact).
    Implement a SIEM correlation rule that triggers when a Telephony event with ACTION_NEW_OUTGOING_CALL
    is followed within 1 second by an abortBroadcast() event from the same device process_id, firing only
    when the abort source package is not on an allowlist of system/approved telephony packages. Keep this
    deterministic 1-second window as a hard floor. A match means a third-party app is intercepting and
    killing outbound calls -- a high-confidence disruption indicator.
  answer_sources:
  - Android Logcat
  - 'NAI: Centralized log aggregator (SIEM) collecting real-time Logcat streams from managed devices;
    Endpoint Detection and Response (EDR) for Mobile platform.'
  range: Last 90 days, with event-centered correlation on a 1-second window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "logcat | where event=='NEW_OUTGOING_CALL' as A\n  join logcat where method=='abortBroadcast'\
      \ as B\n  on A.device_id==B.device_id AND A.process_id==B.process_id\n  AND B.ts - A.ts <= 1s;\n\
      alert where B.package NOT IN system_telephony_allowlist;\noutput device_id, package, A.ts, B.ts"
- question: Per device, has the rate or ratio of aborted/blocked outgoing calls from non-system packages
    shifted abruptly above its 30-day baseline?
  context: 'A sudden regime change in call-abort behavior can reveal the onset of a call-blocking campaign
    even if individual aborts look benign. Treat aborted outgoing calls and failed/blocked call attempts
    as a distinct failure-mode signal: per device, track abortBroadcast count and abort-to-call ratio
    from non-system packages with a 30-day rolling mean and standard deviation, and apply change-point
    detection (CUSUM/PELT/Bayesian online CPD) to flag abrupt upward regime shifts. Alert when the ratio
    exceeds baseline by 3 standard deviations or the daily fleet 95th percentile. A positive result indicates
    newly active call-disruption behavior on that device.'
  answer_sources:
  - Android Logcat
  - 'NAI: Centralized log aggregator (SIEM) collecting real-time Logcat streams from managed devices;
    Endpoint Detection and Response (EDR) for Mobile platform.'
  range: Last 90 days, 30-day rolling baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per device, daily: abort_ratio = abortBroadcast_count(non_system) / outgoing_call_count;

      mean,std = rolling_30d(abort_ratio);

      cp = changepoint(abort_ratio series, method=CUSUM|PELT);

      alert where abort_ratio > mean+3*std OR abort_ratio > fleet_p95 OR cp detected'
- question: Across the fleet, is there an anomalous spike in abortBroadcast() events per minute beyond
    learned daily/weekly seasonality, and which devices/packages drive it?
  context: A coordinated or malware-driven call-blocking event may show up as a fleet-wide surge that
    per-device baselines miss. Apply robust Seasonal-Hybrid ESD to the fleet-wide count of abortBroadcast()
    events per minute, training on >=30 days to learn daily/weekly seasonality so business-hours peaks
    are not flagged. On a significant spike, surface the top contributing devices and source packages
    so the output is explainable rather than a bare anomaly score. A confirmed spike concentrated on a
    few packages points to a deployed call-disruption capability.
  answer_sources:
  - Android Logcat
  - 'NAI: Centralized log aggregator (SIEM) collecting real-time Logcat streams from managed devices;
    Endpoint Detection and Response (EDR) for Mobile platform.'
  range: Last 90 days, >=30 days training for seasonality.
  queries:
  - technology: Python/ML pseudocode
    query: 'series = fleet_abortBroadcast_count_per_minute(last_90d);

      anoms = seasonal_hybrid_esd(series, period=daily, train>=30d);

      for spike in anoms: report top_contributing(devices, packages) within spike window'
- question: Does any non-allowlisted application declare the surveillance permission combination (CALL_PHONE
    OR ANSWER_PHONE_CALLS) AND RECORD_AUDIO AND (WRITE_CALL_LOG OR READ_CALL_LOG)?
  context: 'In the Collection context this exact co-occurrence is the signature of call-recording spyware:
    the ability to answer/place a call, capture audio, and read/cover its tracks in the call log. Trigger
    a high-priority alert when an app manifest contains (CALL_PHONE OR ANSWER_PHONE_CALLS) AND RECORD_AUDIO
    AND (WRITE_CALL_LOG OR READ_CALL_LOG) and the app is not on an allowlist of vetted recorders/UC tools.
    This high-signal permission combination is discriminative per DREBIN and the significant-permissions
    work; keep the rule as a deterministic floor and maintain only the exception list. A match means an
    app is positioned to perform audio surveillance of calls.'
  answer_sources:
  - UEM.AppInventoryLogs
  - Android.ManifestFiles
  - 'NAI: Unified Endpoint Management (UEM) platform; Mobile Application Management (MAM) server; Data
    warehouse containing application metadata and allowlists.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "alert apps where (CALL_PHONE OR ANSWER_PHONE_CALLS) IN perms\n  AND RECORD_AUDIO IN perms\n\
      \  AND (WRITE_CALL_LOG OR READ_CALL_LOG) IN perms\n  AND package_name NOT IN recorder_uc_allowlist;\n\
      output device_id, package_name, perms"
- question: When spyware-relevant permissions are weighted and summed, which apps exceed the 99th category
    percentile or a raw score above 20?
  context: 'Scoring lets analysts rank apps by surveillance potential rather than relying on a single
    permission combination. Assign weights to risky permissions (RECORD_AUDIO: 10, CALL_PHONE: 8, WRITE_CALL_LOG:
    5, READ_CONTACTS: 5, ACCESS_FINE_LOCATION: 5), sum per app, and alert above the 99th category percentile
    or a raw score above 20. Limit scoring to the reduced significant-permission subset to suppress benign
    high-permission apps, and derive thresholds from your own app population. A high score in the Collection
    context flags an app capable of broad audio/contact/location surveillance tied to calls.'
  answer_sources:
  - UEM.AppInventoryLogs
  - Android.ManifestFiles
  - 'NAI: Unified Endpoint Management (UEM) platform; Mobile Application Management (MAM) server; Data
    warehouse containing application metadata and allowlists.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'weights = {RECORD_AUDIO:10, CALL_PHONE:8, WRITE_CALL_LOG:5, READ_CONTACTS:5, ACCESS_FINE_LOCATION:5};

      per app: score = sum(weights[p] for p in perms);

      alert where score > percentile_by_category(99) OR score > 20'
- question: Do any apps fall into small dense clusters (or noise points) of rare permission profiles consistent
    with call-recording spyware?
  context: Unsupervised clustering reveals rare permission combinations that do not match known legitimate
    app types, catching novel spyware without prior labels. Encode each app as a multi-hot permission
    vector and run DBSCAN; small dense clusters and noise points not matching known legitimate app categories
    reveal rare permission combinations consistent with call-recording spyware. Report the cluster's defining
    permissions (e.g., RECORD_AUDIO+CALL_PHONE+WRITE_CALL_LOG) in the alert for explainability. In the
    Collection context, an outlier cluster sharing audio+telephony+call-log permissions is a strong surveillance
    lead.
  answer_sources:
  - UEM.AppInventoryLogs
  - Android.ManifestFiles
  - 'NAI: Unified Endpoint Management (UEM) platform; Mobile Application Management (MAM) server; Data
    warehouse containing application metadata and allowlists.'
  range: Last 90 days
  queries:
  - technology: Python/ML pseudocode
    query: 'V = multihot_permission_vectors(all_apps);

      labels = DBSCAN(eps, min_samples).fit(V);

      flag small_dense_clusters and noise points not matching legit app types;

      report defining_permissions per flagged cluster'
- question: Do any apps interleave audio-recording API calls with telephony call-state API calls in background
    context, indicating programmatic answer-and-record surveillance?
  context: Spyware may obtain audio of calls through runtime API orchestration that static permission
    presence alone cannot prove. Use Markov-chain behavioral models (MaMaDroid) to flag apps that interleave
    android.media audio-record API states with android.telephony call states in background context, signaturing
    programmatic answer-and-record surveillance. In the Collection context, a transition profile that
    couples call answering/placement with audio capture while the app is backgrounded is a high-confidence
    indicator of covert call recording.
  answer_sources:
  - UEM.AppInventoryLogs
  - Android.ManifestFiles
  - 'NAI: Unified Endpoint Management (UEM) platform; Mobile Application Management (MAM) server; Data
    warehouse containing application metadata and allowlists.'
  range: Last 90 days
  queries:
  - technology: Mobile EDR/ML pseudocode
    query: "states = abstract_api_calls(edr_api_telemetry per app);\nM = markov_transition_matrix(states);\n\
      alert apps where M shows interleaving of android.media(record) <-> android.telephony(call)\n  AND\
      \ foreground_context == background; output package_name, sequence"
- question: Are there call records present in carrier CDRs that are absent from the UEM-polled on-device
    call log for the same device and time window, indicating a concealed/hidden call?
  context: Carrier CDRs are ground truth that cannot be tampered from the device, so a call in the CDR
    missing from the device log proves call-log hiding -- a hallmark of surveillance. Run a daily LEFT
    JOIN from the carrier CDR table to the UEM-polled device call-log table on device_identifier, call_timestamp
    (+/-5s), and destination_or_source_number; alert on any CDR record absent from device logs. This deterministic
    CDR-vs-device reconciliation is the floor. A positive result means a call occurred but was hidden
    on the device, strongly implicating WRITE_CALL_LOG abuse for concealment.
  answer_sources:
  - Carrier.CDRs
  - UEM.DeviceCallLogs
  - 'NAI: Data warehouse or SIEM containing both ingested telecom provider CDR feeds and UEM-polled device
    call logs; Telecom Expense Management (TEM) platform.'
  range: Last 90 days, daily reconciliation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "cdr LEFT JOIN device_log\n  ON device_identifier AND abs(call_timestamp_diff)<=5s AND number_match;\n\
      alert where device_log.record IS NULL;  -- CDR call hidden on device\noutput device_id, cdr_timestamp,\
      \ number"
- question: Per device, has the Jaccard similarity between carrier CDR call sets and on-device call-log
    sets dropped below baseline (fleet 10th percentile or 0.95)?
  context: A gradual or sudden divergence between CDR and device logs quantifies how much call history
    is being hidden over time. Per device over a rolling 24-hour window, build record sets from CDRs and
    device logs as tuples (normalized_number, timestamp_rounded_to_minute), compute Jaccard similarity,
    and alert when it drops below a dynamic baseline (fleet 10th percentile) or below 0.95. Apply change-point
    detection to the daily similarity series to catch the abrupt drop when log-hiding begins. In the Collection
    context, a falling similarity score is direct evidence of call concealment.
  answer_sources:
  - Carrier.CDRs
  - UEM.DeviceCallLogs
  - 'NAI: Data warehouse or SIEM containing both ingested telecom provider CDR feeds and UEM-polled device
    call logs; Telecom Expense Management (TEM) platform.'
  range: Last 90 days, rolling 24-hour windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per device, 24h: A=set(cdr tuples), B=set(device_log tuples);

      J = |A∩B| / |A∪B|;

      alert where J < min(fleet_p10, 0.95);

      cp = changepoint(daily J series)'
- question: Which users' actual on-device call-log volume falls below the 5th percentile of the volume
    predicted from their CDR count and behavioral features?
  context: Modeling expected device-log volume detects suppressed call history even when no single call
    can be matched one-to-one. Train a Gradient Boosting Regressor to predict expected device-log entries
    per 24h from CDR count, department, historical volume, and time of day (telecom CDR features); flag
    users whose actual device-log count falls below the 5th percentile of the prediction interval. Per
    SHAP, surface the top-3 drivers (e.g., CDR-count gap, prior-day baseline). In the Collection context,
    a device logging far fewer calls than predicted indicates systematic concealment of surveillance calls.
  answer_sources:
  - Carrier.CDRs
  - UEM.DeviceCallLogs
  - 'NAI: Data warehouse or SIEM containing both ingested telecom provider CDR feeds and UEM-polled device
    call logs; Telecom Expense Management (TEM) platform.'
  range: Last 90 days
  queries:
  - technology: Python/ML pseudocode
    query: 'X = [cdr_count_24h, department, hist_volume, time_of_day];

      pred = gbr.predict(X); lo = pred_interval_p5;

      alert where actual_device_log_count < lo;

      explain = shap_top_k(model, X, 3)'
- question: Does any single device make more than five short-duration (<5s) outgoing calls to the same
    destination number within a 1-hour period, excluding known automated service numbers?
  context: Repeated very short calls to the same number are uncharacteristic of human behavior and can
    be a crude C2 signaling pattern. Alert when a single device makes more than five outgoing calls of
    duration <5 seconds to the same destination_number within a 1-hour period, excluding known automated
    service numbers via an allowlist. Keep this deterministic volume/duration threshold as a hard floor
    and tune counts per environment. A match in the Command-and-Control context suggests the device is
    using telephony to ping or signal an adversary endpoint.
  answer_sources:
  - Carrier.CDRs
  - 'NAI: Telecom provider data feeds ingested into a central SIEM or data lake; Telecom Expense Management
    (TEM) platform.'
  range: Last 90 days, 1-hour windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "cdr | where direction=='outgoing' AND duration<5s AND dest NOT IN automated_allowlist\n  |\
      \ bin 1h, group by device_id, dest\n  | alert where count > 5; output device_id, dest, count"
- question: Which devices show high short-call volume combined with low entropy (low diversity) of destination
    numbers, matching a machine-dialing signature?
  context: Automated dialing concentrates on a few numbers, producing high call counts with low destination
    entropy -- the telecom-fraud machine signature. Per device over 24h, filter calls under 5 seconds
    and compute Shannon entropy of unique destination numbers plus the short-call count and short-call
    ratio; alert on devices in the top 5% for short-call count and bottom 5% for destination entropy.
    In the C2 context, low destination diversity with high short-call volume points to programmatic beaconing
    rather than human calling.
  answer_sources:
  - Carrier.CDRs
  - 'NAI: Telecom provider data feeds ingested into a central SIEM or data lake; Telecom Expense Management
    (TEM) platform.'
  range: Last 90 days, 24-hour windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per device, 24h: short=calls(duration<5s);

      H = shannon_entropy(short.dest_numbers); cnt=count(short);

      alert where cnt in top5% AND H in bottom5%'
- question: For each (device, destination) pair, is there a strong dominant periodicity in inter-call-arrival
    times inconsistent with human behavior, indicating call beaconing?
  context: Beaconing C2 calls at regular intervals; spectral analysis exposes this even with jitter. For
    each (device, destination) pair build the inter-call-arrival time series and extract dominant periodicity
    via FFT with autocorrelation confirmation, tolerating jitter (per BAYWATCH); alert on a strong dominant
    period inconsistent with human behavior. Rank candidates and suppress benign automated numbers via
    whitelist. A confirmed periodic cadence in the C2 context is a high-confidence indicator of telephony-based
    beaconing.
  answer_sources:
  - Carrier.CDRs
  - 'NAI: Telecom provider data feeds ingested into a central SIEM or data lake; Telecom Expense Management
    (TEM) platform.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per (device,dest): t = inter_call_arrival_series;

      period, power = FFT_dominant(t); confirm via autocorrelation (jitter-tolerant);

      alert where power high AND period inconsistent_with_human AND dest NOT IN whitelist'
- question: Do inter-arrival timing features between short calls to the same number form tight, low-variance
    clusters indicative of periodic machine-like beaconing?
  context: Clustering inter-arrival statistics groups machine-regular calling patterns separately from
    bursty human behavior. Extract inter-arrival features (mean, variance, coefficient of variation) between
    short calls to the same number and cluster with K-Means; tight low-variance clusters indicate periodic
    machine-like beaconing. Report the measured period and CV in the alert for explainability, complementing
    the FFT periodicity score from BAYWATCH. In the C2 context, a low-CV cluster of repeated short calls
    is strong evidence of automated signaling.
  answer_sources:
  - Carrier.CDRs
  - 'NAI: Telecom provider data feeds ingested into a central SIEM or data lake; Telecom Expense Management
    (TEM) platform.'
  range: Last 90 days
  queries:
  - technology: Python/ML pseudocode
    query: 'feats = per (device,dest): [mean,var,cv] of inter_arrival(short_calls);

      labels = KMeans(k).fit(feats);

      flag tight low-variance/low-CV clusters; report period, CV'
- question: After a short-duration outgoing call, does the device make an outbound network connection
    (Zeek conn.log/dns.log) within ~10 seconds to a destination matching threat-intel C2?
  context: 'A call-then-connect handoff suggests the call triggers or signals follow-on C2 over IP. On
    a CDR entry with call duration <5 seconds, search Zeek conn.log/dns.log for flows from the device''s
    last-known IP within 10 seconds of call end and alert if the destination IP or resolved domain matches
    threat-intel C2. Score the subsequent flows with first-party Zeek beacon metrics (RITA: inter-arrival
    CV, rare destination) to confirm a machine handoff rather than user browsing. A confirmed call-to-C2
    sequence is a strong command-and-control indicator.'
  answer_sources:
  - Carrier.CDRs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: SIEM or data lake with correlation capabilities, ingesting logs from telecom providers (CDRs)
    and network infrastructure (Zeek sensors on Wi-Fi controllers, VPN concentrators, and internet gateways).'
  range: Last 90 days, event-centered 10-second correlation.
  queries:
  - technology: Zeek/SIEM correlation pseudocode
    query: "for cdr where duration<5s:\n  flows = zeek_conn/dns from device_ip within 10s after call_end;\n\
      \  alert where flows.dest_ip OR resolved_domain IN threat_intel_c2;\n  enrich with rita_beacon_score(flows)"
- question: Per device, do short-call end times and new outbound network connection start times show significant
    cross-correlation at small positive lags (1-10s)?
  context: Cross-correlation statistically tests whether calls systematically precede network connections,
    distinguishing C2 handoff from coincidence. Per device, build two 1-second-resolution binary series
    over 24h (A = short-call end times from CDRs; B = new outbound connections from Zeek conn.log), compute
    the cross-correlation function, and alert on significant correlation peaks at small positive lags
    (1-10s). Pair with RITA/BAYWATCH cadence scoring on Series B to distinguish periodic C2 from incidental
    traffic, and profile failed/blocked outbound connections (NXDOMAIN, blocked conns) following short
    calls as a distinct signal. A significant lagged peak supports a telephony-triggered C2 channel.
  answer_sources:
  - Carrier.CDRs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: SIEM or data lake with correlation capabilities, ingesting logs from telecom providers (CDRs)
    and network infrastructure (Zeek sensors on Wi-Fi controllers, VPN concentrators, and internet gateways).'
  range: Last 90 days, 24-hour windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'A = binary_series(short_call_end_times, res=1s, 24h);

      B = binary_series(new_outbound_conn_starts, res=1s, 24h);

      xcorr = cross_correlation(A,B);

      alert where significant peak at lag in [1,10]s;

      also profile NXDOMAIN/blocked conns after short calls'
- question: Within a fused per-device CDR+Zeek event stream, do frequent sequential patterns like (short_call_end
    -> dns_query_for_rare_domain -> tcp_connection_start) occur within a 30-second window?
  context: Sequential pattern mining discovers the recurring multi-step call-to-network behavior that
    defines a telephony-triggered C2 workflow. Fuse CDR and Zeek events into a per-device time-ordered
    stream and apply PrefixSpan to discover frequent sequences within a 30-second window; search for (short_call_end
    -> dns_query_for_rare_domain -> tcp_connection_start) and prioritize by support and confidence, reporting
