name: 'T1471: Data Encrypted for Impact'
id: 38dd7588-af2a-4ad0-8acf-f30025a77812
description: 'Investigate whether an adversary is encrypting data on corporate mobile devices (primarily
  Android) for impact — ransomware or destructive wiping where decryption keys are never saved. This playbook
  helps an analyst hunt for the behavioral signature of encrypt-for-impact activity: a single application
  process performing abnormal bursts of file write/rename operations across user data directories, transforming
  many file types into a uniform encrypted extension with high-entropy content, and triggering permission-denied
  error bursts from aggressive directory enumeration. It also covers ransom-note creation and Android
  locker primitives (DevicePolicyManager.lockNow/resetPassword, persistent SYSTEM_ALERT_WINDOW overlays,
  device-admin activation), post-encryption command-and-control network behavior (ransomware C2 intel
  hits, newly registered or high-entropy DGA domains, NXDOMAIN/SERVFAIL bursts), and attribution of the
  responsible app via MDM inventory (sideloaded/unmanaged status, rare permission sets, ransomware-like
  System-API package signatures). The guidance correlates capability state, app lifecycle, framework use,
  bulk file-write effects, and optional network communications to distinguish malicious encryption from
  benign bulk file operations such as sync, backup, media processing, or document editing.'
type: technique
related:
- tactic_id: TA0034
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a single mobile application process perform a rapid burst of uniform file renames — more
    than 20 renames in 60 seconds — converting user-owned file types (.jpg, .png, .doc, .pdf, .mov) to
    a single uniform new extension such as .crypted?
  context: 'This is the core deterministic ransomware indicator under the Impact tactic: a file-type change
    combined with file-type funneling (many distinct types read, one type written) from a single process
    in a tight time window. Per CryptoLock (Scaife et al.), this pattern reliably separates ransomware
    from benign bulk operations. A positive result — many original-extension files renamed to one uniform
    encrypted extension — is high-confidence evidence of encrypt-for-impact and should be treated as critical.
    A negative result lowers but does not eliminate suspicion, since some ransomware overwrites in place
    rather than renaming.'
  answer_sources:
  - MobileEDR.FileEvents
  - MobileEDR.ProcessEvents
  - MDM.ApplicationLogs
  - 'NAI: User data directories on managed mobile devices, including Android standard directories (e.g.,
    /storage/emulated/0/DCIM, /storage/emulated/0/Documents) and iOS App Sandbox container directories.'
  range: 'Last 90 days (event-centered: pivot ±10 minutes around the first rename burst)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM MobileEDR.FileEvents WHERE op IN ('rename','move')\n  AND old_ext IN ('jpg','png','doc','pdf','mov',...)\n\
      GROUP BY process_id, new_ext OVER sliding_window(60s)\nWHERE count(*) > 20 AND distinct(new_ext)=1\
      \ AND distinct(old_ext)>3\n=> ALERT severity=critical 'uniform rename burst / file-type funnel'"
- question: Does the responsible application's current rate of file writes/renames per minute, folder-listing
    rate, fraction of the directory tree touched, and file-type funnel ratio exceed its own 30-day baseline
    (99th percentile) or its app category's baseline (95th percentile)?
  context: Under the Impact tactic, ransomware diverges sharply from an app's normal filesystem behavior.
    Maintaining per-app baselines of these features (per ShieldFS, Continella et al.) lets the analyst
    flag statistically anomalous bursts even when no single hard threshold is crossed. A positive result
    is an app operating far outside its historical envelope across multiple correlated features — strong
    evidence of bulk destructive transformation. Benign explanations (a one-off backup or media import)
    usually move fewer features and stay within category norms.
  answer_sources:
  - MobileEDR.FileEvents
  - MobileEDR.ProcessEvents
  - MDM.ApplicationLogs
  - 'NAI: User data directories on managed mobile devices, including Android standard directories (e.g.,
    /storage/emulated/0/DCIM, /storage/emulated/0/Documents) and iOS App Sandbox container directories.'
  range: Last 90 days (compare against 30-day rolling per-app baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = rolling_stats(MobileEDR.FileEvents, by=app, window=30d,\n  metrics=[writes_per_min,\
      \ listings_per_min, dir_tree_fraction, funnel_ratio])\nFOR each app, window(5m): current = compute(metrics)\n\
      WHERE current > baseline.p99(app) OR current > baseline.p95(category)\n=> ALERT 'anomalous filesystem\
      \ burst vs baseline'"
- question: For files written during a suspected burst, do multi-statistic content tests (chi-square,
    arithmetic mean, serial-correlation) — not Shannon entropy alone — indicate true encryption rather
    than legitimately high-entropy formats like JPEG, ZIP, or DOCX?
  context: Entropy alone produces false positives because compressed/media files are already high-entropy.
    Under the Impact tactic, confirming actual encryption matters before escalating. Computing chi-square,
    arithmetic mean, and serial-correlation with file-type-aware and header-fragment thresholds (per Davies
    et al. and the Cryptographic Ransomware Encryption Detection survey) distinguishes ciphertext from
    benign high-entropy content. A positive result — content statistically consistent with encryption
    across multiple tests and inconsistent with the file's declared type/header — strongly confirms encrypt-for-impact.
  answer_sources:
  - MobileEDR.FileEvents
  - MobileEDR.ProcessEvents
  - MDM.ApplicationLogs
  - 'NAI: User data directories on managed mobile devices, including Android standard directories (e.g.,
    /storage/emulated/0/DCIM, /storage/emulated/0/Documents) and iOS App Sandbox container directories.'
  range: Last 90 days (event-centered on burst-written files)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR file IN burst_written_files:\n  chi=chi_square(bytes); mean=arith_mean(bytes); sc=serial_corr(bytes)\n\
      \  hdr=header_matches_declared_type(file)\nWHERE chi within encrypted_band AND abs(mean-127.5)<thr\n\
      \  AND abs(sc)<thr AND NOT hdr\n=> CONFIRM 'content consistent with encryption'"
- question: Is the responsible process generating a spike of permission-denied (EACCES) file-open errors
    — for example more than 50 denials per minute above baseline — concurrent with the write/rename burst?
  context: 'Aggressive directory enumeration by ransomware produces a distinct failure-mode signal: bursts
    of EACCES/permission-denied errors as the process walks the filesystem trying to open everything.
    Under the Impact tactic this State signal (per EldeRan, Sgandurra et al.) corroborates a write/rename
    burst even when the encryption itself is partial or evasive. A positive result — a denial spike coincident
    with the I/O burst — increases confidence that the process is indiscriminately enumerating user storage
    rather than touching a known set of files.'
  answer_sources:
  - MobileEDR.FileEvents
  - MobileEDR.ProcessEvents
  - MDM.ApplicationLogs
  - 'NAI: User data directories on managed mobile devices, including Android standard directories (e.g.,
    /storage/emulated/0/DCIM, /storage/emulated/0/Documents) and iOS App Sandbox container directories.'
  range: Last 90 days (correlate within ±5 minutes of the write/rename burst)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM MobileEDR.FileEvents WHERE op='open' AND result='EACCES'\nGROUP BY process_id OVER window(60s)\n\
      WHERE denials_per_min > baseline(process)+50\n  AND EXISTS write_rename_burst(process_id, same_window)\n\
      => ALERT 'permission-denied enumeration burst'"
- question: Does an explainable attention-based LSTM (plus a host-independent filesystem-feature detector)
    flag the app's file-operation sequence as ransomware-like early, and what are the top-3 contributing
    operations?
  context: Sequence models capture the temporal evolution of ransomware filesystem behavior (write/rename
    rate, extension changes, directory fraction) and can flag it earlier than static thresholds. Under
    the Impact tactic, an attention-based LSTM (per the Explainable Attention-Based LSTM Framework) surfaces
    the specific operations driving the score for analyst review, while a parallel host-independent feature
    detector (per SHIELD, Raz et al.) catches intermittent or partial encryption that evades entropy rules.
    A positive result with high model confidence and intuitive top contributors (e.g., extension-change
    rate, directory fan-out) warrants immediate containment.
  answer_sources:
  - MobileEDR.FileEvents
  - MobileEDR.ProcessEvents
  - MDM.ApplicationLogs
  - 'NAI: User data directories on managed mobile devices, including Android standard directories (e.g.,
    /storage/emulated/0/DCIM, /storage/emulated/0/Documents) and iOS App Sandbox container directories.'
  range: Last 90 days (streaming inference on live file-op sequences)
  queries:
  - technology: ML/pseudocode
    query: "seq = window_sequence(MobileEDR.FileEvents, by=app,\n  features=[write_rate,rename_rate,ext_change_rate,dir_fraction])\n\
      score, attn = attention_lstm.predict(seq)\nscore2 = host_independent_fs_detector.predict(seq)\n\
      WHERE score>thr OR score2>thr\n=> ALERT with top3(attn) contributing operations"
- question: Did a process create a new file whose name matches known ransom-note patterns — e.g. readme/recover/decrypt/help/restore
    with a .txt or .html extension?
  context: Ransom-note creation is a hallmark of the Impact tactic's extortion phase. A regex match on
    filenames like /(readme|recover|decrypt|help|restore).*\.(txt|html)$/i is a high-signal deterministic
    indicator that an actor is communicating ransom demands to the victim. A positive result — particularly
    alongside a file-encryption burst — should be treated as critical. Tune the keyword list to your environment
    to limit false positives from legitimate readme/help files.
  answer_sources:
  - MobileEDR.FileEvents
  - DLP.FileScanContent
  - MobileEDR.ProcessEvents
  - MDM.AppPermissionLogs
  - 'NAI: Root of user-accessible storage on mobile devices (e.g., /sdcard/, /storage/emulated/0/), directories
    containing recently modified user data, and application-specific data directories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM MobileEDR.FileEvents WHERE op='create'\n  AND filename ~ /(readme|recover|decrypt|help|restore).*\\\
      .(txt|html)$/i\n=> ALERT severity=critical 'possible ransom note created'"
- question: Did a sideloaded or non-baseline app invoke Android locker primitives — DevicePolicyManager.lockNow/resetPassword,
    a persistent SYSTEM_ALERT_WINDOW overlay, or device-admin activation — inconsistent with its expected
    role?
  context: Locker ransomware on Android extorts victims by locking the device or forcing a password reset
    rather than (or in addition to) encrypting files. Under the Impact tactic, DevicePolicyManager.lockNow/resetPassword,
    a persistent overlay window, or device-admin activation by an app with no legitimate need (per Alzahrani
    et al.) are platform-specific lock/extort behaviors. A positive result — a sideloaded or non-baseline
    app exercising these privileges — is strong evidence of locker behavior and warrants immediate MDM
    action.
  answer_sources:
  - MobileEDR.FileEvents
  - DLP.FileScanContent
  - MobileEDR.ProcessEvents
  - MDM.AppPermissionLogs
  - 'NAI: Root of user-accessible storage on mobile devices (e.g., /sdcard/, /storage/emulated/0/), directories
    containing recently modified user data, and application-specific data directories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM MobileEDR.ProcessEvents JOIN MDM.AppPermissionLogs\nWHERE api IN ('DevicePolicyManager.lockNow','DevicePolicyManager.resetPassword',\n\
      \  'SYSTEM_ALERT_WINDOW.persistent','device_admin.activate')\n  AND app.baseline=false\n=> ALERT\
      \ 'locker primitive invoked by non-baseline app'"
- question: Across a 5-minute window, in how many unique directories did the same process create matching
    ransom-note filenames, and does the count exceed 3?
  context: Ransomware typically drops its note into many directories so the victim finds it regardless
    of where they look. Under the Impact tactic, counting the unique directories a single process fans
    the note out to (escalating above 3) distinguishes a genuine ransom campaign from an isolated, benign
    file that merely matches the name pattern. A positive result — note files appearing across many directories
    from one process in minutes — strongly corroborates encrypt-for-impact.
  answer_sources:
  - MobileEDR.FileEvents
  - DLP.FileScanContent
  - MobileEDR.ProcessEvents
  - MDM.AppPermissionLogs
  - 'NAI: Root of user-accessible storage on mobile devices (e.g., /sdcard/, /storage/emulated/0/), directories
    containing recently modified user data, and application-specific data directories.'
  range: Last 90 days (5-minute correlation window per process)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM MobileEDR.FileEvents WHERE op=''create'' AND filename ~ ransom_note_regex

      GROUP BY process_id OVER window(5m)

      WHERE distinct(directory) > 3

      => ESCALATE ''ransom note multi-directory fan-out'''
- question: Does a text classifier (e.g. fine-tuned BERT) score the content of newly created .txt/.html
    files as a ransom note with confidence above 0.95, and what are the top contributing terms?
  context: Filename regexes miss notes with innocuous names, so classifying note content closes the gap.
    Under the Impact tactic, a fine-tuned text classifier scoring new .txt/.html content (with explainability
    per Drebin's emphasis on surfacing contributing features) catches extortion messaging by its language
    — cryptocurrency payment instructions, recovery deadlines, decryption-key offers. A positive result
    above 0.95 confidence should trigger automated MDM quarantine; the emitted top terms let the analyst
    quickly validate the decision.
  answer_sources:
  - MobileEDR.FileEvents
  - DLP.FileScanContent
  - MobileEDR.ProcessEvents
  - MDM.AppPermissionLogs
  - 'NAI: Root of user-accessible storage on mobile devices (e.g., /sdcard/, /storage/emulated/0/), directories
    containing recently modified user data, and application-specific data directories.'
  range: Last 90 days (inference on newly created text files)
  queries:
  - technology: ML/pseudocode
    query: "FOR file IN new_files(ext IN ['txt','html']):\n  conf, terms = bert_ransom_note.predict(read_text(file))\n\
      \  WHERE conf > 0.95\n  => MDM.quarantine(device) ; ALERT with top_terms(terms)"
- question: Within 5–10 minutes of a high-volume file I/O alert, did the responsible process connect to
    an IP or TLS SNI that matches a ransomware C2 threat-intelligence feed?
  context: Many ransomware families contact C2 to exfiltrate keys, report infection, or stage double-extortion
    data theft. Under the Impact tactic, joining file-I/O alerts to Zeek conn.log and MobileEDR.NetworkEvents
    and matching the destination IP/SNI against ransomware C2 intel ties the local encryption behavior
    to known adversary infrastructure. A positive result — a post-encryption connection to a known-bad
    destination — sharply raises confidence and may indicate active key/data exfiltration requiring urgent
    network containment.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - MobileEDR.NetworkEvents
  - 'NAI: Corporate Wi-Fi access points, VPN concentrators, and cloud-based secure web gateways (SWG)
    that inspect mobile device traffic.'
  range: Last 90 days (join within 5 minutes of the file I/O alert)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "JOIN file_io_alerts a WITH (Zeek.conn, MobileEDR.NetworkEvents) n\n  ON a.device=n.device\
      \ AND n.ts BETWEEN a.ts AND a.ts+5m\nWHERE n.dest_ip IN ransomware_c2_intel OR n.ssl_sni IN ransomware_c2_intel\n\
      => ALERT 'post-encryption C2 contact'"
- question: After an encryption alert, do any subsequently resolved domains exhibit high DNS name entropy
    (>3.5) or very recent WHOIS registration (domain age <30 days)?
  context: DGA and newly registered domains are common ransomware C2 patterns. Under the Impact tactic,
    computing DNS name entropy and WHOIS age for domains the device resolves after an encryption alert
    raises risk when entropy exceeds 3.5 (random-looking DGA names) or the domain is younger than 30 days
    (disposable infrastructure). A positive result strengthens the case that the device is reaching attacker-controlled
    C2; benign CDNs and established services typically have low entropy and aged registrations.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - MobileEDR.NetworkEvents
  - 'NAI: Corporate Wi-Fi access points, VPN concentrators, and cloud-based secure web gateways (SWG)
    that inspect mobile device traffic.'
  range: Last 90 days (evaluate domains resolved after the encryption alert)
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM Zeek.dns WHERE ts > encryption_alert.ts AND device=alert.device

      FOR each query: e=shannon_entropy(name); age=whois_age(domain)

      WHERE e > 3.5 OR age < 30d

      => RAISE_RISK ''high-entropy or newly-registered domain post-encryption'''
- question: After an encryption alert, is the device generating a burst of failed DNS resolutions (NXDOMAIN/SERVFAIL)
    above its baseline?
  context: DGA-based C2 produces many failed lookups as malware cycles through algorithmically generated
    domains until one resolves. Under the Impact tactic, a burst of NXDOMAIN/SERVFAIL from the device
    after an encryption alert is a distinct failure-mode signal (per the Cryptographic Ransomware Encryption
    Detection survey) that complements entropy and age checks. A positive result — failed-resolution rate
    spiking above baseline — suggests active DGA beaconing and corroborates the encryption finding.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - MobileEDR.NetworkEvents
  - 'NAI: Corporate Wi-Fi access points, VPN concentrators, and cloud-based secure web gateways (SWG)
    that inspect mobile device traffic.'
  range: Last 90 days (window after the encryption alert)
  queries:
  - technology: Zeek/pseudocode
    query: "FROM Zeek.dns WHERE ts > encryption_alert.ts AND device=alert.device\n  AND rcode IN ('NXDOMAIN','SERVFAIL')\n\
      GROUP BY device OVER window(5m)\nWHERE failed_per_min > baseline(device)\n=> ALERT 'post-encryption\
      \ DNS failure burst (possible DGA)'"
- question: Does an Isolation Forest / Autoencoder trained on benign Zeek conn/ssl features flag the device's
    post-encryption connections as anomalous, and what are the top-3 deviating features?
  context: Unsupervised anomaly detection over connection features (duration, protocol, resp_bytes, dest_port,
    JA3 fingerprint) catches novel or unknown C2 that signature/intel matching misses. Under the Impact
    tactic, escalating when post-encryption connections deviate from the device's benign network profile
    — and reporting the top-3 contributing features — gives the analyst explainable evidence of suspicious
    egress. A positive result with an unusual JA3 or unexpected port/byte volume after encryption supports
    C2/exfiltration hypotheses.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - MobileEDR.NetworkEvents
  - 'NAI: Corporate Wi-Fi access points, VPN concentrators, and cloud-based secure web gateways (SWG)
    that inspect mobile device traffic.'
  range: Last 90 days (score connections following the encryption alert)
  queries:
  - technology: ML/pseudocode
    query: 'feats = extract(Zeek.conn, Zeek.ssl, [duration,proto,resp_bytes,dest_port,ja3])

      score = iforest_or_autoencoder.predict(feats[post_encryption])

      WHERE score > anomaly_thr

      => ESCALATE with top3_deviating_features(feats)'
- question: Is the application responsible for the file-encryption activity sideloaded, installed from
    an unofficial source, or otherwise unmanaged by the MDM (IsManaged = false)?
  context: Attribution to the offending app is critical for response under the Impact tactic. Querying
    MDM AppInventoryLogs on a file-encryption alert and escalating when InstallationSource is Sideloaded/Unmanaged
    or IsManaged is false flags apps that bypassed the corporate vetting pipeline — the typical delivery
    vector for mobile ransomware. A positive result identifies an untrusted app as the encryptor and supports
    immediate removal/quarantine via MDM.
  answer_sources:
  - MDM.AppInventoryLogs
  - MDM.AppPermissionLogs
  - MDM.ComplianceStatusLogs
  - 'NAI: Mobile Device Management (MDM) platform''s application inventory database and policy compliance
    logs.'
  range: Last 90 days (query at time of encryption alert)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ON file_encryption_alert(app):\n  row = MDM.AppInventoryLogs WHERE package=app.package\n \
      \ WHERE row.InstallationSource IN ('Sideloaded','Unmanaged')\n    OR row.IsManaged = false\n  =>\
      \ ESCALATE 'encryptor is sideloaded/unmanaged app'"
- question: Does the responsible app invoke crypto-framework packages (javax.crypto Cipher/KeyGenerator)
    together with Storage Access Framework / content resolver / MediaStore bulk enumeration within the
    same session — the ransomware System-API signature?
  context: Ransomware combines cryptographic APIs with bulk file enumeration; goodware rarely does both
    at scale in one session. Under the Impact tactic, flagging apps whose static or dynamic behavior pairs
    javax.crypto usage with SAF/content-resolver/MediaStore bulk enumeration (per Scalas et al.'s System-API
    discrimination) is a strong behavioral signature. A positive result — crypto plus mass file access
    in the same session — is powerful evidence the app is an encryptor rather than a benign utility.
  answer_sources:
  - MDM.AppInventoryLogs
  - MDM.AppPermissionLogs
  - MDM.ComplianceStatusLogs
  - 'NAI: Mobile Device Management (MDM) platform''s application inventory database and policy compliance
    logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM MobileEDR.telemetry GROUP BY app, session\nWHERE uses_any(['javax.crypto.Cipher','javax.crypto.KeyGenerator'])\n\
      \  AND uses_any(['StorageAccessFramework','ContentResolver','MediaStore'])\n    WITH bulk_enumeration=true\n\
      => FLAG 'ransomware System-API package signature'"
- question: Is the responsible app's permission combination statistically rare across the device fleet
    — below the 1st percentile of observed permission-set prevalence?
  context: Rare permission combinations often signal purpose-built malware. Under the Impact tactic, computing
    the prevalence of permission sets across the managed fleet and enriching alerts when the responsible
    app's set falls below the 1st percentile highlights apps requesting an unusual mix of privileges (e.g.,
    broad storage plus device-admin plus overlay). A positive result raises suspicion and helps prioritize
    the app for deeper analysis, though it is corroborating rather than conclusive on its own.
  answer_sources:
  - MDM.AppInventoryLogs
  - MDM.AppPermissionLogs
  - MDM.ComplianceStatusLogs
  - 'NAI: Mobile Device Management (MDM) platform''s application inventory database and policy compliance
    logs.'
  range: Last 90 days (fleet-wide prevalence comparison)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'prevalence = count_apps_with(permission_set) / total_apps  # over fleet

      FOR responsible_app: p = prevalence(app.permission_set)

      WHERE p < percentile_1(all_permission_set_prevalences)

      => ENRICH alert ''rare permission set'''
- question: Does K-Prototypes clustering on app metadata (permissions, install source, developer, numeric
    features) place the responsible app in an anomalous small cluster, and which features drive that assignment?
  context: Clustering mixed categorical/numeric app metadata groups apps by similarity; ransomware and
    other outliers tend to land in small, anomalous clusters apart from the legitimate mainstream. Under
    the Impact tactic, escalating when the responsible app falls into such a cluster — and surfacing the
    driving features — gives the analyst an unsupervised second opinion on app trustworthiness. A positive
    result (membership in a tiny outlier cluster characterized by suspicious permissions/source) supports
    escalation.
  answer_sources:
  - MDM.AppInventoryLogs
  - MDM.AppPermissionLogs
  - MDM.ComplianceStatusLogs
  - 'NAI: Mobile Device Management (MDM) platform''s application inventory database and policy compliance
    logs.'
  range: Last 90 days (periodic re-clustering of fleet app metadata)
  queries:
  - technology: ML/pseudocode
    query: 'clusters = kprototypes.fit(app_metadata[permissions,source,developer,numeric])

      c = clusters.assign(responsible_app)

      WHERE cluster_size(c) is small AND cluster_anomaly(c) high

      => ESCALATE with driving_features(responsible_app, c)'
- question: Do explainable static and behavioral models — a DREBIN-style linear SVM over manifest/dex
    features and a MaMaDroid-style Markov-chain model over package-abstracted API-call sequences — classify
    the responsible APK as malicious, and what are the top weighted features?
  context: Combining a static linear SVM (DREBIN, Arp et al.) with a behavioral Markov-chain model (MaMaDroid,
    Mariconti et al.) gives obfuscation-resilient triage of the responsible APK. Under the Impact tactic,
    DREBIN surfaces the top weighted manifest/dex features driving a malicious verdict (explainability
    for the analyst), while MaMaDroid abstracts API calls to package-level Markov chains that survive
    renaming/obfuscation. A positive result from either model, especially with intuitive top features,
    supports a confident malicious classification and removal.
  answer_sources:
  - MDM.AppInventoryLogs
  - MDM.AppPermissionLogs
  - MDM.ComplianceStatusLogs
  - 'NAI: Mobile Device Management (MDM) platform''s application inventory database and policy compliance
    logs.'
  range: Last 90 days (score the responsible APK on alert)
  queries:
  - technology: ML/pseudocode
    query: 'svm_score, top_feats = drebin_svm.predict(apk.manifest_dex_features)

      markov_score = mamadroid.predict(apk.package_abstracted_api_seq)

      WHERE svm_score>thr OR markov_score>thr

      => CLASSIFY malicious ; report top_feats'
