name: 'T1636: Protected User Data'
id: 36c3a07f-4ff5-4fc9-9d82-65cb66209ce1
description: Investigate adversary collection of protected user data from corporate Android and iOS mobile
  devices via standard OS APIs to permission-backed stores such as contacts, SMS, calendar, phone state,
  and location. This playbook helps an analyst hunt that behavior across mobile management, application-vetting,
  network, and mobile EDR/MTD telemetry. It correlates app identifiers (hash, package name, signing certificate)
  against mobile threat intelligence; proves static source-to-sink reachability from protected stores
  to network/SMS sinks; scores anomalous and over-privileged permission bundles by app category; classifies
  risky manifests with machine learning; baselines outbound data volume, byte ratios, and destination
  risk; detects DNS-tunneled exfiltration of contacts/SMS; and correlates protected-data API access with
  unapproved or first-seen network egress, including jailbreak/root attestation signals and anomalous
  runtime API-call sequences. It combines deterministic symbolic-logic floors, statistical baselining,
  and machine-learning detection to make mobile data-collection activity defensible and actionable for
  a SOC.
type: technique
related:
- tactic_id: TA0035
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any applications in the MDM or app-vetting inventory match known mobile malware or malicious
    signers when their file hash, package name, and signing-certificate hash are checked against mobile
    threat intelligence, and do they request protected-store permissions (contacts/SMS/calendar/location)
    together with INTERNET?
  context: 'This is the deterministic detection floor for the Collection tactic: known-bad app attribution.
    For every app in the MDM application inventory and app-vetting reports, query a mobile threat-intel
    feed using file hash, package name, and signing-certificate hash, and raise a high-severity alert
    on any match to known malware or malicious signing certificates. Apply [Vetting the Security of Mobile
    Applications (NIST SP 800-163r1)](https://doi.org/10.6028/NIST.SP.800-163r1) app-vetting policy so
    any app that requests protected-store permissions plus INTERNET must pass review before deployment,
    and enforce allowed-app/permission baselines via MDM ([Guidelines for Managing the Security of Mobile
    Devices in the Enterprise (NIST SP 800-124r2)](https://doi.org/10.6028/NIST.SP.800-124r2)), blocking
    side-loaded or unmanaged apps. A positive result is high-confidence evidence a device carries an app
    capable of and intended for protected-data theft; a negative result does not clear the fleet because
    novel or repackaged apps may not yet be in intel, so this pairs with the statistical and ML methods
    below.'
  answer_sources: &id001
  - MDM Application Inventory Export
  - Application Vetting Service Report
  - Mobile Threat Intelligence Feed
  - 'NAI: Mobile Device Management (MDM) platform, Corporate App Store, Application Vetting System, Corporate-managed
    mobile endpoints'
  range: Last 90 days
  queries:
  - technology: MDM/Vetting Rule pseudocode
    query: 'for app in mdm_inventory + vetting_reports: ti = threat_intel.lookup(app.sha256, app.package,
      app.cert_sha256); alert(severity=high) when ti.match in known_malware|malicious_signers; review_required
      = app where (contacts|sms|calendar|location) AND INTERNET in permissions; block when app sideloaded
      OR unmanaged OR not in allowed_baseline; output device, app.package, app.cert_sha256, ti.match'
- question: Does static analysis of an installed app prove a protected-data source (contacts, location,
    IMEI/device ID, or SMS API) can reach a network or SMS sink, and is that app unapproved for the environment?
  context: Permission requests alone do not prove exfiltration intent; reachability does. In the vetting
    pipeline, statically analyze each app to determine whether a protected-data source can flow to a network
    or SMS sink. On Android use lifecycle-aware taint analysis ([FlowDroid (Arzt et al., PLDI 2014)](https://www.bodden.de/pubs/far+14flowdroid.pdf));
    on iOS resolve objc_msgSend dispatch and trace flows from contacts/GPS/UDID to network sinks ([PiOS
    (Egele et al., NDSS 2011)](https://sites.cs.ucsb.edu/~chris/research/doc/ndss11_pios.pdf)). Alert
    or block when such reachability exists and the app is not on the approved allowlist, and derive a
    per-environment allowlist of apps with legitimate flows so everything else is treated as suspect.
    In the Collection context, a proven source-to-sink path from a protected store to an egress sink in
    an unapproved app is strong evidence of a data-collection capability; absence of a path lowers but
    does not eliminate suspicion, since dynamic loading can hide flows.
  answer_sources: *id001
  range: Last 90 days; re-run on every new or updated app version
  queries:
  - technology: Vetting/Static-analysis pseudocode
    query: 'for app in vetting_pipeline: flows = (Android ? FlowDroid.taint(sources=[ContactsContract,LocationManager,TelephonyManager.getDeviceId,SMS],
      sinks=[network,sms]) : PiOS.trace(sources=[contacts,GPS,UDID], sinks=[network])); alert/block when
      flows.reachable AND app not in approved_allowlist; output app.package, source, sink, path'
- question: Which apps request a permission bundle that is statistically rare for their store category
    or are over-privileged (granted more dangerous permissions than the APIs they actually invoke), ranking
    by rarity-weighted anomaly score?
  context: Malicious apps frequently request high-signal dangerous permissions that are unusual among
    legitimate peers in the same category. Group apps by store category and compute per-permission prevalence,
    then for each app compute an anomaly score equal to the sum of inverse prevalence (rarity) of its
    requested dangerous permissions, weighting the empirically highest-signal ones (READ_SMS, SEND_SMS,
    READ_CONTACTS, ACCESS_FINE_LOCATION, READ_PHONE_STATE) per [Identification of Significant Permissions
    for Efficient Android Malware Detection (Rathore et al., 2021)](https://arxiv.org/abs/2103.00643).
    Flag apps above the 95th percentile for their category, and separately flag over-privilege where the
    granted dangerous-permission count exceeds the APIs actually invoked. Recompute prevalence per fleet
    to derive dataset-specific thresholds. In the Collection context, a rarity-heavy bundle (e.g., a flashlight
    app requesting READ_SMS + READ_CONTACTS) or a large over-privilege gap is a defensible indicator of
    latent data-collection capability.
  answer_sources: *id001
  range: Last 90 days; recompute category prevalence per fleet refresh
  queries:
  - technology: App-Vetting/Stats pseudocode
    query: 'for cat in categories: prev[perm] = count(apps_with_perm)/count(apps in cat); for app in cat:
      score = sum(1/prev[p] * weight[p] for p in app.dangerous_perms); op_gap = count(granted_dangerous)
      - count(apis_invoked); alert when score > p95(cat) OR op_gap > 0; output app.package, cat, score,
      op_gap, top_perms'
- question: When an explainable ML classifier trained on benign and malicious APK/IPA static features
    scores a new or updated app above 0.90 malicious confidence, what are the top-3 highest-weight features
    (e.g., READ_SMS, getDeviceId, sendTextMessage) driving that classification?
  context: This supervised method fuses static app features into a single calibrated risk score. Train
    an explainable linear SVM or Random Forest on benign and malicious APK/IPA static features — the requested/used
    permission vector, restricted and suspicious API calls, declared intents and components, and embedded
    URLs — following the [Drebin (Arp et al., NDSS 2014)](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)
    approach. Score new or updated apps and block/alert when malicious confidence exceeds 0.90, surfacing
    the top-3 highest-weight contributing features so analysts can triage quickly, and retrain quarterly
    against current fleet benign apps to limit drift. In the Collection context, a high-confidence classification
    with protected-data features (READ_SMS, getDeviceId, sendTextMessage) at the top is a strong basis
    to block deployment; the feature attribution lets the analyst confirm the verdict against the manifest
    before acting.
  answer_sources: *id001
  range: Last 90 days; model retrained quarterly on fleet benign apps
  queries:
  - technology: App-Vetting/ML pseudocode
    query: X = static_features(apk|ipa) = [perm_vector, used_apis, suspicious_apis, intents, components,
      embedded_urls]; p = Drebin_SVM/RandomForest.predict_proba(X); alert/block when p > 0.90; explain
      = top_k_weighted_features(X, 3); output app.package, p, explain
- question: Do any network connections originating from managed mobile IP ranges reach an IP or domain
    that appears on threat intelligence as known C2 or exfiltration infrastructure, when Zeek conn.log
    is joined with dns.log on the connection UID?
  context: This deterministic blocklist match is the floor of network detection and runs on first-party
    logs. Filter Zeek conn.log for connections from mobile IP ranges, join with dns.log on connection
    UID to recover the resolved domain, and compare the destination IP/domain against threat intel for
    known C2 or exfil endpoints, generating a critical alert on any match. In the Collection context,
    a managed mobile device contacting known exfil infrastructure is high-confidence evidence that protected
    data may be leaving the device; a negative result does not clear the device because the actor may
    use unflagged infrastructure, so this is paired with the statistical and ML methods.
  answer_sources: &id002
  - Zeek conn.log
  - Zeek dns.log
  - Mobile Threat Defense Flow Log
  - Threat Intelligence Feed
  - WHOIS Lookup Service
  - 'NAI: Network egress points, Corporate Wi-Fi access points, VPN concentrators, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: c = conn.log where orig_h in mobile_ranges; d = dns.log; join c,d on uid; alert(severity=critical)
      when c.resp_h in ti_exfil_ips OR d.query in ti_exfil_domains; output device, resp_h, query, matched_indicator
- question: Which mobile devices (or apps) show a single connection whose outbound bytes exceed 3 standard
    deviations above their 30-day device-hour mean, or a heavily upload-skewed sent/received byte ratio,
    especially toward newly registered (<30 days) or high-entropy (>3.5) domains?
  context: Bulk theft of contacts, SMS, or calendar data shows up as anomalously large or upload-skewed
    outbound flows. For each mobile device (and per app where available) maintain a 30-day baseline of
    hourly orig_bytes and the sent/received byte ratio, and alert when a single connection exceeds 3σ
    above the device-hour mean or the ratio is heavily upload-skewed — flow byte counts, packet sizes,
    and ratios are strong malware discriminators ([CorrNetDroid (Sharma & Arora, 2025)](https://arxiv.org/abs/2503.01396)).
    Enrich destinations with WHOIS domain age and DNS entropy and escalate when age < 30 days and entropy
    > 3.5; derive σ thresholds per fleet. In the Collection context, an upload-skewed 3σ spike to a young,
    high-entropy domain is a defensible exfiltration signal worth escalation.
  answer_sources: *id002
  range: Last 90 days; baseline over rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: base = stats(orig_bytes by device,hour over 30d); flag = conn where orig_bytes > mean + 3*sd
      OR (orig_bytes/resp_bytes) heavily_upload_skewed; flag = enrich(flag, whois_age, dns_entropy); escalate
      when whois_age < 30d AND dns_entropy > 3.5; output device, app, resp_h, orig_bytes, ratio, whois_age,
      entropy
- question: Which registered domains show DNS behavior consistent with low-throughput tunneled exfiltration
    of contacts or SMS — high distinct-subdomain count, high query-label entropy/length, high unique-query
    ratio, or NXDOMAIN/failed-resolution bursts above the fleet 99th percentile?
  context: Adversaries can smuggle small protected-data payloads out over DNS to evade volume-based controls.
    Over sliding windows per registered domain, compute distinct-subdomain count, query-label entropy/length,
    unique-query ratio, and NXDOMAIN/failed-resolution rate, then flag anomalies (e.g., isolation-forest
    score or distinct-subdomains/hour above the fleet 99th percentile) indicative of low-throughput exfil
    over DNS ([Detection of Malicious and Low Throughput Data Exfiltration Over the DNS Protocol (Nadler
    et al., 2019)](https://arxiv.org/abs/1709.08395)). Treat NXDOMAIN bursts as a distinct failure-mode
    signal. In the Collection context, a domain receiving a steady stream of high-entropy unique subdomains
    from a mobile device is a strong candidate for DNS-tunneled theft of contacts or SMS; the per-window
    aggregation isolates the abusing domain for pivoting.
  answer_sources: *id002
  range: Last 90 days; sliding-window aggregation
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'for dom in registered_domains: w = sliding_window(dns.log by dom); feats = [distinct_subdomains(w),
      label_entropy(w), label_len(w), unique_query_ratio(w), nxdomain_rate(w)]; score = IsolationForest.score(feats);
      alert when score anomalous OR distinct_subdomains/hr > p99(fleet) OR nxdomain_burst; output device,
      dom, feats, score'
- question: When an LSTM autoencoder trained on hourly outbound byte counts per device (with day-of-week
    and hour-of-day features) reconstructs an hour with error above the 99th percentile, which contributing
    hours/features explain it, and does it correlate with first-seen or previously-unseen-app egress?
  context: Sequence models capture temporal egress patterns that static thresholds miss. Train an LSTM
    autoencoder on hourly outbound byte counts per device with day-of-week and hour-of-day features, and
    alert when reconstruction error exceeds the 99th percentile, reporting the contributing hours/features.
    Correlate with per-app destination fingerprints ([FlowPrint (van Ede et al., NDSS 2020)](https://www.ndss-symposium.org/ndss-paper/flowprint-semi-supervised-mobile-app-fingerprinting-on-encrypted-network-traffic/)
    ([code](https://github.com/Thijsvanede/FlowPrint))) to flag first-seen or previously-unseen-app egress,
    which works on encrypted-flow metadata without payload inspection. In the Collection context, an anomalous
    outbound spike that coincides with a new app or a first-seen destination is a defensible exfiltration
    indicator; the contributing-feature report lets the analyst confirm the timing and source app before
    escalating.
  answer_sources: *id002
  range: Last 90 days; model trained on benign rolling window
  queries:
  - technology: SIEM/ML pseudocode
    query: X = hourly_outbound_bytes(device) + [dow, hod]; err = LSTM_AE.reconstruction_error(X); alert
      when err > p99; fp = FlowPrint.fingerprint(per_app_flows); flag first_seen_app|first_seen_dest;
      output device, hour, err, contributing_features, new_app, new_dest
- question: Does any process on a managed mobile endpoint access a protected-data API (ContactsContract/CNContactStore,
    TelephonyManager/SMS, LocationManager/CLLocationManager) and then, within 10 seconds, initiate a network
    or SMS transmission to a destination not on the approved app allowlist — or does device attestation
    report jailbreak/root?
  context: This implements TaintDroid-style source-to-sink correlation as a deterministic rule on first-party
    MTD/EDR telemetry. Trigger when EDR/MTD logs show a process accessing a protected-data API and, within
    10 seconds, the same process initiates a network or SMS transmission to a destination not on the approved
    app allowlist ([TaintDroid (Enck et al., OSDI 2010)](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf)).
    Also alert immediately if device attestation indicates jailbreak/root, which permits access to protected
    stores without user consent ([Guidelines for Managing the Security of Mobile Devices in the Enterprise
    (NIST SP 800-124r2)](https://doi.org/10.6028/NIST.SP.800-124r2)). In the Collection context, a tight
    access-then-egress sequence to an unapproved destination, or a compromised-integrity device, is high-confidence
    evidence of active protected-data collection and should be escalated; the 10-second window keeps the
    rule specific while the allowlist suppresses benign app behavior.
  answer_sources: &id003
  - Mobile EDR/MTD API Monitoring Log
  - Mobile EDR Network Flow Log
  - Device Attestation / Integrity Log
  - Zeek conn.log
  - Application-to-Network Allowlist
  - 'NAI: Corporate-managed mobile endpoints, Network egress points'
  range: Last 90 days; event-centered 10-second correlation window
  queries:
  - technology: Mobile EDR/MTD Rule pseudocode
    query: access = mtd_log where api in [ContactsContract,CNContactStore,TelephonyManager,SMS,LocationManager,CLLocationManager];
      egress = flow_log where same process initiates network|sms within 10s of access AND dest not in
      app_allowlist; alert when access -> egress; alert when attestation in [jailbreak,root]; output device,
      process, api, dest, attestation
- question: After a process accesses protected data, does it connect within 10 seconds to a destination
    absent from that app's 60-day baseline of domains/IPs, weighting destinations that are newly registered
    (<30 days) or high-entropy?
  context: Novel destinations following protected-data access are a hallmark of fresh exfiltration infrastructure.
    Build a 60-day baseline of destination domains/IPs per app from EDR/MTD and Zeek logs, and alert when
    protected-data access is followed within 10 seconds by a destination absent from that app's baseline,
    weighting destinations that are newly registered (<30 days) or high-entropy. Per-app destination clustering
    ([FlowPrint (van Ede et al., NDSS 2020)](https://www.ndss-symposium.org/ndss-paper/flowprint-semi-supervised-mobile-app-fingerprinting-on-encrypted-network-traffic/))
    generalizes this baseline, and the window and novelty threshold should be tuned per app behavior.
    In the Collection context, a first-seen, young, or high-entropy destination reached immediately after
    touching a protected store is a defensible indicator that an app is shipping data to attacker-controlled
    infrastructure rather than its normal backend.
  answer_sources: *id003
  range: Last 90 days; per-app 60-day destination baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: base[app] = set(dest domains/IPs over 60d); access = mtd_log api in protected_apis; flag =
      egress within 10s of access where dest not in base[app]; weight += newly_registered(dest) + high_entropy(dest);
      alert when flag; output device, app, dest, whois_age, entropy
- question: When a behavioral model of a process's API-call sequence (Markov-chain transitions or an LSTM/transformer)
    scores a protected-data access followed by atypical network calls as highly anomalous, what are the
    top contributing transitions?
  context: Behavioral sequence modeling is robust to obfuscation and API churn that defeat static signatures.
    Abstract each process's API calls to package/family level and model normal behavior as Markov-chain
    transition probabilities (or an LSTM/transformer over the call sequence), then score live sequences
    and alert when a protected-data access followed by atypical network calls yields a high anomaly score,
    reporting the top contributing transitions ([MaMaDroid (Mariconti et al., NDSS 2017)](https://arxiv.org/abs/1612.04433)
    ([code](https://bitbucket.org/gianluca_students/mamadroid_code))). Train on benign fleet apps. In
    the Collection context, an app whose runtime sequence diverges from its learned benign behavior —
    e.g., an unusual transition from a contacts/SMS read to a network send — is a strong behavioral indicator
    of protected-data collection; the contributing transitions let the analyst confirm the access-to-egress
    pattern before escalating.
  answer_sources: *id003
  range: Last 90 days; model trained on benign fleet apps
  queries:
  - technology: Mobile EDR/MTD ML pseudocode
    query: seq = abstract_api_calls(process) to package/family; model = MarkovChain|LSTM.fit(benign_seqs);
      score = model.anomaly_score(live_seq); alert when score high AND protected_access -> atypical_network
      in seq; explain = top_k_transitions(seq, 3); output device, process, score, explain
