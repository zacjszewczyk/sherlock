name: 'T1631: Process Injection'
id: 08c7531e-4dc7-4257-8102-c6123d2dd3db
description: 'This playbook helps an analyst investigate suspected process injection on managed mobile
  devices (Android and iOS), where adversaries inject code into another live process to evade process-based
  defenses or elevate privileges. Because neither Android nor iOS offers a legitimate mechanism for process
  injection, any such activity implies abuse of existing root access or exploitation of a vulnerability.
  It guides the hunt across two angles: (1) Privilege Escalation -- detecting memory-manipulation and
  debugging API misuse (ptrace, process_vm_writev, mach_vm_write, task_for_pid), non-allowlisted dynamic-library
  loads (.so/.dylib), instrumentation artifacts (frida/Xposed), rare library-to-app load pairs, anomalous
  syscall/IPC sequences, and injection failure/denial signals; and (2) Defense Evasion -- identifying
  trusted, allowlisted app processes that exhibit resource and network anomalies consistent with hidden
  injected code (sustained CPU/memory spikes, connections to rare or known-bad destinations, abnormal
  egress ratios, and hidden dynamic-load chains). It combines symbolic-logic rules, statistical baselining
  and change-point analysis, and machine-learning approaches over endpoint (MDM/EDR, logcat, iOS Unified
  Logs, audit/syscall logs, application vetting) and network (Zeek) telemetry to surface defensible, actionable
  detections for a SOC analyst.'
type: technique
related:
