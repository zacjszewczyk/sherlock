name: 'T1398: Boot or Logon Initialization Scripts'
id: b2c0080a-5a90-4ef4-9945-23ee0e722bc8
description: >-
  Hunt for adversary persistence on managed mobile devices (Android and iOS) achieved by modifying boot
  or logon initialization scripts, which is only possible once a device is rooted, jailbroken, or otherwise
  has its verified-boot chain broken. This playbook helps an analyst investigate device-integrity attestation
  failures (Google SafetyNet, Play Integrity API, hardware Key/ID attestation, Samsung Knox), Android
  Verified Boot states of Red/Yellow/Orange that permit init-script tampering, forensic file-hash and
  entropy mismatches in boot directories (/system/etc/init/, /system/bin/, /vendor/etc/init/, and init.rc),
  anomalous boot-time process and system-call sequences, malicious launchd LaunchDaemons/LaunchAgents
  and background-execution entitlements on iOS, and corroborating network behavior at egress. It combines
  deterministic symbolic-logic rules, statistical baselining, and explainable machine-learning models
  so the analyst can confirm tampering, quarantine affected devices, and scope fleet-wide rooting campaigns.
type: technique
related:
- tactic_id: TA0028
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: >-
    Did any managed Android device report a device-integrity attestation failure (SafetyNet ctsProfileMatch=false
    or basicIntegrity=false, or a Play Integrity API verdict whose deviceIntegrity field is empty), indicating
    a rooted device, emulator, or unofficial ROM?
  context: >-
    A failed integrity attestation is the precondition that makes boot/logon init-script tampering possible,
    so for the Persistence tactic this is the earliest deterministic warning that a device's trust chain
    is broken. The analyst is looking for any MDM/EMM attestation record where the legacy SafetyNet result
    fails or the modern Play Integrity verdict lacks a MEETS_DEVICE_INTEGRITY/MEETS_BASIC_INTEGRITY/MEETS_STRONG_INTEGRITY
    label. Fire a critical, deterministic SIEM rule on ingest and have the playbook invoke an MDM API
    call to move the device to a restricted/quarantine network profile and flag it for compliance review
    per NIST SP 800-124r2. A positive result means the device should be treated as untrusted until re-imaged;
    a negative result across the fleet does not prove cleanliness because attestation can be defeated,
    so corroborate with hardware attestation. Keep this verdict as the floor and never replace it with
    probabilistic scoring.
  answer_sources:
  - MDM attestation logs
  - Android SafetyNet attestation results
  - Play Integrity API verdicts
  - Hardware Keystore attestation certificates
  - Samsung Knox attestation logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Centralized logging platform (e.g., SIEM), Mobile Device Management (MDM) console, and network
    egress points instrumented with Zeek sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      mdm_attestation
      | where safetynet.ctsProfileMatch == false
        or safetynet.basicIntegrity == false
        or isempty(play_integrity.deviceIntegrity)
      | set severity = "critical"
      | action mdm_api.quarantine(device_id), flag_compliance_review(device_id)
- question: >-
    For high-assurance devices, does a hardware-backed Key/ID attestation certificate chain show a verifiedBootState
    other than Verified (GREEN) or a deviceLocked value of false?
  context: >-
    Because the Key/ID attestation extension is signed by a Google-rooted CA inside secure hardware, a
    rooted OS cannot forge a clean verdict, making this a non-spoofable corroboration of SafetyNet/Play
    Integrity for the Persistence tactic. The analyst requests a fresh hardware-backed attestation certificate
    chain, parses the signed attestation extension, and alerts critical when verifiedBootState != Verified
    (GREEN) or deviceLocked=false. A positive result is high-confidence proof that the boot chain is broken
    and init scripts could have been modified; this should override any soft 'clean' signal from software
    attestation. A GREEN, locked verdict is strong evidence the boot partition is intact at attestation
    time.
  answer_sources:
  - MDM attestation logs
  - Android SafetyNet attestation results
  - Play Integrity API verdicts
  - Hardware Keystore attestation certificates
  - Samsung Knox attestation logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Centralized logging platform (e.g., SIEM), Mobile Device Management (MDM) console, and network
    egress points instrumented with Zeek sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      chain = keystore.request_id_attestation(device_id)
      ext = parse_attestation_extension(chain)
      if ext.verifiedBootState != "Verified(GREEN)" or ext.deviceLocked == false:
          alert(severity="critical", device_id, reason="hardware-attested boot tamper")
- question: >-
    Is there a fleet-wide spike in attestation failures within a single hour, or a rising per-model/per-OS-build
    failure rate, that would indicate a coordinated rooting campaign rather than isolated noise?
  context: >-
    Individual attestation failures are common, but campaign-wide spikes reveal a targeted effort to root
    many devices and plant persistence at boot. For the Persistence tactic, compute a 30-day rolling baseline
    of the hourly count of attestation failures across the whole fleet and alert medium when an hour exceeds
    the 99th percentile (or mean+3-sigma). Separately track the per-device-model failure RATE as a distinct
    failure-mode signal per NIST SP 800-124r2: a sudden rise concentrated on one model or OS build points
    to a targeted root campaign. A positive result tells the analyst to pivot from single-device triage
    to a fleet-segment investigation; a flat baseline suggests background noise.
  answer_sources:
  - MDM attestation logs
  - Android SafetyNet attestation results
  - Play Integrity API verdicts
  - Hardware Keystore attestation certificates
  - Samsung Knox attestation logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Centralized logging platform (e.g., SIEM), Mobile Device Management (MDM) console, and network
    egress points instrumented with Zeek sensors.'
  range: Last 90 days, with 30-day rolling baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = rolling_percentile(count(attestation_failures) by hour, window=30d, pct=99)
      current = count(attestation_failures) by hour
      if current > baseline: alert(severity="medium", scope="fleet-spike")
      // model-cohort signal
      rate = count(failures) / count(checkins) by device_model, os_build
      alert if rate trending up > baseline_rate by cohort
- question: >-
    For a device that failed attestation, do its network features in the prior 24 hours (DNS query-name
    entropy, failed-to-successful connection ratio, post-boot egress volume, and low-reputation IP contacts)
    score it as likely malicious under an explainable classifier?
  context: >-
    A rooted device that has had init scripts modified will often beacon, exfiltrate, or contact low-reputation
    infrastructure shortly after boot, so corroborating attestation failures with network behavior strengthens
    the Persistence verdict. For any device with an attestation failure, query Zeek logs for its IP over
    the prior 24h and feed features into a logistic-regression or Drebin-style linear classifier whose
    per-feature weights are recoverable: Shannon entropy of dns.log query names, ratio of failed (S0/REJ/RSTO)
    to successful (SF) conn.log connections, post-boot egress byte volume, and count of connections to
    low-reputation IPs. Escalate to critical at confidence > 0.85 and, following Drebin, list the top-3
    contributing features in the alert. Retrain periodically against AndroZoo baselines to counter concept
    drift. A high score with explanatory features gives the analyst concrete leads; a low score reduces
    but does not eliminate concern.
  answer_sources:
  - MDM attestation logs
  - Android SafetyNet attestation results
  - Play Integrity API verdicts
  - Hardware Keystore attestation certificates
  - Samsung Knox attestation logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Centralized logging platform (e.g., SIEM), Mobile Device Management (MDM) console, and network
    egress points instrumented with Zeek sensors.'
  range: Last 90 days; network features computed over the 24h after each attestation failure.
  queries:
  - technology: Zeek/pseudocode
    query: |-
      for device in attestation_failures:
        ip = device.ip; w = last_24h
        f.dns_entropy = shannon(dns.log.query where id.orig_h==ip in w)
        f.fail_ratio  = count(conn.log conn_state in [S0,REJ,RSTO]) / count(conn_state==SF)
        f.egress      = sum(conn.log.orig_bytes where ts after boot)
        f.lowrep      = count(distinct dst in threat_intel_lowrep)
        p = logreg(f)
        if p > 0.85: alert("critical", device, top3_features(f))
- question: >-
    Did an MDM device-health record report an Android Verified Boot state of 'Red' (corrupt/tampered system
    partition via dm-verity) or 'Orange' (unlocked bootloader) on a managed device?
  context: >-
    A 'Red' verified boot state means dm-verity detected a corrupt or tampered system partition, exactly
    the condition that allows boot/logon init-script modification for Persistence; 'Orange' means the
    bootloader is unlocked, disabling verification entirely. Configure a critical SIEM alert when an MDM
    record reports verified_boot_state='Red' and immediately isolate the device via MDM and flag it for
    remote wipe. Treat 'Orange' on a managed fleet as a high-severity policy violation. This deterministic
    rule is the floor and is not subject to ML override. A positive result is direct evidence of a broken
    trust chain; a 'Green' state indicates the system partition verified at boot time.
  answer_sources:
  - MDM device health telemetry logs
  - MDM policy compliance status logs
  - 'NAI: Mobile Device Management (MDM) servers and Security Information and Event Management (SIEM)
    platform.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      mdm_device_health
      | where verified_boot_state == "Red"
        | set severity="critical", action=isolate_device + flag_remote_wipe
      | where verified_boot_state == "Orange"
        | set severity="high", reason="unlocked bootloader policy violation"
- question: >-
    Is the count of devices reporting a 'Yellow'/'Orange' Verified Boot state trending upward over a sustained
    period in a way that signals a slow-moving rooting campaign?
  context: >-
    A gradual increase in 'Yellow'/'Orange' verified boot states can reveal a patient adversary rooting
    devices over time to establish persistence, which a simple threshold would miss. For the Persistence
    tactic, build a daily time series of devices in 'Yellow'/'Orange' state and apply STL (Seasonal-Trend-Loess)
    decomposition over a 90-day window, alerting when the trend component shows a statistically significant
    positive slope over any 7-day period. Per NIST SP 800-124r2, correlate the slope with OS-version/patch-level
    cohorts to localize the affected fleet segment. A positive trend tells the analyst to investigate
    a specific cohort; a flat or declining trend suggests no active campaign.
  answer_sources:
  - MDM device health telemetry logs
  - MDM policy compliance status logs
  - 'NAI: Mobile Device Management (MDM) servers and Security Information and Event Management (SIEM)
    platform.'
  range: Last 90 days, daily time series with STL decomposition.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      ts = daily_count(devices where verified_boot_state in ["Yellow","Orange"]) over 90d
      comp = STL_decompose(ts)
      if slope(comp.trend, window=7d) significant and > 0:
          alert("medium", reason="rising yellow/orange boot states")
          breakdown by os_version, patch_level
- question: >-
    Which managed devices have anomalous device-health profiles (verified boot state, stale OS patch level,
    long time since MDM check-in, sideloaded-app count, developer-mode flag) that place them in the riskiest
    1% of the fleet?
  context: >-
    Devices being prepared for or already hosting boot-time persistence often share a profile of stale
    patches, sideloaded apps, developer mode, and degraded boot state. For the Persistence tactic, train
    an Isolation Forest on MDM telemetry vectors -- verified_boot_state (one-hot), days since last OS
    update, hours since last MDM check-in, number of non-store/sideloaded apps, and developer_mode_enabled
    flag -- and flag devices whose anomaly score is in the top 1% of the fleet for Tier-2 review. The
    alert MUST surface the top-3 features driving the score (e.g., sideloaded-app count, stale patch level)
    for triage, and the model should be retrained on rolling fleet baselines to handle drift. A flagged
    device with explanatory features gives the analyst a prioritized hunting target.
  answer_sources:
  - MDM device health telemetry logs
  - MDM policy compliance status logs
  - 'NAI: Mobile Device Management (MDM) servers and Security Information and Event Management (SIEM)
    platform.'
  range: Last 90 days, scored against current fleet baseline.
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      X = [onehot(verified_boot_state), days_since_os_update, hours_since_checkin,
           sideloaded_app_count, developer_mode_enabled] per device
      model = IsolationForest().fit(fleet_baseline)
      score = model.anomaly_score(X)
      flag devices in top 1% -> Tier-2 review with top3 feature contributions
- question: >-
    On a forensic device image, does the SHA-256 of any file in the critical boot directories (/system/etc/init/,
    /system/bin/, /vendor/etc/init/, init.rc) fail to match the per-model/per-OS known-good baseline,
    or match a known-malicious hash, or appear as an unauthorized file absent from the stock baseline?
  context: >-
    Direct file-hash comparison is the authoritative confirmation that boot/logon init scripts were modified
    to achieve Persistence. After acquiring a device image, compute SHA-256 for every file in the critical
    boot directories and compare against a per-model/per-OS-version known-good baseline and an external
    malicious-hash feed -- mirroring the block-level integrity check dm-verity performs in Android Verified
    Boot. Any mismatch, known-bad match, or unexpected unauthorized file confirms tampering and requires
    escalation per NIST SP 800-124r2. Keep this exact-match rule as the deterministic floor. A positive
    result is definitive evidence; a full match across all boot files indicates the boot chain is intact
    on the image.
  answer_sources:
  - Mobile device file system image
  - File system metadata from image
  - Internal known-good file hash database
  - Threat intelligence hash feeds
  - 'NAI: Digital Forensics and Incident Response (DFIR) workstation and secure evidence storage.'
  range: Point-in-time forensic acquisition; baseline from stock OS image.
  queries:
  - technology: DFIR/pseudocode
    query: |-
      for f in image.files(in=[/system/etc/init/, /system/bin/, /vendor/etc/init/, init.rc]):
        h = sha256(f)
        if h not in known_good[model,os_version]: alert("mismatch", f)
        if h in malicious_hash_feed: alert("known-bad", f)
        if f.path not in baseline_filelist: alert("unauthorized-file", f)
- question: >-
    Do any executables or scripts in the boot directories exhibit Shannon entropy more than 3 sigma above
    the known-good per-file-type baseline, suggesting obfuscated or encrypted payloads?
  context: >-
    Even when a hash does not match a known-bad indicator, abnormally high entropy in a boot script signals
    packing, encryption, or obfuscation typical of malicious init payloads used for Persistence. For each
    executable/script in the target boot directories, compute Shannon entropy and compare against the
    per-file-type entropy distribution of known-good firmware, flagging files exceeding 3 sigma from the
    baseline mean as likely obfuscated/encrypted -- a distinct signal from a clean hash match. Tune the
    sigma threshold against same-model stock images to control false positives on legitimately compressed
    assets. A high-entropy outlier warrants manual or ML review; entropy within baseline reduces suspicion
    for that file.
  answer_sources:
  - Mobile device file system image
  - File system metadata from image
  - Internal known-good file hash database
  - Threat intelligence hash feeds
  - 'NAI: Digital Forensics and Incident Response (DFIR) workstation and secure evidence storage.'
  range: Point-in-time forensic acquisition; entropy baseline from stock firmware.
  queries:
  - technology: DFIR/Stats pseudocode
    query: |-
      for f in boot_dir_scripts(image):
        e = shannon_entropy(bytes(f))
        mu, sd = baseline_entropy[file_type(f)]
        if e > mu + 3*sd: flag(f, reason="high-entropy/obfuscated")
- question: >-
    After a reboot, do privileged boot processes (init, zygote on Android; launchd on iOS) exhibit short
    system-call / startup call sequences that deviate from the established 'self' baseline or produce
    low-probability transitions under a Markov model?
  context: >-
    An injected init script changes the behavior of privileged boot processes, so profiling their normal
    startup call sequences exposes Persistence that file hashing alone might miss (e.g., a legitimate
    binary launched with malicious arguments). Following 'A Sense of Self for Unix Processes', build a
    'self' baseline of normal short system-call/startup sequences for init, zygote, and launchd, and flag
    post-reboot root children whose sequences deviate. Model the transition probabilities of these startup
    sequences with a MaMaDroid-style Markov chain and alert on low-probability transitions introduced
    by an injected init script. A deviation or low-probability transition is a strong behavioral lead;
    sequences matching the baseline indicate normal boot.
  answer_sources:
  - Mobile device file system image
  - File system metadata from image
  - Internal known-good file hash database
  - Threat intelligence hash feeds
  - 'NAI: Digital Forensics and Incident Response (DFIR) workstation and secure evidence storage.'
  range: Event-centered on each post-reboot window; baseline over Last 90 days.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = self_profile(syscall_seq of {init,zygote,launchd}) // n-gram windows
      M = markov_transition_matrix(startup_call_sequences) from clean boots
      for child in post_reboot_root_children:
        if seq(child) not in baseline or min_transition_prob(seq, M) < threshold:
          alert("behavioral boot anomaly", child)
- question: >-
    Does the ordered sequence of Android init/logcat (or iOS unified-log) boot log keys contain an event
    outside the model's top-g predictions -- for example an unexpected setenforce 0, pm install, out-of-order
    service start, or a missing security-service start?
  context: >-
    Boot logs follow a highly regular ordered sequence, so an injected init script perturbs that order
    in detectable ways, revealing Persistence operations like disabling SELinux or installing packages
    at boot. Apply a DeepLog LSTM to the normal ordered sequence of init/logcat (Android) or unified-log
    (iOS) boot log keys, and flag a boot whose observed log key falls outside the model's top-g predictions
    -- an unexpected setenforce 0 / pm install, an out-of-order service start, or a missing security-service
    start -- as a low-probability sequence, with per-workflow diagnosis to localize the offending init
    step. A flagged deviation pinpoints where in the boot workflow tampering occurred; an in-distribution
    sequence indicates a normal boot.
  answer_sources:
  - Mobile device file system image
  - File system metadata from image
  - Internal known-good file hash database
  - Threat intelligence hash feeds
  - 'NAI: Digital Forensics and Incident Response (DFIR) workstation and secure evidence storage.'
  range: Event-centered on each boot; model trained over Last 90 days of clean boots.
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      keys = parse_boot_log_keys(init/logcat or unified_log)
      for i, k in enumerate(keys):
        pred = DeepLog_LSTM.topg(keys[:i])
        if k not in pred: alert("low-prob boot sequence", step=i, key=k,
              examples=[setenforce 0, pm install, out-of-order/missing service])
- question: >-
    When a modified or unknown boot script is found, does an explainable Random Forest classify it as
    malicious based on suspicious-command n-grams, encoded-string presence/length, and unusual (world-writable)
    permissions?
  context: >-
    Confirming whether a modified boot script is actually malicious lets the analyst prioritize reverse
    engineering of true Persistence implants. For any modified/unknown script, extract features -- n-gram
    frequency of suspicious commands (setenforce 0, pm install), presence/length of encoded strings (Base64/hex),
    and unusual permissions (world-writable) -- and classify with a Random Forest, mirroring the explainable
    static-feature approach of Drebin. At confidence > 0.90 prioritize for reverse engineering and surface
    the top-3 contributing features in the alert text. Train/validate against labeled corpora such as
    AndroZoo and monitor for concept drift. A high-confidence malicious verdict with feature explanations
    accelerates triage; a benign verdict still warrants the deterministic hash check as the floor.
  answer_sources:
  - Mobile device file system image
  - File system metadata from image
  - Internal known-good file hash database
  - Threat intelligence hash feeds
  - 'NAI: Digital Forensics and Incident Response (DFIR) workstation and secure evidence storage.'
  range: Point-in-time on each modified/unknown script.
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      feat = {ngram_freq([setenforce 0, pm install]),
              encoded_string_present, encoded_string_len,
              world_writable_perm}
      p = RandomForest.predict_proba(feat)
      if p_malicious > 0.90: alert("prioritize RE", top3_features(feat))
